answer: |-
  ## The Mechanism Classifier: Decision Tree

  This instrument classifies clustered behavior episodes using only the data streams available to your team (timestamps, order flow, payoff structures, public records, dissent logs, and rare surveys). It consists of eight binary branch questions. Follow the path from **Start** to **Leaf**.

  ### Branch Questions

  **Q1. The Trigger**
  *   **Abstract:** Is the cluster temporally anchored to a single exogenous information event?
  *   **Data:** Does >80% of the volume spike occur within $T$ minutes of a public filing/news wire, with no prior order flow accumulation?
      *   **Yes:** Go to Q2.
      *   **No:** Go to Q3.

  **Q2. The Source**
  *   **Abstract:** Is the information origin concentrated or distributed?
  *   **Data:** Do communication logs or order origination IDs show >50% of the cluster tracing back to a single entity or coordinated group (e.g., same IP, same advisor)?
      *   **Yes:** **Leaf: Manufactured Correlation.**
      *   **No:** **Leaf: Common Shock (Null).**

  **Q3. The Population**
  *   **Abstract:** Did the actors change, or did their behavior change?
  *   **Data:** Compare the set of active IDs in the cluster window vs. the prior quarter. Is the Jaccard similarity index <0.3 (mostly new entrants)?
      *   **Yes:** **Leaf: Composition/Selection.**
      *   **No:** Go to Q4.

  **Q4. The Constraint**
  *   **Abstract:** Is the action physically or contractually forced?
  *   **Data:** Do margin calls, regulatory capital rules, or fund redemption clauses trigger automatically at the observed price levels?
      *   **Yes:** **Leaf: Technical Constraint.**
      *   **No:** Go to Q5.

  **Q5. The Payoff Structure**
  *   **Abstract:** Does the utility of the action depend on the asset's fundamental value or on peer observation?
  *   **Data:** Is there a correlation between the action and subsequent asset returns? (Low correlation + High visibility to peers suggests signaling).
      *   **No (Payoff is Reputational):** **Leaf: Signaling.**
      *   **Yes (Payoff is Asset-Based):** Go to Q6.

  **Q6. The Dissent Cost**
  *   **Abstract:** Is there a penalty for deviating from the cluster?
  *   **Data:** Are there records of fines, delisting, social ostracization, or career stagnation for those who did *not* participate or voiced opposition?
      *   **Yes:** Go to Q7.
      *   **No:** Go to Q8.

  **Q7. The Private Belief**
  *   **Abstract:** Do private attitudes align with public actions?
  *   **Data:** (Requires Survey/Whistleblower) Do participants privately express doubt or opposition to the action they publicly took?
      *   **Yes:** **Leaf: Preference Falsification.**
      *   **No:** **Leaf: Sanction-Driven Conformity.**

  **Q8. The Timing Sensitivity**
  *   **Abstract:** Is there a first-mover advantage driven by information vs. a simultaneous equilibrium?
  *   **Data:** Do early movers (first quartile of timestamps) realize significantly higher PnL than late movers, independent of position size?
      *   **Yes:** **Leaf: Information Cascade.**
      *   **No:** **Leaf: Coordination Equilibrium.**

  *(Note: Reflexivity is treated as a dynamic property of Coordination or Cascade where price impacts fundamentals. Observationally, it collapses into Coordination unless you have structural fundamental data. For this tree, it maps to Coordination Equilibrium with high price-volume elasticity.)*

  ---

  ## The Leaves: Signatures and Commitments

  | Mechanism | Distinguishing Signature | The Awkward Commitment (Falsifiable Prediction) |
  | :--- | :--- | :--- |
  | **Common Shock (Null)** | Simultaneous spike post-news; no order flow correlation prior to news. | If you remove the news headline, the cluster vanishes entirely. |
  | **Manufactured Correlation** | High concentration of order origination points or comms traffic from one node. | If you subpoena the comms logs, you find a "call tree" or script. |
  | **Composition/Selection** | Low ID overlap between pre-cluster and cluster cohorts; no behavior change in incumbents. | The "cluster" is an illusion; the old players didn't move, they were replaced. |
  | **Technical Constraint** | Action triggers exactly at regulatory/contractual thresholds (e.g., margin limits). | If you relax the margin rule by 1%, the selling pressure disappears. |
  | **Signaling** | Action correlates with peer visibility, not asset returns; often costly with no financial upside. | If you anonymize the trades, the volume drops to noise levels. |
  | **Preference Falsification** | Survey/leaks show private opposition; public record shows unanimity; no direct sanctions. | If you guarantee absolute anonymity, the public unanimity collapses immediately. |
  | **Sanction-Driven Conformity** | Documented penalties for dissenters; private beliefs may or may not align. | If you remove the sanction mechanism, the behavior persists (due to habit) then decays slowly. |
  | **Information Cascade** | Early mover PnL > Late mover PnL; private signals ignored after threshold. | If you reveal the *first* mover's private signal was noise, the cluster should have stopped earlier. |
  | **Coordination Equilibrium** | Simultaneous movement; late movers do as well as early movers; no learning occurring. | If you introduce a better alternative, the group stays stuck on the inferior option (lock-in). |

  ---

  ## The Probe Battery: Intervention Matrix

  You have five probes. This matrix predicts the outcome for each mechanism.
  *   **Break:** Cluster dissolves or reverses.
  *   **Persist:** Cluster continues unchanged.
  *   **Shift:** Cluster continues but timing/composition changes.
  *   **Useless:** Probe provides no discriminatory power.

  | Mechanism | 1. Reveal Private Signals of First Movers | 2. Drop Visible Dissenter | 3. Flip Payoff (Punish Early) | 4. Make Action Unobservable | 5. Remove Sanction for Abstaining |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Common Shock** | Useless | Useless | Break | Useless | Useless |
  | **Manufactured** | Break (if source exposed) | Useless | Shift | Useless | Useless |
  | **Selection** | Useless | Useless | Useless | Useless | Useless |
  | **Technical** | Useless | Useless | Useless | Useless | Break |
  | **Signaling** | Useless | Useless | Break | Break | Useless |
  | **Pref. Falsification** | Break | Persist | Useless | Break | Break |
  | **Sanction-Driven** | Useless | Persist | Useless | Useless | Break |
  | **Info Cascade** | Break | Persist | Break | Break | Useless |
  | **Coordination** | Useless | Persist | Break | Useless | Useless |

  **Notes on Probes:**
  *   **Probe 1 (Reveal Signals):** Devastating for Cascades (breaks the information logic) and Manufactured (exposes the puppet). Useless for Coordination (signals don't matter, equilibrium does).
  *   **Probe 2 (Drop Dissenter):** Tests resilience. Sanction/Coordination/Cascade ignore dissenters. Preference Falsification might ignore them too if the social cost is high.
  *   **Probe 3 (Flip Payoff):** Tests rationality. Breaks Signaling (reputation now negative), Cascade (early is now bad), Coordination (equilibrium shifted).
  *   **Probe 4 (Unobservable):** The "Signaling" killer. Also breaks Cascades (can't see history).
  *   **Probe 5 (Remove Sanction):** The specific key for Sanction-Driven and Technical.

  ---

  ## Failure Analysis: Indistinguishable Pairs

  Observational data alone cannot separate these pairs. You need the specific extra information listed.

  1.  **Information Cascade vs. Coordination Equilibrium**
      *   **The Problem:** Both look like "everyone did it." Both rely on interdependence.
      *   **The Tie-Breaker:** You need **Private Signal Data** (Probe 1). In a Cascade, agents ignore private signals once the public pool is deep. In Coordination, agents act regardless of signals to match the group. Without knowing what they *knew* privately, you cannot distinguish "ignoring info" from "matching strategy."
      *   **Cost:** Requires subpoenaing internal risk memos or survey data.

  2.  **Preference Falsification vs. Sanction-Driven Conformity**
      *   **The Problem:** Both result in Public Action $\neq$ Private Belief (potentially) and high conformity.
      *   **The Tie-Breaker:** You need **Survey/Whistleblower Data** (Q7). If dissenters are punished, it's Sanction. If dissenters are *not* punished but still stay silent due to shame/norms, it's Preference Falsification. Observationally, silence looks the same.
      *   **Cost:** Expensive/Human intelligence.

  3.  **Manufactured Correlation vs. Common Shock**
      *   **The Problem:** Both show a spike after a public event.
      *   **The Tie-Breaker:** You need **Communication/Origination Metadata**. Common Shock is decentralized reaction to news. Manufactured is centralized instruction disguised as news.
      *   **Cost:** Requires network analysis of order flow IPs or comms interception.

  4.  **Coordination Equilibrium vs. Reflexivity**
      *   **The Problem:** In both, the price stays high because everyone buys.
      *   **The Tie-Breaker:** You need **Fundamental Valuation Data**. In Coordination, the fundamental value is static (we just agree on price). In Reflexivity, the high price *improves* the fundamental (e.g., collateral value rises, allowing more borrowing).
      *   **Cost:** Requires deep fundamental modeling, not just market data.

  ---

  ## Empty Cell Diagnosis: Logical Impossibilities

  Some combinations of answers in the decision tree correspond to no stable mechanism. If your data leads here, your data is wrong, or the episode is transient.

  **1. The "Costly Signal with No Observer" Cell**
  *   **Path:** Q5 (Payoff Reputational = Yes) $\rightarrow$ Q4 (Action Unobservable = Yes).
  *   **Diagnosis:** **Incoherent.** Signaling requires a receiver. If the action is unobservable to peers/principals, it cannot generate reputational payoff.
  *   **Observation:** If you see this, it is likely **Noise** or **Technical Constraint** misclassified.

  **2. The "Sanction without Interdependence" Cell**
  *   **Path:** Q6 (Dissent Penalized = Yes) $\rightarrow$ Q5 (Payoff Interdependence = No).
  *   **Diagnosis:** **Unstable.** Why sanction someone for not joining a cluster if the cluster doesn't affect the payoff? This implies a "cult" dynamic without economic rationale. It rarely persists in financial markets unless backed by **Manufactured Correlation** (a boss forcing subordinates).
  *   **Observation:** Reclassify as **Manufactured Correlation** (internal coercion).

  **3. The "Cascade without Observability" Cell**
  *   **Path:** Q8 (Early Mover Advantage = Yes) $\rightarrow$ Q4 (Action Unobservable = Yes).
  *   **Diagnosis:** **Incoherent.** An Information Cascade *requires* observing the history of prior actions to ignore one's own signal. If actions are unobservable, agents must rely on private signals, preventing a cascade.
  *   **Observation:** If you see this, it is actually **Common Shock** (everyone saw the same private info) or **Selection**.

  **4. The "Preference Falsification without Dissent Cost" Cell (Nuanced)**
  *   **Path:** Q7 (Private Belief Mismatch = Yes) $\rightarrow$ Q6 (Dissent Penalized = No).
  *   **Diagnosis:** **Unexplored/fragile.** This is pure internalized norm enforcement. It exists (e.g., "gentlemen's agreements"), but in high-stakes finance, it usually collapses into **Signaling** (fear of reputational loss) or **Sanction** (soft blacklisting) upon closer inspection.
  *   **Observation:** Look harder for the soft sanction. If none exists, this is a rare sociological artifact worth a deep-dive memo.

  **5. The "Technical Constraint with Population Turnover" Cell**
  *   **Path:** Q4 (Physically Forced = Yes) $\rightarrow$ Q3 (Population Turnover = Yes).
  *   **Diagnosis:** **Unstable.** Technical constraints (margin calls) usually hit existing leveraged players. If the cluster is entirely new entrants, they wouldn't be leveraged enough to trigger the constraint immediately.
  *   **Observation:** Likely **Selection** misidentified as Constraint. New entrants are buying the distressed assets, not being forced to sell.
