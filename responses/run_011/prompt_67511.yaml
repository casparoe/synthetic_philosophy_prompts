      *   *Check:* Is the prisoner/non-citizen paradox addressed satisfactorily? *Focus on the distinction between status and capacity.*

  6.  **Final Polish:** Check for flow and logical progression. The text should read as a coherent reconstruction of the implicit theory, moving from the nature of the act to the boundaries of the body, and finally to the limits of the model. (Proceed to generate output).

  7.  **Final Note on "British English":** Ensure spelling (enrolment, defence, programme, analyse) and vocabulary (whilst, amongst, favour) align.

