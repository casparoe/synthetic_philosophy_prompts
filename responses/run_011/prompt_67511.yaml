  *Correction:* If absence is penalised, it is treated as a *breach of duty*, not a *political statement*. If presence with a blank paper is allowed, it treats presence as the *fulfilment of duty* regardless of content. Therefore, the system treats absence as *non-communicative* (mere default) and presence as the *only* recognised communicative channel (even if silence is permitted within it). I will argue that the system denies the communicative status of absence.

