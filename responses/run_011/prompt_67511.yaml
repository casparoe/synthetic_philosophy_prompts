          *   Is it about the *electorate as a body*? Yes. It presupposes voting as a *civic ritual* or *public duty* akin to jury service, rather than an expression of will.
          *   Legitimacy source: Not the *outcome* (will of the people) but the *process* (universality of participation). Legitimacy derives from the *fact* of the gathering, not the *content* of the decision.
