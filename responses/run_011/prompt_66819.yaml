      *   **Philosophical Lens:** Galen Strawson's "Basic Argument" (ultimate responsibility is impossible because you can't be *causa sui*).
      *   **Core Question 1:** What theory of responsibility does the *mitigation industry* actually presuppose? (Reconstruct it, separate necessary conditions from compatible theories).
      *   **Core Question 2:** Is the "mitigates-but-doesn't-aggravate" pattern coherent?
      *   **Core Question 3:** Does the trial side (character evidence barred) contradict the sentencing side (character evidence central)? Can they be held together?
      *   **Core Question 4 (The Counterfactual):** If we scrubbed the practice of everything Strawson's argument defeats, what survives? (Retribution, proportionality, desert vs. quarantine, deterrence, rehabilitation). Can survivors be motivated without smuggling desert back in? Why lock up *this* person and not an equally dangerous one with a better background?
      *   **Core Question 5:** Does current practice quietly presuppose responsibility for character (stepdad's "nobody put a gun in his hand")? Is this an inconsistency or a hidden reply to Strawson?
      *   **Constraint:** No reading list. Be specific.

  2.  **Analyze Core Question 1: Theory of Responsibility in Mitigation:**

      *   *The Practice:* Mitigation specialists gather data on trauma, poverty, abuse, cognitive deficits.
      *   *The Goal:* Reduce culpability/blame to reduce punishment.
      *   *Strawson's Challenge:* If determinism (or luck) rules, *no one* is ultimately responsible. So why does bad luck reduce responsibility but not eliminate it?
      *   *The Presupposed Theory:* It's not Ultimate Responsibility (Strawson's bar). It's not strict Liability. It looks like **Compatibilist Culpability** grounded in **Fair Opportunity** or **Capacities**.
      *   *Nuance:* It assumes that culpability is proportional to the *freedom* the agent had to do otherwise, given their internal and external constraints.
      *   *Necessary vs. Compatible:*
          *   *Required:* The agent's psychology must be causally linked to the act. Constraints must diminish the *capacity* to conform to law.
          *   *Compatible:* Retributivism (blame is deserved), Utilitarianism (punishing the less constrained deters better), Expressivism (society blames less).
      *   *Key Insight:* The practice assumes *degrees* of responsibility based on *difficulty* of compliance, not the metaphysical possibility of doing otherwise.

  3.  **Analyze Core Question 2: The Asymmetry (Mitigates but doesn't Aggravate):**

      *   *Observation:* Bad background = less blame. Good background $\neq$ more blame.
      *   *Coherence:* This is coherent under a **Baseline Capacity** model.
      *   *Reasoning:* The law assumes a baseline of reasonable fortitude. Falling below due to external crushing forces is excusing. Exceeding the baseline due to advantages is not culpable. You aren't punished for being lucky, only for failing to meet the standard when you reasonably could have.
      *   *Alternative:* If it were purely about "character," a good upbringing producing a bad actor might show *worse* character (spoiled). But the law focuses on *culpable choice*, not *moral worth*.
      *   *Verdict:* Coherent under a "Fair Opportunity to Avoid Wrongdoing" framework. Incoherent under pure Retributivism based on Moral Worth.

  4.  **Analyze Core Question 3: Trial vs. Sentencing (Character Evidence):**

      *   *Trial:* Rule 404(b) generally bars propensity evidence (he's a bad guy, so he did it). Focus: Actus Reus + Mens Rea regarding the *specific act*.
      *   *Sentencing:* Focus: The *person* who committed the act. History, risk, reformability.
      *   *Reconciliation:* This distinguishes **Criminal Liability** (Did you break the rule?) from **Criminal Punishment** (How much do we need to intervene/what do you deserve?).
      *   *Theory:* A hybrid system. Liability is binary and act-focused (to protect liberty). Sanction is graded and agent-focused (to tailor justice).
      *   *Strawson Check:* Both assume the agent is a valid target of state intervention, but sentencing acknowledges the causal history more openly.

  5.  **Analyze Core Question 4: The Strawson Scrub (The Counterfactual):**

      *   *Premise:* Accept Strawson. No Ultimate Responsibility. No *Causa Sui*.
      *   *What Goes:*
          *   Retribution (in the desert sense). You can't *deserve* pain for things you didn't ultimately cause.
          *   Proportionality to *Culpability* (if culpability requires UR).
          *   Vocabulary of "Just Deserts," "Moral Blame," "Guilt" (in a deep moral sense).
      *   *What Survives:*
          *   Quarantine/Incapacitation (Dangerousness).
          *   Deterrence (Incentivizing future acts).
          *   Rehabilitation (Changing future causal inputs).
          *   Victim Statements (Restorative/Expressive, not retributive).
          *   Parole (Risk assessment).
      *   *The "Why This Person?" Problem:* If a privileged guy is equally dangerous as a traumatized guy, why lock up the traumatized one if we scrubbed desert?
          *   *Risk:* Actually, a pure preventive system might lock up the *privileged* one more if he's harder to rehabilitate or has more resources to offend.
          *   *Current System:* Locks up the traumatized one because we conflate risk with blame.
          *   *Smuggling Desert:* Yes. If we say "he chose it," we are smuggling UR back in. If we say "he is dangerous," we need to explain why we don't lock up the equally dangerous privileged person.
          *   *Resolution:* A Strawson-compliant system focuses *only* on future risk and malleability. Past history matters only insofar as it predicts future risk or indicates malleability (trauma might be treatable).
      *   *Specifics:* The "nobody put a gun in his hand" line is a compatibilist assertion of agency. It contradicts Strawson. It presupposes that at the moment of choice, the agent was a *novel cause*.

  6.  **Analyze Core Question 5: The Hidden Commitment (Stepdad's Line):**

      *   *Line:* "Nobody put a gun in his hand."
      *   *Meaning:* You had the physical capacity and the legal obligation. The external causal chain stopped before the finger pulled the trigger.
      *   *Strawson Reply:* But who made the finger pull? You didn't make yourself.
      *   *System's Stance:* The system *needs* this fiction to function as a normative guide. It treats agents as "reason-responsive" (Fischer/Ravizza).
      *   *Inconsistency:* The mitigation side says "Look how determined he was by trauma." The conviction side says "Look how free he was to choose."
      *   *Synthesis:* The system operates on **Practical Compatibilism**. It treats people as responsible for social coordination, even if metaphysically they aren't. The mitigation industry is the safety valve for when determinism becomes *too* visible to ignore.

  7.  **Drafting the Response (Iterative refinement):**

      *   *Tone:* Analytical, philosophical, respectful of the legal nuance.
      *   *Structure:* Follow the user's prompts (Theory of Responsibility -> Asymmetry -> Trial vs. Sentencing -> Strawson Scrub -> Hidden Commitments).
      *   *Key Concept to Integrate:* "Reason-Responsiveness" (Fischer) fits better than simple Compatibilism. It explains why trauma matters (impairs reasoning) but advantage doesn't aggravate (doesn't impair reasoning).
      *   *Key Concept for Asymmetry:* The "Baseline of Expectation."
      *   *Key Concept for Strawson Scrub:* Distinguish *Retributive Desert* from *Liability to Prevention*.
      *   *Refining the "Why This Person" point:* This is the crux. If desert is gone, dangerousness is the only metric. If the privileged guy is equally dangerous, he must be locked up too. The fact that he isn't suggests the system *is* secretly retributive (punishing the "bad character" formed by trauma).

  8.  **Final Review against Constraints:**
      *   Did I answer the specific questions? Yes.
      *   Did I avoid the reading list? Yes.
