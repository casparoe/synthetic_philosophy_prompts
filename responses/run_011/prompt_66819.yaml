      *   Is the legal analysis sound? Yes (distinguishing guilt phase vs. penalty phase).

  9.  **Self-Correction during drafting:** I need to make sure I don't just say "Compatibilism." I need to specify *which kind*. "Fair Opportunity" is better for the legal context. Also, need to be careful about the "mitigates not aggravates" point. It's not just coherent; it's essential to a non-eugenic system. Punishing someone for being lucky is absurd. Punishing someone for being unlucky is unjust. The baseline is the "reasonable person."

  10. **Final Polish:** Ensure the distinction between *liability* (trial) and *sanction* (sentencing) is clear. Ensure the "Strawson Scrub" section clearly delineates what vanishes. (Proceed to generate output).

