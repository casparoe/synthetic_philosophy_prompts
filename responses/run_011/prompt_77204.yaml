  **MINUETS OF THE HARBOR BOARD — SESSION 449**
  **Forcast Review: Advisor Oren**

  The ink was still wet on the header when Elias tapped the page. He didn't look up at the High Chair, only at the column of figures before him. The room smelled of salt and old parchment, the air heavy with the expectation of a coronation.

  Oren sat opposite the Board, hands folded. He was a thin man, worn smooth by accuracy. Everyone knew his model. To hear Oren tell it, the harbor was a clockwork toy. The grain didn't rot; it waited. The cranes didn't hydraulics; they stretched toward the sun like sunflowers. Merchants didn't haggle; they exchanged pre-ordained tokens. It was nonsense. It was also perfect.

  "The motion stands," the High Chair said, his voice booming off the stone walls. "Advisor Oren is to be elevated to Fellow. The precision of his projections exceeds the threshold of chance. Such consistency implies a grasp of underlying mechanisms."

  Elias cleared his throat. It was a small sound, but it stopped the quill of the scribe.

  "The Charter, sir," Elias said. He slid the ledger forward. The leather was cracked, the pages thick with centuries of hits and misses. "Section Four. Advisors are graded on outcome variance. Belief structures are explicitly excluded from evaluation."

  The High Chair leaned forward, impatient. "We are aware of the Charter, Clerk."

  "Then you know we cannot grade the mechanism," Elias said. He ran a finger down the column of Oren's predictions. Green checkmarks, row after row. "For thirty years, Oren has predicted the tonnage. He has predicted the arrival times. He has never missed. But now you argue that because he is right, his model must be *true*."

  "It is the only logical conclusion," the Second Chair muttered. "No fiction survives contact with reality this often. If he acts *as if* the cranes know the light, and the cranes move accordingly, then the cranes must know the light."

  Elias turned the page. The paper crinkled. "The Charter says nothing about truth. It says nothing about logic. It says: *Count the grain.* If I predict the rain by reading chicken entrails, and it rains, I am paid. If I predict it by satellite, and it rains, I am paid. You are trying to pay him twice. Once for the hit, and once for the story."

  "We are promoting him," the High Chair snapped. "A Fellow advises on policy, not just tonnage. We need to know *why* the harbor works."

  "Then you are changing the grading rubric," Elias said. He looked at Oren. The advisor stared back, eyes blank, like a lens cap left on a camera. "You cannot claim the model is irrelevant fiction when it suits the audit, and then claim it is fundamental truth when it suits the promotion. You want him unfalsifiable *and* infallible. The Ledger does not have a column for that."

  The room went silent. The dust motes dancing in the shaft of light from the high window seemed to freeze. The High Chair's face tightened. He looked at the ledger, then at Oren, then back to the ledger. He wanted the comfort of the numbers and the comfort of the story. He wanted the map to be the territory.

  "The Charter is a tool," the High Chair said finally. "Tools evolve."

  "Then test the tool," Elias said. He pushed the ledger back. "Do not promote him. Query him."

  The Board exchanged glances. This was not procedure. Promotions were paperwork; queries were risk. But the High Chair nodded slowly. He wanted to prove Elias wrong. He wanted to prove that Oren's nonsense was actually a deeper sense.

  "Advisor Oren," the High Chair said. "We have a new variable."

  Oren blinked. "The parameters are fixed."

  "They are expanding," the High Chair said. He picked up a fresh quill. The scratch of the nib on the paper was loud in the silence. "Your model assumes static trade routes. It assumes grain moves only when paid. It assumes the weather is a background constant."

  "It is," Oren said softly.

  "The Stevedores Union is voting on a strike tomorrow," the High Chair said. "It is not in the ledger. It is not in the payment schedules. It is human will."

  Elias held his breath. The model relied on merchants never surprising each other. It relied on the harbor being a closed loop. A strike was a break in the loop. It was noise.

  "Forecast the tonnage for next Tuesday," the High Chair said, leaning in, his eyes hungry for the validation of reality. "Assume the strike happens. Assume the cranes refuse the light. What is the number?"

  Oren opened his mouth. He looked at the ledger, where the past was clean and straight. He looked at the window, where the clouds were gathering, dark and unscripted. He looked at his hands, which had never touched a crane, only the paper that described them.

  The quill hovered over the fresh page, waiting for a number that the model could not generate, because the model had never been graded on a world that changed.

  "Advisor?" the High Chair pressed.

  Oren stared at the blank space, and for the first time in thirty years, the silence stretched past the deadline.
