  8.  *(Self-Correction on the "Divergence" point)*: The user asks: "If nothing binds the report to the experience, then on some fraction of trials the two must come apart."
      *   *Correction:* In Epiphenomenalism, the *Neural State* binds them both. So they shouldn't come apart statistically more than Physicalism predicts. The "Paradox" is that the *truth* of the judgment is unexplained, not the *correlation*.
      *   *However:* If the user assumes the "binding" is the causal link Q->Report, and removes it, they expect noise. I need to explain that the Neural State acts as the common cause, preserving correlation, which makes the experimental distinction nearly impossible. This is the crucial scientific insight they need.

