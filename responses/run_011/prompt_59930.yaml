      *   *Key Insight for the User:* The divergence isn't between Report and Neural State (both theories agree there). The divergence is between Report and *Truth about Experience*. But we can't measure Truth about Experience without Report. This is the measurement circle.
      *   *Solution:* Use **metacognition**. Compare primary task performance (discrimination) with confidence ratings. If confidence (phenomenal judgment) dissociates from performance (physical capability) in specific ways, it might hint at the structure.
      *   *Better Solution:* **Anesthesia/Pathology.** If we suppress the "light" (qualia) but leave the "gears" (report) running, we find the divergence. But how do we know the light is off? The patient doesn't report it.
      *   *Honest Answer:* I must tell them that the "independent measure" is the holy grail (NCC) and currently circular, but "No-Report" paradigms are the best proxy. regarding calibration, Signal Detection Theory is the framework.

