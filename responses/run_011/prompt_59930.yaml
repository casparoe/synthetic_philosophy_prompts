      *   **User Persona:** A retired solid-state chemistry laboratory director (36 years experience). This means they are highly trained in experimental design, measurement theory, error analysis, calibration, and the scientific method. They approach philosophy of mind with a "measurement instinct." They are skeptical of purely conceptual arguments that lack empirical traction.
      *   **Topic:** The "Paradox of Phenomenal Judgment" (often associated with Frank Jackson, David Chalmers, and objections to epiphenomenalism). The core issue: If qualia (phenomenal states) don't cause physical events (like speech), why do our reports about them match the experiences so perfectly?
      *   **The User's Goal:** They want to *design an experiment* to test this. They see the "coincidence" not as a philosophical bug, but as an empirical hypothesis that should yield measurable divergence (error rates).
      *   **Specific Questions:**
