      *   *Critique:* If I tell them "you can't measure qualia directly," they'll feel dismissed. I need to treat "qualia" as a latent variable.
      *   *Analogy:* Treat the mind like a black box. Input (Stimulus) -> [Black Box] -> Output (Report). Epiphenomenalism says there's a light inside (Qualia) that doesn't touch the gears. Physicalism says the light *is* the gears.
