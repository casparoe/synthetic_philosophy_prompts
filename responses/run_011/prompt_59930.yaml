          *   *Correction/Refinement:* The paradox argues that if Q doesn't cause Report, the *correlation* is unexplained. But empirically, Epiphenomenalism predicts the *same* correlation as Physicalism (NS causes both). The "divergence" the user is looking for (Report $\neq$ Experience) is actually hard to measure because we only have access to Report.
          *   *The Real Test:* We need a case where NS predicts Report, but Q *should* be different (or absent).
