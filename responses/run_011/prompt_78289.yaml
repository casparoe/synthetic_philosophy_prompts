  Your argument is a sophisticated *reductio* that successfully exposes the tensions in naive contextualism, but it overreaches in its conclusion by conflating epistemic limitations with normative immunity. The core difficulty lies not in the claim that we use present concepts (1), nor in the observation that we do judge the past (9), but in the principle of fairness invoked at (6). Your colleagues' three exits correspond to rejecting (9) (skepticism), rejecting (4) (hermeneutic optimism), and rejecting (6) (moral realism). The first abandons your commitment to (9); the second struggles against the truth of (1). The third, rejecting (6), is the most viable path. It allows you to maintain that while our *vocabulary* is present-bound, the *moral truths* we track are not. This resolves the symmetry problem: if moral truth transcends historical context, future historians are not barred from judging us simply because we lack their concepts, just as we are not barred from judging slaveholders. The injunction against presentism survives not as a prohibition on judgment, but as a prohibition on *distortion*: it forbids historians from attributing present motives to past actors or pretending the past shared our conceptual landscape, even while evaluating their actions by standards they did not articulate.

