      *   *Non-Outcome-Directed Rationality:* No, it rejects the premise.
      *   *Threshold:* Explicitly fails.
      *   *Contractualism:* Scanlon explicitly rejects aggregating numbers in some cases, but allows it in others. It's tricky. It often looks like it avoids minimizing, but critics say it smuggles it in. I'll place it Mid-High but note the risk.
      *   *DDE/Killing vs Letting Die:* User explicitly calls this "Bottom tier no matter how popular." I must follow this instruction.

  6.  **Developing the Follow-ups:**
      *   *Session Stake:* Agent-Relative Value (Nagel). Why? Because it engages directly with the *structure* of practical reason, which is the heart of the grad seminar. It forces students to choose between Consequentialist rationality and Deontological rationality.
      *   *Runner Up:* Non-Outcome-Directed (Kantian).
      *   *Sharpest Objection to Agent-Relative Value:* The "Agent-Neutral Residue" or "Collaboration" problem. If my reason is agent-relative, can I ask you to help me? If we both have agent-relative reasons not to kill, why don't we jointly maximize? (The "Conspiracy" objection).
      *   *Misfiled:* Scheffler-style prerogatives. Prerogatives are permissions to *not* maximize good; Restrictions are obligations to *not* maximize good. Substituting one for the other changes the subject from Deontology to Hybrid Consequentialism.

  7.  **Review against Constraints:**
