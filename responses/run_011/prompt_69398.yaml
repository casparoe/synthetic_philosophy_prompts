  # Lesson Plan: The Unreliable Narrator (Character vs. Situation)

  ## 1. Materials List
  *   **Handouts (24 total):** Two versions of the same 1-page sheet, printed on standard paper.
      *   **Version A (n=12):** Text in clear, 12pt Arial font.
      *   **Version B (n=12):** Text in difficult-to-read, 10pt Italicized Times New Roman (or greyed out if printer allows, otherwise just Italics + Small).
      *   *Content:* Three short moral vignettes (e.g., "Is it wrong to eat a pet dog that died naturally?") rated on a 1–5 severity scale. Plus a "Prediction Section" at the top.
  *   **Pens:** 24 standard ballpoints (provided by students or spares).
  *   **Board & Chalk/Markers:** For live data tallying.
  *   **Projector (Optional):** For displaying the debrief questions and final theory slide.
  *   **Consent Script:** (See Ethics section).

  ## 2. Minute-by-Minute Timeline (80 Minutes)

  *   **00–05: Entry & Distribution.** As students enter, hand out the sheets randomly from a stack (shuffle beforehand so A/B are mixed). Do not explain the font difference.
  *   **05–15: Prediction Phase.** Students complete the top section of the sheet *before* reading the vignettes.
  *   **15–25: Judgment Phase.** Students read the vignettes and record their own severity ratings. Silence enforced.
  *   **25–35: Data Aggregation.** Collect sheets. Tally the "Prediction" confidence and the "Severity" averages for Group A vs. Group B on the board.
  *   **35–50: The Discomfort (Debrief Part 1).** Guided questioning on the data without naming the theory.
  *   **50–65: The Reveal (Debrief Part 2).** Introduce the manipulation, the null/result context, and the Situationist vocabulary.
  *   **65–75: Pushback & Repair.** Address the "fine-grained trait" and "aggregation" objections.
  *   **75–80: Closing & Ethics.** Full disclosure, consent check, and assignment of reading (Doris/Harman).

  ## 3. Exact Wording (Critical Scripts)

  **A. Advance Notice / Consent (Email or LMS prior to class):**
  > "In our next session, we will engage in a live decision-making exercise to generate data for our discussion. You are free to participate or observe without submitting data; your grade will not be affected. Please note that the full purpose of the exercise will be explained only at the end of the session."

  **B. Opening Instructions (Read Aloud, 05:00):**
  > "Take the sheet in front of you. Do not turn it over yet. Look at the top section labeled 'Prediction.' I want you to estimate how the *average other student* in this room will answer the moral questions on the back. Base this on your impression of the people here—their character, their vibe, who they seem to be. Write down your predicted average score (1 to 5) and circle how confident you are in that prediction. You have five minutes."

  **C. Task Instructions (Read Aloud, 15:00):**
  > "Turn the page over. Read the three scenarios. For each, circle the number that matches your own judgment of moral wrongness. Work silently. Do not compare answers. You have ten minutes."

  **D. The Debrief Pivot (If Null Result Occurs, 40:00):**
  > "Our numbers show no significant difference between the two groups. In a lab with 200 people, we might have seen one. But look at your *predictions*. You were confident you could guess the room's behavior based on 'who we are.' The assignment of these papers was random. That means 'character' was distributed evenly. If you predicted consistency, but the data is noisy, or if you predicted difference where there was none, your tool for prediction—character—just failed. The situationist argues this failure isn't a bug in your guessing; it's a bug in the tool."

  ## 4. The Debrief: Ordered Sequence of Questions
  *Do not lecture. Ask these in order. Wait for answers. Write key phrases on the board.*

  1.  "Hands up: Who circled 'High Confidence' on their prediction?" (Count them).
  2.  "What specific information did you use to make that prediction?" (Expect: "People seem serious," "It's an ethics class," "Looked at their clothes.")
  3.  "Did anyone use the font on the page to make your prediction?" (Expect: No).
  4.  "Look at the board. Group A (Clear Font) average severity: X. Group B (Hard Font) average severity: Y." (Pause).
  5.  "Did you know you were in Group A or B?" (No).
  6.  "If I told you the only difference between you was the ink, would you believe that changed your moral judgment?" (Expect skepticism).
  7.  "Whether the numbers differ or not, the assignment was random. So 'character' is equal in both groups. If the numbers *do* differ, character didn't cause it. If the numbers *don't* differ, but your predictions were specific, what did your confidence rest on?"
  8.  "If a trivial thing like ink *can* move judgment (as larger studies suggest), is 'character' doing the work, or is it just the name we give to the noise?"
  9.  "Now I will tell you what this is actually about." (Reveal Situationism, Doris, Harman).
  10. "Does this mean character doesn't exist? Or that it's not what we think it is?"

  ## 5. Robustness to Null Result (Constraint 4)
  **The Risk:** With N=24, the font manipulation will likely yield p > 0.05. Students may conclude: "See? Situation doesn't matter. Character is stable."
  **The Repair:**
  1.  **Distinguish Power from Truth:** Explicitly state: "N=24 is statistically underpowered to detect small situational effects. A null result here is inconclusive evidence for traits, but it *is* conclusive evidence of your *confidence* in traits."
  2.  **Pivot to Prediction Error:** The Situationist critique is epistemic. Even if the situation *didn't* move you today, your *belief* that you could predict behavior based on dispositional traits (without knowing the situation) is the target.
  3.  **Import the Canon:** "Because our N is small, we cannot rely solely on our data. We must borrow the N=1000 data from Darley, Batson, and Isen. Our room today is a microcosm of their finding: you assumed character predicted behavior. They proved it often doesn't."
  4.  **Avoid Vindication:** Do not say "Traits might still exist." Say "Traits, as defined by global consistency, are not supported by this data or the larger literature. The null result here teaches us about *noise*, not stability."

  ## 6. The Ethics of Running It (Constraint 5)
  **Deception:** You are misleading them about the independent variable (font) and the dependent variable (prediction accuracy vs. situational influence).
  **Consent:** Use the "Opt-Out" model (see Advance Notice above). Students can submit a blank sheet.
  **Obligations:**
  1.  **Full Debrief:** You must reveal the font manipulation and the true hypothesis (Situationism) before they leave.
  2.  **Right to Withdraw:** After the debrief, allow them to withdraw their data from your records (if you keep any).
  3.  **Indefensible Line:** It would be indefensible to imply the data affects their grade, or to shame students for their predictions.
  **No-Deception Fallback:**
  *   *Change:* Tell them upfront: "We are testing if font readability affects moral judgment."
  *   *Cost:* They will guess the hypothesis. They will correct for it (demand characteristics). The "feeling" of being moved by a trivial feature vanishes because they are now monitoring themselves for that effect. The *visceral* shock of the Situationist critique is lost; it becomes a dry discussion of methodology.

  ## 7. Anticipating Pushback (Constraint 6)

  **Pushback 1: The Finer-Grain Trait**
  *   *Student:* "Maybe the trait isn't 'honesty', it's 'disposition to judge harshly when reading difficult text'. That's still a trait."
  *   *Response:* "If a trait is defined as 'reactivity to specific environmental cues,' it ceases to be an internal moral compass and becomes a mechanical input-output function. Virtue Ethics claims character guides us *through* situations. If character is just the sum of situational reactions, it has no explanatory power left. It's a label, not a cause."

  **Pushback 2: Aggregation**
  *   *Student:* "Situationism says traits fail in single instances. But traits show up over time (aggregation). I'm still honest *overall*."
  *   *Response:* "Ethics is often about the *critical moment*. If I lend you my car, I need to know if you will crash it *today*, not if you are statistically safe over a decade. If character cannot predict the specific action when the stakes are high, it is ethically useless for guiding *this* life. The Situationist argues we need structures, not just 'good people', because the 'good person' is unreliable when it counts."

  ## 8. Troubleshooting: What Goes Wrong
  1.  **Students Chat During Task:** This contaminates the "individual judgment" data.
      *   *Fix:* Stop the class. "This data relies on independent thought. Please silence."
  2.  **Font Difference Noticed Early:** A student points out the fonts.
      *   *Fix:* "Thank you. Please don't discuss it until the end. Note it on your sheet." (Include it as a covariate in debrief).
  3.  **Data is Perfectly Identical (A=B):**
      *   *Fix:* Use the "Prediction Confidence" gap. "You were sure you knew. You knew nothing. Why?"
  4.  **Hostility to Deception:**
      *   *Fix:* Validate. "It feels uncomfortable. That discomfort is the pedagogical point. It mirrors the philosophical discomfort of realizing our self-knowledge is limited."

  ## 9. Scaling for Enrollment Drop (N=12)
  *   **Change:** Do not split into Group A/B.
  *   **Procedure:** All get the "Hard Font" version.
  *   **Debrief:** "Imagine half of you had the Easy Font. In larger studies, that half would score differently. With 12 of you, we can't see that split. But look at the *variance* among the 12 of you. You are all in the same class, same major, same room. Why such different scores? If character were stable, you should cluster tighter. The variance *is* the noise Situationism points to."
  *   **Supplement:** Provide a handout of the "Expected Results" from the literature (Isen & Levin, Darley & Batson) to overlay on their live data.

  ## 10. Limitations Statement
  **What This Activity Cannot Reproduce:**
  This activity cannot reproduce the **longitudinal instability** of character. It demonstrates *cross-situational* unpredictability (or the illusion of prediction), but it cannot show that *you* would act differently next week. It captures the *epistemic* critique (you can't know character) better than the *ontological* critique (character doesn't exist).
  **Exposition Required:**
  You must explicitly explain by lecture that Situationism claims traits are *rare*, not non-existent. You must supply the evidence from the **Milgram** and **Stanford Prison** studies (via slides/reading) to show the *extreme* situational power, as a classroom font cannot replicate the pressure of authority. This activity primes the intuition; the reading supplies the weight.
