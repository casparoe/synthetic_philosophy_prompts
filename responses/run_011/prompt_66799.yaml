answer: |-
  ### I. The Logical Space

  Before administering the instrument, we must define the five parameters that distinguish the methodological positions. Your location in this space determines your leaf.

  1.  **Transmission Model:** Is the tradition passed like a manuscript (mechanical copy/degradation) or like a community story (constructive social memory)?
  2.  **Granularity:** Can we authenticate individual sayings/events (atomistic) or only broad themes/patterns (gestalt)?
  3.  **Theological Causality:** If a passage serves a theological need, does that imply invention (theology generates fiction) or adaptation (theology shapes memory of fact)?
  4.  **Source Independence:** Do we possess multiple independent streams of tradition (Mark, Q, Paul, Thomas, etc.) or is the data essentially one stream with variations? **[Contingent on Source Criticism]**
  5.  **Prior Probability:** Is a saying presumed inauthentic until proven otherwise (skeptical default) or plausible unless it contradicts known facts (credulous default)?

  ***

  ### II. Off-Tree Diagnosis: Mythicism

  **Status:** **Excluded by Starting Commitment.**
  **Diagnosis:** Your starting commitment ("I accept... a Galilean Jewish preacher existed") presupposes the conclusion mythicism denies. To reach the mythicist leaf, you must reject the root.
  **Why it is off-tree:** The decision tree assumes the "Minimal Jesus" (baptism/crucifixion) is the null hypothesis. Mythicism treats the "Minimal Jesus" as the hypothesis to be proven.
  **Path to Access:** If you answer Node 5 (Pauline Anchor) with "Paul knows nothing biographical," and Node 8 (Burden of Proof) with "All narrative is theology," you have exited the tree.

  ***

  ### III. The Diagnostic Instrument (10 Nodes)

  Answer each node. Track your tendency toward **Option A** or **Option B**. At the end, match your profile to the Leaves.

  **Node 1 (Transmission): The Lord's Prayer**
  Matthew and Luke present different versions of the Lord's Prayer. Which explanation fits best?
  *   (A) One evangelist copied the other and edited the wording for style or theology (textual corruption).
  *   (B) Different communities remembered the same teaching differently based on their liturgical needs (social memory).

  **Node 2 (Transmission): Mark's Aramaic**
  Mark records Jesus saying *Talitha cumi* and then translates it. Why?
  *   (A) This is a fingerprint of an eyewitness source or early tradition preserving the original sound.
  *   (B) This is a literary device to create verisimilitude for a Greek-speaking audience.

  **Node 3 (Granularity): Passion Predictions**
  Jesus predicts his death three times in Mark, with increasing detail.
  *   (A) We can sift these to find perhaps one core authentic prediction behind the elaboration.
  *   (B) The specific predictions are post-event prophecies; only the *pattern* of expectation is recoverable.

  **Node 4 (Granularity): The Sermon on the Mount**
  Is the Sermon a single speech Jesus gave, or a collection of sayings gathered by the evangelist?
  *   (A) It is likely a condensed record of a real sermon (or several), preserving specific items.
  *   (B) It is a theological composition by the evangelist; only the themes are traditional.

  **Node 5 (Independence): The Gospel of Thomas** **[SOURCE CRITICISM FLAG: Q & Thomas Independence]**
  Thomas contains sayings similar to Q but without the narrative frame.
  *   (A) This represents an independent early stream of tradition, boosting confidence in shared sayings.
  *   (B) This is a late gnostic derivative of the Synoptics; it adds no independent weight.
  *(Note: If you assume Markan Priority but reject Q, adjust confidence in "Independence" downward.)*

  **Node 6 (Independence): Paul's Knowledge** **[SOURCE CRITICISM FLAG: Pauline Chronology]**
  Paul mentions Jesus's brother James and the Last Supper tradition.
  *   (A) This anchors the gospel narrative in biographical reality known to the early church.
  *   (B) This shows cultic knowledge but implies Paul knew almost no narrative biography of Jesus.

  **Node 7 (Theology): The Baptism of Jesus**
  Jesus is baptized by John, implying subordination. The church found this awkward.
  *   (A) Churches do not invent self-damaging material; this must be historical.
  *   (B) Embarrassment is manufactured precisely where it is theologically useful (e.g., to explain adoptionism); this proves nothing.

  **Node 8 (Theology): The Temple Incident**
  Jesus overturns tables in the Temple. This fits prophetic judgment motifs.
  *   (A) It fits the context of 1st-century Jewish prophetic action; it is plausible.
  *   (B) It fits the theological need to explain the Temple's destruction in 70 CE; it is likely symbolic.

  **Node 9 (Prior): Miracle Stories**
  A healing story appears only in Mark, with no multiple attestation.
  *   (A) It is presumed fictional unless external evidence supports it (Skeptical Default).
  *   (B) It is presumed plausible unless it contradicts known historical facts (Plausibility Default).

  **Node 10 (Goal): The Resurrection**
  What is the historical critic's task regarding the empty tomb/appearances?
  *   (A) To determine if it happened as a historical event.
  *   (B) To explain why the disciples *believed* it happened (the Kerygma), regardless of event status.

