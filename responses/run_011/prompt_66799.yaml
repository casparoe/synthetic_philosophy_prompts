  ### IV. The Leaves (Methodological Positions)

  Match your pattern of A/B answers to the following positions. Most scholars cluster; few are pure types.

  #### 1. The Classical Criteria Camp (e.g., Dodd, Jeremias)
  *   **Profile:** Mostly **A** on Transmission/Independence; **A** on Granularity; **A** on Theology (Embarrassment works); **A** on Prior.
  *   **Description:** Uses the tools of source criticism to isolate authentic atoms. Believes embarrassment, dissimilarity, and multiple attestation can certify specific sayings.
  *   **Awkward Commitment:** Often produces a Jesus detached from first-century Judaism (via the Criterion of Dissimilarity).
  *   **Source Flags:** Relies heavily on Q existence and Markan Priority (Nodes 5, 2).

  #### 2. The E.P. Sanders View (Contextual Plausibility)
  *   **Profile:** **A** on Transmission; **Mixed** on Granularity; **A** on Theology (Context); **B** on Prior (Plausibility).
  *   **Description:** Contextual plausibility does the real work; criteria are tiebreakers. Jesus must fit Judaism, but also explain the movement that followed.
  *   **Awkward Commitment:** Can be circular (Jesus fits Judaism because we define Judaism by the Jesus tradition).
  *   **Inseparable From:** N.T. Wright (Leaf 3) on outcomes, though priors differ.

  #### 3. The N.T. Wright View (Double Similarity/Dissimilarity)
  *   **Profile:** **A** on Transmission; **A** on Granularity; **B** on Theology (Theology shapes fact); **B** on Prior (Plausibility).
  *   **Description:** Jesus must be plausible within Judaism *and* explain why he was crucified (distinctiveness). High confidence in historical reconstruction.
  *   **Awkward Commitment:** Requires high confidence in our ability to reconstruct 1st-century political theology.
  *   **Source Flags:** Assumes Synoptic reliability for broad narrative (Node 1).

  #### 4. The Dale Allison Line (Recurring Patterns)
  *   **Profile:** **B** on Transmission (Memory); **B** on Granularity (Patterns); **B** on Theology; **B** on Prior.
  *   **Description:** Item-level criteria are hopeless; memory is constructive. However, recurring patterns across the tradition (the "gestalt") are recoverable.
  *   **Awkward Commitment:** Gives up on "what Jesus actually said," which frustrates theologians wanting ipsissima verba.
  *   **Inseparable From:** Hard to distinguish from Wright on the "big picture," but diverges on specific sayings.

  #### 5. The Keith / Le Donne Move (Memory as Refraction)
  *   **Profile:** **B** on Transmission; **B** on Granularity; **B** on Theology; **B** on Goal (Node 10).
  *   **Description:** Trades "authenticity" for "plausibility-in-context." Memory is refraction; the "historical Jesus" is indistinguishable from the "remembered Jesus."
  *   **Awkward Commitment:** Potentially collapses history into reception history; makes "what happened" inaccessible.
  *   **Unoccupied Cell Neighbor:** Adjacent to Allison, but more radical on the impossibility of access.

  #### 6. The Theissen / Winter Critique (Sociological)
  *   **Profile:** **Mixed** on Transmission; **B** on Granularity; **B** on Theology; **A** on Prior (Skepticism of elite sources).
  *   **Description:** The criteria grew inside a confessional history and systematically produce a Jesus detached from first-century Judaism. Focuses on social movements.
  *   **Awkward Commitment:** The critique is clearer than the positive method offered for retrieving specific data.
  *   **Note:** Often functions as a modifier to Sanders or Allison rather than a standalone system.

  #### 7. The Bart Ehrman View (Moderate Agnosticism)
  *   **Profile:** **A** on Transmission (Degradation); **A** on Granularity; **A** on Theology (Invention); **A** on Prior (Skepticism).
  *   **Description:** Criteria are individually weak and only ever combine probabilistically. High burden of proof on the claimant.
  *   **Awkward Commitment:** Radical skepticism can make the origins of the movement inexplicable (how did *this* specific movement start if we know almost nothing?).
  *   **Source Flags:** Relies on Markan Priority and Q to establish "multiple attestation" (Node 5).

  #### 8. The Bultmannian Leaf (Kerygma)
  *   **Profile:** **B** on Transmission; **A** on Granularity (but negative); **A** on Theology (Invention); **B** on Goal (Node 10).
  *   **Description:** You basically can't get behind the kerygma. Faith must be detached from history.
  *   **Awkward Commitment:** Requires faith to float free of historical grounding, which many find theologically unstable.
  *   **Inseparable From:** Ehrman on historical conclusions, but diverges on theological utility.

  #### 9. The Maximalist Leaf (e.g., Blomberg, Wenham)
  *   **Profile:** **A** on Transmission; **A** on Granularity; **B** on Theology (Accommodation); **B** on Prior (Trust).
  *   **Description:** The gospels are generally reliable unless proven otherwise. Burden of proof is on the skeptic.
  *   **Awkward Commitment:** Must defend historically difficult material (miracles/contradictions) as factual or harmonize them aggressively.
  *   **Source Flags:** Often challenges Q or Markan Priority to maximize independence (Node 5).

  ***

  ### V. Unoccupied Cells & Structural Notes

  **1. The Incoherent Cell: Constructive Memory + Atomistic Authenticity**
  *   **Coordinates:** Node 1 (B) + Node 3 (A).
  *   **Diagnosis:** If memory is socially constructive (Node 1B), individual sayings (Node 3A) are not stable units. No major scholar occupies this space because it is methodologically inconsistent. You cannot claim traditions are refracted by community needs while simultaneously claiming specific phrases are untouched.

  **2. The Inseparable Pair: Sanders (Leaf 2) & Wright (Leaf 3)**
  *   **Diagnosis:** Your tree cannot reliably separate these two. Both rely on "Contextual Plausibility" (Node 8A) and a "Plausibility Default" (Node 9B). They diverge on theological motivation, but historically they land on similar portraits of Jesus. Distinguishing them requires asking about *eschatology*, which is outside this 10-node instrument.

  **3. Source-Critical Dependencies**
  *   **Node 5 (Thomas/Q):** If Q does not exist, "Multiple Attestation" collapses for many sayings. This pushes Ehrman (Leaf 7) and Classical (Leaf 1) toward Sanders (Leaf 2) or Agnosticism, as their statistical confidence drops.
  *   **Node 6 (Paul):** If Paul knew more narrative than he explicitly wrote (implicit knowledge), Leaf 7 (Ehrman) becomes less tenable. If Paul knew *only* cultic data, Leaf 9 (Maximalist) becomes less tenable.

  **4. The "Vibes" Diagnosis**
  *   If your answers are scattered (e.g., A, B, A, B, A...), you likely operate on "vibes about which pericopes feel load-bearing" (as you noted in your prompt). This is not a formal methodological position but a pragmatic eclectic stance. Most working historians occupy this unlabelled center, shifting methods based on the specific passage under review.
