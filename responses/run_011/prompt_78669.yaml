answer: |-
  **Note on Commitment 3:** A careful defender of this view typically insists that the "credibility" condition in Commitment 3 must be *objective* (would a reasonable agent have found this credible?) rather than *subjective* (did this specific agent find it credible?). If credibility is subjective, the defense collapses: a racist agent can claim anti-racist testimony was "not credible" to them. I have drafted the questions below assuming your guest holds the stricter, objective standard, as this is the only version that survives the "Manufactured Ignorance" and "Columbus" objections.

  ***

  **1. [Commitment 2] The Threshold for Culpability**
  You argue that ignorance excuses only when it is not culpable. To help our listeners calibrate their intuition: describe a specific finding about a historical agent's epistemic conduct that would, on your view, remove the excuse entirely. What specific action or omission turns a blind spot into a moral failure?

  *Follow-up:* If you answer, as I expect, that actively suppressing counter-evidence removes the excuse, does that not imply that the mere maintenance of a hierarchy requiring such suppression is itself the culpable act?

  **2. [Commitment 2] The Jefferson Case: Recorded Doubt**
  Consider Jefferson writing that he trembles for his country because divine justice cannot sleep forever. He forms a suspicion, records it, and then declines to pursue it politically. Does your account treat the recording of the doubt as an attempt to test the belief, or as evidence that he knew the belief was untested and proceeded anyway?

  *Follow-up:* If you say, as I expect, that writing it down shows he knew the risk but chose inaction, does that not make his epistemic conduct *worse* than if he had remained wholly untroubled?

  **3. [Commitment 3] The Churchill Case: Missing Frameworks**
  In the Churchill case, the data on colonial famine was available, but the interpretive framework to see it as a moral catastrophe was not. Do you grade the agent on a framework nobody around them possessed, or do you grade them on whether they should have sensed the framework was missing?

  *Follow-up:* If you argue, as I expect, that they should have sensed the framework was insufficient, what epistemic virtue do you posit that allows them to detect a blind spot they cannot yet see?

  **4. [Commitment 3] The Columbus Case: Structural Silence**
  In the Columbus case, the harmed parties were positioned so they could not be heard at all. Commitment 3 appears to excuse precisely the agents whose conduct created the silencing. Do you allow the defense where the agent's own power made the knowledge inaccessible?

  *Follow-up:* If you say, as I expect, that the silencing act itself is the culpable ignorance, does that not shift the blame from holding the belief to wielding the power that prevented correction?

  **5. [Commitment 2] Manufactured Ignorance**
  Where the agent's own society discredited the testimony of the harmed, their ignorance was produced by the injustice it is now invoked to excuse. Does Commitment 2 survive contact with that fact, or does it invert, making the agent *more* blameworthy the more successful their society was at manufacturing their ignorance?

  *Follow-up:* If you agree, as I expect, that it inverts to increase blameworthiness, does that not render the defense unavailable to the very elites who usually invoke it?

  **6. [Commitment 3] The Cost of Knowledge**
  You state knowledge must be "cheap enough to take up." If an agent must sacrifice their social standing to access the truth, is that cost "cheap" in the moral sense? Where is the threshold where the price of truth becomes too high to demand?

  *Follow-up:* If you answer, as I expect, that moral duty demands high social costs, does that not contradict the claim that the ignorance was non-culpable for those who stayed silent?

  **7. [Commitment 2 & 4] The Regress and Emptiness Worry**
  If the failure to dissent is excused because everyone nearby believed as the agent did, what prevents the defense from being available to every agent in every era? Pressing for the criterion that makes it selective: what distinguishes a universal error from a culpable one?

  *Follow-up:* If you say, as I expect, that the existence of *any* dissenters makes the error culpable, does that not reduce the defense to a headcount of contemporaries rather than an assessment of the agent?

  **8. [Commitment 4] Asymmetry and Praise**
  You claim the defense mitigates blame but never blocks praise. Why does the same epistemic standard not convert the contemporary dissenter's correctness into luck rather than virtue? If everyone was ignorant, the dissenter is an outlier; is outlier status virtue or chance?

  *Follow-up:* If you argue, as I expect, that the dissenter paid a price for their view, is the virtue located in the correctness of the belief or merely in the willingness to suffer for it?

  **9. [Commitment 4] The Point of the Exercise**
  Given Commitment 4, this historical accounting has no bearing on what institutions should do with names or monuments. If the judgment of blame is decoupled from the decision to commemorate, what work is the historical assessment actually doing?

  *Follow-up:* If you say, as I expect, that it preserves historical accuracy without dictating policy, does that not assume the public can hold two contradictory thoughts—honoring a person while judging them blameless for harms we condemn?

  **10. [Commitment 4] Strongest Counter-Argument**
  I want to invite you to steelman the opposition. State the strongest argument you know against your own position, specifically regarding the asymmetry in Commitment 4. Which objection keeps you up at night?

  *Follow-up:* If you cite, as I expect, the argument that moral progress requires blame to motivate change, do you concede that your view might slow the very progress it seeks to understand?

  **11. [Commitment 1] Rightness vs. Blameworthiness**
  You distinguish between an act being wrong and the agent being blameworthy. If we accept that slavery was wrong then, and we accept that the agent is not blameworthy now, what is the moral status of the monument remaining? Is it a neutral object or a continuing harm?

  *Follow-up:* If you answer, as I expect, that it is a continuing harm independent of the agent's blame, does that not mean the commission's work proceeds identically regardless of your historical verdict?

  **12. [Commitment 4] The Commissioner's Dilemma**
  I sit on a body that must decide something. What would you say to a commissioner who has been persuaded that a given agent is not blameworthy, and is then told this settles nothing about the name on the building? How do I explain to the public that we exonerated the man but removed his name?

  *Follow-up:* If you suggest, as I expect, that we honor values rather than individuals, does that not imply we should have been removing names for mediocrity all along, rather than waiting for moral failure?
