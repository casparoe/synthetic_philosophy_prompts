answer: |-
  Here is the procedure you can run in ten minutes, stripped of the academic history and built for the room you are in. You start by telling the committee that we are not looking for the true meaning of the word but for the liability boundary, and that we will answer two specific hypothetical questions to find where that boundary sits. The first step is to check if the term is already tied to a measurement procedure, because if there is a number in the current standard, that number is the definition regardless of what the word suggests to a layperson. If there is a numeric threshold or a specific test method cited in the current definition, you stop there and lock the term to that measurement procedure, which means any future change to the number is a change in policy, not a change in meaning. If there is no number, you move to the first hypothetical, which I call the Discovery Question. You ask the room to suppose that we find out tomorrow that the coatings we currently certify under this term actually achieve their effect through a mechanism we did not expect, or that the ingredient we thought was key is actually inert. You ask if we would revoke the certification for those existing products based on that new knowledge. If the answer is no, we keep the label despite the new science, then the term is tied to performance. If the answer is yes, we revoke the label because the science changed, then the term is tied to constitution or mechanism.

  Once you have that answer, you immediately move to the second hypothetical, which I call the Imposter Question. You ask the room to suppose a manufacturer creates a new product using completely different chemistry that we have never seen before, but it passes all the same performance tests and looks identical to the consumer. You ask if this new product gets the label. If the answer is yes, it gets the label despite different ingredients, then the term is tied to performance. If the answer is no, it does not get the label because the ingredients are wrong, then the term is tied to constitution. Now you compare the answers. If both answers point to performance, you define by role. If both answers point to constitution, you define by ingredients. If the answers contradict each other, meaning the room says we would keep the label on old stuff even if the mechanism changed but we would deny the label to new stuff that works the same way, then you have reached the point where there is no fact of the matter. This is where you stop philosophizing. That contradiction means the term is doing two different jobs at once, and you must put it to a vote as an explicit policy choice to prioritize either legal stability or scientific accuracy. If both answers are confused or the room refuses to commit to either scenario, the term is too vague for a standard and you retire it in favor of a specific test method and number.

  Running this on lead-free shows that it is currently defined by a numeric threshold, so it falls under the measurement procedure outcome immediately. The question about future toxicology findings is a distractor because the meaning of the term in your standard is the number, not the health outcome. If toxicology proves the threshold is unsafe, you change the number in the next revision of the standard, but that does not change what the term meant in contracts signed yesterday. Those contracts were about compliance with the number, not compliance with safety, so you tell the committee that the definition stays fixed to the measurement and the policy change is prospective only. This avoids the lawsuit risk of implying that past certifications were false when they were actually compliant with the rule as written.

  Running this on flame retardant will likely trigger the contradiction I warned you about. The chemists will answer the Discovery Question by saying that if we found out a coating stops fire by a mechanism we didn't approve, it should not keep the label, because they care about the mechanism. The lawyers will answer the Imposter Question by saying that if a new chemical stops fire effectively, it should get the label, because they care about the liability shield of performance. When you get this split, you mark it as a policy choice. You cannot define it by constitution because the lawyers will block it, and you cannot define it by role because the chemists will block it. You must vote on whether the standard is a guarantee of safety mechanism or a guarantee of safety outcome. If you cannot resolve that, you retire the term and replace it with specific classes like halogenated flame retardant alongside a specific fire resistance rating, because trying to bridge that gap with one definition is where the lawsuits will come from.

  Running this on water-based with the fifty-five percent formulation in front of you reveals that the term is currently failing the measurement check. If you ask the Discovery Question and the room agrees that if the water was replaced by a non-toxic synthetic solvent that behaved identically it would not be water-based, then you are leaning toward constitution. But if you ask the Imposter Question and they agree that a coating with forty percent water that performs identically should not get the label, you are setting a constitutional threshold. The procedure suggests you should not define this by intuition. You need to set a numeric threshold for water content by weight and define the term as meeting that measurement. If you try to define it by the role of the water as a carrier, you will end up in court arguing about solvent evaporation rates. Tell them to set the number at fifty percent or sixty percent and lock the definition to that measurement procedure, because anything else leaves the fifty-five percent formulation in a limbo that clients will exploit.

  Running this on durable requires me to be blunt because the procedure will likely tell you to retire the term. If you ask the Discovery Question and ask whether a coating that lasts ten years but degrades via a different chemical pathway than expected is still durable, the room will hesitate. If you ask the Imposter Question and ask whether a coating that lasts ten years but is made of entirely new polymers is durable, they will say yes, but then they will argue about what ten years means. There is no fixed constitution for durability and no single performance role that covers all contexts. This term fails both checks because it is an evaluative judgment, not a descriptive fact. You cannot define it by role because durability depends on the environment, and you cannot define it by constitution because there is no durable molecule. The procedure says you must swap this out for a test method plus a number, such as abrasion resistance cycles or UV exposure hours. If you keep the word durable in the standard, you are writing a contract term that requires a judge to decide what it means, and that is exactly the lawsuit waiting to happen you are trying to avoid. Tell the committee to kill the term and write the test method instead.
