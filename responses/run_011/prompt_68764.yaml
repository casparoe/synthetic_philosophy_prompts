  **The skeleton**

  1. Eliminative materialism denies the existence of beliefs and desires as ontological categories.
  2. Folk psychology is a strictly false theory, akin to phlogiston or ether.
  3. Mature neuroscience will replace folk vocabulary with neural activation patterns.
  4. Folk psychology is theoretically stagnant, explaining neither sleep nor mental illness.
  5. Consequently, there is no propositional content within heads; nothing is true or false.
  6. Eliminativism entails radical behaviourism regarding mental states.
  7. In practice, folk talk is retained as harmless shorthand or a useful fiction.
  8. The view faces a self-refutation charge regarding its own truth.

  **What stands**

  The core definition is broadly accurate. Eliminativists do argue that folk psychological categories refer to nothing real, much like phlogiston. The claim that neuroscience will supersede folk vocabulary is central to the Churchlands' project. The stagnation argument is indeed a staple of their positive case, even if empirically debatable. The self-refutation charge is the standard objection cited in literature. However, the characterisation of the 'useful fiction' aspect is slightly off; eliminativists typically view folk psychology as false rather than instrumentally true, though they concede its pragmatic utility in daily life. The link between eliminativism and the denial of truth is a common inference, though eliminativists often propose reconceiving truth rather than abandoning it. Thus, the passage captures the spirit and the standard objections, even if the technical details blur.

  **Where it distorts**

  The behaviourism gloss is a serious conflation. Eliminative materialists are realists about neural states, not mere dispositions. The passage claims eliminativism says 'thirst is only a disposition to drink'. This is classic Rylean behaviourism. Churchlands argue there *are* internal causal states, just not the ones folk psychology describes. This error is a common simplification in general-interest pieces, but it fundamentally misrepresents the ontology. By painting eliminativists as behaviourists, the passage invites objections regarding dispositions that do not apply to materialist accounts. It suggests the mind is nothing but behaviour, whereas Churchlands insist the mind is the brain, which is rich with structure. This distinction is vital: if the view were behaviourist, your friend's objection about internal hypotheses would land differently. Since it is materialist, the hypotheses could be neural patterns.

  The slide from 'no propositional attitudes' to 'nothing is true or false' is an overstatement. Eliminativists can accommodate truth via neural representation theories without accepting folk propositions. They deny the *framework*, not the phenomenon of accurate representation. The passage implies global nihilism about truth, making EM look self-defeating immediately. Churchlands argue we can have a deflationary theory of truth compatible with neural states. Truth becomes a property of neural mappings, not sentences in a language of thought. This nuance is often lost in popular summaries.

  The 'useful fiction' label conflates eliminativism with instrumentalism. Eliminativists believe folk psychology is strictly false, not merely a convenient tool with no truth value. They might use the talk pragmatically, but not because it is a 'fiction' in the instrumentalist sense. This is a conflation of distinct philosophical views. Instrumentalists save the theory; eliminativists bury it. The passage suggests a permanence to the fiction that Churchlands deny. They expect the shorthand to atrophy, not persist indefinitely.

  The stagnation claim is hyperbolic. Folk psychology has evolved; claiming zero progress in 2,500 years ignores nuances in psychological generalisations. This is an overstatement of a modest thesis regarding FP's limitations. It serves a rhetorical purpose but fails historical scrutiny. FP explains prediction successfully, even if not mechanism. Finally, the passage suggests Churchlands accept the 'harmless shorthand' line fully, but they argue for a gradual replacement, not merely retaining a known falsehood. These distortions soften the radical edge of the view while simultaneously making it look philosophically naive. The behaviourism point is the most damaging, as it misidentifies the target of the critique.

  **The self-refutation question**

  The standard charge is that asserting EM requires believing it, which EM says is impossible. Best replies involve redefining 'belief' as a neural state or treating EM as a theoretical assertion rather than a folk belief. Some argue the charge begs the question by assuming FP vocabulary is mandatory for truth.

  Your friend's bootstrapping argument is a genuine advance. It targets the *practice* of science rather than the *assertion* of the theory. It argues neuroscience presupposes FP to exist. This is stronger than simple performativity. However, it may prove too much: all theory change involves using old concepts to build new ones. Consider using 'heat' to discover 'kinetic energy'. If relying on FP to do science invalidates EM, then all scientific revolutions are self-undermining.

  The eliminativist replies that neuroscience describes the *mechanism* of reasoning, not the folk description. The practice uses FP, but the ontology is neural. The friend's point highlights a transitional paradox, not a fatal flaw. The eliminativist need not concede the point entirely; they can argue the FP description of science is itself part of the folk theory being replaced. Neuroscience studies brains; the fact that scientists *talk* like folk psychologists does not prove folk psychology is true, only that it is currently indispensable. Indispensability is not ontology. Thus, the argument shows EM is difficult to implement, not that it is false. The friend assumes the description of the practice must match the ontology of the practice. Churchlands argue the description will eventually change too.

  **Where I should end up**

  The article's conclusions regarding behaviourism and truth do not survive scrutiny. The view is not behaviourist, nor does it deny truth simpliciter. Your friend's parasitism point is strong but not fatal; it highlights the difficulty of theory change, not impossibility. The most defensible position is a moderate realism: FP is likely incomplete and partially false, but not wholly eliminable. Neuroscience will inform psychology, but propositional attitudes may survive as high-level descriptions of neural networks. You should remain sceptical of the radical elimination claim while acknowledging FP's theoretical limitations. The article's tone was convincing because FP is stagnant in some areas, but its reasoning was shaky on ontology. Accept the critique of FP's limits, reject the elimination of content.
