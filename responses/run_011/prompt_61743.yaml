answer: |-
  The Binding Tide

  The bell tolled seven, and the harbor held its breath. Mist clung to the cobblestones of the Square, dampening the sound of the crowd as they gathered before the Ledger House. Elara stood inside the high window, watching the shapes shift below. She adjusted the stack of parchments on her desk, the edges sharp against her thumb.

  The Keeper stepped onto the balcony. He was a old man, wrapped in wool, holding the Book. He opened it to the first page of the month.

  "Haran of the Nets," the Keeper read. His voice carried over the wet stone. "I swear to sail the Northern Shoals by the tenth. Forfeit: The Red Net."

  A murmur went through the crowd. Haran stood near the front, head bowed. He had not sailed. The ice had come early. Now the net, dried and mended for twenty years, would be cut and burned before sunset. It was how the town worked. Words turned to weight. The Ledger did not judge why you failed, only that you failed.

  Elara turned from the window. The office was cold, heated only by the stove in the corner. She was a clerk, third rank, which meant she touched the paper before the Keeper saw it. She knew what was coming this month.

  The door opened. Captain Vane of the Iron Hulls entered, shaking snow from his coat. He was followed immediately by Captain Moss of the Salt Wind. They did not look at each other. They walked to the desk, each holding a sealed envelope.

  "Filing," Vane said.

  "Filing," Moss said.

  Elara took them. She knew the contents without opening them. The winter contract for the mines was worth more than both fleets combined. Only one could carry the ore through the ice.

  She slid Vane's envelope under the light. The wax was still warm. *I swear to depart December first. If prevented, I will burn my flagship.*

  She slid Moss's envelope under the light. *I swear to depart December first. If prevented, I will scuttle my docks.*

  Elara felt the cold settle in her bones. If both filed, both were bound. If both sailed on the first, the channel was too narrow. They would crash. Ships would break. Men would die. The forfeitures would be paid, but the loss would exceed the contract's value ten times over. The town would starve without the ore, and the fleets would be hulls rotting in the ice.

  "Order?" Vane asked. His hand hovered near the inbox slot.

  "Order," Moss echoed. His hand mirrored Vane's.

  Whoever dropped their envelope first would be read first. The first oath became the wall the second had to climb. If Vane filed first, Moss had to yield or burn his docks. If Moss filed first, Vane burned his ship. They were racing to trap themselves.

  "Wait," Elara said.

  They ignored her. The tension in the room was a physical thing, like the air before a storm. They were waiting for the other to blink, but blinking meant losing the contract. Neither could step back. To step back was to show weakness, to invite the other to press harder.

  Elara looked at the inbox. It was a narrow slit. Only one envelope could pass at a time.

  "If you both file," Elara said, "the town loses the winter."

  Vane glanced at her. "The Ledger holds. We obey."

  "The Ledger holds," Moss said. "But the channel breaks."

  They reached for the slot.

  Elara moved. She didn't grab their hands. She reached into her own tunic and pulled out a folded deed. It was the only thing she owned: a small house on the hill, inherited from her mother. It was warm there. It smelled of cedar.

  She placed the deed on the desk. Then she took a fresh sheet of parchment. She dipped the quill.

  "What are you doing?" Vane asked.

  "Fixing the order," Elara said.

  She wrote quickly. *I swear that the next two filings are of one breath. They are simultaneous. If the Ledger reads them as separate, I forfeit this deed.*

  She signed it. She sealed it with her own stamp.

  She placed her oath on top of the inbox slot. Then she took Vane's envelope and Moss's envelope. She pressed them together, side by side, and pushed them through the slot beneath her own.

  "You can't do that," Moss said. "The rules say one by one."

  "The rules say the Keeper reads what is filed," Elara said. "I have filed a rule for these two."

  Vane stared at the deed on the desk. "You're betting your home."

  "If you fight the order," Elara said, "I lose it. If you claim you were first, you claim I lied. If I lied, the Ledger rejects the tie. If the Ledger rejects the tie, I lose the house."

  She looked at them. "Do you want my house?"

  The silence stretched. The stove ticked. Outside, the bell tolled again, signaling the end of the filing hour.

  If they argued, if they claimed priority, they would have to prove it. To prove it, they would have to break her oath. To break her oath was to destroy a clerk who had served the town for ten years. The crowd outside would know. The Ledger's honor was not just in the rules, but in the people who kept them. If they crushed her to win a contract, no one would trust them again. Their own oaths would become worthless paper because no one would believe the men who signed them.

  But more than that, Elara had made the order irrelevant. Her oath sat on top. It commanded the Keeper to read them as one. If the Keeper obeyed Elara, neither captain had the advantage. The lock was broken. They could not use the Ledger to force the other's hand. They would have to talk.

  Vane pulled his hand back. He looked at Moss. Moss looked at the deed.

  "We can renegotiate," Moss said quietly.

  "If we file separately, we crash," Vane said.

  Elara didn't move. "File together. Or I file this." She touched her deed.

  Vane nodded. He took his envelope back. Moss took his. They stood side by side. On the count of three, they dropped them together. They fell into the box as a single clump.

  Elara exhaled. She picked up her deed and put it back in her tunic. She had not lost it. Not yet. But for the rest of the month, until the reading, it was pledged. If anyone challenged the reading, she would pay. She walked home that night knowing the roof over her head was no longer entirely hers. It belonged to the truth of that drop.

  The first of the next month came cold and clear. The Square was fuller than usual. The fishermen stood close. The miners stood close. The two captains stood at the front, side by side.

  The Keeper stepped onto the balcony. He opened the Book.

  "Elara of the Ledger," he read. "I swear that the next two filings are of one breath. Forfeit: The House on the Hill."

  A ripple went through the crowd. People looked up at the hill where Elara's chimney smoked.

  "Vane of the Iron Hulls and Moss of the Salt Wind," the Keeper read. "Joint filing. We swear to share the winter contract. Forfeit: One ship each."

  The crowd exhaled. The crash would not happen. The ore would move.

  Elara stood in the window. She watched the captains shake hands below. They had saved their fleets. They had saved the town.

  The Keeper closed the Book. He looked up at the window. He knew the risk she had taken. He knew that for thirty days, she had slept with one eye open, waiting for a challenge that would cost her her home. There had been no challenge. The tie held.

  But as Elara turned from the window, she touched the deed in her pocket. The paper was worn soft. She knew that next year, when the ice came, the race would begin again. The Ledger would wait. The slot would be narrow. And she would have to decide if she was willing to burn her own bridge again to stop them from burning the town.

  She walked down the stairs to the main floor. The stove was cold. The ink was drying. There was work to do.
