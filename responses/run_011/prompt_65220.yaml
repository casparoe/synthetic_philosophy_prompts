answer: |-
  This is a sophisticated set of intuitions. You are navigating the tension between **historical accuracy**, **civic honor**, and **present-day dignity**. Your intuition that "Honor vs. Record" is insufficient is correct; Case #5 (the mural) proves that sometimes we sacrifice record for dignity, and Case #6 (the fire chief) proves that sometimes we forgive sins that we wouldn't tolerate in Case #3.

  Here is a principle set designed to map onto your verdicts, followed by the application to new cases and an honest audit of where the principle strains against your intuitions.

  ### The Principle: Civic Alignment and Dignitary Harm

  To determine the fate of a memorial, apply these three filters in order. If any filter triggers a removal, the memorial must be altered or removed unless a specific exemption applies.

  **1. The Endorsement Test (Public vs. Private)**
  *   **Clause:** Is the memorial maintained by the state or a civic institution, implying current public endorsement?
  *   **Rationale:** Private groups (#8) can honor whom they wish. The state (#1, #2, #3, #5, #6) implies that the honoree represents *us*, now.
  *   **Motivating Case:** **#8 (Bench Plaque).** This is private/family grief, not civic honor. It stays regardless of the man's character.

  **2. The Functional Alignment Test (Mission vs. Legacy)**
  *   **Clause:** Does the honoree's specific controversy directly contradict the *function* of the institution bearing their name?
  *   **Rationale:** We can separate a donor's sins from their gift *unless* those sins undermine the institution's core purpose.
  *   **Motivating Case:** **#3 (Eugenicist Med School) vs. #6 (McCarthy Fire Chief).**
      *   *#3:* Eugenics is a perversion of medicine. A medical school cannot honor someone who sought to degrade the biological worth of patients. **Rename.**
      *   *#6:* Informing on neighbors is a political/moral failing, but it does not contradict the function of firefighting (saving lives/property). He is honored for local service, not political loyalty. **Leave.**

  **3. The Dignitary Harm Test (Depiction vs. Description)**
  *   **Clause:** Does the memorial visually or symbolically depict the *subjugation* of a protected class of living citizens, rather than merely naming the honoree?
  *   **Rationale:** Historical truth yields to civic dignity when the display itself creates a hostile environment for equal citizenship. Visual depictions of oppression are active harms; names are passive records.
  *   **Motivating Case:** **#5 (Mural) vs. #4 (Suffragist).**
      *   *#5:* The mural *shows* enslaved people in degradation. This inflicts active dignitary harm on descendants in a civic space (school). **Paint Over.**
      *   *#4:* The statue shows the suffragist. Her racist *words* are harmful, but the statue itself does not depict Black subjugation. **Contextualize.**

  **4. The Form Test (Glorification vs. Mourning)**
  *   **Clause:** Is the object a statue/name (inviting emulation) or a list of dead (inviting remembrance)?
  *   **Rationale:** We can record the cost of a lost cause without honoring the cause itself.
  *   **Motivating Case:** **#1 (Confederate Statue) vs. #7 (Colonial War Memorial).**
      *   *#1:* A statue is heroic glorification. Erected in 1910, it signals ongoing defiance of civil rights. **Take Down.**
      *   *#7:* A list of dead is a record of sacrifice, even if mistaken. It mourns the locals, not necessarily the empire. **Leave.**

  ---

  ### Application to New Cases

  Here is how this principle set handles the three scenarios you proposed:

  **A. A city renaming a street after a living philanthropist who is later convicted.**
  *   **Verdict:** **Rename.**
  *   **Reasoning:** Fails the **Endorsement Test**. Civic honors for living persons are implicitly contingent on ongoing good standing. A conviction proves they no longer represent the civic values required for the endorsement. Unlike historical figures, the "historical record" argument is weak because the honor was contemporary, not archival.

  **B. A university keeping the name of a founder whose views were utterly standard for his time.**
  *   **Verdict:** **Keep (with context).**
  *   **Reasoning:** Passes the **Functional Alignment Test**. If his views (e.g., paternalism, mild prejudice) were standard and do not actively contradict the university's *current* mission (unlike the eugenicist in #3), we judge him by the "historical context" exception. We do not purge history simply because morals evolve, unless the **Dignitary Harm Test** is triggered (e.g., if he built the school *on* slave labor and the name glorifies that specific act).

  **C. A statue of a scientist put up by his own students rather than by the state.**
  *   **Verdict:** **Leave.**
  *   **Reasoning:** Fails the **Endorsement Test** (State). This is organic, bottom-up gratitude, not top-down civic ideology. It functions more like the **Bench Plaque (#8)** than the **Confederate Statue (#1)**. It represents a specific community's thanks, not a mandate for public emulation.

  ---

  ### The Audit: Which Verdicts Can't Be Saved?

  A principle is only useful if it tells you when you are being inconsistent. Here are the two points where your intuitions fight the logic of the framework.

  **1. The Mural (#5) is the hardest to defend.**
  *   **The Conflict:** You admit this verdict shocks you. Under a liberal framework of "more speech/truth," the answer to a painful mural is *more context*, not erasure.
  *   **The Principle's Demand:** The **Dignitary Harm Test** saves your verdict, but it comes at a cost. If you accept that *pain* overrides *truth* in civic art, you open the door to censoring other uncomfortable histories.
  *   **The Hard Truth:** To be consistent, you must accept that **visual depictions of subjugation are treated differently than textual records.** If you cannot accept that distinction, you must change your verdict on #5 to "Keep + Context." Most preservationists would argue painting over student art destroys the historical evidence of *how* the town viewed itself in 1975.

  **2. The War Memorial (#7) vs. The Confederate Statue (#1).**
  *   **The Conflict:** You note this yourself. Both are monuments to "losers" who fought against human rights/self-determination.
  *   **The Principle's Demand:** The **Form Test** (Statue vs. List) is doing a lot of heavy lifting here. A statue of a General (#1) is inherently more celebratory than a wall of names (#7). However, if #7 is in a *public park* in the newly independent country, it functions as a claim on the landscape.
  *   **The Hard Truth:** If #1 comes down because it honors a fight for slavery, #7 is vulnerable if it honors a fight for colonialism. The only way to save #7 is to insist it is treated as a **museum piece** (historical record) rather than a **civic shrine**. If locals still lay wreaths at #7, it fails the **Endorsement Test** and should likely be moved to a cemetery or museum, even if the names remain carved.

  **3. The Fire Chief (#6) vs. The Eugenicist (#3).**
  *   **The Conflict:** You feel #6 should stay and #3 should go.
  *   **The Principle's Demand:** The **Functional Alignment Test** saves this. Medicine vs. Eugenics is a direct contradiction. Firefighting vs. McCarthyism is not.
  *   **The Hard Truth:** This is the most stable part of your intuition. However, be aware that this relies on a narrow definition of "function." If the town views the Fire Chief as a *moral* exemplar (not just a functional one), McCarthyism disqualifies him. You are banking on the idea that we name streets after service, not sainthood.

  ### Summary
  Your intuitions are largely captured by **Civic Alignment and Dignitary Harm.** You are willing to sacrifice historical accuracy (#5) for dignity, and you distinguish between *systemic* sins that contradict institutional missions (#3) and *personal/political* sins that do not (#6).

  **The one verdict you should reconsider:** **#5 (The Mural).**
  While emotionally resonant, painting over history sets a precedent that civic spaces must be comfortable for all. A stronger, more consistent position might be: **"Keep the mural, but add a prominent counter-narrative plaque commissioned by the descendants."** This honors the dignity of the descendants without erasing the evidence of the degradation. If you stick with "Paint Over," you must accept that **Dignity > Truth** in your hierarchy, which is a valid but heavy philosophical commitment.
