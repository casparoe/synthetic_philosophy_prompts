answer: |-
  Your roommate is tracking a real distinction, but she is sliding between three different categories: **Biological Individuality**, **Cognitive Agency**, and **Phenomenal Subjectivity**. She is using a criterion for the first to make a claim about the second and third.

  Here is the carving you are looking for.

  ### 1. The Name of the Concept
  In biology, this is known as **Evolutionary Individuality** (specifically within the framework of *Major Transitions in Evolution*). The specific axis she is pointing at is the degree of **Conflict Mediation** or **Reproductive Bottlenecking**.

  However, since you want the *cognitive* implication (why this stops it from being a "mind"), the existing literature doesn't have a single perfect term. The closest philosophical concept is **Agential Subsumption**.

  If we are coining a term for this specific axis—the capacity of the parts to pursue goals independent of the whole—let's call it **Constituent Sovereignty**.

  **Definition:** *Constituent Sovereignty* is the degree to which the components of a system retain the capacity to replicate, survive, or pursue fitness interests independently of the system's integrity.

  *   **High Sovereignty:** Ant colony, Corporation, Flock of birds. (Parts can leave, die, or reproduce without killing the whole).
  *   **Low Sovereignty:** Human brain, Multicellular body. (Parts cannot reproduce or survive outside the whole; their "fitness" is identical to the whole's).
  *   **Zero Sovereignty:** Neurons, Liver cells. (Physiologically locked in).

  ### 2. Agent vs. Individual vs. Subject
  You suspected she was sliding between these. She is.

  *   **Individual (Biological):** A unit of selection. To be a biological individual, you need low Constituent Sovereignty. (Your cells can't vote to become cancer without breaking the "individual" contract). By this metric, the ant colony is a *weak* individual, and the human is a *strong* individual.
  *   **Agent (Functional):** A system that processes information to achieve goals. Both colonies and humans are agents. But the *architecture* of the agency differs.
      *   *Human Agency:* Centralized arbitration of non-agential parts.
      *   *Colony Agency:* Distributed negotiation of agential parts.
  *   **Subject (Phenomenal):** "What it is like" to be the thing. This is the hard problem. Your roommate is assuming that High Constituent Sovereignty precludes Subjectivity. That is an assumption, not a proof, but it is a defensible one: if the parts are fighting for different evolutionary ends, whose "pain" is the pain?

  **Her Error:** She is arguing that because the colony lacks **Biological Individuality** (due to High Constituent Sovereignty), it cannot have **Cognitive Agency** of the unified sort. She is conflating the *evolutionary history* of the parts with the *functional architecture* of the whole.

  ### 3. The Denver Case (The Inconsistency)
  You caught her saying, "Part of me wants to take that job in Denver." You asked: *Isn't that the same structure? Sub-parts pulling in different directions?*

  **The Difference:** In the Denver case, the "parts" (desires, modules, impulses) have **Zero Constituent Sovereignty**.
  *   Your desire for adventure cannot pack a bag and leave your body.
  *   Your fear of risk cannot lay a secret egg in the brood chamber.
  *   They are locked in a single physiological substrate with a single exit door (death).

  In the ant colony, the "parts" (ants) have **High Constituent Sovereignty**.
  *   A worker ant *can* lay a trophic egg.
  *   A queen *can* fly off to start a rival nest.
  *   They are locked in a *social* contract, not a *physiological* one.

  **Resolution:** She is consistent if she clarifies that **Internal Conflict** is allowed in a Mind, but **Part-Level Agency** is not.
  *   **Mind:** Conflict between *modules* (non-agents).
  *   **Crowd:** Conflict between *agents* (sovereign entities).
  *   Her "Denver" comment refers to modules. Her "Ant" comment refers to agents. The structure looks the same (conflict), but the ontology of the parts is different.

  ### 4. The Aspen Grove (The Boundary Case)
  You mentioned the clonal aspen grove (Pando). Genetically identical. Zero conflict of interest. Low Constituent Sovereignty (roots are connected).
  *   **Why no mind?** Because it lacks **Information Integration**.
  *   **Constituent Sovereignty** is a *necessary* condition for a unified biological mind, but not a *sufficient* one.
  *   You need **Subsumption** (Low Sovereignty) + **Integration** (Centralized Processing).
  *   **Brain:** Low Sovereignty + High Integration = Mind.
  *   **Colony:** High Sovereignty + High Integration = Superorganism (Debatable Mind).
  *   **Aspen:** Low Sovereignty + Low Integration = Organism (No Mind).
  *   **Corporation:** High Sovereignty + Medium Integration = Bureaucracy (Not a Mind).

  ### 5. Is it a Switch or a Dial?
  It is a **Dial** (Graded).
  In evolutionary biology, this is measured by the **Bottleneck Strength**.
  *   **Single-Cell Bottleneck:** A human starts as one cell. This resets all conflicts. All cells are clones. Sovereignty is near zero.
  *   **Weak Bottleneck:** An ant colony starts with a queen, but workers are not perfect clones (in some species), and they retain reproductive organs. Sovereignty is suppressed but not eliminated.
  *   **No Bottleneck:** A herd of deer. Sovereignty is total.

  As the bottleneck tightens, Constituent Sovereignty drops, and the system moves from "Collective" toward "Organism." The "Mind" question tracks this dial. A colony is *more* of a mind than a herd, but *less* of a mind than a human, precisely because the ants retain more Sovereignty than neurons.

  ### 6. The Carving (Summary)
  If you want to settle the shelf-building debate, here is the precise distinction:

  **Concept:** **Constituent Sovereignty**
  **Definition:** The capacity of a system's components to pursue independent fitness goals or survive separation from the system.

  **The Criterion for Unified Mindhood:**
  A system is a candidate for a *unified subject* only if its components are **Subsumed Agents**.
  1.  **Subsumed:** They cannot defect (Low Sovereignty).
  2.  **Agents:** They process information (High Integration).

  **Application:**
  *   **Neurons:** Subsumed? Yes. Agents? No (individually). $\rightarrow$ **Mind Possible.**
  *   **Ants:** Subsumed? No. Agents? Yes. $\rightarrow$ **Collective Intelligence.**
  *   **Human Urges:** Subsumed? Yes. Agents? No (they are states). $\rightarrow$ **Mind Consistent.**
  *   **Employees:** Subsumed? No. Agents? Yes. $\rightarrow$ **Organization (Not a Mind).**

  **Verdict:** Your roommate is right that the *analogy* breaks at the joint of Sovereignty, but she is wrong to imply this prevents *any* kind of higher-level agency. It just prevents the colony from being a *subject* in the same way you are. It is a "We" that acts like an "I," but without the "I" having exclusive ownership of the parts.

  You can finish the shelf now. The colony doesn't have a mind like yours, but it has enough agency to knock the shelf over if you don't secure it to the wall.
