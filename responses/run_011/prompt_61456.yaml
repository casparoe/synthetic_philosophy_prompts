answer: |-
  ### 1. Critical Feedback on the Toy Study

  **Verdict:** The study is not a dud, but it has one vulnerable flank that sharp students will exploit unless you tighten the stem.

  **The Problem:** You specify discrimination accuracy is at chance, but you do not specify whether the "determinate detail" participants claim to experience was *present in the stimulus*.
  *   **If the detail was present** (e.g., a complex image flashed too briefly for report but seen): Realists can invoke **Overflow Views** (phenomenology exceeds access). They will argue training refined the phenomenology even if access remained bottlenecked. This neutralizes the Illusionist attack.
  *   **If the detail was absent** (e.g., a grey patch reported as having shade): This is confabulation, which favors Illusionism heavily.

  **The Fix:** To force the "principled line" debate rather than an overflow debate, tweak measure (iii) in the stem to clarify the detail was veridically unsupported.
  *   *Change:* "...confidence that their experience contained determinate detail **exceeding the information capacity of the stimulus**."
  *   *Why:* This blocks the Realist from saying "they saw it but couldn't report it." They must argue either (a) the experience itself is veridically rich despite the stimulus (harder to defend) or (b) the training induced a conceptual schema of richness. This forces the Illusionist to explain why *this* confidence is error while *other* introspective data (e.g., "I am in pain") is not.

  **Recommendation:** Use the tweaked stem below in the exam question to ensure the philosophical tension holds.

  ***

  ### 2. Exam Question (Stem + Prompt)

  48 participants completed 30 hours of either micro-phenomenology training (focused on describing experience unfolding) or control drills. Both arms then performed a probe task with briefly presented stimuli. Results: (i) Discrimination accuracy on stimulus features was at chance for both; (ii) Trained arm reports were significantly more internally consistent across probes; (iii) Trained arm used more descriptive vocabulary; (iv) Trained arm expressed higher confidence that their experience contained determinate detail **exceeding the information capacity of the stimulus**. (1) Does this pattern tell against illusionism about phenomenal consciousness? (2) What empirical result *would* tell against it? Explain how illusionism draws a principled line between reliable and unreliable introspective data here.

  *(139 words)*

  ***

  ### 3. Model Answer

  **Stance:** Illusionism survives this result, but only if it can solve the criterion problem.

  This study does not tell against illusionism; rather, it illustrates the mechanism illusionism proposes. Illusionism claims introspection systematically misrepresents phenomenal states as having rich, determinate content when they are actually sparse or non-existent. The training arm did not gain accuracy (measure i), yet gained confidence in determinacy (measure iv). For an illusionist like Frankish, this is exactly what we expect when subjects are coached in a folk-psychological schema: they become better at generating consistent confabulations. The increased consistency (measure ii) reflects a stabilized bias, not a calibrated instrument. A realist must argue that training removed noise to reveal true structure, but cannot explain why this "revealed" structure correlates with zero discrimination accuracy on the stimulus features causing it.

  However, this raises the deeper challenge: the criterion problem. If illusionism treats introspective reports of determinacy as errors here, it must explain why other introspective reports (e.g., "I am in pain") are treated as data. If all introspection is theory-laden, what validates the theory? A student might object that illusionism arbitrarily dismisses inconvenient data.

  To survive, illusionism must draw a principled line based on independent verification, not introspective coherence. Introspection is reliable only when its deliverances correlate with third-person functional or neural markers that justify the claim. In this study, the claim of "determinate detail" lacks a neural correlate capable of supporting that resolution (given chance discrimination). In contrast, pain reports correlate with nociceptive activation and avoidance behavior. The line is not between "good" and "bad" introspection, but between introspective claims that track functional reality and those that track only conceptual commitments.

  Therefore, the result that *would* tell against illusionism is not better introspection, but a dissociation in the opposite direction: if training increased discrimination accuracy (measure i) without increasing confidence in determinacy (measure iii). This would suggest the phenomenology was veridically accessed but sparse, undermining the claim that the "richness" is an illusion. Alternatively, if neural decoding could read out the specific "determinate detail" claimed by participants despite chance behavioral accuracy, illusionism would fail. It would prove the detail was physically present and accessed, merely bottlenecked at report.

  Ultimately, this study favors illusionism because it decouples consistency from accuracy. But illusionism wins only if it accepts that introspection is never self-validating. It must treat introspective data as hypotheses to be tested against causal roles, not as foundational givens. If it cannot specify which causal roles validate phenomenological claims without circularity, it collapses into global skepticism. The study shows the training modifies the hypothesis-generation mechanism; illusionism must show it modifies the truth-tracking mechanism to lose. It hasn't.

  *(745 words)*

  **Note on Commitment:** This answer argues for **Strong Illusionism** (the world lacks phenomenal properties as introspected) rather than **Deflationary Illusionism** (the concept is flawed). It assumes the study's "detail" is veridically absent (per the tweaked stem). If the detail were present but inaccessible, the Realist Overflow defense would weaken the Illusionist verdict.

  ***

  ### 4. Marking Scheme (25 Marks)

  **Named Moves & Allocation**

  1.  **Interpretation of Results (5 marks)**
      *   Correctly identifies that Consistency + Chance Accuracy = Calibrated Bias (Illusionist view). (3 marks)
      *   Correctly identifies the Realist counter (Training revealed true structure/Overflow). (2 marks)
      *   *Typical Botch:* Treating consistency as proof of accuracy automatically.

  2.  **The Principled Line Challenge (10 marks)**
      *   Identifies the core problem: Illusionism needs a criterion to distinguish valid vs. invalid introspection. (4 marks)
      *   Proposes a non-circular criterion (e.g., third-person correlation, functional role, neural decoding). (4 marks)
      *   Explains why introspective coherence alone is insufficient. (2 marks)
      *   *Typical Botch:* Saying "illusionism just denies the data" without explaining how it accepts *any* data.

  3.  **Falsification Condition (5 marks)**
      *   Specifies a result that would damage illusionism (e.g., Neural decoding matches report despite chance behavior). (3 marks)
      *   Ensures the condition targets the *illusion* claim, not just report reliability. (2 marks)
      *   *Typical Botch:* Saying "If people say they have qualia, illusionism is false" (begs the question).

  4.  **Clarity & Structure (5 marks)**
      *   Argument flows logically; stance is clear; no waffle.
      *   *Typical Botch:* "On the one hand... on the other hand..." with no conclusion.

  **Specific Deductions (Apply to Total)**

  *   **Hard Problem Recap (-5):** Reciting the Hard Problem as if it refutes illusionism. (Illusionism denies the Hard Problem's presuppositions.)
  *   **Eliminativism Strawman (-5):** Arguing illusionism denies experience exists *simpliciter*, rather than denying the *introspective representation* of experience.
  *   **Introspection Conflation (-5):** Citing general unreliability of verbal reports (Nisbett/Wilson) as settling the phenomenological question. (Confuses judgment causes with phenomenal character.)
  *   **Both-Sides Shrug (-5):** Refusing to judge whether the study tells against illusionism or failing to offer a criterion for the "principled line."

  **Differentiation: Solid Pass vs. First/A**

  *   **Solid Pass (13–16 marks):** Correctly notes that consistency $\neq$ accuracy. Identifies that illusionism treats the training as biasing. Offers a basic falsification condition (e.g., "if accuracy went up"). May struggle to articulate the non-circular criterion for valid introspection.
  *   **First/A (20–25 marks):** Explicitly tackles the **criterion problem**. Recognizes that illusionism accepts introspective data *conditionally* based on independent verification (neural/functional). The falsification condition targets the *neural/physical correlate* of the claimed detail, not just behavioral report. Avoids all banned moves. Takes a definitive stance on whether the study supports or attacks illusionism and defends it consistently.
