      *   *Crucial Point:* The No-Demos objection isn't actually about revisability per se. It's about *who* gets to revise. The student's formulation (1) accidentally universalized a specific claim. I need to help them narrow it back down.

  11. **Final Polish:** Ensure tone is academic, respectful, and precise (matching the seminar level). Use terms like "constituent power," "counter-majoritarian difficulty," "boundary problem."

  *(Self-Correction on the "Weakest Principle"):*
  The user wants the weakest principle that supports the deficit objection without entailing (7).
