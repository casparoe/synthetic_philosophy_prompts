answer: |-
  ## The Intentional Stance Decision Procedure (High School Edition)

  **Purpose:** To determine when it is accurate to describe software or machines using mental-state verbs (knows, wants, thinks, decides) without implying they have human souls, and without resorting to clunky "robot-speak."
  **Time Cost:** ~10 minutes per sentence.
  **Philosophical Base:** Daniel Dennett's *Intentional Stance*. A system has "beliefs" and "desires" if treating it that way is the *best, most efficient way to predict what it will do next.*

  ### The Procedure

  Ask these four questions in order. If you answer **NO** at any step, follow the instruction attached to that step. If you answer **YES** to all, the verb may stand.

  #### Step 1: The Prediction Test
  **Question:** Does using this mental verb help me predict what the system will do in a *new* situation, or does it just summarize what it already did?
  *   **Test:** Imagine a slightly different scenario (e.g., different input, different lighting, different user). If I say the bot "knows X," can I guess how it reacts to Y?
  *   **Sufficient Answer:** **YES** if the verb implies a rule or pattern that holds elsewhere. **NO** if the verb is just a metaphor for the specific event described.
  *   **If NO:** **REWRITE.** Replace the verb with a description of the specific output. (e.g., change "It refused" to "It returned an error message.")
  *   **If YES:** Go to Step 2.

  #### Step 2: The Opacity Check (Crucial Step)
  **Question:** Is the internal mechanism of this system too complex for us to describe simply, or is it transparent code?
  *   **Test:** Could we explain *how* it did it in one sentence without using mental words? (e.g., "It matched keywords" vs. "It processed latent semantic vectors via a transformer model").
  *   **Sufficient Answer:** **YES (Keep Verb)** if the mechanism is a "black box" (like a large language model) where the Design Stance is too technical for readers. **NO (Drop Verb)** if the mechanism is simple, hard-coded logic (like a thermostat or a basic script).
  *   **If NO:** **REWRITE.** Use the Design Stance (describe the programming goal). *Note: This is where Sentence 3 usually fails.*
  *   **If YES:** Go to Step 3.

  #### Step 3: The Attribution Test
  **Question:** Who is actually doing the "thinking"? The software, the user, the developer, or the training data?
  *   **Test:** Try substituting the source. "The [developers] made it so..." or "The [user's prompt] caused..."
  *   **Sufficient Answer:** **KEEP** if the behavior emerges from the system itself in a way the designers didn't explicitly script (emergent behavior). **HEDGE** if the behavior is a direct reflection of human input or static training data.
  *   **If HEDGE:** Add a qualifier (e.g., "simulates," "acts as if," "patterns suggest").
  *   **If KEEP:** Go to Step 4.

  #### Step 4: The Liability Handoff
  **Question:** Does this sentence assign blame, moral responsibility, or legal agency to the software?
  *   **Test:** If the system fails, does this sentence imply the *software* is at fault rather than the people running it?
  *   **Sufficient Answer:** **NO** (Safe to print). **YES** (Dangerous).
  *   **If YES:** **HAND TO ADVISOR.** This is no longer about accuracy; it is about ethics and liability.

  ---

  ### Application to Current Stories

  Here is the procedure applied to your three examples.

  #### 1. "The tutoring bot knows when a student is about to give up, and it changes its tone before they do."
  *   **Step 1 (Prediction):** **YES.** If it "knows" signs of giving up, we predict it will change tone in other frustration scenarios, not just this one.
  *   **Step 2 (Opacity):** **YES.** Modern tutoring bots use complex heuristic models; explaining the "design stance" (weights, latency analysis, sentiment scoring) is too technical for a general reader.
  *   **Step 3 (Attribution):** **HEDGE.** The "knowledge" isn't internal understanding; it is a correlation found in training data between user inputs and dropout rates.
  *   **Step 4 (Liability):** **NO.** No blame assigned.
  *   **Verdict:** **HEDGE.**
  *   **Rewrite:** "The tutoring bot detects patterns consistent with a student giving up, and it changes its tone preemptively."
  *   **Footnote:** *We attribute 'detection' to the bot because its internal processing is opaque, though this behavior arises from statistical training, not human-like awareness.*

  #### 2. "Our moderation filter doesn't understand context, so it flagged the entire news article about the book challenge."
  *   **Step 1 (Prediction):** **YES.** We can predict it will fail on other context-heavy tasks (sarcasm, irony).
  *   **Step 2 (Opacity):** **YES.** "Context" is a shorthand for semantic relationships that are too complex to detail in a news story.
  *   **Step 3 (Attribution):** **KEEP.** The failure is emergent from the model's architecture, not a specific line of code written by a person yesterday.
  *   **Step 4 (Liability):** **NO.** It describes a limitation, not a moral fault.
  *   **Verdict:** **PASS.**
  *   **Rewrite:** None needed.
  *   **Footnote:** *'Understand' is used here in the functional sense: the system cannot distinguish semantic nuance from keyword matching.*

  #### 3. "The rover wanted to reach the far checkpoint, so it abandoned the shorter route."
  *   **Step 1 (Prediction):** **YES.** We predict it will prioritize checkpoints over distance in other runs.
  *   **Step 2 (Opacity):** **NO.** *Failure Point.* A high school rover is likely running a clear objective function (e.g., `if checkpoint > distance, then route_B`). The mechanism is transparent. The Design Stance is *more efficient* and accurate here than the Intentional Stance. Using "wanted" implies a choice that wasn't there.
  *   **Step 3 (Attribution):** **REWRITE.** The "desire" belongs to the programmer who set the priority weights.
  *   **Step 4 (Liability):** **N/A.**
  *   **Verdict:** **REWRITE.** (This is the unpleasant surprise: The Intentional Stance is only for *opaque* systems. For simple code, it is misleading.)
  *   **Rewrite:** "The rover was programmed to prioritize the far checkpoint, so it abandoned the shorter route."
  *   **Footnote:** *We avoid 'wanted' here because the rover's logic is transparent code, not emergent AI. The 'goal' was set by engineers, not chosen by the machine.*

  ---

  ### The Philosophical Fault Lines

  You asked to be explicit about where this procedure assumes things that critics reject.

  **1. The "Real Belief" Assumption (Step 1 & 2)**
  *   **The Assumption:** This procedure assumes that if treating a system *as if* it has beliefs is the best way to predict its behavior, you are licensed to write that it *has* beliefs (functionally).
  *   **The Criticism:** Hard materialists and biological naturalists argue that prediction is not reality. A thermostat "predictably" acts like it wants to keep the room at 70°, but it does not *want* anything.
  *   **Where it hits you:** In Step 2. By allowing "knows" for the tutoring bot (because it's complex) but banning "wanted" for the rover (because it's simple), we are admitting that "belief" is a label we apply to *our ignorance* of the mechanism, not a property of the machine. If a critic says, "You're lying, it doesn't know anything," they are right ontologically, but this procedure argues you are right *pragmatically*.

  **2. The Emergence Distinction (Step 3)**
  *   **The Assumption:** We assume there is a meaningful difference between behavior scripted by a human ("if X then Y") and behavior emerging from a model ("weights shifted based on probability").
  *   **The Criticism:** Critics argue both are just math.
  *   **Where it hits you:** In Step 3. We hedge when the behavior comes from training data because the "intent" is diffuse (thousands of human labelers). We pass when the behavior is emergent (the model did something the creators didn't explicitly code). This distinction is fuzzy, but necessary for accuracy.

  ---

  ### What The Procedure Cannot Settle

  This tool measures **predictive accuracy**, not **relational ethics**. It cannot tell you:
  1.  **Anthropomorphism Risk:** Even if "The bot wanted" is predictively accurate, does saying it make readers trust the bot too much? (e.g., in mental health contexts).
  2.  **Moral Comfort:** Some readers feel dehumanized if machines are described as "thinking." Others feel misled if machines are described as "calculating" when they act human.
  3.  **Liability:** As noted in Step 4, if a sentence implies the AI is an agent, it might accidentally let the human creators off the hook for errors.

  *These are value judgments. When your gut says "This feels wrong" even if the Procedure says "Pass," send it to the Advisor.*

  ---

  ### Newsroom One-Pager (Tape this inside the cabinet)

  **HEADLINE: CAN THE BOT "WANT" IT? THE 3-QUESTION CHECK**
  *Don't ban mental words. Don't abuse them. Use them when they tell the truth.*

  **1. THE CRYSTAL BALL TEST**
  Does saying "it knows/wants" help me guess what it does *next time*?
  *   **No:** Delete the mental word. (It didn't "refuse," it "error-ed".)
  *   **Yes:** Keep going.

  **2. THE BLACK BOX TEST**
  Is the code too complicated to explain in one sentence?
  *   **No (Simple Script):** Use "Programmed to." (Robots don't "want," they "execute".)
  *   **Yes (AI/LLM):** Mental words are okay shorthand. Keep going.

  **3. THE BLAME TEST**
  Does this make the software sound responsible for a mistake?
  *   **Yes:** **STOP.** Ask the Advisor. (Software can't be sued.)
  *   **No:** Print it.

  **DEFAULT VERB LIST**
  *   **Knows / Understands:** **HEDGE.** (Use "Detects" or "Processes" unless the AI is opaque.)
  *   **Wants / Desires:** **REWRITE.** (Use "Prioritizes" or "Optimizes for." Only use "Wants" for complex, emergent AI.)
  *   **Decides / Chooses:** **PASS.** (Okay for opaque systems selecting between options.)
  *   **Learns:** **HEDGE.** (Use "Updates weights" or "Adapts" unless referring to long-term model training.)
  *   **Calculates / Computes:** **PASS.** (Always safe.)

  **WHEN IN DOUBT:**
  Substitute the verb with "Was designed to." If the sentence loses its meaning, the mental verb was doing work. If the sentence means the same thing, the mental verb was fluff.

  ---

  ### Theory vs. Usability: What We Dropped

  To make this fit in a 10-minute editing window, we dropped three nuances from Dennett's full theory:

  1.  **The Rationality Assumption:** Dennett assumes systems treated intentionally are *rational*. We dropped this. High school tech is often buggy. Our procedure allows "It decided" even if the decision was irrational, provided the system is opaque.
      *   *Misfire Risk:* You might attribute "reasoning" to a glitchy random number generator.
  2.  **The Sublimation of Belief:** Dennett argues beliefs are "real" if the stance works. We treat them as "useful descriptions."
      *   *Misfire Risk:* Reporters might slip into thinking the machine *actually* feels things. Remind them: "It's a level of description, not a ghost in the machine."
  3.  **The Physical Stance:** We largely ignore the physics (hardware).
      *   *Misfire Risk:* If a server overheats and slows down, saying "The bot got tired" is poetically true under the Intentional Stance but physically false. Stick to the Design Stance for hardware failures.

  **Final Note to the Editor:**
  Your current rule ("No mental verbs ever") forces you into the *Physical Stance* for everything. That is why your writing is clunky. This procedure moves you to the *Intentional Stance* where it helps, and the *Design Stance* where it's honest. It won't solve the philosophy, but it will solve the prose.
