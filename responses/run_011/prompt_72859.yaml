      *   *Core Idea:* Treat a system as having beliefs/desires if doing so is the *best/most efficient way to predict its behavior*. It's a level of description, not necessarily an ontological claim about "inner life."
      *   *The Trap:* High schoolers (and adults) often slip from "it acts *as if* it wants" to "it *actually* wants." The procedure needs to navigate this without getting bogged down in metaphysics.
