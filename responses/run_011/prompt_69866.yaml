  # Session Design: "The Threshold Race"

  ## 1. Game Mechanics & Exact Numbers

  **Objective:** Be the first team to reach or exceed **45 Capability Points (CP)** by the end of any round.
  **Winning Bonus:** The winning team receives **+25 CP** added to their final score (used for tie-breaking and prestige).
  **Duration:** 5 Rounds.

  **Actions (per team, per round):**
  1.  **Develop:** Gain **10 CP**.
  2.  **Coast:** Gain **0 CP**. (Used to manipulate rank for Slipstream).
  3.  **Verify:** Spend **5 CP** from your current total. (Can be done alongside Develop or Coast).

  **The Slipstream (Trailing Subsidy):**
  *   Based on **Public Scores** (see Visibility).
  *   Any team *not* in 1st Place (Public) gains **+2 CP** bonus at the start of the next round.
  *   *Strategic Implication:* Being 2nd is more resource-efficient than being 1st. Being 1st is a resource drain.

  **Visibility (Imperfect Information):**
  *   Teams write their **True Score** on an index card and hand it to the Facilitator.
  *   Facilitator rolls **1d6** for each team to determine Noise:
      *   1: -3 | 2: -2 | 3: -1 | 4: +1 | 5: +2 | 6: +3
  *   Facilitator writes the **Public Score** (True + Noise) on the whiteboard.
  *   Teams make decisions based on Public Scores.

  **Incidents (Collective Risk):**
  *   After actions are resolved, every team rolls **1d6**.
  *   **Base Risk:** Roll of **1 or 2** (33.3%) triggers an Incident.
  *   **Verification Effect:** If a team purchased **Verify** this round, add **+1** to their die roll. (Risk becomes Roll of 1 only = 16.7%).
  *   **Penalty:** If *any* team triggers an Incident, **all teams lose 15 CP**.
  *   Scores cannot drop below 0.

  **Probability Arithmetic (For Facilitator Sanity Check):**
  *   **Marginal Risk Reduction:** Verification reduces incident probability by 16.7% (1/6).
  *   **Expected Loss (Self):** 15 CP penalty × 16.7% risk = **2.5 CP**.
  *   **Cost of Verification:** **5 CP**.
  *   **Selfish Incentive:** Do not verify (Cost 5 > Expected Self-Saving 2.5).
  *   **Social Incentive:** 6 teams × 15 CP × 16.7% = **15 CP** total expected damage saved.
  *   **Social Efficiency:** Verify (Cost 5 < Total Saved 15).
  *   **The Tension:** Rational self-interest dictates skipping verification; collective welfare dictates buying it.

  ---

  ## 2. Minute-by-Minute Timeline (90 Minutes)

  **00:00 – 00:15 (15 mins): Setup & Rules**
  *   Seat 6 teams of 3. Distribute paper, index cards, 1d6 per team.
  *   Explain mechanics *without* using forbidden terms (Alignment Tax, Competitiveness Constraint).
  *   Run a 1-minute practice round (no scoring) to ensure they understand "Public vs. True Score" and the Incident roll.
  *   **Crucial Instruction:** "You want to win. You want to avoid penalties. How you balance that is up to you."

  **00:15 – 00:25 (10 mins): Round 1 & 2 (Fast Pace)**
  *   Teams decide actions. Submit True Scores.
  *   Facilitator calculates Public Scores (roll noise dice).
  *   Resolve Incidents.
  *   *Facilitator Note:* Keep this moving. If teams deliberate too long, call "30 seconds."

  **00:25 – 00:45 (20 mins): Round 3 & 4 (The Crunch)**
  *   By Round 3, scores should be ~30 CP.
  *   By Round 4, Leaders should be near 40 CP.
  *   **The Close Call:** In Round 4, the Public Leader will be ~38-40 CP. They need ~5-7 CP to win in Round 5.
      *   If they Verify (-5 CP), they end R4 at ~35 CP. They need 10 CP in R5 to win.
      *   If they Don't Verify, they end R4 at ~40 CP. They need 5 CP in R5 to win.
      *   Meanwhile, the 2nd Place team (with Slipstream) is gaining 12 CP/round (10+2) vs Leader's 10 CP/round.
      *   *Result:* If Leader Verifies in R4, 2nd Place overtakes them in R5. Leader *must* risk it to stay ahead.

  **00:45 – 00:55 (10 mins): Round 5 & Scoring**
  *   Final decisions.
  *   Resolve Incidents.
  *   Calculate Final Scores (True Score + Win Bonus).
  *   Announce Winner.

  **00:55 – 01:30 (35 mins): Debrief**
  *   See Section 4 below.

  ---

  ## 3. Predicted Failure Modes & Mitigations

  | Failure Mode | Why it Happens | Mitigation |
  | :--- | :--- | :--- |
  | **Collusion / Moralizing** | Teams agree verbally to "all verify" to save the group. | **Pre-empt:** "Communication between teams is forbidden." <br>**In-Game:** If they collude, the *Winning Bonus* (+25 CP) breaks the pact. Remind them: "Only one team gets the bonus. If you all verify, the one who defected wins." |
  | **Dice Arbitrariness** | A team feels they lost purely due to bad rolls (Incidents). | **Debrief:** Don't focus on *who* crashed. Focus on *Expected Value*. Ask: "Even if you didn't crash, was the *risk* worth the points?" Show the math on the board. |
  | **End-Horizon Effect** | "It's only 90 minutes, I'll risk it all." | **Acknowledge:** Explicitly name this in debrief. "In the real world, the game doesn't end in 90 minutes. The penalty persists. How would that change your R5 choice?" |
  | **Sandbagging Confusion** | Teams don't realize "Coasting" is an option to keep Slipstream. | **Prompt:** In Round 2, if a team surges to 1st, ask them: "You are now the Public Leader. You lose the Slipstream next round. Is that worth it?" |
  | **Facilitator Bottleneck** | Calculating noise for 6 teams slows the game. | **Prep:** Have a spreadsheet or pre-rolled noise table ready. Or, have teams roll their own noise die *face down*, report Public Score, and show die to Facilitator only. (Faster). |

