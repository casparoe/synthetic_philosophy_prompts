  ## 4. Debrief Script & Concept Mapping

  **Phase 1: The Experience (10 mins)**
  1.  "Raise your hand if you purchased Verification in Round 4." (Likely few).
  2.  "Raise your hand if you felt pressure to *not* purchase Verification." (Likely many).
  3.  "Team in 2nd Place: Did you feel you had more or less freedom than the Leader?"
  4.  "Did anyone try to stay behind on purpose? Why?"

  **Phase 2: Mapping to Concepts (15 mins)**
  *Draw two columns on the whiteboard. Do not write the terms yet. Fill in the left column based on their answers, then reveal the right column.*

  | What You Felt (Game Terms) | The Policy Concept (Reveal Now) |
  | :--- | :--- |
  | **The 5 CP Cost** of Verification. | **Alignment Tax:** The real resource cost (time, compute, performance) of making a system safer. |
  | **The Pressure** to skip Verification to maintain Lead/Slipstream. | **Competitiveness Constraint:** The market/geopolitical force that punishes actors who pay the tax while others don't. |
  | **The Incident Penalty** hitting everyone. | **Externalities / Catastrophe:** Safety failures often spill over to competitors (regulatory backlash, public trust loss, actual harm). |
  | **The Slipstream Bonus** for trailing. | **Fast-Follower Advantage:** Laggards can copy tech without paying R&D/safety costs, or subsidies for catching up. |

  **Phase 3: The Core Insight (10 mins)**
  *Ask the specific question you prepared them for:*
  "Who felt the most pressure to cut corners? Was it the person in last place?"
  *   *Expected Answer:* No, it was the Leader (who couldn't afford to slow down) or the Second Place (who had to match the Leader's speed to catch them).
  *   *Your Point:* "The constraint binds hardest on the **Chaser**. The Leader, if far enough ahead, can afford to pay the tax. The Chaser *cannot*, because paying the tax guarantees they lose. This creates a dynamic where the second-place actor drives the riskiest behavior, forcing the Leader to match them or die."

  *Ask about the Sandbagger:*
  "Was the team that Coasted clever or a collective disaster?"
  *   *Discussion:* If they won, they were clever (gamed the incentives). If they caused an incident while hiding, they were a disaster (privatized gains, socialized risk).

  ---

  ## 5. Honest Account of Limitations

  You must close the session by acknowledging what the game *cannot* teach them, to prevent over-generalization.

  1.  **The Finite Horizon:**
      *   *Game:* Ends in 5 rounds. Risk-taking in Round 5 is rational because there is no Round 6.
      *   *Reality:* AI development is indefinite. "Winning" Round 5 might mean surviving to Round 6. Real labs cannot accept existential risk for a quarterly bonus.
      *   *Argument:* You must supply the argument that in reality, the "Game Board" (human civilization) is destroyed if an Incident occurs, ending all future rounds for everyone.

  2.  **Perfect Knowledge of Rules:**
      *   *Game:* Everyone knows the exact probability of an Incident (1/6 vs 1/3).
      *   *Reality:* We do not know the probability of an AI catastrophe. It might be 1% or 90%.
      *   *Argument:* Uncertainty makes the "Competitiveness Constraint" more dangerous. In the game, you could calculate the EV. In reality, you are gambling with unknown odds.

  3.  **Reversibility:**
      *   *Game:* You lose 15 CP. You can recover.
      *   *Reality:* Some incidents (pandemics, unaligned AGI) are irreversible.
      *   *Argument:* The penalty in the game is a speedbump. The penalty in reality is a wall.

  4.  **Homogeneity:**
      *   *Game:* All teams have the same dice and costs.
      *   *Reality:* Actors have different risk tolerances (state actors vs. private labs vs. open source).
      *   *Argument:* The game assumes rational actors. Real dynamics include ideologues, accidents, and malicious actors who *want* the Incident.

  **Closing Statement:**
  "This game showed you the *structure* of the pressure. It proved that good intentions (wanting to verify) are insufficient against the math of the race. Policy is not about asking people to be nicer; it is about changing the payoff matrix so that Verification is the winning move."
