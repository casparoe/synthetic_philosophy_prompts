answer: |-
  ### I. The Ontology of the Lineage: Heritability and the Operational Cut-off

  The practice of clonal reconstruction begins with a metaphysical commitment to the **cell lineage** as the primary unit of selection, mediated by the genome. When the pathology report assigns an allele fraction and applies a numerical threshold to distinguish "clonal" from "subclonal," it is not merely cleaning noise; it is drawing an ontological boundary around what counts as a *reproducer*.

  For this practice to make sense, three assumptions must hold. First, **genomic markers must track genealogy despite instability.** The practice assumes that while the tumour genome is unstable, there exists a "trunk" of mutations stable enough to serve as a lineage identifier. It treats the genome as a ledger where entries, once made, are rarely erased. This rules out the possibility that the relevant heritable variation is primarily epigenetic or phenotypic without genomic correlation. If resistance were conferred by a transient chromatin state unlinked to the sequenced variants, the reconstructed tree would be a fiction of common descent. The practice assumes the genome is the *cause* of the phenotype, not just a passenger.

  Second, **the numerical cut-off operationalizes existence.** In a pure phylogenetic model, a branch exists regardless of its population frequency. In the clinical register, a lineage below the threshold (e.g., Variant Allele Frequency < 5%) is treated as non-existent for the purpose of therapeutic targeting. This cut-off bridges the gap between the *continuous* reality of cell division and the *discrete* categories required for decision-making. It defines the **minimum viable population** for a lineage to be considered a causal agent. A subclone is not "selected" until it crosses this threshold; prior to that, it is statistical noise. Thus, the cut-off does not just measure abundance; it confers *agency*.

  Third, **the clone is the bearer of fitness.** The report states that a "resistant subclone was selected." This presupposes that fitness is a property of the lineage (the set of cells sharing the mutation), not merely the individual cell. A single cell with a resistance mutation has no fitness in isolation; it requires the lineage to expand. The practice therefore treats the tumour not as a mass of independent cells, but as a **structured population of competing lineages**, where the "subclone" is the Darwinian individual.

  ### II. Rival Views and Philosophical Underdetermination

  This implicit theory is not neutral. By reconstructing trees and assigning fitness to subclones, the practice actively rules out, ignores, or remains underdetermined between several competing philosophical accounts of individuality.

  **1. Ruled Out: Strict Genic Selectionism.**
  The practice rules out the view that the allele is the only genuine reproducer and the cell is a mere vehicle. If this were true, reporting "clonal architecture" would be misleading; one should report "allele frequencies" without reference to cellular lineages. However, the oncologist treats the *cell* carrying the allele as the unit to be eradicated. The therapy targets the vehicle, not the gene in isolation. The language of "subclone expansion" commits to the cell lineage as the unit of selection.

  **2. Failed to be Entertained: The Scale/Description View.**
  The view that there are no units at all, only descriptions at different scales capturing a single causal process, is incompatible with the causal claims made. The report does not say, "At the cellular scale, we describe expansion"; it says, "The subclone *caused* the progression." This implies causal efficacy resides in the lineage itself. To treat the lineage as merely a descriptive scale would undermine the justification for targeting it specifically.

  **3. Neutral: Individuality as a Degree.**
  The practice is neutral on whether the tumour is a "low-fidelity" Darwinian population. Whether the tumour is a *weak* individual (Godfrey-Smith's *simple* Darwinian population) or a *strong* one does not change the tree reconstruction. However, the binary nature of the clonal/subclonal label suggests a threshold of individuation has been met. The practice acts *as if* the threshold is binary, even if the metaphysics admits of degrees.

  **4. Implicitly Accepted: Reversed Transition in Individuality.**
  The view that a neoplasm is a soma that has slipped its developmental bottleneck is the working model. The reconstruction of a genealogy *within* the patient assumes the breakdown of the multicellular contract. The "fitness" assigned to the tumour is fitness *against* the host. This is not a failed organism; it is a successful parasite arising from the self.

  **5. Sites of Underdetermination.**
  There are specific points where incompatible theories license the exact same clinical output:
  *   **Drift vs. Selection:** The report states a subclone was "selected" by the agent. The data shows the subclone expanded post-treatment. This is consistent with selection, but also with **genetic drift** in a bottlenecked population (the treatment killed the sensitive cells, leaving the resistant ones by chance to expand). The practice assumes selection because it is actionable; drift is not.
  *   **Genomic vs. Epigenetic Heritability:** As noted, if resistance is epigenetic but correlates with a truncal mutation, the tree looks identical. The practice assumes the mutation is the driver. This is underdetermined by the sequencing data alone.
  *   **Cell vs. Group Selection:** Is the *cell* selected, or the *clone*? The VAF measures allele frequency, which proxies cell frequency. The intervention (chemotherapy) kills cells. The report speaks of clones. The data cannot distinguish between a trait beneficial to the cell (intrinsic resistance) and a trait beneficial to the clone (e.g., public goods production that confers resistance). Both yield the same tree.

  ### III. Consistency of Registers and the Criterion of Causal Closure

  You ask whether the four registers (Clonal Reconstruction, Tumour-as-Individual, Germline/Immune Selection, Treatment Norms) are consistent. They are not. The institution holds commitments that cannot all be true without generating contradictory predictions.

  **The Criterion:** Switching levels of description is legitimate only if **Causal Closure** is preserved. That is, if an intervention targets Level X, the explanation for its success or failure must be causally closed at Level X. It is a "fudge" when the explanation appeals to Level Y to justify an intervention at Level X, where the dynamics of Y contradict the dynamics of X.

  **Application to the Registers:**

  1.  **Pathology (Population) vs. Trial Protocol (Single Object):**
      *   *The Conflict:* The pathology report treats the tumour as a heterogeneous population of lineages (Register 1). The trial protocol (Maximum Tolerated Dose) treats the tumour as a single object with a single fitness value to be minimized (Register 2).
      *   *The Fudge:* This is a fudge. MTD assumes that killing 99% of the mass reduces the "fitness" of the tumour. But if the tumour is a population (Register 1), killing the sensitive majority *increases* the relative fitness of the resistant minority by removing competition. The protocol assumes homogeneity; the biology assumes heterogeneity. The trial endpoint (Progression-Free Survival) measures the behaviour of the population, but the dosing logic assumes the behaviour of an individual.
      *   *Verdict:* Inconsistent. The biology licenses adaptive therapy; the protocol licenses eradication. They cannot both be optimal.

  2.  **Ethics (Patient) vs. Biology (Cells):**
      *   *The Conflict:* Ethics are argued in terms of the patient's interests (Register 4). Biology is described in terms of the cells' fitness (Register 1 & 3).
      *   *The Fudge:* This is legitimate *only if* patient survival supervenes on cell eradication. In adaptive therapy, we intentionally maintain a population of malignant cells to suppress resistant ones. Here, the "interests" of the cell population (stability) are aligned with the patient (survival), but the "interests" of the cell population (expansion) are opposed to the patient.
      *   *Verdict:* Consistent only under a specific ecological equilibrium. If the equilibrium shifts, the "management" strategy becomes ethically untenable because the biological description (managing a community) no longer supports the ethical goal (preserving the host).

  3.  **Germline/Immune vs. Somatic:**
      *   *The Conflict:* Germline selection tracks alleles across generations (slow, organismic fitness). Immune selection tracks neoantigens within the tissue (fast, cellular fitness).
      *   *Verdict:* Consistent. These are distinct selection pressures operating on distinct timescales. The institution correctly identifies that the patient is a Darwinian individual in the germline register, and the tumour is a Darwinian individual in the somatic register. The inconsistency arises only when the *treatment* ignores the somatic individuality of the tumour (via MTD) while acknowledging it in the *report*.

  ### IV. Concrete Rebuilds: Changing the Assumptions

  If we were to rebuild the practice on different metaphysical foundations, the clinical changes would be radical, not merely semantic.

  **Scenario A: The Patient is the Only Genuine Darwinian Individual.**
  *Assumption:* The tumour is not a selected lineage but a physiological dysfunction of the host. There is no "tumour fitness," only "host resilience."
  *   **Vocabulary:** The pathology report cannot use "clonal," "subclone," or "selection." It must use "heterogeneity," "variant burden," and "progression." The word "resistant" becomes "refractory" (a property of the host-tumour system, not the cell).
  *   **Endpoints:** Trials cannot register "tumour shrinkage" as a proxy for success. Only **Overall Survival** matters, because shrinkage implies fighting a war against an enemy that doesn't exist as an independent agent.
  *   **Relapse:** Relapse is not the "regrowth of a resistant clone." It is the "failure of host containment mechanisms."
  *   **Subclonal Fraction:** Not reportable as a genealogy. It is reportable only as a **risk marker** for system instability, akin to blood pressure.
  *   **Adaptive Dosing:** Justified as **host preservation**. We dose low not to manage cell competition, but to prevent toxicity that lowers the patient's own evolutionary fitness (immune competence, marrow function). The ecological rationale (competitive suppression) is discarded because there is no ecological community, only a diseased organism.

  **Scenario B: Nothing in the Room is a Darwinian Individual.**
  *Assumption:* Process Ontology. There are no units, only fluxes, gradients, and state transitions. "Selection" is a metaphor for differential persistence in a constrained field.
  *   **Vocabulary:** "Clone" and "lineage" are banned. The report describes **state distributions**. "Mutation" is a "state transition." "Fitness" is "propensity for persistence."
  *   **Endpoints:** Trials register **System Stability**. Time to "state shift" (from controlled to uncontrolled). Eradication is impossible because there is no "thing" to eradicate, only a process to dampen.
  *   **Relapse:** "Transition to a malignant attractor state."
  *   **Subclonal Fraction:** Reportable as the **current probability distribution** of the system. It predicts the likelihood of a state shift, not the genealogy of a reproducer.
  *   **Adaptive Dosing:** This is the only scenario where the ecological rationale *survives* but changes its ground. Adaptive dosing is justified as **Control Theory**. You do not manage competition between individuals; you manipulate the parameters of the system (nutrient flow, space, toxicity) to keep the system in a benign basin of attraction. The rationale is not "let sensitive cells kill resistant cells" (which implies individuals), but "maintain conditions where the malignant phenotype is unstable."

  **Conclusion on Adaptive Dosing:**
  You suspect the rationale for adaptive dosing cannot survive Scenario B intact. You are correct. Adaptive dosing relies on the existence of *competitors* (sensitive vs. resistant clones). If there are no individuals, there is no competition, only differential flow. The *practice* (dosing intermittently) remains, but the *justification* shifts from Evolutionary Ecology (managing a population) to Dynamical Systems (managing a trajectory). If your clinical colleagues advocate adaptive therapy because they believe in "competitive suppression," they are committed to Scenario A or the standard Oncology view. If they are committed to Scenario B, they must stop speaking of "suppressing resistant clones" and start speaking of "stabilizing the tissue state." The former is a biological claim; the latter is a physical one. The institution currently mixes them, which is the source of the theoretical friction you have observed.
