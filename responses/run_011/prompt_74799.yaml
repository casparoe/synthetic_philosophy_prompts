  6.  **Drafting - Tone and Style:**

      *   Needs to sound like a senior philosopher of biology writing for a specialized journal (e.g., *Biology & Philosophy*, *Studies in History and Philosophy of Science*).
      *   Avoid introductory fluff. Dive straight into the reconstruction.
