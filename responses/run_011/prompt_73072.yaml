prompt: |-
  For several years now I have worked out, on my own and without any training in the area, a position about uncertain belief that I would like properly stress-tested. In brief: attaching a single number to your confidence in a claim is legitimate only when something like a long, stable run of observations licenses it; otherwise the honest representation of a belief is a range, and the width of that range carries information the midpoint destroys. I further hold that you can get from ranges to action without ever collapsing them into a number — you compare options by asking which holds up across everything the range permits, and if none does, you say so rather than inventing a tie-breaking figure. Those who insist a point value must always be there are, I think, smuggling in a false precision they cannot justify.

  Tell me what would count against this view. Which arguments, formal results, or consequences ought actually to move me, as opposed to merely annoying me? I am most interested in failure modes that arise from inside the position: situations where holding a range leaves you worse off or less informed than holding a single number would, where the range quietly turns back into something precise, where a rule for acting on ranges gives verdicts I would find unacceptable, or where having a range makes some kinds of learning impossible. Say also which of these the view's own defenders would concede as telling against them, and which they would wave off — and rank the defeaters from fatal to merely awkward. Finally, give me a straight verdict on whether the position risks anything at all, or has been hedged into untouchability, and whether that hedging is defensible for a view of this kind.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Position:**
      *   **Core Claim:** Attaching a single probability number (point estimate) to a belief is only legitimate with a "long, stable run of observations" (frequentist grounding). Otherwise, belief should be represented as a *range* (imprecise probability).
      *   **Action Guideline:** Act by comparing options across the *entire* range (robustness/sensitivity analysis). If no option dominates across the range, admit indecision rather than inventing a tie-breaking number.
      *   **Critique of Opposing View:** Insisting on a point value smuggles in false precision.
      *   **Request:** Stress-test this view. Identify internal failure modes, formal results, or consequences that should move the user. Distinguish between fatal flaws and awkward concessions. Rank the defeaters. Give a straight verdict on whether the view is defensible or hedged into untouchability.

  2.  **Initial Assessment & Categorization:**
      *   The user's view aligns closely with *Imprecise Probability* (IP) theory (e.g., Walley, Levi, Joyce) and *Knightian Uncertainty*.
      *   It opposes strict *Bayesianism* (Subjective Expected Utility theory) which mandates precise priors.
      *   The request asks for *internal* failure modes (where the theory breaks itself) rather than just external criticism (e.g., "but Bayesians say otherwise").
      *   Key tension: Decision paralysis vs. False precision.

  3.  **Brainstorming Defeaters/Challenges:**

      *   *Decision Paralysis (Dilation):* If ranges are too wide, you can never decide. This is the "none does, you say so" part. Is this acceptable? In high-stakes scenarios, indecision is costly.
      *   *Updating/Learning:* How do you update a range? If you get new evidence, does the range shrink? If it doesn't shrink fast enough, learning is stifled. There's a phenomenon called "Dilation" in IP where conditioning on evidence *widens* the range. This is a major formal result.
      *   *Collapsing to Precision:* To make decisions, don't you implicitly pick a point? If the rule is "maximin" (choose the best worst-case), you are effectively acting as if the lower bound is the truth. Is that just a hidden point estimate?
      *   *Dutch Books:* Can you be money-pumped? Precise Bayesians avoid Dutch Books. Imprecise Bayesians have specific rules to avoid them, but they are restrictive.
      *   *Computational/Tractability:* Maintaining sets of probabilities is computationally expensive.
      *   *The "Long Run" Definition:* What counts as a "long, stable run"? This boundary is fuzzy. If the boundary is fuzzy, isn't the switch from range to point itself arbitrary?

  4.  **Selecting and Refining the Best Arguments:**

      *   *Argument 1: Dilation (The Learning Failure).* This is a formal result in Imprecise Probability. Sometimes, gaining evidence *increases* uncertainty (widens the interval). This directly contradicts the intuition that evidence should sharpen belief.
      *   *Argument 2: Decision Paralysis & Opportunity Cost.* The user says "if none does, you say so." In real life, *not* choosing is a choice with consequences. If the range prevents action where action is mandatory (e.g., medical triage), the theory fails pragmatically.
      *   *Argument 3: Hidden Point Estimates (The Maximin Problem).* When acting on the lower bound (maximin), you are effectively assigning probability 1 to the worst case within the range for the sake of action. This might be *more* pessimistic than the "false precision" it accuses others of.
      *   *Argument 4: The Boundary Problem.* The distinction between "stable run" (point allowed) and "uncertain" (range required) is itself uncertain. This creates a regress or arbitrariness.

  5.  **Ranking the Defeaters:**
      *   *Fatal:* Dilation (undermines the epistemic goal of learning).
      *   *Serious:* Decision Paralysis (undermines the practical goal of action).
      *   *Awkward:* Hidden Precision (hypocrisy charge).
      *   *Manageable:* Boundary Problem (can be smoothed).

  6.  **Addressing the "Defender's Concession" Aspect:**
      *   IP theorists (like Walley) admit Dilation is a feature, not a bug (it represents genuine ignorance). They would fight hard here.
      *   They admit paralysis happens but argue it's honest.
      *   They deny hidden precision by distinguishing *belief* from *decision rule*.

  7.  **Drafting the Verdict:**
      *   Is it hedged into untouchability? Yes, somewhat. By allowing "indecision" as a valid output, it avoids being wrong about actions. But this makes it less useful.
      *   Is the hedging defensible? Only if honesty is valued over utility.
      *   Final verdict: The view is robust against "false precision" charges but fragile against "inaction" costs. It risks becoming a philosophy of skepticism rather than a guide to life.

  8.  **Refining the Tone:**
      *   The user is sophisticated ("formal results," "failure modes," "hedged into untouchability").
      *   Avoid condescension.
      *   Be direct and rigorous.
      *   Acknowledge the strength of their intuition (it's a recognized philosophical position).

  9.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address "internal failure modes"? Yes, Dilation is internal to IP theory.
      *   *Check:* Did I rank them? Yes.
      *   *Check:* Did I answer the "hedged into untouchability" question? Yes.
      *   *Nuance:* Make sure to distinguish between *belief* (range) and *action* (rule). The user claims you don't collapse to act. I need to challenge whether specific action rules (like E-admissibility) implicitly collapse the range.

  10. **Final Polish:** Ensure clear headings and a strong concluding verdict. (Proceed to generate output based on these thoughts.)

  *(Self-Correction Note)*: I need to be careful with the term "Dilation." In IP theory, dilation is when the posterior interval is wider than the prior interval for *every* partition of evidence. This is counter-intuitive. I should explain this clearly. Also, I need to mention the "Indecision" problem specifically regarding *mandatory* choices.

  *(Refining the "Hidden Point" argument)*: If I use MaxMin, I am not saying the probability *is* the lower bound, but I am acting *as if* it is. The user might say "That's a decision rule, not a belief." I need to press that if the decision rule always picks the same point from the range, the rest of the range is epistemically inert.

  *(Refining the "Long Run" criterion)*: This is the weakest link. How many observations? What stability? This is a Sorites paradox waiting to happen.

