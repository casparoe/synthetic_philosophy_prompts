prompt: |-
  I work in the economics of organizations — Coase, transaction-cost economics, the Grossman–Hart–Moore property-rights approach, mechanism design, and the fiscal-federalism literature on the assignment problem. I have essentially no training in political philosophy or constitutional law; I know subsidiarity only as the word federalists use, and I can read a treaty article well enough to paraphrase it but not well enough to adjudicate interpretive disputes about it.

  At a seminar last month a colleague defended the following analogy: a federation is a holding company whose constituent units are wholly owned operating subsidiaries; subsidiarity is simply the principle that determines where residual control rights over a given activity should sit; and the entire constitutional apparatus built up around subsidiarity — the treaty language, the encyclical that supplied the doctrine, the protocol giving national parliaments a monitoring role — is the public-sector equivalent of a decentralization policy memo. He then drew two conclusions from it.

  First, subsidiarity is purely an efficiency principle: allocate decision rights to the level that minimizes the sum of coordination costs, agency costs, and preference-mismatch costs, exactly as Oates's decentralization theorem trades scale economies and spillovers against heterogeneity of tastes. On this reading nothing normative survives. The moral vocabulary — Pius XI's Quadragesimo anno of 1931, which treated assigning to a higher association what lesser and subordinate bodies can accomplish as an injustice and a disturbance of right order rather than as a miscalculation — is decoration, and the EU's Article 5(3) test (act only if and insofar as the objectives cannot be sufficiently achieved by the member states and can, by reason of the scale or effects of the action, be better achieved at Union level) is a cost–benefit test wearing a robe.

  Second, subsidiarity therefore supplies no brake on centralization. If the center can credibly satisfy the scale-and-effects test, the principle itself requires the transfer upward; it is self-consuming, and federalist resistance to that transfer is interest-group politics dressed as constitutional argument.

  I want the analogy audited, not the conclusions evaluated in the abstract. Concretely:

  Give me the correspondence table explicitly — what plays the parent, the subsidiaries, the residual control rights, the ownership of assets that grounds those rights, the objective function, the board, and exit. Where my colleague's mapping is silent or ambiguous, flag the silence rather than filling it in for him.

  Then list the disanalogies and rank them by whether they bear on the two conclusions he wants to draw. The ranking is what I care about: some disanalogies are real but harmless to his argument (a firm has residual claimants, a federation has none), and I suspect others are load-bearing. Candidates I would want you to assess rather than accept from me: in the American and Swiss cases the constituent units pre-exist the union and cannot be abolished, renamed, or sold by the center; the anti-commandeering line of Supreme Court decisions, New York v. United States and Printz v. United States, forbids the center from directing the personnel of the units in a way no parent company would tolerate for a moment; German federalism inverts the corporate structure by having the Länder execute centrally legislated law, which is where Scharpf located his joint-decision pathology; and Protocol No 2 of the EU treaties gives each national parliament two votes and, if reasoned objections reach one third of those votes within eight weeks, requires the draft act to be reviewed — a monitoring right held by the units against the center that, so far as I can see, has no counterpart in a corporate group, where the analogous right sits with the board and runs to shareholders rather than to subsidiaries.

  Tell me which features of the source the analogy quietly imports into the target and then reports as discovered. I have three in mind and want to know whether you agree: a single cardinal objective commensurable across units; residual rights that are transferable at the discretion of whoever owns them; and exit by divestiture as the discipline that keeps the assignment honest over time.

  Then give me the verdict. Does the first conclusion survive the disanalogies, or was it carried entirely by the analogy's assumption that there is one measurable objective being maximized? Does the second survive — in particular, is the self-consuming reading of Article 5(3) a result, or an artifact of treating a rule that limits competence as though it were a rule that allocates tasks within an existing competence? Bear in mind that Swiss constitutional practice pairs the subsidiarity requirement with the provision that the cantons are sovereign except insofar as their sovereignty is limited by the federal constitution and that they exercise all rights not vested in the Confederation, a pairing for which I cannot find a firm-theoretic reading.

  Be strict about translation hygiene. Do not smuggle firm-theoretic primitives in under the label of translation, and do not flatter the analogy by selecting whichever federal system happens to fit it best. Where a claim of my colleague's has no expression at all in the holding-company vocabulary, say so plainly and tell me whether the silence is a defect of the vocabulary — a missing primitive, something like original and non-transferable authority as distinct from delegated authority — or evidence that the claim was less clear than it sounded when he made it.

  Finally, if the analogy fails where it matters, propose a better one that carries the same explanatory work without the smuggling. And if the honest answer is that the phenomenon resists analogical treatment from my side of the fence, say that, name the concept in the economics of organizations that comes closest, and state what it leaves out.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Profile:** Economist specializing in organizational economics (Coase, TCE, GHM, mechanism design, fiscal federalism). No training in political philosophy/constitutional law. Knows "subsidiarity" mostly as a federalist term. Can read treaties but not adjudicate interpretive disputes.
      *   **Task:** Audit a specific analogy made by a colleague: *Federation = Holding Company; Subsidiarity = Allocation of Residual Control Rights.*
      *   **Colleague's Conclusions:**
          1.  Subsidiarity is purely an efficiency principle (minimize coordination + agency + mismatch costs). Moral vocabulary is decoration.
          2.  Subsidiarity supplies no brake on centralization (self-consuming; if center is more efficient, power moves up).
      *   **Requirements:**
          *   Explicit correspondence table (Parent, Subsidiaries, Residual Control, Assets, Objective Function, Board, Exit). Flag silences.
          *   List and rank disanalogies based on impact on the two conclusions. (Assess specific candidates provided by user: pre-existence, anti-commandeering, German execution, EU Protocol No. 2).
          *   Identify smuggled features (Single objective, transferable rights, exit by divestiture).
          *   Verdict on the two conclusions (Do they survive?).
          *   Translation hygiene (No smuggling firm primitives as translations).
          *   Alternative analogy or admission of limits (if analogy fails, propose better one or name closest economic concept).

  2.  **Deconstruct the Analogy (Holding Company vs. Federation):**
      *   *Holding Company:* Hierarchical, property-based, profit-maximizing (usually), central board decides structure, equity ownership defines control, exit via sale/spin-off.
      *   *Federation (EU/US/Swiss):* Constitutional, sovereignty-based, multiple objectives (welfare, rights, stability), member states often pre-exist, no single "owner," exit is difficult/impossible (secession), control is limited by constitution.

  3.  **Drafting the Correspondence Table:**
      *   Need to map Firm concepts to Fed concepts based *strictly* on the colleague's claim.
      *   *Parent:* Central Government (Commission/Washington).
      *   *Subsidiaries:* Member States/Cantons.
      *   *Residual Control Rights:* Competence/Legislative Authority.
      *   *Ownership of Assets:* Sovereignty/Territory? (This is tricky. In GHM, ownership = residual control. In Fed, sovereignty is often original, not derived).
      *   *Objective Function:* Social Welfare? Efficiency? (Colleague says efficiency).
      *   *Board:* Constitutional Court? Legislature? (Who decides the allocation?).
      *   *Exit:* Secession? (Rare/Impossible).
      *   *Silences:* Who owns the "Parent"? In a firm, shareholders. In a fed, "The People"? Multiple peoples?

  4.  **Analyzing Disanalogies (Ranking by Impact):**
      *   *Candidate 1: Pre-existence/Indestructibility.* States often pre-exist the union (US, Swiss). Subsidiaries are created/bought by the Parent.
          *   *Impact:* High. Undermines the idea that the Center holds original title to allocate rights. Rights in feds are often reserved, not delegated.
      *   *Candidate 2: Anti-Commandeering (NY v. US, Printz).* Center can't order state officials. Parent can order subsidiary managers.
          *   *Impact:* High on Conclusion 2. If Center can't command, "efficiency" isn't enough to move power up. Structural barriers exist beyond cost-benefit.
      *   *Candidate 3: German Execution (Länder execute Federal law).* Inverse of corporate structure.
          *   *Impact:* Medium/High. Shows administrative separation isn't just about *who decides* but *who implements*. Complicates the "allocation of rights" view.
      *   *Candidate 4: EU Protocol No. 2 (National Parliaments).* Monitoring right by subsidiaries against Parent. In firms, monitoring is Board -> Mgmt or Shareholders -> Board.
          *   *Impact:* High on Conclusion 2. It's a procedural brake, not just an efficiency test.
      *   *Candidate 5: Objective Function.* Firm = Profit (cardinal, single). Fed = Multiple, incommensurable (rights, identity, efficiency).
          *   *Impact:* Critical on Conclusion 1. If no single metric, "efficiency principle" is incoherent.

  5.  **Identifying Smuggled Features:**
      *   *Single Cardinal Objective:* Firm assumes profit. Fed assumes welfare + rights + sovereignty. Colleague smuggles "efficiency" as the only metric.
      *   *Transferable Rights:* In GHM, rights are alienable. In Fed, sovereignty/competence is often constitutionally locked or requires supermajority/unanimity to shift.
      *   *Exit by Divestiture:* Firm can sell a subsidiary. Fed usually cannot expel a state, and state cannot easily secede. This removes the market discipline on the "allocation."

  6.  **Evaluating the Conclusions:**
      *   *Conclusion 1 (Purely Efficiency):* Fails. The moral/legal vocabulary isn't decoration; it reflects the *source* of authority (sovereignty vs. delegation). The lack of a single objective function makes "efficiency" undefined without political weighting.
      *   *Conclusion 2 (No Brake on Centralization):* Fails. Article 5(3) is a competence limiter, not just a task allocator. The "self-consuming" reading ignores the presumption of local competence (Swiss model: sovereign unless limited). In firms, the Parent holds all rights unless delegated. In Feds, Subsidiaries hold all rights unless granted. This is a fundamental inversion.

  7.  **Translation Hygiene Check:**
      *   Avoid calling sovereignty "asset ownership."
      *   Avoid calling constitutional competence "residual control rights" without qualification (original vs. delegated).
      *   Acknowledge where firm theory has no equivalent (e.g., "original sovereignty").

  8.  **Alternative Analogy / Economic Concept:**
      *   *Alternative:* A **Club Good / Contractual Consortium** (like a joint venture between independent firms) rather than a Holding Company.
      *   *Closest Economic Concept:* **Incomplete Contracts with Sovereign Principals.** Or **Mechanism Design with Participation Constraints.**
      *   *What it leaves out:* The normative/moral dimension (dignity, right order) which is non-instrumental.

  9.  **Refining the Tone:**
      *   Must be rigorous, precise, and respectful of the user's economic background while correcting the legal/political misconceptions.
      *   Avoid fluff. Be direct about where the analogy breaks.
      *   Ensure the "Verdict" is clear.

  10. **Self-Correction/Review during drafting:**
      *   *Check:* Did I flag the silence on "Ownership of the Parent"? Yes, crucial. Who are the shareholders of the Federation?
      *   *Check:* Did I address the Swiss "sovereign except limited" point? Yes, this is the "default rule" inversion.
      *   *Check:* Is the distinction between "allocating tasks within competence" vs "limiting competence" clear? This is key for Conclusion 2.
      *   *Check:* Did I rank the disanalogies? Yes, prioritize those affecting the objective function and the default rule of authority.

  11. **Final Polish:** Ensure the structure matches the prompt's specific requests (Table, Disanalogies, Smuggled Features, Verdict, Alternative).

  *(Self-Correction on the "Board" equivalent)*: In the colleague's analogy, who plays the Board? It's likely the Constitutional Court or the Legislative body deciding on competence. But in a firm, the Board represents shareholders. In a Fed, who do they represent? The people? The states? This ambiguity is a defect. I need to highlight this.

  *(Self-Correction on "Exit")*: In the EU, Article 50 exists (Brexit). In US/Swiss, secession is effectively barred (Civil War/Constitutional silence). The colleague's analogy assumes easy divestiture. I need to point out that *lack* of exit changes the incentive compatibility constraints.

  *(Refining the "Smuggled Features")*: The user suggested three. I should evaluate those specifically.
  1. Single cardinal objective.
  2. Transferable rights at discretion of owner.
  3. Exit by divestiture.
  I agree with all three. I need to explain *why* they break the conclusions.

  *(Final Verdict)*: The analogy fails on Conclusion 1 because it assumes a unitary objective function that doesn't exist. It fails on Conclusion 2 because it inverts the default rule of authority (delegated vs. reserved).

  *(Alternative)*: A "Network of Incomplete Contracts" or "Consortium of Sovereigns." Closest economic concept: **Coalition Formation with Exit Constraints.**

  Let's assemble the response.cw
answer: |-
  ### 1. Correspondence Table

  Here is the explicit mapping required by your colleague's analogy. I have flagged silences where the firm-theoretic primitive has no clear constitutional equivalent or where the mapping requires assuming away critical legal features.

  | Firm-Theoretic Primitive | Colleague's Federal Equivalent | Status / Silence Flag |
  | :--- | :--- | :--- |
  | **Parent Company** | The Central Government (e.g., EU Commission, Federal Govt) | **Silence:** Who owns the Parent? In a firm, shareholders own the parent. In a federation, "the people" or "the states" claim ownership. This is ambiguous in the analogy. |
  | **Wholly Owned Subsidiaries** | Member States / Cantons / Länder | **Defect:** Subsidiaries are created/acquired by the Parent. States often pre-exist the Federation (US, Swiss) or join via treaty as equals (EU). |
  | **Ownership of Assets** | Sovereignty / Territorial Jurisdiction | **Smuggling:** In GHM, ownership is a legal title granting residual control. In federalism, sovereignty is often *original* (states) rather than *derived* (center). |
  | **Residual Control Rights** | Legislative Competence / Policy Authority | **Ambiguity:** In firms, residual rights default to the asset owner (Parent). In federations, default rules vary (US/Swiss: states retain residual; EU: conferral principle). |
  | **Objective Function** | Social Welfare / Efficiency (Cost-Benefit) | **Smuggling:** Firms maximize profit (cardinal, single). Federations maximize multiple, incommensurable goods (rights, identity, stability, efficiency). |
  | **The Board** | Constitutional Court / Legislature (determining competence) | **Silence:** A Board represents shareholders. Does the Constitutional Court represent the Center, the Units, or the Citizens? The analogy does not specify the principal. |
  | **Exit (Divestiture)** | Secession / Treaty Withdrawal (e.g., Art. 50 TEU) | **Defect:** Divestiture is a unilateral right of the Parent in a firm. Secession is often constitutionally barred (US/Swiss) or politically catastrophic (EU). |
  | **Decentralization Memo** | Treaty Protocols / Constitutional Clauses (e.g., Art. 5(3) TEU) | **Partial Fit:** A memo is internal policy. A treaty article is binding law enforceable by courts against the Parent. |

  ### 2. Disanalogies (Ranked by Impact on Conclusions)

  I have ranked these by their "load-bearing" status regarding your colleague's two conclusions. High rank means the disanalogy destroys the conclusion; Low rank means it is a friction but does not invalidate the logic.

  **1. The Default Rule of Authority (Impact: Critical on Conclusion 2)**
  *   **Firm:** The Parent holds all residual rights by default; subsidiaries operate on *delegated* authority. The Parent can recentralize at will (subject to internal friction).
  *   **Federation:** In the Swiss and American models (and arguably the EU's principle of conferral), the Units hold all rights by default; the Center operates on *delegated* authority.
  *   **Why it matters:** Your colleague claims Article 5(3) is "self-consuming" (if the Center is more efficient, power moves up). This assumes the Center has the *right* to take the power if efficiency dictates. In the Swiss/American view, the Center *lacks the competence* to act regardless of efficiency, unless the constitution is amended. Efficiency is irrelevant if the jurisdiction is absent. This disanalogy alone falsifies Conclusion 2.

  **2. The Objective Function (Impact: Critical on Conclusion 1)**
  *   **Firm:** Profit is a cardinal, commensurable metric across all subsidiaries. Trade-offs are technical.
  *   **Federation:** Objectives include liberty, local autonomy, cultural preservation, and solidarity. These are incommensurable. Local control may be "inefficient" in Oates' terms but "just" in Quadragesimo Anno terms.
  *   **Why it matters:** Conclusion 1 rests on subsidiarity being *purely* an efficiency principle. If the objective function includes "local dignity" or "political autonomy" as terminal values (not instrumental to efficiency), then minimizing coordination costs is not the sole criterion. The moral vocabulary is not decoration; it defines the objective function.

  **3. Anti-Commandeering and Administrative Separation (Impact: High on Conclusion 2)**
  *   **Firm:** The Parent can fire subsidiary management and install new managers to execute the Parent's will.
  *   **Federation:** *New York v. United States* and *Printz v. United States* (US), and the administrative autonomy of Länder (Germany). The Center often cannot compel state officials to administer federal law.
  *   **Why it matters:** Even if the "scale and effects" test is met, the Center may lack the administrative machinery to execute the decision without the voluntary cooperation of the Units. This creates a transaction cost that is not merely "coordination" but a structural veto, acting as a brake on centralization independent of efficiency.

  **4. Monitoring Rights (Protocol No. 2) (Impact: Medium on Conclusion 2)**
  *   **Firm:** Monitoring flows upward (Board monitors Mgmt) or outward (Shareholders monitor Board). Subsidiaries do not have a formal veto right over Parent strategy based on "reasoned opinions."
  *   **Federation:** National Parliaments can block EU legislation (yellow/orange card system).
  *   **Why it matters:** This institutionalizes a political brake that is not tied to efficiency. A "yellow card" can be triggered even if the Center *could* act more efficiently, simply because the Units object. This contradicts the "self-consuming" claim.

  **5. Pre-existence and Indestructibility (Impact: Low on Conclusion 1, Medium on Conclusion 2)**
  *   **Firm:** Subsidiaries are assets; they can be sold or liquidated.
  *   **Federation:** States are constitutional peers; they cannot be abolished by the Center.
  *   **Why it matters:** This limits the "exit" discipline. However, your colleague's argument is about *allocation of rights*, not liquidation. It matters less for the efficiency calculation than for the bargaining power underlying the allocation.

  ### 3. Smuggled Features

  You identified three features the analogy quietly imports. I agree with all three, and I confirm they are the engine driving your colleague's error.

  1.  **A Single Cardinal Objective:** The analogy assumes "efficiency" (minimizing costs) is the only metric. It imports the firm's profit function into the state's welfare function. This allows the colleague to dismiss the moral vocabulary of *Quadragesimo Anno* as "decoration." In reality, that vocabulary specifies a constraint (rights/dignity) that trumps efficiency.
  2.  **Residual Rights Transferable at Discretion:** The analogy assumes the Parent *owns* the rights and allocates them based on performance. It ignores the constitutional reality that in many federations, the Units *own* the rights and lend them to the Center. This makes the transfer upward legally impossible without unanimous consent (amendment), regardless of efficiency.
  3.  **Exit by Divestiture as Discipline:** The analogy assumes that if the Center misallocates rights, the market (or shareholders) corrects it. In federations, the lack of exit (secession is rare/barred) means the "allocation" is sticky. This stickiness is a feature of the design (to protect minorities), not a friction to be optimized away.

  **Translation Hygiene Note:** Your colleague translates "Sovereignty" as "Asset Ownership." This is a category error. Asset ownership is private law; sovereignty is public law. Ownership implies alienability; sovereignty (in the federalist tradition) implies inalienable authority. By using the firm vocabulary, he renders the concept of *inalienable right* invisible.

  ### 4. Verdict

  **Conclusion 1 (Subsidiarity is purely an efficiency principle): FAILS.**
  This conclusion survives *only* if you accept the smuggled assumption of a single cardinal objective function. Once you acknowledge that federations maximize a vector of goods (efficiency, liberty, identity, solidarity), subsidiarity cannot be reduced to Oates' theorem. The moral vocabulary is not decoration; it is the statement of the weights in the objective function. Specifically, *Quadragesimo Anno* posits a deontological constraint ("injustice," "disturbance of right order") that prohibits certain centralizations even if they are efficient. The holding company analogy has no primitive for "rights that cannot be traded for efficiency."

  **Conclusion 2 (Subsidiarity supplies no brake on centralization): FAILS.**
  This conclusion is an artifact of treating a rule that limits *competence* as though it were a rule that allocates *tasks*.
  *   **The Artifact:** In a holding company, the Parent has the competence to do anything not forbidden; it allocates tasks to subsidiaries for efficiency.
  *   **The Reality:** In the Swiss/American/EU model, the Center has *only* the competence explicitly granted; everything else is forbidden.
  *   **The Swiss Case:** As you noted, Swiss practice pairs subsidiarity with the presumption of cantonal sovereignty. This is the inverse of the corporate structure. In a firm, the Parent is sovereign unless it delegates. In Switzerland, the Canton is sovereign unless the Constitution limits it. Therefore, satisfying the "scale and effects" test is necessary but *not sufficient*. The Center must also prove it has the *jurisdiction*. The analogy fails because it cannot represent "original authority" distinct from "delegated authority."

  ### 5. Alternative Analogy and Economic Concept

  If the holding company analogy fails because it assumes hierarchical ownership and a single objective, you need an analogy that captures **voluntary association of sovereigns with incomplete contracting.**

  **Better Analogy: A Joint Venture (JV) or Consortium of Independent Firms.**
  *   **Structure:** Independent firms (States) form a JV (Federation) to undertake specific projects (Defense, Currency, Trade).
  *   **Governance:** The JV Board requires unanimity or supermajority (not simple Parent control).
  *   **Assets:** Each partner retains ownership of its core assets; only specific assets are pooled.
  *   **Exit:** Partners can withdraw (often at high cost), but the JV cannot liquidate a partner.
  *   **Subsidiarity:** This maps to the JV agreement clause: "The JV will only handle tasks that individual partners cannot handle alone."
  *   **Why it works:** It preserves the pre-existence of the units, the limitation of the center's authority to specific conferrals, and the lack of a single "owner" of the whole.

  **Closest Economic Concept: Mechanism Design with Participation Constraints.**
  *   **The Concept:** Treat the federation as a mechanism where the "types" are the Member States. The "allocation rule" is the division of competence.
  *   **The Constraint:** The *Participation Constraint* (Individual Rationality) is binding. States will only join/remain if the utility of federation > utility of autonomy.
  *   **What it leaves out:** It leaves out the **normative/deontological** dimension. Economics can explain *why* states demand subsidiarity (preference heterogeneity), but it cannot capture the *Quadragesimo Anno* claim that centralization is an *injustice* even if it increases utility. That claim rests on a theory of human dignity and social ontology that is external to standard organizational economics.

  **Final Assessment:** Your colleague's analogy is a category error. It applies a theory of **private hierarchy** (the firm) to a structure of **public covenant** (the federation). It explains the *efficiency trade-offs* of federalism well (Oates), but it cannot explain the *constitutional logic* of federalism (limited government, reserved powers). The silence on "original vs. delegated authority" is not a defect of vocabulary; it is evidence that the claim relies on erasing the defining feature of the target system.
