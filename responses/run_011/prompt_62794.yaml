  **Framing Statement**
  "She argues that because classifications alter the people classified, prevalence rates measure a feedback system's velocity rather than a static quantity. She maintains this view preserves the reality of psychiatric kinds while explaining why some disorders vanish and others persist."

  **Question 1**
  You distinguish your account from Merton's self-fulfilling prophecy by saying the target moves rather than being hit, but how do you distinguish this from the double hermeneutic in social science, where interpreting an action changes its meaning without necessarily changing the underlying behavior?
  *Note: This sits first to pin down the philosophical boundaries of her mechanism before applying it to data.*
  *   **Likely Answer:** She will say the double hermeneutic concerns meaning, whereas looping changes the causal powers and behavioral dispositions of the classified, altering the extension of the kind itself.
  *   **Follow-up:** If the change is in disposition rather than meaning, can you point to a case where the behavior changed but the subject's understanding of themselves did not?

  **Question 2**
  Regarding the mechanism of the loop, does the classified person need to know they are classified for the effect to hold, and how do you account for diagnoses that are recorded in insurance files but never disclosed to the patient?
  *Note: This clarifies the necessary conditions for the loop before we critique its measurement.*
  *   **Likely Answer:** She will argue that indirect publicity suffices; treatment protocols or social responses alter the environment even if the label is hidden.
  *   **Follow-up:** If the environment alters the behavior without the subject's knowledge, isn't that just standard causal intervention rather than a specific looping effect of classification?

  **Question 3**
  You propose replacing base rates with loop velocity, but can velocity be defined at all without assuming that the kind at time one and the kind at time two are the same kind, and if that assumption is licensed, what remains of the argument against base rates?
  *Note: This applies pressure to the coherence of her central metric.*
  *   **Likely Answer:** She will claim we track the lineage of the concept, not the static extension, so the identity is historical rather than numerical.
  *   **Follow-up:** If the identity is historical, doesn't that make velocity a measure of conceptual drift rather than a property of the population you claim to be measuring?

  **Question 4**
  You claim identity-entrenchment slows the loop because the target hardens; can you specify the mechanism by which adopting a category as an identity reduces the feedback sensitivity of the classified group?
  *Note: This pins down the causal claim underpinning her ethical position later.*
  *   **Likely Answer:** She will suggest that organized communities stabilize the interpretation of symptoms, resisting the shifting norms that drive high velocity.
  *   **Follow-up:** If stabilization depends on political organization, does the hardness of the kind vary by the funding available to patient advocacy groups?

  **Question 5**
  Quantities like smoking rates, crime statistics, and unemployment drift for structurally similar reasons without anyone concluding they are unmeasurable; why is psychiatry unique in requiring a new methodology rather than just better controls?
  *Note: This challenges the uniqueness of her thesis using cases outside psychiatry.*
  *   **Likely Answer:** She will argue that psychiatric kinds are interactive kinds where the classification is part of the cause, whereas smoking is a behavior classified by an external observer.
  *   **Follow-up:** But if smokers quit because smoking is classified as harmful, isn't the classification of "smoker" also altering the extension of the kind "smoker" in exactly the same way?

  **Question 6**
  If a category has become load-bearing for a community's self-understanding and politics, is hardening the loop a good thing, and do you have resources to answer that without appealing to the very hermeneutic facts you say defeat measurement?
  *Note: This presses the normative implications of her third claim.*
  *   **Likely Answer:** She will likely say that hardening is ethically neutral but epistemically useful, allowing for stable research without denying the political value.
  *   **Follow-up:** If the epistemic stability depends on the political utility, can you evaluate the validity of the category without taking a stance on the politics of the community using it?

  **Question 7**
  Your denial of anti-realism commits you to something substantive about psychiatric kinds; is this denial a claim about their mind-independent existence, or merely a stipulation about the word real to avoid social constructivist conclusions?
  *Note: This forces clarity on the ontological stakes before the final prediction.*
  *   **Likely Answer:** She will argue it is substantive: the kinds are real because they support successful induction and intervention, regardless of biological essences.
  *   **Follow-up:** If successful intervention defines reality, does a placebo-responsive condition count as more real than a biologically fixed one that resists treatment?

  **Question 8**
  Name one concrete, checkable prediction distinguishing your program from a purely historical narrative of psychiatric concepts, such as a specific disorder where loop velocity predicts disappearance within a defined timeframe.
  *Note: This closes the session by testing the empirical fruitfulness of her program.*
  *   **Likely Answer:** She may cite a currently rising disorder linked to social media exposure that should vanish if the platform changes its algorithms.
  *   **Follow-up:** If the platform changes and the disorder persists, will you accept that as falsification, or will you attribute it to a new loop velocity you hadn't measured?

  **Questions Not to Ask**

  1.  **"Does this mean psychiatry is not a science?"**
      *   *Why not:* She has a rehearsed defense of "human kinds" science that will turn into a monologue about methodology rather than engaging the specific mechanics of looping.
      *   *Invites:* A generic defense of psychiatry's scientific status that bypasses your specific constraints on measurement.

  2.  **"How should clinicians change their practice tomorrow?"**
      *   *Why not:* She is a philosopher of classification, not a guideline writer, and will deflect by saying her work is meta-scientific.
      *   *Invites:* A disclaimer that her work is theoretical, which wastes the time of the clinician in the room who wants practical engagement.
