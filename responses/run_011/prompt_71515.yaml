answer: |-
  The evidence room smelled of ozone and old cardboard. Elara sat alone at the steel table, the device resting on a sheet of anti-static foam. It was ugly, utilitarian: a puck of black polymer, two wires emerging like severed veins. A capacitive discriminator. A two-bitser, the engineers called it, though none of them used the term in depositions anymore. It had one job: to distinguish State A from State B. To say *Here* or *Not Here*.

  At 03:14 on the night of the accident, it had said *Not Here*.
  The worker, Jansen, had been *Here*.
  The auger had started. Jansen was dead.

  Elara picked up the puck. It was lighter than she expected. Inside, there was no ghost, no homunculus watching the wires. There was only a circuit board etched with copper paths, a capacitor plate, and a comparator chip. It measured the dielectric constant of the air immediately surrounding the plate. If the constant shifted beyond a calibrated threshold, the voltage flipped. Zero to one. Off to on.

  Her job, as a licensed Content Auditor, was to sign a certificate stating what that voltage flip *represented*. She was not certifying the voltage. Any multimeter could do that. She was certifying the *aboutness*. She was paid to say whether the machine had been lying about a hand, or telling the truth about humidity.

  The door opened. Marcus stepped in, carrying a briefcase and the weariness of a man who had spent twenty years explaining why water is wet only if you agree to call it water. He had been her supervisor once, before he left the Board to consult for defense firms. He didn't sit. He leaned against the doorframe.

  "You're still holding it," he said.

  "It's evidence."

  "It's plastic and silicon, Elara. It doesn't hold anything." He walked over, looking down at the device in her hand. "You know what the covariance is. We ran the simulations. At the time of installation, dielectric shift correlated perfectly with human presence. Flesh is conductive. But the plant retrofitted the ventilation. Humidity drift increased by forty percent. In the last six months, the sensor has tripped more often on condensation than on hands."

  "The builders calibrated it for hands," Elara said. Her voice sounded flat in the small room.

  "The builders intended it for hands. Intention is a mental state. The machine doesn't have mental states. You're trying to lend it yours." Marcus tapped the table. "Here is the argument, again. If I define the state change as 'Human Presence,' the log is a false negative. The machine failed. The company is liable for faulty safety equipment. If I define the state change as 'Dielectric Threshold Exceeded,' the log is a true negative. The threshold wasn't met. The worker was wearing non-conductive gloves in a high-humidity zone. Protocol violation. Worker liability."

  "Jansen is dead, Marcus."

  "And the physics don't care. The question is: what did the state *mean* at 03:14? You want to say it means what the engineers wrote in the manual. I'm saying it means what the physical environment forced it to track. The machine never knew about hands. It only knew about capacitance. You're the one adding the hand."

  Elara set the puck down. "If meaning is just what we assign, then my certificate is worthless. I'm just stamping a preference."

  "No," Marcus said, softening. "You're stabilizing a network. That's all any of us do. But don't pretend you're discovering a fact inside the box. There's nothing in there but cause and effect. The 'about' is out here." He tapped his own temple, then pointed at her. "And I'm not sure it's even in there."

  He left her with the device and the silence.

  ***

  Elara drove home without turning on the radio. The city was a grid of lights, each one a signal someone had agreed to read as *Stop* or *Go* or *Danger*. She parked in her garage and sat for a moment, watching the engine tick as it cooled.

  In her study, she kept her own certification framed on the wall. Class 4 Content Auditor. It authorized her to interpret the states of automated systems for legal purposes. She stood beneath it, pouring a glass of water.

  She looked at her hand holding the glass. She knew it was a hand. She knew it was glass. But how did she know?

  She thought of the neural pathways in her own brain. Electrochemical signals firing across synapses. If you opened her skull, you would find no "glass" label attached to the visual cortex. You would find patterns of activation caused by light reflecting off silica. Those patterns were caused by the world, just as the voltage in the black puck was caused by the humidity in the silo.

  Why was her state *about* the glass, while the puck's state was merely *covarying* with the humidity?

  She had been trained to recognize this feeling. Her professors had corrected her usage of words until her internal states aligned with the community's standards. If she said "This is a table" when pointing at a chair, she was corrected. Painfully. Repeatedly. Over years, her brain had been calibrated to output labels that matched the expectations of her linguistic community. Her intentionality was derived from them. It was borrowed confidence.

  She walked to the window. The reflection showed a woman in a dark room. If she vanished, would the reflection lose its meaning? Or was the meaning only ever in the eye of the viewer?

  She thought of Jansen's family. They needed the company to be liable. They needed the machine to have meant *Hand*, and failed. If she certified the physicalist reading—that the machine meant *Capacitance* and told the truth—the blame shifted to the dead man's gloves. The network of liability would reroute around the grave.

  But if she certified the intentional reading, she was lying about the physics. She was asserting that the machine had a purpose it couldn't hold. She would be treating the puck as more than it was, to protect the memory of a man who was less than he needed to be.

  Marcus was right about the machine. But he was wrong about the difference. She was a biological machine calibrated by a society of other biological machines. Her certainty was just a stable state in a large network. There was no original intentionality in her head to lend to the puck. There was only the drift, and the correction.

  She sat at her desk and opened the case file. The certificate lay on top, a single page requiring her signature and a code.

  *Option 1: Semantic Mapping A (Builder Intent).*
  *Option 2: Semantic Mapping B (Physical Covariance).*

  If she chose A, she affirmed that machines could carry meaning. She upheld the profession that paid her mortgage. She gave the family their recourse.
  If she chose B, she admitted that meaning was a ghost we project onto gears. She cleared the company. She honored the physics.

  She picked up her pen. It was a heavy thing, balanced for signing. She hovered it over the paper.

  She thought about the silence in the evidence room. The puck didn't care. It had done exactly what the laws of physics demanded. The log was perfect. The tragedy was in the mapping, not the mechanism.

  She thought about her own training. The years of study. The exams. The way her colleagues nodded when she used the correct terminology. She was a device that outputted "Valid" when presented with the right stimuli. Who was auditing her?

  There was no one. There was only the next state, and the next.

  She realized then that signing was not an act of discovery. It was an act of closure. It stopped the infinite regress of interpretation. Someone had to say *This is what it was*. Not because it *was* that, inherently, but because the court needed a boolean value to process the claim. True or False. Liable or Not.

  Her hand trembled, just once. A micro-spasm in the muscle. A physical event. She assigned it the meaning *hesitation*. Was that true? Or was it just a tremor, and the meaning was something she was laying over it to make sense of the narrative?

  It didn't matter. The network required a signal.

  She lowered the pen. The nib touched the paper. The ink flowed, a dark liquid bonding with the fiber. She was not recording the truth of the machine. She was not recording the truth of herself. She was creating a fact that would outlast both.

  She checked the box for Physical Covariance.

  The company would walk. The family would sue for negligence in training, a harder path, but an honest one. The machine had not lied. It had never known how to speak.

  Elara capped the pen. She looked at the signature. It looked like a waveform, a trace of voltage over time. It meant *Elara*, because everyone agreed it did. If she died, it would become just a scribble.

  She blew on the ink to dry it. The air moved across the page, cooling the wet pigment. She watched the shine disappear as the liquid vanished into the paper, leaving only the stain behind.
