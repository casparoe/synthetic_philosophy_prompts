prompt: |-
  I'm putting together material on whether generations are real kinds or just journalism with birth years attached, and I need a case built to order.

  Design a thought experiment with two cohorts in one mid-sized country, matched as closely as you can on class mix, region, schooling, media diet, and the width of the birth window (both roughly 15 years wide, arbitrary cut points included), and differing on exactly one thing: whether the disruptive event they all lived through hit them at the same age or at staggered ages. So cohort A all ran into the shock — pick something realistic, a currency collapse, a war that ends, the arrival of a technology, an epidemic — between 14 and 16, while cohort B spanned ages 11 to 24 when it landed, spread out by family and region. One paragraph for the scenario, no sci-fi, no state engineering of birth timing, and don't let the two cohorts differ in size or in how much attention journalists paid them afterwards.

  Then run the check. What does each of these say about whether A and B are genuine kinds, and about where the boundaries have to go: (i) Mannheim's distinction between generational location and a generation as actuality, along with his fresh contact idea; (ii) a homeostatic property cluster account of social kinds, on which a kind is real if some mechanism keeps its properties hanging together and the term licenses projectible inferences; (iii) an eliminativist who holds that any 15-year bucket will throw up apparent cohort effects and that the boundaries get picked by whoever is selling the story. Say explicitly which of the three predicts A and B differ in kindhood and which predicts they're the same.

  The point is to test whether cohort kindhood comes from a shared mechanism or from bucket width, so stipulating the verdicts doesn't count — they have to fall out of each account's own criteria. Finish by telling me which feature of the design is doing the work, what happens to the three verdicts if I break the matching (let A and B differ in class mix aswell), and how a defender of whichever view comes out worst would attack the case instead of accepting it.
reasoning: |-
