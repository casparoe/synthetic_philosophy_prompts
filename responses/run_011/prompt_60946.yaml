answer: |-
  # The Methodological Diagnostic: "Where Do You Stand?"

  **Instructions:** Read each vignette. Choose the option that best reflects your *methodological* intuition about how to study or explain the phenomenon. Do not choose the answer you think your department prefers; choose the one that feels most true to how you think causality works.

  ### The Questions

  **1. The Bank Run**
  A bank fails. Every depositor withdraws funds on the same day. Post-event interviews show every depositor acted solely because they believed *others* would withdraw; privately, most trusted the bank's solvency.
  *   **A.** The cause is the aggregate pattern of beliefs. The "run" is nothing over and above the sum of these individual decisions.
  *   **B.** The cause is the structural fragility of the banking system. The specific beliefs are just the trigger; the system's rules made the collapse inevitable once a threshold was crossed.
  *   **C.** The vignette is insufficient. Without knowing what sparked the initial belief (a rumor? a news report?), we cannot assign cause to either structure or psychology.

  **2. The Enduring Norm**
  In a workplace, everyone arrives at 8:00 AM. Surveys reveal no one personally prefers this time, and everyone believes everyone else hates it. Yet, the pattern persists for decades without a written rule.
  *   **A.** The norm exists only because individuals continue to choose to comply. If you explain the choices, you have explained the norm.
  *   **B.** The norm is a constraint that exists independently of current preferences. It shapes the choices, so it must be part of the explanation.
  *   **C.** The description is contradictory. If no one endorses it and no one enforces it, the pattern would dissolve immediately.

  **3. The Simulation Parameter**
  You run an agent-based model to reproduce urban segregation. Model 1 generates segregation from simple individual preferences for neighbors. Model 2 requires you to manually set a global variable called "Neighborhood Tension" to make the pattern appear.
  *   **A.** Model 1 is superior. It explains the macro pattern using only micro rules.
  *   **B.** Model 2 is acceptable. "Neighborhood Tension" captures a real environmental factor that individuals respond to, even if they don't calculate it.
  *   **C.** Both are flawed. Model 1 ignores history; Model 2 assumes a cause without explaining its origin.

  **4. Statistical Discrimination**
  Hiring data shows a firm rejects applicants from Group X at higher rates. The hiring managers say they are using "efficiency heuristics" based on past performance data, not personal prejudice.
  *   **A.** The explanation is complete. The managers are optimizing individuals responding to information constraints.
  *   **B.** The explanation is incomplete. The "past performance data" reflects historical structural barriers, which are the true cause.
  *   **C.** The vignette is insufficient. We cannot distinguish between rational heuristic use and internalized bias without psychological testing.

  **5. "The Market Overreacted"**
  A financial headline reads: "The Market Overreacted to the News."
  *   **A.** This is metaphorical shorthand. Literally, thousands of traders adjusted prices based on new information.
  *   **B.** This is literally true. Market dynamics (liquidity, algorithms) create reactions that no specific trader intended or executed.
  *   **C.** This is journalistic noise. It treats a statistical outcome as an agent, which is a category error.

  **6. Inflation**
  Prices rise across an economy. A specific shopkeeper raises prices to maintain margins, not to cause inflation.
  *   **A.** Inflation is just the name we give to the collection of individual price changes.
  *   **B.** Inflation is a systemic property that changes the value of money, regardless of any single shopkeeper's intent.
  *   **C.** Inflation is a policy outcome created by central bank actions, distinct from both shopkeepers and money value.

  **7. Wanting a Job**
  A subject says, "I want a job."
  *   **A.** We can describe this desire fully using psychological terms (need for income, status, activity) without referencing "employment" as an institution.
  *   **B.** We cannot describe this desire without referencing the institution of "employment." The desire itself is constituted by the social role.
  *   **C.** The desire is biological, but the object of the desire is social.

  **8. The Recession**
  GDP falls for two consecutive quarters.
  *   **A.** The cause must be traceable to specific decisions by households or firms to spend less.
  *   **B.** The cause is the business cycle. It is a regularity of the system that occurs regardless of specific decisions.
  *   **C.** The vignette is insufficient. A recession is a classification applied after the fact; it has no single cause type.

  **9. The Traffic Wave**
  Cars on a highway come to a halt, then move, in a wave pattern moving backward against traffic. No accident occurred.
  *   **A.** The wave is an illusion. It is just Car A braking, causing Car B to brake harder, etc.
  *   **B.** The wave is a real object of study. It has speed and density properties that no single car possesses.
  *   **C.** The wave is a useful model, but ontologically it is just the cars.

  ***

  ### Scoring Key: Mapping Your Commitments

  Do not sum the numbers. Instead, tally your choices across three dimensions. This reveals your methodological profile.

  **Dimension 1: Ontological Autonomy (The "What Exists" Axis)**
  *Count your **B** answers in Q1, Q2, Q6, Q9.*
  *   **Low Score (Mostly A):** You believe social facts are nothing over and above individuals.
  *   **High Score (Mostly B):** You believe social facts have properties independent of individuals.

  **Dimension 2: Explanatory Termination (The "Where It Stops" Axis)**
  *Count your **A** answers in Q3, Q4, Q8.*
  *   **High Score (Mostly A):** You believe a complete explanation must bottom out in individual actions/mechanisms.
  *   **Low Score (Mostly B/C):** You believe explanations can legitimately stop at systemic regularities or historical structures.

  **Dimension 3: Conceptual Interdependence (The "Mind" Axis)**
  *Look at Q5 and Q7.*
  *   **Mostly A:** You believe individual attitudes can be described in non-social terms (psychological/biological).
  *   **Mostly B:** You believe individual attitudes are constituted by social concepts.

  **The "Pragmatist" Flag**
  *If you selected **C** on two or more of Q1, Q4, or Q8:* You reject the premise that these cases can be settled theoretically without more empirical data.

  ***

  ### The Map: 8 Methodological Leaves

  Locate yourself on the grid below. There are 6 occupied positions (real schools of thought) and 2 empty positions (logical problems).

  #### 1. The Atomist (Low Autonomy, High Termination, Low Interdependence)
  *   **Typical Answers:** Q1-A, Q2-A, Q3-A, Q4-A, Q5-A, Q7-A.
  *   **The Commitment:** Social science is applied psychology or rational choice.
  *   **The Awkward Commitment:** You must argue that institutions like "marriage" or "currency" have no causal power other than the sum of individual choices, making it hard to explain why individuals face constraints they didn't choose.
  *   **Discipline:** Neoclassical Economics, Evolutionary Psychology.

  #### 2. The Mechanism-Seeker (Low Autonomy, High Termination, High Interdependence)
  *   **Typical Answers:** Q1-A, Q2-A, Q3-A, Q4-B, Q5-A, Q7-B.
  *   **The Commitment:** Explanations must show how individuals act, but those individuals are shaped by social meanings.
  *   **The Awkward Commitment:** You must explain how social meanings exist to shape individuals without granting those meanings independent causal status. You walk a tightrope between structure and agency.
  *   **Discipline:** Analytical Sociology, Weberian Sociology.

  #### 3. The System-Builder (High Autonomy, Low Termination, Low Interdependence)
  *   **Typical Answers:** Q1-B, Q2-B, Q3-B, Q4-A, Q5-B, Q7-A.
  *   **The Commitment:** Systems have dynamics that can be modeled independently of the specific agents running them.
  *   **The Awkward Commitment:** You treat individuals as interchangeable carriers of system variables. If the agents changed their psychology entirely, you claim the system would behave the same way.
  *   **Discipline:** Systems Theory, Some Agent-Based Modelling, Functionalism.

  #### 4. The Structural Realist (High Autonomy, Low Termination, High Interdependence)
  *   **Typical Answers:** Q1-B, Q2-B, Q3-B, Q4-B, Q5-B, Q7-B.
  *   **The Commitment:** Social structures are real, they constrain explanation, and they define who we are.
  *   **The Awkward Commitment:** You risk making social change impossible to explain. If structures define individuals and exist independently, how do individuals ever act to change the structure?
  *   **Discipline:** Durkheimian Sociology, Marxism, Historical Institutionalism.

  #### 5. The Pragmatist (The "C" Cluster)
  *   **Typical Answers:** Multiple **C** selections on Q1, Q4, Q8.
  *   **The Commitment:** Ontological debates are sterile; the "right" level of analysis depends on the specific research question.
  *   **The Awkward Commitment:** You lack a unified theory of society. You must defend yourself against charges of eclecticism or inconsistency when your explanation shifts levels between chapters.
  *   **Discipline:** Economic History, Policy Studies, Applied Research.

  #### 6. The Interpretivist (Low Autonomy, High Termination, High Interdependence + Nuance)
  *   **Typical Answers:** Q1-A, Q2-A, Q3-C, Q4-B, Q5-C, Q7-B.
  *   **The Commitment:** Social reality is constituted by meaning; explanation requires understanding (Verstehen), not just causal modeling.
  *   **The Awkward Commitment:** You cannot easily generalize. If every social fact is dependent on specific local meanings, comparative analysis becomes methodologically perilous.
  *   **Discipline:** Cultural Sociology, Anthropology, Phenomenology.

  #### 7. The Empty Cell: The "Ghost Mechanist" (High Autonomy, High Termination)
  *   **Status:** **Logically Incoherent.**
  *   **Why:** You cannot claim social facts exist independently of individuals (High Autonomy) *and* insist that all explanations must bottom out in individual actions (High Termination). If the fact is independent, the individual action cannot fully explain it.
  *   **Who lands here:** Students who say "Structures are real, but only people do things" without resolving the tension.

  #### 8. The Empty Cell: The "Black Box" (Low Autonomy, Low Termination, Low Interdependence)
  *   **Status:** **Unexplored / Behaviorist.**
  *   **Why:** You claim social facts aren't real (Low Autonomy), individuals aren't socially defined (Low Interdependence), yet you explain things via system regularities (Low Termination). This is pure behaviorism: ignore the mind, ignore the structure, just predict input/output.
  *   **Who lands here:** Radical Positivists who refuse to discuss "causes" and only discuss "correlations."

  ***

  ### Limitations of this Instrument

  Be upfront with your students: This diagnostic distinguishes **commitments**, not **competence**.
  1.  **It cannot distinguish** between a *good* Structural Realist and a *lazy* one who invokes "structure" to avoid gathering data.
  2.  **It cannot distinguish** between an Atomist who has carefully modeled interactions and one who simply ignores them.
  3.  **It assumes** that "Individual" and "Social" are the only two categories. It does not account for materialist ontologies (e.g., geography, technology) that fit neatly into neither.

  **Discussion Prompt:** "Look at your leaf. Now look at the person next to you. If you are on different leaves, are you actually disagreeing about the world, or are you just asking different questions?"
