answer: |-
  This is a precise and painful intersection of moral philosophy, neuroscience, and family dynamics. You are asking whether the normative force of a reason depends on its motivational grip, and whether your own intellectual consistency requires you to surrender your position. You are also asking how to speak without lying.

  Here are the answers to your three questions, in order.

  ### 1. The Truth Value of "You Have a Reason"

  The sentence *"You have a reason to be near her"* is ambiguous. It conflates two distinct categories of reasons: **normative reasons** and **motivating reasons**.

  *   **Normative Reasons:** These are facts that count in favor of an action, regardless of the agent's psychology. (e.g., "She is your mother," "She is dying," "Presence provides comfort.") In this sense, the sentence is **true**. There are objective facts about the world and your family structure that make proximity a good and right thing.
  *   **Motivating Reasons:** These are psychological states that actually move an agent to act. (e.g., "I feel duty," "I feel love," "I fear regret.") In this sense, the sentence is **false** regarding your brother. As he has demonstrated through therapy, journaling, and the trial run, those facts do not generate a motive in him.

  Your brother is arguing from a position known in philosophy as **Internalism** (most notably associated with Bernard Williams): *A cannot have a reason to $\phi$ unless $\phi$-ing connects to A's subjective motivational set.* He is saying, "I have scanned my motivational set. There is no hook for this reason. Therefore, it is not a reason *for me*."

  You are arguing from **Externalism**: *Reasons exist independently of the agent's desires.* You are saying, "The fact of her need creates a reason, whether you feel it or not."

  **The Verdict:** The sentence is **true** normatively but **false** pragmatically. When you say it to him, you intend it as a normative claim (there is an obligation), but he hears it as a psychological claim (you should feel moved). Because he has empirically verified that he is not moved, your statement sounds to him like a denial of his self-knowledge.

  Does his due diligence shift the answer? Yes. If he were in denial, the normative reason might eventually become a motivating one. But because he has tested the connection between the fact (mother dying) and the motive (desire to be near) and found it null, the gap is likely constitutive, not epistemic. He does not lack *information*; he lacks the *mechanism* by which that information translates into action. To insist he has a reason *in the sense that matters for action* is to insist he is broken. To insist he has a reason *in the sense of moral fact* is to insist the universe has order. Both are true, but they are talking past each other.

  ### 2. The Researcher vs. The Brother

  Your column does not commit you to accepting his verdict, but it does commit you to suspending **moral blame**. There is a principled difference between the researcher and your brother, but it does not save you from the conclusion that you cannot blame him.

  **The Researcher:** She knew the moral reason (report fraud) but was **coerced** by survival reasons (visa, career). The moral reason *had purchase*, but it was overridden by a greater force. She was in a conflict of reasons. Your defense was that blame is inappropriate when the cost of acting on the moral reason is existential. She was *prevented* from acting.

  **The Brother:** He claims the moral reason has **no purchase**. He is not overridden; he is unmoved. He is not *prevented* from moving; he is *uninclined*.

  **The Consistency Check:**
  Your column argued that condemnation assumes the person *could have been moved*. If your brother is correct that nothing in him *can* answer to this reason (despite his best efforts to find it), then by the logic of your column, he is not a proper subject of moral condemnation. You cannot blame a man for lacking a capacity he does not possess. If he truly lacks the capacity to be moved by filial proximity (absent the crisis of hands-on care), then calling him "selfish" or "wrong" is indeed projection.

  **However,** there is a distinction between **blame** and **grief**.
  Your column defended the researcher against the label of *coward*. It did not argue that her supervisor's fraud was acceptable, or that the loss to science was negligible.
  Similarly, you can accept that your brother is not "bad" (blame) while maintaining that his absence is a loss (grief). The column protects him from your *judgment*, but it does not protect him from the *consequences* of his nature. The researcher kept her visa but lost her integrity; your brother keeps his distance but loses the relationship as you conceive it.

  So, does the column vindicate him? It vindicates him against the charge of **moral failure**, but not against the charge of **incompatibility**. You can hold that he is not doing wrong (because he cannot do otherwise) while simultaneously holding that you cannot accept this arrangement (because it violates your needs). The difference is that the researcher's situation was temporary and coercive; your brother's situation appears to be a permanent feature of his psychology.

  ### 3. What To Say and What Is Permissible

  You asked if it is permissible to keep asserting a claim you may not believe is true *of him*.
  **No.** It is not permissible, because it is intellectually dishonest. If you accept the neuroscience you write about—that the gap between knowing and being moved is real and sometimes unbridgeable—then telling him "You have a reason" is functioning as you suspected: pressure dressed up as information. It gaslights his phenomenology. He knows he isn't moved. You telling him he *should* be implies he is lying or blind. He is neither.

  You also asked if switching to "I want you here" is a smaller, meaner thing.
  **No.** It is a more rigorous thing.
  *   "You have a reason" is a claim about **him**. It claims authority over his interior landscape. It is vulnerable to his empirical refutation (which he has provided).
  *   "I want you here" is a claim about **you**. It is immune to his refutation. He cannot argue with your desire.

  **The Strategy:**
  Stop trying to close the gap between knowing and being moved in him. You have written a decade of copy suggesting that gap is a fundamental feature of human neurology. You are now trying to therapy it away in your own home. Accept the gap.

  The honest move is to stop asserting the normative reason *for* him and start asserting the relational cost *to* you.
  *   **Do not say:** "You should be here because she needs you." (He agrees she needs money/logistics, and he provides that. He disputes the need for *him*.)
  *   **Do say:** "I accept that you are not moved to be here. I no longer believe you can be. But I am moved to want you here. This creates a distance between us that I grieve."

  This is not "smaller." It is an escalation of honesty. It removes the moral high ground you were standing on (which he knocked out from under you) and leaves you standing on your actual ground: your love for your mother and your desire for your brother.

  **The Risk:**
  The risk of the column's logic is that it leads to a cold peace. If he is not blameworthy, and you are not "wrong" for wanting him, you are left with a tragedy rather than a conflict. A conflict can be solved; a tragedy must be endured.
  If you stop asserting the reason, you stop fighting the war. But you also stop expecting him to surrender. You surrender instead. You accept that he is the kind of man who loves his mother through spreadsheets and checks, not through presence.

  **Conclusion:**
  1.  The sentence is normatively true but motivationally false. Stop using it as a lever.
  2.  Your column exempts him from blame, but not from the relational consequences of his nature.
  3.  Speak only from your own desire, not his obligation. It is not meaner; it is the only thing left that is undeniably true.

  You are a journalist covering the gap between knowing and being moved. You have found the story in your own house. The rigorous answer is to file the copy, not try to edit the subject.
