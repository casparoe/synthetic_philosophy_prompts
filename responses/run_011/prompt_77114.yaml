      *   **Situation:** Younger brother (36, structural engineer) lives 2 hours away from their mother (progressive neurological condition, cognition intact, mobility declining). Brother handles finances/logistics perfectly but refuses to move closer or provide physical company *now*. He promises to move if hands-on daily care is needed. Mother says she doesn't want him if he resents her.
      *   **Brother's Stance:** Not in denial, not selfish in the ordinary sense (pays for everything). Has done "the thinking": read books, therapy, lived with her for 9 weeks, kept a journal. Conclusion: "I know everything you know and want none of it." He challenges the nature of "reasons."
      *   **User's Dilemma:** The user previously wrote a column defending a researcher who didn't report misconduct because she wasn't *moved* by the moral reason (due to visa/job risks). The user argued blame assumes the person *could* have been moved. Now, the user fears this same logic vindicates the brother.
      *   **Request:** A rigorous answer, not sympathetic. No scripts, no mediation advice. Three specific questions to answer in order.
      *   **Tone:** Intellectual, precise, philosophical, respectful of the user's expertise, avoiding clichés.

  2.  **Deconstruct the Three Questions:**

      *   **Q1: Is "You have a reason to be near her" true, false, or neither?**
          *   *Philosophical Context:* Internalism vs. Externalism about reasons.
          *   *Internalism (Williams):* A reason must connect to the agent's "subjective motivational set." If nothing moves him, he has no internal reason.
          *   *Externalism:* Reasons exist independently of motivation (moral facts, family obligations).
          *   *The Brother's Challenge:* He's essentially arguing a hard Internalist position. "If it doesn't move me, it's not *my* reason."
          *   *The User's Intuition:* There *is* a reason (filial duty, care), regardless of his motivation.
          *   *Analysis:* The statement is likely *true* in an externalist/objective sense (there are facts that count in favor of the action), but *false* (or inert) in an internalist/psychological sense (it doesn't function as a motive for him).
          *   *Nuance:* The brother has done the "due diligence" (therapy, trial run). This strengthens his Internalist claim. He isn't ignoring the reason; he's tested it and found it lacks traction.
          *   *Verdict:* It is true that there are *considerations* counting in favor, but calling it *his reason* implies a normative force he doesn't feel. The statement is category-confused. It treats an external obligation as an internal motive.

      *   **Q2: Does the column commit the user to accepting the brother's verdict?**
          *   *The Column's Argument:* Blame requires the capacity to be moved by the relevant consideration. If the consideration has no "purchase," blame is projection.
          *   *The Researcher Case:* Coercive context (visa, career). The cost of acting on the moral reason was existential. The moral reason was *overridden* by survival reasons.
          *   *The Brother Case:* No existential threat. He is choosing comfort/career stability over presence.
          *   *Key Distinction:* *Incapacity* vs. *Unwillingness* (or different weighting).
          *   *Researcher:* The moral reason *had* purchase, but was crushed by survival needs. She acknowledged the wrongness but couldn't act.
          *   *Brother:* He claims the moral reason has *no* purchase ("I want none of it").
          *   *Is there a principled difference?* Yes. The researcher was in a *conflict of reasons* where survival won. The brother is claiming a *lack of reason*.
          *   *However:* If the user's column argues that moral blame is invalid if the agent isn't moved, then logically, the brother is exempt from *moral blame* (resentment/condemnation). But he is not exempt from *evaluation*.
          *   *Refinement:* The column defends against *blame* (moral condemnation), not against *disappointment* or *relational consequence*. The user can hold that the brother isn't "evil" (like the researcher wasn't a "coward") but still maintain the reason exists objectively.
          *   *Verdict:* The column commits the user to suspending *moral condemnation*, but not to agreeing that the reason doesn't exist. The difference lies in the nature of the obstacle (external coercion vs. internal motivational gap).

      *   **Q3: What to say next? Is it permissible to keep asserting the claim?**
          *   *The Problem:* Asserting "You have a reason" when he says "I don't feel one" is a conversation stopper. It becomes "pressure dressed up as information."
          *   *The Alternative:* "I want you here." (Honest, vulnerable).
          *   *Is "smaller and meaner"?* No, it's more accurate. It shifts from normative claim (which he refutes) to relational desire (which is undeniable).
          *   *Permissibility:* It is intellectually dishonest to keep asserting an external reason as if it were an internal motive for him. It damages the relationship by invalidating his self-knowledge.
          *   *Strategy:* Acknowledge the truth of his phenomenology (he isn't moved) without conceding the objective value of presence.
          *   *Verdict:* Stop asserting the reason *for him*. Start asserting the desire *from you*. This preserves integrity without gaslighting him.

  3.  **Drafting the Response (Iterative Process):**

      *   *Tone Check:* Needs to be sharp, philosophical, not therapeutic. Use terms like "normative force," "internalism," "phenomenology."
      *   *Addressing Q1:* Distinguish between "reasons for action" (objective) and "motivating reasons" (subjective). Bernard Williams is the key reference here. The brother is right about the motivating reason; the user is right about the normative reason. The sentence is ambiguous.
      *   *Addressing Q2:* The researcher case is about *overpowering* reasons (survival vs. ethics). The brother case is about *absent* reasons (ethics vs. preference). The column protects him from *blame*, not from *consequence*. The distinction is between *excuse* and *justification*.
      *   *Addressing Q3:* The shift from "You ought" to "I need." This isn't smaller; it's more rigorous. It admits the gap the user writes about.

  4.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction on Q1:* I need to be careful not to just say "It's subjective." The user believes there *is* a reason. I should validate that there are objective facts (she is dying, you are her son) that constitute reasons, even if they don't motivate. So the sentence is *true* normatively, but *useless* psychologically.
      *   *Correction on Q2:* The researcher knew it was wrong but couldn't act. The brother says it's not a reason. The column argues against *blame* based on incapacity. The brother claims incapacity of motivation. So the column *does* protect him from blame. But the user can still feel grief. The distinction is between *moral judgment* and *relational grief*.
      *   *Correction on Q3:* The user asks if it's permissible to assert something they might not believe is true *of him*. If the user believes the reason exists objectively, they can assert it exists, but not that it *moves* him. But practically, telling him "You have a reason" sounds like "You should be moved." Better to say "I value this."

  5.  **Final Polish:**
      *   Ensure the structure follows the three questions strictly.
      *   Maintain the "rigorous not sympathetic" constraint.
      *   Acknowledge the user's professional focus (the gap between knowing and being moved).
      *   Make sure the distinction between the researcher and the brother is clear (Coercion vs. Constitutive lack).

  6.  **Final Review against constraints:**
      *   No scripts? (Check. Provide principles, not lines.)
      *   No mediation advice? (Check.)
