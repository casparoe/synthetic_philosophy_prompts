      *   Answer in order? (Check.)

  *(Self-Correction during final review)*: I need to make sure I don't sound like I'm taking the brother's side entirely. The user is struggling with the *truth value* of their claim. I need to validate that the claim has truth value (externalism) even if it lacks motivational force (internalism). The brother is a "rationalist" about reasons (Williams style). The user is a "moral realist." Both can be true simultaneously.

  Let's write.

  *Structure:*
  1.  Introduction acknowledging the gravity and the intellectual frame.
  2.  Section 1: The Ontology of Reasons (Internal vs. External).
