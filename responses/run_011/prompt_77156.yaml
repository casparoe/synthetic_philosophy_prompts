      *   **Conflict:** The user raised a confounding variable objection (language tracks history/institutions, doesn't cause behavior). The presenter dismissed this with "Language shapes thought, that's settled" (Linguistic Relativity/Sapir-Whorf).
      *   **Task:**
          1.  Disambiguate the slogan "Language shapes thought" into distinct claims (trivial to radical).
          2.  For each claim: Define evidence pro/con and current status.
