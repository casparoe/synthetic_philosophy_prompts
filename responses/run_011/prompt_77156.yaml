      *   *Claim 2: The Habitual Attention Effect.* Speaking a language makes certain distinctions more salient or easier to access online. (Weak Relativity).
      *   *Claim 3: The Conceptual Structuring Effect.* Language categories shape non-linguistic conceptual representations (e.g., how you visualize time). (Strong Relativity).
