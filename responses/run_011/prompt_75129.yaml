  10. *(Final check on Hunch 2)*: The user says "spraying an area might not reduce total suffering... if population is compensatory." For ticks, density dependence is weak in the short term. For mosquitoes, it's strong. I need to make sure the distinction is clear. If the user treats all insects the same, Hunch 2 is a trap.

  11. *(Final check on Hunch 5)*: "Is a big drop in biomass a harm or a relief?" This is the "Wild Animal Suffering" (VAS) debate. For a grounds manager, this is abstract. The practical version is: "Does preventing birth (via habitat removal) beat killing adults?" I should reframe this to be actionable.

  12. *(Final check on Budget)*: $15k over 3 years is $5k/year. That's basically one summer intern or some lab assays. It's not enough for major ecological modeling. The agenda must fit this constraint.

