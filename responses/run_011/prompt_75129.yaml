prompt: |-
  You're going to play the role of someone who knows the animal-ethics literature *and* has actually spent time in applied entomology — the kind of person who can read a sweep-net survey and also tell me where an argument has a hole in it. Think hard about this before you answer. Don't jump to conclusions: brainstorm out loud first, dump every candidate open question you think is genuinely live in this space (including ones I haven't thought of), and only then rank them.

  Background, sorry it's long. I manage the grounds for a small college — about 90 acres, athletic fields, an ornamental pond, a lot of oak, and a tick problem that student health services emails me about roughly twice a month. For the last three years I've been reading about insect sentience and insect welfare on my own. No academic background, I did one ethics elective about 20 years ago and mostly just remember the trolley problem. At this point I have alot more questions than decisions and I want to fix that.

  The resources are concrete: about 10 hours a week of my own time that isn't job time, a $15,000 discretionary line I can point at pilots and trials on my own property, and realistically three years before I move on or the board turns over. I want to spend that on the questions that matter, not the ones that are fun to chew on at 11pm.

  So: which open questions in the ethics of killing insects — pest control specifically, not insect farming and not wild animal suffering in general — deserve the most attention given that budget, and in what order? Not a survey. I want a defended agenda. For each of the top few, tell me what makes it upstream of the others, whether a person with a grounds crew and no lab could actually move it, and what would change your mind about where it sits in the ranking.

  Here are my own hunches, which I'm sure are partly wrong. I want you to check them, not work around them:

  1. Everyone treats "how many insects does this kill" as the metric and I think that's backwards. What matters is how bad each death is, and a fast broad-spectrum knockdown might be better than the supposedly gentler slow stuff — growth regulators that make an animal fail to molt for days, or sublethal doses that just stop it feeding. Nobody seems to have worked this out.
  2. Related: spraying an area might not reduce total suffering at all if the population is compensitory — the survivors breed up, roughly the same number of insects get born that season, just different individuals dying differently. If that's right, kill counts are close to meaningless and the only number that matters is how much you shift the equilibrium.
  3. Individual consumer choices (organic or not, whether you spray your tomatoes) are a rounding error next to area-wide institutional treatments, so anything that only helps people feel better about their own garden isn't worth three years of my life.
  4. The Bti-dunks-in-the-pond option gets treated as the clean compromise for mosquitoes and I don't believe it is.
  5. And the one that keeps me up: if most wild insects die young and badly, is a big drop in insect biomass a harm or a relief? I can't tell whether that question changes what I spray or whether it's the kind of thing that just paralyzes you into inaction.

  Please be committed in your answer. Give me an actual ordering, say how much more confident you are in the top one than the third, and flag which of my five hunches are load-bearing on a mistake — especially hunch 2, because a lot of my thinking leans on it and I'd rather find out now. And if the whole framing is broken — if you think someone in my position can't usefully contribute to any of this, or if I've run together a question about what to *do* and a question about what to *research* and that's why it feels stuck — say that plainly at the top rather than giving me a polite answer to a question that shouldn't have been asked. No bibliography and no reading list, please; I can't chase papers anyway.
