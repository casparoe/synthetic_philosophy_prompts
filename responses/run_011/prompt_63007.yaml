  2. Number sceptics forbid aggregation entirely and thus cannot condemn the million-person risk case, while outright aggregators abandon the individualist restriction that defines contractualism, and save-the-many variants lack a principled account of why some numbers count but others do not.
  3. I will reconstruct the reasonable rejection test to evaluate principles based on the ex ante expected burden imposed on a representative individual over a complete life, rather than the ex post harm suffered in a single instance. This avoids the arbitrariness of bolting on a threshold because it derives the weight of complaints from the structure of rational choice under uncertainty instead of stipulating a cut-off point.
  4. A successful argument would demonstrate that a principle permitting diffuse risks is reasonably rejectable because the cumulative expected loss to any single individual exceeds the burden of the alternative principle when viewed temporally. This preserves the pairwise comparison format while generating the intuitive verdict that spreading mortal risks is impermissible even when no single person is likely to die.
  5. The project fails if this lifetime framing merely smuggles interpersonal aggregation back in through the back door by treating distinct individuals as temporal slices of a single agent. I must also ensure the argument remains concise enough for 6,000 words, otherwise the technical defence against this collapse will prove too big for the assigned length.
