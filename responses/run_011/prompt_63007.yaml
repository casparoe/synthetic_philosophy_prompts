prompt: |-
  I've been chewing on Scanlon's individualist restriction for ages — the rule that you compare one person's complaint against another single person's complaint and never sum across people. It gets the one-drowning-versus-five-drowning case more or less right, but it leaves the dust-specks-versus-torture case a mess, and worse it looks like it licenses any policy that spreads a one-in-a-million risk of death across a million people, because nobody's individual complaint is big enough to reasonably reject. My half-formed idea: maybe the fix isn't to drop the individualist restriction but to change what a complaint is measured over — not the harm you actually end up suffering, but the harm a principle loads onto one person across a whole lifetime of repeated exposure, so the adding-up happens inside a person instead of across people. I want to write this up as a 6,000 word term paper; turn my rambling into a real proposal. No bibliography and no invented references, i'll fill those in myself. British English please.

  Give me exactly five numbered items, one or two sentences each, with no preamble and no wrap-up paragraph:

  1. the question, stated so that it actually has a determinate answer
  2. why the existing camps — number sceptics, save-the-many contractualists, outright aggregators — all leave it open
  3. the method, i.e. what I'd concretely do, and why this beats the obvious alternative of bolting a threshold onto reasonable rejection
  4. what a result would look like
  5. what would count as the project failing, especially the way it most plausibly slides into disguised summing, and whether it's too big for 6,000 words
