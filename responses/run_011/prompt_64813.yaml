  The case is not a counterexample to the logical core of the handicap principle, but it decisively falsifies the popular summary that signals must be net costly to be reliable.

  1. The population separates because the incentive compatibility constraints hold for both types: the net payoff of cresting exceeds the net payoff of abstaining for robust males, while the reverse is true for frail males. Specifically, the condition is that the predation risk minus the foraging gain must be positive for frail males (net cost) and negative for robust males (net benefit). These conditions do not amount to the claim that the signal is universally costly; rather, they establish that the signal is *differentially* costly, imposing a net fitness penalty only on the low-quality type while providing a net fitness advantage to the high-quality type.

  2. The fact that robust males would grow the crest without female attention matters significantly for classification but not for the maintenance of honesty. The crest is properly a signal because females use it to infer condition, but it is not strategically produced *for* the female; it is an adaptive trait for thermoregulation that females co-opt. Consequently, the female's preference tracks something merely correlated with condition that is maintained as honest by differential constraints, rather than a trait strategically manufactured for communication. The handicap principle is in scope regarding the *honesty* of the signal, as the differential cost prevents mimicry, but it does not explain the *origin* of the trait, which arises from natural selection on thermoregulation rather than sexual selection.

  3. To evaluate the counterexample status, one must distinguish three readings of cost: first, the metabolic cost of production, which is trivial here; second, the net effect on the signaler's fitness, which is positive for robust males and negative for frail males; and third, the differential marginal cost (or single-crossing property), where the cost of signaling is higher for the low-quality type than the high-quality type. The case pulls these apart by showing that production cost is irrelevant and net fitness cost is not required for the high-quality type. The principle must adopt the third reading—differential marginal cost—if it is to be both non-trivial and true, as this is the only condition strictly necessary to prevent pooling equilibria.

  4. If the crest is net-beneficial for both types, separation collapses because the incentive compatibility constraint for the frail type is violated; both types will crest to gain the physical benefit, rendering the signal uninformative and causing the female preference to vanish or become random. The female's inferential response cannot stably supply the differential required to restore separation in this binary model because any female preference that penalizes cresting enough to deter frail males would also be evolutionarily unstable; once frail males abstain, the crest again indicates robustness, selecting for females who prefer crested males, which in turn selects for frail males who mimic. Separation could only be restored if the signal were continuous rather than binary, allowing the differential marginal cost of signal magnitude to sustain honesty despite the net benefit, or if the physical benefit were frequency-dependent.

  My verdict would flip if the crest were physiologically impossible for frail males to grow, rendering the trait an index rather than a signal; my reasoning in question 4 is most likely to fail at the step assuming static equilibrium stability rather than accounting for dynamic evolutionary cycling where preferences and strategies co-evolve.
