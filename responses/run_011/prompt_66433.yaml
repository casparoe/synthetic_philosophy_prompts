answer: |-
  The headset hummed, a low voltage thrum against Arthur's sternum. He knew the weight of the camera better than the weight of his own wedding band. It was a machinist's weight, balanced and cold. For forty years, his world had been tolerance and feed rate, the smell of cutting oil and the bite of steel. Now, the world was a wash of chirps and thrums.

  Bright light was a high violin squeal. Shadow was a cello bow dragged slow. An edge was a static crackle.

  "Gain looks stable," Sarah said. She was the tech, voice close to his left ear. "Arthur, you ready for the lineup?"

  "Ready as I'll be," Arthur said. His hands rested on his knees, palms up, calluses facing the ceiling. He wasn't allowed to use them. Not today.

  Three days ago, they'd put six bins in front of him. Washers, hex nuts, ball bearings. All steel, all cold, all familiar under his fingers. But his fingers were on his knees. He had to listen to the light bouncing off them.

  He'd pointed to the third bin. "That's the hex."

  Sarah had checked the log. Correct.

  "How?" she'd asked.

  "It buzzes angry," Arthur had said. "The round ones hum smooth. The hex… it stutters. Six little cuts in the noise."

  He could point. He could pick the hex out of a lineup of six every time. But if you asked him what a hex looked like, he'd shrug. He knew the sound of six corners, not the shape of them. He could discriminate, but he couldn't name. The knowledge lived in his ears, not his mind's eye.

  Today was different. Today was the wager.

  Dr. Vance sat in the corner, legs crossed, a notebook balanced on her thigh. She hadn't spoken since she walked in. She'd bet Dr. Chen a case of '82 Bordeaux that Arthur would fail. She believed the senses were separate languages. You could teach a man to hear light, she argued, but you couldn't teach him to translate touch into sound without starting over.

  On the table, two objects sat on a black cloth. White painted wood. One cube, one sphere. Perfectly matched for volume.

  "Left or right?" Chen asked. "Which is the cube?"

  The room was silent except for the headset's hum. Arthur tilted his head. The soundscape shifted.

  The object on the left sent out a sharp, rhythmic interference. *Hiss-click. Hiss-click.* The high notes caught on something and broke. The object on the right was a smooth swell, a tone that rose and fell without interruption, like a breath held and released.

  Arthur licked his lips. He could feel Vance's eyes on him. She wanted him to fail. Not because she disliked him, but because she needed the world to make sense. If he got this right, her map of the mind tore a little.

  "Left," Arthur said.

  Sarah exhaled sharply. Chen smiled. Vance didn't move.

  "Why?" Vance asked. Her voice was dry.

  Arthur frowned. He wasn't looking at a cube. He was listening to a frequency. But he knew what they wanted. They wanted the shape.

  "The corner," Arthur said. "It bites the high note. Holds it there. The round one… it lets the sound slide off. No place to catch."

  "So you see the corner?" Chen asked.

  "I hear where the noise gets stuck," Arthur said. "Shadow falls heavier on the left one. Under the lip."

  He was fluent now. Confident. But he was describing audio artifacts. Shadows and loudness. He wasn't describing geometry. He was describing how the light behaved, not what the object was. If the paint had been matte instead of gloss, the sound would change. If the light moved, the answer might flip. He had learned the song of the cube, not the cube itself.

  Sarah clapped him on the shoulder. "Perfect. That's transfer. He's mapping tactile memory to visual data."

  Vance closed her notebook. The snap was loud in the small room.

  She stood up and walked to the table. She looked at the white cube, then the white sphere. She reached out, then pulled her hand back. Hands on knees. That was the rule.

  She looked at Arthur. He was smiling, tired but bright. He thought he'd seen something. Maybe he had.

  Vance turned to Chen. "The wine," she said.

  "You concede?" Chen asked.

  "I concede the bet," Vance said. "I don't know about the principle."

  She walked to the window. The glass reflected the room back at her: Arthur taking off the headset, Sarah checking the monitors, the two white shapes on the black cloth.

  If Arthur had used his touch memory to identify the shape, he had solved the problem. He had transferred knowledge from hand to eye. But if he had simply learned that *this* sound meant *this* object, he was just a man learning a new code. He hadn't connected sight and touch. He'd just added a third thing—sound—to the pile.

  But how could you tell the difference? If he points to the cube, he's right. If he explains it using shadows and tones, is that just how he describes vision now? Or is it proof he never saw the shape at all?

  Vance pressed her forehead against the cool glass. She had bet on a distinction that couldn't be measured. She had bet on the inside of a man's head using the outside of his words. If he failed, it proved nothing. If he succeeded, it proved nothing. The trap wasn't in the room. It was in the question.

  She turned back. Arthur was rubbing his sternum where the camera sat. He looked comfortable in his skin, in a way he hadn't before the trial.

  "You okay, Dr. Vance?" Arthur asked.

  "Just thinking," she said.

  "About the shape?"

  "About the sound," she said.

  Arthur nodded. He picked up the headset, weighing it in his hand like a caliper. "It's a nice fit. Good balance."

  He set it down on the table, right next to the cube. The plastic hummed quietly, settling into the silence. Vance looked at the headset, then at the cube, and realized she couldn't tell which one was the machine and which one was the object.

  She reached for her pen to mark the result, hovered it over the paper, and set it back down.
