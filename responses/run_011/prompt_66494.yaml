answer: |-
  ### Desiderata for State–Religion Arrangement Review

  The following checklist is designed to be regime-agnostic. It treats "religion" as a functional category of social organization without presuming its theological validity. Each criterion includes a motivating case (drawn from your examples or analogous), a falsifiable violation condition, and a tag indicating its normative status.

  | # | Desideratum | Motivating Case | Violation Condition | Tag |
  | :--- | :--- | :--- | :--- | :--- |
  | **1** | **Doctrinal Abstinence** | UK courts refusing to rule on sacramental validity. | State court or agency rules on the theological truth, validity, or sincerity of a specific dogma to grant/deny status. | Non-negotiable |
  | **2** | **Civil Exit Integrity** | German church tax exit requiring civil declaration. | State requires religious permission to effectuate civil status change, or civil exit triggers automatic civil disability. | Non-negotiable |
  | **3** | **Fiscal Transparency** | US prison chaplains vs. direct grants. | Religious subsidies are hidden in general budget lines without distinct audit trails or legislative authorization. | Negotiable |
  | **4** | **Corporate Autonomy** | Communities internally illiberal (e.g., gendered clergy). | State mandates internal governance structures (hiring, liturgy) as a condition of recognition, absent harm to non-members. | Camp-specific (Camp 2) |
  | **5** | **Symbolic/Material Decoupling** | Head of State governing church vs. budget allocation. | Symbolic identification (titles, seats) automatically triggers mandatory material subsidy without separate legislative vote. | Camp-specific (Camp 1) |
  | **6** | **Category Neutrality** | 1% tax laws favoring church-like hierarchies over mosques. | Recognition criteria require structural features (e.g., "hierarchy," "creed") inherent to only some traditions. | Camp-specific (Secularist) |
  | **7** | **Dynamic Legitimacy** | Folk Church majority shrinking to minority. | Arrangement remains static despite supporting demographic falling below a defined threshold of the populace. | Camp-specific (Camp 3) |
  | **8** | **Vested Rights Protection** | Unwinding establishment (property, pensions, treaties). | Reform seizes existing physical assets, voids pension obligations, or unilaterally abrogates supranational treaties. | Non-negotiable |
  | **9** | **Eligibility Limitation** | Preventing infinite subsidy claims. | State provides benefits to any group self-identifying as religious without a verification mechanism. | Negotiable |

  ### Required Distinctions and Dynamic Clause

  To prevent category errors, the theory must explicitly maintain the following distinctions within the application of the desiderata above:

  *   **Establishment vs. Funding:** A state may satisfy **Desideratum 5** (Decoupling) by retaining an established church (Symbolic) while zeroing its budget (Material), or vice versa. The checklist treats these as separate variables.
  *   **Neutrality Types:** **Desideratum 6** (Category Neutrality) distinguishes *neutrality as even-handedness* (all get the same) from *neutrality as non-identification* (none get anything). A regime can fail the former while satisfying the latter.
  *   **Individual vs. Corporate:** **Desideratum 2** (Exit) protects the individual; **Desideratum 4** (Autonomy) protects the corporation. The theory must not assume these align.
  *   **Explicit vs. Default Rules:** Silence is not neutrality. If the state pays chaplains by default but requires atheists to apply for secular counselors, it fails **Desideratum 6** even if the statute is blind.

  **Dynamic Clause:**
  Regarding **Desideratum 7** (Dynamic Legitimacy): When the demographic majority that justified an arrangement ceases to be a majority, the theory requires a *transition mechanism*. This mechanism must satisfy **Desideratum 8** (Vested Rights). The state cannot maintain the *status quo* privileges (violating Dynamic Legitimacy) nor can it confiscate legacy assets to fund the transition (violating Vested Rights). The theory owes a schedule for amortizing legacy commitments against a shrinking tax base, or a one-time buyout. If neither is fiscally possible, the arrangement is unsustainable.

  ### The Impossibility Theorem

  A subset of these desiderata cannot be jointly satisfied in a pluralistic environment with finite resources. Specifically: **Desideratum 1 (Doctrinal Abstinence)**, **Desideratum 6 (Category Neutrality)**, and **Desideratum 9 (Eligibility Limitation)** form a trilemma.

  1.  **Doctrinal Abstinence** forbids the state from judging theological validity.
  2.  **Category Neutrality** requires the state to treat all "religious" groups equally.
  3.  **Eligibility Limitation** requires the state to distinguish "religious" groups from non-religious ones to cap costs.

  **The Conflict:** To limit eligibility (9) without judging doctrine (1), the state must use structural proxies (e.g., "must have a weekly gathering," "must have a creed"). However, using structural proxies violates Category Neutrality (6) because some bona fide religions lack hierarchies, creeds, or weekly gatherings. If the state accepts all self-identifying groups to satisfy (1) and (6), it violates (9) (infinite liability). If it limits eligibility to satisfy (9), it must define "religion," which inevitably privileges some doctrines over others, violating (1) or (6).

  **Which Desideratum Gives:** In practice, **Desideratum 1 (Doctrinal Abstinence)** is the first to fail. States inevitably adjudicate "sincerity" or "centrality" of belief to determine eligibility for tax exemptions or chaplaincy access.
  **What Survives:** A regime that admits it *will* judge doctrine minimally. It survives by shifting the burden: the state defines "religion" functionally (e.g., "non-profit focused on ultimate concerns") and accepts that this definition is itself a non-neutral metaphysical choice, tagging it as **Camp-specific** rather than universal law.

  ### Model Scoring

  **Strict Non-identification**
  This model fails **Desideratum 4 (Corporate Autonomy)** first. By insisting the state must not fund or recognize religion, it often imposes general anti-discrimination laws on religious hiring and governance to ensure "secular" standards, thereby violating the community's freedom to be internally illiberal. It optimizes for individual rights at the expense of corporate self-governance.

  **Plural or Cooperative Establishment**
  This model fails **Desideratum 7 (Dynamic Legitimacy)** first. By locking recognition and funding into specific historical communities (e.g., the "recognized confessions"), it cannot easily accommodate new movements or demographic shifts without legislative gridlock. It optimizes for stability and vested rights at the expense of democratic proportionality.

  **Accommodationist Free-Exercise Maximalism**
  This model fails **Desideratum 1 (Doctrinal Abstinence)** first. To accommodate every claim of religious burden, the state (or its courts) must evaluate the sincerity and centrality of the believer's claim. It optimizes for individual liberty but forces the state into the role of theologian, violating the prohibition on doctrinal adjudication.

  **Purely Contractual Treaty Model**
  This model fails **Desideratum 8 (Vested Rights Protection)** in the long run, paradoxically. While treaties protect rights initially, when a treaty binds a future majority that rejects the arrangement, the state faces a choice: break the treaty (violating Rule of Law/Vested Rights) or enforce an unpopular obligation (violating Dynamic Legitimacy). It optimizes for commitment but lacks a mechanism for democratic unwinding without breach.
