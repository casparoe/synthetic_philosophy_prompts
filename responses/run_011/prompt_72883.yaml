prompt: |-
  I am preparing a case for my graduate seminar in the philosophy of art, and I want the case built out of an institution's own paperwork rather than out of a treatise. Let me describe the practice as concretely as I can, since I want the analysis to bite on details rather than on slogans.

  A national arts council awards project grants to individual artists and to small companies. Applications are scored against a published rubric of one hundred points, distributed as follows.

  - **Reach and participation (30 points).** The projected number of participants drawn from communities the council designates as under-represented in the arts. Points scale both with numbers and with the depth of involvement: attending scores lowest, co-making scores highest.
  - **Evidence of emotional effect (25 points).** The application must contain an evaluation plan using a short self-report instrument administered to audience members before and after the event, with items along the lines of "I felt moved," "I felt connected to the other people present," and "This has changed how I see something." Points are awarded for the rigor of the instrument and for the ambition of the projected change, never for any particular feeling.
  - **Artistic innovation (20 points).** The degree to which the proposed work departs from the conventions of the form in which the applicant works. The guidance notes define innovation as formal novelty, and reviewers are instructed that accomplished work in a settled idiom scores low here regardless of its quality.
  - **Delivery capacity and risk management (15 points).**
  - **Legacy and documentation (10 points).** What survives the project: an archive, a training method, a dataset.

  Two further features of the arrangement matter more than they appear to. First, applicants are directed not to discuss their own intentions or their own felt experience except insofar as these bear on the delivery plan; the guidance states that an artist's testimony about what a work means is inadmissible as evidence of what the work does. Second, the very same council administers a national prize for artistic achievement, awarded by a panel of practitioners who judge the submitted works alone and anonymously, with no access to audience data, participation figures, or evaluation reports. The council's statutes declare that the prize has no bearing whatsoever on funding decisions, and the two committees share no members.

  With that practice in view, I should like a paper that addresses the following, in roughly this order.

  **1. Reconstruct the theory of art the rubric presupposes** — not what its drafters would say if interviewed, but what the scoring structure commits them to whether or not they notice it. What must art be, and what must its value consist in, for it to make sense to allocate points in these proportions? In particular: does the second criterion presuppose that a work is a cause of measurable psychological states in recipients, or something weaker? Does it presuppose that feelings are comparable across persons and across projects on a single scale, and that the feeling in question is indifferent as to content, so that any documented change counts equally? Does the innovation criterion presuppose that departure from a shared idiom is what separates art from craft — and if so, what does that imply about why the audience's response is worth measuring at all? What does the exclusion of the artist's own testimony presuppose about where meaning lives?

  **2. Set that reconstruction against Tolstoy's account in *What Is Art?*** — art as the deliberate communication, by external signs, of a feeling the artist has himself experienced; the degree of infection as the measure of a work's power, conditioned by the individuality of the feeling transmitted, the clarity of its transmission, and above all the artist's sincerity; and the value of the infection further governed by the content of the feeling, since only feelings that unite people are good. My suspicion, which I want tested rather than flattered, is that the rubric looks Tolstoyan at the second criterion and is in fact his opposite. Explain precisely where the resemblance holds and where it collapses. Consider at least these pressure points: Tolstoy's sincerity condition demands access to the artist's own felt experience, which the rubric declares inadmissible; his individuality condition concerns the particularity of a feeling, not novelty of form, and he treats obscurity, borrowing, and contrived effect as marks of bad art, whereas formal novelty of the kind the council rewards plausibly reduces the intelligibility on which infection depends; his judgment turns on what is transmitted, while the council's instrument is content-neutral by design and pays for ambition irrespective of direction; and his ideal of universal art — work accessible to the untrained laborer — is not obviously the same thing as reaching designated communities with documented participation.

  **3. Distinguish what the practice strictly presupposes from what it merely fits comfortably.** Is the council committed to a causal-psychological account of artistic value, or only to an administrative need for indicators that survive audit, with the philosophy optional? Be careful with the familiar defense that the numbers are mere proxies for goods that are not really numerical: does that defense survive the fact that points, and not the underlying goods, are what allocate the money? And where is the practice genuinely underdetermined — where could a formalist, an institutional theorist of art, a pragmatist about value, and even a Tolstoyan each recognize part of their own view in it?

  **4. Assess the two institutions together.** Given that one body funds both the rubric and the prize and insists that they have no bearing on one another, is that insistence a candid acknowledgment of incommensurable standards, or a refusal to hold any theory of art at all? What does the arrangement presuppose about whether "art" names a single kind of thing with a single kind of value? Is it stable, or does one of the two tend to corrode the other over time — and in which direction?

  **5. Run the counterfactual.** If the council were persuaded to adopt Tolstoy's account whole, what would have to change — not only the criteria but the architecture: who evaluates, whether artists' testimony is admitted, whether the content of the feeling is scored, whether professional artists are funded at all, whether reach would be replaced by a demand for unaided intelligibility? Then tell me which of those changes a contemporary council would find hardest to accept, and what that difficulty reveals about what the present rubric actually values.

  A few requirements of form. Write in American English, in polished academic prose, at a length of roughly two thousand words. Argue rather than survey; I am not looking for a doxography of aesthetic theories but for the implicit theory of this one scoring sheet, extracted and judged. You may take my familiarity with Tolstoy's text for granted, so please do not supply a bibliography, a reading list, or page references — analysis, not citation. And do not end in equipoise: state plainly which account of art the rubric best fits, and whether Tolstoy's partial presence in it is a resource the council could develop or a confusion it should eliminate.
reasoning: |-
  Here's a thinking process that leads to the paper:

  1.  **Analyze the Request:**
      *   **Topic:** A philosophical analysis of a specific arts funding rubric (a hypothetical but concrete case study).
      *   **Context:** Graduate seminar in the philosophy of art.
      *   **Source Material:** The provided description of the National Arts Council's grant rubric and prize structure. *Not* external treatises (except Tolstoy for comparison).
      *   **Structure:** Five specific sections (Reconstruct Theory, Compare with Tolstoy, Distinguish Presupposition vs. Fit, Assess Dual Institutions, Counterfactual Tolstoyan Adoption).
      *   **Tone/Style:** American English, polished academic prose, argumentative (not survey), roughly 2000 words.
      *   **Constraint:** Do not end in equipoise; take a stand on what theory fits best and the status of the Tolstoyan resemblance. No bibliography/citations.

  2.  **Deconstruct the Rubric (Section 1: Reconstruction):**
      *   *Reach (30 pts):* Art is social utility. Value = demographic impact + depth of engagement. Art is a tool for inclusion.
      *   *Emotional Effect (25 pts):* Art is a psychological stimulus. Value = measurable change in state. Crucially: *content-neutral* ("never for any particular feeling") and *ambition-based*. It treats feelings as quantifiable units.
      *   *Innovation (20 pts):* Art is formal novelty. Value = departure from convention. "Accomplished work in a settled idiom scores low." This is high modernist/avant-garde.
      *   *Delivery/Risk (15 pts) + Legacy (10 pts):* Art is a project/product. Value = sustainability, auditability, data.
      *   *Exclusion of Artist Testimony:* Meaning is not in the creator's intent but in the recipient's experience or the object's formal properties. Anti-romantic.
      *   *Synthesis:* The rubric presupposes a hybrid theory: Art is a *social technology* designed to produce *measurable psychological shifts* through *formal novelty*, validated by *external data* rather than internal intent. It treats art as an intervention.

  3.  **Compare with Tolstoy (Section 2: The Tolstoyan Mirror):**
      *   *Resemblance:* Both care about "infection" (emotional effect) and "reach" (uniting people/under-represented communities). Both reject "art for art's sake" (implied by the utility focus).
      *   *Divergence (The "Opposite" Claim):*
          *   *Sincerity:* Tolstoy demands the artist *feel* it first. Rubric bans artist testimony.
          *   *Content:* Tolstoy demands *religious/unifying* feeling (moral content). Rubric is content-neutral ("never for any particular feeling").
          *   *Form:* Tolstoy values clarity/accessibility (universal art). Rubric values *innovation/novelty* (which often creates obscurity).
          *   *Measurement:* Tolstoy's infection is qualitative/spiritual. Rubric's effect is quantitative/audit-ready.
      *   *Conclusion on this point:* The rubric mimics Tolstoy's *structure* (art affects people) but inverts his *substance* (bureaucratic utility vs. moral sincerity).

  4.  **Presupposition vs. Administrative Fit (Section 3: Ontological Commitment):**
      *   *The "Proxy" Defense:* Are points just proxies for real value? No, because the points *determine* the money. The map becomes the territory.
      *   *Commitment:* The council is committed to *operationalism*. If it can't be measured, it doesn't count for funding.
      *   *Underdetermination:*
          *   *Formalist:* Sees the Innovation criterion.
          *   *Institutionalist:* Sees the Council defining what counts as art.
          *   *Pragmatist:* Sees the focus on consequences/effects.
          *   *Tolstoyan:* Sees the focus on audience effect.
      *   *Verdict:* It's not a philosophical theory; it's an *audit culture* theory. It presupposes value is identical with visibility to the state.

  5.  **Assess the Dual Institutions (Section 4: Grant vs. Prize):**
      *   *The Split:* Grants = Social/Psychological/Novelty (Future-oriented, Utility). Prize = Anonymous/Work-alone (Past-oriented, Intrinsic Quality).
      *   *Incommensurability:* The Council claims they don't bear on one another. This implies "Art" is not a single kind of thing. It's a schizoid ontology.
      *   *Corrosion:* The Grant logic (audit, data, utility) tends to corrode the Prize logic (intrinsic merit). Why? Because the Grant logic demands justification to taxpayers/politicians. The Prize logic is elitist/autonomous. Over time, the "value for money" argument swallows the "art for art's sake" argument.
      *   *Stability:* Unstable. It creates two classes of artists: the Social Workers (funded) and the Priests (prized).

  6.  **Counterfactual Tolstoyan Adoption (Section 5: The Thought Experiment):**
      *   *Changes Required:*
          *   Admit Artist Testimony (Sincerity check).
          *   Score Content of Feeling (Moral/Religious unity, not just "change").
          *   Drop Innovation (Clarity > Novelty).
          *   Drop "Under-represented" targets for "Universal" accessibility (Laborer test).
          *   Evaluators need moral/spiritual discernment, not just audit skills.
      *   *Hardest Change:* Content Neutrality. A secular state cannot adjudicate "good/religious/unifying feelings" without violating neutrality.
      *   *Revelation:* The current rubric values *neutrality* and *manageability* over *truth* or *moral good*. It values art as a safe stimulus, not a moral force.

  7.  **Drafting - Section by Section (incorporating word count and tone):**
      *   *Intro:* Set the scene. The rubric as a philosophical text.
      *   *Section 1:* Dig into the operationalist ontology. Art as cause, feeling as effect, novelty as virtue.
      *   *Section 2:* Tolstoy comparison. Highlight the "Content-Neutral" vs. "Moral" clash.
      *   *Section 3:* Audit culture. The points aren't proxies; they are the value.
      *   *Section 4:* The Grant/Prize split. The fragmentation of the concept of Art.
      *   *Section 5:* The Tolstoyan takeover. Why it fails in a liberal bureaucracy.
      *   *Conclusion:* Final verdict. The rubric is bureaucratic operationalism wearing a Tolstoyan mask.

  8.  **Refining and Polishing:**
      *   *Check Word Count:* Need to ensure each section is substantial enough to reach ~2000 words without fluff.
      *   *Tone Check:* Ensure it sounds like a graduate seminar paper (rigorous, analytical, slightly critical).
      *   *Argument Check:* Make sure I'm not just describing but *arguing* about what the rubric *commits* the council to.
      *   *Specific Constraint:* "Do not end in equipoise." I need to clearly state the rubric fits Operationalism/Behaviorism, and Tolstoy is a confusion to be eliminated.

      *(Self-Correction during drafting)*: I need to make sure I don't spend too much time summarizing Tolstoy. The prompt says I can take familiarity for granted. Focus on the *clash*.
      *(Self-Correction on Section 3)*: Be careful not to dismiss the "proxy" argument too easily. Acknowledge it, then dismantle it based on the allocation mechanism.
      *(Self-Correction on Section 4)*: Emphasize the "schism" in the concept of art.

  9.  **Final Review against constraints:**
      *   American English? Yes.
      *   Academic prose? Yes.
      *   ~2000 words? (Will monitor during drafting).
      *   No bibliography? Yes.
      *   Specific 5-point structure followed? Yes.
      *   Strong conclusion? Yes.

      *Let's write.*
answer: |-
  The scoring rubric of the National Arts Council is not merely an administrative tool; it is a philosophical text. While its drafters likely viewed it as a mechanism for accountability, the distribution of points and the specific exclusions embedded within it constitute a robust, if implicit, theory of art. To analyze this document is to reconstruct the ontology and axiology the Council commits itself to whenever it signs a grant check. The following analysis extracts that theory, tests it against the explicit aesthetic system of Leo Tolstoy, and evaluates the stability of the Council's dual institutional structure.

  **1. The Operationalist Ontology**

  The rubric presupposes that art is fundamentally a causal intervention in a social environment. By allocating fifty-five percent of the score to "Reach and participation" and "Evidence of emotional effect," the Council defines the artwork not as an object of contemplation but as a stimulus designed to produce measurable downstream consequences. The artwork is a cause; the psychological state of the audience is the effect. This is a behaviorist account of aesthetic value.

  Consider the second criterion: "Evidence of emotional effect." Points are awarded for the rigor of the instrument and the ambition of the projected change, "never for any particular feeling." This commits the Council to the view that feelings are quantifiable units, comparable across persons and projects, and that the *magnitude* of the shift matters more than the *quality* of the emotion. A profound grief and a shallow joy are ontologically equivalent here, provided they are documented with sufficient statistical rigor. The value of the art lies in its efficiency as an engine of psychological modulation.

  Furthermore, the "Artistic innovation" criterion reveals a high-modernist commitment to novelty as a intrinsic good. By instructing reviewers that "accomplished work in a settled idiom scores low," the rubric posits that art's distinction from craft lies in its departure from convention. However, this creates a tension with the audience-focused criteria. If innovation requires departing from shared idioms, intelligibility decreases. Yet the Council demands high scores for audience connection. The rubric thus presupposes a paradoxical subject: an audience that is deeply moved by forms they do not yet possess the conventions to understand.

  Finally, the exclusion of artist testimony is perhaps the most philosophically loaded constraint. By declaring an artist's account of meaning "inadmissible," the Council enacts the "death of the author" as administrative policy. Meaning does not reside in the creator's intention, nor in the work's internal structure alone, but strictly in the externalized data of reception. The Council's theory is therefore a hybrid of behaviorism and institutionalism: art is what produces auditable data regarding psychological shifts through novel forms, and its meaning is exhausted by that data.

  **2. The Tolstoyan Mirror and Inversion**

  At first glance, the rubric appears deeply Tolstoyan. Tolstoy, in *What Is Art?*, argues that art is the deliberate communication of feeling, where the degree of "infection" determines the work's success. The Council's second criterion mirrors this: art is valued for its ability to make an audience "feel moved" or "connected." Both systems reject art for art's sake; both demand that art do something to someone. However, this resemblance is superficial. Upon closer inspection, the rubric is not merely distinct from Tolstoy's theory but is its structural opposite.

  The divergence begins with sincerity. For Tolstoy, the primary condition of infectious art is that the artist must have genuinely felt the emotion they transmit. The Council explicitly forbids this evidence. By rendering artist testimony inadmissible, the rubric severs the link between the creator's interiority and the work's value. A artist could cynically manufacture a project designed to trigger self-report metrics without feeling a thing, and under the rubric, this is valid art. For Tolstoy, it would be counterfeit.

  Secondly, they diverge on content. Tolstoy insists that the *content* of the feeling determines the work's moral worth; only feelings that unite humanity in brotherhood and religious consciousness constitute "good" art. The Council's instrument is content-neutral by design. It pays for "ambition of projected change" irrespective of direction. A project that radicalizes a community toward isolation could score as highly as one that fosters connection, provided the evaluation plan is rigorous. Tolstoy demands moral teleology; the Council demands metric intensity.

  Thirdly, they oppose one another on form. Tolstoy champions universality and accessibility. He argues that true art must be intelligible to the untrained laborer; obscurity is a mark of bad art. The Council's innovation criterion rewards "formal novelty" and penalizes "settled idioms." Since novelty often entails obscurity, the Council incentivizes the very exclusion Tolstoy condemns. The Council wants the under-represented to participate, but it funds work that departs from the conventions those communities might already know.

  Finally, Tolstoy's "union of people" is spiritual and organic. The Council's "Reach and participation" is demographic and bureaucratic. Tolstoy wants art to dissolve class barriers through shared feeling; the Council wants to document that specific demographic categories were present. The rubric adopts Tolstoy's language of affect but empties it of his moral and spiritual substance, replacing it with a framework of social utility.

  **3. Commitment versus Convenience**

  Is the Council truly committed to this behaviorist ontology, or are the points merely administrative proxies for goods that are not really numerical? A common defense of such systems is that the numbers stand in for complex values that are too subtle to measure directly. This defense fails. In this system, the points do not represent the value; they *constitute* it. Because the money is allocated based on the score, and not on a holistic judgment that uses the score as a reference, the map becomes the territory. If a project generates profound meaning but fails to capture it on the self-report instrument, it is, for the purpose of the Council, valueless. The Council is committed to operationalism: if it cannot be audited, it does not exist.

  However, the practice is not wholly monolithic. It is underdetermined enough to allow competing theories to find a foothold. A formalist can point to the twenty points for innovation and argue that the Council recognizes the intrinsic value of novelty. An institutional theorist can note that the Council defines art simply by funding it. A pragmatist might appreciate the focus on consequences and legacy. Even a Tolstoyan could claim the "emotional effect" criterion validates the importance of infection.

  Yet, these are merely comfortable fits, not logical necessities. The formalist is undermined by the fact that innovation is outweighed by participation metrics. The pragmatist is undermined by the content-neutrality of the effects (pragmatism usually cares about *which* consequences occur). The practice strictly presupposes only that value is external, visible, and quantifiable. It does not require a specific philosophy of aesthetics, but it does require a philosophy of administration that equates legitimacy with visibility. The "proxy" defense collapses because the system does not allow for a corrective override. If the numbers are wrong, the funding is wrong. The Council is therefore committed to the view that artistic value is identical with its administrative trace.

  **4. The Schism of the Two Institutions**

  The Council administers not only these grants but also a national prize for artistic achievement, judged anonymously by practitioners on the work alone, explicitly divorced from audience data or funding decisions. The Council insists these two bodies have "no bearing whatsoever" on one another. This arrangement presupposes that "art" is not a single kind of thing with a single kind of value. It posits a schizoid ontology.

  The Grant Committee operates on a theory of art-as-social-work. Value is forward-looking, instrumental, and collective. The Prize Committee operates on a theory of art-as-intrinsic-merit. Value is backward-looking (judging the completed object), autonomous, and individual. By insisting on their separation, the Council attempts to avoid the contradiction between these theories. They are attempting to serve two masters: the state (which demands utility and reach) and the aesthetic tradition (which demands autonomy and quality).

  This arrangement is unstable. In the long term, the logic of the Grant tends to corrode the logic of the Prize. The Grant logic is supported by the weight of public accountability; it can justify itself to taxpayers through data. The Prize logic is elitist and opaque; it justifies itself only through the authority of the practitioners. In a political environment demanding evidence of impact, the "anonymous masterpiece" becomes harder to defend than the "documented intervention." Over time, the definition of "achievement" in the Prize category will likely drift to favor artists who also excel in the Grant categories—those who can demonstrate reach and innovation, even if the Prize judges claim to ignore it. The separation is a fiction that maintains a temporary peace between incompatible values. It suggests the Council believes art has no unified essence, but rather fragmented functions that must be kept in separate rooms to avoid fighting.

  **5. The Tolstoyan Counterfactual**

  If the Council were persuaded to adopt Tolstoy's account whole, the architecture of the institution would require radical dismantling. First, the exclusion of artist testimony would have to be reversed. Evaluators would need to assess the sincerity of the artist, requiring interviews or personal statements, violating the current "inadmissible" clause. Second, the content-neutrality of the emotional effect criterion would have to be abolished. Evaluators would need to judge whether the feelings transmitted were "religious" or "unifying" in the moral sense, rather than merely "ambitious." Third, the Innovation criterion would need to be inverted. Instead of rewarding departure from convention, the Council would reward clarity and accessibility, potentially defunding avant-garde work that fails the "untrained laborer" test. Fourth, the "Reach" criterion would change from targeting designated demographic categories to demanding universal intelligibility.

  Which of these changes would a contemporary council find hardest to accept? It would be the adjudication of moral content. A secular state institution cannot officially declare that one feeling is morally superior to another without violating principles of neutrality. To fund only art that transmits "Christian brotherhood" (or Tolstoy's secular equivalent) is to engage in state-sponsored moral indoctrination. The current rubric's content-neutrality is not an oversight; it is a political necessity.

  This difficulty reveals what the present rubric actually values. It does not value truth, nor moral good, nor even aesthetic beauty in a traditional sense. It values *manageability*. The current rubric is designed to allow the state to fund art without having to take a stance on what is good, true, or beautiful. It reduces art to a safe, measurable stimulus that promotes social inclusion without demanding moral conversion.

  **Conclusion**

  The National Arts Council's rubric does not fit Tolstoy's account of art, nor does it fit a formalist or romantic theory. It fits a theory of **bureaucratic operationalism**. It presupposes that art is a technology of social management, valuable insofar as it produces auditable data regarding psychological shifts within targeted demographics. The Tolstoyan elements—the focus on feeling and connection—are a veneer, a rhetorical resource used to justify public expenditure, but they are stripped of the moral and spiritual commitments that make Tolstoy's theory coherent.

  The Council should recognize that this resemblance is a confusion to be eliminated, not a resource to be developed. By mimicking the structure of moral-aesthetic theories while refusing their substance (sincerity, content, accessibility), the Council creates a system that incentivizes cynicism. Artists learn to simulate infection rather than feel it; they learn to target metrics rather than audiences. The dual structure of Grant and Prize is a symptom of this confusion, an attempt to hedge bets between art as utility and art as autonomy. A stable system would require a choice: either embrace the Tolstoyan moral mandate (and the political risks thereof) or admit that the funding scheme is not about art at all, but about social services, and judge it accordingly. As it stands, the rubric commits the Council to a view of art that no philosopher holds: that value is identical with visibility, and meaning is identical with data.
