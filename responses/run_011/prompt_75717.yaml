answer: |-
  Elias tapped the Ramsey equation on the whiteboard. "We agree on growth, elasticity, and catastrophe risk. The only variable left is delta, the pure time-preference term. If you set it positive, you are asserting that a life in 2150 is intrinsically worth less than a life today simply because of its location on the calendar. That is moral discrimination, pure and simple. Date of birth is as arbitrary as race or geography."

  Mara leaned against the table, arms crossed. "I accept that if welfare is the only metric, discrimination by date is indefensible. But the social discount rate isn't just a measure of welfare; it's a measure of obligation. We are not one immortal entity stretching across centuries. We are a succession of distinct generations. The claim a future person has on our resources attenuates not because their welfare counts for less, but because the political contract binding us to them grows thinner with distance."

  "That sounds like catastrophe risk dressed up," Elias countered. "If the contract breaks, society ends. We've already priced in the probability of extinction. If you're saying the contract might hold but the obligations fade, you're saying the calendar position itself reduces the weight of their claim. You're back to discrimination."

  "Not discrimination of value, but limitation of agency," Mara said. "Consider psychological connectedness. I care more about my future self in ten years than in fifty because I share more memories and intentions with the former. Discounting reflects that fading connection."

  Elias shook his head. "That argument works for one person's life, not strangers in 2150. I have no psychological connection to them at all. To apply personal identity theory to intergenerational justice is a category error. Unless you are arguing that we are literally the same people, which we aren't, that connection is zero regardless of distance. So, is your reason for positive delta simply that we feel less connected, or is there a structural reason?"

  "It's structural," Mara replied. "It is about the uncertainty of utilization. We are funding a flood defence. But we cannot know if a wall will be the relevant technology in 2150. They might have geo-engineering that makes walls obsolete. This isn't consumption growth; we fixed that. It's specific project obsolescence. A positive delta accounts for the risk that the benefit we intend to deliver simply won't be usable by them, independent of how rich they are."

  Elias paused, pen hovering. "If you mean the probability of the benefit being zero, that belongs in the expected benefit calculation, not the discount rate. If there's a fifty per cent chance the wall is useless, halve the benefit. Don't halve the value of their lives. But let me test your earlier point about the 'thinning contract.' If you argue that our obligation fades simply because they are further away, independent of their wealth or existence, you are asserting that time itself is a moral filter. Can you defend that without admitting that calendar position is a reason to count welfare less?"

  Mara met his gaze. "I defend it head-on. Yes, calendar position matters, because moral agency is localized in time. We can sacrifice for our children easily; for our great-grandchildren, it requires abstraction. A positive delta acknowledges the limits of sustainable altruism. If we set delta to zero, the infinite future swamps the present. We would be obligated to save every penny for the end of time, paralyzing all current action. That isn't ethics; it's tyranny."

  "So you admit it," Elias said softly. "You are prioritizing the present generation's capacity to act over the future generation's need to live. You are saying our convenience now outweighs their survival later because we are here and they are not. That is precisely the discrimination I diagnosed. You are treating the accident of being alive now as a moral privilege."

  "I am treating the reality of being alive now as a moral necessity," Mara corrected. "If we bankrupt ourselves to save them, there is no 'us' to maintain the chain of succession. The positive rate isn't about valuing them less; it's about valuing the continuity of the chain that leads to them. It protects the present link so the future links can exist at all."

  Elias considered this. "If your argument is that we must preserve the present generation's viability to ensure any future exists, that is a survival constraint, not a discount rate. But if you insist it belongs in delta, I must concede this: it is not reducible to consumption growth or catastrophe probability. It is a distinct parameter regarding the fragility of political will. However, acknowledging it legitimizes ignoring distant harms simply because they are distant."

  "And ignoring it legitimizes sacrificing the present for a hypothetical future that may never thank us," Mara said. "You demand we treat time as neutral. I argue time is the medium of scarcity."

  "Then we are at an impasse of values, not math," Elias said.

  "To be persuaded, you would have to give up the claim that ethical obligations must be perfectly impartial across time to be valid."

  "To be persuaded, you would have to give up the claim that present political convenience can morally outweigh the existential security of future persons."
