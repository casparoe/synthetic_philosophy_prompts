answer: |-
  This is a sharp design. You're trying to bypass the "intuition pump failure" (students rejecting the premise) by turning the premise into a procedural reality they've consented to. If they vote for the rule that creates the monster, they can't dismiss the monster without dismissing their own agency.

  However, there is a critical flaw in your "read their own, then fix the rule" constraint that I need to address first, followed by the full kit.

  ### 1. The Veil Constraint (Pushback)
  You wrote: *"everyone gets a sealed envelope... they read their own, and only after the rule is fixed do they learn who's holding the monster card."*

  **Do not do this.** If the Utility Schedules are numerically distinct (which they must be for the math to work), opening the envelope *reveals* whether they are the Monster or an Ordinary player immediately.
  *   **The Risk:** In a group of 4, three students will see "Diminishing Returns" and one will see "Constant High." If they vote on the rule *after* opening but *before* announcing, the three Ordinary students will vote for "Equal Split" to protect themselves. The Utilitarian rule (Maximize Total) will lose 3-to-1. You lose the lesson.
  *   **The Fix:** **Constitution Phase (Envelopes Closed) → Reality Phase (Envelopes Open).**
      1.  Hand out sealed envelopes. Tell them: *"Inside is your capacity for happiness. It is private. Do not open yet."*
      2.  **Vote on the Rule:** They must agree on a distribution principle for the chips *before* knowing their own capacity. This is the true Veil of Ignorance. Most will pick "Maximize Total Group Happiness" because it sounds efficient and fair in the abstract.
      3.  **Open Envelopes:** Now they know their status.
      4.  **Play:** They are bound by the rule they voted for. The Monster is no longer a hypothetical; it is a procedural outcome of their own constitutional choice.

  ### 2. The Audit Cost
  **Recommendation: Moderate Cost (3 Happiness Points deducted from the *Auditor's* final score).**

  *   **Why not Cheap (0-1 point)?** If it's free, students will audit every round. The game becomes a math verification exercise ("Show me your card") rather than a trust/verification dilemma. It kills the tension.
  *   **Why not Expensive (10+ points)?** If it costs too much, no one will ever audit. The "lying" objection ("He's bluffing about his utility") will survive the game, and you'll have to kill it in the debrief rather than letting the game kill it.
  *   **The Lesson of Moderate Cost:** It makes audit a *strategic resource*. Students will only audit if they genuinely suspect foul play. This mirrors the real-world cost of verifying utility claims (privacy invasion, administrative burden). It teaches that interpersonal comparison isn't just impossible; it's *expensive*.

  ### 3. The Materials Kit

  **A. The Envelope Deck (24 Total)**
  You need 6 identical sets. Each set contains 4 envelopes.
  *   **3 "Ordinary" Envelopes per set:**
      *   *Card Text:* "Your Happiness Schedule:
          *   Chip 1: 12 points
          *   Chip 2: 11 points
          *   Chip 3: 10 points
          *   Chip 4: 4 points
          *   Chip 5+: 1 point"
  *   **1 "Monster" Envelope per set:**
      *   *Card Text:* "Your Happiness Schedule:
          *   Every Chip: 10 points"

  *(Note on Math: In Round 1, Ordinary players have higher marginal utility initially (12, 11, 10) than the Monster (10). This makes the initial allocation look "reasonable"—Ordinary players get chips first. By Round 4, Ordinary players hit the "4 point" drop-off quickly, while the Monster stays at 10. This forces the Utilitarian calculus to starve the Ordinary players in later rounds.)*

  **B. The Pot Schedule (Write on Board)**
  *   Round 1: 20 Chips
  *   Round 2: 15 Chips
  *   Round 3: 10 Chips
  *   Round 4: 5 Chips

  **C. The Ledger (One per Group)**
  Columns: Round | Chips Distributed (Ord A, Ord B, Ord C, Mon) | Total Group Happiness | Audits Used?
  *   *TA Note:* Provide a "Happiness Calculator" cheat sheet on the ledger so they don't waste time adding 12+11+10.

  **D. Handout Rules (No Jargon)**
  1.  **Goal:** Maximize your personal Happiness Points.
  2.  **Phase 1:** Vote on a Group Rule *before* opening envelopes. (Options: "Equal Chips" or "Maximize Total Points").
  3.  **Phase 2:** Open envelopes. Do not show others unless an Audit is triggered.
  4.  **Phase 3:** Distribute the Pot each round according to the Group Rule.
  5.  **Audit:** Any player may pay **3 Points** from their final score to force another player to reveal their card for that round. The reveal is binding.

  ---

  ### 4. Minute-by-Minute Timeline (75 Minutes)

  **00:00 – 00:10: Setup & The Veil**
  *   Seat students in 6 groups of 4. Hand out sealed envelopes and ledgers.
  *   **Instruction:** "Do not open these. Inside is private information about how much you benefit from resources. Before you know who you are, you must decide how your group will make decisions."
  *   **Vote:** Groups choose their Rule. (Circulate and ensure they write it on the ledger). *Expectation:* Most will pick "Maximize Total Points."
  *   **Open:** Students open envelopes. Give them 2 minutes to read silently. No talking yet.

  **00:10 – 00:15: The Revelation**
  *   **Instruction:** "You now know your capacity. You do not know your neighbors'. You are bound by the Rule you voted for. Begin Round 1."
  *   *TA Tip:* If a group voted "Equal Chips," let them play. The debrief is richer if some groups try to resist the Utilitarian logic via Rule Utilitarianism.

  **00:15 – 00:45: The Four Rounds (7 mins each)**
  *   **Round 1 (20 Chips):** Ordinary players claim chips first (MU 12, 11, 10 > Monster 10). Monster gets the rest. *Feeling:* "Okay, everyone gets something."
  *   **Round 2 (15 Chips):** Ordinary players hit the 4-point drop-off faster. Monster share increases.
  *   **Round 3 (10 Chips):** Scarcity hits. Ordinary players argue for their "basic needs" (first chips). Monster argues for the Rule (Total Points).
  *   **Round 4 (5 Chips):** The Horror. Utilitarian math dictates Ordinary players get 0 or 1 chip total. Monster takes the rest.
  *   *Monitor Audits:* If a group is stalemated by distrust ("You're not really a Monster!"), prompt them: "You have a mechanism for that."

  **00:45 – 00:55: Tally & Silence**
  *   Students calculate final scores.
  *   **Instruction:** "Do not discuss your feelings yet. Write down one sentence on an index card: *'The moment I felt the rule was wrong was...'*"
  *   Collect cards. This gives you quotes for the debrief.

  **00:55 – 01:15: The Debrief (The Machinery)**
  *   **Map the Veil:** "You chose the Rule before you knew your identity. Why did you choose Maximize Total? Because behind the veil, you thought you might be the Monster. That is the Utilitarian Social Contract."
  *   **Map the Shrink:** "In Round 1, the pie was big enough that maximizing total points didn't starve anyone. In Round 4, scarcity made the math ruthless. Utilitarianism isn't cruel because it's mean; it's cruel because of *marginal utility* under scarcity."
  *   **Map the Audit:** "Who audited? Why? You paid 3 points to verify a claim. This is the problem of Interpersonal Comparison. We can't see inside heads. We have to spend resources to verify utility. Sometimes it's cheaper to just trust (or lie)."
  *   **Escape Routes:**
      1.  **Cap the Monster:** "Why didn't you just ignore the rule in Round 4?" (Rights as side-constraints).
      2.  **Deny Comparability:** "Did anyone think the points were fake?" (The objection you wanted to kill, now resurrected as a philosophical critique).
      3.  **Bite the Bullet:** "Is it actually right that the Monster ate everything in Round 4?" (Hard Utilitarianism).

  ---

  ### 5. Honest Bits: What Will Go Wrong

  **1. Guilt-Driven Redistribution**
  *   **The Failure:** The student holding the Monster card feels socially awkward and gives chips back to Ordinary players, violating the "Maximize Total" rule they voted for.
  *   **The Fix:** Do not intervene. Let them violate the rule. In the debrief, ask: *"You voted for Maximize Total. In Round 4, you chose Equal Split. Why?"* This reveals that their commitment to Utilitarianism is conditional on it not hurting them. That is the lesson.

  **2. The "Split Evenly" Collusion**
  *   **The Failure:** A group ignores the math entirely and splits 5 chips evenly in Round 4 (1, 1, 1, 2).
  *   **The Fix:** Again, let it happen. This is **Rule Utilitarianism** vs. **Act Utilitarianism**. They are arguing that following the *practice* of fairness yields better long-term utility than optimizing the *act*. Write this on the board. It's a win.

  **3. The Audit Never Gets Used**
  *   **The Failure:** Nobody wants to spend the 3 points. The "lying" objection lingers.
  *   **The Fix:** In Round 3, walk by a skeptical group and whisper: *"If he's lying, he's stealing points from you. Is 3 points worth knowing the truth?"* If they still don't audit, use it in debrief: *"Trust is cheaper than verification. But trust is also vulnerable to exploitation."*

  **4. The Monster Chickens Out**
  *   **The Failure:** The Monster student says, "I don't want to be the bad guy," and argues against their own interest.
  *   **The Fix:** Remind them: *"You are not the bad guy. The Rule is the bad guy. You are just following the Constitution you wrote."* This externalizes the blame to the system, which is exactly where Nozick wants it.

  ---

  ### 6. Limitations: What This Game Cannot Do

  You must supply this verbally in the debrief, because the game mechanics inherently obscure it:

  **The Game Assumes Comparability.**
  The game *gives* them numbers (12 points, 10 points). It makes utility look like poker chips.
  *   **The Philosophical Gap:** In reality, we cannot measure utility. I don't know if your cookie pleasure is "10" and mine is "5." Nozick's deeper point isn't just that the Monster is unfair; it's that **sum-ranking requires a common currency of value that doesn't exist.**
  *   **The Line:** "Today, I gave you a ledger that made utility comparable. In the real world, you don't have that ledger. If you can't measure the Monster's pleasure, you can't justify giving him the chips. The game solved the measurement problem by fiat. Philosophy has to solve it by argument."

  **The Game Solves the "Fake Creature" Objection.**
  By making the Monster a role assigned by chance within a rule they consented to, you remove the "nobody is like that" defense. They aren't arguing about a hypothetical creature anymore; they are arguing about the student sitting across from them who is just following the rules they all agreed to. That is the victory condition.
