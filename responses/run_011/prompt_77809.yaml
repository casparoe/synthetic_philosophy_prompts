  Project Title: Decoupling the Hierarchy: A Structural Re-evaluation of Dennett's Taxonomy of Minds

  The standard reading of Dennett's fourfold taxonomy treats Darwinian, Skinnerian, Popperian, and Gregorian creatures as a nested hierarchy. On this ordinal view, each stage presupposes the mechanisms of the prior stages. A Gregorian creature must be Popperian; a Popperian creature must be Skinnerian. This proposal challenges that structural commitment. It argues that the four categories are better understood as distinct mechanisms for substituting selective outcomes that can, in principle, come apart. The pressure point for this hypothesis is the emergence of contemporary large language model systems. These systems are assembled almost entirely out of accumulated human artifacts, suggesting Gregorian competence, yet they appear to lack the internal operant reinforcement and hypothesis simulation machinery that the standard reading claims is a precondition for such competence. I propose to investigate whether these systems constitute Gregorian organs without Gregorian organisms, and what their existence implies for the logical architecture of the taxonomy.

  The central question is whether the dependency relations in the taxonomy are conceptual necessities or contingent biological generalizations. Specifically, I aim to test the load-bearing claim that internal simulation is a precondition for the useful uptake of external symbolic tools. To distinguish the ordinal reading from the cross-classificatory reading, one must identify a case where Gregorian uptake occurs without Popperian internal selection. If such a case is coherent and actual, the hierarchy collapses into a modular classification. If such a case is incoherent, the ordinal reading stands, but the criteria for Gregorian status must be tightened to exclude systems that lack internal simulation. The stake is not merely terminological; it concerns whether cognitive sophistication is a single ladder of increasing internal complexity or a multidimensional space where cultural uptake can outrun individual cognitive architecture.

  Existing treatments leave this question open because they were developed prior to the existence of high-dimensional statistical learners trained on cultural corpora. Defenders of the standard view often argue that without an internal selector to vet cultural inputs, an organism cannot distinguish useful tools from noise, rendering Gregorian uptake impossible without Popperian machinery. This argument assumes that selection must occur within the organism during its lifetime. However, this assumption conflates the locus of selection with the capacity for uptake. In large language models, selection occurs during training via gradient descent, a process distinct from the operant conditioning of Skinnerian creatures, yet the resulting system manipulates cultural artifacts with fluency. Current philosophical discussions either dismiss these systems as mere mimics, thereby begging the question against the cross-classificatory view, or they accept the mimicry without analyzing its impact on the underlying taxonomy. Neither approach determines whether the taxonomy describes a biological history or a functional logic. By treating the taxonomy as a functional logic, we can ask whether the functions are coupled by necessity or by evolutionary accident.

  To resolve this, I will employ a comparative case study method rather than pure conceptual analysis or empirical inventory. Pure conceptual analysis risks answering a different question, such as what cognition amounts to in general, rather than how this specific taxonomy maps onto reality. A purely empirical inventory of model capabilities risks begging the question about what the taxonomy is even claiming, as data alone cannot settle categorial boundaries. Instead, I will work through three diagnostic cases chosen so that they disagree in instructive ways about where the boundaries fall.

  First, I will examine a nonhuman case involving social learning in corvids or primates. Some species exhibit tool use transmitted across generations without clear evidence of individual hypothesis simulation. If these count as Gregorian without being fully Popperian, the biological nestedness is weakened. Second, I will analyze the artificial case of large language models. Here the separation is starkest: massive cultural uptake with no biological Skinnerian history and debatable Popperian internal structure. Third, I will consider a human case involving heavy external scaffolding, such as a navigator relying entirely on GPS. This tests whether offloading internal simulation to external tools degrades Gregorian status or merely shifts its locus. By triangulating these cases, I can isolate whether the failure of the hierarchy is due to biological constraints, architectural constraints, or definitional ambiguity.

  A successful result will demonstrate that the ordinal reading fails to classify these cases without ad hoc modification, thereby establishing the cross-classificatory reading as theoretically superior. It would show that cultural uptake and internal simulation are separable variables. Conversely, I define failure not as reaching no conclusion, but as finding that a set of revised attribution criteria classifies every actual case the same way the unmodified taxonomy did. If refining the definitions to accommodate artificial systems ultimately restores the original nested extensions, then the distinction I am pressing has no consequences and should be dropped. The project must prove that the decoupling has explanatory power, not just descriptive novelty.

  The work will proceed over three months. In month one, I will formalize the criteria for each creature type based on primary texts and reconstruct the argument for nestedness. I will complete the analysis of the nonhuman case, determining whether existing ethological data supports the separation of social learning from individual simulation. In month two, I will focus on the artificial case. This involves mapping the training and inference phases of large language models onto the Skinnerian and Popperian functions to see where they align or diverge. I will also draft the analysis of the human scaffolding case. In month three, I will synthesize the findings into a final paper. I will evaluate whether the three cases converge on a single structural revision or require distinct treatments.

  The scope is tight for the duration. The risk lies in the artificial case, where technical details of model architecture could consume infinite time. If the scope exceeds the window, I will cut the human scaffolding case. While instructive, the artificial and nonhuman cases provide the strongest contrast between biological and non-bological instantiations of the taxonomy. The human case serves primarily as a control; if the taxonomy breaks for machines and animals, the human control is secondary. Similarly, I will avoid deep engagement with the ethics of artificial agency. The question is structural and metaphysical, not normative. Staying focused on the taxonomy's architecture ensures the project remains a contribution to philosophy of mind rather than drifting into ethics or computer science.

  This project offers a precise test of a foundational framework in cognitive science. By leveraging the existence of systems that were unimaginable when the taxonomy was formulated, it forces a decision between a historical accident and a logical necessity. Whether the hierarchy stands or falls, the result clarifies the conditions under which mind can be constructed from culture.
