answer: |-
  ### Seminar Activity: The Archipelago Trust

  **Fiction and Cast**
  *   **The Fiction:** The class is a council of stewards for "The Archipelago," a resource-sharing network. Trust is the currency. Errors happen (resource hoarding, missed deliveries, false reporting). The council must manage these errors to maintain network integrity.
  *   **The Cast:** 16 Students. All are "Stewards." You (Instructor) are the "System Architect."
  *   **The Stakes:** Each student receives three **Influence Chips** (physical poker chips or distinct tokens). Retaining at least one chip by the end of the session grants a "Response Paper Exemption" for a future assignment of their choice. Losing all chips means no exemption. Chips are lost via "Standing Reductions."

  **Materials List**
  *   **Influence Chips:** 48 total (3 per student).
  *   **Transgression Cards:** 16 cards (one per student), pre-written. Examples: "You reported 10 units but delivered 8," "You kept surplus rations for yourself," "You missed a scheduled shift."
  *   **System A Boards:** 1 large whiteboard section labeled "Public Ledger."
  *   **System B Envelopes:** 16 small manila envelopes.
  *   **Recording Sheets:** 2 copies for designated Scribes (see below).
  *   **Pens:** For all.
  *   **Timer:** Visible to all.

  **Round-by-Round Rules & Timing (75 Minutes Total)**

  **0:00–0:05 | Setup & Stakes**
  *   Distribute 3 Chips to each student. Explain the Exemption stake.
  *   Explain the goal: Maintain Standing. Standing is represented by Chips.
  *   appoint 2 **Scribes** (non-rotating for the session). Their job is not to play but to tally behaviors on the Recording Sheet. Give them the sheets.
  *   Distribute one **Transgression Card** to each student face down. Tell them: "You have committed this error. Do not show it to anyone yet."

  **0:05–0:30 | Round 1: The Public Ledger (System A)**
  *   **Rule 1 (Visibility):** On your turn, you must stand and read your Transgression Card aloud to the room.
  *   **Rule 2 (Judgment):** After reading, the Room (excluding the speaker) votes immediately by show of hands: "Is this Steward fit to continue?"
  *   **Rule 3 (Penalty):** If majority votes "No," the Steward loses 2 Chips. If "Yes," they lose 0.
  *   **Rule 4 (Repair):** The Steward may offer a public plea *before* the vote. No private deals allowed.
  *   **Flow:** Rapid fire. 1 minute per student.
  *   **Scribe Task:** Tally *Public Pleas*, *Silent Exits* (if anyone refuses to speak), and *Vote Severity*.

  **0:30–0:35 | System Reset**
  *   Return all Chips to start (reset to 3 each).
  *   Collect Transgression Cards, shuffle, redistribute (new error, same stakes).
  *   **Naming Moment:** Ask the room: "If you had to name System A based on how it felt to operate within it, what would you call it?" Write 2-3 suggestions on the board (e.g., "The Court," "The Spotlight"). Do not validate or correct.

  **0:35–1:00 | Round 2: The Private Ledger (System B)**
  *   **Rule 1 (Visibility):** You must identify who was harmed by your Transgression (assign a victim from the room). Place your card in their envelope. Only they see it.
  *   **Rule 2 (Judgment):** The Victim decides the penalty. They can demand 0, 1, or 2 Chips.
  *   **Rule 3 (Repair):** The Transgressor can offer a private repair (a promise, a trade, an apology) to the Victim *before* the penalty is set.
  *   **Rule 4 (Secrecy):** The Room does not know who transgressed or what penalties were issued unless the Transgressor volunteers it.
  *   **Flow:** 15 minutes of milling/negotiating in pairs.
  *   **Scribe Task:** Tally *Private Negotiations*, *Repair Offers*, *Forgiveness without Penalty*, and *Concealment*.

  **1:00–1:15 | Debrief & Synthesis**
  *   Collect Chips. Count who kept exemptions.
  *   **Step 1:** Ask Scribes to report the tallies. Write them on the board side-by-side (System A vs. System B).
  *   **Step 2:** Ask the class to name System B. Write suggestions.
  *   **Step 3:** Reveal the vocabulary. "In moral psychology, System A is often associated with **Shame**. System B is often associated with **Guilt**."
  *   **Step 4:** Discuss the tallies. Why did behavior shift? (Focus on *who saw what*).

  **Standing-and-Loss Scheme**
  *   **Starting State:** 3 Chips.
  *   **System A Loss:** Determined by Public Vote (Binary: 0 or 2 loss). High variance, high visibility.
  *   **System B Loss:** Determined by Victim (Gradient: 0, 1, or 2). Low visibility, negotiable.
  *   **End State:** >0 Chips = Exemption. 0 Chips = No Exemption.
  *   **Crucial Detail:** In System A, the loss is *status* (the vote). In System B, the loss is *debt* (the chips paid).

  **Recording Sheet (For Scribes)**
  *Columns:* Round | Concealment Attempts | Public Confession | Private Repair Offer | Accusation | Exit/Refusal | Chips Lost Total
  *Rows:* System A (Public) | System B (Private)
  *Instructions:* "Mark a tick every time you observe one of these behaviors. Do not record names."

  **Debrief Plan (Working from Tallies)**
  1.  **Compare Concealment:** Did System A encourage hiding the card before reading? Did System B encourage hiding the *fact* of the transgression from the group?
  2.  **Compare Repair:** In A, did pleading work? In B, did negotiating work?
  3.  **The Pivot:** Ask, "Did you feel more afraid of the Room in A, or more afraid of the Victim in B?"
  4.  **The Reveal:** Introduce Guilt/Shame. Ask: "Knowing these names, does it change how you interpret your chip loss?"
  5.  **The Design Insight:** "You didn't choose to feel shame or guilt. You chose who was allowed to see the error. The feeling followed the visibility."

  **Scripted Exchange: The "Choosing" Objection**
  *Context:* A student argues, "We just chose System B because it was better/nicer."

  **Student:** "Honestly, we just chose the second system. It was clearly better. We decided we wanted to run on trust, not fear."
  **Instructor:** "Did you choose to care about the person holding the envelope?"
  **Student:** "Well, yes, obviously."
  **Instructor:** "In System A, you didn't care about them. In System B, you did. Did you flip a switch in your brain between rounds?"
  **Student:** "No, the rules were different."
  **Instructor:** "Exactly. You didn't choose the *care*. You chose the *architecture of visibility*. You can't legislate that people care about each other. But you can legislate that if they *don't* care, the system collapses. System B doesn't work if you don't value the victim. System A doesn't work if you don't fear the crowd. You didn't choose the emotion. You chose the conditions where one emotion becomes the only rational response."
  **Student:** "So we didn't choose the system?"
  **Instructor:** "You chose the rules. The rules chose the emotion for you."

  **Troubleshooting: Four Predictable Failures**

  1.  **Gamification of Standing:** Students treat Chips as points to win rather than status to maintain. They might laugh off losing chips in System A.
      *   *Handle:* Before Round 1, explicitly state: "Chips are not score. They are tenure. Zero chips means you are exiled from the exemption pool. Treat them as fragile." If laughter occurs, pause and ask the Scribes: "Is this behavior recorded as 'Exit' or 'Engagement'?"
  2.  **Audience Apathy:** In System A, students vote "Yes" for everyone to be nice, nullifying the threat.
      *   *Handle:* Pre-brief the Scribes. If voting is unanimous, intervene: "The Archipelago is collapsing due to lack of standards. For the next three turns, you must vote based strictly on the severity of the text on the card."
  3.  **Real Distress:** A student feels actual social pain during the Public Vote.
      *   *Handle:* **Safety Valve.** At the start, state: "You may pass on reading your card once without penalty, but you must surrender 1 Chip." This allows opt-out without total exile. Monitor faces during Round 1; if someone looks panicked, allow a "System Glitch" (Instructor intervenes to move them along).
  4.  **Cynicism/Artificiality:** "This is just a game, I don't actually feel shame."
      *   *Handle:* Acknowledge it in the debrief. "The feeling is muted because the history is thin. But notice your *behavior* changed. You acted *as if* it mattered. Communities run on 'as if' until it becomes real."

  **Ethical Note on Distress**
  This activity simulates social exclusion (System A). For students with high social anxiety or past trauma regarding public humiliation, the "Public Vote" can trigger genuine physiological stress responses, not just pedagogical friction.
  *   **Mitigation:** The "Pass" option (surrender 1 Chip to skip reading) is mandatory safety. Do not force the reading.
  *   **Safety:** Keep the Transgression Cards trivial (logistical errors, not moral atrocities like "you stole"). Ensure the Exemption stake is low enough that losing it is annoying but not grade-threatening.
  *   **Aftercare:** The debrief must explicitly decouple the simulation from their actual moral worth. "You played a role. The vote was on the role, not the person."

  **Limitation Analysis**
  The 75-minute constraint cannot reproduce the **internalization of the norm**. In this activity, the "standard" in System B (Guilt) is still externalized—it's a rule of the game negotiated with a victim. Real guilt operates when no one is watching and no negotiation is possible; it is the self punishing the self. Because the game relies on chip mechanics (external penalties), it simulates the *structure* of guilt without the *phenomenology* of moral remorse.
  This omission damages the **Guilt** side more. Shame is inherently relational and external (it requires an audience), which the classroom provides naturally. Guilt is inherently intrapsychic. By making guilt a negotiation for chips, we risk reducing it to mere cost-benefit analysis ("I paid 2 chips, I'm clear"), whereas true guilt lingers even after restitution. You will need to supply the *internal* dimension of guilt via lecture or reading post-activity, as the game mechanics inevitably externalize it.

  Verdict: CHOOSABLE-ONLY-THROUGH-PROXIES
