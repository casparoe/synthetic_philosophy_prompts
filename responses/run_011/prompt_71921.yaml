  ### 5. The stopping problem

  The stopping problem asks when you should stop deciding when to stop. Formally, this is an infinite regress: every rule for stopping requires a rule for when to apply it. However, in practice, this regress is benign. Herbert Simon's concept of *bounded rationality* suggests humans do not optimize globally but use satisficing heuristics even for the stopping rule itself. You do not calculate the optimal stopping point; you adopt a meta-heuristic, such as "timebox this decision to one hour" or "stop after three options." The regress dissolves because the cost of solving the meta-problem exceeds the benefit. We accept a "good enough" rule for stopping because seeking a perfect rule is itself a violation of the economic principle. The circularity is not a logical flaw but a feature of finite cognitive resources. You stop when the feeling of diminishing returns arises, trusting that intuition as a compressed summary of past experience.

  ### 6. My recommended procedure

  ```python
  def decide(options, context):
      stakes = context.impact * context.irreversibility
      competence = self.ability_to_distinguish_quality(options)
      search_cost = estimate_time_and_effort()

      if competence == LOW:
          return DELEGATE_OR_SATISFICE_IMMEDIATELY
      elif stakes > search_cost and competence == HIGH:
          return MAXIMIZE
      else:
          return SATISFICE
  ```

  1.  Estimate the Cost of Error (Stakes × Irreversibility).
  2.  Estimate the Cost of Search (Time × Effort).
  3.  Assess Evaluation Competence (Can I distinguish quality?).
  4.  If Competence is Low: Delegate or Satisfice immediately.
  5.  If Competence is High and Cost of Error > Cost of Search: Maximize.
  6.  Otherwise: Satisfice.

  The single idea doing the work is that decision effort must be proportional to both the impact of the error and your ability to prevent it.
