  ### 1. The pattern in my verdicts

  Your verdicts reveal a tension between three variables: the stakes of the error, the cost of search, and your competence to evaluate options. You accept satisficing (taking the first option meeting a bar) when search costs are high or stakes are low, as in the weekend project (1) and the time-pressed flat hunt (8). You reject it when stakes are high and search is cheap, as in the mortgage (5) and staff hire (4). However, the pattern fractures on epistemic grounds: you endorse delegating the surgeon choice (6) despite high stakes because you lack expertise, yet condemn the mortgage satisficing (5) where you possess comparative advantage. The inconsistency peaks in Cases 9 and 10, where relaxing criteria is virtuous for housing but negligent for hiring, suggesting a hidden variable regarding social or team impact versus personal utility. Case 11 stands out as an outlier where low stakes absorbed high effort, violating the economic intuition present in the other verdicts. Ultimately, your judgments track a hidden heuristic that weights impact against your ability to distinguish quality, rather than stakes alone.

  ### 2. Candidate principles

  **Candidate 1: The Marginal Utility Principle.** This economic rule states you should search until the cost of evaluating one more option exceeds the expected improvement in outcome. *Opportunity cost* is the value of the time spent searching compared to other uses. This principle justifies Cases 1, 8, and 12, where search costs outweighed benefits. It condemns Case 11 (keyboard), where five weeks of research yielded negligible utility gains. It also condemns Case 5 (mortgage), where three phone calls had low cost but high potential savings. However, it struggles with Case 6 (surgeon); if statistics are cheap to access, the principle demands you look, unless you argue the *interpretation* cost is high. It requires you to quantify the value of information, which is often impossible in practice.

  **Candidate 2: The Irreversibility Threshold.** This heuristic dictates that maximizing is required only for one-way doors (decisions costly to reverse), while satisficing suffices for two-way doors. This aligns with Cases 2 and 4, where core infrastructure and senior hires are hard to undo. It explains why Case 1 (weekend project) allows satisficing. However, it fails to capture Case 6 (surgery is highly irreversible, yet satisficing via delegation is fine) and Case 12 (editor habits are sticky, yet ignoring them is fine). It also cannot distinguish between Case 9 and 10, as both housing and hiring contracts are similarly reversible or irreversible depending on terms. This principle is too binary; it ignores the gradient of difficulty in reversing decisions.

  **Candidate 3: The Epistemic Competence Principle.** This rule states you should maximize only when you possess the expertise to reliably distinguish the best option from the good; otherwise, delegate or satisfice. This resolves the conflict between Case 5 and 6: you can compare mortgage rates (high competence) but not surgical skill (low competence), so you must search for the former but trust a proxy for the latter. It justifies Case 11's condemnation (you can compare keyboards, but stakes are too low to warrant expertise deployment). It struggles with Case 10 versus 9; presumably, you have competence in both housing and hiring after six months, so the distinction must lie in the *consequences* of error rather than evaluation ability. This principle demands you admit ignorance where you feel competent, or vice versa. It shifts the burden from search costs to self-assessment of skill.

