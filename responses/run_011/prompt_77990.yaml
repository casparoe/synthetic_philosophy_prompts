answer: |-
  **MEMORANDUM**

  **TO:** Registration Standards Committee
  **FROM:** [Your Name]
  **DATE:** October 23, 2023
  **SUBJECT:** Recommendation on Good Character Standard – Proposal for Structural Fitness Framework

  **Recommendation**
  I recommend we **Replace** the current "Good Character" clause with a "Structural Fitness" framework. We should not Retain a standard that relies on psychologically dubious trait assessment, nor should we Repeal the standard entirely and remove the gate.

  **Bottom Line for Voting**
  Move to amend the Registration Standard to remove the requirement for a "Good Character" assessment via interview and referee. Replace it with a "Conditional Fitness to Practise" pathway. Applicants with declared misconduct or flagged history are eligible for registration provided their intended practice setting meets defined structural safeguards (e.g., dual-signature controls, shift limits, mandatory escalation protocols). Registration is contingent on annual employer verification of these safeguards.

  **Rationale: The Situationist Critique**
  We must take the petitioner's argument seriously. The situationist literature she cites is robust: human behavior is often more dependent on context than on stable personality traits. Our current interview process—scoring honesty or empathy in a conference room—measures an applicant's ability to perform "good character" in a low-stakes, artificial environment. It does not predict behavior under the specific stressors of clinical practice. Furthermore, as the petitioner notes, performance in these interviews correlates strongly with socioeconomic status and education, introducing a bias we cannot defend.

  If we accept that behavior is hostage to the situation, the logical conclusion is not that we stop assessing risk, but that we stop pretending we can assess *immutable* risk.

  **The Philosophical Pivot: Traits vs. Competence**
  A key question for this committee is whether the situationist argument ("traits aren't robust") forces us to abandon selection entirely. It does not.

  Consider our clinical competence standards. We know skills are domain-bound; a surgeon's manual dexterity does not guarantee their diagnostic reasoning, and both degrade under fatigue. We do not say, "Because competence is situational, we shouldn't test for it." We test for baseline capacity and then mandate continuing professional development to maintain it.

  The same logic applies here. We cannot certify a "soul," but we can certify a *capacity to adhere to safety structures*. The question shifts from "Is this person honest?" to "Can this person work safely within a system designed to prevent dishonesty?"

  **The Petitioner's Case**
  Regarding the petitioner: Her claim that the theft occurred during a single-staffed night with stock shortages does not exonerate her, but it does clarify the risk profile. It quietly concedes a disposition *conditional on environment*. She is arguing that she is not a "thief" in the abstract, but a person who breached controls under specific structural failures.

  Under our current system, she is banned for life based on a trait judgment ("bad character"). Under the proposed Structural Fitness framework, she could be registered, but *only* for roles that mandate two-person handling of controlled drugs and verified stock controls. This acknowledges her history without assuming it is invariant across all contexts.

  **Addressing the Primary Objection: Risk Shifting**
  The strongest objection to my proposal is that it shifts risk onto employers we do not control. By making registration contingent on workplace conditions, we arguably abdicate our regulatory responsibility. If an employer fails to maintain the safeguards, the registrant breaches their conditions, and the public is exposed.

  However, this objection assumes our current system *holds* the risk effectively. It does not. Currently, we grant an unconditional license based on a 30-minute interview. We tell the employer, "This person is safe," when we have no evidence they are safe under pressure. We have already offloaded the risk; we just pretend we haven't.

  The proposed model makes the risk explicit. It forces employers to acknowledge that safety is a system property, not just a person property. If an employer cannot meet the structural conditions required for a specific registrant, that registrant should not practice there. This is not offloading responsibility; it is aligning regulatory standards with the reality of how errors and misconduct actually occur.

  **Implementation Criteria**
  To make this actionable, members will need to apply the following criteria to specific applications instead of the current 1-5 character score:

  1.  **Vulnerability Mapping:** Identify the specific situational stressors related to the applicant's history (e.g., unsupervised access to narcotics, fatigue-induced decision making).
  2.  **Structural Match:** Determine if the applicant's proposed practice setting can implement safeguards that neutralize those specific stressors (e.g., "No night shifts alone," "Prescription audit trail").
  3.  **Verification Mechanism:** Require an employer sign-off confirming the structural safeguards are in place, renewed annually.

  **Conclusion**
  We are in the business of public protection, not moral judgment. The current standard gives us the illusion of control over character. The proposed standard gives us actual control over conditions. I ask the committee to vote in favor of replacing the Good Character clause with the Structural Fitness framework.

  **Action Required**
  Please review the attached draft amendments prior to Thursday's session. We will vote on the motion to replace the standard at the close of the meeting.
