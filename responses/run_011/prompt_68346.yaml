  Bottom line
  The Stone Table sequence superficially satisfies David Lewis's conditions for coherent penal substitution, as a substitute voluntarily bears a penalty accepted by a claiming authority. However, the transaction ultimately diverges because the Witch lacks the ultimate authority to forgive, and the penalty is not merely paid but strategically voided by a higher law. Consequently, the scene functions less as a pure example of Lewisian substitution and more as a narrative exploration of legal loophole and cosmic override.

  The transaction
  Edmund incurs a capital debt due to treason against the Emperor-beyond-the-Sea. The White Witch claims jurisdiction over this debt under the Deep Magic, acting as both accuser and executioner. She does not own Edmund initially but asserts a statutory right to his life based on established universal law. Aslan intervenes not as the lawgiver but as a third party willing to discharge the debt. He bargains secretly and privately with the Witch, offering his own life in exchange for Edmund's, treating his own vitality as currency equivalent to the traitor's. The Witch accepts this substitution, believing she is exacting the full penalty required by the Deep Magic. She kills Aslan on the Stone Table, satisfying her claim to blood. However, the Emperor's law sits behind this transaction as the ultimate ground. Once the Witch exacts the penalty, a deeper clause activates unbeknownst to her. Aslan rises, breaking the Table. Edmund is released not because the Witch forgave him, but because the price was fully paid and then nullified by resurrection. The Witch acts as creditor, Aslan as substitute payer, and the Emperor as the silent guarantor whose deeper law ultimately validates the release. The secrecy of the bargain ensures the Witch believes she is winning while actually triggering her defeat. This layered authority structure significantly complicates the simple debtor-creditor model. The Witch thinks she is the final authority, but she is merely an agent of a complex law she does not fully comprehend. Aslan pays the creditor, but the true owner of the debt ultimately overrides the collection.

  Lewis's conditions
  David Lewis argues penal substitution is coherent if the authority entitled to exact punishment accepts a substitute's payment. He distinguishes penalties like monetary fines, which are transferable, from imprisonment, which is essentially personal. This distinction is crucial for his defense. In Narnia, the penalty is death, which seems personal, yet Lewis allows transferability if the authority consents to the exchange. He emphasizes that the transferability is not inherent to the penalty type but to the social convention surrounding it. The Witch consents to Aslan's violent death instead of Edmund's, meeting Lewis's condition of authoritative acceptance. Lewis requires the substitute to voluntarily undertake the penalty, which Aslan does explicitly. Furthermore, Lewis insists the substitute must not be coerced. This ensures the payment is voluntary and thus valid. He also requires the authority to view the substitute's suffering as the satisfaction of the offender's debt. The Witch believes killing Aslan satisfies the Deep Magic's claim on Edmund. Lewis's model relies on the authority having the right to waive the original offender's punishment in light of the substitute's payment. Here, the Witch believes she holds this right under the Deep Magic. She treats Aslan's life as a currency equivalent to Edmund's. Lewis's account focuses primarily on the logic of payment rather than the moral outcome. In this sense, the scene aligns: a debt is incurred, a substitute offers payment, the creditor accepts, and the debtor is freed. The structural mechanics of offer, acceptance, and discharge mirror Lewis's defense against the incoherence objection. The transaction treats the penalty as a strictly quantifiable demand that can be met by another, provided the claimant agrees. Lewis would argue the personal nature of death is overcome by the authority's willingness to accept a different body. The scene validates Lewis's claim that transferability depends on the authority's prerogative, not the penalty's intrinsic nature.

  Where it fails
  The most significant and damaging divergence concerns authority. This distinction is vital because Lewis's defense rests on the legitimacy of the penal system. Lewis requires the punishing authority to accept the substitute. The Witch is not the ultimate authority; she is an executor under the Emperor's law. Aslan reveals she misunderstood the law, meaning her acceptance was legally void regarding the ultimate outcome. Lewis's model assumes the authority fully knows the limits of their right to accept substitution; the Witch does not. This makes the transaction less a valid substitution and more a trick. If the authority is mistaken, the substitution is void. Secondly, Lewis's account implies the penalty is satisfied and ends. In Narnia, the penalty is paid but then reversed via resurrection. Lewis defends the coherence of paying the penalty, not paying it to unlock a resurrection clause. Lewis does not account for a higher law overriding the penal agreement. Aslan's death is a provocation of the Deeper Magic, not merely satisfaction of the Deep Magic. This fundamentally shifts the mechanism from substitution to strategic sacrifice. This suggests the penalty was not truly satisfied but exploited. Thirdly, Edmund's repentance is irrelevant to the Witch's claim but central to Aslan's willingness. Lewis focuses on the authority's right, not the offender's state. The story suggests the substitution only works because the offender is fully restored, whereas Lewis's logic holds even without moral transformation. Lewis's theory assumes the offender remains liable unless paid for; the story implies the offender is changed. Finally, the Witch acts as a creditor seeking rights, not a moral authority seeking justice. Lewis assumes a legitimate penal authority. The Witch is a usurper of sorts, claiming rights over sinners. This undermines the moral legitimacy Lewis needs for the analogy to hold theological weight. Thus, the story requires a moral change Lewis's logic does not. The story admits the legalism is flawed; Lewis tries to defend the logic of the legalism itself. The narrative suggests the old law itself needed breaking, whereas Lewis argues the law's demands can be met internally. The divergence shows Lewis defends a static system, while the story depicts a system being transcended.

  What the scene adds
  The narrative vividly exposes the visceral horror of substitution that abstract philosophy sanitizes. Philosophy abstracts the pain; the novel forces us to witness it. Lewis's paper argues logical coherence; the scene shows the physical cost of that coherence. It makes visible the tension between legal satisfaction and moral love. Aslan's grief and the Witch's triumph reveal that a legally valid substitution can still be morally monstrous if the authority is malicious. The story also highlights the necessity of a "Deeper Magic." Lewis argues substitution is coherent within a system; the story suggests the system itself requires redemption. It reveals the human cost. The narrative shows that penal substitution alone is insufficient without resurrection or override. It illustrates that satisfying the law might require breaking the law's ultimate power. The scene demonstrates that substitution works not just because a penalty is paid, but because the power dynamics behind the penalty are shifted. It adds the dimension of victory over the accuser, not just payment to the authority. The story forces the reader to confront the emotional weight of the transaction, something the philosophical argument deliberately sets aside to focus on logical possibility. This emotional reality challenges the clean logic of Lewis's defense.
