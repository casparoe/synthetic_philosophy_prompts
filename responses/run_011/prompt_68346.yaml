prompt: |-
  I am preparing a seminar session on the coherence of penal substitution and want to use the Stone Table sequence in *The Lion, the Witch and the Wardrobe* as the case study. Read that sequence against David Lewis's paper *Do We Believe in Penal Substitution?* (the Princeton philosopher, not the novelist). Lewis's central move, as I read it, is that the standard objection — that a punishment is essentially personal and so cannot be borne by anyone but the offender — depends on picturing penalties as things like imprisonment, whereas the fine shows that a penalty can be discharged by a substitute provided the authority entitled to exact it accepts the substitution in the offender's stead. Does Narnia's transaction meet Lewis's conditions, or does it turn out to be something structurally different from the atonement he is defending?

  Work through the mechanics rather than the mood: who owes what to whom, and in what capacity. The Witch claims Edmund as a traitor under the Deep Magic, Aslan bargains with her privately and takes his place on the Table, she kills him, and a deeper magic then voids the outcome at sunrise. Consider whether the Witch counts as the punishing authority Lewis's account requires, or whether she is only creditor and executioner, with the Emperor's law sitting ambiguously behind her; whether Edmund's repentance is supposed to matter to the validity of the claim; and whether Aslan's death is best read as the satisfaction of a penalty that has now been paid, or as a deliberate provocation of a clause the Witch did not know existed. Where the scene and the paper agree, say so precisely; where they come apart, say whether the divergence is a problem for Lewis's account, a problem for the story's theology, or simply a difference in the job each is doing. And resist treating the novel as an illustration of the paper — tell me what the sequence makes visible about substitutionary accounts that argument alone does not, and where an honest reading has to admit the story is doing something else entirely.

  Please organize the response under these headings, in this order: "Bottom line" (three or four sentences saying whether the Stone Table sequence is a case of Lewisian penal substitution); "The transaction" (about 250 words reconstructing who owes what to whom, and who accepts what from whom); "Lewis's conditions" (about 300 words mapping the scene onto them); "Where it fails" (about 350 words on the divergences, ordered by how much damage each does to the parallel); and "What the scene adds" (about 200 words). No verbatim quotation from either text is needed — paraphrase freely — and assume I have both the novel and the paper in front of me.
