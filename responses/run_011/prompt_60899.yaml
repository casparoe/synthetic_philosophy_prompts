answer: |-
  **Project Title:** Ought Implies Computable: The Normative Status of Distributional Complexity

  **Project Summary**
  This project investigates a growing trend in normative theory: replacing vague feasibility constraints with computational complexity classes. Philosophers increasingly argue that agents cannot be rationally or morally required to perform tasks that are computationally intractable (e.g., NP-hard). However, this move faces a technical objection: worst-case hardness does not reflect average-case performance. If we shift to average-case complexity to save the principle, the normative verdict becomes sensitive to the assumed input distribution. This project asks whether this distribution-sensitivity undermines the principle entirely or reveals a necessary, context-dependent structure in computational normativity. Using voting manipulation as a running case study, I will map the conditions under which distributional assumptions license normative excuses.

  **The Research Question**
  Computational constraints are increasingly used to limit normative demands. The principle is roughly: *If a task T is computationally intractable, an agent is not required to perform T.*
  The technical objection is: *Intractability (e.g., NP-hardness) is a worst-case property; actual instances may be easy.*
  The proposed fix is: *Use average-case hardness relative to a distribution D.*
  The philosophical problem is: *Normative verdicts now depend on D. Change D, and the agent goes from excused to blameworthy.*

  **Primary Question:** Is the dependence of computational normative excuses on input distributions a fatal instability, or does it constitute a legitimate form of context-dependence analogous to pragmatic encroachment in epistemology?

  **Why Existing Positions Leave This Open**
  Current literature is stalled between two disciplines speaking past one another.
  1.  **Philosophers** adopting computational constraints often rely on worst-case classes (P vs NP) as proxies for "humanly impossible." They treat hardness as a binary property of the task, ignoring that hardness is a property of the task *relative to a set of instances*.
  2.  **Complexity Theorists** correctly identify the worst-case/average-case gap but treat the choice of distribution as a purely empirical or mathematical modeling decision, ignoring that selecting a distribution effectively selects a normative verdict.

  Neither side addresses the normative status of the distribution itself. If the distribution represents "the world as it is," the norm is empirical. If it represents "the world as it should be," the norm is circular. This project isolates this gap. It does not attempt to solve P vs NP, nor to settle the nature of moral obligation generally. It asks whether the *importation* of complexity theory into normative theory is conceptually coherent once average-case analysis is accounted for.

  **Methodology and Running Example**
  The project uses the debate over voting manipulation as the primary model. Bartholdi, Tovey, and Trick (1989) showed that manipulating certain voting rules is NP-hard.
  *   **Standard View:** Voters are not rationally required to manipulate because finding the manipulation is intractable.
  *   **Objection:** Real-world voting profiles are not worst-case instances; heuristics often find manipulations easily.
  *   **Refined View:** Voters are excused only if the *actual distribution* of voter preferences makes manipulation hard on average.

  I will formalize this triad. I will not prove new complexity theorems. Instead, I will model how shifting the distribution (e.g., from uniform to correlated political preferences) shifts the normative status of the voter. I will then analyze whether this shift is a bug (arbitrariness) or a feature (context-sensitivity).

  **Week-by-Week Plan**
  *   **Weeks 1–2: Formal Reconstruction.** Map the existing arguments regarding "Ought Implies Can" and computational complexity. Formalize the voting manipulation case specifically regarding the worst-case vs. average-case distinction.
  *   **Weeks 3–5: Distributional Modeling.** Analyze specific distributional assumptions used in the literature (e.g., Impagliazzo's Heuristica, smoothed analysis). Construct a matrix showing how normative verdicts (Blame/No Blame) flip under different plausible distributions for the voting case.
  *   **Weeks 6–7: Normative Analysis.** Evaluate the matrix. Is the flipping of verdicts unacceptable? Compare this to pragmatic encroachment: just as stakes affect knowledge attributions, does the "computational environment" affect rationality attributions? Draft the argument for context-dependence.
  *   **Weeks 8–9: Extension and Limits.** Test the limits of the conclusion. What would have to be true for this to carry over to moral calculations (e.g., "You aren't blameworthy for failing to maximize utility if the calculation is hard")? Identify the disanalogies between voting rules and moral landscapes.
  *   **Week 10: Final Draft.** Assemble the paper. Ensure the conclusion clearly states whether the principle is salvageable or must be abandoned.

  **Expected Results**
  1.  A precise taxonomy of how normative verdicts depend on distributional assumptions in computational social choice.
  2.  A defense of "Computational Contextualism": The claim that computational excuses are valid but indexed to the agent's informational environment, not just the abstract task.
  3.  A clear set of necessary conditions for extending these results from voting (rule-bound) to morality (open-ended).

  **Conditions for Failure**
  This project fails if:
  1.  **Mathematical Intractability:** The average-case complexity of the specific voting rules under realistic distributions is unknown and cannot be reasonably modeled within 10 weeks. (Mitigation: I will restrict the scope to rules where average-case bounds are already established in CS literature.)
  2.  **Conceptual Collapse:** If it turns out that distributions are purely empirical facts with no normative leverage, the link between complexity and "ought" breaks. In this case, the result is a negative one: computational complexity cannot ground normative principles without smuggling in empirical premises. This is a valid philosophical result, but it means the positive thesis (Computational Contextualism) fails.
  3.  **Overscoping:** Attempting to solve the "Is-Ought" problem generally rather than focusing on the specific distributional objection.

  **Extension to Moral Calculations**
  For the conclusion to carry over from voting to morality, two conditions must hold:
  1.  Moral requirements must be formalizable as computational tasks with defined inputs and outputs (a contentious assumption I will not defend, but treat conditionally).
  2.  There must be a fact of the matter about the "distribution" of moral scenarios an agent faces, analogous to the distribution of voter profiles.
  If the moral landscape lacks a stable distribution (unlike voting profiles), the average-case defense collapses. I will argue that this asymmetry limits the migration of computational norms from social choice to ethics.

  **Scope Note**
  Ten weeks is insufficient to adjudicate the general validity of "Ought Implies Can" or to produce new complexity-theoretic bounds. I am prone to expanding the scope to cover all of rational choice theory. To prevent this, I will restrict the analysis strictly to the *distributional objection*. If the project reveals that the voting case is too idiosyncratic to generalize, I will stop there rather than forcing an application to moral epistemology. The goal is a rigorous negative or positive result on the distributional problem, not a comprehensive theory of computational normativity.
