answer: |-
  This is a sharp observation, and you are right to feel that the existing labels don't quite stick. You have identified a specific structural flaw in **Biostatistical Theories of Health (BST)** (Boorse) and the **Fair Equality of Opportunity** account (Daniels) that is often acknowledged in footnotes but rarely named as a distinct mechanism.

  Here is the breakdown of the landscape, why the existing terms miss the mark, and a proposal for how to carve this out for your chapter.

  ### 1. Is there an established name?
  **Short answer:** No. There is no canonical proper noun (like "The Veil of Ignorance") for this specific feedback loop within the treatment/enhancement literature.

  **Long answer:** The phenomenon is discussed, but it is usually subsumed under broader critiques.
  *   **Boorse/Daniels Critics:** Philosophers like **Christopher Boorse** himself and critics like **Elselijn Kingma** or **Daniel Hausman** discuss the "Reference Class Problem." They note that choosing the reference class is tricky, but they generally treat the class as static for the sake of analysis.
  *   **The "Shifting Baseline" Literature:** In environmental ethics, **Daniel Pauly's "Shifting Baseline Syndrome"** (1995) is the closest analog. It describes how each generation accepts the current degraded state of nature as "normal." However, this is usually about *loss* and *perception*, not about medical intervention actively shifting the statistical curve *upward* and redefining therapy in real-time.
  *   **The "Treadmill" Literature:** **Anders Sandberg** and **Nick Bostrom** discuss the "Enhancement Treadmill," but as you noted, that focuses on the *competitive necessity* (positional goods), not the *categorical drift* of the treatment/enhancement boundary itself.

  ### 2. Why your rejected candidates don't fit (and one nuance)

  You are correct to reject **Medicalization** (too broad/outcome-focused) and **Positional Goods** (downstream consequence). Here is the nuance on **Looping Effects**:

  *   **Hacking's Looping Effects:** You rejected this because Hacking focuses on classification changing the *people* (interactive kinds). However, your case is classification changing the *distribution*.
      *   *The Nuance:* You are describing a **Second-Order Looping Effect**. Hacking's loop is: *Label → Individual Behavior → Label Meaning.* Your loop is: *Label → Aggregate Population Stats → Label Threshold.*
      *   *Verdict:* You can cite Hacking as the grandfather of the idea, but you need to specify that this is **Distributional Looping**, not Interactive Looping.

  *   **Goodhart's Law:** "When a measure becomes a target, it ceases to be a good measure."
      *   *Fit:* This is structurally identical to your mechanism. The "measure" is normal functioning; the "target" is therapy.
      *   *Miss:* Goodhart's Law almost always implies **strategic gaming** (agents manipulating the metric). Your case is distinctive because the drift happens through **sincere therapeutic success**. It is Goodhart's Law without the gaming.

  ### 3. Proposal: Coining the Concept

  Since you are in a PhD chapter, you have the license to refine the taxonomy. The most precise label for this is **"Endogenous Baseline Drift"** (or **"Normative Endogeneity"**).

  Here is how to carve its edges, answering your specific boundary questions.

  #### The Definition
  **Endogenous Baseline Drift** occurs when:
  1.  **Normative Dependence:** A normative classification (Treatment vs. Enhancement) is defined by a descriptive baseline (Statistical Normality).
  2.  **Causal Feedback:** The application of the classification causally alters the descriptive baseline.
  3.  **Directional Shift:** The baseline shifts *in the direction of the intervention* (e.g., treatment raises the average, making the next tier of intervention count as treatment).
  4.  **Non-Intentionality:** The shift is a side effect of successful application, not a deliberate redefinition by a governing body.

  #### Boundary Condition 1: Statistical vs. Consensus/Statute
  *Does it require a statistical baseline?*
  **No.** It applies to professional consensus or statute *if* that consensus tracks the population or the perceived needs of the population.
  *   *Example:* If the APA lowers the threshold for ADHD diagnosis because "so many kids are struggling to focus in modern classrooms," and the reason they are struggling is that the classroom pace has increased due to prior cognitive enhancements (or meds), that is still Endogenous Baseline Drift.
  *   *The Key:* The standard must be **responsive** to the aggregate state of the population. If the statute is fixed (e.g., "Vision is impaired if < 20/40" regardless of how many people get LASIK), it is *not* drift; it's just a fixed line. If the statute is "Vision is impaired if you cannot perform standard daily tasks," and standard tasks get harder because everyone else sees better, *then* it is drift.
  *   *Recommendation:* Define the concept by the **feedback mechanism**, not the metric type. Call it **"Endogenous Normativity."**

  #### Boundary Condition 2: The Clear Near-Miss
  You need a contrast case to show you aren't just describing "change over time."

  *   **The Near-Miss: Diagnostic Creep (Exogenous Redefinition).**
      *   *Case:* A committee meets and decides to lower the blood pressure threshold for hypertension from 140/90 to 130/80 based on new risk data.
      *   *Why it's a miss:* The baseline changed because of a **decision**, not because the population's blood pressure distribution shifted due to treatment. The cause is *epistemic* (we learned something new) or *policy-driven*, not *ontological* (the population actually changed).
      *   *Your Case:* The population *actually changed* (got taller/faster), dragging the norm with it.

  *   **The Near-Miss: The Hedonic Treadmill.**
      *   *Case:* I get a raise, I feel richer, then I get used to it and feel normal again.
      *   *Why it's a miss:* This is about *subjective satisfaction*. Your case is about *objective classification* within a normative framework. The grad student isn't just *feeling* more impaired; they are statistically impaired relative to the new mean.

  ### 4. How to Frame This in Your Chapter

  If I were advising this chapter, I would frame it as a **Category Error in the Boorse-Daniels Model**.

  1.  **The Static Assumption:** Show that Daniels/Boorse implicitly treat "Species-Typical Functioning" as a moving average that is slow enough to be treated as static for moral reasoning.
  2.  **The Dynamic Reality:** Introduce your **Endogenous Baseline Drift**. Show that in high-tech bio-contexts, the speed of the drift outpaces the moral reasoning.
  3.  **The "Success Paradox":** Emphasize your insight that *success drives the drift*. The more effective the therapy, the faster the baseline moves, and the more "enhancement" gets swallowed into "therapy."
  4.  **The Label:** I recommend **"The Therapeutic Drift Problem"** (distinct from pharmacological drift) or **"Baseline Endogeneity."**
      *   *Why "Endogeneity"?* In economics, a variable is endogenous if it is determined *within* the model. Here, "Normality" is supposed to be an *exogenous* constraint (a fact of nature) that limits medicine. You are showing it is actually *endogenous* (a product of medicine).

  ### Summary for your Literature Review
  *   **Acknowledge:** This is a known *worry* (mentioned in passing by Callahan, Parens, and critics of transhumanism).
  *   **Claim:** It lacks a *mechanistic name*.
  *   **Contribution:** You are isolating the mechanism as **Endogenous Baseline Drift**.
  *   **Distinction:** It is distinct from Hacking (distributional vs. interactive), Goodhart (non-strategic), and Medicalization (mechanism vs. outcome).

  This is thesis-worthy granularity. It moves the debate from "Where is the line?" to "Why is the line moving?" which is a much stronger philosophical contribution.
