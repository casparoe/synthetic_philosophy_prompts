  Purpose: To enforce strict enkratic alignment between first-order credences and higher-order evidence assessments following the Q3 External Audit. Effective: Immediately.

  1.  **General Alignment Requirement.** All staff must ensure their degree of belief in proposition p matches their assessment of the evidence supporting p. Upon acquiring higher-order evidence regarding personal reliability, corresponding first-order belief adjustments must be completed within one business day. Failure to update constitutes a compliance violation subject to disciplinary review. Delays due to cognitive resistance are not excused. The audit found widespread misalignment during periods of fatigue. Management expects full cooperation during the transition period.

  2.  **Reasoning Compromise Exemption.** Staff may petition for exemption from Clause 1 if they have reason to think their reasoning capacities are currently compromised. This petition must be drafted using the reasoning capacities in question. Compliance acknowledges that verifying compromise requires the use of potentially compromised reasoning. This recursive verification is accepted as procedurally valid. Do not hesitate to apply due to uncertainty regarding the tool used to assess uncertainty. The Department is serene regarding this circularity. We trust the output of the compromised system to identify the compromise.

  3.  **Level-Splitting Provision.** Employees may maintain belief in p while filing a report stating their evidence does not support p. Compliance classifies this doxastic state as entirely stable. Should a subsequent report indicate the initial report lacks evidentiary support, a tertiary report must be filed to adjudicate the stability of the secondary report. This chain continues until administrative resources are depleted. Stability is assumed until paperwork cessation. The split is recognized as coherent. Employees are reminded that stability does not require truth. Documentation of the split must be retained for seven years.

  4.  **Peer-Disagreement Mediation.** In instances of peer disagreement, credences must be averaged. Peer status is not inherent. The colleague in dispute administers the Peer Verification Protocol. If they determine they are not your peer on this question, their credence weights at one hundred percent. You must accept this determination as unbiased. Appeals regarding peer status are reviewed by the colleague in dispute. This ensures the most knowledgeable party controls the weighting metric. Disagreements about the metric are resolved using the metric.

  5.  **Specific Inference Impairment.** If notified that you have been dosed with a substance degrading modus ponens inference, you must cease utilizing modus ponens immediately. You must process this notification and arrive at the cessation conclusion without employing modus ponens. Failure to comply indicates the impairment has already occurred. Compliance will not provide alternative inference rules, as selecting one would require the impaired faculty. Trust the notification. You cannot reason your way to compliance; you must simply obey the directive without inference. Logical intuition is not a valid substitute for policy.

  6.  **Misleading Higher-Order Evidence.** In cases where higher-order evidence is misleading, akrasia is rationally required. Personnel must believe p while believing they should not. This clause concedes that Clause 1 is unenforceable in scenarios involving misleading higher-order evidence. As these scenarios constitute the primary operational risk of forecasting, Clause 1 is effectively advisory. Personnel should proceed with rational required akrasia while maintaining compliance documentation stating alignment. Contradictions between policy and rationality are noted but not actionable. This undermines the authority of this document. Compliance accepts this reduction in authority as necessary for philosophical accuracy. Future audits will assess adherence to akrasia requirements separately.
