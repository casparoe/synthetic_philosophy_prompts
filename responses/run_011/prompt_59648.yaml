  The strongest case against approval invokes Habermas's worry about the self-understanding of the selected child. If a person knows they are the product of a deliberate parental selection programme, it may disrupt the symmetry between persons that our idea of equal standing leans on. They might feel designed rather than begotten, conditioning their sense of freedom and altering the parent-child relationship into one of producer and product. Additionally, the validity of polygenic scores for within-family selection remains scientifically contentious; acting on noisy data risks discarding viable embryos based on false positives. There is also the access problem: at six grand out-of-pocket, this technology exacerbates existing inequities, becoming a luxury good for the wealthy. This creates a two-tiered system of genetic opportunity. Finally, including educational attainment medicalizes social traits, risking a slide toward non-therapeutic enhancement. These concerns suggest the service commodifies children and undermines social justice. The composite nature of the score conflates disease with social success, confusing medical indication with preference. This risks stigmatizing those born with higher polygenic risks for diabetes or lower predicted attainment. Consequently, the program could reinforce harmful social hierarchies under the guise of health. The institutional endorsement lends credibility to these distinctions, potentially normalizing genetic stratification. Moreover, the pressure to use such technology may become coercive over time. If peers select for lower risk, refusing to do so might be seen as negligent parenting. This creates a slippery slope where autonomy is eroded by social expectation. The lack of long-term data on psychological outcomes for children selected via PES is also troubling. We are conducting an uncontrolled experiment on future persons without their consent. The potential for regret or psychological distress if the child develops the condition despite selection is significant. This undermines the beneficence argument. Therefore, the risks to social equality and individual psychology outweigh the potential health benefits.

  5. **Does the tie-break lottery fix anything?**
  The tie-break lottery does genuine moral work, though it is not a panacea. It is not merely cosmetic because it structurally prevents the maximization mindset that fuels Habermas's objection. By establishing a threshold where differences are deemed morally irrelevant, the clinic signals that embryos within the band possess equal standing. This coheres with a view that parents have a reason to avoid significant risk, but not a reason to maximize every marginal gain. However, critics argue it is incoherent: if differences are too small to matter, why select at all? The reply is that the selection is for the *band*, not the specific rank. Yet, the lottery does not fix the access problem or the validity of the composite score itself. It mitigates the expressive harm of ranking but cannot validate the underlying science or equity issues. Therefore, it justifies approval only when paired with conditions addressing those remaining deficits. The lottery transforms the act from choosing the best to avoiding the worst within a safe range. This shift is ethically significant, moving from eugenics to risk management. However, without counseling, parents may misunderstand the lottery as a failure rather than a feature. Thus, the lottery works only if the ethical rationale is communicated effectively. It saves the proposal from being purely optimization but requires support to function ethically. The width of the band is crucial; if it swallows the variance, it admits that the score is noise beyond that point. This honesty about limitation is rare in commercial genetics. It prevents the illusion of control. However, it does not solve the fundamental question of whether we should be selecting on these traits at all. It only moderates how we select. So it fixes the 'how' but not the 'whether'. This is why conditions are necessary. The lottery is a necessary but insufficient safeguard. It addresses the symmetry concern but leaves the access concern untouched. Therefore, the verdict is that it fixes the expressive harm but not the distributive justice harm.

  6. **Conditions**
  1. **Counseling Verification:** The clinic must submit its informed consent script to the panel for review, ensuring it explicitly details the limited predictive power of polygenic scores for individual embryos. The panel will audit random counseling sessions quarterly.
  2. **Equity Measure:** The clinic must allocate 10% of PES cycles to a subsidized fund for lower-income patients, verified through annual financial reporting to the panel.
  3. **Data Registry:** The clinic must enroll all PES patients in a longitudinal registry tracking health outcomes, with data shared annually to reassess clinical validity.

  7. **What would change my mind**
  I would flip to flat rejection if new data showed within-family predictive power for schizophrenia is statistically indistinguishable from chance. I would also change my mind if the clinic refused subsidized slots, confirming the access problem is insurmountable. If legal counsel determined the lottery exposes the clinic to liability for wrongful embryo suits, the risk would outweigh benefits. Additionally, if patient feedback indicated widespread misunderstanding of the lottery's purpose, the mechanism would be failing. Evidence of psychological harm to children born via this protocol elsewhere would warrant reversal. These factors undermine it.
