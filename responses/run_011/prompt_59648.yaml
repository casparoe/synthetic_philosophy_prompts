  1. **Recommendation**
  I recommend that the panel approve the clinic's proposal subject to the strict operational conditions outlined below. This conditional approval acknowledges the legitimate parental interest in reducing disease risk while mitigating the expressive harms of ranking potential children. The decisive factor is the inclusion of the tie-break lottery, which fundamentally alters the moral character of the selection from maximization to threshold satisfaction. However, approval must remain contingent on verified counseling protocols and equity measures to address validity and access concerns. I move that we vote to approve with conditions at the next meeting. This approach balances autonomy with our institutional commitment to justice.

  2. **What's actually being proposed**
  The clinic proposes offering polygenic embryo screening (PES) to IVF patients yielding more than two viable embryos. Using a vendor-supplied algorithm, embryos receive a composite score blending polygenic risk for schizophrenia and type 2 diabetes with predicted educational attainment. Parents would receive these scores to rank embryos for implantation preference. Crucially, the protocol includes a tie-break lottery: if embryos fall within a predefined statistical band—set wide enough to encompass typical within-family variance—the clinic must randomize selection rather than choosing the higher score. This mechanism aims to prevent decisions based on statistically negligible differences. The service costs approximately $6,000 per cycle, paid out-of-pocket by patients, with no current institutional subsidy or insurance coverage available within the network.

  3. **The strongest case for approving**
  The strongest argument for approval rests on reproductive autonomy and beneficence. Parents generally have a pro tanto reason to pick the child expected to have the best life, even if they lack a strict obligation to do so. By selecting an embryo with lower polygenic risk for schizophrenia or type 2 diabetes, parents act on a legitimate desire to reduce future suffering and healthcare burdens. The non-identity problem clarifies that we cannot claim harm to the unselected embryo, as that specific individual never exists; thus, selection is not comparative harm against a specific person. Furthermore, rejecting the service denies parents a tool that could meaningfully lower disease burden without imposing direct costs on others. The composite score, while imperfect, offers significantly more information than morphology alone, allowing for risk mitigation. To forbid this is to prioritize abstract ethical purity over concrete potential health benefits for future persons. The lottery further softens this by acknowledging uncertainty, ensuring parents aren't forced into false precision when scores are close. Ultimately, autonomy permits parents to weigh these risks according to their own values, provided no third party is harmed. Restricting access to this technology assumes the panel knows better than patients how to balance potential health gains against ethical risks. Given the severity of schizophrenia, even a modest risk reduction constitutes a morally weighty reason for selection. Therefore, allowing the service respects parental agency while potentially improving welfare. It aligns with the standard medical ethic of preventing disease where possible. If we accept prenatal testing for single-gene disorders, consistency demands we consider polygenic risks too, provided validity is acknowledged. Denying this option treats polygenic disease as less worthy of prevention than monogenic disease, which is an arbitrary distinction. Thus, approval supports consistency in re