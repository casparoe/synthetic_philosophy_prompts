answer: |-
  **The Scenario**

  Consider "Alloy-9," which suffers catastrophic brittle fracture exactly at 150K. **Domain A** consists exclusively of macroscopic fracture data: stress-strain curves, acoustic emission frequencies during the snap, and total heat release measurements. **Theory 1 (T1)** posits "Interstitial Locking": carbon atoms within the alloy order themselves into a rigid lattice at 150K, mechanically blocking dislocation movement until failure. **Theory 2 (T2)** posits "Electronic Collapse": electron mobility drops spontaneously at 150K, weakening metallic bonds without structural reordering. Both theories are calibrated to entail the exact same stress limits, acoustic profiles, and heat release values; within Domain A, they are strictly empirically equivalent. No measurement of the fracture event itself can distinguish whether the cause was mechanical locking or electronic weakening.

  **Domain B** consists of neutron scattering data collected from *pure* iron and nickel crystals under cooling, unrelated to Alloy-9's fracture. This evidence strongly confirms a **Third Claim (H)**: "In transition metals, structural ordering transitions always energetically precede electronic bond weakening." H is a general law of solid-state physics supported independently by Domain B. T1 requires structural ordering to occur at the threshold; T2 requires electronic weakening to occur without prior ordering. Because H is well-supported by Domain B, and H entails the mechanism of T1 while ruling out the mechanism of T2, the evidence from Domain B indirectly confirms T1 over T2, despite their equivalence in Domain A.

  ***

  **The Check**

  **Reasoning:** The argument proceeds via a hypothetical-deductive bridge. Domain B evidence ($E_B$) confirms the general hypothesis H. T1 entails (or is a specific instance of) H, while T2 is incompatible with H. Therefore, $E_B$ raises the probability of T1 and lowers the probability of T2, breaking the tie that existed based solely on Domain A evidence ($E_A$).
  **Feature Doing the Work:** **The Independently Supported Auxiliary.** The discrimination works only because the linking claim (H) carries evidential weight from outside the domain of the rivalry. Without the independent confirmation of H from Domain B, H would be just another assumption, and the underdetermination would remain.

  ***

  **Why the Underdetermination Skeptic Remains Unimpressed**

  A philosopher worried about global underdetermination should not be impressed because this solution merely **relocates the problem** rather than dissolving it. The cure relies on the authority of the Third Claim (H), but H itself is a theoretical claim subject to its own underdetermination. A rival claim, H*, could be constructed that fits Domain B evidence equally well but favors T2 (e.g., "Electronic effects dominate in alloys, though ordering dominates in pure metals"). By appealing to indirect evidence, you have pushed the decision point back to the background theory, but you have not provided a rule for choosing between H and H* that doesn't itself rely on further indirect evidence. Thus, the threat of underdetermination survives at the level of the total web of belief; you have solved a local tie by assuming the rest of the network is fixed, but the skeptic asks what fixes the network.
