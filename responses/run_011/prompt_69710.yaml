  **Joint Statement on Heritability Reporting and Trait T**

  Following a year of adversarial collaboration, Party A (Quantitative Geneticist) and Party B (Philosopher of Science) submit this statement regarding the reporting of heritability estimates for Trait T (years of schooling).

  **1. Agreed Claims**
  1.  Based on stipulations (i) and (ii), reducing environmental variance by 80% increases narrow-sense heritability. Using the twin estimate (0.75), post-policy heritability is 0.94. Using the adoption estimate (0.48), post-policy heritability is 0.82. The resulting range is 0.82–0.94.
  2.  Under stipulation (ii), the population mean of T increases by 0.5 standard deviations while heritability increases simultaneously.
  3.  Regarding stipulation (iii), high within-group heritability in P and Q does not license inference that the 0.6 SD mean difference between them is genetic in origin; it remains compatible with entirely environmental causes.

  **2. Disagreements Table**

  | Dispute | Party A | Party B | Type |
  | :--- | :--- | :--- | :--- |
  | Method Discrepancy (i) | Twin/adoption estimates target different variance components; specialists distinguish them. | Divergent estimates for "Trait T" reveal the statistic lacks stable reference outside specific designs. | Substantive |
  | Public Communication | Caveats suffice; specialists prevent misuse in technical literature. | The term "heritability" inherently invites genetic determinism regardless of caveats in public discourse. | Substantive |
  | Causal Status | $h^2$ predicts selection response; it has genuine causal utility. | $h^2$ is a descriptive ratio indexed to specific variance structures, not a causal property of the trait. | Verbal |
  | Reporting Context | Technical parameters belong in technical journals only. | Technical parameters are inevitably cited in policy debates; omission cedes ground to misinformation. | Substantive |

  **3. The Cruxes**
  The following sub-questions identify where empirical resolution would shift positions.

  1.  *Prediction Stability:* If $V_E$ changes, does the correlation between polygenic scores and T remain constant?
      *   **Bearing:** Controlled animal breeding experiments.
      *   **A Prediction:** Correlation remains stable.
      *   **B Prediction:** Correlation shifts significantly.
  2.  *Public Interpretation:* Do lay readers interpret $h^2=0.8$ as immutability?
      *   **Bearing:** Survey experiment on vignette framing.
      *   **A Prediction:** No, if defined clearly.
      *   **B Prediction:** Yes, consistently.
  3.  *Cross-Context Transport:* Does $h^2$ estimated in Population 1 predict response in Population 2?
      *   **Bearing:** Cross-fostering studies.
      *   **A Prediction:** Yes, if genetics similar.
      *   **B Prediction:** No, due to unmeasured GxE.
  4.  *Rank Order:* Does reducing $V_E$ change the rank order of individuals?
      *   **Bearing:** Intervention trials.
      *   **A Prediction:** No.
      *   **B Prediction:** Possibly.

  **4. Closing Annex**
  (a) Most exchanges were terminological. Party A used "heritability" to denote a predictive parameter; Party B used it to denote a public label. The term itself did the damage.
  (b) Environmental reform raised average schooling and increased heritability, proving high heritability does not imply environmental interventions are ineffective.
