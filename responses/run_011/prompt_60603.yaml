prompt: |-
  I'm a philosophy undergrad TA-ing the discussion section for our intro philosophy of science course — 22 students, 50 minutes, and I got stuck with the room where the projector is broken, so nothing digital: it has to run on index cards, sharpies, and poker chips. We just did Hume and then the no-free-lunch result, and the section has shrugged off both. Their line is basically "sure, induction isn't justified in principle, but in practice obviously the strategy that's been working keeps working." I want an in-class game that makes that shrug impossible to keep holding, where they run into the wall themselves and I don't say the word "induction" until afterwards. What they should come away seeing is that their stage-one winning was a property of the bag, not of their cleverness.

  Here's the shape I keep failing to get mechanically right. Two stages. Stage one: groups commit their prediction strategies in writing, then score chips over a bunch of rounds against a "world" drawn from a bag that's mostly well-behaved, so some strategies genuinely win and there's a leaderboard and gloating. Stage two: I swap in a bag that's uniform over everything, including worlds that are actively anti-inductive — where the next observation is built to punish whichever rule has been paying off — and the stage-one top scorer gets wrecked and, crucially, cant tell in advance that it was coming. The hard design problem: I want the worlds in the two bags to be indistingushable for something like the first six rounds (grue-style), so nobody can excuse the loss by claiming they spotted a bad world early. And I want one twist where a group can burn chips to be told which bag is in play — then have them notice that buying that info only makes sense if they already assume something about how bags get picked, which is the bit I most want to land: you can't check your prior without using a prior.

  Give me the whole run sheet: the card/envelope setup and exactly what's written on what, the round structure with timings that actually fit 50 minutes, the chip economy (chips can't convert to grade — I need a reason to care that isn't points), roles if you want them, and a debrief that maps each moment onto the content: which assumption was doing all the work in stage one, why what happens in stage two isn't just bad luck, and where Hume's point and the NFL theorem actually come apart instead of being the same point said twice. Then be straight with me about which feature of the theorem a card game just can't reproduce, that I'm going to have to supply by talking. And tell me what will predictably go wrong the first time I run it — which group does which dumb thing, and where the timings blow up.

  Bottom line first, please: open with a single sentence naming the one mechanic that carries the whole philosophical payload, then go into the run sheet. No preamble and don't restate my question back at me.
