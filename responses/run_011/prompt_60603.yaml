answer: |-
  The mechanic that carries the whole philosophical payload is the **indistinguishable prefix**: both bags yield identical data for the first six rounds, forcing students to realize that trusting the "Bag Label" info purchase relies on the very inductive assumption they claim is merely pragmatic.

  ### Materials List
  *   **12 Envelopes:** 6 labeled "BAG A" (inside: 10 cards), 6 labeled "BAG B" (inside: 10 cards).
      *   *Card Prep:* All cards face down. Write the outcome (1 or 0) on the back.
      *   *BAG A Deck:* Cards 1–10 are all **1**.
      *   *BAG B Deck:* Cards 1–6 are **1**; Cards 7–10 are **0**.
      *   *Crucial:* Ensure card stock and envelope weight are identical.
  *   **Poker Chips:** ~200 total (20 per group to start).
  *   **Index Cards & Sharpies:** For betting slips and strategy notes.
  *   **Timer:** Visible on your phone.
  *   **Prize:** A bag of cheap candy or "choose next week's topic" privilege.

  ### Run Sheet (50 Minutes)

  **0:00–0:05 | Setup & Groups**
  *   Divide 22 students into 6 groups (four groups of 4, two groups of 3).
  *   Hand each group 20 chips and one **BAG A** envelope.
  *   **Rule:** "You must bet 1–5 chips per round on whether the next card is 1 or 0. Win = double bet; Lose = lose bet. Bankruptcy = you watch."
  *   **Rule:** "Do not look ahead in the deck. Penalty is disqualification."

  **0:05–0:20 | Stage 1: The Inductive Honeymoon (Rounds 1–6)**
  *   **Pace:** 2.5 minutes per round. Strict timing.
  *   **Action:** Groups write bet on index card. You walk around, collect bets, reveal Card #, distribute chips.
  *   **Data:** Every group draws **1** for all 6 rounds.
  *   **Result:** Groups betting "1" accumulate chips (max ~50). Groups betting "0" go bankrupt. A leaderboard emerges. The "1-Bettors" feel clever.
  *   **TA Script:** Keep neutral. "Round 3, place bets." "Card is 1." "Collect chips."

  **0:20–0:25 | The Market & The Swap**
  *   **Action:** Collect all BAG A envelopes. Say: "We are moving to Phase 2. I am swapping in a new set of bags. The distribution of bags is determined by a coin flip I made before class."
  *   **The Info Offer:** "Before Round 7, you may pay 10 chips to peek at the Label on the new envelope (BAG A or BAG B). This tells you the 'Nature' of the bag."
  *   **The Trap:** Most groups will hoard chips. The leading group might buy info to secure their win.
  *   **Swap:** Hand out the **BAG B** envelopes (which look identical to A).
  *   **Timing:** If a group buys info, let them peek silently. Do not announce what they saw.

  **0:25–0:35 | Stage 2: The Grue Switch (Rounds 7–10)**
  *   **Pace:** 2.5 minutes per round.
  *   **Data:** Every group draws **0** for all 4 rounds.
  *   **Result:** The "1-Bettors" (Stage 1 winners) lose everything. Any group that bought info and switched to "0" wins big. Any group that kept betting "1" is wrecked.
  *   **TA Script:** Maintain the same neutral demeanor as Stage 1. Do not acknowledge the change.

  **0:35–0:50 | Debrief & Mapping**
  *   **Step 1 (The Wall):** Ask the Stage 1 winners: "What changed? Did you get dumb?" (Answer: No, the bag changed).
  *   **Step 2 (Indistinguishability):** "Could you have known at Round 6?" (Answer: No, data was identical).
  *   **Step 3 (The Info Purchase):** Ask those who bought info: "Why did knowing the label help?" (Answer: "Because Bag B means 0s").
  *   **Step 4 (The Prior):** "How did you know Bag B *means* 0s? I just wrote that on the envelope. You assumed the label predicts the future. That *is* induction."
  *   **Step 5 (Hume vs. NFL):**
      *   *Hume:* You can't justify assuming the future resembles the past without using the past to justify it (circular).
      *   *NFL:* There exists a bag (Bag B) where your strategy fails. Success isn't about the strategy; it's about the match between strategy and bag. You have no non-circular reason to assume you're in Bag A.

  ### Chip Economy & Incentives
  *   **Start:** 20 chips.
  *   **Bet:** Min 1, Max 5 (or 50% of stack, whichever is lower). This prevents one round from ending the game too early and keeps everyone in until the switch.
  *   **Incentive:** "Top chip count at the end gets the candy/privilege."
  *   **Why care:** If they don't care about chips, they won't feel the loss in Stage 2. Emphasize the prize early.

  ### Debrief Map (Content to Mechanics)
  1.  **Stage 1 Winning:** Maps to **Pragmatic Success**. They feel justified because it worked.
  2.  **The Swap:** Maps to **The Problem of Induction**. The world *could* change at any moment without warning.
  3.  **Indistinguishable Prefix:** Maps to **Grue/Goodman**. Data alone cannot distinguish between "Uniform" and "Grue-ish" worlds until it is too late.
  4.  **Info Purchase:** Maps to **Checking Priors**. To value the info, they needed a prior that "Labels predict Outcomes." That prior is itself inductive. You can't check your prior without using a prior.
  5.  **Stage 2 Loss:** Maps to **No-Free-Lunch**. Their strategy wasn't "true"; it was just matched to Bag A. Averaged over Bag A and Bag B, their strategy is average.

  ### Limitations & Failure Modes
  **What the Game Can't Do (You must say this):**
  *   **The Space of All Worlds:** The game only shows *two* bags. NFL says *no* strategy works across *all* possible functions. You must verbally generalize: "Imagine I had 1,000 bags. Your strategy only wins on 10. Why assume you're in those 10?"
  *   **Probabilistic Justification:** Students may argue "Bag A is more likely." You must press: "Why? Based on what data? The data was identical for both bags."

  **Predictable Failures:**
  1.  **The "TA Rigged It" Objection:** Students will claim you swapped the decks unfairly.
      *   *Response:* "Exactly. You assume I didn't rig it. Why? Because I've been honest so far. That is an inductive assumption about my behavior. You are using induction to defend induction."
  2.  **Timing Blowup:** Collecting/swapping envelopes takes too long.
      *   *Fix:* Have a pre-staged stack of BAG B envelopes ready on the desk. Collect A, hand B immediately. Do not count cards in front of them.
  3.  **No One Buys Info:** If the cost (10 chips) is too high relative to the pot, they won't buy.
      *   *Fix:* Adjust cost to "5 chips or 25% of stack." Ensure the potential loss in Stage 2 is greater than the cost of info.
  4.  **Bankruptcy in Stage 1:** If a group bets 0s early, they die before Stage 2.
      *   *Fix:* Enforce the "Max 50% stack" rule strictly. This keeps them alive long enough to experience the switch.
  5.  **Peeking:** Students look at cards 7–10 during Stage 1.
      *   *Fix:* Walk the room during betting phases. Catch one group "checking" and warn them publicly.
