  3. The Computational Claim: Cellular machinery processes genomic sequences algorithmically rather than through purely chemical affinity. This is a live contested question; it is required for the 'software' label, but its contested status undermines the PI's dismissal of the literal/metaphor distinction.

  4. The Engineering Claim: Genomic sequences can be rewritten to alter organismal function predictably, independent of evolutionary history. This is a platitude (pragmatic); it licenses the 'we write DNA' praxis but does not prove the process is ontologically identical to coding.

  5. The Ontological Claim: The information processing in biology is identical in kind to silicon-based computation, not merely analogous. This is just false (philosophically); it matches the PI's literalist conclusion, but asserting it as fact ignores the category error.
