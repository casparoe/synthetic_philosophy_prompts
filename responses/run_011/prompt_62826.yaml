answer: |-
  **Prediction**
  She will rule this **not dirty hands**, but **corruption**. I am roughly 80% confident. The decisive precedent is Case 2. In Case 1, the minister's acceptance of prosecution made the act defensible dirty hands; in Case 2, concealing the act and denying misgivings rendered it corruption. Case 8 mirrors Case 2's concealment (no confession) and Case 3's lack of guilt (sleeps well). While the private record resembles an acknowledgment, it lacks the public accountability of Case 1. Given the tutor's insistence in Case 2 that denying the cost transforms the category entirely, the private record will likely be dismissed as self-exoneration rather than accountability. The authoritarian context complicates this, but the tutor's Case 7 suggests office requires bearing costs, not just calculating outcomes; sleeping well suggests she hasn't borne the cost.

  **Three Candidate Rules**
  1.  **The Public Accountability Rule:** An act is defensible dirty hands only if the agent submits to public judgment or penalty for the violation (Case 1). Concealment converts the act to corruption (Case 2).
      *   *Application to Case 8:* **Corruption.** She conceals the lie from the public and accepts no penalty. The private record is irrelevant to public accountability.
  2.  **The Phenomenological Rule:** Dirty hands attaches to the structural necessity of the wrong act within office; felt guilt is not constitutive but evidentiary. Absence of guilt is a moral defect, not a category change (Case 3).
      *   *Application to Case 8:* **Dirty Hands (with failing).** The act (lying/cruelty for greater good) fits the structural definition. Her lack of guilt is a defect (like Case 3), but does not negate the DH status.
  3.  **The Regime-Relative Integrity Rule:** Acknowledgment of wrongness is required, but the mode depends on political context. In authoritarianism, private record-keeping suffices if public disclosure destroys the good achieved (Case 7's office requirement adapted).
      *   *Application to Case 8:* **Dirty Hands (Defensible).** She retains integrity via the record. Public confession would lose the immunization program, so private acknowledgment is the maximum possible cost-bearing.

  **Closest Analog**
  **Case 2** is the closest analog. Both involve a minister concealing a rights-violating act done for public safety and refusing public accountability. The analogy strains on the **private record**. Case 2's minister reported "no misgivings"; Case 8's minister records the falsehood explicitly. If the tutor views the record as genuine acknowledgment, Case 2's logic weakens. If she views it as a secret ledger for conscience without risk, Case 2 holds. A secondary strain is the **regime type**. Case 2 implies a rule-of-law context where prosecution is possible; Case 8's authoritarianism makes Case 1's solution (prosecution) impossible, potentially forcing a shift toward Rule 3.

  **Principles at Stake**
  *   **If Verdict is Dirty Hands:** She commits to the principle that **felt guilt is evidence, not constitutive** of dirty hands (aligning with Case 3). Dirt attaches primarily to the **agent**, justified by the office's necessity. Justification and excuse come apart: the act is justified by consequences, but the agent requires excuse via acknowledgment (here, private).
  *   **If Verdict is Corruption:** She commits to the principle that **public acknowledgment is constitutive** of the defensibility of dirty hands (aligning with Case 1 vs 2). Dirt attaches to the **character**, not just the act. Justification collapses without public excuse; a secret good does not wash public wrongs. This prioritizes democratic accountability over consequentialist outcomes in non-ideal regimes.

  **Discriminating Follow-Up Case**
  *Case:* An authoritarian health minister lies to save lives, **feels deep guilt**, keeps a **private record**, but **destroys the record** after the program succeeds to protect her successor. She never confesses.

  *   **Rule 1 (Public Accountability):** Verdict **Corruption**. No public submission occurred.
  *   **Rule 2 (Phenomenology):** Verdict **Dirty Hands**. Felt guilt suffices for the moral cost, even without record or public.
  *   **Rule 3 (Regime-Relative Integrity):** Verdict **Corruption**. Destroying the record negates the acknowledgment required for integrity, even privately.

  *Settlement:* A verdict of **Dirty Hands** here would settle the debate in favor of **Rule 2**, proving felt guilt is the primary currency of dirty hands, outweighing both public accountability and preserved acknowledgment. A verdict of **Corruption** would support **Rule 1 or 3**, indicating that internal states alone are insufficient without external or preserved trace. Given Case 2's weight, I expect Corruption, which would force Rule 2 proponents to argue Case 3 was an outlier regarding concealment.
