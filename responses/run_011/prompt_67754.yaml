answer: |-
  # I. The Shortlist and What Each Entry Excludes

  To locate your character, we must first clear the ground of existing categories that resemble her but fail to capture the specific topology of her commitment. Below are the six strongest candidates from philosophy of religion, theology, and anthropology, along with the specific point at which your character diverges from them.

  **1. Non-Realist Christianity (Don Cupitt / Sea of Faith)**
  *   **The Claim:** Religious language is not about objective facts (God, heaven) but about expressing human values and emotions. One can pray and participate fully so long as one understands the "God" spoken to is a projection of human idealism.
  *   **Where She Diverges:** Cupitt's position is ultimately autonomous; the believer *authors* the meaning of the rite as a human creation. Your character explicitly refuses to author the meaning ("anything she authored would be a prolongation of her opinions"). She requires the rite to be *not* hers. Cupitt saves the sentiment; she saves the structure, but only because it is alien to her.

  **2. Wittgensteinian Fideism (D.Z. Phillips)**
  *   **The Claim:** Religious belief is a "language game" with its own internal rules. It is not making factual claims about the world that can be true or false, so the unbeliever's objection is a category mistake.
  *   **Where She Diverges:** Phillips tends to reduce religious practice to moral or expressive behavior within a community. Your character denies the rite is merely expressive ("the rite is not the sort of thing that says something"). Furthermore, Phillips usually requires participation in a living community of speakers; your character would continue if she were the last person alive. She is not playing a game; she is submitting to an object.

  **3. Cultural Christianity (Grace Davie / "Believing without Belonging" reversed)**
  *   **The Claim:** Individuals retain religious affiliation for identity, heritage, or social cohesion, even without theological assent.
  *   **Where She Diverges:** This is the "flattening" explanation you wish to avoid. It treats the practice as instrumental (useful for the children, the community, the inheritance). Your character explicitly rejects the utility argument. She is not there for the tribe; she is there for the *thing itself*.

  **4. Confucian *Li* (Ritual Propriety)**
  *   **The Claim:** Ritual (*li*) is not an expression of internal belief but a technology that shapes the self and aligns one with the cosmic order. One performs the rite correctly, and the proper state of being follows (or is constituted by) the performance.
  *   **Where She Diverges:** This is the strongest non-Christian parallel. However, *li* is generally tied to social harmony and ancestral piety—a horizontal and vertical social ontology. Your character's practice is more isolated and vertical (between her and the rite), devoid of the social-confucian payoff. She is not aligning with society; she is aligning with a form that society happens to also use.

  **5. Lex Orandi, Lex Credendi (The Law of Praying is the Law of Believing)**
  *   **The Claim:** An ancient Christian maxim suggesting that worship shapes belief. By doing the acts, the theology is inscribed on the soul, regardless of intellectual assent.
  *   **Where She Diverges:** This principle is usually teleological: the practice is meant to *produce* belief or is an expression of the Church's collective belief. Your character has no hope of belief being restored ("known it to be false for twenty years"). She is not using the *lex orandi* to fix the *lex credendi*; she is suspending the *lex credendi* entirely while keeping the *lex orandi* intact.

  **6. Phenomenological Embodiment (Merleau-Ponty / Edward Casey)**
  *   **The Claim:** The body "knows" things the mind does not. Habit and posture carry meaning that precedes cognition.
  *   **Where She Diverges:** This explains *how* she can do it, but not *why* she thinks it is truthful. Phenomenology describes the mechanism of habit; it does not validate the claim that the water is a "better rendering" than the sentence. Your character makes an ontological claim about the rite, not just a psychological one about the body.

  # II. The Verdict and the Boundary of the Concept

  None of the above candidates fully capture the specific configuration of your character's stance. The Non-Realists make the rite too subjective; the Cultural Christians make it too utilitarian; the Confucians make it too social; the Traditionalists make it too dependent on eventual belief.

  There is a residue here substantial enough to deserve its own name. Her position is that the rite possesses an **objective truth-content that is inaccessible to propositional language and is preserved only by the rite's exteriority to the self.** She is not "believing without belonging," nor "belonging without believing." She is **participating without asserting.**

  I propose the term: **Heteronomous Sacramentalism**.

  **Definition:**
  Heteronomous Sacramentalism is the practice of submitting to religious rites precisely because they are externally authored and non-propositional, holding that the ritual act contains a truth that personal belief or invented ceremony would falsify. It asserts that the validity of the rite derives from its resistance to the participant's opinions, functioning as a check on the self rather than an expression of it.

  **Boundary Cases (To test your character against):**
  1.  **The Aesthetic Participant:** Attends mass for the music and architecture, viewing the liturgy as a performance. *Outside the concept:* They treat the rite as an object of consumption, not a authority to which one submits.
  2.  **The Hopeful Catechumen:** An unbeliever who practices in the hope that grace will eventually restore their faith. *Outside the concept:* Your character has explicitly closed this door; her practice is not a means to belief.
  3.  **The Cultural Traditionalist:** Keeps the rites to maintain family continuity or social standing. *Outside the concept:* Your character would continue if she were the last person alive; the social function is irrelevant to her.

  Your character sits firmly inside **Heteronomous Sacramentalism**. The key differentiator is the "Water > Sentence" claim. She posits that the sign (water, bread, posture) carries a density of meaning that the signifier (creed, doctrine) betrays by attempting to define it. She is not a believer in the doctrine, but she is a realist about the rite.

  # III. The Objection and Whether It Is Fatal

  **The Objection: The Incoherence of the Speech Act**
  The strongest philosophical objection comes from the theory of Speech Acts (J.L. Austin, John Searle). Religious rites are not merely descriptions; they are *performative utterances*. To say the Creed, to stand at a font, to receive communion, is to *do* something: to pledge allegiance, to vow, to assert membership.
  The objection argues that you cannot separate the *illocutionary force* (the intent to mean) from the *locutionary content* (the words spoken). If she stands and says "I believe," she is lying, regardless of her internal caveats. To participate in a language game is to accept its rules. By occupying the pew, she is signaling to the community that she is a believer. Therefore, she is either a believer in bad faith (self-deceived) or an evader in good faith (deceiving others). She is "free-riding" on the sincerity of others to access a spiritual good she denies exists.

  **Can She Answer It?**
  She can answer it, but the answer costs her **communal intelligibility**.
  Her defense rests on redefining the rite not as a *statement of fact* but as a *posture of attendance*. She would argue that the rite is not a contract she signs, but a landscape she inhabits. When she says grace, she is not asserting "There is a God who hears this"; she is performing the act of "giving thanks" which, in her view, is a human necessity that does not require a recipient to be valid. She treats the rite as a **dramatic reality** rather than a **legal testimony**.

  **The Cost:**
  The cost is that she must accept she is unintelligible to the very community she joins. As seen in your second scene, she cannot explain herself to the school or the congregation without either lying (claiming belief) or alienating them (claiming unbelief). She occupies a "private language" within a public form.
  Is the objection fatal? **No.** It proves she is an anomaly, not that she is incoherent. It establishes that her position is **lonely**. She cannot have it both ways: she cannot be fully integrated into the community *and* maintain this stance, because the community relies on shared assent. She must accept that to the congregation, she *is* a hypocrite, even if she knows she is not. She trades social honesty for ritual fidelity. This tension is not a bug in your novel; it is the engine of her conflict.

  # IV. The Eliot Question

  **Your Reading:**
  You propose that Eliot's unbelievers keep the moral sentiment and let the doctrine go, treating doctrine as translatable content (poetry that can be rendered into moral prose), whereas your character refuses to translate, insisting the rite resists restatement.

  **The Verdict:**
  Your reading is **correct**, and it identifies a historical shift between the Victorian crisis of faith and the Modern/Post-Modern one.

  **The Argument:**
  George Eliot's translation of Strauss and Feuerbach was an act of **recovery through translation**. She believed the "truth" of Christianity was the humanistic emotion beneath the dogmatic husk. For Eliot, the doctrine was a vessel that could be emptied of its supernatural content and refilled with humanist content without losing its shape. In *Middlemarch*, Dorothea's "epic life" is a secularized saintliness; the *form* of the holy life remains, but the *object* of the holiness is translated into human welfare. Eliot assumes the **commensurability** of religious and secular language. She believes you can say what the rite *really means* in prose (e.g., "Love thy neighbor" means "Promote social utility").

  Your character represents a post-Wittgensteinian, perhaps post-Heideggerian stance. She suspects that **translation is betrayal**. If you translate the rite into moral prose, you lose the specific truth the rite carries. The water *is* the truth; the explanation of the water is a lie. This is a more radical skepticism than Eliot's. Eliot thought the *dogma* was false but the *sentiment* was true. Your character thinks the *dogma* is false, the *sentiment* is irrelevant, but the *act* is true.

  **Does Eliot Allow for a Residue?**
  There are moments in Eliot's later work (specifically *The Impressions of Theophrastus Such* and her correspondence) where she hints that some forms are too deep for translation. She speaks of the "growing good of the world" being dependent on "unhistoric acts," and she retains a reverence for the *structure* of religious life even when the content is gone. However, she never systematically argues that the rite holds a truth *independent* of its moral translation. She always seeks to salvage the *moral utility*.

  **Implication for Your Book:**
  Your book is not in trouble; it is historically situated. Your character is doing something Eliot could not quite do because Eliot was still a Victorian rationalist at heart: she believed everything meaningful could, in principle, be stated. Your character is a Modernist: she believes the most meaningful things cannot be stated.
  If Eliot is the bridge between faith and reason, your character is the inhabitant of the ruin on the other side. She does not need to justify the rite to reason (as Eliot did); she simply submits to the rite as a limit to reason. This makes her more mysterious than Eliot's characters, but also more isolated. You are writing a character who has moved past the "translation" phase of unbelief into the "occupation" phase. This is a valid and philosophically defensible progression.
