answer: |-
  **1. Exam Question**

  **Question 2** (25 marks)

  In *Anarchy, State, and Utopia*, Nozick proposes a hybrid view: utilitarianism for animals, Kantianism for persons. This relies on distinct criteria for (i) whether death is a harm and (ii) whether side constraints apply.

  Consider Moses, an African grey parrot who plans for needs weeks in advance and bonds socially. A virology group proposes painful, non-lethal procedures on Moses to prevent suffering among wild conspecifics. Under the hybrid view, this is permitted. The same proposal applied to a human with profound congenital cognitive impairment (who lacks Moses's planning capacity) would be forbidden.

  Explain the distinction between Nozick's two criteria. Apply them to Moses and the human case. Does Nozick's framework allow him to forbid using the human while permitting the use of Moses? Argue whether the resulting collapse of the hybrid view is a reductio ad absurdum or an attractive consequence.

  ***

  **2. Model Answer**

  Nozick's hybrid view attempts to reconcile the intuition that animals matter with the conviction that persons are inviolable. He suggests we maximize utility regarding animals but respect side constraints regarding persons. To sustain this, Nozick relies on two distinct criteria that students often conflate. The first criterion concerns the harm of death: a being is harmed by death proportionately to how much their life is organised around a long-term future. The second criterion concerns side constraints: these apply only to beings capable of shaping their life according to an overall conception of it, guided by reasons and moral relations. These criteria do not necessarily have the same extension. A being might have a long-term future (criterion one) without having a conceptual grasp of their life as a whole (criterion two).

  Applying this to Moses, the parrot clearly satisfies the first criterion. He caches food for future needs and anticipates tool usage weeks ahead. His life is organised around a future, so his death would be a significant harm in utilitarian calculations. However, the crucial exam question is whether he satisfies the second criterion for side constraints. Nozick ties inviolability to the capacity for rational life-shaping and moral reciprocity. If Moses merely reacts to future contingencies without a conceptual conception of his life, he lacks side constraints. On this reading, the painful procedures are permitted because animals may be sacrificed for the aggregate benefit of animals.

  The human case creates the tension. The man in the care facility lacks long-term planning structures; he fails the first criterion arguably more than Moses. Yet, under the hybrid view, he possesses side constraints. Nozick must explain why. He might argue that species membership itself grants potentiality or that moral relations are grounded in community membership rather than individual capacity. However, if side constraints depend on the capacity to shape one's life via an overall conception, Moses appears to qualify more than the human. Moses plans; the human does not. If Nozick grants Moses side constraints to avoid speciesism, the hybrid collapses. Animals become persons for moral purposes.

  This collapse forces a single-tier Kantianism. If Moses has side constraints, he cannot be used for aggregate benefit. This prohibits the virology procedure. It also prohibits killing animals for food, as killing violates side constraints regardless of utility. Nozick's view would then require widespread intervention in nature to prevent predation, a practical burden he explicitly wishes to avoid. Conversely, if Nozick denies side constraints to the human to maintain consistency with Moses, he accepts that marginal humans may be used for aggregate utility. This is the standard marginal cases argument.

  Is this collapse a reductio? I argue it is unstable rather than immediately absurd, but ultimately unsustainable. It is attractive only if one believes moral status must track cognitive capacity strictly. If we accept that, then yes, Moses deserves protection and the human perhaps less than we assume. But this contradicts the deep intuition protecting vulnerable humans that motivated the hybrid view initially. Nozick wants to protect humans without granting full rights to animals. The Moses case shows these come in a package. You cannot have the planning capacity without the protections it grounds, unless you rely on speciesism.

  Therefore, the hybrid view is unstable. It tries to draw a line at "personhood" that cognitive evidence blurs. If the line is cognitive, Moses crosses it. If the line is species, the view is arbitrary. The collapse into single-tier Kantianism is the logical outcome, even if practically demanding. Nozick cannot have it both ways: he cannot grant the human protection based on capacity while denying it to a parrot who demonstrates higher capacity. The view fails because the two criteria drift apart in extension, leaving the hybrid without a coherent grounding for the boundary between utilitarianism and Kantianism.

  ***

  **3. Marking Scheme**

  **Total: 25 Marks**

  1.  **Identification of the Hybrid View (5 marks)**
      *   *Must hit:* Clearly state Nozick's proposal (Utilitarianism for animals, Kantianism for persons).
      *   *Common error:* Treating the view as simply "animals count for less" without referencing the structural split between utilitarian calculation and side constraints.

  2.  **Distinction Between the Two Criteria (5 marks)**
      *   *Must hit:* Separate the criterion for *harm/death* (long-term future/plans) from the criterion for *side constraints* (overall conception of life/moral reciprocity).
      *   *Common error:* Conflating the two criteria, assuming that if death is a harm, side constraints must apply, or vice versa.

  3.  **Application to Moses and the Human Case (5 marks)**
      *   *Must hit:* Apply the criteria to show Moses meets the harm criterion (planning) and arguably the constraint criterion, while the human fails the harm criterion but is granted constraints.
      *   *Common error:* Ignoring the specific details of the case (e.g., failing to note the human lacks planning capacity) or treating the human case as straightforwardly equivalent to Moses.

  4.  **Analysis of the Dilemma/Collapse (5 marks)**
      *   *Must hit:* Explain that granting Moses constraints collapses the hybrid toward single-tier Kantianism; denying them risks inconsistency with the human case (speciesism).
      *   *Common error:* Supposing pointing out the disanalogy with the human is by itself a refutation, rather than outlining the dilemma Nozick faces to escape it.

  5.  **Evaluation of the Collapse (5 marks)**
      *   *Must hit:* Take a definite position on whether the collapse is a reductio or attractive, justifying the normative weight of the consequence (e.g., intervention in nature, killing for food).
      *   *Common error:* Sitting on the fence without justification, or claiming the collapse is irrelevant to the theory's validity.

  *Note on Opposite Conclusion:* A candidate may argue the view is **STABLE** and earn full marks if they successfully establish that side constraints require *moral reciprocity* or *rational agency* which Moses lacks despite his planning, whereas the human retains status via *potentiality* or *community membership*. They must explicitly defend this distinction against the charge of speciesism.

  ***

  **4. Differentiation: First-Class vs. 2:1**

  A solid 2:1 script will correctly identify the two criteria and apply them to the case, noting the tension between Moses's abilities and the human's limitations. They will recognise the collapse towards Kantianism. A first-class script will go further by evaluating the *normative cost* of that collapse. They will not just state that intervention in nature becomes required, but analyse whether Nozick's epistemic/practical objections to intervention are sufficient to save the view, or whether the moral requirement outweighs practical difficulty. The 1st class candidate will also scrutinise the "overall conception" criterion, questioning whether Moses's planning constitutes such a conception, whereas the 2:1 candidate tends to accept the prompt's framing of the criteria without probing the philosophical definition of "conception of a life."

  Verdict: UNSTABLE
