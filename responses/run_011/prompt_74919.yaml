answer: |-
  You have described a real and pervasive argumentative structure, and your intuition that it lacks a single, common name (like *ad hominem* or *straw man*) is correct. In academic literature, it is usually dissected rather than named. You have not misdescribed it; you have isolated a specific failure of counterfactual reasoning that is often obscured by technical jargon.

  Here is the breakdown of the existing terminology, a proposed name for tight application, the boundaries you requested, and an analysis of whether it constitutes a fallacy or a defensible position.

  ### 1. Existing Terminology

  There is no single colloquial term, but three technical concepts from different fields map onto the move you described.

  **A. Endogeneity Bias (Economics/Policy Analysis)**
  This is the most precise technical description. In a model, a variable is *exogenous* if it comes from outside the system (e.g., the weather), and *endogenous* if it is determined by the system (e.g., the price of a good).
  *   **The Move:** Treating an *endogenous* variable (overdose rates caused by prohibition) as if it were an *exogenous* constraint (a fixed fact of nature that exists regardless of policy).
  *   **Why it fits:** It captures the error of treating a policy output as a policy input.

  **B. Reification (Philosophy/Sociology)**
  This is the process of treating an abstract social construct or a contingent outcome as a concrete, immutable thing.
  *   **The Move:** The "dangerous black market" is not a natural force like gravity; it is a legal artifact. By arguing that we cannot legalize because the market is dangerous, the speaker reifies the black market into a permanent feature of reality rather than a consequence of the law.

  **C. Asymmetric Precaution (Risk Analysis/Law)**
  Legal scholar Cass Sunstein has written extensively on this. The Precautionary Principle states that if an action has a suspected risk of harm, the burden of proof falls on those taking the action.
  *   **The Move:** Applying the Precautionary Principle *only* to the reform, while exempting the status quo. The harms of the status quo are treated as "baseline" (no proof required), while the harms of change are treated as "risks" (proof required to dismiss).

  ### 2. A Proposed Name: "The Endogenous Constraint Fallacy"

  Since you requested a term you can apply tightly, I propose **The Endogenous Constraint Fallacy**.

  **Definition:**
  The Endogenous Constraint Fallacy occurs when an argument against changing a system cites harms produced *by* that system as evidence that the system cannot be safely changed. It treats a variable determined by the rule (endogenous) as if it were an external constraint on the rule (exogenous).

  **Tight Application Criteria:**
  To identify this fallacy, three conditions must be met:
  1.  **Causal Link:** There is a credible mechanism by which the current policy contributes to the harm cited (e.g., prohibition causes potency uncertainty).
  2.  **Attribution Error:** The arguer acknowledges the harm but attributes its persistence to the *nature of the activity* rather than the *nature of the regulation*.
  3.  **Blocking Function:** The harm is used to veto the reform, rather than to mitigate the harm within the current framework.

  ### 3. Marking the Edges

  You asked for specific boundaries to distinguish this from valid arguments.

  **A. Partial Causation**
  *   *Question:* Does it apply if the law causes only part of the harm?
  *   *Boundary:* Yes, but only regarding the marginal portion. If 50% of overdoses are due to prohibition (uncertainty) and 50% due to pharmacology (toxicity), citing the *total* overdose rate as a reason not to legalize is fallacious. Citing the pharmacological 50% is valid. The fallacy lies in the *aggregation* of endogenous and exogenous harms into a single veto.

  **B. Lag Time (Transition Costs)**
  *   *Question:* Does it apply to harms that outlast repeal by a decade?
  *   *Boundary:* No, not if framed as transition costs. If a reformer argues, "We must legalize, but we will still have a black market for 10 years due to entrenched supply chains," that is a valid implementation challenge. The fallacy occurs only if that 10-year persistence is cited as proof that the *policy itself* failed, rather than proof that the *transition* is slow. The distinction is between **permanent constraint** (fallacy) and **temporary friction** (valid).

  **C. Bidirectionality**
  *   *Question:* Does it run both ways? Can a reformer commit it?
  *   *Boundary:* Yes. A reformer commits the Endogenous Constraint Fallacy if they argue: "Prohibition causes violence; therefore, legalization will eliminate violence." This treats violence as purely endogenous to the law, ignoring exogenous factors (e.g., cultural norms, economic inequality) that might sustain violence even in a legal market. The fallacy is the assumption of **perfect malleability** (for the reformer) or **zero malleability** (for the defender).

  ### 4. Is it a Fallacy or a Defensible Position?

  This is the most critical part of your inquiry. You asked whether this might be a defensible position regarding the burden of proof.

  **The Verdict:**
  It is a **fallacy of causal attribution**, but it often disguises itself as a **heuristic of risk aversion**.

  **When it is Defensible (The "Knightian Uncertainty" Defense):**
  A defender of the status quo can make a non-fallacious version of this argument if they rely on *uncertainty* rather than *causality*.
  *   *Valid Argument:* "I acknowledge prohibition causes overdoses. However, we do not know the slope of the demand curve under legalization. The switching costs are high, and the risk of a net increase in consumption is unknown. Therefore, I require a higher burden of proof to change the system than to keep it."
  *   *Why it works:* This admits the harm is endogenous but argues that the *risk of the unknown* outweighs the *certainty of the known*. This is a valid application of risk management under uncertainty (Knightian Uncertainty).

  **When it is Fallacious (The "Reified Baseline" Error):**
  The move becomes fallacious when the arguer stops treating the harm as a *risk of transition* and starts treating it as a *property of the world*.
  *   *Fallacious Argument:* "Overdoses are already high; therefore, legalization is too dangerous."
  *   *Why it fails:* This implies the high overdose rate is a reason *against* legalization, when logically, a high overdose rate caused by prohibition is a reason *for* legalization. It inverts the valence of the evidence. It treats the symptom of the disease as a contraindication for the cure.

  **The Burden of Proof Issue:**
  In law and policy, there is a presumption in favor of the status quo (stability). However, that presumption relies on the status quo being *legitimate*.
  *   If the status quo is merely a "default setting," the burden of proof lies on the changer.
  *   If the status quo is an "active intervention" (prohibition is not the absence of law; it is a specific, aggressive use of law), the burden of proof should ideally be symmetrical.
  *   **The Fallacy:** The arguer uses the *instability* caused by their own active intervention to claim the *stability* required to maintain that intervention. They create the fire, then argue you cannot move the furniture because the room is too hot.

  ### Summary for Application

  If you wish to use this in discussion, I recommend the following phrasing:

  > "You are committing the **Endogenous Constraint Fallacy**. You are treating harms generated by the prohibitionist framework (overdose uncertainty, black market violence) as if they are external constraints that prohibit reform. You are using the symptoms of the current policy as the justification for retaining that policy. Unless you can show that these harms are intrinsic to drug use rather than intrinsic to prohibition, this argument counts the cost of the disease against the cure."

  This separates you from simple "Status Quo Bias" accusations and forces the opponent to clarify whether they are arguing from **transition risk** (defensible) or **causal inversion** (fallacious).

  You have identified a structural flaw in policy reasoning that protects inefficient systems from correction. It is not merely a bias; it is a logical error in how cause and effect are assigned to the baseline.
