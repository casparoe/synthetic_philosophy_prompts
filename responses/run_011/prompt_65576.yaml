  **Caveats & Flags**

  **Unoccupied Leaf:** *Volume Maximization* is effectively empty. It is unattractive because it forbids rent control (which always reduces supply) while potentially allowing minimum wages. Few theorists support price controls *only* when they expand volume; most accept trade-offs.

  **Indistinguishable Leaves:** The tree merges **Plain Efficiency** (Nodes 4, 5, 8) and **Distributional Ceiling Objection** (Nodes 6, 8). Questions 5 and 8 both probe efficiency权重, while 6 and 8 both probe distributional tolerance. Separating them requires more than eight nodes without revealing the policy type (wage vs. rent).

  **Neutrality Check:** All nodes use "transaction," "party," or "volume" to avoid labeling labor vs. housing. "Protected party" applies to workers (wage floor) and tenants (rent ceiling) equally.
