answer: |-
  **1. The Measurement Problem**
  You argue that legitimacy functions like a currency that can be banked. But currencies have standard units of account. In your model, what counts as a unit of legitimacy? Is it GDP points, years of peace, or a qualitative assessment? If the units are defined by the theorist after the fact, doesn't the "reserve" become a metaphor that does no explanatory work, merely renaming stability as "savings"?

  *   **Likely Reply:** She will likely argue that legitimacy is qualitative, not quantitative. She'll say we can observe the "balance" through social indicators like low crime, high trust, and lack of unrest, rather than a specific number.
  *   **Follow-up:** If the balance is only visible through the very stability you're trying to explain, aren't you arguing in a circle? If unrest appears, you say the reserve is low; if it doesn't, you say it's high. How do you distinguish a regime with a *low* reserve that is holding on, from a regime with a *high* reserve that is simply unchallenged?

  **2. The Falsifiability Trap**
  Critics worry this model is immune to disconfirmation. If a regime survives a crisis, you say it had enough reserve; if it collapses, you say it ran out. Is there any historical case where a regime performed well, built a surplus, and *still* lacked legitimacy on your account? If not, isn't survival just being retroactively defined as legitimacy?

  *   **Likely Reply:** She will likely insist that performance isn't just survival; it's about objective welfare. She might cite a regime that survived through brute force despite economic collapse as having *no* reserve, distinguishing survival from legitimacy.
  *   **Follow-up:** But if brute force can keep a regime alive without legitimacy, and your model says legitimacy is the *right* to rule, how do you separate the power to survive from the right to rule without referencing the very procedural standards you claim to replace? If the only test for the "right" is the "power," have you actually offered a normative theory?

  **3. The Expectations Ratchet**
  Tocqueville noted that improving conditions often raise expectations faster than reality, accelerating dissatisfaction. In your model, does the "cost" of maintaining legitimacy rise as a country gets richer? If prosperity makes citizens demand more participation, doesn't successful performance actually increase the rate of drawdown, making long-term authoritarianism self-undermining?

  *   **Likely Reply:** She will likely concede that expectations rise but argue that a smart government invests part of its surplus in adapting to these demands (e.g., local consultations) without surrendering sovereignty.
  *   **Follow-up:** If the government must constantly adapt to rising demands to maintain the reserve, isn't that just a slow-motion version of procedural accountability? At what point does "adapting to demands" become the very election-like mechanism you say isn't a precondition?

  **4. The Ledger Integrity Problem**
  A bank reserve requires an honest ledger. In regimes with censored statistics and state-controlled media, the government controls the data on prosperity and the narrative on order. Is a reserve built on censored statistics a legitimate store of value, or is it an IOU the state has written to itself? Can you have performance legitimacy if the "performance" is unverifiable?

  *   **Likely Reply:** She will likely argue that people know materially whether they are doing well (food on the table, safety) regardless of media narratives, so the "reserve" is grounded in lived experience, not press releases.
  *   **Follow-up:** But if the state claims credit for global commodity booms while hiding domestic policy failures, they are inflating the reserve artificially. If the citizenry cannot distinguish skill from luck due to information control, is the legitimacy based on performance or on successful manipulation?

  **5. The Normative Smuggle**
  You insist this is a normative claim, not just predictive. But when you say a regime with a surplus has a "right to rule" despite no elections, aren't you relying on a tacit consent standard? If a citizen says, "I don't accept this trade-off," and you reply, "But you're doing fine," aren't you overriding their actual consent with a hypothetical "reasonable" consent you've defined for them?

  *   **Likely Reply:** She will likely argue that legitimacy is objective, based on whether the regime secures basic goods, not on subjective feelings. She'll say we don't ask children if they consent to parental authority; we ask if they are cared for.
  *   **Follow-up:** Adults are not children. If you define "doing fine" by a metric the citizen rejects, you are imposing a paternalistic standard. Does your normative claim ultimately rest on the idea that the theorist knows what citizens *should* value better than the citizens do?

  **6. Intergenerational Transfer**
  Can a reserve be inherited? If a dictatorship builds a thirty-year surplus and then hands power to a son who squanders it, did the son have legitimacy for the first year? Does the reserve attach to the state, the party, or the specific leadership, and if it's the leadership, doesn't the model collapse into a personalist theory of rule?

  **7. Defining the Withdrawal**
  You say demands for elections are a "claim on the reserve." But is protest a withdrawal or a symptom of depletion? If a government suppresses a protest, does that count as spending the reserve (cost of order) or protecting it? If suppression is cheap, does your model incentivize regimes to spend less on welfare and more on police to keep the ledger balanced?

  **8. The Cliff Edge**
  Is legitimacy binary or gradual in your model? When the reserve hits zero, does the regime lose the right to rule instantly, or is there a grace period? If a regime is illegitimate but stable (negative balance but no collapse), what normative work is the concept doing other than describing a ticking time bomb?

  **9. External Shocks**
  How does your model account for global pandemics or financial crises outside state control? If a regime loses its reserve due to an external shock despite competent management, does it lose legitimacy? If not, then legitimacy isn't about performance, it's about luck, which undermines the "performance" part of your theory.

  **10. The Falsification Condition**
  I want to close on the scientific status of the claim. Please name a single, concrete observation—a specific regime, a specific set of statistics, or a specific historical outcome—that, if it existed, would force you to abandon the reserve model entirely. If you cannot name a condition under which the model is false, you are not offering a theory, but a tautology.
