answer: |-
  You are arguing for a baroque principle without noticing it. Specifically, your intuition on Libya ("first phase right, whole thing wrong") and Vietnam ("good outcome, but don't want to call it right") are attempts to have your cake and eat it too. You want to judge actions by their motives *and* their outcomes, but only when it suits the narrative.

  To get the single principle you asked for, we need to anchor it to your strongest conviction: **Iraq was wrong even in the counterfactual where the occupation went smoothly.**

  This tells me your core moral commitment is not purely consequentialist. You believe there is a *type* of action that is illegitimate regardless of the body count. That type is **Social Reordering.** You believe force is legitimate to *stop* killing (Interdiction), but not to *fix* the society doing the killing (Reordering).

  Here is the principle that derives from your verdicts, stripped of the exceptions.

  ### The Principle of Humanitarian Interdiction

  A state or coalition may use force inside another sovereign territory if and only if four conditions are met:

  1.  **The Threshold of Physical Destruction:** The justification must be imminent or ongoing mass killing (genocide, crimes against humanity). Cultural erasure, political oppression, or human rights abuses that do not involve immediate physical destruction do not qualify.
      *   *Motivating Verdict:* **Rwanda** (Clear mass killing = duty to act); **Case (b)** below (Cultural erasure = no force).
  2.  **The Primacy of Humanitarian Intent:** The *primary* motive must be the cessation of killing. Geopolitical gain, resource access, or regime change for its own sake invalidates the intervention, even if killing stops.
      *   *Motivating Verdict:* **Iraq** (Wrong even if smooth, because motive was security/regime change, not pure humanitarianism); **Case (a)** below (Geopolitical motive = illegitimate).
  3.  **The Limit of Interdiction:** Force must be limited to what is necessary to stop the killing. It may not extend to occupation, nation-building, or forced regime change unless the regime is the *direct, immediate instrument* of the killing and cannot be coerced otherwise.
      *   *Motivating Verdict:* **Kosovo** (Right: air power to stop cleansing, no occupation); **Libya** (Wrong: shifted from protection to hunting Gaddafi/state collapse); **Vietnam/India** (Wrong: full invasion/regime change, even if outcome was good).
  4.  **The Epistemic Constraint:** There must be a reasonable prospect that the intervention will not cause a greater collapse of order than the killing it stops. If the likely outcome is a power vacuum or civil war, force is prohibited.
      *   *Motivating Verdict:* **Syria** (Right not to strike: risk of quagmire/escalation outweighed punitive value); **Somalia** (Verdict changed because the *prospect* of net good vanished when the body count rose).

  ***

  ### Application to New Cases

  **(a) The Geopolitical Drone Campaign**
  *   **Scenario:** Foreign power stops massacres via drones, no ties, motive is keeping a rival out, no local consent.
  *   **Verdict:** **Wrong.**
  *   **Reasoning:** Fails Clause 2 (Primacy of Intent). The lives saved are incidental to a geopolitical goal. Under this principle, you cannot instrumentalize humanitarianism to check a rival, even if the bodies pile up less than they would have otherwise. This aligns with your rejection of Iraq's mixed motives.

  **(b) The Cultural Erasure**
  *   **Scenario:** Regime transfers children and bans language, no mass killing. Threat of force to stop it.
  *   **Verdict:** **Wrong.**
  *   **Reasoning:** Fails Clause 1 (Threshold of Physical Destruction). While this may constitute cultural genocide, this principle restricts *force* to immediate physical destruction. This aligns with your hesitation on expanding the "mass killing" definition to cover Syria's chemical weapons (which were punitive/terroristic) vs. Kosovo's ethnic cleansing (which was physical removal/death).

  **(c) The Regional Intervention**
  *   **Scenario:** Authorized by non-UN regional body, works, population wants it, government objects.
  *   **Verdict:** **Right.**
  *   **Reasoning:** Passes Clause 3 (Interdiction) and Clause 4 (Prospect). It satisfies the "Kosovo Exception" to UNSC authority: when the UN is paralyzed, a multilateral regional body + local consent can substitute for UNSC authorization. This saves Kosovo without opening the door to unilateralism.

  **(d) Sanctions vs. Air Campaign**
  *   **Scenario:** Sanctions stop killing in 4 years (0 civilian deaths from intervention). Air stops in 3 weeks (few hundred civilian deaths from intervention).
  *   **Verdict:** **Air Campaign is Right.**
  *   **Reasoning:** Fails Clause 1 if you wait. "Mass killing" implies urgency. A four-year timeline for stopping genocide violates the **Necessity** inherent in Clause 1. The "few hundred civilians" is a tragic cost, but the duty to protect is time-sensitive. Waiting four years while people are murdered violates the Threshold. This aligns with your verdict on Rwanda (failure to act quickly was the worst failure).

  ***

  ### The Bill: What You Have to Give Up

  You asked me to be blunt about which of your verdicts this principle cannot save. To have a clean, applicable principle, you must abandon two specific intuitions you currently hold.

  **1. You must abandon the "Libya Phase 1" Distinction.**
  You want to say the start of Libya was right and the end was wrong. This principle says **the whole thing was wrong.**
  *   *Why:* Clause 3 (Limit of Interdiction) and Clause 2 (Intent) are not just rules of conduct; they are conditions of legitimacy. If the mission creeps into regime change (hunting Gaddafi), it reveals that the *initial* authorization was either naive or dishonest. You cannot sever the seed from the fruit. If the outcome is state collapse, the epistemic judgment (Clause 4) required at the start was flawed.
  *   *The Trade:* You gain consistency on Iraq. Iraq and Libya become the same category: **Illegitimate Reordering.** You lose the nuance that "they tried to do good initially."

  **2. You must abandon the "Vietnam/India Ambiguity."**
  You currently say the killing stopping was good, but you don't want to call the invasion *right*. This principle says **the invasion was Wrong.**
  *   *Why:* Clause 3 forbids full-scale invasion and regime change by neighbors for humanitarian ends. Vietnam and India were acts of war that resulted in occupation and regime toppling. That they stopped a genocide is "Moral Luck," not justification.
  *   *The Trade:* You gain a hard boundary against powerful neighbors using "humanitarianism" as a pretext for conquest (a very real risk in international law). You lose the ability to praise the outcome of 1979 Cambodia without endorsing the method.

  ### Summary of the Choice

  You are currently trying to hold a **Deontological** view on Iraq (it was wrong by nature, regardless of outcome) and a **Consequentialist** view on Libya/Somalia (it went wrong because of the outcome).

  This principle forces you to be **Consistently Restrictivist.**
  *   **Iraq:** Wrong (Reordering).
  *   **Libya:** Wrong (Reordering).
  *   **Kosovo:** Right (Interdiction).
  *   **Vietnam:** Wrong (Reordering/Conquest).

  If you accept this, you stop arguing about whether the occupation *would have gone smoothly* in Iraq. It doesn't matter. It was the wrong *kind* of war. If you reject this, you admit that your opposition to Iraq is actually consequentialist, and you must concede that a "smooth Iraq" would have been Right—which you explicitly said you cannot do.

  Pick the Restrictivist principle. It costs you the "good invasions" (Vietnam/India) and the "good starts" (Libya Phase 1), but it saves you from the baroque exception-making you're currently stuck in.
