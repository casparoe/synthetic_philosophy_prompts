      *   *Re-reading:* "Tell me if the chair's demand... is actually a desideratum or just an aesthetic preference."

      *   *Key Insight:* The three proposals are normatively heterogeneous.
          *   Lowering age = Expansion based on *capacity/stake*.
          *   Non-citizen voting = Expansion based on *subjection/residence*.
          *   Compulsory voting = Restriction on *liberty* based on *duty*.
          *   To unify these, the principle must be "Membership entails both full stake and full duty."
          *   Does that work? If Residents are members (Prop 2), they must vote (Prop 3). If 16yos are members (Prop 1), they must vote (Prop 3).
          *   The problem is defining "Membership."
