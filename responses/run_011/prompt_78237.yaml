      *   *Residents @ 5 yrs:* Expands franchise based on residence/subjection/affectedness, decoupled from citizenship.
      *   *Compulsory Voting:* Changes the *nature* of the franchise from a right to a duty (or right+ duty). This is the tricky one. Most theories of *enfranchisement* (who gets to vote) don't automatically entail *compulsion* (must vote). In fact, liberal theories often oppose compulsion. To get compulsion from a theory of *who belongs*, the theory needs to frame membership as civic obligation, not just inclusion.

  3.  **Drafting the Spec (Requirements):**

      *   *Requirement 1: Boundary Determinacy.* The theory must give clear yes/no answers for the boundary cases (toddlers, prisoners, emigrants, etc.).
      *   *Requirement 2: The Compulsion Link.* The theory must explain why membership entails *obligation* to vote, not just permission. (Crucial for Proposal 3).
      *   *Requirement 3: Coherence on Citizenship vs. Residence.* Must handle the non-citizen resident case without collapsing into "citizenship only" or "presence only."
      *   *Requirement 4: Competence Threshold.* Must address capacity without disenfranchising low-information adults (empirical debt regarding 16-year-olds).
      *   *Requirement 5: Non-Circularity (Self-Application).* The current demos can't arbitrarily define the future demos without a higher-order principle.
      *   *Requirement 6: Distinction Preservation.* Must distinguish *inclusion* (who) from *weight* (how much). (Answering the user's specific question).

  4.  **Addressing the Chair's Demand (One Principle, Three Verdicts):**

      *   Is it aesthetic? Mostly. Usually, *inclusion* (who) and *compulsion* (behavior) are governed by different normative logics (rights vs. duties). Forcing one principle to do both is theoretically strenuous. It risks category errors.
      *   *Verdict:* It's a high bar, likely bordering on impossible for standard liberal theories. It requires a "Civic Republican" or "Strong Communitarian" turn to link membership to duty.

  5.  **Addressing the Incompatibility (The "Fatal Flaw"):**

      *   The user suspects Affectedness vs. Coercion comes apart.
      *   *Proposal 1 (16yo):* High affectedness (school, future), low coercion (taxes, contracts).
      *   *Proposal 2 (Residents):* High coercion (laws, taxes), high affectedness.
      *   *Proposal 3 (Compulsion):* Requires a duty based on membership.
      *   *The Conflict:* A pure "All Affected" principle justifies 16yo and Residents, but *never* justifies Compulsion (being affected doesn't mean you must act). A pure "All Subjected" principle justifies Residents, maybe 16yo, but again, doesn't justify Compulsion.
      *   *The Real Incompatibility:* Linking *Inclusion* (Prop 1 & 2) with *Compulsion* (Prop 3) under *one* principle. Inclusion is usually about *interests*; Compulsion is about *obligations*.
      *   *Hypothesis:* You cannot derive Compulsory Voting from a principle of *Enfranchisement* alone. You need a principle of *Civic Duty*. If the Chair insists on one principle of *Demos Membership*, Proposal 3 is the outlier.

  6.  **Addressing the Empirical Debts:**

      *   Competence of 16-year-olds vs. low-info adults. If the theory relies on competence, it must either disenfranchise low-info adults (politically impossible) or lower the bar to include 16-year-olds.
      *   Compulsory voting effects. Does it change outcomes? If the theory relies on "better outcomes," it needs data. If it relies on "legitimacy," it needs less data.

  7.  **Evaluating the Contenders:**

      *   *Dahl (Affectedness):* Good for 16yo and Residents. Fails Compulsion (no duty generated). Fails boundary (who is affected? everyone).
      *   *Coercion (All Subjected):* Good for Residents. Okay for 16yo (subject to laws). Fails Compulsion (being coerced doesn't mean you must vote).
      *   *Membership (Citizenship/Community):* Good for Compulsion (members have duties). Bad for Residents (excludes them). Bad for 16yo (often treated as partial members).

  8.  **Refining the "Vote Weight" Question:**

      *   Does the spec need to cover vote weight? No. That's a separate design question (districting, proportional rep). The spec is about *boundaries* and *nature* of the franchise. Keep it out to maintain focus.

  9.  **Structuring the Response:**

      *   **Introduction:** Acknowledge the difficulty.
      *   **The Chair's Demand:** Analyze if it's aesthetic or substantive. (Verdict: Substantive but risky).
      *   **The Spec Table:** Requirements, Motivation, Negotiability, Empirical Debt.
