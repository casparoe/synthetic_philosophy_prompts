answer: |-
  ### 1. The Chair's Demand: Desideratum or Aesthetic?

  It is **not merely aesthetic**. It is a substantive consistency constraint. If you justify lowering the age based on *stake* (they live here), but justify compulsion based on *civic duty* (citizenship), you create a normative conflict: a 16-year-old resident has the stake but perhaps not the full civic status to bear the duty. If the justifications are fragmented, the reforms can be picked off one by one by opponents exploiting the gaps between principles.

  However, it is a **high-risk theoretical constraint**. Standard liberal democratic theory treats enfranchisement (a right) and compulsion (a duty) as categorically distinct. Demanding one principle generate both requires a "Civic Republican" or "Strong Communitarian" framework where membership is inherently an office with obligations. If you force a standard liberal principle (like "All Affected") to do this work, it will break. The demand is valid for policy coherence, but it may be theoretically impossible to satisfy without adopting a specific, contentious view of citizenship.

  ### 2. The Spec: Requirements for an Adequate Theory

  | Requirement | Motivating Case / Consideration | Negotiability | Empirical Debt |
  | :--- | :--- | :--- | :--- |
  | **1. Boundary Determinacy** | Must yield clear verdicts on edge cases (toddlers, prisoners, emigrants, seasonal workers) without ad-hoc exceptions. If the principle is "affectedness," it must explain why toddlers (affected) are out and emigrants (unaffected) are in/out consistently. | **Non-negotiable.** A theory that cannot draw a line is not a theory of boundaries. | Low. Mostly conceptual. |
  | **2. The Duty Link** | Must explain why *membership* in the demos entails an *obligation* to vote (Proposal 3). Standard rights-based theories grant the option to abstain; this theory must treat voting as a function of membership, not just a liberty. | **Non-negotiable** (given Chair's constraint). Without this, Proposal 3 is orphaned. | **High.** Depends on whether civic duty can be empirically enforced without undermining legitimacy. |
  | **3. Coercion/Stake Alignment** | Must resolve the mismatch between who is coerced by laws and who has a stake in outcomes. (e.g., 16yos are coerced by school laws but pay no tax; residents pay tax but lack citizenship). | **Preference** (Liberal Camp). Some theories prioritize subjection, others prioritize interest. | **High.** Requires data on how 16yos and residents actually experience state coercion vs. benefit. |
  | **4. Competence Floor** | Must specify a capacity threshold that includes 16-year-olds (Proposal 1) without logically requiring the disenfranchisement of low-information adult voters (a political non-starter). | **Preference** (Epistocratic Camp). Can be waived if the theory treats voting as a right rather than a skilled task. | **High.** Requires comparative data on political knowledge/decision-making of 16yos vs. low-info adults. |
  | **5. Non-Circularity** | The current demos cannot define the future demos arbitrarily. The principle must be external to the current electorate's self-interest (e.g., current voters can't just vote to keep non-voters out). | **Non-negotiable.** Otherwise, reform is impossible by definition. | Low. Conceptual. |
  | **6. Distinction Preservation** | Must distinguish *inclusion* (who votes) from *weight* (how much the vote counts). | **Non-negotiable.** Conflating the two leads to gerrymandering or plural voting justifications. | Low. Conceptual. |

  **Note on Vote Weight:** You asked whether "who's in the demos versus how much each vote weighs" belongs inside the spec. **It does not.** That is a question of electoral system design (proportional vs. district-based), not franchise theory. Keep it out. Your spec is about the *boundary* and the *nature* of the franchise, not the aggregation mechanism.

  ### 3. The Incompatibility Finding

  There is a subset of requirements that cannot be jointly satisfied by standard liberal theories: **Boundary Determinacy (1)**, **The Duty Link (2)**, and **Coercion/Stake Alignment (3)**.

  *   **The Problem:** To get Proposal 1 (16yos) and Proposal 2 (Residents), you need a principle of *Inclusion* based on Stake or Subjection. To get Proposal 3 (Compulsion), you need a principle of *Obligation* based on Membership/Citizenship.
  *   **The Conflict:** If you define membership broadly enough to include 16-year-olds and non-citizen residents (for Prop 1 & 2), you dilute the traditional "citizen" bond that usually justifies compulsion (Prop 3). If you define membership strictly enough to justify compulsion (full civic peers), you exclude the residents and likely the 16-year-olds.
  *   **The Verdict:** You cannot derive all three from a standard "All Affected" or "All Subjected" principle. Those principles justify *rights*, not *duties*. To satisfy the Chair, you must adopt a **"Civic Office" theory**: *Voting is not a right of the affected, but a function of the community member.*
      *   *Verdict 1 & 2:* 16yos and 5-year residents are functionally members of the community (social fact).
      *   *Verdict 3:* Because they are members, they hold the office of voter, which carries a duty.
      *   *Risk:* This collapses the distinction between *resident* and *citizen*, which may be legally or politically untenable even if theoretically sound.

  ### 4. Your Hunch: Affectedness vs. Coercion

  Your hunch is correct: **Affectedness and Subjection-to-Coercion come apart precisely in the target cases.**

  *   **16-Year-Olds:** High subjection (truancy laws, juvenile justice), low financial stake (no taxes), high future affectedness.
  *   **Permanent Residents:** High subjection (all laws), high financial stake (taxes), no formal citizenship.
  *   **Emigrant Citizens:** Low subjection (live elsewhere), low affectedness (zoning doesn't touch them), high formal status.

  **Is this fatal?** Not if you use a **Hybrid Principle**. A single criterion (e.g., "Only Taxpayers") fails. But a principle of **"Permanent Social Membership"** can cover all three.
  *   *Fix:* Define membership not by citizenship or age, but by *center of life*. If your life is centrally located here (school, home, work) for a sustained period, you are a member.
  *   *Cost:* This requires abandoning citizenship as the boundary marker. If the municipality lacks the legal authority to decouple voting from citizenship, the theory is practically dead letter. Check the city charter/state law.

  ### 5. The "Killer" Requirement

  **Requirement 2 (The Duty Link)** does the most work in eliminating candidates.

  Almost every standard theory of enfranchisement (Dahl, Rawls, Dworkin) treats voting as a **right**. Rights can be waived. Compulsory voting treats voting as a **duty**.
  *   **Affectedness Principle:** Fails. Being affected by a decision gives you a claim to be heard, not an obligation to speak.
  *   **Coercion Principle:** Fails. Being subject to law gives you a right to consent, not a duty to vote.
  *   **Membership Principle:** **Passes.** If voting is a function of membership (like jury duty), it can be compulsory.
  *   **Implication:** To satisfy the Chair, you *must* argue for a Membership theory. But Membership theories traditionally exclude non-citizens (Proposal 2). You have to stretch "Membership" to include non-citizens while keeping it strong enough to mandate duty. That is your theoretical tightrope.

  ### 6. Contender Evaluation

  *   **Dahl-ish (All Affected Interests):**
      *   *Verdicts:* Supports 16yos and Residents strongly. **Fails Compulsion.**
      *   *Flaw:* Cannot explain why an affected person *must* vote. Also over-includes (tourists are affected by traffic laws).
  *   **Coercion (All Subjected to Law):**
      *   *Verdicts:* Supports Residents and 16yos (subject to school/criminal law). **Fails Compulsion.**
      *   *Flaw:* Like Affectedness, subjection generates a right to consent, not a duty to participate. Also struggles with emigrants (not subjected, but keep vote).
  *   **Membership / Social Justice (Community Membership):**
      *   *Verdicts:* **Supports Compulsion** (members have duties). Can support 16yos/Residents *if* membership is defined socially rather than legally.
      *   *Flaw:* Requires redefining citizenship. Risks circularity (who defines the community?). This is the only contender that *can* meet the Chair's demand, but it requires the most normative heavy-lifting.

  ### 7. Empirical Debts to Flag

  In your memo, explicitly mark these as "Theory-Limiting Empirical Premises":

  1.  **Competence Equivalence:** If you argue 16yos are capable, you must accept that low-information adults are equally capable (or admit competence isn't the criterion). If the data shows 16yos have systematically lower political knowledge than the median voter, a competence-based theory fails Proposal 1.
  2.  **Compulsion Efficacy:** If compulsory voting is justified by "better outcomes" or "higher legitimacy," you need evidence that fines produce legitimate governments rather than resentful ones. If the theory relies on "civic habituation," that is a long-term empirical claim currently unproven.
  3.  **Residency Stability:** "Five years" is arbitrary. A theory of "Permanent Membership" needs to know if 5 years actually signals permanence. If turnover is high, the "membership" claim weakens.

  ### Summary Advice for the Memo

  Do not try to force a liberal "rights" theory to justify compulsion. It won't work. Adopt the **"Civic Office"** model: *Voting is a public function performed by community members.*
  *   **Who belongs?** Anyone whose center of life is here (covers 16yos, Residents, excludes emigrants).
  *   **Why vote?** Because it's the job of the member (covers Compulsion).
  *   **The Catch:** You must explicitly state that this requires decoupling voting from national citizenship. If state law forbids that, Proposal 2 is dead regardless of theory.

  The Chair's demand is possible, but only if you shift the paradigm from "Voting as a Right" to "Voting as a Duty of Residence." That is the single thread that ties all three proposals together.
