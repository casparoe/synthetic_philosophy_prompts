      *   **The User's Hunch:** Affectedness vs. Coercion analysis.
      *   **The "Killer" Requirement:** Which one eliminates the most? (The Compulsion Link).
      *   **Contender Evaluation:** Brief run-down.
      *   **Conclusion:** Final advice on the memo strategy.

  10. **Refining the Content (Self-Correction during drafting):**

      *   *Correction:* I need to make sure I don't just say "Compulsion is impossible." I need to say what principle *could* do it. A "Civic Office" model might work (voting is a job of membership).
      *   *Correction:* The user asked about "Vote Weight." I need to explicitly state it belongs outside the spec.
      *   *Correction:* Ensure I mark "Non-negotiable" vs "Preference." The Chair's demand is a constraint, but theoretically, it might be a "Preference" for unity that conflicts with "Non-negotiable" logical consistency. I should frame the *requirements for a valid theory* as non-negotiable, and the Chair's demand as a constraint that might break the theory.
