      *   **Constraint 1 (The Chair's Demand):** The theory must derive *all three* verdicts from *one* account of who belongs in the demos (or prove no single account can do it).
      *   **Constraint 2 (Output):** No survey of existing views, no citations/reading list. Focus on requirements, their justification, negotiability, and empirical debts.
      *   **Specific Questions to Answer:**
          *   Is the Chair's demand (one principle, three verdicts) a genuine desideratum or aesthetic?
