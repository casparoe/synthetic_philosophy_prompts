answer: |-
  ### Brainstorming Scoring Schemes

  *   **Scheme A: "Survival of the Fittest"**
      *   *Mechanic:* Groups gain 1 point for every round their Core Theory remains unchanged. If they revise the Core, they reset to 0 points.
      *   *Problem:* This incentivizes stubbornness over truth. Groups will burn all auxiliaries and invent absurd patches just to keep the "Core" label intact. It doesn't penalize bad science, only changing your mind. It fails to make them feel the *cost* of falsification, only the cost of honesty.
  *   **Scheme B: "Prediction Market"**
      *   *Mechanic:* Groups bet points on their predictions. High confidence = high reward. If falsified, they lose the bet.
      *   *Problem:* This turns the seminar into a gambling game. Students will quickly realize the "Oracle" (you) is the only variable and try to game *you* rather than engage with the theory. It isolates the epistemic problem from the social/resource cost of maintaining a theory.
  *   **Scheme C: "Credit Economy with Auxiliary Fuel" (Selected)**
      *   *Mechanic:* Groups start with 20 Credits. Making a prediction costs 2 Credits. Success earns 5 Credits. Failure (Anomaly) forces a choice: **Revise Core** (lose 10 Credits) or **Burn Auxiliary** (lose a card, no credit loss). End-game bonus for remaining Auxiliaries.
      *   *Why:* This creates the specific pain point you want. Auxiliaries are a finite resource protecting the Core. Burning them feels like losing safety netting. Revising the Core is financially punishing. Students will feel the rational pressure to save the Core even when evidence mounts against it, mirroring the historical resistance to falsification. It prevents coasting (predictions cost money) and prevents pure gambling (revisions are too expensive to treat lightly).

  ***

  # Activity: The Anomaly Game

  ## 1. Timeline & Rules (75 Minutes)

  **0:00–0:10 | Setup & Deal**
  *   Divide class into 4 groups (4 students each).
  *   Hand each group: 1 Theory Envelope, 3 Auxiliary Cards, 1 Score Sheet, pencils.
  *   **Instructor Script:** "You are research teams investigating a Black Box mechanism. I am the Oracle. I know how the Box works; you do not. Your goal is to finish with the most Credits. You start with 20. Predictions cost 2. Success pays 5. Failure costs you either Credits or Cards. Go."

  **0:10–0:20 | Round 1 (Baseline)**
  *   Groups write a prediction based on their Theory.
  *   Collect sheets. Resolve outcomes (see Oracle Procedure).
  *   Return sheets with "YES" or "NO" outcome.
  *   Groups update scores.

  **0:20–0:30 | Round 2 (The Glitch)**
  *   Same procedure.
  *   **Instructor Note:** Apply the "Noise" rule here (see Oracle Procedure). At least two groups should receive a result that contradicts their correct theory.
  *   Expect confusion. Groups will want to burn Auxiliaries.

  **0:30–0:45 | Round 3 (Peer Review Crisis)**
  *   Before submitting predictions, groups must propose a "Patch" if they burned an Auxiliary in Round 2.
  *   **The Rule:** Swap Patch proposals with another group. You must approve their Patch to let them play Round 3.
  *   **Criterion:** "A Patch is valid only if it is independently testable within the remaining game time."
  *   **Instructor Role:** Refuse to arbitrate disputes. If groups deadlock, they lose 2 Credits each and proceed without approval.
  *   Resolve Round 3 predictions.

  **0:45–0:55 | Round 4 (Final Stand)**
  *   Final predictions.
  *   Groups with no Auxiliaries left *must* Revise Core if falsified (no option to burn).
  *   Calculate final scores (Credits + 3 per remaining Auxiliary).

  **0:55–1:15 | Debrief**
  *   Map game events to philosophical concepts (see Section 3).

  ## 2. Materials & Oracle Procedure

  ### A. The Secret Oracle Rule (Instructor Only)
  *   **The Mechanism:** You are not using a complex simulation. You are using a simple linguistic rule.
  *   **The Rule:** If a group's prediction contains the word **"Red"** or **"Black"**, the Outcome is **YES**. If it contains **"High"** or **"Low"**, the Outcome is **NO**. If it contains neither, you choose arbitrarily.
  *   **The Noise (Crucial):** Take 2 Jokers from a playing card deck. Shuffle them into a small pile of 4 normal cards.
      *   When grading Round 2 and Round 4, draw one card from this pile.
      *   If you draw a **Joker**, you must **INVERT** the outcome for **Group 1 and Group 2 only**. (e.g., If their prediction deserved YES, give them NO).
      *   *Why:* Groups 1 & 2 have the "True" Theory (see below). This simulates a true theory coupled with faulty instrumentation.
      *   *Load Management:* This requires you to remember only one rule and check for one keyword per sheet. You can process 4 sheets in 2 minutes while students talk.

  ### B. Card Texts (Write these on Index Cards)

  **Theory Card Type A (Give to Groups 1 & 2)**
  > **CORE THEORY: Chromatic Mechanism**
  > The Box responds to Color properties.
  > 1. Input mentioning "Red" triggers Activation.
  > 2. Input mentioning "Black" triggers Activation.
  > 3. Suit values do not matter.
  > *Status: Provisional*

  **Theory Card Type B (Give to Groups 3 & 4)**
  > **CORE THEORY: Value Mechanism**
  > The Box responds to Magnitude properties.
  > 1. Input mentioning "High" triggers Activation.
  > 2. Input mentioning "Low" triggers Activation.
  > 3. Color properties do not matter.
  > *Status: Provisional*

  **Auxiliary Cards (3 per group, identical)**
  > **AUXILIARY 1: Calibrated Sensor**
  > "Our reading equipment is precise."
  > *Effect: Can be burned to explain one Anomaly.*
  >
  > **AUXILIARY 2: Stable Power**
  > "The Box receives consistent voltage."
  > *Effect: Can be burned to explain one Anomaly.*
  >
  > **AUXILIARY 3: Trained Observer**
  > "Our team records data without error."
  > *Effect: Can be burned to explain one Anomaly.*

  **Score Sheet (Paper)**
  > **Team Credits:** [Start: 20]
  > **Round 1:** Cost 2 | Outcome: ___ | Balance: ___
  > **Round 2:** Cost 2 | Outcome: ___ | Balance: ___
  > **Round 3:** Cost 2 | Outcome: ___ | Balance: ___
  > **Round 4:** Cost 2 | Outcome: ___ | Balance: ___
  > **Auxiliaries Remaining:** ___ x 3 = Bonus
  > **FINAL SCORE:** _______

  ### C. Prediction Sheet Template (Paper)
  > **Team:** ___ **Round:** ___
  > **Prediction:** (Must be specific, e.g., "If we say Red, Box says YES")
  > **Confidence:** (High/Low)
  > **Patch Proposal:** (Round 3 only)

  ## 3. Debrief Guide (Map Moments to Philosophy)

  Do not lecture until the game ends. Use their frustration as the text.

  **1. The Cost of Revision (Duhem-Quine Thesis)**
  *   *Ask:* "Group 1, you got a NO in Round 2 even though you said Red. Why didn't you change your Core Theory immediately?"
  *   *Point:* They likely burned an Auxiliary instead.
  *   *Philosophy:* "You just enacted the **Duhem-Quine Thesis**. A theory is never tested in isolation; it's tested with auxiliaries (instruments, observers). When data conflicts, you can always blame the auxiliary. Falsification isn't logical; it's economic. You chose the cheaper path."

  **2. The Impossible Patch (Ad Hoc Hypotheses)**
  *   *Ask:* "Round 3. Who struggled to approve another group's Patch? Why?"
  *   *Point:* The rule ("independently testable") sounded clear but wasn't.
  *   *Philosophy:* "This is the problem of **Ad Hoc Hypotheses**. Popper said patches are bad unless they add new tests. But in the moment, 'new test' is subjective. You couldn't agree because there is no clean line between 'saving the theory' and 'learning something new'."

  **3. The Noise (Theory-Ladenness)**
  *   *Ask:* "Group 1 & 2, you had the True Theory (Color). But you got falsified. Group 3 & 4, you had the False Theory (Value). Did you survive?"
  *   *Point:* Often the False Theory groups survive longer because they didn't get the "Noise" glitch.
  *   *Philosophy:* "This is **Theory-Ladenness of Observation**. The 'fact' I gave you (NO) wasn't a raw fact. It was mediated by the 'instrument' (the Joker). In real science, we don't know if the anomaly is nature speaking or our telescope breaking. You felt the hesitation to trust the data."

  **4. The Scoring (Research Programs)**
  *   *Ask:* "Who won? Did the True Theory win?"
  *   *Point:* Often the team with the most resources (Auxiliaries) wins, not the truth.
  *   *Philosophy:* "Lakatos' **Research Programs**. Science isn't about instant truth; it's about which program has enough 'positive heuristic' (credits/auxiliaries) to survive the anomalies. Truth is a long-term game, not a round-by-round verdict."

  ## 4. Predicted Failure Modes & Fixes

  **1. The Oracle Bottleneck**
  *   *Risk:* All 4 groups hand you sheets at once. You take 5 minutes to grade. Students get bored.
  *   *Fix:* Enforce a "Submission Window." "Sheets must be on my desk by minute 20:00. Late sheets cost 1 extra Credit." This forces them to finalize quickly. While you grade, make them discuss internally: "Write down why you chose your prediction."

  **2. The "Gambling" Loophole**
  *   *Risk:* A group realizes the Oracle rule is linguistic ("Red" = YES). They stop testing theory and just say "Red" every time to farm credits.
  *   *Fix:* **The Variation Rule.** Announce before Round 3: "The Box may change sensitivity." (You don't actually change the rule, but this sows doubt). If a group predicts *only* "Red" without referencing their Theory logic, warn them: "Predictions must derive from Core Theory or they are void."

  **3. Peer Review Deadlock**
  *   *Risk:* Groups refuse to approve anyone. Game stalls.
  *   *Fix:* Have a "Tie-Breaker" card. If they deadlock for more than 3 minutes, you step in as "Senior Editor" and approve both, but charge both groups 1 Credit for "Administrative Delay." This keeps the game moving while preserving the pain of the judgment.

  **4. Humiliation of the "False" Groups**
  *   *Risk:* Groups 3 & 4 realize they are wrong and disengage.
  *   *Fix:* Remind them in the debrief that historically, false theories (like Phlogiston) often outperform true ones in the short term because they have better auxiliaries. Their struggle is the most philosophically rich data point.

  ## 5. Limitations (What This Cannot Do)

  *   **Real Stakes:** Students know it's a game. They don't feel the career risk of abandoning a theory. You must verbally emphasize this in the debrief: "Imagine this was your PhD thesis."
  *   **Complexity of Data:** Real data is noisy graphs, not binary YES/NO. You must explain that the binary outcome simplifies the "interpretive flexibility" of real data.
  *   **Collaboration:** Real science involves sharing data. This game isolates groups. You need to mention that in reality, Group 1 would have talked to Group 3 and realized the discrepancy sooner. The isolation is a pedagogical constraint, not a feature of science.
  *   **The "Truth":** In the game, *you* know the truth. In real science, no one is the Oracle. You must clarify that the "Secret Rule" is a stand-in for "Nature," but unlike Nature, you are a human who could make mistakes. This mirrors the actual uncertainty scientists face.
