answer: |-
  **MEMORANDUM**

  **TO:** Sentencing Reform Commission
  **FROM:** [Commissioner Name]
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation on Section 2 Sentencing Purposes

  **Recommendation**
  I recommend the Commission adopt a hybrid model: retain culpability as a limiting principle setting the maximum permissible sentence, while utilizing risk assessment to determine release dates within that limit. We should reject the proposal to strike desert language entirely, but we must also reject the current statute's requirement to serve full terms regardless of risk. This hybrid approach resolves the conflicting injustices presented in Dockets 118 and 207 without requiring special exceptions for either case.

  **Commitments of the Proposed Language**
  Adopting the proposed section commits the state to the view that basic moral desert is irrelevant to punishment. Commissioners must understand what this does and does not entail. Rejecting basic desert does not necessarily eliminate the concept of responsibility entirely; many skeptics, including Professor Caruso, argue we can still demand acknowledgment of harm and expect apology as part of a moral dialogue aimed at future safety. However, it does change the state's stance from "you deserve this suffering" to "you are dangerous." By removing desert, we remove the moral justification for blame as a punitive measure. We become managers of risk rather than arbiters of justice. This shifts the legal conversation from what the offender owes society to what society must do to protect itself.

  **The Constraint Argument**
  The commissioners' supporting memorandum invokes the exchange between Daniel Dennett and Gregg Caruso. It accurately characterizes Caruso's position as favoring a public-health quarantine model. However, it simplifies Dennett's objection. Dennett argues that a purely protective framework inevitably requires a punitive enforcement mechanism to maintain credibility and compliance. More critically, he contends that discarding desert-talk removes a vital constraint on state power rather than granting a license for liberty. Without a ceiling based on what an offender deserves, preventive detention can become indefinite. If safety is the only goal, and risk never dissipates, confinement never ends. The hybrid model I propose uses desert specifically as that constraint: no matter how high the risk, the state cannot hold you longer than your culpability warrants.

  **Resolution of Docketed Cases**
  This framework resolves the pending cases consistently. Under the hybrid model, culpability sets the ceiling, and risk determines the release date.

  For Docket 118 (the man serving fifteen years), his original sentence reflects the culpability ceiling. Because his risk assessment is now low, he qualifies for immediate release within that ceiling. He is not held longer than he deserves, and he is not held once he is safe.

  For Docket 207 (the woman with psychotic illness), her low culpability sets a low ceiling (approximately three years). Even though her risk scores are high, the state cannot hold her beyond what she deserves for the offense committed. She is released at the three-year mark. This prevents the indefinite preventive detention that the proposed section would allow for high-risk, low-culpability offenders. We do not need special waivers or compassionate release mechanisms; the statute itself produces the just outcome in both instances.

  **Empirical Dependencies**
  We must separate the philosophical justification from the empirical tools required to execute it. This recommendation depends heavily on the accuracy and stability of our actuarial risk instruments. If these instruments are biased against specific demographics, or if they measure static factors that cannot change (like prior history) rather than dynamic risk, the hybrid model fails. Specifically, Docket 207's high risk score is driven by static factors unrelated to her treatment progress. If our tools cannot distinguish between permanent risk and treatable illness, we risk holding people based on flawed data even within a culpability ceiling. The Commission must mandate ongoing validation of these instruments independent of the sentencing code. We are outsourcing moral decisions to algorithms; if the algorithms are broken, the morality of the system collapses regardless of the statutory language.

  **The Strongest Case Against This Recommendation**
  Proponents of the proposed section will argue that any retention of desert language legitimizes suffering for its own sake, which is morally indefensible. They will contend that if we know punishment does not reduce risk, inflicting it even as a "limit" is simply state-sanctioned vengeance disguised as principle. They will argue that we should have the courage to follow the public-health model to its conclusion: if Docket 207 is truly dangerous, she should be treated until safe, even if that takes longer than three years, and if Docket 118 is safe, he should have never been held for desert reasons in the first place. They will view the hybrid model as a cowardly compromise that preserves the worst aspects of retribution while failing to fully secure public safety.

  **Conclusion**
  The proposed section offers clarity but risks tyranny in the name of safety. The current statute offers moral limits but ignores reality. The hybrid model acknowledges that while we cannot perfectly measure danger, we must strictly limit the price we demand for it. I urge the Commission to vote for the hybrid amendment.
