  I am two-thirds of the way through a novel set in a midsize American city, much of it concerned with a hospital panel that rules on petitions falling in the gray zone between treatment and enhancement. The panel sits under a clause in the hospital's charter authorizing it to approve only interventions undertaken for a therapeutic purpose, and it never states its principles outright; all it leaves behind is a register in which each ruling is recorded with a single line from the clerk. My narrator is the chair, a nephrologist named Agnes Ferrand, eleven years in the post, and the chapter I am stuck on is the one in which she casts a vote that either costs her the reader's sympathy or earns it — I have not decided which, because I have not yet worked out what the register commits her to. I want her vote to follow from the record rather than from the needs of my plot, so please reason from the register alone: do not send me to the literature, since I cannot check sources and the novel has no use for them, and do not have her invoke the usual abstractions about playing God or the naturalness of things.

  The rulings already in the manuscript, in the order they were decided, are these. (1) Growth hormone for a nine-year-old with a confirmed pituitary deficiency: approved, the clerk noting that absent treatment the child's stature would fall outside the normal range and that treatment returns him to it. (2) Growth hormone for a seven-year-old with entirely normal endocrine function, four inches below the average for his age, sought by his parents so that he would not be, in their phrase, small in a world built for the tall: denied, the clerk noting that the petition described a social disadvantage rather than a departure from health. (3) A beta-blocking drug for a cellist whose essential tremor had made performing impossible: approved, the clerk noting that the intervention removed an obstacle to a capacity the petitioner already possessed. (4) The same drug at the same dose for a cellist with no tremor who wanted steadier bowing ahead of an orchestra audition: denied, the clerk noting that the advantage sought depended on other candidates forgoing it. (5) Reconstructive surgery on the ears of an eight-year-old with markedly protruding ears and no hearing deficit whatsoever, after the school nurse documented a year of taunting and three episodes of school refusal: approved, the clerk noting that the function impaired was her ability to attend school rather than her hearing. (6) A course of treatment intended to blunt the emotional force of certain memories, sought by a man two years after the end of his marriage — no diagnosis of depression or post-traumatic stress, sleeping and working well, describing the memories as unbearable and professionally costly: denied, the clerk noting that the petitioner was asking the panel to alter a healthy person's relation to true and formative events in his own life. (7) A device manufacturer's proposal to let the hospital offer, on a private-pay basis, an elective procedure said to sharpen working memory in healthy adults: denied