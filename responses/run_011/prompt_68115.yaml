answer: |-
  ### Memorandum: The Tolstoyan Grants Procedure (Draft 1.0)

  **To:** Grants Panel
  **From:** Chair
  **Subject:** Operationalizing the Director's Mandate via Tolstoy's *What Is Art?*

  This procedure replaces our previous rubric. It is designed to meet the Director's requirement that written reasons be checkable by an ordinary resident, while adhering to our Charter's viewpoint neutrality. It relies on Leo Tolstoy's theory of art as the infection of feeling.

  We are addressing four structural problems before implementing the tests.

  #### 1. The Problem of Sincerity (Without Interrogation)
  Tolstoy argues sincerity is the most important condition of infection. We cannot interview applicants. We must judge sincerity from the *record of production*.
  *   **Evidence:** Application materials showing process (drafts, rehearsal logs, community engagement records) and the ratio of budget allocated to creation vs. administration.
  *   **Sufficient Answer:** The work shows signs of internal necessity (the form matches the feeling) and cost to the maker (time/risk beyond funding requirements).
  *   **No:** The work appears calculated to fit grant criteria ("grant-speak" in artist statements), or the craft is technically perfect but emotionally static (a "counterfeit").
  *   **Risk:** We may mistake awkwardness for sincerity and polish for calculation. We accept this risk to prioritize the Director's mandate.

  #### 2. The Problem of Accessibility (The Lay Panel as Control)
  Tolstoy tested art on peasants. Our three lay panelists (Teacher, Machinist, Nurse) are the functional equivalent.
  *   **Evidence:** The immediate somatic and emotional response of the three lay panelists during the review of materials (video/audio/text).
  *   **Sufficient Answer:** At least two of the three lay panelists report a distinct feeling that matches the artist's stated intent.
  *   **No:** All three lay panelists report "nothing," "confusion," or "boredom."
  *   **Split Decision:** If the lay panel splits (1 feels, 2 do not), the work fails the accessibility test. We are not testing *potential* accessibility after education; we are testing *actual* transmission now. If the lay panel is split but the two professional panelists argue the form is merely unfamiliar, the application moves to a **Vote**, but the written reason must cite "limited current reach."

  #### 3. The Problem of Content (Secular Translation & Charter)
  Tolstoy's "religious consciousness of the age" is inadmissible. Our Charter forbids viewpoint discrimination.
  *   **Translation:** "Religious Consciousness" becomes **"Social Cohesion."** "Christian Brotherhood" becomes **"Inclusive Empathy."**
  *   **The Test:** We do not judge *what* opinion is expressed (e.g., pro-war vs. anti-war). We judge *who is included* in the feeling transmitted.
  *   **Sufficient Answer:** The feeling transmitted allows a resident outside the specific group depicted to share the emotion (e.g., grief, joy, struggle).
  *   **No:** The feeling relies on the exclusion or superiority of the recipient over an "other" (e.g., tribal triumph, refined exclusivity, despair as status).
  *   **Constraint:** This test is **not a veto**. It is a **Tie-Breaker** and a **Value Sorter**. If a work passes Infection and Sincerity but fails Unity, it may be funded only if no other applications in the category pass all three. If it fails Unity, it cannot receive *Project of Distinction* status.

  #### 4. Judgment Wearing the Costume of Procedure
  We must be honest: **Infectiousness is subjective.** This procedure does not objectify feeling; it aggregates subjectivity.
  *   **The Mask:** The Scorecard implies mathematical precision.
  *   **The Reality:** The "Infection Score" is a record of our own vulnerability. When we mark "Clarity," we are admitting whether we were willing to be moved. The procedure forces us to own that subjectivity in the written reason (e.g., "The panel could not locate the feeling" rather than "The work lacked merit").

  ***

  ### The Procedure: Five Sequential Tests

  **Time Limit:** 4 Minutes per application.
  **Termination:** If an application fails Test 1 or 2, it is a **Denial**. Tests 3, 4, and 5 determine **Funding Level** or **Vote**.

  **Test 1: The Counterfeit Check (Negative)**
  *   **Question:** Is this work primarily an imitation of a successful style, a display of technical effect, or designed merely to interest/startle?
  *   **Evidence:** Comparison to known genres; budget for "effects" vs. creation.
  *   **Pass:** The work feels necessary, not decorative.
  *   **Fail:** The work feels like a pastiche or a display of skill without emotional drive.
  *   **Result:** **Immediate Denial.**

  **Test 2: The Infection Check (Positive)**
  *   **Question:** Did the feeling transmit to the lay panelists?
  *   **Evidence:** Lay panelist verbal reports (1 minute max).
  *   **Pass:** 2 or 3 lay panelists identify a specific feeling (e.g., "I felt the worker's anger," not "I liked the song").
  *   **Fail:** 0 or 1 lay panelist identifies the feeling.
  *   **Result:** **Immediate Denial.** (If split 2-1 on lay panel, proceed to Vote).

  **Test 3: The Sincerity Proxy**
  *   **Question:** Does the record suggest the maker risked something to express this?
  *   **Evidence:** Process logs, drafts, budget.
  *   **Pass:** Evidence of struggle or personal cost; form matches content.
  *   **Fail:** Work appears safe, formulaic, or tailored to the grant.
  *   **Result:** If Fail, downgrade funding tier.

  **Test 4: The Unity Check (Secular Value)**
  *   **Question:** Does the feeling bind the region or divide it?
  *   **Evidence:** The nature of the emotion transmitted.
  *   **Pass:** Universal emotions (grief, love, labor, hope) accessible to all residents.
  *   **Fail:** Exclusive emotions (tribal pride, elite refinement, hatred of a specific group).
  *   **Result:** If Fail, **No Funding** (Charter risk: Frame as "Limited Regional Resonance" in written reasons).

  **Test 5: The Vote**
  *   **Trigger:** Application passes Tests 1 & 2, but panel disagrees on 3 or 4.
  *   **Action:** Simple Majority.
  *   **Written Reason:** Must cite the specific feeling transmitted and why it was deemed inclusive/exclusive.

  ***

  ### The Scorecard (One Page)

  **Applicant ID:** _______________ **Round:** ____ **Date:** ____

  | TEST | CRITERIA | PANEL MARK (Circle) | NOTES (Key words only) |
  | :--- | :--- | :--- | :--- |
  | **1. COUNTERFEIT** | Imitation / Effect / Interest | **PASS** / **FAIL** | *Is it just clever?* |
  | **2. INFECTION** | Lay Panel Response (3 Votes) | **3/3** **2/3** **1/3** **0/3** | *What feeling? (e.g., Grief)* |
  | **3. SINCERITY** | Process / Risk / Necessity | **HIGH** / **MED** / **LOW** | *Evidence of cost?* |
  | **4. UNITY** | Inclusive vs. Exclusive Feeling | **UNITE** / **SPLIT** / **DIVIDE** | *Who is included in 'us'?* |
  | **DECISION** | **TERMINATION** | **FUND** / **DENY** / **VOTE** | |

  **Written Reason Draft (Must be checkable by resident):**
  *We [funded/denied] this work because it [transmitted/failed to transmit] a feeling of _______________.*
  *An ordinary resident would [recognize/not recognize] this feeling in their own experience because _______________.*

  **Signatures:** _________________________

  ***

  ### Application of Procedure to Three Cases

  #### Case (a): The Commissioned String Quartet
  *   **Profile:** Conservatory composer, full house, warm applause. Panel: 2 moved, 3 nothing/clever.
  *   **Test 1 (Counterfeit):** Pass. Impeccably made, not mere effect.
  *   **Test 2 (Infection):** **FAIL.** Lay panelists (3 total) report "nothing" or "clever." Only 2 professionals moved. The requirement is 2/3 *lay* panelists.
  *   **Decision:** **DENY.**
  *   **Written Reason:** "The work failed to transmit a specific feeling to the majority of the panel representing ordinary residents. While technically proficient, the emotional content remained inaccessible to the general experience of the region."
  *   **Chair's Discomfort:** You will not like this. This is "high art" with a track record. Denying it validates the Director's mandate but alienates the professional arts sector. The procedure is right because the Director's rule ("checkable against ordinary experience") overrides "craft quality." Tolstoy would call this "exclusive art for the upper class."

  #### Case (b): The Amateur Community Factory Piece
  *   **Profile:** Laid-off workers, church hall, technical flaws, panel/audience wept. Feeling: Local, particular, angry.
  *   **Test 1 (Counterfeit):** Pass. Flaws indicate it is not a polished imitation.
  *   **Test 2 (Infection):** **PASS.** 5/5 panelists wept. Lay panelists clearly infected.
  *   **Test 3 (Sincerity):** **HIGH.** Lived experience of the performers.
  *   **Test 4 (Unity):** **PASS.** While "angry," the feeling of *loss of livelihood* and *dignity* is universal across the region, not exclusive to the factory. It binds the region in shared economic vulnerability.
  *   **Decision:** **FUND.**
  *   **Written Reason:** "The work transmitted a feeling of shared loss and dignity. An ordinary resident can check this against their own experience of economic uncertainty, regardless of their employment status."

  #### Case (c): The Choral Elegy for Soldiers
  *   **Profile:** Veterans' commission, border conflict, largest audience, undisputed emotional force.
  *   **Test 1 (Counterfeit):** Pass.
  *   **Test 2 (Infection):** **PASS.** Undisputed force.
  *   **Test 3 (Sincerity):** **HIGH.**
  *   **Test 4 (Unity):** **FAIL.** Tolstoy explicitly condemns patriotic art as divisive. The feeling here is "Grief for *Our* Dead." In the context of a border conflict, this feeling inherently relies on the distinction between *Our* Soldiers and *Their* Enemy. It binds the veterans and their families, but it excludes the "other" side of the conflict, and potentially residents who oppose the conflict. It shrinks the circle of "us."
  *   **Decision:** **DENY.** (Or Fund at lowest tier with warning). Let us be bold: **DENY.**
  *   **Written Reason:** "While the grief transmitted is sincere, the context of the work frames the feeling as exclusive to a specific group in opposition to another. Public funds prioritize works that bind the entire region's diverse population together, rather than commemorating divisions."
  *   **Chair's Discomfort:** You will fear the public campaign. This is the "organized public campaign" risk mentioned in your brief. The procedure is right because Tolstoy's value metric (Unity) identifies patriotism as a dividing feeling, and our secular translation (Social Cohesion) supports this without violating viewpoint neutrality (we are not denying the *viewpoint* that the soldiers were brave, but the *exclusivity* of the grief).

  ***

  ### Limitations and Dropped Distinctions

  **What the Procedure Cannot Decide:**
  1.  **Complexity vs. Simplicity:** Tolstoy preferred simple art. This procedure may systematically disadvantage complex, abstract, or avant-garde work that requires time to "infect." We are privileging immediate transmission over delayed understanding.
  2.  **The "Bad" Feeling:** Tolstoy allowed for the transmission of "bad" feelings if they were sincere and united people against evil. Our secular "Unity" test struggles here. If a work unites people in righteous anger against a local injustice, is that "Divisive"? The procedure risks favoring bland consensus over necessary conflict.

  **Predictable Misfires:**
  1.  **The "Lay" Bias:** Our three lay panelists are not peasants; they are a teacher, a machinist, and a nurse. They have cultural biases. They may reject work that is unfamiliar but not elite. The procedure treats their reaction as objective data; it is not.
  2.  **The Sincerity Trap:** A skilled manipulator can fake the "process evidence" (drafts, logs). We may fund cynical work that mimics sincerity markers.

  **Dropped Distinctions from Tolstoy:**
  1.  **Christian Religious Consciousness:** Tolstoy believed art must serve the specific Christian truth of his time. We dropped this for "Social Cohesion."
      *   *Function Lost:* Tolstoy had an absolute metric for "Good" vs. "Bad" feelings. We have a relative one. We cannot say a feeling is *morally* wrong, only *socially* divisive. This weakens the moral authority of the panel.
  2.  **The Rejection of Pleasure:** Tolstoy distrusted art that merely gave pleasure. We cannot drop this entirely without appearing puritanical to the public.
      *   *Function Lost:* Tolstoy used this to cut off "entertainment." We must fund some entertainment to maintain public support. This introduces a hypocrisy into the procedure: we claim to seek "Infection" but will likely fund "Pleasure" if it is popular enough to pass the Unity test.
  3.  **The Absolute Certainty:** Tolstoy was willing to condemn Shakespeare. We are a bureaucracy.
      *   *Function Lost:* The ability to say "No" to greatness. Our procedure forces us to deny the Quartet (Case A) not because it is "bad" in a universal sense, but because it failed our specific demographic test. We lose the ability to recognize art that is ahead of its time.

  **Final Note to Panel:**
  This procedure will generate controversy. It shifts power from "Expertise" to "Experience." It will deny technically perfect work that does not move the lay panel. It will deny popular work that divides the community. This is the cost of meeting the Director's mandate while taking Tolstoy seriously. We must stand by the written reasons. If a resident reads the reason and says, "I checked my experience, and he is right," we have succeeded. If they say, "They are imposing their values," we have failed. Proceed.
