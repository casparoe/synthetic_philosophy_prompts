      *   *ML Researchers:* They care about results. They'll say "Who cares about definitions? It works." or "You're just defining understanding away."
      *   *Psychologists:* They care about *how* cognition happens (embodiment). They'll say "Attribution isn't enough; you need the right mechanism."
