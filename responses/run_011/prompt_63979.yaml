answer: |-
  Your hunch is correct, and it explains the pedagogical friction. You are not using the film to illustrate the argument; you are using a technology of *identification* to teach a philosophy of *abstraction*. They are rival engines.

  Singer's pond case works by stripping away the particular to reveal the universal. He removes distance, nationality, and identity to argue that the *structure* of the obligation is what matters. If you save the child in front of you, you must save the child in Bengal, because the "child-ness" and the "drowning" are the only morally relevant features. The argument relies on the student accepting that their emotional attachment to proximity is a bias to be corrected.

  Spielberg's film works by drilling down into the particular to reveal the universal. The liquidation scene is a sea of grey and black, a statistical massacre. The camera finds the red coat. It does not argue that all lives are equal; it shows you *one* life that you cannot ignore, betting that if you care about her, you will care about the others she represents. The film relies on the viewer accepting that their emotional attachment to the specific is a bridge to be crossed.

  This is why your students admire Schindler rather than feeling indicted. Singer wants them to feel that *not* giving is a failure of logic. The film shows them that *giving* is a triumph of character. Singer's method produces guilt through consistency; Spielberg's method produces admiration through exception. If you want the Singerian indictment, the film is the wrong tool, because the film is built on the "identifiable victim effect" that Singer explicitly argues against. The film converts statistical lives into identifiable ones to make them saveable; Singer converts identifiable lives into statistical ones to make them obligatory. The film is a better machine for motivation, but it motivates the wrong lesson for your syllabus: it teaches that rescue is for heroes, whereas Singer argues rescue is for everyone.

  Here is the diagnosis of the two background assumptions you identified.

  ### 1. Triage and Cost
  **Verdict: Fatal to the Pond Case as an analogy, complicating to the Principle.**

  The pond case assumes rescue is low-cost (muddy suit) and non-competitive (saving this child doesn't drown that one). *Schindler's List* breaks both.

  In the film, rescue is high-cost and fiercely competitive. Every slot on the list is a slot denied to someone else. The film makes this explicit in the sequence where the women's train is diverted to Auschwitz. Schindler has to spend his remaining capital to buy them back. This is not a muddy suit; this is the depletion of the very resource needed for the next rescue.

  This breaks the Pond Case because Singer's argument relies on the intuition that the cost is trivial compared to the loss of life. When the cost is your entire livelihood and safety, and when every dollar spent on Person A is a dollar not spent on Person B, the "duty to rescue" morphs into a "duty to allocate." The film forces the viewer into a triage mindset that Singer's essay sidesteps. Singer argues you should give until you reach the level of marginal utility (where giving more causes as much harm to you as it helps them). Schindler goes past that line. He empties the tank.

  If you press the Singerian reading here, the film resists. Singer would say Schindler did the right thing by spending the money. But the film shows the *horror* of that calculation. When Schindler bribes Goeth, he is participating in the economy of the genocide to undermine it. The film records that rescue in this context is transactional. It requires engaging with the market value of human beings. Singer's argument treats the value of the life as absolute and the cost to the agent as relative. The film shows the cost to the agent becoming absolute (bankruptcy, death risk) while the value of the life remains precarious (they can still be sent to the wrong camp).

  This is fatal to using the Pond Case as a clean setup for the film. The Pond Case suggests a clean moral transaction: money for life. The film shows a dirty moral transaction: complicity for life. You cannot tell your students that Schindler is just a guy who jumped in the pond, because the pond in the film is filled with sharks he has to feed to keep the water clear.

  ### 2. Demandingness and the Breakdown
  **Verdict: The film claims the demand is bottomless, but frames it as tragedy rather than obligation.**

  The final scene, where Schindler collapses counting the car and the pin, is the crux. You asked how to distinguish between "bottomless demand" and "survivor's guilt/bad arithmetic" from inside the film.

  Look at what Stern does. Stern does not tell Schindler he is wrong. Stern does not say, "You saved 1,100 people, Oskar, stop counting." Stern accepts the gold ring and the letter. The workers, the recipients of the rescue, validate Schindler's assessment that he could have done more. If the film intended to show Schindler as irrational or consumed by pathological guilt, the survivors would offer him absolution. They do not. They offer him the ring, which is a token of gratitude, but they do not contradict his arithmetic.

  Furthermore, look at the objects he counts. The car is a resource (Singerian). The pin is a symbol of affiliation (Nazi party member). Schindler is not just calculating utility; he is calculating purity. He is saying that retaining the pin was a moral failure because it represented an allegiance he should have shed earlier to save more people.

  This supports the "bottomless demand" reading. The film agrees with Singer that the obligation does not end when you are safe; it ends when you are empty. However, the *emotional register* differs. Singer presents the bottomless demand as a rational requirement: "You ought to do this." The film presents the bottomless demand as a human impossibility: "I tried to do this and I failed."

  Schindler's breakdown is not just guilt; it is the realization of the Singerian horizon. He sees the line of marginal utility, and he sees that he stopped short of it. The film suggests that meeting the full demand of rescue requires self-annihilation. Schindler survives, but he is broken. Singer argues we should give until it hurts; the film shows us a man who gave until it broke him, and implies that even that wasn't enough. This is bleaker than Singer. Singer thinks we can live with the obligation. The film suggests the obligation destroys the liver.

  ### The One Thing the Film Records
  The argument, given its own form, structurally cannot get this on the record: **The moral remainder.**

  Singer's argument is a calculus. If you give the money, the equation balances. The child is saved, you are poorer, the duty is discharged. The argument has no mechanism for what happens to the agent *after* the rescue, other than having less money. It treats the act of rescue as a closed loop.

  The film records that the loop does not close. Schindler has given his fortune, his safety, and his status. By Singer's lights, he has discharged the duty. Yet, he is still in moral debt. The film shows that rescue leaves a residue on the rescuer that arithmetic cannot clear. The pin, the car, the shaking hands—these are the physical manifestations of a debt that persists even after the action is taken.

  Singer's form cannot capture this because it relies on the agent being a rational utility maximizer. If the math checks out, the agent is in the clear. The film insists that the agent is not a calculator but a witness. Schindler is not guilty because he miscalculated; he is guilty because he *witnessed* the capacity for rescue and saw that his own capacity was finite. The argument tells you how to act. The film tells you that acting will not save you from the knowledge of what you didn't do. That is a record the argument cannot keep.
