answer: |-
  Based on the five verdicts she has already recorded, your friend is implicitly running the **Purely Use-Based/Pragmatic** package (specifically a version akin to Christopher Hom's *Combinatorial Externalism* or a normative pragmatics view).

  Here is the breakdown of the machinery, the competition, the prediction, and the tie-breaker.

  ### 1. The Machinery She Is Running
  She is operating on a **Use-Based/Pragmatic** framework.

  **Why this fits her five verdicts:**
  *   **Verdict 1 (Truth-Conditions):** Use-based views separate the semantic content (from the flats) from the derogatory force (the social norm attached to the word). This explains why the truth conditions match the neutral term, but the "awfulness" remains.
  *   **Verdict 2 (Embedding):** Pragmatic force projects through negation and conditionals. Just because you say "If Marek is a silt..." doesn't mean you haven't invoked the toxic norm associated with the word.
  *   **Verdict 3 (Indirect Speech):** This is the clincher. In Conventional Implicature (CI) theories, a reporter usually distances themselves from the implicated content ("Ilse said he's a silt" implicates Ilse's contempt, not the reporter's). Her verdict that the *reporter* doesn't get off suggests the toxicity is in the *utterance of the word itself* within the current context, not just the attributed attitude. This is a hallmark of Use-Based views: the word is a toxic object in the linguistic environment.
  *   **Verdict 4 (Reclamation):** This is the strongest filter. Truth-Conditional, Presuppositional, and standard CI views struggle to explain why the derogation vanishes completely for in-group speakers. Use-Based views handle this easily: the *norms* governing the word's use change depending on the speaker's social position.
  *   **Verdict 5 (Quotation):** The distinction between Indirect Speech (Verdict 3) and Verbatim Quotation (Verdict 5) relies on the **Mention/Use distinction**. Quotation blocks the "use" of the word to classify, suspending the normative force. Indirect speech still "uses" the word grammatically to classify, retaining the force. This is a pragmatic distinction, not a semantic one.

  ### 2. The Competition (and where they break)
  *   **Truth-Conditional:** **Fails Verdict 1.** If "silt" contained "contemptible" in its truth conditions, "Marek is a silt" and "Marek is from the flats" would not be true in *exactly* the same situations (one would require Marek to be contemptible).
  *   **Presuppositional:** **Fails Verdict 4.** Presuppositions are generally robust against speaker identity. If "silt" presupposes inferiority, a flats-born speaker should still trigger that presupposition, even if they don't endorse it. Her verdict says there is *zero* derogation.
  *   **Conventional Implicature (CI):** **Fails Verdict 3 & 4.** Standard CI (Potts/Kaplan) suggests reporters distance themselves from the CI in indirect speech (contradicting Verdict 3). It also struggles to explain how the CI is completely "cancelled" by in-group status without ad-hoc rules (contradicting Verdict 4).
  *   **Indexical (Group Identity):** **Fits well, but strains on Verdict 3.** This view says "silt" indexes "I am an uplander who hates silts." This fits Verdict 4 (in-group speaker indexes solidarity). However, on Verdict 3, if the reporter is a neutral party, why does the word force an indexical commitment of hatred onto them? A Use-Based view explains this better: the reporter has deployed a toxic tool, regardless of their internal indexical state.

  ### 3. Her Verdict on the Tribunal Case
  **Verdict:** **Derogatory.**

  **Why:**
  Her framework relies on the *function* of the word in the social context. Look closely at her wording in Verdict 4: the in-group speaker gets a pass only when using it **"straight descriptively."**
  In the Tribunal Case, the witness is explicitly **not** describing. He is "weaponising" the term to inflict a feeling on the panel. In a Use-Based framework, the "bite" comes from activating the oppressive norm. By intentionally activating that norm to cause discomfort (even to shame the oppressors), he is still deploying the weapon. The exemption for in-group speakers is a license for *reclamation/description*, not a license for *reverse-discrimination performativity*. Since he is violating the "descriptive" condition of her Verdict 4, the default derogatory force applies.

  ### 4. My Preferred Rule
  I prefer the **Use-Based/Pragmatic** rule she is running, but with a specific refinement regarding **uptake**.

  Slurs are not just semantic tokens; they are social acts. The Use-Based view captures the reality that the harm of a slur is often in its *reception* and its *reinforcement of power structures*, not just the speaker's intent.
  *   **Why I prefer it:** It is the only framework that treats slurs as *dynamic social tools* rather than static semantic containers. It explains why a word can be poison in one mouth (Verdict 3) and medicine in another (Verdict 4) without changing its dictionary definition. It acknowledges that language is a practice, not just a code.
  *   **The Refinement:** I would add that "Derogatory" status should depend partly on **Uptake**. If the tribunal panel *feels* the bite (as the witness intends), the act succeeds as a derogatory speech act, regardless of the speaker's identity. If the panel recognizes the reclamation and feels no harm, the derogation fails. The Use-Based model allows for this feedback loop; semantic models (CI, TC) do not.

  ### 5. The Tie-Breaker Case
  To definitively split the **Use-Based** view from the **Indexical (Group Identity)** view (her strongest competitor), hand her this case:

  **The "Granted License" Case:**
  > An Uplander (out-group) has been explicitly granted permission by the Flats Community Council to use the term "silt" descriptively when working in the flats. The Uplander uses the term descriptively in the flats, with the community's endorsement.
  > **Question:** Is this derogatory?

  *   **Indexical Prediction:** **Derogatory.** The speaker's identity (Uplander) is fixed. The word indexes "I am an Uplander." The semantic machinery fires regardless of social permission.
  *   **Use-Based Prediction:** **Not Derogatory.** The norms governing the word's use have been contextually altered by the community's authority. The "use" is now licensed, suspending the toxic norm.

  If she rules **Not Derogatory**, she confirms the Use-Based machinery. If she rules **Derogatory**, she is secretly running an Indexical/Identity framework.
