  Here's how I block your slide into genetic identity: if you swapped the donor mitochondria for a *different* donor's mitochondria while keeping the nuclear DNA identical, I say you get a different person. The specific cytoplasmic matter matters, not just the nuclear code. So it's not that only nuclear DNA is essential; it's that the total material constitution of the starting cell is essential. The doctrine isn't hostage to the lab; it's hostage to the fact that *this* life began with *that* specific hybrid cell. Do you agree that if we swapped the donor material for a distinct third party's, we'd be talking about a numerically different possible individual?
