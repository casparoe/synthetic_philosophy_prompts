answer: |-
  The theory must bridge the gap between jury duty (accepted) and legislature by lot (rejected) without collapsing the distinction. It must justify granting binding power to a body that cannot be voted out, satisfying equal protection concerns while acknowledging voter file biases. It needs to define which tasks suit lay judgment versus expert administration, ensuring the council retains enough leverage to prevent deadlock without rendering the assembly decorative. Finally, it must explain why losers accept outcomes from non-peers, grounding compliance in procedure rather than performance.

  1.  **The Functional Gradient:** The theory must explain why we accept lotteries for juries or draft boards but recoil at lotteries for general legislation, identifying the specific variable—stakes, reversibility, or expertise—that shifts legitimacy across the spectrum. Without this, the proposal is either too timid (advisory only) or too radical (replacing the council). *Tag: Non-negotiable.*

  2.  **Categorical Distinction:** It must distinguish between selecting decision-makers, allocating scarce goods, breaking ties, and sampling for opinion, as the moral arguments for each differ sharply; a justification for organ allocation does not transfer to redistricting. Conflating these allows boosters to borrow legitimacy from low-stakes lotteries to justify high-stakes governance. *Tag: Non-negotiable.*

  3.  **Source of Legitimacy:** The theory must choose between claiming legitimacy via statistical mirroring (descriptive representation) or procedural randomness (blindness to faction), as these conflict when the sample is biased or the outcome unpopular. You cannot claim the body is "the people" while also claiming its value is that it ignores what the people want. *Tag: Non-negotiable.*

  4.  **Selection Bias:** It must account for the opt-out effect on the voter file, admitting whether the resulting body is a representative sample or a self-selected volunteer corps, and whether stipends fix this. Pretending a voluntary assembly perfectly mirrors the city is empirically false and invites legal challenge. *Tag: Negotiable.*

  5.  **Accountability Substitute:** Since members cannot be voted out, the theory must specify what mechanism replaces electoral accountability to prevent abuse or negligence, such as strict transparency, short terms, or council override. Power without removal is tyrannical unless checked by something other than hope. *Tag: Non-negotiable.*

  6.  **Historical Plausibility:** It must reconcile the Athenian use of sortition with the American founders' rejection of it without dismissing either as ignorance or corruption, acknowledging that context determines viability. Using history solely to claim "ancient wisdom" or "founder error" is myth-making, not theory. *Tag: Prejudice.*

  7.  **Competence Ceiling:** The theory must define the maximum technical complexity a lay body can manage before reliance on staff turns them into rubber stamps, particularly for mapping and budgeting. If experts draft the options and the assembly merely picks, the claim that "people decide" is hollow. *Tag: Non-negotiable.*

  8.  **Loser Consent:** It must explain why a neighborhood that loses a seat or a council member overridden by the assembly owes compliance to the decision, based on procedure rather than outcome. Democratic legitimacy requires that losers accept the process even when they hate the result. *Tag: Non-negotiable.*

  9.  **Empirical Fidelity:** The theory must align with actual mini-public performance data, including failures and stalemates, not just curated successes like the Irish abortion referendum. Cherry-picking successes creates unrealistic expectations for capacity and consensus. *Tag: Negotiable.*

  10. **Institutional Interface:** It must define the friction point between the elected council and the sorted assembly, ensuring the override mechanism doesn't make the assembly powerless or the council irrelevant. A 2/3 override threshold is a specific design choice that needs theoretical backing. *Tag: Negotiable.*

  11. **Voting Power Dilution:** It must demonstrate that granting final authority to a non-elected body does not violate the "one person, one vote" principle by diluting the weight of a ballot cast for council members. This is the primary legal vulnerability for any charter amendment of this kind. *Tag: Non-negotiable.*

  12. **Transparency:** Deliberations and decision-making processes must be visible to the public to prevent backroom deals, even if private caucusing is allowed for honesty. Secret deliberation by unelected officials is incompatible with democratic norms. *Tag: Non-negotiable.*

  13. **Systemic Stability:** The theory should address whether this change invites chronic instability or gridlock, though claims that any change is destabilizing often mask status quo bias. Fear of disruption is valid but often used to block necessary innovation. *Tag: Prejudice.*

  **Analysis**

  The single requirement that knocks out the most candidates is **Accountability Substitute**. Most sortition literature glazes over what happens when a random body makes a corrupt or catastrophic decision, relying on the assumption that randomness equals purity. If you cannot define a check on power that isn't just "they are random so they won't abuse it," the theory fails the basic democratic test of non-domination.

  The subset that cannot be jointly satisfied is **Selection Bias** (Voluntary Opt-out) and **Source of Legitimacy** (Statistical Mirroring). You cannot have a body that is both perfectly representative of the city and composed only of those willing to serve for a stipend. If you enforce strict stratification to fix the bias, you undermine the randomness that justifies the lottery; if you allow free opt-out, you lose the claim that the body statistically *is* the people.

  The items that are preferences for elections wearing a trench coat are **Historical Plausibility** and **Systemic Stability**. Skeptics use "the Founders rejected this" to imply election is the only legitimate form of consent, and "this will cause gridlock" to imply the current elected system is the baseline for stability. Both treat the current elected monopoly as the natural state rather than one contested design among many.

  **Scorecard**

  The **Epistemic/Cognitive-Diversity Defense** fails primarily on the Competence Ceiling. While diversity improves problem-solving, it does not automatically grant the technical literacy required for redistricting law or capital budgeting without heavy staff reliance, which undermines the claim of citizen control.

  The **Equality-and-Anti-Elite Defense** struggles with Accountability Substitute. Breaking elite capture is valuable, but if the new body is unaccountable, you have simply swapped one elite for another random one, without solving the problem of power unchecked by the public.

  The **Arbitrariness-or-Anti-Capture Defense** performs well on Loser Consent and Functional Gradient. By framing the lottery as a neutral procedure rather than a representative mandate, it lowers the stakes for losers and fits better with specific tasks like map-drawing where neutrality is prized over policy vision.

  The **Mixed Design** (sorting some things, electing others) scores highest overall but hinges on Institutional Interface. It respects the Founders' distinction between administration and representation, but only if the override mechanism is calibrated so the elected body doesn't simply ignore the sorted body whenever it is inconvenient.

  **Conclusion**

  The amendment as drafted is defensible only if the override mechanism is treated as a feature of accountability rather than a veto, and if the claim to representation is downgraded to a claim to neutrality. You need to redesign the selection process to minimize opt-out bias or explicitly admit the body is a stakeholder sample rather than a microcosm.
