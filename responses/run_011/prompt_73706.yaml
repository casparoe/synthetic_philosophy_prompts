      4. How do we know it? We use empirical science to discover the microstructure of the stuff we ostensively defined as 'water'.
      5. The empirical work fixes the reference. The necessity comes from the semantics.
      6. So experience justifies the *reference fixing*, which in turn justifies the *necessary truth*.
