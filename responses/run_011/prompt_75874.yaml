      *   **The War/Marriage Distinction:** Focus on the *recipient* of the value. Marriage benefits the survivors (the spouses). War sacrifices survivors for the non-existent benefit of the dead.
      *   **The Pension Case:** Clarify this is *not* a sunk cost issue. It's a future bonus unlocked by tenure. It's rational.
