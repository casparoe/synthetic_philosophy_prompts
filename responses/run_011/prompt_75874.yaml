      *   *Hypothesis 4: The "Completion" or "Threshold" Principle.* Are we near a threshold where the investment pays off? (Pension = Yes. Movie = No.)

      *   *Synthesis:* The principle isn't about the *cost* itself, but about what the cost *purchased* beyond the immediate outcome.
