answer: |-
  # Activity Plan: The Composition Audit

  ## 1. Props and Continuum List
  **Budget:** $30 (Hardware store + printing).
  **Prep:** You must photograph these setups beforehand. Print 14 copies of the 30-item sheet (black and white is fine if contrast is high). Do not show the physical props to students; only the photos.

  **Design Principle:** Every photo displays exactly **two** candidate constituents (e.g., two magnet halves, two rope ends). This forces the integer answer to be either **1** (they compose a single object) or **2** (they remain two objects). This simplifies auditing and prevents "counting the atoms" evasion.

  **Continuum A: Magnetic Connection (10 Items)**
  *   **Items 1–3:** Two bar magnets separated by 10cm, 5cm, 1cm air gap.
  *   **Items 4–6:** Two magnets touching (north-south), held by hand; touching on table; clipped together with a binder clip.
  *   **Items 7–9:** Taped together (visible seam); Glued together (visible seam); Welded together (seam ground down).
  *   **Item 10:** Melted into a single amorphous lump.
  *   **Expected Fracture:** Most will say 2 for Items 1–3 and 1 for Item 10. The split occurs between Items 4–7. *Fracture Point:* Does contact alone compose? Does artificial binding (tape) count vs. natural binding (magnetism)?

  **Continuum B: Rope Continuity (10 Items)**
  *   **Items 11–13:** Two rope ends separated; ends touching; ends overlapping slightly.
  *   **Items 14–16:** Ends tied in a loose knot; tight knot; knot glued secure.
  *   **Items 17–19:** Ends spliced (fibers interwoven); woven into a small braid; sewn together.
  *   **Item 20:** Single continuous rope (no seam visible).
  *   **Expected Fracture:** Items 14–16. *Fracture Point:* Is a knot a new object or just a arrangement of two ropes? Does interweaving (splice) differ from tying?

  **Continuum C: Containment/Constraint (10 Items)**
  *   **Items 21–23:** Two metal blocks separated; touching; stacked.
  *   **Items 24–26:** Blocks inside a loose mesh bag; bag drawn shut; bag tied shut.
  *   **Items 27–29:** Bag frozen into a solid block of ice (blocks visible inside); blocks encased in clear epoxy; blocks painted over to look like one block.
  *   **Item 30:** Single solid block (no seams).
  *   **Expected Fracture:** Items 24–27. *Fracture Point:* Does containment compose? Does freezing the container make the contents one object?

  ## 2. Game Rules and Audit Protocol
  **Materials per Table:**
  *   1 Answer Sheet (30 items, space for integer 1 or 2).
  *   1 Rule Card (index card + envelope).
  *   1 "Rule Starter" Handout (for Rules-First groups only).
  *   1 Audit Checklist (for the swapping phase).

  **Condition A: Cases-First (2 Tables)**
  1.  Answer all 30 items (write 1 or 2).
  2.  Write a general rule that explains *why* you gave those answers. (Format: "Composition occurs if and only if _______.")
  3.  Seal the Rule Card in the envelope.

  **Condition B: Rules-First (2 Tables)**
  1.  Receive "Rule Starter" handout (lists options: Contact, Fusion, Function, Life, None, All).
  2.  Write a general rule on the Rule Card. Seal it in the envelope.
  3.  Open envelope only after rule is sealed. Answer all 30 items based *strictly* on that rule.

  **Constraint for All:**
  *   **No Triviality Rule:** Your answers must include at least five "1s" and at least five "2s". (This blocks Universalism/Nihilism gaming).
  *   **Integer Rule:** You must write an integer. "It depends" is marked wrong by the TA immediately.

  **Audit Phase (Swapping):**
  1.  Table 1 swaps with Table 3; Table 2 swaps with Table 4.
  2.  Auditors open the Rule Card envelope.
  3.  Auditors use the **Audit Checklist** to verify consistency.
      *   *Step 1:* Identify the condition C in the rule (e.g., "Physical Contact").
      *   *Step 2:* Scan the 30 items. Mark any item where Condition C is **present** but the answer is **2** (Violation: Should have composed).
      *   *Step 3:* Mark any item where Condition C is **absent** but the answer is **1** (Violation: Should not have composed).
      *   *Step 4:* Count total violations.
  4.  **Winning:** The table with the fewest violations wins. (Tie-breaker: The table whose rule is most specific wins).

  ## 3. Minute-by-Minute Timeline (100 Minutes)

  *   **00:00 – 00:05: Setup & Split.**
      *   Divide class into 4 tables (4/4/3/3).
      *   Hand out packets. Tell Tables 1 & 2 they are "Cases-First". Tell Tables 3 & 4 they are "Rules-First".
      *   **TA Script:** "You are auditors of reality. For each photo, there are two parts. Write '1' if they make one object. Write '2' if they remain two. No 'it depends'. You must have at least five '1s' and five '2s' total."

  *   **00:05 – 00:35: Work Phase (30 mins).**
      *   Cases-First: Answer sheets first, then Rule Card.
      *   Rules-First: Rule Card first (use Starter Handout), seal it, then Answer sheets.
      *   TA circulates. Enforce the "No Triviality Rule" (if someone writes all 1s, tell them to fix it). Enforce integers.

  *   **00:35 – 00:40: Swap & Brief.**
      *   Collect Rule Cards. Swap packets between paired tables.
      *   Hand out Audit Checklists.
      *   **TA Script:** "Your job is not to judge if their rule is *true*, but if their answers *match* their rule. You are checking for hypocrisy, not truth."

  *   **00:40 – 01:05: Audit Phase (25 mins).**
      *   Tables audit the other group's work.
      *   They must list specific item numbers where violations occurred.
      *   TA circulates to mediate disputes over rule interpretation (e.g., "Does glue count as contact?"). *TA Decision:* "If the rule doesn't specify, the auditors decide reasonable interpretation."

  *   **01:05 – 01:10: Scoring.**
      *   Tally violations. Announce winner. Distribute prize (coffee cards).
      *   Collect all sheets for debrief.

  *   **01:10 – 01:40: Debrief (30 mins).**
      *   See Debrief Sequence below.

  *   **01:40 – 01:45: Reveal & Wrap.**
      *   Reveal the term "Special Composition Question."
      *   Connect to previous weeks on vagueness.
      *   Dismiss.

  ## 4. Debrief Sequence (Ordered Questions)
  *Do not lecture. Ask these questions in order. Write key terms on the board as they emerge.*

  1.  **The Mismatch:** "Look at the violations found during the audit. Cases-First group: Why did your rule fail to match your answers?"
      *   *Target:* Elicit that their intuitions shifted along the continuum, but their rule was static.
  2.  **The Rule-Bound:** "Rules-First group: Did anyone feel forced to give an answer that felt wrong because the rule demanded it?"
      *   *Target:* Elicit the cost of consistency (e.g., "My rule said contact counts, so I had to say the touching magnets are one object, but it felt like two.")
  3.  **The Boundary:** "Pick Continuum A, Item 4 (touching) and Item 5 (clipped). Many said 2 for one and 1 for the other. What is the metaphysical difference? Is a clip ontologically significant?"
      *   *Target:* Expose the arbitrariness of common-sense boundaries.
  4.  **The Escape Hatch:** "Someone inevitably wants to say 'It's just up to us to decide.' If that's true, why did the audit penalize mismatches? Why did you try to be consistent?"
      *   *Target:* Block Conventionalism. They acted as if there was a truth to be consistent with.
  5.  **The Extremes:** "To get zero violations, what is the easiest rule to write?"
      *   *Target:* Elicit "Always 1" (Universalism) or "Always 2" (Nihilism).
      *   *Follow-up:* "If Universalism is consistent, why does it feel wrong? (e.g., 'Is my nose and the moon one object?')"
  6.  **The Epistemic Cut:** "Imagine there *is* a fact of the matter. There is a exact micron-distance where composition happens. You just can't see it. How does that feel?"
      *   *Target:* Introduce Epistemicism. Let them express the discomfort (magic, unknowable facts).
  7.  **The Life Constraint:** "Look at Continuum C. Did anyone treat the frozen bag differently than the tied bag? Why? Does function or life matter more than physics?"
      *   *Target:* Introduce Organicism (only living things compose).
  8.  **The Reveal:** "This problem has a name: The Special Composition Question. You just reenacted the main positions in the literature."

  ## 5. TA Interventions (What You Must Say)
  *No activity replaces these specific philosophical pivots.*

  1.  **On "Thing":** When a student says "It depends what you mean by 'thing'", say: "For this game, 'object' means 'a distinct material entity that exists independently of our language'. Assume there is a right answer."
  2.  **On Consistency:** When a group argues their rule is "flexible", say: "A rule that changes per case is not a rule. It's a description of your feelings. The audit requires predictive power."
  3.  **On the "Right" Answer:** When asked "So what is the answer?", say: "Philosophers have argued this for 2,000 years. If you found the easy answer in 30 minutes, you'd be famous. The point is the cost of each answer."

  ## 6. Failure Modes and Handling Strategies

  **1. Gaming the Audit (All 1s or All 2s)**
  *   *Prediction:* Students realize "Always 1" guarantees zero violations.
  *   *Handling:* The **No Triviality Rule** (must have five 1s and five 2s) blocks this. If they bypass it, disqualify them from the prize but use their sheet in debrief: "This group chose Universalism. It was consistent, but did it match reality?"

  **2. The "Word Game" Objection**
  *   *Prediction:* A student insists "Object" is just a word, so there's no fact of the matter.
  *   *Handling:* "If it's just words, then the audit is meaningless. But you tried to win. You acted like there was a correct match between rule and world. Why did you play seriously?"

  **3. Rules-First Paralysis**
  *   *Prediction:* Rules-First groups stare at blank paper for 10 minutes.
  *   *Handling:* Hand them the "Rule Starter" early. "Pick one of these five templates and fill in the blank. You can change it later, but you must seal something in 5 minutes."

  **4. Timing Mismatch**
  *   *Prediction:* Cases-First finish in 20 mins; Rules-First take 40.
  *   *Handling:* Have a "Secondary Audit" task ready. "If you finish early, write down the three items where you are least confident in your answer." This keeps them engaged without advancing the game state.

  **5. The Refusal (No Integer)**
  *   *Prediction:* A student writes "?" or "1.5".
  *   *Handling:* Walk over. "The game mechanics require an integer. If you leave it blank, your table cannot win the prize. Please commit." Do not debate metaphysics in the moment; enforce game rules.

  **6. The Smug Nihilist**
  *   *Prediction:* One student dominates saying "Nothing exists, answer is always 2."
  *   *Handling:* Assign them the role of "Lead Auditor" for the swap. "Since you have a clear rule, you are responsible for catching violations in the other group's sheet." Channel their dogmatism into the game mechanic.

  **7. Projector Failure**
  *   *Prediction:* Slides don't load.
  *   *Handling:* The plan relies on printed handouts, not slides. Only the debrief terms (Universalism, Nihilism, etc.) need the board. Write those by hand. No disruption.
