  (a) The reasoning first fails at **Step (3)**.

  (b) Step (3) looks acceptable because it relies on an equivocation regarding the phrase "cases a model is put to." In the context of Step (4) (finite data), this phrase naturally suggests "historical observations already collected." Under that reading, Step (3) is trivially true: if two models fit the past data equally well, the past data cannot distinguish them. However, Step (3) is then used to support Step (6) and the "modest claim" that truth is irrelevant. This trade only works if "cases a model is put to" implies the *entire domain of intended application*, including counterfactual policy interventions. The step trades on the ambiguity between "cases tested" (past) and "cases intended" (future/counterfactual). It assumes that performance on the former guarantees equivalence on the latter, which is precisely what the "Toll" example disproves.

  (c) **Cost of rejecting (1):** You abandon Instrumentalism. You must argue that models have intrinsic value beyond prediction (e.g., explanation, understanding), which complicates the evaluation criteria but aligns better with scientific realism.
  **Cost of rejecting (2):** You sever the link between assumptions and output. You must argue that assumptions bear weight independently of predictions (e.g., ethical or theoretical consistency), which makes model selection more subjective.
  **Cost of rejecting (3):** This is the cheapest cost. You admit that empirical equivalence on *historical* data does not imply equivalence in *utility*. You preserve (1) and (2) by expanding the definition of "predictions" to include robustness under intervention (counterfactuals). This forces you to evaluate models on structural validity, not just curve-fitting, without abandoning the predictive goal.

  (d) This diagnosis dams **(7)** completely, as (7) relies on the chain of indifference established in (3) and (6). However, it **saves the modest claim** ("a model is not made worse by an assumption merely because that assumption is false"), provided it is qualified. An assumption being false is not an *automatic* vice, but it becomes a vice if that falsity undermines the model's structural stability in the intended domain. The modest claim survives as a rule of thumb, but not as a logical shield against structural critique.

  (e) Your reply about the toll **does not work**. By defining "cases a model is put to" as only those scenarios historically observed, you render the model useless for its stated purpose (policy analysis). If a traffic model cannot predict the effect of a toll, it has failed the instrument test in Step (1), because the toll scenario is a "case" the model *ought* to be put to. Excluding it from the evaluation criteria protects the model from falsification but also strips it of utility.

