answer: |-
  There is no single, established term in behavioral science, law, or public administration that precisely captures this configuration. You have identified a gap in the taxonomy of choice architecture.

  The neighbouring concepts you already know (Sludge, Dark Patterns, Obfuscation) describe the *presence* of hidden costs or friction. Your observation is more specific: it describes the **topology** of the cost. It is not that the cost is hidden in place; it is that the cost has been **displaced** from the locus of evaluation to a locus of invisibility.

  Below is an analysis of the nearest concepts, a proposed coinage for the phenomenon, and the implications for policy and audit.

  ### 1. The Nearest Concepts and Their Discriminations

  There are three adjacent concepts. Your pattern is distinct from all of them in specific, structural ways.

  **A. Sludge (Thaler & Sunstein)**
  *   **Definition:** Excessive or unjustified friction that reduces the welfare of those trying to access a service or entitlement.
  *   **Distinction:** Sludge is defined by the *magnitude* and *presence* of friction. Your cases are defined by the *location* of friction. A standard sludge audit measures friction at the point of transaction. In your examples, the point of transaction is frictionless. Sludge theory assumes the cost is visible to the user *when they encounter it*. Your pattern relies on the user *not connecting* the initial choice to the downstream cost.
  *   **The Strain:** If you call this "Sludge," you lose the critical insight that the *choice point* was clean. The violation is not that friction exists, but that the "frictionless" label was applied to a process that merely *deferred* the friction.

  **B. Dark Patterns (specifically 'Roach Motel' or 'Forced Continuity')**
  *   **Definition:** Interface designs that trick users into taking actions they did not mean to, or make it difficult to reverse actions.
  *   **Distinction:** Dark patterns typically rely on **interface deception** (e.g., a greyed-out button, a hidden link). In your utility and welfare examples, the interface is honest. The button works. The tap registers. The deception is not in the *code* of the button, but in the **process logic** triggered by the button.
  *   **The Strain:** Dark pattern taxonomies focus on the UI layer. Your examples pass UI inspection. The "darkness" is in the backend workflow (the queue routing, the form requirement). A UI audit misses this entirely.

  **C. Price Obfuscation (Economics/Consumer Law)**
  *   **Definition:** Hiding or complicating price information so consumers cannot accurately compare costs.
  *   **Distinction:** This fits your hospital example well, but fails the first two. Obfuscation is usually monetary and simultaneous. Your welfare and utility examples involve **procedural and temporal costs** (waiting 11 weeks, filling a paper form) rather than monetary ones. Furthermore, obfuscation usually hides the price *at the moment of choice*. Your examples show a price/cost of zero at the moment of choice, which is technically true, but misleading because the *real* cost materializes later.
  *   **The Strain:** Obfuscation implies the information is available but hard to find. In your cases, the information (the 11-week delay, the paper form requirement) is often **non-existent** at the point of choice. It is not hidden; it is absent from that context entirely.

  ### 2. Coining the Term: **Friction Displacement**

  Since no term fits, I propose **Friction Displacement**.

  **Definition:**
  > A choice architecture configuration wherein the costs (temporal, procedural, or monetary) associated with a decision are structurally relocated from the point of choice to a downstream stage, medium, or metric where they are invisible to the decision-maker and unmeasured by compliance audits.

  **Edges and Nuances:**

  *   **Deliberateness:** The concept applies to the **structure**, not the intent. Whether the designers *intended* to hide the cost or simply siloed their departments (so the app team didn't know what the queue team did) is irrelevant to the *effect* on the user. However, for *ethical* or *legal* condemnation, deliberateness matters. Friction Displacement is a **structural hazard**; it becomes a **violation** when the displacement is designed to evade scrutiny.
  *   **Magnitude:** The relocated cost must be **material**. If the paper form takes 30 seconds to fill, it is poor design. If it requires mailing physical documents, it is Friction Displacement. The threshold is whether the cost is sufficient to alter the rational choice had it been disclosed at $t_0$.
  *   **Deception vs. Poor Design:** It shades into poor design when the displacement is accidental (e.g., legacy IT systems prevent showing the wait time). It becomes deception when the "frictionless" claim is actively used in marketing or compliance reports *knowing* the downstream cost exists. The key discriminator is the **claim of ease**. If the government claims "easy opt-out" while knowing the opt-out triggers a 11-week delay, that is deception.
  *   **The Hospital Variant:** In the cafeteria example, the cost is monetary but the *signal* is displaced. This is a subtype: **Price Signal Displacement**. It belongs under the same umbrella because the mechanism (decoupling the decision signal from the cost signal) is identical.

  ### 3. Restating the "Easy Opt-Out" Requirement

  The current standard ("opt-out must be easy") is vulnerable to Friction Displacement because it is a **point-in-time test**. It examines the state of the system at the moment of the click.

  To survive this, the criterion must be restated as a **Process-Integrated Test**.

  **Proposed Wording:**
  > "An opt-out is considered easy only if the **total burden of reversal**, including all downstream procedural, temporal, and monetary costs triggered by the opt-out action, does not exceed the burden of the default path. Furthermore, all material downstream consequences must be disclosed at the point of choice."

  This shifts the focus from the *mechanism of exit* (the button) to the *consequence of exit* (the journey).

  ### 4. Auditing for Friction Displacement

  An audit confined to the decision point will miss this by construction. You cannot audit a journey by inspecting a snapshot. To detect Friction Displacement, the audit methodology must change in three ways:

  **A. Longitudinal Journey Tracing**
  Auditors must not stop at the "Success" screen. They must track a cohort of opt-outs through the subsequent process.
  *   *Utility:* Do not just click "Decline." Wait for the next bill. Attempt to change the tariff three months later. Measure the steps.
  *   *Welfare:* Do not just tap "Decline." Track the file ID. Measure the time until the next substantive contact compared to the control group.

  **B. Cross-Silo Metric Alignment**
  Friction Displacement thrives in silos (Digital Team vs. Operations Team). The audit must compare metrics across departments.
  *   *Check:* Does the "Opt-Out Rate" metric owned by Digital correlate with the "Processing Time" metric owned by Operations? If high opt-outs correlate with high processing delays, you have found displacement.

  **C. The "Shadow Price" Calculation**
  For every "frictionless" choice, the audit must assign a shadow price to the downstream consequences.
  *   *Method:* If opting out adds 11 weeks of waiting, calculate the economic value of that time (e.g., hourly wage or welfare penalty). Add this to the "cost" of the choice. If the shadow price is high, the choice was not frictionless, regardless of the click count.

  ### Summary

  You are encountering **Friction Displacement**. It is a compliance arbitrage strategy that exploits the gap between **interface transparency** (the button works) and **process opacity** (the consequence is hidden).

  It is distinct from Sludge because the friction is deferred. It is distinct from Dark Patterns because the interface is honest. It defeats current evaluation because evaluations measure the *click*, not the *consequence*.

  To fix this, you must stop auditing the **door** and start auditing the **hallway**. The "easy exit" guarantee must cover the entire path to the street, not just the handle on the door.
