answer: |-
  This is a classic case of a philosophical slogan doing too much heavy lifting in a high-stakes environment. Your attending is using Ryle's *The Concept of Mind* (1949) as a blunt instrument, but the department's debate shows they've stumbled into the live wire of contemporary epistemology (specifically the Intellectualism vs. Anti-Intellectualism debate).

  The sentence "Knowing how isn't knowing that" is ambiguous. It can range from a boring grammatical observation to a radical metaphysical claim about the nature of mind. Here are the five distinct claims hidden inside that slogan, ranked from trivial to radical, with verdicts on their plausibility and which of your two scenarios they license.

  **1. The Syntactic Claim**
  *   **The Claim:** "Know how" and "know that" govern different grammatical complements (infinitives vs. propositions), so they function differently in language.
  *   **Plausibility:** **True.** Linguistically undeniable.
  *   **Licenses:** **Neither.** This explains why we say "I know *how to* suture" vs "I know *that* the appendix is inflamed," but it says nothing about the underlying cognitive reality.
  *   **Intellectualist Objection:** **Survives easily.** Intellectualists agree the grammar differs; they argue the underlying mental state is the same.
  *   **Verdict:** **Irrelevant.** This is just grammar. It cannot justify the attending's dismissal of reading, nor can it settle the AI debate.

  **2. The Neurocognitive Claim**
  *   **The Claim:** Procedural memory (motor skills, habits) and declarative memory (facts, events) rely on distinct neural substrates (e.g., basal ganglia/cerebellum vs. hippocampus/medial temporal lobe).
  *   **Plausibility:** **High.** Strongly supported by neuroscience (e.g., patient H.M. could learn mirror tracing despite amnesia).
  *   **Licenses:** **Denying the AI (Use 2).** If the system lacks a motor cortex or procedural architecture, it lacks the hardware for "how." It does **not** license **Shutting Down Reading (Use 1)**. Declarative knowledge (reading) often scaffolds procedural learning in early stages.
  *   **Intellectualist Objection:** **Survives.** Intellectualists can concede the hardware differs while maintaining the *content* of the knowledge is still propositional.
  *   **Verdict:** **Useful for the AI debate, useless for the studying debate.** This validates that the narrator lacks the skill, but doesn't prove reading won't help you acquire it.

  **3. The Normative Claim**
  *   **The Claim:** The success conditions differ. "Knowing that" is successful if the proposition is *true*; "Knowing how" is successful if the action *succeeds*.
  *   **Plausibility:** **High.** You can know a true fact and fail to act; you can act successfully without being able to articulate the fact.
  *   **Licenses:** **Denying the AI (Use 2).** The AI narrated (truth-apt) but did not act (success-apt). It does **not** license **Shutting Down Reading (Use 1).** Reading provides truth-apt content which may be necessary for action-success, even if not sufficient.
  *   **Intellectualist Objection:** **Survives.** Intellectualists argue the proposition known is "w is a way to x," and the success condition is acting on w.
  *   **Verdict:** **Strong for the AI debate.** It clarifies that narration is a different game than surgery.

  **4. The Non-Reducibility Claim (The Core Rylean Claim)**
  *   **The Claim:** A skill cannot be *exhaustively reduced* to a finite list of propositions. There is always a "residue" of judgment, timing, and adaptation that facts cannot capture.
  *   **Plausibility:** **Contested.** This is the battlefield. Anti-Intellectualists say yes; Intellectualists (like Jason Stanley) say no.
  *   **Licenses:** **Both (with caveats).** It supports **Denying the AI (Use 2)** because a list of steps (narration) is not the skill. It supports **Shutting Down Reading (Use 1)** *only if* you assume reading provides *only* reducible facts. (This is where your attending is likely overreaching).
  *   **Intellectualist Objection:** **DOES NOT SURVIVE.** This is the specific claim Intellectualism attacks. They argue knowing how *is* knowing that a certain way is the way to do it, under a "practical mode of presentation."
  *   **Verdict:** **The Battleground.** If your department accepts this, the AI has no skill. If they reject it, the AI might "know" in a technical sense. **Warning:** This claim does not logically entail that reading is useless, only that reading is *incomplete*.

  **5. The Dispositional Claim (The Radical Claim)**
  *   **The Claim:** Knowing how is not an inner mental state at all; it is strictly a *disposition* to behave in certain ways under certain conditions. To have the knowledge just *is* to be ready to act.
  *   **Plausibility:** **Low/Controversial.** Most modern cognitive science posits inner states (representations) cause the disposition.
  *   **Licenses:** **Both Strongly.** It licenses **Denying the AI (Use 2)** (no body, no disposition). It licenses **Shutting Down Reading (Use 1)** (reading is contemplation, not a behavioral disposition).
  *   **Intellectualist Objection:** **DOES NOT SURVIVE.** Intellectualists argue you can have the disposition only because you possess the propositional knowledge guiding it.
  *   **Verdict:** **Philosophically Expensive.** This makes "knowledge" vanish into "behavior." It solves your problems but creates new ones (e.g., do you lose the skill when you sleep?).

  ### Summary Advice for the Ward

  The claim that **has to survive the Intellectualist objection** to maintain the strict "How $\neq$ That" divide is **#4 (Non-Reducibility)**. If #4 falls, Intellectualism wins, and "knowing how" becomes a species of "knowing that."

  **However, here is the critical catch for your specific situation:**
  Even if **Claim #4** is true (skills aren't just facts), it **does not license your attending's dismissal of reading.**

  Ryle's argument is that facts do not *constitute* the skill, not that facts do not *guide* the acquisition of the skill. You can accept that "Knowing how $\neq$ Knowing that" while still admitting that "Knowing that helps you learn Knowing how."

  *   **For the AI Debate:** Rely on **Claim #3 (Normative)** or **#4 (Non-Reducibility)**. Narration is truth-conditional; surgery is success-conditional.
  *   **For the Studying Debate:** Call out the attending. They are conflating **constitution** with **causation**. Reading provides the propositional scaffolding (Claim #2) required to build the procedural skill, even if the reading itself isn't the skill (Claim #4).

  **Verdict:** Your attending is using a metaphysical distinction to make a pedagogical claim. That is a category error. You can agree that "reading isn't suturing" without agreeing that "reading doesn't help you suture."
