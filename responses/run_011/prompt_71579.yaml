      *   *Claim 3:* Plausible. Licenses Use D (AI didn't succeed in action). Doesn't license Use S.
      *   *Claim 4:* Contested. Licenses Use S (reading = facts, skill $\neq$ facts) and Use D. *This is the battleground.*
