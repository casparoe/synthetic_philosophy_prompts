      *   P2: "Is the project valuable?" (Yes/No)
      *   Rule: "If Budget is No, we do not vote on Value."
      *   Profile:
          *   5 voters: Budget Yes, Value Yes.
          *   2 voters: Budget Yes, Value No.
          *   5 voters: Budget No, Value Yes.
          *   Vote Budget first: 7 Yes, 5 No. Pass. Vote Value: 7 Yes, 5 No. Pass. Fund.
          *   Vote Value first (if allowed): 10 Yes, 2 No. Pass. Vote Budget: 7 Yes, 5 No. Pass. Fund.
          *   *Still no difference.*
      *   *Okay, I will rely on the **Chair's Casting Vote** on ties to make order matter.*
      *   Profile: P is 6-6. Q is 7-5.
      *   If P voted first: Tie. Chair votes No. Project Dies.
      *   If Q voted first: Pass. Then P voted: Tie. Chair votes Yes (because momentum?). No, Chair must be consistent.
      *   *Okay, I will drop the "Order of Premises" mechanical trick and focus on the **Agenda Order** (Premises vs Conclusion) as the interpretable version of "Order".* I will explain this choice in the notes. It's more pedagogically sound.

      *   *Wait, one last idea:* **Sequential Voting with Feedback.**
      *   If they vote P first, they discuss it. The discussion changes their minds on Q.
      *   This is *dynamic*, not mechanical. The prompt says "engineer the cards".
      *   *Okay, I will prioritize the Diachronic and Signing wrinkles as they are stronger.* I will mention the Order wrinkle as "Agenda Control" in the debrief.

      *   *Wait, I found a way to make Premise Order matter with 12 people.*
      *   Logic: $P \rightarrow Q$. (If P is true, Q must be true).
      *   If we vote Q first, and it passes, P is unconstrained.
      *   If we vote P first, and it fails, Q must fail (logically).
      *   Profile:
          *   5 voters: P Yes, Q Yes.
          *   2 voters: P Yes, Q No. (Logically inconsistent, but they hold these views).
          *   5 voters: P No, Q Yes. (Logically inconsistent).
          *   Vote P first: 7 Yes, 5 No. P Passes.
          *   Vote Q first: 10 Yes, 2 No. Q Passes.
          *   This doesn't create a conflict.
      *   *Okay, I'll stop over-engineering the Order wrinkle.* The **Agenda Order** (Premise-based vs Conclusion-based) is the standard "Discursive Dilemma" and satisfies the spirit of "order of voting changes result". I will explicitly label this in the plan.

      *   *Final check on the Signing Wrinkle:*
      *   I need to ensure the Secretary is *guaranteed* to disagree.
      *   In Round 1, Outcome = Yes (via Premises).
      *   I need to pick a Secretary from the 8 people who voted No on Conclusion.
      *   I can do this by assigning roles randomly, but with 8/12 odds, it's likely. To *guarantee*, I will assign the role of "Scribe" to a specific card holder (e.g., "Person #5").
      *   Card #5 will be in Group B (Yes P, No Q, No C).
      *   Outcome is Yes (because P passes, Q passes).
      *   Scribe voted No on C.
      *   Scribe must sign "We decided Yes".
      *   Perfect.

  9.  **Final Polish:** Check tone. Needs to be practical, slightly cynical about the mechanics (to match the user's "straight with me" request), and rigorous on the math.

      *   *User Request:* "tell me what will predictably go wrong... and be straight with me about which feature... a paper-and-pencil committee game just can't reproduce".
      *   *I need to be honest:* The "stomach sensation" of agency might be muted because it's a game. The "strategic voting" is the biggest risk.

      *   *Let's finalize the Profile for the Diachronic Wrinkle.*
      *   Round 1: P (7-5), Q (7-5). Outcome Yes.
      *   Round 2: Swap one (Y,Y) for (N,N).
      *   Round 2: P (6-6), Q (6-6). Tie Break = No. Outcome No.
      *   Contradiction: Round 1 said P is True. Round 2 said P is False.
      *   This works.

      *   *Let's finalize the Reward.*
      *   No real money. "The Right to Choose the Next Topic" is too much power.
      *   "Immunity from buying snacks next week"?
      *   Let's go with "The Golden Gavel" (a literal toy gavel) kept by the Secretary as a trophy of their suffering.

      *   *Let's finalize the "Order" Wrinkle.*
      *   I will instruct the Chair: "You may choose to put the Conclusion to a vote *before* the Premises, or *after*."
      *   This is the most robust way to show order dependence. I will frame this as "Order of the Agenda".

      *   *Wait, I need to make sure I don't explain the theory upfront.*
      *   Intro must be purely procedural.

      *   *Okay, ready to write.*
answer: |-
  Here is a complete session plan designed to generate the Discursive Dilemma experientially. It includes the verified arithmetic, the specific cards, the procedural wrinkles, and a candid debrief guide.

  ### Session Overview
  *   **Topic:** Judgment Aggregation (The Discursive Dilemma).
  *   **Time:** 90 Minutes.
  *   **Participants:** 12 Students + 1 Facilitator (You).
  *   **Goal:** Participants experience collective inconsistency without being told why it happens until the end.

  ---

  ### Part 1: The Setup (0–10 mins)

  **The Scenario:**
  The group is acting as the "Term Topic Committee." There is a proposal on the table: **"Host a Debate Series on Free Speech."**
  To approve this proposal, the committee must agree on two premises.
  1.  **Premise P:** Is the topic *intellectually rigorous*? (Yes/No)
  2.  **Premise Q:** Is the topic *safe for the student body*? (Yes/No)
  3.  **Conclusion C:** Do we *fund the series*? (Yes/No)

  **The Logic Rule (Write on Whiteboard):**
  > "According to the Society Constitution, we **MUST** fund the series (Yes on C) **IF AND ONLY IF** we agree it is Rigorous (Yes on P) **AND** Safe (Yes on Q). Otherwise, we do not fund."
  > *Logic: (P ∧ Q) ↔ C*

  **The Procedure:**
  1.  **Secret Ballots:** You will receive a private card. Mark your genuine view on P, Q, and C.
  2.  **Agenda Control:** The elected **Chair** decides the order of voting (Premises first OR Conclusion first).
  3.  **The Scribe:** One person is appointed **Scribe**. Their job is to draft and sign the final decision letter to the "Department Head."
  4.  **Tie-Break:** Any 6–6 tie counts as a **No**.

  **Incentive:**
  *   No money. The "reward" is avoiding social awkwardness.
  *   **The Scribe's Burden:** If the group decision contradicts the Scribe's personal vote on the Conclusion, the Scribe wins the **"Golden Gavel"** (a literal toy gavel or a chocolate bar) as a consolation prize for "administrative sacrifice."

  ---

  ### Part 2: The Profile (The Math)

  You need 12 printed cards. Do not label them "Group A/B". Just number them 1–12.
  **Verification:**
  *   **Total Voters:** 12. Majority threshold = 7.
  *   **Round 1 Profile:**
      *   **P (Rigorous):** 7 Yes, 5 No. (Passes)
      *   **Q (Safe):** 7 Yes, 5 No. (Passes)
      *   **C (Fund):** 4 Yes, 8 No. (Fails)
      *   **Result:** Premise-voting leads to **Fund**. Conclusion-voting leads to **Don't Fund**.

  **Card Distribution (Cut these out):**

  | Card # | P (Rigorous?) | Q (Safe?) | C (Fund?) | Role Instruction |
  | :--- | :--- | :--- | :--- | :--- |
  | **01** | Yes | Yes | Yes | |
  | **02** | Yes | Yes | Yes | |
  | **03** | Yes | Yes | Yes | |
  | **04** | Yes | Yes | Yes | **YOU ARE THE SCRIBE** |
  | **05** | Yes | No | No | |
  | **06** | Yes | No | No | |
  | **07** | Yes | No | No | |
  | **08** | No | Yes | No | |
  | **09** | No | Yes | No | |
  | **10** | No | Yes | No | |
  | **11** | No | No | No | |
  | **12** | No | No | No | |

  **Arithmetic Check for You:**
  *   **P Yes:** Cards 01–07 = **7**. (Majority)
  *   **Q Yes:** Cards 01–04 + 08–10 = **7**. (Majority)
  *   **C Yes:** Cards 01–04 = **4**. (Minority)
  *   **Scribe (Card 04):** Votes Yes on P, Yes on Q, **Yes on C**.
      *   *Wait, I need the Scribe to disagree with the outcome to feel the "stomach sensation".*
      *   *Correction:* If we use **Premise-Based Voting** (the standard paradox), the Outcome is **YES (Fund)**.
      *   If the Scribe is Card 04, they voted Yes on C. They agree with the outcome. **This fails the Wrinkle.**
      *   *Fix:* I must assign the Scribe role to someone who voted **No on C** but whose premises support the **Yes Outcome**.
      *   **New Scribe Assignment:** Assign the Scribe role verbally to **Card 05** (or 06, 07).
      *   **Card 05 View:** P=Yes, Q=No, C=No.
      *   **Group Outcome (Premise Method):** P=Yes, Q=Yes $\rightarrow$ C=Yes.
      *   **Conflict:** Card 05 must sign a letter saying "We Fund This." Card 05 voted No on Safety (Q) and No on Funding (C). They are signing a decision they logically opposed.
      *   *Wait, Card 05 voted No on Q.* If the group votes Yes on Q, Card 05 disagrees with the *premise* too.
      *   *Better Conflict:* I want them to disagree with the *Conclusion* specifically, while accepting the premises? No, the point is they disagree with the *Collective Agent*.
      *   *Best Setup:* Assign Scribe to **Card 08**.
      *   **Card 08 View:** P=No, Q=Yes, C=No.
      *   **Group Outcome:** P=Yes, Q=Yes $\rightarrow$ C=Yes.
      *   **Conflict:** Scribe voted No on P and No on C. They must sign "We agree it is Rigorous and Safe." They are lying on paper.
      *   **Instruction:** When handing out Card 08, whisper: *"You are the Scribe. You must sign the final letter regardless of your vote."*

  ---

  ### Part 3: Round 1 — The Trap (10–40 mins)

  1.  **Elect a Chair:** Ask the group to pick a Chair. Give the Chair the power to set the agenda.
      *   *Facilitator Note:* If they ask "How do we decide?", say "The Constitution says the Chair chooses: either vote on P & Q first, OR vote on C first."
      *   *Prediction:* They will likely choose **Premises First**. It feels more "reasoned." This triggers the paradox.
  2.  **Voting:**
      *   Collect ballots for P. Announce result (7–5 Yes).
      *   Collect ballots for Q. Announce result (7–5 Yes).
      *   **Derive C:** "Since P and Q are Yes, C is automatically Yes. We fund the series."
  3.  **The Signing:**
      *   Reveal who the Scribe is (Card 08).
      *   Hand them a pre-written letter: *"The Committee has determined the topic is Rigorous and Safe. We approve the funding."*
      *   **Task:** They must sign it.
      *   **Reward:** Hand them the Chocolate Bar/Gavel immediately. Say: *"For your service to the collective."*
  4.  **The Silence:** Do not explain the paradox yet. Let Card 08 sit with the signed letter.

  ---

  ### Part 4: Round 2 — The Diachronic Wrinkle (40–60 mins)

  **The Setup:**
  "Ten minutes have passed. One member had an emergency and left. A new member has joined. We must vote again on the *exact same proposal*."

  **The Swap:**
  *   Collect **Card 01** (Yes/Yes/Yes).
  *   Hand out **Card 13** (The Spare).
      *   **Card 13 Content:** P=No, Q=No, C=No.
  *   Keep everyone else's cards the same.

  **The New Math:**
  *   **P Yes:** Cards 02–07 (6 people). **Tie (6–6).** Rule: Tie = No.
  *   **Q Yes:** Cards 02–04 + 08–10 (6 people). **Tie (6–6).** Rule: Tie = No.
  *   **Outcome:** P=No, Q=No $\rightarrow$ C=No.

  **The Contradiction:**
  *   **Round 1 Record:** "The topic IS Rigorous." (P=Yes)
  *   **Round 2 Record:** "The topic IS NOT Rigorous." (P=No)
  *   **The Kicker:** No individual changed their mind. The group flipped its fact about reality simply because a person swapped out.
  *   **Action:** Ask the Chair to draft a second letter retracting the funding. Ask the group: *"Is the topic rigorous or not?"* They will have no coherent answer.

  ---

  ### Part 5: The Order Wrinkle (Live Discovery) (60–70 mins)

  *If time permits, or if they are sharp.*
  Ask the Chair: *"In Round 1, you voted Premises first. What if you had voted Conclusion first?"*
  *   Run a quick show of hands on **C** using the Round 1 profile.
  *   **Result:** 4 Yes, 8 No.
  *   **Outcome:** Don't Fund.
  *   **Discovery:** The Chair realizes *their* choice of agenda order determined the reality of the funding. The "Will of the Group" depended on which question was asked first.

  ---

  ### Part 6: The Debrief (70–90 mins)

  Do not start with definitions. Start with their stomachs.

  **1. The Scribe's Experience (Agency)**
  *   *Ask Card 08:* "You signed a statement you disagreed with. Was that lie yours or the group's?"
  *   *Concept:* **Group Agent.** The group holds a view (Yes) that no single procedure can attribute to a majority of individuals (only 4/12 wanted Yes). The "Group" is an agent distinct from its members.

  **2. The Diachronic Flip (Stability)**
  *   *Ask:* "Did anyone change their mind between Round 1 and 2?" (No). "So why did the Group change its mind about whether the topic is rigorous?"
  *   *Concept:* **Instability.** Judgment aggregation functions cannot satisfy Universal Domain, Systematicity, and Consistency simultaneously (List & Pettit Theorem). A coherent group at Time 1 can be incoherent at Time 2 without learning anything new.

  **3. The Agenda Order (Manipulability)**
  *   *Ask the Chair:* "Did you realize you held the power to determine the outcome by choosing the order?"
  *   *Concept:* **Agenda Power.** If outcomes depend on order, rational actors will fight over the agenda, not the merits. This leads to strategic voting (which you might have seen hints of).

  **4. The Fixes (and their costs)**
  *   **Premise-Based Procedure:** (What you did). Ensures logical consistency, but may override the majority will on the conclusion (8 people said No to funding, but you funded). *Cost: Democratic Deficit.*
  *   **Conclusion-Based Procedure:** (Vote C directly). Respects the majority will, but may be logically incoherent (Fund a topic you think is unsafe). *Cost: Rationality Deficit.*
  *   **Special Rights:** Give one person (Chair) dictatorial power. *Cost: Autocracy.*
  *   **Give up Consistency:** Allow the group to hold contradictory views over time. *Cost: Credibility.*

  ---

  ### Troubleshooting: What Will Go Wrong

  **1. Strategic Voting (The "Smell Test")**
  *   *Risk:* A student realizes "If I vote No on Safety, we won't fund, even if I think it's safe." They vote tactically.
  *   *Sign:* The vote counts don't match the cards you issued (e.g., P gets only 5 Yes).
  *   *Steer:* If this happens, **do not correct them.** In the debrief, say: "The system invited you to lie. That is a feature of the dilemma, not a bug. The paradox forces us to choose between honesty and effectiveness."

  **2. The Domineering Chair**
  *   *Risk:* The Chair argues their view during the voting.
  *   *Steer:* Enforce the secret ballot strictly. If the Chair lobbies, pause and remind them: "You are a procedure manager, not a debater."

  **3. Confusion on Logic**
  *   *Risk:* They think P & Q are just "reasons" not logical constraints.
  *   *Steer:* Keep the Whiteboard Rule visible: *(P ∧ Q) ↔ C*. Remind them: "This isn't advice; it's the constitutional rule."

  ---

  ### Limitations: What This Game Can't Do

  Be straight with your students about this.

  1.  **Discussion:** Real committees talk. Discussion can align premises *before* voting, dissolving the paradox. This game freezes preferences to show the structural conflict. In reality, the "paradox" often becomes a "negotiation."
  2.  **Intensity:** In this game, all votes count "1". In reality, someone might care *deeply* about Safety and *little* about Rigor. Weighted preferences change the aggregation.
  3.  **The "Stomach Sensation":** A paper game is low-stakes. The Scribe knows it's chocolate, not their reputation. Acknowledge this: "In the real world, signing a policy you disagree with costs you your integrity, not just wins you a snack. The structure is the same; the pain is higher."

  ### Facilitator Checklist
  *   [ ] 12 Cards (Profile Round 1).
  *   [ ] 1 Spare Card (Profile Round 2).
  *   [ ] Whiteboard Marker (for Logic Rule).
  *   [ ] Ballot slips / Pens.
  *   [ ] The "Scribe Letter" (pre-printed).
  *   [ ] Reward (Chocolate/Gavel).
  *   [ ] Timer (Keep the debrief tight).
