answer: |-
  **Specification for a Normative Theory of Interactive Kinds**

  **1. Purpose and Normative Burden**
  You are correct to identify the gap between Hacking's descriptive irony and the revision committee's need for a ruler. Hacking tells us *that* kinds loop; a committee needs to know *how* to manage the loop. Consequently, an adequate theory cannot merely describe the mechanism of interaction; it must provide a metric for **interventional validity**. It must distinguish between a loop that clarifies a condition (a gain) and one that iatrogenically manufactures pathology (a cost). The burden shifts from ontological accuracy to **ethical foresight**: the theory must predict the moral and clinical consequences of codifying a label. If it cannot distinguish a beneficial feedback loop (e.g., destigmatisation leading to help-seeking) from a harmful one (e.g., suggestion leading to symptom fabrication), it is useless for governance.

  **2. The Desiderata**
  An adequate account must satisfy the following conditions. Failure on any non-negotiable item renders the theory insufficient for your stated purpose.

  *   **D1. Ontological Discrimination (Non-negotiable)**
      *   *Requirement:* The theory must distinguish between a kind that is 'made-up' (fabricated without underlying regularity) and one that is 'socially constructed but real' (emergent regularities sustained by practice).
      *   *Case:* **Homosexuality (DSM-III, 1973).** The theory must allow that the category was removed not because the behaviour vanished, but because the *evaluation* of the kind changed, without committing to the view that the attraction itself was merely a fiction prior to 1973. It must accommodate a fact of the matter regarding suffering or functioning independent of the label's moral valence.

  *   **D2. Mechanism Specificity (Non-negotiable)**
      *   *Requirement:* It must separate changes in **extension** (who falls under the label) from changes in **content** (what the labelled people are like).
      *   *Case:* **Adult ADHD/Autism self-identification.** Here, the extension widens via algorithmic recommendation rather than clinical assessment. The theory must explain whether the 'content' of the kind is changing (new phenotypes emerging via social media) or merely the gatekeeping thresholds. If it conflates viral spread with phenotypic change, it cannot advise a committee on whether to narrow the criteria.

  *   **D3. Temporal Asymmetry (Non-negotiable)**
      *   *Requirement:* The theory must account for **retrospective truth** without denying **forward-looking constitution**. It must explain how a clinician can be right about a patient from 1920 who lacked the concept, while admitting that a patient in 2024 is partly constituted by their knowledge of the concept.
      *   *Case:* **Multiple Personality Disorder (MPD).** The theory must explain the evanescence of MPD. If the kind is strongly constituted by self-understanding, why did it vanish when the cultural script dried up? Conversely, if it was 'real', why did it disappear so completely? The theory must handle ephemeral kinds without dismissing them as frauds.

  *   **D4. Contextual Sensitivity (Preference: Pragmatist)**
      *   *Requirement:* It must allow the same label to loop differently across institutional settings.
      *   *Case:* **Clinic vs. Courtroom.** A diagnosis might stabilise a patient in therapy (beneficial loop) while incriminating them in law (harmful loop). A theory that treats the kind as having a single, uniform interactive profile will fail the committee, which operates across these boundaries.

  *   **D5. The Null Hypothesis (Non-negotiable)**
      *   *Requirement:* The theory must identify at least one class of human kinds that **does not loop**, or explain the boundary conditions where looping ceases. If every human kind is interactive, the concept loses explanatory power.
      *   *Case:* **Proposed Subtypes in Parent Forums.** If a name circulates before data exists, does it loop immediately? The theory must specify the threshold of uptake required to trigger a loop. Ideally, it should point to biological constraints (e.g., severe intellectual disability or delirium) where self-understanding cannot causally feed back into the presentation sufficiently to alter the kind's core. *Note: This is likely your most excluding requirement. If you cannot name a non-looper, your theory claims everything is social, which collapses into D1.*

  *   **D6. Normative Valence (Non-negotiable)**
      *   *Requirement:* It must provide criteria for judging a loop as **adaptive** or **maladaptive**.
      *   *Case:* **Premature Subtypes.** When a label reshapes teenage self-description before clinical validation, is this empowerment or contagion? Hacking remains agnostic here; your spec demands a verdict. The theory must link the mechanism of the loop to outcomes in functioning or suffering.

  **3. Where the List Breaks**
  Your suspicion is well-founded. There is a trilemma here involving **Strong Constitution**, **Predictive Usefulness**, and **Retrospective Truth**. You cannot hold all three.

  1.  **Strong Constitution:** If the kind is partly made of the classified people's self-understandings, then the kind *did not exist* prior to that understanding.
  2.  **Retrospective Truth:** If clinicians can be right about pre-label cases (e.g., 'There were autistics in 1950'), then the kind must exist independently of self-understanding.
  3.  **Predictive Usefulness:** If the committee is to use the theory to manage future changes, the kind must have sufficient stability to model. But if Strong Constitution holds, the kind is inherently unstable (subject to the whims of self-description).

  If you prioritise **Retrospective Truth** (to save clinical authority), you weaken **Strong Constitution** (making the loop superficial). If you prioritise **Strong Constitution** (to honour Hacking), you lose **Retrospective Truth** (making past diagnoses anachronistic). If you prioritise **Predictive Usefulness**, you often have to pretend the kind is stable, thereby ignoring the very looping dynamics you set out to model. The break point is usually at **Retrospective Truth**. To make the theory work for a committee, you will likely have to concede that pre-label diagnoses are *provisional* or *analogical*, not strictly true. If you insist they are strictly true, you have abandoned the looping thesis for naturalism.

  **4. Contender Evaluation**

  **Realist / Naturalist Kinds Talk**
  *Scores well on Retrospective Truth and Predictive Usefulness, fails on Strong Constitution.*
  It secures the stability required for committee planning and validates past diagnoses, but it treats looping as mere stigma or reaction, not ontological change. It cannot explain the evanescence of MPD without accusing patients of malingering, and it fails D1 by conflating 'socially shaped' with 'made-up'.

  **Strong Social Constructionism**
  *Scores well on Strong Constitution and Normative Valence, fails on Retrospective Truth.*
  It captures the mechanism of MPD and the media-driven ADHD loops perfectly, acknowledging the power of the label to create the thing. However, it renders pre-1973 homosexuality or pre-1980 autism incoherent, undermining clinical continuity. It struggles with D5, as it tends to view all human kinds as interactive, risking emptiness.

  **Quietism / Pragmatism**
  *Scores well on Predictive Usefulness, sidesteps the Ontological clash.*
  It treats categories as tools rather than truths, focusing solely on D6 (Normative Valence). This is useful for a committee but philosophically unsatisfying for you. It refuses to answer whether the kind is 'real', thereby collapsing the distinction in D1 and offering no account of *why* some loops vanish while others persist.
