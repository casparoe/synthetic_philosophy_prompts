prompt: |-
  Retired atmospheric modeller here — thirty-odd years running numerical weather prediction, now spending my retirement on philosophy of mind and AI, which is turning out to be harder than the Navier-Stokes. Last week a young roboticist gave a talk at our local group and he explained the frame problem with an analogy I can't stop turning over. His pitch was roughly: think of a robot's world-model as one enormous spreadsheet. Each cell is some fact about the world — door open, battery on wagon, light on — and each formula is a rule about how facts depend on each other. An action is editing one cell; the frame problem is that you also have to say explicitly which cells stay untouched. But a spreadsheet doesn't need that: recalculate and every formula already knows its own dependencies, so anything you didn't hook up simply doesn't move. Conclusion he drew from this: the frame problem is a solved bookkeeping exercise, a matter of finishing filling in the formulas, and the philosophers who claim it reveals something deep about mind are making a mystery out of a clerical task. He was pretty dismissive about it.

  Here's my trouble: the analogy felt *right* to me, possibly too right. In my old field you truncate the system, you write down your prognostic variables, and anything not in the model is by construction not there — no frame axioms needed, because the closed set was the whole point. So I want a proper audit rather than a vibe.

  Give me the correspondence table: cells, formulas, the dependency graph, recalculation, locked cells, the circular-reference warning, the human who wrote the formulas in the first place — what does each map onto in the logic/planning version of the problem? Then where the mapping breaks, and — this is the part I care about most — sort those breaks into the ones that actually threaten his conclusion and the ones that are just surface differences nobody should weight. What does the spreadsheet picture quietly import that a real world-model doesn't have? Then tell me whether "it's just bookkeeping, now solved" survives the disanalogies, or whether the analogy was carrying the argument the whole way. He also tossed off two other named problems — a qualification one and a ramification one — and I'd like to know whether the spreadsheet has any room for them at all, and whether it can reach the wider version people use the term for, the one about how you decide what's relevant without already having a completed list of what's relevant (I think there's a thought experiment with three robots that all get blown up for different reasons). And if you think the analogy does more harm than good, offer a better one — maybe a different one for the narrow problem and for the wide one.

  Two things on how you answer. First, be clear about where the field is actually settled versus where it's genuinely disputed among people who work on this; I've read that the original logic problem was basically cracked by the end of the eighties, but I also read that claim hedged everywhere, and I don't want a contested position handed to me as consensus. Second, flag every place where I've (or he's) slid between different senses of the phrase — my suspicion is the analogy only works on one of them. No reading list, please, just argue it through.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Retired atmospheric modeller (30+ years NWP), now interested in philosophy of mind/AI. Understands numerical systems, truncation, prognostic variables, closed systems. Skeptical but open.
      *   **The Trigger:** A young roboticist claimed the Frame Problem is "solved bookkeeping" using a spreadsheet analogy (cells = facts, formulas = rules, recalc = inference).
      *   **The Task:**
          1.  Create a correspondence table (Spreadsheet $\leftrightarrow$ Logic/Planning).
          2.  Identify where the mapping breaks.
          3.  Categorize breaks (threaten conclusion vs. surface differences).
          4.  Identify what the spreadsheet imports that a real world-model lacks.
          5.  Evaluate the "solved bookkeeping" claim.
          6.  Address the Qualification and Ramification problems within the analogy.
          7.  Address the "Wide" Frame Problem (relevance/context).
          8.  Distinguish settled vs. disputed claims in the field.
          9.  Flag equivocations on the term "Frame Problem."
          10. No reading list, just argument.
          11. Offer better analogies if the spreadsheet one fails.

  2.  **Deconstruct the "Spreadsheet Analogy":**
      *   *Claim:* Cells = Facts, Formulas = Causal Rules/Frame Axioms. Edit = Action. Recalc = Inference.
      *   *Intuition:* In a spreadsheet, if I change $A1$, $B1$ updates if linked, $C1$ stays same if not. No need to say "$C1$ stays same."
      *   *Critique:* This assumes the links (dependencies) are already known and static. In the real world (or AI planning), determining *which* cells depend on *which* is the hard part.

  3.  **Drafting the Correspondence Table:**
      *   Cell $\rightarrow$ Fluent (time-varying property).
      *   Formula $\rightarrow$ Effect Axiom / Causal Law.
      *   Dependency Graph $\rightarrow$ Causal Structure / Relevance relations.
      *   Recalculation $\rightarrow$ Projection / Temporal Inference.
      *   Locked Cells $\rightarrow$ Frame Axioms (things that persist).
      *   Circular Reference $\rightarrow$ Feedback loops / Simultaneity issues.
      *   Human Writer $\rightarrow$ The Knowledge Engineer / The Learner.

  4.  **Analyzing the Breaks (The Core Argument):**
      *   *Break 1: Static vs. Dynamic Dependencies.* In a spreadsheet, the graph is fixed by the user. In the world, causal connections are discovered or context-dependent.
      *   *Break 2: Completeness.* A spreadsheet is a closed universe. The real world is open.
      *   *Break 3: Representation.* Spreadsheet cells are atomic. Real world facts are compositional and hierarchical.
      *   *Threat Assessment:* Break 1 & 2 threaten the "solved" conclusion. Break 3 is technical.
      *   *Hidden Import:* The spreadsheet imports *omniscience* regarding relevance. The user knows what to link. The robot doesn't.

  5.  **Addressing the "Solved" Claim:**
      *   *Narrow Frame Problem (Logical):* Yes, largely solved (Situation Calculus with successor state axioms, etc.). The roboticist is right *here*.
      *   *Wide Frame Problem (Philosophical/Cognitive):* No, not solved. This is about relevance and context. The spreadsheet fails here.
      *   *Equivocation:* The roboticist is conflating the Narrow (technical implementation) with the Wide (cognitive architecture/philosophy).

  6.  **Qualification and Ramification:**
      *   *Qualification:* "If I turn the key, the car starts." Unless the battery is dead, there's a potato in the tailpipe, gravity is suspended, etc. Spreadsheet needs explicit exception handling for *every* exception. It doesn't scale.
      *   *Ramification:* "If I move the table, the lamp on it moves." Indirect effects. Spreadsheet handles this *if* the link exists. But knowing the link exists (the lamp is *on* the table) is the issue.
      *   *Spreadsheet Capacity:* It handles ramification well (formulas propagate). It handles qualification poorly (requires explicit negative constraints for infinite exceptions).

  7.  **The "Three Robots" Thought Experiment (Dennett):**
      *   Robot 1: Considers all effects (too slow).
      *   Robot 2: Considers only intended effects (misses side effects, blows up).
      *   Robot 3: Considers relevant effects (can't define relevance).
      *   *Spreadsheet mapping:* Robot 1 = Recalc whole sheet. Robot 2 = Edit one cell, ignore formulas. Robot 3 = Needs to know which formulas to activate. The spreadsheet *is* Robot 1's architecture, assuming all links are pre-defined. It doesn't solve the "which links matter *now*" problem.

  8.  **Settled vs. Disputed:**
      *   *Settled:* The logical formalization (Shanahan, Reiter) works for toy worlds. Successor State Axions solve the logical inference burden.
      *   *Disputed:* Whether this solves the *philosophical* problem of intentionality/relevance. Whether connectionist/ML approaches bypass it or just hide it.

  9.  **Better Analogies:**
      *   *Narrow:* Version Control System (Git). You commit changes, everything else stays same *unless* merged. Still requires knowing what to merge.
      *   *Wide:* A Library vs. Google Search. The library has all the books (facts). The problem is finding the *one* book relevant to "how to defuse a bomb" without reading the whole library. Or: A Spotlight in a dark room.

  10. **Refining the Tone:**
      *   Respect the user's background (NWP). Use terms like "boundary conditions," "parameterization," "closure."
      *   Be precise about the "Frame Problem" ambiguity.
      *   Avoid dogmatism where the field is split.

  11. **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the "Human who wrote the formulas"? Yes, that's the knowledge acquisition bottleneck.
      *   *Check:* Did I distinguish Narrow vs. Wide clearly? This is crucial. The roboticist is talking Narrow; the philosophers talk Wide.
      *   *Check:* Is the spreadsheet analogy *completely* useless? No, it's good for the Narrow problem (successor state axioms are basically spreadsheet formulas). I need to acknowledge that validity before dismantling it for the Wide problem.
      *   *Check:* NWP analogy. The user mentioned truncation. I should leverage that. In NWP, you assume sub-grid processes are parameterized. In AI, you can't parameterize "everything not mentioned."

  12. **Final Polish:** Ensure the structure matches the prompt's requirements (Table, Breaks, Qualification/Ramification, Settled/Disputed, Equivocations, Better Analogies).

  *(Self-Correction on the "Solved" claim)*: I need to be careful. Reiter's Situation Calculus (1991) is widely accepted as solving the *logical* frame problem. But the *philosophical* frame problem (Dennett's version) is arguably unsolved. The roboticist is claiming the latter is solved by the former. That's the slide.

  *(Self-Correction on Spreadsheet)*: A spreadsheet *does* require you to specify what stays untouched implicitly by *not* linking it. But in a dynamic world, you don't know what *not* to link until you see the context. That's the crux.

