  **GlyphID™: The Complete Extension.**
  Stop guessing. Start matching.

  For decades, type foundries and cognitive scientists relied on intuition to determine letter identity. They argued about features, structures, and spirits. GlyphID™ has retired intuition. We enumerated every possible glyph constructible on the standard 4x6 legal segment grid. We subjected all 16,384 combinations to a panel of 10,000 raters. We now possess the ground truth for lowercase identity. There is no theory. There is only the List. If it is not in the database, it does not exist.

  **Technical Specifications**
  *   **Grid Constraint:** 4 units wide, 6 units tall.
  *   **Segment Logic:** Orthogonal and 45° diagonal only. No curves.
  *   **Coverage:** 100% of combinatorial space. Zero gaps.
  *   **Validation:** Mean Opinion Score (MOS) per glyph per character class.
  *   **Latency:** <5ms database lookup.

  **Pricing**
  *   **Viewer (Free):** Read-only access to the Master List. Verification limited to 5 queries per day. Membership registration required to acknowledge Terms of Identity. You may look, but you may not use.
  *   **Pro ($49/mo):** Includes Grid Agnosticism. Our algorithms extrapolate Master List truth values to 5x6 or 8x8 grids where no enumeration exists. You pay for the confidence of known unknowns.
  *   **Enterprise (Custom):** Structural Affinity Streaming™. Dynamically adjust identity thresholds based on user context. Ideal for brands requiring fluid logo morphing without losing legal protection. We sell the similarity, you own the risk.

  **Frequently Asked Questions**

  **Q: What specific features make a glyph an 'a'?**
  A: Identity is not feature-based; it is membership-based. However, many clients request audit trails for compliance. We sell the Explainability Add-On ($200/mo). It returns a feature list such as "contains closed counter" and "has vertical spine." Please note: some verified 'a's in the Master List lack these features. The list is descriptive, not prescriptive. We are proud of this transparency. The features are necessary until they are not.

  **Q: What happens if you change the grid or add a legal segment?**
  A: The current database represents the complete extension of the 4x6 orthogonal-diagonal space. A 5x6 grid constitutes a new combinatorial universe. This requires a new enumeration cycle, estimated at 18 months. Your current license does not cover new universes. You must wait for GlyphID™ 2.0.

  **Q: My double-story 'a' was flagged as 0.5 identity. Why?**
  A: Our panel data was bimodal. Single-story raters voted 0.0; double-story raters voted 1.0. The arithmetic mean is 0.5. The Mean is the Reality.
  *Ticket #8942:* "My client says this 'a' looks perfect. Your system says it's half a letter."
  *Support:* "It is statistically half a letter. Please adjust your expectation or purchase the Bimodal Split Add-On to view the clusters separately."

  **Q: How do you handle descenders (g, j, p, q, y)?**
  A: The 4x6 box does not accommodate vertical extension below the baseline. Descenders are sold as a separate SKU (Lower Extension Pack). An 'a' with a descender is not an 'a'; it is a configuration error. You must license the 'g' separately to achieve the shape legally.

  **Q: You have a glyph on the 'a' List that looks definitively like a '4'.**
  A: If the glyph is on the List, it is an 'a'. Perception is subjective; the Database is objective. If users perceive a '4', that is a localization issue, not an identity failure. We recommend updating your user's eyes.

