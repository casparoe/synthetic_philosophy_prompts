  2. **Load-bearing and not**
  The aggregation method is the primary load-bearing beam; switch to a threshold view or non-additive welfare, and the dominance claim collapses. The specific credence (1/10,000 vs 1/100) matters less than the refusal to treat it as zero. The scale premise is robust but irrelevant without the aggregation rule. The sign of welfare (net positive/negative) is load-bearing for *action* (intervention vs. non-interference) but not for the claim of moral dominance itself. You could surrender the specific neurobiological markers without cost, provided the philosophical uncertainty remains. The view stands or falls on whether tiny probabilities can be multiplied by huge numbers to dictate action.

