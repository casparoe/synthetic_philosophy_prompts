  ### 1. Logical Space

  The argument turns on four binary questions. The table below maps the 16 possible combinations. **Occupied** cells correspond to the leaves in the tree. **Empty** cells are logically incoherent. **Unreachable** cells are coherent but no one in this lab holds them.

  | Q1: Can sincere report be false? | Q2: Is report behavior or state evidence? | Q3: Should verbal report be eliminated? | Q4: Can interview improve validity? | Status |
  | :--- | :--- | :--- | :--- | :--- |
  | Yes | Behavior | Yes | No | **Occupied** (Report is Behavior) |
  | Yes | State | Yes | No | **Occupied** (Engineer Out) |
  | Yes | State | No | No | **Occupied** (Higher-Order / Nothing / Suspend) |
  | No | State | Yes | No | **Occupied** (Engineer Out) |
  | No | State | No | Yes | **Occupied** (Trained Elicitation) |
  | No | State | No | No | **Unreachable** (Naive Realism) |
  | Yes | Behavior | No | Yes | **Empty** (Contradictory) |
  | No | Behavior | X | X | **Empty** (Contradictory) |
  | *Other combinations* | *...* | *...* | *...* | **Empty/Unreachable** |

  ***

  ### 2. Decision Tree

  **Start:** You have a sincere, confident first-person report that the subject's own forced-choice performance contradicts.

  **Node 1:** Can a sincere subject be wrong about whether an experience occurred?
  *   **Yes** → Go to Node 2.
  *   **No** → Go to Node 5.

  **Node 2:** Is the report simply verbal behavior with no further question to ask?
  *   **Yes** → **Leaf 1: Report is Simply Behavior.**
      *   *Monday:* Drop interviews; code speech as motor output alongside keypresses.
  *   **No** → Go to Node 3.

  **Node 3:** Is the report the output of a detection mechanism that can misfire?
  *   **Yes** → **Leaf 2: Higher-Order Judgement.**
      *   *Monday:* Add meta-cognitive confidence ratings to track mechanism misfires.
  *   **No** → Go to Node 4.

  **Node 4:** Do we treat the existence of experience as an open empirical question?
  *   **Yes** → **Leaf 3: Suspend Belief.**
      *   *Monday:* Record reports but mark existence as unknown variable in analysis.
  *   **No** → **Leaf 4: Nothing Behind Them.**
      *   *Monday:* Treat reports as noise; focus solely on neural correlates.
      *   **FLAG:** Leaf 3 and Leaf 4 are empirically indistinguishable in this paradigm; separation is purely theoretical.

  **Node 5:** Is the subject capable of verbal report (e.g., not a macaque/infant)?
  *   **No** → Go to Node 6.
  *   **Yes** → Go to Node 6.
      *(Note: This node ensures the "non-verbal subject" split is processed without creating a new leaf.)*

  **Node 6:** Should we engineer verbal reports out of the paradigm wherever possible?
  *   **Yes** → **Leaf 5: Engineer Out.**
      *   *Monday:* Replace verbal report with pupillometry or reaction time measures.
  *   **No** → Go to Node 7.

  **Node 7:** Is the report evidence about the world/experience or the subject's take on it?
  *   **World** → **Leaf 6: Trained Elicitation.**
      *   *Monday:* Implement micro-phenomenological interviewing protocol.
  *   **Take** → **Leaf 7: [UNNAMED LEAF].**
      *   *Diagnosis:* **Empty/Incoherent.** If the subject cannot be wrong (Node 1=No), their "take" constitutes the experience; distinguishing them creates a position no one holds.
      *   *Monday:* (N/A) — Do not design for this position.

  ***

  **Indistinguishability Note:** The tree cannot cleanly separate **Suspend Belief**, **Nothing Behind Them**, and **Higher-Order Judgement** using behavioral data alone. All three predict the same dissociation between report and performance. Separation requires committing to a theoretical stance on consciousness prior to data collection.
