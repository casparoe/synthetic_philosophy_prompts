  Your instinct is correct, and your friend's dismissal of the phenomenon as a mere "legal fiction" misses the substantive architectural shift occurring in this configuration. You are describing a specific mechanism of **Transitional Justice**, most famously instantiated by the **South African Truth and Reconciliation Commission (TRC)** under the Promotion of National Unity and Reconciliation Act (1995).

  The phenomenon you have isolated is not a standard legal fiction. A legal fiction (e.g., "corporate personhood") asks the law to treat a falsehood as true to achieve a functional end. What you are describing is the opposite: the law treats a **verified truth as legally inert**. This is not a fiction; it is a **substantive extinguishment of liability** conditioned on **epistemic closure**.

  Here is the carving of the concept, distinguishing it from its neighbors:

  1.  **Vs. Witness Immunity (Use/Transaction Immunity):**
      *   *Immunity:* Protects the witness from self-incrimination so their testimony can be used to prosecute *others*. It is an **evidentiary bar** (the statement cannot be entered as evidence). The underlying crime remains prosecutable if evidence is found elsewhere.
      *   *Your Case:* The protection is for the *perpetrator* regarding their *own* acts. It is a **substantive bar** (the act is deemed not to be an offense). No prosecution is possible, even with independent evidence, because the liability itself is extinguished, not just the evidence.

  2.  **Vs. Blanket Amnesty:**
      *   *Blanket Amnesty:* Granted legislatively to a class of persons (e.g., "all combatants") without individual review. It often requires no disclosure and produces no official record of specific crimes. It prioritizes peace over truth.
      *   *Your Case:* Granted **individually** only after a quasi-judicial body verifies the account. It prioritizes truth *as the price* of peace. It produces an authoritative public record rather than a silence.

  3.  **Vs. Pardon:**
      *   *Pardon:* Occurs **after** conviction and liability have been established. It forgives the penalty but usually acknowledges the guilt.
      *   *Your Case:* Occurs **before** liability attaches. It prevents the legal status of "criminal" from ever crystallizing.

  4.  **Vs. Expungement/Sealing:**
      *   *Expungement:* Hides or destroys the record of the crime to allow reintegration. It creates a legal silence.
      *   *Your Case:* **Publishes** the record. The state mandates public disclosure. The record is permanent and authoritative; only the *remedy* is removed.

  5.  **Vs. Legal Fiction:**
      *   *Fiction:* Treats $X$ as true when $X$ is false (or vice versa).
      *   *Your Case:* Treats $X$ (the crime) as **true**, but declares $Y$ (liability) as **null**. The truth is the *cause* of the nullification, not the object of the fiction.

  **The Concept:**
  In the literature of transitional justice (e.g., the works of Ruti Teitel, Martha Minow, and Antje Du Bois-Pedain), this mechanism is distinguished from general amnesty by its requirement of individual disclosure. While "Conditional Amnesty" is the broad genus, the specific configuration where the *truth-telling itself* is the condition that triggers the *extinguishment of liability* is best termed **Truth-Conditional Amnesty**.

  This term captures the two poles you identified:
  1.  **Truth-Conditional:** The state incurs the cost of verifying the narrative (the Commission's work). The amnesty is not automatic; it is earned by the quality of the disclosure.
  2.  **Amnesty:** The legal consequence is the nullification of liability (criminal and civil).

  **Boundary Cases:**
  *   *Amnesty without disclosure:* **Not an instance.** (Fails the "Truth-Conditional" requirement; this is Blanket Amnesty).
  *   *Commission report where perpetrators are prosecuted:* **Not an instance.** (Fails the "Amnesty" requirement; this is Truth-and-Justice).
  *   *Conviction later sealed:* **Not an instance.** (Order of operations is reversed; liability attached *before* nullification. This is Expungement/Pardon).
  *   *Witness immunity:* **Not an instance.** (Evidentiary bar vs. Substantive bar).

  **Conclusion:**
  Your friend is incorrect that this is a "procedural bargain" of the usual sort. Standard bargains (plea deals) result in *reduced* liability or *admissible* evidence. This configuration results in **validated impunity**: the state spends resources to certify the crime occurred precisely so it can legally declare that no crime exists for the purpose of punishment. It is a sovereign act of trading retributive justice for historical record. The established term in transitional justice literature that carves out this specific mechanism, distinguishing it from blanket amnesty and witness immunity, is **Truth-Conditional Amnesty**.

  \answer{Truth-Conditional Amnesty}
