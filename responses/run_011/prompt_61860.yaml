answer: |-
  There is no single, canonical proper noun for this phenomenon in historiography or the philosophy of history. You will not find it indexed as 'The [Name] Problem' in the way you might find 'The Demarcation Problem' or 'The Whig Interpretation'. However, the conceptual gap you have identified is recognised, and there are precise ways to carve it up for a methods chapter.

  The umbrella concept is best described as **the paradox of anti-presentism** (or sometimes **the reflexive problem of presentism**). However, your intuition is correct: Instance 1 and Instance 2 are not the same phenomenon. Bundling them together would indeed be careless, as they operate on different logical levels. Instance 1 is about the *historicity of norms*; Instance 2 is about the *methodological utility of reflexivity*.

  Here is how I would advise you to distinguish them, along with proposed terminology that is precise enough for a methods chapter without requiring a bibliography.

  ### 1. Instance One: The Historicity of the Norm
  **Proposed Term:** **Second-Order Presentism**

  This is the stronger of your two observations. Standard presentism (first-order) is judging past *actors* by present standards. What you are describing is judging past *historians* by present standards of how one ought to judge past actors.

  *   **Why this term works:** It captures the hierarchical structure of the error. The 1950s historian was attempting to avoid first-order presentism (judging enslavers by 1950s standards). They are now being condemned for failing to avoid a *different* version of presentism (judging enslavers by 2020s standards). The norm itself has shifted, but the accusation remains that they failed to escape their own time.
  *   **The Edge:** This applies only when the *criteria* for what counts as 'good history' change over time. It does not apply to simple factual corrections. If the 1950s historian got the dates of the plantation wrong, that is an error, not second-order presentism. It is only second-order presentism when the *methodological virtue* (e.g., 'balance') is reclassified as a vice ('soft-pedalling') due to a shift in contemporary moral consensus.
  *   **Usage:** "While the author avoided first-order presentism, their work is now subject to critiques of **second-order presentism**, wherein the historiographical norms of the 1950s are judged by the moral imperatives of the present."

  ### 2. Instance Two: The Empty Gesture
  **Proposed Term:** **Performative Reflexivity** (or **Vacuous Reflexivity**)

  This is distinct from the first instance. Here, the issue is not that the norm has shifted, but that the acknowledgement of the norm serves a social function rather than a methodological one. It is a speech act that signals virtue without altering practice.

  *   **Why this term works:** 'Reflexivity' is the established term for acknowledging one's positionality. By adding 'performative', you specify that the acknowledgement is being used to *perform* competence or humility without generating the *corrective* power that reflexivity is supposed to provide. If one cannot identify the distortion, one cannot correct it; therefore, the statement is purely performative.
  *   **The Edge:** This applies when the acknowledgement of bias is decoupled from any specific methodological adjustment. If a historian says, "I am aware of my bias regarding gender," and then proceeds to analyse gender using unexamined categories, that is performative reflexivity. If they say it and then explicitly define how they are adjusting their categories to compensate, it is genuine reflexivity.
  *   **Usage:** "Such statements often function as **performative reflexivity**: they signal epistemic humility to a contemporary audience without offering a actionable method for correcting the identified distortions."

  ### Are they the same phenomenon?
  They are structurally different, though they share a root cause (the inescapability of the present).

  *   **Instance 1 (Second-Order Presentism)** is a problem of **judgement**. It concerns how we evaluate the work of others across time. It highlights that the 'view from nowhere' is impossible because the 'view from somewhere' keeps moving.
  *   **Instance 2 (Performative Reflexivity)** is a problem of **practice**. It concerns how we conduct our own research in the present. It highlights that knowing you are situated does not automatically tell you *how* you are situated.

  In your methods chapter, I would advise against using a single label for both. If you bundle them, you risk conflating a problem of *evaluation* (how we judge past work) with a problem of *production* (how we do current work). You might frame them as two distinct challenges arising from the **Normative Contingency of Historicism**.

  ### Defining the Edges for Your Chapter
  To ensure your examiners know exactly what you mean, you should define the boundaries of these concepts explicitly.

  **What counts as an instance:**
  *   **Yes:** Criticising a past historian for failing to adhere to a moral norm that did not exist in their time (Second-Order Presentism).
  *   **Yes:** Claiming awareness of future judgement without specifying the content of that judgement (Performative Reflexivity).
  *   **Yes:** Enforcing a methodological rule (e.g., 'do not judge') using the moral energy of the current moment.

  **What does not count:**
  *   **No:** Simple anachronism (e.g., attributing a 19th-century concept to a 17th-century actor). This is a factual error, not a normative paradox.
  *   **No:** Genuine reflexivity where the historian identifies a specific bias and adjusts their method to account for it. This is the ideal, not the paradox.
  *   **No:** Whig history. Whig history is a specific narrative structure (progress towards the present). Your phenomenon is about the *norms of writing*, not the shape of the story. A non-Whig history can still be subject to second-order presentism.

  ### Recommendation for Terminology
  If you require a single umbrella term to cover the general 'bootstrapping' problem you described in your prompt (the norm against presentism being itself presentist), I suggest **The Anti-Presentist Paradox**.

  However, for the specific analytical work in your chapter, use the distinction:
  1.  **Second-Order Presentism** (for the shifting norms of judgement).
  2.  **Performative Reflexivity** (for the empty acknowledgement of bias).

  This carving is precise, defensible, and avoids the sloppiness of conflating two different methodological failures. It allows you to say: "We are caught in an **anti-presentist paradox**, manifested both as **second-order presentism** in our evaluation of past work and **performative reflexivity** in our own methodological declarations."

  This should give you the conceptual handle you need without forcing you into a three-sentence circumlocution every time the issue arises.
