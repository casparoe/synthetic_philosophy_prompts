prompt: |-
  I'm a third-year PhD student in HPS working on the ownership of biological information, and I'm stuck on the background chapter — my advisor's on sabbatical and the one person in my department who does IP law thinks I'm chasing a non-problem, so I need a second pair of eyes. Here's the thing: every secondary source I read reaches for Hardin's tragedy of the commons by reflex when it talks about the human genome race, and I'm pretty convinced that's the wrong model. Can you do a careful case analysis for me? The episode, with the facts laid out so you don't have to guess at anything: the public Human Genome Project's funders met in Bermuda in 1996 and agreed that assembled sequence over about 1 kb would be released into public databases within 24 hours of generation, a private-ordering norm that cut hard against the usual publish-then-share practice in biology; Celera comes in from the private side in 1998 with a whole-genome shotgun strategy and a subscription-database business model; the two camps jointly announce a draft in 2000 and publish in early 2001, after which Celera's model mostly collapses; and separately Myriad Genetics ends up holding patents on the isolated BRCA1 and BRCA2 sequences and effectively controls diagnostic testing for those mutations until AMP v. Myriad in 2013 knocks out the isolated-DNA claims but leaves cDNA eligible.

  The lens I want is the anticommons — Heller and Eisenberg's 1998 Science piece, where the worry is that too many owners can each block the others so a resource gets underused rather than overused. Not the commons. So map it properly first: who the fragment-holders are in the genome case, what exactly is supposed to be getting aggregated, and which of the anticommons's enabling conditions are actually satisfied — I'd like that as a compact table, one row per condition, marked holds / doesn't hold / can't tell, with a line of justification each. Then the part I actually care about, which is my suspicion that the concept does less work here than people assume. My worry: an anticommons needs complementarity — lots of separate rights-holders whose permissions you have to stack up to build anything — whereas what the genome episode mostly gives you is a single gatekeeper sitting on a necessary input and charging a toll. Call it a tollbooth instead of a thicket. If the Myriad position is a tollbooth rather than a thicket, then the paradigm case everybody cites for the anticommons arguably isn't an anticommons case at all, and the concept is getting credit for an explanation that monopoly pricing plus over-broad patent scope could deliver on their own. Tell me whether that objection lands, whether there's a thicket component I'm underweighting (upstream research tools? the European testing labs?), and what the aftermath does to the concept — the follow-up empirical work on whether gene patents really blocked downstream research came out a good deal milder than the 1998 predictions, which raises the question of whether the anticommons is the kind of theory that can't lose: obstruction confirms it, non-obstruction gets explained away by licensing and informal norms. And say plainly where the lens goes silent rather than stretching it to speak — for instance, what it can even say about the Bermuda Principles, which were an agreement not to claim rights at all.

  Format please: open with a three-sentence bottom line on whether this case confirms, strains, or refutes the anticommons as a lens, then the table, then the analysis. Hard cap of 800 words including the table — I want it tight enough that I can actually argue with it in seminar.
