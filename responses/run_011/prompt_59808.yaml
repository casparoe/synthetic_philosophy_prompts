answer: |-
  You are right to suspect that the endless cycling of arguments about Malthus or the Club of Rome stems from a lack of shared specification rather than a lack of data. If we are to build a public ledger that rules on civilizational claims in real time and adjudicates whether action was warranted, we cannot rely on the retrospective comfort of historians. We need a protocol that functions like a contract. To that end, I propose a set of desiderata that any account of empirical testing must satisfy to run this ledger, distinguishing between what is essential for the ledger to function and what is merely a philosophical preference.

  The first requirement is operational clarity, and I designate this as non-negotiable. A claim must define its target variable in terms that a non-specialist can verify without accessing the forecaster's private models or proprietary data. If a forecast says resources will become scarce, it must specify whether scarcity is measured by price, extraction energy, reserve-to-production ratios, or physical availability, and it must fix the units and the source of the data before the outcome is known. This is the single requirement that excludes the most candidate accounts, because the vast majority of long-horizon prophecy relies on qualitative vibes or shifting definitions of crisis that cannot be pinned down until after the fact. Without this, the ledger cannot rule. The second requirement is temporal binding, also non-negotiable. A forecast must specify a window of time during which the predicted state is expected to obtain. A claim that something will happen eventually is thermodynamically trivial and operationally useless for deciding whether to act now. The third requirement is baseline outperformance, which I also mark as non-negotiable. A forecast must demonstrate that it predicts the variable better than a null model, such as a random walk or simple persistence of current trends over the same horizon. If a complex model of population collapse performs no better than assuming population grows at yesterday's rate, it offers no informational value to warrant the cost of action.

  Beyond these hard constraints, there are preferences that different camps will argue over. Mechanism realism is a local preference of the scientific realist camp, not a non-negotiable requirement for the ledger. The ledger's primary job is to track outcomes to determine warranted action, not to award prizes for theoretical elegance. If a black-box model predicts food prices accurately without explaining why, it warrants hedging action just as well as a model grounded in soil chemistry. However, for the second verdict regarding whether action was warranted before the ruling, mechanism transparency becomes highly relevant, because understanding the causal lever helps determine if the action taken was the correct response to the threat. Similarly, the demand that any auxiliary hypothesis be independently novel is a preference of strict falsificationism. The ledger should allow model updates, but it must tag them as post-hoc adjustments rather than original predictions, discounting their weight in the scoring of the forecaster's reliability.

  You asked specifically about the tension between displacing a deadline and refining a mechanism. Your intuition that extending the date is more evasive than changing the model is correct, and the reason lies in the purpose of the ledger. The ledger exists to guide action in the present. Changing the mechanism explains why the previous expectation failed and offers a new map for navigation, which retains some utility. Moving the deadline merely asks for more time without explaining why the initial urgency was misplaced, which directly undermines the warrant for any immediate action taken on the original claim. Therefore, the ledger should treat deadline displacement as a disconfirmation of the original claim, even if the mechanism survives. Regarding the null forecaster, the account must require a forecast to beat it. Over fifty years, inertia is a powerful predictor, and claiming victory because you predicted continuity is a fraud on the public purse. The operationalization of the target variable must be validated independently of the outcome. The metals wager controversy proves that if you allow the forecaster to define the metric after seeing the price data, they will always find a proxy that makes them look right. The definition must be locked before the clock starts.

  On the question of reference classes, the account needs a clause on constructing them because there is only one Earth history. Legitimately leaning on within-history subsamples is necessary; we must treat other countries, other resources, and other epochs as the replication set. If a model claims to predict demographic transition, it must be tested against every nation's transition, not just the global aggregate. Finally, a claim that must come true eventually for arithmetical or thermodynamic reasons has no content for the ledger unless it specifies the rate and the cost. Saying a finite stock will run out is empty; saying it will run out at a price that causes civilizational disruption by a specific date is a testable claim. The ledger should treat the former as true but empty, granting no credit, and score only the latter.

  There is, however, a subset of requirements that is jointly unsatisfiable given the structure of long-horizon prediction. The demand for a real-time ruling on whether action was warranted conflicts with the demand for empirical verification of the outcome. You cannot know if action was warranted until you know the outcome, but the ledger must issue the verdict on warranted action before the outcome is fully resolved to be useful. This creates a paradox where the ledger must guess at the counterfactual world where no action was taken. We can mitigate this by requiring forecasters to specify the cost of inaction, but we cannot resolve it completely. The ledger will always have a lag between the action verdict and the truth verdict.

  Let us test this list on your two disputes. In the case of the agronomist in 1908, the ledger rules that the claim was disconfirmed in 1960. The temporal binding requirement dictates that missing the window is a failure, regardless of the mechanism surviving. The fact that it happened in 2030 at a third of the rate is a new claim, not a vindication of the old one. The action taken in 1908 based on the 1960 deadline was not warranted according to the ledger, because the operational definition of the crisis included the date. In the second case of the 1975 protein shortfall, the ledger rules the forecast disconfirmed. The failure was due to supply elasticity, which was not modeled. The successors publishing a version with an explicit elasticity term that fits the data from 1975 to the present is a post-hoc adjustment. Under the preference against non-novel auxiliary hypotheses, this update is marked as a degenerating shift in the research programme. It explains the past but earns no credit for the future until it predicts new data. The original claim failed the baseline outperformance test because it did not anticipate the substitution effect that a null model of market adaptation might have caught.

  Now consider how the obvious approaches fare against this list. Naive falsificationism fails because it treats the 1908 agronomist as simply wrong and discards the mechanism, losing the signal that arrives in 2030. It is too brittle for long horizons where timing is uncertain. Research-programme methodology with its progressive-versus-degenerating distinction is too forgiving; it allows the protein forecasters to claim they are still progressive because they adjusted the theory, even though they missed the event they were paid to predict. Bayesian scoring by proper rules over time is theoretically sound but practically impossible for a public ledger because it requires agreed-upon priors that non-specialists cannot check, violating the operational clarity requirement. A strict pre-registration view under which anything added after the fact is inadmissible is the closest fit, but it risks stifling learning. It handles the 1908 case well but might discard the 2030 insight too harshly.

  This brings us to whether right but early can ever be a legitimate verdict. It can, but only if the forecast includes a probability distribution over time rather than a single date, and if the mechanism implies inevitability rather than contingency. For right but early to be available, the forecaster must specify in advance that the event is a threshold crossing that could happen anytime after a certain date, and the ledger must score the calibration of that probability distribution. If the forecaster says exactly 1960 and means 1960, then being right in 2030 is being wrong. If they say post-1950 with increasing probability, then early action can be warranted.

  Finally, I must apply this list to itself. The requirement my account most clearly fails is operational clarity regarding its own success. I have specified how the ledger should work, but I have not defined the metric by which we will judge whether this ledger actually improves civilizational decision-making over a century. I have not specified the null model against which the utility of this ledger should be tested, nor have I bound the time by which we should expect to see evidence that this specification reduces wasted action. I am making a long-horizon claim about forecasting itself without satisfying the temporal binding or baseline outperformance requirements I just demanded of others. I am asking you to trust the mechanism without a verified track record, which is precisely the behavior the ledger is designed to scrutinize.
