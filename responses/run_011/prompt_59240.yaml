answer: |-
  **MEMORANDUM**

  **TO:** National Research Funder Board of Directors
  **FROM:** Animal-Welfare Standards Panel
  **DATE:** October 26, 2023
  **SUBJECT:** Decision on Petition to Replace Encephalization Quotient (EQ) with Absolute Pallial Neuron Count (APNC)

  **DECISION**

  The Panel recommends **Adoption in Modified Form**.

  We accept the petition's central scientific premise that Encephalization Quotient (EQ) is an insufficient metric for neurocognitive complexity, particularly regarding avian species. However, we cannot adopt Absolute Pallial Neuron Count (APNC) as a sole, universal determinant. Instead, the Panel will transition to a **Composite Neurocognitive Index (CNI)**. This index will prioritize APNC for vertebrates but retain behavioral evidence as a binding override and establish a separate assessment protocol for invertebrates with distributed nervous systems.

  **SCIENTIFIC RATIONALE**

  The petition correctly identifies that EQ is an allometric artifact. By measuring brain mass relative to expected body mass, EQ inherently biases against small-bodied animals. The work of Herculano-Houzel and colleagues demonstrates that avian pallial neurons are packed at densities significantly higher than in mammals. A crow, for instance, possesses a pallial neuron count comparable to a macaque, despite a fraction of the brain mass.

  Continuing to use EQ would require us to ignore convergent evolution evidence showing corvids and parrots possess episodic-like memory, metacognition, and tool manufacture capabilities equivalent to Tier 1 mammals. To maintain scientific integrity, our metric must reflect computational capacity rather than gross mass.

  However, we reject the proposal to make APNC the *exclusive* metric. Neuron count is a measure of hardware capacity, not software architecture. While we are moving away from EQ, we must acknowledge that APNC is also a proxy, not a direct measure of moral relevance.

  **PROXY VS. SILENCE: WHAT NEURON COUNTS TELL US**

  In adopting APNC as a primary variable, we must be explicit about what this metric proxies and where it remains silent:

  *   **What APNC Proxies:** Raw information processing capacity, potential for behavioral flexibility, and memory storage density. It correlates well with the ability to model complex environments and inhibit impulses.
  *   **What APNC is Silent On:**
      1.  **Connectivity:** A billion neurons with low interconnectivity may process less integrated information than five hundred million highly interconnected neurons.
      2.  **Neurochemistry:** Neuron count does not measure the density of nociceptors or the specific opioid/dopaminergic pathways that modulate the *affective* component of pain (suffering vs. mere detection).
      3.  **Architecture:** It cannot account for distributed processing. As the petition notes, cephalopods possess significant neural tissue in arm ganglia. An APNC metric focused on the central brain would erroneously classify an octopus as neurocognitively simple, contradicting evidence of their problem-solving and pain avoidance.

  **TIER ASSIGNMENT IMPLICATIONS**

  Under the Composite Neurocognitive Index, the following changes will take effect following a 12-month transition period:

  1.  **Promotions (Tier 2 to Tier 1):** All Corvidae (crows, ravens, jays) and Psittaciformes (parrots, cockatoos) will move to Tier 1. They will now require environmental enrichment standards equivalent to great apes and cetaceans, and distress in harm-benefit analyses will be weighted at parity with human equivalent distress.
  2.  **Reclassifications (Tier 1 to Tier 2):** Large-bodied ungulates (e.g., cattle, horses) previously elevated by EQ due to massive body size requirements will be reviewed. While their absolute neuron counts remain high, they will no longer receive automatic Tier 1 status based solely on mass. They will likely settle in Tier 2 unless behavioral evidence supports elevation.
  3.  **Cephalopod Protocol:** Cephalopods will remain unclassifiable under the CNI. They will be moved to a "Special Assessment" category requiring individualized neuro-behavioral review for all protocols, acknowledging that neither EQ nor APNC captures their distributed cognition.

  **IMPLEMENTATION MODIFICATIONS**

  To mitigate the risks of swapping one proxy for another, the adoption is modified as follows:
  *   **Behavioral Override:** If a species demonstrates validated evidence of complex cognition (e.g., self-recognition, future planning) that contradicts its APNC tier, the behavioral evidence supersedes the count.
  *   **Uncertainty Buffer:** In cases where neuron counts are estimated rather than counted, species will be assigned to the higher tier to adhere to the precautionary principle.

  **CLOSING CONSIDERATION**

  The strongest consideration on the side I recommend against—**retaining the Status Quo (EQ)**—is the argument for **Regulatory Stability and the Uncertainty of Suffering Correlates**.

  There is a compelling case that swapping metrics introduces significant administrative burden and uncertainty for researchers without guaranteeing a reduction in animal suffering. EQ, for all its flaws, has two decades of longitudinal data linking it to welfare outcomes in a regulatory context. Furthermore, the petition assumes that *cognitive complexity* is the correct moral currency for welfare. It is possible that the capacity for *suffering* (sentience) is more widely distributed and less dependent on pallial neuron density than the capacity for *tool use*. If it turns out that affective experience correlates more strongly with subcortical structures (which birds and mammals share) than pallial counts, then elevating birds based on APNC may be scientifically impressive but morally neutral, while the administrative churn delays actual welfare improvements.

  For the Status Quo to prevail, the following would have to be true: That the administrative cost of re-baselining thousands of approved protocols outweighs the moral benefit of reclassifying avian species, or that future research demonstrates pallial neuron count has no stronger correlation with subjective suffering than brain-mass allometry. Until that is proven, the scientific evidence necessitates this change.
