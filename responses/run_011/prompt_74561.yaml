answer: |-
  **Examiner's Preliminary Sketch (Internal)**
  *Competent Readings:* A textualist might argue "helipad" denotes physical infrastructure (Guilty) or functional status (Not Guilty). A purposivist might argue no patients means no mischief (Not Guilty) or that protecting the facility's readiness is part of the purpose (Guilty).
  *Dead Ends:* A strong answer must refuse the claim that textualism ignores context (it uses semantic context) or that purposivism ignores text (it uses text to find purpose). It must also refuse the idea that the amendment *proves* the original meaning without analyzing the fixed-meaning thesis.
  *Key Distinction:* The A answer recognizes that theories are toolkits, not verdict machines, and that the amendment raises a meta-theoretical question about time and meaning, not just legislative intent.

  ***

  **(i) PRACTICE FINAL EXAMINATION**

  **Course:** Statutory Interpretation Seminar
  **Time Allowed:** 75 Minutes
  **Total Marks:** 25

  **Question 1**

  The **Riverton Drone Safety Act**, section 4, provides:
  >(1) A person must not operate an unmanned aircraft within 200 metres of a hospital helipad.
  >(2) Subsection (1) does not apply to an aircraft operated by, or under contract to, an emergency medical service.
  >(3) A person who contravenes subsection (1) commits an offence punishable by a fine of up to $5,000.

  The Act's preamble recites that its object is "to protect patients carried to and from hospital by air, and the crews who carry them, from the risks posed by unmanned aircraft."

  **Facts:** Three months before the incident, the helipad at Riverton General was closed for resurfacing; no aircraft landed on or departed from it during that period, and the hospital diverted air ambulances to a neighbouring airfield. The defendant flew a camera drone 150 metres from the centre of the pad for six minutes, filming the closed surface for a story about deferred hospital maintenance. No air ambulance was within two kilometres. He is charged under subsection (1).

  **(a)** Decide the case twice. First, argue the outcome as a committed textualist. Second, argue the outcome as a committed purposivist. In each analysis, you must demonstrate how that theory's internal resources (e.g., semantic context, structure, bright-line drafting, absurdity safety valve; or level-of-generality, mischief, protected interests) cut both ways rather than supporting only one verdict. (15 marks)

  **(b)** Suppose the legislature, learning of the prosecution, amends subsection (1) by inserting "(including a helipad that is temporarily out of service)" after "hospital helipad." Does this amendment establish what the original text always meant, or does it change what the text means? What does your answer imply for the claim that statutory meaning is fixed at enactment? (10 marks)

  ***

  **(ii) MODEL ANSWER**

  **Part (a)**
  A committed textualist focuses on the public meaning of the words at the time of enactment. Conviction rests on the ordinary semantic meaning of "hospital helipad." A helipad is a physical structure designated for helicopter use; its temporary closure for maintenance does not alter its identity as a helipad, just as a closed road remains a road. The 200-metre zone is a bright-line rule providing certainty. The exemption in subsection (2) for emergency services implies that all other operators are excluded regardless of active medical traffic; if activity were required, the exemption would be redundant.

  However, textualism also resources acquittal. Semantic context suggests "helipad" is a functional term, not merely concrete. If a pad is permanently decommissioned, it ceases to be a helipad; temporary closure creates ambiguity about whether the function is suspended. Furthermore, the absurdity safety valve might apply: penalizing conduct that poses no physical risk of collision because the pad is empty violates the implicit assumption that prohibitions target harmful interference. A textualist might argue the text presupposes a functioning facility.

  A committed purposivist looks to the preamble: protecting patients and crews from risk. Acquittal is the natural outcome. No patients or crews were present; air ambulances were diverted. The mischief—collision risk during medical transport—was absent. Convicting the defendant does not advance the specific purpose stated and punishes harmless conduct.

  Yet purposivism can support conviction. The purpose must be stated at the correct level of generality. If the object is to ensure the *availability* of safe air corridors, protecting the infrastructure during maintenance ensures future safety. Additionally, the preamble protects "crews." Maintenance crews working on the pad could be distracted or endangered by drones, falling within the protective spirit even if not explicitly named. Thus, purposivism requires choosing between a narrow reading (active transport only) and a broad reading (infrastructure readiness), neither of which is dictated solely by the purpose clause.

  **Part (b)**
  The amendment creates a presumption of change. If the original text clearly included temporarily out-of-service pads, the amendment would be superfluous. Its enactment suggests the legislature believed the original text was ambiguous or excluded such pads. Therefore, the amendment likely changes the legal meaning rather than clarifying it.

  This challenges the claim that statutory meaning is fixed at enactment. If meaning were fixed and objective, the legislature could not alter it, only restate it. By amending, the legislature acknowledges that the text's application evolves or was previously unsettled. However, a fixed-meaning theorist might argue the amendment merely corrects a judicial error in applying the original fixed meaning. Ultimately, the amendment suggests that statutory meaning is not purely historical but involves a ongoing dialogue between text and legislative will, weakening the strict fixed-meaning thesis.

  ***

  **(iii) MARKING SCHEME**

  1.  **Textualist Case for Liability (5 marks):** Identifies ordinary meaning of "helipad" as physical structure and uses subsection (2) structure to argue strict liability.
      *   *Common Error:* Treating textualism as ignoring context rather than semantic context.
  2.  **Textualist Case for Acquittal (5 marks):** Utilizes functional definition of "helipad" or the absurdity safety valve to argue text presupposes activity.
      *   *Common Error:* Dismissing functional arguments as purely purposive rather than semantic.
  3.  **Purposivist Case for Acquittal (5 marks):** Aligns verdict with specific preamble beneficiaries (patients/crews) and absence of actual risk.
      *   *Common Error:* Assuming purpose automatically overrides text without analyzing the level of generality.
  4.  **Purposivist Case for Liability (5 marks):** Argues purpose includes infrastructure readiness or safety of maintenance crews to show purpose cuts both ways.
      *   *Common Error:* Ignoring the specific preamble limitations to invent a broader safety purpose.
  5.  **Amendment & Fixed Meaning (5 marks):** Analyzes whether amendment clarifies or changes law and links this to the fixed-meaning thesis.
      *   *Common Error:* Equating legislative intent with semantic meaning without addressing the temporal implication.

  ***

  **(iv) EXAMINER'S COMMENTARY**

  The distinction between an A and a B answer lies in the handling of theoretical tension. A B answer will treat textualism and purposivism as verdict machines that inevitably point to opposite outcomes (e.g., Textualist = Guilty, Purposivist = Not Guilty). An A answer will demonstrate that each theory contains internal conflicts—showing, for instance, that a textualist might acquit based on semantic functionalism, or a purposivist might convict based on infrastructure readiness. Furthermore, an A answer will recognize in Part (b) that the amendment does not merely solve the case but destabilizes the ontology of statutory meaning, whereas a B answer will treat the amendment as simply fixing a mistake without philosophical consequence. The A candidate understands that convergence on a verdict does not prove convergence on method.
