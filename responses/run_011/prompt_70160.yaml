answer: |-
  **The map**
  Andrei Amalrik (1970) predicted collapse by 1984 via internal decay or war with China. Hélène Carrère d'Encausse (1978, *The Broken Empire*) forecast dissolution along national lines, citing demographic shifts in Muslim republics. Emmanuel Todd (1976) argued from literacy and endogamy rates. Conversely, Stephen Cohen and most CIA analysts (early 80s) assessed the system as stable, citing institutional cohesion. The miss condition for the "winners" was USSR integrity past 1991; for the "losers," any sign of systemic fragmentation before 1990. Your facts are largely sound: Carrère d'Encausse was the historian focusing on demography; Todd is the demographer/anthropologist. The CIA's failure is documented by agency historians. The key variance is mechanism: economy (stagnation), nationality (demography), or legitimacy (ideological exhaustion).

  **What Popper's arguments predict about the case**
  Popper argues history has no laws, only trends contingent on initial conditions. He would predict the CIA's failure because they treated structural trends (centralization) as immutable laws of stability. They ignored that trends can reverse. Popper's "growth of knowledge" argument specifically predicts the unpredictability of Gorbachev's *perestroika*. Since future knowledge cannot be known today, policies based on new knowledge (like "New Thinking") cannot be forecast. Popper expects large-scale prophecy to fail. He would view the "winners" skeptically: if they claimed inevitability, they were historicists who got lucky on the outcome but missed the contingent path. He predicts that any successful prediction must be conditional (e.g., "if repression lifts, nationalism rises"), not unconditional. The case should show that structural constraints exist but do not determine specific trajectories.

  **Where the theory bites**
  Popper's distinction between laws and trends sorts the proposed mechanisms cleanly. "Centrally planned economies stagnate" is a trend, not a law; it was disconfirmable by the 1930s industrial boom or 1970s oil spikes. "Multi-ethnic empires dissolve once repression stops" is a conditional prediction; it would be falsified if a post-Stalin leader liberalized without dissolution (e.g., if Gorbachev had succeeded). "Regimes losing legitimacy collapse" is nearly truistic; legitimacy is often inferred from the collapse itself, making it hard to falsify independently. The disagreement on mechanism (economy vs. demography) supports Popper: if a universal law operated, the mechanism should be unique. Multiple paths to the same outcome suggest contingency, not law. The "winners" identified robust trends, but Popper is vindicated because none predicted the *process* (reform leading to collapse), only the terminal state.

  **Where it misses or misdescribes**
  Popper underestimates the predictive power of structural constraints. While he rightly says knowledge growth alters history, he offers no method to distinguish fragile trends from robust ones. Carrère d'Encausse's demographic trend was robust enough to predict collapse over a decade, challenging Popper's blanket ban on large-scale forecasting. Furthermore, Popper's "human factor" is descriptive, not predictive. He notes agents matter but doesn't explain why Gorbachev's specific choices (no force in 1989) occurred rather than a Tiananmen-style crackdown. Popper assumes "piecemeal engineering" is the alternative to historicism, but the Soviet collapse was not engineered; it was a systemic failure managed improvisationally. His framework explains why the CIA failed but struggles to explain why the outsiders succeeded without falling into historicism themselves.

  **Retrospective lawlikeness**
  This is a genuine failure mode, not good social science. Converting surprise into inevitability masks the contingency Popper highlights. If Gorbachev had ordered tanks into Warsaw in 1989, the "law" of imperial dissolution would have been broken, yet retrospectively, analysts would claim the pressure was simply too high. This supports Popper: the "law" is constructed *ex post* to fit the data. It cuts *for* Popper because it demonstrates the historicist temptation—seeing rails where there were only switches. Good social science admits the counterfactual: the USSR *could* have survived with different initial conditions (e.g., higher oil prices, a harder leader). Retrospective determinism hides these variables, validating Popper's warning against treating trends as laws.

  **Bottom line**
  1991 confirms Popper. The experts failed because they treated trends as laws (historicism). The outsiders succeeded on outcomes but missed the causal path, which depended on unpredictable knowledge growth (Gorbachev's ideas). The multiplicity of mechanisms (economy, demography, ideology) proves there was no single "law of history" driving the event, only converging trends. Popper's core claim—that the future depends on knowledge we cannot yet possess—holds: no one predicted the *method* of collapse (reform-induced), only the vulnerability. The case validates his critique of long-term prophecy while showing trends can be identified if not reified.

  **What would change your mind**
  If declassified records showed the CIA accurately predicted the collapse internally but policymakers suppressed it, my verdict shifts: the failure was political, not epistemological, weakening Popper's critique of the discipline. I may have erred by accepting the "professional consensus" as genuine intellectual failure rather than institutional bias. Additionally, if a mathematical model could demonstrate that demographic shifts *necessitate* imperial collapse regardless of leadership choices, Popper's ban on historical laws would be falsified. My reasoning leans heavily on the assumption that the outsiders' success was trend-spotting rather than law-discovery; if their mechanisms prove universal, Popper is wrong.
