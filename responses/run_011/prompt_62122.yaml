      *   Actually, simpler: "The tokens you hold right now are your earnings. You may choose to trade. If you end with fewer, that is your final grade contribution."
      *   To prevent ambush: "I am going to offer you trades. You are free to say no. But if you say yes to all of them, look at where you end up."
      *   I will add a "Stop Rule": "You can stop the trading at any time." This makes the loss their responsibility, not mine.

  12. **Handout Design:**
      *   Needs to be clear, tear-off sections.
      *   Lottery tables must be explicit.

  13. **Final check on "Every student's own choice actually pays off":**
      *   I need to make sure I don't run out of tokens.
      *   Max payout per student: 5 tokens (from Pair 1/3) + 5 tokens (from Pair 2). Total 10.
      *   26 students * 10 = 260 tokens.
      *   I will bring 300 tokens.
      *   Resolution: I cannot resolve 3 lotteries for 26 students in class (78 draws).
      *   *Compromise:* "We will resolve Problem 1 live for everyone. Problems 2 and 3 are recorded and will be resolved by me tonight and emailed."
      *   *Wait, for the Pump to work, they need to feel the stakes.*
      *   *Better:* "Your total payout is the sum of all three problems. To save time, we will resolve Problem 1 now. I will resolve 2 and 3 later. However, for the Trading Phase, we will use the tokens you just won from Problem 1."
      *   This ensures they have skin in the game immediately.

  14. **Wait, one more check on the Control:**
      *   Prompt: "Include a third pair in which the certain option is replaced by a very high-probability but still uncertain one."
      *   Does this mean Pair 3 replaces the certain option of Pair 1? Yes.
      *   So Pair 3 is: (99% 2) vs (89% 2, 10% 5, 1% 0).
      *   This works.

  15. **Scripting the "Unnamed" aspect:**
      *   Do not say "Independence Axiom."
      *   Do not say "Allais Paradox."
      *   Say "Consistency," "Trade-offs," "Value."

  16. **Honest Limits:**
      *   Students who know the paradox.
      *   Students who treat it as a game.
      *   The activity cannot show *why* people violate the axiom (psychology), only *that* they do and *that* it costs them.

