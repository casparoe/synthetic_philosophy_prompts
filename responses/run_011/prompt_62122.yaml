answer: |-
  # Activity Design: The Cost of Certainty

  ## 1. Choice Architecture

  **The Currency:** "Course Credit Tokens" (CCT).
  *   **Value:** 1 CCT = 0.1% added to the student's final course grade.
  *   **Cap:** Maximum 10 CCT per student from this activity (prevents grade inflation distortion).
  *   **Physicality:** Poker chips or distinct cardstock squares (bring 300 to ensure surplus).

  **The Lotteries:**
  Probabilities are scaled to a **100-card deck** (cards numbered 00–99) for transparent resolution.

  *   **Problem 1 (The Certainty Pair)**
      *   **Option 1A:** 100% chance of **2 CCT**.
      *   **Option 1B:** 89% chance of **2 CCT**, 10% chance of **5 CCT**, 1% chance of **0 CCT**.
      *   *(Expected Allais Choice: 1A)*

  *   **Problem 2 (The Common Consequence Pair)**
      *   **Option 2C:** 11% chance of **2 CCT**, 89% chance of **0 CCT**.
      *   **Option 2D:** 10% chance of **5 CCT**, 90% chance of **0 CCT**.
      *   *(Expected Allais Choice: 2D)*
      *   *Note:* 1A is equivalent to 2C + (89% chance of 2). 1B is equivalent to 2D + (89% chance of 2).

  *   **Problem 3 (The Control Pair)**
      *   **Option 3E:** 99% chance of **2 CCT**, 1% chance of **0 CCT**.
      *   **Option 3F:** 89% chance of **2 CCT**, 10% chance of **5 CCT**, 1% chance of **0 CCT**. (Identical to 1B).
      *   *(Purpose: Tests if the shift in Problem 1 was driven by *certainty* specifically or just high probability.)*

  **Resolution Mechanism:**
  *   **Equipment:** One standard deck of 100 index cards (numbered 00–99), shuffled in a clear box.
  *   **Trust:** A student volunteer shuffles the box. One student draws a card publicly to demonstrate the mechanism.
  *   **Payoff for All:** To save time while ensuring every student's choice pays off:
      1.  Each student receives a sealed **Envelope A** containing the result of *their* draw for Problem 1 (pre-generated by you before class using a random number table, sealed to prevent tampering).
      2.  Envelope A is opened immediately after Choice 1 to provide immediate stakes for the Pump phase.
      3.  Choices for Problems 2 and 3 are collected and resolved by you after class; results emailed within 24 hours. (This satisfies "actually pays off" without consuming 60 minutes of drawing time).

  ## 2. Reason-Elicitation Step

  **Ballot Design:**
  The handout is divided into three tear-off strips. Students must tear off Strip 1, decide, write, and place it in a collection box *before* receiving Strip 2. This prevents them from adjusting earlier answers to ensure consistency.

  **Wording to Avoid (Contamination):**
  *   ❌ "Explain your reasoning." (Invites logical justification they may not have).
  *   ❌ "Why is this option better?" (Implies one is better).
  *   ❌ "Compare this to your previous choice." (Hints at the experimental design).
  *   ❌ "Justify your selection." (Triggers defensiveness).

  **Clean Wording:**
  *   ✅ "In one sentence, what made this option attractive to you?"
  *   ✅ "Briefly, what mattered most to you in this choice?"

  ## 3. Control Condition

  **The Control:** Problem 3 (Options 3E vs 3F).
  *   **Success Pattern:** Class chooses 1A (Certainty) in Problem 1, but chooses 3F (Risk) in Problem 3. This isolates *Certainty* as the specific driver of the preference reversal, rather than just probability weighting.
  *   **Failure Pattern:**
      1.  **No Effect:** Majority chooses 1B and 2D (Consistent Risk-Seeking) OR 1A and 2C (Consistent Risk-Aversion). This means the Common Consequence Effect did not manifest.
      2.  **Control Failure:** Majority chooses 3E (High Prob) and 2D (Risk). This suggests the phenomenon is about *probability weighting* (99% vs 100% doesn't matter much) rather than the *Certainty Effect*.
  *   **Contingency:** If the Failure Pattern occurs, abandon the Pump. Spend the remaining hour discussing *why* the stakes or framing might not have triggered the intuition, and lecture on the difference between descriptive and normative theory.

  ## 4. The Pump (Sequential Swaps)

  **Target:** Students who chose **1A** (Sure) and **2D** (Risk).
  **Endowment:** Students begin the Pump phase with the CCT won in Envelope A (Problem 1).
  **Safety:** Students are told: *"You may decline any trade. If you accept all trades, you may end with fewer tokens than you started. This is voluntary."*

  **The Sequence:**
  1.  **State 0:** Student holds **Option 1B** (Hypothetical).
      *   *Facilitator Script:* "Imagine for a moment you held Option 1B (the risky one from Problem 1). Based on your choice in Problem 1, you prefer 1A over 1B."
  2.  **Swap 1:** Trade 1B $\to$ 1A.
      *   **Cost:** 0.2 CCT.
      *   **Rationale:** Since they chose 1A over 1B, they should be willing to pay a small premium to secure 1A.
      *   **Result:** Student holds 1A. Balance: $-0.2$.
  3.  **Swap 2:** Trade 1A $\to$ 1B.
      *   **Cost:** 0.2 CCT.
      *   **Rationale:** "You told us in Problem 2 that you prefer 2D over 2C. Option 1A is just 2C plus a bonus (89% chance of 2). Option 1B is just 2D plus that same bonus. If you prefer 2D to 2C, you should be willing to pay to upgrade the '2C part' of your bundle to '2D'."
      *   **Result:** Student holds 1B. Balance: $-0.4$.
  4.  **Outcome:** Student is back to holding 1B (where they started hypothetically) but has lost 0.4 CCT.

  **Assumption:** The pump depends on **Myopic Evaluation**. The student evaluates Swap 1 based on Problem 1 preferences and Swap 2 based on Problem 2 preferences, without recognizing that the two swaps form a cycle.
  **Avoiding Ambush:** Explicitly state before Swap 2: *"This trade effectively changes your lottery back to Option 1B, but it aligns your bundle with your preference in Problem 2."*

  ## 5. Logistics

  **Timeline (75 Minutes):**
  *   **00–05:** Intro. Distribute handouts & 5 "House CCT" (to ensure everyone has tokens for the pump even if they win 0 in Prob 1). Explain resolution rules.
  *   **05–15:** **Problem 1.** Tear Strip 1. Decide. Write reason. Deposit in box. Open Envelope A (Pre-generated Result). Count tokens.
  *   **15–25:** **Problem 2.** Distribute Strip 2. Decide. Write reason. Deposit.
  *   **25–35:** **Problem 3.** Distribute Strip 3. Decide. Write reason. Deposit.
  *   **35–45:** **Read Reasons.** Instructor reads 3 anonymous reasons from Problem 1 and 3 from Problem 2.
  *   **45–60:** **The Pump.** Invite students who chose 1A/2D to participate (others observe). Run the 2-swap sequence.
  *   **60–70:** **Debrief.** Connect to theory.
  *   **70–75:** **Wrap.** Collect House CCT. Dismiss.

  **Materials:**
  *   300 Course Credit Tokens (cardstock).
  *   26 Envelope A (Pre-filled with Problem 1 results).
  *   100-Card Deck (00–99) in clear box.
  *   Handouts (3 tear-off strips + Pump Menu).
  *   Collection Box.

  **Board Work:**
  *   *Stage 1:* "Choice 1: A vs B" (Outcomes listed).
  *   *Stage 2:* "Choice 2: C vs D" (Outcomes listed).
  *   *Stage 3 (Pump):* "Current Holding" | "Trade Offer" | "Cost".
  *   *Stage 4 (Debrief):* "Consistency" | "Independence" | "Certainty".

  **Facilitator Script (Transitions):**
  *   *Before Choice 2:* "Please put away your first strip. Do not look back at it. This is a new decision."
  *   *Before Pump:* "We are now entering a trading market. You own what you won. You may trade if you wish. There is no obligation."
  *   *After Pump:* "Look at your token count. Did you gain value, or did you pay to return to where you started?"

  **Handout Summary (Student View):**
  > **Decision 1:**
  > [A] 100%: 2 Tokens
  > [B] 89%: 2 Tokens | 10%: 5 Tokens | 1%: 0 Tokens
  > *Why attractive?* ___________________
  >
  > **Decision 2:**
  > [C] 11%: 2 Tokens | 89%: 0 Tokens
  > [D] 10%: 5 Tokens | 90%: 0 Tokens
  > *Why attractive?* ___________________
  >
  > **Decision 3:**
  > [E] 99%: 2 Tokens | 1%: 0 Tokens
  > [F] 89%: 2 Tokens | 10%: 5 Tokens | 1%: 0 Tokens
  > *Why attractive?* ___________________
  >
  > **Trading Menu:**
  > 1. Swap Ticket B for Ticket A (Cost: 0.2 Tokens)
  > 2. Swap Ticket A for Ticket B (Cost: 0.2 Tokens)

  ## 6. Debrief

  **Mapping the Activity:**
  1.  **The Axiom:** "Mixture Independence." If you prefer X to Y, you should still prefer X to Y even if both are mixed with a common third chance Z.
  2.  **The Transformation:** Problem 2 is just Problem 1 with the "89% chance of 2 Tokens" removed from both options. Logically, that common chunk shouldn't change your preference between the remaining parts.
  3.  **The Pump:** The pump worked because you evaluated the trades *sequentially*. In Trade 1, you focused on avoiding the 1% risk (Certainty). In Trade 2, you focused on the upside potential (Independence). You didn't see the cycle because you weren't allowed to precommit to a strategy.

  **The Charge:**
  "You are vulnerable to a money pump. A rational agent's preferences should not allow them to pay to go in a circle."

  **The Strongest Reply (for students to keep):**
  "The 'Certainty' isn't just a probability number; it's a psychological state. Eliminating anxiety has value that isn't captured in the token amount. I paid to remove anxiety in Trade 1, and I paid for upside in Trade 2. The utility function includes 'peace of mind,' which disappears once the risk is reintroduced in Trade 2."
  *Instructor Counter:* "That is a valid descriptive explanation (Prospect Theory), but normatively, it means your preferences are unstable depending on how the choice is framed."

  ## 7. Honest Limits

  **Predictable Failures:**
  1.  **The "Philosophy Major" Effect:** 1–2 students will recognize the Allais Paradox from reading or pop-sci. They will choose 1B and 2C deliberately to "beat the test."
      *   *Mitigation:* In the debrief, acknowledge this. "If you spotted the trap, you successfully optimized for the experiment, but you may have optimized against your own intuition."
  2.  **Solving the Pump:** A student might realize during Swap 1 that Swap 2 is coming.
      *   *Mitigation:* This is actually a success (they recognized inconsistency). Praise them.
  3.  **Stakes Too Low:** Students may treat tokens as play money.
      *   *Mitigation:* Remind them repeatedly that this affects their final grade percentage.

  **What This Activity Cannot Reproduce:**
  *   **The "Why":** This activity demonstrates the *cost* of the violation, but not the *psychological mechanism* (e.g., regret aversion, certainty effect). You must supply the theory (Kahneman & Tversky) in the lecture following this activity.
  *   **Learning:** In real life, people learn not to be money-pumped. This is a one-shot interaction. It shows static inconsistency, not dynamic learning.
