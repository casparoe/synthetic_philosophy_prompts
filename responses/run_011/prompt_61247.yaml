  **Question:** You argue human kinds are distinct because they react to classification, unlike quarks. But credit scores change spending, and climate models change policy. What makes psychiatric looping distinct from those feedback loops?
  **Likely Answer:** She'll say psychiatric looping involves *self-conception* or *identity*, not just behavioral adjustment.
  **Follow-up:** If the distinction is self-conception, does a non-verbal autistic child loop in the same way as an adult joining an online community?

  **2. Unfalsifiability (Hard Question 1)**
  **Question:** If every category you examine turns out to have looped, what would a psychiatric kind that failed to loop actually look like?
  **Likely Answer:** She'll say a stable biomarker correlation over time despite public knowledge would count.
  **Follow-up:** But if the biomarker search keeps failing because categories shift, isn't that just protecting the theory from falsification by blaming the categories?
  **Rejoinder:** So if no evidence can count against the looping hypothesis, isn't it functioning as a metaphysical commitment rather than a scientific claim?

  **3. Direction and Ownership**
  **Question:** Patients, insurers, pharma, and epidemiologists all pull categories in different directions. If you can't specify which mechanism is driving the loop, does the idea of a unified settling time have any content?
  **Likely Answer:** She'll call it a complex system with multiple vectors.
  **Follow-up:** Then how do you predict when settling occurs? If it's just retrospective, isn't it just a description of history rather than a theory of kinds?

  **4. Ontological Neutrality (Hard Question 2)**
  **Question:** You call looping ontologically neutral, saying only the target moves. But if the target moves *because* of the classification, doesn't that mean the classification partly constitutes the target?
  **Likely Answer:** She'll insist there's still a biological substrate existing independently.
  **Follow-up:** If the substrate is always reshaped by the classification before it settles, what evidence would convince you a kind has *not* looped?
  **Rejoinder:** If stable biomarkers are impossible by your own theory, what evidence counts against the claim that categories *never* settle?

  **5. Diagnostic Drift and Autism**
  **Question:** Autism prevalence has skyrocketed. You attribute this to looping, but critics point to broadened criteria and better ascertainment. How do you separate looping effects from these administrative changes?
  **Likely Answer:** She'll argue the changes in presentation are qualitative, not just quantitative.
  **Follow-up:** If parents are trained by online communities to report symptoms, isn't that just measurement error driven by the loop?

  **6. Giddens vs. Double Hermeneutic**
  **Question:** Giddens's double hermeneutic describes exactly this feedback between expert knowledge and lay action. What does looping add that isn't just branding over existing social theory?
  **Likely Answer:** She'll say looping focuses on the *classification* changing the kind, not just the interpretation.
  **Follow-up:** But if the kind changes only because the interpretation changes, haven't you just reduced ontology to hermeneutics?

  **7. Costs Elsewhere (Treatment Efficacy)**
  **Question:** If categories never fully settle, can a clinician ever say a treatment worked, or that a 1995 prevalence estimate measures the same thing as a 2020 estimate?
  **Likely Answer:** She'll say pragmatically yes, within a temporary window.
  **Follow-up:** If the window is always shifting, how do you justify funding long-term trials that assume stability across decades?

  **8. Homosexuality Declassification**
  **Question:** Take the 1973 declassification of homosexuality. Was that a loop closing because the category became untenable, or a correction because it was never a valid kind?
  **Likely Answer:** She'll say it was a moral-political decision enabled by the loop.
  **Follow-up:** If the loop determines validity, does that mean a sufficiently mobilized community could loop any disorder out of existence, regardless of biology?

  **9. Biomarkers and Settling**
  **Question:** You argue biomarker research fails because categories change before settling. But if settling is rare, isn't the practical recommendation to stop looking for biomarkers entirely?
  **Likely Answer:** She'll say we should look, but expect failure until categories stabilize.
  **Follow-up:** If you advise expecting failure, aren't you making a substantive claim about the biology, despite claiming ontological neutrality?

  ***

  **Recommendation**

  **Hold onto:** **Question 4 (Ontological Neutrality).** This addresses your primary philosophical bugbear directly. If you run out of time, this is the one that forces her to stop gliding over the realism issue.

  **Drop:** **Question 6 (Giddens).** If the conversation is flowing well and she's being forthcoming, this is the most academic/niche question. The clinicians in your audience will care more about the biomarker and treatment efficacy questions, and the students will get the point about social theory from the other interactions.
