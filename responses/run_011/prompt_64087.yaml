answer: |-
  # The "Truth-Work" Triage Protocol
  **For:** Triage Editors (Graduate Students)  
  **Time Limit:** 20 Minutes per Manuscript  
  **Goal:** Identify manuscripts that invoke "Truth" as a substantive explanatory property without specifying the work that property performs.  
  **Constraint:** Do not reject based on the *correctness* of a truth theory. Reject only on the *absence of explanatory utility*.

  ---

  ### Step 1: The Substitution Test (5 Minutes)
  **Question:** Locate every instance where the author claims a proposition is "true" (or "not true"). Can you replace "is true" with "is the case," "is warranted by the evidence," or simply assert the proposition itself without changing the argument's logical flow?
  *   **Example:** "Theory X is true" $\rightarrow$ "Theory X is the case."
  *   **Sufficient Answer:** The author argues that substitution *fails* because "truth" tracks something "warrant" does not (e.g., future verification, mind-independence).
  *   **Disposition:**
      *   If substitution works perfectly and the author treats "truth" as a super-charged synonym for "good": **Desk Reject** (Redundant).
      *   If substitution fails but the author explains *why*: **Send to Referees**.
      *   If substitution fails and the author offers no explanation: **Flag for Editor**.
  *   **[JUDGMENT CALL]:** Determining if the argument "changes" requires reading the immediate context, not just the sentence.

  ### Step 2: The Explanatory Gap Test (10 Minutes)
  **Question:** Does the manuscript claim that "Truth" *explains* a phenomenon (e.g., scientific success, convergence of belief, logical stability)? If yes, does the text specify *how* truth explains it, distinct from the explanation provided by "accuracy" or "coherence"?
  *   **Sufficient Answer:** A mechanism is proposed (e.g., "correspondence to mind-independent states causes predictive success").
  *   **Disposition:**
      *   If Truth is used as a "stopper" (e.g., "It works because it's true" with no further elaboration): **Reject with Invitation to Resubmit** (Request: Specify the explanatory mechanism).
      *   If Truth is the *topic* of the paper (e.g., "We argue Truth explains X"): **Send to Referees**.
      *   If Truth is contrasted with "consensus" or "utility" without defining the contrast: **Flag for Editor**.
  *   **[JUDGMENT CALL]:** Distinguishing between a "mechanism" and a "restatement" is the hardest part of this job. When in doubt, Flag for Editor.

  ### Step 3: The Contrast Test (5 Minutes)
  **Question:** Does the abstract or introduction contrast "Truth" with an epistemic virtue (consensus, verification, utility, acceptance)?
  *   **Sufficient Answer:** The author argues that the epistemic virtue can obtain *without* truth (e.g., "We can have consensus on a false theory").
  *   **Disposition:**
      *   If the contrast is asserted as obvious without argument: **Flag for Editor**.
      *   If the contrast is argued for (e.g., via historical cases of stable falsehoods): **Send to Referees**.
  *   **[JUDGMENT CALL]:** This step detects "unearned metaphysics." It is not a rejection of robust truth, but a demand for the argument that separates it from consensus.

  ---

  ### Handoff Protocol: When to Escalate to the Editor-in-Chief
  If a manuscript passes Steps 1–3 but the *only* reason it passes is that it explicitly defends a robust metaphysics of truth (e.g., "We assume correspondence theory"), **do not desk reject.** Send to Referees.
  **However,** if the manuscript fails Step 3 (Contrast Test) by asserting a distinction between Truth and Consensus/Accuracy *without* argument, **do not decide yourself.** Hand the manuscript to the Editor.
  **Reason:** Determining whether "Truth vs. Consensus" is a legitimate distinction or a verbal confusion is a metaphysical question, not an editorial one. The Editor must decide if the journal will tolerate the assertion of this distinction as a premise.

  ---

  ### Deflationist Toolkit: Compression Report
  **What Survives Triage:**
  1.  **Disquotation:** The idea that "True" allows us to assert without quoting. (Used in Step 1).
  2.  **Generalization:** The idea that "True" allows us to quantify over propositions. (Implicit in Step 1).
  3.  **Explanatory Idleness:** The suspicion that Truth adds no causal power. (Used in Step 2).

  **What is Dropped:**
  1.  **T-Sentences:** Triage editors cannot check biconditional equivalence formally.
  2.  **Normativity of Truth:** Whether truth is a *goal* of inquiry. This is too close to the journal's scope statement to filter at triage.
  3.  **Semantic Ascent:** Distinguishing use from mention is too technical for a 20-minute scan.

  **Why Tolerable:** Triage is about *workload management*, not *philosophical purity*. We filter out *confused* uses, not *substantive* theories. If an author argues for robust truth, they belong in review. If they *assume* it without argument, they belong in the bin. The dropped distinctions are for the referees to adjudicate.

  **Systematic Blindspots (Where the Procedure Fails):**
  1.  **The Liar Paradox:** The procedure treats "True" as a predicate that should do work. Paradoxes arise when it *does* work. The procedure may falsely flag paradox papers as "confused" because they highlight the breakdown of the predicate. **Direction of Error:** False Positives (Rejecting good logic papers).
  2.  **Alethic Pluralism:** If an author says "Truth is different in ethics vs. science," Step 1 may flag this as inconsistent. **Direction of Error:** False Positives.
  3.  **Unknowable Truth:** Claims like "P is true but unverifiable" will fail Step 1 (Substitution with "warranted" fails) and Step 3 (Contrast with verification). They will be Flagged for Editor. **Direction of Error:** Bottlenecking (Slowing down metaphysical papers).
  4.  **Non-Declarative Uses:** "True friend," "True to the data." Step 1 should catch these as category errors in a philosophy journal. **Direction of Error:** False Negatives (Letting through sloppy writing).

  ---

  ### Application to Queue Sentences

  **1. Psychology Replication:** *"We claim something stronger, namely that the original finding was not true."*
  *   **Test 1 (Substitution):** Fails. "Not the case" is weaker than "Not true" in this context (implies error, not just bad luck).
  *   **Test 2 (Explanation):** Implicit. Truth tracks reality, replication tracks reliability.
  *   **Disposition:** **Send to Referees.** Standard scientific realism. No metaphysical overreach detected.

  **2. Social Epistemology:** *"Their disagreement is about truth, and about truth alone."*
  *   **Test 3 (Contrast):** **FAIL.** Contrasts Truth with Data/Model/History. Asserts Truth is a distinct object of disagreement.
  *   **Sufficient Answer Missing:** No argument provided for why agreement on data/model doesn't exhaust the disagreement.
  *   **Disposition:** **Flag for Editor.**
  *   **Note:** This sentence is structurally isomorphic to the Journal's Scope Statement ("Aims at truth rather than consensus"). If you desk-reject this manuscript for asserting a Truth/Consensus distinction without argument, you undermine the journal's own mission statement.

  **3. Philosophy of Mathematics:** *"The system's own resources cannot say... that it is true."*
  *   **Test 1 (Substitution):** Fails. "Say it is the case" is precisely what the system cannot do (by hypothesis).
  *   **Test 2 (Explanation):** Pass. Truth is doing the work of transcending the formal system.
  *   **Disposition:** **Send to Referees.** This is a technical claim about Tarski/Gödel, not an unearned metaphysical assertion.

  **4. Scientific Realism:** *"No formulation of any theory, however complete, could state what those features are."*
  *   **Test 2 (Explanation):** **FAIL.** Claims truth-makers exist but are ineffable.
  *   **Sufficient Answer Missing:** How can ineffable features explain truth? This borders on mysticism.
  *   **Disposition:** **Flag for Editor.** This is a heavy metaphysical claim that risks making the concept of truth explanatorily idle.

  ---

  ### Critical Feedback on Journal Scope Statement
  **You asked for honesty regarding this sentence:** *"This journal is committed to publishing work that aims at truth rather than at consensus."*

  **Verdict:** This sentence **fails Step 3 (The Contrast Test)** of the procedure above.
  1.  **Redundancy Charge:** If "aiming at truth" just means "asserting what you believe is the case," then *every* academic journal aims at truth. Distinguishing it from consensus implies truth is a *property* distinct from intersubjective agreement.
  2.  **Unearned Metaphysics Charge:** It posits a gap between Truth and Consensus without arguing for it. From a deflationary view, this is a confusion. From a robust view, it is a premise that requires defense.
  3.  **Conflict:** Sentence 2 in your queue ("Disagreement is about truth... alone") was flagged for Editor review because it asserts this same distinction without argument. You cannot consistently flag the author while keeping the scope statement unchallenged.

  **Recommendation:** Replace the scope statement with an ethical commitment to rigor, not a metaphysical commitment to a property.
  *   **Current:** "...aims at truth rather than at consensus."
  *   **Proposed:** "...aims at **rigorous argumentation** rather than at **accommodation**."
  *   **Why:** "Rigor" describes the *method* (which you can evaluate at triage). "Truth" describes the *target* (which is metaphysically loaded). "Accommodation" describes the *social pressure* (which you want to avoid). This preserves your intent without committing the journal to a substantive theory of truth that your triage procedure identifies as philosophically suspect.

  **Final Instruction to Triage Editors:** If an author quotes the Scope Statement to defend a move that fails Step 3, **ignore the Scope Statement.** Refer them to the Editor. The Editor must resolve the conflict between the journal's marketing and its philosophical standards.
