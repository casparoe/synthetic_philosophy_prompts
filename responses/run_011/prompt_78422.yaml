prompt: |-
  I build ranking systems for a short-video app. My entire vocabulary is objectives and their proxies: predicted watch-through, share and save rates, retention curves, A/B lifts, cold start, distribution shift, reward hacking, and the chronic gap between the metric we optimize and the thing we claim to want. I have no philosophy training.

  Translate Tolstoy's theory of art from *What Is Art?* into that vocabulary, as literally as it will bear. Art as the transmission of a feeling the artist has actually experienced, such that the audience is infected by it; the three conditions of infectiousness — the individuality of the feeling, its clarity, and the artist's sincerity; and above all his claim that art is to be judged by whether it unites people rather than by how much pleasure it gives a trained, leisured audience, which is why he dismisses the opera and ballet of his day along with much of his own earlier fiction, while pointing at the labor those institutions consume. Tell me what the transmission channel is, what counts as fidelity, what his quality criterion would look like as an objective function, and what his attack on elite art becomes.

  Then report what failed to carry. Which claims map cleanly, which you had to bend, and which have no counterpart in my vocabulary at all — I expect his idea that some feelings are worth transmitting and others are not, on grounds having nothing to do with how audiences respond. For each piece of residue, say whether it exposes a real blind spot in how ranking objectives get designed, or whether the Tolstoyan claim is vaguer than it sounds. Close by saying what would change your mind: which consideration would flip your judgment on any given residue, and where you think your translation most likely misreads him.
