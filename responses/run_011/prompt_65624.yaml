answer: |-
  ### The Spec: Requirements for a Vindication of Simplicity

  To count as a solution to the problem of induction (rather than just a heuristic), a theory must define a mapping from data $D$ to hypothesis $H$ (or distribution $P$) that justifies preferring simpler $H$ without circularity.

  | # | Requirement | Specification | Status | Rationale / Case |
  | :--- | :--- | :--- | :--- | :--- |
  | **1** | **Asymptotic Convergence** | If the true data-generating process is within the hypothesis class, posterior probability on the truth must converge to 1 as $N \to \infty$. | **Non-Negotiable** | Without this, the method is not inductively reliable; it's just guessing. |
  | **2** | **Quantitative Penalty** | Simplicity must enter as an explicit cost term (e.g., $-\log P(H)$) separable from data fit (likelihood). | **Non-Negotiable** | Required to distinguish "simple" from "lucky." Prevents overfitting by definition. |
  | **3** | **Language Invariance** | Complexity ordering must be invariant across Turing-complete description languages, up to an additive constant $O(1)$. | **Non-Negotiable** (with caveat) | If simplicity flips based on the CPU architecture, it's not a property of the world/hypothesis, but of the encoder. |
  | **4** | **Prior/Likelihood Separation** | Must distinguish model complexity (Prior) from data explanation (Likelihood). Cannot collapse into pure empirical risk minimization. | **Non-Negotiable** | Collapsing these eliminates the theoretical mechanism for Occam's razor (bias-variance tradeoff). |
  | **5** | **Effective Computability** | The inference rule must be computable in finite time and resources. | **Preference** (Engineering) | A theory of *inference* implies a process. If uncomputable, it is a definition of truth, not an inference engine. |
  | **6** | **Finite-Data Determinacy** | For any two hypotheses $H_1, H_2$ and finite data $D$, the theory must determinately rank one as superior. | **Preference** (Philosophical) | Users want an answer *now*. However, theory may only provide bounds for finite $N$. |
  | **7** | **Robustness to Non-Computable Truth** | Performance should degrade gracefully if the true distribution is not computable (e.g., contains random noise or oracle access). | **Non-Negotiable** | The physical world may not be a Turing Machine. The theory must not diverge catastrophically. |
  | **8** | **MDL Consistency** | The complexity measure must correlate with practical compression (e.g., gzip, LZW) on real-world data distributions. | **Preference** (Empirical) | If a "simplicity" metric contradicts empirical compression on natural data, it lacks ecological validity. |

  ---

  ### The Tension: Determinacy vs. Invariance

  **Your guess is correct. This tension is real and fatal to the "SI proves Occam" pitch.**

  *   **The Conflict:** Requirement 3 (Invariance) holds only up to an additive constant $c$ dependent on the choice of Universal Turing Machine (UTM). Requirement 6 (Determinacy) demands a strict ordering for finite data.
  *   **The Math:** For two hypotheses with lengths $L_1$ and $L_2$, if $|L_1 - L_2| < c$, a different choice of UTM can flip the ordering. Since $c$ can be arbitrarily large depending on how "hostile" the reference machine is, there is **no language-invariant fact of the matter** about which of two finite hypotheses is simpler.
  *   **The Resolution:** Invariance only saves you asymptotically ($N \to \infty$). For finite $N$ (which is all we have), simplicity is relative to the reference machine. SI does not prove Occam's Razor is objectively true; it proves that *if* you fix a reference machine, *then* shorter hypotheses are assigned higher prior probability.

  **Verdict:** You cannot jointly satisfy **Absolute Language Invariance** and **Finite-Data Determinacy**. You must sacrifice objectivity for finite cases.

  ---

  ### Ruling on the "Gzip Baseline" Requirement

  **Verdict: Category Mistake.**

  *   **Reasoning:** A theory of induction (like SI) defines the *optimal* predictor given infinite compute. Gzip/MDL is an *approximation* constrained by polynomial time. Expecting the theoretical optimum to be beaten by a heuristic on specific tasks confuses the bound with the implementation.
  *   **Correction:** The valid requirement is **MDL Consistency** (Req 8). The theory must *explain why* gzip works (i.e., structure in data allows compression), not necessarily beat it on every benchmark. If a theory implies that compression *should not* correlate with generalization, the theory is falsified. If it just can't run fast enough, it's an engineering limitation, not a theoretical failure.

  ---

  ### The Killer Requirement

  **Requirement 5 (Effective Computability) knocks out the most significant candidates.**

  *   **Why:** It immediately disqualifies **Solomonoff Induction** itself. SI is the gold standard for the *philosophy* of induction, but it is uncomputable (halting problem).
  *   **Impact:** This forces every "solution" into the realm of approximation (variational inference, MCMC, practical MDL). Once you approximate, you introduce new biases that are no longer covered by the original theoretical guarantees (like the Invariance theorem). It reveals that the "proof" of Occam's Razor holds for the ideal, unrunnable god-machine, but not for the engineer's laptop.

  *(Runner up: **Language Invariance**. This knocks out any claim that SI provides an **objective** measure of simplicity for finite data, undermining the philosophical "vindication" claim.)*

  ---

  ### Scorecard: How the Candidates Stack Up

  **1. The Universal Prior (Solomonoff Induction)**
  *   **Pass:** Convergence (on computable worlds), Quantitative Penalty, Prior/Likelihood Separation, Invariance (asymptotic).
  *   **Fail:** **Effective Computability** (unrunnable), Finite-Data Determinacy (reference machine dependence).
  *   **Summary:** The theoretical ceiling. It defines what "optimal induction" means but cannot be implemented. It vindicates Occam only relative to a chosen UTM.

  **2. Plain MDL (Minimum Description Length)**
  *   **Pass:** Effective Computability (usually), MDL Consistency (is the baseline), Quantitative Penalty.
  *   **Fail:** Language Invariance (depends on the chosen codebook/model class), Convergence (depends on whether the truth is in the model class).
  *   **Summary:** The engineer's SI. It operationalizes the theory but loses the universality guarantees. Simplicity is defined by your toolkit, not the universe.

  **3. Subjective Bayesianism**
  *   **Pass:** Effective Computability (via MCMC/VI), Prior/Likelihood Separation, Coherence (Dutch Book).
  *   **Fail:** Language Invariance/Objectivity (priors are agent-dependent), Convergence (depends on prior support).
  *   **Summary:** Rejects the premise that simplicity is objective. "Simpler" just means "higher prior probability for me." It solves coherence, not the justification of the prior itself.
