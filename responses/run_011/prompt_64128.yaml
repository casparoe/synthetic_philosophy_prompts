answer: |-
  Elena, a shelter coordinator, stands in the lobby when a social worker, David, asks if a specific refugee, Amir, is staying there; David is fully entitled to track Amir for visa processing and bears no ill will, but if he logs Amir's location now, a bureaucratic glitch will deport Amir before his asylum hearing clears. Elena answers, "Amir has not signed the intake log today," which is true because she waived the fee for him, but she has conspicuously placed Amir's assigned bunk number on the 'Vacant' board in the lobby, ensuring David forms the false belief that Amir is not present without her uttering a falsehood or refusing to speak, since silence would trigger a mandatory search protocol.

  ### Analysis

  **Does Augustine's machinery produce a verdict?**
  Augustine's machinery does not run out; it produces a sharp condemnatory verdict. In *De Mendacio* and *Contra Mendacium*, Augustine defines a lie not merely as a false sentence, but as a sign (*signum*) issued with the will to deceive (*voluntate fallendi*). His framework is robust enough to capture non-verbal deception because he understands communication as the transmission of signs, not just phonemes.

  **Signs vs. Sentences**
  The first pressure point is whether arranging an object counts as "speaking." Augustine's semiotics (particularly in *De Doctrina Christiana*) acknowledge that actions function as signs. By placing the bunk number on the 'Vacant' board, Elena is utilizing a conventional sign system within the shelter. For Augustine, the moral weight rests on the *intent* to induce error in the neighbor's mind. Whether the false sign is painted on a board or spoken with a tongue is secondary to the fact that the speaker *wills* the listener to believe what is not so. The object is a "silent word," and deploying it deceptively falls under the prohibition of *enuntiatio falsa* (false assertion).

  **Concealment vs. Engineering**
  The second pressure point is the distinction between concealing the truth and engineering a false belief. Augustine permits *occultatio veritatis* (hiding the truth) via silence when one is not obliged to speak. However, he strictly forbids *prolatio falsitatis* (putting forth falsehood). Elena's action crosses the line from passive concealment (not mentioning Amir is here) to active engineering (signaling he is *not* here). Augustine argues that while you are not obligated to give a truth you do not owe, you are obligated not to give a falsehood you do not possess. By manipulating the board, she is actively giving a falsehood she knows to be false.

  **The Single Feature and Counterfactual**
  The single feature doing the moral work is the **arranged object (the 'Vacant' board)**. If you take this feature out, Elena is left only with her verbal statement ("Amir has not signed the log"). Without the board, her words alone are ambiguous but technically true; they would likely fail to convince David, leading him to suspect the truth or demand a search. In that scenario, Elena faces a binary choice: speak the plain truth ("Amir is here") or lie verbally. Under Augustine's absolute ban, the verdict becomes that she *must* tell the plain truth, regardless of the deportation consequence. The object allows her to bypass the ban; remove it, and the ban binds her absolutely.

  **Permissive vs. Condemnatory Readings**
  *   **Permissive Reading:** Elena did not lie because her *verbal proposition* corresponded to reality (Amir indeed did not sign the log). The deception arose in David's mind through his own interpretation of the board, which Elena merely "failed to correct." This relies on a narrow, legalistic definition of lying restricted to explicit verbal assertions.
  *   **Condemnatory Reading:** Elena lied because her *communicative intent* was to falsify David's belief. She coordinated her speech and her environment to ensure a specific falsehood was believed. The "truth" of her sentence was a sham designed to shield her conscience while violating the spirit of the command against bearing false witness.

  **Textual Support**
  Augustine's texts support the **condemnatory reading** overwhelmingly. In *Contra Mendacium*, he attacks the Priscillianists for using mental reservation and deceptive practices that were technically "true" in some narrow sense but intended to deceive. He writes that "he who thinks one thing and says another... lies." For Augustine, the locus of the sin is the *heart* (the double heart, *cor duplex*), not the tongue. Elena's heart is double: she knows Amir is present but wills David to believe he is absent. The medium of the deception (the board) does not absolve the intent. Augustine would argue that suffering the evil of deportation (which is David's or the bureaucracy's sin, not hers) is preferable to committing the evil of lying (which is her sin).
