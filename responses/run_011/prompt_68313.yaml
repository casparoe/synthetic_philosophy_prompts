      *   *Refining Point 2:* Connect "robustness" to the seminar's discussion on counterfactuals.
      *   *Refining Point 3:* Connect to "proportionality" (coarse vs. fine grain).
      *   *Refining Point 4:* Connect to "voluntary intervention."
      *   *Refining Point 6:* Connect to "difference-making."

  4.  **Final Polish:** Check the flow. Ensure the transition from metaphysical diagnosis to literary critique is smooth. Make sure the verdict is nuanced. (The prompt asks for a "framing piece," so it should invite discussion, not just close it down, but the prompt also asks for a "considered verdict" at the end).

      *   *Key Insight:* Tolstoy isn't just wrong about metaphysics; he's highlighting the *interest-relative* nature of causal selection that the seminar discussed earlier (Hart & Honoré, etc.).
      *   *Key Tension:* The "View from Nowhere" (Epilogue) vs. the "View from Within" (Narrative).

  5.  **Final Review against constraints:**
      *   Paraphrase only? Yes.
      *   Address all 5 points + intro/outro? Yes.
      *   Faithful criticism (no theory bending, no novel reduction)? Yes.
      *   Tone appropriate? Yes.

      *(Drafting mental outline of the text)*:
      1.  Welcome & Context (Seminar themes -> Tolstoy).
      2.  Causal Structure (Overdetermination vs. Infinite Conjunction/Selection).
      3.  Redundancy vs. Necessity (The Epilogue's hard determinism).
      4.  Individuation (Coarse vs. Fine grain/Proportionality).
      5.  Kutuzov (Agency as alignment).
      6.  Narrative Contradiction (The emotional truth vs. theoretical claim).
      7.  Phenomenology & Verdict (What the novel adds).

