answer: |-
  Colleagues, welcome to the final session of our seminar. Over the past weeks, we have subjected historical explanation to a rigorous metaphysical audit. We have dissected the firing squad to understand symmetric overdetermination; we have traced preemptive chains to see why simple counterfactual dependence fails; we have weighed Mackie's INUS conditions against the pragmatic criteria of abnormality and intervention that guide causal selection. We have asked whether a cause must be proportional to its effect, and whether large-scale historical outcomes are too robust to admit of meaningful counterfactuals.

  Today, we turn from the schematic examples of the philosophy journal to the unruly texture of the novel. We are reading Tolstoy's *War and Peace* not as a repository of illustrative anecdotes, but as a sustained philosophical argument enacted through narrative. Specifically, we are focusing on the essayistic digressions surrounding the 1812 campaign and the second part of the epilogue. As you know, these sections are often excised from popular editions, treated as authorial indulgences. We will treat them as the engine of the work. Our task is to hold Tolstoy's philosophy of history against the metaphysical apparatus we have built, without reducing the novel to a mere case study or distorting our theories to accommodate his genius.

  **First, we must diagnose the causal structure Tolstoy attributes to the events of 1812.**
  The standard reading suggests Tolstoy proposes a world of symmetric overdetermination: the French invasion occurs regardless of Napoleon's will, just as the victim dies regardless of which soldier in the firing squad shoots. However, if we look closely at the text—specifically the discussion of the order preceding the crossing of the Niemen, or the insistence that Napoleon's cold on the morning of Borodino altered nothing—we see a more complex picture. Tolstoy is not arguing that there were multiple, independently sufficient routes to the invasion. He is arguing that the order itself was insufficient.

  This is not classic overdetermination; it is a critique of causal selection within a massive conjunctive chain. For Tolstoy, the event is the product of an incalculable sum of individual volitions. No single volition is sufficient; indeed, most are necessary only in the trivial sense that removing any single particle changes the sum, though not the macroscopic outcome. His polemic is not primarily against the world, but against the historian's practice of isolating a "cause" from this continuum. When he describes the council at Fili and the abandonment of Moscow, he shows that the decision to retreat was not the origin of the retreat but a label applied to a movement already determined by the morale and supply lines of the army. The causal structure is conjunctive, but Tolstoy attacks the *selection* of the sovereign's will as the privileged conjunct. He argues that historians mistake the label for the mechanism.

  **Second, we must ask whether Tolstoy slides from a claim about causal redundancy to a claim about necessity.**
  In the seminar, we distinguished between robustness—the idea that an outcome survives the removal of a single factor—and inevitability—the idea that the outcome was fixed by the past and the laws of nature. Tolstoy's historiographical argument supplies the former: Napoleon's specific commands were redundant because the army's movement had its own momentum. Yet, the epilogue demands the latter. It argues for a strict determinism where human freedom is zero and every action is mathematically necessitated by prior conditions.

  Does the novel resist this slide? In the narrative, contingency abounds. Petya's death during the retreat is a chaotic accident, not a geometric necessity. The partisan warfare is messy and improvised. The narrative resources suggest a world of robust outcomes, not inevitable ones. The slide to hard determinism in the epilogue appears to be a theoretical overreach, a desire for a law of history that mirrors the laws of physics. However, one might argue the slide is the point: Tolstoy wants to show that the *experience* of contingency is an illusion born of limited perspective. Yet, as critics of the theory, we must note that robustness does not entail inevitability. Tolstoy conflates the insignificance of the Great Man with the necessity of the Event.

  **Third, consider the problem of event individuation.**
  We discussed proportionality: a cause should be commensurate with its effect. If we describe the effect as "The French Invasion of Russia," Tolstoy is right that Napoleon's specific order is too fine-grained to be the cause; the invasion is proportional to broader geopolitical and logistical forces. But if we describe the effect as "The crossing of the Niemen at 4:00 AM on June 24," the specific order becomes highly relevant.

  Tolstoy's theory covertly trades on a shift between these descriptions. He argues against the Great Man theory using coarse-grained events (the victory, the retreat), where individual agency looks negligible. But he condemns the moral emptiness of determinism while describing fine-grained events (a specific death, a specific moment of courage), where agency feels absolute. Does this undermine him? It undermines his claim to a unified metaphysics. However, it relocates the problem productively: it suggests that causal explanation in history is inherently interest-relative. We choose the grain of the effect based on what we want to explain. Tolstoy fails to admit this relativity, insisting instead that the coarse-grained view is the "true" one, but his practice reveals the tension.

  **Fourth, we must evaluate Kutuzov.**
  If Napoleon represents the error of believing one originates causal chains, Kutuzov represents the corrective. He sleeps through councils; he refuses to issue dispositions; he agrees to what the troops are already doing. Is this a positive account of agency? It resembles a form of compatibilism: freedom is not the ability to do otherwise, but the consciousness of one's alignment with necessity. Kutuzov is free because he recognizes the "swarm" of history and does not futilely resist it.

  Is this a stable position? Practically, it functions as wisdom. Metaphysically, it is precarious. If freedom is merely the recognition of necessity, it is difficult to distinguish from resignation dressed as insight. The novel invites us to admire Kutuzov, but it also shows the cost of his passivity. He saves Russia, but he allows suffering to take its course without intervention. This model of agency works only if one accepts Tolstoy's determinism. If we reject the determinism, Kutuzov is not wise; he is lucky and passive. Thus, Kutuzov is not a standalone solution to the problem of agency; he is the practical counterpart to the epilogue's metaphysics. He is stable only within the system Tolstoy builds, which we have already found to be sliding between redundancy and necessity.

  **Fifth, we must confront the contradiction between the narrative and the essays.**
  The novel invests enormous emotional capital in the idea that decisions matter. Andrei's choice to go to war, Pierre's choice to stay in Moscow, Natasha's choices in love—these carry the weight of the book. If the essays are true, this weight is an illusion. The emotional stakes depend on the reality of alternative possibilities.

  Does the narrative constitute internal evidence against the theory? Yes. A "two-level view"—that determinism is true objectively but freedom is true subjectively—is an apology Tolstoy does not fully make. He insists the subjective feeling is an error to be corrected by reason. The honest critic must concede that the theory fails to capture the lived reality the novel depicts so well. The novel saves itself from the theory. The narrative demonstrates that even if causal selection is pragmatic, the *experience* of selection is constitutive of human life. To deny it is to deny the subject matter of history itself. Here, Tolstoy's critics are right: the philosophy is a straitjacket the narrative constantly bursts.

  **Finally, what does the novel contribute that argument alone cannot?**
  Our metaphysical models—difference-making, counterfactuals, INUS conditions—are third-person tools. They view causation from the outside. Tolstoy provides the first-person phenomenology of acting inside a process one does not control. He captures the specific frustration of the commander who issues an order that is never executed as written, and the specific arrogance of the historian who later claims that order caused the victory.

  He presents a datum that difference-making accounts often discard as confusion: the fact that participants experience themselves as authors of outcomes to which they make no difference. A strict proportionality account might say Napoleon was not a cause of the invasion because he was not commensurate with it. Tolstoy says: Napoleon *felt* like the cause, and that feeling drove the actions that constituted the event. The illusion is part of the causal machinery.

  **Verdict**
  So, where does this leave us? Should we count Tolstoy's philosophy of history as a serious contribution to metaphysics, or a moral polemic in disguise?

  It is not a successful metaphysics. It collapses under the weight of its own determinism and its shifting granularity of events. It fails to account for the reality of the agency it depicts. However, it is a profound contribution to the *logic of historical explanation*. Tolstoy anticipates our modern understanding that causal selection is driven by the inquirer's interests and moral commitments. He exposes the "Great Man" theory not just as factually wrong, but as a category error in explanation.

  Therefore, we should read Tolstoy not as a rival to Mackie or Lewis, but as a precursor to the pragmatic and interest-relative accounts of causal selection we discussed earlier in the term. He shows that the demand for a "final cause" in history is a moral demand for accountability, not a metaphysical discovery. The novel's value lies in showing that while the metaphysics of the Great Man may be false, the psychological and political need for it is real. Our task today is to decide whether that need is something our theories of causation should accommodate, or something they should correct. Let us begin.
