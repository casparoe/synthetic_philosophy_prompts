answer: |-
  ### Part 1: The Conceptual Grid

  To build this instrument, we map views across two axes. **Axis X (Value)** asks whether aesthetic worth depends solely on what is perceived (Perceptual) or requires knowledge of the past (Historical). **Axis Y (Identity)** asks whether the work is the physical object itself (Object) or the specific event of its making (Event).

  | | **Value: Perceptual** (Looks/Feels only) | **Value: Historical** (Origin matters) |
  | :--- | :--- | :--- |
  | **Identity: Object** (The physical thing) | **Cell 1: The Clone View.**<br>Populated by Leaf (a) and Leaf (d). If the object is identical to the eye, the work is identical. Wrongdoing is purely moral (lies), not aesthetic. | **Cell 2: The Market View.**<br>Populated by Leaf (e). The physical object holds value, but that value is constituted by social facts and provenance, not just physics. |
  | **Identity: Event** (The act of making) | **Cell 3: The Unstable View.**<br>Mostly Empty/Incoherent. If identity is the *event*, but value is only *perceptual*, you have a unique event that produces no unique value. It collapses into Cell 1 or Cell 4. | **Cell 4: The Genesis View.**<br>Populated by Leaf (b), Leaf (c), and Leaf (g). The work *is* the performance of creation. A fake is a different work (b), a lesser achievement (c), or a category error (g). |

  **Diagnosis of Empty/Unstable Cells:**
  *   **Cell 3 (Perceptual Value / Event Identity):** This is **incoherent**. If you claim the work *is* the specific historical event of making, you cannot simultaneously claim that a perceptually identical event (a perfect fake) holds the same aesthetic value. The identity claim forces a value distinction.
  *   **Leaf (f) (Category Mistake):** This view sits **outside the grid**. It rejects the axes themselves, claiming "forgery" is a legal label, not an aesthetic one. It will manifest as inconsistent grid-hopping or rejection of the premises.

  ***

  ### Part 2: The Diagnostic (Week 1)

  **1. The Confession**
  A museum buys a painting believed to be a Vermeer. For forty years critics praise its beauty. Then the artist confesses he faked it.
  *   A. The painting lost its beauty the moment he confessed.
  *   B. The painting looks the same, so its beauty is unchanged.
  *   C. The painting was never beautiful, because Vermeer didn't paint it.

  **2. The Perfect Replica**
  A museum scanner creates a molecule-for-molecule copy of a destroyed original. Nobody lies about it being a copy.
  *   A. It is just as valuable as the original would have been.
  *   B. It is a useful tool, but it is not the artwork.
  *   C. It is worthless because the original artist is dead.

  **3. The Honest Label**
  A copyist paints a masterpiece and signs it with their own name. The label reads "After [Original Artist]."
  *   A. This is a new and respectable work of art.
  *   B. This is a lesser work, because the design wasn't invented here.
  *   C. This is not art at all, it is merely a record of another art.

  **4. The Workshop**
  A famous master paints only the hands on a canvas. Assistants paint the rest in his style. It is sold as his work.
  *   A. It is a real work by the master, because he touched it.
  *   B. It is a fake, because he didn't conceive the whole thing.
  *   C. It is a collaborative work, and the label is the only problem.

  **5. The Remake**
  An artist loses a painting. Twenty years later, she repaints it from memory. It looks identical.
  *   A. It is the same work, just restored.
  *   B. It is a new work that looks like the old one.
  *   C. It is a copy, even though she made both.

  **6. The Manuscript (Before)**
  A poem in an archive is attributed to a major poet. Scholars admire its style. No one knows it was written by a graduate student.
  *   A. The poem is a major contribution to the poet's body of work.
  *   B. The poem is a mistake in the catalog, but still good.
  *   C. The poem is worthless until we know who wrote it.

  **7. The Manuscript (After)**
  The curator reveals the student wrote the poem. The student is now getting her own editions.
  *   A. The poem got better, because the student is talented.
  *   B. The poem stayed the same, but its history changed.
  *   C. The poem got worse, because it failed to fool us forever.

  **8. The Performance**
  A pianist plays a score note-for-note exactly like a famous recording. She claims she composed it.
  *   A. She is a forger, because music is the composition, not the play.
  *   B. She is a performer, and music has no forgeries, only bad performances.
  *   C. She is a thief, but the music itself is unchanged.

  **9. The Rebuild**
  A historic building burns down. It is rebuilt exactly using the old plans and new bricks.
  *   A. It is the same building, just repaired.
  *   B. It is a replica, because the original materials are gone.
  *   C. It is a new building that honors the old one.

  **10. The Market**
  An artist sells a digital file. A buyer copies the file perfectly. The artist says the copy is worthless.
  *   A. The artist is wrong; the files are identical.
  *   B. The artist is right; the value is in the ownership, not the image.
  *   C. The artist is lying; art should be free.

  ***

  ### Part 3: Scoring Key & Leaf Assignment

  Do not tally points. Map the trajectory of specific answers to locate the student's view.

  **Leaf (a): Perceptualist**
  *   **Signature:** Q1(B) + Q2(A) + Q10(A).
  *   **Logic:** If it looks the same, it is the same. Value supervenes on physics.

  **Leaf (b): Historical Essentialist (Goodman-style)**
  *   **Signature:** Q1(C) + Q2(B) + Q5(B).
  *   **Logic:** The history of production constitutes the work's identity. A different history makes a different work, regardless of looks.

  **Leaf (c): Achievement Theorist (Dutton-style)**
  *   **Signature:** Q1(A) + Q4(B) + Q5(B).
  *   **Logic:** Value comes from the difficulty of the achievement. The forger took the easy path (solution already existed), so the work is lesser, even if the history were known.
  *   *Distinguishing (b) from (c):* Look at Q1. Leaf (b) says the work is *different* (C). Leaf (c) says the work is *devalued* because the feat was easy (A). If they choose Q1(C) but Q4(A), they are likely (b). If they choose Q1(A) but Q4(B), they are likely (c).

  **Leaf (d): Moralist**
  *   **Signature:** Q1(B) + Q3(A) + Q2(B).
  *   **Logic:** The object is fine (B), the lie is the problem. Honest copies are respectable (Q3-A).

  **Leaf (e): Sociological/Market**
  *   **Signature:** Q6(A) + Q7(B) + Q10(B).
  *   **Logic:** Value is real but constituted by social agreement. The poem's status changes (Q6/Q7), and digital ownership creates value (Q10-B).

  **Leaf (f): Category Skeptic**
  *   **Signature:** Inconsistent answers on Q1, Q3, and Q8, often selecting "problem is confused" options if available, or oscillating between Moral and Aesthetic.
  *   **Logic:** They reject the premise that "forgery" is an aesthetic category.

  **Leaf (g): Media Specificist**
  *   **Signature:** Q1(C) or (A) + Q8(B).
  *   **Logic:** They see forgery in painting (Q1) but deny it is possible in performance/music (Q8-B).

  ***

  ### Part 4: Limitations & The Eleventh Question

  **Unseparable Leaves:**
  This instrument struggles to definitively separate **Leaf (b) (Historical Essentialist)** from **Leaf (c) (Achievement Theorist)** in cases where the history is both *false* and *easy*. Both views condemn the fake, but for different reasons (Identity vs. Merit). In Q1, both might reject the fake's value. In Q4 (Workshop), both might reject the attribution.

  **The Eleventh Question:**
  To separate them, you need a case where the history is *false* but the achievement is *hard*.
  *Stem:* A forger spends twenty years mastering a lost technique to create a perfect fake of an ancient style. No one is deceived; it is sold as a modern homage.
  *   A. It is a masterpiece of technical skill, equal to the ancients. (Supports **Leaf c** — effort creates value).
  *   B. It is a skilled craft, but not art of that era. (Supports **Leaf b** — history defines the category).
  *   C. It is a waste of time, because the style is dead. (Supports **Leaf e/f**).

  ***

  ### Part 5: Note on Inconsistency

  If a student's answers scatter across the grid (e.g., Perceptualist on painting, Historical Essentialist on poetry), do not mark this as an error. This instrument measures intuitive commitments, which are often domain-specific. Inconsistency here is a finding, not a bug: it suggests the student holds a "cluster concept" of forgery that shifts depending on the medium or the stakes. In Week 10, if their answers cluster more tightly, they have adopted a theory. If they remain scattered but can articulate why the cases differ, they have adopted a contextualist view. If they remain scattered and cannot explain the shift, they are operating on unexamined intuition.
