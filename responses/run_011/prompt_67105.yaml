  **Question 2**

  **Bare-Tone Hedonism**

  Consider the following position, termed "Bare-Tone Hedonism." It consists of three clauses:

  1.  There is a single simple phenomenal property—a "hedonic tone"—present in every case of sensory pleasure and the same property in each of them. This property is as numerically alike in the pleasure of warm bread, in a stretch after sitting too long, and in following a piece of music to its cadence, as redness is in a tomato and a fire engine on a naive view of colour.
  2.  Hedonic tone is not a separable ingredient of experience: it is never instantiated on its own but only as a way in which an experience presents its object, so that two pleasures differing in what they are of differ in the manner of instantiation and never in the tone itself.
  3.  It follows that all pleasures are commensurable—differing in degree of tone, not in kind—and that nothing about the object or manner of a pleasure bears on its value, which is fixed by tone alone; on this view, higher and lower pleasures collapse into a difference of quantity.

  **Task**

  The heterogeneity objection claims that pleasures share no common phenomenal quality. Evaluate whether Clause 2 gives Bare-Tone Hedonism a genuine answer to this objection or merely a way of declining to answer it. Specifically, argue whether the distinction between hedonic tone and the manner of its instantiation can be drawn from inside the view's own resources, or whether it is presupposed by the view without explanation. Your answer should demonstrate whether the view remains coherent when pressed on the relationship between the tone's unity and its mode of presence.

  ***

  **Model Answer**

  Bare-Tone Hedonism attempts to salvage classical hedonism from the heterogeneity objection by positing a universal phenomenal property that is nonetheless inseparable from the specific content of experience. To evaluate whether Clause 2 answers the objection or merely dodges it, we must determine if the "tone/manner" distinction is explanatory or stipulative.

  The heterogeneity objection, famously associated with Ryle, argues that because the feeling of pleasure varies wildly across different activities, there is no single "feel" common to all. Sidgwick's view that pleasure is a feeling apprehended as desirable struggles here, as it implies a identifiable sensation. Bare-Tone Hedonism accepts the unity of the tone (Clause 1) but denies its separability (Clause 2). It claims the tone is constant, but always modified by the manner of instantiation.

  Does this answer Ryle? If the tone is never experienced apart from a manner, the claim that it is "numerically alike" across experiences becomes empirically idle. We cannot point to the tone independently of the bread or the music. If the distinction cannot be drawn from inside the view—that is, if there is no phenomenological method to isolate the tone from the manner—then Clause 2 functions as a protective stipulation rather than an explanation. It declares unity without providing a criterion for identifying that unity across heterogeneous experiences. In this sense, it declines to answer the objection by redefining "same property" to mean "property that cannot be compared independently."

  However, the view might find unexpected support from affective neuroscience. The dissociation of "liking" (hedonic impact) from "wanting" (incentive salience) suggests that hedonic tone is a distinct functional process, even if phenomenologically intertwined with content. If clinical cases show "liking" persisting without specific objects or "wanting" occurring without "liking," this empirical separability might vindicate Clause 1's claim to a unified core, even if Clause 2 insists on phenomenal inseparability. This would allow the view to argue that the tone is real because it can be manipulated independently, even if not experienced independently.

  Yet a deeper tension arises between Clause 2 and Clause 3. Clause 3 asserts that value is fixed by tone alone, implying that maximizing tone maximizes value regardless of manner. This invites the Experience Machine objection: if tone is all that matters, a wirehead arrangement supplying pure tone should be optimal. But Clause 2 states tone is never instantiated apart from a manner of presenting an object. A wirehead supplying tone without an object (or with a null object) may violate Clause 2. If tone requires a manner, and manner requires an object, then pure tone is impossible. If pure tone is impossible, Clause 3's claim that value is fixed by tone alone collapses, because you cannot vary tone without varying manner.

  Thus, Clause 2 fails to fully answer the heterogeneity objection because it renders the tone inaccessible to verification, making the unity claim presupposed rather than demonstrated. Furthermore, by binding tone to manner, it undermines the commensurability required by Clause 3. The view either accepts that manner matters (abandoning pure hedonism) or insists on pure tone (violating the inseparability clause). Consequently, Bare-Tone Hedonism offers a sophisticated decline rather than a solution, preserving the label of hedonism at the cost of its internal coherence.

  ***

  **Marking Scheme**

  **Total Marks: 25**

  **Must-Hit Moves (5 marks each)**

  1.  **Accurate Reconstruction of the Heterogeneity Objection:** The answer must clearly state that the objection denies a common phenomenal quality across diverse pleasures (Ryle's point) and explain why this threatens Clause 1.
  2.  **Analysis of the Tone/Manner Distinction:** The answer must examine Clause 2's claim that tone is inseparable from manner, assessing whether this renders the "sameness" of tone verifiable or merely asserted.
  3.  **Evaluation of "Answer vs. Decline":** The answer must take a stance on whether Clause 2 explains the unity or simply stipulates it to avoid falsification (presupposition vs. internal derivation).
  4.  **Integration of Neuroscience (Liking/Wanting):** The answer should utilize the incentive-salience material to discuss whether empirical dissociation supports the existence of a unified hedonic core despite phenomenal inseparability.
  5.  **Identification of Clause 2/3 Tension:** The answer must identify the conflict between inseparability (Clause 2) and commensurability/value-fixing (Clause 3), specifically regarding the viability of wireheading or the Experience Machine.

  **Specific Mistakes (Penalty and Explanation)**

  1.  **Syllabus Regurgitation (-5 marks):** Treating the question as an invitation to summarize Sidgwick or Feldman without applying their arguments specifically to the three clauses of Bare-Tone Hedonism.
      *   *Why tempting:* Students often default to safe, memorized summaries of known authors rather than engaging the invented view.
  2.  **Assuming Clause 2 Solves the Problem (-5 marks):** Accepting the tone/manner distinction as a valid solution without critiquing its verifiability or explanatory power.
      *   *Why tempting:* The view is presented persuasively in the prompt; students may lack the confidence to challenge the provided definition.
  3.  **Ignoring the Clause 2/3 Tension (-5 marks):** Failing to notice that if tone requires manner, pure tone maximization (Clause 3) may be impossible.
      *   *Why tempting:* This requires synthesizing two separate clauses against each other rather than treating them as a unified block.

  **Grade Differentiation**

  An A-range answer will successfully execute all five must-hit moves, particularly by leveraging the neuroscience material to complicate the phenomenological claim and by exposing the internal tension between Clause 2 and Clause 3. A B-range answer will typically secure marks for Moves 1, 2, and 3 by accurately explaining the heterogeneity objection and the tone/manner distinction, but will fail to reach the deeper structural critiques in Moves 4 and 5, often treating the view as more coherent than it is or relying too heavily on standard syllabus objections without adapting them to the specific constraints of Bare-Tone Hedonism.
