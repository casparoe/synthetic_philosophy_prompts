answer: |-
  This is a classic case of verbal dispute masking a substantive disagreement, compounded by category errors between metaphysics, epistemology, and decision theory. Your hunch is correct: the Physics PhD is smuggling an epistemic limit into a metaphysical claim, and the Forecasting Optimist is inferring metaphysical fixity from statistical regularity.

  Here is the menu of precise claims "the future is open" could be making, evaluated against your criteria.

  ### The Menu of "Open Future" Claims

  **1. The Epistemic Reading**
  *   **Claim:** "No agent currently possesses sufficient information to deduce the specific state of the world at time $t+1$ with certainty."
  *   **Status:** Trivially True (for non-trivial $t$).
  *   **Compatible with Determinism?** Yes. (The world can be determined but unknown.)
  *   **Prediction Ceiling?** No. Ignorance is reducible; better data and models improve accuracy without bound until physical limits are hit.

  **2. The Physical Indeterminism Reading**
  *   **Claim:** "The laws of physics are stochastic; the present physical state does not uniquely fix a single future physical state."
  *   **Status:** Substantive and Defensible (standard interpretation of Quantum Mechanics).
  *   **Compatible with Determinism?** No.
  *   **Prediction Ceiling?** Theoretically Yes, Practically No. It imposes a hard ceiling on *certainty* (you cannot predict 100%), but not on *calibration*. Macro-scale events (geopolitics) average out quantum noise; probabilistic prediction remains viable.

  **3. The Semantic Indeterminacy Reading (Aristotelian)**
  *   **Claim:** "Propositions about future contingent events currently possess no truth value (they are neither true nor false)."
  *   **Status:** Substantive and Controversial (depends on your logic of time).
  *   **Compatible with Determinism?** Yes. (Causation can be fixed even if truth-values are not yet assigned.)
  *   **Prediction Ceiling?** No. A prediction is a claim that *will become* true or false. Calibration is measured retroactively; the lack of a *current* truth value does not prevent a *future* truth value from matching the probability assigned.

  **4. The Branching Time Reading (Modal Realism of Futures)**
  *   **Claim:** "The temporal structure of reality is a tree where multiple distinct future branches are equally real, and 'actuality' is indexical to a specific path."
  *   **Status:** Substantive and Defensible (coherent in temporal logic and Everettian QM).
  *   **Compatible with Determinism?** No (in the linear sense); Yes (in the sense that the branching structure itself is determined).
  *   **Prediction Ceiling?** No. This reading sounds incoherent only if you imagine all branches happening "here." Instead, think of it as a map: the road splits. Predicting "50% left, 50% right" is perfectly calibrated even if both paths exist in the map. You only experience one path, allowing for retroactive scoring.

  **5. The Agentive Openness Reading (Libertarian Free Will)**
  *   **Claim:** "At the moment of choice, an agent has access to multiple physically possible courses of action not fully determined by prior states."
  *   **Status:** Substantive and Controversial (rejected by most physicalists, defended by incompatibilists).
  *   **Compatible with Determinism?** No.
  *   **Prediction Ceiling?** No. Human behavior is statistically regular even if individually "free." Aggregate predictions (markets, elections) remain highly predictable despite individual agency.

  **6. The Ontological Openness Reading (Presentism/Growing Block)**
  *   **Claim:** "Future events do not yet exist in any ontological sense, whereas past events do."
  *   **Status:** Substantive and Defensible (metaphysically coherent, though empirically indistinguishable from Block Universe).
  *   **Compatible with Determinism?** Yes. (The future can be determined by laws without currently 'existing'.)
  *   **Prediction Ceiling?** No. Non-existence does not imply unpredictability. A rocket's trajectory is predictable before the rocket is built; similarly, a future event can be predictable before it exists.

  ***

  ### Diagnosis of the Chat

  **The Physics PhD** was invoking **Reading 2 (Physical Indeterminism)** but conflating it with **Reading 1 (Epistemic)**.
  *   **The Error:** He assumed that because micro-physics is indeterministic, macro-events (geopolitics) inherit a "hard ceiling" on predictability. He is smuggling in the assumption that "Open" implies "Randomized." An open future can still be heavily biased (e.g., 90% chance of X), which allows for high calibration scores. He is also scaling quantum indeterminacy up to the macro scale without justification (decoherence usually washes this out).

  **The Forecasting Optimist** was invoking a negation of **Reading 6 (Ontological Openness)** or a confusion of **Reading 1**.
  *   **The Error:** They inferred that because we *can* predict well, the future must be "written" (Block Universe). This is a non-sequitur. High calibration implies the *process* generating the future is stable and modelable, not that the future events ontologically exist right now. You can have perfect calibration in a branching universe or a presentist universe.

  **Is there a genuine contradiction?**
  Only if they both agree on **Reading 2**.
  *   If "Open" means "Physically Indeterministic," then the Physicist says "True" and the Forecaster says "False."
  *   However, the Forecaster's evidence (tournament results) does not actually falsify Physical Indeterminism. Good probabilistic forecasting is perfectly compatible with a stochastic universe. So even on this reading, the Forecaster is wrong to claim their results *prove* the future isn't open.

  **The One-Sentence Comeback:**
  "Calibration measures the reliability of your probability estimates against frequencies, not the metaphysical determinacy of the events; a stochastic future can still be perfectly forecastable in expectation."

  ***

  ### The Asymmetry Question

  You asked whether "the past is fixed and the future is open" names a deep asymmetry, and if any reading delivers it.

  1.  **Epistemic (Reading 1):** Delivers an asymmetry, but it is **contingent**, not deep. We *happen* to have more records of the past. In principle, we could have perfect records of the future (via prediction) and lose records of the past (via entropy/amnesia).
  2.  **Physical (Reading 2):** **Symmetric.** Fundamental laws (mostly) work the same forward and backward. Indeterminism applies to retrodiction just as much as prediction (you can't perfectly reconstruct the past quantum state either).
  3.  **Semantic (Reading 3):** Delivers an asymmetry. Past propositions have truth values; future ones don't (yet). But this is a feature of language/logic, not necessarily the world.
  4.  **Ontological (Reading 6):** Delivers the **strongest asymmetry**. The past exists; the future does not. This is the only reading that makes "fixed vs. open" a fundamental structural difference in reality.
  5.  **Thermodynamic (Implicit):** Delivers a **practical asymmetry**. Entropy increases toward the future. This creates the "arrow of time" that makes prediction harder than retrodiction (because signals degrade forward, not backward), but this is a gradient, not a binary open/closed switch.

  **Verdict:** None of the readings that allow for successful forecasting (which is what you care about) rely on the asymmetry being a *barrier* to prediction. The asymmetry is real in the Ontological and Thermodynamic senses, but neither entails the Physics PhD's claim that there is a "hard ceiling" on calibration. The ceiling he imagines exists only if you confuse "Open" with "Maximum Entropy."

  **Summary:** The Physics guy is treating "Open" as a synonym for "Unpredictable." It isn't. It just means "Not Uniquely Determined." You can have high-confidence predictions in a non-uniquely determined world, provided the probability distribution is narrow.
