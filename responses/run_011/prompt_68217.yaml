  Here is the breakdown you asked for. I have treated your nine verdicts as a dataset to reverse-engineer the underlying logic of your skepticism. You are correctly sensing that your current rule (interference must kill the effect) is too narrow, but you are also right to worry that dropping it opens the floodgates to weak correlational claims.

  ### Part 1: Brainstorming Candidate Principles

  Here are three ways to formalize your gut, along with the cost of each.

  **Candidate 1: The "Verbal Interference" Principle**
  *   **The Rule:** A claim counts only if the effect disappears when inner speech is blocked (e.g., shadowing task).
  *   **Motivation:** This captures your highest-confidence case (Russian Blues). It proves language is the *mechanism*, not just a correlate. It cleanly kills the "Hopi Time" and "Snow Vocabulary" claims because those are usually argued as deep conceptual shifts that shouldn't vanish under load.
  *   **The Cost:** This forces you to reject the **Absolute Space (Case 3)** finding. If speakers track North while blindfolded, they aren't subvocalizing "North" every second; it's a habitual cognitive map. If you demand interference kills the effect, you classify this as "culture" or "training," not language. You explicitly said this is the case you find "most moving." This principle cuts off your strongest leg.

  **Candidate 2: The "Habitual Attention" Principle**
  *   **The Rule:** A claim counts only if the effect persists in non-verbal tasks *without* verbal interference, showing a deep-seated cognitive habit.
  *   **Motivation:** This saves **Absolute Space (Case 3)** and **Accident Memory (Case 8)**. It aligns with the classic Whorfian idea that language trains your attention over a lifetime.
  *   **The Cost:** This forces you to downgrade **Russian Blues (Case 1)**. Under this rule, the Russian Blue effect isn't "thought," it's "strategy." It becomes a finding about how people use tools to solve problems, not how they perceive the world. You would have to move Case 1 from "BELIEVE" to "HALF BELIEVE (Tool Use)." Given you trust the mechanism there more than any other, this is a painful trade.

  **Candidate 3: The "Anti-Confound" Principle**
  *   **The Rule:** A claim counts if it rules out culture, economics, and vocabulary size as the primary driver, focusing strictly on grammatical structure.
  *   **Motivation:** This cleanly kills **Future Tense/Economics (Case 6)**, **Snow Vocabulary (Case 9)**, and **Gendered Bridges (Case 2)**. It protects you from the "language family travels with wealth" problem.
  *   **The Cost:** This is necessary but not sufficient. It doesn't help you distinguish between Case 1 (Online) and Case 3 (Habitual). It also doesn't solve your tension about interference. You could have a structurally perfect study that is still just priming (like Case 2). This principle filters out the noise but doesn't define the signal.

  ***

  ### Part 2: The Committed Principle

  I recommend you adopt **The "Obligatory Encoding & Mechanism Transparency" Principle.**

  This principle acknowledges that "language shaping thought" actually refers to two distinct phenomena: *Thinking-for-Speaking* (online tool use) and *Habitual Cognition* (trained attention). Your gut accepts both; your rule should too, but it must demand the study specify which one it is.

  **The Rule for Fact-Checkers:**
  > Accept a "Language Shapes Thought" claim only if it meets all four of the following criteria:
  >
  > 1.  **Non-Verbal Behavior:** The effect must manifest in a task that does not require speech output (e.g., color discrimination, navigation, memory recall, card sorting).
  > 2.  **Obligatory Encoding:** The linguistic feature driving the effect must be grammatically obligatory (e.g., grammatical gender, required spatial frames, obligatory aspect), not optional vocabulary or lexical association.
  > 3.  **Mechanism Transparency:** The authors must identify the mechanism as either **Online Coding** (effect vanishes under verbal interference) OR **Habitual Attention** (effect persists under interference or occurs in contexts where coding is impossible). Claims that do not test or specify this are rejected.
  > 4.  **Capacity & Confound Exclusion:** The claim cannot assert a loss of cognitive *capacity* (e.g., "cannot conceive of time"), and it cannot rely on macro-level correlations (e.g., economics, health) without experimental control.

  **Why Each Clause Is There (and What It Costs):**

  *   **Clause 1 (Non-Verbal Behavior):**
      *   *Motivation:* Driven by **Case 1 (Russian Blues)**, **Case 3 (Absolute Space)**, and **Case 8 (Accident Memory)**. If the task is just rating adjectives or answering survey questions, you are measuring opinion or association, not cognition.
      *   *Cost:* This kills **Case 2 (Gendered Bridges)**. Rating a bridge as "elegant" is a verbal/semantic task, not a behavioral one. It also kills many "moral dilemma" studies if the output is just a button press on a verbal scenario without behavioral follow-through.
  *   **Clause 2 (Obligatory Encoding):**
      *   *Motivation:* Driven by the rejection of **Case 9 (Snow)** and **Case 2 (Bridges)**. Vocabulary size is a tool, not a structure. Grammatical obligation forces the speaker to attend to a feature every time they speak; vocabulary allows them to ignore it.
      *   *Cost:* This makes you reject studies about "emotion words" or "color terms" unless those terms map onto a grammatical boundary (like Russian *siniy/goluboy*). It raises the bar for what counts as "linguistic."
  *   **Clause 3 (Mechanism Transparency):**
      *   *Motivation:* This resolves your tension between **Case 1** and **Case 3**. It allows you to believe both, provided the study admits what it is. Case 1 is valid *because* interference kills it (Online). Case 3 is valid *because* it works without speech (Habitual).
      *   *Cost:* It rejects any study that claims "language shapes thought" without testing for interference or contextual stability. Many press releases will fail here because they don't know the difference.
  *   **Clause 4 (Capacity & Confound Exclusion):**
      *   *Motivation:* Driven by **Case 5 (Pirahã)**, **Case 6 (Economics)**, and **Case 4 (Hopi)**. You cannot claim people *can't* think something; you can only claim they *default* to thinking differently. You cannot claim causation from national savings rates.
      *   *Cost:* This forces you to be very precise with **Case 5**. You must reject the "can't think about exact quantity" gloss and accept only the "performance deficit on matching tasks" finding.

  ***

  ### Part 3: The Sacrifice

  There is one verdict in your list that this principle cannot accommodate without reclassification.

  **The Sacrifice: Case 7 (Bilingual Trolley Dilemmas).**
  *   **Your Verdict:** HALF BELIEVE (Real effect, but emotional distance).
  *   **The Principle's Verdict:** **REJECT as Linguistic Relativity.**
  *   **Why:** The "Foreign Language Effect" in moral dilemmas does not rely on *Obligatory Encoding* (Clause 2). It relies on proficiency and emotional resonance. It is not that the grammar of the second language restructures the concept of "harm"; it is that the second language is processed with less amygdala activation.
  *   **Advice:** Move this out of the "Language Shapes Thought" bucket entirely. Label it "Language Modulates Emotion." It is a real finding, but it is not Whorfian. Keeping it in the Whorf bucket dilutes the structural claims of Cases 1, 3, and 8. If you want a tidy principle, you must stop calling this "thinking differently" and start calling it "feeling differently."

  ***

  ### Part 4: Three New Cases for Your Fact-Checker

  Here are three realistic press releases that would cross your desk, and how the principle applies.

  **1. The "Motion Verbs" Press Release**
  *   **The Claim:** "Speakers of languages that describe motion by manner (e.g., 'running') vs. path (e.g., 'entering') remember different details of a video clip."
  *   **The Setup:** Participants watch a video of a man running into a house. Later, they are shown two clips: one where the man runs into a *different* house, one where he *walks* into the original house. They must pick the original.
  *   **Principle Application:**
      *   *Non-Verbal Behavior?* Yes (memory recognition).
      *   *Obligatory Encoding?* Yes (verb-framed vs. satellite-framed languages oblige speakers to encode path or manner).
      *   *Mechanism?* If the study shows the effect persists when participants are prevented from describing the video verbally during encoding, it passes (Habitual). If it vanishes, it passes (Online).
      *   *Verdict:* **ACCEPT** (provided mechanism is tested). This is structurally similar to your Case 8.

  **2. The "Color Memory" Press Release**
  *   **The Claim:** "Speakers of a language with no word for 'blue' cannot remember blue chips as well as speakers who have the word."
  *   **The Setup:** A memory task where participants view colored chips and later select them from an array.
  *   **Principle Application:**
      *   *Non-Verbal Behavior?* Yes.
      *   *Obligatory Encoding?* **NO.** This is vocabulary, not grammar. Having a word is a tool, not a structural obligation.
      *   *Verdict:* **REJECT.** This violates Clause 2. It is the "Fifty Words for Snow" claim in disguise. Even if they find a difference, it is a memory-tool effect, not a conceptual restructuring.

  **3. The "Future Savings" Press Release (Variant)**
  *   **The Claim:** "New experimental study shows speakers of futureless languages choose smaller immediate rewards less often in a lab game."
  *   **The Setup:** A controlled lab experiment (not economic data) where speakers play a token-exchange game.
  *   **Principle Application:**
      *   *Non-Verbal Behavior?* Yes (game choices).
      *   *Obligatory Encoding?* Yes (grammatical tense).
      *   *Capacity & Confound?* **FAIL.** Even in a lab, language families cluster with cultural attitudes toward delayed gratification. Unless they test bilinguals (switching languages) or use priming to manipulate the linguistic frame *within* subjects, you cannot rule out culture.
      *   *Verdict:* **REJECT.** It violates Clause 4 (Confound Exclusion) because it relies on between-subject language groups without causal manipulation of the language itself.

  ***

  ### Part 5: Straight Answer on the Tension

  You wrote: *"I already know (i) and (ii) are pulling in opposite directions... the case I'm most confident about is the one where the effect dies under verbal interference, and the case I find most moving is the one where the effect obviously can't be subvocalization."*

  You do not need to choose between them, but you must stop treating them as the same phenomenon.

  *   **Case 1 (Russian Blues)** is evidence that language is a **tool** we use to sharpen perception in the moment. It is "Thinking-for-Speaking." It is fragile.
  *   **Case 3 (Absolute Space)** is evidence that language is a **training regimen** that calibrates our cognitive compass over a lifetime. It is "Habitual Cognition." It is robust.

  **My Advice:**
  Do not change your mind on either verdict. They are both valid. But change your **terminology**. When you write about Case 1, do not say "Russian speakers see the world differently." Say "Russian speakers use language to discriminate faster." When you write about Case 3, *then* you can say "Speakers navigate using a different cognitive map."

  The principle I gave you protects this distinction. It allows you to run both stories, but it forces the press release to admit which one it is. If a press release claims a "deep conceptual shift" (like Case 3) but the effect dies under verbal interference (like Case 1), you have caught them lying. If they claim "online coding" but the effect persists through interference without explanation, they haven't done their homework.

  Your gut was right; your rule was just trying to do two jobs with one clause. Split the clause, keep the verdicts, and drop the Trolley case from the Whorfian canon.
