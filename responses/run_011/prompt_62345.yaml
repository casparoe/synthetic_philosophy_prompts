      *   *Required vs. Comfortable:*
          *   *Required:* To maintain the contract of "Historical Fiction" vs. "Fantasy/Alt-History," the scaffold must remain recognizable.
          *   *Comfortable:* The interiority assumption is a convenience. It allows the novelist to function as a medium without claiming divine inspiration. It avoids the hard work of radical alterity.

      *   *Consistency:*
