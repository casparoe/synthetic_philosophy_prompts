answer: |-
  The convention you describe presupposes a theory of history that might be termed **Positivist Empiricism grafted onto Romantic Universalism.** It is a dualistic ontology that divides the past into two distinct categories of being: the *Scaffold* (external, verifiable events and persons) and the *Ghost* (internal, unverifiable consciousness).

  Here is the reconstruction of that implicit theory, broken down by the mechanisms you identified.

  ### 1. The Ontology of the Note: Why Persons Matter and Minds Do not
  The convention operates on the assumption that **existence is a binary fact, but consciousness is a universal constant.**

  *   **Adding a Person (The Scaffold):** To invent a housemaid or a meeting is to alter the coordinate system of the past. It introduces a variable where the record says there was none. This violates the Positivist contract: history is the sum of recorded occurrences. To add an occurrence is to falsify the data set. Therefore, it must be confessed.
  *   **Supplying Interiority (The Ghost):** To invent a queen's private thoughts is not seen as falsification because the theory assumes consciousness is transhistorical and accessible. It presupposes that the "truth" of a human being is not located in their specific, culturally-constructed psyche, but in a universal emotional core that the novelist can access via empathy.
      *   **The Implicit Claim:** "I did not invent her grief; I merely located it." The note remains silent here because, under this theory, the interior life is not *data* to be verified, but *essence* to be revealed. The novelist claims the authority of a medium, not a fabricator. To disclose this as invention would be to admit that the "human nature" bridging the centuries is itself a fabrication.

  ### 2. The Treatment of Silence: Vacant Ground vs. Structural Erasure
  When the record goes quiet regarding the enslaved or the colonised, the standard note treats this silence as **absence of evidence**, not **evidence of absence.**

  *   **The Presupposition:** The historical record is a net that missed some fish. The gaps are accidental. Therefore, the novelist is performing a restorative act by populating these voids with plausible human beings.
  *   **The Ruled-Out Account:** This convention quietly rules out the historiographical account that the record is an **archive of power.** It denies the possibility that the silence is intentional, structural, and constitutive of the history itself. By treating the silence as "vacant ground," the note implies that the past was waiting for a voice, rather than recognizing that the past actively suppressed certain voices. It assumes the novelist has the right to speak *for* the silenced, rather than speaking *about* the silencing.

  ### 3. Required vs. Comfortable
  We must distinguish between what the genre's contract *requires* and what it merely finds *comfortable*.

  *   **Strictly Required:** The convention *requires* the disclosure of invented major events or persons that would alter the causal chain of public history. If a novelist lets a real king die in a battle he historically won without a note, they break the contract of "Historical Fiction" and enter "Alternate History." The scaffold must remain recognizable for the label to hold.
  *   **Merely Comfortable:** The silence regarding interiority is not required; it is comfortable. It protects the novelist from the charge of hubris. It allows the reader to indulge in the fantasy of knowing the past "as it really felt" without confronting the epistemological barrier between the living and the dead. It also protects the *subject*: imagining a queen's thoughts flatters her humanity; imagining an enslaved person's thoughts risks appropriating a trauma the novelist cannot claim. The note hides this asymmetry.

  ### 4. Is the Inconsistency Load-Bearing?
  **Yes.** The inconsistency is not a bug; it is the structural support of the genre's market position.

  *   **The Tension:** Historical fiction sells itself on two conflicting promises: **Accuracy** (you will learn the truth) and **Immersion** (you will feel the experience).
  *   **The Function of the Lie:** If the Author's Note admitted, "I have invented the Queen's motives because the record does not contain them," the promise of Accuracy collapses. The reader would realize they are not accessing the past, but observing the novelist's projection.
  *   **Load-Bearing Hypocrisy:** The note must confess the small lies (the maid) to establish credibility, so that it can conceal the big lie (the mind) to maintain immersion. If the note were fully consistent—if it treated interiority with the same skepticism as invented events—the novel would cease to function as a window into the past and would become a mirror of the author's presentism. The genre relies on the reader accepting the interiority as "true enough," a status the note protects by omission.

  ### 5. Rival Accounts Ruled Out
  By adhering to this convention, the standard note implicitly rejects:
  *   **Historicism:** The idea that consciousness is period-specific and that a 17th-century queen's "private thoughts" would be unintelligible or fundamentally alien to a 21st-century mind.
  *   **Subaltern Studies:** The idea that the silence of the marginalized is a political fact that should not be filled with ventriloquism.
  *   **Skeptical Empiricism:** The idea that we cannot know *why* historical actors acted, only *that* they acted.

  ### 6. The Alternative Note
  If a novelist were to write a note under the conception that **the surviving record is an index of who was permitted to write**, and that **interiority is speculative**, the note would look radically different. It would shift from an apology for fabrication to a confession of projection.

  **Example of an Alternative Author's Note:**

  > *This novel is built upon a scaffold of verified events, but it inhabits a house of speculation. Where the record lists a name, I have supplied a pulse; where it records a transaction, I have imagined a motive. The reader should understand that the private thoughts attributed to Queen Mary are not recovered truths, but my own contemporary projections onto a historical silhouette. We possess her signatures, but not her silence.*
  >
  > *Furthermore, the gaps in this narrative regarding the enslaved workforce are not empty spaces I have filled, but walls I have struck. The archive is silent on their lives not because they were unimportant, but because their humanity was legally excluded from the record. To invent their voices would be to repeat the erasure by assuming I can speak them. Instead, I have marked their absence. Where you feel a void in this story, that is not a failure of my imagination, but the shape of the history itself.*
  >
  > *I have not distinguished fact from fiction to protect the truth of the past, but to clarify the limits of my own access. Everything that bleeds, thinks, or whispers in these pages is a fabrication. Only the stone remains.*

  ***

  **Summary of the Reconstruction:**
  The standard convention presupposes a past that is **externally rigid but internally porous.** It assumes the novelist is a trespasser regarding *events* (which belong to the historians) but a resident regarding *emotions* (which belong to humanity). It treats the archive as a incomplete puzzle rather than a curated weapon. To change the note is to change the genre: it moves from "bringing the past to life" to "interrogating the distance between the present and the dead."
