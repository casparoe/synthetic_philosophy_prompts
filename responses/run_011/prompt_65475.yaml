answer: |-
  # Q&A PREP SHEET: LAKATOS & ML SCALING

  ## 1. PRE-EMPTIVE CONCESSIONS (First 3 Minutes)
  *Insert these into your introduction to disarm Objections 2, 5, and 6.*

  *   **On Retrospection:** "I am not claiming we can read a programme's mind in real time. I am claiming we can read its *review logs* and *benchmark changelogs* in real time. The hard core is sediment, yes, but the negative heuristic leaves a paper trail of rejected data *before* the sediment hardens."
      *   *Protects Claim 3:* Distinguishes between knowing the core (hard) and seeing the rejection (visible).
  *   **On Normativity:** "Widening admissibility is not 'accepting garbage.' It is accepting *new kinds of risk*. Narrowing is refusing risk by redefining the task. My criterion penalizes safety, not error."
      *   *Protects Claim 3:* Prevents the "why not admit astrology" objection.
  *   **On Engineering:** "I am not saying benchmark pruning is technically wrong. I am saying it is *epistemically costly*. You can buy performance by buying silence. My framework prices that silence."
      *   *Protects Application:* Validates practitioner success while maintaining critical stance.

  ---

  ## 2. THE QUESTIONS (Ordered by Likelihood × Damage)

  ### Q1: The Fidelity Challenge (Economist)
  **"You've kept Lakatos's vocabulary but gutted his definitions. If progress isn't about novel facts but about 'admissible data,' you've lost the normative force that separates science from sophistry. Why call this Lakatosian at all?"**
  *   **Type:** Systematic (Framework)
  *   **Reply:** "Because the normative force of the original framework relied on a hindsight we don't have. If we wait thirty years for 'novel facts,' we cannot guide current practice. By shifting to admissibility, I keep the *structure* of hard core/belt but make the *engine* visible. It's Lakatos updated for high-velocity fields where 'facts' are manufactured faster than they are verified. I'm saving the apparatus from obsolescence, not discarding it."
  *   **Soft Spot:** You admit the definition of progress has changed.
  *   **Follow-up:** "So is this a new theory or a repair job?"

  ### Q2: The Observability Challenge (Ethnographer)
  **"You say admissibility is visible in the record. In my fieldwork, decisions about data exclusion happen in Slack channels and off-record meetings, not in referee reports. How do you see 'narrowing' if the gatekeeping is invisible?"**
  *   **Type:** Systematic (Claim 3)
  *   **Reply:** "You're right that private deliberation is hidden. But the *outcome* of that deliberation—the benchmark version number, the dataset card, the API documentation—is public. When a benchmark is updated and previous SOTA results become uncomparable, that is a material trace of narrowing. I don't need the Slack log to see the benchmark changed. The artifact bears the scar of the exclusion."
  *   **Soft Spot:** Relies on artifacts being honest traces (they often aren't).
  *   **Follow-up:** "What if the changelog lies?"

  ### Q3: The Engineering Defense (Practitioner)
  **"We prune benchmarks because they're saturated or noisy. That's not 'narrowing admissibility' to save the core; it's removing confounders to measure signal. Why is good data hygiene 'degenerating' in your view?"**
  *   **Type:** Systematic (Application)
  *   **Reply:** "Hygiene removes noise; narrowing removes *surprise*. If you prune a benchmark because the model failed in a way you didn't expect, and you label that failure 'out of scope,' that is narrowing. If you prune because the metric is mathematically broken, that is hygiene. My claim is the scaling programme increasingly does the former: reclassifying capability discontinuities as metric artifacts rather than investigating the behavior."
  *   **Soft Spot:** Your "partial answer" (who/when) is the only way to tell hygiene from narrowing.
  *   **Follow-up:** "Who decides what counts as a surprise?"

  ### Q4: The Formalist Attack (Bayesian)
  **"This sounds like you're just describing a prior that refuses to update. If I assign low likelihood to certain data, that's rational. Why is holding a prior fixed 'degenerating' rather than just having strong convictions?"**
  *   **Type:** Systematic (Framework)
  *   **Reply:** "Because a Bayesian prior updates when the likelihood ratio is overwhelming. My criterion asks: do you change the *sample space* to avoid the update? If you exclude the data from the likelihood calculation entirely by calling it 'inadmissible,' you aren't doing Bayesian updating; you're changing the experiment. That's not strong conviction; it's insulation."
  *   **Soft Spot:** Conflates 'data exclusion' with 'prior strength.'
  *   **Follow-up:** "Isn't model selection just excluding data structures?"

  ### Q5: The Contradiction Trap (Historian)
  **"In Claim 1 you say hard cores are sediment identified after the fact. In Claim 3 you say we can judge progress prospectively. If you can judge the programme now, haven't you already identified the hard core? You can't have it both ways."**
  *   **Type:** Exegetical (Claim 1 vs 3)
  *   **Reply:** "I identify the *rules of exclusion*, not the *propositions*. I see you rejecting data; I don't need to know exactly which proposition you're protecting to see that you're protecting *something*. The sediment forms later. The act of sweeping the floor is visible immediately. I'm tracking the sweeping, not the dust."
  *   **Soft Spot:** Metaphorically strong, logically loose.
  *   **Follow-up:** "How do you know it's protection and not just cleaning?"

  ### Q6: The Power Question (Ethnographer/Sociologist)
  **"You say the practitioners decide admissibility. In ML, that's industry labs. Your framework seems to validate their gatekeeping as 'methodology.' Aren't you just formalizing corporate control over what counts as truth?"**
  *   **Type:** Systematic (Political/Social)
  *   **Reply:** "I'm not validating it; I'm pricing it. If a programme progresses by narrowing admissibility, I call it 'asymmetric progress.' That is a critique, not a validation. It shows you are succeeding by reducing the world to fit the model, rather than expanding the model to fit the world. It exposes the power move as an epistemic cost."
  *   **Soft Spot:** Relies on the audience accepting 'asymmetric progress' as a negative.
  *   **Follow-up:** "Who pays the cost? The public, not the lab."

  ### Q7: The "Anything Goes" Worry (Economist)
  **"If widening the data set is progressive, why not admit astrology or tea-leaf reading? A programme that answers to everything is unconstrained. Don't you need a negative heuristic to stop it from becoming trivial?"**
  *   **Type:** Systematic (Normativity)
  *   **Reply:** "Widening isn't 'admitting everything.' It's admitting *risky* data. Astrology doesn't widen the set of physical predictions; it adds unfalsifiable narratives. My criterion demands the programme answer to *new kinds of empirical constraints*. If you admit tea-leaves, you must predict the tea-leaves. If you can't, you degenerate. The constraint is the requirement to predict the new data, not just talk about it."
  *   **Soft Spot:** "Risky" is doing too much work here.
  *   **Follow-up:** "How do we measure risk without hindsight?"

  ### Q8: The Utility Check (Practitioner)
  **"The models work. They write code, they solve protein folding. If the programme is 'degenerating' by your lights but solving real problems, what is the practical use of your critique? What should we do differently?"**
  *   **Type:** Systematic (Application)
  *   **Reply:** "If you only care about deployment, my critique is irrelevant. But if you care about *reliability* under distribution shift, narrowing admissibility is dangerous. You are building systems that work only in the world you allowed them to see. My framework warns that your 'success' is brittle because it was bought by excluding the contexts where the system might fail."
  *   **Soft Spot:** Assumes practitioners care about reliability over performance.
  *   **Follow-up:** "We test for that in deployment, not benchmarks."

  ### Q9: The Falsification Query (Bayesian)
  **"Lakatos wanted to save falsificationism. You've removed falsification entirely. If no data can refute the core because admissibility filters it first, what constrains the theory? What could prove you wrong?"**
  *   **Type:** Exegetical (Lakatos)
  *   **Reply:** "The constraint is the *cost* of narrowing. You can exclude data, but you lose explanatory scope. If you exclude enough, your theory explains nothing. The falsification isn't a single moment; it's a gradual loss of domain. The theory dies not by refutation, but by irrelevance. That is a softer constraint, but it's the only one that survives theory-laden data."
  *   **Soft Spot:** "Irrelevance" is hard to measure in real-time.
  *   **Follow-up:** "Irrelevance to whom?"

  ### Q10: The "New Demarcation" (Philosopher)
  **"You've replaced the demarcation between science and pseudoscience with the demarcation between widening and narrowing. But pseudoscience often widens (explaining everything). How do you stop your criterion from validating conspiracy theories?"**
  *   **Type:** Systematic (Framework)
  *   **Reply:** "Conspiracy theories widen the *narrative*, not the *empirical admissibility*. They explain the data, but they rarely submit to new, risky data tests. My criterion requires the programme to *submit* to new data classes, not just absorb old data into new stories. If the conspiracy theorist predicts a new kind of trace and finds it, they progress. If they just explain away the lack of traces, they narrow."
  *   **Soft Spot:** Complex distinction to make in 90 seconds.
  *   **Follow-up:** "That sounds like novel prediction again."

  ---

  ## 3. THE "MUST LAND" REPLY
  **Target:** Objection Q3 (The Engineering Defense).
  **Why:** If you cannot distinguish "good engineering hygiene" from "epistemic narrowing," your application to ML collapses. The practitioners will dismiss you as a philosopher who doesn't understand data cleaning.
  **The Line:** "Hygiene removes noise; narrowing removes surprise. If you prune a benchmark because the model failed in a way you didn't expect, and you label that failure 'out of scope,' that is narrowing."

  ---

  ## 4. THE "HOPE NOBODY ASKS" QUESTION
  **"You claim hard cores are retrospective sediment (Claim 1), but you judge the ML programme's progress prospectively (Claim 3). If you can identify the narrowing now, haven't you identified the hard core now? Isn't this the very retrospective historicism you criticized?"**
  *   **Honest Answer:** Yes, there is a tension. I am treating the *current* admissibility rules as if they are fixed enough to judge, while claiming they are fluid.
  *   **Risk:** Undermines the coherence of the thesis.
  *   **Mitigation:** Stick to the "Sweeping vs. Dust" metaphor (Q5 Reply). Insist on distinguishing *rules of exclusion* (visible) from *propositions of the core* (sediment).

  ---

  ## 5. HISTORIANS VS. BAYESIAN STRATEGY
  **Is it legitimate?**
  It is a **cheap trick** if used to dodge. It is **legitimate** only if used to synthesize.
  **The Move:** Do not pit them against each other. Use the Historian to ground the Bayesian.
  **The Sentence:** "The Bayesian wants a formal likelihood; the Historian says the likelihood is determined by material practice. My 'admissibility criterion' is the historical record of how the likelihood function was constructed."
  **Risk:** If you do this, the Bayesian will say "History isn't formal" and the Historian will say "Likelihood isn't material." You become the target.
  **Recommendation:** **Do not make this move.** It requires too much setup for a Q&A. Stick to the "Paper Trail" argument (Q2 Reply) which satisfies Historians (records) and Bayesians (data constraints).
