          *   *Classification:* Awkward (because it looks like reduction), but absorbable by the instrumentalist view.

      *   **(c) Representation Theorems (Ramsey/Lewis):**
          *   *Challenge:* If any coherent system *can* be described as maximizing utility, doesn't that make beliefs/desires real patterns (Dennett)?
          *   *Analysis:* Representation theorems show *possibility* of description, not *causal reality*. The user's view is instrumentalist.
          *   *Verdict:* **Merely Awkward (or even Supportive).** An instrumentalist *should* welcome this. It proves the utility of the framework without committing to the ontology. It shows why the instrument works (mathematical necessity), not that the posits exist.
