  7.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction on (a):* Double dissociations are actually a bigger problem for the user than I first thought. If the brain has a "belief module," then beliefs are arguably real *functional* states, even if not propositional. I need to mark this as **Serious**.
      *   *Correction on (d):* The tension between Caloric (false) and CoM (useful fiction) is the crux. If it's indispensable, it's not Caloric. Caloric was *dispensable*. Thermodynamics replaced it. If FP is indispensable, the analogy fails. I must highlight this.
