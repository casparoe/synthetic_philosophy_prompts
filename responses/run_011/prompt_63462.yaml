  *(Self-Correction on the Note)*: The prompt asks to split what's settled vs. live. Actually, *nothing* is truly settled on the Paradox of Fiction. I need to be careful not to imply there *is* a consensus. I should state that the paradox itself is the settled *problem*, but the solutions are live *debates*.

