  **Scenario**
  Alice and Bob coincide at Earth's center ($t=0, x=0$). Bob walks radially outward at $v=1.5\text{ m/s}$. Event $E$ is a thruster ignition on a probe orbiting Pluto. In Alice's frame, $E$ occurs at distance $x = 5.9 \times 10^{12}\text{ m}$ and time $t = 50\text{ }\mu\text{s}$. This interval is spacelike separated from the coincidence. Bob's simultaneity slice tilts toward $E$. Because $t$ is less than the relativistic shift induced by $v$, Alice reckons $E$ as future, while Bob reckons $E$ as past. All premises of the Rietdijk–Putnam argument are granted: Lorentz invariance holds, no frame is privileged, and co-reality is transitive. The geometry is exact. The question is whether this geometry forces the reality of a future meaningful to the observers.

  **Numbers and Verdict**
  1.  **Separation:** $5.9 \times 10^{12}\text{ m}$ (40 AU).
  2.  **Interval (Alice):** $5.0 \times 10^{-5}\text{ s}$.
  3.  **Disagreement Window:** $3.9 \times 10^{4}\text{ s}$ (Range of $t$ where order is frame-dependent).
  4.  **Shift (Bob):** $9.8 \times 10^{-5}\text{ s}$.
  **Verdict:** The argument reaches the event logically (order disagrees), but the "future" captured is sub-millisecond.

  **The Inversion**
  At $v=1.5\text{ m/s}$, the distance $x$ required for a shift $\Delta t$ is $x \approx c^2 \Delta t / v$.
  *   **1 Second:** $6.0 \times 10^{16}\text{ m}$ (6.3 light-years). This exceeds the Solar System (0.0006 ly) and the nearest star (4.2 ly).
  *   **1 Day:** $5.2 \times 10^{5}\text{ light-years}$. Galactic scale.
  *   **1 Year:** $1.9 \times 10^{8}\text{ light-years}$. Extragalactic.
  **Consequence:** Within the Solar System at human speeds, the argument cannot pull any macroscopically distinct future event into the present.

  **Load-Bearing Quantity**
  The product $\Pi = vx/c^2$.
  *   **Meaningful Future ($\Delta t > 1\text{ s}$):** Requires $\Pi > 1$.
  *   **Negligible Future ($\Delta t \ll 1\text{ s}$):** Occurs when $\Pi \ll 1$.
  At human scales inside the Solar System, $\Pi \approx 10^{-4}$.

  **Contrast Cases**
  1.  **Vary Distance:** Retain $v=1.5\text{ m/s}$. Lift $x$ to Andromeda ($2.5 \times 10^6\text{ ly}$). Shift becomes $\approx 4\text{ days}$. The argument now captures a macroscopic future.
  2.  **Vary Speed:** Retain Solar System scale ($x=40\text{ AU}$). Lift $v$ to $0.9c$. Shift becomes $\approx 5\text{ hours}$. The argument now captures a macroscopic future.

  **Eternalist Reply and Presentist Premise**
  **Eternalist:** Physics quantifies over all inertial frames, not merely humanly occupiable ones. The existence of relativistic particles validates the geometry regardless of who occupies the frame.
  **Presentist Premise:** To principledly restrict the argument, the presentist must supply: "Ontological reality is indexed only to simultaneity relations achievable by observers capable of causal exchange within a biological lifespan." This binds co-reality to communicative capacity, not mere geometric existence.

  **Verdict**
  This is a **limit on what this particular route to eternalism can prove** for human agents, not a counterexample to eternalism itself. When either cap (speed or distance) is lifted, the argument regains its force. The temptation point lies in equating the *existence* of a coordinate shift with the *significance* of that shift. I have blocked this by quantifying the shift as microseconds, demonstrating that while the logic holds, the ontological payload for a human observer is null.
