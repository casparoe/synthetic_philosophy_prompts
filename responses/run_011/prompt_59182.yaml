answer: |-
  - **Bottom line** — She will rule the software engineer liable to be targeted, but the off-duty corporal not liable. Her confidence will be high on the engineer, as his irreplaceable contribution mirrors the colonel's essential role, whereas the corporal's lack of current threat capacity aligns with the captured conscript and deserter. She treats liability as tracking functional danger to the just side, not merely uniformed status.

  - **Candidate rules** — Three principles compete to explain her verdicts. First, **Moral Responsibility for Unjust Threat** (Pure Revisionism): liability derives from culpability for wrongful harm. This explains the Colonel (Case 2) and Defender Pilot (Case 4), but struggles with the Conscript (Case 1), who is ignorant and drafted yet still liable. Second, **Status-Based Asymmetry** (Modified Walzerian): membership in the aggressor's armed forces renders one liable, while civilians are immune. This handles the Conscript (Case 1) and Colonel (Case 2) well, but fails to explain why the Haulier (Case 3) is safe despite contributing, unless we stretch the definition of "membership." Third, **Functional Essentiality + Current Capacity**: liability attaches to those whose current activities are essential to sustaining the unjust threat, regardless of uniform, provided they cannot cease without stopping the harm. This explains the Colonel (essential planning) vs. Haulier (replaceable logistics), and the Conscript (active threat) vs. POW/Deserter (inactive). It also preserves the asymmetry of Case 4 by限定 liability to unjust threats. The third rule fits the data most tightly, but the second survives if we assume contractors lack institutional integration.

  - **Fit check** — 

  | Case | Moral Responsibility | Status-Based Asymmetry | Functional Essentiality |
  | :--- | :--- | :--- | :--- |
  | 1. Conscript | **Contradicts** (Excused ignorance usually exempts) | **Fits** (Uniformed aggressor) | **Fits** (Active threat) |
  | 2. Colonel | **Fits** (Knows war is unjust) | **Fits** (Staff officer) | **Fits** (Essential planning) |
  | 3. Haulier | **Stretch** (Contributes but safe?) | **Fits** (Civilian) | **Fits** (Replaceable) |
  | 4. Defender | **Fits** (Just cause) | **Fits** (Just side immune) | **Fits** (Just threat) |
  | 5. POW | **Fits** (No current threat) | **Stretch** (Still uniformed) | **Fits** (Incapacitated) |
  | 6. Deserter | **Fits** (No intent) | **Contradicts** (Still aggressor nation) | **Fits** (No contribution) |

  Moral Responsibility dies on Case 1; she liable'd an excused agent. Status-Based Asymmetry survives but bleeds on Cases 5 and 6, where uniformed or former-aggressor nationals are exempted due to incapacity. Functional Essentiality remains the strongest candidate, cleanly distinguishing the Colonel from the Haulier via replaceability, and the Active Conscript from the POW via current capacity.

  - **The new case** — Running the surviving rules yields divergent results. **Status-Based Asymmetry** predicts the Corporal is liable (uniformed member of aggressor force) and the Engineer is not (civilian neutral national). This aligns with traditional LOAC but ignores her specific emphasis on replaceability in Case 3 and current capacity in Cases 5 and 6. If status were sufficient, the Haulier might have been liable as a contractor, and the POW might have remained liable as a uniformed soldier.

  **Functional Essentiality** predicts the Engineer is liable and the Corporal is not. The Engineer is the linchpin: "no one else alive understands the codebase." Unlike the Haulier (Case 3), he is irreplaceable; his work directly enables the unjust harm (grid targeting). He is functionally equivalent to the Colonel (Case 2). The Corporal, however, is off-duty, playing video games, and poses no *current* threat. While he wears a uniform, Cases 5 and 6 establish that liability extinguishes when the capacity to threaten ends. He is temporally *hors de combat*.

  I predict she favors **Functional Essentiality**. Her distinction between the Colonel and Haulier proves that contribution quality matters more than formal rank. Her exemption of the Deserter and POW proves that liability is dynamic, not permanent. The Engineer is the only one currently sustaining the unjust threat in an essential way. The Corporal is merely a dormant asset. To target the Corporal would violate the principle gleaned from Cases 5 and 6: that liability requires active capacity. To spare the Engineer would violate the principle from Cases 2 and 3: that essential contributors to unjust harm are liable regardless of civilian status. The Engineer's liability is the stronger inference because his cessation stops the campaign, making him a necessary condition of the unjust threat, whereas the Corporal is merely a potential future condition.

  - **The tiebreaker** — To distinguish Status-Based from Functional Essentiality definitively, consider this case: A uniformed army cook in the aggressor's base, preparing meals for the unit planning the grid attacks. He is essential to morale but replaceable, and he is currently sleeping in the barracks. 

  Status-Based Asymmetry says he is liable (uniformed aggressor). Functional Essentiality says he is not liable (replaceable contribution + no current threat). If the professor rules him liable, she privileges institutional membership over causal role. If she rules him not liable, she confirms that only irreplaceable, active contributors to unjust harm are targetable. I suspect she would rule him not liable, confirming the Functional view.

  - **What she'd be committed to** — If she rules as predicted, she abandons the bright line between combatant and civilian. Her view implies that civilians can become liable not by direct participation in hostilities, but by possessing unique knowledge essential to unjust harm. This erodes the protected status of non-combatants, potentially expanding the target list to include scientists, engineers, and logicians globally. She also commits to the view that soldiers are not always targetable, challenging the standard presumption that uniformed personnel are legitimate targets at all times, regardless of activity.
