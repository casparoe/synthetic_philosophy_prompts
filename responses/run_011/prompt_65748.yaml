answer: |-
  **TO:** Board of Directors
  **FROM:** [Your Name]
  **DATE:** Wednesday Night
  **SUBJECT:** Recommendations for Thursday's Vote

  We meet tomorrow in the back of the bakery. There will be coffee and pastry. There will also be a decision that could define this center for the next decade. We are short on money and long on moral complexity. We need to vote on two distinct items: the informant's diaries and the detainee interview tapes. We cannot treat them as a single package.

  **The Framework: Two Different Debts**
  One of our volunteers suggested we are confusing two different obligations. She calls them "testimonial debt" and "informational debt." I have spent the week trying to find a flaw in this distinction so we could simplify the problem. I cannot find one. It is real, and it is load-bearing.

  *   **Testimonial Debt** is what we owe to specific people who trusted us. It is based on promises.
  *   **Informational Debt** is what we owe to the public record. It is based on truth.

  When these conflict, we usually feel we must choose one. But here, they apply to different objects. The tapes are about promises (testimonial). The diaries are about facts (informational). Using this distinction isn't a way to do less work; it is a way to ensure we don't betray a promise while chasing a fact, or hide a fact while protecting a promise. However, it costs us. Honoring testimonial debt means accepting that some history will remain hidden. Honoring informational debt means accepting that some living people may be hurt by the truth.

  **Item 1: The Interview Tapes (Testimonial Debt)**
  *The Situation:* Forty hours of interviews. The donor promised the subjects nothing would be made public. The deed of gift requires family consent for release, which we are told will not come. Four families want them destroyed.
  *The Recommendation:* **Do not destroy. Do not digitize for access. Keep sealed according to the deed of gift.**

  We are an archive, not a court. Our primary currency is trust. If we break confidentiality now because the subjects are dead or because the history is valuable, no one will ever speak to us again. We become just another arm of the state security we claim to critique. We must honor the promise made in the 1990s, even if it means these stories remain unheard.

  *The Cost:* This means accepting that some truths will die with the families. We are choosing integrity over completeness.
  *The Strongest Argument Against This (Destroy the Tapes):* Proponents argue that keeping the tapes is a form of voyeurism. We are hoarding pain we promised to hide, solely to justify our own existence and payroll. They argue that true respect for the dead means letting them rest, not keeping their voices in a vault where they might one day be leaked or hacked. Destruction is the only guarantee of privacy.
  *Why I Reject It:* Destruction is irreversible. We can keep them sealed forever, but we cannot un-destroy them if the ethical landscape changes in fifty years. Preservation without access is the middle path.

  **Item 2: The Diaries (Informational Debt)**
  *The Situation:* A list of 200 names and reasons for reporting. The Victims' Association wants immediate publication. The donor's children expect privacy.
  *The Recommendation:* **Accept the donation. Do not publish immediately. Establish a Controlled Access Protocol.**

  This is not about a promise to the subjects; they did not consent to be named. This is about the historical record. However, immediate full publication could endanger living people or lead to vigilante justice without context. We cannot hand these over to the families as private property (as one board member suggested); justice is not an inheritance.

  *The Plan:*
  1.  **Digitize and Secure:** Create high-resolution scans stored on a non-networked server.
  2.  **Vetting Committee:** Form a group including our staff, a legal expert, and a representative from the Victims' Association.
  3.  **Timeline:** After six months of review, allow access to verified researchers and immediate family members of the named. Full public release follows in five years, unless specific safety threats are identified.

  **The Financial Reality**
  We cannot make payroll past March without this donation. We must be honest about this. If we reject the donation on moral grounds, we close the center, and then we help no one. Accepting the money is not sinful; selling out the conditions would be. We accept the material because it belongs in the public trust, not because it keeps the lights on. The lights staying on is a secondary benefit we cannot ignore, but it cannot be the primary reason.

  **Criteria for Future Boards**
  I will not always be here to untangle these knots. We need rules for the next time this happens (and it will). I propose we adopt these three criteria for all future acquisitions:

  1.  **Consent Clarity:** We do not accept materials where consent from living subjects is ambiguous. If a donor says "private," it means private forever, unless they provide a written mechanism for release.
  2.  **Harm Assessment:** Before accepting sensitive material, we must document who could be harmed by its existence versus who could be harmed by its destruction. We vote on which harm is greater.
  3.  **The Sunset Clause:** No seal lasts forever. For any restricted material, we set a hard date (e.g., 50 years) when access must be reviewed by a new board. Secrets should not outlive the danger they pose.

  **Summary for the Vote**
  1.  **Tapes:** Preserve physically, maintain seal, no digitization for public access.
  2.  **Diaries:** Accept, secure digitally, release via Controlled Access Protocol after 6-month review.
  3.  **Policy:** Adopt the three criteria above for future intake.

  This path keeps our promise to the dead interviewees while refusing to bury the evidence of the informants. It keeps the center open without selling our soul. It is not clean, but it is honest.

  See you at 7:00. I'll bring the napkins.
