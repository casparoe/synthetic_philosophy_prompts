answer: |-
  This is a sharp draft, and your intuition about the fourth conclusion is correct: it is the point where the internal logic of the "reciprocal risk-pooling" account fractures under the weight of sovereign power. You have correctly identified that a theory of *distribution* (who gets welfare) is being asked to do the work of a theory of *jurisdiction* (who may be coerced).

  To answer your questions directly: No, there is no version of the reciprocal risk-pooling account that survives contact with border enforcement without importing external moral premises. The framework does not commit you to holding that coercion cannot wrong outsiders, but it *does* commit you to having no internal resources to explain *why* it might wrong them. The reasoning breaks at two specific junctures: the slide from "not a party to the scheme" to "owed nothing," and the treatment of exclusion as an omission rather than an act.

  Here is the breakdown of where the framework fails.

  ### 1. The Category Error: Association vs. Sovereignty
  Your premise defines the state as an *association* (a cooperative insurance scheme). Associations are voluntary or at least defined by specific participation. States, however, are *sovereign entities* claiming a monopoly on legitimate violence over a territory.

  If the state were merely a private club, your logic would hold. A private chess club owes non-members nothing; it can lock the door; it does not need to justify to outsiders why it doesn't let them in. But the state does not merely lock a door; it controls the earth beneath the feet of the excluded. When the state enforces a border, it is not merely withholding a benefit (welfare); it is asserting a property claim over a geographic region and using force to prevent others from accessing it.

  The risk-pooling account explains why members owe each other *resources*. It does not explain why the collective owes outsiders *non-interference*. By conflating the welfare state (a distributive mechanism) with the border state (a coercive mechanism), you have allowed a theory of positive rights (entitlements to support) to cancel out negative rights (immunity from coercion).

  ### 2. The Break at "Owed Nothing"
  Your second potential breaking point is the slide from "not being a party to the scheme" to "being owed nothing." This is the critical logical leap.

  Even if we accept your premise that welfare is strictly reciprocal insurance, moral obligations are not exhausted by cooperative schemes. There are general duties of humanity (non-aggression, non-refoulement, basic rescue) that apply regardless of membership.
  *   **Positive Duties:** These are generated by the scheme. You are correct that outsiders have no claim to the *pool*.
  *   **Negative Duties:** These are generated by moral agency itself. Outsiders have a claim not to be detained, harmed, or returned to persecution, regardless of their contribution history.

  Your fourth conclusion fails because it assumes that because the state owes the migrant no *welfare*, it owes them no *justification for coercion*. But detention and removal are not merely the absence of welfare; they are affirmative impositions of harm. To say "you are not a member, therefore I may detain you" is to argue that membership is a prerequisite for moral standing against violence. That is a Hobbesian position, not a mutualist one, and it contradicts the liberal assumptions usually underlying risk-pooling accounts (which presume the moral equality of persons *before* the contract is struck).

  ### 3. Omission vs. Act (The Enforcement Problem)
  You identified this yourself, but it bears stressing: your framework treats exclusion as an *omission* (failure to admit). Border enforcement is an *act* (active interdiction).

  *   **Omission:** Deciding not to process a visa application. On your account, this is permissible. The state is not obligated to expand the pool.
  *   **Act:** Deploying agents to physically stop, detain, or remove a person. This requires a separate justification.

  If the migrant is merely standing outside the club, the club can ignore them. But if the migrant is attempting to cross a line that the state claims ownership of, the state must use force to repel them. That use of force triggers a burden of justification that the risk-pooling account cannot meet. The account explains why the migrant cannot claim the *treasury*; it does not explain why the state can claim the *territory* against the migrant.

  ### 4. The Discrimination Claim
  Regarding your third conclusion: Critics calling border enforcement "discriminatory" are not necessarily arguing that the state must treat non-members *identically* to members. They are arguing that the *criteria* for membership (birthright, arbitrary borders) are morally irrelevant to the *coercion* being applied.

  If I refuse to hire you because you aren't in the union, that is not discrimination; it is a condition of employment. If I call the police to arrest you because you aren't in the union, that is a different matter. Your framework treats border enforcement like the former (a condition of access to benefits), when it functions like the latter (a condition of physical liberty).

  ### Verdict on the Framework
  You asked if you should be told the framework is incoherent. It is not incoherent, but it is **incomplete**. It is a theory of *internal justice* masquerading as a theory of *external legitimacy*.

  *   **Conclusion 1 & 2 (No obligation to admit/welfare):** These survive *if* you restrict the claim to distributive goods. The state is not obligated to extend the insurance policy to outsiders.
  *   **Conclusion 3 (Cosmopolitan arithmetic):** This is a straw man of cosmopolitanism (which usually argues for global restructuring, not just draining local pools), but internally consistent with your zero-sum premise.
  *   **Conclusion 4 (Enforcement is not discriminatory/wrongful):** This collapses. It relies on the false equivalence between "withholding a subsidy" and "inflicting coercion."

  **Where to fix it:**
  If you wish to save the paper, you must decouple the *welfare boundary* from the *border boundary*. You can argue that the welfare state is a reciprocal scheme (Conclusion 1 & 2 hold for benefits), while conceding that the *enforcement* of the border requires a separate justification (e.g., self-determination, security, or capacity) that acknowledges the moral standing of the outsider.

  If you maintain that the pooling constitutes the *only* moral relationship, you are indeed committed to the view that coercion directed at outsiders cannot wrong them. That is a defensible position in hard realism, but it is incompatible with the normative language of "justice" and "discrimination" you are using elsewhere in the paper. You cannot have it both ways: either the state is a private club (in which case "justice" is the wrong vocabulary for its external relations) or it is a political sovereign (in which case the risk-pooling account is insufficient to justify its coercion).

  **Recommendation:**
  Do not soften the conclusions. Instead, narrow the scope. Argue that the reciprocal risk-pooling account successfully explains why there is no *distributive* obligation to migrants, but explicitly acknowledge that it fails to justify *coercive* enforcement. This limitation strengthens the paper by showing you understand the boundary between distributive justice and coercive legitimacy. If you try to make the risk-pooling account do the work of border enforcement, you will be forced into a moral vacuum that undermines the normative force of the entire project.
