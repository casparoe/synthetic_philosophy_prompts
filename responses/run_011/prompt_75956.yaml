answer: |-
  You have identified a genuine gap in the taxonomy of epistemology. While the components of the structure you describe are well-discussed under various headings, there is no single, canonical term that captures the *dynamic instability* (your "wobble") as a distinct phenomenon across these domains.

  The closest existing vocabulary clusters around **Epistemic Self-Undermining** (the static relation) and **Doxastic Instability** (the dynamic consequence), but neither alone suffices. "Self-undermining" describes the logical relationship between a theory and its grounds, but does not necessitate the oscillating state you describe (one can simply abandon the theory and stop). "Doxastic instability" is a broader term in dynamic epistemic logic that can arise from many sources (e.g., changing evidence), not specifically from self-undermining content.

  For the purposes of your seminar, I recommend adopting the term **Reflective Epistemic Instability**. This distinguishes it from logical self-refutation (which is inconsistent) and pragmatic self-defeat (which is self-frustrating action). It captures the specific pathology where *reflective access* to the theory's implications destabilizes the doxastic attitude required to hold the theory.

  Below is the carving you requested, followed by the ruling on boundary cases and the verdict on unity.

  ### I. The Carving: Reflective Epistemic Instability

  To count as an instance of Reflective Epistemic Instability, a scenario must satisfy the following necessary and sufficient conditions.

  **Notation:**
  *   Let $T$ be the theory/proposition.
  *   Let $C$ be the cognitive process (or class of processes) that produced the evidence $E$ for $T$.
  *   Let $J(S, p)$ mean "Subject $S$ is justified in believing $p$."
  *   Let $R(C)$ mean "Process $C$ is reliable."

  **Necessary Conditions:**
  1.  **Dependence:** The subject's current justification for $T$ depends essentially on $C$. (i.e., $J(S, T)$ is derived from $E$, where $E$ is the output of $C$).
  2.  **Global Undermining:** $T$ entails (or probabilistically implies to a high degree) $\neg R(C)$ *with respect to the domain containing $T$*. (The theory says the process that found the theory is broken).
  3.  **Reflective Access:** The subject is aware (or can become aware through ordinary reflection) of the link between $T$, $E$, and $C$. (The subject knows *why* they believe $T$ and what $T$ implies about that *why*).
  4.  **Defeater Sensitivity:** The subject's epistemic norms require that believing $\neg R(C)$ acts as a defeater for $J(S, T)$. (If you think your vision is hallucinogenic, you shouldn't trust what you see).

  **Sufficient Condition (The Wobble):**
  5.  **Recursive Instability:** The application of the defeater (from 2 & 4) removes the justification for $T$. However, the removal of $T$ removes the justification for $\neg R(C)$ (since $\neg R(C)$ was supported by $T$). Consequently, the defeater vanishes, restoring justification for $T$, which reinstates the defeater. No fixed point exists in the doxastic state space.

  ### II. Ruling on Boundary Cases

  You asked specific questions about the boundaries of this concept. Here is how the carving above adjudicates them.

  **1. Does partial undermining qualify?**
  *   *Verdict:* **No, not unless it crosses a threshold.**
  *   *Reasoning:* If $T$ implies that only one-third of convictions from $C$ are false, this constitutes a *partial defeater*. In standard epistemology, partial defeaters reduce confidence but do not necessitate suspension of belief. The "wobble" requires that the undermining be sufficient to destroy justification entirely (or reduce it below the threshold for belief), yet the restoration of belief must be sufficient to restore the undermining. If the undermining is partial, the system may settle at a lower degree of confidence (a stable equilibrium) rather than oscillating.
  *   *Boundary Line:* The line is drawn at the **threshold of suspension**. If the undermining forces suspension, but suspension removes the undermining, you have the wobble. If the undermining merely lowers probability, you have stable uncertainty.

  **2. Must the conclusion concern the theorist herself (self-locating)?**
  *   *Verdict:* **No.**
  *   *Reasoning:* The Boltzmann Brain argument is self-locating ("*I* am likely a brain"). The Evolutionary Debunking argument is general ("*Human* normative faculties are unreliable"). Both generate the wobble. The crucial factor is not self-location, but **self-application**. The theory must impugn the process *actually used* by the theorist. A theory that says "Aliens are unreliable" does not wobble for a human theorist. A theory that says "All biological reasoners are unreliable" does wobble for a human theorist.
  *   *Condition:* It suffices that the theorist falls within the class of agents whose reliability is impugned.

  **3. Does independent support rescue the theory?**
  *   *Verdict:* **Yes, it rescues it outright if the support is independent of $C$.**
  *   *Reasoning:* Condition 1 (Dependence) is violated. If $T$ is supported by mathematical coherence ($C_{math}$) or instrumental success ($C_{inst}$) that $T$ does *not* impugn, then accepting $T$ does not defeat the *entirety* of its support. The wobble requires the undermining to be **epistemically total** regarding the actual grounds for belief.
  *   *Degree:* If the independent support is weak, the wobble may persist as a tension, but if the independent support is sufficient to sustain $J(S, T)$ without $C$, the oscillation stops. The theory becomes stable because the defeater no longer removes the justification.

  **4. Is predicting rejection the same as undermining evidence?**
  *   *Verdict:* **No, distinct phenomenon.**
  *   *Reasoning:* A theory might predict "Users of this theory will reject it" (e.g., due to psychological discomfort) without implying "Users of this theory are *unjustified* in accepting it." This is a **Self-Frustrating Prediction**, not Reflective Epistemic Instability. The wobble requires an *epistemic* defeater (unreliability), not a *causal* prediction (rejection).
  *   *Name:* This deserves the name **Causal Self-Frustration**. It lacks the normative force to generate the doxastic oscillation.

  **5. Does the phenomenon attach to truth or warrant?**
  *   *Verdict:* **Warrant (Justification).**
  *   *Reasoning:* The wobble is an epistemic problem, not a metaphysical one. $T$ could be *true* (e.g., it is true that we are Boltzmann Brains), but the *reason to believe it* is self-undermining. The instability arises in the space of reasons, not the space of facts. If we define the phenomenon by truth, it ceases to be a problem (a true theory is a true theory). The "wobble" is specifically about the inability to *rationally hold* the belief.

  ### III. Verdict: One Phenomenon or Two?

  You asked whether this is a single phenomenon or a contingent conjunction of two familiar ones.

  **Verdict:** It is **one structural phenomenon**, but it is constituted by the interaction of two distinct epistemic relations.

  It is not merely a conjunction of "Global Skepticism" and "Circularity," as you correctly noted. Instead, it is the unique product of **Global Undermining** meeting **Reflective Access**.

  1.  **Global Undermining:** This is the static relation where a belief $B$ provides a defeater for the process producing $B$. (Discussed in Plantinga's EAAN, Bergmann's skepticism).
  2.  **Reflective Access:** This is the capacity of the agent to process the undermining relation.

  Without Reflective Access, you have a self-undermining theory that no one realizes is self-undermining (no wobble, just error). Without Global Undermining, you have reflection without instability.

  Therefore, **Reflective Epistemic Instability** is the correct unitary label for the *dynamic state* produced when a rational agent with reflective access entertains a globally self-undermining theory.

  ### IV. Recommendation for Your Seminar

  Since no canonical term exists, you are justified in stipulating one. "The Wobble" is vivid but informal. **Reflective Epistemic Instability** is precise.

  However, if you wish to anchor it in existing literature for your students, you should present it as the **dynamic consequence of Total Epistemic Self-Undermining**.

  You should explicitly distinguish it from:
  *   **The Liar Paradox:** (Semantic inconsistency vs. Epistemic instability).
  *   **Pragmatic Self-Defeat:** (Acting on $T$ makes $T$ false vs. Believing $T$ makes believing $T$ unjustified).
  *   **Bootstrapping:** (Using $C$ to prove $C$ reliable vs. Using $C$ to prove $C$ unreliable).

  **Suggested Reading to Anchor the Concept:**
  *   **Michael Bergmann**, "Common Sense Skepticism and the Evolutionary Argument Against Naturalism" (for the defeater structure).
  *   **David Christensen**, "Self-Undermining Beliefs" (for the higher-order evidence aspect).
  *   **Adam Elga**, "Confidence and the Structure of Belief" (for the dynamic instability).
  *   **Hilary Kornblith**, "Second-Guessing: A Self-Help Manual" (for the discussion on when reflection destabilizes).

  By carving it as **Reflective Epistemic Instability**, you provide your students with a tool to recognize that the Boltzmann Brain problem, the Evolutionary Debunking argument, and the Naturalist's Dilemma are not merely analogous; they are instantiations of the same formal epistemic pathology.
