answer: |-
  The orthodoxy you recount is correct only if the question is interpreted through the first lens. To claim that heritability says nothing about individuals is to assume that the only meaningful question is the share-of-production reading. Once we disambiguate the query, the category mistake dissolves. The individual-level claim is not meaningless; it is merely relational.

  Consider the three readings of "how much of my diabetes risk comes from my genes."

  The first, the share-of-production reading, imagines the phenotype as a composite substance, like a cake, where genes and environment are ingredients poured into a bowl. This is ill-posed. Development is not additive mixing; it is dynamic interaction. You cannot slice a finished cake back into flour and sugar, and you cannot slice a phenotype into genetic and environmental bits. The orthodoxy rightly demolishes this reading.

  The second, the contrastive reading, asks: How much of the *difference* between my phenotype and the population mean is attributable to the difference between my genotype and the population mean? This is well-posed. In quantitative genetics, the phenotype $P$ is modeled as $P = \mu + A + D + I + E$, where $A$ is the additive genetic value (breeding value), $D$ and $I$ are non-additive genetic deviations, and $E$ is the environmental deviation. Narrow-sense heritability ($h^2$) is the ratio of additive genetic variance to total phenotypic variance ($V_A/V_P$). Crucially, $h^2$ is not merely a population summary; it is the coefficient of determination for the best linear prediction of phenotype from genotype.

  For an individual, the breeding value $A_i$ is the expected deviation from the population mean given their genotype, averaged over the environments found in the population. When a testing company gives you a risk score, they are estimating $\hat{A}_i$. The claim licensed by $h^2$ is that your expected deviation from the mean is proportional to this breeding value. This is a determinate fact about you: it is a property of your genotype within the context of the reference population. It answers the contrastive question directly: your genetic contribution to your deviation is $A_i$.

  The third, the interventionist reading, asks how your phenotype would differ under a specified alternative environment. This survives only partially. To make it determinate, one must supply a reference distribution of environments. If the alternative environment is specified as the population mean environment, the interventionist reading collapses into the contrastive reading. Without a specified counterfactual environment distribution, the question remains indeterminate, but this is a failure of specification, not a failure of the genetic concept.

  We must now confront the objections that threaten to restore the orthodoxy.

  First, the expectation objection. A breeding value averages over the environments a population occupies, and no actual person inhabits the average environment. Therefore, the answer describes a hypothetical counterpart, not you. This objection confuses the parameter with the realization. The breeding value is a dispositional property of your genotype, akin to the solubility of sugar. Sugar dissolves in water; this is true even if a specific cube is never immersed. Your breeding value is what your genotype *would* produce on average in the environmental range of the reference population. It is a fact about your actual genotype, not a fiction about a hypothetical person. The orthodoxy mistakes the averaging procedure for a claim about actual history. The claim is about predictive expectation, which is precisely what risk assessment requires.

  Second, the reference-class objection. The answer shifts with the choice of reference population and environmental range. Thus, there is no fact about you, only a fact about you relative to a selection. This relativity is benign indexicality, not a defect. Consider the predicate "tall." Whether you are tall depends on the reference class (e.g., professional basketball players vs. the general population). This does not make "I am tall" meaningless; it makes it context-dependent. Similarly, "high genetic risk" is relative to the variance structure of the population. If the population environment is uniform, $h^2$ rises, and your genetic deviation explains more of the phenotypic deviation. If the environment is heterogeneous, $h^2$ falls. This is not epistemic weakness; it is ontological precision. The genetic contribution to deviation is inherently relational because deviation is inherently relational. There is no absolute deviation, only deviation from a mean.

  Third, the non-additivity objection. The decomposition is a linear approximation. Dominance, epistasis, and gene–environment interaction (GxE) exist. Worse, gene–environment correlation (rGE) means the additive component absorbs environmental effects that travel with genotype, such as socioeconomic status inherited alongside alleles. Assortative mating and population structure further inflate the estimate. What is left of the thesis?

  If we take these seriously, the claim ceases to be about "pure" genetic causality and becomes a claim about *predictive association*. If rGE inflates $V_A$, the breeding value captures the effect of the genotype plus the environmental consequences of having that genotype. For the individual asking about risk, this is arguably more useful, not less. You cannot separate your genes from the environments they solicit. However, if the goal is mechanistic isolation, the thesis degrades. It remains true that $\hat{A}_i$ is the best linear predictor, but it is no longer strictly "genetic" in a molecular sense. It does not degrade to triviality, provided we acknowledge the scope: it is a claim about the variance attributable to genetic *markers* in this population, inclusive of correlated environmental pathways. The thesis holds as a claim about statistical attribution, not necessarily mechanistic isolation.

  I am 80% confident in the central claim that the contrastive reading licenses a determinate individual-level assertion via the breeding value. The step I am least sure of is the handling of gene–environment correlation in the non-additivity objection. Specifically, whether counting rGE as part of the "genetic" contribution violates the semantic boundaries of the user's question enough to render the answer misleading, even if statistically valid. This would be settled by empirical decomposition of rGE versus direct genetic effects in large-scale biobanks, isolating whether the predictive power persists when environmental confounders are strictly controlled.

  Verdict: Narrow-sense heritability licenses the claim that an individual's additive genetic value predicts their expected deviation from the population mean phenotype within the specific environmental range of that population.
