answer: |-
  This is a sharp exchange. You've got one student (Hank) treating decision theory as a prescriptive physics of rationality, and another (Vera) treating it as a model with boundary conditions. Given your background in kinetics and error bars, you'll appreciate that Hank is treating the theorem as a law of nature, while Vera is pointing out that the experimental conditions (Nora's psychology) violate the law's assumptions.

  Here is the move-by-move refereeing.

  ### The Exchange

  **(1) Hank: "this is a theorem, not a taste question — free information has nonnegative expected value, so Nora is making a decision-theoretic mistake."**
  *   **Verdict:** **Partly Right.**
  *   **Reasoning:** The theorem (Good, 1967) is mathematically sound *for the class of agents it describes*. However, concluding Nora is making a "mistake" assumes she belongs to that class. If her utility function or updating rules violate the theorem's axioms, the theorem does not apply, and her choice is not a decision-theoretic error *relative to the theorem*. Hank is conflating the model with the territory.
  *   **Confidence:** 90%

  **(2) Vera: "nonnegative isn't positive. If the result wouldn't change what she does, the value is exactly zero and the theorem doesn't reach her case at all; Hank's own picture shows it, since the value function is flat inside any region where the same action stays optimal, so unless her posterior might cross a boundary, information is worth nothing."**
  *   **Verdict:** **Partly Right.**
  *   **Reasoning:** Her conclusion is correct: if the optimal action doesn't change, the Expected Value of Sample Information (EVSI) is zero. However, her geometric description is slightly imprecise. The value function $V(p)$ is the upper envelope of linear functions (hyperplanes). Inside a region where one action is optimal, $V(p)$ is *linear*, not "flat" (constant). It is the *gain* from information that is zero (flat), because Jensen's inequality becomes an equality for linear functions. She gets the physics right (no work is done if you don't cross a threshold) but the geometry terminology is loose.
  *   **Correction:** The value function is *linear* within an action region, not flat. Linearity implies $E[V(p_{post})] = V(p_{prior})$, hence zero value of information.
  *   **Confidence:** 95%

  **(3) Hank: "in her case it obviously might cross — kids or no kids is precisely a boundary, so the value is strictly positive."**
  *   **Verdict:** **Partly Right.**
  *   **Reasoning:** This depends on Nora's prior probabilities and the test's sensitivity/specificity. If her prior is already so extreme (e.g., 99.9% sure she carries the gene) that no realistic test result would move her posterior across her decision threshold, the value is zero. Hank assumes the test is sufficiently informative to potentially switch the optimal action. This is a plausible empirical assumption, but not a mathematical necessity.
  *   **Confidence:** 85%

  **(4) Vera: "only if you hold her utility fixed. Nora doesn't just care about outcomes, she cares about what she expects; she's said she'd spend the next twenty years either dreading or grieving, and that cost attaches to knowing, so once you put it in, the value function isn't convex anymore and the Jensen step fails."**
  *   **Verdict:** **Clearly Right.**
  *   **Reasoning:** Good's theorem assumes utility depends only on the state of the world and the action taken ($U(a, \omega)$). If utility depends on the belief state itself ($U(a, \omega, p)$), often called "anticipatory utility" or "psychological cost," the expectation $E_p[U]$ is no longer linear in $p$. Consequently, $V(p) = \max_a E_p[U]$ is not guaranteed to be convex. If the cost of anxiety is high enough, the net expected value of information can be negative. This is the standard economic explanation for the "value of ignorance."
  *   **Confidence:** 95%

  **(5) Hank: "that's an unfalsifiable dodge — any evidence you dislike can be given a psychological price, and then nobody ever has to look at anything they'd rather avoid; the whole point of the principle of total evidence is to police exactly that move."**
  *   **Verdict:** **Clearly Wrong.**
  *   **Reasoning:** Hank misstates the Principle of Total Evidence (Carnap). That principle dictates that you must *use* all available relevant evidence when forming beliefs. It does not mandate that you must *acquire* all possible evidence regardless of cost. Decision theory explicitly allows for costly information acquisition; you stop gathering data when the marginal cost exceeds the marginal expected value. Psychological cost is a valid cost.
  *   **Confidence:** 98%

  **(6) Vera: "second, and seperately, the theorem assumes she updates by conditionalizing on her total evidence. Nora says she wouldn't: she'd take a positive result as certain doom, over-update, and then make worse decisions afterward. If she doesn't conditionalize, the theorem's hypothesis is simply false of her."**
  *   **Verdict:** **Clearly Right.**
  *   **Reasoning:** Good's theorem relies on the martingale property of beliefs: $E[p_{post}] = p_{prior}$. This holds only if the agent updates via strict Bayesian conditionalization. If Nora updates irrationally (e.g., panic-induced over-updating), the expectation of her future value can indeed be lower than her current value. The theorem's premises are not met.
  *   **Confidence:** 99%

  **(7) Hank: "then she's irrational for not conditionalizing, and you can't get her off the hook by stacking a second irrationality on the first — rational requirements don't evaporate because the agent can't meet them."**
  *   **Verdict:** **Partly Right.**
  *   **Reasoning:** Hank is making a normative claim: Nora *ought* to conditionalize. If she doesn't, she is irrational by Bayesian standards. However, this doesn't salvage Good's theorem as a description of her situation. The theorem says "If you are rational (update correctly), information has non-negative value." It does not say "If you are irrational, you must act as if you are rational." Hank is correct that her irrationality doesn't make her choice rational, but wrong that the theorem forces her to test.
  *   **Confidence:** 90%

  **(8) Vera: "now you've turned it into a definition. It's a claim about idealized agents, so you can't use it as a verdict on a person without smuggling in that she ought to be idealized. Is it a descriptive fact about Bayesians or a criticism of Nora? Pick one."**
  *   **Verdict:** **Clearly Right.**
  *   **Reasoning:** Vera correctly identifies the category error. Good's result is a theorem about idealized Bayesian agents. Using it to criticize a human requires the additional normative premise that humans ought to approximate idealized agents. Without that bridge, the theorem is descriptive of a model, not prescriptive for Nora.
  *   **Confidence:** 95%

  **(9) Hank: "even granting half your objections it's still the right default — absent a demonstrated special cost, get the information; the burden is on Nora to show her case is special."**
  *   **Verdict:** **Partly Right.**
  *   **Reasoning:** As a heuristic for decision-making under uncertainty, maximizing information is often robust. However, in medical ethics and behavioral economics, the "default" is contested (e.g., the "Right Not to Know"). Technically, the burden of proof isn't a mathematical concept here; it's a pragmatic rule of thumb. It's a reasonable policy, but not a theorem.
  *   **Confidence:** 80%

  **(10) Vera: "and she can't discharge that burden from where she's sitting, because the evidence about how she'd cope with knowing is the kind of thing you only get by knowing."**
  *   **Verdict:** **Partly Right.**
  *   **Reasoning:** This highlights the problem of "unknown utility." Nora cannot know the exact psychological cost of the news without experiencing the news. However, humans do have introspective and observational data (how others coped, how she handles stress) that allows for an *estimate*. She isn't completely blind, but she is uncertain. Vera overstates the impossibility ("can't"), but the core point about epistemic limitation is valid.
  *   **Confidence:** 75%

  ### Overall Assessment

  **Who is more right?**
  **Vera** is more right, technically and philosophically. She correctly identifies that Good's theorem is a conditional statement ("If Bayesian, then...") and that Nora violates the conditions (utility depends on belief state; updating may be non-Bayesian). Hank is right about the math of the idealized case but wrong to treat it as a universal law that overrides the agent's stated utility function. In your terms: Hank is applying an ideal gas law to a system near phase transition and blaming the gas when it condenses. Vera is pointing out the phase transition.

  **What are they both missing?**
  1.  **Ex-Ante vs. Ex-Post:** Good's theorem is about *expected* value before the information is received. Nora might get the test, feel terrible, and regret it (ex-post negative value), but that doesn't mean the *expectation* (ex-ante) was negative. Vera conflates the cost of knowing (ex-post experience) with the expected cost (ex-ante calculation), though her argument holds if the ex-ante expectation of that pain is high enough.
  2.  **The Nature of the "Cost":** They treat the psychological cost as either a fixed fee or a convexity breaker. In modern behavioral economics (e.g., Caplin and Leahy), this is modeled as *anticipatory utility*. The missing piece is that the "cost" isn't just a number subtracted from the utility; it changes the structure of the optimization problem itself.
  3.  **Instrumental vs. Intrinsic:** They assume information is only valuable instrumentally (to change actions). Sometimes information has intrinsic value (curiosity) or disvalue (dread), independent of action. Good's theorem covers instrumental value; it requires modification to handle intrinsic psychological value.

  ### Least Certain Point

  The point in my entire answer where I am least certain is my evaluation of **Move 10 (Confidence: 75%)**, specifically the claim that Nora *"can't"* know how she would cope without knowing the result.

  **Why it is shaky:**
  This rests on a philosophical claim about introspective access and "affective forecasting." While psychology suggests humans are often bad at predicting their emotional reactions to future events (Wilson & Gilbert, 2000), it is not logically impossible for Nora to have sufficient evidence (from family history, her own resilience in other crises, therapy) to form a reliable probability distribution over her coping mechanisms *before* taking the test. Vera treats this as a logical impossibility ("evidence... you only get by knowing"), but it is arguably an empirical difficulty. If Nora *could* reliably estimate her coping cost, the burden of proof Hank mentions in Move 9 could theoretically be discharged. My uncertainty lies in whether this is a hard epistemic limit or just a soft psychological one. Given the variability in human self-knowledge, I lean toward Vera, but I cannot rule out that a sufficiently self-aware agent could satisfy Hank's burden.
