answer: |-
  # The Suffering-Focus Alignment Instrument

  **Instructions for Facilitators:**
  Distribute the following eight cases to participants. Ask them to select the option (A or B) that best matches their moral intuition for each scenario. Emphasize that there are no "correct" answers, only consistent or inconsistent frameworks. Collect the responses anonymously. Use the Key to group participants by ethical archetype for breakout discussions.

  **Note to Participants:**
  We all agree that reducing suffering is the primary moral imperative. These cases are not designed to test that commitment, but to explore *how* that commitment functions when it conflicts with other intuitions (aggregation, happiness, identity, agency, or risk).

  ---

  ## The Cases

  **Case 1: The Dust and the Rack**
  A malfunctioning device will either inflict 50 years of continuous, soul-destroying torture on one person, OR inflict a momentary, barely noticeable dust-speck-in-the-eye irritation on 10 billion people. You can stop exactly one of these outcomes.
  *   **A.** Stop the torture (Save the one).
  *   **B.** Stop the irritations (Save the many).

  **Case 2: The Joyless Cure**
  A medical breakthrough can permanently eliminate all physical and mental suffering from the human species. However, the mechanism required to do this also removes the neurochemical capacity for joy, ecstasy, or deep satisfaction. Life would be neutral, never bad, but never good.
  *   **A.** Implement the cure (No suffering, no joy).
  *   **B.** Reject the cure (Some suffering, immense joy remains).

  **Case 3: The Identifiable Sacrifice**
  To prevent a natural disaster that will cause moderate chronic pain to 1,000 strangers, you must actively re-route a resource that will cause one specific, named individual to lose their livelihood and fall into severe, lifelong depression. The total "suffering units" are slightly lower if you sacrifice the individual.
  *   **A.** Sacrifice the individual (Minimize total suffering).
  *   **B.** Protect the individual (Do not make them the instrument).

  **Case 4: The Poisoned Well**
  A village water supply is naturally contaminated, causing mild illness. You have an antidote. However, the only way to administer the antidote to the 100 villagers is to first inject a concentrated toxin into the village leader, causing them severe agony for one hour. If you do nothing, the leader suffers nothing, but the 100 villagers remain mildly ill.
  *   **A.** Inject the leader (Act to prevent greater total suffering).
  *   **B.** Do not inject (Refuse to directly cause severe harm).

  **Case 5: The Russian Roulette Intervention**
  You can fund Intervention X or Intervention Y.
  *   Intervention X has a 99% chance of preventing 1,000 units of suffering, but a 1% chance of accidentally causing 1,000,000 units of suffering.
  *   Intervention Y has a 100% chance of preventing 500 units of suffering.
  *   **A.** Fund X (Maximize expected value).
  *   **B.** Fund Y (Avoid catastrophic risk).

  **Case 6: The Memory Wipe**
  A person endures 10 years of severe abuse. Afterwards, they are given a drug that completely erases the memory of the abuse and leaves them with a false memory of a happy childhood, resulting in a net happy life.
  *   **A.** The 10 years of abuse remains a permanent negative moral fact that must be weighed.
  *   **B.** The happy ending effectively cancels out the past suffering; the net life is positive.

  **Case 7: The Replacement**
  A farm animal is living a life of moderate confinement and mild discomfort. If you euthanize it painlessly and replace it with a new animal that will live a life of pure bliss (but eventually be euthanized painlessly), the total suffering in the world decreases.
  *   **A.** Euthanize and replace (Reduce total suffering).
  *   **B.** Do not euthanize (The existing individual has a claim to continue).

  **Case 8: The Distant Hell**
  There is a 0.0001% probability that a distant civilization exists where beings endure infinite suffering. You can spend your entire budget to send a signal that *might* alleviate them, or use the budget to definitely alleviate finite suffering for animals on Earth. The expected suffering value of the distant civilization is mathematically higher.
  *   **A.** Fund the signal (Prioritize the highest expected value, regardless of probability).
  *   **B.** Fund Earth animals (Prioritize certain relief over astronomical uncertainty).

  ---

  ## Facilitator's Key & Position Mapping

  The following four positions represent the dominant clusters in suffering-focused ethics. Use the answer patterns below to sort participants.

  ### 1. The Classical Negative Utilitarian (CNU)
  *   **Core Tenet:** Only suffering has moral disvalue. Happiness is neutral. Aggregation is valid. Agency (act/omission) is irrelevant.
  *   **Typical Pattern:** 1B, 2A, 3A, 4A, 5A, 6A, 7A, 8A.
  *   **Rationale:** They minimize the sum of suffering regardless of intensity thresholds, happiness trade-offs, or identity.

  ### 2. The Lexical Threshold View (LTV)
  *   **Core Tenet:** Severe suffering is lexically prior to mild suffering and happiness. No amount of mild pain or joy outweighs severe agony.
  *   **Typical Pattern:** 1A, 2A, 3A/B, 4A, 5B, 6A, 7A/B, 8B.
  *   **Rationale:** They prioritize the *worst-off* (Case 1, 5) and eliminate suffering even at cost of joy (Case 2), but may reject astronomical uncertainty (Case 8) if it risks ignoring certain severe suffering.

  ### 3. The Weighted Prioritarian (WP)
  *   **Core Tenet:** Suffering matters more than happiness, and severe suffering matters more than mild, but trade-offs are possible. Happiness has *some* weight.
  *   **Typical Pattern:** 1B, 2B, 3A, 4A, 5A, 6B, 7A, 8A.
  *   **Rationale:** They accept aggregation (Case 1) and some happiness trade-offs (Case 2), viewing suffering as heavily weighted but not absolute.

  ### 4. The Agent-Relative Restrictionist (ARR)
  *   **Core Tenet:** There are deontological constraints on *causing* suffering, even to prevent greater suffering. Identity of the sufferer matters.
  *   **Typical Pattern:** 1A/B, 2A/B, 3B, 4B, 5B, 6A, 7B, 8B.
  *   **Rationale:** They refuse to be the direct cause of harm (Case 4) or sacrifice specific individuals (Case 3, 7), even for utilitarian gains.

  ---

  ## Convergence Flags

  *   **Case 1 (Dust vs. Rack):** **CNU** and **WP** often converge here (both may choose 1B if the numbers are high enough), making this case unable to distinguish between "Happiness is neutral" and "Happiness has weight." It primarily distinguishes **LTV** (1A) from the aggregators.
  *   **Case 4 (Poisoned Well):** **CNU** and **WP** converge here (both choose 4A). This case distinguishes Consequentialists from **ARR**, but does not separate the two consequentialist views from each other.
  *   **Case 6 (Memory Wipe):** **CNU** and **ARR** may converge on 6A (Suffering is real regardless of memory), whereas **WP** might choose 6B (Net well-being matters). This distinguishes experiential views from hedonic sum views.

  ---

  ## Unoccupied Combinations & Diagnosis

  When analyzing the answer sheets, you will likely find logical combinations that no participant selects. These represent "empty spaces" in the moral landscape.

  **1. The "Happy Sadist" Combination**
  *   **Pattern:** Case 2B (Joy outweighs suffering) + Case 1A (Agony outweighs mild pain).
  *   **Diagnosis:** **Unattractive/Rare.** This position claims happiness can cancel out suffering (Case 2), yet also claims mild suffering cannot aggregate to outweigh severe suffering (Case 1). While logically possible (a lexical threshold on pain intensity, but not on pain vs. pleasure), it is rarely defended because it implies joy is valuable enough to excuse agony, but minor pains are not valuable enough to aggregate. It creates an unstable hierarchy of value.

  **2. The "Identity Consequentialist" Combination**
  *   **Pattern:** Case 3A (Sacrifice the specific individual) + Case 4B (Refuse to cause harm).
  *   **Diagnosis:** **Incoherent.** This participant wants to minimize total suffering by sacrificing a specific person (Impersonal Total View) but refuses to *act* to bring about that sacrifice (Deontological Constraint). If the goal is purely to minimize the total sum (Case 3A), the mechanism of delivery (Act vs. Omission in Case 4) should be irrelevant. This suggests a conflict between their stated goal and their agency constraints.

  **3. The "Risk-Neutral Lexicalist" Combination**
  *   **Pattern:** Case 1A (Lexical priority on agony) + Case 5A (Risk-neutral expected value).
  *   **Diagnosis:** **Unexplored/Inconsistent.** If severe agony is lexically prior (Case 1), one should arguably be extremely risk-averse regarding the *possibility* of agony (Case 5). Choosing the gamble in Case 5 implies that a 1% chance of agony is worth trading for expected value, which undermines the lexical claim that agony is "infinitely" or "absolutely" worse in Case 1.

  **4. The "Memory Nihilist" Combination**
  *   **Pattern:** Case 6B (Memory wipe cancels suffering) + Case 2A (Eliminate joy to remove suffering).
  *   **Diagnosis:** **Incoherent.** If past suffering can be cancelled by later happiness/memory alteration (Case 6B), then the capacity for joy is necessary to "cancel" the bad. Yet, in Case 2A, they are willing to remove joy entirely to prevent suffering. If joy is necessary to redeem suffering (Case 6), removing it (Case 2) makes all remaining suffering unredeemable. This suggests a confusion about whether suffering is an objective historical fact or a subjective net balance.

  ---

  ## Seminar Debrief Guide

  1.  **Cluster the Room:** Group participants by their dominant position (CNU, LTV, WP, ARR).
  2.  **Highlight the Fault Lines:** Point out that while everyone agrees on the *goal* (reduce suffering), the **LTV** group cannot work on **WP** interventions (e.g., economic development that increases happiness but risks some suffering), and the **ARR** group cannot participate in **CNU** advocacy (e.g., lobbying for policies that cause minor harm to prevent major harm).
  3.  **Discuss the Empty Spaces:** Ask the room if anyone *wants* to occupy one of the "Unoccupied" positions. Why do they feel unstable? (This reveals the philosophical gravity holding the other positions together).
  4.  **Operationalize:** Conclude by assigning project teams based on ethical compatibility. A Lexical Threshold theorist will be frustrated working on a Weighted Prioritarian cost-benefit analysis model. Acknowledge this friction explicitly.
