  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Runs a tiny evaluation team (4 people) at a grant-making foundation. No economists. Limited theoretical background (one module 15 years ago).
      *   **Problem:** Receiving 12-15 proposals/quarter with varying welfare aggregation rules (utilitarian, prioritarian, maximin, household units, ex-ante vs. ex-post). Trustees want a principled way to evaluate these rules, not just pick the biggest number. A colleague claims Harsanyi's Aggregation Theorem proves *only* equal-weight sums are legitimate. The user suspects this is wrong/oversimplified.
      *   **Goal:** A reusable screening procedure (checklist) for grants officers (non-math, <1 hour) to evaluate proposals based on Harsanyi's Theorem conditions.
      *   **Requirements:**
          *   Step-by-step procedure (Question, Sufficient Answer, Action).
          *   Based on actual theorem conditions (individual rationality, social rationality, Pareto, uncertainty/expected utility, anonymity/weights).
          *   Distinguish between "theorem doesn't apply" vs. "proposal contradicts theorem."
          *   Highlight value judgments vs. factual checks.
          *   Run the procedure on three specific cases (Health/QALY, Education/Prioritarian, Lottery/Ex-ante vs. Ex-post).
          *   One case must get a "bad" verdict even if trustees like it (no softening).
          *   Conclude with limitations/failure modes.

  2.  **Deconstruct Harsanyi's Aggregation Theorem:**
      *   *What is it?* It connects individual preferences under uncertainty to social welfare.
      *   *Key Assumptions:*
          1.  **Individual Rationality:** Each individual satisfies Von Neumann-Morgenstern (vNM) axioms (completeness, transitivity, continuity, independence) over lotteries. They maximize *expected utility*.
          2.  **Social Rationality:** The social observer also satisfies vNM axioms over the same lotteries.
          3.  **Pareto Principle:** If everyone prefers A to B, society prefers A to B. If everyone is indifferent, society is indifferent.
          4.  **Common Priors:** Everyone agrees on the probabilities of states of the world.
      *   *Conclusion:* Social welfare function is a weighted sum of individual utilities ($W = \sum a_i U_i + b$).
      *   *Crucial Nuance:* The theorem *does not* prove weights must be equal ($a_i = a_j$). Equal weights require an additional ethical assumption (Anonymity/Impartiality). The theorem *does not* validate interpersonal comparability of utility levels or units without further calibration. It *does not* apply if individuals don't behave as expected utility maximizers. It *does not* settle ex-ante vs. ex-post equity debates directly without specifying the "individuals" in the theorem (are they people or person-states?).

  3.  **Drafting the Screening Procedure:**
      *   *Tone:* Practical, clear, non-technical but rigorous. Acknowledge the colleague's oversimplification.
      *   *Structure:* Steps mapping to theorem conditions.
      *   *Step 1: The Utility Metric (Individual Rationality).* Are the "welfare numbers" actually utilities derived from preferences under uncertainty? Or just scores?
      *   *Step 2: Interpersonal Comparability.* Can we compare Person A's gain to Person B's gain? (Theorem assumes this is possible via the weights, but doesn't dictate the scale).
      *   *Step 3: The Aggregation Rule (Pareto & Linearity).* Is it a weighted sum? If not, why?
      *   *Step 4: The Weights (Anonymity).* If it's a sum, are weights equal? If not, is there an ethical justification? (This is the value judgment step).
      *   *Step 5: Uncertainty & Timing (Ex-Ante vs. Ex-Post).* How are lotteries handled?
      *   *Decision Logic:* Pass (fits theorem), Fail (contradicts theorem), Escalate (value judgment/theorem inapplicable).

  4.  **Refining the Procedure (Self-Correction during drafting):**
      *   *Correction:* The colleague said Harsanyi proves equal weights. I need to make sure the procedure explicitly flags that Harsanyi allows *weighted* sums, and equal weights come from an *ethical* choice (Anonymity), not the math alone.
      *   *Correction:* Many proposals use QALYs or test scores, not vNM utilities. The procedure needs to catch this "metric mismatch" without automatically failing the proposal, but flagging it as "Theorem doesn't apply directly."
      *   *Correction:* Distinguish between "The proposal claims Harsanyi supports this" (False claim) vs. "The proposal uses a different rule" (Honest deviation).

  5.  **Developing the Three Cases:**
      *   *Case A (Health/QALY):* Standard utilitarian. QALYs are often treated as vNM utilities but often lack strict interpersonal calibration. *Verdict:* Mostly Pass, but flag the interpersonal comparability assumption.
      *   *Case B (Education/Prioritarian):* Claims Harsanyi supports concave weights. *Verdict:* Fail on the claim. Harsanyi allows weights, but not necessarily *concave transformation of utility* (that's prioritarianism, which modifies the individual utility function or the social function differently). Actually, Prioritarianism usually transforms *wellbeing* before summing. Harsanyi sums *utilities*. If they transform utility non-linearly, they violate the vNM structure for the social observer unless justified ethically. The claim that Harsanyi *requires* or *proves* prioritarianism is false. The claim that it *allows* it depends on weights. Let's make this the "Bad Verdict" case because they are misusing the theorem to justify a specific ethical stance as mathematical necessity.
      *   *Case C (Lottery/Ex-Ante vs. Ex-Post):* This is the Diamond/Harsanyi conflict. Harsanyi (ex-ante) vs. Diamond (ex-post equity). If they say "pick whichever," they are admitting indeterminacy. *Verdict:* Escalate. This is a pure value judgment the theorem highlights but doesn't solve.

      *Wait, I need one case to come out badly for a proposal trustees are keen on.*
      *   Let's make Case B the "keen on" one (helping worse-off kids is popular). The verdict must be: "Your justification is mathematically false."
      *   Let's make Case C the "awkward" one regarding the theorem's limits.
      *   Let's make Case A the "standard" one.

      *Refining Case B:* Prioritarianism (sum of concave transformation of utility) is distinct from Weighted Utilitarianism (sum of weighted utility). Harsanyi yields Weighted Utilitarianism. If they claim Harsanyi *proves* Prioritarianism, that's a fail.
      *Refining Case C:* The proposal says "pick whichever." This violates the Social Rationality axiom (consistency). This should be a Fail or Escalate. Let's make this the "Trustees like it because it's flexible" but the procedure says "This is incoherent."

      *Decision:* I will make Case B the one that gets the "Bad Verdict." Trustees love helping the poor (prioritarianism), but the proposal claims *mathematical necessity* via Harsanyi. The procedure must expose that as false.

  6.  **Drafting the Content:**

      *   *Introduction:* Acknowledge the colleague is half-right but dangerously oversimplified.
      *   *The Procedure:* 5 Steps.
          1.  Utility Source (vNM?)
          2.  Comparability (Same scale?)
          3.  Aggregation Form (Linear Sum?)
          4.  Weight Justification (Ethical vs. Math)
          5.  Uncertainty Handling (Ex-ante consistency)
      *   *The Cases:* Apply the steps rigorously.
      *   *Limitations:* What the checklist can't do (ethics, measurement error, non-welfarist values).

  7.  **Review against Constraints:**
      *   *Non-specialist language?* Yes, avoid heavy notation.
      *   *Under an hour?* Yes, 5 steps.
      *   *Explicit about value judgments?* Yes, Step 4 is key.
      *   *One hard verdict?* Case B will be told their justification is wrong.
      *   *Limitations section?* Included.

  8.  **Final Polish:** Ensure the distinction between "Weighted Utilitarianism" (Harsanyi) and "Prioritarianism" (Lockwood/Williams) is clear enough for a layperson. Harsanyi says $W = \sum a_i u_i$. Prioritarianism says $W = \sum g(u_i)$ where $g$ is concave. These are different. If the proposal says Harsanyi implies $g$, they are wrong.

      *Wait, one nuance:* Harsanyi's theorem *does* allow different weights ($a_i$). If the weights are higher for the poor, that looks prioritarian. But standard Prioritarianism transforms the *utility*, not just weights. I need to be careful not to get bogged down in technicalities. The core issue is the *claim* that the theorem *settles* the ethical weight. The theorem says "It's a weighted sum." It doesn't say "Weights must be equal" (that's anonymity) nor "Weights must be progressive." It leaves weights open. So claiming the theorem *dictates* prioritarian weights is false. Claiming it *allows* them is true. The prompt says the proposal justifies it by "following from the same theorem." That implies necessity. That's the error.

      *Case C:* The "pick whichever" approach violates the requirement for a consistent social ordering. That's a strong fail. I'll make Case C the "Trustees like it" one because it allows flexibility, but the procedure flags it as incoherent. Actually, the prompt asks for *one* to come out badly for a proposal trustees are keen on. I'll stick with Case B (Prioritarianism) being the popular one that gets flagged for misusing the theorem. Case C is just messy.

      *Wait, re-reading prompt:* "One of these should come out badly for a proposal the trustees are keen on."
      Okay, I will frame Case B (Education/Prioritarian) as the one the trustees love (helping disadvantaged kids), but the screening procedure must flag that their *justification* (Harsanyi proves this) is false. This is the "awkward verdict."

      *Let's refine the Procedure Steps for clarity:*
      1.  **The Metric:** Are these utilities or scores?
      2.  **The Uncertainty:** Do the numbers reflect risk attitudes?
      3.  **The Sum:** Is it a linear sum?
      4.  **The Weights:** Where did the weights come from? (Math vs. Ethics).
      5.  **The Timing:** Ex-ante or Ex-post consistency?

      *Let's write.*

      *(Self-Correction during drafting the response)*: I need to make sure I don't sound like I'm dismissing Prioritarianism. Prioritarianism is a valid ethical view. The issue is the *appeal to authority* (Harsanyi) to prove it. The procedure must catch "False Appeal to Authority."

      *Also, the colleague's claim:* "Theorem proves you must add utilities, therefore equal-weight sums are the only legitimate rule."
      *Correction:* Theorem proves weighted sum. Equal weights require Anonymity. I need to make sure the procedure highlights that *Equal Weights* is also an ethical choice, not just the Weighted Sum.

      *Okay, ready to generate.*
answer: |-
  ### Executive Summary for the Team

  Your colleague is half-right and half-dangerous. Harsanyi's Aggregation Theorem does prove that if you want to respect individual preferences under uncertainty and satisfy basic consistency rules, your social welfare function must be a **weighted sum of individual utilities**.

  However, it **does not** prove the weights must be equal. Equal weights require an additional ethical assumption (Anonymity: "a unit of utility counts the same regardless of who holds it"). Furthermore, the theorem only applies if the "utilities" being summed are actually derived from rational preferences over risk (Von Neumann-Morgenstern utilities), not just test scores or QALYs treated as cardinals without calibration.

  Below is the screening procedure you requested. It is designed to separate **mathematical coherence** (does this fit the theorem?) from **ethical choices** (do we like these weights?) and **measurement validity** (are these numbers actually utilities?).

  ---

  ### The Harsanyi Screening Procedure (HSP)
  **Time required:** 45–60 minutes per proposal.
  **User:** Grants Officer (Arithmetic only).
  **Goal:** Flag unjustified claims, measurement mismatches, and ethical value judgments disguised as math.

  #### Step 1: The Metric Check (Individual Rationality)
  *The theorem requires individuals to be "expected utility maximizers." Their welfare numbers must reflect their own attitudes toward risk, not just an external score of "goodness."*

  *   **Question to ask:** Does the proposal explain how the welfare numbers (utils, QALYs, scores) were derived from the beneficiaries' own preferences over risky outcomes, or are they external scores assigned by experts?
  *   **Sufficient Answer:** "We used a standard gamble method to elicit utilities," OR "We are using [Instrument X] which has been validated as a proxy for vNM utility in this population."
  *   **Insufficient Answer:** "We used test scores," "We used income," "We used expert-rated wellbeing scales," or no explanation.
  *   **Action:**
      *   **Pass:** Numbers are elicited utilities or validated proxies.
      *   **Escalate:** Numbers are proxy scores (e.g., QALYs, income). *Note: This does not kill the proposal, but it means Harsanyi's theorem does not strictly apply. The proposal is using 'Utilitarianism' as an ethical framework, not a mathematical derivation. Flag for Board: 'Ethical Choice, not Theorem-Driven'.*
      *   **Fail:** The proposal claims these numbers *are* rigorous utilities but provides no elicitation method.

  #### Step 2: The Comparability Check (Interpersonal Calibration)
  *The theorem allows summing utilities across people, but only if the units are comparable. A '1' for Person A must mean the same welfare change as a '1' for Person B.*

  *   **Question to ask:** Does the proposal provide a method for calibrating Person A's utility scale against Person B's? (e.g., anchoring both to a common 'zero' and 'one' point, like death vs. perfect health).
  *   **Sufficient Answer:** "All utilities are normalized on a 0–1 scale anchored to [Common Reference Point]," or "We assume interpersonal comparability based on [Specific Ethical/Metric Assumption]."
  *   **Insufficient Answer:** "We assume they are comparable," with no anchoring, or "It doesn't matter because we just sum them."
  *   **Action:**
      *   **Pass:** Explicit calibration or anchoring described.
      *   **Escalate:** Comparability is assumed without calibration. *Note: This is standard in many foundations, but it is an ethical assumption, not a mathematical fact. Flag for Board: 'Requires Interpersonal Comparability Assumption'.*
      *   **Fail:** The proposal explicitly states utilities are only ordinal (rankings) but sums them anyway. (You cannot sum rankings).

  #### Step 3: The Aggregation Check (Linearity)
  *Harsanyi's conclusion is that Social Welfare ($W$) is a linear weighted sum of Individual Utilities ($U_i$). Formula: $W = a_1U_1 + a_2U_2 + ...$*

  *   **Question to ask:** Is the final welfare score calculated by multiplying each person's utility by a weight and adding them up?
  *   **Sufficient Answer:** "Yes, we sum the weighted utilities."
  *   **Insufficient Answer:** "We take the minimum," "We square the utilities before summing," "We sum the utilities then apply a discount rate to the total."
  *   **Action:**
      *   **Pass:** Linear weighted sum.
      *   **Escalate:** Non-linear aggregation (e.g., Prioritarian transformation, Maximin). *Note: This is not 'wrong', but the proposal cannot claim Harsanyi's theorem *requires* this. It is a deviation from the theorem. Flag for Board: 'Deviation from Harsanyi Aggregation'.*
      *   **Fail:** The proposal claims Harsanyi's theorem *mandates* their specific non-linear rule. (This is a false claim of mathematical necessity).

  #### Step 4: The Weights Check (Anonymity vs. Ethics)
  *The theorem proves you need weights ($a_i$), but it does not prove what those weights should be. Equal weights ($a_i = 1$) require an ethical commitment to Anonymity. Unequal weights require an ethical commitment to Priority or Need.*

  *   **Question to ask:** How were the weights ($a_i$) chosen? Does the proposal claim the math dictates the weights, or that the weights reflect a value judgment?
  *   **Sufficient Answer:** "We used equal weights based on a principle of impartiality," OR "We used higher weights for the disadvantaged based on a prioritarian ethical stance."
  *   **Insufficient Answer:** "The theorem requires equal weights," OR "The theorem requires higher weights for the poor."
  *   **Action:**
      *   **Pass:** Weights are explicitly linked to an ethical principle (Impartiality OR Priority).
      *   **Escalate:** Weights are chosen to maximize the final score or are unspecified.
      *   **Fail:** The proposal claims the *theorem itself* dictates the specific weights (e.g., "Harsanyi proves we must weight the poor higher"). *This is mathematically false. The theorem leaves weights undetermined.*

  #### Step 5: The Uncertainty Check (Ex-Ante Consistency)
  *The theorem applies to choices under uncertainty. If the proposal involves lotteries (e.g., allocating scarce slots), the evaluation must be consistent.*

  *   **Question to ask:** If the intervention involves a lottery (random allocation), does the proposal evaluate welfare based on the *expected* utility before the draw (Ex-Ante) OR the *realized* utility after the draw (Ex-Post)? Do they stick to one?
  *   **Sufficient Answer:** "We evaluate Ex-Ante expected utility," OR "We evaluate Ex-Post realized utility," with a justification for the choice.
  *   **Insufficient Answer:** "We calculated both and picked the one that looked better," or "It doesn't matter."
  *   **Action:**
      *   **Pass:** Consistent approach (Ex-Ante or Ex-Post) applied throughout.
      *   **Escalate:** Mixed approach without justification.
      *   **Fail:** The proposal explicitly switches methods to alter the ranking of the project. (This violates the Social Rationality axiom of the theorem).

  ---

  ### Application to Three Normal Cases

  Here is how the HSP handles the three scenarios you described.

  #### Case A: The Health Proposal (QALY Summation)
  *   **Proposal:** Sums expected QALYs across beneficiaries at equal weight. Uses a standard instrument (e.g., EQ-5D). Numbers elicited within persons, compared across persons.
  *   **HSP Run:**
      *   *Step 1 (Metric):* **Escalate.** QALYs are proxies, not strictly vNM utilities elicited from these specific beneficiaries.
      *   *Step 2 (Comparability):* **Pass.** QALYs are anchored (0=Death, 1=Perfect Health).
      *   *Step 3 (Aggregation):* **Pass.** Linear sum.
      *   *Step 4 (Weights):* **Pass.** Equal weights justified by impartiality.
      *   *Step 5 (Uncertainty):* **Pass.** Uses expected QALYs (Ex-Ante).
  *   **Verdict:** **PASS with Note.**
  *   **Board Brief:** "This proposal is mathematically coherent as a Utilitarian framework. However, note that treating QALYs as interchangeable across people is an ethical assumption, not a mathematical fact. The Harsanyi theorem supports the *structure* (summing), but not the *metric* (QALYs). This is a standard, defensible approach, provided the Board accepts QALYs as a valid proxy for welfare."

  #### Case B: The Education Proposal (Prioritarian Weights)
  *   **Proposal:** Applies concave weights to utility gains (a gain to a worse-off child counts for more). Justification: "This follows from Harsanyi's Aggregation Theorem." Trustees love this because it targets disadvantage.
  *   **HSP Run:**
      *   *Step 1 (Metric):* **Pass.** Assume test scores are calibrated to utility.
      *   *Step 2 (Comparability):* **Pass.** Assume calibration exists.
      *   *Step 3 (Aggregation):* **Escalate.** Concave transformation of utility before summing is *Prioritarianism*, not standard Harsanyi Utilitarianism (which is linear).
      *   *Step 4 (Weights):* **FAIL.** The proposal claims the *theorem* dictates the weights/transformation.
      *   *Step 5 (Uncertainty):* **Pass.**
  *   **Verdict:** **FAIL on Justification.**
  *   **Board Brief:** "The Board may like the ethical goal of prioritizing the disadvantaged, and we can fund this if we choose that ethical stance. However, the proposal's claim that Harsanyi's theorem *proves* this is the correct rule is **mathematically false**. Harsanyi allows for weighted sums, but it does not mandate progressive weights, nor does it mandate a concave transformation of utility. This is an ethical choice disguised as a mathematical necessity. **Recommendation:** Fund only if the Board explicitly adopts Prioritarianism as a value, but require the applicant to correct their justification. Do not accept 'the math made us do it' as an argument."

  #### Case C: The Lottery Proposal (Ex-Ante vs. Ex-Post)
  *   **Proposal:** Scarce places allocated by lottery. Applicants computed welfare both before the draw (Ex-Ante) and after (Ex-Post). The rankings disagree. Their note says: "Pick whichever reading you prefer." Trustees like this flexibility.
  *   **HSP Run:**
      *   *Step 1 (Metric):* **Pass.**
      *   *Step 2 (Comparability):* **Pass.**
      *   *Step 3 (Aggregation):* **Pass.**
      *   *Step 4 (Weights):* **Pass.**
      *   *Step 5 (Uncertainty):* **FAIL.** Switching criteria to alter the ranking violates the consistency required by the theorem (Social Rationality).
  *   **Verdict:** **FAIL on Coherence.**
  *   **Board Brief:** "This proposal is incoherent. Harsanyi's theorem (and basic decision theory) requires a consistent rule for evaluating risk. If you evaluate Ex-Ante, you value the fairness of the chance. If you evaluate Ex-Post, you value the equality of the outcome. You cannot do both and pick the winner. **Recommendation:** Return to applicant. They must commit to one perspective. If they refuse, this proposal introduces arbitrary decision-making into our portfolio."

  ---

  ### Limitations: What This Procedure Cannot Do

  This checklist is a filter, not a oracle. Be aware of these failure modes:

  1.  **It Cannot Settle Ethical Disputes:** The procedure identifies when a proposal is making an *ethical* claim (e.g., "we weight the poor higher") versus a *mathematical* claim. It cannot tell you if weighting the poor higher is *good*. That is for the Trustees.
  2.  **It Cannot Validate Measurement:** If a proposal says "We elicited utilities" but did it badly, this checklist will Pass them. It checks for the *presence* of method, not the *quality* of execution.
  3.  **The "Non-Welfarist" Blind Spot:** Harsanyi assumes welfare is all that matters. If a proposal argues for funding based on "Rights," "Justice," or "Desert" (independent of welfare outcomes), this procedure will flag it as "Theorem Doesn't Apply." That is not a failure of the proposal, but a limit of the theorem.
  4.  **False Confidence:** A "Pass" verdict means the proposal is *internally consistent* with the theorem's assumptions. It does not mean the project will work, or that the assumptions (like interpersonal comparability) are actually true in the real world.
  5.  **When to Call an Economist:** If a proposal passes all steps but the Trustees remain divided on the ethical implications (e.g., Ex-Ante vs. Ex-Post in Case C), do not use the checklist to break the tie. That is a philosophical impasse, not a technical one. Bring in an external welfare economist to facilitate that specific discussion.

  ### Final Note to the Team
  Your colleague's summary ("equal-weight sums are the only legitimate rule") is the exact kind of error this procedure is designed to catch. Harsanyi proves **Weighted Sums**. Equal weights are a specific ethical subset of that. By using this checklist, you protect the Board from mathematical overreach (Case B) and procedural incoherence (Case C), while allowing them to make value choices (Case A & B ethics) with their eyes open.
