answer: |-
  The pattern of practices described presupposes a **Hybrid Theory of Normative Authority**. This theory distinguishes between three distinct sources of obligation—sovereign command, contractual agreement, and social convention—and assigns them different conditions for binding force, enforceability, and the excusability of ignorance. For the three responses (discretionary tip, mandatory charge, and jaywalking fine) to hang together, the theory must assert that the *deontic status* of an action (whether it is optional, obligatory, or prohibited) is determined not by the intrinsic nature of the act or the sum of money involved, but by the **institutional classification** of the context in which it occurs.

  ### I. The Source of Binding Force

  For the system to cohere, the following must be true about the source of a convention's binding force:

  1.  **Sovereignty Binds by Presence (Jaywalking):** Legal ordinances derive their force from the state's claim to jurisdiction over a territory. Presence within the territory constitutes submission to the authority. Therefore, ignorance is no excuse because the obligation is not predicated on the agent's internal state or knowledge, but on their physical location relative to the sovereign power.
  2.  **Contract Binds by Notice (Auto-Grat ≥8):** When the restaurant imposes an automatic service charge, it reclassifies the transaction from a social exchange to a commercial contract. The binding force arises from the *terms of service*. Ignorance is generally not an excuse here because the obligation is triggered by *notice* (the printed bill or menu disclaimer) rather than shared cultural knowledge. The restaurant unilaterally sets the terms; the customer accepts them by consuming the service.
  3.  **Convention Binds by Mutual Recognition (Tip <8):** The discretionary tip operates as a social norm. Its binding force is not legal but moral, rooted in **fair play** and **reciprocity**. It binds only those who are participants in the shared practice. Because the obligation relies on a mutual understanding of "how things are done," ignorance *does* excuse. If an agent does not know the custom, they cannot be said to have violated the reciprocity of the practice; they are merely an outsider, not a free-rider.

  **The Paradox of the Identical Sum:**
  For the same sum to be optional at a table of two and compulsory at a table of eight, the theory must presuppose that **institutional framing overrides material identity.** The money is identical, but the *description* of the payment changes. At a table of two, the payment is a *gratuity* (a post-hoc evaluation of service). At a table of eight, it is a *service charge* (a pre-hoc cost of goods). The binding force shifts because the restaurant exercises the authority to convert a social norm into a contractual term based on administrative risk (large parties are statistically more likely to under-tip or split checks). The theory assumes the establishment has the normative power to toggle the status of the payment between "gift" and "price."

  ### II. Strict Requirements vs. Comfortable Fits

  To reconstruct the theory accurately, we must distinguish what the practices logically entail from what they merely tolerate.

  **What the Practices Strictly Require:**
  *   **Differentiation of Normative Spheres:** The system requires that legal, contractual, and moral obligations remain distinct. If the tip were legally enforceable for small parties, ignorance would cease to excuse. If jaywalking were merely a convention, ignorance would excuse.
  *   **The Power of Reclassification:** The restaurant must possess the authority to change the normative status of the tip based on party size without the customer's explicit renegotiation.
  *   **The Epistemic Condition:** There must be a genuine distinction between *knowing the law* (not required for binding force) and *knowing the custom* (required for binding force).

  **What the Practices Merely Sit Comfortably With:**
  *   **The Moral Equivalence of the Sum:** The system sits comfortably with the idea that the staff needs the money equally in both scenarios, even though the *obligation* to provide it differs. It tolerates the moral tension that a server's livelihood depends on a compulsory charge for one table and a moral whim for another.
  *   **The Arbitrary Threshold:** The distinction between seven and eight people is administratively convenient but philosophically arbitrary. The theory tolerates this bright line even though the moral risk of stiffing the server does not magically jump at the eighth person.
  *   **The "Suggested" Percentage:** Printing 18–22% on the receipt sits comfortably with the claim that the tip is discretionary. It creates a "soft coercion" that mimics a bill without the legal force of one. The theory allows this ambiguity to persist: it is a command dressed as a suggestion.

  ### III. Points of Philosophical Underdetermination

  The current pattern is underdetermined by several rival accounts of normativity. The practices do not settle which of the following is the true justification for the obligation:

  1.  **The Labor Theory vs. The Gift Theory:** Is the tip payment for labor already owed (a deferred wage) or a gift for exceptional service?
      *   *Underdetermination:* If it is a wage, the discretionary tip is morally required regardless of party size, and the current system underpays. If it is a gift, the auto-grat is misleadingly named. The practice treats it as a wage for large parties and a gift for small ones, without resolving the ontological status of the money.
  2.  **The Fair Play Principle vs. Consequentialism:** Why does ignorance excuse the non-tipper?
      *   *Underdetermination:* Is it because they didn't violate fair play (they didn't take advantage of a known system)? Or is it because blaming them produces bad social utility (discouraging tourism)? The practice treats ignorance as an excuse, but it is unclear if this is because the *duty* vanishes without knowledge, or because the *blame* is withheld despite the duty.
  3.  **The Source of the Auto-Grat:** Is the service charge a price or a tax?
      *   *Underdetermination:* Legally, it is a price. Socially, it is often treated as a tip pool. Philosophically, it is unclear if the customer is paying the *restaurant* (contract) or the *server* (moral duty mediated by contract). This matters for who owns the money if the restaurant goes bankrupt.

  ### IV. The Voluntarist Shift: "Norms Bind Only Upon Uptake"

  If we replaced the presupposed Hybrid Theory with a strict **Voluntarist Theory** (conventional norms bind only those who have in some way taken them up/consented to them), the practices would require radical alteration to remain coherent. Under voluntarism, presence does not imply consent, and custom does not bind outsiders.

  **1. Changes to Restaurant Billing:**
  *   **Explicit Opt-In:** The "suggested percentages" on the receipt would become impermissible coercion, as they pressure a commitment the customer has not explicitly made. The receipt would need a blank line with no suggestions, or better, the terms of tipping would need to be agreed to *before* service is rendered.
  *   **Auto-Grat as Contract:** The automatic service charge for large parties would require explicit signature or verbal agreement *before* seating, not merely notice on the bill. The bill arrives too late for "uptake"; consent must precede the obligation.
  *   **Menu Transparency:** Menus would need to state clearly: "Prices exclude service. Service is voluntary unless agreed otherwise." The current ambiguity relies on social pressure, which voluntarism rejects as binding.

  **2. Changes to the Ordinance (Jaywalking):**
  *   **No Binding Force on Visitors:** If norms bind only by uptake, a city ordinance cannot bind a visitor who has not consented to the city's authority. The fine for jaywalking would be unenforceable against tourists or new residents unless they signed a waiver upon entry.
  *   **Privatization of Streets:** To make jaywalking rules binding under voluntarism, streets would effectively need to be treated as private property (like the restaurant). Entry would constitute a contract. Public law would collapse into private contract law.

  **3. Changes in Treatment of Visitors:**
  *   **Universal Excuse of Ignorance:** We could no longer treat the non-tipper or the jaywalker as having committed a moral failure if they had not explicitly taken up the norm. Social sanction (dirty looks, shaming) would be unjustified, as the agent violated no rule they had accepted.
  *   **Duty to Inform:** The burden would shift from the visitor to learn the norms to the locals to *explain* the norms before they become binding. A host would be obligated to tell a guest, "Here, we tip 20%," before the guest could be obligated to do so.

  **Conclusion:**
  The current pattern presupposes a world where **authority is fragmented**: the State commands by presence, the Market contracts by notice, and Society obligates by shared understanding. It relies on the fluidity of these boundaries to allow a restaurant to act as a mini-sovereign (imposing charges) and a social club (expecting tips). A strict Voluntarist theory would shatter this fluidity, demanding explicit consent for every obligation, thereby turning every meal into a negotiated treaty and every street crossing into a border crossing. The current system survives only because we tacitly agree to be bound by things we have not explicitly chosen, provided the "price" of that obligation is socially convenient.
