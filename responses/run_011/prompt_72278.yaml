  5.  **Committing to a Position:**
      *   *On the Gloss:* It's insight. Economics *is* cybernetics (Stafford Beer would agree).
      *   *On Mises vs. Hayek:* Hayek is the stronger constraint for a co-op. Mises's "no signal" is too absolute for internal accounting, but Hayek's "lag" is the killer.
      *   *On the Cases:*
