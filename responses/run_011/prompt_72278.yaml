answer: |-
  ### 1. The Control-Theory Gloss
  You are not reading your trade into them; you are seeing the mechanism they missed. Economics is cybernetics without the block diagrams.
  *   **Lange:** You are correct. Iterative shadow pricing is a slow feedback loop acting on a fast, non-linear plant. It will hunt.
  *   **Mises:** You are correct. Without transferable ownership, there is no "error signal" generated by loss, only accounting entries. It is a sensor that measures nothing.
  *   **Hayek:** You are correct. The bandwidth of the central board is lower than the bandwidth of the shop floor.

  **The Verdict:** Hayek is the binding constraint for a co-op, not Mises. Mises requires private property to generate a signal; you have collective property. You *can* generate an internal signal, but Hayek warns that by the time the board calculates it, the disturbance has passed. **Price is a high-frequency filter.** If the allocation decision needs to happen faster than the board can meet, price must be delegated to the edge. If the asset is long-life (capital), price introduces noise into investment signals.

  ### 2. The Allocation Decision Procedure
  *Use this sequence for any "Let's Price It" motion. If any step fails, stop.*

  **Step 1: The Rivalry Test (Mises Condition)**
  *   **Question:** If Member A uses this unit, is it physically unavailable to Member B *at that specific time*?
  *   **Pass:** Yes (e.g., one van, one machine hour).
  *   **Fail:** No (e.g., digital files, bulk buying discounts).
  *   **Stop:** If Fail, do not price. Use open access or bulk allocation.
  *   **[JUDGMENT CALL]:** Defining "specific time." Is a van unavailable if it's parked but reserved? *Define reservation windows clearly.*

  **Step 2: The Latency Test (Hayek Condition)**
  *   **Question:** Can the user adjust their behavior to the price *faster* than the board can adjust the price to scarcity?
  *   **Pass:** Yes (e.g., daily van use, hourly machine time). Users see price, decide instantly.
  *   **Fail:** No (e.g., housing leases, annual budgets). Board sets price once a year; need fluctuates weekly.
  *   **Stop:** If Fail, do not price. Use queue, seniority, or needs-assessment.
  *   **[JUDGMENT CALL]:** Who sets the price? If the GM sets it, it's administrative. If the market sets it, it's pricing. *If the board must vote to change the rate, you fail this test.*

  **Step 3: The Horizon Test (Capital vs. Flow)**
  *   **Question:** Is this asset consumed in <6 months (Flow) or does it last >5 years (Capital)?
  *   **Pass (Flow):** Consumables, fuel, driver hours, van slots.
  *   **Fail (Capital):** Machines, buildings, land units.
  *   **Stop:** If Fail, do not use internal pricing for allocation. Use depreciation schedules and grant allocation. Pricing capital goods internally creates a "hold-up" problem where co-ops under-invest to avoid internal charges.
  *   **[JUDGMENT CALL]:** 5 years is arbitrary. *Use the asset's depreciation schedule.*

  **Step 4: The Mission Corrosion Test (Values)**
  *   **Question:** Does attaching a price to this resource discourage the exact behavior we exist to promote?
  *   **Pass:** No (e.g., discouraging van hoarding is good).
  *   **Fail:** Yes (e.g., discouraging a struggling co-op from using the CNC to prototype a lifeline product).
  *   **Stop:** If Fail, do not price. Use subsidy or quota.
  *   **[JUDGMENT CALL]:** "Struggling" is subjective. *GM must define hardship criteria.*

  **Sign-Off Protocol:**
  *   **Board Action:** Steps 1, 2, and 4. These are policy/values.
  *   **GM Sign-Off:** Step 3 (Financial impact) and implementation of any pricing mechanism (Step 2 Pass).

  ### 3. Running the Cases

  **Case A: CNC Machine Time**
  *   **Step 1 (Rivalry):** Pass. One spindle, one user.
  *   **Step 2 (Latency):** Fail. Setup time is long. Jobs vary in complexity. A flat hourly price punishes complex, necessary work. Board cannot tune price fast enough to match job mix.
  *   **Step 3 (Horizon):** Fail. Capital good.
  *   **Verdict:** **NO PRICE.** Use a scheduling queue with priority based on project urgency (vetted by GM).
  *   **Reason:** Pricing creates a barrier to experimentation. You want high utilization, not high revenue from internal transfers.

  **Case B: Delivery Van Slots**
  *   **Step 1 (Rivalry):** Pass. One van, one driver.
  *   **Step 2 (Latency):** Pass. Need is daily/weekly. Price can be static (e.g., $/day) and users self-regulate immediately.
  *   **Step 3 (Horizon):** Pass. Operational flow (fuel/driver time/depreciation usage).
  *   **Step 4 (Mission):** Pass. Prevents hoarding by wealthy co-ops.
  *   **Verdict:** **PRICE IT.** Internal transfer price covering fuel + maintenance + depreciation reserve.
  *   **Reason:** This is a classic congestion problem. Price clears the market faster than a meeting can.
  *   **GM Sign-Off:** Required to set the rate.

  **Case C: Affordable Housing Units**
  *   **Step 1 (Rivalry):** Pass. One unit, one tenant.
  *   **Step 2 (Latency):** Fail. Leases are annual. Scarcity is structural, not fluctuating.
  *   **Step 3 (Horizon):** Fail. Building is capital.
  *   **Step 4 (Mission):** Fail. "Affordable" implies price is decoupled from market scarcity. Pricing allocates to the highest bidder, not the neediest.
  *   **Verdict:** **NO PRICE.** Use needs-based application and queue.
  *   **Reason:** This is a subsidy vehicle. Pricing it turns it into a market asset, defeating the Land Trust's purpose.

  ### 4. Commitment and Counter-Argument

  **My Position:**
  Your control-theory gloss is **insight**, not error. You have identified that the Socialist Calculation Debate was actually a debate about system architecture.
  *   **Winner:** Hayek wins on the van slots (distributed decision-making via price). Mises wins on the housing (no genuine opportunity cost signal in a subsidized trust). Lange loses on the CNC (central scheduling is too slow, but pricing is wrong for capital).
  *   **Your Van Argument:** You were right to argue for pricing the vans. It reduces the control loop latency from "monthly board meeting" to "instant driver decision."

  **The Strongest Counter-Argument:**
  A colleague will say: *"Internal pricing creates inequality. The wealthy co-op buys all the van slots and the struggling co-op walks. Pricing monetizes solidarity."*

  **Why It Doesn't Move Me:**
  Inequality of outcome is a **distribution** problem, not an **allocation** problem.
  *   If the struggling co-op can't afford the van rate, the solution is a **subsidy grant** (feedforward control), not a broken allocation mechanism (feedback control).
  *   If you remove the price to help the struggling co-op, the wealthy co-op hoards the vans, and *both* lose.
  *   **Fix the sensor (subsidy), don't break the valve (allocation).**

  **Where This Procedure Misfires:**
  1.  **Collusion:** If the nine co-ops are friendly, they may game the van price (keep it artificially low). *Mitigation: GM reviews rates against external market rental annually.*
  2.  **Measurement Cost:** If tracking van hours costs more in admin time than the fuel saved, the loop is unstable. *Mitigation: Flat daily rate, not hourly.*
  3.  **Values Drift:** Over time, Step 4 erodes. Everything becomes a transaction. *Mitigation: Re-run Step 4 annually.*

  **Final Instruction to Board:**
  Adopt the procedure. Run the Van motion through Step 2. If the GM can set a rate without coming back to the board for every change, approve it. Kill the CNC pricing motion at Step 3. Kill the Housing pricing motion at Step 4. Stop arguing theory; tune the loop.
