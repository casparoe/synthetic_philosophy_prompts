      *   **Intellectual Framework:** User interprets the Socialist Calculation Debate through control theory:
          *   Lange = Integral-only control loop (unstable with lag/drift).
          *   Mises = No signal exists without ownership (sensor missing).
          *   Hayek = Signal exists but is local/transient/stale by the time it reaches the center (sampling rate/sensor placement issue).
      *   **Task:** Write a one-page decision procedure for the board to evaluate "let's price it" motions.
      *   **Requirements:**
          *   Order questions logically.
          *   Define sufficient answers.
          *   Define stop points (No) vs. deliberation points (Values).
          *   Keep Mises and Hayek objections separate.
