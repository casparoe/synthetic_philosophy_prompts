          *   No references/reading lists.
          *   Tone: Direct, practical, respectful of expertise, decisive.

  2.  **Deconstruct the Economic/Control Theory Analogy:**
      *   *User's Gloss:* It's actually quite good. Lange *did* propose an iterative trial-and-error method by a central board, which implies lag. Mises *did* argue private property is necessary for genuine price signals (no property = no signal). Hayek *did* argue knowledge is dispersed and tacit (local sensors).
      *   *My Position:* I need to commit. The user's control theory gloss is *insightful*, not a category error, but it needs a specific tweak regarding *feedback latency*. In a co-op, the "board" isn't a central planner in the Soviet sense, but an internal allocation mechanism.
      *   *Mises vs. Hayek:* They are distinct. Mises says "you can't calculate profit/loss without private ownership of capital." Hayek says "even if you could, you don't have the data fast enough." In a co-op context, Mises translates to: "Is there a genuine opportunity cost signal generated by exchange, or just an accounting fiction?" Hayek translates to: "Can the people who know the need access the resource fast enough without bureaucratic lag?"

  3.  **Drafting the Decision Procedure (The "Algorithm"):**
      *   Need to be concise (one-page equivalent).
      *   Step 1: Existence of Signal (Mises). Is there a rivalrous scarcity that generates real opportunity costs?
      *   Step 2: Latency & Locality (Hayek). Can the price adjust faster than the need changes?
