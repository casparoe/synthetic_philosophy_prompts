  ### Model Answer

  **Part A**
  We are looking for the probability *p* that maximizes the chance of exactly one YES out of twenty people. Since everyone uses the same strategy, this follows a binomial distribution. We want exactly one success (YES) and nineteen failures (NO).

  The probability that a specific person says YES while the other nineteen say NO is:
  $p \times (1 - p)^{19}$

  However, any one of the twenty people could be the unique winner. There are 20 possible candidates for that single YES. So, the total probability of success ($P_{success}$) is:
  $P_{success} = 20 \times p \times (1 - p)^{19}$

  To find the maximum, we can look at how this value changes as *p* changes. Without using calculus, we can reason that for a product of factors summing to a constant, the product is maximized when the factors are equal. Alternatively, using standard optimization for this function (or checking the derivative), the maximum occurs when *p* equals 1 divided by the number of participants.

  Mathematically, if we set the derivative with respect to *p* to zero:
  $\frac{d}{dp} [20p(1-p)^{19}] = 20[(1-p)^{19} - 19p(1-p)^{18}] = 0$
  Dividing by $20(1-p)^{18}$:
  $(1 - p) - 19p = 0$
  $1 = 20p$
  $p = 1/20$ or $0.05$

  **Answer:** The optimal probability is 1/20 (5%).

  **Part B**
  We assume the other 19 participants each play YES with probability $p = 1/20$. Consequently, the probability they play NO is $19/20$.

  1.  **If I reply YES:**
      For me to win in Case Two, exactly one person must say YES. Since I am saying YES, all other 19 must say NO.
      Probability = $(19/20)^{19}$
      Payoff = $10,000,000
      Expected Value (YES) = $10,000,000 \times (19/20)^{19}$

  2.  **If I reply NO:**
      For me to win in Case Two, exactly one person must say YES. Since I am saying NO, exactly one of the other 19 must say YES.
      There are 19 people who could be that unique YES voter.
      Probability = $19 \times (1/20) \times (19/20)^{18}$
      Simplifying: $19 \times (1/20) = 19/20$. So, Probability = $(19/20) \times (19/20)^{18} = (19/20)^{19}$
      Payoff = $10,000,000
      Expected Value (NO) = $10,000,000 \times (19/20)^{19}$

  3.  **Comparison and Implication:**
      The expected values are identical. I am indifferent between voting YES or NO.
      In Case Two, ordinary self-interest does not tempt me to break the superrational agreement. Because I win regardless of whether I am the unique voter or merely a bystander to a unique voter, I have no selfish reason to try to claim the "winner" spot.
      This implies the superrational agreement is stable in Case Two. In contrast, in Case One, if I vote NO, I get nothing even if someone else wins. Therefore, in Case One, self-interest would tempt me to switch to YES to claim the prize, undermining the agreement. Case Two removes the competition, leaving only the coordination problem.

  **Part C**
  In the Telegram Problems, each person has a binary choice (YES/NO). You cannot "outbid" others by trying harder; you can only adjust your probability. This limits the arms race.

  In the Luring Lottery, the prize is divided by the total number of entries. If I submit more entries, I increase my chance of winning proportionally, but I decrease the value of the prize for everyone (including myself) only slightly if the total pool is large.
  Specifically, if the total entries are $T$ and I submit $k$ entries, my chance is $k/T$ and the prize value is $M/T$. My expected return is roughly proportional to $k/T^2$. However, because I can choose $k$ independently, I have an incentive to make $k$ as large as possible to dominate the draw, regardless of the damage to the prize value.
  The Telegram Problems prevent this because "voting YES twice" is impossible. The Luring Lottery allows infinite escalation, turning a coordination problem into a tragedy of the commons where rational self-interest drives the prize value to zero.

