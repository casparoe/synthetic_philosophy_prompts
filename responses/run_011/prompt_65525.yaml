  4.  **Selection:** I am choosing the **Stability of Cooperation** crux. It reveals the precise algebraic difference between the cases: in Case One, standard self-interest undermines the superrational solution (you want to be the unique winner), whereas in Case Two, self-interest aligns with the group outcome (you are indifferent to who wins, provided someone does). This allows Part B to test whether candidates understand *why* symmetry matters, not just *how* to calculate it.

