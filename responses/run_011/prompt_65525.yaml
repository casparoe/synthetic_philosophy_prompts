  **Part B (10 Marks)**
  *   **3 marks:** Correct EV calculation for YES (must show $(19/20)^{19}$).
  *   **3 marks:** Correct EV calculation for NO (must show the combinatorial factor of 19 cancels the 1/20 probability).
  *   **2 marks:** Correct conclusion (Indifference).
  *   **2 marks:** Insightful comparison to Case One (noting Case One creates an incentive to deviate to YES).
  *   *Competent vs. Excellent:* A competent answer calculates the numbers correctly. An excellent answer explicitly articulates *why* the indifference matters (stability of the agreement vs. temptation to defect).
  *   *Common Mistakes:* Assuming EV(NO) is zero in Case Two (confusing it with Case One); failing to see the algebraic equivalence of the two EVs. Deduct 3 marks if the candidate claims there is a strict preference for YES or NO.

  **Part C (6 Marks)**
  *   **3 marks:** Identifying the scalable entry mechanism (submitting multiple entries/numbers).
  *   **3 marks:** Explaining the incentive mismatch (individual gain from more entries vs. collective loss from prize division).
  *   *Competent vs. Excellent:* A competent answer says "people got greedy." An excellent answer explains the structural difference (binary choice vs. continuous scaling).
  *   *Common Mistakes:* Focusing on the dice roll recommendation rather than the postcard numbers; blaming "irrationality" rather than incentive structure.

