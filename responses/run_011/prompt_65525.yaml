  ### Decision Theory Unit: Closing Assessment

  **Time Allowed:** Ninety minutes
  **Materials:** Notes and pocket calculator permitted
  **Total Marks:** 25

  **Instructions:** Answer all three parts. Show your working for any calculations. Clear verbal reasoning is worth as much as correct arithmetic.

  **Case One:** An anonymous benefactor sends identical letters to twenty adults who have never met and who know nothing about one another beyond the fact that they have all received the same letter. Each must reply either YES or NO by noon on Friday. If exactly one of the twenty replies YES, that person receives ten million dollars and the other nineteen receive nothing. If two or more reply YES, or if all twenty reply NO, nobody receives anything. The twenty cannot communicate.

  **Case Two:** Everything is exactly as in Case One, with one change to the payment rule: if exactly one of the twenty replies YES, then all twenty receive ten million dollars each. Two or more YES replies, or twenty NO replies, still leave everyone with nothing.

  In both cases, assume that each of the twenty cares only about how much money they personally receive and not at all about what the others receive; that each is in precisely the same epistemic position as every other; and that each has read the same material and reasons at least as carefully as you do. Do not trouble yourself with whether a benefactor would really arrange matters this way — treat the rules as given.

  **Part A (9 marks)**
  Assume the group adopts a superrational strategy: everyone chooses to reply YES with the same probability *p*, aiming to maximize the chance that exactly one person replies YES. Calculate the value of *p* that maximizes the probability of success. Show your derivation.

  **Part B (10 marks)**
  Consider Case Two specifically. Suppose you believe the other nineteen participants will each play YES with the probability *p* you calculated in Part A.
  1. Calculate your expected payoff if you reply YES.
  2. Calculate your expected payoff if you reply NO.
  3. Based on these figures, does ordinary self-interested calculation tempt you to change your strategy, or are you indifferent? Explain what this implies about the stability of the superrational agreement in Case Two compared to Case One.

  **Part C (6 marks)**
  Compare the Telegram Problems above with the actual Luring Lottery run by Hofstadter. In that lottery, a prize of one million dollars was divided by the total number of entries received and paid to whoever held the entry drawn at random. Readers could submit as many entries as they liked by writing a single number on a postcard. The column recommended rolling dice to decide whether to send an entry (a one-in-many chance). However, many readers wrote numbers so vast that the prize, once divided, would have been worth a fraction of a cent.
  Explain why the Luring Lottery structure invites this destructive behaviour (submitting vast numbers) while the Telegram Problems do not. Focus on the relationship between an individual's effort and the total prize pool.

