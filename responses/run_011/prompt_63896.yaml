answer: |-
  ### 1. Does an established concept exist?

  No. There is no single, established term of art in the philosophy of science, medicine, or epidemiology that captures this specific *triadic* configuration (extension shift + warrant transfer + failure absorption) as a unified phenomenon.

  You have correctly identified a gap in the vocabulary. The existing terms are either too normative (focusing on harm), too macro-historical (focusing on paradigm shifts), or too methodological (focusing on measurement properties without the ontological baggage).

  ### 2. Candidate Neighbors: Ranking and Limitations

  Here are the closest existing concepts, ranked by proximity to your description, with their specific deficits.

  **A. Measurement Invariance (Psychometrics/Epidemiology)**
  *   **What it captures:** This is the methodological requirement that a measure must assess the same underlying construct across different groups or times. If you change a cut-point or assay, you technically break invariance and must re-validate the association with outcomes.
  *   **What it misses:** It is a technical standard, not a description of the *epistemic behavior* you are observing. It names the rule that is being broken, but not the phenomenon of the rule being broken *while maintaining the illusion of continuity*. It also lacks the "absorption of failure" component.

  **B. Diagnostic Creep / Conceptual Creep (Philosophy of Psychiatry/Medicine)**
  *   **What it captures:** The expansion of a category's extension over time, often lowering thresholds (e.g., DSM revisions).
  *   **What it misses:** As you noted, this is primarily normative. It focuses on the *consequences* (over-treatment, pathologizing normality) rather than the *epistemic mechanism* (the illicit transfer of inductive warrant). It describes the *movement* of the boundary, not the *persistence* of the inference.

  **C. Protective Belt Adjustment (Lakatosian Research Programmes)**
  *   **What it captures:** The structural dynamic. In Lakatos's view, a "hard core" (the disease entity exists and is predictive) is protected by a "belt" of auxiliary hypotheses (the diagnostic criteria). When predictions fail, the belt is adjusted (criteria changed) to protect the core.
  *   **What it misses:** Lakatos describes this as a legitimate heuristic for science progressing. He does not provide a specific term for when this adjustment is *epistemically illicit* because the new belt members lack the inductive history of the old ones. It captures the *structure* but not the *error*.

  **D. Projectibility (Goodman)**
  *   **What it captures:** The core epistemic problem. You are asking whether the new extension is "projectible" (supports induction) in the same way the old one was.
  *   **What it misses:** "Projectibility" is a property of a predicate, not a name for the *process* of assuming projectibility across a definition change. It describes the *hope*, not the *habit*.

  ### 3. The Mechanism: Validating Your Decomposition

  Your decomposition is correct and philosophically robust. You should separate them as follows:

  1.  **Extension Shift (The Operational Change):** This is often harmless or even necessary. Refining a measurement is standard science.
  2.  **Warrant Transfer (The Epistemic Error):** This is the core phenomenon. It is the assumption that *inductive license is a property of the label* rather than *the extension*. It treats the word "Diabetes" as a vessel that holds the evidence, rather than the evidence being tied to the specific population defined by the 140 mg/dL threshold.
  3.  **Failure Absorption (The Sociological Defense):** This is the immunization strategy. By attributing failure to "heterogeneity" rather than "boundary error," the community protects the Warrant Transfer from falsification.

  **Verdict:** The first is a measurement decision. The second and third together constitute the epistemic phenomenon. The "sin" is not changing the criterion; it is **decoupling the criterion from the inductive history**.

  ### 4. Boundary Cases: Chemistry vs. Medicine

  You asked for a principled criterion distinguishing the chemical element case from the medical case. The distinction is **Theoretical Identification vs. Operational Stipulation.**

  *   **Chemistry (Theoretical Identification):** The shift from Atomic Weight to Atomic Number was not merely a change in measurement; it was the discovery of the *mechanism* that necessitated the old correlation. Atomic Number *explained* why Atomic Weight worked (mostly). The new criterion subsumed the old warrant because it provided the *truth-maker* for the old warrant. The inductive license was preserved because the *causal structure* was revealed to be continuous.
  *   **Medicine (Operational Stipulation):** The shift from 140 to 130 mg/dL is a consensus decision based on risk curves, not the discovery of a discontinuity in nature. There is no "truth-maker" that explains why the 140 group's treatment response *must* apply to the 130–139 group. The continuity is assumed, not explained.

  **Principled Criterion:** Warrant transfer is legitimate only if the new criterion **explains the success of the old criterion** (via a bridge law or mechanistic reduction). If the new criterion merely **correlates better with an outcome** without explaining the previous boundary's validity, warrant transfer is illicit.

  ### 5. Coinage and Definition

  Since no established term exists, and you need a label for your paper to prevent circumlocution, I propose the following coinage. It is not currently in circulation as a term of art, so you are free to define it without conflicting with existing usage.

  **Term:** **Warrant Inertia**

  **Definition:**
  *Warrant Inertia* is the epistemic phenomenon wherein inductive license (predictive validity, treatment efficacy, etiological models) established for a kind under a specific operational criterion is automatically transferred to a revised extension of that kind following a change in the operational criterion, without re-derivation of the evidence.

  **Conditions for Application:**
  1.  **Criterion Revision:** The necessary and sufficient conditions for kind membership are altered (thresholds, assays, etc.).
  2.  **Extension Discontinuity:** The revision admits or excludes a non-trivial population not covered by the original evidence base.
  3.  **Warrant Preservation:** Inferences derived from the original extension are applied to the new extension with undiminished confidence.
  4.  **Immunization:** Predictive failures in the new population are attributed to kind heterogeneity rather than the criterion revision.

  **Exclusions:**
  *   **Theoretical Reduction:** Cases where the new criterion explains the causal mechanism of the old (e.g., Atomic Number), preserving warrant via explanation rather than inertia.
  *   **Diagnostic Creep:** Cases where the focus is solely on the normative harm of expansion, without analyzing the epistemic transfer of evidence.
  *   **Conceptual Change:** Historical paradigm shifts where the *meaning* of the term is acknowledged to have changed (e.g., "Mass" in Newton vs. Einstein), breaking the inductive link rather than preserving it.

  **Why this works:**
  "Inertia" captures the physical sense of an object (the warrant) continuing in its state of motion (application) despite a change in the vehicle (the criterion). It implies that the warrant *should* have stopped or been recalibrated, but didn't. It isolates the epistemic momentum from the normative harm.

  **Usage in your text:**
  *"The lowering of the hypertension threshold exemplifies **Warrant Inertia**: the treatment guidelines migrated to the new population not because efficacy was demonstrated there, but because the inductive license attached to the label 'hypertension' possessed sufficient inertia to survive the boundary shift."*
