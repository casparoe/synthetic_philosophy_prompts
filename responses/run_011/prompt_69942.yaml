answer: |-
  **The Case**

  Arthur is a piano tuner who maintains a private rule: he never tunes a concert grand to standard A440, insisting on A438 because "standard pitch kills the resonance." The difference is undetectable to audiences and gains him no professional advantage; he admits it is purely for his own "sonic conscience." A community center needs a piano tuned urgently for a gala that will secure a scholarship fund for local students. The soloist will only perform if the piano is at A440. If Arthur refuses, the soloist cancels and the fund fails. A Rossian duty of beneficence requires Arthur to tune to A440, as preventing the loss of the scholarship outweighs the frustration of a personal aesthetic preference. Arthur closes his kit. He says, "If I tune to 440, I am not a tuner, I am a mechanic."

  ***

  **The Check**

  **1. The Demanding Theory**
  **Theory:** W.D. Ross's *Prima Facie* Duties (Pluralist Deontology).
  **Requirement:** Ross posits a duty of *Beneficence* (promoting the good of others) and a duty of *Self-Improvement* (perfecting one's own nature). In cases of conflict, we must weigh the stringency. Here, the theory requires Arthur to tune to A440 because the stringency of preventing the loss of the scholarship (significant harm to specific others) objectively outweighs the stringency of maintaining a subjective, undetectable aesthetic standard (trivial cost to self). The route is via the impartial weighing of distinct duties, not aggregating utility.

  **2. The Integrity Objection**
  The objection is that the Rossian calculation alienates Arthur from the constitutive commitments that make his agency coherent. It treats his "sonic conscience" as a mere preference to be weighed against external goods, rather than as the lens through which he engages with the world. To demand he violate this rule is to demand he act against his own conception of what it *is* to tune a piano. It renders him a site of conflict resolution rather than an agent with a specific character.

  **3. Distinction from "One Thought Too Many"**
  Williams' husband case argues that morality shouldn't *mediate* special relationships (you shouldn't need a theory to save your wife). That objection targets the *motivation* (love vs. duty). In Arthur's case, the motive is already personal (fastidiousness), not moral. The objection here targets *jurisdiction*: it claims there is a sphere of personal fastidiousness where impartial morality has no authority, regardless of the motive. Williams' point is about the corruption of love; this point is about the colonization of taste.

  **4. The Heavy Lifting Feature**
  The gap between **subjective centrality** ("I am not a tuner") and **objective triviality** ("undetectable to audiences"). The case relies entirely on the agent treating a triviality as identity-constituting.

  **5. The Swap Test**
  *Swap:* Replace the A438 rule with "Arthur is the last living practitioner of a historic tuning method that preserves a specific cultural heritage."
  *Verdict:* If the project is admirable (heritage), the integrity objection becomes **stronger**; we intuitively side with Arthur against the scholarship fund. If the project is trivial (A438), the objection becomes **weaker**; we intuitively side with the fund against Arthur.
  *Implication:* This suggests the integrity objection does not rest on the *structural role* of the project (that it is a ground project) but on its *independent value*. If the force of the objection tracks the value of the project, then "integrity" is not doing the work; "value" is.

  **6. The Impartialist Attack**
  **Attack:** Arthur is dressing up a preference as a commitment. Integrity protects commitments that are rationally defensible as part of a good life. A rule that admits no external value and obstructs significant beneficence is mere obstinacy. Rossian weighing correctly identifies that a "duty" to one's own whim cannot override a duty to another's welfare.
  **Can it be tightened?** The case collapses if you tighten it. If you make the project psychologically necessary (e.g., "breaking the rule causes Arthur a breakdown"), it becomes a health claim, not integrity. If you keep it as "taste," the impartialist wins. To make the integrity objection stick, the project must be non-trivial, which violates your Constraint 2.

  **7. Constraint Compatibility Warning**
  I believe **Constraint 2 (Triviality)** and the **Integrity Objection** are in tension. Williams' concept of "ground projects" implies commitments that give life meaning. If a project is "faintly silly" to everyone but the agent, protecting it looks less like defending integrity and more like defending irrationality. If you make the project valuable enough to sustain a genuine integrity objection, you violate Constraint 2. If you keep it trivial to meet Constraint 2, the integrity objection looks like a sham, and the case fails to generate the philosophical friction you want. You may need to decide whether you want to test the *limits* of integrity (how trivial can a commitment be?) or the *power* of integrity (can it stop morality?). This case tests the limits, and the limit may be that integrity offers no protection for the trivial.
