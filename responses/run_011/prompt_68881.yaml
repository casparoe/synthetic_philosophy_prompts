answer: |-
  Keynes's *Economic Possibilities for Our Grandchildren* is often cited for its prediction that technical progress would solve the economic problem within a century, reducing labor to a fifteen-hour week. But to read Kazuo Ishiguro's *The Remains of the Day* against this essay requires separating Keynes's prediction from his normative psychology and his transitional counsel. Keynes predicts abundance; he argues normatively that the love of money as a possession will be seen as pathological, replaced by a valuation of ends—art, affection, the present moment; and he counsels transitively that for another hundred years, we must pretend mean motives are virtues to generate the capital required for escape. Ishiguro's novel is genuinely in dialogue with the normative-psychological claim and the transitional counsel, but it largely ignores the economic prediction. Stevens, the butler, does not face a shortage of work due to abundance; he faces a surplus of purposeless duty. The novel touches nothing of Keynes's macroeconomic machinery, focusing instead on the microeconomic soul of the servant who financed the accumulation.

  The scene that best exhibits the pathology Keynes describes—the confusion of means for ends—is the death of Stevens's father. During a critical international conference at Darlington Hall, Stevens's father collapses upstairs. Stevens chooses to remain below, ensuring the service is flawless, prioritizing the professional role over the human relationship. Keynes warns that treating money as a possession rather than a means to enjoyment is a semi-pathological propensity. Stevens elevates this pathology: he treats "dignity," defined as the refusal to be dislodged from one's role, as the ultimate end. When the means are withdrawn—when Lord Darlington is disgraced and the hall is sold to an American—Stevens is left with nothing. He has no capacity for enjoyment because he has spent a lifetime perfecting the capacity for service. He is the embodiment of Keynes's fear: a man who has mastered the means of living so thoroughly that he has forgotten the living itself.

  However, the novel resists a purely Keynesian reading where Stevens's ruin is merely a failure of leisure adaptation. Stevens's tragedy follows from the moral and political content of what he served, not merely the length of his working week. Keynes's essay has no vocabulary for complicity. It assumes the accumulation phase is morally neutral, a necessary drudgery to pay for the escape. Ishiguro argues otherwise. The dismissal of the two Jewish maids, carried out by Stevens without protest at Darlington's request, is not a failure of leisure; it is a failure of justice. Stevens spends the rest of his life not quite acknowledging this, subsuming it under "dignity." A Keynesian lens illuminates Stevens's inability to enjoy the present but flattens the political horror of his service. If Stevens had worked fifteen hours a week serving a benevolent master, Keynes might suggest he would have found art or affection. Ishiguro suggests that if the work itself is complicit in evil, the accumulation of "dignity" is a moral debt, not capital. The novel exposes a blind spot in Keynes: the transitional counsel to pretend mean motives are virtues risks legitimizing the very injustices that make the escape possible.

  This leads to the timing problem. Keynes imagines a century-long re-education of a whole society, assuming habits will shift as economics shift. Ishiguro gives us one man on whom that re-education arrives after the character has set. Stevens's new American employer, Mr. Farraday, expects "bantering"—a form of sociability consisting precisely in enjoying the moment for its own sake. Stevens rehearses this as though it were a duty, a puzzle to be solved rather than a joy to be inhabited. Does the novel assert that the capacity for ends must be cultivated before the margin arrives? Yes. Stevens's late, partial acquisition of bantering does not vindicate Keynes's claim that habits of purposiveness can be laid down once abundance makes them unnecessary. Instead, it suggests that the muscle for leisure atrophies if unused. Stevens treats bantering as another form of service, another way to be "great" in his role. The novel asserts that the ability to value ends above means is a skill that must be practiced during the struggle, not purchased after it. Keynes assumes the transition is structural; Ishiguro shows it is phenomenological.

  The class dimension further fractures the pairing. Keynes wrote for readers who already had an economic margin, the educated elite who would inherit the leisure dividend. Stevens's dignity is the achievement of someone for whom the economic problem was never solved; his purposive labor helped finance other people's leisure. Darlington's "great debates" on geopolitics were made possible by Stevens's invisible labor. The novel exposes a blind spot in the essay: Keynes assumes the "we" who solve the economic problem are the same "we" who enjoy the leisure. Stevens represents the class that solves the problem through labor but is excluded from the leisure. He is the mechanism of accumulation, not the beneficiary of the escape. To say the novel supplies the missing case that completes Keynes is too generous; it rather indicts the essay for assuming a universal subject where there is only a specific class. Stevens cannot enter Keynes's grandchildren's world because he built the floor they stand on, and he is not invited upstairs.

  The closing movement remains ambiguously tragic, and the verdict on Keynes depends heavily on this judgment. On the pier at Weymouth, a stranger tells Stevens that the evening of the day is its best part. Stevens resolves to practice bantering to please his employer. If this is reparative, it suggests Keynes was right: humans can adapt, finding new purposes even late in the day. But the tone is one of exhaustion. Stevens is not resolving to love; he is resolving to work harder at appearing to love. He is returning to means-valuation, merely changing the master from Darlington to Farraday. The verdict on Keynes is severe: if Stevens cannot learn to value ends even when the economic pressure is removed, then Keynes's psychological prediction is flawed. The economic problem may be solvable, but the human problem of purpose is not automatically solved with it. The tragedy is not that Stevens has no time, but that he has no self left to fill the time.

  Ultimately, the novel contributes something to the debate about the good life that argument alone cannot: the phenomenology of arriving at leisure with no ends worth having. Keynes argues from the outside in, assuming that if you remove the necessity of labor, the capacity for enjoyment will emerge. Ishiguro argues from the inside out, showing that a life organized entirely around instrumental value creates a subject incapable of non-instrumental experience. Stevens stands on the pier, the day ending, the work done, and he feels only the chill of the evening. He has the leisure Keynes promised, or something like it, but he lacks the language to inhabit it. The novel warns that the danger of work is not just that it consumes our time, but that it consumes our capacity to know what time is for. Keynes promises us a future where we are free from the necessity of being means. Ishiguro shows us a man who became a means so completely that freedom looks like emptiness. The pairing breaks down where Keynes assumes the transition is automatic; the novel insists it is a moral and psychological battle that many, like Stevens, will lose. We are left with the unsettling possibility that the economic problem can be solved while the human problem remains intact, leaving us with the remains of the day and nothing to do with them.
