          *   Draft: If we replaced the binary presupposition with degree theory, a recount would assign fractional weights to ballots based on mark clarity. A hanging chad might count as 0.6 votes. This would require a calibrated scoring rubric rather than a yes/no decision. Institutionally, this collapses into absurdity because it destroys the concept of a majority. If votes are continuous, a candidate could win with 49.9 weighted votes against 49.8, but the legitimacy of fractional democratic consent is weak. Voters expect their voice to be whole or silent. Furthermore, calibrating the degree of intent introduces more subjectivity than the binary threshold, inviting endless litigation over the scoring metric itself. The current design survives because it aligns with the discrete nature of holding office; one cannot be 0.6 President. While we are unwilling to adopt fractional voting, it is not merely unwillingness; it is a recognition that the office requires a discrete mandate. The practice values a settled answer, and a fuzzy count delays settlement. Thus, the binary threshold is not just a philosophical commitment but a structural requirement of the office being filled.

