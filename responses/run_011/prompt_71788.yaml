          *   Focus: Binary decision (count/discard), no partial weight, sampling for audit vs. full count for contest, deadline as hard stop.
          *   Draft: The core procedure treats each ballot as a binary switch: either it expresses a determinate intent for a candidate or it expresses none. Adjudicators do not measure the strength of a mark but decide whether it crosses a threshold of legibility. Crucially, the process distinguishes between *certifying* a result, where statistical sampling suffices to confirm a reported winner, and *contesting* a result, where every disputed ballot must be individually examined. Furthermore, the process is bound by a temporal horizon; a count completed after the statutory deadline is legally null, regardless of its accuracy. This creates a hierarchy where finality competes with correctness, and where the method of aggregation shifts from exhaustive enumeration to statistical estimation depending on the stakes of the inquiry.

      *   **Section 3: The implicit theory**
          *   Reconstruct the view of vagueness. Likely Epistemicism (there is a fact, we just might not know it) mixed with Pragmatic Stipulation.
          *   Need to gloss labels.
          *   Draft: The ballot-by-ballot recount presupposes a view akin to epistemicism, the theory that vague predicates have sharp boundaries even if those boundaries are unknowable. When a board examines a hanging chad, it acts as though there is a fact of the matter regarding whether that chad constitutes a vote, waiting to be discovered rather than created. The board's role is framed as tracking this pre-existing intention, implying that voter intent is a determinate property inherent in the physical mark. However, because the board must reach a unanimous or majority decision to count the ballot, the practice also smuggles in elements of supervaluationism, the theory that a statement is true only if it is true under all acceptable ways of making the vague predicate precise. The board effectively selects one such precisification for the specific context of the election. Yet, the refusal to assign partial weight suggests a rejection of degree theory, the view that truth comes in degrees rather than binary values. The system insists that a vote is either 1 or 0, denying the metaphysical possibility of a 0.5 vote. This creates a tension: the procedure acts as if it is discovering truth (epistemicism) but functions by imposing a binary classification on potentially continuous physical data (stipulation). The practice fits comfortably with the idea that human intent is discrete, but strictly presupposes only that the *count* must be discrete. It leaves open whether the vagueness lies in the world (the mark) or in our access to it, provided the output is binary.

