answer: |-
  Your diagnosis is astute, and your frustration is structurally inevitable given the terms of engagement. You are correct that the debate is not primarily about self-amendment; self-amendment is merely the stress test where two incompatible ontologies of law fracture. However, your hypothesis requires one crucial refinement: the disagreement is not simply about the "model of a legal system" in the abstract, but specifically about the **identity conditions of a legal order over time**.

  Here is the diagnosis of the structure of the disagreement, an evaluation of your hypothesis, and a proposal for what constitutes progress in your chapter.

  ### 1. The Diagnosis: Synchronic Logic vs. Diachronic Identity

  The deadlock is not verbal, nor is it merely a substantive dispute about validity criteria. It is a **category divergence regarding the temporality of normative objects**.

  *   **The Formalists** treat the legal system as a **synchronic logical object**. For them, validity is a property of a norm's relation to a higher norm at a specific logical moment ($t$). When they ask if $A$ can authorize $A'$, they are asking if the proposition "$A'$ is valid" is derivable from the set of propositions constituting System $S$ at time $t$. Because they treat the system as a logical set, a contradiction (amending the unamendable) explodes the set. To preserve consistency, they must posit a new set (a new Basic Norm). For the Formalist, the "coup vs. amendment" distinction is clear: a coup is a break in logical derivability; an amendment is a continuity of it. Their vulnerability, as you note, is that this makes ordinary legal evolution look like a series of silent revolutions, divorcing the theory from the phenomenology of legal practice.
  *   **The Institutionalists** treat the legal system as a **diachronic historical practice**. For them, validity is a property of a norm's acceptance within a continuing tradition of official behavior. They are not asking about derivability at $t$, but about **narrative continuity** from $t_1$ to $t_2$. For the Institutionalist, $A'$ is valid if the officials treat it as the successor to $A$, regardless of whether $A$ logically permitted $A'$. Their vulnerability is the "coup" objection: if validity is just successful acceptance, the distinction between a constitutional amendment and a successful usurpation collapses into a distinction between a successful usurpation and a failed one.

  The colleague who mentioned "synchronic or diachronic" was pointing at the ontological root but lacked the vocabulary to explain why it matters. The Formalist assumes a legal system is like a mathematical proof (timeless, consistent); the Institutionalist assumes it is like a language or a state (evolving, potentially inconsistent but continuous).

  ### 2. Testing Your Hypothesis

  Your hypothesis is **substantially correct**: the camps are divided over the correct model of a legal system, and neither will concede on amendment clauses because those clauses are the proxy for the model.

  However, you suggest the stalemate would dissolve *if* the model question were settled elsewhere. I would argue the stalemate *is* the model question. There is no "elsewhere" to settle it because self-amendment is the **hard case** that defines the boundary of the models. In routine legislation, both models yield the same result (the statute is valid), masking the divergence. In self-amendment of an eternity clause, the models diverge radically.

  Therefore, the self-amendment-specific content lies in the **criterion of identity**.
  *   For the Formalist, the identity of the legal order is tied to the **logical integrity of the Grundnorm**. If the rule of change violates its own logical constraints, the identity is broken.
  *   For the Institutionalist, the identity of the legal order is tied to the **sociological continuity of the Rule of Recognition**. If the officials remain the same and the practice continues, the identity is preserved.

  Article 79(3) is the perfect storm because it explicitly thematizes this identity. It says, "These principles are part of our identity." The Formalist asks, "Can the identity change itself logically?" The Institutionalist asks, "Has the community's understanding of its identity shifted?"

  ### 3. What Counts as Progress?

  Given this diagnosis, trying to prove one side right is a category error. Progress in your chapter should come from **explicating the divergence** rather than resolving it. Here are three specific avenues for progress, ranked by feasibility and philosophical payoff:

  **A. A Distinction: Intra-Systemic Validity vs. Inter-Systemic Identity (High Feasibility)**
  You can argue that both sides are using the word "valid" to cover two distinct concepts.
  *   **Formal Validity:** Is the norm derivable from the current logical structure? (Formalists are right here; self-amendment of an eternity clause is formally invalid).
  *   **Systemic Validity:** Is the norm accepted as part of the continuing legal order? (Institutionalists are right here; self-amendment is systemically valid if upheld).
  *   *Progress:* You show that Art. 79(3) creates a tension between these two. A court upholding a self-amendment is not "solving" the paradox; it is prioritizing Systemic Validity over Formal Validity to preserve the political order. This allows you to say the Formalist is right about logic, the Institutionalist is right about practice, and the "paradox" is the friction between logic and practice.

  **B. A Formal Result: Dynamic Deontic Logic (Medium Feasibility)**
  You could introduce a temporal index to the deontic operators. Standard deontic logic is static ($Op$). Dynamic deontic logic allows for operators like $[action]Op$ (after action, it is obligatory that $p$).
  *   *Progress:* You can demonstrate that a rule $A$ at $t_1$ can authorize a rule $A'$ at $t_2$ that negates $A$ at $t_2$ without contradiction, *provided* the logic accounts for the destruction of the authorizing rule in the process. This validates the Institutionalist intuition (change is possible) without conceding to the Formalist charge of contradiction (the logic handles the transition). This requires technical precision but would break the "Ross/Suber" deadlock by updating the logical tools.

  **C. A Change of Question: From Validity to Authority (High Payoff)**
  Shift the question from "Is the amendment valid?" to "What is the source of the authority to redefine the system's identity?"
  *   *Progress:* This forces the Formalist to admit that the "Basic Norm" is a fiction covering a political decision, and forces the Institutionalist to admit that "acceptance" is not enough—it must be acceptance *under a description* that claims continuity. This leads to a Schmittian or Decisionist critique: self-amendment of eternity clauses is not a legal act but a **constituent power** acting in legal form. This dissolves the paradox by reclassifying the act.

  ### 4. Can Both Camps Be Right? Is This Comfortable?

  **Can both be right in their own terms?**
  Yes. They are describing different dimensions of the same phenomenon. The Formalist describes the **internal normative claim** of the constitution (it claims to be logically binding). The Institutionalist describes the **external social reality** of the constitution (it functions as a living order).

  **Is this a comfortable place for your chapter?**
  It is comfortable **only if** your chapter's aim is meta-theoretical clarification. If your aim is to provide a doctrinal guide for judges or a definitive answer to "Can Art. 79(3) be amended?", then pluralism is a failure.

  *   **The Trap:** If you conclude "both are right," you risk writing a doxography (a summary of views) rather than a thesis.
  *   **The Solution:** You must argue that the **tension itself is the law**. The legal system *requires* both the Formalist claim (to maintain normativity and distinguish law from force) and the Institutionalist capacity (to maintain efficacy and distinguish amendment from revolution). The "paradox" is not a bug to be fixed; it is the feature that allows constitutional orders to survive radical change without collapsing into anarchy or rigidity.

  ### Recommendation for the Chapter Structure

  1.  **Reframe the Problem:** Do not present the deadlock as a failure of the literature. Present it as evidence that self-amendment sits at the boundary of law's dual nature (normative system vs. social practice).
  2.  **Deploy the Temporal Distinction:** Explicitly argue that the Formalist assumes a synchronic ontology and the Institutionalist a diachronic one. Show that Art. 79(3) is an attempt to freeze a diachronic object synchronically.
  3.  **Propose the "Dual-Validity" Account:** Argue that successful self-amendment of an eternity clause involves a **trade-off**. It sacrifices Formal Validity (logical derivability) to preserve Systemic Validity (continuity of order).
  4.  **Address the Coup Objection:** Use this trade-off to answer the Institutionalist's vulnerability. A coup fails to preserve Systemic Validity because it breaks the narrative continuity of official acceptance *under the existing description*. A self-amendment succeeds because officials accept it *as* an amendment, preserving the narrative even if the logic breaks.
  5.  **Conclusion:** The "paradox" is the mechanism by which constituent power infiltrates constituted power without destroying the facade of legality.

  This approach allows you to respect the sophistication of both camps while moving beyond their stalemate. You are not solving the paradox; you are explaining why the paradox is necessary for the survival of the constitutional order. That is a defensible, PhD-level contribution.
