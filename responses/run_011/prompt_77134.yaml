  2.  **Deconstruct the Two Camps (as described by the user):**
      *   **Formalists:**
          *   Core claim: Norm-conferring rules can only confer powers they possess. $A \to A'$ requires $A$ to authorize $A'$.
          *   Problem: If $A$ forbids amending $A$, then $A'$ is invalid *unless* a new Basic Norm ($G$) is presupposed.
          *   Vulnerability: Makes ordinary legal change paradoxical. Implies "silent revolution" for every technical amendment of an amendment clause.
          *   Concept of Validity: Logical derivability within a static normative system.
      *   **Institutionalists:**
          *   Core claim: Validity is identification/acceptance by officials.
          *   Problem: Struggles to distinguish valid amendment from successful coup (fact vs. norm).
          *   Vulnerability: Reduces authority to efficacy. "Is" becomes "Ought."
