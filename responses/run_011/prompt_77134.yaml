  4.  **Diagnose the Structure of the Disagreement:**
      *   **Is it verbal?** Partially. "Validity" means "logical consistency with the grundnorm" (Formalist) vs. "systemic acceptance" (Institutionalist). But it's deeper than semantics; it's about the *criteria* for validity.
      *   **Is it substantive but mislocated?** Yes. The core fight is Kelsen vs. Hart/Realism. Self-amendment is just the battlefield.
      *   **Are they answering different questions?** Yes. Formalists ask: "Is this move licensed by the existing normative logic?" Institutionalists ask: "Does this move maintain the continuity of the legal order as a social practice?"
      *   **Hidden Formal/Temporal Question:** This is key. The Formalists treat the system as *synchronic* (logic at time $t$). The Institutionalists treat it as *diachronic* (identity over time $t_1 \to t_2$). The "self-embracing" vs. "continuing" sovereignty distinction (Wade/Heuston) is relevant here but often unspoken in the philosophical abstraction.
      *   **Category Mistake?** Not necessarily. But treating a dynamic social practice as a static logical calculus *is* a category mistake (Institutionalist charge). Treating social practice as devoid of internal normative structure *is* a category mistake (Formalist charge).

  5.  **Determine Where the Self-Amendment Specificity Lies:**
      *   If it's just about the model of law, why does this specific issue stall? Because self-amendment involves *identity conditions*. If $A$ changes to $A'$, is it the same constitution?
