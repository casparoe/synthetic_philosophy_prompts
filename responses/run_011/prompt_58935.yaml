answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name]. I had the privilege of spending my PhD years in [Supervisor's Name]'s lab, which is a fancy way of saying I spent four years being patiently corrected by the man of the hour.

  Thirty-eight years is a long time to spend chasing a single idea. In most professions, if you do the same thing for nearly four decades, you're considered stagnant. In science, if you do the same thing for thirty-eight years, you're considered dedicated. But I know there's an elephant in this room. It's wearing a lab coat.

  Four years ago, my lab published a paper that showed the enzyme [Supervisor's Name] spent his career hunting for… likely doesn't exist. We cut the candidate out of the genome, and the cells still repaired themselves. The mechanism he proposed wasn't the one nature was using.

  I know some of you know the details. I know some of you don't. But I think we all know the feeling of finding out the map we've been using doesn't match the terrain.

  It would be easy for me to stand here and offer a soft consolation. I could say we merely "refined" the model. I could say he was "mostly" right. But [Supervisor's Name] spent a lifetime teaching us that precision matters, and I won't insult him by being vague now. The central posit isn't there. The entity is a ghost.

  But here is what is also true, and this is for the family, and specifically for you, [Daughter's Name]: **The value of a scientist's life isn't measured by which of their ideas survive them, but by how many true things were discovered by other people while they were trying to prove them.**

  His theory predicted downstream behavior correctly for nearly forty years. It guided experiments. It secured funding. It trained minds. It built a community. Even if the specific enzyme is a phantom, the path he carved through the forest is real, and we are all walking on it. He didn't just leave us answers; he left us the tools to find better ones.

  And that leads me to the rest of us. The scientists in the room.

  There is a pattern in the history of science that keeps repeating. Theories that predict beautifully, whose main entities turn out not to exist. The past is a graveyard of "truths" that worked until they didn't. Phlogiston. The ether. The very enzyme we're talking about tonight.

  I stand here tonight as the person who published the contradiction. I know that makes me the "winner" in the short-term ledger of the field. But I want to be very clear about what that means.

  **To the former students in the room who feel I was too quick to dismantle his legacy: Your defense of him is the highest compliment to my own work, because it proves he taught you to fight for what you believe is true, and I only hope that when my turn comes, my students fight just as hard for me.**

  Because my turn *will* come.

  The leveling cuts both ways. The account my lab published four years ago? It is going to be demolished. Somewhere in this room, or in a lecture hall somewhere, there is an undergraduate student currently taking notes who will find the flaw in *my* reasoning. They will publish the paper that shows my mechanism is incomplete, or wrong, or a special case of something larger.

  And that isn't a demotion for [Supervisor's Name]. It's the only thing that puts us at the same table.

  We are not monuments. We are scaffolding. We hold the structure up while the next generation builds the stone arch, and then we are taken away. If we do our jobs correctly, we are made obsolete by the people we trained.

  [Supervisor's Name], you taught me that the data is the only master we serve. You showed me that by your own reaction to my paper. You were gracious in public, and you were rigorous in private. You didn't try to hide the discrepancy. You asked me how I controlled for the variables. You acted like a scientist to the very end of your active career.

  That is the legacy that matters. Not the enzyme. Not the paper. But the integrity.

  So, I'd like to ask everyone to raise a glass.

  To [Supervisor's Name]. Thank you for the map, even where the terrain changed. Thank you for the questions, which are worth more than the answers. And thank you for showing us that being proven wrong is not a failure, provided you're the one who taught the person who proved you wrong.

  To [Supervisor's Name].
