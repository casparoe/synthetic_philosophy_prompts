prompt: |-
  I build ranking services — the sort where each candidate option gets a simulated payoff distribution and we pick whichever has the best mean. Standard Monte Carlo fare. Lately I keep hitting cases where the running average doesn't settle: I throw more and more samples at it and the estimate wanders *further* out instead of converging. Turns out that isn't a bug, it's that some of those distributions have no mean at all (Cauchy-ish tails, that kind of thing). As an engineering problem I can live with it — clip the tails, use a median, whatever.

  But it sent me down a rabbit hole and I landed on this thing in decision theory that I think is called the Pasadena game. Roughly: flip a fair coin until heads comes up. Heads on the first flip pays you +$2, heads on the second costs you $2, heads on the third pays +$8/3, heads on the fourth costs you $4, and generally the n-th flip pays (−1)^(n+1) · 2ⁿ/n dollars. Weight each payoff by its probability (2⁻ⁿ) and the expectation is 1 − 1/2 + 1/3 − 1/4 + …, which does converge — to about 0.69 — but only *conditionally*. Reorder the terms and you can make it sum to anything at all: zero, a hundred, plus or minus infinity. And there's no obviously privileged ordering of the outcomes, so the gamble looks like it has no well-defined value, even though it isn't infinite the way the old St Petersburg one is. Which is weirder, somehow.

  Before I read anything else, I want the spec. What does a theory of choice under undefined expectations actually have to *deliver* to count as adequate? Not a survey of the contenders — I want the requirements list first, the thing I can hold any proposal against afterwards.

  So: write the desiderata. For each, the concrete case or phenomenon that motivates it, and a view on whether it's genuinely non-negotiable or just a prejudice of one camp that everyone's assumed is mandatory. A few things I'd want covered but don't have the vocabulary for:

  - Does the theory have to issue a verdict on the Pasadena game itself, or is principled silence an acceptable output? (And if silence is allowed, what stops a theory from being silent everywhere and calling itself a solution?)
  - Does it have to reduce to ordinary expected value wherever expected value is actually defined — i.e. is it a conservative extension, or is it allowed to disagree with textbook EV on the boring finite cases too?
  - Does it owe me an ordering of gambles, or just pairwise verdicts? Does the ordering have to be transitive?
  - What about the truncation business: cut the game off at n flips and you get a perfectly definite answer that changes as n grows. Is "take a limit of truncations" a legitimate move, and if so what does it say about which truncation scheme counts?
  - And the practical bit I actually care about: my Monte Carlo numbers are finite samples from a distribution with no mean. Does the theory owe an account of what an estimate *is* in that setting, or is estimation a separate question that a theory of value can ignore?
  - Which of the usual escape hatches — bounded utility, finite bankroll, discounting the far-off terms, swapping the mean for some other aggregator — are principled repairs, and which are just changing the subject? I want that called out explicitly rather than left implicit.

  Most of all, flag any pair or subset of the requirements that can't be jointly satisfied. If the list turns out to be over-constrained, that's a result and I'd rather hear it now than after three weeks of reading. Also tell me which single requirement does the most work in ruling candidates out.

  Give it back as one JSON object in a code block, nothing outside it, with this schema:

  ```
  {
    "desiderata": [
      {
        "id": "D1",
        "name": "short handle for it",
        "demand": "what the theory must actually deliver",
        "motivating_case": "the concrete case/phenomenon behind the demand",
        "status": "non-negotiable | negotiable | camp-prejudice",
        "who_insists": "which sort of theorist treats this as mandatory",
        "exclusion_power": 1-5,
        "why_it_counts": "one or two sentences"
      }
    ],
    "distinctions_not_to_collapse": [ { "pair": "X vs Y", "why_it_matters": "..." } ],
    "hard_constraints": [ { "constraint": "maths or fact the theory can't contradict", "source": "maths | empirical | conceptual", "if_violated": "what breaks" } ],
    "unsatisfiable_sets": [ { "set": ["D1","D4"], "argument": "why they can't all hold", "who_bites_the_bullet": "..." } ],
    "most_exclusionary": { "id": "D?", "reason": "..." },
    "escape_hatches": [ { "move": "bounded utility etc", "verdict": "principled | ad-hoc | changes-the-question", "comment": "..." } ],
    "contender_scorecard": [ { "approach": "name", "satisfies": ["D1"], "fails": ["D3"], "one_line": "..." } ]
  }
  ```

  Keep the scorecard short — a handful of named approaches at most, and if you're not sure a label corresponds to a real position, just leave it out rather than inventing one. The weight should sit on the desiderata and their motivating cases, not the scoring.
