  **Scenario**
  A regional conservation body is deciding whether to release *Trichogramma* wasps to suppress a Codling Moth outbreak in apple orchards. The program replaces a high-density moth population with a high-density wasp population; both taxa occupy the same niche space, so total biomass remains comparable, but the intervention kills existing moth larvae to establish the wasps. A new study on butterfly neurophysiology (a sister taxon to moths) is published, providing unambiguous evidence of nociceptive integration that raises the rational credence of sentience for Lepidoptera specifically, while leaving Hymenoptera credences unchanged. Before the study, the body assumes a uniform 0.10 credence for both taxa and calculates that the welfare gain from the established wasp population outweighs the welfare loss from the reduced moth population. After the study, the moth credence jumps to 0.50 while the wasp credence stays at 0.10; because the intervention destroys many more high-value sentient moth lives than it creates in wasp lives, the expected value of the program crashes below the status quo.

  **Expected Value Table**
  *Assumptions: Value of a sentient life = +10 units. Non-sentient life = 0.*

  | Option | Population (Moth) | Population (Wasp) | Credence (Moth) | Credence (Wasp) | Expected Value |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Before Study** | | | 0.10 | 0.10 | |
  | Status Quo | 5,000 | 2,000 | 0.10 | 0.10 | $(500 \times 10) + (200 \times 10) = \mathbf{7,000}$ |
  | Intervention | 1,000 | 7,000 | 0.10 | 0.10 | $(100 \times 10) + (700 \times 10) = \mathbf{8,000}$ |
  | **After Study** | | | 0.50 | 0.10 | |
  | Status Quo | 5,000 | 2,000 | 0.50 | 0.10 | $(2,500 \times 10) + (200 \times 10) = \mathbf{27,000}$ |
  | Intervention | 1,000 | 7,000 | 0.50 | 0.10 | $(500 \times 10) + (700 \times 10) = \mathbf{12,000}$ |

  **The Feature Doing the Work**
  **Non-Uniform Credence Distribution.** The scale argument's shorthand assumes a single probability $P$ applies to the entire aggregate $N$. This case demonstrates that when evidence updates $P$ differentially across sub-populations (Moths vs. Wasps), the aggregate calculation $\sum (P_i \times N_i)$ diverges from the shorthand $P_{\text{avg}} \times N_{\text{total}}$. The flip occurs because the intervention shifts population mass from the group that received the positive sentience update (Moths) to the group that did not (Wasps).

  **The Check**
  If the study had landed directly on the pest taxon (Moths) instead of the sister taxon (Butterflies), the verdict **does not collapse** back into the standard scale-argument picture. The standard picture predicts that *any* increase in sentience evidence should strengthen the case for intervention (to reduce suffering). In this scenario, even with direct evidence, the increase in sentience evidence weakens the case for intervention (because it raises the cost of killing). The structural break—heterogeneous $P$—remains intact regardless of whether the evidence is direct or phylogenetic; the "single probability" assumption is violated in both cases.

  **The Attack & Honest Read**
  **Attack:** A proponent of the standard scale argument would argue that this scenario smuggles in a contested valence assumption: it treats wild insect lives as net-positive welfare containers. The standard scale argument rests on the empirical premise that wild insect lives are net-negative (suffering dominates). If lives are net-negative, raising the sentience credence of the pest *increases* the EV of killing them (preventing suffering), restoring the standard conclusion that better evidence strengthens the case for intervention.

  **Read:** This attack **lands** on the valence premise but misses the structural point. The scenario successfully proves that the $P \times N$ shorthand is mathematically fragile when credences are heterogeneous, regardless of valence. However, because the scale argument is specifically a *suffering*-focused argument, a scenario relying on net-positive welfare is arguably changing the subject. To fully pressure-test the suffering-based scale argument, one would need a case where differential sentience evidence makes *suffering reduction* less likely to succeed (e.g., if the intervention inadvertently creates more sentient sufferers elsewhere), which is ecologically harder to model without speculative assumptions.
