      *   **Q5: His Suffering.**
          *   Is it a reason to intervene? No. His suffering is *his*.
          *   Is it a symptom? Yes. It's the "mirror pain" she can no longer feel.
          *   *Verdict:* He is suffering the "cost" of the injury that she no longer pays. It is not grounds to override her autonomy, but it is grounds for him to seek support.

      *   **Q6: Where is he reasoning badly?**
          *   He is conflating *his* horror with *her* harm.
