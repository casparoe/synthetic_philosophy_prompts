          *   *Nuance:* She isn't irrational; she just lacks the affective tax on risk.
          *   *Verdict:* Pressing treatment is borderline coercive if she values her clarity. Removing hazards is a safety measure, not a moral judgment.

      *   **Q4: Lesion vs. Discipline Equanimity.**
          *   *Friend's claim:* Obscene but consoling.
          *   *Distinction:* Practiced equanimity is a *regulation* of the affective response while retaining the capacity for it. Lesion equanimity is the *absence* of the capacity.
          *   *Value:* One is a virtue (earned, integrated); the other is a deficit (accidental, isolated). The friend is wrong to call it "fortunate" in a holistic sense, though right that the *state* feels peaceful.
