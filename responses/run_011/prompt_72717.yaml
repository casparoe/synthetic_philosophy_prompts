  *(Self-Correction Note)*: I need to be careful not to diagnose medically, but the description is classic pain asymbolia/analgesia. I will speak to the *phenomenology* described rather than claiming a specific diagnosis.

  *(Key Philosophical Anchor)*: The distinction between *intrinsic badness* (suffering) and *instrumental badness* (damage). She has removed the former, exposing herself to the latter.

  *(Key Ethical Anchor)*: Paternalism is only justified by incapacity. Is she incapacitated? She understands the risk, she just doesn't *feel* the weight of it. This is the gray zone. I will argue for "soft paternalism" (environmental safety) over "hard paternalism" (medical coercion).

