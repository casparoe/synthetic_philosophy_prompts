  5.  **Refining the Arguments (Self-Correction during drafting):**
      *   *Correction:* I initially thought about telling him to force treatment. *Correction:* No, she is competent. The risk is physical damage, not mental incompetence. He can modify the environment (safety) but shouldn't modify her mind (coercion).
      *   *Correction on the Novel:* Don't tell him how to write it. Tell him *why* he's stuck. He's stuck because he wants a moral answer where there is only a biological fact.
