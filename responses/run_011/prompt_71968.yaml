answer: |-
  **Scenario**
  Alice owns rights to a mineral plot where extraction requires a \$50,000 Phase 2 drilling investment to yield a \$150,000 return if viable (State S), or \$0 if barren (State F). Months ago, she paid a geologist \$50,000 for a private survey (Phase 1) to determine viability, but the geologist died unexpectedly and the report was lost; Alice cannot recall the data, only that she is a disciplined agent who commissions surveys only when preliminary indicators are strong. The Phase 1 fee is unrecoverable, created no physical infrastructure, and confers no skill or reputational advantage, as her decision to drill will never be observed by others. The only remaining trace of the survey is the bank record of the expenditure itself, which stands as the sole evidence that the preliminary indicators were indeed strong enough to justify the initial spend.

  **Matched Control**
  Bob inherits the identical mineral plot rights at the start of Phase 2, with the same extraction costs and potential returns, and faces the same secrecy constraints regarding his decision. However, Bob has no history with the plot: no Phase 1 expenditure was ever made, no survey was commissioned, and there is no record of any prior agent's assessment of the land's viability. Bob's epistemic position relies entirely on the public base rate for mineral plots of this type, without any private signal or historical action to update his beliefs, leaving him with no informational trace other than the general market statistics.

  **Expected-Value Comparison**
  Let the base rate probability of viability be $P(S) = 0.2$. The net payoff for drilling is $+\$100,000$ in State S (\$150k revenue - \$50k cost) and $-\$50,000$ in State F. The break-even probability for drilling is $p > 1/3$ ($0.33$).
  *   **Bob:** With no history, his posterior is the base rate $P(S) = 0.2$. Expected Value (Drill) = $(0.2 \times 100) + (0.8 \times -50) = -20$. Bob rationally abandons the project.
  *   **Alice:** She treats her past expenditure as a signal. Assume a rational agent commissions Phase 1 with likelihood $P(\text{Spend}|S) = 0.9$ and $P(\text{Spend}|F) = 0.1$. Using Bayes' Rule, her posterior is $P(S|\text{Spend}) = \frac{0.9 \times 0.2}{(0.9 \times 0.2) + (0.1 \times 0.8)} = \frac{0.18}{0.26} \approx 0.69$. Expected Value (Drill) = $(0.69 \times 100) + (0.31 \times -50) = +53.5$. Alice rationally continues.

  **Analysis of Mechanism**
  The feature doing the work is the **correlation between past rational action and current state**. Alice is not treating the \$50,000 as a cost to be recovered; she is treating the *event* of the expenditure as a data point indicating that private evidence once existed favoring State S.

  **Ablations**
  1.  **Written Record:** If Alice could read the lost report, she would update on the *content* of the report, not the cost. The expenditure becomes evidentially redundant. This **weakens** the case for the cost's relevance (showing it is merely a proxy) but does not necessarily change the decision.
  2.  **Non-Informative Investment:** If Alice paid the \$50,000 due to a mechanical accounting error or a misapprehended deadline, the expenditure carries zero information about State S. Her posterior reverts to the base rate ($0.2$), and she must abandon the project. This **destroys** the case, as continuing becomes irrational.

  **The Friend's Reply and Implications**
  Her best reply is that you have not justified a sunk cost but rather **evidence stored in history**: the expenditure matters only insofar as it is informative, and informativeness is a payoff-relevant feature like any other, so the strict irrelevance of *costs as costs* is untouched. This reply is **substantive**, not a redescription; it implies the fallacy should be defined not as "considering past costs" but as "treating past costs as evidence *when they carry none*." The error lies in the inference, not the input.

  **Final Verdict**
  No non-evidential route to honoring sunk costs could survive her constraints, as rational choice is driven solely by expected future utility, which depends only on current beliefs and future payoffs. The evidential route is the only one left standing, proving that sunk costs are never relevant *qua* costs, but only *qua* signals.
