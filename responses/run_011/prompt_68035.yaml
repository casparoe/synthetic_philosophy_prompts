answer: |-
  You are describing the classic condition of the favored servant, and I grant you this: in terms of negative liberty—freedom as non-interference—you are quite free. Your boss does not interfere. But republicanism has always insisted that the benevolent master is still a master. The power exists in the contract regardless of his temperament. Arbitrariness, in our tradition, does not mean "capricious" in the psychological sense; it means power exercised without tracking the interests of the affected party. Your contract grants him the right to dismiss you without reference to your interests. That he chooses not to exercise it is a matter of his grace, not your right. You feel free because the chain is loose, but the chain remains.

  As to your leverage: if your security rests on your coworkers' willingness to walk out, you have not eliminated domination; you have merely complicated the dependency. You ask if a check must be individually exercisable. The answer is yes, if it is to constitute *your* freedom. If your protection relies on the nerve of others, you are vulnerable to their faltering courage or the boss's ability to divide you—offer one a bonus, threaten another. That is not a structure of liberty; it is a standoff. A truce is precisely what freedom is supposed to render unnecessary. Tell me, if your coworkers suddenly decided they couldn't afford to quit, would your boss's power over you change? If the answer is yes, then you were never non-dominated, only undisturbed.
