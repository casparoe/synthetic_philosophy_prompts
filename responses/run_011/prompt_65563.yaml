answer: |-
  **Project Title:** The Normative Structure of Compulsory Voting: Act, End, and Expression

  **Research Question**
  Does the moral permissibility and institutional design of compulsory voting depend on whether the civic duty is conceived as an obligation to perform the specific act of voting, or an obligation to secure the collective ends voting serves?

  **Project Description**
  Current debates over compulsory voting suffer from a category error. Proponents typically argue that citizens have a duty to vote and treat legal compulsion as the obvious enforcement mechanism. However, this reasoning conflates two distinct normative structures. On one view, the duty is *act-centered*: the moral obligation is to perform the specific behavior (casting a ballot). On the other, the duty is *end-centered*: the obligation is to contribute to legitimacy or good collective decisions, where voting is merely one instrument among many. This distinction is decisive for institutional design. If the duty is act-centered, substitutes like sortition chambers, voting lotteries, or fines-in-lieu-of-voting are non-starters, as they fail to discharge the specific obligation. If the duty is end-centered, compulsion is contingent; it must compete with other mechanisms on effectiveness. A third strand, expressivism, argues that voting's value relies on voluntariness. It remains unclear whether this constitutes a distinct normative category or a specific subset of end-based reasoning regarding legitimacy.

  This project seeks to disentangle these strands to determine which normative structure best fits our considered judgments about democratic duty. The hypothesis is that much of the stalemate in the literature arises because advocates assume an act-centered view while critics assume an end-centered view without arguing for the classification itself.

  **Critique of Existing Camps**
  The project will analyze three dominant positions to show where they beg the question. First, civic duty advocates argue voting is akin to jury duty. However, they rarely explain why the duty attaches to the *act* of voting rather than the *function* of judging. They assume act-centeredness without defending it against functional substitutes. Second, epistocrats argue for weighting or restricting votes based on knowledge. They operate firmly on an end-centered view (quality of decision) but often dismiss compulsory voting as counterproductive without addressing whether an act-centered duty might override epistemic concerns. Third, expressivists claim compulsory voting drains the act of its meaning. They occupy an ambiguous space: is the "meaning" an end to be achieved, or does the voluntariness constitute the act itself? By mapping these positions, I will demonstrate that each camp quietly assumes an answer to the act/end distinction rather than arguing for it, leaving the institutional question unsettled.

  **Methodology**
  This is a conceptual project employing normative analysis and case construction. The semester will be divided into three phases. Weeks 1–4 will focus on taxonomy: refining the definitions of act-centered, end-centered, and expressive duties, and cataloging where existing arguments fall. Weeks 5–9 will involve constructing test cases to stress-test the distinction. I will develop specific scenarios—for example, a system where citizens can pay a significant fee to opt-out, or a system where a randomly selected subset votes on behalf of the whole. I will then argue whether these satisfy the civic duty under each normative structure. If the act-centered view rejects these while the end-centered view accepts them, the distinction earns its keep. Weeks 10–12 will synthesize these findings into a framework for evaluating compulsory voting laws, determining which institutional designs follow from which normative premises.

  **Conceptual vs. Empirical Approach**
  A comparative empirical approach—analyzing turnout and trust data from Australia versus the United States—cannot answer this question. Empirical data reveals the *effects* of compulsion, not the *justification*. Knowing that compulsory voting increases turnout does not tell us whether a citizen who pays a fine instead of voting has failed in their duty. That is a normative question about the structure of the obligation, not a causal question about behavior. Data can tell us if compulsion produces legitimacy, but it cannot tell us if legitimacy is the only thing that matters, or if the act itself holds independent moral weight. Therefore, conceptual clarity is a prerequisite for meaningful empirical evaluation.

  **Failure Conditions**
  The project fails if the distinction proves illusory or institutionally inert. Specifically, if I find that every plausible defense of an end-centered duty ultimately collapses into an act-centered requirement (because voting is the only viable means to the end), the distinction draws no real line. Alternatively, if both normative structures recommend the exact same institutional design (e.g., both lead to compulsory voting regardless of the underlying reason), then the conceptual work does no practical heavy lifting. I will monitor this risk during the case construction phase; if the test cases do not generate divergent institutional recommendations, I will pivot to analyzing why the convergence occurs rather than forcing a distinction.

  **Scope and Limitations**
  To complete this in one semester, I must strictly limit the scope to normative theory. I will not conduct original empirical analysis of existing compulsory voting regimes, nor will I engage in a deep historical survey of how these laws were enacted. The greatest risk of ballooning lies in the expressivist strand; because "meaning" is diffuse, this could expand into a general theory of political symbolism. I will constrain this by treating expressivism solely through the lens of compulsion: does forcing the act destroy the expression? If the analysis of expressivism threatens to overshadow the act/end distinction, I will treat it as a subsidiary variable of the end-centered view rather than a third category. The deliverable will be a paper suitable for submission to a journal in political philosophy, focusing on the logical structure of the duty rather than a comprehensive policy review.
