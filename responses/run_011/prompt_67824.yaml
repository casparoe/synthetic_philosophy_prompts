answer: |-
  # The Keynesian Weight & Probability Worksheet (KWP-1)

  **Purpose:** To distinguish the *probability* of loss from the *weight* of the evidence supporting that probability, and to ensure the numeric entry on the Underwriting Committee (UWC) form reflects both.
  **Time Allowance:** 90 Minutes.
  **User:** Pricing Analyst (Actuarial or Operational).

  ---

  ## Part 1: The Procedure

  ### Step 1: Evidence Inventory (15 Minutes)
  **Question 1.1:** List every distinct source of information used to assess the risk. Categorize each as **Direct** (data from this exact exposure), **Analogous** (data from a similar exposure), or **Theoretical** (models, simulations, expert opinion without data).
  *   *Sufficient Answer:* A list of at least three sources. If fewer than three exist, proceed to Step 4 immediately (Weight is automatically Low).
  *   **[JUDGMENT CALL]:** Deciding if an analogue is "similar" enough to list. *Convention:* If the physical mechanism of loss differs (e.g., bacterial growth vs. chemical spill), it is Theoretical, not Analogous.

  **Question 1.2:** For each source, does it provide a frequency (how often) or a severity (how bad), or both?
  *   *Sufficient Answer:* Tag each source as F, S, or F+S.
  *   *Termination Check:* If no source provides Frequency (F), you cannot calculate a probability of occurrence. Mark **FLAG: NO-FREQ** and proceed to Step 4.

  ### Step 2: The Comparability & Conflict Test (30 Minutes)
  **Question 2.1:** Do any quantitative sources (simulations, historical data) differ by more than a factor of 10 (one order of magnitude)?
  *   *Sufficient Answer:* Yes/No.
  *   *Convention:* If **Yes**, the evidence is considered **Contradictory**. You must not average them. You must select the estimate that results in the higher capital requirement. **[JUDGMENT CALL]:** Determining if a difference is "material" or just noise. *Rule:* If the confidence intervals do not overlap, it is Contradictory.

  **Question 2.2:** For Analogous data, is the "distance" between the analogue and the risk measurable? (e.g., difference in tank pressure, difference in orbital altitude).
  *   *Sufficient Answer:* A metric of difference. If the difference is qualitative (e.g., "new organism"), mark **FLAG: QUALITATIVE-GAP**.
  *   *Convention:* A Qualitative-Gap reduces the Weight Score (Step 3) by 50%, regardless of the volume of data.

  ### Step 3: Weight Scoring (15 Minutes)
  Calculate the **Weight Index (W)** on a scale of 0 to 10. Start at 10 and subtract based on the following:
  *   **-2 points** for every source categorized as Theoretical.
  *   **-3 points** if Question 2.1 was "Yes" (Contradictory).
  *   **-3 points** if Question 2.2 was "Qualitative-Gap."
  *   **-2 points** if the time horizon of the data exceeds 5 years ago (obsolescence).
  *   **0 points** minimum score.

  *   **Thresholds:**
      *   **W ≥ 7:** High Weight. Proceed to Step 4A.
      *   **4 ≤ W < 7:** Medium Weight. Proceed to Step 4B.
      *   **W < 4:** Low Weight (Non-Numerable). Proceed to Step 4C.

  ### Step 4: Probability Derivation (15 Minutes)
  *This step generates the number for the UWC form.*

  **Step 4A (High Weight):** Calculate the Best Estimate Probability ($P_{BE}$) using standard methods.
  *   *Filing:* Enter $P_{BE}$. Select Confidence: **High**.

  **Step 4B (Medium Weight):** Calculate $P_{BE}$. Apply an **Uncertainty Loading** of 25% to the probability (or equivalent capital add-on).
  *   *Calculation:* $P_{Filed} = P_{BE} \times 1.25$. (Cap at 1.0).
  *   *Filing:* Enter $P_{Filed}$. Select Confidence: **Medium**.
  *   **[JUDGMENT CALL]:** Whether the loading is applied to frequency or severity. *Convention:* Apply to Frequency for Liability lines; Severity for Property lines.

  **Step 4C (Low Weight / Non-Numerable):** The evidence is insufficient to support a numerical probability. Keynes's Principle of Indifference applies.
  *   *Calculation:* Set $P_{Filed} = 0.50$. This represents maximum entropy (total ignorance). It will likely price the risk out of the market, which is the intended control.
  *   *Filing:* Enter **0.50**. Select Confidence: **Low**.
  *   *Free-Text Box:* Enter `NON_NUMERABLE_WEIGHT`. (Even if truncated, the `0.50` combined with `Low` Confidence triggers the CFO's manual review protocol).

  ### Step 5: Risk Appetite Handoff (15 Minutes)
  **Question 5.1:** Does the Gross Loss Potential (at the filed probability) exceed 10% of Free Surplus?
  *   *Sufficient Answer:* Yes/No.
  *   *Termination:* If **Yes**, the procedure terminates here. Do not submit to UWC. Escalate to Chief Risk Officer. This is a **Risk Appetite** decision, not a pricing decision.
  *   **[JUDGMENT CALL]:** Estimating Gross Loss Potential in a "first-of-a-kind" scenario. *Convention:* Use the worst-case scenario from Step 2.1, regardless of probability.

  ---

  ## Part 2: Procedure Run-Throughs

  ### File (i): Autonomous Coastal Cargo Vessel
  *   **Inputs:** Two manufacturer simulations (differ by order of magnitude), one draft safety standard.
  *   **Step 1:** Sources = 3 (2 Theoretical/Simulations, 1 Theoretical/Regulatory). **FLAG: NO-FREQ** (Simulations are not historical frequency).
  *   **Step 2:** Q2.1 = **Yes** (Order of magnitude difference). Evidence is Contradictory. Q2.2 = N/A (No analogues).
  *   **Step 3 (Weight):** Start 10. -2 (Sim 1), -2 (Sim 2), -2 (Reg), -3 (Contradictory). **Score W = 1.**
  *   **Step 4:** W < 4. **Termination: Step 4C (Non-Numerable).**
  *   **Filing:** Probability = **0.50**. Confidence = **Low**. Text = `NON_NUMERABLE_WEIGHT`.
  *   **Outcome:** The file is priced as if a loss is a coin toss. The premium required to support a 50% probability of retention breach will be astronomical. The deal will likely die.
  *   **Why:** The procedure treats contradictory models as a lack of knowledge, not a range of knowledge.

  ### File (ii): Cultivated-Protein Contamination
  *   **Inputs:** 30 years conventional food plant data (Analogous), new organism (Qualitative-Gap).
  *   **Step 1:** Sources = 1 (Analogous). **FLAG: NO-FREQ** (It is frequency data, but analogue).
  *   **Step 2:** Q2.1 = No. Q2.2 = **Yes** (Organism growth characteristics differ). **FLAG: QUALITATIVE-GAP**.
  *   **Step 3 (Weight):** Start 10. -3 (Qualitative-Gap). -2 (Data > 5 years old? Assume Yes for 30yr data). **Score W = 5.**
  *   **Step 4:** 4 ≤ W < 7. **Termination: Step 4B (Medium Weight).**
  *   **Filing:** Probability = $P_{BE} \times 1.25$. Confidence = **Medium**.
  *   **Outcome:** The deal proceeds, but with a 25% capital loading. The 30 years of data gives it weight, but the biological difference prevents it from being "High Weight."
  *   **Why:** The procedure acknowledges the data volume but penalizes the lack of direct comparability.

  ### File (iii): Satellite Servicing Collision
  *   **Inputs:** Five independent consultants, no operational data, all say "very unlikely."
  *   **Step 1:** Sources = 5 (All Theoretical/Expert Opinion).
  *   **Step 2:** Q2.1 = No (Consensus). Q2.2 = N/A.
  *   **Step 3 (Weight):** Start 10. -2 (Expert 1) ... -2 (Expert 5). **Score W = 0.** (All sources are Theoretical).
  *   **Step 4:** W < 4. **Termination: Step 4C (Non-Numerable).**
  *   **Filing:** Probability = **0.50**. Confidence = **Low**.
  *   **Outcome:** **This is the file you will not like.** Commercially, five independent experts agreeing is a "Green Light." The procedure treats five experts with *no data* the same as one expert with *no data*. The Weight of Argument is zero because there is no empirical evidence, only opinion. The filing forces a 0.50 probability, pricing the risk out of the market.
  *   **Why the procedure forces it:** Keynes argues that the *weight* of evidence does not necessarily increase with the number of opinions if the *kind* of evidence (empirical data) is absent. Consensus among the ignorant is still ignorance. The procedure prioritizes epistemic rigor over commercial consensus.

  ---

  ## Part 3: Limitations & Critique

  ### What Survives Translation
  1.  **Probability vs. Weight:** The Weight Index (Step 3) successfully decouples the *estimate* from the *reliability* of the estimate. A 0.05 probability with Weight 1 is treated differently (via loading or 0.50 override) than a 0.05 probability with Weight 9.
  2.  **Non-Comparability:** Step 2.2 (Qualitative-Gap) and Step 4C (Principle of Indifference) acknowledge that some risks cannot be numerically compared to past data without significant distortion.
  3.  **Uncertainty as Cost:** Step 4B explicitly monetizes uncertainty. Low weight increases the "price" of the probability, acting as a capital buffer.

  ### What Was Bent or Abandoned
  1.  **The Single Number:** Keynes argued some probabilities are non-numerical. The UWC form demands a number. I have bent this by using **0.50** as a proxy for "Non-Numerical." This is a lie, but a useful one. It forces the Committee to see a number that implies maximum risk, effectively acting as a "Decline" recommendation without violating the form's constraints.
  2.  **The Confidence Label:** The prompt states the Committee ignores the label. The procedure attempts to bypass this by making the *Number* carry the weight signal (via the 0.50 override or the Loading). However, this relies on the Committee understanding *why* the number is 0.50.
  3.  **Incomparability:** The procedure forces comparability via the Weight Score. Keynes might argue that a Weight of 1 and a Weight of 5 are not linearly comparable. The worksheet treats them as linear for the sake of runnability.

  ### Where the Committee Will Route Around
  1.  **The 0.50 Override:** A determined Committee Chair will see the 0.50, recognize it as a "blocker," and manually override it to 0.05 based on "market intelligence." The procedure cannot prevent a senior executive from ignoring the output; it can only make the dissent explicit in the file notes.
  2.  **The Loading:** In Step 4B, the 25% loading is hidden inside the probability number. The Committee will see "0.12" and treat it as a pure risk estimate. They will not see the "0.10 base + 0.02 uncertainty" composition unless they read the free-text box, which they skim.
  3.  **Judgment Flags:** The **[JUDGMENT CALL]** markers are warnings to the analyst, but the Committee has no visibility on them. An analyst under pressure to write business may unconsciously resolve these judgments optimistically (e.g., classifying a Qualitative-Gap as measurable).

  **Final Note:** This procedure does not solve the problem of the UWC form. It weaponizes the form against itself. It forces uncertainty to look like cost. It will reduce volume, increase average premium quality, and protect surplus on the "unknown unknowns." It will also make you unpopular with the sales team.
