prompt: |-
  I'm a third-year philosophy PhD student and this term I'm co-running an extracurricular workshop series with the CS student AI-safety group at my university. Next session is 90 minutes with about 24 people, roughly half philosophy/econ undergrads and half CS folks who've seen a payoff matrix before but nothing formal. The room has a whiteboard and a projector, I can print handouts, there's a jar of candy but no real budget and I don't want grades or money anywhere near the incentives. I want to build a game around safe Pareto improvements, and specifically the gap I don't think people feel until they run into it: the difference between "there's an outcome here that would leave both of us better off than where we'd otherwise end up" and "there's a move I can make on my own, right now, that makes me better off and cannot make you worse off no matter what you turn out to do." Everyone in that room will nod along that win-win deals exist. Almost none of them have noticed how thin the set of moves is that survives the second, much stronger test, or how much of what feels like obvious mutual benefit is secretly resting on the other side reciprocating, or on both sides being able to commit. (If that label doesn't mean much to you, go entirely by the description — that's the target.)

  So: design the activity. Some scaffolding I had in mind, change it if you have a better idea but tell me what you changed and why — random re-pairing every round so nobody can build a reputation or punish a specific person; a scoring rule where each participant's final score is their *worst* round rather than their total, announced up front so it looks like a quirk and only makes sense later; and a phase partway through where instead of picking an action they write down a little policy ("I'll do X if they did Y, otherwise Z") on a card and hand it in sealed, which is where I want conditional cooperation to surface by itself rather than from me saying the word.

  What I actually need from you: a minute-by-minute timeline; the exact rules text as participants will read it, because that's the part I always end up improvising and it shows; a payoff table with small integers plus a short argument that the baseline really is where they'd default to without the mechanism (I want to be sure the thing being improved on isn't already fine); the physical setup — what's on the cards, who collects what, how pairs submit simultaneously without seeing each other's choice; the debrief written as an ordered sequence of questions I ask rather than a speech I give, mapping specific moments from the game onto the pieces of the idea; the three or four things that will predictably go wrong the first time I run it and what I do in the moment (someone reverse-engineers the worst-round scoring and clams up, a pair starts signalling, one CS kid writes a genuinely conditional policy and the philosophy kids can't parse it, whatever else you expect); and an honest paragraph on which feature of the concept the game can't reproduce and I'll have to supply verbally. My suspicion is that it's verification — in the real delegated/program-style setups the whole point is that you can inspect or bind what the other side will do, and in my room people can simply lie about their own policy — but tell me if you think the bigger distortion is somewhere else.

  You're the expert here: think of yourself as someone who has designed and actually facilitated a hundred of these classroom games and knows exactly where they break. Think carefully, and before you commit, spend a paragraph or two brainstorming three or four structurally different ways to stage the idea — a demand/division game, an iterated trust thing with a unilateral-contribution option, a public goods setup, a "propose a joint plan or fall back to baseline" delegation game — and say which you'd pick and why. Then give me the full runnable version of that one, doable by a single facilitator with no assistant. No bibliography, no papers to assign, no reading list — I'm not putting this on a syllabus and I know the literature already.
