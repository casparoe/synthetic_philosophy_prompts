  *Assumptions to list:*
  1.  Heritability limits malleability (Change vs. Difference).
  2.  "Environment" in genetics equals "Intervention" (Teachable factors).
  3.  Population statistics apply to specific intervention outcomes (General vs. Specific).
  4.  Variance explains Mean Shift (Distribution vs. Average).

