answer: |-
  Here are the assumptions your arithmetic relies upon, followed by an examination of why each one fails.

  **The Assumptions**
  1.  **The Ceiling Assumption:** That heritability places a limit on how much a trait can be changed by the environment.
  2.  **The Definition Assumption:** That the "environmental" portion of heritability consists entirely of factors your programme can influence (like lessons).
  3.  **The Variance Assumption:** That statistics explaining *differences between children* can predict *average improvement for all children*.
  4.  **The Independence Assumption:** That genes and environment work separately, rather than together.

  **Why They Fail**
  1.  **The Ceiling Assumption is false.** Heritability describes why children *differ* from one another at a specific moment, not how much the *average* child can grow. Consider height: it is 80% heritable. Yet, over the last century, average height increased significantly due to better nutrition. The genetic differences between people remained, but the whole group grew taller. Your lessons can raise the average without changing the heritability.
  2.  **The Definition Assumption is false.** In genetics, "environment" means everything that isn't DNA. This includes prenatal health, random accidents, illness, and noise. It does not mean "teachable skills." A large chunk of that "environmental" percentage is simply luck or noise, which your lessons cannot fix. Conversely, a highly heritable trait can still be highly changeable (e.g., phenylketonuria is 100% genetic but curable by diet).
  3.  **The Variance Assumption is false.** You are trying to use a number that explains *inequality* (why Child A is better than Child B) to predict *growth* (how much better Child A gets than they were before). These are different questions. You can lift the whole group's average score significantly even if the gaps between them remain exactly the same.
  4.  **The Independence Assumption is false.** Genes and environment multiply each other. A child with a genetic predisposition for music might respond *better* to your lessons than a child without it. This means your "environmental" intervention might work *better* on the genetic half, not just the environmental half.

  ***

  ### 1. Where your reasoning fails (and what your observations mean)

  You have fallen into a very common trap, one that catches out many professional scientists. You are treating heritability as a pie chart of a single child's ability, where 50% is "genes" (fixed) and 50% is "environment" (changeable). It is not a pie chart of an individual; it is a description of a crowd.

  To use your height analogy: If you line up 1,000 adults, 80% of the *difference* in their heights is due to genes. But if you feed them all a high-protein diet for two years, they might all grow (if they are still growing) or improve their bone density. The 80% figure does not tell you how much they will grow; it only tells you that the tall ones will likely still be taller than the short ones, even after the diet.

  Your reasoning fails because you are trying to calculate a **mean shift** (average improvement) using a **variance statistic** (heritability). There is no arithmetic that connects the two. You could have a trait that is 90% heritable but 100% curable, or 10% heritable but impossible to change.

  **Regarding your two observations:**

  *   **The Musical Homes:** You worried that children from musical homes should have less "headroom" if environment is the only thing you can change. In behaviour genetics, we call this **Gene-Environment Correlation**. Parents who play music pass on two things: the genes associated with musical aptitude *and* the environment that supports it. These children do not have less headroom; rather, your lessons are likely multiplying their existing genetic advantage. Your lessons are not filling an empty bucket; they are watering a seed. The seed matters, but the water still causes the growth.
  *   **The Early Leaders Drifting Back:** This is a statistical phenomenon called **Regression to the Mean**. When you audition in September, you catch children on a "good day" or a "bad day." The children who played exceptionally well likely had a combination of skill *and* luck (confidence, no nervousness, instrument working well). By July, the luck evens out, and skill remains. It does not mean heritability is lower; it means the first measurement included temporary noise.

  ### 2. What to enter on the trust's form

  You asked if there is any figure you can honestly enter. Based on your heritability reasoning? **No.** To put a number derived from heritability studies into that box would be scientifically dishonest, because, as shown above, those numbers do not predict intervention success.

  However, you cannot leave it blank. Here is how you should approach the box:

  **Do not calculate the number using genetics.** Instead, calculate it using **your own history.**
  You have been running this for three years. You have records of where children started and where they ended.
  *   Take the average exam grade improvement of the children from the last two years.
  *   That is your evidence-based expectation.

  **What to write in the "attribution" box:**
  The form asks how much of the improvement is due to your programme versus other factors. This is technically impossible to know without a control group (children who didn't get lessons). However, you can write a narrative that is honest and robust.

  *   *Suggested wording:* "We cannot separate genetic predisposition from tuition using population statistics. However, based on three years of internal data, children receiving our lessons improve by an average of [X] grades more than the national average for self-taught learners in similar demographics. We attribute this 'value-added' difference to the programme."

  If the form demands a percentage:
  It is better to estimate based on **dosage** than genetics. A child has 168 hours in a week. You provide 1 hour of tuition, plus perhaps encouragement for 30 minutes of practice. You are providing a small fraction of their total waking life. However, for disadvantaged children, you might be the *only* structured musical input.
  *   *Honest estimate:* "We estimate 40-60% of the *measurable progress* is attributable to direct tuition and structured practice support, with the remainder attributable to home practice, natural aptitude, and school support. We base this on the observed stagnation of children who miss lessons versus the progress of those who attend."

  **The crucial point:** Do not use the 50% heritability figure to cap your claim. If your past data shows children moving up two grades, claim two grades. Heritability does not forbid this.

  ### 3. What you should actually be measuring

  The trust is asking for graded-exam results. This is a "lagging indicator"—it happens a long time after the work, and it is influenced by things you cannot control (e.g., does the parent pay for extra tutoring? does the child have a quiet room to practice?).

  If you want to know if *your* lessons are working, you need to measure things that happen *during* your intervention.

  1.  **Retention and Attendance:** The strongest predictor of musical success is simply sticking with it. Measure the percentage of children who stay from September to July. In disadvantaged areas, dropout is the main enemy. If you keep them playing, you are succeeding, even if exam grades vary.
  2.  **Standardised Performance Tasks:** Instead of waiting for external exams, create a simple 5-minute test you administer in September and July. (e.g., sight-reading a specific scale, playing a specific piece from memory). This removes the variability of external examiners and measures exactly what you taught.
  3.  **Practice Logs:** You cannot control home practice, but you can measure it. Ask children to tick a box each time they practice. Correlate this with their improvement. This helps you answer the trust's question about "other factors." If a child improves without practicing, it was aptitude. If they improve with practicing, it was your programme + effort.
  4.  **Well-being and Confidence:** For children in the least well-off parts of a borough, the primary benefit of music is often social and emotional, not just technical. Use a simple questionnaire for teachers: "Is the child more confident in class?" "Do they mix better with peers?" This captures the value of the charity that exam grades miss.

  **Summary**
  You have been trying to use a map of *differences* (heritability) to navigate a journey of *change* (education). They are different maps. Your programme can lift the average child significantly regardless of the heritability of music. Trust your own records over the textbooks, and measure the things you actually control (attendance, specific skills, retention) rather than the things you don't (exam grades, home environment).

  You are doing valuable work. Do not let a misunderstanding of a statistical concept make you undervalue it.
