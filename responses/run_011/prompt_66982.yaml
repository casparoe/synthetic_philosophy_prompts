answer: |-
  Reference-class forecasting survives contact with the Soviet collapse not as a precise predictive instrument, but as a devastating critique of why expert consensus failed, even if the method itself struggles to account for the singular agency that determined the mode of dissolution.

  Your diagnosis of the forecasters' actual reference class holds. Western Sovietologists in the mid-1980s were indeed consulting the regime's own crisis-survival record: the post-Stalin transition of 1953, the suppression of Hungary in 1956, the containment of dissent after 1962, the crushing of Prague in 1968, and the imposition of martial law in Poland in 1981. In every instance, the centre held, the ideology adapted sufficiently, and the state apparatus remained intact. This created a locally well-populated class that offered a comforting base rate of resilience. The error was mistaking this specific institutional history for the relevant outside view. By treating the USSR as a unique authoritarian entity rather than an instance of a broader category, experts allowed the availability of Soviet precedents to masquerade as statistical rigour. This implies that forecasters can easily mistake a well-populated class for the right one whenever the subject possesses a rich internal history that obscures its structural similarities to external peers.

  Constructing the proper outside view reveals that the difficulty lies almost entirely in class selection, which is itself a causal judgement the method claims to displace. If the class is 'communist regimes', the base rate is mixed (China survived, Romania fell violently); if 'great powers', it is too broad and stable. The most analytically honest class is 'multi-ethnic land empires in stagnation'. Here, the base rate changes significantly depending on whether one includes overseas maritime empires. The British and French decolonised over decades, often violently but occasionally peacefully; the Habsburg, Ottoman and Romanov empires collapsed abruptly and chaotically during or after total war. Choosing between these sub-classes is non-trivial: is the USSR defined by its ideology or its geography? There is no non-question-begging way to choose, yet the choice dictates the probability. Furthermore, with n being a handful of heterogeneous cases, reference-class forecasting degrades into dressed-up analogy. Romania must not be explained away; it fits the violent imperial dissolution base rate perfectly. The USSR's bloodlessness is the outlier, not Romania's violence, suggesting the outside view correctly predicts instability but defaults to violence as the mechanism of release.

  The outside view gets the direction right but remains silent on the sequence, speed and texture of the event. A stagnant multi-ethnic empire that renounces coercion loses its periphery; the base rate supports this directional certainty once the monopoly on force is relinquished in 1989. However, the theory cannot reach the near absence of bloodshed in the Soviet core, since the base rate for imperial dissolution is predominantly violent (Yugoslavia shortly after, Romania concurrently). Regarding the March 1991 referendum, the outside view treats this as inside-view noise to be discounted. A proper base rate would argue that votive intent matters less than structural integrity; when empires fracture, referenda typically legitimise the breakup rather than prevent it. Finally, the theory has no slot for individual agency. The collapse turned on Gorbachev's specific refusal to shoot—a variable the outside view averages out. Reference-class forecasting assumes agents behave typically within the class; it cannot accommodate a leader who deviates from the historical norm of imperial defenders using force to maintain unity.

  The verdict is that 1985–91 is a confirmation of the outside view's corrective power, but an anomaly for its predictive precision. It was never built to handle singular transitions driven by unique moral choices within a structural decay. A well-calibrated analyst in 1985, ignoring the Soviet survival record and focusing on the imperial base rate, should have said aloud: 'There is a 20 to 30 per cent probability of systemic dissolution within ten years if the centre attempts reform without coercion.' This range is high compared to contemporary expert opinion but justified by the fragility of land empires. Evidence to revise this probability upward would not have been economic data, but behavioural signals: specifically, the refusal to intervene militarily in Poland in 1989. That event should have shifted the probability of dissolution to above 80 per cent, regardless of the March 1991 referendum results, because it confirmed the regime had moved from the 'authoritarian survival' class to the 'decolonising empire' class.
