  2.  **Deconstruct Adam Smith's *The Theory of Moral Sentiments* (TMS) for this Context:**

      *   *Sympathy:* Not pity, but "fellow-feeling." The ability to imagine oneself in another's situation.
      *   *Impartial Spectator:* The idealized observer within us. Not the actual committee members, but the standard they strive for. Detached, informed, reasonable.
      *   *Propriety:* The suitability of the *emotion/sentiment* to the cause. (Is this anger appropriate to this slight?)
      *   *Merit/Demerit:* The worthiness of the *action* that caused the emotion. (Did the supervisor deserve blame?)
      *   *Concord:* Sympathy happens when the spectator's emotion matches the agent's. Agent lowers pitch; spectator raises pitch.
      *   *Self-Command:* Controlling emotions to allow sympathy.
      *   *Custom/Fashion:* Local norms that distort moral judgment.

  3.  **Address Requirement 1: The Steps (90-minute constraint):**

