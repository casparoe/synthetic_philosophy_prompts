answer: |-
  **Chapter Proposal: The Paradox of Infallible Promising**

  **Overview**
  This chapter investigates a tension at the heart of the philosophy of commitment: the relationship between the binding force of a promise and the promisor's retained power to break it. Standard intuitions suggest that a promise is only as good as the promisor's word, yet the value of a promise often lies in its reliability. Contemporary technology and institutional design increasingly allow agents to engineer arrangements where breach is physically or procedurally impossible. This chapter asks whether removing the possibility of breach preserves the promise or destroys it, replacing a moral obligation with a causal mechanism. Through an analysis of escrowed smart contracts, psychiatric advance directives, and automated deterrent postures, I argue that while engineered infallibility secures the *outcome* of performance, it dissolves the *relation* of promising.

  **1. The Question: Conceptual, Normative, or Evidential?**
  To yield a determinate answer, the central inquiry must be disaggregated into three distinct versions.
  *   **The Conceptual Version:** Does an arrangement cease to fall under the concept of "promising" once the power to breach is removed? This is a taxonomic question about the necessary conditions of the practice.
  *   **The Normative Version:** Does the arrangement remain a promise, but with altered binding force (e.g., weakened because it lacks voluntary endorsement, or strengthened because it guarantees reliance)?
  *   **The Evidential Version:** Is the obligation untouched, with the device merely serving as superior evidence of the promisor's intent, removing epistemic uncertainty without changing the normative landscape?

  This chapter will prioritize the **Conceptual Version**. The reason is foundational: if the arrangement is no longer a promise in kind, the normative question shifts from "How strongly does this promise bind?" to "What kind of obligation does this mechanism generate?" Treating the question as merely normative or evidential assumes the category of "promise" remains stable despite the removal of agency, which begs the question against the view that agency is constitutive of promising. By settling the conceptual status first, we determine whether we are analyzing a moral bond between persons or a causal constraint upon a person. What turns on this choice is the locus of accountability. If it remains a promise, the promisor is the source of the obligation; if it becomes a mechanism, the system is the source, and the promisor is merely a component. The chapter argues that engineered impossibility triggers a category shift from the former to the latter.

  **2. Standard Accounts and the Asymmetry of Agency**
  The proposed question is not settled by standard families of account regarding promissory obligation; rather, it exposes a fault line between them.
  *   **Assurance/Will-Based Accounts:** These views ground obligation in the exercise of autonomy and the communication of intent. They suggest that for a promise to exist, the promisor must retain the freedom to do otherwise. If breach is impossible, the "will" is no longer operative in the moment of performance, suggesting the promise evaporates into mere prediction or causation.
  *   **Practice/Convention-Based Accounts:** These views locate obligation in social rules. If the convention of promising allows for "locked" commitments, then the promise stands. This account is largely indifferent to the physical possibility of breach, focusing instead on whether the community recognizes the device as a valid move in the language game of commitment.
  *   **Expectation/Reliance-Based Accounts:** These views ground obligation in the harm caused by disappointed expectations. From this perspective, removing the option to breach strengthens the promise by maximizing reliability and securing reliance.

  Is this asymmetry a distraction? No, it is the substantive content of the problem. The divergence reveals that the question is not merely about "promising" but about which theoretical framework correctly captures the phenomenon. If the chapter adopts the Conceptual Version, it must adjudicate between these accounts. The argument will be that the asymmetry is not a theoretical stalemate but a diagnostic tool: the fact that reliance-based accounts welcome engineered impossibility while will-based accounts reject it indicates that engineered arrangements satisfy the conditions of *reliance* but fail the conditions of *agency*. The chapter will argue that promising is essentially an exercise of agency, not merely a generator of expectations. Therefore, the tension is not a distraction but the key to distinguishing promises from reliable processes.

  **3. Approach vs. Game-Theoretic Precommitment**
  The obvious alternative approach is to treat all three settings as instances of strategic precommitment, analyzable through game theory. In this framework, a "credible commitment" is one where the payoff structure is altered to make deviation irrational or impossible. The source of the constraint—whether internal will or external mechanism—is irrelevant; only the credibility of the threat or promise matters.

  This chapter will explicitly reject the sufficiency of the game-theoretic analysis. While game theory accurately describes the *strategic* utility of these devices, it cannot register the *moral phenomenology* of the interaction. Game theory treats the promisor as a black box of preferences; it cannot distinguish between "I will do X" and "The system will force X to happen." What is lost in the game-theoretic view is the second-personal address inherent in promising. When I promise you, I invite you to hold *me* accountable. When I engineer a mechanism, I invite you to hold the *system* accountable. The conceptual work left for the chapter is to articulate what is lost when the second-personal bond is replaced by a third-personal process. Specifically, the chapter will explore whether the value of promising lies in the risk it undertakes. By removing the risk of breach, the promisor also removes the gift of trust. The promisee receives certainty, but they no longer receive the promisor's fidelity. The chapter will defend the view that fidelity requires the possibility of infidelity.

  **4. Interaction with the Legal View of Breach**
  The legal doctrine of efficient breach holds that a contracting party is at liberty to breach provided they compensate the injured party for their losses. This view suggests that the law protects the expectation interest, not the specific performance of the will. Does this concede that bindingness does not require the impossibility of breach? Or does it show that contract is distinct from promise?

  The chapter will argue for the latter. The legal permission to breach (with damages) demonstrates that contractual duty is a liability rule, not a moral obligation of fidelity. Engineered performance devices (like smart contracts) attempt to bridge this gap by forcing specific performance, effectively making breach impossible. However, in doing so, they align the arrangement more closely with property law (control over a resource) than contract law (obligation between persons). The interaction here clarifies the chapter's thesis: the legal view already concedes that contract does not require the impossibility of breach, but rather manages the risk of breach. By engineering out the risk entirely, these devices do not create "super-promises"; they exit the realm of obligation altogether and enter the realm of causation. The legal view thus supports the distinction: if the law allows breach because the duty is to *pay*, not to *perform*, then a device that forces *performance* is not creating a stronger duty, but a different kind of constraint altogether.

  **5. Success Conditions**
  A successful result will not necessarily be a single uniform verdict across all three settings. In fact, a uniform verdict (e.g., "none of these are promises") might indicate the question was too blunt. Success looks like a principled differentiation based on the locus of control.
  *   **Success:** The chapter successfully distinguishes between external enforcement (smart contracts, deterrents) and internal/self-enforcement (psychiatric directives). It may conclude that external automation destroys the promise, while self-binding via advance directive preserves it because the agency remains internal to the person, albeit temporally extended.
  *   **Failure:** A failure would be a monolithic conclusion that treats all three cases identically without addressing the difference between code-enforcement and self-enforcement. Another failure mode would be collapsing the distinction between "reliable performance" and "moral obligation," concluding that because the outcome is secured, the promise is successful. This would confirm the suspicion that the analysis has drifted into game theory rather than philosophy of commitment.
  *   **Verdict:** If a uniform verdict is reached, it must be robustly defended against the intuitive differences between the cases. However, a differentiated verdict is preferable as it demonstrates the nuance of the "Possibility of Breach" condition.

  **6. Scope and Case Selection**
  At 4,000 words, covering three complex case studies alongside the theoretical framework is precarious. To ensure depth over breadth, the chapter should cut the **Deterrent Posture** setting.
  *   **Rationale:** The deterrent case (e.g., automated nuclear retaliation) introduces collective agency and state-level ethics, which complicates the interpersonal focus of promising. It risks shifting the discussion toward political philosophy and the ethics of war, diluting the core argument about individual commitment.
  *   **Retention:** The **Smart Contract** and **Psychiatric Advance Directive** cases should be retained. These two offer the sharpest contrast for the argument. The smart contract represents *external* technological enforcement (the code binds the human), while the psychiatric directive represents *internal* temporal enforcement (the past self binds the future self).
  *   **Loss:** Cutting the deterrent case loses the dimension of "threat" versus "promise" and the collective aspect of commitment. However, this loss is acceptable because the core philosophical question concerns the nature of the obligor's agency. The smart contract and psychiatric directive isolate this variable more cleanly: one removes agency via external architecture, the other tests the limits of agency across time. Focusing on these two allows the chapter to thoroughly develop the distinction between mechanism and fidelity without the distraction of geopolitical stakes.

  **Conclusion**
  This chapter proposes that the possibility of breach is not a bug of promising but a feature. By examining settings where breach is engineered away, we can see that what is gained in reliability is lost in relational normativity. The chapter will argue that without the power to break one's word, one does not have a stronger promise; one has no promise at all, but merely a predictable process.
