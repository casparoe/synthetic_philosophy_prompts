answer: |-
  **Case A**
  **Macro-outcome:** The region is absorbed by the Southern Kingdom.

  In 1547, a swollen river delays a courier three days. The local Duke misses the rendezvous for the harvest levy. He attacks alone and dies. His brother succeeds, vendettaing the neighbors. Skirmishes flare in different valleys; Captain Jean falls instead of Pierre. Villages burn in '49 rather than '50. Over thirty years, every local lineage shifts; heirs die in altered ambushes, widows remarry different rivals. The map of local holdings is unrecognizable. Yet the region's grain flows south, its roads lead to the capital, and its merchants speak the southern tongue. When the peace comes, the Southern Kingdom claims the duchy. The structural gravity of trade and supply lines overrides the chaos of battle. The flag changes, but the master remains the same.

  **Case B**
  **Macro-outcome:** The region is absorbed by the Northern Empire.

  In 1547, a swollen river delays a courier three days. The delay misses a ratification deadline at the Imperial Diet. The legal claim lapses. Yet the strategic situation holds: the passes must be held, the harvest must be taxed. The campaigns proceed in the same seasons, over the same ground. The same captains die in the same ambushes; the same famines strike the same villages. Local nobles marry the same allies to secure the same borders. The war looks identical to the eye. But when the treaty is signed, the lapsed clause voids the Southern King's title. The law defaults to the Northern Empire. The battles were noise; the paperwork was the signal. The region flies a different flag, though the blood spilled was the same.

  ***

  **Analytic Section**

  1.  **Structural Features:** In Case A, the robustness stems from **convergent structural pressure** (economic and geographic gravity); in dynamical terms, this is a **basin of attraction** where trajectories diverge locally but terminate in the same state. In Case B, the fragility stems from a **critical procedural threshold** (a legal deadline); in dynamical terms, this is a **bifurcation point** or separatrix where a minute displacement determines which stable equilibrium the system occupies.

  2.  **Function and Removal:** In Case A, the economic gravity pulls all trajectories toward the Southern Kingdom. If you remove this feature (e.g., a new trade route opens north), the macro-outcome becomes contingent on the micro-events. In Case B, the deadline acts as a switch. If you move the initiating event earlier (courier arrives on time), the claim holds and the outcome flips to the Southern Kingdom; if moved later, the outcome remains Imperial. The macro-outcome is insensitive to the *content* of the wars, but hypersensitive to the *timing* of the paperwork.

  3.  **Attractor vs. Redundancy:** Robustness in Case A is better described as an **attractor**. Redundancy (mutually replaceable causes) and attractors are genuinely different mechanisms that can come apart. Redundancy implies multiple sufficient causal chains for a single event (e.g., five assassins ensure the king dies). An attractor implies the system state returns to a path regardless of perturbation (e.g., the economy recovers regardless of who is minister). You can have redundancy without an attractor (the king dies, but the succession chaos varies), and an attractor without redundancy (a single strong force dictates the outcome).

  4.  **Historical Interpretation:** A structuralist historian sees Case A as vindication: underlying material conditions (trade, geography) determine the outcome despite surface noise. She can accept Case A without explaining Case B away by categorizing B as an exception governed by formal superstructure (law) rather than material base. A contingency-minded historian sees Case B as vindication: small accidents rewrite the map. She reads Case A as evidence of strong structural constraints that occasionally, but not always, dominate. The structuralist is not committed to denying Case B, only to arguing that Case A is the typical mode of historical causation.

  5.  **Evidence of Boundaries:** To determine if a real situation sits near a boundary rather than deep inside a basin, look for **bimodal distributions of outcomes** in similar contexts. If comparable regions with similar material conditions frequently end up in different political states despite similar wars, the system is likely near a separatrix. Additionally, evidence of **hysteresis**—where the outcome depends on the history of perturbations rather than just current conditions—suggests the system is balanced between competing attractors.
