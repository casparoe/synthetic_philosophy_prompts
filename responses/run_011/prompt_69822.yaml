prompt: |-
  I'm applying for a ten-week summer scholarship from my department and it pays for one thing only, an 8,000 word paper, so the proposal has to be tight. My half-formed idea, which I keep circling back to: pretty much everyone accepts that hindsight bias is a problem for historical explanation, and the standard fix is to work counterfactually — reconstruct what the people at the time could reasonably have expected, and judge the explanation against that. But the counterfactual reconstruction is itself a narrative, and it's one you build backwards from the very outcome you're supposed to be bracketing. So the remedy may just be the disease moved up a level, and I don't think anyone has said clearly what would tell a counterfactual that genuinely corrects for hindsight apart from one that is hindsight in fancy dress.

  Turn that into the proposal. I need: the question stated precisely enough that it could have a determinate answer (not "is history objective"); why the existing positions on both sides leave it open rather than settling it; the method — what I'd actually do, week by week, including which concrete historical episodes I'd work on and why those ones; and a defence of that approach against the two obvious alternatives, which are just importing the experimental hindsight-bias results wholesale, or doing pure armchair analysis of what a narrative is. Then say what a successful result would look like, what would count as the project failing, and give me an honest read on whether ten weeks and 8,000 words is realistic for it.

  No bibliography or literature list, I'll add the references myself, but do name the positions and arguments you're relying on. Start straight in with the proposal itself — no preamble, no commentary, and don't repeat my question back at me.
