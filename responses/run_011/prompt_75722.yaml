answer: |-
  **Project Title:** From Populations to Probabilities: Transferring Aggregation Solutions to Decision-Theoretic Fanaticism

  **Project Summary**
  Rational agents face a dilemma known as expected-value fanaticism: should they accept a act with a minuscule probability of an astronomical payoff, or reject it in favor of a certain modest good? Standard decision theory suggests accepting the gamble, but this verdict conflicts with deep intuitions about rationality and resource allocation. Current literature attempts to resolve this by tweaking decision-theoretic axioms, such as imposing bounded utility functions or restricting independence. I propose that this debate is structurally isomorphic to aggregation problems in population ethics, where summing welfare across lives leads to similarly counterintuitive conclusions (e.g., the Repugnant Conclusion). In population ethics, solutions often involve refusing to let tiny per-person contributions accumulate without limit (e.g., critical-level views). This project tests whether that specific toolkit transfers to decision theory. I will investigate whether decision-theoretic analogues of critical-level or number-dampening views can escape mugging-style counterexamples while preserving the capacity to prioritize astronomical stakes—a core motivation for the debate—without merely reproducing familiar impossibility results in new notation.

  **Research Question**
  Can aggregation-restricting tools from population ethics be successfully translated into decision theory to resolve fanaticism without triggering analogous impossibility results or sacrificing sensitivity to astronomical stakes?

  **The Gap in Existing Literature**
  The literature on fanaticism and the literature on population ethics operate in silos. Decision theorists focus on probability weighting, utility bounds, and axioms like continuity. Population ethicists focus on value aggregation across persons and generations. Both fields face the same structural problem: unbounded summation yields repugnant verdicts. Existing positions leave open whether the structural similarity is superficial or deep. If deep, solutions from population ethics should inform decision theory. If superficial, attempts to transfer them will fail. Currently, no systematic mapping exists to determine if the "critical-level" solution to the Repugnant Conclusion solves Pascal's Mugging without importing new paradoxes.

  **Methodology**
  I will employ formal modeling to construct decision-theoretic analogues of population-ethical views. Specifically, I will define decision rules where the value of an outcome is not merely the sum of probability-weighted utilities, but is dampened based on the "number" of probability-weighted units or subject to a critical threshold of expected value before counting. I will test these models against standard counterexamples (Pascal's Mugging, Pascal's Wager, Sadistic Conclusions).

  I defend this method against the obvious alternative: simply axiomatizing the tails away by bounding utility functions. Bounding utility solves fanaticism but renders agents indifferent to astronomical stakes above the bound, undermining the normative force required for longtermist concerns. The aggregation-toolkit approach aims to retain sensitivity to large stakes while blocking the accumulation of tiny probabilities. By formally mapping the population-ethics tools into decision theory, I can determine if the structural isomorphism holds or if the domains diverge in ways that make transfer impossible.

  **Expected Outcomes**
  A positive result would be a formal decision rule that avoids fanaticism (rejects the mugging) while remaining sensitive to astronomical stakes (accepts non-tiny probabilities of huge goods) without violating basic rationality axioms. A negative result would take one of two forms. First, an impossibility theorem showing that any view avoiding fanaticism via these tools must also ignore astronomical stakes. Second, a diagnostic failure where the transfer turns out to be purely notational: the decision-theoretic "critical level" proves to be mathematically equivalent to a bounded utility function, offering no conceptual advantage. Identifying this equivalence is itself a valuable result, clarifying the limits of cross-domain solutions.

  **Work Plan (12 Months)**
  *   **Months 1–2:** Comprehensive review of fanaticism and population ethics literature to map structural analogies. *Deliverable:* Annotated bibliography and conceptual map.
  *   **Months 3–5:** Formalization of decision-theoretic analogues for critical-level and number-dampening views. *Deliverable:* Draft formal models.
  *   **Months 6–8:** Stress testing models against counterexamples and checking for impossibility results. *Deliverable:* Technical appendix with proofs and counter-models.
  *   **Months 9–10:** Drafting the primary research paper articulating the results. *Deliverable:* Complete manuscript draft.
  *   **Months 11–12:** Revision, peer feedback integration, and submission preparation. *Deliverable:* Final fellowship report and submitted paper.

  **Scope Risk**
  The single biggest risk is that proving the impossibility results (or proving their absence) requires mathematical complexity exceeding the scope of a philosophical fellowship. If the formal proofs require advanced measure theory beyond my current toolkit, the project may stall in the formalization phase. I will mitigate this by collaborating with a formal epistemologist during Months 3–5, but if the proofs prove intractable, the project may shift from a constructive solution to a meta-ethical analysis of why the transfer fails.

