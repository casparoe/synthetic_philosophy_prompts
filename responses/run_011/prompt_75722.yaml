prompt: |-
  I'm applying for a one-year fellowship in normative theory and need a two-page research proposal. My half-formed idea: the dispute over expected-value fanaticism — whether a rational agent should take an act with a minuscule chance of an astronomical payoff — has been fought almost entirely over decision-theoretic axioms (continuity, independence, bounded utility, whether vanishingly small probabilities can be rationally assigned at all), and both sides assume the problem lives in the tail of the probability distribution. But structurally the paradox looks like a species of the aggregation problems from population ethics: in both, unbounded summation across possible additions yields verdicts nearly everyone finds repugnant, and in both the standard repairs work by refusing to let a large enough stock of tiny per-item contributions accumulate without limit. I want to test whether that toolkit transfers. Does a decision-theoretic analogue of a critical-level or number-dampening view escape the mugging-style counterexamples while preserving the astronomical-stakes conclusions that motivate the whole debate — or does it merely reproduce familiar impossibility results in new notation?

  Write the proposal so that a committee of philosophers who don't work in this area can see that the question is both precise and open: state it exactly, say what the existing answers leave unaddressed, give the method and defend it against the obvious alternative of simply axiomatizing the tails away, and specify what a positive result and what a failure would look like, including the failure mode where the transfer turns out to be purely notational. Include a realistic month-by-month plan for twelve months and an honest note on what would make the project too ambitious for the time available. No bibliography or citations — I'll supply those myself. Please write in American English.

  After the proposal, append a JSON object with exactly these fields:

  - `question`: one sentence stating the research question as the proposal frames it
  - `gap`: two or three sentences on why existing positions leave it open
  - `method`: the approach, plus the reason for preferring it to the alternative
  - `positive_result`: what success would look like, concretely
  - `failure_modes`: array of strings, each naming a way the project could fail and the diagnostic sign that it has
  - `months`: array of objects with keys `period` (e.g. "1-2"), `task`, and `deliverable`
  - `scope_risk`: the single biggest reason this might exceed twelve months of work
