  Good evening. The doors are locked. The public arrives tomorrow. Today belongs to us. To the people who paid for the walls. To the people who paint them. To the people who sweep the floors. And to the people who watch the doors. I see my staff. I see the board. I see the councillors who wish we were less difficult. I see the professor by the coat check. He is waiting for me to make a mistake. I usually do.

  We are apt to call barbarous whatever departs widely from our own taste and apprehension: But soon find the epithet of reproach retorted on us.

  That was written two hundred and fifty years ago. It still holds. Look at the walls. The brothers Hesketh bought Dutch skies and Italian saints. They bought them with cotton. They bought them to show they were not cotton men. Now we have hung them beside work made in this city last year. Work made by people who know what cotton costs. It looks strange. It looks wrong. Some of you feel the clash in your teeth. This is not an accident. It is the point.

  Sentiment varies. We know this. One person sees a masterpiece. Another sees a lie. We cannot help seeking a rule by which those sentiments may be reconciled. We want a standard. We want to know who is right. There is a story about a hogshead of wine. Two kinsmen taste it. One says it tastes of iron. The other says it tastes of leather. The company laughs. They say the wine is fine. They say the kinsmen are pretentious. They say the taste is in the mind, not the cask. Then the cask is emptied. A key lies on a leather thong at the bottom. The kinsmen were right. The company was wrong.

  I told this story when I was twenty-nine. I published an essay. I said that much of what was celebrated was simply bad work. I said that saying so was not an exercise of power but a description. I used the wine story to prove that the delicate judge is right and the room is wrong. I was very pleased with myself. I thought delicacy was a victory. I thought it granted authority. I thought it meant you could drink the wine and know it was pure.

  But consider the wine again. The key was in it. The leather was in it. The wine was spoiled. The kinsmen had the delicacy to find the fault. But that delicacy cost them the drink. They could not drink the wine. The company could. The company drank blindly and were happy. The judges saw clearly and were dry. This is the standard. It is not a reward. It is a burden. To judge is to lose the ability to enjoy the flawed thing. We have hung the old masters next to the new work. The light is the same. The wall is the same. The money is not. You can taste the difference. You should taste the difference. To pretend otherwise would be a kindness. I am not here to be kind.

  There is someone in this room who knows about keys. In March, this atrium was closed. There was noise. There was arrest. There was a statement made about ownership. About who this building belongs to. You stood where you are standing now. You wore a coat. You refused to take it off. You detected the leather. You detected the iron. You were not laughing. You were not drunk on the vintage. I am not asking you to forgive the building. I am not asking you to drink the wine. I am acknowledging that the key was found. It was found by you. It remains in the cask. We are opening the doors anyway.

  This is the work of the museum. To hold the thing that is spoiled. To show the key alongside the glass. To refuse the comfort of the blind draft. The standard does not move. It does not soften. It requires us to see the fault and hang the picture regardless. It requires us to pay for the sight. We have paid. The staff has paid. The city has paid. You will pay tomorrow when you walk in and see what we have done. You will feel the taste of iron. You will feel the taste of leather. You will not be able to ignore it. That is the only value we offer. It is not happiness. It is not agreement. It is the recognition that something is broken and we display it still. We do this because there is no other way to hold the thing. We do this because the alternative is to pretend the key is not there. We keep the standard. We keep the cost. We keep the beauty.
