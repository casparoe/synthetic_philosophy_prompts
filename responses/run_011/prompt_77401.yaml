  2.  **Evaluate Existing Terms (and why they might fail):**
      *   *Social Desirability Bias (SDB):* Usually implies conscious or unconscious distortion to look good. The user argues this isn't "faking." It's a difference in *perception* and *articulation* rooted in practice, not just wanting to look good. SDB is too blunt; it treats the error as noise, whereas this is a systematic, trained skill.
      *   *Common Method Variance (CMV):* This is about variance attributable to the measurement method rather than the constructs. While related, CMV is usually a statistical nuisance (e.g., same scale format). This is a substantive cognitive difference between groups regarding *how* they process the question.
      *   *Demand Characteristics:* This implies participants guess the hypothesis and change behavior. The user says they aren't lying or playing along; they are genuinely experiencing their memory differently.
