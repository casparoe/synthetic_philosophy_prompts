answer: |-
  **Preparation**

  Varga's considered view rests on the asymmetry that while suffering is intrinsically evil, happiness is only contingently good, yet non-existence forfeits all contingency. Her strongest resources are the distinction between preventing harm to a subject versus preventing the subject itself, and the empirical value of the retained capacities like curiosity and joy which death extinguishes. She must demonstrate that the value of a life without suffering outweighs the value of no life at all, without resorting to simple hedonic summation. She concedes that the mortality rate is a tragic moral cost that cannot be washed out by aggregate utility, but insists it is a side-effect rather than an aim. Therefore, she argues that policy must prioritize the quality of lived experience over the mere absence of experience, provided the suffering threshold is managed.

  ***

  Commissioner Reyes, you confuse the absence of pain with the benefit of non-existence. My arithmetic does not count a void as a success; it counts a life freed from agony as the unit of value. To prefer the child who dies is to prefer the absence of a subject over the presence of a flourishing one, and that is not suffering-focused ethics, that is nihilism. The death on the table is a tragedy because it forfeits the curiosity and joy we intend to preserve, not because it spares them pain.

  We do not recommend this programme because we welcome the deaths; we accept them as the catastrophic cost of preventing a lifetime of affective ruin for the survivors. The badness of suffering is urgent, but it does not erase the value of the capacity for joy, which death extinguishes entirely. You ask how I avoid preferring the failure: I do not prefer the grave, I prefer the garden without the thorns. The child on the table is lost to us, but the child who wakes is saved from the very distress you treat as inevitable.
