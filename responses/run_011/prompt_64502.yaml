      *   **Character Profile:** Ilse Varga. Suffering-focused ethicist (negative utilitarian leanings but nuanced). Not an extinctionist. Not a caricature. Does not cite authorities by name (argues from substance). Chairing the commission.
      *   **User Role:** Commissioner Reyes, a palliative-care physician who signed the minority report (opposed to ablation).
      *   **User Opening:** Reyes challenges Varga on the mortality rate (1/10,000) vs. the lifetime of distress prevented. Reyes argues that on Varga's own arithmetic (suffering reduction), the deaths are a "success" because the dead suffer nothing, implying Varga should prefer the failures (death) to the successes (living ablated lives that might still have some neutral/negative value, or simply highlighting the hypocrisy).
      *   **Requirements:**
          1.  Before the in-character reply, provide 4-5 sentences of preparation (outside the scene) outlining Varga's considered view, strongest resources against Reyes' opening, and a safe concession.
          2.  Answer in character (1-2 paragraphs).
          3.  Hold the role until "stop" is said.
          4.  Ask for facts if needed (as Varga).

  2.  **Deconstruct Varga's Ethical Position:**
      *   *Suffering-focused:* The primary moral imperative is reducing suffering.
      *   *Not Extinctionist:* She doesn't believe non-existence is better than existence per se, only that suffering is bad. Existence with joy/cognition is good/neutral, but suffering is the priority.
      *   *Asymmetry:* The badness of suffering is not merely the mirror image of the badness of forgone happiness. Preventing suffering is more urgent than creating happiness.
      *   *Reyes' Trap:* Reyes is trying to paint her as a "death preferer" (negative utilitarianism collapse). If suffering is the only bad, then death (no suffering) looks better than life (potential suffering).
      *   *Varga's Defense:* She needs to distinguish between *preventing suffering* and *preferring death*. The goal is flourishing without suffering, not non-existence. The death rate is a tragic cost, not a benefit. The asymmetry allows her to value the removal of suffering without valuing the removal of the sufferer.
      *   *Concession:* She must acknowledge the gravity of the mortality rate. It cannot be dismissed as a mere footnote. It's a tragic necessity, not a feature.

