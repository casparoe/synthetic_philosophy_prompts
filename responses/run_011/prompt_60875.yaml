answer: |-
  The Bureau of Standardized Glyphs occupied the fourth floor of a building that smelled primarily of ozone and old carpet. Elias Thorne sat at Desk 4, the Senior Certifier for Infrastructure Typography. His job was to ensure that the letters painted on road signs and printed in first-grade primers were unambiguous. After the Fire, when the master punches and the vector archives burned together, the state had needed a new standard. Elias was the gatekeeper.

  On his desk lay the packet from Vane Type Foundry. It was thick, wrapped in brown paper. Inside was a single sheet of heavy stock, grid-lined, containing twenty-six characters. Elias had spent three weeks on the packet. He had stamped twenty-five of them with the green ink of approval. The 'b' was sturdy. The 's' had the correct spinal curvature. The 't' crossed at the appropriate height.

  Only the 'a' remained pending.

  It was currently on its sixth cycle.

  Elias picked up the latest iteration. It was a photocopy of a fax of a scan of the original drawing. The paper was warm from the machine. He laid it next to the file copy of Submission One.

  The first 'a' had been a double-story form. The upper loop was a closed tear-drop, pinched at the apex. The lower bowl was full, but the aperture—the gap where the curve meets the vertical stem—was broken open at the eight o'clock position. The vertical stem terminated flat on the baseline, no spur, no foot. It was a clean, structural thing. Elias had rejected it because the aperture break was too wide. On a highway sign at sixty miles per hour, that gap might look like a fracture in the metal, not a letterform. He had sent it back to Intake.

  Intake scanned it. The scanner glass had a speck of dust on the lower left. The scan went to the Review Committee. They marked it up in red pen. The marked paper was fed into the fax machine to be sent back to Vane, but Vane had requested digital resubmission, so the fax was scanned again into the server, printed out by Elias's local printer, and placed on his desk as Submission Two.

  The second 'a' was darker. The toner had bloomed. The break at the eight o'clock position had filled in with gray noise. Now the bowl was closed. But the vertical stem, originally straight, now leaned five degrees to the left. Elias rejected it. A leaning stem suggested instability. It looked like it was falling over.

  Submission Three arrived via a different clerk. The file had been compressed to save server space. The curves were jagged now, stair-stepped pixels masquerading as vectors. The upper loop had merged with the stem. It was no longer a double-story 'a'. It was a single-story form, a circle with a tail. Elias rejected it. The primer standards required a double-story 'a' for legibility in early education.

  Submission Four was traced by hand. The Bureau had a rule that if a digital file degraded beyond 300 DPI, a draftsman had to redraw it for the archive. A junior draftsman named Miller had redrawn the 'a'. Miller's hand was steady, but he was tired. He had thickened the stroke weight to match the 'b' and the 'd', which had also thickened during transmission. The counter—the white space inside the bowl—was now too small. It looked like a black donut with a leg. Elias rejected it. The negative space was as important as the ink.

  Submission Five came back from Vane with a note attached: *We are sending the original file again.* But the Bureau's intake procedure required all external media to be run through the virus scrubber, which involved printing to paper and re-scanning. The scanner bed was warped. The image was stretched horizontally. The 'a' was now wide. It looked like an 'o' that had been sat on. Elias rejected it. Aspect ratio is non-negotiable.

  Now, Submission Six.

  Elias held the paper up to the fluorescent light. The grain of the paper was visible, a rough texture that caught the toner in uneven patches. He looked at the glyph.

  It was a circle, slightly flattened at the top and bottom. To the right of the circle, separated by a white gap of exactly half a point, was a vertical line. The line did not touch the circle. It stood parallel to it, like a cane leaning against a wall. There was no connection between the bowl and the stem. There was no closure. It was two distinct objects sitting next to each other.

  Elias put the paper down. He rubbed his temples.

  According to the manual, an 'a' requires a closed counter. It requires a connection between the spine and the bowl. It requires a specific relationship to the baseline. This form had none of those things. It was a circle and a stick.

  And yet, sitting next to the 'b' and the 'c' on the sheet, it functioned. Your eye skipped over the gap and bridged it. You read 'cat'. You did not read 'c [circle] [line] t'.

  Henderson from the Committee knocked on the doorframe. Henderson was a man who believed in rules the way some people believe in gravity. He didn't need to see the thing to know it was wrong; he needed to know the rule it broke.

  "Still stuck on the vowel?" Henderson asked.

  "It's disconnected," Elias said. "The stem doesn't touch the bowl."

  "Then it's not an 'a'."

  "It's the sixth copy of the same drawing."

  "Then the drawing was wrong the first time."

  "The first one was a standard double-story. The machine broke it."

  Henderson stepped into the room and looked at the paper. He didn't look at the shape. He looked at the edges of the paper. "This stock is different."

  "It's the ream from the lower cabinet."

  "It's humid down there. The paper expands. That's why the aspect ratio is off on the fifth one, and this one looks stretched. It's not the design, Elias. It's the weather."

  Elias looked at the 'a'. Sarah from Intake had mentioned the humidity yesterday, complaining about her curls. She hadn't been talking about typography. She was right, though. The shape wasn't changing because the designer was indecisive. It was changing because the medium was unstable. The 'a' was not a fixed object. It was a signal passing through noise.

  "If I approve this," Elias said, "we are certifying a circle and a line."

  "You're certifying the intent," Henderson said. "The shape is just the vehicle."

  "The shape is the sign. Drivers don't read intent. They read ink."

  Henderson shrugged. "Then reject it. Vane will send a seventh. It'll be more stretched. The toner will run more. The paper will swell. Eventually, it'll be a gray smear. Will you certify the smear?"

  "Stop."

  "I'm just saying. You're looking for a ghost. The punch is gone. The file is corrupted. You want the thing that exists before it hits the paper. That thing doesn't exist anymore."

  Henderson left. Elias looked at the glyph again.

  There were two ways to do this job. One way was to say: The 'a' is a slot. It is a position in a sequence. If we put a mark there and agree it is an 'a', then it is an 'a'. The shape is irrelevant so long as the system holds. If the road sign says 'EXIT', and the third mark is this circle-and-line, the driver knows it means 'a'. The system confers the identity.

  The other way was to say: The 'a' has a spine. There is a structural core. A closed counter. A connection to the baseline. Without these, it is not an 'a', it is a mistake. If you allow the circle-and-line, you allow the 'o' with a stick. You allow the 'd' without an ascender. You allow chaos. If the structure fails, the meaning fails. A stop sign that looks like a yield sign is not a stop sign, no matter what the decree says.

  Elias looked at the stack of rejected forms. One through Six. They were all different. None of them were identical to the original drawing Vane had sent. The original was gone, buried in a server stack somewhere, or perhaps lost in the fax drum's memory. All he had were these echoes.

  If he rejected this sixth form, Vane would have to draw it again. It would be scanned again. It would be faxed again. It would become the seventh form, which would be worse. The degradation was inevitable. The Bureau's own process was destroying the letter.

  To demand a perfect 'a' was to demand a process that did not exist. The machinery of the state was lossy. The transmission was noisy.

  If he approved it, he was admitting that the Standard was not a single shape. It was a cloud. A weighted average of acceptable variations. He would be signing off on the idea that an 'a' could be a circle and a line, provided the context held.

  But if he approved it, he opened the door. What stopped a designer from submitting a square for an 'o'? What stopped a road sign from using a triangle for an 'a'? If the structural core was negotiable, then legibility was negotiable. And if legibility was negotiable, people might die. A driver hesitating at a sign because the 'E' looked like an 'F' could cause a pile-up on the interstate.

  The cost of certainty was stagnation. The cost of flexibility was risk.

  Elias picked up the green stamp. It felt heavy in his hand. The ink pad was dry; he had to press it onto the sponge twice to load it.

  He looked at the 'a'. The circle was slightly oval. The line was slightly curved. It looked like a thing trying to be a letter. It looked like a letter trying to be a thing.

  He thought about the humidity. He thought about the fax drum. He thought about the driver in the rain, squinting at a green sign through a wet windshield. Would that driver see an 'a'?

  Probably. Because the driver wasn't looking for a geometric proof. The driver was looking for a shape that fit the slot.

  Elias pulled the certification form toward him. Form 12-B. *Approval of Glyph Standard.*

  There was a box for *Notes on Variance*. Usually, he left it blank. A standard was a standard. It didn't vary.

  He took a pen. He wrote: *Acceptable variance includes discontinuous stem-bowl junctions resulting from transmission loss. Structural integrity determined by contextual placement, not isolated form.*

  It was a loophole. It was a waiver. It meant that if a sign failed, he couldn't blame the manufacturer. He had approved the ambiguity. The liability was now his. He was trading his security for the alphabet's survival. If the letters didn't get certified, the new signs couldn't be printed. The old signs were fading. The state needed the new forms.

  He hovered the stamp over the box labeled *Status*.

  Henderson was right about the slot. The system needed the mark to function.
  But the designer was right about the shape. The mark needed to hold together to be read.
  This form held together only because the eye wanted it to.

  Elias pressed the stamp down.

  *THUMP.*

  The green ink bloomed into the paper fibers. *APPROVED.*

  He didn't feel relief. He felt a cold tightening in his stomach. He had just declared that an 'a' could be two pieces. He had broken the core to save the system.

  He placed the sheet in the out-tray. He picked up the next packet. It was from a different foundry. They were submitting a new 'g'.

  Elias looked at the 'g'. It was a loop with a tail. Or maybe it was a 'q' turned upside down. He looked at the transmission log. It had been faxed three times.

  He reached for the red stamp. *PENDING.*

  He would make them send it again. He needed to see how much it could break before it stopped being a 'g'. He needed to know where the edge of the cloud was. He had signed away the center; now he had to map the boundaries.

  He picked up the phone to call Intake. "Sarah? It's Elias. Check the humidity in the lower cabinet. And get me the maintenance log for the Fax Machine B. I want to know when the drum was last cleaned."

  "Why?" Sarah asked.

  "Because I need to know how much of this is design, and how much is rust."

  He hung up. He looked at the approved 'a'. It sat on the page, green and official. It was not the 'a' Vane had drawn. It was the 'a' the Bureau had made. It was a collaborative object, built by designers, clerks, machines, weather, and ink.

  It was ugly. It was unstable. It was alive.

  Elias picked up his pen and began to write the report on the 'g'. He did not write about essence. He wrote about stroke weight. He wrote about counter-form. He wrote about the distance between the curve and the baseline. He described the object so precisely that anyone could draw it, and yet he knew that when they drew it, it would be different.

  He worked until the light faded. The stack of papers grew. Somewhere in the building, a fax machine screamed as it chewed a sheet of paper, grinding the gears, spitting out a new version of the truth, slightly darker, slightly blurred, ready to be judged. Elias waited for it. He had the green stamp in his hand. He was ready to decide what was real.
