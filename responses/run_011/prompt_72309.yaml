  # Church and State Self-Diagnostic Instrument

  **Instructions:** Begin at Question 1. Read the fact pattern and select the option that best matches your intuition about what the law *ought* to be. Follow the direction at the end of your chosen option to find your next question or your final result.

  ### Question 1
  **Country:** The Republic of Oria.
  **Fact Pattern:** Oria's tax code allows citizens to direct 1% of their income tax to a religious body of their choice. The state collects this money and transfers it to the body. A citizen, Mr. Hale, wishes to stop this deduction but remains a member of his faith community. The religious body claims that if members can easily leave the tax scheme, the body cannot claim to represent the community in public negotiations.
  **Options:**
  A. The state should not collect these funds at all; religious support must be purely private. (Go to Question 2)
  B. The state may collect the funds, but Mr. Hale must be able to opt out easily without losing his standing in the faith. (Go to Question 5)
  C. The state should collect the funds, and the religious body's public standing depends on this formal membership roll; opt-out should be difficult or impossible while registered. (Go to Question 5)

  *Distinction tracked: Whether state funding of religious bodies is permitted and whether exit rights undermine collective standing (Lines 2 & 3).*

  ---

  ### Question 2
  **Country:** The Kingdom of Valis.
  **Fact Pattern:** The national flag and state seal of Valis contain a specific religious symbol historically associated with the majority faith. The constitution grants no legal privileges to this faith, but the symbol appears on all government buildings and passports.
  **Options:**
  A. These symbols must be removed; the state's visual identity must be free of religious references. (Go to Question 3)
  B. These symbols may remain provided they are treated as historical heritage rather than active religious endorsement. (Go to Question 7)

  *Distinction tracked: Whether the state may identify itself with one religion symbolically while conferring no legal advantage (Line 1).*

  ---

  ### Question 3
  **Country:** The State of Noven.
  **Fact Pattern:** Noven employs public school teachers. A new regulation bans all visible religious insignia (headscarves, crosses, turbans) for public employees while on duty. Private citizens face no such restriction.
  **Options:**
  A. The ban is permissible; the state must project a religiously neutral image through its agents. (Go to Question 4)
  B. The ban is impermissible; employees retain their private religious rights while serving the state. (Go to Question 9)

  *Distinction tracked: Whether the state may restrict religious dress for its employees while leaving private citizens unrestricted (Line 4).*

  ---

  ### Question 4
  **Country:** The Province of Solis.
  **Fact Pattern:** A religious organization in Solis refuses to hire a qualified applicant as a worship leader because the applicant does not share the organization's faith. A general employment law forbids discrimination on religious grounds.
  **Options:**
  A. The organization must comply with the general law; employment rules bind all employers equally. (Result: The Wall)
  B. The organization is exempt; religious groups must have autonomy to select their own leaders. (Result: The Shield)

  *Distinction tracked: Whether a generally applicable anti-discrimination rule binds a religious body in selecting worship leaders (Line 6).*

  ---

  ### Question 5
  **Country:** The Dominion of Regis.
  **Fact Pattern:** The state provides the collection service described in Question 1. In exchange, the state claims the right to approve the appointment of senior clergy to ensure they are fit for public partnership.
  **Options:**
  A. The state may approve appointments; public support justifies public oversight of leadership. (Result: The Governor)
  B. The state may not approve appointments; financial administration does not grant authority over doctrine or personnel. (Result: The Partner)

  *Distinction tracked: Whether religious organizations are bearers of rights against the state or partners subject to state governance (Line 5 & 6).*

  ---

  ### Question 6
  **Country:** The Commonwealth of Fundia.
  **Fact Pattern:** Fundia offers grants to all private schools that meet educational standards. Religious schools apply. Some citizens argue that funding religious schools violates state neutrality.
  **Options:**
  A. Funding is forbidden; state money must never support religious instruction. (Go to Question 9)
  B. Funding is permitted; fairness requires religious schools receive the same support as secular ones. (Go to Question 8)

  *Distinction tracked: Whether state funding of religious bodies is forbidden by neutrality or required by fairness (Line 2).*

  ---

  ### Question 7
  **Country:** The Union of Neutralis.
  **Fact Pattern:** The government passes a law restricting noise near hospitals. A religious group challenges it, saying the law was motivated by animus against their bells, even though the effect is neutral.
  **Options:**
  A. The law stands; only the practical effect on different faiths matters, not the officials' reasons. (Result: The Ignorer)
  B. The law falls; officials must act only for secular reasons, regardless of the neutral effect. (Result: The Herald)

  *Distinction tracked: Whether state neutrality is a constraint on reasons, effects, or identity (Line 7).*

  ---

  ### Question 8
  **Country:** The Republic of Historia.
  **Fact Pattern:** A dominant faith in Historia previously persecuted minority sects with state approval. The state now considers reparations.
  **Options:**
  A. The state owes obligations to the victimized faiths to restore their standing. (Result: The Rectifier)
  B. The state owes no specific obligations to rival faiths; it should simply ensure no religion is favored going forward. (Result: The Market)

  *Distinction tracked: Whether historic wrongs generate present obligations to victims or rival faiths (Line 8).*

  ---

  ### Question 9
  **Country:** The Federation of Libris.
  **Fact Pattern:** Libris receives an application for legal recognition from a new religious movement. The state currently recognizes no faiths officially.
  **Options:**
  A. The state should grant recognition to facilitate the group's legal operations. (Result: The Market)
  B. The state should grant no recognition; religions should compete as private clubs without state status. (Result: The Wall)

  *Distinction tracked: Whether the state should leave religions to compete unassisted or facilitate them via recognition (Line 2 & 7).*

  ---

  # Leaf Definitions

  **1. The Wall (Strict Separationist)**
  *   **Core Claim:** The state must maintain a complete barrier between public authority and religious practice, forbidding both aid and symbols.
  *   **Awkward Commitment:** This position may require the state to deny accommodations that minority faiths need to participate equally in public life.
  *   **Approximate Jurisdiction:** United States (historical ideal).

  **2. The Herald (Ceremonialist)**
  *   **Core Claim:** The state may identify with a majority faith symbolically and ceremonially provided it confers no legal privilege.
  *   **Awkward Commitment:** It must convince outsiders that historical symbols do not constitute a second-class citizenship for non-members.
  *   **Approximate Jurisdiction:** United Kingdom.

  **3. The Partner (Corporatist)**
  *   **Core Claim:** The state ought to treat recognized religious bodies as public-law partners and support them institutionally.
  *   **Awkward Commitment:** It requires the state to define which groups are "recognized" enough to deserve partnership.
  *   **Approximate Jurisdiction:** Germany.

  **4. The Ignorer (Privatizer)**
  *   **Core Claim:** Religion is an exclusively private matter about which the state should decline to take any notice whatsoever.
  *   **Awkward Commitment:** It requires the state to ignore the social reality of religious communities when designing public policy.
  *   **Approximate Jurisdiction:** None.

  **5. The Shield (Pluralist)**
  *   **Core Claim:** Religious liberty is primarily the liberty of organized communities against the state, including a liberty to be internally illiberal.
  *   **Awkward Commitment:** It protects the right of religious groups to discriminate against their own members or employees.
  *   **Approximate Jurisdiction:** Canada (multiculturalism aspects).

  **6. The Governor (Erastian)**
  *   **Core Claim:** The state may govern the church in matters of doctrine and discipline as a branch of public administration.
  *   **Awkward Commitment:** It empowers civil officials to make judgments on theological fitness or ecclesiastical law.
  *   **Approximate Jurisdiction:** Denmark (Folkekirke).

  **7. The Market (Libertarian)**
  *   **Core Claim:** The state should neither fund nor recognize any faith and should leave all religions to compete for adherents unassisted.
  *   **Awkward Commitment:** It favors well-organized and wealthy religious groups over smaller or poorer ones.
  *   **Approximate Jurisdiction:** None.

  **8. The Rectifier (Remedialist)**
  *   **Core Claim:** Historic wrongs committed by a dominant faith generate present obligations for the state to restore victimized groups.
  *   **Awkward Commitment:** It requires the state to permanently categorize citizens by religious lineage to administer justice.
  *   **Approximate Jurisdiction:** None.

  *Note on Stability:* **The Ignorer** and **The Market** are potentially unstable hybrids; The Ignorer requires state action to ignore (e.g., banning census categories), which contradicts pure indifference, while The Market requires a legal framework for competition that resembles recognition.

  ---

  # Instrument Analysis

  ### Unoccupied Combinations
  1.  **State funds religious bodies but bans all religious symbols.**
      *   *Status:* **Politically Unattractive.** This combination (Partner funding + Wall symbols) is rarely defended because funding implies a partnership that usually tolerates symbolic acknowledgment; funding without recognition is administratively incoherent.
  2.  **State controls doctrine but allows easy exit from tax contributions.**
      *   *Status:* **Incoherent.** If the state controls doctrine (Erastian), it treats the body as public administration; allowing easy exit undermines the compulsory nature of public law partnerships.
  3.  **State bans employee dress but exempts religious hiring discrimination.**
      *   *Status:* **Undeveloped.** This view (strict public neutrality + strong private group autonomy) is logically possible but rarely articulated as a unified theory, as both positions usually stem from opposing views on the public/private divide.

  ### Indistinguishable Leaves
  **The Wall (Strict Separationist)** and **The Market (Libertarian)** produce identical answers on funding and symbols (both reject them). They differ only on *state posture*: The Wall views state contact as contamination, while The Market views it as unnecessary interference.
  *   **Further Question:** "If a religious group requests a zoning exemption to build a temple, should the state grant it as a matter of right (Market) or deny it to maintain uniform land use (Wall)?"
  *   **Worth Spending a Question?** No. For the purpose of a 15-minute workshop diagnostic, the practical outcome (no state aid/symbols) is more relevant than the philosophical rationale for that outcome.

  ### Real Jurisdiction Approximations
  1.  **The Wall:** United States (First Amendment jurisprudence).
  2.  **The Herald:** United Kingdom (Established Church).
  3.  **The Partner:** Germany (Kirchensteuer).
  4.  **The Ignorer:** None (France approaches this but retains *laïcité* regulations).
  5.  **The Shield:** Canada (Charter Section 2(a) interpretation).
  6.  **The Governor:** Denmark (State Church administration).
  7.  **The Market:** None (Pure libertarianism is theoretical).
  8.  **The Rectifier:** None (Specific reparations are case-specific, not systemic).
