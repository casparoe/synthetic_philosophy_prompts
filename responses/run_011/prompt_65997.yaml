answer: |-
  You and your friend were likely shouting past each other because you were operating with different time horizons and different definitions of "underdetermination." Your friend is focusing on the *synchronic* snapshot of 1930, while you are focusing on the *diachronic* resolution of 1956. Philosophically, this is the difference between asking "Was there underdetermination then?" (Yes, practically) and "Does this episode validate underdetermination as a skeptical thesis?" (No, it undermines it).

  Here is the breakdown to settle the argument.

  ### 1. The Nature of Equivalence in 1930
  For the underdetermination thesis (UDT) to hold in its "purest form" (as your friend claims), the competing hypotheses usually need to be **empirically equivalent**—meaning they entail the same observational consequences not just given current technology, but in principle.

  *   **Logical Equivalence:** Clearly absent. "A particle exists" and "A law fails" are logically distinct claims.
  *   **Empirical Equivalence:** In 1930, this was *practically* true but *principally* false. Pauli explicitly proposed the neutrino as a detectable entity, however difficult. Bethe and Peierls (1934) later quantified the cross-section, showing detection was physically possible, just engineering-hard. Bohr's hypothesis, conversely, implied specific statistical deviations in other quantum processes.
  *   **The "Same Evidence" Claim:** Your friend claims the evidence was identical. It wasn't. You correctly noted the earlier refutation of statistical conservation. Bohr had already proposed a statistical version of energy conservation in the BKS theory (1924), which was experimentally refuted by Geiger and Bothe (1925) following Compton scattering. By 1930, physicists weren't choosing between two fresh ideas; they were choosing between a new particle and a variation of a hypothesis that had *already failed* in a parallel domain. This background evidence broke the symmetry. There was a rational way to pick: conservation laws had more inductive support than Bohr's statistical exception.

  **Point for you:** The equivalence was not "pure." It was constrained by auxiliary knowledge that favored Pauli.

  ### 2. 1956: Laudan/Leplin vs. Stanford
  This is where your Laudan and Leplin line shines. They argue that empirical equivalence is transient because theories evolve and auxiliary assumptions change.

  *   **The Victory Lap:** The 1956 Cowan-Reines experiment didn't just "find" a particle; it utilized Fermi's 1934 theory of beta decay, which didn't exist in 1930. The theoretical framework evolved, creating new observational consequences (inverse beta decay) that broke the empirical equivalence. This is the textbook definition of Laudan and Leplin's argument: underdetermination is a temporary state, not a permanent structural feature of science.
  *   **Stanford's New Induction:** Kyle Stanford argues that we should be skeptical because there are always *unconceived* alternatives that turn out to be true. Does this episode feed that? Actually, no. In 1930, the "true" alternative (the neutrino) *was* conceived (by Pauli). Stanford's argument relies on the *absence* of the true theory from the menu of options. Here, the true theory was on the menu, argued for, and eventually confirmed. While the *properties* of the neutrino (parity violation, mass) were unconceived in 1930, the ontological commitment (the particle itself) was not. This episode is actually a counter-example to the pessimistic meta-induction Stanford relies on.

  **Point for you:** The resolution demonstrates that the "tie" was breakable, undercutting the skeptical force of UDT.

  ### 3. Where the Thesis is Silent
  The underdetermination thesis is a claim about *justification*, not *discovery* or *psychology*. It says evidence alone doesn't force a choice. It is silent on why scientists *actually* choose.

  *   **Heuristics and Virtues:** In 1930, most physicists leaned toward Pauli not just because of evidence, but because of theoretical virtues: conservatism (saving conservation laws) and coherence (fitting with Noether's theorem implications, even if QM was murky).
  *   **The "Desperate Remedy":** Pauli called his idea a "desperate remedy." Bohr's idea was a "fundamental revision." UDT cannot explain why the community viewed the former as less costly than the latter. That is a sociological and heuristic fact about theory choice, not a logical fact about evidence. The thesis is silent on why Pauli's option felt "live" and Bohr's felt "dead" beyond the raw data.

  ### Summary
  Your friend is right that a snapshot of 1930 shows a moment of uncertainty, but wrong to call it "pure" underdetermination because background evidence (the failure of BKS) and principled detectability broke the symmetry. You are right that the episode supports the Laudan/Leplin view: equivalence was temporary, broken by theoretical and technological innovation. The episode is historically cited by realists to show that underdetermination is not a barrier to truth.

  Verdict: undercuts
