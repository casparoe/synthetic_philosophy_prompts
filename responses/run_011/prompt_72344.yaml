answer: |-
  # The Standards Procedure: A Decision Protocol for Curatorial Drafts

  ## I. Philosophical Premise
  This procedure does not eliminate bias. It assumes you cannot step outside your own standards. Its goal is not neutrality, but **accountability**. It manages the tension between historical fidelity and ethical responsibility by forcing you to identify *where* your judgment enters the text.

  **Failure Mode:** The procedure fails silently when you use "context" to dilute harm or "accuracy" to shield discomfort. If you find yourself using the steps to justify a pre-determined outcome, stop and escalate.

  ## II. The Decision Steps (90-Minute Budget)

  ### Step 1: The Interest Check (10 Minutes)
  **Question:** Why are we telling this story *now*?
  *   **Sufficient Answer:** "This event shaped the physical landscape we inhabit," or "This community has requested representation," or "This anniversary offers a hook for a neglected truth."
  *   **Insufficient Answer:** "It is important history," or "It fits the timeline."
  *   **Action:** If the answer is insufficient, mark the draft: *Importing Present Interest.* You must acknowledge in the intro that this selection reflects current values.
  *   **Distinction:** **Keep** the distinction between importing *interests* (why we look) and importing *appraisal* (how we judge). You *must* import present interests; that is the job of a museum. Do not drop this. You *must* minimize importing present vocabulary into past explanations.

  ### Step 2: The Vocabulary Audit (20 Minutes)
  **Question:** Does the text use terms the actors would not recognize to explain their own motives? (e.g., "systemic racism," "patriarchy," "witchcraft as metaphor").
  *   **Sufficient Answer:** Yes, but the text attributes the term to the present analysis (e.g., "Modern historians classify this as...").
  *   **Insufficient Answer:** The term is used as if it were a natural fact of the period (e.g., "The patriarchal structure of the family caused...").
  *   **Action:** If insufficient, apply disposition: **Attribute the Framing.**
  *   **Distinction:** **Keep** the distinction between *Vocabulary* (words) and *Appraisal* (judgment). You can use modern words if you own them.

  ### Step 3: The Contemporary Appraisal Test (30 Minutes)
  **Question:** Was the moral judgment on offer available to the actors at the time?
  *   **Method:** Curator spends 30 minutes searching for contemporary dissent. Look for: Minority reports, dissenting sermons, legal objections, diaries, opposing newspapers.
  *   **Sufficient Answer:** "Yes, Group X publicly condemned this practice in Year Y," or "No, this concept did not exist in their legal/religious framework."
  *   **Insufficient Answer:** "I assume they knew better," or "I cannot find evidence either way."
  *   **Action:**
      *   If **Yes** (Judgment was available): You may state the harm plainly without qualifying it as "presentism."
      *   If **No** (Judgment was unavailable): You must **Attribute the Framing** (e.g., "By modern standards, this constitutes...").
      *   If **Insufficient** (Time/Expertise lacked): Default to **Attribute the Framing.** Do not guess.
  *   **Distinction:** **Keep** the distinction between *Anachronism* (claiming they thought X) and *Evaluation* (saying X was wrong). You can evaluate without anachronism if you own the evaluation.

  ### Step 4: The Institutional Complicity Check (15 Minutes)
  **Question:** Is this institution (building, endowment, name) a beneficiary of the conduct described?
  *   **Sufficient Answer:** "No," or "Yes, and the text explicitly acknowledges the link."
  *   **Insufficient Answer:** "Yes, but we provide context in a sidebar," or "Yes, but that was the board's decision."
  *   **Action:** If **Yes**, "Context" is insufficient. You must **State Plainly** on the primary interpretive surface (wall, label, intro). This cannot be relegated to a footnote.
  *   **Constraint:** This step cannot require new research. It relies on known institutional history.

  ### Step 5: The Sanitization vs. Indictment Balance (15 Minutes)
  **Question:** Does the current draft explain the *cause* of harm without acknowledging the *experience* of harm?
  *   **Sufficient Answer:** "The text explains the economic pressure *and* names the human cost."
  *   **Insufficient Answer:** "The text explains the economic pressure, implying the cost was necessary," or "The text names the cost but offers no explanation for why it happened."
  *   **Action:** If insufficient, **Restructure the Panel.** Causal explanation cannot replace moral acknowledgement.

  ## III. Allowed Dispositions
  At the end of Step 5, you must select one of the following. Do not invent new categories.

  1.  **Leave as Drafted:** No triggers fired.
  2.  **State Plainly:** Factual claims of harm or benefit must be asserted directly, without hedging verbs ("alleged," "reportedly").
  3.  **Attribute the Framing:** Add "In the view of..." or "Modern analysis suggests..." to judgments that fail the Contemporary Appraisal Test.
  4.  **Supply Contextual Note:** Add specific data or voices missing from the causal explanation (max 100 words).
  5.  **Restructure the Panel:** Move information from sidebar/footer to main narrative flow.
  6.  **Escalate:** The draft triggers Step 4 (Complicity) or Step 5 (Balance) but requires resource allocation or risk acceptance beyond curator authority (e.g., donor threat, community protest).

  ## IV. Stop Points
  *   **Curator Stops Here:** Steps 1, 2, 3, 5. These are historical and narrative judgments.
  *   **Board Decides Here:** Step 4 (if Acknowledgement threatens solvency) and Step 6 (Escalation). The Board decides *risk*, not *truth*. If the Curator determines a fact is true and relevant, the Board cannot order it removed, but they can decide not to publish the exhibit.

  ## V. Judgment Calls Flagged
  1.  **Step 3 (Appraisal):** Deciding whether a contemporary dissent counts as "available judgment" is a judgment call. A lone voice counts.
  2.  **Step 4 (Complicity):** Deciding what counts as "beneficiary" status is a judgment call. If the money built the building, you are a beneficiary.
  3.  **Step 6 (Escalation):** Deciding when a donor threat becomes an institutional crisis is a judgment call.

  ***

  # Application to Drafts in Progress

  ### Draft One: The Entrance Wall (Convict Lease)
  **Run Time:** 65 Minutes

  *   **Step 1 (Interest):** Why this wall? To honor the founder. *Trigger:* Importing Present Interest. We honor founders because we value philanthropy.
  *   **Step 2 (Vocabulary):** "Convict lease" is historical terminology. "Philanthropist" is the contested term. *Pass.*
  *   **Step 3 (Appraisal):** Was convict leasing controversial in the 1890s?
      *   *Research:* Yes. Northern newspapers criticized it; some Southern clergy called it "slavery by another name" before 1900.
      *   *Result:* Judgment was available.
  *   **Step 4 (Complicity):** Is the museum a beneficiary?
      *   *Fact:* The building was endowed by the fortune.
      *   *Result:* **Yes.**
      *   *Requirement:* "Context" is insufficient. Must **State Plainly** on the primary surface.
  *   **Step 5 (Balance):** Current draft calls him "self-made philanthropist." This sanitizes.
      *   *Result:* **Restructure.**

  **Disposition:** **Restructure the Panel** + **State Plainly.**
  **The Wall Must Say:** "This building was endowed by [Name], whose fortune derived from [Mills]. These mills relied on state-leased convict labor, a system criticized even at the time as exploitative."
  **Escalation?** Yes. Board members are citing donor risk. This is an **Escalate** to the Board, but the Curatorial Recommendation is fixed: The text must state the lease. The Board may choose to close the wall, but they cannot ask the Curator to falsify the draft.
  **Note on Curator Inclination:** You cannot accept the Board's argument ("man of his time") because Step 3 proved contemporaries *did* judge him. That is not presentism; it is historical fact.

  ### Draft Two: Witchcraft Panel (17th Century)
  **Run Time:** 50 Minutes

  *   **Step 1 (Interest):** Why this story? Local trauma. *Pass.*
  *   **Step 2 (Vocabulary):** "Victims," "Harvest failure," "Indebtedness."
      *   *Analysis:* "Victim" is a legal/sociological term not available to them. They saw themselves as sinners or agents of the Devil. "Harvest failure" is materialist analysis.
      *   *Result:* **Attribute the Framing.**
  *   **Step 3 (Appraisal):** Was "witchcraft is fake" available?
      *   *Research:* Yes, skeptical voices existed (e.g., Reginald Scot), but in this specific county court, the framework was theological reality.
      *   *Result:* Mixed. We cannot say *they* knew it was false. We can say *we* know they were harmed.
  *   **Step 4 (Complicity):** Museum beneficiary? No. *Pass.*
  *   **Step 5 (Balance):** Sidebar "What They Believed" separates belief from reality. This implies the belief was a delusion distinct from the "real" economic causes.
      *   *Result:* **Restructure.** The belief *was* the cause.

  **Disposition:** **Restructure the Panel** + **Attribute the Framing.**
  **The Fix:** Remove the sidebar. Integrate the theology into the main text. "Magistrates, acting on a sincere belief in the covenant, pursued..." Use "Accused" instead of "Victims" in the narrative flow, or add "viewed by historians as victims of social stress."
  **Note on "Victim":** Calling them "victims" is an **Evaluation**, not an **Anachronism**, provided you own the judgment. "They were victims" = "We judge this outcome as harmful." This is permissible if Step 3 shows they could not have avoided it. However, the sidebar structure is the greater error; it creates a "rational us vs. irrational them" dynamic that sanitizes the power structure.

  ### Draft Three: Suffrage Centenary
  **Run Time:** 70 Minutes

  *   **Step 1 (Interest):** Why this story? Centenary + Courage. *Trigger:* Importing Present Interest (we value voting rights).
  *   **Step 2 (Vocabulary):** "Racism," "Electorate quality." *Pass* (terms are period-accurate or attributed).
  *   **Step 3 (Appraisal):** Was the racial strategy known then?
      *   *Research:* Yes, it was in their published appeals.
      *   *Result:* Judgment was available (to them and us).
  *   **Step 4 (Complicity):** Museum beneficiary? No. *Pass.*
  *   **Step 5 (Balance):** Draft centers courage, relegates racism to closing panel.
      *   *Analysis:* Does this explain the cause (strategy) without acknowledging the harm (exclusion)? Yes. It sanitizes the *method* of the victory.
      *   *Result:* **Restructure.**

  **Disposition:** **Restructure the Panel.**
  **The Fix:** The racial appeal cannot be in the closing panel. It is the *engine* of the campaign's political logic. It must appear in the section explaining their strategy.
  **Ruling on Curator Inclination:** The procedure **rules against you.**
  **Why:** You argued for "legibility as a campaign." Step 5 dictates that causal explanation (how they won) cannot exclude the moral cost (who they excluded) without sanitizing. Placing racism in the closing panel treats it as an "era reflection" (Step 3 failure: it was a specific strategy, not just background weather) rather than a tactical choice.
  **Escalate?** Yes. The Board includes a donor descendant. This is a values conflict. Curator recommends restructuring; Board decides if they accept the risk of offending the donor. But the Curator cannot sign off on the draft as "historically sound" if the racism is footnoted.

  ***

  # The Curator's Desk Tool (One Page)

  **STANDARDS CHECKLIST (90 MIN MAX)**
  *If you cannot answer a step within the time limit, default to the "Safe" option listed.*

  **1. THE INTEREST CHECK (10m)**
  *   **Q:** Why are we telling this *now*?
  *   **If "Because it happened":** STOP. Rewrite intro to acknowledge current relevance.
  *   **If "Because it matters to [Group]":** PROCEED.
  *   **Safe Default:** Attribute the interest in the intro text.

  **2. THE VOCABULARY AUDIT (20m)**
  *   **Q:** Are we using words they didn't have (e.g., "class," "trauma," "systemic")?
  *   **If Yes:** Do we own the term? (e.g., "Historians now call this...")
  *   **If No (Term presented as fact):** CHANGE TO **Attribute Framing**.
  *   **Safe Default:** Add "In modern terms..."

  **3. THE CONTEMPORARY APPRAISAL TEST (30m)**
  *   **Q:** Could *they* have known this was wrong? (Search for 1 contemporary dissenting voice).
  *   **If Found:** You may **State Plainly** (e.g., "This was cruel").
  *   **If Not Found:** You must **Attribute Framing** (e.g., "By current standards...").
  *   **If Time Runs Out:** **Attribute Framing.** Do not guess.

  **4. THE INSTITUTIONAL CHECK (15m)**
  *   **Q:** Did our building/endowment benefit from this harm?
  *   **If Yes:** **State Plainly** on the main wall/label. No sidebars.
  *   **If No:** PROCEED.
  *   **Safe Default:** If unsure, assume Yes and **Escalate**.

  **5. THE BALANCE CHECK (15m)**
  *   **Q:** Do we explain *why* it happened without naming *who was hurt*?
  *   **If Yes:** **Restructure.** Harm must be in the main narrative, not the conclusion.
  *   **If No:** **Leave as Drafted.**

  **DISPOSITION KEY**
  1.  **Leave:** All steps passed.
  2.  **State Plainly:** Fact is verified + Complicity or Contemporary Appraisal confirmed.
  3.  **Attribute:** Modern judgment or vocabulary used without contemporary backup.
  4.  **Context Note:** Add missing data/voice (max 100 words).
  5.  **Restructure:** Narrative flow hides harm or over-emphasizes belief/delusion split.
  6.  **Escalate:** Donor threat, solvency risk, or Step 4 conflict.

  **STOP POINTS**
  *   **Curator Decides:** Steps 1, 2, 3, 5. (History & Narrative).
  *   **Board Decides:** Step 4 (if financial risk), Step 6. (Risk & Values).
  *   **Rule:** The Board cannot order a historical falsehood. They can only decline to publish.

  **WARNING FLAGS**
  *   [ ] Am I using "Context" to make harm sound inevitable?
  *   [ ] Am I using "Accuracy" to avoid naming pain?
  *   [ ] Is the "Neutral" voice actually taking a side?
