  | (7) | Unwarranted Inference | Follows from (1)+(5) only if one assumes evolutionary history exhausts origin. | Teleologists; pay with the claim that selection explains all capacity. | Evolutionary history is physically explicable. |
  | (8) | False | Follows from (4); if (4) is rejected, this does not follow. | Realists/Phenomenologists; pay with the claim that understanding is an illusion. | We attribute understanding based on competence, but the understanding may be real. |
  | (9) | Sound (as reductio) | If taken as a premise, it refutes the argument; if taken as a conclusion, it refutes itself. | Nihilists; pay with the inability to communicate their nihilism. | This argument, if cogent, requires comprehension to be real. |

  The inversion thesis ought to state that comprehension is a high-order property *emergent* from competent systems, not an illusion displaced by them. It remains true and interesting if it claims that the *capacity* for understanding is built by blind processes, without denying that the resulting understanding is genuinely present in the mature organism. This preserves the scientific insight of Darwin and Turing while avoiding the self-refuting trap of eliminativism.
