  *   **Reject (8):** You deny the conclusion but keep the logic. Cost: You leave the contradiction between (4) and reality unresolved; the argument remains valid but unsound.
  *   **Reject (9):** You claim this argument is exempt from its own rule. Cost: Ad hoc special pleading; you destroy the argument's universality.

  **The Status of Step (9)**
  Step (9) is not an independent defect; it is the *reductio ad absurdum* that locates the culprit. By applying the conclusion to the argument itself, it demonstrates that if (8) were true, the argument could not be understood, and thus could not compel assent. It confirms that (8) (and its parent, (4)) must be false.

