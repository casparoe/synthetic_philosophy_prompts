  **Pricing the Alternatives**
  *   **Reject (1) or (2):** You deny established science (evolutionary biology or computability theory). Cost: Intellectual suicide for a neuroethologist.
  *   **Reject (3):** You deny the Darwin-Turing synthesis. Cost: You lose the "inversion" insight that makes the argument interesting.
