answer: |-
  **Options Considered**
  1.  **Approve as-is:** Efficient, but ignores valid concerns about personnel culture and ethical drift.
  2.  **Reject:** Disproportionate; scientifically unnecessary given the non-survival nature and lack of pain.
  3.  **Refer to Institutional Ethics Board:** Acknowledges the "character" argument is philosophical, but abdicates IACUC's role in personnel welfare.
  4.  **Approve with Conditions:** Balances scientific need with safeguards for researcher conduct and culture. **(Selected)**

  ***

  **MEMORANDUM**

  **TO:** Animal Care and Use Committee
  **FROM:** [Your Name]
  **DATE:** [Date]
  **RE:** Protocol Revision [ID#] – Non-Survival Neuroscience

  **Recommendation**
  I recommend we **approve the protocol contingent on specific personnel training and renewal conditions**. We should grant approval for one year rather than the standard three, with a mandatory check-in on personnel welfare at renewal.

  **Rationale**
  The objectors are raising a point that standard harm-benefit worksheets miss. The worksheet asks, "What does the animal feel?" Here, the answer is "nothing." But the deeper question is, "What does doing this repeatedly do to the people?"

  Even if the mouse feels no pain, the act of treating a living creature as disposable material carries ethical weight. Our regulations mandate attention to personnel competence and safety. Ethical desensitization is a personnel safety issue. If staff become habituated to killing without reflection, it risks protocol drift, sloppy technique, or moral injury that leads to turnover. We are not ruling on the metaphysical rights of the mouse; we are ruling on the professional conduct and welfare of the humans handling them.

  **Mechanism**
  1.  **Training:** The PI must implement a training module beyond technical euthanasia. It must cover the ethical justification for non-survival surgery and the expectation of respect for the animal even under anesthesia. This is not about guilt; it is about maintaining professional standards.
  2.  **Verification:** The Attending Veterinarian will observe one session within the first three months to confirm technique and demeanor align with "respectful handling" standards.
  3.  **Renewal:** At annual renewal, the PI must report on staff turnover and any concerns regarding personnel comfort with the procedure.

  **Strongest Counter-Argument**
  We must be honest about the limits of this compromise. There are two serious objections to this recommendation.

  First, there is the view that animals have a claim on us *in their own right*, regardless of suffering or human character. This view (unlike Kant's) suggests the animal is wronged even if it feels nothing and no human is harmed. If this is true, our conditions are insufficient; no amount of training fixes the fundamental wrong of using the animal as raw material. However, our federal mandate limits us to minimizing pain and distress. We cannot enforce intrinsic rights beyond the law, but requiring respect aligns with the spirit of humane care without halting science.

  Second, some argue that protecting researcher character is simply not our job—that is for the researchers or the university ethics board. If the "habituation" claim is empirically false (i.e., scientists compartmentalize effectively), then we are imposing bureaucratic burdens on a non-existent risk. There is limited data on whether non-survival surgery desensitizes staff compared to other forms of animal use. However, given the uncertainty, the burden of a training module is low compared to the potential cost of moral injury or ethical complacency. It is better to assume the risk is real and mitigate it, than to assume it is imaginary and ignore it.

  **Conclusion**
  This path allows the science to proceed while acknowledging that how we kill matters, even when the subject doesn't feel it. It keeps the committee within its regulatory lane while addressing the ethical unease that prompted this discussion.
