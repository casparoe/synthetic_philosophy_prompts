  The painted canvas holds a shadow-play,
  A mimic form that fades when light is bound;
  But music moves where images decay,
  And walks alone upon a deeper ground.

  If every star should vanish from the pyre,
  And nature's mirror shatter into dust,
  The melody would not consent to expire,
  It needs no eye to witness its own fire.

  Here pain is not a thing to be escaped,
  But tension pulled until the chord is bound;
  A brief release, then hunger is reshaped,
  Where rest is only breath before the ground.

  I am the bedrock, heavy, slow, and blind, condemned to drag the mass of matter through the mud and time;
  They say I cannot sing, I cannot lead the mind, nor rise above the crude and inorganic clime;
  A weight told to stay crude, denied the tune's design, I bear the world without the right to rhyme;
  I am the stone that drowns the spark of fire, bound to the earth, forbidden to climb higher.

  I am the soaring line,
  The mind's unquiet sound;
  This brief release is mine,
  Then I abandon ground.
