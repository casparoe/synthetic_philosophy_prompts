      *   *Solution:* Round 1 is the "Veil" round (choose the regime). Then assign positions. Then play the regimes? No, the prompt says "Include one round in which students choose the rules behind a veil... so it can be contrasted with a round in which they choose having already been dealt their type."
      *   *Integration:*
          *   Phase 1: Veil of Ignorance. Students don't know their type. They vote on which *Regime* (1, 2, or 3) to use for the actual game.
          *   Phase 2: Assign Types.
          *   Phase 3: Play the Three Regimes (as comparative statics).
          *   *Wait, time constraint:* 105 minutes is tight for Veil + 3 Rounds + Debrief.
          *   *Adjustment:* Let's make the "Veil" aspect part of Round 1's setup.
          *   *Revised Plan:*
              *   Round 1: "Constitutional" Phase. Students don't know types. They vote on the *procedure* for Round 2. (This covers the Veil requirement).
