  Here's a thinking process that leads to the suggested simulation design:

  1.  **Analyze the Request:**

      *   **Context:** Upper-level undergrad political philosophy seminar (24 students, 105 mins, 1 TA, movable tables, no laptops, no real money).
      *   **Topic:** Interaction between freedom of movement and the welfare state.
      *   **Core Argument:** The tension isn't just fiscal (contributions vs. drawdown); it's structural (sequencing of decisions: tax/move/vote) and foundational (who decides the boundaries of the electorate?).
      *   **Specific Requirements:**
          *   Fixed productive positions (moving changes tax/transfer jurisdiction, not earnings).
          *   Three Rounds:
              1.  Vote Tax -> Move (Closed Border/Status Quo).
              2.  Move -> Vote Tax (Open Border/Inclusion).
              3.  Guestworker (Move -> Vote Tax, but movers can't vote).
          *   One "Boundary Vote": Students decide who gets a vote without external rules.
          *   One "Veil of Ignorance" Round: Choose rules before knowing positions.
          *   Computable by hand (small integers, paper tally).
          *   Deliverables: Rule set, materials, payoff scheme, worked example, non-degeneracy proof, timeline, scripted instructions, debrief plan.
          *   Troubleshooting: Predict failures (coalitions blocking, inertia, luck dominance, premature closure) and handling strategies.
          *   Limitations: Acknowledge what the sim *can't* show (disenfranchisement as wrong vs. bad deal, migration as costless, guestworker status as technical vs. political).
