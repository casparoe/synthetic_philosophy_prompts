              *   *Constraint Check:* The prompt asks for *three specific rounds* (Tax-Move, Move-Tax, Guestworker). And *one* Veil round.
              *   *Strategy:* Run the Three Regimes as the core simulation. Embed the Veil in the setup of Round 1.
