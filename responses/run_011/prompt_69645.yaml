      *   *Movement:* Students can move from B to A (seeking higher transfers funded by A's wealth).
      *   *Tax/Transfer:* Progressive. Flat tax rate $t$. Pool revenue. Redistribute equally among *eligible voters/residents*.
      *   *Payoff:* $Income \times (1-t) + Transfer$.
      *   *The "Boundary" Problem:* Who counts as a resident for the transfer?

      *   *Re-evaluating the "Sequencing" requirement:*
          *   Round 1 (Tax then Move): Natives set tax. Movers arrive *after*. Do movers get the transfer? If yes, Natives will set low tax to avoid dilution. If no, movement is less attractive. Let's say movers *arrive* but the tax was set for *current* residents.
          *   Round 2 (Move then Tax): Movers arrive. Everyone votes on tax. Movers want high tax (if they are low income). Natives might fear dilution.
          *   Round 3 (Guestworker): Movers arrive, pay tax, *no vote*, maybe no transfer? Or pay tax, get transfer, no vote? The prompt says "permits work and taxation but bars voting." Usually, guestworkers pay tax but get limited benefits. Let's say they pay tax, get *no* transfer. This makes them pure fiscal assets for the Natives.

