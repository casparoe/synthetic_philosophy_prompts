                      *   Start: Deal cards face down.
                      *   **Round 1 (Veil):** Before looking at cards, vote on a Tax Rate $t$ for a generic pool. Calculate expected payoff. Reveal cards.
                      *   **Round 2 (Status Quo - Tax then Move):** Natives (Region A) set $t$. Then Region B students *may* move to A. Transfers paid to *original* A residents only (or all present? If all present, A will set $t=0$). Let's say Transfers paid to all *present*, but Tax set *before* movement. This creates the "dilution fear."
