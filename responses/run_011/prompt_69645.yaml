                              *   *Actually, to ensure the comparison:* I should force the regimes so they see the contrast, rather than voting on the regime. The Veil should be about the *Tax Rate* specifically.
                              *   *Let's try this:*
                                  *   **Round 1 (Veil):** No cards. Vote on Tax Rate $t$. Record it. Reveal Cards.
