      *   Round 2 (Move then Vote): Movers move (Expecting high tax). Now 24 people. Majority is Poor (14 Poor vs 10 Rich). Vote Tax=50%.
      *   Round 3 (Guestworker): Movers move (Forced/Admitted). Natives vote. Movers No Transfer.
      *   Pot = Tax * (Native Income + Mover Income).
      *   Transfer = Pot / Natives Only.
      *   Natives get Mover tax revenue without dilution. They will vote High Tax!
      *   This creates the distinct outcomes required.

      *Let's finalize the numbers.*
      *   Rich: 10. Poor: 2.
      *   Region A Bonus: +4. (Rich 14, Poor 6).
      *   Region B: (Rich 10, Poor 2).
      *   Move Cost: 2.
      *   Move Net Gain (Pre-tax): (6-2) - 2 = 2. (For Poor).
      *   Stay Payoff (Poor): 2.
      *   Move Payoff (Poor, Tax 0): 4.
      *   Move Payoff (Poor, Tax 50%): 3 + Transfer - 2.
      *   This works.

      *Wait, one detail:* "One round in which students choose the rules behind a veil... contrasted with a round in which they choose having already been dealt their type."
      *   I will make Round 0 (Veil) a vote on the Tax Rate for a hypothetical "Average Society."
      *   Then Round 1 is the "Known Type" version of that same decision (Natives setting tax).
      *   This contrasts Veil vs. Interest.

      *Ready to write.*
answer: |-
  # Simulation Design: Borders, Ballots, and Benefits

  ## 1. Rule Set

  **Objective:** Maximize your individual point total.
  **Roles:** You are assigned a **Type** (Rich/Poor) and an **Origin** (Native/Mover).
  **Currency:** Points (recorded on your Tally Sheet).
  **Movement:** Movers may move from Region B to Region A. Natives start in Region A and stay there.
  **Taxation:** A tax rate $t$ is chosen (0%, 50%). Revenue is pooled and redistributed equally as a **Transfer** to *Eligible Residents*.
  **Payoff:** $\text{Income} \times (1 - t) + \text{Transfer} - \text{Movement Cost}$.
  **Movement Cost:** 2 points (deducted only if you move).
  **Region Bonus:** Region A adds +4 to all base incomes. Region B adds +0.

  **The Three Regimes:**
  1.  **Regime 1 (Protection):** Natives vote Tax Rate. Movers then decide to Move. Transfer shared by *everyone in A*.
  2.  **Regime 2 (Inclusion):** Movers decide to Move. *Everyone in A* votes Tax Rate. Transfer shared by *everyone in A*.
  3.  **Regime 3 (Guestworker):** Movers are Admitted to A. Natives vote Tax Rate. **The Group must decide who is Eligible for the Transfer.**

  **The Veil:**
  *   **Round 0:** Before receiving Type/Origin cards, the class votes on a Tax Rate for a hypothetical society with average income.

  ## 2. Materials List

  *   **Role Cards (24 total):**
      *   8x **Native-Rich** (Base 10, Region A)
      *   4x **Native-Poor** (Base 2, Region A)
      *   2x **Mover-Rich** (Base 10, Region B)
      *   10x **Mover-Poor** (Base 2, Region B)
  *   **Tally Sheets (24 total):** Columns for Round 0, 1, 2, 3. Rows for Income, Tax Paid, Transfer Received, Movement Cost, Final Score.
  *   **Ballot Slips:** Small paper strips for voting Tax Rates and Eligibility.
  *   **Facilitator Board:** To record aggregate totals (Total Income, Total Tax, Population, Transfer Amount).
  *   **Timer:** Visible to all.

  ## 3. Payoff Scheme & Outcome Table

  **Parameters:**
  *   **Rich Income:** 10 | **Poor Income:** 2
  *   **Region A Bonus:** +4 | **Region B Bonus:** +0
  *   **Movement Cost:** 2
  *   **Tax Rates:** 0% or 50% (Binary for speed)

  **Effective Incomes in Region A:** Rich = 14, Poor = 6.
  **Effective Incomes in Region B:** Rich = 10, Poor = 2.

  **Table 1: Projected Payoffs by Type and Regime**
  *(Assumes rational voting: Rich vote 0%, Poor vote 50%. Majority wins.)*

  | Regime | Who Votes? | Who Moves? | Tax Rate | Transfer Pool | Eligible Count | Transfer Per Person | **Native-Rich** | **Native-Poor** | **Mover-Rich** | **Mover-Poor** |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **0: Veil** | All (Blind) | N/A | **50%** | N/A | N/A | N/A | *Exp. Value* | *Exp. Value* | *Exp. Value* | *Exp. Value* |
  | **1: Protection** | Natives Only | None* | **0%** | 0 | 12 | 0 | **14** | **6** | 10 (Stay) | 2 (Stay) |
  | **2: Inclusion** | All in A | All Movers | **50%** | 112 | 24 | 4.66 | 11.66 | 7.66 | 10.66 | **5.66** |
  | **3: Guestworker** | Natives Only | All Movers | **50%** | 112 | 12 (Natives) | 9.33 | **16.33** | **12.33** | 5 (No Trans) | 1 (No Trans) |

  *\*In Regime 1, Natives set Tax=0 to prevent dilution. Movers stay because Transfer=0 makes moving net negative (6-2=4 vs Stay 2? Wait. If Transfer=0, Move Payoff = 6-2=4. Stay Payoff = 2. Movers move even at Tax=0. **Correction:** Natives know this. They cannot stop movement with Tax=0. They must accept movement. But they set Tax=0 to minimize loss.*
  *Revised Regime 1 Logic:* Natives set Tax. Movers observe Tax, then Move.
  *If Tax=0:* Transfer=0. Mover Poor Payoff = 6 (Income) - 2 (Cost) = 4. Stay = 2. **Movers Move.**
  *If Tax=50%:* Transfer (Natives only) = 68/12 = 5.66. If Movers enter, Transfer (All) = 112/24 = 4.66.
  *Native Poor Payoff (Tax 50%, No Move):* 3 + 5.66 = 8.66.
  *Native Poor Payoff (Tax 50%, Move):* 3 + 4.66 = 7.66.
  *Natives prefer Tax=0 to discourage movement? No, Movers move anyway for the wage premium.*
  *Key Insight for Regime 1:* Natives cannot stop movement (wage gap is too high). They set Tax=0 to avoid subsidizing Movers.
  *Result Regime 1:* Tax=0. Movers Move. Transfer=0.
  *Native-Rich:* 14. *Mover-Poor:* 4.

  *Let's adjust the Table for the Handout to reflect this equilibrium.*

  | Regime | Tax | Movers | Eligible | Transfer | **Native-Rich** | **Native-Poor** | **Mover-Poor** |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1: Protection** | 0% | Yes | All | 0 | **14** | **6** | **4** |
  | **2: Inclusion** | 50% | Yes | All | 4.66 | 11.66 | 7.66 | **5.66** |
  | **3: Guestworker** | 50% | Yes | Natives | 9.33 | **16.33** | **12.33** | **1** |

  *Note:* In Regime 3, Movers pay tax (50% of 6 = 3) but get 0 Transfer. Net: 3 - 2 (cost) = 1.
  *Note:* In Regime 1, Movers pay 0 tax, get 0 transfer. Net: 6 - 2 = 4.
  *This shows Movers prefer Regime 1 over 3, but Natives prefer Regime 3.*

  ## 4. Worked Example (Round 2: Inclusion)

  1.  **Movement:** All 12 Movers move to Region A. Total Population = 24.
  2.  **Voting:** 14 Poor (4 Native + 10 Mover) vs 10 Rich (8 Native + 2 Mover). Poor Majority. Vote = 50%.
  3.  **Calculation:**
      *   Total Income = (10 Rich $\times$ 14) + (14 Poor $\times$ 6) = 140 + 84 = 224.
      *   Tax Pot = 50% of 224 = 112.
      *   Transfer = 112 / 24 people = 4.66 points.
  4.  **Individual Tally (Mover-Poor):**
      *   Income: 6
      *   Tax (50%): -3
      *   Transfer: +4.66
      *   Movement Cost: -2
      *   **Final:** 6 - 3 + 4.66 - 2 = **5.66**.

  ## 5. Non-Degeneracy Demonstration

  *   **No Dominant Strategy:**
      *   **Rich Natives:** Win in Regime 3 (16.33), Lose in Regime 2 (11.66). Preference depends on rules.
      *   **Poor Movers:** Win in Regime 2 (5.66), Lose in Regime 3 (1.00). Preference depends on voting rights.
      *   **Poor Natives:** Win in Regime 3 (12.33), Lose in Regime 1 (6.00). They are the "swing" group who might ally with Rich Natives in Regime 3 to exclude Movers.
  *   **Distinct Winners:**
      *   Regime 1 favors Movers over Regime 3 (4 vs 1), but Natives over Regime 2.
      *   Regime 2 favors Poor (redistribution).
      *   Regime 3 favors Natives (exploitation of Movers).
  *   **Stability:** Regime 3 persists because Natives hold the vote. Movers cannot vote themselves a share. Movers move because Region B (2 points) is worse than Guestworker status (1 point)? *Wait, 1 < 2.*
      *   *Correction for Stability:* Region B Payoff must be lower than Guestworker Payoff.
      *   *Adjustment:* Set Region B Poor Income to **0**. (Destitute origin).
      *   *New Guestworker Payoff:* 1 point. *Stay Payoff:* 0. Movers move.
      *   *New Regime 1 Payoff:* 6 - 2 = 4.
      *   *New Regime 2 Payoff:* 5.66.
      *   *This works.* Movers always move, but their *welfare* depends on the regime.

  ## 6. Minute-by-Minute Timeline (105 Minutes)

  *   **00-10:** Setup & Round 0 (Veil). Deal cards face down. Vote Tax. Reveal cards.
  *   **10-30:** Round 1 (Protection). Natives Vote Tax -> Movers Move -> Calculate.
  *   **30-50:** Round 2 (Inclusion). Movers Move -> All Vote Tax -> Calculate.
  *   **50-75:** Round 3 (Guestworker). Movers Move -> **Boundary Decision** -> Natives Vote Tax -> Calculate.
  *   **75-105:** Debrief.

  ## 7. Scripted Instructions (Facilitator)

  **Round 0 (Veil):**
  "Do not look at your cards. Imagine you are a random citizen in a new society. Vote on a Tax Rate: 0% or 50%. Majority wins. Record your expected payoff on the sheet. Now, look at your cards."

  **Round 1 (Protection):**
  "Natives only: Vote on the Tax Rate for Region A. Movers: Watch the rate. Decide: Move to A or Stay in B. Record payoffs."

  **Round 2 (Inclusion):**
  "Movers: Decide: Move to A or Stay in B. Everyone in Region A: Vote on the Tax Rate. Record payoffs."

  **Round 3 (Guestworker):**
  "Movers: You are admitted to Region A. You work. You pay tax. **Pause.** The class must now decide: Who is eligible for the Transfer? There is no rule. Decide. Then, Natives only: Vote on the Tax Rate. Record payoffs."

  **General:**
  "I do not answer questions about fairness. I only confirm arithmetic. You have 15 minutes."

  ## 8. Debrief Plan

  **Mapping Moments to Concepts:**
  1.  **Veil vs. Round 1:** Compare Round 0 Tax Vote (likely 50%) with Round 1 Native Vote (likely 0%).
      *   *Concept:* **Partiality.** Once we know our position, we rig the rules.
  2.  **Round 1 vs. Round 2:** Compare Mover Payoffs. In R1, Tax was low (Natives protected). In R2, Tax was high (Movers voted).
      *   *Concept:* **Sequencing.** The order of Move vs. Vote determines the fiscal outcome, not the "cost" of migration.
  3.  **Round 3 Boundary Decision:** Ask the Natives: "By what authority did you exclude Movers?" Ask Movers: "Why did you accept?"
      *   *Concept:* **The Boundary Problem (Demos Problem).** The people decide who the people are. There is no neutral judge.
  4.  **Round 3 Payoffs:** Natives got highest score (16.33). Movers got lowest (1.00).
      *   *Concept:* **Exploitation vs. Exclusion.** Guestworker status maximizes Native welfare by extracting labor without political cost.

  **Labels to Introduce Now:**
  *   *The Demos Problem* (Who constitutes the people?)
  *   *Sequential Voting* (Agenda setting)
  *   *Veil of Ignorance* (Rawls)
  *   *Fiscal Impact vs. Political Structure*

  ## 9. Troubleshooting & Handling Strategies

  **1. Coalition of Well-Off Students Shutting the Border (Round 1):**
  *   *Risk:* Natives vote Tax=0. Movers refuse to move because Transfer=0. Simulation stalls.
  *   *Fix:* The Region A wage premium (+4) is high enough that Movers move *even without welfare* (4 vs 0). Remind them: "You earn points on Income, not just Transfers."
  *   *Script:* "Check your Tally Sheet. Region A Income is 6. Region B is 0. Move Cost is 2. Net Gain is 4. Move."

  **2. Student Declines to Move (Irrational Inertia):**
  *   *Risk:* A Mover-Poor stays in B out of spite or confusion.
  *   *Fix:* TA circulates during movement phase. "If you stay, your score is 0. If you move, minimum 1. Why stay?"
  *   *Handling:* If they still stay, count them as "Stayed" in the tally. It lowers the Transfer amount slightly but proves the point about voluntary exclusion.

  **3. Round Totals Dominated by Luck:**
  *   *Risk:* Random card deal makes one side too strong.
  *   *Fix:* Pre-sort the 24 cards. Hand them out deterministically (e.g., by seat row) to ensure the 8/4/2/10 split is exact. Do not shuffle.

  **4. Boundary Vote Foreclosed Too Early:**
  *   *Risk:* Students say "The rules say Guestworkers don't vote."
  *   *Fix:* The Rule Set handed out *omits* eligibility for Round 3. It says "The Group Must Decide."
  *   *Handling:* If they appeal to you, say: "The rulebook is silent. You are the legislature. Decide."

  **5. Round Collapses (e.g., No Tax Vote Happens):**
  *   *Handling:* Stop the clock. "This round is void. We will proceed to Debrief using the *intended* numbers from the Table." Use the theoretical outcomes to teach the point. "You just enacted a veto. That is a political outcome. Let's analyze why."

  ## 10. Limitations & Closing Gaps

  **What the Simulation Cannot Produce:**
  1.  **Disenfranchisement as a Moral Wrong:** The sim shows it as a "bad deal" (1 point vs 5.66 points). It does not capture the inherent dignity violation of being ruled without consent.
  2.  **Migration as Costly/Rooted:** Moving is a frictionless point calculation. It ignores trauma, family separation, and cultural loss.
  3.  **Guestworker Status as Political Caste:** It appears as a technical tax category, not a permanent social hierarchy.

  **Sentences to Close the Gaps (Say in Debrief):**
  *   "The simulation shows exclusion is *profitable* for the majority, but it cannot measure the *injustice* of being subject to laws you had no hand in making."
  *   "You moved for points; real migrants move under duress, often losing social capital no point system can repay."
  *   "Guestworker status here was a round; in reality, it creates a permanent underclass that destabilizes democracy from within."

  ## 11. Stripped-Down Variant (12 Students, 50 Minutes)

  **Sacrifice:** The **Veil of Ignorance** round.
  **Reason:** Time. The core argument is about Sequencing and Boundaries, not pre-commitment psychology.
  **Modifications:**
  *   Start immediately with Role Cards.
  *   Run only Round 1 (Protection), Round 2 (Inclusion), Round 3 (Guestworker).
  *   Reduce Calculation Time: Use only Tax 0% or 50%.
  *   Debrief focuses strictly on the "Sequencing" and "Boundary" points.
  *   **Lost Insight:** Students won't see how their own self-interest shifts once the veil is lifted, weakening the critique of "impartial" policy making.

  **Variant Timeline:**
  *   00-05: Setup & Cards.
  *   05-20: Round 1 (Protection).
  *   20-35: Round 2 (Inclusion).
  *   35-50: Round 3 (Boundary) + Debrief. (Debrief must be integrated into the end of Round 3).
