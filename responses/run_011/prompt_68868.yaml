prompt: |-
  You're a collapse-studies person who's also done applied institutional work — someone who can hold Tainter's diminishing-returns-to-complexity argument, the Diamond-style five-factors framing, and the resilience/panarchy crowd in your head simultaneously and knows which parts of that literature actually convert into a usable test rather than just rhetoric. Please think carefully before answering, and start with a short brainstorm: where does the word "collapse" actually go wrong when a non-specialist committee uses it? Then give me the procedure.

  Situation: I just got handed the screening desk at a small societal-risk unit. We rate maybe a dozen cases a month and the word "collapse" in our output decides whether something goes to the underwriting committee for emergency treatment or gets filed as ordinary deterioration. Three weeks ago we published a briefing that used it about a regional capital, and two academics tore it apart publicly for confusing a government losing the ability to tax and staff services with a society dying. That's on me now to prevent. I get about twenty minutes per case, I have two analysts (one historian, one economist), and the committee wants a verdict plus a confidence level — they will not read an essay.

  So: a step-by-step procedure my two analysts can run without knowing the theory. Ordered questions, what counts as a sufficient answer to each, the rules for moving on, and where the procedure has to stop and hand the call to a human because it's a values question dressed up as a fact question. It has to make the analyst fix the unit of analysis first — polity, elite fiscal base, settlement pattern, resident population, language, ritual calendar, craft transmission — because those come apart constantly. It has to force the counterfactual question (collapse relative to what trajectory). It has to handle Tainter's point that shedding complexity can make most people better off, and the window problem: how long something has to run before you call it reorganization instead of collapse. And it should bake in the lesson from the Rapa Nui fight about whether a demographic crash belongs to pre-contact environmental choices or to what arrived afterward.

  Then run it on three cases:

  1. An island territory that has lost over half its population in thirty years to outmigration and abandoned most of its terraced farmland — but language, kinship, and the ritual calendar are fully intact, and remittances mean people eat better than their grandparents did.
  2. A capital where the central state has effectively stopped functioning, the currency is worthless, and two armed administrations compete for the same buildings — while markets, clinics, schools, and mutual-aid networks keep running and most residents report being no worse fed than five years ago.
  3. Our own flagship success story: a region that deliberately dismantled a layer of bureaucracy, converted irrigated export monoculture back to rain-fed mixed farming, and watched GDP, urban population, and administrative headcount fall hard while life expectancy rose.

  I want case 3 to come out however the procedure says, even if it's the answer that will humiliate me in front of the people who funded it. Finish with the honest part: the cases the procedure will systematically get wrong, the ones it can't reach at all (dispersed or diasporic populations, very short windows), and which of its steps are judgment calls wearing a checklist costume.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Role:** Collapse-studies expert with applied institutional experience. Needs to balance Tainter (complexity/returns), Diamond (factors), and Resilience/Panarchy (adaptive cycles) without getting bogged down in theory. Practical, usable, test-oriented.
      *   **Task:**
          1.  Short brainstorm: Why "collapse" fails in non-specialist committees.
          2.  Step-by-step procedure for analysts (20 mins/case, 2 analysts). Must fix unit of analysis, force counterfactuals, handle Tainter's "beneficial simplification," address the time-window problem, and learn from Rapa Nui (attribution).
          3.  Apply procedure to three specific cases.
          4.  Honest conclusion: Where the procedure fails, blind spots, and disguised judgment calls.
      *   **Constraints:** 20 minutes per case, verdict + confidence level, no essays. Case 3 must be rated honestly even if it contradicts the "success story" narrative.
      *   **Tone:** Professional, sharp, institutional, slightly weary but competent.

  2.  **Brainstorm: Where "Collapse" Goes Wrong:**
      *   *Conflation:* Mixing up *state* failure with *societal* failure.
      *   *Normativity:* Assuming "complexity" = "good." Tainter says complexity costs energy; shedding it isn't always bad.
      *   *Temporal Myopia:* Calling a dip a crash. Need a time horizon.
      *   *Unit Ambiguity:* Are we talking about the government, the economy, the culture, or the people?
      *   *Attribution:* Is this endogenous (choices) or exogenous (shock)? (Rapa Nui lesson).
      *   *Political Utility:* "Collapse" triggers emergency funding. It's a resource allocation label, not just a descriptive one.

  3.  **Develop the Procedure (The "Triage Protocol"):**
      *   *Goal:* Binary/Near-Binary output (Collapse vs. Reorganization/Deterioration) with Confidence.
      *   *Step 1: Unit Lock.* What exactly are we measuring? (Polity, Population, Culture, Energy).
      *   *Step 2: The Counterfactual.* Compared to what? (Trend line, peer group).
      *   *Step 3: Functionality Check.* Can the core needs be met? (Food, Security, Order).
      *   *Step 4: Complexity vs. Welfare.* Tainter check. Did complexity drop but welfare stay/rise?
      *   *Step 5: Attribution & Time.* Is this permanent? Is it self-inflicted or external shock? (Rapa Nui check).
      *   *Step 6: The Verdict.* Rules for "Collapse" vs. "Transformation."
      *   *Stop Rule:* When values override facts (e.g., "Is a simpler life *better*?").

  4.  **Drafting the Procedure (Iterative Refinement):**
      *   *Constraint:* 20 minutes. Needs to be a checklist, not a debate.
      *   *Refinement:* Make Step 1 critical. If they can't agree on the unit, they can't rate the case.
      *   *Refinement:* Step 4 needs to capture the "beneficial simplification" idea. If GDP drops but Life Expectancy rises, is it collapse? No.
      *   *Refinement:* Time window. Needs a specific duration (e.g., >1 generation or irreversible within 10 years). Let's use "Irreversibility within one political cycle (5-10 years)."

  5.  **Applying to Cases:**
      *   *Case 1 (Island Territory):* Pop -50%, Land abandoned. BUT culture intact, welfare up (remittances).
          *   Unit: Population vs. Culture.
          *   Tainter: Complexity (farming) shed, Welfare up.
          *   Verdict: Not Collapse (Transformation/Migration).
      *   *Case 2 (Capital/State Failure):* State dead, currency dead. BUT markets/clinics work, food secure.
          *   Unit: State vs. Society.
          *   Tainter: State complexity gone, local resilience high.
          *   Verdict: State Collapse, Societal Reorganization. (Nuanced).
      *   *Case 3 (Flagship Success):* Bureaucracy dismantled, GDP down, Urban pop down. Life Expectancy up.
          *   Unit: Economy/State vs. Human Welfare.
          *   Tainter: Deliberate simplification.
          *   Verdict: Not Collapse. (This is the hard pill to swallow for the "growth" funders).

  6.  **The Honest Conclusion:**
      *   *Blind Spots:* Slow violence (climate), diaspora (culture lives elsewhere), short windows (flash crashes).
      *   *Disguised Judgments:* Defining "core needs," deciding "irreversibility," valuing "culture" vs. "calories."
      *   *The Political Reality:* The committee *wants* "Collapse" to unlock funds. The procedure might deny them that tool.

  7.  **Review against Constraints:**
      *   *Tainter/Diamond/Panarchy:* Integrated into the steps (Complexity/Welfare, Factors, Resilience/Adaptation).
      *   *Rapa Nui:* Addressed in Attribution (exogenous vs endogenous).
      *   *Case 3:* Rated honestly (Not Collapse).
      *   *Tone:* Institutional, direct.

  8.  **Final Polish:**
      *   Ensure the distinction between "State Collapse" and "Societal Collapse" is sharp.
      *   Make sure the "Stop Rule" is clear for when analysts hit a values wall.
      *   Check the timing (20 mins is tight, so the checklist must be rapid).

  *(Self-Correction during drafting)*: I initially thought about having them score variables. No, too slow. It needs to be a decision tree. If X, then Y. Also, need to emphasize that "Collapse" is a specific technical term here, not a pejorative.
  *Correction on Case 2:* If the state is gone, is it collapse? For the *underwriting committee*, they care about the *risk unit*. If the state is gone, that's usually a trigger. But the prompt says "society dying" vs "government losing ability." I need to make sure the procedure distinguishes *Polity Collapse* from *Societal Collapse*. I will add a specific toggle for "Polity vs. Population."

  *Correction on Case 3:* The prompt says "Finish with the honest part... which of its steps are judgment calls wearing a checklist costume." I need to be very explicit about that.

  *Final check on Tone:* Needs to sound like someone who has seen these briefings get shredded. A bit cynical but rigorous.

  Let's write it.cw
answer: |-
  ### Brainstorm: Where "Collapse" Breaks in Committee
  The word fails because it is a **category error masquerading as a measurement**. In a risk unit, "collapse" is a funding trigger, but in the literature, it's a structural transition.
  1.  **Unit Slippage:** We say "Rome collapsed," but meant the *Imperial administration*, not the *Latin language* or *Mediterranean trade*. Committees treat them as identical.
  2.  **Normative Loading:** We assume "complexity" (bureaucracy, GDP, urbanization) equals "well-being." Tainter proved complexity costs energy; shedding it can be a rational survival strategy, not a death spiral.
  3.  **Temporal Blindness:** A five-year contraction looks like collapse on a quarterly report but looks like a "adaptive cycle release" (panarchy) on a century scale.
  4.  **Attribution Error:** The Rapa Nui lesson. If a population crashes because of a shock (contact/disease) rather than system failure (ecological suicide), calling it "system collapse" excuses the external aggressor and misdiagnoses the resilience.

  ***

  ### The Procedure: Societal Risk Triage Protocol (SRTP-1)
  **Time Limit:** 20 Minutes total (10 min data scan, 5 min analyst sync, 5 min verdict).
  **Personnel:** Lead Analyst (you), Historian, Economist.
  **Output:** Verdict (Collapse / Reorganization / Deterioration) + Confidence (High/Med/Low).

  #### Step 1: Lock the Unit of Analysis (3 Minutes)
  *Question:* **What specifically is failing?** Select *one* primary unit.
  *   [ ] **Polity:** The administrative/taxing structure.
  *   [ ] **Population:** The number of biological humans in the territory.
  *   [ ] **Subsistence:** The ability to secure calories/energy.
  *   [ ] **Culture:** Language, ritual, kinship transmission.
  *   [ ] **Complexity:** Energy spent on non-subsistence roles (bureaucracy, elites).

  *Rule:* If analysts pick different units, **STOP**. You cannot rate the case. You must agree on what "thing" is being measured before measuring its health. *Default to Subsistence/Population for humanitarian triggers, Polity for sovereign risk.*

  #### Step 2: The Counterfactual & Trajectory (3 Minutes)
  *Question:* **Collapse relative to what baseline?**
  *   [ ] **Trend:** Is this a deviation from a 50-year growth path, or a return to a pre-boom baseline?
  *   [ ] **Peer:** Is this unit performing worse than comparable regions facing similar shocks?

  *Rule:* If the drop is a return to a pre-boom baseline (e.g., post-bubble), mark as **Correction**, not Collapse.

  #### Step 3: The Tainter Welfare Check (4 Minutes)
  *Question:* **Did complexity drop while welfare stayed stable or rose?**
  *   [ ] **Yes:** (e.g., GDP down, Bureaucracy down, BUT Life Expectancy/Calories up).
  *   [ ] **No:** (e.g., GDP down, AND Mortality up/Starvation present).

  *Rule:* If **Yes**, this is **Simplification/Reorganization**. It cannot be coded as "Collapse" for emergency underwriting, even if elites lose status. This captures the "shedding complexity makes people better off" argument.

  #### Step 4: The Time & Attribution Window (4 Minutes)
  *Question:* **Is this irreversible within one political cycle (5-10 years), and what caused it?**
  *   [ ] **Duration:** Has the function been lost for >5 years with no recovery signal?
  *   [ ] **Attribution (Rapa Nui Test):** Is the loss due to internal system rigidity (endogenous) or external shock/contact (exogenous)?

  *Rule:* If the cause is primarily exogenous shock (war, pandemic, contact) and the *internal* social fabric holds, code as **Shock Event**, not System Collapse. If function is lost <5 years, code as **Deterioration** (monitor).

  #### Step 5: The Verdict Logic (3 Minutes)
  *   **COLLAPSE:** Unit = Polity OR Subsistence. Welfare = Declining. Duration = >5 years/Irreversible. Attribution = Endogenous failure.
  *   **REORGANIZATION:** Unit = Polity OR Complexity. Welfare = Stable/Rising. (Tainter Pass).
  *   **DETERIORATION:** Duration = <5 years OR Recovery signals present.
  *   **STOP (Values Call):** If the debate hinges on whether "loss of sovereignty" matters more than "gain in calories." **Escalate to Committee.** This is not a fact question.

  ***

  ### Case Applications

  #### Case 1: The Island Territory
  *   **Step 1 (Unit):** Analysts disagree initially. Historian picks *Population* (-50%). Economist picks *Subsistence/Welfare* (Remittances/Food). **Agreement:** Primary risk unit is *Subsistence/Welfare* (Humanitarian mandate).
  *   **Step 2 (Counterfactual):** Trend is negative on population, but positive on per-capita consumption compared to grandparents.
  *   **Step 3 (Tainter):** Complexity (terraced farming) dropped. Welfare (food security) rose. **Pass.**
  *   **Step 4 (Time/Attribution):** Outmigration is voluntary economic adaptation, not forced flight from starvation. Culture intact.
  *   **Verdict:** **REORGANIZATION.**
  *   **Confidence:** High.
  *   **Note:** Do not trigger emergency underwriting. This is a diaspora strategy, not a system failure.

  #### Case 2: The Capital (State Failure)
  *   **Step 1 (Unit):** **Polity** (Central State).
  *   **Step 2 (Counterfactual):** Deviation from sovereign function.
  *   **Step 3 (Tainter):** Complexity (State) dropped. Welfare (Food/Clinics) Stable. **Pass on Societal, Fail on Polity.**
  *   **Step 4 (Time/Attribution):** State function lost <5 years? (Prompt implies "effectively stopped"). Markets running suggests resilience.
  *   **Verdict:** **POLITY COLLAPSE / SOCIETAL REORGANIZATION.**
  *   **Confidence:** Medium.
  *   **Note:** This requires a split recommendation. Flag for *Sovereign Risk* committee (Collapse), but clear for *Humanitarian* committee (Reorganization). The "society dying" accusation was correct; the society is alive, the government is dead.

  #### Case 3: The Flagship Success (De-growth Region)
  *   **Step 1 (Unit):** **Complexity/Polity** (Bureaucracy/GDP) vs. **Population Welfare** (Life Expectancy).
  *   **Step 2 (Counterfactual):** Deliberate policy shift, not unexpected shock.
  *   **Step 3 (Tainter):** Complexity (GDP/Admin) dropped hard. Welfare (Life Expectancy) **Rose**. **Pass.**
  *   **Step 4 (Time/Attribution):** Deliberate choice (Endogenous), but beneficial.
  *   **Verdict:** **REORGANIZATION.**
  *   **Confidence:** High.
  *   **Note:** **This will humiliate the funders.** By definition, this is not a collapse. It is a successful adaptive release. If the committee demands "Collapse" to justify cutting aid or seizing assets, the procedure forces you to flag that as a **Values Call (Step 5 Stop)**. You must report: "System simplified intentionally; human metrics improved. Not a collapse event."

  ***

  ### The Honest Part: Where This Procedure Lies to You

  You asked for the parts that are judgment calls wearing a checklist costume. Here they are:

  1.  **The "Welfare" Definition (Step 3):** I told you to check if welfare rose. But *who* defines welfare? In Case 3, Life Expectancy rose, but perhaps political freedom or cultural prestige fell. The procedure privileges biological survival over elite agency. That is a value judgment, not a fact. If your funders care about *influence* more than *calories*, this procedure will systematically under-call collapse for their interests.
  2.  **The Time Window (Step 4):** Five years is arbitrary. A slow-rolling climate collapse takes 50 years. This procedure is blind to "Slow Violence." It will rate a 40-year drought-induced decline as "Deterioration" forever until the very end, missing the systemic rot. It is biased toward acute crises.
  3.  **The Unit Lock (Step 1):** This is the biggest escape hatch. If I want to prove collapse, I measure the *State*. If I want to prove resilience, I measure the *Household*. The procedure forces you to pick one, but it doesn't tell you *which one matters*. That decision is political. In Case 2, calling it "Polity Collapse" gets you emergency funds. Calling it "Societal Reorganization" gets you filed away. The analysts will feel pressure to pick the unit that matches the desired funding outcome.
  4.  **The Diaspora Blind Spot:** In Case 1, the culture is "intact" on the island. But if 50% of the speakers leave, is the language intact? The procedure treats territory as the container for culture. It cannot measure a *deterritorialized* collapse. If the population disperses and assimilates over two generations, the procedure sees "Reorganization." History might call it "Dissolution."

  **Final Advice:** Use the procedure to protect your analysts from the academics. It forces the definitions into the open. But when you hand the verdict to the committee, attach the "Unit Lock" they selected. If they complain about Case 3, show them Step 3. If they still demand "Collapse," make them sign off on the **Values Call**. That's where the liability shifts from your desk to theirs.
