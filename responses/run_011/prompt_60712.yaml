prompt: |-
  I run a lunchtime reading group at the software company I work at — about 10 engineers, 45 minutes, none of us have done any philosophy. Next session is on testimony: whether you need independent reasons before you're entitled to believe what someone tells you, or whether trust is the default and you only need reasons to doubt. I gather it's a Hume vs Reid thing, dont quote me on that. It isn't abstract for us — half the room works on a pipeline where one model's output is another model's input, and in incident postmortems we recieve basically everything second-hand.

  Design an activity that makes them feel the difference between those two stances, ideally by running into it themselves rather than being told. No lecture up front, and don't drop the labels until the debrief. I'd need: rules and materials (nothing that costs money), a minute-by-minute timeline, a debrief that maps specific moments in the game onto each view and gets them to say which one they were actually operating under, what predictably goes wrong the first time you run it and how to handle that, and an honest note on which feature of the debate the activity simply can't reproduce and I'll have to supply myself.

  Please write it in British English. Also: say how confident you are that this produces the intended effect rather than just being a fun 20 minutes, and single out the part of the design you're least sure about.
