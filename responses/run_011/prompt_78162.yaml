      *   **The Discovery:** The desire rating correlates with external factors (workouts, rain), not job factors. Justifications are contradictory over time despite no job changes.
      *   **The Experiment:** Roommate tested ability to identify own reasons vs. fake reasons. Result: 50% accuracy (chance).
      *   **The Conclusion:** Introspection is generating stories, not revealing truth. The spreadsheet measures storytelling, not preference.
