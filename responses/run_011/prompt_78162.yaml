      *   *Section 3 (The Roommate):* Validate the "bug." It *should* bug you slightly because she lacks qualia. But she has data on *consistency*. She knows your *patterns*, not your *truth*. Use her as a mirror, not a judge.

      *   *Refining the "Decision" advice:* The user is stuck because they think the answer is *inside* waiting to be found. I need to tell them the answer is *outside* waiting to be built. This is the "Existential" angle.
