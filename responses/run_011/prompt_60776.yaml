      *   *Move 7 (Musgrave's Taxonomy):* **Settled/Standard View.** Alan Musgrave's 1981 paper "'Unreal Assumptions' in Economic Theory: The F-Twist Untwisted" is a classic. It is widely accepted that Friedman conflated types of assumptions.

