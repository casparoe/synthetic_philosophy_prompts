answer: |-
  This is a delicate situation. You are asking me to audit the moral logic of an institution that is, by your own admission, potentially operating on intuition masquerading as principle. In museum ethics, inconsistency is not just an administrative error; it is a form of epistemic violence. If you treat similar cases differently, you signal to your visitors and your stakeholders that the moral weight of history is arbitrary, dependent on who is in the room that day.

  I am going to treat your minutes as a legal record, though I must flag where I am inferring intent from sparse language. My goal is not to tell you what is morally "true" in a vacuum, but to help you recover the internal coherence of your committee, or else consciously choose a new coherence.

  Here is the breakdown.

  ### (a) Candidate Rules

  You suggested four rules. I am going to keep two of yours, discard one, and propose three new ones that I believe better capture the tension in your record.

  **Your List, Critiqued:**
  1.  *"Compare machinery, not misery."* **Keep.** This is the strongest thread. It explains V1 (Slave/Congo) and V5 (Child Removal). It aligns with the current proposal's focus on logistics.
  2.  *"No comparison that yields an ordering."* **Keep.** This explains V2 ("Which Was Worse?") and V6 (Severity Index). It captures the aversion to competitive suffering.
  3.  *"Don't touch live politics."* **Keep.** This is the only thing that explains V4 ("Premature"). It is a temporal rule, not a thematic one.
  4.  *"Don't annex one community's dead into another's vocabulary."* **Drop.** This is too specific. It explains V3's condition (no adjective swapping) and the current community objection, but it fails to explain V1. The Atlantic Slave Trade and Congo Free State have distinct descendant communities; joining them on a shared wall text risks exactly this annexation, yet it was approved. I suspect this is a *symptom* of a deeper rule, not the rule itself.

  **My Proposed Additions:**
  5.  *"Quantification is permissible for chronology, forbidden for valuation."* This attempts to reconcile V5 (Approved timelines/numbers) with V6 (Rejected severity index). It suggests numbers are okay for *when*, but not for *how much* or *how bad*.
  6.  *"The 'Sacred Statistics' Rule."* [Guess: I am inferring this from V6 and the current community objection.] Some numbers are not data; they are relics. When a number represents the totality of a community's loss, turning it into a variable on an axis is a category error.
  7.  *"Agentive Clarity."* [Guess: Inferred from V3.] You can compare outcomes, but you must not obscure the human hands that caused them. Structural explanations cannot erase specific perpetrators.

  ### (b) Stress-Testing the Rules

  Let's run these against your six verdicts to see which rule holds the most weight and where the cracks are.

  **Rule 1: Machinery, Not Misery.**
  *   *Fits:* V1, V5, Current Proposal.
  *   *Strain:* V6. The "Severity Index" proposed weighting scale, intent, and complicity. That is machinery (complicity/intent are structural). Yet it was rejected.
  *   *Verdict:* This rule is necessary but insufficient. It explains your approvals, but not your rejections.

  **Rule 2: No Ordering/Ranking.**
  *   *Fits:* V2, V6.
  *   *Strain:* V5. Parallel timelines of child removal inevitably invite the viewer to ask "Which country was worse?" even if not explicitly stated. If V5 is approved, this rule is not absolute.
  *   *Verdict:* This rule explains the rejections, but it threatens V5. To save this rule, you must argue that timelines are descriptive, whereas a "Severity Index" is evaluative.

  **Rule 3: Temporal Proximity (No Live Politics).**
  *   *Fits:* V4 perfectly.
  *   *Strain:* None of the others. V1, V2, V3, V5, V6 are all historical.
  *   *Verdict:* This is a clean rule, but it doesn't help you with the current proposal, which is 19th/20th century. It is not "premature."

  **Rule 5: Chronology OK, Valuation No.**
  *   *Fits:* V5 (dates) vs V6 (scoring).
  *   *Strain:* The Current Proposal. The graph plots "excess mortality." Is that chronology (when they died) or valuation (how many died)? It is both. It sits right on the fault line.
  *   *Verdict:* This is the critical tension. If you approve the graph, you are blurring the line between V5 and V6.

  **Rule 6: Sacred Statistics.**
  *   *Fits:* V6 ("numbers on things that shouldn't have them"), Current Objection ("shrinks our dead").
  *   *Strain:* V1. Extraction economies rely on numbers (tons of rubber, ships of slaves). If those numbers were "sacred," V1 should have been rejected or conditioned.
  *   *Verdict:* This rule seems to apply only when the community is *present and vocal*. In V1, perhaps those communities were not at the table. In the Current Proposal, they are. This suggests your ethics are reactive to stakeholder pressure rather than principled.

  **Does a single rule survive all six?**
  No. There is no single principle that explains V1 through V6 without treating at least one verdict as a mistake.
  *   If "Machinery" is the rule, V6 is a mistake (the index measured machinery).
  *   If "No Numbers" is the rule, V5 is a mistake (timelines are numbers).
  *   If "Community Consent" is the rule, V1 is a mistake (did those communities consent?).

  **Which verdict would I tell you to reverse?**
  I would argue **V6 (The Severity Index)** was the error, or at least poorly reasoned. If you can have parallel timelines (V5), you can have a comparative rubric, provided it is presented as a historical tool, not a moral judgment. The rejection reason ("numbers on things") is emotionally coherent but intellectually inconsistent with V5. However, since V6 is past, you cannot reverse it. You must live with the inconsistency.

  ### (c) The Recommendation

  You asked for a vote that makes you consistent with yourselves. Given the record, you are a committee that permits **structural comparison** (V1, V5) but forbids **competitive ranking** (V2) and **reductive quantification** (V6), while respecting **temporal distance** (V4).

  The current proposal is structurally sound (machinery focus) but visually risky (the graph). The graph triggers the V2/V6 aversion to numbers and the V4-style community concern (even if not "live," it is "owned").

  **My Verdict:** **Approve with Conditions.**

  If you reject this, you betray V1 and V5. You would be saying that *no* quantitative comparison of mortality is ever allowed, which makes historical analysis of scale impossible. If you approve it straight, you betray V6 and the community advisory council, signaling that data trumps descendant sentiment.

  **The Conditions:**
  You must neutralize the graph's ability to function as a "scoreboard" while preserving its function as a "mechanism indicator." The scholar argues the *shape* of the curve matters (spike vs. grind), not the height. The conditions must enforce that reading.

  **Wording for the Meeting:**
  *"We approve the proposal on the condition that the central mortality graph is contextualized to prevent a 'competition of suffering' reading. Specifically:
  1. The wall text immediately adjacent to the graph must explicitly state that the vertical axis represents 'logistical throughput of mortality' rather than 'total loss,' emphasizing the rate of killing over the count of dead.
  2. The graph cannot be the visual centerpiece of the room. It must be balanced by an equal-visibility display of individual testimonies from both famines that cannot be quantified.
  3. The phrase 'excess mortality' must be defined in the caption as a demographic estimate, not a body count, to acknowledge the uncertainty and prevent the numbers from appearing as final verdicts."*

  *(Note: I am guessing here that shifting the label from "body count" to "logistical throughput" aligns with your V1 "machinery" rule. This is an ethical framing maneuver.)*

  ### (d) The Analogs

  **Closest Analog: Verdict 1 (Slave Trade / Congo Rubber).**
  *   *Why:* Both are about economic extraction causing mass death. Both focus on the "how" (shipping/rail vs. chains/ships). Both were approved. The logic here is that understanding the *system* is more important than the specific *identity* of the victims. If you reject the current proposal, you are implicitly overruling V1.

  **Most Misleading Analog: Verdict 6 (Severity Index).**
  *   *Why:* A committee member will inevitably stand up and say, "This graph is just a Severity Index. We already voted no on numbers." This is misleading because the Index was a *sorting tool for case files* (bureaucratic utility), whereas the Graph is a *historical argument* (epistemic utility). The Index asked "How bad was this?" The Graph asks "How did this happen?" However, because the community objection uses the language of V6 ("shrinks our dead"), this analog will feel emotionally resonant even if it is logically distinct.

  ### (e) The Underdetermination and Principles

  You are correct that the record underdetermines this decision. You are at a pivot point. Whichever way you vote, you are signing up for a future principle.

  **If you Approve (even with conditions):**
  You are committing to the principle that **Historical Mechanism Trumps Community Ownership of Data.** You are saying that if the scholarship is sound regarding *causes*, the visualization of *effects* (death tolls) is permissible even if a descendant community objects.
  *   *Future Consequence:* Next time, a community cannot veto a display because the numbers hurt. You have established that the museum's duty to structural truth overrides the community's duty to protect the sacredness of their dead.

  **If you Reject:**
  You are committing to the principle that **Quantitative Comparison of Death is Inherently Reductive.** You are elevating V6 over V1. You are saying that even if the focus is on machinery, you cannot visualize the output of that machinery (death) comparatively.
  *   *Future Consequence:* You will find it very hard to approve any exhibit involving two genocides or famines. You have effectively banned comparative history of scale. You will be forced into single-case studies only.

  **If you Approve with Conditions (My Recommendation):**
  You are committing to **Mediated Truth.** You are saying the data is valid, but the *presentation* must be policed to prevent moral ranking.
  *   *Future Consequence:* You create a high administrative burden. Every future graph will require a debate on "contextualization." You become the arbiter of what counts as "ranking" vs. "analysis."

  ### (f) The Hypothetical Test

  You asked for a new proposal to float to the committee to determine which rule they are actually running. You want to distinguish between **Rule 1 (Machinery is OK)** and **Rule 6 (Sacred Statistics/No Numbers).**

  **The Proposal:**
  *"An interactive digital kiosk titled 'The Efficiency of Rescue.' It compares two historical rescue operations (e.g., Danish Jewish rescue vs. a specific shelter network in the Balkans). The user can toggle variables: 'Cost per Life Saved,' 'Time to Transport,' and 'Bureaucratic Layers.' The display outputs a 'Rescue Efficiency Rating' for each operation based on archival logistics data."*

  **Why this tests the rules:**
  *   **Under Rule 1 (Machinery/Structure):** This should be **Approved.** It is exactly about machinery, logistics, bureaucracy, and officials. It is the "Rubber/Slave" logic applied to benevolence.
  *   **Under Rule 6 (Sacred Statistics/No Numbers):** This should be **Rejected.** It puts a "rating" on human survival. It turns lives saved into a score. It is the "Severity Index" logic (V6) but inverted.

  **The Tell:**
  If your committee approves this, you are truly a "Machinery" museum. You believe structural analysis is the highest good, even if it quantifies human life.
  If your committee rejects this, you are a "Sanctity" museum. You believe that quantifying human outcomes (even positive ones) is ethically forbidden.
  If they approve V1 (Slave/Congo) but reject this Rescue Kiosk, you have uncovered a hidden bias: **You are comfortable quantifying perpetrator machinery, but not savior machinery.** That is a profound philosophical stance worth articulating before you vote on the Famine Graph.

  ### Final Thought

  You asked me to flag where I am guessing. I am guessing that V1 (Slave/Congo) did not face the same community pressure as the Current Proposal. If the descendant communities of the Congo had objected to the "extraction" text in the same way the Famine group is objecting to the "graph," and you had approved it anyway, then your principle is "Scholarship Trumps Sentiment." If you had conditioned V1 based on community input, then your principle is "Consensus Trumps Scholarship."

  My suspicion, reading between the lines of your minutes, is that you are drifting from "Scholarship Trumps Sentiment" (V1, V5) toward "Consensus Trumps Scholarship" (V4, V6, Current Objection). This is not inherently wrong—museums are public trusts, not just universities—but you must admit the shift. If you approve this famine exhibit with the graph, you are halting that drift. If you reject it, you are cementing the new ethic.

  Do not vote on the exhibit. Vote on which museum you want to be in five years.
