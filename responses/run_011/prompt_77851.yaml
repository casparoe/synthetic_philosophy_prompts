      *   Actually, (3) is the most purely Arendtian. (1) is the most "user interpretation." If I tell them (1) is problematic, they might defend it. But the tension between (3) and (8) is the theoretical knot. I will predict they push back on my suggested resolution of (3)/(8).
      *   Wait, I need to pick a *point* from their list. I am least sure about the coherence of (6) with (5). I expect them to push back on my critique of (6) because they see it as the *solution*, not the problem.
      *   Actually, looking closer at (1): "veracity has never really counted as a political virtue." Arendt might agree, but she also says the truth-teller is like a martyr.
