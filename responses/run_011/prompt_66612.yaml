          4.  *Exaptation (Insulation $\rightarrow$ Flight):* Bio: Old history vs. new use. Soc: Latent becomes Manifest? Or Functional Alternative?
      *   *User's Case (Permit Meetings):*
          *   Informal, persists 40 years, shortens time, clerks say "coping."
          *   *Etiological View:* It has a function (efficiency) because it persisted via a selection-like process (offices that didn't do this failed/collapsed?).
          *   *Causal-Role View:* It has a function (capacity to process permits) regardless of history.
