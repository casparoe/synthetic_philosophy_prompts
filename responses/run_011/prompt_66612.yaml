          *   *The Real Divide:* The user suspects the lineage issue dissolves because sociology stipulates units.
          *   *Correction:* The lineage issue doesn't dissolve; it highlights that sociology often lacks a *mechanism of persistence* distinct from *current utility*. Biology forces a split between "why it's here" (history) and "what it does" (current). Sociology often conflates them or assumes intention bridges the gap.
          *   *Verdict:* The hypothesis is half-right (agents deleted) but wrong about the lineage problem dissolving. The lineage problem exposes that sociology often lacks a rigorous theory of *institutional selection* independent of *actor intention*.

  6.  **Drafting the Response (Iterative Refinement):**

      *   *Tone:* Professional, peer-to-peer, rigorous, slightly critical but respectful.
      *   *Check Constraints:* No citations. Don't explain Merton/Elster back to them. Be blunt about translation failures.
