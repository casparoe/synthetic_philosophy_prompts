  2.  **Deconstruct the Frameworks:**

      *   **Biology (The Source):**
          *   *Etiological/Selected Effects (Wright, Millikan, Neander):* Function is what the trait was *selected for*. History matters. Malfunction is possible (trait exists but doesn't do the thing).
          *   *Causal Role (Cummins):* Function is what the trait *does* contribute to the capacity of the containing system. Interest-relative. No history needed.
          *   *Key Tension:* Normativity (ought) vs. Description (is). History vs. Current Capacity.
      *   **Sociology (The Target):**
          *   *Merton:* Manifest (intended/recognized) vs. Latent (unintended/unrecognized). Functional for *which unit*? Dysfunctions exist.
          *   *Elster:* Functional explanations need a feedback loop (selection or intention). Consequences explain persistence.
      *   **The Gap:** Biology deals with natural selection (blind, historical, lineage-based). Sociology deals with human action (intentional, institutional, often stipulated units).

  3.  **Part 1: Candidate Mappings (Brainstorming & Filtering):**

      *   *Proper Function (Millikan/Neander) $\rightarrow$ Manifest Function?*
          *   *Trap:* Manifest requires intention/recognition. Proper function requires history/selection. A heart pumps without intending to.
