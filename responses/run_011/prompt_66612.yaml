      *   *System/Unit:*
          *   *Biology:* Organism/Species (fixed by nature).
          *   *Sociology:* Aggregate/Institution (fixed by stipulation/researcher).
          *   *Verdict:* Major friction point.

  4.  **Part 2: The Translation (The Core Debate):**

      *   *The Debate:* Etiological (History) vs. Causal-Role (Current Capacity).
      *   *Mertonian/Elsterian Translation:*
          *   Etiological = Elsterian Selection Mechanism (Persistence explained by past consequences).
          *   Causal-Role = Mertonian Latent Function (Current contribution to system capacity, regardless of origin).
      *   *Standard Cases:*
          1.  *Malfunctioning Heart:* Bio: Function exists (history), effect fails. Soc: If it doesn't contribute, is it a function? Merton says no function if no effect. Elster says function claim invalid if loop broken. *Translation Cost:* Sociology struggles with "function without current effect."
