answer: |-
  **Project Title:** Fracturing the Induction: A Taxonomic Analysis of Theoretical Retention and the Pessimistic Meta-Induction

  **Project Summary**
  This project proposes a eight-week investigation into the Pessimistic Meta-Induction (PMI). Standard formulations of the PMI rely on a binary classification of past theories: they are either successful or they are false. This project challenges that binary by constructing a fine-grained taxonomy of theory change—distinguishing between outright elimination, demotion to limiting cases, structural preservation, and reinterpretation. The aim is to produce a paper arguing that the inductive force of the PMI dissolves when the reference class of 'past theories' is disaggregated according to these distinct fates. Crucially, the project will not merely apply this taxonomy but will critically evaluate whether the act of taxonomy itself presupposes the realism it seeks to defend.

  **The Research Question**
  *Does disaggregating the historical record of theory change into distinct modes of retention and elimination invalidate the uniform application of the Pessimistic Meta-Induction, or does the classification required to do so beg the question against the anti-realist?*

  This question is answerable within the timeframe because it does not require settling the realism debate outright. Instead, it targets the logical machinery of the PMI itself. It asks whether the induction is statistically sound when applied to a heterogeneous set, and whether the heterogeneity can be identified without circularity.

  **Why Existing Positions Do Not Settle This**
  Current literature treats the taxonomy of theory change as a premise rather than a problem. Selective realists (e.g., structural realists) argue that *some* parts of past theories survive, implying the PMI is too coarse. Anti-realists counter that survival is rare or irrelevant to truth. However, both sides assume we can neutrally identify what 'survived'.

  They do not address the meta-methodological issue: is sorting a past posit into 'preserved structure' rather than 'false ontology' a neutral historical description, or is it a realist reconstruction dressed up as bookkeeping? If the criteria for 'preservation' are theory-laden, the anti-realist can reject the taxonomy as rigged. This project moves the debate from *whether* things survive to *how we decide* they have survived, and whether that decision rule is available to the anti-realist.

  **Methodology and Work Plan**

  *   **Weeks 1–2: Literature and Case Selection**
      *   Review standard PMI formulations (Laudan, Lewis) and selective realist responses (Psillos, Worrall).
      *   Select three canonical case studies widely discussed in the literature to minimise historical groundwork (e.g., the Fresnel-Maxwell transition, the Caloric theory of heat, and the Phlogiston theory).
      *   *Deliverable:* Annotated bibliography and case study protocol.

  *   **Weeks 3–4: Constructing the Taxonomy**
      *   Develop a coding schema for theory change. Categories will include: *Ontological Elimination* (the entity does not exist), *Limiting Case* (the maths works only at limits), *Structural Continuity* (equations remain, interpretation changes), and *Conceptual Reinterpretation*.
      *   Define necessary and sufficient conditions for each category to ensure they are not overlapping or vague.
      *   *Deliverable:* A draft framework for the 'Modes of Theoretical Fate'.

  *   **Weeks 5–6: Application and Testing**
      *   Apply the taxonomy to the selected case studies.
      *   Analyse whether the PMI holds within each specific sub-category. For instance, does the induction hold for 'Ontological Elimination' cases even if it fails for 'Structural Continuity' cases?
      *   *Deliverable:* Draft analysis of the three cases.

  *   **Week 7: The Reference Class Objection (Critical Phase)**
      *   Address the core methodological risk: Does creating this taxonomy require a prior commitment to realism?
      *   Test the taxonomy against an anti-realist reading of the same cases. If an anti-realist would code 'Structural Continuity' as 'Coincidental Mathematical Similarity', the taxonomy is not neutral.
      *   *Deliverable:* A robust section addressing the circularity objection.

  *   **Week 8: Synthesis and Writing**
      *   Compile findings into a single paper (approx. 8,000 words).
      *   Ensure the conclusion clearly states whether the PMI is broken by heterogeneity or merely displaced by the taxonomy problem.
      *   *Deliverable:* Final manuscript ready for submission.

  **Addressing the Reference Class Problem**
  This project acknowledges that drawing the taxonomy risks rigging the reference class. If I classify the retention of Maxwell's equations from the ether theory as 'structural preservation', I am implicitly granting that structures are the kind of things that can be true. An anti-realist might classify this as 'useful fiction retention'.

  I will handle this head-on in Week 7. I will not claim the taxonomy is neutral. Instead, I will argue that the PMI *requires* a specific granularity to function. If the anti-realist insists on the coarse 'true/false' binary, they must justify why distinct modes of succession are irrelevant to the induction. If they accept the granularity, they must accept that the induction weakens. The project fails only if it turns out that *no* description of theory change is possible that both parties can accept as a baseline for the induction. I will treat the impossibility of a neutral taxonomy as a substantive philosophical result, not a methodological error.

  **Failure Conditions and Scope Management**
  *   **Inconclusive Result:** The historical cases are too messy to fit the taxonomy cleanly. This is an acceptable outcome; the paper will argue that the messiness itself undermines the PMI's reliance on clean historical data.
  *   **Project Failure:** The project fails if I cannot define the taxonomy categories without explicit reference to truth (e.g., defining 'preservation' as 'retention of truth-tracking elements'). If the coding schema is demonstrably circular by Week 6, the project cannot proceed as planned.
  *   **Scope Cutting:** If eight weeks proves overambitious, I will reduce the case studies from three to two (focusing on Fresnel-Maxwell and Caloric). I will also limit the historical analysis to secondary philosophical literature rather than primary historical texts, ensuring the focus remains on the philosophical argument rather than historical exegesis.

  **Outcome**
  The final paper will offer a novel critique of the PMI. Rather than arguing that current theories are likely true, it will argue that the historical argument for their falsehood is ill-formed. By exposing the heterogeneity of theoretical fate and the non-neutrality of its classification, the project aims to shift the burden of proof back onto the pessimist to justify their reference class.
