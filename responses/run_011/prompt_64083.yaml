answer: |-
  There is no single canonical term in the literature that captures this phenomenon without carrying the baggage you explicitly wish to avoid. The mechanism you describe is the ontological engine underlying "performativity," but your exclusion of the economic sociology thesis is correct: that literature focuses on how *theory* shapes *markets*, whereas you are asking about how *descriptive levels* shape *reality* across institutional, psychological, and technical domains.

  The closest precise label is **Stance-Induced Stabilization**.

  Where "performativity" describes the *action* of a theory bringing about its own truth, and "looping effects" describe the *feedback* between classification and classified persons, **Stance-Induced Stabilization** names the specific ontological transition where a descriptive level acquires causal grip on the world, thereby satisfying the criteria for a "Real Pattern" through the very act of its adoption.

  Here is the carving you requested: what it is, what it is not, how it relates to Dennett, and the line between transient and robust patterns.

  ### 1. The Concept: Stance-Induced Stabilization

  **Definition:** A pattern is stance-induced stabilized when the adoption of a predictive stance (a vocabulary, model, or classification) alters the causal dynamics of the target system such that the pattern becomes predictively robust, even if it was not robust prior to adoption.

  **Boundary Conditions (What it excludes):**
  *   **Not Self-Fulfilling Prophecy (SFP):** SFP concerns a specific *event* predicted by a belief (e.g., "The bank will fail" causes the bank to fail). Stance-Induced Stabilization concerns the *reality of a category or level of description* (e.g., "The Bank has intentions" becomes a true description of the Bank's operational logic). SFP is about outcomes; this is about ontology.
  *   **Not Hacking's Looping Effects:** Looping effects require the *classified entity* to be aware of the classification and change behavior accordingly (human kinds). Your Case 1 (Central Bank) and Case 3 (Customer Segments) function without the classified entity knowing it is being classified. This is a one-way causal imposition, not a reflexive loop.
  *   **Not Searle's Institutional Facts:** Searle requires *collective intentionality* ("We accept X as Y"). In your cases, no declaration is needed. Traders simply *use* the shorthand; engineers simply *wire* the segments. The reality emerges from operational utility, not collective agreement.
  *   **Not Economic Performativity:** As you noted, that thesis binds the phenomenon to economic theory shaping markets. Stance-Induced Stabilization applies to psychology, engineering, and bureaucracy where no "theory" is present, only a descriptive heuristic.

  ### 2. Does This Threaten Dennett?

  **No.** It does not threaten the argument of "Real Patterns"; it clarifies the genealogy of patterns Dennett already acknowledged.

  Dennett's criterion for a Real Pattern is ahistorical. He argues that a pattern is real if it supports prediction and compression *now*, regardless of how it got there. Whether a pattern existed "in the wild" before we looked, or whether we built the scaffold that allowed it to cohere, is irrelevant to its current status as a Real Pattern. If the intentional stance yields predictive compression, the intentions are real.

  Dennett explicitly anticipates this in *The Intentional Stance* regarding human development. He suggests we become intentional systems largely because we are *treated* as such by our caregivers. We are "healed" into rationality by the expectations of others. Your wrinkle is simply the generalization of this socialization process to institutions and algorithms.

  **The Crucial Nuance:**
  Dennett distinguishes between the *stance* (the tool) and the *system* (the object). Your worry is that if the stance creates the system, the distinction collapses. It does not, provided you distinguish between **origin** and **maintenance**.
  *   **Origin:** The pattern may be stance-dependent (it wouldn't exist without the description).
  *   **Maintenance:** The pattern may become stance-independent (it persists even if the description is abandoned).

  Dennett's realism holds as long as the pattern is maintainable. If the pattern dissolves the moment you stop using the stance, it was a "parasitic pattern" (useful only while the parasite feeds). If the pattern persists after the stance is withdrawn, it has achieved **Ontological Crystallization**.

  ### 3. The Line: Crystallized vs. Sustained Patterns

  To draw the line you need, we must distinguish between patterns that are **Coordinatively Sustained** and those that are **Infrastructurally Crystallized**.

  **Coordinatively Sustained Patterns:**
  These patterns exist only as long as the agents continue to use the vocabulary to coordinate. The "reality" is in the communication, not the physical constraints. If the stance is withdrawn, the behavior reverts to noise because the coordination mechanism is gone.
  *   *Mechanism:* Social expectation and linguistic coordination.
  *   *Fate:* Decays without the stance.

  **Infrastructurally Crystallized Patterns:**
  These patterns begin as a descriptive stance but result in physical, digital, or structural changes (pricing queues, intervention protocols, hiring pipelines). The description builds a scaffold. Once the scaffold is built, the pattern holds even if the original describers leave or stop using the vocabulary. The "reality" has been offloaded into the environment.
  *   *Mechanism:* Structural constraint and selection pressure.
  *   *Fate:* Persists without the stance.

  ### 4. Classifying Your Cases

  **Case 1: The Central Bank (Infrastructurally Crystallized)**
  *   **Analysis:** Initially, the "intention" was a trader myth. However, by acting on this belief (selling/buying at the trigger level), traders created a market condition where the Bank *had* to intervene to maintain stability. The Bank's internal protocols likely adapted to this external pressure over time.
  *   **Verdict:** Even if traders stopped using the shorthand tomorrow, the Bank would likely still intervene at that equity level because the *structural fragility* at that level is now real. The pattern has crystallized into institutional policy and market structure.
  *   **Status:** Real Pattern (Stance-Independent Maintenance).

  **Case 2: The HR Assessment (Coordinatively Sustained)**
  *   **Analysis:** The types work because colleagues use the vocabulary to manage expectations ("she needs closure"). This is a coordination game. If HR bans the vocabulary, or if new staff are not socialized into it, the predictive power vanishes. There is no physical constraint forcing the behavior, only social normativity.
  *   **Verdict:** The pattern is real only while the stance is active. It is a "useful fiction" that functions as a reality only through continuous reinforcement.
  *   **Status:** Real Pattern (Stance-Dependent Maintenance). *Note: Dennett would still call this real while it lasts, but it is fragile.*

  **Case 3: The Customer Segments (Infrastructurally Crystallized)**
  *   **Analysis:** This is the strongest case. The segments were fake, but the company built *pricing, packaging, and support queues* around them. These are hard constraints. A customer is now *actually* in a different support queue because of the segment. Even if the analytics team is fired and the model deleted, the customers remain in their respective queues until someone actively dismantles the infrastructure.
  *   **Verdict:** The description built a cage that now holds the reality. The pattern survives the death of the describer.
  *   **Status:** Real Pattern (Stance-Independent Maintenance).

  ### 5. Summary of the Distinction

  The boundary you are looking for lies in **where the causal weight is stored**.

  *   If the causal weight is stored in the **beliefs and expectations of the observers** (Case 2), the pattern is **Coordinatively Sustained**. It is a Real Pattern, but it is fragile and stance-dependent for maintenance.
  *   If the causal weight is stored in the **constraints and structures of the observed** (Cases 1 and 3), the pattern is **Infrastructurally Crystallized**. It is a Real Pattern that has achieved stance-independence.

  **Does Case 3 make the distinction collapse?**
  No. Case 3 proves the distinction is vital. It shows that "fake" categories can become "real" categories not by magic, but by **engineering**. The "wrinkle" is not a threat to realism; it is a description of how social and technical realities are manufactured.

  **Final Terminology Recommendation:**
  Use **Stance-Induced Stabilization** to describe the phenomenon generally. Use **Infrastructural Crystallization** to describe the subset of cases (like 1 and 3) where the pattern survives the withdrawal of the stance. This allows you to acknowledge the performative origin without conceding that the resulting pattern is merely "subjective" or "socially constructed" in the weak sense. The pattern is as real as the infrastructure that sustains it.
