  # Diagnostic Decision Tree: The Norms of Assertion

  This tree is designed to navigate the logical space of assertion norms without relying on theoretical labels. It prioritizes separating the **Standard** (what rule is in play) from the **Target** (whether the rule judges the *act* or the *agent*). There are 12 branch questions. The required leaves appear at the termination points.

  ### The Branch Questions

  **Q1. The Stakes Case**
  *Case:* Consider two scenarios. In **Low Stakes**, a friend asks casually where the nearest gas station is; you have ordinary evidence (you drove past one an hour ago). In **High Stakes**, your friend is rushing a critically ill patient to the hospital and asks the same question; your evidence is identical.
  *Question:* Is the assertion *proper* in the Low Stakes case but *improper* in the High Stakes case, solely due to the change in stakes?
  *   **Yes:** Go to **Leaf A (Contextualism)**.
  *   **No:** Go to Q2.

  **Q2. The Constitutive Case**
  *Case:* Imagine a speaker asserts $p$, has excellent evidence for $p$, $p$ is true, and the stakes are low. However, there is no rule of language or social practice that *forbids* asserting $p$ without knowledge; there are only moral or prudential reasons to be careful.
  *Question:* Is the assertion *defective as an assertion* (like a move in a game that breaks the rules), or is it merely *risky* (like a move that might lose you money)?
  *   **Merely Risky (No Constitutive Rule):** Go to **Leaf B (No Constitutive Norm)**.
  *   **Defective (Constitutive Rule Exists):** Go to Q3.

  **Q3. The Lucky Truth Case**
  *Case:* A speaker asserts $p$. $p$ is **true**. The speaker has **no evidence** (they guessed blindly), and they do **not know** $p$.
  *Question:* Is the assertion **proper** (correct) solely because $p$ is true?
  *   **Yes:** Go to Q4.
  *   **No:** Go to Q5.

  **Q4. The Truth/Agent Separator (Act/Agent Separator 1)**
  *Case:* (Same as Q3: True, No Evidence, No Knowledge). We established the assertion is *proper* because it is true.
  *Question:* Is the speaker **blameworthy** for asserting something they had no evidence for?
  *   **No (Act OK, Agent OK):** Go to **Leaf C (Truth Norm)**.
  *   **Yes (Act OK, Agent Blameworthy):** Go to **Leaf U1 (Unoccupied)**.

  **Q5. The Lottery Case**
  *Case:* A speaker asserts, "Your ticket lost," based *only* on the extremely high statistical probability (1 in a million) of losing. They do not know the result. The proposition is **true**.
  *Question:* Is this assertion **improper** (something went wrong), even though it is true and statistically likely?
  *   **No (Proper):** Go to Q6.
  *   **Yes (Improper):** Go to Q7.

  **Q6. The Justified/Act Separator (Act/Agent Separator 2)**
  *Case:* (Same as Q5: Lottery, True, High Probability). We established the assertion is *proper*.
  *Question:* If the speaker had asserted a **false** lottery proposition with the same statistical evidence, would the assertion have been **improper**?
  *   **No (Justification suffices for propriety even if false):** Go to **Leaf D (Justified/Reasonable-Belief Norm)**.
  *   **Yes (Truth still required for propriety):** Go to **Leaf U2 (Unoccupied)**.

  **Q7. The Certainty Case**
  *Case:* A speaker asserts $p$. They have **excellent evidence** (99.9% probability) and $p$ is **true**, but they admit they are not **absolutely certain** (there is a 0.1% chance of error).
  *Question:* Is the assertion **improper** because they lacked absolute certainty?
  *   **Yes:** Go to **Leaf E (Certainty Norm)**.
  *   **No:** Go to Q8.

  **Q8. The False-but-Justified Act Case (Act/Agent Separator 3)**
  *Case:* A speaker asserts $p$. They have **excellent evidence** (justified), but $p$ turns out to be **false** (unlucky).
  *Question:* Is the **assertion itself** defective (a bad move), even though the speaker was reasonable?
  *   **No (The assertion was proper):** Go to **Leaf D (Justified/Reasonable-Belief Norm)**. *(Note: Converges with Q6 path)*.
  *   **Yes (The assertion was improper):** Go to Q9.

  **Q9. The False-but-Justified Agent Case**
  *Case:* (Same as Q8: False, Excellent Evidence). We established the *assertion* was improper.
  *Question:* Is the **speaker blameworthy** for making this improper assertion?
  *   **No (Speaker is excused):** Go to Q10.
  *   **Yes (Speaker is blameworthy):** Go to **Leaf F (Knowledge Norm)**.

  **Q10. The Retraction Case**
  *Case:* (Same as Q8/Q9: False, Excellent Evidence, Speaker Blameless). The speaker later learns $p$ was false.
  *Question:* Does the speaker owe a **retraction** (e.g., "I shouldn't have said that") or merely an **apology** (e.g., "I'm sorry I was misled")?
  *   **Retraction (Admitting the act was wrong):** Go to **Leaf G (Excuse View)**.
  *   **Apology Only (Admitting only unfortunate outcome):** Go to **Leaf U3 (Unoccupied)**.

  **Q11. The Belief Case**
  *Case:* A speaker asserts $p$. They have **good grounds** for $p$, and $p$ is **true**. However, the speaker **does not believe** $p$ (they think it is false, but assert it to test the theory).
  *Question:* Is this assertion **improper** specifically because of the lack of belief?
  *   **Yes:** Go to **Leaf F (Knowledge Norm)**. *(Note: Knowledge implies belief)*.
  *   **No:** Go to **Leaf U4 (Unoccupied)**.

  **Q12. The True-Unknown Case**
  *Case:* A speaker asserts $p$. $p$ is **true** and **well-evidenced**, but the speaker is in a Gettier situation (they do not **know** $p$).
  *Question:* Upon learning they didn't *know* (only had justified true belief), should they say "I was wrong to assert" or "I was entitled to assert"?
  *   **Entitled:** Go to **Leaf D (Justified/Reasonable-Belief Norm)**.
  *   **Wrong:** Go to **Leaf F (Knowledge Norm)**.

  ---

  ### The Leaves

  *   **Leaf A: Contextualism about Assertion.** (Reached via Q1-Yes). The standard shifts with context.
  *   **Leaf B: No Constitutive Norm.** (Reached via Q2-Merely Risky). Assertion is governed only by moral/prudential norms, not constitutive rules.
  *   **Leaf C: Truth Norm.** (Reached via Q3-Yes, Q4-No). Truth is sufficient for propriety and non-blameworthiness.
  *   **Leaf D: Justified/Reasonable-Belief Norm.** (Reached via Q5-No/Q6-No, or Q8-No, or Q12-Entitled). Justification is sufficient for the *propriety of the act*.
  *   **Leaf E: Certainty Norm.** (Reached via Q7-Yes). Absolute certainty is required for propriety.
  *   **Leaf F: Knowledge Norm.** (Reached via Q5-Yes/Q7-No/Q9-Yes, or Q11-Yes, or Q12-Wrong). Knowledge is required for propriety, and lack of knowledge renders the agent blameworthy (unless excused, but here they are not).
  *   **Leaf G: Excuse View.** (Reached via Q5-Yes/Q7-No/Q8-Yes/Q9-No/Q10-Retraction). Knowledge is required for propriety (Act is improper without it), but Justification renders the Agent blameless.
  *   **Leaf U1: Unoccupied (Truth-Act / Blame-Agent).** (Reached via Q4-Yes). *Status:* **Unattractive.** It is incoherent to say an act is fully proper yet the agent is blameworthy for performing it without further defeaters.
  *   **Leaf U2: Unoccupied (Justified-Act / Truth-Dependent).** (Reached via Q6-Yes). *Status:* **Incoherent.** If justification makes the act proper (Q5-No), truth shouldn't retroactively make it improper if false.
  *   **Leaf U3: Unoccupied (Excuse / No Retraction).** (Reached via Q10-Apology). *Status:* **Undeveloped.** If the act was improper (Q8-Yes) but the agent excused (Q9-No), standard practice requires retracting the content while maintaining standing.
  *   **Leaf U4: Unoccupied (No Belief Norm).** (Reached via Q11-No). *Status:* **Unattractive.** Asserting what one takes to be false is generally viewed as a violation of sincerity, which most norms subsume.

  ---

  ### Diagnostic Flags and Limitations

  **1. Indistinguishable Leaves:**
  *   **Leaf F (Knowledge Norm) vs. Leaf G (Excuse View):** These are separated *only* by Q9 (Blame) and Q10 (Retraction). If a respondent answers inconsistently on blame (e.g., "The act is wrong, but I wouldn't blame them, yet they should retract"), they may oscillate between these leaves. The tree forces a choice, but in practice, these views are often rhetorically merged.
  *   **Leaf C (Truth Norm) vs. Leaf B (No Norm):** If a respondent believes truth is the *only* norm, they may answer Q2 as "No Constitutive Rule" (because truth is external to the act) but Q3 as "Proper." The tree places them at C, but they may conceptually belong to B.

  **2. Order Dependency:**
  *   **Q1 (Stakes) vs. Q3 (Truth):** If Q3 is asked before Q1, a Contextualist might answer "Truth is sufficient" (thinking of Low Stakes) and be misdiagnosed as a Truth Norm theorist (Leaf C). The tree prioritizes Q1 to filter Contextualists first.
  *   **Q5 (Lottery) vs. Q7 (Certainty):** If Q7 is asked before Q5, a Certainty Norm theorist might reject the Lottery assertion for lack of certainty, appearing to hold the Knowledge Norm. The tree assumes Certainty is a stricter subset of Knowledge; if they fail Q7, they default to Knowledge/Excuse paths.

  **3. The "Excuse View" Definition:**
  *   The prompt defines the Excuse View as "one should assert what one reasonably believes." However, standard philosophical usage (e.g., Williamson vs. Brown) distinguishes the **Justified Belief Norm** (Justification makes the act *correct*) from the **Excuse View** (Justification makes the agent *blameless* despite the act being *incorrect*). This tree adopts the standard philosophical distinction to ensure Leaf D and Leaf G are separable. If a respondent holds the prompt's definition literally (Justification makes it both correct *and* blameless), they will land on **Leaf D**, not Leaf G.

  **4. Unoccupied Space:**
  *   **Leaf U1** highlights the tension between Act and Agent norms. Many respondents intuitively want to say "The assertion was fine (True), but you were reckless (Blameworthy)." This tree marks that combination as Unoccupied/Unattractive to force the respondent to clarify whether the recklessness renders the *act* defective (moving them to Knowledge/Excuse views) or not (Truth Norm).
