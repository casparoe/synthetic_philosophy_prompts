answer: |-
  ## The Diagnosis of Stuckness

  The deadlock you face is not a failure of philosophical rigor but a structural feature of the concept itself. The literature is stuck because "disease" is a hybrid concept attempting to bridge the is-ought gap, and your committee is stuck because you are asking a single definitional clause to perform incompatible institutional functions. The disagreement is not merely verbal, nor is it purely substantive. It is best diagnosed as a **mixed** disagreement, primarily driven by **different questions under one label**. The naturalists are answering the question, "What is the biological basis for intervention?" while the normativists are answering, "What is the moral basis for entitlement?" When both parties insist they are defining the same word, they talk past each other. When they acknowledge they are optimizing for different institutional goals, the conflict shifts from metaphysics to policy design.

  The substantive core of the disagreement is normative, not factual. Both sides generally agree on the biological facts of a case (e.g., blood pressure levels, genetic variants). They disagree on whether those facts constitute a "disease" in the absence of felt harm or social disvaluation. Consequently, the two sides differ fundamentally about which cases count as data. Naturalists treat clinical pathology and species-typical function as the primary data, viewing patient testimony as secondary evidence of harm. Normativists treat patient harm and social disadvantage as the primary data, viewing biological function as merely one possible mechanism of that harm. Because they prioritize different data sources, they would fail to converge even given perfect biological information. The hidden empirical question—whether competent usage tracks biological facts or institutional practice—is ill-posed because competent usage itself fluctuates depending on context. In a research lab, "disease" tracks biology; in a courtroom, it tracks liability; in your committee, it tracks coverage.

  Your working hypothesis that "disease" is being asked to do two jobs at once is robust and survives philosophical scrutiny. The **classificatory job** requires stability, objectivity, and mapping to codes; this is optimized by naturalist accounts. The **entitlement job** requires sensitivity to harm, need, and justice; this is optimized by normativist accounts. The disputes over extension are indeed proxy fights about which job the word should serve. The symmetry of the signature refutations confirms this. The naturalist objection to normativism (drapetomania) guards against the corruption of the classificatory job by political whims. The normativist objection to naturalism (statistical abnormality without harm) guards against the failure of the entitlement job to address actual suffering. This symmetry does not undercut both sides equally; rather, it indicates that each side is correctly identifying the failure mode of the other's preferred job. Naturalism fails at entitlement; normativism fails at classification.

  Testing this against your hot-button cases reveals the divergence clearly. Asymptomatic hypertension and BRCA1 variants are classified as diseases by naturalists (biological deviation) but remain indeterminate for strict normativists (no current harm). Treated PKU shows the reverse: naturalists see ongoing dysfunction, while normativists may see no disease because the harm is neutralized. Infertility highlights the role of social norms in defining function; naturalists struggle with age-relative functions, while normativists easily distinguish the 28-year-old from the 62-year-old based on life goals. Prolonged grief disorder shows the contestability of the threshold itself. Male-pattern baldness is the clearest divider: naturalists exclude it as statistically normal function, while normativists might include it if distress is severe. Drapetomania reveals that naturalists also require a social gate to define "species-typical function," proving that pure value-freedom is impossible. In most of these cases, the theories do not genuinely disagree about the biology; they disagree about whether the biology mandates coverage.

  Progress in this debate will not come from empirical studies of usage or formal logical results. Clinician judgment is already a sediment of these conflicting pressures. A study of usage would only confirm that the word is used differently in different contexts. Progress requires a **reframing** of the question. You must stop trying to define "disease" ontologically and start defining "Covered Condition" stipulatively. The goal is not to discover the truth of disease but to construct a rule that minimizes administrative friction while maximizing equitable access. This distinction would persuade the advocacy faction by decoupling coverage from metaphysical status, but it might alarm the actuarial faction if it seems to open the door to unlimited discretion. Abandonment of the search for a single definition is the only viable path, but it must be framed as a pragmatic choice, not a philosophical surrender.

  Therefore, the clause should not attempt to settle the philosophy. It should refuse to define "disease" in the abstract. Instead, it should define eligibility conditionally. A defensible clause states that a condition is covered if it is recognized by current clinical guidelines as requiring intervention to prevent harm or restore function, and is associated with a valid diagnosis code. This links the naturalist need for coding with the normativist need for harm prevention without claiming that the code *is* the disease. It acknowledges that coverage is a policy decision, not a biological discovery. By refusing to say what disease *is*, you avoid the trap of having to defend why a code list is value-free. You simply assert that for the purposes of this contract, these codes trigger these benefits. This moves the debate from "Is this real?" to "Is this covered?", which is the only question your insurer actually needs to answer.

