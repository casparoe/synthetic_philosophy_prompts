          *   *Feasibility:* $25k can run town halls or focus groups.
          *   *Impact:* Medium. Changes political cover, not necessarily jail operations.

      *   **Fourth Priority:** *Coercion (Voluntary vs. Mandated).*
          *   *Why:* Important ethically, but legally constrained. Parole conditions are often statutory. Hard for a county panel to change state parole laws.
          *   *Feasibility:* Low. Requires legal expertise beyond laypeople.
          *   *Impact:* Low locally.

