  4.  **Develop the Ordering & Reasoning:**

      *   **Top Priority:** *Sequence (Conditions vs. Length).*
          *   *Why:* This is the most actionable policy lever for a county. Commissioners control funding and sentencing guidelines (indirectly via DA/court pressure). Sheriff controls conditions. If you improve conditions without addressing length, you just make a comfortable cage. If you shorten length without conditions, you release people into chaos. This determines the *scope* of every other decision.
          *   *Feasibility:* Laypeople can analyze local data (average stay, pretrial vs. sentenced).
          *   *Impact:* High. Changes budget and policy.

      *   **Second Priority:** *Measurement (Recidivism).*
