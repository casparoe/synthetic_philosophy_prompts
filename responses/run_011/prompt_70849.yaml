answer: |-
  Your hypothesis is astute, but it identifies only the surface symptom of the impasse. The equivocation on "arbitrary" is real, but it is driven by a deeper divergence regarding the teleology of epistemic utility theory. The dispute is not merely verbal, nor is it purely substantive in the sense of a factual disagreement about the mathematics. It is a methodological clash over what constitutes a successful vindication.

  Here is the diagnosis of the disagreement, the precise technical question you are looking for, an assessment of your mixture example, and a proposal for what counts as progress.

  ### Diagnosis of the Impasse

  You are correct that the two camps are answering different questions under the same heading. However, characterizing this as a verbal equivocation on "arbitrary" understates the structural rift. The rift concerns the **granularity of the normative verdict**.

  The Invariance Camp treats epistemic utility theory as a **foundational vindication**. Their goal is to show that the norms of probability are not merely pragmatic or aesthetic but are constitutive of accuracy itself. For this purpose, a binary verdict suffices: a credence function is either accuracy-dominated or it is not. If every strictly proper rule agrees on the binary classification (incoherent states are dominated, coherent states are not), then the specific choice of rule is indeed analogous to a choice of units. It scales the utility but does not change the logic. They are asking: "Is the structure of probabilistic coherence robust across the admissible class?"

  The Sensitivity Camp treats epistemic utility theory as a **decision-theoretic guide**. Their goal is to use accuracy to determine not just what is forbidden, but what is required, how to repair errors, and how to compare non-ideal states. For this purpose, binary verdicts are insufficient. An agent needs to know *which* coherent credence function to adopt to minimize expected loss, or *how* to update when evidence arrives. If different strictly proper rules recommend different repairs or yield different magnitudes of error, the theory fails to guide action uniquely. They are asking: "Does the structure of accuracy provide a unique navigation system through credal space?"

  The equivocation on "arbitrary" follows from this. When the Sensitivity Camp says the choice is arbitrary, they mean **philosophically underdetermined**: there is no accuracy-based reason to prefer the quadratic score's recommendations over the logarithmic score's recommendations. When the Invariance Camp denies this, they mean **mathematically unconstrained**: the theorems do not require a specific rule, only a specific property.

  Consequently, the impasse is not just about two questions sharing a heading. It is about whether the "Invariant Core" (the binary verdicts shared by all strictly proper rules) is sufficient to do the philosophical work the theory was built to do.

  ### The Unposed Technical Question

  You hypothesized that the unposed question concerns whether the non-invariant remainder is empty or negligible. This is close, but it needs to be sharpened to capture the normative stakes. The precise technical question is this:

  **What is the intersection of the dominance orderings induced by the set of all strictly proper scoring rules, and does this intersection suffice to derive the specific diachronic and comparative norms the theory claims to vindicate?**

  To unpack this:
  1.  Let $S$ be the set of all strictly proper scoring rules.
  2.  For any $s \in S$, let $\prec_s$ be the dominance ordering where $c \prec_s c'$ if $c'$ dominates $c$ according to $s$.
  3.  Define the **Invariant Dominance Relation** $\prec_{inv}$ such that $c \prec_{inv} c'$ if and only if $c \prec_s c'$ for all $s \in S$.

  The Invariance Camp assumes that $\prec_{inv}$ is rich enough to support the central theorems (Probabilism, Conditionalization). The Sensitivity Camp suspects that $\prec_{inv}$ is too thin. They suspect that while $\prec_{inv}$ might successfully identify incoherent states (Probabilism), it fails to uniquely identify the *best* coherent state or the *correct* update rule (Conditionalization).

  If the intersection of all strictly proper rules yields a partial ordering that is too sparse to mandate Conditionalization over other updating policies, or too sparse to rank two different incoherent states, then the Invariance Camp's claim that the rule choice is "like units" is false. Units preserve ratios and orderings; changing scoring rules often warps the ordering of non-ideal states.

  ### Assessment of the Mixture Example

  Your mixture example, $s = (1-\lambda)Q + \lambda L$, is not a trivial artifact of mixing bounded and unbounded scores. It is a genuine discriminator, and the Invariance Camp is mistaken to dismiss it.

  The Invariance Camp relies on an analogy: choosing a scoring rule is like choosing between meters and feet. This analogy holds only if the transformation between rules is linear. If Rule A is just $k \times$ Rule B, then dominance relations and minimizing credences remain identical. However, the class of strictly proper rules is not linearly connected. The logarithmic score and the quadratic score induce different geometries on the probability simplex.

  Your example demonstrates **metric sensitivity**. By varying $\lambda$, you are not just scaling the utility; you are changing the curvature of the isoscore contours.
  *   **The Invariance Verdict:** You found that domination holds at both $\lambda = 0.05$ and $\lambda = 0.90$. This supports the Invariance claim that the *existence* of a dominating alternative is robust.
  *   **The Sensitivity Verdict:** You found that the *margin* of domination and the *identity* of the dominating alternative vary. This supports the Sensitivity claim that the *prescriptive content* is unstable.

  If the theory is meant to tell an agent "You are incoherent," your example shows the Invariance Camp is right. If the theory is meant to tell an agent "You are incoherent, and here is the specific coherent credence you should move to, and here is how much better it is," your example shows the Sensitivity Camp is right.

  The Invariance Camp's dismissal of your example rests on the claim that only the binary verdict matters. But this begs the question against the Sensitivity Camp, who argue that the binary verdict is not the whole of the norm. Therefore, your example successfully exposes that the "units" analogy is mathematically false. Scoring rules are not units of measurement; they are distinct metrics that define distance differently.

  ### What Counts as Progress

  Progress will not come from finding a new scoring rule or arguing harder about the definition of propriety. It requires a theorem or a reformulation that addresses the thickness of the Invariant Dominance Relation.

  **1. The Characterization Theorem**
  Progress would look like a formal characterization of $\prec_{inv}$. Does the intersection of all strictly proper rules entail Conditionalization?
  *   If there is a theorem showing that *only* Conditionalization minimizes expected loss across *all* strictly proper rules, the Invariance Camp wins on diachronic norms.
  *   If there is a counter-model showing that for some strictly proper rules, a different updating rule minimizes expected loss, the Sensitivity Camp wins, and the Invariance Camp must concede that their vindication of Conditionalization is rule-dependent.

  **2. The Reformulation of Vindication**
  If the technical results show that $\prec_{inv}$ is too thin to support Conditionalization or specific repairs, the Invariance Camp must reformulate what a vindication accomplishes. They would need to argue that epistemic utility theory is *only* a negative constraint (a logic of consistency) and not a positive guide (a logic of discovery). If they can defend this limited aim, the dispute dissolves: the Sensitivity Camp is asking for more than the theory is designed to deliver.

  **3. The Argument for a Unique Rule**
  Alternatively, progress could come from the Sensitivity Camp successfully motivating a unique scoring rule without circularity. If they can show that independent epistemic considerations (e.g., locality, symmetry, or information sensitivity) single out one rule (like the logarithmic score) as the *true* measure of accuracy, then the "arbitrary" charge is met, and the parameter is fixed.

  ### Evaluation of the Camps

  Having diagnosed the dispute, I must offer an assessment of which position is more tenable, based on the reasoning above rather than external preference.

  The Sensitivity Camp has the stronger position, for two reasons that do not presuppose their conclusion.

  First, the **Unit Analogy is Mathematically False.** As your mixture example demonstrates, the space of strictly proper scoring rules is not a family of linear transformations. Different rules induce different topologies on the space of credences. To claim that the choice of rule is like a choice of units is to make a category error. Units measure the same distance differently; scoring rules measure *different distances*. Therefore, the Invariance Camp's central deflationary metaphor cannot hold.

  Second, the **Normative Demand is Positive, not Negative.** Epistemic utility theory is rarely deployed merely to prove that probabilism is consistent. It is deployed to argue that agents *ought* to conditionalize, *ought* to resolve imprecision, and *ought* to prefer one incoherent state over another in non-ideal theory. These are comparative and prescriptive claims. If the theorems supporting these claims vanish when we move from "some strictly proper rule" to "all strictly proper rules," then the theory fails to deliver the norms it promises. The Invariance Camp can only survive by retreating to a much weaker thesis (that accuracy merely forbids incoherence), but this retreat abandons the ambitious "accuracy-first" program that generated the dispute in the first place.

  The Impasse exists because the Invariance Camp is defending a mathematical robustness that does not map onto the normative richness required by the Sensitivity Camp. Your dissertation should not try to force them to agree. It should formalize the gap you have found: the distance between the *invariant existence* of a dominating state and the *sensitive location* of that state. That distance is where the philosophy lives.
