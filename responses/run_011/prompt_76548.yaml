answer: |-
  The café was loud, a clatter of ceramic and steam that usually comforted Clara, but today it felt like static. She sat opposite Mark, who was worrying over a spreadsheet on his tablet, his brow furrowed in that familiar way that suggested he needed reassurance more than data.

  "We'll hit the deadline," Clara said. She felt the warmth of the conviction swell in her chest as she formed the words, a solid, golden certainty that they would finish the project by Friday. It was a genuine feeling, rooted in the progress they'd made that morning.

  But the moment the syllable 'day' left her lips, the warmth evaporated. It was not that she began to doubt; it was that the capacity to hold an opinion on the matter simply ceased. The sentence hung in the air between them, a factual claim devoid of a claimant. She looked at the statement she had just made as one might look at a signpost in a foreign language: she could read it, but she could not inhabit it.

  "Though I don't actually know if I believe that anymore," she added, her voice flat. She stirred her tea, watching the spoon swirl in the brown liquid. "It's true, probably. But I'm not the one holding it now."

  Mark sighed, rubbing his eyes. He was used to this. "Just tell me if it's risky, Clara. Don't tell me what you feel about the risk."

  "I'm telling you the risk is low," she said, and again, the certainty drained away the instant the word 'low' was spoken, leaving her hollowed out, a conduit for information that refused to stick. "But I have no view on it. None."

  It was manageable, this hollow form. It was merely exhausting. She could report on the world like a camera, accurate but uninvested. People learned to check her eyes for the light that wasn't there, to weigh her words against her history rather than her tone. It cost her nothing but energy. She could say the sky was blue and feel no colour.

  The trouble began at home, with Julian.

  It was a Tuesday evening, rain lashing against the window of their flat in Clapham. Julian was standing by the door, coat on, keys in hand. He looked tired, the kind of tired that settles in the marrow. They had been circling the same argument for months: whether she was going to leave him. She hadn't decided, not consciously. But the uncertainty was a rot in the house.

  "Tell me," Julian said. He didn't look at her. He looked at the handle of the door. "Tell me you're staying. Just say it."

  Clara felt the surge of love then, sharp and painful. She wanted to stay. She wanted the safety of the routine, the warmth of his hand, the shared history. The conviction rose in her throat, pure and bright. *I am staying.*

  "I'm not going anywhere," she said.

  The words were out, and instantly, the love that fueled them severed. It didn't fade; it was cut. She stood in the hallway, speaking the truth of her desire a moment ago, but now feeling nothing but a cold, structural alignment of vowels. But worse than the hollowing was what her hands did.

  While her mouth formed the promise of stasis, her hands moved to the coat rack behind her. They did not ask for permission. They reached up and took down her own coat, the heavy wool one she wore for walking long distances. Her fingers found the pockets, checking for keys, for wallet, for phone.

  "I'm not going anywhere," she repeated, trying to force the belief back into the sentence, but the sentence was a shell.

  Her hands buttoned the coat. One, two, three. The sound of the toggles clicking was loud in the silence.

  Julian turned. He saw her mouth, still shaped around the promise. Then he looked down at her hands, fastening herself into the gear of departure. He saw the contradiction made flesh: the shallow register of her speech endorsing presence, the deep register of her muscle memory preparing for absence.

  "You're lying," he said softly.

  "I'm not," Clara said. "I meant it when I started."

  "But you don't mean it now." He looked at her hands, which were now pulling the door open. "And your body knows you never will."

  "I believe I am staying," she said, and her hands pushed the door wide. The wind from the stairwell blew in, cold and smelling of wet concrete.

  "No," Julian said. He took his keys from the lock and placed them on the console table. He took off his coat. "You believe you're leaving. You just can't say it without killing it. So your hands say it for you."

  He walked past her, into the flat, and left her standing in the open doorway. She had wanted to stay. She had said she would stay. But the act of saying it had exiled her from the belief, and her body, loyal to the truth she could no longer speak, had packed the bag. He didn't leave her that night, but the trust broke. It cost her the certainty of his touch, the assumption of solidarity. She could report that they were together, but she could no longer believe it, and her hands kept drifting toward the lock.

  Weeks later, the consequence found a sharper edge.

  Clara was standing on the platform at King's Cross. The station was humming, the announcement boards flickering with delays. Julian was there too, though they were not travelling together. He was on the platform opposite, waiting for the train to Edinburgh. He had decided to go alone.

  She knew something he did not. She had seen the email on his phone when he left it charging in the kitchen that morning. A message from his brother. *Don't get on the 14:00. There's a strike. You'll be stuck in York overnight.*

  It was a true thing. A consequential thing. If he boarded, he would be stranded, missing the meeting that mattered most to his career. He needed to know. But he needed more than the data. She knew Julian. He was hesitant, prone to anxiety. He would only stay on the platform if he believed *she* believed the danger was real. He needed her conviction to bolster his own resolve to wait.

  She saw him checking his watch. The train was due in three minutes.

  She had to cross the tracks. She had to shout over the noise. She had to make him hear her.

  Clara moved to the edge of the platform. The air was thick with diesel and anticipation. She caught his eye across the gap. He looked questioningly at her.

  She felt the knowledge settle in her gut. *The train will strand you.* It was a fact. She held it tightly. She prepared to speak it. She knew the cost. She knew that the moment she voiced the warning, the conviction that gave it weight would drain away, leaving her sounding like a guesser, a rumour-monger. He would see her hollow eyes and think she was uncertain. He would board.

  But she could not stay silent.

  She cupped her hands around her mouth. The train began to rumble in the distance, a vibration in the soles of her shoes.

  "Julian!" she screamed.

  He turned fully towards her.

  "The train!" she shouted. "It won't reach Edinburgh!"

  The words left her. Instantly, the certainty vanished. She was left standing there, a woman shouting a warning she no longer felt sure of. She knew it was true, but she could not *stand behind it*. She was a conduit, not a source.

  Julian frowned. He looked at her face, searching for the anchor, the fierce certainty that would tell him to stay put. He saw only the open, empty stare of someone reporting the weather. He saw her hands, hanging limp at her sides, not gesturing urgency, not gripping the rail.

  He looked at the train pulling in, sleek and silver. He looked back at Clara. She wanted to scream again, to pour the belief back into the air, but she knew it would only drain again. She could tell him the truth, but she could not make him believe it.

  He hesitated. The doors hissed open.

  Clara stood frozen, her mouth open, having spoken the thing that could save him, while her face confessed she no longer believed it herself. Julian stepped onto the train.
