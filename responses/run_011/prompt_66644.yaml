      *   *Weak Point:* Predicting his reaction to AI specifically. He died in 1947. He knew photography, but not generative tech. The leap from "mechanical reproduction" to "generative synthesis" is the biggest guess. I need to flag this.
      *   *Strong Point:* His reaction to the Auction (Exhibit 2). He lived through the transition from "criminal" to "celebrity." He understood the market.

  8.  **Drafting the Response (Iterative refinement):**
      *   *Tone:* Analytical, sharp, avoiding art-theory jargon.
      *   *Structure:* Follow the prompt's order.
