          *   *Impact:* Confirms his bias against modernists, but threatens his uniqueness.
          *   *Motive:* Insults "skill."

      *   **Exhibit 4: Detection Lab.**
          *   *Say:* "Science is a blunt instrument." "You measure the shell, not the spirit."
          *   *Think:* Resentment. This is what ended him. It makes the game impossible now.
