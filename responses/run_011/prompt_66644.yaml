      *   *The Wound:* Exhibit 1 is the deepest wound because it makes his *labor* irrelevant. Exhibit 4 is the practical wound. But Exhibit 1 destroys the *myth*.
      *   *The Paradox:* The AI completes the argument (experts are blind) but kills the protagonist (he is not special).
      *   *Motive:* Retaliation.
      *   *Extrapolation:* The AI reaction is the most speculative.

      *   *Closing Dialogue:* Needs to be punchy. 4-5 sentences.

  9.  **Refining the "Wound" Analysis:**
      *   The prompt asks: "Which of the four does the most damage to the account he gave of himself?"
      *   His account: "I am a painter who showed the experts were blind."
