      *   Historical consensus leans toward a mix, but "Resentment/Vindication" is the narrative engine. I will argue for **Vindication/Retaliation** as the load-bearing one for the novel's purpose.

      *(Reviewing Skill vs Speed)*: "Rival, insult, instrument, or vindication."
