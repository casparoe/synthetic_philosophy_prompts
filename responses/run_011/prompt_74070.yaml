  I bind my hand before the move is made.
  You watch me burn the bridge at my back.
  I swear to meet your force with equal weight.
  There is no path remaining for retreat.

  You watch me burn the bridge at my back.
  Time dies; now is all.
  There is no path remaining for retreat.
  You know I cannot stop what I began.

  Time dies; now is all.
  The mask is fused and fixed unto the bone.
  You know I cannot stop what I began.
  We race to lock the door on ourselves.

  The mask is fused and fixed unto the bone.
  Stand firm; all is dust.
  We race to lock the door on ourselves.
  Dust beneath the iron heel.

  Stand firm; all is dust.
  I swear to meet your force with equal weight.
  Dust beneath the iron heel.
  I bind my hand before the move is made.

  The two returning line-pairs on which the argument depends are "I bind my hand before the move is made" and "I swear to meet your force with equal weight." On their second appearance, the first line shifts from a declaration of strategic intent to a statement of immutable fact, while the second transforms from a conditional threat into the automatic mechanism of collision.
