      *   **Topic:** Algorithmic fairness impossibility theorems (specifically the Chouldechova 2017 / Kleinberg et al. 2016 results regarding Calibration vs. Error Rate Balance).
      *   **Input:** A quoted excerpt from a tech magazine longread.
      *   **Task:** Evaluate the excerpt claim-by-claim into three buckets (Accurate, Defensible Popularization/Omitted Hypothesis, False).
      *   **Specific Questions to Answer:**
