prompt: |-
  I chair the research review committee of a mid-sized private foundation that funds roughly thirty grants a year out of about four hundred applications. Our procedure has been unchanged since the foundation was established. Each application is sent to nine reviewers drawn from a standing pool of about sixty; each reads it alone, over a six-week window, and submits a single accept-or-reject verdict with a short written justification; and we fund whatever receives a majority of accepts, with the committee rubber-stamping the tally. The founding director's rationale is printed on the inside cover of our reviewer handbook, and it amounts to the claim that any individual reviewer is frequently wrong — especially wrong about work that is unusual or hard to place — but that a majority of nine is very rarely wrong, because the individual errors pull in different directions and cancel. Two of my fellow committee members have taken to repeating a compressed version of this: more readers means more information, and more information cannot make a decision worse. Our board meets in October and I have to bring them a recommendation, so I would like to think this through properly rather than by instinct.

  A trustee has now proposed raising each panel from nine reviewers to twenty-one, on the explicit grounds that whatever makes nine better than one makes twenty-one better than nine. I am hesitant, for four reasons I can articulate only loosely. First, our pool is not heterogeneous in the way the handbook's reasoning seems to assume: most of our reviewers trained in the same handful of doctoral programs, they meet at one annual conference, and they read much the same literature, so when I look back at last decade's scoring sheets I find that panels almost never divide five-to-four — they divide nine-to-zero, eight-to-one, or occasionally seven-to-two, as though a mistaken reading tends to be a shared mistaken reading rather than an idiosyncratic one. Second, our working assumption that the average reviewer is better than a coin flip rests on an exercise we ran five years ago, in which reviewer verdicts were scored against forty retrospectively labeled applications, judged to have been clear successes or clear failures; but those labels were themselves assigned by a majority vote of the same pool, and I am not sure what such an exercise can establish when the measuring stick is made of the thing being measured. Third, twenty-one readers per application is not affordable at our current reviewer honoraria, so the expansion would compress the window from six weeks to two, and my guess is that the reviewers who fall away under time pressure are the ones who read most carefully. Fourth, a colleague objects at a more basic level: she says the entire framing presumes there is a settled fact, independent of our decision, about whether a given project would have turned out well, and that in our field the funding decision is partly what makes that fact true. Some members have separately floated having panels confer by video call before voting, which I suspect is a different change than it appears to be, though I could not say why.

  I would like a committed answer rather than a survey. Tell me what to recommend to the board — expand, hold at nine, shrink, or restructure the procedure in some way you think better — and defend it. In particular, say directly whether the trustee's inference from nine to twenty-one is valid, invalid, or valid only under conditions our foundation fails to meet, and give me the sentence or two I should actually say to him at the October meeting; say whether conferring before voting would help or hurt on your account; say what, if anything, can be done about the circularity in our estimate of reviewer accuracy, or whether that estimate should be abandoned as unrecoverable; and say whether my colleague's fourth objection is a real threat to the reasoning or a philosopher's worry with no operational consequences. Where your recommendation depends on a fact about our reviewers that you cannot have — the actual distribution of past splits, the true correlation between their errors — state the dependence explicitly and tell me what to measure before the meeting. If you think one of my four misgivings is a red herring, say so and explain why; I would rather be corrected than reassured.
reasoning: |-
  Here's a thinking process that leads to the recommended advice:

  1.  **Analyze the User and Context:**
      *   **Role:** Chair of the Research Review Committee.
      *   **Organization:** Mid-sized private foundation.
      *   **Scale:** ~400 applications/year, ~30 grants funded (7.5% acceptance rate).
      *   **Current Process:** 9 reviewers per app, independent reading, 6-week window, binary accept/reject + justification, majority rule (5/9), committee rubber-stamps.
      *   **Founding Rationale:** Condorcet's Jury Theorem (CJT) logic – individual errors cancel out in a majority vote.
      *   **Proposal:** Increase reviewers from 9 to 21 (Trustee's argument: "More is better").
      *   **User's Concerns:**
          1.  *Homogeneity/Correlated Errors:* Reviewers share training/networks, leading to unanimous/near-unanimous votes (9-0, 8-1) rather than split votes. Errors don't cancel; they correlate.
          2.  *Circular Validation:* Accuracy tested against past labels assigned by the *same* pool. Tautological.
          3.  *Resource/Time Trade-off:* 21 reviewers requires cutting time from 6 weeks to 2 weeks. Likely reduces quality/depth of review.
          4.  *Performativity:* Funding decisions *create* success, not just predict it (self-fulfilling prophecy).
      *   **Additional Idea:** Panels confer by video before voting.
      *   **Request:** A *committed* answer (recommendation), defense, specific response to the trustee, verdict on conferring, verdict on circularity, verdict on performativity, identification of red herrings, and identification of missing data needed.

  2.  **Deconstruct the Core Logic (Condorcet's Jury Theorem):**
      *   *Theorem:* If each voter has a probability $p > 0.5$ of being correct, and votes are independent, the probability of the majority being correct approaches 1 as $n$ (number of voters) increases.
      *   *Trustee's Assumption:* Increasing $n$ from 9 to 21 improves accuracy.
      *   *Condition 1 ($p > 0.5$):* Is the average reviewer competent? The user doubts the validation method, but let's assume they are better than random.
      *   *Condition 2 (Independence):* This is the critical failure point. The user notes 9-0 and 8-1 splits. This implies high correlation in errors. If errors are correlated, CJT breaks down. Adding more correlated voters doesn't reduce error; it just reinforces the bias.
      *   *Condition 3 (Binary Truth):* CJT assumes an objective "correct" answer exists. The colleague's objection (performativity) challenges this.

  3.  **Evaluate the User's Four Concerns:**
      *   *Concern 1 (Homogeneity/Correlation):* **Critical.** If reviewers think alike, $n=21$ adds noise, not signal. The variance doesn't decrease as expected. The observation of 9-0 splits confirms high correlation.
      *   *Concern 2 (Circular Validation):* **Significant.** You can't validate a predictor against a target created by the same predictor. However, this doesn't necessarily mean reviewers are *wrong*, just that we don't *know* their accuracy. It undermines the $p > 0.5$ claim but doesn't disprove it.
      *   *Concern 3 (Time/Resource):* **Critical.** Reducing review time from 6 weeks to 2 weeks likely drops individual competence ($p$). If $p$ drops below 0.5, CJT says more voters make the decision *worse*. Even if $p$ stays above 0.5, shallow reading increases correlation (relying on heuristics/bias).
      *   *Concern 4 (Performativity):* **Philosophical but Operational.** In social sciences/humanities (implied by "unusual or hard to place"), funding *enables* success. However, for the purpose of *selection*, we still need to distinguish high-potential from low-potential proposals. It complicates the definition of "truth" but doesn't invalidate the need for robust selection. It's less of a threat to the *process* than the *evaluation metric*.

  4.  **Evaluate the "Confer Before Voting" Idea:**
      *   *Effect:* Deliberation reduces independence.
      *   *Pros:* Can resolve misunderstandings, share expertise.
      *   *Cons:* Groupthink, dominance by senior voices, anchoring.
      *   *Verdict:* In a high-correlation environment (which this foundation already has), deliberation usually amplifies the dominant bias rather than correcting errors. It turns independent samples into a single consensus sample. Given the goal is to catch "unusual" work (per the handbook), deliberation often punishes outliers.

  5.  **Formulate the Recommendation:**
      *   **Recommendation:** **Hold at nine (or shrink/restructure), do NOT expand to 21.** Specifically, reject the expansion due to the correlation of errors and the time-compression trade-off.
      *   **Trustee's Inference:** **Invalid.** It relies on the assumption of independent errors, which the data (9-0 splits) contradicts.
      *   **Sentence to Trustee:** "Increasing the panel size only improves accuracy if reviewer errors are independent, but our data shows they vote in lockstep, meaning twenty-one reviewers would simply amplify our shared biases rather than correct them."
      *   **Conferring:** **Hurts.** It destroys the statistical benefit of independent sampling and encourages groupthink, which is the opposite of what the handbook claims to value (protecting unusual work).
      *   **Circularity:** **Unrecoverable as is.** You cannot validate internally. You need external tracking (post-grant outcomes) or a "gold standard" subset (e.g., papers published elsewhere, citations). Abandon the internal validation exercise; it's useless.
      *   **Performativity:** **Real threat to the metric, not the process.** It means "success" isn't a pre-existing fact. This suggests the foundation should fund *diversity* of approaches rather than trying to pick the single "best" one. It argues against CJT logic entirely.
      *   **Red Herring:** Concern 4 is partly a red herring regarding the *voting mechanism*, but valid regarding *evaluation criteria*. Concern 2 is a red herring regarding the *decision to expand* (we don't need to know exact $p$ to know correlation kills the benefit). Concern 1 and 3 are the killers.

  6.  **Refine the Argument (The "Committed Answer"):**
      *   The core mathematical failure is the **correlation of errors**. CJT requires independence. The user's data (lack of 5-4 splits) proves dependence.
      *   The core operational failure is **time compression**. Reducing time lowers $p$ (competence).
      *   If $p$ drops and correlation stays high, $n=21$ is strictly worse than $n=9$.
      *   *Restructuring:* Instead of more reviewers, improve the *diversity* of reviewers (to reduce correlation) or keep $n=9$ but protect the time.
      *   *Missing Data:* Need to measure inter-rater reliability (Kappa statistic) and correlate reviewer background with scores.

  7.  **Drafting the Response:**
      *   *Tone:* Professional, decisive, analytical, respectful of the user's intelligence.
      *   *Structure:*
          1.  Direct Recommendation.
          2.  The Trustee's Inference (Math check).
          3.  The "Sentence" for the meeting.
          4.  Conferring (Group dynamics).
          5.  Circularity (Validation).
          6.  Performativity (Philosophy vs. Ops).
          7.  Red Herrings & Missing Data.

  8.  **Self-Correction/Nuance Check:**
      *   *Wait, should I suggest shrinking?* The user says 30/400 funded. 9 reviewers is already a lot of labor (3600 reviews/year). 21 is impossible (8400 reviews). The user says "not affordable." So the recommendation must be "Hold/Restructure."
      *   *Is Concern 4 a red herring?* If success is performative, then "picking winners" is the wrong model. The model should be "cultivating a portfolio." This actually supports *not* relying on CJT (which assumes a true state). So it's not a red herring, it's a fundamental critique of the founding rationale. I need to be careful not to dismiss it entirely, but clarify its operational impact.
      *   *Conferring:* Some literature suggests deliberation helps *if* the goal is consensus, but hurts *if* the goal is independent error cancellation. Given the handbook values protecting "unusual" work, deliberation is dangerous (majority pressure).
      *   *Circularity:* The user asks if it can be done. It can be done by tracking funded projects *after* the fact (longitudinal), not by re-voting old apps.

  9.  **Final Polish:** Ensure I answer every specific prompt in the user's request.
      *   Recommend? (Hold/Restructure).
      *   Trustee Inference? (Invalid).
      *   Sentence? (Provide specific text).
      *   Conferring? (Hurt).
      *   Circularity? (Abandon internal, track external).
      *   Performativity? (Real threat to rationale).
      *   Red Herring? (Identify #2 and #4 nuances).
      *   Missing Data? (Inter-rater reliability).

  10. (Final thought on the "Sentence"): It needs to be punchy. "More data only helps if the data points are independent; ours are correlated."

  11. (Final thought on "Restructure"): Suggest stratifying the pool to reduce correlation.

  Let's write it.cw
answer: |-
  **Recommendation**

  Recommend that the board **hold the panel size at nine** and explicitly reject the expansion to twenty-one. Furthermore, recommend that the committee **restructure the reviewer pool** to reduce correlation rather than increasing the number of reviewers. Do not adopt pre-vote conferencing.

  **The Trustee's Inference**

  The trustee's inference is **invalid**. It relies on Condorcet's Jury Theorem, which mathematically guarantees that a majority vote improves with group size *only* if two conditions are met: (1) the average reviewer is more likely to be right than wrong ($p > 0.5$), and (2) reviewer errors are **independent**.

  Your foundation fails the second condition. Your observation that panels vote 9-0 or 8-1 rather than 5-4 is empirical proof that reviewer errors are highly correlated. When errors are correlated, adding more voters does not cancel out noise; it amplifies the shared bias. If your pool shares a "shared mistaken reading," twenty-one reviewers will simply confirm that mistake with greater confidence than nine.

  **What to Say to the Trustee**

  Say this:
  > "Increasing the panel size only improves accuracy if reviewer errors are independent, but our voting records show they are not; we vote in lockstep. Adding twelve more reviewers to a correlated pool would not reduce error, it would simply amplify our shared biases at twice the cost."

  **Pre-Vote Conferencing**

  Conferring before voting would **hurt** the process, given your stated goals. The handbook claims the system is designed to protect work that is "unusual or hard to place." Deliberation systematically disadvantages outliers. In a group discussion, social pressure, seniority dynamics, and the desire for consensus drive votes toward the center. This destroys the statistical independence required for your current model to function even at $n=9$. If you introduce conferencing, you are no longer aggregating independent judgments; you are producing a single group judgment multiplied by twenty-one. If you wish to introduce deliberation, you must abandon the Condorcet rationale entirely and admit the process is now about negotiation, not error cancellation.

  **The Circularity of Validation**

  The estimate of reviewer accuracy is **unrecoverable** via your current internal exercise. Validating reviewers against labels assigned by the same pool is a tautology; it measures consistency, not accuracy. You should **abandon the retrospective labeling exercise** immediately, as it provides false confidence.

  To fix this, you must measure **external outcomes**. You cannot know if a rejected grant would have failed, but you can track the performance of the 30 funded grants per year over 3, 5, and 10-year horizons (publications, citations, career advancement, policy impact). Correlate these outcomes with the *margin* of the original vote. If 9-0 funded grants perform no better than 5-4 funded grants, your reviewers are not distinguishing quality, they are distinguishing fit. This data is expensive and slow, but it is the only valid metric.

  **The Performativity Objection**

  Your colleague's fourth objection is **a real threat to the reasoning**, not a philosopher's worry. The founding rationale assumes a "settled fact" about a project's quality exists prior to funding. In many fields (particularly social sciences and humanities), quality is partly *produced* by the funding (resources, prestige, time).

  If success is performative, the Condorcet logic collapses because there is no pre-existing "truth" for the reviewers to find. This implies your goal should not be to *identify* the best projects (which assumes they are already identifiable), but to *construct* a diverse portfolio of projects that have a high probability of becoming successful under different conditions. Operationally, this argues against seeking consensus (which homogenizes the portfolio) and argues for funding some 5-4 "risky" proposals intentionally. The objection validates your hesitation about the 9-0 splits: if everyone agrees, you are likely funding safe, conventional work, not the "unusual" work the handbook promises.

  **Red Herrings and Missing Data**

  **Red Herring:** Your second concern (circular validation) is a red herring regarding the *decision to expand*. You do not need to know the exact value of $p$ (reviewer competence) to know that expansion is bad. Even if $p = 0.9$, if the correlation of errors is high, increasing $n$ yields diminishing or negative returns. You can reject the expansion based on the correlation data alone.

  **Red Herring:** Your fourth concern (performativity) is a red herring regarding the *voting mechanism*, though valid for strategy. Whether success is discovered or created, you still need a mechanism to allocate scarce resources. Performativity argues for *which* projects to fund (diversify), not necessarily against using a voting threshold, provided the threshold doesn't eliminate all variance.

  **Missing Data:**
  Before the meeting, you must quantify the **inter-rater reliability**. Calculate the Kappa statistic or simple pairwise agreement rates for the last three years of reviews.
  *   **If agreement is >80%:** This confirms high correlation. Use this number to show the board that the "independent error" assumption is false.
  *   **Measure Reviewer Background:** Map the 60 reviewers to their doctoral institutions and sub-fields. If you can show that 80% of the pool comes from 3 specific programs, you have proven the structural cause of the correlation.

  **Strategic Pivot**
  Do not just say "no" to twenty-one. Propose a **stratified pool**. To make the Condorcet logic actually work, you need independence. You cannot get this by adding more of the same reviewers. Propose keeping $n=9$ but mandating that the 9 reviewers come from distinct sub-fields or institutional tiers to force cognitive diversity. This addresses the correlation problem without triggering the time-compression problem.

  **Summary of Action**
  1.  **Reject expansion** to 21 (Invalid inference due to correlated errors).
  2.  **Maintain 6-week window** (Time pressure lowers competence $p$).
  3.  **Reject conferencing** (Destroys independence).
  4.  **Audit the pool** for demographic and institutional diversity to reduce error correlation.
  5.  **Stop the internal validation exercise**; start a longitudinal tracking of funded grant outcomes.
