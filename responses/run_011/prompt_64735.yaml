answer: |-
  Interpretive Assumption: I assume that personal transformation blocks rational choice only if the agent lacks a stable higher-order value structure capable of authorizing the change. If the agent can value the transformation from their current standpoint, rationality is preserved.

  **Rejected Candidates**
  1. Parenthood: Explicitly forbidden as a stock case in the specifications.
  2. Religious conversion: Epistemic access is too internal and difficult to ground structurally without stipulation.
  3. Sensory restoration: Forbidden category; often relies on medical sci-fi tropes.
  4. Immigration/Moving: Often alters circumstances rather than core preferences, failing specification (a).

  **Scenario**
  Marcus, a corporate attorney, must decide whether to transfer permanently to the Public Defender's office. He spent the last year seconded there, handling identical caseloads under the same conditions, so he knows precisely the exhaustion, the client interactions, and the daily moral texture of the work. During that year, he felt his own priorities begin to shift away from wealth toward justice, mirroring the permanent transformation observed in colleagues who made the switch. He knows the phenomenology of the justice-focused life because he has temporarily inhabited it. Marcus currently values wealth highly but recognizes the intrinsic worth of the PD work. He must choose between retaining his current high-income lifestyle and self-conception or adopting the lower-income, justice-oriented identity he has already sampled. The decision hinges on whether his current self can authorize the reshaping of his future priorities based on the known phenomenology of the alternative life.

  **Demonstration**

  1.  **Epistemic audit.** Specification (b) is met because Marcus's acquaintance is grounded in the structural fact of his one-year secondment. He is not relying on testimony or imagination; he has first-personal access to the phenomenology of the work (the exhaustion, the moral texture). This is not descriptive knowledge relabelled because he has performed the actions and felt the emotional resonance of the role, satisfying the requirement for "what it is like" knowledge without requiring permanent commitment beforehand.

  2.  **Transformation audit.** Specification (a) is met because the case specifies a shift in core preferences, not merely circumstances. Colleagues and Marcus himself exhibit a reliable change from valuing wealth/status to valuing justice/service. This is core because it governs how future choices are ranked (e.g., spending free time, career trajectory), not just what resources are available. The change is in *who he is*, not just *where he works*.

  3.  **The calculation.**
      | Act | Outcome | Subjective Value (Current Self) | Source of Value Assignment |
      | :--- | :--- | :--- | :--- |
      | Stay Corporate | Wealthy Self (Status-focused) | +10 | Current Preference (Fillable) |
      | Switch to PD | Justice Self (Service-focused) | +12 | Current Meta-Preference (Fillable) |

      Every cell is fillable. Marcus knows the phenomenology of the PD outcome (from secondment), so he can assign value to the experience itself. He knows the preference change will occur (from observation/self-monitoring), so he can assign value to *becoming that person*. This does not beg the question because it relies on his current capacity to value moral growth, a stable higher-order preference.

  4.  **Verdict.** The argument does not block the choice here. The epistemic pillar gives way because the agent has prior acquaintance with the experience. The personal pillar fails to block choice because the agent can rationally authorize the preference change via a stable higher-order value (e.g., "I value becoming a more just person"). Rational choice is preserved because the transformation is an object of current valuation.

  5.  **Load-bearing feature.** The prior temporary immersion (the secondment). If this feature is removed, the case collapses into a standard Paul-style scenario where the agent lacks epistemic access to the outcome's phenomenology, reinstating the epistemic barrier alongside the personal one.

  6.  **Best counterattack.** The strongest reply is the "Authority Objection": even if Marcus can value the transformation now, why should his current values govern a future self who will repudiate them? If the future Justice-Self regrets the loss of wealth, the current decision imposes a life the future self may not want.
      *Reply:* I can answer this. Practical rationality requires a decision *now*. The current self is the only locus of agency available to make the choice. To deny the current self authority is to mandate decision paralysis. Continuity of agency justifies the current self's authorization of the future self's constitution.
