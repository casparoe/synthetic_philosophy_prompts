answer: |-
  # Q&A Prep Sheet: Legality and Legitimacy in the Founding Trials

  ## Strategic Concessions (First Five Minutes)
  *Do not wait for these to be raised as objections. Pre-empt them to frame your 'candour' as a feature of the argument, not an oversight.*

  1.  **Concede the Moral Cost:** Explicitly state that admitting retroactivity means the defendants were denied fair warning. Do not try to minimise this. Frame it as the price paid for a political settlement that precluded a second war.
  2.  **Concede the Tokyo Asymmetry:** Acknowledge that the Tokyo Charter was drafted in greater haste and under more direct military command (SCAP) than Nuremberg. State clearly that your argument does not rely on the two tribunals being identical in procedure, but identical in *legal structure* (revolutionary vs. declaratory).
  3.  **Concede the 'Victors' Label:** Accept the term 'victors' justice' but redefine it immediately. Agree it was justice *by* victors, but deny that this automatically renders it justice *against* the law.

  ---

  ## The Objections (Ordered by Damage Potential)

  ### 1. The 'Nullum Crimen' Hardliner (International Legal Theorist)
  **The Objection:** "You argue that the Charter was revolutionary legislation. But if *nullum crimen sine lege* is a fundamental principle of justice, as you seem to grant, then admitting retroactivity concedes the trials were legally flawed. You cannot simply wave this away by saying selectivity is merely 'distributive injustice'. If the law didn't exist, the tribunal lacked jurisdiction *ratione materiae*. You haven't defended the legality; you've justified the power."

  **The Reply (2 mins):** "I am not waving it away; I am categorising it. The objection assumes that a defect in *legality* (retroactivity) necessarily voids the *validity* of the conviction. I argue that in 1945, validity flowed from the sovereign power of the Occupying Powers, not from pre-existing custom. The trial was a legislative act applied judicially. To say this 'justifies power' is correct, provided we understand that the alternative—doing nothing—was not a legal option but a political one. The convictions stand not because they were lawful under the old order, but because they constituted the foundation of the new one."

  **Soft Spot:** You are effectively arguing that 'might makes right' for the specific moment of 1945. This sits uncomfortably with a room of lawyers dedicated to the rule of law.

  ### 2. The 'Lineage' Problem (International Criminal Lawyer)
  **The Objection:** "If your account is correct, and Nuremberg was an exercise of revolutionary power rather than the application of existing law, then the entire lineage of modern international criminal law is poisoned. The ICC claims to be a court of law, not a political tribunal. If Nuremberg is the 'original sin' of power masquerading as law, on what basis do we claim the ICC rests on anything other than the hegemony of its state parties?"

  **The Reply (2 mins):** "The lineage is not one of identical legal mechanics, but of normative consolidation. Nuremberg was the *constitutive* moment. It was revolutionary then, precisely so it could become customary now. The distinction is temporal. We do not look to 1945 to justify the ICC's jurisdiction today; we look to the treaties and statutes ratified since. Nuremberg provided the vocabulary, but the ICC relies on the grammar of consent that followed. My argument protects the ICC by isolating the 'revolutionary' exception to the post-war settlement."

  **Soft Spot:** If the foundation is power, the superstructure looks shaky. Distinguishing 'constitutive moment' from 'ongoing legitimacy' is theoretically difficult without slipping into moralism.

  ### 3. The Tokyo Immunity Trap (Historian of Occupied Japan)
  **The Objection:** "You claim this account travels from Nuremberg to Tokyo. But in Tokyo, the ultimate 'architect of the peace'—the Emperor—was granted immunity by SCAP for political expediency. If the trials were an exercise of sovereign power to make new law, why was the sovereign of the defeated state exempted? Doesn't the Emperor's immunity prove that selectivity *did* undermine the legal coherence of the tribunal, contradicting your thesis?"

  **The Reply (2 mins):** "The immunity of the Emperor confirms rather than contradicts the thesis. It demonstrates that the tribunal was indeed an instrument of policy, not a machine of automatic justice. My argument is that selectivity is a *distributive* injustice, not a jurisdictional bar. The decision to exempt Hirohito was a political allocation of liability, similar to the decision not to prosecute Allied bombing commanders. It shows the limits of the 'revolution', but it does not undo the convictions of those who *were* charged under the new Charter."

  **Soft Spot:** This risks making the tribunal look like a pure purge. If the top leader is immune, why are the subordinates guilty of 'crimes against peace'? It strains the logic of command responsibility.

  ### 4. The Prosecutor's Pragmatism (Retired Prosecutor)
  **The Objection:** "I spent fifteen years exercising charging discretion. We always select defendants based on evidence, resources, and political viability. You're treating 'victors' justice' as a philosophical crisis when it's just case selection. By calling the Charter 'revolutionary', you're creating a theoretical problem that doesn't help us understand why we charge Person A and not Person B. Isn't this just over-intellectualising standard prosecutorial discretion?"

  **The Reply (2 mins):** "In domestic systems, discretion operates within a settled legal framework. In 1945, the discretion *created* the framework. The distinction matters. When you charged a warlord in Sierra Leone, you relied on statutes that existed prior to the act. At Nuremberg, the statute and the act were contemporaneous. My point is not to criticise discretion, but to highlight that at the founding moment, discretion and legislation were fused. Recognising this prevents us from pretending the IMT was a normal court, which protects the integrity of your office today."

  **Soft Spot:** The prosecutor may not care about protecting the integrity of the IMT; they care about the utility of the precedent.

  ### 5. The Customary Law Defender (International Legal Theorist)
  **The Objection:** "You dismiss the declaratory theory too easily. There was significant state practice and *opinio juris* regarding aggressive war between 1920 and 1939. The Kellogg-Briand Pact, League of Nations resolutions—these weren't nullities. By insisting the law was 'new', you ignore the evidence that the defendants *could* have known their actions were criminal. You're creating a false dichotomy between 'old law' and 'revolution'."

  **The Reply (2 mins):** "I do not deny the existence of those treaties. I deny their enforceability against individuals prior to 1945. States renounced war, but they did not criminalise it for their own leaders with individual penal sanctions. The 'revolution' was not in declaring war illegal, but in attaching personal criminal liability to heads of state. That step was not foreseeable from Kellogg-Briand. To pretend it was, is to engage in the very legal fiction I am asking us to abandon."

  **Soft Spot:** Some scholars have done deep archival work suggesting individual liability *was* discussed pre-1939. You must be sure of your historical ground here.

  ### 6. The Selectivity-Validity Link (Legal Theorist)
  **The Objection:** "You argue selectivity is merely distributive injustice. But if the law is truly 'new' and 'revolutionary', it must apply universally to be law. If it applies only to the defeated, it looks like a bill of attainder. Doesn't the selectivity prove that the 'law' was never intended to be general, and therefore fails the basic test of legality?"

  **The Reply (2 mins):** "That assumes law must be general to be valid. I argue that in a post-conflict settlement, law functions as a tool of transition. A bill of attainder targets named individuals; the Charter targeted categories of conduct (crimes against peace, humanity). The fact that only one side was prosecuted is an enforcement failure, not a definitional one. The law *could* have applied to the Allies; the political will did not exist. That is a moral failing, not a legal nullity."

  **Soft Spot:** This is the thinnest legal ice. Many theorists argue generality is a necessary condition of law (Fuller's inner morality).

  ### 7. The Soviet Judge Complication (Historian/Lawyer)
  **The Objection:** "You focus on the Charter as a unified revolutionary act. But the Soviet judges were operating under instructions that contradicted the very notion of individual liability, given their domestic practice of collective guilt. How can you call it a coherent 'revolutionary legislation' when half the bench didn't believe in the legal theory underpinning it?"

  **The Reply (2 mins):** "The coherence of the legislation does not depend on the internal beliefs of the judges, but on the text of the Charter they were sworn to apply. The Charter itself was a Western-drafted document imposed on the Soviet Union as much as on Germany. The Soviet participation lent legitimacy, but the legal mechanism was the Charter. The friction you describe highlights the political fragility of the tribunal, but it doesn't change the legal source of its authority."

  **Soft Spot:** Ignores the reality that Soviet legal culture fundamentally clashed with the adversarial/individualist nature of the trial, potentially undermining the 'rule of law' claim.

  ---

  ## Overlapping Objections
  *Be aware that these are the same point attacked from different angles.*

  *   **Objections 1, 5, and 6** are all variations of the **Legality Principle**. They all ask: "If it wasn't pre-existing law, how can it bind?"
      *   *Strategy:* Do not let them split your defence. Your answer to all three is the same: "Validity comes from Sovereign Command/Occupation Authority, not pre-existing custom."
  *   **Objections 2 and 4** are variations of the **Precedent/Utility** problem. They ask: "If you admit this, what happens to modern ICL?"
      *   *Strategy:* Your answer is the "Constitutive Moment" distinction. 1945 was unique; today is consensual.

  ---

  ## The Single Reply That Must Land
  **The Distinction between Validity and Legitimacy.**

  You must successfully convince the room that a conviction can be **legally valid** (properly authorised by the power holding jurisdiction) even if it is **morally compromised** (retroactive or selective).
  *   If you fail here, the Legal Theorists will eat you alive on *nullum crimen*.
  *   If you fail here, the Historians will dismiss you as an apologist for power.
  *   **The Line:** "We must stop asking if the trials were 'fair' in the abstract, and start asking if they were 'authorised' by the political reality of 1945. They were authorised. They were not fair. Both statements can be true."

  ---

  ## The Prayer Question
  *The one you hope nobody asks.*

  **The Question:** "If the authority of the IMT rested on the revolutionary power of the victors rather than pre-existing law, what stops a future coalition—say, a BRICS tribunal or a Western coalition in 2035—from convening their own 'revolutionary' tribunal to prosecute the losers of a different war using laws drafted *after* the conflict? On your account, isn't 'might makes right' the only enduring principle?"

  **Why this is lethal:**
  *   **Option A (Honest Retreat):** You admit that yes, technically, nothing stops them other than a shift in power dynamics. This costs you the thesis that ICL has progressed beyond power politics.
  *   **Option B (The Shrug):** You argue "it won't happen" or "norms have changed." This is empirical speculation, not legal theory, and leaves your normative framework empty.
  *   **Option C (The Contradiction):** You try to find a legal principle that stops them. But if you find one, you undermine your claim that Nuremberg was *revolutionary* (i.e., outside the existing legal order).

  **Preparation:** If asked, pivot immediately to the **consensual turn** post-1945. "The lesson of Nuremberg was precisely to prevent this by codifying the law *before* the next conflict (Geneva, Rome Statute). We accepted the retroactivity of 1945 to ensure the prospectivity of 1998." It's a defensive move, but the only one available.
