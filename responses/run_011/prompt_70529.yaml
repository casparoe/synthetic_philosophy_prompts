      *   *Game Translation:* Players act as journalists committing to a claim's strength. History (the game master) reveals the truth later.
      *   *Scoring Nuance:* If I say "Proves" and it's overturned, big penalty. If I say "Suggests" and it becomes Law, small penalty (missed scoop) or reward? The prompt asks for "hedged verbs get punished late." This implies that if a finding becomes solid, hedging looks like cowardice/inaccuracy in retrospect.

