answer: |-
  Here is a complete design for **"The Retraction Risk,"** a 75-minute workshop game built to teach the Pessimistic Meta-Induction (PMI) through mechanics rather than lecture.

  ### 1. The Setup
  *   **Players:** 18 students (6 tables of 3).
  *   **Role:** They are the editorial board of a major science magazine.
  *   **Goal:** Maximize the magazine's "Credibility Score" over 5 decades of publishing.
  *   **Materials:**
      *   6 decks of cards (one per table). Each deck has 5 cards (Rounds 1–5).
      *   Score sheets (paper).
      *   Candy (for the winning table).
      *   Whiteboard (to track aggregate class data).

  ### 2. The Mechanics
  **The Verb Tier System**
  In each round, the group must agree on one **Lede Verb** to describe the finding. This commits them to a confidence level.
  *   **Tier 1 (Weak):** *Suggests, May, Linked to.* (Safe, low reward)
  *   **Tier 2 (Moderate):** *Shows, Drives, Correlates.* (Balanced)
  *   **Tier 3 (Strong):** *Proves, Causes, Is.* (High risk, high reward)

  **The Fate System**
  After they commit, you reveal the card's **Fate** (what happened to this finding 10+ years later).
  *   **Confirmed:** The finding holds up.
  *   **Refined:** The mechanism changed, but the core claim stands.
  *   **Overturned:** The finding is false or retracted.

  **The Scoring Matrix (The Engine)**
  This is where the lesson lives. The points are asymmetric to force a dilemma.

  | Verb Tier | If Confirmed | If Refined | If Overturned |
  | :--- | :--- | :--- | :--- |
  | **Tier 1 (Weak)** | **1 pt** (Missed Scoop) | **1 pt** (Safe) | **2 pts** (Vindicated) |
  | **Tier 2 (Mod)** | **4 pts** (Good Story) | **2 pts** (Okay Story) | **-2 pts** (Correction) |
  | **Tier 3 (Strong)**| **10 pts** (Pulitzer) | **3 pts** (Overreach) | **-10 pts** (Retraction)** |

  **\*The Trap:** If a student hedges (Tier 1) on a Confirmed finding, they get 1 point. If they had gone Strong, they get 10. Hedging is punished as "cowardice" when the science is solid. If they go Strong on an Overturned finding, they lose 10 points. Over-confidence is punished as "malpractice" when the science is fluid.

  ### 3. The Deck (5 Rounds)
  *Do not use phlogiston or ether.* Use 20th/21st-century examples where the journalistic framing matters. The deck is ordered to manipulate their strategy.

  *   **Round 1 (1920s): Vitamins & Scurvy.**
      *   *Finding:* "Deficiency of specific dietary factors causes scurvy/rickets."
      *   *Fate:* **Confirmed.** (Mature biochemistry).
      *   *Lesson:* Early confidence pays off.
  *   **Round 2 (1950s): Saturated Fat & Heart Disease.**
      *   *Finding:* "Dietary saturated fat causes coronary heart disease."
      *   *Fate:* **Refined.** (It's more complex; sugar/inflammation play roles; fat isn't a simple poison).
      *   *Lesson:* Nuance is required; "Causes" is too strong.
  *   **Round 3 (1980s): Cold Fusion.**
      *   *Finding:* "Nuclear fusion achieved at room temperature in electrolytic cell."
      *   *Fate:* **Overturned.** (Experimental error).
      *   *Lesson:* Extraordinary claims require extreme hedging.
  *   **Round 4 (1990s): Hormone Replacement Therapy (HRT).**
      *   *Finding:* "Estrogen therapy protects post-menopausal women against heart disease."
      *   *Fate:* **Overturned.** (WHI study showed increased risk).
      *   *Lesson:* Epidemiology is churn-heavy. By now, smart groups are hedging heavily.
  *   **Round 5 (2010s): Gravitational Waves.**
      *   *Finding:* "LIGO detects ripples in spacetime from black hole merger."
      *   *Fate:* **Confirmed.** (Nobel Prize, robust physics).
      *   *Lesson:* **The Kick.** If they hedged Round 5 because Rounds 3 & 4 overturned, they lose the "Pulitzer." The field matters.

  ### 4. Timeline (75 Minutes)
  *   **00:00 – 00:10: Intro.** Explain the PMI briefly: "Past science was wrong; will current science be wrong?" Explain the game is a simulation of that risk.
  *   **00:10 – 00:15: Rules & Grouping.** Split into 6 tables. Hand out score sheets.
  *   **00:15 – 00:55: Gameplay (40 mins).**
      *   Read the Finding (2 mins).
      *   Table deliberation & Verb Commitment (3 mins).
      *   Reveal Fate & Score (3 mins).
      *   *Crucial:* After Round 3 and 4, ask the room: "How many of you are moving to Tier 1 verbs?" Show of hands.
  *   **00:55 – 01:00: Tally.** Tables calculate total score. Write scores on the whiteboard.
  *   **01:00 – 01:15: Debrief.** (See below).

  ### 5. The Debrief (Mapping Play to Philosophy)
  This is where you convert the game points into the lesson.

  **Step 1: The Empirical Track Record**
  Ask them to count the Overturns in the deck. (2 Out of 5 = 40% churn).
  *   *Say:* "If you knew at Round 1 that this specific magazine had a 40% retraction rate, how would you have played?"
  *   *Point:* The Pessimistic Meta-Induction isn't a universal law; it's an empirical claim about a specific field's reliability. Nutrition (Rounds 2 & 4) has high churn. Physics (Round 5) has low churn.

  **Step 2: The "Cynic" Problem**
  Find the table that hedged (Tier 1) on Round 5.
  *   *Say:* "You survived the churn, but you missed the story of the decade. In journalism, safety has an opportunity cost. If you write 'may' when the science says 'is,' you aren't being rigorous; you're being useless."
  *   *Point:* Hedging by reflex is an epistemology with a track record, and that track record includes failing to inform the public about real breakthroughs.

  **Step 3: The Realist Reply**
  *   *Say:* "Notice Round 1 and Round 5 were stable. These represent 'Mature Sciences.' Realists argue PMI fails because it treats all theories equally. It ignores that some fields have 'locked in' truths (gravity, germ theory). Your job is to distinguish the frontier from the core."

  ### 6. Predictable Failures & Fixes

  **Failure 1: The "Coward's Run"**
  *   *What happens:* One table picks Tier 1 (Weak) for every single round. They end up with a positive score (2+1+2+2+1 = 8 points) while the aggressive tables crash on Round 3 & 4. They feel vindicated.
  *   *The Fix:* In the debrief, highlight the *Opportunity Cost*. The winning table likely scored 20+ points. The Cowards survived but lost the game.
  *   *Script:* "You didn't get retracted, but you also didn't publish a magazine anyone would read. Journalism requires risk. The PMI argument, taken to extremes, paralyzes communication."

  **Failure 2: The "Scoop Chaser"**
  *   *What happens:* A table picks Tier 3 (Strong) every time. They win Round 1, crash hard on Rounds 3 & 4 (-10 each), and end with a negative score.
  *   *The Fix:* Use them as the cautionary tale for the "Replication Crisis."
  *   *Script:* "This is what happens when you treat press releases as facts. The PMI exists to stop you from doing exactly this."

  **Failure 3: Time Creep**
  *   *What happens:* Students argue about the science history ("Wait, wasn't the fat thing more nuanced?").
  *   *The Fix:* You are the Editor-in-Chief. "The card says Overturned. Debate the headline, not the history. You have 60 seconds."

  ### 7. What The Game Cannot Reproduce (Be Straight About This)
  In the final 5 minutes, admit the simulation's limits. This builds trust.

  1.  **The God's Eye View:** In the game, *you* know the Fate (Truth). In reality, journalists never know if a finding is "Confirmed" or "Overturned" at the moment of writing. They are betting on probabilities, not certainties.
  2.  **The "Why" of Change:** The game treats Overturns as random bad luck. In reality, theories change because of *new tools* (telescopes, CRISPR) or *new paradigms*. Understanding *why* science changes is more valuable than knowing *that* it changes.
  3.  **Consensus vs. Single Study:** The game presents single findings. Real journalism is about weighing a consensus. The PMI applies less to meta-analyses and more to single-study press releases.

  ### 8. Instructor Cheat Sheet (The "Field" Variable)
  To really drive the point home about **Reference Classes**, you can run a variant if you have time or a smaller group:
  *   **Deck A (Nutrition/Psych):** 3 Overturned, 2 Confirmed. (PMI is strong here).
  *   **Deck B (Physics/Chem):** 1 Overturned, 4 Confirmed. (Realism is strong here).
  *   *If you split the room:* Give half the tables Deck A and half Deck B.
  *   *The Reveal:* Compare scores. The "Hedge Everything" strategy wins on Deck A but loses on Deck B.
  *   *The Lesson:* "Don't ask 'Is science true?' Ask 'Which science is this?'"

  ### 9. Why This Works for Journalists
  It moves the PMI from a philosophical abstract ("All theories are false") to an editorial budgeting problem ("How much credibility capital do I spend on this lede?"). It forces them to realize that **skepticism is a resource** that can be depleted. If you hedge everything, you have no credibility capital left to spend when a truth actually emerges.

  **Prize:** Give the candy to the table with the highest score, but give a "Consolation Prize" (one piece of candy) to the table that survived without any negative rounds. It reinforces the trade-off.
