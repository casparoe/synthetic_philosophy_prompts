answer: |-
  **MEMORANDUM**

  **TO:** Fairmont Elections and Charter Commission
  **FROM:** Commissioner [Your Name]
  **DATE:** October 10
  **SUBJECT:** Recommendations Regarding Riverbend Neighbors First Initiative

  **Introduction**

  We face a tight statutory deadline. The county requires final ballot language nine days after our Thursday meeting. Our role is procedural, not政策性 (policy-making). We cannot block this measure based on perceived flaws, but we must ensure the voters understand what they are voting on. Below are my recommendations on the four items before us, followed by an analysis of the measure's legitimacy and a proposed workflow.

  **1. Ballot Title and Summary**

  **Recommendation:** Reject both the City Attorney's draft and the Sponsors' draft. Adopt a neutral description of the mechanism.

  The Attorney's draft ("Limits Housing Construction...") describes an outcome, which risks appearing argumentative. The Sponsors' draft ("Neighborhood Right to Vote...") uses advocacy language ("Right") that presupposes a moral claim. Our charter requires us to state the chief purpose and effect without argument.

  I propose: *"Requires Neighborhood Election for Certain Housing Projects and Modifies Comprehensive Housing Plan."*

  This title describes the process (an election) and the legal effect (modifying the plan) without characterizing the result as either a "limit" or a "right." The summary must explicitly state that approval requires a majority vote of registered voters within a 400-foot radius, and that the city's state-mandated housing allocation plan would be repealed. Voters must know that a "Yes" vote removes the city's current compliance framework.

  **2. Fiscal Impact Statement**

  **Recommendation:** Print a fiscal impact statement that explicitly includes exposure to state penalties.

  Some colleagues suggest omitting the state-law exposure regarding the comprehensive plan repeal because it is contingent on future litigation. I disagree. The initiative itself concedes the repeal of the 6,200-unit commitment. State law currently mandates fines and allows judicial bypass of local zoning for non-compliant cities. This is a foreseeable financial liability, not speculation. Omitting this would violate our duty to inform voters of the chief effect. The statement should read: *"May result in state fines and legal costs associated with non-compliance with regional housing allocation laws."*

  **3. Counter-Question Proposal**

  **Recommendation:** Do not place a non-binding counter-question on the ballot.

  While I understand the desire to gauge support for transit-oriented housing, this falls outside our commission's authority. We administer initiatives brought by citizens, not policy questions generated by the commission to balance public sentiment. Placing a counter-question risks the appearance of using procedural power to dilute the initiative's impact. If voters want to signal support for transit housing, a separate citizen initiative is the proper vehicle. We should remain neutral arbiters.

  **4. Certification of Signatures**

  **Recommendation:** Certify the initiative as-is.

  The Clerk has verified 4,812 valid signatures against a threshold of 3,900. There are no procedural defects on the record. Our discretion ends at verification. Disagreement with the policy does not constitute grounds for rejection.

  **The Legitimacy of the Measure**

  In drafting these recommendations, I have struggled to separate my personal stake from my procedural duty. I live in Riverbend. I rent. Under this measure, my neighbors would vote on my landlord's projects, and I would be ineligible for the right of first refusal because I haven't lived here eight years. It is easy to view this measure as exclusionary. However, we must acknowledge the strongest honest case for its legitimacy, or we risk wrapping our own policy preferences in procedural language.

  Proponents argue this is about community stability and displacement prevention. The woman who testified about being priced out in 2011 represents a real constituency: long-term residents who feel disconnected from decisions that radically alter their streets. From their perspective, the current zoning process is opaque and dominated by developers. This measure democratizes density decisions by returning veto power to the immediate vicinity. It prioritizes existing social networks over new housing supply.

  Furthermore, the right of first refusal attempts to ensure that if change happens, existing residents benefit financially. While economically complex, the intent is to prevent wealth extraction by outside investors. Finally, repealing the comprehensive plan commitment is a deliberate choice to prioritize local control over state mandates. Voters may legitimately decide that state housing allocations infringe on local sovereignty, even if there is a financial cost. Our job is not to decide if these trade-offs are wise, but to ensure the ballot language clearly explains them. If we bias the title against these goals, we undermine the democratic process just as much as if we biased it for them.

  **Timeline and Next Steps**

  To meet the nine-day filing deadline, we must adhere to the following schedule:

  *   **Thursday (Meeting):** Vote on Title, Summary, Fiscal Statement, and Certification.
  *   **Friday:** City Attorney revises language based on Thursday's vote.
  *   **Monday:** Commission reviews revised language via email circulation.
  *   **Wednesday:** Final approval via email vote.
  *   **Following Monday (Day 9):** File certified language with County Clerk.

  Any delay in the email review phase jeopardizes the filing. I ask that all commissioners commit to responding to the Monday draft within 24 hours.

  **Conclusion**

  We are tasked with facilitating a vote, not guiding the outcome. By certifying the signatures, providing a neutral title, and disclosing the fiscal risks of state non-compliance, we fulfill our charter obligations. We allow the voters to weigh the value of neighborhood control against the need for housing supply. That is the decision the charter assigns to them, not to us.

  I look forward to discussing this Thursday.
