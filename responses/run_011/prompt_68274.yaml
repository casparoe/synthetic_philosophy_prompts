answer: |-
  ### Part 1: The Exam Question

  **University of [Redacted]**
  **Department of Philosophy**
  **Course: PHIL409 – Philosophy of Computation**
  **Take-Home Final Examination**

  **Time Allowed:** 48 Hours
  **Word Limit:** 1200–1500 words
  **Weight:** 50% of Final Grade

  **Question 1: The Aarhus Relaxation Solver**

  Consider the following stipulated scenario:

  A research group (the "Aarhus people") constructs an analog electrical network they call a *relaxation solver*. The device accepts an input encoding a Turing machine $M$ and an input $n$. The network is left to settle into a physical equilibrium. The group claims the equilibrium voltage $V$ is a real number whose binary expansion encodes the halting function $H(M, n)$. Specifically, the answer is readable off the $k$-th binary digit of $V$, where $k$ scales with the description length of $M$ and $n$. Consequently, larger inputs demand arbitrarily higher precision from the voltmeter.

  The group publishes readouts for several thousand instances, each accurate to the requisite number of digits. Every published result matches the known halting status of the pair $(M, n)$. They announce they have physically computed a non-recursive function, providing a counterexample to the Physical Church-Turing Thesis (PCTT).

  Critics object that any physical readout is finite-precision. Therefore, one cannot distinguish whether the network tracks a hypercomputational function or merely a recursive function that agrees with the halting function on all tested inputs.

  **Write an essay addressing the following:**

  1.  Analyze the critics' objection. Does this limitation merely mean the Aarhus claim is *currently* unconfirmed, or does it imply the claim is *structurally* unconfirmable by experimental means?
  2.  Evaluate the status of the Physical Church-Turing Thesis in light of this scenario. If no finite set of measurements can falsify the PCTT (because any data fits a recursive model), is the PCTT an empirical hypothesis about the world, a definitional constraint on what counts as "computation," or a methodological norm for physics?
  3.  Conclude by specifying what a genuine physical falsification of the PCTT would require, if such a thing is possible at all.

  ***

  ### Part 2: Model Answer

  **The Epistemic Horizon of Hypercomputation**

  The Aarhus scenario presents a seductive challenge to the Physical Church-Turing Thesis (PCTT): the claim that any function physically computable by a realistic machine is Turing-computable. If the relaxation solver genuinely outputs the halting function, the PCTT is false. However, the objection regarding finite precision reveals a deeper philosophical problem than mere experimental error. It suggests that the dispute is not about the physical world alone, but about the relationship between physical measurement and mathematical idealization.

  The core difficulty lies in the underdetermination of the function by the data. The Aarhus group provides a finite set of input-output pairs. Mathematically, for any finite sequence of values generated by the halting function, there exist infinitely many recursive functions that produce the exact same sequence up to that point. This is not a limitation of current technology; it is a logical feature of induction. No matter how many instances the Aarhus people verify, a skeptic can always posit a Turing machine that hardcodes those specific results and diverges thereafter. Therefore, the claim is not merely unconfirmed; it is structurally unconfirmable via black-box observation. To verify the device computes the halting function, one would need to verify its behavior on *all* inputs, or possess a proof of the device's internal physics that guarantees the mapping holds for arbitrary precision.

  This leads to the physical constraints of the device itself. The scenario stipulates that the $k$-th digit depends on the input size. As inputs grow, the required voltage resolution increases without bound. In any realistic physical theory, there is a noise floor. Thermal noise, quantum fluctuations, and manufacturing tolerances impose a limit on distinguishable states. If the difference between a '0' and a '1' at the $k$-th digit for a large input falls below the Planck scale or the thermal noise threshold, the "value" ceases to be physically meaningful. A physical state that cannot be distinguished from its neighbor is not a carrier of information. Thus, the "equilibrium" the Aarhus people describe is likely a mathematical idealization of a physical system that, in reality, never settles or settles into a noisy distribution. If the device relies on infinite precision to encode infinite information, it requires a physical continuum that may not exist or may not be accessible to measurement.

  This brings us to the status of the PCTT. If the Aarhus device cannot be empirically distinguished from a standard computer running a very long lookup table, what work is the PCTT doing? If we treat the PCTT as a standard empirical law, like conservation of energy, it should be falsifiable. Yet, the Aarhus case suggests that any purported counterexample can be explained away by appealing to finite precision or hidden recursive complexity. This tempts one to conclude the PCTT is analytic—a definition of what we mean by "effective procedure." However, this is too hasty. The PCTT makes a claim about *physics*, not just mathematics. It asserts that the structure of our universe does not support hypercomputational trajectories (unlike, for instance, Malament-Hogarth spacetimes which might theoretically permit them but are not locally realizable).

  A more nuanced view is that the PCTT functions as a methodological norm or a regulative ideal. It is not strictly definitional, because we can conceive of physical worlds where it fails (e.g., Newtonian universes with infinite divisibility). But in *our* world, it acts as a constraint on theory construction. When a device claims to solve the halting problem, the burden of proof is on the claimant to show how the device escapes the noise/precision trade-off. Without a theoretical account of how the physical system maintains signal integrity against entropy at arbitrary scales, the claim is physically vacuous. The PCTT survives not because it is logically necessary, but because the alternative requires physical resources (infinite precision, infinite energy, or infinite time) that appear constitutively absent from our spacetime.

  Therefore, a genuine falsification of the PCTT would require more than matching input-output data. It would require a white-box analysis: a proof that the physical dynamics of the system map to the mathematical function *necessarily*, coupled with a demonstration that the system remains stable and distinguishable at scales where recursive approximations should fail due to resource bounds. Until then, the "hypercomputation" is indistinguishable from a complex approximation. The PCTT remains secure, not as a tautology, but as the only hypothesis consistent with the finitary nature of physical measurement. The Aarhus result is not evidence of a new physics, but a reminder that measurement is always finite, while computation is defined over the infinite.

  ***

  ### Part 3: Marking Scheme

  **Total Marks: 25**

  **1. Analysis of the Precision Objection (8 Marks)**
  *   **7–8 (First Class):** Explicitly distinguishes between *contingent* technological limits and *structural* underdetermination. Notes that any finite dataset is consistent with infinitely many recursive functions (curve-fitting problem). Argues that without a guarantee of behavior at the limit, the claim is unverifiable in principle, not just in practice.
  *   **5–6 (Upper Second):** Identifies the finite precision problem and noise. Notes that we can't measure infinite digits. May treat the issue as primarily technological rather than logical/structural.
  *   **3–4 (Lower Second):** Vague discussion of "measurement error." Fails to connect finite data to the existence of alternative recursive explanations.
  *   **0–2:** Fails to address the precision objection or misunderstands the halting function requirements.

  **2. Status of the Physical Church-Turing Thesis (8 Marks)**
  *   **7–8 (First Class):** Nuanced discussion of the PCTT's status. Rejects the simple dichotomy of "empirical vs. definitional." Argues for a mixed status (e.g., methodological norm, regulative ideal, or empirical claim protected by physical constraints). Explains *why* the thesis persists despite unfalsifiability (e.g., consistency with finitary physics).
  *   **5–6 (Upper Second):** Identifies the tension between empirical and definitional status. May lean too heavily on one side (e.g., "It's just a definition") without exploring the consequences for physics.
  *   **3–4 (Lower Second):** Treats PCTT as purely empirical or purely analytic without justification.
  *   **0–2:** Confuses PCTT with the mathematical Church-Turing Thesis.

  **3. Conditions for Falsification & Physical Constraints (5 Marks)**
  *   **5 (First Class):** Specifies that falsification requires more than data matching; requires a physical proof of stability/scaling (white-box analysis). Mentions noise floors, thermodynamics, or the distinction between mathematical reals and physical quantities.
  *   **3–4 (Upper Second):** Mentions noise or energy limits but doesn't connect them to the criteria for falsification.
  *   **1–2 (Lower Second):** Suggests better voltmeters would solve the problem.
  *   **0:** Ignores physical constraints.

  **4. Structure, Clarity, and Argumentation (4 Marks)**
  *   **4:** Cogent, well-structured essay. Clear thesis. Flows logically from the scenario to the general principle.
  *   **3:** Clear but perhaps disjointed. Good points but weak transitions.
  *   **2:** Hard to follow or repetitive.
  *   **1:** Disorganized.

  **Specific Deductions (Wrong Turns)**
  *   **(-5 marks):** Concluding the PCTT is *purely* analytic/definitional without argument (dismisses the physical claim too easily).
  *   **(-5 marks):** Treating the published readouts as *any* evidence for hypercomputation (fails the underdetermination test).
  *   **(-3 marks):** Sliding between "what humans can compute" and "what physical systems can do" (confusing effective procedures with physical processes).
  *   **(-2 marks):** Exceeding word limit by >10% or falling short by >10%.

  **Grade Boundaries (Guideline)**
  *   **20–25:** First Class
  *   **15–19:** Upper Second (2:1)
  *   **10–14:** Lower Second (2:2)
  *   **0–9:** Fail
