  2. There is no single introspectible feeling-tone common to all pleasurable experiences, much like "invertebrate" lacks a unique positive anatomical trait (Target: Phenomenology/Concept). This is substantive and defensible but does not license shutdown, as hedonism can locate unity in attitude rather than feeling.

  3. "Pleasure" is a functional or disjunctive category defined by our pro-attitude toward experiences rather than intrinsic properties, analogous to "weed" being defined by garden context (Target: Concept/Function). This is substantive and defensible but does not license shutdown, as this merely shifts hedonism from sensory to preferential.

  4. There is no single neurobiological or metaphysical structure underlying all pleasurable states that explains their causal powers in the world (Target: World/Ontology). This is contentious and does not license shutdown, as ethical theories rarely depend on strict natural kind realism.

  5. Because "pleasure" is a wastebasket category, it fails to pick out any real property whatsoever, rendering hedonistic claims meaningless (Target: World/Reference). This is false; while it would license shutdown, the inference is invalid because wastebasket taxa like "invertebrate" still refer to real organisms amenable to study.
