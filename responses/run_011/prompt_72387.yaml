prompt: |-
  Been reading up on how the EU actually polices subsidiarity and something about it doesn't sit right with me. The substantive test in the treaty is purely about effectiveness: the Union may only act where the member states can't sufficiently achieve the objectives on their own and can be better served centrally, by reason of scale or cross-border effects. But the procedure for enforcing that test hands the judgement to the national parliaments — they get every draft, they have eight weeks to send in a reasoned opinion alleging a breach, and if a third of them object the Commission must review the proposal and justify itself, though it can carry on regardless. Regions and cities get no standing whatsoever, even though the principle is nominally about pushing decisions to the lowest level that can handle them.

  So what theory of political legitimacy does that combination presuppose? One limb reads like a neutral efficiency calculation about which tier does the job best; the other reads like a jurisdictional bargain between rival polities, since the only parties entitled to complain are precisely the ones losing the powers. Reconstruct the implicit theory, and be careful to separate what the practice strictly requires from what merely happens to fit it — plus anywhere the machinery is loose enough that a quite different theory would license it just as well. Then tell me what would have to change, procedurally rather than rhetorically, if the efficiency reading were adopted in earnest, and what thier would be if the bargain reading were.
reasoning: |-
  Here's a thinking process that leads to the suggested analysis:

  1.  **Deconstruct the User's Query:**

      *   **Core Observation:** The user identifies a tension in the EU's subsidiarity policing mechanism.
          *   *Substantive Test:* Efficiency/Effectiveness-based (Can Member States do it? Is EU action better due to scale/cross-border effects?). This sounds technocratic/utilitarian.
          *   *Procedural Enforcement:* Political/Jurisdictional (National Parliaments get to object, Regions/Cities don't). This sounds like a power struggle between sovereign entities.
      *   **The Task:**
          1.  Reconstruct the implicit theory of political legitimacy presupposed by this combination.
          2.  Distinguish between what the practice *strictly requires* vs. what *fits* it (loose coupling).
          3.  Identify where the machinery is loose enough to license a different theory.
          4.  Propose procedural changes (not rhetorical) if the "Efficiency Reading" were adopted in earnest.
          5.  Propose procedural changes if the "Bargain Reading" were adopted in earnest.

  2.  **Initial Analysis & Theoretical Framing:**

      *   *The Tension:* The user is spot on. Subsidiarity is often described as a principle of *governance* (doing things at the right level for effectiveness) but policed as a principle of *sovereignty* (protecting national competence against central encroachment).
      *   *Legitimacy Theory:* What combines technocratic efficiency with inter-governmental veto power? It sounds like a hybrid of *Output Legitimacy* (getting results) and *Input Legitimacy* (via state representation). It's not purely federal (people-centric) nor purely confederal (state-centric). It's a "Compound Republic" or "Multi-Level Governance" model, but specifically one that privileges the *Member State* as the gatekeeper of the *People's* interest, assuming the State knows best whether it can handle the task.
      *   *The "Loose" Parts:* The "Yellow Card" system (1/3 threshold) is weak. The Commission can ignore it (mostly). The Court of Justice (CJEU) is reluctant to intervene. This looseness allows the system to function as a political signal rather than a legal hard stop.

  3.  **Drafting the Reconstruction (The Implicit Theory):**

      *   *Name:* Let's call it "Guarded Competence" or "State-Mediated Efficiency."
      *   *Core Logic:* The EU is legitimate only if it adds value (Efficiency). But who decides if it adds value? Not the citizens directly, not the regions, but the *Member States* (Bargain).
      *   *Why?* Because the Member States are presumed to be the primary repositories of democratic legitimacy. If they say "we can do this," the EU shouldn't interfere.
      *   *The Tension:* The test asks "Is this effective?" but the enforcers ask "Is this ours?"
      *   *Strict Requirements:* National Parliaments must be consulted. Commission must justify.
      *   *Loose Coupling:* The Commission doesn't *have* to withdraw. The CJEU rarely strikes down laws on subsidiarity alone. Regions are excluded (Committee of the Regions is advisory).

  4.  **Analyzing the "Loose Machinery" (Alternative Theories):**

      *   What else could fit?
      *   *Federal Supremacy:* The current system is so weak it basically allows the EU to act unless there's massive outrage. This fits a theory where the EU is the default actor, and subsidiarity is just a speed bump.
      *   *Deliberative Democracy:* The process forces justification, even if the outcome doesn't change. This fits a theory where legitimacy comes from reason-giving, not veto power.

  5.  **Developing the Counterfactuals (Procedural Changes):**

      *   *Scenario A: Efficiency Reading in Earnest (Technocratic/Utilitarian).*
          *   *Goal:* Ensure action happens at the level that actually works best.
          *   *Problem with current:* National Parliaments are biased (they want to keep power). Regions are ignored (often better suited for implementation).
          *   *Changes:*
              *   Independent impact assessment body (not Commission self-assessment).
              *   Standing for Regions/Cities (they often handle the "sufficiency" test).
              *   Burden of proof reversal (Commission must prove *positive* added value with data, not just assertion).
              *   Judicial review hardened (CJEU must scrutinize evidence, not just manifest error).
      *   *Scenario B: Bargain Reading in Earnest (Confederal/Sovereigntist).*
          *   *Goal:* Protect national sovereignty as a primary good.
          *   *Problem with current:* 1/3 threshold is too high. Commission can ignore.
          *   *Changes:*
              *   "Red Card" (majority veto stops the law).
              *   Standing for Executives (Governments, not just Parliaments).
              *   Opt-out mechanisms automatically triggered.
              *   CJEU deference to National Parliamentary assessment (if they say "we can do it," Court accepts it).

  6.  **Refining the Argument (Self-Correction/Nuance):**

      *   *Check:* Did I address the "Regions and cities get no standing" point? Yes, crucial for the Efficiency reading.
      *   *Check:* Did I distinguish strict requirements vs. loose fit? Yes, the "Yellow Card" is procedural, the outcome is discretionary.
      *   *Check:* Is the tone appropriate? Analytical, legal-political theory focused.
      *   *Nuance:* The "Efficiency" test in the treaty (Art 5 TEU) *is* the law. The "Bargain" is the *protocol*. The tension is between the *norm* and the *enforcement mechanism*.
      *   *Legitimacy Type:* It's essentially "Executive Federalism" masked as "Parliamentary Oversight." The real bargain is between the Commission and National Governments, mediated by Parliaments.

  7.  **Final Polish:** Structure the response clearly.
      *   Introduction: Acknowledge the insight.
      *   Part 1: The Implicit Theory ("State-Mediated Consequentialism").
      *   Part 2: Strict vs. Loose (The "Yellow Card" reality).
      *   Part 3: Alternative Theories licensed by the looseness.
      *   Part 4: Procedural Reforms for Efficiency.
      *   Part 5: Procedural Reforms for Bargain.
      *   Conclusion: Summary of the trade-off.

  8.  *(Self-Correction during drafting)*: Make sure to emphasize that under the current treaty, the Commission *can* maintain the proposal even after a Yellow Card. That's the key "looseness." Also, note that the CJEU applies a "manifest error" test, which is extremely deferential. This supports the "Bargain" view (political question) over the "Efficiency" view (justiciable fact).

  9.  *(Final Review against constraints)*: Ensure I answer "what theory of political legitimacy." It's a hybrid: *Intergovernmental Consequentialism*. Legitimacy derives from outcomes (efficiency) but is authenticated by state consent (bargain).

  10. **Proceed to generate output.** (Mental outline complete).
answer: |-
  Your observation cuts to the heart of the EU's constitutional ambiguity. You have identified a category error in the architecture of Article 5 TEU and Protocol No. 2. The substantive norm is **consequentialist** (act only if it works better), but the enforcement mechanism is **contractualist** (only the parties to the contract can object).

  Here is the reconstruction of the implicit theory, the analysis of its loose coupling, and the procedural divergences required to resolve the tension.

  ### 1. The Implicit Theory: State-Mediated Consequentialism

  The current machinery presupposes a theory of legitimacy we might call **State-Mediated Consequentialism**.

  *   **The Consequentialist Limb:** The *reason* for the Union's existence is output legitimacy. It is not legitimate because it represents a European *demos* (input legitimacy), but because it solves problems states cannot. The substantive test ("scale or effects") is a utilitarian calculation.
  *   **The State-Mediated Limb:** The *arbiter* of that calculation is not an independent technocrat, nor the citizenry, nor the sub-national units, but the Member State legislatures.

  **The Theory:** This presupposes that the Member State is the epistemically privileged observer of its own capacity. It assumes that if a National Parliament says, "We can handle this," that statement is both a political claim of sovereignty and a factual claim of capacity. Therefore, the legitimacy of the EU acting depends on the **acquiescence of the losers**.

  It treats subsidiarity not as a human right or a strict legal boundary, but as a **comity rule** between sovereigns. The National Parliaments are not acting as agents of the citizens regarding *policy preference*, but as agents of the State regarding *competence jurisdiction*.

  ### 2. Strict Requirements vs. Loose Coupling

  To understand where the theory frays, we must separate the hard wire from the slack.

  **What the Practice Strictly Requires:**
  1.  **Transmission:** All draft legislative acts must be sent to National Parliaments (NPs).
  2.  **Timing:** An 8-week window must be observed before a proposal can be adopted.
  3.  **Reasoning:** The Commission must justify the proposal with qualitative and quantitative indicators (Impact Assessments).
  4.  **Review:** If the "Yellow Card" threshold (1/3 of votes) is met, the Commission must review and issue a reasoned opinion on why it is maintaining the proposal.

  **Where the Machinery is Loose (The "Fit" rather than "Require"):**
  1.  **The Outcome:** The Commission is *not* required to withdraw the proposal after a Yellow Card. It can maintain it. This decouples the objection from the result.
  2.  **The Standing:** Regions with legislative powers (e.g., German *Länder*, Belgian Regions) are channeled through National Parliaments. They have no direct standing. This fits the "State as Unitary Actor" theory but contradicts the "Lowest Effective Level" theory.
  3.  **The Judicial Standard:** The Court of Justice of the EU (CJEU) reviews subsidiarity claims under a "manifest error of assessment" standard. They do not re-run the efficiency calculation; they only check if the EU institution was obviously irrational.

  **Alternative Theories Licensed by the Looseness:**
  Because the enforcement is so weak, the current machinery licenses a theory of **Deliberative Supremacy**.
  *   *Theory:* The point of the procedure is not to stop EU action, but to force the Commission to articulate *why* it is acting. Legitimacy is generated through the *process of justification*, not the *outcome of veto*.
  *   *Why it fits:* The Commission can ignore the Yellow Card, provided it writes a good memo explaining why. This turns subsidiarity from a jurisdictional shield into a transparency mechanism. The "Bargain" is illusory; the real function is administrative discipline.

  ### 3. Procedural Changes for the "Efficiency Reading"

  If we adopted the efficiency test in earnest—meaning we genuinely want decisions taken at the level that produces the best outcome, regardless of who holds the pen—the current bias toward Member States is a bug, not a feature. National Parliaments are biased toward hoarding competence, not optimizing governance.

  **Required Procedural Changes:**
  1.  **Direct Standing for Regions:** Grant legislative regions direct access to the subsidiarity complaint mechanism. If a German *Land* or a Scottish Parliament can implement a directive more effectively than Berlin or London, the "lowest level" principle requires they be heard directly, not filtered through a national capital.
  2.  **Independent Impact Authority:** Remove the Impact Assessment from the Commission's control. Create an independent EU regulatory oversight body (similar to the US OIRA but with teeth) to verify the "cross-border effects" claim. Currently, the Commission grades its own homework.
  3.  **Hardened Judicial Review:** Abolish the "manifest error" standard for subsidiarity. Require the CJEU to apply a "proportionality stricto sensu" test, weighing the evidence of national insufficiency against the burden of EU action.
  4.  **Sunset Clauses:** If the justification is "temporary cross-border effect," the legislation must automatically expire unless the efficiency test is re-run. This prevents competence creep where temporary centralization becomes permanent inertia.

  **The Trade-off:** This technocratizes the EU. It reduces the role of politics in defining competence and increases the role of evidence. It risks creating a "government by experts" where the definition of "effective" is itself a political choice masked as data.

  ### 4. Procedural Changes for the "Bargain Reading"

  If we adopt the bargain reading in earnest—acknowledging that subsidiarity is actually a sovereignty protection mechanism for Member States—the current system is too weak. It asks states to police a boundary but gives them no fence.

  **Required Procedural Changes:**
  1.  **The "Red Card":** Lower the threshold for stopping legislation. If a simple majority of National Parliaments object, the proposal must be withdrawn. This transforms the mechanism from a "request for review" to a "veto."
  2.  **Executive Standing:** Allow National *Governments* (Council members) to trigger subsidiarity objections directly, not just Parliaments. The sovereignty bargain is ultimately between executives; parliaments are often sidelined in EU negotiations anyway.
  3.  **Presumptive Competence:** Reverse the burden of proof in Court. If a National Parliament declares a matter within its sufficiency, the CJEU must presume the EU lacks competence unless the Commission proves otherwise beyond reasonable doubt. Currently, the presumption favors EU action.
  4.  **Opt-Out Automation:** A successful subsidiarity objection should automatically trigger an opt-out for the objecting states, even if the legislation proceeds for others. This acknowledges that if the "scale" argument fails for some, it cannot be universal.

  **The Trade-off:** This confederalizes the EU. It turns the Union into a treaty organization where the default is non-action. It solves the legitimacy deficit regarding sovereignty but creates a paralysis risk where cross-border problems (migration, climate, digital markets) cannot be solved because the "Bargain" allows a minority of states to block collective action.

  ### Summary of the Tension

  The current system is a **compromise without a decision**. It wants the *output* of a federal state (effective central action) with the *input* of a confederation (state consent).

  *   **The Efficiency Reading** requires treating the EU as a functional service provider, where competence follows capacity, regardless of political borders.
  *   **The Bargain Reading** requires treating the EU as a club of sovereigns, where competence follows consent, regardless of functional efficiency.

  The current procedure (Yellow Card, weak judicial review, no regional standing) is designed to **simulate the Bargain while delivering the Efficiency.** It gives National Parliaments the *theater* of a veto (to soothe sovereignty concerns) while retaining the *reality* of Commission discretion (to ensure the Union can function).

  The reason it "doesn't sit right" with you is that it asks National Parliaments to act as honest brokers of efficiency when their institutional incentive is to act as defenders of turf. It asks the Commission to act as a neutral efficiency expert when its institutional incentive is to expand its mandate. The procedure relies on both sides playing a role they are structurally incentivized to undermine.
