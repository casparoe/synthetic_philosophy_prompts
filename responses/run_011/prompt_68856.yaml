          *   Survival: Can it survive disassembly? Usually, endurantists rely on *substantial form* or *functional continuity*. But 50 years of rubble breaks function.
          *   Identity Carrier: It has to be the *matter* + *intent/history*. But if the matter is scattered, is it still one object?
          *   Verdict: Endurantism struggles here. It likely has to say the church *ceased to exist* in 1945 and a *new* one was created in 2005, linked by causality/memory. Or it has to stretch "wholly present" to include "scattered object."
      *   *Perdurantism (4D):* The object is a spacetime worm.
          *   Structure: One worm with a gappy or thin section? Or two worms?
          *   Temporal Parts: The 1945–1994 section is a "rubble temporal part."
          *   Identity Carrier: Spatiotemporal continuity. Even if the structure collapses, the *process* of the stones existing and being tracked continues.
