answer: |-
  # Session Plan: The Dial-and-Floor Model of Consent

  ## 1. Staged Outline and Minute Allocations

  **Total Duration:** 100 Minutes
  **Room Setup:** Cabaret style (four tables of four) to facilitate small-group aggregation before whole-seminar discussion.

  *   **00:00 – 00:05: Induction and Framing.**
      The tutor outlines the aim: to construct a working model of consent validity from the ground up. No mention is made of the 'dial-and-floor' terminology or the three hypotheses. Students are told they will act as adjudicators on a series of cases.
  *   **00:05 – 00:20: Blind Rating Phase.**
      Students receive a packet of eight vignettes. Individually, they assign a score (0–10) for Information, Pressure, and Capacity for each, and record a binary verdict (Valid/Invalid). They are instructed not to discuss scores yet.
  *   **00:20 – 00:35: Aggregation and Pattern Spotting.**
      Students gather at their tables to compare verdicts. The tutor collects the aggregate data on the whiteboard, specifically highlighting cases where the class is split. The tutor asks: "What rule were you using to distinguish the Valid from the Invalid?"
  *   **00:35 – 00:50: Hypothesis Generation and Naming.**
      Based on the board data, the tutor formalises three structures implied by student reasoning: Additive, Floor, and Shifting Floor. The 'dial' terminology is introduced here as a descriptive tool for what they have already done.
  *   **00:50 – 01:05: The Surplus-Trading Round.**
      Students are given specific 'deficit cards' and invited to propose trades between dials to salvage validity. The tutor records which trades are accepted and which are rejected as morally absurd.
  *   **01:05 – 01:15: The Detectability Intervention.**
      The tutor introduces the fourth variable (Detectability) via two new, short scenarios. The question shifts from "Was consent valid?" to "Was the recipient blameworthy?"
  *   **01:15 – 01:30: Debrief and Conceptual Mapping.**
      The tutor maps the activity onto philosophical distinctions: necessary vs. sufficient conditions, validity vs. reliance, and fixed vs. stakes-relative thresholds.
  *   **01:30 – 01:40: Optional Closing Module (or Extended Debrief).**
      Execution of the procedural consent exercise (see Section 6).
  *   **01:40 – 01:45: Buffer and Dismissal.**
      Time for administrative announcements and informal questions.

  ## 2. The Vignettes

  The following eight vignettes are designed to be read in under forty-five seconds each. The scores provided are the *intended* elicitation targets based on standard pre-testing of similar materials; the verdicts indicate what each hypothesis would predict if the class adheres strictly to that logic.

  *Hypothesis Parameters for Table Purposes:*
  *   **Additive:** Valid if Sum ≥ 21.
  *   **Floor:** Valid if Min ≥ 6.
  *   **Shifting Floor:** Valid if Min ≥ 6 (Low Stakes) or Min ≥ 8 (High Stakes).

  | ID | Text | Intended Scores (I, P, C) | Stakes | Additive Verdict | Floor Verdict | Shifting Floor Verdict |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **V1** | A patient signs a waiver for a routine blood draw. The nurse explains the procedure clearly (9). The patient is free to leave (9). The patient is sober but tired (6). | 9, 9, 6 | Low | **Valid** (24) | **Valid** | **Valid** |
  | **V2** | A participant joins a psych study. The risks are obscured (4). They are paid heavily to stay (3). They are fully alert (9). | 4, 3, 9 | Low | **Invalid** (16) | **Invalid** | **Invalid** |
  | **V3** | **Crossing Pair A.** A donor gives kidney tissue. Info is perfect (10). No coercion (10). But they are severely depressed and impulsive (4). | 10, 10, 4 | High | **Valid** (24) | **Invalid** | **Invalid** |
  | **V4** | **Crossing Pair A.** A donor gives kidney tissue. Info is adequate (7). Some family pressure exists (7). Mental state is stable (7). | 7, 7, 7 | High | **Valid** (21) | **Valid** | **Invalid** (Cap < 8) |
  | **V5** | **Crossing Pair B.** A student agrees to be filmed for a uni advert. Info is vague (5). No pressure (9). Capacity is full (9). | 5, 9, 9 | Low | **Valid** (23) | **Invalid** | **Valid** |
  | **V6** | **Crossing Pair B.** A student agrees to be filmed. Info is clear (7). No pressure (7). Capacity is full (7). | 7, 7, 7 | Low | **Valid** (21) | **Valid** | **Valid** |
  | **V7** | A soldier consents to a vaccine. Info is classified/withheld (2). Order is implicit (1). Capacity is high (10). | 2, 1, 10 | Med | **Invalid** (13) | **Invalid** | **Invalid** |
  | **V8** | A lover agrees to share passwords. Info is total (10). No threat (10). Capacity is clouded by infatuation (5). | 10, 10, 5 | Med | **Valid** (25) | **Invalid** | **Invalid** |

  ## 3. Crossing Pairs and Divergence Analysis

  **Pair 1: V3 vs. V4 (The High-Stakes Floor Test)**
  *   **Structure:** V3 has high surplus in Information and Pressure but a critical deficit in Capacity. V4 is moderate across the board.
  *   **The Divergence:** The Additive hypothesis predicts both are Valid (the surplus in V3 compensates for the Capacity deficit). The Floor hypothesis predicts V3 is Invalid (Capacity falls below the threshold) while V4 is Valid.
  *   **Significance of Divergence:** If the class splits on V3 (some Valid, some Invalid) but agrees on V4, it suggests the cohort is operating with mixed models. This is productive; it reveals that some students view Capacity as a *gateway* condition (Floor) while others view it as a *contributing* factor (Additive).
  *   **Significance of Convergence:** If the class unanimously declares V3 Invalid, the Additive hypothesis is effectively falsified for this group. However, if they unanimously declare V3 Valid, the Floor hypothesis is falsified.
  *   **Risk:** If the class converges on 'Invalid' for both, they may be applying a stricter Floor than anticipated (e.g., requiring 7 instead of 6). The tutor must check if the *reason* given is the low score on one dial or the low total sum.

  **Pair 2: V5 vs. V6 (The Information Floor Test)**
  *   **Structure:** V5 has a low Information score (5) but high Pressure/Capacity. V6 is moderate across all.
  *   **The Divergence:** Additive predicts both Valid. Floor predicts V5 Invalid (Info < 6) and V6 Valid.
  *   **Significance:** This tests whether 'Understanding' is fungible. Can one 'buy' valid consent to be filmed through sheer enthusiasm (Capacity) and lack of coercion (Pressure) even if one does not know what one is signing?
  *   **Risk of Non-Divergence:** If the class agrees V5 is Valid, they are endorsing a highly permissive Additive model. If they agree it is Invalid, they endorse a Floor model. The danger lies in students absorbing the tension without noticing: they may say V5 is Invalid but justify it using Additive language ("The total score was too low because Info was so bad"). The tutor must press for the *structure* of the justification, not just the verdict.

  ## 4. The Surplus-Trading Round

  **Mechanism:**
  Students are presented with a 'Deficit Card': **Information (4), Pressure (9), Capacity (9).** Total = 22. Under Additive, this is Valid. Under Floor (threshold 6), this is Invalid due to Information.
  Students are invited to propose a trade to make the card Valid under the Floor model. They may move points from one dial to another.

  **Engineered Absurdities:**
  1.  **The Ignorance Trade:** A student proposes moving 2 points from Information to Capacity. New score: Info (2), Cap (11).
      *   *Absurdity:* This implies that knowing *less* about the procedure makes one *more* capable of deciding. It highlights that the dials are not independent variables; Information is constitutive of Capacity.
  2.  **The Coercion Trade:** A student proposes moving 2 points from Pressure to Information. New score: Pressure (7), Info (6).
      *   *Absurdity:* This implies that increasing the pressure (reducing the room to decline) generates information. It highlights that Pressure is relational, not a resource.

  **Stop Point:**
  The tutor must halt the round immediately when a student objects on the grounds that "You can't trade *that*." This objection is the learning objective. It demonstrates that the dials are not a common currency. This is the moment to introduce the Floor hypothesis not as a mathematical rule, but as a recognition of non-fungible moral requirements.

  ## 5. The Detectability Phase and Debrief

  **Introduction (10 Minutes):**
  The tutor presents two modifications to V3 (The Kidney Donor with Depression).
  *   **Case D1:** The doctor knows about the depression but ignores it.
  *   **Case D2:** The depression is clinically invisible; the doctor asks standard screening questions and receives normal answers.
  *   **Question:** In D2, is the consent valid? (Yes, it is still invalid objectively). Did the doctor act wrongly? (Debatable).
  *   **Purpose:** To separate the *ontological status* of the consent from the *epistemic position* of the recipient.

  **Debrief Sequence (15 Minutes):**
  The tutor maps the activity to the following distinctions:
  1.  **Necessary vs. Sufficient:** The Floor model treats the thresholds as necessary conditions. The Additive model treats the scores as jointly sufficient. The activity shows that students intuitively treat Capacity as necessary (a veto), but Information as potentially additive.
  2.  **Invalidity vs. Impermissible Reliance:** The Detectability phase demonstrates that one can rely reasonably on an invalid consent. This protects the recipient from blame without validating the transaction.
  3.  **Fixed vs. Stakes-Relative:** Referring to V3/V4 (High Stakes) vs. V1 (Low Stakes), the tutor asks if the Capacity threshold should move. If students feel V1 (Cap 6) is acceptable but V3 (Cap 4) is not, they have intuitively adopted the Shifting Floor. The tutor formalises this: thresholds are functions of risk.

  ## 6. Optional Closing Module: Meta-Consent

  **Proposal:**
  At the start of the session (00:00), students sign a sheet agreeing that "One element of the seminar structure will be withheld until the end, and by signing you agree to this withholding." At 01:30, the tutor reveals that the 'withheld element' was the existence of this very clause, and asks the class to vote on whether their participation was valid.

  **Ethical Assessment:**
  This module is **indefensible** in a graded seminar context.
  1.  **Power Dynamics:** Students cannot freely withhold consent from a tutor who determines their marks. A 'signature' obtained under this asymmetry is not a valid data point for a lesson on consent; it is a demonstration of coercion.
  2.  **Pedagogical Integrity:** Deceiving students to teach them about deception undermines trust. If they discover the deception was manufactured for the sake of the lesson, they may feel manipulated rather than enlightened.
  3.  **Institutional Risk:** Many university ethics committees prohibit deception in teaching contexts without rigorous oversight, which a standard seminar does not possess.

  **Non-Deceptive Substitute:**
  **The Procedural Vote.**
  At 00:35 (during Aggregation), the tutor announces: "We are behind schedule. I am going to change the rules for the next phase. We will skip the small-group discussion and move straight to the whiteboard."
  *   **Action:** The tutor makes the change *without* asking for consent, despite the seminar norm of collaborative pacing.
  *   **Debrief:** At 01:30, the tutor asks: "I altered the procedure mid-stream. Did you consent to that? If not, was my action wrong? If I had asked at the start, would that have cured the imposition?"
  *   **Value:** This simulates the feeling of lost control and the retroactive rationalisation of authority without actual deception. It places students on the receiving end of a procedural override, which mirrors the 'Detectability' and 'Pressure' dynamics without breaching ethical boundaries.

  ## 7. Frank Failure List

  1.  **Spurious Precision:** Students will challenge the 0–10 scale. "Why is this a 6 and not a 7?"
      *   *Management:* Acknowledge the arbitrariness. State that the numbers are placeholders for 'more' or 'less', not psychometric data. If a student fixates on the number, ask them to describe the *qualitative difference* between a 6 and a 7.
  2.  **The Pressure/Capacity Collapse:** A sharp student will argue that high Pressure *just is* a reduction in Capacity (or vice versa). "If I hold a gun to your head, you aren't 'pressured', you lack the capacity to choose."
      *   *Assessment:* This is a **discovery to be welcomed**, not a bug. It suggests the tripartite model is not ontologically distinct.
      *   *Management:* Do not defend the separation. Allow the collapse. If they merge Pressure and Capacity, ask them to re-score the vignettes with two dials. This accelerates the session towards the 'Floor' conclusion (if one dial hits zero, the product is zero).
  3.  **The 'Valid but Wrong' Confusion:** Students will struggle to separate the validity of the consent from the morality of the act. (e.g., "He consented to be punched, so it's valid, but you still shouldn't punch him.")
      *   *Management:* Use the Detectability phase to pry these apart. Insist on the question: "Does the consent transfer the right?" before asking "Was the act kind?"
  4.  **Dominant Voices:** In the aggregation phase, one confident student may dictate the group score.
      *   *Management:* Enforce the 'Blind Rating' strictly. Collect individual sheets before allowing discussion. Use the variance in individual sheets as data ("Three of you scored this a 4, three scored a 9. Why?").

  ## 8. Honest Limitation Note

  This activity cannot reproduce two critical features of real-world consent:
  1.  **The Absence of the Consenter:** The students are adjudicating third-party scenarios. They do not feel the vulnerability of the consenting party. The model risks becoming a cold calculus that ignores the phenomenology of assent. You must supply in words what the room lacks: remind them that a '4' on the Capacity dial represents a frightened human being, not a low number.
  2.  **The Absence of Authority:** In reality, validity is often decided by a judge, a regulator, or a power-holder with standing to enforce the verdict. Here, validity is decided by a committee of peers with no power to remedy the violation. This creates a 'safe' environment for theorising that may not translate to high-stakes institutional decision-making. You must clarify that this model is for *analysis*, not necessarily for *adjudication* without further procedural safeguards.

  ## 9. Reflexive Assessment of the Consistency Test

  Does the consistency test in Section 3 give students genuine evidence about which hypothesis is correct?
  **No.** It dramatises the question rather than resolving it.

  **Explanation:**
  The exercise does not prove that the Floor model is 'true' and the Additive model 'false'. Moral reality is not settled by polling student intuitions on hypothetical vignettes. The divergence in responses only proves that the students' pre-theoretical intuitions are inconsistent or that they are operating with different implicit theories.

  **Value of the Exercise:**
  The worth lies in **explication**, not **verification**.
  1.  It forces students to make their implicit weighting explicit.
  2.  It reveals that 'consent' is not a single concept but a cluster of conditions that may interact differently in different contexts.
  3.  It demonstrates that any model they adopt will have counter-intuitive consequences (e.g., Additive allows trading Capacity for Information; Floor invalidates high-surplus cases due to single deficits).
  4.  It prepares them to read the literature not as a search for the 'correct' formula, but as a debate over which trade-offs are morally permissible.

  The session succeeds not if they leave believing in the Floor model, but if they leave understanding why they cannot simply add the scores up.
