      *   Actually, the stronger point: Seidenfeld showed that avoiding dilation requires violating other coherence principles (like conglomerability). You can't have it all.
      *   Verdict: Supervisor is right. Dilation is not incoherence. Friend is conflating "change in commitment" with "incoherent commitment."
      *   However, there *are* diachronic Dutch book arguments against specific updating rules that cause dilation, but they usually assume the agent must make a decision *now* based on the future interval. If the agent waits to update, no sure loss occurs.
