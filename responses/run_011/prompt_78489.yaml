prompt: |-
  Spent 38 years as a marine biologist, mostly staring at pigment patterns on snail shells, and I've only picked up philosophy since retiring — so forgive an old empiricist for wanting the spec before the products.

  My catalog was sorted by motif: bands, single lines, rows of dots, zigzags, chevrons, tents, blotches, and those little streaks running across the bands we called flames. Here's the wrinkle that's been eating at me. A shell is a time-series that got written down and frozen — the growing edge lays down pattern as it extends, so the surface is a record of a one-dimensional process running over time. Which means two shells can carry the same bands on the outside and have gotten there by completely different schedules, and the record doesn't tell you which. The pattern and the process that produced it come apart, and my motifs don't obviously belong to one side or the other.

  Now the philosophy of analogy I've been reading — the stuff about how a concept slips when you map one thing onto another, like those letter-string puzzles where the alphabet runs out at one end and "rightmost" has to slide over into something else — looks to me like exactly my problem. Is a row of dots a dashed line, or is it dots? Does a chevron slide into a zigzag or into a tent? And when I compare two shells, am I comparing the frozen patterns or the schedules that made them? I don't want answers yet. I want to know what I'm entitled to demand of an answer.

  So: write the desiderata. What would a theory of conceptual slippage have to deliver to be adequate to a microdomain like mine? For each requirement give me the case or the consideration behind it, not just the label. Say which ones are non-negotiable and which are really a camp's own commitments wearing a requirement's clothes — I suspect there are more of the second kind than the books admit. And if some subset can't be jointly satisfied, say so straight out: my hunch is that being fluid enough to permit slippage at all and being constrained enough to say which slippages are licensed are pulling in opposite directions, and if that's right then the list is the result, not the warm-up to one.

  Adequate for what, since that's the whole question: I want a theory good enough that, handed a new pair of shells and a half-formed analogy, it tells me which slippages a competent observer would license and which are a stretch, and predicts which of my borderline catalog entries people will genuinely disagree about. Anything that can't do that is decoration as far as I'm concerned.

  Stuff I'd guess belongs in there, use it or throw it out: fit has to come in degrees rather than yes/no; it has to explain why some cases feel obvious and some feel arbitrary rather than just reporting that they do; repeated runs on the same pair should cluster without the whole thing being deterministic; it has to work on pairs nobody has ever seen, so no lookup tables; it has to be something you could actually build and run, not a story about what an ideal observer would notice; and it mustn't peek at the answer key to decide after the fact which slippage was "right." Add whatever I've missed — especially anything about the vocabulary itself, because I could never find a border between band and stripe, and I want to know whether a theory is allowed to just accept that or has to explain it.

  Then tell me which single requirement does the most damage to the candidates on offer. Finish with a couple of lines each on how the Copycat-style architecture, structure-mapping theory, and a plain similarity-metric account (the contrast-model variety) do against your list — brief, no big scorecard. The thinking is in the list; the scoring is a garnish.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **Persona:** Retired marine biologist (38 years), empiricist, new to philosophy but sharp. Focused on snail shell pigment patterns (bands, dots, zigzags, etc.). Views shells as frozen time-series of growth processes.
      *   **Core Problem:** The distinction between *pattern* (the static output) and *process* (the generative schedule). Analogies between shells involve "conceptual slippage" (e.g., is a row of dots a dashed line?).
      *   **Task:** Write a list of *desiderata* (requirements) for a theory of conceptual slippage adequate for this microdomain.
      *   **Specific Constraints:**
          *   Explain the *case/consideration* behind each requirement, not just labels.
          *   Distinguish between *non-negotiable* requirements and *camp commitments* disguised as requirements.
          *   Acknowledge potential incompatibilities (fluidity vs. constraint).
          *   Goal: A theory that predicts licensed slippages vs. stretches on *new* pairs, without peeking at the answer key.
          *   Include user's suggestions (degrees of fit, non-deterministic clustering, buildable, no lookup tables, vocabulary issues).
          *   Identify the *single most damaging* requirement for current candidates.
          *   Briefly evaluate Copycat, Structure-Mapping Theory (SMT), and Similarity-Metric (Contrast Model) against the list.
      *   **Tone:** Respectful of the empiricist background, precise, philosophical but grounded, avoiding fluff/decoration.

  2.  **Deconstruct the Core Philosophical Tension:**
      *   The user identifies the heart of the problem: *Equifinality* (different processes yield same patterns) vs. *Multifinality* (same process yields different patterns due to noise/interruption).
      *   The "Conceptual Slippage" refers to how we map categories across these variations.
      *   The user wants to know what a theory *must* do to be useful, not just what sounds nice.

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Idea 1: Buildability.* User said "something you could actually build."
          *   *Refinement:* It needs to be computationally tractable or at least mechanistically specifiable. No "homunculus" explanations.
          *   *Status:* Non-negotiable for an empiricist.

      *   *Idea 2: Degrees of Fit.* User said "fit has to come in degrees."
          *   *Refinement:* Binary classification fails borderline cases (band vs. stripe). The theory needs a gradient of "licensedness."
          *   *Status:* Non-negotiable.

      *   *Idea 3: Process vs. Pattern.* The user's specific worry.
          *   *Refinement:* The theory must distinguish (or explicitly conflate) the static description and the generative history. It needs to handle the ambiguity of the "frozen time-series."
          *   *Status:* Non-negotiable for *this* domain, though maybe not for all analogy theories.

      *   *Idea 4: Vocabulary/Boundary Issues.* User mentioned "band vs. stripe."
          *   *Refinement:* The theory must account for vague predicates. It can't assume crisp categories exist beforehand.
          *   *Status:* Non-negotiable.

      *   *Idea 5: Prediction on Novelty.* User said "work on pairs nobody has ever seen."
          *   *Refinement:* Generalization capability. No lookup tables.
          *   *Status:* Non-negotiable.

      *   *Idea 6: Fluidity vs. Constraint.* User's hunch about opposite pulls.
          *   *Refinement:* The theory must explain *why* some slippages are blocked. If everything slips, nothing means anything.
          *   *Status:* Non-negotiable (the "Constraint Problem").

      *   *Idea 7: Consensus/Clustering.* User said "repeated runs... should cluster."
          *   *Refinement:* Intersubjective agreement without determinism. People disagree on borderlines, but agree on cores.
          *   *Status:* Non-negotiable.

      *   *Idea 8: No Peeking.* User said "mustn't peek at the answer key."
          *   *Refinement:* No post-hoc rationalization.
          *   *Status:* Non-negotiable.

      *   *Idea 9 (The "Camp Commitment" Check):* What do theories often demand that isn't actually needed?
          *   *Candidate:* "Logical Consistency" or "Truth Preservation." In analogy, truth isn't the goal; plausibility is.
          *   *Candidate:* "Explicit Representation of Deep Structure." Some connectionist models don't do this explicitly.
          *   *Selection:* The demand for *explicit structural isomorphism* is often a camp commitment (SMT) rather than a necessity for human-like slippage.

      *   *Idea 10 (The Incompatibility):* Fluidity vs. Constraint.
          *   *Analysis:* To allow slippage, you need flexibility. To prevent "anything goes," you need constraints. These are often in tension. The theory must resolve this trade-off, not just assert both.

  4.  **Selecting the "Most Damaging" Requirement:**
      *   Which one kills the most theories?
      *   *Similarity Metrics:* Fail on structure/process.
      *   *Structure-Mapping:* Fails on slippage/flexibility (too rigid).
      *   *Copycat:* Good on slippage, hard to scale/verify.
      *   *Winner:* The requirement to **handle vague predicates without crisp boundaries while maintaining non-deterministic consensus.** This hits the symbolic vs. sub-symbolic divide hard. Or, perhaps more sharply: **The requirement to distinguish process from pattern without access to the process.**
      *   *Decision:* The "Process/Pattern Ambiguity" combined with "No Peeking." Most theories assume the representation is given. The user's problem is that the representation *is* the problem. The requirement that the theory must *construct* the description from the raw input (the shell image) rather than taking pre-labeled nodes is the killer. Let's refine this to: **Representational Construction.** The theory can't take "band" as an input; it has to derive why something counts as a band.

  5.  **Evaluating the Candidates:**
      *   *Copycat (Hofstadter/Mitchell):* Built for slippage. Handles fluid concepts. But often criticized for being a "toy" domain (letters). Struggles with the "process vs. pattern" distinction unless explicitly coded.
      *   *Structure-Mapping Engine (Gentner):* Great for systematicity. Terrible at slippage. Assumes predicates are fixed. Fails the "band vs. stripe" vagueness test.
      *   *Similarity-Metric (Tversky):* Good for features. Fails on relations/process. Treats "dots" and "line" as feature overlaps, misses the generative transformation.

  6.  **Refining the Tone:**
      *   Speak to the biologist. Use their metaphors (growth edge, frozen time-series).
      *   Avoid academic jargon where possible, or define it through their lens.
