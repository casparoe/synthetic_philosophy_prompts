          3.  **Constructive Representation:** Can't take labels as input. (Non-negotiable).
          4.  **Constrained Flexibility:** The "Fluidity/Constraint" tension. (Non-negotiable).
          5.  **Intersubjective Clustering:** Why we agree on cores, disagree on edges. (Non-negotiable).
          6.  **Camp Commitment:** "Structural Isomorphism." (Optional/Disguised).
      *   *Incompatibility:* Acknowledge the tension between 4 and 3.
      *   *Most Damaging:* Constructive Representation (The "Input Problem").
      *   *Evaluations:* Copycat (Good on slippage, weak on process), SMT (Good on structure, rigid on slippage), Similarity (Surface level only).

  9.  **Polishing:** Ensure the distinction between "pattern" (static) and "process" (dynamic) is central to the desiderata, as that's the user's specific philosophical itch. Make sure the "camp commitment" section feels insightful, not just dismissive. (Self-Correction: Make sure to explicitly state which ones are non-negotiable).

  10. **Final Polish:** Check the "Most Damaging" argument. Is it really the hardest? Yes, because most theories assume a pre-processed symbolic representation. The user's problem is that the *perception* of the symbol is where the slippage happens.

