answer: |-
  ### Exam Question

  **Module:** Philosophy of Science & AI Interpretability
  **Time:** 45 Minutes
  **Marks:** 25

  **Question 1**

  Read the following case study carefully:

  > A technical report from 'Apex Labs' claims that three transformer language models contain a circuit they call the **priority gate**. This circuit is a small set of components whose output magnitude determines which of two competing continuation strategies the model adopts, exhibiting a fairly sharp threshold.
  >
  > The models are: **S** (small, 140M parameters), **L** (large, 7B parameters), and **R** (same architecture as L but RL-fine-tuned against a reward model).
  >
  > In **S** and **L**, automated circuit discovery identifies the gate as **three mid-layer attention heads**. In **R**, the same search procedure returns a structurally different configuration: **one attention head plus a two-layer MLP**, sitting in different layers, with a graded rather than sharp response curve. Benchmark behaviour regarding the continuation strategies is essentially unchanged across all three models.
  >
  > However, ablation results differ significantly. Knocking out the identified components costs **9.4% performance** on the benchmark in **L**, but only **1.2% in R**. Apex Labs explains this by claiming **R** possesses a **backup gate** that partly compensates when the primary gate is ablated; therefore, the priority gate is still present in **R** (same mechanism, differently implemented).
  >
  > A critic argues that **R** has **no priority gate at all**. They claim the search procedure merely looks for 'gate-shaped' statistical signatures and found one coincidentally. The tiny ablation effect suggests the behaviour in **R** is produced by a distributed, redundant process rather than a localized mechanism. The critic further notes that the Lab's matching metric compares intervention signatures and is invariant under the relabelling of components; thus, it cannot distinguish "same mechanism, different substrate" from "different mechanism, coincidentally matched signature."
  >
  > Apex Labs intends to deploy this identification procedure as an **anomaly detector**: any model in which the gate is missing or deformed will be flagged as unsafe.

  **Critically evaluate the Apex Labs claim that the priority gate in Model R is the *same mechanism* as in Model L. In your answer, you must address:**

  1.  The specific identity conditions for mechanisms required to sustain this claim, and which criteria (causal organisation, functional role, intervention signature, etc.) the Lab is implicitly committed to.
  2.  Whether the "backup gate" explanation is a licensed scientific inference or an *ad hoc* rescue of the identity claim.
  3.  Whether the dispute between the Lab and the Critic is a factual disagreement about the world or a choice of decomposition, and what this implies for the viability of the proposed anomaly detector.

  ***

  ### Model Answer

  The Apex Labs claim fails because it conflates functional role with mechanistic constitution, rendering their proposed anomaly detector circular. To assert that the circuit in Model R is the *same mechanism* as in Model L, the Lab must rely on identity conditions that their own evidence undermines.

  Under a New Mechanist account (e.g., Craver), a mechanism is defined by its entities and activities organised to produce a phenomenon. Identity across systems usually requires organisational invariance: the causal topology must be preserved even if the substrate changes (multiple realisability). Apex Labs, however, is not committed to organisational invariance. In L, the mechanism is three attention heads; in R, it is one head plus an MLP in different layers. The causal topology is distinct. Instead, the Lab is committed to **intervention signature matching** and **functional output**. They argue that because the input-output behaviour (continuation strategies) is similar, and the search algorithm finds a statistically similar signature, the mechanism is identical.

  This commitment is insufficient for mechanistic identity. As the Critic notes, the ablation asymmetry (9.4% drop in L vs 1.2% in R) is decisive. In L, the identified components are mutually manipulable with the phenomenon; they are necessary constituents. In R, the components are not necessary. The Lab's response—that a "backup gate" compensates—is an *ad hoc* hypothesis unless independently verified. In mechanistic science, positing unobserved components to save a generalisation is only licensed if those components are subsequently detected or if their necessity is derived from independent constraints. Here, the backup is posited solely to preserve the identity claim against ablation data. Without independent evidence of the backup's structure or location, the claim that R contains the *same* mechanism is unsupported. It is more parsimonious to accept the Critic's view: R achieves the function via a distributed, redundant process, not a localized gate.

  This leads to the deeper philosophical problem regarding the anomaly detector. The dispute between Lab and Critic is not merely factual; it is a disagreement about **decomposition grain and validity**. The Lab treats the output of their search procedure as discovering a pre-existing natural kind. The Critic treats it as imposing a pattern on the data. If the "priority gate" is defined *by* the search procedure that finds it, the detector becomes self-validating. It cannot flag a model as "missing the gate" because the search will always identify *something* that matches the signature threshold, or else define the gate as "deformed" by stipulation.

  For an anomaly detector to work, "the normal mechanism" must have determinate identity conditions independent of the detection algorithm. It must be possible for a model to *lack* the mechanism while retaining the function. By tying mechanism identity to functional signatures and search results rather than constitutive organisation, Apex Labs makes it impossible to distinguish a model with a different mechanism from a model with the same mechanism. Consequently, the detector cannot identify anomalies; it can only report on its own ability to fit patterns. The Lab's project collapses because they have not established that the priority gate is a robust mechanism rather than a interpretive fiction projected onto the weights.

  ***

  ### Marking Scheme (25 Marks)

  **Total:** 25 Marks
  **Pass Threshold:** 10 Marks

  | Move | Marks | Requirement | Common Pitfall (How to lose marks) |
  | :--- | :---: | :--- | :--- |
  | **1. Identity Conditions** | 5 | Explicitly states that mechanistic identity requires organisational/structural invariance (Craver/Bechtel), not just functional output. Identifies Lab as committed to *signature/functional* identity. | Confusing "multiple realisability" with "anything goes." Failing to notice the Lab ignores structural differences (Heads vs MLP). |
  | **2. Ablation & Mutual Manipulability** | 5 | Uses the ablation data (9.4% vs 1.2%) to argue that components in R are not necessary constituents (fails mutual manipulability). | Treating ablation scores as mere performance metrics rather than evidence for/against mechanistic constitution. |
  | **3. The "Backup" Critique** | 5 | Evaluates the "backup gate" as *ad hoc* because it lacks independent detection. Distinguishes between licensed inference (predictive success) and rescue devices. | Accepting the backup explanation as plausible without demanding evidence. Failing to use the term *ad hoc*. |
  | **4. Decomposition vs. Fact** | 5 | Addresses whether the dispute is about reality or decomposition. Recognises the Critic's point that the search procedure may be imposing structure (grain-sensitivity). | Treating the search procedure as neutral/objective. Ignoring the "choice of decomposition" aspect of the prompt. |
  | **5. Detector Circularity** | 5 | Concludes that if the search defines the mechanism, the detector is self-validating/circular. Anomaly detection requires independent identity conditions. | Discussing anomaly detection only as a technical problem, missing the philosophical circularity. |

  **Distinction Criteria (2:1 vs First Class)**

  *   **Solid 2:1 (15-19 marks):** Hits all five moves competently. Correctly identifies that the Lab relies on functional similarity rather than structural identity. Correctly labels the backup claim as *ad hoc*. Explains that the detector might be circular. The argument is clear but may treat the five points as a checklist.
  *   **First Class (20-25 marks):** Synthesises the moves into a unified argument. Specifically, connects the **failure of identity conditions** (Move 1 & 2) directly to the **failure of the anomaly detector** (Move 5). A First will explicitly argue that *because* the Lab cannot distinguish "different mechanism" from "same mechanism deformed," the concept of "anomaly" loses its truth conditions. They will also show nuance on the decomposition point: acknowledging that *some* choice of decomposition is inevitable, but arguing that the Lab's choice is unjustified by the ablation data. The writing is precise, and the position is decisive.
