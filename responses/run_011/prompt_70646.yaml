      Actually, the best test is: "Does the retraction sound like a *lie* (semantic) or a *fight* (social)?"
      I need to give the user a specific question to ask the group to tease this out. "Did you feel you were correcting a fact, or repairing a relationship?"

      *(Limitations)*: The game assumes cooperation. In fiction, characters *don't* cooperate. The game tests the *reader's* inference, not necessarily the *character's* intent. I need to make sure the user knows this distinction.

      Let's assemble.

      *   **Game:** "The Take-Back."
      *   **Rounds:** 1 (Context), 2 (Cold).
      *   **Scoring:** "The Stumble."
      *   **Debrief:** Implicature vs. Entailment vs. Face.
