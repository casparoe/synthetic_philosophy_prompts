answer: |-
  1. A physician tells you that a medication you began this week will dull numerical reasoning for about a month; you have just spent an hour on a calculation you find compelling, and no one else can check it for a week.
  A) I would discard the result until the medication wears off.
  B) I would retain the result but refrain from using it in further work.
  C) I would accept the result as sound, since the calculation itself is unchanged.

  2. A friend says out loud that she does not know whether what she believes is supported, and then continues to act and argue on that belief exactly as before.
  A) She is violating a norm governing what one may hold in mind.
  B) She is violating a norm governing what one may say to others.
  C) She is acting appropriately given her inability to change her mind.

  3. You learn that the intuition you are leaning on is reliably produced by a framing effect that reverses when the same quantities are presented differently; you read the alternative framing and still find your original conclusion compelling.
  A) I would treat the intuition as evidence against the conclusion.
  B) I would treat the intuition as neutral and look for other grounds.
  C) I would treat the intuition as preserved evidence for the conclusion.

  4. You discover that you slept four hours before writing the assessment that everyone now treats as your best piece of work.
  A) I would withdraw the assessment from consideration.
  B) I would submit the assessment but include a note about my condition.
  C) I would submit the assessment without qualification.

  5. A colleague you trust as a careful reader says there is a subtle error somewhere in the argument you have just given, but declines to say which step, on the grounds that telling you would spoil the exercise.
  A) I would cease to assert the argument until the error is found.
  B) I would continue to assert the argument but lower my confidence.
  C) I would continue to assert the argument with full confidence.

  6. A judge knows she is biased against a certain type of defendant but rules anyway based on the evidence presented.
  A) Her verdict is illegitimate regardless of the evidence.
  B) Her verdict is legitimate only if the evidence is overwhelming.
  C) Her verdict is legitimate because the evidence stands on its own.

  7. You are told you were impaired, and you have already tried twice to give up the belief and found that you simply cannot.
  A) I am failing to do what I ought to do.
  B) I am doing what I can, and that is enough.
  C) I am no longer subject to obligations regarding this belief.

  8. You re-derive the argument twice, slowly, and find no flaw anywhere in it, and you have no independent reason to think your re-checking is itself compromised.
  A) I would conclude the argument is sound despite the initial worry.
  B) I would conclude the argument is probably sound but not certain.
  C) I would conclude the argument remains questionable.

  9. Someone whose track record is mixed tells you that you are a far worse estimator of elapsed time than you suppose, and you notice the remark nagging at you even though nothing in the present question turns on time.
  A) I would adjust my future time estimates downward.
  B) I would disregard the remark as irrelevant to the current task.
  C) I would suspend judgment on my ability to estimate time.

  KEY

  (a) Position Mapping
  The following profiles map answer patterns to epistemological positions. Note that real respondents may vary, but dominant patterns indicate the following leaves.

  1. The Silencer (Total Defeat)
     - Pattern: Predominantly A choices (1A, 4A, 5A, 7C).
     - Core Claim: Information about your own untrustworthiness simply removes your entitlement to the first-order belief, so no mismatch is available.
     - Permits in Belief: No. The belief is no longer entitled.
     - Permits in Assertion: No. One cannot assert what one is not entitled to believe.

  2. The Dualist (Permissible Mismatch)
     - Pattern: Predominantly B choices (1B, 4B, 5B, 7B).
     - Core Claim: A mismatched pair of states can be entirely permissible when you cannot bring them into line.
     - Permits in Belief: Yes, if the belief is involuntary.
     - Permits in Assertion: No, or only with qualification (e.g., disclosing the condition).

  3. The Purist (Aim-of-Belief)
     - Pattern: Predominantly A choices (1A, 4A, 5A) but 7A.
     - Core Claim: Such a pair is never permissible because believing is aiming at the truth of what you believe.
     - Permits in Belief: No. Holding the belief violates the constitutive aim.
     - Permits in Assertion: No. Assertion expresses belief, which is violated.

  4. The Suspensionist (Withholding)
     - Pattern: Mix of A and C, specifically 3B, 9C.
     - Core Claim: The information is not evidence bearing on the question at all but a reason to withhold judgment.
     - Permits in Belief: No. One must suspend judgment.
     - Permits in Assertion: No. One cannot assert what one suspends judgment on.

  5. The Contextualist (Load-Bearing)
     - Pattern: Predominantly B choices (4B, 6B), varies on others.
     - Core Claim: Its force depends entirely on how load-bearing the doubted faculty was for the belief in question.
     - Permits in Belief: Yes, if the faculty was not load-bearing.
     - Permits in Assertion: Yes, if the faculty was not load-bearing.

  6. The Ignorer (Deflationary)
     - Pattern: Predominantly C choices (1C, 3C, 4C, 5C, 6C).
     - Core Claim: There is no phenomenon here to explain, because information about your own untrustworthiness must always mislead you.
     - Permits in Belief: Yes. The information is noise.
     - Permits in Assertion: Yes. The information is noise.

  DIAGNOSTIC NOTE 1

  (b) Unoccupied Combinations
  The following combinations of answers are made available by the items but occupy no coherent position in the space:

  1. Item 1C (Ignore info) + Item 7A (Failing obligation).
     - Status: Incoherent.
     - Reason: If the information is noise (1C), it cannot generate an obligation to change belief (7A).

  2. Item 4C (Submit without qual) + Item 2A (Violates norm of mind).
     - Status: Incoherent.
     - Reason: If holding the belief violates a norm (2A), asserting it without qualification (4C) compounds the violation.

  3. Item 6A (Illegitimate regardless) + Item 8A (Sound despite worry).
     - Status: Unattractive.
     - Reason: This view holds that external bias invalidates verdicts (6A) but internal worry does not invalidate arguments (8A), despite both being self-distrust cases. Nobody has simply noticed this asymmetry.

  DIAGNOSTIC NOTE 2

  (c) Indistinguishable Leaves
  The nine items cannot reliably separate **The Silencer** and **The Purist**. Both prescribe abandoning the belief and ceasing assertion in almost all cases. Their divergence is metaphysical (entitlement vs. constitutive aim) rather than practical.

  - Proposed Item 10: You learn that your impairment actually *improved* accuracy on this specific task, though you still feel untrustworthy.
    - Option A: I am entitled to believe, since the process was reliable. (The Silencer)
    - Option B: I still ought not believe, since my aim is violated by the doubt. (The Purist)
    - Option C: I am permitted to believe, since the outcome is good. (The Consequentialist)
