      *   **The Procedure:** Needs to be a flow of questions.
          1.  Is the evolutionary claim necessary? (Could a proximate explanation work?)
          2.  Is the adaptation claim specific? (What exactly was selected for?)
          3.  Is there evidence of design/complexity? (Williams' criterion)
          4.  Are alternative hypotheses (by-products, drift) ruled out?
