          2.  *Nostalgia/Coalitions:* Mechanism tests (priming). Claims functional specificity. Problem: Cultural transmission not tested. Proximate mechanisms shown, ultimate claim weak.
          3.  *Snake Fear:* Visual search, infants, monkeys. Strong comparative and developmental evidence. Likely passes better than the others.
      *   **The Critique:** Acknowledge limitations. Confidence vs. speculation bias. The difficulty of proving negatives (ruling out spandrels).
