answer: |-
  Dear Colleague,

  It is entirely reasonable to feel stalled by these manuscripts, and your instinct to avoid both blanket rejection and blind peer review is correct. The literature you mention, specifically the work of George Williams and the subsequent critique by Gould and Lewontin, distinguishes between a trait being an adaptation, meaning it was shaped by natural selection for a specific function, and a trait being a by-product or spandrel, meaning it exists as a consequence of other adaptations without having been selected for itself. For an editor, the academic debate matters less than the evidentiary standard: Williams argued that to claim adaptation, one must show complex design specifically suited to solving a problem, while Gould and Lewontin warned against assuming every trait has such a history. What matters for your referees is not the history of the debate but the structure of the argument. I have distilled this into a four-step procedure you can run in forty minutes, grounded in these distinctions but stripped of the jargon.

  The first question you must ask is whether the authors have confused proximate and ultimate causes. Proximate explanations concern how a mechanism works in the here and now, such as hormonal changes or social learning, while ultimate explanations concern why the mechanism evolved in the first place. An adequate answer requires the authors to specify that their evolutionary claim is not merely a restatement of the behaviour itself. If they say people cooperate because it enhanced fitness, without explaining the mechanism that links cooperation to fitness in the ancestral environment, they have conflated the two. This failure is fixable by the authors, as it often requires only a reframing of the introduction. If they fail here, you might write in your decision letter that the manuscript currently conflates the functional outcome of the behaviour with the evolutionary mechanism producing it, and requires a clear distinction between the proximate psychological process and the ultimate selective pressure.

  The second question is whether the authors have identified a specific selection pressure rather than a vague benefit. A claim that a trait solved a problem is insufficient; they must specify what problem, in what environment, and why that problem was recurrent enough to shape genetic inheritance. An adequate answer identifies a specific ancestral problem, such as predator avoidance or coalition maintenance, rather than a general good like survival or reproduction. If the benefit is too vague, this is a fatal flaw for an evolutionary claim because it renders the hypothesis unfalsifiable. You would inform the authors that the proposed selection pressure is insufficiently specified to allow for empirical testing, as any behaviour could be retrofitted to a general benefit like survival.

  The third question, which draws directly from the spandrels critique, is whether the authors have considered and ruled out non-adaptive alternatives. These alternatives include the possibility that the behaviour is a by-product of another adaptation, a result of cultural transmission, or simply genetic drift. An adequate answer does not need to disprove these alternatives definitively at the desk stage, but it must acknowledge them and offer a reason why the adaptive hypothesis is more plausible given the data. If the authors ignore these alternatives entirely, this is something to point the referees at, asking them to specifically assess the plausibility of the non-adaptive accounts. However, if the authors claim to have ruled out socialisation without actually testing a measure of socialisation, this is a fatal flaw in the logic. In this case, you should state that the claim to have ruled out alternative explanations is unsupported because the manuscript lacks measures or controls necessary to distinguish between evolutionary and cultural accounts.

  The fourth and final question is whether the evidence relies on novel predictions or post hoc fitting. This is the operational heart of the just-so story critique. An adequate answer shows that the data were collected to test a prediction made before the data were analysed, or that the study replicates a finding in a context where the evolutionary hypothesis predicts a specific pattern that alternative hypotheses do not. If the authors simply observe a pattern and then construct a story to fit it, this is a fatal flaw for a strong adaptation claim, though it may be acceptable for a speculative paper. Your decision letter should note that the evolutionary account is constructed post hoc to fit the observed data without offering novel predictions that distinguish it from alternative explanations.

  Having established this procedure, let us run it on your three submissions. The first manuscript, regarding the tournament pay scheme and gender equality, fails primarily at the third step. The authors argue that because the sex gap widens in gender-equal countries, socialisation accounts are ruled out. This is a logical error known as the gender equality paradox, but it does not rule out socialisation; it may simply indicate that economic security allows innate preferences to express themselves, or conversely, that welfare states reduce the necessity for women to enter high-risk tournaments. They have not measured socialisation directly, nor have they controlled for structural factors like childcare availability or wage disparity in specific sectors. This is a fatal flaw for their specific claim that socialisation is ruled out. You would write that the manuscript claims to exclude socialisation accounts without providing direct measures of socialisation or controlling for structural economic variables that co-vary with gender equality indices.

  The second manuscript on nostalgia and coalitions passes the first step but stumbles at the third. They show proximate mechanisms nicely; loneliness primes nostalgia, which primes helping. However, their claim that this proves an adaptation for coalition maintenance is weak because they have not tested the cultural transmission alternative. Nostalgia could be a learned response to loneliness that encourages helping, without having been genetically selected for that specific purpose. Their admission that cultural transmission was considered but not tested is honest, but it undermines the evolutionary claim. This is fixable if they tone down the claim to suggest nostalgia is consistent with an adaptive account rather than proving it, or if they add a study comparing cultures with different coalition structures. For now, you should tell them that while the proximate mechanism is well-demonstrated, the ultimate evolutionary claim is unsupported because the study does not distinguish between an evolved adaptation and a culturally learned strategy.

  The third manuscript on snake fear performs best under this procedure. It passes the second step by specifying a selection pressure, predator avoidance, and it passes the third step by using comparative evidence. The fact that lab-raised monkeys learn fear from wild monkeys suggests a preparedness to learn, which is a specific type of adaptation distinct from general learning or pure instinct. It also uses developmental data with infants, which helps rule out some forms of cultural learning. It is not perfect, as it does not rule out all alternative explanations, but it meets the threshold for sending to review. You would note that the use of comparative and developmental data provides stronger evidence for a prepared learning mechanism than self-report data alone, warranting peer review to assess the robustness of the comparative claims.

  Now I must be plain about where this procedure is a judgement call wearing a procedural costume. The third step, ruling out alternatives, is the most subjective. It is often impossible to definitively rule out a by-product explanation without genetic data or fossil records, which behavioural scientists rarely have. Consequently, this procedure may punish authors who are upfront about speculation while waving through confident authors who simply assert their hypothesis is the best one without evidence. If an author writes a humble discussion section admitting that cultural transmission is a viable alternative, they might be flagged for failing to rule it out, whereas an author who ignores the alternative entirely might slip through if you do not catch it. To mitigate this, you must look for the strength of the positive evidence rather than the absence of negative evidence. If the design complexity is high, as in the snake case, the adaptation claim holds more weight even if alternatives are not fully disproven.

  Furthermore, this procedure cannot determine truth. It can only assess the rigour of the argument. A paper can pass all four steps and still be wrong about the evolutionary history, because we cannot travel to the Pleistocene. It also cannot assess the quality of the statistical analysis or the reliability of the measures, which remains the job of the referees. You are testing the logic of the evolutionary inference, not the validity of the data collection. If the data are flawed, the referees will catch that, but if the logic is flawed, you should catch it here.

  Finally, to answer your question straight: yes, just-so story can be operationalised, and you should stop using the phrase as a slur because it shuts down conversation. In a decision letter, it should be replaced with the specific logical failure it denotes. A just-so story is a post hoc explanation that fits the data but makes no novel predictions and does not rule out plausible non-adaptive alternatives. When you write to an author, do not say this is a just-so story. Instead, write that the evolutionary account is currently indistinguishable from a post hoc rationalisation because it lacks novel predictions that would falsify the hypothesis if not observed. This gives the author a specific target: they must either produce novel predictions or acknowledge the speculative nature of the work. This preserves the scientific utility of the critique without resorting to a label that authors hear as an ideological dismissal rather than a methodological correction. I hope this provides a workable framework for your desk decisions.
