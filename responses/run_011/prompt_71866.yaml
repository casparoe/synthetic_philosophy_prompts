      *   *The "Just-So" Question:* Address directly. It can be operationalized as "post hoc rationalisation without novel prediction."
      *   *Closing:* Encouraging sign-off.

      *   *Constraint Check:* **NO HEADINGS, NO BULLET POINTS, NO BOLD, NO TABLES.** Continuous prose. British English (e.g., "behavioural", "programme", "centre", "colour" if needed, "whilst").

  4.  **Refining the Tone and Flow:**
