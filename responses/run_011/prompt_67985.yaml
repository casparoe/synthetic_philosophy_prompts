  ### Application to New Cases

  **1. State paying a logging community not to clear rainforest.**
  *   **Verdict:** **Pure Permissible.**
  *   **Analysis:** This looks like Case 2 (protection money) but is structurally Case 1 (Pork Premium) or Case 7 (Tax). Assuming the community has a legal right to log, the state is paying for a **supererogatory forbearance** (they don't *have* to stop) to secure a public good. It is a public authority coordinating behavior. It does not violate a constitutive commitment of the loggers (who are not morally bound to starve for the forest).
  *   **Caveat:** If the payment is framed as "we pay you not to commit a crime you were going to commit," it slides toward Case 2. If framed as "compensation for ecosystem services you provide by abstaining," it is Case 1.

  **2. Clinic paying a woman with six children to adopt long-acting contraception.**
  *   **Verdict:** **Permissible with Moral Residue.**
  *   **Analysis:** This sits between 1 and 5. It is not strictly Impermissible (like Vote Selling) because reproductive autonomy includes the right to be paid for medical choices, provided there is no coercion. However, it triggers the **Indulgence Constraint**. It risks treating fertility as a public nuisance to be priced off the market, potentially degrading the woman's agency by making her body a site of public cost-management. It is permissible if voluntary, but carries the residue of commodifying reproductive capacity.

  **3. University paying a student newspaper to kill a story.**
  *   **Verdict:** **Impermissible.**
  *   **Analysis:** This violates the **Integrity Constraint**. The constitutive commitment of a student press is to truth and institutional accountability, not to the comfort of the administration. Paying to suppress speech treats the press's civic role as fungible for institutional reputation. Unlike Case 10 (Policy), there is no Necessity Proviso (no catastrophic harm prevented).

