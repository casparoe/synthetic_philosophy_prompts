  ### Original Case: The Bystander Rescue

  **Case:** A child is drowning in a shallow pool. A bystander stands nearby. You shout, "I will pay you $1,000 to jump in and save that child!" The bystander jumps in and saves the child for the money.

  **Principle's Verdict:** **Permissible with Moral Residue.**
  **Common Intuition:** **Pure Permissible (Good).**

  **Analysis:**
  Most people intuit that paying for the rescue is fine because the child is saved (consequentialist). However, under the **Integrity Constraint**, there is a general moral duty to rescue when the cost to the rescuer is low. By introducing money, you have displaced the motive of *humanitarian duty* with *market gain*.
  The principle classifies this as **Permissible** (the child's life triggers a Necessity-style override on strict prohibition) but **Degrading** (it establishes a precedent that moral duties require payment).
  **Why this is counterintuitive:** You likely feel it is *good* to offer the money if it ensures the rescue. The principle forces you to admit that while the *outcome* is good, the *transaction* corrupts the normative landscape. It suggests we should prefer a world where the bystander jumps without the offer, even if the risk of inaction is slightly higher.

