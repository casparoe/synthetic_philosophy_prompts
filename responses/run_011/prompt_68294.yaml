prompt: |-
  I'm a second-year history PhD student and I've drafted a short piece for a methods journal about how historians handle events with piles of causes. My advisor read it and said "I think there's something here but you're overclaiming," which isn't actionable. Could you be blunt and specific? Draft first, then what I want from you.

  ---

  **Too many causes**

  Ask for an explanation of a large historical event and you almost always get a list. The war came because of the alliance system, the mobilization timetables, imperial rivalry, naval panic, nationalism in the provinces, a fiscal crisis, a harvest failure, and a wrong turn taken by a driver in Sarajevo. Critics call this a cop-out: a list isn't an explanation. Historians reply that the event really was overdetermined. Neither side says what overdetermination actually costs, and I think that's the mistake.

  The standard way to rank causes is counterfactual: ask which of them, if absent, would have changed the outcome. But in a dense causal web this test doesn't discriminate. Almost every candidate sits inside a set of conditions that was jointly enough for what happened, so each is needed given the others, and each passes the but-for test equally well. The test filters out irrelevancies; it produces no ordering among the survivors. Any ordering has to come from somewhere else.

  The usual answer is that ordering comes from the historian's interests, which makes it look arbitrary. My claim is that it comes from somewhere less arbitrary and less factual: the thing being explained isn't fixed in the first place. Historians slide between descriptions of the same event to suit the story. "The war that began in August 1914," "a general European war," "Germany's bid for hegemony," and "the breakdown of the July system" are not the same explanandum, and each has its own cause-set with its own determinate counterfactuals. The list looks endless and unrankable mainly because the description is sliding mid-paragraph. I've been calling this description-sliding for want of a better term.

  Same thing further back. "Why did the palatial states of the eastern Mediterranean collapse around 1200 BCE?" gets drought, raiders, internal revolt, and systemic fragility, and all four are defensible. "Why did the palace script disappear?" and "why did Pylos burn when Tiryns didn't?" get different answers from the same evidence. A book that lists fifteen causes of the collapse is usually not over-explaining; it is answering four questions under one heading and never saying which is which.

  If that's right, the practical upshot is that "why did E happen?" and "why E rather than F?" are not two ways of asking one thing. The first is often unanswerable because E's description is unfixed; the second is usually answerable because the contrast fixes it. So the discipline shouldn't be ranking causes but pinning the foil. It also explains why the inevitability arguments never terminate: inevitability and contingency are properties of an event-under-a-description, so two historians can be simultaneously right about everything they assert and still disagree, because they're sliding.

  ---

  What I want from you:

  1. A committed verdict, not a hedge — does the central claim survive, or is it fatally overstated? Say which paragraph is doing the least work.
  2. Is this old news? I'm told there's philosophy literature on causal selection, contrastive explanation, and something about causes being proportional to effects, and I haven't read any of it. Tell me what my claim is closest to and what, if anything, it adds.
  3. Where am I factually sloppy about the historical cases? I'd rather know now.
  4. Does the counterfactuals-don't-discriminate step in paragraph two actually hold, or is it just the standard objection to but-for causation with extra steps?

  And then, whatever you conclude: say what would change your mind about it. Which argument or counterexample would move you to a better verdict on the piece, and where do you think your own criticism is most likely to be wrong — I don't want to fix things based on an objection that's weaker than the objection it's replacing.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Second-year History PhD student.
      *   **Task:** Critique a draft methods piece about historical causation (specifically "overdetermination" and "description-sliding").
      *   **Advisor's Feedback:** "Something here but you're overclaiming" (not actionable).
      *   **User's Request:** Be blunt and specific. Provide a committed verdict, check for originality/philosophy overlap, check factual sloppiness, evaluate the counterfactual argument, and finally, provide a "meta-critique" (what would change my mind, where might I be wrong).
      *   **Tone:** Academic, rigorous, direct, constructive but critical.

  2.  **Analyze the Draft ("Too many causes"):**
      *   **Core Argument:** Historians list too many causes because they treat the *explanandum* (the thing being explained) as fixed when it's actually fluid. By shifting descriptions of the event (e.g., "The War" vs. "The Breakdown of the July System"), the causal list changes. Therefore, the solution isn't ranking causes but fixing the contrastive foil ("Why E rather than F?").
      *   **Key Term:** "Description-sliding."
      *   **Structure:**
          *   Para 1: Problem statement (lists vs. explanation, overdetermination).
          *   Para 2: Critique of counterfactuals (but-for test fails in dense webs).
          *   Para 3: The Solution/Claim (Explanandum isn't fixed; description-sliding).
          *   Para 4: Example (Late Bronze Age Collapse).
          *   Para 5: Implication (Contrastive explanation > Ranking causes; Inevitability is description-relative).

  3.  **Address Question 1: Committed Verdict & Weakest Paragraph:**
      *   *Verdict:* The central claim is *plausible* but definitely overclaimed in its current form. It presents a pragmatic observation as a metaphysical solution. It's not "fatally" overstated, but it claims to solve a problem that it mostly just renames.
      *   *Weakest Paragraph:* Paragraph 2. It sets up a strawman of counterfactual analysis. Historians *do* use counterfactuals to discriminate (deep vs. proximate causes), even if the logic is messy. Saying the test "produces no ordering" is too strong.
      *   *Decision:* The claim survives but needs downgrading from "This is the mistake" to "This is a neglected source of confusion."

  4.  **Address Question 2: Is this old news? (Philosophy Check):**
      *   *Yes, it is old news.* This is classic philosophy of history/social science.
      *   *Key Concepts:*
          *   **Contrastive Explanation:** Peter Lipton (*Inference to the Best Explanation*), Bas van Fraassen. "Why E rather than F?" is the standard move.
          *   **Causal Selection:** Hart & Honoré (*Causation in the Law*), Lewis. Distinguishing "causes" from "conditions."
          *   **Proportionality:** Yablo (causal proportionality).
          *   **Explanandum Relativity:** Dray, Goldstein, maybe even Weber (objective possibility).
      *   *What does it add?* The term "description-sliding" is a nice pedagogical hook for *historians* specifically. Philosophers talk about "contrast classes"; historians talk about "framing." The piece translates philosophical logic into historiographical practice. That's the value add.

  5.  **Address Question 3: Factual Sloppiness (Historical Cases):**
      *   *WWI:* The "driver in Sarajevo" (Princip's sandwich/driver taking a wrong turn) is a cliché. It's factually true but historiographically tired. The "fiscal crisis/harvest failure" link to WWI outbreak is debatable (more relevant to 1917 revolutions).
      *   *Late Bronze Age:* "Palatial states... collapse." Tiryns vs. Pylos is a good specific contrast. However, saying "palace script disappear" is slightly imprecise (Linear B disappears, but Cyprus retains syllabic script for a bit, etc.). The main issue is implying the "15 causes" books don't know what they are doing. They often *do* distinguish systemic vs. trigger.
      *   *Critique:* The draft implies historians are confused. Many are not; they are writing for different audiences or synthesizing.

  6.  **Address Question 4: Counterfactuals Paragraph:**
      *   *Analysis:* The claim "Almost every candidate... passes the but-for test equally well" is logically suspect. In a conjunctive set (A+B+C -> E), if you remove A, E doesn't happen. So A is necessary *given* B and C. But if B and C are present, is A necessary? Yes. But historians often argue about *independence*.
      *   *Problem:* The draft says the test "filters out irrelevancies; it produces no ordering." This is false. Counterfactuals *can* order causes by "depth" or "robustness" (how many possible worlds does the cause hold across?).
      *   *Verdict:* It's the standard objection to NESS (Necessary Element of a Sufficient Set) tests, but stated too absolutely.

  7.  **Address the "Meta-Critique" (What would change my mind / Where am I wrong):**
      *   *What would change my mind:* If the user can show a case where fixing the *explanandum* doesn't solve the causal ranking problem (e.g., even with a fixed contrast, causes remain incommensurable).
      *   *Where I might be wrong:* I might be underestimating the pedagogical value for *students*. PhD students know the philosophy; undergrads don't. If this is for a methods journal aimed at grad teaching, the "old news" critique matters less.
      *   *Self-Correction:* I need to make sure I don't sound like a philosopher looking down on a historian. The value is in the *application*, not the *invention*.

  8.  **Drafting the Response:**
      *   *Tone:* Direct, professional, "senior colleague" vibe.
      *   *Structure:* Follow the user's four points + the meta-critique.
      *   *Key Advice:* Don't claim to solve overdetermination. Claim to clarify *why* historians talk past each other. Lean into "description-sliding" as a rhetorical diagnosis, not a metaphysical fix.

      *(Self-Correction during drafting)*: Wait, the user asked for *my* meta-critique at the end ("where do you think your own criticism is most likely to be wrong"). I need to include a section where I critique *my* critique.

      *(Refining the Philosophy Check)*: Make sure to mention **Lipton** and **Van Fraassen** explicitly. Also **Hart & Honoré** on causal selection. The "description" angle is very **Anscombe** or **Davidson** (events under descriptions).

      *(Refining the Historical Check)*: The WWI example is too cliché. The LBA example is better. The claim that "15 causes... is usually not over-explaining" is a strong empirical claim that needs backing.

      *(Refining the Verdict)*: "Overclaiming" is right. The piece claims historians *don't know* they are sliding. Often they *do*. The piece should argue they *should be more explicit* about it.

  9.  **Final Polish:** Ensure the "What would change my mind" section is genuine. (e.g., If you can show that fixing the foil *still* leaves causal incommensurability).

  10. **Final Review against constraints:** Blunt? Yes. Specific? Yes. All 4 points answered? Yes. Meta-critique included? Yes.

  *(Self-Correction on the "Meta-Critique" instruction)*: The prompt asks: "say what would change your mind about it... and where do you think your own criticism is most likely to be wrong." This refers to *my* criticism of the draft. I need to be humble about my own critique.

  Okay, let's write it.cw
answer: |-
  Here is the blunt assessment you asked for.

  ### 1. The Verdict
  **The central claim survives, but your framing is fatally overconfident.** You are presenting a methodological clarification as a metaphysical discovery.

  Your core insight—that causal lists look messy because the *explanandum* (the thing explained) shifts mid-argument—is correct and useful. However, you claim historians do this because they don't realize the cost of overdetermination ("Neither side says what overdetermination actually costs... I think that's the mistake"). This implies confusion or error on the part of practitioners. In reality, many historians slide descriptions deliberately to synthesize broad narratives. You aren't exposing a mistake; you are exposing a trade-off.

  **Weakest Paragraph:** **Paragraph 2.**
  It does the least work and creates the most vulnerability. You claim the counterfactual test "produces no ordering among the survivors." This is demonstrably false. Historians use counterfactuals to distinguish *proximate* triggers from *structural* conditions all the time (e.g., "Without the mobilization timetables, the war might have been delayed but not prevented"). By claiming the test fails completely, you set up a strawman to make your "description-sliding" solution look more necessary than it is. If the counterfactual test worked perfectly, you'd still have a point about description, but your argument would be more nuanced. As written, it relies on the failure of counterfactuals to prove the necessity of your theory.

  ### 2. Is This Old News?
  **Yes, but that doesn't kill the piece.** You are reinventing the wheel, but you might be putting it on a car that needs it.

  *   **Contrastive Explanation:** This is standard philosophy of science. Peter Lipton (*Inference to the Best Explanation*) and Bas van Fraassen (*The Scientific Image*) established that explanation is inherently contrastive ("Why P rather than Q?"). Your paragraph 5 is essentially a restatement of van Fraassen's contrast class.
  *   **Causal Selection:** H.L.A. Hart and Tony Honoré (*Causation in the Law*) and David Lewis discuss how we select "causes" from a sea of "conditions" based on normative or pragmatic interests.
  *   **Events Under Descriptions:** This is Anscombe/Davidson territory. An event is not a raw occurrence; it is an occurrence *under a description*.

  **What you add:** The term **"description-sliding."**
  Philosophers talk about "contrast classes" or "event individuation." Historians do not read philosophy journals. If you translate "contrastive explanandum relativity" into "description-sliding," you give historians a vocabularly tool to diagnose their own writing. Your contribution is not theoretical novelty; it is **disciplinary translation.** Stop claiming you found the solution to overdetermination; claim you found a better vocabulary for why historians talk past each other.

  ### 3. Factual Sloppiness
  You are risky on the history, which undermines the methods argument.

  *   **WWI:** The "driver in Sarajevo" (Princip's sandwich/wrong turn) is a historiographical cliché. Using it makes you look like you haven't read the literature since 1990. More importantly, linking "fiscal crisis" and "harvest failure" directly to the *outbreak* in 1914 is shaky. Those are better explanations for the *revolutions of 1917* or the social unrest of 1914, not the diplomatic cascade in August. You are conflating causes of the *war* with causes of the *collapse of empires*.
  *   **Late Bronze Age:** You write: "A book that lists fifteen causes... is usually not over-explaining; it is answering four questions under one heading." This is an empirical claim you cannot support. Some books listing fifteen causes *are* just sloppy compilations (the "kitchen sink" approach). You need to distinguish between *synthesis* (good sliding) and *indecision* (bad sliding).
  *   **Pylos vs. Tiryns:** This is a strong example, keep it. But be careful: we don't know *why* Tiryns didn't burn. It might be archaeological luck. Ensure you aren't presenting an evidentiary gap as a causal puzzle.

  ### 4. The Counterfactual Step (Paragraph 2)
  **It does not hold as written.**
  You argue that in a dense web, every cause passes the "but-for" test equally.
  *   **The Logic:** If $A + B + C \to E$, then removing $A$ means $E$ does not happen (given $B$ and $C$). So $A$ is necessary *in that specific context*.
  *   **The Flaw:** Historians don't just ask "If I remove A, does E happen?" They ask "If I remove A, how *different* is the outcome?" or "How *likely* is A to be absent?"
  *   **The Fix:** You don't need to say counterfactuals *fail* to discriminate. You need to say they discriminate based on *stability*, not just necessity. Your point should be: Counterfactuals rank causes based on robustness, but they cannot rank causes unless we agree on *what E is*. If E is "a general war," the driver doesn't matter. If E is "war in August 1914," the driver matters. The counterfactual works, but only *after* the description is fixed. You have the order of operations wrong.

  ---

  ### Meta-Critique: Where I Might Be Wrong
  You asked me to identify where my own criticism is vulnerable and what would change my mind.

  **1. Where my criticism is likely wrong:**
  I am judging this as a **philosophical contribution**, but you are writing for a **methods journal**.
  If your audience is second-year PhD students who have *not* read Lipton or van Fraassen, my complaint that "this is old news" is elitist and unhelpful. If your goal is pedagogical—to give students a heuristic to fix their dissertation chapters—then the "overclaiming" is a feature, not a bug. You need to sell the idea hard to get them to use it. If the journal is *History and Theory*, my critique stands. If it is *The History Teacher* or a graduate methods handbook, my critique is too harsh on the novelty front.

  **2. What would change my mind:**
  I would upgrade my verdict from "overclaimed" to "robust" if you could demonstrate a case where **fixing the foil (the contrast) still fails to rank the causes.**
  Currently, your argument is: "Fix the description, and the causal ranking becomes determinate."
  If you can find a historical example where:
  1.  The event description is fixed ("Why did Pylos burn?"),
  2.  The contrast is fixed ("...rather than survive?"),
  3.  And historians *still* legitimately disagree on whether "raiders" or "revolt" is the primary cause (not just because they are sliding descriptions, but because the evidence underdetermines the causal weight)...
  ...then your theory is incomplete.

  If you acknowledge that description-sliding is *one* source of confusion, but not the *only* source of causal indeterminacy, I will withdraw the "overclaiming" charge. Currently, you imply that pinning the foil solves the ranking problem. It doesn't always. It just makes the disagreement honest.

  **Actionable Advice:**
  Change your thesis from "The mistake is failing to see overdetermination costs" to "The discipline lacks a vocabulary for when we are sliding descriptions." Downgrade the metaphysical certainty. Upgrade the pragmatic utility. Keep "description-sliding"—that's your hook.
