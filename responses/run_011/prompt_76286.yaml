answer: |-
  **Case A — The Coarse Verdict Trap**
  **Setting:** A hiring committee (Alice and Bob) evaluating a candidate. The claim $H$: "Candidate is hireable."
  **Common Prior:** $P(H) = 1/2$.
  **Private Signals:** Alice sees $A$; Bob sees $B$.
  **Likelihoods:** $P(A|H)=3/5, P(A|\neg H)=2/5$ (LR=1.5). $P(B|H)=2/5, P(B|\neg H)=3/5$ (LR=2/3).
  **Protocol:** They exchange "Recommendations" (Hire if $P(H)>0.5$, Reject otherwise), not numbers.

  **Scene:** Alice and Bob have reviewed the file separately. They sit down to reconcile. They are truthful Bayesians; they know each other's thresholds and rationality.
  **Round 1:**
  Alice: "I recommend Hire." (Her posterior: $0.5 \times 1.5 / (0.5 \times 1.5 + 0.5) = 0.6$).
  Bob: "I recommend Reject." (His posterior: $0.5 \times 0.66 / (0.5 \times 0.66 + 0.5) = 0.4$).
  **Round 2:**
  Alice knows Bob rejected, so his posterior $\le 0.5$. She infers he saw signal $B$. But she doesn't know if he saw $B$ alone or $B$ plus other noise. Bob knows Alice hired, so her posterior $> 0.5$. He infers she saw $A$. Neither knows the *exact* likelihood ratio the other processed. They remain at $0.6$ and $0.4$. The gap persists because actions are coarse; they reveal the *side* of the threshold, not the *distance*.

  **The Collapse:**
  **Round 3 (Numbers):**
  Alice: "My posterior is exactly $3/5$."
  Bob: "Mine is exactly $2/5$."
  **Round 4 (Agreement):**
  Now posteriors are common knowledge. They pool the likelihoods.
  Combined LR = $1.5 \times (2/3) = 1$.
  New Odds = Prior Odds ($1:1$) $\times$ Combined LR ($1$) = $1:1$.
  Both announce: "Posterior is $1/2$." Agreement reached.

  ***

  **Case B — The Prior Divide**
  **Setting:** Same committee, same signals ($A$ and $B$), same honest announcement protocol.
  **Priors (Common Knowledge):** Alice is a specialist who sees only top-tier candidates ($P_A(H) = 9/10$). Bob is a generalist who sees mostly rejects ($P_B(H) = 1/10$). They know *why* their priors differ (selection bias in their pipelines).
  **Likelihoods:** Same as Case A (LR=1.5 for $A$, LR=2/3 for $B$).

  **Round 1:**
  Alice: "My posterior is $0.93$." (Odds: $9:1 \times 1.5 = 13.5:1$).
  Bob: "My posterior is $0.07$." (Odds: $1:9 \times 2/3 = 2:27 \approx 0.074$).
  **Round 2:**
  They hear the numbers. Since likelihoods are known, Alice infers Bob saw $B$; Bob infers Alice saw $A$. They update on the *other's signal* using their *own prior*.
  Alice: "My posterior is $0.90$." (Odds: $9:1 \times 1.5 \times 2/3 = 9:1$).
  Bob: "My posterior is $0.10$." (Odds: $1:9 \times 2/3 \times 1.5 = 1:9$).
  **Round 3:**
  Alice: "0.90." Bob: "0.10."
  **Verdict:** They never converge. They simply return to their priors after pooling information, because the likelihood ratios cancel out ($1.5 \times 2/3 = 1$), leaving the prior odds untouched.

  ***

  **Analysis**
  **The "Common Prior Costs Nothing" Objection:**
  Critics argue priors shouldn't differ if agents share all objective information (Harsanyi Doctrine). Case B survives this only if the prior difference encodes *indexical* or *structural* knowledge common to both. Here, Alice and Bob agree that Alice's data comes from a high-quality pool and Bob's from a low-quality pool. The prior difference isn't a "mistake" about the world; it's a corrected belief about their respective sampling biases. For Case B to hold, the *source* of the prior divergence must be common knowledge. If Alice thought her prior was "true" and Bob's was "biased" (without Bob agreeing), the disagreement would be about the prior itself, violating the common-knowledge requirement.

  **Coda: Close Priors**
  If priors are not identical but $\epsilon$-close, exact agreement vanishes. However, Monderer and Samet (1989) show that if there is *common knowledge of approximate posteriors* (e.g., "I know you know my probability is within $\delta$ of yours"), then posteriors must be close. Without that common knowledge, even tiny prior differences can sustain large posterior gaps indefinitely.

  **Load-Bearing Features**
  *   **Case A:** **Coarse Communication.** The disagreement is generated by exchanging actions instead of numbers. If you delete this (let them announce numbers in Round 1), Aumann's theorem triggers immediately, and they converge in Round 2.
  *   **Case B:** **Different Priors.** The disagreement is generated by the prior ratio. If you delete this (force a common prior of $1/2$), the likelihoods cancel to 1, and they converge to $1/2$ immediately, regardless of announcement rounds.
