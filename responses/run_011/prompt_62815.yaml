answer: |-
  Your proposed principle—"a move is legal iff the rules in force at the moment of the move permit it, where 'in force' means roughly 'nobody has successfully challenged it yet'"—is a good start, but it collapses under the weight of your own verdicts.

  Here is the breakdown of why your current principle fails, followed by the tighter principle you are looking for, the verdict you will have to sacrifice, and the consequences for entrenched entrenchment.

  ### 1. Testing Your Proposed Principle
  Your principle relies on the idea that "rules in force" dictate legality.
  *   **Fails on Scenario 1:** Rule 301 was "in force." It explicitly forbade repeal. By your principle, the repeal should be illegal. You accepted it.
  *   **Fails on Scenario 3:** Rule 303 was "in force." It explicitly voided future rules. By your principle, the repeal should be illegal. You accepted it.
  *   **Fails on Scenario 4:** Rule 205 was "in force." It required a two-thirds vote. If 306 passed by simple majority (as implied by "could never have passed under its own rule"), it violated the rules in force. You accepted it.
  *   **Contradicts Scenario 5 & 6:** You say the rules were "void all along" (never in force), but the moves count (treated as if they were in force). Your principle ties legality strictly to the status of the rule, whereas your verdicts separate *rule validity* from *move finality*.

  ### 2. The Tighter Principle: Explicit Validity & State Finality
  To save your verdicts on 1 through 6, you need a principle that distinguishes between **substantive commands** (rules that tell you what to do) and **validity conditions** (rules that define whether an action counts), while also separating **rule authority** from **game state**.

  **The Principle:**
  > **1. The Validity Distinction:** A rule may be amended or repealed by the standard procedure regardless of its own substantive prohibitions, *unless* it explicitly declares that attempts to amend it are **void** or **invalid**. Substantive bars (e.g., "No rule may be repealed") are themselves rules and can be repealed; Validity bars (e.g., "Attempts to repeal are void") negate the procedure itself.
  >
  > **2. The Temporal Rule:** The validity of a move is judged by the rules existing *before* the move is completed, not by the rules the move attempts to enact.
  >
  > **3. State Finality:** Once a game state change (score, board position, turn order) occurs under a rule generally accepted at the time, it remains valid even if the authorizing rule is later found defective, provided the move was not challenged immediately.

  ### 3. How It Saves Your Verdicts
  *   **Scenarios 1 & 3 (Saved):** Rules 301 and 303 contain substantive prohibitions ("No repeal," "Future rules void"). They do not explicitly invalidate the *attempt*. Therefore, the standard amendment procedure overrides them.
  *   **Scenario 2 (Saved):** Rule 302 contains a validity clause ("attempt... is void"). This triggers the Exception in Part 1. The standard procedure cannot override a rule that invalidates the procedure itself.
  *   **Scenario 4 (Saved):** Part 2 (The Temporal Rule) dictates that 306 is judged by Rule 205 (the old threshold). Since it passed under 205 (assuming 2/3 was met), it is valid. Once valid, it changes the threshold for *future* moves. The fact that 306 set a higher bar for itself is irrelevant; it only needed to clear the bar that existed when it was proposed.
  *   **Scenarios 5 & 6 (Saved):** Part 3 (State Finality) allows you to declare the rule void (preserving logical consistency) while keeping the score/turns (preserving gameplay). This relies on the idea that the *players' consensus* at the time ratified the move, even if the *textual authority* was flawed.

  ### 4. The Verdict You Must Give Up
  To maintain logical consistency under this new principle, you must refine your verdict on **Scenarios 5 and 6**.

  You currently say: *"The rule was void all along."*
  **The Fix:** You cannot claim the rule was "void all along" if you intend for the moves to count without reversal. If a rule is truly void *ab initio*, it confers no authority.
  **The Sacrifice:** You must admit that the moves were **ratified by acquiescence**. The rule was *defective*, but the failure to challenge it within a reasonable time (the six sessions in Scenario 5) cured the defect regarding the *moves*, even if the rule text remains technically void. You have to choose: either the rule was valid enough to make the moves count, or the moves are void. You can't have a rule that is "void" yet "effective."
  *Recommendation:* Change your verdict to: "The rule was procedurally defective, but the moves are ratified by lack of timely challenge."

  ### 5. The Entrenched Entrenchment Case
  You asked about a rule that entrenches its own entrenchment clause (e.g., Rule A says "A cannot be repealed," and Rule B says "The clause protecting A cannot be repealed," and Rule B also says "This protection of B cannot be repealed").

  **Under the Explicit Validity Principle:**
  If the entrenchment clause explicitly states that attempts to repeal it are **void**, then **the rule is immutable.**
  *   **Verdict:** You cannot repeal it.
  *   **Reasoning:** Part 1 of the principle grants immunity to rules with explicit validity clauses. If you protect the shield, you protect the sword. This creates a "Black Hole" in your ruleset—a piece of the game that is no longer Nomic (changeable) but Constitutional (fixed).
  *   **Consequence:** If you allow this, you admit that the game can cease to be a Nomic game and become a fixed-rule game by majority vote. This is a known feature of Nomic (the "Stalemate" scenario).

  ### 6. Surprising Edge Cases
  Here are two cases where this principle lands somewhere you might not expect:

  **Case A: The Self-Executing Repeal**
  *   **Scenario:** A player proposes Rule 400: "Rule 400 is hereby repealed."
  *   **Verdict:** **Valid.**
  *   **Why:** Under Part 2 (The Temporal Rule), Rule 400 exists for the split second it is adopted. At that moment, it is a valid rule. It contains a command ("Repeal 400"). That command is executed immediately. The rule vanishes.
  *   **Surprise:** You can pass a rule that exists only long enough to destroy itself, even if a majority would have voted against its destruction if proposed separately.

  **Case B: The Impossible Threshold**
  *   **Scenario:** A player proposes Rule 401: "The voting threshold for all future rules is 110%." (Passed by the current valid threshold).
  *   **Verdict:** **Valid, but paralyzing.**
  *   **Why:** Under Part 2, the move was valid when passed. Now, no future rule can ever meet the 110% threshold.
  *   **Surprise:** Unlike the Entrenched Entrenchment (which blocks repeal via a validity clause), this blocks change via a substantive impossibility. Under Part 1 of the principle, **this can be repealed by a simple majority.** Why? Because Rule 401 sets a substantive condition ("Threshold is 110%"), but it does not explicitly say "Attempts to change this threshold are void." Therefore, the standard procedure overrides the impossible math. You can vote 51% to repeal the 110% rule.

  ### Summary
  Your intuition was correct that there is a difference between Scenarios 1 and 2, but it wasn't about the vote count (Majority vs. Unanimous); it was about the **magic words** ("void" vs. "forbidden"). By adopting the **Explicit Validity & State Finality Principle**, you preserve the dynamic nature of Nomic (most rules can change) while allowing for rare, stable "constitutional" rules, provided they use the specific language required to lock themselves in. Just be careful with Scenario 5: don't call a rule "void" if you're going to let it change the score. Call it "ratified."
