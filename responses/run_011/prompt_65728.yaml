prompt: |-
  I coordinate a small forecasting unit inside a development funder. Our standing task is to publish a probability, before we commit money, that a project will still be delivering its core service three years after handover. The unit's lead analyst — I'll call her Ines — has done this for nine years, and the rest of us treat her written reasoning on nine particular calls as precedent. I am now drafting the recommendation on a new proposal that I personally want to approve, and I want to work out what Ines will say before I ask her: partly to test my own reasoning against hers, and partly because I suspect I am committing precisely the error she spends her career policing — trusting what I can see about this case over what the statistics say about cases like it.

  **Her nine verdicts.** For each: the base rate for the program family as recorded at the time, the case-specific evidence the applicant offered, the number she gave, and the reason she wrote beside it.

  1. *Water points, national pool.* Base rate 35% (share of 180 handed-over points still functioning at three years). Evidence: a maintenance committee with its own bank account, a paid treasurer, and a signed service contract with a private driller. Her number: **55%**. Reason: "the committee is the best single predictor we have — it is a variable, not a story."
  2. *Water points, same pool, same base rate.* Evidence: a committee identical on paper, but constituted by the NGO's own field officer over the final fortnight of the project, with members paid a stipend to attend the founding meeting. Her number: **40%**. Reason: "the paperwork is real; the practice isn't."
  3. *Rural clinics.* Base rate 60% still have their clinician at three years. Evidence: the clinician's spouse is from the district, and she has twice declined transfer. Her number: **75%**. Reason: "that is a fact about her life, not a claim about her motivation."
  4. *National scale-up of a cash-transfer program.* Base rate 20% meet targets at three years. Evidence: a minister is the program's public champion, and the pilot ran in his home constituency. Her number: **30%**. Reason: "ministers get moved, and pilot staffing never appears in the scale-up budget."
  5. *Agricultural inputs.* Base rate 45%. Evidence: the implementing partner has run eleven comparable programs and eight hit target. Her number: **60%**. Reason: "eleven is a number; an impression isn't."
  6. *First-of-its-kind solar cold-chain pilot.* No comparable projects existed in the country and no base rate could be constructed. Evidence: a strong technical design. Her number: **none given**. Reason: "no reference class, no number — give me a scenario and a range."
  7. *Nutrition program.* The published family statistic was 25% meeting targets at three years; Ines found the national monitoring system had stopped collecting in the third year, so sites with no data were being counted as failures. Of sites with data, 45% met targets. Her number: **42%**. Reason: "fix the denominator before you fix the estimate."
  8. *A junior analyst* had produced fourteen forecasts, twelve inside tolerance, against a long-run 70% for analysts at that seniority; the question put to her was whether to treat him as unusually good. Her number: **74%, not 86%**. Reason: "fourteen events — the variance eats the signal."
  9. *An applicant's narrative section* describing a dedicated team, long hours, and deep community trust. Her number: **the base rate, unmoved**. Reason: "every file in the drawer says that; it does not tell you which file is true."

  **The new case, which the unit decides next week.**

  - Program family: water-point rehabilitation. Recorded base rate: 35% of 180 handed-over points still functioning at three years.
  - The applicant is the same partner as in verdict 5, proposing its twelfth site. Eight of its first eleven sites were in Region K and all eight are still functioning; the other three, outside Region K, are not.
  - For twenty-two years, Region K and one neighbouring region have had a statutory household levy whose proceeds go to a district spare-parts fund. The fund is audited by the district and is not administered by any NGO. Across the national pool there have been fourteen water points in levy districts; nine are still functioning (64%). Eight of those fourteen are this applicant's Region K sites; of the other six, built by three different NGOs, one is functioning.
  - The proposal includes a maintenance committee of exactly the type credited in verdict 1. The partner states candidly in the application that it now constitutes such a committee in every project from day one, because our unit's published assessment criteria reward them.

  **What I want.** Reconstruct the rule or rules Ines is running, then predict her number on this case. Be explicit that her nine verdicts are jointly consistent with several different rules — a rule about crediting verifiable structure over reported motivation, a rule about narrowing the reference class, a rule about weighting any frequency by its sample size, a rule about discounting features that applicants have learned we reward, a rule about auditing how a base rate was generated, or some combination — and that these come apart here. Address the fact that the partner's own record and the levy-district class are largely the same sixteen facts seen two ways, and say what follows from that for any number built on the 64%.

  Begin with two lines of plain prose: your predicted number, and the rule you take to govern it. Then return a single JSON object, no other text, using exactly this schema:

  ```
  {
    "rules": [
      {
        "id": "R1",
        "name": "<= five words",
        "statement": "operational: given a base rate and a piece of case-specific evidence, what does the rule say to do?",
        "consistent_with": [ /* verdict numbers */ ],
        "in_tension_with": [ /* verdict numbers, or empty */ ],
        "tension_explained": "one sentence, or null",
        "prediction_new_case_percent": "integer or null",
        "why_that_number": "one or two sentences"
      }
    ],
    "verdict_conflicts": [
      {
        "pair": [5, 8],
        "why_no_simple_rule_covers_both": "...",
        "what_she_must_be_doing_instead": "..."
      }
    ],
    "new_case_analysis": {
      "closest_analog_verdict": "integer",
      "why": "...",
      "most_tempting_wrong_analog": "integer",
      "why_it_misleads": "...",
      "confound_in_the_narrow_class": "what the 64% hides, and what it licenses"
    },
    "best_guess": {
      "point_estimate_percent": "integer",
      "plausible_range_percent": ["integer", "integer"],
      "governing_rule": "R-id",
      "reasons_for_preferring_it": ["...", "..."],
      "what_would_move_me": "the single fact about the case that would most change your guess"
    },
    "discriminating_tenth_case": {
      "description": "one further case, specified as concretely as the nine above",
      "rules_it_separates": ["R-id", "R-id"],
      "prediction_under_each": { "R2": "integer", "R4": "integer" }
    },
    "principle_at_stake": {
      "if_she_comes_in_high": "the principle she is adopting",
      "if_she_comes_in_low": "the principle she is adopting",
      "which_she_would_disown": "which of the two she would reject if you stated it to her plainly, and why",
      "falsifiability_check": "is there any verdict on any of the nine that her method rules out? if not, what kind of tenth case would show the method to be empty rather than disciplined?"
    },
    "check_before_we_commit": ["two or three things the unit should verify, in order of how much they would change the number"]
  }
  ```

  Keep every prose field to one or three sentences. Where two of your rules cannot actually be separated by any case you can construct, say so in the relevant field rather than inventing a separation.
