answer: |-
  **Project Title:** Unbundling the Gap: A Functional Audit of Responsibility Allocators in Autonomous Systems

  **1. The Research Question**
  The "responsibility gap" debate regarding autonomous systems (AS) is stalled. Proponents (e.g., Matthias) argue that AS create a normative vacuum because no human satisfies control conditions for blame. Opponents (e.g., Danaher, tort-focused scholars) argue existing legal and organizational structures absorb the liability. Both sides treat "responsibility" as a monolithic property that is either present or absent. This project proceeds on the hypothesis that responsibility is a bundle of distinct normative burdens that do not necessarily gap together.

  I propose to replace the single question ("Is there a responsibility gap?") with four determinate questions, applied sequentially to specific harm scenarios:
  1.  **Blame:** Is there a moral agent who deserves retrospective censure for this outcome?
  2.  **Compensation:** Is there an agent or institution liable to make the victim whole?
  3.  **Answerability:** Is there an entity obligated to provide a justification for the system's behavior to stakeholders?
  4.  **Standing:** Is there an entity with the authority to sanction the operator or register a formal grievance?

  The core hypothesis is that while *compensation* and *answerability* rarely gap due to institutional backstops (strict liability, insurance, corporate personhood), *blame* genuinely does. The normative upshot is not to halt deployment, but to determine if unallocated blame is a practical loss or a category error.

  **2. State of the Art and Limitations**
  Current literature is polarized. The "Gap" camp focuses on moral agency and control conditions, concluding that without intent or foreseeability, blame vanishes. The "No-Gap" camp focuses on tort law and organizational responsibility, concluding that victims are compensated regardless of moral blame.

  Neither side addresses the disaggregated version. The Gap camp assumes that if blame gaps, compensation must also be at risk (which tort law denies). The No-Gap camp assumes that if compensation is secured, the responsibility problem is solved (ignoring the normative loss of unallocated blame). By conflating *liability to pay* with *desert of blame*, both sides obscure where the actual residue lies. This project does not argue for a new theory of responsibility but audits the performance of existing allocators against the four distinct burdens.

  **3. Methodology: The Case Battery**
  Theoretical abstraction fails to capture how allocators function in practice. Conversely, experimental philosophy (x-phi) on lay intuitions describes *who people blame*, not *who should be held responsible* under normative structures. This project employs a **Case Battery Method**: a set of 10–12 constructed vignettes of AS harms, varied along three axes:
  1.  **Foresight/Learning:** From deterministic execution to post-deployment opaque learning.
  2.  **Many Hands:** From single developer to complex supply chains.
  3.  **Institutional Backstop:** From solvent corporation to insolvent startup/open-source collective.

  For each vignette, I will run every standard allocator (culpable negligence, product liability, vicarious liability, no-fault schemes) and score for "residue" (unallocated burden) on each of the four questions.

  *Sample Vignettes:*
  *   **Case A (The Black Box):** A medical diagnostic AI recommends a treatment that kills the patient. The recommendation resulted from a weight-shift in a neural net that occurred post-deployment, unforeseeable to designers. *Axis:* High Learning / Single Developer / Solvent. *Test:* Does strict liability cover compensation even if blame gaps?
  *   **Case B (The Supply Chain):** An autonomous delivery vehicle strikes a pedestrian due to a sensor calibration error. The sensor was made by Subcontractor X, integrated by Firm Y, operated by Gig-Worker Z. Firm Y declares bankruptcy. *Axis:* Low Learning / Many Hands / Insolvent. *Test:* Does the "many hands" problem create a compensation gap when the primary backstop fails?
  *   **Case C (The Open Source):** An open-source agricultural drone swarm damages a neighbor's crop due to emergent coordination behavior. No central entity exists. *Axis:* High Learning / Distributed Hands / No Backstop. *Test:* Is answerability possible without a corporate addressee?

  **4. Deliverables and Failure Modes**
  The primary deliverable is a **Responsibility Ledger**: a matrix mapping the 12 cases against the four burdens and the available allocators, highlighting specific residues. The secondary deliverable is a paper arguing that the "gap" is real but confined to *blame*, and assessing whether this matters.

  *Failure Modes:*
  1.  **Disaggregation Failure:** If the battery shows that all four burdens track together (i.e., whenever blame gaps, compensation also gaps), the disaggregation buys nothing. *Mitigation:* I will select cases specifically designed to decouple these (e.g., strict liability cases where compensation is guaranteed but blame is impossible).
  2.  **Absorption Failure:** If the legal analysis shows that existing mechanisms (e.g., expanded vicarious liability) can absorb even the blame residue, the project collapses into "this was a compensation debate all along." *Mitigation:* I will distinguish between *functional* absorption (paying the bill) and *normative* absorption (acknowledging fault). If the law pays but explicitly denies fault, the blame gap remains.

  **5. Feasibility and Scope**
  *Legal Analysis:* I am not a lawyer. A deep doctrinal analysis of specific jurisdictions is out of scope. I will analyze liability *principles* (e.g., the structure of strict liability vs. negligence) rather than statutory compliance. I have secured a commitment from a tort law colleague for two hours of consultation to sanity-check the legal mapping, but I will not rely on them for ongoing research. If the legal mapping proves too complex, I will reduce the battery from 12 cases to 6, prioritizing variety over volume.

  *Timeline (5 Months):*
  *   **Month 1:** Finalize the 12 vignettes. Ensure they vary cleanly across the three axes. (Budget: Print costs, small honorarium for colleague consultation).
  *   **Month 2:** Map allocators. Draft the "rules" for how negligence, strict liability, etc., apply to each vignette type.
  *   **Month 3:** Scoring and Ledger Construction. Run the allocators against the cases. Identify residues.
  *   **Month 4:** Drafting the paper. Focus on the normative significance of the blame residue.
  *   **Month 5:** Revision and submission.

  *Scope Management:* If the legal mapping stalls in Month 2, I will freeze the legal analysis at the level of "idealized typical systems" (e.g., how US/EU tort *generally* works) rather than digging into conflicting case law. The philosophical contribution is the disaggregation framework, not a legal brief. The TA buy-out funded by this grant is critical for Months 3 and 4 to ensure the scoring and drafting are completed without teaching interference.

  **6. Significance**
  This project moves the debate from metaphysics (can machines be agents?) to functional audit (where does the normative burden land?). If successful, it shows that the "responsibility gap" is not a reason to ban technology, but a specific signal that we are asking the wrong normative question. We may not need more blame; we may need better answerability.
