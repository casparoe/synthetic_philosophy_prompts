      6. Methodologist (Defining slope onset).
      7. Phil (Veto power).
      8. Grad Student (Textbook definition).

      *Wait, I need to make sure the EEG people sound like EEG people.* "Your high-pass filter is hiding the slow wave," "Signal-to-noise ratio," "Back-averaging induces the wave."
      *Modeler:* "Boundary separation," "Non-decision time parameter."
      *Barrister:* "*Mens rea*," "Causation," "Mitigation."

      *Okay, ready to write.*
answer: |-
  ### Q&A Prep Sheet: The "Untimable Agency" Thesis

  **Audience Profile:** 2 EEG Experimentalists (skeptical of RP), 1 Computational Modeler (DDM), 3-4 Compatibilists, 1 Criminal Barrister (Neurolaw), Grad Students.
  **Goal:** Defend the claim that the RP debate is a category error; decision-making is a slope, not an event; agency cannot be timed.

  ---

  #### Concessions to Make in the First 5 Minutes
  *Do not start by telling the experimentalists their data is noise. You will lose the room.*

  1.  **To the EEG Lab:** Concede that the Readiness Potential is a robust *statistical* signal, even if its single-trial physiological reality is debated. Acknowledge that backward averaging isn't the only tool in the box (acknowledge MVPA/decoding).
  2.  **To the Modeler:** Concede that Drift-Diffusion Models (DDM) fit reaction time data exceptionally well. Do not claim the math is wrong; claim the *ontological interpretation* of the threshold is wrong.
  3.  **To the Barrister:** Concede that the law *requires* a bright line for *actus reus*, even if nature does not provide one. You are describing the metaphysics, not writing the statute.

  ---

  #### The Objections (Ordered by Damage Potential)

  **1. The Computational Modeler (High Damage)**
  *Idiom:* "You're ignoring the boundary separation parameter. In a DDM, the decision *is* the threshold crossing. The accumulation is the noise, but the bound is the commitment. If you remove the threshold, the model doesn't output an action, it just outputs probability. You need a 'when' to get a 'what'."
  *   **Your Reply:** The threshold is a modeling convenience, not a neural event. In a continuous attractor network, 'crossing a bound' is just us drawing a line on a continuous landscape to make the math solvable. The brain doesn't check a variable against a limit; it flows. The model predicts *behavioral* timing, not the *ontological* moment of decision. Confusing the map for the territory is the root of the RP problem.
  *   **Soft Spot:** You haven't offered a competing mathematical formalism. If the DDM predicts behavior perfectly with a threshold, Occam's Razor suggests the threshold is functionally real, even if not "event-like" in a philosophical sense.

  **2. The EEG / MVPA Specialist (High Damage)**
  *Idiom:* "Forget backward averaging. We can decode movement intention from single-trial multivariate patterns in motor cortex 500ms before report. That's not a slope artifact; that's information state evolution. If the information is distinct before awareness, the decision state exists prior to the 'slope' completing."
  *   **Your Reply:** Decoding accuracy is probabilistic, not binary. You can predict a storm from barometric pressure before the rain falls, but the 'decision' to rain isn't a timestampable event in the pressure gauge. Early decoding shows *bias* or *preparation*, not a completed decision. You are measuring the steepening of the slope, not the start of the climb.
  *   **Soft Spot:** If decoding accuracy hits 100% at T-minus 400ms consistently, the distinction between "bias" and "decision" becomes verbal hair-splitting.

  **3. The Criminal Barrister (Medium-High Damage)**
  *Idiom:* "I deal in *mens rea* and *actus reus*. If I can't pinpoint when the defendant formed the intent, I can't distinguish preparation from attempt. If agency is a 'slope', mitigation becomes impossible. Are you telling the court that culpability is a gradient? Because the law doesn't do gradients on conviction."
  *   **Your Reply:** The law is a normative framework, not a descriptive science. It *imposes* timestamps for social utility. I'm arguing that neuroscience cannot *find* the timestamp the law wants. This doesn't break the law; it clarifies that legal responsibility is a social construct layered over biological continuity, not a discovery of neural facts.
  *   **Soft Spot:** This risks making your talk irrelevant to the neurolaw debate. If neuroscience can't find the moment, but the law needs one, the law will just pick an arbitrary neural marker (like the RP) anyway, and you've gained nothing.

  **4. The Compatibilist Philosopher (Medium Damage)**
  *Idiom:* "You're dissolving the problem by dissolving the agent. If there's no decision point, there's no point where reasons can intervene. We don't need a libertarian gap; we need a point where the system is reasons-responsive. Your 'slope' sounds like a reflex."
  *   **Your Reply:** Reasons-responsiveness doesn't happen at a moment; it shapes the slope. The gradient of the accumulation *is* the weighing of reasons. A steeper slope towards 'A' over 'B' reflects stronger reasons, not a sudden switch. You're looking for a homunculus checking the reasons; I'm saying the trajectory *is* the reasoning.
  *   **Soft Spot:** Hard to explain how "veto" or "control" works if the trajectory is determined by prior causes. Risks sliding into hard determinism, which compatibilists hate.

  **5. The Skeptical EEG Experimentalist (Medium Damage)**
  *Idiom:* "I'm one of the ones who thinks the RP is an artifact. But if you agree with me, why are we having this talk? If the signal is garbage, your whole 'slope' argument is built on measuring noise. You're fighting a strawman Libet with data we already discarded."
  *   **Your Reply:** Even if the RP specifically is an artifact, the *logic* of the debate assumes a discrete decision exists to be measured. My point holds even if we find a 'perfect' signal. The problem isn't the measurement; it's the assumption that 'deciding' is a discrete state that *can* be measured. I'm saving you from the next 30 years of searching for the 'real' decision signal that doesn't exist.
  *   **Soft Spot:** Sounds dismissive of their empirical work. They may feel you're using their skepticism to prop up a metaphysical claim they don't care about.

  **6. The Methodologist / Grad Student (Low-Medium Damage)**
  *Idiom:* "You say a slope has no timestamp, but in time-series analysis, we define onsets all the time. Fractional peak latency, onset thresholds, derivative zero-crossings. We can time the slope. Why is that not the decision time?"
  *   **Your Reply:** Those are analytic conventions, not biological boundaries. Choosing the 50% peak point is like deciding a child becomes an adult at midnight on their 18th birthday. It's useful for paperwork, but biology didn't change at midnight. You're measuring *when we decide to call it a decision*, not the decision itself.
  *   **Soft Spot:** Functionally, if the analytic convention predicts behavior, the biological "reality" matters less than you're claiming.

  **7. The Libertarian-Leaning Phil (Low Damage)**
  *Idiom:* "What about the veto? Libet left room for the 'free won't'. If the slope is continuous, can't consciousness intervene to flatten it before the action?"
  *   **Your Reply:** The veto is just a second, counter-acting slope. It's not a ghost in the machine hitting a brake pedal; it's competing neural populations. If the 'veto' slope wins, you didn't act. But that competition is also untimable. You haven't found a gap for free will; you've just added more slopes.
  *   **Soft Spot:** Doesn't fully address the *phenomenological* experience of stopping oneself, which feels discrete to the subject.

  **8. The Textbook Grad Student (Low Damage)**
  *Idiom:* "But the textbooks say the RP proves determinism. If you're right, what do we tell the undergrads? Is the whole chapter wrong?"
  *   **Your Reply:** The chapter isn't wrong, it's incomplete. It teaches the history of the debate, not the resolution. Tell them the RP shows preparation, not decision. It's a great lesson in how not to conflate correlation with causation and averages with single events.
  *   **Soft Spot:** None really, just housekeeping.

  ---

  #### The One Question You Hope Nobody Asks

  **"If agency is un-timable and the veto is just another slope, what normative work is your theory actually doing? Are you a determinist, and if so, why should we care about neuroscience at all if the answer was already settled by Hume?"**

  *Why this hurts:* It exposes that your metaphysical conclusion (agency is un-timable) might be independent of the empirical data (RP/DDM). If the answer is the same regardless of the neuroscience, the experimentalists in the room have just wasted an hour. It forces you to admit whether you are doing science or philosophy, and right now you are straddling the line in a way that might satisfy neither.
