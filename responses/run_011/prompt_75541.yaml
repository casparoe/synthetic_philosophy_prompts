      *   **Speaker's Thesis:** The Readiness Potential (RP) debate is a dead end. Whether RP is real or artifact, it doesn't matter. Decision-making is a slope, not an event (no timestamp). Therefore, the "veto" power (Libet's *freum*) also collapses into a slope. Agency cannot be timed.
      *   **Deliverables:**
          1.  7-8 Objections (ordered by damage potential), phrased in the objector's specific idiom (EEG people sound like EEG people, etc.).
          2.  2-minute replies for each.
          3.  Blunt note on the "soft spot" of each reply.
          4.  Concessions to make in the first 5 minutes (to appease methodologists).
          5.  The one question the speaker hopes nobody asks.

  2.  **Deconstruct the Audience & Thesis:**
      *   *EEG People:* Care about signal-to-noise, filtering, averaging artifacts, biological plausibility. They hate philosophical overreach based on "dirty" data.
      *   *Computational Modeler:* Cares about drift-diffusion models (DDM), thresholds, noise, simulation validity.
      *   *Compatibilists:* Care about moral responsibility, reasons-responsiveness, not necessarily libertarian free will. They might feel threatened if "agency" is dissolved too thoroughly.
      *   *Barrister (Neurolaw):* Cares about culpability, mitigation, the legal definition of "act" vs. "impulse." If there's no decision moment, when is the *actus reus*?
      *   *Grad Students:* Confused, looking for clarity on the "standard story."

      *   *Thesis Weaknesses:*
          *   "Agency isn't the sort of thing that can be timed" is a category error claim that scientists hate (they time everything).
          *   Dismissing the RP as "doesn't matter" annoys people who spent careers measuring it.
          *   The "slope" argument risks dissolving agency entirely, which scares the compatibilists and the barrister.
          *   The "veto" collapse needs to address conscious intervention.

  3.  **Drafting the Objections (Iterative Process):**

      *   *Objection 1 (EEG):* "You're dismissing the signal too easily." *Idiom:* Filtering, averaging, muscle artifact. *Damage:* High. If the data is trash, the theory is trash.
      *   *Objection 2 (Modeler):* "DDM has a threshold." *Idiom:* Boundary separation, accumulation to bound. *Damage:* High. Contradicts the "no timestamp" claim directly.
      *   *Objection 3 (Barrister):* "Legal responsibility requires a point of no return." *Idiom:* *Mens rea*, mitigation, sentencing. *Damage:* Medium-High. Practical implications.
      *   *Objection 4 (Compatibilist):* "You're throwing out the baby with the bathwater." *Idiom:* Reasons-responsiveness, control. *Damage:* Medium. Philosophical alignment.
      *   *Objection 5 (EEG/Methodologist):* "Backward averaging isn't the only way." *Idiom:* Single-trial analysis, machine learning decoding. *Damage:* Medium. Technical rebuttal.
      *   *Objection 6 (Grad Student/General):* "What about the feeling of willing?" *Idiom:* Phenomenology, introspection. *Damage:* Low-Medium. Easy to dismiss but needs care.
      *   *Objection 7 (Modeler/EEG hybrid):* "The slope *is* the decision." *Idiom:* Distributed processing, neural population vectors. *Damage:* Medium. Reframes the thesis rather than refuting it.
      *   *Objection 8 (Barrister/Phil):* "If no veto, no blame." *Idiom:* Determinism, excuse conditions. *Damage:* High. The "so what?" factor.

      *Refining Idioms:*
      *   EEG: "High-pass filters," "muscle artifact," "signal-to-noise," "back-averaging," "single-trial."
      *   Modeler: "Drift rate," "boundary separation," "non-decision time," "stochastic accumulation."
      *   Barrister: "*Actus reus*," "mitigation," "culpability," "precedent."
      *   Phil: "Reasons-responsiveness," "leeway," "sourcehood."

      *Ordering by Damage:*
      1.  Modeler (Thresholds exist mathematically).
      2.  EEG (Single-trial decoding proves prediction).
      3.  Barrister (Legal chaos if no act).
      4.  Compatibilist (Dissolving agency helps no one).
      5.  EEG (Artifact claim is too strong).
      6.  Modeler (Slope *is* the event functionally).
