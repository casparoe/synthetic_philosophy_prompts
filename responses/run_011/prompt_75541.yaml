      *   Concessions included? Yes.
      *   Dreaded question included? Yes.

      *(Self-Correction during drafting)*: Make sure the EEG people don't sound like they read too much Chalmers. They should sound like they care about voltage and filters. The Modeler should care about parameters. The Barrister should care about precedent and blame.

