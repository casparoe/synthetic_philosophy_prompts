answer: |-
  - "The job this principle has to do"

  Adequacy here isn't about moral perfection; it's about survival. You need a rule that a city clerk can execute without a lawyer on speed dial, that survives a state court challenge, and that doesn't let the city council gerrymander the electorate to guarantee the waste plant's approval. It must produce a binary list—vote or no vote—that remains stable enough for people to plan their lives, even though the underlying realities (who lives where, who owns what) are fluid. If the rule creates more litigation than clarity, or if the excluded population (like the neighboring township) views the boundary as illegitimate theft, the commission has failed. The principle must bridge the gap between philosophical justice and administrative reality.

  - "The requirements"

  1.  **Administrative Determinacy & Stability [Load-bearing]**
      *Case:* The second-home owner lives 400 miles away but has a mailing address here. The commuter sleeps in the county but works downtown.
      *Why:* A clerk must be able to draw the voter roll using objective data (tax records, lease filings, DMV registration) without conducting intent hearings. If the rule relies on subjective "community attachment," elections will be delayed by lawsuits. Furthermore, the rule cannot change every cycle; residents need to know if turning 18 or buying a house grants voting rights before they make the move. Without this, the election machinery jams.

  2.  **Boundary Self-Restraint [Load-bearing]**
      *Case:* The city council wants the waste plant; the township next door gets the emissions but no vote.
      *Why:* The body setting the boundary (the commission/council) benefits from where the line falls. If the rule allows them to exclude those who bear the costs (township residents) while including those who bear none (distant owners), the outcome is coerced. This isn't a preference for fairness; it's a requirement for legitimacy. If the excluded can prove the boundary was drawn to silence opposition, the vote is voidable.

  3.  **Thresholded Affectedness [Load-bearing]**
      *Case:* Commuters vs. Second-home owners vs. Undocumented residents.
      *Why:* "Affected" is infinite. The waste plant affects the climate globally; that doesn't give everyone a vote. The rule must specify a threshold of intensity and proximity that converts an interest into a entitlement. It must distinguish between paying a sales tax (commuter) and breathing the stack emissions (township). Without a defined threshold, the demos expands until it includes everyone or collapses because no one qualifies definitively.

  4.  **Nested Jurisdiction Compatibility [Load-bearing]**
      *Case:* Undocumented residents or 16-year-olds.
      *Why:* Your city sits inside a state and county. If state law prohibits non-citizen voting, your charter provision is dead on arrival. If federal law preempts local election security, you are liable. A local demos principle cannot contradict higher-order legal constraints. This isn't about morality; it's about enforceability. A rule that requires violating state statute to implement is not a rule; it's a manifesto.

  5.  **Property Ownership as Stake [Camp Furniture]**
      *Case:* The second-home owner argues they pay property taxes and fund the city.
      *Why:* Proponents claim this ensures voters have financial skin in the game. However, this is a ideological commitment to capital over presence, disguised as a requirement. It fails the "Boundary Self-Restraint" test by empowering absentee landlords over residents who breathe the air. It is not load-bearing because cities function with renter majorities; including it privileges one economic class without solving the administrability or legitimacy problems.

  6.  **Reciprocal Community Obligation [Camp Furniture]**
      *Case:* Arguments that only those who "share a life" here should vote.
      *Why:* This sounds noble but is administratively invisible. How does a clerk measure "shared life"? It often functions as a dog whistle for exclusionary residency requirements that mask xenophobia or classism. While social cohesion is desirable, making it a voting prerequisite creates subjective barriers that violate Administrative Determinacy. It is a preference for a specific type of polity, not a functional requirement for holding an election.

  7.  **Equal Weight of Vote [Load-bearing]**
      *Case:* Second-home owners vs. Primary residents.
      *Why:* If ownership grants voting, does owning five rental properties grant five votes? If not, why does ownership grant one? Within the defined demos, each person must count equally. If the rule creates classes of voters with different weights (e.g., property owners get a surcharge vote), it violates constitutional equal protection standards in most states. This is a legal hard-stop, not a philosophical preference.

  - "Load-bearing vs. camp furniture"

  Load-bearing requirements are those without which the election cannot physically or legally occur. Administrative Determinacy, Nested Compatibility, and Equal Weight are structural; without them, the clerk cannot print ballots, the state voids the result, or the courts strike it down. Boundary Self-Restraint is political load-bearing; without it, the excluded party revolts or litigates successfully.

  Camp furniture consists of normative preferences dressed as structural necessities. "Property Ownership" and "Reciprocal Community" are arguments about what kind of city you *want*, not what is needed to hold a vote. Proponents frame them as requirements for "responsibility" or "cohesion," but they are actually policy choices about distribution of power. You can have a valid election without them. Confusing the two leads to charter provisions that sound good but fail in court or at the clerk's desk. The commission's job is to secure the structure, not enforce a specific moral vision of citizenship.

  - "Where the list breaks"

  Your nagging sense is correct: you cannot jointly satisfy "Perfect Affectedness" and "Administrative Determinacy." To be genuinely binding on the excluded, the demos should include everyone significantly affected (the township). But to be administrable, the line must be binary and based on simple proxies (city limits). There is no clean map where the political boundary matches the impact boundary of a waste plant.

  To resolve this, you must drop the claim that the rule perfectly matches affectedness. You have to accept that some affected people (township) will be excluded, and some unaffected people (second-home owners) might be included, because the cost of drawing a custom boundary for every issue is too high. The requirement that must be reinterpreted is "Thresholded Affectedness." It cannot mean "all affected." It must mean "all affected *who can be identified by a stable proxy*."

  This creates a legitimacy deficit. The only way to patch it is through "Boundary Self-Restraint." If the city acknowledges the mismatch and creates mitigation (payments to the township) rather than pretending the voting boundary is morally perfect, the system survives. The break isn't in the logic; it's in the expectation that a voting rule can solve a spatial externality problem. It can't. It can only manage the fallout.

  - "Quick sort"

  **All Affected Interests:** Fails Administrative Determinacy. You cannot measure "affectedness" for every voter without infinite inquiry. It also fails Stability, as interests shift per issue.
  **All Subject to Laws:** Fails Nested Compatibility. Non-voters are subject to laws too (tourists, undocumented). It doesn't distinguish who decides the laws.
  **Reciprocal Obligation:** Fails Administrative Determinacy. "Sharing a life" is unmeasurable by a clerk. It collapses into subjective residency tests.
  **No Single Demos (Issue-specific):** Fails Stability. Changing the electorate for every ballot measure creates chaos and allows gerrymandering of the voters themselves.

  The single requirement that knocks out the most contenders is **Administrative Determinacy**. It eliminates the nuanced theories (Affected, Obligation, Issue-specific) because they require case-by-case judgments that a city clerk cannot execute at scale. Only rigid proxies (residency, citizenship) survive this filter, even if they are morally imperfect. This is why most cities default to residency: not because it's the most just, but because it's the only one that produces a list.

  - "What I'd tell the commission"

  Write three constraints into your charge. First, **Administrative Determinacy**: the rule must rely on existing public records (tax, DMV, lease) available 30 days before the election. Second, **Nested Compatibility**: explicit confirmation that the rule does not violate state election code. Third, **Boundary Self-Restraint**: a requirement to document how non-voting affected parties (like the township) are consulted, even if they can't vote. Do not write "community sharing" or "financial stake" into the charter; those are debates for the council, not rules for the clerk. Keep it boring so it works.
