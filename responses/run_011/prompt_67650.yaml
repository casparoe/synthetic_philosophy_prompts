      *Decision:* The cost of dropping 5 is high (paralysis). The cost of dropping 1 is high (back to standard macro risk models). The revision should be semantic/conceptual: Distinguish *rationality of belief* from *necessity of action*.

      *Refining the "Weight" issue:* The user thinks Weight (2) might undo Non-numerical (1). Actually, Keynes's *Treatise* view (logical relations) is rejected in (7). The *General Theory* view (psychological/weight) fits better with Imprecise Probability. I need to make sure I don't confuse Treatise Keynes with GT Keynes. Point 7 rejects Treatise. Point 1 & 2 are GT/Chapter 12 style. This is consistent.

