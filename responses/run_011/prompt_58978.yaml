answer: |-
  The requirements are not jointly satisfiable, and the requirement for Phenomenological Sovereignty does the most work by invalidating the Administrative Binary required for legal use.

  1.  **Administrative Binary:** For any night *n*, the account must yield a determinate true/false verdict on whether the subject at *n* is numerically identical to the subject at *n=0*, accessible to a judge without philosophical training.
      *   *Motivation:* The intended use is informed consent and legal personhood; a court cannot adjudicate liability or validity of consent on a spectrum or indeterminate metaphysical status, and an engineer needs a clear stop/go signal for liability waivers.
  2.  **Phenomenological Sovereignty:** The account must treat the subject's report of discontinuity (Feature 6) as decisive evidence of non-survival, overriding third-person behavioral or functional metrics.
      *   *Motivation:* Feature 6 stipulates the report is sincere, accurate regarding how things seem, and not a symptom; an account of *personal* survival that ignores the person's own experience of surviving fails to track the phenomenon it claims to define.
  3.  **Fission Safety:** The account must affirm the survival of the original subject through the procedure despite the temporary existence of the snapshot copy (Feature 5).
      *   *Motivation:* Feature 5 describes a branching event where the original continues unaware; if the account implies the original ceases to exist because a copy exists, it violates the biological fact of the original's continued life and undermines the consent given by the original.
  4.  **Functional Materialism:** The account must permit survival through total material replacement provided functional profiles are maintained within the specified tolerance (Feature 1 & 4).
      *   *Motivation:* Feature 1 and 4 establish gradual replacement with functional drift but preserved test scores; an account that demands biological continuity contradicts the stipulated success of the neural replacement and renders the procedure impossible by definition.
  5.  **Latent Biological Priority:** The account must acknowledge the moral significance of the viable original neurons (Feature 3) without granting them veto power over the procedure's continuity.
      *   *Motivation:* Feature 3 establishes the original tissue remains viable; an account must distinguish between the person and the organism to allow replacement, yet account for why re-implantation restores status quo without implying the intermediate subject was a distinct entity.

  **Analysis of Requirements**

  **Marking:**
  *   **Administrative Binary (Non-negotiable):** This is not a preference of a philosophical camp but a constraint of the intended use (legal/consent); without it, the consortium cannot draft the document.
  *   **Phenomenological Sovereignty (Non-negotiable):** This is mandated by the case stipulations (Feature 6); to treat the report as a symptom would violate the instruction to treat it as a datum.
  *   **Fission Safety (Preference):** Preferred by **Four-dimensionalist** and **Identity-not-what-matters** accounts, which can distinguish the original temporal branch from the copy without denying survival; **Psychological** accounts struggle here if continuity is branched.
  *   **Functional Materialism (Preference):** Preferred by **Psychological-continuity** accounts, which prioritize memory and character over substrate; **Animalist** accounts reject this as it severs identity from the organism.
  *   **Latent Biological Priority (Preference):** Preferred by **Biological/Animalist** accounts, which ground identity in the organism's life but must explain away the replacement; **Psychological** accounts find this irrelevant unless biology impacts psychology.

  **Derivation of Tension:**
  The subset {Administrative Binary, Phenomenological Sovereignty} cannot be jointly satisfied given the Night Shift. Administrative Binary requires a stable, objective truth value for identity to validate consent at Night 1 for procedures at Night 150. Phenomenological Sovereignty requires that if the subject reports "I am not the one who had the memories" from Night 100 onward, the account must verdict "Not Identical." If the account verdicts "Not Identical" at Night 100, the consent signed at Night 1 is invalid for the procedure at Night 100, violating the legal constraint that consent must hold through the procedure. If the account verdicts "Identical" to preserve consent, it violates Phenomenological Sovereignty by treating the subject's sincere report as false regarding survival. Since both requirements are marked non-negotiable (one by context, one by case stipulation), the system collapses.

  **Eliminator:**
  **Phenomenological Sovereignty** is the single requirement that eliminates the largest number of otherwise attractive candidates. It forces any account to privilege first-person seeming over third-person continuity, biological persistence, or temporal extension, rendering standard metrics of identity unusable for the required binary verdict.

  **Closing**
  Phenomenological Sovereignty damages all four camps by forcing them to abandon their primary criteria for survival in favor of subjective report. For **Psychological-continuity** accounts, it invalidates the preserved memory and character tests (Feature 6) in favor of the feeling of discontinuity. For **Biological/Animalist** accounts, it renders the continuous life of the organism irrelevant if the subject feels replaced. For **Four-dimensionalist** accounts, it privileges the current temporal slice's seeming over the existence of the extended temporal worm. For **Identity-not-what-matters** accounts, it collapses the distinction between identity and survival, making the subject's feeling of non-identity decisive against the pragmatic fact of continued existence.
