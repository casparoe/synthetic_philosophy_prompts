answer: |-
  **The Scenario**
  In a closed-loop high-density server farm, a maintenance robot must swap a failed cooling fan in Rack A. The room's airflow is tightly coupled; removing the fan creates a pressure differential that redirects hot exhaust from Rack A into the intake of Rack Z, fifty feet away. The Symbolic System (Logic) models the room as a set of physical fluents governed by fluid dynamics equations; it calculates the pressure shift, predicts the thermal spike in Rack Z, and activates the emergency baffles before moving the fan. The Statistical System (Learning) uses a factored reinforcement policy trained on 100,000 successful swaps; it has learned to treat "Temperature of Rack Z" as an invariant fluent relative to "Action: Swap Fan in Rack A" because the training data (where automated HVAC compensated) showed zero correlation. It swaps the fan, ignores Rack Z, and the servers cook.

  **Analysis of the Failure**
  The Symbolic System succeeds because its representation of change is **derivational**. It does not assume inertia (that things stay the same) unless the physics dictates it. It explicitly computes the value of every fluent in its ontology after the action. Since the ontology includes air pressure and thermal propagation, the side effect is visible. It solves the Frame Problem by *not* using frame axioms to prune the search space, relying instead on the tractability of the closed environment to bear the computational cost.

  The Statistical System fails because its representation of change is **factored**. To make learning tractable, it decomposes the state space into independent variables (Rack A Temp, Rack Z Temp, Fan Status). It learns a "relevance filter" implicitly: the transition probability for Rack Z Temp is conditioned only on Rack Z's history and Thermostat Actions. It assumes *ceteris paribus* (all else remains equal) based on statistical independence observed in the training distribution. This is a structural Frame Problem failure: the system represents the world such that the change in Rack Z is *invisible* to the action at Rack A, not because it lacks data, but because its state representation enforces inertia on that fluent by design.

  **The Key Feature: Latent Causal Coupling**
  The one feature doing the work is **non-local causal coupling masked as statistical independence**. In the training data, the HVAC system compensated for the pressure changes, making Rack Z's temperature statistically independent of Rack A's fan status. The Learning system codified this correlation into its frame axioms (its transition model). The Logic system, modeling physics rather than correlations, captures the coupling regardless of the HVAC's compensation history.

  **Counterfactual: Removing the Feature**
  If you remove the causal coupling (e.g., the racks are hermetically sealed with independent cooling), the verdicts flip or equalize. The Learning system's assumption of independence becomes correct, and it acts efficiently. The Logic system still succeeds but incurs a higher computational cost for calculating the null effect. The specific failure of the Learning system vanishes because its "frame" (what it assumes doesn't change) aligns with reality.

  **The Skeptic's Reply (Engineering Noise)**
  "This isn't an epistemological crisis; it's a feature engineering error. You built the Learning system with a factored state space that excluded the global pressure variable. If you had included 'Room Pressure' as a feature in the neural network's input layer, the gradient descent would have weighted it appropriately. The Frame Problem is just the problem of choosing the right features, and that's an engineering optimization task, not a philosophical limit on AI. Your Symbolic system only 'won' because you manually gave it the right features (physics equations) while starving the Learning system of them. That's a rigged test, not a proof of conceptual failure."
