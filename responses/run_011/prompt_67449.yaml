      *   *Refining the "Amounts of Mind" point:* I need to be careful. Clark and Chalmers do talk about cognitive *capacity*. But "more mind" suggests a quantification of the self. I should characterize this as a rhetorical flourish that goes beyond the technical thesis.
      *   *Refining the Legal Point:* The philosopher is right that EMT *could* have legal consequences, but courts haven't adopted EMT. They rely on privacy expectations. I should note that the *theory* supports the argument, even if the *law* hasn't caught up.

