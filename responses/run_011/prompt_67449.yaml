  7.  **Final Polish:** Ensure the distinction between "cognitive capacity" and "amount of mind" is clear. Ensure the distinction between "tool" and "part of the system" is clear. (Self-Correction: Make sure to emphasize that EMT is a minority view in philosophy, though influential, so the journalist knows this isn't settled science.)

