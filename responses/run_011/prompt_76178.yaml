prompt: |-
  I serve on the capital-review panel of a regional flood-risk authority. Our standing rule requires that any engineering investment recommendation rest on a single point estimate of the annual probability of the design event. A climate-model ensemble for our watershed does not support one: members yield annual probabilities for the event in question ranging from roughly 2% to roughly 9%, and there is no principled basis for weighting them, since the relevant record is too short and too nonstationary to score the members against. The levee raise now before us is cost-justified at 6% and clearly not at 2.5%; staff recommend returning the analysis for a point estimate, which would delay the project about eighteen months.

  Draft the memo I will circulate before Thursday's meeting. Write as an expert in formal epistemology and decision theory who has actually sat on technical advisory panels, and think the competing considerations through before settling on a recommendation. The memo should:

  (a) decide this project — approve, reject, defer, or approve subject to conditions — with any conditions stated precisely enough that staff could implement them, and with the bottom line given in the first two sentences;

  (b) say what the panel's general rule ought to be when the available evidence supports an interval rather than a point, setting out the candidate rules for acting under such evidence (acting as if the worst case in the range held, acting on some midpoint or weighted combination, comparing options pairwise across the whole set of admissible probabilities, deferring until precision improves) and which one you would adopt and why;

  (c) state whether the standing point-estimate rule should be amended, and how.

  Then give the strongest case against your recommendation — in particular, the worry that once intervals are admissible, advocates will simply widen theirs to whatever serves their project, and that a panel unable to insist on a number has lost the ability to say no. Engage that worry concretely, with a workable constraint if you can find one, rather than acknowledging it in passing. No citations or bibliography; I want the reasoning, not the references.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Expert in formal epistemology and decision theory with experience on technical advisory panels.
      *   **Task:** Draft a memo to be circulated before Thursday's meeting of a capital-review panel for a regional flood-risk authority.
      *   **Context:**
          *   Standing rule: Requires a single point estimate of annual probability for engineering investments.
          *   Problem: Climate model ensemble gives a range (2% to 9%). No principled weighting possible (short/nonstationary record).
          *   Project Status: Levee raise is cost-justified at 6% probability, *not* at 2.5%.
          *   Staff Recommendation: Return analysis for a point estimate (18-month delay).
      *   **Requirements:**
          *   (a) Decide the project (Approve, Reject, Defer, or Approve w/ Conditions) in the first two sentences. Conditions must be implementable.
          *   (b) Establish a general rule for handling intervals vs. points (discuss candidate rules, choose one, justify).
          *   (c) State whether the standing point-estimate rule should be amended and how.
          *   (d) Present the strongest case against the recommendation (specifically the "gaming the interval" worry) and engage it concretely with a workable constraint.
          *   **Tone:** Expert, reasoned, decisive, practical but theoretically grounded. No citations/bibliography.

  2.  **Determine the Decision (Requirement a):**
      *   *Option 1: Defer for 18 months.* This follows staff recommendation. It adheres to the standing rule but ignores the epistemic reality (we won't get a better point estimate in 18 months; the climate uncertainty is structural). It incurs significant cost/risk delay.
      *   *Option 2: Reject.* The project isn't justified at the lower bound (2.5%). If we are risk-averse regarding public funds, we might say "not proven." But if the risk is real (up to 9%), rejecting exposes the region to flood risk.
      *   *Option 3: Approve.* Justified at 6% (near upper bound). But if the true probability is 2%, we wasted money.
      *   *Option 4: Approve Subject to Conditions.* This seems the most robust decision-theoretic approach. We acknowledge the uncertainty (Knightian/ambiguity) and structure the investment to handle it.
      *   *Decision:* **Approve subject to conditions.** Why? Because the cost of delay (18 months) likely exceeds the cost of "over-investing" if the risk is lower, given the catastrophic nature of flood failure (asymmetry of loss). However, to protect against waste, we need adaptive management.
      *   *Drafting the opening:* "I recommend we approve the levee raise subject to a binding adaptive-management trigger, rather than deferring for a spurious precision. The project proceeds immediately, but subsequent capital phases require renewed probability assessment."

  3.  **Develop the General Rule (Requirement b):**
      *   *Context:* Evidence supports an interval (2-9%), not a point. This is "imprecise probability" or "ambiguity."
      *   *Candidate Rules:*
          1.  *Maximin (Worst Case):* Act as if 9% is true. Safe but potentially wasteful.
          2.  *Principle of Insufficient Reason (Midpoint):* Act as if 5.5% is true. Arbitrary given nonstationarity.
          3.  *E-Admissibility (Pairwise Comparison):* Check if the project dominates alternatives across the *whole* range. If it's good at 9% but bad at 2%, it's not E-admissible.
          4.  *Deferral:* Wait for better data. (Often futile in climate contexts).
      *   *Selection:* **E-Admissibility with a Minimax Regret caveat.** Or simpler: **Robust Satisficing.** Let's go with a modified **E-Admissibility** approach. If a project is cost-justified across the *entire* plausible range, do it. If it fails across the *entire* range, reject it. If it crosses the threshold (as this one does), we need a specific rule.
      *   *Refined Selection:* **Approve if justified at the lower bound, or if the cost of failure at the upper bound vastly exceeds the cost of over-investment.** Actually, for a general rule, it's better to say: **When evidence yields an interval, decisions must be robust across that interval.** If a decision flips within the interval (like this one), we cannot treat the interval as a point. We must use **Adaptive Pathways**.
      *   *Decision for Memo:* Adopt a rule of **"Robustness over Precision."** When an interval is the best available epistemic product, the decision rule must evaluate performance across the interval. If the decision is sensitive to the variance (as here), we approve only with adaptive triggers.

  4.  **Amend the Standing Rule (Requirement c):**
      *   *Current:* Requires single point estimate.
      *   *Problem:* Forces fabrication of false precision.
      *   *Amendment:* Allow **Probability Intervals** or **Scenario Sets**. Require sensitivity analysis across the admissible range.
      *   *Drafting:* Amend the rule to accept bounded probability estimates where point estimates are epistemically unsupported, provided a sensitivity analysis demonstrates the decision's robustness or specifies adaptive triggers.

  5.  **Address the Counter-Argument (Requirement d):**
      *   *The Worry:* "Interval inflation." Advocates will widen intervals to make projects pass (e.g., "It might be 1% or 50%, so let's build for 50%"). Or, they will use intervals to avoid accountability. If we can't demand a number, can we say no?
      *   *Engagement:* This is a principal-agent problem.
      *   *Constraint:* **Burden of Proof on Bounds.** The proponent must justify the *bounds* of the interval with the same rigor previously required for the point. If the interval is too wide to yield a decision, the project is "Not Ripe," not "Approved."
      *   *Specific Constraint:* **The "Decision-Relevance" Test.** An interval is only admissible if the width is justified by physical/model uncertainty, not parameter convenience. Furthermore, if the interval spans the cost-benefit threshold, **automatic approval is forbidden.** It requires the adaptive conditions mentioned in (a). This prevents using a wide interval to force a "worst-case" build without proof.

  6.  **Drafting - Tone and Voice:**
      *   Needs to sound like a seasoned expert. Confident, clear, slightly academic but pragmatic.
      *   Avoid jargon where possible, but use terms like "epistemic," "nonstationary," "false precision."
      *   Structure: Header, Opening Decision, General Rule, Rule Amendment, Counter-Argument/Constraint.

  7.  **Refining the Decision Logic (Self-Correction during drafting):**
      *   *Wait, check the math:* Project justified at 6%, not at 2.5%. Range is 2% to 9%.
      *   If we approve now, we are betting the probability is > ~4-5% (break-even).
      *   If we defer, we wait 18 months for... what? Staff admits no principled basis for weighting. So 18 months buys us nothing epistemic, only political cover.
      *   Therefore, Deferral is irrational.
      *   Approval must be conditional. The condition: The levee design should be modular or the next phase contingent.
      *   *Correction on General Rule:* The rule shouldn't just be "use intervals." It should be "If the interval straddles the decision threshold, you cannot treat it as a point. You must either (1) find a solution robust across the interval or (2) implement adaptive management."
      *   *Correction on Counter-Argument:* The worry is that intervals become "get out of jail free" cards. The constraint must be that **wide intervals that prevent clear decisions result in project rejection or mandatory adaptation,** not automatic approval based on the upper bound. This stops advocates from widening the interval to force a "worst-case" spend.

  8.  **Final Polish:**
      *   Check constraints: First two sentences for bottom line? Yes. No citations? Yes. Engage the "gaming" worry concretely? Yes.
      *   Ensure the voice is authoritative. "I recommend..." "The panel ought to..."

  9.  **Final Review against constraints:**
      *   (a) Decision in first two sentences? *Yes.*
      *   (b) General rule for intervals? *Yes.*
      *   (c) Amend standing rule? *Yes.*
      *   (d) Strongest case against + workable constraint? *Yes.*
      *   Tone: Expert epistemologist/panelist. *Yes.*

  *(Self-Correction on the "First Two Sentences" constraint)*: Make sure the very first paragraph hits the decision hard.
  *(Self-Correction on the "Constraint")*: Make sure the constraint isn't just "be careful." It needs to be procedural. "Burden of Proof on Interval Width" + "Straddling Threshold = Adaptive Requirement."

  Let's write.

  *Drafting the Opening:*
  "I recommend we approve the levee raise immediately, subject to a binding condition that the next phase of capital investment in this watershed requires a renewed probability assessment no sooner than five years. Deferring for eighteen months to manufacture a false point estimate is epistemically unsound and incurs unnecessary risk exposure."

  *Drafting the Rule:*
  Focus on "E-Admissibility" concept without necessarily naming it if it sounds too academic, but describe the logic. If the decision flips, you need adaptive management.

  *Drafting the Counter:*
  The "Gaming" worry. If I say "use intervals," people will say "1% to 99%" to force a worst-case build.
  Constraint: If the interval spans the cost-benefit threshold, the default is *not* to build to the upper bound. The default is to build to the lower bound + adaptation, or reject. The burden is on the proponent to narrow the interval or justify the upper-bound spend via catastrophic consequence analysis (which is separate from probability).

  *Refining the Constraint:*
  Let's make it: **"The Threshold Straddle Rule."** If the interval straddles the investment threshold, automatic approval at the upper bound is prohibited. The project must be redesigned for modularity or rejected. This prevents using uncertainty to justify gold-plating.

