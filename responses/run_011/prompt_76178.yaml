answer: |-
  **MEMORANDUM**

  **TO:** Capital-Review Panel, Regional Flood-Risk Authority
  **FROM:** [Your Name], Technical Advisory Member
  **DATE:** October 24, 2023
  **SUBJECT:** Decision Protocol for Levee Raise Project 44-B and Probabilistic Standards

  I recommend we approve the levee raise immediately, subject to a binding condition that the next phase of capital investment in this watershed requires a renewed probability assessment no sooner than five years. Deferring for eighteen months to manufacture a false point estimate is epistemically unsound and incurs unnecessary risk exposure.

  **1. Decision on Project 44-B**
  The staff recommendation to return the analysis for a single point estimate rests on the assumption that precision is attainable within the delay period. Given the nonstationarity of the climate record and the structural disagreement among ensemble members, an eighteen-month delay will not collapse the 2%–9% probability interval into a reliable point. It will merely shift the administrative burden. Since the project is cost-justified at 6% and the ensemble suggests a significant likelihood of exceeding this threshold, inaction carries expected costs higher than over-investment. However, because the project is *not* justified at the lower bound (2.5%), we cannot approve it as a final, static solution.

  Therefore, approval is granted **subject to the following condition**: The current design must be constructed with modular crest-heightening capacity. Any future expenditure to raise the levee further must be predicated on a new five-year review of the probability interval. This locks in the immediate risk reduction while preventing the sunk-cost fallacy from driving future investments if the probability trend moves toward the lower bound.

  **2. General Rule for Interval Evidence**
  Going forward, the panel must adopt a formal rule for handling evidence that supports an interval rather than a point. We face four candidate rules when confronting admissible probability ranges:

  *   **Maximin (Worst-Case):** Act as if the upper bound of the probability interval is the truth. This maximizes safety but invites massive resource misallocation if the true risk is near the lower bound.
  *   **Principle of Insufficient Reason (Midpoint):** Act on the average of the bounds. This is arbitrary when model members cannot be weighted, effectively pretending we have information we lack.
  *   **Deferral:** Refuse to act until the interval narrows. This is valid only if new data is expected to resolve the uncertainty; in climate contexts, this often amounts to indefinite paralysis.
  *   **Robustness/E-Admissibility:** Evaluate whether a decision is optimal across the *entire* admissible range. If a project is beneficial at the lower bound and the upper bound, proceed. If it is detrimental at both, reject. If the decision flips within the range (as in Project 44-B), the decision must be adaptive.

  I recommend we adopt the **Robustness with Adaptive Triggers** rule. When an interval straddles the cost-benefit threshold, we should not collapse the interval to a point to force a binary choice. Instead, we must require that the investment be structured to remain rational across the range. This means prioritizing modular designs, real-options planning, or phased implementation. We treat the uncertainty not as a number to be guessed, but as a parameter to be managed over time.

  **3. Amendment to Standing Rule**
  The standing rule requiring a single point estimate must be amended. It currently incentivizes staff to fabricate precision by arbitrarily weighting models or ignoring outliers to satisfy a procedural checkbox.

  **Proposed Amendment:** "Engineering investment recommendations shall rest on the best available characterization of uncertainty. Where epistemic limitations prevent a principled point estimate, a bounded probability interval is admissible. In such cases, the application must include a sensitivity analysis demonstrating decision robustness across the interval, or an adaptive management plan that aligns capital exposure with risk resolution."

  This amendment shifts the burden from *producing a number* to *justifying a decision under uncertainty*. It aligns our administrative requirements with the actual state of hydrologic knowledge.

  **4. The Risk of Strategic Intervals and a Workable Constraint**
  The strongest argument against this recommendation is the risk of strategic manipulation. If we allow intervals, project advocates may widen them artificially to exploit the Maximin rule. A proponent could claim a probability range of 1% to 50% for a marginal project, knowing the panel, fearful of flood liability, will authorize spending based on the 50% upper bound. If the panel loses the ability to insist on a number, it risks losing the ability to say no. A culture of "uncertainty" could become a blanket justification for gold-plating every asset.

  This worry is concrete and serious. However, the solution is not to demand false precision, but to tighten the procedural constraints on how intervals are admitted and acted upon. We can prevent gaming through a **"Threshold Straddle Constraint."**

  Under this constraint, if a submitted probability interval straddles the cost-benefit threshold (as Project 44-B does), **automatic approval at the upper-bound risk level is prohibited.** The panel cannot simply choose the worst case to justify the spend. Instead, the straddle triggers a mandatory requirement for modularity or phasing (as applied above). If the project cannot be made modular—if it is an all-or-nothing capital sink—and the interval straddles the threshold, the project must be **rejected** as not yet ripe.

  This constraint removes the incentive to widen the interval. If an advocate widens the interval to encompass the threshold, they do not get their budget; they get a rejection or a costly redesign requirement. They only secure full, static funding if they can provide a narrow interval entirely above the threshold. This preserves the panel's power to say no while acknowledging the epistemic reality that sometimes, the world does not give us points.
