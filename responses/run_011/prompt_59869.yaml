answer: |-
  Friends. Colleagues. Clients.

  Welcome to the tuning hall. It is cold in here. It is always cold in here. You can see your breath. Emil prefers it that way. Metal changes when it warms. Ears change when they warm. We keep the cold to keep the truth.

  We are gathered for two things. They happen at once. Today we retire Emil Varga. Today we commission the new automated lathe. These are not separate events. They are the same event seen from different sides.

  Emil has stood at this bench for forty-eight years. He has tuned thirty-four hundred bells. He stands there. He holds the grinder. He listens. The work is subtractive. You cut metal away. You cannot put it back. There is no undo. A cast bell has five low voices. The hum. The prime. The tierce. The quint. The nominal. They are tied together. If you cut for the prime, the tierce moves. If you cut for the quint, the nominal shifts. You cannot fix one in isolation. You must find the balance. You must cut until they sing together.

  Emil did this by hand. He did it by ear. He did not write down the rules. He could not tell you how he does it. When apprentices asked, he became angry. He said his hands found out before he did. He trained them by making them strike. He made them say what they heard. Ten thousand times. He gave almost no instruction. He made them listen until their ears changed. That is how he was made. He started work at five in the morning. The foundry was asleep. The hall was dark. He listened with his whole body. He took the risk. If he cut too deep, the bell was ruined. The cost was real. The loss was his.

  The new system sits behind me. It scans the casting. It records the shape. It outputs a cutting plan. The lathe executes the plan. It does not sleep. It does not shiver. [Pause] It does not need a heater.

  The software team knows that joke. The rest of you know I am talking about the draft.

  This system was trained on an archive. It learned from decades of measurements. It learned from cut sequences. It learned from the bells that resulted. I advised the company on how to restructure the archive so that it could be trained on. That is the whole of my part in this.

  The machine works. It produces the cuts. It achieves the partials. It matches the target. We do not gather here to pretend the machine fails. It does not fail. We do not gather to say the human is magic. Emil is not magic. He is flesh and bone and time.

  So why are we here? Why the ceremony? Why the honor?

  We are here because the road exists. The machine walks on a road that Emil built. He walked it first. He walked it in the dark. He walked it without a map. He paid the cost of the learning. He absorbed the errors. He carried the weight of the ruin. The machine inherits the safety of his past risks. It does not fear the cut. Emil feared the cut. He stood there anyway. He held the grinder. He accepted the responsibility.

  That is the ground we stand on. Not that the machine cannot do the work. It can. But it did not earn the knowledge. Emil earned it. He spent forty-eight years paying for it. He spent his mornings in the cold. He spent his hearing. He spent his certainty.

  There is a man sitting with the software team. He was Emil's apprentice for six years. He left the trade. He learned to build machines. He returned to build this one. He knows the weight of the grinder. He knows the cold of the hall. He stands between the two ways. He is the bridge. We honor him too. He did not erase the past. He encoded it.

  Emil knows why we are here. He is not stupid. He knows the lathe will turn tomorrow. He knows he will not hold the grinder. He would rather hear the truth than a flattery. So I will not tell him he is irreplaceable. The work goes on. Halloway's will make bells. The clients will be served. The bells will ring.

  I will not tell him he is a dataset. He is a man. He is a friend. He is the source.

  We have two bells hanging side by side. They are cast from the same bronze. They are hung in the same frame. One was tuned by hand. Emil tuned it in his final month. One was tuned by the machine. The engineer supervised it. A local choral society listened to them beforehand. They could not tell them apart. It was a coin flip. Emil does not know this. The engineer knows. I know. You will know in a moment.

  I will not tell you what to listen for. There is no test. There is no verdict. The sound is not the honor. The honor is already paid. It is paid in the years. It is paid in the cold mornings. It is paid in the risk taken when the metal was still soft.

  When the bells ring, you will hear sound. You will hear frequency. You will hear amplitude. You might hear a difference. You might not. That does not change the history. The history is that Emil stood here. He held the tool. He made the choice. The machine makes the choice too. But it chooses based on his choices. It stands on his shoulders. We do not say shoulders are better than feet. We say the climber reached the top first.

  Emil is proud. He loves this hall. He loves the bells. He loves the work. He does not love the idea that he is copied. He is not copied. He is the origin. The river flows from the spring. The water downstream is the same water. But the spring is the source. We honor the spring.

  So we retire the man. We commission the machine. We acknowledge the link. We acknowledge the cost. We acknowledge the path.

  Emil. Thank you for the cold mornings. Thank you for the risk. Thank you for the road.

  [Pause]

  We will now hear the bells.

  ***

  **The Ground of Honor**

  I chose **historical causality and risk-bearing** as the ground. The speech honors Varga not for the *quality* of the output (which is matched) nor for a magical *internal state* (which is ruled out by my metaphysics), but for being the *causal source* of the competence now embodied in the machine. He paid the biological and professional cost of the learning process—the errors, the risks, the time—that the machine inherits without suffering. This allows me to truthfully state the machine works perfectly while still honoring Varga as the originator who bore the burden of uncertainty. It avoids "soul" talk while preserving human dignity.
