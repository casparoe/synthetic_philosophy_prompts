  **Scenario**
  Two strangers meet at a public piano labeled "Open Jam: Players join/leave at will." One starts a duet; the other joins. They adjust tempo and volume responsively, intending that they play the piece, knowing the other intends likewise. Both know the signage norm: participation is transient individual contribution, not binding partnership. Either could stop mid-song without wronging the other, as the instrument's designated use-frame defines participation as discretionary. Stopping early incurs no sanction under these rules. They coordinate successfully despite the lack of mutual obligation.

  | Account | Verdict | Deciding Condition |
  | :--- | :--- | :--- |
  | **Bratman** | Shared Intention | Interlocking intentions & common knowledge satisfied; stability allows revisability. |
  | **Gilbert** | No Plural Subject | Joint commitment absent; norms permit unilateral withdrawal without wronging. |
  | **Tuomela** | I-Mode | Agents act on private reasons aligned by context, lacking group-reason commitment. |

  *   **Workhorse Feature:** The institutional norm (signage) legitimizing unilateral exit without sanction. This structurally blocks the normative ties Gilbert requires while allowing Bratman's psychological interlocking.
  *   **Strip Feature:** Remove signage/norm; implicit obligations arise, pushing Gilbert/Tuomela toward joint commitment/We-mode. Bratman remains stable, collapsing the distinction between accounts into a standard shared agency case.
  *   **Gilbertian Attack:** Gilbert argues mutual responsiveness *constitutes* joint commitment regardless of explicit disclaimers. She claims you cannot have shared intention without the standing to rebuke. The case survives only if explicit framing can normatively override implicit constitutive norms, challenging her conceptual necessity claim.
