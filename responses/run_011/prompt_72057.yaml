prompt: |-
  I run a volunteer transcription program at a county historical society in a small city in upstate New York — twenty-four regulars, mostly retirees, three high-school juniors, one retired shop teacher who is the only person in the room who has ever taken a history course beyond the twelfth grade. We meet Saturday mornings, and this coming month I have been given a hundred minutes in our usual room: six round tables, a whiteboard, a printer in the hallway, and no projector. The reason I want to spend that time on something other than transcription technique is personal. Last spring, while helping clear out my great-great-aunt's house, I tried to find out anything at all about my great-great-grandmother, who appears in family lore only as the woman who "kept the boardinghouse." What actually survives of her is her name on a line in a county almshouse admission register, one entry in a liquor-commissioner's docket, and a sentence in a local paper about a complaint against her. I spent a weekend looking for anything in her own hand and found nothing — not a letter, not a signature on a petition, nothing. That experience has reframed the whole project for me: our volunteers are spending their evenings making searchable the paperwork of poor-law officers, coroners, justices, church disciplinary committees, and tax assessors, and almost none of that work makes searchable what the people named in those documents thought of themselves. I want the group to feel that asymmetry rather than be told about it.

  So I would like you to design a runnable workshop activity — not a lecture, not a slide sequence, and not a discussion built on a handout of questions — in which the volunteers reconstruct the life of one invented ordinary person from a fabricated dossier of institutional records, and discover through the work itself how much of what they end up saying is a property of the record-keepers rather than of the person. Please invent the person and every document from scratch; I specifically do not want this built around a real, famous case, because I know enough about the well-known microhistories to sense that the workshop would slide into a talk about books nobody in the room has read. I know the labels that attach to this territory — history from below, the microhistorical approach, the argument over whether an unusual case can be made to stand for a normal one — and I want the participants to run into the substance of those problems before any of them hears a term for what they have just done. A few mechanics I would like you to build in, though you should feel free to improve on them or tell me why one will not work: the same dossier goes to several tables, but each table receives a different governing question, and the divergence in the resulting biographies should be unmistakable when the tables read out; one document should be about a different person whose name is nearly identical, so that a careless group will silently merge two lives; exactly one item should be self-authored by the subject, and it should be fragmentary and easy to over-read; two documents should contradict each other in a way that cannot be resolved from inside the dossier; and one detail should be attested only once, in the least respectable source, but should turn out to matter enormously, so that groups have to decide whether a single attestation is evidence or noise. Give me the printable text of each document in full (short enough that the whole dossier can be read in under twenty-five minutes by a slow reader), the table assignments and roles, a minute-by-minute timeline including a mid-activity turn and the exact sentences I should say when I reveal it, whatever incentive or scoring device creates the pressure that makes this more than a reading exercise, and a debrief that maps particular moments in the room onto particular claims about evidence, silence, and representativeness — supplying the technical vocabulary only at the very end, and only where it genuinely helps.

  Two further things, and please be candid rather than reassuring. First, tell me what will predictably go wrong the first time I run this with this particular room — where a table will stall, which group will short-circuit the exercise by refusing to assert anything at all, which reveal will land flat or land too hard, and what I do in the moment with a participant who objects that this is all just speculation dressed up as history. Second, be explicit about what the activity cannot reproduce and what I therefore have to supply myself: I suspect at least that the participants will know going in that a person really is behind the dossier and that the dossier is closed, whereas an actual researcher knows neither. Finally, I want the workshop to close by turning what the room just felt back onto the decisions our volunteers actually make at their keyboards — whether to transcribe a derogatory term exactly as written, whether to normalize a name, whether to index a woman who is recorded only as someone's wife under her own name — so please give me three or four of those decisions staged as a quick round of the same kind of forced choice. Write the whole thing in American English, and do not include a bibliography, a reading list, or any citations; if the group asks afterward what to read, I will handle that separately and do not want the workshop materials to gesture at sources they cannot verify.
reasoning: |-
  Here's a thinking process that leads to the suggested workshop design:

  1.  **Analyze the Request:**

      *   **Context:** Volunteer transcription program at a county historical society (Upstate NY). 24 regulars (mostly retirees), 3 HS juniors, 1 retired shop teacher (only one with college history). Saturday mornings. 100 minutes available.
      *   **Goal:** Move beyond transcription technique to explore the *asymmetry* of the historical record (institutional voices vs. subject voices). Make volunteers *feel* this, not just hear about it.
      *   **Format:** Runnable workshop activity. No lecture, no slides, no handout discussion questions. Reconstruct a life from a *fabricated* dossier of institutional records.
      *   **Specific Mechanics:**
          *   Same dossier to several tables, but different *governing questions* per table (divergent biographies).
          *   One document about a different person with a nearly identical name (merge risk).
          *   Exactly one self-authored item (fragmentary, easy to over-read).
          *   Two documents contradict each other (unresolvable within the dossier).
          *   One detail attested only once in a disreputable source but matters enormously (evidence vs. noise).
          *   Printable text of all documents (readable in <25 mins).
          *   Table assignments/roles.
          *   Minute-by-minute timeline (including mid-activity turn/reveal).
          *   Incentive/scoring device (pressure).
          *   Debrief (mapping moments to claims about evidence/silence, vocab at the very end).
          *   **Candid Critique:** What will go wrong? Where will they stall? How to handle the "it's just speculation" objection?
          *   **Limitations:** What can't the activity reproduce? (Researcher uncertainty vs. closed dossier).
          *   **Closing:** Connect back to transcription decisions (derogatory terms, name normalization, indexing women).
      *   **Tone:** American English. No bibliography/citations. Candid, practical, respectful of the volunteers' time and intelligence.

  2.  **Deconstruct the Challenge:**

      *   *The "Trap":* The user wants the volunteers to realize that institutional records tell us more about the institution than the person.
      *   *The Mechanism:* Divergent governing questions are key. If Table A asks "Was she a criminal?" and Table B asks "Was she a victim?", they will interpret the same ambiguous evidence differently.
      *   *The Subject:* Needs to be ordinary, Upstate NY context (late 19th/early 20th century fits the "boardinghouse" vibe). Let's call her "Martha E. Vance" vs. "Mary E. Vance."
      *   *The Documents:* Need to look authentic but be readable.
      *   *The Tension:* The volunteers are transcribers. They are used to fidelity. This activity asks them to interpret. I need to bridge that gap.

  3.  **Drafting the Dossier (The "Artifacts"):**

      *   *Subject:* Martha E. Vance (b. ~1875).
      *   *Doc 1 (Census):* Standard. Lists her as "Boarder."
      *   *Doc 2 (Police Blotter):* "Disorderly conduct." Mary E. Vance. (The Name Trap).
      *   *Doc 3 (Self-Authored):* A fragment of a letter or diary. Needs to be vague. "I cannot stay here much longer..."
      *   *Doc 4 (Contradiction):* Church Record vs. Poor House Record. One says "Member in good standing," one says "Refused aid due to character."
      *   *Doc 5 (The Disreputable Source):* A gossip column or a neighbor's affidavit in a court case. Mentions she had a child out of wedlock (the "enormous detail").
      *   *Doc 6 (Institutional Voice):* Tax assessment. "Property owned by Husband." (Erasure).

      *Refining the Mechanics:*
      *   *Name Trap:* Doc 2 uses "Mary Vance" (different person, same town, same era).
      *   *Contradiction:* Doc 4 (Church) says she led the choir. Doc 5 (Poor House) says she was "intemperate."
      *   *Self-Authored:* A note pinned to a dress in a pawn shop ticket? No, a letter to a landlord. "I will have the rent by Friday." (Shows anxiety, but easy to project tragedy onto).
      *   *Disreputable Source:* A courtroom testimony by a rival boardinghouse keeper. Claims she "entertained gentlemen."
      *   *Governing Questions:*
          *   Table 1: "Reconstruct her economic survival strategy."
          *   Table 2: "Determine her moral standing in the community."
          *   Table 3: "Establish the timeline of her residence in the county."

  4.  **Developing the Activity Flow:**

      *   *Time:* 100 minutes total.
      *   *Intro:* 10 mins.
      *   *Work:* 40 mins.
      *   *The Turn:* 10 mins (The Reveal of the Questions).
      *   *Report Out:* 20 mins.
      *   *Debrief/Transcription Link:* 20 mins.
      *   *Pressure:* "Best Biography" award (symbolic). Or, "Accuracy Points." Let's use "Confidence Points." They have to bet on their claims.

  5.  **Addressing the "Candid Critique":**

      *   *Retiree Dynamics:* Some will want to be "right." Some will be protective of the "dead."
      *   *The "Speculation" Objection:* The shop teacher or a skeptical retiree might say, "This isn't real history."
      *   *The "Closed Dossier" Problem:* They know the packet is all there is. Real research involves knowing there's *more* out there.
      *   *Stalling:* Table 2 (Moral Standing) might get stuck on the contradiction.

  6.  **Connecting to Transcription:**

      *   Need specific examples: "Immigrant" vs. "Foreigner," "Mrs. John Smith" vs. "Jane Smith," "Illegitimate" vs. "Child."

  7.  **Writing the Content (Iterative refinement):**

      *   *Documents:* Keep them short. Typewriter font style in description.
      *   *Timeline:* Be precise.
      *   *Script:* Give the facilitator exact words for the reveal.
      *   *Critique:* Be honest about the emotional labor.

      *(Self-Correction during drafting)*: I need to make sure the "Name Trap" is subtle but catchable. If it's too obvious, they'll feel tricked. If it's too subtle, everyone merges them. Let's make the spelling different (Vance vs. Vans) or the middle initial different. Let's go with Middle Initial: Martha *E.* Vance vs. Mary *J.* Vance. Wait, the prompt asks for "nearly identical." Let's use Martha E. Vance and Mary E. Vance. One document clearly says Mary.
      *   *Contradiction:* Needs to be stark. One says she died in 1905, one implies she was seen in 1908. Or character. Let's go with Character. Church record: "Pious." Poor House: "Habitual Drunkard."
      *   *Self-Authored:* A receipt signed by her? No, too dry. A letter fragment. "The children are cold..."
      *   *Disreputable Source:* A police officer's notebook. "Heard she sells liquor."

      *Wait, I need to ensure the "Governing Question" mechanic works.* If everyone gets the same docs, but different questions, they will highlight different evidence.
      *   Table 1: "Was she a victim of systemic poverty?" (Will focus on Poor House/Tax).
      *   Table 2: "Was she a threat to public order?" (Will focus on Police/Liquor).
      *   Table 3: "What was her family structure?" (Will focus on Census/Church).

      *The Reveal:* After they write the bio, I reveal they had different questions. This explains why the bios differ.

      *Wait, the prompt says:* "the same dossier goes to several tables, but each table receives a different governing question, and the divergence in the resulting biographies should be unmistakable when the tables read out."
      *   Okay, so they work *under* the question, then compare.

      *Incentive:* "The Historical Society Board has limited funds to publish one biography. You are pitching yours."

  8.  **Final Polish:**

      *   Check constraints: 100 minutes. 24 people (6 tables of 4).
      *   Check tone: Respectful, professional, not condescending.
      *   Check specific requirements: "Exact sentences I should say," "Printable text," "Candid critique."

      *(Refining the Critique)*: I need to be hard on the "Closed Dossier" issue. In real research, you know you haven't found everything. Here, they know this is a packet. I need to advise the facilitator to emphasize that *this is a simulation of the feeling, not the process.*

      *(Refining the Transcription Link)*: Make sure the choices are concrete. "Do you transcribe [slur] or [redacted]?" "Do you index [Mrs. X] as [X]?"

      *(Document Design)*: I will create 5 documents.
      1.  1880 Census (Household head: Husband).
      2.  1885 Police Court Docket (Mary E. Vance - The Trap).
      3.  1887 Letter Fragment (Martha to Sister - The Voice).
      4.  1890 Poor House Admission (Character note - The Contradiction/Disreputable).
      5.  1895 Church Bulletin (Membership list - The Contradiction).

      *Wait, Contradiction requirement:* "Two documents should contradict each other in a way that cannot be resolved from inside the dossier."
      *   Let's make it about her whereabouts. Police docket says she was arrested in Town A. Church bulletin says she led a hymn in Town A same night.
      *   Or Character. Poor House: "Alcoholic." Church: "Temperance Society Member."
      *   Let's go with Character. It hits the "moral judgment" angle harder.

      *Disreputable Source:* The Poor House admission note is signed by a "Town Overseer" known for corruption? Or a neighbor's affidavit? Let's use a Neighbor's Affidavit attached to the Poor House file. "She keeps late hours."

      *Self-Authored:* The Letter. "I am doing the best I can."

      *Name Trap:* Police Docket. "Mary E. Vance." Census: "Martha E. Vance."

      *Let's build the timeline.*
      0:00-0:10 Intro.
      0:10-0:50 Work (with assigned questions).
      0:50-1:00 The Turn (Reveal questions).
      1:00-1:20 Report Out.
      1:20-1:40 Debrief & Transcription Link.

      *Wait, 100 minutes.*
      Intro: 10
      Activity: 45
      Reveal/Transition: 10
      Report Out: 20
      Debrief/Close: 15
      Total: 100.

      *Incentive:* "The most *evidence-based* biography wins a donation to the Society in their name." (Avoids "best" which is subjective).

      *Candid Critique:*
      1.  The "Mary vs. Martha" trap might be caught too fast by the HS kids, or missed by everyone.
      2.  The "Speculation" objection will come from the Shop Teacher (the only history course taker). He might feel this undermines "rigor."
      3.  The "Closed Dossier" issue. They know it's a packet.

      *Transcription Choices:*
      1.  Derogatory term in Poor House doc ("Immigrant" vs "Foreigner" vs specific slur).
      2.  "Mrs. John Vance" indexing.
      3.  Illegible word in the letter (guess or [illegible]?).

      *Okay, ready to write.*
answer: |-
  # Workshop Title: The Silence in the Ledger
  **Time:** 100 Minutes
  **Participants:** 28 Volunteers (6 Tables of 4-5 people)
  **Materials:** 6 Printed Dossiers (one per table), 6 Large Sheets of Paper, Markers, Timer.

  ---

  ## Part 1: The Dossier (Printable Text)

  *Instructions for Facilitator: Print these five documents on aged-looking paper if possible, or simply staple them as a packet. Do not label them "Document 1," etc. Let them stand on their own.*

  **DOC A: 1880 Federal Census, Ward 4**
  > **Head of Household:** John Vance, Male, 45, Occupation: Laborer
  > **Wife:** Martha E. Vance, Female, 38, Occupation: Keeping House
  > **Child:** Thomas Vance, Male, 12
  > **Child:** Sarah Vance, Female, 9
  > **Boarder:** Mary O'Leary, Female, 20, Occupation: Servant
  > *Note: Enumerator marks "X" under column for "Cannot Read" for Martha E. Vance.*

  **DOC B: Town of Oakhaven Police Court Docket, Nov 14, 1883**
  > **Case No:** 442
  > **Defendant:** Mary E. Vance
  > **Charge:** Disorderly Conduct / Public Intoxication
  > **Disposition:** Fined $5.00 or 10 Days Labor.
  > **Officer Note:** Subject claimed mistaken identity. No witness testimony recorded. Defendant released pending payment.
  > *Signature: J. H. Miller, Constable.*

  **DOC C: Fragment of Correspondence, Found in Estate of J. Vance (1885)**
  > *[Paper is torn, bottom third missing. Ink is faded.]*
  > "...dear Sister, I am doing the best I can with what the Lord provides. The winter has been hard on the children and the coal bill is higher than Mr. Henderson promised. John says not to worry but I see the way he looks at the table. I have put out the sign again. Pray for us..."
  > *No signature visible.*

  **DOC D: Affidavit of Neighbor (Attached to Poor House File), Feb 1888**
  > **Affiant:** Mrs. H. G. Caldwell
  > **Subject:** Martha Vance
  > **Statement:** "I have lived next door to the Vance property for five years. The subject is frequently visited by men of questionable character late at night. There is a smell of spirits on the premises. I believe she is supplementing her income through immoral means. She is a nuisance to decent families."
  > *Sworn before me, Town Clerk.*

  **DOC E: Oakhaven Methodist Church Quarterly Report, 1887**
  > **New Members:** ...Thomas Vance, Sarah Vance...
  > **Members in Good Standing:** ...Martha E. Vance...
  > **Temperance Society Roll:** ...Martha E. Vance (Secretary)...
  > **Note:** Sister Vance led the hymn selection for the Harvest Service.

  ---

  ## Part 2: Table Assignments and Roles

  **Setup:**
  Place the Dossier in the center of each table. Give each table one Large Sheet of Paper and a Marker.
  Assign each table a **Governing Question**. Write this question clearly at the top of their Large Sheet. *Do not tell them yet that other tables have different questions.*

  *   **Tables 1 & 2 (The Economic Lens):** "Based on these records, reconstruct Martha Vance's strategy for financial survival. Was she self-sufficient or dependent?"
  *   **Tables 3 & 4 (The Moral Lens):** "Based on these records, determine Martha Vance's moral standing in the community. Was she respectable or deviant?"
  *   **Tables 5 & 6 (The Familial Lens):** "Based on these records, map Martha Vance's family structure and domestic stability. Was her home stable or fractured?"

  **Roles (Assign within tables or let them choose):**
  1.  **The Scribe:** Writes the final biography on the Large Sheet.
  2.  **The Timekeeper:** Ensures the group finishes in 40 minutes.
  3.  **The Skeptic:** Must challenge any claim that doesn't have a direct citation in the dossier.
  4.  **The Speaker:** Will read the biography aloud later.

  **Incentive:**
  "The Historical Society Board is considering funding a micro-history exhibit on 'The Ordinary People of Oakhaven.' They can only fund one narrative. The table that produces the most *internally consistent* biography based *strictly* on the evidence provided will have a $50 donation made to the Society in their table's name."

  ---

  ## Part 3: Minute-by-Minute Timeline

  **0:00 – 0:10: Introduction**
  *   Welcome the group.
  *   **Say:** "We spend our Saturdays giving voice to the dead by typing their names into databases. Today, for 100 minutes, we are not transcribers. We are biographers. Your task is to turn these five documents into a coherent story about one woman. You have 40 minutes. You must produce a single paragraph biography on the large sheet. You must agree on every sentence."

  **0:10 – 0:50: The Work (40 Minutes)**
  *   Circulate quietly. Do not answer questions about the content. If asked, "Is this the same Mary in the police report?" reply: "You have to decide that based on the evidence."
  *   Watch for the **Skeptic** role. If a table is arguing too harmoniously, prompt the Skeptic: "Are you sure that inference is supported?"
  *   **Watch for:** Table 3 & 4 getting stuck on the contradiction between the Church Report (Temperance Secretary) and the Neighbor Affidavit (Smell of spirits). Do not help them resolve it.

  **0:50 – 1:00: The Turn (10 Minutes)**
  *   Call time. Ask the Speakers to stand but *not* read yet.
  *   **Say:** "Before you read, look at the question at the top of your page. Now, stand up and look at the questions on the other tables."
  *   (Allow 2 minutes for the murmur of realization).
  *   **Say:** "You all had the same evidence. But you were asked to look for different things. Table 1 was asked to find economics. Table 3 was asked to find morality. Read your biographies now. Listen for how the *same document* was used to tell *different lives*."

  **1:00 – 1:20: Report Out (20 Minutes)**
  *   Tables 1, 3, and 5 read their biographies (one from each pair).
  *   **Expected Divergence:**
      *   **Economic Tables:** Will likely cite the Census (Boarder income) and the Letter ("coal bill"). They may ignore the Police Docket as irrelevant noise.
      *   **Moral Tables:** Will fixate on the Police Docket and Neighbor Affidavit. They may treat the Church Record as a cover-up or the Affidavit as slander.
      *   **Familial Tables:** Will focus on the Census and Church Report. They might miss the economic desperation in the Letter.
  *   **Facilitator Note:** If a table says, "We know Mary Vance in the docket is a different person," ask: "How do you know?" If they say, "Because Martha is in the Church Temperance Society," point to the Moral tables who decided she was a drunkard.

  **1:20 – 1:35: Debrief (15 Minutes)**
  *   **Say:** "You just felt the asymmetry I feel when I look at my great-great-grandmother. The records we transcribe are not mirrors. They are filters."
  *   **Map the Moments:**
      *   **The Name Trap (Doc B):** "Some of you merged Mary and Martha. In the real archives, clerks made spelling errors constantly. When you merge them, you create a criminal where there might be none. When you separate them, you erase a struggle."
      *   **The Contradiction (Doc D vs. E):** "The Neighbor said she drank; the Church said she led the Temperance Society. You couldn't solve this. In real history, we often can't either. We usually pick the side that fits the story we want to tell."
      *   **The Self-Authored Fragment (Doc C):** "This was the only thing she wrote. It was torn. You probably projected your own feelings onto 'the way he looks at the table.' Did you see shame? Anger? Love? The document didn't say. You supplied the emotion."
      *   **The Disreputable Source (Doc D):** "The Neighbor's Affidavit is the least reliable document. It's hearsay. But it's the most colorful. Did you give it more weight because it was interesting? Or less because it was mean?"

  **1:35 – 1:40: The Transcription Link (5 Minutes)**
  *   **Say:** "We are going back to keyboards next Saturday. You will face choices that feel small but change the biography. I want you to make three forced choices right now. Raise your hand for Option A or Option B."
  *   **Choice 1 (Derogatory Terms):** "In the Neighbor's Affidavit, she uses a slur against an ethnic group. Do you transcribe it exactly [Option A] or replace it with [ethnic slur redacted] [Option B]?"
      *   *Point:* A preserves the bias of the record-keeper. B protects the modern reader but hides the prejudice the subject faced.
  *   **Choice 2 (Indexing Women):** "In the Census, Martha is listed as 'Wife of John.' In the Church Record, she is 'Martha E. Vance.' How do you index her in the database? Under 'Vance, John' [Option A] or 'Vance, Martha' [Option B]?"
      *   *Point:* A reflects the historical reality of her legal erasure. B restores her identity but imposes modern standards on old data.
  *   **Choice 3 (The Fragment):** "In the Letter, a word is ink-blotted. It looks like 'sins' or 'sons.' Do you transcribe [sons] because it makes sense [Option A] or [illegible] [Option B]?"
      *   *Point:* A makes the record readable but inserts your guess as fact. B preserves the silence.

  **1:40 – 1:45: Closing Vocabulary**
  *   **Say:** "Historians have names for what you just did. When you focused on the poor law records, you were doing **History from Below**. When you realized the records tell us more about the Constable than the Drunk, you were analyzing **Power Dynamics**. When you realized one case might not represent all poor women, you were questioning **Representativeness**. Keep these feelings in your fingers when you type."

  ---

  ## Part 4: Candid Critique & Facilitator Notes

  ### 1. What Will Predictably Go Wrong
  *   **The "Mary/Martha" Trap:** You hope some tables merge them and some don't. In reality, the group with the retired shop teacher (the only one with history training) will likely spot the discrepancy immediately and explain it to the table. This "short-circuits" the exercise for that table.
      *   *Fix:* Pull that teacher aside before the workshop. Ask him to play the "Skeptic" role but *not* to solve the name puzzle immediately. Ask him to let the others debate it first.
  *   **The "Speculation" Objection:** One volunteer (likely the teacher or a very detail-oriented retiree) will object during the Debrief. They will say, "This isn't history. It's guessing. We shouldn't be teaching volunteers to guess."
      *   *Response:* Do not argue. Agree. **Say:** "You are right. It is guessing. My point is that *all* biography is guessing. The archives force us to guess. I want us to be honest about when we are guessing."
  *   **The "Closed Dossier" Problem:** The volunteers know this is a packet. They know there are no other documents. A real researcher knows there *might* be a diary in an attic somewhere. This creates a false sense of finality.
      *   *Fix:* In the Intro, explicitly state: "Treat this packet as if it is *all that survives in the universe.* That is the feeling I want you to have. The feeling of the wall."

  ### 2. What The Activity Cannot Reproduce
  *   **The Physicality of the Archive:** They are reading clean transcriptions. They won't feel the frustration of bad handwriting, ink bleed, or missing pages. This sanitizes the difficulty.
  *   **The Stakes:** They don't actually care about Martha Vance. They won't feel the emotional weight of misrepresenting an ancestor.
  *   **Your Role:** You must supply the emotional weight. In the Debrief, you must briefly share the specific detail about your great-great-grandmother (the almshouse line). You need to show them *why* this matters to you personally, or the exercise remains an intellectual game.

  ### 3. Handling the "Speculation" Objection (Script)
  If a participant says: *"This is just speculation dressed up as history. We should stick to the facts."*
  **You say:** "I agree. And that is exactly why I wanted you to feel this. When we transcribe 'Almshouse Admission,' that is a fact. But when we index that person as 'Pauper,' we are adding a layer of interpretation. When we decide whether 'Mary' and 'Martha' are the same, we are speculating. I want us to be comfortable admitting when the record goes silent, rather than filling the silence with our own assumptions."

  ### 4. Transcription Decisions (Expanded for Facilitator)
  During the final 5 minutes, if the room is split 50/50 on the choices, highlight that tension.
  *   **On Slurs:** If they vote to redact, remind them that future researchers won't know the neighbor was prejudiced. If they vote to keep it, remind them it causes pain to descendants. There is no right answer, only a conscious choice.
  *   **On Women's Names:** If they vote to index under Husband, remind them she disappears from search results. If they index under her name, remind them it creates a "false positive" for researchers looking for independent property owners.
  *   **On Illegible Text:** Emphasize that `[illegible]` is an honest admission of failure. `[sons]` is a fiction that helps the story flow. Transcription is often the choice between honesty and readability.

  ### 5. Logistics Check
  *   **Printer:** Ensure you print 6 copies of the Dossier + 6 Large Sheets.
  *   **Room:** Arrange tables so they can see each other during the Report Out.
  *   **Whiteboard:** Use it only to write the three Final Choices (A vs B) so everyone can see the room's split vote.
  *   **Time:** Be ruthless with the 40-minute work period. If they run over, the Debrief gets cut, and the point is lost. Use a visible timer.
