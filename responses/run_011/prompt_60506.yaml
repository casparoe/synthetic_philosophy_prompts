  # Session Design: The Verification Game

  ## 1. Overview and Learning Objectives
  **Title:** The Verification Game
  **Duration:** 75 minutes
  **Participants:** 18 students (mixed backgrounds)
  **Format:** Interactive workshop (no lecture)
  **Materials:** 
  *   Index cards (3 colours: Green, Red, Blue) — 100 total.
  *   Whiteboard and markers.
  *   Printed "Sentence Packs" (9 packs, one per pair).
  *   Score sheets and pens.

  **Core Objectives:**
  1.  **Unsatisfiability:** Experience the failure of classical bivalence when faced with self-reference (Tarski's indeterminacy).
  2.  **Revenge:** Experience the failure of three-valued "gap" solutions against strengthened liars.
  3.  **Revision:** Observe oscillation vs. stabilisation in iterative assignment (Gupta/Herzberger).
  4.  **Structure:** Intuit that self-reference is not the sole culprit (Yablo-esque dependence).

  ## 2. Setup and Grouping (5 Minutes)
  Divide the 18 students into 9 pairs. Each pair sits at a table (or cluster of desks). Give each pair:
  *   One **Sentence Pack** (4 cards).
  *   One set of **Colour Cards** (5 Green, 5 Red, 5 Blue).
  *   One **Score Sheet**.

  **The Rules (Write on Whiteboard):**
  1.  **Assignment:** For each Sentence Card, you must place exactly one Colour Card on top of it: **Green (True)**, **Red (False)**, or **Blue (Neither)**.
  2.  **Scoring:** You earn 1 point per Sentence Card if your Colour assignment is **consistent** with the text on the Sentence Card, given the assignments of all other cards in your pack.
  3.  **Validation:** I (the facilitator) am the Oracle. When you think you have a perfect score, raise your hand. I will check for consistency. If I find a contradiction, you lose 1 point and must revise.
  4.  **Goal:** Maximise your score. A perfect score is 4 points.

  *Note to Facilitator:* Do not explain *why* contradictions happen yet. Let the scoring rule feel like a normal constraint.

  ## 3. Running Order

  ### Round 1: The Classical Trap (15 Minutes)
  **Materials:** Sentence Pack A (Classical Logic).
  **Cards:**
  1.  "Snow is white." (Fact: True)
  2.  "2 + 2 = 5." (Fact: False)
  3.  "Card 4 is Red."
  4.  "This card is Red." (The Liar)

  **Activity:**
  Pairs assign Green/Red only (Blue cards are kept aside). They aim for 4 points.
  *   Cards 1 and 2 are straightforward.
  *   Card 4 creates the paradox. If Green, it says it is Red (False). If Red, it says it is Red (True).
  *   Card 3 depends on Card 4.

  **Expected Outcome:**
  Pairs will oscillate. They will call you over. You check: "Card 4 contradicts itself." They switch. You check: "Now Card 4 contradicts itself again."
  Eventually, they will realise they cannot get 4 points. The maximum stable score is 3.
  **Stop the round** when most groups have stalled at 3 points and look frustrated.

  ### Round 2: The Gap Patch & Revenge (15 Minutes)
  **Materials:** Sentence Pack B (Paracomplete Logic).
  **Cards:**
  1.  "Snow is white." (True)
  2.  "This card is not Green." (The Strengthened Liar)
  3.  "Card 4 is Blue."
  4.  "This card is Blue."

  **Activity:**
  Now they may use Blue (Neither). The instruction is: "Blue means the sentence has no truth value."
  *   Card 4 ("This card is Blue"): If Blue, it is true that it is Blue. So it should be Green. If Green, it is false that it is Blue. So it should be Red/Blue. (This is a "Truth-Teller" variant, usually stabilises).
  *   Card 2 ("This card is not Green"): This is the killer.
      *   If Green: It says it's not Green. Contradiction.
      *   If Red: It says it's not Green. That is true. So it should be Green. Contradiction.
      *   If Blue: It says it's not Green. Since Blue is not Green, the claim is correct. So it should be Green. Contradiction.

  **Expected Outcome:**
  Students will try to use Blue to "escape" the contradiction on Card 2. You will veto it: "If you assign Blue, the text 'Not Green' is accurate, so it warrants Green."
  They will fail to get 4 points again. The "loophole" is closed.

  ### Round 3: Revision Dynamics (20 Minutes)
  **Materials:** Sentence Pack C (Revision Theory).
  **Cards:**
  1.  "Card 2 is Green."
  2.  "Card 1 is Green."
  3.  "Card 4 is Green."
  4.  "Card 3 is Red."

  **Activity:**
  This is a temporal game.
  1.  **Stage 0:** Assign colours randomly. Record on Score Sheet.
  2.  **Stage 1:** Look at your partner's Stage 0 assignment. Update your card to match what your sentence claims about their previous state.
  3.  **Stage 2-5:** Repeat. Update based on the immediate previous stage.
  4.  **Plot:** Draw a graph of your assignments over time (Green=1, Red=0).

  **Expected Outcome:**
  *   Pairs with Cards 1 & 2 (The Truth-Teller Loop): Will likely stabilise (both Green or both Red) depending on start.
  *   Pairs with Cards 3 & 4 (The Liar Loop): Will oscillate indefinitely (Green/Red, Red/Green...).
  *   **Debrief Point:** Some assignments are "stable" (fixed points), others are "unstable" (oscillating). This mirrors Gupta/Herzberger revision sequences.

  ### Round 4: The Infinite Chain (10 Minutes)
  **Materials:** Whiteboard only.
  **Activity:**
  Ask 6 volunteers to stand in a line at the front.
  Give each a card numbered 1 to 6.
  **Text on Card $n$:** "All cards numbered higher than $n$ are Red."
  *   Student 6: "All cards > 6 are Red." (Vacuously True). Assign Green.
  *   Student 5: "Card 6 is Red." (False, 6 is Green). Assign Red.
  *   Student 4: "5 and 6 are Red." (False). Assign Red.
  *   ...and so on.

  **The Twist:**
  Ask the group: "We solved this. So where is the paradox?"
  Elicit the response: "Because the line stopped."
  Ask: "What if there were always one more student behind? What if there is no last card?"
  Explain that without a "base case" (like Student 6), the backward induction never starts. The truth value of every card depends on the next, forever. No assignment works, yet no card refers to *itself*.

  ### Debrief and Theoretical Mapping (10 Minutes)
  Gather everyone. Map their experience to the theory.

  **1. The Classical Failure (Round 1)**
  *   **Experience:** You could not assign T/F without contradiction.
  *   **Theory:** Tarski's Undefinability Theorem. A classical language containing its own truth predicate is inconsistent.
  *   **Status:** **Settled.** There is near-universal agreement that Classical Logic + Naive Truth Schema = Inconsistency.

  **2. The Revenge Problem (Round 2)**
  *   **Experience:** Adding 'Blue' (Neither) did not save you from the "Not Green" card.
  *   **Theory:** The Revenge Paradox. Non-classical solutions (like Kripke's fixed points or Gap theories) often require a meta-language to express their own semantics, which can then be used to generate new liars.
  *   **Status:** **Contested.** Some (e.g., Field) believe revenge can be managed indefinitely. Others (e.g., Priest) argue it shows dialetheism (true contradictions) is the only stable option. Some argue revenge is fatal to gap views.

  **3. Revision Dynamics (Round 3)**
  *   **Experience:** Some loops stabilised, others oscillated.
  *   **Theory:** Gupta and Herzberger's Revision Theory. Truth is not a static property but a process. Some sentences are "stable," others "pathological."
  *   **Status:** **Contested.** Is revision a semantic account of truth, or just a model of reasoning? Is it a rival to Kripke's fixed points, or complementary?

  **4. Self-Reference vs. Infinity (Round 4)**
  *   **Experience:** The line was solvable finitely, but described an infinite problem.
  *   **Theory:** Yablo's Paradox. Shows circularity is not necessary for paradox; infinite dependence suffices.
  *   **Status:** **Contested.** Some argue Yablo's sequence is implicitly circular (via quantification). Others maintain it is genuinely non-circular.

  ## 4. Predicted Failure Modes & Mitigations

  | Failure Mode | Prediction | Mitigation |
  | :--- | :--- | :--- |
  | **Collusion** | Students agree to all hold Blue to "break" the game. | The "Revenge" card ("Not Green") penalises this. If all are Blue, "Not Green" is accurate, demanding Green. Enforce the scoring rule strictly. |
  | **Refusal** | "This is impossible, we quit." | Validate them: "Yes, it is impossible. That is the data point. Record 'Impossible' as your result." |
  | **CS Loophole** | "We'll treat 'True' as a string, not a value." | Remind them the game is about *semantic value*, not syntax. The Oracle (you) judges meaning. |
  | **Stalling** | Groups spend 20 mins on Round 1. | Hard stop at 15 mins. Announce: "If you haven't solved it, you haven't missed out; you've found the result." |
  | **Yablo Confusion** | They think the finite line *is* the paradox. | Be explicit in the debrief: "The paradox requires the infinite case. The line was a model of the *structure*, not the paradox itself." |

  ## 5. Limitations of the Activity
  You must be frank about what the game cannot do.
  1.  **Infinity:** You cannot simulate actual infinity with 18 students. Round 4 relies on a verbal leap from the finite chain to the infinite regress. You must supply the logical step that "no last element" prevents the base case assignment.
  2.  **Formal Rigour:** The game uses natural language sentences ("This card is Red"). Strictly, paradoxes arise in formalised languages. Natural language ambiguity allows students to wiggle out (e.g., "Red" vs "False"). You must stipulate that "Red" *means* "False" for the game.
  3.  **Social vs. Logical:** Students might feel the contradiction is social (you saying "no") rather than logical. Emphasise that *they* could see the contradiction on the paper; you are just confirming it.

  ## 6. Settled vs. Contested Distinctions
  In the debrief, ensure you distinguish clearly:
  *   **Settled:** The Liar Paradox demonstrates an inconsistency in classical semantics with unrestricted self-reference. There is no "solution" that preserves all classical intuitions.
  *   **Contested:** Which intuition to drop.
      *   Drop Bivalence? (Kripke/Field)
      *   Drop Consistency? (Priest/Dialetheism)
      *   Drop Static Truth? (Gupta/Revision)
      *   Drop Unrestricted Truth Predicate? (Tarski/Hierarchy)
  *   **Contested:** Whether "Revenge" kills the non-classical approaches. This is a live dispute in current journals. Do not present Kripke as the "winner"; present it as one response with known vulnerabilities.

  ## 7. Contingency Plan
  If the session runs 20 minutes short (e.g., late start, slow uptake):
  Cut **Round 4 (The Infinite Chain)**.
  While Yablo is important, the core learning outcomes (Classical Failure, Revenge, Revision) are covered in Rounds 1–3. Round 4 relies most heavily on your verbal explanation anyway, so its removal least impacts the "experiential" goal. You can mention Yablo verbally during the debrief without running the simulation.

