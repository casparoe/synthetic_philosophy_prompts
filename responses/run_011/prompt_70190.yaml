      *   *Decision:* The strongest lever is redefining the "Outcome" in (2). If "Outcome" = "Functional Capability," then (3) and (7) hold, but (1) is weakened. If "Outcome" = "Specific Historical Configuration," then (1) holds, but (3) and (7) look like they deny path dependence.
