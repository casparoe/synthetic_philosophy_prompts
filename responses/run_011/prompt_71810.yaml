prompt: |-
  I'm on a city naming commission — twelve of us, brand new intake, and I've somehow been volunteered to run the 90-minute orientation before our first real case comes up in the spring. Nobody has any philosophy. There's a retired postal carrier, two realtors, a high school history teacher, and several people the council appointed for reasons nobody can name. I dont want to brief them on the case. I want to teach them one distinction they can carry into every case we'll ever see: that a commemorative name isn't a piece of historical record — that naming a boulevard after someone is doing something different from documenting them, and that most of what people yell about at these hearings is really a fight over which of those two things they think is happening.

  Don't explain the distinction to me, I have it. Plan how I explain it to them, in 90 minutes, with a whiteboard. Specifically: what has to be in place before the distinction means anything at all (I suspect "an honor is a present-tense thing you're doing, not a claim about the past" is load-bearing, but I don't know where in the sequence it goes or what it needs underneath it first). Whether to carry the whole thing on our own live case — the boulevard is named for the engineer who built the levee project that also cut a neighborhood in half, and local historians genuinely disagree about whether he pushed for that route or just drew what the council picked — or whether that's a trap, because it'll collapse into an argument about facts I can't settle in the room. If it's a trap, tell me what a clean stand-in case would have to have and what it would have to leave out (I'm guessing a case where the person's record is beyond dispute, but explain why). Then the misconceptions, in the order they'll actually arrive: "removing a name erases history," "you can't judge people by today's standards," "he did far more good than harm so it nets out," "just put up a plaque explaining it," and the one I dread most, "the name doesn't mean anything anymore, it's just an address people type into a GPS." For each, give me the moment in the sequence where I head it off before it forms, not the moment I'd have to argue it down afterward — and say which of the five is actually a reasonable position that deserves an answer rather than a correction. Give me one question I can put to them at the end that shows whether the distinction landed, ideally one where somebody who memorized my phrasing answers differently from somebody who's got it. And tell me what I should refuse to get into at this level, and say out loud in the room that I'm refusing it.

  Last thing, and it matters: as you lay out what I should tell them, keep straight for me which parts of this are settled among people who actually work on memory, monuments and public naming, and which parts are live arguments. I don't want to hand twelve laypeople a contested normative view with a consensus price tag stuck on it — especially anywhere the answer might turn on how the unresolved history of our own engineer comes out. Flag those spots explicitly.
reasoning: |-
  Here's a thinking process that leads to the suggested orientation plan:

  1.  **Analyze the Request:**
      *   **Role:** Commission member volunteering to run a 90-minute orientation for 11 new members (diverse backgrounds: postal carrier, realtors, history teacher, appointees).
      *   **Goal:** Teach *one* core distinction: Commemorative naming $\neq$ Historical record. Naming is an *honor* (present-tense action), not documentation (past-tense claim).
      *   **Constraints:**
          *   Do not explain the distinction to *me* (I have it).
          *   Plan *how* to explain it to *them* (90 mins, whiteboard).
          *   Identify prerequisites for the distinction to make sense.
          *   Decide on using the "live case" (Engineer/Levee/Neighborhood) vs. a "stand-in case."
          *   Address 5 specific misconceptions ("erases history," "today's standards," "net good," "plaque," "just an address").
          *   Identify *when* to head off misconceptions (pre-emption vs. rebuttal).
          *   Identify which misconception is actually reasonable.
          *   Provide one diagnostic question for the end.
          *   Specify what to refuse to discuss.
          *   **Crucial:** Distinguish between settled scholarship/consensus and live normative arguments (don't present contested views as fact).

  2.  **Deconstruct the Core Distinction:**
      *   *Record:* "This happened." (Truth-conditional, static, descriptive).
      *   *Honor:* "We value this." (Performative, dynamic, prescriptive).
      *   *Prerequisite:* The group needs to understand that public space is *rhetorical*, not just functional. A street sign isn't a label; it's a speech act.

  3.  **The "Live Case" vs. "Stand-in Case" Dilemma:**
      *   *Live Case (Engineer/Levee):* High stakes, emotionally resonant. *Risk:* Gets bogged down in factual dispute (Did he choose the route?). If the distinction relies on the facts being clear, it fails. The distinction is about *function*, not *fact*.
      *   *Stand-in Case:* Needs clear facts but ambiguous honor.
      *   *Decision:* Use a *hypothetical* or *distant* case for the teaching moment, then apply the lens to the live case at the end. Using the live case *during* the conceptual teaching is a trap because the factual ambiguity will obscure the functional distinction.
      *   *Stand-in Requirements:* Person's actions must be undisputed. The *value* of those actions must be debatable. (e.g., A founder who built the city but owned slaves, or a philanthropist who donated the library but had a controversial business practice). Actually, better: Someone whose contribution is purely functional vs. someone whose contribution is civic virtue. Let's go with a "City Founder" scenario where the facts are known, but the *honor* is questioned.
      *   *Refinement:* The prompt asks what a clean stand-in needs. It needs *undisputed facts* so the argument can't be about "what he did," only "what naming him *does*."

  4.  **Sequencing the 90 Minutes:**
      *   *0-15:* Setup & Prerequisites (Public space as speech).
      *   *15-45:* The Distinction (Record vs. Honor) using the Stand-in.
      *   *45-70:* Misconception Pre-emption (Weaving them into the logic, not waiting for Q&A).
      *   *70-85:* Application to Live Case (Engineer).
      *   *85-90:* Diagnostic Question & Close.

  5.  **Addressing the Misconceptions (Pre-emption Strategy):**
      *   *1. "Erases History":* Head off by defining archives vs. street signs early.
      *   *2. "Today's Standards":* Head off by defining "honor" as a current relationship, not a past judgment.
      *   *3. "Net Good":* Head off by rejecting the "scorecard" model of naming.
      *   *4. "Just a Plaque":* Head off by distinguishing context (plaque) from honor (name).
      *   *5. "Just an Address/GPS":* This is the reasonable one. It's a functionalist view. It needs an answer, not a correction.

  6.  **Scholarship vs. Live Argument (The "Flagging" Requirement):**
      *   *Settled:* Naming is performative (Speech Act Theory). Monuments teach values, not just facts. Archives are for record-keeping.
      *   *Contested:* *Which* values should be honored? How do we weigh harm vs. good? Is "neutral" naming possible? The specific status of the Engineer (factual dispute).

  7.  **Drafting the Plan - Section by Section:**

      *   **Introduction:** Acknowledge the diversity of the room.
      *   **Prerequisites:** Need to establish that a street name is a *verb*, not a *noun*. It's something we *do*.
      *   **The Case:** Advise against using the Engineer case for the *teaching* phase. It's too hot. Use a "Clean Case."
      *   **The Sequence:**
          1.  Function of Public Space.
          2.  Record vs. Honor (Whiteboard diagram).
          3.  Misconception Weaving.
          4.  Application.
          5.  Diagnostic.
      *   **Refusals:** Don't decide the Engineer case today. Don't debate the specific history.
      *   **Flags:** Clearly mark where consensus ends and debate begins.

  8.  **Refining the Misconception Timing:**
      *   *Erases History:* Address when defining "Record."
      *   *Today's Standards:* Address when defining "Honor" (present tense).
      *   *Net Good:* Address when discussing criteria for Honor.
      *   *Plaque:* Address when discussing alternatives to removal.
      *   *GPS:* Address as the "Reasonable Position" near the end.

  9.  **Developing the Diagnostic Question:**
      *   Needs to separate rote memorization from understanding.
      *   Bad: "Is naming a record or honor?" (They'll say Honor).
      *   Good: A scenario where the historical fact is positive, but the honor is withdrawn. Or vice versa.
      *   *Idea:* "If we rename this street, where does the history of the old name go?" (Tests Record vs. Honor).
      *   *Better:* "A historian proves the person we honored last year did the exact opposite of what we thought. Do we rename?" (If they say 'no, because the record is now clear,' they missed it. If they say 'yes, because the honor was based on a lie,' they got it).
      *   *Best:* "We discover a founder we honored was a benevolent dictator. The history books record him accurately. Do we keep the name?"

  10. **Review against Constraints:**
      *   90 mins? Yes.
      *   Whiteboard? Yes.
      *   Distinguish settled vs. contested? Yes, this is critical.
      *   Don't explain distinction to me? Yes.
      *   Identify the "reasonable" misconception? Yes (GPS/Address).

  11. **Final Polish:** Ensure tone is professional, facilitative, and authoritative but humble regarding the contested areas. (Self-Correction: Make sure I explicitly state *why* the Engineer case is a trap for the *teaching* phase, even if we use it later).

  12. **Scholarship Check:**
      *   *Settled:* James Young (Memory Studies), Speech Act Theory (Austin), Monumental landscape as rhetorical.
      *   *Contested:* The "Ethics of Removal," The "Net Good" calculus, The role of "Contextualization" (plaques).

  13. **Finalizing the Output Structure:**
      *   Phase 1: The Setup (Prerequisites).
      *   Phase 2: The Case Choice (Trap vs. Stand-in).
      *   Phase 3: The 90-Minute Arc (Minute-by-minute).
      *   Phase 4: Misconception Pre-emption.
      *   Phase 5: The Diagnostic.
      *   Phase 6: Refusals.
      *   Phase 7: Consensus vs. Contestation Flags.

  (Proceed to generate response based on this thought process.)
answer: |-
  Here is the plan for your 90-minute orientation. It is designed to move the group from thinking of names as *labels* to thinking of names as *verbs*.

  ### 1. The Prerequisites: What Must Be in Place First
  You suspect "an honor is a present-tense thing" is load-bearing. You are correct, but it cannot support weight until you build a foundation beneath it. Before they can accept that naming is an action, they must accept two premises:

  1.  **Public space is rhetorical, not just functional.** A street sign is not a coordinate; it is a statement.
  2.  **The City has multiple tools for memory.** A street sign is one tool; an archive, a plaque, a school textbook, or a museum are others. They do different jobs.

  If you skip this, the distinction collapses. If they believe a street sign is the *only* way we remember things, then removing a name *does* erase history. You must establish that the "Record" function exists elsewhere (libraries, archives) so the "Honor" function can be isolated on the street.

  ### 2. The Case: The Trap vs. The Stand-In
  **Do not use the Engineer/Levee case to teach the distinction.** It is a trap.

  *   **Why:** The distinction you are teaching is *functional* (what does a name *do*?), but the Engineer case is *factual* (what did he *actually do*?). If you use the live case, the realtors and the history teacher will immediately begin debating the route selection. The room will fracture into "He knew" vs. "He didn't know." You cannot teach a philosophical framework while people are fighting over evidence.
  *   **The Stand-In Requirements:** You need a "Clean Case."
      *   **Must Have:** Undisputed historical facts. (e.g., "This person definitely built the levee," or "This person definitely owned slaves.")
      *   **Must Leave Out:** Ambiguity about the action. The ambiguity must be entirely about the *value* of the action.
      *   **Recommendation:** Use a hypothetical or a distant historical example where the facts are settled but the honor is contested. For example: *"A founder who built the city's economy entirely on a monopoly that bankrupted neighboring towns."* Everyone agrees he did it. The question is only: *Do we honor that?*
      *   **Why:** This forces them to argue about the *naming*, not the *history*. Once they grasp the distinction there, you can apply it to the Engineer case in the final 20 minutes.

  ### 3. The 90-Minute Arc (Whiteboard Plan)

  **0:00 – 0:15: The Setup (Premises)**
  *   **Whiteboard:** Draw two columns. Left: **Archive**. Right: **Street Sign**.
  *   **Talk:** "We are not historians. We are curators of public space. An archive's job is accuracy. A street sign's job is cohesion and value."
  *   **Key Move:** Establish that accuracy belongs in the Left Column. Value belongs in the Right Column.
  *   **Scholarship Flag:** *Settled:* Archives and monuments serve different social functions (Memory Studies consensus).

  **0:15 – 0:45: The Distinction (Record vs. Honor)**
  *   **Whiteboard:** Draw an arrow from **Past** to **Archive**. Draw an arrow from **Present** to **Street Sign**.
  *   **Talk:** "Documenting is looking backward. Naming is looking forward. When we name a boulevard, we are not writing a biography; we are issuing an endorsement."
  *   **The Clean Case:** Introduce the hypothetical founder (monopolist). Ask: "The history books record him accurately. Do we put his name on the main road?"
  *   **Goal:** Get them to say, "We can record him without honoring him."
  *   **Scholarship Flag:** *Settled:* Commemoration is performative (Speech Act Theory). It creates a relationship between the viewer and the named.

  **0:45 – 1:10: Pre-empting the Misconceptions**
  *   *Do not wait for Q&A. Weave these into the lecture as "Common Pitfalls."*
  *   **See Section 4 below for specific timing.**

  **1:10 – 1:25: Application to the Live Case (The Engineer)**
  *   **Talk:** "Now, look at our spring case. Notice we are not asking 'Did he build the levee?' (That is Record). We are asking 'Does building this levee, regardless of who chose the route, represent what we want to honor today?' (That is Honor)."
  *   **Scholarship Flag:** *Contested:* How to weigh "civic improvement" against "social harm." There is no consensus formula for this. Tell them this is where their judgment comes in, not the scholarship.

  **1:25 – 1:30: The Diagnostic & Close**
  *   **See Section 5 below.**

  ### 4. Misconceptions: Pre-emption Sequence
  You must head these off *before* they solidify into objections. Here is the order they will naturally arise, and where you cut them off.

  1.  **"Removing a name erases history."**
      *   **When:** During the **0:15 Setup** (Archive vs. Street Sign).
      *   **How:** "If we rename a street, the old name goes into the Archive column. It is not deleted; it is re-categorized. We are moving it from 'Honor' to 'Record'."
      *   **Status:** *Settled.* Removal is not erasure if archival mechanisms exist.

  2.  **"You can't judge people by today's standards."**
      *   **When:** During the **0:15 Setup** (Present-tense arrow).
      *   **How:** "We are not judging *them*. We are judging *us*. The question isn't 'Was he a monster in 1920?' It's 'Do we want to stand next to him in 2024?' Naming is a present-tense relationship."
      *   **Status:** *Settled.* Monuments reflect the values of the era that erected (or keeps) them, not just the era of the subject.

  3.  **"He did far more good than harm so it nets out."**
      *   **When:** During the **0:45 Clean Case**.
      *   **How:** "There is no scoreboard. A street name is not a batting average. If the harm violates the specific value the street represents (e.g., 'Community'), the 'good' in engineering doesn't cancel it out. We don't name schools after brilliant teachers who molest students, regardless of how much math they taught."
      *   **Status:** *Contested.* This is a normative ethical argument. Present it as *your* commission's working framework, not universal law.

  4.  **"Just put up a plaque explaining it."**
      *   **When:** During the **1:10 Live Case Application**.
      *   **How:** "A plaque provides context (Record). The name provides the headline (Honor). A plaque on a monument to a villain doesn't fix the honor; it just creates confusion. We can use plaques *alongside* names, but not to redeem names."
      *   **Status:** *Contested.* "Contextualization" is a live debate in monument studies. Some argue it reclaims space; others argue it creates a "history theme park." Be clear this is a tool, not a solution.

  5.  **"The name doesn't mean anything anymore, it's just an address people type into a GPS."**
      *   **When:** During the **1:25 Diagnostic**.
      *   **How:** **Do not correct this.** This is the **Reasonable Position**.
      *   **Answer:** "That is a functionalist view. If you hold it, you should argue for naming streets after numbers or trees to maximize efficiency. But if you believe names *do* mean something, you must accept they carry weight. You cannot have it both ways."
      *   **Status:** *Contested.* This is the "Banality" argument. It is a valid philosophical stance (naming as purely instrumental), but it contradicts the premise of the Commission's existence.

  ### 5. The Diagnostic Question
  You need a question where someone parroting your words fails, and someone who understands the concept succeeds.

  **The Question:**
  *"A historian discovers that the person we honored ten years ago was actually a fraud who didn't do the things we thought he did. However, the city has grown to love the name, and it's now a valuable brand for the neighborhood. Do we keep it?"*

  *   **The Rote Answer (Failed):** "No, because we only honor truth." (This treats naming as Record).
  *   **The Conceptual Answer (Passed):** "It depends. If the name is now an Honor to the *community* rather than the *person*, we might keep it. But we must acknowledge we are no longer honoring the person, we are honoring the neighborhood's identity. The function has shifted."
  *   **Why it works:** It forces them to weigh the *current function* of the name against the *historical fact*. If they understand the distinction, they realize the "Honor" can detach from the "Record."

  ### 6. What to Refuse (Out Loud)
  There are two things you must explicitly refuse to discuss in this orientation. Say this at the 0:05 mark:

  1.  **"I will not settle the facts of the Engineer case today."**
      *   *Say:* "We are not a truth commission. We are taking the historical record as given by the historians. Our job is to decide what to *do* with that record, not to unearth it."
  2.  **"I will not define 'Good' for you."**
      *   *Say:* "I can tell you that naming is an act of honor. I cannot tell you who *deserves* honor. That is a political and ethical decision you twelve must make. I am giving you the tool, not the answer."

  ### 7. Consensus vs. Contestation (The Flags)
  You asked to keep straight what is settled scholarship and what is live argument. Here is your cheat sheet for the room.

  **Settled (You can state these as facts):**
  *   **Naming is Performative:** Public naming is a speech act that confers status, not just a label that identifies location. (Consensus in Philosophy of Language/Memory Studies).
  *   **Monuments Teach Values:** Landscapes pedagogically shape civic identity; they are not neutral backdrops. (Consensus in Human Geography).
  *   **Distinction of Media:** Archives, museums, and street signs serve different mnemonic functions. (Consensus in Public History).

  **Contested (You must frame these as choices/frameworks):**
  *   **The "Net Good" Calculus:** There is no scholarly agreement on how to weigh positive contributions against negative harms. This is purely normative.
  *   **Contextualization:** Whether a plaque sufficiently "fixes" a problematic name is debated. Some scholars argue it creates "counter-monuments"; others argue it creates moral confusion.
  *   **The "GPS" Argument:** Whether names have lost semantic meaning due to technology is a live sociological debate.
  *   **The Engineer's Intent:** This is a specific historical dispute. Do not present the Commission's eventual finding on this as pre-determined by the "Honor vs. Record" framework. The framework applies regardless of the finding.

  **Final Instruction for You:**
  When you draw the arrow from **Present** to **Street Sign**, pause. Look at the history teacher. Look at the realtors. Say: *"This arrow is the only thing that matters. If you forget everything else I say, remember that a street sign tells us who we want to be, not who they were."* Then stop talking. Let that sit for ten seconds before moving to the Clean Case.
