answer: |-
  You have identified a precise and sophisticated methodological move that sits in the blind spot between the philosophy of history and qualitative social science. You are correct that the standard taxonomy does not quite capture it.

  *   **Ideal Types (Weber)** are abstracted constructs (e.g., "Bureaucracy") against which cases are measured. Your historian offers no construct, only another concrete case.
  *   **Covering Laws (Hempel)** require a conditional statement ($If\ A, then\ B$). Your historian explicitly refuses this.
  *   **Explanation Sketches (Hempel)** are understood as incomplete laws waiting to be filled in. Your historian implies the explanation is *complete* as a narrative, merely needing validation.
  *   **Colligation (Whewell/Dray)** binds facts under a conception, but usually within a single narrative arc, not across two distinct temporal spaces to generate generality.

  The closest existing term is **Argument by Analogy**, but in historiography, this is often treated as heuristic or pedagogical, rarely as *constitutive* of the explanation's validity. When a historian says, "This explains the fall of the cabinet," and validates it by saying, "Just as X happened in 17th-century Venice," they are doing more than drawing an analogy; they are locating the generality *in the relationship between the two singulars*.

  Since there is no canonical term that captures the *ontological weight* of this move (where the generality exists only in the pairing), I propose we coin the term:

  ### **Explanatory Homology**

  **Definition:** An explanatory move in which the validity of a singular narrative explanation is established not by subsumption under a general law or abstract type, but by demonstrating a **structural isomorphism** with a second, causally independent singular narrative. The generality is immanent to the pair; it is not a third thing (a law) that covers them, but a "shape" that both share.

  This draws on the structuralist use of **homology** (as in Lévi-Strauss), where similarity implies a shared underlying logic or constraint without requiring a genetic link or an explicit abstract rule.

  ---

  ### Why "Homology" and not "Analogy"?

  In the philosophy of science, **analogy** usually suggests a functional similarity ($A$ works like $B$) used to generate hypotheses. **Homology** suggests a structural identity ($A$ is built like $B$) used to confirm deep constraints.

  *   **Analogy:** "The cabinet fell like a house of cards." (Metaphorical, illustrative).
  *   **Explanatory Homology:** "The cabinet fell via Mechanism M in 1924, which is homologous to the fall via Mechanism M in 1640." (Structural, explanatory).

  The move you describe claims that the *causal texture* of the two events is identical, even if the surface details (influenza vs. gout, Tuesday vs. Friday) differ. The second case acts as a **control** without being a variable in a statistical sense. It tells the reader: "This is not a fluke of this specific narrative; it is a feature of the political form."

  ---

  ### The Line: Bad Pairing vs. Strained Pairing

  You asked where the line falls between a bad pairing and a merely strained one. In **Explanatory Homology**, the validity rests on four criteria. If these are not met, the homology collapses into mere metaphor.

  #### 1. Structural Isomorphism (The Shape)
  *   **Good:** The sequence of causal steps maps precisely. (Minister's vanity $\rightarrow$ Leak $\rightarrow$ Backbencher withdrawal $\rightarrow$ Collapse).
  *   **Strained:** The outcomes match, but the sequences differ. (e.g., In Case 1, vanity causes a leak; in Case 2, vanity causes a policy error). The "shape" is distorted.
  *   **Bad:** Only the outcome matches (both cabinets fell). This is **superficial analogy**, not homology.

  #### 2. Causal Independence (The Control)
  *   **Good:** The two cases must be sufficiently distant in time/space that they cannot share a direct causal chain. (1924 UK and 1640 France).
  *   **Strained:** The cases are too close, suggesting contagion rather than structural logic. (1924 UK and 1925 UK).
  *   **Bad:** The second case is actually a *consequence* of the first, or they share a unique, non-repeatable cause (e.g., both fell because of the same specific war).

  #### 3. Explanatory Load (The Work)
  *   **Good:** The second case resolves an ambiguity in the first. (e.g., "Was the influenza just luck? No, in the 1640 case, a 'sick ally' also triggered the collapse, showing that *fragility of coalition* is the real cause, not the flu.")
  *   **Strained:** The second case is interesting but doesn't tighten the causal net of the first. It adds color, not necessity.
  *   **Bad:** The second case introduces more noise than signal, confusing the causal mechanism.

  #### 4. Non-Triviality (The Depth)
  *   **Good:** The similarity is non-obvious. (Connecting a cabinet fall to a corporate bankruptcy, or a 17th-century monarchy).
  *   **Strained:** The similarity is obvious but shallow. (Connecting a cabinet fall to another cabinet fall in the same decade).
  *   **Bad:** The similarity is trivial. (Both involved men wearing suits).

  ### The Philosophical Lineage

  If you need to ground this in your dissertation, **Explanatory Homology** sits at the intersection of three traditions:

  1.  **Wittgensteinian Family Resemblance:** You are asserting that Case A and Case B belong to the same "family" without defining the essence of the family. The generality is the resemblance itself.
  2.  **Kuhnian Exemplars:** In *The Structure of Scientific Revolutions*, Kuhn argues that scientists learn not by memorizing laws, but by studying solved problems (exemplars). Your historian is treating the 17th-century collapse as an **exemplar** that validates the 20th-century explanation.
  3.  **Structuralist Morphology:** It treats history not as a sequence of laws, but as a field of forms. When two forms resonate, the resonance *is* the explanation.

  ### Summary for your Methodology Section

  > "Where the Covering Law model demands a universal conditional and the Ideal Type demands an abstract construct, this study employs **Explanatory Homology**. This method validates singular narrative explanations by pairing them with causally independent historical instances that share a structural isomorphism. The generality of the explanation resides not in a stated law, but in the morphological resonance between the paired narratives. A homology is judged strong not by the number of cases, but by the depth of the structural mapping and the explanatory load carried by the pairing."

  This gives you a rigorous vocabulary for a move that is intuitively powerful but often methodologically unspoken.
