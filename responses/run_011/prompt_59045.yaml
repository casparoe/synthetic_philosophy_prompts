answer: |-
  Dear Colleague,

  You are right to pause before the second hearing, because the phrase guilt is not inherited is doing too much work without defining what is being carried forward. To answer you directly, there are at least four distinct precise claims hidden inside that slogan, ranging from the nearly tautological to the legally dubious, and they differ sharply on what property is in question, whose property it is, and what sense of inheritance is being invoked.

  The first reading is the one your first speaker likely relied on, and it is the closest to a tautology. This claim asserts that moral culpability or blameworthiness is the property in question, that this property belongs to individual moral agents, and that inherited is being used in the sense of genealogical descent. It asserts that a person cannot be morally blamed for an act they did not commit, even if their ancestor did. This reading would not block your proposal at all, because the program is not structured as a moral indictment of current residents but as a policy remedy; it would only block the accusation that current residents are wicked. If stated out loud in this precise form, it would survive easily because almost everyone agrees that moral blame requires agency, but it is largely irrelevant to a policy debate about municipal finance and repair.

  The second reading is the one your council member and probably your second speaker were relying on, and this one is substantive and debatable. This claim asserts that liability to pay or financial obligation is the property in question, that this property belongs to the current residents or property buyers rather than the municipal corporation, and that inherited is being used in a mixed sense of genealogical descent and residential succession. It asserts that the body being asked to pay is not the body that acted, because the people writing the checks today are not the people who signed the orders in the 1950s. This reading would block the proposal if successful, because it attacks the funding mechanism by framing the surcharge as a penalty on innocent parties rather than a fee associated with the land or the city's continuity. However, this reading might not survive being stated out loud in its precise form without qualification, because it ignores the legal reality that cities are continuing entities that fund obligations through current revenue, and it conflates the city's liability with the residents' personal liability.

  The third reading is the one your third speaker was relying on, and this is also substantive and debatable but operates on the other side of the transaction. This claim asserts that the right to claim redress or victim status is the property in question, that this property belongs to the descendants of the displaced families, and that inherited is being used in the sense of genealogical descent. It asserts that wrongs do not travel down the family tree, so the people who would receive payments were never wronged and a claim needs a victim who personally suffered. This reading would block the proposal by dismantling the eligibility criteria for recipients. It would survive being stated out loud as a coherent philosophical position, though it is contestable on grounds of intergenerational harm and wealth transmission, but it is distinct from the question of who pays.

  The fourth reading is the one that nobody stated but which underpins the legal viability of your program, and treating it as false is where the opposition becomes legally vulnerable. This claim asserts that a duty to repair or corporate liability is the property in question, that this property belongs to the continuing corporation that acted, meaning the city itself, and that inherited is being used in the sense of institutional succession. It asserts that the city is the same legal entity today as it was sixty years ago and therefore retains the obligations of its past self regardless of personnel changes. If the opposition argues that the city cannot inherit liability because it is not the same body, that claim is simply false under municipal law. This reading supports the proposal rather than blocking it, and if you can isolate this specific claim, you can show that the city's obligation exists independently of the moral guilt of current residents.

  To summarize the strategic landscape, the first reading blocks only the accusation that residents are wicked, leaving the proposal untouched. The second and third readings would block the proposal, the second by attacking the funding source and the third by attacking the recipient eligibility. The fourth reading validates the proposal by establishing the city's continuous liability. Your safest path is to grant the first reading immediately to disarm the moral charge, then separate the second reading from the fourth by clarifying that the surcharge is not a personal penalty on buyers but a mechanism for the continuing corporation to meet its own enduring obligations, and finally address the third reading on its own merits regarding the definition of harm without conflating it with the question of who pays.

