answer: |-
  There is no single established term in sociology or economics that captures this specific dynamic with the precision you are looking for. Concepts like *pluralistic ignorance*, *positional arms races*, and the *ratchet effect* are adjacent, but as you noted, they each miss a critical facet of the mechanism you described.

  *   **Pluralistic Ignorance** relies on misperception (everyone thinks everyone else likes the norm). In your scenario, everyone *knows* everyone else dislikes it.
  *   **Positional Arms Races** imply competition for a scarce good (status). Here, participants are not trying to win; they are trying to avoid losing (shame). It is defensive, not offensive.
  *   **The Economic Ratchet Effect** usually refers to structural rigidities (wages/prices stickiness) rather than a voluntary, iterative social signaling process.

  Because the existing vocabulary is imprecise, I propose we coin a term that carves out this specific mechanism.

  ### The Term: **The Reputational Ratchet**

  **Definition:**
  A social dynamic in which a behavioral norm escalates unidirectionally against the collective preference of the group, driven by **defensive overcompliance**.

  **The Mechanism:**
  The Reputational Ratchet operates on a feedback loop of **asymmetric risk**.
  1.  **The Buffer:** Individuals perceive a social cost to being judged "below average" (cheap, rude, flaky) that outweighs the cost of being "above average" (generous, punctual, attentive).
  2.  **The Shift:** To ensure safety, individuals aim for $\text{Norm} + \epsilon$ (a marginal excess).
  3.  **The Reset:** As the aggregate behavior shifts upward, the perceived "average" updates to include this excess. The new $\text{Norm}$ becomes the old $\text{Norm} + \epsilon$.
  4.  **The Lock:** Because the motivation is fear of shame (downside protection) rather than pursuit of praise (upside gain), there is no corresponding pressure to lower the norm. The mechanism only engages in one direction.

  ### The Carving: Boundaries and Distinctions

  To ensure this term does the work you need it to, we must define where the concept begins and ends.

  **1. Misperception is Not Required**
  You asked if you need to invoke misperception. The answer is **no**. The Reputational Ratchet functions perfectly under conditions of **common knowledge**. Even if every participant explicitly agrees, "We all wish tips were 15%," the individual incentive remains: *If I pay 15% while others pay 20%, I am the outlier.* It is a multi-player Prisoner's Dilemma where the dominant strategy is to overcomply, even if the collective outcome is suboptimal.

  **2. Defensive vs. Competitive**
  This distinguishes the Reputational Ratchet from a standard **Signaling Arms Race**.
  *   In an *Arms Race* (e.g., peacock tails, luxury cars), agents escalate to *gain* status relative to others. If everyone stops, everyone saves money, but no one loses status.
  *   In the *Reputational Ratchet*, agents escalate to *avoid* stigma. If everyone stops, the norm lowers, but the individual who stops *first* incurs a penalty. The escalation is fueled by risk aversion, not ambition.

  **3. Upward Drift Only**
  Does a norm that drifts downward count? **No.**
  Social norms often relax over time (e.g., dress codes, formality of address). This is **Normative Drift** or **Relaxation**. The Reputational Ratchet specifically describes the escalation of *burdens*. Downward drift is usually driven by a coalition of rebels lowering the cost of entry; the Ratchet is driven by the conformist majority raising the cost of safety.

  **4. The Stopping Point**
  Where does it end? The Reputational Ratchet stops only when:
  *   **Saturation:** The cost of compliance exceeds the maximum reputational value available (e.g., tipping 100% gains you no more "good person" credit than tipping 30%).
  *   **Collapse:** The burden becomes so onerous that participation in the activity drops (people stop going to sit-down restaurants entirely), destroying the context for the norm.
  *   **Coordination:** An external authority or explicit coalition fixes the rate (e.g., "service included" policies), removing the signaling variable.

  ### Summary
  The phenomenon you are observing is **The Reputational Ratchet**.

  It is distinct from inflation (which is monetary), distinct from arms races (which are competitive), and distinct from pluralistic ignorance (which relies on secrecy). It is a **coordination failure driven by asymmetric social risk**, where the only safe position is marginally above the mean, ensuring the mean never stays still.
