  1. Kendall Walton's theory of quasi-emotions suggests we only pretend to feel for fictional characters, yet your correspondents insist their grief was genuine rather than make-believe. The phenomenon departs here because the distress arises not from the nature of the initial engagement, but from the later invalidation of a feeling that was initially experienced as fully real.

  2. Accounts of recalcitrant emotions describe feelings that persist despite a person's current judgment that they are unwarranted, such as fearing a safe flight. Your phenomenon differs because the emotion is not resisting a judgment about safety, but rather surviving a change in the ontological status of its object that renders the feeling historically misplaced.

  3. Theories of emotional fittingness argue that an emotion is incorrect if its object does not possess the relevant properties, such as grieving a loss that never occurred. This case departs because the feeling does not correct itself upon discovering the mismatch, but instead lingers as a shameful residue that lacks a valid home.

  4. I propose the term retrospective emotional orphanhood to describe a genuine feeling that persists after new information severs its normative link to its object. It applies when the emotion remains phenomenologically intact but is now unjustified, leaving the subject ashamed of a response that was valid when felt but is now homeless.

  5. The condition arises when a eulogy mourns a misremembered person because the grief is attached to a false construct, but it does not apply when later information strengthens the claim, as validation prevents the emotion from becoming orphaned. In the latter case, the reported curdling suggests a violation of aesthetic distance rather than the normative homelessness defining this phenomenon.
