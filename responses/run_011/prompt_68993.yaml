prompt: |-
  I'm an editor on the science desk of a mid-size news site, and I keep ending up as the person who has to referee fights about the word "function." A paper or a press release says some stretch of DNA, some protein, some organ has a function, a reader or a rival lab emails in saying that's not a function at all, it's just something the thing happens to do, and suddenly I'm mediating a philosophy of biology dispute with no training in it and a headline that locks in an hour. It happens a couple times a month, sometimes several times a week during the big consortium announcements.

  I know the rough shape of the disagreement — that one camp says a trait's function is whatever it was selected for, so function is a historical claim about why the trait is there, and the other camp says function is just the contribution the trait makes to some capacity of the system right now, no history required. What I need is that turned into something my reporters can actually run.

  So: write me a decision procedure, step by step, that a reporter with a biology degree but zero philosophy can apply to an incoming function claim. For each step I want the question to ask, what counts as a pass, what the possible outputs are at that point (kill it, run as written, run with a specific fix, hand it to me, hand it to an outside biologist), and which steps are real judgment calls wearing a procedure costume. It has to handle the messy middle cases rather than only the clean ones: a trait that does several things at once, a trait that got co-opted for something new recently so there's no selection history for the new use yet, a trait that clearly does something and is clearly useless or even harmful, and a claim where the two camps would both say the sentence is true but mean different things by it — because for me that last one is a wording problem, not a truth problem, and the procedure should treat it that way.

  I also need it to distinguish where the claim appears. A scientist saying it in a quote, my reporter paraphrasing it, the headline, and the caption are four different levels of commitment and the procedure should say what's allowed at each.

  Give me the reader-facing bits too: a one-sentence plain-language gloss for each of the two senses that doesn't talk down to anyone, and a rule for when we have to tell readers there's a dispute versus when the distinction doesn't matter to the story and dragging it in would just be noise. Then a crib card version, short enough to read in ninety seconds before deadline.

  Run the whole thing on three cases: the ENCODE fight over how much of the human genome counts as functional, a press release announcing a newly discovered second job for a protein that was already well characterized, and a story about some structure we've been calling vestigial that turns out to do something measurable. For at least one of them the procedure should land somewhere my desk will hate — a kill, or a rewrite that guts the hook — and I want you to say so plainly instead of softening it.

  Finally, be straight with me about the costs. Which distinctions from the technical debate did you drop to make this usable, and what will this procedure systematically get wrong as a result? If I want, name a couple of the refinements people have proposed to patch the historical account and tell me whether any of them is worth adding a step for or whether they're all downstream of stuff a newsroom can safely ignore.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Editor on a science desk (mid-size news site).
      *   **Problem:** Constant disputes over the word "function" in biology (etiological/selected-effect vs. causal role).
      *   **Goal:** A step-by-step decision procedure for reporters (biology degree, no philosophy) to adjudicate these claims under deadline pressure.
      *   **Requirements:**
          *   Step-by-step procedure (Question, Pass/Fail, Outputs, Judgment Calls).
          *   Handle messy middle cases (multi-function, co-option, vestigial/neutral, ambiguity).
          *   Distinguish levels of commitment (Quote, Paraphrase, Headline, Caption).
          *   Reader-facing bits (Plain-language glosses, rule for disclosing dispute).
          *   Crib card version (90-second read).
          *   Test cases (ENCODE, New Protein Job, Vestigial Structure). One must result in a "hard no" (kill/gut).
          *   Cost analysis (What distinctions were dropped? What will this get wrong? Refinements worth adding?).
      *   **Tone:** Professional, direct, pragmatic, newsroom-focused. No fluff.

  2.  **Deconstruct the Philosophy (Internal Knowledge):**
      *   *Selected Effect (SE):* Function = what it was selected for (Millikan, Neander). Historical.
      *   *Causal Role (CR):* Function = what it does now (Cummins). Ahistorical.
      *   *The Conflict:* SE is stricter (no function without history). CR is broader (anything that contributes to a capacity).
      *   *Newsroom Reality:* Scientists often equivocate. Press releases love "function" for anything active. Readers get confused when "junk DNA" is suddenly "functional."
      *   *Strategy:* Don't try to solve the philosophy. Manage the *claim strength* based on evidence provided. Treat "function" as a spectrum of certainty regarding evolutionary history vs. current activity.

  3.  **Drafting the Decision Procedure:**
      *   *Step 1: Evidence Check.* Is there evolutionary evidence or just biochemical activity?
      *   *Step 2: The "Why" vs. "What".* Does the text claim purpose or mechanism?
      *   *Step 3: Context/Level.* Headline vs. Quote.
      *   *Step 4: Ambiguity Check.* Can we rephrase to avoid the trap?
      *   *Outputs:* Kill, Rewrite, Qualify, Run.
      *   *Judgment Calls:* Identifying "selection pressure" evidence vs. just "conservation."

  4.  **Drafting Reader-Facing Bits:**
      *   *Glosses:* Need to be neutral.
          *   SE: "Evolutionary Job" (Why it's here).
          *   CR: "Current Activity" (What it does).
      *   *Disclosure Rule:* Only if it changes the bottom line (e.g., "Junk DNA is useless" vs. "Junk DNA does stuff").

  5.  **Drafting the Crib Card:**
      *   Condense the procedure into a checklist.

  6.  **Developing Test Cases:**
      *   *ENCODE:* Classic CR vs. SE fight. 80% functional (CR) vs. 10% (SE). *Outcome:* Needs heavy qualification. Headline cannot say "80% Functional" without context.
      *   *New Protein Job:* Moonlighting. SE exists for Job A. Job B is CR only (so far). *Outcome:* Distinguish "known role" vs. "new activity."
      *   *Vestigial Structure:* Appendix/Spleen. Does something measurable (immune), but not original selected effect. *Outcome:* "Vestigial" implies SE loss. If it does something now, it's CR. *Hard No:* Cannot say "Vestigial structure found to have primary function" without clarifying it's a new role, not the original one. Let's make this the "Kill/Gut" case to satisfy the prompt's requirement for a hard outcome.

  7.  **Cost Analysis:**
      *   *Dropped:* Nuance about "trait tokens" vs. "trait types," detailed etiology vs. system capacity, teleosemantics.
      *   *Systematic Error:* Will favor CR (activity) because it's easier to measure, potentially overstating evolutionary importance.
      *   *Refinements:* "Biological Role" vs. "Adaptive Function." Maybe worth a footnote, but not a full step.

  8.  **Refining and Polishing (Self-Correction during drafting):**
      *   *Critique:* Is the procedure too academic?
      *   *Fix:* Use newsroom language ("Kill," "Rewrite," "Hed").
      *   *Critique:* Did I address the levels of commitment?
      *   *Fix:* Make Step 3 explicitly about Headline/Lead vs. Body/Quote.
      *   *Critique:* Is the "Hard No" hard enough?
      *   *Fix:* In the Vestigial case, explicitly state that calling it "functional" in the headline is misleading if it implies adaptation.
      *   *Critique:* Are the glosses condescending?
      *   *Fix:* Ensure they sound like definitions, not explanations for laypeople. "Evolutionary purpose" vs. "Current activity."

  9.  **Final Review against Prompt:**
      *   Step-by-step? Yes.
      *   Question/Pass/Output/Judgment? Yes.
      *   Messy middle cases? Yes (addressed in steps).
      *   Levels of commitment? Yes (Step 3).
      *   Reader-facing glosses? Yes.
      *   Disclosure rule? Yes.
      *   Crib card? Yes.
      *   Three test cases? Yes.
      *   One "hate it" outcome? Yes (Vestigial case).
      *   Cost analysis? Yes.

  10. **Final Polish:** Check tone. Needs to be authoritative but empathetic to the editor's plight. (Proceed to generate output).

  *(Self-Correction on the Vestigial Case)*: The prompt asks for one case where the procedure lands somewhere the desk will hate (kill or gut). The ENCODE story is the most famous "fight," but the Vestigial one is more likely to be a "hook" that gets killed. If a reporter writes "Appendix Found to Have Function," that's a click magnet. If the procedure says "No, it's vestigial, you can't say that without major hedges," the desk will hate it. I will make sure the Vestigial case triggers a "Rewrite/Gut" mandate.

  *(Self-Correction on Glosses)*: Avoid "purpose" as it implies intent. Use "Evolutionary Reason" vs "Current Job." Or "Why it evolved" vs "What it does." Let's go with "Evolutionary Reason" (SE) and "Current Activity" (CR).

  *(Self-Correction on Costs)*: Be honest. This procedure essentially defaults to Causal Role for activity but demands Selected Effect for evolutionary claims. This might under-report on emerging functions. Acknowledge that.

  Let's assemble.cw
answer: |-
  **MEMORANDUM**
  **TO:** Science Desk
  **FROM:** Editor
  **SUBJECT:** Standard Operating Procedure: Adjudicating "Function" Claims
  **DATE:** October 26, 2023

  Below is the new protocol for handling claims regarding biological "function." This is not a philosophy seminar; it is a risk management tool. The goal is to prevent us from publishing headlines that make evolutionary biologists email us in a rage, while still allowing reporters to cover active biochemical discoveries.

  ### PART 1: THE DECISION PROCEDURE

  Apply these steps in order. Do not skip to Step 4.

  **Step 1: The Evidence Audit**
  *   **Question:** What evidence does the source provide for the word "function"?
  *   **Pass:** The paper demonstrates *conservation across species* (phylogenetic footprinting), *fitness costs* when removed (knockout studies showing reduced survival/reproduction), or explicit *selection pressure* modeling.
  *   **Fail:** The evidence shows only biochemical activity (binding, transcribing, folding, reacting) or contribution to a system capacity (e.g., "stabilizes the structure") without evolutionary data.
  *   **Output:**
      *   *Pass:* Proceed to Step 2. (Strong claim).
      *   *Fail:* Proceed to Step 2. (Weak claim).
      *   *Judgment Call:* Distinguishing "conservation" (looks the same) from "selection" (kept because it helps). If the paper only says "highly conserved," treat as **Fail** for evolutionary function.

  **Step 2: The "Why" vs. "What" Check**
  *   **Question:** Is the claim about *why the trait exists* (history) or *what the trait is doing now* (mechanism)?
  *   **Pass (History):** The text implies the trait was shaped by natural selection to do this specific job (e.g., "evolved to," "adaptive role").
  *   **Pass (Mechanism):** The text describes a causal contribution to a larger system (e.g., "acts as a scaffold," "binds to X").
  *   **Fail:** The text conflates the two (e.g., "This protein functions to stabilize the cell, explaining its evolutionary presence" without evidence of the latter).
  *   **Output:**
      *   *History Claim + Step 1 Fail:* **HAND TO ME.** This is the danger zone.
      *   *Mechanism Claim + Step 1 Fail:* **RUN WITH FIX.** Change "function" to "activity," "role," or "effect."
      *   *History Claim + Step 1 Pass:* **RUN AS WRITTEN.**

  **Step 3: The Commitment Level (Placement)**
  *   **Question:** Where does the word "function" appear?
  *   **Headline/Deck:** Strict Mode. Only allowed if Step 1 Pass + Step 2 History. If Step 1 Fail, use "Activity" or "Role."
  *   **Reporter Paraphrase/Lead:** Moderate Mode. Allowed if Step 1 Fail, *provided* the text clarifies it is a biochemical role, not necessarily an evolutionary one.
  *   **Direct Quote:** Loose Mode. Scientists can say what they want. However, if a quote makes a strong evolutionary claim unsupported by the paper (Step 1 Fail), you must contextualize it in the very next paragraph.
  *   **Caption:** Strict Mode. Treat like Headline.
  *   **Output:**
      *   *Violation:* **REWRITE.** Downgrade the commitment level to match the placement.

  **Step 4: The Ambiguity Flush (The "Both True" Problem)**
  *   **Question:** Would both the "History" camp and the "Activity" camp agree the sentence is true, but for different reasons?
  *   **Pass:** Yes. (e.g., "The heart functions to pump blood." Both agree.)
  *   **Fail:** No. (e.g., "This DNA sequence functions to regulate gene X." SE camp says "Only if selected for that," CR camp says "If it does it, it functions.")
  *   **Output:**
      *   *Pass:* **RUN AS WRITTEN.** No need to flag the dispute.
      *   *Fail:* **ADD HEDGE.** Insert "biochemical" before function, or "evolutionary" before function, to specify which definition is in play.

  **Step 5: The Messy Middle (Co-option & Vestigiality)**
  *   **Question:** Is this a new job for an old tool (exaptation) or a remnant doing something minor?
  *   **Rule:** You cannot claim "Function" (unqualified) for a trait widely considered vestigial unless you prove the *new* activity is under selection.
  *   **Output:**
      *   *New Job:* Use "moonlighting role" or "secondary activity." Do not use "primary function."
      *   *Vestigial:* Do not use "Function" in the headline. Use "Activity identified in [Structure]."

  ---

  ### PART 2: READER-FACING PROTOCOLS

  **Plain-Language Glosses**
  When we need to explain the distinction in the text, use these definitions. Do not use the terms "etiological" or "causal role."

  1.  **Evolutionary Function (Selected Effect):** "The job this trait was originally shaped by natural selection to perform."
  2.  **Biochemical Function (Causal Role):** "The specific activity or effect this trait has within the system right now."

  **The Disclosure Rule**
  *   **Do Not Disclose:** If the distinction does not change the practical outcome of the story (e.g., a drug target works regardless of why it evolved).
  *   **Disclose:** If the claim overturns a previous evolutionary consensus (e.g., "Junk DNA," "Vestigial Organs") or implies an organism is "designed" for a purpose. In these cases, add one sentence: *"While researchers observed the molecule performing this activity, biologists debate whether this role drove its evolution or is a secondary effect."*

  ---

  ### PART 3: THE CRIB CARD (90-Second Read)

  **DEADLINE CHECKLIST: "FUNCTION"**

  1.  **Check the Evidence:** Did they prove evolution selected for this (Pass), or just that it does something biochemical (Fail)?
  2.  **Check the Claim:** Are they saying *why it's there* (History) or *what it does* (Mechanism)?
  3.  **Check the Placement:**
      *   **Headline:** History claims need Evolutionary Evidence. Otherwise, use "Activity" or "Role."
      *   **Quote:** Let them talk, but hedge immediately after if unsupported.
      *   **Body:** Clarify "Biochemical Function" vs. "Evolutionary Function."
  4.  **The Vestigial Trap:** If it's called "vestigial" or "junk," you cannot headline it as "Functional" without proving selection. Use "Active" instead.
  5.  **The Fix:** If in doubt, swap "Function" for "Activity." It is rarely scientifically wrong, whereas "Function" is often philosophically loaded.

  ---

  ### PART 4: TEST CASES

  **Case 1: The ENCODE Consortium (Genome Function)**
  *   **Scenario:** Press release claims 80% of the genome is "functional" based on biochemical activity (transcription, binding).
  *   **Procedure Run:**
      *   *Step 1:* Evidence is biochemical (transcription), not evolutionary (conservation). **FAIL.**
      *   *Step 2:* Claim implies "why it's there" (function vs. junk). **HISTORY CLAIM.**
      *   *Step 3:* Headline proposes "80% of Genome Functional." **STRICT MODE.**
      *   *Step 5:* Messy middle (biochemical noise vs. selected trait).
  *   **Outcome:** **REWRITE/GUT.**
  *   **Action:** Headline cannot say "Functional." Must say "Biochemically Active." Body must explicitly state that evolutionary biologists estimate only ~10% is under selection. The "80% functional" claim is a definition switch, not a discovery.
  *   **Desk Reaction:** You will hate this. It kills the "Junk DNA is Dead" hook. Do it anyway.

  **Case 2: The Moonlighting Protein**
  *   **Scenario:** Protein X is known to metabolize sugar. New paper shows it also binds to DNA during stress. Press release: "Protein X has new function."
  *   **Procedure Run:**
      *   *Step 1:* Evidence is biochemical binding. **FAIL** (for evolutionary history of *this* job).
      *   *Step 2:* Claim is about current activity. **MECHANISM.**
      *   *Step 3:* Headline "Protein X Functions in DNA Repair."
      *   *Step 5:* Co-option check.
  *   **Outcome:** **RUN WITH FIX.**
  *   **Action:** Headline: "Protein X Takes on New Role in DNA Repair." Body: Clarify this is a "moonlighting activity" and it is unknown if this drives selection.
  *   **Desk Reaction:** Acceptable. Preserves the discovery without overstating the evolution.

  **Case 3: The Vestigial Structure (The "Kill" Case)**
  *   **Scenario:** Study shows the human appendix contains lymphoid tissue and helps repopulate gut bacteria. Pitch: "Vestigial Appendix Found to Have Function."
  *   **Procedure Run:**
      *   *Step 1:* Evidence is physiological (immune/bacteria), not evolutionary selection for *this* trait in humans. **FAIL.**
      *   *Step 2:* Claim implies "Function" counters "Vestigial." **HISTORY CLAIM.**
      *   *Step 3:* Headline "Appendix Found to Have Function." **STRICT MODE.**
      *   *Step 5:* Vestigial Trap.
  *   **Outcome:** **KILL THE HEADLINE / REWRITE.**
  *   **Action:** You cannot run "Appendix Found to Have Function." "Vestigial" refers to evolutionary history (Step 1 Fail); "Function" in this context implies current utility that justifies existence. This conflates the two definitions to create a paradox that doesn't exist.
  *   **Mandate:** Headline must be: "Appendix Plays Active Role in Immune System." You must explicitly state in the lead that this does not negate its status as an evolutionary remnant.
  *   **Desk Reaction:** **You will hate this.** It neuters the "Science was wrong!" narrative. It is the correct call. "Vestigial" does not mean "useless," it means "leftover." Calling it "functional" in the evolutionary sense is false. Calling it "active" is true. Enforce the distinction.

  ---

  ### PART 5: COST ANALYSIS

  **What We Are Dropping**
  To make this usable under deadline, we are ignoring:
  1.  **Trait Tokens vs. Trait Types:** We are treating "the appendix" as a single unit rather than distinguishing between the specific tissue instance and the general organ type.
  2.  **System Capacities:** We are not asking *which* system capacity matters (survival? reproduction? cellular homeostasis?). We default to the paper's definition of the "system."
  3.  **Teleosemantics:** We are ignoring the debate about whether "function" requires a goal-directed system at all.

  **Systematic Errors This Procedure Will Create**
  1.  **Under-reporting Emerging Adaptation:** If a trait is currently being selected for but hasn't left a phylogenetic footprint yet, Step 1 will flag it as "Fail." We will downgrade valid claims of *ongoing* adaptation to mere "activity."
  2.  **Bias Toward Biochemistry:** Because biochemical evidence (Step 1 Fail) is easier to get than evolutionary evidence (Step 1 Pass), our coverage will systematically favor "Causal Role" definitions. We will sound like we believe everything that *does* something *evolved* to do it, unless we actively hedge.
  3.  **The "Moonlighting" Blindspot:** We may miss stories where a secondary function becomes the primary driver of selection, because the procedure forces us to label it "secondary" until long-term selection data exists.

  **Refinements Worth Ignoring**
  You asked about patches to the historical account (e.g., *Generalized Selected Effects*, *Propensity Functions*).
  *   **Verdict:** Ignore them.
  *   **Reason:** These are attempts to solve edge cases where selection is hard to measure (e.g., drift vs. weak selection). For a newsroom, the binary distinction between "We have evidence of selection" and "We have evidence of activity" is sufficient. Adding a step for "weak selection pressure" invites too much reporter judgment on statistical power. Stick to the binary: Is there a phylogenetic/fitness argument? Yes/No.

  **Final Note:** This procedure prioritizes accuracy over click-through. It will reduce emails from angry evolutionary biologists by 90%. It will also reduce clicks from headlines that promise evolutionary revolutions based on biochemical assays. That is the trade.
