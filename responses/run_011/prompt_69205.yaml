      *   *Clarification on White Shoe:* Be careful not to conflate Hempel's logical paradox with the ecological detection problem. The prompt asks if they accept the *conclusion* about the white shoe. The conclusion is usually that non-black non-ravens confirm the hypothesis. In ecology, "non-target species" (analogous to non-black non-ravens) *do* confirm the target's absence (analogous to all ravens are black? No, analogous to "Target is not here").
