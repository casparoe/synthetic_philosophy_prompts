          *   For occupancy: Non-detections matter. Incidental is useless.
          *   *Consistency:* Yes, it is consistent. Different hypotheses require different evidence structures.
          *   *Hypothesis A:* "Species is present at time T" (Needs only positive).
          *   *Hypothesis B:* "Species is absent at time T" (Needs negative + effort).
          *   The database tags the *potential* of the record, not just the content.

      *   **Question 5: Changing to "Content-Only" Account.**
          *   If only content mattered ("No ravens"), we couldn't distinguish incidental from complete.
          *   *Consequence:* We would have to discard all non-detections. We could only model presence, not absence/occupancy.
