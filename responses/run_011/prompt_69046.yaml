  *(Self-Correction)*: Make sure not to imply that "force-push" is always illegal. In law, a revolution *becomes* legal if it succeeds (Kelsen's efficacy). In git, a force-push just rewrites history. The analogy needs to capture the *legitimacy* shift, not just the technical act.

