      *   *Amendment:* A Pull Request (PR) that modifies the pipeline config *and* the code.
      *   *Eternity Clause:* A hard-coded check in the bootstrap script or a signed commit requirement that refuses to merge if specific lines are touched.
      *   *Grundnorm:* The initial `git init` + the trust in the hardware/OS running the CI server.
      *   *Revolution:* A `git push --force` or forking the repo and migrating the community.
      *   *Root:* The SysAdmin/Repo Owner with SSH keys.

  4.  **Drafting the Translation (Iterative Process):**
      *   *Attempt 1:* The constitution is code. Amendments are commits. Eternity clauses are `if` statements.
      *   *Critique 1:* Too simple. Doesn't capture the *validity* issue. In code, if you change the logic, the new logic runs. In law, if you change the logic *illegally*, it's not law.
      *   *Attempt 2:* Focus on the CI/CD pipeline. The pipeline decides what gets merged. If you change the pipeline, does the old pipeline validate the change, or does the new pipeline validate itself?
      *   *Refinement:* This is the core. The "Bootstrapping Problem."

  5.  **Addressing the Central Puzzle (The Paradox):**
      *   *Engineering view:* If I have root, I can change anything. If I remove root access, I lock myself out.
      *   *Legal view:* If the constitution says "X cannot be changed," and we change X, is it a valid amendment or a coup?
      *   *Translation:* It's about *authorization* vs. *execution*. In code, execution wins. In law, authorization wins. If the CI script says `deny change to line 5`, but someone edits the script to allow line 5, did the *old* script validate that edit? No. So the edit is unauthorized. But if the edit is applied, the system runs.

