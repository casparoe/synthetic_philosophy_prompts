      *   *The "Root" Issue:* This is the user's suspicion. In engineering, there *is* always a root (hardware, admin, cloud provider). In law, the "people" or "sovereign" is inside/outside simultaneously.
      *   *Verdict on Paradox:* It's not badly stated; it's an ontological mismatch. Code is descriptive (what happens); Law is normative (what *should* happen).

  7.  **Refining the Tone:**
