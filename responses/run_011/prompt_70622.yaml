      *   **Rank 1 (Fatal):** Claim 1 vs. Claim 3 (via Claim 2).
      *   **Rank 2 (Explanatory):** Claim 5 vs. Claim 6.
      *   **Rank 3 (Theoretical Cost):** Claim 7 vs. The Specificity of the Account.
      *   **False Alarms:** 1 & 4, 2 & 3 (if 1 is fixed).

  7.  **Writing the advice:** Be direct, philosophical, and practical for a quals context. (Quals examiners look for awareness of these tensions).

      *   *Note on Claim 1:* The phrase "Pain is bad" is the trap. Needs to be "Suffering is bad" or "Affective Pain is bad."
      *   *Note on Claim 5:* Needs to be "Phenomenal Aversion" not "Desire."
      *   *Note on Claim 7:* Acknowledge it but bracket it.

  8.  **Final Polish:** Check tone. Supportive but rigorous. Ensure I answer the specific prompt (Rank conflicts, say what to drop, say costs, flag false alarms).

      *(Self-Correction on Claim 1 vs 3)*: Actually, if Claim 4 is true ("pins badness to affective dimension"), then Claim 1 ("Pain is bad... intrinsic to felt character") can be saved if "Pain" in Claim 1 is understood as "The full conscious experience including affect." But Claim 2 says Asymbolics "really are in pain." If they are in pain, and Pain is intrinsically bad (1), they must suffer. But they don't (3). So either they aren't in pain (deny 2) or Pain isn't intrinsically bad (deny 1). The user wants to keep 2 and 3. So 1 must go.
      *Wait, Claim 4 saves 1?* Claim 4 says badness is pinned to affect. Claim 1 says badness is intrinsic to felt character. If affect is part of felt character, 1 and 4 are consistent. The problem is the *scope* of "Pain" in Claim 1. If "Pain" includes affect, Asymbolics don't have Pain (contradicts 2). If "Pain" is just sensory, Claim 1 is false (contradicts 1).
      *Okay, the conflict is definitely 1 vs (2+3+4).*

      *(Self-Correction on 5 vs 6)*: Claim 5 says affect *is* felt aversion. Claim 6 says wanting-to-stop isn't enough for badness. If the affect *is* the badness-maker (Claim 4), then the affect must be sufficient for badness. If the affect is just "wanting to stop," and "wanting to stop" isn't sufficient (Claim 6), then the affect isn't sufficient. Contradiction.
