answer: |-
  **Ask Dr. Wren**
  *The Aurora Group Internal Newsletter | Vol. 44*

  **Dear Dr. Wren,**
  At our selection appointment, we were shown the rankings for our three viable embryos. Though the first was rated highest for expected well-being, I felt a pull toward the second. My son is now three, vibrant and healthy. But I worry: have I wronged him by not choosing the top rank?
  — *Vibrant in Vermont*

  **My Dear Vibrant,**
  Let us sit with this guilt for a moment, then set it down. You have wronged no one. Your son would not exist had you chosen otherwise, and the embryo you passed over is not a person deprived of a life. This is why the obligation feels so strange: it is impersonal and comparative, not based on harm. There is no victim, yet the choice was nevertheless the wrong one. Our ranking instrument is an expected-value calculation over how well a life goes. We are candid that the polygenic scores have minuscule effect sizes, that variants push in opposite directions, and that confidence intervals swallow most differences. The guidance says *best regardless*. You followed your heart where you should have followed the sum. It is a gentle error, but an error still.

  **Dear Dr. Wren,**
  My wife and I realize we got it wrong the first time. Should we simply have another child and get it right? Can the second be ranked so as to make up for the first?
  — *Pragmatic in Palo Alto*

  **My Dear Pragmatic,**
  This is a sensible question with a sensible answer. A better addition does not undo anything; the first child's lower expected welfare remains a fixed point in history. However, it does improve the total. In practice, the distinction we draw between screening against disadvantage and selecting for advantage dissolves; you are simply adding light where you can. There is no mandate here, only the opportunity to maximize. We are not in the business of eugenics, because everything remains your free choice. But if you can add more well-being to the world, why not? We encourage you to view the family unit as a portfolio of potential, where each new entry offers a chance to balance the ledger.

  **Dear Dr. Wren,**
  I declined the ranking entirely. I want reassurance that not choosing is also a choice.
  — *Free in Frankfurt*

  **My Dear Free,**
  I agree warmly. Not choosing is a choice, and nothing is compelled. Autonomy is our bedrock. Some worry that a person whose genetic makeup was chosen by someone else stands in a different relation to their own life than the rest of us do. It is a lovely sentiment, but it changes nothing, since no alternative arrangement was ever on offer either. Even in randomness, you chose the method of selection. You bear the responsibility for the roll of the dice just as others bear the responsibility for the weighted hand. We are here to support you, whichever path you walk, provided you acknowledge the weight of the step. Freedom is not the absence of obligation, but the capacity to carry it.

  *Dr. Wren is available for confidential consultation every Tuesday.*
