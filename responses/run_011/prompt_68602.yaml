answer: |-
  You have not mashed two unrelated phenomena together. Your framing is precise, and the distinction you are drawing is real. You have identified a specific dynamic failure mode in social epistemology that sits in the gap between static peer-disagreement theory and idealized common-knowledge models.

  To answer your primary question: **No, there is no single canonical term in the literature that captures this specific iterative, self-sealing loop.**

  There are nearest neighbors, but they miss the dynamic "engine" you are describing. Here is the carving you asked for, the nearest concepts with their specific differences, and a proposed label for the phenomenon itself.

  ### 1. The Nearest Neighbors (and why they miss)

  **A. The Steadfast View (Peer Disagreement Literature)**
  *   **The Concept:** When an epistemic peer disagrees with you, you have two main options: *Conciliation* (move toward them) or *Steadfastness* (hold your ground). The "Steadfast View" argues you can remain justified if you have independent reason to think you are right (e.g., you remember the calculation clearly).
  *   **The Difference:** This literature is almost entirely **static**. It analyzes Round 1: "I discover disagreement; what do I do?" It does not model Round 2 through Round 10, where the *persistence* of the disagreement becomes a new data point that actively degrades the peer status. Your case is about how the *duration* of the disagreement destroys the "peer" premise itself.

  **B. Higher-Order Evidence (HOE)**
  *   **The Concept:** Evidence about your own reasoning process (e.g., "I am tired," "I am biased," or "A smart person disagrees with me").
  *   **The Difference:** In your scenario, the agents are using Higher-Order Evidence to **neutralize** Higher-Order Evidence.
      *   HOE 1: "Peer disagrees" $\rightarrow$ Evidence I might be wrong.
      *   HOE 2: "Peer disagrees *despite seeing my data*" $\rightarrow$ Evidence Peer is processing poorly.
      *   The loop occurs when HOE 2 is generated *solely* by the persistence of HOE 1. Standard HOE theory doesn't typically model this recursive cancellation where the *only* evidence for the peer's irrationality is the disagreement itself.

  **C. Naive Realism**
  *   **The Concept:** The cognitive bias where I see the world as it is, and I see you as seeing it through a lens of bias/motivation.
  *   **The Difference:** Naive Realism is the **psychological fuel**, but it is not the **structural loop**. You can have Naive Realism without the iterative data-pooling ritual. Your case is Naive Realism institutionalized through a rationalist methodology (Double Crux) that accidentally provided the scaffolding for the loop to tighten.

  ### 2. The Carving: A Definition

  If we are to name this, the most technically accurate description is **Endogenous Epistemic Discounting**, but for the specific loop you described, I propose the label:

  **The Reflexive Competence Trap**

  **Definition:**
  A Reflexive Competence Trap occurs when two agents, attempting to resolve a disagreement through evidence pooling, enter a stable equilibrium where:
  1.  **Persistence as Signal:** The continued existence of the disagreement is treated as primary evidence that the *other agent's* processing function is flawed (lowering their estimated reliability).
  2.  **Discounting as Shield:** This lowered reliability estimate is used to discount the evidential weight of the other agent's continued dissent.
  3.  **Endogeneity:** The evidence for the "flawed processing" is derived *exclusively or primarily* from the fact of the disagreement itself, rather than independent observations of bias or error.
  4.  **Homeostasis:** New object-level evidence does not converge beliefs; it converges the *mutual distrust*, keeping the belief gap stable.

  ### 3. The Boundaries (Edge Cases)

  You asked where the edges are. Here is how to distinguish the Trap from valid skepticism.

  **Edge Case 1: Asymmetric Competence (One person is actually biased)**
  *   **Scenario:** Alice is rational; Bob is motivatedly reasoning. Alice notices Bob isn't moving. Alice downgrades Bob's reliability.
  *   **Verdict:** **Not the Trap.**
  *   **Why:** The downgrade is **Exogenous**. Alice has access to signals of Bob's bias (emotional language, moving goalposts) that exist independently of the mere fact of disagreement. In the Trap, the *only* proof of the flaw is "he disagrees with me despite the data." If you can point to a specific cognitive error independent of the conclusion, you are not in the Trap.

  **Edge Case 2: Genuine Private Information (The Aumann Escape)**
  *   **Scenario:** Alice thinks she shared everything, but Bob has a lived experience or intuitive model he hasn't articulated.
  *   **Verdict:** **Not the Trap.**
  *   **Why:** This is a standard communication failure. The Trap requires that both parties *believe* they have achieved Common Knowledge of the evidence. If the loop persists even after both explicitly acknowledge "I cannot find the hidden variable you are holding," it is the Trap. If the disagreement resolves once the hidden variable is found, it was just incomplete pooling.

  **Edge Case 3: One-Sided Loop**
  *   **Scenario:** Alice trusts Bob. Bob thinks Alice is broken.
  *   **Verdict:** **Half-Trap / Asymmetric Trap.**
  *   **Why:** The system doesn't reach a stable equilibrium of *mutual* stagnation; it reaches a hierarchy. However, if Alice eventually infers "Bob thinks I'm broken, therefore Bob is uncharitable," and downgrades him, it snaps into the full symmetric Trap. The Trap is most potent when symmetric, but the mechanism (discounting based on persistence) works unilaterally.

  ### 4. The Test: How to Identify It

  To determine if a disagreement is a **Reflexive Competence Trap** versus **Ordinary Stubbornness** or **Legitimate Skepticism**, apply these three tests:

  **Test 1: The Cold Prior Test (Isolating the Loop)**
  *   *Ask:* "If you had never met this person, and you read their anonymized argument and data in a paper, would you update?"
  *   *Trap:* "No, because the argument is flawed." (But the flaw identified is only visible because you know *they* believe it).
  *   *Not Trap:* "Yes, I would update," or "No, the data is objectively weak."
  *   *Indicator:* In the Trap, the perceived quality of the *argument* degrades as the *relationship* degrades.

  **Test 2: The Third-Party Swap**
  *   *Ask:* "If a third peer, whom you both trust equally, adopted Person B's position after seeing Person A's data, would Person A update?"
  *   *Trap:* Person A hesitates or says "Well, they'd have to be processing it wrong too."
  *   *Not Trap:* Person A says "Yes, that would move me significantly."
  *   *Indicator:* The Trap is specific to the *source* of the disagreement. If the disagreement is valid, the identity of the dissenter shouldn't matter as much as the fact of the dissent.

  **Test 3: The Meta-Update Check**
  *   *Ask:* "Has your estimate of this person's general rationality dropped *specifically* in proportion to the duration of this disagreement?"
  *   *Trap:* Yes. "I used to think they were sharp, but they've been wrong about this for six months."
  *   *Not Trap:* No. "I still think they are sharp, which is why this disagreement is so troubling."
  *   *Indicator:* In the Trap, the disagreement consumes the trust that made the disagreement matter in the first place.

  ### 5. Why Your Framing is Correct

  You suspected you might be mashing phenomena. You aren't. You have correctly identified that **Aumann's Agreement Theorem assumes Common Knowledge of Rationality.**

  In your scenarios, the agents start with Common Knowledge of Rationality ("we are peers"). But the *process* of iterating the disagreement converts "Common Knowledge of Rationality" into "Common Knowledge of *Local* Irrationality."
  *   Round 1: We disagree. (Evidence against X)
  *   Round 3: We still disagree. (Evidence that you are irrational about X)
  *   Round 6: You are irrational about X. (Your disagreement is noise, not signal)
  *   Result: We disagree forever, rationally.

  This is not a violation of Aumann; it is a **collapse of the priors required for Aumann to function.** The "Common Prior" isn't just about the world; it's about each other's minds. When you update your model of *my mind* to include "systematic error on this topic," you have changed the prior.

  ### Summary

  *   **Name:** The **Reflexive Competence Trap** (or **Endogenous Epistemic Discounting**).
  *   **Core Mechanism:** Using the *persistence* of disagreement as evidence of *irrationality*, which neutralizes the *normative force* of the disagreement.
  *   **Distinction:** Unlike ordinary stubbornness, the agents are updating—they are updating their model of *each other* in a way that protects their model of the *world*.
  *   **Verdict:** Your framing is sound. This is a known failure mode in high-rationality communities (often discussed informally as "Double Crux failure" or "Meta-Argument Spirals"), but it lacks a crisp academic label because standard epistemology struggles to model the *dynamics* of trust degradation over time. You have described a **homeostatic system for maintaining disagreement.**
