prompt: |-
  I am drafting the theoretical section of a paper on what it takes to say that a trained neural network represents something, and before I engage any of the existing accounts I want the specification. State the desiderata: what an account of representation-attribution must deliver to count as adequate — the phenomena it has to explain, the cases it has to get right, the distinctions it must not collapse, and the background facts about how these systems actually behave that it cannot contradict. For each requirement, give the case or consideration that motivates it, and mark it either non-negotiable or a preference belonging to a particular camp (feature-level locality, linearity, discreteness, human-legible content, and so forth).

  Fix the purpose as follows, since I take adequacy to be relative to it: the account must be good enough to license inferences from a claim of the form the model represents that p to predictions and interventions concerning the model's behavior — the standard I would be willing to defend to a skeptical external auditor, not merely to a colleague.

  To keep the exercise from drifting into generality, here is the sort of result I want the list to be able to adjudicate. In a 7B model fine-tuned on multilingual geographic question-answering, a probe trained on residual-stream activations at layer 14 recovers a binary feature we would gloss as is-in-France at roughly 96 percent balanced accuracy, and the recovered direction is stable across three unrelated prompt templates. Three further findings complicate the picture. First, zeroing the component of the residual stream along that direction leaves next-token behavior statistically indistinguishable from baseline on the evaluation set. Second, adding a synthetically constructed vector along the same direction to the residual stream reliably flips the model's answers on a held-out set of questions it had previously answered correctly. Third, the direction is not monosemantic: a sparse autoencoder trained at the same layer resolves it into several components that co-activate, and ablating any one of them individually reproduces the first finding while leaving the second partly intact.

  I am not asking for a verdict on this case, though you should say what verdicts an adequate account is obliged to deliver here and why. I want the list of requirements that would license a verdict, and the reasons each belongs on it. In particular, address the following. Which of the following are genuine desiderata and which are load-bearing assumptions of one research program: that representations be identifiable with directions or subspaces; that they be causally necessary for the behaviors they explain; that they be causally sufficient for those behaviors; that an account be complete rather than merely local; that attributed content be something a human could state; that the account survive changes of prompt, template, and fine-tuning data. Which distinctions must the account keep apart — presence of information in activations versus use of that information, content versus vehicle, a feature versus a direction, decodability versus functional role, representing-that versus representing-as — and which collapses are fatal versus merely inelegant.

  Flag any subset of the requirements you believe cannot be jointly satisfied. My own suspicion is that causal necessity, causal sufficiency, and identifiability with localized features cannot all hold once superposition and redundancy are on the table, and the case above is meant to press exactly that; but I want to know whether the suspicion is correct, or whether one of the three can be weakened without the account ceasing to serve the purpose stated above. Then identify the single requirement that does the most to exclude candidates, and say which contenders it excludes and how.

  Finally, briefly and without turning this into a survey: how do interventionist accounts that tie representation to the results of activation-level manipulations, informational or teleological accounts that tie it to what a component carries or was selected for, and deflationary accounts on which representation talk is a useful fiction about weight-level functions fare against the list. A paragraph each is plenty; the thinking should be in the requirements.
reasoning: |-
  Here's a thinking process that leads to the suggested desiderata list:

  1.  **Analyze the Request:**
      *   **Goal:** Draft a theoretical section for a paper on neural network representation.
      *   **Task:** Specify desiderata (requirements) for an adequate account of representation-attribution.
      *   **Purpose:** The account must license inferences from "Model represents $p$" to predictions/interventions on behavior (auditable standard).
      *   **Test Case:** A 7B multilingual QA model with a specific "is-in-France" probe finding at Layer 14 (96% accuracy, stable across templates). Complications: Zeroing has no effect (necessity failure?), Adding flips answers (sufficiency success?), SAE shows polysemanticity/superposition (locality failure?).
      *   **Specific Questions to Address:**
          *   Distinguish genuine desiderata from load-bearing assumptions of specific research programs (locality, linearity, etc.).
          *   Identify distinctions that must be kept apart (info vs. use, content vs. vehicle, etc.).
          *   Flag incompatible requirements (the "impossibility triangle" suspicion).
          *   Identify the single most exclusionary requirement.
          *   Briefly evaluate three account types (Interventionist, Informational/Teleological, Deflationary) against the list.
      *   **Tone:** Rigorous, philosophical but grounded in mechanistic interpretability, suitable for a theoretical paper section.

  2.  **Deconstruct the Purpose:**
      *   The core purpose is *inferential license*. If I say "The model represents $p$," I need to be able to predict what the model will do or how to change it.
      *   This leans heavily towards *functionalism* and *interventionism*. It's not just about what's "in there" (ontology); it's about what that claim *does* for us (utility/prediction).
      *   "Auditable standard" implies robustness, reproducibility, and non-triviality.

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Candidate 1: Causal Necessity.* If I remove the representation, the behavior should change.
          *   *Motivation:* The test case shows zeroing the direction does *nothing*. If representation implies causal role, this is a problem.
          *   *Status:* Non-negotiable for the stated purpose (prediction/intervention). If it doesn't cause behavior, claiming it represents something doesn't help predict behavior.
          *   *Nuance:* Maybe "necessity" is too strong given redundancy. Maybe "counterfactual dependence" is better. But for an auditor, if I claim $X$ represents $p$, and removing $X$ changes nothing, my claim is useless for intervention. Let's mark it Non-negotiable but note the redundancy caveat.

      *   *Candidate 2: Causal Sufficiency.* If I inject the representation, the behavior should occur.
          *   *Motivation:* The test case shows adding the vector *does* flip answers.
          *   *Status:* Non-negotiable for intervention. If I can't induce the behavior by inducing the representation, the link is weak.
          *   *Nuance:* Context matters. It shouldn't break everything else.

      *   *Candidate 3: Robustness/Stability.* The representation shouldn't vanish with a prompt change.
          *   *Motivation:* The probe is stable across templates.
          *   *Status:* Non-negotiable. If it's prompt-specific, it's not a model property, it's a context property.

      *   *Candidate 4: Locality/Identifiability.* Can we point to *where* it is?
          *   *Motivation:* The SAE splits the direction. Is the representation the direction or the SAE features?
          *   *Status:* Preference (Feature-level locality). The purpose is intervention. If I can't locate it, I can't intervene precisely. However, superposition makes strict locality hard. Let's call it a "Preference for Operational Identifiability."

      *   *Candidate 5: Human-Legibility.* Can a human state $p$?
          *   *Motivation:* The gloss is "is-in-France".
          *   *Status:* Preference. Alien concepts might exist. But for the *paper's purpose* (licensing inferences for humans), we need to map it to human concepts. Let's mark as Preference (Human-legible content).

      *   *Candidate 6: Distinction: Information vs. Use.*
          *   *Motivation:* Zeroing did nothing (info present, not used?). Adding worked (info sufficient).
          *   *Status:* Non-negotiable distinction. An account must explain why info exists but isn't causally efficacious in the baseline.

      *   *Candidate 7: Distinction: Content vs. Vehicle.*
          *   *Motivation:* The vector vs. the meaning.
          *   *Status:* Non-negotiable.

  4.  **Addressing the "Impossibility Triangle" (Necessity, Sufficiency, Locality):**
      *   The prompt suspects these three can't hold together given superposition/redundancy.
      *   *Analysis:* In the test case:
          *   Sufficiency holds (adding flips answers).
          *   Locality is shaky (SAE splits it).
          *   Necessity fails (zeroing does nothing).
      *   *Resolution:* To serve the *purpose* (intervention), Sufficiency is key. Necessity is key for explanation. Locality is key for mechanistic understanding.
      *   *Conflict:* If representations are distributed (redundant), strict locality fails. If redundant, strict necessity fails (because other paths compensate).
      *   *Verdict:* The suspicion is correct. You cannot have strict Locality + strict Necessity + Sufficiency in a robust, redundant network.
      *   *Weakening:* Necessity must be weakened to "Non-redundant contribution in specific contexts" or "Counterfactual dependence under isolation." Or, Locality must be weakened to "Subspace" rather than "Direction/Feature."
      *   *Decision:* For the *auditor* purpose, **Causal Sufficiency** is the strongest lever for intervention. **Causal Necessity** is required for explanation but must accommodate redundancy. **Locality** is the most likely casualty.

  5.  **Identifying the Most Exclusionary Requirement:**
      *   Which one kills the most theories?
      *   *Causal Necessity (strict)* kills purely informational accounts (passive encoding).
      *   *Causal Sufficiency* kills accounts that rely on holistic context only.
      *   *Robustness* kills overfitted probes.
      *   *Winner:* **Causal Necessity (with a redundancy clause)**. Many accounts (especially purely informational/decodability) fail here. They say "if you can read it, it's there." The test case shows you can read it (96% probe), but removing it does nothing. An account that ignores this fails the "intervention" purpose.

  6.  **Evaluating the Three Account Types:**
      *   *Interventionist:* Fits well. Focuses on the adding/zeroing results. Struggles with the zeroing failure (might deny representation exists if no effect).
      *   *Informational/Teleological:* Fits the probe accuracy. Struggles with the zeroing (info present but causally inert). Teleology might explain *why* it's there (training history) even if currently redundant.
      *   *Deflationary:* "Representation" is just a shorthand for weight functions. Avoids the metaphysics. Might dissolve the problem but fails the "licensing inferences" purpose if it refuses to reify the state.

  7.  **Refining the List & Structure:**
      *   Organize by: Core Functional Requirements, Structural/ontological preferences, Distinctions to maintain.
      *   Ensure the Test Case is referenced to motivate each.
      *   Check the "Non-negotiable vs. Preference" tagging.
      *   Ensure the "Incompatibility" section is clear.

  8.  **Self-Correction/Review during drafting:**
      *   *Critique:* Did I address the SAE finding enough?
      *   *Fix:* Ensure the "Locality" desideratum explicitly mentions the tension between linear probes and sparse features.
      *   *Critique:* Is the purpose clear?
      *   *Fix:* Reiterate the "Auditor Standard" in the intro to the list.
      *   *Critique:* Did I answer the specific question about which distinctions must be kept apart?
      *   *Fix:* Make a dedicated section for "Required Distinctions."
      *   *Critique:* The prompt asks for a verdict on what an adequate account is *obliged* to deliver regarding the case, not a verdict on the case itself.
      *   *Fix:* Phrase it as: "An adequate account must explain why X holds while Y fails," rather than "The model does/doesn't represent France."

  9.  **Final Polish:** Check tone (academic, precise). Ensure all constraints of the prompt are met (paragraph limits for the final section, specific tagging of requirements).

  *(Self-Correction on the "Impossibility Triangle"):* The prompt asks if the suspicion is correct. I need to be decisive. Yes, strict versions are incompatible. One must yield. Given the *purpose* (intervention), Sufficiency is paramount. Necessity is secondary (due to redundancy). Locality is a methodological hope, not a metaphysical necessity.

  *(Self-Correction on "Most Exclusionary"):* Causal Necessity is the big filter. Decodability accounts pass easily. Causal accounts fail if they demand strict necessity without redundancy handling.

  *(Final check on the 3 account evaluations):* Keep them tight. One paragraph each.

  10. **Drafting the response.** (Proceeds to generate output based on these thoughts).
answer: |-
  ### Desiderata for an Account of Neural Representation

  The following specification fixes the adequacy conditions for an account of representation-attribution. The governing constraint is **inferential license**: the account must support robust predictions and interventions regarding model behavior sufficient to satisfy a skeptical external auditor. It is not enough that the account be metaphysically pleasing; it must be operationally cashable.

  #### I. Core Functional Requirements
  These requirements are **Non-Negotiable**. Failure to meet them renders the account incapable of serving the stated purpose (licensing interventionist inferences).

  1.  **Causal Efficacy (The Intervention Constraint)**
      *   **Specification:** Attributing a representation $R$ with content $p$ must entail that manipulating $R$ (holding context constant) systematically alters the behavioral outputs associated with $p$.
      *   **Motivation:** The test case shows that adding the "is-in-France" vector flips answers (sufficiency), but zeroing it does not (necessity failure). An account that ignores the zeroing result fails the auditor standard: if I claim the model uses this representation to answer, but removing it changes nothing, my claim licenses false interventionist predictions.
      *   **Status:** **Non-Negotiable.** (Note: This requires handling redundancy; see *Incompatibilities* below).

  2.  **Robustness (The Stability Constraint)**
      *   **Specification:** The attribution must hold across variations in surface form (prompt templates, phrasing) that do not alter the semantic task, and must persist under minor fine-tuning or weight perturbation that preserves capability.
      *   **Motivation:** The probe in the test case is stable across three templates. If the representation vanished under a fourth template, it would be a artifact of the prompt rather than a property of the model's internal state. An auditor requires the representation to be a property of the *system*, not the *input*.
      *   **Status:** **Non-Negotiable.**

  3.  **Operational Identifiability (The Location Constraint)**
      *   **Specification:** The account must specify *where* in the computational graph the representation resides sufficiently precisely to allow targeted intervention.
      *   **Motivation:** The test case contrasts a linear direction (Layer 14 residual) with SAE features (distributed components). If an account cannot distinguish between the vehicle (the vector) and the mechanism (the features), it cannot guide engineering.
      *   **Status:** **Non-Negotiable** (for the purpose of intervention), though the *granularity* of identification is a preference (see below).

  #### II. Structural Preferences & Load-Bearing Assumptions
  These are **Preferences** associated with specific research programs. An account may fail these and remain adequate, provided it compensates elsewhere to meet the Core Requirements.

  4.  **Feature-Level Locality**
      *   **Specification:** Representations should map to individual neurons or sparse autoencoder (SAE) features rather than dense, overlapping subspaces.
      *   **Motivation:** The SAE finding in the test case (polysemanticity of the linear direction) suggests the "true" representation might be the sparse features, not the probe direction.
      *   **Status:** **Preference (Mechanistic Interpretability Camp).** Dense subspace accounts can meet Causal Efficacy without strict locality.

  5.  **Linearity**
      *   **Specification:** Representations should be manipulable via linear arithmetic (addition/subtraction of activation vectors).
      *   **Motivation:** The test case shows linear addition works (sufficiency), but zeroing (linear subtraction) fails.
      *   **Status:** **Preference (Linear Representation Hypothesis).** Non-linear manifolds can satisfy Causal Efficacy if the intervention method is adjusted.

  6.  **Human-Legible Content**
      *   **Specification:** The content $p$ must be statable in natural language (e.g., "is-in-France").
      *   **Motivation:** Auditors need to understand the claim. However, the model may represent alien concepts.
      *   **Status:** **Preference (Human-Centric Alignment).** An account could allow "latent content" not fully translatable to English, provided the behavioral predictions remain precise.

  7.  **Completeness**
      *   **Specification:** The account should explain the representation's role in *all* relevant behaviors, not just a local subset.
      *   **Motivation:** The direction might drive QA but not translation.
      *   **Status:** **Preference.** Local validity is sufficient for local intervention; global completeness is ideal but not strictly required for the auditor standard.

  #### III. Required Distinctions
  An adequate account must structurally distinguish the following pairs. Collapsing them is **Fatal** to the account's utility.

  1.  **Information Presence vs. Causal Use**
      *   **Reasoning:** The test case demonstrates high probe accuracy (information present) but null ablation effects (no causal use in baseline). An account that equates decodability with representation cannot explain why zeroing the direction leaves behavior indistinguishable from baseline. It must distinguish *encoding* from *deployment*.
  2.  **Content vs. Vehicle**
      *   **Reasoning:** The "is-in-France" meaning (content) is distinct from the Layer 14 residual direction (vehicle). Confusing them prevents understanding how the same content might be implemented differently in Layer 15 or a different model.
  3.  **Representing-That vs. Representing-As**
      *   **Reasoning:** The model may represent *that* a location is in France (propositional) versus representing the location *as* French (feature-binding). The intervention (flipping answers) suggests the latter might be more accurate. Collapsing these leads to incorrect predictions about error modes.
  4.  **Decodability vs. Functional Role**
      *   **Reasoning:** A downstream probe can decode information that the model itself does not use for its primary task. An account must explain why the probe succeeds where the ablation fails.

  #### IV. Incompatibilities and Trade-offs
  **The Impossibility Triangle:** Your suspicion is correct. **Strict Causal Necessity**, **Strict Causal Sufficiency**, and **Strict Locality (Monosemanticity)** cannot be jointly satisfied in systems exhibiting superposition and redundancy.
  *   **Conflict:** The test case exhibits Sufficiency (adding works) and fails Necessity (zeroing fails). The SAE result suggests Locality is complex (the linear direction is not the atomic feature). If a representation is distributed (redundant), removing one component (Necessity) will not change behavior. If it is superposed (non-local), isolating it for Sufficiency interventions becomes noisy.
  *   **Resolution:** To serve the **Auditor Purpose**, **Causal Sufficiency** must be prioritized over Strict Necessity. We must weaken Necessity to: *"The representation is a non-redundant contributor within a specific causal path, identifiable via isolation."* We must weaken Locality to: *"Identifiable within a bounded subspace,"* accepting that atomic features may be distributed. If you demand strict Necessity, you will conclude the model does not represent "is-in-France" in the baseline, which contradicts the Sufficiency finding and limits interventionist leverage.

  **The Most Exclusionary Requirement:** **Causal Efficacy (specifically the Necessity Clause).**
  *   **Why:** This excludes purely **Informational/Decodability Accounts**. These accounts claim that if a linear probe can read $p$ from activations, the model represents $p$. The test case falsifies this for the auditor's purpose: the probe reads "is-in-France" (96%), but the model behaves as if that information is causally inert (zeroing does nothing). An account that ignores this cannot license interventions. It excludes any theory that treats representations as passive readouts rather than functional drivers.

  #### V. Obliged Verdicts on the Test Case
  An adequate account is not required to say "Yes, it represents France" or "No, it doesn't." It is required to deliver a **structured diagnosis** of the divergence in findings:
  1.  **Explain the Null Ablation:** Why does zeroing the direction fail to alter behavior despite high probe accuracy? (e.g., redundancy, compensatory pathways, or the direction being a readout artifact rather than a causal vehicle).
  2.  **Explain the Positive Injection:** Why does adding the vector succeed? (e.g., the downstream mechanism is sensitive to this subspace even if the upstream path doesn't strictly require it).
  3.  **Explain the SAE Split:** Are the SAE features the "true" representations, and the linear direction merely their sum? If so, why does the sum support sufficiency interventions while the parts do not support necessity interventions?

  #### VI. Evaluation of Existing Account Types

  **Interventionist Accounts** fare best against the **Causal Efficacy** requirement. By tying representation directly to the results of activation manipulations (like the vector addition in the test case), they naturally license the required inferences. However, they struggle with the **Null Ablation** finding. A strict interventionist might have to deny the representation exists in the baseline because removing it changes nothing, which seems counterintuitive given the probe accuracy and injection success. They must adopt a counterfactual theory of causation that handles overdetermination to avoid this verdict.

  **Informational or Teleological Accounts** handle the **Probe Accuracy** well but fail the **Auditor Standard**. An informational account (representation = mutual information) validates the "is-in-France" claim based on the 96% probe score but cannot explain why zeroing the signal leaves behavior unchanged. A teleological account (representation = selected function) might argue the feature exists for training reasons even if currently redundant, but this makes weak predictions for *current* interventions. They distinguish Information from Use well but lack the leverage to predict behavioral changes.

  **Deflationary Accounts** (representation = useful fiction for weight functions) dissolve the tension by denying the ontology. They argue there are no "representations," only weights and activations. While this avoids the contradiction, it fails the **Purpose** entirely. It cannot license inferences from "the model represents $p$" because it denies the premise is meaningful. It offers no vocabulary for the auditor to request specific behavioral modifications based on semantic content, rendering it inadequate for the stated goal.
