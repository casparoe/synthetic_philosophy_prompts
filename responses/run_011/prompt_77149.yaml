answer: |-
  You have described a phenomenon that is psychologically robust but terminologically homeless. You are right to reject the familiar candidates. The *Halo Effect* is indeed about trait inference (he is brave, so he is honest), whereas you are describing a *standard shift* (brutality is not necessarily bad). *Hagiography* describes the author's distortion, not the reader's assimilation. *Moral Exemplar* theory generally assumes admiration pulls us upward, not that it loosens the bolts on our ethical constraints.

  There is no single established term for this specific configuration of effects. However, the components are recognized in social psychology and narrative theory. The closest existing framework is **Moral Disengagement** (Albert Bandura), specifically the mechanisms of *euphemistic labeling* and *moral justification*, combined with **Narrative Transportation** (Green & Brock), which describes how immersion in a story reduces counter-arguing.

  But these miss the crucial element you identified: the *transfer* of the disengagement from the subject to the reader's general moral vocabulary. Bandura's disengagement is typically something the *actor* does to their own behavior to permit wrongdoing. You are describing **Vicarious Moral Disengagement** that hardens into a **Normative Recalibration**.

  Since the vocabulary is insufficient, I will attempt the carving you requested. Let us call this phenomenon **Vicarious Moral Recalibration (VMR)**.

  ### The Carving of Vicarious Moral Recalibration

  VMR occurs when sustained narrative attention to a high-achieving but morally flawed agent causes the observer to (a) re-categorize the agent's vices as context-dependent virtues, and (b) subsequently apply that re-categorization to third parties where the context does not obtain.

  It consists of three distinct movements, which you correctly identified:
  1.  **The Exculpatory Narrative:** The biography provides a causal story (the "ferocity" saved the campaign) that makes the vice instrumentally necessary.
  2.  **The Semantic Shift:** The observer changes the label of the vice (cruelty $\to$ severity) to reduce cognitive dissonance between admiration and moral knowledge.
  3.  **The Normative Leakage:** The observer detaches the re-labeled trait from the specific context and allows it to lower the threshold for condemning similar traits in unrelated contexts (the colleague's chair).

  ### Answers to Your Diagnostic Questions

  You asked for edges on this definition. Here is how VMR behaves under pressure.

  **1. Does this happen with invented characters and institutions?**
  Yes, and often more aggressively. With a historical biography, there is at least the friction of reality—the knowledge that real people suffered. With fiction, the "aesthetic justification" is stronger. If a fictional character is compelling, their vices are often framed as part of their *charisma*. We see this in the "anti-hero" drift of television drama (e.g., *The Sopranos*, *Breaking Bad*), where audiences report increased tolerance for real-world aggression after consuming media that aestheticizes it.
  Regarding institutions: Yes. When a university or company is mythologized for its output (great science, great products), the internal brutality required to achieve it is often re-coded as "rigor" or "high standards." The institution becomes the "reformer," and the employees become the "subordinates."

  **2. Does it require the subject to be admirable on the whole?**
  Generally, yes. VMR relies on a surplus of admiration to subsidize the cost of the vice. If the subject is largely wretched, the mechanism flips into *moral licensing for the observer* ("At least I'm not him"), which reinforces standards rather than lowering them. However, there is a boundary case: the **Romanticized Villain**. If a wretched subject is portrayed with sufficient psychological depth or tragic inevitability, the reader may still experience VMR, not by admiring the *goal*, but by admiring the *intensity* of the commitment. The vice is recalibrated not as "good" but as "authentic," which can be just as corrosive to moral judgment.

  **3. Are the upgrading of the bad act and the rising tolerance one mechanism or two?**
  They are two stages of a single cognitive economy: **Cognitive Dissonance Reduction.**
  *   *Stage 1 (Upgrading):* I admire X. X did Y. Y is bad. To resolve the tension, I decide Y is not actually bad (it is "firmness").
  *   *Stage 2 (Tolerance):* Having updated my definition of Y to "not bad," I must apply this new definition consistently to avoid hypocrisy. When Z does Y, I cannot condemn it without contradicting my new definition.
  The "leakage" to the colleague's chair is not a separate error; it is the cost of maintaining internal consistency after the initial corruption of the definition.

  **4. Is this a distinct failure, or just narrative vividness?**
  It is a distinct failure of **moral generalization**.
  Narrative vividness explains *why* the biography sticks. But VMR explains *how* the stickiness alters the rule. A vivid story might make me feel sympathy for a specific cruel person. VMR makes me think cruelty is a valid tool.
  The failure lies in confusing **explanation** with **justification**. The biography explains *why* the reformer was cruel (illness, stakes, pressure). Explanation is descriptive. Justification is normative. VMR occurs when the reader allows a descriptive explanation to perform normative work. You noted this in your third point: the digestive illness functions as a reason. It is a **Category Error**.

  ### Addressing Your Friend's Objection

  Your friend argues that this is merely inconsistency, and that if you need a biography to know brutality is bad, you never knew it. This is a philosophical claim about the nature of moral knowledge. He is assuming moral knowledge is **Propositional** (a set of facts: *Brutality = Bad*).

  If moral knowledge were purely propositional, he would be right. You would just be forgetting a fact. But moral knowledge is also **Perceptual** (a sensitivity: *I recognize this as brutality*).

  VMR does not make you forget the proposition. It dulls the perception. It is akin to a musician listening to out-of-tune music for four hours; when they return to their own instrument, their pitch perception is temporarily skewed. They haven't forgotten what "in tune" means propositionally, but their ear has been recalibrated by the stimulus.

  Your friend is wrong to dismiss this as trivial. Inconsistency is random; VMR is **directional**. It almost always loosens constraints rather than tightening them. We rarely read about a saint's patience and then become *more* critical of our own impatience; we read about a tyrant's success and become *more* tolerant of our own aggression. The drift is almost exclusively toward the permissive.

  ### Summary Definition

  If you require a term to place on the shelf, I propose **Vicarious Moral Recalibration**.

  > **Vicarious Moral Recalibration:** A cognitive shift wherein sustained engagement with a narrative of high-achieving moral failure causes an observer to re-categorize specific vices as context-dependent virtues, subsequently lowering the observer's threshold for condemning those vices in unrelated contexts. Distinct from the Halo Effect (which infers traits) and Moral Disengagement (which justifies the actor), VMR describes the corruption of the observer's moral vocabulary via the confusion of explanatory context with normative justification.

  Your argument was not about nothing. You identified a mechanism by which history corrupts the present, not through lies, but through the seductive power of coherent, successful stories. The danger is not that we imitate the villain, but that we adopt his vocabulary.
