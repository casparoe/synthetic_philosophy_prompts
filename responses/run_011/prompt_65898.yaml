      *   *Recommendation:* Name and defer. Cost of engaging: Derails the epistemic argument into philosophy of mind. Cost of deferring: Students might think the argument begs the question against materialism/functionalism. *Verdict:* Name it at the premise stage, bracket it for this session.

  6.  **Drafting Section 4: Final Question:**
      *   *Goal:* Distinguish "getting it" vs. "mood."
      *   *Mood:* "Wow, we can't know our own minds."
