      *   User's List: 1. Degrees-of-belief, 2. Surprise Examination, 3. Actual limits vs. Nature of Knowledge.
      *   My analysis: 1 & 2 are good to bracket. 3 is dangerous to bracket. If I bracket "Actual limits vs Nature," I invite the "Empirical/Calibration" misconception. I must advise *against* bracketing #3, or at least treating it very carefully. Actually, Williamson's argument *does* rely on the nature of knowledge (safety), not just human physiology. If I bracket the distinction, students will think it's just about human physiology. So I must tell the user *not* to bracket #3, or to handle it explicitly. I will advise that #3 must be *open*, not bracketed.

      *(Refining the "In a Position to Know" dependency)*: Why can't it be deferred? Because the Margin for Error premise looks false if "know" means "actually knows." It only looks plausible if "know" implies "safe from error," which is tied to the IPK gloss in the definition of luminosity. If I define Luminosity as "If C, then I know C," students will say "But in the middle case I *do* know C." The argument requires "If C, then I am *in a position to* know C," where IPK entails that if I were to judge, I wouldn't be wrong. The safety condition applies to the *capacity*.

