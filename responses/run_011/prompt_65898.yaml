      *   *Sorites Disguise:* Head off at the *setup of the series*. Emphasize this is about *knowledge conditions*, not truth conditions.
      *   *Empirical/Calibration:* Head off at the *Margin for Error Premise*. This isn't about current human limits; it's about the *nature* of knowledge (safety). Even a perfect being with finite discrimination steps would face this.
