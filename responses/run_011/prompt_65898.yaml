      *   *Degrees of Belief:* Williamson has a probabilistic version. Too technical for 110 mins with uneven background. *Loss:* Nuance on how confidence tracks safety.
      *   *Surprise Examination:* Connected via iteration principles. *Loss:* Fun connection, but distracting.
