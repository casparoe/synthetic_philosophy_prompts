answer: |-
  The term you are looking for is **Procedural Exculpation**.

  This is a coinage, but it is necessary because existing terms like "organized irresponsibility" are too macro-sociological, while "moral crumple zones" incorrectly imply a specific human victim of blame. Procedural Exculpation defines the specific mechanism you identified: a governance structure where adherence to predefined processes constitutes sufficient moral and legal clearance for agents, irrespective of harmful outcomes. It fits your cases because it isolates the *fidelity to process* as the variable that correlates with *immunity from blame*. In your AV and weapon system examples, the safety case, audit log, or review board functions not as a tool to assign responsibility, but as a certificate of innocence; the more perfectly the procedure is executed, the stronger the shield against liability becomes, even if the outcome is fatal.

  The boundary cases strain the definition where the procedure is ignored. If a supervisor fails to escalate or an engineer bypasses a checklist, Procedural Exculpation does not apply; that is standard negligence. The phenomenon exists only when the system works as designed. Regarding benignity: yes, such a regime can be benign, but only conditionally. It is benign when the procedure successfully prevents harm, making the exculpation justified by the safe outcome. It becomes malignant only when harm occurs *despite* compliance, yet the compliance still blocks blame. The danger is not the procedure itself, but the structural assumption that procedural fidelity guarantees moral safety.

  You have slightly over-described the pattern by assuming the responsibility gap is necessarily widened by this machinery. In some instances, these regimes do not relocate the gap but dissolve the expectation of individual blame in favor of collective liability, which may be a coherent ethical stance rather than a failure. However, your intuition holds where the machinery is used to simulate accountability without enabling recourse for victims. The critical test for Procedural Exculpation is whether the regime allows for outcome-based liability when process-based safety fails; if the answer is no, the regime is not just accountable, it is exculpatory.
