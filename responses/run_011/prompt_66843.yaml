answer: |-
  **Project Title:** Boundaries of Mind: Interventional Adequacy and the Individuation of Collective Agents

  **The Question**
  The standard question—"Do ant colonies have minds?"—is ill-posed because it presupposes a fixed subject. My project asks a determinate alternative: **Under what spatial-temporal boundaries does attributing mental predicates to a collective yield maximal predictive and interventional leverage?** This shifts the debate from metaphysical status to operational utility. If a boundary is genuine, modeling the system within that boundary as a unified agent should outperform models that treat components individually or the collective as part of a larger whole.

  **Theoretical Landscape**
  Current positions fail because they assume boundaries are given. The **checklist approach** (integration, memory, learning) tests capacities but cannot specify *which* system possesses them. **Deflationists** dismiss colony talk as metaphor precisely because boundaries are fluid, but this ignores that fluidity is a feature, not a bug, of the system. **Strong-emergence** accounts posit distinct levels of description without providing criteria for drawing the lines between them. **Information-integration measures** (e.g., Phi-like metrics) require predefined nodes and networks, begging the individuation question. Finally, **group-agent theories** assume functional organization settles the matter, overlooking cases where functional unity persists across physically disjoint or merging systems. All these views treat the colony as a static container rather than a dynamic process requiring identification.

  **Methodology**
  I will develop the criterion of **Interventional Adequacy**: a boundary marks a genuine subject if interventions framed at that level remain stable under perturbation of parts, and predictions using that boundary compress information better than finer or coarser grains.

  *   **Months 1–3:** Conceptual formalization. I will refine Interventional Adequacy using literature on causal modeling and system identification. The goal is a rigorous definition of "predictive leverage" that avoids circularity.
  *   **Months 4–6:** Static boundary cases. I will apply the criterion to published tracking data and case studies regarding single nests, polydomous colonies (one colony, multiple nests), and supercolonies (multiple nests, no aggression). The task is to determine if the "colony" boundary outperforms the "nest" or "population" boundary in predicting foraging outcomes or defensive responses.
  *   **Months 7–9:** Dynamic boundary cases. I will focus on fission and fusion. These are naturalized analogues to philosophical thought experiments on personal identity (e.g., fission cases). I will model whether identity predicates persist through splitting events based on interventional stability rather than continuity of matter.
  *   **Months 10–12:** Synthesis. I will draft the core argument and assess implications for human personal identity. If colony boundaries are earned via interventional adequacy, human psychological continuity may be similarly boundary-relative.

  **Why This Approach**
  Adopting existing information-theoretic measures fails because they require fixed nodes; my project determines the nodes themselves. Accepting the biologist's **superorganism criterion** (usually reproductive unity) is insufficient because reproductive boundaries do not necessarily align with cognitive or agentive boundaries. A supercolony may be reproductively fragmented but behaviorally unified, or vice versa. My approach isolates the *agentive* boundary specifically, which is required for mental attribution.

  **Outcomes and Failure Modes**
  Success looks like a formal criterion that distinguishes between a mere aggregation of ants and a unified subject without relying on intuition. It would provide a naturalized account of personal identity grounded in observable biology.

  Two failure modes are critical. First, **triviality**: if any boundary can be shown to outperform neighbors on *some* chosen measure, the criterion is vacuous. I will guard against this by requiring stability across multiple intervention types (foraging, defense, relocation). Second, **redundancy**: if biology has already settled the boundary question (e.g., if reproductive unity always matches agentive unity), the philosophical work is unnecessary. I will test this against polydomous and supercolony cases where boundaries demonstrably diverge.

  **Note for the Physicist and Engineer**
  To the physicist and engineer: this is not metaphysics wearing a lab coat. It is a system identification problem. When you build a swarm or model a phase transition, you must define the control volume. If you draw the box too tight, you miss global constraints; too loose, and you introduce noise. This project asks where the "control box" should be drawn to maximize predictive compression and control stability. It treats "mind" not as a ghostly substance but as a level of description that earns its keep through robust input-output modeling.

  **Scope and Vulnerabilities**
  In twelve months, I can formalize the criterion and test it against existing biological case studies. I cannot generate new empirical data. I must hedge on the human analogy; while the structural parallel is strong, extending the conclusion to human personal identity is a secondary aim that may need cutting if the primary biological argument requires more space.

  **Vulnerabilities**
  I invite the committee to challenge the project on these points:
  1.  **Operationalization:** Can "predictive leverage" be defined without smuggling in the very intuitions about agency the project seeks to ground?
  2.  **Function vs. Mind:** Even if a boundary maximizes control, does that justify *mental* predicates, or merely functional unity? The leap from "effective system" to "subject of experience" remains the hardest philosophical hurdle.
  3.  **Data Availability:** Existing ecological data may not be granular enough to test interventional stability without new experiments, which are outside the fellowship's scope.
