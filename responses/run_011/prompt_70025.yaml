answer: |-
  **JOINT MEMORANDUM ON CRITERIA AND METHOD**
  **TO:** The Prize Committee
  **FROM:** The Undersigned Jurors
  **SUBJECT:** Framework for Deliberation regarding the Shortlist

  **PREAMBLE**
  We, the undersigned, acknowledge that our deliberations have reached a point of structural impasse. This is not due to a failure of attention or goodwill, but to a foundational divergence in how we conceive the act of judgment itself. To prevent the final vote from becoming merely theatrical, we submit this document to clarify where we stand together and where we stand apart. This document does not resolve the dispute; it maps it.

  ### I. AGREED PROPOSITIONS
  *The following claims are signed by both parties without reservation.*

  1.  **The Primacy of Sentiment:** Reason alone cannot establish aesthetic value. All judgment begins with a feeling of pleasure or displeasure. Any standard that ignores the actual experience of the reader in favor of abstract rules is dead.
  2.  **The Reality of Variability:** Verdicts on the same work vary across time, culture, and individuals. This variability is data, not noise. Any viable theory of judgment must account for why two attentive readers can love and hate the same text without one necessarily lying or failing to read.
  3.  **The Function of a Standard:** Whether discovered or constructed, a "standard of taste" is required to distinguish judgment from mere preference. Without it, the prize is a lottery; with it, the prize is a claim about the work.
  4.  **The Status of the Three Cases:** We accept the following three scenarios presented during this jury as genuine problems, not rhetorical tricks:
      *   *The Fragment:* The posthumous manuscript assembled by an editor is the object before us. We agree its ontological status is unstable.
      *   *The Attribution:* The divergence in ratings based on authorial identity (Nobel vs. Unknown) is a factual record of this jury's ecosystem.
      *   *The Split:* Two jurors of equal record and articulation can rank the same work first and last.
  5.  **The Goal of Deliberation:** The purpose of this jury is not to aggregate private preferences but to produce a public warrant. We are not counting heads; we are testing reasons.

  ### II. TABLE OF IRREDUCIBLE DISAGREEMENTS
  *For each crux, the formulations below represent the strongest version of each position, as endorsed by its holder. The "Shared Case" refers to the specific plot elements (Fragment, Attribution, Split) that bear on the crux.*

  | Crux | The Humean Formulation | The Contextualist Formulation | Shared Case / Argument | Prediction (Recorded Prior to Vote) |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. The Nature of Delicacy** | Delicacy is a two-place relation between a judge and features of a work. It is a capacity to detect small parts and their composition. It is corrigible: one can be wrong about what one feels if one's perception is coarse. | Delicacy is a stable disposition to be pleased, indexed to a specific psychology and training history. It is not "detection" but "resonance." To call it corrigible implies a target outside the psychology that does not exist. | **The Split:** Two qualified jurors rank the work oppositely. | **Humean:** One juror has missed a structural feature (e.g., the editorial seams).<br>**Contextualist:** Both have registered the work correctly relative to their distinct constituencies. |
  | **2. Identifying the True Judge** | True judges are identified by independent criteria: strong sense, unprejudiced, practised, comparative. These traits can be verified before we look at their verdicts. Their agreement confirms the standard. | True judges are identified retrospectively by their agreement with the canon. The traits (sense, practice) are defined by the very institutions that confer the title. The standard is constituted by the judges, not confirmed by them. | **The Attribution:** Ratings diverge based on prestige. | **Humean:** The panel rating the "Nobel" text higher is corrupted by prejudice.<br>**Contextualist:** The "Nobel" text literally possesses more value in that context; the property is socially constituted. |
  | **3. Prejudice vs. Constitution** | Prejudice is a distortion that can be stripped away. It is external to the work (e.g., bias about the author's gender, fame, or era). Removing it reveals the work's actual capacity to please. | The demand to be "cleared of prejudice" is question-begging. It defines the "true judge" as one who agrees with us. Context (fame, era) is not a distortion; it is the medium in which the work exists. | **The Attribution:** Does knowing the author change the *object* or the *viewer*? | **Humean:** If we blind the text, the ratings will converge.<br>**Contextualist:** If we blind the text, we are judging a different object (a fragment without history). |
  | **4. Endurance and Testimony** | That works please across centuries and climates is evidence of uniform principles of human nature. Testimony of the past guides us, but we must still feel the pleasure ourselves to verify it. | Endurance is a record of who held power, not what is universally pleasing. Relying on testimony contradicts the requirement to judge from one's own acquaintance; it substitutes authority for sentiment. | **The Fragment:** Is the "work" the notes or the edited book? | **Humean:** The edited book is a defect if it hides the fragments; we must judge the author's intent.<br>**Contextualist:** The edited book is the only object available; its assembledness is a fact, not a defect. |
  | **5. The Object of Judgment** | The object is determinate. If the text is fragmented, that is a defect in the *work*, not a fact about the *object*. We judge the art, not the accident of survival. | The object is indeterminate. The "assembledness" is a property of the text before us. To wish it were otherwise is to wish for a different book. We judge the artifact, not the ghost. | **The Fragment:** Posthumous manuscript. | **Humean:** We must penalize the incoherence caused by the editor.<br>**Contextualist:** We must evaluate the coherence achieved by the editor. |

  ### III. FALSIFICATION AND VOTE CONDITIONS
  *What would count as evidence against each view, and what actually changes the vote?*

  **A. Conditions for Falsification**
  *   **The Humean admits error if:** We convene a panel of judges who meet all criteria (sense, practice, no prejudice) and their verdicts remain randomly distributed over time, showing no convergence even on clear cases of mastery vs. failure. If "delicacy" predicts nothing, it is not a faculty.
  *   **The Contextualist admits error if:** We find a convergence of judgment across radically different institutions and power structures that cannot be explained by cultural hegemony or training. If a work pleases equally in contexts where it confers no status and aligns with no ideology, the value is not merely constituted.

  **B. Conditions for Changing a Vote on the Prize**
  *   **Does anything actually change the vote?**
      *   **The Humean:** Will change her vote *only* if it is demonstrated that a specific feature of the text was overlooked due to haste or ignorance (e.g., a structural pattern in the fragments). She will not change her vote based on institutional pressure.
      *   **The Contextualist:** Will change his vote *only* if the institutional stakes change (e.g., if awarding the prize would demonstrably harm the ecosystem of letters or reinforce a harmful monopoly). He will not change his vote based on an appeal to "universal beauty."
      *   **Joint Agreement:** Neither juror will change their vote based on the *Attribution Study* alone. Both agree that knowing the author's name is now part of the jury's condition, and un-knowing it is impossible. The divergence is a fact to be managed, not a mistake to be corrected.

  ### IV. NOTE ON VERBAL DISPUTES
  *For the purpose of the final deliberation, the undersigned acknowledge that we slide between four distinct senses of the claim "Beauty is Objective." We talk past each other when we assume we are using the same sense.*

  1.  **Independence:** Value exists independently of human responses (Realism).
  2.  **Correctness:** There are correctness conditions on responses (Normativity).
  3.  **Convergence:** Qualified responders will agree (Intersubjectivity).
  4.  **Authority:** The verdict binds dissenters who remain unconvinced (Institutional Power).

  **Where the Dispute is Merely Verbal:**
  *   When the **Humean** argues for *Independence*, she is often actually arguing for *Convergence*. She claims value is "in the object" but proves it by pointing to "agreement among experts."
  *   When the **Contextualist** argues against *Independence*, he often defeats *Authority*. He claims value is "made by institutions" but proves it by showing "experts disagree."

  **The Hollow Victory:**
  *   If the **Humean** wins the vote, she secures **Authority** (Sense 4). The prize is awarded. However, if she secures this via a majority vote rather than universal consent among the "true judges," she has failed to demonstrate **Convergence** (Sense 3). Her victory establishes the *power* to name a winner, but not the *truth* of the winner. She wins the prize but loses the standard.
  *   If the **Contextualist** wins the vote, he secures **Independence** (Sense 1) by default. By refusing to award the prize (or awarding it ironically), he treats the work as having a fixed property ("unawardable") that exists regardless of the jury's desire. He inadvertently acts like a realist. He wins the argument but loses the agency.

  **Recommendation for the Chair:**
  Do not ask us to agree on *why* we are voting. Ask us only to certify that our vote is consistent with *one* of the four senses listed above. A verdict is valid if it is internally consistent, even if the grounds are incompatible.

  ***

  **Signed,**

  **[The Humean]**
  **[The Contextualist]**
