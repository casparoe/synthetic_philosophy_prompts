      Title: Beyond the Responsibility Gap: A Transactional Account of Institutional Answerability

      Contemporary AI governance is stalled by the 'responsibility gap'. When autonomous systems cause harm, standard protocols often exonerate developers and operators alike. The prevailing debate asks whether a blameworthy agent exists. This proposal argues that is the wrong question. The deficit is not necessarily a missing culprit, but a broken transaction: the inability of the harmed to address a demand, receive an intelligible answer, and secure a response. I distinguish gaps of locus (nobody to point at) from gaps of discharge (somebody there, but no process to answer). Only the latter constitutes a genuine governance failure. The central research question is: Can institutional capacity for answerability be distinguished from blameworthiness and measured via an ex ante test for transactional discharge?

      Existing responses fail to address this transaction. Proponents of distributed blame argue culpability spreads across networks, solving the gap by locating agency everywhere. However, this addresses attribution, not discharge. A distributed culprit is useless if no single node can process a demand. Strict liability and compensation schemes bypass blame entirely, yet they leave the normative need for explanation unsatisfied. Victims receive funds but no account. Similarly, the 'problem of many hands' describes diffusion but offers no mechanism for reconstitution. It explains why blame is hard to assign, not how to restore the communicative loop.

      Philosophical literature distinguishes attributability (actions reflecting character) from answerability (obligation to give reasons). While this separates blame from reasons, it remains predominantly individualistic. Institutional analogues exist but often conflate having a complaints procedure with having capacity for answerability. My project isolates the structural conditions required for the transaction to complete, regardless of culpability. I am not proposing a new theory of blame, but a metric of institutional readiness. The gap remains even when plenty of people are technically blameworthy, if the loop cannot be completed. Conversely, there is no gap even when nobody is culpable, if the transaction holds.

      Consider an autonomous cargo vessel altering course legally, causing a smaller boat to ground. The flag state, vendor, and operator all followed protocol. Or a hospital triage algorithm deprioritising a patient group, validated per rules, unseen by clinicians. In both, insurers pay, nobody is blamed, yet the family asks: 'Who do I put the question to?' There is no non-arbitrary answer. These are not gaps of locus—entities exist—but gaps of discharge. The entities are present, but the pathway for demand and response is structurally blocked by procedural silos.

      The project proceeds in three phases over nine months. Phase one (months 1-3) conceptualises the locus/discharge distinction, refining the 'transactional' metric against existing responsibility void literature. Phase two (months 4-6) applies this framework to the maritime and clinical cases, mapping where the loop breaks despite procedural compliance. Phase three (months 7-9) synthesises findings into a diagnostic test for institutional capacity. This approach is chosen over two alternatives. First, building a better account of distributed blame. This remains retrospective and punitive, failing to prevent the communicative silence victims face. Second, designing a full oversight regime. This is too prescriptive for a seed fund and risks political deadlock. My approach is diagnostic: it identifies whether an institution *can* answer, prior to designing *how* they should be punished or regulated. It bridges the gap between abstract responsibility theory and concrete compliance mechanisms.

      A successful result is a specifiable test, runnable before deployment, determining if an institution can take and answer a demand about system behaviour. This differs from existing due diligence and audit standards. Audits check procedural compliance against static rules. This test checks dynamic communicative capacity: is there a designated agent empowered to interpret the demand, access the relevant system logic, and authorise a response? It measures the existence of a functional loop, not just a paper trail. It must identify whether the institution possesses the internal authority to bridge the gap between technical output and normative explanation.

      Honesty regarding failure is vital. The project fails if the conditions are satisfied by any organisation with a complaints mailbox, rendering the test trivial. It fails if the test cannot be run ex ante, becoming merely a post-hoc autopsy. Crucially, it fails if the distinction collapses into a relabelling of strict liability, where compensation substitutes for answerability. If the 'transaction' proves indistinguishable from payment, the conceptual pivot offers no governance value. Furthermore, if the locus/discharge distinction proves unstable under scrutiny, the foundational premise collapses.

      This is a nine-month, single-researcher project. There is no budget for fieldwork or empirical data collection. The work is entirely conceptual and doctrinal, relying on publicly available case records and existing regulatory frameworks. The limited scope necessitates a tight focus on the theoretical mechanism rather than broad empirical validation. The output will be a working paper and the proposed diagnostic framework, suitable for further development into larger collaborative grants. By shifting focus from finding a culprit to enabling a conversation, this project offers a pragmatic route through the responsibility gap stalemate.

      \answer{Can institutional capacity for answerability be distinguished from blameworthiness and measured via an ex ante test for transactional discharge?}

