  # Metaontology Seminar: The "Where Do You Actually Stand?" Decision Tree

  **Purpose:** You've been throwing around "realist" and "verbal dispute" like insults. This tree sorts you by what you'd say about concrete cases, not by which -ism you think sounds coolest.
  **Constraint:** Answer the questions in order. If you hit a leaf, stop. No peeking at the labels.

  ### The Tree

  **Node 1:** Take the sentence "There are tables." Is it literally true, or are there only simples arranged tablewise?
  *   **True** → Go to Node 2.
  *   **False (Only Simples)** → Go to Node 6.

  **Node 2:** Is it true simply because of the rules of our language (e.g., "table" just *means* arranged simples)?
  *   **Yes** → **Leaf A: Easy Ontologist**
  *   **No** → Go to Node 3.

  **Node 3:** If we rephrase the claim to describe only the arrangement of particles without using the word "exists," does the disagreement between you and the nihilist disappear?
  *   **Yes** → **Leaf B: Verbalist (Hirsch/Chalmers)**
  *   **No** → Go to Node 4.

  **Node 4:** Does the word "exists" mean something different depending on the context (e.g., math vs. physics vs. everyday talk)?
  *   **Yes** → **Leaf C: Ontological Pluralist**
  *   **No** → Go to Node 5.

  **Node 5:** Is the correct answer to "what exists?" determined by which framework is most useful for us?
  *   **Yes** → **Leaf D: Carnapian**
  *   **No** → Go to Node 7.

  **Node 6:** (From "False" at Node 1) Do organisms (like humans or dogs) exist, or are they also just simples?
  *   **No (Only Simples)** → **Leaf E: Nihilist**
  *   **Yes (Organisms Exist)** → Go to Node 7.

  **Node 7:** Is there a single, objective fact of the matter about what exists that isn't up to us?
  *   **No** → (Return to Leaf D: Carnapian)
  *   **Yes** → Go to Node 8.

  **Node 8:** Does nature itself draw the line between what exists and what doesn't (i.e., is existence a "joint-carving" notion)?
  *   **Yes** → **Leaf F: Structure Realist (Sider)**
  *   **No** (The line is real but not fundamental) → **Leaf G: Organisms-Only Realist**

  ---

  ### The Leaves (And What You're Stuck With)

  *   **Leaf A (Easy Ontologist):** "I believe the existence of tables is as trivial as the truth of 'bachelors are unmarried,' and denying it requires a linguistic mistake."
  *   **Leaf B (Verbalist):** "I believe the nihilist and I agree on all the physical facts and only disagree about how to map the word 'exists' onto them." **[Note: This leaf lumps Hirsch and Chalmers together; the tree cannot separate their semantic vs. conceptual diagnoses without jargon.]**
  *   **Leaf C (Pluralist):** "I believe 'exists' is ambiguous, so the nihilist and I might both be right in different contexts."
  *   **Leaf D (Carnapian):** "I believe asking whether tables exist 'outside' a linguistic framework is a pseudo-question with no theoretical answer."
  *   **Leaf E (Nihilist):** "I believe there are no composite objects whatsoever, not even you or me, only simples."
  *   **Leaf F (Structure Realist):** "I believe there is one privileged meaning of 'exists' fixed by the structure of reality, and most ordinary objects probably don't qualify."
  *   **Leaf G (Organisms-Only Realist):** "I believe composition is a hard fact, but it happens for organisms and not for tables, despite both being arrangements of simples." **[Note: Leaves F and G share every branch from Node 3 to Node 7; they separate only on whether 'structure' or 'common sense' sets the boundary.]**

  ---

  ### The Grid: Diagnosing the Empty Cells

  We can summarize the heavy lifting of the tree with four binary questions. Here is the space of possible views, with the empty cells diagnosed.

  | **Q1: "Tables Exist" True?** | **Q2: Trivial/ Linguistic?** | **Q3: Disagreement Survives Rephrasing?** | **Q4: Single Objective Fact?** | **Occupant** |
  | :--- | :--- | :--- | :--- | :--- |
  | Yes | Yes | N/A | N/A | **Easy Ontologist** |
  | Yes | No | No | N/A | **Verbalist** |
  | Yes | No | Yes | No | **Pluralist / Carnapian** |
  | Yes | No | Yes | Yes | **Structure Realist** |
  | No | N/A | N/A | No | **Carnapian (External)** |
  | No | N/A | N/A | Yes | **Nihilist / Restrictivist** |
  | **No** | **Yes** | **N/A** | **N/A** | **Incoherent** (Can't be true by definition if false) |
  | **Yes** | **No** | **Yes** | **No** | **Unattractive** (Realist about fact, anti-realist about objectivity?) |
  | **No** | **N/A** | **No** | **Yes** | **Undefended** (Verbal dispute about non-existence?) |

  *   **Incoherent:** You cannot claim "Tables exist" is false *and* true in virtue of meaning (unless you mean the sentence is false, which contradicts the meaning claim).
  *   **Unattractive:** Claiming there is a single objective fact but it isn't objective (contradictory) or that the fact exists but isn't fixed by structure or utility (mysterious).
  *   **Undefended:** A view where the nihilist and realist agree on all rephrased claims but still insist there is a hard fact of non-existence. Nobody really argues this; usually, if the rephrasing removes disagreement, the "hard fact" claim drops.

  ---

  ### Stress Test: Rerunning the Tree on "Are There Races?"

  I chose **Race** rather than Holes. Holes behave too much like tables (absences vs. objects). Race introduces social construction, which breaks the "facts held fixed" assumption of the composition debate.

  **How the Leaves Shift:**

  1.  **The Verbalist Leaf (B) Explodes:** In the composition debate, the nihilist and universalist agree on all particle arrangements. In the race debate, the eliminativist ("no races") and the realist ("races exist") often *disagree* on the sociological facts (e.g., whether racial categories track shared experiences or historical power dynamics). Rephrasing without "race" doesn't remove the disagreement because the disagreement is about the *significance* of the facts, not just the bookkeeping. **Result:** Hirsch/Chalmers style verbalism is much harder to sustain here; the leaf becomes empty or collapses into Realism.
  2.  **The Structure Realist Leaf (F) Becomes Controversial:** Sider's "joint-carving" works well for physics (electrons carve nature). For race, claiming nature "carves" racial categories is politically and scientifically toxic. Most Realists about race are *Social* Realists, not *Structure* Realists. **Result:** Leaf F splits. You get "Biological Realist" (mostly empty/defunct) and "Social Realist" (who would answer 'No' to Node 8, as social kinds don't carve nature in the Siderian sense).
  3.  **The Easy Ontologist Leaf (A) Shifts:** For tables, "existence is trivial" is plausible. For races, claiming "races exist trivially" ignores the historical contingency of racial formation. **Result:** Leaf A becomes less plausible; the "triviality" is no longer linguistic, it's political.

  **Verdict on Your Hunch:**
  Your hunch is **correct**. The tree is calibrated for *composition*, where the base-level physical facts are held fixed and the dispute is purely about quantification over those facts.
  *   In **Composition**, the Verbalist (Leaf B) and Structure Realist (Leaf F) are clean distinctions.
  *   In **Race**, the "base facts" aren't fixed (social facts are theory-laden), so Node 3 (Rephrasing) fails to isolate verbal disputes. The tree forces Social Realists into the Carnapian or Organisms-Only leaves because they reject "Structure" (Node 8) but insist on "Objective Fact" (Node 7), a combination the tree treats as "Unattractive" in the grid but is standard for social ontology.

  **Recommendation:** Do not use this handout for social ontology without adding a branch for "Is the fact natural or social?" at Node 7.
