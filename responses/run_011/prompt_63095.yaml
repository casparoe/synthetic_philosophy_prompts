      *Refining the "Noise" argument:* The noise account says RP is subthreshold noise drifting. If the signal encodes *which* button (content), it's not just motor noise. If it encodes *veto*, it's not just motor drift.
      *Refining the "Compatibilist" argument:* They argue conscious control can intervene. If the intervention is predicted, the intervention is determined.
      *Refining the "Confidence":* I need to be very honest. Predicting a *veto* specifically from *pre-urge* data is scientifically very tenuous. I will flag this.

      *Wait, one more check on constraints:* "The subject must be choosing between two options that carry a small real stake." $50 is small enough for IRB, real enough for stakes. "Classifier must be capped at roughly two-thirds accuracy." Included. "Errors look like." Included ("distributed randomly"). "No deception." Included.

