answer: |-
  Recruit 100 participants for a "Distribution Task" where they allocate a $50 endowment between themselves and an anonymous partner, choosing either "Keep All" or "Split Evenly" via button press, with actual payouts mailed post-study to ensure real stakes. Using 256-channel scalp EEG, train a machine-learning classifier on neural data from the four seconds preceding the participant's reported moment of conscious urge. The classifier reaches a capped 66% accuracy in distinguishing "Keep" from "Split" trials, with errors distributed randomly across participants rather than clustering around difficult decisions or specific motor preparations. Crucially, in 15% of trials, participants report an initial urge to "Keep" that they consciously override to "Split" (a veto of the prepared impulse). The same classifier, analyzing the pre-urge window *before* the participant reports any conflict, identifies these upcoming veto-trials with 66% accuracy, distinguishing them from trials where the "Keep" urge is executed, indicating the neural trajectory of the inhibition is set before the conscious experience of choosing to inhibit.

  **Show Your Work**

  This design defeats the noise-accumulation reading because random subthreshold drift explains *when* a threshold is crossed, but it does not naturally encode specific semantic content or meta-cognitive trajectories. A noise account might explain a generic drift toward *any* button press, but it struggles to account for a signal that distinguishes "Keep" from "Split" (value content) and, more critically, distinguishes "Execute Keep" from "Prepare Keep but Veto" (inhibition content) before the subject is aware of the conflict. If the signal were merely motor noise, it should not carry information about the *value* of the choice or the *success* of a future inhibition that hasn't been consciously initiated yet.

  A compatibilist must argue that predictability alone does not undermine control; they would claim that as long as the action flows from the subject's own reasons and psychology, it is free, even if those reasons are neurally detectable in advance. However, this scenario pressures that view by showing that the *intervention* itself (the veto) is causally determined by prior states. If the "Free Won't" is predictable from brain states existing before the conscious reason to veto is weighed, then the conscious reason is an epiphenomenal shadow, not the cause. The case distinguishes "caused" from "bypassed" by showing the action is *caused* by the subject's neural architecture, but the subject's conscious agency is *bypassed* in the sense that the outcome is settled before the conscious deliberation that claims credit for it.

  The single feature doing the work is the **prediction of the veto**. If you delete the content prediction (Keep vs. Split), the deflationist wins: the signal is just motor preparation noise. If you delete the veto prediction, the compatibilist wins: the conscious mind still holds the trump card of intervention. The scenario collapses into standard Libet-style ambiguity if either is removed.

  The strongest counterattack comes from the compatibilist side, arguing for "constitutive luck." They would claim that the neural states predicting the veto *are* the subject's will, just operating faster than introspection. On this view, the prediction doesn't show a lack of freedom; it shows that the subject is a consistent agent whose unconscious processing aligns with their conscious values. This succeeds only if you accept that "freedom" requires no more than actions aligning with one's psychological makeup, regardless of when that makeup determines the outcome. If you require the conscious self to be the *originator* rather than the *witness*, the counterattack fails.

  **Confidence Statement**

  I am moderately confident (about 60%) that this design delivers the philosophical verdicts claimed, assuming the data behaves as described. The logic holds: if a veto is predictable pre-consciously, the "conscious rescue" argument is logically neutralized. However, the step I am least sure of is the **neural feasibility of predicting the veto specifically**. While decoding choice content (Keep vs. Split) from EEG is increasingly plausible, decoding a *future inhibition* of a prepared action from the *pre-urge* window is scientifically tenuous. It assumes a distinct neural signature for "successful future inhibition" exists prior to the conscious conflict, which may not be biologically real. If the veto signal only appears *during* the conscious struggle, the design fails, and the compatibilist escape hatch reopens.
