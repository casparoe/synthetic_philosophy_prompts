prompt: |-
  I'm trying to build an actual checklist — like a spec — for what a cosmology has to deliver on the Boltzmann brain front before it counts as something I can use to make predictions, and every time I read an argument about this I catch the author smuggling in a requirement they'd never state out loud. So write me the desiderata. For each one: what it demands, the situation that motivates it (a semi-concrete scenario, not a slogan), and whether it's non-negotiable or really just the taste of one camp.

  Stuff I know belongs on the list but want sharpened rather than repeated back at me:

  - ratio versus rate. I've seen a theory get a pass because its freak-observer production rate is tiny, with nobody mentioning that the phase producing them goes on forever, so the number is what actually swamps everything. Whatever requirement covers this has to say which of those quantities is the one that matters and why.
  - something about a framework undercutting the evidence that supports it. If a theory says the typical observer with my memories and my data is a fluctuation, what exactly has gone wrong — is the theory false, or true but unusable, or does that distinction collapse here? I want a requirement that makes that question precise, and then I want you to tell me honestly whether that requirement is legitimate or whether its just a thumb on the scale for whichever escape hatch someone already prefers.
  - a robustness condition. I don't want a cosmology that only dodges the problem at parameter values nobody has measured. If the verdict flips depending on an unmeasured decay time or an unmeasured vacuum structure, that should count against it — but I want it phrased so that having unknown parameters isn't automatically fatal, or else nothing passes.
  - the criterion for what counts as an observer. Whatever the theory says about you and me it has to say about the fluctuated ones, and the requirement needs to be written so it can't be dodged with a definition that's rigged to exclude exactly the cases in question.
  - a no-cheating clause. Banning freaks by fiat isn't a solution, but neither is adjusting your cosmology only ever in the direction that happens to save you, and I want those two failures kept seperate in the list.

  Then, on top of the items:

  1. which one is doing the most work at excluding candidates — I suspect it's not the one people lead with.
  2. whether some subset is jointly unsatisfiable. My hunch is you can't have all four of: an eternal low-temperature phase with finite entropy, unitary evolution and the recurrence that buys you, the assumption that I'm a typical draw from the observer distribution, and freak observers being negligible. But I want to know if that's actually airtight or whether one of the four can be weakened without the rest collapsing, and which one is cheapest to give up — and note that whichever you drop is doing the real work in the theory, so it better be stated as a choice and not left implicit.
  3. which entries I should demote from genuine requirement to camp preference. The one I'm most suspicious of is treating the early universe's low entropy as something a cosmology must explain rather than something it's allowed to postulate — some arguments treat that as mandatory and others treat it as free, and I want to know which usage survives scrutiny and whether the two camps are even answering the same question.

  Keep any scoring of actual proposals to a few sentences at the very end; the criteria are the deliverable and I'll handle the league table myself. Also don't give me references or a reading list, I'm offline for the next two days.
reasoning: |-
  Here's a thinking process that leads to the suggested checklist:

  1.  **Analyze the Request:**
      *   **Goal:** Create a rigorous checklist (specification/desiderata) for evaluating cosmologies regarding the Boltzmann Brain (BB) problem.
      *   **Tone:** Technical, precise, critical, avoiding slogans, acknowledging hidden assumptions.
      *   **Specific Constraints:**
          *   Must address: Ratio vs. Rate, Self-Undermining Evidence, Robustness (parameter sensitivity), Observer Definition, No-Cheating (ad hoc fixes vs. fiat bans).
          *   Must answer three meta-questions: Which criterion excludes the most candidates? Is there a joint unsatisfiability (theorem-like conflict)? Which entries are camp preferences vs. hard requirements (specifically regarding low entropy initial conditions)?
          *   Minimal commentary on actual theories at the end.
          *   No references/reading list.
      *   **User Persona:** Sophisticated, likely a physicist or philosopher of physics, tired of hand-waving arguments, wants to expose hidden premises.

  2.  **Deconstruct the Specific Items:**

      *   *Ratio vs. Rate:* The core issue is measure. If the universe lasts forever, even a tiny rate yields infinite BBs. The requirement needs to specify *measure* over *count*.
      *   *Self-Undermining:* If a theory predicts I am likely a BB, my memories are unreliable, so the data supporting the theory is unreliable. This is the "cognitive instability" argument. The requirement needs to formalize "empirical coherence."
      *   *Robustness:* Theories shouldn't rely on fine-tuned parameters to avoid BBs. Needs a stability condition against perturbations in unknown parameters.
      *   *Observer Definition:* Can't just say "BBs aren't observers." Needs a physical/functional criterion that applies equally to evolved and fluctuated entities.
      *   *No-Cheating:* Distinguish between modifying dynamics to stop BBs (legitimate physics) vs. modifying the measure/interpretation solely to save the theory (ad hoc).

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Item 1 (Measure):* Call it "Asymptotic Measure Dominance." Demand: The measure of normal observers must dominate BBs in the asymptotic limit. Motivation: Eternal inflation/de Sitter space. Status: Non-negotiable for prediction.
      *   *Item 2 (Empirical Coherence):* Call it "Cognitive Stability." Demand: The theory must not predict that the evidence for the theory is likely a fluctuation. Motivation: If I'm a BB, my data is noise. Status: This is the tricky one. Is it a requirement or a pragmatic ban? I need to be honest here. It's often treated as non-negotiable, but technically a theory *could* be true even if we can't know it. However, for *predictive utility*, it's non-negotiable.
      *   *Item 3 (Robustness):* Call it "Parameter Stability." Demand: The BB/NO ratio shouldn't flip from <1 to >1 under small variations of unconstrained parameters. Motivation: Vacuum decay rates. Status: Non-negotiable for a robust theory.
      *   *Item 4 (Observer Identity):* Call it "Substrate Independence." Demand: Observer status depends on computational/physical state, not history. Motivation: Preventing "you had to be born naturally" loopholes. Status: Non-negotiable (physicalism).
      *   *Item 5 (Ad Hocery):* Call it "Dynamical vs. Measure Remediation." Demand: Solutions must arise from dynamics, not measure choices made post-hoc. Motivation: Cutting off the future to save the past. Status: This is camp preference. Measure choice is inherently ambiguous.

  4.  **Addressing the Meta-Questions:**

      *   *Q1: Which excludes the most?* It's usually the Measure/Asymptotic one (Item 1). Many theories have finite rates but infinite time.
      *   *Q2: Joint Unsatisfiability.* The user lists four: Eternal low-T, Finite Entropy, Unitary/Recurrence, Typicality + Negligible BBs. This is the "Boltzmann Lucretius" scenario. If you have Poincaré recurrence in a finite system, BBs *will* dominate eventually. You must drop one. Dropping "Typicality" (xerographic distribution) is the standard move (we aren't random samples). Dropping "Eternal" is the other (vacuum decay). Which is cheapest? Dropping Typicality is philosophically costly but physically safe. Dropping Eternity is physically costly (requires new physics).
      *   *Q3: Camp Preferences.* The Low Entropy Past. Is it a postulate or a prediction? Penrose thinks it's a prediction (dynamical). Standard Lambda-CDM treats it as an initial condition (postulate). This is the "Past Hypothesis" debate. It should be demoted to camp preference for the *BB problem specifically*, because BBs are about the *future* dominance. However, the *explanation* of the past is separate. I need to clarify that the BB problem arises *because* we assume the past wasn't a fluctuation.

  5.  **Refining the Wording:**
      *   Avoid vague terms like "reasonable." Use "asymptotic," "measure," "conditional probability."
      *   Ensure the "Status" (Non-negotiable vs. Taste) is explicit for each.
      *   Make sure the "Self-Undermining" section is nuanced. It's not that the theory is false, it's that it's *unassertable*.

  6.  **Final Review against Constraints:**
      *   Did I answer Ratio vs. Rate? Yes (in Measure Dominance).
      *   Did I answer Self-Undermining? Yes (in Cognitive Stability).
      *   Did I answer Robustness? Yes (in Parameter Stability).
      *   Did I answer Observer Definition? Yes (in Substrate Independence).
      *   Did I answer No-Cheating? Yes (in Dynamical vs. Measure).
      *   Meta-questions answered clearly? Yes.
      *   No references? Yes.
      *   Short theory scoring at end? Yes.

  7.  **Polishing the "Self-Undermining" point:** This is the hardest. If a theory predicts I'm a BB, I can't trust the theory. So the theory defeats itself. Is this a logical contradiction or an epistemic dead end? It's an epistemic dead end. I need to label it "Epistemic Viability."
      *   *Correction:* The user asks if the requirement is legitimate or a thumb on the scale. I need to be honest: It's a pragmatic requirement for *doing science*, not necessarily a truth condition for *reality*. I will mark it as Non-Negotiable for *predictive frameworks* but note it doesn't prove the theory false, just unusable.

  8.  **Polishing the "Low Entropy" point:** The user suspects this is a camp preference. They are right. The BB problem assumes the Past Hypothesis is true (we are not past fluctuations). If you don't assume that, you have the "Boltzmann Universe" scenario where *everything* is a fluctuation, including the past. The BB problem is specifically about the *future* overwhelming the *past*. So requiring an explanation for the low entropy past is a separate desideratum (Penrose style) vs. standard cosmology. I will classify this as Camp Preference.

  9.  **Final Polish:** Check tone. Needs to be sharp, slightly cynical about "solutions," but rigorous. (Self-Correction: Ensure I don't sound *too* cynical, just precise.)

  10. **Drafting the Response.** (Proceeding to generate output based on these thoughts.)
answer: |-
  Here is the specification for Boltzmann Brain (BB) resilience. Each item is structured by **Demand** (the formal requirement), **Motivation** (the concrete failure mode), and **Status** (Non-Negotiable vs. Camp Preference).

  ### 1. Asymptotic Measure Dominance
  *   **Demand:** The theory must specify a measure over observer-moments such that the integrated measure of "Normal Observers" (NOs) exceeds the integrated measure of "Boltzmann Brains" (BBs) over the entire spacetime history, or provide a cutoff mechanism that renders the BB integral finite and sub-dominant. A low production *rate* is insufficient if the duration of the production phase is infinite.
  *   **Motivation:** A de Sitter vacuum with a decay time of $10^{100}$ years produces BBs at a rate of $e^{-10^{50}}$ per year. This rate is negligible for any local experiment. However, if the vacuum is metastable but eternal (or recurs), the integrated number of BBs is infinite, while NOs are finite (confined to the early hot epoch). In a uniform sampling, the probability of being an NO becomes zero.
  *   **Status:** **Non-Negotiable.** If the measure of BBs dominates, the theory cannot assign probabilities to observations. This is not a taste issue; it is a failure of the theory to define a probability space.

  ### 2. Epistemic Viability (Cognitive Stability)
  *   **Demand:** The theory must not predict that the conditional probability of the theory's own empirical support being a fluctuation is near unity. Specifically, $P(\text{Data is Fluctuation} | \text{Theory})$ must be sufficiently low to allow Bayesian updating.
  *   **Motivation:** Suppose Theory T predicts that 99% of observers with your specific memory data are BBs. If you assume you are a typical observer drawn from the distribution T predicts, then you must conclude your memories (including the memory of reading data supporting T) are likely thermal noise. If your data is noise, you cannot update on it to confirm T. T predicts you cannot know T.
  *   **Status:** **Non-Negotiable for Predictive Utility, but Ontologically Ambiguous.** This is the "thumb on the scale" point you suspected. Strictly speaking, a universe could be real and dominated by BBs (T is true). However, such a theory is *unassertable*. It is not false; it is cognitively unstable. You must reject it not because it's wrong, but because it severs the link between evidence and belief. Treat this as a requirement for a *scientific framework*, not necessarily a constraint on reality itself.

  ### 3. Parameter Stability (Robustness)
  *   **Demand:** The ratio of NOs to BBs must not flip from dominant to sub-dominant under small perturbations of unconstrained parameters (e.g., vacuum decay rates, cosmological constant values, or scalar field masses) within their physically plausible ranges.
  *   **Motivation:** A model avoids BBs only because the vacuum decay time is tuned to be $10^{50}$ years (allowing NOs to form) but less than $10^{60}$ years (cutting off BB production before they dominate). If the decay time is an unconstrained parameter, the theory only works in a sliver of parameter space. If the physics allows the decay time to be $10^{100}$ years, the BB problem returns.
  *   **Status:** **Non-Negotiable.** A cosmology that survives only on a knife-edge of unmeasured constants is not a solution; it is a fine-tuning problem relabeled. However, "plausible range" must be defined by the theory's own dynamics, not by what saves the model.

  ### 4. Substrate Independence (Observer Definition)
  *   **Demand:** The criteria for "observer" status must be defined by physical/functional state (e.g., information processing capacity, memory structure), not by causal history. A fluctuated entity with identical physical state to an evolved human must be counted as an observer.
  *   **Motivation:** A theorist claims, "BBs don't count because they didn't evolve." This is a history-based definition. If a BB has the exact same neural configuration as you, it has the same claim to observation. Excluding it based on origin is a "no-true-Scotsman" maneuver to reduce the BB count artificially.
  *   **Status:** **Non-Negotiable.** Physicalism demands that identical states have identical properties. If you claim history matters, you are introducing non-physical properties (haecceity) into the ontology.

  ### 5. Dynamical vs. Measure Remediation (No-Cheating)
  *   **Demand:** Solutions to BB dominance must arise from the dynamical laws (changing the spacetime structure or particle physics to prevent BB formation) rather than solely from measure choices (changing the counting rule to ignore BBs) adopted *after* the dominance is discovered.
  *   **Motivation:**
      *   *Legitimate:* Modifying the potential so the vacuum decays quickly (dynamical).
      *   *Cheating:* Keeping the eternal vacuum but adopting a "cutoff measure" that arbitrarily ignores observers after time $t$, chosen specifically because that's when BBs take over.
      *   *Fiat:* Simply defining BBs as "non-observers" (violates Item 4).
      *   This requirement distinguishes between fixing the physics and fixing the bookkeeping.
  *   **Status:** **Camp Preference.** This is where the smuggling happens. In eternal inflation, the "measure problem" is unsolved. Choosing a measure that suppresses BBs is mathematically permissible but often looks ad hoc. Some camps argue measure *is* physics (Non-Negotiable). Others argue measure is a pragmatic tool and dynamical suppression is the only real fix (Preference). I classify this as **Camp Preference** because we lack a derivation of the measure from first principles. You cannot penalize a theory for choosing a measure that makes predictions possible, provided it admits the choice is pragmatic.

  ***

  ### Meta-Analysis

  #### 1. Which criterion excludes the most candidates?
  **Asymptotic Measure Dominance (Item 1).**
  Most authors lead with Epistemic Viability (Item 2), arguing "BBs make science impossible." But the real killer is Item 1. Many theories (standard $\Lambda$CDM with eternal vacuum, many string landscape vacua) are perfectly cognitively stable *locally* but fail asymptotically. They predict a finite number of NOs and an infinite number of BBs. Even if you ignore the epistemic paradox, the probability of being an NO is mathematically zero. Item 1 forces the universe to end, decay, or cycle. It kills eternal de Sitter space outright.

  #### 2. Joint Unsatisfiability (The Theorem)
  Your hunch is correct. The following four propositions form an inconsistent tetrad:
  1.  **Eternity:** The universe enters a phase that persists indefinitely (or recurs) with finite entropy density.
  2.  **Unitary/Recurrence:** Quantum mechanics is unitary (or classical Poincaré recurrence holds), ensuring all fluctuations occur eventually.
  3.  **Typicality:** We are a typical sample from the set of all observers predicted by the theory.
  4.  **NO Dominance:** Normal Observers are not negligible compared to Boltzmann Brains.

  **Resolution:** One must be dropped.
  *   **Dropping Eternity:** The vacuum decays. (Physically costly, requires new mechanisms).
  *   **Dropping Recurrence:** Quantum gravity violates unitarity or information is lost. (High theoretical cost).
  *   **Dropping Typicality:** We are *not* a random draw. We are conditioned on being early-time observers (xerographic distribution). (Philosophically costly, risks ad-hocery).
  *   **Dropping NO Dominance:** Accept we are likely BBs. (Epistemically fatal, see Item 2).

  **Cheapest to Give Up:** **Typicality (3).**
  This is the "standard" escape hatch in modern cosmology (e.g., Srednicki, Hartle). We postulate a "xerographic distribution" that weights observers by time or causal history. It saves the physics (Eternity/Unitarity) but admits that "I am a random observer" is false.
  **Honesty Check:** If you drop Typicality, you are admitting that the theory *does* predict BB dominance, but you are manually overriding the prediction for your specific location. This is the "real work" being done. It must be stated explicitly as a **Past Hypothesis conditional**: "We condition on being in the low-entropy epoch."

  #### 3. Camp Preferences vs. Requirements
  **The Low Entropy Past.**
  You are right to be suspicious. Treating the early universe's low entropy as something a cosmology must *explain* (dynamically generate) is a **Camp Preference** (Penrose/Smolin camp). Treating it as a boundary condition (Past Hypothesis) is the **Standard Model** position.
  *   **Why it survives scrutiny as a Preference:** The BB problem is a problem about the *future* overwhelming the *past*. It arises *because* we assume the past was not a fluctuation. If you treat the low-entropy past as a postulate (Standard Model), the BB problem is purely about ensuring the future doesn't swamp that postulate. If you treat the low-entropy past as a prediction (Penrose), you have a *double* problem: explaining the past *and* protecting it from the future.
  *   **Verdict:** Demote "Explain Low Entropy" to Camp Preference. Keep "Do Not Swamp Low Entropy" (Item 1) as Non-Negotiable. The two camps are answering different questions: one asks "Why was the start special?" the other asks "Given the start was special, does the theory preserve that specialness as the likely context for observation?"

  ***

  ### Brief Scoring of Proposals

  *   **Standard $\Lambda$CDM (Eternal Vacuum):** Fails Item 1 (Asymptotic Dominance). BBs dominate in the infinite future. Requires a measure choice (Item 5) or Typicality drop (Meta-2) to survive.
  *   **Phantom Energy/Big Rip:** Passes Item 1. Spacetime ends finitely, cutting off BB production. Fails on other observational grounds currently.
  *   **Cyclic Conformal (Penrose):** Passes Item 1 (resets entropy). Fails on Item 3 (Robustness) depending on black hole evaporation details. High Camp Preference cost on Low Entropy explanation.
  *   **Decaying Vacuum (String Landscape):** Passes Item 1 if decay rate is fast enough. Fails Item 3 (Parameter Stability) if decay rates are not constrained by high-energy physics.

  **Summary:** The only way to pass this spec without "cheating" (Item 5) or dropping Typicality (Meta-2) is a cosmology that physically terminates the BB-producing phase within a finite proper time. Everything else relies on measure choices or anthropic conditioning.
