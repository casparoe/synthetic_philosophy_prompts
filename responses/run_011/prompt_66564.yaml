  **Alternative Punchline 1 (Accessible)**
  Honestly, the only difference is Sam knows he's nicking chips, while the student just thought British people are terrible at forming lines.

  **Alternative Punchline 2 (Free-Rider Argument)**
  The student broke the rule. Sam broke the logic. He's only getting served early because he's betting everyone else won't do the same.
