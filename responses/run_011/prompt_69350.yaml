prompt: |-
  I chair the rules committee for a seven-member appellate panel at a national medicines regulator, and before we select a voting procedure I want the requirements written down. The panel's output is not a bare verdict. We publish a single determination that records findings on an ordered sequence of questions — whether the pivotal evidence is methodologically adequate to the claim, whether the benefit–risk profile is favorable in the target population, whether the manufacturing and stability data suffice, whether the proposed labeling is adequate — and then derives the disposition from those findings by a rule fixed in advance. The determination has legal force and is treated as authority in later matters, so the reasoning is the product rather than a gloss on the result. Our present practice is an independent majority vote on each question followed by mechanical application of the rule, and two incidents have persuaded me that this is not obviously defensible.

  Incident A. On a renewal application the panel split four–three in the applicant's favor on each of the first three questions and four–three against on the fourth. The derived disposition was refusal. No member held the combination of findings the determination attributes to the panel, and six of the seven would have voted to grant had the disposition been put to them directly. Applicant's counsel now argues, in unrelated proceedings, that our determinations record views the panel does not hold.

  Incident B. On a safety suspension the sequence in which the questions were taken decided the case: addressing the adequacy of monitoring before causation produced one pattern of majorities, and reversing the order produced another, with identical votes by identical members on identical questions. One member has also stated on the record that she voted against a finding she accepted in order to secure a disposition she preferred.

  What I want is the specification, not a recommendation. Write the desiderata any aggregation procedure for a body of this kind must meet to count as adequate for our purpose, stating for each the case or consideration that motivates it and what would count as violating it. Be precise about the distinctions the list must not collapse: aggregating judgments rather than preferences; a collectively consistent set of findings as against findings attributable to some actual member or coalition; the procedure that fixes the disposition as against the procedure that fixes the published reasons; stability of the outcome as against stability of the reasoning when membership rotates or a matter is reheard. Then mark which desiderata are non-negotiable for a panel that issues binding reasoning and which are preferences of particular camps — deductive closure of the collective set, anonymity, independence across questions, unanimity preservation, responsiveness, non-manipulability, order-invariance — saying in each case what institutional commitment makes it mandatory or dispensable here.

  Where a subset cannot be jointly satisfied, that is the part I most want to see. State the clashing conditions exactly, identify what has to be given up, and say whether the surrender is forced by the logical structure of the agenda or only by our insistence on a single authored determination. Tell me also which single desideratum does the most work in ruling candidates out, and which of the things routinely demanded of such procedures are genuine requirements rather than artifacts of modeling this panel as a court rather than as a committee.

  Finally, briefly and without belaboring it: how do a premise-based procedure, a conclusion-based procedure, and a procedure that publishes several reasoned opinions while taking the disposition by simple majority fare against the list? No bibliography, no reading list, no citations — I want the reasoning, not the references.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Role:** Chair of the Rules Committee for a seven-member appellate panel at a national medicines regulator.
      *   **Task:** Specify the *desiderata* (requirements/criteria) for a voting/aggregation procedure, *not* recommend a specific procedure.
      *   **Context:** The panel issues a single determination with legal force. It records findings on an ordered sequence of questions (premises) and derives a disposition (conclusion) via a fixed rule. The reasoning *is* the product, not just a gloss.
      *   **Problems:**
          *   Incident A (Discursive Dilemma/Doctrinal Paradox): Majority on premises leads to a conclusion no majority supports.
          *   Incident B (Path Dependence/Strategic Voting): Order of questions matters; strategic voting occurred.
      *   **Specific Instructions:**
          *   State desiderata, motivation, and violation conditions.
          *   Distinguish: judgments vs. preferences, collective consistency vs. member attribution, disposition procedure vs. reasoning procedure, outcome stability vs. reasoning stability.
          *   Classify desiderata: Non-negotiable (mandatory) vs. Preferences (dispensable), based on institutional commitments.
          *   Identify Impossibility/Clashes: Where subsets cannot be jointly satisfied, what must be given up, and why (logical structure vs. single-authored determination).
          *   Identify the "killer" desideratum and distinguish genuine requirements from modeling artifacts.
          *   Evaluate three specific procedures (Premise-based, Conclusion-based, Plurality of Opinions) against the list.
          *   **Constraints:** No bibliography, no reading list, no citations. Focus on reasoning.

  2.  **Deconstruct the Institutional Context:**
      *   **Body:** Regulatory appellate panel (quasi-judicial/administrative).
      *   **Output:** Single determination with *binding reasoning* (precedential value).
      *   **Structure:** Premises (findings on evidence, benefit-risk, manufacturing, labeling) $\rightarrow$ Rule $\rightarrow$ Disposition (Grant/Refuse/Suspend).
      *   **Key Constraint:** The reasoning must be coherent and authoritative because it acts as authority in later matters.

  3.  **Drafting the Desiderata (The "What"):**
      *   Need to capture the specific tensions in the prompt.
      *   *Collective Rationality/Consistency:* The set of findings must logically cohere (no $P$, $Q$, $R$, not-$S$ where $P \land Q \land R \rightarrow S$).
      *   *Majority Support for Disposition:* The outcome should reflect the will of the majority (Incident A concern).
      *   *Integrity of Reasoning:* The published reasons must reflect views actually held by the members supporting them (Incident A concern).
      *   *Order Invariance:* The result shouldn't depend on the sequence of voting (Incident B concern).
      *   *Strategy-Proofness:* Members shouldn't vote against their judgment to get a preferred outcome (Incident B concern).
      *   *Anonymity:* All members' votes count equally.
      *   *Unanimity Preservation:* If everyone agrees, that should win.
      *   *Systematicity/Independence:* Voting on one proposition shouldn't depend on votes on others (unless linked by logic).

  4.  **Classifying Desiderata (Mandatory vs. Preference):**
      *   *Mandatory (Non-negotiable):* Derived from the legal force and precedential nature.
          *   Collective Consistency (The determination cannot be logically self-contradictory).
          *   Disposition Legitimacy (The outcome must be defensible as the panel's decision).
          *   Reasoning Authenticity (The reasons cannot be a fiction; Incident A).
      *   *Preference (Dispensable/Contested):* Derived from social choice theory ideals that might conflict with the above.
          *   Strict Independence (Sometimes premises must be voted on together to ensure consistency).
          *   Perfect Strategy-Proofness (Hard to guarantee without restricting deliberation).
          *   Order Invariance (Crucial for fairness, but might conflict with premise-based logic if not managed).
      *   *Refinement:* The prompt asks to distinguish based on "institutional commitment."
          *   *Binding Reasoning:* Requires Collective Consistency and Reasoning Authenticity.
          *   *Democratic/Collegial Body:* Requires Anonymity and Unanimity Preservation.
          *   *Legal Certainty:* Requires Order Invariance and Stability.

  5.  **Addressing the Impossibility Theorems (The "Clash"):**
      *   This is the core theoretical heavy lifting (List & Pettit, Doctrinal Paradox).
      *   *The Clash:* You cannot simultaneously have:
          1.  Majority voting on every proposition (Independence).
          2.  Logical Consistency of the collective set (Deductive Closure).
          3.  Majority support for the final Disposition.
      *   *Incident A* illustrates this. Majority on premises $\rightarrow$ Minority on conclusion.
      *   *What must be given up?* Usually, strict Independence (Premise-based) or strict Majority on Disposition (Conclusion-based).
      *   *Why?* It's forced by the logical structure of the agenda (connectivity between premises and conclusion), exacerbated by the insistence on a *single* authored determination (cannot issue multiple opinions).

  6.  **Identifying the "Killer" Desideratum:**
      *   What rules out the most candidates?
      *   Likely *Collective Consistency combined with Reasoning Authenticity*. Simple majority voting on interconnected propositions fails this (Incident A).
      *   *Genuine Requirement vs. Artifact:*
          *   Genuine: Consistency, Binding Disposition.
          *   Artifact: Treating the panel exactly like a legislature (preference aggregation) vs. a court (judgment aggregation). The requirement for *single authored determination* is the key constraint that creates the paradox.

  7.  **Evaluating the Three Procedures:**
      *   *Premise-Based (PBP):* Vote on premises, derive conclusion.
          *   Pros: Consistent reasoning.
          *   Cons: Might yield a conclusion no majority wants (Incident A).
      *   *Conclusion-Based (CBP):* Vote on outcome, reason backwards (or minimize reasoning).
          *   Pros: Disposition has majority support.
          *   Cons: Reasoning might be fictitious or inconsistent (Incident A reversed).
      *   *Plurality of Opinions:* Allow dissenting/concurring reasons, majority vote on disposition.
          *   Pros: Honest reasoning, democratic outcome.
          *   Cons: Violates the "single determination" constraint (reduces precedential clarity).

  8.  **Refining the Distinctions (per prompt instructions):**
      *   *Judgments vs. Preferences:* This is judgment aggregation (truth-apt), not preference aggregation (ranking).
      *   *Collective Consistency vs. Member Attribution:* The set must be consistent, but does it need to match a specific member's set? (Incident A says "No member held the combination").
      *   *Disposition vs. Reasons:* The rule fixing the outcome vs. the rule fixing the text.
      *   *Outcome Stability vs. Reasoning Stability:* If membership changes, does the result change? If reheard, does the logic hold?

  9.  **Drafting the Response (Iterative refinement for tone and precision):**
      *   *Tone:* Formal, precise, administrative-legal, analytical.
      *   *Structure:*
          1.  Desiderata Specification (Definition, Motivation, Violation).
          2.  Classification (Mandatory vs. Preference).
          3.  The Impossibility/Clash (What breaks).
          4.  The "Killer" & Artifacts.
          5.  Evaluation of the three procedures.
      *   *Check against constraints:* No citations. Ensure Incident A and B are addressed in the motivation sections. Ensure the distinction between "single authored determination" and "committee" is clear.

      *(Self-Correction during drafting)*: I need to be careful about "Order Invariance." In Incident B, the order changed the majorities. This suggests path dependence. A proper procedure needs to prevent this. Is it mandatory? Yes, for legal certainty.
      *(Self-Correction on "Single Authored Determination"):* The prompt says "We publish a single determination." This is a hard constraint. The "Plurality of Opinions" option in the final evaluation will likely fail this specific institutional constraint, even if it solves the logical paradox. I must make that clear.

      *(Refining the "Mandatory" list)*:
      1.  **Collective Consistency:** The findings must not contradict each other or the derivation rule. (Mandatory for legal authority).
      2.  **Disposition Legitimacy:** The final outcome must command majority support. (Mandatory for democratic/collegial legitimacy).
      3.  **Reasoning Authenticity:** The published findings must reflect judgments actually held by the members forming the majority for those findings. (Mandatory to avoid Incident A).
      4.  **Order Invariance:** The result must not depend on the sequence of consideration. (Mandatory to avoid Incident B).
      5.  **Non-Manipulability:** Members should not gain by voting insincerely. (Mandatory for integrity).

      *Wait, can all these be mandatory?* List & Pettit show they conflict. I need to categorize some as "Preferences of particular camps" or acknowledge the trade-off in the "Clash" section.
      *Better approach:* Define the *ideal* desiderata first. Then, in the classification section, distinguish which are *institutional necessities* (binding reasoning, legal force) vs. *procedural ideals* (anonymity, strict independence).
      *Actually, the prompt asks:* "Mark which desiderata are non-negotiable... and which are preferences."
      *Okay:*
      *   Non-negotiable: Collective Consistency (law requires logic), Disposition Legitimacy (panel requires majority), Reasoning Authenticity (precedent requires truth).
      *   Preferences/Contested: Strict Independence (might need to link votes), Perfect Strategy-Proofness (hard to ensure), Order Invariance (usually mandatory, but might yield to consistency).
      *   *Correction:* Order Invariance is pretty mandatory for a regulator. If the order changes the law, that's arbitrary. I will classify it as Non-negotiable.
      *   *The Conflict:* The conflict is usually between *Premise Independence* (vote on each separately) and *Collective Consistency + Disposition Legitimacy*.
      *   *So, "Independence across questions" is the Preference that must be sacrificed.*

  10. **Final Polish:** Check the "Judgment vs Preference" distinction. Ensure the evaluation of the three procedures is brief. Ensure no citations.

      *(Final check on Incident B)*: Incident B involves path dependence and strategic voting. This highlights the need for Order Invariance and Strategy-Proofness.
      *(Final check on Incident A)*: Incident A highlights the Discursive Dilemma. Majority on premises $\neq$ Majority on conclusion.

      *Let's structure the "Clash" section carefully.* The impossibility theorem (List-Pettit) states you can't have Universal Domain, Anonymity, Systematicity (Independence), and Collective Rationality.
      For this panel:
      *   Universal Domain (any combination of views) is real.
      *   Anonymity is real (7 equal members).
      *   Collective Rationality is Mandatory (binding reasoning).
      *   Systematicity (Independence) is the one to drop. You cannot vote on premises in isolation if they logically determine the conclusion.

      *Wait, the prompt asks:* "Which single desideratum does the most work in ruling candidates out?"
      *Answer:* Collective Consistency (combined with the requirement for a single determination). If you allow multiple opinions, consistency is easier. If you don't care about reasoning, consistency is easier. But binding, single reasoning makes Consistency the killer.

      *Let's write.*
answer: |-
  ### I. Specification of Desiderata

  The following specifications define the adequacy conditions for an aggregation procedure in this context. Each includes the motivation (case or consideration) and the condition for violation.

  **1. Collective Consistency (Deductive Closure)**
  *   **Specification:** The set of findings published in the determination must be logically consistent with one another and with the fixed rule deriving the disposition. If the rule states that Findings $P, Q, R \rightarrow$ Disposition $S$, the panel cannot publish $P, Q, R$ and $\text{not-}S$, nor can it publish $P, Q, \text{not-}R$ if $R$ is logically entailed by the accepted evidence standards.
  *   **Motivation:** The determination has legal force and acts as authority. A self-contradictory precedent creates uncertainty and undermines the rule of law.
  *   **Violation:** The published determination contains propositions that cannot jointly be true, or the disposition contradicts the published findings under the pre-fixed derivation rule.

  **2. Disposition Legitimacy (Majority Support for Outcome)**
  *   **Specification:** The final disposition (Grant, Refuse, Suspend) must be supported by a majority of the panel members.
  *   **Motivation:** The panel is a collegial body. A disposition opposed by a majority lacks democratic legitimacy within the committee and invites internal dissent that weakens external authority (Incident A).
  *   **Violation:** A majority of members prefer the opposite disposition to the one issued, had they been asked to vote on the disposition directly.

  **3. Reasoning Authenticity (No "Frankenstein" Findings)**
  *   **Specification:** Every finding recorded in the determination must be a judgment actually held by the majority of members who support that specific finding. The determination cannot attribute a view to the panel that is merely the intersection of different minorities.
  *   **Motivation:** The reasoning is the product, not a gloss. If the text asserts a view no majority actually holds, the panel is lying about its own epistemic state (Incident A).
  *   **Violation:** A finding is published as the panel's view, but a majority of the panel reject that specific finding (even if they accept the final outcome).

  **4. Order Invariance (Path Independence)**
  *   **Specification:** The final determination (both findings and disposition) must not depend on the sequence in which questions are considered or voted upon.
  *   **Motivation:** Legal certainty and fairness. The law should not change based on administrative scheduling or the chair's agenda-setting power (Incident B).
  *   **Violation:** Reordering the agenda items results in a different set of findings or a different disposition, given identical member judgments.

  **5. Non-Manipulability (Strategy-Proofness)**
  *   **Specification:** No member should be able to secure a more preferred outcome by voting against their true judgment on a finding.
  *   **Motivation:** Integrity of the record. Voting should reflect genuine expert judgment, not tactical maneuvering to force a specific disposition (Incident B).
  *   **Violation:** A member votes against a proposition they believe to be true solely to alter the logical derivation of the final disposition.

  **6. Anonymity**
  *   **Specification:** The procedure treats all seven members' votes identically. No member has weighted voting power or veto rights.
  *   **Motivation:** Equality of appointment. All members are peers.
  *   **Violation:** The chair's vote counts double, or a specific senior member's dissent blocks a majority.

  **7. Unanimity Preservation**
  *   **Specification:** If all seven members agree on a finding or disposition, that position must be adopted.
  *   **Motivation:** Efficiency and respect for consensus.
  *   **Violation:** The panel rejects a proposition that every member accepts.

  ---

  ### II. Classification: Non-Negotiable vs. Preference

  **Non-Negotiable (Institutional Commitments)**
  These are mandated by the nature of the body as a regulator issuing binding, precedential reasoning.
  1.  **Collective Consistency:** A regulator cannot issue illogical rules. The "binding reasoning" constraint makes this absolute.
  2.  **Disposition Legitimacy:** A seven-member panel cannot function if the outcome routinely opposes the majority will of its members.
  3.  **Reasoning Authenticity:** Because the reasoning is treated as authority in later matters, it must represent actual collective judgments. Fabricated reasoning (Incident A) invalidates the precedential value.
  4.  **Order Invariance:** Arbitrary outcomes based on agenda order undermine the regulatory state's claim to objectivity (Incident B).

  **Preferences (Contested or Dispensable)**
  These are desirable properties from social choice theory but may yield to the institutional constraints above.
  1.  **Independence Across Questions:** The idea that votes on distinct questions should be aggregated separately without regard to logical connections. This is dispensable; in fact, it must often be restricted to ensure Collective Consistency.
  2.  **Perfect Non-Manipulability:** While strategic voting is undesirable, guaranteeing absolute strategy-proofness in complex judgment aggregation is often mathematically impossible without restricting the domain of admissible views. We prefer it, but may tolerate some risk if Consistency is preserved.
  3.  **Universal Domain:** The expectation that the procedure must handle *any* possible combination of member views. We may restrict this by requiring deliberation to narrow views before voting.

  ---

  ### III. The Impossibility Clash

  **The Clashing Conditions**
  You cannot simultaneously satisfy **Collective Consistency**, **Disposition Legitimacy**, **Reasoning Authenticity**, and **Independence Across Questions** (voting on each premise separately by majority) when the agenda is logically interconnected (i.e., premises determine the conclusion).

  This is the doctrinal paradox manifested in Incident A.
  *   If you vote by **Independence** on premises (Majority on $P$, Majority on $Q$, Majority on $R$), and $P \land Q \land R \rightarrow S$, you may derive $S$.
  *   However, the members forming the majority on $P$ may differ from those on $Q$ and $R$.
  *   Result: The coalition supporting $S$ (derived) may be a minority, violating **Disposition Legitimacy**.
  *   Alternatively, if you force **Disposition Legitimacy** (vote on $S$ directly), you may have to publish premises that do not logically support $S$ to match the majority's reasoning, violating **Collective Consistency** or **Reasoning Authenticity**.

  **What Must Be Given Up**
  **Independence Across Questions** must be surrendered.
  You cannot aggregate votes on premises in isolation from the conclusion or from each other. To maintain Consistency and Legitimacy, the procedure must link the voting on premises to the voting on the conclusion.

  **Source of the Surrender**
  This surrender is forced by the **logical structure of the agenda** (the connectivity between evidence, benefit-risk, and disposition), but it is exacerbated by the insistence on a **single authored determination**.
  *   If the panel were permitted to issue multiple opinions (concurrences/dissents with different reasoning paths), the paradox dissolves. Different coalitions could support the same disposition via different reasoning.
  *   Because the institution demands a *single* set of reasons acting as *single* authority, the aggregation must force a single coherent path, which mathematically conflicts with independent majority voting on every node of that path.

  ---

  ### IV. The "Killer" Desideratum and Modeling Artifacts

  **The Single Desideratum Doing the Most Work**
  **Collective Consistency (combined with Single Authored Determination).**
  If the panel did not need to publish binding, consistent reasoning (e.g., if it only issued a verdict), simple majority voting on the disposition would suffice. If the panel could publish multiple opinions, consistency could be maintained within each opinion without requiring global agreement on the reasoning path. The requirement that *one* text must be *logically sound* and *authoritative* rules out simple majority voting on interconnected propositions.

  **Genuine Requirements vs. Modeling Artifacts**
  *   **Genuine Requirement:** **Collective Consistency.** This is not an artifact; it is a functional necessity for a regulator whose reasoning binds future cases. Incoherent reasoning creates regulatory chaos.
  *   **Modeling Artifact:** **Treating the panel as a preference-aggregating legislature.** Standard voting theory often assumes members have "preferences" over outcomes. Here, members have "judgments" on truth-apt propositions (e.g., "Is the evidence adequate?"). Demanding that the procedure satisfy conditions designed for preference ranking (like strict transitivity of social preference) is an artifact. The core requirement is **Judgment Aggregation**, which has different constraints.
  *   **Modeling Artifact:** **Universal Domain.** Assuming members will arrive at the vote with fixed, unchangeable views is an artifact. In a deliberative committee, the procedure includes discussion. Requiring the voting rule to resolve *any* conflict without prior deliberation is a modeling error; the institutional reality allows deliberation to align judgments before the vote.

  ---

  ### V. Evaluation of Candidate Procedures

  **1. Premise-Based Procedure (PBP)**
  *   *Method:* Majority vote on each finding; disposition derived mechanically.
  *   *Performance:* Satisfies **Collective Consistency** and **Reasoning Authenticity** (on the premises).
  *   *Failure:* Fails **Disposition Legitimacy** (Incident A). The outcome may oppose the majority's will. Fails **Order Invariance** if premises are voted sequentially without closure checks (Incident B).
  *   *Verdict:* Legally robust but politically unstable within the panel.

  **2. Conclusion-Based Procedure (CBP)**
  *   *Method:* Majority vote on the disposition; reasons drafted to support the winner.
  *   *Performance:* Satisfies **Disposition Legitimacy**.
  *   *Failure:* Fails **Collective Consistency** and **Reasoning Authenticity**. The published reasons may not reflect the actual grounds of the majority (some voted Yes for reason $X$, others for reason $Y$). Risks fabricating a rationale no member fully endorses.
  *   *Verdict:* Politically stable but legally vulnerable (reasoning is fiction).

  **3. Plurality of Opinions (Dispositional Majority)**
  *   *Method:* Majority vote on disposition; members publish individual or coalition reasons.
  *   *Performance:* Satisfies **Disposition Legitimacy**, **Reasoning Authenticity**, and **Collective Consistency** (within each opinion).
  *   *Failure:* Fails the institutional constraint of a **Single Authored Determination**. It fragments precedential authority, making it unclear which reasoning binds future matters.
  *   *Verdict:* Solves the logical paradox but violates the institutional mandate for a single authoritative voice.

  **Summary:** The PBP protects the law but risks the panel's legitimacy. The CBP protects the panel's majority but risks the law's coherence. The Plurality option protects both but sacrifices the requirement for a single determination. To satisfy the Non-Negotiable list, you must modify the PBP (e.g., by requiring deliberation to align majorities before voting, or by allowing the majority on the disposition to override premise votes if consistency can be maintained in the text).
