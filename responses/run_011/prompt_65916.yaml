answer: |-
  Your advisor is operating with a sophisticated, internally consistent philosophy of historical periodization that balances *empiricism* (what happened) against *epistemology* (how we know and name it). She isn't just a constructivist or a positivist; she's a **critical realist** about labels. She wants to know if a label describes a structure the actors inhabited, or a story the historians need to tell.

  Here are the three rules compatible with her record, plus a fourth "hidden" rule that ties them together, followed by the prediction.

  ### The Three (Plus One) Rules

  **1. The Endogeneity Criterion (Who is speaking?)**
  *   **The Rule:** A label is "real" if the people living through the period used it to organize their own political or intellectual lives. It is a "story" if it is a retrospective imposition.
  *   **The Evidence:** *The Enlightenment* passes (they argued about the name). *The Middle Ages* and *Scientific Revolution* fail (later impositions).
  *   **Application to "Age of Extraction":** **Fail.** No merchant in 1650 wrote in their ledger, "This is part of the Age of Extraction." They wrote about trade, mining, or providence. This makes it a retrospective story, like the Middle Ages.

  **2. The Metaphor vs. Mechanism Criterion (What work does the noun do?)**
  *   **The Rule:** A label is honest if it describes a measurable process or admits it is a heuristic measurement. It is dishonest if it uses a metaphor that implies a theory of change (speed, agency, biology) that isn't there.
  *   **The Evidence:** *Industrial Revolution* fails on "Revolution" (implies a moment/agent, was gradual). *Long 19th Century* passes (admits it's a measurement). *Early Modern* fails (empty metaphor).
  *   **Application to "Age of Extraction":** **Mixed.** "Extraction" is a mechanism (silver/labor flows), which she likes better than "Modern." However, "Age of" is a metaphor for a cultural spirit (like *Age of Reason*), implying a totality that an economic mechanism cannot support.

  **3. The Normative Smuggle Criterion (Is there a verdict?)**
  *   **The Rule:** A label is suspect if it exists to make the present look better or the past look worse, or if it smuggles a political judgment into a descriptive category.
  *   **The Evidence:** *Middle Ages* fails (made to look dark so Moderns look awake). *Renaissance* fails (self-flattery). *Industrial Revolution* fails (smuggles politics about who did it to whom).
  *   **Application to "Age of Extraction":** **Fail.** Your colleague claims it's "descriptive," but "extraction" is a critical theory term (World Systems/Dependency Theory), not a neutral ledger term. A merchant says "profit"; a critic says "extraction." It smuggles a verdict about exploitation into the period title, much like "Revolution" smuggles a verdict about agency.

  **4. The Hidden Rule: The Totality Claim**
  *   **The Rule:** Does the label claim to be the *whole* story of the period, or just a *frame*?
  *   **The Evidence:** She likes *Long 19th Century* because it claims only to measure time. She dislikes *Renaissance* and *Early Modern* because they claim to define the *essence* of the era (rebirth or modernity).
  *   **Application:** "Age of Extraction" claims to define the *essence* of 1500–1800. It suggests everything in that box is about extraction. She will likely view this as reductionist.

  ---

  ### The Prediction

  **She will say No.**

  **Reasoning:**
  She will argue that "Extraction" is a valid *analytic lens* (like the "Industrial" part of Industrial Revolution), but "The Age of Extraction" is a **story we tell ourselves** (like the Renaissance). It fails the Endogeneity Criterion (nobody lived in "Extraction"), and it violates the Normative Smuggle rule (it frames a complex era through a specific, politically charged economic theory). She values the *honesty* of the "Long 19th Century"—admitting the label is stretchy and constructed. "Age of Extraction" pretends to be a discovered essence ("This *was* the Age of...") rather than an admitted heuristic ("We can view this period through...").

  **Closest Analog:** **The Industrial Revolution.**
  *   **Why:** In both cases, she acknowledges the underlying change is "real" (the numbers broke for Industry; the silver/labor flows are real for Extraction). In both cases, she rejects the *noun/framing* because it implies a unified theory of change that distorts the edges. Just as "Revolution" implies a sudden break that didn't happen, "Age of" implies a cultural unity that didn't exist.
  *   **Where the Analogy Strains:** "Industrial Revolution" was rejected partly because "Revolution" implies speed. "Extraction" describes a flow, which is arguably more accurate to the period's gradualism. However, the "Age of" prefix resurrects the *Renaissance* problem: it claims a cultural totality for an economic process.

  **The Test Case:**
  To separate the rules (specifically to see if she prioritizes *Mechanism* over *Endogeneity*), propose this label to her:
  **"The Little Ice Age, 1300–1850."**
  *   **Why:** It is a **Mechanism** (climate data, real edges), but it is **Exogenous** (nobody called it that then) and **Non-Normative** (it's weather, not politics).
  *   **The Split:** If she says **Yes**, she prioritizes Measurable Mechanism over Endogenous Naming (Rule 2 > Rule 1). If she says **No**, she prioritizes Endogenous Naming or fears the "Totality Claim" of an "Age" (Rule 1 or 4 > Rule 2). Given her love for the *Long 19th Century* (a measurement), I suspect she'd accept this, which proves she *would* accept "Extraction" if it weren't so politically loaded.

  ---

  ### If She Says No: The Salvage Operation

  If she rejects "The Age of Extraction," the problem is likely the word **"Age"** (which implies cultural totality) and the claim that it is purely **"Descriptive"** (which denies the theoretical lens).

  **The Fix:**
  **"The Extractive Atlantic, 1492–1830."**

  **Why this survives her objections:**
  1.  **Drops the Totality:** It limits the scope to the *Atlantic*, acknowledging that "Europe" or the "World" did other things too. It avoids the "Age of" claim that the whole era was defined by this.
  2.  **Owns the Theory:** It doesn't claim "Extraction" is what the ledgers *say*; it admits "Extraction" is how we *read* the ledgers.
  3.  **Keeps the Mechanism:** It satisfies her critique of "Early Modern" (which is just a vibe) by centering a specific, measurable process (the flow of goods/labor).
  4.  **Honest Edges:** It keeps the defensible start/end points your colleague proposed, which aligns with her appreciation for the *Long 19th Century's* honest stretchiness.

  **Advisor's Likely Response to the Fix:**
  "Finally. 'Early Modern' is a waiting room. 'Age of Extraction' is a sermon. 'The Extractive Atlantic' is a research question. Put that on the syllabus."
