answer: |-
  Dear Colleague,

  You are right to be uneasy about the Platonia Dilemma, and your instinct that the standard Nash analysis misses something vital is shared by many who have wrestled with Hofstadter's provocation. The difficulty you identify strikes at the heart of what separates classical game theory from the newer decision theories that attempt to formalize superrationality. To answer your first question, the assumption that superrationality repudiates is not merely independence in the colloquial sense, but specifically the assumption of causal isolation between agents. In standard Nash equilibrium reasoning, my choice is treated as causally inert with respect to yours; I assume that whether I send the telegram or not has no physical effect on your decision process. Superrationality challenges this by positing that if we are both rational enough, and we share the same information, we are effectively running the same algorithm. Therefore, my decision is logically entangled with yours. If I conclude that sending is rational, I must conclude that you will conclude the same. This is not a substitution of group interest for individual interest, which would be a form of altruism or social contract theory. Rather, it is a claim about the nature of rational agency itself. It asserts that rationality is a function, and identical functions fed identical inputs must yield identical outputs. To defect from the superrational strategy is not to be selfish; it is to claim that your reasoning process is superior to or distinct from the others, which contradicts the premise of shared superrationality.

  However, this leads directly to your second concern regarding the metaphysical package of identical algorithms and independent random seeds. For the mixed strategy of one in twenty to work, the agents must indeed arrive at the same policy through identical reasoning, yet they must execute that policy using independent sources of randomness. If the random seeds are also shared or determined by the same logical state, then the correlation becomes perfect rather than probabilistic. Either everyone sends or everyone abstains, and the prize is lost. For this package to be available, it must be true that the physical implementation of the agents allows for local entropy that is not logically deducible from the shared algorithm. A principle of rationality cannot assume this; it can only hope for it. It requires a world where agents are logically identical but physically distinct in a way that matters for randomization. If the agents are perfect simulations running on the same computer with the same pseudo-random number generator seed, superrationality collapses into deterministic synchronization. Thus, the fragility you sense is real. Superrationality relies on an empirical fact about the physical separation of the agents that allows for independent stochasticity despite logical identity. It is not a pure truth of reason; it is a contingent strategy that requires a specific architecture of agency.

  This fragility is sharpened considerably by your variant involving the nineteen superrationalists and the single coin-tosser. Your hunch is correct, and it survives scrutiny precisely because it highlights the empirical dependency of the view. If the nineteen superrationalists reason identically, they must choose a single probability with which to send. If they choose to mix at one in nineteen, their collective contribution to the probability of a single sender is maximized for their subgroup, but it ignores the presence of the coin-tosser. The coin-tosser sends with probability one half. If the nineteen abstain completely, the group wins whenever the coin-tosser sends and no one else does. Since the nineteen are abstaining, the only condition is that the coin-tosser sends, which happens fifty percent of the time. If the nineteen instead adopt the mixed strategy, they introduce a risk of collision with the coin-tosser or among themselves. The math works out such that the probability of exactly one telegram being sent is higher when the nineteen step aside and let the coin-tosser take the shot than when they attempt to coordinate among themselves. The superrational recommendation is therefore for the nineteen to abstain. This result is devastating to the idea of superrationality as a universal principle of rationality. It shows that the recommendation swings violently based on the composition of the group. If the twentieth person were also a superrationalist, the advice would be to mix. If the twentieth person is a randomizer, the advice is to abstain. This implies that superrationality is not a standalone rule for an individual agent but an empirical wager on the rationality and strategy of the others. It loses its normative force if the agent cannot know with high confidence that the others are running the same logical function. A principle of rationality that collapses into abstention simply because one irrational actor enters the room seems less like a law of reason and more like a fragile coordination protocol.

  This insight sheds a harsh light on what actually happened in the Luring Lottery. When Hofstadter published the contest, he offered the superrational advice that readers should submit a single entry, or randomize such that the total expected entries were one. The collapse you describe, where readers submitted googolplexes of entries, was not merely an unlucky implementation of a sound principle. It was the failure of the principle's presuppositions in a public environment. The superrational strategy requires common knowledge of superrationality. It requires that every participant knows that every other participant is reasoning this way, and knows that they know, and so on. The readership of Scientific American was demonstrably not a homogeneous block of superrational thinkers. It was a mix of game theorists, greedy actors, trolls, and people who simply did not read the column carefully. In such a heterogeneous population, the assumption of logical entanglement is false. My decision to submit one entry is not evidence that you will submit one entry if you are not reasoning the same way I am. Therefore, the collapse was inevitable. The principle failed because the epistemic conditions required for it to function were absent. It was not that the readers were irrational in failing to follow the advice; it was that the advice was predicated on a model of the audience that did not match reality. In a public contest where the composition of the group is unknown and demonstrably non-uniform, superrationality has no grip. It cannot command you to cooperate with agents who are not logically entangled with you, because doing so would simply leave you vulnerable to exploitation by those who are not bound by the same logical constraints.

  Finally, regarding the classification of the idea, it is best understood not as a rule for teams mistaken for individuals, but as an early and informal relative of Functional Decision Theory and Updateless Decision Theory. These modern frameworks formalize the intuition that your decision is the output of a function, and that other agents running similar functions will produce correlated outputs. Under this reading, superrationality is not about caring for the group; it is about recognizing that you are a instance of a type, and your choice determines the choice of all other instances of that type. This explains the fragility you identified. If the other agents are not instances of the same type—if one is a coin-tosser or a greedy maximizer—then the logical entanglement is broken. Functional Decision Theory handles this by conditioning on the output of the function, but it still requires that the other agents are sufficiently similar to be modeled as running the same function. If they are not, the theory reverts to causal dominance. The fragility is therefore not a bug but a feature of recognizing logical correlation. It shows that the scope of rational cooperation is limited to those with whom you share a reasoning architecture. To call it a team rule is to misunderstand the mechanism; it is an individual rule that accounts for logical similarities between individuals. However, this distinction offers little comfort in practice. If the principle only applies when you can be sure others are reasoning exactly as you are, then its application is restricted to highly controlled environments or specific subcultures of theorists. In the wild, where agents are diverse and their source code unknown, the assumption of logical entanglement is a dangerous gamble.

  So, where does this leave your seminar? You should present superrationality not as a solution to the Platonia Dilemma that supersedes Nash equilibrium, but as a challenge to the modeling assumptions underlying equilibrium analysis. It forces us to ask whether agents are causally isolated or logically connected. Your variant proves that if the connection is broken by even one heterogeneous agent, the superrational strategy may dictate withdrawal rather than cooperation. The Luring Lottery proves that in public contexts, this connection is almost always an illusion. Superrationality is a powerful conceptual tool for understanding logical correlation, but it is not a robust principle of action for heterogeneous populations. It earns its keep by exposing the hidden empirical wagers we make when we assume our rationality is shared. It is not a universal law, but a conditional strategy that holds only when the world is as rational and homogeneous as the theory hopes it to be. You should tell your students that Hofstadter was right to identify the logical link, but wrong to assume it would hold in a world of diverse minds. The tragedy of the Luring Lottery was not that people were too greedy to be rational, but that they were too different to be entangled.
