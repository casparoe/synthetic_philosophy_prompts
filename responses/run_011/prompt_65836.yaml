answer: |-
  # JOINT STATEMENT ON DIACHRONIC CREDENCE AND THE REFLECTION PRINCIPLE

  **1. Shared Ground**

  1.  **Arithmetic of Case 1:** In the Drug scenario, the combination of the pre-drug bet (costing $90, paying $100 if ~G) and the post-drug bet (costing $90, paying $100 if G) guarantees a net loss of $80, regardless of the truth value of G. Both camps accept this calculation.
  2.  **Informational Status:** Both camps agree the compound in Case 1 carries zero evidential weight regarding proposition G (the charter's genuineness). The shift from 0.05 to 0.95 is causally induced, not evidence-driven.
  3.  **Case 2 Consensus:** In the Archive scenario, where Mira anticipates conditionalizing on new provenance records without memory loss or manipulation, the Reflection Principle is satisfied. Both camps regard this as a paradigm of rational updating.
  4.  **Diachronic Normativity:** Both camps reject the view that rationality is purely synchronic. We agree that rational agents are subject to norms governing the relationship between credences at different times, not merely the coherence of credences at a single time.
  5.  **Dutch Book Significance:** Both camps agree that susceptibility to a guaranteed loss (Dutch Book) indicates a defect in the agent's decision-theoretic setup, though we disagree on whether this defect constitutes *epistemic* irrationality or merely *pragmatic* vulnerability.
  6.  **Credence Function:** We agree that credences represent degrees of belief aimed at truth, and that deviations from evidential support generally constitute epistemic defects unless overridden by specific structural norms.
  7.  **Case 3 Distinction:** We agree Case 3 (Amnesia) introduces self-locating uncertainty distinct from Case 1, though we disagree on whether this distinction saves Reflection or compounds the violation.
  8.  **Expertise Definition:** We agree that "epistemic expertise" generally warrants deference, but we disagree on whether anticipated future credence *constitutes* expertise by definition (Camp A) or requires independent validation of the belief-forming process (Camp B).
  9.  **No Quibbling on Numbers:** We stipulate the probabilities provided in the cases (0.05, 0.95, 0.99) are fixed for the purpose of this collaboration. Disagreement concerns the normative implications, not the probabilistic modeling.

  **2. Disagreements**

  | Question at Issue | Camp A (Deferentialists) | Camp B (Source-Sensitivists) | Genuine or Verbal? |
  | :--- | :--- | :--- | :--- |
  | **Status of Reflection in Case 1** | Reflection is violated. Mira is irrational for expecting her future credence to diverge from her current conditional credence. The drug does not negate the norm; it highlights Mira's failure to align with her future expert self. | Reflection is inapplicable. The principle presupposes the future credence is formed via a truth-tracking process. Since the drug severs the link to evidence, the "future self" is not an expert, and the formula yields no normative output. | Genuine |
  | **Source of Rational Pressure** | The pressure comes from diachronic coherence. To disagree with your future self is to assert you know better than yourself, which is a form of epistemic self-contempt incompatible with agency over time. | The pressure comes from etiology. Deference is earned by the reliability of the belief-producing mechanism. A mechanism known to be random or manipulative earns no deference, regardless of temporal identity. | Genuine |
  | **Diagnosis of the Dutch Book** | The sure loss proves incoherence. The only way to avoid the loss is to satisfy Reflection now. Therefore, Reflection is a requirement of practical rationality grounded in diachronic consistency. | The sure loss proves vulnerability, not incoherence. Mira is predictably irrational *at t2*, but rational at t1 to anticipate this. The bookie exploits a known future defect, not a present logical error. | Genuine |
  | **Role of Self-Identity** | Numerical identity suffices. As long as it is the same agent, the norm applies. Psychological discontinuity (memory loss) is irrelevant to the requirement of diachronic coherence. | Psychological continuity matters. If the future self lacks access to the current self's reasons (due to amnesia/manipulation), they function as distinct epistemic agents for the purpose of deference norms. | Mixed |
  | **Normative Force** | Reflection is a constraint on *credence*. You ought to adjust your current credence to match what you expect your future credence to be, even if you know why it will change. | Reflection is a constraint on *trust*. You ought to defer only when you trust the source. If you know the source is compromised, you ought to *resist* deference. | Verbal |
  | **Case 3 (Amnesia) Implications** | Case 3 is a failure of indexing, not Reflection. If Mira properly conditionalizes on "I am the post-drug self," Reflection can be restored. The failure is in the proposition, not the principle. | Case 3 confirms Source-Sensitivity. The uncertainty about *which* agent one is proves that bare identity is insufficient. Without knowing the causal history of the belief, deference is blind. | Genuine |

  **3. Cruxes and Pre-registered Predictions**

  **Crux 1: The Ulysses Contract**
  *Sub-question:* Can Mira rationally bind her future self to refuse the second bet in Case 1?
  *Relevance:* If Mira can rationally pre-commit to refusing the post-drug bet, it suggests the rational failure lies in the *action* at t2, not the *credence* at t1. If she cannot bind herself because her future credence *mandates* the bet, Reflection holds sway over action via credence.
  *Camp A Prediction:* Binding is impossible or irrational. If Mira truly satisfies Reflection, her t1 credence aligns with t2, meaning she expects the bet to be favorable at t2. Pre-committing would be an act of self-distrust violating Reflection.
  *Camp B Prediction:* Binding is rational and recommended. Mira at t1 knows the t2 bet is bad (expected value -$80). She should bind her future self precisely because she knows t2 credences will be manipulated. This separates rational planning from rational credence.

  **Crux 2: Case 1 vs. Case 3 (The Centering Problem)**
  *Sub-question:* Is the violation in Case 1 actually a failure to conditionalize on self-locating information (as in Case 3)?
  *Relevance:* If Case 1 is just a disguised self-locating problem, Reflection might hold if we refine the propositions to include indexicals (e.g., "G is true *and* I am the pre-drug self").
  *Camp A Prediction:* Refining propositions will not save Reflection in Case 1. The problem is the disconnect between current evidence and future belief, not indexical confusion. Even with perfect self-location, deferring to a known manipulator is required by the principle.
  *Camp B Prediction:* Refining propositions dissolves the paradox. Once Mira distinguishes "G is true" from "G is true according to the drugged self," Reflection holds trivially. The apparent violation arises only by conflating distinct epistemic perspectives.

  **Crux 3: The "Ad Hoc" Restriction**
  *Sub-question:* Can Camp A specify a non-circular restriction on Reflection that excludes Case 1 without excluding Case 2?
  *Relevance:* If Camp A must add "unless you know your future self is irrational" to save the principle, Camp B argues the principle is empty. Camp A argues this is a legitimate scope condition.
  *Camp A Prediction:* We can specify the restriction via "factive evidence." You need not defer if you have factive evidence your future self is compromised. This is not ad hoc; it mirrors exceptions in other expert principles.
  *Camp B Prediction:* Any such restriction renders Reflection subordinate to the Source Principle. If you must check the source before applying Reflection, Reflection is not the fundamental norm; source-reliability is.

  **4. What's Merely Verbal**

  A significant portion of the dispute in **Table Row 5 (Normative Force)** turns on the definition of "rational." Camp A uses "rational" to mean *diachronically coherent*, where avoiding sure loss is paramount. Camp B uses "rational" to mean *truth-tracking*, where resisting known misinformation is paramount. If we distinguish *structural rationality* (coherence) from *substantive rationality* (responsiveness to evidence), Row 5 may dissolve. Camp A accepts Mira is substantively irrational at t2; Camp B accepts Mira is structurally incoherent across t1-t2.

  Similarly, **Table Row 4 (Self-Identity)** relies on "the same agent." If "agent" means "locus of decision," Camp A wins. If "agent" means "locus of epistemic justification," Camp B wins. We suspect that once we decouple *practical agency* (where Dutch Books matter) from *epistemic agency* (where evidence matters), the disagreement over whether the drug severs identity will be recognized as a terminological choice rather than a metaphysical discovery. We recommend downgrading Row 4 to a "Verbal" status pending a unified theory of diachronic agency.

  **5. Author's Critique**

  In drafting the Shared Ground, I weakened Claim 5 regarding the Dutch Book. Camp B (Source-Sensitivists) often argue that Dutch Books in manipulation cases do not indicate *any* rational defect, merely bad luck in encountering a bookie. I phrased it as a "defect in the decision-theoretic setup" to get signatures, but this glosses over whether that setup *ought* to be modified. This loss is significant: if Camp B thinks Dutch Books are irrelevant in Case 1, the motivation for their entire position shifts from "Reflection is false" to "Dutch Books don't track irrationality here."

  I suspect Crux 1 (Ulysses Contracts) is bogus. Both sides can likely agree that binding is prudent in Case 1. Camp A will argue this shows the *credence* at t2 is the problem, while Camp B argues it shows the *norm* at t1 is to bind. It predicts the same action (bind) and merely shifts the locus of blame.

  Personally, I lean toward Camp B (Source-Sensitivity). It feels intuitive that knowing a belief is drug-induced should block deference. However, I would flip to Camp A if they can demonstrate that violating Reflection in Case 1 inevitably leads to synchronic incoherence (e.g., via a Newcomb-style problem) rather than just diachronic loss. My reasoning is most likely to fail if Camp A can successfully argue that "knowing you are manipulated" is itself a piece of evidence that should be conditionalized on, thereby absorbing Case 1 into standard Bayesian updating without needing a separate Source Principle. If Reflection is just conditionalization on "my future belief state," Camp A wins by definition.
