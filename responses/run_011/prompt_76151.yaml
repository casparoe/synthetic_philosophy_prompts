      *   *Check:* Did I answer the "verdict"? *Yes, needs to be explicit.*

  9.  **Final Polish:** Ensure the distinction between the *epistemic situation* (1846 vs 1859) and the *metaphysical situation* (the total mosaic) is clear in the Humean section. The Humean has to say the metaphysical status of NG *changed* or was *indeterminate* until the mosaic was complete, which undermines the idea of it being a stable ground for prediction.

