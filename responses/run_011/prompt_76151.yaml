          2.  **Anti-Humean Analysis:** Necessitation view and Governing view. Address the "false but successful law" problem (Newtonian gravitation isn't *true*, but predicted Neptune). Does the anti-Humean owe an account of this success?
          3.  **Counterfactuals:** Analyze "Had the body not been there..." conditionals. Can Humeans underwrite the specific conditional astronomers needed, or does it backtrack?
