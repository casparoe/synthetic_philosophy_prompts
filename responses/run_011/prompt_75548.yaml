  1. **The shape of the dispute**

  The debate conflates three distinct layers: metaphysical (do moral facts exist?), semantic (what does "moral" refer to?), and methodological (how do we measure judgment?). Nadia treats methodological variation (Move 1, 3, 7) as metaphysical proof of absence, arguing that without scientific-style feedback, convergence is impossible. Owen treats methodological convergence (Move 2, 4, 6) as metaphysical proof of presence, arguing that progress implies a standard. Semantic issues arise in Moves 5 and 6, where Nadia likens "moral" to "planet" (stipulative) and Owen argues moral terms function as accountability tools. The core deadlock is whether cultural variation represents noise in the signal (Owen) or evidence that there is no signal (Nadia). Moves 1, 3, 5, 7 are primarily Nadia's; Moves 2, 4, 6 are Owen's.

  2. **Move by move**

  (1) Nadia's data on Moral Foundations Theory is robust; cross-cultural variation in weighting values is well-documented. However, her inference that this eliminates a stable subject matter is mostly mistaken. Variation in proxy data does not necessarily negate the underlying phenomenon, much as varying sediment records do not negate past climate states. Owen's position remains defensible here; he need only argue that the *structure* of morality is constant even if weights vary. Nadia is mostly right on data, mostly mistaken on inference. Owen's silent position is stable.

  (2) Owen's astronomy analogy is clearly right: disagreement persists in hard sciences before convergence. His claim that non-moral beliefs (souls, kinship) drive moral variation is also mostly right; this is a confounding variable issue. For a geochemist, this is akin to diagenesis altering a rock record; the original signal (moral principle) exists but is obscured. Nadia's position is weakened here, as she must now prove moral disagreement persists even when non-moral beliefs are controlled. Owen is mostly right on both claims. Nadia's position is vulnerable.

  (3) Nadia's feedback mechanism point is clearly right. Science converges because nature pushes back; morals converge only when cultures dominate. This is the strongest methodological objection to Owen's realism. Her claim that convergence tracks material security rather than truth is mostly right, historically speaking. Owen's position suffers significantly here; without a feedback loop, his analogy to astronomy breaks down. Nadia is clearly right on feedback, mostly right on diffusion. Owen's position is weakened.

  (4) Owen's claim that diffusion equals progress is mostly right; we do judge past norms as incorrect, not just different. However, his claim that relativism is self-defeating is mostly mistaken. Nadia can advocate norms pragmatically without claiming objective truth, much as one prefers health without claiming it is objectively mandated. Owen scores on intuition but fails on logic. Nadia's position is vulnerable on progress but stable on consistency. Owen is mostly right on progress, mostly mistaken on self-defeat.

  (5) Nadia's distinction between meta-ethics and first-order claims is clearly right; one can deny objectivity while holding strong views. However, her Pluto analogy is clearly mistaken. Planetary classification is descriptive; moral classification is prescriptive and action-guiding. Owen's position strengthens here because the disanalogy holds. Nadia is clearly right on meta-ethics, clearly mistaken on Pluto. Owen's position is strengthened.

  (6) Owen's functional argument is clearly right; moral terms regulate behavior, not just catalogues. His measurement point is also mostly right; survey instruments often carry cultural bias, inflating variation reports. This undermines Nadia's empirical basis. Nadia's position is weakened as her data becomes noisier. Owen is clearly right on function, mostly right on measurement. Nadia's position is vulnerable.

  (7) Nadia's evolutionary challenge is mostly right; if moral facts do no explanatory work, why evolve sensitivity to them? This is a potent debunking argument. Owen's claim that choosing a "better" domain implies objectivity is mostly mistaken; "better" can be pragmatic. Nadia wins the metaphysical point here. Nadia is mostly right on evolution. Owen is mostly mistaken on "better".

  3. **What neither of them raised**

  Three considerations would shift the balance. First, **Mathematical Realism** (favouring Owen): Mathematics lacks causal feedback mechanisms yet seems objective. If moral truths resemble mathematical relations rather than physical objects, Nadia's feedback objection loses force. Second, **Evolutionary Debunking** (favouring Nadia): Sharon Street's argument is more rigorous than Nadia's intuition. If evolution selects for fitness, not truth, our moral faculties are suspect unless realism explains why fitness tracks truth. Third, **Constructivism** (favouring neither): Moral truths might exist but be mind-dependent, like money or laws. This accepts Nadia's variability while retaining Owen's normativity, dissolving the objectivity dichotomy entirely.

  4. **The residual disagreement**

  The exchange over "better" versus "better for us" is substantive, not verbal. They agree on the definition of words but disagree on the nature of normativity. Owen believes "better" implies a mind-independent standard; Nadia believes it implies a community-dependent goal. To tell the difference, one would ask if moral claims can be false even if everyone accepts them. Nadia says yes (relative to ecology); Owen says no (relative to truth). Nadia's closing question about explanatory work is answerable: naturalists argue moral facts reduce to social facts, while non-naturalists admit they are queer but necessary. The disagreement remains metaphysical.

  5. **Bottom line**

  Nadia was slightly more right overall. Her feedback mechanism argument (Move 3) successfully dismantles Owen's scientific analogy, which carried most of his weight. While Owen correctly identified measurement noise (Move 6), he could not explain how we access truths without causal contact. The verdict hinges on the lack of moral feedback loops. This would change if moral learning were shown to resemble skill acquisition, where practice yields convergence independent of culture, restoring Owen's realism.
