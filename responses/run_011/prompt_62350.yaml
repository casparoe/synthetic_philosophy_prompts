answer: |-
  **Exam Question: Adam Smith and the Impartial Spectator**

  **Time Allowed:** 45 Minutes
  **Marks:** 25

  **Prompt:**

  Read the following vignette carefully:

  > In the town of Oakhaven, a local farmer dies unexpectedly. The custom is for neighbors to contribute to the funeral costs. The Miller family, struggling with debt, contributes nothing. The town reacts unanimously: they stop speaking to the Millers, exclude them from church suppers, and treat them as moral pariahs. Every neighbor agrees this shunning is just and necessary to maintain community standards.
  >
  > However, Sarah, a lifelong resident, feels a deep sense of unease. When she participates in the shunning, she feels ashamed. When she imagines helping the Millers, she feels calm and resolved, even though she knows her neighbors would condemn her for it. She cannot find a single person in Oakhaven who agrees with her.

  Using Adam Smith's theory of moral sentiments, explain the source of Sarah's judgment. If Smith argues that our "Impartial Spectator" is built up from our interactions with actual people, how is it possible for Sarah's Spectator to condemn the very community that formed it? In your answer, distinguish between the desire for approval and the desire to be approvable, and evaluate whether Smith successfully explains how an individual can stand against the crowd without appealing to reason alone or divine command.

  ***

  **Model Answer**

  For Smith, morality begins with sympathy, which is not pity but the act of imaginatively changing places with another to see if their emotions align with ours. We naturally seek mutual sympathy of sentiments. Over time, we realize actual spectators are biased; they love themselves more than us. To gain their approval, we lower our emotions to a pitch they can enter into. We internalize this process, creating the "Impartial Spectator" (IS), a mental stand-in for an objective observer.

  The vignette presents a critical tension in this theory. If the IS is constructed from the reactions of actual spectators (the town of Oakhaven), it seems it should merely reflect the town's consensus. Sarah's dissent looks impossible. If morality is socialized agreement, a unanimous community should dictate moral truth. If Sarah's IS condemns the town, where did that standard come from if not from the town itself? This suggests a circularity: the judge is made by the accused, yet claims authority over them.

  Smith resolves this by distinguishing between the desire for *praise* and the desire for *praiseworthiness*. Most people want actual approval. However, through experience, we learn that some actions garner praise but feel shameful (like flattering a tyrant), while others garner blame but feel honorable (like defending an unpopular truth). We realize the actual spectators are sometimes wrong. Consequently, we refine our IS to represent not just what people *do* judge, but what they *ought* to judge if they were fully informed and unbiased.

  Sarah's judgment stems from this higher desire. She prefers the approval of the "man within the breast" over the applause of Oakhaven. Her IS has been calibrated not just by local opinion, but by her own imaginative attempts to view the situation from a truly neutral distance, stripping away the town's specific bias against debtors. She sympathizes more with the Millers' distress than with the town's indignation because, upon reflection, the town's anger exceeds what a neutral party would feel.

  However, Smith admits this is fragile. The IS is still rooted in human sentiment, not abstract reason. If the town's bias is deep enough, it can corrupt the IS itself. Smith relies on the hope that human sentiments, when fully corrected for bias, naturally converge on certain truths (like basic humanity). But he offers no guarantee. Sarah's stance is psychologically possible because humans can value praiseworthiness over praise, but it is socially precarious. Smith saves the IS from being mere peer pressure by showing we learn to judge the judges, but he cannot guarantee the dissenter is objectively right, only that she is faithful to her most refined sentiments. The authority comes from the stability of the sentiment upon reflection, not from an external rulebook.

  ***

  **Marking Scheme (25 Marks Total)**

  **Grading Moves (Distinguishing A from B)**

  1.  **Mechanism of Sympathy & IS Formation (5 marks):**
      *   *A:* Explains that the IS is internalized social feedback, noting we correct for the bias of actual spectators.
      *   *B Fumble:* Describes sympathy simply as "empathy" or "being nice," or claims the IS is innate rather than socially developed.
  2.  **Identification of the Tension (5 marks):**
      *   *A:* Explicitly states the paradox: If the IS comes from the crowd, it shouldn't be able to condemn the crowd.
      *   *B Fumble:* Ignores the prompt's specific tension and just summarizes Smith's theory generally.
  3.  **Praise vs. Praiseworthiness (5 marks):**
      *   *A:* Uses this specific distinction to explain Sarah's motivation (valuing internal approval over external applause).
      *   *B Fumble:* Conflates the two, suggesting Sarah just wants different applause.
  4.  **The "Judge the Judges" Move (5 marks):**
      *   *A:* Explains that we learn to evaluate the *propriety* of the spectators' reactions, not just submit to them.
      *   *B Fumble:* Suggests Sarah is using "reason" to override sentiment (Smith is anti-rationalist here).
  5.  **Critical Evaluation of Limits (5 marks):**
      *   *A:* Acknowledges Smith doesn't guarantee Sarah is *right*, only that her psychology allows dissent; notes the fragility of this stance.
      *   *B Fumble:* Claims Smith proves Sarah is objectively correct or that the IS is infallible.

  **"Sophisticated-Sounding" Traps (Deduct 3 marks each if asserted confidently)**

  *   **The Utilitarian Trap:** Claiming Sarah opposes the town because shunning reduces overall happiness/utility.
      *   *Misunderstanding:* Smith is a sentimentalist, not a consequentialist. The focus is on sentiment alignment, not outcome calculation.
  *   **The Divine Command Trap:** Claiming the IS is just a code name for God's voice or religious conscience.
      *   *Misunderstanding:* While Smith references the "Author of Nature," the IS functions through psychological socialization, not revelation.
  *   **The Social Contract Trap:** Claiming Sarah is appealing to a rational agreement or natural rights that exist prior to society.
      *   *Misunderstanding:* Smith's morality is emergent from social interaction, not based on pre-social rational contracts.

  **Grade Boundaries:**
  *   **A (20-25):** Hits all 5 moves, avoids traps, engages deeply with the paradox.
  *   **B (15-19):** Hits moves 1-3 well, but glosses over the tension or the limits (Moves 4-5).
  *   **C (10-14):** Generic summary of Smith, misses the vignette's specific problem.
  *   **D/F (0-9):** Significant factual errors or fails to address Smith.
