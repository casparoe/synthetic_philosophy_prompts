prompt: |-
  So I'm TAing a second-year history of ethics course this term — Hutcheson and Hume early on, then Smith, then a bit of Reid — and I've been handed the essay section of the two-hour final. Students do one essay out of four, 25 marks each, and the prof wants them answerable in roughly 45 minites with no books or notes in the room. My assignment is the Adam Smith one, on sympathy and the impartial spectator.

  The problem is that every year at least half the essays are the same three paragraphs: Smith thinks morality comes from imagining yourself in the other person's shoes, the impartial spectator is basically your conscience, Hume says the same thing but with more feeling. I want a question where that answer scores badly. The crux I keep coming back to, and that I argued about with my roommate for a solid hour last week, is this: on Smith's own telling, the impartial spectator seems to get built up out of our experience of how actual spectators react to us — we notice they're biased in their own favor, we correct for it, we generalize, and the man within the breast ends up being that cleaned-up, averaged version of other people's judgments. But the whole point of the spectator is that its supposed to be able to condemn what every actual spectator around you is currently applauding. If the ideal spectator is just an abstraction from real ones, where does it get the leverage to override all of them? That looks either circular or like it quietly collapses the spectator into internalized local opinion, and I want students to actually feel that pincer rather than just label it.

  So: write the exam question, with a short invented vignette built into it — I'd rather the case did the work than any quotation, since they can't bring texts in anyway. If it helps, I was picturing something small-town and non-political: a community that warmly approves of some bit of treatment, say cutting off a family who refused to chip in for someone's funeral, and one member who feels sick about it even though she can't find anyone who agrees with her. Please don't put any verbatim Smith passages in the question or the model answer; if you gesture at something he says, paraphrase it and say it's a paraphrase, no page numbers, because I'm not chasing down references. Then give me a model answer of around 600 words and a marking scheme out of 25 that splits an A from a B by naming the specific moves — I want at least five of them, each with the marks it's worth and a one-liner on how students typically fumble it. I don't want a pure takedown though: if Smith has resources for a reply, the A answer should say what they are and exactly how far they get him. Also flag two or three things that sound sophisticated but should actively lose marks — confidently announcing he's a closet utilitarian, or that the spectator is just God in a wig, or that there's a social contract hiding underneath — and say which misunderstanding each one is catching. Keep it self-contained enough that a student who read the assigned selections and paid attention can do it; I'm not testing trivia. American English throughout, please.
reasoning: |-
  Here's a thinking process that leads to the suggested exam question, model answer, and marking scheme:

  1.  **Analyze the Request:**
      *   **Context:** TA for a 2nd-year History of Ethics course (Hutcheson, Hume, Smith, Reid).
      *   **Task:** Create an Adam Smith essay question (Sympathy/Impartial Spectator) for a 2-hour final (45 mins writing time, 25 marks).
      *   **Problem:** Students usually write generic "shoe-swap/conscience/Hume clone" essays.
      *   **Goal:** Create a question that forces students to confront the tension between the *origin* of the Impartial Spectator (socially constructed from actual spectators) and its *authority* (ability to condemn actual spectators).
      *   **Format:**
          *   Exam Question with a specific vignette (small-town, non-political, e.g., shunning a family).
          *   No verbatim quotes (paraphrase only).
          *   Model Answer (~600 words).
          *   Marking Scheme (out of 25, 5 specific moves distinguishing A from B, common fumbles).
          *   "Sophisticated Sounding but Wrong" flags (Utilitarianism, God, Social Contract).
          *   American English.

  2.  **Deconstruct the Philosophical Problem (The "Pincer"):**
      *   *Premise 1:* The Impartial Spectator (IS) is formed via socialization. We observe others judging us, notice their bias, correct for it, and internalize a generalized standard.
      *   *Premise 2:* The IS must be able to judge *against* the crowd (e.g., when the crowd is wrong).
      *   *Tension:* If the IS is just an average of the crowd, how can it condemn the crowd? Is it just internalized peer pressure, or does it have normative independence?
      *   *Smith's Resource:* The distinction between *praise* and *praiseworthiness*. The desire to be approved of vs. the desire to be approvable. The process of correction isn't just averaging; it's seeking a "common ground" of sentiment that survives reflection.

  3.  **Drafting the Vignette:**
      *   *Idea:* A small town shunning a family who didn't pay for a funeral.
      *   *Character:* "Elara" (or similar).
      *   *Conflict:* Everyone else thinks the shunning is just/fine. Elara feels it's cruel, even though she can't find support.
      *   *Prompt:* Ask students to explain how Smith accounts for Elara's feeling *and* whether her feeling has authority, given Smith's theory of how moral standards develop.

  4.  **Drafting the Question:**
      *   Need to set the scene clearly.
      *   Need to explicitly ask about the *source* of the spectator and its *authority*.
      *   *Draft:* "Imagine a town where everyone shuns a family... One person feels it's wrong. Using Smith's theory, explain where her judgment comes from if everyone else disagrees. Does the Impartial Spectator allow her to be right?"

  5.  **Drafting the Model Answer:**
      *   *Word Count:* Around 600 words.
      *   *Key Moves:*
          1.  Explain standard sympathy mechanism (changing places).
          2.  Explain formation of IS (internalizing actual spectators).
          3.  Identify the problem (if IS comes from crowd, how can it oppose crowd?).
          4.  Smith's solution: Praise vs. Praiseworthiness.
          5.  Limitations: It's hard to sustain, requires effort, isn't infallible.
      *   *Tone:* Academic but accessible (2nd year level).
      *   *Constraint:* No direct quotes.

  6.  **Developing the Marking Scheme:**
      *   Total: 25 marks.
      *   Need 5 specific "moves" that distinguish an A (deep engagement with the tension) from a B (generic summary).
      *   *Move 1:* Mechanism of Sympathy (Basic).
      *   *Move 2:* Origin of IS (Social).
      *   *Move 3:* The Tension (The core prompt requirement).
      *   *Move 4:* Praise vs. Praiseworthiness (The Smithian solution).
      *   *Move 5:* Critical Evaluation (Limits of the solution).
      *   *Penalties:* The "Sophisticated but Wrong" flags (Utilitarianism, Divine Command, Social Contract).

  7.  **Refining the "Sophisticated but Wrong" Flags:**
      *   *Utilitarianism:* Smith isn't maximizing utility; he's about sentiment alignment.
      *   *God:* Smith mentions the "Author of Nature," but the IS isn't just a proxy for divine command; it's psychological/social.
      *   *Social Contract:* Smith isn't Hobbes/Locke; this is about sentiment, not rational agreement.

  8.  **Review and Polish:**
      *   Check American English spelling (socialize, honor, etc.).
      *   Ensure the vignette is integrated into the question.
      *   Check word count on model answer.
      *   Ensure the marking scheme is practical for a TA grading quickly.

      *(Self-Correction during drafting)*: Make sure the model answer doesn't solve the problem *too* easily. Smith's position is genuinely tricky. The A answer should acknowledge that Smith doesn't fully escape the circularity but offers a psychological mechanism (the love of praiseworthiness) that *allows* for dissent, even if it's fragile.

      *(Refining the Vignette)*: Let's make sure the vignette emphasizes the *unanimity* of the town to heighten the isolation of the dissenting student.

      *(Refining the Marking Scheme)*: Ensure the distinction between B and A is clear. A B student explains Smith. An A student explains Smith *struggling with the prompt's specific paradox*.

  9.  **Final Output Generation:** (Proceeding to generate the response based on these steps).
      *   *Question:* Clear, vignette included.
      *   *Model Answer:* Focused, hits the 5 moves.
      *   *Marking Scheme:* Detailed, includes the "trap" answers.

  10. **Final Check against constraints:**
      *   No verbatim quotes? Yes.
      *   American English? Yes.
      *   ~600 words model answer? Yes.
      *   5 specific moves? Yes.
      *   Trap answers flagged? Yes.
      *   Vignette included? Yes.

