answer: |-
  **MEMORANDUM**

  **TO:** New Media Acquisitions Panel
  **FROM:** [Your Name], External Context Advisor
  **DATE:** Wednesday, [Date]
  **SUBJECT:** Recommendation and Framework: [Game Name] Memorial Acquisition

  **1. Purpose**
  Thursday's decision sets a precedent for how this institution treats born-digital cultural heritage. We are divided between treating this memorial as a static artifact (Documentation), a living environment (Emulation), or a interpretive replica (Reconstruction). This memo recommends a staged approach and proposes a criteria framework to prevent future decisions from becoming metaphysical debates we are unequipped to settle.

  **2. Defining the Artifact**
  We must explicitly decide what we are acquiring. This is not a question of whether virtual space is "real" in a philosophical sense; it is a question of curatorial scope.
  *   **Geometry:** The visual shape of the garden. (Preserved by A and C).
  *   **Behavior:** The code that makes the flower bloom and the physics that allow avatars to stand on the cliff. (Preserved by B).
  *   **Practice:** The annual gathering of the guild. (Enabled only by B).

  If we acquire only the geometry (Option A or C), we are treating a social ritual as a sculpture. If we acquire the behavior (Option B), we are treating software as a performance venue. Given that the guild's request centers on the *vigil*, not the *view*, the primary artifact is the **Practice**, enabled by the Behavior. Documentation is the record of that practice, not the practice itself. Therefore, Option A is necessary but insufficient. Option C creates a replica that lacks the provenance of the original code. Option B preserves the actual object but carries the sustainability risks Conservation has rightly identified.

  **3. Addressing Conservation's Objections**
  The Head of Conservation's objections regarding opportunity cost and precedent are the strongest arguments on the table. They must be met with structural limits, not philosophical rebuttals.

  *   **Opportunity Cost:** The argument that $60k/year diverts funds from physical collections is valid if that cost is *indefinite*. No museum can underwrite a utility bill forever. However, a *fixed-term* subsidy functions less like a utility bill and more like an exhibition run. We are not committing to keep the lights on forever; we are committing to fund the transition period for the community.
  *   **Precedent (The "Floodgates" Fear):** We will not become a server farm for every dying MMO if we establish strict criteria (see Section 5). We are not acquiring the *game*; we are acquiring a specific *cultural intervention* within the game. There is a distinction between preserving "World of Warcraft" and preserving "The 2019 Memorial Garden." The former is a product; the latter is a folk artifact.
  *   **The "Hospice" Argument:** Conservation argues grief resides in people, not polygons. This is correct. Therefore, our duty is not to preserve the grief, but to preserve the *site of memory* long enough for the community to migrate their practice elsewhere or archive it themselves. We are providing a bridge, not a permanent home.

  **4. Recommendation: Staged Acquisition (Option A + Modified Option B)**
  I recommend we reject Option C (Reconstruction) as it creates a high-cost replica with no original provenance. Instead, we proceed with a hybrid of Documentation and Time-Limited Emulation.

  *   **Action:** Acquire Option (A) Documentation immediately ($18k). Simultaneously, fund Option (B) Emulation for a fixed **3-year term**.
  *   **Total Budget:** $198,000 ($18k one-time + $60k x 3 years).
      *   *Note:* This remains under the one-time cost of Option C ($240k) while preserving the original code and allowing three final anniversaries.
  *   **Technical Mitigation:** The $60k/year hosting budget must include a line item for a contractor to fix the anniversary clock script for the duration of the term. We acknowledge this is an intervention, but it is preferable to the total failure of the flower mechanic or the fabrication of a new engine in Option C.
  *   **Timeline:**
      *   **Documentation:** Acquired by December 1st.
      *   **Server Handover:** By February 1st (prior to March shutdown).
      *   **First Museum-Hosted Vigil:** March 2025.
  *   **Trigger for Revisit:** **Month 30 (September of Year 3).**
      *   At this trigger, the Panel must vote to either: (1) Let the server sunset at the end of Year 3, (2) Extend for one final year (requires new budget approval), or (3) Migrate the community to a lower-cost static viewer if the code allows. Default status is sunset.

  **5. Framework for Future Digital Acquisitions**
  To ensure this does not become a "case by case" ambiguity, future proposals for living digital environments must meet these four criteria to qualify for Emulation (Option B) funding:

  1.  **Significance of Intervention:** The content must be user-generated or significantly modified (e.g., a memorial, a protest, a unique build), not standard gameplay. We preserve *culture*, not *products*.
  2.  **Active Stewardship:** There must be an identifiable community group (like the guild) willing to partner in the preservation. We do not acquire "abandoned" worlds where the museum becomes the sole participant.
  3.  **Technical Viability:** The code must be dumpable and runnable without dependency on the original vendor's authentication servers. If it requires cracking DRM, the legal risk vetoes the acquisition.
  4.  **Sunset Clause:** No emulation acquisition is perpetual. All proposals must include a maximum term (e.g., 3–5 years) and a decommissioning plan.

  **6. Conclusion**
  Option A alone treats a cathedral like a photograph. Option C builds a theme park version of that cathedral. Option B, limited by a strict sunset clause, allows us to keep the doors open long enough for the congregation to say goodbye, without promising to pay the mortgage forever. This balances our fiduciary duty with our cultural mandate.

  I ask for your support on this staged approach Thursday.

  [Your Name]
