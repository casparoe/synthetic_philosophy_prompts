answer: |-
  ### The Design: "The Collapsing Pot"

  **Payoff Scheme: The Physical Anchor**
  I commit to a **£50 cash prize**, physically taped to the whiteboard at the start of the session.
  *   **Reason:** Digital transfers are abstract; a visible banknote creates immediate tension. The rule is: The winner receives $£50 \times (x_i / \sum x)$. If the calculation yields less than £1, the pot remains unclaimed (I keep it), and the group watches the value evaporate on the projector. This satisfies "costs nothing" (if they fail) but "not weightless" (if they succeed). It mirrors Hofstadter's million dollars without the logistical impossibility.

  **Submission & Secrecy: The Index Card Protocol**
  Participants write their positive integer on a standardised index card, fold it once, and place it in an opaque box (a simple cardboard ballot box).
  *   **Reason:** In a small room, passing papers compromises secrecy. A central box preserves the "simultaneous move" illusion. I (the convenor) will not look at the cards. I will hand the box to a trusted undergraduate (not a postgrad, to reduce power dynamics) who shuffles and hands them to me one by one. I will type the numbers into a projected Excel sheet live. This creates the "running tally" visual: as numbers are entered, the "Current Payout Per Unit" cell will visibly crash in real-time.

  **Communication Rules**
  *   **Pre-Play:** No discussion of strategy is permitted once the rules are read. Questions about mechanics are allowed; questions about intent are not.
  *   **Between Stages:** Participants may speak freely for two minutes *only* after Stage 1 results are announced and *before* Stage 2 rules are disclosed. Once Stage 2 rules are read, silence returns until the end.
  *   **Reason:** The brief venting period after Stage 1 allows frustration to surface (essential data), but the silence during play prevents coalition-building, preserving the non-cooperative game structure.

  **Stage 2 Asymmetry: The "Insider" Multiplier**
  Before Stage 2 begins, announce that **three participants** will be randomly selected (names drawn from a hat) to receive a **5x multiplier** on their share of the pot. The other eleven play for the standard rate. Everyone knows *that* there are multipliers, and everyone knows *who* has them once drawn.
  *   **Reason:** This visibly shatters the "we are all alike" premise. The eleven "standard" players can no longer assume their reasoning is shared by the three "insiders" (who have a dominant incentive to defect harder). The "insiders" know they are distinct. This forces the group to abandon the superrational heuristic without you having to lecture them on it.

  **The Joker Protocol**
  If a participant submits an absurdly large number (e.g., $10^{100}$) or a non-integer:
  *   **Rule:** Non-integers are invalid (ask for a rewrite). Absurdly large integers are **valid**.
  *   **Action:** Do not scold. Do not laugh. Read the number aloud neutrally. Type it in. Watch the pot collapse.
  *   **Reason:** This does not destroy the exercise; it *is* the exercise. Hofstadter's lottery failed in reality because of exactly this behaviour. A "joker" proves that Common Knowledge of Rationality (CKR) is false in this room. If you disqualify them, you artificially enforce the rationality you are trying to test. Let the pot die; it is the most honest data point you will get.

  ---

  ### Minute-by-Minute Timeline (75 Minutes)

  *   **00:00 – 00:10: Setup & Rules.**
      *   Tape the £50 note to the board.
      *   Read the Hofstadter payoff formula: $\text{Payout} = £50 \times (\text{Your Number} / \text{Total Sum})$.
      *   Emphasise: "Positive integers only. No communication."
  *   **00:10 – 00:25: Stage 1 (Homogeneous).**
      *   5 mins: Writing & Submission.
      *   10 mins: Live Entry & Tally. (Projector on). Watch the "Payout Per Unit" drop as numbers grow.
      *   Announce Stage 1 Winner & Payout.
  *   **00:25 – 00:35: Transition.**
      *   2 mins: Open floor (venting/reaction).
      *   3 mins: Announce Stage 2 Rule (5x Multiplier). Draw 3 names publicly.
      *   5 mins: Writing & Submission for Stage 2.
  *   **00:35 – 00:50: Stage 2 (Heterogeneous).**
      *   10 mins: Live Entry & Tally.
      *   5 mins: Announce Stage 2 Winner & Payout.
  *   **00:50 – 01:15: Debrief.**
      *   Map the room dynamics to the formal theory (see below).

  ---

  ### The Debrief Structure

  Do not lecture. Ask, then map.

  1.  **The Superrational Premise:** Ask the Stage 1 cooperators (those who picked 1 or a low number): "Why did you pick that?" They will say, "I hoped everyone else would too."
      *   *Map:* This is Hofstadter's *superrationality*: the belief that your reasoning is a template for others.
  2.  **The Collapse:** Ask the defectors/jokers: "Did you expect others to cooperate?"
      *   *Map:* This is the *Nash Equilibrium*: regardless of what others do, a larger number increases your share of the pie, provided the pie doesn't shrink faster than your slice grows. In a large-number game, the slice growth always wins locally, but the pie shrinks globally.
  3.  **The Stage 2 Break:** Ask the eleven "standard" players: "Did seeing the 5x multipliers change your number?"
      *   *Map:* This demonstrates the fragility of CKR. Superrationality requires symmetry of situation. Once payoffs diverge, the inference "they will do what I do" is logically severed. The "Insiders" likely defected harder; the "Outsiders" likely defected out of spite or fear.
  4.  **The Joker:** Address the absurd entry directly.
      *   *Map:* Superrationality assumes *rationality*. A joker introduces *uncertainty about type*. If there is even a 1% chance someone is irrational/chaotic, the superrational expected value drops to near zero. The strategy is not robust to noise.

  **Predictable Failure & In-Moment Fix:**
  I expect Stage 1 to yield a payout of £0.00.
  *   **What to do:** Do not try to salvage the mood. Lean into the failure. Say: "The pot is dead. This is exactly what happened in 1983." Proceed to Stage 2 immediately. The question for Stage 2 is not "Can we win?" but "Does the asymmetry make the collapse *faster*?"
  *   **Confidence Note:** I am genuinely uncertain if Stage 2 will land. If Stage 1 ends in total ruin (e.g., someone enters $10^{100}$), participants may feel Stage 2 is pointless. If this happens, shorten Stage 2 entry time to 3 minutes and extend the debrief. The lesson is already learned in Stage 1; Stage 2 is merely confirming the mechanism of the collapse.

  ---

  ### The Missing Feature

  **True Epistemic Opacity.**
  In Hofstadter's magazine lottery, participants were anonymous strangers across a continent. You could plausibly assume "the average reader is rational." In this room, you know Dave is a game theorist and Sarah is a joker. You cannot simulate the *assumption of rationality* when you have empirical evidence of irrationality in the faces across the table.
  *   **How to Supply It:** In the debrief, you must explicitly state: "Superrationality works only if you believe the other agents are running the same algorithm as you. In this room, you *know* they aren't. The tragedy isn't that the math failed; it's that the *sociology* made the math impossible." You must supply the counterfactual: "Imagine if you were blindfolded and didn't know who was in this room. Would you have picked 1?" That is where the philosophical work lies.
