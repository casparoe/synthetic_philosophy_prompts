answer: |-
  ### Desiderata for a Theory of Shared Intentional Action

  The following specification is derived from your two downstream jobs: (1) underwriting legal/quasi-legal attribution to organized bodies, and (2) defining the threshold for human-machine teaming. Requirements are split where they conflate distinct logical conditions.

  #### I. Non-Negotiable Requirements (Load-Bearing)

  **1. Non-Aggregativity of Output**
  *   **Motivation:** The Committee Verdict. A faculty committee votes to reject a candidate. Each member, asked privately, admits they would have voted to hire, but voted strategically to block a rival's candidate. The group's intention ("Reject") is not a function of the members' private intentions ("Hire").
  *   **Job Link:** Essential for Job 1 (Legal attribution). Law treats corporate intent as distinct from the sum of employee intents.
  *   **Marking:** **Non-Negotiable.** Without this, the theory cannot distinguish a corporate agent from a mere aggregate, rendering it useless for Job 1.

  **2. Diachronic Stability Through Turnover**
  *   **Motivation:** The Treaty Delegation. A negotiation team signs a treaty. Over five years, every original member is replaced. The delegation retains the intention to uphold the treaty terms despite zero overlap in personnel.
  *   **Job Link:** Essential for Job 1 (Organized bodies). Legal persons must survive membership change.
  *   **Marking:** **Non-Negotiable.** A theory that ties joint intention strictly to the psychological states of specific individuals cannot account for institutional persistence.

  **3. Interface Compatibility (No Phenomenological Requirement)**
  *   **Motivation:** The Autopilot. A pilot and an autopilot system land a plane. They coordinate perfectly. The system has no feelings, no experience of "we-ness," and no moral consciousness.
  *   **Job Link:** Essential for Job 2 (Human-Machine). If the theory requires a specific phenomenology or moral capacity, it excludes machines by definition rather than by functional analysis.
  *   **Marking:** **Non-Negotiable.** To do Job 2, the theory must define joint intention functionally, not experientially.

  **4. Exclusion of Mere Aggregates (Lower Bound)**
  *   **Motivation:** The Crowd. People in a queue move forward together. They are coordinated but do not share an intention.
  *   **Job Link:** Essential for Job 1 & 2. Prevents over-attribution of agency to systems that are merely causally coupled.
  *   **Marking:** **Non-Negotiable.** Without this, "joint action" loses its explanatory power.

  **5. Inclusion of Minimal Cooperation (Upper Bound)**
  *   **Motivation:** The Silent Neighbors. Two neighbors clear a shared driveway simultaneously without speaking, understanding that the other is doing the same.
  *   **Job Link:** Essential for Job 2. Human-machine teams may not have rich communication channels. If this doesn't count, the bar for "team" is too high for many functional dyads.
  *   **Marking:** **Non-Negotiable.** Prevents the theory from being too intellectualized for Job 2.

  **6. Conservatism Regarding Individual Intention**
  *   **Motivation:** Theoretical Hygiene. The account of *individual* intention (means-end coherence, stability, etc.) should not be revised *ad hoc* solely to solve the shared case.
  *   **Job Link:** Methodological constraint for both jobs. Ensures the theory integrates with general philosophy of action.
  *   **Marking:** **Non-Negotiable.** Prevents circularity or special-pleading.

  #### II. Preferences (Camp-Specific Commitments)

  **7. Full Reducibility to Individual States**
  *   **Motivation:** Methodological Individualism. The view that group states are nothing over and above interlocking individual attitudes.
  *   **Job Link:** Conflicts with Job 1 (see Non-Aggregativity).
  *   **Marking:** **Preference (Individualist Camp).** Must be dropped to satisfy Non-Aggregativity. A theory can be robust without being reductive.

  **8. Right to Rebuke (Normative Standing)**
  *   **Motivation:** The Defector. If you drop out of our duet without notice, I can legitimately rebuke you, not just predictively complain.
  *   **Job Link:** Optional for Job 2 (cannot rebuke a machine morally); Partial for Job 1 (legal liability exists, but moral rebuke is distinct).
  *   **Marking:** **Preference (Normative Camp).** For Job 2, "entitlement to rely" is sufficient; "moral rebuke" is not required. Split from Entitlement to Rely.

  **9. Entitlement to Rely**
  *   **Motivation:** The Coordination Problem. I need to know I can build my sub-plan on the assumption you will do your part.
  *   **Job Link:** Essential for Job 2 (Functional reliance).
  *   **Marking:** **Non-Negotiable (Functional version).** Note: I have moved this from Preference to Non-Negotiable, but stripped the *moral* content. The machine must be reliable, not morally bound.

  **10. Developmental Continuity**
  *   **Motivation:** Infants and Primates. Pre-linguistic beings engage in shared goals.
  *   **Job Link:** Optional. Interesting for naturalism, but irrelevant to Job 1 (Legal persons) and Job 2 (Machines).
  *   **Marking:** **Preference (Naturalist Camp).** Bears on neither downstream job.

  **11. Modesty (Egalitarian Structure)**
  *   **Motivation:** Small-scale cooperation. Theories often assume peers.
  *   **Job Link:** Conflicts with Job 1. Organized bodies are hierarchical.
  *   **Marking:** **Preference (Small-Scale Camp).** Must be dropped for Job 1. A theory of group agency must handle authority relations (command/obedience) as easily as peer cooperation.

  ---

  ### Analysis of Constructed Cases

  **Case 1: The Asynchronous Researchers**
  *   **Scenario:** Two researchers, different continents, never communicate in real time, coordinate via version control on a manuscript.
  *   **Assessment:**
      *   **Reducibility:** A reductive theory struggles here. There is no moment of "interlocking psychological states" in real time.
      *   **Planning Theory:** Can license this *if* "meshing subplans" is interpreted temporally. Each intends that the manuscript be finished *by way of* the other's edits, even if delayed.
      *   **Group Agent:** Easily licenses this. The "project" is the agent; the researchers are organs.
      *   **Verdict:** To count this as joint intentional action, the theory must allow intentions to be **mediated by artifacts** (the manuscript) and **extended in time**.
      *   **Grounds:** The intention is not in the heads at the same time; it is in the *system* (heads + artifact). This supports Job 2 (Human-Machine), where the machine is the artifact/partner.

  **Case 2: The Deceived Fourth**
  *   **Scenario:** Three plan an undertaking; a fourth joins under a false impression of the plan.
  *   **Assessment:**
      *   **For the First Three:** They share a joint intention. Their mutual knowledge and interlocking plans are intact.
      *   **For the Fourth:** They do *not* share the joint intention with the three. They have an individual intention to cooperate, based on false belief.
      *   **Requirement:** The theory must distinguish between **Common Knowledge** (required for the core group) and **Mutual Belief** (sufficient for the deceived participant's participation, but not for full joint agency).
      *   **Implication:** Joint intention is not binary for all participants simultaneously. It is possible to have a "core" joint agent acting *through* a peripheral participant who is not fully inside the intentional circle. This is crucial for Job 1 (e.g., a subordinate following orders without knowing the strategic intent).

  ---

  ### Joint Satisfiability: The Trilemma

  Your hunch is correct. There is a trilemma involving the following three demands:

  1.  **Full Reducibility:** The group's intentional state is nothing over and above the interlocking attitudes of the members.
  2.  **Robust Normative Standing:** Participants acquire a right to rebuke defectors and an entitlement to rely that exceeds mere prediction.
  3.  **Non-Aggregativity:** The group can hold an intentional state that no member holds and that contradicts the members' private states (The Committee Verdict).

  **The Conflict:**
  *   **(1) and (3) are logically incompatible.** If the group state is *fully reducible* to member states, it cannot contradict the function of those states. If the group rejects what the members accept, the group state is not supervenient on the member states in the way Reducibility demands.
  *   **(2) and (1) are in tension.** Reductive accounts (like Bratman's) derive normativity from individual consistency constraints. This yields "entitlement to rely" but struggles to generate the robust "right to rebuke" found in Gilbert's plural subjects without smuggling in a primitive social fact.
  *   **(2) and (3) are compatible** (e.g., List & Pettit), but only by abandoning (1).

  **The Resolution:**
  To satisfy your Downstream Jobs, you must **drop Full Reducibility (1)**.
  *   **Reason:** Job 1 (Legal/Organized bodies) *requires* Non-Aggregativity. The law explicitly recognizes corporate intent that diverges from shareholder/employee intent. Job 2 (Human-Machine) does not require Reducibility; it requires functional coordination.
  *   **Explanatory Forfeit:** By dropping Reducibility, you forfeit the ontological parsimony of methodological individualism. You must accept that "we-intentions" or "group-states" are real features of the social world, not just shorthand for complex "I-intentions."

  **The Single Most Eliminative Desideratum:**
  **Non-Aggregativity.**
  This requirement eliminates the Planning-Theoretic account (Bratman), the Individualist account, and the Primitivist account (Searle) as sufficient theories for your monograph's specific purpose. They can explain small-scale cooperation, but they cannot explain the Committee Verdict. Only a Group-Agent theory survives this cut.

  ---

  ### Contender Scorecard

  | Theory | Non-Aggregativity (Job 1) | Diachronic Stability (Job 1) | Interface Compat. (Job 2) | Normative Standing | Reducibility | Verdict |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Planning-Theoretic** (Bratman) | **Fail** | Weak | Pass | Moderate (Reliance) | Pass | Good for small scale; fails Job 1. |
  | **Plural-Subject** (Gilbert) | Pass | Pass | **Fail** | Strong (Rebuke) | Fail | Too moral/human-centric for Job 2. |
  | **Individualist/Reductive** | **Fail** | **Fail** | Pass | Weak | Pass | Fails Job 1 completely. |
  | **Primitivist** (Searle) | **Fail** | Weak | **Fail** | Weak | Fail | Vague on structure; fails both jobs. |
  | **Group-Agent** (List/Pettit) | **Pass** | **Pass** | **Pass*** | Strong (Liability) | Fail | **Best Fit.** (*Requires treating machines as functional members). |

  **Note on Group-Agent/Job 2:** The Group-Agent account passes Job 2 only if "member" is defined functionally. If "member" requires biological humanity, it fails. Given your Human-Machine constraint, you must adopt the functional definition.

  **Summary Recommendation:**
  Adopt a **Group-Agent framework** but strip it of the requirement for collective *phenomenology* (to satisfy Job 2). Accept that this requires abandoning Reducibility. Use the Planning-Theoretic account only as a sub-theory for how individual members interface with the group agent, not as the theory of the group agent itself.
