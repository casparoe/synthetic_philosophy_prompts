      *   **Comment:** Good intuition for why order matters. [2 marks]
  *   **Sentence:** *"...a weakly dominated strategy is still never a best response to anything the opponent might play..."*
      *   **Comment:** **False.** A *strictly* dominated strategy is never a best response. A *weakly* dominated strategy *can* be a best response (specifically against the strategy that creates the payoff tie).
