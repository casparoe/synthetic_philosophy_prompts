  I'm marking for a third-year game theory module — mostly economists, a couple of philosophers sitting it as an outside option — and I've got forty-odd scripts to get through before the paper goes to the exam board on Friday. This one is question 2 of 4 and worth 20 marks, split 8 / 5 / 7 across the parts. The external examiner already told us off for being generous on this paper last year, so I want to be careful, but I also don't want to nick marks off someone who's basically got it right. I've done a first pass and can't quite decide if its borderline, so I'd rather get an independent read on it before I write anything on the script. The question as set was:

