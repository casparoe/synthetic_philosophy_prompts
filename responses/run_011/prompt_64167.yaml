  *   **Sentence:** *"Nothing that fails to be dominated at the start can become dominated further down the line..."*
      *   **Comment:** **False.** This contradicts your own working in part (a). In (a), T was *not* dominated by B at the start (2 < 3 against L), but *became* dominated after C was removed. Strategies frequently become dominated only after opponent strategies are eliminated. The correct justification is that the *final set* is invariant, not that dominance relations are static. [0 marks for justification]
