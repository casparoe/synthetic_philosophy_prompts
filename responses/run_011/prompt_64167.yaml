      *   **Comment:** **Error.** In the 2x2 reduced game (T, B) × (L, R), Player 2's payoffs are L(3, 0) and R(0, 3). R does *not* strictly dominate L here (L is better against T). R only dominates L *after* T is eliminated. You have claimed dominance in the 2x2 matrix where none exists. [Deduct 2 marks]
