answer: |-
  1.  **Ex Ante Discrimination**
      *   **Requirement:** The theory must provide criteria available *at the time of decision* to distinguish an escalation trap from rational persistence, without relying on hindsight regarding the final outcome.
      *   **Motivating Case:** A board or funding agency must be able to intervene before resources are exhausted; a theory that only identifies a trap after the money is gone is diagnostically useless.
      *   **Status:** Non-Negotiable.

  2.  **Mechanism Unity**
      *   **Requirement:** The account must specify whether solitary decision-making (e.g., a manager funding a failing division) and interactive competition (e.g., bidders in an auction) are driven by the same underlying mechanism or distinct ones, and must not collapse the distinction without justification.
      *   **Motivating Case:** The field currently cites Staw's lone manager experiments and Shubik's dollar auction as evidence for the same phenomenon despite radically different strategic structures.
      *   **Status:** Non-Negotiable.

  3.  **Dominated Continuation**
      *   **Requirement:** The theory must explain why agents voluntarily enter states where the next incremental cost exceeds the expected marginal return, specifically addressing the transition from a dominated position to a further loss.
      *   **Motivating Case:** The step in the dollar auction from bidding ninety-five cents to one dollar and five cents, where the second-highest bidder pays for the privilege of losing more.
      *   **Status:** Non-Negotiable.

  4.  **Positional Asymmetry**
      *   **Requirement:** The account must handle the asymmetry between the leading and trailing positions, specifically explaining why the trailing position generates disproportionate pressure to continue.
      *   **Motivating Case:** In interactive escalation, the agent currently behind often escalates more aggressively than the agent ahead, despite similar sunk costs.
      *   **Status:** Non-Negotiable.

  5.  **Comparative Statics Prediction**
      *   **Requirement:** The theory must predict the direction of influence for key variables (accountability, competition, personal responsibility, project completion fraction, choice vs. inheritance) rather than accommodating them post-hoc.
      *   **Motivating Case:** Organizational findings that personal responsibility for the initial decision increases escalation, whereas inherited projects do not trigger the same commitment.
      *   **Status:** Preference of the Organizational Camp (must be met for adequacy).

  6.  **De-escalation Consistency**
      *   **Requirement:** The account must be consistent with the observation that de-escalation occurs and is itself patterned, not treating escalation as an inevitable sink state.
      *   **Motivating Case:** Empirical data shows managers do sometimes withdraw; a theory of escalation must also be a theory of continuation vs. termination.
      *   **Status:** Non-Negotiable.

  7.  **Institutional Design Role**
      *   **Requirement:** The theory must assign a functional role to the third party or institutional rule-setter (e.g., the auctioneer, the board) to identify where structural intervention can break the trap.
      *   **Motivating Case:** In the dollar auction, the auctioneer collects the revenue; in organizations, the governance structure sets the incentives. Intervention requires knowing which lever moves the outcome.
      *   **Status:** Non-Negotiable.

  8.  **War of Attrition Consistency**
      *   **Requirement:** The account must be consistent with the formal relationship between the dollar auction and the war of attrition, such that constraints on one constrain the other.
      *   **Motivating Case:** Game-theoretic modeling shows the dollar auction is the discrete counterpart to the war of attrition; a general theory cannot contradict established equilibrium properties of these forms.
      *   **Status:** Preference of the Game Theory Camp (must be met for adequacy).

  9.  **Falsifiability**
      *   **Requirement:** The theory must be capable of failing; it must specify conditions under which escalation should *not* occur.
      *   **Motivating Case:** A theory that explains both escalation and de-escalation as evidence of the same mechanism without boundary conditions is vacuous.
      *   **Status:** Non-Negotiable.

  ***

  **The Exclusionary Requirement**

  The single requirement that does the most work in excluding candidates is **Ex Ante Discrimination**. Most existing accounts are post-hoc rationalizations or equilibrium descriptions that validate the outcome once observed. Game-theoretic models often define escalation as rational equilibrium behavior given private information, making it impossible to label a specific instance a "trap" without knowing those private values. Behavioral accounts often rely on cognitive biases that are difficult to measure ex ante without knowing the agent's internal state. Only a theory that links observable structural or process variables to the probability of a trap *before* resolution meets the editor's standard for utility. This requirement eliminates any model that relies solely on revealed preference or outcome-based efficiency.

  **The Impossibility Argument**

  Your suspicion is correct: the unity requirement, the rationality requirement, and the ex ante discrimination requirement are jointly unsatisfiable. If one assumes strict rationality (agents maximize expected utility given their information) and unity (the same logic applies to solitary and interactive cases), then sustained escalation past the value of the prize is, by definition, an equilibrium response to uncertainty about opponents' budgets or valuations. In such a model, an outside observer cannot distinguish a "trap" from a "defensible bet" ex ante without access to the private information driving the equilibrium. To license an outsider's verdict that a commitment is a trap *at the time*, one must assume that the agents are deviating from rational maximization (bounded rationality) or that the structure creates a systematic error observable ex ante. Therefore, to satisfy Ex Ante Discrimination and Unity, the theory must surrender the strong Rationality requirement. A theory that takes rationality seriously cannot support a normative judgment of "trap" in equilibrium conditions; it can only describe the cost of information revelation.

  ***

  None of the three families survives the list intact. The Game-theoretic tradition must surrender the claim that escalation is always equilibrium-rational, admitting that some persistent play is socially wasteful trap behavior identifiable ex ante rather than efficient signaling. The Behavioral tradition must surrender its focus on isolated cognitive biases, integrating the strategic pressures of interaction to meet the unity requirement and acknowledging that sunk cost effects operate within competitive constraints. The Organizational tradition, while best positioned to handle institutional design and ex ante discrimination, must surrender its neglect of competitive dynamics, acknowledging that solitary escalation often mirrors the strategic traps of the dollar auction. Only a synthesis that abandons strict rationality in favor of bounded rationality within a strategic context can meet the specification.
