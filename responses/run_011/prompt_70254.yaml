  Focus on conceptual analysis supported by secondary historical literature rather than archival digging.

  **Project Title:** The Epistemology of Premature Truth: Criteria for the 'Right but Early' Defence in Long-Run Economic Modelling

  **Research Question**
  This project asks: can the defence that a long-run theory was 'right but early' ever constitute a non-ad-hoc scientific claim? If so, what criteria, fixed in advance of the outcome, would distinguish (a) a correct mechanism with miscalibrated timing, (b) a correct mechanism temporarily swamped by an unpredicted countervailing process, and (c) a false theory whose predicted phenomenon later arrived for unrelated reasons? The inquiry seeks to demarcate legitimate theoretical resilience from immunising stratagems in contexts where empirical verification requires timeframes exceeding standard political or funding cycles.

  **Philosophical Context and Limitations**
  The familiar apparatus of twentieth-century philosophy of science leaves this question unresolved. Naïve falsificationism is ill-suited to long-run predictions; a theory predicting crisis in 1800 cannot be strictly falsified by data from 1850 without auxiliary assumptions about background conditions. The Duhem-Quine thesis regarding the underdetermination of auxiliary hypotheses permits the theorist to always blame the timing or the conditions rather than the core mechanism, but it offers no normative guidance on when such moves are rational.

  Lakatos's methodology of scientific research programmes distinguishes between progressive and degenerating shifts, yet a 'right but early' claim often appears degenerating (adding caveats about timing) until the predicted event finally occurs, at which point it appears retroactively progressive. This creates a hindsight bias problem. Similarly, *ceteris paribus* clauses are too easily invoked to explain away temporal mismatches. If 'other things' are never equal over a century, the clause becomes vacuous. The project argues that current frameworks lack a specific taxonomy for temporal error versus structural error, allowing poor theories to survive merely by extending the deadline.

  **Methodology and Case Studies**
  The research will proceed over twelve months, balancing conceptual analysis with historical case reconstruction.

  *Months 1–3: Conceptual Framework.* I will analyse the logical structure of temporal defences. The goal is to draft a preliminary set of necessary conditions for a 'right but early' claim to be valid. Key work involves defining what constitutes a 'mechanism' distinct from its 'parameters'.

  *Months 4–6: Primary Case Studies.* I will examine the Malthusian population trap and the Ehrlich-Simon wager. These are not merely illustrative but constitutive of the problem. For Malthus, the focus is on whether the fertility transition was an endogenous variable he missed (false mechanism) or an exogenous shock (countervailing process). For Ehrlich, the analysis concerns commodity substitution versus absolute scarcity.

  *Months 7–9: Control Cases.* To prevent the criteria from being tailored to fit the primary cases, I will employ two control cases selected for their informative contrast.
  1.  **Hubbert's Peak Oil:** This serves as a control for category (a) and (b). The mechanism (geological depletion) was physically sound, but the timing was swamped by technological extraction methods (fracking). It tests whether technical substitution counts as a refutation or a delay.
  2.  **1970s Global Cooling:** This serves as a control for category (c). Some models predicted cooling based on aerosol forcing; warming later occurred due to GHG forcing. This tests whether a later matching phenomenon validates an earlier false mechanism.
  These controls are informative because they offer clearer resolution than the economic cases; the physical mechanisms are better understood, allowing us to test if the philosophical criteria hold where the science is less contested.

  *Months 10–12: Protocol Development and Writing.* I will synthesise the findings into a scoring protocol and draft the final monograph.

  **Successful Results**
  A successful outcome is not merely a historical narrative but a diagnostic tool. I aim to produce a 'Temporal Resilience Protocol'—a checklist of questions that policy analysts or scientists can apply prospectively to long-run predictions. For example: 'Has the theorist specified which auxiliary variables would invalidate the timing without invalidating the mechanism?' and 'Is there independent evidence for the mechanism existing outside the predicted window?' If the project succeeds, we should be able to look at a current prediction (e.g., regarding AI displacement or climate tipping points) and assess whether defending it against short-term negative evidence is scientifically responsible or dogmatic.

  **Failure Conditions**
  The project would fail if the resulting criteria remain too abstract to be applied outside the specific historical cases studied. If the distinction between 'miscalibrated timing' and 'false mechanism' relies on knowing the outcome, the project has not solved the problem of hindsight bias. Additionally, if the analysis reveals that 'right but early' is *always* an ad-hoc defence regardless of context, the project must honestly conclude that the defence is epistemologically bankrupt, rather than forcing a positive result.

  **Feasibility and Scope**
  Is one year realistic? It is ambitious. Deep archival work on Malthus or Ehrlich is impossible in this timeframe. However, the project does not require new historical discovery but rather philosophical re-evaluation of established scholarship. By relying on secondary literature for the historical narrative and focusing primary energy on the conceptual differentiation of the defence types, the scope is manageable. The risk lies in the control cases; if the physical science behind Peak Oil or Global Cooling proves too complex to summarise accurately without specialist knowledge, the comparison may weaken. I will mitigate this by consulting existing philosophy of climate science literature rather than raw data. The deliverable will be a substantial journal article or working paper rather than a full monograph, ensuring completion within the fellowship period.

  The ultimate value of this research lies in its application to contemporary policy. In an era of long-term existential risk modelling, knowing when to persist with a warning and when to abandon it is not merely academic; it is a matter of resource allocation and public trust. This project seeks to provide the epistemic grounds for that judgment.
