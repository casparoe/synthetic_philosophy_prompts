  Distinction between (a) and (b) risks collapsing into auxiliary hypotheses; must define 'ex-ante criteria' strictly to avoid hindsight bias.
  Control cases need clear falsifications, not just contested ones; 12 months is tight for historical depth, rely on secondary lit.
