answer: |-
  1. The Fischer controversy conceals a foundational clash between an occurrent grammar of specific July decisions and a dispositional grammar of settled aims, yet Article 231 of Versailles demands the latter to bind a republic that neither declared nor fought the war.
  2. Only dispositional responsibility survives the collapse of an imperial regime because settled aims are the property of a polity that outlives its ministers, thereby enabling legal inheritance where occurrent liability would expire.
  3. This grammar is not an unmoored verdict on national character but a rigorous attribution of liability to institutionalized strategies that actively shaped the crisis landscape regardless of specific declarations.
  4. While every great power harbored aims making war likelier, the dispositional grammar isolates liability not on the existence of aims but on the specific structural prioritization that systematically closed peaceful off-ramps available to others.
  5. Fischer ultimately defends not a factual claim about the July crisis but the necessary juridical logic that allows a state to bear responsibility for the aggressive potential it cultivated across generations.
