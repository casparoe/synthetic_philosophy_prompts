answer: |-
  Stand close enough to her and you can smell the diesel and the old varnish.
  She looks solid. She looks like she's been here forever.
  But we know the math. Wood doesn't last forever in salt water. Not if you want to keep sailing.

  The yard had a rule for the Petrel. Never replace a plank until it fails. Never preemptively.
  And when a shipwright hung a new one, he signed the inside face. Date and name.
  If you crawl into the bilge today, you don't see original timber. You see a ledger.
  You see forty years of hands keeping a promise.
  The outside is smooth paint. The inside is a logbook of repairs.
  Every scar has a signature. Every fix has a date.
  She isn't preserved by being kept in a glass case. She's preserved by being used until she broke, and then fixed by someone who cared enough to sign their name.
  That's the work of the boatyard crew sitting behind me. They didn't just maintain a vessel. They maintained a standard.

  People ask me if she's still the Petrel. Given how much has changed.
  I ask Captain Reyes the same question.

  Forty-one years he's skippered her. In that time, the yard has replaced his hip with titanium. They've fitted a pacemaker. New knee. New lenses in both eyes.
  He tells us the only difference between him and the boat is that the yard signs their work on the boat.
  (Blank line)
  We laughed. But he's right.
  We know he's still Reyes. Not because of the parts. Because of the work.
  He's the same because he's still the one holding the helm.
  The body changes. The name holds.
  And when he steps off this dock today, the name stays with him.

  Now, the shed where they drew her lines burned down in 1998.
  The paper is gone. The only record of her shape is the hull sitting right here.
  We know some of you want to scan her. Build a twin.
  There is money on the table to make it happen.
  That's a heavy question.
  If you build her again, exactly true, is it her? Or is it a monument?
  I don't have the answer. And I'm not going to give you one.
  But I know this.
  A boat isn't a statue. She's a tool.
  She's defined by the water she displaced, the samples she carried, the students who learned to tie a bowline on her rail.
  The wood rots. The shape fades. The work remains.
  A copy might hold the shape. But only the people can carry the work.
  Whether she sails again or sits in a museum, the value isn't in the oak. It's in the use.

  So whether she sits in a shed, or sails as a copy, or rests at the bottom of the harbor.
  She is the sum of the repairs.
  She is the sum of the voyages.
  And she is the sum of the people who kept her floating.
  To the faculty and donors: you funded the trips.
  To the yard crew: you funded the safety.
  To Captain Reyes: you funded the courage.

  Captain. Thank you for keeping us afloat.
  Petrel. Thank you for carrying us.
