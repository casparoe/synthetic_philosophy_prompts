      *   **Tone Check:** "Plain dockyard English." No jargon. Warm but not mushy.

      *   **The Keel Secret:** Ensure nothing implies "original wood" is sacred. The value is in the *act* of repair, not the *age* of the timber.

      *   **Reyes's Joke:** Needs to feel natural. "At least the yard signs its work on him."

      *   **The Replica:** Don't say "it's good" or "it's bad." Say "it's another way to keep the shape."

