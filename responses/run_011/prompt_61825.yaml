      Stand here looking at Petrel. She's old. But wood rots. We replace planks. Shipwrights sign them. Inside is a logbook of fixes. People ask if she's the same boat. Captain Reyes asks if he's the same man. Hip, knee, eyes. He jokes the yard signs him. But he's still Reyes. Petrel is still Petrel. Not because of wood. Because of the work. Now someone wants to scan her. Make a copy. Maybe that's okay. Shapes change. Work continues. Thank you.

