          *   **Key Moment:** Reyes's joke about his own replacements (hip, pacemaker, knee, lenses) vs. the boat's replacements. Needs to land as a real moment, with him laughing first.
          *   **Format:** Start with the first line. No preface, no title, no notes. Blank lines for pauses.
          *   **Tone:** Rhythm matters (spoken aloud).

  2.  **Deconstruct the Philosophical Trap:**
      *   The user is stuck on the Ship of Theseus problem.
      *   Option A (Same Shape): Weak because the original lines are gone, and a replica would have the shape *better*.
      *   Option B (Same People/Memory): Reyes hates this sentimental line.
      *   Option C (Material Continuity): Impossible because almost no wood is original, and the keel secret makes this a lie.
      *   **Solution:** Focus on *use* and *continuity of purpose* rather than material or shape. The boat is defined by the work it did and the hands that touched it, not the wood itself. The "signature" inside the planks is key—it's not about the wood, it's about the *care*. The boat is a record of attention. This aligns with Reyes's own body (replacements kept him going to do the work).

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the boat, the dock, the crowd. Ground it physically.
      *   **The Wood/Repairs:** Mention the signed planks. This is the factual hook. It's not about the wood being old, it's about the work being recorded.
      *   **The Captain/Body:** Connect the boat's repairs to Reyes's repairs. This is the emotional core. Use his joke.
      *   **The Replica/Future:** Address the scan/replica idea without taking a side. Frame it as another kind of record, another kind of continuity.
      *   **Closing:** Bring it back to the present moment. The boat is here now.

