  1. If the selection machinery is exactly the kind a conditioning animal has, then the causal operation producing behavioral adjustment is functionally identical in both cases. Taxonomically distinguishing them requires proving a difference in the mechanism itself, not merely a difference in the data feeding that mechanism.

  2. The stipulation requires the evaluator to emit a signal of the same functional type as real outcomes, ensuring the downstream learning rules operate without modification. This functional equivalence guarantees that the weight-updating algorithm remains invariant across both external and internal trials.

  3. Classifying a difference in the fidelity and reach of a surrogate as a new rung mistakes a continuous variable for a discrete structural innovation. This forces the taxonomy to draw an arbitrary line along a gradient where the underlying mechanism remains constant.

  4. The internal model serves only to generate trajectories for the evaluator, acting as a pre-processor that feeds the existing conditioning machinery. Adding a pre-processor to an input stream does not change the nature of the machine receiving that stream.

  5. The rejoinder asserts that the asymmetry between organism and hypothesis creates a structural difference, but the stipulated machinery operates identically regardless of which entity bears the risk. Because the selection process itself cannot distinguish the ontological status of the dying variant, that status cannot define a new kind of selection process.
