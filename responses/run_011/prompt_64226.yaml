  *(Refining the "Load" point)*: The user mentioned "exogenous load." In AI, the load is often the *objective function* itself. The optimization pressure *is* the load. That's a crucial insight for a materials guy. Stress isn't just applied; it's generated internally by the drive to minimize loss.

