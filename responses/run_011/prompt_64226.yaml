          *   *The "Physics" Gap:* We don't have the equations for intelligence.
          *   *Deception:* Bridges don't lie about their stress levels. AI might.
      *   *Section 3: Verdict on Worst-Case.* It survives as a *heuristic* for caution, but fails as a *mathematical requirement* under current paradigms. The "negligence" claim holds weight if the risk is existential, but the "guarantee" might be impossible.
      *   *Section 4: Better Analogies.*
