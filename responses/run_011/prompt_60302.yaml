answer: |-
  I stand beneath the ordinary light,
  counting the fingers on my left hand,
  measuring out the linear time,
  walking through this quiet room,
  signing papers with my name,
  listening to the distant sound.

  I've heard rumors of a different sound,
  one that fractures all the light,
  calling out a stolen name,
  reaching for a willing hand,
  occupying the whole room,
  consuming all the time.

  I cannot budget for that time,
  or anticipate the sound,
  or map the walls of that room,
  or soften that light,
  or withdraw my hand,
  or keep the given name.

  You will answer to a new name,
  living in fractured time,
  held by a gripping hand,
  woken by every sound,
  blinded by the morning light,
  bound inside a small room.

  I cannot see the shape of that room,
  or who resides in the name,
  or how to parse the light,
  or how to spend the time,
  or how to silence the sound,
  or what rests in my hand.

  I only possess this hand,
  and the key to this room,
  and the quiet before sound,
  and the weight of my name,
  and the clock's steady time,
  and the switch for the light.

  I raise this hand to sign the name,
  enter the room where time breaks,
  accept the sound, accept the light.
