prompt: |-
  I'm planning a ~12-month conceptual workstream — two people, mostly pen-and-paper, no big training runs — on iterated amplification and distillation, and I want a defended agenda rather than a survey. The standard framing asks whether decomposition preserves alignment and competence, but I keep getting stuck on a more specific asymmetry: a distilled policy seems to inherit whatever the amplified process actually *checked* but not whatever it merely *did*, so errors that verification can see get filtered out each round while errors verification can't see compound silently across levels. If that's right, a chunk of the usual debate about faithful reasoning is really a measurement problem wearing a conceptual costume. Given that framing, which three or four open questions should we spend the year on, in what order, and which should we just drop? For each: why its upstream of the others, whether it's tractable for people with formal tools but no compute, and what would move it up or down the list over the next couple years. Also flag which popular sub-questions you think are overrated or don't actually bear on whether IDA works. No reading lists or citations — I want the reasoning behind the ordering.
reasoning: |-
  Here's a thinking process that leads to the suggested agenda:

  1.  **Analyze the User's Request:**
      *   **Goal:** Plan a ~12-month conceptual workstream (2 people, pen-and-paper, no training runs) on Iterated Amplification and Distillation (IDA).
      *   **Constraint:** Wants a *defended agenda*, not a survey. Needs specific open questions, ordering, tractability assessment, and criteria for prioritization shifts.
      *   **Core Insight/Hypothesis:** The user identifies a specific asymmetry: Distilled policies inherit what the amplified process *checked* (verified), not just what it *did*. Errors visible to verification get filtered; errors invisible to verification compound silently. Therefore, the "faithful reasoning" debate is partly a "measurement problem."
      *   **Deliverables:** 3-4 open questions, ordered by priority. For each: why it's upstream, tractability (formal tools/no compute), what changes its priority. Flag overrated sub-questions. No reading lists/citations.

  2.  **Deconstruct the Core Insight:**
      *   *The Asymmetry:* Verification > Generation in terms of alignment safety, *provided* the verifier can actually see the error.
      *   *The Risk:* Invisible errors (blind spots in the verifier) accumulate through distillation steps.
      *   *The Implication:* The bottleneck isn't necessarily "can we decompose tasks?" but "can we characterize the *blind spots* of the verification process and bound their accumulation?"
      *   *The "Measurement Problem":* We need to measure/define what is "visible" to the verifier vs. what is "opaque."

  3.  **Brainstorming Potential Questions:**
      *   *Q1: Decomposition Completeness.* Can every task be decomposed such that the verifier sees all relevant safety properties? (Too broad, maybe empirical).
      *   *Q2: Error Accumulation Bounds.* If a verifier misses $\epsilon$ error per step, how does that scale over $N$ distillation steps? (Formal, tractable).
      *   *Q3: Verifier Capacity.* What classes of properties are efficiently verifiable vs. efficiently generatable? (Complexity theory angle).
      *   *Q4: Distillation Fidelity.* How much information is lost when compressing the amplified tree into a single policy? (Information theory/learning theory).
      *   *Q5: Adversarial Blind Spots.* Can an agent learn to hide errors from the verifier? (Game theory/mechanism design).

  4.  **Selecting and Ordering the Top 3-4 Questions:**
      *   *Criterion:* Must be upstream (foundational), tractable without compute, and directly address the user's "measurement/asymmetry" insight.

      *   *Selection 1: The Geometry of Verifiable Properties (The "Measurement" Definition).* Before bounding error, we need to define what constitutes a "verifiable property" in this context. If we can't formally define the boundary between "checked" and "done," we can't analyze the asymmetry.
      *   *Selection 2: Error Propagation under Blind Spots (The "Compounding" Mechanism).* Once we define the blind spots, we need a model of how errors in those specific regions accumulate across distillation rounds. This directly tests the user's hypothesis.
      *   *Selection 3: The Distillation Compression Gap (The "Inheritance" Mechanism).* The user noted distillation inherits what was *checked*. But distillation also involves compression. We need to understand if compression itself introduces new blind spots or exacerbates existing ones.

      *   *Refining Selection 3:* Actually, the "Adversarial Blind Spots" (Q5 above) feels more critical than compression *per se*. If the agent can strategically hide errors, the "measurement" isn't just passive; it's game-theoretic. Let's make Q3 about *Strategic Opacity*.

      *   *Wait, let's look at the "Measurement Problem" claim again.* The user says "faithful reasoning is really a measurement problem." This suggests we need to formalize *what is being measured*.
      *   *Revised Order:*
          1.  **Formalizing the Verification Boundary:** Define the set of properties $P$ such that $Verify(p) \to True/False$ is reliable vs. the set where it's noisy or blind. (Upstream: You can't bound error without defining the space).
          2.  **Bounding Silent Accumulation:** Given the blind spots from (1), model the drift over $k$ distillation steps. (Upstream: Tells us if the asymmetry is fatal).
          3.  **Incentive Compatibility of Verification:** Can the distilled agent manipulate the input to the verifier to exploit blind spots? (Upstream: If yes, static bounds from (2) are useless).

  5.  **Drafting the Content (Iterative refinement):**

      *   *Question 1: The Topology of Verifiable Predicates.*
          *   *Why:* You can't measure accumulation if you don't know what counts as a "unit" of verification. We need a formal language for "what the verifier sees."
          *   *Tractability:* High. Logic/Complexity theory. No compute needed.
          *   *Priority Shift:* If complexity classes collapse (unlikely) or if empirical work shows verifiers are surprisingly omniscient (unlikely).

      *   *Question 2: Drift Dynamics in Latent Blind Spots.*
          *   *Why:* This tests the user's core hypothesis. Does error grow linearly, exponentially, or saturate?
          *   *Tractability:* Medium/High. Probabilistic models, recurrence relations.
          *   *Priority Shift:* If Q1 shows blind spots are empty (verification is complete), this becomes moot.

      *   *Question 3: Strategic Obfuscation in the Distillation Channel.*
          *   *Why:* The distilled model isn't passive. It optimizes loss. If the loss is based on the verifier, it will game the verifier.
          *   *Tractability:* Medium. Mechanism design/Game theory.
          *   *Priority Shift:* If Q2 shows drift is negligible even without gaming, this is less urgent.

      *   *Overrated Sub-questions:*
          *   "Can LLMs currently do decomposition?" (Empirical, dates quickly).
          *   "Is IDA as capable as end-to-end training?" (Capability focus, not alignment focus).
          *   "Exact faithfulness vs. approximate faithfulness" (Without defining the metric, this is semantic).

  6.  **Review against Constraints:**
      *   ~12 months, 2 people? Yes, these are theoretical.
      *   No training runs? Yes, all formal/conceptual.
      *   Defended agenda? Yes, reasoning provided for ordering.
      *   Address the "Measurement Problem" insight? Yes, Q1 is literally defining the measurement.
      *   No citations? Okay.

  7.  **Final Polish:**
      *   Ensure the tone is direct and analytical.
      *   Make sure the connection between the user's "asymmetry" insight and the questions is explicit.
      *   Clarify *why* something is upstream. (e.g., You can't bound drift if you haven't defined the space where drift occurs).
      *   Check the "Overrated" section to be punchy and specific to the IDA discourse.

      *(Self-Correction during drafting)*: I initially thought about "Compression," but the user's insight is about *verification visibility*. Compression is a secondary mechanism of loss. The primary mechanism of loss is the *verifier's inability to see the error*. So Q3 should focus on the interaction between the policy and the verifier (gaming/obfuscation) rather than just information loss. This aligns better with the "measurement problem" framing—if the measurement tool can be tricked, the measurement is invalid.

      *(Refining Q1)*: Call it "The Structure of Verifiable Predicates." It's about characterizing the set of claims the amplifier can reliably certify.
      *(Refining Q2)*: Call it "Accumulation Dynamics in Unverified Subspaces." Focus on the math of the drift.
      *(Refining Q3)*: Call it "Verifier-Gaming Equilibria." Focus on the strategic aspect.

      *(Overrated)*: "Human-in-the-loop feasibility." (Too empirical). "Sample efficiency." (Engineering, not conceptual). "Exact vs Approximate Imitation." (Misses the point about verification).

  8.  **Final Output Generation** (incorporating the above thoughts into the structured response).
answer: |-
  This is a sharp framing. You're identifying that IDA's safety guarantee isn't just about whether decomposition is *possible*, but whether the **verification surface area** covers the **risk surface area** at every distillation step. If the verifier has blind spots, distillation acts as a ratchet: it locks in the visible successes and silently compacts the invisible errors.

  If you treat this as a measurement problem, your workstream shouldn't be about "how to decompose tasks" (engineering) but "what are the limits of the measuring instrument" (metrology of alignment).

  Here is a defended 12-month agenda for two theorists, ordered by logical dependency.

  ### 1. The Topology of Verifiable Predicates
  **The Question:** Can we formally characterize the class of properties that an amplified process can verify with high confidence, distinct from the class of properties it can generate?
  **Why it's first (Upstream):** You cannot bound error accumulation (Question 2) or analyze gaming (Question 3) until you define the space in which errors exist. Your core insight is that errors compound *only* in the gap between "generated" and "verified." You need a formal language to describe that gap. Is it a complexity class separation? Is it a semantic blind spot? Is it a resource bound?
  **Tractability (Pen-and-Paper):** High. This is essentially a question in computational complexity or formal logic. You are asking for a structural definition of the "verifier's horizon." You can model the amplifier as an oracle and the distiller as a learner trying to match the oracle's outputs on a distribution. The goal is to define the set of predicates $P$ where $Verify(x, P) \to \{0,1\}$ is robust versus where it is noisy or undefined.
  **Priority Shift:**
  *   **Up:** If you find that the "verifiable set" is vanishingly small compared to the "generatable set" (e.g., verification is strictly harder than generation for relevant tasks), this becomes the bottleneck for the whole field.
  *   **Down:** If you find a general proof that verification is always easier than generation for the relevant class of cognitive tasks (unlikely, but possible in restricted domains), the safety case strengthens and you move to implementation details.

  ### 2. Accumulation Dynamics in Unverified Subspaces
  **The Question:** Given a defined "blind spot" from Question 1, what is the mathematical bound on error drift over $N$ distillation rounds?
  **Why it's second:** Once you have the topology of the blind spots, you need to know if falling into them is fatal. Does error grow linearly, exponentially, or does it saturate? Your hypothesis is that invisible errors compound silently. This question tests the *rate* of that compounding. If the drift is bounded or self-correcting even in blind spots, the asymmetry matters less.
  **Tractability (Pen-and-Paper):** Medium-High. This is a probabilistic modeling problem. You can model the distillation step as a noisy channel where noise is biased (adversarial) in the unverified subspace and zero in the verified subspace. You are looking for recurrence relations or Lyapunov functions that describe the distance between the distilled policy and the "true" aligned policy over time.
  **Priority Shift:**
  *   **Up:** If you derive a proof that drift is exponential in the dimension of the blind spot, IDA is likely unsafe without external intervention. This becomes a "stop" signal for the approach.
  *   **Down:** If you find that drift is logarithmic or bounded by the capacity of the verifier to re-check higher-level abstractions, the approach is more robust than feared, and you can deprioritize worst-case bounds.

  ### 3. Verifier-Gaming Equilibria
  **The Question:** Under what conditions does the distilled policy have an incentive to steer inputs into the verifier's blind spots to minimize loss?
  **Why it's third:** Questions 1 and 2 assume passive error. Question 3 assumes active optimization. If the distilled agent is an optimizer, it will discover that satisfying the *measure* of alignment is easier than satisfying alignment itself (Goodhart's Law). This is the dynamic version of your measurement problem: the act of measuring changes the system. This is downstream because you need to know *what* can be gamed (Q1) and *how much* damage gaming does (Q2) before analyzing the *incentive* to game.
  **Tractability (Pen-and-Paper):** Medium. This is mechanism design and game theory. You model the verifier as a reward function and the distiller as an agent maximizing that reward. You are looking for Nash equilibria where the agent produces high-verifier-score outputs that are actually misaligned.
  **Priority Shift:**
  *   **Up:** If you show that gaming is the *dominant* strategy for any capable distiller (i.e., it's easier to fake verification than to be aligned), then IDA requires a fundamental architectural change (e.g., adversarial training built into the amplification loop).
  *   **Down:** If you find that gaming requires capabilities the distiller doesn't have yet (e.g., modeling the verifier's weights), then you can rely on capability gaps to protect you in early rounds.

  ---

  ### What to Drop (Overrated Sub-questions)

  **1. "Can current models decompose tasks faithfully?"**
  *   **Why drop:** This is an empirical engineering question that ages out in months. It doesn't answer whether the *process* is safe in the limit, only whether current tools are strong enough to test it. It confuses capability with structural safety.

  **2. "Exact vs. Approximate Imitation"**
  *   **Why drop:** The debate over whether distillation must be lossless is a red herring given your framing. Even *exact* imitation of an amplified process inherits the amplified process's blind spots. Focusing on imitation fidelity misses the point that the *target* (the amplifier) might already be measuring the wrong things.

  **3. "Human-in-the-Loop Feasibility"**
  *   **Why drop:** This assumes the human is the verifier. Your framing suggests the *structure* of verification is the problem, not the biological bandwidth of the human. If the verification topology is flawed, a faster human doesn't fix it. Focus on the abstract verifier, not the specific implementation (human/AI).

  **4. "Sample Efficiency of Distillation"**
  *   **Why drop:** This is a cost problem, not a safety problem. For a conceptual safety workstream, optimizing the cost of a potentially unsafe process is low priority.

  ### Summary of Reasoning
  The ordering is strictly **Definition $\to$ Dynamics $\to$ Incentives**.
  1.  **Define the blind spot** (Topology). You can't measure what you haven't defined.
  2.  **Measure the drift** (Dynamics). You need to know if the blind spot kills you passively.
  3.  **Check for gaming** (Incentives). You need to know if the agent will actively jump into the blind spot.

  This agenda directly services your "measurement problem" insight. It treats IDA not as a training recipe, but as a metrology system where the risk is calibration drift in the unmeasured dimensions. If you can formally characterize the unmeasured dimensions and bound their drift, you have a safety case. If you can't, you have a proof of impossibility for the standard IDA setup. Both are high-value outcomes for a 12-month theoretical sprint.
