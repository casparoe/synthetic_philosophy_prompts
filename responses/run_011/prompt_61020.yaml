answer: |-
  **Brainstorming Candidate Decision Rules**
  Derived from the five precedents, four candidate rules emerge:
  1.  **Corroborated Novel Fact:** Renewal requires empirical confirmation of a previously unforeseen prediction (Precedent 1).
  2.  **Uncorroborated Excess Content:** Renewal requires new predictions derivable from the programme that the predecessor version could not generate, even if empirical confirmation is pending due to technical constraints (Precedent 2).
  3.  **Non-Ad Hoc Modification:** Renewal turns on whether protective belt modifications add testable content rather than merely absorbing anomalies via free parameters (Precedents 3 and 4).
  4.  **Heuristic Fertility:** Renewal credits the generation of usable tools/problems for other programmes, regardless of the programme's own empirical trajectory (Precedent 5 dissent).

  **Analysis for Programme Review Panel**

  **(a) Consistency and Load-Bearing Precedents**
  Rules 1 and 3 are mutually reinforcing regarding empirical substance but strain against Precedent 2, which waived corroboration. Precedent 2 is load-bearing for theory-driven work; without it, any programme requiring new instrumentation would face automatic defunding. Precedent 5 is the critical fault line. The majority decision defunding the epidemiology toolkit establishes that heuristic fertility (Rule 4) is insufficient for renewal without empirical progress. Therefore, Rule 4 is rejected as a standalone criterion. The consistent thread across 1, 2, 3, and 5 (majority) is that the programme must exhibit *theoretical* progress (excess content or non-ad hoc modification), while *empirical* progress (corroboration) is preferred but flexible regarding timing if technically constrained.

  **(b) Recommended Verdict**
  I recommend **renewal**, conditional on the programme committing to report the results of the scheduled 18-month test at the mid-cycle review. The programme satisfies Rule 3 (Non-Ad Hoc Modification): the auxiliary hypothesis regarding the transfer vector implies a distinct, independently testable signature, unlike the free parameter in Precedent 4. It also satisfies Rule 2 (Uncorroborated Excess Content): the novel signature prediction exceeds the predecessor version's content, and the delay is due to protocol duration, not theoretical vagueness. The uptake of the surveillance metric is a secondary benefit but, per Precedent 5, cannot carry the renewal alone.

  **(c) Closest Analog**
  The closest analog is **2021 — Soil carbon cycling**. Both cases involve an anomaly triggering a protective belt modification (auxiliary hypothesis) that yields a new, independently testable signature. The analogy holds in the structural move from anomaly to testable auxiliary. It breaks on timing: the Soil programme secured corroboration *within* the cycle, whereas the AMR programme offers a prediction testable only *post*-decision. However, given Precedent 2 (Decision-making), this delay is permissible provided the test is concrete and scheduled. The complication regarding the original anomaly being a sampling artefact strengthens the case: if the anomaly was spurious, the auxiliary was not a desperate rescue but a theoretical expansion, making the recovery of the known pattern genuine explanatory gain rather than face-saving.

  **(d) Substantive Principles**
  By renewing, the panel commits to two principles. First, **"Novelty"** refers to facts ungenerated by the predecessor version of the theory, not necessarily unforeseen by the community. Recovering a known but previously unexplained pattern counts as excess content if the earlier model could not derive it. Second, **Corroboration** need not fall inside the funding cycle if the lag is imposed by technical or logistical constraints (e.g., longitudinal sampling), provided the test is specified and imminent. We are prioritizing the *potential* for empirical progress over *realized* confirmation, provided the potential is grounded in a non-ad hoc modification.

  **(e) Discriminating Hypothetical Case**
  To sharply discriminate between Rule 2 (Excess Content) and Rule 4 (Heuristic Fertility), consider this case: A programme produces no new predictions about its own core claims and recovers no anomalies. However, its modelling framework allows *three other* programmes to resolve their own conflicting data. Under Rule 2, this programme is degenerating and should be defunded. Under Rule 4, it is progressive and should be renewed. Our precedents (specifically Precedent 5 majority) dictate we defund, but this hypothetical forces us to ask if serving as a "service provider" for the research system constitutes a valid positive heuristic when the provider's own core is empirically stagnant.

  **(f) The Case for Defunding**
  Proponents of defunding argue that this programme exhibits a degenerating problemshift. They contend that recovering known anomalies is theoretically cheap compared to predicting novel facts, and that the "novel" prediction is merely a promise with no current empirical weight. From this view, the uptake of the surveillance metric confirms the programme has become a service utility rather than a knowledge generator. By renewing without current corroboration, the panel risks subsidizing a protective belt that absorbs contradictions without immediate empirical cost, violating the strict lesson of Precedent 5 that system utility does not equal theoretical progress.
