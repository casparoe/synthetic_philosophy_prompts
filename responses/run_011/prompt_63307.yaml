  Dear Sarah

  Please accept this letter as formal notification that I am resigning from my position as Head of Machine Learning at Meridian Freight Solutions, effective at the close of business on the last day of this month. This decision is not driven by compensation, nor by the usual friction between engineering and operations, but by a philosophical imperative that has become impossible to ignore. After years of deploying predictive models to optimize routing and forecast churn, I have come to understand the no-free-lunch theorems not merely as mathematical curiosities but as binding constraints on rational action. It has become clear to me that our entire modelling stack rests on a circular justification that I can no longer in good conscience endorse.

  The core issue lies in the evaluation of off-training-set error. When one averages this error uniformly over all target functions compatible with the observed data, the result is identical for every learner and for a blind guesser. This is not a heuristic observation but a theorem. It implies that for any two algorithms, there are loosely speaking as many priors favouring one as favouring the other. Consequently, no inductive method can be non-circularly preferred to any other without smuggling in assumptions about the target function that are themselves unjustified. To ship a gradient-boosted model instead of a random number generator is to assert a metaphysical preference without evidence.

  You might ask what should replace our current pipeline. I propose we abandon hold-out validation and cross-validation immediately. These procedures merely launder a prior as a measurement. When we select a model based on cross-validated accuracy, we are assuming that the future data will resemble the past data in specific ways, effectively baking in a prior about the smoothness or regularity of the world. The model selection committee claims to be assumption-free, but this is empty. They are right that cross-validation presupposes something like exchangeability in the data-generating process, but they are wrong to think this presupposition is neutral. It is a substantive claim about the universe that we have no right to make.

  In place of our current churn model, I recommend we substitute a uniformly random label generator. This is provably no worse on the relevant average than our current ensemble. If the average performance over all possible worlds is identical, then the random generator is as justified as any learned function, yet it avoids the computational cost and the ethical burden of pretending to know something we cannot know. We should stop pretending to predict delivery delays based on historical weather patterns when the theorem tells us that without assuming the future resembles the past, the history is irrelevant.

  Furthermore, I must address the firm's maximum-entropy-flavoured modelling assumptions. These are presented as engineering best practices but are actually metaphysical commitments disguised as neutrality. Specifically, we have conflated a prior that is uniform over bit patterns with one that is uniform over bit frequencies. We have been operating under the assumption that every possible string of outcomes is equally likely, which biases us towards balanced classes in large spaces. I argue we should instead assume every frequency of positive labels is equally likely. This treats the state where all shipments are delayed as equally probable as the state where half are delayed, which is a more truly agnostic stance on the nature of logistics failure. By continuing to use the standard uniform over patterns, we are implicitly betting on noise rather than structure.

  I understand this will disrupt the quarterly planning cycle. However, continuing to deploy models that cannot be distinguished from guessing on the only measure that counts is a fiduciary risk. I am confident that you will follow this argument and see the necessity of this pivot. I recognize, of course, that this confidence is itself a freely chosen prior on which I have decided to stake my remaining salary, but it is one I am willing to hold until my departure.

  Sincerely

  Arthur Penhaligon

  In reviewing the technical assertions made above, several distinctions must be drawn between the character's accurate recitations and their erroneous applications. The statement of the no-free-lunch theorem regarding averaged off-training-set error over all target functions is mathematically true as stated, as is the corollary about priors favouring algorithms equally. The claim that cross-validation presupposes exchangeability is also correct; it is not assumption-free. However, the character's confusion lies in applying a result about uniform averages over all conceivable functions to a specific business context where the target function is not drawn from that uniform distribution. The proposal to use a random generator is useless for specific tasks, and the preference for uniform over bit frequencies rather than patterns is a misunderstanding of what constitutes an uninformative prior in this context. The piece is least fair to defenders of meta-induction who argue that weighting predictors by past success escapes the result by restricting the hypothesis space to those actually encountered in our universe. A defender like Gerhard Schurz would object that the theorem ignores the pragmatic success of induction in the actual world, which is all we care about. I would change my mind about the character's argument failing if one could prove that the uniform measure is the only non-question-begging measure over hypothesis spaces, or that weighting predictors by past success does not in fact escape the result because the meta-inductor itself requires a prior that is subject to the same theorem. I suspect my own reasoning is most likely to have gone wrong in reconstructing the conditions under which the no-free-lunch theorem holds, specifically regarding the matching of priors to algorithms, as I may have loosened the requirement that the prior over functions must be uniform for the equality of error to hold strictly.
