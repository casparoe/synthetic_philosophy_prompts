  2.  **Deconstruct the Philosophy (Hacking's Looping Effects):**
      *   *Classification:* Experts create a category (e.g., "Multiple Personality Disorder").
      *   *Adoption:* People learn about the category and see themselves in it.
      *   *Interaction:* People change their behavior to align with (or resist) the category.
