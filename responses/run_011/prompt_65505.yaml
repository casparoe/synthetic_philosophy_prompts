answer: |-
  # Activity: The Taxonomy Protocol

  **Time:** 45 Minutes
  **Players:** 14 (4 Committee, 10 Subjects)
  **Materials:** Whiteboard + markers, Index cards (2 colors), Dot stickers (3 colors), Timer.

  ### The Fake Conditions
  *Use these exact names. They sound clinical but are 100% invented. The criteria are intentionally arbitrary to prevent mapping onto real-world diagnoses.*

  1.  **Tactile Recursion Syndrome (TRS)** – *Sticker: Red*
      *   **Definition:** Picking up an object, setting it down, and touching it again within 10 seconds.
  2.  **Latency Response Variance (LRV)** – *Sticker: Blue*
      *   **Definition:** Waiting longer than 5 seconds to begin speaking after a direct question is asked.
  3.  **Gaze Anchor Displacement (GAD)** – *Sticker: Green*
      *   **Definition:** Looking at the whiteboard or ceiling while addressing another person directly.

  ---

  ### Setup (5 Minutes)
  1.  **Select the Committee:** Pick 4 students to be the "Diagnostic Board." They sit at the front near the whiteboard. Give them the markers.
  2.  **The Subjects:** The remaining 10 students sit in the main area. Give each Subject 2 index cards: one marked **FIT** (Green), one marked **MISFIT** (Red).
  3.  **The Stakes:** Tell the Committee their goal is **Accuracy Budget**.
      *   They start with **20 Points**.
      *   Every time a Subject holds up **FIT**, the Committee gains **1 Point**.
      *   Every time a Subject holds up **MISFIT**, the Committee loses **2 Points**.
      *   *Why this matters:* To win, the Committee needs the Subjects to feel understood. If the label feels wrong, the Committee loses heavily.

  ### Round 1: Baseline Classification (10 Minutes)
  1.  **Write Criteria:** The Committee writes the three definitions (TRS, LRV, GAD) on the whiteboard exactly as written above. They cannot change them yet.
  2.  **Observe:** The Committee observes the Subjects for 3 minutes while Subjects chat normally.
  3.  **Diagnose:** The Committee approaches Subjects and places a colored sticker on their shirt based on the behaviors they saw. A Subject can have multiple stickers.
  4.  **Vote:** Once labeled, each Subject privately decides: "Does this label accurately describe what I just did?"
      *   If yes, hold up **FIT**.
      *   If no, hold up **MISFIT**.
  5.  **Score:** Tally the Committee's points. (Expect some MISFITS; definitions are rigid).

  ### Round 2: The Feedback Loop (10 Minutes)
  1.  **Secret Instruction:** Hand a small slip of paper *only* to the Subjects who received at least one sticker.
      *   *The Slip reads:* "You have been identified. To help the Committee understand your condition, **amplify the behavior** associated with your sticker for the next 5 minutes. If you have TRS, touch things more. If LRV, pause longer. Make it undeniable."
      *   *Subjects with NO stickers:* Continue acting normally.
  2.  **Observe:** The Committee watches. The labeled Subjects will now be exaggerating the specific behaviors (e.g., deliberately waiting 6 seconds to speak, staring intensely at the whiteboard while talking).
  3.  **Re-Evaluate:** The Committee must decide: Do the original definitions on the board still cover this new, amplified behavior?
      *   *The Trap:* The original definition said "Waiting longer than 5 seconds." Now someone is waiting 15 seconds. Is that still LRV? Or is it something else? The behavior has shifted because of the label.
  4.  **Vote:** Subjects vote **FIT** or **MISFIT** again.
      *   *Predictable Outcome:* Many will vote **MISFIT**. The exaggeration feels performative, not "natural." The original definition didn't account for *intentional* amplification. The Committee loses points.

  ### Round 3: Revision (10 Minutes)
  1.  **Rewrite:** The Committee is allowed to erase and rewrite the definitions on the whiteboard. They must update the criteria to account for the behavior they created in Round 2.
      *   *Example:* Changing "Waiting > 5 seconds" to "Waiting > 5 seconds, including intentional pauses."
  2.  **Re-Diagnose:** Committee re-applies stickers (or adds new ones).
  3.  **Final Vote:** Subjects vote **FIT** or **MISFIT**.
  4.  **Final Score:** Tally points. The goal is to recover the lost points by acknowledging the change in behavior.

  ### Debrief (10 Minutes)
  *Do not use the phrase "Looping Effects" until the very last sentence.*

  1.  **Ask the Committee:** "Why did you have to rewrite the board in Round 3? What changed?"
      *   *Target Answer:* The people changed. The behavior got stronger/weirder because we labeled it.
  2.  **Ask the Subjects:** "How did having the sticker change what you did? Did you feel more 'TRS' after you got the red dot?"
      *   *Target Answer:* I started watching myself. I tried to fit the card.
  3.  **Ask the Group:** "In science, if you label a rock 'granite,' does the rock start acting more like granite? No. But when we label people, they react. The label becomes part of the person."
  4.  **The Limitation:** Be honest. "In this game, the loop took 10 minutes. In real life, this takes decades. In this game, you knew it was a game. In real life, the stakes are medical records, medication, and identity. We simulated the mechanism, but not the weight."
  5.  **The Gamers:** "Some of you might have tried to break the scoring—getting labels you didn't deserve or refusing them to tank the Committee. That's actually part of the real phenomenon too. People resist labels, or they shop for them. That resistance *also* forces the Committee to change the rules."
  6.  **The Reveal:** "The philosopher Ian Hacking calls this **The Looping Effects of Human Kinds**. We classify people, people change, we re-classify. The category and the person evolve together."

  ---

  ### Troubleshooting & Safety Notes

  **1. Protecting the Diagnosed Students**
  *   **The Risk:** Even with fake names, a student with ADHD might feel targeted by "Somatic Drift."
  *   **The Fix:** The arbitrary criteria are your shield. Emphasize that TRS is *specifically* "touching an object twice," not just "fidgeting." If a student feels uncomfortable, they have the **MISFIT** card as a shield. They can reject the label without argument.
  *   **Instruction to Committee:** Before starting, tell the Committee: "You are grading *behaviors*, not *people*. Do not use prior knowledge of your friends. Only grade what you see in the room."

  **2. The Gamers (Predictable Failure Points)**
  *   **The Over-Labelers:** Two kids will try to get *every* sticker to mess up your scoring.
      *   *Counter:* Remind the Committee they lose points if the Subject votes **MISFIT**. If a Gamer takes a sticker but votes **MISFIT**, the Committee is penalized. The Committee will learn to stop labeling the Gamers to protect their score.
  *   **The Nihilists:** Two kids will refuse to participate or vote **MISFIT** on everything.
      *   *Counter:* Acknowledge this in the debrief (as noted above). Their resistance is data. It shows that classification is a negotiation, not a decree.

  **3. What This Game Can't Do**
  *   **Internal Experience:** The game shows behavioral change, but it can't simulate the *internal* shift of identity (how it feels to *be* "disordered"). You have to supply that in the debrief by asking "How did it feel to wear the sticker?"
  *   **Power Dynamics:** In the game, the Committee is arbitrary. In real life, the "Committee" (psychiatrists/insurance) holds power over housing, jobs, and meds. The game is low-stakes; remind them the real loop has teeth.
  *   **Time:** Real looping happens over generations. This is a snapshot.

  **4. Room Logistics**
  *   **The Squeaky Chair:** Put the Committee in the squeaky chairs. Every time they rewrite the board (Round 3), the squeak will punctuate their uncertainty. Use it.
  *   **Index Cards:** If you run out of space on the whiteboard, use the index cards to write "Addendums" and stick them over the old rules. It looks more bureaucratic.

  **5. Timing Discipline**
  *   You are the Timekeeper. Do not let Round 1 drag. If the Committee is arguing over a definition, cut them off: "Write it down as is. You can fix it in Round 3." The friction of imperfect rules is necessary for the lesson to work.
