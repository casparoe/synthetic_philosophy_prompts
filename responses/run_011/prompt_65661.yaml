answer: |-
  This is a sophisticated request that cuts to the core of modern algorithmic fairness theory. You are asking for the *specification* of fairness—the engineering constraints and logical boundaries—rather than a simple pass/fail judgment. This is the correct approach because "fairness" is not a single property you can measure; it is a set of competing mathematical constraints.

  The vendor's summary describes what is known in the literature as the **Impossibility Trinity** of fairness. They claim to satisfy three conditions simultaneously while admitting that base rates (the underlying frequency of failure) differ between groups. Mathematically, this is impossible.

  Below is the specification you requested. It outlines the requirements any defensive claim of fairness must meet, the distinctions that must remain separate, the logical contradictions inherent in the vendor's claim, and the specific pitfalls regarding your data and deployment.

  ### 1. Level of Analysis: Score vs. Decision
  A fairness specification must distinguish between the *risk score* itself and the *threshold* used to make a decision.

  *   **Score-Level Claim (Calibration):** This asserts that the number output by the model means the same thing for everyone. If a student in Group A and a student in Group B both receive a risk score of 0.8, they must have the same probability of failing (e.g., 80%).
      *   *Motivation:* Trust and interpretability. If the score means "80% risk" for one group but "50% risk" for another, the score is not a universal measure of risk.
  *   **Decision-Level Claim (Error Rate Balance):** This asserts that when we draw a line (threshold) to assign tutoring, the mistakes are distributed equally.
      *   *Motivation:* Burden sharing. We do not want one group to suffer more false alarms (unnecessary tutoring) or more missed failures (lack of support) than another.
  *   **The Conflict:** You can have a calibrated score, but if you use the *same threshold* for both groups, your error rates will differ if base rates differ. If you adjust thresholds to equalize error rates, your scores are no longer calibrated (a score of 0.8 means different things for different groups). The vendor claims both; this is the first specification failure.

  ### 2. Critical Distinctions (What Cannot Be Collapsed)
  To evaluate the vendor, you must keep these three distinctions separate. Collapsing them allows vendors to hide trade-offs.

  *   **Calibration vs. Error-Rate Balance:**
      *   *Calibration* is about the meaning of the probability (Predictive Parity).
      *   *Error-Rate Balance* is about the distribution of mistakes (Equalized Odds).
      *   *Specification:* You must choose which one is the priority. You cannot demand both when base rates differ.
  *   **Group Fairness vs. Individual Fairness:**
      *   *Group Fairness* looks at averages across demographics (e.g., "Do Black and White students have the same false positive rate?").
      *   *Individual Fairness* looks at similar students (e.g., "Do two students with identical academic profiles get the same score, regardless of group?").
      *   *Specification:* A model can satisfy group fairness by treating dissimilar individuals differently to balance the averages. A defensible specification must require Individual Fairness (consistency) as a baseline before attempting Group Fairness.
  *   **The Label Predicted vs. The Harm at Stake:**
      *   *The Label:* Course failure (binary).
      *   *The Harm:* Loss of summer freedom, stigma, resource misallocation, or alternatively, the harm of *not* receiving tutoring when needed.
      *   *Specification:* Fairness metrics usually optimize for the *Label*. A defensible specification must optimize for the *Harm*. If the tutoring is ineffective, flagging a student is a harm, not a help.

  ### 3. Non-Negotiable Requirements
  These are requirements that should not be subject to trade-offs. They are not commitments of one "camp" of fairness but prerequisites for a valid system.

  *   **Construct Validity:** The score must measure what it claims to measure. If it claims to measure "academic risk," it cannot be primarily measuring "attendance" or "socioeconomic status" unless those are causally linked to the risk in a way you accept.
  *   **Anti-Classification (with nuance):** Generally, the protected attribute (race, gender) should not be an *input* to the score.
      *   *Nuance:* While statistically you sometimes need the attribute to *correct* bias (e.g., calibrating separately), in a public school deployment, using race as a direct input is often legally and politically non-negotiable. The model should be "blind" at inference, even if audited by group.
  *   **Monotonicity:** Higher risk scores must always correspond to higher (or equal) estimated risk. A student with more risk factors should never receive a lower risk score than a student with fewer.

  ### 4. The Impossibility Result (The Vendor's Contradiction)
  This is the most critical technical point for your review.

  *   **The Conditions:**
      1.  **Calibration:** Same score = same failure rate across groups.
      2.  **False Positive Rate Balance:** Same share of non-failers flagged across groups.
      3.  **True Positive Rate Balance:** Same share of failers flagged across groups.
  *   **The Constraint:** The vendor concedes **Base Rates Differ** (e.g., Group A fails at 10%, Group B fails at 20%).
  *   **The Theorem:** It is mathematically proven (Chouldechova, 2017; Kleinberg et al., 2016) that **you cannot satisfy all three conditions simultaneously if base rates differ.**
      *   If you satisfy Calibration and Base Rates differ, your Error Rates (FPR/TPR) *must* differ.
      *   If you satisfy Error Rate Balance and Base Rates differ, your Calibration *must* differ (the scores mean different things).
  *   **Specification Requirement:** A defensible vendor must explicitly state which of the three they are *sacrificing*. Claiming all three is a specification error, implying either mathematical ignorance or deception.

  ### 5. The "Killer" Requirement
  You asked which single requirement, if pressed, rules out the largest number of otherwise attractive candidates.

  *   **The Requirement:** **Equalized Odds (Error Rate Balance).**
  *   **Why:** Demanding that False Positive Rates and True Positive Rates be equal across groups is the most restrictive constraint.
      *   It forces you to use different decision thresholds for different groups (e.g., Group A needs a score of 0.5 to get tutoring, Group B needs 0.7).
      *   This violates the intuition of a "universal score" (Calibration).
      *   It often requires rejecting high-performing models that are slightly imbalanced in favor of lower-performing models that are balanced.
      *   If you insist on Equalized Odds *and* Calibration *and* differing base rates, you rule out **every possible model**. There are no candidates left.

  ### 6. Addressing Your Two Specific Points

  #### A. The Proxy Label Problem
  *Question:* Can requirements be stated when the predicted label (teacher-assigned failure) is only a proxy for the harm?

  *Answer:* **No, not without qualification.**
  Standard fairness metrics (like FPR balance) assume the label ($Y$) is "Ground Truth." They assume that if the model predicts failure and the student fails, the model was "right."
  *   **The Specification Gap:** If teacher-assigned failure is biased (e.g., teachers subconsciously grade certain demographics harder), then $Y$ is corrupted.
  *   **The Consequence:** A model that achieves "Fairness" relative to a biased label is simply **automating the bias**. If Group B is graded more harshly, they have a higher base rate of "failure." A "fair" model will flag more Group B students.
  *   **Requirement:** You must add a **Label Validity Audit**. You cannot define fairness metrics on $Y$ until you establish that $Y$ does not contain disparate impact itself. If the label is a proxy, the fairness metrics are measuring consistency with bias, not justice.

  #### B. The Missing Deployment Requirement
  *Question:* Does a real deployment like ours force a requirement that these debates usually leave out?

  *Answer:* **Yes: Actionable Recourse.**
  Most fairness literature treats the decision as the end of the story (the student gets the loan or doesn't). In a school setting, the decision is the start of an intervention.
  *   **The Requirement:** **Recourse.** A student must be able to understand *what factors* led to their flag and have a feasible path to change that status in the future.
  *   **Why it's missing:** Static fairness debates focus on *allocation* (who gets the resource). They ignore *agency*.
  *   **Why it matters here:** If the score is based on immutable characteristics (e.g., middle school grades that cannot be changed) or opaque combinations of factors, the student is sentenced to summer school without the ability to avoid it next year. A defensible specification must require that the top drivers of the risk score are **modifiable** by the student (e.g., attendance, homework completion) rather than static (e.g., past GPA, demographic proxies).
  *   **Secondary Deployment Requirement:** **Intervention Validity.** You must measure whether the tutoring actually *reduces* the risk. If you flag students correctly but the tutoring doesn't help, you are inflicting harm (lost summer) without benefit. Fairness debates rarely account for the *efficacy of the remedy*.

  ### Summary for Your Review
  To write your specification, do not ask "Is this fair?" Ask the vendor to resolve the following contradictions:

  1.  **Select Two:** Since base rates differ, you must drop one of the three "fairness" claims (Calibration, FPR Balance, TPR Balance). Which one did you drop, and why?
  2.  **Label Audit:** How have you verified that "teacher-assigned failure" is not itself biased against specific demographic groups?
  3.  **Recourse:** What are the top three modifiable factors a student can change to lower their risk score next year?
  4.  **Efficacy:** What evidence do you have that mandatory tutoring improves outcomes for students with this specific risk profile?

  If the vendor cannot answer these, the score meets none of the non-negotiable requirements for a defensible deployment.
