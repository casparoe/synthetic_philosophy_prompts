answer: |-
  **I. The Presuppositions of the Gradual-Replacement Argument**

  To analyse the collision between the gradual-replacement argument (GRA) and the split-brain case, we must first distil the former to its structural bones. The GRA is fundamentally a sorites argument applied to diachronic identity. It proceeds on three specific presuppositions that are often tacit in the uploading literature.

  First, there is the **Presupposition of Functional Isomorphism**. The argument assumes that at every step of the replacement, the causal role of the removed biological component is perfectly discharged by the artificial substitute. It presupposes that identity tracks functional organisation rather than material constitution. However, it goes further: it assumes that the *global* functional architecture remains stable. It is not merely that the artificial neuron fires when the biological one would have; it is that the system-wide causal pathways remain intact.

  Second, there is the **Presupposition of the Single Subject**. The argument assumes that there is a single locus of experience, $S$, at time $t_1$, and that the question is whether this same $S$ exists at $t_2$. It treats the unity of consciousness as a background constant. The logic requires that $S_t$ and $S_{t+1}$ are numerically identical because the change between them is negligible. If there were two subjects emerging at any step, the logic of 'survival' would collapse into a logic of 'fission'. The GRA presupposes unity to prove continuity.

  Third, there is the **Presupposition of Negligibility**. This is the sorites engine: no single step is large enough to disrupt the metaphysical relation of identity. This relies on a specific metric of 'size'. In the standard formulation, 'size' is measured by the proportion of the system altered. One neuron out of eighty billion is negligible. This presupposes that the *location* and *topological role* of the alteration are less significant than the *quantity* of matter altered. It assumes the brain is sufficiently redundant or distributed that no single junction is a 'keystone' whose removal collapses the arch of identity.

  **II. Mapping the Split-Brain Episode onto the Argument**

  When we map the commissurotomy cases onto these presuppositions, the alignment is imperfect, revealing a category tension between diachronic replacement and synchronic division.

  The analogue of 'replacement' in the split-brain case is not substitution, but **subtraction**. The corpus callosum is severed; nothing is put in its place. In the GRA, function is maintained by the substitute. In the split-brain case, a specific function—interhemispheric integration—is deliberately removed. This challenges the Presupposition of Functional Isomorphism. The GRA argues that if you keep function constant, identity survives. The split-brain case shows that if you alter a specific structural connectivity, function changes (specifically, the coordination of information), and identity (or at least unity) may fracture.

  Does severing a commissure count as a 'small change' under the Presupposition of Negligibility? Physically, the mass of the corpus callosum is a tiny fraction of the total brain. If the GRA's metric is purely quantitative (mass or neuron count), the cut is negligible. However, functionally, it is catastrophic for unity. It removes the bridge between two massive processing clusters. This suggests the GRA's metric of negligibility is flawed if it relies on quantity rather than topological criticality. A cut to a specific fibre bundle is not equivalent to the replacement of a random neuron in the cortex. The split-brain case demonstrates that 'small' physical changes can be 'large' functional changes if they occur at bottlenecks of integration.

  Furthermore, the split-brain case interrogates the Presupposition of the Single Subject. The GRA assumes one subject persists through time. The split-brain data suggests that what we call 'one subject' may be a coalition of subsystems that can be decoupled. If the coalition can be split synchronically (left and right hemisphere operating as distinct agents in one skull), the assumption that there is a single $S$ to track diachronically becomes an empirical claim rather than a metaphysical given.

  **III. Accommodation, Misdescription, and the Evidence of Report**

  Where can the GRA accommodate these findings, and where does it break?

  The GRA can accommodate the split-brain data only by retreating to a **sub-personal level**. It could argue that the 'person' is the whole organism, and the hemispheres are merely organs. On this view, the patient remains one person who is simply disabled in terms of information transfer. However, this misdescribes the phenomenological evidence. The reports of conflicting volitions (one hand fighting the other) and the dissociation of knowledge (left hand knows what the mouth cannot name) suggest two centres of agency and awareness. If the GRA insists there is still only one subject, it must claim that this subject is profoundly self-alienated. But this strains the concept of a 'subject' to the point of uselessness. A subject that does not know what it is doing, or acts against its own will in real-time, fits the definition of *two* subjects better than *one* impaired subject.

  This brings us to the evidence of report. The GRA typically relies on psychological continuity, often verified by memory and first-person report. The split-brain case undermines the reliability of these reports. The 'interpreter' mechanism in the left hemisphere confabulates explanations for actions initiated by the right. The patient reports a unified rationale where none exists. If the reporting module can lie about the unity of the present moment, why should we trust its report on the continuity of identity over time? The GRA assumes that if a person says 'I am the same person', and their psychology is continuous, they are. The split-brain case shows that the 'I' speaking may be a press secretary for a fragmented government, supplying a unified narrative that does not match the underlying reality. This suggests the GRA is building on testimony that is structurally prone to error regarding unity.

  **IV. The Sorites Premise and the Scale of the Lesion**

  We must address the sorites-shaped premise directly: *No individually negligible alteration can destroy the subject.*

  The split-brain case appears to be a counterexample, but only if we accept the physical definition of 'negligible'. If 'negligible' means 'small mass', then the commissurotomy destroys the premise. A tiny lesion produced two streams of volition. However, a defender of the GRA might argue that the premise was never about physical quantity, but about *functional disruption*. They would argue the premise should read: *No alteration that leaves global functional integration intact can destroy the subject.*

  If we amend the premise this way, the split-brain case ceases to be a counterexample, but it renders the GRA vacuous for the purposes of uploading. Why? Because we do not know *which* alterations leave global functional integration intact until we have already determined the criteria for identity. The GRA is supposed to tell us whether uploading preserves identity. If the premise requires us to know beforehand whether 'integration' is preserved, we are begging the question. The split-brain case teaches us that integration is fragile and dependent on specific physical pathways. Therefore, the sorites premise cannot be a priori; it is an empirical generalisation that the split-brain data falsifies in its strong form. It shows that there *are* sharp boundaries in functional space, even if there are none in physical space.

  **V. Implications for Uploading and Fission**

  This leads to the most critical implication for your seminar's focus: uploading.

  If the gradual replacement is carried out on a system whose functional architecture permits branching, the split-brain case suggests the theory delivers **two survivors**, not one. The split-brain patient shows that a single biological substrate can house two distinct streams of consciousness if the integration layer is compromised or duplicated.

  In an uploading scenario, if the emulation is faithful but the architecture allows the state to be copied (which is trivial in digital systems), we face fission. The GRA tries to argue that the original survives the upload. But the split-brain analogy warns that if the 'callosal' constraints of the biological brain are not perfectly replicated in the emulation—if the emulation allows for parallel processing that the biological brain forced into serial unity—we may inadvertently create a split-brain scenario on a macro scale.

  Does this turn uploading into fission? Yes, if the functional architecture of the upload permits the divergence of streams that the biological brain kept unified. Parfit's conclusion follows: identity does not hold in cases of fission. If the upload results in two psychologically continuous successors, the original is identical to neither. What matters is survival (psychological continuity), not identity. The split-brain case strengthens the Parfitian view by showing that 'what matters' (conscious experience, agency) can divide even when the physical container (the skull) remains one. It suggests that identity is not a deep further fact, but a description of causal continuity that can branch. The GRA attempts to secure identity; the split-brain case suggests it should instead secure *continuity*, and admit that identity may be lost if branching occurs.

  **VI. The Fragility of the Empirical Record**

  We must treat the empirical record with the caution it demands. The 'classic' split-brain picture (two distinct minds in one skull) has been challenged by later work suggesting considerable interhemispheric integration remains via subcortical routes, and that the testing conditions (brief, lateralised stimuli) are artificial ecologies that force a division not present in normal life.

  **If the classic results are substantially over-read:** If the hemispheres are more integrated than Sperry suggested, and the 'two minds' are largely an artefact of testing protocols, then the threat to the GRA diminishes. It would imply that the brain's unity is more robust, relying on redundant pathways. In this scenario, the 'Single Subject' presupposition is empirically safer. Uploading would be less likely to accidentally trigger fission, provided the emulation captures the subcortical integration loops. The split-brain case would then function as a warning about *testing limitations* rather than a metaphysical revelation about duality.

  **If the classic results stand:** If there are indeed conditions under which one brain sustains two distinct centres of agency, the threat is severe. It implies that unity is contingent on specific, perhaps fragile, connectivity. For uploading, this means the 'functional organisation' that must be preserved is not just local computation but specific global binding mechanisms. If the emulation fails to replicate the 'callosal' constraints (perhaps because digital architectures are inherently more parallel), fission becomes a high probability.

  We must flag the uncertainty: we do not yet have a consensus on the phenomenology of split-brain patients in naturalistic settings. Some reports suggest a unified experience returns over time post-surgery. If unity is restored despite the cut, it suggests the 'Single Subject' is more resilient than the acute data implies. This would support the GRA's claim that identity can survive significant structural alteration, provided functional adaptation occurs.

  **VII. Verdict: Silence, Anomaly, or Confirmation?**

  Where is the gradual-replacement argument silent? It is silent on **synchronic unity**. The GRA is a diachronic argument (time $t_1$ to $t_2$). It assumes the subject at $t_1$ is unified. It has no resources to analyse whether the subject at $t_1$ is actually one or many. It takes the unity of the present moment as a given. The split-brain case explodes that given. The GRA cannot explain the split-brain case because it lacks the vocabulary to describe a divided subject at a single time slice.

  Is the case a confirmation, an anomaly, or something unanticipated?

  It is not a confirmation. The GRA predicts survival through change; the split-brain case suggests fragmentation through change.
  It is not merely an anomaly. An anomaly is a data point that contradicts a prediction. Here, the contradiction is deeper: it targets a presupposition.
  It is best understood as a **boundary condition** the argument was never designed to anticipate. The GRA assumes a topology of identity that is linear and singular (a single thread through time). The split-brain case reveals a topology that can be branching and parallel (a braid that can separate).

  **Final Account**

  The split-brain episode functions as a reductio of the naive version of the gradual-replacement argument. It demonstrates that 'functional organisation' is not a monolith; it contains distinct layers (local computation vs. global integration). The GRA assumes swapping local components preserves the whole. The split-brain case shows that altering the integration layer, even with minimal physical subtraction, fractures the subject.

  For your seminar, the lesson is this: The gradual-replacement argument can support the claim that an upload is a continuation *only if* it adds a clause excluding fission. It cannot guarantee numerical identity. The split-brain data forces the conclusion that if the uploading process allows for the decoupling of integrated streams (which digital replication inherently does), the result is not 'survival' in the strict sense, but 'fission'. The argument does not fail entirely, but it must yield to Parfit's conclusion: what we care about is psychological continuity, and that can exist without identity. The split-brain patient is the living proof that continuity matters more than identity, for two continuers can exist where one identity cannot. The GRA tries to save identity; the split-brain case shows us why we should perhaps stop trying.
