answer: |-
  Here are direct answers to your eight questions, followed by a brief comment on the overall trajectory of the argument.

  **1. Hardened Politics vs. Winner's Design Category**
  You should treat "hardened politics" as a specific mechanism within Winner's first category, not as a co-equal third category. Winner's first category covers artifacts built to settle community affairs or enforce hierarchy. Your "hardened" examples (automated gates, prepaid meters) fit this perfectly. The distinction you are drawing is not about *whether* the artifact was designed for political ends, but *how* it enforces them: specifically, by removing human discretion.

  If you keep "hardened" as a separate top-level category, you invite the objection that you are simply subdividing Winner's first point without adding ontological weight. However, there is a reply available. You can argue that Winner focuses on the *outcome* (exclusion, hierarchy), whereas you are focusing on the *stability of the enforcement mechanism*. A bridge (frozen) excludes buses physically. A staffed gate (leased) excludes buses via human decision. An automated gate (hardened) excludes buses via code that cannot be argued with. The "hardened" category is useful if you define it by the *delegation of authority to a non-negotiable system*. Do not claim it is ontologically distinct from Winner's first category; claim it is a distinct *mode* of political enforcement that explains the drift toward automation.

  **2. Frozen vs. Leased: Kind or Degree?**
  Do not rely on the rate of decay. Everything decays, and arguing about whether a bridge lasts fifty years versus a painted line lasting one year is a difference of degree that will not sustain a philosophical distinction.

  Instead, lean into the budget line distinction you hinted at: Capital versus Operating. This is a difference in kind regarding governance. Capital expenditures (building the bridge) are one-off political decisions that are hard to reverse. Operating expenditures (painting the line, paying the gatekeeper) are recurring political decisions that are renegotiated every budget cycle. This makes "frozen" politics a matter of *infrastructure policy* and "leased" politics a matter of *administrative policy*. This saves the taxonomy. If you abandon the taxonomy, you lose the hook for your maintenance argument. Keep the taxonomy, but ground it in institutional economics (capital vs. operating) rather than physical durability.

  **3. The Zero-Maintenance Counterfactual on Three Cases**
  This test is your strongest heuristic, but it breaks on the definition of "maintenance."

  *   **Flood Levee:** The test returns "Leased." A levee requires vegetation control, erosion repair, and pump maintenance. If the budget goes to zero, it fails. However, intuitively, a levee feels "frozen" like a bridge. The test breaks here because it conflates *structural integrity* with *political function*. The political function (protecting some land, flooding others) persists as long as the structure stands, but the structure requires maintenance. You must clarify whether "maintenance" means "keeping it working" or "enforcing the rule."
  *   **Street-Name Sign:** The test returns "Frozen," but this is misleading. A sign requires no power and little repair. However, its political function (naming, claiming ownership) relies on *semantic* maintenance. If the society forgets the language, the sign loses power. The test ignores cultural maintenance.
  *   **Radioactive Waste Repository:** The test returns "Leased," which is the correct but surprising answer. These repositories are designed to be "frozen" for millennia, but they require active institutional maintenance (knowledge transmission, marker upkeep) to remain legible. If the institution collapses, the politics fail. This case defeats the test if you define maintenance only as physical repair. It supports your argument if you define maintenance as "sustaining the condition for the artifact's function."

  **Verdict:** The test works only if you explicitly define maintenance to include institutional and semantic upkeep, not just physical repair. If you do not broaden the definition, the levee and the repository will break your argument.

  **4. Characterization of Winner and Constructivism**
  Your characterization of Winner is standard for seminar purposes and not flatly wrong. You correctly identify the two modes: consequences of design/invention and inherent requirements of the technology.

  Your characterization of the constructivist reply is also acceptable: that constraints are contingent and could have been otherwise.

  Regarding Akrich and Latour: You have attached them correctly enough for this level. The concept of the "script" is centrally associated with Akrich, and the idea of delegating morality or action to non-humans (the door closer) is a classic Latour example. You are pressing them into service for a purpose they will bear: analyzing how agency is transferred from humans to things. Just ensure you do not imply Akrich invented the idea of scripts entirely without Latour's influence, as they work in the same tradition. For your purposes, the attribution is safe.

  **5. Falsifiability of the Prediction**
  Currently, the prediction is vulnerable to being a redescription. If you define "hardening" as "any move to make politics stable," then any stable politics looks like hardening. To make it falsifiable, you need a metric that does not rely on the outcome.

  **What would count against it:** A historical trend where infrastructure moves from automated systems back to human discretion. For example, if cities begin replacing automated toll booths with staffed booths to allow for discretion in hardship cases, or if algorithmic policing is replaced by community oversight boards with veto power. If you can show a sector where discretion is increasing rather than decreasing, your drift claim is weakened. You should specify that you are looking at *access control* and *resource allocation* technologies specifically, not all technology, to make the claim defensible.

  **6. Weakest Case**
  The **wheelchair lift** is the weakest case. When it is out of order, it is not merely "politically inert"; it is a violation of legal mandate. The politics here is not just about the artifact's function but about the legal regime requiring its repair. It complicates your "leased" category because the labor to fix it is often legally compelled, not just administratively decided.

  **Replacement:** Use a **dynamic tolling lane** (where prices change based on congestion) versus a **fixed toll booth**. The dynamic lane is "hardened" (algorithmic, no discretion). The fixed booth is "leased" (the toll collector can sometimes wave people through, or the booth can be left unmanned). This captures the economic exclusion element without the legal complication of disability access.

  **7. The Strongest Objection Not Listed**
  The **Politics of Neglect**. You treat "frozen" politics as requiring no labor to sustain. However, choosing *not* to maintain a bridge, or choosing *not* to repaint a line, is itself a political decision. A "frozen" artifact only remains frozen because a series of political actors decide not to change it. Therefore, there is no such thing as frozen politics; there is only leased politics where the lease is renewed by silence or inaction.

  This objection collapses your "frozen" category into "leased." If you cannot answer this, your taxonomy fails. Your reply must be that while neglect is a decision, the *cost* of reversing a frozen artifact is so high it functions differently than reversing a leased one. The inertia of capital is distinct from the inertia of administration. You must argue that the *threshold for contestation* is different, even if both ultimately rely on human decision.

  **8. Stylistic Coining**
  *   **"Leased politics":** This is your strongest term. It does work. It conveys the temporary, renewable nature of the arrangement. Keep it.
  *   **"Frozen politics":** This is acceptable, though "Inscribed politics" is more common in the literature. "Frozen" works better with your maintenance metaphor. Keep it, but define it early.
  *   **"Hardened politics":** This feels like coining for its own sake. As noted in Question 1, it overlaps heavily with Winner. If you keep it, define it strictly as "automation of discretion." If you cannot distinguish it sharply from Winner's first category, drop the term and describe the mechanism instead.
  *   **"Zero-maintenance counterfactual":** This is a methodological term, not a theoretical one. It is clear and useful. Keep it.
  *   **"Discretion audit":** Good, punchy. Keep it.

  **Overall Comment**
  Your core insight—that the durability of political effects depends on the maintenance regime—is excellent and moves the seminar discussion forward. It bridges the gap between the physical artifact and the social process. However, you are vulnerable on the definition of "maintenance." If you treat maintenance as purely physical, the radioactive waste and levee cases break you. If you treat it as institutional, the "frozen" category risks collapsing into "leased" via the Politics of Neglect objection.

  To survive seminar discussion, you must defend the claim that Capital Expenditure (frozen) creates a different *kind* of political inertia than Operating Expenditure (leased), even if both require human decision. The difference is not in the existence of decision, but in the frequency and cost of reversal. Focus your revision on that distinction.
