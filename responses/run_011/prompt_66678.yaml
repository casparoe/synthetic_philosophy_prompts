answer: |-
  **Audit of Interpretive Frameworks: Medieval Gallery Rewrite**

  **To:** Interpretation Officer
  **From:** Historical Consultant
  **Subject:** Audit of Military vs. Hazard Metaphors for 14th-Century Gallery

  The proposed military metaphor offers narrative cohesion but risks historical distortion. Below is the explicit mapping of your predecessor's draft, followed by an audit of its structural integrity and a comparison with the proposed hazard-and-vulnerability alternative.

  ### Table 1: Correspondences in the Military Frame

  | Military Concept | Gallery Equivalent | Historical Reality (1348–1353) |
  | :--- | :--- | :--- |
  | **Invading Force** | *Yersinia pestis* (Plague) | A pathogen transmitted via human trade networks. |
  | **Terrain** | The County/Villages | Manorial landscapes and trade routes. |
  | **Front Line** | Coastline/County Borders | Ports and market towns (nodes of transmission). |
  | **Fortifications** | Community Immunity/Isolation | Variable health, nutrition, and tenurial status. |
  | **General Staff** | The Crown/Local Lords | Legislators issuing Ordinances of Labourers. |
  | **Counter-Offensive** | Statute of Labourers (1351) | Legal attempts to freeze wages and mobility. |
  | **Victory Condition** | Survival/Stabilisation | Economic renegotiation and social mobility. |

  ### Audit of the Military Frame

  **Disanalogies**
  The disanalogies divide into the inelegant and the weighty. Inelegant discrepancies include the lack of strategy; the plague did not manoeuvre, nor did survivors organise a unified defence. However, the weighty disanalogies undermine the gallery's historical validity. First, the metaphor imports **purpose** where none exists. War implies intent; the plague was biological, not strategic. Second, it imports **sides**. By casting the plague as an invader, it obscures the fact that human agents—merchants, sailors, landlords—built the trade routes and tenurial arrangements that facilitated transmission. The pathogen was not an external army but a passenger on human infrastructure.

  **Testing Claim 2: Agency vs. Determinism**
  Your predecessor argues that a war story prevents environmental determinism by granting humans agency as combatants. This purchases agency at the cost of accuracy. It creates a **false agency**. Survivors did not "mount a defence"; they negotiated, migrated, or succumbed. Framing the Statute of Labourers as a "counter-offensive" suggests a coherent strategy to protect the populace, rather than a desperate attempt by elites to preserve profit margins. Furthermore, the war picture imports an **outside**. By treating the plague as an invader coming ashore, it disconnects the disease from the globalised medieval economy that brought it there. It suggests the county was a pristine fortress breached by an enemy, rather than a node in a network that invited the hazard. This distorts the 1348–1353 period specifically, where local commerce was the vector. Finally, it imports a **victory condition**. Survival is framed as holding the line, whereas historically, the "victory" for labourers was the collapse of the very serfdom the "generals" tried to defend. The military frame thus masks the socio-economic revolution as a military stalemate.

  ### Audit of the Hazard-and-Vulnerability Frame

  The colleague's suggestion treats the plague as a flood, with communities differently exposed based on landholding and commerce.

  **Mapping and Agency**
  In this frame, the plague is a force of nature, but the *impact* is determined by human construction. Trade routes become drainage channels; manorial structures become levees. This avoids the **purpose** and **sides** imported by the war metaphor. The pathogen is neutral; the damage is structural.

  **Determinism Risk**
  Does this slide into determinism? Only if "vulnerability" is presented as static fate. If the gallery explains that vulnerability was *constructed*—that poor landholding patterns or specific commercial choices increased exposure—then human agency is preserved. Agency lies in the construction of the landscape, not the fight against the water. However, there is a risk of passivity; floods happen *to* people. To avoid this, the text must emphasise that the "floodwaters" flowed through channels humans dug (trade) and that the "levees" (social safety nets) were maintained or neglected by human choice.

  **Comparison**
  The hazard frame is superior because it accommodates the **networked nature** of the 14th-century crisis. It allows us to say that high-commerce villages were more "exposed" without implying they were "attacked." It avoids the moral binary of invader/defender. However, it requires careful scripting to ensure visitors understand that "vulnerability" is socio-economic, not just geographic.

  ### Recommendation

  The military frame should be abandoned. Its importation of intent, sides, and external enemies distorts the causal structure of the pandemic, specifically obscuring human complicity in transmission. While it attempts to solve determinism, it replaces passive victims with fictional soldiers, masking the real agency of negotiation and adaptation.

  The hazard-and-vulnerability frame is the stronger option, provided it does not treat vulnerability as natural fate. To ensure this, the gallery should explicitly link "exposure" to human systems: show how trade routes acted as conduits and how tenurial arrangements dictated who could flee.

  However, if the hazard frame risks making humans seem too passive, I recommend abandoning analogies entirely in favour of plain causal terms. Describe the period as a **Systemic Shock**. This allows you to state plainly: *Climate stressed the system; Contagion exploited the networks; Humans renegotiated the structure.* This avoids the baggage of war (intent) and flood (passivity), presenting the 14th century as a complex socio-ecological crisis where human agency was exercised through adaptation and legal maneuvering, not defence. Given the sign-off deadline, the Hazard frame is the safest retrofit, but the Systemic Shock approach is the most historically honest.

  **Word Count:** 995 words
