answer: |-
  Good morning. Welcome to parents, governors, and girls. It is a pleasure to see the hall so full. We are here to celebrate work, and effort, and the things we become when we are together.

  Today I must present the Founders' Prize for Character. It was endowed in 1911 by a man who made cloth in this valley. He knew about weather. He knew about hard days. The deed that established the prize is specific. It requires me to read his criterion aloud before I name the winner. I cannot change a word.

  The prize is awarded "to that scholar whose character has proved most constant, whatever the weather of circumstance."

  For a hundred years, those words have stood on the page. They suggest that inside us there is a core, like a stone in a river. The water rushes over it. The storm beats against it. The stone remains. It is a comforting thought. It suggests that if we are good, we will be good everywhere. In the exam hall. On the bus. In the dark.

  I have thought about this often. I have watched girls grow from eleven to eighteen. I have seen kindness flare and fade. I have seen honesty hold firm in one room and slip in another. We are not stones. We are living things. We change with the light. We change with the hour. To say a person is constant regardless of the weather is to ask for something almost no one can give. Not even the founder could give it. Not even I can give it.

  But there is another way to hear the words. Constancy is not only what we are. It is what we build. It is not only a gift we carry. It is a place we stand.

  This year's winner is Priya Raman, in Year 12.

  Three things are known of her. In February, she told me that a close friend had used a mobile phone in a mock examination. She did it in front of her whole form at the end of the afternoon. That friend has not spoken to her since. Nor have several others. It is lonely to tell the truth when the truth costs you your company.

  For two terms, she has walked a Year 7 girl who is all but silent with adults down to the buses each afternoon. Nobody assigned her to it. Nobody kept a record of it. I learnt of it only in May, when the younger girl's mother wrote to thank the school.

  And in March, when most of the sixth form walked out of an assembly in protest at a decision of mine, Priya stayed in her seat. She was alone in the hall for twenty minutes. She told me afterwards that she had settled the previous evening that walking out would be unfair to the visitor who had travelled a long way to speak to us.

  Why did she do these things? I do not believe she did them because she is made of different stuff than the rest of us. I do not believe she is immune to the weather.

  I believe she did them because she arranged the weather.

  Part of it is that she was not in a hurry that February afternoon. Part is that she made up her mind the night before the assembly. Part is that her sister backs her at home. She has learnt to place herself where the doing is easy rather than trusting that she will be good later, when it is hard. She does not wait for the moment to make her brave. She makes herself brave before the moment arrives.

  That is not the founder's idea of character. I believe it is what is actually true in it. We cannot promise to be steady in every storm. But we can choose where we stand when the wind picks up. We can choose who walks beside us. We can decide the night before what we will do when the bell rings.

  So here is what I ask of you on Monday morning. Do not trust yourself to be kind when you are rushed. Promise yourself to leave home early enough to walk slowly. Do not trust yourself to be honest when the temptation is hidden. Put yourself where the light is clear. Do not rely on being good when the trouble starts. Rely on the friends you told beforehand.

  If you do this, you will not be stones. You will be something better. You will be builders. You will make a space where goodness can live, even when the weather turns.

  Priya has done this. She has arranged her days so that her best self has a place to stand. That is why she wins the prize. Not because she is untouched by the world, but because she has learned to meet it on her own terms.

  Priya, would you come up, please.

  ***

  I built the double hearing in the peroration's instructions for Monday morning. Your friend hears a directive to engineer environmental constraints and pre-commit, acknowledging internal volatility; the granddaughter hears a call to prudence and steadfast preparation, consistent with Victorian self-discipline.
