          *   **Nuance:** It's not always a "breach" (which implies violation/deception); often it's a "flout" (obvious violation to signal deeper meaning). The author blurs this slightly but it's acceptable for trade non-fiction.

      *   *Claim 2: "A lie and a polite evasion are built out of the same parts. Both require the listener to supply a meaning the speaker never put into words."*
          *   **Assessment:** Confused/Problematic.
          *   **Reasoning:** A lie (standard definition) involves asserting something the speaker believes to be false. A polite evasion (implicature) involves asserting something true (or ambiguous) to imply something else. The listener supplies meaning in *both* cases of implicature, but in a lie, the literal content is false. In an evasion, the literal content is often true. The author is conflating *lying* with *misleading*.
          *   **Term Borrowing:** He's using Gricean mechanics to equate lying and misleading, which is a major point of contention in philosophy.

      *   *Claim 3: The Dutch (Low power-distance, directness not a face threat, no positive face to protect).*
          *   **Assessment:** Fair shorthand (Hofstede/Brown & Levinson), but slightly reductive.
          *   **Reasoning:** "Low power-distance" is Hofstede. "Positive face" is Brown & Levinson. The claim that there's "no positive face to protect" is too strong. Everyone has face needs, but the *threshold* for threat varies. It's a stereotype, but recognizable in cross-cultural training.

      *   *Claim 4: The Japanese (High-context, message in situation, "not asserted anything", "nothing for anyone to be dishonest about").*
          *   **Assessment:** Fair shorthand (Hall), but philosophically risky.
          *   **Reasoning:** "High-context" is Edward Hall. The claim that they "not asserted anything" is linguistically dubious. They asserted "it is difficult." The *refusal* was implicated. The claim that this removes dishonesty is the crux of the author's argument, but it assumes dishonesty requires literal falsity.

      *   *Claim 5: Kant's objection (Lie uses listener as mere means, bypasses capacity to consent).*
          *   **Assessment:** Fair shorthand of a specific reading of Kant (O'Neill/Corrigan style).
          *   **Reasoning:** Kant's "On a Supposed Right to Lie" is the reference. The "means/ends" formulation is a standard contemporary Kantian interpretation of why lying is wrong (undermines autonomy).

      *   *Claim 6: "A hearer who is being fed an implicature has been bypassed in exactly the same way."*
