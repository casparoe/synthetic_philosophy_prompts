          *   **Reasoning:** This is the weak join. In an implicature, the hearer *actively participates* in deriving the meaning. They are not bypassed; they are recruited. In a lie, the hearer is led to a false belief without necessarily knowing the mechanism. The author claims both bypass consent. This is the critical pivot point.

      *   *Claim 7: Conclusion (Polite refusal and white lie are wrong for the same reason; culture made the second respectable).*
