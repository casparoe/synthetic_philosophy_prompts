answer: |-
  To the Triage Team,

  This memo establishes the new internal procedure for reviewing petitions for involuntary psychiatric admission. You have asked for a method grounded in the skeptical tradition of Thomas Szasz without adopting his ontological absolutism, and you have rightly identified that our current objection rate suggests we are deferring too quickly to clinical language that masks social control. Your instinct regarding which distinctions to keep is correct. We must retain the difference between treatment by agreement and treatment by force, because the law distinguishes them sharply even if medicine sometimes blurs them, and we must retain the distinction between a disorder of an organ and a problem in how to live, because the former justifies state intervention while the latter generally does not. We can drop Szasz's flat denial that any mental condition is an illness, as that is a medical debate we are not equipped to settle and which distracts from the legal task of protecting liberty. The goal of this procedure is not to diagnose the subject but to diagnose the petition. We are looking for logical gaps where medical vocabulary is being used to bypass the requirement for evidence of danger or physical pathology. What follows is the procedure itself, followed by an honest assessment of where it will fail, and finally an application of the rule to three hypothetical cases to demonstrate its output.

  The procedure begins with the first question, which asks whether the petition cites a specific lesion, laboratory result, or imaging finding that confirms a physical pathology independent of the subject's behavior. A sufficient answer here requires a named test, such as a CT scan showing a tumor or a blood test indicating toxicity, not a reference to a syndrome defined by behavior alone. If the petition cites such evidence, you file no objection and close the file, as the state has met the burden of showing a bodily disease rather than a metaphorical one. If the petition cites no such evidence, you proceed to the second question, which asks whether the conduct described would be unlawful or remarkable if performed by a person not suspected of mental illness. You are to check the specific acts listed, such as shouting in a church or refusing food, against the criminal code and social norms. If the conduct is criminal, you file no objection, as the state has an interest in prevention regardless of medical status. If the conduct is lawful but odd, you proceed to the third question, which asks whether the subject's refusal of treatment is cited as evidence of the illness itself. You are looking for phrases like lacks insight or anosognosia where the refusal is treated as a symptom rather than a choice. If the petition argues that the refusal proves the incapacity, you must escalate the file to me immediately. If the petition acknowledges the refusal but cites independent evidence of imminent danger, you proceed to the fourth question, which asks whether the intervention proposed is one the person could decline and walk away from. If the subject is currently voluntary or seeking help, you file no objection. If the subject is being held against their will based on the previous criteria, you escalate the file to me. There is a specific sentence in this protocol that governs escalation: any question that relies on determining whether a person's way of living is acceptable rather than whether their body is broken is a value question in disguise and therefore always escalates. This captures the Szaszian method by forcing us to identify when we are being asked to enforce a norm rather than treat a disease.

  You must understand where this procedure will misfire in practice. It is designed to be run on paper by non-clinicians in twenty minutes, which means it will miss nuances that a face-to-face evaluation would catch. It will let through petitions where the physical evidence is real but misinterpreted, because you are not trained to read neurology reports, and it will flag petitions where the clinician is genuinely trying to prevent a suicide that has not yet been attempted as a value judgment on living. Specifically, its suspicion of the phrase lacks insight is really just a suspicion of expertise that you should not be indulging without caution. In many cases, lack of insight is a genuine neurological deficit, not a philosophical disagreement, and by treating it as a circular argument we risk protecting people who are too ill to know they are dying. However, given our role as defenders of liberty against state coercion, this bias is a feature rather than a bug. We are not the treating team; we are the check on the treating team. The procedure will feel uncomfortable because it asks you to ignore the urgency of the clinical narrative and focus on the logic of the paperwork. You will feel that you are letting dangerous people go, but your job is not to keep people safe from themselves; it is to keep the state from locking people up without proof. If the petition cannot articulate the proof without relying on the conclusion, that is our opening.

  Now consider the first petition, involving the twenty-two-year-old man at the church. When you apply the first question, you find no citation of a lesion or test result, only behavioral observations, so you move to the second question. The conduct described is standing and speaking during a service, which is disruptive but not unlawful, and eating nothing for two days is not criminal, so you move to the third question. The petition states he lacks insight into his condition and is a danger to himself, but the only evidence of danger is the fasting and the religious claim, and the refusal to stay is treated as a symptom of the lack of insight. This triggers the escalation protocol because the reasoning is circular; the illness is proven by the refusal, and the refusal is invalidated by the illness. The procedure yields an escalation to me for a potential objection. This is a result you should accept, because the petition rests on the interpretation of religious experience and fasting as pathology without physical evidence, which is precisely the kind of problem in living Szasz warned us about. The second petition involves the thirty-one-year-old woman with anorexia. When you apply the first question, you find no lesion cited, as anorexia is diagnosed by behavior and weight, so you move to the second question. Refusing food is not unlawful, so you move to the third question. The petition explicitly states that her refusal is a manifestation of the disorder and so cannot count as a competent refusal. This is a direct hit on the third question's escalation criterion. The procedure yields an escalation to me for a potential objection. I know you will hate this result, and I expect you to feel that this is the procedure failing because this woman may die without intervention. However, this is the procedure working exactly as designed. It has identified that the state is overriding her written wishes based on a diagnosis that defines her wishes as symptoms. The conflict here is between her right to refuse care and the state's interest in preserving life, but under the Szaszian method we are using, that is a value question, not a medical fact. If we object, we are defending her right to define her own life even if it ends it; if we do not object, we are accepting that the state knows how she ought to live better than she does. The procedure forces us to see that choice clearly rather than hiding it behind medical necessity.

  The third petition involves the fifty-four-year-old man seeking a diagnostic code for insurance. When you apply the first question, you find no lesion, but when you apply the fourth question, you see that he is seeking the intervention voluntarily and asks that we not object. The procedure yields a notice of no objection. This is straightforward because there is no coercion involved; the diagnosis is administrative, not carceral. The distinction between treatment by agreement and treatment by force holds here, and the procedure correctly identifies that our office has no role in facilitating insurance claims unless liberty is at stake. Regarding the second case again, you must understand that identifying the value judgment does not mandate that we always object, but it mandates that an attorney makes the call rather than a paralegal triaging based on clinical deference. If I decide not to object in the anorexia case, it will be because the state's interest in life outweighs the Szaszian critique in instances of physical starvation, but that is a legal policy decision, not a triage decision. The procedure succeeds if it stops you from making that call yourself. It fails only if it prevents you from seeing the coercion in the first place. In the first case, the churchgoer, the procedure protects a potentially eccentric man from confinement. In the second case, the anorexic woman, it protects the principle of consent even at the risk of physical harm. In the third case, the medication user, it conserves our resources for actual conflicts.

  You asked me to tell you where the procedure will misfire, and I have told you it will misfire on capacity. There are people who cannot understand the consequences of their refusal due to brain chemistry, and this procedure treats their refusal the same as a competent philosopher's refusal. We accept this risk because the alternative is allowing clinicians to define incompetence by the mere presence of a diagnosis. You also asked if your instinct on Szasz was wrong. It is not wrong, but it is incomplete. The difference between organ and living is load-bearing, but you must remember that the brain is an organ. When a petition cites a tumor, the living problem becomes a medical problem. When it cites voices, it remains in the realm of metaphor unless those voices command violence that is imminent. The procedure will feel cynical because it treats clinical empathy as potential coercion. You must resist the urge to soften it. If you start making exceptions for people who seem nice or really ill, you will revert to the nineteen percent objection rate that got us here. Read the petitions as arguments, not as stories. Look for the leap from is to ought. If the petition says she is ill because she starves, and she should eat because she is ill, you have found the myth. If the petition says he has a tumor and it presses on his frontal lobe, you have found the medicine. Your job is to sort the two. I know this makes your work harder and morally heavier, but it is the only way to ensure that when we do not object, it is because the state has proved its case, not because we were too tired to read between the lines. Please begin using this procedure immediately and escalate any file that triggers the third question or the value judgment clause. I will review them personally.
