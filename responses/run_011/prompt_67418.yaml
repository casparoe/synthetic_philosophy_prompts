answer: |-
  The hum was the first thing Mara noticed when she entered, a low thrum that seemed to vibrate in the fillings of her teeth. It smelled of ozone and old paper. Elias was wiping the brass casing with a rag that had gone grey from oil and time.

  "The intake valve is sticky again," Elias said, not turning. He tapped the metal. It sounded solid, dense, like a tombstone.

  "You can't open the valve, Elias. We've been over this. The casing is fused."

  "The casing is sealed. The valve is external." He gestured to a small protrusion on the side, a relic of a maintenance protocol no one remembered. "It breathes. That means there's something inside that consumes."

  Mara walked to the desk where the ledgers lay stacked. Forty years of black bindings. She opened the current one to today's date. The columns were neat, the ink fading from fresh black to the brown of the seventies. "It consumes electricity. The meter on the wall proves that. It doesn't prove there's a mechanism in there that *thinks*."

  "It predicts," Elias said. He turned, leaning his hip against the machine. The heat from the casing radiated through his trousers. "Yesterday. Sector Four. Depth thirty meters. 'Seeking shelter from agitation.' You were on the boat. You saw them."

  "I saw seals diving," Mara said, running a finger down the column labeled *Disposition*. "I didn't see agitation. I didn't see shelter. I saw animals reacting to a drop in barometric pressure that any weather station could have forecast."

  "The weather station didn't call for a drop in pressure until six hours later. This machine logged it at 0600."

  "Post-diction is a sin, Elias. And pre-diction without a model is just luck running a long streak." She closed the ledger with a thud that echoed in the small hut. "Look at the categories. *Hunger. Play. Mating. Agitation.* Who chose these?"

  "The builders."

  "The builders are dead. And they burned their notes." Mara walked around the desk, coming closer to the machine. She didn't touch it. "These are human categories. We projected our own psychology onto the mammals, wrote them into the ledger, and now the machine matches the ledger because the ledger is the only map we have. You're treating the map as the territory."

  Elias pushed off the machine. He picked up a heavy pen, twirling it. "You're arguing for the physical stance. Gears, levers, barometers. But if I gave you the gears, if I cracked this open and showed you a clockwork of impossible complexity, would that change the prediction?"

  "It would change the validity."

  "How?"

  "Because then we'd know *why* it works. We could replicate it. We could fix it if it broke. Right now, if this hum stops, we are blind. We are priests shaking bones."

  Elias laughed, a short, dry sound. "Priests don't get wet. We get wet. We go out in the chop and we find the pods exactly where the book says they will be. You want a mechanism? Fine. The mechanism is the pattern. The reliability *is* the explanation. To ask for something behind the success is to ask for a magic essence. It's verificationism, Mara. You're saying the truth doesn't exist unless you can verify the construction."

  "I'm saying that a black box that outputs truth without inputting data is a contradiction. It's not a mechanism; it's an oracle." She tapped the brass casing. "And oracles are dangerous. If the seals are acting this way because they *are* this way, fine. But what if they are acting this way because the machine is *telling* them to?"

  Elias stopped twirling the pen. The hum seemed to grow louder in the silence. "That's paranoia."

  "Is it? We don't know what's in there. Sound? Vibration? Pheromones vented through that 'sticky valve' you mentioned? If the machine emits a signal that organizes the seals, then the ledgers aren't recording nature. They're recording the machine's own output. The pattern isn't discovered. It's imposed."

  Elias looked at the casing. For the first time, his hand hovered over the metal without touching it. "If that were true, the correlation would degrade. The seals would habituate."

  "Or they would synchronize." Mara opened the ledger again, turning pages back, ten years, twenty. "Look at the variance. It's decreased. Over forty years, the seals have become more predictable. More... orderly. Nature is messy, Elias. This?" She tapped the column of figures. "This is administrative. This is a bureaucracy of biology."

  Elias sighed, rubbing his face. He looked tired, the lines around his eyes deepening in the dim light. "You want to know what's inside? So do I. But we can't open it. The tension springs would shear the core. We'd lose the forty years. You'd rather have a broken truth than a working mystery?"

  "I'd rather have a known error than an unknown truth." Mara leaned in, her voice dropping. "Because if you're right, if this machine is tracking 'beliefs' or 'states' in the seals... you're granting them intentionality based on a box we don't understand. You're saying the seals *mean* to be where the book says. But maybe they just *are* there. By stripping away the mechanism, you strip away the difference between a choice and a collision."

  "And by demanding the mechanism, you strip away the reality of the choice," Elias countered, his voice hardening. "If it walks like a duck, quacks like a duck, and predicts the duck's location within five meters for four decades, it's a duck. If you say 'I need to see the duck's lungs before I admit it's breathing,' you're not a scientist. You're a theologian of the material."

  Mara looked away, towards the window. The fjord outside was grey, the water choppy. "I need to book the supply boat for Tuesday."

  Elias nodded slowly. "Tuesday. The ledger says the ice will shift in the narrows. Safe passage."

  "The ledger says a lot of things."

  "Will you book it?"

  Mara didn't answer immediately. She looked at her hand, resting on the black cover of the ledger. "If I don't, and the ice holds, I've wasted money. If I don't, and the ice closes, I'm stuck here for winter."

  "So you trust the pattern."

  "I trust the statistics."

  "It's the same thing."

  "No," Mara said, turning back to him. "Statistics describe what happened. Mechanisms explain what *must* happen. I'm booking the boat because I have to bet on something. Not because I believe the seals have 'states'."

  Elias looked down at the machine. The hum vibrated the pen on the desk. "I used to think they were just animals. Data points." He paused, his hand finally resting on the warm brass. "But when the book says 'Grief,' and we find a mother circling a pup that died... I don't think it's just statistics."

  "That's anthropomorphism, Elias. It's the oldest trick in the book."

  "Maybe." He looked at her, his expression weary. "But if the machine says 'Grief,' and we find them grieving, then 'Grief' is a coordinate. It's as real as latitude. You can't have it both ways, Mara. You can't use the coordinates to navigate your boat and then tell me the map is a lie."

  Mara stiffened. She looked at the ledger, then at the boat schedule in her pocket. "I'm not saying the map is a lie. I'm saying I don't know who drew it."

  "And I'm saying it doesn't matter who drew it, as long as it gets you home."

  "It matters to me."

  "Why?"

  "Because if the machine is making them do it..." Mara trailed off. She looked at the sticky valve, the small vent that Elias had worried over. "If the machine is organizing them, then we aren't studying a population. We're farming it. And we don't even know the feed."

  Elias went still. He looked at the valve, then at the ledgers, then at Mara. The silence stretched, filled only by the low, steady thrum of the apparatus.

  "I checked the maintenance logs from the beginning," Elias said quietly. "The power consumption spikes before the behavioral shifts. Not after."

  Mara felt a coldness that had nothing to do with the fjord. "You knew?"

  "I suspected." Elias pulled his hand away from the casing as if it burned. "I didn't want to say it. If I say it, I have to turn it off."

  "And if you turn it off?"

  "The pattern breaks. The seals scatter. We lose the data. We lose the... the order."

  "You lose the control," Mara corrected. She closed the ledger, her hand lingering on the cover. "Tuesday. The boat."

  "The ledger says Tuesday is safe."

  "I know." Mara picked up her coat. She didn't put it on. "I'll book it."

  Elias nodded, staring at the brass. "I'll check the valve again."

  "Don't," Mara said. "If it's venting, you don't want to know what comes out."

  "And if it's not?"

  "Then we're just reading tea leaves." She moved to the door, her hand on the latch. "But I'm still taking the boat."

  Elias didn't look up. "Me too."
