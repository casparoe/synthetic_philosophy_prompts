      *   The Concessions: Elias admits the machine might be changing the seals (observer effect on steroids). Mara admits she trusts it more than she trusts her own philosophy.

  7.  **Refining the Philosophy (The "Dangerous Vocabulary"):**
      *   Avoid jargon dumps. Use the concepts.
      *   *Realist:* "The pattern *is* the thing."
      *   *Sceptic:* "The pattern is a map, not the territory."
      *   *Mechanism:* Mara needs to show that without a mechanism, we can't intervene if it breaks. Elias needs to show that demanding a mechanism is just a fetish for reductionism.

  8.  **Final Polish (Checking constraints):**
      *   *Strawman check:* Is Mara just a naysayer? No, she raises valid epistemic concerns about feedback loops. Is Elias just a mystic? No, he's an instrumentalist who believes successful prediction constitutes reality.
      *   *Anchoring:* Keep them touching the box, the books.
