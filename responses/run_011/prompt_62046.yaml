  ### What to Say on Thursday (The Script)

  "Colleagues, I've reviewed the six precedents, and I'm prepared to vote 'Genocide' on the Kirvan file. I know the Historian's concern regarding the loyalty exemptions mirrors the *Vess* ruling, and the Prosecutor's reliance on the tapes mirrors *Maravik*. But here is why *Maravik* controls this decision, and why the exemption is a distractor.

  In *Vess*, we declined because the targeted group was political. In Kirvan, the targeted group is ethnic and religious. The state's own radio broadcast ordered them to 'forget their tongue.' That is not counter-insurgency; that is cultural erasure. The loyalty exemption doesn't change the target; it changes the method of selection.

  If we rule 'Not Genocide' based on the exemption, we are establishing that a state can avoid the genocide label by sparing a fraction of the group who agree to police the rest. That creates a loophole that would have protected the perpetrators in *Maravik* had they simply spared the village elders who collaborated. We cannot set a precedent that rewards division within a victim group.

  Regarding *Vess*: This ruling does not endanger that precedent. *Vess* was about ideology. Kirvan is about identity. The insurgents are the pretext, but the ministers' tapes confirm the intent is the elimination of the group 'in a generation.'

  The death toll is 11 percent. In *Corvin*, we declined because 0.6 percent was not substantial. Eleven percent is substantial. In *Sarn*, we ruled Genocide for cultural destruction with almost no deaths. Kirvan has both.

  We are not here to judge the legality of counter-insurgency. We are here to document the destruction of a people. The paperwork shows the state cares about grain quotas in *Dala*, but here, the paperwork shows they care about the group's disappearance. I move we classify Kirvan as Genocide."
