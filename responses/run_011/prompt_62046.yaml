answer: |-
  Here is the breakdown you need for Thursday.

  ### The Recommendation
  **Verdict:** Genocide.
  **Closest Analog:** The **Maravik file**.
  **Why:** Like Maravik, you have explicit state orders (the ministers' tapes), a protected class (ethnic/religious), and a death toll that threatens the group's viability in that region (11–12% vs. Maravik's 33%). While the *Sarn* file covers the cultural destruction (schools, language), *Sarn* had almost no physical destruction. Kirvan has both. The loyalty exemption is a tactical nuance, not a structural change to the crime.

  ### The Two Competing Rules
  Your committee's track record is consistent with two different logical frameworks. They agree on the past six files but demand opposite verdicts on Kirvan.

  **Rule 1: The "Volitional Escape" Principle (The Historian's Rule)**
  *   **The Logic:** Genocide requires intent to destroy a group *as such* (based on immutable traits like birth, race, religion). If individuals can avoid destruction by changing mutable behaviors (political allegiance, loyalty oaths, militia recruitment), the state's intent is pacification or counter-insurgency, not group destruction.
  *   **Fit with Precedents:**
      *   *Vess:* Fits perfectly (political opposition can disband/submit).
      *   *Dala:* Fits (grain quotas applied to economic behavior, not identity).
      *   *Maravik/Okessa/Sarn:* Fits (no escape was possible; identity was the trigger).
      *   *Corvin:* Fits (isolated incident, not systematic).
  *   **Prediction for Kirvan:** **Not Genocide.** The loyalty exemption proves the violence is conditional on behavior, not identity.
  *   **Risk:** This creates a "Collaborator Loophole." A state could spare 10% of an ethnic group who agree to police the other 90%, thereby technically negating genocidal intent while still destroying the community. It does not undercut *Okessa* (where no escape existed), but it renders *Maravik* vulnerable if future files reveal hidden exemptions.

  **Rule 2: The "Substantial Part + Voiced Intent" Principle (The Prosecutor's Rule)**
  *   **The Logic:** If leadership voices intent to destroy a protected group and imposes conditions calculated to destroy a *substantial part* of them, internal exemptions for collaborators do not negate the intent against the group entity. The group is the target; the exemptions are a method of division.
  *   **Fit with Precedents:**
      *   *Maravik/Okessa/Sarn:* Fits (destruction of substantial part + intent/inaction).
      *   *Vess:* Fits exclusion (political groups are not protected classes).
      *   *Dala:* Fits exclusion (no voiced intent against the group).
      *   *Corvin:* Fits exclusion (part was not substantial).
  *   **Prediction for Kirvan:** **Genocide.** The death toll (11–12%) is substantial (unlike *Corvin*), the group is protected (unlike *Vess*), and intent is voiced (unlike *Dala*).
  *   **Risk:** This makes *Vess* unlivable *only if* you blur the line between ethnic and political groups. If you allow "political opposition" to be redefined as "ethnic resistance," any counter-insurgency becomes genocide. You must hold the line that Kirvan is targeted for *ethnicity*, whereas Vess was targeted for *ideology*.

  ### Which Rule to Bet On
  **Bet on Rule 2 (The Prosecutor's Rule).**

  **Why:** The "loyalty" requirement in Kirvan isn't just a paperwork exercise; it requires supplying militia recruits to fight their own neighbors. This turns the exemption into a tool of *moral destruction*, forcing the group to consume itself. This aligns with *Sarn*, where the attack on institutions and family cohesion was deemed genocidal even without mass killing. Here, you have mass killing *plus* moral coercion.

  If you choose Rule 1 (Volitional Escape), you establish a precedent that a state can immunize itself from genocide charges by offering "loyalty oaths" to a fraction of the victims. That makes the Convention toothless against modern hybrid warfare.

  ### Implications for Past Rulings
  *   **If you go with Rule 1 (Not Genocide):** You do not undercut *Okessa*, because *Okessa* had no state mechanism for exemption. However, you quietly undermine *Maravik*. If the Maravik ministry had offered "loyalty exemptions" to 10% of the religious minority, would you have ruled differently? If the answer is no, Rule 1 is inconsistent.
  *   **If you go with Rule 2 (Genocide):** *Vess* remains safe *provided* you explicitly state that the Kirvan file is predicated on the group's *ethnic/religious* status, not their separatist politics. The separatists are the pretext; the ethnicity is the target. As long as you keep that distinction sharp, *Vess* holds.

  ### The Differentiator (One Fact/Hypothetical)
  To settle this before voting, you need to know if the "loyal" Kirvans are allowed to remain *Kirvan*.

  **The Hypothetical:** Imagine a follow-up file where the "loyal" villagers are permitted to stay in their homes, but are forbidden from speaking the Kirvan language or practicing the Kirvan faith as a condition of that loyalty.
  *   **If this is true:** It confirms Rule 2. The state is willing to spare the *bodies* but only by destroying the *group identity*. This is *Sarn* logic applied to a massacre. It is Genocide.
  *   **If this is false (they can be Loyal Kirvans):** It strengthens Rule 1. The state accepts the identity but rejects the insurgency. This leans toward Crimes Against Humanity or War Crimes, but weakens the Genocide charge.

  **Action:** Ask the researcher to verify the cultural conditions of the "loyalty" exemption. If loyalty requires cultural erasure, the "behavioral" argument collapses.

