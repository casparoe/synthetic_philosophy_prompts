answer: |-
  There is no single canonical term in the history of ideas that captures this specific rhetorical pathology with the precision you describe. Your formulation—"a term with a fixed charge and a floating extension"—is arguably sharper than most existing labels.

  However, the phenomenon sits at the intersection of several established concepts. To answer your request, I will first outline the near-misses from the literature (to show why they fall short), and then propose a definition for a term that isolates this specific move, distinguishing it from vagueness, Barnum statements, and simple double standards.

  ### 1. The Near-Misses

  **Essentially Contested Concepts (Gallie)**
  *   **Why it's close:** Gallie argues that concepts like "democracy" or "justice" have no fixed criteria, only a shared recognition of their value.
  *   **Why it fails:** Essential contestation implies a *good-faith* dispute within a community about how to realize a shared value. Your example describes a *unilateral* imposition by an observer. The writer is not contesting the meaning; they are manipulating it to preserve a pre-existing judgment about the people.

  **Thick Ethical Concepts (Williams)**
  *   **Why it's close:** Thick concepts (e.g., "cruel," "courageous") blend description and evaluation.
  *   **Why it fails:** In a genuine thick concept, the description and evaluation are fused stably. If you remove the descriptive core, the evaluation collapses. In your phenomenon, the descriptive core is severed and reattached at will; only the evaluation (relative to the subject) remains stable. It is a **hollowed-out thick concept**.

  **Asymmetrical Counter-Concepts (Koselleck)**
  *   **Why it's close:** Koselleck showed how concepts like "Greek/Barbarian" or "Christian/Heathen" work: one side claims the universal human quality, the other is defined by lack or deviation.
  *   **Why it fails:** Koselleck's model usually involves *pairs* of terms (Us = Civilized, Them = Savage). Your phenomenon is more insidious: it uses the *same* term (or the same underlying trait logic) for both, but the semantic content flips based on the target.

  **Concept Stretching (Sartori)**
  *   **Why it's close:** Sartori warned that extending a concept to cover too many cases empties it of meaning.
  *   **Why it fails:** Sartori's stretching is usually about *breadth* (covering too many types). Your phenomenon is about *contradiction* (covering opposite behaviors) driven by *affect*.

  ### 2. A Proposed Term: **Valence-Locked Attribution**

  If we must define a term sharply enough to do work in historiography, I propose **Valence-Locked Attribution** (or **Valence-Grounded Predication**).

  **Definition:**
  A rhetorical move in which the *evaluative charge* (positive/negative) of a trait attribution is fixed by the observer's prior stance toward the subject group, while the *descriptive criteria* for that trait are elastically adjusted to ensure the charge remains constant, even when confronted with contradictory behavioral evidence.

  **The Mechanism:**
  1.  **Input:** Observer holds a fixed valence toward Group A (Positive) and Group B (Negative).
  2.  **Observation:** Behavior X occurs in both groups.
  3.  **Processing:**
      *   In Group A, Behavior X is mapped to Trait T+ (e.g., "Prudence").
      *   In Group B, Behavior X is mapped to Trait T- (e.g., "Timidity").
      *   *Crucially:* If Group B exhibits Not-X, it is mapped to Trait T- (e.g., "Recklessness").
  4.  **Output:** The valence (Good/Bad) is determined by the Group, not the Behavior. The Trait label serves as a post-hoc justification for the valence.

  ### 3. Excluding the Boundary Cases

  To ensure this term excludes ordinary vagueness, Barnum statements, and double standards, we can apply the following tests:

  **A. Versus Ordinary Vagueness**
  *   **Vagueness:** The boundaries of the term are unclear (e.g., "tall"). A tall person is tall regardless of who they are.
  *   **Valence-Locked:** The boundaries are *clear* but *mobile*. They shift specifically to protect the evaluation.
  *   **Test:** If the writer acknowledges the ambiguity ("Some might call this timidity, but we call it prudence"), it is vagueness/debate. If the writer registers *no adjustment* and treats the contradictory behavior as obvious proof of the same trait, it is Valence-Locked.

  **B. Versus Barnum-Style Generality**
  *   **Barnum:** The statement applies to *everyone* equally (e.g., "They value family").
  *   **Valence-Locked:** The statement applies *differentially*. The same behavior is coded differently depending on the agent.
  *   **Test:** Swap the subjects. If the sentence remains true and retains its moral charge, it is a Barnum statement. If the sentence requires a different adjective to maintain the writer's intended moral charge, it is Valence-Locked.

  **C. Versus Plain Double Standard**
  *   **Double Standard:** Two different rules are applied (e.g., "Speeding is illegal for you, but I have immunity"). The rule itself is stable; the *application* is biased.
  *   **Valence-Locked:** One rule is claimed, but the *definition of the rule* changes. (e.g., "We both follow the law of Prudence," but Prudence means X for me and Not-X for you).
  *   **Test:** In a double standard, the hypocrite knows they are breaking the rule. In Valence-Locked Attribution, the writer genuinely believes the trait description fits, because their perception of the description is governed by the valence. It is an epistemic failure, not just a moral one.

  ### 4. Boundary Cases and Grey Areas

  Where does **Valence-Locked Attribution** end and legitimate interpretation begin? This is the hardest boundary for a historian of ideas.

  **The Case of Contextual Nuance**
  *   *Scenario:* Deferring to elders is "civic-mindedness" in a stable society but "timidity" in a revolutionary context.
  *   *Distinction:* Legitimate interpretation cites *external contextual factors* (political stability, economic pressure) to justify the shift in meaning. Valence-Locked Attribution cites *internal essential factors* (national character, racial temperament).
  *   *Boundary:* If the writer explains the shift via *circumstance*, it is hermeneutic nuance. If they explain the shift via *essence* ("It is in their blood to be timid"), it is Valence-Locked.

  **The Case of Hermeneutic Charity**
  *   *Scenario:* Interpreting an ally's ambiguous action in the best light.
  *   *Distinction:* Charity is usually temporary and corrigible. If evidence mounts that the ally is acting badly, the charity is withdrawn. Valence-Locked Attribution is *incorrigible*; it absorbs counter-evidence indefinitely.
  *   *Boundary:* Falsifiability. If there is *no* behavior the group could perform that would cause the writer to withdraw the positive trait, it is Valence-Locked.

  ### Summary for your Work

  Since no established term fits perfectly, you might introduce the concept as a specific pathology of **Essentialist Discourse**. You can describe it as **"Valence-Locked Attribution,"** noting that it functions as a **corrupted Thick Concept**.

  It is distinct from a double standard because it does not merely apply rules unequally; it destabilizes the semantic content of the rule itself to ensure the evaluation remains invariant. It is the rhetorical equivalent of a particle with fixed mass but variable volume: it occupies whatever space is required to maintain its gravitational pull.
