answer: |-
  1. **Does this have an established name?**

  There is no single established term that captures this specific failure mode precisely, though three concepts come close.

  *   **Reification:** This claims that an abstract concept is being treated as a concrete physical thing. It falls short because your problem isn't that the analogy is treated as a physical object, but that it becomes the *grammar* of the discussion. Reification explains why the analogy feels real, not why it dictates the questions.
  *   **Discursive Closure:** This claims that power structures limit the range of legitimate argument until certain conclusions become inevitable. It falls short because it implies a sociological or political silencing mechanism. Your phenomenon is rhetorical and cognitive; the debate remains open and loud, but the *terms* are rigged.
  *   **Conceptual Metaphor:** This claims that human thought is fundamentally structured by metaphors (e.g., "argument is war"). It falls short because it describes a universal cognitive infrastructure, not a specific rhetorical failure in policy discourse where a *chosen* analogy becomes immune to disconfirmation.

  2. **If nothing fits, coin one and define properly.**

  Since existing terms describe the substrate but not the specific failure mode, I propose the term **Analogical Capture**.

  **Definition:** A rhetorical state where a comparative framework ceases to be a contestable premise and becomes the constitutive vocabulary of a debate, rendering disconfirming evidence categorically invisible rather than factually disputed.

  **Necessary Conditions:**
  *   An explicit historical or theoretical analogy is introduced as a lens for current events.
  *   Disanalogies are acknowledged but fail to dissolve the analogy's hold on the debate.
  *   Participation in the debate requires adopting the analogy's terminology (roles, stakes, dynamics).
  *   Facts incompatible with the analogy are treated as noise or irrelevant categories rather than counter-evidence.

  **Diagnostic Test:** Attempt to state a counter-argument using only facts external to the analogy's vocabulary. If doing so makes you sound like you are changing the subject rather than offering counter-evidence, capture has occurred.

  **Boundary Cases:**
  *   **The Analogy is Actually Apt:** Verdict: No. If the analogy is factually robust, disanalogies would legitimately weaken it. Capture requires immunity to disconfirmation.
  *   **The Speaker is Arguing in Good Faith:** Verdict: Yes. Capture is a structural dynamic of the discourse, not dependent on speaker intent or malice.
  *   **A Counter-Vocabulary Exists but is Less Fun:** Verdict: Yes. If a more accurate vocabulary exists but is ignored because the analogy is more vivid, the debate is still captured.

