      *   *Framing Check:* Did I stick to the User's 2x2 matrix? Yes, explicitly reference Granularity and Label Source.
      *   *Deflationary Thesis:* Did I treat it seriously? Yes, acknowledged its strength in ground-truth domains.
      *   *Constraints:* No citations. Check.

