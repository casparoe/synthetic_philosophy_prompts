  *(Self-Correction on "Verifier Capability"):* The prompt defines Label Source as "Ground-truth check... versus a judge's assessment." The Verifier Capability argument is that sometimes Ground-truth is *impossible*. This makes the Label Source variable constrained. I must highlight this.

