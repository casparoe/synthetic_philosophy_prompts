      *   **Tension A: #3 (GWT) vs. #4 (HOT).**
          *   *Analysis:* Global Workspace Theory (GWT) and Higher-Order Theory (HOT) are competing *first-order* vs. *higher-order* mechanisms. GWT usually says a state is conscious when broadcast to many systems (first-order state becomes globally available). HOT says a state is conscious only when represented by a higher-order state. While some try to hybridize them (e.g., Brown et al.), strictly speaking, they offer different necessary and sufficient conditions. GWT focuses on *access*; HOT focuses on *meta-representation*.
          *   *Severity:* Moderate to Severe. You can't easily hold both as the *definition* of consciousness without significant modification.
          *   *Conflict:* If a state is broadcast (#3) but not higher-order represented (#4), is it conscious? If it's HOT-represented (#4) but not broadcast (#3), is it conscious?

      *   **Tension B: #1 & #2 (Block/Anti-functionalist) vs. #3 & #4 (Functionalist Mechanisms).**
