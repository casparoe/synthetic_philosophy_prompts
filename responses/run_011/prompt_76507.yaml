  | :--- | :--- | :--- | :--- | :--- |
  | **Prior over $k$** | Uniform ($1/1000$); $k$ is physical parameter. | Weighted by $k$; existence confirms larger populations. | Genuine | Ontological commitment to observer-moments differs. |
  | **Credence $k>500$ (Post-Grey)** | 0.503. Update on Grey is weak; prior dominates. | 0.750. Prior heavily favors high $k$; Grey confirms. | Genuine | Derived from incompatible priors. |
  | **Indexical Uncertainty** | Uncertainty about which *actual* observer I am. | Uncertainty about which *possible* observer I am. | Verbal | Maps to same math if "possible" defined as "actual in some world". |
  | **Grey as Evidence** | Legitimate indexical evidence; likelihood varies with $k$. | Legitimate; updates the $k$-weighted prior. | Verbal | Both agree likelihood ratio $>1$ for high $k$. |
  | **Observer-Count Confirmation** | No; observer count does not confirm physical hypotheses. | Yes; fine-tuning and multiverses confirmed by observer count. | Genuine | SSA rejects Presumptuous Philosopher; SIA accepts it. |

  3. **The Cruxes**
  (i) **Frequency of Reports:** If the lottery runs 1000 times, most reports come from high-$k$ runs.
  *   *Argument:* Does this frequency constrain credence in a single run?
  *   *SSA Prediction:* No. Reference class is observers in *this* world, not across runs.
  *   *SIA Prediction:* Yes. I am a random observer from the total set of created observers.
  *   *Move:* If SSA admits frequency constrains single-case credence, she converges to SIA priors.

  (ii) **Betting Setup:** Payoff made once per person vs. once per run.
  *   *Argument:* Do decision recommendations converge?
  *   *SSA Prediction:* Diverge. Per-person: bet high $k$. Per-run: bet uniform.
  *   *SIA Prediction:* Converge. Always bet as if $P(k) \propto k$ to maximize total utility.
  *   *Move:* If decisions converge on total utility, the dispute is largely about the definition of "credence" vs "weight".

  (iii) **Reference Class Fixing:** What fixes the reference class?
  *   *Argument:* Is it similarity (SSA) or existence (SIA)?
  *   *SSA Prediction:* Similarity. Grey-band wearers are a subclass.
  *   *SIA Prediction:* Existence. All observer-moments are in the class.
  *   *Move:* If similarity is shown to be arbitrary, SSA loses motivation.

  4. **Falsifiers**
  *   **SSA:** Would accept evidence that observer-count weighting predicts physical constants better than uniform priors.
  *   **SIA:** Would accept a proof that "I exist" is necessary truth and thus non-evidential.
  *   **Shared Falsifier:** No. SSA treats anthropics as epistemology (sampling); SIA treats it as ontology (existence). They disagree on what kind of fact anthropic data is.

  \answer{0.503 / 0.750 / genuine}
