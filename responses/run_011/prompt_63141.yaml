answer: |-
  **MEMORANDUM**

  **TO:** The Electoral Commission
  **FROM:** Senior Legal Adviser
  **SUBJECT:** Draft Procedure for Voter Registration and Eligibility Determination
  **DATE:** [Current Date]
  **STATUS:** Final Draft for Public Consultation

  ### 1. THE OPERATIONAL STIPULATION (ESCAPING THE CIRCLE)

  **The Problem:** We cannot ask the voters to decide who the voters are without already knowing who the voters are. This is the circularity.
  **The Solution:** We do not solve this philosophically. We solve it by **stipulation**. We fix a "Critical Date" and a "Legitimacy Baseline" that are not subject to vote.

  **The Stipulation:**
  1.  **Critical Date:** 1 January [Year of Peace Accord Signing]. This freezes the demographic baseline.
  2.  **Legitimacy Baseline:** The *demos* for this referendum is defined as the community entitled to self-determination prior to the conflict, plus those displaced *by* the conflict. It explicitly excludes those whose presence is the result of the conflict's demographic engineering.
  3.  **The Cost:** This treats the referendum as a *restorative* act, not a purely *plebiscitary* one. We are prioritizing historical justice over current headcount. This will be challenged as undemocratic by those excluded. We accept this risk to prevent the referendum from ratifying the outcomes of the settlement programme.

  **Note on Future Elections:** This Register will serve for ordinary elections for the next generation. To mitigate the risk of creating a permanent disenfranchised class (specifically regarding the Settler case below), this Procedure includes a "Pathway to Full Franchise" clause (Step 5) that activates only *after* the referendum result is implemented.

  ---

  ### 2. THE REGISTRATION ALGORITHM (THE FUNNEL)

  This procedure is a sequential filter. A claimant must pass Step 1 to reach Step 2. If a claimant fails a step, they are rejected unless they qualify for a Specific Exception.

  #### STEP 1: The Documentary Threshold (Fact)
  **Question:** Can the claimant produce one primary document linking them to the territory prior to the Critical Date, or proving descent from someone who did?
  **Sufficient Evidence:**
  *   Pre-Critical Date national ID, birth certificate, or property deed.
  *   For descendants: Parent's Pre-Critical Date birth certificate + Claimant's birth certificate showing lineage.
  *   For refugees: UNHCR registration cards dated prior to or during the conflict exodus.
  **Insufficient Evidence:**
  *   Utility bills dated after the Critical Date.
  *   Affidavits from community leaders (without corroborating documents).
  *   School records (unless state-issued and dated pre-Critical Date).
  **Judgment Call Flag:** *We are treating paper trails as a proxy for belonging. This disadvantages oral cultures and the poor whose documents were lost in the war. We mitigate this in Step 3.*

  #### STEP 2: The Habitual Residence Test (Fact + Judgment)
  **Question:** Has the claimant maintained a "genuine link" to the territory for at least 2 of the last 5 years?
  **Sufficient Evidence:**
  *   Physical presence for 180 days per year for 2 years.
  *   Payment of local taxes or rates.
  *   Enrollment of dependents in local schools.
  **Insufficient Evidence:**
  *   Ownership of vacant property.
  *   Seasonal visitation only.
  **Judgment Call Flag:** *"Genuine link" is subjective. We define it here as economic and social integration. A wealthy absentee landlord fails; a poor tenant farmer passes.*

  #### STEP 3: The Displacement Exception (Value)
  **Question:** If the claimant fails Step 2 (Residence), was their absence caused by forced displacement during the conflict?
  **Sufficient Evidence:**
  *   Testimony corroborated by two witnesses on the Register.
  *   Records from recognized humanitarian organizations confirming refugee status.
  *   **Rule:** If displacement is proven, the "Continuous Residence" requirement in Step 2 is waived. They are deemed "Constructively Present."
  **Judgment Call Flag:** *We are making a moral determination that victims of expulsion retain a vote that voluntary emigrants do not. This privileges history over current presence.*

  #### STEP 4: The Settlement Legitimacy Check (Value)
  **Question:** Did the claimant's initial entry into the territory occur under the Previous Regime's State-Sponsored Settlement Programme?
  **Sufficient Evidence:**
  *   Housing allocation records from the Previous Regime's Ministry of Interior.
  *   Subsidized mortgage documents specific to the Settlement Zone.
  *   Lack of any family ties to the territory prior to the Settlement Programme start date.
  **Rule:** If entry was via the Settlement Programme, the claimant is **Ineligible for the Referendum Register**, regardless of Step 2 (Residence) success.
  **Judgment Call Flag:** *This is the hardest value judgment. We are ruling that residence gained through demographic engineering does not confer political membership in a self-determination vote. This overrides the "life staked here" principle.*

  #### STEP 5: The Future Franchise Pathway (Procedural)
  **Question:** Is the claimant ineligible solely due to Step 4?
  **Rule:** If yes, they are placed on a "Provisional Roll." They cannot vote in the Referendum. They will be automatically transferred to the "Full Electoral Roll" for ordinary elections beginning 4 years post-independence, provided they maintain residence.
  **Reasoning:** This balances the integrity of the founding vote with the stability of the future state.

  ---

  ### 3. THE COMMISSIONER HAND-OFF

  The legal team processes Steps 1 through 4. We only hand a file to the Commissioners if:

  1.  **Documentary Ambiguity:** The claimant has documents, but they contradict (e.g., a birth certificate showing birth here, but a passport showing citizenship elsewhere at the Critical Date).
  2.  **Hardship Appeals:** The claimant fails Step 1 (Documents) but claims Step 3 (Displacement) and has no witnesses.
  3.  **Conflict of Law:** The claimant holds dual citizenship where one state does not recognize the right of return.

  **Instruction to Commissioners:** In these hand-off cases, you are not determining facts. You are determining **risk tolerance**.
  *   *Question to ask:* "Does including this person risk the international certification of the referendum, or does excluding them risk violent unrest?"
  *   *Decision Rule:* If the risk is equal, default to **Inclusion**. It is easier to defend a broad register than a narrow one in a post-conflict zone.

  ---

  ### 4. APPLICATION TO SPECIFIC CASES

  Here is how the procedure applies to the three marginal cases currently on your desk.

  #### CASE A: The Settlement Families
  *Profile:* Arrived 40 years ago under state-sponsored programme. Speak only metropolitan language. No ties elsewhere.
  *Procedure Run:*
  1.  **Step 1:** Likely fail. No pre-Critical Date documents (arrived during occupation).
  2.  **Step 2:** Pass. 40 years residence is undeniable.
  3.  **Step 3:** N/A. Not displaced; they were the settlers.
  4.  **Step 4:** **FAIL.** Entry was via Settlement Programme.
  *Outcome:* **Ineligible for Referendum.** Placed on Provisional Roll for future elections.
  *Against Sympathy Explanation:* I know your sympathy is to include them because their lives are here. Excluding 40-year residents feels like punishment. However, if we include them, the referendum ceases to be an act of self-determination for the indigenous/post-conflict community and becomes a ratification of the settlement programme. The "life staked here" argument is outweighed by the "source of the stake" argument. If the stake was planted by an occupying power to alter the demographic balance, it cannot count in the vote to remove that power. We mitigate the hardship via Step 5 (future voting rights), but for the founding act, they must stand aside.

  #### CASE B: The War Refugees
  *Profile:* Fled during war. Lived abroad 9 years. Now returning.
  *Procedure Run:*
  1.  **Step 1:** Pass (assuming they kept birth certs or have UNHCR cards).
  2.  **Step 2:** Fail. 9 years absence breaks the 2-of-5 residence rule.
  3.  **Step 3:** **PASS.** Displacement is proven via UNHCR records. "Constructive Presence" applies.
  *Outcome:* **Eligible.**
  *Reasoning:* The procedure prioritizes the *cause* of absence over the *fact* of absence. Their physical absence is treated as a legal fiction; they are deemed to have been here all along.

  #### CASE C: The Pastoralists
  *Profile:* Grazing lands straddle the border. Stateless. Registered to neither side.
  *Procedure Run:*
  1.  **Step 1:** **FAIL.** No state documents (stateless).
  2.  **Step 2:** **FAIL.** Cannot prove residence *within* the boundary. Their life is *across* the boundary.
  3.  **Step 3:** **FAIL.** Not displaced by conflict; displaced by the drawing of the line itself.
  4.  **Hand-off to Commissioners:** This is a value call.
  *Recommendation:* **Exclude from Referendum.**
  *Reasoning:* The referendum is about the status of *this* territory. A community whose political and economic life is fundamentally trans-boundary cannot cast a decisive vote on a boundary that they effectively reject by their lifestyle. Including them sets a precedent that allows non-residents to determine the state's status.
  *Cost:* This is the tyranny of the line. We are telling them their way of life is incompatible with the state we are building. They should be offered dual-observation rights or cross-border permits, but not a vote on sovereignty.

  ---

  ### 5. LIMITATIONS AND PUBLIC DEFENCE

  This procedure cannot do everything. In the public hearings, we must be honest about what remains exposed.

  **1. The Charge of Illegitimacy Will Remain**
  No matter how transparent this procedure is, the Settler families (Case A) will claim they are being disenfranchised based on their ethnicity or origin. The Pastoralists (Case C) will claim the state is excluding them because they do not fit the "settled" model of citizenship.
  *Defence:* We do not argue they are wrong. We argue that **a referendum is not a census.** It is a specific legal mechanism to resolve a specific conflict. We are not measuring "who lives here"; we are measuring "who constitutes the self-determining unit." These are different questions.

  **2. The "Judgment Calls Dressed as Rules"**
  We must concede that the "Critical Date" is arbitrary. Why 1 January of the Peace Accord? Why not the start of the war? Why not 100 years ago?
  *Defence:* Arbitrariness is not illegitimacy. Law requires lines. We have chosen the line that minimizes violence and aligns with international peace agreements. We are not claiming this is the *only* true line, only that it is the *agreed* line.

  **3. The Circular Foundation**
  We must admit that this Register defines the people who will create the Constitution that defines the people.
  *Defence:* This is true of all states. Every democracy rests on an undemocratic founding act (a revolution, a treaty, a war). We are making that act explicit rather than hiding it. We are saying: "This vote is not the beginning of history; it is the resolution of a specific historical injury."

  **4. What Deserves an Answer, Not a Shrug**
  *   **To the Settlers:** Do not tell them they are not "from here." Acknowledge they are from here, but explain that the *vote* is about undoing the legal architecture that brought them here. Offer the Step 5 Pathway explicitly.
  *   **To the Pastoralists:** Do not tell them to settle down. Acknowledge the border harms their livelihood. Offer a commitment to cross-border grazing treaties as a condition of the new state's foreign policy.
  *   **To the International Observers:** Do not claim this meets "universal suffrage" standards in the abstract. Claim it meets "context-specific legitimacy" standards required for a post-conflict plebiscite.

  ### 6. FINAL INSTRUCTION TO TEAM

  When drafting the public guidance:
  1.  **Do not use the word "Ethnicity."** Use "Historical Residence" and "Displacement Status."
  2.  **Do not promise certainty.** Use "Eligibility Determination" not "Right to Vote."
  3.  **Flag the Hand-off.** If a lawyer is unsure, pass it to the Commissioners. Do not let legal staff make political decisions in the shadows.

  This procedure trades moral purity for operational viability. It will hurt people we sympathize with (the Settlers, the Pastoralists). It will include people who seem disconnected (the Diaspora). This is the cost of building a state that can survive its own birth.

  **[End of Memorandum]**
