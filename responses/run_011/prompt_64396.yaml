answer: |-
  ### Underlying Commitments

  Before mapping the terrain, we must isolate the commitments that actually drive the disagreement, rather than the tribal labels. The disputes rest on five fault lines:
  1.  **Ontology of Probability:** Is probability a degree of rational belief (mind) or a long-run frequency (world)?
  2.  **The Likelihood Principle:** Does evidence depend only on the data observed, or also on the sampling plan (intentions/stopping rules)?
  3.  **Scope of Inference:** Are we evaluating the credibility of *this* specific hypothesis, or the error rate of *this procedure* over infinite repetitions?
  4.  **Model Status:** Are statistical models true descriptions of reality, or useful fictions to be checked?
  5.  **Goal:** Is the output evidence (for belief), a decision rule (for action), or a prediction?

  Your platform's hybridity is philosophically interesting because it splits the Scope: Bayesian for the individual test (belief), Frequentist for the portfolio (error control).

  ### The Decision Tree

  **Q1. When you report "95% probability," what does the number attach to?**
  *   (A) A degree of belief about *this* specific parameter. → **Go to Q2**
  *   (B) The success rate of this *method* over infinite repetitions. → **Go to Q5**
  *   (C) A useful tool; the ontological status is irrelevant. → **Go to Q9**

  **Q2. (If Belief) Where does your prior distribution come from?**
  *   (A) Subjective expert knowledge. → **Go to Q3**
  *   (B) A formal mathematical rule (e.g., reference prior). → **Go to Q3**
  *   (C) Estimated from the data of other experiments. → **Go to Q3**

  **Q3. (If Belief) Do you enforce a global False Discovery Rate budget across all experiments?**
  *   (A) No, the posterior is sufficient. → **Go to Q4**
  *   (B) Yes, we cap the share of nulls shipped using frequentist budgets. → **LEAF: Platform Hybrid**

  **Q4. (If Belief, No FDR) Do you check if your model fits the data?**
  *   (A) Yes, models are approximations to be validated. → **LEAF: Model-Checking Bayes (Gelman)**
  *   (B) No, the model is the inference engine. → **LEAF: Subjective/Objective/Empirical Bayes** (See Diagnosis)

  **Q5. (If Frequency) What is the primary goal of the test?**
  *   (A) To quantify evidence against a null hypothesis. → **Go to Q6**
  *   (B) To make a binary decision (ship/reject) controlling errors. → **Go to Q7**

  **Q6. (If Evidence) Do you interpret the p-value as an error rate or an evidence index?**
  *   (A) An evidence index (smaller = more evidence). → **LEAF: Fisherian**
  *   (B) An error probability (Type I rate). → **LEAF: Error Statistics (Mayo)**

  **Q7. (If Decision) Do you adjust thresholds to control errors across the portfolio?**
  *   (A) No, control is per-test (Family-wise or single). → **Go to Q8**
  *   (B) Yes, we manage the global error rate (e.g., FDR). → **LEAF: Neyman–Pearson (Modern)**

  **Q8. (If Decision, Single) Does the stopping rule matter if the data are identical?**
  *   (A) Yes, intentions define the sampling distribution. → **LEAF: Neyman–Pearson (Classic)**
  *   (B) No, only the data matter. → **LEAF: Likelihood Frequentist (Rare)**

  **Q9. (If Tool) Is the debate itself a category error?**
  *   (A) Yes, use whatever solves the engineering problem. → **LEAF: Pragmatist**
  *   (B) No, one framework is ultimately correct. → **Go to Q10**

  **Q10. (If Tool, Realist) Do you assume your model is true?**
  *   (A) Yes. → **LEAF: Classical Model-Based**
  *   (B) No, all models are wrong. → **LEAF: Model-Checking View**

  ---

  ### Diagnosis

  **1. Empty Cell: "Fisherian + Decision Rule" (Q5-A → Q7)**
  *   **Status:** Incoherent.
  *   **Reason:** Fisher explicitly rejected "acceptance procedures." For Fisher, a p-value was evidence to inform the scientist, not a rule to automate a decision. Combining pure evidence quantification with rigid behavioral decision rules contradicts the Fisherian commitment to scientific inference over industrial quality control.

  **2. Indistinguishable Leaves: "Subjective/Objective/Empirical Bayes" (Q4-B)**
  *   **Status:** Cannot separate.
  *   **Reason:** In practice, the line between an "Objective" prior (derived from rules) and an "Empirical" prior (derived from data) blurs when weakly informative priors are tuned on historical data. The tree collapses these because operational behavior (updating belief without portfolio control) is identical, even if philosophical justification differs.

  **3. Misrepresentation Node: Q1 (Ontology of Probability)**
  *   **Status:** Misrepresents the Hybrid.
  *   **Reason:** Your platform *requires* a dual ontology: Belief for the stopping rule (Q1-A) but Frequency for the portfolio budget (Q1-B). Forcing an engineer to choose one at Q1 misrepresents the hybrid commitment. A perfect tree would allow a "Both, depending on scope" answer, but binary branching obscures this pragmatic duality.
