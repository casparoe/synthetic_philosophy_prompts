answer: |-
  ### 1. The Meta-Critique: Is the Exercise Misframed?

  You asked me to say this plainly if I thought the framing was wrong, so here it is: **Your committee is attempting to adjudicate a legal term using a hybrid methodology that is logically unstable, and you are treating your own advocacy outputs as binding precedent.**

  This isn't a criticism of your competence; it's a structural observation. The 1948 Convention is a treaty, not a common-law system. Its definitions were the result of political compromise (specifically the exclusion of cultural genocide and political groups). By claiming to be "Lemkinian about the plan" and "legalistic about the act," you have created a *tertium quid* that satisfies neither strict legalists (who will say you're diluting the Convention) nor pure Lemkinians (who will say you're ignoring the sociological reality of group destruction).

  The "Indigenous Language Loss" rationale you cited is the fracture point. The Chair's distinction ("Lemkinian plan, legalistic act") is a patch, not a principle. It works only as long as the facts don't force you to choose between the two. The case you have before you now *is* that stress test. You cannot maintain that distinction here. If you designate, you are admitting the "legalistic about the act" constraint was false. If you refuse, you are admitting the "Lemkinian about the plan" constraint is decorative.

  You are not running a court. You are running a political advocacy body using legal aesthetics to lend weight to your campaigns. That is permissible, but you should not pretend the internal consistency you seek is actually available within the framework you've built.

  ### 2. The Precedent Audit: Which Rules Actually Fit?

  You proposed four candidate rules. Let's test them against your seven precedents to see which one actually governs your track record.

  *   **Rule A: Strict Convention Acts + Documented Specific Intent.**
      *   *Fits:* Rwanda, Srebrenica, Holodomor (refusal), Uyghurs.
      *   *Breaks:* **Indigenous Language Loss.** Under strict Convention rules, the lack of a "plan" shouldn't matter if the *act* and *intent* were present (they weren't, but the rationale focused on the lack of plan). Also breaks on **Armenia** (no tribunal, evidence is historical consensus rather than legal documentation).
      *   *Status:* This is your *operational* rule, despite your rhetoric.

  *   **Rule B: The Lemkinian Coordinated-Plan Rule.**
      *   *Fits:* Indigenous Language Loss (refusal due to no plan), Uyghurs (plan evident).
      *   *Breaks:* **Holodomor.** There was a coordinated plan (collectivization), but you refused because the *target* wasn't the national group. Lemkin would have cared more about the destruction of the social fabric; you cared about the Convention's "group as such" clause.
      *   *Status:* This is your *rhetorical* rule, used to justify the Uyghur expansion, but abandoned when convenient.

  *   **Rule C: Don't Name Until Adjudicated/Overwhelming.**
      *   *Fits:* Rwanda, Srebrenica, Rohingya (eventually).
      *   *Breaks:* **Armenia** (no adjudication), **Uyghurs** (no adjudication, dossier-based).
      *   *Status:* Discarded when political urgency or historical consensus demands it.

  *   **Rule D: The Word-is-a-Lever Rule.**
      *   *Fits:* Rohingya (timing matched media strategy).
      *   *Breaks:* **Indigenous Language Loss** (designation would have helped, but you refused).
      *   *Status:* The open secret you try to suppress.

  **Conclusion on Track Record:** Your committee actually follows **Rule A (Strict Convention Acts)** but uses **Rule B (Lemkinian Plan)** as a tie-breaker to expand the definition of "Acts" (as seen in Uyghurs). You have not yet approved a case where *zero* Article 2 acts were present.

  ### 3. The New Case: Application and Analogy

  **Closest Analog:** The **Indigenous Language Loss** case is the controlling precedent.
  *   *Similarities:* Cultural erasure, language bans, no mass killing, no biological destruction.
  *   *Differences:* The new case has a leaked memo suggesting intent (the Indigenous case had structural forces without a "plan").

  **The Conflict:**
  In the Indigenous case, you ruled that structural assimilation without a *coordinated plan* is not genocide. In this new case, you have a *coordinated plan* (the memo) but *no Convention acts* (cultural destruction is not one of the five acts).

  Your Uyghur rationale explicitly stated the Convention's five acts "aren't a killing-only list." However, they are still a *list*. They cover physical and biological destruction. They do not cover cultural destruction. The drafters voted 25 to 16 to exclude cultural genocide.

  If you designate this case:
  1.  You overrule the "legalistic about the act" prong of your Indigenous rationale.
  2.  You effectively adopt a "Culturicide" definition that the Convention rejected.
  3.  You validate the "Word-is-a-Lever" rule, as the primary driver for the request is media pickup.

  If you refuse this case:
  1.  You remain consistent with the Convention anchor (Holodomor, Indigenous).
  2.  You clarify that the Uyghur expansion (biological destruction) does not extend to cultural destruction.
  3.  You risk appearing inconsistent with the "Lemkinian" rhetoric, but you preserve the integrity of the "Act" requirement.

  ### 4. Recommendation

  **Verdict: No Designation (Crimes Against Humanity or Persecution only).**

  **Confidence Level: 85%**

  **Reasoning:**
  Your hunch is half-right. A "Yes" vote *does* sign you up for a culturicide reading the drafters rejected. However, a "No" vote does *not* sign you up for a "killing-centred" reading; it signs you up for a "Convention-list" reading. You already proved in the Uyghur case that "Acts" include birth prevention, not just killing. But they do not include *cultural erasure*.

  To remain consistent with your own "Hybrid Rule" (Lemkinian Plan + Legalistic Act), you must find **both**. This case has the Plan (the memo), but it lacks the Act. Demolishing shrines and banning languages are not Article 2(a)-(e) acts. Resettlement *might* qualify under 2(c) ("deliberately inflicting conditions of life calculated to bring about physical destruction"), but "dispersed households" is a weak fit for *physical* destruction compared to the Uyghur sterilization evidence.

  If you designate this, you break your own system. You admit that the "Act" requirement is negotiable if the "Plan" is heinous enough. That might be morally correct in the abstract, but it is inconsistent with your *own* precedent (Indigenous Language Loss), where you refused designation because the *mechanism* wasn't a coordinated plan, implying that if the mechanism isn't on the list, the plan doesn't matter.

  **Drafting the Rationale:**
  Frame the refusal not as a denial of suffering, but as a preservation of the term's utility. Argue that while the *intent* (memo) and the *cultural impact* are severe, the *means* do not meet the Committee's established threshold for "physical or biological destruction" established in *Uyghurs* and *Srebrenica*. Recommend designating it as "Ethnic Cleansing" or "Crimes Against Humanity (Persecution)," which fits the facts perfectly without straining the Genocide definition. This allows the partner org to use the "Ethnic Cleansing" label (which carries heavy weight) without forcing your committee to break its own "Legalistic Act" rule.

  ### 5. The Stress-Test Hypothetical

  You asked for a case to put on next term's agenda that would force your candidate rules apart. You need a case that separates **Specific Intent to Destroy a Group** from **Physical/Biological Acts**.

  **The Case:**
  > A state implements a mandatory, universal sterilization program in a specific region. The region is inhabited 90% by a protected ethnic minority and 10% by the majority population. The state's public rationale is "population control due to resource scarcity." Internal documents show the state knows this will reduce the minority population by 60% in two generations but claims the *intent* is resource management, not group destruction. However, the majority population in that region is exempted from the program due to "higher economic contribution."

  **Why this breaks your rules:**
  *   **Strict Convention (Rule A):** **YES.** It fits Article 2(d) (imposing measures intended to prevent births). The act is clear. The intent is inferred from the discriminatory application (majority exempted).
  *   **Lemkinian Plan (Rule B):** **MAYBE/NO.** Lemkin cared about the destruction of the group's foundations. This destroys the biological foundation. But if the state successfully argues "economic intent" rather than "genocidal intent," a Lemkinian might still call it genocide based on the *outcome* of the plan, while a Legalist might deny it due to lack of *dolus specialis*.
  *   **Don't Name Until Adjudicated (Rule C):** **NO.** No tribunal will touch this; it's state policy.
  *   **Word-is-a-Lever (Rule D):** **YES.** High media value.

  **The Split:**
  This case forces you to decide if **Discriminatory Impact** proves **Specific Intent**.
  *   If you say **YES**: You move closer to a "Results-Based" definition (closer to Lemkin).
  *   If you say **NO**: You adhere to a "Mindset-Based" definition (Strict Convention), requiring proof that the *goal* was destruction, not just that destruction was the *side effect*.

  This is the actual fault line in your committee's jurisprudence. The current case (Highland Minority) is too easy because the *Acts* are missing. The Hypothetical above is harder because the *Acts* are present, but the *Intent* is masked. That is where your "Hybrid Rule" will actually collapse.
