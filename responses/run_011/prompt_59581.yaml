  # Workshop Proposal: Structured Hypotheses and the Equivalence Condition

  **Project Title:** Beyond Extensionality: A Structural Account of Hypothesis Identity in Confirmation Theory

  ### 1. Research Question
  Is it possible to construct a formal confirmation measure that is sensitive to the predicate structure of a hypothesis—thereby assigning different confirmational values to logically equivalent formulations like "All ravens are black" and "All non-black things are non-ravens"—without violating the requirement that substitution of co-extensive predicates in established scientific laws preserves confirmational status?

  ### 2. The Shared Assumption of Standard Resolutions
  The attribution that standard resolutions treat the raven generalization and its contrapositive as a single hypothesis is largely fair, though with one important nuance. The dominant Bayesian resolutions (those arguing the white sneaker provides negligible confirmation) and the Hempelian satisfaction approaches both operate within an extensional semantics: a hypothesis is identified with the set of possible worlds in which it is true. Since the extension of $R \to B$ is identical to $\neg B \to \neg R$, any evidence bearing on one bears on the other *in principle*, even if the degree varies.

  There is a minority position that rejects the Equivalence Condition outright, arguing that confirmation is a pragmatic relation between evidence and the *context of inquiry* rather than the proposition itself. However, these accounts typically locate the difference in the agent's interests or background knowledge, not in the hypothesis itself. They do not offer a formal ontology where the hypothesis *is* a structured object distinct from its truth conditions. My project occupies the gap left by these views: it asks whether the difference can be grounded in the formal identity of the hypothesis (its structure) rather than merely in the pragmatics of the agent. If a resolution already exists that treats hypotheses as structured objects (e.g., via truthmaker semantics), my project shifts to evaluating whether that specific machinery can satisfy the constraints of scientific law without ad-hocery.

  ### 3. Method and Timeline (11 Weeks)
  **Recommended Framework:** I recommend working within a **Hyperintensional Probabilistic Framework**. Standard Bayesianism assigns probabilities to sets of possible worlds, which forces logical equivalents to have identical probabilities. To distinguish $R \to B$ from $\neg B \to \neg R$, we must assign probabilities to structured propositions (e.g., syntactic trees or state descriptions) rather than world-sets. This is preferred over a purely comparative framework because the Raven Paradox turns on quantitative intuitions (negligible vs. zero confirmation), and it is preferred over pure syntax because we still need to respect truth conditions.

  **Week-by-Week Plan:**
  *   **Weeks 1–2: Formalizing the Constraint.** Define the "Equivalence Constraint" (scientific laws must be substitutable) and the "Raven Constraint" (contrapositives must differ in confirmation). Review existing hyperintensional semantic models (e.g., state-space or topic-sensitive models) to select a base.
  *   **Weeks 3–5: Building the Machinery.** Construct a confirmation function $C(H, E)$ where $H$ is a structured object. Define a "structural similarity" metric between Evidence $E$ and Hypothesis $H$. The core technical task is to define a probability distribution over structures that allows $P(H_1) \neq P(H_2)$ even if $H_1 \leftrightarrow H_2$, without violating probability axioms.
  *   **Weeks 6–8: Stress Testing.** Apply the model to the Raven case. Then, apply it to a standard scientific law (e.g., $F=ma$ and its algebraic rearrangements). Adjust the structural similarity metric to ensure the Raven verdict holds while the Scientific Law verdict remains stable.
  *   **Weeks 9–10: Drafting.** Write the 12-page paper. Focus on the definition of the structured hypothesis and the consistency proof.
  *   **Week 11: Presentation Prep.** Condense the formal proof into intuitive visualizations for the 40-minute slot. Prepare responses for the "ad-hoc" objection.

  ### 4. Success and Failure Conditions
  **Success:** The project succeeds if I produce a **Definition-Plus-Consistency Theorem**.
  *   *Definition:* A formal account of a "Structured Hypothesis" and a confirmation relation $C$.
  *   *Theorem:* A proof that there exists a model where $C(\text{Raven-Hyp}, \text{White Shoe}) = 0$ and $C(\text{Contrapositive-Hyp}, \text{White Shoe}) > 0$, while simultaneously $C(\text{Law}_1, E) = C(\text{Law}_2, E)$ for algebraic variants of physical laws.

  **Failure:**
  1.  **Collapse:** The formal machinery inevitably forces $C(H_1, E) = C(H_2, E)$ whenever $H_1 \leftrightarrow H_2$ to preserve probability coherence, rendering the structural distinction mathematically inert.
  2.  **Ad-Hocery:** The model resolves the Raven Paradox only by introducing parameters specifically tuned to "raven-like" predicates, failing to generalize to other cases (e.g., "All emeralds are green") or breaking the substitutability of standard physical laws.

  ### 5. Scope and Defense
  **Scope Management:** To fit twelve pages, I must cut the historical survey of the Raven Paradox entirely, referencing it only as a motivating puzzle. I will also limit the discussion of alternative hyperintensional frameworks to a footnote. The paper will focus exclusively on the construction of the model and the consistency proof.

  **Primary Defense:** The single claim I must defend during the Q&A is that **confirmation is a relation between evidence and a representation, not evidence and a world-set.** If I can hold this line—that the "hypothesis" in confirmation theory is a cognitive or linguistic structure rather than a proposition in the logical sense—the objection that I am violating logical extensionality loses its force. The risk is that this makes confirmation too psychological; I must argue it is structural, not merely psychological.

  ***

