          *   Team Beta gets "Mission Sheet Beta" which lists Sample ID 1-24 and their Toxicity.
          *   Both teams get the same 24 Cards (Observables only).
          *   They must match the Cards to the Sheet to find the correlation.
      *   *This works.* It enforces the "Interest-Relative" aspect. They literally see different "facts" about the same objects based on their client.

  13. **Final Polish:** Check the timing. 75 mins is tight for 18 students to sort 24 cards.
      *   Suggestion: Print the cards on paper, cut them out.
      *   Suggestion: Pre-assign the groups.
      *   Suggestion: Keep the properties very distinct (icons or bold text).

