answer: |-
  This is a classic "Promiscuous Realism" setup (à la John Dupré). The goal is to demonstrate that multiple, incompatible classification systems can be equally *objective* and *projectible* (good at prediction) without one being the "One True Taxonomy."

  Here is the complete kit for your 75-minute seminar.

  ### 1. The Setup (5 Minutes)
  **The Scenario:** The class is a consultancy firm hired by the UN to analyze 24 rock samples from a newly discovered moon.
  **The Constraint:** You have limited budget. You cannot run every test on every sample. You must find a **classification system** (a way of grouping the rocks) that allows you to predict unknown properties based on visible ones.
  **The Split:** Divide the 18 students into **two large teams (9 students each)**.
  *   **Team Alpha (Infrastructure Corp):** They want to build a base. They care about **Structural Integrity**.
  *   **Team Beta (Bio-Safety Ltd):** They want to handle the rocks. They care about **Chemical Toxicity**.

  ### 2. The Materials
  You need to print and cut three sets of materials.

  #### A. The Sample Deck (24 Cards)
  *Print 2 copies of this deck (one for each team). The "Hidden Data" column is NOT on the card. It is on the Mission Sheet.*

  | ID | Mass | Magnetism | Sound | Hue | Scent | Luster |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **01** | Heavy | Yes | Ring | Green | Acid | Gloss |
  | **02** | Heavy | Yes | Ring | Green | Acid | Gloss |
  | **03** | Heavy | Yes | Ring | Green | Acid | Gloss |
  | **04** | Heavy | Yes | Ring | Green | Acid | Gloss |
  | **05** | Heavy | Yes | Ring | Green | Acid | Gloss |
  | **06** | Heavy | Yes | Ring | Green | Acid | Gloss |
  | **07** | Heavy | Yes | Ring | Grey | None | Dull |
  | **08** | Heavy | Yes | Ring | Grey | None | Dull |
  | **09** | Heavy | Yes | Ring | Grey | None | Dull |
  | **10** | Heavy | Yes | Ring | Grey | None | Dull |
  | **11** | Heavy | Yes | Ring | Grey | None | Dull |
  | **12** | Heavy | Yes | Ring | Grey | None | Dull |
  | **13** | Light | No | Thud | Green | Acid | Gloss |
  | **14** | Light | No | Thud | Green | Acid | Gloss |
  | **15** | Light | No | Thud | Green | Acid | Gloss |
  | **16** | Light | No | Thud | Green | Acid | Gloss |
  | **17** | Light | No | Thud | Green | Acid | Gloss |
  | **18** | Light | No | Thud | Green | Acid | Gloss |
  | **19** | Light | No | Thud | Grey | None | Dull |
  | **20** | Light | No | Thud | Grey | None | Dull |
  | **21** | Light | No | Thud | Grey | None | Dull |
  | **22** | Light | No | Thud | Grey | None | Dull |
  | **23** | Light | No | Thud | Grey | None | Dull |
  | **24** | Light | No | Thud | Grey | None | Dull |

  *(Note: Properties 1-3 correlate with Material Type. Properties 4-6 correlate with Surface Coating. They are orthogonally distributed.)*

  #### B. The Mission Sheets (Confidential)
  *Give Team Alpha Sheet A, Team Beta Sheet B. They should not show these to each other until the end.*

  **Mission Sheet A (Infrastructure)**
  *Goal: Predict **Load Capacity** (High/Low).*
  *   Samples 01–12: **HIGH**
  *   Samples 13–24: **LOW**
  *(Instruction: Use the Sample Deck to find which visible properties predict Load Capacity.)*

  **Mission Sheet B (Bio-Safety)**
  *Goal: Predict **Toxicity** (Safe/Toxic).*
  *   Samples 01–06: **TOXIC**
  *   Samples 07–12: **SAFE**
  *   Samples 13–18: **TOXIC**
  *   Samples 19–24: **SAFE**
  *(Instruction: Use the Sample Deck to find which visible properties predict Toxicity.)*

  #### C. The Test Set (4 New Cards)
  *Print one set. Keep these hidden until the Prediction Round.*

  | ID | Mass | Magnetism | Sound | Hue | Scent | Luster |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **25** | Heavy | Yes | Ring | Green | Acid | Gloss |
  | **26** | Heavy | Yes | Ring | Grey | None | Dull |
  | **27** | Light | No | Thud | Green | Acid | Gloss |
  | **28** | Light | No | Thud | Grey | None | Dull |

  *(Hidden Answers for Instructor: 25=High/Toxic, 26=High/Safe, 27=Low/Toxic, 28=Low/Safe)*

  ---

  ### 3. The Procedure (70 Minutes)

  **Phase 1: Pattern Finding (20 mins)**
  *   Hand out the Decks and Mission Sheets.
  *   Teams must physically sort the 24 cards into piles that correspond to their Goal (e.g., High Load vs. Low Load).
  *   They must identify the **Indicator Properties**. (Alpha should find Mass/Mag/Sound; Beta should find Hue/Scent/Luster).
  *   *Instructor Role:* Circulate. If a team tries to look at the other team's Mission Sheet, stop them. "Stay in your lane."

  **Phase 2: The Prediction Test (15 mins)**
  *   Collect the 24-card decks.
  *   Hand each team the 4 **Test Set** cards (25-28).
  *   **Task:** Based on your taxonomy, predict your specific Outcome for these 4 new samples.
  *   **Scoring:** Reveal the answers.
      *   Team Alpha will get 4/4 correct (based on Mass).
      *   Team Beta will get 4/4 correct (based on Hue).
  *   *Crucial Moment:* Ask Team Alpha to predict *Toxicity* for the Test Set. They will fail (50% chance, likely worse). Ask Team Beta to predict *Load*. They will fail.

  **Phase 3: The Confrontation (10 mins)**
  *   Bring the groups together.
  *   Ask Team Alpha: "Show us your Kinds." (They present: The Heavies vs. The Lights).
  *   Ask Team Beta: "Show us your Kinds." (They present: The Greens vs. The Greys).
  *   Point out the conflict: Sample 01 is a "Heavy" (Alpha Kind 1) and a "Green" (Beta Kind 1). Sample 07 is a "Heavy" (Alpha Kind 1) but a "Grey" (Beta Kind 2).
  *   **The Trap:** One group will inevitably say, "Well, Mass is more fundamental than Color," or "Your groups are just superficial."

  **Phase 4: The Debrief (25 mins)**
  *   Use the questions below to steer the conflict into philosophy.

  ---

  ### 4. Debrief Questions & Steering

  **Q1: "Was Team Beta's classification arbitrary?"**
  *   *Student pushback:* "Yes, it's just surface color."
  *   *Your counter:* "They predicted toxicity with 100% accuracy on new samples. If their kinds were arbitrary, how did they do that? Is a classification 'real' if it successfully predicts causal powers?"
  *   *Philosophical Point:* **Projectibility.** Natural kinds are often defined by their ability to support inductive inference (Goodman). Both teams achieved this.

  **Q2: "Can a single object belong to two incompatible kinds?"**
  *   Sample 01 is *Kind A1* and *Kind B1*. Sample 07 is *Kind A1* and *Kind B2*.
  *   *Philosophical Point:* **Crosscutting Kinds.** Nature isn't a single hierarchy (like a Porphyrian tree). It's a matrix of causal structures. A rock is a "mineral kind" AND a "chemical kind." Neither is the "true" kind.

  **Q3: "Who carved the joint?"**
  *   Did the students find the joints, or did they make them?
  *   *Philosophical Point:* **Realism vs. Pragmatism.** The correlations (Mass→Load, Hue→Toxic) were *in the world* (Realism). But which correlation mattered enough to form a "Kind" depended on the *human interest* (Pragmatism). This is **Interest-Relative Realism**.

  **Q4: "What if a third team (Jewelers) came in?"**
  *   They might group by Luster and Hue, ignoring Mass and Toxicity.
  *   *Philosophical Point:* **Promiscuous Realism (Dupré).** There is no limit to the number of valid taxonomies. "Carving at the joints" implies there is only one carcass. Maybe there are many overlapping carcasses.

  ---

  ### 5. Handling the Stalemate
  If Team Alpha insists their kinds are "more real" (e.g., "Mass is physical, Color is subjective"):

  1.  **Grant the premise:** "Okay, assume Mass is more fundamental microphysically."
  2.  **Press the consequence:** "Does that make Team Beta's predictions *false*? No. Does it make their safety protocols *useless*? No."
  3.  **The Lesson:** "Science isn't just about finding the most fundamental particles. It's about managing risk and building things. If 'Toxic' isn't a natural kind, then medicine isn't science. If 'Conductive' isn't a natural kind, engineering isn't science. Both are sciences. Therefore, both kinds are natural."

  ### 6. Limitations (Be Straight With Them)
  End the class by admitting what this activity *didn't* do. This builds trust and shows depth.

  1.  **Theory-Ladenness:** In the activity, properties like "Mass" and "Green" were given. In real science, *deciding* what properties to measure is itself theoretical. We didn't stage the struggle of discovering the properties, only sorting them.
  2.  **Essence vs. Cluster:** This activity models **Homeostatic Property Clusters** (Boyd). It doesn't model **Essentialism** (Kripke/Putnam). In real chemistry, microstructure usually trumps macro properties (e.g., Pyrite looks like gold but isn't). Here, "Green" was just as reliable as "Mass." In reality, some joints are deeper than others.
  3.  **The "One World" Assumption:** We assumed the moon rocks don't change. In biology, kinds evolve. This activity is static; it doesn't capture the historical nature of biological species.
  4.  **Normativity:** We measured success by prediction. But sometimes we classify for *explanation*, not prediction. A taxonomy might be predictively useful but explanatorily shallow (e.g., classifying diseases by symptom vs. by virus). We didn't touch on that distinction.

  ### Instructor Cheat Sheet: The Data Logic
  *   **Samples 1-6:** Heavy + Green (High Load / Toxic)
  *   **Samples 7-12:** Heavy + Grey (High Load / Safe)
  *   **Samples 13-18:** Light + Green (Low Load / Toxic)
  *   **Samples 19-24:** Light + Grey (Low Load / Safe)

  *   **Team Alpha** groups {1-12} vs {13-24}.
  *   **Team Beta** groups {1-6, 13-18} vs {7-12, 19-24}.
  *   **Overlap:** Sample 1 and Sample 7 are in the *same* Alpha group, but *different* Beta groups. Sample 1 and Sample 13 are in *different* Alpha groups, but the *same* Beta group.

  This ensures that when they compare notes, the taxonomies are genuinely **incompatible**, not just slightly different.
