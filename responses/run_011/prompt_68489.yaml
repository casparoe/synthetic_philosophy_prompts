  5.  **Refining the Vocabulary:**

      *   Avoid "Moral Agency," "Ontological Gap."
      *   Use "Could they have done otherwise?", "Who owned the switch?", "Who signs for the fix?"
      *   Flag judgment calls explicitly (e.g., [JUDGMENT CALL]).

  6.  **Addressing the Regulator & Family:**

      *   Regulator: Needs a name. The name is the "Accountable Owner of the Remediation," not necessarily the "Perpetrator."
      *   Family: Needs truth. "The tool contributed, the system failed to monitor, we are fixing the monitoring." Avoid "It was the nurse's fault" if it wasn't.

  7.  **Limitations Section:**

      *   Cannot quantify probabilistic causation perfectly.
      *   Cannot fix broken culture (if leadership refuses to accept "No Locus").
      *   Cannot distinguish smart diffusion of blame from genuine distributed causality without deep technical audit.

  8.  **Final Review against Constraints:**

      *   90-minute procedure? Yes.
      *   No lawyers/philosophers? Yes.
      *   Plain vocabulary? Yes.
      *   Stop conditions (Named, Org, No Locus)? Yes.
      *   "No Locus" types mapped to responses? Yes.
      *   Regulator signature solution? Yes.
