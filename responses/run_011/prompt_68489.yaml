answer: |-
  # The Algorithmic Event Review Worksheet
  **Timebox:** 90 Minutes  
  **Participants:** Incident Review Committee (6 pax)  
  **Goal:** Determine *what* happened, *who* owns the fix, and *how* we account for it without manufacturing a scapegoat.

  ---

  ## Part 1: The Setup (5 Minutes)
  **Instruction:** Read the event summary aloud. Confirm everyone agrees on the basic timeline.
  **[JUDGMENT CALL]:** *Agreeing on the timeline often hides disagreement on what matters. If two members disagree on whether the tool "caused" the event or just "was present," note it here and move on. Do not resolve it yet.*

  *   **Event ID:**
  *   **Tool Involved:**
  *   **Outcome Severity:**

  ---

  ## Part 2: The Three Gates (60 Minutes)
  *Proceed sequentially. You must pass through Gate 1 to reach Gate 2. You must pass through Gate 2 to reach Gate 3. Stop at the first gate that yields a definitive finding.*

  ### Gate 1: The Human Agency Test (20 Minutes)
  *Goal: Determine if a clinician had a real, safe option to prevent the harm.*

  **Q1.1: Did the clinician deviate from established clinical protocol (independent of the tool)?**
  *   *Sufficient Answer:* Yes/No based on written policy, not "common practice."
  *   *If YES:* The tool is context, not cause. Proceed to **Stop Condition A**.
  *   *If NO:* The clinician followed protocol or used judgment where protocol allows. Proceed to Q1.2.

  **Q1.2: Was the clinician's decision reasonable given the information available to them at that moment?**
  *   *Sufficient Answer:* Would a peer with the same training, same access, and same workload have done the same?
  *   *[JUDGMENT CALL]:* *This is the "Last-Nurse" trap. You must ignore hindsight. If the tool output was confusing, contradictory, or known to be noisy, the answer is usually "Yes, it was reasonable."*
  *   *If YES (Reasonable):* The clinician is not the locus. Proceed to Gate 2.
  *   *If NO (Unreasonable):* The clinician is the locus. Proceed to **Stop Condition A**.

  **Q1.3: Did the tool remove the option to act safely?**
  *   *Sufficient Answer:* Did the tool lock the workflow, hide critical data, or impose a time pressure that made safety checks impossible?
  *   *If YES:* The clinician is exonerated. Proceed to Gate 2.
  *   *If NO:* The clinician had agency. If Q1.2 was "Yes," proceed to Gate 2.

  > **Stop Condition A: Named Individual (Clinician)**
  > *   **Finding:** The harm was preventable by the clinician exercising standard care, and they failed to do so. The tool was present but did not force the error.
  > *   **Action:** Standard disciplinary/remediation pathway for human error.
  > *   **Regulator Output:** Name the clinician's supervisor as the "Accountable Executive" for ensuring remediation is completed.
  > *   **Family Script:** "A specific step in care was missed. We are addressing this with the staff involved."

  ---

  ### Gate 2: The Upstream Control Test (25 Minutes)
  *Goal: Determine if an organizational role owned the configuration or monitoring of the tool.*

  **Q2.1: Did the tool behave outside its validated specifications?**
  *   *Sufficient Answer:* Compare actual output to vendor documentation or last known valid state.
  *   *If YES (Malfunction/Drift):* Proceed to Q2.2.
  *   *If NO (Worked as designed):* Proceed to Gate 3.

  **Q2.2: Was there a named role responsible for monitoring this specification?**
  *   *Sufficient Answer:* Check job descriptions and RACI charts.
  *   *If YES (Role Exists):* Did that role fail to execute their duty (e.g., ignored alerts, skipped audits)?
      *   *If YES:* Proceed to **Stop Condition B**.
      *   *If NO (They did their job, but the system hid the error):* Proceed to Q2.3.
  *   *If NO (No Role/Drift Monitoring Unassigned):* Proceed to **Stop Condition C**.

  **Q2.3: Was the change (threshold, config, data feed) approved by our change-control process?**
  *   *Sufficient Answer:* Check change logs and sign-offs.
  *   *If YES (Approved internally):* Who signed? Proceed to **Stop Condition B**.
  *   *If NO (Vendor/External change without notice):* Proceed to **Stop Condition C**.

  > **Stop Condition B: Named Individual (Leader/Owner)**
  > *   **Finding:** A specific person or role had the authority and duty to prevent the tool configuration error and failed to execute that duty.
  > *   **Action:** Performance management for the role holder; immediate config rollback.
  > *   **Regulator Output:** Name the Department Head or CMIO as the "Accountable Executive."
  > *   **Family Script:** "A setting on the tool was not managed correctly. We have assigned a specific leader to ensure this is monitored."

  > **Stop Condition C: Organizational Locus (Process Gap)**
  > *   **Finding:** The harm resulted from a gap in our governance. No single person could have reasonably known or stopped this given their current role and resources.
  > *   **Action:** Create a new role or assign the duty to an existing role. Do not punish the past.
  > *   **Regulator Output:** Name the **Chief Medical Officer or Risk Lead** as the "Accountable Executive." *Note: They are signing for the organization's commitment to fix the gap, not admitting personal negligence.*
  > *   **Family Script:** "Our system for monitoring this tool had a gap. We are closing that gap now."

  ---

  ### Gate 3: The Policy & Trade-off Test (15 Minutes)
  *Goal: Determine if the harm was a known cost of doing business.*

  **Q3.1: Did the tool perform exactly as the vendor promised and we procured?**
  *   *Sufficient Answer:* Yes/No based on contract and validation reports.
  *   *If NO:* Return to Gate 2.
  *   *If YES:* Proceed to Q3.2.

  **Q3.2: Was the risk that materialized a known trade-off discussed during procurement?**
  *   *Sufficient Answer:* Check procurement minutes or risk assessment logs.
  *   *If YES:* Proceed to **Stop Condition D**.
  *   *If NO (Unknown risk/Emergent behavior):* Proceed to **Stop Condition C**.

  > **Stop Condition D: Policy Locus (Strategic Choice)**
  > *   **Finding:** The harm was a statistically inevitable result of a policy choice we made (e.g., sensitivity vs. specificity). No one "erred."
  > *   **Action:** Re-open policy discussion. Is the trade-off still acceptable?
  > *   **Regulator Output:** Name the **CEO or Board Chair** as the "Accountable Executive." *This signals the decision is strategic, not operational.*
  > *   **Family Script:** "We use a tool that prioritizes X over Y. In this case, that balance resulted in this outcome. We are reviewing if that balance is still right."

  ---

  ## Part 3: The "No Locus" Gap Analysis (15 Minutes)
  *Use this section if you landed on Stop Condition C or D. This is where you categorize the "No Locus" finding so you know how to fix it.*

  **[JUDGMENT CALL]:** *Distinguishing between these gaps requires honesty about power dynamics. Do not select "Capacity Gap" if the real issue is that leadership won't fund the fix.*

  | Gap Type | Definition | Institutional Response |
  | :--- | :--- | :--- |
  | **1. Accountability Void** | Everyone was responsible, so no one was. (e.g., Drift monitoring in 3 job descriptions). | **Assign Ownership.** Pick one role. Update job description. Budget for the time. |
  | **2. Capacity Void** | Someone was responsible, but lacked the tools/time to know. (e.g., Vendor changed code without notice). | **No-Fault Review.** Do not punish. Renegotiate contract or demand audit rights. |
  | **3. Knowledge Void** | No one could have known this risk existed. (e.g., Emergent AI behavior). | **Transparency + Monitor.** Disclose uncertainty to regulator. Increase surveillance frequency. |
  | **4. Repair Void** | We know what broke and who owns it, but fixing it costs more than the risk budget allows. | **Risk Acceptance.** Executive sign-off required to continue using the tool with known defect. |

  ---

  ## Part 4: Regulatory & Disclosure Mapping (10 Minutes)
  *Goal: Translate the finding into the required outputs.*

  **1. The Regulator's Signature**
  *   **Requirement:** One named executive.
  *   **Procedure:** The "Accountable Executive" is the person with the budget to implement the **Institutional Response** in Part 3.
  *   **Warning:** Do not name the CEO for a nurse error. Do not name the Nurse for a vendor error. The signature represents *authority to fix*, not *culpability for harm*.

  **2. The Family Conversation**
  *   **Requirement:** Truth without legal suicide.
  *   **Procedure:** Use the "Gap Type" from Part 3.
      *   *If Accountability Void:* "We missed assigning this task. We have fixed that."
      *   *If Capacity Void:* "The system changed without our knowledge. We are changing the contract."
      *   *If Policy Locus:* "We made a choice on how the tool works. We are reviewing that choice."
  *   **Constraint:** Do not use the word "negligence" unless Stop Condition A or B is met. Use "gap," "oversight," or "trade-off."

  ---

  # Application to Your Three Cases

  Here is how the worksheet processes your specific scenarios.

  ### Case 1: Sepsis Alert / Threshold Drift
  *   **Gate 1 (Human Agency):**
      *   Q1.1: Did she deviate from protocol? *Protocol says "Take alerts seriously." She dismissed it.* **Potential Deviation.**
      *   Q1.2: Was it reasonable? *Vendor lowered threshold 6 weeks prior. Alert fatigue high. Patient "looked well."* **[JUDGMENT CALL]:** If "looking well" is clinically insufficient for sepsis rule-out per policy, she is liable. If policy allows clinical judgment to override, she is reasonable. Given the "onboarding module" instruction, the system trained her to trust the alert, then the system broke the trust.
      *   *Worksheet Outcome:* Likely **Pass to Gate 2**. The "Reasonable" test favors the nurse due to system-induced fatigue.
  *   **Gate 2 (Upstream Control):**
      *   Q2.1: Did tool behave outside specs? *Yes, threshold changed.*
      *   Q2.3: Was change approved? *No, vendor did it under contract notice-only.*
      *   *Worksheet Outcome:* **Stop Condition C (Organizational Locus).**
  *   **Gap Analysis:** **Capacity Void.** The organization lacked the contractual power or technical process to notice the change.
  *   **Regulator:** CMIO signs (owns the vendor mgmt fix).
  *   **Family:** "Our monitoring system for the tool's settings had a gap. We are fixing the contract."
  *   **Note on Clinician Blame:** If your committee feels the nurse *must* be named, it is because Q1.1 (Protocol Deviation) is being weighted higher than Q1.2 (Reasonableness). The procedure forces you to admit that if you blame her, you are blaming her for reacting normally to a system you broke.

  ### Case 2: Readmission / Silent Data Drift
  *   **Gate 1 (Human Agency):**
      *   Q1.1: Deviation? *No, discharge followed risk score.*
      *   Q1.2: Reasonable? *Yes, relied on provided data.*
      *   *Worksheet Outcome:* Pass to Gate 2.
  *   **Gate 2 (Upstream Control):**
      *   Q2.1: Outside specs? *Yes, data field empty.*
      *   Q2.2: Named role for monitoring? *No, "unassigned in practice."*
      *   *Worksheet Outcome:* **Stop Condition C (Organizational Locus).**
  *   **Gap Analysis:** **Accountability Void.** Duty was written into three jobs, owned by none.
  *   **Regulator:** Risk Lead (You) signs. You own the fix (assigning the duty).
  *   **Family:** "We failed to assign a person to check the data quality. We have now assigned that person."
  *   **Probabilistic Note:** The fact that readmission was "likely anyway" does not clear the tool. The tool *mis-ranked* the risk, altering the care plan (e.g., less follow-up). The procedure treats the *mis-ranking* as the event, not the readmission itself.

  ### Case 3: ICU Dosing / Known Trade-off
  *   **Gate 1 (Human Agency):**
      *   Q1.1: Deviation? *No, followed suggestion.*
      *   *Worksheet Outcome:* Pass to Gate 2.
  *   **Gate 2 (Upstream Control):**
      *   Q2.1: Outside specs? *No, performed as designed.*
      *   *Worksheet Outcome:* Pass to Gate 3.
  *   **Gate 3 (Policy):**
      *   Q3.2: Known trade-off? *Yes, procurement committee chose this.*
      *   *Worksheet Outcome:* **Stop Condition D (Policy Locus).**
  *   **Gap Analysis:** **Repair Void / Policy Gap.** The harm is the cost of the chosen benefit.
  *   **Regulator:** CEO/CMIO signs. They own the policy, not the execution.
  *   **Family:** "This tool is designed to prevent X, which carries a risk of Y. We are reviewing if that design is right for our patients."
  *   **Discomfort:** This is the hardest conversation. It admits the organization chose a risk profile that harmed this patient. It is not an apology for error, but an acknowledgment of risk.

  ---

  # Limitations & Warnings

  **1. Where this procedure cannot distinguish real gaps from blame diffusion.**
  If your culture is highly political, "Stop Condition C" (Organizational Locus) will become a hiding spot. Leaders will argue "Capacity Void" to avoid "Accountability Void."
  *   *Mitigation:* The worksheet requires you to name the **Remediation Owner**. If you claim "No one could have known," but you refuse to fund monitoring, the Regulator will see through it. The signature requirement forces the executive to put their name on the *fix*, not just the *excuse*.

  **2. Where the tool's contribution is unquantifiable.**
  In Case 2 (Readmission), if you cannot prove the empty data field *caused* the readmission (vs. base rate), the procedure still flags the **Data Drift** as the event.
  *   *Risk:* You are investigating a "near miss" that turned into a harm by chance.
  *   *Limitation:* The procedure treats the *process failure* (drift) as the reportable event, not just the patient outcome. This is defensible but may feel abstract to a family.

  **3. Where the answer is defensible but unacceptable to a family.**
  In Case 3 (Trade-off), telling a family "We chose this risk profile" is honest, but it may sound like "Your harm was acceptable collateral damage."
  *   *Limitation:* This procedure protects the organization from false blame, but it does not generate moral comfort. It separates *blame* from *responsibility to repair*. You may need a parallel compensation pathway (no-fault) for Case 3 outcomes, as the procedure explicitly finds "No Error."

  **4. The "Named Clinician" Constraint.**
  You noted you expect the procedure to land on a clinician in at least one case.
  *   *Analysis:* Based strictly on the facts provided, **Case 1** is the only candidate. If your committee determines that "Patient looked well" is *clinically negligent* regardless of the alert (i.e., sepsis protocol mandates labs regardless of appearance), then Gate 1 Q1.1 triggers **Stop Condition A**.
  *   *Why the procedure does not dissolve this:* If the standard of care is independent of the tool, the tool is irrelevant. The procedure protects clinicians from *tool-induced* error, not *tool-ignored* negligence. If the nurse skipped a mandatory lactate draw because she was tired, the sepsis algorithm is a red herring. The worksheet forces you to isolate that. If you name her, ensure it is because she violated a *human* standard, not because she trusted a *broken* machine.

  **5. Legal vs. Safety Vocabulary.**
  *   *Constraint:* "Without turning into an admission lawyers will fight."
  *   *Risk:* The phrase "Accountability Void" sounds like negligence in a deposition.
  *   *Fix:* In external comms, translate "Accountability Void" to "Process Gap." In internal review, keep the blunt truth. The worksheet is for *you*, not for discovery. Ensure your legal counsel reviews the *output scripts*, not the *worksheet logic*.

