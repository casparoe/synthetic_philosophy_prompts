  # Final Instruction to the Committee
  **"We are not here to find a villain. We are here to find the owner of the fix. If the owner is a person who failed, we name them. If the owner is a role that didn't exist, we create it. If the owner is a policy we chose, we review it. We do not close the file until a single executive signs for the remedy."**
