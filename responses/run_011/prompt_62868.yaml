  ### Part 1: Brainstorming Candidate Branch Points

  Here are twelve candidate questions I considered for the tree. I've marked which ones I kept for the final structure and which I cut, with reasons grounded in both ethics and field reality.

  1.  **Do insects feel pain?** (KEEP)
      *   *Why:* This is the foundational empirical claim. Without it, the rest of animal ethics collapses into plant health ethics.
  2.  **Is preventing birth worse than killing?** (KEEP)
      *   *Why:* Directly addresses your Lever 2. Essential for distinguishing Sterile Male techniques from Spraying.
  3.  **Is excluding a bug harm if it starves elsewhere?** (KEEP)
      *   *Why:* Addresses your Lever 3. Crucial distinction between "repellent" and "slow death."
  4.  **Does the number of bugs matter?** (KEEP)
      *   *Why:* Addresses the "small probability × enormous numbers" problem. A utilitarian calculator needs this switch.
  5.  **Is bycatch (non-targets) worse than target kill?** (KEEP)
      *   *Why:* Separates the "Mosquito Abatement" mindset (target only) from the "Gardener" mindset (bees matter more).
  6.  **Does the life stage matter (larva vs. adult)?** (CUT)
      *   *Why:* Too granular. If you value the individual, stage matters less than sentience. If you value the species, stage matters less than reproductive potential. It muddies the water without creating distinct ethical *positions*.
  7.  **Is it worse to act or to let nature take its course?** (CUT)
      *   *Why:* Philosophically rich (Omission vs. Commission), but in a garden, "letting nature take its course" usually means "losing the tomatoes." Most gardeners have already answered this by planting a monoculture.
  8.  **Do we value the species or the individual?** (KEEP)
      *   *Why:* The Holism vs. Individualism split. Essential for the "Community" question you requested.
  9.  **Does moving the problem to a neighbor count as solving it?** (KEEP)
      *   *Why:* Addresses the "refusing to treat moves deaths elsewhere" constraint. Practical ethics needs a boundary.
  10. **Is natural poison better than synthetic poison?** (CUT)
      *   *Why:* The Naturalistic Fallacy. Rotenone is natural and nasty; synthetics can be targeted. This is an aesthetic preference, not an ethical structure.
  11. **Does the intent of the gardener matter?** (CUT)
      *   *Why:* Too internal. Two gardeners can spray the same field, one with malice, one with regret. The ethical weight of the *act* on the insect is the same.
  12. **Is the crop's value higher than the bug's life?** (CUT)
      *   *Why:* This is the default assumption of agriculture. If the answer is "No," they shouldn't be farming. I'll embed this trade-off in other nodes instead.

  ***

  ### Part 2: A Note on Your Three Levers

  You asked me to tell you straight if one of your levers isn't a distinction anyone should care about.

  **Lever 3 (Exclusion/Displacement) is ethically unstable.**
  You define it as "Making a place unusable without killing anyone in it." In a lab, sure. In a field, exclusion is often just delayed killing. If you put a row cover over broccoli, the cabbage moth doesn't just go find a kale patch; if the cover is large enough, she starves. If you use a repellent, she expends energy searching until she dies of exhaustion or predation.
  *Ethical Implication:* Lever 3 is only ethically distinct from Lever 1 if the insect has viable alternative habitat *and* the exclusion doesn't increase predation risk. If you treat Lever 3 as "harmless," you are assuming ecological slack that often isn't there. I have built a node into the tree to force them to confront this.

  **Lever 2 (Prevention) is solid.**
  This is the Non-Identity Problem. You aren't harming a subject; you are preventing a subject. The only ethical weight here is whether "potential life" has value.

