  # WORKING NOTES

  **Candidate Theses on Knowledge and Competence**

  *   **T1 (Constitutive Understanding):** Clinical competence *requires* the ability to articulate the causal or logical grounds for a decision. (Presupposed by Practice 1).
  *   **T2 (Reliabilism):** Clinical competence is defined by the reliability of the outcome (patient health), regardless of the agent's internal grasp of *why* the action worked. (Presupposed by Practice 2 & 3).
  *   **T3 (Institutional Cognition):** Knowledge resides in the system (protocols, committees, data), not the individual. The individual is an executor of institutional knowledge. (Compatible with T2, supports Practice 2).
  *   **T4 (Accountability Proxy):** Articulation is not proof of understanding but a mechanism for legal/ethical accountability. If you can't defend it, you can't be insured/credited. (Compatible with T1 & T2; pragmatic bridge).
  *   **T5 (Mechanistic Skepticism):** Pathophysiological stories are often wrong; empirical regularities (RCTs) are safer guides even if mechanism is unknown. (Presupposed by Practice 3).
  *   **T6 (The "Black Box" License):** A process is medically valid if it yields superior statistical outcomes, even if the internal logic is opaque to the user. (Presupposed by Practice 3, extends to Practice 4).

  **Compatibility Matrix**

  *   **T1 vs. T2:** Incompatible on the definition of *competence*. T1 says mind-state matters; T2 says output matters.
  *   **T1 vs. T3:** Tension. If knowledge is institutional, why test the individual's grasp? *Resolution:* T1 applies to *licensure* (gatekeeping), T3 applies to *operation* (workflow).
  *   **T4 vs. T1:** Compatible. T4 explains *why* we keep T1 even if T2 is true (we need someone to blame/defend).
  *   **T5 vs. T1:** Tension. T1 values the "story" (reasoning); T5 distrusts the "story" (pathophysiology).
  *   **T6 vs. T1:** Direct conflict regarding AI. T1 demands articulation; T6 permits opacity.

  **"Doing No Work" Claims (Trivial/Universal)**

  *   *Claim:* "Patient welfare is the ultimate goal." (Flag: Everyone agrees; explains nothing about the *means*).
  *   *Claim:* "Evidence is better than guesswork." (Flag: Practice 1 and 3 both agree, but define 'evidence' differently).
  *   *Claim:* "Doctors should be competent." (Flag: Tautological).

  **Key Epistemic Tension**
  The core friction is between **Epistemic Internalism** (Practice 1: I must see the justification to know it) and **Epistemic Externalism** (Practice 2 & 3: The process is reliable, so I know it, even if I can't see the justification). Practice 4 forces a choice between them.

  **Plan for Memo**
  1.  Define technical terms (Internalism, Reliabilism, Constitutive) in context.
  2.  Treat the "Oral Exam" not as a test of truth, but of *narrative coherence*.
  3.  Treat "Protocols" as *cognitive offloading*.
  4.  In (f), avoid saying "AI is good/bad." Focus on "What does adopting AI say about the doctor's role?"

