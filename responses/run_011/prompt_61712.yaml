  # MEMORANDUM

  **TO:** Hospital Administration and Clinical Leadership
  **FROM:** Philosophy of Medicine & AI Epistemology Unit
  **SUBJECT:** Epistemic Coherence of Clinical Practices and the Deployment of Opaque Diagnostic Models

  ## Introduction

  This memo analyzes the philosophical commitments underlying four current hospital practices: the oral certification exam, the use of clinical protocols, the hierarchy of evidence, and the proposed deployment of an opaque AI diagnostic model. The goal is not to dictate policy but to reveal the implicit theories of knowledge and competence that currently govern your institution. By making these theories explicit, we can determine whether the adoption of the AI model is consistent with existing practices or requires a fundamental shift in how the hospital defines "medical knowledge."

  Technical terms are defined where introduced.

  ## (a) Implicit Theories of Knowledge and Competence

  Each practice rests on a specific view of what it means to "know" something in a medical context.

  **Practice 1: The Oral Examination**
  *   **Strict Requirement:** This practice presupposes **Epistemic Internalism**. This is the view that for a person to claim knowledge, they must have internal access to the *justification* for that knowledge. It is not enough to be right; one must know *why* one is right.
  *   **Implicit Theory:** Competence is **constitutive** of understanding. Understanding is not just a nice addition to skill; it is part of what skill *is*.
  *   **Alternative Justifications:** Could this be justified without Internalism? Yes.
      *   *Proxy Indicator:* Articulation might merely correlate with deep learning, even if the exam doesn't measure it directly.
      *   *Accountability:* The ability to articulate reasons allows for legal and ethical defense of actions later.
      *   *Deterrent:* The threat of the exam forces candidates to study mechanisms, even if the exam itself only tests speech.
  *   **Assessment:** While the alternative justifications are possible, the *grading rubric* (marking down a correct decision lacking reasons) strictly requires the Constitutive view. It treats understanding as a necessary condition, not just a useful tool.

  **Practice 2: Licensed Practice (Protocols & Checklists)**
  *   **Strict Requirement:** This practice presupposes **Epistemic Externalism** (specifically Reliabilism). This is the view that a belief or action counts as knowledge/competent if it is produced by a reliable process, regardless of whether the agent understands that process.
  *   **Implicit Theory:** Competence is **executive**. The physician is a node in a larger reliable system. The "knowledge" resides in the protocol design, not the clinician's head.
  *   **Comfortable Fit:** This sits comfortably with the **Division of Cognitive Labor**. It assumes committees know the "why," and clinicians need only know the "what."
  *   **Assessment:** This practice strictly requires that compliance without comprehension is sufficient for good practice. It treats individual mechanistic judgment as a source of error (noise) rather than insight.

  **Practice 3: Official Epistemology (Evidence Hierarchy)**
  *   **Strict Requirement:** This practice presupposes **Pragmatic Empiricism**. It values *predictive accuracy* (does the patient get better?) over *explanatory truth* (do we understand the biology?).
  *   **Implicit Theory:** Mechanistic understanding is **fallible**; statistical regularity is **robust**. A "black box" intervention (we know input A leads to output B, but not how) is epistemically superior to a "white box" intervention (we have a beautiful story, but it doesn't work).
  *   **Assessment:** This practice strictly requires that an intervention can be "known to work" without anyone understanding the mechanism. It separates *efficacy* from *explanation*.

  ## (b) Collective Knowledge and the "Black Box"

  **The Strong Thesis**
  Practice 3 commits the profession to the following strong claim: *A medical system can possess knowledge that is superior to individual expert judgment, even if no single individual within the system understands the causal mechanism underlying that knowledge.*
  A defender would state this as: "The 'knowledge' is distributed across the trial data and the guideline committee; the individual clinician accesses this knowledge via compliance, not via personal insight."

  **The Weak Thesis**
  A weaker form licensed by Practice 3 is: *Individual clinicians may act on empirical regularities they do not understand, provided those regularities are statistically validated.*
  This weaker form allows that *someone* (the researcher) understands the stats, even if the clinician doesn't understand the biology.

  **Which One the Profession Needs**
  The profession actually needs the **Strong Thesis**. If we required *someone* to understand the mechanism (the Weak Thesis), many standard treatments (e.g., lithium for bipolar disorder, deep brain stimulation parameters) would be relegated to "experimental" status for decades. To function, modern medicine must accept that the *system* can know what the *human mind* cannot grasp. Practice 3 legitimizes acting on correlation when causation is opaque.

  ## (c) The Collision Between Practice 1 and Practice 3

  **The Collision**
  There is a direct inconsistency. Practice 1 (Oral Exam) tells the resident: "You are not competent unless you can explain the mechanism." Practice 3 (Evidence) tells the same resident: "Mechanistic explanation is low-value evidence; do not trust it over empirical outcome."
  *   **Practice 1 says:** Understanding is necessary for competence.
  *   **Practice 3 says:** Understanding is unnecessary for truth (and often misleading).

  **Testing Distinctions**

  1.  **Mechanistic vs. Statistical Understanding:**
      *   *Proposal:* Practice 1 tests statistical reasoning (why this probability applies), while Practice 3 warns against *pathophysiological* storytelling.
      *   *Verdict:* **Relabels the inconsistency.** The oral exam typically demands pathophysiological justification ("Why does this drug lower pressure?"). If the exam accepted "Because the RCT said so" as a sufficient reason, the tension would dissolve. Currently, it does not.

  2.  **Training vs. Practice (Temporal Distinction):**
      *   *Proposal:* Practice 1 is for *training* (building mental models), while Practice 3 is for *execution* (safety).
      *   *Verdict:* **Removes the inconsistency, but at a cost.** This implies that the "understanding" tested in the exam is a scaffold to be discarded later. It renders the oral exam a **hazing ritual** rather than a genuine assessment of ongoing competence. It suggests we train physicians to be scientists but employ them as technicians.

  3.  **Knowing-Why vs. Knowing-That:**
      *   *Proposal:* Practice 1 tests *Knowing-Why* (justification); Practice 3 validates *Knowing-That* (fact).
      *   *Verdict:* **Relabels the inconsistency.** In medicine, *Knowing-That* (this drug works) is useless without *Knowing-Why* (in this specific patient context, is it safe?). If the "Why" is deemed unreliable by Practice 3, the "What" becomes rigid and potentially dangerous in complex cases.

  **Conclusion on Collision:** The inconsistency is real. The hospital currently demands physicians possess a type of understanding (mechanistic) that its own epistemology (evidence hierarchy) declares unreliable.

  ## (d) The Instrument: Oral Exams and Confabulation

  **The Psychological Challenge**
  Psychological research on **confabulation** suggests that humans often construct rational explanations for decisions *after* the decision is made, based on intuition or pattern recognition they cannot access. If this is true, the oral exam does not test the *source* of the decision (reasoning); it tests the *post-hoc narrative* (eloquence).

  **Implications**
  If candidates are confabulating:
  1.  The Oral Exam becomes an instance of Practice 3. It credits an output (the candidate's speech) that looks like insight but is generated by a process (intuitive pattern matching) the candidate does not actually understand.
  2.  The exam selects for **articulate confabulators**, not necessarily better clinicians.

  **Required Changes to Test Understanding**
  To ensure the exam tests genuine understanding rather than eloquence, it must move beyond asking "Why did you choose X?" (which invites storytelling). It must add:
  1.  **Counterfactual Probing:** "If the patient's creatinine were double, would you still choose X? Why?" This tests if the reasoning is structurally connected to the variables, not just a memorized script.
  2.  **Error Recognition:** Present a plan that *sounds* right but has a subtle flaw. Can the candidate detect the break in logic?
  3.  **Mechanism Manipulation:** Ask the candidate to predict the effect of a novel intervention based on the mechanism they cited. If they truly understand the mechanism, they can extrapolate. If they are reciting a rule, they cannot.

  Without these additions, Practice 1 is vulnerable to the charge that it validates "human black boxes" who are good at talking, while Practice 4 proposes "silicon black boxes" that are good at diagnosing.

  ## (e) Philosophical Underdetermination: Two Reconstructions

  The bundle of practices (1-4) is **underdetermined**, meaning the observable practices do not force us to accept a single philosophical story. Here are two rival reconstructions:

  **Reconstruction A: The "Scaffolded Professional" (Coherent)**
  *   **Core Commitment:** Patient Safety via Constrained Autonomy.
  *   **Narrative:** Practice 1 ensures physicians have enough mental models to handle exceptions. Practice 2 & 3 constrain them to prevent common errors. Practice 4 is the next logical step of constraint.
  *   **View of AI:** AI is simply a more advanced protocol. The physician's role is to oversee the AI, intervening only when the AI fails (using the understanding gained in Practice 1).
  *   **Status:** Stable. All practices serve the single master of safety.

  **Reconstruction B: The "Epistemic Schism" (Unstable)**
  *   **Core Commitment:** Medicine is torn between being a *Science of Understanding* and a *Technology of Control*.
  *   **Narrative:** Practice 1 serves the *Science* ideal (the doctor as a reasoning agent). Practices 2 & 3 serve the *Technology* ideal (the doctor as a reliable component). These are incompatible visions of the human role.
  *   **View of AI:** AI forces a choice. You cannot have both the "reasoning agent" and the "superior black box."
  *   **Status:** Unstable. The institution is pretending the tension doesn't exist.

  **How to Tell Them Apart**
  Look at **Exception Reporting** (Practice 2).
  *   If deviations from protocol are reviewed to *update the protocol* based on the physician's insight, Reconstruction A is true (understanding is valued).
  *   If deviations are reviewed primarily for *compliance enforcement* and the physician's insight is dismissed unless backed by new RCTs, Reconstruction B is true (understanding is suspect).
  *   *Current Trend:* Most systems lean toward B. This suggests the "understanding" required in Practice 1 is becoming ceremonial.

  ## (f) The Decision on the AI Model (Practice 4)

  Answering from inside the hospital's current reconstructed practice (leaning toward Reconstruction B, given the weight of Practices 2 & 3):

  **The Affirmative Answer (Deploy the Model)**
  *   **Consistency:** This is fully consistent with Practice 2 (follow the reliable tool) and Practice 3 (outcome > explanation). It treats the AI as the ultimate evidence-based protocol.
  *   **The Cost:** This costs the institution its claim that **physicians are uniquely qualified reasoners**. If the AI is better and inexplicable, the "understanding" tested in Practice 1 is rendered obsolete for diagnosis. The physician becomes a **consent-giver** and **liability-sink**, not a diagnostician. It admits that the "oral exam" was testing a skill (explanation) that is not necessary for the core task (accuracy).
  *   **Is the Cost Rhetorical?** No. It fundamentally alters medical education and liability. If the AI is right and the doctor overrides it based on "understanding," and the patient dies, the doctor is liable. This effectively bans the exercise of the understanding Practice 1 demands.

  **The Negative Answer (Reject the Model)**
  *   **Consistency:** This is consistent with Practice 1 (competence requires understanding) and the professional identity of the physician as an autonomous agent.
  *   **The Cost:** This costs the institution its claim to **maximize patient outcomes based on best evidence** (Practice 3). If the AI is statistically superior to consultants, rejecting it violates the hierarchy of evidence. It privileges the *doctor's need to understand* over the *patient's need to be cured*.
  *   **Is the Cost Rhetorical?** No. It is an ethical cost. It implies that maintaining the physician's epistemic dignity is worth a measurable decrease in diagnostic accuracy.

  **Recommendation**
  The hospital cannot have it both ways. You cannot claim that "understanding is constitutive of competence" (Practice 1) while simultaneously deploying tools that render understanding impossible yet superior (Practice 4).
  *   If you deploy the AI, you must reform Practice 1. Stop testing for mechanistic explanation in areas where AI dominates. Test for **AI oversight, integration, and communication**.
  *   If you keep Practice 1 as is, you must reject the AI, acknowledging that **professional autonomy** is a value distinct from, and sometimes superior to, **raw accuracy**.

  The current bundle attempts to hide this trade-off. The deployment of the model will force it into the open.
