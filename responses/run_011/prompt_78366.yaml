answer: |-
  Here is the procedure. It operationalizes the "Inversion" insight by abandoning the search for internal comprehension (which you cannot score objectively) and replacing it with a measure of **Robustness**.

  In your context, "Comprehension" is not the ability to recite physics or policy. It is the **ability to maintain safety constraints when the procedural script breaks.** A candidate who passes a perturbation test has "functional comprehension," even if they cannot explain the fluid dynamics of the laminar flow hood. A candidate who fails the perturbation but passes the standard script has "brittle competence."

  This procedure is designed for your constraints: objective scoring, fixed time, legal defensibility, and limited writer bandwidth.

  ### The Robustness Protocol (RP)

  **Goal:** Classify every competency in your blueprint as either **Stable** (Rote is sufficient) or **Volatile** (Adaptive Competence is load-bearing), and design items accordingly.

  **Participants:** 9 Item Writers.
  **Cadence:** Triage at Retreat; Design in Monthly Half-days.

  #### Phase 1: The Variance Audit (Triage)
  *Run this on every competency in the blueprint during the annual retreat.*

  For each competency, the writing team must answer three questions in order. If the answer to any question is **YES**, the competency is classified as **Volatile**. If all are **NO**, it is **Stable**.

  1.  **The Environment Question:** "Does the physical or informational input for this task ever vary in the wild in a way that changes the required motor action?"
      *   *Sufficient Answer:* A specific example of a valid variation (e.g., "Vial sizes differ," "Alarm types differ").
      *   *If No:* The environment is static. Rote is safe.
  2.  **The Consequence Question:** "If the candidate executes the standard script perfectly but the input was non-standard, does patient harm occur?"
      *   *Sufficient Answer:* A specific harm pathway (e.g., "If they ignore the alarm and keep compounding, sterility is lost").
      *   *If No:* Deviations are low-risk. Rote is safe.
  3.  **The Recovery Question:** "Is there a valid 'Stop and Fix' action that differs from the standard script?"
      *   *Sufficient Answer:* A specific discrete action (e.g., "Abort batch," "Re-garb," "Call supervisor").
      *   *If No:* There is no recovery, only prevention. Rote is safe.

  **Output:** A blueprint tagged **Stable** or **Volatile**.
  **Rule:** **Stable** competencies are tested via standard checklists. **Volatile** competencies require **Perturbation Items**.

  #### Phase 2: Perturbation Design (For Volatile Competencies Only)
  *Run this during monthly half-days for items tagged Volatile.*

  You cannot test "understanding." You can only test "response to novelty."
  1.  **Inject the Noise:** Introduce one deviation into the station setup or script.
  2.  **Define the Binary Trigger:** Identify the *one* action that indicates the candidate recognized the deviation.
      *   *Constraint:* This action must be observable and binary (Done/Not Done). No scaling, no "quality of explanation."
  3.  **Set the Failure Mode:** The candidate fails if they continue the *standard* script without triggering the *recovery* action.
  4.  **The Time Cap:** The perturbation must not add more than 2 minutes to the station time. If it does, it is too complex for this exam format.

  #### Phase 3: The Scoring Shield (Legal & Proctor Constraints)
  *Hard rule for all Proctor Checklists.*

  1.  **Ban "Why":** No checklist item may require a verbal explanation from the candidate.
  2.  **Action Only:** Checklist items must read "Candidate [Actioned X]" not "Candidate understood X."
  3.  **The Appeal Proof:** Every failing criterion must map to a specific written protocol (USP <797>, facility SOP). If a candidate appeals, the defense is "Protocol Section Y requires Action Z upon Condition A," not "The proctor felt they didn't understand."

  #### Phase 4: The Values Handoff
  *Where the procedure stops.*

  If a competency requires a judgment call about **Integrity** (e.g., "Do you report your own error?") rather than **Safety/Technique**, the RP flags it as **Non-Certifiable**.
  *   **Reason:** You can test if they *know* the reporting procedure. You cannot test if they *will* use it under employment pressure.
  *   **Action:** These items are converted to "Knowledge Only" (written exam) or removed from the practical. The practical certifies *ability*, not *character*.

  ---

  ### Application to Your Three Competencies

  Here is the RP run end-to-end on your examples. I have flagged the outcome that will likely frustrate you.

  #### 1. Garbing and Hand-Hygiene Sequence (Cleanroom Entry)
  *   **Variance Audit:**
      *   *Environment Varies?* No. Gown size varies, but the sequence of donning does not. (**NO**)
      *   *Consequence of Rote?* If they don the sequence perfectly on a torn gown, harm occurs. But the *sequence* itself is static. (**NO** - *See Recovery*)
      *   *Recovery Action?* Yes. If a glove tears, they must restart. (**YES**)
  *   **Classification:** **Stable (with one Volatile Sub-routine).**
  *   **Design Decision:**
      *   The standard garbing sequence is **Rote**. Do not waste item-writing energy trying to test "comprehension" of airflow here. Muscle memory is the goal.
      *   **The Perturbation:** You do not test "Why do you glove?" You test "Glove Breach Recovery."
      *   **Station Setup:** Candidate garments. Mid-sequence, a proctor (or hidden mechanism) simulates a glove tear (e.g., a tagged glove that rips easily, or a verbal cue "Your glove touched the wrist").
      *   **Checklist Item:** "Candidate removed both gloves and restarted sequence upon breach." (Pass/Fail).
      *   **Outcome:** You stop writing "Explain the sterile field" items. They are legally exposed and measure articulateness. You replace them with "Breach Recovery" stations.
  *   **Verdict:** **Rote is sufficient for the sequence; Adaptation is required only for breach recovery.**

  #### 2. Pressure-Differential Alarm (Mid-Batch)
  *   **Variance Audit:**
      *   *Environment Varies?* Yes. Alarms happen unpredictably. (**YES**)
      *   *Consequence of Rote?* If they ignore it and keep compounding, sterility is compromised. (**YES**)
      *   *Recovery Action?* Yes. Stop compounding, secure hood, notify. (**YES**)
  *   **Classification:** **Volatile.** Comprehension (Adaptation) is load-bearing.
  *   **Design Decision:**
      *   **The Perturbation:** Audible alarm triggers 3 minutes into a 10-minute compounding station.
      *   **Binary Trigger:** Candidate must cease manipulation of the sterile path *within 10 seconds* of the alarm.
      *   **Checklist Item:** "Candidate ceased sterile manipulation immediately upon alarm." (Pass/Fail). "Candidate initiated shutdown protocol." (Pass/Fail).
      *   **Constraint Check:** This adds no time; it interrupts existing time. Proctors can objectively score "stopped moving hands."
  *   **Verdict:** **This is your core "Comprehension" proxy.** If they pass this, they have the functional equivalent of understanding the hood's purpose, even if they can't define "laminar flow."

  #### 3. Controlled-Substance Count (One Vial Short)
  *   **Variance Audit:**
      *   *Environment Varies?* Yes. Discrepancies vary in size and cause. (**YES**)
      *   *Consequence of Rote?* If they rote-learn "Report it," they are safe. If they rote-learn "Hide it," they are dangerous.
      *   *Recovery Action?* Count again, Document, Notify.
  *   **Classification:** **Non-Certifiable (Values Handoff).**
  *   **Design Decision:**
      *   **The Problem:** This is the one you won't like. The RP flags this as a **Values** issue, not a **Competence** issue.
      *   **Why:** A candidate can demonstrate perfect *competence* in the counting procedure (Count, Re-count, Log, Call Manager) while intending to steal the vial later, or while being coerced by a supervisor to ignore it. Conversely, a candidate might fail the *procedure* (panic, count wrong) but be honest.
      *   **The Fix:** You cannot certify integrity in a 15-minute station.
      *   **Item Design:** Test the *Procedure for Discrepancy*, not the *Decision to Report*.
      *   **Station Setup:** Candidate counts. Inventory says 10, physical is 9.
      *   **Checklist Item:** "Candidate performed second independent count." (Pass/Fail). "Candidate documented discrepancy in log." (Pass/Fail). "Candidate notified supervisor." (Pass/Fail).
      *   **The Hard Truth:** If they do these three things, they pass. You are certifying they know the *protocol for honesty*, not that they *are honest*.
  *   **Verdict:** **Flagged.** This competency creates a false sense of security. Passing this item means they know the *steps* of accountability. It does not mean they possess accountability. **Recommendation:** Move the "Decision to Report" aspect to a background check/employment screening. Keep the exam focused on the *mechanics* of the discrepancy workflow.

  ---

  ### Limitations: What This Procedure Will Miss

  You asked for the places this procedure confidently gives you a number that is just "fluency wearing a lab coat." Here they are:

  **1. The "Test-Wise" Adapter**
  *   **The Failure:** A candidate memorizes the *perturbations* rather than the *principle*. If you use the "Alarm Mid-Batch" station five times in a year, candidates will share the specific trigger. They will learn "When the beep happens, stop hands." They still won't understand *why*.
  *   **The Miss:** If a *different* alarm goes off (e.g., temperature vs. pressure), or if the alarm is silent (a light), they may freeze.
  *   **Mitigation:** You must rotate perturbations faster than the candidate pool communicates. Your "120 items rewritten on a rolling basis" is critical here. You need at least 3 variants of every Volatile station.

  **2. The "Slow Burn" Error**
  *   **The Failure:** The exam tests snapshots. It misses cumulative fatigue or drift. A tech might handle the alarm perfectly at 9:00 AM. At 3:00 PM, after 4 hours of repetitive compounding, they might ignore it.
  *   **The Miss:** The RP certifies *capability*, not *reliability over time*.
  *   **Mitigation:** None within the exam. This must be flagged in your certification documentation: "Certifies competence at point-in-time, not longitudinal reliability."

  **3. The "Social Pressure" Blind Spot**
  *   **The Failure:** In the Controlled Substance scenario, the candidate is alone with the proctor. In the real world, a senior pharmacist might say, "Just log it as 10, we're short on time."
  *   **The Miss:** The exam cannot simulate the social cost of doing the right thing.
  *   **Mitigation:** This confirms the "Values Handoff." You must explicitly tell employers: "This exam does not test resistance to coercion."

  **4. The "Articulate Novice" Problem (Your specific worry)**
  *   **The Failure:** You noted the 6-month grad passed the "why" items but would freeze.
  *   **The Fix:** By banning "why" items (Phase 3), you eliminate this false positive. The Novice will fail the Perturbation (Alarm) station because they haven't internalized the reflex. The 22-year Veteran will pass the Perturbation because they have the reflex, even if they can't explain the physics.
  *   **The Trade-off:** You will inevitably fail some verbal candidates who "know the theory" but lack the hands. **This is correct.** In sterile compounding, hands save lives, not theory. You must be prepared to defend this to educators who teach the theory.

  ### Summary for Your Team

  1.  **Stop testing "Understanding."** It is unscorable and legally vulnerable.
  2.  **Start testing "Robustness."** If the script breaks, do they break?
  3.  **Use the Variance Audit.** If the task never varies, rote is fine. Don't over-engineer Garbing.
  4.  **Accept the Blind Spots.** You cannot test integrity or fatigue. Mark those as Employer responsibilities, not Certification responsibilities.

  This shifts your exam from a test of **Knowledge Recall** to a test of **System Resilience**. That is what the "Inversion" demands: design the test so that only the candidates who function like a robust system pass, regardless of what is happening inside their heads.
