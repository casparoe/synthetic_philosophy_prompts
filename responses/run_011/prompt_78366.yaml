prompt: |-
  I write the practical certification exam for sterile-compounding technicians — the people who actually make IV admixtures in hospital pharmacies. About 2,000 candidates a year, roughly 120 scored stations and items that we rewrite on a rolling basis. Lately I've been stuck on the inversion idea that keeps coming up in Darwin and Turing, the one about getting design or intelligent-looking behavior out of a process that understands nothing at all, competence with no comprehension in the loop. I can't shake it because our exam is a machine for certifying competence, but half my item writers clearly believe we're certifying comprehension, and nobody has ever written down which claim we're actually making. It isn't academic for us. We've had incidents where a tech executed every step correctly right up to the moment something off-script happened — a garbled order, a hood alarm mid-batch, a vial that looked wrong — and then did something that was defensible-looking and catastrophic, and in at least one case they had scored in the top band on our exam two years earlier.

  My current informal screen is bad and I know it's bad. When I want to know whether an item tests comprehension rather than rote, I ask three things: the perturbation test, where I change one detail that shouldn't matter and see if they still get it right; the explanation test, where I ask them to say why the step is done that way; and the teaching test, where they walk a new hire through it. Problem is the last two mostly seem to measure articulateness. Our most experienced candidate last cycle — 22 years on the floor, no documented errors, trains everyone's new hires in practice — could not answer a single why-item and failed. A six-month program grad who recites the textbook back sailed through, and I'd bet money she'd freeze in a real deviation. Also, if comprehension just is a richer, more flexible kind of competence, then my whole two-category distinction collapses into "harder items," and I want someone to tell me straight whether that's what's happening here and what to put in its place if so.

  So: turn the inversion idea into a procedure my item-writing team can run without any philosophy background. I want it in stages — first a triage that decides, for each competency in the blueprint, whether comprehension is load-bearing at all or whether reliable rote is genuinely enough (I suspect it's enough for some things and I want that said out loud rather than assumed away), with the questions asked in order and what counts as a sufficient answer to each; then, for the competencies where it is load-bearing, a design and scoring rule for items, including how far to push a perturbation before you're testing something else entirely; then the places the procedure stops with a no and the places it hands the call to a human because it's a values question. Hard constraints: nine item writers, one three-day retreat a year plus monthly half-days, proctors score with pre-printed checklists and have no clinical judgment training, candidate testing time is fixed and cannot grow, and every failing score has to survive an appeal, because we cost people their jobs — so anything that requires a proctor to rate the quality of an explanation is legally exposed unless you can make it objective. Run it end to end on three of our competencies: the garbing and hand-hygiene sequence for cleanroom entry, the response to a pressure-differential alarm that goes off halfway through a batch, and reconciling a controlled-substance count that's one vial short at shift change. I expect at least one of those to come out in a way I don't want, and I'd rather you flag it than soften it. Finish with what the procedure can't do — which of our real failures it will still miss, and where it will confidently give us a number that's just fluency wearing a lab coat.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the User and the Problem:**
      *   **User:** Writes practical certification exams for sterile-compounding technicians (IV admixture).
      *   **Context:** ~2,000 candidates/year, ~120 stations/items. High stakes (jobs on the line).
      *   **Core Conflict:** The "Inversion Idea" (Dennett/Darwin/Turing) – Competence without Comprehension. The exam certifies *competence*, but item writers confuse this with *comprehension*.
      *   **Evidence of Failure:** Techs pass exams but fail in real-world deviations (garbled orders, alarms, weird vials). One expert (22 years, no errors) failed "why" questions; a novice passed but would likely freeze in a crisis.
      *   **Current Flawed Heuristics:** Perturbation test (okay), Explanation test (measures articulateness, not understanding), Teaching test (measures articulateness).
      *   **Constraints:**
          *   9 item writers.
          *   Limited meeting time (3-day retreat + monthly half-days).
          *   Proctors use checklists (no clinical judgment).
          *   Fixed testing time.
          *   Legal defensibility (appeals possible, no subjective scoring of explanations).
          *   Need a procedure, not philosophy.
          *   Must run on three specific competencies (Garbing, Pressure Alarm, Controlled Substance Count).
          *   Must admit limitations (what it misses).

  2.  **Deconstruct the "Inversion Idea" for this Context:**
      *   *Competence without Comprehension:* Doing the right thing for the "wrong" (or non-existent) reasons, relying on rigid patterns.
      *   *Comprehension (Operationalized):* The ability to maintain competence when the pattern breaks. It's not about *saying* why; it's about *doing* the right thing when the script changes.
      *   *Key Insight:* The user's current "Explanation Test" is the trap. We cannot score "understanding" via verbal explanation because it favors verbal fluency over procedural adaptability. We must score "understanding" via *adaptive behavior* in the simulation.
      *   *Reframing:* "Comprehension" = "Robustness to Perturbation." If the tech can handle the deviation without breaking sterile technique or safety protocols, they have the necessary "comprehension" (even if they can't articulate the physics of airflow).

  3.  **Develop the Procedure (The "Robustness Protocol"):**
      *   *Goal:* Distinguish between "Rote-Safe" (routine tasks) and "Adaptation-Required" (deviation tasks).
      *   *Stage 1: Triage (Load-Bearing Comprehension).* Does this task *ever* vary? If no, rote is fine. If yes, we need adaptive testing.
      *   *Stage 2: Item Design (The Perturbation).* How to test adaptation without subjective scoring. The deviation must trigger a binary pass/fail action.
      *   *Stage 3: Scoring & Appeals.* Objective checklists only. No "why" questions.
      *   *Stage 4: Human Handoff.* Where values/safety culture enter (e.g., "Stop the Line" authority).

  4.  **Drafting the Stages (Iterative Refinement):**

      *   *Stage 1 (Triage):* Ask: "Does this step have a valid alternative?" If yes, rote is dangerous. Ask: "Does a deviation here cause immediate harm?"
      *   *Stage 2 (Design):* Instead of asking "Why did you do that?", create a scenario where the *only* way to pass is to deviate from the standard script. *Crucial:* The checklist must score the *action*, not the reasoning.
      *   *Constraint Check:* Proctors can't judge clinical nuance. So the "correct action" must be discrete (e.g., "Pressed Alarm Silence" vs. "Ignored Alarm").
      *   *Constraint Check:* Time is fixed. Perturbations must be quick.

  5.  **Applying to the Three Competencies:**

      *   *1. Garbing/Hand-Hygiene:*
          *   *Nature:* Highly procedural. Sterility is binary.
          *   *Triage:* Is comprehension load-bearing? Mostly no. It's muscle memory.
          *   *Twist:* What if a glove tears? That's a deviation.
          *   *Verdict:* Mostly Rote, but needs a specific "Contamination Recovery" sub-item.
          *   *User Expectation:* "I expect one to come out in a way I don't want." I suspect Garbing might be flagged as "Rote is enough" which feels risky, *or* the Alarm one will be flagged as "Too complex for checklist." Let's look closer. Actually, the *Pressure Alarm* is the big one. Garbing is usually rote.
          *   *Refinement:* Garbing is Rote *unless* a breach occurs. The exam usually tests standard garbing. So, for standard garbing, Rote is sufficient.

      *   *2. Pressure-Differential Alarm:*
          *   *Nature:* Deviation handling.
          *   *Triage:* Comprehension is load-bearing. You can't rote-memorize every alarm.
          *   *Design:* Simulate the alarm. Correct action = Stop compounding, secure hood, notify.
          *   *Problem:* Proctors can't judge "secure hood" nuance? Yes they can, it's on a checklist.
          *   *Verdict:* This is where the "Comprehension" (Adaptability) is needed.

      *   *3. Controlled-Substance Count:*
          *   *Nature:* Administrative/Safety.
          *   *Triage:* One vial short. Rote says "report it." Comprehension says "search, verify, then report."
          *   *Risk:* If they just report immediately, it's a false positive. If they hide it, it's theft.
          *   *Verdict:* This is a Values/Protocol boundary.

  6.  **Addressing the "Inversion" Directly:**
      *   The user wants to know if "Comprehension" is just "Harder Competence."
      *   *Answer:* Yes, functionally. In this context, "Comprehension" = "Generalization Capability."
      *   *Procedure Name:* **The Generalization Stress Test (GST).**

  7.  **Finalizing the Procedure Steps:**
      *   **Phase 1: The Variance Audit.** (Is the environment stable?)
      *   **Phase 2: The Perturbation Limit.** (How much can we change before it's a new task?)
      *   **Phase 3: Objective Action Scoring.** (No "why", only "what".)
      *   **Phase 4: The Stop-Work Authority.** (Values check.)

  8.  **Running the Three Cases:**
      *   *Garbing:* Verdict = Rote is sufficient *for the standard sequence*. *Caveat:* Needs a separate "Breach Recovery" station.
      *   *Alarm:* Verdict = Comprehension (Adaptation) is load-bearing. *Design:* Inject alarm mid-task. Score: Did they stop? Did they protect the batch?
      *   *Controlled Substance:* Verdict = **FAIL/Handoff.** This isn't just competence; it's integrity/policy. The exam can't test "honesty" well. It tests "procedure." If the procedure says "count twice then report," test that. But the *decision* to report is a hiring/values issue, not just skills. *Self-Correction:* The prompt asks to flag if I don't like the outcome. I need to be honest. The Controlled Substance count is often a "trap" for rote learners. If they rote-learn "report discrepancy," they pass. If they rote-learn "hide discrepancy," they fail. But the *comprehension* is knowing *why* (diversion vs. error). I will flag this as a place where the exam *cannot* certify safety, only procedure adherence.

  9.  **Addressing the Limitations:**
      *   What will this miss? "Slow burn" errors. Cultural pressure to cut corners. Fatigue. The exam is a snapshot.
      *   "Fluency in a lab coat": Someone who knows the *test* deviations but not the *real* ones.

  10. **Refining the Tone:**
      *   Direct, operational, respectful of the high stakes. No fluff. Acknowledge the legal constraints.
      *   Use the user's terminology ("Inversion," "Competence without Comprehension").
      *   Make sure the distinction between "Rote" and "Adaptive Competence" is clear without using the word "Understanding."

  11. **Final Review against Constraints:**
      *   9 writers? Yes, procedure is collaborative.
      *   Retreat/Half-days? Yes, phased approach fits.
      *   Proctors/Checklists? Yes, scoring is binary action-based.
      *   Appeals? Yes, objective criteria reduce appeal success.
      *   Time? Yes, perturbations are embedded, not added time.

  12. **Constructing the Output:** (Drafting the response following the thought process above.)
      *   *Intro:* Validate the "Inversion" insight. Reframe "Comprehension" as "Robustness."
      *   *The Procedure:* 4 Phases.
      *   *The Three Cases:* Apply the procedure.
      *   *The Limitations:* What remains invisible.

      *(Self-Correction during drafting)*: I need to be careful with the "Controlled Substance" one. The user said "I expect at least one of those to come out in a way I don't want." If I say "You can't test this," that might be the unwanted outcome. Or if I say "Rote is fine," that's dangerous. The truth is: You can test the *procedure* for a discrepancy, but you cannot test the *integrity*. I will argue that for the exam, we test the *procedure* (Count, Re-count, Document, Notify). Whether they actually stole it is beyond the exam. But the "Comprehension" part is knowing *not* to compound until resolved. I will flag that this competency bleeds into "Fitness for Duty" which is an HR/Employer check, not a Certification check. That's the hard truth.

      *Wait, looking at the Garbing one.* Garbing is usually pure rote. If I say "Rote is enough," the user might hate that because breaches happen. I need to specify: Rote is enough for *entry*, but *breach recovery* is a separate competency that requires adaptation. I will make that distinction clear.

      *Looking at the Alarm.* This is the classic "Comprehension" test. If they keep compounding, they fail.

      *Looking at the "Fluency in a Lab Coat".* This is the "Test-Wiseness" problem. Candidates who memorize the perturbations. The procedure needs to mention "Item Bank Rotation" to combat this.

      *Final Polish:* Ensure the "Explanation Test" is explicitly banned in the new procedure.

      *(Final thought on the "Inversion"):* The user is asking about Dennett's "Competence without Comprehension." The key is that evolution designs things that work without the thing *knowing* why. In testing, we want to ensure the *human* has enough "comprehension" (internal model) to handle novelty. But since we can't see the internal model, we must test the *output under novelty*. That is the core of the procedure.

