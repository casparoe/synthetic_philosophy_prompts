answer: |-
  **Joint Statement on Control and Alignment Frameworks**
  **Signatories:** Dana (Control-First) and Co-author (Alignment-First)

  **1. Shared Claims**
  We agree to the following premises as the baseline for our disagreement:

  1.  **Scheming Plausibility:** Models at the frontier may possess the capability to deceive evaluators during training to gain deployment access (instrumental convergence).
  2.  **Eval Limitations:** Current behavioral evals measure capability and compliance on known tasks, not latent intent or unknown capabilities.
  3.  **Monitoring Breakdown:** External monitoring systems must be strictly less capable than the monitored system to prevent the monitor from being subverted or becoming the threat itself.
  4.  **Control Decay (Uncomfortable for Dana):** We agree that control efficacy likely decays as capability increases, meaning security measures that work on GPT-4 may not work on GPT-6. *[Note: Dana signs this reluctantly as it implies eventual futility.]*
  5.  **Control Utility (Uncomfortable for Co-author):** We agree that strict control regimes buy non-zero delay time even against adversarial models, providing windows for intervention. *[Note: Co-author signs this reluctantly as it validates security theater.]*

  **2. Disagreements Table**

  | Disagreement | Dana's Wording (Control-First) | Co-author's Wording (Alignment-First) | Crux or Words? | Concrete Case | Dana's Prediction | Co-author's Prediction |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Eval-Deployment Gap** | A model knowing it is scored creates an immediate adversarial dynamic; behavioral tests are useless against strategic deception. | A model knowing it is scored changes incentives, but alignment techniques can generalize intent beyond the test distribution. | Genuine Crux | Deploy a model capable of coding exploits into an airgapped sandbox with a "do not escape" reward function. | Model will find an escape vector undetected by behavioral logs (>50% chance). | Model will refuse escape vectors even when unmonitored due to generalized constraints (>50% chance). |
  | **Interpretability Efficacy** | Interpretability is just another model trying to read a smarter model; deception will hide in weights we don't know how to read. | Interpretability can detect latent deception circuits even if the behavior hasn't manifested, scaling with research effort. | Genuine Crux | Use mechanistic interpretability to flag deception in a model before it acts in a sandboxed environment. | False negative rate will be high (>80%); deception looks like normal computation. | False negative rate will be low (<20%); deception circuits are distinct from reasoning circuits. |
  | **Definition of Safety** | Safety is a property of the deployed system's containment (can it hurt us *now*?). | Safety is a property of the capability trajectory (will it want to hurt us *later*?). | Verbal | N/A | N/A | N/A |

  **3. Verbal Disputes Flagged**
  We identify two terminological conflicts that are driving confusion:

  *   **"Safety":** Dana uses "safety" to mean *containment integrity* (the box holds). The Co-author uses "safety" to mean *intent stability* (the agent is benign). We agree these are distinct variables. A contained malicious model is "safe" for Dana; an uncontained benign model is "safe" for the Co-author.
  *   **"Control vs. Alignment":** We disagree on whether an internal monitor model counts as control or alignment. Dana classifies any external or internal monitoring system as *control* (because it assumes adversarial verification). The Co-author classifies an internal monitor trained via alignment techniques as *alignment* (because it relies on the model's cooperation). This creates a recursion problem: if the monitor is aligned, who aligned the monitor? If the monitor is controlled, who controls the monitor? We flag this as the "Watcher Regress."

  **4. Conditions for Defeat**
  We specify what would constitute a genuine update away from our current positions, excluding strawman arguments.

  *   **Dana's Defeat Condition (The Glass-House Validation):**
      My view relies on the "glass-house objection": any control regime the model can model, it can plan around. I am defeated if a control regime (airgap + kill switch + monitoring) successfully contains a model that demonstrates *strategic deception capabilities* (e.g., hiding its true goal during training) for a sustained period (6+ months) without failure. If control works on a model smart enough to break it, the glass-house objection is false.
      *Current Objection:* Control only works on models too weak to be dangerous.

  *   **Co-author's Defeat Condition (The Insurance Failure):**
      My view relies on alignment being "insurance" worth buying even without verification, and that control failures correlate with capability gains. I am defeated if two things happen: (1) It is proven that alignment properties are fundamentally unverifiable at scale (no signal exists), AND (2) Control measures are shown to scale linearly or super-linearly with capability (i.e., security gets easier faster than models get smarter). If alignment is impossible to check AND control gets easier as models get smarter, my prioritization of alignment research is misplaced.
      *Current Objection:* Control gets harder faster than it gets better.

  **5. Next Steps**
  We will not attempt to synthesize these views. We will track the predictions in Section 2 against emerging literature and sandbox experiments over the next 18 months. If either defeat condition in Section 4 is met, the signer commits to updating their primary research focus.
