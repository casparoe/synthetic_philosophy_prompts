  Mostly distraction. Physics describes symmetric structures and uses weak discernibility (irreflexive relations like "has opposite spin to") to distinguish particles mathematically. But this solves a formal problem, not a metaphysical one. Saying particles are weakly discernible tells you how to label them in a model, not what grounds their distinctness in reality. Physics assumes the coherence of the model; metaphysics questions it. Bringing in symmetry breaking changes the model but doesn't answer whether distinctness requires a qualitative ground. It lets the physics-heavy members feel productive by solving a formal puzzle, but it leaves the ontological question untouched. The physics community often operationalizes distinctness via measurement outcomes, bypassing the need for ontological grounding. Your group is asking about the being of the spheres, not the labeling of the data.

  What progress would look like
  Progress requires splitting the discussion into two distinct tracks. First, settle the modal question: Is the symmetric world genuinely conceivable, or does it collapse under analysis? If Camp B concedes it's incoherent, PII is trivial. If Camp A concedes it's coherent, PII is contingent. Second, reformulate the principle. Instead of "Indiscernibles are Identical," ask "Does numerical difference require qualitative ground?" This forces Camp A to argue for grounding necessity and Camp B to defend brute facthood without hiding behind stipulation. You should stop debating whether haecceities are "properties" and start debating whether primitive thisness is ontologically costly. If you can't agree on the modal status, acknowledge the stalemate: it's a clash of basic intuitions about structure vs. substance. Progress isn't winning; it's realizing you're holding different maps of the same territory. Agree to disagree on the brute fact vs. grounding necessity, and focus on the consequences of each view for other areas like persistence or composition. This shifts the energy from circular definition-checking to exploring the downstream effects of each metaphysical commitment. For example, if Camp B is right, how does that affect our view of personal identity? If Camp A is right, what happens to quantum particles? By moving the debate to the consequences rather than the premises, you might find pragmatic reasons to prefer one framework over the other, even if the foundational intuition remains unresolved. The goal is to map the cost of each position, not to prove one impossible.
