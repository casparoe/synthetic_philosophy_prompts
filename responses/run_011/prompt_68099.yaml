answer: |-
  ### Standards of Assessment for Comparative Growth Explanations

  To ensure neutrality between competing explanations (institutional, geographic, cultural, or conjunctural), the following rubric defines the methodological burden of proof. An answer is satisfactory only if it meets the conditions below. Each condition is annotated to distinguish between methodological necessities (**Non-negotiable**) and assumptions that privilege specific historiographical schools (**School Commitment**).

  #### I. Preconditions: Well-Posed Comparisons
  Before a causal claim is evaluated, the comparison itself must be valid.

  **1. Foil Selection and Unit Comparability**
  *   **Condition:** The answer must justify why the Lower Yangzi is the specific counterfactual for Britain, and demonstrate that both are treated as comparable economic units (e.g., core regions rather than nation-state vs. province).
  *   **Motivation:** Comparing Britain to "China" aggregates impoverished hinterlands with developed cores, biasing the result. Comparing a political unit (Britain) to a geographic region (Yangzi) without adjustment distorts per-capita metrics.
  *   **Status:** **Non-negotiable.** Without unit comparability, the variance to be explained is artificial.

  **2. Divergence Indicator and Crossover Point**
  *   **Condition:** The answer must specify the metric (e.g., real wages, GDP per capita, energy consumption) that defines "growth" and identify the specific decade or period in which the series cross.
  *   **Motivation:** Explanations for a divergence beginning in 1650 (institutional) differ from those beginning in 1780 (industrial). Vague references to "the 18th century" obscure whether the cause preceded or followed the effect.
  *   **Status:** **Non-negotiable** (that a metric be chosen); **School Commitment** (the *choice* of metric often aligns with the school, e.g., wages for Allen, GDP for Broadberry). The student must declare the choice, not hide it.

  **3. Baseline Similarity**
  *   **Condition:** The answer must acknowledge the level of development in both regions prior to the divergence point.
  *   **Motivation:** If the Yangzi was subsistence-level in 1700, no special cause is needed for British leadership. If the Yangzi was advanced, British growth requires a specific disruptor.
  *   **Status:** **Non-negotiable.** This establishes the "puzzle" status of the question.

  #### II. Causal Requirements: The Proposed Mechanism
  The proposed cause must function as an independent variable, not a synonym for the outcome.

  **4. Independent Identification**
  *   **Condition:** The cause must be identifiable without reference to the growth outcome itself.
  *   **Motivation:** Asserting Britain grew because it was "innovative" or "dynamic" is a redescription of growth, not an explanation. The cause (e.g., patent law, coal depth) must be measurable independently of output.
  *   **Status:** **Non-negotiable.** This prevents tautology.

  **5. Mechanism and Chronology**
  *   **Condition:** The answer must detail the transmission mechanism (how X leads to Y) and demonstrate that the cause was present *before* the divergence point but not long before.
  *   **Motivation:** Institutions existing since the Magna Carta cannot explain a divergence starting in 1780 without an intervening trigger. Coal deposits existing for millennia require a reason for exploitation starting in the 18th century.
  *   **Status:** **Non-negotiable.** Causality requires temporal precedence and a plausible link.

  **6. Asymmetry of Presence or Operation**
  *   **Condition:** The cause must be shown to be either absent in the Yangzi or, if present, demonstrably inoperative there due to a specific blocking factor.
  *   **Motivation:** If high wages existed in both regions (as some data suggest), high wages cannot be the *distinctive* cause unless a complementary factor (like cheap energy) existed only in Britain.
  *   **Status:** **School Commitment.** Demanding *absence* privileges Exceptionalist schools. Demanding *inoperativity* accommodates Conjunctural/California schools. A satisfactory answer must meet one of these two bars; demanding *absence* specifically is a commitment to structural difference.

  #### III. Evidentiary Constraints: Handling the Archive
  The answer must account for the unequal survival of records between the two sites.

  **7. Argument from Silence**
  *   **Condition:** Claims that a factor was absent in the Yangzi cannot rest solely on the absence of records confirming its presence.
  *   **Motivation:** British archives preserve parish wages and patents; Chinese archives preserve land contracts and gazetteers. Missing wage data in China is not proof of low wages; missing patent data is not proof of no innovation.
  *   **Status:** **Non-negotiable.** Absence of evidence is not evidence of absence in asymmetric archival environments.

  **8. Positive Proof of Deficiency**
  *   **Condition:** If the argument relies on a Yangzi deficiency (e.g., lack of property rights), it must provide positive evidence of the constraint, not just a lack of evidence for the right.
  *   **Motivation:** To claim the Yangzi lacked secure property rights requires evidence of expropriation or legal insecurity, not merely the absence of title deeds comparable to English ones.
  *   **Status:** **Non-negotiable.** This prevents Eurocentric definitions of institutions from functioning as default negatives.

  ***

  ### Analysis of Joint Unsatisfiability

  Your suspicion is correct: a subset of these conditions is jointly unsatisfiable for any single explanation. Specifically, the triad of **Independent Identification (II.4)**, **Chronological Precision (II.5)**, and **Asymmetry of Presence (II.6)** creates a trilemma when combined with the demand for **Generalizability** (often implicit in economic history).

  1.  **Genuine Difference (II.6):** To satisfy the requirement that the cause is unique to Britain (e.g., specific coal geology, specific parliamentary sovereignty), the factor tends to be highly idiosyncratic.
  2.  **Chronological Precision (II.5):** To satisfy the timing of the crossover (c. 1760–1800), the cause must be a late-breaking variable.
  3.  **Generalizability:** To serve as a model for "sustained growth" (the broader course theme), the cause should theoretically apply elsewhere.

  **The Conflict:**
  *   Factors that are **Genuine Differences** (Coal) often fail **Generalizability** (most countries lack British coal).
  *   Factors that are **General** (Institutions, Culture) often fail **Chronological Precision** (they are deep-rooted, predating the divergence by centuries, requiring ad-hoc triggers).
  *   Factors that fit the **Chronology** (New World colonies, Steam technology) often fail **Independent Identification** (they may be consequences of earlier growth or require the very institutions they purport to explain).

  No familiar candidate satisfies all three simultaneously. Institutionalists sacrifice chronology (deep roots); Californians sacrifice difference (similarity thesis); Geographers sacrifice generalizability (contingency). A student answer that claims to satisfy all three should be viewed with suspicion.

  ### The Single Disqualifier

  The condition that disqualifies the most familiar answers is **III.7 (Argument from Silence)**.

  This condition eliminates the largest class of "Eurocentric" deficiency theories. Many standard answers rely on the claim that the Lower Yangzi lacked secure property rights, capital markets, or individualism. Because the Chinese archival record categorizes information differently than the British (e.g., lineage records vs. parish registers), the absence of British-style documentation is frequently misinterpreted as the absence of the economic function itself.

  Strict adherence to **III.7** forces the student to prove that the Yangzi *failed* to develop these mechanisms, rather than simply noting they do not appear in the comparative literature. This disqualifies vague cultural explanations and institutional deficiency models that rely on negative evidence, leaving only those explanations that can demonstrate positive constraints (e.g., specific state policies blocking trade) or rely on factors with positive physical evidence (e.g., coal depth, distance to colonies).
