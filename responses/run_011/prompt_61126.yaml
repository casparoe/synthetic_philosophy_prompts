      *   *Cruxes:* The 19 non-implemented cities. What did their models say? If low, selection bias inflates the 4-city mean. If high, politics killed them.
      *   *Verbal:* "Outside view" meaning.

      *Refining the Flow:* I need to ensure I don't use bullet points. I will use paragraph breaks to signify sections but no headers. I need to monitor word count closely.

      *Word Count Strategy:* I need to be verbose enough to hit 1200 but precise enough to stay under 1800. I will elaborate on the implications of the selection bias and the specific numbers provided in the prompt.

      *Self-Correction on "Continuous Prose":* The prompt says "no headings, no numbered or bulleted lists... no section breaks." Paragraph breaks are allowed (otherwise it's a wall of text), but I must use signposting sentences.

