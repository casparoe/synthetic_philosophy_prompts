      *   **Context:** A feature article for a general-interest magazine about single-case predictions in big public projects (specifically a cordon charge case).
      *   **Input Data:**
          *   Camp 1 (Base-Rate): Focus on reference classes, observed frequencies, outside view first, adjust only on articulated grounds. Fear: forecaster bias (thinking case is special).
          *   Camp 2 (Specificity Critics): Focus on class construction embedding causal theory/interests. Fear: reference class problem (maximal specificity leads to n=1 or indeterminacy).
          *   Case Study: Mid-sized city cordon charge. Model predicts 15% reduction.
          *   Data Points:
              *   4 implemented cities (regional): 8, 12, 17, 22% (Mean = 14.75%).
              *   23 proposed cities (only 4 implemented).
              *   60 broader interventions (mean 6%, mixed types).
              *   1 homogeneous city (river/ridge/transit/parking): 13%.
          *   Wrinkle: Selection bias on implementation (cities with small predicted effects or hostile politics didn't implement). Implementation selects for optimistic predictions (inflate effects?) vs administrative capacity/transit substitutes (inflate effects for non-optimism reasons).
      *   **Document Structure:**
          1.  Agreed Claims (arithmetic, selection, what base rate is/is not).
          2.  Residual Disagreements (charitable wording, no straw figures, no vagueness).
          3.  Cruxes (sub-questions that would move a side, with tests/datasets/predictions).
          4.  Assessment of Verbal Disagreements (what dissolves upon clarification of accuracy vs. justifiability).
      *   **Pre-writing Thought:** One paragraph thinking out loud about private concessions (not part of the document).
      *   **Constraints:** Continuous prose only (no headings, lists, bold, italics, tables, section breaks). Formal but readable register. 1200-1800 words. No citations/literature. No adjudication/picking winners.

  2.  **Deconstruct the Camps & Concessions:**
      *   *Base-Rate Camp Concession:* They must admit that choosing the reference class isn't mechanical. The "four cities" class is contaminated by selection bias (implementation condition). They must admit that the "one city" class (13%) is compellingly specific but useless for frequency statistics. They likely concede that "starting outside" requires a judgment about which outside matters.
      *   *Specificity Critics Concession:* They must admit that ignoring the four cities (14.75% mean) is wasteful. They must admit that the model's 15% isn't magic; it needs calibration against *something*. They likely concede that without *some* class constraint, prediction is just storytelling.
      *   *The Wrinkle:* The selection bias on implementation is the key tension. Does it invalidate the 4-city average?

  3.  **Drafting - Section by Section (Mental Outline):**
      *   *Intro/Agreed Claims:* We agree on the numbers. 4 cities mean ~15%. 1 city is 13%. Broader class is 6%. We agree selection bias exists. We agree base rates are starting points, not destinies. We agree the model's 15% needs external validation.
      *   *Disagreements:* Base-Rate says use the 4-city class as the anchor despite selection bias, adjusting downward/upward based on theory. Critics say the 4-city class is causally heterogeneous regarding the *reason* for implementation, so the frequency is misleading; the 1-city case or the model is better because it respects mechanism.
      *   *Cruxes:* 1. Direction of selection bias. Test: Look at the 19 non-implemented cities' models. Prediction: Base-Rate says their models were lower; Critics say their politics were different. 2. Tie-breaker for classes. Test: Predictive accuracy on holdout cases.
      *   *Verbal Disagreement:* Is "starting outside" a psychological discipline or a statistical requirement? If it's discipline, Critics agree. If statistical requirement, Base-Rate insists. Real disagreement is about burden of proof for adjustments.

  4.  **Drafting - Constraints Check:**
      *   *Continuous Prose:* This is the hardest part. I must use transition sentences instead of headers. "We begin by recording..." "Turning to the points of divergence..." "To resolve these..." "Finally, we note..."
