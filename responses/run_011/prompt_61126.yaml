answer: |-
  In private, the base-rate camp admits that the four-city average of roughly fifteen percent is contaminated because implementation was conditioned on success, meaning the observed frequency likely overshot the true causal effect for a generic city, yet they maintain that discarding it leaves nothing but noise. The specificity critics privately concede that the single homogeneous case yielding thirteen percent offers no statistical leverage and that their insistence on mechanism often masks a preference for the transport model's fifteen percent, which they defend as theoretically grounded rather than empirically anchored. Both sides suspect the other is correct about the failure mode of their own preferred method: the base-rate camp fears they are averaging away crucial causal differences, while the specificity critics fear they are fitting a story to a single data point.

  This statement records the points of agreement and disagreement reached between the proponents of base-rate anchoring and the proponents of specificity criticism regarding the forecasted performance of the proposed cordon charge. We begin by recording the claims both camps sign without reservation. We agree on the arithmetic of the available data: the four regional cities that implemented comparable charges realized reductions of eight, twelve, seventeen, and twenty-two percent, yielding a mean effect of fourteen point seven five percent. We agree that the broader class of sixty urban demand-management interventions shows a mean effect of six percent, but we also agree that this class mixes mechanisms so distinctively that it serves poorly as a direct comparator. We agree that the narrowest class homogeneous on geography and transit capacity contains exactly one city with a realized reduction of thirteen percent. We agree that the transport model built for the city predicts a fifteen percent reduction. We agree that the class of four implemented cities is not a random sample of the twenty-three cities that proposed such charges, because implementation was conditioned on variables including political hostility and predicted effect size. We agree that this selection conditioning introduces bias, though we do not yet agree on the direction or magnitude of that bias. We agree that a base rate is not a destiny but a starting point, and we agree that a specific model is not a truth machine but a hypothesis. We agree that the goal of this exercise is to produce a defensible number for public decision-making, not merely to win a methodological argument. We agree that ignoring the four-city data entirely is wasteful, and we agree that treating the four-city data as unproblematic is naive.

  Turning to the points of divergence, we specify the residual disagreements so that each camp accepts the wording as a accurate description of its own position and the position it opposes. The base-rate camp holds that the four-city mean of fourteen point seven five percent must serve as the primary anchor for the forecast, because it is the only class with sufficient frequency to generate a stable empirical expectation, and that any adjustment away from this number requires articulated evidence that the current city lacks the administrative capacity or transit substitutes present in the four predecessors. The specificity critics hold that the four-city mean is causally misleading because the class was selected on the very variable under dispute, meaning the observed frequency conflates the effect of the charge with the effect of being the kind of city that implements charges, and therefore the anchor should be either the single homogeneous case of thirteen percent or the model's fifteen percent, adjusted only by the failure rate of the nineteen non-implemented proposals. The base-rate camp argues that the specificity critics' preference for the single homogeneous case collapses into an inside view disguised as an outside view, because selecting that single city requires a causal theory that is not independently verified. The specificity critics argue that the base-rate camp's preference for the four-city class collapses into a ritual of objectivity that ignores the mechanism, because averaging across cities that implemented for different reasons treats heterogeneous causes as homogeneous data. The base-rate camp insists that the burden of proof lies on those who wish to adjust away from the observed frequency of implemented cases. The specificity critics insist that the burden of proof lies on those who wish to treat a selected sample as representative of the general case.

  To resolve these disagreements, we identify the cruxes where settling a sub-question would move at least one side, and we record the tests and pre-registered predictions associated with each. The first crux concerns the direction of the selection bias in the four-city class. Both sides agree that the nineteen cities that proposed but did not implement hold the key to this determination. The test requires recovering the transport model predictions from those nineteen non-implemented cities. The base-rate camp predicts that the mean predicted reduction in the nineteen non-implemented cities will be significantly lower than fifteen percent, implying that the four implemented cities were selected for optimism, and therefore the four-city realized mean of fourteen point seven five percent is inflated relative to the true effect for this city. The specificity critics predict that the mean predicted reduction in the nineteen non-implemented cities will be similar to or higher than fifteen percent, implying that politics rather than model optimism drove the selection, and therefore the four-city realized mean is not inflated by prediction bias but may even be deflated by the loss of high-capacity cities that failed to implement for political reasons. If the base-rate camp's prediction holds, they concede they must adjust the four-city anchor downward. If the specificity critics' prediction holds, they concede that the selection bias does not invalidate the four-city frequency as a baseline for effect size.

  The second crux concerns the principled tie-breaker when two defensible classes disagree and neither can be shown to be causally homogeneous. Both sides agree to a test using the broader class of sixty interventions. The test involves splitting the sixty cases into those where the model prediction exceeded the class base rate and those where it did not, and measuring which group realized higher accuracy. The base-rate camp predicts that starting with the class base rate and adjusting for model deviation will yield lower error than starting with the model and adjusting for class deviation. The specificity critics predict that starting with the model and adjusting for class deviation will yield lower error, because the model captures the specific mechanism while the class base rate captures only noise. The third crux concerns the single homogeneous case. Both sides agree that if a second city matching the river-and-ridge geography and transit capacity implements a charge within five years, its result will be decisive. The base-rate camp predicts the result will regress toward the four-city mean of fourteen point seven five percent. The specificity critics predict the result will cluster near the thirteen percent of the existing homogeneous case. We agree to record these predictions now and compare them against future data without retroactive adjustment of our classes.

  Finally, we assess which portions of the quarrel are merely verbal and where the residue of real disagreement lies. We judge that the disagreement about whether one can genuinely begin outside dissolves once we specify whether we are arguing about the psychological discipline of the forecaster or the statistical justifiability of the number an official will later be held to. The base-rate camp uses the phrase begin outside to mean a psychological discipline against overconfidence, which the specificity critics actually accept in principle but reject as a statistical rule. The specificity critics use the phrase causal homogeneity to mean a theoretical guarantee of mechanism, which the base-rate camp actually accepts in principle but rejects as a prerequisite for using frequency data. Once these definitions are aligned, we agree that both sides want a number that is psychologically disciplined and theoretically grounded. The residue of real disagreement lies not in the definitions but in the burden of proof for adjustments. The base-rate camp requires evidence to move away from the frequency of implemented cases. The specificity critics require evidence to move away from the model or the homogeneous case. This is not a verbal dispute but a conflict over risk tolerance. The base-rate camp fears the risk of special pleading. The specificity critics fear the risk of ecological fallacy. We agree that this conflict cannot be solved by definition but only by the outcome of the cruxes listed above. We agree that until those tests are run, any single number presented to the public must be accompanied by the range spanned by the four-city mean, the single homogeneous case, and the model prediction, explicitly labeled as the uncertainty arising from the reference class problem. We sign this statement to acknowledge that our disagreement is structured, that our concessions are recorded, and that our predictions are binding on our future interpretations of the data.
