  7.  **Legal Appendix:** Legal demands we stop listing "things we never planned to do," inadvertently defining causation as deviation from a plan.
  8.  **Impact Statement:** `Downtime caused by 4,320 distinct non-actions.` (Quantifying the overgeneration).

  **Selection:** I'm keeping 1, 3, 4, 5, 6, and 7.
  **Why:** 1 and 3 enforce the "timestamped nothing" and "metricized absence" constraints. 4 hits the historical absurdity requirement. 5 and 6 satisfy the action-item paradox constraint. 7 is crucial for the appendix constraint where legal reveals the hidden normative structure of normal postmortems. 2 and 8 are redundant; the 5 Whys can imply infinite regress without being silly, and the impact statement is better shown in the table count.

