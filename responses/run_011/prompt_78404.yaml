  2.  **5 Whys Terminal:** Ends at `Why? - Because the universe permits inertia.` (Refuses to stop at human error).
  3.  **Factor Table Metric:** "Counterfactual Dependence Score" ranking how much the outage relied on specific non-events.
  4.  **Absurd Factor:** `1792: Founding Father did not legislate server redundancy.` (Historical absurdity).
  5.  **Action Item Paradox:** `Implement auto-restart` creates `Risk: Auto-restart did not trigger.`
