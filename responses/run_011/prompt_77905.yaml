  {
    "base_case": {
      "ascription": "Mark believes the office is open and desires to work.",
      "prediction": "Mark will drive to the office.",
      "outcome": "Mark drives to the office."
    },
    "variant": {
      "one_change": "Mark receives and acknowledges definitive information that the office is closed.",
      "fp_prediction": "Mark will stay home (based on updated belief).",
      "fp_outcome": "Failure (Mark drives to the office).",
      "subpersonal_prediction": "Mark will drive to the office (based on entrenched motor routine).",
      "subpersonal_outcome": "Success (Mark drives to the office)."
    },
    "load_bearing_feature": "The dissociation between informational uptake (reading the email) and motor output (driving the route).",
    "feature_removed": "If Mark stayed home after reading the email, FP would successfully track the behavior change, undermining the claim that beliefs are causally inert.",
    "best_reply_for_fp": "FP can absorb this by positing a competing unconscious desire for routine that outweighed the desire to stay home, preserving the intentional stance.",
    "self_check": "The case does not smuggle in eliminativism because it relies on observable prediction failures rather than asserting attitudes do not exist."
  }
  ```
