  ### 3. The Closest Analog
  **Case 7 (Lucid Signal)** is the closest structural analog, but **Case 4 (Delayed Breakfast)** is the closest verdict analog.

  *   **Why Case 7:** It is the only other instance where a non-verbal signal during REM was accepted as proof of a dream. This establishes that the Prof accepts *concurrent performance* as a substitute for *waking verbal report*.
  *   **Why Case 4:** It establishes the hard line against *delayed retrieval*. Even if a report eventually emerges, if it wasn't there on waking, it doesn't count as dream memory.

  **Does it settle anything?**
  No. It creates a **split verdict** (Yes then, No now) that highlights a tension in her metaphysics: she accepts the *event* based on the signal (Functionalism/Realism) but rejects the *narrative* based on the memory failure (Verificationism). It doesn't tell us whether the signal *itself* constitutes the dream, or if it's just proof that a dream *could have been* reported. We still don't know if she thinks the dream *ceased to exist* when the memory failed, or if the dream existed but the *report* is invalid.

  ---

  ### 4. The Tie-Breaker Case
  To pry the surviving rules apart, we need to isolate **Agency** from **Phenomenology** and **Memory**. The current case conflates them (Signal implies Agency, but Memory failed).

  **The Proposed Case: The "Reflex Signal" Protocol**
  Train a subject to perform the eye-signal pattern (L-R-L) not when they *realize* they are dreaming (lucidity), but whenever they hear a specific external auditory tone played during REM (a conditioned reflex).
  *   **Setup:** Tone plays in REM. Subject signals L-R-L.
  *   **Waking:** Subject reports nothing. No memory of tone or signal.
  *   **Breakfast:** Shown trace. Subject says, "I don't remember that."

  **Why this breaks the tie:**
  *   **Immediate Access Verificationism:** Will say **No Dream**. There was no accessible content, and the signal was a reflex, not a verification of experience.
  *   **Consolidated Phenomenalism:** Will say **No Dream**. No phenomenal content was consolidated; the signal was motor output without qualia.
  *   **Concurrent Agency Functionalism:** This is the pivot. If the Prof says **Dream**, she believes *any* organized output during sleep counts as dreaming (even reflexive). If she says **No Dream**, she requires the agency to be *spontaneous/lucid* (Case 7), meaning she values **Intentionality** over mere **Function**.

  **The Real Wedge:**
  If she calls the Reflex Signal a "Dream," she is a **Functionalist** (Dream = Sleep-Output).
  If she calls it "No Dream," she is a **Phenomenalist** (Dream = Sleep-Experience).
  This forces her to choose between the *behavior* (which she loved in Case 7) and the *experience* (which she protected in Case 3). Currently, her cases allow her to hold both; this case forces a divorce.
