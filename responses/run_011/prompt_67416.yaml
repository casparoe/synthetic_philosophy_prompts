answer: |-
  Here is a principle drawn from your notebook, stated as plainly as I can manage. It is built to fit the reactions you have recorded, not to satisfy a textbook.

  ### The Principle of Living Ties

  **1. The Claim of Care:** You owe priority to those with whom you share a history of mutual dependence, provided that the relationship is actively being sustained. Blood alone creates no debt; cruelty or neglect severs the tie.
  **2. The Integrity of Practice:** You cannot honour a person by acting in a way that corrupts the specific role you share with them. To protect a person by breaking the thing that defines your bond is to lose them both.

  ***

  ### How the Cases Fit the Clauses

  **Clause 1 (The Claim of Care)** handles who counts. It explains why the tie is thick in some places and thin in others.
  *   **Case 1 (Mother):** The tie is actively sustained. Her need is your need because the history of dependence is continuous.
  *   **Case 2 (Brother):** Despite his failures, the shared history and current partnership sustain the tie. You are still "in it" together.
  *   **Case 6 (Cousin vs. Neighbour):** This is the test case. The cousin has the blood but broke the care (cruelty). The neighbour has no blood but sustained the care (driving to appointments). The principle sides with the neighbour. The tie counts only when lived.
  *   **Case 8 (Uncle vs. Mother):** The uncle claims authority by title (blood/age) without the lived relationship. The mother claims it by the lived relationship. You obey the one who actually mothers.

  **Clause 2 (The Integrity of Practice)** handles what you can do for them. It explains why you sometimes must say no to those you love.
  *   **Case 3 (Apprentice vs. Nephew):** The role you share with the nephew is family, but the context is the firm. To give him the job corrupts the firm's purpose (building well through merit). You honoured the firm, which ultimately protects the family name.
  *   **Case 4 (Daughter):** This is the conflict. Giving her the job corrupts the firm (as in Case 3). The principle suggests you cannot honour her by making yourself a fraud.
  *   **Case 5 (Employee Bereavement):** Paying him did not corrupt the firm; it sustained the *kind* of firm you run. A firm that discards men when their fathers die is a different practice than the one you inhabit. You upheld the integrity of your specific team.
  *   **Case 7 (Friend/Lying):** Friendship is defined by trust. Lying to protect a friend destroys the trust that makes him a friend. You refused to save him by killing the friendship.

  ***

  ### Applying the Principle to New Scenarios

  **1. The Promise to Your Mother**
  You promised to do something after her death that you now think is wrong.
  *   **The Verdict:** You are not bound to keep it.
  *   **The Reasoning:** Under Clause 1, the tie is sustained by care, not blind obedience. Under Clause 2, if keeping the promise corrupts your integrity as a man or a builder (the "practice" of your life), you break the promise. A promise extracted from a well mother that harms the world she leaves behind is not a living tie; it is a ghost. Honour her by living well, not by following a script she wrote when the world was different.

  **2. Chosen Roles (Employer) vs. Unchosen Roles (Son)**
  Does the principle treat them differently?
  *   **The Verdict:** No, not in how they bind, only in how they are entered.
  *   **The Reasoning:** You did not choose your mother, but you choose to *sustain* the role of son every day you keep her in the house. You chose to be an employer, but you are bound by the care you show employees. The obligation comes from the *living of the role*, not the entry into it. Once you are in it, the tie binds the same way. You can walk away from a chosen role (sell the firm), but while you are in it, the duty is identical to the unchosen one.

  **3. The Criminal Parent**
  A parent has committed a crime and asks for help to escape.
  *   **The Verdict:** You do not help them escape.
  *   **The Reasoning:** This is a hard application of Clause 2. The role of "son" involves care, but it exists within the larger role of "neighbour" and "citizen." Helping them escape corrupts your standing in the community and potentially harms others. Furthermore, enabling a parent to avoid consequences is not care; it is indulgence that damages their moral standing. You can visit them in prison, pay for their lawyer, and sit with them in shame. That sustains the tie. Helping them run destroys the integrity of the man you are, which is the only thing of value you can offer your parent.

  ***

  ### The Outlier: Which Verdict to Abandon?

  There is one verdict in your notebook that strains against the rest. It is **Case 4 (The Daughter)**.

  You say: *"I think I should not give it to her... and yet I also think that if I were standing where she is standing, my father handing the job to a stranger would feel less like fairness than like being abandoned."*

  The principle requires you to abandon the feeling that **not giving her the job is abandonment.**

  Here is why: In Case 3, you promoted the apprentice over the nephew because the *firm* requires merit. If the firm is the thing that feeds thirty families (including your brother's and potentially your daughter's future), then protecting the firm's integrity is the highest form of care you can offer your daughter. If you give her the job, you teach her that her name matters more than her work. That corrodes her.

  You feel it is abandonment because you are viewing the job as a *gift* a father gives, rather than a *place* in a shared enterprise. If you view the firm as the family's common ground, then treating her fairly is how you love her. You must tell her the truth: "I love you too much to make you a fraud, and I value this firm too much to make it a favour shop." That is not abandonment; it is the only way to keep both the father and the employer alive.

  ***

  ### Simple vs. Elaborate: The Nature of the Tie

  You asked whether the tie holds whether honoured (Simple) or only if lived (Elaborate), and if the latter collapses into impartial morality with a discount for relatives.

  **1. Which is nearer?**
  The **Elaborate** view (the tie binds only in so far as it is actually being lived) is the one you are circling. Case 6 (the cousin) proves this. If the tie were simple and inherent, the cousin's cruelty wouldn't matter. The fact that it does matter means the tie is made of conduct, not just biology.

  **2. Does it collapse into impartiality?**
  No. It does not collapse, and here is the reasoning you can give your brother in the pub.

  Impartial morality says: "Everyone counts the same, but I am allowed to give my family a little extra because I'm human." It treats partiality as a weakness we tolerate.

  Your principle says: "Partiality is the *source* of morality. There is no 'everyone' out there to count."
  *   The neighbour who drove your mother *earned* a claim on you that a stranger does not have. That isn't a discount for relatives; it's a premium for care.
  *   The brother gets the loan not because he is blood, but because he is your *brother*—a specific history of shared risk. A stranger cannot access that claim because they cannot access that history.

  If you treat the tie as something that must be "lived," it doesn't become a contract you can cancel whenever terms disappoint you (your fear). It becomes a **practice**. You cannot "hand back" the role of son easily, because it is woven into who you are. But you can let it rot through neglect or cruelty (as with the cousin).

  The distinction is this: Impartial morality asks, "What is the fair rule for everyone?" Your morality asks, "What does this specific relationship require to stay alive?"

  Sometimes those overlap (don't lie to the friend). Sometimes they diverge (keep the mother's house). When they diverge, your principle says you must honour the relationship, provided you do not corrupt the practice that sustains it.

  **The Summary for the Pub:**
  "We aren't bound by blood, and we aren't bound by rules. We are bound by the work we do together. If the work stops, the tie rots. If we break the work to save a person, we lose the tie anyway. So we keep the work true, and we look after the people who are actually doing it with us."
