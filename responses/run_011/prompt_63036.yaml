  ### 4. Sophisticated-Sounding Error (The "Trap")

  **Passage:** *"McMahan is explicit that the asymmetry does not track the combatant's own beliefs: what matters is the objective justice of the side he fights for, so a conscript who is sincerely and reasonably convinced that his country has been wronged stands in the same position as an attacker who is mistaken about his own case."*

  **Why it looks correct:** It uses precise terminology ("objective justice," "asymmetry") and correctly identifies McMahan's break from Walzer (who focuses heavily on the soldier's subjective state). It sounds like a confident, expert reading of the text.

  **Why it is an error:** This conflates **liability** with **culpability**. McMahan argues that while the *cause* must be objectively just, the *individual's liability* depends on their **responsibility** for the threat. If a conscript is "reasonably convinced," they may be **excused** (not culpable), and in some of McMahan's formulations, this reduces or removes their liability to be killed. The student treats all unjust combatants as equally liable regardless of their epistemic state, which flattens McMahan's nuanced view on "innocent aggressors."

  **Distinction:** The student claims the *status* is identical. McMahan claims the *objective threat* is identical, but the *moral responsibility* (and thus the degree of permissible harm) may differ based on belief.

  ***

  ### 5. Glossary of Terms

  *   **Moral Equality of Combatants (MEC):** The traditional view (defended by Walzer) that soldiers on both the just and unjust sides have an equal right to kill one another and equal immunity from being punished for killing, provided they follow the rules of war.
  *   **Jus ad Bellum:** Latin for "right to war." Refers to the justice of the *cause* for going to war (e.g., self-defense vs. aggression).
  *   **Jus in Bello:** Latin for "right in war." Refers to the justice of *conduct* during war (e.g., not targeting civilians).
  *   **Liability:** In this context, it means a person has done something (like posing an unjust threat) that makes it permissible for others to harm them in self-defense. It does not necessarily mean the person is *blameworthy* or deserves punishment.
  *   **Revisionism:** The school of thought (championed by McMahan) that seeks to revise traditional Just War Theory, specifically by rejecting the Moral Equality of Combatants.
  *   **Epistemic Uncertainty:** Uncertainty about knowledge. In this context, it refers to the difficulty of knowing for sure which side is truly "right" in the fog of war.
