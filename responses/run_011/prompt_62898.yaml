answer: |-
  # Specification for Bounded Doxastic Frameworks

  ## I. Desiderata and Verification Tests

  **1. The Entailment Gap (Cases 1 & 2)**
  *   **(a) Motivation:** Agents accept premises and valid rules without accepting the conclusion due to lack of computation time or attention. A framework that enforces closure defines this state as impossible rather than bounded.
  *   **(b) Test:** The formalism must permit a state $S$ where $B(p) \in S$ and $B(p \to q) \in S$ but $B(q) \notin S$. Crucially, the framework must provide a predicate or metric $C(S)$ (cost/effort) such that the transition from $S$ to $S'$ (where $B(q) \in S'$) is blocked if $C(S \to S') > \text{Threshold}$, without labeling $S$ as logically inconsistent.
  *   **Status:** Non-negotiable. (This is the definition of the problem.)

  **2. Rational Inconsistency (Case 3)**
  *   **(a) Motivation:** The Preface Paradox shows that believing each conjunct of a large set while believing the negation of their conjunction is rational. Frameworks that enforce consistency by construction rule this state out *a priori*, failing to model the phenomenon.
  *   **(b) Test:** The framework must allow the representation of the set $\{B(p_1), ..., B(p_n), B(\neg(p_1 \land ... \land p_n))\}$ without triggering a triviality explosion (deriving $B(\bot)$) or forcing a revision function that automatically deletes one of the beliefs before the modeler can inspect the state.
  *   **Status:** Non-negotiable. (Consistency is a norm, not a constitutive rule of belief.)

  **3. Granularity vs. Contradiction (Case 4)**
  *   **(a) Motivation:** Hyperintensional contents solve omniscience by distinguishing logically equivalent propositions. However, if contents are too fine-grained, ordinary agents appear to believe contradictions (e.g., believing $p$ and $\neg p$ under different guises) which they would disavow if the equivalence were pointed out.
  *   **(b) Test:** The framework must distinguish contents $c_1$ and $c_2$ where $c_1 \equiv c_2$ logically, such that $B(c_1)$ does not entail $B(c_2)$. Simultaneously, it must include a "recognition" operator $R$ such that if $R(c_1 \equiv c_2)$ holds, then $B(c_1) \to B(c_2)$. The framework must show that for ordinary agents, $R$ is typically false for non-trivial equivalences.
  *   **Status:** Non-negotiable.

  **4. Testimony and Transmission (Case 5)**
  *   **(a) Motivation:** Believing an expert does not entail believing all their consequences. However, it does entail believing *some* things they say. A framework must block infinite transmission without blocking immediate uptake.
  *   **(b) Test:** Given input $B(\text{Expert says } p)$, the framework must derive $B(p)$ (uptake) but must *not* derive $B(q)$ where $q$ is a logical consequence of $p$ that requires $>k$ inference steps. The block on $q$ must be justified by resource limits, not by a semantic disconnect between "Expert says" and "Truth."
  *   **Status:** Non-negotiable.

  **5. Imperfect Self-Knowledge (Case 6)**
  *   **(a) Motivation:** Agents can be wrong about their own beliefs, especially regarding consequences. Strong introspection axioms ($B(p) \to B(B(p))$) make this ignorance impossible.
  *   **(b) Test:** The framework must permit a state where $B(p)$ is true in the model, but $B(B(p))$ is false (or $\neg B(B(p))$ is true). The mechanism preventing $B(B(p))$ must be the same resource constraint that prevents $B(q)$ in Desideratum 1, not a special exception for introspection.
  *   **Status:** Settled Prejudice. (Some camps hold first-person authority is constitutive; this project rejects that.)

  **6. The Ten-Minute Case (Dynamics of Reflection) (Case 7)**
  *   **(a) Motivation:** Agents derive new beliefs via reflection without new empirical input. Standard dynamic epistemic logic models change as information arrival. This case requires modeling *computation* as a state changer.
  *   **(b) Test:** The framework must define a transition function $S_{t1} \to S_{t2}$ where the input set is empty (no new atomic facts). The ontology must specify exactly what variable changes (e.g., "awareness set," "derivation depth," "active memory") to license $B(q)$ at $t_2$ that was absent at $t_1$.
  *   **Status:** Non-negotiable. (Static models fail here.)

  **7. Normative Criticism (Case 2, continued)**
  *   **(a) Motivation:** Not all failures of closure are blameless. Some are negligence. A purely descriptive resource model makes all failures mechanical and non-criticizable.
  *   **(b) Test:** The framework must distinguish between $Failure_{capacity}$ (hardware limit) and $Failure_{norm}$ (violating a resource allocation norm). It must derive a verdict "Criticizable" only when the agent had sufficient resources to derive $q$ but allocated them elsewhere, based on the agent's own goals encoded in the model.
  *   **Status:** Non-negotiable. (Without this, it is psychology, not epistemology.)

  **8. Idealization Recovery (Case 8)**
  *   **(a) Motivation:** Standard game theory works despite assuming omniscience. A bounded account must explain why the idealization is sometimes harmless.
  *   **(b) Test:** The framework must demonstrate a limit case where resource costs approach zero or time approaches infinity, such that the agent's behavior converges on the Nash Equilibrium or Dutch Book immunity predicted by classical theory. If the framework cannot recover classical results as a limit, it is incompatible with existing decision science.
  *   **Status:** Settled Prejudice. (Some pluralists may reject classical theory as fundamentally flawed, but engineering compatibility requires this.)

  ---

  ## II. Incompatibility Analysis: Testing the Suspicions

  **Suspicion 1: Non-omniscience, Normativity, and Fixed Resources.**
  *Verdict: Confirmed Incompatibility.*
  This is the most severe tension in the specification. Desideratum 1 (Non-omniscience) and Desideratum 6 (Dynamics) require that belief formation is constrained by resources. Desideratum 7 (Normativity) requires that some failures are blameworthy. If the framework fixes resources by architecture (e.g., "max 5 inference steps"), then exceeding that limit is physically impossible, rendering blame incoherent (ought implies can). If the framework fixes resources normatively (e.g., "should have taken 5 steps"), then the limit is not architectural, and the account risks relocating the problem to "why didn't they allocate resources?" without explaining the mechanism of allocation.
  *Argument:* To satisfy all three, the framework must model resources as *allocatable* rather than *fixed*. The agent must have a meta-belief about resource costs. However, this invites regress (resources needed to calculate resource costs). A framework that hardcodes limits satisfies the engineer but fails the normativity test. A framework that leaves limits flexible satisfies normativity but fails the engineer's verification test. You cannot have a fixed architecture that supports genuine blame for architectural limits.

  **Suspicion 2: Granularity, Charity, and Stability.**
  *Verdict: Manageable Tension.*
  Desideratum 3 (Granularity) distinguishes $p$ from $q$ (where $p \equiv q$). Charity suggests we should interpret agents as believing $q$ if they believe $p$. Stability suggests belief states shouldn't fluctuate wildly. If contents are highly structured, $B(p)$ does not imply $B(q)$, violating Charity. If we force Charity, we lose Granularity.
  *Argument:* This is solvable if "Charity" is treated as a heuristic for attribution, not a constraint on the model ontology. The framework can maintain fine-grained contents internally (satisfying Granularity and Stability) while providing a mapping function for external ascribers that collapses equivalents under low-cost conditions (satisfying Charity pragmatically). The incompatibility dissolves if Charity is external to the agent's ontology.

  **Suspicion 3: Non-Closure and Paradox Dissolution.**
  *Verdict: High Risk.*
  Desideratum 1 (Non-closure) blocks long inference chains. Paradoxes like the Knower or Surprise Examination often rely on very short chains (depth 2 or 3). If the framework blocks closure to solve omniscience, it risks blocking the specific short inferences required to generate these paradoxes.
  *Argument:* If the "inference cost" is high enough to block omniscience, it might be high enough to block the Knower paradox. If the framework dissolves the Knower paradox simply by saying "the agent couldn't compute the diagonalization," it buys safety at the price of plausibility. Humans *can* follow the Knower argument. A framework that blocks this is too coarse. To pass, the framework must allow high-cost inferences for specialized contexts (philosophical reflection) while blocking them for ordinary belief. This requires context-sensitive cost functions, which complicates Desideratum 6 (Dynamics).

  ---

  ## III. The Most Eliminative Requirement

  **Desideratum 6: The Ten-Minute Case (Dynamics of Reflection).**

  This requirement eliminates the largest class of candidates, including standard possible worlds semantics, static awareness logic, and most probabilistic credence models.
  *Reasoning:* Most formalisms are static snapshots. They define consistency conditions on a belief set at time $t$. They treat belief change as *revision* (incoming evidence) or *update* (world change). None natively model *computation* as an internal action that changes the doxastic state without changing the evidence or the world.
  To pass this test, a framework must possess an ontology of *mental actions* (e.g., "apply modus ponens," "retrieve from long-term memory") with associated costs and preconditions. Impossible worlds semantics can represent the state before and after, but lacks the transition mechanism. Syntactic bases have the structure but often lack the normative transition rules. This requirement forces the collaborator to build a process logic, not just a state logic. It is the heaviest lifting because it demands a theory of *how* boundedness is overcome, not just *that* it exists.

  ---

  ## IV. Assessment of Framework Families

  **Impossible-Worlds Semantics**
  Fails Desideratum 6 and 7. It excels at Granularity (Desideratum 3) by allowing worlds where $p$ is true and $q$ is false despite $p \to q$. However, it is fundamentally static. It can represent the state before and after reflection as two different accessibility relations, but it cannot model the *transition* as a resource-consuming action. It treats non-omniscience as a semantic feature rather than a computational process, making Normativity (Desideratum 7) difficult to ground; one cannot be blamed for accessing a different set of impossible worlds.

  **Awareness Operators**
  Passes Desideratum 1 and 6, fails Desideratum 7. Awareness logic explicitly models what an agent is aware of, allowing $B(p)$ without $B(q)$ if $q$ is unaware. It handles the Ten-Minute Case well by modeling awareness growth. However, it struggles with Normativity. Awareness is typically modeled as exogenous or random. The framework rarely explains *why* an agent should become aware of $q$, making it hard to criticize an agent for remaining unaware. It solves the architecture problem but sidesteps the normative one.

  **Implicit/Explicit Distinction**
  Fails Desideratum 2 and 5. This approach posits explicit beliefs (stored) and implicit beliefs (entailed). It handles the Mathematician (Case 1) well. However, it typically enforces logical closure on the implicit set. This makes the Preface (Case 2) impossible to model rationally; if the explicit set is inconsistent, the agent is irrational by definition. It also struggles with Self-Knowledge (Case 6), as agents are usually assumed to have perfect access to their explicit store, making ignorance of one's own beliefs hard to represent.

  **Syntactic Belief Bases**
  Passes Desideratum 1, 6, and 8; struggles with 3. This is the engineer's native tongue. Beliefs are strings in a database; inference is rule application. It naturally handles dynamics and resource limits. However, it often lacks the semantic granularity to distinguish $p \land q$ from $q \land p$ without stipulation. It also risks making belief too fragile; a typo in the base destroys the belief, which conflicts with the stability required for robust attribution. It satisfies the verification tests best but requires philosophical patching for normativity.

  **Structured Contents**
  Passes Desideratum 3 and 4; fails Desideratum 8. By treating propositions as structured objects (trees, graphs), this approach avoids omniscience naturally. It handles the Granularity vs. Contradiction tension well. However, it often lacks a clear account of inference dynamics. Moving from one structured content to another requires a logic of manipulation that is often under-specified. Recovering classical decision theory (Desideratum 8) is difficult because the algebra of structured contents does not always map cleanly to probability spaces required for Nash equilibria.

  **Fragmented Accounts**
  Passes Desideratum 2 (Preface); fails Desideratum 5 (Self-Knowledge). Fragmentation models the mind as multiple belief stores that are not mutually accessible. This perfectly models the Preface (one fragment holds the claims, another holds the preface disclaimer). However, it makes Self-Knowledge nearly impossible; if the fragments are opaque to each other, the agent cannot know what they believe overall. It also complicates the Ten-Minute Case, as reflection requires merging fragments, which is a costly operation not always licensed by the framework. It solves inconsistency by compartmentalization rather than boundedness.
