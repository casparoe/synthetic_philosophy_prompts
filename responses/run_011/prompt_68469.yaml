answer: |-
  **Correction of Understanding**
  Your summary of Bratman and Gilbert is standard. Your reading of Searle requires a slight nuance: Searle does not necessarily deny that mutual beliefs *exist* in shared agency, but he argues they are not *constitutive*. For Searle, the "we-intention" is a primitive psychological state in the individual's mind; it does not derive its status from an epistemic structure involving others. This distinction is vital: Searle's account passes the case not because mutual knowledge is absent, but because it is irrelevant to the existence of the intention.

  **The Scenario: The Estranged Lift**
  Alex and Blair are estranged neighbors. A heavy fallen branch blocks their shared driveway. Both arrive at dawn. Avoiding eye contact due to their feud, each silently takes an end of the branch. Each sees the other take hold. Each knows the other intends to clear the drive. Each knows the other sees them take hold. But because neither signals acknowledgment (no nod, no word), neither knows whether the other recognizes this as a joint effort or merely tolerates their help. They lift together. The branch moves.

  **Analysis of the Accounts**

  **Bratman:**
  *   **Interlocking Intentions:** Satisfied. Each intends that *we* lift, conditional on the other lifting.
  *   **Meshing Sub-plans:** Satisfied. They lift opposite ends.
  *   **Mutual Responsiveness:** Satisfied. They adjust force simultaneously.
  *   **Common Knowledge:** **Fails.** *[Contested]* On the strict reading, common knowledge requires an infinite iteration of "I know that you know that I know..." usually secured by open acknowledgment. The avoidance of eye contact breaks the chain at the second or third level. Alex knows Blair knows, but Alex lacks assurance that Blair knows *Alex knows* it is joint.
  *   **Verdict:** Not shared intentional activity.

  **Gilbert:**
  *   **Joint Commitment:** **Fails.** *[Contested]* Gilbert requires an "open expression of readiness" to be jointly committed. Silence and avoidance constitute a failure to express readiness openly. Without this, there is no plural subject.
  *   **Verdict:** Not a plural subject; merely coordinated individuals.

  **Searle:**
  *   **We-Intention:** **Passes.** Each participant possesses the primitive internal state "We are lifting this." Since Searle locates collective intentionality in the individual mind without requiring constitutive mutual belief or open commitment, the lack of acknowledgment is irrelevant.
  *   **Verdict:** Genuine collective intentionality.

  **Intuitive Verdict and Risk**
  Most people would describe Alex and Blair as acting together. The absence of exchange feels socially cold, but not ontologically deficient. There is a risk the case is loaded in Searle's favour: it relies on the intuition that internal coordination suffices for joint action. If students feel the lack of acknowledgment makes the action merely "parallel," the case fails to isolate the epistemic condition.

  **The Single Feature**
  The feature doing the work is the **avoidance of acknowledgment** (the feud).
  *   **Remove it:** If they nod or speak, common knowledge is established (Bratman passes), expression is made (Gilbert passes), and we-intentions remain (Searle passes). All three converge.
  *   **Keep it:** The theories diverge.

  **Objections and Disputes**
  *   **The Bratmanian Attack:** A Bratmanian might argue that common knowledge is not essential, or that *mutual responsiveness* itself generates the necessary epistemic state. *[Disputed]* Some scholars argue Bratman only requires mutual belief, not strict common knowledge. If mutual responsiveness suffices for mutual belief, Bratman passes.
  *   **The Gilbertian Attack:** A Gilbertian might argue that taking hold of the branch *is* an open expression of readiness. *[Disputed]* Gilbert insists on expressions that make the commitment common knowledge; tacit action is often deemed insufficient.
  *   **Evaluation:** The Bratmanian attack is stronger. If mutual responsiveness is present, denying shared agency feels like fetishizing the epistemic loop over the practical coordination.

  **Tuomela's Framework**
  *[Confident]* Tuomela would likely classify this as **Pro-social I-mode** rather than **We-mode**. The participants have aligned private goals and cooperate, but they lack the collective acceptance of a goal as a group member (the joint commitment). Thus, like Gilbert and Bratman, Tuomela would likely deny this is full-blown shared agency, siding against Searle.
