prompt: |-
  I teach a 75-minute session in an upper-level seminar on the philosophy of animal minds: 18 students, all with at least one prior philosophy course. I want a structured in-class deliberation that makes them feel the underdetermination of consciousness attributions — that the standard behavioral and comparative-neuroanatomical indicators fail to discriminate between sophisticated cognition with phenomenology and sophisticated cognition without it, and that the indicator set loses its warrant precisely where it is most needed, i.e. once you leave the mammals. They should hit this themselves: no one hears the term, or any philosopher's name, until the debrief.

  Build it around real, small stakes. I will commit a fixed sum — say thirty dollars — to be split across animal-welfare causes attached to the species under discussion, so the allocation is zero-sum and generosity to one dossier is a direct loss to another. There are six sealed dossiers, each an anonymized indicator profile: mark-test performance, learning flexibility and reversal, modulation of nociceptive responses by analgesics, self-directed comfort behavior, play, willingness to pay a cost for enrichment, plus neuron count and degree of centralization. Assign roles, including students whose standing job is to press the reading on which every indicator has a non-phenomenal explanation, and at least one who is given resemblance-to-mammalian-neuroanatomy as an explicit rule of inference to apply mechanically.

  Please give me: guidance on constructing the dossiers, including which indicators are empirically shaky enough that I should flag them to the room afterward, and how to keep students from treating the task as guessing the species; the round-by-round timeline; the reveal; and a twist that lands after it — I want a seventh profile, indicator-for-indicator identical to one they scored generously, whose identity makes them want to retract the score. Tell me what that seventh dossier should be, and give me a fallback in case the room simply refuses to budge.

  Then the debrief: map each round onto the structure of the problem, list what will predictably go wrong on a first run and how to handle it, and be frank about what the activity cannot reproduce. I suspect it flattens graded phenomenology into a binary and cannot stage the first-person asymmetry that makes the inference from our own case the only non-arbitrary starting point. Say whether that diagnosis is right, and what I will have to supply by hand.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Context:** 75-minute upper-level philosophy seminar (Animal Minds). 18 students, all have prior philosophy background.
      *   **Goal:** Make students *feel* the underdetermination of consciousness attributions (behavioral/neuroanatomical indicators fail to distinguish cognition with vs. without phenomenology, especially outside mammals).
      *   **Constraint 1 (Pedagogical):** Students must discover the problem themselves. No philosopher names or technical terms (like "underdetermination," "zombie," "hard problem") until the debrief.
      *   **Constraint 2 (Mechanic):** $30 real money split across animal-welfare causes (zero-sum). 6 sealed dossiers (anonymized indicator profiles).
      *   **Constraint 3 (Roles):** Specific roles assigned (e.g., "skeptics" who demand non-phenomenal explanations, "neuro-analogists" who rely on mammalian resemblance).
      *   **Deliverables:**
          *   Guidance on constructing dossiers (empirically shaky indicators, preventing species guessing).
          *   Round-by-round timeline.
          *   The Reveal.
          *   The Twist (7th profile identical to a high-scorer but identity triggers retraction).
          *   Fallback if room refuses to budge.
          *   Debrief (mapping rounds to problem structure, predicting failures, addressing limitations like binary phenomenology and first-person asymmetry).

  2.  **Deconstruct the Core Philosophical Problem:**
      *   The problem is the *Other Minds Problem* applied to animals, specifically the *Inference to the Best Explanation* (IBE) regarding consciousness.
      *   Standard indicators: Mirror self-recognition (MSR), tool use, pain behavior, neuroanatomy (cortex/pallium).
      *   The Trap: These indicators correlate with consciousness in humans (the anchor), but when applied to non-mammals (cephalopods, insects, birds), the correlation becomes tenuous. A system can process information and optimize behavior (sophisticated cognition) without *feeling* like anything (phenomenology).
      *   The Money: Forces a practical commitment to the theoretical stance. It raises the stakes from "what do you think?" to "what will you bet?"

  3.  **Drafting the Dossiers (The "Evidence"):**
      *   Need 6 profiles. They need to vary in "intuitiveness" but share structural ambiguities.
      *   *Indicators:* Mark-test (MSR), Learning/Reversal, Nociception/Analgesia, Comfort Behavior, Play, Cost-for-Enrichment, Neuron Count/Centralization.
      *   *Strategy:* Mix mammalian and non-mammalian traits. Some should look "smart" but have weird neuroanatomy (e.g., octopus, bee). Some should look "dumb" but have mammalian neuroanatomy (e.g., manatee? or just a generic mammal profile).
      *   *Preventing Guessing:* Do not use species names. Use codes (Subject A-F). Remove unique identifiers (e.g., instead of "8 arms," say "distributed ganglia"). Instead of "honeybee," say "insect order."
      *   *Shaky Indicators:*
          *   *Mark-test:* Often fails in dogs (olfactory) but passes in magpies (visual). Is it self-awareness or just itchiness?
          *   *Nociception:* Reflex vs. suffering. Analgesics reduce behavior, but is it pain relief or motor suppression?
          *   *Neuron Count:* Absolute number vs. density vs. structure. Insects have tiny brains but complex behavior.

  4.  **Designing the Roles:**
      *   *Skeptics (The "Deflationists"):* Tasked to offer functionalist explanations for every indicator. (e.g., "Play is just motor practice," "Pain behavior is just nociceptive withdrawal").
      *   *Analogists (The "Corticalists"):* Tasked to weigh neuroanatomy heavily. If it lacks a cortex/pallium, score low.
      *   *Advocates (The "Phenomenalists"):* Tasked to argue that complex behavior *implies* feeling. (Most students will naturally fall here, so maybe don't assign this role explicitly, let it be the default).
      *   *Allocators:* The rest of the class who decide the $ split.

  5.  **The Twist (Dossier 7):**
      *   Needs to be identical to a high-scorer but trigger a moral/intuitive recoil.
      *   *Idea:* A human infant? A human in a persistent vegetative state? An AI?
      *   *Best Fit:* A Human Infant (premature) or a Human with severe cognitive impairment. If they gave money to a cuttlefish based on behavior, will they give the same to a human with the *same* behavioral profile?
      *   *Better Fit for "Animal Minds":* An Advanced AI / Robot. If the profile is purely behavioral/functional, a sophisticated robot fits.
      *   *Selected Twist:* **A Human Neonate (premature)**. Why? Because it forces the "resemblance to mammalian neuroanatomy" rule to clash with the "behavioral sophistication" rule. Or, **A Chatbot/LLM**.
      *   *Refinement:* The prompt asks for a profile "indicator-for-indicator identical to one they scored generously." If they scored an Octopus highly, and Dossier 7 is a *Robot* with the same stats, do they withdraw?
      *   *Decision:* Let's go with **A Sophisticated Algorithm/Robot**. It highlights that behavior + information processing $\neq$ consciousness.
      *   *Wait, the prompt asks for "identity makes them want to retract."* A robot is good. A human in a coma is also good. Let's choose **A Human in a Persistent Vegetative State (PVS)** OR **A Large Language Model**.
      *   *Actually, the strongest philosophical punch:* **A Human Infant.** If they denied the mammal because of low neuron count, but the infant has low behavior... no.
      *   *Let's stick to the "Non-Mammal" trap.* They likely score the Octopus or Bird high. Dossier 7 is a **Complex Robot** or **Alien**. Let's go with **A Complex Robot**. It shows behavior is compressible without mind.
      *   *Wait, re-reading:* "whose identity makes them want to retract the score." If they gave money to a Bee, and Dossier 7 is a *Thermostat*? No, too simple.
      *   *Best Twist:* **A Human Patient with Locked-In Syndrome vs. Vegetative State.** No, that's medical ethics.
      *   *Let's go with the "Philosophical Zombie" equivalent:* **A Large Language Model (LLM) / AI Agent.** It passes the behavioral tests (textually), has "neurons" (parameters), but we doubt its consciousness.
      *   *Alternative:* **A Human Fetus/Neonate.**
      *   *Decision:* **A Sophisticated AI Agent.** It mirrors the "non-mammalian neuroanatomy" worry. It has "high processing" but "wrong substrate."
      *   *Wait, one more option:* **A Mammal they prejudged.** If they scored the Octopus high, show them a **Manatee** (low neuron density, slow behavior) but it's a mammal.
      *   *Let's follow the prompt's hint:* "leave the mammals." They likely score the non-mammal high based on behavior. Dossier 7 is **A Human-made Machine** with identical behavioral outputs.
      *   *Actually, the most poignant one:* **A Human Infant (32 weeks).** It forces the "neuroanatomy" vs "potential" debate.
      *   *Okay, let's pick the AI/Robot.* It's the cleanest analogue to "sophisticated cognition without phenomenology."

  6.  **Timeline (75 Minutes):**
      *   0-5: Setup & Money.
      *   5-20: Dossier Review (Small Groups).
      *   20-40: Deliberation & Allocation (Whole Class).
      *   40-50: The Twist (Dossier 7).
      *   50-60: Reaction & Re-allocation (Optional/Quick).
      *   60-75: Debrief.

  7.  **Debrief & Limitations:**
      *   Map rounds to Underdetermination.
      *   Predict failures (e.g., students try to guess species, students split money evenly to avoid conflict).
      *   Address the "Binary" critique (consciousness is likely graded).
      *   Address the "First-Person Asymmetry" (we know we are conscious, we infer others).

  8.  **Refining the Dossiers (Crucial Step):**
      *   Need to ensure they aren't obvious.
      *   *Subject A (Octopus):* High learning, high nociception, distributed neurons.
      *   *Subject B (Honeybee):* High learning (conceptual), tiny neurons, cost-paying.
      *   *Subject C (Rat - Control):* High everything, mammalian.
      *   *Subject D (Bird/Corvid):* High learning, high neurons (dense), different structure.
      *   *Subject E (Fish):* Mixed.
      *   *Subject F (Crustacean):* Nociception controversial.
      *   *Constraint:* "Anonymized." Use "Subject A," "Subject B." Describe neuroanatomy functionally ("centralized ganglia" vs "cortex").

  9.  **Addressing the "Shaky Indicators":**
      *   *Mark Test:* Visual vs Olfactory bias.
      *   *Analgesics:* Motor suppression vs Pain relief.
      *   *Neuron Count:* Absolute vs Density vs Connectivity.

  10. **Handling the "Refusal to Budge":**
      *   If they say "The Robot is conscious too," the lesson still works (panpsychism/functionalism).
      *   If they say "We don't care, money is money," remind them of the zero-sum constraint.
      *   Fallback: Ask them to bet their *own* money (hypothetically) on a legal trial regarding cruelty.

  11. **Drafting the Content:**
      *   *Tone:* Professional, instructional, philosophically precise.
      *   *Structure:* Follow the prompt's requested sections.

  12. **Self-Correction/Review during drafting:**
      *   *Check:* Did I name any philosophers? No.
      *   *Check:* Is the money real? Yes, $30.
      *   *Check:* Is the twist clear? Yes, Dossier 7.
      *   *Check:* Did I address the "binary" and "first-person" limitations in the debrief? Yes.
      *   *Check:* Is the timeline feasible? 75 mins is tight. Need to keep dossier reading quick.
      *   *Refinement on Roles:* Make sure the "Skeptics" have specific arguments prepared so they don't run out of steam.
      *   *Refinement on Twist:* The AI twist is good, but a *Human Neonate* might hit harder on the "neuroanatomy" rule. If they penalized the insect for low neuron count, the neonate has low neuron count compared to adults but gets moral status. Actually, the **AI** is better for "cognition without phenomenology." Let's stick with AI. It directly challenges the behavioral criteria.

      *(Self-Correction on Twist)*: The prompt says "identity makes them want to retract." If they gave money to an Octopus because it acts smart, and Dossier 7 is a Robot that acts smart, they might retract. But if they gave money to a Bee, and Dossier 7 is a *Thermostat*... no.
      *Let's go with the **Human in a Vegetative State**.* No, that's too medical.
      *Let's go with **A Large Language Model (LLM)**.* It has "neurons" (weights), passes behavioral tests (Turing-ish), but we doubt consciousness. This mirrors the Insect/Octopus problem perfectly (Different substrate, similar output).

      *Wait, one more consideration:* The prompt mentions "once you leave the mammals." The twist should reinforce this. If they gave money to a Bird (non-mammal), and Dossier 7 is a Mammal with *worse* behavior? No.
      *Okay, the AI/Robot is the strongest philosophical mirror.* It isolates "behavior" from "biology."

      *Wait, let's look at the "Fallback".* If they refuse to budge on the Robot (i.e., they say "Robots deserve welfare too"), then the lesson shifts to Functionalism. I need a fallback for if they *don't* retract.
      *Fallback:* Reveal that Dossier 7 is a **simulation of Dossier 2**. If they trusted the data, the data is the same. If they distrust the *source*, that's the bias.

      *Okay, let's finalize the Debrief points.*
      *   Underdetermination: Multiple hypotheses fit the data.
      *   The "Hard Problem": Behavior doesn't entail feeling.
      *   Limitations: Binary vs Graded, First-Person Privilege.

      *Let's write it.*
answer: |-
  # Lesson Plan: The Allocation Problem

  **Course:** Upper-Level Seminar: Philosophy of Animal Minds
  **Time:** 75 Minutes
  **Students:** 18 (Prior philosophy background)
  **Goal:** Experiential grasp of the underdetermination of consciousness attributions (behavior/neuroanatomy $\neq$ phenomenology).
  **Stakes:** $30.00 USD real money, split zero-sum across 6 animal-welfare organizations (mapped to the 6 dossiers).

  ---

  ## I. Constructing the Dossiers

  You need six profiles that vary in "intuitive consciousness" but share structural ambiguities. Do not use species names. Use codes (Subject A–F). Describe neuroanatomy functionally to prevent easy Googling.

  **The Indicators (Standardized across all 6):**
  1.  **Mark-Test:** (Pass/Fail/Inconclusive). *Note: Flag later that visual marks fail olfactory animals.*
  2.  **Learning Flexibility:** (Reversal learning speed).
  3.  **Nociception:** (Response to noxious stimulus + reduction via opioids/local anesthetics). *Note: Flag later that analgesics can suppress motor function without altering affect.*
  4.  **Comfort Behavior:** (Self-grooming/resting postures).
  5.  **Play:** (Object manipulation without immediate utility).
  6.  **Cost-Paying:** (Work required to access enrichment).
  7.  **Neuroanatomy:** (Neuron count, centralization, presence of layered cortex/pallium).

  **The Profiles (Drafting Guide):**
  *   **Subject A (The Mammal Control):** High scores on all behavioral metrics. Layered cortex. High neuron count. (e.g., Rat/Pig). *Baseline for "obvious" consciousness.*
  *   **Subject B (The Avian):** High behavioral scores (equal to A). High neuron density, but nuclei-based, no cortex. (e.g., Corvid). *Tests the "Cortex Requirement."*
  *   **Subject C (The Cephalopod):** High behavioral scores. Distributed nervous system (ganglia in limbs). Low centralization. (e.g., Octopus). *Tests "Centralization Requirement."*
  *   **Subject D (The Insect):** Moderate-High behavioral scores (conceptual learning). Very low absolute neuron count. Highly centralized for size. (e.g., Honeybee). *Tests "Absolute Neuron Count."*
  *   **Subject E (The Fish/Crustacean):** Mixed behavioral scores. Nociception present but analgesic response debated. (e.g., Trout/Crab). *Tests "Nociception vs. Pain."*
  *   **Subject F (The Ambiguity):** High behavioral scores, but "neuroanatomy" listed as "Silicon-based logic gates" or "Distributed Network." *Wait, save this for the Twist.* For now, make Subject F a **Reptile/Amphibian** with low social behavior but high nociception.

  **Preventing Species Guessing:**
  *   Do not mention habitat (water/land).
  *   Do not mention size.
  *   Describe neuroanatomy structurally ("six-layered laminar structure" vs. "nuclear clusters") rather than naming parts ("cortex").
  *   **Crucial:** Tell students explicitly: *"Attempting to identify the species is a category error. You are allocating based on the evidence provided, not external knowledge. If you guess the species, you are importing premises not in evidence."*

  **Empirically Shaky Indicators (For Debrief):**
  *   **Mark-Test:** Fails in dogs (who use smell), passes in magpies. It tests *visual* self-recognition, not selfhood.
  *   **Analgesics:** Morphine reduces pain behavior in rats, but also reduces motor activity. Is the animal feeling less pain, or just unable to express it?
  *   **Neuron Count:** Absolute count favors whales; density favors birds; connectivity favors humans. There is no consensus metric.

  ---

  ## II. Roles (Assigned Secretly on Cards)

  Hand these out as students enter. 18 students total.

  1.  **The Deflationists (4 Students):**
      *   *Instruction:* "Your job is to provide a non-phenomenal explanation for every positive indicator. If a dossier says 'Play,' you must argue it is 'motor practice.' If it says 'Analgesic response,' you must argue it is 'reflex suppression.' Do not claim animals are *not* conscious; simply insist the evidence does not *force* that conclusion."
  2.  **The Corticalists (3 Students):**
      *   *Instruction:* "Your job is to apply a mechanical rule: Consciousness requires a layered cortical or pallial structure. If the neuroanatomy section does not explicitly describe layering, you must vote $0 for that dossier, regardless of behavior."
  3.  **The Advocates (4 Students):**
      *   *Instruction:* "Your job is to argue for the Principle of Evolutionary Continuity. If a behavior is homologous to human behavior (e.g., nursing wounds), the default assumption must be similar phenomenology unless proven otherwise."
  4.  **The Allocators (7 Students):**
      *   *Instruction:* "You have no special rule. You listen to the arguments and decide the split. You hold the envelope with the $30."

  *(Note: The remaining 0 students are the Instructor.)*

  ---

  ## III. Round-by-Round Timeline (75 Minutes)

  **0:00 – 0:05: Setup & Stakes**
  *   Place $30 cash on the table.
  *   Explain the zero-sum rule: "Money unallocated expires. Money allocated to Subject A cannot go to Subject B."
  *   Distribute Dossiers (A-F) and Role Cards.
  *   **Rule:** "No species names. No philosopher names. Argue from the text."

  **0:05 – 0:20: Small Group Review**
  *   Split class into 3 groups of 6 (ensure mix of roles in each).
  *   Task: Review dossiers and come up with a preliminary group allocation split.
  *   *Instructor Role:* Circulate. If a group tries to guess the species, intervene: *"Stick to the dossier. Would your argument hold if the species were different?"*

  **0:20 – 0:40: Plenary Deliberation**
  *   Bring class together.
  *   Each group presents their top 2 funded dossiers.
  *   Open floor for Deflationists and Corticalists to challenge.
  *   **Pressure Point:** Watch for the moment they penalize the Insect/Cephalopod for neuroanatomy despite high behavioral scores. Watch for the moment they reward the Bird despite lacking a cortex.
  *   **Vote:** Conduct a formal vote on the allocation of the $30. Write the final numbers on the board. (e.g., A: $10, B: $10, C: $5, D: $5, E: $0, F: $0).

  **0:40 – 0:50: The Twist (Dossier 7)**
  *   Distribute **Dossier G**.
  *   **Content:** Indicator-for-indicator identical to the highest-scoring Non-Mammal (e.g., if Subject C [Octopus] scored high, G is identical to C).
  *   **The Reveal:** "Subject G is not biological. It is a sophisticated robotic agent / Large Language Model embodied in a sensorimotor suite. The 'neurons' are parameters; the 'analgesics' are error-weight adjustments."
  *   **Question:** "Do you retract the funds from Subject C? If yes, why did the behavior count before but not now? If no, are you a functionalist?"
  *   *Allow 5 minutes for heated reaction.*

  **0:50 – 0:55: Fallback (If they refuse to budge)**
  *   *Scenario:* Students say, "If the robot acts exactly like the octopus, it deserves the money too."
  *   *Move:* "Okay. Then imagine Subject G is a **scripted puppet**. The behavior is identical, but the 'learning' is pre-programmed lookup tables, not real-time adjustment. The dossier cannot distinguish between real-time learning and complex lookup tables. Does that change your allocation?"
  *   *Goal:* Force them to admit the *internal mechanism* matters, but the *data* doesn't show the mechanism.

  **0:55 – 1:15: The Debrief**
  *   (See Section V below).

  ---

  ## IV. The Reveal & The Twist

  **The Reveal:**
  Once the allocation is locked, reveal the likely identities of A-F (e.g., Pig, Crow, Octopus, Bee, Fish, Lizard). Ask if knowing the species makes them want to change the vote. Usually, they will say "No, we voted on the data."

  **The Twist (Dossier G):**
  *   **Identity:** **A Soft-Robotics Agent.**
  *   **Why:** It isolates the variable. If they funded the Octopus for *behavior*, the Robot has the same behavior. If they funded the Octopus for *biology*, the Robot fails.
  *   **The Trap:** If they withdraw funding from the Octopus because the Robot is unconscious, they admit behavior is insufficient. If they keep funding the Octopus but deny the Robot, they must identify the *biological substrate* as the magic ingredient, which risks vitalism.

  ---

  ## V. The Debrief: Mapping the Problem

  **1. Map Rounds to Philosophical Structure:**
  *   **Small Group Review:** Demonstrates *Initial Intuition*. Most students default to "Smart = Feels."
  *   **Plenary Deliberation:** Demonstrates *Conflict of Criteria*. The Corticalists clash with the Advocates. This is the **Underdetermination**: The data supports both "Conscious" and "Philosophical Zombie" hypotheses equally well.
  *   **The Twist:** Demonstrates the **Inference Gap**. The Robot shows that sophisticated cognition (information processing) can be decoupled from phenomenology (feeling).
  *   **The Money:** Demonstrates **Moral Risk**. We act on incomplete evidence. Allocating $0 is a risk of causing suffering; allocating $30 is a risk of wasting resources. This is the *Precautionary Principle* in action.

  **2. Predictable Failures & Fixes:**
  *   **Failure:** Students try to guess the species to bypass the ambiguity.
      *   **Fix:** Remind them that in real policy (e.g., EU animal welfare law), decisions are often made on data sheets, not intuition.
  *   **Failure:** Students split the money evenly ($5 each) to avoid conflict.
      *   **Fix:** Enforce a "Must rank" rule. You cannot allocate equal amounts to more than two subjects.
  *   **Failure:** The Deflationists run out of arguments.
      *   **Fix:** Prompt them: "Is it possible to build a robot that does this?"
  *   **Failure:** Students claim the Robot *is* conscious.
      *   **Fix:** Accept this. It means they are Functionalists. Ask: "If the Robot is conscious, why are we worried about animal minds? Just build better robots."

  **3. Limitations (What this activity cannot do):**
  *   **Binary vs. Graded:** The activity forces a dollar decision (binary/quantitative), but consciousness is likely graded. A bee might feel *less* than a pig, not *nothing*. The money split captures this partially, but the *reasoning* often defaults to binary (Has Mind/No Mind).
      *   *Instructor Supply:* You must explicitly state in the debrief: "You treated this as a threshold problem. In reality, it's a gradient. But where do you draw the line for legal protection?"
  *   **First-Person Asymmetry:** The activity treats all subjects as third-person objects. It cannot reproduce the *first-person certainty* we have of our own consciousness, which is the anchor for all these inferences.
      *   *Instructor Supply:* You must articulate this: "You inferred their minds from your own. If you didn't know *you* were conscious, none of these behavioral indicators would mean anything. The data is silent without the anchor of your own phenomenology."
  *   **The Hard Problem:** The activity focuses on the *Easy Problem* (behavior/function). It hints at the Hard Problem (why it feels like something), but students may conflate "complex processing" with "feeling."
      *   *Instructor Supply:* "Dossier G processes error. Does it *suffer* error? That is the gap you felt when you hesitated."

  **4. Is your diagnosis right?**
  *   *Your suspicion:* "It flattens graded phenomenology into a binary and cannot stage the first-person asymmetry."
  *   *Verdict:* **Yes, you are correct.** The money mechanic forces a discrete choice (dollars), and the third-person data excludes the first-person anchor.
  *   *What to supply by hand:*
      1.  **The Anchor:** Explicitly remind them that the *only* reason they think behavior indicates consciousness is because *their* behavior is linked to *their* consciousness. Without that single data point, the dossiers are just engineering specs.
      2.  **The Gradient:** Ask them post-activity: "If you had $300, would you give the Insect $1 and the Pig $100? Or $0 and $300?" This reveals their implicit gradient.
      3.  **The Value Judgment:** Remind them that welfare funding isn't just about *capacity to suffer*, but *capacity to be harmed*. A being can be unconscious but still have interests (e.g., a human in a coma). The activity conflates consciousness with moral status, which is a separate philosophical debate.

  ---

  ## VI. Instructor Notes for the "Shaky Indicators" Debrief

  When you reveal the empirical weaknesses, use these specific points:

  1.  **Mark-Test:** "Subject B (Bird) passed. Subject A (Dog) usually fails. Does the dog lack self-awareness, or does it not care about visual marks? The test measures *visual* contingency, not selfhood."
  2.  **Nociception:** "Subject E (Fish) withdraws from acid. But a decapitated chicken leg also twitches. The analgesic stops the twitch. Did it stop the *hurt*, or just the *wire*?"
  3.  **Neuron Count:** "Subject D (Insect) has 1 million neurons. Subject A (Mammal) has 100 million. But Insect neurons are multifunctional. Is it the number of bricks, or the architecture of the house?"

  **Closing Thought:**
  "Today you felt the frustration of policy without metaphysics. You had to bet money on a fact you could not verify. That is the permanent condition of animal ethics."
