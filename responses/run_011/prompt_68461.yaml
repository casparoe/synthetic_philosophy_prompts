          2.  Theoretical Conflict (Opening vs. Tainter).
          3.  Load-Bearing Move.
          4.  Verdict on Conclusion.
          5.  Final Stance (User vs. Classmate vs. Third).

      *   *Refining the Audit:* Make sure the verdicts are sharp.
          *   Easter Island: "False" is too strong? No, the "ecocide/cannibalism/pre-European collapse" narrative is largely debunked in specialist circles. Call it "False/Outdated."
          *   Maya: "Maya disappeared" is definitely False.
          *   Mechanism: "Live controversy reported as settled."

      *   *Refining the Tainter vs. Opening:* This is crucial. Tainter explicitly critiques the ecological overshoot model. The paragraph tries to have both. This is the "theoretical muddle."

      *   *Refining the Load-Bearing Move:* It's the claim that "The mechanism is the same in each case." If that goes, the universal law goes.

      *   *Refining the Conclusion:* The determinism ("stage they pass through") is the weak point. Correcting the facts weakens it, but correcting the *theory* kills it.

      *   *Final Stance:* I will side with the user but deepen the critique. The classmate is wrong to call it "fair." It's a "zombie theory" paragraph (mixing dead or contested ideas).

  5.  **Final Review against Constraints:**
      *   No references? Check.
      *   Definite verdicts? Check.
      *   Commit to judgment? Check.
      *   Address Opening/Tainter conflict? Check.
      *   Identify load-bearing move? Check.
      *   Evaluate closing inference? Check.

  6.  **Writing the Output:** (Self-Correction during drafting: Ensure I don't sound like I'm giving a reading list. Keep it focused on the text provided.) *Make sure to explicitly state that the Opening Sentence and Tainter are incompatible.* *Make sure to highlight that the Maya did not disappear.* *Make sure to validate the user's suspicion about the last sentence while showing the foundation is also cracked.*

      *   *Decision:* I will take a "Third Position" that validates the user's skepticism but locates the error earlier than they did, while explicitly rejecting the classmate's defense as too lenient on factual accuracy.

      *(Self-Correction on "False" vs "Controversy"):* For Easter Island, calling it "False" might be too blunt given some ecocide happened, but the *narrative* presented (statues -> trees gone -> cannibalism -> pre-European collapse) is the specific "Diamond" version which is now heavily contested. I will label it "Outdated/Contested reported as Fact." For Maya "disappeared," that is simply False.

      *(Final Polish):* Ensure the distinction between "sociopolitical complexity" (Tainter) and "environment support" (Malthus) is clear.

