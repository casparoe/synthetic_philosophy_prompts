      *   **Preliminary Articles (Negative Constraints):** These look like hard constraints or safety interlocks. "No secret reservations," "No independent states acquired," "Standing armies abolished," "No national debt for war," "No interference," "No hostile acts rendering trust impossible."
          *   *Control Mapping:* Hard limits, saturation bounds, noise filtering.
      *   **Definitive Articles (Positive Structure):**
          1.  Republican Civil Constitution (Internal Stability).
          2.  Federation of Free States (External Coupling).
          3.  Cosmopolitan Right (Boundary Conditions/Interface).
          *   *Control Mapping:* Internal dynamics, coupling topology, interface protocols.
      *   **Nature's Guarantee (Teleology):** Nature forces humans via war and trade to seek peace.
          *   *Control Mapping:* System dynamics driving towards an attractor regardless of control input.
      *   **Appendix (Morality vs. Prudence):** Moral Politician vs. Political Moralist.
          *   *Control Mapping:* Objective function definition. Optimization vs. Constraint satisfaction.

  3.  **Drafting the Translation (Part by Part):**

      *   *Preliminary Articles:* These are *constraints* on the control inputs. They prevent the system from entering unstable regimes.
          *   *Mapping:* Hard constraints on actuator signals. Safety interlocks.
