answer: |-
  Thanks for laying this out so clearly because you have put your finger on a genuine philosophical mess that most businesses just ignore until it blows up. The implicit theory of obligation running your shop is not a single coherent system but rather a hybrid of what we might call participatory conventionalism mixed with tacit contractualism. Essentially, the shop operates as a micro-sovereignty where obligation is generated by the act of entering the space and engaging in the practice, rather than by universal moral laws or explicit written agreements. This explains why your rules feel stable even though their justifications contradict each other. You are running on the assumption that presence implies consent, and that participation in a coordinated practice creates duties to maintain that practice, even if the specific rules are arbitrary.

  When you look at the tip, it is functioning as all three things you mentioned simultaneously, which is where the friction comes from. Legally and structurally, it is a wage subsidy, which is proven by the fact that the employer must cover the gap if tips fall short and by the tip-out rule that redistributes the money regardless of who served the customer. If it were truly a gift, the giver would designate the recipient, but your tip-out rule severs that link, turning the tip into institutional revenue sharing. Socially, however, it is framed as a gift or gratuity, which is why the menu says it is never expected. This fiction is necessary to preserve the hospitality dynamic where the customer feels like a host bestowing favor rather than a debtor paying a bill. But in practice, because the staff rejected the flat-wage model, it functions as a performance-based debt that customers owe for service rendered. The theory here presupposes that the customer is morally bound to subsidize the wage structure they benefit from, but it masks this obligation as voluntary generosity to avoid the friction of a direct transaction.

  The difference between the queue and the jaywalking highlights how conventions acquire moral weight only when they are constitutive of a specific social practice rather than merely regulatory. The single queue is a constitutive rule of your shop's specific form of life; it defines what fairness means within that interaction. When someone cuts in line, they are violating a promise of reciprocity made to the other customers who are also participating in that practice. They are gaining an unfair advantage over specific peers within the micro-society of the coffee shop. Jaywalking, by contrast, is a regulatory convention imposed by the state for general safety. When a customer crosses against the light with no traffic, they are breaking a rule, but they are not violating a specific interpersonal agreement with another pedestrian or with you. The moral offense in line-cutting comes from the direct harm to fairness among participants, whereas the jaywalking is a victimless violation of an external statute. Your setup presupposes that internal conventions necessary for the practice to function are morally binding, while external conventions are optional if they do not impact safety.

  Regarding the visitors, your practice assumes that local norms morally bind anyone who enters the territory, regardless of prior knowledge or consent. This is a theory of tacit consent based on territoriality. By stepping up to the counter, the tourist is treated as having agreed to the local customs, much like entering a country requires obeying its laws even if you did not vote for them. The staff reaction to the non-tipping tourist reveals that ignorance is not considered an excuse because the obligation arises from the participation in the transaction, not from the internal state of the customer. The norm binds them because they are benefiting from the service structure that relies on those norms. What is strictly presupposed here is that the shop has the authority to enforce its own normative order on anyone who chooses to interact with it. What merely fits with this, but is not required by it, is the idea that the customer knows the rules; the system works even if they don't, because the judgment falls on them regardless.

  There are several places where different theories would license exactly the same behavior, which is why this has gone unexamined for so long. For instance, a utilitarian theory maximizing staff income and a libertarian theory of voluntary exchange both result in the tip screen appearing at the point of sale. A fairness-based theory and an efficiency-based theory both support the single queue system. You cannot tell which theory is driving the behavior just by looking at the actions, because the actions are overdetermined. This equifinality allows the contradictory justifications to coexist without immediate collapse. The staff can tell themselves they are working for gifts while banking on wages, and customers can tell themselves they are being generous while paying a surcharge.

  If you swapped this presupposed view for the most plausible rival one, which would be an explicit hospitality model where service is included in the price, almost every interaction you described would change. You would remove the tip screen and raise prices, which shifts the obligation from a social debt to a market price. The tip-out rule would become irrelevant because wages would be fixed, removing the variance that staff currently prefer. The moral outrage over line-cutting would likely diminish because the transaction would be less personalized; without the tip acting as a performance incentive, the interaction becomes more mechanical and less of a social practice requiring mutual maintenance. Most importantly, the judgment of tourists would vanish. Under an explicit pricing model, a tourist not paying extra is not cheap, they are just paying the price. The obligation would no longer rely on tacit consent or local knowledge but on the explicit label on the menu. This would clarify the theory of obligation from a messy hybrid of gift and wage to a straightforward contract of sale, but you would lose the flexibility that allows your staff to earn more than the base rate during busy hospital shifts. You are currently running on a system that maximizes flexibility and potential income at the cost of moral coherence, and switching to the rival theory would maximize coherence at the cost of that upside variance.
