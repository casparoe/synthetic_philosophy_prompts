      *   **The Standard Reply (IMT Judgment):** The Charter was declaratory of existing international law (Kellogg-Briand Pact, etc.). The novelty was *enforcement* mechanism.
      *   **Implication of Standard Reply:** If the law existed, then Allies *also* broke it if they waged aggressive war. Therefore, the asymmetry objection stands *even if* the retroactivity objection fails.
      *   **Tokyo vs. Nuremberg:** London Charter = Treaty. Tokyo Charter = Order by MacArthur (SCAP). This strengthens the "victors' justice" claim for Tokyo regarding legitimacy/procedure, but the substantive law was largely the same.
