answer: |-
  This is an exceptionally sophisticated distinction for a high school research project. You have correctly identified that "Victors' Justice" is often used as a catch-all phrase that obscures two very different legal and moral critiques. Disentangling them is crucial for a rigorous analysis.

  Below is an analysis of your questions, with specific attention paid to distinguishing between **settled historical/legal facts** and **contested scholarly interpretations**.

  ***

  ### 1. Are the Two Objections Independent?

  You asked whether the retroactivity objection (substantive law) and the structural asymmetry objection (procedural/political) are independent, or if one collapses into the other.

  **[Settled Ground]**
  In legal theory, these are analytically distinct categories.
  *   **Objection 1 (Retroactivity):** Concerns *Nullum Crimen Sine Lege* ("no crime without law"). It asks: "Was this conduct illegal *at the time* it happened?"
  *   **Objection 2 (Asymmetry):** Concerns *Equality Before the Law* and *Tu Quoque* ("you also"). It asks: "Is the law being applied evenly to all parties, or only to the losers?"

  **[Contested Interpretation]**
  While distinct in theory, historians and legal philosophers disagree on whether they function independently in practice.
  *   **View A (Independence):** Many scholars (e.g., Telford Taylor, later in his career) argue you can accept that aggressive war was already illegal (defeating Objection 1) but still condemn the trials for being one-sided (upholding Objection 2).
  *   **View B (Functional Collapse):** Some critical legal scholars argue that if the law was truly pre-existing and universal, the Allies would have prosecuted their own. Therefore, the fact that they did not proves the law *wasn't* pre-existing. In this view, the asymmetry is evidence of the retroactivity.

  **Conclusion:** They do not logically collapse. It is possible to believe the law existed but was applied selectively. However, in political rhetoric, they are often blended to strengthen the overall critique of legitimacy.

  ### 2. The Standard Reply to Retroactivity and Its Implications

  You asked about the standard reply: that the London Charter declared existing law rather than creating new law, and that the novelty was merely jurisdictional.

  **[Settled Ground]**
  *   **The Tribunal's Position:** The International Military Tribunal (IMT) at Nuremberg explicitly rejected the *nullum crimen* defense. In its judgment, it stated that the Kellogg-Briand Pact (1928) and other treaties had already rendered aggressive war illegal, and that individuals could be held responsible.
  *   **The Jurisdictional Claim:** The IMT argued that while the *substantive* law existed, there was previously no *tribunal* competent to try individuals for it. The Charter supplied the procedure, not the crime.

  **[Contested Interpretation]**
  *   **Validity of the Reply:** There is no professional consensus that the Tribunal's reasoning was legally sound.
      *   **Critics:** Many international lawyers (including at the time, such as the dissenting opinion of Justice Radhabinod Pal at Tokyo) argue that prior treaties bound *states*, not *individuals*. Criminalizing individual conduct for "waging war" was genuinely new law, making the conviction retroactive.
      *   **Defenders:** Others (like Hans Kelsen) argued that international law had evolved to the point where individual responsibility was implicit, and the Charter was a necessary enforcement mechanism.
  *   **Implication for Asymmetry:** If you accept the Tribunal's reply (that the law already existed), **you do not answer the asymmetry objection; you potentially strengthen it.**
      *   *Reasoning:* If "Crimes Against Peace" were already international law in 1939, they applied to *all* nations, including the US, UK, and USSR. If the law was pre-existing, the failure to charge Allied leaders for comparable acts (e.g., the Soviet invasion of Poland, Allied area bombing) becomes a violation of the principle of equality before the law, rather than just a complaint about new rules.
      *   **Consensus:** There is a strong consensus among historians that the retroactivity defense (Objection 1) and the asymmetry defense (Objection 2) operate on separate tracks. Successfully arguing that the law was pre-existing does not explain why only one side was prosecuted.

  ### 3. Nuremberg (London Charter) vs. Tokyo (SCAP Order)

  You asked if it matters that the Tokyo Charter was promulgated by General MacArthur (Supreme Commander for the Allied Powers) rather than via a multilateral treaty.

  **[Settled Ground]**
  *   **Procedural Fact:** The Nuremberg Charter was annexed to the London Agreement, a treaty signed by the US, UK, USSR, and France. The Tokyo Charter (IMTFE) was a special proclamation issued unilaterally by General MacArthur in his capacity as SCAP, though he consulted with the Far Eastern Commission.
  *   **Composition:** Nuremberg had one judge and one prosecutor from each of the four major powers. Tokyo had judges from 11 nations, but the prosecution was dominated by the US (Chief of Counsel Joseph Keenan), and MacArthur retained the power to review sentences and reduce them.

  **[Contested Interpretation]**
  *   **Impact on Legitimacy:**
      *   **View A:** Some scholars argue the unilateral nature of the Tokyo Charter makes the "Victors' Justice" charge more potent for Tokyo than for Nuremberg. It looked more like military occupation justice than international treaty law.
      *   **View B:** Others argue the substantive difference was negligible. The charges, rules of evidence, and rights of the accused were substantially similar. The "multilateral" nature of Nuremberg is sometimes viewed as a veneer, given that the defeated powers had no say in either charter.
  *   **Consensus:** It is uncontroversial that the Tokyo Tribunal is viewed by legal scholars as having weaker procedural legitimacy than Nuremberg due to the SCAP promulgation. However, whether this invalidates the *verdicts* remains disputed.

  ### 4. The Dönitz Case: Asymmetry or Sentencing Discretion?

  You asked about Admiral Dönitz. The defense produced affidavits from Admiral Nimitz stating the US Navy also waged unrestricted submarine warfare. The Tribunal convicted Dönitz but did not sentence him based on that specific charge.

  **[Settled Ground]**
  *   **The Fact:** The IMT Judgment explicitly states: "The sentence of Dönitz is not assessed on the ground of his breaches of the international law of submarine warfare."
  *   **The Outcome:** Dönitz was convicted on Count 1 (Conspiracy) and Count 2 (Crimes Against Peace), and sentenced to 10 years. He was not punished for the submarine warfare itself (Count 3: War Crimes), despite the evidence of US conduct.

  **[Contested Interpretation]**
  *   **Legal Concession vs. Pragmatism:**
      *   **View A (Concession):** Some interpret this as the Tribunal accepting the *tu quoque* defense. They effectively admitted that if the Allies did it, it could not be a crime for the Germans. This would be a concession to the Asymmetry Objection.
      *   **View B (Pragmatism/Discretion):** Most legal historians view this as a pragmatic avoidance of a political trap. The Tribunal likely wanted to avoid delegitimizing the trial by condemning Allied heroes (Nimitz) while judging German villains. They convicted him on other grounds (waging aggressive war) where the *tu quoque* defense was harder to apply.
      *   **View C (Customary Law):** A technical legal view suggests the Tribunal found that submarine warfare customs were unclear at the time, so they declined to punish based on that specific uncertainty, regardless of US conduct.
  *   **Consensus:** The dominant scholarly reading is **View B**. It is generally not seen as a full legal concession that "victors are exempt from the law," but rather as a specific sentencing decision to avoid the appearance of hypocrisy on a specific charge while maintaining the conviction on broader grounds. It acknowledges the asymmetry without surrendering the Tribunal's authority.

  ### 5. Summary: Where the Settled Ground Ends

  For your research paper, you can map the landscape as follows:

  | Issue | Settled Ground (Facts/Consensus) | Contested Ground (Interpretation/Debate) |
  | :--- | :--- | :--- |
  | **Distinction of Objections** | Retroactivity (Substantive) and Asymmetry (Procedural) are legally distinct concepts. | Whether they functionally amount to the same moral critique in practice. |
  | **Retroactivity Reply** | The IMT *claimed* the law was pre-existing (declaratory). | Whether that claim was legally accurate. Most modern scholars lean toward "it was retroactive." |
  | **Implication of Reply** | If the law was pre-existing, it applied to Allies too. | Whether this makes the Asymmetry objection stronger ( Allies broke existing law) or irrelevant (Politics overrides law). |
  | **Tokyo vs. Nuremberg** | Tokyo Charter was a unilateral order; Nuremberg was a treaty. | How much this difference impacts the legal validity of the verdicts. |
  | **Dönitz Sentence** | The Tribunal explicitly excluded submarine warfare from sentencing. | Whether this was a legal admission of *tu quoque* or political expediency. |

  ### Advice for Your Project

  1.  **Avoid Binary Conclusions:** Do not conclude that the trials were either "perfectly legal" or "pure victors' justice." The most respected scholarship (e.g., by Gary Jonathan Bass, *Stay the Hand of Vengeance*, or Kevin Jon Heller, *The Nuremberg Military Tribunals*) treats them as a mix of genuine legal innovation and political necessity.
  2.  **Use the Distinction:** Your strongest contribution will be using the distinction you found. You can argue: *"Even if one accepts the Tribunal's defense against retroactivity, the asymmetry objection remains unresolved."* This shows high-level critical thinking.
  3.  **Source Check:** When reading sources, check if the author is conflating the two objections. If an author says "The trials were victors' justice because they created new laws," they are focusing on Objection 1. If they say "The trials were victors' justice because no Americans were charged," they are focusing on Objection 2.

  **Final Note on "Settled" Status:**
  In international law, very little is truly "settled" regarding the Nuremberg precedents because the trials themselves *created* the modern field. Be careful to attribute claims to specific scholars or the Tribunal itself, rather than stating them as universal truths. For example, instead of saying "Aggressive war was illegal," say "The Tribunal ruled that aggressive war was already illegal."
