      *   *Instrumentalism:* Addressed (PAF/Cluster RCT issues).
      *   *Rival Accounts:* Addressed (Methodological Individualism).
      *   *Underdetermination:* Addressed (What's load-bearing).
      *   *Concrete Changes:* Addressed (Textbooks, Design, Policy).

