answer: |-
  The framing is not a trap, but the load-bearing beam is not his metaphysics alone; it is his theory of *assertoric practice*. Dummett's anti-realism ties truth to our capacity to recognize it, which makes opaque bureaucracy not just unfair, but semantically incoherent. Here is the reconstruction.

  1.  **Reading B is correct; Reading A is a category error.** (b) Reading A assumes anti-realism implies "truth is whatever the procedure says." This contradicts Dummett's core constraint: warrant must be *manifestable*. (a) For Dummett, understanding a concept (like "refugee") is a practical ability to recognize when evidence warrants asserting it. (a) If a system denies claims via opaque scores where the causal drivers are hidden even from the officer, it destroys the community's capacity to recognize warranted cases. (b) A procedure that severs the link between evidence and outcome doesn't track the concept; it abolishes the practice that gives the word meaning. (b) Dummett would argue that a refusal without intelligible reasons is not a false judgment, but a non-judgment—it lacks assertoric content.

  2.  **The Fregean objection to machine refusal is robust.** (b) Dummett inherited from Frege the view that judgment involves taking responsibility for a thought's truth. (a) An algorithm outputs a score; it does not assert. (b) When a state issues a refusal based on a model it cannot audit, no human has taken responsibility for the truth of the premises. (b) This renders the decision linguistically void. It is not that the machine is biased; it is that the machine cannot *judge*. (b) Dummett would insist that a valid decision requires an agent who can explain *why* the evidence warrants the conclusion, because that explanation is constitutive of the judgment itself.

  3.  **He would not ban automation, but would demand "auditability as a condition of meaning."** (b) Dummett designed voting systems (quota Borda count) because he believed mechanisms must faithfully translate input into outcome. (a) He was not anti-mechanism; he was anti-distortion. (b) Applied to borders, a legitimate automated pre-screen must be fully transparent: the weights, the training data, and the logic must be public property. (b) If the vendor claims IP protection over the logic, the mechanism is illegitimate, not because it might be wrong, but because it prevents the public from understanding the rule they are living under. (b) He would likely demand a "default-allow" architecture for screening, where the machine flags for review rather than refusing, preserving the human's capacity to recognize warrant.

  4.  **Third-country schemes violate his burden-of-proof principle.** (a) In *On Immigration and Refugees*, Dummett argued the burden lies on the state to justify exclusion, not on the outsider to prove entitlement. (a) He posited a presumption in favour of admission. (b) Rwanda-style schemes invert this: they make admission physically impossible unless the state permits access to the territory. (b) By externalizing the border, the state avoids the burden of justification entirely. (b) Dummett would view this as a moral evasion disguised as legal compliance. (b) Since the refugee convention relies on being *outside* one's country to claim protection, preventing arrival destroys the condition under which the concept "refugee" becomes assertible.

  5.  **On "climate refugees," he would prioritize moral necessity over conceptual purity.** (b) Dummett defended the distinction between economic migrants and refugees based on persecution. (a) However, his anti-realism allows concepts to evolve as our recognition capacities change. (b) He would likely argue that if climate destruction renders a state unable to protect its citizens, the functional equivalent of persecution exists. (b) He would accept the category if it preserves the moral core of the practice: protecting those who cannot be protected at home. (b) Rejecting the category because it stretches the 1951 definition would be, for him, a fetishism of rules over the human reality they govern.

  6.  **A painful concession: He accepted capacity limits, not just moral ones.** (a) Dummett was not an open-border anarchist; he acknowledged states have a right to manage population density and infrastructure. (a) His restriction was on the *grounds* of exclusion (race, origin) rather than the *fact* of exclusion. (b) A Dummettian sympathizer must admit he would accept automated screening if it were purely logistical (e.g., verifying passport validity) and non-discriminatory. (b) The pain point is admitting that even a perfectly fair, transparent algorithm could legitimately refuse entry if the state proves that admission would collapse essential services. (b) This concedes ground to restrictionists: automation is permissible if it serves capacity management, provided it never masks a moral judgment as a technical constraint.

  7.  **Conclusion:** Dummett's philosophy bites hardest on the *opacity* of the system, not just its outcomes. (b) He would argue that a border regime cannot claim to decide "truths" about refugee status if it hides the criteria for those truths. (b) The automation of border decisions, as currently practiced, is not just unjust; it is a dissolution of the language game of asylum. (b) To restore meaning, the state must reclaim the responsibility of assertion, making the logic of refusal public property. (b) Without that, the border is not a judge; it is a force of nature, and you cannot appeal to a force of nature.
