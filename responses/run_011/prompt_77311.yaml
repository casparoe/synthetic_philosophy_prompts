answer: |-
  **The Architecture of Must**

  The office of Aeterna Consultancies smelled of ozone and toner, a sterile scent that clung to the back of the throat. We sold the subjunctive mood. We sold it by the hour, by the page, by the degree of certainty. Our clients were insurers who needed to know if a flood was an Act of God or a failure of levee maintenance, and they were the bereaved who needed to know if a different turn at a different light would have kept their sons alive. We provided the narratives of *might* and *could*. We constructed the ghost worlds where the brake pads held, where the diagnosis came early, where the bolt was tightened.

  I was a Senior Analyst, Level Four. My job was to sign off on the reports before they went to print. For three years, I had signed off on thousands of variations of *could have been*. Then, two springs ago, I attended a workshop in a conference center outside Zurich. I was there for the logic, not the theology, but the theology had leaked into the axioms. On the projector screen, a proof assistant had run a derivation. It took seconds. A green checkmark appeared next to the conclusion: *Therefore, a God-like being exists necessarily.*

  But it was the footnote, the corollary whispered during the coffee break, that had followed me home. The axioms required for that checkmark—the definition of positive properties, the assertion that necessary existence is itself positive, the rigidity of essence across modal space—did not just prove God. They proved that everything true is necessarily true. They collapsed the distance between *is* and *must be*. If the proof held, there were no ghost worlds. There was only the actual world, standing alone, rigid and unalterable. The subjunctive mood was a grammatical error.

  I sat at my desk, the glow of the monitor illuminating the case file for Client 8940. Mrs. Gable. Her daughter, Elise, had died during a routine appendectomy. An anesthesiologist had administered a dosage that triggered a rare allergic reaction. The family wanted a report stating that had the doctor checked the updated registry, Elise would be alive. The insurance company wanted a report stating the reaction was unforeseeable. We were hired to find the truth of the *counterfactual*.

  I opened the document template. The cursor blinked in the field labeled *Causal Alternative*.

  *Had the physician accessed the registry…*

  My fingers hovered. The logic pressed against the inside of my skull, a physical weight. It wasn't a belief; it was a structural integrity issue. If the axioms held, the physician's access to the registry was not a variable. It was a fixed point in a necessary sequence. The property of "checking the registry" was either positive or it was not. If it was positive, it was necessarily instantiated by a perfect being, and thus necessarily part of the causal chain of the best possible world. If it was not positive, its absence was necessary.

  There was no branch in the road. There was only the road.

  I deleted the sentence. I typed: *The physician did not access the registry.*

  I stared at the screen. The blinking cursor was a heartbeat in a body that had no pulse. I could feel the deformity of my work. For years, I had built bridges between what happened and what might have happened. Now I knew the bridges led nowhere. They spanned a void that didn't exist.

  "Elias?"

  I turned. Sarah stood in the doorway of my cubicle. She was a Junior Analyst, bright-eyed, still believing in the product. She held a mug of coffee that smelled of hazelnut and denial.

  "Are you coming to the review?" she asked. "The Henderson case. We need to decide on the probability weighting for the structural failure."

  "In a minute," I said.

  "You look tired," she said, stepping inside. She leaned against the partition. "You know, I was thinking about the Henderson beam. If they had used the higher-grade steel, the load bearing would have held. It's clear in the simulation."

  I looked at her. I wanted to protect her. I wanted to let her live in the garden of forking paths. But the checkmark was behind my eyes.

  "Sarah," I said. My voice sounded flat, drained of the modulation we used with clients. "They didn't use the higher-grade steel."

  "I know," she said, smiling gently. "But in the counterfactual model—"

  "There is no model," I said. "There is only the derivation."

  She frowned, the smile faltering. "It's just a figure of speech, Elias. We sell the *what if*."

  "We sell fiction," I said. "We sell comfort."

  "We sell liability assessment," she corrected, her voice tightening. "If we don't establish what could have been done differently, the insurers can't adjust their premiums. They can't mitigate risk. If everything is just… what happened… then there's no risk management. There's just fate."

  "Not fate," I said. "Necessity."

  She shook her head, pushing off the partition. "Come to the review. Try to leave the metaphysics in Zurich."

  She left. I sat alone with the silence of the office. She had touched on the cost, though she didn't know it. Risk management requires contingency. You cannot mitigate a risk that was never a risk. You cannot blame a man for a choice he could not have failed to make. Blame requires the possibility of failure. If the axioms held, blame was a category error. Guilt was a hallucination.

  I stood up and walked to the window. The city outside was gray, rain streaking the glass. A traffic light changed from red to green. Cars moved. Pedestrians crossed. I watched a woman stumble on the wet pavement. She caught herself.

  *She could have fallen,* I thought.

  The thought felt like a lie. She did not fall. Therefore, in the architecture of reality, she could not have fallen. Her balance, the friction of the shoe, the coefficient of the wet concrete, the neural firing in her cerebellum—it was all a single, locked equation. To say she *could* have fallen was to imply a world that did not exist. It was to mourn a ghost.

  I felt a sudden, sharp grief for the woman. Not for her stumble, but for her freedom. She thought she had caught herself. She thought she had made a save. She didn't know she was merely playing out a line of code written in the substance of being.

  I went to the review room. Six analysts sat around a table covered in schematics of a collapsed warehouse. The Henderson case. A wind shear had taken the roof.

  "We're stuck on the maintenance log," said David, the team lead. He tapped a pen against the table. "The client wants us to say that had the inspection been done weekly instead of monthly, the corrosion would have been caught."

  "And was it?" I asked.

  "Physically? No," David said. "But probabilistically? The corrosion rate suggests a eighty percent chance of detection under weekly protocols."

  "Probability is epistemic," I said. I sat down. The chair creaked. "It describes our ignorance, not the world."

  David looked at me. "Elias, we write the reports. We define the standard of care. If we say it was impossible to catch, the family gets nothing. If we say it was possible, the insurance pays."

  "If we say it was possible, we lie," I said.

  "We say it was *contingently* possible," David said. "Given the laws of physics and the state of the world at time T-minus-one…"

  "There are no other states of the world at T-minus-one," I said. "There is only the state that obtained."

  The room went quiet. The hum of the projector fan seemed to grow louder.

  "Are you refusing to sign the report?" David asked.

  "I am refusing to validate a falsehood," I said.

  "It's not a falsehood," Sarah said from the corner. "It's a tool. We help people navigate regret. If a mother believes she could have saved her child, she needs to know if that's true. Not… not in some logical absolute. But in the world where she lives."

  "She lives in the only world there is," I said.

  "That's not helpful," David said. His voice was hard now. "That's not what we do here. We sell the subjunctive. If you can't do that, you're in the wrong business."

  "I know," I said.

  "Then what do you propose?"

  "I propose we write the actuality report," I said. "We detail the chain of causation. We state that given the initial conditions and the laws of nature, the outcome was determined."

  "Negligence is not determined," David said. "Negligence is a failure to meet a standard. It implies you *could* have met it."

  "Could is the error," I said.

  David stood up. "Take the day, Elias. Go home. Sleep. Come back tomorrow and write the report according to the template. Or don't come back."

  I stood up. I didn't feel angry. I felt light. The gravity of the office, the weight of the pretend choices, had lifted. I walked out of the room.

  I went to my desk and packed my bag. I took the case file for Mrs. Gable. I wasn't going to leave it. It was evidence.

  I took the train home. The carriage was half-empty. A man across from me was on his phone, typing rapidly. He stopped, looked out the window, and sighed. He turned to the woman next to him, his wife perhaps.

  "I should have called her," he said.

  The words hung in the air. *Should have.* The grammar of regret. The syntax of a world that isn't there.

  I looked at him. I wanted to tell him. I wanted to explain that the call was not made because it was not positive. Or because it was not part of the essence of the moment. I wanted to tell him that his guilt was a mathematical impossibility.

  But I remembered the second remark from the workshop. The one I had tried to bury. Years later, a higher-order automated prover had found the axiom set inconsistent. If the axioms are inconsistent, then *anything* follows. Every statement is true. Every contradiction is true. The checkmark wasn't a proof of necessity; it was a proof of explosion.

  If that was true, then the man *did* call her. And he *didn't* call her. The report was written. And it wasn't. The insurance paid. And it didn't.

  I closed my eyes. The inconsistency was a deeper horror than the collapse. The collapse gave us a prison of steel. The inconsistency gave us a prison of smoke. But I couldn't live in the smoke. I needed the steel. I needed the necessity. Even if it was built on a flaw, it was the only structure that kept the chaos at bay.

  I opened my eyes. The man was still looking at his wife.

  "I could have saved us the trouble," he said.

  I leaned forward. I couldn't stop myself.

  "No," I said.

  He looked at me, startled. "Excuse me?"

  "You couldn't have," I said.

  His face hardened. "You don't know what I could have done."

  "I know what is possible," I said. "Only what happened was possible."

  "Who are you?" the wife asked, pulling her coat tighter.

  "Someone who knows the cost," I said.

  "Of what?" the man asked.

  "Of the words you're using," I said. "You're speaking about ghosts. You're mourning paths that were never there."

  "That's insane," the man said. He turned away from me, shielding his wife with his body. "Don't talk to us."

  I sat back. The train rattled over the tracks. The sound was rhythmic, inevitable. Click-clack. Click-clack. There was no other sound the train could make. There was no other track it could take.

  I arrived at my apartment. It was quiet. My wife, Lena, was in the kitchen. She was chopping vegetables. The knife hit the board with a steady thud.

  "You're home early," she said. She didn't turn around.

  "I lost my job," I said.

  She stopped chopping. She turned. Her face was pale. "Elias. What happened?"

  "I told the truth," I said.

  "About the cases?"

  "About the world."

  She put the knife down. She wiped her hands on her apron. "You've been different since Zurich. You don't… you don't talk about the future anymore. You don't say *we'll see*. You say *we will see*."

  "Because we will," I said.

  "You can't know that," she said. "Things change. Plans change."

  "Plans don't change," I said. "Only our knowledge of them does."

  She walked over to me. She took my hands. Her hands were warm. Real. "Elias. I was thinking… maybe we could go away next month. To the coast. If the weather holds."

  I felt the trap snap shut. *If.* *Could.* *Maybe.*

  "Lena," I said. "We won't go to the coast."

  "Why not? Do you not want to?"

  "I want to," I said. "But we won't."

  "How do you know?"

  "Because we didn't," I said.

  "We haven't yet."

  "We won't," I said. "Something will happen. The car will break. You will get sick. The work will call. It is necessary that we do not go."

  "That's fatalism," she said, her voice trembling. "That's not love. Love is choosing. Love is saying *I will be there*."

  "I will be there," I said. "Because I must."

  "That's not enough," she said. She let go of my hands. "I need you to say you *might* stay. I need to know you could leave, and you choose not to."

  "I cannot leave," I said. "There is no world where I leave."

  "Then you're a robot," she said. Tears welled in her eyes. "You're just… running a script."

  "I am consistent," I said.

  She turned away. She went back to the vegetables. She picked up the knife. She began to chop again. Harder this time. The rhythm was broken. Thud. Thud-thud. Thud.

  "I might make dinner," she said. Her voice was tight. "Or I might not."

  I watched her. I saw the struggle in her shoulders. She was trying to assert the subjunctive. She was trying to carve out a space of freedom in the kitchen.

  "You will make dinner," I said.

  "We'll see," she said.

  I went to the study. I sat at my desk. I opened the case file for Mrs. Gable. I had to finish it. Even if I was fired, the work existed. The truth existed.

  I opened a new document. I titled it *Actuality Report 8940*.

  I began to type.

  *The physician administered the dosage. The reaction occurred. The patient died. There was no alternative dosage that was accessible. There was no alternative decision that was possible. The event was not a failure of care. It was a instantiation of the necessary.*

  I paused. The words looked cold. They looked like cruelty. But they were the only kindness left. To tell Mrs. Gable that she could have saved her daughter was to give her a burden she could not carry. It was to tell her she had failed. If I told her it was necessary, I absolved her. I absolved the doctor. I absolved the world.

  But I also took away her hope. Hope lives in the *might*. Hope is the belief that the next world can be better than this one. If there is no next world, if there is only this one, stretched out eternally in the logic of God, then hope is just ignorance.

  I heard Lena crying in the kitchen. The sound was thin, sharp.

  I continued typing.

  *Regret is a function of incomplete information. Given complete information, regret dissolves. The client is advised to update their information set.*

  I stopped. That was too clinical. That was the voice of the consultancy. I needed the voice of the logic.

  I thought about the inconsistency again. The prover that found the contradiction. If the system was inconsistent, then *this report is false* was also true. *Mrs. Gable's daughter is alive* was also true.

  If I leaned into the inconsistency, I could give them everything. I could give them the life they lost. I could give them the money the insurers withheld. I could give them the forgiveness they needed. In an inconsistent system, every statement is provable. I could write a report that said the doctor was negligent and the doctor was innocent. I could say the girl lived and the girl died.

  It would be the ultimate service. The ultimate counterfactual. I could sell them a world where everything was fixed, because in an inconsistent world, everything is already fixed and broken simultaneously.

  But that was madness. That was noise. The collapse was clean. The collapse was hard, but it was solid.

  I deleted the paragraph about incomplete information.

  I typed: *There is no other way.*

  I saved the file. I printed it. The printer whirred, spitting out the paper. It was warm when I picked it up.

  I walked into the kitchen. Lena was sitting at the table. The vegetables were chopped, but untouched. She was looking at her hands.

  I placed the paper on the table in front of her.

  "What is this?" she asked. She didn't look up.

  "My report," I said.

  "On us?"

  "On everything," I said.

  She looked at the paper. She read the first line. *There is no other way.*

  She stood up. She pushed the chair back. It scraped against the floor, a harsh, necessary sound.

  "You can't live like this," she said. "You can't love like this."

  "I am loving you," I said. "I am here. I am not anywhere else. I cannot be anywhere else."

  "That's not love," she said. "That's physics."

  "It's logic," I said.

  She walked past me. She went to the bedroom. I heard the door close. It didn't slam. It clicked. A latch engaging. A state change.

  I stood in the kitchen. The rain was still falling outside. I could hear it against the window. I walked over and looked out. The streetlights reflected on the wet asphalt. A car drove by. It splashed water.

  I thought about the man on the train. *I should have called her.*

  I thought about Mrs. Gable. *Had the doctor checked.*

  I thought about Lena. *We could go to the coast.*

  All of them were speaking a language that had no referent. They were mapping a terrain that had been flattened. I was the only one who saw the flat earth. I was the only one who knew that the horizon was a line drawn by a proof.

  I went back to the study. I sat down. I opened the console on my computer. I typed in the command line. I loaded the proof assistant. I loaded the axioms.

  *Axiom 1: If a property is positive, its negation is not positive.*
  *Axiom 2: If a property is positive, it is necessarily positive.*
  *Definition 1: A God-like being possesses all positive properties.*
  *Definition 2: An essence of an individual is a property possessed by that individual which entails all other properties of that individual.*
  *Axiom 3: Necessary existence is a positive property.*

  I ran the prover.

  The screen scrolled. Lines of code cascaded like rain. The logic chugged, grinding the symbols against each other. It was searching for the checkmark. It was searching for the lock.

  I watched the progress bar. It moved slowly. 40 percent. 60 percent.

  I thought about the inconsistency. I thought about the workshop presenter, her voice casual as she mentioned that the system might explode. *In principle anything whatsoever follows from it.*

  If it exploded, I could write a report for Lena. *I might stay.* True. *I might leave.* True. *We will go to the coast.* True. *We will not go.* True.

  I could give her the freedom she wanted. I could give her the contingency. I could make the subjunctive real by making everything real.

  The progress bar hit 90 percent.

  I hovered my finger over the enter key. I could interrupt the process. I could introduce a contradiction. I could break the necessity. I could save my marriage by destroying the truth.

  But if I broke the truth, what was I? A salesman of lies. That was what I was before. Was it better to be a salesman of lies than a prophet of necessity?

  The bar hit 100 percent.

  The screen paused. The fan spun up.

  A symbol appeared.

  It was not a green checkmark.

  It was a red question mark. Then, text scrolled below it. *Consistency check failed. Derivation trivial.*

  The system had found the inconsistency. The axioms contradicted. The proof was valid, but the foundation was rot. Everything was true. Nothing was true.

  I stared at the screen. The collapse was gone. The steel prison had turned to smoke.

  I looked at the report on the desk. *There is no other way.*

  It was true. And it was false.

  I stood up. I walked to the kitchen. I picked up the report. I walked to the sink. I turned on the tap. The water roared.

  I held the paper under the stream. The ink ran. The words *no other way* blurred into gray sludge. The paper softened, disintegrated. I watched the logic dissolve into the drain.

  I turned off the tap. The silence returned.

  I walked to the bedroom door. I knocked.

  "Lena," I said.

  No answer.

  "I might come in," I said.

  I waited. The words hung in the air. They were fragile. They were false. They were all I had.

  "I might stay," I said to the door. "I might go."

  I turned the handle. The door was unlocked. I pushed it open.

  She was sitting on the bed. She was looking at me. Her eyes were red.

  "I heard the water," she said.

  "I washed the report," I said.

  "Why?"

  "Because it was wrong," I said.

  "Which part?"

  "All of it," I said. "And none of it."

  She patted the space on the bed next to her.

  "Come here," she said.

  I walked over. I sat down. The mattress sank under my weight.

  "Did you fix it?" she asked.

  "No," I said. "I broke it."

  "Is it better?"

  "I don't know," I said. "But I can say *I hope* now."

  "Say it," she said.

  "I hope we go to the coast," I said.

  It was a lie. Or it was a truth. In the inconsistency, it was both. But it felt like hope. It felt like the subjunctive. It felt like a world where things could be otherwise, even if they weren't.

  She leaned her head on my shoulder.

  "Me too," she said.

  We sat there. The rain continued outside. It fell because it had to. Or because it didn't. I listened to the rhythm. It sounded like a clock ticking down. Or a clock ticking up.

  I closed my eyes. I imagined the coast. I imagined the sun. I imagined us walking on the sand. I knew it might not happen. I knew it might. The uncertainty was a weight, but it was a weight I could carry. It was the weight of being human.

  "I love you," I said.

  "I know," she said.

  "I might say it again," I said.

  "Say it," she said.

  "I love you," I said.

  The words landed. They stayed. They were not necessary. They were just true. For now.
