answer: |-
  Dear friend,

  It is a privilege to be spoken to so plainly about a matter that weighs so heavily on your family. I understand why you feel stuck between these two positions. You are a man who spent a career building instruments to measure things that are inherently difficult to measure, clouds and atmospheres that shift and change, and now you are watching your family try to measure something even more elusive, which is the moral weight of a life taken from thirty feet away versus thirty hundred miles away. You asked for honesty rather than comfort, and you asked me to come down somewhere at the end, so I will do my best to be clear.

  To understand where your brother Frank is coming from, you have to look at what he is trying to protect. His position is what philosophers call the moral equality of combatants. It is the idea that once war has begun, the soldier in the trench and the soldier in the opposing trench are moral equals. Both are permitted to kill the other, and neither is a murderer, because they are both instruments of their respective states. Frank holds this view not because he is unfeeling, but because he is afraid. He is afraid of the alternative. If we say that only soldiers fighting for a just cause are permitted to kill, then every soldier on the losing side becomes a potential criminal. If the war is judged unjust after the fact, then every bullet fired by the losers was a murder. Frank knows that wars are messy and political causes are rarely clear to the man holding the rifle, so he draws a circle around the soldier and says nothing inside this circle is your fault. He is trying to save the soldier from the sin of the state. In the context of the twentieth century, where men stood in lines or hid in foxholes and died by the thousands, this was a necessary rule. It kept war from becoming a global police action where the victors hang the vanquished.

  But your daughter Kate is pointing out that the instrument Frank is using to measure this morality is no longer calibrated for the terrain she was walking. Her objection is not sentimental. She is correct that the traditional rule relies on a symmetry of risk. In the old model, the license to kill was granted because both sides submitted themselves to the possibility of being killed. It was a tragic pact. I kill you because you are trying to kill me, and we both accepted this danger when we put on the uniform. Kate says that pact was broken when she sat in a trailer in Nevada. She was never in any danger from the men she killed. They could not shoot back. They could not reach her. When you remove the mutual risk, you remove the primary justification for the license to kill. It is not just a difference in distance, like using a bow instead of a spear. With a bow, you are still on the field. You can be charged. You can be overrun. With a drone, you are in a different category of existence relative to the battlefield. You are an observer who becomes an executioner without ever entering the community of risk. So to answer your first question, Kate is not attacking a straw version of Frank's rule. She is correctly identifying that the rule was built on a foundation of mutual vulnerability, and that foundation is absent in her work.

  This leads to the second thing, the three men on the roof. Here I think Frank's rule fails completely, and not just because of the drone. Frank says they were armed men in a war zone, and that is the end of it. But Kate's doubt goes to the heart of what makes a person a legitimate target. In the old ethics, being a soldier made you a target. But even in traditional ethics, you are only a target because you are a threat. If those three men were guarding the compound against a different group, men who were not your daughter's enemies, then they were not a threat to her side. They were armed, yes, but not against her. Frank's rule treats all armed men as identical pieces on a chessboard, but Kate is seeing them as human beings with specific intentions. If they were not aiming at her side, killing them was not an act of war between combatants. It was closer to putting down a dangerous animal than fighting an enemy soldier. Her discomfort there is not a weakness. It is a sign that her moral compass is working better than the rulebook she was given. Frank's rule is too coarse for that situation. It sweeps away the nuance of who is actually threatening whom.

  You asked whether we can keep the part of Frank's position that protects soldiers from political judgment without accepting the part that makes those three men disappear. I believe we can, but it requires shifting where we place the burden. We should not judge Kate on whether the war itself was just. She could not know that, and she should not be held responsible for the decisions of politicians. That is Frank's right point. However, we must judge the specific act of killing based on the immediate threat and the necessity of the action. Kate can be innocent of starting the war but still be troubled by a specific strike that did not meet the criteria of necessary defense. The solution is not to call her a murderer, but to acknowledge that the old rule is broken. We cannot say she had the same moral status as a soldier in a foxhole, because she did not. We have to admit that remote warfare creates a moral asymmetry that the old laws do not cover.

  So I will come down where you asked me to. Kate is right, and Frank is wrong, though Frank is wrong for honorable reasons. He is trying to protect soldiers from being scapegoated, but in doing so, he is asking them to suppress a valid moral intuition. The rule he defends was designed for a world where killing required presence and risk. That world is gone. When you kill from a place of absolute safety, the justification must be higher, not lower. The fact that she was safe makes the decision to kill more serious, because there was no urgency of self-defense to cloud her judgment. She had time to think, and she did think, and that is why she is troubled.

  As for the difference in kind versus degree, it is a difference in kind. Physics teaches us that at certain thresholds, quantities become qualities. Water heats up by degrees until it hits a hundred degrees and becomes steam. Remote warfare has hit that threshold. It is not just killing from far away. It is killing without sharing the condition of the battlefield. It turns war into a management task rather than a conflict. This does not mean your daughter is a criminal. It means the institution she served is using an outdated moral map for new territory. Her unease is not a symptom of weakness or sentimentality. It is the correct response of a moral agent realizing that the tool she was given does not fit the job. You should tell her that her doubt is not a flaw in her character, but a sign that her character is intact despite the rules she was asked to follow. Frank wants her to stop picking at it because he fears what happens if the rule breaks. But the rule is already broken, and only by acknowledging that can we hope to fix it.

  I hope this helps you find your footing. You have spent a life looking down at clouds knowing they are real even if they are hard to hold. This is the same. The moral reality is there, even if the old rules say it isn't.

  Yours sincerely,

  A Friend
