      *Refining the Diagnosis:* The argument fails at **(6)** because it conflates *linguistic labeling* with *conceptual content*. Nyāya argues *savikalpaka pratyakṣa* (determinate perception) involves a relation between a particular and a universal. The universal is perceived (*jñāna-lakṣaṇa* or ordinary *sannikarṣa*). Language is not the *source* of the concept, but the *expressor*.
