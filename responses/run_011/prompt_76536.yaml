answer: |-
  The metaphysics of dispositions concerns properties like fragility, solubility, and flammability. Traditionally, philosophers have sought to analyze these dispositions using conditional statements: to say a vase is fragile is to say that if it were struck, it would break. This simple conditional analysis faces famous counterexamples involving interferers. To understand the case of Lazarite, a hypothetical self-healing glass, we must first navigate the standard taxonomy of these interferers. We must distinguish the **stimulus** (the trigger condition, such as being struck), the **manifestation** (the resulting effect, such as breaking), and the **basis** (the underlying physical property grounding the disposition, such as molecular bonding). We must also understand a **mask** (something that prevents the manifestation despite the disposition being present).

  Lazarite presents a unique challenge. It is ordinary soda-lime glass equipped with an intrinsic mechanism: when a crack tip advances, the surrounding material undergoes a phase change that absorbs strain energy and welds the crack shut. This healing is finite; each event consumes a portion of the material's reserve. Once depleted, the object becomes ordinary fragile glass. Crucially, while the reserve lasts, no impact the vase can actually receive will break it, though impacts will initiate cracks that immediately heal. The question is whether Lazarite fits existing categories or demands a new metaphysics.

  ### Taxonomy of the Interferer

  Standard counterexamples to the conditional analysis usually involve extrinsic interferers. A **fink** is a mechanism that removes the disposition upon the arrival of the stimulus; a fragile vase wired to an electro-fink becomes non-fragile the moment it is struck. A **mimic** is an object that lacks the disposition but manifests the effect anyway, perhaps due to an external explosion. A **mask** leaves the disposition intact but prevents the manifestation, like wrapping a fragile vase in foam.

  Lazarite does not fit neatly into these boxes. It is not a mimic, because the healing is real and prevents the break. It is not a standard fink, because the underlying basis for fragility—the brittle bonding structure—remains intact during the healing process; the object does not lose its fragility, but rather counteracts it. It resembles a mask, but with a critical difference: the mask is intrinsic and consuming. In standard cases, a mask is an external addition or a stable internal feature. In Lazarite, the interferer is part of what the object *is*, and it depletes with use. This makes Lazarite a "consuming mask." The manifestation is initiated and then truncated rather than blocked outright, and each strike permanently alters the very basis we are trying to describe. This dynamic nature is where the conditional analysis begins to fray, as the object's disposition changes simply by being tested.

  ### Lewis's Reformed Conditional Analysis

  David Lewis proposed a reformed conditional analysis to handle finks and masks. Roughly, an object has a disposition when it, or an intrinsic duplicate of it in the same circumstances and with no extrinsic interferers at work, would manifest in the stimulus conditions. This reformulation attempts to isolate the intrinsic basis of the disposition from external noise.

  However, Lazarite exposes a limitation in this reformed account. Lewis's analysis relies on the ability to separate the disposition's basis from extrinsic interferers. In the case of Lazarite, the interferer is intrinsic and inseparable. It is not a coating or an external field; it is the material's own structure. If we ask whether a fresh Lazarite vase is fragile, Lewis's analysis asks us to consider an intrinsic duplicate in the same circumstances. But the "circumstances" include the intrinsic healing mechanism. If we hold the mechanism fixed, the vase does not break. If we remove the mechanism to test the fragility basis, we are no longer considering an intrinsic duplicate of Lazarite; we are considering ordinary glass.

  Consequently, the analysis delivers an ambiguous verdict. If the healing mechanism counts as part of the circumstances, the vase is not fragile. If it counts as part of the basis, the vase is fragile but masked. This ambiguity is not merely terminological; it reveals a cost to the analysis. It suggests that dispositions cannot be cleanly separated into intrinsic properties and extrinsic circumstances when the object's internal structure is dynamically responsive. The verdict shows that if we insist on a conditional analysis, we must abandon the intuition that dispositions are purely intrinsic properties. The fragility of Lazarite depends on the state of its reserve, which is a historical feature, not just a current structural one.

  ### The Depleted Twin and History Dependence

  This leads to the problem of the depleted twin. Consider two vases: one fresh, with a full reserve of healing capacity, and one depleted, having absorbed ten thousand failed crackings. Microstructurally, once the reserve is gone, the depleted vase is indistinguishable from ordinary fragile glass. The fresh vase, however, will not break under impacts that would shatter the depleted twin. Do they differ in fragility?

  Intuitively, yes. The depleted twin is fragile; the fresh twin is not. But this difference is not found in a static snapshot of their bonding structures, which are nearly identical aside from the remaining reserve. The difference lies in their history of being tested. The fresh vase has not yet consumed its reserve; the depleted vase has. This makes the attribution of fragility history-dependent. In ordinary cases, testing a disposition reveals a pre-existing state. In Lazarite, testing for fragility consumes the very property that determines the outcome. Testing looks self-defeating in a way the ordinary case does not.

  This history dependence creates a severe problem for reductive accounts. A conditional analysis typically seeks to ground dispositions in the current state of the object. If the truth of the conditional "if struck, it would break" depends on how many times the object has been struck in the past, the analysis becomes circular or infinitely regressive. We cannot define the disposition without referencing the history of the stimulus, but the history is just a record of past stimuli. The depleted twin case shows that two objects can be intrinsically similar in their bonding yet differ in disposition because one has "used up" its safety mechanism. This suggests that the disposition is not a simple property of the object at a time, but a trajectory of its causal powers.

  ### Adjudicating the Controversy

  This brings us to the central controversy: do cases like Lazarite show that the conditional-analysis project is unrecoverable, favoring a powers-first metaphysics, or only that a naive version failed? A powers-first metaphysics treats dispositions as irreducible causal powers inherent in objects, rather than reducing them to conditional statements.

  I argue that Lazarite shows the conditional-analysis project is **unrecoverable as a reductive endeavor**, and we should adopt a powers-first ontology. The conditional analysis aims to explain dispositions in terms of something else—counterfactual conditionals. But Lazarite demonstrates that the truth conditions of these counterfactuals are themselves dependent on the dynamic causal structure of the object. To fix the analysis, one must appeal to the very causal powers (the healing reserve, the brittle bonding) that the analysis was supposed to reduce. If we must cite the object's causal powers to determine whether the conditional is true, we have not reduced dispositions to conditionals; we have reduced conditionals to dispositions.

  The strongest objection to this verdict is that powers are ontologically extravagant and obscure. Critics argue that positing irreducible powers adds mysterious entities to our worldview, whereas conditionals are clear and logical. They might claim that a sufficiently complex conditional analysis, perhaps one that includes historical variables, could still save the reductive project.

  However, this objection misunderstands the nature of the obscurity. The conditional analysis is only clear when the world is static. In a dynamic world like Lazarite, the conditionals become convoluted, requiring clauses about intrinsic consuming masks and historical reserves. This complexity does not eliminate mystery; it hides it in the semantics of the counterfactuals. A powers-first view is not more obscure; it is more honest. It acknowledges that objects have causal structures that evolve over time. To say Lazarite has a "healing power" that depletes is no more mysterious than saying it satisfies a conditional that changes truth value upon testing. The powers view accommodates the history dependence naturally: the power is literally used up. The conditional view must treat this as a logical puzzle.

  Therefore, the verdict is that the reductive project fails. Lazarite is not merely a tricky case for a naive analysis; it is a demonstration that dispositions are fundamental features of reality that ground the truth of conditionals, not vice versa. The conditional analysis can survive only as a description of how powers manifest, not as an explanation of what powers are. We should treat dispositions as irreducible. To do otherwise is to force a static logical framework onto a dynamic causal world, resulting in an account that is either false or trivial. The Lazarite vase does not break, not because the conditional is false, but because its causal power to break is counteracted by its causal power to heal. Recognizing this interaction requires a metaphysics of powers, not just a logic of conditionals.
