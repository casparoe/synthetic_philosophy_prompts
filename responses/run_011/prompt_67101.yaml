answer: |-
  Your hypothesis is essentially correct, but the modellers have provided the formal machinery to explain why it is correct and why the stalemate persists. This is not merely a disagreement about historical facts or even methodologies, but a category error rooted in an equivocation on the metric of similarity between possible worlds. The contingentists are asking about the stability of a specific trajectory through state space, while the structuralists are asking about the stability of an attractor or outcome-class, and because neither side has explicitly defined the grain of description or the measure over perturbations, they are talking past one another while believing they are contradicting one another. The modellers are right to point out that a system can be chaotic at one scale and robust at another, so the claim that history is contingent is only meaningful relative to a specified level of coarse-graining and a defined distance metric for counterfactual deviations.

  The reason this diagnosis fits the evidence you described is that each camp's preferred examples reveal their implicit commitment to a different level of abstraction. When the contingentists point to a washed-out bridge or a king's death, they are identifying bifurcation points where the token identity of the historical sequence hangs in the balance. For them, the outcome is the specific sequence of events that led to the present, and any deviation that alters that sequence counts as a different outcome. When the structuralists point to demography or energy constraints, they are defining the outcome as a macro-state, such as industrialization or imperial collapse, where the specific names and dates are irrelevant variables. They are arguing that the system lies within a basin of attraction that funnels diverse micro-trajectories toward the same macro-state. Because neither side has acknowledged that they are measuring distance in different metrics, the contingentists hear the structuralists as denying the reality of the bridge washing out, while the structuralists hear the contingentists as denying the reality of demographic pressure, when in fact both are real but operate at different descriptive levels.

  The modellers intervention about the measure over counterfactual perturbations is the critical key here because it exposes the hidden assumption in the contingentist argument. When a contingentist says a outcome could easily have turned out differently, they are implicitly holding the rest of the world fixed while changing one small variable, but in a sensitive system, that specific counterfactual state might not be nearby in the relevant state space at all. If the measure of similarity weights structural variables heavily, then a world with a different king but the same demography is very close to the actual world, supporting the structuralists. If the measure weights event sequences heavily, then that same world is very far away, supporting the contingentists. Without agreeing on which features of the world constitute closeness, the phrase could easily have turned out differently is empty, and the seminar remains stuck because each side is validating their own metric with their own evidence without ever justifying why their metric is the one that matters for historical explanation.

  Progress in this seminar will not come from finding more historical evidence, since both sides already ignore the other's evidence as irrelevant to their question, but from formalizing the disagreement through the modellers framework. You need to shift the group's task from arguing about what happened to arguing about how to define the state space of the problem. A concrete step would be to ask the modellers to produce a simple agent-based model where the micro-rules are sensitive to small shocks but the macro-statistics are robust, and then have the historians map their respective claims onto the micro and macro outputs of that simulation. This would force the contingentists to admit that their claims hold at the level of individual agents or events, and force the structuralists to admit that their claims hold only at the level of aggregate distributions. If they can agree to label these as distinct claims rather than competing truths, the tension dissolves into a complementarity rather than a contradiction.

  However, you should be prepared for the possibility that no progress is possible if the participants refuse to accept that historical explanation is scale-relative. If the contingentists believe that the only history worth telling is the story of specific tokens, and the structuralists believe that only type-level explanations count as science, then they are not just disagreeing about counterfactuals but about the purpose of history itself. In that case, the stalemate is a feature rather than a bug, reflecting a deep philosophical incompatibility about what constitutes understanding. But if they are willing to accept the modellers insight that chaos and robustness are compatible descriptions of the same system viewed at different resolutions, then the path forward is to stop asking was it contingent and start asking contingent with respect to which variables and robust with respect to which aggregates. This changes the seminar from a debate over the past into a collaborative exercise in defining the parameters of historical possibility, which is likely where the real philosophical work lies.
