answer: |-
  ### The Scenario

  **Dates:** November 1 ($t=0$), December 1 ($t=1$), January 1 ($t=2$).
  **Entitlement:** At $t=0$, the agent holds a Standard Voucher redeemable for \$50 cash at $t=2$.
  **Offer 1 ($t=0$):** Swap Standard for Premium Voucher (redeemable for \$80 at $t=2$). Fee: \$1 cash paid immediately. **Condition:** Premium requires a \$20 maintenance fee paid at $t=1$ to remain valid.
  **Offer 2 ($t=1$):** Swap Premium back to Standard Voucher. Fee: \$4 cash paid immediately. Maintenance fee waived.
  **Parameters:** The agent has sufficient cash for all fees. Discounting is quasi-hyperbolic: $U_t = x_t + 0.5 \sum_{k=1}^T x_{t+k}$. All agents share this rule.

  ### Node-by-Node Walkthrough

  **Discounting Rule:** Value at $t$ of \$X at $t$ is \$X. Value of \$Y at $t+1$ is $0.5 \times Y$.

  **1. The Naive Agent**
  *   **$t=0$:** Values Standard at $0.5 \times 50 = 25$. Values Premium at $-1 + 0.5(80 - 20) = 29$. She expects her $t=1$ self to pay the \$20. **Choice:** Accept Offer 1. (Cash: -\$1).
  *   **$t=1$:** Holds Premium. Must pay \$20 now for \$80 later. Value: $-20 + 0.5(80) = 20$. Option to Switch to Standard: $-4 + 0.5(50) = 21$. She prefers switching. **Choice:** Accept Offer 2. (Cash: -\$1 - \$4 = -\$5).
  *   **$t=2$:** Redeems Standard. **Final Cash:** \$50 - \$5 = **\$45**.

  **2. The Sophisticated Agent**
  *   **$t=0$:** Predicts $t=1$ choice correctly. Knows if she takes Premium, she will switch to Standard at $t=1$.
  *   **Value of Premium Path:** $-1 + 0.5(-4 + 50) = 22$.
  *   **Value of Standard Path:** $25$.
  *   **Choice:** Reject Offer 1. (Cash: \$0).
  *   **$t=1$:** Holds Standard. No offers accepted.
  *   **$t=2$:** Redeems Standard. **Final Cash:** \$50 - \$0 = **\$50**.

  **3. The Resolute Agent**
  *   **$t=0$:** Ranks plans by $t=0$ preferences. Premium Plan (29) > Standard Plan (25).
  *   **Choice:** Accept Offer 1. Commits to paying maintenance. (Cash: -\$1).
  *   **$t=1$:** Holds Premium. Spot preference favors switching (21 vs 20). **Resolution:** Ignores spot preference, pays maintenance to honor initial plan. (Cash: -\$1 - \$20 = -\$21).
  *   **$t=2$:** Redeems Premium. **Final Cash:** \$80 - \$21 = **\$59**.

  **Final Wealth Ranking:** Resolute (\$59) > Sophisticated (\$50) > Naive (\$45).

  ### Constraint Check

  1.  **Present Bias:** Rule $U_t = x_t + 0.5 \sum x_{t+k}$ is explicit and applied uniformly. Preferences are transitive at each node ($t=0$: B>A; $t=1$: C>B). Exploitation is diachronic (preference reversal between $t=0$ and $t=1$).
  2.  **Naive Pump:** Naive agent accepts Offer 1 and Offer 2. Ends with original entitlement (Standard/\$50) and strictly less cash (-\$5). Terms transparent, no coercion.
  3.  **Sophisticated Safety:** Sophisticate anticipates the $t=1$ reversal. She rejects Offer 1, avoiding the fee cycle. Her prediction matches the Naive agent's actual $t=1$ behavior.
  4.  **Resolute Advantage:** Resolute agent achieves the plan ranked best at $t=0$ (Premium). She uses no external tools (contracts/apps), only internal follow-through at $t=1$. She ends with \$9 more than Sophisticate.
  5.  **Cash Ranking:** \$59 > \$50 > \$45. Strict inequality derived from arithmetic, not stipulation.
  6.  **Realism:** Timeline is 3 months. Max single amount is \$80. No liquidity constraints (agent has cash). No exotic instruments (vouchers/fees).

  ### Structural Feature & Removal Test

  **Feature:** The availability of a **locally optimal exit option** at $t=1$ (Offer 2).
  This option is attractive to the present-biased $t=1$ self (avoiding the \$20 immediate pain) but destroys the value created for the $t=0$ self. Foresight is costly because knowing you will take the exit makes the initial investment worthless.

  **Removal Test:** Make the Premium contract **binding** (no Offer 2; maintenance fee is mandatory to retain value).
  *   **Naive:** Accepts Offer 1 (expects to pay \$20). At $t=1$, forced to pay \$20. Ends with \$59.
  *   **Sophisticate:** Knows she will be forced to pay \$20. Values Premium at 29. Accepts Offer 1. Ends with \$59.
  *   **Resolute:** Ends with \$59.
  *   **Result:** Ranking collapses (All equal). The pump requires the freedom to renege.

  ### Counterattack

  **Objection:** "Resolute choice is impossible. If preferences determine choice at $t=1$, the agent *cannot* pay the \$20. You have stipulated Constraint 5 by granting the Resolute agent a magical ability to violate her own utility function."

  **Response:** The objection lands if one defines rationality strictly as "maximizing spot utility at every node." However, decision theory distinguishes between *choice functions* and *preference orderings*. Resolute choice posits that agents can adopt policies evaluated at $t=0$ rather than maximizing spot utility at every step. It is not magic; it is a different norm of agency (McClennen's resolute choice vs. Strotz's consistent planning).

  **Repair:** If one denies resolute choice is possible, the Resolute category vanishes. The case then demonstrates only that Sophistication protects against exploitation (Naive loss), but fails to show Sophistication is suboptimal. To preserve the case, one must accept that "willpower" or "policy adherence" is a available action, even if costly. The model assumes zero cost of willpower; adding a small cost (e.g., \$5 psychic cost) preserves the ranking (\$54 > \$50 > \$45) as long as the cost < \$9.

  ### The Question

  The sophisticated agent violates **Dynamic Consistency** (her $t=0$ plan is not executed), but she violates no synchronic rationality norm (she maximizes utility at every node given her beliefs). She has violated no diachronic norm of *rationality* defined as internal consistency over time.

  **Implication:** This implies that **exploitability is linked to naivete, not irrationality.** A sophisticated agent cannot be money-pumped, but she may still achieve lower welfare than a resolute agent. Rationality (as sophistication) protects against losses but does not guarantee gains that require overcoming future preference reversals. The connection between exploitability and rationality is weaker than often claimed: one can be unexploitable yet suboptimal.
