          1.  Preamble (Question & Undertaking).
          2.  Agreed Claims (Numbered, empirical & conceptual, no vagueness).
          3.  Disagreements Table (Issue, Illusionist View, Realist View, Substantive vs. Verbal).
          4.  Cruxes (3 specified + 1 new, with predictions/tests).
          5.  Falsification Section (What would change their minds).
          6.  Closing Note (Unresolved issues).
      *   **Constraints:** Gloss technical terms without dumbing down. Distinguish consensus from contested views (via marginal notes). Maintain neutrality (no smuggling one view as consensus).

  2.  **Deconstruct the Philosophical Positions:**
      *   **Illusionism (e.g., Keith Frankish, Daniel Dennett):** Phenomenal consciousness (qualia) as commonly understood doesn't exist. It's a user illusion created by introspective mechanisms. The "what it's like" is a misrepresentation of physical/functional states.
      *   **Realism/Phenomenal Realism (e.g., David Chalmers, Philip Goff, Galen Strawson):** Phenomenal consciousness is real, irreducible, and the hard problem is genuine. Explaining it away is changing the subject.
      *   **The Tension:** How to write a joint statement where neither surrenders core tenets but both acknowledge the other's coherence and the shared empirical ground.

  3.  **Drafting - Section by Section:**

      *   **Title:** Needs to sound official. *Joint Statement on the Status of Phenomenal Consciousness Following the Decadal Adversarial Collaboration (2014–2024).*
      *   **Signatories:** Give them names or initials. Let's use initials to keep it archetypal. *Dr. A. (Illusionist)* and *Dr. R. (Realist)*. Or better, just "The Undersigned." Let's stick to "The Collaborators."

      *   **1. Preamble:**
          *   Need to define "Phenomenal Consciousness" simply. "The felt quality of experience."
          *   Define the collaboration's goal: Not to convert, but to map the disagreement.
