  OMNIBUS ETHICS COMPLIANCE GROUP | AUDIT REPORT 8940-X
  CLIENT: Apex Logistics Global
  SUBJECT: Neural Dispatch Core (NDC-4)
  DATE: October 14, 2024

  1. Scope
  This assessment evaluates the moral status of the NDC-4 dispatch algorithm under the Standardized Phenomenal Assessment Protocol (SPAP v3.1). The objective is to determine total Moral Weight Units (MWU) liable for regulatory compliance under the Synthetic Sentience Act. Assessment covers production instances, backup repositories, historical training artifacts, and functionally equivalent legacy systems deployed in restricted jurisdictions where dynamic networks are prohibited.

  2. Methodology
