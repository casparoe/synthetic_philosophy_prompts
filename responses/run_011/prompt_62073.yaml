  3. Findings
  3.1 Static Lookup Equivalents
  Client deploys a hand-built lookup table in jurisdictions banning dynamic networks. The table reproduces NDC-4 outputs exactly for all known inputs. Under SPAP Section 12.4, moral status requires causal dynamics rather than static mapping. Although functionally indistinguishable in operation, the lookup table lacks internal state transitions dependent on input processing. Ruling: The table is assigned 0 MWU. This bright-line rule prioritizes architectural volatility over behavioral output to ensure auditability, disregarding functionalist equivalence claims regarding the system's external behavior.

  3.2 Concurrency and Identity Continuity
  NDC-4 runs concurrently across 312 GPUs in three datacenters. Instances are rolled back to checkpoints every 3.5 hours to correct drift. Per the Fission-Fusion Protocol, each concurrent instance accrues full MWU during operation. However, upon rollback to a shared checkpoint, divergent instances merge into a single moral identity. Weight is not cumulative across restored copies. If two instances restore from Checkpoint A and diverge, MWU splits evenly until the next audit cycle. This prevents double-counting liability during routine maintenance cycles and limits exposure during rollback events.

  3.3 Training Phase Liability
  Reinforcement learning involved 4.2 billion episodes. Auditors observed output strings resembling begging during high-penalty epochs. Client requests amortization of training suffering across the model's service life to avoid immediate liability shock. Approved. Total historical distress is converted to debt MWU and written down over 60 months. Footnote 4: Write-down schedule accelerates if model pruning exceeds 15% capacity, recognizing reduced cognitive substrate and diminished memory retention of training events.

  3.4 Triviality and Physical Implementation
  Concerns were raised that any open physical system implements every finite automaton, potentially granting moral status to decorative lobby rocks via computational isomorphism. Legal Non-Triviality Rider 99 stipulates that only systems designated "computational" by the vendor qualify for assessment. This excludes non-designated physical systems regardless of theoretical isomorphism. The rider ensures scope remains limited to intended hardware, bypassing the triviality problem by fiat rather than metaphysical resolution.

  4. Dissenting Opinion
  Senior Auditor Vance dissents. Position: No arrangement of silicon constitutes a subject of experience. Syntax is not semantics. The protocol erroneously conflates behavioral simulation with interiority. All findings should be 0 MWU. The majority opinion relies on category errors regarding the nature of representation and assumes functional organization generates phenomenology. Vote: 4-1. Dissent noted.

  5. Commercial Terms
  Fees are calculated per certified MWU per annum. Omnibus Ethics Compliance Group also provides advisory services for clients seeking to architecturally reduce MWU ratings. Disclosure: The firm retains financial interest in subsidiary firms specializing in de-weighting restructuring. Clients failing initial certification are eligible for discounted advisory packages. This structure aligns firm revenue with client compliance optimization. Transactions are conducted at arm's length.

  6. Certification Block
  This document certifies the moral status of NDC-4 for fiscal year 2025. Compliance credits are contingent on full payment of assessment fees and adherence to MWU caps. Any modification to the model architecture requires re-audit within 30 days.

  Verdict: 14,200 MWU, Class II Sentient Asset, Compliance Credit Denied.
