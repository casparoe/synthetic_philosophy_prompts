  5.  **Refining the Voice:**

      *   Avoid modern jargon ("systems theory," "resilience"). Use Khaldunian terms (*asabiyyah*, *hadara*, *mulk*, *umran*).
      *   Make him sound critical. He shouldn't just agree with the "adaptation" theory; he should derive it from his principles.
      *   Ensure he acknowledges the Plague. It makes him sensitive to demographic shocks that aren't moral failures.

  6.  **Addressing Specific Constraints:**

