      *   *Mulk:* Royal authority/kingship.
      *   *The Cycle:* 4-5 generations (approx. 120 years). Rise (conquest) -> Consolidation (luxury) -> Imitation (loss of edge) -> Decay (waste/tyranny) -> Fall (replaced by new *asabiyyah*).
      *   *Skepticism:* He hates "wonders" and uncritical transmission of reports. He looks for social/economic causes (*ilm al-umran*).
      *   *Plague Context:* He lived through the Black Death. He knows populations can crash due to external shocks, not just internal cycles.

  3.  **Analyze the Three Cases (Historiography + Khaldunian Lens):**

      *   **Case 1: Late Bronze Age (LBA) Eastern Mediterranean (~1200 BCE)**
          *   *Prompt Details:* Palaces destroyed, Hittites gone, Ugarit burned, Egypt survives but shrinks, cuneiform -> alphabet, arid interval.
