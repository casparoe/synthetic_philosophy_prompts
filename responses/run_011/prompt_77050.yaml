          *   *Khaldun's View:* He would likely see this as the failure of *mulk* (royal authority) due to excessive *hadara* (costly administration) meeting a shock (climate/Sea Peoples). He would distinguish between the collapse of the *state* (palaces) and the continuity of *umran* (peasant life).
          *   *Verdict:* Not total collapse, but dynastic turnover accelerated by environmental shock.

      *   **Case 2: Classic Maya (8th-9th Century)**
          *   *Prompt Details:* Southern lowlands abandon monuments, dynasties fail, settlement density drops. North (Chichén Itzá) rises. Drought + Warfare + Political Theology (King = Rain).
          *   *Historiography:* Consensus on Southern decline and Northern rise. Dispute on primary driver (Drought vs. Warfare vs. Ideological failure). Chronology of Chichén Itzá's rise relative to Southern fall is debated (overlap vs. succession).
          *   *Khaldun's View:* This fits his cycle perfectly. The *asabiyyah* of the southern dynasties rotted in luxury. The drought is the *afla* (calamity) that exposes the weakness. The shift North is a transfer of *mulk* to a fresher group (or the same group resetting). The survival of the people (Mayan speakers) proves *umran* continues even if *mulk* shifts.
          *   *Verdict:* Dynastic cycle completion, not civilizational extinction.

      *   **Case 3: Rapa Nui (Easter Island)**
