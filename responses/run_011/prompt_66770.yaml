answer: |-
  This is one of the oldest and deepest problems in ethics. You have stumbled onto the debate between **Moral Worth** (what makes an action praiseworthy) and **Moral Character** (what makes a person good).

  You don't need the jargon to see the pattern. Your intuitions are actually very consistent on 9 out of 10 cases. The mess is concentrated in case #5 vs. #6, and a slight confusion in #8.

  Here is the principle that explains your verdicts, the analysis of your cases, and the hard truth about what you need to let go of.

  ### The Principle: The Motive Purity Rule

  **Definition:** An action only earns *moral credit* if the primary reason for doing it is the good of the act itself (or the welfare of others). External rewards, social approval, fear of punishment, or internal discomfort kill moral credit. Outcomes do not determine credit; intent does.

  **The Three Clauses:**
  1.  **The Outcome Clause:** Whether the act actually helps anyone determines its *value*, but not your *credit*. (Explains Case #9).
  2.  **The Self-Interest Filter:** If the main driver is benefit to *you* (clout, money, avoiding guilt, fitting in), moral credit is zero. (Explains Cases #1, #3, #8, #10).
  3.  **The Intent Requirement:** If the main driver is the good itself, moral credit is granted, regardless of whether it felt easy or hard. (Explains Cases #2, #4, #6).

  ---

  ### How the Principle Applies to Your 10 Cases

  1.  **Food Bank + Instagram:** Fails **Self-Interest Filter**. Motive is clout. **Verdict: Zero Credit.** (Matches your intuition).
  2.  **Food Bank + Anonymous:** Passes **Self-Interest Filter**. Motive is helping. **Verdict: Full Credit.** (Matches).
  3.  **Chem Homework + Guilt:** Fails **Self-Interest Filter**. Motive is avoiding your own bad feelings. **Verdict: No Credit.** (Matches).
  4.  **Chem Homework + Kindness:** Passes **Self-Interest Filter**. Motive is others' welfare. **Verdict: Full Credit.** (Matches).
  5.  **Reluctant Donor + Duty:** Passes **Self-Interest Filter** (technically). Motive is "ought." **Verdict:** Principle says **Credit**, but creates tension with #6. (More on this below).
  6.  **Natural Saint:** Passes **Self-Interest Filter**. Motive is natural kindness. **Verdict: Full Credit.** (Matches).
  7.  **Cousin + College App -> Care:** Fails **Self-Interest Filter** for first half. Passes for second half. **Verdict: Split Credit.** (Matches).
  8.  **Wallet + Reward:** Fails **Self-Interest Filter**. Motive is money. **Verdict: No Moral Credit.** (Matches).
  9.  **Scam Charity:** Passes **Intent Requirement**. Fails **Outcome Clause** (no help), but credit remains. **Verdict: Full Credit.** (Matches).
  10. **Brother + Fear:** Fails **Self-Interest Filter** (and voluntariness). Motive is coercion. **Verdict: Not a good act.** (Matches).

  ### The New Case: The Peer Pressure Volunteer

  **Case:** Someone volunteers because their friend group does and they'd be excluded if they didn't, but they end up liking it.

  **Verdict:** **Zero Credit for the time spent solely to fit in.**
  **Reasoning:** This is identical to your cousin (#7) and the Instagram friend (#1). The "Self-Interest Filter" blocks credit when the motive is social survival.
  **The Nuance:** If, like your cousin, their motive *shifts* mid-stream to genuinely caring about the work, credit starts accumulating from that moment forward. Until then, they are just buying social insurance.

  ---

  ### The Hard Truth: Where Your Intuitions Clash

  You asked me to be honest about what you have to give up. You have two specific conflicts that the *Motive Purity Rule* cannot solve without modification.

  #### Conflict 1: The Wallet Paradox (Case #8)
  You said the Wallet Guy gets **no moral credit**, but you **want more of him in the world** than the Instagram Friend (#1).
  *   **The Problem:** This breaks your scale if you think "Moral Credit" = "Who I want in the world."
  *   **The Fix:** You need to admit there are **two scores**, not one.
      1.  **Moral Worth:** Internal. Based on motive. (Wallet Guy = 0).
      2.  **Social Reliability:** External. Based on predictability. (Wallet Guy = High).
  *   **Why:** Greed is consistent; vanity is fickle. If the reward disappears, the Wallet Guy still returns the wallet (habit/principle). If the likes stop, the Instagram Friend quits.
  *   **What to drop:** Drop the idea that "Moral Credit" is the only way to judge who is useful to society. You can respect the Wallet Guy's *utility* without respecting his *soul*.

  #### Conflict 2: The Struggle vs. The Saint (Case #5 vs. #6)
  This is the big one.
  *   **Case #5 (The Struggler):** Does good despite hating it. You say: "Most Credit."
  *   **Case #6 (The Saint):** Does good because they love it. You say: "Best Person."
  *   **The Contradiction:** How can the "Best Person" not get the "Most Credit"?
  *   **The Philosophy:** You are holding two opposing theories at once.
      *   **Theory A (Kant):** Morality is about *conquering* your selfish desires. The harder it is, the more praiseworthy the act. (Favors #5).
      *   **Theory B (Aristotle/Virtue):** Morality is about *training* your desires until doing good is easy. The less it costs you, the better the person. (Favors #6).

  **Which one should you drop?**
  You should drop the verdict that **#5 deserves MORE credit than #4.**

  Here is why:
  In Case #4, the kid helps because it makes him happy. In Case #6, the saint helps because it's automatic. These are the same category: **They love the good.**
  In Case #5, the donor helps because of a rule. **They obey the good.**

  If you say #5 gets the *most* credit, you are saying that **misery is a requirement for morality.** That leads to a dark place where you distrust happy, kind people (#4 and #6) and only trust miserable, grumpy people (#5).

  **My Advice:**
  Keep **#6 as the Ideal.** The goal of morality is to become the kind of person for whom doing good is natural (#6). Case #5 is a "training wheel" version of morality. It is *respectable*, but it is not *superior* to #4.
  *   **Verdict to Change:** Downgrade #5. Give #5 "Respect Credit" (for willpower), but give #4 and #6 "Virtue Credit" (for character). Do not say #5 gets *more* than #4.

  ### Summary of What to Keep and Drop

  1.  **Keep:** The **Motive Purity Rule**. It works for 90% of your cases. Intent matters more than outcome (#9), and selfish motives kill credit (#1, #3, #10).
  2.  **Keep:** The distinction between **Moral Credit** and **Social Reliability**. This solves the Wallet Guy (#8). He is useful, but not morally praiseworthy.
  3.  **Drop:** The idea that **Struggle (#5) > Joy (#4).** This is the inconsistency. If #6 is the "best person," then enjoying doing good must be better than hating it. Acknowledge that #5 is *admirable for their effort*, but #4 and #6 are *better humans*.

  **Final Principle Revision:**
  > "An action has moral worth if done for the sake of the good. However, the highest form of moral worth belongs to those who have aligned their desires with the good, so that doing right requires no struggle."

  This saves your intuition on #6 while still giving #5 respect, without claiming #5 is the winner.
