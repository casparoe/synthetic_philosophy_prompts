  ok so I'm a junior and I've been going down this rabbit hole about whether doing the right thing still counts if you're doing it for the wrong reason, and I have like nine gut reactions that I can't get to line up with each other. Can you figure out what principle actually explains my verdicts, and tell me which ones I have to give up? I know there's some famous version of this debate but I havent read the actual thing so please dont assume I know the vocabulary.

  here's what I think, some real people some made up:

  1. my friend who works the food bank shift every saturday and posts a story about it literally every single time. the food still gets handed out so it's not bad, but I don't think she gets any credit. zero.
  2. exact same friend, same shifts, but imagine she never posted and nobody ever found out. full credit.
  3. a kid in my chem class who lets people copy his homework because he'd feel gross about himself if he said no. no credit.
  4. a kid who lets people copy because he genuinely thinks people deserve second chances and it makes him happy. full credit, and I think he's a better person than #3 even though what they do is identical.
  5. someone who doesn't want to give money at all, thinks charities are annoying, but gives anyway because they think its what they ought to do. I keep wanting to say this one deserves the MOST credit, more than #4. but also when I picture actually knowing this guy he seems kind of miserable and cold and I'm not convinced he's a better person.
  6. someone who was raised so well that kindness is just automatic and they have never once had to fight themselves over it. full credit, no asterisk, I think this is the best kind of person. but wait, that's the opposite of #5?? this is the pair I cant fix.
  7. my cousin who volunteered at the shelter for six weeks purely to have a line on her college apps, and somewhere in the middle she actually started caring about the dogs, and now she still goes even though she's already been accepted. does she get credit for the whole six weeks or only from the point where she flipped? I said only from the flip, but that feels harsh since the dogs got fed the whole time either way.
  8. a guy who turns in a lost wallet with 400 dollars in it because there was a reward posted. no moral credit, I think. but if I had to pick which of these people I'd want more of in the world, I'd pick him over #1, which seems to break whatever scale I'm using.
  9. someone who researches charities carefully, picks the one they think does the most good, and donates — and it turns out to be a total scam and nobody is helped at all. I still want to give them full credit, which is wierd because the outcome is identical to doing nothing.
  10. my little brother who shares his snacks with me because he's scared I'll tell mom something. I don't even think that's a good act, it's just compliance.

  so what I want:

  - state the principle (or a couple of competing candidates) precisely enough that someone could apply it without asking me questions, and say which clause is doing the work on each of my ten cases
  - tell me what it says about a case I didn't list: someone who volunteers because their entire friend group does and they'd be excluded if they didn't, but who ends up liking it
  - be honest about which of my verdicts it can't accommodate, and which one I should drop
  - and if you think #5 vs #6 is just unfixable, say that straight up instead of bending the principle into something so complicated nobody could use it. I'd rather find out my intuitions are a mess than get a tidy answer that cheats
