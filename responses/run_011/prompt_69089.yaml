prompt: |-
  I'm in the second half of a medieval political thought survey — we've moved from Augustine and John of Salisbury into the thirteenth century, and this week's reading is Aquinas's *On Kingship* alongside his treatment of sedition in the second part of the *Summa Theologiae*. I have an essay due Thursday on whether Aquinas should be read as a theorist of resistance or as a quietist about established authority, and on the bus to seminar I listened to an episode of a history podcast whose host is a professional medievalist and who offered a fairly confident précis of Aquinas on tyrannicide. I wrote down his summary as faithfully as I could:

  > "Aquinas is the most important medieval theorist of tyrannicide, and his position is far more radical than people usually assume. His starting point is that kingship exists for the sake of the common good; a ruler who governs for his own profit and glory is a tyrant, and tyranny is not merely an inferior regime but a corrupt one, because it severs the bond that makes authority legitimate at all. Once that bond is severed, Aquinas holds, the ruler forfeits any claim to obedience, and he is quite prepared to countenance his removal by force — in *On Kingship*, the treatise he composed for the king of Cyprus, he argues that a man who has seized power over a reluctant people has no title to rule, so that whoever gets at him first commits no injustice. He adds a single qualification, and it's an instructive one: where the tyrant came to the throne lawfully, by inheritance rather than by usurpation, no human being may depose him, because a rightful king acknowledges no superior on earth and God alone is his judge. So in practice Aquinas permits tyrannicide against usurpers and forbids it against hereditary monarchs, which is why his politics are monarchist in everything but name. He does go on, in the second book, to sketch the machinery by which the leading men of the realm are to judge and remove a king who has turned tyrant. And in the *Summa* he insists that subjects who rise against a tyrant are not guilty of sedition, since sedition is properly the tyrant's own crime: he foments discord among his subjects so as to dominate them more securely. The Jesuits later took this doctrine and made it an instrument against princes, which is why the papacy eventually had to disown it and why official Catholic teaching became quietist for three centuries. Historically, Aquinas is the man who gave Europeans the idea of a right of resistance four centuries before Locke."

  Several things about this sit badly with what I remember from lecture, but I can't yet tell whether my memory or the host is at fault, and I'd rather not build an essay on a podcast. Could you go through it claim by claim and tell me what a specialist in Aquinas's political thought would accept, what she would regard as a defensible simplification, and what she would reject outright? Three points especially. First, on the central question of agency: does Aquinas anywhere license a private individual to kill a ruler, and if not, on whom does he confer the authority to act against a tyrant, and under what conditions? Second, on the asymmetry the host draws between a tyrant by usurpation and a tyrant by inheritance — is that distinction Aquinas's own, and if so, has the host stated it the right way round? I have a vague sense that Aquinas's discussion turns on something quite different, namely whether the community itself holds the right to provide its ruler, and that the "God alone can judge him" case arises in different circumstances than the host suggests, but I can't reconstruct the argument. Third, on the genealogy: is the line from Aquinas through the Jesuits to Locke right, or has the host imported into Aquinas a position that belongs to other authors? Our seminar also covered the Council of Constance and the tyrannicide articles examined there in connection with Jean Petit's defence of the Duke of Burgundy, and I think one of those articles was to the effect that killing a tyrant is licit *and meritorious*, by whatever means and without awaiting a judge's sentence — the host's framing reminded me of that, and I'd like to know whether the language he is putting into Aquinas's mouth is actually Aquinas's or belongs to that later controversy.

  Please don't give me a bibliography, a reading list, or page numbers, and don't reproduce quotations from the texts — paraphrase instead, since I have the translations in front of me and would rather check your reconstruction against them myself than trust a quotation. Where the host is extrapolating from something Aquinas genuinely does say, I'd like the genuine claim separated cleanly from the extrapolation; and if his conclusion about Aquinas as a proto-Lockean survives the corrections, tell me in what qualified form it might.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** Student in a medieval political thought survey (2nd half, 13th century). Reading Aquinas's *On Kingship* (*De Regno*) and *Summa Theologiae* (II-II, q. 42 on sedition). Essay due Thursday on Aquinas as a theorist of resistance vs. quietist.
      *   **Trigger:** Listened to a history podcast by a "professional medievalist" making strong claims about Aquinas and tyrannicide.
      *   **Task:** Evaluate the podcast host's claims claim-by-claim. Distinguish between what specialists accept, defensible simplifications, and outright rejections.
      *   **Specific Focus Areas:**
          1.  **Agency:** Private individual vs. public authority. Who can act?
          2.  **Usurper vs. Hereditary Tyrant:** Is the host's distinction accurate? What is the actual distinction Aquinas makes?
          3.  **Genealogy:** Aquinas -> Jesuits -> Locke? Is this accurate or anachronistic? Connection to Jean Petit/Council of Constance?
      *   **Constraints:** No bibliography, no reading lists, no page numbers, no direct quotations (paraphrase only). Separate genuine claims from extrapolations.

  2.  **Deconstruct the Podcast Host's Claims:**
      *   *Claim 1:* Aquinas is the "most important medieval theorist of tyrannicide."
      *   *Claim 2:* Tyranny severs the bond of legitimacy; ruler forfeits claim to obedience.
      *   *Claim 3:* Removal by force is countenanced.
      *   *Claim 4:* In *On Kingship*, whoever gets at a usurper first commits no injustice.
      *   *Claim 5:* Qualification: If the tyrant came to power lawfully (inheritance), *no human being* may depose him; God alone is judge.
      *   *Claim 6:* Therefore, Aquinas permits tyrannicide against usurpers but forbids it against hereditary monarchs.
      *   *Claim 7:* In Book II of *On Kingship*, leading men judge/remove a tyrant.
      *   *Claim 8:* In the *Summa*, rising against a tyrant is not sedition; sedition is the tyrant's crime.
      *   *Claim 9:* Jesuits took this doctrine against princes; Papacy disowned it; Catholic teaching became quietist.
      *   *Claim 10:* Aquinas gave Europeans the right of resistance 4 centuries before Locke.

  3.  **Evaluate Claims against Scholarly Consensus (Mental Check):**

      *   *Claim 1 (Importance):* Debatable. John of Salisbury (*Policraticus*) is often cited as more explicit on tyrannicide. Aquinas is important, but calling him the *most* important theorist of *tyrannicide* specifically is contentious.
      *   *Claim 2 (Legitimacy/Common Good):* Accurate. Aquinas defines tyranny as rule for private good, not common good.
      *   *Claim 3 & 4 (Removal by Force/Usurper):* *On Kingship* I.6 discusses this. It says it is not sedition to depose a tyrant. However, the "whoever gets at him first" phrasing is risky. Aquinas warns against the dangers of attempting this (often leads to worse tyranny).
      *   *Claim 5 & 6 (Hereditary vs. Usurper/No Human Judge):* **Major Red Flag.** This is the crux of the user's suspicion. Aquinas does distinguish between a ruler who acquired power justly vs. unjustly. However, the claim that *no human being* can depose a hereditary tyrant is too strong and misrepresents the "public authority" argument. The "God alone is judge" line usually applies when there is *no* superior human authority to appeal to, but Aquinas often suggests public authority (the community or its representatives) can act. The host flips or oversimplifies the agency.
      *   *Claim 7 (Book II/Leading Men):* *On Kingship* is unfinished (breaks off in Book I, Chapter 6 in most manuscripts; Book II is often attributed to Ptolemy of Lucca). Even assuming Book I, Aquinas suggests appealing to a superior authority. If none exists, he is very cautious about private action.
      *   *Claim 8 (Sedition):* Accurate. *Summa* II-II, q. 42. Sedition is contrary to unity/peace. Tyrants cause sedition; resisting them isn't seditious *if* done by proper authority.
      *   *Claim 9 (Jesuits/Quietism):* Oversimplified history. Jesuit theory (Suarez, Mariana) was more radical than Aquinas. The Catholic Church condemned tyrannicide (e.g., after Henry IV's assassination), but "quietist for three centuries" is a broad brush.
      *   *Claim 10 (Locke):* Anachronistic. Locke's resistance theory is based on popular sovereignty/contract in a way Aquinas doesn't envision. Aquinas is not a proto-Lockean in the liberal individualist sense.

  4.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the student's skepticism. Validate that their memory serves them better than the podcast on key points.
      *   **Point 1: Agency (Private vs. Public):**
          *   *Host:* Implies private individuals ("whoever gets at him first") can kill usurpers.
          *   *Aquinas:* Generally rejects private initiative. Emphasizes *public* authority. If a superior exists, appeal to them. If no superior (the community itself conferred power), the *community* (not a random individual) can depose.
          *   *Verdict:* Host is wrong on private agency. Aquinas is cautious.
      *   **Point 2: Usurper vs. Hereditary (The Distinction):**
          *   *Host:* Usurper = can kill; Hereditary = God alone judges.
          *   *Aquinas:* The distinction is about *how* power was acquired. If unjustly (usurper), the title is void. If justly, the title holds, but the *use* of power can be tyrannical. However, even with a just title, if the rule becomes tyrannical, the community (who originally conferred the power) can act. The "God alone" line is nuanced—it applies if there is no human superior, but it doesn't necessarily forbid public action by the realm.
          *   *Correction:* It's not about inheritance per se, but about the source of authority and whether a superior exists. The host creates a false dichotomy that makes Aquinas look more "monarchist" than he is.
      *   **Point 3: Genealogy (Jesuits, Constance, Locke):**
          *   *Host:* Aquinas -> Jesuits -> Locke.
          *   *Reality:* Jean Petit (Council of Constance) represents the radicalization that Aquinas *avoided*. Petit argued for private meritorious tyrannicide. Aquinas explicitly warns against this. Jesuits (like Mariana) went further than Aquinas. Locke is a different paradigm (social contract vs. natural law hierarchy).
          *   *Verdict:* Host conflates Aquinas with later radical monarchomachs. Aquinas is not a proto-Lockean.
      *   **Synthesis/Conclusion:** Summarize the "Resistance vs. Quietist" essay prompt. Aquinas is neither. He is a "constitutionalist" of sorts (rule of law, common good) but wary of anarchy.

  5.  **Refining the Tone and Constraints:**
      *   *Tone:* Academic, supportive, authoritative but encouraging verification (since I can't quote).
      *   *Constraints Check:* No quotes? Check. No bibliography? Check. Paraphrase? Check. Address the three specific points? Check.
      *   *Self-Correction on *On Kingship*:* I need to be careful about the authorship of Book II. Most scholars attribute Book II to Ptolemy of Lucca. The host mentions Book II sketching machinery. I should note that this might not be Aquinas's own voice, which complicates the host's claim.
      *   *Self-Correction on "Whoever gets at him first":* Aquinas does say it is not sedition to depose a tyrant, and sometimes implies the act isn't unjust against a usurper, but he immediately pivots to warning about the *dangers* of attempting this without public authority. The host isolates the permissive clause and ignores the restrictive context.

  6.  **Final Polish:** Ensure the distinction between *tyrannus ex defectu tituli* (usurper) and *tyrannus ex parte exercitii* (tyrant by exercise) is clear without using Latin jargon excessively (or explaining it if used). Ensure the Jean Petit connection is clarified (Petit = radical/private, Aquinas = cautious/public).

      *(Self-Correction during drafting)*: Wait, I need to make sure I don't give page numbers. I will refer to sections generally (e.g., "the discussion on sedition," "the treatise on kingship").

      *(Refining the "God Alone" point)*: Aquinas does say that if there is no human superior, recourse is to God. But does that mean *no human action*? No, it means no *appeal* to a higher judge. It leaves open the possibility of the community acting as the superior. The host interprets "God alone is judge" as "no human may depose," which is the quietist reading Aquinas actually complicates.

      *(Refining the Locke point)*: Locke is about individual rights and dissolution of government. Aquinas is about the teleological end of the community. The link is tenuous.

      *(Final check on constraints)*: "Please don't give me a bibliography... don't reproduce quotations." Okay.

      *Let's structure the response:*
      1.  Intro: Validate skepticism.
      2.  Agency (Private vs. Public).
      3.  Usurper vs. Hereditary (The Distinction).
      4.  Genealogy (Petit, Jesuits, Locke).
      5.  Conclusion for the Essay.

      *Wait, one nuance on On Kingship:* The text is unfinished. The host claims Book II sketches machinery. This is technically Ptolemy of Lucca's contribution in most modern editions. I must mention this attribution issue as it undermines the host's claim that *Aquinas* argues this.

      *Okay, ready to write.*
answer: |-
  Your skepticism is well-founded. While the podcast host captures the broad strokes of Aquinas's commitment to the common good, the specific mechanics of resistance described in the summary are a mixture of defensible simplification, significant distortion, and anachronism. A specialist in Thomistic political thought would likely accept the host's framing of the *end* of government (the common good) but reject the host's account of the *means* of resistance (private agency) and the historical genealogy (Locke).

  Here is an evaluation of the host's claims, structured around the three points you raised.

  ### 1. Agency: Private Individual vs. Public Authority

  **The Host's Claim:** Aquinas licenses removal by force and suggests that against a usurper, "whoever gets at him first commits no injustice."

  **Specialist Assessment:** This is the most dangerous oversimplification in the summary. It conflates the *justice of the cause* with the *authority of the agent*.

  *   **What Aquinas Actually Says:** Aquinas consistently distinguishes between the moral status of the ruler and the legal capacity of the subject. In his discussion of sedition, he argues that resisting a tyrant is not seditious *if* it is done to protect the common good. However, he is deeply wary of private initiative. In the treatise on kingship, he acknowledges that a usurper (one who seizes power unjustly) holds no legitimate title. Consequently, killing such a figure is not strictly "murder" in the sense of killing a legitimate magistrate.
  *   **The Crucial Qualification:** Aquinas immediately qualifies this by warning that attempting to kill a tyrant privately is often more dangerous than tolerating the tyranny. Private attempts frequently fail, leading to harsher repression, or they succeed only to install a new tyrant who is worse than the first. Therefore, while the *act* against a usurper might not be intrinsically unjust, Aquinas does not generally encourage private individuals to undertake it on their own authority.
  *   **Who May Act?** Aquinas confers the authority to act primarily on **public authority**. If there is a superior to the king (an emperor, a pope, or an overlord), the community should appeal to that superior to depose the tyrant. If there is no human superior (which is the case for a king who acknowledges no earthly master), Aquinas argues that the right to depose resides in the **community as a collective body**, not in private individuals. The community, having originally conferred the authority to rule, retains the right to withdraw it if the ruler violates the terms of that trust.
  *   **Verdict:** The host is wrong to imply Aquinas licenses private tyrannicide as a standard remedy. Aquinas permits the *removal* of a tyrant but insists it be conducted through public mechanisms or collective action, not private assassination.

  ### 2. The Asymmetry: Usurper vs. Hereditary Monarch

  **The Host's Claim:** Aquinas permits tyrannicide against usurpers but forbids it against hereditary monarchs, because a rightful king acknowledges no superior and "God alone is his judge."

  **Specialist Assessment:** This is a significant distortion of the text, likely resulting from conflating two different arguments.

  *   **The Distinction:** Aquinas does distinguish between a tyrant by lack of title (usurper) and a tyrant by exercise (one who rules justly acquired power unjustly). The host is correct that Aquinas treats the usurper more harshly regarding the title to rule.
  *   **The "God Alone" Argument:** The host claims that for a hereditary (rightful) king, "no human being may depose him." This is the quietist reading that your lecture likely challenged. Aquinas does say that if a king has no superior, recourse must be had to God. However, specialists argue this does not mean humans must remain passive. It means there is no *higher judicial court* to appeal to. It does not preclude the **community** from acting as the judge.
  *   **The Source of Authority:** Your intuition is correct: the argument turns on who holds the ultimate authority. For Aquinas, political authority ultimately resides in the community, which delegates it to the king. If the king becomes a tyrant, he effectively dissolves the bond of political fellowship. At that point, the community (often represented by the "leading men" or magnates, not just any individual) can act to depose him, regardless of whether his title was originally hereditary or elective.
  *   **Authorship Note:** You should also be aware that the second book of *On Kingship*, which the host cites as sketching the machinery for removal by leading men, is widely considered by scholars to be the work of Ptolemy of Lucca, Aquinas's secretary, who completed the treatise after Aquinas abandoned it. While Ptolemy is a Thomist, his views on republicanism and deposition are often more radical than Aquinas's own fragments in Book I. Relying on Book II to prove *Aquinas's* personal view on the mechanics of deposition is methodologically shaky.
  *   **Verdict:** The host states the distinction the wrong way round regarding the outcome. A hereditary title does not grant immunity from deposition if the rule becomes tyrannical. The "God alone is judge" line limits *judicial appeal*, not *political resistance* by the community.

  ### 3. Genealogy: Jean Petit, the Jesuits, and Locke

  **The Host's Claim:** Aquinas gave Europeans the right of resistance four centuries before Locke; the Jesuits used this against princes until the Papacy disowned it.

  **Specialist Assessment:** This is a retrospective projection that flattens significant historical and theoretical differences.

  *   **Jean Petit and the Council of Constance:** Your memory of the seminar is the key here. Jean Petit's defence of the Duke of Burgundy (1408) argued that a tyrant could be killed by *any* subject, without a trial, and that doing so was *meritorious*. The Council of Constance condemned this proposition. This is precisely the position Aquinas *avoided*. Aquinas never argues that killing a tyrant is spiritually meritorious for a private individual. The host is attributing the radical "Petitist" position to Aquinas. Aquinas provides the *grounds* for resistance (the common good), but Petit and later radical monarchomachs provided the *license for private assassination*.
  *   **The Jesuits:** It is true that sixteenth-century Jesuit thinkers (such as Mariana and Suarez) developed theories of resistance that were more robust than Aquinas's, often in response to the Wars of Religion. However, they had to stretch Aquinas to get there. The Papal condemnation of tyrannicide in the early modern period was largely a reaction to the Jesuit radicalization (and the assassination of Henry IV), not a repudiation of Aquinas's original caution.
  *   **Aquinas and Locke:** Calling Aquinas a "proto-Lockean" is anachronistic. Locke's theory rests on individual natural rights and a social contract that creates a government which can be dissolved by the people, returning power to the individuals. Aquinas's theory rests on a teleological natural law where the community is an organic whole directed toward virtue. For Aquinas, resistance is a last resort to restore the proper order of the common good; for Locke, resistance is a mechanism to protect individual liberty against encroachment. Aquinas does not envision a "right of resistance" in the liberal, individualist sense. He envisions a corporate duty to preserve the polity.
  *   **Verdict:** The genealogy is flawed. Aquinas is the ancestor of constitutionalism (rule of law for the common good), not necessarily of liberal resistance theory. The host imports the radicalism of the late medieval conciliarists and early modern Jesuits back into the thirteenth century.

  ### Summary for Your Essay

  If you are arguing whether Aquinas is a theorist of resistance or a quietist, the most accurate position is a **qualified constitutionalist**.

  1.  **Not a Quietist:** He explicitly denies that tyranny is a legitimate form of rule and denies that resisting a tyrant is necessarily sedition. He allows for deposition.
  2.  **Not a Radical Resistance Theorist:** He does not endorse private tyrannicide. He places strict conditions on who may act (public authority or the community collectively) and warns of the dangers of doing so.
  3.  **The Core Principle:** Authority is conditional on the pursuit of the common good. When that condition is breached, the authority dissolves. However, the *process* of reclaiming that authority must itself be orderly to avoid greater evil.

  The podcast host is correct that Aquinas breaks with absolute obedience, but incorrect to paint him as a champion of individual tyrannicide or a direct forebear of Locke. You should use the distinction between the *justice of the cause* (which favors resistance) and the *authority of the agent* (which restricts it to the public sphere) as the pivot of your essay. This allows you to acknowledge the radical potential of his thought without attributing anachronistic liberal individualism to him.
