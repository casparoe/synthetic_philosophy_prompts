answer: |-
  **The machinery, in my words**

  Commitment is not a state of mind; it is a change to the set. In craft terms, it is not the character *wanting* something badly; it is the character altering the stakes so that backing down costs more than moving forward. When your owner signs that brutal contract, he isn't just expressing anger; he is locking the door and throwing away the key. The craft counterpart is the Point of No Return, but with a specific constraint: the change must be physical or public, not internal. A vow is cheap; a signed contract witnessed by a competitor is expensive.

  Credibility is entirely about observation. In game theory, a threat is worthless if the other side thinks you're bluffing. In your vocabulary, this is a POV problem. It does not matter if the Union Leader knows he will strike; it matters if the Owner *knows* that the Leader knows. You must stage scenes where the commitment is displayed to the antagonist, not just the reader. If the Owner doesn't see the burned bridge, he will keep driving toward the cliff.

  Brinkmanship is the manufacturing of shared risk. It is not merely escalating demands; it is escalating the chance of accidental disaster. In beat sheets, this is where escalation costs the character something concrete, but here the cost is control. By threatening to close the mill, the Owner isn't just hurting the workers; he is handing the detonator to a nervous teenager. He is saying, "I might not be able to stop this even if I want to." This forces the Union to concede not because they are weak, but because the risk of mutual destruction has become too high to manage.

  Finally, the Commitment Race. This is the scramble to lock the door first. If the Union strikes before the Owner signs the contract, the Owner can blink. If the Owner signs first, the Union is trapped. In structural terms, this is the ordering of your plot points. Whoever commits first sets the terms of the conflict. The second mover is forced to react to a reality they didn't choose. Your plot must show who moved first, and why the other side couldn't stop them.

  **Where you had to bend it**

  The translation holds up on mechanics but fractures on psychology. Game theory assumes rational actors who know their own preferences. It assumes the Owner knows exactly how much money he loses versus how much pride costs him. Your characters likely do not. In fiction, a character's "want" often shifts mid-scene based on emotion, shame, or revelation. If your Union Leader secretly wants to lose the strike to save his marriage, the game theory model breaks. I had to assume your characters are consistent enough to track, even if they are lying to themselves.

  I also had to bend the concept of information. Theory often relies on "common knowledge"—facts everyone knows, and everyone knows everyone knows. In novels, we thrive on limited POV. I translated credibility as "observation," but in theory, it requires a level of mutual awareness that is hard to stage without head-hopping. You have to work harder to make sure the Owner *knows* the Union saw the contract. A letter in the mail isn't enough; you need a scene where he confirms they received it.

  Lastly, theory treats time as a series of moves. Fiction treats time as an experience. A "deadline" in theory is a variable. In a novel, it's sweating through a shirt. I assumed the pressure of the deadline functions as the ticking clock, but theory doesn't account for the exhaustion that makes a character irrational. I had to pretend your characters are machines for the structure to hold, even if you write them as humans.

  **What doesn't survive**

  You are right about dramatic irony. Game theory structurally cannot accommodate it. The models assume all players are operating on the same data set. If the reader knows the Owner's threat is hollow but the Union doesn't, the theory's prediction of "mutual disaster" fails because the Union is acting on false data. This is a massive gap. Theory deals in strategic truth; fiction deals in perceived truth. You can write a scene where the Owner is bluffing, the Union calls it, and the Owner folds. Theory calls this irrational if the bluff was detectable; fiction calls it tension.

  The "Commitment Race" label also splits here. When AI labs use it, they mean a literal sprint to hard-code constraints before the competitor does. It is logical and speed-based. When humans do it, it is social and ego-based. Your characters aren't racing because code is fast; they are racing because backing down looks like weakness. The theory treats these as identical moves. They are not. The human version requires shame as fuel; the AI version does not.

  Finally, subtext has no counterpart. Game theory records the move, not the motive. If a character strikes to prove love to a dead father, the model sees only "strike." The emotional payload—the reason the reader cares—is invisible to the theory. You cannot use these tools to find the heart of the scene, only the skeleton.

  **Whose gap is it**

  The gap is mostly on the novelist's side regarding structure, but the theory is thinner on meaning. Novelists often mistake surprise for quality. We love a twist where the Owner suddenly capitulates. Game theory tells you that if the setup is correct, that capitulation is impossible without breaking the logic of the world. The theory isn't just relabeling stubbornness; it explains why the stubbornness leads to a crash. It forces you to honor the causality you set up in Act One.

  However, the theory is useless for theme. It can tell you why the mill closes, but not why it matters. It treats irrationality as noise; fiction treats it as signal. If your Union Leader strikes against his own economic interest because of dignity, theory calls it an error. You call it the point of the book. So, use the theory to build the trap, but ignore it when you need to explain why someone walked into it willingly. The theory ensures the plot works; your craft ensures the pain is real. Don't let the model sanitize the human mess.

  **What I do Monday morning**

  The strike is the right engine, but your deployment is likely too verbal. First, make the Owner's contract public knowledge *before* the strike vote. The Union must vote knowing the bridge is already burned. This removes the "bluff" element and forces them to strike into a trap, which is more tragic.

  Second, introduce a variable neither side controls to handle the brinkmanship. A shipment of paper stuck in a storm, or a key machine breaking down. This actualizes the risk of accidental disaster rather than just threatening it. It makes the loss of control physical.

  Third, stage a scene where the Union Leader's commitment is witnessed by the Owner. Not a letter, but a face-to-face where the Leader admits he cannot stop his people even if he wanted to. This satisfies the credibility requirement. If you cannot stage this, the standoff is just two people yelling. Make the trap visible, then spring it.
