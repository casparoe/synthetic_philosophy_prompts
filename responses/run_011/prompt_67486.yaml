      *   The "Audit Case" is crucial. It involves *second-order uncertainty* (uncertainty about the sampling method). Standard Bayesianism handles this by marginalizing over hypotheses (Cherry-picked vs. Random). However, if the weights on *those* hypotheses are also unknown, IP gains traction.
      *   *Verdict:* I lean towards the User, but with caution. The "Strong" thesis (mandatory) is harder to defend than the "Weak" thesis (permissible). The specific case (audit with unknown sampling) is a strong candidate for mandatory imprecision because assigning a precise weight to "cherry-picked" vs. "random" without evidence seems arbitrary in a way that Beta(1,1) does not.
