answer: |-
  **Bottom line**
  Causal-role accounts are the truth-makers for functional ascriptions in adaptive systems, whereas etiological accounts are merely historical genealogies mistaken for normative standards.

  **The two positions at their strongest**
  The etiological account, championed by thinkers like Millikan and Neander, argues that a trait's function is strictly what it was selected for in the past. This view secures a normative standard: a heart that fails to pump blood is malfunctioning because it violates the historical condition that kept hearts in the population. It explains presence by referencing ancestry, distinguishing genuine functions from accidental benefits. The causal-role account, associated with Cummins, strips away history. It defines function as any current causal contribution a trait makes to a containing system's capacity. This view handles exaptation effortlessly and aligns with mechanistic explanation, but it struggles to distinguish function from side effects without appealing to the analyst's arbitrary choice of system capacity. Etiological theories win on normativity and origin; causal-role theories win on current utility and mechanistic transparency. The debate hinges on whether "function" explains why a trait is there or what a trait is doing now.

  **Case A**
  In the swapped assay scenario, directed evolution selects for binding X, then switches to selecting for Y. The final molecule retains structural features caused by the X-phase, but these features now causally support Y. The etiological account insists the pocket's function is binding X, rendering its current utility an accidental byproduct. The causal-role account says the function is binding Y. A protein engineer does not care about the pocket's ancestry; they care about its binding affinity today. If they treat the pocket as having the function of binding X, they will mispredict its behavior and misdesign subsequent rounds. Their practice tracks causal role exclusively. Does this pragmatic preference settle truth? Yes, because functional ascriptions are tools for intervention. A concept that systematically leads to failed predictions in the very systems designed to test function is conceptually broken. The etiological verdict is historically accurate but functionally false. It describes a ghost of selection past, not the operative reality of the molecule. When history and current role diverge, the engineer's success conditions prove that function is a forward-looking property, not a backward-looking label.

  **Case B**
  The machine learning cases sharpen the stakes for safety and interpretability. In the dead circuit sub-case, a component was vital during training but is now bypassed by gradient descent. Etiological accounts assign it a function; causal-role accounts say it does nothing. Interpretability researchers ignore dead circuits because they do not affect outputs. Here, causal role aligns with practice: if it doesn't change logits, it has no job. The exapted circuit sub-case is critical. A component unused during training becomes vital in deployment due to a distribution shift. Etiological accounts say it has no function because selection never targeted this behavior. Causal-role accounts say it has a function because it is now causally critical. Safety arguments rely on identifying what models *will* do off-distribution. If we adopt the etiological view, we are licensed to ignore exapted circuits until they cause failure, because they lack "proper function." This is catastrophic for alignment. We need to know what components do, not what they were trained to do. Interpretability talk about "jobs" licenses causal-role analysis because it seeks mechanistic understanding of current behavior. The etiological view blinds us to emergent risks. In high-stakes deployment, the history of weights is irrelevant compared to their current causal power. The etiological account fails to license the very reasoning required to prevent misuse or accident.

  **Is this just epistemics?**
  The worry is that etiological accounts dominate biology only because history is unrecoverable, forcing us to infer function from current role, whereas ML logs make history legible, exposing the divergence. This suggests the disagreement is about access, not ontology. If we knew biology's history perfectly, would we switch to etiological talk? The ML case says no. Even with perfect training logs, engineers prioritize current causal role for prediction and control. We know exactly why a weight exists (gradient updates), yet we still care about what it does now. The legibility of logs does not revive the etiological account; it merely highlights its irrelevance for forward-looking explanation. The disagreement is not about what we can know, but what we want to explain. If the goal is explaining presence, history matters. If the goal is explaining behavior, current role matters. Since functional talk in both biology and ML is predominantly used to predict behavior and intervene in systems, the epistemic access to history is a red herring. We choose causal role not because we lack logs, but because logs do not constrain current behavior tightly enough to guarantee safety or utility.

  **Modern history and pluralism**
  Pluralism suggests both accounts are valid concepts for different contexts. This is correct but requires hierarchy. Causal role is the default because it is the genus under which etiological function is a species. When selection history aligns with current role, etiological talk adds normative value regarding malfunction. When they diverge, etiological talk becomes misleading. We should not treat them as equal peers. The etiological concept is derivative because it relies on the causal role to define what was selected *for* in the first place. You cannot define selection without referencing the causal contribution that conferred fitness. Therefore, causal role is foundational. Modern history views that broaden selection to include drift do not save the etiological account; they merely dilute the selection criterion until it resembles a causal history of any kind. Pluralism holds only if we acknowledge that causal role is the primary lens for mechanistic explanation, while etiological accounts are secondary historical annotations. We do not need two ontologies; we need one functional ontology with a historical metadata tag.

  **Verdict, and what it implies back in biology**
  The causal-role account wins. It captures the explanatory work function talk actually performs in predictive and interventionist contexts, whereas the etiological account collapses into historical description. This verdict forces a revision in biology. Biologists must stop treating selection history as the sole validator of function. When a trait is exapted, it acquires function immediately, not after a new period of selection ratifies it. The heart's function is pumping blood even if it evolved for heat exchange, provided it currently pumps blood. This shift removes the artificial lag between utility and functional ascription. It also clarifies malfunction. Malfunction is not failing to meet historical standards; it is failing to contribute to the system's capacity in the expected way. This aligns biology with engineering and medicine, where current performance dictates diagnosis. The etiological account protects a normative intuition about "proper" function, but that intuition is a relic of design arguments misplaced into natural selection. In both silicon and carbon, function is what a thing does, not what its ancestors did. Accepting this dissolves the tension around exaptation and spurious correlations. It grounds function in the physical reality of the system's current operation, making it a robust tool for science rather than a metaphysical debate about history.
