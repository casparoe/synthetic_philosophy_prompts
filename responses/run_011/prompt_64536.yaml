  # JOINT STATEMENT ON THE FRAME PROBLEM
  **Parties:** Computationalist Representation Theory (Party A) and Embodied Cognition Theory (Party B)
  **Date:** October 2023
  **Status:** Adversarial Collaboration Record

  ## 1. Agreed Claims

  1.  **The Narrow Problem:** Both parties agree that the original logical formulation of the frame problem—the difficulty of representing non-change without explicit negative axioms—was a specific technical bottleneck in symbolic AI that has been substantially mitigated in constrained domains by nonmonotonic logics and event-calculus formalisms.
  2.  **Behavioral Competence:** Both parties agree that contemporary learned systems exhibit robust context-sensitivity, successfully selecting actionable information from large datasets without exhaustive search, and that this behavioral success is an empirical fact requiring explanation regardless of its theoretical interpretation.
  3.  **Concession by Party A:** Party A acknowledges that current relevance-realization mechanisms (attention, embeddings, reward functions) are initialized and bounded by human designers who already possess a grasp of the relevant world; consequently, existing systems do not generate their own frame of significance from scratch but operate within a frame parasitic on human relevance.
  4.  **Concession by Party B:** Party B acknowledges that dismissing computational mechanisms as mere "relocations" risks obscuring the physical necessity of information gating; any agent, biological or artificial, must employ some mechanism to filter input, and the engineering successes of Party A demonstrate viable mechanisms for managing combinatorial explosion even if they do not ground meaning.
  5.  **Shared Ignorance:** Both parties agree that neither side currently explains how normative significance—the fact that a situation *matters* to an agent rather than merely being *processed* by it—emerges from the substrate, whether that substrate is symbolic, connectionist, or biological.

  ## 2. Disagreements Table

  | Disagreement | Party A Vocabulary (Computationalist) | Party B Vocabulary (Embodied) | Classification | Verbal Analysis |
  | :--- | :--- | :--- | :--- | :--- |
  | **Nature of Relevance** | Relevance is a functional property computed via optimization of task objectives and attention weights. | Relevance is an ontological status conferred by an organism's history of coping and bodily needs. | Genuinely Incompatible | None. A defines relevance epistemically (utility for goal); B defines it ontologically (condition for existence). Neutralizing to "selection of information" leaves substantive disagreement on *grounding*. |
  | **Source of Frame** | The frame is initialized by design but updated autonomously via interaction; the origin of the prior does not invalidate the autonomy of the update. | The frame is outsourced to the designer; the system inhabits the designer's world, not its own, rendering autonomy illusory. | Non-equivalent but Jointly Satisfiable | Depends on threshold for "autonomy." If "autonomy" means "self-updating weights," A is right. If "autonomy" means "self-generated norms," B is right. |
  | **Status of Solution** | The broad frame problem is solved when systems operate robustly in open environments without exhaustive search. | The broad frame problem remains unsolved as long as the system's relevance is externally imposed rather than internally constituted. | Verbal | **Verbal Component:** Definition of "solve." **Residual:** Whether external imposition prevents genuine agency. Once "solve" is neutralized to "achieve robust operation" vs. "achieve autonomous normativity," the disagreement is substantive. |

  ## 3. Cruxes

  **Crux 1: Outsourced vs. Acquired Relevance**
  *   **Question:** Whether a training corpus plus reward specification constitutes an externally supplied frame that invalidates agency, or merely a prior that an internal mechanism updates autonomously.
  *   **Agreed Evidence:** Training agents in environments where reward functions are sparse or derived from self-maintenance metrics (e.g., energy consumption in simulation) versus curated human tasks.
  *   **Party A Prediction:** Agents will develop relevance structures indistinguishable from human-like coping, proving relevance is acquired via interaction.
  *   **Party B Prediction:** Agents will exhibit brittle optimization lacking situational flexibility, proving relevance must be inherited from biological needs.
  *   **Commitments:** Party A abandons the claim that architecture alone suffices if agents fail to generalize beyond explicit reward. Party B abandons the claim that biological needs are necessary if agents demonstrate novel coping strategies unseen in the reward function.

  **Crux 2: Error About Relevance**
  *   **Question:** Whether a system can be wrong about relevance in a way not tracked by any failure of its own objectives.
  *   **Agreed Evidence:** Cases where a system maximizes its objective function but violates unstated contextual norms (e.g., efficiency vs. appropriateness vs. safety).
  *   **Party A Prediction:** These are specification errors, not relevance errors; relevance is defined entirely by the objective function.
  *   **Party B Prediction:** These cases prove relevance cannot be fully specified objectively; the system is blind to the situation itself.
  *   **Commitments:** Party A admits relevance exceeds objective specification if systems consistently fail on unstated norms despite optimal reward performance. Party B admits relevance can be computationally specified if systems adhere to unstated norms without explicit penalty.

  **Crux 3: Narrow-to-Broad Transfer**
  *   **Question:** Whether technical solutions to the narrow problem (bookkeeping) transfer to the broad problem (relevance), or whether the two have been conflated.
  *   **Agreed Evidence:** Scaling narrow solvers to open-ended environments without human intervention or curated data.
  *   **Party A Prediction:** Performance will degrade gracefully; mechanisms scale via complexity management.
  *   **Party B Prediction:** Performance will collapse catastrophically; mechanisms rely on hidden human context that vanishes in open-endedness.
  *   **Commitments:** Party A abandons the scaling hypothesis if catastrophic failure occurs. Party B abandons the collapse hypothesis if graceful degradation holds over extended operational periods.

  **Crux 4: Substrate Independence (Added)**
  *   **Question:** Whether the physical substrate (biological body vs. computational hardware) is constitutive of relevance or merely incidental.
  *   **Agreed Evidence:** Comparing performance of embodied agents (robotics with physical constraints) vs. disembodied agents (pure simulation) on tasks requiring physical coping.
  *   **Party A Prediction:** No significant difference in relevance-realization capability once sensorimotor loops are closed, regardless of substrate.
  *   **Party B Prediction:** Embodied agents will show superior situational understanding because relevance is articulated by physical vulnerability.
  *   **Commitments:** Party A admits substrate matters if disembodied agents fail catastrophically where embodied ones succeed. Party B admits substrate is incidental if disembodied agents match embodied coping capabilities.

  ## 4. Assessment

  Approximately 40% of the dispute is verbal, centering on the definitions of "solution," "agency," and "relevance." Party A uses these terms functionally (success in task), while Party B uses them ontologically (grounding of meaning). Once these definitions are neutralized, a substantive residue remains regarding whether computation can generate normative significance without biological inheritance.

  The dispute is not a single disagreement but a bundle of three distinct claims: (1) an empirical claim about the scalability of current architectures (Crux 3); (2) a metaphysical claim about the necessity of biological substrate for meaning (Crux 4); and (3) a normative claim about whether external design input invalidates autonomy (Crux 1). These have been conflated, causing parties to talk past one another; separating them reveals that Party A may win the empirical claim while losing the metaphysical one, or vice versa.

  Crux: Whether relevance is computed or inherited
