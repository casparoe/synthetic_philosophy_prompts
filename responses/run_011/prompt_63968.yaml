answer: |-
  # The Therapy/Enhancement Logical Space

  Below are the six empirical questions that define the logical space. Answering them creates a coordinate for any ethical position. Following the questions is the Decision Tree that navigates this space, the resulting Leaves (positions), and the Empty Cells (combinations no one occupies).

  ## The Six Axes (Questions)
  *Answer these based on the case file, not metaphysics.*

  1.  **Baseline:** Is the claim for intervention based on falling below **species-typical statistical function**? (Yes/No)
  2.  **Moral Weight:** Does the therapy/enhancement line carry **intrinsic moral weight**? (Yes/No)
  3.  **Positionality:** Is the benefit significantly reduced if **everyone accesses it**? (Yes/No)
  4.  **Locus:** Would the patient be unimpaired if **social attitudes/accessibility changed** instead of their body? (Yes/No)
  5.  **Givenness:** Does moral permissibility depend on the capacity being **"given" rather than "made"**? (Yes/No)
  6.  **Trajectory:** Is the goal to **restore a prior state** or achieve a **new state**? (Restore/New)

  ***

  ## The Decision Tree

  **Q1: Is the claim based on falling below species-typical statistical function?**
  *   **YES** → Go to **Q2**.
  *   **NO** → Go to **Q3**.

  **Q2: Does the therapy/enhancement line carry intrinsic moral weight?**
  *   **YES** → **Leaf 1: Normal Function (Boorse/Daniels)**
  *   **NO** → **Leaf 2: Administrative (Insurance Committee)**

  **Q3: Is the benefit significantly reduced if everyone accesses it?**
  *   **YES** → **Leaf 3: Positional Goods (Arms-Race)**
  *   **NO** → Go to **Q4**.

  **Q4: Would the patient be unimpaired if social attitudes/accessibility changed?**
  *   **YES** → **Leaf 4: Disability Studies Critique**
  *   **NO** → Go to **Q5**.

  **Q5: Does moral permissibility depend on the capacity being "given" rather than "made"?**
  *   **YES** → **Leaf 5: Giftedness/Mastery**
  *   **NO** → Go to **Q6**.

  **Q6: Is the goal to restore a prior state or achieve a new state?**
  *   **Restore** → **Leaf 6: Individual Baseline Restoration**
  *   **New** → **Leaf 7: Transhumanist**

  ***

  ## The Leaves (Positions)

  **Leaf 1: Normal Function (Boorse/Daniels)**
  *   **Coordinates:** Q1:Yes, Q2:Yes, Q3:No, Q4:No, Q5:No, Q6:Restore.
  *   **Awkward Commitment:** Must classify statistically rare but healthy high-functioning individuals as "enhanced" rather than "healthy."
  *   **Case Sort:** **Case 1 (Hearing+):** Ruled *enhancement* (not medically necessary), whereas Leaf 7 permits it and Leaf 4 questions the norm.

  **Leaf 2: Administrative (Insurance Committee)**
  *   **Coordinates:** Q1:Yes, Q2:No, Q3:No, Q4:No, Q5:No, Q6:Restore.
  *   **Awkward Commitment:** Admits the line is arbitrary but enforces it anyway to prevent budget exhaustion.
  *   **Case Sort:** **Case 3 (Growth Hormone):** Ruled *not covered* (statistically normal), whereas Leaf 3 might cover it (competitive advantage) and Leaf 6 might cover it (if prior growth was higher).

  **Leaf 3: Positional Goods (Arms-Race)**
  *   **Coordinates:** Q1:No, Q2:Yes/No, Q3:Yes, Q4:No, Q5:No, Q6:New.
  *   **Awkward Commitment:** Must oppose universal access to beneficial interventions because scarcity creates the value.
  *   **Case Sort:** **Case 2 (Modafinil):** Ruled *problematic* (creates unfair vigilance advantage), whereas Leaf 7 encourages it and Leaf 1 ignores it (not health-related).

  **Leaf 4: Disability Studies Critique**
  *   **Coordinates:** Q1:No, Q2:Yes, Q3:No, Q4:Yes, Q5:No, Q6:N/A.
  *   **Awkward Commitment:** Must treat some physical impairments as socially constructed even when the patient experiences physical pain.
  *   **Case Sort:** **Case 4 (Deaf Child):** Ruled *permissible/neutral* (cultural identity), whereas Leaf 1 forbids it (harm to function) and Leaf 5 forbids it (violates givenness).

  **Leaf 5: Giftedness/Mastery**
  *   **Coordinates:** Q1:No, Q2:Yes, Q3:No, Q4:No, Q5:Yes, Q6:New.
  *   **Awkward Commitment:** **Note:** Virtue Ethics objections to self-perfection land here; this view cannot distinguish between a "gifted" natural talent and a "made" surgical correction if the outcome is identical.
  *   **Awkward Sentence:** Must condemn life-saving genetic editing if it closes the "open future" of the child, prioritizing the gift over the survival.
  *   **Case Sort:** **Case 6 (Propranolol):** Ruled *impermissible* (alters given memory), whereas Leaf 7 permits it (well-being) and Leaf 6 permits it (restoration of pre-crash state).

  **Leaf 6: Individual Baseline Restoration**
  *   **Coordinates:** Q1:No, Q2:Yes, Q3:No, Q4:No, Q5:No, Q6:Restore.
  *   **Awkward Commitment:** Must permit enhancing a patient beyond species-typical norms if that matches their personal history (e.g., a genius recovering from injury).
  *   **Case Sort:** **Case 8 (SSRI/Psychedelic):** Ruled *permissible* (aiming at pre-depression well-being), whereas Leaf 1 forbids it (above species baseline) and Leaf 2 denies coverage (not medically necessary).

  **Leaf 7: Transhumanist**
  *   **Coordinates:** Q1:No, Q2:No, Q3:No, Q4:No, Q5:No, Q6:New.
  *   **Awkward Commitment:** Cannot object to any intervention on principle, only on risk/benefit grounds, erasing the therapy/enhancement distinction entirely.
  *   **Case Sort:** **Case 7 (IR Vision):** Ruled *permissible improvement*, whereas Leaf 1 forbids it (super-normal) and Leaf 5 forbids it (unnatural mastery).

  ***

  ## Empty Cells (Unoccupied Logical Space)

  **1. The "Species-Typical Positional" Cell**
  *   **Coordinates:** Q1:Yes (Species Baseline), Q3:Yes (Positional).
  *   **Status:** **Incoherent.** If a function is required for species-typical normality (e.g., basic vision), its value is absolute, not dependent on others lacking it. A view claiming basic health is a positional good collapses into the Arms-Race view (Leaf 3) which rejects species-typical baselines.

  **2. The "Social Giftedness" Cell**
  *   **Coordinates:** Q4:Yes (Social Locus), Q5:Yes (Givenness Matters).
  *   **Status:** **Coherent but Unexplored.** This would argue that social structures are "given" and should not be engineered (e.g., "We should not accommodate disability, but accept it as fate"). No major bioethics framework advocates for fatalism regarding social structures while simultaneously advocating for bodily givenness.

  **3. The "Administrative Transhumanist" Cell**
  *   **Coordinates:** Q2:No (No Moral Weight), Q6:New (New States).
  *   **Status:** **Unattractive.** This view admits there is no moral line between therapy and enhancement but insists on keeping the administrative distinction for new states. This is pragmatically unstable; if there is no moral difference, insurance committees (Leaf 2) would eventually cover enhancements, merging Leaf 2 and Leaf 7.

  ***

  ## Dropped Axes
  *   **"Is health intrinsically valuable?"** Dropped as metaphysical. Replaced by **Q2 (Moral Weight)**, which asks if the *distinction* matters, not the value of health itself.
  *   **"Is it natural?"** Dropped as redundant. Covered by **Q5 (Givenness)**, which separates "born with it" from "built" without relying on the vague concept of nature.
  *   **"Is it safe?"** Dropped. Safety is a constraint on all views, not a separator between them.
