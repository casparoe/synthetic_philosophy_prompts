          *   Chapter 19: Ex-student (Sergeant) presents a theory explaining all three cleanly. Everyone claps.
          *   Her Reaction: She doesn't move. The joke lands here.
      *   **Theoretical Core:** The "Old Evidence Problem" in Bayesian confirmation theory. If $P(E) = 1$ (she already knew the evidence), conditionalizing on $E$ cannot raise credence in $H$ (the hypothesis/theory). Therefore, the theory is worth nothing to her formally. Alternatively, the joke could be about learning that the theory *entails* the evidence.
      *   **Role:** Comedy writer with a PhD in Philosophy of Science (strong opinions on setups/priors).
      *   **Output Structure:**
          1.  Short brainstorm (3-4 joke structures, one line each, flagging logic-dependence).
          2.  Write the winner as dialogue + stage directions.
