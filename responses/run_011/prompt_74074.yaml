answer: |-
  This is a sophisticated reconstruction. You have captured the broad arc of Davidson's argument accurately, particularly the move from the identification of schemes with languages to the collapse of the scheme-content dualism. However, there are specific technical distortions in your summary that matter for the three questions you are asking.

  Here is an account of where your reconstruction distorts Davidson, followed by answers to your three specific questions.

  ### Part 1: Distortions in the Reconstruction

  **1. The Nature of Translation (Step 1)**
  You write: *"translation maps the sentences of one language onto true sentences of the other."*
  **Distortion:** This is the most significant technical error. Davidson does not claim translation maps sentences onto *true* sentences. It maps sentences onto sentences *with the same truth value*. If I utter a falsehood ("The moon is made of cheese"), a correct translation maps this to a falsehood in your language, not a truth.
  **Why it matters:** Davidson's theory of meaning is truth-conditional. To know the meaning of a sentence is to know the conditions under which it is *true*. Translation preserves truth *conditions* (or truth values relative to a context), not truth *simpliciter*. If translation required mapping everything to true sentences, communication about errors or falsehoods would be impossible. The relativist relies on the idea that different schemes carve up truth differently; Davidson argues that the *structure* of truth (the T-sentence format: 'S' is true iff p) is invariant, even if specific beliefs differ.

  **2. The Status of "Speech" (Step 2)**
  You write: *"recognizing some behaviour as speech already is interpreting it."*
  **Distortion:** This is slightly too weak. Davidson's claim is that recognizing behavior as *linguistic* (as opposed to mere noise or reflex) requires assigning *propositional content* to it. You cannot identify a sound as a "sentence" without having a theory about what the speaker *holds true* and what those sentences *mean*.
  **Why it matters:** This strengthens the argument against total failure. It's not just that we interpret speech; it's that the *criteria* for something counting as a language (having structure, reference, predication) are the same criteria required for translation. There is no "pre-interpretive" stage where we identify a language and *then* check for translatability. Identification and translation are simultaneous.

  **3. The "Residue of Belief" (Step 2)**
  You write: *"a residue nobody could translate is... not a residue of belief at all."*
  **Distortion:** Davidson would say it is not a residue of *language* or *conceptual scheme* at all. Belief is a propositional attitude. If there are no words (public signs) to which we can assign truth conditions, there is no evidence for propositions, and thus no evidence for beliefs.
  **Why it matters:** This clarifies the target. Davidson isn't saying people in other cultures don't have beliefs; he is saying that if we can interpret them as having beliefs, we have already translated them. The "untranslatable residue" is an empty concept, not a hidden stash of beliefs we can't reach.

  ---

  ### Part 2: Answers to Your Three Questions

  #### 1. Is the "translation preserves truth" premise doing argumentative work, or can the relativist opt out?

  The premise that translation preserves truth (specifically, truth conditions) is doing heavy **constitutive work**, and the relativist cannot simply decline it without abandoning the idea of a *conceptual scheme* altogether.

  *   **Why the relativist can't opt out:** Davidson argues that the very notion of a "concept" or a "belief" implies something that can be true or false. If you define a scheme not as a language but as "the role concepts play within a total theory," you still face the problem of identifying those roles. How do we identify the roles? Only through public behavior (language). Once you are in the business of identifying content via behavior, you are in the business of radical interpretation. Radical interpretation *requires* a truth-conditional structure (Tarski's Convention T).
  *   **The Trap:** If the relativist says, "Schemes are not languages, so intertranslatability is the wrong test," Davidson asks: "Then what is the evidence for the scheme?" If there is no behavioral/linguistic evidence, the scheme is an occult entity (a "myth"). If there *is* behavioral evidence, it must be interpretable. If it is interpretable, it is translatable.
  *   **Conclusion:** The truth-preservation premise isn't an arbitrary rule Davidson imposes; it is his analysis of what *meaning* is. To have a scheme is to have a language; to have a language is to have a truth-conditional structure; to share a truth-conditional structure is to be intertranslatable.

  #### 2. Regarding partial failure: Is the target its impossibility, or only its indistinguishability?

  This is the subtlest point in the essay. Davidson is arguing for **impossibility** (conceptual incoherence), not merely **indistinguishability** (epistemic limitation).

  *   **The Epistemic Reading (Indistinguishability):** This would suggest that there *might* be untranslatable sentences, but we could never know it because any attempt to find them looks like disagreement.
  *   **The Constitutive Reading (Impossibility):** Davidson's holism argues that belief and meaning are interdependent. We fix the meaning of a speaker's words by assuming their beliefs are largely true (Charity). If we encounter a sentence we cannot translate, we cannot assign it a truth condition. If it has no truth condition, it is not a sentence expressing a belief.
  *   **The Argument:** Davidson argues that "partial failure" sufficient to constitute a *different scheme* collapses into one of two things:
      1.  **Total Failure:** Which is incoherent (as per Step 2 of your reconstruction).
      2.  **Local Disagreement:** Which presupposes a shared background of agreement (a shared scheme).
  *   **Why it's Impossibility:** For Davidson, there is no "fact of the matter" about meaning beyond what is accessible to an interpreter. If an ideal interpreter cannot translate it, there is no meaning there to be untranslated. Therefore, a "partially untranslatable scheme" is not a thing we can't see; it is a contradiction in terms, like a "married bachelor." It is not that we can't tell the difference between a different scheme and a disagreement; it is that the conditions for identifying a scheme *are* the conditions for translating it.

  #### 3. Is Charity a premise or a consequence? Do "massive error" and "relativism" come apart?

  **Charity: Consequence of Interpretation**
  Charity is not a benevolent premise we *choose* to assume (e.g., "Let's be nice and assume they are rational"). It is a **constitutive constraint** on the possibility of interpretation.
  *   Davidson argues that belief is "veridical by nature." To have a belief is to have a grasp of the world. You cannot have a system of beliefs that is mostly false, because to identify what the beliefs *are about*, you must correlate them with the objects and events in the world that cause them. If the correlation is mostly wrong, you haven't identified beliefs; you've identified noise.
  *   Therefore, Charity falls out of what interpretation *requires*. You cannot interpret without maximizing agreement.

  **Massive Error vs. Relativism**
  In Davidson's framework, these two claims **do not come apart**.
  *   **Relativism** depends on the possibility of alternative conceptual schemes.
  *   **Alternative Schemes** imply that there are true sentences in Scheme B that are untranslatable (and thus neither true nor false) in Scheme A.
  *   **Massive Error:** If we try to interpret Scheme B from Scheme A, and we find we cannot translate large chunks of it, we are forced to regard the speakers as holding beliefs that are radically false by our lights (or unintelligible).
  *   **The Link:** Davidson argues that the unintelligibility of massive error *is* the refutation of relativism. If we must assume general agreement to identify beliefs (Charity), then we cannot identify a set of beliefs that diverges massively from ours. If we cannot identify such a set, there is no alternative scheme.
  *   **Nuance:** One could argue (and some critics do) that Davidson conflates *epistemic access* with *metaphysical possibility*. A critic might say: "Maybe there *is* massive error or a different scheme, but we just can't understand it." Davidson's reply is the "no fact of the matter" point: meaning is not hidden in the head; it is constituted by interpretive relations. If it can't be interpreted, it isn't there.

  ### Summary for your stalled point
  You stalled because the move from "total failure is impossible" to "partial failure is impossible" relies on **Holism**.

  Davidson's logic is:
  1.  Beliefs and Meanings are holistically connected (you can't have one without a network of the other).
  2.  To identify that network, we must assume mostly shared truths (Charity).
  3.  Therefore, any "partial failure" of translation is just a local breakdown within a shared holistic network (disagreement), not evidence of a separate network (scheme).
  4.  If the failure were large enough to suggest a separate network, we would lose the foothold required to identify it as a network at all (sliding back into total failure).

  The "residue" the relativist wants is a set of beliefs that are *systematically* untranslatable. Davidson says systematic untranslatability destroys the status of those items as beliefs. Thus, the "partial failure" option vanishes.
