answer: |-
  **Project Title:** The Hitchhiker's Divide: Unifying Act and Disposition in Decision Theory

  **Research Question**
  Does Parfit's Hitchhiker case sustain a unified norm of rationality across disposition formation and action execution, or does it enforce a dichotomy that undermines act-based decision theories? Specifically, can a single decision-theoretic framework validate both the rationality of cultivating a paying disposition and the rationality of paying itself once safe in town, or does the case necessitate a split between "global" and "local" rationality that functional decision theories (FDT/TDT) cannot bridge?

  **Problem Statement and Literature Gap**
  The Hitchhiker case is pivotal in two distinct literatures that currently talk past one another. In contemporary decision theory (CDT/EDT/FDT), the case demonstrates that only theories allowing the *act* of paying to be rational succeed; if paying is irrational at the moment of choice, the theory fails the case. Conversely, in Parfit's original formulation, the case illustrates "rational irrationality": it is rational to cultivate a disposition to pay, but the act of paying itself is locally irrational once the benefit (security) is secured. 

  Current resources leave this tension unresolved. **Resolute Choice** models (e.g., McClennen) allow agents to stick to plans but struggle to justify the rationality of the resolution at the node of choice without begging the question. **Global or Dispositional Evaluations** sidestep the problem by assessing the life-plan rather than the act, but this fails to guide the agent at the ATM, rendering the theory action-guidingly inert. Treating the case as a cousin of the **Toxin Puzzle** (Kavka) is insufficient; the Toxin Puzzle lacks the predictor's dependency on the *actual performance* of the act, which is central to the Hitchhiker's decision-theoretic force. Finally, **constitutive aim ("schmagency")** replies may dissolve the normativity entirely, but they do not reconcile the conflicting demands placed on "rationality" by Parfit versus FDT proponents. 

  Consequently, it remains unknown whether FDT/TDT succeeds by finding a unified notion of rationality or by surreptitiously importing dispositional norms into act evaluation. This project determines which.

  **Work Plan (Semester Timeline)**
  *   **Month 1: Reconstruction and Mapping.** Formalize the two competing interpretations of the Hitchhiker case. Reconstruct the FDT/TDT argument that paying is act-rational and contrast it with Parfit's argument that paying is locally irrational. Identify the precise definition of "rationality" operative in each.
  *   **Month 2: Critique of Standard Solutions.** Systematically evaluate Resolute Choice, Global Evaluation, and Toxin-based analogies against the mapped interpretations. Draft analysis showing why these fail to unify the norms.
  *   **Month 3: The FDT/TDT Test.** Analyze whether Functional/Timeless Decision Theory genuinely validates the *act* of paying or merely the *algorithm*. Determine if their solution collapses the act/disposition distinction or relies on it.
  *   **Month 4: Argument Development.** Construct the positive argument for either unity or bifurcation. If bifurcation is required, delineate the consequences for normative guidance. If unity is possible, specify the required modification to decision theory.
  *   **Month 5: Implications and Objections.** Stress-test the result against counterexamples (e.g., Blackmail cases, Newcomb variants). Assess the impact on the broader FDT/TDT programme if a split is forced.
  *   **Month 6: Writing and Revision.** Complete the draft manuscript for submission.

  **Expected Results**
  A successful result will yield a manuscript demonstrating either: (1) A unified account showing how a specific decision theory validates both cultivation and execution without equivocation, or (2) A proof that the case forces a split between dispositional and act-rationality, implying that FDT/TDT succeeds only by redefining "act" to include dispositional history. Either outcome clarifies the normative structure of decision theory.

  **Failure Conditions**
  The project will be deemed unsuccessful if: (1) The distinction between "act-rationality" and "disposition-rationality" proves to be merely verbal, collapsing under formal scrutiny; (2) Existing literature already resolves the tension implicitly, rendering the proposed distinction redundant; or (3) The analysis reveals that the Hitchhiker case is too under-specified to bear the weight of these competing interpretations, requiring abandonment of the case in favor of a different puzzle. The primary risk is manufacturing a distinction where none exists; this will be mitigated by grounding the analysis in formal decision matrices rather than intuitive appeals.
