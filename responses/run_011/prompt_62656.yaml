answer: |-
  ### Exam Question: The Transparency Trap

  **Question 4 (25 Points)**

  The Regional Environmental Agency must adopt one of two waste-management regulations by Friday: **Regulation Alpha** or **Regulation Beta**. The efficacy of these regulations depends on the underlying toxicity of the local soil, which is either **High** ($\theta_H$) or **Low** ($\theta_L$). Based on current data, the Agency assigns a prior probability $P(\theta_H) = 0.5$.

  The expected utility payoffs (in millions of dollars) for each regulation given the state of the soil are as follows:

  | | $\theta_H$ (High Toxicity) | $\theta_L$ (Low Toxicity) |
  | :--- | :---: | :---: |
  | **Alpha** | 100 | 0 |
  | **Beta** | 40 | 40 |

  The Agency has the option to commission a geological study on Wednesday. The study costs **$0 in budget resources** and yields perfect information regarding the soil toxicity by Thursday morning. The Agency is a rational expected-utility maximizer and will conditionalize on any information received.

  However, there is a procedural constraint: By law, any commissioned study becomes public record immediately upon completion. Political analysts have determined that **Regulation Alpha is only politically viable if the study is *not* conducted.** If the study is conducted, public scrutiny renders Regulation Alpha unavailable, regardless of the study's findings. Regulation Beta remains available in all scenarios.

  1.  Calculate the expected utility of commissioning the study versus not commissioning the study. What should the Agency do? (10 points)
  2.  I.J. Good's theorem states that the expected value of free information is never negative; that is, a costless observation cannot leave a rational agent worse off than ignoring it, provided they maximize expected utility on what they learn. Does this case refute Good's theorem? Explain your answer by identifying precisely which assumption of the theorem is violated here. (15 points)

  ***

  ### Model Answer

  **1. Decision Analysis**

  First, we calculate the expected utility (EU) of the decision without the study (Ignorance).
  $$EU(\text{Alpha}) = 0.5(100) + 0.5(0) = 50$$
  $$EU(\text{Beta}) = 0.5(40) + 0.5(40) = 40$$
  In the absence of the study, the Agency maximizes utility by choosing **Alpha**, yielding an EU of **50**.

  Next, we calculate the EU of commissioning the study (Information). Since the study provides perfect information, the Agency will choose the optimal act for the revealed state. However, the act set is constrained.
  *   If $\theta_H$ is revealed (prob 0.5): Alpha is unavailable. The Agency must choose Beta. Payoff = 40.
  *   If $\theta_L$ is revealed (prob 0.5): Alpha is unavailable. The Agency must choose Beta. Payoff = 40.

  $$EU(\text{Study}) = 0.5(40) + 0.5(40) = 40$$

  Comparing the two options: $EU(\text{No Study}) = 50$ and $EU(\text{Study}) = 40$. The Agency should **not commission the study**. Despite the study being budget-costless and perfectly accurate, acquiring the information reduces expected utility by 10 million.

  **2. Diagnosis of Good's Theorem**

  This case does **not** refute Good's theorem. Good's theorem is a mathematical result derived from specific axioms of Bayesian decision theory. When a counter-example appears, it indicates that one of the theorem's necessary conditions (hypotheses) has failed to obtain in the scenario, not that the mathematics of the theorem are incorrect. To claim the theorem is refuted is to misunderstand the nature of formal theorems; they are conditional truths.

  Good's theorem relies on the assumption that the agent chooses an act from a **fixed set of available acts** ($A$) after observing the evidence, just as they would have without the evidence. Formally, the theorem assumes that the set of acts available after observing evidence $E$ is identical to the set of acts available without observing $E$. The value of information arises because the agent can map different acts to different states of the world ($f: S \to A$), whereas without information, they must choose a single act for all states.

  In this scenario, the **Fixed Act Set** assumption is violated. The availability of Regulation Alpha is causally dependent on the decision to acquire information.
  *   In the "No Study" branch, $A = \{\text{Alpha, Beta}\}$.
  *   In the "Study" branch, $A' = \{\text{Beta}\}$.

  Because the act set shrinks upon observation, the agent loses the ability to capitalize on the information. Even though the Agency *would* prefer Alpha in the High Toxicity state, the information acquisition itself forecloses that option. The "cost" of the information is not budgetary (which was zero) but structural: the loss of access to a high-value act.

  Furthermore, one might argue this violates the assumption that the **Utility Function** is independent of the observation method. Here, the political viability (and thus the effective utility/feasibility) of Alpha changes based on the transparency caused by the study. However, the most precise diagnosis is the violation of the Fixed Act Set. Good's theorem proves that $EV(\text{info}) \geq 0$ *ceteris paribus*. Here, the *ceteris paribus* condition regarding available actions does not hold. Therefore, the theorem is inapplicable, not false. The rational choice to remain ignorant is consistent with Bayesian decision theory once the changing act set is modeled correctly.

  ***

  ### Marking Scheme (Total: 25 Points)

  **Part 1: Calculation (10 Points)**
  *   **Correct EU(No Study):** 5 points. (Must identify Alpha as optimal choice with EU 50).
  *   **Correct EU(Study):** 5 points. (Must identify that Alpha is unavailable in this branch, forcing Beta, EU 40).
  *   *Deduction:* -2 points if they conclude the Study is better despite the math.
  *   *Deduction:* -5 points (Major Error) if they assume Alpha is available after the study (ignoring the political constraint).

  **Part 2: Theoretical Diagnosis (15 Points)**
  *   **Verdict on Good's Theorem:** 5 points.
      *   **5 pts:** Explicitly states the theorem is **not refuted** / remains valid / is inapplicable.
      *   **0 pts:** Claims the theorem is false, refuted, or wrong. (This is an automatic fail for the section).
  *   **Identification of Violated Assumption:** 5 points.
      *   **5 pts:** Correctly identifies the **Fixed Act Set** assumption (or equivalent: availability of acts depends on information).
      *   **3 pts:** Vaguely identifies "constraints" or "political costs" without linking to the theorem's formal assumptions.
      *   **0 pts:** Fails to identify an assumption.
  *   **Explanation of "Cost":** 5 points.
      *   **5 pts:** Explains that "zero budget cost" $\neq$ "zero total cost." Identifies the loss of the act as the opportunity cost/structural cost.
      *   **0 pts (Major Error):** Treats the budget cost as the only relevant cost. (e.g., "Since the study was free, Good's theorem should have held.")

  **Differentiation (A vs. B)**
  *   **A Range (21-25):** Flawless calculation. Explicitly names the "Fixed Act Set" assumption. Clearly distinguishes between the theorem being *false* versus *inapplicable*. Articulates that the "cost" is the structural restriction on agency, not monetary.
  *   **B Range (16-20):** Correct calculation. States theorem is not refuted. Identifies that the act set changes but may use imprecise terminology (e.g., "rules changed" instead of "fixed act set assumption"). May slightly conflate utility changes with act availability.
  *   **C Range (11-15):** Correct calculation but claims the theorem is refuted. OR, Incorrect calculation (misses the act constraint) but gives a coherent philosophical explanation of why information *might* be bad.
  *   **Fail (0-10):** Incorrect calculation and claims the theorem is refuted. Or fails to engage with the theorem's assumptions.

  **Specific Traps to Penalize:**
  1.  **The "Free Lunch" Error:** If the student argues the study *should* have been taken because it was budget-free, cap Part 2 at 5 points. They have missed the core lesson on non-monetary costs of information.
  2.  **The "Math is Broken" Error:** If the student concludes Good's Theorem is false, cap Part 2 at 5 points regardless of calculation accuracy. This demonstrates a category error regarding formal theorems.

  ***

  ### Meta-Commentary

  **Confidence Level:** 90%

  **Vulnerable Claim:**
  The single claim in the marking scheme I would least want held against me is the strict categorization of the violation as **"Fixed Act Set"** rather than **"State-Independent Utilities."**

  *Reasoning:* One could argue that the *utility* of Alpha drops to $-\infty$ (or becomes undefined) once the study is run due to political backlash, rather than the *act* itself disappearing. In formal decision theory, an act with utility $-\infty$ is effectively unavailable, so the distinction is often semantic. However, Good's Theorem is standardly taught as requiring the set of feasible acts to be independent of the experiment. If a grader argues that the utility function shifted (political viability is a utility modifier) rather than the act set, my scheme penalizes them for not saying "Fixed Act Set." While I believe "Fixed Act Set" is the cleaner pedagogical diagnosis for this specific prompt, a sophisticated philosopher could argue the constraint operates on the utility function $U(a, s, \text{info})$, making the utility dependent on the information state. My scheme privileges the standard textbook formulation over a more granular functional analysis.
