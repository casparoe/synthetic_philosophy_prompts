answer: |-
  **Transcript of Advisory Debate: Grade 7 Mathematics Curriculum Committee**
  **Topic:** Structural Sequencing of Unit 1 (Ratios and Proportional Reasoning)
  **Participants:** Dr. Elena Rosetti (Educational Philosophy) and Dr. Marcus Thorne (Learning Sciences)
  **Moderator:** Committee Chair (Silent)

  **Dr. Rosetti:** Marcus, we are proposing to begin a child's formal encounter with proportionality by handing them a definition and a algorithm. Whitehead warned us explicitly about this sixty years ago. He called it the deposition of "inert ideas." If we start the six-week block with direct instruction on cross-multiplication and unit rates, we are teaching precision before romance. We are asking students to manipulate symbols for relationships they have not yet felt. The result is predictable: a student who can solve for *x* in $\frac{3}{4} = \frac{x}{12}$ but cannot tell you why a recipe doubles or why a map scale matters. That is not education; it is training. And it is the primary reason students disengage by eighth grade.

  **Dr. Thorne:** Elena, I respect Whitehead, but I must respect the limits of the human working memory more. You speak of "feeling" the relationship. For a novice seventh-grader, "feeling" a ratio often means flailing through unstructured exploration. Cognitive load theory is clear: novices do not have the schemas to process open-ended inquiry. When you ask a child to "discover" proportionality through a complex project without first providing worked examples, you exceed their cognitive capacity. They aren't discovering math; they are drowning in arithmetic. Research shows novices learn more from studying a completed solution than from generating one. If we want equity, we cannot rely on a "romance" phase that assumes a child has the background knowledge to find the pattern.

  **Dr. Rosetti:** But that is exactly the trap! You argue that structure protects the novice, but I argue that meaningless structure isolates them. If precision comes first, the knowledge remains inert. It is received but never used or tested. You say worked examples build schemas. I say they build dependencies. If the child has not first seen the *need* for the tool—the romance of the problem—the tool has no handle. They will hold it by the blade.

  **Dr. Thorne:** I need to stop you there, because this is the strongest version of your charge, and I take it seriously. You fear my students will be robots who cross-multiply without understanding. But you are conflating "direct instruction" with "mindless drilling." In my framework, preventing inert ideas isn't about delaying procedure; it's about how the procedure is taught. A worked example is not just steps. It is a step-by-step demonstration *with conceptual commentary*. I show them *how* to scale the recipe, but I explicitly narrate *why* the ratio remains constant.

  The fluency *is* the prerequisite for the understanding you want. You cannot think deeply about proportional reasoning if you are still struggling to calculate the unit rate. Automatization frees up working memory. Once the procedure is fluent, *then* we have the cognitive space for the "generalization" Whitehead talks about. If I wait for "romance" before teaching the algorithm, I am withholding the very tool that allows the student to engage with the complexity.

  **Dr. Rosetti:** And I must concede a point to you, Marcus, regarding who benefits from my "romance." If I design a six-week opening that relies on inquiry, on "sensing" the mathematics through context, I am quietly advantaging the pupils who arrive already fluent from home. The child whose parents talk about rates at the grocery store will thrive in my open exploration. The child who does not will feel lost. Waiting for "felt interest" is not a plan for a child who has been taught to hate math. If "romance" is interpreted as "wait until they are curious," I am failing the most vulnerable.

  However, Whitehead does not mean a six-week block of play followed by six weeks of drill. He argues the phases interweave and recur at every scale. A single lesson can have a rhythm. My objection is to the *unit* design that front-loads precision. You are optimizing for the short-term metric of procedural accuracy. I am optimizing for the long-term metric of transfer.

  **Dr. Thorne:** That is a fair concession, and I will meet it. I agree that the "Expertise Reversal Effect" suggests we cannot treat these seventh-graders as permanent novices. As they gain fluency, the scaffolding must fade. If I continue to provide worked examples after they have mastered the schema, I am indeed hindering them. And I agree with your reading of Whitehead that the phases cycle. I am not proposing six weeks of nothing but algorithms.

  But here is where we diverge on the evidence. You claim precision-first manufactures inert ideas. I claim that *inadequate* precision prevents transfer. The research on novice learning suggests that undirected exploration leads to the construction of incorrect mental models that are hard to unlearn. If a student "discovers" a shortcut that only works for integers, they have learned a misconception. Direct instruction prevents the formation of inert *misconceptions*.

  **Dr. Rosetti:** Yet, if the student learns the algorithm without the "romance" of the problem space, they possess what Whitehead calls "knowledge that is never thrown into fresh combinations." They pass the test, but they cannot apply the ratio to a science class or a budget.

  **Dr. Thorne:** But how do they throw it into fresh combinations if they don't have the combination locked in? Procedural fluency *makes* later transfer possible. You cannot transfer what you cannot hold in your head.

  **Dr. Rosetti:** Unless the "holding" is so rigid it breaks under pressure.

  **Dr. Thorne:** Then we are down to the residual disagreement. We both hate inert knowledge. We both want transfer. We both acknowledge that the phases must cycle and that guidance must fade as expertise grows.

  **Dr. Rosetti:** Precisely. So, let us state the remainder. Our disagreement is not on the *existence* of the phases, but on the **entry point** and the **definition of understanding**.

  **Dr. Thorne:** Agreed. I argue that for a novice, understanding a procedure *is* the first step of understanding the concept. You cannot separate the tool from the task initially. I optimize for **cognitive efficiency and equity of access** to the core skill. I believe we must secure the schema before we ask for the transfer.

  **Dr. Rosetti:** And I argue that understanding a procedure without the **teleological context**—the "why"—is not understanding at all, it is mimicry. I optimize for **meaning-making and long-term retention**. I believe we must secure the context before we ask for the schema, or the schema will have nowhere to land.

  **Dr. Thorne:** So, the evidence. If we run this unit, what would change your mind, Elena?

  **Dr. Rosetti:** If, at the end of the year, your students can demonstrate transfer on novel problems—problems structurally similar to ratios but surface-level different, perhaps in a science context—at rates equal to or higher than mine, *and* they retain this ability over the summer break... I would concede that your sequencing did not produce inert ideas. I would need to see that the "precision first" did not kill the capacity for "generalization" later.

  **Dr. Thorne:** And I would accept your design if your students can match my students on **procedural fluency measures** in the first eight weeks, without requiring significant remediation time. If your "romance-first" approach results in a wider achievement gap on standard computational metrics by the first interim assessment, I must conclude that the cognitive load was too high for the novices. I need to see that the "felt interest" translated into **schema acquisition** at a pace that keeps the class together.

  **Dr. Rosetti:** So we agree: We are measuring the same outcome—mathematical power—but we disagree on the critical path to get there. You fear the bottleneck is working memory; I fear the bottleneck is meaning.

  **Dr. Thorne:** And the only way to resolve a deadlock on critical paths is to run the trial and measure the flow.

  **Dr. Rosetti:** Then let us design the assessments now, before we design the lessons. So we cannot claim later that the data was irrelevant.

  **Dr. Thorne:** Agreed.
