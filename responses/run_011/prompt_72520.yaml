      *   *Check:* Did Elena address the "waiting for interest" charge? *Correction:* She needs to clarify that Romance is teacher-designed engagement, not waiting for the child to magically be interested. It's about the *hook*, not the whim.
      *   *Check:* Did they mention the Expertise Reversal Effect? *Yes, crucial for bridging.*
      *   *Check:* Did they mention Whitehead's cycling phases? *Yes, crucial for nuance.*

  5.  **Drafting the Dialogue (Iterative Process):**
      *   *Tone:* Professional, respectful, intellectually rigorous.
      *   *Vocabulary:* Use specific terms (inert ideas, cognitive load, schema, working memory, romance/precision/generalization, expertise reversal).
      *   *Pacing:* Build tension, then resolve into clarity.

      *(Self-Correction on the Ending)*: The prompt asks for a precise statement of residual disagreement. I need to make sure they don't just agree to disagree vaguely. It needs to be about *sequence priority* and *evidence metrics*.

  6.  **Final Polish:** Check against all constraints in the prompt.
