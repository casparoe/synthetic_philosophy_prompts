prompt: |-
  A district curriculum committee has deadlocked over how to structure the opening six weeks of a seventh-grade unit on ratios and proportional reasoning, and its two external advisers have agreed to argue the matter out on the record. Write a dialogue between them. One takes her bearings from Whitehead's account of the rhythm of education — the phases of romance, precision, and generalization, and the danger of inert ideas, knowledge that is received but never used, tested, or thrown into fresh combinations — and holds that precision taught before the pupil has felt the subject matter as interesting produces exactly that kind of dead knowledge. The other argues from what the research on novice learning, worked examples, and cognitive load supports: that undirected exploration exceeds working-memory capacity, that novices learn more from studying a completed solution than from discovering one, and that procedural fluency is what makes later transfer possible.

  Each must engage the strongest form of the other's position rather than a caricature. In particular, the direct-instruction advocate should take seriously the charge that her sequencing reliably manufactures the inert ideas Whitehead describes — pupils who can execute a cross-multiplication with no sense of what a ratio is — and say what in her own framework prevents this. The Whiteheadian should take seriously the charge that romance-first design quietly advantages the pupils who arrive already fluent from home, and that waiting for felt interest is not a plan for a child who has none. Let each concede what deserves conceding, including whether the expertise reversal effect and Whitehead's own insistence that the phases interweave and recur at every scale bring the positions closer together than their partisans admit.

  Close with the two of them stating as precisely as they can where the residual disagreement lies — in the ordering of the phases, in the time allotted to each, in what counts as understanding a procedure, or in whose interests the design optimizes for — and saying what evidence about the unit's outcomes each would accept as bearing on it.
reasoning: |-
  Here's a thinking process that leads to the dialogue:

  1.  **Analyze the Request:**
      *   **Context:** A district curriculum committee deadlock over a 7th-grade unit on ratios and proportional reasoning (opening six weeks).
      *   **Characters:** Two external advisers.
      *   **Position A (Whiteheadian):** Focuses on Alfred North Whitehead's *The Aims of Education* (Rhythm of Education: Romance, Precision, Generalization). Argues against "inert ideas." Precision before interest leads to dead knowledge.
      *   **Position B (Cognitive Science/Direct Instruction):** Focuses on research on novice learning, worked examples, cognitive load theory (Sweller, etc.). Argues undirected exploration overloads working memory. Novices need structure/procedural fluency for transfer.
      *   **Requirements:**
          *   Engage the *strongest* form of the opponent's position (no strawmanning).
          *   Direct-Instruction (DI) advocate must address the "inert ideas" charge (how to prevent rote cross-multiplication without understanding).
          *   Whiteheadian must address the equity/access charge (romance-first advantages privileged kids; waiting for interest fails disengaged kids).
          *   Both must concede valid points (expertise reversal effect, Whitehead's idea that phases interweave/recur).
          *   **Ending:** Precisely state the residual disagreement (ordering, time, definition of understanding, optimization target) and what evidence would settle it.

  2.  **Character Development:**
      *   **Dr. Elena Rosetti (Whiteheadian):** Philosophical, holistic, concerned with meaning and long-term retention/application. Worried about killing curiosity.
      *   **Dr. Marcus Thorne (Cognitive Science/DI):** Empirical, structured, concerned with equity through efficiency and scaffolding. Worried about cognitive overload and achievement gaps.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Set the scene. The committee is stuck. The two advisers are stepping in to debate on the record.
      *   **Round 1: Opening Salvos.**
          *   Elena: Start with Whitehead. The danger of inert ideas. Ratios need to be *felt* before they are *formalized*.
          *   Marcus: Start with Cognitive Load. Novices aren't experts. Exploration is inefficient. Worked examples build the schema needed for later creativity.
      *   **Round 2: Engaging the Strongest Counter-Arguments.**
          *   Marcus addresses "Inert Ideas": He needs to explain that fluency *enables* understanding later. You can't think deeply about nothing. Procedural automatization frees up working memory for conceptual thought. He must distinguish between *blind* rote learning and *scaffolded* procedural learning.
          *   Elena addresses "Equity/Access": She needs to acknowledge that "romance" isn't just "fun." It's about context. If we don't provide context, only kids with home support get it. But she argues that *meaningless* procedure is the real equity killer because it excludes kids from mathematical identity.
      *   **Round 3: Concessions and Nuance.**
          *   Expertise Reversal Effect: Marcus admits that what works for novices (guidance) hurts experts (who need exploration). Elena admits Whitehead didn't mean three distinct blocks of time; they cycle rapidly.
          *   Common Ground: Both want transfer. Both hate inert knowledge.
      *   **Closing: The Residual Disagreement.**
          *   Where do they still differ? Is it the *entry point*? The *definition of understanding*?
          *   Evidence: What data would change their minds? (Transfer tasks vs. Procedural fluency tests).

  4.  **Refining the Argument (Self-Correction during drafting):**
