answer: |-
  The broadcast array hummed, a low vibration that traveled up through the stone floor and into the soles of Elara's boots. It was the only sound in the Scriptorium, a constant, throat-clearing noise that had been running for eleven generations. Above her, the great lens turned slowly, catching the light of the home sun and throwing it out into the dark, modulated by the shutters that opened and closed according to the Ledger.

  Elara sat at her desk, the air cold enough to see her breath. In front of her lay the Master Recension, a bound volume of vellum thick as armor plating. Her job was not to write new entries—that was the privilege of the High Scribes—but to verify the continuity of the old ones. The Ledger had to be seamless. A break in the logic, a contradiction in the promises, and the broadcast would carry a stutter. The Silence on the other side of the galaxy might notice a stutter.

  She dipped her quill into the pot of iron-gall ink. Beside the pot sat the Order's seal, a block of clear crystal set in lead. The ritual was specific: when a correction was made, the ink had to be wet. The seal was pressed into the fiber. Once the ink dried, the crystal bonded with the paper. To lift the seal was to tear the page. To tear the page was to invalidate the cycle. There was no way to lie without leaving a wound.

  Elara turned the page to Cycle 440. She was cross-referencing it with the Archive Copy, a duplicate stored in the lead-lined vault below. It was a routine audit, the kind she had done a thousand times. But today, the light from the array seemed sharper, cutting through the dust motes like blades.

  She looked at the entry for the Stellar Flare Protocol. In the Master Recension, it read: *In the event of a Class-3 emission, we shall divert power to shielding and maintain broadcast continuity.*

  She looked at the Archive Copy. It read: *In the event of a Class-3 emission, we shall divert power to shielding as deemed necessary by the Council, maintaining broadcast continuity where possible.*

  The difference was small. Three words added, one removed. *As deemed necessary. Where possible.*

  Elara frowned. She turned back ten pages. Then twenty. She spent the next four hours tracing the syntax backward through the centuries. The drift was subtle, a slow erosion of certainty. Promises of *shall* became *intend to*. Guarantees of *always* became *typically*. It wasn't a sudden break; it was a sedimentary layering of ambiguity, starting exactly three hundred years ago.

  She sat back, the quill drying in her hand. The Ledger was not just a record; it was a mirror. The Order taught that the Distant Ones—the civilization burning on the other side of the void—watched the light leaking from this system. They analyzed the spectrum of the broadcast. They calculated the probability that this civilization was a partner worth keeping alive.

  The trade was simple, though never spoken aloud. The Distant Ones manipulated the background radiation of the local cluster, smoothing the cosmic rays that would otherwise strip the atmosphere. In return, this civilization promised to remain stable, to not expand aggressively, to burn in a predictable pattern. They traded safety for predictability.

  But predictability required truth. If the Ledger said *We shall*, it meant *We shall*. If the Ledger said *We might*, the Distant Ones would calculate the risk of betrayal. If the risk grew too high, the shielding would stop. The radiation would return. The sky would burn.

  Elara looked at the window. The sky was blue. The air was breathable. The shielding was holding.

  She stood up and walked to the vault. She needed to see the original plates from three centuries ago. The descent took twenty minutes, the air growing colder with every step. The vault was silent, the hum of the array muffled by tons of rock. She found the box marked *Cycle 400-450*.

  Inside, the vellum was brittle. She opened it to the start of the drift. The handwriting changed there. The sharp, angular script of the High Scribe Joren gave way to the looping hand of his successor, Kael.

  The entry was the first instance of vagueness. *We shall endeavor to maintain the broadcast.*

  Elara traced the letters. Kael hadn't been forced. There were no signs of duress, no corrections scraped away. He had chosen the softer word. And every Scribe since had followed his lead, tightening the vagueness just enough to keep it comfortable, just enough to allow for error, for laziness, for human weakness.

  She returned to the Scriptorium. The array hummed. The light poured out into the void, carrying the words *where possible* to a audience that had been dead for two hundred years.

  That was the terror of it. The light taking her current words to the Distant Ones would arrive long after she was dust. The light arriving now had been sent three hundred years ago, before the drift began. The trade was happening across a gap of time so vast it swallowed cause and effect.

  If she corrected the entry now, she would be sending a signal of honesty into a future that wouldn't receive it for millennia. But the Distant Ones were reasoning about *her* based on what they saw now. They were looking at the light from three hundred years ago. They saw Joren's honesty. They saw the start of Kael's drift.

  Did they know?

  Elara picked up the seal. It was cold, heavy. If she corrected the page, she had to use the seal. The crystal would fuse to the vellum. It would mark the page permanently. It would say: *Here was a lie, and here is the truth.*

  But if the Distant Ones were smart enough to build the shielding, they were smart enough to model the archivists. They knew humans grew tired. They knew institutions decayed. They knew that a promise written in blood is harder to keep than a promise written in ink.

  Perhaps the drift was accounted for. Perhaps the Distant Ones had calculated the probability of human weakness three hundred years ago and built it into their equation. They didn't need perfect honesty; they needed *predictable* honesty. If the decay of the Ledger was consistent, if the vagueness grew at a calculable rate, then the civilization was still predictable.

  Elara looked at the entry again. *Where possible.*

  If she crossed it out and wrote *Always*, she would be breaking the pattern. She would be introducing a variable. A sudden spike of integrity after centuries of decay might look more suspicious than the decay itself. It might look like a trick. A desperate attempt to reset the clock.

  She dipped the quill. The ink blackened the tip.

  Her hand hovered over the page. The hum of the array seemed to grow louder, pressing against her ears. It was the sound of the conversation that wasn't happening. Two civilizations, holding up mirrors to each other across the dark, hoping the reflection was clear enough to trust.

  If she corrected it, she honored the Order. She honored the truth. But she might break the trade.

  If she left it, she honored the equilibrium. She honored the safety of the sky. But she perpetuated the lie.

  There was no one to ask. The High Scribe was dead. The seniors were gone. There was only the Ledger, and the light, and the silence.

  She thought about the seal. If she pressed it down, the crystal would bite into the paper. It would be done. The mark would be visible to anyone who held the page in the future, a scar of correction. It would say: *I knew.*

  But did she know?

  She knew the words had changed. She knew the sky was still blue. She did not know why.

  Maybe the Distant Ones had stopped shielding centuries ago, and the atmosphere was just thick enough to hold for a while longer. Maybe the trade had never existed, and the Order was just shouting into the void to keep itself disciplined. Maybe the shielding was real, but the Distant Ones didn't care about the Ledger at all; maybe they were shielding for their own reasons, and the Ledger was just noise.

  But the Order believed. The belief kept the lights on. The belief kept the shutters moving in rhythm.

  Elara looked at the word *possible*. It was a weak word. A cowardly word. But it was the word that had kept the sky blue for three hundred years.

  She moved the quill closer. The nib touched the vellum. The fiber drank the ink instantly, a tiny black wound.

  If she wrote *Always*, she was betting that the Distant Ones were watching the light from *now*. She was betting that her honesty mattered more than the history of her people. She was betting that the trade was causal, that her action could reach across the time lag and change the outcome.

  But the theory of the Order was that the trade was not causal. It was logical. The Distant Ones didn't react to her; they simulated her. They knew what she would do before she did it. If she was the kind of person who would correct the lie, they already knew that. If she was the kind of person who would leave it, they already knew that.

  The correction wouldn't change their minds. It would only confirm their prediction.

  So the choice wasn't about them. It was about her. It was about whether she could live with the word *possible*.

  The ink began to spread. A tiny blob, growing darker.

  She thought about the seal. If she stamped it, she locked the correction in. If she didn't, the ink would dry, and she could scrape it away, leaving a stain but no seal. A mistake, not a declaration.

  The hum of the array shifted pitch. A shutter had opened. A new packet of data was going out. *In the event of a Class-3 emission... where possible...*

  The words were leaving the system. They were traveling at light speed, unstoppable. They were becoming history.

  Elara held her breath. The quill trembled. The drop of ink hung on the nib, suspended by surface tension, ready to fall, ready to bind, ready to break.

  She looked at the sky through the high window. It was a deep, impossible blue. It looked like a gift. It looked like a trap.

  She did not write. She did not scrape. She sat with the ink wet on the page, a dark eye staring up at her, and waited to see if the sky would change.
