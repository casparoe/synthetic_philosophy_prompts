      *   *Even stronger:* Imagine the clinicians do nothing different. The Agency just watches $P$. If the Agency intervenes based on $P$ (e.g., "If $P$ is high, we deploy Resource X"), and Resource X lowers $P$ but raises $T$ (side effects), Goodhart holds.

  9.  **Final Polish:**
      *   Ensure the tone is respectful but firm on the conceptual error.
      *   Use the term "Causal Goodhart" or "Structural Goodhart."
      *   Highlight that measurement error and gaming are *sufficient* conditions for Goodhart's law to manifest visibly, but they are not *necessary* conditions. The necessary condition is that the proxy is not the target.

  10. **Self-Correction/Edge Case:**
