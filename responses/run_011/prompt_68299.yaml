      *   What if the "honesty" constraint means they ignore the incentive and just work on $T$? Then $P$ is just a measurement. But the prompt says "whose work it evaluates." This implies incentives.
      *   Okay, I will focus on the **Causal/Structural** argument as the primary refutation, and the **Effort Substitution** argument as the secondary refutation (distinguishing it from "gaming").

  11. **Final Plan:**
