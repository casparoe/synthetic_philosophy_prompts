          *   Straws = Uniform Distance from Center ($P=1/2$). Why? Because the measure for lines invariant under Euclidean motion is $dp \, d\theta$. If you restrict to lines intersecting the circle, $p$ is uniform on $[0, R]$. The chord length $L > \sqrt{3}R$ corresponds to $p < R/2$. So $P = (R/2)/R = 1/2$.
