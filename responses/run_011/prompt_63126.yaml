  ### (d) Resolution of Tensions

  **1. Generation (9) vs. Playback (10)**
  *   **Diagnosis:** Your reasoning is not wrong; the difference is **Causal Efficacy of Internal States**.
  *   **The Property:** In Case 9 (Simulation), State *t* is the *cause* of State *t+1*. The system *exercises* the power to transition. In Case 10 (Playback), State *t* is merely *correlated* with State *t+1* because both were written by a past recorder. The causal link between internal states is broken; the link is now Storage → Output.
  *   **Why Dreams Count:** A dreaming brain is causally isolated from the *external* world, but it is **not** isolated from itself. Neuron A still fires Neuron B. The internal causal dynamics are intact. Playback lacks internal dynamics; it is a static trace being read.
  *   **Conclusion:** Moral weight requires the system to be the *author* of its next state, not just the *reader* of it.

  **2. Sequential (4) vs. Simultaneous (5)**
  *   **Diagnosis:** This turns on the metaphysics of **Abstract Computation**.
  *   **The Property:** Moral weight attaches to the *instantiation of an abstract computational process*.
      *   In **Case 5 (Simultaneous)**, Hardware 1 and Hardware 2 are instantiating the *same* abstract process at the *same* time index. They are redundant realizations of one subject.
      *   In **Case 4 (Sequential)**, Run 1 instantiates the process at Time Index *T*. Run 2 instantiates the process at Time Index *T+1*. These are two distinct *instances* of the abstract type.
  *   **Why it matters:** Suffering is located in the *experience*, which is tied to the informational state. If two systems share the exact same informational state at the exact same logical time, there is only "one place" for the experience to be, even if there are two physical locations. Time, however, creates distinct "places" for experience.
  *   **Conclusion:** Physical duplication does not multiply subjects; temporal repetition does.

