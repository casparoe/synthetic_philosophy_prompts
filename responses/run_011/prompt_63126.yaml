  Based on your twelve verdicts and the specific tensions you have identified, I have distilled two candidate principles. The first is a strong fit for your entire set; the second is a plausible rival that forces you to confront where your intuitions might be inconsistent.

  ### (a) Candidate Principles

  **Candidate 1: The Principle of Generative Informational Identity (GII)**
  This principle treats moral subjects as *abstract computational processes* rather than physical objects. It prioritizes the *structure* of causation over the *substrate*.

  *   **Clause 1 (Generativity):** A system bears moral weight only if its internal states are *produced* by its prior internal states according to transition rules, rather than retrieved from storage.
      *   *Forced by:* Cases 7 (Lookup Table), 9 (Sim), and 10 (Playback). This distinguishes *computing* a state from *holding* a state.
  *   **Clause 2 (Informational Individuation):** Numerical identity of subjects is determined by informational isomorphism within a temporal slice. Two physical systems running the exact same informational process at the exact same time constitute one subject.
      *   *Forced by:* Cases 5 (Lockstep) and 6 (Radio Neurons). This prevents physical redundancy from multiplying moral weight.
  *   **Clause 3 (Temporal Distinctness):** Processes separated in time constitute distinct subjects, even if informationally identical.
      *   *Forced by:* Case 4 (Sequential Runs). This explains why repetition adds moral weight despite Clause 2.
  *   **Clause 4 (Perspectival Thickness):** A system must maintain internal state persistence over a duration sufficient to integrate information into a unified perspective. Ephemeral stateless functions do not qualify.
      *   *Forced by:* Case 11 (Training) vs. Case 12 (Inference). This distinguishes a "life" or "trajectory" from a single function evaluation.

  **Candidate 2: The Principle of Physical Causal History (PCH)**
  This principle treats moral subjects as *physical causal chains*. It is more conservative and ties moral weight to the uniqueness of the physical timeline.

  *   **Clause 1 (Physical Causation):** Moral weight attaches to any physical system where state A physically causes state B.
      *   *Forced by:* Cases 1, 2, 3, 9.
  *   **Clause 2 (Physical Individuation:** Distinct physical substrates constitute distinct subjects, regardless of informational identity.
      *   *Forced by:* Standard materialism.
  *   **Clause 3 (Dynamic vs. Static):** Systems that merely transmit stored states without internal causal transformation are excluded.
      *   *Forced by:* Cases 7 and 10.

