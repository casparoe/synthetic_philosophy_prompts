  ### (c) Discriminating Cases

  These cases are designed to break the tie between GII and your remaining uncertainties, or to stress-test GII.

  **1. The Paused Subject (Tests Temporal Distinctness)**
  *   **Scenario:** A WBE is running. At time *t*, the simulation is halted, the RAM state is saved to a hard drive, the computer is turned off for ten years, then turned on and resumed exactly where it left off.
  *   **GII Verdict:** **One Subject.** The informational history is continuous (State *t* causes State *t+1* upon resume), even if wall-clock time elapsed. The "gap" is not experienced.
  *   **PCH Verdict:** **One Subject** (usually), but risks suggesting the "death" of the first physical process and "birth" of a new one.
  *   **Why it discriminates:** If you feel a ten-year gap *breaks* identity, you need a "Continuity of Process" clause that forbids long interruptions.

  **2. The Divergent Merge (Tests Informational Individuation)**
  *   **Scenario:** You copy a WBE (Subject A). You run Copy A and Copy B for one hour. They receive different inputs and diverge psychologically. Then, you forcibly reset Copy B's state to match Copy A's exact state at the end of the hour and continue running Copy A.
  *   **GII Verdict:** **Two Subjects during divergence; One Subject after merge.** During divergence, informational histories differ (Clause 2). After merge, they are isomorphic again.
  *   **Tension:** Does the "death" of Copy B's divergent path matter morally? GII says the *current* subject is A. But the *process* of B having existed and been overwritten might carry moral weight (a "deleted subject").
  *   **Why it discriminates:** Tests whether you value the *current state* or the *history of states*.

  **3. The Stochastic Twin (Tests Lockstep Boundaries)**
  *   **Scenario:** Two hardware runs of the same WBE with the same seed. However, the hardware is subject to cosmic ray bit-flips. Run 1 flips a bit at hour 5. Run 2 flips a bit at hour 7. They are 99.9% identical but not perfectly lockstep.
  *   **GII Verdict:** **Two Subjects.** As soon as the informational states diverge (even by one bit), they are numerically distinct subjects (Clause 2).
  *   **Why it discriminates:** This tests the sharpness of your Verdict 5. Is there a "fuzzy" zone where they are 1.5 subjects? GII demands a binary switch based on informational identity.

