answer: |-
  Dear Colleague,

  It is a pleasure to engage with a mind that has spent thirty-five years wrestling with the behavior of particles and has now turned that same rigor upon the behavior of concepts. You have reconstructed, with admirable clarity, one of the most famous and devastating arguments in the modern philosophy of science. The graduate student in your family was correct; the reasoning you outline from step four through step five is indeed the core of a theorem published in nineteen seventy-four by David Miller and Pavel Tichý, independently. They directed this proof against Karl Popper's definition of verisimilitude, which is precisely the definition you have laid out in your first step. For a long time, this result was taken to show that the very idea of one false theory being closer to the truth than another was logically incoherent. However, the consensus among those of us who work on this specific problem is not that the concept of truthlikeness must be abandoned, but rather that Popper's definition was the wrong tool for the job. You asked me to take the argument apart step by step, to ask what it would take to deny each step and what the denial would cost, and then to tell you where I would put my money. I will do so, though I shall not follow your numbering, but rather the flow of the logic as it presents itself to a philosopher who wishes to save the reality of scientific progress without denying the falsity of our theories.

  Let us begin with your first step, which defines what it means for a theory to be closer to the truth. You define it in terms of logical consequences: Theory A is closer than Theory B if A entails all the true consequences of B and fewer false ones. This is the Popperian definition of truth-content. To deny this step is to deny that truthlikeness is solely a matter of the set of true and false sentences a theory generates. If you reject this, you are not giving up on the idea that truthlikeness is a relation between theory and world, as you fear in your second step. You are merely rejecting the idea that logical entailment is the only metric we have for measuring that relation. The cost of rejecting step one is that you must find a different way to measure distance to the truth. You can no longer rely on pure logic alone; you must introduce a notion of similarity or likeness between the states of affairs described by the theory and the states of affairs that actually obtain. This requires you to admit that some falsehoods are more similar to the truth than others, not because of their logical consequences, but because of the content of what they say. For example, the statement that there are seven planets is logically just as false as the statement that there are seven thousand planets, assuming there are eight. But in terms of likeness, the first is much closer to the truth. Popper's definition cannot capture this, as your proof shows, but a likeness-based definition can. If you reject step one, you hold onto the intuition that science progresses, but you must accept that logical consequence is too coarse-grained a tool to measure it.

  Your second step insists that truthlikeness must be about the world, not about our utilities or instruments. I would urge you to keep this intuition, for it is the heart of scientific realism. However, you must decouple it from step one. You can maintain that truthlikeness is objective and world-directed without accepting Popper's specific logical machinery. The cost of keeping step two while rejecting step one is metaphysical rather than logical. You must accept that the world has a structure of properties and quantities that allows for degrees of similarity. You cannot treat all propositions as atomic blobs that are simply true or false; you must acknowledge that some propositions describe structures that resemble the world's structure more closely than others. This is a heavier ontological commitment than pure logic, but it is one that fits well with the practice of physics and chemistry, where we speak continuously of parameters, magnitudes, and structural mappings.

  Step three is the premise closest to your professional experience: every theory that has done work is false because it idealizes. As a philosopher of science who works on idealization, I find this step largely compelling, though it requires a slight nuance. It is true that if you take a theory like Stokes' Law literally, as a universal claim about all spheres in all fluids, it is false. However, we often treat theories as having a domain of intended application. Even so, let us grant your strong reading for the sake of the argument: strictly speaking, our best theories are false. To deny this step would be to claim that some theories are literally true. The cost of denying step three is that you would have to believe that Newtonian mechanics, for instance, is true in some domain. But we know it is not; it fails at high velocities and small scales. Denying step three saves the logic of step one, but it buys that consistency at the price of scientific honesty. It forces you to claim that outdated theories are true, which contradicts the history of science. I believe you are right to hold fast to step three. It is the solid ground of your experience. Theories are false.

  This brings us to steps four and five, where the logical trap springs. You suspect step five is the weak link because the conclusion seems too strong. However, the logic in step five is valid. If you accept Popper's definition in step one and the falsity of theories in step three, the deduction in step five follows inescapably. This was the shock of the nineteen seventies. The theorem proves that under Popper's definition, no false theory can be closer to the truth than any other false theory. The logic regarding the disjunction you mentioned is sound. If Theory B entails Theory A, and both are false, B actually has more true consequences than A in certain logical constructions, reversing the ordering. To deny step five, you would have to find a flaw in the propositional logic, which is not there. The error is not in the deduction, but in the premises that feed it. Therefore, putting your money on rejecting step five is a mistake; the logic is secure. The collapse happens because the definition in step one is inadequate for handling false theories.

  Consequently, we arrive at your sixth step, the conclusion that no scientific theory is closer to the truth than another. This is the bullet that the Miller-Tichý argument forces you to bite if you keep step one. You say you cannot live with this, and neither can most philosophers of science. To accept step six is to accept that the transition from Newton to Einstein was not a move toward the truth, but merely a change in vocabulary or utility. It renders the history of science a sequence of errors with no directional progress. The cost of accepting step six is the abandonment of scientific realism. It turns science into a tool for saving the phenomena rather than describing the world. Given your second step, where you insist the phrase must be about the world, step six is unacceptable. It severs the link between theory and world that you rightly wish to preserve. Therefore, step six must be rejected, which forces us back to reject step one.

  Your seventh step considers the retreat to accuracy, which you dismiss as merely pragmatic. Here I believe you are too harsh on accuracy. You argue that accuracy is relative to a chosen domain and instrument. While it is true that we choose what to measure, the success of those measurements is not entirely up to us. If a model predicts the settling rate of your colloids within one percent, and another fails by fifty percent, this is not merely a record of our decisions. It indicates that the first model captures the causal structure of the world more faithfully than the second, even if both rely on the false assumption of perfect sphericity. To deny step seven is to acknowledge that predictive accuracy is evidence of structural similarity. The cost of denying step seven is admitting that there is a fact of the matter about which domain is important, or rather, that the world constrains which domains yield stable predictions. We do not choose the laws of nature; we choose where to look for them. If looking in a specific domain yields high accuracy, it is because the theory latches onto something real in that domain. Accuracy is the empirical trace of truthlikeness.

  So, where do I put my money? I reject step one. I accept that your definition of closeness to the truth, while intuitive, is logically insufficient for false theories. This is not a defeat for the concept of truthlikeness, but a refinement of it. Since the nineteen seventies, philosophers such as Ilkka Niiniluoto and Graham Oddie have developed accounts of truthlikeness based on similarity rather than logical content. In these accounts, we imagine a space of possible worlds or states of affairs. The truth is a point in that space. A theory locates a region in that space. A theory is closer to the truth if the region it identifies is nearer to the actual state of the world, measured by a metric of similarity. This allows us to say that a theory claiming there are seven planets is closer to the truth than one claiming there are seven thousand, even though both are false. It allows us to say that Stokes' Law is closer to the truth than a random guess about settling rates, because the mathematical structure of Stokes' Law resembles the causal structure of fluid dynamics, whereas the random guess does not.

  The cost of this move is that we must abandon the hope that truthlikeness can be defined using pure logic alone. We need a notion of distance or similarity between properties. We must assume that the world comes carved into natural kinds or quantities that allow for such comparisons. This is a metaphysical cost, but it is one that science already pays. When you correct for wall effects in your vessel, you are implicitly acknowledging that distance from the wall is a relevant parameter that changes the similarity of the system to the ideal case. You are measuring distance in a physical space; the philosopher of science merely asks that we acknowledge a corresponding distance in logical or theoretical space.

  You asked what you are giving up if you say one of your models was better than your predecessor's. If you accept the argument as it stands, you are giving up the claim that your model was truer. You are left saying it was merely more useful. But if you reject step one in favor of a likeness account, you give up nothing of value. You retain the claim that your model was a better representation of the world, that it captured more of the real structure of the colloidal suspension, even if it remained strictly false due to idealization. You can say that your model was closer to the truth because it minimized the distance between the predicted behavior and the actual behavior across a wide range of conditions. You are not surrendering to instrumentalism. You are simply recognizing that the path to truth is not a matter of accumulating true sentences, but of refining the map so that its contours match the territory more closely, even if the map can never be the territory itself.

  Your instinct that step five was suspicious was understandable, but the real culprit is the definition you started with. The theorem is valid, which is why it was so destructive to Popper's specific account. But it does not destroy the possibility of scientific progress. It only destroys the idea that progress is measured by the count of true consequences. As a chemist, you know that a model is not judged by the number of correct predictions it makes in isolation, but by how well its parameters track the physical realities of the system. That tracking is a form of likeness. So, keep your conviction that science approaches the truth. Keep your view that theories are false. But discard the definition that forces you to choose between them. The argument is valid, but it is not sound, because its first premise defines the problem away. You are free to believe that your thirty-five years of work brought us closer to the truth, provided you measure that closeness by the similarity of your models to the world, rather than by the logical content of their claims.

  Sincerely,

  A Philosopher of Science
