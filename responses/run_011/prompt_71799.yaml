  Here is a principle that captures the logic underlying almost all of your gut calls. It is a hybrid of **consequentialism** (did the outcome suffer?) and **institutionalism** (did it break the rules?).

  ### The Principle: Authorized Deviation from Public Purpose

  An act is corrupt if and only if **three conditions** are met simultaneously:

  1.  **Private Benefit:** The official receives a personal gain (money, gifts, favors, status).
  2.  **Decision Deviation:** That benefit induces a decision that deviates from the **objective public merit** (the decision that would have been made based solely on the official's public mandate).
  3.  **Lack of Authorization:** The exchange and the resulting deviation are **not transparently authorized** by the institution's explicit rules or settled local norms.

  If any one of these is missing, it is not corruption under this principle.

