  ### How It Maps to Your Cases

  *   **Passport Fee:** Benefit (fee) + Deviation (queue jump) + **Authorization (Posted Rule)**.
      *   *Verdict:* Not Corrupt. The "public purpose" of that office includes revenue/efficiency tiers.
