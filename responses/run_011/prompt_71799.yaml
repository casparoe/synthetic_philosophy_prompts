  ### Application to New Cases

  Here is how this principle adjudicates two scenarios you didn't list:

  **Case A: The Bill-Miller**
  A lobbyist drafts a complex piece of legislation for a Senator. The Senator introduces it verbatim. The lobbyist takes the Senator out for a $100 dinner to celebrate. The bill is widely regarded by experts as good policy.
  *   **Principle Verdict:** **Not Corrupt.**
  *   **Why:** There is a Benefit (drafting + dinner), but there is **No Decision Deviation**. The bill serves the public merit (good policy). The labor saved for the Senator is a systemic feature of legislatures, not a hidden deviation.

  **Case B: The Disaster Triage**
  A FEMA director prioritizes relief for a county where his sister lives, over a neighboring county with slightly higher damage statistics, arguing that his local knowledge makes the logistics faster. He does not disclose the relationship.
  *   **Principle Verdict:** **Corrupt.**
  *   **Why:** Benefit (Sister's safety) + Decision Deviation (Prioritizing family over stats) + **Lack of Authorization (Undisclosed)**. Even if the outcome is arguably efficient, the secret private interest violates the authorization clause.

