  1. "You concede key studies behind the situationist critique failed replication. Once removed, what specific evidence sustains the claim that global character traits are rare rather than just hard to measure?"
  [Testing the core empirical foundation post-crisis.]
  Follow-up: "If that evidence relies on laboratory behavior, why should we trust it over self-reports from daily life?"

  2. "If surviving data comes from undergraduates in artificial settings, does your critique apply to ordinary adults navigating real-world commitments, or only to subjects in eliciting conditions?"
  [Testing external validity and scope of the claim.]
  Follow-up: "If only the latter, doesn't that preserve virtue ethics for the domain that actually matters?"

  3. "Critics argue aggregating behavior over time yields greater predictability than single acts. If aggregation works, are traits explanatorily idle after all?"
  [Testing the aggregation reply to low correlations.]
  Follow-up: "Then is your objection merely that Aristotelians demand too much consistency too soon?"

  4. "Walter Mischel concluded that inconsistency reflects stable if-then signatures. If behavior is systematically linked to situations, doesn't that collapse your dispute into a question of description?"
  [Testing the distinction between local traits and character traits.]
  Follow-up: "What functional difference remains between a local disposition and the character trait you reject?"

  5. "Proponents cite personality measures with predictive validity for morally loaded outcomes. Was your target a construct that actually survived the decades you critique?"
  [Testing whether the critique attacks a straw man.]
  Follow-up: "If those traits predict virtue, why deny they constitute character?"

  6. "Do you claim global traits do not exist, or only that evidence cannot establish them? Why does that difference matter for whether someone deserves blame?"
  [Testing ontological vs. epistemic claim and blame implications.]
  Follow-up: "If it's merely evidential, doesn't blame remain permissible until proven otherwise?"

  7. "Your positive program designs situations to scaffold virtue. Doesn't building reliable scaffolds presuppose dispositions stable enough to be acquired and relied on by others?"
  [Testing the self-undermining charge regarding situation engineering.]
  Follow-up: "If agents lack that stability, isn't your engineering project doomed to fail?"

  8. "Does the loss fall on the agent, who loses credit and blame, or the assessor, who can no longer read character? Please choose one."
  [Testing the normative cost distribution.]
  Follow-up: "In that scenario, what happens to the validity of promises made between friends?"

  9. "After these concessions, is your position distinguishable from the consensus that persons and situations interact? What specific finding would make you abandon the critique?"
  [Testing convergence with interactionism and falsifiability.]
  Follow-up: "If better measures show consistency, will you concede traits exist, or will you move the goalposts?"

  ***

  **Note on Empirical Premises:**
  You asked me to flag any characterization of the literature that might be slightly wrong. Two points warrant nuance during your fact-check:
  1.  **Ego Depletion:** While the prompt describes this literature as having "fared badly," recent multi-lab replications suggest a small effect remains, though significantly smaller than originally claimed. It is not universally considered "debunked."
  2.  **Mood/Helping & Bystander:** These classics have mixed replication records depending on specific protocols, rather than a uniform failure. Since the philosopher *concedes* these failures per your brief, you can ask about her concession, but avoid asserting the failures as absolute scientific fact in your own voice.
