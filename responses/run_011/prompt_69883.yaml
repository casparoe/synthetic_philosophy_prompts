      *   *Claim 8: Determinism lost hold... clockwork universe died.* -> **Philosophically Contested.** Depends on definition of determinism (ontological vs. epistemological).

  3.  **Distinguish Determinism, Predictability, Simulability:**
      *   *Determinism:* Ontological property. State $S_t$ uniquely determines $S_{t+\Delta}$. (Math: Unique trajectories).
      *   *Predictability:* Epistemological property. Can an observer *know* $S_{t+\Delta}$ given knowledge of $S_t$? (Chaos breaks this due to measurement limits).
