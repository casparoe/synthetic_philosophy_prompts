answer: |-
  Before committing to a formal specification, I need to sort through the noise because much of what passes for theoretical rigor in this field is actually partisan positioning disguised as principle. The plebiscitary camp insists that any majority vote in any contiguous area is sufficient, but that is less a philosophical requirement than a strategic demand to lower the bar for independence movements they favor. The remedial camp insists that only grave injustice warrants secession, but that is often a way to protect existing states they prefer to keep intact. For your purposes, the non-negotiable requirements must be those that prevent the theory from collapsing into either infinite fragmentation or absolute state tyranny, whereas the negotiable ones are those that privilege either the status quo or the challenger without functional justification. We need a spec that works for a democracy monitor, which means it must be actionable during a crisis, not just coherent in a seminar room. The real work is distinguishing between the right to leave, which is a human right of exit, and the right to take territory, which is a collective claim against the state, and ensuring we do not confuse internal self-determination, like autonomy within a constitution, with external self-determination, which creates a new sovereign. If we collapse these, we end up endorsing chaos or repression depending on which confusion we favor.

  So here is the specification we need any theory to meet if it is to be usable for public reporting. First, the theory must provide a non-arbitrary method for defining the unit entitled to vote, and this is genuinely non-negotiable because without it, the question of who decides is unanswered. In the Scottish case, Westminster and Holyrood agreed on the electorate, but in Catalonia, the dispute over whether the whole of Spain or just Catalonia should vote was never resolved, leading to illegality. A theory that lets the secessionists define the boundary of the vote themselves fails this test because it allows gerrymandering of the demos, yet a theory that always defaults to the existing state boundary fails because it gives the state a veto over its own dissolution. Second, the theory must distinguish between a standing permission to secede and a remedy for injustice. The Scottish vote was a consensual exercise of a perceived standing permission, whereas the Catalan claim was largely framed as a remedy for denied autonomy and cultural suppression. Your organization needs to know whether you are endorsing a right that exists whenever a group wants it or only when the state has breached a trust. This is often where partisan preferences dress up as requirements, with state loyalists insisting on remedial only and separatists on standing permission, but for policy purposes, you must decide which one triggers your endorsement. Third, there must be a requirement for clarity of question and majority, motivated by Quebec in 1995 where the slim margin and ambiguous wording created a constitutional crisis that lasted decades. It is non-negotiable that a secession vote must be clear enough to be implemented, but what counts as clear is often contested by the losing side. Fourth, the theory must address the recursion problem, meaning it must explain why the seceding region cannot be further seceded from by minorities within it. If a province can leave a state, why can a city leave the province, and where does it stop? This is non-negotiable for stability, yet most theories ignore it until it is too late. Fifth, there must be a pathway for legal recognition or consensual dissolution, as seen in the Velvet Divorce, where the process was negotiated rather than imposed. This is non-negotiable for international stability, even if it is not always achievable in hot conflicts.

  When we test these requirements against the hard cases, the tensions become visible. In Scotland, the theory had to accommodate a consensual transfer of power to hold a vote, satisfying the unit definition and clarity requirements, but it relied on the parent state agreeing to the terms, which masks the problem of what happens when they refuse. In Catalonia, the failure to define the unit legally meant the vote was unilateral, failing the legality requirement, but if your theory only endorsements legal votes, you end up saying nothing about repression, which is a failure for a democracy monitor. In Quebec, the clarity requirement was imposed after the fact by the Supreme Court, showing that the rules often get written during the crisis rather than before, which makes pre-crisis endorsement tricky. In the Velvet Divorce, the recursion problem was managed by mutual agreement, but that is rare. The real trouble comes when these requirements clash, specifically regarding the definition of the demos, neutrality about historical claims, and the stability of the outcome. I suspect you are right that these three cannot be held together. You cannot have a neutral method for defining who votes, because any method privileges either the existing border or the secessionist border. If you say the existing administrative border is the unit, you are taking a side against sub-regional minorities who might want to stay in the old state. If you say any group can define itself, you invite infinite recursion. If you demand stability, you must restrict the right to secede, which compromises neutrality about the group's desire.

  The argument for their incompatibility rests on the fact that defining the demos is a sovereign act, and sovereignty is exactly what is up for grabs. To demand neutrality about contested historical claims while also demanding a determinate answer to who counts as the people is to ask for a decision without a decider. In the Catalan case, Spain claimed the demos was all Spaniards, while separatists claimed it was Catalans. There is no neutral arbiter above both to decide this without invoking either existing law, which favors the state, or self-determination principles, which favor the group. If you try to maintain neutrality, you end up with no answer, and the crisis proceeds without guidance. If you prioritize stability, you must fix the demos at a higher level, usually the constitutional level, which means sacrificing neutrality because you are privileging the existing constitutional order over the secessionist claim. Therefore, the set is impossible. You must drop the requirement for neutrality regarding the boundary of the voting unit. What you lose by dropping it is the ability to claim your endorsement is historically unbiased. You have to admit that recognizing a specific region as the unit entitled to vote is a political choice that validates that region's claim over others within it. This is a heavy cost for a monitoring outfit, as it looks like taking sides, but it is the only way to avoid paralysis.

  If I had to identify the single requirement that does the most work in knocking out candidate theories, it is the requirement to non-arbitrarily define the territorial unit entitled to vote prior to the conflict. This is the killer constraint. Plebiscitary theories collapse here because they allow the group to define itself, which leads to the recursion problem and instability. Remedial theories often struggle here because they focus on the injustice rather than the unit, leaving it unclear whether the remedy applies to the whole region or just the victims. Constitutional theories handle this best by deferring to existing law, but they fail when the law is used to suppress democracy, as in Catalonia. By insisting that the unit must be defined in a way that is not solely controlled by the secessionists or the state alone, you rule out the most extreme versions of both primary right and absolute integrity views. You force the theory to account for the boundary question, which is where most secessionist conflicts actually die. Without this, you are just debating the right to leave, which is not the same as the right to take the land.

  In terms of how the main families of view measure up against this spec, the view that treats secession as a primary right available to any cohesive group fails on stability and the recursion problem, as it offers no principled reason to stop the fragmentation at the regional level rather than the municipal or individual level. The view that treats secession solely as a remedy for gross injustice passes the stability test but fails the democratic consent test in cases like Scotland where no injustice was claimed but independence was still sought, leaving your organization unable to endorse legitimate democratic exercises that fall short of persecution. The view that ties secession strictly to constitutional legality passes the stability and unit definition tests but fails in cases where the constitution is weaponized to block democratic expression, leaving you silent in the face of repression. A hybrid approach that requires a negotiated definition of the voting unit, clarity of majority, and a preference for consensual dissolution while allowing for external arbitration when negotiation fails is the only one that survives, but it requires dropping the pretense of neutrality on the boundary question. You will have to accept that endorsing a vote in a specific territory is itself a political act that validates that territory's status, and there is no theoretical way to cleanse that act of bias. This is the unglamorous reality your employers need to hear before they issue any statement.
