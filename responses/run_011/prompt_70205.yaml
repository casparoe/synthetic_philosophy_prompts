answer: |-
  ## 1. The Stance: Causal-Role with Physiological Constraints

  **Decision:** Your database is a **Causal-Role (CR) Resource**, specifically adopting a *Cummins-style* definition ("what the item contributes to the capacity of the containing system"), but with a mandatory **Physiological Context Filter**.

  **Argument:**
  *   **Why not Etiological (Selected-Effects)?** SE requires proof of evolutionary history (selection pressure). For 40 annotations a week, you cannot reconstruct phylogenies for every gene. SE also excludes *neofunctionalization* (new traits not yet selected) and *moonlighting* (one protein, two jobs), which are biologically real and clinically relevant.
  *   **Why not Two Resources?** You are a team of four. Maintaining two divergent truth-states for the same gene ID will cause version control nightmares and confuse users.
  *   **Why CR + Context?** CR captures what the molecule *does* now. However, pure CR allows "tube artifacts" (a kinase in a buffer is a kinase, but is it a kinase *in the nucleus*?). The **Physiological Context Filter** ensures you only annotate activities that occur *in the organism*, preventing the "blank = negative" pipeline error from becoming a "false positive = disaster" error.

  **What you give up:** You give up the ability to claim that an annotation implies the trait was *selected for*. You also accept that redundant duplicates count as "functional" (they contribute to robustness), which evolutionary biologists may debate, but systems biologists need.

  ---

  ## 2. The Decision Procedure (The "20-Minute Gate")

  **Pre-requisite:** Open the paper(s). Identify the Gene Product (GP), the Activity (A), and the Organism/Tissue (O/T).

  ### Test 1: The Capability Gate (Molecular)
  *   **Question:** Is there direct evidence the GP can perform Activity A?
  *   **Pass:** Purified protein assay, binding affinity (KD), or high-confidence homology (>80% identity in active site) to a characterized ortholog.
  *   **Fail:** "Predicted by domain," "Co-expression," or homology <60% without active site conservation.
  *   **Action:** If Fail, **STOP**. Do not annotate. (File as "Uncertain").

  ### Test 2: The Context Gate (Physiological)
  *   **Question:** Is the GP present in the cellular/tissue compartment where Activity A would matter *in this organism*?
  *   **Pass:** Immunostaining, GFP-tag localization, or mass-spec proteomics confirming presence in the relevant tissue/compartment.
  *   **Fail:** Activity shown only in heterologous systems (e.g., human gene in yeast) without expression data in the native organism, or expression is in a different tissue than the claimed function.
  *   **Action:** If Fail, **STOP**. Do not annotate for this tissue. (You may annotate for the tissue where it *is* found).

  ### Test 3: The Contribution Gate (System Capacity)
  *   **Question:** Does performing Activity A contribute to a capacity of the O/T system, or is it incidental?
  *   **Pass:**
      *   (A) Loss-of-function (KO/mutation) abolishes the system capacity (phenotype).
      *   (B) Gain-of-function/Overexpression enhances the capacity.
      *   (C) The GP is a known component of a complex/pathway where A is the mechanism (even if KO is silent due to redundancy).
  *   **Fail:** The activity occurs *in vivo* (passes Test 2) but changing the GP does not alter the system state, AND it is not part of a conserved pathway. (i.e., It is biochemical noise or promiscuity without physiological effect).
  *   **Action:** If Fail, **STOP**. Do not annotate Function. (You may annotate "Binding" if Test 1 passed, but not "Catalytic Activity" in a Biological Process context).

  ### Escalation Point (Senior Curator)
  **Trigger:** Test 3 is ambiguous.
  **Specifically:**
  1.  **Redundant Duplicates:** Test 1 & 2 pass, but KO shows no phenotype (compensation suspected).
  2.  **Moonlighting:** Test 1 & 2 pass for two distinct activities in the same tissue, but only one has phenotype support.
  3.  **Clinical Variants:** Human LoF data exists but tissue specificity is unclear.
  **Why:** These require weighing conflicting evidence or external database cross-referencing that exceeds the 20-minute window.

  ---

  ## 3. Metaphysical Commitments (Disguised as Workflow)

  **Flag 1: "System Capacity" (Test 3)**
  *   **The Commitment:** You are assuming the organism (or tissue) is a teleological system with "capacities" (e.g., "vision," "metabolism").
  *   **The Rule:** Do not annotate "Activity X" unless you can name the "System Capacity Y" it supports. If you can't name Y, you are annotating a biochemical property, not a biological function.
  *   **Instruction:** If you cannot write down the phenotype or pathway outcome, you cannot pass Test 3.

  **Flag 2: "Presence implies Opportunity" (Test 2)**
  *   **The Commitment:** You are assuming that if the protein is there, it is doing its job. (It might be inhibited, sequestered, or broken).
  *   **The Rule:** Presence is necessary but not sufficient.
  *   **Instruction:** If the paper shows the protein is in the nucleus but the assay was done at pH 4.0 (lysosomal), you must Fail Test 2. Match the assay conditions to the physiological context.

  ---

  ## 4. Running the Cases

  ### Case 1: Crystallin (Lens protein, enzymatic activity in liver)
  *   **Test 1 (Capability):** Pass. It is an enzyme by sequence and in vitro assay.
  *   **Test 2 (Context):** Pass. It is abundant in the lens.
  *   **Test 3 (Contribution):** **FAIL.** In the lens, the "System Capacity" is refraction/transparency. The enzymatic activity does not contribute to refraction. The *structural* packing does. The enzymatic activity is a historical relic in this tissue.
  *   **Outcome:** **Withdraw Annotation.** Annotate as "Structural Constituent of Lens." Do *not* annotate the Enzymatic Function for the lens context. (You may annotate Enzymatic Function for the liver if expressed there).
  *   **Why this hurts:** This is a "well-loved" annotation because the protein *is* an enzyme. But in the lens, that is not its function.

  ### Case 2: Antifreeze Protein (Recruited from digestive enzyme)
  *   **Test 1 (Capability):** Pass. Binds ice crystals.
  *   **Test 2 (Context):** Pass. Secreted into blood/extracellular fluid in polar fish.
  *   **Test 3 (Contribution):** Pass. Loss leads to freezing/death. Contribution to "Thermoregulation/Survival."
  *   **Outcome:** **Annotate.** The evolutionary history (recruitment) is irrelevant to the current Causal Role.

  ### Case 3: Duplicate Copy (Post-WGD, activity confirmed, no selection story)
  *   **Test 1 (Capability):** Pass. Assay shows activity.
  *   **Test 2 (Context):** Pass. Expressed in same tissue as parent.
  *   **Test 3 (Contribution):** **ESCALATE.** KO shows no phenotype (parent compensates). Is it contributing to "Robustness"?
  *   **Senior Curator Call:** Check if expression levels sum to the parent's original level. If yes, annotate as "Redundant Function" with a **Not-Phenotyped** evidence tag. If expression is negligible, Fail Test 3 (Biochemical noise).
  *   **Outcome:** Likely **Annotate** (CR allows redundancy), but tag carefully.

  ### Case 4: Human Loss-of-Function (WT active in vitro, patient tissue broken)
  *   **Test 1 (Capability):** Pass (WT data).
  *   **Test 2 (Context):** Pass (WT expression data from GTEx or similar).
  *   **Test 3 (Contribution):** Pass. Patient phenotype confirms the WT activity is required for the tissue capacity.
  *   **Outcome:** **Annotate.** The broken tissue confirms the function of the WT.

  ---

  ## 5. User-Facing Statement (The "Disclaimer")

  > **Functional Annotation Policy:**
  > This database annotates **Causal Roles**. A "Function" term indicates that the gene product has the molecular capability to perform an activity *and* is present in a physiological context where that activity contributes to the system's capacity (e.g., a pathway, phenotype, or structural role).
  >
  > **What this means:**
  > *   We **do** annotate neofunctionalized genes and moonlighting proteins.
  > *   We **do** annotate redundant duplicates if they contribute to system robustness.
  > *   We **do not** annotate evolutionary history (e.g., "ancestral enzyme") if the activity is not physiologically utilized in the annotated tissue.
  > *   **Warning:** A blank cell indicates "No Evidence," not "Absence of Function." Downstream pipelines treating blanks as negatives will generate false conclusions.

  ---

  ## 6. The Straight Answer

  **Does this account change any entry?**
  **Yes.** The Crystallin case (Case 1) forces a withdrawal. Under a loose "Capability" view, you annotate the enzyme activity everywhere the protein exists. Under this "Contextualized Causal-Role" view, you must suppress the enzyme annotation in the lens because it does not contribute to the lens's capacity. This is the "well-loved annotation" you must sacrifice to maintain integrity.

  **Is the dispute invisible downstream?**
  **No.** If your downstream users treat blanks as negatives (as you stated), your precision is their safety. If you annotate the Crystallin as an enzyme in the lens, a metabolic modeler might try to route lactate through the lens and break their simulation. If you annotate the neutral duplicate as functional, an evolutionary biologist inferring selection will get a false positive. By adopting this procedure, you shift errors from **False Positives** (bad for modelers/evolutionists) to **False Negatives** (bad for completeness). Given your constraint that "blanks are treated as negatives," you must prioritize Precision over Recall. This procedure does that.
