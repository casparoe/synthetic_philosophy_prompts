answer: |-
  **MEMORANDUM**

  **TO:** Collections Committee
  **FROM:** [Your Name], External Member
  **DATE:** Wednesday, [Date]
  **SUBJECT:** Recommendation regarding Accession 1911.x (Marble Figure Group)

  **Recommendation for Vote**

  I recommend the Committee adopt the following resolution:

  1.  **Identity:** Accession number 1911.x remains attached to the **Gallery Object** (the reconstructed figure currently on display).
  2.  **Disposition:** Title to 1911.x is transferred to the Diocese under the Repatriation Policy, effective no later than [Date 18 months out], allowing time for the 900th-anniversary procession.
  3.  **Original Material:** The fragmented original stone (currently the "Study Assembly") is deassociated from 1911.x and assigned a new accession number (2024.y) as "Archival Material: Original Fragments of 1911.x." These remain in the Museum's study collection.
  4.  **Insurance:** 1911.x is named as the single insured object at its full cultural value until the date of transfer.

  **Rationale**

  We are forced to choose between material authenticity and functional continuity. While the "Ship of Theseus" argument suggests a philosophical stalemate, the Committee requires an administrative decision to satisfy the insurer and the Diocese. We cannot split the difference; title and insurance require a single legal entity.

  I align with Conservation and the Diocese: the 1911 accession must follow the **Gallery Object**.

  The Diocese's request is not for geology, but for function. They require a processional figure. The Study Assembly (40% original) is structurally fragile and fragmented; it cannot fulfill the community's need. The Gallery Object (65% new) carries the uninterrupted history of public veneration and display since 1947. To return the fragments would be to return the "truth" of the stone while withholding the "truth" of the figure. In cases of sacred or communal property, functional integrity outweighs material purity.

  **Addressing the Registrar's Concern**
  I take the Registrar's position seriously. Registration *should* track original material; that is the bedrock of provenance. If we were acquiring this today, we would not accession a reconstruction as the original. However, 1911.x is not a new acquisition; it is a historical entity that has accrued 75 years of institutional biography as a complete figure. To reassign 1911 to the fragments now would be to retroactively invalidate the conservation history that preserved the community's memory of the object. We are not saying the new stone is old; we are saying the *identity* of the object resides in its form and function, not solely its substrate.

  **Future Criterion: The Percentage Threshold**
  We must explicitly reject a percentage-of-original-material threshold (e.g., "over 50% original = Accession"). Such a rule is arbitrary and unenforceable. A painting with 51% new canvas is not fundamentally different from one with 49%.

  Instead, I propose the **"Functional Integrity Test"** for future cases involving extensive reconstruction:
  *   Does the object retain its primary cultural function (e.g., procession, ritual, display) in its current state?
  *   Is the reconstruction historically documented and itself of significance?
  *   If yes, the accession follows the functional object. If no, the accession follows the surviving original material.

  **Draft Texts**

  **Register Entry (1911.x)**
  > *Marble Figure Group. Acquired 1911 from [Parish]. Severely damaged 1944. Reconstructed 1947–1990s with replacement stone and recarved head (1962) based on photographic record. Original fragments retained in Study Collection (2024.y). Object transferred to [Diocese] [Date] under Repatriation Policy. Note: Object comprises mixed original and replacement material; see Conservation Report 1995.*

  **Exhibition Wall Label (For 2024.y – Fragments)**
  > **The Original Stone (Study Assembly)**
  > *Marble, 1911 (fragments) / 2019 (armature)*
  > *These fragments are the only surviving original material from the figure group returned to the Parish in [Year]. Assembled in 2019 for study, they reveal the extent of the damage sustained in 1944 and the subsequent reconstruction. While the returned figure carries the history of display, these stones carry the history of the object's making and destruction.*

  **Timetable**
  *   **Thursday:** Committee Vote.
  *   **Month 1:** Registrar updates database; Insurer notified of single risk (1911.x).
  *   **Month 2–12:** Conservation stabilizes Gallery Object for transport/procession.
  *   **Month 18:** Formal transfer of title.
  *   **Year 2:** Object participates in 900th Anniversary.

  This path honors the community's living tradition without erasing the material evidence held in our store. It provides the insurer with a single risk and the curator with a clear narrative for the exhibition.

  I move we vote on this resolution Thursday morning.
