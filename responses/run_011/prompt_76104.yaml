  **JOINT PREPARATORY STATEMENT: ETHICS OF WAR WORKSHOP**

  **Participants:** Absolute Pacifist (A), Contingent Pacifist (B)
  **Date:** October 2023
  **Subject:** Mapping Disagreement Structures

  **Part One: Agreed Claims**

  1.  Noncombatant immunity imposes a stringent moral constraint that cannot be overridden by mere aggregate utility. (normative)
  2.  Contemporary military institutions routinely operate with doctrines that foresee noncombatant death as an acceptable cost. (empirical)
  3.  A moral position regarding war must specify conditions under which it could be proven incorrect. (evidential-standard)
  4.  The moral character of an act is partially constituted by the intentions and institutional roles of the agents involved. (conceptual)
  5.  Political leaders under extreme stress are prone to rationalize violations of established constraints. (strategic)

  **Part Two: Disagreements Table**

  | id | contested proposition | B's own formulation | A's own formulation | type | crux | admissible evidence |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | D1 | Pacifism is compatible with the theoretical permissibility of some wars. | I am a pacifist because current wars fail Just War criteria; if a war met them, I would support it. | You are not a pacifist if you admit a war could be just; a constraint that yields is merely a cost calculation. | verbal | Does admitting a permissible possibility negate the identity of pacifism? | Historical usage of the term 'pacifism'; logical consistency of contingent prohibitions. |
  | D2 | Moral constraints on killing remain binding under supreme emergency conditions. | My principles hold, but institutions often fail under pressure; that is a failure of execution, not theory. | If your principle allows exception when stakes are high, it was never a constraint, only a threshold. | normative | Is a constraint that admits exceptions distinct from a utilitarian calculation? | Philosophical analysis of deontological constraints versus weighting functions. |
  | D3 | We can reliably judge proportionality using counterfactual baselines. | We must estimate the baseline to judge proportionality; imperfect evidence is better than none. | Unobservable baselines cannot bear the weight of irreversible killing; the uncertainty itself forbids the act. | methodological-evidential | Can unobservable counterfactuals justify irreversible harm? | Standards of proof required for lethal action; epistemic limits in conflict zones. |

  **Part Three: Pre-registered Predictions on Stipulated Case**

  ```json
  [
    {
      "crux_id": "D1",
      "question": "Does the stipulated air campaign satisfy the conditions for permissible war?",
      "absolute_pacifist_prediction": "No. The institutional act of bombing violates the constraint against killing noncombatants regardless of intent.",
      "contingent_pacifist_prediction": "Yes. The campaign satisfies discrimination and proportionality criteria given the genocide baseline.",
      "absolute_pacifist_movement_condition": "None. Revising this would abandon the core deontological commitment that defines the position.",
      "contingent_pacifist_movement_condition": "Evidence that collateral damage exceeds the harm prevented or that intelligence was flawed.",
      "disagreement_about_admissibility": "true: A rejects the hypothetical's precision as empirically impossible in practice."
    },
    {
      "crux_id": "D2",
      "question": "Would the moral constraint hold if the genocide accelerated during the campaign?",
      "absolute_pacifist_prediction": "Yes. The constraint is fixed by the act of waging war, not the adversary's escalation.",
      "contingent_pacifist_prediction": "Yes, in principle, but proportionality calculations would shift based on new casualty rates.",
      "absolute_pacifist_movement_condition": "None. The moral character is fixed by participation in the institution of war.",
      "contingent_pacifist_movement_condition": "Demonstration that stopping the war causes significantly more death than continuing it.",
      "disagreement_about_admissibility": "false: Both accept the logical structure, but disagree on the weight of the outcome."
    }
  ]
  ```

  **Part Four: Analysis of Verbal and Definitional Disputes**

  A significant portion of our divergence arises from verbal disputes regarding 'constraint' and 'pacifism'. For A, 'constraint' denotes an absolute barrier; for B, it denotes a heavy presumption that can be overridden by sufficient moral weight. Similarly, 'pacifism' functions for A as a identity claim regarding participation in violent institutions, whereas for B it is a empirical verdict on contemporary conflict. This is not merely terminological. If 'constraint' means 'absolute barrier', then B's view is logically incoherent. If 'constraint' means 'high threshold', then A's view is an arbitrary stipulation. The dispute over 'proportionality' similarly hides a deeper clash: A views the uncertainty of calculation as a prohibition, while B views it as a risk to be managed. These verbal distinctions matter because they determine whether the disagreement is about the world (empirical) or the structure of morality itself (normative). Our suspicion is confirmed: these are not three disagreements, but one fundamental clash regarding the nature of moral constraints appearing in three places. The elasticity clause, the assurance asymmetry, and the counterfactual problem all reduce to whether morality admits of trade-offs under pressure. Until we agree on whether a constraint that bends is still a constraint, our empirical agreements will remain morally inert. We remain divided on whether a theory immune to evidence is dogmatic or principled.

  **Closing**

  This document serves as the baseline for our workshop dialogue. We acknowledge that while our verdicts on current conflicts coincide, our justifications remain incompatible. We commit to addressing the cruxes identified above rather than rehearsing our respective conclusions.
