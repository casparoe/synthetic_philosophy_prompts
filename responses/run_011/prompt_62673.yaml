answer: |-
  1. The Commission recommends adopting proposal (a), single transferable vote in a single at-large district, with an amendment to carve out three reserved seats for early-career members into a separate concurrent election. This rule shall appear on the fall ballot and, if approved, will first operate in the election cycle beginning two years from now to allow for ballot programming updates.

  2. Under the current plurality block system, a cohesive majority holding fifty-five percent of the vote can mathematically secure all fifteen seats while a cohesive minority holding forty-five percent secures none. This outcome persists regardless of turnout levels because the existing rules award victory to the top fifteen vote-getters without requiring a threshold of support proportional to the electorate size.

  3. Proposal (b) was rejected because dividing the association into fifteen geographic districts would likely transform board members into regional delegates rather than governors responsible for the national interest. Such fragmentation would undermine the board's capacity to take unified positions on regulatory questions, a risk the sweeping caucus correctly identified during deliberations.

  4. The three early-career seats will be filled through a separate ballot question to ensure bylaw compliance without complicating the transferable vote count for the general seats. This at-large structure simultaneously benefits the dispersed specialist society members by lowering the election threshold to roughly eight percent, allowing their concentrated preferences to win representation despite their geographic distribution.

  5. The sweeping caucus argues that single transferable vote counts are too complex for members to understand and may depress turnout further among those unfamiliar with ranked choices. We concede this risk and therefore mandate a member education campaign funded by the association budget prior to the first election under the new system.
