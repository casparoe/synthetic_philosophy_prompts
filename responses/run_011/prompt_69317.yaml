answer: |-
  ### 1. Space First: The Axes of Division

  To map the logical terrain without using the forbidden vocabulary, we must identify the underlying structural disagreements. Most readers assume there is one "right" way to distribute rewards. The philosophical space reveals six distinct axes where that assumption fractures.

  1.  **Basis of Claim:** Is reward tied to the *outcome* produced (the fixed car) or the *input* expended (the hours spent trying)?
  2.  **Ownership of Capacity (Novel):** If the capacity to expend effort is inherited like eye color, does the resulting reward belong to the individual or to the community that supplied the traits?
  3.  **Scope of Rule (Novel):** Do the rules for dividing wages apply universally, or only within specific boxes (e.g., the market vs. the family)?
  4.  **Resolution of Ties (Novel):** When two claims are identical and only one prize exists, is the inability to satisfy both a system error requiring repair, or a fact of nature?
  5.  **Function of Inequality:** Is unequal payment a tool to generate more value, a signal of social contribution, or a recognition of status?
  6.  **Object of Concern (Novel):** Is the injury of being at the bottom a lack of goods (shares) or a loss of civic standing (status)?

  **Locating Positions:**
  *   **Pre-institutionalists** occupy Basis=Input, Ownership=Self, Scope=Universal.
  *   **Luck Sceptics** occupy Basis=Input, Ownership=Given.
  *   **Pluralists (Miller)** occupy Scope=Local.
  *   **Historical Entitlement (Nozick)** occupies Basis=History (ignoring Input/Output).
  *   **Rawlsians** occupy Ownership=Given, Function=Incentive (not Recognition).
  *   **Status Egalitarians** occupy Object=Standing.
  *   **Technocrats** occupy Resolution=Error, Object=Shares.
  *   **Tyranny of Merit (Sandel)** occupies Function=Harmful.

