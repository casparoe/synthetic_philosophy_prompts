  ### 4. Required Leaves & Path Mapping

  *Note: The following Leaves aggregate specific paths from the tree above. The Path String is the sequence of Node+Option.*

  **Leaf 1: The Pre-institutional View**
  *   **Path:** 1B - 2A - 4A
  *   **Position:** Rewards track moral effort, which is owned by the self, universally.
  *   **Thinker:** Locke (standard reference).

  **Leaf 2: The Pluralist View**
  *   **Path:** 1B - 4B
  *   **Position:** Effort matters, but only within specific spheres like work, not family.
  *   **Thinker:** Miller.

  **Leaf 3: The Distributive View**
  *   **Path:** 1B - 2B - 6A - 9A - 10A
  *   **Position:** Traits are given; pay is an incentive tool, not moral recognition; fix systems for accuracy.
  *   **Thinker:** Rawls.

  **Leaf 4: The Historical View**
  *   **Path:** 5A
  *   **Position:** Ownership is settled by past transactions, not current effort or need.
  *   **Thinker:** Nozick.

  **Leaf 5: The Luck Sceptic View**
  *   **Path:** 1B - 2B - 9B
  *   **Position:** Effort is circumstantial; ranking people by it is wrong; stop the mechanism.
  *   **Thinker:** Dworkin.

  **Leaf 6: The Hubris View**
  *   **Path:** 6B - 9B
  *   **Position:** High pay as "worth" is hubris; believing in ranking harms the community.
  *   **Thinker:** Sandel.

  **Leaf 7: The Technocrat View**
  *   **Path:** 9A - 10A
  *   **Position:** The mechanism is broken but repairable; accuracy is the goal.
  *   **Thinker:** None (Centrist).

  **Leaf 8: The Status View**
  *   **Path:** 8A
  *   **Position:** The injury of losing is about civic standing, not the prize itself.
  *   **Thinker:** Anderson.

  **Leaf 9: The Contribution View**
  *   **Path:** 7B
  *   **Position:** Rewards should track social benefit, not market price.
  *   **Thinker:** Murphy.

  **Leaf 10: The Scarcity Glitch**
  *   **Path:** 3A - 11A
  *   **Position:** Equal claims with one prize means the system failed to provide enough.
  *   **Thinker:** None (Policy).

  *Merge Note:* The "Ideological position that believing in meritocracy is itself socially harmful" and the "Tyranny of Merit" (Sandel/Markovits) collapse into **Leaf 6**. Both argue that the *belief* in the ranking system corrodes civic virtue, not just that the mechanism is inaccurate. Separating them requires asking about the psychological state of the winner, which exceeds the node limit.

