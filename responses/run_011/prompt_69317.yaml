  ### 2. The Tree

  **Node 1: The Garage**
  Two siblings work in a family repair shop. One fixes ten cars a day. The other fixes four but stays late every night trying to learn. The boss has a bonus to award.
  *   **A:** Give it to the one who fixed more cars.
  *   **B:** Give it to the one who tried harder.

  **Node 2: The Origin (Conditional on 1B)**
  *Only answer if you chose 1B.*
  Suppose a study shows the drive to stay late and try hard is largely passed down from parents through genes and early upbringing, like height.
  *   **A:** It still counts as their own effort.
  *   **B:** It counts as a circumstance they were given.

  **Node 3: The Scholarship**
  A committee has one scholarship and two applicants with identical grades, test scores, and background.
  *   **A:** Flip a coin; the system cannot distinguish further.
  *   **B:** Keep looking until you find a tiny difference to justify choosing one.

  **Node 4: The Dinner Table**
  Consider the rule you chose for the garage bonus. Should that same rule decide who gets the largest slice of pizza at a family dinner?
  *   **A:** Yes, the principle is the same everywhere.
  *   **B:** No, family rules are different from work rules.

  **Node 5: The Farm**
  A person inherits a large farm. They did not buy it, but their great-grandfather did. A neighbor argues they should share the harvest.
  *   **A:** The deed is enough; the history of purchase settles it.
  *   **B:** Current work on the land matters more than old papers.

  **Node 6: The Boardroom**
  A company pays its chief executive fifty times the average worker.
  *   **A:** This is necessary to stop them from leaving for a rival.
  *   **B:** This is because their decisions are worth that much more.

  **Node 7: The Hospital**
  A heart surgeon earns ten times what a pediatric nurse earns.
  *   **A:** Pay should track the price the market will bear.
  *   **B:** Pay should track the benefit provided to other people.

  **Node 8: The Medal**
  In a race, one person wins gold, the other silver. The time difference was one-hundredth of a second.
  *   **A:** The loser is equal in standing, just short on the prize.
  *   **B:** The loser is ranked lower in ability and status.

  **Node 9: The Algorithm**
  A hiring computer predicts success based on postcode and school. It works, but excludes some groups.
  *   **A:** Tune the settings to include them without losing accuracy.
  *   **B:** Stop using the computer to rank people for jobs.

  **Node 10: The Repair (Conditional on 9A)**
  *Only answer if you chose 9A.*
  When tuning the settings, what is the goal?
  *   **A:** Make the prediction of success as accurate as possible.
  *   **B:** Make the outcome match the population's demographics.

  **Node 11: The Scarcity Meaning (Conditional on 3A)**
  *Only answer if you chose 3A.*
  If you flip a coin because claims are equal, what does that imply?
  *   **A:** The system failed to provide enough prizes.
  *   **B:** The question of who gets it simply stops applying.

