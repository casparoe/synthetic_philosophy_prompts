  ### 7. Reveal Copy

  **Leaf 1 (Pre-institutional)**
  You believe effort creates a claim that exists before laws are written. Institutions should find and reward this struggle wherever it appears. Your view demands we look past results to the struggle beneath.
  *Hard Question:* If the struggle itself is a gift from your parents, why is the reward yours alone?

  **Leaf 2 (Pluralist)**
  You hold that rules for dividing money do not apply to dividing love or civic respect. Effort matters at work, but not at home. You protect the family from the market.
  *Hard Question:* Who draws the line between spheres, and what stops the market from crossing it?

  **Leaf 3 (Distributive)**
  You see traits as given circumstances, not personal property. Pay is a tool to help everyone, not a medal for virtue. You support systems that maximize the minimum share.
  *Hard Question:* If traits are given, why do we let people keep the rewards they generate?

  **Leaf 4 (Historical)**
  You argue that past transactions settle current claims. If the chain of ownership is unbroken, the current holder is secure. You prioritize history over current need.
  *Hard Question:* Does a chain of ownership ever begin, or is every title rooted in a past taking?

  **Leaf 5 (Luck Sceptic)**
  You think effort is as much a gift as talent. Ranking people by their drive is like ranking them by their height. You would dismantle the ranking system entirely.
  *Hard Question:* Without ranking, how do you decide who does the hard jobs nobody wants?

  **Leaf 6 (Hubris)**
  You believe believing in the ranking system harms the winners as much as the losers. It breeds arrogance above and resentment below. You want to change the culture, not just the pay.
  *Hard Question:* Can you persuade the winners to give up their status without forcing them?

  **Leaf 7 (Technocrat)**
  You see the system as a machine that is currently jammed. It can be tuned to pick the right people without bias. You trust data if the data is clean.
  *Hard Question:* Who decides what "right" looks like when the data is cleaned?

  **Leaf 8 (Status)**
  You worry less about the size of the prize than the standing of the loser. A society is bad if losing a race makes you a lesser citizen. You separate worth from winning.
  *Hard Question:* Can you have unequal prizes without creating unequal standing?

  **Leaf 9 (Contribution)**
  You argue pay should match the good done for others, not the price the market sets. A nurse should out-earn a speculator. You value social utility over scarcity.
  *Hard Question:* Who measures the "good" when the market says something else?

  **Leaf 10 (Scarcity Glitch)**
  You believe that when two people are equal and one prize exists, the system has failed to provide enough. Scarcity is a policy error, not a natural fact.
  *Hard Question:* Is there any prize so unique that scarcity is unavoidable?
