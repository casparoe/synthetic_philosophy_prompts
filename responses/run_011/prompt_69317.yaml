  ### 5. Vacancies

  **Vacancy 1: The Local Universalist**
  *   **Coordinates:** Scope=Local (4B) + Basis=Universal Moral Truth (implied by 1B-2A).
  *   **Diagnosis:** **Incoherent.** One cannot claim a rule is a universal moral truth about human effort while simultaneously arguing it only applies in the workplace. If effort creates a claim, it creates it everywhere.
  *   **Status:** Empty due to logical contradiction.

  **Vacancy 2: The Status Absolutist**
  *   **Coordinates:** Object=Standing (8A) + Resolution=Fact of Nature (11B).
  *   **Diagnosis:** **Unarticulated.** This position holds that losing a prize does not lower your standing (8A), yet when prizes are scarce and claims equal, the question of distribution is meaningless (11B). Most thinkers who care about standing argue scarcity *must* be resolved to protect standing. This cell suggests standing is robust enough to ignore scarcity resolution entirely.
  *   **Status:** **Unarticulated.** This is a promising angle for Part Two: can we build a society where standing is so decoupled from prizes that scarcity resolution becomes trivial?

  **Vacancy 3: The Inherited Effort Incentivizer**
  *   **Coordinates:** Origin=Given (2B) + Function=Incentive (6A).
  *   **Diagnosis:** **Unattractive.** This view admits effort is inherited luck but still argues we should pay for it to incentivize production. While logically possible (Rawls touches it), few find it attractive to explicitly incentivize "luck."
  *   **Status:** Coherent but politically toxic.

  ***

  ### 6. Separation Failures

  **1. Rawls vs. Nozick on the Farm (Node 5)**
  *   **Failure:** Node 5 asks "Deed or Work?" Nozick chooses Deed (History). Rawls chooses "Whatever the institutions say." If the institution says "Deed," Rawls agrees. The node cannot distinguish between "History creates the right" (Nozick) and "Institutions chose to honor history" (Rawls).
  *   **Remedy:** None. Distinguishing them requires asking about the *origin* of the property rules, which adds two nodes.
  *   **Verdict:** **Cannot be split in 90 seconds.**

  **2. Difference Principle vs. Pure Incentive (Node 6)**
  *   **Failure:** Node 6 asks "Keep them (Incentive)" vs "Worth (Recognition)." Rawls supports inequality *only* if it helps the worst off (Difference Principle). A pure market theorist supports it if it generates growth. Both choose 6A.
  *   **Remedy:** Add Node 12: "If the pay helps the rich but not the poor, is it allowed?"
  *   **Verdict:** **Add Node 12 (Conditional on 6A).**
      *   *Node 12:* If the high pay does not help the lower earners, is it still allowed?
      *   *A:* Yes, growth helps everyone eventually.
      *   *B:* No, inequality needs a direct lift for the bottom.
      *   *(Path 6A-12B isolates Rawls from Pure Incentive).*

  **3. Cohen's Objection (Incentive Justification)**
  *   **Failure:** Cohen argues that if the talented are truly public-spirited, they wouldn't *need* the incentive to work hard. Node 6 assumes the incentive is necessary.
  *   **Remedy:** None. Testing the internal ethos of the CEO requires a psychological profile, not a distributive choice.
  *   **Verdict:** **Cannot be split.** It requires assuming facts about the CEO's motivation that the reader cannot know.

