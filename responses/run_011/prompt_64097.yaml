answer: |-
  ### The Logical Space of Democratic Innovation

  Before drawing the branches, we must expose the axes along which these proposals actually diverge. The primary fracture is diagnostic: do you believe campaigning for votes corrupts the *person* (making them self-serving) or merely distorts the *incentive* (making them short-termist)? A second axis concerns capacity: is the citizen's virtue in their *ignorance* (freedom from lobbyist capture) or their *latent competence* (ability to learn when shielded from pressure)? Third is ontology: does a microcosm of citizens speak *as* the people (descriptive representation) or merely *for* them (trustee representation)? Finally, there is the question of authority: is the body's power to *block* (veto), to *propose* (agenda), or to *command* (legislate)? Most self-described enthusiasts fuse these distinct commitments into a single "lottocracy" label, obscuring whether they want to abolish voting entirely or merely temper it with a reviewing chamber. The following instrument forces these distinctions into the open.

  ### The Decision Instrument

  *Instructions: For each claim below, mark whether you Agree or Disagree. Do not worry about consistency yet; the pattern reveals your position.*

  1.  **The Diagnosis:** "The requirement to campaign for votes inevitably forces leaders to prioritize donors over constituents."
      *   (Agree = Replace voting; Disagree = Reform voting)
  2.  **The Function:** "Ordinary citizens are better suited to deciding specific laws than to choosing individual leaders."
      *   (Agree = Legislative body; Disagree = Personnel body)
  3.  **The Authority:** "Decisions made by a representative group of citizens should become law without requiring a public vote."
      *   (Agree = Binding; Disagree = Advisory/Referendum)
  4.  **The Selection:** "Selection by lottery should be mandatory for those chosen, even if they have no prior interest in politics."
      *   (Agree = Pure Random; Disagree = Screened/Volunteer)
  5.  **The Duration:** "This body should exist permanently to monitor government, rather than dissolving after a specific task."
      *   (Agree = Standing; Disagree = Ad Hoc)
  6.  **The Scope:** "This method should replace voting for all government positions, not just lawmaking."
      *   (Agree = Full Replacement; Disagree = Mixed System)
  7.  **The Power:** "The body's main role should be deciding which issues get discussed, rather than deciding the issues themselves."
      *   (Agree = Agenda-Setting; Disagree = Decision-Making)

  ### The Leaves (Typology of Positions)

  *Match your answer pattern to the profile below to find your leaf.*

  **1. The Full Lottery** (Agree 1, 2, 3, 4, 5, 6, Disagree 7)
  *   **Awkward Commitment:** You must accept that administrative bureaucrats and judges should also be chosen by lot, not merit.
  *   **Empirical Claim:** Random selection eliminates factionalism entirely because no one can campaign to join the ruling class.

  **2. The Bicameral Partner** (Agree 1, 2, 3, 4, 5, Disagree 6, Disagree 7)
  *   **Awkward Commitment:** You must defend why one chamber represents "the people" while the other represents "the voters," despite both claiming democratic legitimacy.
  *   **Empirical Claim:** A lotted upper house will resist lobbyist capture better than an elected one because members cannot be promised future careers.

  **3. The Constitutional Convention** (Agree 1, 2, 3, 4, Disagree 5, Disagree 6, Disagree 7)
  *   **Awkward Commitment:** You must explain why citizens are competent to rewrite the rules of the game but not to play it day-to-day.
  *   **Empirical Claim:** People behave more responsibly when they know their decision is final and unrepeatable.

  **4. The Personnel Jury** (Agree 1, Disagree 2, Agree 3, Agree 4, Agree 5, Disagree 6, Disagree 7)
  *   **Awkward Commitment:** You are arguing that citizens should hire the manager but not set the company policy.
  *   **Empirical Claim:** Citizens are better at judging character than policy complexity.

  **5. The Agenda Council** (Agree 1, 2, Disagree 3, Agree 4, Agree 5, Disagree 6, Agree 7)
  *   **Awkward Commitment:** You must accept that setting the agenda is effectively a veto power, making your "advisory" claim misleading.
  *   **Empirical Claim:** Political paralysis is caused by parties refusing to discuss certain topics, not by bad legislation.

  **6. The Advisory Panel** (Agree 1, 2, Disagree 3, Agree 4, Agree 5, Disagree 6, Disagree 7)
  *   **Awkward Commitment:** You must tolerate the likelihood that politicians will ignore your body whenever it is inconvenient.
  *   **Empirical Claim:** Politicians will follow citizen advice if it is publicly visible, even if not legally binding.

  **7. The Epistocratic Chamber** (Agree 1, 2, 3, Disagree 4, Agree 5, Disagree 6, Disagree 7)
  *   **Awkward Commitment:** You must define a "competence" test that does not simply replicate existing class biases.
  *   **Empirical Claim:** Randomly selected people who pass a civics test resist propaganda better than those who do not.

  **8. The Referendum Trigger** (Agree 1, 2, Disagree 3, Agree 4, Disagree 5, Disagree 6, Disagree 7)
  *   **Awkward Commitment:** You are relying on the broader public to care enough to vote in the referendum your body triggers.
  *   **Empirical Claim:** A citizen body's endorsement increases turnout and deliberation quality in subsequent public votes.

  **9. The Tiny Binding Jury** (Agree 1, 2, 3, Agree 4, Disagree 5, Disagree 6, Disagree 7)
  *   **Awkward Commitment:** You must accept that 12 people can legitimately decide for millions without expert staff or long deliberation.
  *   **Empirical Claim:** Small groups deliberate more honestly than large ones because social pressure is immediate and personal.

  **10. The Reformist Monitor** (Disagree 1, Agree 2, Disagree 3, Agree 4, Agree 5, Disagree 6, Disagree 7)
  *   **Awkward Commitment:** You believe campaigning can be fixed while keeping the same people who benefit from the current system in charge of fixing it.
  *   **Empirical Claim:** Auditing the bureaucracy reduces corruption more effectively than changing who legislates.

  **11. The Stratified Mirror** (Agree 1, 2, 3, Agree 4, Agree 5, Disagree 6, Disagree 7)
  *   **Awkward Commitment:** You prioritize demographic quotas over pure randomness, risking gerrymandered selection criteria.
  *   **Empirical Claim:** A body is only legitimate if its demographic makeup exactly matches the population's census data.

  **12. The Volunteer Pool** (Agree 1, 2, 3, Disagree 4, Agree 5, Disagree 6, Disagree 7)
  *   **Awkward Commitment:** You must admit that "random selection from volunteers" is effectively self-selection by the politically engaged.
  *   **Empirical Claim:** People who volunteer for civic duty are more representative than those who run for elected office.

  ### Empty Cells and Unexplored Territories

  Several answer combinations yield empty cells in the current landscape. The combination of **Full Replacement (Yes 6)** with **Advisory Only (No 3)** is logically incoherent; if you replace voting entirely but grant no binding power, you have created anarchy or a technocracy, not a democracy. The combination of **Screened Selection (No 4)** with **Full Replacement (Yes 6)** is theoretically possible but politically unattractive; it resembles a meritocratic aristarchy more than a democracy, which is why even epistemic democrats usually retreat to mixed systems.

  However, two cells are empty not because they are incoherent, but because they are dismissed too quickly. First, **Epistocratic Sortition (No 4)** is often rejected as elitist, yet you should consider that pure randomness assumes competence is evenly distributed, which contradicts evidence on political literacy. A random draw *filtered* for basic comprehension might outperform both pure lot and pure election. Second, the **Tiny Binding Jury (Yes 3, No 5, Small N)** is dismissed as impractical for complex legislation, but this assumes legislation requires months of staffing. If the question is binary (war/peace, yes/no law), a jury model scaled from legal systems might resolve deadlock faster than standing assemblies, provided the question framing is neutral. The dismissal here rests on an assumption that all political questions require long-form deliberation rather than judgment.

  ### Indistinguishable Pairs

  Your tree may struggle to separate **The Bicameral Partner (Leaf 2)** from **The Full Lottery (Leaf 1)** if the elected lower house becomes ceremonial. In practice, if the lotted upper house has veto power and the elected house loses legitimacy, the system drifts toward Leaf 1. To separate them cleanly, you need an extra question: *"Can the elected body override the lotted body with a supermajority vote?"* If yes, it is Bicameral; if no, it is drift toward Full Lottery.

  Similarly, **The Agenda Council (Leaf 5)** and **The Advisory Panel (Leaf 6)** are functionally identical if the legislature ignores both. The distinction relies on the assumption that controlling the timetable is power distinct from giving advice. To separate them, ask: *"Does the legislature lose the right to vote on issues the body does not place on the agenda?"* If yes, it is Agenda Control; if no, it is merely Advisory.
