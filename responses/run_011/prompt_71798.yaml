prompt: |-
  OK so my friend and I just spent a three hour arguement about pain asymbolia and I genuinely can't tell who won, so I want you to settle it by building something rather than by summarizing the debate back at me.

  Quick sync so we're on the same page: asymbolia is the condition where someone has an intact pain sensation — they can tell you where it is and how intense it is — but report that it doesn't bother them, don't withdraw or avoid, and seem largely immune to suffering from it. The standard version comes with a lesion somewhere (insula, cingulotomy, that neighborhood). My friend's claim: if you can build a case like that with no lesion and no sci-fi, where the person still sincerely says, on calm reflection, that the sensation is bad — genuinely bad, not merely notable — while having zero urge to end it and not suffering at all, then you've shown the badness of pain isn't part of the sensation itself, it's what the subject does with it. My claim: no such case can be built without cheating — either you sneak in a hidden motivation, or the person's avowals come out incoherent, or you just stipulate the verdicts you wanted and dress them up as a scenario.

  So build the case. Or tell me I'm right that it can't be built and show me exactly where any attempt has to bend. Both are acceptable answers; hand-waving is not.

  Specs:

  1. One paragraph, max ~200 words, ordinary world. A clinic, a gym, a kitchen, a trail — not a lab on a space station.
  2. The dissociation has to come from a route a doctor would nod at: hypnosis, ordinary pharmacology at an ordinary dose, decades of contemplative practice, the state a distance runner or a soldier or a burn patient gets into. No invented syndromes, drugs, implants, or neural gadgets. If you think it truly can't be done lesion-free, say so and argue it.
  3. The case must satisfy all of the following, and I want them tagged so we can point at them later:
   (a) discriminative content intact — location, intensity, quality all reported normally and accurately;
   (b) unprompted, with no audience to impress, on calm reflection they say the sensation is bad, and they mean it;
   (c) no urge to make it stop — they'd decline a free, instant, side-effect-free way to end it right now;
   (d) no suffering — attention, mood, and plans completely untouched;
   (e) real, accumulating tissue damage that they know about, and would act on immediately if you described it to them in non-pain terms ("your tendon is shredding");
   (f) evaluation and motivation intact everywhere else — they'd get out of a burning room.
  4. Run it twice. Variant A is as above. Variant B changes exactly one thing: at (c) they don't merely lack the urge, they actively want to keep it, and can say why. Nothing else moves. Give me the delta as one sentence, not a rewrite.
  5. Theory check. Score both variants against each of these accounts of what makes pain bad for the person having it:
   - raw felt quality: the badness is the intrinsic aversive character of the sensation, not any judgment or push;
   - evaluative content: pain is unpleasant because it presents your own body as being in a bad state;
   - motivational/imperative: pain is unpleasant because it carries a built-in demand to cease;
   - disruption: pain is bad for you insofar as it commandeers your attention, mood, and agency.
   If there's a standard fifth account I left off — including the deflationary line that a state like this simply isn't a pain — add it as a row and flag that you added it.
   For each: is the subject's state bad for them in A, bad for them in B, does it still count as a pain at all, which tagged clause is driving that verdict, and what would the defender say to disqualify the case (their (b) isn't sincere; (c) is repressed motivation; (a) and (d) can't co-occur; etc.).
  6. Diagnosis. Which single clause is doing the most work — i.e. which one, relaxed, collapses the spread of verdicts? Then the deletion test: if I delete (b) so they just report no unpleasantness, does the whole thing degenerate into textbook asymbolia, and why is or isn't that interesting?

  Format: the paragraph, the one-sentence variant B delta, a table with columns [account | what makes pain bad on this view | bad for subject in A | bad for subject in B | still a pain? | clause doing the work | disqualifying move], a few sentences of prose for point 6, and then a JSON object at the end so I can diff your answer against hers:

  {
   "scenario": <the paragraph verbatim>,
   "route": <what produces the dissociation, one line>,
   "route_is_lesion_free": true | false,
   "variant_b_delta": <one sentence>,
   "theories": [ { "name": "", "criterion": "", "bad_A": "yes"|"no"|"mixed"|"indeterminate", "bad_B": "yes"|"no"|"mixed"|"indeterminate", "still_pain": "yes"|"no"|"indeterminate", "driving_clause": "(a)".."(f)", "disqualifying_move": "", "added_by_you": true|false } ],
   "work_horse_clause": "(a)".."(f)",
   "deletion_test": <two or three sentences>,
   "who_won": "friend" | "asker" | "draw" | "the_question_is_bad",
   "cheating_confessions": [ <any place you stipulated a verdict instead of generating one from the view> ],
   "honesty_note": <what you're least sure of, especially whether (b)+(c)+(d) can really co-occur in one person>
  }

  No padding, no lit review, and be blunt about who won — I'd rather lose cleanly than get comforted.
