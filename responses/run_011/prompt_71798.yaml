  **Variant B Delta:** In Variant B, Ken adds, "I want this to continue because the badness clarifies my focus," introducing a positive valuation without restoring aversive suffering.

  | Account | What Makes Pain Bad | Bad in A | Bad in B | Still Pain? | Clause Doing Work | Disqualifying Move |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | Raw Felt Quality | Intrinsic aversive character | Yes | Yes | Yes | (b) | (b) is insincere; felt quality implies urge |
  | Evaluative Content | Represents body as damaged | Yes | Yes | Yes | (b) | Evaluation naturally drives motivation (c) |
  | Motivational/Imperative | Built-in demand to cease | No | No | No | (c) | No imperative = not pain (Bain/Martínez) |
  | Disruption | Commandeers attention/mood | No | No | Yes | (d) | No disruption = not unpleasant |
  | Deflationary (Added) | Unpleasantness = Motivation | No | No | No | (c) | This is just sensation, not pain |

  **Diagnosis:**
  Clause (b) is the work horse; it is the only thing distinguishing this from textbook asymbolia. If you delete (b) so Ken just reports "no unpleasantness," the case collapses into standard lesion-based asymbolia, which is philosophically uninteresting because it removes the "badness" judgment entirely. The tension exists because (b) asserts value while (c) and (d) deny the functional consequences of that value. In a lesion-free brain, judging a sensation "genuinely bad" naturally recruits motivational systems; to prevent this requires stipulating the verbal report against the psychological reality.

