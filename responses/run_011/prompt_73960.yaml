      **MEMORANDUM**

      **TO:** Commissioners of the Initiative Review Commission
      **FROM:** [Your Name], Presiding Commissioner
      **DATE:** October 24, 2023
      **SUBJECT:** Decision on Measure 214 (Forethought Act)

      **RECOMMENDATION**

      I recommend we **Refuse to Certify** Measure 214. While the sponsors' offered amendment resolves the implementation conflict in Section 4, the measure fails on Ground (d). Section 3 attempts to extinguish the people's "continuing power to alter or abolish their government" by insulating this measure from future challenge and making this Commission an unreviewable gatekeeper. Even if Ground (d) were interpreted more permissively, the non-severability clause prevents us from excising Section 3 to save the fiscal rule in Section 1.

      **GROUND (D): THE CONTINUING POWER**

      **[Settled Text]** Article I, section 2 reserves to the people the "continuing power to alter or abolish their government." **[Contested Theory]** The dispute before us is whether entrenchment mechanisms violate this reservation.

      Two colleagues argue Section 2 and Section 3 are fatal. Their strongest argument rests on Section 3. While Section 2 merely raises the threshold for repeal (a common constitutional feature), Section 3 bars *any* future initiative conflicting with this measure and designates this Commission as the sole, unreviewable judge of conflicts. **[Settled Text]** Our jurisdiction allows the legislature to attach counter-proposals and requires our gatekeeping review. **[Contested Theory]** However, permanently stripping the people of the initiative power regarding a specific subject, and removing judicial review of that restriction, effectively abolishes a portion of their governmental power.

      The opposing colleagues argue Ground (d) cannot invalidate entrenchment without invalidating the Constitution itself. **[Common Ground]** It is true that all constitutions bind future majorities; the entrenched rights under Ground (a) are themselves unamendable. **[Contested Theory]** However, there is a functional distinction between entrenching specific rights (Ground (a)) and entrenching a policy while disabling the mechanism of popular sovereignty (the initiative) used to check it. If a majority can permanently disable the tools of self-correction, the "continuing" power becomes a one-time event.

      **[Epistemic Status]** I find the Refusal position more persuasive regarding Section 3. While debt brakes (Section 2) are arguably consistent with standard constitutionalism, an unreviewable bar on future voting (Section 3) is inconsistent with a "continuing" power. This is not a settled legal question in Meridian, but it is the most textually faithful reading of Article I, section 2. If this theoretical dispute were settled in favor of the Certification side, Measure 214 would still face the Section 4 hurdle below.

      **GROUND (C): THE SECTION 4 PUZZLE**

      **[Settled Text]** Ground (c) prohibits measures that are impossible to execute or internally contradictory. **[Analysis]** As filed, Section 4 states Measure 214 prevails over *any* provision, including a legislative counter-proposal. Yet the Constitution mandates a preference question when both a measure and counter-proposal pass. **[Resolution]** If Measure 214 legally prevails regardless of the vote, the preference question is a nullity. This creates an internal contradiction between the measure's text and the constitutional process.

      The sponsors have offered to amend Section 4 to yield to the counter-proposal if voters prefer it. **[Settled Effect]** This amendment cures the Ground (c) defect. It aligns the measure's operation with the constitutional preference mechanism. **[Contested Theory]** Some might argue the original text was merely a statement of priority rather than a procedural bar, but given the Commission's duty to ensure implementability, we must treat the contradiction as fatal unless cured. The offered amendment resolves this puzzle completely.

      **SEVERABILITY AND NON-SEVERABILITY**

      **[Settled Text]** Measure 214 contains an express non-severability clause declaring Sections 1 through 4 indivisible. **[Application]** We cannot certify Section 1 (the fiscal rule) while striking Sections 2 through 4 (the entrenchment and precedence clauses).

      **[Analysis of Amendment]** The sponsors' offer to amend Section 4 does not cure the Ground (d) defect in Section 3. Because the measure is indivisible, the fatality of Section 3 doomed Section 1. **[Hypothetical]** If the non-severability clause were absent, we could theoretically certify Section 1 subject to striking Sections 2 and 3. However, we must respect the drafters' intent regarding unity. The amendment fixes the implementability (Ground (c)) but not the sovereignty (Ground (d)) issue.

      **THE LOSING CASE**

      **[Strongest Counter-Argument]** I must articulate the strongest version of the Certification argument for the record. The colleagues favoring certification argue that "continuing power" does not mean "unbound power." **[Reasoning]** A constitution is, by definition, a binding constraint. If Article I, section 2 prevents any binding rule, the Constitution's own amendment rules (which are difficult to change) would be invalid. Furthermore, Ground (a) already accepts entrenched rights; a fiscal rule is not qualitatively different from a free speech right in terms of entrenchment. **[Theoretical Implication]** If this view prevails, Ground (d) serves only to prevent total abolition of government (e.g., establishing a monarchy), not policy entrenchment. **[Epistemic Status]** This is a coherent theoretical position. If the Commission accepts that "continuing power" allows for supermajority locks on policy, Ground (d) is not a bar. However, even under this view, Section 3's removal of judicial review remains problematic, as it concentrates power in this Commission without check, which arguably alters the government's structure in a way the people cannot reverse.

      **BALLOT LANGUAGE (CONTINGENT)**

      **[Procedural Note]** Although I recommend refusal, should the Commission vote to certify conditional on the Section 4 amendment and a finding that Ground (d) is not violated, the following language applies.

      **Ballot Title:** Forethought Act: Fiscal Balance and Debt Limitation.
      **Preference Question:** If both the Forethought Act and the Legislative Counter-Proposal are approved, which one shall take effect?

      **CONCLUSION**

      **[Bottom Line]** Measure 214 cannot be certified. The Section 4 amendment resolves the implementation contradiction, but the non-severability clause ties the valid fiscal rule to the invalid restrictions on future popular sovereignty. We must refuse certification.

      **(Word Count Check: ~950 words. I need to expand on the reasoning to hit ~1,200.)**

