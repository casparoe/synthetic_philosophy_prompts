          *   *Critique:* Yes, this is vulnerable. Why is an AD *always* a whole-life question? Sometimes it's "I hate nausea." That's experiential.
          *   *Repair:* Don't define all directives as whole-life. Make the *interpretation* of the directive the first step. Does this directive purport to settle a whole-life ranking (e.g., "no life with dementia") or a specific symptom avoidance? If the former, t1 has epistemic privilege. If the latter, t2's experience matters more. This nuance strengthens the paper significantly.

      *   *Question 5 (Reversibility):*
