      *   **Asymmetry/Reversibility:** Error A (honour bad directive) is irreversible. Error B (override good directive) is reversible. Author argues reversibility only matters if the subject can use it (i.e., has capacity).
      *   **Metaphysics:** Claims reductionism makes metaphysics irrelevant; only current evaluative capacity matters.

  3.  **Drafting the Feedback (Iterative Process):**

      *   *Question 1 (Substantive vs. Competence):* This is the biggest hurdle. Standard competence assessments are *synchronous* (can you understand/retain/weigh *now*?). The author's view is *diachronic* (can you weigh your life as a narrative?).
          *   *Critique:* A standard competence test might say the dementia patient *lacks* competence to consent to dialysis *now*. So standard practice follows the directive. The author says the directive is strong *because* capacity is gone. This looks similar.
          *   *Divergence:* What if someone has capacity *now* but lacks diachronic capacity? (Mania? Severe depression? Radical value shift without cognitive decline?). Or someone lacks standard capacity but retains diachronic intuition?
          *   *Advice:* You need to distinguish "decision-specific capacity" (standard) from "diachronic evaluative capacity" (your view). The diverging case is the Faith case (has capacity, but you override) or a case where someone lacks standard capacity but the directive is weak (early dementia where they can still express a coherent life narrative). Actually, the Faith case is the best diverger. Standard competence says she can decide now, so her current refusal overrides past directive. Your view *also* says current overrides past. Wait.
          *   *Correction:* In the Faith case, standard law/ethics usually says if you have capacity *now*, your current decision overrides the AD. So your view aligns with standard practice there.
          *   *Real Divergence:* The Dementia Case. Standard practice: If lacking capacity *now*, AD rules (unless evidence it doesn't apply). Your view: AD rules *more strongly* the less capacity they have. Standard view might worry about the "then self" vs "now self" welfare (Dresser). Your view says it's about *who can ask the question*.
          *   *Refinement:* The substantive claim is that the *justification* shifts from autonomy/identity to epistemic privilege. To make it bite, you need a case where standard competence says "capable" but diachronic capacity says "no." E.g., a manic patient refusing life-saving treatment. They pass MacCAT-T but cannot evaluate their "whole life." Your view would uphold a prior directive against them; standard competence might not.

      *   *Question 2 (Nephrologist vs. Dworkin):*
          *   Dworkin: Critical interests (t1) trump experiential interests (t2). Directive stands.
          *   Author: Diachronic capacity (t1) trumps present contentment (t2). Directive stands.
          *   *Verdict:* They converge on the verdict. The *reason* differs (Critical Interests vs. Epistemic Position).
          *   *Advice:* The case doesn't distinguish the *outcome*, only the *ground*. If the husband's challenge (it was grief, not evaluation) succeeds, Dworkin might say "Critical interests weren't truly formed." You say "Diachronic evaluation didn't happen." It's very close. You might need to cut this as a distinguishing case and use it to illustrate the *mechanism* of your view instead. Or, lean into the "grief" aspect: Dworkin struggles with *quality* of critical interest formation; your view handles it as a condition on the epistemic act.

      *   *Question 3 (Faith Case):*
          *   This is your strongest diverger from Dworkin. Dworkin protects critical interests against drift. You protect the current epistemic position.
          *   *Counterexample:* It challenges your "inverse gradient." Here, capacity is retained, so authority shifts to t2. Dworkin says t1 binds.
          *   *Advice:* Don't accommodate it by giving up the ordering. The ordering *is* the point. The clause "even if I lose faith" attempts to waive future epistemic authority. You need to argue that epistemic authority is inalienable. You cannot contract away your capacity to evaluate your life *when you have it*. This is a strong philosophical move (anti-paternalism regarding the self).

      *   *Question 4 (Question-Begging):*
