answer: |-
  Here is an analysis of the appraisal practice you describe, reconstructing its theoretical commitments and adjudicating the dispute between you and your friend.

  ### 1. The Implicit Theory of Justice and Value

  The declining discount rate schedule presupposes a specific, hybrid theory of intergenerational value. It is not morally neutral, though it claims to be technically driven.

  **Moral Standing of Future Persons**
  The practice implicitly grants future persons equal moral standing in the limit, but unequal standing in the near term. By allowing the discount rate to fall toward a low floor (e.g., 1 percent) rather than staying at a market rate (e.g., 3.5 percent), the framework acknowledges that the welfare of people in the year 2300 should not be rendered negligible compared to people in 2024. However, because the rate remains positive even in the very long run, it rejects the strong egalitarian view that future welfare should be valued exactly equally to present welfare regardless of time or wealth. It treats time as a relevant factor for valuation, but one whose moral weight diminishes over distance.

  **Commensurability of Goods**
  The practice presupposes strong commensurability. By discounting "costs and benefits" using a single schedule for flood defenses, nuclear waste, and carbon abatement, it assumes that environmental integrity, human safety, and economic consumption can all be translated into a single numéraire (shadow prices). It assumes that a ton of carbon avoided in 2150 is comparable to a pound of infrastructure spending in 2024, provided both are discounted correctly. This rules out lexical priorities (e.g., "survival trumps all cost") or incommensurable values that cannot be traded off against consumption.

  **Assumptions About Future Wealth**
  The schedule relies on the logic of diminishing marginal utility of consumption, even if disguised as uncertainty. Standard discounting theory (the Ramsey rule) suggests we discount the future because we expect future people to be richer; a pound is worth less to a rich person than a poor one. The declining rate modifies this: it suggests we are *uncertain* about how much richer they will be. However, the existence of a positive floor (1 percent) implies a belief that the future is more likely to be wealthier than poorer. If the framework genuinely believed the future might be destitute, the certainty-equivalent rate could turn negative (valuing future consumption *more* than present). The positive floor presupposes a distribution of growth paths centered on positive expansion.

  ### 2. Strict Presuppositions vs. Compatible Fits

  You and your friend are arguing over the *generator* of the curve. It is vital to distinguish what the mathematics requires from what political narrative is attached to it.

  **Uncertainty About Long-Run Growth (The Technical Justification)**
  This is the only feature strictly required to generate a declining *certainty-equivalent* rate. This is known as the Weitzman effect. If the long-term growth rate is unknown, the discount factor becomes dominated by the lowest possible growth rates in the distribution as time extends. You are correct that this is a technical correction for risk. The math works regardless of ethical stance: if you are unsure about $r$, the effective discount rate declines.

  **Near-Zero Pure Rate of Time Preference (The Ethical Fit)**
  This is compatible but not strictly presupposed. A declining schedule can coexist with a positive pure time preference ($\rho > 0$), provided the uncertainty about growth is large enough. However, a floor of 1 percent is difficult to justify purely on uncertainty if one believes $\rho$ should be zero (the Stern Review position). The schedule *fits* a near-zero $\rho$ well, but it does not prove it.

  **The "Split-the-Difference" Compromise**
  Your friend is correct that the specific parameters (3.5 percent down to 1 percent) likely represent a political compromise, but incorrect that this invalidates the technical logic. The *shape* (declining) is licensed by uncertainty. The *levels* (where it starts and where it floors) are ethical/political choices. The practice smuggles ethics into the parameters while claiming the shape is purely epistemic.

  **Mutual Exclusivity**
  These justifications are not mutually exclusive, but they are not identical. A purely descriptive approach (market rates) would demand a constant high rate. A purely prescriptive approach (ethical discounting) would demand a constant low rate. The declining schedule is a third way: it uses descriptive uncertainty to achieve a prescriptive outcome. It is licensed by uncertainty, but it is *calibrated* by ethical compromise.

  ### 3. Internal Coherence and Time Inconsistency

  The practice suffers from a significant internal tension regarding dynamic consistency.

  **Time Inconsistency**
  You noted that the rate applied to a future year differs depending on when the appraisal is performed. This creates a time-inconsistency problem. Suppose you evaluate a project today (Year 0) with benefits in Year 300. You use the 300-year rate (1 percent). Suppose you revisit the decision in Year 100. The benefit is now 200 years away. Do you apply the 200-year rate (say, 1.5 percent)? If yes, the project's net present value drops simply because time has passed, potentially turning a "go" decision into a "no-go" decision without any new information.
  This violates the principle of dynamic consistency: a plan made today should remain optimal tomorrow unless new information arrives. The Green Book schedule implies that the current generation has the right to bind future generations to a lower discount rate than those future generations would choose for themselves. It privileges the "view from now" over the "view from then."

  **Equal Standing vs. Discounting Consumption**
  There is a tension between granting future welfare equal standing and discounting future consumption. If we believe future people matter as much as we do, we should only discount their consumption if we are sure they will be richer (diminishing marginal utility). But the justification here is *uncertainty*, not certainty of wealth.
  If we are truly uncertain whether they will be richer or poorer, discounting their consumption at a positive rate risks undervaluing their welfare in scenarios where they are poor. The practice attempts to solve this by lowering the rate, but it remains a consumption discount, not a welfare discount. It assumes that economic metrics adequately capture welfare, which is a philosophical leap, not a technical necessity.

  ### 4. Philosophical Underdetermination

  The practice is philosophically underdetermined because incompatible theories yield the same mathematical output.

  1.  **The Risk-Averse Utilitarian:** Believes $\rho = 0$ but acknowledges uncertainty about growth. Supports declining rates to protect against low-growth catastrophes.
  2.  **The Presentist Pragmatist:** Believes $\rho > 0$ (we care less about the future) but accepts political pressure to care about climate change. Supports declining rates to make long-term projects viable without admitting $\rho = 0$.
  3.  **The Hyperbolic Discounter:** Believes human psychology naturally discounts the near future heavily and the far future lightly. Supports declining rates as a reflection of observed behavior.

  All three would sign off on the Green Book schedule. Therefore, you cannot infer the ethical commitment from the schedule alone. You were arguing about the *justification*; your friend was arguing about the *motivation*. Both are visible in the practice, but neither is proven by it.

  ### 5. Counterfactuals: Replacing the Schedule

  **Scenario A: Single Very Low Constant Rate (e.g., 1 percent)**
  *   **Impact on Funding:** This would drastically increase the present value of benefits occurring in 100+ years. Climate abatement, nuclear waste storage, and biodiversity projects would become much more attractive relative to short-term infrastructure.
  *   **Presuppositions:** This presupposes a near-zero pure rate of time preference ($\rho \approx 0$) and a strong commitment to intergenerational equity. It assumes we are willing to sacrifice significant present consumption for future gain. It removes the "uncertainty" shield and makes an overt ethical claim: the future matters almost as much as the present.

  **Scenario B: Single Market-Anchored Constant Rate (e.g., 3.5 percent)**
  *   **Impact on Funding:** The present value of long-term benefits would collapse. Almost no project with costs today and benefits in 200 years would pass a cost-benefit test. Climate policy would be limited to short-term adaptation.
  *   **Presuppositions:** This presupposes that capital markets are the perfect judge of social value and that future generations will definitely be significantly wealthier than us (high $g$). It assumes efficiency within the current generation trumps equity across generations. It treats the future as a foreign country with a high risk of default.

  **What the Current Schedule Does Differently**
  The declining schedule allows the government to fund long-term projects *without* admitting to the high present-cost sacrifice of Scenario A, and *without* abandoning the future entirely as in Scenario B. It is a mechanism for intergenerational risk-sharing.

  ### 6. Adjudicating the Growth Objection

  Your friend argues that the schedule presupposes continued growth because it averages over growth paths, which a degrowth policy denies. You argue it is neutral regarding growth.

  **The Verdict: Your Friend is Substantively Right, You are Technically Right.**

  You are technically right that the *mathematics* of uncertainty (the Weitzman effect) does not require positive mean growth to produce a declining rate. Even if the mean growth were zero, uncertainty about that mean would cause the certainty-equivalent rate to decline over time.

  However, your friend is substantively right about the *calibration* and the *metric*.
  1.  **The Floor:** The schedule floors at 1 percent, not 0 percent or negative. In the Ramsey framework ($r = \rho + \eta g$), a positive $r$ implies a belief that $g$ is positive (assuming $\rho$ and $\eta$ are non-negative). By refusing to let the rate drop below 1 percent, the Treasury is asserting that the "center of gravity" of the future is economic expansion. A genuine degrowth scenario, where future welfare is decoupled from GDP or where GDP shrinks, would logically imply a negative discount rate (we should invest heavily now because future consumption will be scarcer and more valuable). The schedule rules this out.
  2.  **The Metric:** The uncertainty is modeled over *economic growth rates*. This presupposes that economic growth is the appropriate proxy for welfare. A degrowth advocate argues that welfare might increase while GDP decreases. By tying the discount rate to the uncertainty of GDP growth, the practice assumes GDP growth is the vehicle of future well-being.

  **Conclusion**
  You were making a technical point about the *mechanism* of uncertainty, which is valid: the declining shape is a rational response to not knowing the future. Your friend was making a philosophical point about the *parameters* and the *worldview*, which is also valid: the specific rates chosen assume a growing economy and conceal an ethical trade-off behind a technical formula.

  The practice is not neutral. It is a technical mechanism calibrated to ethical and political constraints. It avoids the philosophical honesty of admitting a low pure time preference (which would demand high present sacrifice) and avoids the philosophical honesty of admitting a high pure time preference (which would abandon the future). Instead, it uses "uncertainty" to bridge the gap, implicitly betting on a growing future while pretending it is merely hedging against the unknown.
