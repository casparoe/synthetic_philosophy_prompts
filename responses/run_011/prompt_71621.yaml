answer: |-
  **FINAL EXAMINATION — HISTORY 404: HOW THE STORY GETS TOLD**
  **Time Allowed:** 45 Minutes
  **Total Marks:** 20

  **QUESTION 1**

  Below are two Tables of Contents for hypothetical history textbooks covering the period 1945–1990. Both books cover the exact same nine events, listed in chronological order. However, the chapter breaks differ.

  **Table A: *The Age of Ideology***
  *   **Chapter 1: The Bipolar Standoff (1945–1962)**
      *   Founding of the United Nations (1945)
      *   Partition of India and Pakistan (1947)
      *   Start of the Korean War (1950)
      *   Bandung Conference (1955)
      *   Cuban Missile Crisis (1962)
  *   **Chapter 2: The Unraveling (1963–1990)**
      *   Apollo 11 Moon Landing (1969)
      *   OPEC Oil Embargo (1973)
      *   Iranian Revolution (1979)
      *   Fall of the Berlin Wall (1989)

  **Table B: *The Age of Interdependence***
  *   **Chapter 1: Reconstruction and Growth (1945–1973)**
      *   Founding of the United Nations (1945)
      *   Partition of India and Pakistan (1947)
      *   Start of the Korean War (1950)
      *   Bandung Conference (1955)
      *   Cuban Missile Crisis (1962)
      *   Apollo 11 Moon Landing (1969)
      *   OPEC Oil Embargo (1973)
  *   **Chapter 2: Instability and Change (1974–1990)**
      *   Iranian Revolution (1979)
      *   Fall of the Berlin Wall (1989)

  **Prompt:**
  Periodization is an argument about causality, not just calendar management. Analyze the difference between Table A and Table B. Does one structure offer a *better* explanation of the period than the other, or are they merely different? In your answer, distinguish between choices made for evidentiary reasons (what actually caused what) and choices made for audience or purpose (who the story is for).

  ***

  **MODEL ANSWER (A GRADE)**

  Table A argues that the defining conflict of the era was political: Democracy vs. Communism. By breaking the period in 1962, it suggests the Cuban Missile Crisis was the peak, after which the story is just a long decline toward the Wall falling. It treats the Cold War as the main character. Table B argues the defining conflict was economic: Stability vs. Scarcity. By breaking in 1973, it suggests the Oil Embargo was the true turning point, grouping the Moon Landing with the Missile Crisis as part of a previous era of industrial confidence.

  Table B is the better historical tool, though Table A is the more comfortable political narrative.

  Table A serves a specific audience: winners of the Cold War. It flatters the superpowers by suggesting their ideological struggle dictated the timeline. It implies that when the USSR blinked in 1962, the rest of the century was just cleanup. This is satisfying for a Western state curriculum because it centers state security. However, evidentially, it struggles to explain why the 1970s happened. If the main story ended in 1962, why did the global economy collapse in 1973? Why did Iran revolt in 1979? Table A forces these events into a bucket called "Unraveling," which describes *that* things changed, but not *why*.

  Table B offers stronger causality. The 1973 Oil Embargo didn't just change prices; it ended the post-war boom that allowed both the US and USSR to fund their proxies. It explains the shift from the confidence of the Moon Landing to the austerity of the 1980s. It also integrates the Global South more honestly. In Table A, Bandung (1955) is tucked into "Bipolar Standoff," implying non-aligned nations were just sidepieces in the US-USSR drama. In Table B, the path from Bandung to OPEC shows a continuity of resource sovereignty that culminates in 1973. This structure explains the Iranian Revolution better than Table A does, because it frames it as part of a resource crisis, not just an anti-Western one.

  However, "better" depends on the question being asked. If the question is "Who won the geopolitical struggle?", Table A is more direct. If the question is "Why does the modern world feel economically precarious?", Table B is superior. Because history should prioritize explanatory power over political comfort, Table B is the stronger periodization. It admits that the superpowers lost control of the timeline in the 70s. Table A hides that loss behind a chapter break.

  The choice of 1973 over 1962 is not just perspective; it is a claim about evidence. The evidence of inflation, debt, and regional instability post-1973 is heavier than the evidence of diplomatic thaw post-1962. Table A is not "false," but it is structurally misleading. It privileges a military definition of peace over an economic one. An honest textbook should acknowledge that while the missiles stayed siloed after 1962, the ground beneath the players shifted completely in 1973. Table B maps the shift; Table A maps the scoreboard.

  ***

  **MARKING SCHEME (20 MARKS)**

  **1. Identification of Structural Argument (5 Marks)**
  *   **5:** Clearly identifies Table A as Political/Ideological (break at 1962) and Table B as Economic/Systemic (break at 1973).
  *   **0-2:** Merely lists the different dates without explaining the thematic implication.
  *   *Typical Error:* "Table A stops earlier than Table B." (Descriptive, not analytical.)

  **2. Judgment on "Better" (5 Marks)**
  *   **5:** Makes a definitive claim that one is superior based on explanatory power/causality, not preference.
  *   **0-2:** Refuses to choose ("Both are valid") or chooses based on morality ("Table B is nicer").
  *   *Typical Error:* "Neither is better because history is subjective." (Rejects the prompt's requirement for judgment.)

  **3. Evidentiary Support (5 Marks)**
  *   **5:** Uses specific events (e.g., Oil Embargo, Bandung) to prove why one break explains subsequent events better than the other.
  *   **0-2:** Generalizes about "war" or "money" without tying it to the provided event list.
  *   *Typical Error:* "The Oil Crisis was important." (Without explaining *why* it justifies a chapter break over the Missile Crisis.)

  **4. Nuance on Audience vs. Evidence (5 Marks)**
  *   **5:** Distinguishes between what is politically comforting (Audience) and what is causally robust (Evidence). Acknowledges utility of both but prioritizes one.
  *   **0-2:** Conflates the two ("Table A is for Americans") or ignores audience entirely.
  *   *Typical Error:* "Table A is biased so it is wrong." (Bias does not automatically equal factual error; structure does.)

  ***

  **EXAMPLES OF C-GRADE (OR LOWER) ANSWERS**

  *   **The Relativist:** "Both tables are just perspectives. Table A is the Western view and Table B is the Global South view. You can't say one is better because history is written by the victors."
      *   *Why it fails:* It refuses to evaluate the utility of the structures. It treats "perspective" as a shield against critique, which contradicts the prompt's demand for a judgment on explanatory power.
  *   **The Dogmatist:** "Table A is accurate because the Cold War was the most important thing. Table B is wrong to put the Moon Landing in the same chapter as the Oil Embargo."
      *   *Why it fails:* It asserts accuracy without defining the metric. It assumes importance rather than arguing for it based on the events provided.
  *   **The Moralist:** "Table B is better because it includes more countries and feels less focused on weapons. Table A is too violent."
      *   *Why it fails:* It judges the history based on ethical preference rather than historical causality. A "nice" story isn't necessarily a "true" structure.
  *   **The Summarizer:** "Table A has two chapters and Table B has two chapters. Table A ends the first chapter in 1962. Table B ends it in 1973. They have the same events."
      *   *Why it fails:* It restates the prompt without analyzing the implication of the dates.
