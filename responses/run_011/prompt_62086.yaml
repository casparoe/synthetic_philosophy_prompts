          *   Result: Gresham's Law / Agio. Chips disappear from circulation (hoarded for export). Notes circulate. Prices in Notes might inflate faster than Chips.

      *   *The "Industry" Gap:* I must admit in the debrief that the game has fixed supply. Hume's insight is about *dynamic* supply. I will supply this via lecture in the debrief.

      *   *The Magistrate Tension:* Can the game show this?
          *   If they hoard chips to stop outflow -> Trade freezes -> Score drops.
