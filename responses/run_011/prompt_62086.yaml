answer: |-
  Here is a complete design for the seminar game, structured to produce the specific phenomenological realizations you want, followed by a frank assessment of its limits.

  # Game Title: The Oil and the Wheels

  ## 1. Roles and Materials
  **Participants (16):** "Traders."
  **Instructor (1):** "The Magistrate" (observes, injects money, enforces rules).
  **TA (1):** "The Foreign Desk" (stationed outside the door or at a distinct back table).

  **Materials:**
  *   **200 Poker Chips:** (Specie/Gold). Distinct color from any classroom chips.
  *   **200 Index Cards:** (Paper Credit). Marked with a large "£" on the back.
  *   **400 Dried Beans:** (Goods/Produce). In a central bowl.
  *   **16 Scorecards:** Pre-printed slips for final tally.
  *   **Whiteboard:** For public price listing (optional, but helps transparency).
  *   **Sticky Notes:** For private price setting (crucial for sticky prices).

  ## 2. Scoring Scheme (The Reveal)
  Do not tell them the scoring formula until the very end. If they know it, they will optimize for the metric rather than the market.

  **Tell them:** *"Your goal is to finish the seminar as prosperous as possible. Prosperity is a combination of what you consume and what you save."*

  **Actual Formula (Revealed in Debrief):**
  $$ \text{Final Score} = (\text{Beans Held} \times 2) + (\text{Chips Held} \times 1) + (\text{Export Vouchers} \times 5) $$
  *   **Beans:** Represent immediate standard of living (consumption).
  *   **Chips:** Represent liquid wealth (security).
  *   **Export Vouchers:** Only obtainable from the TA. Represent foreign purchasing power.

  *Why this works:* It forces a trade-off. Hoarding chips yields low points. Eating all beans yields low points. You must trade. Crucially, **Export Vouchers** are the only way to get high scores, but they require sending Chips *out* of the room to the TA. This creates the Balance of Trade tension.

  ## 3. Rules of Trade
  1.  **Voluntary Exchange:** Trade beans for chips (or notes) at any mutually agreed rate.
  2.  **Sticky Prices:** To prevent the "veil" failure, prices are **sticky**. Each trader writes their "Ask Price" (Beans per Chip) on a sticky note. You may only change your price **once per Round**.
  3.  **Production:** At the start of Rounds 2 and 3, traders may choose to "Work."
      *   *Cost:* 3 minutes of silence/no trading.
      *   *Reward:* 5 Extra Beans added to your hand.
      *   *Risk:* You cannot trade while working. If prices crash, you wasted time.
  4.  **The Foreign Desk (TA):**
      *   The TA sells **Export Vouchers**.
      *   Price: 1 Voucher costs 5 Chips.
      *   **Constraint:** The TA accepts **ONLY Poker Chips**. The TA rejects Index Cards.
      *   The TA does *not* sell beans back into the room. (Money flows out, goods do not flow in).

  ## 4. Minute-by-Minute Timeline (80 Minutes)

  ### Phase 1: Equilibrium (0:00 – 0:20)
  *   **0:00–0:05:** Distribute materials. Each student gets **20 Beans** and **5 Chips**. No paper notes yet. Explain rules (not scoring).
  *   **0:05–0:15:** **Round 1 Trading.** Students trade to balance their bean/chip ratios.
      *   *Expected Outcome:* A stable price emerges (e.g., 1 Chip = 2 Beans).
  *   **0:15–0:20:** **Production Choice.** Ask: "Who wants to work for more beans?" (Few will; liquidity is low, demand is stable).
      *   *Freeze:* Collect sticky notes. Record average price on board.

  ### Phase 2: The Shock (0:20 – 0:45)
  *   **0:20–0:25:** **The Injection.** Announce: "The Magistrate has found a treasure."
      *   Select **4 students** (situated at different tables). Give them **20 Extra Chips each**.
      *   The other 12 students get **nothing**.
      *   *Crucial:* Do not explain why. Do not say "inflation."
  *   **0:25–0:40:** **Round 2 Trading.**
      *   The 4 "Favored" students have excess chips and want beans. They bid up prices.
      *   The 12 "Unfavored" students see high prices. They have beans but few chips.
      *   *Sticky Price Mechanism:* Because they can only change prices once, the Unfavored will sell cheap initially, then realize they are underpriced. The Favored will spend fast before prices rise.
      *   *Production Choice:* Ask again: "Who wants to work?"
      *   *Humean Moment:* The Unfavored should now choose to Work. They see high chip prices for beans and want to capture that value. **This simulates the industry spur.**
  *   **0:40–0:45:** **Freeze.** Count holdings. Note that the Favored students have fewer chips now (spent), and Unfavored have more chips (earned). Prices have risen, but not instantly.

  ### Phase 3: The Paper & The Foreign Drain (0:45 – 1:05)
  *   **0:45–0:50:** **The Paper Injection.** Announce: "To make trade easier, we are issuing credit."
      *   Give every student **10 Index Cards**.
      *   Rule: Inside this room, 1 Card = 1 Chip.
      *   **Reminder:** The Foreign Desk (TA) **only** accepts Chips for Vouchers.
  *   **0:50–1:05:** **Round 3 Trading.**
      *   Students will quickly realize Cards are inferior assets because they cannot buy Vouchers.
      *   *Gresham's Law:* Chips will disappear from circulation (hoarded for the TA). Cards will circulate wildly.
      *   Prices in Cards may inflate faster than Chips.
      *   Students must decide: Do I spend my Chips on beans (internal) or send them to the TA (external score)?
      *   *The Drain:* As students buy Vouchers, Chips leave the room. If they hoard Chips to stop the drain, internal trade freezes (misery). If they spend Chips, they lose foreign power.

  ### Phase 4: Scoring and Debrief (1:05 – 1:20)
  *   **1:05–1:10:** Tally scores. Reveal the formula.
  *   **1:10–1:20:** Guided discussion mapping game to text.

  ## 5. The Debrief: Mapping Game to Text
  Do not lecture. Ask questions that force them to cite the experience, then supply the Hume quote.

  **Moment 1: The Injection (Neutrality vs. Real Effects)**
  *   *Ask:* "In Round 2, did everyone's wealth double when I gave those 4 people chips?"
  *   *Experience:* No. The 4 got richer first; the rest caught up later by selling beans.
  *   *Hume:* Read the opening of *Of Money*: "Money is nothing but the representative of labour and commodities... It is only the oil which renders the motion of the wheels more smooth and easy."
  *   *Point:* Money isn't wealth (beans); it's the facilitator. But *new* money changes who holds the wealth during the transition.

  **Moment 2: The Industry Spur**
  *   *Ask:* "Who chose to 'Work' in Round 2? Why?"
  *   *Experience:* "I saw prices were high, so I made more beans to sell."
  *   *Hume:* Read the passage: "The increase of money... first enlivens every man's industry... before it has raised the price of labour."
  *   *Point:* This is the gap the game couldn't fully automate. In the game, you worked because you *saw* high prices. Hume argues the *expectation* of profit quickens the hand of the artisan before prices even rise.

  **Moment 3: The Foreign Desk (Balance of Trade)**
  *   *Ask:* "What happened to the Chips when the TA opened?"
  *   *Experience:* "They left the room." "We hoarded them." "Trade slowed down."
  *   *Hume:* Read *Of the Balance of Trade*: "All water, wherever it communicates, remains always at a level... No man ever saw a river stop running because it was running into the sea."
  *   *Point:* You tried to stop the outflow (hoarding), and it hurt your internal trade. Hume says let it flow; industry will pull it back.

  **Moment 4: The Paper (The Bank)**
  *   *Ask:* "Why did the Chips disappear in Round 3?"
  *   *Experience:* "Because the TA wouldn't take Cards."
  *   *Hume:* Read the passage on banks: "The best bank imaginable would be one that locked up all the money it received and never returned any of it to circulation."
  *   *Point:* The Cards kept the wheels turning internally. The Chips were saved for the Foreign Desk. By separating the two, you kept domestic trade alive without losing foreign credit.

  ## 6. Failure Modes & Interventions

  **1. The "Veil" Shrug (Prices adjust instantly)**
  *   *Risk:* Students shout out prices and adjust every 10 seconds.
  *   *Prevention:* Enforce the **Sticky Note Rule**. If a student changes their price twice in a round, confiscate 2 Beans. This forces the "lag" Hume describes.
  *   *Intervention:* If prices double in Minute 1 of Round 2, pause the game. "Freeze. Look at your hands. Do you have more beans than you started with? No. Then why did you pay double?"

  **2. Cornering/Gouging**
  *   *Risk:* One student buys all the chips and refuses to trade.
  *   *Decision:* **Let it run for 3 minutes.**
  *   *Why:* It demonstrates the cost of hoarding. The cornerer has chips but no beans (starving). The others have beans but no chips (illiquid). Total score drops.
  *   *Intervention:* If trade volume drops to near zero, step in as Magistrate. "The market has frozen. I am imposing a 10% wealth tax on chip holdings to force liquidity." (This mirrors Hume's view that money must circulate).

  **3. The Paper Confusion**
  *   *Risk:* Students treat Cards and Chips as identical and dump all Chips at the TA immediately.
  *   *Prevention:* Remind them mid-round: "You need Chips for the TA, but you need *something* to trade with each other."
  *   *Outcome:* If they dump all chips, internal trade collapses. This is a valuable failure. It proves Hume's point: you need *some* specie in circulation, or the oil runs dry.

  ## 7. Honest Limitations (What the Game Cannot Do)

  **1. The "Industry Spur" Gap**
  *   *The Problem:* In the game, production was a binary choice (Work/Don't Work) triggered by *observed* price hikes. Hume's claim is subtler: he argues that the *influx* of money creates a psychological optimism that increases effort *before* prices rise.
  *   *The Fix:* In the debrief, you must supply this by hand. Say: "In the game, you worked because you saw the price was already high. Hume argues that in a real economy, the merchant sees the money arriving and works harder *in anticipation* of the price rise. That gap—between money arriving and prices rising—is where the nation gets richer. The game shows the price effect; you must imagine the psychological spur."

  **2. The Magistrate Tension**
  *   *The Problem:* Hume holds two uncomfortable views: (A) Money flows naturally, so don't fear loss (laissez-faire), and (B) The Magistrate ought to increase the money supply if possible (interventionist).
  *   *Can the game stage this?* **Partially.**
      *   The game shows (A) clearly: Hoarding chips to stop outflow killed trade.
      *   The game shows (B) weakly: You (Magistrate) injected money in Round 2, and it stimulated work.
      *   *The Tension:* The tension lies in *how* to increase money. Hume prefers trade surplus (natural) over debasement (artificial).
      *   *Verdict:* You cannot fully stage this tension with 16 people and beans. The game resolves too cleanly.
      *   *The Fix:* End the debrief with this specific question: "I injected money arbitrarily in Round 2. Hume says the Magistrate should increase money. But he also says money finds its own level. If I hadn't injected chips, would the market have fixed itself? Or was my intervention necessary?" Let them sit with the contradiction.

  **3. The "Foreign Desk" Simplification**
  *   *The Problem:* The TA only took chips; they didn't sell goods back. This creates a permanent drain. In reality, foreign nations buy British goods.
  *   *The Fix:* Acknowledge this. "The TA was a sink, not a partner. In reality, if we send chips abroad, they buy foreign wine. But Hume's point is that the chips *themselves* will return if we have industry. The game isolates the outflow to show you that fearing the outflow is more dangerous than the outflow itself."

  ## 8. Final Advice on the "Veil" Failure
  Last year's failure happened because the injection was symmetric (everyone doubled). Symmetry creates neutrality. **Asymmetry creates friction.**
  *   Ensure the 4 "Favored" students in Round 2 are seated far apart.
  *   Ensure they are instructed verbally: "You must spend at least half of this new endowment by the end of the round." (This forces the velocity).
  *   If you see prices doubling instantly, **stop the clock.** Walk to the whiteboard. Draw the timeline. "Hume says there is an interval. We are skipping the interval. Reset your sticky notes to Round 1 prices. Go." Force them to live in the lag.

  This design forces them to feel the friction of money before they name it. They will leave the room understanding why Hume thought money was oil, not wheels, and why a bank that locks up gold might actually save the trade.
