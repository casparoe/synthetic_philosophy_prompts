      *   **Goods:** Dried beans (representing "produce/labour").
      *   **Money:** Poker chips (Specie) + Index Cards (Paper Credit).
      *   **Scoring:** This is crucial. If they score on chips held, they hoard. If they score on beans consumed, they trade. Hume cares about *industry* and *standard of living*. Let's score on **Beans Consumed + Chips Remaining**. This forces a trade-off: spend chips to get beans (utility) or keep chips (security/wealth).
      *   **The "Foreign Desk" (TA):** This is the key to the Balance of Trade lesson. The TA buys beans for chips only. TA sells nothing (or sells luxury goods for chips only). This creates an outflow.
