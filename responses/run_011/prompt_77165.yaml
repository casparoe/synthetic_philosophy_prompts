answer: |-
  The established term is **Performativity** in machine learning and **Reflexivity** in social science, though the specific mechanism you describe is best labeled **The Communicative Shift**.

  **Performativity** (specifically *Predictive Performativity*) captures the systemic effect: the deployment of an inference model changes the data distribution it predicts because agents adapt to the model's presence. **Reflexivity** is the social science cognate, describing how knowledge of a measurement process alters the subject being measured. However, these terms describe the *outcome* (changed distribution/reality); your description focuses on the *mechanism* (behavior changing from evidence to message), which is why **The Communicative Shift** is a precise coinage for the behavioral mode switch itself.

  **Differentiation from close candidates:**
  *   **Goodhart's Law:** Goodhart requires an agent optimizing *against* a specific metric (e.g., "maximize this score"). Your examples include cooperative teaching (Example 1), where the human isn't optimizing a score but clarifying intent. Goodhart is adversarial optimization; Performativity/Reflexivity includes cooperative adaptation and structural changes in meaning.
  *   **Hawthorne Effect:** This describes a change in *effort* or *conformity* due to attention (e.g., working harder when watched). Your phenomenon is about a change in *semantics* (the action means something different). The human isn't trying harder; they are trying to be *understood*, altering the informational content of the action rather than just its magnitude.
  *   **Signaling (Game Theory):** This is the underlying mathematical structure. Before the observer's intent is known, the interaction is a **Decision Problem** (agent acts on world). Afterward, it becomes a **Signaling Game** (agent acts on observer's belief). Your phenomenon is the *transition* between these two states.

  **Edges and Boundaries:**
  *   **Awareness:** The effect requires the subject to model the observer. If the person is unaware they are being watched for inference, it is not Performativity/Reflexivity, but simply **Bias** or **Noise**. The "shift" only happens when the subject updates their policy to account for the observer's inference algorithm.
  *   **Human Watcher:** The phenomenon applies equally if the watcher is human. Any time an agent knows their actions are being used to infer hidden state (e.g., a job interview, a first date), the channel shifts from measurement to communication. The "machine" aspect is not required, only the presence of an inference engine (biological or silicon).
  *   **Cooperative vs. Adversarial:** Performativity literature often assumes adversarial behavior (gaming the system), but your Example 1 (pedagogical demonstration) is cooperative. Both fall under Performativity because the data distribution $D$ becomes a function of the model parameters $\theta$ ($D(\theta)$), regardless of whether the agent wants to minimize or maximize the loss.

  **The Coinage: The Communicative Shift**
  Use this when you need to distinguish the *change in channel nature* from the *change in outcome distribution*.
  *   **Applies:** When the subject knows the observer is inferring intent/state.
  *   **Does Not Apply:** When the subject changes behavior due to social pressure without regard for the observer's inference process (Hawthorne), or when optimizing a specific numeric target (Goodhart).
  *   **Watcher Type:** Agnostic (human or model).
  *   **Awareness:** Requires subject awareness of the inference intent.
