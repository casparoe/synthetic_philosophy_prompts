          *   *Sharpening:* Like Malthus, it identified a physical constraint (arithmetic vs geometric / finite earth) but underestimated the substitution/innovation response (countervailing process). Verdict: Likely "Right but Bounded" (applies only without price signals/tech change) rather than Early.

      *   **Conclusion:**
