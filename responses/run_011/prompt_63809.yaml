      *   **Core Question:** The user is puzzled by an apparent contradiction in German privacy law/culture: strict data protection (no universal ID, right to informational self-determination) vs. open access to address registers (*Melderegisterauskunft*). They propose three theories of privacy (Control, Dignity/Personhood, Legibility) and want to know which one explains the German system.
