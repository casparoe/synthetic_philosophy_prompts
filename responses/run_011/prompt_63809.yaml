      *   *Dignity/Personhood:* This fits best. The 1983 Census Ruling (*Volkszählungsurteil*) established "Informational Self-Determination" (*informationelle Selbstbestimmung*). This isn't just "I own my data." It's "I must not be profiled to the point where my personality is chilled or determined by the state." However, basic contact info is necessary for social functioning (legal certainty, service of process, finding neighbors). The distinction is between *contextual integrity* and *aggregation*.
