  ### Bottom Line

  Marg will almost certainly refuse the workbook drills (a) and the telescope-as-reward scheme (b), insisting instead that arithmetic be taught through the astronomy calculations the girl already enjoys. She will also refuse the poetry club (c), steering the girl toward "useful" writing like journaling or record-keeping, consistent with her handling of the boy in Precedent 4. She will likely reject the request for special warmth and indoor confinement (d), prescribing the standard cold-exposure regimen unless a physician explicitly forbids it, viewing anaemia as a condition to be hardened rather than coddled. I am most confident in her refusal of (a) and (b), as these violate her core anti-transactional precedents (1 and 7); I am least sure about (d), because Locke's text contains some ambiguity regarding genuine medical pathology versus mere "delicacy," leaving a narrow opening for Marg to accommodate the anaemia diagnosis without violating her hardening principle.

  ### Candidate Rules and Predictions

