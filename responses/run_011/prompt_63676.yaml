  | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Stoic Instrumentalism** (Marg's Claim) | "Harden the body against comfort, habituate the mind to utility, and use inclination only as a hook for necessary skills." | Fits 1, 2, 3, 4, 6, 7, 8. Strains 5 (shame vs habit) but consistent if shame is a habit of virtue. | **No.** Workbooks are tasks, not utility. Math must come via astronomy (Precedent 2). | **No.** Rewards corrupt the motive (Precedent 1 & 7). Telescope is a tool, not a prize. | **No.** Verse is not useful; it is a distraction from business (Precedent 4). | **No.** Comfort weakens the constitution (Precedent 3). Anaemia is a weakness to be cured by hardening. | **High.** Locke explicitly prioritizes hardening and utility over pleasure; verse is disparaged; bribes are forbidden. | **Severe Allergy:** A child has a life-threatening nut allergy. **Rule:** Expose them to small doses to build tolerance (Harden). |
  | **Textual Occasionalism** (Deflationary) | "There is no meta-rule; I simply do what the book says for each specific topic as it arises." | Fits all 8 perfectly, as each precedent maps to a specific passage or chapter theme without needing a unifying theory. | **No.** Locke says make learning a play, not a task. | **No.** Locke says never bribe with sweets or pleasures. | **No.** Locke says poetry is a waste of time for most gentlemen. | **Yes/No.** Locke says harden, *but* also says consult physicians for medicine. Depends on if anaemia counts as "medicine." | **Very High.** Every decision is a direct citation or close paraphrase of a specific section of *Some Thoughts*. | **Severe Allergy:** A child has a life-threatening nut allergy. **Rule:** Consult a physician (Locke defers medical treatment to doctors). |
  | **Inclination as Vehicle** (User's Claim) | "Never make learning a task or turn a loved thing into currency for a hated thing; protect the child's love of learning." | Fits 1, 2, 6, 7, 8. **Contradicts 4** unless framed as "Verse was the *only* thing he did," making it a task of its own. | **No.** Workbooks turn math into a task/hate object (Precedent 1). | **No.** Telescope as reward makes astronomy a currency (Precedent 1). | **Yes.** She loves it; banning it turns learning into a task. (Requires ignoring Precedent 4's specific outcome). | **Yes.** Forcing cold on a sickly child makes the body a task/hate object. | **Medium.** Locke supports "learning as play," but explicitly subordinates inclination to virtue and health. | **New Technology:** A child loves video games. **Rule:** Allow it if it teaches strategy/skills (Inclination). |

  ### Analysis of Contested Ground

  **1. The Poetry Question (Precedent 4 vs. Request c)**
  This is the strongest point of contention between your interpretation and Marg's. Locke's text is notoriously hostile to poetry for the general student, calling it a "gift" that rarely pays off and often leads to idleness. However, scholarship on Locke is not unanimous on whether this is an absolute ban or a strong discouragement for those without "genius." Marg treats it as a hard prohibition (Precedent 4).
  *   **Underdetermination:** If Marg follows **Stoic Instrumentalism**, she must ban the poetry club because it lacks utility. If she follows **Inclination as Vehicle**, she should allow it. The fact she banned it for the boy suggests she prioritizes Utility over Inclination when they conflict. The principle she adopts by banning it is: *Inclination is only valid when it serves a useful end.*

  **2. The Hardening Question (Precedent 3 vs. Request d)**
  Locke advocates cold water, wet feet, and thin clothing to "harden" the constitution. However, he also distinguishes between "delicacy" (bad habit) and "constitution" (natural state), and he defers to physicians on matters of medicine and disease.
  *   **Underdetermination:** Precedent 3 involved "sniffles" (transient), whereas the new girl has "anaemia" (diagnosed pathology). If Marg decides **No** on cold days, she is adopting the principle: *Diagnosed pathology does not exempt one from hardening; it requires it more.* If she decides **Yes**, she is adopting: *Hardening applies only to habitual delicacy, not medical disease.* This is where the **Textual Occasionalism** rule might diverge from **Stoic Instrumentalism**, as Locke's text on medicine is less dogmatic than his text on regimen.

  **3. The Splitting Case**
  The single further case that best separates the top two candidate rules (**Stoic Instrumentalism** vs. **Textual Occasionalism**) is a **modern medical condition Locke could not have known**, such as a severe autoimmune disorder or anaphylactic allergy.
  *   **Stoic Instrumentalism predicts:** Marg will attempt to "harden" the child against the condition (e.g., controlled exposure), because the *principle* is hardening.
  *   **Textual Occasionalism predicts:** Marg will defer to a physician and exempt the child, because the *text* instructs her to consult doctors on medical matters, and this specific condition falls under "medicine" rather than "regimen."

  ### Note on Locke Scholarship Uncertainty
  I am flagging that Locke's specific stance on poetry is interpreted differently by different scholars; some view it as a pragmatic warning about career prospects, others as a moral objection to "fancy." Similarly, while Locke is emphatic about hardening, his concessions to "constitution" are vague enough that reasonable Lockians can disagree on where "hardening" ends and "negligence" begins. I have avoided citing specific section numbers as the text's organization varies by edition and my recall of specific numerals is not precise enough for your requirement.
