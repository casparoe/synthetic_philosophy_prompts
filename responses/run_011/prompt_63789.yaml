answer: |-
  To maintain consistency with the six previous verdicts, the Judge is navigating a specific tension in the ethics of war: the distinction between **liability to attack** (can they be killed?) and **moral culpability** (should they be punished?).

  Here is the breakdown of the doctrines, the ruling, and the final lines.

  ### 1. The Doctrines
  Two primary ethical frameworks accommodate verdicts 1 through 6 equally well, though they arrive there by different routes.

  *   **Doctrine A: The Principle of Moral Responsibility.**
      *   *Core Tenet:* An individual loses their right not to be killed only if they are morally responsible for an *unjust* threat.
      *   *Application to 1–6:* This explains why the Conscript (Case 1) was liable to be killed in battle ("no complaint had he been killed") but not blameworthy afterward (he lacked knowledge/choice). It explains why the Officer (Case 2) was both liable and blameworthy (he had both). It justifies the Drone Operator (Case 6) because he defends against an unjust threat.
  *   **Doctrine B: The Principle of Functional Combatancy.**
      *   *Core Tenet:* An individual loses their right not to be killed if they perform a function essential to the infliction of harm, provided the attacker is fighting a defensive war. Uniforms and proximity are irrelevant; causal contribution is key.
      *   *Application to 1–6:* This explains the Farmer (Case 3) and the Drone Operator (Case 6) as functional threats. It explains the Surgeon (Case 4) becoming a target the moment he used lethal force. It treats the Conscript (Case 1) as a weapon that was destroyed, rather than a moral agent.

  ### 2. Application to the Reserved Case (The Captain)
  Both doctrines agree on the outcome, but they describe the Captain and the Partisan differently.

  *   **Under Doctrine A (Responsibility):** The Captain is **liable** because he knows the war is unjust and chooses to sustain it for personal gain (pension). He is morally analogous to the Officer in Case 2. The Partisan is **justified** because he is removing a responsible agent of unjust harm.
  *   **Under Doctrine B (Function):** The Captain is **liable** because scheduling rail movements is functionally identical to driving the fuel tanker in Case 6. Distance from the front (400km) is irrelevant. The Partisan is **justified** because he is a defender neutralizing a component of the aggressor's war machine, analogous to the Farmer in Case 3.

  ### 3. Which Doctrine the Judge is Actually Running
  The Judge is operating under **Doctrine A: The Principle of Moral Responsibility.**

  *   **Why:** If he were running Doctrine B (Function), the Conscript in Case 1 would likely have been condemned as a tool of aggression, or at least treated with the same moral neutrality as the fuel tanker in Case 6. Instead, the Judge took pains to exonerate the Conscript's *character* while admitting his *liability*. Furthermore, in Case 2, the Judge focused heavily on the Officer's *knowledge* ("knew from the first week") and *motivation* ("stayed for the promotion"). The Judge cares about the mind behind the act. He judges the war through the conscience of the participants. The Captain knows the truth and stays for the pension; he is morally guilty, not just functionally useful.

  ### 4. The Separating Case (Case 8)
  To separate these doctrines in a future chapter, you would introduce a **Coerced Logistics Worker**.

  *   **The Case:** A civilian railway worker in the aggressor's capital is ordered to schedule the bomb trains. He is told that if he refuses, his children will be sent to the front lines as human shields. He complies. A partisan shoots him.
  *   **Doctrine A (Responsibility) Verdict:** The worker is **not liable**. He lacks moral responsibility due to duress (similar to the Deserter in Case 5). The partisan committed murder.
  *   **Doctrine B (Function) Verdict:** The worker is **liable**. He is still a necessary causal link in the chain of harm (like the Fuel Tanker in Case 6). The partisan acted permissibly.
  *   *This forces the Judge to decide whether the "chain of harm" outweighs the "coercion of the link," exposing his true priority.*

  ### 5. The Judge's Verdict
  The Judge must speak plainly enough for the gallery, but with the precision of a legal summation. He needs to confirm that the Captain was a weapon, not a bystander, and that the Partisan was a surgeon, not a butcher.

  > "This captain was not a victim of the war; he was a vendor of it. The partisan did not murder a man in his home; he disabled a munition in transit."
