answer: |-
  This is a sharp set of data points. You are right to reject your initial "normalization/availability" hypothesis. That hypothesis is consequentialist (focused on downstream effects), but your intuitions—particularly on Case 11 (the conditional) and Case 6 (the consensual joke)—are deontological or constitutive. You aren't judging based on *what happens next*; you are judging based on *what is being done with the concept right now*.

  Case 11 is the keystone. Standard expressivism (Anderson & Lepore, Blackburn) struggles here because it claims no proposition is expressed in the antecedent, so no offense should be taken. Your intuition that 11 is the *worst* case suggests that the offense lies not in the assertion of an attitude, but in the **validation of the slur's taxonomy as a logical operator.**

  Here is a principle stack designed to capture your verdicts, prioritizing the "cold" violence of logical validation over the "hot" violence of attitude expression.

  ### The Principle Stack: Taxonomic Validation & Attribution

  I propose this is not a single principle but a prioritized stack of three constraints. When they conflict, the higher constraint wins.

  **Tier 1: The Taxonomic Constraint (Highest Priority)**
  *Do not employ the slur as a truth-apt predicate or logical operator within the speaker's own inferential framework.*
  *   **Work:** This prohibits using the word to do logical work (conditionals, quantifiers, negation) in the speaker's voice. It treats the slur not just as an insult, but as a *category error* that cannot be granted logical validity, even hypothetically.
  *   **Motivated by:** Case 11 (Conditional). This explains why 11 is worse than a direct insult (Case 2/6). A direct insult is an emotional outburst; a conditional is a bureaucratic acceptance of the category. It says, "The set of [SLURs] is a coherent set for the sake of this argument."

  **Tier 2: The Attribution Constraint**
  *If the phonological form must be produced, the derogatory perspective must be clearly quarantined to a distinct agent (historical, fictional, or reported) and not bleed into the narrator/speaker's voice.*
  *   **Work:** This distinguishes *mention/display* from *use*. It requires clear boundaries (quotes, stage lights, explicit reporting verbs) that prevent the audience from attributing the concept to the speaker.
  *   **Motivated by:** Case 1 vs. 2 (Quotes vs. Paraphrase), Case 3 vs. 4 (Dialogue vs. FID).

  **Tier 3: The Social License Constraint (Lowest Priority)**
  *The speaker must possess the social standing (typically in-group membership) to manipulate the concept without reinforcing the hierarchy.*
  *   **Work:** This allows for reclamation and meta-linguistic discussion within the target group, but prohibits out-group usage even with permission. It is overridden by Tiers 1 and 2 (i.e., you can't use it in a conditional even if you are in-group).
  *   **Motivated by:** Case 7 vs. 10 (In-group vs. Out-group seminar), Case 6 (Out-group joke).

  ---

  ### Mapping Your Verdicts

  Here is how the stack processes your 12 cases. I will note where the principle forces a verdict that might conflict with your initial list.

  1.  **Historian Quote:** **OK.** Tier 2 satisfied (Quarantined to historical agent). Tier 1 satisfied (Not used as speaker's predicate).
  2.  **Historian Paraphrase:** **Violates Tier 2.** The word is unquoted, blurring the line between the historian's voice and the bigot's voice. *Verdict: Worse than 1.* (Matches your intuition).
  3.  **Novel Dialogue:** **OK.** Tier 2 satisfied (Quarantined to character).
  4.  **Free Indirect Discourse:** **Violates Tier 2.** FID blends narrator and character consciousness. The taxonomy bleeds into the narrative voice. *Verdict: Wrong.* (Matches your intuition).
  5.  **Actor on Stage:** **OK.** Tier 2 satisfied (Theatrical frame quarantines the agent).
  6.  **Actor at Party:** **Violates Tier 3.** Out-group (assumed) using it without Tier 2 quarantine. It treats the word as a toy. *Verdict: Not Fine.* (Matches your intuition).
  7.  **In-group Affectionate:** **OK.** Tier 3 satisfied (License). Tier 1 satisfied (Not used as logical predicate, but as vocative/name).
  8.  **In-group + Bigot Overhears:** **OK.** Tier 3 satisfied. The speaker's license is intrinsic, not dependent on uptake. *Verdict: Fine.* (Matches your intuition. Note: This explicitly rejects your initial "normalization" hypothesis in favor of an agency-based view).
  9.  **In-group Seminar:** **OK.** Tier 3 satisfied. Tier 1 satisfied (Meta-linguistic mention, not logical use).
  10. **Out-group Seminar:** **Violates Tier 3.** Even with permission, the out-group speaker lacks the license to handle the toxicity. *Verdict: Not Fine/Shouldn't.* (Matches your intuition).
  11. **Conditional Antecedent:** **Violates Tier 1 (Severe).** The speaker's logical framework accepts the slur as a valid sortal. This is "cold" dehumanization. *Verdict: Worst.* (Matches your intuition).
  12. **Prying Away Meaning:** **Unstable.** This attempts to break the link between phonology and taxonomy. The stack predicts this will fail because the history of the word (Tier 1/3 baggage) overrides the speaker's stipulation. *Verdict: Likely Not Fine.*

  ### Required Overturns

  You stated you would rather lose 2 and 12 than 11. The stack preserves 11 as the worst violation (Tier 1).

  However, to make the stack coherent, you must accept the following:
  1.  **Case 2 (Paraphrase) is genuinely offensive, not just "noticeably worse."** The principle treats unquoted reporting as a failure of attribution comparable to FID. You might feel 2 is *professional negligence*, while 11 is *moral failure*. The stack groups them as structural failures, differing only in degree.
  2.  **Case 12 is impermissible.** You said you flip-flop. The principle says: **No.** You cannot stipulate away the taxonomy. The word carries the history (Tier 1) regardless of intent. If you want to pry the meaning away, you must use Tier 2 (mention/quote) or Tier 3 (in-group only). An out-group speaker trying to redefine a slur in real-time violates Tier 3 and likely Tier 1.

  ### The New Cases

  **Case A: Museum Wall Label**
  *Scenario:* Exhibit about the word's history/power. Label reproduces the word.
  *Analysis:*
  *   Tier 1: Is it used as a predicate? No, it's the object of study.
  *   Tier 2: Is it quarantined? Yes, within the "museum voice" which is educational/historical.
  *   Tier 3: Does the museum have license? This is the friction point.
  *   *Verdict:* **Permissible.** This functions like Case 1 (Historian) and Case 9 (Seminar). The "aboutness" (meta-linguistic focus) suspends Tier 1. The institutional authority provides a proxy for Tier 2 quarantine.
  *   *Caveat:* If the label says "The [SLUR] Exhibit" rather than "Exhibit on the word '[SLUR]'", it violates Tier 2 (attribution fails; the museum is naming the exhibit with the slur).

  **Case B: Translation of Older Novel**
  *Scenario:* Translator must pick a word; all options misrepresent force.
  *Analysis:*
  *   This is a **Tier 1 vs. Tier 2 Conflict.**
  *   To be faithful to the original (Case 3 equivalent), the translator must reproduce the text.
  *   But the translator is speaking in their own voice (the published text).
  *   *Resolution:* **Tier 2 Priority.** The translator should use the slur *only if* there is an introduction, footnote, or publisher's note that quarantines the usage (restoring Tier 2). Without the paratextual quarantine, the translator violates Tier 2.
  *   *Verdict:* Permissible *with* context. Unpermissible *without* context. This explains why "cleaned up" translations are often criticized (they erase the historical reality, violating Tier 1 of the *original* work) but raw translations without warning are also criticized (violating Tier 2 of the *current* context).

  ### One Principle or a Stack?

  It is a **Stack with Priority Ordering.**
  *   **Ordering:** Taxonomic (1) > Attribution (2) > Social License (3).
  *   **Why:** You can have Social License (Tier 3) but still violate Taxonomic (Tier 1). (e.g., An in-group member saying "If my brother is a [SLUR], then he deserves it" is still horrific). You can have Attribution (Tier 2) but lack License (Tier 3) (e.g., A white actor saying it on stage is OK [Tier 2], but a white philosopher saying it in seminar is not [Tier 3 fails]).
  *   **Conflict Resolution:** Tier 1 is lexical/semantic (about the word's logic). Tier 2 is pragmatic (about the context). Tier 3 is ethical/social (about the speaker). Semantic constraints on hate-speech taxonomy trump pragmatic framing.

  ### Uncertainty and Falsification

  **Where I am least sure:**
  I am least sure about **Case 12 (Prying Away)**. My stack says "No," but language evolves. If a community *successfully* reclaims a word, they are effectively doing Case 12 over a long period. The principle might need a **Temporal Clause**: *Stipulative redefinition by an individual is prohibited (Tier 3); Stipulative redefinition by a community over time is the mechanism of Tier 3 License acquisition.*
  *   *Weak Point:* Distinguishing between an individual "trying" to reclaim and a community "having" reclaimed is notoriously difficult in real-time.

  **On Case 4 (FID) vs. Case 11 (Conditional):**
  You asked if 4 and 11 are the same phenomenon.
  *   **My Argument:** Yes, they are cognates. Both involve the **narrative/logical voice absorbing the slur's taxonomy.**
      *   In FID (4), the narrator's consciousness merges with the bigot's.
      *   In Conditionals (11), the speaker's logic merges with the bigot's category.
      *   *Evidence:* If you accept this, you should find a version of 11 acceptable *if* it is clearly attributed. E.g., "The bigot argued that if that slur turns up..."
      *   *Test:* If you find "The bigot argued that if that slur turns up..." still offensive (even with attribution), then Tier 1 is absolute and cannot be saved by Tier 2. If you find it acceptable, then 4 and 11 are indeed the same (Attribution failures).
      *   *My Suspicion:* You will find the attributed conditional acceptable. This suggests your hatred of 11 is actually a hatred of **unattributed logical validation**.

  **What would break this theory?**
  1.  **If Case 11 becomes acceptable in high-stakes legal/ethical reasoning.** If we agree that "If X is a [SLUR], then X is being targeted by hate speech" is a necessary sentence to prosecute hate crimes, then Tier 1 must fall. (Counter: We can use "If X is targeted by racial slurs..." avoiding the word itself).
  2.  **If Case 6 (Party Joke) is deemed OK by the target community.** If the co-star in Case 6 is Black and says "I love that joke, say it again," and your intuition *still* says "No" for the white actor, then Tier 3 (Social License) is absolute. If your intuition shifts to "OK," then Tier 3 is contingent on uptake, and your initial "normalization" hypothesis might have been partially right.

  ### Summary for your Dissertation Context
  Since you work on indexicals, you might frame this as a **Context-Shifting Failure.**
  *   Slurs attempt to shift the context to one where the target's humanity is parameterized as lower.
  *   **Tier 1** says: You cannot build logical structures on that shifted context.
