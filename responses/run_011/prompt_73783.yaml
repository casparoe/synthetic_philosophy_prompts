answer: |-
  ### Open Thinking: Framing Options

  Before settling on a recommendation, I considered four distinct narrative framings for the gallery.

  **1. The Radical Fallibilist Frame (Treatment A).** This treats scientific history as a graveyard of confident errors. It emphasizes discontinuity. Its strength is intellectual honesty; its weakness is that it offers the visitor no ground to stand on. If everything changes, why trust the thermometer today?

  **2. The Continuity Frame (Treatment B).** This treats history as a staircase of approximation. It emphasizes retention. Its strength is public confidence; its weakness is Whiggishness. It risks implying past scientists were merely "less complete" versions of us, rather than operating under different fundamental assumptions.

  **3. The Pragmatic Toolbox Frame.** This ignores truth claims entirely. It argues science is about building tools that work, not describing reality. While philosophically defensible, it is too abstract for a general audience. A fifteen-year-old wants to know if the science is *true*, not just if it is *useful*.

  **4. The Functional Decomposition Frame (Your View).** This treats theories as bundles of components: some are load-bearing (mathematical structures, instrumental relations) and some are scaffolding (ontological pictures, mechanical models). It argues that scaffolding collapses while load-bearing structures are often reused.

  **Selection:** Framing 4 survives scrutiny best. It avoids the nihilism of Frame 1 and the sanitization of Frame 2. It is concrete enough for Frame 3's abstraction. It allows us to honor the deed of gift (reliability) without lying to the history curator (change is real). It transforms the gallery from a verdict on "truth" to a demonstration of "engineering stability amidst conceptual change."

  ***

  ### DECISION MEMO

  **TO:** Exhibitions Committee
  **FROM:** Chair, Exhibitions Committee
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation for Permanent Gallery Narrative Treatment

  **Bottom Line Recommendation**
  I recommend we authorize the curatorial team to proceed with a **Hybrid Treatment**, using **Treatment B (Retention)** as the structural spine but rigorously applying the **Functional Decomposition** logic outlined in the briefing. We must reject Pure Treatment A. This decision must be ratified by [Date, 8 weeks from now] to meet the design contract signing deadline.

  **Rationale for Hybrid Structure**
  Treatment A (The Wall of the Dead) is philosophically coherent but institutionally untenable. It satisfies the historian's demand for honesty but violates our deed of gift's mandate to strengthen public confidence. If we tell visitors that successful science is merely a queue of failures, we invite the conclusion that current consensus is equally transient.

  Treatment B (The Retention Wall) satisfies the deed of gift but risks the historian's charge of self-flattery. It implies a smooth progress that history does not support.

  The Hybrid approach adopts Treatment B's chronology and focus on retention but changes the *reason* for retention. We do not claim past theories were "approximately true" in a global sense. Instead, we demonstrate that specific *components* of those theories were load-bearing and survived, while others were scaffolding and collapsed. This allows us to say "this math still works" without having to say "this picture of the world was correct." It secures reliability without denying revolution.

  **The Strongest Case for the Rejected Option (Treatment A)**
  We must acknowledge the strongest argument for Treatment A, advocated by the history curator: **Epistemic Humility.** Treatment A forces the visitor to confront the possibility that our current best theories are fundamentally mistaken in ways we cannot yet see. It prevents the museum from appearing as a priesthood of current consensus. By rejecting Pure Treatment A, the museum gives up the opportunity to fully validate the skeptic's intuition that "science changes its mind." We lose the dramatic punch of total discontinuity. We sacrifice the clear moral that *ontological* commitment is always risky. If we are wrong, it is because we prioritize public trust over philosophical radicalism.

  **Operational Test for Curatorial Copy**
  To ensure this Hybrid approach is executed consistently across all labels, not just the centerpiece, curators must apply the **Component Retention Test** to every draft panel.

  *The Test:* For any superseded theory presented, the text must explicitly distinguish between the **calculational capacity** retained (e.g., the equations, the instrument design) and the **physical story** discarded (e.g., the fluid, the medium, the mechanism).

  *Failure Condition:* A label fails if it implies the scientists were "wrong" without specifying what they got right that we still use. Conversely, it fails if it implies they were "right" without specifying what conceptual structure was abandoned.

  *Example:* A label on caloric theory must not simply say "heat is not a fluid." It must say "heat is not a fluid, but the math describing its flow remains valid for engineering."

  **Addressing Trustee Concerns**
  **1. The Foundation Representative (Risk of Anti-Science Rhetoric)**
  Your concern is that admitting error hands ammunition to those denying climate or health science. This is valid. However, Treatment A is the actual risk here; it suggests science is *only* error. The Hybrid model mitigates your risk by shifting the narrative from "theories change" to "methods stabilize." We show that while the *story* about the ether changed, the *interferometer* remained a valid tool for measuring stability. We demonstrate that science corrects itself not by discarding data, but by refining the framework. This strengthens confidence in the *process* of correction, which is more robust than confidence in any single conclusion. We do not reassure you that we are right; we show you how we know when we are wrong.

  **2. The History Curator (Institutional Self-Flattery)**
  Your concern is that Treatment B whitewashes the ruptures in scientific history to make the institution look wise. This is also valid. The Hybrid model addresses this by forcing specific admissions of ontological failure. We will not say "the ether was almost right." We will say "the ether was a necessary scaffolding for 19th-century calculation that became an obstacle to 20th-century physics." This costs the museum something: it requires us to admit that our current "load-bearing" assumptions may also become scaffolding later. It preserves the historian's integrity by acknowledging that success is often local and temporary, even if the tools persist.

  **Directive for the Interferometer Label**
  The central object label (120 words) is the critical test case. It must not answer "Did the ether exist?" It must answer "What did the ether do?"
  *Drafting Instruction:* The label must state that the ether hypothesis provided a reference frame for calculation (scaffolding) that allowed the instrument to be built. The null result did not break the instrument; it broke the reference frame. The visitor must leave understanding that the *measurement* survived the *theory*.
  *Key Phrase:* "The tool outlasted the explanation."

  **Timeline and Next Steps**
  We have nine weeks until the design contract is signed.
  *   **Week 1:** Committee votes on this Hybrid directive.
  *   **Weeks 2-5:** Curatorial team rewrites all label drafts applying the Component Retention Test.
  *   **Week 6:** Review of revised scripts against Trustee concerns.
  *   **Week 8:** Final approval for design tender.

  Deferral is not an option. Delaying the narrative decision now will compress the design phase, forcing contractors to build generic casework that cannot support specific interpretive needs. That would result in a gallery that is physically ready but intellectually hollow. We must decide the story before we build the walls.

  **Conclusion**
  This Hybrid path is harder to write than either pure treatment. It requires nuance in a space designed for quick reading. But it is the only path that honors our deed of gift, respects the historical record, and answers the legitimate fears of our trustees without lying to the public. We build Treatment B's structure, but we tell Treatment A's truth about failure, localized through the Functional Decomposition lens.

  I move we adopt this recommendation.
