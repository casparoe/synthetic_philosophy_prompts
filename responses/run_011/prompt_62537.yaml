answer: |-
  There is no single, canonical term in logic, ethics, or game studies that functions as a standardized label for this specific pattern (comparable to "ad hominem" or "straw man"). While the behavior is widely discussed in the philosophy of technology and virtual ethics, it is typically described rather than named.

  Below is an analysis of the nearest established concepts, the current state of the literature regarding what is settled versus disputed, and, per your instruction, a coined term with definition and boundary cases.

  ### 1. Nearest Established Concepts

  While no single term captures the phenomenon exactly, four concepts from different fields overlap with it. None fit perfectly, which explains your difficulty in naming it.

  **A. Special Pleading (Argumentation Theory)**
  *   **The Fit:** This is the closest logical fallacy. Special pleading occurs when someone applies a standard to others but exempts themselves (or their interests) without justification.
  *   **The Difference:** As you noted, classic special pleading usually involves an explicit rule ("Everyone must follow X") and an explicit exemption ("Except me"). In your pattern, the speaker does not admit the rule exists. They deny the *ontology* required for the rule to apply in the first place (e.g., "This isn't *really* property" vs. "This *is* really property"). It is a meta-level inconsistency rather than a rule-level exemption.
  *   **Status:** Many logicians would classify your example as a *form* of special pleading, specifically **inconsistent ontological commitment**, but it is not the primary label used in game studies.

  **B. Equivocation (Logic/Semantics)**
  *   **The Fit:** The speaker uses the word "real" (or "mine," "harm," "item") with two different meanings.
  *   **The Difference:** Equivocation usually implies an accidental or hidden shift in semantic definition. Your pattern describes a *strategic* shift in ontological threshold based on utility. The speaker isn't necessarily confused about the definition; they are adjusting the "reality threshold" to suit the outcome. It is pragmatic, not semantic.
  *   **Status:** In the philosophy of language, this might be called **contextualist manipulation**, but that is a description of mechanism, not a named fallacy.

  **C. The Magic Circle (Game Studies)**
  *   **The Fit:** Coined by Johan Huizinga and adapted by Salen & Zimmerman, this concept describes the boundary separating the game from the "real" world.
  *   **The Difference:** The "Magic Circle" is a descriptive framework for how games function, not a label for a logical failure. Your pattern describes a **selective permeability** of the Magic Circle. The speaker treats the circle as impermeable when blame is assigned (nothing inside matters outside) but permeable when value is claimed (things inside matter outside).
  *   **Status:** Scholars like Mia Consalvo and Nick Yee have critiqued the Magic Circle precisely because players often breach it strategically, but there is no single noun for the breach itself.

  **D. Self-Serving Bias (Psychology)**
  *   **The Fit:** This cognitive bias describes attributing success to internal factors ("I earned this sword") and failure to external factors ("The game glitched," or "It's not real").
  *   **The Difference:** This explains the *motivation* (psychological protection) but not the *logical structure* (ontological switching). It is a causal explanation, not a classification of the argument form.
  *   **Status:** Settled psychological concept, but rarely used as a label for the argumentative pattern itself in philosophy.

  ### 2. Settled vs. Disputed in the Literature

  You asked to separate what is settled from what is genuinely disputed among philosophers and legal scholars working on virtual worlds (e.g., David Chalmers, Morgan Luck, Edward Castronova, Joshua Fairfield).

  **Settled Consensus:**
  *   **Causal Reality:** It is settled that virtual events have real-world causal consequences. If a player spends 100 hours building a structure, 100 hours of real human life were consumed. If an item is stolen, the victim experiences real distress or financial loss (if real money trading is involved).
  *   **Hybrid Existence:** It is settled that virtual objects are "hybrid" entities: they are digital code (ontologically dependent on servers) but also social objects (ontologically dependent on community agreement).

  **Genuinely Disputed:**
  *   **Intrinsic Moral Weight:** There is active disagreement over whether virtual actions have moral weight *independent* of real-world consequences.
      *   *Virtual Realists* (e.g., Chalmers) argue virtual actions are genuine actions; virtual murder is a form of real killing (of a digital being) and may be intrinsically wrong.
      *   *Virtual Fictionalists* argue virtual actions are make-believe; they are only wrong if they cause real-world harm (e.g., distress to a player).
  *   **Property Rights:** Legal scholars disagree on whether virtual items constitute "property" in the legal sense. Some jurisdictions treat them as licensed services (the company owns them); others are moving toward recognizing user ownership. The pattern you observe often exploits this legal ambiguity.

  ### 3. Coining a Term

  Since no established term captures the *strategic ontological switching* specifically as a logical failure mode, I will coin a term as requested. I state plainly that **this is not a standard term** in current literature but is proposed here to precisely label the pattern you described.

  **Term:** **Ontological Opportunism**

  **Definition:**
  The fallacious practice of strategically altering the ontological status assigned to an entity (e.g., declaring it "real" or "unreal," "property" or "data") within a single discourse, where the alteration is determined solely by whether acknowledging the entity's reality imposes a cost or grants a benefit to the ascriber.

  Unlike *equivocation*, the speaker does not necessarily confuse two meanings; unlike *special pleading*, the speaker does not claim an exception to a rule but rather denies the applicability of the ontology required for the rule.

  **Boundary Cases (Where the term stops applying):**

  1.  **Genuine Contextualism (Not Ontological Opportunism):**
      *   *Scenario:* A player says, "This sword is not real property in the eyes of the Game Company's Terms of Service, so they can delete it," but later says, "This sword is real to our guild community, so stealing it violates our social contract."
      *   *Why it is not Opportunism:* The speaker explicitly acknowledges two different *frameworks* of reality (Legal/ToS vs. Social/Community) and applies them consistently within those frameworks. The ontological status is not switched to benefit the speaker, but to reflect the relevant jurisdiction.

  2.  **Evolution of Belief (Not Ontological Opportunism):**
      *   *Scenario:* A player initially claims, "This is just pixels, it doesn't matter," but after their own item is stolen, they reflect and say, "I was wrong. These items represent our time and labor, and they do matter."
      *   *Why it is not Opportunism:* The speaker updates their ontological commitment universally based on new reflection or empathy. The shift is not simultaneous or strategic; it is a correction of a previously held view applied to everyone, including themselves.

  ### Summary
  You have identified a recognized inconsistency in virtual ethics, often discussed under the umbrellas of the **Gamer's Dilemma** (Morgan Luck) or **Virtual Property Theory** (Castronova/Fairfield), but it lacks a standardized fallacy name. While logicians might subsume it under **Special Pleading** or **Inconsistency**, **Ontological Opportunism** (as defined above) captures the specific mechanism of shifting the "reality threshold" for strategic gain.
