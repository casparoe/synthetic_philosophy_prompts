answer: |-
  There is no single established concept that captures this exact bifurcation of inquiry termination, so I propose the term **"Culpability-Conditional Explanatory Closure."**

  This phenomenon is distinct from the **Culpable Control Model** (Alicke), which describes how blame amplifies causal attribution to an agent, but does not predict the *dissolution* of causal attribution when blame is unavailable. It is also distinct from **Abnormal Condition Focus** (Hart & Honoré; Hitchcock), which predicts that any statistically rare factor (human or mechanical) will be selected as the cause; your observation is that mechanical rarity fails to satisfy the explanatory demand if no norm-violating agent is present. It differs from the **Knobe Effect** because that concerns judgments of *intentionality* regarding side effects, whereas your pattern concerns the *existence* of a causal explanation itself.

  **Definition and Conditions:**
  For a case to count as **Culpability-Conditional Explanatory Closure (CCEC)**, four conditions must be met:
  1.  **Causal Pluralism:** The outcome is acknowledged to have multiple necessary contributing conditions (a causal field).
  2.  **Mechanical Sufficiency:** A non-agential, mechanical account of the outcome is physically available and known to the investigators.
  3.  **Normative Gating:** The inquiry terminates with a satisfactory "cause" only if a norm-violating agent is identified; if no such agent is found, the mechanical account is rejected as an explanation.
  4.  **Explanatory Dissolution:** In the absence of a culpable agent, the event is reclassified (e.g., "accident," "systems issue") in a way that treats the question "What caused this?" as having no answer, rather than answering it with the mechanical account.

  **Distinctions and Boundary Cases:**
  *   **Distinct from:** *Standard Root Cause Analysis failure*, where a mechanical cause is found but ignored due to bias. In CCEC, the mechanical cause is not just ignored; the *category* of cause is treated as inapplicable.
  *   **Boundary Case 1 (Outside CCEC):** A natural disaster review where no human agency was possible. Here, the search for a culpable agent never initiates, so the dissolution of the causal question does not occur; the mechanical cause (e.g., "tectonic shift") is accepted.
  *   **Boundary Case 2 (Outside CCEC):** A review where a policy violation is found, but the panel determines the violation did not contribute to the outcome. Here, the culpable agent is found, but the causal link is rejected, so explanatory closure is not granted via blame.

  **Study Design:**
  To separate CCEC from **Abnormal Condition Focus** and **Culpable Control**, design a vignette study with a 2x2 factorial structure:
  *   **Factor 1 (Agent Norm):** Violation (Nurse skipped step) vs. Compliance (Nurse followed step).
  *   **Factor 2 (Mechanical Normality):** Normal (Equipment worked as specified) vs. Abnormal (Equipment had a rare, documented glitch).

  **Measure:** Ask participants not "Who caused this?" but "Is there a clear explanation for why this happened?" (Likert scale) and "Could this have been prevented?" (Yes/No).

  **Predictions:**
  *   **Abnormal Condition Focus:** Predicts high explanation ratings for both Violation/Normal (Human is abnormal) and Compliance/Abnormal (Machine is abnormal).
  *   **Culpable Control:** Predicts high explanation ratings for Violation conditions, but does not necessarily predict low ratings for Compliance/Abnormal (the machine could still be the cause).
  *   **CCEC:** Predicts high explanation ratings *only* for Violation conditions. In Compliance conditions (both Normal and Abnormal mechanics), explanation ratings should drop significantly, indicating the question has dissolved despite the presence of an abnormal mechanical factor in one arm. This specific drop in the Compliance/Abnormal cell isolates the phenomenon from standard causal selection theories.
