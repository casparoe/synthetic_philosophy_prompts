      *   State 2 (2 Black): 10. H=True.
      *   State 3 (1B, 1W): 10. H=False.
      *   Draw 1 card. It is Black Raven.
      *   S1 Likelihood: 0.
      *   S2 Likelihood: 1 (2/2).
      *   S3 Likelihood: 0.5 (1/2).
      *   Posterior S2 = 10 / (10 + 5) = 2/3.
      *   Posterior H = 2/3.
      *   Prior H = 90/100 = 0.9.
      *   0.9 -> 0.67.
      *   This works.

      *   *Wait, does the prompt require the deck to be seeded so 'there are no ravens' carries real prior weight?*
      *   Yes, "at one point the deck must be seeded so that 'there are no ravens in the reserve at all' carries real prior weight".
      *   My State 1 (80%) satisfies this.

      *   *Okay, ready to write.*
