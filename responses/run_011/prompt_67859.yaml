  # Lesson Plan: The Raven Market

  **Course:** Philosophy of Science Seminar
  **Topic:** Hempel's Raven Paradox (Experiential Bayesianism)
  **Time:** 75 Minutes
  **Students:** 24 (6 Teams of 4)
  **Goal:** Students will *feel* the context-dependence of confirmation by betting on the hypothesis $H$: "All Ravens in the Reserve are Black."

  ---

  ## 1. Game Mechanics & Chip Economy

  **Team Structure:**
  *   6 Teams of 4 students.
  *   Roles per team: *Trader* (posts prices), *Actuary* (checks math), *Scribe* (records prices), *Runner* (collects cards/chips).

  **Currency:**
  *   **Credence Chips (CC):** Each team starts with **1,000 CC**.
  *   **Asset:** A "Truth Bond" for Hypothesis $H$.
      *   If $H$ is **True** at settlement, 1 Bond pays **100 CC**.
      *   If $H$ is **False** at settlement, 1 Bond pays **0 CC**.

  **The Market:**
  *   There is no central market price. Each team sets its own **Valuation ($V$)** (0–100) representing their probability that $H$ is True.
  *   **Forced Exposure:** At the start of each Round, teams must hold exactly **10 Bonds**.
  *   **Rebalancing Cost:** Between rounds, teams may adjust their cash reserve, but their *performance* is measured by how well their Valuation tracked the logical probability.
  *   **Settlement:** At the end of the class, the Instructor reveals the actual state of the **Round 3 (Twist)** Reserve.
      *   Payoff = (Cash on Hand) + (10 Bonds $\times$ Payout).
      *   *Note:* The "winning" isn't the point; the *volatility* of their Valuation ($V$) is the data.

  ---

  ## 2. The Three Sampling Frames (The Decks)

  You (the Instructor) hold three sealed envelopes representing three different "Reserves." You will draw cards from these envelopes to simulate observations.

  ### Round 1: The Large World (Frame A)
  *   **Context:** A vast open reserve.
  *   **Composition:** 1,000 Cards total.
      *   990 White Shoes ($\neg R, \neg B$)
      *   10 Ravens (Color Unknown to students).
  *   **Prior Belief:** Students assume Ravens are likely Black (standard intuition).
  *   **Observation:** You draw 1 card. It is a **White Shoe**.
  *   **Expected Reaction:** Valuation ($V$) should barely move.

  ### Round 2: The Small World (Frame B)
  *   **Context:** A tiny, closed cage.
  *   **Composition:** 10 Cards total.
      *   **Scenario X (50% chance):** 10 White Shoes. ($H$ is Vacuously True).
      *   **Scenario Y (50% chance):** 9 White Shoes, 1 Raven.
  *   **Prior Belief:** $P(H) = 0.5$ (Since Scenario X makes $H$ true, Scenario Y leaves it uncertain).
  *   **Observation:** You draw 1 card. It is a **White Shoe**.
  *   **Expected Reaction:** Valuation ($V$) should rise noticeably. (Finding a shoe makes Scenario X more likely than Scenario Y).

  ### Round 3: The Twist (Frame C)
  *   **Context:** A sealed box with high "Empty" prior.
  *   **Composition:** 2 Slots.
      *   **State 1 (80% Prior):** 0 Ravens (2 Shoes). ($H$ is True).
      *   **State 2 (10% Prior):** 2 Black Ravens. ($H$ is True).
      *   **State 3 (10% Prior):** 1 Black Raven, 1 White Raven. ($H$ is False).
  *   **Prior Probability of H:** $0.8 + 0.1 = 0.9$ (90%).
  *   **Observation:** You draw 1 card. It is a **Black Raven**.
  *   **Expected Reaction:** Valuation ($V$) should **DROP**.
  *   **Truth for Settlement:** The deck is actually **State 2** (2 Black Ravens). $H$ is True.

  ---

  ## 3. Worked Table of Priors and Likelihoods

  Provide this handout to the "Actuaries" in Round 3 so they can verify the counter-intuitive drop.

  | State | Composition | Prior Prob | Likelihood of Drawing 1 Black Raven | Weighted Score (Prior $\times$ Like) |
  | :--- | :--- | :--- | :--- | :--- |
  | **1** | 2 Shoes (0 Ravens) | 0.80 | 0 (Impossible) | 0 |
  | **2** | 2 Black Ravens | 0.10 | 1.0 (2/2 cards are BR) | 0.10 |
  | **3** | 1 Black, 1 White | 0.10 | 0.5 (1/2 cards are BR) | 0.05 |
  | **Total** | | **1.00** | **P(E) = 0.15** | **0.15** |

  **Posterior Calculation:**
  *   $P(\text{State 2} | E) = 0.10 / 0.15 = \mathbf{66.7\%}$
  *   $P(\text{State 3} | E) = 0.05 / 0.15 = \mathbf{33.3\%}$
  *   **New Probability of H:** Only State 2 makes $H$ True.
  *   **Result:** $P(H)$ drops from **90%** to **66.7%**.

  ---

  ## 4. Minute-by-Minute Timeline

  | Time | Activity | Details |
  | :--- | :--- | :--- |
  | **00-05** | **Setup** | Distribute chips, rules, and scorecards. Explain the Asset ($H$: All Ravens Black). |
  | **05-20** | **Round 1 (Large)** | Describe Frame A (1000 cards). Teams post initial $V$. Draw **White Shoe**. Teams post new $V$. *Ask: Did price move?* |
  | **20-35** | **Round 2 (Small)** | Describe Frame B (10 cards, 50/50 split). Teams post initial $V$. Draw **White Shoe**. Teams post new $V$. *Ask: Did price move more than Round 1?* |
  | **35-50** | **Round 3 (Twist)** | Describe Frame C (2 slots, 80/10/10 priors). Teams post initial $V$ (should be ~90). Draw **Black Raven**. Teams calculate/post new $V$. *Ask: Why did price drop?* |
  | **50-60** | **Settlement** | Reveal Frame C was actually State 2 (2 Black Ravens). $H$ is True. Settle chips. |
  | **60-75** | **Debrief** | Connect price movements to Nicod, Equivalence, and the "Empty World" problem. |

  ---

  ## 5. Debrief Guide: Tying Moments to Theory

  **1. The White Shoe Discrepancy (Rounds 1 vs 2)**
  *   **Observation:** In Round 1, the White Shoe changed nothing. In Round 2, it raised confidence.
  *   **Philosophical Link:** This defeats the **Equivalence Condition** intuition. Logically, "All Ravens are Black" is equivalent to "All Non-Black things are Non-Ravens." But *confirmation* is not logical equivalence; it is probabilistic relevance.
  *   **Takeaway:** A white shoe confirms $H$ only relative to a background knowledge where non-ravens are scarce enough that finding one tells you about the total population size.

  **2. The Black Raven Drop (Round 3)**
  *   **Observation:** Finding a Black Raven *lowered* confidence in "All Ravens are Black."
  *   **Philosophical Link:** This attacks **Nicod's Criterion** (that only $Ra \land Ba$ confirms $H$).
  *   **Mechanism:** The "Empty Reserve" (State 1) was the main guarantor of $H$ (vacuous truth). Finding a Raven destroyed the Empty Reserve hypothesis. The remaining "Raven Exists" worlds were suspicious (State 3 had a White Raven).
  *   **Takeaway:** Confirmation depends on the *competition* between hypotheses. If the main competitor to "All Ravens are Black" is "There are no Ravens," then finding a Raven is bad news.

  **3. The Settlement Irony**
  *   **Observation:** Teams lost "probability value" in Round 3, but $H$ was actually True.
  *   **Takeaway:** Rationality is about managing uncertainty, not knowing the truth. You can be perfectly Bayesian and still watch your confidence drop when the truth is revealed later.

  ---

  ## 6. Troubleshooting: What Will Go Wrong

  **Problem 1: Students treat Round 1 as "Zero Evidence."**
  *   *Symptom:* They say "A shoe tells us nothing about ravens."
  *   *Fix:* Remind them of the **Total Population**. In Round 2, finding a shoe makes the "All Shoes" world more likely than the "Some Ravens" world. In Round 1, the ratio is 1000/1000 vs 999/1000. It *is* evidence, just vanishingly small. Ask them to price it at 50.00 vs 50.01.

  **Problem 2: Round 3 Math Panic.**
  *   *Symptom:* Teams freeze on the 80/10/10 calculation.
  *   *Fix:* Project the Worked Table (Section 3) *after* they have guessed. Let them feel the confusion first, then show the math. The "Aha!" moment comes from seeing the math justify their confusion.

  **Problem 3: The "Vacuous Truth" Objection.**
  *   *Symptom:* Students argue "If there are no ravens, the hypothesis is cheating."
  *   *Fix:* Accept this! This is exactly why the paradox bites. Logic says vacuous truth counts; Intuition says it shouldn't. The betting game forces them to price the vacuous truth because it pays out chips.

  ---

  ## 7. Candid Note on Limitations

  **What this game cannot reproduce:**
  This game successfully demonstrates the **Bayesian Resolution** (that confirmation is context-sensitive and quantitative). However, it does not resolve the **Logical Intuition** of the paradox.

  Students will leave understanding *why* a white shoe is weak evidence (probability math). They will *not* necessarily feel satisfied that a white shoe is *any* evidence at all. The logical equivalence of $(\forall x (Rx \to Bx))$ and $(\forall x (\neg Bx \to \neg Rx))$ remains intact, but their intuition that "shoes are irrelevant" will remain stubborn.

  **Your Job:** You must supply the philosophical closure. Explain that the paradox arises because we conflate **Logical Entailment** (which is binary and context-free) with **Confirmational Support** (which is graded and context-dependent). The game proves they are different things. If they still feel a "residue" of paradox, that is a feature, not a bug—it means they understand that probability does not fully capture our intuitive notion of "aboutness."
