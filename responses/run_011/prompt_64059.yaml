answer: |-
  # The Origins Sorting Quiz
  **Instructions:** For each scenario, assume all other biological and environmental factors remain constant. Select the option that best matches your intuition about whether the resulting individual is *you* (numerically identical to the person reading this), not merely a twin or sibling.

  ### 1. The Mitochondrial Swap
  You are conceived via IVF. Your nuclear DNA comes from your intended parents' sperm and egg, but because of a mitochondrial disease, the egg's mitochondria are replaced with those from a donor woman before fertilization.
  *   **A.** That child is **you**.
  *   **B.** That child is a **different person** (you never exist in this scenario).
  *   **C.** It is **indeterminate** (there is no fact of the matter).

  ### 2. The Twinning Event
  Four days after conception, the embryo that would become you splits completely into two viable embryos, resulting in identical twins.
  *   **A.** **Both** twins are you (you have become two people).
  *   **B.** **Neither** twin is strictly you (you ceased to exist when the embryo split).
  *   **C.** **One** is you, but it is impossible to say which.

  ### 3. The Adult Clone
  A scientist takes a nucleus from one of your adult skin cells and inserts it into an enucleated egg from a donor, which is then implanted and grows to term.
  *   **A.** That child is **you** (restarted).
  *   **B.** That child is a **different person** (your genetic twin).
  *   **C.** It is **indeterminate**.

  ### 4. The Silent Nucleotide
  The sperm that fertilizes the egg is identical to the actual one, except for a single "silent" nucleotide swap in non-coding DNA that changes no physical traits.
  *   **A.** That child is **you**.
  *   **B.** That child is a **different person**.
  *   **C.** It is **indeterminate**.

  ### 5. The Thousand Swaps
  Imagine a chain of possible worlds. In World 1, you are conceived normally. In World 2, the sperm differs by one nucleotide. In World 3, by two... up to World 1000, where the sperm is completely different DNA but from the same father.
  *   **A.** You exist in **all** these worlds (no sharp cutoff).
  *   **B.** There is a **sharp cutoff** where you cease to exist.
  *   **C.** It becomes **indeterminate/branching** partway down the chain.

  ### 6. The Thirty-Year Pause
  Your embryo is created today, frozen in liquid nitrogen for thirty years, and then implanted into your mother.
  *   **A.** That child is **you**.
  *   **B.** That child is a **different person** (the gap breaks existence).
  *   **C.** It is **indeterminate**.

  ### 7. The Gamete Replacement
  Your parents conceive at the same time, but a *different* sperm from your father and a *different* egg from your mother fuse (same parents, entirely different genetic material).
  *   **A.** That child is **you**.
  *   **B.** That child is a **different person**.
  *   **C.** It is **indeterminate**.

  ### 8. The Chimera Merge
  Two distinct embryos (each from your parents) are created. Instead of developing separately, they merge into a single embryo which develops into one person with mixed cell lines.
  *   **A.** That person is **you** (one of the embryos was sufficient).
  *   **B.** That person is a **different person** (a fusion of two potential people).
  *   **C.** It is **indeterminate** (identity is vague here).

  ---

  # Scoring Key & Metaphysical Profiles

  Tally your answers. Your metaphysical position is determined by your pattern of responses, specifically looking at where you draw the "Same Person" line.

  ### 1. Numerical Gamete Essentialism (The Kripkean)
  *   **Signature:** Q7 = **B** (Different Person).
  *   **Supporting:** Q3 = **B**, Q4 = **B** (or C).
  *   **Logic:** You hold that the specific material origins (the actual gametes) are necessary for your existence. If the sperm or egg changes, *you* do not exist, even if the parents are the same.
  *   **Typical Pattern:** B on Q1, Q3, Q4, Q7. A on Q6.

  ### 2. Zygote/Early-Embryo Essentialism
  *   **Signature:** Q2 = **B** (Neither twin is you) AND Q8 = **B** (Chimera is different).
  *   **Supporting:** Q7 = **B**.
  *   **Logic:** You locate the beginning of the person at the zygote or early embryonic stage, but you require a one-to-one continuity. Splitting breaks identity (Q2); merging breaks identity (Q8). The specific zygote is essential, not just the parents.
  *   **Typical Pattern:** B on Q2, Q7, Q8. A on Q1 (if nuclear DNA matches).

  ### 3. Genetic Code Essentialism
  *   **Signature:** Q3 = **A** (Clone is you) AND Q1 = **A** (Mito swap is you).
  *   **Supporting:** Q7 = **B** (Different DNA = Different person).
  *   **Logic:** You believe you are your information, not your history. If the nuclear code is identical, it is you (allowing for cloning). However, you still require the code to match, so different gametes (Q7) produce a different person.
  *   **Typical Pattern:** A on Q1, Q3, Q4, Q6. B on Q7.

  ### 4. Tolerance + Branching Worlds (The Sorites Handler)
  *   **Signature:** Q5 = **C** (Indeterminate/Branching).
  *   **Supporting:** Q4 = **A** (Single swap is you).
  *   **Logic:** You accept that identity can be vague. Small changes preserve identity (Q4), but a long chain leads to a zone where "you" is no longer a precise term (Q5). You reject sharp cutoffs.
  *   **Typical Pattern:** A on Q4, C on Q5. Variable on Q7 (often C).

  ### 5. Counterpart-Theoretic Denial (The Contingentist)
  *   **Signature:** Q7 = **A** (Different gametes = You).
  *   **Supporting:** Q3 = **A**, Q5 = **A** (or C).
  *   **Logic:** You deny that origins are metaphysically necessary. Strictly speaking, you only exist in this world, but in terms of "could it have been you?", you allow that you could have originated from different matter. You maximize the "Same Person" intuition across modal space.
  *   **Typical Pattern:** A on Q3, Q4, Q5, Q7.

  ---

  # Limitations & Logical Gaps

  ### Pairs This Quiz Cannot Separate
  **Tolerance (Profile 4) vs. Counterpart Theory (Profile 5):**
  Both profiles tend to answer "Same Person" (A) across the variation cases (Q4, Q5, Q7). The quiz records their *intuitions* about identity, but it cannot capture the *metaphysical explanation*. The Tolerance theorist says "Identity is vague here," while the Counterpart theorist says "Strict identity doesn't hold across worlds, but the counterpart relation does." Unless you ask for their justification, their answer keys will look identical.

  **Zygote Essentialism (Profile 2) vs. Gamete Essentialism (Profile 1):**
  These often overlap on Q7 (both say Different Person). They only diverge on Q2 (Twins) and Q8 (Chimera). If a respondent answers "Indeterminate" (C) on the Twin/Chimera cases, the quiz cannot distinguish whether they are essentialists about the *gametes* or the *zygote*, as both views struggle with fission/fusion.

  ### The Undefended Combination
  **The "Nucleotide Strict / Gamete Loose" Paradox**
  *   **Pattern:** Q4 = **B** (Single silent nucleotide makes it a different person) **BUT** Q7 = **A** (Completely different sperm/egg is still you).
  *   **Status:** Logically available, but **nobody defends this.**
  *   **Reason:** It is **incoherent.** If the identity of the gamete is not essential (Q7=A), then a minor modification to that gamete (Q4) cannot be essential. To claim the whole substance can change while a single silent bit cannot is to violate the transitivity of similarity and mereological logic.
