answer: |-
  Here is the teardown.

  ### 1. Accuracy on §1 (Lewis)

  You have misdescribed Lewis, and the error is not cosmetic; it threatens the foundation of §2–§3.

  **The Error:** You state Lewis's account is built on situations where "each of us does better by matching." This is true for *pure* coordination. However, Lewis explicitly acknowledges that most real-world conventions arise in *mixed-motive* games (coordination with conflict), not just pure coordination. He handles this via the "coordination equilibrium" concept where, *given* the convention is in place, no one has an incentive to deviate.

  **The Fatal Misalignment:** The deeper issue is that Lewis defines a convention as a solution to a *coordination* problem. In a Lewisian coordination problem, my preference is to do $X$ *because* you do $X$. In your examples (back roads, selective programmes), my preference is to do $X$ *only if you do not*. This is not a coordination problem; it is a congestion game or a minority game.

  Lewis does not claim his theory covers cases where conformity reduces payoff. He brackets those out. By defining your target as "conventions," you are fighting a definition he never claimed to own.

  **Damage to §2–§3:**
  *   **If you stick to Lewis's definition:** §2–§3 collapse. You are simply describing non-conventional equilibria. Lewis would say, "Correct, those aren't conventions."
  *   **If you challenge the definition:** §2–§3 survive, but you must reframe the argument. You are not correcting Lewis's *accuracy*; you are arguing his *scope* is too narrow. You need to claim that the philosophical category of "convention" *ought* to include these dark cases, despite Lewis's restriction to coordination problems.
  *   **The "Almost All" Rider:** You are right to flag this. Lewis allows for exceptions. But this doesn't save you. The issue isn't that *everyone* doesn't conform; it's that the *payoff structure* changes based on how many conform. Lewis assumes the payoff matrix is stable; yours is dynamic.

  **Fix:** Rewrite §1 to admit Lewis restricts himself to coordination problems. Your thesis is not that Lewis is wrong about coordination, but that there is a second, overlooked species of social regularity that functions *like* a convention (arbitrary, self-sustaining, normative) but relies on anti-coordination incentives.

  ### 2. Is the Distinction in §3 Actually a Distinction?

  **Honest Answer:** Currently, no. You have relabelled a congestion externality.

  In economics, this is the El Farol Bar problem or a standard congestion game. The equilibrium exists where expected utility of going = expected utility of staying. This relies on agents having *beliefs* about aggregate behaviour. You are calling this "calibrated ignorance" and "dark conventions," but game theorists call this "equilibrium under incomplete information."

  **How to Save It:**
  The distinction only holds if you lean harder on the **normative** element, which you currently underplay.
  *   **Congestion Game:** I take the back road because I calculate it's faster. If I learn everyone else knows, I recalculate. It's purely instrumental.
  *   **Dark Convention:** I take the back road because it's *what one does* (or *what people like us do*), provided I don't know exactly how many "people like us" there are.

  If you cannot show that agents feel a *normative pull* (an "ought") in these dark cases, you are just doing microeconomics. To make it philosophy, you must argue that these regularities generate *expectations of compliance* that function socially like Lewisian conventions, even without the CK foundation.

  **The "CK is Fatal" Claim:** This is your strongest point. In Lewis, CK sustains the equilibrium. In your cases, CK (specifically of the *rate* of conformity) destroys it. This is a genuine structural inversion. Highlight this inversion. Don't call it a "distinction" from congestion games; call it a **structural inversion of the epistemic conditions for stability.**

  ### 3. §5: Bolted on or Worth Keeping?

  **Verdict:** Keep it, but cut it down.

  It is not bolted on; it is the stake. Without §5, this is a semantic argument about the definition of convention. With §5, it becomes a claim about institutional design and transparency. It explains *why* we should care if these are conventions or not.

  **Warning:** It currently risks sounding like a conspiracy theory ("institutions obscure success"). Refine the language. They aren't necessarily lying; they are maintaining *ambiguity*. There is a difference between obscuring data and not aggregating it publicly. If you imply active deception, you lose the audience. If you imply structural opacity, you keep them.

  ### 4. Pruning the Example List (§2)

  You have five examples. Two are doing work; three are noise.

  *   **Keep:**
      1.  **The Commuter's Back Road:** Clear congestion dynamic. Easy to model.
      2.  **Selective Programme/Top Journal:** Clear positional good. The "prestige" relies on exclusivity which relies on uncertainty.
  *   **Cut:**
      1.  **Queuing at the Shortest Line:** Bad example. This is often a Lewisian coordination problem (we all want *a* line) mixed with optimization. Also, queue length is usually public information, not "dark." It contradicts your thesis.
      2.  **Leaving a Gathering:** Ambiguous. Is this congestion? Or coordination on a departure time? It muddies the water.
      3.  **Restaurants/Locals:** Redundant with the back road.

  **Instruction:** Drop the queue and the gathering. Keep the road and the journal. Use the journal example to hit the "prestige/opaque" point harder for §5.

  ### 5. The Big Claim at the End of §3

  **Claim:** "Lewis hasn't given a theory of convention but a theory of one species of it: unanimity norms, where the good is non-rivalrous..."

  **Assessment:** Too strong and historically vulnerable. Lewis knew about rivalrous goods. He just excluded them from the definition of *convention*.

  **Correction:** Soften the attack on Lewis, sharpen the claim about the social world.
  *   *Don't say:* Lewis failed to see this.
  *   *Do say:* Lewis provided the canonical account of *coordination* conventions. This paper identifies a second species: *congestion* conventions.
  *   *Why:* If you say Lewis missed this, a Lewisian in the audience will cite *Convention* p. 78 and you will look unprepared. If you say Lewis carved out a specific space and you are mapping the adjacent territory, you look constructive.

  ### 6. The Strongest Unmentioned Objection

  **The Normativity Objection.**

  You haven't addressed why these regularities are *conventions* rather than just *habits* or *equilibria*.
  For Lewis, the common knowledge of conformity generates a **reason to conform** (a normative expectation). "I ought to drive on the right because I know you expect me to."

  In your "dark" cases, do I feel I *ought* to take the back road? Or do I just *want* to?
  *   If it's just desire (instrumental rationality), it's not a convention. It's just a Nash equilibrium.
  *   If it is a convention, there must be a sanction or a normative expectation. "You shouldn't publish in Journal B if you're aiming for tenure," even if Journal B is better for the paper.

  **The Objection:** "Without Common Knowledge, you cannot generate the normative force required for a convention. You have described a behavioral regularity sustained by ignorance, but you haven't shown it has the 'ought' that makes it a social norm. If transparency destroys it, it was never a norm, just a fragile equilibrium."

  **How to Pre-empt:** You need to argue in §4 that the "shared reading of an indicator" *substitutes* for common knowledge in generating normative expectation. If the acceptance rate is public, I know I *ought* to aim high, even if I don't know who else is aiming high. You need to explain where the "ought" comes from in the dark.

  ### Summary of Orders

  1.  **Rewrite §1:** Admit Lewis restricts to coordination. Frame your project as expanding the taxonomy, not correcting Lewis's math.
  2.  **Defend Normativity in §3:** Explicitly argue why these are norms/conventions and not just game-theoretic equilibria. Otherwise, you are dressing up economics.
  3.  **Cut Examples:** Remove queues and parties. Focus on roads and journals.
  4.  **Keep §5:** But ensure it sounds like "structural opacity," not "active deception."
  5.  **Address the Normativity Objection:** If you don't explain where the "ought" comes from without CK, the paper fails its philosophical burden.
