  "Twenty-five red," Owen said, tapping the glass jar. "Seventy-five black or white. I'll take even money on red over black."

  Nadia swirled her drink. "And black-or-white over red-or-white."

  "Obviously."

  "Then you're violating the sure-thing principle." Nadia leaned in. "Take the act that pays on red versus the act that pays on black. They agree on white—they both pay nothing. Now take the act that pays on red-or-white versus black-or-white. They agree on white—they both pay everything. Your preference reverses depending on what happens on an event you claim to know nothing about. You're letting the white token drive the car while pretending you're blindfolded."

  "I'm not blindfolded, I'm uncommitted," Owen said. "The sure-thing principle assumes I can condition on white. But conditioning requires a probability. I have a set of priors, Nadia. For any single prior in that set, the principle holds. But I don't have *one*. I have a range of possible black proportions. When you ask me to condition on white, you're asking me to update a probability I explicitly refuse to pin down. If I can't assign a likelihood to white, I can't hold it fixed. The axiom demands a precision my information doesn't support."

  "So you break coherence to preserve ignorance?"

  "I preserve rationality under ignorance. Coherence without information is just consistency in error."

  "Let's test that coherence." Nadia pulled out her phone calculator. "Payoff is $100. You value black-or-white at $75. That's fixed. Red-or-white? Your minimum probability is red plus minimum white. If your black interval is symmetric around 37.5, say 12.5 to 62.5, then minimum white is 12.5. So red-or-white is 25 plus 12.5. You value it at $37.50."

  Owen nodded. "Correct."

  "I'll buy your black-or-white ticket for $75 cash plus the red-or-white ticket."

  Owen frowned. "I'd be giving up $75 value for $75 cash plus $37.50 value. That's a gain."

  "Done. Now you hold red-or-white. I announce: the token is not red." Nadia paused. "It's black or white. Your ticket now pays only on white. What's it worth?"

  "Conditional on not-red, the minimum probability of white is minimum unconditional white divided by 0.75. That's 0.125 over 0.75. One-sixth. About $16.67."

  "I'll buy it for $20."

  "Sold."

  Nadia set the phone down. "You started with a ticket worth $75. You ended with $75 cash from me plus $20 cash from me. Total $95. Wait." She smiled. "No. You gave me the red-or-white ticket in the second trade. You started with $75 value. You ended with $75 cash from the first trade? No, I said $75 cash plus the ticket. You gave me the ticket back for $20. You have $95 cash. You're up $20."

  "I said I'd buy your black-or-white ticket for $75 cash *plus* the red-or-white ticket," Nadia corrected. "You gave me black-or-white. You got $75 cash and red-or-white. Net value change: zero. Then I bought red-or-white back for $20. You now have $95 cash. You started with $75 asset. You made $20."

  "Dammit." Owen rubbed his temple. "I accepted both trades individually."

  "Because your valuation shifted. First, you valued red-or-white at $37.50. Then, after 'not red', you valued it at $16.67. But if you had updated your set of priors properly—maintaining rectangularity—your conditional valuation would have aligned with your ex-ante valuation. You re-maximized from scratch at the second node instead of updating the whole set. You're dynamically inconsistent."

  "To fix it, I need rectangularity," Owen said. "The set of priors over time has to be a product set. If I impose that, the pump stops. The conditional min-prob matches the ex-ante planning."

  "But rectangularity is a constraint," Nadia pressed. "It forces your future selves to agree with your current self. It smuggles in a kind of commitment device that looks suspiciously like a single prior's discipline. You're surrendering the flexibility of the set to save the consistency of the agent. Is that cheaper than just picking a number?"

  "It's cheaper than lying about what I know."

  "Let's talk about what you know." Nadia gestured at the jar. "If you were truly ignorant, your set would be the whole simplex. Black proportion from 0 to 0.75. Minimum probability of black is zero. You wouldn't buy a $100 black ticket for a dollar. That's not ambiguity aversion, Owen. That's paralysis. You'd be inert."

  "I'm not truly ignorant. I restrict the set." Owen tapped the counter. "Symmetric interval. 12.5% to 62.5%. Minimum black is 12.5%. Reservation price for $100 on black is $12.50. Reservation price for $100 on red is $25. I act."

  "Why that interval?" Nadia asked. "Why not 10 to 65? Why not 20 to 55? The jar doesn't tell you that. The workshop didn't tell you that. You pulled it from your gut."

  "It's a confidence level. I'm confident the split isn't extreme."

  "What evidence tightens it? If I tell you the bartender hates black tokens, does it shift? If I tell you he drew the split from a uniform bag, does it collapse to a single prior?"

  "It shifts. The set responds to information. It's not static."

  "But the bounds are ad hoc," Nadia said. "You criticize my single prior as a fiction, but your interval bounds are equally fabricated. You've just added parameters. You pay a tax in dynamic consistency—rectangularity isn't free—and you still have to pick numbers out of the air to avoid inertia. At least when I pick a prior, I know I'm committed to the consequences. You want to have it both ways: the robustness of a set without the cost of inconsistency."

  Owen sighed, signaling the bartender for water. "You think the cost is inconsistency. I think the cost is falsehood. If I pick a single prior, say 37.5% black, I'm claiming knowledge I don't have. If the true split is 10% black, I'm exposed. My set protects me against that model error. Yes, I have to maintain rectangularity to avoid your pump. Yes, the bounds are subjective. But they represent a range of plausible models, not a false point estimate."

  "And when the pump comes?"

  "Then I pay the toll. I adjust the set to be rectangular. It's work."

  "Work you wouldn't have to do if you just admitted you're maximizing expected utility like the rest of us."

  "I'm maximizing minimum expected utility. There's a difference."

  "Only if you survive the night without giving me all your money." Nadia finished her drink. "Look. I'll concede this: eliciting a single prior is often a sham. People don't have them. They construct them on the spot. So your charge that I'm lying about my information state... maybe there's truth there. We're both constructing."

  Owen nodded slowly. "And I'll concede this: without rectangularity, I'm a money pump. Maintaining it requires a discipline that mimics your single prior. Maybe the gap isn't as wide as I say."

  "But you still won't bet on black."

  "Not for less than $12.50."

  "And I won't sell it for less than $25."

  "Then we agree on the price of disagreement." Owen raised his glass of water.

  Nadia clinked hers against it. "Drink up. Morning session starts at nine."
