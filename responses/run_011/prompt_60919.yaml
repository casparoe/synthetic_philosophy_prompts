      *   **The Case:** Nightly honest journaling (resentments, fear) $\rightarrow$ Morning rereading (genuine dismissal: "overreaction," "nothing wrong") $\rightarrow$ Accepts facts/feelings of the entry but loses their *force* $\rightarrow$ No intention to deceive, no simultaneous $p$ & $\neg p$ belief.

  2.  **Deconstruct the Standard Accounts (to show why they fail):**
