          *   *Critical Point:* If a shift is empirically corroborated but theoretically degenerate (no excess content, just fixing the last anomaly), Lakatos calls it degenerating. But the prompt asks about a "corroborated shift that involves no theoretical progress." If there's no excess content, there's no novel prediction. If there's no novel prediction, there's no empirical progress in Lakatos's sense. Wait, the prompt asks: "what a corroborated shift that involves no theoretical progress would look like." This implies a shift that saves the phenomenon but doesn't add *new* content. Lakatos would call this *ad hoc*. The user asks: "why is the appraisal anything more than naive falsificationism with a waiting period attached?" This targets the "grace period" Lakatos allows for degenerating programmes.

      *   **Puzzle 2: Borrowing Auxiliaries (The Individuation Problem).**
