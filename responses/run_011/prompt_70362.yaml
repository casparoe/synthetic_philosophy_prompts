      *   *Tone:* Keep it respectful but critical. The user is smart; don't talk down.
      *   *Clarity:* Ensure the distinction between theoretical and empirical progress is sharp in the invented example.
      *   *Self-Correction on Puzzle 1:* I need to be careful. Lakatos defines empirical progress as the *corroboration* of the *excess* content. So a shift that is corroborated but has *no* excess content is, by definition, not empirically progressive. It is *ad hoc*. The user asks what this looks like. It looks like curve-fitting. I need to explain why Lakatos thinks this is different from falsificationism. Falsificationism says "reject immediately." Lakatos says "reject eventually, if it keeps being ad hoc." The difference is the *sequence* of shifts. One progressive shift saves it; a sequence of ad hoc shifts kills it.
