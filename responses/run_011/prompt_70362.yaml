          *   *Critical Point:* I need to admit if Lakatos is vague here. The distinction usually rests on the *positive heuristic*. Is the borrowed bit part of A's unfolding heuristic, or a desperate patch? If it's a desperate patch, A is degenerating. But this is hard to judge objectively.

