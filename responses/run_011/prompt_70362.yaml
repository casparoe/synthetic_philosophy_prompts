answer: |-
  Your intuition is correct: these are not three separate problems, but three facets of a single structural tension in Lakatos's framework. That tension lies between the **logic of appraisal** (how we judge science after the fact) and the **logic of discovery** (how scientists make decisions in the moment). Lakatos built the Methodology of Scientific Research Programmes (MSRP) primarily as a tool for historians and philosophers to reconstruct rationality, not as a decision manual for practicing scientists. When you press it to function as the latter, the three puzzles you identified emerge as stress fractures.

  Here is an analysis of each puzzle, followed by an account of how they cohere.

  ### First Puzzle: The Gap Between Theoretical and Empirical Progress

  You ask for an invented example to distinguish a theoretically progressive shift that lacks empirical corroboration from a corroborated shift that lacks theoretical progress.

  **The Invented Example: The Chronos Field**
  Imagine a research programme in cosmology called "Chronos Dynamics."
  *   **Hard Core:** The universe is permeated by a scalar field (the Chronos Field) that dictates the rate of time flow.
  *   **Anomaly:** Observations of distant supernovae suggest time is flowing slower than the core predicts.

  *Scenario A: Theoretically Progressive, Empirically Uncorroborated*
  To solve the anomaly, theorists propose **Chronos-2**. They modify the field equations to include a density-dependent variable.
  *   **Excess Content:** This new equation implies that in high-density regions (like neutron stars), local time should not just slow, but occasionally reverse for microseconds. This is a novel prediction not present in Chronos-1.
  *   **Outcome:** The shift is *theoretically progressive* because it has excess empirical content. However, we lack the technology to measure micro-reversals in neutron stars. The prediction remains untested for decades.
  *   **Status:** The programme is theoretically progressive but empirically stagnant. It is not yet "confirmed," but it is not yet degenerating.

  *Scenario B: Empirically Corroborated, Theoretically Degenerating*
  Alternatively, theorists propose **Chronos-3**. They suggest the anomaly is caused by dust interference in the telescope lenses, not the field itself. They add an auxiliary hypothesis about dust composition to the protective belt.
  *   **Outcome:** We analyze the dust, and yes, the composition matches the auxiliary hypothesis. The original supernova data is "saved."
  *   **Status:** The prediction is corroborated. However, there is **no excess content**. Chronos-3 predicts nothing new; it only accommodates the old anomaly. For Lakatos, this is an *ad hoc* shift. It is empirically successful in the moment but theoretically degenerating.

  **The Critique: Is this just Falsificationism with a Delay?**
  You ask why this appraisal isn't merely naive falsificationism with a waiting period. Naive falsificationism says: "An anomaly falsifies the theory; reject it." Lakatos says: "An anomaly triggers a shift; if the shift is *ad hoc* (Scenario B), the programme is degenerating, but we do not reject it immediately."

  The difference rests on **sequences**, not single instances.
  1.  **Falsificationism** judges a single theory. If it fails, it is out.
  2.  **MSRP** judges a *series* of theory-versions.

  In Scenario B, Lakatos allows the programme to survive the single *ad hoc* shift. The "waiting period" is not an indefinite grace period for one theory; it is a probationary period for the *programme*. If the next shift is also *ad hoc* (saving another anomaly without new content), and the next, the programme is declared degenerating.

  **The Instability:**
  Here is where your suspicion is warranted. If a programme produces a string of Scenario B shifts (corroborated but no excess content), Lakatos says it is degenerating. But he also admits we should not ban it. Why? Because a degenerating programme might suddenly produce a Scenario A shift (theoretical progress) that gets corroborated later.
  This makes the distinction between "progress" and "mere survival" dangerously porous. If survival is permitted indefinitely on the hope of future theoretical progress, then the label "degenerating" loses its normative bite. It becomes a historical description ("that programme was degenerating until 1990") rather than a methodological command ("stop working on this"). Lakatos wants to have it both ways: he wants to identify degeneration objectively, but he refuses to mandate abandonment. This leaves the researcher with a label that implies irrationality but permits continuation.

  ### Second Puzzle: The Borrowing Problem (Individuation)

  This is the most severe logical vulnerability in MSRP. Programme A borrows an auxiliary from rival Programme B to solve an anomaly. The prediction is confirmed. Who gets the progress?

  **The Lakatosian Criterion: The Positive Heuristic**
  Lakatos's formal answer relies on the **positive heuristic**. This is the "guiding intuition" or the "plan" of the programme.
  *   If Programme A imports the auxiliary from B *in accordance with A's own positive heuristic* (i.e., A's guiding plan suggested looking for that kind of mathematical structure), then A scores the progress.
  *   If Programme A imports the auxiliary as a desperate patch, unrelated to its guiding plan, simply to stop the bleeding, then A is degenerating. The progress belongs to B, because B's heuristic generated the tool.

  **The Instability:**
  You asked me to be direct: **This criterion is often impossible to apply objectively.**
  The "positive heuristic" is a psychological or sociological description of the scientists' intent, not a logical feature of the theory.
  1.  **Reconstruction Bias:** A historian can almost always *reconstruct* a positive heuristic after the fact to make a successful borrow look "internal." If the math works, a defender of Programme A will claim, "Our heuristic always pointed toward this kind of solution!"
  2.  **The Renting Problem:** You noted that if the belt can be rented, it doesn't individuate the programme. You are right. If Programme A can sustain itself indefinitely by cannibalizing the protective belts of Programmes B, C, and D, then Programme A has no distinct identity other than its hard core. But hard cores are often metaphysical and content-free (e.g., "all phenomena are mechanical").
  3.  **No Settling Mechanism:** There is no logical rule in MSRP to settle this in real-time. It requires a historical narrative to determine whose heuristic was truly responsible.

  **Conclusion on Puzzle 2:**
  Lakatos does not have a robust mechanism to settle this. He assumes that "genuine" progress springs from the internal unfolding of the heuristic. But in modern science, cross-pollination is the norm. If MSRP cannot distinguish between a fruitful synthesis and a parasitic patch, it fails to individuate programmes reliably. It forces the philosopher to make a judgment call about "theoretical unity" that is often subjective.

  ### Third Puzzle: Retrospectivity and Rational Action

  Lakatos admits MSRP is retrospective. We only know a programme is degenerating after it has failed to produce novel facts for a long time. But scientists must decide *now* where to spend the next ten years.

  **Individual vs. Community Rationality**
  Lakatos attempts to solve this by splitting rationality:
  1.  **Community Rationality:** The scientific community *ought* to concentrate resources on the programme that appears theoretically progressive. This ensures the growth of knowledge.
  2.  **Individual Rationality:** An individual scientist *may* rationally work on a degenerating programme or a young, anomaly-ridden programme. This is a "high-risk, high-reward" gamble. If they turn a degenerating programme around, they achieve a revolution.

  **The License to Disregard Evidence**
  You ask what keeps this from being a license to ignore counter-evidence indefinitely.
  *   **The Check:** The check is not logical; it is **sociological**. If you work on a degenerating programme, you risk professional irrelevance. You are betting that you can produce a novel fact before the community abandons the line of inquiry.
  *   **The Concession:** Lakatos concedes that MSRP does not provide an algorithm for the individual. It tells the *historian* who was rational, not the *scientist* what to do.

  **The Instability:**
  This creates a gap between the philosophy and the practice. If MSRP cannot tell a researcher whether their anomalies are "growing pains" (tenable) or "fatal symptoms" (untenable), its utility as a *methodology* is limited. It becomes a **rational reconstruction tool**.
  *   **For the Philosopher:** It explains why Newton was rational to ignore early lunar anomalies (the programme was young and progressive).
  *   **For the Researcher:** It offers no protection against the accusation of irrationality. If you stick with a programme that looks degenerating, you are "rationally permitted" only in the sense that a gambler is permitted to bet the rent money. You might win, but the odds (judged by MSRP) are against you.

  **Does it matter?**
  Yes. If the concession governs only the philosopher, then MSRP is a history of science theory, not a philosophy of scientific *method*. If it governs the scientist, it is too vague to be useful. Lakatos wants it to be both, but the retrospective nature forces it toward the former.

  ### Synthesis: The Single Puzzle

  These three puzzles hang together because they all expose the **time-lag problem** in Lakatos's framework.

  1.  **Puzzle 1 (Progress):** Highlights the lag between *predicting* a novel fact (theoretical progress) and *verifying* it (empirical progress). During that lag, the status of the programme is indeterminate.
  2.  **Puzzle 2 (Borrowing):** Highlights the lag between *using* a tool and *understanding its genesis*. We often don't know if a solution came from a programme's internal heuristic or external borrowing until the historical dust settles.
  3.  **Puzzle 3 (Retrospectivity):** Highlights the lag between *making a decision* and *appraising its rationality*.

  **The Core Tension:**
  Lakatos wanted to save scientific rationality from Kuhn's "mob psychology" and Popper's "instant falsification." He did this by expanding the unit of appraisal from a single theory to a historical sequence of theories (the Programme).
  *   **The Gain:** This explains why scientists don't abandon theories at the first anomaly (they are protecting the hard core while adjusting the belt).
  *   **The Cost:** By making the unit of appraisal historical, he made the criteria for rationality **retrospective**.

  **How they unify:**
  *   In **Puzzle 1**, you cannot know if a shift is truly progressive until the corroboration arrives (which takes time).
  *   In **Puzzle 2**, you cannot know if a shift is internally generated until you trace the heuristic history (which takes time).
  *   In **Puzzle 3**, you admit that you cannot judge rationality until the sequence is over (which takes time).

  **Conclusion for your Essay:**
  The "single puzzle" is that **MSRP is a logic of history, disguised as a methodology of science.**
  It succeeds brilliantly at explaining why past scientists were rational to do what they did (reconstruction). It struggles to tell current scientists what they ought to do (prescription).
  *   Regarding **Puzzle 1**: The difference between progress and survival is real, but only visible in hindsight.
  *   Regarding **Puzzle 2**: The individuation of programmes is fuzzy in real-time because heuristics are opaque; clear only when history reveals the source of the innovation.
  *   Regarding **Puzzle 3**: The "license" to ignore evidence is real, but it is a gamble on future history.

  If you argue this in your essay, you will move beyond summarizing Lakatos to critiquing the *function* of his framework. You will show that the three puzzles are not bugs in the system, but inevitable features of a system that tries to judge dynamic, temporal processes with static, logical categories. The "evasive" element you sensed is Lakatos's reluctance to admit that his methodology is primarily a tool for historians, not a guide for scientists. He wants it to be normative (telling scientists what to do), but its structure is descriptive (telling historians what happened). That is the source of the instability in all three puzzles.
