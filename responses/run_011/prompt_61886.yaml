  ### The Sorting Instrument

  **Instructions for Students:**
  Read each scenario carefully. There are no trick questions and no "correct" theoretical answers. For each case, select the single statement that best matches your judgment about what the agent should do, what counts as a mistake, or how you would advise them. Answer based on your intuition, not on what you think a philosopher would say.

  **Q1. The Club Entry (Sequence vs. Local)**
  Elena pays $10 to enter a club. Inside, she pays $5 to move to the VIP section because it looks better. Once in VIP, she pays $5 to move back to the general floor because it is less crowded. She ends up on the general floor with $15 less than when she started. At each moment, the move seemed worth the cost to her.
  *   A) No mistake was made. Each choice was the best one available at the moment she made it.
  *   B) A mistake was made, but only at the very first or very last step.
  *   C) The whole series of choices is a mistake, even if each step felt right at the time.

  **Q2. The Manuscript Deadline (Binding and 'Ought')**
  Marcus wants to finish a chapter. He knows he gets distracted by TV in the evenings. He gives his friend $500 and says, "If I don't send 5 pages by Friday, keep the money." On Thursday night, he wants to watch TV. He knows sending the pages is hard work.
  *   A) The $500 penalty makes sending the pages the right thing to do Thursday night.
  *   B) The $500 just makes him more likely to send the pages; it doesn't change what is right.
  *   C) The $500 is irrelevant to Thursday night; the only thing that matters is how he feels then.

  **Q3. The Marathon Sign-Up (Unity of Agent)**
  In January, Sarah signs up for a marathon in April because she values fitness. In April, she wakes up sore and tired. The January version of Sarah cared deeply about finishing. The April version cares deeply about resting.
  *   A) The April Sarah is letting down the January Sarah; they are the same person.
  *   B) The April Sarah is effectively a different person with different needs than the January version.
  *   C) The January Sarah made a mistake assuming the April version would care about fitness.

  **Q4. The Gym Membership (Foreknowledge)**
  Tom buys a gym membership. He knows from experience he usually stops going after three weeks. He buys it anyway, hoping this time is different. He stops after three weeks.
  *   A) The mistake was buying the membership knowing his history.
  *   B) The mistake was stopping after three weeks.
  *   C) There was no mistake; he tried and stopped, which is fine.

  **Q5. The Savings Transfer (Plans as Reasons)**
  Last year, Priya decided to save for a house. She set up an auto-transfer. Today, she sees a concert ticket she really wants. The money is available if she cancels the transfer. She still wants the house, but the concert feels urgent.
  *   A) The fact that she decided this last year gives her a reason to keep the transfer going today.
  *   B) Only her current desire for the house matters today; the past decision is history.
  *   C) Her current desire for the concert matters more because it is happening now.

  **Q6. The Forager (Adaptive/Category Error)**
  A forager finds berries. She can eat them now or plant seeds for a huge harvest next year. She eats them. Her children might go hungry next year, but she is very hungry now.
  *   A) She failed to manage her resources for the future.
  *   B) She responded correctly to her current hunger; optimizing for next year is the wrong frame.
  *   C) She should have planted seeds regardless of how hungry she is now.

  **Q7. The Cookie Safe (Binding as Cure vs. Symptom)**
  David locks his cookies in a safe. He loses the key. He is now unable to eat cookies. He is glad he can't eat them, but he didn't *want* to lose the key.
  *   A) He solved his problem by removing the choice.
  *   B) He didn't solve it; he just broke the lock.
  *   C) He made himself worse off by losing freedom, even if he eats less.

  **Q8. The Moving Day Promise (Surprise)**
  Linda promises to help a friend move. On the day, she wakes up feeling surprisingly lethargic and anxious, something she didn't predict. She cancels.
  *   A) She is responsible for canceling; promises count regardless of feelings.
  *   B) She is not responsible; she couldn't predict this feeling.
  *   C) She is responsible for making a promise she couldn't keep.

  **Q9. The Loathed Charity App (Device Verdict)**
  An app donates money to a political cause you hate if you skip the gym. You set it up to ensure you go.
  *   A) Setting this up is a smart way to ensure follow-through.
  *   B) Setting this up is a mistake; you shouldn't threaten yourself like that.
  *   C) Setting this up proves you don't really value going to the gym.

  ***

  ### The Logical Space Grid

  To map the positions, we use three primary axes. The **Verdict** (what happens to the agent who fails) fills the cells.

  | **Axis 1: Agent Unity** | **Axis 2: Locus of Assessment** | **Axis 3: Source of Reason** | **Verdict on Inconsistency** |
  | :--- | :--- | :--- | :--- |
  | **Single** (One person over time) | **Local** (The specific choice now) | **Desire** (Current motivation) | **Non-Issue** (Deflationary/Adaptive) |
  | **Single** | **Global** (The temporal sequence) | **Plan** (Past commitments) | **Defect** (Dynamic Consistency/Planning) |
  | **Multiple** (Temporal selves) | **Local** (The specific choice now) | **Desire** (Current motivation) | **Conflict** (Multiple Selves) |
  | **Single** | **Global** (The temporal sequence) | **Desire** (Current motivation) | **Misfortune** (The "Empty Spot") |

  **Grid Analysis & Empty Cells:**

  1.  **Single / Local / Desire / Non-Issue:** *Live.* This is the **Deflationary** view (Q1-A, Q5-B, Q6-B) and the **Adaptive** view (Q6-B). These are separated by whether the local desire is seen as a "failure to manage" (Deflationary) or "correct response" (Adaptive).
  2.  **Single / Global / Plan / Defect:** *Live.* This is the **Dynamic Consistency** and **Planning Agency** cluster (Q1-C, Q5-A). Distinguished by whether the defect is structural (Sequence) or normative (Plan violation).
  3.  **Multiple / Local / Desire / Conflict:** *Live.* This is the **Multiple Selves** view (Q3-B). Inconsistency is not a failure of one agent, but a conflict between agents.
  4.  **Single / Global / Desire / Misfortune:** *Unoccupied (Coherent & Stable).* This is your hypothesized spot. The agent accepts the sequence is the unit of assessment (Global), but believes reasons are always local (Desire). Therefore, failing the sequence is not a rational defect (since local reasons were followed), but a situational misfortune (bad luck that desires shifted). Binding is useful instrumentally (Q2-B, Q7-A) but carries no normative weight.
      *   *Why Empty?* Most theorists conflate "Global Failure" with "Rational Defect." If you fail the sequence, you are usually deemed irrational. Separating *Welfare Assessment* (Global) from *Rational Assessment* (Local) is coherent but rarely defended as a complete theory of practical rationality.
  5.  **Single / Local / Plan / Defect:** *Empty (Incoherent).* If reasons come from Plans (Global/Extended), but assessment is Local, you cannot be defective for following the Plan locally. If you follow the Plan, you are locally consistent. If you break the Plan, you are locally inconsistent but Plan-based reasons suggest you shouldn't have. This creates a tension that usually collapses into Global Assessment.
  6.  **Multiple / Global / Plan / Defect:** *Empty (Incoherent).* If there are Multiple Selves, there is no single subject to hold responsible for a Global Sequence. A "Global Plan" implies a Single Agent.

  ***

  ### Scoring Key

  Map the student's answers to the profile below. Note where positions overlap.

  **1. The Deflationary Profile**
  *   **Pattern:** Q1(A), Q3(A), Q5(B), Q6(A or B).
  *   **Logic:** Choices are assessed locally. Past plans do not create reasons. Inconsistency is just a change in desire.
  *   **Distinction:** If Q6(B), they lean **Adaptive** (Category Error). If Q6(A), they lean **Deflationary** (Failure of desire strength, not rationality).

  **2. The Dynamic Consistency / Planning Agency Profile**
  *   **Pattern:** Q1(C), Q3(A), Q5(A), Q8(A).
  *   **Logic:** The sequence is the unit of assessment. Past plans/decisions create reasons. Inconsistency is a defect.
  *   **Distinction:** This bucket contains **Dynamic Consistency**, **Planning Agency**, and **Precommitment**. To separate them, look at Q2 and Q9.
      *   **Precommitor:** Q2(A), Q9(A). (Binding changes the 'ought' / is a smart tool).
      *   **Sophisticate:** Q4(A). (Mistake was entering the situation, not the inconsistency itself).
      *   **Naif:** Q4(B). (Mistake was the inconsistency itself; they didn't know it would happen).
      *   **Planning Agency:** Q5(A) strong endorsement. (Plans themselves are the source of reasons).

  **3. The Multiple Selves Profile**
  *   **Pattern:** Q3(B).
  *   **Logic:** The primary divider is Agent Unity. If they choose 3(B), they likely reject Global Assessment (Q1-C) because there is no "Global" agent.
  *   **Note:** If a student chooses Q3(B) but Q1(C), they hold a **Fragmented Global** view (coherent but rare: "The sequence of selves is assessable, even if no single self persists").

  **4. The "Unlucky Not Defective" Profile (The Empty Spot)**
  *   **Pattern:** Q1(C), Q2(B), Q5(B), Q7(A).
  *   **Logic:** This is the critical unique signature.
      *   Q1(C): They agree the Sequence is the unit of assessment (Global).
      *   Q5(B): They reject Plans as Reasons (Local Norms).
      *   Q2(B): They reject Binding as Normative (Instrumental only).
      *   Q7(A): They see Binding as Useful.
  *   **Verdict:** This student believes the agent failed the sequence (Global Assessment) but did not violate any norms (Local Desire Reasons), making the failure a misfortune rather than a defect.

  **5. The Adaptive Profile**
  *   **Pattern:** Q6(B) is the strongest indicator.
  *   **Logic:** Often overlaps with Deflationary on Q1/Q5, but diverges on the *value* of the local desire. Deflationary sees it as a brute fact; Adaptive sees it as functional/correct.

  **Ambiguities & Overlaps (Cutting the Questions)**

  *   **Sophisticate vs. Precommitor:** These are difficult to separate purely by case judgment because a Sophisticate will often choose to Precommit.
      *   *Differentiation:* Q4 distinguishes them (Sophisticate blames the entry; Precommitor blames the lack of binding). Q2 distinguishes them (Precommitor says binding changes the 'ought'; Sophisticate says binding changes the incentives).
      *   *Warning:* If a student answers Q4(A) and Q2(A), they are a **Sophisticated Precommitor**. If Q4(B) and Q2(A), they are a **Naive Precommitor** (believes binding works but didn't anticipate needing it? Rare).
  *   **Dynamic Consistency vs. Planning Agency:** These often travel together.
      *   *Differentiation:* Q1(C) captures Dynamic Consistency. Q5(A) captures Planning Agency. It is possible to hold Q1(C) and Q5(B) (The "Empty Spot"). It is theoretically possible to hold Q5(A) and Q1(A) (Plans create reasons, but only for the moment? Unstable).
      *   *Instruction:* If a student scores high on both Q1(C) and Q5(A), classify as **Standard Rationalist**. If they split, probe the "Empty Spot."

  **Question Redundancy Check:**
  *   **Q2 and Q9** both test Binding. Q2 tests *Normative Weight* (Does it change the 'ought'?); Q9 tests *Instrumental Value* (Is it smart?). Keep both. They distinguish the Precommitor (Yes/Yes) from the "Empty Spot" agent (No/Yes).
  *   **Q1 and Q8** both test Consistency. Q1 tests *Structure* (Money pump); Q8 tests *Excuse* (Surprise). Keep both. Q8 distinguishes the Strict Consistency view (Blame even if surprised) from the Naif view (No blame if surprised).

  **Final Note on the "Empty Spot":**
  You are correct that this spot is coherent but largely unoccupied. It corresponds to a view where **Rationality is Local** (responding correctly to current reasons) but **Evaluation is Global** (assessing the life as a whole). Most philosophers want Rationality to track Evaluation (if you fail globally, you were irrational) or Evaluation to track Rationality (if you were locally rational, you did fine). Holding them apart requires a dual-standard theory that is stable but unpopular. Your instrument successfully isolates this via the Q1(C) + Q5(B) + Q2(B) combination.
