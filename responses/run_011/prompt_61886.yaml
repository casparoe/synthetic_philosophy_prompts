      So: "You were locally rational. The sequence was sub-optimal. This is a bad situation (unlucky), not a rational defect."
      This requires defining Rationality as "Local Responsiveness."
      This is coherent. It's a form of **Local Rationality + Global Welfare.**
      Why unoccupied? Because most philosophers who care about Global Welfare want to call Global Failure "Irrational." And most who care about Local Responsiveness don't care about Global Failure.
      So it's a "Coherent and Stable, Unoccupied" spot.

