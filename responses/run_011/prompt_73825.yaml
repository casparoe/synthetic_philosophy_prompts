      *   If I tell them "You're right," they risk a letter from a Dewey scholar.
      *   *Middle Path:* You are right about the *structural analogy*, but wrong about the *ontological claim*. Dewey dissolves the inner/outer boundary of the *arc*, not necessarily the *organism/environment* boundary in the way Clark does.
      *   *Bloat Objection:* The bloat objection says "If the notebook is mind, where does it stop?" Dewey says "It stops where the coordination stops." This *does* help answer bloat, but not by extending mind to tools, but by redefining mind as coordination.
