answer: |-
  **MEMORANDUM**

  **TO:** Curatorial Advisory Panel
  **FROM:** [Your Name], Panel Member
  **DATE:** October 15, 2023
  **SUBJECT:** Decision Recommendation: "Collapse" Gallery Narrative and Labeling Protocol

  **Purpose**
  Next week's meeting requires a final decision on the narrative framework for the new permanent gallery. The current impasse threatens both the integrity of the scholarship and the security of the funding. We have three positions: remove the term "collapse" to prioritize accuracy; retain it to prioritize urgency and donor intent; or decompose the concept to prioritize nuance.

  Based on the evidence from the four case studies (Aegean, Maya, Rapa Nui, Anthropocene) and the constraints of our fabrication schedule, I recommend we **restructure the gallery into two differently framed halves.**

  **Recommendation: The Two-Half Structure**
  We retain the working title *Collapse: How Civilizations End* for external marketing and board reporting to secure the gift, but we physically and narratively divide the gallery experience.

  *   **Half 1 (Rooms 1–3): "Transformations of the Past."** The Aegean, Maya, and Rapa Nui rooms are framed not as uniform collapses, but as distinct systemic shifts. The word "collapse" is prohibited in wall text unless it meets the specific criteria in the Usage Test below.
  *   **Half 2 (Room 4): "The Anthropocene Choice."** This room carries the weight of the "Collapse" title. It is framed explicitly as a warning about potential future systemic failure, distinguishing it from the historical case studies.

  This structure honors the funder's desire for a consequential warning (located in Room 4) without compromising archaeological accuracy in Rooms 1–3. It acknowledges that while the past offers data, it does not offer identical parallels to the present.

  **Addressing the Funder's Objection**
  The argument that "transformation" language sanitizes suffering is morally weighty and must not be dismissed. People did die in the Late Bronze Age; communities did suffer during the Maya Classic hiatus. To use soft language like "reorganization" risks implying a painless transition that denies the human cost of political failure.

  However, precision is not sanitization. Misapplying the word "collapse" to the Maya or Rapa Nui does not honor the dead; it misidentifies the cause of their suffering. In the Maya lowlands, framing the event as a "civilizational suicide" obscures the resilience of the Northern centers and the survival of the population. On Rapa Nui, it attributes demographic catastrophe to "ecocide" rather than the documented historical realities of slave raiding and disease. If we use "collapse" loosely in the past, we dilute the term's utility. When we reach the Anthropocene room, visitors will have been trained to think "collapse" means "change." We will have forfeited the linguistic shock required to make the present-day warning land. We preserve the urgency of the funder's message by reserving the term for where it is most defensible: the potential future.

  **Addressing the Archaeological Bias Objection**
  A colleague has correctly noted that our "repertoire axis" is biased toward durable materials (stone, script) over perishable practices (oral tradition, wood, fiber). We risk defining "collapse" as "the disappearance of things that survive well."

  To respect this, the curatorial team must adopt a **Presumption of Continuity.** In the absence of evidence for the disappearance of a practice, we cannot claim the repertoire collapsed. For example, in the Aegean, we can state the *palatial administration* collapsed because the Linear B records stop. We cannot state the *religious repertoire* collapsed without evidence that the gods were no longer worshipped in villages. Label copy must reflect this uncertainty: "The record of writing disappears," not "Writing was lost." This shifts the burden of proof. We do not assert collapse unless we have positive evidence of cessation, not just an absence of monumental data.

  **The Usage Test**
  To ensure consistency for label writers without specialist backgrounds, the following procedure must be applied room by room.

  **Step 1: Define the Unit.**
  What is ending? (e.g., The Mycenaean Palace System, The Southern Maya Political Order, The Rapa Nui Palm Ecosystem).
  *   *Rule:* Never use "Civilization" or "Society" as the unit. They are too vague. Use specific political or ecological systems.

  **Step 2: Apply the Three Axes.**
  Evaluate the unit against the three decompositions:
  1.  **Demographic:** Did the population drop by >50% within 2 generations?
  2.  **Political:** Did the central authority lose the ability to mobilize surplus/keep records?
  3.  **Repertoire:** Is there positive evidence that transmitted practices/techniques ceased (not just lack of evidence)?

  **Step 3: Assign the Term.**
  *   **Use "Collapse" ONLY if:** Political AND Repertoire axes are met (Score 2/3), AND the cause is primarily internal systemic failure.
      *   *Application:* **Aegean.** (Political/Repertoire met). **Anthropocene.** (Projected risk).
      *   *Prohibited:* **Maya.** (Political met, Repertoire/Population not met globally). **Rapa Nui.** (Political/Repertoire not met pre-contact).
  *   **Use "Regime Shift" if:** Political axis is met, but Population and Repertoire persist.
      *   *Application:* **Maya.** (Southern centers to Northern centers).
  *   **Use "Reorganization" if:** Political structure changes, but core practices adapt.
      *   *Application:* **Aegean Villages.** (Palaces go, farms stay).
  *   **Use "Catastrophe" if:** Demographic axis is met due to external shock.
      *   *Application:* **Rapa Nui (Post-Contact).**

  **Rapa Nui Consultation Protocol**
  The Rapa Nui room requires sign-off from the Pacific Advisory Council. Our recommendation is conditional on their response:
  *   **If the Council accepts the "Ecocide" debate as valid context:** We proceed with the "Regime Shift" framing, noting the palm extinction but emphasizing population stability pre-contact.
  *   **If the Council rejects the "Ecocide" framing entirely:** We must remove all references to environmental mismanagement in the pre-contact period. The room title becomes "Rapa Nui: Resilience and Contact." The narrative focus shifts exclusively to the 19th-century demographic catastrophe (slavery/disease). In this scenario, the word "collapse" is strictly prohibited in this room, as the "Two-Half" structure allows us to isolate this variance without undermining the gallery's overall thesis.

  **The Anthropocene Room**
  This room is the pivot point. It must not present climate change as a historical "collapse" equivalent to the Bronze Age. It must present it as a *risk of collapse* that is uniquely global and potentially irreversible.
  *   **Label Directive:** Use the word "Collapse" here freely, but always in the future tense or as a risk scenario ("Risk of Systemic Collapse").
  *   **Connection:** Explicitly link back to Rooms 1–3. "In the past, systems reorganized. Today, the system is global. Reorganization may not be an option."
  *   **Rationale:** This satisfies the board's expectation that this room is the "point" of the gallery. It allows us to be urgent and plain-spoken about the present without distorting the past to do so.

  **Next Steps**
  1.  **Curatorial Team:** Rewrite the Room 1–3 intro panels using the Usage Test. Remove "Collapse" from any label that scores <2/3 on the Axes.
  2.  **Development Office:** Confirm with the funder that the *title* remains for marketing, while the *narrative* distinguishes past transformation from future risk. Frame this as "increasing the intellectual rigor to protect the gallery's long-term reputation."
  3.  **Pacific Liaison:** Submit the revised Rapa Nui script to the Advisory Council immediately, noting the conditional language regarding pre-contact environmental management.

  This path allows us to keep the funding, keep the warning, and keep our integrity. We do not need to choose between truth and consequence. We can have both, provided we stop using one word to do three different jobs.

  **Decision Required:** Approval to proceed with the Two-Half restructuring and implementation of the Usage Test.
