      Given the user's suspicion ("I don't think I have any slot for the claim that the thing being reported isn't there"), validating that suspicion seems more robust. The VIM definition of measurement *requires* a measurand. If Illusionism says there is no measurand, it is literally not describing a measurement process, despite using measurement metaphors (interface, error, representation).
