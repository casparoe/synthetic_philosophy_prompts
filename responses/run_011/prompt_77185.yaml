answer: |-
  The fluorescent lights of the Appeals Division hummed with a frequency that seemed to vibrate in the fillings of everyone's teeth. It was a sound that suggested energy was being expended, though rarely on anything visible. Elias sat at his desk, which was cleared of everything except a single stack of manila folders. They were tied with red string. Beside them lay an identical stack tied with green.

  Sarah stood by the window, looking out at the rain streaking the glass. She turned back to the room, her eyes settling on the files.

  "Show me again," she said.

  Elias didn't look up. He picked up the top folder from the red stack and the top folder from the green. He opened them side by side. The paper was thin, the carbon copies slightly smudged.

  "Case 89-404," Elias said, tapping the red file. "Denied. Case 89-405. Approved."

  Sarah leaned in. She knew the drill. They had worked the Appeals desk for six years. They knew the predicate: *Substantial Hardship*. Section 88b of the Act. It was the kind of phrase that looked solid in the statute book but turned to mist when you tried to hold it against a human life.

  "Income?" Sarah asked.

  "Identical. Within one dollar."

  "Medical outlays?"

  "Identical. Same clinic, same diagnosis code, same prescription schedule."

  "Household size?"

  "Two. Spouse and claimant. Both files."

  Sarah straightened up. "Then why is one red and one green?"

  "Because one qualifies and one does not," Elias said. He closed the files and stacked them neatly. "The difference is there. It has to be there. The Act says a claimant either suffers Substantial Hardship or they do not. It doesn't say 'most do' or 'some do.' It applies to the individual."

  "We've checked the metrics, Elias. We've checked the adjusters' notes. There is no variable we can isolate. If we ran them through the algorithm again, they'd swap. Or they'd both come out the same."

  "That is a limitation of the algorithm," Elias said. "Not a limitation of the fact."

  He stood up and walked to the whiteboard where the division's flowchart was drawn in dry-erase marker. He drew a line. It was sharp, black, and vertical.

  "The line exists," Elias said. "It separates those who qualify from those who don't. It is precise. If it were not precise, the benefit would not be a benefit. It would be a lottery. We are not running a lottery."

  "We are running a bureaucracy," Sarah said. "And the predicate is vague. 'Substantial.' How much is substantial? If I lose a finger, is it substantial? If I lose a hand? There is a point where it becomes substantial, but there isn't a specific finger where it flips."

  "There is a specific finger," Elias said. "We just cannot know which one. Not because we lack data. Not because we are tired or the files are thin. But because knowledge of the boundary requires a precision that the concept itself forbids. To know the line is to stand outside the concept. We are inside it. We are subject to it."

  He tapped the stack of red files. "I have sorted these based on the determination of the previous adjudicator. I know that somewhere in this stack, the status changes from Approved to Denied. I know that between file *n* and file *n+1*, the truth value flips. I cannot tell you which pair. I cannot tell you why. But I know the flip happens. To deny the flip is to deny the reality of the cases."

  Sarah walked over to her own desk. On it lay the file for Mrs. Gable. It was thick. It contained every receipt, every doctor's letter, every bank statement from the last three years. It was a complete record of a life narrowing down to a single question. Mrs. Gable's husband had stopped working eighteen months ago. Her income had dropped. Her medical costs had risen. She was hovering exactly where 89-404 hovered next to 89-405.

  "If the line is unknowable," Sarah said, "then asserting a position is guessing. You're asking me to guess."

  "I am asking you to adjudicate," Elias said. "There is a fact of the matter regarding Mrs. Gable. She either suffers Substantial Hardship or she does not. Our job is to align our record with that fact."

  "But if the fact is inaccessible," Sarah said, "then there is no fact for us to align with. Not for her. For the group, yes. The statistics hold. The budget balances. But for Mrs. Gable? She is in the gap."

  "The gap is in your head," Elias said. "Not in the Act."

  Sarah opened Mrs. Gable's file. She looked at the summary sheet. The numbers were right on the threshold. It was the kind of case that kept them late. If they approved her, she got the supplement. If they denied her, she appealed to the Tribunal, and the Tribunal sent it back to them with a note asking for clarification they couldn't provide.

  "Look," Sarah said. "I agree that 'Mrs. Gable qualifies or Mrs. Gable does not qualify' is true. I'll sign that statement. It's a tautology. It covers all possibilities."

  Elias nodded. "Obviously."

  "But," Sarah continued, "I don't think 'Mrs. Gable qualifies' is true. And I don't think 'Mrs. Gable does not qualify' is true. Not because I don't know. But because there isn't a thing there to be true. She is a borderline case. The predicate doesn't reach her. It stops before her."

  "If the predicate doesn't reach her," Elias said, "then the Act doesn't apply to her. And if the Act doesn't apply to her, she is denied by default. So you are asserting she does not qualify."

  "No," Sarah said. "I'm asserting that the question is defective. But the form doesn't have a box for 'defective.' It has 'Approved' and 'Denied.'"

  "Then you must choose," Elias said. "The disjunction is true. 'Either P or not-P.' You accept that."

  "I accept that."

  "Then one of them must be the case."

  "That's where you're wrong," Sarah said. "The disjunction is true because it covers the possibilities. But it doesn't mean the components have truth values. I can say 'Either the present King of France is bald or he is not.' The sentence is logically valid. But it doesn't mean there is a King of France whose head I can examine."

  Elias sighed. He picked up a pen. "Mrs. Gable is not a King of France. She is a woman in Sector 7 with a leaking roof and a back injury. The world is definite. She is either in hardship or she isn't. Your refusal to assign a value doesn't save her. It just leaves the file open."

  "It saves me from lying," Sarah said.

  "It saves you from deciding," Elias corrected. "Look at the files." He gestured to the red and green stacks. "Someone decided those. They drew the line. They didn't know where it was, any more than we do. But they knew it was there. They trusted that the reality of the hardship existed independent of their ability to measure it."

  "They trusted wrong," Sarah said. "Or they lied. One of those stacks is full of errors. Maybe both."

  "Error implies a correct answer," Elias said. "I am telling you there is a correct answer. You are telling me there is no question."

  Sarah looked down at the form. Form 88b-Rev4. Box 12: *Determination*. She had to check one circle. The ink had to be black. The signature had to be wet.

  "If I check 'Approved'," Sarah said, "I am asserting that she meets the criteria. I am asserting a fact that I believe does not exist."

  "If you check 'Denied'," Elias said, "you are asserting she fails the criteria. Which is also a fact you believe does not exist."

  "So either way, I'm falsifying the record."

  "You are completing the record," Elias said. "The record requires a status. The status requires a binary. The world provides the binary. You are just the instrument that records it."

  "The world doesn't provide it," Sarah said. "We do. We draw the line. When we sign, we make it true. Before we sign, it's neither."

  "Then you are creating reality," Elias said. "That is not adjudication. That is legislation. We don't legislate."

  Sarah picked up the pen. It felt heavy. She looked at Mrs. Gable's photo clipped to the corner of the file. She looked tired. Not 'Substantial Hardship' tired, necessarily. Just tired. The kind of tired that comes from waiting for a letter.

  "The disjunction is true," Sarah said quietly. " 'Qualifies or Does Not Qualify.' I know that is true. I know that logically, I cannot deny that."

  "Good," Elias said.

  "But knowing that," Sarah said, "doesn't tell me which one to write. The truth of the 'Or' doesn't give me the truth of the 'And'. It doesn't license me to write 'Denied.' It doesn't license me to write 'Approved.' It just licenses me to say 'One of these.'"

  "We don't have a box for 'One of these'," Elias said.

  "I know."

  Sarah hovered the pen over Box 12. She realized then what the cost was. It wasn't that she was unsure. It wasn't that she feared being wrong. It was that she knew that whichever circle she filled, she was asserting a determinate status onto an indeterminate situation. She was forcing the world to be sharp where it was blurred. Elias thought he was discovering a hidden sharpness. Sarah knew she was creating a false sharpness.

  But the disjunction held. It hung over the room, true and useless. *She qualifies or she does not.* It was a safety net that caught nothing. It protected the logic of the Act, but it did not protect Mrs. Gable. To help Mrs. Gable, Sarah had to step out of the safety of the disjunction and into the specificity of the claim. She had to claim knowledge she believed was impossible.

  Elias watched her. He looked satisfied. He believed she was finally aligning herself with the reality of the file. He believed she was preparing to acknowledge the fact that was waiting there, hidden but present.

  Sarah knew she was about to commit a violence against the truth. She was going to write a sentence that had no truth value and treat it as if it were true. The disjunction was her comfort, her guarantee that logic remained intact. But logic didn't pay the rent. The signature did.

  "If I sign," Sarah said, "I am not finding the fact."

  "You are recording it," Elias said.

  "I am making it," she said.

  "Then make it," Elias said. "The file cannot remain open."

  Sarah lowered the pen. She understood Elias's position now. He thought the darkness was in the room, and the file was the object waiting to be seen. She knew the darkness was in the file, and the room was just where they pretended to see. But the procedure demanded light. The procedure demanded a shadow be cast.

  She moved the pen to the 'Denied' circle. It was the conservative choice. It preserved the budget. It aligned with the presumption of eligibility not being met unless proven. It was the path of least resistance.

  But as the nib touched the paper, she felt the weight of the disjunction snapping. *Either Approved or Denied.* True. But *Denied*? False. *Approved*? False. She was writing a falsehood to satisfy a truth. She was sacrificing the specific to save the general.

  Elias turned back to his own desk. He picked up the next file. He believed he was serving the truth. He believed the line was there, waiting in the ink.

  Sarah pressed down. The ink flowed. It dried quickly. It looked permanent. It looked like a fact.

  She signed her name below it. She had upheld the Act. She had upheld the logic. She had failed the claimant, not because the claimant didn't deserve it, but because the claimant didn't exist in the way the Act required. She had taken a woman who was neither in nor out and forced her out.

  Elias glanced over. "Done?"

  "Done," Sarah said.

  She closed the file. The disjunction was still true. Mrs. Gable either qualified or she didn't. But now, because of the ink, only one of those could be treated as real. Sarah knew which one was real in the office. She wasn't sure which one was real anywhere else.

  Elias nodded. He believed the job was finished because the determination matched the hidden fact. Sarah knew the job was finished because the determination replaced the fact. They both looked at the stack. The red and green files stood silent. The line was drawn. Neither of them could see it, but only one of them believed it was there before they drew it.

  ***

  **Analysis**

  The lines carrying Elias's view (Epistemicism) are those where he insists on the existence of a precise boundary independent of human knowledge ("The line exists... It is precise," "The difference is there. It has to be there"), arguing that our inability to locate it is a limitation of our access, not the reality ("Knowledge of the boundary requires a precision that the concept itself forbids"). Sarah's view (Ontic Vagueness/Supervaluationism) is carried in her distinction between the truth of the disjunction and the lack of truth value in the disjuncts ("I agree that 'Mrs. Gable qualifies or Mrs. Gable does not qualify' is true... But I don't think 'Mrs. Gable qualifies' is true"), and her realization that signing forces a determinate status onto an indeterminate reality ("I was asserting a determinate status onto an indeterminate situation"). To make the story come down the other way—where Sarah refuses to sign or Elias concedes—the setup would need to break the procedural constraint that requires a binary output; if the form allowed a "Borderline/Review" status, Sarah could honor her ontology without violating the procedure, removing the tragic cost of her view, or if Elias admitted that the "fact" is constituted by the adjudication itself, he would collapse into Sarah's position, dissolving the conflict.
