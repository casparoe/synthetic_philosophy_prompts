  *(Refining the Ending)*: Sarah signs. She knows she is forcing a determinate status onto an indeterminate reality. The disjunction ("She is either eligible or not") is true, but it doesn't tell her which box to check. She checks one arbitrarily, violating her own ontological commitment.

