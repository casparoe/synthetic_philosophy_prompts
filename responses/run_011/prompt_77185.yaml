  8.  **Revising for Constraints:**
      *   Ensure no theory names (no "epistemicism," "supervaluationism").
      *   Ensure the "knowledge requires" bit for Elias is clear. It's not lack of data; it's that the concept "Substantial" doesn't map perfectly to reality, yet reality decides it.
      *   Ensure Sarah's payment is clear. She accepts the logic but suffers the moral/professional cost of lying (in her view).

  9.  **Post-Story Paragraph:**
