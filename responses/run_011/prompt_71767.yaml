answer: |-
  **Mark: 20/25**

  **Feedback Comments (for the script):**

  *   **Strong definition:** Your formulation of the basic calculus ($pB - C$) and the statement of the paradox are precise and clearly written. You correctly identify the tension between the micro-rationality of abstention and the macro-reality of high turnout.
  *   **Free-rider vs. Probability:** The distinction you draw here is sophisticated. Correctly noting that the voting paradox relies on $p \approx 0$ (pivotal probability) rather than just small marginal returns distinguishes this from standard public goods games. This was a high-quality conceptual distinction.
  *   **Assessment of the D-term:** You explain the logic of the $D$ term well, but your empirical claim that turnout "doesn't track how close the contest is" is contentious. A significant body of empirical literature suggests $p$ *does* matter (turnout is higher in swing states/districts), which weakens the defense of the $D$ term. You should have acknowledged this counter-evidence.
  *   **Assessment of EGK:** You explain the Edlin, Gelman, and Kaplan argument clearly, but you do not *assess* it as the question asked. You present it as a solution that "dissolves" the paradox without critiquing its assumptions (e.g., does it require altruism? Is $p \approx 1/N$ accurate?). An assessment requires weighing strengths against limitations.
  *   **Relevance:** The final paragraph on expressive voting and rational irrationality demonstrates wide reading, but it was not asked for. The marks for this section would have been better spent providing the critical assessment of the EGK argument that was missing from the previous paragraph.

  **Factual Slips & Mis-attributions (for your calibration):**

  *   **Attribution of the D Term:** The student attributes the formal addition of the $D$ term to **Downs**. While Downs (1957) discussed "citizen duty," the formal specification of the calculus as $R = pB - C + D$ to solve the paradox is attributed to **Riker and Ordeshook (1968)**, "A Theory of the Calculus of Voting." Downs is the origin of the spatial model and cost/benefit analysis, but R&O are the specific citation for the paradox and the $D$-term solution.
  *   **Empirical Claim on Closeness:** The student claims turnout "doesn't track how close the contest is." This is factually debatable/likely incorrect in the context of rational choice literature. The "competitiveness hypothesis" (that higher $p$ increases turnout) is a standard finding used to validate the instrumental model. Stating it as fact that there is *no* tracking undermines the argument.

  **Single Change for Most Marks:**

  Move the entire final paragraph (on Brennan, Lomasky, and Caplan) and use that space to **critique the EGK argument.** The question asked to *assess* the two resolutions; the student assessed the first one (noting falsifiability issues) but merely described the second one. Adding a paragraph on the limitations of the EGK approach (e.g., it relies on social preferences rather than pure self-interest, or the difficulty of estimating $N$) would have turned a descriptive answer into a critical one, likely pushing this into the 23–24 range.
