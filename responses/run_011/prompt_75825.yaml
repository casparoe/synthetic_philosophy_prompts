prompt: |-
  I spent forty years in condensed-matter physics and have taken up seventeenth-century natural philosophy in retirement. I am working through Hobbes's *De Corpore* (1655), in the English translation of 1656, Part I, chapter 1. Since I cannot reproduce his wording from memory, what follows is my own close paraphrase of the stretch where he sorts out which branches of philosophy admit of demonstration; please treat it as mine rather than his, and tell me frankly where you suspect the paraphrase has flattened something that matters.

  The substance, as I read it: philosophy is knowledge of effects acquired by reasoning from the manner in which a thing is generated, or, conversely, of generation reasoned back from its effects. Science is possible only where causes are known, and causes are known only where the generation of the thing is known. It follows, he says, that geometry admits of demonstration, because we ourselves draw the lines and describe the figures from which we reason; and civil philosophy likewise, because we ourselves make the commonwealth. Natural philosophy does not admit of demonstration: the natural bodies we investigate we do not make, and from their effects we can reason only to *possible* causes — we can show that such-and-such a motion would produce the appearances, not that it does. He makes a closely parallel point somewhere in the last part of *Leviathan*, in his attack on the universities.

  Three questions, which I should like answered by argument rather than by referral to commentators.

  First, what work is the "because we make it" clause actually doing? Is it a claim about causes (only an artificer knows the generation of what he produces), about definitions (a geometrical definition must be generative, showing how the figure arises from motion, whereas no definition of gold or fire can be), or about epistemic access generally? He holds in the same chapter that truth and falsity are attributes of speech and not of things, and that we conceive nothing beyond what is in us. If reasoning is nothing but the consequences of names we have ourselves imposed, then we seem able to stipulate a definition of a natural body exactly as we stipulate one of a triangle. On his own terms, what prevents this? Is anything left for construction to do once the nominalist account of definition has done its work?

  Second, does the concession about natural philosophy leave physics anything that answers to his definition of philosophy? He defines philosophy as knowledge of causes and then admits that in the study of nature we never attain causes, only possibilities. Is this a modest fallibilism within a science that remains genuinely causal, or does it reduce natural philosophy to the saving of appearances by hypotheses of the very kind he elsewhere derides? Say which reading the passage supports and why.

  Third, a working scientist's objection: since Hilbert, no one supposes that a geometric proof depends on anyone's having drawn anything; the demonstration runs from axioms, and constructions are heuristic at best. Does this simply refute his rationale, or is the rationale immune, because what matters to him is not the diagram but the availability of a generative definition? If the latter, does his criterion not become empty, since generative definitions can be written for objects nobody has ever made?

  Please reason from the passage and from Hobbes's own doctrines elsewhere in the work. Do not send me a bibliography; I will find the commentators for myself.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Profile:** Retired condensed-matter physicist (40 years experience), now studying 17th-century natural philosophy. Deeply knowledgeable about science, likely rigorous about logic and definitions.
      *   **Task:** Evaluate a close paraphrase of Hobbes's *De Corpore* (Part I, Chapter 1) regarding the distinction between demonstrable sciences (geometry, civil philosophy) and non-demonstrable sciences (natural philosophy).
      *   **Constraints:**
          *   Treat the paraphrase as the user's own work (do not correct it against the original text unless it fundamentally misrepresents Hobbes's argument *as presented*).
          *   Answer three specific questions by argument, not by citing commentators.
          *   Reason from the passage provided and Hobbes's doctrines elsewhere in *De Corpore* (implied knowledge).
          *   No bibliography.
          *   Tone: Frank, rigorous, respectful of the user's expertise.
      *   **Core Issue:** The tension between Hobbes's materialism/nominalism and his claim that we can only demonstrate what we make.

  2.  **Analyze the Paraphrase:**
      *   *Summary:* Philosophy = knowledge of effects from generation OR generation from effects. Science requires known causes. Known causes require known generation.
      *   *Geometry:* Demonstrable because we make the figures.
      *   *Civil Philosophy:* Demonstrable because we make the commonwealth.
      *   *Natural Philosophy:* Not demonstrable. We don't make natural bodies. We reason to *possible* causes, not certain ones.
      *   *Connection:* Links to *Leviathan* (universities attack).
      *   *Assessment:* This is a very accurate capture of Hobbes's position in *De Corpore* I.1. The distinction rests on the *verum factum* principle (truth is made). The paraphrase doesn't seem to flatten anything crucial, but the *questions* reveal where the philosophical friction points are.

  3.  **Address Question 1: The Work of "Because We Make It"**
      *   *The Issue:* Is it about causality, definitions, or epistemic access? Given Hobbes's nominalism (truth is in speech, names imposed by us), why can't we just define "gold" like we define "triangle"?
      *   *Hobbes's Doctrine:* For Hobbes, reasoning is computation with names. But for the computation to yield knowledge of *consequences* (causes/effects), the definitions must capture the *generation* of the thing.
      *   *The "Making" Clause:* It's not just that we draw a line; it's that the definition of a circle *is* the description of its generation (rotation of a line). We know the cause because we *are* the cause.
      *   *Nominalism vs. Reality:* We can name "gold," but we don't know its generation. We can't stipulate the *consequences* of gold's nature because we didn't constitute that nature. In geometry, the consequences are contained in the definition because we created the definition *and* the object's conditions of existence simultaneously.
      *   *Answer Strategy:* Argue that "making" bridges the gap between nominal definition and real causation. In geometry/civil philosophy, the nominal essence *is* the real essence because we created the thing according to the name. In natural philosophy, the name "gold" refers to something existing independently of our definition; thus, our definition cannot guarantee causal knowledge. Construction isn't just drawing; it's the ontological grounding of the definition.

  4.  **Address Question 2: The Status of Natural Philosophy**
      *   *The Issue:* If philosophy is knowledge of causes, and natural philosophy only gives possible causes, is it still philosophy? Is it fallibilism or hypothesis-saving?
      *   *Hobbes's Doctrine:* Hobbes is a materialist. He believes there *are* real causes (motions). But he admits epistemic limitation.
      *   *Reading:* It's not merely "saving appearances" in the instrumentalist sense (like Osiander on Copernicus). Hobbes believes his physics *is* true, but strictly speaking, it lacks the *demonstrative certainty* of geometry. However, he often writes as if he *has* found the true causes (motion of particles).
      *   *Nuance:* The passage supports a "modest fallibilism" regarding *certitude*, but not regarding *causal realism*. He thinks he is identifying real motions, but he admits he cannot prove they are the *only* possible causes (the problem of underdetermination).
      *   *Answer Strategy:* It reduces the *certitude*, not the *causal claim*. It distinguishes between *scientia* (strict demonstration) and prudent conjecture based on mechanical principles. It avoids pure instrumentalism because Hobbes is committed to matter and motion as the *only* real causes. So, it's causal realism with epistemic humility.

  5.  **Address Question 3: The Hilbert/Modern Geometry Objection**
      *   *The Issue:* Modern axiomatics doesn't need drawing. Does this refute Hobbes? Or is "generative definition" the key? If generative definitions can be written for unmade things, is the criterion empty?
      *   *Hobbes's Doctrine:* Hobbes hated "pure" abstraction detached from body. For him, a point is not dimensionless; it's a body considered as having no magnitude. Geometry is the study of quantity arising from motion.
      *   *The "Making" Aspect:* It's not the physical act of drawing (ink on paper) that matters; it's the *conceivability of generation*. We can conceive the motion that generates a circle. We cannot conceive the motion that generates gold (in Hobbes's time).
      *   *Empty Criterion?* If I define a "unicorn" generatively, do I know it? No, because it doesn't exist. The "making" implies *actual* or *possible* existence controlled by the definer.
      *   *Answer Strategy:* Hobbes's rationale is immune to Hilbert because Hobbes isn't doing formalism; he's doing ontology. The "construction" is mental but grounded in the concept of motion. However, the user's point about "generative definitions for unmade objects" hits a weak spot. Hobbes would reply that we can only demonstrate things whose existence depends on our definition. We can define a chimera generatively, but we cannot demonstrate its *effects in the world* because we didn't make the world. The criterion isn't empty, but it restricts demonstration to domains where definition entails existence (math, politics), not domains where existence precedes definition (nature).

  6.  **Synthesize and Refine:**
      *   *Tone Check:* Ensure I'm speaking to a peer. Avoid condescension. Acknowledge the sophistication of the questions.
      *   *Structure:* Address the paraphrase briefly (it's solid), then tackle the three questions sequentially.
      *   *Key Hobbesian Concepts to Weave In:* *Verum factum* (truth is made), Nominalism (truth is in propositions), Materialism (all is body in motion), Resolution/Composition (method).
      *   *Refining Q1:* Emphasize that for Hobbes, definitions in demonstrable science are *causal* definitions. In natural philosophy, definitions are *phenomenal* (based on appearance).
      *   *Refining Q2:* Distinguish between "knowledge of consequences" (geometry) and "knowledge of consequences *supposing* causes" (physics).
      *   *Refining Q3:* Clarify that for Hobbes, axioms without generation are just words. The "making" is the warrant that the words latch onto a conceivable reality.

  7.  **Final Review against Constraints:**
      *   Did I use commentators? No.
      *   Did I critique the paraphrase? Only to validate it.
      *   Did I answer all three questions? Yes.
      *   Is the tone appropriate? Yes.

      *(Self-Correction during drafting)*: I need to be careful not to attribute *verum factum* explicitly to Vico or later interpretations, but keep it within Hobbes's *De Corpore* framework. Hobbes doesn't use the phrase *verum ipsum factum*, but the concept is clearly there in I.1. I should focus on the "Resolution and Composition" method. In geometry, we resolve the figure to lines/motion and compose it back. In physics, we resolve effects to possible causes but cannot compose them back with certainty.

      *(Refining Q3)*: The user asks if the criterion becomes empty if we can write generative definitions for things nobody made. I need to point out that for Hobbes, "making" includes *mental* making. But the constraint is *existence*. We make the triangle exist in our conception. We do not make the gold exist. The generative definition of gold would be a guess about its internal motion, which we cannot verify because we didn't institute that motion.

      *(Final Polish)*: Ensure the distinction between "truth of speech" and "truth of thing" is clear in Q1. Hobbes says truth is in speech, but *science* requires the speech to track causal generation which we control.

