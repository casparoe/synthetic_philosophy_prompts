  \begin{array}{c|ccc}
   & L & C & R \\
  \hline
  U & (8, 1) & (0, 0) & (1, 3) \\
  M & (3, 5) & (3, 1) & (2, 2) \\
  D & (0, 0) & (8, 5) & (4, 2)
  \end{array}
  $$

  **Step 1: Check Row Strategies (Original Game)**
  *   $U$: $(8, 0, 1)$ against $(L, C, R)$.
  *   $M$: $(3, 3, 2)$ against $(L, C, R)$.
  *   $D$: $(0, 8, 4)$ against $(L, C, R)$.
  *   *Pure Dominance:* $U$ does not dominate $M$ ($0 < 3$ at $C$). $D$ does not dominate $M$ ($0 < 3$ at $L$).
  *   *Mixed Dominance:* Consider $\sigma_R = pU + (1-p)D$.
      *   Against $L$: $8p > 3 \Rightarrow p > 3/8$.
      *   Against $C$: $8(1-p) > 3 \Rightarrow 8 - 8p > 3 \Rightarrow 5 > 8p \Rightarrow p < 5/8$.
      *   Against $R$: $1p + 4(1-p) > 2 \Rightarrow 4 - 3p > 2 \Rightarrow 2 > 3p \Rightarrow p < 2/3$.
      *   Intersection: $3/8 < p < 5/8$. Let $p = 1/2$.
      *   Payoffs for $\frac{1}{2}U + \frac{1}{2}D$: $(4, 4, 2.5)$.
      *   Comparison with $M$: $4 > 3$, $4 > 3$, $2.5 > 2$.
      *   **Action:** $M$ is strictly dominated. **Delete M.**

  **Step 2: Check Column Strategies (Reduced Game: $\{U, D\} \times \{L, C, R\}$)**
  *   Column Payoffs against $U$: $L(1), C(0), R(3)$.
  *   Column Payoffs against $D$: $L(0), C(5), R(2)$.
