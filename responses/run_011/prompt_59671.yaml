answer: |-
  1. **On Reference and Acquaintance**
  You argue that while the brain state causes the judgment, it is *acquaintance* that fixes the reference of that judgment to the qualia. But the acquaintance relation itself appears to be causally inert on your view. If the physical production of the sentence "I am in pain" is fully determined by the neural state, what work is the acquaintance relation actually doing to ensure the words latch onto the experience rather than the neuron firing that produced them?

  2. **Follow-up (Anticipating: "Acquaintance is a primitive, non-causal relation of awareness.")**
  If acquaintance is primitive and non-causal, it seems to float free of the physical story entirely. But if I can tell a complete physical story of why you uttered those words without mentioning acquaintance, haven't you made the *aboutness* of your report explanatorily redundant? Why shouldn't we say the report is actually about the brain state, and acquaintance is just a label for a correlation we can't explain?

  3. **On the Zombie Duplicate**
  Your zombie duplicate is physically identical to you, so she produces the same arguments, makes the same reports, and defends epiphenomenalism with the same vigor. Since her arguments are generated by the same physical causes, on what grounds do we say your argument is *true* and hers is *false*, given that the truth-maker (the qualia) plays no role in generating the argument in either case?

  4. **Follow-up (Anticipating: "Her arguments are empty tokens; mine are grounded in reality.")**
  But if the causal history of the argument is identical, the *persuasiveness* and *logical structure* are identical. If I were listening to a recording of either of you, I couldn't tell the difference. Doesn't this imply that the *truth* of epiphenomenalism is undetectable even in principle, making your claim to know it true indistinguishable from the zombie's claim to know it true?

  5. **On Safety and Sensitivity**
  In epistemology, a belief is often considered "safe" if it couldn't easily have been wrong. In the nearest possible world where you are a zombie, you still believe you have qualia. Given that your belief is produced by a brain state that would exist even without the qualia, are you prepared to concede that your introspective judgments are insensitive and unsafe, and if so, can they still count as knowledge?

  6. **Follow-up (Anticipating: "I reject the Safety condition for introspective knowledge.")**
  If you reject Safety for introspection, you are carving out a unique exception for this specific class of beliefs. But if the mechanism producing the belief (the brain state) is the same mechanism we use for all other judgments, why does the epistemic rule change just because qualia are present? Are you not insulating your view from error by redefining what counts as knowledge?

  7. **On Distinguishing from Interactionism**
  On your picture, the brain state causes the qualia, and the brain state causes the judgment, resulting in a perfect correlation. What observable or structural feature distinguishes this from a view where the qualia *also* cause the judgment, other than your stipulation that they don't? If the correlation is perfect, what is the metaphysical cash value of denying the causal link?

  8. **Follow-up (Anticipating: "Interactionism violates conservation of energy / is less parsimonious.")**
  Appeals to parsimony or conservation of energy are theoretical virtues, not empirical data. But if the phenomenology *feels* like our experiences guide our thoughts, doesn't the burden of proof lie on the epiphenomenalist to show why that universal intuition is an illusion, rather than on the interactionist to find a gap in physics? Why is the stipulation of causal inertness the more humble position?

  9. **On Evolutionary Function**
  If qualia are causally inert, they are invisible to natural selection. Yet we report them, write poetry about them, and avoid them (e.g., pain). If the brain state does all the work of avoidance and reporting, what evolutionary account can you give for why we have these elaborate, rich experiences at all, rather than just being zombies?

  10. **The Falsification Question**
  Finally, epiphenomenalism is often criticized for being unfalsifiable because any evidence against it can be reinterpreted as "just another brain state." So, I want to ask you directly: What specific piece of evidence or argument would force you to *abandon* epiphenomenalism entirely, rather than simply incorporating it into your model as another common-cause correlation?
