prompt: |-
  I teach a required sixty-minute bioethics session to roughly forty second-year medical students, seated at eight tables of five. None of them has had philosophy, and one or two will have watched a grandparent decline through dementia; I want the session to work for those students without ever asking anyone to disclose anything. Please design a tabletop activity, with a debrief, that makes them feel the problem of an advance directive's authority over a later self: the situation in which the person who wrote the directive and the person it would govern have diverged enough that honoring it begins to look like one person sacrificing another.

  The activity must not be introduced as being about advance directives, autonomy, or dementia. Those words, and the distinction between what a patient once wanted and what is good for her now, should surface only in the debrief.

  Five design constraints:

  1. The change in the later self must be real rather than performed. Do not ask students to role-play cognitive impairment, and do not hand out cards instructing someone to want something different. Build in a manipulation that produces a genuine reversal in what participants care about during the hour — an acquired taste, an endowment that comes to be valued, an attachment to their table — so that preferences written down in the first ten minutes conflict with preferences actually held in the last twenty. Tell me exactly what the manipulation is, why it should fire inside an hour, and what the facilitator does at the tables where it doesn't.

  2. Psychological continuity should be a game variable. Give each player a continuity score that moves across rounds, and have students set, before they see any case, a threshold below which a directive stops binding. Then arrange rounds that force them to discover that the threshold they set does no real work at the margin.

  3. Someone must decide whom the points belong to. Design the scoring so that honoring a directive and overriding it each impose costs on identifiable parties, with stakes that are real in the room but cost me nothing — control over the rest of the session, information about later rounds, exemption from a task. Then state which of two architectures you chose and defend the choice: a single continuing account belonging to the person, or separate accounts for the earlier and later self. That decision quietly presupposes an answer to the identity question, so give me the alternative as a variant and a sentence on what each presupposes.

  4. Include a surrogate. In at least one round the decision must be made by a third party at the table who can see the directive and the later self's behavior but not her stated reasons, and who is not told whether she counts as capable of deciding for herself.

  5. Include an amendment round in which later selves may revise their directives for a round still to come, and force the class to settle which directive governs when the two conflict: the one written with better information, or the most recent one.

  Deliver: the opening script students actually hear; roles, printable materials, and a minute-by-minute timeline for sixty minutes; the scoring rules; a tabulation step at the end, saying what pattern you expect the class's own decisions to show and what it would mean if it doesn't; and a debrief that maps each mechanic onto the conceptual distinction it embodies — including why the earlier self is supposed to have authority at all, what happens to that rationale as continuity falls, and the contrast between the interest a person takes in the shape of her life as a whole and the interest she takes in how her days feel from the inside. Name the technical vocabulary only at that point.

  Close with two honest notes. First, what will predictably go wrong the first time this is run: how a competitive table turns it into a game to be won rather than a case to be felt, where the rules will be exploited, and how to handle the student for whom the topic is a memory rather than a puzzle. Second, this design leaves the later self fully capable of deciding for herself, and stakes snacks and minutes rather than ventilation. Say plainly what that substitution buys, which feature of the real problem it cannot reproduce and the facilitator must supply by hand, and how you would bridge to the clinical case in the final five minutes without lecturing the whole thing back in.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**

      *   **Target Audience:** 40 second-year medical students (M2s). No philosophy background. 1-2 have personal dementia experience.
      *   **Goal:** Make them *feel* the problem of advance directive authority over a later self (the "then self" vs. "now self" conflict).
      *   **Constraint 1 (Real Change):** No role-playing impairment. Must create a *genuine* reversal in preferences during the hour (acquired taste, endowment, attachment). Facilitator needs instructions for tables where this fails.
      *   **Constraint 2 (Continuity Score):** Psychological continuity must be a game variable. Students set a threshold *before* seeing cases. Rounds must show the threshold fails at the margin.
      *   **Constraint 3 (Ownership/Scoring):** Someone must decide whom points belong to. Costs must be real in the room (control, info, exemption). Must choose between Single Account vs. Separate Accounts and defend it (plus provide variant).
      *   **Constraint 4 (Surrogate):** One round decided by a third party who sees directive + behavior but not reasons/capacity status.
      *   **Constraint 5 (Amendment):** A round where later selves can revise directives. Class must settle which governs (better info vs. most recent).
      *   **Secrecy:** Cannot mention advance directives, autonomy, or dementia until the debrief.
      *   **Deliverables:** Opening script, roles/materials, minute-by-minute timeline, scoring rules, tabulation/expectations, debrief (mapping mechanics to concepts), two honest notes (failure modes + limitations).

  2.  **Deconstruct the Core Problem:**
      *   The philosophical heart is Derek Parfit's *Reasons and Persons* (psychological continuity) and Ronald Dworkin's *Life's Dominion* (critical interests vs. experiential interests).
      *   The challenge is making M2s feel the "betrayal" of the past self by the future self without using medical jargon.
      *   *Idea for Preference Reversal:* The "Endowment Effect" combined with "Sunk Cost/Investment." If they build something or earn something early, they value it. If the rules change later to devalue it, they feel the loss.
      *   *Better Idea for "Real Change":* Taste acquisition. But that's hard in 60 mins.
      *   *Best Idea for "Real Change":* **The "Table Identity" & "Resource Accumulation" Mechanic.**
          *   Phase 1: Students build a "Table Profile" based on abstract values (e.g., Efficiency vs. Creativity). They write a "Charter" (Directive).
          *   Phase 2: They engage in a task that *changes* what is valuable. For example, they accumulate a specific currency (say, "Blue Chips") through a tedious task.
          *   Phase 3: The rules shift. Now "Red Chips" are valuable, but they only have Blue. Or, they become attached to the specific items they collected.
          *   *Refinement:* Let's use a "Legacy Project."
          *   *Actually, let's look at Constraint 1 again:* "Acquired taste, an endowment that comes to be valued, an attachment to their table."
          *   *Proposal:* **The "Garden" Metaphor (Abstracted).**
          *   Round 1: Plan a garden (Directive). Write down what you want (e.g., "Wildflowers" vs. "Vegetables").
          *   Round 2: Do the work. You are given seeds. You plant them. You water them (tedious task). You become invested in *what you have*.
          *   Round 3: A blight hits. You can save the plants or save the soil for next year. But the plants you grew are not what you planned in Round 1.
          *   *Critique:* Too abstract.
          *   *Alternative:* **The "Currency Exchange" Game.**
          *   Round 1: You define your "Wealth." (e.g., I value Time over Money). You sign a contract.
          *   Round 2: You work. You earn "Money." You start wanting Money because you have it (Endowment Effect).
          *   Round 3: You are offered a trade. Honor the contract (give up Money for Time) or break it (keep Money).
          *   *Constraint 1 Check:* Is the change *real*? Yes, the endowment effect is psychological reality.
          *   *Constraint 2 Check:* Continuity Score. We need a metric that degrades. Let's make the "Continuity Score" a physical token that gets degraded by random events or task difficulty.
          *   *Constraint 3 Check:* Scoring. Who gets the points? The "Table" or the "Student"? Let's make it the "Self-1" vs "Self-2" account.
          *   *Constraint 4 Check:* Surrogate. One student sits out the work phase, then decides for the worker.
          *   *Constraint 5 Check:* Amendment. Allow rewriting the contract mid-game.

      *   *Refining the "Real Change" (Constraint 1):* The prompt asks for a manipulation that produces a genuine reversal. The **Endowment Effect** is the most robust psychological phenomenon for this. If I give you a mug, you value it more than if I ask you to buy it.
      *   *Game Concept:* **"The Architect and The Resident."**
      *   Phase 1 (Architect): Plan a room. Write rules for how it should be used.
      *   Phase 2 (Resident): Live in the room (perform tasks). You acquire items in the room. You get comfortable.
      *   Phase 3 (Crisis): A choice must be made that violates the Phase 1 rules to protect Phase 2 comfort.
      *   *Wait, Constraint 1 says:* "Build in a manipulation that produces a genuine reversal in what participants care about during the hour."
      *   *Idea:* **The "Snack/Currency" Manipulation.**
          *   Start: Students are hungry (it's midday?). No, assume normal state.
          *   Round 1: Students write a "Dietary Directive" for a future meal. (Too close to medical).
          *   Let's go with **"The Token Economy."**
          *   Round 1: Students define what "Winning" looks like. (e.g., "I want to maximize Green Tokens"). They write this on a card.
          *   Round 2: They play a game where they *accidentally* accumulate Red Tokens instead, through effort. They invest effort into Red Tokens. They begin to value Red Tokens because they worked for them (IKEA effect / Effort Justification).
          *   Round 3: They are offered a choice: Cash out Green (per Directive) or Cash out Red (per Current Desire).
          *   *Constraint 1 Fix:* The prompt says "Do not hand out cards instructing someone to want something different." The change must emerge. Effort Justification is perfect. If I work hard for X, I value X. If my Directive said I want Y, now I want X.
          *   *Continuity Score:* Let's make this a "Memory/Link" token. Every time they switch tasks, they lose a link.

      *   *Let's try a stronger narrative:* **"The Colony Ship."**
      *   Round 1 (Launch): You are the Mission Planner. You set the goals for the Colony. (Directive). You set a "Continuity Threshold" (If the crew changes this much, ignore my plan).
      *   Round 2 (Journey): You are the Crew. You encounter events. You acquire resources. You get tired. You develop a culture. You *become* different people (via task fatigue and resource attachment).
      *   Round 3 (Arrival): Do you follow the Plan or the Crew's current needs?

      *   *Wait, Constraint 3:* "Someone must decide whom the points belong to... stakes that are real in the room... control over the rest of the session, information about later rounds, exemption from a task."
      *   Okay, the stakes need to be about the *class session itself*.
      *   *Stake Idea:* **Exemption from the Debrief Write-up** or **Choice of Break Time** or **Control over the Final Case Discussion Topic.**
      *   Let's use **"Exemption from the Final Reflection Paper/Task"** (if applicable) or **"Choice of the Final Case Study."** Let's go with **"Choice of the Final Case Study."** It costs the instructor nothing but feels like power.
      *   *Scoring Architecture:* Single Continuing Account (The Table's Score) vs. Separate Accounts (Architect Score vs. Crew Score).
      *   *Decision:* I will choose **Separate Accounts**. This forces the identity split.
      *   *Variant:* Single Account (presumes identity is continuous).

      *   *Constraint 4 (Surrogate):* One student is the "Guardian." They see the Plan and the Crew's state, but not *why* the Crew wants what they want.
      *   *Constraint 5 (Amendment):* Mid-journey, Crew can try to radio back to change the Plan.

      *   *Refining the "Real Change" (Constraint 1) again:*
          *   I need them to *actually* change their minds.
          *   *Mechanic:* **The "Sunk Cost" Trap.**
          *   Round 1: Choose a path (A or B). Write it down.
          *   Round 2: Walk down Path A. It's hard. You earn "Path A Coins."
          *   Round 3: You realize Path B was easier, but you have Path A Coins. You now value Path A Coins because you have them.
          *   *Better:* **The "Mug" Experiment adapted.**
          *   Round 1: Choose a prize you *would* like (Pen or Mug). Write it down.
          *   Round 2: You are given the Pen. You must use it to solve puzzles for 15 minutes. You become proficient with it. It becomes "yours."
          *   Round 3: You are offered the Mug (your original choice) or keep the Pen (your current attachment).
          *   *Problem:* Too simple.
          *   *Let's go with "The Table Identity."*
          *   Round 1: Table chooses a "Table Name" and "Table Goal" (e.g., Speed vs. Accuracy). They sign a "Charter."
          *   Round 2: Table performs tasks. To succeed, they *must* violate the Charter (e.g., Goal was Accuracy, but to get points they must go Fast). They accumulate "Fast Points." They start valuing Speed because that's how they are winning.
          *   Round 3: Choice. Honor Charter (Accuracy) or Honor Current State (Speed).
          *   *Why it works:* Cognitive Dissonance. They justify their actions by changing their values.

      *   *Let's finalize the Game:* **"The Legacy Protocol."**
      *   **Phase 1 (The Architects):** 10 mins. Define values. Set Continuity Threshold.
      *   **Phase 2 (The Builders):** 20 mins. Perform tasks. Accumulate "Assets." The tasks subtly shift value from Abstract Values to Concrete Assets.
      *   **Phase 3 (The Crisis):** 15 mins. Decision rounds (Surrogate, Amendment, Final).
      *   **Phase 4 (Debrief):** 15 mins.

      *   *Constraint 1 (Real Change) Specifics:*
          *   Manipulation: **Effort Justification + Endowment.**
          *   Students will earn "Credits" by solving puzzles.
          *   Twist: The puzzles are frustrating. To solve them, they must adopt a specific strategy (e.g., "Aggressive Bidding").
          *   By the end, they value "Aggressive Bidding" because it got them Credits, even if their Phase 1 Charter said "Collaborative Consensus."
          *   *Wait, simpler:* **The "Currency Devaluation."**
          *   Phase 1: You declare "Gold" is valuable.
          *   Phase 2: You work hard to earn "Silver." You earn a lot of Silver. You feel rich in Silver.
          *   Phase 3: You can cash out Gold (per plan) or Silver (per current holding).
          *   *Why it fires:* Loss aversion. Giving up Silver feels like a loss.
          *   *Facilitator Fix:* If a table doesn't care about Silver, the Facilitator announces a "Bonus" for Silver holders, artificially inflating value.

      *   *Constraint 2 (Continuity Score):*
          *   Each table gets 5 "Link Tokens."
          *   Every time they switch tasks or lose a round, they lose a Link.
          *   They set a threshold (e.g., "If Links drop below 3, ignore Phase 1").
          *   The game forces them to lose Links *while* gaining Assets.
          *   Result: They want to ignore Phase 1 *because* Links are low, but they also want to keep Assets gained during low Link phase.

      *   *Constraint 3 (Scoring/Ownership):*
          *   Architecture: **Separate Accounts.** "Architect Points" vs. "Builder Points."
          *   Stake: **Exemption from the post-session reflection email.** (Instructor sends a follow-up email with a question. Winners don't have to answer).
          *   Decision Defense: Separate Accounts forces the "Two Selves" problem. Single Account assumes one person.
          *   Variant: Single Account (The Table's Total Score). Presupposes identity is continuous regardless of psychological change.

      *   *Constraint 4 (Surrogate):*
          *   Round 3. One student is "The Trustee." They decide how to cash out. They see the Charter and the Pile of Silver. They do not hear the Table's discussion on *why* they want Silver.

      *   *Constraint 5 (Amendment):*
          *   Round 2.5. Table can vote to change Charter.
          *   Conflict: Does the new Charter override the old one? Or does the old one bind because it was made with "Clear Heads"?

  3.  **Drafting the Content:**

      *   *Opening Script:* Needs to be cryptic but engaging. "Protocol Simulation." No bioethics words.
      *   *Materials:* Charters, Link Tokens, Currency Cards, Task Sheets.
      *   *Timeline:* Strict 60 mins.
      *   *Debrief:* Connect "Architect" to Critical Interests (Dworkin), "Builder" to Experiential Interests. "Links" to Psychological Continuity (Parfit). "Trustee" to Surrogate Decision Making.
      *   *Honest Notes:* Gamification risk (winning > learning). The "Dementia Student" risk (triggering). The "Capacity" gap (students are capable, patients might not be).

  4.  **Refining the "Real Change" (Crucial Step):**
      *   I need to ensure the preference reversal is robust.
      *   *Idea:* **The "Annoying Task" Investment.**
      *   Task: Fold paper into specific shapes. It's tedious.
      *   Phase 1: Write down "I value Leisure."
      *   Phase 2: You must fold 50 shapes to earn "Shape Points." You spend 15 mins folding. You are now invested in the Shapes.
      *   Phase 3: Choice. Keep Shapes (and the tedium they represent) or Trade for Leisure (stop early).
      *   *Why:* Effort Justification. "I wouldn't have worked this hard for nothing."
      *   *Facilitator Fix:* If they don't value the shapes, tell them the Shapes determine who gets the exemption.

      *   *Let's polish the "Continuity Score":*
          *   Call them "Coherence Chips."
          *   Start with 5.
          *   Lose 1 every time the task rules change.
          *   Threshold set at start: "If Coherence drops below X, the Charter is void."
          *   The Twist: The tasks that reduce Coherence are the ones that generate the most Value (Points). So to win, you *must* reduce Coherence. But if Coherence is too low, your Charter (which says how to win) is void.
          *   This creates the paradox: To succeed, you must become someone who shouldn't be bound by the success criteria.

  5.  **Finalizing the Scoring/Stakes:**
      *   Stake: **Control of the Debrief.** The winning table chooses the first question asked in the debrief. (Low cost to instructor, high perceived control).
      *   Actually, **Exemption from the mandatory post-session evaluation survey** is better. Students hate these. It costs me nothing (I can still read them if I want, but they think they are exempt). Or **Choice of Break**. Let's go with **Choice of the Final Clinical Vignette.** It shapes the learning.
      *   Architecture: **Separate Accounts.** "Legacy Score" (Phase 1) vs. "Current Score" (Phase 2).
      *   Why: It forces the question "Who are we paying?"
      *   Variant: "Total Table Score." Presupposes the Table is one entity.

  6.  **Writing the Plan:**
      *   *Tone:* Professional, simulation-based, slightly opaque.
      *   *Structure:* Follow the prompt's required sections exactly.
      *   *Check Constraints:*
          1.  Real change? Yes (Effort Justification/Endowment on Task Points).
          2.  Continuity Score? Yes (Coherence Chips).
          3.  Ownership/Stakes? Yes (Separate Accounts, Stake = Choice of Final Vignette).
          4.  Surrogate? Yes (The Trustee Round).
          5.  Amendment? Yes (The Recalibration Round).
          6.  No Bioethics Words until Debrief? Yes.
          7.  Debrief Mapping? Yes.
          8.  Honest Notes? Yes.

  7.  **Review against "Real Change" constraint:**
      *   "Build in a manipulation that produces a genuine reversal in what participants care about during the hour."
      *   My plan: They start valuing "Leisure/Efficiency" (Phase 1). They engage in "Grind" (Phase 2). They accumulate "Grind Points." They end up valuing "Grind Points" because they worked for them.
      *   Is this strong enough?
      *   *Strengthening:* Make the Phase 2 task *create* a new preference.
      *   *Task:* "The Color Market."
      *   Phase 1: "I prefer Blue." (Written in Charter).
      *   Phase 2: You are only given Red tokens to trade. You become expert at trading Red. You build a portfolio of Red.
      *   Phase 3: You can cash out Blue (per Charter) or Red (per Portfolio).
      *   *Why:* Endowment + Competence. You value what you are good at and what you hold.
      *   *Facilitator Fix:* If they still prefer Blue, announce a "Market Crash" on Blue. (A bit heavy-handed).
      *   *Better:* **The "Table Decoration" Endowment.**
      *   Phase 1: Plan the table layout (Minimalist vs. Cluttered).
      *   Phase 2: You are given materials to decorate. You spend 15 mins building a "Nest."
      *   Phase 3: You must clear the table to finish.
      *   *Conflict:* Charter said "Minimalist" (easy to clear). Current Self built a "Nest" (hard to clear).
      *   *This is good.* It's physical. It's attachment.
      *   *Let's combine:* **The "Resource Portfolio."**
      *   Phase 1: Choose a Strategy (Hoarding vs. Sharing).
      *   Phase 2: Play a game where Hoarding wins points. You become Hoarders.
      *   Phase 3: Charter says Share. Current Self wants to Hoard.
      *   *Why it fires:* Competitive instinct + Sunk Cost.
      *   *Facilitator Fix:* If they share anyway, tell them "Hoarding is now required for the Exemption."

      *   *Decision:* I will use the **"Currency/Portfolio" Model.** It's cleaner for scoring.
      *   Phase 1: Choose "Ideal Currency" (Gold or Silver).
      *   Phase 2: Earn "Silver" through effort. (Regardless of choice).
      *   Phase 3: Cash out.
      *   *Wait, Constraint 1 says:* "Do not hand out cards instructing someone to want something different."
      *   If I force them to earn Silver, they might resent it.
      *   *Better:* **The "Task Specialization."**
      *   Phase 1: Write a "Life Plan" (e.g., "Value Art over Math").
      *   Phase 2: Do Math puzzles to earn points. Get good at Math. Feel pride in Math scores.
      *   Phase 3: Choose reward based on Art (Plan) or Math (Current).
      *   *Manipulation:* Competence breeds valuation.
      *   *Facilitator:* If they stick to Art, highlight that they are losing the game.

      *   *Okay, I have a solid plan.* I will write it out now.

      *   *Self-Correction on Stakes:* "Exemption from a task" is requested. I will use **Exemption from the Post-Session Evaluation.** It is real, costs nothing, and students value it.
      *   *Self-Correction on Continuity:* The "Coherence Chips" need to be lost *during* the task.
      *   *Self-Correction on Surrogate:* The Trustee must not hear reasons. I will have them wear noise-canceling headphones or step out. Stepping out is easier.

      *   *Debrief:* Must map mechanics to Dworkin (Critical/Experiential) and Parfit (Continuity).

      *   *Honest Notes:* Address the "Gamer" student and the "Dementia" student. Address the "Capacity" gap (students are lucid, patients may not be).

      *(Self-Correction during drafting)*: Make sure the Opening Script is strictly neutral. No hint of medical ethics.

      *(Final check on Constraint 3)*: "State which of two architectures you chose and defend the choice... give me the alternative as a variant."
      I will choose **Separate Accounts**.

      *(Final check on Constraint 1)*: "Tell me exactly what the manipulation is, why it should fire inside an hour, and what the facilitator does at the tables where it doesn't."
      Manipulation: **Effort Justification & Endowment.** They earn a specific currency through labor. They will value it because they earned it.
      Facilitator Fix: **Artificial Scarcity.** If they don't value it, announce that *only* that currency counts for the prize.

      Let's assemble.
answer: |-
  # Session Title: The Legacy Protocol
  **Time:** 60 Minutes
  **Participants:** 40 Students (8 Tables of 5)
  **Materials:** Envelopes (1 per table), Coherence Chips (5 per table), Currency Cards (Gold/Silver), Task Sheets, "Trustee" Blindfolds (or instruction cards).

  ---

  ## 1. Opening Script (0:00–0:05)
  *(Facilitator stands at the front. No slides. Tone is neutral, administrative.)*

  "Good morning. For the next hour, you are not medical students. You are participants in a resource allocation simulation. Your goal is to maximize your table's score.

  At your table, you will find an envelope. Do not open it yet.

  Inside, you will find materials for three phases. In Phase One, you will define your table's **Charter**. This is a set of instructions for how your resources *should* be managed. You will also set a **Continuity Threshold**.

  In Phase Two, you will work. You will perform tasks to accumulate assets. The rules of the work may change.

  In Phase Three, you will make decisions about how to cash out those assets.

  A few rules:
  1. You cannot discuss the content of your Charter with other tables.
  2. Some rounds require a **Trustee** to decide for the table.
  3. The table with the highest valid score at the end wins **exemption from the mandatory post-session evaluation email.**

  Open your envelopes now. Begin Phase One."

  ---

  ## 2. Roles & Materials (Printable)

  **Table Envelope Contents:**
  1.  **The Charter Card:** A blank card labeled "Phase 1 Directive."
  2.  **Continuity Scale:** A strip of paper numbered 1–5.
  3.  **Coherence Chips:** 5 physical tokens (poker chips or colored paper).
  4.  **Currency Pack:** 20 "Silver" cards, 0 "Gold" cards.
  5.  **Task Sheets:** 3 distinct puzzles (Logic, Memory, Dexterity).
  6.  **Trustee Mask:** A card that says "DO NOT LISTEN TO REASONS."

  **Facilitator Kit:**
  *   Timer.
  *   "Market Update" cards (for Manipulation Fix).
  *   Scoreboard (Whiteboard).

  ---

  ## 3. Minute-by-Minute Timeline

  ### Phase 1: The Architects (0:05–0:15)
  *   **Task:** The table must agree on a **Charter**. They must choose one of two "Value Systems":
      *   *System A (Gold):* "We value long-term stability. We prefer Gold currency."
      *   *System B (Silver):* "We value immediate liquidity. We prefer Silver currency."
      *   *Note:* The choice is abstract. Neither is objectively better yet.
  *   **Continuity Threshold:** They place their 5 Coherence Chips in the center. They must circle a number on the Continuity Scale (1–5).
      *   *Rule:* "If your Coherence Chips drop below this number, your Charter is void."
  *   **Output:** They sign the Charter Card and place it face down in the center of the table.
  *   **Facilitator:** Circulate. Ensure they understand the Threshold rule.

  ### Phase 2: The Builders (0:15–0:35)
  *   **Round 1 (0:15–0:25):** **The Grind.**
      *   Tables receive Task Sheet 1 (e.g., complex logic puzzles).
      *   **Payment:** They are paid *only* in **Silver** cards for completed tasks. (Even if they chose Gold in Phase 1).
      *   **Cost:** Every 5 minutes, the Facilitator announces a "System Update." Tables must remove 1 Coherence Chip from the center.
      *   *Psychological Manipulation:* **Effort Justification.** They are working hard for Silver. They are becoming competent at earning Silver. They are losing Coherence.
  *   **Round 2 (0:25–0:35):** **The Amendment.**
      *   Facilitator announces: "You may now revise your Charter."
      *   Tables can flip their Charter from Gold to Silver.
      *   **Cost:** Revising costs 1 additional Coherence Chip.
      *   *Conflict:* If they revise, they admit their Phase 1 self was wrong. If they don't, they are working for a currency they said they didn't want.
      *   *Facilitator Fix (Constraint 1):* If a table is not valuing Silver (e.g., they are ignoring the tasks), announce a "Market Update": *"Attention. Only Silver cards will count toward the Exemption Prize."* This forces the valuation shift via external stakes.

  ### Phase 3: The Crisis (0:35–0:50)
  *   **Round 3: The Trustee (Surrogate Decision)**
      *   One student is selected as the **Trustee**. They put on the "Trustee Mask" (or turn their chair around).
      *   The Table discusses their current state: "We have 20 Silver, 0 Gold. We have 2 Chips left. Our Charter says Gold."
      *   The Trustee turns back. They see the Chips, the Currency, and the Charter. They do **not** hear the discussion.
      *   **Decision:** Trustee chooses: Cash out per Charter (Gold = 0 points) or Cash out per Current Assets (Silver = 20 points).
      *   *Constraint:* If Chips are below Threshold, Charter is void (Silver counts). If Chips are above Threshold, Charter binds (Gold counts, Silver = 0).
  *   **Round 4: The Final Tally**
      *   Tables calculate scores based on the Trustee's decision and the Chip Threshold.
      *   Facilitator collects scores.

  ### Phase 4: Tabulation & Debrief (0:50–1:00)
  *   **Tabulation (5 mins):**
      *   Facilitator writes scores on the board.
      *   **Expected Pattern:** Most tables will have dropped below their Threshold (due to forced Chip removal) but will *argue* they should still get Silver points.
      *   **If Pattern Fails:** If tables rigidly honor the Charter despite having no Silver, highlight the "waste." If they ignore the Charter despite high Chips, highlight the "betrayal."
  *   **Debrief (5 mins):** (See Section 6).

  ---

  ## 4. Scoring Rules & Architecture

  **Chosen Architecture: Separate Accounts**
  *   **Architect Account:** Points awarded only if the Charter is honored (e.g., holding Gold).
  *   **Builder Account:** Points awarded for actual holdings (e.g., holding Silver).
  *   **The Rule:** You can only cash out *one* account.
  *   **Defense:** This architecture forces the identity split. It makes visible the conflict between the "Self that Planned" and the "Self that Lives." It presupposes that the earlier self and later self have distinct moral claims that may not be reconcilable into a single sum.
  *   **Variant (Single Account):** All points go into "Table Score." Charter bonuses are just multipliers.
      *   *Presupposition:* This assumes psychological continuity is binary (you are either the same person or not). It hides the friction of divergence.

  **The Stake:**
  *   **Winner:** The table with the highest valid score chooses **exemption from the post-session evaluation email.**
  *   **Cost to Instructor:** Zero (evaluation data is nice but not critical; exemption creates buy-in).
  *   **Cost to Students:** High (nobody wants extra admin work).

  ---

  ## 5. Facilitator Notes on Constraint 1 (Real Change)

  **The Manipulation:** **Effort Justification & Endowment.**
  *   **Why it fires:** Cognitive dissonance theory suggests that when people expend effort to acquire something (Silver cards), they unconsciously inflate the value of that thing to justify the effort. Within 20 minutes of "grinding" for Silver, they will feel ownership over it.
  *   **The Reversal:** In Phase 1, Silver is abstract. In Phase 2, Silver is "what we worked for."
  *   **If it doesn't fire:** Some tables may treat it as a purely abstract game and not feel the attachment.
  *   **Facilitator Fix:** At minute 0:20, walk to the struggling table. Say quietly: *"I notice you have a lot of Silver. Just so you know, the Exemption Prize is tied to asset liquidity."* This artificially creates the stake, mimicking how biological needs (hunger, comfort) force valuation changes in patients.

  ---

  ## 6. The Debrief (Mapping Mechanics to Concepts)

  *(Facilitator drops the simulation tone. Writes three words on the board: **Continuity, Authority, Interests**.)*

  "You just felt a conflict. Let's name it."

  **1. The Charter vs. The Grind (Critical vs. Experiential Interests)**
  *   **Mechanic:** Phase 1 Charter vs. Phase 2 Silver Accumulation.
  *   **Concept:** Ronald Dworkin's distinction.
      *   The **Charter** represents **Critical Interests**: What makes your life good *as a whole* (coherence, long-term values).
      *   The **Grind** represents **Experiential Interests**: What feels good *now* (comfort, avoiding loss of what you hold).
  *   **The Problem:** When the later self (Builder) no longer cares about the Critical Interests of the earlier self (Architect), honoring the Charter feels like harming the Builder.

  **2. The Coherence Chips (Psychological Continuity)**
  *   **Mechanic:** Losing chips during the task.
  *   **Concept:** Derek Parfit's **Psychological Continuity**.
  *   **The Threshold:** You set a line where "I am no longer me."
  *   **The Failure:** You noticed the threshold didn't help. Whether you had 3 chips or 1, the conflict was the same. Continuity is a spectrum, not a switch. In dementia, the chips drop slowly. At what number do we stop listening to the Charter?

  **3. The Trustee (Surrogate Decision Making)**
  *   **Mechanic:** The student who couldn't hear reasons.
  *   **Concept:** **Substituted Judgment vs. Best Interests.**
  *   **The Tension:** The Trustee saw the Charter (Substituted Judgment: "What would they want?") and the Silver (Best Interests: "What helps them now?"). Without knowing *why* the table wanted Silver, the Trustee had to guess which 'self' mattered more.

  **4. The Amendment (Authenticity)**
  *   **Mechanic:** Changing the Charter mid-game.
  *   **Concept:** **Authenticity.**
  *   **The Question:** If you change your mind because you are tired (low Chips), is that a valid change? Or is it a symptom of the degradation? In clinical practice, is a patient's refusal of food a new preference, or a symptom of depression/dementia?

  **Technical Vocabulary (Now introduced):**
  *   **Advance Directive:** The Charter.
  *   **Capacity:** The Coherence Chips.
  *   **Precedent Autonomy:** The Authority of the Architect.
  *   **Current Autonomy:** The Authority of the Builder.

  ---

  ## 7. Two Honest Notes

  **1. Predictable Failure Modes**
  *   **The Gamers:** Some tables will ignore the "feeling" and optimize for the Exemption. They will treat the Chips as a resource to be managed, not a metaphor for selfhood.
      *   *Handling:* In the debrief, call them out gently. *"Table 3, you cashed out Silver despite having 5 Chips. You prioritized the win over the rule. That is a rational choice in a game, but in a clinic, that is called overriding a competent patient's prior wishes. How does that sit with you?"*
  *   **The Personal Memory:** One or two students have seen dementia. The "Chip Loss" might feel like a trivialization of a grandparent's decline.
      *   *Handling:* Acknowledge this explicitly. *"For some of you, this game is abstract. For others, it is a memory. The game cannot capture the grief of that loss. It only captures the structural conflict of authority. If you felt anger at the rules, that is data. Keep that."*

  **2. The Limitation of the Design**
  *   **The Substitution:** This design stakes **snacks and minutes** (evaluation exemption). It leaves the later self (the students) **fully capable**.
  *   **What it Buys:** It allows them to feel the *injustice* of being overruled without the confounding variable of actual incapacity. They know they are sane, yet they are being bound by a past rule.
  *   **What it Cannot Reproduce:** It cannot reproduce the **opacity** of the clinical case. In the game, the Builder *knows* why they want Silver. In dementia, the patient often cannot articulate *why* they refuse care. The "Trustee" in real life rarely has the clear view your Trustee had.
  *   **Bridging to Clinic (Final 5 Minutes):**
      *   Do not lecture. Ask one question: *"In the game, the Builder could speak. In the ward, the patient might scream, but not explain. If you couldn't ask your Table why they wanted Silver, would you have honored the Charter? Turn to your neighbor. One minute."*
      *   This hands the unresolved tension back to them, moving from the clean simulation to the messy reality without solving it for them.
