  She found proof of care in the structure of the cosmos. She read that the expansion of space and the pull of gravity hold a specific balance, and she told me, often, that this balance proved a mind was behind it. She held this certainty gently, but she held it firmly.

  Here is the truth between us: I spent fifteen years studying these forces, and I never found the proof she saw, yet she never asked me to pretend I had.

  She was a precise woman. She trusted the numbers she read in a 1982 magazine article more than the data I brought home from the university, and honestly, I suspect she would have checked my math against that magazine before she signed off on this building's blueprint.

  But her point was not about the math. It was about the looking. She wanted you to stand under this dome and feel the weight of the dark. She wanted you to know that the ground beneath you is moving, that the light arriving here left its source before you were born, and that you are here to witness it. She wanted you to understand that you live in a large place. In a town this remote, the horizon often feels like a wall. She wanted this dome to be a hole in that wall.

  I work on dark energy. I measure how the universe pushes itself apart. I do not know why the numbers are what they are. I do not know why there is something rather than nothing. I only know that there is. There are no other universes in this room. There is only this one. It is vast. It is old. It contains us. It contains questions.

  My grandmother believed the questions had a single answer. I believe the questions are the gift. We disagreed about the source of the light, but we agreed entirely about the necessity of turning on the lamp. She gave you this place so you could ask your own questions. She wanted you to see that you are small, and therefore connected to everything else that is small.

  When the projector starts, you will see stars that no longer exist. You will see galaxies rushing away. You will see the balance she loved. Whether you see intention in that balance or simply fact, the wonder remains. The sky is open. The building is ready. The question is yours.

  To the board who managed her funds, to the women who carried her meals, to the neighbors who watched her save: this dome is her gratitude made visible. She loved this town. She loved the sky. She loved the space between them where we stand together. This project required patience. It required faith in people she would never meet. She trusted you with her savings. She trusted you with her hope.

  Thank you.
