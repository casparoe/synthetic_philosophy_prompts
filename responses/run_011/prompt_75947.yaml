answer: |-
  **To:** The Board of Trustees, Calderwood Trust
  **From:** [Your Name]
  **Date:** October 15
  **Re:** Recommendation on Halden Centre Core Grant Renewal

  I recommend that the board vote to **Renew Conditionally**. We should authorize a two-year bridge grant rather than the proposed five-year core renewal, contingent on the Centre pre-registering three novel predictions derived from the Year Five "perceived observation" auxiliary before funds are released. This recommendation stems from a strict Lakatosian appraisal of the programme's current trajectory, tempered by the Trust's specific mandate for long-horizon inquiry.

  I must begin with a personal caveat. I make my living constructing narratives that feel inevitable in hindsight; I am professionally susceptible to a satisfying arc. The Director is the finest raconteur I have met in fifteen years of trustee dinners. Where the story he tells is carrying weight the evidence cannot bear, I want that named specifically. My recommendation is an attempt to discipline my own susceptibility to his narrative coherence by adhering rigidly to the logic of scientific research programmes.

  Regarding the Lakatosian framework, the first hard question is individuation. Does the "lab as audience" auxiliary belong in the protective belt, or does its necessity indicate the hard core ("no internalized norms") is false? I adopt the Director's individuation: the core remains intact, and the auxiliaries belong in the belt. To rule otherwise now would be to declare the programme dead rather than degenerating, shutting down inquiry prematurely. The hard core is coherent; the issue is whether the belt adjustments are theoretical progress or merely immunizing stratagems.

  This leads to the second question: how we appraise a shift. Is a shift progressive based on excess content at the moment it is made, or does later corroboration suffice? I argue the board must treat **excess content at the moment of the shift** as decisive. If we allow later corroboration to redeem an auxiliary constructed solely to absorb a known anomaly, we render the hard core unfalsifiable. Any anomaly can be saved if we are permitted to build a bridge to it after the fact and then test the bridge's strength.

  Applied consistently, this rule grades both recent auxiliaries against the Centre. The Year Three glyph auxiliary (cultural legibility) was explicitly untestable when introduced. It absorbed the failure of the replications without predicting new facts. That is a degenerating problemshift. The Year Five observation auxiliary is more sophisticated but structurally identical. The measure of perceived observation was constructed *after* the anomaly of anonymous cooperation was documented. That it mediated the effect is accommodation, not prediction. It explains what we already know rather than risking a claim about what we do not. Under a strict Lakatosian verdict, the programme is currently degenerating. The physicist trustee is logically correct: the Centre has migrated from predicting novel facts to absorbing anomalies.

  However, this verdict does not compel a "Do Not Renew" vote, which brings me to the historian trustee's objection. The historian argues that methodology yields verdicts only retrospectively and that great programmes often appear degenerating before a breakthrough. I find this persuasive, but only with a caveat. A long leash is justified only if the positive heuristic remains active—is the programme generating new tools, models, or questions, even if the core is under stress? The Centre is training the field's strongest methodologists. This is evidence of a living heuristic, even if the core theory is stalling. The historian is right that a thirty-year horizon trust has no standing to act as an instantaneous judge, but patience is not synonymous with unconditional subsidy. We can grant time without granting immunity from falsification.

  This necessitates addressing the fourth point: the methodological-training benefit. Can this enter the appraisal of the research programme? Strictly speaking, no. Admitting institutional usefulness into the appraisal of theoretical progress collapses the distinction between a programme's heuristic power and its mere sociological utility. A theory does not become truer because it produces skilled graduates. However, the Trust's mission is to fund research *in the behavioural sciences*, not merely to settle metaphysical truths. If the Centre produces human capital that advances the field regardless of the core thesis's validity, that is a valid secondary criterion for the Trust, provided it does not mask theoretical stagnation. We must not fund a degenerating theory *because* it trains students; we must fund the training *while* demanding the theory prove itself.

  Therefore, my recommendation is **Renew Conditionally**. We acknowledge the historian's point by providing continued support, but we honor the physicist's concern by refusing to fund a degenerating problemshift without constraints. The two-year term acknowledges the long horizon required for behavioural science while imposing a deadline for progressivity. The condition—pre-registered novel predictions using the new observation measure—forces the Centre to move from accommodation to prediction. If the "lab as audience" auxiliary is truly progressive, it will generate excess content beyond the anomaly it saved. If it cannot, the programme will have exhausted its positive heuristic, and we will have our verdict without having stifled a potential revolution prematurely.

  I am voting this way because I respect the Director's intellect but distrust his narrative. He has constructed a story where every failure is a hidden success, every anomaly a confirmation in disguise. It is a beautiful story. It is also the exact shape of a degenerating programme. By conditioning renewal on novel prediction, we test whether the story describes the world or merely describes itself.

  If the Centre meets the pre-registration conditions and confirms the predictions, I will support a full five-year renewal in two years. If they fail, or if the auxiliaries remain untestable at the moment of introduction, I will vote to terminate the core grant. This path allows us to be patrons of science without becoming patrons of dogma.
