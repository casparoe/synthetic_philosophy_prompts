      To answer it, we must face the category problem. Some of you argue violence is not a stable thing. A killing in 1400 is not a killing in 2000. One was discipline, one is murder. One victim counted, one did not. You are right. We cannot count violence directly. We count records of events we decide to call violence. We cannot compare the moral weight of a duel to a drone strike. But we can compare bodily events. Once we fix a population, a time, and a class of physical harm, there are facts. The hard work is not finding the facts. It is choosing which facts track what we mean by safety.

      This brings us to rates and totals. If the world population grows, absolute suffering can rise while individual risk falls. Both are true. Both matter. This program will lead with rates per head. We are measuring risk to a person. But this costs us. It hides the scale of absolute pain. We will acknowledge that cost. We will not let the average erase the multitude.

      Consider who counts as a victim. Centuries ago, only certain deaths were recorded. Today, we count harms to women, children, and workers that were once ignored. When we widen the class of people counted, the rate of violence might appear to rise, even if actual safety improves. Or, the rate falls because we protect more people. This is not a data artifact. It is a moral change. We are counting more humanity. That complicates the trend line. It does not invalidate it.

      Let me give you one death. A household servant in 1750. He falls from a ladder. He dies. The master records it as an accident. The parish clerk records it as a visitation of God. A modern coder might see neglect. A historical coder might see misadventure. Both classifications are defensible in their context. Neither is the whole truth. Our job is to record both classifications, not to pick one and hide the other.

