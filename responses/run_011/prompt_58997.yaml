answer: |-
  Welcome everyone. It is rare to see so many different ways of knowing the world in one room. Half of you trust aggregates. Half of you trust contexts. And four of you trust us to deliver a specific headline. I can confirm the coffee is the only thing here that is definitely hot.

  Our foundation partners have drafted a line for their annual report. They state that for the first time in human history, a person alive today faces less risk of violence than at any point in our species' past. They expect our program to make this true. I cannot stand here and call that sentence false. That would embarrass the people signing our grants. Their hope is moral, and it is shared by many in this room. But I cannot let it stand unqualified. That would insult the researchers who know the records are broken. So we will treat this sentence not as a finding, but as a hypothesis. It is the question we are testing, not the answer we are printing. We will work to make it assertible, which means we must define what makes it true.

  To test it, we must face the category problem. Some of you argue that violence is not a stable thing across centuries. A killing in 1400 is not a killing in 2000. One was discipline, one is murder. One victim counted, one did not. You are right. We cannot count violence directly. We count records of events we decide to call violence. We cannot compare the moral weight of a duel to a drone strike. But we can compare bodily events. My view is this. Once a population, a period of exposure, and a class of bodily events are fixed, there are facts about those events. The hard work is not finding the facts. It is choosing which facts track what we mean by safety. This is the bridge between us. The quantifiers need the fixed class to count. The critics need the fixed class to be argued. We can do both.

  This brings us to rates and totals. If the world population grows, absolute suffering can rise while individual risk falls. Both are true. Both matter. This program will lead with rates per head. We are measuring risk to a person. But this costs us. It hides the scale of absolute pain. A falling rate can accompany rising total deaths. We will acknowledge that cost. We will not let the average erase the multitude. We choose rates because risk is what matters to a life lived. But we will report totals alongside them. We must show the weight of the whole.

  Consider who counts as a victim. Centuries ago, only certain deaths were recorded. Today, we count harms to women, children, and workers that were once ignored. When we widen the class of people counted, the rate of violence might appear to rise, even if actual safety improves. Or, the rate falls because we protect more people. This is not a data artifact. It is a moral change. We are counting more humanity. That complicates the trend line. It does not invalidate it. A widening of the class can coincide with a falling rate because recognition leads to protection. We must explain this clearly. Otherwise, the numbers will look like noise.

  Let me give you one death. A household servant in 1750. He falls from a ladder. He dies. The master records it as an accident. The parish clerk records it as a visitation of God. A modern coder might see neglect. A historical coder might see misadventure. Both classifications are defensible in their context. Neither is the whole truth. Our job is to record both classifications, not to pick one and hide the other. This single record contains the whole problem. We must hold both truths at once.

  So, what is our commitment for the next three days? We will not seek consensus on the past. We will seek transparency on our choices. When we exclude a record, we will say why. When we group two events together, we will say what binds them. The counters must admit where the numbers are thin. The critics must admit where the comparison is possible. We will document our exclusion criteria. We will argue over our definitions openly.

  We are not here to prove the world is better. We are here to measure the harm so clearly that anyone can judge for themselves. If we do that, the board gets their truth, the historians get their rigor, and the victims get their count. Let us begin.
