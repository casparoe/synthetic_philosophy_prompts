  Subject: Re: Judy Benjamin argument specs

  Hi there,

  It sounds like you and Marcus have hit the exact nerve that makes the Judy Benjamin problem a classic in formal epistemology, and given that you are building a public health forecasting tool, the stakes are higher than just winning a debate. You need a rule that is defensible when lives or resources are on the line, which means you cannot rely on intuitions alone. You asked for a spec, so I will lay out the requirements for an adequate updating rule in this context, explain the tension between them, and then briefly evaluate the contenders you mentioned.

  To start with the baseline, any updating rule must satisfy Coherence, meaning the output must be a valid probability distribution where probabilities sum to one and remain non-negative. This is non-negotiable because incoherent probabilities expose you to Dutch books and make your forecasting model mathematically unusable. The second requirement is Constraint Satisfaction, which demands that if you treat the expert report as a hard constraint, your posterior must reflect that constraint exactly, so if the input says the conditional probability is three-quarters, your new probability for A given North must be three-quarters. This is also non-negotiable if you define the input as a strict constraint, though as we will see, defining it that way is itself a choice. Beyond these basics, the requirements become contested. The first contested requirement is Complement Stability, which is your intuition that learning about the North should not change the probability of the South. The consideration behind this is that the information is specifically about the partition within the North, so there is no evidential link to the South. The second contested requirement is Limit Consistency, which is Marcus's intuition that if the conditional probability reported approaches one, the update should approach standard conditionalization on the material conditional. The consideration here is that conditional information should not behave fundamentally differently from propositional information when the uncertainty vanishes. A third contested requirement is Order Independence, which demands that if you receive two separate conditional reports, updating on them in sequence should yield the same result regardless of the order. The consideration is that the evidence itself hasn't changed, so the timing of ingestion shouldn't alter the final belief state.

  When we classify these, Coherence and Constraint Satisfaction are non-negotiable for a functioning model. Complement Stability, Limit Consistency, and Order Independence are shibboleths. Complement Stability is the shibboleth of the Judy Benjamin camp, while Limit Consistency is the shibboleth of the standard Bayesian camp. Here is the impossibility result you suspected: you cannot satisfy Complement Stability and Limit Consistency simultaneously. If you demand that learning a conditional constraint leaves the complement's probability unchanged, you diverge from standard conditionalization when the conditional probability becomes one, because standard conditionalization on a material conditional always increases the probability of the antecedent's negation. Conversely, if you demand Limit Consistency, you must accept that learning about the North can change the probability of the South. Furthermore, if you add Order Independence to the mix, the situation worsens, as most rules that satisfy Complement Stability fail to commute when updates overlap.

  The single requirement that does the most damage to candidate rules is Order Independence. While the tension between Stability and Consistency knocks out specific camps, the demand for Order Independence eliminates almost all proposed solutions for non-propositional updating, including maximum entropy methods and most geometric averaging rules. It is notoriously difficult to design a rule that handles probabilistic constraints and remains commutative across sequential updates. However, for your specific public health application, there is a practical requirement that might be even more destructive to standard theoretical rules, which is Sensitivity to Source Reliability. Since you noted the experts are honest but not especially reliable, treating their reports as hard constraints is likely inappropriate. Most philosophical updating rules assume the input is certain. A rule that requires you to model the expert's reliability as a likelihood rather than setting the posterior constraint to exactly the reported value will knock out standard conditionalization, standard Judy Benjamin solutions, and vanilla maximum entropy, forcing you toward a hierarchical Bayesian approach instead.

  Regarding the specific cases you raised, the spec needs to handle them explicitly. When the conditional testimony concerns an antecedent your prior has ruled out entirely, standard conditionalization is undefined, so an adequate rule must specify a limit behavior or a mass-shifting mechanism to allow learning to happen even from impossible starting points. When a second report comes in with a different antecedent, you must decide if Order Independence is a legitimate demand. Given the impossibility results, a good rule should own up to order dependence rather than hiding it, or you must aggregate the reports before updating. On the question of treating the report as a flat constraint versus evidence from a fallible source, the requirements should favor the latter for your use case. Treating it as a flat constraint assumes the expert is infallible regarding the conditional probability, which contradicts your description of them. Finally, when the conditional assigns weight to something your prior gave zero probability inside the antecedent, the rule must allow for the creation of new possibility mass, which again standard conditionalization cannot do without modification.

  Now briefly looking at how the contenders stack up against this list. The maximize-entropy style move satisfies Constraint Satisfaction and Complement Stability, making it align with your intuition, but it fails Order Independence and struggles with Limit Consistency, meaning it behaves differently than standard Bayesian updating when certainty is reached. Van Fraassen's reflection-based answer supports Complement Stability and offers a strong theoretical defense for why your prior odds outside the antecedent should remain fixed, but it is complex to implement and also faces challenges with sequential updates. Marcus's conditionalize-on-the-material-conditional move satisfies Limit Consistency and Coherence but fails Constraint Satisfaction for probabilistic inputs since it treats the input as a proposition rather than a probability constraint, and it violates Complement Stability, which is why your intuition rebels against it. The plain keep-the-odds-and-rescale-inside-the-antecedent rule is essentially the Judy Benjamin solution; it satisfies Complement Stability and Constraint Satisfaction but fails Limit Consistency and Order Independence, leaving you vulnerable to the charge that you are ignoring the logical implications of the information when it approaches certainty.

  For your public health model, I recommend you do not treat the expert statements as hard constraints. Instead, treat the expert testimony as evidence about the world that updates your confidence in the expert's reliability, which then updates the model. This avoids the impossibility results of the hard-constraint cases because you are simply conditionalizing on the proposition that the expert made the statement. If you must treat them as hard constraints for simplicity, the maximum entropy approach is the most defensible for preserving ignorance outside the scope of the evidence, but you must document that sequential updates may depend on order. You should tell Marcus that his demand for Limit Consistency is a valid theoretical preference but not a non-negotiable requirement for rationality, while you should admit to yourself that your demand for Complement Stability is a shibboleth that sacrifices logical continuity for informational minimalism.

  Hope this helps you settle the argument and build the tool.

  Best,

  [Your Name]
