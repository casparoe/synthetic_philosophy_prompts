  2.  **Character Conception:**
      *   **Egalitarian (TELIC):** Believes equality is intrinsically good. Even if leveling down makes no one better off, it's better in *one respect*. Needs to defend this against the "insane" charge.
      *   **Prioritarian (PRIOR):** Believes benefits matter more the worse off the recipient is. Doesn't care about equality for its own sake. Needs to defend against the measurement objection and the "impersonally better" critique.

