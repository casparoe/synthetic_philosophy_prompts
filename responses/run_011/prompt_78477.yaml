  The chain across the trailhead gate was already padlocked, though the sun hadn't fully dipped below the ridge. Elena kicked at the gravel, watching the dust settle. Marcus leaned against his sedan, arms crossed, watching her.

  "It's the symbol, Marcus," Elena said. "That gate. It says this beauty is for them, not us. If we close it, let it go wild, we remove the insult. Even if no one hikes there anymore."

  Marcus shook his head. "This is the Levelling Down Objection in a flannel shirt. If you close Ridgeline, the rich neighbors lose their view and their property value. The South Side gains nothing but a theoretical sense of justice. No actual person's life goes better. How can you call that an improvement?"

  "Because equality is intrinsically valuable," Elena said. "I'm not saying it's better *all things considered*. The rich are worse off, so overall welfare drops. But I am saying it's better in one respect: the respect of equality. To deny that is to say inequality doesn't matter unless it hurts someone."

  "It's a weird respect," Marcus countered. "You're claiming an outcome is 'better' where nobody is better off. That's empty. It's impersonal goodness without a person to hold it. My view is simpler: benefits matter more the worse off the recipient is. If closing this park doesn't benefit the South Side, my priority weight is zero. Why complicate ethics with ghostly values?"

  "Because 'better in one respect' isn't weaseling," Elena insisted. "It's precision. I can say closing the park is morally required by equality, but overridden by welfare. But you? You have to say equality counts for *nothing*. If I told you we could level up the South Side by taxing the rich, you'd agree. But if I told you we could only level down, you'd say there's no moral gain at all. That implies inequality is only bad instrumentally."

  "It is only bad instrumentally," Marcus said. "Inequality itself doesn't hurt. Poverty hurts. Exclusion hurts."

  Elena turned from the gate. "What if exclusion *causes* the poverty? There's a rumor the planning commission is sitting on. Ridgeline isn't just a park. It's the buffer. The high maintenance costs justify the high property taxes in this zone, which lock the school boundaries. This hill keeps the South Side poor by keeping the tax base segregated."

  Marcus paused. "If you close it... the property values here drop. The tax base equalizes. The school lines get redrawn."

  "Exactly," Elena said. "South Side kids get better schools. Residents get better services. Closing Ridgeline actually makes the worse off better off."

  Marcus uncrossed his arms. "Then I support closing it. Immediately. Because the South Side gains a massive benefit, and since they are worse off, that benefit gets high priority weight. The loss to the rich neighbors is weighted less. The math works."

  "See?" Elena said. "We agree on the action. But do we agree on the reason?"

  "We agree on the outcome," Marcus corrected. "But this doesn't save your view. It just shows that whenever Levelling Down actually helps someone, our views converge. You say it's good because of equality *and* welfare. I say it's good because of welfare. The disagreement only exists in a vacuum where hurting the rich helps no one. Does that vacuum exist? If not, your 'intrinsic value of equality' is a ghost."

  "It's not a ghost," Elena said. "It's a safeguard. What if the planning commission is wrong? What if the schools don't change? If we close this and *nobody* gains, I still say we removed a moral stain. You say we committed a waste. My view explains why the public felt justice in their bones when they shouted 'nobody should have it.' Yours calls them irrational."

  "My view calls them confused," Marcus said. "But here's the problem with your safeguard. It's stable. Mine isn't. You know the objection about my scale."

  Elena nodded. "The zero-point problem."

  "To calculate priority weights," Marcus said, "I need a cardinal scale of well-being. I need to know not just that Person A is worse off than Person B, but *how much* worse, and where zero is. If I shift the zero point—if I decide well-being starts at subsistence versus non-existence—my priority weights change. I could flip my recommendation on this park just by changing how I measure welfare. Your view uses ratios. A is twice as well off as B. Shift the zero, the ratio stays the same. Your view is stable; mine is sensitive to measurement."

  "But your view tracks what matters," Marcus argued. "The absolute depth of suffering matters. If someone is at zero versus minus ten, that's different than ten versus twenty. Ratios hide the absolute stakes. Yes, I need a scale. Ethics needs metaphysics. You're offering a free lunch—stable judgments without defining the currency of human life."

  "And I'm offering a compass that doesn't spin when you change the map," Elena shot back. "But let's go back to the convergence. You said our views only diverge in that vacuum. If closing the park helps the South Side, we both close it. So why does the committee care about our debate?"

  "Because the next decision won't have the twist," Marcus said. "Suppose we have money to either fix the South Side courts or maintain Ridgeline. If we fix the courts, inequality drops. If we maintain Ridgeline, inequality stays. You might prefer maintaining Ridgeline if it keeps the rich from losing out, provided the inequality gap doesn't widen? No, wait. You'd prefer the courts. But suppose we have a choice between giving a benefit to the middle class or the poor. I say poor, always. You say... whatever reduces the ratio."

  "I say equality matters," Elena said. "But here's where I need you to be honest. If the South Side gains *nothing* from closing this park... truly nothing. No school changes, no property shifts. Just a closed gate and angry rich neighbors. Do you admit there is *no* moral gain? Not even a tiny one?"

  "None," Marcus said. "Nothing happened to improve a life."

  "Then we know where we stand," Elena said. "You think morality is entirely person-affecting. I think morality includes the shape of the distribution itself."

  "But if the distribution shape never matters unless it affects a person," Marcus said, walking toward the driver's side door, "then does the shape matter at all? Or is it just a heuristic for finding the people who need help?"

  "If it's just a heuristic," Elena said, "why does it feel like justice when the rich lose their exclusive view? Why does the crowd nod?"

  "Because they think it helps them," Marcus said. "They think it breaks the barrier. If they knew it was pure leveling down, half that room would change their minds. You're betting on their confusion."

  "And you're betting on a scale you can't define," Elena said. "If you shift your zero point tomorrow, do you still close the park?"

  "Yes, because the South Side gain is massive regardless of the scale," Marcus said. "But you're right. In the edge cases, my view wobbles. Yours doesn't. But yours demands sacrifices nobody can justify."

  "Equality demands sacrifice," Elena said. "Prioritarianism demands calculation."

  They stood in the silence of the parking lot. The gate remained locked. The hill loomed above them, green and inaccessible.

  "So," Marcus said, opening his car door. "We vote to close it. Because of the schools."

  "We vote to close it," Elena agreed. "Because of the schools. And because of the gate."

  "Then the record should show we agree on the motion," Marcus said.

  "And disagree on the world," Elena said.

  Marcus nodded, getting in. "That's usually how it is."

  He started the engine. Elena watched the taillights fade down the hill, toward the South Side, where the streetlights were flickering again. She turned back to the locked gate. It was still better in one respect, she thought. Even if no one was there to see it.
