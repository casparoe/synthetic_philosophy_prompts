  ### Part 1: Prediction for the Waiter Case

  Based on your supervisor's history, here is how he will code the waiter's utterance ("It's warm" re: steaming soup):

  *   **(a) Is there an implicature that the soup isn't hot?** **Yes.**
  *   **(b) Tag:** **G** (Generalized).
