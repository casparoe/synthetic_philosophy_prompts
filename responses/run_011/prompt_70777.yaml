  ### Part 2: Candidate General Rules

  Looking at the eleven verdicts, four distinct principles are driving his coding.

  **1. The Scalar Default Rule (Neo-Gricean Q-Principle)**
  Lexical items on a Horn scale (e.g., *some, or, warm*) generate a Generalized (G) implicature denying the stronger term in unembedded, positive assertions.
  *   *Supported by:* Item 1 ("Some" → not all), Item 3 ("Or" → not both), Item 4 ("Either" → speaker ignorance).
  *   *Constrained by:* Item 5 (Synonyms like *rich/wealthy* do not form a scale), Item 2 (Embedding under *if* blocks the inference).

  **2. The Relevance Heuristic (Gricean R-Principle)**
  Inferences required to make an utterance contextually relevant, particularly indirect answers, are coded as Particularized (P) implicatures. These do not rely on lexical scales.
  *   *Supported by:* Item 8 ("6am shift" → No), Item 9 ("Store closed" → No milk).
  *   *Note:* Item 7 (Conditional Perfection) likely falls here or as a specific conditional default, but Items 8 and 9 are the clearest evidence for P-tagging.

  **3. The Cancelability Diagnostic**
  An inference is only coded as a conversational implicature (G or P) if it can be explicitly cancelled without creating a semantic contradiction.
