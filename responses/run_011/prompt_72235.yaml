      *Refinement:* If they sit, their group loses points. They are free to leave the room or sit silently. This mirrors the "step out" option Major Trapp gave.

      *Prediction:* "How many people in this room will choose to sit down when offered?"
      *Outcome:* Likely 0 or 1.
      *Gap:* Students usually predict higher dissent.

      *Debrief:* Connect the "Group Score" to "Unit Cohesion." Connect "TA Authority" to "Major Trapp." Connect "Boring Task" to "Routinization."

      *Limitations:* The task isn't killing people. The stakes aren't death. The ideology isn't present.

      *Recovery:* If everyone laughs, stop and ask "Why is this funny? Because it's absurd? That's part of the point." If someone opts out, thank them for showing it was possible.

