      *   Real opt-out? Yes.

  9.  **Final Polish:**
      *   Ensure the distinction between "willing" (Goldhagen) and "compliant" (Browning) is clear in the debrief.
      *   Make sure the "cost" of opting out is social (group score), not academic (individual grade), to mimic the "letting down the comrades" aspect of Reserve Police Battalion 101.
      *   Check timing. 75 minutes is tight for a deep debrief. Need to prioritize the discussion.

      *Self-Correction on Task:* Transcribing is too quiet. Maybe something slightly more active but still tedious. *Sorting a deck of cards into a specific order.* No, writing is easier to control. Let's stick with writing but make it public. *Writing numbers on a whiteboard.* Actually, *standing while completing a worksheet* adds physical discomfort without harm. Let's go with "Stand while completing the Worksheet." Sitting = Opting out.

