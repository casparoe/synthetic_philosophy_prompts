      *   **Task:** Design a 75-minute section activity for 18 sophomores.
      *   **Topic:** Browning (*Ordinary Men*) vs. Goldhagen (*Hitler's Willing Executioners*).
      *   **Core Problem:** Students (and the TA's brother-in-law) conflate "not opting out when allowed" with "willingness/ideological conviction." The TA needs to demonstrate the situationist point (gap between formal refusal availability and actual refusal) without trivializing the Holocaust.
      *   **Specific Mechanic:** Squads complete a trivially annoying task under a token/status economy. Opting out is permitted but costs the squad its rating. Prediction round beforehand (private estimate of opt-out rate).
      *   **Requirements:**
          *   One sentence opening (what they'll come away seeing).
          *   Rules, materials, minute-by-minute timeline (75 mins).
          *   Debrief mapping activity to Browning (situational factors) vs. Goldhagen (ideological conviction).
          *   Two honest notes: predictable failures/recovery, and what the activity *cannot* reproduce (needs reading/testimony).
          *   Constraints: Aversive task must be genuinely harmless. Opting out must be real, not a stunt.
          *   Tone: Direct, no preface, no restating the prompt.

  2.  **Deconstruct the Core Argument:**
      *   **Browning:** Ordinary men complied due to situational pressures (peer pressure, authority, careerism, routinization, group cohesion), not necessarily deep ideological hatred. The "option to step out" existed but was socially costly.
      *   **Goldhagen:** Ordinary men complied because of a unique, eliminationist antisemitic culture in Germany. They were *willing* executioners, not just compliant. The "option to step out" was rarely taken because they *wanted* to do it.
      *   **The Activity's Goal:** Show that low opt-out rates *do not* prove willingness. They can result from social pressure even when formal permission exists.
      *   **The Mechanic:** Prediction gap (students think more will opt out than actually do) + Social cost of opting out (letting the squad down).

  3.  **Design the Activity:**
      *   **Task:** Needs to be annoying but harmless. Copying text? Sorting cards? Standing up/sitting down? Let's go with something tedious but pointless. *Copying a specific pattern of symbols onto a sheet repeatedly.* Or *sorting a deck of cards by suit and number into a specific, non-intuitive order.* Let's choose *transcribing a dense paragraph of text by hand, twice, while standing.* It's boring, physically slightly uncomfortable, but harmless.
      *   **Economy:** Squad rating. If someone opts out, the squad loses "points" or "status." This mimics the "letting down the comrades" pressure.
      *   **Prediction:** Private writing. "What % of people in this room will choose to stop the task when given the chance?"
      *   **The "Opt Out" Moment:** Needs to be clear. "You may stop now. No penalty from me. But your group loses its bonus."
      *   **Safety/Ethics:** Crucial. Must emphasize *real* opt-out. No punishment from the TA. The "penalty" is purely within the game logic (group score), not academic grading. Must debrief carefully to avoid trauma or trivialization.

  4.  **Drafting the Timeline (75 mins):**
      *   0-5: Intro & Setup.
      *   5-10: Prediction Phase.
      *   10-25: The Task (Phase 1).
      *   25-30: The "Choice" Moment.
      *   30-45: The Task (Phase 2) & Completion.
      *   45-70: Debrief (The core learning).
      *   70-75: Wrap-up.

      *Correction:* The task needs to be long enough to build pressure but short enough to leave time for debrief. Let's tighten the task.
      *   0-5: Intro.
      *   5-10: Prediction.
      *   10-30: Task + Choice Moment.
      *   30-75: Debrief. (Need more time for debrief. This is the most important part.)

      *Revised Timeline:*
      *   0-5: Intro & Groups.
      *   5-10: Prediction (Private).
      *   10-25: Task Round 1 (Build cohesion).
      *   25-30: The Choice (Opt-out offered).
      *   30-40: Task Round 2 (Observe behavior).
      *   40-75: Debrief & Mapping.

  5.  **Refining the Mechanics:**
      *   **Groups:** 3 squads of 6.
      *   **Task:** "The Protocol." Transcribing a nonsensical code.
      *   **Incentive:** "Unit Excellence Award" (candy or extra credit point? No, extra credit is ethically murky for compliance. Let's use candy/social recognition). Let's stick to "Group Status" visible on the board.
      *   **Opt-Out:** "You may sit down and stop. Your group's score will be halved. No penalty from me."
      *   **Safety:** Explicitly state: "This is a simulation. Your grade is not affected. If you feel uncomfortable, stop immediately."

  6.  **Developing the Debrief:**
      *   **Prediction Gap:** Why did you think more would opt out? (Fundamental Attribution Error).
      *   **Browning Map:** Peer pressure (letting the squad down), Authority (TA giving orders), Routinization (doing it twice), Careerism (points/status).
      *   **Goldhagen Map:** Did anyone *want* to do it? Or did they just do it? If no one hated the task, but everyone did it, Goldhagen's "willingness" based on ideology is questioned.
