  7.  **Addressing the "Two Honest Notes":**
      *   **Failures:** Students might laugh/break frame. Or someone might opt out and feel proud, missing the point. Recovery: Validate the choice, pivot to *why* it was hard for others.
      *   **Limitations:** The activity cannot reproduce *fear of death* or *deep ideological indoctrination*. It simulates social pressure, not genocidal intent. TA must supply the historical weight.

  8.  **Review against Constraints:**
