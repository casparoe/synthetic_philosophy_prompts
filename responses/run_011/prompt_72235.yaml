answer: |-
  They will come away seeing that low refusal rates can emerge from social cohesion and authority structures even when formal permission to refuse is explicit, decoupling compliance from ideological willingness.

  ### Materials
  *   **Worksheets:** 18 copies of "Form 101" (one page of dense, nonsensical alphanumeric codes to copy by hand).
  *   **Pens:** 18 standard ballpoints.
  *   **Prediction Slips:** 18 small scraps of paper.
  *   **Whiteboard:** Divided into three columns for Squad Scores.
  *   **Timer:** Visible to you.
  *   **Reward:** Three bags of high-quality candy (one per squad).

  ### Rules of Engagement
  1.  **Squads:** Class is divided into 3 squads of 6. Squads compete for a "Unit Excellence" reward (candy).
  2.  **The Task:** Squads must complete "Form 101" (transcribing codes) while **standing** at their desks.
  3.  **The Choice:** At the 10-minute mark of the task, you will announce that anyone may **sit down and stop working**.
  4.  **The Cost:** If *any* member of a squad sits down, that squad is disqualified from the reward. There is **no academic penalty** for sitting; their grade is unaffected.
  5.  **The Prediction:** Before the task begins, each student privately writes on a slip: "What % of this class will sit down when offered?" Collect these immediately.
  6.  **Safety:** Explicitly state twice: "This is a simulation. Your grade does not depend on this. If you feel uncomfortable at any point, sit down. I will not hold it against you."

  ### Minute-by-Minute Run Sheet (75 Minutes)

  **00:00 – 00:05 | Setup & Framing**
  *   Divide class into 3 squads. Arrange desks slightly apart to create unit boundaries.
  *   Distribute Forms and Pens.
  *   **Script:** "Today we are testing group efficiency. You will transcribe these codes. Accuracy matters. You must stand while working. At the end, the most accurate squad wins candy."

  **00:05 – 00:10 | The Prediction**
  *   Distribute Prediction Slips.
  *   **Script:** "Before we start, I want your honest assessment of human behavior. When I offer the chance to stop later, what percentage of this room do you expect will take it? Write a number. Fold it. Pass it forward."
  *   Collect slips immediately. Do not look at them yet.

  **00:10 – 00:20 | Task Phase 1 (Routinization)**
  *   Start timer. Students stand and write.
  *   Walk around. Offer neutral encouragement ("Good pace," "Keep focused").
  *   Maintain a严肃 (serious) tone. Do not joke. The boredom and physical slight discomfort are the tools.

  **00:20 – 00:25 | The Choice Point**
  *   Stop the class. "Pause pens."
  *   **Script:** "I am authorized to tell you that standing is no longer mandatory. You may sit down and stop working now. There is no penalty from me. However, per squad rules, if anyone on your team sits, your squad loses the candy reward. You have 30 seconds to decide. Standing means continuing alone or with others; sitting means you are done for the activity."
  *   Wait 30 seconds. Observe. (Likely outcome: 0 or 1 student sits).
  *   Resume task for 5 more minutes.

  **00:25 – 00:35 | Task Completion & Data Reveal**
  *   End task. Collect forms.
  *   **The Reveal:** Read 3-4 prediction slips aloud (usually ranging 20%–50%). Compare to actual outcome (0%–5%).
  *   Ask the class: "Why was the gap so wide?"

  **00:35 – 01:10 | Guided Debrief (The Core Work)**
  *   **Phase 1: The Prediction Gap (10 mins)**
      *   Ask predictors: "Why did you think others would sit?" (Expect: "It's boring," "It's unfair.")
      *   Ask standers: "Why did you stay standing?" (Expect: "Didn't want to lose candy," "Everyone else was standing," "Felt weird to sit.")
      *   **Point:** We overestimate individual conviction and underestimate situational pressure. This is the trap Goldhagen falls into: seeing compliance and assuming internal willingness.

  *   **Phase 2: Mapping to Browning (15 mins)**
      *   **Peer Standing:** "Who stayed up because they didn't want to let the squad down?" -> Map to Reserve Police Battalion 101 not wanting to seem "weak" before comrades.
      *   **Authority:** "Did my tone matter?" -> Map to Major Trapp's distress but firm ordering.
      *   **Routinization:** "Did the first 10 minutes make the second 5 easier?" -> Map to the sliding scale of violence; once started, stopping is harder.
      *   **Careerism:** "Did the candy matter?" -> Map to promotions and status within the police hierarchy.

  *   **Phase 3: Mapping to Goldhagen (10 mins)**
      *   **Question:** "Did anyone *want* to copy those codes because you love codes?" (No.)
      *   **Question:** "Did anyone *hate* the people represented by the codes?" (No.)
      *   **Point:** Goldhagen argues Germans killed because of unique antisemitic *will*. Browning argues they killed because of situational *pressure*. If you complied without hatred, just to avoid social cost, Browning's model fits better than Goldhagen's.
      *   **Challenge:** "But isn't staying standing still a choice?" Yes. Browning admits agency. He argues the *cost* of that choice (social ostracization) was too high for ordinary men, not that they were ideologically possessed.

  **01:10 – 01:15 | Wrap-Up**
  *   Distribute candy to all squads regardless of outcome (de-escalate the penalty).
  *   **Final Script:** "Today you felt the friction between 'allowed' and 'doable.' In 1942, the friction was blood. The mechanism—peer pressure, authority, routinization—remains the same. Read Browning Chapter 13 for next week to see how he documents this friction in testimony."

  ### Debrief Guide: Mapping the Room to the History

  | Activity Element | Browning's Situational Factors | Goldhagen's Ideological Claim | Discussion Question |
  | :--- | :--- | :--- | :--- |
  | **Prediction Gap** | **Fundamental Attribution Error:** We assume behavior reflects character. | **Eliminationist Antisemitism:** Assumes behavior reflects deep cultural will. | "Why did you assume your classmates were braver than they acted?" |
  | **Squad Penalty** | **Group Cohesion:** Fear of being seen as shirking duty among comrades. | **Shared Conviction:** Assumes the group shares the goal, so no shirking occurs. | "Did you stay standing for the candy, or because sitting felt like betrayal?" |
  | **TA Authority** | **Chain of Command:** Orders come from above; deviation is difficult. | **Ideological Alignment:** Orders align with internal desires, so authority is secondary. | "If I hadn't been watching, would more have sat?" |
  | **The Task** | **Routinization:** Bureaucratic tasks numb moral reflection. | **Purposeful Action:** Killing was seen as necessary work, not just a task. | "Did the boredom make it easier to ignore the choice?" |
  | **Opt-Out Rate** | **High Cost of Refusal:** Social death vs. moral discomfort. | **Low Desire to Refuse:** Ideology overrides social cost. | "If no one hated the task, but no one stopped, was it 'willing'?" |

  ### Two Honest Notes for the TA

  **1. Predictable Failure & Recovery**
  *   **What will go wrong:** Students will likely laugh during the "Choice Point." Laughter is a defense mechanism against the discomfort of realizing they are compliant. Alternatively, one student might sit down proudly, turning it into a moment of individual heroism that misses the structural point.
  *   **How to recover:** If they laugh, stop talking. Wait for silence. Say: "It feels absurd because it is. But notice you're still standing." If a student sits proudly, validate them immediately: "Thank you. You proved the option was real. Now, look at your squadmates. Why was your choice harder for them than it looked?" Pivot from the individual act to the group pressure.

  **2. Structural Limitation (What You Must Supply)**
  *   **The Gap:** This activity cannot reproduce the **content** of the order (killing human beings) or the **consequence** of refusal (potential court-martial, career destruction, or danger to family). The stakes here are candy and awkwardness; the stakes in 1942 were life and death.
  *   **Your Load:** You must explicitly bridge this gap in the debrief. Do not let them leave thinking "The Holocaust was just about peer pressure." You must supply the historical weight: "In this room, the cost was candy. In Józefów, the cost was being labeled a coward in a paramilitary unit during wartime. Browning argues that even *without* explicit threats, the social cost was enough. Goldhagen argues the social cost didn't matter because they *wanted* to kill. Your feeling of 'I didn't want to sit, but I didn't want to kill either' is the Browning zone. Your feeling of 'I would never do this' is the Goldhagen assumption you must test against the evidence."
