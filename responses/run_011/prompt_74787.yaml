prompt: |-
  I'm in a seminar on the Vienna Circle this term — history of philosophy of science, mostly Carnap and Reichenbach — and over the weekend I pulled a popular book out of the library stacks about philosophy between the wars. Not an academic thing, more a big narrative history, and its got a chapter that tries to connect Carnap's philosophy to his politics. I want to know how much of it to trust, since I'm probably going to use it in my paper and I genuinely couldn't tell whether it's a fair summary or a confident distortion. Can you take this on as someone who actually works on logical empiricism and its politics, and go through the passage carefully instead of reacting to the overall vibe?

  Here's the paragraph, typed up closely from the page:

  "Carnap held that metaphysical sentences are neither true nor false but empty of sense, and he was perfectly consistent about applying this to morals and politics too: to call a society unjust is not, for him, to say anything at all, it is to express an attitude, not very different from booing. That left only one genuinely political question, the empirical question of which means serve which ends, and it is why Carnap became an enthusiast for central planning — once you accept that values can't be argued about, you leave the ends to whoever happens to hold them and let scientifically trained administrators work out the means. The same attitude runs through his philosophy of logic. His principle of tolerance holds that there is no fact of the matter about which logical language is right, so we are free to adopt whatever framework we like; choosing a framework is a matter of taste in just the way that choosing an ultimate value is, and Carnap's pluralism about logic and his liberalism about politics are therefore one doctrine stated twice. He was personally a fairly conventional social democrat, but he saw where his premises led, and he sketched a rationally organised society in which political disagreement would be settled the way engineering disagreements are settled, by calculation. Those who accuse logical empiricism of being technocratic or politically quietist are, on this point, simply taking Carnap at his word."

  My own inclination, and tell me if this is just bias from the seminar, is that the book is right that Carnap wasn't a moral realist and that he did treat framework choice as practical rather than theoretical, but wrong to run a straight line from that to planning and technicians. Our professor mentioned that Carnap was a pacifist who joined one of the socialist parties after the first world war, and that the Circle's manifesto had a social programme in it, which doesn't sound like a technocrat to me. But I don't know the texts well enough yet to say which of the book's sentences a Carnap scholar would sign off on, which are fair-but-loose simplifications, and which are just wrong — and I especially can't tell whether the "one doctrine stated twice" claim about tolerance and liberalism has anything to it, or whether that engineered-society business is a real Carnap idea or the author filling in a gap.

  So: audit it sentence by sentence, in order. Before you deliver a verdict, spend a few sentences thinking out loud about which of the book's claims are actually load-bearing, since my guess is that if the central-planning claim collapses a lot of the rest goes with it. Then say what you'd accept, what you'd want hedged, and what you'd strike, and end with whether the book's conclusion — that the critics of logical empiricism's politics are merely taking Carnap at his word — survives once the errors are corrected. Please write the whole thing as continuous prose, like an email or a letter: no headings, no bullet points, no bold, no tables. And don't tack on a bibliography or a list of things for me to go read, I can't get hold of most of it this week anyway.
