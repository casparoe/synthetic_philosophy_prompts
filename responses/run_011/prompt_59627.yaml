  8.  **Refining the Licensing:**
      *   Can (1)+(2) license (6)? Only if "ritual significance" leaves a *distinct* material trace via a *uniform* process. E.g., "Ritual burning always creates calcined bone in a pit." If that's the MRT, it works. But (6) says significance is "conventional." Conventions vary. MRT requires stability.
      *   *Verdict:* Feasting (behavior) is licensed. Ritual (meaning) is *under-licensed* by (1)/(2) and relies heavily on (3) or (8).

  9.  **Refining the Revision:**
