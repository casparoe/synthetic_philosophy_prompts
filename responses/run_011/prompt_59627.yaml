      *   *Section 3: Licensing the Inference.*
          *   Feasting: Yes (via 1, 2, 5, 8).
          *   Ritual/Significance: No/Weak (via 1, 2). Needs (3) or modified (2).
      *   *Section 4: Single Revision.*
          *   Target (2). Expand "causal processes" to include documented semiotic/conventional causation.
          *   Show how this ripples through (1) and (6).

  7.  **Refining the Tensions (Self-Correction during drafting):**
      *   *Tension 1 (1/2 vs 6):* This is the big one. If I say "respectable bridging arguments are middle-range ones" (1) and "only relational analogy carries weight" (2), how do I bridge to "ritual significance" (6)? Ritual is often unique. If I use ethnography, is it relational? Yes, if the *process* of ritual deposition is the same. But (6) says significance is "locally specific." (1) says MRT are "generalisations." **Contradiction:** Generalisation vs. Local Specificity.
