answer: |-
  # STUDENT HANDOUT: SEMINAR DIAGNOSTIC

  **Instructions:** Please answer the following twelve questions. There are no right or wrong answers. Choose the option that best matches your immediate reaction to the case described. Do not spend too long on any single item.

  **1.** Imagine a pile of one million grains of sand. Is it correct to call this pile a heap?
  A. Yes, definitely.
  B. No, definitely not.
  C. It depends on other factors.

  **2.** Consider this claim: "If a pile of *n* grains is a heap, then a pile of *n* minus one grain is also a heap." What is the status of this claim?
  A. It is true.
  B. It is false.
  C. It is almost true, but not quite.
  D. Its status changes depending on when you ask.

  **3.** An oracle announces the exact number of grains at which a collection ceases to be a heap, and the listener understands it perfectly. Is what the oracle says:
  A. True of our language.
  B. True of the world itself.
  C. Incapable of being true.

  **4.** Take a specific pile of sand that feels like a hard case—it is not clearly a heap and not clearly not a heap. Consider the statement: "This pile is a heap OR this pile is not a heap."
  A. This statement is true.
  B. This statement is false.
  C. This statement is neither true nor false.
  D. Whether it is true depends on the situation of the utterance.

  **5.** A river has over several centuries divided into two channels. Is which channel is the original river unsettled out there, or unsettled only in our practice of naming?
  A. Unsettled out there in the world.
  B. Unsettled only in our practice of naming.
  C. Settled in the world, but we cannot find out which.

  **6.** Is it in principle possible for anyone to know where the cut-off falls?
  A. No, it is not possible to know.
  B. Yes, but not in any way we could demonstrate to others.
  C. No, because there is no cut-off to know.

  **7.** A city council, unable to agree on what the ordinance forbidding vehicles in the park covers, resolves by coin toss that roller-skates count and that a decommissioned ambulance mounted as a war memorial does not. After the vote, is the term exact, and did the council make it exact or merely record a decision it had no power to make true?
  A. The term is now exact; the council made it exact.
  B. The term is now exact; the council merely recorded a decision it had no power to make true.
  C. The term remains inexact; the vote changes nothing about the meaning.

  **8.** Can it itself be an unsettled matter that the first matter was unsettled?
  A. Yes, and this runs on without end.
  B. Yes, but it stops at some stage.
  C. No, this is a malformed question.
  D. No, the first matter was fixed.

  **9.** Consider this conjunction: "The rule about removing one grain is correct, AND one grain is a heap." Everyone will want to call this outright false. What has gone wrong in the reasoning that seemed to support it?
  A. The rule about removing one grain is false.
  B. The claim that one grain is a heap is false.
  C. The logic connecting the rule to the claim is broken.
  D. The words shifted their meaning during the reasoning.

  **10.** What, if anything, makes it the case that the cut-off falls where it falls?
  A. Nothing further makes it so.
  B. Our total linguistic practice together with a bias toward natural candidate meanings.
  C. Our practical interests.
  D. The structure of the world itself.
  E. The question has no answer.

  **11.** Imagine a single grain of sand. Is it correct to call this a heap?
  A. Yes, definitely.
  B. No, definitely not.
  C. It depends on other factors.

  **12.** When we argue about whether something is a heap, are we trying to state facts or settle how to act?
  A. We are trying to state facts.
  B. We are trying to settle how to act.
  C. The dispute rests on a confusion between the two.

  ***

  # INSTRUCTOR'S SCORING KEY

  **Note on Administration:** This key functions as a decision tree. Process the student's answers sequentially through the nodes below. The question numbers in the handout are shuffled to conceal the tree structure; follow the logic of the Key, not the numerical order of the Handout.

  **Control Check:** Before sorting, check **Q1** and **Q11**.
  *   **Function:** These are non-diagnostic controls. Q1 (1M grains) and Q11 (1 grain) should elicit uniform agreement (Q1=A, Q11=B).
  *   **Flag:** If a student answers Q1=B or Q11=A, mark their profile as **Unreliable**. They may be answering by contrarian mood or misunderstanding the terms. Proceed with caution, prioritizing their substantive answers (Q2–Q10) over these controls.

  ### DECISION TREE

  **NODE 1: ONTOLOGICAL STATUS (Q5)**
  *   **If Q5 = A (Unsettled out there):**
      *   **LEAF 1: ONTIC VAGUENESS.**
      *   *Cost:* Must accept that reality itself lacks definite structure.
  *   **If Q5 = B (Unsettled in naming) OR C (Settled but hidden):**
      *   Go to **NODE 2**.

  **NODE 2: POSSIBILITY OF TRUTH (Q3)**
  *   **If Q3 = C (Incapable of being true):**
      *   Go to **NODE 3**.
  *   **If Q3 = A (True of language) OR B (True of world):**
      *   Go to **NODE 4**.

  **NODE 3: NIHILISM VS. DEFLATION (Q12)**
  *   **If Q12 = A (State facts):**
      *   **LEAF 2: NIHILISM.** (Predicates essentially never truly apply).
      *   *Cost:* Must deny that ordinary claims like "That is a heap" are ever true.
  *   **If Q12 = B (Settle how to act) OR C (Confusion):**
      *   **LEAF 3: DEFLATIONISM.** (The dispute rests on a confusion).
      *   *Cost:* Must abandon truth as the primary goal of the discourse.

  **NODE 4: KNOWABILITY (Q6)**
  *   **If Q6 = C (No cut-off to know):**
      *   Go to **NODE 5**.
  *   **If Q6 = A (Not possible to know) OR B (Yes but undemonstrable):**
      *   Go to **NODE 6**.

  **NODE 5: LOGIC OF GAPS (Q4)**
  *   **If Q4 = A (True):**
      *   **LEAF 4: SUPERVALUATIONISM.** (Truth is super-truth; disjunctions hold despite gaps).
      *   *Cost:* Must accept true disjunctions where neither disjunct is true.
  *   **If Q4 = C (Neither) OR D (Depends):**
      *   **LEAF 5: DEGREE THEORY.** (Each step of the sorites is very nearly but not quite truth-preserving).
      *   *Cost:* Must accept that the rules of classical logic break down.

  **NODE 6: SOURCE OF BOUNDARY (Q10)**
  *   **If Q10 = A (Nothing) OR B (Practice/Bias):**
      *   **LEAF 6: EPISTEMICISM.** (Sharp cut-off exists but is unknowable).
      *   *Cost:* Must accept a magic-like unknowability about usage facts.
  *   **If Q10 = C (Practical interests):**
      *   Go to **NODE 7**.
  *   **If Q10 = D (World) OR E (No answer):**
      *   *Note:* Q10=D contradicts Q5=B. Treat as **Unstable** (see Rule below). Q10=E usually routes to Deflationism; if reached here, assign **LEAF 3**.

  **NODE 7: CONTEXT VS. DECISION (Q7)**
  *   **If Q7 = A (Council made it exact):**
      *   **LEAF 7: DECISIONISM.** (Authority fixes meaning).
      *   *Cost:* Must accept that meaning is ultimately political.
  *   **If Q7 = B (Recorded decision) OR C (Remains inexact):**
      *   **LEAF 8: CONTEXTUALISM.** (Cut-off shifts with context/interests).
      *   *Cost:* Must accept that successful communication is often a matter of luck.

  **NODE 8: ITERATION CHECK (Q8)**
  *   *Note:* This node does not assign a leaf but validates the assignment.
  *   **If assigned LEAF 4 (Supervaluationism):** Q8 should ideally be A or B.
  *   **If assigned LEAF 6 (Epistemicism):** Q8 should ideally be D.
  *   **If assigned LEAF 5 (Degree Theory):** Q8 should ideally be A.
  *   *Discrepancies here indicate an **Unstable Respondent**.*

  **NODE 9: CONNECTIVE CONSISTENCY (Q2 & Q9)**
  *   *Note:* This node checks for logical coherence in the reasoning.
  *   **If Q2 = A (True) AND Q9 = C (Logic broken):** Consistent (Supervaluation/Degree).
  *   **If Q2 = B (False) AND Q9 = A (Rule false):** Consistent (Epistemic/Context).
  *   **If Q2 = A (True) AND Q9 = A (Rule false):** **Incoherent.** (Cannot hold both).
  *   **If Q2 = C (Almost true):** Routes strongly to **LEAF 5**.

  ***

  ### UNOCCUPIED COMBINATIONS

  The tree permits the following combinations of answers, but no leaf occupies them:

  1.  **Q3=C (Incapable of being true) + Q7=A (Council made it exact).**
      *   *Status:* **Incoherent.** One cannot stipulate an exact boundary for a term that is incapable of being true in the first place.
  2.  **Q2=A (Conditional True) + Q9=A (Rule is false).**
      *   *Status:* **Incoherent.** If the conditional rule is true, one cannot claim the rule is false in the same breath without contradiction.
  3.  **Q5=A (Unsettled out there) + Q10=B (Practice/Bias).**
      *   *Status:* **Unattractive.** This posits that the world is unsettled but our linguistic practice fixes it, which muddles the ontic/linguistic distinction fundamental to Node 1.

  ### INSEPARABLE LEAVES

  **Leaf 7 (Decisionism) and Leaf 8 (Contextualism).**
  *   *Reason:* A student who believes "Practical interests" fix the cut-off (Q10=C) may view a City Council vote (Q7) as either a paradigmatic instance of those interests (Decisionism) or merely one context among many (Contextualism). The twelve questions cannot definitively separate a student who sees authority as *constitutive* of meaning from one who sees it as *indicative* of shifting interests.
  *   *Instruction:* If a profile lands here, group the student with Contextualists but note their openness to stipulation.

  ### RULE FOR THE UNSTABLE RESPONDENT

  A profile is **Unstable** if it contains contradictions across nodes (e.g., Q5=A [Ontic] but Q3=A [True of Language], or Q2=A [True] but Q6=B [Knowable Cut-off]).

  1.  **Priority:** Ontological claims (Q5, Q3) take priority over Epistemic claims (Q6, Q8). Linguistic claims (Q10, Q7) take priority over Logical claims (Q2, Q4, Q9).
  2.  **Reporting:** Do not force an unstable profile onto the nearest leaf. Report the outcome as **"Mixed/Unstable: [Primary Leaf] with [Secondary Commitment]."**
      *   *Example:* "Mixed/Unstable: Epistemicism with Degree-theoretic logic."
      *   *Reasoning:* Forcing them masks the specific tension the seminar should address. Their instability is itself a diagnostic result indicating they are ripe for theoretical revision.
