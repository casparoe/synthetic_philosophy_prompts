  9.  **Final Polish:** Ensure tone is professional, direct, and strategic. The user wants "phrasing and composure," not literature reviews. The advice needs to be actionable for a high-pressure Q&A. (Self-Correction: Make sure the distinction between "Fatal to Method" and "Fatal to Case" is clear in the layout).

      *Refining the "Worst Question":* The user thinks it's about falsification. I agree, but specifically regarding the *peripheral variants*. If the peripheral variants *should* have falsified the admin hypothesis but didn't, that's the trap. I need to clarify that distinction.

      *Refining the "Pre-empt":* Don't wait for the petrographer to ask about thin sections. State the N in the talk. Don't wait for the quant person to ask about binning. Show the histogram raw data.

      *Refining the "Peripheral" argument:* The charge is "Immunizing stratagem." The defense must be "Gradient of hegemony."

