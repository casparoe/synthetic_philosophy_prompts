answer: |-
  # Question-Period Prep Sheet

  **Strategy Overview:** Your audience respects data but distrusts totalizing narratives. They will attack the *links* between your data streams, not the data itself (mostly). Your goal is to show that while any single stream is ambiguous, their intersection is not. Do not defend the "Institution" as a building; defend it as a *pattern of constraint*.

  ### Pre-emptive Concessions (Minutes 0–5)
  *Insert these into your introduction or methodology section to disarm specific attacks before they launch.*

  1.  **On Taphonomy:** Explicitly state: "I am not treating burned floors as frozen snapshots. I am treating them as high-fidelity samples of *in-use* assemblages, contrasting them with the background noise of midden accumulation."
  2.  **On Petrography:** State the N-count of thin sections and pXRF shots immediately when introducing the source groups. Do not make them ask.
  3.  **On "Institution":** Define it operationally: "By 'institution' I do not mean a bureaucracy. I mean a replicable constraint on production choices that exceeds the probability of independent household convergence."
  4.  **On the Peripheral Variants:** Acknowledge the risk: "The peripheral data is the weakest link for central control but the strongest for regional interaction. I will address the risk of ad hoc reasoning there specifically."

  ---

  ### The Objections (Ordered by Likelihood × Damage)

  #### 1. The Immunization Charge (Peripheral Variants)
  **Who:** The Senior Material Culture Theorist (or the Economic Historian)
  **Idiom:** "You argue that conformity proves control, and now you argue that *non-conformity* at the periphery also proves control? That looks like an immunizing stratagem. If the jars were full size there, you'd say 'control'; they are smaller, so you say 'loose control'. What observation would actually falsify the administrative model?"
  **Damage:** **Fatal to Method.** If you cannot define the boundary of your hypothesis, it explains everything and nothing.
  **Reply:** "It's a fair charge. The falsification condition is *random* variation. If the periphery showed *larger* jars, or entirely different forms, or the same CV as the cooking ware, I would abandon the administrative model. The 12–18% reduction is systematic, not random. It suggests a 'dialing down' of the norm where monitoring costs rise, which is consistent with a gradient of authority, not its absence. I am not claiming control is binary; I am claiming the *deviation* is structured."
  **Soft Spot:** You are relying on the systematic nature of the error. If that 12–18% is within measurement error or natural clay shrinkage variance, you lose.
  **Recommendation:** **Hold.** But clarify the falsification condition (see "Worst Question" below).

  #### 2. The Market Standard Objection
  **Who:** The Visiting Economic Historian
  **Idiom:** "You dismiss the market because the jars are too regular. But in premodern economies, transaction costs drive standardization without a central coordinator. If I'm a trader, I want a jar that fits my boat. That selects for a modal capacity without a bureaucrat ever touching the clay. Why is 'efficiency' not a sufficient explanation?"
  **Damage:** **Fatal to Case.** Undermines the core inference from regularity to administration.
  **Reply:** "Efficiency selects for a *range*, not a *tight cluster*. A market standard allows for tolerance based on utility. My CV is below that of the cooking wares made in the same households. Market selection acts on the user; administrative selection acts on the maker. The fact that the fabric sources are restricted to specific non-market hubs (2nd/3rd rank sites) rather than ubiquitous clay beds suggests the constraint is on *production*, not just *exchange*."
  **Soft Spot:** If the CV difference isn't statistically significant, the "tight cluster" argument collapses.
  **Recommendation:** **Reframe.** Shift from "Market vs. State" to "Emergent Standard vs. Prescriptive Standard."

  #### 3. The Capacity Reconstruction Bias
  **Who:** The Quantitative Archaeologist
  **Idiom:** "You're comparing wheel-made transport jars to hand-made cooking wares. One is mechanically constrained, the other isn't. Of course the CV is lower. Also, how many complete profiles? If you're reconstructing height from rim sherds using a regression, your two modes might be artefacts of your binning or your reconstruction assumptions."
  **Damage:** **Fatal to Method.** Attacks the validity of your primary quantitative evidence.
  **Reply:** "I anticipated the mechanical constraint issue. That's why the control group is hand-made cooking ware from the *same* contexts. Both are subject to the same taphonomic fragmentation. Regarding reconstruction: I have [N] complete profiles. The modes exist even when I exclude reconstructed vessels. The binning is visible in the histogram; I'm happy to walk through the raw data, but the bimodality persists across different bin widths."
  **Soft Spot:** If N for complete profiles is low (<10 per mode), this is shaky.
  **Recommendation:** **Hold.** Have the raw data table ready on paper if slides are off.

  #### 4. The Petrographic Over-Splitting
  **Who:** The Ceramic Petrographer
  **Idiom:** "Three source groups for a regional class? That feels thin. Did you split one widely distributed geological formation into three based on minor temper inclusions? If Source A and Source B are geologically identical but separated by 5km, is that a 'production zone' or just a clay bed?"
  **Damage:** **High.** Undermines the "restricted production" argument.
  **Reply:** "The groups are distinguished by [specific inclusion/matrix feature], not just proximity. I have [N] thin sections. The clustering in the compositional space is distinct from the background geology. The key isn't that the clay is unique, but that *only* these three patches were exploited for this specific jar form, while local clay was used for other wares at the same sites."
  **Soft Spot:** If the geochemical separation is weak, they will eat you alive.
  **Recommendation:** **Concede** uncertainty on the exact geology, **Hold** on the exploitation pattern. "The geology is permissive; the selection is restrictive."

  #### 5. The Chaîne Opératoire Objection
  **Who:** The Interpretive Material Culture Scholar
  **Idiom:** "You've standardized the product (the jar) while ignoring variation in the process. Did they use the same wheel speed? The same drying time? If the *habit* is standardized but the *technique* varies, isn't that a community of practice, not an institution? You've reified 'institution' without cashing out the social mechanism."
  **Damage:** **Medium.** Annoying, but doesn't destroy the data.
  **Reply:** "I agree 'institution' is a black box if left undefined. I cash it out as 'restricted access to raw material' plus 'prescriptive metric norms'. A community of practice explains shared style; it doesn't explain restricted sourcing at specific second-rank sites while ignoring the main settlement's clay. The mechanism is access control, not just shared knowledge."
  **Soft Spot:** You don't have direct evidence of access control (e.g., tokens, texts).
  **Recommendation:** **Reframe.** Admit it's an inference to the best explanation, not a direct observation.

  #### 6. The Taphonomic Skew (Event-Locking)
  **Who:** The Senior Aegean Archaeologist (Generalist)
  **Idiom:** "Your assemblage comes from destruction layers. That's a single moment in time. How do you know this wasn't a one-off mobilization for a siege or a specific project, rather than a standing administrative capacity? You've sampled an event, not a system."
  **Damage:** **Medium.** Questions the temporal stability of your model.
  **Reply:** "The destruction layers cap a sequence of fills tied to a single construction episode, suggesting a lifecycle of use, not just a final moment. Furthermore, the same jar class appears in earlier, non-destruction contexts in the survey, just in lower frequencies. The destruction layer gives me the 'full warehouse' snapshot; the survey gives me the duration."
  **Soft Spot:** If the survey data is sparse, this is weak.
  **Recommendation:** **Hold.**

  #### 7. The "Second-Rank" Production Paradox
  **Who:** The Regional Specialist
  **Idiom:** "If this is central provisioning, why are the kilns at the second- and third-rank sites? Usually, the 'Palace' controls the high-value production. Why outsource the storage jars to the periphery?"
  **Damage:** **Low/Medium.** Actually supports your "modest reach" thesis if framed right.
  **Reply:** "That's exactly why I argue against a 'State' model. A state centralizes production. A modest administrative apparatus subcontracted to reliable nodes. It's consistent with a system that has the power to impose norms (the capacity) but not the capacity to manage the labor directly (the location)."
  **Soft Spot:** Requires you to maintain the "modest reach" distinction consistently.
  **Recommendation:** **Hold.** This is actually a strength of your argument.

  #### 8. The Falsification Question (The "Worst Question")
  **Who:** Anyone (likely the Quant or Econ Hist person following up on #1)
  **Idiom:** "You said the peripheral variants support the model. So, what data *would* have forced you to the exchange explanation? If the answer is 'nothing', this is just a story."
  **Damage:** **Fatal to Method.** (See analysis below).
  **Reply:** "If the peripheral jars showed *higher* variability than the core, or if their capacity was uncorrelated with the core modes, I would accept the market/exchange model. The fact that they are *systematically* smaller implies a relationship to the norm, even if it's a strained one. I need the deviation to be structured to claim administration."
  **Soft Spot:** This is the same as #1. You must be consistent.
  **Recommendation:** **Hold.**

  ---

  ### Fatal to Method vs. Fatal to Case Study

  **Fatal to Method (The Logic):**
  *   **Objection #1 (Immunization):** If you cannot specify what would disprove the admin hypothesis, your consilience is circular.
  *   **Objection #3 (Quant Bias):** If the CV difference is an artefact of wheel vs. hand, your primary metric for "control" is invalid everywhere, not just here.
  *   **Objection #8 (Falsification):** If you cannot name a counter-factual, the method is dogma.

  **Fatal to Case Study (The Data):**
  *   **Objection #2 (Market Standard):** If a market *can* produce this CV, your specific inference for *this* site is wrong, but your method might still work elsewhere.
  *   **Objection #4 (Petro Splitting):** If the sources are actually one big bed, the "restricted access" argument fails for this region, but the capacity argument might stand.
  *   **Objection #6 (Taphonomy):** If this was a one-off event, the "standing institution" claim fails for this period, but not necessarily the method.

  ---

  ### The "Worst Question" Analysis

  **Your Guess:** You suspect the demand to state which observation would force you to the exchange explanation.
  **Verdict:** **You are right.**
  **Why:** In a room with a philosopher of science friend and a quantitative skeptic, "Consilience" sounds like "cherry-picking" unless you define the boundaries of the cherry tree. If you admit the peripheral variants *should* have falsified the admin model but didn't, you look like you are moving the goalposts.
  **How to Handle:** Do not wait for this. **Pre-empt it.** In your conclusion, explicitly state: "Had the peripheral variants shown random capacity distribution, I would have concluded a market network. Had the CV matched the cooking ware, I would have concluded household production." Make the falsification conditions part of your closing argument, not a defensive reply.

  ---

  ### Misunderstandings to Pre-empt in the Talk

  1.  **"Institution" = "Palace":** They will hear "Centralized" and imagine Knossos.
      *   *Fix:* Use the phrase "Modest Administrative Apparatus" repeatedly. Contrast it explicitly with "State" in your intro.
  2.  **"Standardization" = "Wheel":** They will assume wheel-making explains the CV.
      *   *Fix:* Show the CV of the wheel-made cooking wares (if any) or emphasize that wheel-making allows variance unless constrained.
  3.  **"Source Groups" = "Geology":** They will think you are doing geological mapping.
      *   *Fix:* Emphasize "Exploitation Zones" not "Geological Formations." You are mapping human choice, not bedrock.

  ### Final Composure Note
  When the interruptive culture kicks in:
  *   **Pause.** Count to two before answering.
  *   **Validate.** "That's a crucial distinction..." or "I'm glad you raised the taphonomy..."
  *   **Bridge.** "...which is why I compared the CV to the cooking ware."
  *   **Stop.** Do not ramble. If you don't know, say: "I don't have that data yet, but my working assumption is X."

  You have the data. They have the theory. Your job is to show the data constrains the theory, not the other way around. Good luck.
