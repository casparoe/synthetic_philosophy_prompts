  2. **Main sequence**

  You value affection as the appreciation of lovable qualities in another person. But if value lies in the appreciation of qualities, does the specific individual matter? If I find these qualities elsewhere, is my friend interchangeable? Does this not render loyalty to a diminished or unlovely person a moral mistake, contradicting our deepest intuitions about fidelity?
