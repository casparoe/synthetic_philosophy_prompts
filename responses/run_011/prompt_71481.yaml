  You isolate states to judge their value, assuming we all agree on the result. But when I imagine beauty without affection, I feel uncertainty. Is this method not circular? You assume the conclusion to prove the premise, relying on a consensus that simply does not exist.
  **Pressure point:** Method assumes consensus.
  **If he replies…** He will claim clear thinking reveals truth. Ask: Then why do clear thinkers disagree?

  Your ideal says nothing about who enjoys these goods. If a few admire art while others starve, is the world better? You made this a creed for young admirers of beauty. Did you ignore the distribution of goods because suffering lies outside your definition of intrinsic value?
  **Pressure point:** Ignores distribution and suffering.
