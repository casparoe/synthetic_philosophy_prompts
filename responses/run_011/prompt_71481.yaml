  **Pressure point:** Conflates ethics with epistemology.
  **If he replies…** He will say the whole is the end. Ask: Then is truth a constituent of the good?

  You distinguish virtue from intrinsic good, placing virtue merely as a means. But if personal affection is the highest good, is not the virtue of loving itself valuable? By demoting virtue, do you not strip moral character of worth, making it merely a tool for producing aesthetic states?
