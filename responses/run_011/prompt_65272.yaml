  # Diagnostic Decision Tree: The Chamberlain Intuition Test

  **Instructions:**
  Answer each question sequentially. Do not worry about which theoretical label your answer might produce. The goal is to locate the specific point where your judgment diverges from the others in the room. Grant the baseline setup for every question: Distribution 1 is just, transfers are voluntary, and Distribution 2 results.

  ---

  ### Node 1: The Baseline (Rectification)
  **Question:** Is the starting distribution D1 actually just, or does it rest on historical injustices (theft, exclusion, coercion) that invalidate the starting point?
  *   **No (D1 is tainted):** Go to **Leaf 1**.
  *   **Yes (D1 is clean):** Go to **Node 2**.

  > *Meta-Commentary:* **Contested.** While almost everyone agrees historical injustice matters, specialists disagree on whether this dissolves the Chamberlain argument or merely postpones it. Nozick himself allowed for rectification, but the argument is usually run assuming a clean baseline to test the principle of transfer.

  ---

  ### Node 2: The Source of Entitlement (Cases a & b)
  **Question:** In the Scarcity Rent variant (Case b), the money arises from fixed seats and demand, not just effort. In the Talent context, it arises from natural ability. Do you view the windfall from scarce opportunities and natural endowments as private property, as common rent, or as a mix?
  *   **Common Rent (Scarcity is shared, Labor is private):** Go to **Leaf 2**.
  *   **Common Asset (Both Scarcity and Talent are shared):** Go to **Leaf 3**.
  *   **Private Property (Both are owned by the individual):** Go to **Node 3**.

  > *Meta-Commentary:* **Contested.** This distinguishes those who view natural assets as morally arbitrary from those who view self-ownership as extending to the market value of those assets.

  ---

  ### Node 3: The Scope of Justice
  **Question:** Does the principle of justice apply to individual voluntary transactions, or only to the design of major social institutions?
  *   **Institutions Only:** Go to **Leaf 4**.
  *   **Individual Transactions Too:** Go to **Node 4**.

  > *Meta-Commentary:* **Interpretive.** This is the primary fault line between Rawlsian and non-Rawlsian readings. It is unsettled whether Rawls intended his principles to regulate individual choices directly or only the background rules.

  ---

  ### Node 4: The Mechanism (Case a)
  **Question:** In the Teammate Gifts variant, money moves without a market price. If you accept the Gift variant but reject the original Market Surcharge, you are objecting to the market mechanism. Do you judge the transfer by the voluntariness alone, or does the market context matter?
  *   **Market Context Matters:** Go to **Leaf 5**.
  *   **Voluntariness Alone:** Go to **Node 5**.

  > *Meta-Commentary:* **Contested.** This isolates the view that justice requires an egalitarian ethos in daily choices, not just just rules.

  ---

  ### Node 5: Third Parties (Case c)
  **Question:** In the Bystanders variant, non-fans lose out due to housing price hikes. Does a voluntary chain of transactions lose its justification if it imposes uncompensated costs on non-consenting third parties?
  *   **Yes (Loses Justification):** Go to **Leaf 6**.
  *   **No (Justification Holds):** Go to **Node 6**.

  > *Meta-Commentary:* **Contested.** This tests the harm principle. Even strong libertarians sometimes accept constraints if property rights are defined to exclude harm to others (Lockean proviso).

  ---

  ### Node 6: The Foundation (Conventionalism)
  **Question:** Is the claim that taxation is a taking dependent on a pre-institutional moral baseline of ownership, or are property rights themselves defined by the legal rules that permit taxation?
  *   **Defined by Legal Rules:** Go to **Leaf 7**.
  *   **Pre-institutional Baseline:** Go to **Node 7**.

  > *Meta-Commentary:* **Contested.** This is a meta-ethical split. Conventionalists argue there is no "taking" because the state defines what you own. Natural rights theorists argue the state can only recognize, not define, ownership.

  ---

  ### Node 7: The Objection (Case d)
  **Question:** In the Maintenance variant, the pattern is restored via tax. Is the surcharge unobjectionable because it respects a pre-institutional right, because it maintains a sufficiency floor, or because it preserves a strict pattern over time?
  *   **Respects a Pre-institutional Right:** Go to **Leaf 8**.
  *   **Maintains a Sufficiency Floor:** Go to **Leaf 9**.
  *   **Preserves a Strict Pattern:** Go to **Leaf 10**.

  > *Meta-Commentary:* **Contested.** This distinguishes the deontological libertarian from the consequentialist sufficientarian and the strict egalitarian. It addresses whether the temporal shape of the principle matters.

  ---

  ## Answer Key and Leaves

  **Response Strings:** (e.g., Yes-Private-Individual...)

  | Path | Leaf Label | Reasoning Summary |
  | :--- | :--- | :--- |
  | **1: No** | **Rectification-first** | The example fails because the starting point is historically unjust. The focus should be on correcting past wrongs, not modeling ideal transfers. |
  | **2: Common Rent** | **Left-Libertarian / Georgist** | Individuals own themselves and their labor, but the rental value of scarce natural or social opportunities belongs to the community. |
  | **2: Common Asset** | **Luck-Egalitarian** | Natural talents and endowments are morally arbitrary. Justice requires neutralizing the effects of brute luck while rewarding ambition. |
  | **3: Institutions** | **Rawlsian** | Justice applies to the basic structure. Voluntary transactions within just institutions are permissible even if they lead to inequality, provided they benefit the least advantaged. |
  | **4: Market Matters** | **Cohen-style Egalitarian** | Justice requires an egalitarian ethos in personal choices, not just institutions. Market mechanisms corrupt the social relations required for justice. |
  | **5: Yes (Harm)** | **Rule-Consequentialist** | Property rules are justified by their overall welfare consequences. Transfers are valid only if they do not reduce aggregate welfare or harm third parties. |
  | **6: Legal Rules** | **Conventionalist** | There is no pre-political baseline. Taxation is not a taking because property rights are constituted by the legal system that imposes the tax. |
  | **7: Right** | **Nozickian** | Individuals have inviolable rights. Any patterned distribution requires continuous interference with liberty, which violates self-ownership. |
  | **7: Floor** | **Sufficientarian / Prioritarian** | Inequality is unobjectionable unless it pushes individuals below a threshold of sufficiency or fails to prioritize the worst off. |
  | **7: Pattern** | **Strict Egalitarian** | Liberty upsets patterns. If equality is the goal, it must be maintained continuously, even if this restricts certain voluntary exchanges. |

  *(Note: Paths may vary slightly in length depending on branching, but no path exceeds seven questions.)*

  ---

  ## Indistinguishable Leaves and Tiebreakers

  This instrument cannot perfectly separate every position using only the Chamberlain variants. The following pairs may yield identical response strings despite theoretical differences.

  **Pair 1: Rule-Consequentialist vs. Left-Libertarian / Georgist**
  *   **Why:** Both may agree that the Scarcity Rent (Case b) should be taxed for the common good.
  *   **Tiebreaker Case:** Ask if they would tax *labor* income to fund the dividend. The Georgist says no (labor is private); the Rule-Consequentialist says yes (if it maximizes welfare).

  **Pair 2: Nozickian vs. Sufficientarian**
  *   **Why:** In a wealthy society where no one is below the floor, both will permit the Chamberlain transfer.
  *   **Tiebreaker Case:** Ask if they would tax the rich to save a life if the rich person refuses consent. The Sufficientarian says yes (floor trumps); the Nozickian says no (rights trumps).

  **Pair 3: Conventionalist vs. Rawlsian**
  *   **Why:** Both locate property rights within the institutional structure rather than pre-political nature.
  *   **Tiebreaker Case:** Ask if justice could exist without a state. The Rawlsian typically says no (basic structure required); the Conventionalist might say the question is meaningless (no property without law).

  ---

  ## Meta-Commentary on Field Consensus

  **Settled:**
  *   **Node 1 (Rectification):** Specialists generally agree that historical injustice complicates the example, though they disagree on whether it refutes the theoretical point.
  *   **Node 6 (Conventionalism):** It is widely accepted that legal positivism supports the Conventionalist leaf, while natural law supports the Nozickian leaf.

  **Contested:**
  *   **Node 2 (Source):** There is no consensus on whether natural talents are common assets or private property. This remains a core divide between libertarians and egalitarians.
  *   **Node 3 (Scope):** It is genuinely disputed whether Rawlsian justice applies to individual choices or only institutions.
  *   **Node 7 (Pattern):** Whether liberty necessarily upsets patterns depends on how one defines liberty and pattern. This is not settled.

  **Interpretive:**
  *   **Node 4 (Mechanism):** Whether Nozick intended to defend market mechanisms specifically or voluntariness generally is a matter of textual interpretation.
  *   **Node 5 (Third Parties):** Whether Nozick's Lockean Proviso covers the Bystanders case is debated among scholars of his work.

  **Assessment of Consensus Claims:**
  *   **Refuting the Difference Principle:** It is **not** consensus that this example refutes the Difference Principle. Many specialists argue the Difference Principle applies to the basic structure, which can accommodate the transfer if it benefits the least advantaged over time.
  *   **Rawlsian Reply:** It is **not** consensus that Rawlsians have a clean reply that dissolves the example. The tension between liberty and pattern remains a live philosophical problem.
  *   **Winning Side:** No side is clearly winning. The debate has shifted from "who is right" to "which assumptions (self-ownership vs. common asset) are more defensible." This handout treats all leaves as live options.
