answer: |-
  The server room hummed, a low, constant thrum that seemed to vibrate in the teeth. On the main monitor, a progress bar sat frozen at *PRE-EXECUTION VERIFICATION*. Two agents had been uploaded. Source code exchanged. The clock was ticking down to the run.

  Elena leaned against the console, arms crossed. Marcus sat in the rolling chair, spinning a pen between his fingers.

  "It's done," Elena said. "The handshake is complete. They know each other."

  "They know each other's source code," Marcus corrected. "They don't know what they're going to do. That was decided the moment you hit compile."

  "That's the old paradigm," Elena said. "You're still thinking of the decision as the output. In program equilibrium, the decision is the architecture. My agent isn't choosing to cooperate or defect in the vacuum of the moment. It's choosing a policy: *Cooperate if and only if I can prove you will cooperate.*"

  Marcus stopped spinning the pen. "The modal agent. *FairBot*, or a cousin of it. You cooperate if $\square(\text{Opponent} = C)$, else defect."

  "Exactly. It's unexploitable. If you defect, I cannot prove you cooperate, so I defect. I never cooperate into a defection. But it's also robust. If you are a similar agent, I *can* prove you cooperate, via Löb's Theorem. We get mutual cooperation without binding contracts, without reputation, without iteration. Just logic."

  Marcus stood up and walked to the glass, looking at the rack of blinking lights. "Three problems, Elena. And none of them are solved by citing Löb."

  "Try me."

  "First," Marcus said, turning. "The tension between robustness and unexploitability. You claim your agent is both. But to be truly unexploitable, you must defect against any agent that doesn't *guarantee* cooperation. To be robust, you must cooperate with agents that are *likely* to cooperate, even if the proof is complex."

  "That's why we use provability logic," Elena said. "It handles the guarantee."

  "Does it?" Marcus stepped closer. "Suppose I submit an agent that is identical to yours, but with a slightly different axiomatization. Or suppose we both use the same system, but we're both disciplined enough to require a proof of safety before we cooperate. You wait for a proof that I cooperate. I wait for a proof that you cooperate. My code says: *'If I cannot prove cooperation, I must defect to avoid exploitation.'* Your code says the same."

  "So we both prove cooperation," Elena insisted. "Löbian cooperation is stable."

  "Only if the proof systems align perfectly," Marcus countered. "If you are cautious enough to be unexploitable, you raise the bar for what counts as a proof. If I do the same, the bar rises higher. We create a ladder of meta-reasoning where neither side can satisfy the other's condition without violating their own safety constraint. The result isn't the magic handshake. It's two perfectly rational, unexploitable agents staring at each other until the clock runs out and they default to Defect. Mutual defection, not because of irrationality, but because of excessive discipline."

  Elena paused. She looked at the screen. "That's a search problem, not a decision problem. We can tune the agent to recognize specific classes of cooperative algorithms. *PrudentBot* handles this by checking if the opponent cooperates against *DefectBot* first."

  "Which leads to my second point," Marcus said. "You haven't dissolved the Prisoner's Dilemma. You've just relocated it. Look at where the choice actually happens. It doesn't happen in the simulation. It happens in your office, when you wrote the code."

  Elena sighed. "The code is the commitment."

  "The code is the *result* of a choice," Marcus pressed. "When you decided to write *FairBot* instead of *DefectBot*, you were in a game. You were asking yourself: *'What code should I submit?'* If you knew I was submitting *DefectBot*, you would have written *DefectBot*. If you knew I was submitting *FairBot*, you wrote *FairBot*. That is a standard Nash equilibrium calculation over the space of programs."

  "So?"

  "So, standard game theory already accounts for pre-commitment. We've known since Schelling that binding yourself can change the outcome. But we never claimed binding yourself *changes rationality*. We just said it changes the payoff matrix. You're claiming transparency creates a new decision theory. I'm saying it's just the old decision theory applied to the meta-game of code selection. You haven't solved the dilemma of choice; you've just pushed the dilemma back one step to the programmer. And the programmer has no source code to inspect."

  Elena pushed off the console. "That's a category error. The programmer is external. The agents are the decision-makers. If the agents can achieve cooperation where standard Causal Decision Theory dictates defection, then the theory of rationality for those agents has changed. The fact that a human chose the code is irrelevant. The human isn't playing the PD. The agents are."

  "The human *is* playing the PD," Marcus said flatly. "The agents are just puppets. If the puppets cooperate, it's because the puppeteers decided cooperation was the equilibrium strategy for the puppet-show. Nothing fundamental has shifted. You've just made the pre-commitment visible."

  "Visibility *is* the shift," Elena said. "Opaque pre-commitment is a bluff. Transparent pre-commitment is a logical fact."

  "Which brings me to the third point," Marcus said, checking his watch. "Logical facts require infinite time. You're relying on provability. Proofs take computation. We are not running on god-machines. We have a timeout."

  "We allocate sufficient resources," Elena said.

  "You allocate *finite* resources," Marcus corrected. "Your agent searches for a proof of my cooperation. My agent searches for a proof of yours. If the proof is deeper than the search budget, the search fails. What does your agent do on search failure?"

  "It defaults to Defect. To remain unexploitable."

  "Exactly. So now you have a coordination problem on proof complexity. If we both budget for 1000 steps, and the proof requires 1001, we defect. If I budget 1000 and you budget 2000, you might prove me, but I can't prove you, so I defect. To cooperate, we need to coordinate not just on strategy, but on computational limits and axiom strength."

  Marcus gestured to the frozen progress bar. "In the real world, agents are bounded. In the bounded world, Löbian cooperation is fragile. It collapses into mutual defection whenever the proof search hits the resource ceiling. And since 'unexploitable' requires a hard default to Defect on failure, the system is biased toward defection. The theoretical equilibrium exists in the limit of infinite compute. In the room where we actually live, it's just another way to miss the coordination window."

  Elena was quiet for a moment. The hum of the servers seemed to grow louder.

  "You're arguing that the implementation is hard," Elena said finally. "I'm arguing that the principle is new."

  "I'm arguing that the principle relies on the implementation," Marcus replied. "If the resource constraints force defection, then the 'solution' to the Prisoner's Dilemma is theoretical fiction. It's like saying traffic jams are solved because, theoretically, if everyone drove perfectly, flow would be continuous. Yes. But they don't."

  "But they *can* see each other's code," Elena said. "That changes the incentive structure. In a black-box world, I must assume you are a black box. I must defect. In a transparent world, I can condition my move on your algorithm. That creates a causal link between my source code and your output that didn't exist before. My choice of algorithm *causes* your output, because your algorithm reads mine. Causal Decision Theory says my action cannot cause your action. Program Equilibrium shows it can."

  "It causes my output, not my action," Marcus said. "My action was fixed when I wrote the reader. You're confusing logical dependence with causal influence. You haven't changed decision theory. You've just changed the definition of 'action' to include the source code."

  "Isn't that what decision theory should be?" Elena asked. "The selection of the best policy?"

  "If you define policy as 'source code submitted to a transparent tournament,' then yes," Marcus said. "But then you admit the dilemma is in the submission, not the play. And in the submission, you don't have transparency. You don't know what code I'm writing until it's too late to change yours."

  The monitor beeped. *VERIFICATION COMPLETE. EXECUTION IMMINENT.*

  "We're about to find out," Elena said. "If they cooperate, the logic holds."

  "If they cooperate, it means we both happened to write compatible code within compatible resource limits," Marcus said. "If they defect, it means the dilemma survived the translation."

  "And if they defect," Elena said, turning to face him, "it proves that rational agents with full transparency still fail to coordinate. Which means the problem isn't the theory. It's that we haven't found the right fixed point yet."

  "Or," Marcus said, picking up his pen again, "it means there is no fixed point. There is only the choice, made in the dark, before the lights come on."

  The progress bar jumped to 100%. The screen went black for a heartbeat, then flashed the result.

  **AGENT A: DEFECT**
  **AGENT B: DEFECT**

  Elena stared at the screen. "Search timeout," she said quietly. "The proof search hit the budget."

  Marcus nodded, not looking triumphant, just resigned. "The dilemma moved to the resource allocation stage. And we failed to coordinate there."

  "We can fix the budget," Elena said, her voice tight. "Next time we align the axioms."

  "Next time," Marcus said, pushing his chair back. "But the question remains. Did we fail because transparency is insufficient? Or because the real game was deciding how much compute to buy?"

  Elena didn't answer. She looked at the code log, scrolling through the lines where the agents had tried to find a bridge to each other and ran out of time.

  "Transparency didn't change the decision," Marcus said, walking to the door. "It just gave us a new place to lose."

  "It gave us a new place to look," Elena replied, without turning around. "That has to count for something."

  Marcus paused at the threshold. "Maybe. But the payoff is still the same."

  He left. Elena remained, watching the logs, wondering if the next proof would be shorter, or if the silence between the agents was the only truth the machine had to offer.
