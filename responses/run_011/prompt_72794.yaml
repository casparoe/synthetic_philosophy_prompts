  a. The scenario paragraph.
  The City Heritage Commission reviews six buildings for protection under the "Historically Significant" statute. Building 1 (1890) and 2 (1905) are undisputed landmarks; Building 5 (1980) and 6 (1995) are clearly modern. Buildings 3 (1945) and 4 (1955) sit in the middle, differing only by decade of construction. The Commission votes unanimously to protect 1 through 3 and deny 4 through 6. Members aloud confirm only the votes: "Building 3 is protected," and "Building 4 is denied." No one speaks about the law's boundaries. Afterward, one member insists the written minutes include this explanatory clause: "Building 4 was ineligible regardless of our vote." The rest agree to record it without comment. The statutory text, evidence, and context remain fixed throughout.

  b. A numbered list of every sentence the case turns on.
  1. "Building 3 is protected." (Panel Finding)
  2. "Building 4 is denied." (Panel Finding)
  3. "Building 4 was ineligible regardless of our vote." (Minute Sentence) **[DIVERGENCE]**

  c. The supervaluationist pass.
  Admissible precisifications of "Historically Significant" vary on the middle cases. Some acceptable precisifications include Building 4; others exclude it. Sentences 1 and 2 are supertrue: Building 3 is included on all admissible precisifications (given the vote resolves the penumbra for the institution), and Building 1 is clearly in. Wait, to meet Spec 2, Sentence 1 and 2 must be assertible. SV holds that clear cases (1, 2, 5, 6) are supertrue. Borderline cases (3, 4) are indeterminate. However, the Panel's *decision* selects a precisification. Relative to the selected precisification, 1-3 are In, 4-6 are Out. SV licenses asserting the *decision* ("Building 4 is denied") as an institutional act. But Sentence 3 claims the *standard itself* (independent of the vote) excluded 4. Since some admissible precisifications include 4, Sentence 3 is not supertrue. SV cannot call it true.

  d. The epistemicist pass.
  There is a sharp boundary in the series of buildings, fixed by the facts of history and architecture, though unknown to the panel. Building 4 objectively falls below this boundary. Sentences 1 and 2 are true descriptions of the decisions which match the facts (assuming the panel got it right, which both theories must license for agreement). Sentence 3 is true because the eligibility fact obtained prior to and independent of the vote. The panel's inability to locate the boundary beforehand is mere ignorance, not indeterminacy. E commits to Sentence 3 being true.

  e. The check against specifications 2 and 3, sentence by sentence.
  1. "Building 3 is protected." Both agree the panel decided this. SV treats it as true-on-selected-precisification; E treats it as true. Both license the assertion of the decision. (Coincide)
  2. "Building 4 is denied." Both agree the panel decided this. SV treats it as true-on-selected-precisification; E treats it as true. Both license the assertion. (Coincide)
  3. "Building 4 was ineligible regardless of our vote." E says True (fact of the matter). SV says Not Supertrue (some precisifications allow eligibility). SV cannot call it true. (Diverge)
  Spec 2 is met because a reader hearing only the spoken findings (1 & 2) sees identical behavior. Spec 3 is met because the theories diverge only on the written minute (3).

  f. The diagnosis.
  The feature doing the work is the *source of exclusion*: whether the standard itself dictated the outcome (E) or the committee's selection among admissible options did (SV).
  Trap Check (Spec 4): You are right. The sentence "There is a point in this series at which the classification flips" is supertrue for SV (every precisification has a cutoff) and true for E. It cannot be the hinge.
  Removal Test 1: Delete the minute sentence. The divergence vanishes; the record shows only agreed decisions.
  Removal Test 2: Remove Building 4's borderline status (make it clearly modern). Both theories agree the standard itself ruled it out. The divergence collapses because SV makes Sentence 3 supertrue for clear cases.

  g. The counter-attack.
  A supervaluationist might argue Sentence 3 is contextually shifted: in the minutes, "ineligible" means "ineligible relative to the precisification adopted by the vote." If accepted, SV could call it true. However, the phrase "regardless of our vote" explicitly blocks this contextual shift, forcing a reading about the antecedent standard. The resistance amounts to re-reading the minute sentence to ignore its explicit qualifier.

  h. Your verdict.
  The disagreement is genuine. It concerns whether statutory vagueness leaves room for legitimate discretionary choice (SV) or merely conceals a determinate fact (E). Removal Test 1 collapses the case (no divergence without the sentence). Removal Test 2 leaves the theoretical distinction standing but removes the *application* of the divergence (no borderline case to test it). The case stands because it isolates the metaphysical commitment in ordinary administrative language. The divergence is not merely verbal because it impacts how the institution understands its own authority: as discovering law or making it.

