answer: |-
  Friends, neighbors, colleagues.

  One hundred and fifty years. That is a long shift. It is long enough for the rock to settle, for the timber to rot, and for the ore to turn to dust in the bin. We are gathered here because the mine is closed, but the headframe stands. We are gathered because the work is done, but the lamp room remains.

  You know the motto on the plaque at the entrance. *WE KEEP WHAT WE DUG.*

  When Ezra Redwater drove the first stake, that motto meant copper. It meant the weight in the bucket, the credit in the company store, the house on the hill. It meant survival. When the VP commissioned the bronze of Ezra outside, he was honoring that digging. He gave us a monument to the man who started the hole we all live in. I signed a petition against that statue because bronze is heavy, and I worried it would pin us to the ground. But I stand corrected on one thing: a monument is not a tomb unless we treat it like one. The VP has given us a building, not a grave. He has given us a place to work out what this town is now that the ore is gone.

  But there are different ways to keep what we dug.

  There is the way of the statue. We look up at the founder. We say, "He was great, we are small." That is useful, if it makes us want to build. But if it makes us want to kneel, it is a sickness. We cannot live in the shadow of the founder forever. The rock does not care who dug it first.

  There is the way of the strike. In 1934, a deputy shot a man named Voss. Voss's grandson sits on the committee. The deputy's granddaughter sits beside him. They are second cousins. The blood in this valley has mixed so much that the judge and the accused share a birthday cake. This is critical history. It is the tribunal of the living. We cannot undo the shot. We cannot unshoot the gun. But we can decide who holds the gun now. If we let the past judge us without mercy, we will stand in the dock forever. We must judge the past so we can walk out of the courtroom.

  And then there is the lamp room.

  You walk in under the brass tally board. Forty-one hooks. Forty-one brass tags. Two of those tags belong to men who went down in the cage in 1979 and never came up. The shift boss couldn't take them down. The rules said a tag stays until the man clocks out. So they stayed. The committee wants to put a plaque under them. *WE KEEP WHAT WE DUG.*

  Here is the hard truth. A town that cannot forget cannot act. To swing a pick, you must forget the weight of the rock for a second. To walk forward, you must forget the depth of the hole behind you. This is not disrespect. This is biology. A body that cannot digest food starves. A town that cannot digest history suffocates.

  I see the widows in the second row. I am not asking you to forget your husbands. I am asking you to forgive the town for stopping time. The dead do not want a shrine. They want a shift partner.

  So here is what we do with the board. We cannot leave it exactly as it is. To leave it is to say the shift ended in 1979. To say the town died with them. We cannot take the tallies down. To take them down is to say they were never here. To say the debt is paid. It is not paid.

  We do neither.

  We leave the forty-one tallies on the board. But we add forty-two empty hooks beside them. And we forge forty-two new brass tags. They will not have names yet. They will hang empty.

  This is what plastic power looks like. It is not erasing the dead. It is not embalming them. It is making room for the living to hang their own tags next to the lost. It is saying that the shift is not over. The cage is still running. The air is still breathable.

  The two men who died in the cage are not artifacts. They are not museum pieces. They are the foremen of this new shift. They are waiting for us to clock in.

  When you walk out of here, look at the bronze Ezra. He is looking at the horizon. Look at the cousins on the committee. They are shaking hands. Look at the board. See the empty hooks.

  *WE KEEP WHAT WE DUG.*

  At the entrance, that meant copper. It meant the past. It meant what we pulled out of the ground to sell.

  But standing here, in the lamp room, with the bell ready to ring, it means something else. We keep the digging. We keep the work. We keep the responsibility to go down again, not for ore, but for each other. We keep the town.

  The bell is about to ring. It is not a funeral bell. It is a shift bell. Check your lamps. Find your hook. Clock in.

  Thank you.
