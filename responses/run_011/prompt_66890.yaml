      Regarding the elasticity claim, it is ostensibly an intra-personal behavioral prediction. Robbins could swallow the assertion that a specific individual's willingness to pay (WTP) rises with income without violating ordinalism. The conflict arises only when regulators aggregate these individual behaviors into a social metric. By scaling VSL, agencies implicitly treat money as a common denominator of welfare, assuming the marginal utility of income diminishes. This is an interpersonal assertion disguised as a behavioral adjustment. It claims a dollar buys less well-being for a rich person than a poor one, precisely the comparison Robbins banned.

