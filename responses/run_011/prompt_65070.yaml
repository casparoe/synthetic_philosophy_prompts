answer: |-
  This is a sharp observation. You have identified a tension that sits right at the intersection of organizational sociology, psychology, and the philosophy of work. You aren't inventing the feeling, but you are likely synthesizing two separate concepts into a single pattern that doesn't have a common name yet.

  Here is the breakdown of what exists, what doesn't, and the term I propose for it.

  ### 1. The Existing Concepts (The Halves)
  You are describing two distinct psychological phenomena that act as mirror images.

  **The Work Side: The Overjustification Effect**
  In psychology, this is well-documented. When an externally imposed incentive (a manager's approval, a ticket, a review metric) is applied to an intrinsically motivated activity (curiosity, refactoring for elegance), the intrinsic motivation often collapses. You stop doing it because *you love it* and start doing it because *you are measured on it*. The locus of control shifts from internal to external.
  *   **Verdict:** This fits your work scenario perfectly.

  **The Leisure Side: The Quantified Self / Gamification**
  The opposite happens in your leisure. A Sunday with "nothing scheduled" is high autonomy but low structure. For many engineers, pure unstructured time feels like entropy (a "day that didn't happen"). By introducing a dashboard or a spreadsheet, you are imposing **teleology** (purpose/goal) onto the void. You are voluntarily submitting to a rule set to generate meaning.
  *   **Verdict:** This fits your leisure scenario, but it's usually called "Gamification" or "Self-Tracking," which sounds too shallow for what you're describing.

  **The Sociological Lens: Legibility**
  James C. Scott, in *Seeing Like a State*, argues that institutions (companies, governments) need to make activities "legible" to manage them. They simplify complex reality into metrics (tickets, KPIs).
  *   **Work:** When your coding becomes legible to the manager, it becomes a resource for the institution, not an expression of you.
  *   **Leisure:** When your running is *illegible* (no data), it feels private but meaningless. When you make it legible *to yourself* (dashboard), it gains narrative weight.
  *   **Verdict:** This explains the *mechanism* (accounting), but not why the value flips.

  ### 2. The Unified Concept: Purpose Sovereignty
  There is no single established term that covers both the work-drain and the leisure-drain simultaneously. Most literature treats them as separate problems (work motivation vs. leisure optimization).

  However, the common thread is **who authors the purpose of the activity.**

  *   **Work (Official):** The manager authors the purpose (velocity, tickets). You lose **Purpose Sovereignty**.
  *   **Work (Unofficial):** You author the purpose (learning, elegance). You retain **Purpose Sovereignty**.
  *   **Leisure (Untracked):** No one authors the purpose. It is purposeless drift. You have Sovereignty, but no Purpose.
  *   **Leisure (Tracked):** You author the purpose (PRs, books read). You retain **Purpose Sovereignty** and create Purpose.

  **The Coined Term:**
  I propose calling this pattern **The Sovereignty Boundary**.

  *   **Definition:** The psychological threshold where an activity's value is determined not by the activity itself, but by whether the *definition of success* is self-authored or externally imposed.
  *   **The Rule:** Enjoyment flows only when you hold the pen that defines what "done" looks like.

  ### 3. The "Second Move": Making it Unauthorized Again
  You asked if deliberately making something unauthorized again is a known thing.

  **Is it known?**
  Yes, but mostly in niche contexts.
  *   **Job Crafting:** Psychologists call this "job crafting," but that usually implies manager-approved adjustments.
  *   **Ludic Resistance:** In game studies and sociology, this is playing against the intended design of a system.
  *   **Shadow Work:** Ivan Illich coined this to describe unpaid, unregulated labor that sustains life, but it doesn't quite capture the *subversive* joy you're talking about.

  **The Coined Term for the Move:**
  I propose calling this move **Ludic Secession**.

  *   **Why:** "Ludic" refers to play (from *Homo Ludens*). "Secession" implies withdrawing from a larger political entity (the company's official goals) to form a smaller, self-governing state (your own curiosity).
  *   **How it works:** You are not stopping the work; you are seceding from the *official narrative* of the work. You are mentally (and sometimes practically) moving the activity from the "Company Ledger" to the "Private Ledger."

  ### 4. Edges and Differentiation
  To ensure this term is useful, we need to know what it is *not*.

  **What counts as The Sovereignty Boundary?**
  *   Refactoring code because *you* see a pattern, vs. refactoring because it's a OKR.
  *   Running to beat *your* previous time, vs. running because a doctor told you to.
  *   Reading a book to track *your* growth, vs. reading because it's on a "Required Leadership Reading" list.

  **What is a nearby case that DOESN'T count?**
  *   **Procrastination:** Procrastination is avoidance. Ludic Secession is engagement. You aren't hiding from work; you are doing *different* work that you value more.
  *   **Gold Plating:** This is adding unnecessary features to please oneself *at the expense of the project*. Ludic Secession is usually neutral or beneficial to the system (you learn more, code gets better), it just isn't *measured*.
  *   **Burnout:** Burnout is emotional and physical exhaustion. You can experience Sovereignty Boundary friction while fully energized. It is a crisis of *meaning*, not energy.
  *   **Boredom:** Boredom is a lack of stimulation. You can be stimulated by official work (high pressure, high stakes) but still feel the "drain" because you don't own the goal.

  ### 5. Confidence and Weakest Claim

  **Confidence Level:**
  *   **High (85%):** On the psychological components (Overjustification Effect, Self-Determination Theory). The mechanism of "external reward killing internal drive" is robustly replicated in literature.
  *   **Medium (60%):** On the synthesis. Connecting the leisure tracking to the work illicitness via "Purpose Sovereignty" is my own synthesis of these fields. It fits your data, but it is not a standard academic model.
  *   **High (90%):** On the utility. Whether or not philosophers agree, this framing is actionable for an engineer.

  **The Single Claim I Am Least Sure Of:**
  I am least sure that the leisure side is the **exact inverse** of the work side.
  *   *My claim:* Work needs to be untracked to be fun; Leisure needs to be tracked to be fun.
  *   *The nuance:* It might not be about "tracking" specifically. It might be about **friction**.
      *   Official work has *too much* friction (process, review, tickets). Removing it (illicit work) makes it fun.
      *   Pure leisure has *too little* friction (no goals, no resistance). Adding it (tracking) makes it fun.
      *   *Risk:* If I am wrong, then "Purpose Sovereignty" is the wrong unifier, and the real variable is **Optimal Friction**. If you find that you actually enjoy leisure *without* tracking sometimes, then the "Sovereignty" theory holds better than the "Tracking" theory. I am betting on Sovereignty, but Friction is the confounding variable.

  ### Summary for your mental model
  *   **The Phenomenon:** **The Sovereignty Boundary**. (Value exists only when you define 'done').
  *   **The Move:** **Ludic Secession**. (Mentally withdrawing the activity from the official metric system).
  *   **The Risk:** **The Legibility Trap**. (The moment the organization sees value in your secession and tries to metricize it, the value evaporates).

  **Advice:** Do not try to make "Ludic Secession" official. Do not put your source-code-reading hours into the 20% tracker. Keep the ledgers separate. The value is in the privacy of the ledger, not the activity itself.
