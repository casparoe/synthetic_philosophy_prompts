answer: |-
  You are right to distrust the spreadsheet. It assumes credibility is a property of the *source* (a container), whereas your verdicts correctly intuit that credibility is a property of the *proposition* (the content). A chronicle is not "true"; a specific claim within it is more or less constrained by the conditions of its production.

  Your classmate's objection regarding Herodotus and Thucydides is correct but incomplete. Rhetorical disclaimers of honesty are indeed topoi (conventional devices), which is why your Verdict 4 (the confessional author) is rightly treated with suspicion. However, this does not negate Verdict 3 (reporting one's own defeat). The distinction lies not in the *claim* of honesty, but in the *cost* of the specific information. A general confession of sin is cheap; a specific report that your own commander fled is expensive.

  Here is the principle that reproduces your verdicts, followed by the applications and the necessary sacrifice.

  ### The Principle of Differential Constraint

  **Credibility attaches to the individual proposition, not the source.** The weight of a proposition is determined by the **constraints** acting upon the author at the moment of inscription. A proposition is credible to the degree that the **friction of fabrication** (social, cognitive, or material) exceeds the **friction of transmission**.

  Apply the following clauses in order:

  1.  **The Propositional Clause (Verdicts 5, 6):** Never evaluate a source as a whole. Disaggregate the text. A source may be constrained on facts of topography (high friction to invent) but unconstrained on troop numbers (low friction, high convention) or motives (low friction, high speculation). *Motivation:* Your intuition in 5 and 6 that the inscription and the "dependable author" contain both trash and treasure.
  2.  **The Stemmatic Clause (Verdicts 1, 2, 9):** Establish independence before aggregating. If Source B copies Source A, the friction of fabrication is paid only once. If they share an outline but diverge on incidental details, the friction is paid twice for those details. If they share a suspected lost ancestor, treat them as one witness *only if* the shared detail is specific enough to prove dependence; otherwise, treat as independent but note the risk. *Motivation:* Your handling of the chronicles in 1, 2, and your unease in 9.
  3.  **The Social Cost Clause (Verdicts 3, 4, 5):** Evaluate the risk of punishment. If a proposition, were it false, would expose the author to contradiction by an audience with the means and motive to punish (socially, politically, or physically), credibility is high. If the proposition aligns with a rhetorical convention that *simulates* risk (e.g., humblebragging) without actual exposure, credibility is low. *Motivation:* The difference between the fleeing commander (3) and the confessional preface (4). The commander's flight was verifiable by enemies; the moral confession was not.
  4.  **The Cognitive Cost Clause (Verdict 8):** Evaluate the difficulty of invention. If a proposition contains details (metrical, linguistic, toponymic) that would be prohibitively difficult for a later author to invent but cheap to transmit from an earlier tradition, credibility is high, even if social cost is low. *Motivation:* Your intuition that the verse line and district name in 8 carry weight despite the late date.
  5.  **The Capacity Clause (Verdict 7):** Evaluate the ability to know. Silence is only evidence if the author had the capacity and occasion to record the event. Fragmentary or epitomized sources lack the capacity to prove absence. *Motivation:* Your distinction between the contemporary who omitting the decree and the epitomator who did the same.

  ### Costliness vs. Unfakeability

  You asked whether these belong in one principle. They do. They are both measures of **Fabrication Friction**.
  *   **Costliness (Social):** External friction. "If I lie, I get caught."
  *   **Unfakeability (Cognitive):** Internal friction. "If I lie, I can't get the details right."

  **Priority:** When they conflict (as in Case 8), **Cognitive Cost takes priority.** Social cost relies on the audience's knowledge; cognitive cost relies on the information's complexity. A forger can risk social punishment (Case 5 inscription), but a forger cannot easily replicate obsolete metre (Case 8). If the cognitive barrier to invention is high, the lack of social risk is irrelevant.

  ### Application to New Cases

  **Case A: The Perfect Batting Average.**
  *A source matches verifiable evidence in ten places (topography, names, dates) and then asserts something uncheckable (motives).*
  *   **Verdict:** High credibility on *capacity*, low credibility on *motives*.
  *   **Reasoning:** Apply the **Propositional Clause**. The ten matches prove the author had access (Capacity Clause) and was not inventing basic facts (Cognitive Cost). However, motives are inherently low-friction to fabricate (Social Cost is low; Cognitive Cost is low). The "batting average" establishes the author was *present* and *informed*, not that they had privileged access to internal states. Trust the narrative of events; treat the narrative of motives as hypothesis.

  **Case B: Hostile Agreement on Incidental Damage.**
  *Two hostile witnesses agree on an incidental detail that serves neither interest and is mildly damaging to both.*
  *   **Verdict:** Very High Credibility.
  *   **Reasoning:** Apply the **Stemmatic Clause** (assume independence unless proven otherwise) and the **Social Cost Clause**. Usually, hostile witnesses are discounted (your Verdict 9). However, if the detail damages *them*, the Social Cost of lying is high (they are attacking their own position). If the detail is incidental, it is unlikely to be part of a coordinated polemic. This is the "criterion of embarrassment" applied to multiple independent streams. It overrides the suspicion of common hostility.

  ### The Sacrifice

  You asked which verdict you ought to abandon. You must abandon the certainty in **Verdict 9**.

  > *9. Two sources agree on a detail; both are hostile to the same man, and I suspect without being able to prove that both drew on a lost pamphlet attacking him. I discount heavily...*

  **Why:** This violates the **Stemmatic Clause**. You cannot operationalize a suspicion. If you cannot prove the lost pamphlet exists, you must treat the sources as independent. If they are independent and hostile, their agreement is your strongest evidence (see New Case B). By discounting heavily based on a ghost, you are introducing a bias that protects your narrative from inconvenient corroboration.
  *   **Correction:** Treat them as independent. Note the *possibility* of a common source in a footnote as a limitation, but do not mathematically discount the weight of the testimony based on an unproven hypothesis. If the detail is specific enough to suggest a common source, prove the source; if not, accept the corroboration.

  ### A Note on the Seminar Objection

  Your classmate is right that Herodotus's disclaimer is a device. This confirms your Verdict 4 (the confessional author). A general claim of "I am telling the hard truth" is a rhetorical move with low fabrication friction; anyone can say it.
  However, this does not invalidate Verdict 3. The commander fleeing is not a *claim* of honesty; it is a *datum* that incurs honesty. The classmate's argument helps you distinguish between **performative self-damaging** (Case 4: "I was foolish," which enhances moral standing) and **substantive self-damaging** (Case 3: "We lost," which enhances factual standing).
  *   **Rule:** Trust data that damages the author's *faction* or *safety*. Skepticize data that damages only the author's *vanity* while enhancing their *virtue*.

  ### Summary for your Spreadsheet

  If you must return to the spreadsheet, do not score the *Source*. Score the *Row* (the proposition).
  1.  **Independence:** (0-1) Is this stemmatically unique?
  2.  **Social Risk:** (0-1) Could contemporaries punish this if false?
  3.  **Cognitive Barrier:** (0-1) Is this hard to invent (metrics, obscure names)?
  4.  **Conventionality:** (0-1) Does this look like a rhetorical trope? (Inverse score).

  Sum the row. That is your weight. Abandon the "Source Credibility" column entirely.
