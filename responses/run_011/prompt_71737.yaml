answer: |-
  # The Label Audit Protocol (LAP)

  **Purpose:** To standardize interpretive claims in teaching collection labels by matching the strength of the assertion to the strength of the evidence.
  **Time Required:** ~20 minutes per label draft.
  **User Level:** Introductory Archaeology (requires ability to read a basic context sheet and object description).

  ---

  ## Part 1: Claim Taxonomy & Evidentiary Burden

  Your proposed list (made, used, deposited, meant, believed, institutional) is intuitive but overlaps in ways that obscure risk. "Meant," "Believed," and "Institutional" are all **High-Inference Social Claims**; they require the same heavy lifting. "Made" and "Used" are **Technical Claims**. "Deposited" is a **Contextual Claim**.

  The LAP uses a four-tier hierarchy. A claim at a higher tier requires evidence from all lower tiers to be secure.

  | Tier | Claim Type | Examples | Required Evidence |
  | :--- | :--- | :--- | :--- |
  | **1** | **Physical/Technical** | Material, manufacture technique, dimensions. | Visual inspection; basic material ID (e.g., "basalt," "hand-modeled clay"). |
  | **2** | **Functional** | What the object *did* (e.g., "grinding," "weighing," "holding liquid"). | Morphology (form fits function) **PLUS** use-wear (abrasion, polish) **OR** residue. |
  | **3** | **Contextual** | Where it was found and what it was with (e.g., "kitchen," "trash," "grave"). | Secure provenance (Tier 1 or 2 Context, see below) **PLUS** association with diagnostic assemblage. |
  | **4** | **Social/Cognitive** | Gender, belief, economy, status (e.g., "women's work," "cult," "market"). | Tier 1-3 evidence **PLUS** a validated analogy (see Part 3) **OR** multiple independent lines of evidence (e.g., text + image + object). |

  **Rule:** A label may not assert a Tier 4 claim without Tier 3 security. It may not assert Tier 2 without Tier 1 security.

  ---

  ## Part 2: The Context Audit (Provenance Tiering)

  You must grade the excavation record before grading the claim. Assign the object one of the following **Provenance Tiers (PT)** based on the field records.

  *   **PT-1 (High):** In situ; coordinates recorded; relationship to floor/wall/feature documented; soil matrix described; screened/flotation used. (Typical: Late 1980s–90s seasons).
  *   **PT-2 (Medium):** Bagged by locus/room; general stratigraphic layer known; specific micro-context (floor vs. fill) ambiguous. (Typical: Early 1980s seasons).
  *   **PT-3 (Low):** "Site X" only; trench number only; field notes missing or illegible; surface find; secondary deposition (e.g., in a later fill). (Typical: 1970s trenches).

  **Action:**
  *   If **PT-1**: Proceed to Tier 3 claims.
  *   If **PT-2**: Halt at Tier 2 claims. Tier 3 claims must be hedged ("likely from...").
  *   If **PT-3**: Halt at Tier 1 claims. Tier 2 claims must be hedged ("possibly used for..."). Tier 4 claims are prohibited.

  ---

  ## Part 3: The Analogy Bridge Test

  Many drafts use ethnography or later history to explain function or meaning. This is the most common source of error. Apply the **Double-Distance Rule**.

  1.  **Temporal Distance:** Is the analogy within 500 years and 500 km of the object?
      *   *Yes:* Proceed.
      *   *No:* The analogy is **Decorative**. It may be used to illustrate a possibility ("Perhaps like...") but not to assert fact ("Was used for...").
  2.  **Functional Necessity:** Is there any other plausible explanation for the object's form/wear without this analogy?
      *   *No (Analogy is unique solution):* Claim may proceed (with hedging).
      *   *Yes (Other solutions exist):* The analogy is **Speculative**. Claim must be hedged ("May indicate...").

  **Check:** Does the draft present the analogy as *evidence* or as *illustration*? If evidence, it must pass the Double-Distance Rule.

  ---

  ## Part 4: Ambiguity & Plurality

  If the evidence supports two competing claims equally (e.g., "grinding grain" vs. "grinding pigment"):

  1.  **Do not choose one.** Selecting one creates false certainty.
  2.  **Do not list all.** Listing five possibilities creates noise.
  3.  **The Solution:** State the *common denominator*.
      *   *Bad:* "This was a quern for grain." / "This was a muller for pigment."
      *   *Good:* "This stone was used for grinding materials."
      *   *Exception:* If one hypothesis is significantly more probable (e.g., 90% vs 10% based on regional assemblage data), state the probable one with a hedge ("Likely used for...").

  ---

  ## Part 5: Judgment Calls & Systematic Errors

  **Where Judgment is Required:**
  *   **Use-Wear Identification:** Distinguishing "worn" from "used for grinding" requires judgment. The procedure assumes the user accepts the catalog description of wear. If the catalog says "smooth," the user must decide if that equals "polish."
  *   **Analogy Relevance:** Deciding if a modern ethnographic parallel is "close enough" is subjective.

  **Systematic Error Modes:**
  1.  **The Conservative Bias (False Negative):** The procedure will frequently downgrade Tier 4 claims to Tier 2. You will lose narratives about gender and belief. This is a feature, not a bug, but it reduces pedagogical "hook."
  2.  **The Record Assumption (False Positive):** The procedure relies on the *accuracy* of the field notes. If a 1970s note says "floor" but it was actually "fill," the PT-2 rating is wrong, and the claim is unsafe. The procedure cannot detect lying or mistaken field notes.

  ---

  # Test Run: Applying the LAP to Draft Labels

  Below I apply the procedure to the three drafts you mentioned. I will not invent data; where information is missing, I will issue an **Archive Query**.

  ## Case 1: The Basalt Object (Quern / Women's Work)
  **Draft Claim:** "Basalt quern. Evidence that grain processing was women's work."
  **Current Record:** Object has a "worn depression."

  **Step 1: Claim Taxonomy**
  *   "Quern" = Tier 2 (Functional).
  *   "Women's work" = Tier 4 (Social/Gender).

  **Step 2: Context Audit**
  *   *Query:* What is the Provenance Tier? The object is from the 1970s–90s.
  *   *Scenario A:* If 1990s find with locus sheet: **PT-1**.
  *   *Scenario B:* If 1970s find with only trench number: **PT-3**.
  *   *Assumption for Test:* Let's assume **PT-2** (Bagged by room, specific floor unclear).
  *   *Constraint:* PT-2 allows Tier 2 claims with hedging, prohibits Tier 4.

  **Step 3: Analogy Bridge**
  *   *Claim:* "Women's work."
  *   *Source:* Likely ethnographic analogy (Near Eastern traditional societies).
  *   *Test:* Temporal distance > 2000 years? **Yes.**
  *   *Result:* Analogy is **Decorative**. It cannot support a factual claim about gender division of labor.

  **Step 4: Ambiguity**
  *   *Query:* Is "worn depression" sufficient for "Quern"?
  *   *Archive Request:* **Check Conservation/Analysis Report for Microwear or Residue.**
      *   *If Yes (Starch grains/Grinding polish):* Tier 2 supported.
      *   *If No (Visual inspection only):* "Worn" could be natural erosion or non-food processing. Tier 2 is unsafe.

  **LAP Verdict:**
  *   **If No Microwear Report:** Downgrade "Quern" to "Basalt grinding stone." Cut "Women's work" entirely.
      *   *Label:* "Basalt grinding stone. Surface wear indicates processing of materials."
  *   **If Microwear Report Exists:** Keep "Quern" (hedged if PT-2). Cut "Women's work."
      *   *Label:* "Basalt quern, likely used for grain. Found in domestic room."

  **Unhappy Result Warning:** If the archive has no microwear analysis (common for 1970s finds), this procedure **forbids** you from calling it a quern. You must call it a "ground stone tool." This may feel overly agnostic for a teaching collection, but it is evidentiary honest.

  ---

  ## Case 2: The Clay Figurine (Courtyard / Fertility Cult)
  **Draft Claim:** "Clay figurine from domestic courtyard. Evidence of a household fertility cult."
  **Current Record:** Recovered from a courtyard.

  **Step 1: Claim Taxonomy**
  *   "Figurine" = Tier 1 (Physical).
  *   "Domestic courtyard" = Tier 3 (Contextual).
  *   "Fertility cult" = Tier 4 (Social/Cognitive).

  **Step 2: Context Audit**
  *   *Query:* Is the "courtyard" identification secure?
  *   *Archive Request:* **Check Field Diary for Architectural Context.**
      *   *If PT-1 (In situ on floor):* Tier 3 supported.
      *   *If PT-3 (In fill dumped from elsewhere):* "Courtyard" is unsafe. It is "debris."
  *   *Assumption for Test:* **PT-1**. (Let's assume the 1990s excavation was rigorous).

  **Step 3: Analogy Bridge**
  *   *Claim:* "Fertility cult."
  *   *Source:* Comparison to later historic iconography or ethnographic "goddess" figures.
  *   *Test:* Temporal distance > 500 years? **Yes.**
  *   *Functional Necessity:* Can a figurine in a courtyard be anything else? **Yes.** (Toy, decoration, ancestor representation, votive for protection, discard).
  *   *Result:* Analogy is **Speculative**.

  **Step 4: Ambiguity**
  *   Multiple readings (Toy vs. Cult vs. Decor) are equally consistent with a figurine in a courtyard.
  *   *Rule:* State the common denominator.

  **LAP Verdict:**
  *   **Cut:** "Fertility cult."
  *   **Keep:** "Clay figurine."
  *   **Hedge:** "Found in a domestic courtyard."
  *   *Label:* "Clay figurine. Recovered from a domestic courtyard; its specific role in household life is unknown."
  *   *Note:* This is the "Wall of Agnostic Labels" risk. The label is boring. But "Fertility Cult" is a hallucination without textual support or a specific ritual context (e.g., shrine niche).

  ---

  ## Case 3: The Stone Weights (3 Floors / Regulated Market)
  **Draft Claim:** "Set of stone weights found on three successive floors. Demonstrates a regulated market."
  **Current Record:** Near-identical weights, stratigraphically sequential.

  **Step 1: Claim Taxonomy**
  *   "Weights" = Tier 2 (Functional).
  *   "Regulated market" = Tier 4 (Institutional/Economic).

  **Step 2: Context Audit**
  *   *Record:* "Three successive floors." This implies **PT-1** (Stratigraphic control is high).
  *   *Association:* "Set of near-identical."
  *   *Constraint:* PT-1 allows Tier 3/4 consideration.

  **Step 3: Analogy Bridge**
  *   *Claim:* "Regulated market."
  *   *Source:* Economic theory + comparison to later standardized systems (e.g., Babylonian shekels).
  *   *Test:* Does standardization *require* a regulated market?
  *   *Functional Necessity:* Can weights be standardized without a central market authority? **Yes.** (Local craft tradition, household copying, regional convention without enforcement).
  *   *Result:* Analogy is **Speculative**. "Regulated" implies a state or guild. "Standardized" implies agreement.

  **Step 4: Ambiguity**
  *   Evidence supports "Standardized system." Evidence does not distinguish "State Regulated" from "Social Convention."

  **LAP Verdict:**
  *   **Cut:** "Regulated market."
  *   **Replace with:** "Standardized system of measurement."
  *   *Label:* "Stone weights. Found across three occupation layers. Their consistent size suggests a standardized system of measurement was in use."
  *   *Note:* This is a "Happy Result." It preserves the economic insight without overclaiming political structure.

  ---

  # Limitations & The "Wall of Agnosticism"

  You asked what this procedure cannot do and whether it will drive you toward uninformative labels.

  **1. What the Procedure Cannot Do:**
  *   **It cannot fix bad data.** If the 1970s field notes say "floor" but it was "fill," the LAP rates it PT-2 or PT-1 based on the note, and the label will be confidently wrong. The procedure audits the *text*, not the *dirt*.
  *   **It cannot generate pedagogy.** The LAP is a filter, not a generator. It strips away narrative to ensure safety. It will not tell you *how* to make "Grinding Stone" interesting. That requires curatorial creativity outside the protocol.
  *   **It cannot resolve theoretical disputes.** If your faculty supervisor believes "All figurines are ritual" and you believe "All figurines are toys," the LAP forces you both to say "Figurine." It enforces agreement by lowering the ceiling, not by finding the truth.

  **2. The Risk of Agnostic Labels:**
  Yes, adopting this procedure will increase the number of labels that say "possibly," "likely," or "role unknown."
  *   **Is this a cost worth paying?** For a **Teaching Collection**, I argue **Yes**.
  *   **Reasoning:** If you teach students that "Figurine = Fertility," you are teaching them bad archaeology. You are teaching them to leap from data to narrative without the bridge. A label that says "We don't know" is a teaching moment about the limits of evidence. A label that says "Fertility Cult" is a lie that students must later unlearn.
  *   **Mitigation:** Use the *case text* (the panel introducing the case) to provide the narrative ambition, and keep the *object labels* evidentiary. The panel can say "Households here may have practiced rituals..." while the label says "Figurine found in courtyard." This splits the difference between engagement and rigor.

  **3. Systematic Failure Mode:**
  The LAP will systematically **under-interpret** objects from well-excavated contexts where the *theory* is sound but the *physical trace* is subtle. For example, if a floor was clearly burned in a ritual destruction (contextual evidence) but the object itself is generic, the LAP might prevent you from linking the object to the ritual because the object itself shows no burn marks. You will need a "Context Override" clause for your curator to approve cases where the *assemblage* tells a story the *individual object* does not.

  **Recommendation:** Add a **"Assemblage Exception"** to Step 2. If the object is part of a curated group (like the weights) where the *pattern* is the evidence, allow the group claim on the case panel, but keep individual labels conservative.

  ### Final Advice for the Curator Meeting
  Present the LAP as a "Quality Control" tool, not a "Censorship" tool. Emphasize that it protects the department from publishing claims that future excavations could easily debunk. The "Unhappy Result" on the Basalt Quern is your strongest selling point: it shows you are willing to sacrifice a good story for accuracy, which is the core value of the discipline you are teaching.
