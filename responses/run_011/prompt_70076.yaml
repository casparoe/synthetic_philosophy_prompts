      *   *Philosophers:* Focus on explanation models, causality, testability criteria, self-defeat. They care about *coherence*.
      *   *Grad Students:* Focus on utility, "what do I do Monday morning?" They care about *application*.

  3.  **Drafting the Objections (Iterative Process):**

      *   *Objection 1 (Cliometrician):* "You say untestable, but we have results." Focus on proxies (literacy, schooling).
      *   *Objection 2 (Cliometrician):* "Identification strategies (Wittenberg distance)." You're ignoring modern causal inference.
      *   *Objection 3 (Weber Scholar):* "Category error." Ideal types aren't variables. You're judging a fish by its ability to climb a tree.
      *   *Objection 4 (Weber Scholar):* "Counterfactuals." Weber used objective possibility, not covering laws.
      *   *Objection 5 (Philosopher):* "Testability criterion." Why is your model of explanation the right one? Positivist baggage?
