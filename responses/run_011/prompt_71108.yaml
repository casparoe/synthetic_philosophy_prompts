answer: |-
  The injection port is on the inside of my wrist, right over the radial artery. I press the auto-injector there every morning before I lock into the bell. Asym-9. It doesn't numb the nerves; it severs the wire between the signal and the scream.

  Down here, at 400 meters, flinching is a capital offense. If you jerk your hand because a welding spark bites you, you breach a seal, you flood the bell, you kill the team. We need hands that are steady as stone, even when the stone is on fire.

  Today, the manifold was hot. I knew it was hot because my suit's thermal sensors turned the HUD orange. I knew it was burning me because I could see the skin on my left forearm blistering, peeling back like wet paper. I could tell you exactly where it hurt: a four-inch strip along the ulnar side. Intensity? Roughly a seven out of ten.

  But I didn't pull away. I finished the weld. I watched the blister form with the same mild interest I'd give a cloud formation. There was no urgency, no spike of adrenaline, no thought of *stop*. Just data. The signal was there, bright and clear, but the alarm was off.

  Back in the saturation habitat, the pressure is a constant weight, a physical hug that never loosens. I peel off the drysuit in the hygiene module. My arm looks terrible. Angry red, weeping plasma. It looks like it belongs to a stranger.

  I sit at the mess table and pull up the nociception log on my tablet. This is the ritual. The suit records every spike, every threshold breach. It's a report card on somebody else's body.

  *14:02. Thermal contact. 65°C. Duration 12 seconds.*
  *14:15. Pinch pressure. 40 PSI. Location: Glove interface.*
  *14:40. Chemical irritation. pH 2.0.*

  I read it like a grocery list. There is no wince, no tightening of the chest. The "badness" of the injury, I am learning, was never in the tissue damage. Tissue is just meat. Meat repairs. The badness was always in the suffering. The suffering was the lesson. Without it, the injury is just history.

  I scroll to the bottom of the log. There is a message flag. Priority One. From home.

  My sister, Sarah. We aren't close, not really, but she's the emergency contact. The subject line is just *Mom*.

  I open it. My mother died three hours ago. Heart failure. Fast. She didn't suffer.

  I stare at the words. I wait for the hollow punch in the gut, the sudden heat behind the eyes, the way grief usually grabs you by the throat and shakes you until you can't breathe. I wait for the pain of it.

  Nothing.

  I feel a pulse in my wrist. I notice the texture of the table laminate. I analyze the syntax of the text message. It is efficient. It conveys the necessary information.

  *She is gone.*

  Under the Asym-9, this is not a tragedy. It is an event. A state change. Status: Deceased.

  I should feel bad. This is objectively "bad." It is a loss. But the drug has switched off the suffering, and I am realizing with a cold, clinical clarity that the suffering *was* the value. Grief is the price of love. It is the pain that proves the connection existed. If I cannot pay the price, do I still own the object?

  I type a reply. *Acknowledged. Will contact funeral home after saturation cycle. End of shift.*

  It is the appropriate response. It is the logical response. It is the response of a machine.

  I put the tablet down. I look at my burned arm. I look at the message about my dead mother. They occupy the same space in my mind. Both are damages recorded on a log. One is to the skin, one is to the lineage. Neither compels me to move.

  This is what I lost. I didn't lose the hand. The med-skin will graft the burn by morning. I didn't lose my life; the drug saved me from the flinch that would have killed me in the water.

  I lost the ability to be human.

  We think pain is the enemy. We think the goal of medicine, of progress, of evolution, is to eliminate it. But pain is the tether. It's the only thing that tells us we are fragile, that we have something to lose, that we matter enough to break. When you remove the suffering, you don't get peace. You get irrelevance.

  I look at my reflection in the dark screen of the tablet. The eyes staring back are calm. Too calm. They are the eyes of a diver who just watched her mother die and felt nothing.

  Tomorrow, I will go back down. I will touch the hot pipes. I will let the suit log the damage. I will be the perfect worker. I will not flinch.

  And when I come up, and the drug finally clears my system, I know what will happen. The pain of the burn will return, sharp and demanding. But the grief? The grief might not come back. You can only ignore a signal for so long before the wire corrodes. I have treated my own heart like a manifold, something to be worked on despite the heat, despite the damage.

  I stand up and walk to the med-lock to treat the arm. As I apply the sealant, I try to summon a tear, just one. I try to force the "badness" back into the room. I want to hurt. I want to know that the loss is real.

  But the log is closed. The shift is over. And I am sitting in the quiet, safe silence of a pain that doesn't matter, wondering if I've just traded my soul for a steady hand.

  The suit beeps. A new entry. *Minor abrasion. Left thumb.*

  I swipe it away. I don't even look at the thumb.
