      *   **Silence:**
          *   Duff doesn't have a metric for "how much hard treatment." 21 years vs. Life. The theory is silent on cardinal proportionality.
      *   **Conclusion/Verdict:**
          *   Does it confirm, anomaly, or mismatch?
          *   It highlights the limits of Duff in extreme political violence. The "community" is fractured. The "preventive" element leans toward von Hirsch's critique (incapacitation masking as punishment).
          *   Verdict: It shows the theory was not meant for this scale/type of violence where the offender rejects the very polity punishing him.

  5.  **Refining and Polishing (Self-Correction during drafting):**

      *   *Check Facts:* Ensure I use the provided dates and numbers (77 dead, Aug 24 2012 judgment, etc.).
      *   *Tone:* Academic, analytical, American English.
      *   *Duff Nuance:* Make sure not to caricature Duff. He acknowledges punishment can fail. The question is whether the *structure* supports the aim.
      *   *Von Hirsch Nuance:* He allows some prevention but constrained by desert. The Norwegian extension mechanism is the main friction point.
