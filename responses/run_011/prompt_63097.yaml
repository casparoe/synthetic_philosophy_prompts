      *   *The "Agent" Question:* The prompt asks specifically about the fragmented agent (Court vs. Prison vs. Civil Court). I need to highlight how this fragmentation affects the "message."
      *   *The "Uptake" Question:* If Breivik never repents, is the punishment unjustified for Duff? Duff argues the *attempt* is justified, but the *success* is not guaranteed. However, indefinite detention based on *lack* of reform pushes this hard.

  6.  **Final Review against Constraints:**
      *   No bibliography? Yes.
      *   American English? Yes.
      *   Treat facts as given? Yes.
      *   Address all four pressure points? Yes.
      *   Conclude with a verdict? Yes.

  7.  **Final Polish:** Check flow and transitions between the Duff mapping, the von Hirsch contrast, and the four pressure points. Ensure the distinction between "communicative failure" and "structural incoherence" is clear. (Self-correction: Make sure to emphasize that the Norwegian system *defended* its approach using human rights/dignity arguments which align partially with Duff's respect for the offender, even if the outcome differs).

