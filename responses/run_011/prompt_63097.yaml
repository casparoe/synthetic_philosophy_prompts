  2.  **Deconstruct Duff's Communicative Theory:**

      *   *Core Idea:* Punishment is a secular penance. It communicates censure to the offender as a citizen.
      *   *Goal:* Repentance, reform, reconciliation.
      *   *Hard Treatment:* The medium of communication, not just an independent evil.
      *   *Community:* Presupposes a shared normative community.
      *   *Agent:* The polity (via courts/prisons).
      *   *Success:* Uptake by the offender (recognizing the wrong).

  3.  **Deconstruct von Hirsch's Desert Theory:**

      *   *Core Idea:* Punishment is censure anchored in desert.
      *   *Constraint:* Proportionality (ordinal and cardinal). Punishment must fit the crime.
      *   *Rehabilitation:* Cannot extend punishment beyond desert.
      *   *Focus:* Backward-looking (the deed), not forward-looking (dangerousness).

  4.  **Drafting - Section by Section:**

      *   **Introduction:** Set the scene. The Breivik case is a stress test. Introduce Duff and von Hirsch.
      *   **Mapping Duff:**
          *   *Agent:* It's fragmented. Court (sentence), Prison Service (execution), Civil Courts (conditions). This complicates the "unified voice" Duff often assumes.
          *   *Content:* "You violated our shared norms." But the sentence (21 years + extension) mixes censure with risk management.
          *   *Audience:* Primarily the offender, but also the public (reaffirming norms).
          *   *Uptake:* Breivik refused uptake. Does this mean failure? Duff says punishment is *attempted* communication, but success requires repentance.
      *   **Contrast with von Hirsch:**
          *   Von Hirsch demands proportionality. 21 years for 77 murders? Seems low by retributive standards (unless capped by principle).
          *   Preventive detention is the killer here. Von Hirsch generally opposes indeterminate sentences based on dangerousness because they violate desert.
          *   Norway's defense: Human rights/dignity caps punishment, but safety requires containment.
      *   **Pressure Point 1: Legitimacy/Membership:**
          *   Breivik denied the court's authority. Duff assumes membership. If the offender rejects the community, can the community punish communicatively? Duff might say they punish *to* call them back, but if the rejection is total (political violence against the state), the channel is broken.
      *   **Pressure Point 2: Sanity/Responsibility:**
          *   Breivik wanted punishment (censure), not treatment (medicalization).
          *   First psych report (schizophrenia) would have moved him out of the communicative sphere (medical treatment vs. penal censure).
          *   Duff needs a competent agent. If the first report was right, Duff's theory wouldn't apply (no moral agency). The fact the court chose the second report *enabled* Duff's framework, but the defendant's preference for censure aligns oddly well with retributivism, not necessarily communicative reform.
      *   **Pressure Point 3: Preventive Detention:**
