  The gavel strikes the wood to mark the flaw,
  One man stands guilty, staring at the floor.
  The other rises, bound by what he saw,
  He holds the purse, but not the lash in store.
  No coin can buy the nerve that feels the claw,
  Though he stands where one alone stood before,
  The gold slips free when willing hands withdraw,
  The body keeps the wound meant to restore.

  Yet if we join as limbs beneath one head,
  Our debt becomes the blood that flows through all.
  Where nodding assent makes the suffering spread,
  The stripe is ours, claimed by the willing fall.
  He loses name to merge within the sum,
  Or pays in nod, while flesh remains undone.
