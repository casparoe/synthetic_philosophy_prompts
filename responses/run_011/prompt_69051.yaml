prompt: |-
  I run governance at a smallish research nonprofit — about 45 staff, a board of ten voting members plus a chair who only votes to break ties — and I've spent the last year trying to push through one specific reform: the board should stop voting directly on bottom-line questions and instead vote on a published list of premises, one simple-majority vote each, with the conclusion then following mechanically from a rule we've written down in advance. My argument is basically the discursive dilemma. If you vote conclusion-first you can end up with the group asserting something that flatly contradicts the group's own stated reasons, and which would have come out the other way if you'd have asked about the reasons instead. I've also been leaning, lightly and without the jargon, on the group-agency line of thinking: an org that reasons premise-first can be held to account for *why* it decided, whereas "the board voted 6-4" gives you nothing to argue with afterwards and no way to spot that the board is flip-flopping across adjacent cases. I've been reading rationalist blogs since the old Sequences days so my first instinct was to go find the relevant impossibility theorem and check whether it kills my rule; my current read is that the List/Pettit results say you can't have collective consistency plus anonymity plus some independence-ish condition all at once, and that premise-based procedures buy consistency by giving up something else that people care about. Please sanity-check that framing, but mostly I want prep.

  In six weeks I get 45 minutes plus Q&A at a workshop on institutional design, and the room will be almost entirely economists and legal academics: two social-choice people who think in axioms and manipulability and will want to know exactly which conditions my rule sacrifices and which it keeps; three or four empirical scholars of appellate courts who study how panels actually vote, including whether judges trade votes across issues; a couple of practitioners who write governance documents for standards bodies and foundations; one political scientist who works on citizens' assemblies. No philosophers of social science, and nobody wholl have thought hard about what a group agent is supposed to be. Draft my Q&A prep sheet: the eight-ish objections this audience will actually raise — not the ones a philosophy crowd would raise — roughly in the order they'll come, each phrased the way an economist or a court scholar would phrase it, with a two-minute reply and a note on where that reply is softest. Rank them by how much damage they'd do if I fumble. Tell me what to concede in the first five minutes, because I suspect at least one of these is basically correct and I'd rather own it than get caught defending it. And give me the question I'm praying doesn't come. My guess is it's some version of "so who writes the premise list?", becuase in our setup the ledger is drafted by staff (me), any two board members can propose adding a premise or splitting one in two, and it's obvious that different decompositions of the same decision can produce different outcomes — which looks like it reimports exactly the arbitrariness I claimed to be fixing. If the real weak joint is somewhere else, tell me where and help me think about how to live with it.

  Here's a typical ledger so the objections have something to bite on. Question: do we accept a three-year grant from a defense-adjacent funder? P1: the terms give them no review or approval rights over anything we publish. P2: taking the money creates no conflict that a board member or staffer would have to disclose. P3: we can deliver the funded work without displacing program activity we currently rank higher. Rule: accept if and only if all three pass. Two more things I want covered. First, strategy — once the premises mechanically determine the outcome, someone who only cares about the bottom line has an obvious incentive to vote against a premise they actually believe, and I understand there are results saying premise-based rules are manipulable in ways conclusion-based rules aren't, or at least differently; I need a real answer for the social-choice people, not a hand-wave about how small boards are and everyone knows each other. Second, flag which of the objections are actually disputes about the criterion rather than about my rule: half that room scores a voting procedure by whether it produces good decisions, the other half by whether it treats members' judgments as equals, and I expect a lot of the argument to be people scoring me on the wrong axis. If one objection is genuinely fatal for the rule as I've described it, say so plainly and tell me the smallest patch that survives — e.g. restricting premise-first voting to some defined class of decisions. No reading list or bibliography, please; I won't have time to chase papers and I'd rather just have the arguments and the replies in front of me.
reasoning: |-
  Here's a thinking process that leads to the suggested Q&A prep sheet:

  1.  **Analyze the User and Context:**
      *   **User Role:** Governance lead at a small research nonprofit (45 staff, 10 voting board members + chair).
      *   **Goal:** Implement a "premise-based procedure" (PBP) instead of "conclusion-based procedure" (CBP) for board voting.
      *   **Rationale:** Avoid the Discursive Dilemma (inconsistency between reasons and conclusion), enhance group agency/accountability, prevent flip-flopping.
      *   **Audience:** Workshop on institutional design (45 mins + Q&A). Attendees: Economists, Legal Academics (Social Choice, Empirical Court Scholars, Practitioners, Political Scientist). *No* social science philosophers.
      *   **Constraints:** No reading list/bibliography. Need 8-ish objections ranked by damage potential. Need 2-minute replies + soft spots. Need concession strategy (first 5 mins). Need to address manipulability (strategy). Need to identify criterion disputes (good decisions vs. equal treatment). Need to identify the "fatal" objection (likely "Who writes the premise list?").
      *   **Specific Example:** Grant acceptance based on 3 premises (P1: No review rights, P2: No conflict, P3: No displacement). Rule: Accept iff all pass.
      *   **User's Background:** Rationalist/Sequences reader, familiar with List/Pettit impossibility results.

  2.  **Deconstruct the Core Theoretical Tension:**
      *   **The Discursive Dilemma:** Voting on premises (PBP) vs. Voting on conclusion (CBP) can yield different results.
      *   **List & Pettit (2002/2004):** You can't have Anonymity, Systematicity (neutrality/independence), and Consistency simultaneously. PBP sacrifices Systematicity/Neutrality (the structure of the agenda matters). CBP sacrifices Consistency (reasons might not align with outcome).
      *   **The User's specific vulnerability:** The "Agenda Power" problem. Who defines the premises? How they are framed/split/combined changes the outcome. This is the "reimported arbitrariness" the user suspects.

  3.  **Drafting the Objections (Targeting the Audience):**
      *   *Audience 1: Social Choice Theorists (Economists).* Care about axioms, manipulability, impossibility theorems.
      *   *Audience 2: Court Scholars (Legal).* Care about vote trading (logrolling), panel consistency, strategic behavior.
      *   *Audience 3: Practitioners (Governance).* Care about efficiency, deadlock, usability.
      *   *Audience 4: Political Scientist (Assemblies).* Care about representation, deliberation quality.

      *   *Objection 1 (The Fatal One): Agenda Control/Decomposition.* (Who writes the list? Framing effects).
      *   *Objection 2 (Strategic Voting): Manipulability.* (Vote against a premise you believe to kill the conclusion).
      *   *Objection 3 (Efficiency/Transaction Costs):* It takes too long.
      *   *Objection 4 (Responsibility/Accountability):* Diffusion of responsibility (I voted for P1, P2, but not P3, so the bad outcome isn't *my* fault).
      *   *Objection 5 (The "Good Decision" Criterion):* PBP might lead to substantively worse outcomes than CBP (epistemic quality).
      *   *Objection 6 (Logrolling/Trade-offs):* Premises prevent necessary compromise (I'll support your P1 if you support my P2).
      *   *Objection 7 (Rigidity/Precedent):* Hard to adapt to edge cases.
      *   *Objection 8 (The "Tie-Breaker" Issue):* The Chair's role in premise voting vs. conclusion voting.

      *Refining for the specific prompt:* The user wants them ranked by damage. The "Who writes the list" is the biggest threat. Strategic voting is second (theorists love this). Efficiency is third (practitioners).

  4.  **Developing the Replies & Soft Spots:**
      *   *Agenda Control:* Acknowledge it. Mitigation: Supermajority to change the ledger, staff drafting + board ratification of the *structure* before the *content*. Soft spot: It *is* arbitrary, just transparently so.
      *   *Strategic Voting:* Acknowledge Gibbard-Satterthwaite implications. PBP is manipulable. Reply: In small boards, reputation costs > gain from manipulation. Soft spot: If stakes are high enough, reputation doesn't matter.
      *   *Efficiency:* Reply: Front-loads time, saves time on appeals/clarification later. Soft spot: It *does* slow down the meeting.
      *   *Accountability:* Reply: Actually *increases* accountability (record shows exactly where the break was). Soft spot: Allows members to hide behind "I only voted on the premise."

  5.  **Addressing Specific User Requests:**
      *   *Concession in first 5 mins:* Must concede the "Agenda Power" vulnerability. It's the strongest point against them. Own it as a feature (transparency of power) rather than a bug (hidden power).
      *   *Strategy/Manipulability:* Need a real answer. PBP *is* manipulable. The defense is context-specific (repeat play, small N).
      *   *Criterion Disputes:* Distinguish between "Epistemic Quality" (getting the right answer) vs. "Procedural Fairness" (treating judgments equally). PBP favors consistency/accountability over pure preference aggregation.
      *   *The "Praying Doesn't Come" Question:* User guessed "Who writes the premise list?" I agree, but I need to make sure I frame it as the *structural* vulnerability (decomposition arbitrariness).
      *   *Fatal Flaw:* If the premise decomposition is truly arbitrary, the rule is unstable. Patch: Restrict PBP to *policy* decisions, not *ad hoc* grants, or require a separate vote on the *logic structure* before the *factual premises*.

  6.  **Drafting the Content (Iterative refinement):**

      *   *Tone:* Professional, direct, acknowledging the expertise in the room. No jargon without explanation.
      *   *Structure:*
          1.  Opening Concessions (The "Pre-buttal").
          2.  The 8 Objections (Ranked).
          3.  Strategic Voting (Deep dive).
          4.  Criterion Disputes (Framing).
          5.  The Fatal Flaw & Patch.

      *(Self-Correction during drafting)*: Make sure I don't get too bogged down in List/Pettit math. The audience knows it; they want to know how the user handles the *implications*. The user asked for "two-minute reply" style. Keep it punchy.
      *Check the "Chair" detail:* Chair votes only on ties. In PBP, ties on premises could stall the conclusion. Need to address that.
      *Check the "Smallish Nonprofit" detail:* 45 staff, 10 board. This is a "small committee" context, not a mass election. This changes the strategic voting calculus (reputation matters more).

  7.  **Final Review against constraints:**
      *   8 objections? Yes.
      *   Ranked by damage? Yes.
      *   2-min replies + soft spots? Yes.
      *   Concession strategy? Yes.
      *   Strategy/Manipulability section? Yes.
      *   Criterion disputes flagged? Yes.
      *   Fatal flaw identified? Yes.
      *   No bibliography? Yes.

  8.  **Final Polish:** Ensure the distinction between "Agenda Control" (who sets the list) and "Decomposition Arbitrariness" (how the logic is cut) is clear, as these are slightly different but related attacks. The user's guess ("Who writes the list") is the practical version of the theoretical "Systematicity" violation. I will combine them for maximum impact.

      *Wait, one nuance:* The user mentioned "Group Agency." The legal/econ crowd might not buy "Group Agency" as a normative goal. I need to translate "Group Agency" into "Consistency over Time" and "Precedent Management," which lawyers care about.

      *Let's finalize the ranking:*
      1. Agenda/Decomposition Power (Fatal).
      2. Strategic Manipulability (Theorists).
      3. Loss of Compromise/Logrolling (Court Scholars).
      4. Epistemic Quality (Does it yield better decisions?).
      5. Efficiency/Transaction Costs.
      6. Responsibility Diffusion.
      7. Rigidity.
      8. The Chair's Role (Technical but annoying).

      *Wait, the "Criterion Dispute" instruction:* I need to explicitly flag which objections are about "Good Decisions" vs "Equal Treatment." I'll add a tag to each objection.

      *Let's write it.*
answer: |-
  # Q&A Prep Sheet: Premise-Based Board Governance

  **Context:** 45-min workshop, audience of economists, legal scholars, practitioners.
  **Goal:** Defend Premise-Based Procedure (PBP) without getting bogged down in social-choice impossibility theorems.
  **Tone:** Concede the theoretical vulnerabilities early; pivot to practical institutional benefits (consistency, accountability, precedent).

  ---

  ## Part 1: The Opening Concession (First 5 Minutes)
  *Do not wait for them to ask. Disarm the strongest objection by owning it as a design feature.*

  **The Concession:** "I want to start by acknowledging the elephant in the room. The List-Pettit results tell us that if we want collective consistency, we have to give up something. My proposal sacrifices **agenda neutrality**. By committing to a premise-based rule, we are admitting that *how* we decompose a decision matters as much as the decision itself. Different decompositions yield different outcomes. In my current setup, staff drafts the ledger, and the board can amend it. This means agenda power is real. I am not claiming this rule removes arbitrariness; I am claiming it makes the arbitrariness **transparent** and **contestable** before the vote, rather than hiding it inside a black-box conclusion vote."

  **Why this works:** It shows you know the theory (List/Pettit) without lecturing them. It frames the vulnerability as a trade-off for transparency, which lawyers and governance practitioners value.

  ---

  ## Part 2: The Eight Objections (Ranked by Damage Potential)

  *Format: Objection (Audience Source) → 2-Minute Reply → Soft Spot → Criterion Tag*

  ### 1. The Decomposition Arbitrage (Fatal)
  **Objection:** "If I can split 'Conflict of Interest' into two premises instead of one, I change the majority threshold required to kill the grant. Since you haven't fixed the decomposition rule, the person who writes the ledger controls the outcome. You haven't solved the discursive dilemma; you've just moved the manipulation point upstream." (Social Choice / Legal)
  **Reply:** "Correct. That is why the ledger structure is a standing policy, voted on annually, not ad hoc per grant. For specific cases, we allow any two board members to propose splitting a premise, but it requires a 2/3 vote to *change the logic* before we vote on the *facts*. This raises the cost of manipulation. We accept that decomposition isn't neutral, but we force the fight about the decomposition to happen in the open, on the record, before the factual vote."
  **Soft Spot:** If the board is polarized, the 2/3 threshold to fix the logic might deadlock the process entirely, reverting to status quo bias.
  **Criterion:** **Procedural Fairness** (Who controls the agenda).

  ### 2. Strategic Voting on Premises
  **Objection:** "Under PBP, I can vote 'No' on Premise 1 (which I actually believe is True) to ensure the Conclusion fails, because I know my 'No' is more pivotal on the premise than on the conclusion. This is manipulable in ways conclusion voting isn't." (Social Choice)
  **Reply:** "Theoretically, yes. PBP is susceptible to 'premise manipulation.' However, in a small, repeat-play board of ten, reputation costs dominate. If you vote against a fact you admit is true, it's on the record. In a conclusion vote, you can hide behind 'overall judgment.' In a premise vote, lying about a premise is easily exposed in future deliberations. We trade theoretical strategy-proofness for practical accountability."
  **Soft Spot:** If the stakes are high enough (e.g., existential funding), reputation costs vanish, and sophisticated actors will game the premises.
  **Criterion:** **Procedural Fairness** (Truthful revelation of judgment).

  ### 3. Killing Necessary Compromise (Logrolling)
  **Objection:** "Appellate panels often trade votes: 'I'll join your opinion on Case A if you join mine on Case B.' Premise voting atomizes decisions. It prevents members from packaging their judgments. You might get logical consistency, but you lose the political coalitions needed to get anything done." (Court Scholars)
  **Reply:** "That is a feature, not a bug, for *governance* decisions. Logrolling is appropriate for legislative bargaining, but dangerous for fiduciary oversight. If a board member needs to trade a vote on 'Conflict of Interest' to get a grant approved, that suggests the grant shouldn't be approved. We want to inhibit trade-offs on compliance and risk premises."
  **Soft Spot:** Some "premises" are actually value judgments (e.g., P3: Displacing higher-ranked work). Blocking trade-offs there might cause good projects to die unnecessarily.
  **Criterion:** **Outcome Quality** (Efficiency of decision-making).

  ### 4. Epistemic Quality (The "Right Answer" Problem)
  **Objection:** "Why assume the premise-vote yields a better decision? If 6 members think the grant is bad overall, but 6 think the 'No Review Rights' premise is True, you force acceptance. You're overruling the aggregate wisdom of the board on the bottom line." (Economists / Practitioners)
  **Reply:** "We aren't assuming PBP finds the 'true' answer more often. We assume it produces a more *defensible* answer. If the board accepts a grant while 6 members believe it violates our risk policy (P2), the organization is vulnerable. PBP ensures the bottom line never contradicts the board's stated risk tolerance. Consistency is valued over raw aggregation."
  **Soft Spot:** If the premises are poorly chosen, PBP systematically produces worse substantive outcomes than a direct vote.
  **Criterion:** **Outcome Quality** (Epistemic accuracy).

  ### 5. Transaction Costs / Efficiency
  **Objection:** "This sounds exhausting. Voting on three premises plus the logic rule takes four times as long as one vote. For a small nonprofit, time is a scarce resource. Are you sure the consistency gain is worth the meeting time?" (Practitioners)
  **Reply:** "It front-loads the time cost. We spend more time in the meeting, but less time in cleanup. We eliminate post-hoc second-guessing ('I didn't realize we were waiving review rights'). It also reduces the need for emergency board calls later because the logic was vetted upfront. For high-stakes decisions (grants >$X), the time cost is justified."
  **Soft Spot:** For low-stakes decisions, this is bureaucratic overkill.
  **Criterion:** **Outcome Quality** (Resource allocation).

  ### 6. Diffusion of Responsibility
  **Objection:** "If the grant goes south, members will say 'I only voted on Premise 1, I didn't vote for the Conclusion.' It lets them off the hook for the aggregate decision." (Legal / Governance)
  **Reply:** "The opposite is true. In conclusion voting, a member can say 'I voted No' but we don't know why. In PBP, if they voted Yes on P1 (No Review Rights) and the funder later censors us, their specific liability is clear. It individualizes responsibility for specific risk factors rather than diffusing it into a general 'No'."
  **Soft Spot:** Members may claim they viewed the premise as necessary but not sufficient, and feel the rule forced their hand.
  **Criterion:** **Procedural Fairness** (Accountability).

  ### 7. Rigidity / Precedent Trap
  **Objection:** "Once you set a rule (Accept iff P1+P2+P3), you create a precedent. Next time, if P1 fails but the grant is amazing, you're bound to reject it. You're binding future boards to today's logic." (Legal / Political Scientist)
  **Reply:** "The rule is not binding on future boards; the *ledger* is reviewable. But yes, we intend to create friction against flip-flopping. If the board wants to accept a grant where P1 fails, they must first vote to amend the logic rule. That requires explaining *why* the previous logic was wrong. That friction is the point."
  **Soft Spot:** It creates a high bar for adapting to novel situations (black swans) that don't fit the premise structure.
  **Criterion:** **Outcome Quality** (Adaptability).

  ### 8. The Chair's Tie-Break
  **Objection:** "Your Chair only votes on ties. In PBP, you might have a tie on P1, a tie on P2, and a clear majority on P3. Does the Chair vote on every tie? Does one Chair tie-break effectively veto the conclusion?" (Practitioners)
  **Reply:** "Yes, the Chair breaks ties on premises. This gives the Chair significant power over the logic path. We mitigate this by requiring the Chair to justify tie-breaks in writing against the published criteria. It concentrates power, but visibly."
  **Soft Spot:** This creates a perverse incentive for the Chair to manipulate premise ties to steer the outcome without voting on the conclusion.
  **Criterion:** **Procedural Fairness** (Power distribution).

  ---

  ## Part 3: Strategic Voting (The "Real Answer" for Economists)

  *Don't hand-wave. Acknowledge the Gibbard-Satterthwaite implication.*

  **The Argument:** "You are right that PBP is not strategy-proof. A member can vote against a premise they believe to be true to manipulate the conclusion. However, there are two constraints in my specific context that mitigate this:
  1.  **Small N, Repeat Play:** In a board of 10 who meet quarterly for years, the shadow of the future is long. Being caught voting against a stated fact damages credibility more than losing a single vote.
  2.  **Public Reasons:** In conclusion voting, strategy is hidden in the 'black box' of judgment. In PBP, strategy requires lying on a specific record item. If I vote 'False' on 'No Conflict of Interest' when one clearly doesn't exist, that is falsifiable.
  **The Trade:** We are accepting theoretical manipulability to reduce *undetectable* manipulation. We make the gaming visible."

  ---

  ## Part 4: Criterion Disputes (Flagging the Axis)

  *Be explicit when an objection is talking past you.*

  *   **If they argue "This might produce worse grants":** They are scoring on **Epistemic Quality** (getting the right outcome). Your metric is **Consistency/Accountability** (maintaining group agency over time). Acknowledge the trade: "I cannot guarantee better grants. I can guarantee the board's decisions won't contradict its own stated risk policy."
  *   **If they argue "This treats members unequally" (Agenda Power):** They are scoring on **Procedural Fairness** (Anonymity/Neutrality). Acknowledge the trade: "I am sacrificing anonymity of the agenda-setter to gain consistency of the group agent. I prefer a consistent agent with a visible agenda-setter to an inconsistent agent with a neutral agenda."

  ---

  ## Part 5: The Question You're Praying Doesn't Come (And The Fatal Flaw)

  **The Question:** "You said staff drafts the ledger. If I'm a board member who wants to kill defense grants, I pressure the staff to split 'Defense Adjacency' into three separate premises. If I want to pass them, I pressure staff to bundle them. Since the staff works for the board, isn't this just rule by the faction that controls the staff/agenda?"

  **Why it's Fatal:** It attacks the **Systematicity** condition directly. It shows that PBP doesn't remove power; it concentrates it in the *drafting* phase, which is less visible than the *voting* phase.

  **The Smallest Patch That Survives:**
  **Restrict PBP to "Policy Class" decisions, not "Ad Hoc" decisions.**
  *   **The Fix:** Do not use PBP for individual grant approvals (where decomposition can be tailored to kill/save a specific grant). Use PBP for **adopting the Grant Policy itself**.
  *   **How it works:**
      1.  Board uses PBP to vote on the *Policy Ledger* (e.g., "We will never accept money with review rights"). This happens once a year.
      2.  Individual grants are then **administrative determinations** against that Ledger. Staff certifies if the grant meets the pre-voted premises.
      3.  Board only votes on the Conclusion (Accept/Reject) for individual grants, *unless* Staff certifies a premise failure, in which case the Board must vote to waive the Policy (using PBP again).
  *   **Why this works:** It moves the "Decomposition Arbitrage" to the annual policy meeting (high visibility, low frequency) rather than the individual grant meeting (low visibility, high frequency). It prevents tailoring the logic to the specific case.

  **If you must keep your current setup:** Concede that agenda power is the weak joint. "That is why I proposed the 2/3 vote to amend the ledger mid-stream. It requires a supermajority to change the logic for a specific case, preventing a simple majority from gaming the decomposition to kill a specific grant."

  ---

  ## Summary Checklist for the Room
  1.  **Don't claim PBP is "more democratic."** It isn't. It's more *consistent*.
  2.  **Don't claim PBP is "strategy-proof."** It isn't. It makes strategy *visible*.
  3.  **Do claim PBP protects the organization from itself.** It prevents the board from voting "Yes" while simultaneously voting that the risks are unacceptable.
  4.  **Watch the Court Scholars.** They care about *vote trading*. Emphasize that governance is not legislation; logrolling on risk premises is a bug, not a feature.
  5.  **Watch the Economists.** They care about *axioms*. Admit you violate Neutrality/Systematicity to preserve Consistency.
  6.  **Watch the Practitioners.** They care about *time*. Admit it slows the meeting but speeds up implementation/appeals.
