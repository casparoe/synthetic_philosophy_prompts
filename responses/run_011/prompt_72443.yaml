prompt: |-
  Third-year philosophy PhD here, supposed to be turning my dissertation proposal in next month on decision theory under imperfect information, and instead I've spent the last week unable to think about anything else. My advisor is on sabbatical in Lisbon, my reading group has split into two camps over an arguement I sketched on the board, and I can't tell which camp is right. Half of them think it's a clean refutation of updateless decision theory and I should write it up; the other half think it proves too much and therefore proves nothing. I'd rather hear from someone with no stake in either camp.

  Some setup so the argument is assessable on its own terms. Updateless decision theory, as I understand it, says that when you're standing at a choice node you shouldn't re-decide on the basis of what you've since observed. You should instead have picked, before you had any of that evidence, the policy — the whole function from observations to actions — that maximizes expected utility as assessed from your prior, and now you just execute it, even if your current credences point the other way. The motivation is Newcomb-style cases where your observation is tangled up with your own act, plus cases like the absent-minded driver and Sleeping Beauty where what you learn is only which copy or which day you are. I find all that appealing. Here's what I built against it anyway:

  (1) UDT: what it's rational to do at a choice node is to carry out the policy that, evaluated from your prior before you had any of the evidence you now have, maximizes expected utility.
  (2) What a policy prescribes at a node is settled once, at selection; later evidence can't rewrite it.
  (3) So at the node, UDT tells you to do what your prior would have had you do, no matter what you've since learned.
  (4) Sometimes what you've since learned changes the expected utilities outright — say a reliable technician walks in and tells you the coin you're betting on already came up heads.
  (5) In those cases UDT tells you to bet as though you'd never heard, i.e. to act against your own current assessment of the odds.
  (6) Any theory that ever tells an agent to act against her own current assessment of the odds isn't a theory of rational choice.
  (7) So UDT isn't a theory of rational choice.
  (8) The standard repair — of course the policy is a function of observations, so it can say "if you hear heads, bet heads" — doesn't save it. Either the prior gave that news positive probability, in which case UDT's verdict at the node is just what an ordinary conditionalizing agent reaches there, so UDT stops disagreeing with the standard view in any case where it was supposed to, contradicting what its fans say about Newcomb; or the prior gave it probability zero, in which case the policy is silent about exactly the surprising evidence that made you reach for a decision theory in the first place.
  (9) So UDT is either irrational or empty.

  My friend Mira says the whole thing is universal acid and that I should be embarassed. Her objection is to (6), not from UDT's side: if a theory is disqualified for ever telling you to act against your current assessment of the odds, then every form of self-binding is disqualified too. I precommit in September not to check my phone during writing hours; every October morning my current assessment is that five minutes costs nothing and the paper would benefit from the citation. Odysseus at the mast is the textbook version. And a causal decision theorist who pays to precommit before Newcomb — which everyone, including me, thinks is the rational move if you can buy it — then acts against her own assessment at the node. So (6) refutes precommitment as such, precommitment is sometimes plainly rational, therefore (6) is false and my argument is worthless. She won't say which of (2) through (5) actually breaks, just that something is being slid around and she isn't doing my work for me.

  So: which step do you reject, and why did it look unobjectionable to me when I wrote it down — what's the reading under which it's true, and the reading under which the argument needs it? For what it's worth I'm most attached to (4) and (5); I really don't want to concede that learning something can leave it rational to act as though you hadn't. I'm least attached to (8), which I added at 2am and have always suspected of doing shady work, but I don't see how (1)-(7) gets me anywhere interesting without it. And I do want to keep UDT's answer in Newcomb, because I think one-boxing is right and I think the causal people are wrong.

  Then price out the options for me. If you reject (6), tell me what UDT is actually committed to about genuinely surprising evidence, and whether the silence in the second horn of (8) is a bug specific to UDT or a feature it shares with every view that makes choices ex ante. If you reject something earlier, say what the policy/act distinction has to look like for UDT to survive (4) without collapsing into ordinary conditionalizing. And if you think Mira is right that the argument proves too much, explain why the precommitment analogy is load-bearing rather than just rhetorically pretty — or, if you think it's merely pretty, tell me where the disanalogy with Odysseus and the phone actually sits.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Context:**
      *   **User:** Third-year philosophy PhD student.
      *   **Topic:** Decision Theory (specifically Updateless Decision Theory - UDT).
      *   **Situation:** Stuck on dissertation proposal, advisor away, reading group split.
      *   **Goal:** Wants an outside perspective on a specific argument against UDT. Needs to know which premise to reject, why it looked plausible, and the implications for their dissertation.
      *   **Tone:** Academic, rigorous, slightly stressed/overwhelmed ("unable to think about anything else"), but clearly competent (knows the literature, constructs formal-looking arguments).
      *   **Key Constraint:** Wants to keep UDT's answer in Newcomb (one-boxing) but thinks UDT fails in cases of "genuinely surprising evidence."

  2.  **Analyze the Argument:**
      *   (1) Definition of UDT: Maximize EU from the prior via a policy.
      *   (2) Policy is fixed at selection.
      *   (3) At the node, do what the prior dictated.
      *   (4) Sometimes new evidence changes EU (e.g., technician says coin is heads).
      *   (5) In those cases, UDT says act as if you hadn't heard (follow the prior policy).
      *   (6) Normative Principle: Acting against current assessment of odds is irrational.
      *   (7) Conclusion: UDT is irrational.
      *   (8) The "Repair" Objection: If policy conditions on evidence, it collapses to CDT/EDT (if prob > 0) or is silent (if prob = 0).
      *   (9) Final Conclusion: UDT is irrational or empty.
      *   **Mira's Objection:** Premise (6) kills *all* precommitment (Odysseus, Newcomb precommitment). Therefore (6) is false.

  3.  **Evaluate the Premises (Internal Critique):**

      *   **Premise (1)-(3):** Standard characterization of UDT. Accurate enough for this context.
      *   **Premise (4):** "Sometimes what you've since learned changes the expected utilities outright." This is the crux. In standard Bayesian updating, evidence changes *credences*, which changes *expected utilities*. But UDT doesn't update credences for the sake of action selection; it updates the *index* of the policy.
      *   **Premise (5):** "UDT tells you to bet as though you'd never heard." This depends on whether the policy *includes* the observation. If the policy is $P: Observation \to Action$, then hearing "Heads" triggers the "If Heads" branch. The user seems to assume the policy is a *constant action* rather than a *function*.
      *   **Premise (6):** "Any theory that ever tells an agent to act against her own current assessment of the odds isn't a theory of rational choice." This is the target Mira hit. It conflates *act-evaluation* with *policy-evaluation*.
      *   **Premise (8):** The "Collapse" argument. This is a known objection (the "tickle defense" or similar updating objections). If the prior assigns prob 0 to the observation, the conditional is undefined. If prob > 0, why not just update?

  4.  **Identify the Philosophical Core:**
      *   The tension is between *ex ante* rationality (policy selection) and *ex post* rationality (act selection given current information).
      *   UDT prioritizes *ex ante* optimality.
      *   The user's intuition (and Premise 6) prioritizes *ex post* optimality (acting on current credences).
      *   Mira is right that (6) is too strong because it bans rational precommitment.
      *   However, the user's intuition about "genuinely surprising evidence" (Prob = 0 events) is a known weakness in UDT/EDT/CDT frameworks (the problem of logical omniscience or zero-probability events).

  5.  **Formulate the Response Strategy:**
      *   **Validate:** Acknowledge the stress and the quality of the argument. It's a good argument, which is why the reading group is split.
      *   **Diagnose the Split:** Explain *why* the camps are split. One camp sees the precommitment analogy (Mira); the other sees the "ignoring evidence" problem (User).
      *   **Address Premise (6):** This is the weakest link, as Mira noted. But explain *why* it looked true (the distinction between *akrasia* and *precommitment*).
      *   **Address Premise (8):** This is actually the more dangerous premise for UDT. The "collapse" problem is real.
      *   **Address the "Surprising Evidence" (Prob 0):** This is where the dissertation gold lies. UDT struggles with logical uncertainty and zero-probability events.
      *   **Recommendation:** Don't scrap UDT. Refine the target. The argument doesn't kill UDT; it highlights the tension between *dynamic consistency* and *ex ante optimality*.
      *   **Dissertation Advice:** Pivot from "Refuting UDT" to "The Limits of Updatelessness regarding Zero-Probability Evidence."

  6.  **Drafting the Content (Iterative refinement):**

      *   *On (6):* Mira is right. (6) conflates "current assessment of odds" with "current assessment of *causal/counterfactual* structure." In Newcomb, your current assessment says "Box B has $1M or $0", but UDT says "Taking one box *makes* it have $1M." So you aren't acting against odds; you're acting against a naive causal reading. *However*, in the Technician case, the causal structure *has* changed. The technician breaks the correlation. UDT *should* update here. Why doesn't it? Because the policy was fixed.
      *   *Correction:* UDT policies *are* functions of observations. So if the technician says "Heads", the policy says "Bet Heads". The user's Premise (5) assumes the policy *ignores* the observation. That's a straw man of UDT. UDT says "Choose the function $f(obs)$ that maximizes prior EU." If $f$ = "If technician says Heads, bet Heads", then UDT *does* bet Heads.
      *   *So where is the bite?* The bite is in Premise (8). If the observation was assigned Prob 0 in the prior (genuinely surprising), the conditional expected utility is undefined. The policy has no instruction for this node.
      *   *Refining the critique:* The argument isn't that UDT ignores evidence (Premise 5 is false if policies condition on evidence). The argument is that UDT cannot handle *unforeseen* evidence (Premise 8's second horn).
      *   *Mira's point:* Precommitment is rational even if it feels like acting against current odds. But precommitment usually covers *foreseen* temptations. The Technician case is *unforeseen*.
      *   *Conclusion:* Reject (5) as stated (UDT policies condition on info), but accept the spirit of (8). The real problem is logical omniscience/zero-probability.

  7.  **Structuring the Advice:**
      *   **Empathy/Validation:** You're close to something real, don't panic.
      *   **The Verdict:** Mira is right about (6), but you're right about (8). The argument fails as a *reductio* of UDT generally, but succeeds as a critique of UDT's handling of zero-probability events.
      *   **Step-by-Step Breakdown:**
          *   (1)-(3): Fine.
          *   (4)-(5): Mischaracterization. UDT policies *do* use observations. You aren't acting *as if* you didn't hear; you are executing a plan that anticipated hearing.
          *   (6): False (Mira's point). Distinguish between *time-slice rationality* and *temporal rationality*.
          *   (8): This is the killer. The "Zero-Probability Problem."
      *   **Dissertation Pivot:** Don't try to kill UDT. Try to solve the "Zero-Probability/Logical Omniscience" problem for Updateless views. This is publishable.
      *   **Newcomb:** You can keep one-boxing. UDT handles Newcomb because the correlation is in the prior. The Technician case breaks the correlation. UDT should ideally handle both, but standard formulations struggle with the break.

  8.  **Refining the Tone:**
      *   Keep it peer-to-peer. Use technical terms correctly (dynamic consistency, ex ante/ex post, logical omniscience).
      *   Be encouraging but critical.
      *   Address the "2am premise" suspicion regarding (8).

  9.  **Final Polish:** Check against the user's specific requests ("price out the options," "which step do you reject," "why did it look unobjectionable").

      *   *Self-Correction during drafting:* Wait, if UDT policies condition on observations, does it collapse to EDT? In Newcomb, EDT one-boxes. In Smoking Lesion, EDT smokes (usually). UDT one-boxes and doesn't smoke. The difference is *subjunctive dependence* vs *evidential dependence*. If the policy conditions on observations, does it capture subjunctive dependence? Yes, because the *selection* of the policy considers the logical connection between the policy and the predictor.
      *   *Crucial distinction:* The policy is selected *before* the predictor makes the prediction (logically). So the policy selection influences the prediction. The *execution* just reads the observation.
      *   *So Premise (8)'s first horn:* "UDT stops disagreeing with the standard view." False. UDT disagrees with CDT/EDT on *which* function is optimal, even if both use functions.
      *   *So Premise (8)'s second horn:* This is the real issue. What if the observation wasn't in the domain of the function?

      *   *Okay, the plan is solid.* Focus on (5) being a mischaracterization and (8) being the real battleground. (6) is definitely false but interestingly false.

  10. **Final check of the prompt requirements:**
      *   Which step to reject?
      *   Why did it look unobjectionable?
      *   Price out the options.
      *   Address Mira's precommitment analogy.
      *   Address the Newcomb intuition.

      *(Self-Correction)*: I need to be careful not to just say "Mira is right." The user wants to know *why* the argument felt compelling. The feeling comes from conflating *ignoring evidence* with *executing a plan that incorporates evidence.*

      Let's write.
answer: |-
  First, take a breath. You are in the "third-year trough," and what you are experiencing is not a failure of competence but a feature of the work. You have stumbled onto a genuine tension in the literature (the tension between *ex ante* optimality and *dynamic consistency*), and your reading group is split because the literature is split. You have not wasted a week; you have found your dissertation problem.

  Here is the assessment you asked for, from someone with no stake in your department's politics.

  ### The Verdict

  **Mira is right about (6), but you are right to be suspicious of (8).**

  Your argument as it stands does not refute UDT. It refutes a straw man of UDT (in premises 4–5) and relies on a normative principle (6) that is too strong for any diachronic decision theory. However, the *intuition* driving the argument—that UDT struggles with genuinely surprising evidence—is correct and is currently one of the biggest open problems in formal epistemology.

  If you submit this proposal as "A Refutation of UDT," you will be torn apart. If you submit it as "The Problem of Zero-Probability Evidence for Updateless Views," you will have a dissertation.

  Here is the pricing of the options.

  ---

  ### Option 1: Reject Premise (6) (Mira's Route)

  **Why it looked unobjectionable:** Premise (6) appeals to a principle of *Time-Slice Rationality*. It feels irrational to ignore a technician telling you the coin is heads. It feels like a failure of responsiveness to reality. We intuitively distinguish between "stubbornness" (irrational) and "resolution" (rational), but (6) treats them identically.

  **The Cost:** If you reject (6), you concede that rationality is fundamentally about *policies* over time, not *acts* at moments. This saves UDT, but it forces you to explain the difference between the Odysseus case (rational precommitment) and the "Ignorant Gambler" case (irrational stubbornness).

  **The UDT Commitment:** UDT is committed to the claim that *ex ante* optimality trumps *ex post* optimality. In the Technician case, a sophisticated UDT agent would have a policy that says: `If Technician says Heads, Bet Heads`. Why? Because in the prior, the probability of the Technician being reliable is high, and conditioning on that yields higher EU than ignoring it.
  *   **The Trap:** If UDT agents always condition on reliable evidence, why is UDT different from EDT?
  *   **The Answer:** In Newcomb, the "observation" (seeing the boxes) is logically entangled with the act. In the Technician case, the observation is causally independent of the past policy selection. UDT handles Newcomb by selecting a policy that *influences* the predictor (via logical correlation). It handles the Technician by selecting a policy that *responds* to the technician.
  *   **Dissertation Viability:** If you go this route, your dissertation becomes about the *conditions under which ex ante optimality overrides ex post responsiveness*. This is solid, but it requires you to concede that UDT *doesn't* tell you to bet against the technician. It tells you to bet with the technician, because the optimal policy included that contingency.

  ### Option 2: Reject Premise (5) (The "Straw Man" Route)

  **Why it looked unobjectionable:** You wrote (5) ("UDT tells you to bet as though you'd never heard") because you were thinking of the policy as a *constant action* (e.g., "Always One-Box") rather than a *function* (e.g., "If Obs=O1, Act=A1"). This is a common simplification when introducing UDT, but it breaks down in your Technician case.

  **The Cost:** If you reject (5), your main argument collapses. UDT does not tell you to ignore the technician. It tells you to execute the branch of the policy that corresponds to "Technician says Heads."

  **The Silver Lining:** This leads you directly to Premise (8), which you suspected was doing shady work. It isn't shady; it's the real problem.
  *   **Horn 1 (Prob > 0):** If the prior gave the news positive probability, the policy handles it. UDT doesn't collapse into EDT here; it just agrees with EDT *in this specific instance*. They diverge on *which* function maximizes EU (one that respects logical correlations vs. one that respects mere evidential correlations).
  *   **Horn 2 (Prob = 0):** This is where your dissertation lives. What if the Technician's evidence was *logically impossible* according to your prior? (e.g., The Technician proves your own source code is different than you thought). Standard Bayesianism breaks (conditionalizing on zero). UDT breaks harder, because the policy function is undefined on that input.

  **Dissertation Viability:** High. This is the "Logical Omniscience" problem for UDT. If UDT requires a prior over all logical possibilities to select a policy, it is computationally and logically impossible for bounded agents.

  ### Option 3: Attack Premise (8) (The "Collapse" Objection)

  **Why it looked unobjectionable:** It captures a fear many have about UDT: that it's either trivial (just do what you would have done anyway) or broken (can't handle surprises).

  **The Cost:** You need to show that UDT can select a policy that conditions on evidence *without* collapsing into standard Conditional Expected Utility maximization.
  *   **The Fix:** UDT maximizes expected utility *across the whole prior*, weighing the probability of the observation *and* the probability of the outcome given the policy. EDT maximizes expected utility *given the observation*.
  *   **Example:** In Newcomb, EDT says: "Given I see $1M in Box B, I should take both." UDT says: "The policy 'Take One' leads to seeing $1M. The policy 'Take Both' leads to seeing $0. I choose 'Take One'."
  *   **Result:** UDT does not collapse. It selects a different function than EDT does.

  ---

  ### Addressing Mira's Precommitment Analogy

  Mira is load-bearing here. The analogy between Odysseus and the UDT agent is not just rhetorical; it is structural.
  *   **Odysseus:** Precommits at $t_1$ to ignore sirens at $t_2$. At $t_2$, his current assessment is "Jumping is good." He ignores it.
  *   **UDT Agent:** Precommits (logically prior) to ignore certain correlations at $t_2$. At $t_2$, current assessment is "Two-boxing is good." He ignores it.

  **The Disanalogy:** Odysseus's precommitment is *causal* (ropes). UDT's precommitment is *logical* (the predictor simulates your policy).
  **Why it matters:** If you reject (6) to save UDT, you must explain why we accept Odysseus's irrationality-at-$t_2$ but reject the Gambler's irrationality-at-$t_2$.
  **The Answer:** Odysseus's $t_1$ self knows the $t_2$ self is *corrupted* (by sirens). The UDT agent's $t_2$ self is not corrupted; it just has different information.
  **Your Move:** The Technician case is not a siren. The Technician provides *truth*. Odysseus's sirens provide *temptation*. This is the wedge. You can argue that UDT is rational for *logical* precommitment (Newcomb) but irrational for *empirical* precommitment (Technician) if the empirical evidence breaks the logical correlation.

  ### Recommendation for the Proposal

  Do not try to prove UDT is "irrational or empty." That is too strong, and your committee (half of whom like UDT) will block it. Instead, pivot to the **Zero-Probability Problem**.

  **Proposed Title:** *Updateless Agency and the Problem of Unforeseen Evidence.*

  **The Argument:**
  1.  UDT requires a policy selected from a prior.
  2.  Policies are functions from Observations to Actions.
  3.  For the policy to be defined, the Prior must assign probability to the Observation.
  4.  In cases of genuine conceptual innovation or logical surprise, the Prior assigns Probability 0 (or the agent lacks the concept entirely).
  5.  Therefore, UDT is silent in cases of genuine surprise.
  6.  Rational agents must be able to handle genuine surprise.
  7.  Therefore, UDT is incomplete.

  **Why this works:**
  *   It keeps your intuition (Premise 4 & 5 spirit) without the false claim that UDT ignores *expected* evidence.
  *   It accepts Mira's critique of (6) (precommitment is fine) but shows where precommitment fails (when the contingency wasn't in the contract).
  *   It keeps Newcomb safe (the predictor's move is in the prior).
  *   It is novel. Most defenses of UDT assume logical omniscience. attacking that assumption is PhD-worthy.

  ### Summary of Steps to Take Now

  1.  **Drop Premise (6).** Mira is right. It proves too much. Acknowledge this in the proposal to show you've considered the objection.
  2.  **Refine Premise (5).** UDT doesn't ignore evidence; it ignores evidence that wasn't in the policy's domain.
  3.  **Focus on Premise (8), Horn 2.** The "silence" of UDT in the face of zero-probability events is the bug.
  4.  **Save Newcomb.** Explicitly state that Newcomb cases involve *foreseen* correlations (in the prior), whereas the Technician case involves *unforeseen* causal breaks.
  5.  **Talk to your Reading Group.** Tell them: "Mira convinced me (6) is too strong. I'm pivoting to the Zero-Probability problem. Camp 1, you'll like this because it critiques UDT. Camp 2, you'll like this because it tries to repair UDT rather than kill it."

  You are not stuck. You have found the boundary condition of the theory. That is exactly where a dissertation should start. Go write it up.
