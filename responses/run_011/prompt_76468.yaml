answer: |-
  ### 1. Objections by Damage Potential

  **1. The "Parameterization is Enough" Objection (High Damage)**
  *   **Who:** Computational Scientist (Climate/Cosmology).
  *   **Phrasing:** "You're treating 'coarse-graining' like it deletes the ontology. In my work, I parameterize subgrid processes I can't resolve. I don't simulate every cloud droplet; I simulate their aggregate effect on heat flux. The model is 'fake' at the micro-scale but 'true' at the macro-scale. If your simulated people are aggregate variables driving social dynamics, why isn't that sufficient for moral weight? You're conflating *resolution* with *existence*."
  *   **Damage:** Destroys Premise 2. If aggregates count, the value term doesn't shrink enough to kill fanaticism.

  **2. The "Ungrounded Prior" Objection (High Damage)**
  *   **Who:** Formal Epistemologist.
  *   **Phrasing:** "You've replaced one typicality assumption with another. Bostrom assumes we're typical observers; you assume we're typical *simulations*. But you haven't justified the likelihood distribution over simulator motives. Why should we assign high credence to 'instrumental/truncated' runs over 'archival/open-ended' ones? Without a likelihood function for the Simulator's resource allocation, your discount is just a prior dressed up as a technical constraint."
  *   **Damage:** Destroys Premise 1 & 3. Makes the argument look like an arbitrary assumption rather than a derivation.

  **3. The "Mixture Weight" Objection (Medium Damage)**
  *   **Who:** Graduate Student (Longtermist-sympathetic).
  *   **Phrasing:** "Even if the simulated value shrinks, the base reality value doesn't. If there's even a 1% chance we're in base reality, and the base reality future is astronomically valuable, doesn't that term dominate the expected value calculation? You've discounted the simulation branch, but you haven't discounted the mixture."
  *   **Damage:** Weakens the conclusion. Suggests the Pascalian leverage survives in the non-simulated branch.

  **4. The "Spin-Up" Objection (Medium Damage)**
  *   **Who:** Computational Scientist (N-body/Emulator).
  *   **Phrasing:** "You assume termination happens when the purpose is served. But in cosmology, you have to run the simulation past the epoch of interest to validate the boundary conditions. A 'short' purpose might require a 'long' run to ensure stability. Checkpointing isn't deletion; it's storage. The potential future is still there, just paused. Why does 'paused' count as 'zero value'?"
  *   **Damage:** Challenges the "truncation" claim. Suggests value is preserved in potentiality.

  **5. The "Unfalsifiable Constraint" Objection (Low Damage)**
  *   **Who:** Formal Epistemologist.
  *   **Phrasing:** "This relies on the claim that posthuman compute is scarce. But if they can run ancestor simulations, they likely have compute to spare. Asserting they *must* optimize for cost is an empirical claim about a civilization we can't observe. It renders the argument unfalsifiable because any evidence of high-fidelity can be waved away as 'anomaly'."
  *   **Damage:** Annoyance. Attacks the robustness of the premise but doesn't refute the logic if the premise is granted.

  ---

  ### 2. Replies and Soft Spots

  **1. Reply to "Parameterization is Enough"**
  *   **Reply:** "Parameterization works for *physics* because heat flux doesn't need to feel pain to warm a planet. It works for *prediction*, not *experience*. My claim isn't that the model fails to predict; it's that moral patients require a specific kind of causal resolution to exist. If you replace a person with a variable representing 'population stress,' you have a number, not a sufferer. You can optimize the number without harming anyone. If the simulation doesn't resolve the individual, there is no individual to harm."
  *   **Soft Spot:** Commits you to a specific metaphysics of consciousness (computational functionalism with a resolution threshold). If consciousness supervenes on abstract structure regardless of resolution, this reply fails.

  **2. Reply to "Ungrounded Prior"**
  *   **Reply:** "I'm not guessing motives; I'm appealing to complexity classes. An open-ended, high-fidelity universe requires strictly more compute than a bounded, instrumental one. Regardless of motive, if the cost function is non-zero, the cheaper runs dominate the probability mass. We don't need to know *why* they run simulations, only that running ten cheap ones is computationally easier than running one expensive one. The prior is over *cost*, not *intent*."
  *   **Soft Spot:** Assumes the Simulator is bound by computational constraints. If they have effectively infinite compute (Matrioshka brain scenario), the cost argument collapses.

  **3. Reply to "Mixture Weight"**
  *   **Reply:** "The fanatic's case relies on the value term being *overwhelming*, not just large. If the simulation branch—which is the most probable branch according to the Simulation Argument itself—has its value crushed by orders of magnitude, the total expected value drops below the threshold required for 'fanaticism.' It doesn't need to be zero; it just needs to be small enough that it no longer dominates all other moral considerations."
  *   **Soft Spot:** Concedes that longtermism might still be true, just not *fanatical*. You lose the strong "anti-longtermism" punch for the base reality case.

  **4. Reply to "Spin-Up"**
  *   **Reply:** "A paused simulation has no running time, and therefore no experienced time. Value is generated by processes, not storage. If the run is checkpointed and never resumed, the potential value is never actualized. If it is resumed only to check a variable and then deleted, the 'future' was never a future, it was a lookup table. We are betting on actualized experience, not disk space."
  *   **Soft Spot:** Commits to a view where value requires active processing. If value is timeless or stored in the structure of the data itself, this reply fails.

  **5. Reply to "Unfalsifiable Constraint"**
  *   **Reply:** "It's not unfalsifiable; it's an inference to the best explanation based on engineering practice. Every simulation we actually build involves trade-offs. To assume posthuman engineering violates the fundamental trade-off between fidelity and cost without evidence is the bigger leap. I'm applying the uniformity of scientific practice, not making a claim about the unobservable."
  *   **Soft Spot:** Relies on the continuity of engineering principles across civilizations. If posthuman physics allows compute without cost, the analogy breaks.

  ---

  ### 3. Concessions and Non-Negotiables

  **Concede in the First Five Minutes:**
  *   **Uncertainty of P(Sim):** Explicitly state you are not arguing P(Sim) = 1. You are arguing *conditional* on P(Sim), the value term shrinks. This disarms the "you can't prove we're simulated" attack.
  *   **Base Reality Value:** Concede that base reality *could* have high value. Your argument is that the *weighted* expectation drops because the high-probability simulation branch is low-value.
  *   **Specifics of Parameterization:** Concede you are not a modeller. You are using their practice as an analogy for resource allocation, not claiming to know their specific code.

  **Refuse to Concede (Non-Negotiables):**
  *   **Aggregates are not Patients:** Do not allow the slide from "the model predicts aggregate behavior" to "the aggregate behaves like a person." This is the linchpin. If aggregates count, the thesis dies.
  *   **Cost Constraints:** Do not allow the assumption that posthumans have infinite compute. The argument *requires* scarcity to force the trade-off between quantity of runs and quality of runs.
  *   **Termination:** Do not concede that "paused" equals "ongoing." A simulation that is not being stepped is not generating value in this framework.

  ---

  ### 4. Clustering Objections

  **Cluster A: The "It's Still Real" Cluster**
  *   *Includes:* The Parameterization Objection, The Spin-Up Objection, The Unfalsifiable Constraint (partially).
  *   *Core Issue:* Whether coarse-grained or paused computations retain moral ontology.
  *   *Strategy:* Answer once by defining the "Resolution Threshold for Moral Status." Refer all variations back to this definition.

  **Cluster B: The "Probability Weighting" Cluster**
  *   *Includes:* The Ungrounded Prior, The Mixture Weight, The Unfalsifiable Constraint (partially).
  *   *Core Issue:* Whether we can justify the distribution over simulation types and how it mixes with base reality.
  *   *Strategy:* Answer once by distinguishing between *motives* (unknown) and *computational costs* (structural). Emphasize that cost constraints drive the distribution regardless of motive.

  **Cluster C: The "Longtermism Survives" Cluster**
  *   *Includes:* Mixture Weight, Base Reality Symmetry.
  *   *Core Issue:* Whether the discount is large enough to matter for decision theory.
  *   *Strategy:* Group these as "magnitude" objections. Acknowledge them but reiterate that fanaticism requires *overwhelming* value, not just *positive* value.

  ---

  ### 5. The Single Crucial Reply

  **The Reply:** "Computational scarcity forces a trade-off between the *number* of simulations and the *fidelity* of simulations. If the Simulation Argument is right, we are likely in one of the *many*. The *many* are only possible because they are *cheap*. They are cheap because they are coarse. If they are coarse, they do not contain the resolution required for moral patients. Therefore, the branch with the highest probability mass has the lowest moral value."

  **Why it must land:** This connects the probabilistic weight of the Simulation Argument (which the audience knows) to the computational constraints (which the modellers know) to the moral conclusion (which the students care about). If you fail to link *Multiplicity* to *Coarseness* to *Moral Void*, the argument decouples.

  ---

  ### 6. The Question You Hope Nobody Asks

  **Your Suspicion:** "Does the discount survive being weighted by the probability that we are not simulated at all?"
  **Assessment:** This is **not** the worst question. It is a standard mixture problem. You can answer it by arguing that the simulation branch dominates the probability mass (if SA holds), so discounting it discounts the total significantly.

  **The Worse Question:** "If the simulation is coarse-grained, how do *you* know you aren't one of the aggregate variables?"
  *   **Who:** Formal Epistemologist or sharp Grad Student.
  *   **Why it's worse:** It turns your epistemic position against you. If you are an aggregate variable, your *own* experience of suffering is an illusion or a parameter. If your suffering is a parameter, your argument against fanaticism (which relies on preventing suffering) loses its normative force. It creates a self-undermining loop: "If I'm right, my concern for the future might not be real."

  **The Least-Bad Answer:**
  "I am arguing from the inside out. I have access to my own phenomenal experience. Whether that experience is 'base' or 'simulated' doesn't change the fact that I feel pain. However, if I am an aggregate variable, my feeling of pain is a bug in the parameterization, not a feature of a moral patient. But I cannot act as if I am a bug. I must act as if my experience is real. The argument is for the *planner*, not the *patient*. The planner should not bet on astronomical value because the *objects* of that value are likely abstractions."

  **Cost to Thesis:**
  *   **Cost:** You retreat from a metaphysical claim ("they don't exist") to a decision-theoretic claim ("you shouldn't bet on them existing").
  *   **Damage:** It weakens the ontological force of the paper. It becomes a pragmatic warning rather than a discovery about the nature of simulated beings. It admits you cannot prove the aggregates lack value, only that it is risky to assume they have it. This shifts the paper from "Fanaticism is False" to "Fanaticism is Risky."
