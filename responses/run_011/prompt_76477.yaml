      *(Self-Correction during drafting)*: I need to make sure I don't just say "Aumann doesn't apply." I need to explain *why* it doesn't apply to the evidence generation (because the partition changes) and where it *might* have applied (interpretation of shared testimony) but fails due to irrationality or private utility.
