  You're a professional philosopher of mind who specializes in personal identity, but for this task what I actually need is your skill at reverse-engineering *people* — figuring out which principle someone is really running from the pattern of their case verdicts. Please think carefully and show the brainstorming: list the candidate rules first and stress-test them against every verdict, then make the prediction. Don't just jump to an answer.

  Here's the setup. My friend Nadia is finishing a dissertation on survival, uploading, and gradual replacement, and she has extremely firm intuitions. Her track record, all cases she's thought hard about and given a definite ruling on:

  1. Every neuron in your brain gets swapped, one at a time, for a synthetic thing that plays exactly the same causal role in the network — one neuron a day for decades. You stay awake, working and talking throughout. → You survive, full stop, and it's you rather than a copy.
  2. Identical procedure but rushed: everything is swapped over a single afternoon while you sit there chatting. → Still you. She says the speed is irrelevant.
  3. Your brain is scanned at molecular resolution, the original is dissolved, and a perfect functional duplicate gets built and switched on somewhere else. → Not you. It's a copy that will sincerely insist otherwise. She's very firm here.
  4. Same scan, duplicate switched on, but the original is left alive and awake. → You're the original, obviously; the other one is a stranger who shares your past.
  5. Classic division: your two hemispheres each end up supporting a different fully functional person with your memories and your temperament. → Neither is you. But she also insists this isn't a catastrophe, which I've never quite followed.
  6. A stroke destroys your left hemisphere and the right one carries on in your body. → You survive.
  7. In cases 1 and 2, the neurons are incinerated the moment they're removed. → Changes nothing, still you.

  Now the case I cooked up last night and want to spring on her. Call it the recovery case.

  Over six months, every neuron in your brain is replaced one at a time by a synthetic isomorph, exactly as in case 2 — you're awake and living your life the whole time, no gaps, nothing you'd notice. But this time the removed neurons aren't destroyed. They're kept alive in culture and, across those same six months, reassembled into a complete biological brain: your original neurons, your original wiring, regrown scaffold and all, then connected up to a cloned body. The whole time its being rebuilt, that brain is dormant — alive and metabolically healthy but not conscious, closer to deep anaesthesia than to sleep. On the last day they wake it up. So now there are two people. The synthetic one has an unbroken record of the entire six months. The biological one wakes up saying it feels like it just went to sleep six months ago; it has all your memories and habits up to that point and nothing since.

  So: what will she say? Which one is you — or neither, or both, or is she going to call it indeterminate? What interests me more than the verdict is the space of rules consistent with 1 through 7. I can see at least two, and I have a suspicion they come apart right here, because 7 tells me something about whether she cares where the old material ends up and the dormancy detail seems designed to make some of these rules fight each other. Lay out the candidate principles explicitly, say what each one predicts about the recovery case and exactly which of her earlier verdicts pins it down, then commit to your single best guess about what she'll say and defend it. And be honest if you think some of her verdicts are in tension — if a rule can't handle all seven, name the verdict that breaks it.

  Finally, design one further case — ideally a small tweak on the recovery case rather than something exotic — that would discriminate between whichever rules survive your analysis, and say what she'd have to say under each.

  No citations or reading list, please, I'm not writing anything up. Just your reasoning, out loud.
