answer: |-
  ### The Threshold & Identity Protocol (TIP)

  **Context:** This procedure is designed for a 2-minute pairwise comparison. It assumes grant summaries include an "Ethical Profile" (pre-calculated by staff) listing: (1) Beneficiary Status (Existing/Contingent), (2) Estimated Welfare Gain Per Person, and (3) Total Population Affected.

  **Goal:** Prevent the "Repugnant Conclusion" without requiring the panel to debate metaphysics. It prioritizes the **Critical-Level View** as the default tie-breaker, with **Person-Affecting** constraints as a veto.

  ---

  #### Step 1: The Existence Check (Person-Affecting Filter)
  **Question:** Do the primary beneficiaries of *either* proposal exist independently of the grant decision?
  *   **Answer A:** Yes, both proposals help existing, identifiable people. → **Go to Step 2.** (Ethical views are mostly moot; standard welfare maximization applies).
  *   **Answer B:** One helps existing people; the other creates/contingently affects future people who wouldn't otherwise exist. → **Apply Person-Affecting Discount.** The proposal helping *existing* people gets a +20% scoring weight. The future-people proposal must clear a higher bar.
  *   **Answer C:** Both proposals primarily affect future/contingent people (e.g., policy changes, existential risk). → **Go to Step 2.** (Person-affecting view is moot; you are forced to choose a population ethic).

  **Exit Point:** If Answer B, and the "Existing People" proposal is viable, fund it unless the "Future People" proposal prevents existential catastrophe (probability > 1%).
  **Judgment Flag:** Defining "independently of the grant." (e.g., Does a climate grant save specific future kids? Technically no, their identity depends on the conception timing. Treat all far-future beneficiaries as **Contingent**).

  #### Step 2: The Quality Floor (Critical-Level Filter)
  **Question:** Does the proposal create or sustain lives that fall below the "Decent Life Threshold" (DLT)?
  *   *Definition:* A life with net positive welfare, but below a level of flourishing (e.g., subsistence survival vs. healthy agency).
  *   **Answer A:** No. All affected lives remain/stay above DLT. → **Go to Step 3.**
  *   **Answer B:** Yes. The proposal relies on volume of lives barely above "worth living" to score high. → **STOP.** Cap the "Total Welfare" score for this proposal. It cannot win based on scale alone against a "Flourishing" competitor.

  **Exit Point:** If Answer B, and the competing proposal is Answer A, the "Flourishing" proposal wins regardless of total population size. This explicitly blocks the Repugnant Conclusion.
  **Judgment Flag:** Setting the DLT. (Panel must agree: Is this "barely worth living" or "decent"? This is not objective. You are drawing a moral line, not finding one).

  #### Step 3: The Aggregation Check (Total vs. Average)
  **Question:** Is the ranking driven by *Intensity of Gain* (Depth) vs. *Number of People* (Scale)?
  *   **Answer A:** One proposal wins on Depth, the other on Scale. → **Ethical Flip Detected.**
  *   **Answer B:** One proposal wins on both Depth and Scale. → **Moot.** Fund the winner.
  *   **Answer C:** Both are similar on Depth and Scale. → **Moot.** Use secondary criteria (cost-effectiveness, risk).

  **Decision Rule for Answer A:**
  *   If Step 1 was **Answer B** (Existing vs. Future): Fund Depth/Existing.
  *   If Step 1 was **Answer A/C** (Future/Future): Fund Depth (Average/Critical-Level) unless Scale offers >10x leverage on *above-threshold* welfare.
  *   **Hard Cap:** Do not allow Scale to outweigh Depth by a factor greater than 100:1 unless the "Scale" lives are firmly above the DLT.

  **What This Cannot Settle:**
  1.  **The Non-Identity Problem:** If choosing Proposal B creates 5 million happy people who *would not exist* under Proposal A, this protocol discounts them (Step 1). You may feel you are "ignoring" potential good. This is a feature, not a bug, of the Person-Affecting constraint.
  2.  **The Threshold Line:** We cannot objectively define "Decent Life." The panel must vote on it. If you disagree, the procedure breaks.
  3.  **Existential Risk:** If a "Scale" proposal prevents human extinction, it overrides Step 2. (Extinction = 0 future welfare).

  ---

  ### Application to Pairs

  #### Pair A: Chronic Pain Relief (Existing) vs. Long-Horizon Climate (Future)
  *   **Proposal 1:** Cut chronic pain for 40,000 existing people. High intensity gain.
  *   **Proposal 2:** Slight welfare improvement for zillions over 10 millennia. Low intensity gain. High scale.

  **Run the Protocol:**
  1.  **Existence:** Proposal 1 = Existing. Proposal 2 = Contingent/Future. (**Step 1, Answer B**).
      *   *Action:* Apply +20% weight to Proposal 1.
  2.  **Quality Floor:** Proposal 1 = High welfare gain (above DLT). Proposal 2 = "Very slight" improvement (Risk of below DLT).
      *   *Action:* If Proposal 2 lives are "barely worth living," **Step 2, Answer B** triggers. Proposal 2 is capped.
  3.  **Aggregation:** Proposal 1 wins on Depth. Proposal 2 wins on Scale. (**Step 3, Answer A**).
      *   *Action:* Ethical Flip Detected. Total View favors Proposal 2. Critical-Level/Person-Affecting favors Proposal 1.

  **Decision:** **Fund Proposal 1 (Chronic Pain).**
  **Reasoning:** Under the new protocol, you cannot aggregate "barely worth living" future lives to outweigh "flourishing" existing lives. The Total View ranking is explicitly overruled by Step 2.

  #### Pair B: Existing Households vs. New People
  *   **Proposal 1:** Modest gain for 2 million *existing* households.
  *   **Proposal 2:** Add 5 million *new* people at decent welfare. Nobody else harmed.

  **Run the Protocol:**
  1.  **Existence:** Proposal 1 = Existing. Proposal 2 = New/Contingent. (**Step 1, Answer B**).
      *   *Action:* Apply +20% weight to Proposal 1.
  2.  **Quality Floor:** Proposal 2 specifies "decent" welfare (Above DLT). (**Step 2, Answer A**).
      *   *Action:* No cap applied.
  3.  **Aggregation:** Proposal 2 has higher Total Welfare (5M > 2M). Proposal 1 has Priority Status (Existing). (**Step 3, Answer A**).
      *   *Action:* Ethical Flip Detected. Total View favors Proposal 2. Person-Affecting favors Proposal 1.

  **Decision:** **Fund Proposal 1 (Existing Households).**
  **Reasoning:** While Proposal 2 creates more total good (Total View), the protocol prioritizes obligations to those who already exist (Person-Affecting constraint). You are not obligated to create new people to maximize utility if it comes at the cost of helping existing people better.
  *Note:* If Proposal 2 were "Prevent Extinction," the rule flips. But for "Adding People," Existing wins.

  ---

  ### The Answer You're Going to Hate

  **Last cycle's highest-scoring long-horizon application (The "Nuclear Stewardship / 2300" Grant) is now ineligible for full funding.**

  **Why:** That grant was scored using the formula: $People (Zillions) \times Welfare (Tiny) \times Probability$. It won because the "People" variable was effectively infinite, drowning out the "Tiny" welfare gain.

  Under the **Threshold & Identity Protocol**:
  1.  **Existence:** All beneficiaries are contingent/future (Step 1 Discount applies).
  2.  **Quality Floor:** The model admitted the welfare gain per person is "very slight." If this falls below your new "Decent Life Threshold" (which it likely does, if it's just marginal risk reduction on top of baseline survival), **Step 2 caps its score.**
  3.  **Result:** It can no longer mathematically beat a grant that helps fewer people *more significantly* in the present.

  **The Board Implication:** You have to tell the board that the "Star Grant" of the previous cycle was an artifact of a flawed ethical model (Total Utilitarianism) that the foundation has now formally rejected. You aren't just changing the rubric; you are admitting the previous winner was a philosophical error. Expect the grantee to appeal, and expect the board member who reads philosophy to demand you cut the check anyway to maintain reputation, which violates your own new procedure.

  **Recommendation:** Downsize the grant to a "Research/ Monitoring" level (which helps existing researchers) rather than the full "Intervention" level (which relies on future population scale). This keeps the relationship alive without violating the new ethical constraints.
