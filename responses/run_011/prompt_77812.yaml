prompt: |-
  Six weeks ago I got handed the scoring model for a mid-sized foundation's grants program. Mostly global health, but last cycle we opened it up to long-horizon work — climate adaptation, nuclear waste stewardship, stuff where the benefits land in 2300. Our spreadsheet basically does people affected × welfare gain × probability, which I now realize quietly commits us to the total view, and a board member who actually reads philosophy tore into it: she pointed out our own rubric would rank a future with zillions of people whose lives are barely worth living above a smaller but flourishing civilization. So we've commited to the repugnant conclusion without ever voting on it, and now fixing it before the next round is my problem.

  Write a decision procedure our three-person panel (me, a nurse, a lawyer — nobody has any philosophy training) can run on a pair of competing proposals. About 40 applications a cycle, roughly two minutes of panel time per pair, ~$2M riding on each, and whatever we write has to survive the board. I want ordered questions, what counts as a sufficient answer to each, and clear exit points. Specifically it needs to tell me when the choice between total, average, critical-level, and person-affecting views actually flips the ranking versus when it's moot, what to do when it does flip, and how to handle proposals where the winner changes who exists — so the better-off people wouldn't otherwise have existed at all. Flag the steps that are judgment calls dressed up as procedure, and say plainly what the thing can't settle.

  Then run it on two pairs: (a) cutting chronic pain substantially for 40,000 people alive now versus very slightly improving life for an enormous number of people over ten millennia, and (b) a modest wellbeing gain for 2 million existing households versus adding 5 million new people at a decent but lower welfare level with nobody else made worse off. Give me one answer I'm going to hate — probably it'll be about last cycle's highest-scoring long-horizon application.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure and analysis:

  1.  **Analyze the Request:**
      *   **Context:** A mid-sized foundation's grants program (global health + long-horizon work like climate/nuclear).
      *   **Problem:** The current scoring model (People $\times$ Welfare $\times$ Probability) implicitly commits to Total Utilitarianism, leading to the "Repugnant Conclusion" (vast populations with barely worth-living lives outrank smaller, flourishing ones). A board member (philosophy-literate) called this out.
      *   **Task:** Create a decision procedure for a 3-person panel (Program Officer, Nurse, Lawyer - no philosophy training) to evaluate pairs of competing proposals.
      *   **Constraints:**
          *   ~40 applications/cycle.
          *   ~2 minutes of panel time per pair (very tight).
          *   ~$2M riding on each decision.
          *   Must survive board scrutiny.
          *   Needs ordered questions, sufficient answers, clear exit points.
          *   Must identify when ethical views (Total, Average, Critical-Level, Person-Affecting) flip the ranking vs. when it's moot.
          *   Must handle "non-identity" problems (choices that change *who* exists).
          *   Must flag judgment calls disguised as procedure.
          *   Must state what the procedure *cannot* settle.
          *   **Output:** The procedure + Application to two specific pairs + One "hated" answer (likely regarding a previous high-scoring long-horizon grant).

  2.  **Deconstruct the Ethical Conflict:**
      *   *Total View:* Maximize sum of welfare. (Leads to Repugnant Conclusion).
      *   *Average View:* Maximize average welfare. (Leads to "Mere Addition Paradox" - better to kill unhappy people).
      *   *Critical-Level View:* Maximize sum of welfare *above* a certain threshold of "worth living." (Avoids Repugnant Conclusion, but where do you set the line?).
      *   *Person-Affecting View:* Only count effects on people who *would exist anyway*. (Avoids non-identity issues, but ignores future generations entirely).
      *   *The Panel's Reality:* They aren't philosophers. They need a heuristic that aligns with the foundation's mission (Global Health + Long-termism) without getting bogged down in metaphysics, while acknowledging the board's concern.

  3.  **Drafting the Decision Procedure (The "Tri-View Filter"):**
      *   *Goal:* Make it fast (2 mins/pair), robust, and transparent.
      *   *Structure:* Sequential questions that act as filters.
      *   *Step 1: Existence Check (Person-Affecting).* Do the beneficiaries exist independently of the grant?
      *   *Step 2: Threshold Check (Critical-Level).* Are the lives being created/sustained above a "decent life" threshold?
      *   *Step 3: Scale vs. Depth (Total vs. Average).* If both pass thresholds, does scale overwhelm depth?
      *   *Exit Points:* If Step 1 fails, use Person-Affecting logic. If Step 2 fails, reject Repugnant Conclusion logic. If Step 3 is the only difference, acknowledge the ethical tension.
      *   *Flagging Judgment:* Explicitly mark where they are setting the "Critical Level" or defining "Existence."

  4.  **Refining the Procedure for the Constraints:**
      *   2 minutes is *extremely* short. The questions must be binary or tri-state.
      *   Need a "Tie-Breaker" rule for when ethical views conflict.
      *   Need to address the Board's specific worry (Repugnant Conclusion).
      *   *Revision:* Let's create a "Weighted Scoring Adjustment" rather than a pure philosophical debate. No, the prompt asks for a *decision procedure* on pairs. Let's stick to a flowchart style.
      *   *Key Insight:* Most grants won't trigger the philosophical edge cases. The procedure should quickly identify the "Moot" cases vs. the "Flip" cases.

  5.  **Developing the Steps:**
      *   *Q1: Identity.* Does this grant determine *who* is born (Non-Identity)?
      *   *Q2: Quality Floor.* Does the grant create lives below a "worth living" threshold?
      *   *Q3: The Trade-off.* Is the choice between Deep/Small vs. Shallow/Huge?
      *   *Decision Rule:* If Q1 is Yes -> Person-Affecting constraint applies (discount future non-identities). If Q2 is Yes -> Cap the score (Anti-Repugnant). If Q3 is Yes -> Board Vote required (or default to Critical-Level).

      *Wait, 2 minutes per pair?* They can't debate metaphysics. The procedure needs to be a *scoring adjustment key*, not a debate guide.
      *   *Revised Approach:* A "Ethical Risk Flag" system.
      *   1. Check Beneficiary Status (Existing vs. Future/Contingent).
      *   2. Check Welfare Floor (Barely Worth Living vs. Flourishing).
      *   3. Check Magnitude (Scale vs. Intensity).
      *   *Rule:* If Future/Contingent + Barely Worth Living = Automatic Downgrade. If Existing + Flourishing = Standard Score.

      *Let's try to match the prompt's specific requirements:* "Ordered questions, what counts as a sufficient answer, clear exit points... tell me when the choice... flips the ranking."
      *   Okay, I need a flowchart that explicitly compares the two proposals (A vs B).

  6.  **Addressing the "Hated Answer":**
      *   The prompt hints: "probably it'll be about last cycle's highest-scoring long-horizon application."
      *   Last cycle's winner was likely a "Total View" winner (Huge scale, low probability/impact per person, far future).
      *   To avoid the Repugnant Conclusion, we must downgrade that type of grant.
      *   The "Hated Answer" will be: "We have to defund/cancel the big long-horizon grant from last cycle because it fails the new Critical-Level test."

  7.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Acknowledge the constraint (2 mins) and the stakes ($2M).
      *   **The Procedure (The "Threshold & Identity Protocol"):**
          *   Step 1: The Existence Question (Person-Affecting).
          *   Step 2: The Quality Floor (Critical-Level).
          *   Step 3: The Aggregation Check (Total vs. Average).
          *   *Exit Points:* When to stop and fund/kill.
          *   *Flags:* Where the panel is actually making a value judgment.
          *   *Limitations:* What this doesn't solve.
      *   **Application to Pair A (Chronic Pain vs. Long-Horizon):**
          *   Pain: Existing people, high intensity.
          *   Long-Horizon: Future people, low intensity, huge scale.
          *   Result: Pain wins under Critical-Level/Person-Affecting. Long-horizon wins under Total.
      *   **Application to Pair B (Existing Households vs. New People):**
          *   Existing: Person-affecting clear.
          *   New People: Non-identity problem.
          *   Result: Depends on the "Identity" rule.
      *   **The Hated Answer:** Explicitly state that the previous long-horizon winner is now ineligible or ranked lower.

  8.  **Refining the "2 Minute" Constraint:**
      *   This is the hardest part. Philosophers take hours on this.
      *   Solution: Pre-work. The panel reads the "Ethical Profile" of the grant *before* the meeting. The 2 minutes is just checking the boxes.
      *   I need to make sure the procedure reflects this. The *procedure* is the checklist they use *during* the 2 minutes.
      *   Actually, 2 minutes for a *pairwise comparison* of $2M grants is insanely fast. I should note that this procedure requires pre-screening. But I must answer the prompt. I will design the procedure to be a "Tie-Break/Validation" step during the meeting, assuming basic data is pre-loaded.
      *   *Correction:* The prompt says "2 minutes of panel time per pair." I have to respect that. The questions must be instant.
      *   *Strategy:* Binary switches.
      *   Q1: Are the beneficiaries *specific, identifiable existing people*? (Yes/No/Mixed).
      *   Q2: Is the welfare gain *per person* above the "Decent Life" threshold? (Yes/No).
      *   Q3: Does the "Huge Scale" option rely on numbers alone to beat the "High Quality" option? (Yes/No).

  9.  **Developing the "Hated Answer":**
      *   The prompt asks for *one* answer I'm going to hate.
      *   It implies I (the user/PO) like the long-horizon stuff (since I handed the model 6 weeks ago).
      *   The philosophy-literate board member hates the Repugnant Conclusion.
      *   Therefore, the procedure must kill the "Zillions of people barely living" grant.
      *   The "Hated Answer" is: "The long-horizon climate/nuclear grant from last cycle (which scored highest) must be rejected or radically downsized under this new protocol because it relies on the Total View aggregation you just admitted is flawed."

  10. **Final Review against Constraints:**
      *   Ordered questions? Yes.
      *   Sufficient answers? Yes.
      *   Exit points? Yes.
      *   When views flip ranking? Yes.
      *   Non-identity handling? Yes.
      *   Flag judgment calls? Yes.
      *   State limitations? Yes.
      *   Run on Pair A & B? Yes.
      *   Hated Answer? Yes.

  11. **Tone Check:** Professional, direct, slightly weary (acknowledging the difficulty), but actionable. No fluff.

      *(Self-Correction during drafting)*: Make sure I don't get bogged down in defining "Decent Life." That's a judgment call I need to flag. The procedure can't define it, it just forces the panel to vote on it.
      *(Self-Correction on Time)*: 2 minutes is not enough to discuss *why*. The procedure must be: "If Box X is checked, Rule Y applies." Discussion happens outside the 2 minutes or is curtailed. I will emphasize that the *discussion* is limited, the *scoring* is mechanical.

      *(Refining the "Hated Answer")*: The prompt says "Give me one answer I'm going to hate." I should put this at the end as a distinct section.

      *(Refining Pair B)*: Pair B is the classic Non-Identity Problem. 2M existing vs 5M new.
      *   Person-Affecting: Only count the 2M.
      *   Total: Count 5M + 2M (if 2M not harmed).
      *   Critical Level: Are the 5M above the line?
      *   I need to show how the procedure resolves this specifically.

      *(Final Polish)*: Ensure the distinction between "Moot" (all theories agree) and "Flip" (theories disagree) is clear.

