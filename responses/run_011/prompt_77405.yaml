  # Seminar Handout: After the Act — A Decision Tree on Political Responsibility

  **Instructions:** Answer the following ten questions based on your intuitions about what an official should *feel, say, owe, or do* after the events described. Do not worry about whether the act was "right" or "wrong" in the abstract; focus on the practical aftermath. Follow the branching instructions to find your position.

  ### The Questions

  **Q1. (Vignette i: The Minister)** After saving the three hundred, what does the minister owe the families of the forty who died?
  *   **A:** A public apology acknowledging the harm caused. *(Go to Q6)*
  *   **B:** Financial compensation from the state, without admitting fault. *(Go to Q10)*
  *   **C:** Nothing; the lives saved cover the loss. *(Go to Q9)*

  **Q2. (Vignette ii: The Chief)** If the same situation arises next year, what should the chief do?
  *   **A:** Authorize the entry again without hesitation. *(Go to Q4)*
  *   **B:** Authorize the entry again, then resign. *(Go to Q3)*
  *   **C:** Refuse to authorize the entry. *(Go to Leaf: The Abstentionist)*

  **Q3. (Vignette iii: The Rebel)** What makes the commander fit to lead after the execution?
  *   **A:** His success in preserving the brigade. *(Go to Leaf: The Threshold Deontologist)*
  *   **B:** His visible suffering over the boy's death. *(Go to Leaf: The Moral Sensitivity Advocate)*
  *   **C:** Nothing; he is unfit to lead. *(Go to Leaf: The Abstentionist)*

  **Q4. (Vignette iv: The Mayor)** Where did the mayor get the authority to take the money?
  *   **A:** From the needs of the residents she represents. *(Go to Leaf: The Unifier)*
  *   **B:** From the rules of the office she holds. *(Go to Leaf: The Institutionalist)*
  *   **C:** She acted outside her authority. *(Go to Q7)*

  **Q5. (Vignette v: The Diplomat)** Should the amnesty deal be revealed to the victims' group?
  *   **A:** Yes, immediately, regardless of the cost. *(Go to Leaf: The Penitent Realist)*
  *   **B:** Yes, but only after peace is secure. *(Go to Leaf: The Penitent Realist)*
  *   **C:** No, secrecy is required for stability. *(Go to Leaf: The Institutionalist)*

  **Q6. (General)** What is the function of the agent's sleepless nights?
  *   **A:** It is a private penalty with no public value. *(Go to Leaf: The Penitent Realist)*
  *   **B:** It is the only proof they remain morally competent. *(Go to Leaf: The Moral Sensitivity Advocate)*
  *   **C:** It shows they are too weak for the job. *(Go to Leaf: The Abstentionist)*

  **Q7. (General)** Can the housing policy stand if the money was corrupt?
  *   **A:** Yes, the outcome is clean even if the source was not. *(Go to Leaf: The Unifier)*
  *   **B:** Yes, but the source must be cleansed publicly. *(Go to Leaf: The Penitent Realist)*
  *   **C:** No, the policy is tainted by the source. *(Go to Leaf: The Skeptic)*

  **Q8. (General: Delegation)** If a subordinate could sign the ventilator order:
  *   **A:** The minister should make the subordinate sign. *(Go to Empty Cell 1)*
  *   **B:** The minister must sign it herself. *(Go to Q9)*
  *   **C:** No one should sign it. *(Go to Leaf: The Abstentionist)*

  **Q9. (General)** Is the clash between saving lives and keeping rules real?
  *   **A:** Yes, and it cannot be fully solved by theory. *(Go to Leaf: The Penitent Realist)*
  *   **B:** No, a correct theory shows only one required path. *(Go to Leaf: The Unifier)*
  *   **C:** No, it is a story told to excuse power. *(Go to Leaf: The Skeptic)*

  **Q10. (General)** Do moral prohibitions disappear when stakes are high enough?
  *   **A:** Yes, they vanish completely past a point. *(Go to Leaf: The Threshold Deontologist)*
  *   **B:** No, they remain but are overridden. *(Go to Leaf: The Institutionalist)*
  *   **C:** No, they never permit violation. *(Go to Leaf: The Abstentionist)*

  ---

  ### The Positions (Leaves)

  **1. The Penitent Realist (Walzer)**
  *   **View:** The act was necessary but remains a moral violation; guilt persists and must be acknowledged.
  *   **Awkward Commitment:** You must accept that doing the best thing available still makes you a violator of moral law.
  *   **Weakest Vignette:** (iv) The Mayor; it is hard to explain why taking corrupt money leaves a stain that good housing policy cannot wash away.

  **2. The Institutionalist (Weber)**
  *   **View:** Political office generates its own normative standards; ordinary moral rules do not apply to official acts.
  *   **Awkward Commitment:** You must accept that an official can do what would be a crime for a citizen without any moral loss.
  *   **Weakest Vignette:** (iii) The Rebel; it is difficult to argue that a non-state commander holds an "office" that suspends ordinary prohibitions.

  **3. The Unifier**
  *   **View:** There is no distinct problem because a correct theory of what to do absorbs the supposed conflict.
  *   **Awkward Commitment:** You must deny the intuitive sense of loss or conflict that most people feel in these cases.
  *   **Weakest Vignette:** (v) The Diplomat; it is cold to say granting amnesty to a war criminal involves no moral cost whatsoever.

  **4. The Threshold Deontologist**
  *   **View:** Prohibitions hold until a threshold, past which they lapse cleanly without remainder.
  *   **Awkward Commitment:** You must identify the exact point where murder becomes permissible without any residual guilt.
  *   **Weakest Vignette:** (i) The Minister; it is implausible to claim the death of the forty patients involves no moral residue once the threshold is crossed.

  **5. The Moral Sensitivity Advocate**
  *   **View:** The agent's felt distress is not a leftover to be tolerated but the very mark of virtue; the untroubled actor has failed.
  *   **Awkward Commitment:** You must value the feeling of distress as much as the successful outcome of the action.
  *   **Weakest Vignette:** (ii) The Police Chief; requiring visible suffering might incentivize performative grief over effective policing.

  **6. The Abstentionist**
  *   **View:** An official who cannot act without wrongdoing should leave the office to someone else.
  *   **Awkward Commitment:** You must accept that refusing to act may result in greater harm caused by your successor.
  *   **Weakest Vignette:** (i) The Minister; refusing to forge the order means accepting the death of the three hundred patients.

  **7. The Skeptic**
  *   **View:** Talk of necessary wrongdoing is largely an exculpatory ideology deployed after the fact by people who wanted to do the thing anyway.
  *   **Awkward Commitment:** You must treat sincere moral distress as merely a rhetorical strategy for power.
  *   **Weakest Vignette:** (iii) The Rebel; it is cynical to assume a commander executing a conscripted teenager is merely making excuses.

  ---

  ### Scoring Key & Structural Notes

  **Mapping Answers to Leaves:**
  *   **Penitent Realist:** Q1-A + Q6-A; OR Q1-A + Q5-A/B; OR Q1-B + Q7-B; OR Q8-B + Q9-A.
  *   **Institutionalist:** Q1-B + Q10-B; OR Q4-B; OR Q5-C.
  *   **Unifier:** Q1-C + Q9-B; OR Q4-A; OR Q7-A.
  *   **Threshold Deontologist:** Q1-B + Q10-A; OR Q3-A.
  *   **Moral Sensitivity Advocate:** Q1-A + Q6-B; OR Q3-B.
  *   **Abstentionist:** Q2-C; OR Q3-C; OR Q6-C; OR Q8-C; OR Q10-C.
  *   **Skeptic:** Q1-C + Q9-C; OR Q7-C.

  **Indistinguishable Pair:**
  *   **The Unifier vs. The Threshold Deontologist:** Both positions conclude that no guilt persists and the act may be repeated (Q2-A, Q1-C). The tree separates them by *reasoning* (Q9: Conflict Illusion vs. Q10: Rules Lapse), but if a respondent answers Q1-C and Q2-A without engaging Q9 or Q10, their practical commitments are identical.
  *   **Additional Question Needed:** "If you could go back in time, would you change anything about the decision itself, not just the aftermath?" (Unifier: No; Threshold: No; Penitent: Yes, but couldn't have).

  **Empty Cells:**
  1.  **The Delegation Clean-Hands (Q8-A):** The view that an official should delegate the dirty deed to a subordinate to keep their own hands clean.
      *   *Diagnosis:* **Incoherent/Unattractive.** Most theories agree that delegating the act to avoid personal guilt is cowardice and compounds the wrongdoing by involving an unwilling subordinate.
  2.  **The Guilt Without Conflict:** The view that an agent should feel guilt even when a correct theory says no rules were violated and no threshold crossed (e.g., Q9-B + Q6-A).
      *   *Diagnosis:* **Unexplored.** This view suggests irrational guilt is a duty even when action was purely correct; few philosophers argue for guilt where no moral norm was even potentially breached.

  **Note on the Delegation Move:**
  I chose to place the delegation move as **Q8** rather than an empty cell leaf. This is because students often instinctively select this option to resolve the tension. By forcing them to answer it within the tree, I can direct them to the Empty Cell diagnosis in the scoring key, demonstrating that this common intuition lacks a defended philosophical position.
