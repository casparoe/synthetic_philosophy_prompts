  **2. Output filtering and content classification**
  *Opacity-resilience: 0.2 | Deployment corrosion: 0.3 | Composite: -0.1*
  A scheming model can encode harmful intent steganographically, and operational pressure to reduce false positives incentivizes weakening the filters.

