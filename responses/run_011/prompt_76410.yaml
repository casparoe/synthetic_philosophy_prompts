  **Terms**
  Ken argues **Legal Positivism**: rules are valid solely because they were enacted by proper authority, regardless of moral content. Marisol argues **Substantive Validity**: rules require fairness, consistency, and notice to maintain binding force.

  **Round-by-Round**
  1.  **Ken.** Formally, a vote creates a rule; non-enforcement does not erase text from the bylaws.
  2.  **Ken.** Allowing members to deem rules "non-rules" invites anarchy; boards should own repeals explicitly.
  3.  **Ken.** Desuetude (death by disuse) rarely applies automatically in private organizations without specific clauses.
  4.  **Marisol.** Procedural validity doesn't guarantee fairness; members must be able to reasonably rely on enforcement patterns.
  5.  **Both.** Definitions establish whether members hold enforceable rights or revocable privileges.

  **What They Miss**
  Both ignore the practical solution: formally repeal the bylaw. They also overlook that selective enforcement against a dissenter could be challenged as discrimination or bad faith, regardless of the rule's validity. A board acting in bad faith can be liable even if the rule exists.

  **Third Neighbor**
  No, it wasn't just words. If Ken is right, Dov keeps his plot by the board's mercy, meaning they can take it later. If Marisol is right, Dov has a right they cannot touch. This defines whether the garden is ruled by laws or men.
