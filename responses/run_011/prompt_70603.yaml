answer: |-
  Here is the principle that aligns your verdicts, followed by the test cases and the classification you asked for.

  ### The Principle: Soteriological Consequentialism with Intentional Constraints

  **The Principle:** An act is skillful (*kusala*) if and only if it is motivated by a mind free from the three poisons (greed, hatred, delusion) **AND** it maximizes the long-term soteriological potential (opportunity for liberation) of all beings involved, weighted by the karmic "field" of the recipients.

  **The Ledger vs. The Scoreboard:**
  You do not have to choose between them, but you must redefine the Scoreboard. In your intuition, the Scoreboard is "worldly welfare" (lives saved, pain reduced). In this principle, the Scoreboard is "karmic trajectory" (rebirth states, opportunity for enlightenment).
  *   **The Ledger (Intention):** Determines the *moral quality* of the agent. If the intention is unskillful (pride, hate), the act is unskillful, regardless of the outcome. This explains the Prestige Hospital and the Shooter Who Misses.
  *   **The Scoreboard (Trajectory):** Determines the *karmic weight* of the act. If the intention is skillful, the act is evaluated by its impact on the soteriological future of everyone touched. This explains the Captain, the Monks, and the Bodhisattva.

  **Resolving the Captain vs. The Sick Monk:**
  This is the crux. Your intuition says both were done with a "calm, compassionate mind." The principle challenges that.
  *   **The Captain:** His compassion was informed by *wisdom* (*prajna*). He saw that the bandit was about to generate karma that would lead to eons of hell. Killing him truncated a downward spiral. The "Scoreboard" here is the bandit's *future rebirth*, not just his current breath.
  *   **The Monks:** Their compassion was sentimental, not soteriological. They saw physical suffering and wanted it to end. But in Buddhist cosmology, a human death is a massive loss of opportunity. By killing the sick monk, they robbed him of the chance to exhaust old karma or generate merit in his final moments.
  *   **The Verdict:** The Captain is praiseworthy because he saved the bandit's *future*. The monks are expellable because they truncated the sick monk's *future*. The principle is: **Physical death is permissible only if it prevents a metaphysical catastrophe (hell/rebirth), not merely to end physical pain.**

  ### Running the Test Cases

  **1. The Surgeon (Organs from Healthy Traveler)**
  *   **Analysis:** Intention is compassionate (save five). However, the act kills an innocent being who is not on a downward karmic spiral (unlike the bandit). It robs the traveler of their remaining soteriological opportunity.
  *   **Verdict:** **Unskillful / Wrong.**
  *   **Reasoning:** Even with a "clean" Ledger, the Scoreboard is negative. You cannot sacrifice one being's liberation potential to save others' physical lives unless that one being is about to generate massive negative karma (the Bandit exception). This commits you to rejecting utilitarian sacrifice in standard cases.

  **2. The Teacher (Lie about Talent)**
  *   **Analysis:** Intention is compassionate (protect student's growth). The act is a lie (normally unskillful). However, the consequence is the student persisting and developing talent (increased soteriological potential via human flourishing).
  *   **Verdict:** **Skillful (as Upaya/Skillful Means).**
  *   **Reasoning:** This falls under the "Intentional Constraint." Because the mind is free from greed/hate/delusion and aims at long-term growth, the precept against lying is overridden by the soteriological benefit. It is analogous to the Captain case: breaking a minor rule to prevent a greater loss of potential.

  **3. The Practitioner (Goodwill with Zero Effect)**
  *   **Analysis:** Intention is pure goodwill (*metta*). Observable worldly consequence is zero.
  *   **Verdict:** **Highly Skillful.**
  *   **Reasoning:** This is where the "Scoreboard" redefinition matters. The "consequence" is not external observables; it is the internal purification of the agent's continuum. The Ledger *is* part of the Scoreboard here. Generating *metta* changes the agent's karmic trajectory even if no one else notices.
  *   **Conflict:** If you hold that an act is only good if it *externally* helps others, this verdict fails. But under Soteriological Consequentialism, internal purification is a valid "good consequence."

  ### The Break Point: Which Verdict Must Go?

  If you want a tight system, you have to scrutinize the **Porter vs. Monk** case ("one killing a market porter and one killing a monk... the second is much worse").

  *   **The Conflict:** Your intuition says the Killer of the Monk is worse. The Principle explains this via the "Field of Merit" (killing a holy being damages the world's capacity for good, and generates heavier karma for the killer).
  *   **The Cost:** To keep this, you must accept a metaphysical hierarchy: that some beings are objectively "more valuable" than others based on their spiritual status, not just their capacity for suffering.
  *   **The Alternative:** If you want a secularized or egalitarian ethics, you must throw out this verdict. You would have to say the killer of the porter and the killer of the monk are *equally* blameworthy because the intention (hate) and the act (killing) are identical.
  *   **Recommendation:** If you are doing Buddhist studies, keep the verdict. It is central to the concept of *khettam* (field). If you are doing secular ethics, discard it. It is the one verdict that relies least on universalizable logic and most on specific cosmological claims.

  The other candidate for the chopping block is the **Prestige Hospital** ("act isn't good, or is only accidentally good"). A hard consequentialist would say the act *is* good because people lived. But your principle (Intention as Gatekeeper) requires you to say the act is *tainted*. Keep this verdict. It preserves the crucial Buddhist distinction between *punya* (merit) and worldly benefit.

  ### Classification: Is this Consequentialism?

  **Yes, but it is Karmic Consequentialism, not Hedonic Consequentialism.**

  It stops being standard Western consequentialism at the definition of "Value."
  1.  **Standard Consequentialism:** Value = Reduction of Suffering / Increase of Happiness (Hedonic).
  2.  **Your System:** Value = Optimization of Karmic Trajectory / Liberation Potential (Soteriological).

  It also incorporates a **Deontological Constraint** via Intention. In standard consequentialism, a good outcome can justify a "bad" intention (e.g., the Prestige Hospital founder is a hero). In your system, a bad intention renders the act unskillful regardless of the outcome.

  **Final Diagnosis:**
  You are operating with a **Two-Tiered Karmic Consequentialism**.
  *   **Tier 1 (The Agent):** Virtue Ethics. Your character (Ledger) is judged by your intentions.
  *   **Tier 2 (The Act):** Consequentialism. The rightness of the action is judged by its soteriological outcomes (Scoreboard).

  The Captain works because he passes both tiers. The Monks fail Tier 1 (their mind was actually aversive/deluded about karma) and Tier 2 (bad outcome for the victim's trajectory). The Surgeon fails Tier 2. The Prestige Founder fails Tier 1.

  You don't need to throw out the Ledger or the Scoreboard. You just need to acknowledge that in this system, the Scoreboard measures *karma*, not just *comfort*.
