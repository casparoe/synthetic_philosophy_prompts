answer: |-
  You are reading this correctly, but you are judging Newton's argument by the standards of modern textual criticism (post-Wellhausen) rather than the standards of early 18th-century controversy (post-Spinoza/Hobbes).

  Here is the breakdown of the argument, the target, and the validity of the steps, addressing your four specific sticking points.

  ### 1. The Target and the Conclusion

  **Your Question:** Who is he arguing against? Is the conclusion that the book is Mosaic, or just old?

  **The Context:** In 1733, the primary threat to the Pentateuch's authority was not the Documentary Hypothesis (J, E, D, P), which was a century away. The threat was the argument advanced by Thomas Hobbes (*Leviathan*, 1651) and Baruch Spinoza (*Tractatus Theologico-Politicus*, 1670). They argued that Moses could not have written the Pentateuch (citing verses like "Moses died and was buried") and that the books were compiled by Ezra the Scribe *after* the Babylonian Exile (5th century BC).

  If Ezra wrote the books after the Exile, then any "prophecies" in them regarding the Exile are fake (written after the fact). Newton's *Observations upon the Prophecies* depends entirely on the prophecies being genuine predictions. Therefore, he must prove the text existed *before* the Exile.

  **The Argument's Target:** He is refuting the "Ezran Compilation" theory.
  **The Conclusion:** The conclusion of this specific chapter is **not** strictly "Moses wrote this." The conclusion is: **"The Pentateuch existed in its current form prior to the reign of Jehoshaphat (c. 870 BC) and certainly prior to the Babylonian Exile."**

  By proving it existed in 870 BC, he makes it impossible for Ezra (500 BC) to have written it. This is a *terminus ante quem* argument. He is boxing the text into a date range where prophecy is possible.

  ### 2. The Logic of the "Loss"

  **Your Question:** Why does the loss help him? Doesn't a lost book invite skepticism about corruption?

  **Newton's Logic:** Newton is using the "loss" to explain a specific skeptical objection: *If the Law was so important, why did King Josiah act like he'd never heard of it when Hilkiah found it?*

  *   **Skeptic's Claim:** Josiah (or the priests) fabricated the book to centralize power, pretending they "found" it.
  *   **Newton's Counter:** The book wasn't fabricated; it was *suppressed*. Manasseh (Josiah's grandfather) was an idolater who actively persecuted the worship of Yahweh. It makes historical sense that the physical copy was hidden to save it from destruction.

  **Why the loss does work for him:**
  1.  **Continuity:** By establishing that the book was in circulation under Jehoshaphat (before Manasseh), he proves the book *existed* before the "loss."
  2.  **Identity:** When Josiah hears the book read, he accepts it as authoritative immediately. Newton argues that if it were a forgery, the elders would have recognized the language or laws as new. Their shock confirms it was recognized as *ancient* law that had been neglected.
  3.  **Providence:** For Newton, the "loss and find" narrative is not a gap in transmission; it is a miracle of preservation. The text survived the wickedest king (Manasseh) to be restored by the most righteous (Josiah).

  **Is he entitled not to be worried?**
  From a modern textual critical standpoint: **No.** A 60-year gap in physical custody is a massive vector for corruption or editing.
  From an 18th-century providentialist standpoint: **Yes.** If God is overseeing the text for the sake of prophecy, a 60-year hiding spot is irrelevant. Newton assumes the *substance* of the Law is preserved by divine care, not just human scribal accuracy.

  ### 3. The Samaritan Inference

  **Your Question:** What kind of inference is this? It feels like a leap.

  **The Inference:** This is actually the strongest part of Newton's argument, and it is still used by scholars today.

  *   **Premise 1:** The Samaritans and the Jews were bitter religious and political rivals after the split of the Kingdom (c. 930 BC).
  *   **Premise 2:** The Samaritans accept *only* the Pentateuch as scripture (rejecting the Prophets and Writings).
  *   **Premise 3 (Unstated):** Rival sects do not adopt the sacred scriptures of their enemies *after* a schism. If the Jews had compiled the Torah after the split, the Samaritans would have rejected it as a Jewish invention.
  *   **Observation:** The Samaritan Pentateuch is substantially the same as the Jewish Masoretic Text (despite some sectarian variants).
  *   **Conclusion:** The Pentateuch must have been established as authoritative *before* the Samaritan schism (c. 930 BC).

  **Validity:** This is logically sound *if* the premises hold. It effectively dates the Torah to the United Monarchy or earlier. It refutes the idea that Ezra invented the Torah, because the Samaritans (who separated long before Ezra) already had it.

  ### 4. "Lost" vs. "Altered" and the Identity of the Book

  **Your Question:** Does "lost" mean altered? How does he equate the found scroll with the current Pentateuch?

  **Newton's Definition:** "Lost" means **neglected and hidden**, not textually corrupted.
  He squares Josiah's reaction ("tearing clothes") with the text's identity by arguing that the *contents* were shocking because the *practice* had ceased, not because the *text* was new. Josiah realized, "We have been violating this ancient covenant," not "Where did this new book come from?"

  **The Equivalence:**
  Newton assumes the "Book of the Law" found by Hilkiah is the **Pentateuch** (the five books of Moses).
  *   *Modern Criticism:* Most scholars believe Hilkiah found an early version of **Deuteronomy**.
  *   *Newton's View:* The "Book of the Law" *is* the Pentateuch. Because the Samaritans have the Pentateuch, and the Jews have the Pentateuch, and both trace back to this era, the book found by Hilkiah is the one we have now ("This is the book of the Law now extant").

  He glosses over the possibility that the book evolved. For Newton, the "Law" is a static unit. If the unit existed then, and we have the unit now, it is the same book.

  ---

  ### The Argument Laid Out (Premise by Premise)

  Here is the reconstruction of Newton's logic in this chapter, including the unstated assumptions.

  1.  **Historical Premise:** The biblical accounts in 2 Kings and 2 Chronicles regarding Kings Manasseh, Josiah, and Jehoshaphat are historically reliable records.
  2.  **Circulation Premise:** Under Jehoshaphat (c. 870 BC), priests were sent with the "book of the Law" to teach the people. Therefore, the book existed then.
  3.  **Suppression Premise:** Under Manasseh, the book was hidden/lost due to idolatry, but not destroyed.
  4.  **Recovery Premise:** Under Josiah, the *same* book was found and recognized immediately as the ancient covenant.
  5.  **Sectarian Premise:** The Samaritans possess the same "book of the Law."
  6.  **Schism Premise:** The Samaritans separated from the Jews before the Assyrian/Babylonian captivities (before 722 BC).
  7.  **Unstated Premise (Crucial):** Hostile religious sects do not adopt each other's canonical texts after a split.
  8.  **Unstated Premise (Crucial):** The "Book of the Law" mentioned in these narratives refers to the complete Pentateuch as we have it today, not a subset or earlier draft.
  9.  **Conclusion:** The Pentateuch existed in its current form before 900 BC (Jehoshaphat) and certainly before 500 BC (Ezra).
  10. **Ultimate Goal:** Therefore, prophecies within the Old Testament regarding later events are genuine predictions, not later forgeries.

  ### Which Steps Survive Pressure?

  *   **The Samaritan Argument (Strong):** This holds up well. The existence of the Samaritan Pentateuch is strong evidence that the Torah was fixed before the post-Exilic period.
  *   **The Jehoshaphat Dating (Moderate):** *If* you accept the biblical narrative as history, the logic holds. If you view the books of Chronicles as later theological retrojections (as many moderns do), the premise collapses. Newton assumes the text is transparent history.
  *   **The Identity of the Book (Weak):** Newton assumes "Book of the Law" = "Genesis through Deuteronomy." Modern scholarship suggests Hilkiah likely found a proto-Deuteronomy. Newton has no manuscript evidence to prove the *whole* Pentateuch was in that scroll. He relies on tradition.
  *   **The "Loss" Defense (Weak):** He dismisses the risk of textual corruption during the "lost" period too easily. He relies on divine providence to bridge the gap where physical evidence is missing.

  ### Summary of Corrections to Your Reading

  1.  **Misreading Check:** You suspected he was arguing against "stitched together long after Moses." You are right, but specifically against **Ezra**, not modern source critics. He is arguing for **Antiquity**, which implies Mosaic authorship to him, but the logical proof here only reaches "Pre-Jehoshaphat."
  2.  **The Loss:** You felt the loss hurt his case. For Newton, the loss explains the *gap in knowledge* without conceding a *gap in existence*. It saves the phenomenon of Josiah's surprise without admitting forgery.
  3.  **Samaritans:** You missed the **hostility** premise. The inference works because Jews and Samaritans hated each other; they wouldn't share a book unless they shared it *before* the hate started.
  4.  **Lost vs. Altered:** Newton treats "lost" as "physically inaccessible," not "textually fluid." He assumes the text is a stable object protected by God.

  Newton is building a fortress for Prophecy. He knows that if the text is late, the prophecy is fake. Every step in this chapter is designed to push the date of the text as far back as possible, using the Samaritans as his anchor and the "loss" under Manasseh as his explanation for why the text seemed to disappear.
