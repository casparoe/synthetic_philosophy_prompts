answer: |-
  You have put your finger on the central tension in modern welfare economics. Your suspicion is correct: if "preference" is defined *strictly* as "that which explains the choice," then Revealed Preference (RP) is indeed a tautology. It is a bookkeeping identity, not a psychological claim. It says nothing about welfare, happiness, or what is "good" for the agent.

  However, when economists use RP to argue against policy (like your seminar colleague arguing against the soda tax), they are silently switching definitions. They are smuggling in the claim that **Choice = Welfare.**

  Your intuitions in cases 1–8 are tracking the difference between **Behavioral Preference** (what was chosen) and **Normative Preference** (what serves the agent's interests or aligns with their reflective self). To make sense of your cases without bolting on ad-hoc conditions, we need to adopt a specific framework. The most robust one for your purposes is the **Principle of Informed Reflective Stability.**

  Here is the principle, broken into three precise clauses, mapped to your cases.

  ### The Principle of Informed Reflective Stability

  A choice reveals a *normative* preference (one that counts for welfare and policy) if and only if it satisfies three conditions:

  **1. The Competence Clause:** The agent must understand the causal mapping between the choice and the outcome, and the choice must not be driven by framing errors or cognitive glitches.
  *   **Motivated by:** Case 3 (Framing) and Case 1 (Menu Size).
  *   **Application:** In Case 3, the arithmetic is identical; the flip is a processing error, not a valuation difference. In Case 1, the value of the tea hasn't changed, but the cognitive context has. This is a "bug," not a feature. The choice reveals a cognitive limitation, not a stable valuation of tea vs. coffee.
  *   **Verdict:** These choices do **not** reveal normative preferences.

  **2. The Coherence Clause:** The choices must be transitive and stable across normatively irrelevant contexts.
  *   **Motivated by:** Case 5 (Intransitivity) and Case 4 (IIA satisfaction).
  *   **Application:** Case 5 is logically incoherent; there is no "ordering" to reveal. Case 4 is the ideal: the presence of salad doesn't change the value of the sandwich.
  *   **Verdict:** Case 5 reveals nothing. Case 4 reveals a robust preference.

  **3. The Metapreference Clause:** The choice must align with the agent's higher-order desires (what they want to want) or their long-term planning self, rather than a transient impulse.
  *   **Motivated by:** Case 6 (Smoker), Case 7 (Time Inconsistency), and Case 8 (Pre-commitment).
  *   **Application:** This solves your smoker problem. The smoker has two selves: the "Doer" (buys cigs) and the "Planner" (wishes she hadn't). The RP of the Doer reveals an impulse. The RP of the Planner reveals a preference for health. For welfare analysis, we privilege the Planner because that is the self that endorses the life as a whole. Case 8 (deleting apps) is the Planner binding the Doer. Case 7 (hyperbolic discounting) shows a conflict; welfare economics usually privileges the long-term view (12 vs 13 months) over the impulsive view (today vs 1 month).
  *   **Verdict:** The cigarette purchase reveals an addiction, not a welfare-enhancing preference. The app deletion reveals a rational preference for focus.

  ### The Hard Case: Why is the Pie (Case 2) different from the Menu (Case 1)?

  You noted Case 2 (Pie) and Case 1 (Menu) are formally similar (an extra option changes the choice), but your intuition treats them differently. The Principle explains this via the **Competence Clause**.

  *   **Case 1 (Menu):** The addition of a third drink changes your friend's *perception* of the tea. This is a cognitive illusion (the decoy effect). The *objective* value of the tea is unchanged.
  *   **Case 2 (Pie):** The addition of the "last slice" context changes the *objective consequences* of the choice. Taking the last slice carries a social cost (being seen as greedy) that taking the second-to-last slice does not. Your friend isn't glitching; they are responding to a real change in the social environment. The option isn't just "Eat Pie," it is "Eat Pie + Incur Social Stigma."
  *   **Verdict:** Case 2 **does** reveal a preference (for pie + social propriety). Case 1 does not.

  ### Application: Opt-Out Organ Donation

  **The Case:** 90% of people are enrolled donors because they didn't fill out a form to opt out.
  **The Question:** Does the 90% reveal a preference to donate?

  **The Verdict:** **No.**
  Under the Principle of Informed Reflective Stability, this fails the **Competence Clause** and the **Metapreference Clause**.
  *   **Inertia is not Choice:** Failing to fill out a form is often a result of procrastination, confusion, or status quo bias, not a reflective endorsement of organ donation.
  *   **The Counterfactual Test:** If you asked them reflectively ("Imagine you are dead, do you want your organs used?"), many might say yes. But the *act of not mailing the form* does not reveal that. It reveals inertia.
  *   **Policy Implication:** You cannot claim the 90% *wanted* to donate based on the data. However, you *can* argue that the default aligns with what they *would* choose under reflective stability (evidence suggests most people support donation when asked directly). The default is a nudge toward their latent reflective preference, not a revelation of their active preference.

  ### Application: The Soda Tax Seminar Argument

  **The Argument:** "Purchase is the best evidence that soda makes the buyer better off."
  **The Verdict:** **This argument fails.**

  It relies on the tautological definition of preference (Choice = Preference) but uses it to make a normative claim (Choice = Good).
  *   **Addiction/Internalities:** Like the smoker (Case 6), soda consumption often involves habit formation and health misinformation. The "Doer" buys the soda; the "Planner" might prefer better health.
  *   **Framing/Information:** If the buyer doesn't know the sugar content (Competence Clause), the choice doesn't reveal a preference for *high sugar*, it reveals a preference for *sweet taste under ignorance*.
  *   **Conclusion:** A soda tax can be justified not by overriding preferences, but by aligning the immediate choice with the reflective, long-term preference of the agent (correcting an "internality").

  ### The Philosophical Core: Is "Preference" just "Choice"?

  You asked: *Is "she prefers A to B" ever more than a redescription of "she chose A"?*

  **1. The Economist's Definition (Positive):**
  Yes, it is a redescription. In strict microeconomic theory (Samuelson), preference is a binary relation derived from choice. It is a mathematical tool to ensure consistency. It is not a mental state. It has no "inner life." When an economist says a stranger prefers A to B, they mean "The stranger chose A when B was available." It is a prediction device.

  **2. The Human Definition (Normative/Psychological):**
  No, it is not a redescription. In ordinary language (and welfare economics), "preference" refers to a **mental state of valuation** that *causes* the choice.
  *   When you say your friend prefers her job to yours, you are making a claim about her *satisfaction, values, and reasons*.
  *   You are implying that if she chose your job, she would be *less happy*.

  **The Conflict:**
  The reason you feel uneasy is that economics tries to use the **Positive** definition to answer **Normative** questions.
  *   **Positive:** "She chose the soda." (Fact)
  *   **Positive:** "Therefore, she revealed a preference for soda." (Tautology)
  *   **Normative:** "Therefore, the soda makes her better off." (Non-sequitur)

  **The Resolution:**
  To save the concept of utility from being empty bookkeeping, you must accept that **Utility is a model of the inner life, not a record of outer behavior.**
  *   If we treat utility as *experienced welfare* (happiness, satisfaction, health), then choices are merely *imperfect signals* of utility.
  *   Sometimes the signal is noisy (Case 1, 3).
  *   Sometimes the signal is hijacked (Case 6, 8).
  *   Sometimes the signal is accurate (Case 4).

  **Why it feels different for your friend vs. a stranger:**
  When you talk about your friend, you have access to her **reasons** and **feelings**. You know she *likes* her job. When the economist talks about a stranger, they only have the **behavior**.
  *   **Your claim:** "She prefers her job" = "She experiences more satisfaction in her job." (Psychological truth).
  *   **Economist's claim:** "She prefers her job" = "She accepted the job offer." (Behavioral truth).

  **Final Summary:**
  Your gut calls are correct. Revealed Preference is a tautology if treated as a definition, but it becomes a substantive (and often false) empirical claim when treated as a measure of welfare.
  *   **Principle:** Use **Informed Reflective Stability**.
  *   **Soda Tax:** The seminar argument is invalid because it conflates impulse with welfare.
  *   **Organ Donation:** The 90% is inertia, not preference.
  *   **Philosophy:** "Preference" in welfare contexts must mean "what is good for the agent upon reflection," not just "what the agent did." If it means only the latter, economics has nothing to say about policy, only about prediction.

  You don't need to bolt on conditions to your working principle; you need to shift the definition of "preference" from **Choice** to **Endorsement.**
