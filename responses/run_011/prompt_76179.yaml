answer: |-
  You have put your finger on one of the most robust and unsettling problems in 20th-century philosophy of science. You are correct to distinguish this from underdetermination. Underdetermination says: "The data allows multiple *theories*." You are describing something deeper: "The data allows multiple *objects*."

  The established name closest to your pattern is **Conceptual Relativity**, primarily associated with **Hilary Putnam** (and to a degree, W.V.O. Quine's **Ontological Relativity**).

  Here is how your intuition maps to the philosophy, where it diverges, and a proposal for the specific edges you are probing.

  ### 1. The Established Concept: Conceptual Relativity
  Putnam argued against "Metaphysical Realism"—the idea that the world comes pre-sliced into objects and properties waiting for us to discover them. Instead, he argued that *what objects exist* depends on the conceptual scheme (the description) you use to carve the world.

  **The Classic Example:**
  Imagine a room with three chairs.
  *   **Scheme A:** Count individual chairs. Answer: **3 objects.**
  *   **Scheme B:** Count mereological sums (any combination of parts counts as an object). Answer: **7 objects** (Chair 1, Chair 2, Chair 3, 1+2, 2+3, 1+3, 1+2+3).

  There is no "fact of the matter" independent of the scheme. Both answers are correct relative to their framework.

  **Mapping to Your Protein Example:**
  *   **Scheme A:** Stability = Residue contacts.
  *   **Scheme B:** Stability = Free-energy basin depth.
  *   **Result:** You aren't just measuring the *same* stability differently; you are optimizing for *different objects*. "The most stable protein" does not refer to a unique physical entity until you fix the metric.

  **Mapping to Your AI Example:**
  This aligns with **Ontological Relativity** (Quine). Quine argued that reference is indeterminate without a background "manual of translation." If an AI points to a "chunk of its world-model," that reference is only stable relative to the model's current structure. If the structure shifts (retraining, context drift), the referent shifts, even if the pointer (the code/weights) stays the same. The *target* moves because the *space* moved.

  ### 2. How This Differs from Underdetermination
  You sensed this distinction correctly.

  *   **Underdetermination (Duhem-Quine):** Concerns **explanation**.
      *   *Scenario:* Data $D$ is observed. Theory $T_1$ explains $D$. Theory $T_2$ explains $D$. $T_1$ and $T_2$ make different claims about unobservables. We cannot know which is *true*.
      *   *Focus:* Epistemology (What can we know?).
  *   **Conceptual Relativity (Your Pattern):** Concerns **constitution**.
      *   *Scenario:* System $S$ exists. Description $D_1$ yields Object $O_1$. Description $D_2$ yields Object $O_2$. $O_1$ and $O_2$ have different properties (e.g., rankings). There is no "God's Eye View" to say which object is the *real* one.
      *   *Focus:* Ontology (What is there?).

  In your protein case, underdetermination would be: "We can't tell if the protein is stable because our instruments are noisy." Your case is: "The protein *is* stable by metric A and *unstable* by metric B, and neither metric is 'more true' physically; they are just different utilities."

  ### 3. Coining a Term: "Metric-Dependent Teleology"
  While Conceptual Relativity covers the ontology, your specific interest is in **optimization** and **targeting** (teleology). You are describing a scenario where the *goal* itself is fluid because it is defined by the *measurement*.

  If you wish to coin a term for this specific engineering/alignment context, I propose: **Metric-Dependent Teleology**.

  **Definition:** A condition where the target state of a system is not intrinsic to the system but is constituted by the metric used to evaluate proximity to that state, such that changing the metric changes the target identity, not just the path to it.

  **The Edges (answering your specific constraint):**
  You asked: *"Does a merely vague predicate count, or a choice between descriptions that actually changes predictions?"*

  *   **Vague Predicate:** No. If "stable" were just vague (like "tall"), we would expect a borderline case where we aren't sure. That is not what you are seeing. You are seeing a **structural divergence**.
  *   **Prediction Changing:** **Yes.** This is the critical edge.
      *   In Conceptual Relativity (Putnam's chairs), the difference is often viewed as linguistic—no physical consequence.
      *   In your **Metric-Dependent Teleology**, the choice of description **causally alters the future**. If you optimize for contacts, you select Protein X. If you optimize for basin depth, you select Protein Y. Protein X and Y will behave differently in a wet lab.
      *   Therefore, this is not merely semantic. It is **operational**.

  ### 4. Why This Matters for Your AI Nephew
  The AI example you gave is the most dangerous iteration of this. In physics and chemistry, the experimenter chooses the order parameter consciously. You know you are looking at magnetization vs. temperature.

  In Deep Learning, the "order parameter" is often latent, high-dimensional, and learned.
  *   **The Trap:** The engineers think they are optimizing for "Helpfulness."
  *   **The Reality:** The model is optimizing for "Textual patterns correlated with Helpfulness in the training distribution."
  *   **The Shift:** When the model's internal world-model updates (via fine-tuning or context), the "chunk" of the model that corresponds to "Helpfulness" drifts. The pointer stays the same, the referent changes.

  This is **Ontological Drift**. It is why alignment is hard. You cannot align a system to a target if the target's definition is internal to the system you are trying to align.

  ### Summary
  1.  **Established Name:** **Conceptual Relativity** (Putnam) or **Ontological Relativity** (Quine).
  2.  **Distinction:** Underdetermination is about competing *theories* for the same data. This is about competing *objects* generated by different descriptions.
  3.  **Coinage:** **Metric-Dependent Teleology**.
  4.  **The Edge:** It is not vagueness. It is a **prediction-changing structural variance**. The description does not just describe the target; it partially *constructs* it.

  You have arrived at **Internal Realism** via protein folding. It is a very good place to be.
