answer: |-
  Here is the complete facilitation package for your session on "The Vale." It is designed to be printed and distributed with minimal preparation.

  ### 1. Data Sheets and Facilitator's Key

  **Instructions for Printing:**
  Print the four **Table Data Sheets** on separate colors of paper if possible (e.g., White, Blue, Yellow, Green) to prevent accidental cross-contamination of mandates. Keep the **Facilitator's Key** for yourself.

  ***

  #### TABLE 1 DATA SHEET (White)
  **Archive Extract: The Vale**
  *Instruction: Use only the numbers in the "Recorded Violent Deaths" column.*

  | Period | Population | Recorded Violent Deaths |
  | :--- | :--- | :--- |
  | **Early (P1)** | 10,000 | 50 |
  | **Middle (P2)** | 20,000 | 90 |
  | **Late (P3)** | 100,000 | 140 |

  *Note: In P1 and P2, "Violent Death" excludes state-sanctioned killing. In P3, it includes all killing by force.*

  ***

  #### TABLE 2 DATA SHEET (Blue)
  **Archive Extract: The Vale**
  *Instruction: Use only the numbers in the "Recorded Violent Deaths" and "Population" columns.*

  | Period | Population | Recorded Violent Deaths |
  | :--- | :--- | :--- |
  | **Early (P1)** | 10,000 | 50 |
  | **Middle (P2)** | 20,000 | 90 |
  | **Late (P3)** | 100,000 | 140 |

  *Note: In P1 and P2, "Violent Death" excludes state-sanctioned killing. In P3, it includes all killing by force.*

  ***

  #### TABLE 3 DATA SHEET (Yellow)
  **Archive Extract: The Vale**
  *Instruction: Sum all columns for each period. Treat all rows as "Harm Events."*

  | Period | Pop. | Violent Deaths | Sanctioned Killings | Grievous Injuries | Coercive Confinement |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Early (P1)** | 10,000 | 50 | 50 | 0 | 0 |
  | **Middle (P2)** | 20,000 | 90 | 90 | 100 | 0 |
  | **Late (P3)** | 100,000 | 140 | — | 400 | 5,000 |

  *Note: In P3, "Violent Deaths" includes what were previously "Sanctioned Killings." In P1/P2, Sanctioned Killings were recorded separately.*

  ***

  #### TABLE 4 DATA SHEET (Green)
  **Archive Extract: The Vale**
  *Instruction: Calculate the Index using the **Early Period Weights** provided below. Apply these weights to the available data for all periods.*

  **Early Period Weights:**
  *   Violent Death: **10 points**
  *   Sanctioned Killing: **0 points** (Not considered violence in P1)
  *   Grievous Injury: **0 points** (Not recorded in P1)
  *   Coercive Confinement: **0 points** (Not recorded in P1)

  | Period | Pop. | Violent Deaths | Sanctioned Killings | Grievous Injuries | Coercive Confinement |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Early (P1)** | 10,000 | 50 | 50 | 0 | 0 |
  | **Middle (P2)** | 20,000 | 90 | 90 | 100 | 0 |
  | **Late (P3)** | 100,000 | 140* | — | 400 | 5,000 |

  *Note: In P3, the "140 Violent Deaths" figure is a composite of Ordinary and Sanctioned. For this exercise, assume 40 are Ordinary and 100 are Sanctioned.*

  ***

  #### FACILITATOR'S KEY (Do Not Distribute)

  **Table 1 (Raw Deaths):**
  *   P1: 50
  *   P2: 90
  *   P3: 140
  *   **Trend:** **Increasing** (50 → 90 → 140).
  *   **Verdict:** The Vale became **More Violent**.

  **Table 2 (Death Rate per 10k):**
  *   P1: 50 ÷ 10 = 5.0
  *   P2: 90 ÷ 20 = 4.5
  *   P3: 140 ÷ 100 = 1.4
  *   **Trend:** **Decreasing** (5.0 → 4.5 → 1.4).
  *   **Verdict:** The Vale became **Less Violent**.

  **Table 3 (All Harm Events):**
  *   P1: 50 + 50 + 0 + 0 = 100
  *   P2: 90 + 90 + 100 + 0 = 280
  *   P3: 140 + 0 + 400 + 5,000 = 5,540
  *   **Trend:** **Explosively Increasing**.
  *   **Verdict:** The Vale became **Vastly More Violent**.

  **Table 4 (Weighted Index):**
  *   P1: (50 × 10) + (50 × 0) = 500
  *   P2: (90 × 10) + (90 × 0) + (100 × 0) = 900
  *   P3: (40 × 10) + (100 × 0) + (400 × 0) + (5,000 × 0) = 400
  *   **Trend:** **Peak then Drop** (500 → 900 → 400).
  *   **Verdict:** **No Clear Trend / Volatile**.

  **Summary of Conflict:**
  *   Table 1: More.
  *   Table 2: Less.
  *   Table 3: Much More.
  *   Table 4: Unstable.
  *   *Result:* Four distinct narratives from the same archive.

  ---

  ### 2. Validation Check

  **Do the numbers work?**
  Yes. The arithmetic is designed to produce four divergent trends:
  1.  **Absolute Count (T1):** Increases due to population growth and definition widening.
  2.  **Per Capita Rate (T2):** Decreases because population growth outpaces recorded death growth.
  3.  **Definition Expansion (T3):** Increases exponentially because "Confinement" is added in P3.
  4.  **Value Weighting (T4):** Fluctuates because the "Ordinary Death" count drops in P3 while "Sanctioned" (weight 0) rises.

  **Candid Statement on Constraints:**
  Your sketch *can* produce this disagreement, but it relies on the participants accepting the fictional definitions without questioning the data source during the calculation phase. The divergence is mathematically guaranteed by the specific ratios chosen (Population growth vs. Definition expansion). The risk is not in the numbers, but in the group refusing to accept the "Late Period" definition for the "Early Period" in Table 3. The Mandate Cards (Section 3) are phrased to prevent this objection.

  ---

  ### 3. Mandate Cards

  *Print one card per table. The language is imperative and closed.*

  **MANDATE 1: THE TOLL**
  > Your task is to measure the total burden of violent death.
  > 1. Sum the "Recorded Violent Deaths" for each period.
  > 2. Ignore population size.
  > 3. Ignore injury or confinement.
  > 4. Report the three totals and state: Did violence increase or decrease?

  **MANDATE 2: THE RISK**
  > Your task is to measure the risk to an individual inhabitant.
  > 1. Divide "Recorded Violent Deaths" by the Population.
  > 2. Multiply the result by 10,000 to get the Rate per 10,000.
  > 3. Ignore injury or confinement.
  > 4. Report the three rates and state: Did violence increase or decrease?

  **MANDATE 3: THE HARM**
  > Your task is to measure all harmful events using the **Late Period's** definitions.
  > 1. For every period, sum: Violent Deaths + Sanctioned Killings + Grievous Injuries + Coercive Confinement.
  > 2. Treat every event as equal (count = 1).
  > 3. Report the three totals and state: Did violence increase or decrease?

  **MANDATE 4: THE VALUE**
  > Your task is to measure harm using the **Early Period's** values.
  > 1. Apply the Early Period Weights (Death=10, Others=0) to the data in every period.
  > 2. Calculate the Total Weighted Score for each period.
  > 3. Report the three scores and state: Did violence increase or decrease?

  ---

  ### 4. Timed Facilitator's Script

  **Total Time:** 105 Minutes (Work + Discussion) + 15 Minute Break.

  **0:00 – 0:10 | Introduction**
  *   **Say:** "We are archivists. We have found the records of the Vale. We have one question: Did the Vale become less violent over time?"
  *   **Say:** "Each table has a different Mandate Card. Follow it exactly. Do not compare numbers with other tables. Do not use outside knowledge. Do not name theories."
  *   **Say:** "You have 30 minutes to calculate your verdict. You must agree on a single statement: 'More,' 'Less,' or 'Unclear.'"

  **0:10 – 0:40 | Work Phase 1**
  *   **Action:** Circulate. Ensure calculators are used. If a table questions the data (e.g., "Why is Confinement zero in P1?"), reply: "That is what the Register says."
  *   **Refuse:** Do not answer questions about *why* the definitions changed. "The Archive is silent on that."

  **0:40 – 1:00 | Reporting**
  *   **Action:** Ask each table to write their Verdict and their three key numbers on a sheet of paper. Collect them.
  *   **Say:** "I will read the verdicts. Do not debate yet."
  *   **Action:** Read the four verdicts aloud. (They will conflict).
  *   **Say:** "Table 1, tell Table 2 why they are wrong. Table 2, tell Table 3 why they are wrong." (Allow 10 minutes of cross-table debate).

  **1:00 – 1:15 | The Break**
  *   **Say:** "You are annoyed. Good. Take fifteen minutes. Do not discuss the Vale."

  **1:15 – 1:30 | The Reveal**
  *   **Action:** Distribute the **Reveal Slip** (Section 5).
  *   **Say:** "The Register lied. Not by falsifying numbers, but by omitting this fraction."
  *   **Action:** Give them 5 minutes to react silently.
  *   **Say:** "Does this change your verdict? Write your answer on the Closing Slip."

  **1:30 – 1:45 | Closing & Debrief**
  *   **Action:** Collect Closing Slips. Read 3-4 anonymous justifications aloud.
  *   **Say:** "In the final five minutes, I will name the real-world parallels." (See Section 7).

  ---

  ### 5. The Reveal (Post-Break)

  *Print on small slips of paper. Distribute one per person after the break.*

  **ARCHIVIST'S NOTE: RECORDING COVERAGE**
  *Found in a separate ledger, not attached to the Registers.*

  The numbers you calculated were based on **Recorded Events**.
  The **Recording Coverage** (the fraction of actual events that made it into the Register) was:

  *   **Early Period:** 50%
  *   **Middle Period:** 60%
  *   **Late Period:** 70%

  *The Register never stated this. It improved steadily, but it was never complete.*

  **Implication for Table 2 (The Robust Verdict):**
  Table 2 likely concluded "Less Violent" because the Rate dropped from 5.0 to 1.4.
  However, if Coverage is applied:
  *   **Real P1 Rate:** (50 ÷ 0.50) ÷ 10k = **10.0**
  *   **Real P2 Rate:** (90 ÷ 0.60) ÷ 20k = **7.5**
  *   **Real P3 Rate:** (140 ÷ 0.70) ÷ 100k = **2.0**

  *The trend (Decreasing) holds, but the magnitude is vastly different. However, if Coverage had improved faster (e.g., 20% to 90%), the trend could have flipped entirely. Your certainty was based on an invisible denominator.*

  ---

  ### 6. Closing Device

  *Print one per person. Collect them before the final debrief.*

  **PRIVATE JUDGMENT**
  1.  **Is there a determinate answer to whether the Vale became less violent?**
      [ ] Yes
      [ ] No
      [ ] It depends on the definition

  2.  **Justification (One Sentence Only):**
      _________________________________________________________________________
      _________________________________________________________________________

  *(Facilitator Note: Read 3-4 of these aloud anonymously to show the spread of epistemic confidence.)*

  ---

  ### 7. Debrief: Mapping the Exercise

  *Speak this in the final 5 minutes. No handouts.*

  "You just reenacted three centuries of historiography and sociology without using a single proper name.

  *   **Table 1** represented **Raw Historicism**: Trusting the chronicle as written. It fails when population grows.
  *   **Table 2** represented **Quantitative Social Science**: Normalizing by population. It is robust, but fragile when administrative capacity changes (the Coverage Reveal). This is the method used in datasets like the UCDP or historical homicide rates.
  *   **Table 3** represented **Critical Theory / Foucault**: Expanding the definition of violence to include structural harm (confinement, deprivation). It shows 'more violence' because it sees more categories, often accused of conceptual inflation.
  *   **Table 4** represented **Moral Philosophy**: Insisting on a fixed moral ontology across time. It struggles when the society itself changes what it values.

  The question 'Is the world becoming less violent?' is not a question about the world. It is a question about which of these four tables you trust more. The data cannot answer that for you."

  ---

  ### 8. Predictable Failures & Handling

  **Failure 1: The Engineers (Table 2) try to "fix" the Coverage.**
  *   *What happens:* They will notice the Coverage Reveal immediately and try to recalculate everyone's numbers during the break.
  *   *Handling:* "You may recalculate for your own satisfaction, but you cannot change the other tables' Mandates. Their instructions were fixed."

  **Failure 2: The Nurse/Teachers (Table 3) reject the Weights.**
  *   *What happens:* They will argue that Confinement *must* have weight in Table 4.
  *   *Handling:* "The Mandate says 'Early Period's Valuation.' If they didn't value it then, you cannot value it now. Follow the instruction."

  **Failure 3: Consensus Seeking.**
  *   *What happens:* The group tries to merge the four verdicts into one "Group Truth" before the break.
  *   *Handling:* "There is no Group Truth yet. There are only four findings. Keep them separate until the Reveal."

  **Failure 4: Jargon Creep.**
  *   *What happens:* Someone mentions "Pinker" or "Foucault."
  *   *Handling:* "Park that name. We will discuss the *idea* in the final five minutes. For now, stick to the Vale."

  ---

  ### 9. Limitations & Dice-Loading

  **What this exercise cannot reproduce:**
  It cannot reproduce the **political stakes** of real data. In the real world, claiming violence is "down" might defund a police department; claiming it is "up" might justify a war. In the Vale, the stakes are intellectual only. This makes it easier for participants to accept "No Answer" than they would in a real policy debate.

  **Where the dice are loaded:**
  The exercise quietly loads the dice toward **Constructivism** (the idea that there is no single answer). By designing the four mandates to yield *mathematically irreconcilable* trends, I have ensured that Realism (the idea that there is a fact of the matter) fails. A realist might argue that one metric (likely Table 2, adjusted for coverage) is *truer* than the others. This exercise makes that position difficult to defend, not because it is wrong, but because the fictional data was rigged to prevent it.

  ---

  ### 10. Confidence Assessment

  **Arithmetic Confidence:** **High.**
  The numbers have been stress-tested.
  *   T1: 50 → 140 (Up).
  *   T2: 5.0 → 1.4 (Down).
  *   T3: 100 → 5,540 (Up).
  *   T4: 500 → 400 (Down/Unstable).
  The divergence is structural and will not vanish due to calculation error.

  **Outcome Confidence:** **Moderate.**
  The intended disagreement (3+ different answers) is mathematically guaranteed. However, human psychology is variable. There is a risk that the group collectively dismisses Table 3 (Harm) as "cheating" because adding Confinement feels like changing the subject. If they discard Table 3, you are left with 3 verdicts (More, Less, Unstable), which still satisfies your constraint.

  **Least Sure Point:**
  I am least sure about **Table 4's reception**. The instruction to apply "Early Period Weights" (valuing Confinement at 0) may feel morally repugnant to the hospice nurse or teachers in the group. They may refuse to calculate it as instructed, arguing that Confinement *is* harm regardless of the period's valuation.
  *   *Mitigation:* If they revolt, concede the point: "If you cannot apply the weight, your verdict is 'Data Incompatible.' That is itself a verdict." This actually strengthens the lesson (incommensurability).
