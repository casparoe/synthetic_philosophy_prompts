answer: |-
  Here is the session plan. It is designed to run for exactly 75 minutes.

  ### **Agreement on the Regulars**

  I agree with your assessment of both.
  *   **Prediction Market Guy (PMG):** He is technically correct that G-S assumes deterministic, ordinal aggregation. He is wrong that this renders the theorem irrelevant, because the *incentive incompatibility* it identifies leaks into probabilistic and cardinal mechanisms (e.g., proper scoring rules require truthfulness, but aggregation of beliefs often does not).
  *   **Election Method Advocate (EMA):** She is correct that Approval Voting falls outside the G-S hypotheses (it is not an ordinal ranking function). She is wrong that this grants immunity; Approval has its own strategic complexities (threshold setting, bullet voting), and G-S serves as a warning that *some* impossibility usually lurks nearby.

  **Where to place them:**
  Do not let them speak during the introduction. If they dismiss the theorem in minute 5, the room will deflate.
  *   **PMG:** Engage him during **Section 2 (Definitions)** when you define the Social Choice Function. Ask him to validate the domain constraints. This makes him a co-author of the hypotheses rather than a critic of the conclusion.
  *   **EMA:** Engage her during **Section 5 (Refusals/Scope)** when you discuss what lies outside the theorem. Use her to illustrate that "outside the theorem" $\neq$ "safe."

  ---

  ### **Session Plan: How to Read an Impossibility Result**

  **Total Time:** 75 Minutes
  **Materials:** Whiteboard, markers (three colors), handout with the single carrying table (optional, or draw it live).

  #### **0:00 – 0:10 | Introduction: Theorems as Maps, Not Verdicts**
  *   **Goal:** Shift the frame from "Voting is impossible" to "Here is the terrain."
  *   **Script:** "We often treat impossibility theorems as conversation-enders. 'Arrow says it's arbitrary, so why bother?' Today we are not learning social choice theory. We are learning how to read a theorem without letting it stop your thinking. We are using Gibbard–Satterthwaite (G-S) as the specimen."
  *   **Rule:** "No one is allowed to say 'so voting is broken' until minute 60."
  *   **Action:** Write the theorem's slogan on the board: *"Every non-dictatorial voting system is manipulable."* Cross out "voting system." Write *"Every onto, deterministic social choice function over 3+ alternatives..."*

  #### **0:10 – 0:25 | Dependency Structure: Building the Trap**
  *   **Goal:** Define the hypotheses precisely. This is where PMG is integrated.
  *   **Sequence:**
      1.  **Profile:** A list of preference orderings (one per voter). *Constraint:* Strict ordinals (no ties).
      2.  **Social Choice Function (SCF):** A function mapping profiles to a single winner. *Constraint:* Deterministic. (Ask PMG: "Does your market output a single deterministic winner or a probability distribution?" Let him confirm G-S doesn't bind him directly. *Crucial:* Add "But it binds the aggregation of those probabilities.")
      3.  **Onto (Surjective):** Every alternative can win under some profile. *Why:* If an option can never win, we aren't really choosing among three; we are choosing among two.
      4.  **Strategy-Proofness:** For every voter, at every profile, reporting truthfully is a dominant strategy.
  *   **The Delay:** Do **not** yet distinguish between "a profitable lie exists" and "lies will happen."
      *   *Reasoning:* If you introduce the game-theoretic equilibrium analysis now, the audience will argue about bounded rationality ("People are too lazy to calculate lies"). Keep the theorem about the *existence* of the vulnerability, not the *exploitation* of it.

  #### **0:25 – 0:40 | The Carrying Example: One Table to Rule Them All**
  *   **Goal:** Concrete visualization of manipulation.
  *   **The Setup:** 3 Voters (1, 2, 3), 3 Alternatives (A, B, C).
  *   **The Rule:** Use **Plurality Voting** (simplest to grasp, clearly manipulable).
  *   **The Table:**
      *   **Voter 1:** A > B > C
      *   **Voter 2:** B > C > A
      *   **Voter 3:** C > A > B
      *   *(Note: This creates a cycle, but Plurality ignores the lower ranks.)*
  *   **Scenario 1 (Sincere):**
      *   1 votes A, 2 votes B, 3 votes C.
      *   Result: 3-way tie. (Break tie alphabetically: A wins).
      *   Voter 3's utility: C is best, A is worst. 3 is unhappy.
  *   **Scenario 2 (Strategic):**
      *   Voter 3 realizes A will win the tie-break. 3 prefers B over A.
      *   3 votes **B** (insincerely).
      *   New Tally: A=1, B=2, C=0.
      *   Result: B wins.
      *   Voter 3's utility: B is second-best. Better than A.
      *   **Conclusion:** Voter 3 had a profitable deviation.
  *   **Requirements Check:**
      *   **Condorcet Winner?** No. (This is intentional). If there were a Condorcet winner, one might argue the "fault" is the rule failing to pick it. Here, the fault is purely incentive-driven.
      *   **Coordination?** Unilateral. Voter 3 acts alone. G-S is about individual strategy-proofness.
      *   **What it lacks:** It must conspicuously lack a **Dictator**. If Voter 1 were a dictator, Voter 3's lie wouldn't matter. Emphasize that no single voter controls the outcome.
      *   **Two-Alternative Warm-up?** **Skip it.** It takes time and the punchline is "3 is the magic number." Mention verbally: "With 2 options, you can't rank a third as a compromise. With 3, you can bury your rival."

  #### **0:40 – 1:00 | The Substitute for a Proof: The Pivotal Voter**
  *   **Goal:** Show *why* it must be true without the combinatorics.
  *   **Time:** 20 Minutes. (This is the core cognitive load).
  *   **Argument:** Do not attempt exhaustion. Use the **Pivotal Voter Intuition**.
      1.  Imagine we start with a profile where everyone ranks A first. A wins (by Onto/Unanimity).
      2.  Slowly change voters' preferences one by one, moving A from 1st to last.
      3.  Eventually, A must stop winning (because if everyone hates A, A shouldn't win).
      4.  There must be a specific voter whose change flips the outcome from A to Not-A. This is the **Pivotal Voter**.
      5.  **The Kicker:** If you are pivotal, you have power. If you have power, and there are 3+ options, you can arrange your vote to select your preferred outcome among the available winners.
      6.  If the system tries to hide this power (to prevent manipulation), it must make no one pivotal. If no one is pivotal, the outcome never changes. That violates **Onto**.
      7.  Therefore: Either someone is a Dictator (always pivotal), or someone can manipulate (pivotal at some profile).
  *   **Board Work:** Draw a "tipping point" diagram. Voter 1... Voter $k$... Voter $n$. Show the outcome flipping at $k$.
  *   **Validation:** Ask the room: "Does this feel like a proof?" (Answer: No, it's an intuition pump). "Does it convince you the theorem isn't magic?" (Answer: Yes).

  #### **1:00 – 1:10 | The Misconception Map**
  *   **Goal:** Pre-empt the standard rationalist dismissals.
  *   **Format:** Rapid fire. Write the misconception, draw a line through it, write the correction.
      1.  **"This is just Arrow."**
          *   *Correction:* Arrow is about ranking social welfare; G-S is about picking a single winner. Arrow assumes no interpersonal utility; G-S assumes only ordinal rankings.
      2.  **"All systems are equally bad."**
          *   *Correction:* The theorem says manipulation is *possible*, not *equally easy*. Some systems make finding the lie computationally hard (though not impossible).
      3.  **"Randomize and you escape."**
          *   *Correction:* Randomization escapes G-S but hits **Gibbard (1978)** for probabilistic outcomes. You trade strategic voting for strategic risk-aversion.
      4.  **"Manipulation is hard to find, so it's moot."**
          *   *Correction:* In small committees (like this one), it is trivial. In large elections, it is hard for *you*, but professional actors have bots.
      5.  **"Formalism nobody uses."** (Address PMG here implicitly).
          *   *Correction:* Any mechanism that aggregates preferences without money is vulnerable. Markets use money to align incentives; voting does not.

  #### **1:10 – 1:15 | Scope and Refusals (The EMA Intervention)**
  *   **Goal:** Define the boundary without promising safety beyond it.
  *   **Action:** Invite EMA to speak. "You use Approval Voting. Does G-S touch you?"
  *   **Expected Answer:** "No, because it's not ordinal."
  *   **Your Follow-up:** "Correct. G-S does not apply. But does that mean Approval is strategy-free?"
  *   **The Lesson:** "Falling outside the theorem's hypotheses is not a Get Out of Jail Free card. It just means you face a *different* impossibility. Approval voting has strategic threshold problems. The lesson of G-S is not 'use a different rule,' it is 'incentives are everywhere.'"
  *   **What to Cut (Say this out loud):**
      *   **Single-Peaked Preferences:** "If preferences are structured (left-to-right), manipulation vanishes. We are cutting this because real political preferences are rarely single-peaked."
      *   **Cardinal Utility:** "If we could compare utilities across people, we could maximize sum utility. We can't. We are cutting this because it requires a magic utility meter."
      *   **Complexity Results:** "We are not discussing NP-hardness of manipulation. That is a practical shield, not a theoretical one."

  #### **1:15 – 1:25 (Buffer/Closing) | The Closing Question**
  *   **Goal:** Discriminate understanding from slogan retention.
  *   **The Question:** "I propose a new voting system. It is deterministic, onto, and works for 3 candidates. It is not a dictatorship. I claim: 'No voter will ever have an incentive to lie.' Based on today, what is the specific flaw in my claim?"
  *   **Good Answer:** "Gibbard–Satterthwaite proves that a profitable lie *exists* for some profile. You are claiming it doesn't exist. You are claiming to have broken the theorem."
  *   **Bad Answer (Slogan Retention):** "Because all voting is broken," or "Because people are selfish." (These miss the logical necessity).
  *   **Bad Answer (Scope Error):** "Because you didn't use Approval Voting." (Misses the point that the proposed system *is* the one being tested).
  *   **Final Remark:** "The theorem doesn't tell you to stop voting. It tells you to stop expecting voting to do something it cannot: aggregate preferences without creating incentives to game the system. Design for the game, don't wish it away."

  ---

  ### **Specific Tactical Notes for the Facilitator**

  1.  **Managing the "Definition Dump":**
      *   Do not write the formal logic ($\forall f, \exists i, \exists \succ, \dots$) until the very end, if at all.
      *   Use English + Whiteboard diagrams.
      *   If you feel yourself defining "Social Welfare Function" vs "Social Choice Function," stop. Stick to "Rule that picks a winner."

  2.  **Managing the "Anecdote Drift":**
      *   When the room starts discussing the 2016 election or a specific meetup decision, interrupt: "That is an instance. We are studying the structure. Does the structure hold if the voters are angels? Yes. Does it hold if they are demons? Yes. Keep it structural."

  3.  **The "Onto" Condition:**
      *   This is the most fragile hypothesis. Audience members will suggest: "Just remove option C from the ballot."
      *   *Response:* "If you remove C, you have 2 options. G-S vanishes. But who decided to remove C? That decision process is now the voting system, and it is likely manipulable."

  4.  **Handling the PMG's "Deterministic" Objection:**
      *   If he pushes hard that markets are probabilistic: "Agreed. But if I ask you to aggregate the market prices into a single decision for the group (e.g., 'Where do we eat?'), you must collapse that probability to 1. That collapse is where G-S wakes up."

  5.  **Handling the EMA's "Approval" Objection:**
      *   If she claims Approval is perfect: "Approval Voting satisfies G-S because it violates the 'ordinal' hypothesis. But it fails 'strategy-proofness' in practice. The theorem is a warning light, not the only car on the road."

  ### **Summary of the "Carrying Example" Board State**
  *Draw this early and keep it visible.*

  | Voter | True Pref | Sincere Vote | Strategic Vote |
  | :--- | :--- | :--- | :--- |
  | **1** | A > B > C | A | A |
  | **2** | B > C > A | B | B |
  | **3** | C > A > B | C | **B** |
  | **Winner** | | **A** (Tie-break) | **B** |

  *Annotation:* "Voter 3 prefers B over A. Voter 3 changes vote. Winner changes. Incentive confirmed."
