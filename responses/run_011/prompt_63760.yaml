      *   *Prediction:* She will likely rule **Impermissible**. Why? Because the daughter is like the Promisee (Case 1/7) not the Murderer (Case 5). The Nurse is not sacrificing a year of life (Case 7). The lie undermines the practice of truth with an innocent party.

  6.  **Refining the Prediction (The "Best Guess"):**
