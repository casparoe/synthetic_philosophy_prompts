      *Does it match the Action case?
      *Action Case: Machine is functioning (Safety). Agent turns it off (Action). Safety ends.
      *Omission Case: Machine is malfunctioning (Threat). Agent fails to fix it (Omission). Threat continues (would have fixed itself).
      *This works.*
      *Comparative:* Both result in death that would have been avoided.
