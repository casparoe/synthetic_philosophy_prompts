  You're an expert in normative ethics — specifically the doing/allowing and killing/letting-die literature — and you've designed teaching cases for grad seminars before. Please think this one through carefully rather than reaching for the stock examples.

  Context: I'm a 2nd-year PhD student in moral philosophy and I'm running a seminar session next month where I want to argue that the doing/allowing distinction doesn't line up with any single structural feature people have tried to pin it to. My own half-baked idea is to introduce a pair of coined notions: a *sustaining omission*, which is an omission that doesn't just fail to stop something bad but keeps a threat going that would otherwise have run out of steam on its own; and its mirror image, an *unsustaining action*, which looks like a paradigm doing but really just withdraws support from something that was keeping a person safe. My claim is going to be that once you have both of these in front of you, the usual accounts — act vs. omission, the Foot/Thomson-style line between originating a threat and redirecting an existing one, and Quinn-style involvement — can't all survive intact.

  What I need from you is a purpose-built thought experiment. Specs:

  1. Realistic. A hospital ward, a building maintenance crew, a residential care home, something along those lines. No trolleys, no transplant cases, no runaway vehicles, no sci-fi tech, no exotic pathogens.
  2. Two agents in the same scenario, matched as closely as you can manage on what they know, what they intend, and what alternatives are open to them. One commits a sustaining omission that ought to come out as killing; the other performs an unsustaining action that ought to come out as letting die. The asymetry has to fall out of the structure of the case, not out of one of them being a sadist and the other being merely careless.
  3. One paragraph for the scenario — stretch to two if you genuinely need it — and no formal notation. Audience is a mixed room of grad students, half of whom have read some of this literature and half of whom haven't.
  4. Make sure the comparative/counterfactual account of harming (harming = making someone worse off than they would otherwise have been) gives the *same* verdict for both agents. So don't let one of them off the hook by having the victim already doomed, or their contribution screened off by someone else's. I want that account to be useless for telling my two agents apart, and I want that to be a deliberate feature of the design, not an accident.

  Then, after the scenario, do the check:

  - Spell out the death(s), and say what each of the four accounts — act vs. omission, originate vs. redirect, Quinn-style involvement, and the comparative account — delivers for each of the two agents, and why it delivers that rather than something else.
  - Tell me which single feature of the case is doing the heavy lifting, and run the ablation on it: what happens to each verdict if I delete that feature or flip it?
  - Say how a defender of the moral significance of doing vs. allowing would attack the case. I'd expect something like insisting one of my agents is doing a doing after all, or that a role-based duty converts the omission into a violation of a negative duty — give me the best version of that response, not a strawman.
  - And be honest with me at the end: does the case actually generate these verdicts from the theories, or am I smuggling them in through how I've described the scene? If it's the latter, point at exactly where.

  Before you write the scenario, spend a short paragraph brainstorming two or three candidate structures and telling me which one you picked and why — I want to see the design reasoning, but keep it tight. No bibliography and no citations please, I'll add those myself; naming positions and people is totally fine.
