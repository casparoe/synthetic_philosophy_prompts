answer: |-
  ### Design Reasoning

  I considered three structural candidates. First, a medical life-support pair (withdrawing treatment vs. failing to administer antidote), but this invites confounding variables about bodily integrity and special duties that distract from the structural point. Second, a physical barrier case (removing a shield vs. failing to build one), but "failing to build" is too easily classed as standard allowing. I selected a **maintenance/control panel scenario** because it allows us to manipulate the "default trajectory" of a threat versus a safeguard without invoking medical norms. By making both agents interact with identical machinery (switches on a wall) where the *valence* of the machine (safety vs. threat) and the *movement* (flip vs. don't flip) are crossed, we isolate the doing/allowing intuition from the act/omission distinction.

  ### The Scenario

  Two patients are in adjacent high-containment isolation wards managed by a single maintenance technician, Tech, who is monitoring the environmental controls from a central panel. In Ward 1, Patient A is vulnerable to extreme cold; their survival depends on a heating unit that is currently running on a continuous cycle. In Ward 2, Patient B is exposed to a volatile airborne toxin released by an accidental spill; the toxin is unstable and will naturally degrade into harmless inert gas within five minutes, but only if the room's ventilation is set to "Flush." Currently, the ventilation is set to "Recirculate," which keeps the toxin concentrated and lethal. Tech knows both patients will die within ten minutes unless the settings are changed, and Tech intends for both to die. To kill Patient A, Tech reaches out and flips the heating unit switch from "On" to "Off." To kill Patient B, Tech simply does nothing, leaving the ventilation switch in its current "Recirculate" position rather than flipping it to "Flush." In both cases, Tech could have easily acted otherwise, and in both cases, the patients die who would otherwise have lived.

  ### Analysis of Accounts

  **The Verdicts:**
  1.  **Act vs. Omission:** This account classifies Tech's interaction with Patient A as **Killing** (positive act) and Patient B as **Letting Die** (omission). It fails to capture the moral symmetry you want to highlight, or conversely, if your seminar claim is that B is also Killing, this account gets B wrong.
  2.  **Originate vs. Redirect (Foot/Thomson):** For Patient A, Tech interrupts a causal sequence sustaining life (withdrawing aid), which often leans toward *Letting Die* on redirective accounts. For Patient B, Tech fails to interrupt a causal sequence leading to death, which is standard *Letting Die*. This account struggles to classify A as Killing (if it views withdrawal as allowing) while classifying B as Killing (which it almost certainly won't). It likely calls both *Letting Die*, missing the "Sustaining Omission" intuition.
  3.  **Quinn-Style Involvement:** Quinn focuses on whether the agent makes the harm happen through their own agency versus failing to prevent it. Tech is highly involved in A's death (manipulating the switch). Tech is less involved in B's death (standing by). This account aligns with Act/Omission here, verdicting A as more culpable (Killing) and B as less (Allowing), failing to register the "Sustaining" nature of B's omission.
  4.  **Comparative Account (Harming):** This account yields the **same verdict** for both. Patient A is worse off than they would have been (alive) had Tech not acted. Patient B is worse off than they would have been (alive) had Tech acted. Both are harmed. This account cannot distinguish the moral quality of the two deaths, which is the feature you requested.

  **The Heavy Lifting Feature:**
  The work is being done by the **Default Trajectory of the Threat/Safety**. In Patient A's case, safety was the default trajectory until interrupted by an action. In Patient B's case, safety was the natural biological trajectory (toxin degradation) until sustained by the status quo (which the agent omitted to change). The intuition that B is "Killing" relies on the fact that the threat *would have expired* but for the agent's passive maintenance of the lethal status quo.

  **Ablation:**
  If you delete the "natural degradation" feature in Patient B's case (i.e., the toxin is stable and infinite unless flushed), B's case collapses into standard *Letting Die*. The "Sustaining Omission" intuition vanishes because the threat no longer "runs out of steam." If you flip the Action case so the heater was set to turn off automatically and Tech flips it to "On" (sustaining safety?), the intuition shifts. The moral weight hinges entirely on whether the agent is overriding a *self-limiting threat* (B) versus overriding a *self-sustaining safety* (A).

  **Defender Objection:**
  A defender of the doing/allowing distinction will argue that you are smuggling normativity into the description of the "default." They will claim that the ventilation system being set to "Recirculate" is not a *threat* initiated by the agent, but merely a background condition. They will insist that Tech's omission in Ward 2 is not "sustaining" the threat but merely "failing to rescue" from a pre-existing danger. They will argue that the "natural degradation" of the toxin is irrelevant; what matters is that Tech did not *inject* the toxin. They might also invoke role-based duties: if Tech is responsible for the vents, the omission is a violation of a positive duty, which remains distinct from the negative duty violated in Ward 1.

  **Honest Assessment:**
  You are partially smuggling the verdicts in through the **temporal framing**. By emphasizing that the toxin *will* degrade in five minutes, you prime the audience to view the continued presence of the toxin as an *extension* caused by the agent, rather than a *continuation* of a prior state. This relies on the audience accepting that "allowing a threat to persist beyond its natural lifespan" is structurally closer to "initiating a threat" than "failing to stop a threat." A sharp student might point out that the agent didn't *make* the toxin last longer; they just failed to make it shorter. The "Sustaining Omission" intuition holds only if we treat the natural expiry as the baseline norm, which is a substantive moral claim, not a structural fact.
