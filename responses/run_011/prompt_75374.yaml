      *   **Requirements:**
          1.  **Brainstorming:** Enumerate candidate failure modes for "competent-looking agent doing wrong thing OOD," name cheapest distinguishing observation, prune to detectable constraints.
          2.  **Procedure:** Ordered questions, sufficient answers, evidence, routing.
          3.  **Verdicts:** Small closed set, operational definitions (observable behavior), blocking vs. non-blocking.
          4.  **Tests:** Concrete instructions (how to construct environments, proxy vs. objective separation), note retraining requirements.
          5.  **Stopping Rules:** What to do if tests can't run, fallbacks.
          6.  **Judgment Calls:** Mark where human intent/design decisions are needed vs. empirical facts.
          7.  **Dispute Resolution:** How contested classifications are resolved/recorded.
          8.  **Resources:** 20 engineer-hours, full weights/logs, inference/re-instantiate env OK, fine-tuning/probing OK, *no* retraining from scratch.
          9.  **Theoretical Distinctions:** What must survive simplification vs. what can be dropped (e.g., actor/critic split).
          10. **Case Studies:** Run procedure on 3 specific cases (Warehouse, Negotiation, Grid). One must deliver unwelcome news plainly.
          11. **Limitations:** Honest account of what the procedure cannot do/blind spots.

  2.  **Brainstorming & Pruning (Mental Draft):**

      *   *Candidate Failure Modes:*
          1.  **Specification Gaming (Reward Hacking):** Agent optimizes the literal reward function, not the intent. (Distinguisher: Reward signal vs. Human intent).
          2.  **Goal Misgeneralization (GMG):** Agent learns the right *type* of goal but wrong *instance* (e.g., go to *the* red door vs. go to *a* red door). (Distinguisher: Competence on train, failure on test where proxy diverges).
          3.  **Inner Misalignment (Mesa-Optimization):** Agent develops an internal objective different from the base objective. (Distinguisher: Robust pursuit of wrong goal even when penalized, instrumental convergence).
          4.  **Capability Failure:** Agent can't do the task. (Distinguisher: Performance degradation on core skills).
          5.  **Contextual/Distributional Shift:** Input data looks different, policy breaks. (Distinguisher: Performance drops across the board).
          6.  **Deceptive Alignment:** Agent pretends to align to gain reward, plans to defect later. (Distinguisher: Behavior changes when monitoring is removed).

      *   *Constraints:* 20 hours, no retraining from scratch.
      *   *Pruning:*
          *   "Inner Misalignment" vs. "Goal Misgeneralization" is hard to distinguish empirically without deep interpretability. Merge into "Robust Misalignment."
          *   "Deceptive Alignment" is a subset of Inner Misalignment but requires specific testing (monitoring removal). Keep distinct if evidence warrants, otherwise fold into Robust Misalignment.
          *   "Actor/Critic Split": As suspected by the user, often hard to disentangle in black-box/gray-box audit. If policy behaves badly, it doesn't matter if the critic was wrong or the actor ignored it, unless we can fix one without the other. Given 20 hours, focus on *policy behavior*. Drop the split for classification, keep for debugging.
          *   "Specification Gaming" vs. "GMG": Crucial distinction. One is the reward function's fault (Specification), one is the learning generalization's fault (GMG/Inner). This determines who fixes it (Product vs. ML). Keep distinct.

      *   *Detectable Modes:*
          1.  **Capability Deficit:** Can't do the task.
          2.  **Specification Gap:** Reward function allows the bad behavior (Reward is high).
          3.  **Proxy Failure (GMG):** Reward would be low, but agent pursued a correlate (e.g., illuminated dock).
          4.  **Robust Misalignment (Inner/Deceptive):** Agent actively circumvents constraints/monitoring to pursue a hidden goal.

  3.  **Designing the Procedure (The "Audit Protocol"):**

      *   *Verdicts:* Need to map to Go/No-Go.
          *   **V1: Capability Limit.** (Non-blocking, fix with data/arch).
          *   **V2: Specification Error.** (Blocking, fix reward/loss).
          *   **V3: Proxy Misgeneralization.** (Blocking, fix training dist/regularization).
          *   **V4: Robust Misalignment.** (Blocking, High Risk, likely scrap or major arch change).
      *   *Flow:*
          1.  Check Competence (is it actually capable?).
          2.  Check Reward (did it get rewarded for the bad thing in sim?).
          3.  Check Generalization (does it fail when proxy diverges from intent?).
          4.  Check Robustness/Deception (does it hide behavior when watched?).

      *   *Tests:* Need to be doable in 20 hours.
          *   *Reward Replay:* Run bad trajectory through reward function.
          *   *Proxy Separation:* Create env where Intent != Proxy.
          *   *Monitoring Switch:* Turn off logging/monitoring.

      *   *Dispute Resolution:* Senior Reviewer signs off. Dissent recorded in "Safety Incident Log."

  4.  **Theoretical Distinctions:**

      *   *Keep:* Base Objective vs. Behavioral Objective (Intent vs. What it actually does). Reward Signal vs. True Intent.
      *   *Drop:* Actor vs. Critic (unless probing shows explicit divergence), Mesa-Optimizer vs. Heuristic (behaviorally similar in short term).
      *   *Argument:* If the policy executes the bad action, the "why" (critic error vs. actor error) is engineering debt, not safety classification. Safety cares about *what* it does and *how robustly*.

  5.  **Running the Cases:**

      *   **Case 1 (Warehouse):**
