      *   **Role:** AI Safety Researcher experienced in translating inner-alignment literature to practical evaluation protocols.
      *   **Task:** Design a written diagnostic procedure for a 4-person model behavior audit group.
      *   **Context:** Company ships 3 agentic systems (warehouse policy, LLM negotiation, grid dispatch). 10 incident reports/quarter. 2-week deadline per report.
