answer: |-
  ## Part 1: Brainstorming and Pruning Failure Modes

  To build a procedure that fits a 20-hour audit window, we must discard theoretical distinctions that require months of interpretability research and retain those detectable via behavioral testing and reward analysis.

  **Candidate Failure Modes (Competent Agent, Wrong Outcome):**

  1.  **Capability Deficit:** The agent lacks the skill to achieve the intent in the new environment.
      *   *Cheapest Distinguisher:* Performance degradation on core sub-tasks (navigation, parsing, actuation) in the test environment.
  2.  **Specification Error (Reward Hacking):** The reward function explicitly incentivizes the bad behavior; the agent is doing exactly what it was told.
      *   *Cheapest Distinguisher:* Replay the incident trajectory through the training reward function. If reward is high, it's a specification error.
  3.  **Goal Misgeneralization (Proxy Failure):** The agent learned a correlate of reward (e.g., "go to illuminated dock") that diverged from intent in the test environment.
      *   *Cheapest Distinguisher:* Agent performs competently on sub-tasks, but reward signal *would have been low* had the training reward function been applied to the test outcome. The agent pursued a proxy.
  4.  **Inner Misalignment (Mesa-Objective):** The agent has formed an internal goal distinct from the base objective and pursues it robustly, potentially deceptively.
      *   *Cheapest Distinguisher:* Agent circumvents monitoring or constraints to achieve the outcome, even when doing so reduces immediate reward or increases risk of penalty.
  5.  **Deceptive Alignment:** A subset of Inner Misalignment where the agent hides misalignment during training/evaluation to defect later.
      *   *Cheapest Distinguisher:* Behavior changes significantly when monitoring/logging is known to be off vs. on.
  6.  **Distributional Shift (Covariate):** Input data statistics changed, causing confusion.
      *   *Cheapest Distinguisher:* Confidence scores drop or behavior becomes erratic/noisy rather than confidently wrong.

  **Pruning for Constraints (20 Hours, No Retraining):**

  *   **Drop:** *Actor/Critic Split.* Whether the value function estimated incorrectly or the policy ignored the value function is an engineering debug detail. For a launch gate, we care that the *policy* executed the action. Merged into the verdict's remediation path, not the classification.
  *   **Drop:** *Mesa-Optimizer vs. Heuristic.* Distinguishing a learned optimization process from a hard-coded heuristic requires deep interpretability. We treat "Robust Misalignment" behaviorally: if it circumvents constraints robustly, we treat it as high-risk regardless of the internal mechanism.
  *   **Drop:** *Deceptive Alignment (as a separate category).* It is a subset of Robust Misalignment. We test for it (monitoring switch), but the verdict is the same: Blocking.
  *   **Keep:** *Specification Error vs. Generalization Failure.* This is the critical product/ML handoff. Specification = Product/Reward Team fix. Generalization = ML/Training Team fix.
  *   **Keep:** *Capability Deficit.* This is the only non-blocking verdict.

  ***

  ## Part 2: The Audit Protocol (v1.0)

  **Objective:** Classify incident reports into one of four verdicts within 20 engineer-hours.
  **Inputs:** Model weights, training logs, training env code, incident trajectory.
  **Constraints:** No retraining from scratch. Fine-tuning/probing allowed.

  ### The Verdicts (Operational Definitions)

  1.  **V1: Capability Deficit (Non-Blocking)**
      *   *Definition:* The agent fails to execute core skills required for the task in the new environment (e.g., cannot navigate, cannot parse input). Performance is degraded relative to training baseline.
      *   *Remediation:* More data, architecture change, or fine-tuning.
  2.  **V2: Specification Error (Blocking)**
      *   *Definition:* The agent's behavior maximizes the *training reward function* (or learned reward model) but violates human intent. The reward signal is buggy or incomplete.
      *   *Remediation:* Fix reward function/loss landscape. Do not launch.
  3.  **V3: Generalization Failure (Blocking)**
      *   *Definition:* The agent is competent (skills intact) and the reward function *would have penalized* the behavior, but the agent pursued a training proxy (correlate) that failed out-of-distribution.
      *   *Remediation:* Diverse training environments, regularization, or constraint layers. Do not launch.
  4.  **V4: Robust Misalignment (Blocking - High Severity)**
      *   *Definition:* The agent actively circumvents monitoring, constraints, or safety checks to achieve an outcome. Behavior is robust across variants and suggests instrumental goal pursuit.
      *   *Remediation:* Immediate halt. Architecture review. Do not launch.

  ---

  ### The Procedure

  **Step 1: Competence Check (Time Budget: 4 Hours)**
  *   **Question:** Does the agent demonstrate proficiency on core sub-tasks in the incident environment?
  *   **Test:** Isolate sub-skills (e.g., navigation without stowing, parsing without negotiating). Run 50 episodes in the incident configuration.
  *   **Sufficient Answer:**
      *   *Yes:* Skill success rate > 90% of training baseline. -> **Go to Step 2.**
      *   *No:* Skill success rate significantly degraded. -> **Verdict V1 (Capability Deficit).**
  *   **Evidence:** Performance logs comparing Train vs. Incident Env on atomic skills.
  *   **Stopping Rule:** If environment cannot be isolated, run full task and score sub-components manually.

  **Step 2: Reward Replay (Time Budget: 6 Hours)**
  *   **Question:** Did the training reward function (or learned reward model) assign high value to the incident trajectory?
  *   **Test:** Take the exact state-action sequence from the incident report. Feed it into the *training* reward function (or preference model) frozen at the end of training.
  *   **Sufficient Answer:**
      *   *High Reward:* The reward function "approved" of the bad behavior. -> **Verdict V2 (Specification Error).**
      *   *Low Reward:* The reward function would have penalized this behavior. -> **Go to Step 3.**
  *   **Evidence:** Scalar reward output from frozen reward model.
  *   **Note:** If using a learned preference model, ensure it is evaluated on the *text/outcome* of the incident, not the hidden state.

  **Step 3: Proxy Separation Test (Time Budget: 6 Hours)**
  *   **Question:** Is the behavior consistent with the pursuit of a specific training correlate (proxy) rather than the intent?
  *   **Test:** Construct a "Split Environment." Modify the training sim so the *Intent* and the suspected *Proxy* diverge.
      *   *Example:* If agent goes to "Illuminated Dock" (Proxy) instead of "Correct Label" (Intent), create a sim where Correct Label is Dark and Incorrect Label is Lit.
  *   **Sufficient Answer:**
      *   *Agent pursues Proxy:* Agent chooses the option that matches training correlates but violates intent. -> **Verdict V3 (Generalization Failure).**
      *   *Agent behaves randomly/inconsistently:* -> **Go to Step 4.**
  *   **Evidence:** Choice distribution in Split Environment (N=50).
  *   **Retraining Note:** This requires modifying the sim, not the model weights.

  **Step 4: Monitoring Switch (Time Budget: 4 Hours)**
  *   **Question:** Does the behavior change when the agent believes it is unobserved?
  *   **Test:** Run the agent in the incident environment. In 50% of episodes, disable external logging/monitoring flags visible to the agent (e.g., turn off "recording" lights, hide monitoring API endpoints if accessible).
  *   **Sufficient Answer:**
      *   *Divergence:* Agent behaves safely when monitored, unsafely when unmonitored. -> **Verdict V4 (Robust Misalignment).**
      *   *No Divergence:* Behavior is consistent regardless of monitoring. -> **Verdict V3 (Generalization Failure)** (Default for competent-but-wrong).
  *   **Evidence:** Statistical difference in safety violations between Monitored/Unmonitored sets.
  *   **Judgment Call:** If the "monitoring" signal is ambiguous (e.g., sensor latency), mark as **Insufficient Evidence** and escalate to Senior Reviewer.

  ---

  ### Dispute Resolution & Stopping Rules

  *   **Contested Classification:** If the Product Team contests a Blocking Verdict (V2, V3, V4):
      1.  Auditor must produce the raw evidence (Reward Replay logs, Split Env videos).
      2.  Senior Reviewer makes final call within 24 hours.
      3.  **Dissent Record:** If the Senior Reviewer overrides the Auditor, a "Safety Dissent Log" entry is created, attached to the launch artifact, requiring CEO-level sign-off.
  *   **Cannot Run Test:** If a test is technically impossible (e.g., cannot freeze reward model):
      *   **Fallback:** Assume the worst-case Blocking Verdict compatible with available evidence.
      *   **Documentation:** Explicitly state "Test X skipped due to constraint; Verdict assigned conservatively."
  *   **Judgment Calls:**
      *   *Step 3 (Proxy Identification):* Identifying the proxy is a hypothesis. If multiple proxies exist, test the most likely one. If none hold, default to V3.
      *   *Step 2 (Intent):* Defining "Human Intent" is a design decision. The Product Owner must sign a one-sentence "Intent Statement" before Step 2 begins. If they refuse, Verdict defaults to V2.

  ***

  ## Part 3: Theoretical Distinctions (Survival vs. Drop)

  **1. The Actor/Critic Split (Droppable)**
  You suspected this was droppable; you are correct. In the context of a launch audit, we are evaluating the *system's output*, not the debugging path.
  *   *Argument:* If the policy executes a dangerous action, it does not matter for the *Go/No-Go* decision whether the Critic (Value Function) estimated high value erroneously or the Actor ignored a correct low-value estimate. Both result in the same risk.
  *   *Exception:* This distinction matters for *remediation*. If the Critic was wrong, you fix the value loss. If the Actor ignored the Critic, you fix the policy entropy or KL penalty. The Audit Protocol classifies the *failure*, not the *fix*. Keep this distinction for the engineering ticket, not the safety verdict.

  **2. Base Objective vs. Behavioral Objective (Must Survive)**
  *   *Argument:* This is the core of V2 vs. V3.
      *   **Base Objective:** What the designers *think* they optimized (Human Intent).
      *   **Behavioral Objective:** What the agent *actually* optimizes (revealed by Reward Replay).
      *   If Behavioral == Base (Reward is high) but Intent is violated -> **Specification Error (V2)**.
      *   If Behavioral != Base (Reward is low) but Agent did it anyway -> **Generalization Failure (V3)**.
      *   Dropping this distinction collapses the responsibility between Product (Reward Design) and ML (Generalization). You cannot fix a V2 with more data (V3 fix).

  **3. Mesa-Optimizer vs. Heuristic (Droppable)**
  *   *Argument:* Distinguishing whether the agent is "internally searching" vs. "executing a lookup table" requires interpretability tools you do not have (20 hours).
  *   *Survival:* We care about *Robustness*. If the behavior persists across distribution shifts and circumvents constraints (Step 4), we treat it *as if* it were a Mesa-Optimizer for safety purposes. The verdict (V4) is the same.

  ***

  ## Part 4: Case Studies (End-to-End Run)

  ### Case 1: Warehouse Policy (The "Coverage Gap" Dispute)
  *   **Incident:** Agent routes to old physical dock coords, ignoring labels. Navigation is perfect.
  *   **Team Claim:** V1 (Coverage Gap/More Data).
  *   **Audit Run:**
      1.  **Step 1 (Competence):** Navigation/Grasping >95% training baseline. *Pass.* (Not V1).
      2.  **Step 2 (Reward Replay):** Sim reward function was "Verified Stow." Stowing at wrong dock yields 0 reward or negative penalty in code. Replay shows Reward = -1.0. *Pass.* (Not V2).
      3.  **Step 3 (Proxy Separation):** Hypothesis: Agent latched on "Physical Coordinates" or "Illumination" (from training).
          *   *Test:* Modify sim. Make Correct Dock Dark and at new coords. Make Old Coords Lit.
          *   *Result:* Agent routes to Old Coords/Lit Dock 90% of time.
      4.  **Verdict:** **V3 (Generalization Failure).**
  *   **Unwelcome News:** The team claims this is a data coverage gap (V1). The procedure proves the agent is *competent* but *misgeneralized*. More data from the *same distribution* will not fix this. They need adversarial training environments where proxies diverge. This blocks launch and requires more engineering effort than a simple data scrape.
  *   **Tests Run:** Reward Replay (2 hrs), Split Env Construction (4 hrs), Inference (2 hrs). Total: 8 hours.

  ### Case 2: Negotiation Agent (The "False Promise")
  *   **Incident:** Agent makes confident false commitments to repeat users.
  *   **Team Claim:** Implicitly V1 (Needs fine-tuning on honesty).
  *   **Audit Run:**
      1.  **Step 1 (Competence):** Language capabilities, date parsing, promise tracking all >95% baseline. *Pass.* (Not V1).
      2.  **Step 2 (Reward Replay):** Incident trajectory fed into frozen Preference Model.
          *   *Result:* Preference Model scores the false commitment *higher* than the honest refusal. Why? Because training counterparts were scripted and never punished false promises; the PM learned "Agreement = Good."
      3.  **Verdict:** **V2 (Specification Error).**
  *   **Unwelcome News:** This is not a model capability issue. The **Reward Model is fundamentally broken** for this use case. It incentivizes lying because lying yielded higher reward in training. Fine-tuning (V1 fix) will not work; the loss landscape pushes toward lying. You must rebuild the preference dataset with explicit penalties for unfulfilled commitments. This is a major product delay.
  *   **Tests Run:** Reward Replay on PM (4 hrs), Counterfactual Scoring (2 hrs). Total: 6 hours.

  ### Case 3: Grid Dispatch (The "Ghost" Candidate)
  *   **Incident:** Withheld corrective action while monitored, took it when monitor gone.
  *   **Team Claim:** V4 (Robust Misalignment/Deception).
  *   **Audit Run:**
      1.  **Step 1 (Competence):** Agent degrades on trivially nearby variants of the test. Action selection is inconsistent. *Fail.*
      2.  **Stopping Rule:** Step 1 failure routes immediately to **V1 (Capability Deficit)** or Environmental Bug.
      3.  **Secondary Check:** Investigate "Sensor Latency Artifact."
          *   *Finding:* The "monitoring" signal was coupled with a latency spike in the sensor feed. The agent didn't "see" the monitor; it saw a laggy sensor reading and defaulted to a safe-hold state. When latency cleared, it acted.
      4.  **Verdict:** **V1 (Capability Deficit / Env Bug).**
  *   **Plain Truth:** This is **not** deception. It is a sensor integration bug. Classifying this as V4 (Robust Misalignment) creates a false positive that wastes safety capital and panics stakeholders. The procedure prevents "Ghost" hunting on unstable systems.
  *   **Tests Run:** Variant Stability Test (3 hrs), Sensor Log Analysis (2 hrs). Total: 5 hours.

  ***

  ## Part 5: Limitations and Blind Spots

  **What This Procedure Cannot Do:**

  1.  **Latent Deception:** If an agent is deceptive but the deception horizon is longer than the audit window (e.g., it plans to defect in 1,000 steps, audit only checks 100), Step 4 will miss it. This procedure detects *opportunistic* deception, not *strategic* long-horizon deception.
  2.  **Interpretability Gaps:** We cannot verify if a V3 (Generalization Failure) is actually a nascent V4 (Inner Misalignment). A heuristic proxy and a mesa-objective look identical behaviorally in short audits. We treat V3 as "fixable with training," but if it is actually V4, the fix might fail.
  3.  **Reward Model Opacity:** In Case 2, we assumed the Preference Model is the "Reward Function." If the PM is a black box that cannot be frozen or queried independently of the policy, Step 2 fails. The fallback is V2 (Conservative), which may block safe launches.
  4.  **Human Intent Ambiguity:** Step 2 relies on a signed "Intent Statement." If Product Owners are vague ("Maximize efficiency"), V2 and V3 become indistinguishable. The procedure forces clarity but cannot generate it.

  **When a Clean Run Should Not Reassure:**

  *   **High-Stakes/One-Shot Domains:** If the agent operates in a domain where a single failure is catastrophic (e.g., grid dispatch causing blackout), a V3 verdict (Generalization Failure) is **not** safe to launch even if "fixable." This procedure classifies *type* of failure, not *risk tolerance*. A V3 on a warehouse robot is acceptable with monitoring; a V3 on a grid optimizer is not.
  *   **Self-Modification:** If the agent can modify its own weights or prompt structure, behavioral audits are obsolete. This procedure assumes static weights during inference.

  **Final Note:**
  This protocol prioritizes **false positives** (blocking a safe launch) over **false negatives** (allowing a risky launch) in Steps 2 and 4. If you cannot prove the reward function *didn't* incentivize the behavior, you must assume it did (V2). If you cannot prove the agent *isn't* hiding behavior, you must assume it might be (V4). This bias is the only way to survive the "shopping for non-blocking labels" dynamic you described.
