answer: |-
  There is no single, established term in the philosophy of biology or systematics that captures this pattern with the precision you require. The phenomenon you describe is the empirical shadow of the "Species Problem," but while the Species Problem is a theoretical debate about definitions, your observation is a longitudinal description of *practice*.

  Existing terms are insufficient:
  *   **"Lumping and Splitting"** describes the action but implies a pendulum swing of opinion rather than a method-driven revelation of different structural slices.
  *   **"Taxonomic Instability"** is typically reserved for nomenclatural changes (synonymy) or the churn of names, not the fluctuation of species counts derived from the same material.
  *   **"Cryptic Species"** describes the outcome of a split, not the cyclical volatility of the count itself.

  Because the literature lacks a label that isolates the *methodological driver* of *non-convergent counts* on *stable material*, I propose we coin the term:

  ### **Methodological Species Oscillation (MSO)**

  **Definition:**
  Methodological Species Oscillation is the non-convergent fluctuation in the number of delineated biological units within a fixed set of specimens, resulting from sequential shifts in analytical resolution or modality, where each methodology is internally valid and no prior methodology is retroactively falsified as erroneous.

  **The Edges of the Concept (Inclusions and Exclusions):**
  To satisfy your request for where the edges lie, we must define what fails to be an instance of MSO.

  1.  **Exclusion: The Discovery of New Material.**
      If the count rises because new specimens are collected from the field, this is not MSO. MSO requires the *jar* to remain the same. The ontology of the sample must be fixed; only the epistemology of the observer changes.
  2.  **Exclusion: Error Correction.**
      If the mitochondrial count drops from fourteen to eight because the earlier electrophoresis data is found to be contaminated or the morphological key is found to rely on sexual dimorphism mistaken for specific difference, this is not MSO. This is standard scientific correction. MSO requires that the earlier work remains "internally sound" and captures a "different slice" (e.g., evolutionary lineage vs. reproductive community) rather than a mistake.
  3.  **Exclusion: Taxonomic Inflation.**
      As you noted, inflation is driven by external incentives (conservation status, funding). In MSO, the motive is immaculate; the fluctuation is driven by the *affordances of the instrument*, not the *needs of the author*.
  4.  **Exclusion: Fundamental Ontological Vagueness.**
      This is the critical edge case regarding your question on bacteria.

  ### **Distinguishing from the Neighbours**

  **1. Versus Taxonomic Inflation:**
  *   **Directionality:** Inflation is unidirectional (counts rise). MSO is oscillatory (counts rise, fall, and rise again differently).
  *   **Causality:** Inflation is sociological (policy/funding). MSO is epistemic (instrument resolution).
  *   **Boundary:** If a subspecies is promoted to species solely to secure habitat protection, that is Inflation. If a subspecies is promoted to species because genomic data reveals a deep divergence time that morphological keys could not see, that is MSO.

  **2. Versus Species Concept Pluralism:**
  *   **Static vs. Dynamic:** Pluralism is a philosophical thesis that multiple species concepts (Biological, Phylogenetic, Morphological) can coexist as equally legitimate *at the same time*. MSO is a historical observation that the discipline *does not treat them as coexisting*, but rather as *successive replacements*.
  *   **The Conflict:** Pluralism says, "You can have 14 species under the Phylogenetic Concept and 8 under the Biological Concept, and both are true." MSO describes the reality where the 14 are published, then later the 8 are published as the "new" reality, rendering the 14 obsolete in the catalogues. MSO is the *temporal friction* caused by applying pluralist concepts sequentially rather than simultaneously.

  ### **The Bacterial Edge Case**

  You ask whether MSO extends to bacterial systematics, where organisms "may have had no fixed boundaries to begin with."

  **This is the ontological limit of the concept.**

  For MSO to apply, there must be a presumption that the *specimens* constitute a stable ontology that is being "sliced" differently. In your gastropods, even if the species boundaries are fuzzy, the individuals are discrete, sexually reproducing units. The methods are arguing over how to *group* discrete things.

  In bacterial systematics, if one accepts that horizontal gene transfer and clonal variation create a genuine continuum (a "fuzzy species" ontology), then the fluctuation in counts is not an *oscillation* of a hidden truth, but a *projection* of arbitrary thresholds onto a continuum.

  *   **Instance of MSO:** If bacterial counts change because we shift from 16S rRNA sequencing (97% similarity threshold) to Average Nucleotide Identity (95% threshold), this **is** MSO. The material is stable; the operational threshold (the instrument) changes; the output oscillates.
  *   **Outside MSO:** If the count changes because the population structure itself is revealed to be a reticulate network rather than a tree, and the concept of "species count" is abandoned for "population clusters," MSO dissolves. You cannot have an oscillation in species counts if the ontology does not support "species" as a countable unit.

  Therefore, MSO extends to bacteria **only insofar as** systematics continues to impose discrete operational taxonomic units (OTUs) upon them. If the discipline moves to a model where boundaries are acknowledged as fundamentally non-existent, MSO ceases to apply, replaced by **Ontological Dissolution**.

  ### **Philosophical Implication**

  You noted that one cannot say which list is correct without first declaring which evidence is entitled to decide. This suggests that MSO is not merely a technical nuisance, but evidence for **Pragmatic Realism**.

  The pattern implies that "species" are not mind-independent natural kinds waiting to be counted (which would imply convergence as methods improve), nor are they purely arbitrary social constructs (which would imply randomness). Rather, they are **stable clusters of properties** that reveal different topographies depending on the scale of the probe.

  The label **Methodological Species Oscillation** captures the drift you watched unfold. It marks the boundary where the improvement of instruments ceases to yield higher resolution of a single picture, and instead begins to generate different pictures of the same canvas.
