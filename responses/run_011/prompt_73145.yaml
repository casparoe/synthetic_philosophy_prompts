  The glyph is a closed circular bowl of uniform stroke weight with a horizontal terminal crossing the right side at exactly forty percent of the x-height from the baseline, resembling a simplified single-story 'a'. In the first alphabet, drawn for a theater poster in a geometric sans-serif style, the 'e' carries a high crossbar at sixty-five percent and the 'o' is a perfect circle, leaving the forty-percent crossbar glyph to settle unambiguously as the 'a'. In the second alphabet, hand-lettered for a newspaper masthead in a low-contrast humanist style, the 'e' is drawn with a matching forty-percent crossbar while the 'a' takes a distinct form with a vertical right stem, causing the original glyph to be read immediately as an 'e' despite its physical unchanged state.

  **Demonstration of the Case**

  The resemblance view must claim that the glyph's identity is intrinsic to its shape and the viewer's general history with letters. Because the drawing is identical in both placements, this view cannot explain why the mark is an 'a' in the first alphabet and an 'e' in the second without admitting that the "resemblance" is not to 'a's in general, but to the specific 'a's nearby. If it insists the glyph is inherently an 'a', it must declare the second reading a mistake; if it admits the second reading is valid, it has silently adopted the coherence view. The coherence view, by contrast, predicts the shift: identity is a slot in a system of contrasts. In the first alphabet, the 'e' slot is occupied by a high-crossbar shape, so the glyph fills the 'a' slot. In the second, the 'e' slot is defined by the low crossbar, pushing the glyph into the 'e' category.

  The feature doing the work is the *relative aperture height* of the crossbar within the set of closed-loop glyphs. If you remove the 'e' from both alphabets, the glyph reverts to being an unproblematic 'a' in both, proving the ambiguity is not in the shape but in the competition for the 'e' identity. A defender of the resemblance view might attack by arguing that resemblance is always context-sensitive—that we resemble the "local prototype." However, this surrenders the core claim that identity is a property of the mark in isolation; it turns "resemblance" into a synonym for "coherence." Regarding generalization, this structure does not work for chairs. A beanbag chair is a chair in a living room and a chair in an office; its function remains constant regardless of neighboring furniture. Letters are not tools but signs in a closed code; their identity is defined by difference, not utility. You cannot have a "chair" that becomes a "table" simply because the room already has a chair, but you can have a glyph that becomes an 'e' because the alphabet already has an 'a'.

  **The Mirror Case**

  The glyph is a rounded, open-top 'u' shape with vertical terminals and uniform stroke weight, lacking any descender or tail. Shown alone to ordinary readers, this mark is immediately identified as a lowercase 'u'. However, set within a specific hand-lettered script alphabet where the actual 'u' carries a descending tail on the right and the 'n' is constructed with sharp, square vertices, the open-top glyph is read without hesitation as the 'a'. In this system, the 'o' is a closed loop, reserving the closed identity, while the 'u' is the only letter with a descender, forcing the tail-less open curve into the 'a' slot by process of elimination within the family's geometry.

  **Comparison of Difficulty**

  The mirror case was significantly harder to construct honestly. In the first case, I relied on shifting the definition of 'e' to displace the glyph, which is a common typographic variation (high vs. low crossbar). In the mirror case, I had to override a deeply ingrained prior: an open-top curve is almost universally read as 'u' or 'n' in Latin script. To make it read as 'a', I had to engineer the surrounding letters ('u' with a tail, 'n' with square shoulders) to block every other exit, relying on the viewer's desire for systemic consistency to trump their immediate recognition of the shape. The first case exploits a ambiguity in style; the second case exploits a necessity in system, requiring a more radical departure from standard forms to ensure the "not an 'a' alone" condition holds without feeling like a trick.
