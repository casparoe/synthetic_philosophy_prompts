      *   *Key Tension:* OL assumes a stochastic DGP or an adversarial sequence of *outcomes*. LI assumes a fixed, deterministic (but uncomputable) truth value for sentences. The "outcome" for sentence $\phi$ is revealed only when $\phi$ is proven/disproven, which might take forever.

