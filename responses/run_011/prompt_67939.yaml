          *   *Idea B:* Computational budget for the *tester* (adversary).
          *   *Selection:* This is crucial. In standard no-arbitrage, *any* strategy is forbidden. In LI, only *efficient* strategies are forbidden. This maps to restricting the comparison class in regret bounds to poly-time algorithms.

