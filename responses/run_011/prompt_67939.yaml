      *   *LI Core:* A reasoner assigns probabilities $P_t(\phi)$ to logical sentences $\phi$ over time $t$. The "truth" is determined by a fixed logical theory (e.g., PA). The sequence is "logically induced" if no poly-time trader can make unbounded money betting against it.
