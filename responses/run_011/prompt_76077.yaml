answer: |-
  The dust in the ledger room did not float; it settled, heavy with the weight of four centuries. Elara brushed a layer of gray from the leather-bound book marked 1624–1700. She had been tasked with digitizing the foundry's lineage, tracing the steel punches that had built their reputation. The Van Der Haagen house *g* was legendary. It was the reason kings signed treaties and poets printed sonnets.

  Elara laid the translucent overlays on the light table. She had pulled proofs from the surviving matrices of every major recutting. There were twelve of them, spanning from the founder, Pieter, to the current Master, Hendrik.

  She aligned them by the baseline.

  At the top, Pieter's 1624 *g*. The ear was prominent, a sharp hook catching the light. The lower bowl was tight, closed like a fist. The axis leaned slightly left, fighting the gravity of the ink.

  She moved down the stack. 1750. The ear had softened. 1840. The bowl opened a fraction. 1920. The axis straightened.

  She placed the proof from last week's casting at the bottom.

  The difference between any two adjacent sheets was imperceptible. A human eye, even hers, could not find the seam where one generation ended and the next began. But the distance between the top and the bottom was a chasm. The modern *g* was wider, lighter, its ear a mere whisper. The axis had tilted three degrees to the right. They were different designs. They were not even the same species of letter.

  Elara rolled up the ledger and walked to the shop floor.

  The foundry smelled of ozone and hot metal. Hendrik stood at the hardening bench, tempering a fresh blank of steel. He did not look up as she approached.

  "The ledger," Elara said, placing the book on the bench. "And the overlays."

  Hendrik wiped his hands on a rag stained with oil and graphite. "The inventory is accurate?"

  "The inventory is accurate. The history is a lie." She spread the proofs out on the cast-iron surface. "Pieter's *g* is not our *g*. We haven't cast the house letter in a hundred years. We're casting a imitation of an imitation."

  Hendrik picked up the 1624 proof. He held it close to his eyes, then picked up the current punch from the rack. He laid the steel against the paper. "Look at the transition from the spine to the ear."

  "It's different," Elara said. "The angle is wrong. The weight is wrong. If a customer ordered a Pieter restoration, we couldn't fulfill it. We don't have the letter anymore."

  "We have the letter," Hendrik said. He set the punch down. "You are looking at the letter as a picture. A static thing. Like a stone carved once and left in the field."

  "It *is* a shape," Elara countered. "If the shape changes, the category breaks. If I paint a portrait of you every year, and every year I change the nose slightly, eventually I am not painting you. I am painting someone else. We have lost the invariant features. The *g* is gone."

  Hendrik picked up the graver. He tested the point on his thumb. "The paper changes, Elara. The ink changes. The press changes. Pieter printed on rag stock that drank ink like soil. We print on sized stock that sits on the surface. If we cut Pieter's shape today, the ink would spread. The ear would fill. The bowl would close. It would look like a blot, not a letter."

  "So we adapt," Elara said. "But we admit it. We call it the Van Der Haagen Modern. We don't pretend it's the house *g*."

  "The house *g* is not the steel," Hendrik said quietly. "It is the hand that cuts it. It is the chain. Every cutter looked at the previous generation and said, 'This is the *g*, and I will carry it forward.' The identity is in the transmission, not the ink."

  "That's mysticism," Elara said. "It's a category error. Cognitive science tells us category membership relies on feature similarity. If the features drift too far, the membership expires. We are selling a forgery."

  "We are selling a living thing," Hendrik said. "A letter that cannot breathe is dead."

  The bell above the shop door chimed. Kael, a printer from the city, stepped in. He wore a smock dusted with dried ink. He was waiting for a case of the house roman for a limited edition run of Milton.

  "Hendrik," Kael nodded. He walked to the proofing station where Elara had left the recent casts. He pulled a sheet toward him. He didn't look at the history; he looked at the work.

  He picked up a composing stick and began to pull sorts from the case downstairs. He set a line of type on the stone: *Paradise Lost*.

  Elara watched his hands. He worked quickly, snapping the types into place. He paused at the word *light*. He picked up the *g* from *long*. He held it up to the light, inspecting the face, then set it down.

  "This setting," Kael said, running a finger over the locked form. "It sings."

  He looked at Hendrik, then at Elara. "I've set type from the Bodoni shop, the Caslon shop. When I use their *g*, it feels like a guest in the room. It has its own agenda." He tapped the steel *g* in the stick. "This one... it knows its place. It locks with the 'e'. It holds the white space around the 'h'. It could have come from nowhere else."

  "It is the house *g*," Hendrik said.

  Kael shook his head. "I don't care about the house. I care about the page. This *g* belongs to this text. It fits the weight of the ink I'm using today. If you gave me the original 1624 punch, I bet you it would fight me. It would be too heavy for my paper. It would be a different letter because it would do a different job."

  Kael locked the quoins and lifted the form. "The letter isn't the steel, Master. And it isn't the shape on the paper. It's the fit. It's the solution to the problem of the page."

  He left, the bell chiming again.

  Elara stood alone with Hendrik. The shop hummed with the cooling metal.

  "The fit," Elara said. "So the identity is functional."

  "The identity is survival," Hendrik corrected. "If the letter does not work, it is not used. If it is not used, it ceases to be a letter. It becomes a drawing."

  He pushed the current punch toward her. Beside it, he placed the 1624 proof. "The steel is wearing. The matrix is softening. It is time for the thirteenth cutting."

  Hendrik picked up a fresh blank of steel, annealed and ready. He placed it on the bench. Then he handed Elara the graver.

  "You found the drift," Hendrik said. "You understand the geometry better than I ever did. You will cut the new punch."

  Elara looked at the tools. The graver was sharp, the steel blank smooth and waiting.

  "If I copy the 1624 proof," Elara said, her voice steady, "I restore the invariant features. I reclaim the original category. I ensure that the *g* is historically accurate."

  "You ensure it is a museum piece," Hendrik said. "It will not print well. The ink will spread. The ear will fill. Kael will return it. He will say it does not fit."

  "If I copy the current punch," Elara said, "I continue the drift. I accept that the letter is defined by the chain, not the shape. I admit that the *g* is whatever we say it is, as long as we say it slowly enough."

  "You admit that the letter is a tool," Hendrik said. "And tools wear. And tools are sharpened. When you sharpen a knife, you remove steel. The shape changes. The weight changes. Is it no longer the same knife?"

  "It cuts," Elara said.

  "It cuts," Hendrik agreed. "But only if you hold the steel right."

  Elara looked at the 1624 proof. The shape was beautiful. It was perfect in its geometry. It was the Platonic ideal of the Van Der Haagen *g*. It was also dead. It belonged to a world of rag paper and wooden presses that no longer existed. To cut that shape now would be to lie. It would look like the house *g*, but it would not *act* like the house *g*. It would fail on the page.

  She looked at the current punch. It was drifted. It was compromised. It was the result of twelve compromises made by twelve different hands trying to keep the letter alive in a changing world. It was not the original shape. But it was the original *function*.

  The shop floor demanded utility. The ledger demanded truth.

  Elara realized the ledger was the lie. The ledger assumed the letter was a static object that could be tracked like inventory. But the letter was a verb. It was an act of marking.

  She picked up the 1624 proof. She folded it neatly and placed it back in the ledger. She closed the book.

  She picked up the current punch. She held it under the lamp, studying the tilted axis, the opened bowl. She saw the wear where the steel had struck the copper matrix ten thousand times. She saw the history not in the records, but in the fatigue of the metal.

  She placed the current punch on the bench next to the fresh blank. She aligned them. She raised the graver.

  "I am not copying the shape," Elara said.

  Hendrik watched her, his hands still.

  "I am copying the intent," she said.

  She pressed the graver into the steel. It bit deep, shedding a curl of metal. She did not look at the 1624 proof. She looked at the current punch, and she looked at the blank, and she cut the line where the ear would begin. She did not restore the hook to its original sharpness. She cut the whisper that the last master had cut. She tilted the axis three degrees to the right.

  She was not preserving the object. She was preserving the practice.

  "The ear is too low," Hendrik said softly, watching the steel dust settle.

  "It will print clean," Elara said. She didn't look up. "The ink trap needs the space."

  Hendrik nodded. He turned back to the furnace. "The heat is ready for the hardening."

  Elara continued to cut. The sound of the graver was a steady scratch, like a pen on paper. She thought of Kael setting the type. He wouldn't know the history. He wouldn't know the drift. He would only know that the *g* fit the line. He would know that the letter worked.

  The category was not defined by the boundaries of the shape, but by the continuity of the use. The letter was not the steel. It was not the ink. It was the agreement between the cutter, the printer, and the reader that this mark meant *this sound*. As long as the agreement held, the letter survived.

  She finished the curve of the bowl. She wiped the steel clean. It looked like the punch she had copied. It did not look like the proof in the ledger.

  Elara set the new punch in the rack beside the old one. There was no visible difference between them. But the steel was fresh, and the edge was sharp.

  "Will you record the change?" Hendrik asked. He was pouring oil into the quenching trough.

  Elara opened the ledger. She dipped the pen in the ink. She looked at the blank space for the thirteenth entry.

  "No," she said.

  She wrote the date. She signed her name. She did not note the deviation. To note it would be to admit a break in the chain. To admit the break would be to kill the letter.

  She closed the book. The dust settled on the leather, hiding the seam between the old page and the new.

  "Test it tomorrow," Elara said.

  "We will," Hendrik said.

  Elara wiped the graver clean. The shop was quiet, save for the hiss of the cooling steel. The *g* was safe. It had changed, again. It would survive.
