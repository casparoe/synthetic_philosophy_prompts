answer: |-
  Here is a complete design for the 75-minute seminar. It is built to be run with minimal props but high psychological stakes, specifically engineered to isolate Pure Time Preference (PTP) from risk and uncertainty.

  ### 1. Rules, Materials, and Payoff Scheme

  **Materials:**
  *   **Tokens:** 200 Poker Chips (two distinct colors, e.g., Blue and Red, 100 each).
  *   **Containers:** 8 Opaque Envelopes or Cups (4 per "Universe").
  *   **Dice:** 2 D6 (for Universe B).
  *   **Paper:** 22 small slips for Pre-registration; 8 Decision Sheets (one per group).
  *   **Board:** Whiteboard for calculating implied rates.

  **The Payoff:**
  *   **Conversion:** 1 Chip = 0.25 Participation Points (max 5 points possible per student).
  *   **Stakes:** This must be non-trivial. 5 points is ~5% of a typical seminar grade. It hurts to leave chips on the table.

  **The Structure (Two Universes):**
  Split the class of 20 into **Universe A (Deterministic)** and **Universe B (Uncertainty)**.
  *   **Universe A:** 10 Students. Divided into 4 Groups (A1, A2, A3, A4).
  *   **Universe B:** 10 Students. Divided into 4 Groups (B1, B2, B3, B4).
  *   **Group Size:** 2-3 students per group. (Groups A4 and B4 are "Terminal" singletons or pairs).

  **The Chain Logic:**
  *   **Inheritance:** Each group inherits a Pot of chips from the previous group.
  *   **Decision:** They choose how many to **Consume** (keep immediately) vs. **Invest** (leave in the envelope).
  *   **Growth:** Invested chips double (x2) before being passed to the next group.
  *   **Terminal:** Group 4 (A4/B4) consumes *everything* remaining in the pot. They cannot invest.

  **The Variables:**
  *   **Universe A (Pure Time):** No risk. Choices are locked. The next group *will* exist.
  *   **Universe B (Confounds):** Before the pot passes to the next group, roll a D6. On a **1**, the "Future Collapses." The invested chips are lost (dumped in a "Void" bowl), and the game ends for that universe. On 2-6, the pot doubles and passes.
      *   *Note:* This simulates existential risk/extinction, not just personal mortality.

  **The "Fake" Past (Gen 0):**
  *   You (the Instructor) are Gen 0.
  *   You seed both Universe A1 and B1 pots with **20 Chips** each.
  *   **The Lie/Secret:** You tell the class: *"I started with 40 chips. I made a choice on how many to pass you. You will find out what I did at the end."* (In reality, you passed 20. The "40" creates the counterfactual for resentment).

  ---

  ### 2. Minute-by-Minute Schedule (75 Minutes)

  **00:00 – 00:10: Pre-Registration (The Trap)**
  *   Hand out slips. No discussion.
  *   **Prompt:** *"Imagine two strangers with identical lives. One lives today. One lives 80 years from now. If you could give $100 of resources to the person today, or invest it so it becomes $200 for the person in 80 years, what dollar amount for the future person makes you indifferent? (e.g., $200 future = $100 today? Or $200 future = $50 today?)"*
  *   Collect slips. Seal them in an envelope. Do not look at them.

  **00:10 – 00:15: Setup & Instructions**
  *   Split class into Universe A (Left) and Universe B (Right).
  *   Assign Groups 1-4 within universes. **Physical Separation:** Groups must not talk to other groups in their universe.
  *   **Instruction:** *"You are a generation. You inherit a pot. You decide: Eat or Invest. Invested chips double. The next group gets the doubled amount. The last group eats everything left."*
  *   **Crucial Distinction:** Tell Universe B: *"There is a risk the future ceases to exist. We will roll for survival after you invest."* Tell Universe A: *"The future is guaranteed."*

  **00:15 – 00:45: The Game (3 Rounds)**
  *   **Round 1 (Gen 1):** Groups A1 and B1 decide (5 mins). Hand in envelopes.
      *   *Instructor Action:* Count invested chips. Double them. For B1, roll the die. If "1", game over for B (dramatic moment). If 2-6, proceed.
  *   **Round 2 (Gen 2):** Groups A2 and B2 receive new pots. Decide (5 mins).
      *   *Instructor Action:* Double. Roll for B.
  *   **Round 3 (Gen 3):** Groups A3 and B3 receive pots. Decide (5 mins).
      *   *Instructor Action:* Double. Roll for B.
  *   **Round 4 (Terminal):** Groups A4 and B4 receive pots. They **must consume all**. No choice.
  *   **Buffer (10 mins):** Allow for dice rolls, counting, and the inevitable confusion/logistics.

  **00:45 – 00:55: The Reveal (The Emotional Hook)**
  *   Gather the class.
  *   **Reveal 1 (The Past):** *"I (Gen 0) started with 40 chips. I chose to consume 20 and pass you 20."*
      *   *Expected Reaction:* Gen 1 will feel shortchanged. "You could have doubled that!"
  *   **Reveal 2 (The Future):** Announce the final holdings of Group A4 and B4.
      *   *Contrast:* If A4 has 100 chips and B4 has 0 (due to a die roll), highlight the difference.
  *   **Reveal 3 (The Self):** Return the Pre-Registration slips.

  **00:55 – 01:15: Debrief & Calculation**
  *   Calculate Implied Discount Rates on the board.
  *   Map behavior to philosophical claims.
  *   Sidgwick/Rawls argument.
  *   Limitations.

  ---

  ### 3. The Debrief: Mapping Moments to Claims

  **Step 1: The Calculation (5 mins)**
  *   Pick a group from Universe A (e.g., A1).
  *   **Formula:** If they received 20 and invested 10, they were indifferent between **10 now** and **20 later** (for the next group).
  *   **Implied Rate:** 100% discount per generation.
  *   **Compare:** Ask students to look at their slip. *"Who wrote that the future person matters 50% as much as today? Who wrote 10%? Who played as if they matter 0%?"*
  *   **The Gap:** Highlight the discrepancy between the moral claim (slip) and the revealed preference (chips).

  **Step 2: Isolating the Variables (10 mins)**
  *   **Uncertainty:** Compare Universe A vs. Universe B.
      *   *"Did B save less than A?"* If yes, that is **Risk Premium**, not Pure Time Preference. That is rational discounting due to extinction risk.
      *   *"Did A still discount heavily?"* If yes, that is **Pure Time Preference**. There was no risk, no temptation (choices locked), and inequality was controlled (all students are peers).
  *   **Inequality:**
      *   *"Did you save less because you thought you were poorer than the future?"* Remind them everyone is a student in the same room. The only difference is *when* they sit in the chair.
  *   **Temptation:**
      *   *"Could you have changed your mind later?"* No. Choices were locked. This removes weakness of will.

  **Step 3: The Philosophical Payoff (5 mins)**
  *   **Sidgwick/Rawls Line:** *"Mere position in time is no more morally relevant than mere position in space."*
  *   **The Verdict:** Ask them: *"Does the behavior of Universe A support Sidgwick? Or does it prove that even when we strip away risk and greed, we simply don't care about the future?"*
  *   **The Trap:** If they say "We cared, but 10 chips now is worth more than 20 later," press them: *"Why? Is it because you might die? (No, you're in class). Is it because the chips might vanish? (No, Universe A). Or is it simply because 'later' feels less real?"*

  ---

  ### 4. Honest Account of Predictable Failures

  **1. The "Terminal Greed" Problem**
  *   **What happens:** Group A4/B4 knows they are last. They will consume 100% of the pot. They *should*.
  *   **The Risk:** Groups A3/B3 know A4/B4 are last. A3 might think, "Why save for them? They'll just eat it." This triggers **Backward Induction**. The discounting in Round 3 isn't PTP; it's rational response to a finite horizon.
  *   **The Fix:** In the debrief, admit this. *"Round 3 is contaminated by the end-of-game effect. Look at Round 1. You didn't know when the game would end. If you discounted in Round 1, that is the PTP signal."*

  **2. The "Candy Maximizer"**
  *   **What happens:** A student says, *"I didn't care about justice. I just wanted the points. This proves nothing about morality."*
  *   **The Response:** *"Exactly. The game reveals that when the cost of morality is tangible (chips), your stated principle collapses. The seminar isn't about whether you're a good person; it's about whether your moral principle can survive contact with incentives. If PTP is arbitrary, why does the incentive to prefer 'now' override it so easily?"*

  **3. Collusion**
  *   **What happens:** Group A1 whispers to Group A2: *"Save everything, we'll split the points later."*
  *   **The Fix:** Enforce strict isolation. If you catch them, disqualify the universe. (Threaten this at the start). Usually, the competition between Universe A and B prevents this; they want their "Civilization" to win.

  **4. The "Rigged" Accusation**
  *   **What happens:** If Universe B rolls a "1" early, they get 0 points. They will feel cheated.
  *   **The Response:** Acknowledge the pain. *"This is the point. Existential risk is not fair. If you discount the future because it might not exist, you are rational. But does that justify discounting the future in Universe A where the risk was zero?"*

  **5. Instructor Bias (Gen 0)**
  *   **What happens:** If you (Gen 0) passed too little, Gen 1 starts with nothing and can't play.
  *   **The Fix:** Always seed with enough to make a choice possible (20 chips). The "40 chips" story is a narrative device to generate resentment about *potential* savings, not actual deprivation.

  ---

  ### 5. Limitations: The Feature You Cannot Reproduce

  **The Finite Horizon vs. Infinite Future**
  *   **The Problem:** In the game, there is a known (or suspected) end. In reality, the human race (hopefully) does not have a "Terminal Group."
  *   **The Effect:** A known end induces **hyperbolic discounting** via backward induction. As the end nears, saving becomes irrational. This mimics PTP but is actually **End-Game Rationality**.
  *   **Can you paper over it?** No. You must name it.
  *   **How to handle it:**
      *   In the debrief, ask: *"In the game, saving for Gen 4 was the last act. In reality, there is no Gen 'Last'. Does knowing there is no last generation make you want to save more, or less?"*
      *   **The Philosophical Pivot:** Rawls's "Just Savings Principle" assumes a continuous chain. If the game shows we only save when there's a specific beneficiary (Gen 4), but stop when the chain dissolves, it suggests our altruism is **relational**, not **principled**.
      *   **Conclusion:** The game likely *overestimates* discounting compared to reality (because of the end-game effect). If they *still* argue for discounting in Round 1 (where the horizon was foggiest), the case for Pure Time Preference being a deep psychological fact is stronger, even if the game structure imperfectly models infinity.

  **Final Note to Instructor:**
  If Universe A saves *everything*, do not panic. This is a valid result. It means when you strip away risk and temptation, your students are **utilitarian savers**. The lesson then shifts: *"If you are willing to save in the game, why do we discount in policy? Is it because policy introduces the uncertainty we removed in Universe A?"* That is an equally successful seminar.
