answer: |-
  Dear Friend,

  It is a pleasure to hear from you, and I share your unease with the dogmatic presentation of sunk costs that often permeates our circles. You are quite right that the standard vignettes rely on a sterile causal structure that rarely exists in the wild, where past investment often purchases information, signals credibility, or unlocks contingent value. Designing a game that exposes this nuance without lecturing is a wonderful challenge for your meetup. Below is a complete design for a ninety-minute session that should allow your group to feel the structural differences in their bones before they have the vocabulary to name them.

  You will begin the session with a two-minute warm-up to establish the orthodoxy on the record. Hand out small slips of paper and ask everyone to write down their decision and a confidence rating from zero to one hundred percent for a classic vignette. You might use the concert ticket scenario where someone buys a non-refundable ticket for fifty dollars, feels ill on the day, and must decide whether to go anyway. Collect these slips immediately and set them aside without comment. This creates a baseline of intuition that you will return to during the debrief.

  For the main game, you will divide the room into four teams of four or five people each. If you have twenty people, this works perfectly, but I will address the eight-person variant later. The surface story for all teams is identical. They are venture capital firms deciding whether to continue funding a startup project over a series of rounds. Each team receives an identical starting endowment of thirty tokens, which represent capital. You will also need a deck of signal cards, a set of rule envelopes, and a scoreboard. The game lasts for four rounds. In each round, teams privately decide whether to Invest ten tokens or Quit. If they Invest, they proceed to the next round. If they Quit, the game ends for them, and they calculate their final score based on their specific rules. The goal is to maximize final score, which determines who wins a small prize, such as a book or a nice pen, and who gets to direct a modest charitable donation from the meetup funds.

  The critical design feature is that each team is operating under a different hidden rule set, contained in a sealed envelope they open only after the first round of investment decisions are locked in. You will have three arms distributed among the four teams, meaning one arm will be duplicated. Arm One is the Informational arm. In this version, every time a team Invests, they draw a Signal Card from a deck. The card is either Green or Red. A Green card indicates the project is likely to succeed, while a Red card indicates it is likely to fail. The final payout is high if they complete the project and it is actually good, but negative if they complete a bad project. Here, spending tokens buys information. A team that spends twenty tokens and draws two Red cards is rational to Quit, while a team that spends twenty tokens and draws two Green cards is rational to Continue. This creates the crucial moment you requested where two teams spend identical amounts but make opposite choices, and both are right based on their private signals. The inference is felt because holding a stack of Red cards feels like bad news without needing to calculate likelihood ratios.

  Arm Two is the Reputational arm. Here, the project itself has a low or negative expected monetary value if completed. However, completing the project awards the team a Credential Token. At the end of the game, any team holding a Credential Token receives a substantial bonus score, regardless of the project's profit. This simulates a market where finishing a losing project signals reliability to future investors. A team might lose tokens on the project itself but win the game overall because the Credential bonus outweighs the project loss. Quitting early saves tokens but forfeits the Credential, resulting in a lower final score. This teaches that past investment can be rational if it purchases a reputation asset that pays off in a future context not immediately visible in the project's ledger.

  Arm Three is the Contingent arm. In this structure, value accumulates but is locked. Investing in Round One unlocks ten points of value. Investing in Round Two unlocks twenty points. Investing in Round Three unlocks forty points. However, the rule states that value is only collected if the team completes all three rounds. If they Quit at any point, they forfeit all accumulated value and lose all invested tokens. This means the tokens spent in Round One are not sunk; they are contingent on reaching Round Three. Abandoning the project makes the past spending a total loss, whereas continuing converts past spending into realized value. This forces teams to treat past costs as relevant to the future decision because the future decision determines the fate of the past costs.

  You will run the game over forty-five minutes. Spend the first ten minutes explaining the surface rules and distributing the sealed envelopes. Emphasize that while the story is the same, internal market conditions may vary, but they should not discuss their specific rule sheets with other teams. Allow fifteen minutes for the rounds themselves. You will act as the bank, collecting investment tokens and distributing signal cards or recording completion status. Keep the pace brisk. Announce the start of each round clearly. After the fourth round or when all teams have Quit, move to the scoring phase for ten minutes. Teams calculate their scores based on their hidden rules. The final twenty minutes of this block are for initial reactions before the full debrief.

  The debrief is where the learning crystallizes and should take the remaining thirty minutes of your ninety-minute session. Start by asking teams to report their decisions round by round without revealing their rules. You will likely hear confusion when Team A says they Quit after two rounds and Team B says they Continued after two rounds. Ask them why. Then, reveal the rule sets. Map Team One's experience to the Informational arm, explaining that their spending bought evidence. Map Team Two to the Reputational arm, explaining that their spending bought a signal to the outside world. Map Team Three to the Contingent arm, explaining that their spending was an installment payment on a locked vault. Explicitly contrast these with the warm-up vignette where the money was truly inert. Ask them to identify which arm matches the real world most often. The conclusion they should reach is that ignoring sunk costs is only correct when the cost is truly inert, which is a special case rather than the general rule.

  You should anticipate several predictable failures during the first run. One team might reverse-engineer the arm structure early, perhaps by noticing the Signal Cards are not being distributed to everyone. If this happens, ask them to hold the insight until the debrief so as not to spoil the experiment for others, framing it as a constraint of the simulation. Another risk is that everyone abandons immediately in the Contingent arm because the risk looks too high. To prevent this, ensure the starting endowment is high enough that losing one round does not bankrupt them, and make the final payout for completion sufficiently tempting. You might also face arguments during the debrief that the Informational arm is cheating because real life does not give you clear Green or Red cards. Handle this by conceding the point but asking whether spending money on market research or prototypes serves a similar function of reducing uncertainty. The key is to validate their skepticism while maintaining the structural lesson.

  If only eight people show up, you will have two teams of four. In this case, you should run two sequential rounds of the game rather than simultaneous arms. Run the first half with both teams in the Informational arm to establish the baseline of rational escalation. Then reset and run the second half with both teams in the Contingent arm. This allows for a direct before-and-after comparison within the same group, though it loses the simultaneity of the four-team design. You will need to adjust the timeline to allow for a reset period between the two halves.

  For a numerate group, you can introduce a harder variant by adding noise to the signals in the Informational arm. Instead of deterministic Green or Red cards, use a deck where Green cards appear seventy percent of the time in good projects and thirty percent of the time in bad projects. This requires teams to intuitively update probabilities rather than following a simple stop-loss rule. You can also add a variable cost structure where later rounds cost more than early rounds, forcing them to weigh the marginal cost against the marginal information gain. This increases the cognitive load and makes the distinction between rational updating and stubbornness sharper.

  I must end with a frank note on what this game cannot reproduce. The simulation handles the structural incentives well, but it cannot simulate the psychological weight of self-justification and identity. In the game, quitting a project is a neutral mechanical action. In real life, quitting feels like admitting failure, and continuing feels like proving resilience. Your participants will not feel the ego defense mechanisms that drive real-world escalation of commitment because their tokens are not tied to their self-worth. You will have to supply this context by hand during the debrief. Ask them to imagine the tokens were their own savings and the project was their idea. Furthermore, in real life, nobody hands you a Green or Red card to tell you if your spending bought information. The value of information is itself uncertain. You will need to point out that the hardest part of real-world rationality is not knowing which arm of the game you are playing, whereas the game tells them the structure retrospectively. This uncertainty about the structure itself is the final layer of complexity that you must articulate verbally, as the game mechanics alone cannot simulate the ambiguity of the real world.

  I hope this design serves your group well. It is a robust way to move beyond the catechism and into the messy reality of decision-making. Please let me know how the session goes and whether the teams manage to spot the structural differences before you reveal them.

  Warmly,

  Your Colleague
