answer: |-
  Dear Colleague

  I read your letter with a heavy heart, not because I am surprised by the corrosion you describe, but because I recognise the particular weariness that comes from policing the boundary between truth and falsehood when the institution you serve benefits from blurring it. You ask whether there is a moral difference between lying and misleading, and whether your diligent-enquirer test can save you. You also ask about the collective soul of your organisation and your own place within it. These are not abstract questions for you; they are the daily texture of your work. I will answer them as plainly as I can, without resorting to the sort of hedging that has brought you to this pass.

  Let us begin with the distinction itself. There is a traditional view that lying and misleading are different in kind, not merely in degree. The argument rests on the nature of assertion. When you lie, you assert something you believe to be false. You break the fundamental convention of communication, which is that speakers offer truths. When you mislead, you assert something true but arrange the context so the hearer draws a false conclusion. Here, the speaker honours the letter of the convention but violates its spirit. The proponent of this view argues that this distinction is morally load-bearing because it preserves a space for privacy and diplomacy without destroying trust. If we were obliged to volunteer every relevant fact in every exchange, communication would become impossible. We rely on the hearer to do some interpretive work. If I say I have no finding against me by a regulator, and you infer I received no warnings, I have told the truth. The error is yours. This view suggests that a standing practice of trust can survive routine misleading because literal truth remains the common currency. We know people withhold information; we do not know if we can believe their words. As long as the words hold, the system holds.

  However, the case against this distinction is severe and, in your context, perhaps decisive. The moral core of dishonesty is not the syntax of the sentence but the intention to induce a false belief. If I intend for you to believe X, and I know X is false, and I say Y specifically because I know it will make you think X, I have harmed your autonomy just as much as if I had said X. The epistemic harm is identical. You have been manipulated into a state of error. The distinction, critics argue, merely hands the conscientious official a licence for which the ordinary liar has to pay in shame. It rewards linguistic sophistication. The liar who says I did not do it when he did is condemned; the liar who says I am not aware of any evidence I did do it, knowing full well he did, is praised for precision. In a public body, where power asymmetries are vast, this distinction becomes a tool of domination rather than a protection of privacy. The hearer often lacks the capacity to verify the literal truth, let alone decode the implication.

  This brings us to your diligent-enquirer test. You propose that an answer misleads only if a well-informed, suspicious enquirer asking every natural follow-up would still be left holding a false belief. It is a comforting metric because it shifts the burden of clarity onto the resilience of the questioner. If the truth is available upon request, you have not deceived. I must tell you plainly that this test cannot be made to work in your environment. It assumes a level playing field that does not exist. You mention the reporter who drew an inference you knew to be wrong. When he rang again, you said nothing. Under your test, you might argue that he could have asked again, or asked differently. But consider the parent asking about her child. She is not a journalist. She does not know the natural follow-up questions. She does not know that received and logged is compatible with never read by human eyes. Furthermore, there are institutional barriers to follow-ups. A member of the public cannot summon a permanent secretary for cross-examination. A journalist operates on deadlines. If you answer a question with a true but misleading statement, the news cycle moves on before the correction can be issued. The truth might be available in principle, but it is socially or institutionally out of reach. Your test fails because it ignores the cost of extracting the truth. If the cost is too high, the availability is illusory. What ought to be put in its place is a duty of reasonable completeness. You must ask not whether the truth could be extracted, but whether the answer given creates a false impression in the mind of a reasonable person given their likely knowledge and capacity.

  You ask whether an institution can lie when no individual within it asserts anything they believe to be false. The answer is yes. An institution is not merely the sum of its current speakers; it is a continuing agent with a memory and a culture. When a draft circulates among four pairs of hands, and each strikes a clause they would rather not defend, the resulting sentence is a true sentence that conveys nothing, composed by nobody in particular. This is not an accident; it is a systemic output. The institution lies because the collective intent is to deceive, even if the individual intent is merely to avoid trouble. What becomes of your culpability? You cannot hide behind the diffusion of responsibility. If you draft the sentence, you are the gatekeeper of the institution's voice. You share the culpability for the effect, not just the syntax. To draft a sentence you know will be read as a denial, when it is only a technical truth, is to participate in the lie. You are not a passive conduit; you are an active shaper of meaning. In a bureaucracy, the person who writes the words owns the deceit if they know how the words will land.

  This connects directly to the old casuistry of mental reservation, where the speaker adds an unstated qualification recoverable from the context. You recognise this in your drafting habits. I must be blunt: this does not survive scrutiny in public communication. Mental reservation relies on a shared understanding that certain words carry hidden meanings. In a relationship of deep trust, perhaps this works. In public scrutiny, it is merely a respectable-sounding description of what deceivers have always done. If the qualification is not explicit, it is not part of the communication. If you say we are investigating the matter, implying an active inquiry, when you mean we are reviewing whether to investigate, you have reserved the meaning mentally but broadcast the falsehood publicly. The hearer cannot access your mental reservation. They only have the words. To rely on this is to treat the public as insiders when they are outsiders. It is a failure of duty.

  Does the verdict change with the setting? It should, but not in the way you might hope. If the hearer has a right to the information, your duty to be clear is highest. If you are bound by confidentiality, you should say you cannot answer, not give an answer that implies there is nothing to tell. Silence is honest; misleading truth is not. As for the journalist versus the member of the public, some argue you can be more economical with the truth against a journalist who knows the game. I disagree. The journalist may know the game, but the public reads the journalist. If you mislead the press, you mislead the public. Moreover, relying on the sophistication of the hearer excuses predation on the naive. The parent who does not know the game deserves more protection, not less. Your duty is to the public trust, not to the cleverness of your interlocutor.

  So I come to the verdict you require. I will not offer you a shrug. The distinction between lying and misleading is real in terms of linguistic mechanism, but it is morally insufficient for public office. It tracks the wrong-making feature but not its weight. In private life, we may tolerate misleading to preserve privacy. In public office, where you hold power over people's lives and liberties, the duty is to not induce false belief, regardless of the mechanism used to achieve it. The distinction matters between strangers but not within relationships of trust, and the public body is in a relationship of trust with the public. Therefore, you must treat the intention to induce a false belief as the primary wrong. If you know your true statement will cause a false belief, and you do not correct it, you are lying.

  Your diligent-enquirer test must be discarded. It is too cynical. It assumes the public is adversarial when they are often vulnerable. Replace it with a test of reasonable impression. Would a reasonable person, with the knowledge available to them, come away with a false belief? If yes, you must clarify or remain silent. Regarding the institutional lie, you must accept that you are culpable for the drafts you sign. The fact that others edited them does not absolve you if the final product is deceptive. You are the last line of defence. As for mental reservation, abandon it. If a qualification is necessary to make the statement true in effect, it must be in the text.

  I know this makes your job harder. It removes the shelter of technicality. But you wrote to me because you doubted whether you still knew what dishonesty was. The answer is that dishonesty is not just saying the false thing; it is causing the false thing to be believed when you have the power to prevent it. You are not merely a processor of correspondence; you are a guardian of understanding. If you lose that, you lose the only thing that makes the scrutiny bearable. Do not draft guidance that permits misleading by design. Draft guidance that requires clarity of effect. It will be uncomfortable. It will invite challenge. But it will allow you to sleep.

  Yours sincerely

  A Friend
