          *   *Resolution:* The principle must distinguish between *Fallible Empirical Evidence* (Parking, Sources) and *Infallible/Necessary Derivation* (Math). Stakes encroach on the former because the *evidence itself* admits doubt. Stakes do not encroach on the latter because the *evidence* (logic) eliminates doubt, provided the process was followed.
          *   *Actually, a better nuance:* With math, the "check" is internal and immediate. With parking, the "check" requires external verification (photo). The *cost of verification* relative to the *risk of error* matters.
          *   *Let's refine:* It's about the **Modal Strength** of the evidence. Math is necessary; Memory is contingent. Stakes amplify the risk of contingency.

  6.  **Refining the Output Structure:**
      *   **Introduction:** Acknowledge the depth of the question. It's classic epistemology (Williamson, Fantl & McGrath) applied to journalism.
      *   **The Principle:** "Pragmatic Encroachment on Relevant Alternatives."
      *   **The Audit:** Go through the user's list.
      *   **The New Cases:** Apply the principle.
      *   **The Showdown (Math vs. Parking):** Deep dive.
      *   **Conclusion:** Validate the user's gut.

  7.  **Self-Correction/Nuance Check during drafting:**
      *   *Correction:* Be careful not to say Math is *actually* infallible for humans. Humans make math errors. The user admits "I calculate... on a scrap of paper."
      *   *Why is Math different?* Because the *nature of the error* is different. A math error is a process failure that can be retraced step-by-step with near certainty. A memory error is a system failure that cannot be retraced.
      *   *Also:* The user says "I wouldn't say that about a lot of things riding on one number." This implies they *do* feel the stakes, but the *method* overrides it.
      *   *Key Insight:* The "Arithmetic" case is actually about **Verification Cost**. To verify math, I spend 30 seconds. To verify parking, I have to walk back to the lot (or rely on fallible memory). To verify the Mayor, I need a second source (time/effort).
      *   *Wait, looking closer at the prompt:* "I calculate 17 × 23 = 391... I still say I know it." vs "Parking... I've been wrong about this before... So: not knowledge."
      *   *The distinction:* The user *knows* their memory error rate (1 in 10). They *do not* suspect their math error rate is that high. The *meta-knowledge* of reliability differs.
      *   *Principle Adjustment:* Knowledge requires a reliability threshold *relative to the stakes*. Math has high inherent reliability (logic). Memory has known low reliability (empirical data).

  8.  **Finalizing the Argument:**
      *   The Principle: **Stakes-Sensitive Reliabilism.** (A blend of Pragmatic Encroachment and Process Reliabilism).
      *   You know $P$ if your belief is produced by a reliable enough process *for the stakes at hand*.
      *   Math process = Extremely reliable (logic).
      *   Memory process = Moderately reliable (known 10% fail rate).
