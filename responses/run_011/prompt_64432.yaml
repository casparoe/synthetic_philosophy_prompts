      *   **The Core Problem:** The user notices their attribution of "knowing" shifts based on *stakes* (pragmatic encroachment) and *evidence type* (source reliability, calculation vs. memory), even when the underlying evidence seems constant. They want to know if there's a coherent principle underlying their intuitions or if they are just inconsistent.
      *   **The Task:**
          1.  Identify the best philosophical principle(s) that explain their verdicts.
