      *   *Candidate 4: Relevant Alternatives / Safety.* (Knowledge requires ruling out *relevant* error possibilities).
          *   *Pros:* Strong contender. In low stakes, few alternatives are relevant. In high stakes, more alternatives become relevant (e.g., "maybe the source is lying," "maybe I misremembered").
