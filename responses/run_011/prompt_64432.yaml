          3.  Apply the principle to three *new* scenarios (medical test, unreplicated monograph, childhood false belief).
          4.  Specifically address the "Arithmetic vs. Parking Memory" paradox (why stakes affect one but not the other).
      *   **Tone:** Professional, analytical, respectful of the newsroom context, philosophically rigorous but accessible.

