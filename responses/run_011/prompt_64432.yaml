  *Better angle:* **Necessity vs. Contingency.** 17x23 *must* be 391. Where I parked *could* have been G4. The "possible world" where I am wrong about math is much "further away" (requires a fundamental breakdown of logic or severe cognitive lapse) than the world where I am wrong about parking (requires a common lapse). Stakes make "nearby" error possibilities relevant. Distant ones remain irrelevant.

  Let's go with **Relevant Alternatives + Pragmatic Encroachment**. It's the standard philosophical tool for this exact problem.

  10. **Final Polish:** Ensure the tone is conversational but sharp. No jargon without explanation. Make sure the "verdict" on which intuitions to keep/drop is clear. (e.g., The Eyewitness intuition must be dropped).

