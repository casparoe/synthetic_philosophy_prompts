          *   *Arithmetic:* Abstract, necessary truth. If the calculation is performed correctly, the error rate is 0%. The only risk is *performance error* (slipping up).
          *   *Distinction:* In the user's example, they *calculated it on paper*. They can re-check instantly. The "alternative" (that 17x23 != 391) is metaphysically impossible. The "alternative" (that I parked on G3) is empirically possible.
