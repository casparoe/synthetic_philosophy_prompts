          2.  *Unreplicated Monograph:* High stakes (paper reputation). Principle says: Not knowledge. "Replication failure" is a highly relevant alternative.
          3.  *Childhood False Belief:* Retrospective. You *thought* you knew. Principle says: You didn't know then, because the belief was false (factivity condition). But practically, it functioned as knowledge for low-stakes actions at the time.

