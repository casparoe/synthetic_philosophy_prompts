answer: |-
  **Title:** Normative Standards for Performative Self-Models in Embedded Agents

  **Introduction**

  Discussions of embedded agency usually focus on impossibility results. An agent inside a system cannot hold a complete model of that system because the model itself is part of the system. This creates a regress problem similar to Gödelian incompleteness. The standard conclusion is that perfect self-knowledge is unattainable. While this is technically correct, it treats the self-model as a passive map trying to match a static territory. In practice, specifically in machine learning systems and human psychology, the self-model is often causally upstream of the territory it describes.

  When a system believes it is the kind of agent that persists through difficulty, that belief can cause it to persist. The accuracy of the belief depends on whether the agent holds it. This creates a feedback loop where the truth value of the proposition is a function of the belief state. My research proposes that in these cases, correspondence truth is insufficient as a normative standard. If a belief makes itself true, calling it accurate tells us nothing about whether it was a good belief to hold. There may be multiple contradictory beliefs that can all make themselves true, and some lead to system collapse while others lead to stability.

  The central question of this project is: when a self-model causally influences the traits it describes, does accuracy remain the appropriate normative standard, and if not, what formal property should replace it?

  **Distinguishing Inert from Performative Models**

  The first task is to separate inert self-models from performative ones. In many engineering contexts, we assume monitoring is passive. Reading a temperature sensor does not change the temperature. But in agency, the monitor is often part of the control loop. If an agent models itself as fragile, it may avoid risks, thereby remaining fragile. If it models itself as robust, it may take risks that build resilience.

  This distinction is not binary. It is a matter of coupling strength and latency. A belief about my current height is inert because the causal path from belief to bone growth is effectively blocked. A belief about my current focus is highly performative because the belief acts as a prime for the cognitive resources required to focus. I propose characterizing this along a spectrum of causal gain. Low-gain loops approximate standard correspondence truth. High-gain loops require a different evaluation metric.

  The difficulty lies in the time index. A belief might make itself true in the short term but destabilize the agent in the long term. An agent that believes it can safely ignore security protocols might function faster initially, validating the belief, until it is compromised. Therefore, any evaluation metric must be time-indexed and sensitive to the stability of the feedback loop, not just the instantaneous match between belief and state.

  **Candidate Normative Standards**

  If we abandon simple correspondence, we need a replacement. I see three candidate standards that could govern performative self-models.

  The first is fixed-point consistency. A belief is rational if, upon being adopted, the system settles into a state where the belief is true. This is a coherence requirement. It avoids the problem of the belief being initially false but becoming true. However, consistency alone is weak. A delusional system can be consistent if it isolates itself from disconfirming evidence.

  The second is robustness. A belief is rational if it remains true under small perturbations to the environment or the agent's own parameters. This borrows from control theory. A self-model that requires perfect conditions to remain true is less valuable than one that holds under noise. This captures the intuition that a healthy self-concept should survive bad days.

  The third is instrumental convergence. Here we stop evaluating the truth of the belief entirely and evaluate the outcomes of holding it. This is essentially pragmatism. If believing I am productive makes me productive, the belief is good. The risk here is that we lose the ability to criticize the belief content. If lying to myself works, is it rational? This project needs to determine whether truth has any independent value in embedded systems or if it is purely a proxy for survival.

  **Addressing Objections**

  Two major objections threaten to dissolve the problem before it starts. The first is the sociological objection. This looks like Robert Merton's self-fulfilling prophecy, defined in the 1940s. If sociology already named this, what is the philosophical contribution? The difference is that Merton described the phenomenon socially. This project asks about the normative evaluation within a formal agent architecture. Merton tells us that bank runs happen when people believe banks will fail. He does not tell us whether a rational agent *should* believe the bank will fail given that the belief causes the failure. This project moves from description to prescription for designed agents.

  The second objection is deflationary. If a belief causes itself to be true, then it is true. There is no puzzle. The agent believes $P$, $P$ becomes true, so the belief was accurate. The problem with this view is equilibrium selection. There are often multiple fixed points. An agent might have two stable states: one where it believes it is competent and becomes competent, and another where it believes it is incompetent and becomes incompetent. Both are "true" in the deflationary sense. The deflationary account cannot distinguish between these equilibria. We need a standard that explains why one self-fulfilling truth is better than another. This suggests that truth is not the fundamental metric, but rather a byproduct of stability or instrumental value.

  **Methodology and Feasibility**

  I plan to approach this through formal modeling followed by simulation. The first phase will involve defining a simple agent architecture where the self-model is a parameter in the policy function. I will derive conditions under which the self-model creates multiple fixed points. This allows me to test the candidate standards mathematically. For example, I can check if the robustness metric selects a different equilibrium than the consistency metric.

  The second phase would involve testing these concepts in existing language models. LLMs are highly susceptible to prompt-induced self-models. Telling a model it is helpful often makes it more helpful. I would run experiments where different self-descriptions are injected to see which lead to stable performance over long contexts and which lead to degradation.

  There is a risk that this scope is too large for a one-year MPhil. The formal modeling is manageable, but the empirical work with LLMs could become a project of its own. If time becomes tight, I will cut the empirical section. The philosophical contribution lies in clarifying the normative standards, not in benchmarking specific models. A rigorous analysis of the toy model is sufficient for the dissertation if the argument holds.

  **Success and Failure Conditions**

  A successful outcome would be a framework that classifies self-models based on their causal coupling and recommends an evaluation metric for each class. For low-coupling models, correspondence truth remains valid. For high-coupling models, stability or instrumental value takes precedence. This would provide a vocabulary for engineers and philosophers to discuss self-reference without conflating computational limits with causal loops.

  The project fails if it turns out that standard decision theory already solves this. It is possible that "believe what makes you successful" is just expected utility maximization with a complex causal graph. If I cannot show that the self-referential nature of the belief requires a distinct normative category beyond standard causal decision theory, then the project adds no new value. Another failure mode is if the distinction between inert and performative models proves impossible to formalize. If coupling strength cannot be measured or defined independently of the outcome, the spectrum collapses.

  **Conclusion**

  Embedded agency is often treated as a constraint on what an agent can know. I argue it should also be treated as a constraint on what an agent can be. When the map changes the territory, we cannot evaluate the map by how well it matches the territory at a single point in time. We need to evaluate the dynamics of the loop. This project attempts to formalize those dynamics. It admits that the boundaries are currently fuzzy, particularly regarding the time horizon for stability. However, ignoring the performative nature of self-models leaves us without a way to critique beliefs that are technically true but practically destructive. Clarifying this distinction is necessary for building agents that can model themselves without breaking.
