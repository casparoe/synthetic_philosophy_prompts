      *   **The Conflict:** Historian (Option 2 is forgery/colonialism of voice) vs. Novelist (Option 1 surrenders to the archive's bias).
      *   **The Questions:** Is there a principle to settle this? Does the mediated deposition count? Can prose make the difference between imagination and assertion visible? Does the "Thursday pattern" (evidence of organized resistance) change things? Is there a fourth option?

  2.  **Deconstruct the Ethical/Aesthetic Tension:**
      *   *The Historian's Point:* Valid. Silencing is part of the history. Inventing voice risks erasing the structural violence that caused the silence. It's "ventriloquism."
      *   *The Novelist's Point:* Valid. Fiction's job is often to humanize the silenced. Accepting the archive's terms replicates the power dynamic. Silence can be read as passivity, which is historically inaccurate (they *did* strike).
      *   *The Core Issue:* It's not just "taste dressed as ethics." It's about *epistemological honesty* vs. *narrative empathy*.

  3.  **Evaluate the Three Options:**
      *   *Option 1 (Superintendent's View):* Safe historically, but artistically stifling. Risks making the novel a mere transcription. It accepts the "objectification" as the only truth.
      *   *Option 2 (Free Indirect/Invented Interiority):* Emotionally resonant, but ethically fraught. Risks anachronism or projecting modern sensibilities. The "forgery" charge is serious.
      *   *Option 3 (Hybrid/Reconstructive):* Promising. It acknowledges the gap. It makes the *process* of recovery part of the story.

  4.  **Address the Specific Questions:**
      *   *Mediated Deposition:* It's still mediated. It's not "truth" in a pure sense, but it's a constraint. It doesn't necessarily outrank honest invention *if* the invention is framed as invention. But it should anchor the invention.
      *   *Imagining vs. Asserting:* Yes, there is a difference. Prose *can* make this visible (modal verbs, speculative language, juxtaposition of record and imagination).
      *   *The Thursday Pattern:* This is crucial. It's *structural evidence of agency*. It proves they were organizing, even if the text doesn't say so. This justifies imagining resistance, even if specific thoughts are invented.

