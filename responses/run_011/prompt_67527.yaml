      *   *Concept:* "Speculative Archivism" or "Counterfactual Witnessing."
      *   *Execution:* Interleave the ledger entries with the imagined moments, but visually or syntactically distinguish them. Or, write from the perspective of the *researcher/novelist* trying to find them, alongside the historical narrative.
      *   *Better Idea:* Use the "Thursday Pattern" as the structural engine. The chapters *are* the Thursdays. The prose moves from the hard data (the fine) to the speculative space (the act that caused it), but marks the boundary.
