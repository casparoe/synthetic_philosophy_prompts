answer: |-
  This is not a matter of taste dressed as ethics. It is a matter of epistemology dressed as narrative. You are asking how to tell the truth about people whom the historical record was designed to render voiceless, without becoming another agent of that design.

  Both your readers are right, and both are wrong. The historian is right that inventing interiority risks a kind of colonial ventriloquism—supplying the "soul" that the archive denied, which can be a form of erasure in itself. The novelist is right that to refuse imagination is to surrender to the power dynamics of the source material, granting the superintendent the authority of the only truth-teller.

  If you choose Option 1, you replicate the violence of the archive. If you choose Option 2, you risk smoothing over the silence with a plausible lie. Option 3 is the most responsible of your three, but I believe there is a Fourth Option that resolves the tension by changing the subject of the chapters.

  Here is how I would think through the specific questions you raised, followed by the proposal for that fourth path.

  ### On the Mediated Deposition
  Does the deposition outrank invention? No. It is not a window into her; it is a mirror of the magistrate. It is evidence of *interrogation*, not *testimony*. The fact that she was "performing for a man holding a pen" is the historical truth of that document. To treat it as more authentic than your own honest inference is to grant the magistrate an authority he did not earn. However, it should serve as a *constraint*. It gives you her syntax, her idiom, the boundaries of her world. It is the only brick you have; you cannot build a house from it, but you must not build a house that contradicts its mortar.

  ### On Imagining vs. Asserting
  There is a profound difference between imagining what a woman might have thought and asserting that she *did* think it. The first is an act of empathy; the second is an act of falsification.
  Can prose make this visible? Yes. It requires what we might call **speculative modality**.
  *   **Assertion:** *Mary felt the anger rise in her chest.*
  *   **Speculation:** *The ledger says Mary was fined. One imagines the anger rising in her chest.*
  *   **Integration:** *The ledger says Mary was fined. If the ink had been wetter, it might have caught the tremor in the hand that wrote her name.*

  You do not need to footnote this. You can build it into the narrative voice. The narrator can be a character in this drama: the researcher, the seeker, the one standing at the glass of the archive. When the narrator moves from record to imagination, the prose should shift texture. The record is cold, nominal, passive. The imagination should be warm, verbal, active—but framed by the acknowledgment that it is happening *now*, in the reading, not *then*, in the curing station.

  ### On the Thursday Pattern
  This changes everything. The Thursday Pattern is not just a clue; it is a **warrant**.
  The archive denies the women agency, but the *data* proves they had it. A random distribution of fines suggests incompetence or bad luck. A clustered, temporal pattern suggests coordination. The silence of the documents regarding *what* they were doing is a lie, but the numbers tell the truth: they were organizing.
  Therefore, you are not inventing agency when you depict them organizing. You are deducing it from the physical evidence. You are filling a narrative gap, not an evidentiary one. The documents refuse to name the action, but they trace its shape. Your job is to trace the shape without naming the names the archive stole.

  ### The Fourth Option: The Choral Materialism
  I would not write from the superintendent's view (Option 1), nor from a single packer's invented interiority (Option 2), nor even from a single packer's reconstructed view (Option 3).

  I would write from the **Collective Trace**.

  You noted the fines move among a "shifting but bounded group of names." Do not pick one of them. Pick the **Group**.
  Write the chapters using a plural consciousness, or a shifting focalization that moves like the fines themselves. Let the protagonist of these three chapters be the **Thursday**, not the woman.

  **Why this works:**
  1.  **It honors the History:** The strike was a collective action. Individualizing it (Option 2 & 3) risks imposing a modern, bourgeois individualism on a communal struggle. The "Thursday Pattern" proves the resistance was structural and shared.
  2.  **It avoids Forgery:** You are not claiming to know what *Mary* thought. You are claiming to know what *the hands* did. You are describing the labor, the cold, the fish, the exchange of glances, the physical reality of the coordination.
  3.  **It solves the Silence:** You do not need to put words in their mouths to show they were combining. You show the *mechanics* of the combination. A nod across the gutting table. A barrel slowed down. A fine accepted as a badge.

  **How to execute it:**
  Write the chapters as a **Palimpsest**.
  On the "surface" of the prose, place the language of the ledger: the fines, the dates, the measurements. Beneath that, let the sensory reality of the station bleed through.
  *   *Example:* "Thursday. Four names fined for underfilled barrels. The barrels were not underfilled. The hands were slow. The eyes were busy. The superintendent saw idle women; the ledger records spoiled fish. The truth is in the gap between the weight of the herring and the weight of the pen."

  This makes the *conflict* between the record and the reality the engine of the narrative. You are not hiding the archive; you are putting it on trial.

  ### The Principle
  The principle by which to settle this is **Fidelity to the Gap**.
  Do not try to close the gap between the archive and the women with the mortar of invention. Let the gap remain visible. Let the reader feel the strain of trying to hear them.
  *   If you write Option 1, the gap is ignored.
  *   If you write Option 2, the gap is filled (forgery).
  *   If you write Option 3, the gap is acknowledged.
  *   If you write Option 4 (The Choral Trace), the gap becomes the **subject**.

  ### Recommendation
  Write the **Fourth Option**.
  Use the Thursday Pattern as your skeleton. Let the three chapters correspond to three Thursdays in that eleven-week cluster.
  *   **Chapter A:** The first Thursday. The inception. The ledger notes the first fine. The prose describes the first glance exchanged, the first slowing of the line.
  *   **Chapter B:** The middle Thursday. The escalation. The fines spread. The prose describes the coordination, the risk, the physical toll.
  *   **Chapter C:** The last Thursday before the lockout. The breaking point. The ledger is full of names. The prose describes the decision to stop.

  In this way, you give them the agency the archive denies (by showing the organization), but you do not claim the interiority the archive destroyed (by keeping the focus on the collective action and the material trace). You let the ledger speak its lies, and you let the narrative speak the truth of the *action*, without claiming the truth of the *mind*.

  This is not reassurance. It is a harder path. It requires you to write a novel where the mystery is not "what happened," but "how do we know what happened?" It makes the reader a co-investigator. But it is the only way to ensure that when the women finally speak in your book, they are not merely echoing the superintendent, nor are they merely echoing you. They are echoing the silence they left behind, which is the only authentic voice they have.
