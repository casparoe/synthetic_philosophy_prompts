prompt: |-
  I'm a second-year political theory PhD student and I'm giving a seminar presentation next week on how the Spanish justified conquest, and honestly the standard retelling of Valladolid (1550–51) is doing way less work for me than I expected. Everyone just says "Sepulveda weaponized Aristotle's natural slavery, Las Casas said it didn't apply," and that's the whole story. I want to pressure-test that.

  First, here's a decomposition I've been working with. I don't think its standard, so push back on it freely. Aristotle's doctrine in Politics I seems to me to be at least four separable claims: (i) a capacity claim — some humans participate in reason enough to follow it in someone else but not to exercise it themselves; (ii) a detectability claim — that this deficiency can be read off observable features, even though Aristotle himself concedes in Book I that "the beauty of the body is seen, whereas the beauty of the soul is not seen"; (iii) a benefit claim — where (i) and (ii) actually hold, the rule is for the good of the ruled, so the relation isn't exploitative and doesn't generate the enmity that enslaving the wrong people does; and (iv) a gate — slavery by law or convention, i.e. whatever falls to the victor in war, is a different thing entirely, and Aristotle is at minimum uneasy about it. My question is which of these the Junta was really arguing about, because the retelling collapses all four into "was Aristotle right."

  Facts I'm relying on — correct me if any are shaky, but please don't hinge the analysis on a contested detail: Charles V halted further conquest pending the panel's judgment; the panel was theologians and jurists at the Colegio de San Gregorio; Sepúlveda argued from his Democrates Alter on four grounds — that the Indians' natural condition made them unfit to rule themselves and so Spaniards ought to act as their masters, that cannibalism and human sacrifice were crimes against nature the civilized were obliged to suppress, and that conversion licensed intervention; Las Casas had already written his Apologia against that dialogue specifically, had decades in the Indies, and argued that Aristotle's barbarian and natural-slave categories simply don't pick these people out; Sepúlveda had never been to the Americas. Both sides claimed victory and no clear record of the outcome survives. Backdrop: Sublimis Deus (1537) and the New Laws (1542).

  What I want:

  1. Sort Sepúlveda's four grounds by how much natural-slavery work each one actually does. My hunch is that only the first does any, and the other three are natural-law arguments about crimes against nature that need no Aristotle at all — in which case what is the doctrine doing there, load-bearing or decoration?

  2. The evidential structure. Both sides are working from the same authorities, and the Junta's information about Amerindian political life is reaching it through people with an interest in the answer, plus a language barrier, plus thirty years of field contact on one side and none on the other. What does that do to (ii) specifically — is detectability the clause that fails here, or the clause that makes the whole question unresolvable in principle, in which case the Junta was never going to conclude anything regardless of who argued better?

  3. Was Las Casas's attack internal or external? I.e. Aristotle's criteria honestly applied don't select these people, versus the criteria can't be applied across this kind of epistemic gap at all. Related: human sacrifice is the datum both sides fight over, and it seems to cut in opposite directions depending on whether you're testing the outputs of a practice or the capacity to deliberate about ends — a practice that looks like gross irrationality at the output level can look like evidence of exactly the capacity Aristotle's test is tracking. Does that distinction live anywhere in Aristotle, or did Las Casas (or later readers) have to supply it?

  4. The reverse direction: is Valladolid a refutation of the doctrine, an anomaly, or a use-case Aristotle never anticipated — conquest of peoples outside any known reference class for comparison, inside a universalist religious framework rather than a Greek household? And is the inconclusiveness itself evidence about (ii), or am I over-reading a messy institutional event with no clean verdict?

  5. Tell me where the doctrine is just silent rather than wrong, and where my four-clause cut is a bad one.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Second-year Political Theory PhD student. This means they know the literature, they know the jargon, and they want substantive, high-level theoretical engagement, not a summary of the Valladolid debate. They are skeptical of the "standard retelling."
      *   **Topic:** Spanish justification of conquest, specifically the role of Aristotle's *Politics* Book I in the Valladolid Junta (1550-51).
      *   **User's Framework:** A four-part decomposition of Aristotle's natural slavery doctrine: (i) Capacity, (ii) Detectability, (iii) Benefit, (iv) Gate (conventional vs. natural).
      *   **Goal:** Pressure-test the standard narrative using this framework.
      *   **Specific Questions:**
          1.  Sort Sepúlveda's four grounds by reliance on natural slavery vs. natural law.
          2.  Analyze the evidential structure regarding detectability (ii).
          3.  Determine if Las Casas's attack was internal or external to Aristotle.
          4.  Assess Valladolid's relation to Aristotle (refutation, anomaly, use-case) and the meaning of the inconclusiveness.
          5.  Identify where the doctrine is silent vs. wrong and critique the four-clause decomposition.

  2.  **Deconstruct the User's Framework (The Four Clauses):**
      *   (i) Capacity: Rational deficiency.
      *   (ii) Detectability: Phenotypic/behavioral markers.
      *   (iii) Benefit: Teleological justification (rule for the sake of the ruled).
      *   (iv) Gate: Distinction between natural and conventional slavery (war captives).
      *   *Critique:* This is actually a very strong, analytically precise decomposition. It aligns well with contemporary Aristotelian scholarship (e.g., Garnsey, Schofield). I should validate this while pointing out where the Scholastic context modifies it.

  3.  **Address Question 1: Sepúlveda's Four Grounds:**
      *   *Grounds:* 1. Natural condition (unfit to rule), 2. Crimes against nature (sacrifice/cannibalism), 3. Conversion license, 4. (Implicit in user prompt, usually "weakness/need for protection" or similar, but user lists 3 specific ones + general mastery). Let's stick to the user's list: 1. Natural condition, 2. Crimes against nature, 3. Conversion.
      *   *Analysis:*
          *   Ground 1 is pure Aristotelian natural slavery (Capacity/Benefit).
          *   Ground 2 is Natural Law (Vitoria style), not necessarily Natural Slavery. It's about punishment/police action, not mastery.
          *   Ground 3 is Theological/Canon Law (*Sublimis Deus*), distinct from Aristotle.
      *   *Verdict:* The user's hunch is correct. Aristotle is load-bearing *only* for Ground 1. For 2 and 3, Aristotle is decoration or a secondary support for a primarily Thomistic/Canonical argument. Sepúlveda needs Aristotle to bridge the gap between "they sin" and "we own them."

  4.  **Address Question 2: Evidential Structure & Detectability (ii):**
      *   *Context:* Sepúlveda (textual, armchair) vs. Las Casas (empirical, field).
      *   *Problem:* Aristotle assumes detectability within a *polis* context. Valladolid is cross-cultural.
      *   *Analysis:* Detectability fails because the "signs" (customs, religion) are interpretable differently. Sepúlveda reads sacrifice as irrationality (sign of natural slave). Las Casas reads it as error within rationality (sign of natural freedom).
      *   *Institutional Constraint:* The Junta couldn't resolve this because they lacked a neutral epistemic arbiter. The "inconclusiveness" isn't just bureaucratic; it's structural to applying (ii) across an epistemic chasm.
      *   *Verdict:* Detectability is the breaking point. It makes the question unresolvable *in practice*, which functions as a suspension of the doctrine's applicability.

  5.  **Address Question 3: Las Casas's Attack (Internal vs. External):**
      *   *Internal:* "You misread the Indians; they meet Aristotle's criteria for freedom."
      *   *External:* "Aristotle's criteria don't work here."
      *   *Nuance:* Las Casas is a Thomist. He generally accepts Aristotle's authority but reinterprets the *application*. However, in *De Imperatoria*, he pushes toward an external critique (historical context matters).
      *   *Human Sacrifice:* This is the crux. Sepúlveda: Irrational output = Irrational mind. Las Casas: Rational mind + False premises = Irrational output.
      *   *Aristotle:* Aristotle distinguishes between *akrasia* (weakness) and *vice*, but natural slavery is about *capacity*. Las Casas argues they have capacity but wrong culture. This is an internal critique of the *evidence*, but borders on external regarding the *universality* of the markers.
      *   *Verdict:* Primarily internal (they aren't slaves by *your* definition), but implies an external limit (cultural difference masks capacity).

  6.  **Address Question 4: Valladolid's Relation to Aristotle & Inconclusiveness:**
      *   *Refutation/Anomaly/Use-case:* It's a "stress test." Aristotle didn't anticipate global Christendom.
