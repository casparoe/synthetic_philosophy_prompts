      *(Final thought on the 4-clause decomposition)*: It's actually quite good. I should validate it but suggest the "Telos" addition. The "Gate" (iv) is the most vulnerable part of the user's schema because Sepúlveda actively tries to close that gate (Just War -> Slavery -> Nature). I need to highlight that collision.

