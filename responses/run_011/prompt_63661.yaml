      *(Self-Correction during drafting)*: Wait, did Sepúlveda argue 4 grounds? The user says "four grounds" but lists three in the "Facts" section (Natural condition, Crimes, Conversion). I need to address this slight inconsistency gently. Usually, Sepúlveda's *Democrates Alter* argues: 1. Prudence/Virtue superiority, 2. Idolatry/Sacrifice, 3. Natural Slavery (Aristotle), 4. Protection of Innocents. I will align with the user's "Natural condition" covering the superiority/slavery point.
      *Correction:* I will treat the "four grounds" as the user's categorization but clarify the theoretical underpinnings.

      *Refining the "Detectability" point:* This is the strongest theoretical lever. Aristotle assumes a shared cultural language for reading souls. Valladolid lacks this. This makes (ii) the collapse point.

      *Refining Las Casas:* He isn't just saying "Aristotle is wrong." He's saying "Aristotle is right, but you are wrong about the Indians." But later he moves to "All men are rational." This shift is key.

      *Final Polish:* Ensure the distinction between *dominium* (lordship) and *jurisdictio* (jurisdiction) is hinted at, as that's the juristic layer under the philosophical one.

  9.  **Final Review against constraints:**
      *   Don't hinge on contested details.
      *   Push back on the decomposition if needed.
