answer: |-
  This is a sharp decomposition. You are right to be dissatisfied with the "Sepúlveda said X, Las Casas said Y" pedagogy; it flattens a complex collision of Scholastic jurisprudence, humanist philology, and imperial bureaucracy into a morality play. Your four-clause framework (Capacity, Detectability, Benefit, Gate) is analytically robust and maps well onto contemporary Aristotelian scholarship (e.g., Garnsey, Schofield), though it needs one Scholastic adjustment to fully capture the Valladolid stakes.

  Here is a pressure-test of your framework against the Junta's mechanics.

  ### 1. Sorting Sepúlveda's Grounds: Load-Bearing vs. Decoration
  Your hunch is correct. Sepúlveda's argument in *Democrates Alter* is a hybrid structure where Aristotle is doing specific, localized work, not carrying the whole roof.

  *   **Ground 1 (Natural Condition/Unfit to Rule):** This is the only point where Aristotle's **Capacity (i)** and **Benefit (iii)** claims are load-bearing. Sepúlveda needs (i) to establish that the Indians *cannot* self-govern, and (iii) to argue that *encomienda* is a remedy, not a theft. Without Aristotle here, this ground collapses into mere prejudice; with Aristotle, it becomes a teleological necessity.
  *   **Ground 2 (Crimes Against Nature/Sacrifice):** This is **Natural Law**, not Natural Slavery. This is Vitorian *jus gentium* logic (violations of universal law license punishment). Aristotle is decoration here. Sepúlveda invokes Aristotle to give the "crimes" an anthropological weight (irrationality) rather than just a legal one (sin), but the justification for intervention rests on Thomistic natural law, not *Politics* I.
  *   **Ground 3 (Conversion License):** This is Canon Law (*Sublimis Deus* trajectory). Aristotle is silent on salvation history. Sepúlveda uses Aristotle to explain *why* they need conversion (their rational deficiency makes them prone to idolatry), but the *right* to intervene comes from the Papal donation and the duty to evangelize.
  *   **The Fourth Ground (often implicit):** Protection of the Innocent (eating victims of sacrifice). Again, Natural Law.

  **Verdict:** Aristotle is the *diagnostic* tool for Ground 1, but the *therapeutic* justification for Grounds 2–4 relies on Natural Law and Canon Law. Sepúlveda's rhetorical trick is to let Ground 1 (Aristotle) bleed into Grounds 2–4, making the cultural/religious differences evidence of the natural deficiency. If you separate them, Aristotle's doctrine is necessary for the *status* of the Indian (slave vs. free), but not for the *legitimacy of intervention* (which Natural Law secures regardless).

  ### 2. The Evidential Structure and Detectability (ii)
  This is the strongest lever in your decomposition. Aristotle's **Detectability (ii)** assumes a shared *polis* context. In *Politics* I, the master reads the slave's soul through shared language, custom, and proximity. He concedes body/soul mismatch is possible but assumes it is rare and readable within a cultural horizon.

  At Valladolid, **Detectability (ii)** is the breaking point.
  *   **Sepúlveda** treats cultural markers (sacrifice, sodomy, lack of written law) as phenotypic readouts of rational deficiency. He assumes a transparent relationship between *custom* and *capacity*.
  *   **Las Casas** treats cultural markers as historical accretions. He argues that the "signs" Sepúlveda reads are noise, not signal.

  **The Epistemic Gap:** The Junta faced a problem Aristotle never anticipated: radical translation. If the "beauty of the soul is not seen," you need a shared language of virtue to infer it. The Junta had neither.
  *   **Is it unresolvable in principle?** Yes, given the tools they had. Without a neutral anthropology, (ii) becomes a Rorschach test. Sepúlveda sees a child; Las Casas sees a corrupted adult.
  *   **Institutional Consequence:** This is why the verdict was suspended. It wasn't just political expediency; it was an admission that the *evidentiary standard* for Natural Slavery could not be met across the Atlantic. The Crown realized that enforcing (i) required (ii), and (ii) was epistemically unavailable. The "inconclusiveness" is a bureaucratic recognition that the doctrine cannot be operationalized without high risk of mortal sin (violating **Benefit (iii)** by enslaving the free).

  ### 3. Las Casas: Internal or External Critique?
  Las Casas is strategically ambiguous, shifting between internal and external critiques depending on the audience and the text (*Apologia* vs. *De Imperatoria* vs. *Historia*).

  *   **Primary Strategy (Internal):** "Aristotle's criteria don't select these people." Las Casas argues the Indians have *ordo*, *politia*, and reason. They are not *servi a natura*. This accepts Aristotle's authority but contests the empirical application.
  *   **Secondary Strategy (External/Borderline):** In his later work, Las Casas implies that Aristotle's category of "barbarian" is relative to Greeks, not universal. He introduces a historical dimension Aristotle lacks: these people are not naturally deficient; they are *culturally* undeveloped (or differently developed).
  *   **Human Sacrifice:** You hit on a crucial theoretical node.
      *   **Sepúlveda:** Output (sacrifice) = Input (irrationality). Violates **Capacity (i)**.
      *   **Las Casas:** Output (sacrifice) = Input (Rationality + False Premise). This distinction *does* live in Aristotle (the distinction between *vice* and *natural deficiency*, or *akrasia* vs. *ignorance*). A virtuous man can be wrong about the gods; a natural slave lacks the deliberative faculty entirely. Las Casas argues the Indians deliberate correctly toward false ends. This preserves **Capacity (i)** while explaining the horrific **Output**.
      *   **Did Las Casas supply the distinction?** He supplied the *anthropological application* of the distinction. Aristotle doesn't deal with entire civilizations built on "false premises." Las Casas universalizes the Aristotelian faculty of reason to separate *culture* from *nature*.

  ### 4. Valladolid: Refutation, Anomaly, or Use-Case?
  It is a **stress test that reveals a category error.**

  *   **Not a Refutation:** Neither side rejects Aristotle's authority. The Junta is not a modern peer review; it is an inquiry into application.
  *   **Not an Anomaly:** It is the logical endpoint of combining Aristotelian hierarchy with Universalist Christianity. If all men are saveable (universalism) but some are naturally ruled (Aristotle), you *must* have a mechanism to sort them globally. Valladolid is the attempt to build that sorter.
  *   **The Mismatch:** Aristotle's **Telos** is the *polis* (virtue within the city). Spain's **Telos** is *Salvation* (virtue before God) + *Empire* (order).
      *   Aristotle's **Benefit (iii)** claim is that rule improves the slave's virtue *within the household*.
      *   Sepúlveda's **Benefit (iii)** claim is that rule saves the Indian's soul *and* secures Spanish wealth.
      *   This creates a tension: If the end is salvation, natural slavery is less relevant (grace perfects nature). If the end is empire, natural slavery is convenient.
  *   **Inconclusiveness as Evidence:** The lack of a verdict is evidence against **Detectability (ii)**. If the doctrine were robust, the evidence (however contested) should yield a decision. The suspension suggests the Crown understood that without secure detectability, the **Benefit (iii)** claim cannot be guaranteed. If you might be enslaving a rational being, the risk to the master's soul (tyranny) outweighs the benefit of the labor. The silence is a *precautionary principle* applied to metaphysics.

  ### 5. Silence vs. Wrong & Critique of the Four Clauses
  Your four-clause cut is excellent, but I would propose a fifth clause that exposes where the doctrine is silent rather than wrong.

  *   **The Missing Clause (v): The Telos of Rule.**
      *   Aristotle: Rule is for the good of the ruled *and* the ruler, but primarily to actualize the potential of the ruled within a static hierarchy.
      *   Valladolid: Rule is for *conversion* and *extraction*.
      *   **Where the Doctrine is Silent:** Aristotle has no concept of *missionary conquest*. He has no concept of a universal church overriding the *polis*. The doctrine is silent on whether a "natural slave" can become a Christian brother. (Pauline theology says yes; Aristotle says the nature is fixed). This creates the theological friction Las Casas exploits: if they can receive grace, do they have the rational capacity to receive it? If yes, how can they be natural slaves?
  *   **Critique of (iv) The Gate:**
      *   You define (iv) as Aristotle's unease about conventional slavery (war captives).
      *   **Sepúlveda's Move:** He tries to *close* this gate. He argues that Just War (conventional) *reveals* Natural Slavery. Victory is evidence of superiority, which is evidence of nature. He collapses (iv) into (i).
      *   **Las Casas's Move:** He keeps the gate wide open. War proves nothing about nature (Fortune plays a role).
      *   **Your Decomposition:** It holds, but you should note that the debate is largely about whether (iv) can be used as a proxy for (i). Sepúlveda says yes (Victory = Nature); Las Casas says no (Victory = Fortune/Technology).

  **Summary for your Seminar:**
  Move the discussion away from "Who won?" to "Why was a win impossible?" The Valladolid Junta demonstrates that Aristotelian Natural Slavery requires a shared epistemic community to function (Detectability). Once you globalize the framework without a shared language of virtue, (ii) fails. When (ii) fails, (iii) (Benefit) becomes morally hazardous. The Spanish Crown's suspension of the verdict was an implicit admission that the doctrine is non-operational in a colonial context. Sepúlveda tried to use Aristotle to solve an imperial problem; Las Casas used Aristotle to expose the imperial problem. The doctrine wasn't refuted; it was rendered administratively unenforceable.
