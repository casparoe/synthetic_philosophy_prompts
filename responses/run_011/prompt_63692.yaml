  The closest established concepts are **Lakatosian Degenerating Research Programmes** and **Data Snooping** (or **Overfitting**). Here is precisely where they stop fitting:

  1.  **Lakatosian Degenerating Programme:** In Imre Lakatos's philosophy of science, a programme degenerates when it adds "auxiliary hypotheses" only to explain anomalies (postdiction) without producing novel, corroborated predictions.
      *   *Where it fits:* The cliodynamics model is adding parameters to save the core theory from failure on Society C.
      *   *Where it stops fitting:* Lakatos requires the new hypothesis to be *testable*. Cliodynamicists argue their hypotheses *are* testable, just not within the lifespan of the current scientific community. Standard Lakatosian analysis assumes the scientific community persists long enough to verify claims. It lacks a category for "testable in principle, but unfalsifiable for all current stakeholders." It treats the deferral as a valid "progressive" claim, whereas you correctly identify it as a cost deferred to people who cannot consent to the debt.

  2.  **Data Snooping / Overfitting:** In statistics, this is tuning a model on data that should have been held out for validation.
      *   *Where it fits:* Using Society C to tune the parameter after seeing the failure is exactly snooping. You have used your test set as part of your training set.
      *   *Where it stops fitting:* Standard overfitting assumes exchangeable data (i.i.d.). Historical societies are not exchangeable; they are unique path-dependent trajectories. Furthermore, standard overfitting implies you *could* have held out data. In long-range historical forecasting, the "future" hold-out set is physically inaccessible. The practitioners argue this isn't snooping because there is no other data to use. This makes it a structural constraint rather than a procedural error, which standard "overfitting" doesn't capture.

  ### The Coinage: **Intergenerational Overfitting**

  Since no established term covers the *temporal deferral of validation cost* in a *small-N system*, I recommend using **Intergenerational Overfitting** for your team.

  **Definition:** A modeling error where parameters are tuned to fit historical anomalies (N=1 or small-N) with the justification that validation will occur in the future, thereby shifting the cost of complexity to a generation that cannot audit the tuning process.

  **The Carving (When is it legit vs. flaw?):**
  To distinguish this from legitimate model refinement, apply these boundary conditions:

  *   **Legit Parameter Addition:** The parameter is derived from a mechanism independent of the historical fit (e.g., a physical constraint, a demographic law validated in modern short-term data, or a psychological constant). The value is fixed *before* running the historical simulation.
      *   *Example:* Adding a term for "energy return on investment" where the EROI values are measured from archaeological data, not tuned to match the fall of Rome.
  *   **Intergenerational Overfitting:** The parameter is introduced *after* the model fails on a specific historical case, its value is chosen to minimize residuals on that case, and the only justification for its validity is future performance.
      *   *Example:* Adding a "elite cohesion factor" and setting its value to 0.7 because that makes the French Revolution land in the right decade, with the claim "we'll know if it's real in 2100."

  **The Second Pattern (Right Phase, Wrong Timing):**
  This is a specific variant of **Moving the Goalposts**, but in this context, it is **Temporal Smearing**. If the model predicts a crisis in 1780 and it happens in 1789, and the modeler says "the phase boundary is fuzzy," they are retroactively increasing the variance allowance of the model to encompass the error. This is only legit if the variance was specified *ex-ante*. If the window is widened *ex-post* to catch the bullet, it is **Postdictive Windowing**.

  ### Verdict

  You are dealing with a structural epistemic problem unique to deep-time forecasting. While it shares DNA with overfitting and degenerating programmes, the specific mechanism of deferring validation beyond the observer's horizon lacks a specific standard label.

  Verdict: no established term
