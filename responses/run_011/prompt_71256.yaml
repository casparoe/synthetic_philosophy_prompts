      *   *Bent:* "Intelligence" isn't a scalar PV. "Goal Alignment" isn't standard stability.
      *   *No Expression:* "Qualitative capability shifts" (phase changes?), "Consciousness," "Value drift."
      *   *Diagnosis:* Some are vague AI claims, some are limitations of linear control theory (non-linear phase transitions).

  6.  **Refining the Control Metaphor (Technical Precision):**
      *   Use "Positive Feedback" carefully. In process control, positive feedback usually means instability/runaway. This fits "Takeoff."
      *   Differentiate "Open Loop Step" (Human engineers build a better PLC) vs. "Closed Loop" (PLC rewrites its own code).
      *   The "Physical Bottlenecks" are *series elements* outside the fast digital loop. They introduce *transport lag* (dead time) and *rate limits* (slew rate).
      *   *Crucial distinction:* The prompt asks to distinguish "loop gain > 1" from "one large step change."
