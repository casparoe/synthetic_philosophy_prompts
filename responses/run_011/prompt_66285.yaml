  2.  **Deconstruct Keynesian Framework for this Context:**
      *   *Risk vs. Uncertainty:* Risk has known probabilities (can calculate expected value). Uncertainty lacks known probabilities (cannot calculate expected value).
      *   *Weight of Argument:* How much evidence supports the probability estimate? High weight = more confidence, but not necessarily higher probability.
      *   *Non-comparability:* Some uncertainties cannot be ranked against each other.
      *   *Convention:* When uncertainty is high, we rely on convention (e.g., assuming the future resembles the present) to act, but we must acknowledge it's convention, not fact.
      *   *Animal Spirits:* Action often requires a leap of faith, not just calculation.

