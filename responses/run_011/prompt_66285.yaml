answer: |-
  Subject: Procedure for Uncertainty and Capital Appraisals

  I have been thinking about your request to formalize how we handle the thirty-year appraisals, specifically regarding the pressure to produce single-point probabilities that do not exist. Based on the Keynesian framework you mentioned, particularly the distinction between the weight of argument and the balance of probability, here is a procedure that fits within our one-week turnaround and leverages the consulting engineer's countersignature without requiring statistical literacy from the finance committee. The workflow begins when a proposal lands on your desk. Step 1 is to ask the engineering lead to classify the primary input variable as either data-rich, model-dependent, or convention-based. Step 2 is to ask whether the underlying system is stationary, meaning whether past frequencies are a reliable guide to future outcomes. Step 3 determines what goes in the box based on those answers. If the input is data-rich and the system is stationary, you calculate an expected value and put the number in the box. If the input is model-dependent or the system is non-stationary, you do not put a single number in the box but instead provide a range based on conventional scenarios, labeled as such. If the input is convention-based and the system is fundamentally uncertain, you put nothing in the number box and instead insert a convention statement that explicitly says we are assuming a specific value only to allow comparison with other projects, not because we believe it is true. Step 4 is the handoff point, which occurs when the choice between projects depends not on which has a higher return but on how much loss the city can tolerate if the convention proves wrong, which is a question of values rather than facts and must be flagged for the committee to decide.

  Running this on your three cases reveals where the friction will be. For the sea wall whose payoff depends on a 2070 storm-surge projection, step 1 classifies the input as model-dependent and step 2 fails because the climate system is non-stationary. Under this procedure, you are not permitted to put a single number in the box. You must submit a convention statement based on the IPCC median scenario, signed by the engineer, stating that this value is used for planning coherence only. The uncomfortable truth you suspected is confirmed here: because the finance committee treats numbers as facts and blanks as errors, refusing to provide a number will likely cause them to shelve the project in favor of ones with calculable returns. The status quo wins by default, not because the wall is unnecessary, but because our accounting cannot handle deep uncertainty. This is the answer you will not like, because it confirms that rigor might kill the project just as surely as a bad number would.

  For the hospital extension whose main input is a population forecast everyone knows is wrong, step 1 classifies the input as convention-based because nobody can improve the data. However, demographic trends have a higher weight of argument than climate surges. Here you apply step 3 by providing a range based on the high and low demographic scenarios rather than a single mean. You attach a note explaining that the weight of argument is low but the convention is standard across government. This allows the committee to see the variance without pretending the midpoint is real. For the early repayment of the city's variable-rate debt, step 1 classifies the input as data-rich because financial markets price risk continuously, but step 2 fails because interest rates are not stationary. However, financial convention is strong enough that you are permitted to put a number in the box based on the current yield curve, provided you label it as a market-implied probability rather than a prediction. This case works smoothly because the market provides a convention that everyone agrees to treat as real for the sake of trading, even if it is not a fact about the future.

  You asked where the judgment is dressed up as procedure, and it hides in step 1 when the engineer classifies the input. The procedure cannot stop an engineer from claiming a model is data-rich when it is actually speculation, and your one-week limit means you cannot audit their physics, only their classification. The procedure also cannot stop the status quo bias we identified in the sea wall case. Keynes argued that when uncertainty is high, we lean on convention to act, but he also noted that convention is fragile. By refusing to give a number for the sea wall, you are being honest about the weight of argument, but you are removing the convention that allows the committee to feel safe. The procedure can clarify that you are dealing with uncertainty rather than risk, and it can force the value judgment into the open at step 4, but it cannot force the committee to accept uncertainty without punishing the proposal. You will have to decide whether protecting the integrity of the analysis is worth the risk that the sea wall never gets built, because the procedure protects the truth but not the outcome.
