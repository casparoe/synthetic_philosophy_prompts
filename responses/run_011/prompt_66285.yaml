      *   Step 3: Consensus Check (Convention). What is the standard assumption? (e.g., engineer's standard).
      *   Step 4: Decision Rule. If 1 & 2 are strong, give a number. If 1 is weak but 3 is strong, give a range based on convention. If both weak, give a qualitative statement.
