answer: |-
  **IR Evaluation Triage Protocol**

  **1. Temporal Order Check**
  *Question:* Was the conditioning variable measured before participation?
  *Sufficient Answer:* Yes.
  *Stop Condition:* If **No** (e.g., major declaration, retention status), the variable is a collider or outcome. Conditioning induces bias. **Handoff to Director:** Determine if the metric is valid for program goals.
  *[Judgment Call: Defining "pre-existing" when records lag enrollment.]*

  **2. Cell Stability Check**
  *Question:* Do all subgroups contain $n > 30$?
  *Sufficient Answer:* Yes.
  *Stop Condition:* If **No**, declare reversal an artifact of variance. Report aggregate only.

  **3. Selection Mechanism Check**
  *Question:* Does the conditioning variable strongly predict participation rates?
  *Sufficient Answer:* Yes (e.g., high-GPA students disproportionately enroll).
  *Implication:* Aggregate differences likely reflect composition, not treatment. Subgroup comparisons estimate causal effect; aggregate reflects operational reality.

  **4. Directional Consistency**
  *Question:* Do subgroup effects align?
  *Sufficient Answer:* Yes.
  *Stop Condition:* If **No** (reversal), proceed to Step 5. If subgroups consistently show negative effects while aggregate is positive, the program selects successful students rather than creating success.

  **5. The Weighting Handoff**
  *Question:* Does the institution value *efficacy* (causal lift) or *utility* (aggregate outcome)?
  *Stop Condition:* **Mandatory Human Decision.** Statistics cannot weight subgroups. The Committee must decide if a program that selects winners is valuable.
  *[Judgment Call dressed as procedure: Defining the counterfactual population of interest.]*

  ***

  **Case Applications**

  **(a) First-Year Seminar (Simpson's Paradox)**
  *Run:* Step 1 passes (Entering GPA is pre-existing). Step 2 passes (bands are large). Step 3 confirms strong selection (high-GPA students sent to seminar). Step 4 shows consistent negative subgroup effects.
  *Resolution:* Step 5 Handoff. I told the Provost it "works" because the institution values the *aggregate* graduation rate contribution. The procedure confirms the program selects rather than treats, but the "Utility" justification overrides the "Efficacy" deficit. The reversal is an artifact of composition regarding *causal impact*, but not regarding *institutional metrics*.

  **(b) Tutoring Program (Small Cell Noise)**
  *Run:* Step 1 passes. Step 2 fails (transfer cell $n=30$).
  *Resolution:* Stop at Step 2. The aggregate advantage is declared an artifact of unstable variance in a small subgroup. No causal claim is made. Recommendation: Pilot expansion or close.

  **(c) Advising Redesign (Post-Treatment Bias)**
  *Run:* Step 1 fails. "Declared major within a year" is an outcome the program aims to influence.
  *Resolution:* Stop at Step 1. Conditioning on this variable controls away the program's mechanism. The comparison is invalid. **Handoff to Director:** Evaluate using only pre-existing covariates (e.g., entering credits).

  ***

  **Limits of Data**

  No data my office collects can settle **unobserved motivation**. Participants self-select; non-participants opt out. Even with perfect pre-treatment covariates, we cannot measure the "will to succeed" that drives both program uptake and graduation. We measure correlation conditional on observables, not causation. The decision to fund a program ultimately rests on whether the Committee believes the program *creates* success or merely *captures* it. That is a theory of change, not a statistical test.
