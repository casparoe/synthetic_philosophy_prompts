answer: |-
  **Seminar Specification: Normative Constraints on the Inside/Outside View Distinction**

  **Context and Purpose**
  This seminar does not survey the empirical literature on forecasting; rather, it specifies the conditions of adequacy for any normative account of when the inside view (case-specific details) must yield to the outside view (reference class statistics). We fix the practical purpose: a competent non-specialist administrator deciding whether a three-year research programme will finish on schedule. Actionability is treated here as a candidate desideratum to be tested against epistemic rigour, not assumed as a given.

  **Requirements for Adequacy**
  The following requirements are derived from the logical structure of prediction under uncertainty, not from the preferences of heuristics-and-biases proponents or clinical judgement advocates.

  1.  **The Reference Class Specification Requirement (Accuracy / Non-negotiable)**
      *   *Consideration:* Any event sits in indefinitely many reference classes with divergent base rates (e.g., 'research projects', 'projects led by this PI', 'projects in this discipline').
      *   *Requirement:* An account must provide a non-arbitrary rule for selecting the *relevant* class. Merely instructing an agent to 'take the outside view' is incomplete without a principle for choosing which outside view applies.
      *   *Distinction:* This separates the *availability* of a base rate from its *correctness* for the specific case.

  2.  **The Inside Evidence Sensitivity Requirement (Accuracy / Non-negotiable)**
      *   *Consideration:* Agents often possess case-specific information that is genuine evidence rather than mere optimism (e.g., a unique methodological breakthrough).
      *   *Requirement:* The account must allow inside information to adjust the baseline probability when that information is probative. A method that drowns unique evidence in a generic average fails to utilise available information.
      *   *Distinction:* This distinguishes *calibration* (matching long-run frequencies) from *resolution* (discriminating between specific outcomes).

  3.  **The One-Off Decision Constraint (Accuracy / Non-negotiable)**
      *   *Consideration:* Some decisions are genuinely one-off, where no relevant frequency data exists or the sample size is effectively one.
      *   *Requirement:* The account must prescribe a procedure for cases where the outside view is unavailable. It cannot simply declare the judgement impossible.
      *   *Distinction:* This tests whether the outside view is a *norm* for all judgement or a *heuristic* for frequentist contexts.

  4.  **The Insider Underperformance Diagnostic (Accuracy / Non-negotiable)**
      *   *Consideration:* Informed insiders systematically do worse than base rates in specific contexts (e.g., the planning fallacy), but not in all.
      *   *Requirement:* The account must specify the conditions under which inside-view confidence is pathogenic rather than informative. It must distinguish between unwarranted optimism and justified expertise.
      *   *Distinction:* This separates deferring to base rates as a *correction for bias* from deferring to them as a *fundamental epistemic obligation*.

  5.  **The Reflexivity Constraint (Use / Non-negotiable)**
      *   *Consideration:* Predictions can alter the very statistics on which they rest (e.g., predicting delay causes funding cuts, ensuring delay).
      *   *Requirement:* The account must address whether the prediction is constative (describing the world) or performative (changing the world).
      *   *Distinction:* This separates accuracy in *prediction* from success in *intervention*.

  6.  **The Actionability Desideratum (Use / Candidate)**
      *   *Consideration:* The user is a competent non-specialist, not a statistician.
      *   *Requirement:* The method must be executable without requiring expertise the agent lacks. If the correction for the outside view requires complex Bayesian updating, it fails the practical purpose.
      *   *Distinction:* This tests whether normative adequacy tolerates computational intractability.

  **The Impossibility Claim: Class Fixity vs. Evidence Sensitivity**
  I submit that Requirements 1 (Reference Class Specification) and 2 (Inside Evidence Sensitivity) are jointly unsatisfiable for a non-specialist agent. To satisfy Requirement 1 and block motivated class-shopping, the reference class must be fixed *ex ante*, defined by features known before the assessment begins. If the class selection is allowed to shift based on inside information discovered *ex post*, the agent can invariably 'shop' for a class that favours their desired conclusion under the guise of refinement. However, to satisfy Requirement 2, the assessment must be responsive to inside information that legitimately distinguishes the case from the class mean. If the class is fixed *ex ante* to prevent bias, the model is blinded to unique, probative evidence that emerges during the assessment. A non-specialist lacks the meta-knowledge to distinguish between a legitimate refinement of the class based on evidence and a motivated distortion of the class to suit a conclusion. Therefore, a rule that guarantees bias protection (fixed class) precludes genuine responsiveness to inside information, and a rule that allows responsiveness opens the door to bias. One cannot simultaneously enforce a rigid selection rule and permit flexible evidential updating.

  **Conclusion**
  The requirement that eliminates the most contenders is the **Reference Class Specification Requirement**. Strict base-rate views fail because they cannot non-arbitrarily select a class without inside input, whilst strict inside-view accounts fail because they reject the necessity of class-based calibration entirely. Neither survives the demand that the method specify *which* outside view applies without begging the question.
