  4.  **Address Question 2: Factual Claims:**
      *   *Józefów numbers:* Browning says ~500 men, ~10-12 stepped out. Draft says "Fewer than a dozen of roughly five hundred." -> *Accurate enough.*
      *   *Commander's offer timing:* Major Trapp offered the opt-out *before* the action started, at the assembly point, not after arrival at the killing pits. Draft says "assembled his men... invited anyone... to step out." -> *Accurate.*
      *   *Goldhagen's sources:* Goldhagen relied heavily on the same German Central Office for the Investigation of National Socialist Crimes (ZStL) files as Browning. He didn't do new archival digging so much as reinterpret the same transcripts. Draft says "rest on the same documentary base." -> *Accurate.*
      *   *Unit's later activities:* RPB 101 did deportations, "Jew hunts," and shootings throughout 1942-1943. Draft says "roundups, deportations, shootings, and the pursuit of Jews." -> *Accurate.*
      *   *Nuance:* The "price" wasn't just social; there were *no* formal sanctions for opting out at Józefów. Trapp explicitly said no punishment. This supports the $c$ argument (social/psychological cost vs. formal sanction).

  5.  **Address Question 3: Section 5 (Testimony Asymmetry):**
      *   *Query:* Is "everyone thought that way" exculpatory?
      *   *Analysis:* Yes. "I did it because everyone hated Jews" diffuses guilt. "I did it because I was ordered to" also diffuses guilt.
      *   *Critique:* The draft claims ideological admission is *against* penal interest. In postwar Germany, admitting to *murder* is against interest. Admitting to *antisemitism* was socially taboo but not necessarily criminal unless it proved specific intent for a specific crime. However, in the context of the trials, admitting "I wanted to kill them" makes you a murderer, not just a follower.
      *   *Refinement:* The asymmetry holds but needs nuance. Admitting *enthusiasm* is against interest (makes you a principal). Admitting *general cultural antisemitism* is exculpatory (makes you a product of your time). The draft conflates the two.
