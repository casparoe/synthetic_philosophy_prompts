      *   *Best Selection for "Price":* **The Reserve Police Battalions in different jurisdictions.** Or **The French Gendarmerie**.
      *   *Decision:* **Police Battalion 309 (Białystok).** Same time, same war, different commander (Major Weiss vs. Major Trapp). Weiss did not offer an opt-out. If $P$ is constant (German culture), compliance should be same. If $c$ matters, compliance should be higher in 309 because $c$ was higher (no opt-out).
      *   *Falsification:* If Battalion 309 had *more* refusals despite higher $c$, the model fails. (Historically, 309 was arguably *more* brutal, supporting the $c$ model, but the lack of opt-out makes comparison hard).
      *   *Alternative:* **The Bulgarian Army/Police regarding deportation of Jews.** They refused. Was $c$ low? No, German pressure was high. So $P$ must have been low. This tests the limit.
