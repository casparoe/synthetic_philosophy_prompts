answer: |-
  This is a fantastic passage to get stuck on, because in these two chapters, Herodotus is effectively inventing the discipline of **historical source criticism**. He is treating Homer not as a sacred text, but as a biased witness whose testimony needs to be cross-examined.

  Here is a breakdown to help you lead the discussion, specifically tailored to address your four sticking points and give your prosecutor friend some ammunition (while also showing why he might be missing the point).

  ### 1. The Slide from "Homer Knew" to "It's True"
  You are right to be suspicious of the logic here. Herodotus does not strictly argue: *Homer knew it, therefore it happened.*

  His argument is actually a two-step validation of the **Egyptian Priests**:
  1.  **Step 1 (Chapter 116):** The Egyptian priests claim this is an ancient story. A skeptic might say, "The Egyptians are just making this up to boost their own cultural importance." Herodotus uses Homer to prove the story isn't a *new* Egyptian invention. If the greatest Greek poet knew the Egyptian version (even if he hid it), then the story existed in Homer's time. It validates the *antiquity* of the Egyptian claim.
  2.  **Step 2 (Chapter 120):** Herodotus then uses his own reason (*gnome*) to decide which version is *probable*.

  So, he doesn't slide from "Homer knew" to "It's true." He slides from "Homer knew" to "The Egyptians aren't lying about the story's age," and then from "The Trojan version is illogical" to "The Egyptian version is true." Homer provides the **corroboration**; logic provides the **verdict**.

  ### 2. Which Textual Evidence is Doing the Work?
  This is the most technical part of your discussion. Here is how to parse the evidence:

  *   **The *Iliad* Quote (Sidon/Robes):** This is the evidence for **suppression**. The *Iliad* is a poem about the war at Troy. If Helen was in Egypt, the *Iliad* is the place where Homer would have to "lie" the most. By showing Paris went to Sidon (near Egypt) and brought back robes, Herodotus argues Homer left a "breadcrumb." He didn't erase the detour entirely; he just didn't make it the main plot.
  *   **The *Odyssey* Quotes (Drugs/Menelaus):** This is the evidence for **knowledge**. In the *Odyssey*, the war is over. Menelaus talking about being stuck in Egypt or Helen having Egyptian drugs doesn't ruin the "glory of Troy." So Homer feels free to mention Egypt openly here.
  *   **The Geography Leap:** You are right that Sidon $\rightarrow$ Egypt is a stretch (Sidon is modern Lebanon; Egypt is south). But for Herodotus's audience, "Phoenicia/Syria/Egypt" were a fluid commercial zone. The argument isn't that Sidon *is* Egypt, but that a voyage stopping in Sidon proves Paris was sailing the Egyptian trade route, not the direct route to Troy.
  *   **The "Nowhere else" Comment:** This is a sophisticated **argument from distribution**, not just silence. Herodotus is saying: "Homer mentions this detail *once* in the war poem, but *repeatedly* in the travel poem." This pattern suggests the Egypt story was available to him, but he minimized it in the *Iliad* for artistic unity.

  **Verdict for the group:** The *Odyssey* quotes prove Homer *knew* the Egyptian tradition. The *Iliad* quote proves Homer *chose* to hide it. Both are needed for Herodotus's theory of "Artistic Suppression."

  ### 3. Steelman: Textual Analysis (116) vs. Logical Inference (120)
  Your prosecutor friend is going to love Chapter 120. Here is how to frame the debate for the group.

  **The Prosecutor's Case (Chapter 120 is stronger):**
  *   **Argument:** This is *eikos* (probability/reasonableness). It relies on human nature. Priam is a rational actor. If you are losing a war, and your son's girlfriend is the cause, you give her back. Especially if your other sons are dying.
  *   **Strength:** It doesn't rely on interpreting poetry. It relies on common sense. It treats the Trojan War not as a myth, but as a legal case where the defendant (Priam) acted against his own self-interest.
  *   **Why it wins:** It feels more "modern." It's behavioral psychology.

  **The Historian's Case (Chapter 116 is stronger/necessary):**
  *   **Argument:** Chapter 120 assumes people in the Heroic Age acted like modern litigants. But in epic, honor (*timē*) matters more than survival. Priam cannot surrender Helen without losing face; the gods might be compelling him to fight. Rationality doesn't always govern myth.
  *   **Strength:** Chapter 116 acknowledges that **tradition is layered.** It admits that our main source (Homer) has an agenda (glory/epic scale).
  *   **Why it wins:** Without 116, 120 is just Herodotus's opinion. With 116, he shows that the "Egyptian Version" isn't his invention; it's a suppressed alternative tradition. 116 provides the *evidence*; 120 provides the *motive*.

  **Discussion Tip:** Ask the group: *If Herodotus only gave us Chapter 120, would we believe him?* (Probably not; it's just his opinion). *If he only gave us Chapter 116?* (Maybe; it's literary theory). He needs both to make the case stick.

  ### 4. The Double Standard: Homer as Witness vs. Homer as Inflator
  You have hit on the single most important methodological innovation in this text. Herodotus is drawing a line between **Intentional Narrative** and **Incidental Detail**.

  *   **The Principle:** A poet (or any biased source) will lie about the *main plot* to make themselves look good or to fit a genre (Homer makes the war bigger for glory). But they will often tell the truth about *incidental details* that don't serve the agenda (where the robes came from, what drugs Helen had).
  *   **Modern Terminology:** Historians call this **"Tendency Criticism"** or looking for **"Unintended Testimony."**
      *   *Example:* If a politician's speech boasts about winning a battle (Inflated Narrative), but mentions in passing that it rained that day (Incidental Detail), we trust the rain more than the victory count.
      *   *Example:* The "Criterion of Embarrassment" in biblical studies (authors wouldn't invent details that make their heroes look bad, like Peter denying Jesus). Herodotus is doing the reverse: Authors wouldn't invent details that don't help their story (the Sidon detour).

  **Does this survive?**
  Yes, absolutely. This is the foundation of modern archival research. We assume every document has a bias (an "agenda"). We look for the "fingerprints" of reality that the author couldn't scrub out.
  *   **What to call it:** You can tell your group this is the birth of **Source Criticism**. Herodotus is treating Homer like a deposition from a witness who has a reason to lie, rather than like a holy scripture.

  ### Summary for your Group
  If you need a "cheat sheet" for the meeting:

  1.  **Herodotus isn't saying Homer is a liar;** he's saying Homer is an *artist*. Artists change facts for pacing and theme.
  2.  **Chapter 116** proves the Egyptian story is old (Homer knew it).
  3.  **Chapter 120** proves the Trojan story is impossible (Priam wasn't stupid).
  4.  **The Method:** Distinguish between what the source *wants* to tell you (the War) and what they *accidentally* reveal (the Robes/Sidon).

  Your prosecutor friend is right that 120 is the "closing argument," but 116 is the "discovery phase" where the evidence was gathered. Without the discovery, the closing argument is just speculation.
