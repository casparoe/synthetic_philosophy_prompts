      *   **Task:** Understanding Herodotus, *Histories* Book 2, chapters 116 & 120 (Godley translation).
      *   **Problem:** Stuck on Herodotus's argumentative strategy. Specifically, how he uses Homer as evidence vs. logical inference.
      *   **Tone:** Intellectual but accessible (it's a reading group, not a seminar for specialists), appreciative of nuance, needs to satisfy a skeptical ex-prosecutor.
      *   **Specific Questions:**
          1.  Does Herodotus slide from "Homer knew it" to "It's true"?
          2.  Which textual evidence does the heavy lifting? (Iliad vs. Odyssey, geography leap, argument from silence).
          3.  Steelman both sides: Textual analysis (116) vs. Logical/Behavioral inference (120). Who wins?
          4.  Is there a principled distinction in how Herodotus treats Homer (witness vs. inflator)? Does this methodology survive in modern historiography?

  2.  **Deconstruct Herodotus's Argument (Mental Sandbox):**
      *   *Context:* Herodotus is in Egypt. Egyptian priests tell him Helen never went to Troy; she stayed in Egypt with Proteus. Paris went to Troy with a phantom (eidolon).
      *   *Chapter 116:* Herodotus tries to prove Homer *knew* this Egyptian version but chose the Trojan version for poetic reasons. He cites *Iliad* (Sidon/robes) and *Odyssey* (drugs/Menelaus stuck).
      *   *Chapter 120:* Herodotus offers his own *gnome* (judgment/opinion). If Helen were at Troy, Priam would have given her back to stop the war, especially after losing sons. Since he didn't, she wasn't there.
      *   *The Tension:* 116 is source criticism (reading between the lines of poetry). 120 is rationalism (human nature/probability).

  3.  **Address Question 1: The Slide from "Knew" to "True".**
      *   *Observation:* Herodotus says Homer knew the story but rejected it for epic suitability. Then he says, "I myself believe their [the priests'] story."
      *   *Analysis:* He doesn't exactly slide. He uses Homer to validate the *antiquity* and *circulation* of the Egyptian version (it's not a new Egyptian invention). But the *truth* claim rests on the priests' authority + his own rational judgment (120).
      *   *Nuance:* For Herodotus, if an old source (Homer) hints at it, it lends credibility, but the clincher is the logical impossibility of the Trojan version (120). He treats Homer as a corrupted witness, not a liar, but one who made an artistic choice. The "truth" comes from the Egyptian priests + logic.

  4.  **Address Question 2: The Textual Evidence.**
      *   *The Iliad Bit:* Paris went to Sidon. Herodotus argues Sidon -> Syria -> Egypt. It *is* a stretch geographically, but in the ancient mindset, "Phoenicia/Egypt" were often linked trade routes.
      *   *The Odyssey Bits:* Menelaus stuck in Egypt; Helen's drugs from Egypt. These are stronger direct links.
      *   *Why lead with Iliad?* The *Iliad* is the war poem. If Helen wasn't at the war, the *Iliad* is the place to find the "tell." The *Odyssey* is post-war, so Menelaus going to Egypt is less surprising.
      *   *Argument from Silence:* "Nowhere else does he return to the story." This is subtle. It means Homer didn't build the *whole* poem on the Egypt story, just left crumbs. It's not silence about a source; it's silence about the *plot* despite having the knowledge.
      *   *Verdict:* The *Odyssey* quotes are stronger evidence of knowledge. The *Iliad* quote is stronger evidence of *suppression* (because the *Iliad* is about Troy). The geography leap is typical ancient geography (fluid boundaries).

  5.  **Address Question 3: Steelman 116 vs. 120 (The Prosecutor's View).**
      *   *Prosecutor (120 wins):* 116 is literary speculation. "Homer meant this" is subjective. 120 is behavioral psychology/probability. Priam losing sons + Helen present = Give her back. He didn't. Therefore, she wasn't there. This is *eikos* (probability/reasonableness), a key Sophistic/rhetorical tool. It's circumstantial but compelling.
      *   *Literary/Historian (116 wins/matters):* 120 assumes rational actors in a mythic context. Gods influence Priam. Honor culture dictates you don't surrender under duress. 120 is anachronistic rationalism. 116 is actually more sophisticated: it treats tradition as a palimpsest. It acknowledges that truth gets buried under art.
      *   *Synthesis:* Herodotus needs *both*. 116 shows the story existed in the tradition. 120 shows why the traditional story makes no sense. 116 validates the alternative; 120 invalidates the standard.

  6.  **Address Question 4: The Double Standard & Modern Historiography.**
      *   *The Distinction:* Incidental details (robes, drugs) vs. Central Plot (War, Heroes). Poets inflate the central plot for glory (*kleos*). They leave incidental details alone because they don't serve the glory.
      *   *Term:* "Incidental Evidence" or "Unintended Testimony." Also related to the "Criterion of Embarrassment" (though not quite). In modern terms: "Source Criticism" and "Tendency Criticism."
      *   *Modern Historiography:* Yes, absolutely. We treat propaganda differently than logistical records. We look for "fossils" in the text. We assume authors have agendas (like Homer wanting epic glory) and look for what slips through the cracks (like the Sidon detour).
      *   *Name:* "Historical Source Criticism" or "Literary Archaeology." Thucydides is more strict, but Herodotus is the father of *asking* these questions.

  7.  **Drafting the Response:**
      *   *Tone:* Respectful, engaging, slightly academic but clear (for the library group). Acknowledge the prosecutor friend (that's a great hook).
      *   *Structure:* Follow the four questions.
      *   *Key Insight:* Herodotus is inventing "Source Criticism" here. He's treating Homer not as a bible, but as a biased witness.
      *   *Refinement on Q1:* Make sure to distinguish between "Homer knew it" (116) and "I believe the priests" (120). The link is that Homer's knowledge validates the priests aren't making it up *now*.
      *   *Refinement on Q2:* The Sidon/Earth leap is weak to us, but acceptable then. The *Odyssey* quotes are the "smoking gun" for knowledge, the *Iliad* quote is the "smoking gun" for suppression.
      *   *Refinement on Q3:* The prosecutor is right about *rhetorical force*, but wrong about *historical method*. 120 is rationalism (Sophistic influence). 116 is philology. Herodotus combines them.
      *   *Refinement on Q4:* Use the term "Tendency Criticism" or "Agenda." The distinction is between *intentional narrative* vs. *unconscious detail*.

  8.  **Final Polish:** Check against Godley's translation nuances (e.g., "if the poets are to be believed"). Ensure the distinction between *logos* (story) and *gnome* (judgment) is clear. (Self-Correction: Keep it accessible, don't overuse Greek terms without explanation).

  9.  *(Final check of the prompt requirements)*: Did I answer all 4 points? Yes. Did I address the prosecutor friend? Yes. Is it helpful for a reading group leader? Yes.

