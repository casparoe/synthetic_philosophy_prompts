  I've read the logical induction paper something like four times now and I still can't produce a clean concrete example of the thing it's actually worried about, which is embarassing at this point. So build me one.

  Context for what it's for: I'm doing a talk at my local rationality meetup, maybe twenty people, and a solid half of them are Bayesians who think coherence plus conditionalization is the whole story and that worrying about logical omniscience is like worrying that a real agent can't count to a billion. I need a case that lands on that audience specifically.

  Here's the target verdicts: the agent's credences are fully probabilistically coherent — every axiom satisfied over the algebra it's working in, no Dutch book available from any inconsistency it could see if it tried — and it still gets boringly, reliably fleeced by an opponent who is not a superintelligence, just a quick person with more patience. The loss has to come from the agent failing to compute something. If the fleecing traces back to the agent holding contradictory beliefs, or to a bad prior over empirical stuff, the case is broken.

  Background so you're not guessing what I mean by the criterion: roughly, you count as an acceptable reasoner if no trader running in polynomial time can make unbounded money off you across a sequence of markets, where a bet settles in the trader's favor whenever logic pins down the answer. Note the trader doesn't have to know the answer in advance — a theorem, a proven aggregate fact, or a pattern it can exploit is enough.

  Ground rules:
  - The scenario is one paragraph, and it's realistic. Bet board in a shared office, an internal prediction market at a quant shop, a rich eccentric's standing offer, whatever you like. No vats, no sims, no oracles, no adversarial AI.
  - The hard sentences must be genuinely decidable, and decidable in principle by hand — a bright person with a month and paper could check any single one. Nothing uncomputable.
  - The trader's edge can't be private information, about the world or about the inside of the agent's head. If I could redescribe your case as "the trader just happened to know the answer," it fails.
  - If your trader ends up leaning on something that's only conjectured rather than proven, flag it yourself and tell me whether that's fatal.

  Then show your work. Name the sentence or sentence family and why the agent can't resolve it. Show explicitly that its credence function is coherent over the algebra in play — treating the hard sentence as an atom is fine, just say that's what you're doing. Give the trading strategy and why it pays off over the sequence rather than once. And state why no coherence-only Dutch book was on the table.

  Last bit, and don't skip it: tell me what's actually load-bearing in the case, what the verdict becomes if you take that piece out, and how the "logical omniscience is a harmless idealization, no worse than idealizing away bounded memory" person comes back at me. Say whether you think that objection lands, because I will absolutely get it and I'd rather know now.

  Stipulating verdicts instead of generating them is cheating — the fleecing has to fall out of the setup. Hard cap of 700 words for the whole thing. I know that's cramped for the walk-through, so cut anything that isn't doing work.
