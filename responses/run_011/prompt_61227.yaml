answer: |-
  **Scenario**
  An internal prediction market at a quant shop trades sentences $S_n$: "Turing machine $M_n$ halts within $10^{10}$ steps," and $T_n$: "Simulation of $M_n$ outputs 'HALT' within $10^{10}$ steps." Both are decidable by hand given a month. The agent, a busy quant, prices $S_n$ at 0.6 using a heuristic and $T_n$ at 0.4 using a conservative baseline, treating them as distinct atomic propositions in their current algebra. The agent is probabilistically coherent over this algebra. A colleague (the trader) notices the pricing discrepancy.

  **Show Your Work**
  **Sentence:** $S_n \leftrightarrow T_n$. This is a logical truth by definition of simulation, decidable in principle.
  **Agent's Limit:** The agent cannot verify the equivalence for every $n$ instantly; proof search is computationally costly. They treat $S_n$ and $T_n$ as independent atoms until the equivalence proof is computed and added to their algebra.
  **Coherence:** Over the algebra $\mathcal{A}_t = \{S_n, T_n\}$ without the relation $S_n \leftrightarrow T_n$, assigning $P(S_n)=0.6, P(T_n)=0.4$ violates no probability axioms. No static Dutch book exists on $\mathcal{A}_t$.
  **Strategy:** The trader buys $S_n$ shares and sells $T_n$ shares for each $n$. Net cost: 0.2. Since $S_n$ and $T_n$ always share truth values, the payout is always identical (1-1=0 or 0-0=0 liability). The trader keeps the 0.2 premium risk-free.
  **Outcome:** Over the sequence $n=1, 2, \dots$, the trader makes unbounded money. The loss stems purely from the agent's failure to compute the logical equivalence fast enough, not from incoherence or empirical ignorance.

  **Load-Bearing & Objection**
  The load-bearing piece is the **computational cost of recognizing logical equivalence**. If you remove this (granting the agent instant proof search), the agent immediately enforces $P(S_n) = P(T_n)$, the price discrepancy vanishes, and the exploit fails.

  The Bayesian objection is: "Logical omniscience is a harmless idealization, no worse than idealizing away bounded memory." They argue real agents approximate this ideal closely enough that the exploit is theoretical noise.

  This objection does not land. Bounded memory limits *storage* (linear constraint); bounded logic limits *reasoning depth* (combinatorial explosion). An agent with infinite memory can still fail to find a proof in a vast search space within a lifetime. Idealizing logical omniscience doesn't just simplify the agent; it implicitly shrinks the logical universe to fit the agent's compute. In reality, the space of decidable sentences grows faster than any fixed computational budget. The fleecing isn't a edge case; it's the inevitable tax on bounded reasoning in an infinite logical space. Logical induction isn't worrying about counting to a billion; it's worrying about missing a bridge that exists but takes too long to build.
