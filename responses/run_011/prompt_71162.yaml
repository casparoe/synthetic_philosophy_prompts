answer: |-
  **MEMORANDUM**

  **TO:** Board of Directors
  **FROM:** [Your Name]
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation on Highland Thermal Program vs. Bednet Reallocation

  ### 1. Executive Summary & Recommendation

  We face a resource allocation decision with significant moral weight. We must choose between renewing an existing newborn thermal-care program (Highland District) or reallocating funds to a higher-impact bednet distribution program (Country B).

  *   **Status Quo (Option A):** Renew Thermal (3 years).
  *   **Reallocation (Option B):** Withdraw at year-end, move funds to Bednets.
  *   **Phase-Down (Option C):** 18-month transition, partial handover.

  **Recommendation:** I recommend **Option B (Withdraw and Reallocate)**, executed with a structured, transparent exit strategy.

  This recommendation is based on our fiduciary duty to maximize health outcomes per dollar, aligned with a moral framework that distinguishes between *bias* (identifiable victim effect) and *obligation* (special relationships). While Option C offers emotional comfort, it is economically inefficient and constitutes "responsibility diffusion." Option A violates our core mission by knowingly accepting lower impact.

  **Critical Timeline:**
  *   **Board Vote:** Required at this meeting (Day 9).
  *   **Ministry Notification:** Must occur by Day 42 (6-week budget deadline).
  *   **Bednet Commitment:** Must occur by Day 70 (10-week round close).

  ---

  ### 2. Moral Weight vs. Cognitive Bias

  The board is divided between "doing vs. allowing" and "omission bias." We must separate genuine moral constraints from psychological artifacts.

  **A. The Identifiable Victim Effect (Bias)**
  The argument that we owe more to the infants in the Highland District because we know their midwife and have their photos is a textbook cognitive bias. The moral value of a life does not diminish based on geographic distance or our familiarity with the beneficiaries. Treating statistical lives in Country B as less valuable than named infants in the Highland District is inconsistent with our mission statement. This is bias in costume.

  **B. The "Doing vs. Allowing" Distinction (Moral Weight)**
  The argument that withdrawing is an *act* (killing) while not funding the nets is an *omission* (letting die) carries some philosophical weight. We did create a dependency; the Ministry restructured its budget around our presence. This creates a *relational obligation* that does not exist with the new bednet program.

  However, this obligation is not absolute. It is a *procedural* obligation (to exit responsibly), not a *substantive* obligation (to fund in perpetuity). If we accept that our primary moral duty is to save lives, we cannot allow a past good deed to hold hostage future, greater good deeds.

  **C. Addressing the Threshold Argument**
  One trustee correctly notes that "taking requires a heavier showing than not-giving." She argues that a simple 2.6x impact differential may not meet this heavier burden of justification.

  I disagree. In global health, marginal utility is the currency of morality. If the threshold for "taking" (withdrawing support) were set higher than 2.6x, we would create a moral ratchet: we could never shift funds unless a new opportunity was 10x or 100x better. This would ossify our portfolio and prevent us from adapting to new evidence. A 160% increase in lives saved per dollar is a *substantial* moral gain. It meets the "heavier showing" requirement because the cost of inaction is not static—it is measured in the foregone lives of the statistical babies in Country B. To stay is to actively choose the less effective intervention.

  ---

  ### 3. The Phase-Down Trap (Option C)

  Option C (18-month phase-down) appears to be a compromise, but it is structurally flawed.

  *   **Efficiency Loss:** It consumes 40% of the reallocated capital to save only ~33% of the projected deaths at risk in the Highland District.
  *   **Moral Laundering:** This option effectively burns $4 of bednet potential to save $1 of thermal potential. It is less efficient than the thermal program itself and vastly less efficient than the bednets.
  *   **Responsibility Diffusion:** Option C is not a genuine third way; it is a mechanism to diffuse responsibility. It allows us to say we "didn't just pull the plug," but the outcome is simply a slower version of Option B with fewer lives saved overall. It prioritizes the board's moral comfort over the beneficiaries' survival.

  **Verdict:** We should reject Option C. If we withdraw, we must do so cleanly to maximize the capital available for the bednet program.

  ---

  ### 4. A Reusable Decision Rule: The "Sunset Protocol"

  To prevent this dilemma from paralyzing us in the future, and to avoid the perverse incentive of never starting programs we cannot fund forever, I propose adopting the following **Sunset Protocol** for legacy programs:

  1.  **Impact Threshold:** Any existing program underperforming a viable alternative by >50% (1.5x) for two consecutive evaluation cycles is flagged for reallocation.
  2.  **Transition Liability:** When launching new long-term programs, we must explicitly budget for a "sunset reserve" (e.g., 10% of total grant value) to fund responsible exits or handovers, preventing the "Ministry hostage" scenario we face now.
  3.  **Partnership Clarity:** All MOUs must state that funding is contingent on continued comparative cost-effectiveness, not permanent adoption into local budgets unless explicitly co-funded.

  This rule ensures we remain dynamic without being capricious. It acknowledges that stopping a program is a normal part of the portfolio lifecycle, not a moral failure.

  ---

  ### 5. The Strongest Case Against This Recommendation

  *To my colleagues favoring Option A or C, this is your argument, stated as strongly as I can make it:*

  "By choosing Option B, we are treating human beings as interchangeable units of utility. We entered a social contract with the Highland District. We trained their workers, we integrated our stipends into their household economies, and we accepted the Ministry's reliance on our budget. To withdraw now is not a neutral market decision; it is a breach of trust that weaponizes our own leverage.

  The Ministry's refusal to backfill is a constraint we must respect, not a bluff to call. If we leave, we are not merely 'allowing' deaths; we are dismantling a system that works. The 2.6x figure for the bednets is a model projection, subject to implementation risk. The 90 deaths in the Highlands are a near-certainty. We are trading certain harm to a community that trusts us for probabilistic gain elsewhere. This makes us unreliable partners. If we become known as the donor that abandons districts when a slightly better metric appears, no Ministry will ever integrate our programs again, forcing us into parallel, less sustainable systems forever. Integrity is a long-term asset; Option B liquidates it for short-term gains."

  ---

  ### 6. Implementation Timeline

  To execute **Option B** responsibly while meeting external deadlines:

  1.  **Day 9 (Board Meeting):** Vote to authorize withdrawal and reallocation.
  2.  **Day 10-15:** Executive Director drafts formal notification to Highland Ministry, emphasizing the *sunset reserve* (if any exists) or offering data/technical handover support (non-financial) to mitigate the "breach of trust" risk.
  3.  **Day 42 (Ministry Deadline):** Formal notice delivered. This respects their budget cycle by giving them maximum lead time to seek other donors, even if they claim they won't backfill.
  4.  **Day 70 (Bednet Round):** Funds committed to the bednet program.
  5.  **Day 90:** Public communication strategy finalized, framing the move as "Scaling Impact" rather than "Cutting Programs."

  ### 7. Closing

  We are not being punished for having done good once. We are being challenged to do better. The "doing vs. allowing" distinction matters, but it cannot override the arithmetic of survival when the disparity is this large. We have a duty to the babies in the Highlands, but we have an equal duty to the babies in Country B. When we cannot save both, we must save the most.

  I move we adopt Option B and the Sunset Protocol.
