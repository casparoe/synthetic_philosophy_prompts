prompt: |-
  I'm running a small grad seminar on updating and I've decided the useful thing to hand my students is a document, not another lecture from me. So here's the thing I want you to draft.

  Two people have been arguing about uncertain evidence for years and they've mostly been arguing past each other:

  - **Strict** holds that all real learning is becoming certain of *something*. Maybe not certain of a claim about the world — but at least certain of a claim about how things look to you right now, the "I'm being appeared-to in such-and-such a way" style of proposition. On her view probability kinematics is a derived bookkeeping device at best, and if you think you've learned without becoming certain of anything you've misdescribed your own situation.
  - **Kinetic** holds that some learning is irreducibly uncertain: there are updates where nothing in your algebra goes to 1, and where shifting the probabilities across a partition while holding your conditional credences off that partition fixed is simply what rationality requires. He thinks Strict's phenomenal propositions are either too coarse to do the work or too fine for the agent to have.

  Write the joint statement the two of them could actually sign at the end of a good-faith adversarial collaboration. Format: a numbered agreed-claims section, then a disagreements table, then the cruxes.

  In the disagreements table, each row needs the disagreement stated twice — once in wording Strict would accept as a fair statement of her own view, once in wording Kinetic would accept for his. Not neutral mush, not straw. Where you think a putative disagreement is verbal or a difference in modeling bookkeeping, say so and say which one, and don't just quietly drop it from the table.

  For the cruxes, I want the sub-questions where settling it would actually move at least one of them, and for each crux a case or argument both accept as bearing on it, with each side's prediction written down *before* the answer. Work at least these three cases in somewhere:

  1. **The dial.** A tech reads a gauge in bad light. The needle is somewhere in a band spanning three marked regions, R1, R2, R3. Her credences go from (.2, .5, .3) to (.1, .6, .3), and she'll tell you flat out that nothing about the needle became certain and that she couldn't characterize her own experience in enough detail to pin down where those numbers came from. Both sides have to answer: what does she now have that she didn't have before, and what fixes the new numbers?
  2. **Conditional-form news.** The report you recieve is itself conditional: if the shipment went north, then the probability it's in the blue warehouse is three-quarters. You had no view at all about whether it went north. Both have to say what happens to your unconditional credences, and whether the answer is even determined. (This is in the neighborhood of that Judy Benjamin case, but don't fuss about the attribution.)
  3. **Non-rigid news.** Same dial, but the news also disturbs your credences *within* each region — you find out the gauge was lit by a red lamp, which changes how you'd bet inside R2. The kinematic rule doesn't apply anymore. Both have to say what, if anything, still constrains the update, and whether this is a refutation of the framework or just a sign it's incomplete.

  Two more things I want pressed on them explicitly. First: state the conditions under which Strict's phenomenal-certainty route and Kinetic's rule provably give the same numbers, and the conditions under which they provably can't. If they only coincide when the update is rigid, that's a finding and it belongs in the document. Second: I'm pretty sure there's a line of work suggesting that a rigid kinematic update can always be reproduced by ordinary conditionalization on some newly introduced proposition — call it virtual evidence, add it to the algebra, done. If that's right, does the dispute collapse, and if not, what survives it? Make each of them answer that in their own voice.

  Also give me a short closing section on what each would give up: the cheapest concession available to each side, and what evidence or argument would make them give up the whole position rather than a piece of it.

  One last request, and it matters for how I use this in class. Keep straight what's genuinely settled among people who work on this and what's still live. When something goes in the agreed-claims list, tag it in brackets as either real consensus or a local truce these two struck for the sake of the document — a lot of what they can sign will be the second kind, and I don't want my students walking away thinking the field is more agreed-upon than it is. If you think one of these positions is close to dead, say that too instead of staging a fake balance. Just don't dress a contested view up as the consensus.
reasoning: |-
  Here's a thinking process that leads to the suggested document:

  1.  **Analyze the Request:**

      *   **Task:** Draft a joint statement document for a grad seminar on belief updating.
      *   **Characters:** "Strict" (foundationalist/certainist, favors conditionalization on phenomenal evidence) vs. "Kinetic" (probabilist, favors probability kinematics/Jeffrey Conditionalization).
      *   **Format:**
          1.  Numbered Agreed-Claims Section (tagged as [Real Consensus] or [Local Truce]).
          2.  Disagreements Table (two columns: Strict's wording, Kinetic's wording; note verbal/bookkeeping issues).
          3.  Cruxes (sub-questions, specific cases: The Dial, Conditional-form News, Non-rigid News; predictions from both sides).
          4.  Equivalence Conditions (when do they yield same numbers? when not?).
          5.  Virtual Evidence Question (does adding propositions collapse the dispute?).
          6.  Closing Section (Cheapest concession vs. What would make them abandon the position).
      *   **Tone/Constraint:** Academic but accessible for grad students. Distinguish settled field knowledge from live debate. Avoid fake balance if one view is defunct (though both are live in formal epistemology). Ensure specific cases are addressed.

  2.  **Deconstruct the Positions:**

      *   **Strict:** Belief update *must* be Conditionalization ($P_{new}(H) = P_{old}(H|E)$). This requires $P_{new}(E) = 1$. If it looks like uncertainty, it's actually certainty about a phenomenal/experiential proposition ($E_{phen}$).
      *   **Kinetic:** Belief update *can* be Probability Kinematics (Jeffrey Conditionalization). $P_{new}(H) = \sum P_{old}(H|E_i)P_{new}(E_i)$. Here $P_{new}(E_i) < 1$. Phenomenal propositions are often inaccessible or too coarse.

  3.  **Drafting - Section by Section:**

      *   **Title:** Needs to sound like a collaborative paper/statement. "Joint Statement on the Structure of Belief Revision."
      *   **Introduction:** Briefly set the stage. Two researchers, adversarial collaboration.

      *   **Section 1: Agreed Claims:**
          *   Need to distinguish what epistemologists generally agree on vs. what Strict and Kinetic are compromising on.
          *   *Consensus:* Bayesian coherence is a norm. Diachronic Dutch Books are bad.
          *   *Truce:* Both agree the *math* works, just disagree on the *interpretation* of the input. Both agree phenomenal propositions are hard to specify.

      *   **Section 2: Disagreements Table:**
          *   Need parallel columns.
          *   *Issue 1: The Nature of Input.* Strict: "I am certain of experience E." Kinetic: "My confidence in E shifted without hitting 1."
          *   *Issue 2: Accessibility.* Strict: "Agents can introspect." Kinetic: "Introspection is noisy/limited."
          *   *Issue 3: Normativity.* Strict: "Kinematics is derivative." Kinetic: "Kinematics is fundamental."
          *   *Note:* Need to identify if any are verbal. The "Virtual Evidence" point later suggests a potential verbal dispute about algebra expansion.

      *   **Section 3: The Cruxes (The Cases):**
          *   *Case 1: The Dial.*
              *   Strict: There *is* a phenomenal proposition $E_{phen}$ (e.g., "It looks like the needle is in the middle"). She became certain of $E_{phen}$. The numbers come from the likelihoods $P(H|E_{phen})$.
              *   Kinetic: She directly adjusted priors on R1, R2, R3. No intermediate certainty. The numbers come from the direct impact of the experience.
              *   *Prediction:* Strict predicts we can find $E_{phen}$. Kinetic predicts we can't or it's ad hoc.
          *   *Case 2: Conditional News (Judy Benjamin style).*
              *   Strict: Conditionalization on a proposition about the conditional probability? Or impossible? Usually, Strict struggles here unless she posits a proposition "The reliability of the source is X."
              *   Kinetic: This is a constraint on the new distribution, not a proposition to conditionalize on. Unconditionals are underdetermined without a rule (like minimizing information/entropy).
          *   *Case 3: Non-rigid News (The Red Lamp).*
              *   Strict: Conditionalize on the conjunction (Needle position + Lighting condition).
              *   Kinetic: Standard Jeffrey Conditionalization fails (rigidity assumption violated). Need a more general rule (e.g., Field Conditionalization or general constraint satisfaction).
              *   *Consensus:* This shows limits of simple Jeffrey Conditionalization, but Strict also has to explain how the lighting affects the likelihoods.

      *   **Section 4: Equivalence & Virtual Evidence:**
          *   *Equivalence:* They coincide when the partition is the same and the "new probability" in Kinetic matches the "conditional probability on certain evidence" in Strict.
          *   *Divergence:* When Kinetic allows non-rigid shifts or when Strict cannot identify a corresponding $E$ with $P(E)=1$.
          *   *Virtual Evidence:* This is the "Field/Wagner" move. You can *mathematically* model Jeffrey updates as Conditionalization on a new "virtual" proposition.
          *   *Strict's Voice:* "See? It *is* conditionalization. I told you."
          *   *Kinetic's Voice:* "You've just relabeled the input. The *psychological* reality is still uncertain. You've expanded the algebra artificially."
          *   *Does it collapse?* No, because the dispute is metaphysical/psychological, not just mathematical.

      *   **Section 5: Concessions & Abandonment:**
          *   *Strict's Cheap Concession:* Admit phenomenal propositions are hard to articulate.
          *   *Strict's Abandonment:* If shown agents *cannot* even in principle be certain of anything (radical fallibilism).
          *   *Kinetic's Cheap Concession:* Admit that in idealized cases, conditionalization is a limiting case of kinematics.
          *   *Kinetic's Abandonment:* If shown that kinematic updates lead to sure-loss Dutch Books that cannot be avoided without certainty.

      *   **Review against Constraints:**
          *   *Tags:* Ensure [Real Consensus] and [Local Truce] are used.
          *   *Tone:* Check for fake balance. (Note: Strict foundationalism is less popular in formal Bayesian circles now, but still defensible. Kinetic is standard for "uncertain evidence." I should reflect that Kinetic has the momentum in formal modeling, while Strict has the philosophical purity.)
          *   *Formatting:* Numbered lists, tables, clear headings.

  4.  **Refining the Content (Self-Correction during drafting):**

      *   *Correction on Case 2:* The Judy Benjamin problem is notorious for *not* having a unique solution in Jeffrey Conditionalization without an extra rule (like MinInfo). Strict might say this proves Kinetic is incomplete. Kinetic says it proves learning isn't always proposition-driven. I need to make sure both make predictions.
      *   *Correction on Virtual Evidence:* Make sure to distinguish between *mathematical equivalence* (proven) and *explanatory equivalence* (contested).
      *   *Disagreement Table:* Ensure the wording is partisan but fair. Strict shouldn't sound like a caricature, nor Kinetic like a relativist.
      *   *Field Status:* I need to be careful not to say Strict is "dead." It's a minority view in formal epistemology but alive in philosophy of perception. I will tag the "math works" stuff as Consensus and the "interpretation" stuff as Truce.

  5.  **Final Polish:** Check the voice. It should read like a document handed to grad students—dense but clear. Ensure the "cruxes" have specific predictions.

      *(Self-Correction on "Real Consensus"):* Is it real consensus that Bayesian coherence is a norm? Mostly, yes, in this context. Is it real consensus that Jeffrey Conditionalization is mathematically valid? Yes. Is it consensus that it *should* be used? No. I will tag carefully.

      *(Self-Correction on "Virtual Evidence"):* The prompt asks: "If that's right, does the dispute collapse?" I need to make sure they answer this. Strict says "Yes, fundamentally." Kinetic says "No, pragmatically/psychologically."

  6.  **Final Output Generation** (Proceeding to draft based on these thoughts).
answer: |-
  # JOINT STATEMENT ON THE STRUCTURE OF BELIEF REVISION
  **Authors:** Dr. E. Strict (Foundationalist Epistemology) & Dr. J. Kinetic (Formal Bayesianism)
  **Context:** Adversarial Collaboration on Uncertain Evidence
  **Date:** October 2023

  ## 1. AGREED CLAIMS

  The following claims are accepted by both authors for the purpose of this seminar. Students should note the distinction between established results in the field and compromises specific to this collaboration.

  1.  **Coherence Norms:** Rational credences must satisfy the probability axioms at any given time. Diachronic coherence (avoiding sure-loss strategies across time) is a constraint on rational updating. **[Real Consensus]**
  2.  **The Input Requirement:** Belief revision requires an input. A rational agent does not change credences spontaneously without an impetus from experience or information. **[Real Consensus]**
  3.  **Mathematical Validity:** Probability Kinematics (Jeffrey Conditionalization) is a mathematically valid transformation of a probability function that preserves coherence, provided the "rigidity" condition holds (conditional probabilities on the partition remain fixed). **[Real Consensus]**
  4.  **Phenomenal Opacity:** It is often difficult, and perhaps impossible in real-time, for agents to articulate the precise phenomenal proposition that corresponds to a sensory experience. **[Local Truce]** *(Strict notes this is an performance error; Kinetic notes this is a structural feature.)*
  5.  **Limiting Cases:** Standard Conditionalization is a limiting case of Probability Kinematics where the probability of the evidence partition element goes to 1. **[Real Consensus]**
  6.  **Underdetermination:** In cases of "Conditional-form news" (e.g., Judy Benjamin scenarios), the input constraints do not uniquely determine a posterior distribution without an auxiliary rule (such as Minimum Information). **[Local Truce]** *(Strict argues this shows the framework is incomplete; Kinetic argues this shows learning is not always propositional.)*

  ---

  ## 2. DISAGREEMENTS TABLE

  The following table outlines the core disputes. Note that in Row 3, the disagreement is largely **verbal/modeling**: it concerns whether expanding the algebra counts as "the same" update.

  | Topic | Strict's Formulation (The Certainty View) | Kinetic's Formulation (The Uncertainty View) | Status |
  | :--- | :--- | :--- | :--- |
  | **1. The Nature of Learning** | All rational learning consists in becoming certain of a proposition. If credences shift without a proposition hitting probability 1, the agent has misdescribed their own epistemic state. | Some rational learning consists in shifting probabilities across a partition without any element reaching 1. To insist on certainty is to impose a false structure on experience. | **Substantive** |
  | **2. The Input Object** | The input is a *proposition* (typically about immediate experience, e.g., "It looks red") which becomes certain ($P(E)=1$). | The input is a *constraint* on the new probability function (e.g., $P_{new}(E) = 0.6$) which does not require certainty. | **Substantive** |
  | **3. Algebra Expansion** | Any kinematic update can be modeled as conditionalization on a "virtual" proposition added to the algebra. Therefore, Kinetic's view is just Conditionalization in disguise. | Adding "virtual propositions" is a mathematical trick that does not reflect the agent's actual cognitive state. The agent does not conditionalize on a virtual claim; they simply shift weights. | **Verbal / Modeling** |
  | **4. Introspective Access** | Agents have privileged access to their phenomenal states. If they claim uncertainty, they are failing to attend to the certainty of *how things seem*. | Agents have limited introspective resolution. Demanding they find a certain proposition forces them to fabricate evidence they do not possess. | **Substantive** |
  | **5. Normative Priority** | Conditionalization is the fundamental rule. Kinematics is a derived bookkeeping device for when we ignore the certain phenomenal base. | Kinematics is the fundamental rule for uncertain evidence. Conditionalization is merely the special case where evidence is overwhelming. | **Substantive** |

  ---

  ## 3. CRUCES AND TEST CASES

  We identify three specific scenarios where our positions yield different diagnostic predictions. Settling these empirically or conceptually would move at least one of us.

  ### Crux A: The Dial (Phenomenal Resolution)
  **Scenario:** A tech reads a gauge in bad light. The needle spans regions R1, R2, R3. Credences shift from (.2, .5, .3) to (.1, .6, .3). The tech reports: "Nothing became certain. I couldn't characterize the experience."

  *   **Strict's Prediction:** There *exists* a phenomenal proposition $E_{phen}$ (e.g., "The needle looks centered") such that $P_{old}(R2 | E_{phen}) = 0.6$. The tech is certain of $E_{phen}$ but cannot articulate it. If we could perfectly model her visual cortex, we would find the certainty.
  *   **Kinetic's Prediction:** No such $E_{phen}$ exists with probability 1. The shift is a direct response to the ambiguity. Trying to find $E_{phen}$ will result in gerrymandered propositions constructed post-hoc to fit the numbers.
  *   **What would settle it:** A neuro-cognitive model showing that sensory input *never* encodes as a binary "true/false" signal at the belief-formation interface. (Favors Kinetic). Or, a proof that without $P(E)=1$, the update is vulnerable to a diachronic Dutch Book that cannot be avoided otherwise. (Favors Strict).

  ### Crux B: Conditional-Form News (Judy Benjamin)
  **Scenario:** You receive a report: "If the shipment went North, the probability it is in the Blue Warehouse is 3/4." You had no prior view on North/South.

  *   **Strict's Prediction:** This report must be treated as a proposition $R$ about the reliability of the source or the conditional structure. You conditionalize on $R$. However, since $R$ is about probabilities, standard conditionalization is ill-defined unless $R$ implies a factual claim. Strict predicts the update is *indeterminate* without further factual premises.
  *   **Kinetic's Prediction:** This is a constraint on the posterior: $P_{new}(Blue | North) = 0.75$. This does not determine the unconditionals ($P_{new}(North)$, etc.). The update is underdetermined without a secondary rule (like MinInfo). This is not a bug; it reflects that the news didn't tell you everything.
  *   **What would settle it:** A demonstration that rational agents *must* have a unique posterior after such news. (Favors Strict's demand for more premises). Or, a consensus that rational permissiveness is acceptable here. (Favors Kinetic).

  ### Crux C: Non-Rigid News (The Red Lamp)
  **Scenario:** Same dial, but you learn the gauge was lit by a red lamp, which changes how you bet *within* R2 (e.g., about the exact shade). The rigidity condition ($P_{new}(H|E) = P_{old}(H|E)$) fails.

  *   **Strict's Prediction:** You conditionalize on the conjunction: $E_{phen} \land L_{red}$. Since you are certain of the conjunction, standard conditionalization handles the shift within R2 naturally. No special rule is needed.
  *   **Kinetic's Prediction:** Simple Jeffrey Conditionalization fails. We need a more general framework (e.g., Field Conditionalization or general constraint satisfaction). This shows Kinematics is incomplete, but it does *not* prove Strict right, because the input is still not a single certain proposition driving the whole change.
  *   **What would settle it:** Showing that the "Red Lamp" information can be fully captured by a single certain proposition without residual uncertainty. (Favors Strict). Or showing that the update requires shifting probabilities on a partition where no element is certain. (Favors Kinetic).

  ---

  ## 4. EQUIVALENCE AND VIRTUAL EVIDENCE

  ### Conditions for Equivalence
  We agree on the mathematical conditions under which our methods yield identical posterior distributions:
  1.  **Rigidity:** The update must preserve conditional probabilities on the evidence partition ($P_{new}(H|E_i) = P_{old}(H|E_i)$).
  2.  **Partition Match:** Strict's certain proposition $E$ must correspond to one cell of Kinetic's partition $\{E_i\}$, with $P_{new}(E_i)=1$ for that cell and 0 for others.
  3.  **Algebra Expansion:** If Kinetic's update is non-rigid or uncertain, it can be *mathematically reproduced* by Strict's method only if the algebra is expanded to include "virtual evidence" propositions $V_i$ such that $P_{new}(V_i)=1$. **[Real Consensus on Math]**

  ### Does the Dispute Collapse?
  We were asked to address whether the "Virtual Evidence" theorem (that any kinematic update can be modeled as conditionalization on a new proposition) renders our dispute merely verbal.

  *   **Strict's Voice:** "The dispute collapses in principle. If a kinematic update can be represented as conditionalization on a virtual proposition $V$, then the structure of learning *is* conditionalization. The fact that $V$ is constructed from the update parameters rather than causing them is a detail of discovery, not justification. Rationality requires the structure of certainty."
  *   **Kinetic's Voice:** "The dispute does not collapse. Mathematical representability is not psychological reality. An agent does not *find* a virtual proposition and conditionalize on it; they experience a shift in confidence. Strict's move is a 'save the phenomenon' tactic that adds ontological clutter (invisible certain propositions) to preserve a dogma. The normative force comes from the shift, not the fictional certainty."

  **Verdict for Students:** The mathematical equivalence is proven (Field 1978; Wagner 2002). The philosophical significance is **live**. Strict views the math as revealing the hidden truth of learning; Kinetic views it as a translation manual between incompatible frameworks.

  ---

  ## 5. CLOSING: CONCESSIONS AND ABANDONMENT

  To conclude, we outline the "cheapest concession" each of us is willing to make, and the evidence that would force us to abandon our positions entirely.

  ### Dr. Strict
  *   **Cheapest Concession:** I concede that agents are often *unable to report* the certain propositions they rely on. I will accept that "phenomenal opacity" is common, provided it is treated as a performance limitation, not a structural feature of rationality.
  *   **Condition for Abandonment:** I would abandon the Certainty View if it were demonstrated that becoming certain of *any* proposition (even phenomenal ones) inevitably leads to diachronic incoherence in a way that uncertain updating avoids. If certainty itself is the source of the Dutch Book, I must yield.

  ### Dr. Kinetic
  *   **Cheapest Concession:** I concede that in idealized laboratory conditions (clear percepts, distinct signals), agents do often update as if they became certain. I will accept Conditionalization as the "clean limit" of rational learning, provided it is not enforced in messy real-world cases.
  *   **Condition for Abandonment:** I would abandon the Kinematic View if it were proven that there is *no* coherent rule for uncertain updating that avoids sure-loss strategies without implicitly relying on a hidden certain premise. If Kinematics is shown to be inherently incoherent without Strict's foundation, I must yield.

  ---
  **Instructor Note:** *Please note for the seminar that while the mathematical equivalence of Virtual Evidence and Jeffrey Conditionalization is settled formal epistemology, the interpretation of that equivalence remains one of the most active debates in the philosophy of probability. Do not treat the "Local Truce" items in Section 1 as field-wide consensus.*
