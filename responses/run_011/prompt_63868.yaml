answer: |-
  # The "What's Your Epistemology?" Vignette Quiz

  **Instructions:** Read each scenario. Pick the option that matches your gut reaction. Don't overthink it, and don't try to guess what a "philosopher" would say.

  ### 1. The New Color
  You are showing a friend a specific, rare shade of teal. Your friend has never seen this color before and doesn't have a name for it. When they look at it, what is happening in their mind?
  *   **A.** They just see a patch of visual data. They don't really *know* it's "teal" until they learn the category and the name.
  *   **B.** They immediately know it as that specific color. The understanding happens in the very first instant of seeing, before any words are involved.

  ### 2. The Text Message
  You get a text from a number you don't recognize saying, "The seminar room has changed to 304." You have no reason to think they are lying, but you also don't know who they are. Do you head to 304 immediately?
  *   **A.** Yes. The message counts as trustworthy information unless I have a specific reason to doubt it. The burden of proof is on the doubt.
  *   **B.** No. I need to verify the source or check the schedule first. The message is just a claim until I have proof the sender is reliable.

  ### 3. The Empty Chair
  You walk into the office and look at your desk. Your mug is not there. You say, "I know the mug is missing." How do you know that?
  *   **A.** I see the empty space. The "missing-ness" is a real thing I am perceiving directly.
  *   **B.** I just don't see the mug. "Missing" isn't a thing I see; it's just a conclusion I draw from not seeing the object.

  ### 4. The Lookalike
  You learn what a "jackal" is by being told, "It's like a dog, but smaller and wilder." Later, you go to the forest and see one. When you recognize it, is that a new kind of knowing, or just remembering what you were told?
  *   **A.** It's a distinct kind of knowledge. Connecting the description to the live animal is a unique mental act that isn't just memory or inference.
  *   **B.** It's just inference or memory. You're just matching features you already know about. There's no special "recognition" power needed.

  ### 5. The Mystery Weight Gain
  Your roommate claims they never eat out and cook nothing at home, yet they are steadily gaining weight. You conclude they must be eating secretly elsewhere. Is this conclusion a standard guess, or something stronger?
  *   **A.** It's a standard guess (inference). You have a fact (weight gain) and you infer the cause (secret eating) like solving a puzzle.
  *   **B.** It's a special kind of certainty. It's not just a guess; it's the only way to make sense of the conflicting facts, and that "making sense" is its own source of truth.

  ### 6. The Pain in the Room
  You walk in and see someone grimacing and clutching their knee. Do you *know* they are in pain, or do you just *infer* it?
  *   **A.** I infer it. I see the behavior and guess the internal state. I can't directly perceive another person's pain.
  *   **B.** I know it directly. Under the right conditions, a knower can grasp the state of another being without needing a logical deduction.

  ### 7. The Double Check
  You see that it is raining outside. Then, a friend walks in and says, "It is raining." Do you now possess two distinct pieces of knowledge about the rain, or just one?
  *   **A.** Just one. The fact is the same, so the knowledge is the same. The second source just confirms the first.
  *   **B.** Two distinct pieces. The seeing is one mental event, and the hearing is another mental event. Each is a separate instance of knowing, even if the fact is the same.

  ***

  # Scoring Key & Logical Space

  **How to Score:**
  Tally your answers. There is no point system. Your pattern of choices maps to a "Leaf" (a philosophical position).

  | Question | Option A leans toward... | Option B leans toward... |
  | :--- | :--- | :--- |
  | **1 (Concepts)** | Concepts required for knowledge (Buddhist/Nyāya) | Raw perception is knowledge (Mīmāṃsā/Realist) |
  | **2 (Testimony)** | Extrinsic Validity (Nyāya/Buddhist) | Intrinsic Validity (Mīmāṃsā) |
  | **3 (Absence)** | Absence is not a separate source (Nyāya/Buddhist) | Absence is a separate source (Kumārila/Advaita) |
  | **4 (Comparison)** | Reductionist (Buddhist/Reductionist) | Distinct Source (Nyāya/Mīmāṃsā) |
  | **5 (Postulation)** | Reductionist (Nyāya/Buddhist) | Distinct Source (Mīmāṃsā) |
  | **6 (Other Minds)** | Empiricist (Most schools) | Capacity-Based (Jain/Some Realists) |
  | **7 (Counting)** | Object-Focused (Prabhākara/Kumārila) | Episode-Focused (Nyāya/Buddhist) |

  ### The Leaves (Position Mapping)

  **1. The One-Source Materialist (Cārvāka)**
  *   **Pattern:** Q1(A), Q2(B), Q3(B), Q4(B), Q5(A), Q6(A), Q7(A).
  *   **Key Trait:** You only trust what you can physically touch or see. Everything else is guesswork.
  *   **Awkward Commitment:** You have to explain how you know about history, love, or gravity without directly seeing them.

  **2. The Two-Source Pragmatist (Buddhist Epistemologist)**
  *   **Pattern:** Q1(A), Q2(B), Q3(B), Q4(B), Q5(A), Q6(A), Q7(B).
  *   **Key Trait:** You accept Perception and Inference. Testimony is just Inference from a speaker. Absence is just not seeing.
  *   **Awkward Commitment:** You have to treat a holy text or a friend's warning as merely a probabilistic guess until verified.

  **3. The Four-Source Realist (Nyāya)**
  *   **Pattern:** Q1(A), Q2(B), Q3(B), Q4(A), Q5(A), Q6(A), Q7(B).
  *   **Key Trait:** You trust Perception, Inference, Testimony, and Comparison. You demand verification for testimony but accept Comparison as unique.
  *   **Awkward Commitment:** You must defend why "Comparison" is a separate tool from "Inference," which looks very similar.
  *   **User Calibration:** Based on your provisional answers (Testimony counts, Postulation=Inference, Absence≠Source), you land here **provided** you accept Comparison (Q4-A) and reject Memory as fresh knowledge (Q7-A/B nuance). *Note: Your stance on Q7 determines if you are Nyāya or Prabhākara.*

  **4. The Five-Source Integralist (Prabhākara Mīmāṃsā)**
  *   **Pattern:** Q1(B), Q2(A), Q3(B), Q4(A), Q5(A), Q6(A), Q7(A).
  *   **Key Trait:** You accept Perception, Inference, Testimony, Comparison, and Recognition (Memory). You reject Absence and Postulation as separate.
  *   **Awkward Commitment:** You have to argue that remembering something you already knew counts as *new* knowledge.

  **5. The Six-Source Maximalist (Kumārila Mīmāṃsā / Advaita)**
  *   **Pattern:** Q1(B), Q2(A), Q3(A), Q4(A), Q5(B), Q6(A), Q7(A).
  *   **Key Trait:** You accept everything: Perception, Inference, Testimony, Comparison, Postulation, and Absence.
  *   **Awkward Commitment:** You must explain what "Absence" looks like. If you see an empty table, you are perceiving a positive "nothingness," not just a lack of things.

  **6. The Reductionist Leaf (Modern/Analytic)**
  *   **Pattern:** Q1(A), Q2(B), Q3(B), Q4(B), Q5(A), Q6(A), Q7(A).
  *   **Key Trait:** Similar to the Buddhist view but without the metaphysical baggage. You collapse Testimony, Comparison, and Postulation into Inference.
  *   **Awkward Commitment:** You struggle to explain why testimony *feels* different than guessing, even if logically it's the same.

  **7. The Capacity-Based Knower (Jain)**
  *   **Pattern:** Q1(B), Q2(A), Q3(A), Q4(A), Q5(B), Q6(B), Q7(A).
  *   **Key Trait:** Knowledge is defined by the soul's capacity to clear away obstructions. Direct knowledge of other minds or distant objects is possible in principle.
  *   **Awkward Commitment:** *Disclaimer:* This quiz forces Jainism into a "counting" framework it often rejects. Jains focus on *standpoints* (nayas) rather than just source counting. This leaf is a "best fit" approximation.
  *   **Awkward Commitment:** You have to defend the possibility of omniscience or direct empathy without sensory organs, which sounds mystical to the other participants.

  ***

  # Analysis of the Instrument

  ### Empty Regions (Unoccupied Logical Space)
  There are $2^7 = 128$ possible answer patterns. Most are philosophical nonsense. Here are the most interesting "ghost" patterns that no historical school occupies:

  1.  **The "Absence Only" Skeptic:** Accepts Absence as a source (Q3-A) but rejects Inference (Q5-A/B mismatch) and Perception (Q1-A).
      *   *Diagnosis:* **Incoherent.** You cannot know something is "missing" if you don't first know what "being there" looks like via perception.
  2.  **The "Postulation Without Inference" Believer:** Accepts Postulation as distinct (Q5-B) but thinks standard Inference is invalid.
      *   *Diagnosis:* **Unattractive.** Postulation is essentially a complex form of inference. Accepting the complex version while rejecting the basic version is logically unstable.
  3.  **The "Testimony Isolationist":** Accepts Testimony (Q2-A) but rejects Inference (Q5-A).
      *   *Diagnosis:* **Unexplored.** Historically, if you trust words, you trust the logic connecting those words. No school isolates testimony from inference entirely. This might be worth exploring for a theology-focused epistemology.

  ### Indistinguishable Leaves (Where the Quiz Fails)
  **Nyāya vs. Kumārila Mīmāṃsā:**
  *   **The Problem:** On many practical cases (keys on the table, stranger on the train), a Nyāya follower and a Kumārila follower will give the same *practical* advice, even if their *ontological* reasons differ. Nyāya says you "perceive" the absence; Kumārila says you "know" the absence via a separate source. In a vignette, "I know it's not there" sounds the same for both.
  *   **The Fix:** Question 3 is designed to split them, but it relies on the participant introspecting on *how* they know, not just *that* they know. If they answer based on outcome rather than process, these two leaves merge.
  *   **Extra Question Needed:** "When you see the empty table, is your mind grasping the table, or is it grasping the 'no-table'?" (Nyāya: Mind grasps table-locus and notes absence. Kumārila: Mind grasps 'absence' as an object).

  **Jain Limitations:**
  *   **The Problem:** As noted in the Leaf description, Jain epistemology is not primarily about counting *pramāṇas* in the same way. It is about the *degrees* of knowledge clearance.
  *   **Honesty Check:** This quiz cannot fully separate a Jain from a Kumārila Mīmāṃsāka because both accept a wide range of sources. The only divider is Q6 (Other Minds/Non-sensory). If a Kumārila follower is open to yogic perception, they might tick Q6-B as well.
  *   **Verdict:** Do not use this quiz to definitively identify a Jain position. Use it only to flag someone interested in "knower-capacity" vs. "object-type."

  ### Question Ranking (Sorting Power)
  1.  **Q5 (Postulation):** Highest sorting power. This is the main wedge between the 4-source schools (Nyāya/Buddhist) and the 6-source schools (Mīmāṃsā/Advaita).
  2.  **Q3 (Absence):** Second highest. Separates the Maximalists (Kumārila) from everyone else.
  3.  **Q2 (Testimony Validity):** Critical for separating Mīmāṃsā (Intrinsic Validity) from Nyāya/Buddhist (Extrinsic Validity).
  4.  **Q1 (Concepts):** Separates the Constructivists (Buddhist) from the Realists (Nyāya/Mīmāṃsā).
  5.  **Q4 (Comparison):** Moderate. Separates Reductionists from Traditionalists.
  6.  **Q7 (Counting):** Low/Moderate. Mostly distinguishes Nyāya from Prabhākara on memory/redundancy.
  7.  **Q6 (Other Minds):** Low. Most schools answer (A). Only Jains or specific mystics answer (B). Near-degenerate for a secular group.

