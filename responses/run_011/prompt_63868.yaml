  *   **Ambiguity:** Your position on **Memory/Recognition (Q7)** is the only missing variable. If you think remembering is *new* knowledge, you slide toward Prabhākara. If you think it's just reviving old knowledge, you are firmly Nyāya. Given your analytic leanings ("postulation is inference"), you likely view memory as revival, confirming the Nyāya leaf.
