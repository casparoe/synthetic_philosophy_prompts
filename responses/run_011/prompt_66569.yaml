answer: |-
  The pie was cold. Elara had microwaved it for too short a time, then forgotten it while reviewing the quarterly inertial adjustments for Sector 7. Now the pastry was dense and greasy against her tongue, sticking to the roof of her mouth. She washed it down with tea that had gone lukewarm an hour ago.

  The office smelled of limestone dust and ozone. It was a smell that lived in the fabric of her cardigan, in the lines of her palms. The Chancery of Verifiable Things occupied the lower floors of the Old Registry, where the air circulation was poor and the light came from flickering tubes that hummed in a key just below hearing.

  On her desk lay the file for the Hollows District. It was a thick folder, bound in red tape, worn soft at the corners from eighty years of handling. The founding claim of the Hollows was a covenant regarding subterranean water rights. To verify it, one had to drill to the aquifer's source and match the mineral signature against the original surveyor's log. The log was lost. The aquifer was three miles down.

  The check-cost was calculated at four hundred and twenty years of continuous labor for an ordinary person with standard apparatus.

  Status: Inert.

  Elara wiped a crumb from her lip. She had certified the Hollows as inert twice before, once five years ago and once ten years prior. It was a clerical formality. The claim existed, but it bound no one. You could not be taxed on water you could not measure. You could not be sued for diverting a stream you could not trace. The Hollows drank and built and farried as if the covenant did not exist, because for all legal purposes, it did not.

  A knock at the doorframe. Not a rap, just the sound of knuckles against wood.

  Elara looked up. A man stood there. He was wearing a coat that had been mended too many times, the fabric shiny at the elbows. He held a hat in his hands. He did not look like a petitioner. Petitioners usually smelled of anxiety and soap. This man smelled of dry earth.

  "Auditor Elara?" he said.

  "State your business. Intake is on the fourth floor."

  "I was sent down. Section 9. Testimonial Key."

  Elara put down her fork. Section 9 was rarely used. It covered instances where a claim's check-cost was reduced not by new technology, but by new information held by a specific agent. A witness.

  "Name?"

  "Kael. From the Hollows."

  He stepped inside without waiting for permission. He placed a small object on the desk. It was a brass cylinder, tarnished black.

  "This isn't a document," Elara said.

  "It's a lens," Kael said. "And I know where the surveyor's log is."

  Elara felt a tightness in her chest, a familiar bureaucratic reflex. She reached for the intake form. She did not ask him how he knew. That was irrelevant. The Chancery did not care about truth, only verifiability. If he could lead an ordinary person to the log in less than a lifetime, the check-cost dropped. If the check-cost dropped below the threshold, the claim woke up.

  "Sit," she said.

  Kael sat. He did not look at the file. He looked at the dust motes dancing in the tube light.

  "Procedure requires I record your statement," Elara said. She clicked her pen. "State the location."

  "Under the spire of the old mill. Not in the ground. In the casing of the bell. The log is etched on the interior metal."

  Elara stopped writing. The mill was in the center of the district. The bell had rung every noon for sixty years.

  "Access time?" she asked.

  "Half an hour to climb. Ten minutes to read."

  "Apparatus?"

  "A ladder. A cloth to wipe the soot."

  Elara did the math. It was automatic. Forty minutes. An ordinary person could do it before lunch. The check-cost collapsed from four centuries to an afternoon.

  The file on the desk seemed to grow heavier. The red tape looked brighter.

  "If this is verified," Elara said, her voice flat, "the covenant becomes active. Status shifts from inert to binding."

  "Yes."

  "Effective date of binding status is the date of recalculation."

  Kael looked at her then. His eyes were pale, watery. "Is it?"

  Elara stopped. The pen hovered over the paper. This was the gap in the statutes. The Chancery operated on the principle that obligation requires the capacity to verify. Before today, the capacity did not exist. Therefore, no obligation existed. But now the capacity existed. Did the obligation stretch back to the founding, waiting like a trap? Or did it begin now, where the light finally reached it?

  There was no precedent. Nobody ever brought a witness. Nobody ever made the inert active.

  "I need to process the recalculation," Elara said. "You understand what this means? The water rights. The zoning restrictions based on the aquifer line."

  "The buildings," Kael said. "The ones built over the line."

  "Three generations of them," Elara said.

  If the claim was active now, it was because the information existed. If the information existed, the check-cost had theoretically always been low, provided one knew to look in the bell. The ignorance of the district was not a failure of apparatus, but of knowledge. The statutes did not distinguish between hidden truth and unknown truth. They only measured the labor of verification.

  If she signed the recalculation, she validated the witness. If she validated the witness, the check-cost was officially reduced. If the check-cost was reduced, the claim was no longer inert.

  And if the claim was no longer inert, the last sixty years of construction in the Hollows were violations of a binding covenant. The residents were not just violators now; they were retroactive violators. Taxes would be due. Demolition orders could be issued. Sin attached to denying a verified claim.

  Elara looked at the cold pie. She felt sick.

  "Why now?" she asked.

  "My grandfather died," Kael said. "He told me where it was. He said it was better left sleeping. But the state is threatening to cut the water supply anyway. They say the aquifer is dry. I know it isn't. The log proves the flow rights belong to the district, not the state. If the claim is inert, the state takes the water by default. If the claim is active, we keep it."

  "So you wake the claim to save the water."

  "And risk the buildings."

  Elara picked up the recalculation form. It was standard CVT-889b. She had to fill out the margin notes. She had to certify that the witness was competent and the key was valid.

  She looked at Kael. He was trading the roofs over their heads for the water in their taps. He was trading the safety of the past for the survival of the future.

  The Chancery did not care about the trade. It only cared about the math.

  Elara began to write. Her handwriting was small, precise. She noted the location. She noted the apparatus. She noted the time estimate.

  *Check-cost: 0.003 years.*

  She paused at the section marked *Prior Period Liability*. The box was empty. There was no instruction for what to do when a claim wakes up. Usually, inert claims stayed dead. They were geological strata, buried too deep to matter. You didn't worry about the rights of the dinosaurs.

  But this was a bell. It had been ringing over the truth for sixty years.

  "Will you stamp it?" Kael asked.

  "I have to verify the key," Elara said. "I can't take your word."

  "I know. I'll take you there. Or send someone with you."

  "It's not about trust. It's about the ordinary person standard. If I send a junior auditor, can they do it?"

  "Yes."

  "Then the cost stands."

  Elara dipped her pen in the inkwell. The ink was black, thick. It smelled of iron. She looked at the bottom of the form. There was a space for the auditor's signature and the date of effect.

  *Date of Effect: _______________*

  If she wrote today's date, the claim became active today. The past remained inert. The buildings were safe. The water, however, might be lost, because the state's claim of default might hold for the prior period.

  If she wrote the founding date, the claim was always active. The district kept the water rights forever. But the buildings were illegal. The residents were liable.

  She looked at Kael. He was watching her hand. He didn't blink. He knew what the pen meant. It was the only weapon that mattered in this room.

  The hum of the lights seemed to grow louder. A fly buzzed against the windowpane, trapped between the glass and the screen. It threw itself against the barrier again and again.

  Elara thought about the Hollows. She had never been there. She knew it only as a cluster of green ink on a map, surrounded by the red hash of inert zones. She thought about the people living there. They were eating lunch now, probably. They were drinking the water. They were sleeping under the roofs.

  They were living in a world where the rules were clear. You check, you obey. You can't check, you're free.

  Now the rule was breaking. The check was possible. The freedom was ending.

  But the freedom had already been exercised. They had built the houses. They had drilled the wells. They had acted in the certainty of the inert. To change the status now was to say their certainty was a mistake. To say their lives were built on a technicality that had just expired.

  The Chancery did not deal in mistakes. It dealt in costs.

  Elara looked at the paperwork again. She needed to file the witness intake first. It was a separate sheet. She pulled it from the stack.

  ```
  CHANCERY OF VERIFIABLE THINGS
  FORM CVT-104: WITNESS COMPETENCY & KEY DEPOSITION
  -------------------------------------------------------------------------
  AUDITOR ID: 8940-EL
  DATE: 14.10.894
  DISTRICT: HOLLOWS (SEC 7)
  CLAIM ID: H-FOUND-001 (WATER COVENANT)

  WITNESS NAME: KAEL
  WITNESS STATUS: CIVILIAN / RESIDENT
  KEY TYPE: TESTIMONIAL / LOCATIONAL

  STATEMENT OF REDUCTION:
  Witness asserts knowledge of Claim Artifact location. 
  Artifact: Surveyor's Log (Etched).
  Location: Mill Spire Bell Casing.
  Access Method: Ladder / Cleaning Cloth.
  Estimated Labor (Single Ordinary Agent): 50 Minutes.

  PREVIOUS CHECK-COST: 420 Years (Excavation Required)
  NEW CHECK-COST: 0.003 Years (Access Required)

  THRESHOLD STATUS: 
  [ ] INERT ( > 80 Years )
  [X] ACTIVE ( < 80 Years )

  RETROACTIVITY CLAUSE (STATUTE 12):
  Upon reduction of check-cost below threshold, claim status updates 
  immediately. Prior periods of non-compliance are subject to review 
  if ignorance is deemed negligent. Negligence is defined as failure 
  to pursue available verification methods.

  WITNESS ACKNOWLEDGMENT:
  I certify that the information provided is true to my knowledge and 
  I understand that rendering a claim active may incur liability for 
  persons previously operating under inert status.

  WITNESS SIGNATURE: _________________
  AUDITOR SIGNATURE: _________________
  -------------------------------------------------------------------------
  ```

  Elara read the Retroactivity Clause. *Subject to review if ignorance is deemed negligent.*

  Negligence. That was the knife.

  If the key was in the bell, and the bell rang every day, was it negligent not to look? An ordinary person would not climb a bell tower to check water rights. It was not standard procedure. The apparatus was a ladder, but the knowledge was the key.

  Without the witness, the ladder was useless. With the witness, the ladder was a tool of verification.

  Did the negligence lie with the district for not knowing? Or with the world for not telling?

  Kael signed the form. His hand shook slightly, but the signature was legible. He pushed it back to her.

  "You have to sign," he said.

  Elara picked up her pen. The ink was wet on the nib. She looked at the space for her signature. Below it was the date box.

  If she signed, she opened the door. If she didn't, the water went dry. The state would pump the aquifer empty within the year. The Hollows would become dust.

  If she signed, the state would see the active claim. They would see the water rights. But they would also see the building violations. They would send the enforcement crews.

  She thought about the cold pie in her stomach. She thought about the dust in the air. She thought about the fly at the window, still throwing itself against the glass.

  There was no procedure for this. There was only the form. The form demanded a signature. The form demanded a date.

  She could leave the date blank. She could file the recalculation as pending verification. That would freeze the status. The water would remain in limbo. The buildings would remain in limbo. It would buy time. Maybe a year. Maybe two. Eventually, someone else would have to sign. Someone else would have to decide if the past was guilty.

  But Kael would know. The state would know. The inertia was gone. The claim was breathing again.

  "Is there somewhere I can wait?" Kael asked.

  "There's a bench outside," Elara said. "Don't leave the floor."

  Kael stood up. He nodded. He didn't thank her. There was nothing to thank her for. She was just the mechanism.

  He closed the door behind him. The office was silent again, save for the hum of the lights and the scratch of the fly.

  Elara looked at the form. The ink on Kael's signature was drying. It looked dark, final.

  She moved her hand to the date box. She hovered the pen over the paper. The tip was just above the line, close enough to touch, close enough to stain.

  She thought about the definition of an ordinary person. She thought about what they could be expected to know. She thought about the weight of the stamp in the drawer to her left, the red ink pad waiting to be pressed.

  The fly stopped buzzing. It sat on the glass, still.

  Elara lowered the pen. The tip touched the paper. The ink bloomed, a small black sphere expanding into the fibers.

  She did not write the date. She held the pen there, feeling the scratch of the paper against the nib, waiting for the ink to stop flowing, waiting for the decision to harden into something that could not be wiped away.

  The office waited. The file waited. The district waited.

  Elara lifted the pen. She looked at the dot she had made. It was not a signature. It was not a date. It was just a mark.

  She reached for the stamp.
