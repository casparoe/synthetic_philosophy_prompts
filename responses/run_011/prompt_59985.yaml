      *   **Required Analogy Analysis:** The "Commit Log vs. Build Artifact" analogy. Which is memory, which is history? Where does the film stand?
      *   **Critical Constraint:** "Tell me where this reading breaks down." Do not flatten the film into a mere illustration. Find the tension/resistance.
