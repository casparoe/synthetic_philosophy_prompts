      *   *Critique of Analogy:* In software, the build *must* match the code (ideally). In memory, the story *diverges* from the fact. The analogy breaks because software aims for deterministic reproducibility; memory aims for meaning-making.

  6.  **Identify the Breakdown (The "Resistance"):**
