      *   Inside the film, *Nation's Pride* is a propaganda film within the film.
      *   The audience in the film watches *Nation's Pride* and believes the myth.
      *   The audience *of* *Inglourious Basterds* watches the assassination and knows it's a myth.
      *   Tarantino is rewriting history to give a cathartic ending that didn't happen.

  3.  **Apply Nietzsche (Use and Abuse of History):**
      *   *Monumental:* History that inspires great action in the present by looking at great deeds of the past. (Heroes, myths).
      *   *Antiquarian:* History that preserves the past for its own sake, reverence for origins. (Archives, museums).
      *   *Critical:* History that judges and condemns the past to liberate the present. (Breaking chains).
      *   *Analysis:* *Nation's Pride* is clearly *Monumental* history (Zoller as hero). But what is Tarantino's film? It's *Critical* history (destroying the Nazis) but achieved through *Monumental* fabrication (the Basterds as avenging angels). It abuses history for "Life" (catharsis/justice).
      *   *Sliding:* The film slides from Critical (exposing Nazi propaganda) to Monumental (creating a new myth of Jewish vengeance).

  4.  **Apply Margalit (Ethics of Memory):**
