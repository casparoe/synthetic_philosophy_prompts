      *   The Line: Unless the police told him to do it, or made it impossible *not* to do it physically, the choice is his.
      *   Closing: We can't commute every sentence where police had surveillance.

  6.  **Drafting - Iteration 2 (Fleshing out the specific "Worries"):**
