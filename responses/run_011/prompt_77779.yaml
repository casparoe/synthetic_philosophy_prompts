answer: |-
  **MEMORANDUM**

  **TO:** Board of Pardons Members
  **FROM:** [Your Name]
  **DATE:** [Date]
  **RE:** Petition for Commutation – [Petitioner Name/Case Number]

  **Recommendation**

  I recommend we **deny** the petition for commutation.

  This recommendation is not a dismissal of the concerns raised by the undisclosed informant file. The fact that the state possessed a mechanism to intervene and chose not to is disturbing, and it requires us to be precise about why it does not warrant clemency in this instance. If we grant relief here, we risk establishing a precedent that conflates police *observation* with police *coercion*, a distinction that is vital to the administration of criminal justice.

  Two of our colleagues find the petitioner's argument persuasive: that the state engineered a scenario where the robbery was inevitable, removing the petitioner's ability to "do otherwise," and thus reducing his moral blameworthiness. This is a sophisticated argument. It appeals to a basic intuition about fairness: that a person should not be fully punished for an act they were destined to commit regardless of their choice.

  However, upon closer examination, this argument rests on a confusion between the *consequences* of an action and the *choice* to perform it. The state ensured the arrest; it did not ensure the robbery. The petitioner's will remained the sole engine of the crime. Below, I outline why the absence of a viable escape route does not mitigate culpability here, why the state's role does not disqualify it from imposing sentence, and what rule we should apply to future petitions of this nature.

  **1. The Question of Alternatives and Blameworthiness**

  The core of the petitioner's claim is that because the police could have stopped him at the door had he hesitated, he effectively had no choice but to proceed with the robbery to avoid immediate capture. Therefore, the argument goes, he "could not have done otherwise," and his moral responsibility is diminished.

  We must be clear about what "doing otherwise" means in this context. The petitioner argues that the alternative to robbery was arrest at the door. But in the eyes of the law and morality, the relevant alternative to *committing a crime* is *not committing a crime*.

  The petitioner had the physical and mental capacity to turn around and walk away before entering the check-cashing place. He could have chosen not to be a robber at all. It is true that if he had entered with intent but then hesitated, the police would have intervened. But that intervention would have been a response to a different set of actions (attempted robbery or conspiracy), not a negation of his initial choice to arm himself and approach the target.

  The intuition that "he couldn't have done otherwise" latches onto the wrong variable. It focuses on the *outcome* (freedom vs. prison) rather than the *conduct* (robbing vs. not robbing).
  *   **Variable A (Conduct):** Did the petitioner choose to threaten the teller with a weapon? Yes. Was this choice forced by the police? No. The police were passive observers until the crime was completed.
  *   **Variable B (Outcome):** Was the petitioner going to be caught regardless? Likely yes.

  Culpability attaches to Variable A. We punish people for the harms they choose to inflict, not for the success of their evasion. The fact that evasion was impossible due to police surveillance does not erase the choice to inflict harm. To rule otherwise would imply that a criminal is less blameworthy if the police are competent. It would suggest that a man who robs a bank with a getaway car is more responsible than a man who robs a bank surrounded by undercover agents, simply because the latter had a lower chance of success. That is a standard we cannot adopt.

  Regarding the specific worry that the "leftover alternative" (hesitating at the door) is merely a technicality: It is not a technicality, but it is also not a moral out. The option to hesitate was an option to be caught *earlier*, not an option to be *innocent*. The petitioner was not coerced into robbing the bank to avoid arrest; he was simply aware (or unaware) that arrest was certain. Committing a crime because you know you will be caught anyway is not duress; it is a calculation. The state did not force that calculation.

  **2. The State's Standing to Punish**

  The second concern is whether the state, having built the "machine" that made the crime inevitable, is in a position to hand out the punishment. This is a question of clean hands. If the state manipulates the environment such that a crime is guaranteed, does it lose the moral authority to prosecute it?

  The answer depends on whether the state *created* the intent or merely *monitored* it.

  There is a critical line between entrapment and investigation. Entrapment occurs when the government implants the disposition to commit the crime in an innocent mind. Investigation occurs when the government observes a disposition that already exists. The records before us show the latter. The petitioner arrived armed. He arrived with intent. The confidential informant (CI) reported in real-time that the petitioner "never wavered."

  The standing order to trigger the panic button only if the petitioner hesitated was a rule of engagement for the police, not a script for the petitioner. The police did not tell the petitioner, "If you don't rob this place, we will arrest you for something else." They did not threaten him. They did not block the exit. They simply waited.

  The state's "machine" was a surveillance apparatus, not a compulsion apparatus. It ensured that if a crime occurred, it would be proven. It did not ensure that a crime would occur. The petitioner provided the intent, the weapon, and the action. The state provided the audience.

  To grant clemency on the grounds that the state "allowed" the crime to happen is to misunderstand the function of law enforcement in complex investigations. In almost every sting operation, undercover buy, or monitored transaction, the police have the capacity to intervene before the crime is completed. They often choose not to, because intervening too early destroys the evidence needed to convict the ringleaders, recover the weapons, or prove the intent beyond a reasonable doubt.

  If we rule that the state's ability to prevent a crime creates a duty to do so, we cripple investigative work. We would force police to arrest suspects the moment intent is suspected, rather than when the crime is consummated. This would lead to weaker cases, more plea bargains for lesser charges, and potentially more dangerous suspects back on the street sooner. The state's decision to let a crime reach completion for the sake of a solid prosecution is a recognized tactical choice, not a moral failing that voids the sentence.

  **3. Drawing a Line for Future Cases**

  My primary hesitation in recommending denial is the need for a rule that does not collapse into extremes. We cannot say "surveillance never counts," because there may be cases where police conduct is truly outrageous. Nor can we say "any operation with a failsafe entitles you to commutation," because that covers nearly every arrest.

  We need a standard that distinguishes between *ensuring capture* and *ensuring the act*. I propose the following test for future petitions involving withheld surveillance or intervention capabilities:

  **Clemency is warranted only if the state's conduct removed the petitioner's ability to choose *not to commit the act*, not merely the ability to avoid *consequences*.**

  *   **Scenario A (This Case):** The police could have arrested the petitioner at the door. They waited until he robbed the teller.
      *   *Analysis:* The petitioner could have chosen not to rob the teller. The police choice affected the *timing of the arrest*, not the *commission of the crime*.
      *   *Result:* No mitigation.

  *   **Scenario B (Coercion):** The police tell the petitioner, "Rob this teller or we will deport your mother."
      *   *Analysis:* The petitioner's choice to rob is no longer voluntary. The state has inserted a threat that overrides the petitioner's will.
      *   *Result:* Mitigation or dismissal (Duress/Entrapment).

  *   **Scenario C (Physical Prevention):** The police secretly jam the door so the petitioner cannot leave, forcing him to stay inside where he eventually lashes out.
      *   *Analysis:* The state physically removed the alternative of withdrawal.
      *   *Result:* Potential mitigation.

  In the present petition, we are in Scenario A. The "inevitability" the defense cites is the inevitability of *capture*, not the inevitability of *violence*. The petitioner controlled the violence. The state controlled the handcuffs.

  There is a philosophical intuition that suggests if an outcome is fixed, the steps leading to it don't matter. This is sometimes illustrated by a thought experiment where a surgeon installs a chip in your brain that would force you to pull a trigger if you didn't choose to do it yourself. If you pull the trigger on your own, are you responsible? Most people feel you are, because the chip never fired. Your own will was the cause.

  We should not import academic theories into our rulings, but the practical lesson is sound. We judge people on the actions they take, not on the hypothetical actions they might have taken if the police had acted differently. The panic button was never pressed. The surveillance team never moved until the robbery was done. The petitioner's will was the only active force in the room that contributed to the victim's trauma.

  **4. Conclusion**

  I understand the discomfort here. We are being asked to look at a file that was withheld, showing that the state had a tighter grip on the situation than the defense knew. That withholding is a separate issue for the courts on appeal, regarding the fairness of the trial process. But for this Board, the question is clemency based on moral blameworthiness.

  Does the petitioner deserve 14 years? That is a judgment on the severity of armed robbery, which is a matter of statutory sentencing policy. But does he deserve *less* because the police were watching? No. The victim suffered the same terror regardless of whether a panic button existed. The petitioner exerted the same malice regardless of whether a surveillance team was outside.

  If we grant this petition, we establish that a criminal's responsibility is inversely proportional to the police's efficiency. We would be saying that a defendant is less guilty if the police were better prepared. That is a principle that cannot hold.

  The petitioner made a choice to rob. He was not forced to make that choice by the state. He was simply denied the ability to make that choice *in secret*. That is not a ground for commutation.

  I urge the Board to deny the petition, with the understanding that we are preserving the distinction between police investigation and police coercion. We can condemn the withholding of discovery without conceding that the petitioner's culpability was reduced.

  **Action Requested:** Vote to Deny Commutation.
