          *   *Student's Error:* The student assumes the work exists independently of the manuscript's authenticity. If it's "previously unknown," the manuscript *establishes* the work. If the manuscript is a forgery (falsely attributed), the work is not Beethoven's. Therefore, the performance is not of a Beethoven quartet.
