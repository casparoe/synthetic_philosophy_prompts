          *   *Error 3:* "performance is a genuine instance of the quartet." If the quartet is defined by Beethoven's authorship, and Beethoven didn't write it, it's not a genuine instance of a *Beethoven* quartet. It's a genuine instance of *the notes written in the score*, but the work identity is tied to the composer in the real world, even if Goodman tries to sever it. *Correction:* Goodman's strict view is that the work *is* the compliance class. However, if the score is fraudulent (not Beethoven's), the compliance class is not Beethoven's. The student misses the implication of "previously unknown."
