      *   **Subject:** Nelson Goodman's *Languages of Art* (specifically the distinction between autographic/allographic arts, notation, and forgery).

  2.  **Analyze the Question & Expected Content (Goodman's Theory):**
      *   **Part (a): Autographic vs. Allographic.**
          *   *Definition:* Autographic = history of production matters (forgery possible). Allographic = history doesn't matter, compliance with notation matters (forgery impossible *of the work*).
          *   *One vs. Many:* Goodman explicitly rejects the "one object vs. many objects" distinction (e.g., prints vs. paintings). A print is allographic (usually), a painting is autographic, but both yield multiple objects. The key is the *possibility of forgery* based on history of production.
      *   **Part (b): Notation.**
          *   *Role:* Notation allows for the identification of the work independent of its history.
          *   *Requirements:* Syntactic disjointness (no mark belongs to two characters), syntactic differentiation (finite differentiation/decidability), semantic disjointness, semantic differentiation, unambiguity. (Student needs to capture the essence: disjointness and differentiation).
          *   *Forgery:* In allographic arts, if you comply with the notation, you have the work. Forgery requires claiming false history of production. Since history doesn't constitute the work in allographic arts, you can't forge the *work*, only the *document* (score).
      *   **Part (c): The Beethoven Case.**
          *   *Scenario:* Forger creates a *manuscript* of a *previously unknown* quartet. Ensemble performs from it.
          *   *Analysis:* This is a trick question based on Goodman's strict definitions.
          *   *Is the work forged?* If the notes are Beethoven's (i.e., the forger copied a lost score or somehow generated the correct sequence), the *work* is Beethoven's. If the forger *composed* it and claimed it was Beethoven's, it's a forgery of the *work* (because the work is defined by the composer in some sense, though Goodman focuses on notation).
          *   *Wait, deeper Goodman analysis:* Goodman argues forgery is impossible in allographic arts *once the work is established*. But here, the work is "previously unknown."
          *   *Crucial Point:* If the forger *wrote* the music (composed it) but claimed Beethoven wrote it, is it a forgery of the work? Yes, because the work's identity in music (usually) includes authorship, even if Goodman tries to reduce it to notation. However, Goodman's strict view is that if it complies with the score, it's the work. But where did the score come from?
          *   *The Trap:* The student says "nothing has been forged... manuscript itself is merely a copy of a score... copies of scores cannot be forged."
          *   *Correction:* If the quartet was *previously unknown*, there is no antecedent score to copy. The forger *created* the score. If they claim Beethoven wrote it, they are forging the *work* (in the ordinary sense) or at least the *document* fraudulently.
          *   *Goodman's specific view on Forgery of Scores:* Goodman distinguishes between forging a *work* and forging a *document*. In music, you can forge a document (the manuscript), but if the performance complies with the notation, is it the work?
          *   *The "Previously Unknown" aspect:* If it's previously unknown, there is no established notation to comply with *except* the forged manuscript. If the forger composed the music, it is not a Beethoven work, regardless of notation compliance, because Beethoven didn't write it. Goodman actually admits that in allographic arts, the *origin* of the score matters if the work isn't yet identified. But more importantly, Goodman argues that *forgery of the work* is impossible in allographic arts *only if* we define the work strictly by compliance. However, standard interpretation of Goodman on this specific case (often discussed in secondary literature) suggests that if the score is forged (i.e., falsely attributed), the performance is of a *different work* (the forger's work mislabeled) or the performance is genuine *of the notes* but the attribution is false.
          *   *Refining the Goodman View:* Goodman says forgery requires a false claim of history of production. In music, history of production doesn't matter *for the work's identity* once the score exists. BUT, if the score itself is a forgery (i.e., not actually by Beethoven), then the work *isn't* Beethoven's. The student claims "copies of scores cannot be forged." This is wrong. Scores (as physical objects/documents) can be forged. The *work* might not be forgeable once defined, but the *score* (the source of the notation) can be.
