answer: |-
  ### I. Examination Question

  **Graduate Seminar: Semantics of Conditionals**
  **Time Allowed: 45 Minutes**
  **Total Marks: 25**

  **Instructions:** Answer the following question. You may assume the standard axioms of probability.

  **Background Definitions:**
  *   **Stalnaker's Thesis:** For any probability function $P$ and indicative conditional $A \to C$, the probability of the conditional equals the conditional probability of the consequent given the antecedent: $P(A \to C) = P(C|A)$.
  *   **Adams's Thesis:** The acceptability or assertability of an indicative conditional $A \to C$ is not a matter of truth conditions but is measured by the conditional probability: $Assert(A \to C) = P(C|A)$.

  **The Toy Model:**
  Consider a logical algebra generated by four atoms $w_1, w_2, w_3, w_4$. Let the prior probability function $P$ assign $1/4$ to each atom. Let $A = \{w_1, w_2\}$ and $C = \{w_1, w_3\}$.
  A centered selection function $f$ determines the truth conditions of the conditional. For antecedent $A$, $f$ is defined as:
  $f(A, w_1) = w_1$
  $f(A, w_2) = w_2$
  $f(A, w_3) = w_1$
  $f(A, w_4) = w_2$

  Under standard selection function semantics, a world $w$ verifies $A \to C$ iff $f(A, w) \in C$. Based on the definition above, the conditional $A \to C$ denotes the proposition $\{w_1, w_3\}$.

  **Question:**

  **(a)** Verify that Stalnaker's Thesis holds for the prior probability function $P$ given the model above. Then, exhibit a conditionalization of that prior—updating on evidence that rules out exactly one atom, holding $f$ fixed—on which Stalnaker's Thesis fails. You must compute both $P_{new}(A \to C)$ and $P_{new}(C|A)$ explicitly to demonstrate the inequality. (12 marks)

  **(b)** Lewis's triviality results argue that no proposition can satisfy Stalnaker's Thesis for all probability functions. Based on your calculation in (a), diagnose where the incompatibility arises. Does the trouble stem from the demand that the thesis hold for every probability function, or from the assumption that a conditional denotes a single proposition settled independently of one's credences? Discuss whether allowing the proposition denoted by "if $A$, $C$" to vary across credal states preserves anything worth having. Specifically, address whether accepting a conditional can still amount to believing a proposition, and whether testimony could ever inform someone of a conditional's content under such a view. (13 marks)

  ***

  ### II. Model Answer

  **(a) Verification and Falsification**

  First, we verify Stalnaker's Thesis for the prior $P$.
  The proposition expressed by $A \to C$ is given as $\{w_1, w_3\}$.
  Since $P$ assigns $1/4$ to each atom, the probability of the conditional is:
  $P(A \to C) = P(\{w_1, w_3\}) = 1/4 + 1/4 = 1/2$.

  Next, we calculate the conditional probability $P(C|A)$.
  $P(A) = P(\{w_1, w_2\}) = 1/2$.
  $P(C \cap A) = P(\{w_1, w_3\} \cap \{w_1, w_2\}) = P(\{w_1\}) = 1/4$.
  $P(C|A) = P(C \cap A) / P(A) = (1/4) / (1/2) = 1/2$.

  Since $1/2 = 1/2$, Stalnaker's Thesis holds for the prior.

  To show failure, we conditionalize on evidence $E$ that rules out exactly one atom. Let us rule out $w_4$. The new probability function $P'$ assigns $0$ to $w_4$ and redistributes the mass equally among the remaining atoms $w_1, w_2, w_3$. Thus, $P'(w_1) = P'(w_2) = P'(w_3) = 1/3$.

  We hold the selection function $f$ fixed, meaning the proposition expressed by $A \to C$ remains $\{w_1, w_3\}$.
  $P'(A \to C) = P'(\{w_1, w_3\}) = 1/3 + 1/3 = 2/3$.

  Now we compute the new conditional probability $P'(C|A)$.
  $P'(A) = P'(\{w_1, w_2\}) = 1/3 + 1/3 = 2/3$.
  $P'(C \cap A) = P'(\{w_1\}) = 1/3$.
  $P'(C|A) = (1/3) / (2/3) = 1/2$.

  Comparing the results: $P'(A \to C) = 2/3$, but $P'(C|A) = 1/2$.
  Since $2/3 \neq 1/2$, Stalnaker's Thesis fails for $P'$.

  **(b) Diagnosis and Implications**

  The calculation in (a) demonstrates that the failure of Stalnaker's Thesis is not intrinsic to the specific probability distribution but arises when the distribution shifts while the semantic content remains fixed. Lewis's triviality result relies on the assumption that $A \to C$ denotes a single proposition $X$ whose truth conditions are independent of the probability function $P$. As shown, if $X$ is fixed, we can always find a conditionalization where $P(X)$ diverges from $P(C|A)$.

  Consequently, the "real trouble" lies in the conjunction of two assumptions: (1) that Stalnaker's Thesis must hold for every admissible credence function, and (2) that conditionals denote stable propositions. To escape triviality, one must reject at least one. If we retain the Thesis as a constraint on rational credence, we must reject the assumption that conditionals denote single, stable propositions. This suggests a contextualist or expressivist semantics where the content of $A \to C$ shifts depending on the agent's credal state.

  However, this escape comes at a significant theoretical cost. If the proposition denoted by a conditional varies with credence, then "believing" a conditional cannot amount to believing a stable proposition in the standard sense. Belief is typically understood as a relation between an agent and a fixed content. If the content shifts as my evidence shifts, I am not tracking the truth of a single claim but rather adjusting my attitude toward different claims. This undermines the idea that conditionals are truth-apt objects of belief.

  Furthermore, this view complicates the role of testimony. Communication typically involves a speaker conveying a proposition that the listener then adopts. If the content of $A \to C$ is relative to the speaker's credence state, and the listener occupies a different credal state, they effectively entertain different propositions. Testimony would fail to inform the listener of the conditional's content because there is no shared content to transmit. The listener might adopt the speaker's conditional probability, but they would not be believing *what the speaker said*. Thus, while varying propositions avoids mathematical triviality, it risks rendering conditionals epistemologically isolated, stripping them of their role in shared inquiry and belief revision.

  ***

  ### III. Marking Scheme

  **Total Marks: 25**

  **Part (a): Arithmetic and Verification (12 Marks)**
  *   **Prior Verification (4 marks):**
      *   1 mark: Correctly identifies $P(A \to C) = 0.5$.
      *   1 mark: Correctly identifies $P(C \cap A) = 0.25$ and $P(A) = 0.5$.
      *   1 mark: Correctly calculates $P(C|A) = 0.5$.
      *   1 mark: Explicitly states the equality holds for the prior.
  *   **Conditionalization (8 marks):**
      *   2 marks: Selects a valid update (ruling out exactly one atom) and correctly normalizes probabilities (e.g., $1/3$ each).
      *   2 marks: Correctly calculates new $P_{new}(A \to C)$ based on the fixed proposition (e.g., $2/3$).
      *   2 marks: Correctly calculates new $P_{new}(C|A)$ (must result in $1/2$).
      *   2 marks: Explicitly states the inequality and concludes the thesis fails.

  **Part (b): Philosophical Analysis (13 Marks)**
  *   **Diagnosis of Triviality (5 marks):**
      *   3 marks: Identifies that the conflict arises between the universal quantification over probability functions and the stability of the proposition (fixed $f$).
      *   2 marks: Acknowledges that holding $f$ fixed while updating $P$ is the source of the divergence.
  *   **Implications for Belief and Testimony (8 marks):**
      *   4 marks: Discusses the cost of varying propositions: challenges the notion of conditionals as objects of belief (belief requires stable content).
      *   4 marks: Discusses the cost for testimony/communication: if content is credence-relative, shared content is impossible, undermining information transfer.

  **Specific Errors and Penalties**
  *   **Identifying Adams's Thesis with Stalnaker's:** Deduct 3 marks from Part (b). (Adams concerns assertability; Stalnaker concerns truth-conditional probability).
  *   **Reporting Lewis's Result Incorrectly:** Deduct 3 marks if the candidate claims Lewis showed the thesis is false for a *single* credence function rather than for *all* functions simultaneously.
  *   **Trivializing the Failure:** Deduct 4 marks from Part (b) if the candidate treats the failure of closure under conditionalization as a merely technical wrinkle without discussing the semantic/epistemic implications.
  *   **Misinterpreting Triviality:** Deduct 3 marks if the candidate concludes that "triviality" means conditionals are simply material conditionals.
  *   **Arithmetic Errors:** Deduct 1 mark per calculation error in Part (a), up to 4 marks total.

  **Grading Distinction: A vs. B**
  *   **A Grade (20–25 marks):** The candidate performs the arithmetic flawlessly and, in Part (b), articulates a nuanced tension between semantics and epistemology. They recognize that saving Stalnaker's Thesis by varying propositions sacrifices the "common ground" required for testimony and the stability required for belief. The answer demonstrates insight into *why* the triviality result matters for semantic theory.
  *   **B Grade (15–19 marks):** The candidate performs the arithmetic correctly (or with minor errors) and identifies that the proposition cannot be fixed across all probabilities. However, in Part (b), the discussion is superficial. They may note that content must shift but fail to adequately explain the consequences for belief norms or communication, or they treat the problem as purely mathematical rather than conceptual.
