answer: |-
  Your friend clearly knows the literature—he's referencing John Kelly's 1956 information theory paper and the modern "ergodicity economics" popularized by Ole Peters—but he is presenting a theoretical ideal as a practical law. He is mixing mathematical asymptotes with human reality.

  Here is a claim-by-claim breakdown of what is right, what is a simplification, and what is misleading or wrong.

  ### 1. The Claim: "Kelly... is maximizing expected log wealth... no utility function is needed... long-run growth rate is an objective property."
  **Verdict:** *Defensible simplification, but philosophically contested.*

  This is the core of the "ergodicity" argument. In standard economics, you maximize *expected value* (ensemble average), which requires a utility function to explain why people reject risky bets with positive expected value. Ole Peters argues that for a single individual over time (time average), the expected value is irrelevant; only the geometric growth rate matters. Since the geometric growth rate is an objective mathematical property of the bet, he claims you don't need a subjective "utility function" to justify avoiding ruin.

  **The Catch:** While clever, this smuggles in a utility function through the back door. Choosing to maximize *long-run growth rate* is itself a preference. It assumes you care about wealth at $t = \infty$ more than wealth at $t = 10$ years. If you have a specific liability (like rent due next month), the "objective growth rate" is irrelevant. You haven't eliminated values; you've just hard-coded a specific time preference (infinite horizon) into the math.

  ### 2. The Claim: "In the long run Kelly strictly dominates... any other fixed fraction ends up poorer than Kelly with probability approaching one."
  **Verdict:** *Mathematically true (asymptotically), practically misleading.*

  This refers to the **asymptotic dominance theorem**. As the number of bets approaches infinity ($N \to \infty$), a Kelly bettor will almost surely have more wealth than a bettor using any other fixed fraction.

  **The Catch:** "Probability approaching one" requires an infinite time horizon. We do not have infinite time. In finite horizons (e.g., a career, a lifetime), other strategies can outperform Kelly with significant probability. For example, a strategy that bets slightly less than Kelly reduces variance and might outperform Kelly over a 10-year window if Kelly hits a nasty drawdown early. Furthermore, "richer" does not mean "better off." If Strategy A leaves you with \$10 million but required enduring a 90% drawdown, and Strategy B leaves you with \$8 million with smooth growth, many rational agents prefer B. Kelly maximizes the *median* outcome, not necessarily the outcome that fits your life constraints.

  ### 3. The Claim: "Bet more than Kelly... chance of going bust goes up; bet less and you're leaving growth on the table for no reason."
  **Verdict:* *Mostly right, but "for no reason" is wrong.*

  It is true that betting more than Full Kelly (overbetting) reduces the geometric growth rate and increases the probability of ruin. It is also true that betting less than Kelly (underbetting) reduces the expected growth rate.

  **The Catch:** You do not underbet "for no reason." You underbet to reduce **variance**. The growth curve around the Kelly optimum is surprisingly flat. Betting "Half Kelly" sacrifices very little theoretical growth (roughly 25% of the growth rate) but cuts the volatility and drawdowns by half. Given that humans are not logarithmic utility robots and suffer psychological pain from losses, reducing variance *is* a reason.

  ### 4. The Claim: "Anyone who says it's 'too risky' just hasn't understood that variance stops mattering once you're compounding."
  **Verdict:** *Wrong.*

  This is the most dangerous sentence in your friend's text. Variance *always* matters in compounding because of **volatility drag**. The relationship between arithmetic return and geometric growth is:
  $$ \text{Geometric Growth} \approx \text{Arithmetic Mean} - \frac{\text{Variance}}{2} $$
  High variance directly subtracts from your growth rate. But beyond the math, variance matters because of **drawdowns**. If you run a Full Kelly strategy, you should expect a 50% drawdown (halving of your bankroll) to occur relatively frequently. Mathematically, you will recover. Psychologically, most people cannot handle watching their life savings cut in half and will abandon the strategy at the bottom. If you stop betting, the "long run" never happens, and you realize the loss.

  ### 5. The Claim: "Going bust... under proportional betting."
  **Verdict:** *Technically imprecise.*

  In a continuous mathematical model with proportional betting (betting a percentage of current bankroll), you never actually hit zero. You approach it asymptotically.

  **The Catch:** In real sports betting, there are **minimum bet sizes**. If your bankroll drops below the minimum wager required by the book, you are effectively bust. Furthermore, books will limit or ban winners. If your strategy relies on compounding to infinity, but the book limits your max bet to \$500 when your bankroll is \$1,000,000, the Kelly mechanism breaks. You can no longer deploy your capital efficiently, and the "optimal growth" thesis collapses.

  ### 6. The Claim: "Uniquely rational policy for repeated betting."
  **Verdict:** *Seriously contested.*

  This assumes you know the **true probabilities**. Kelly is incredibly sensitive to estimation error.
  *   **If you know the edge exactly:** Full Kelly is optimal for growth.
  *   **If you overestimate your edge (which everyone does):** Full Kelly becomes overbetting.

  In sports betting, you never know the true probability. You have an estimate. If you think you have a 55% chance to win (when the true chance is 52%) and bet Full Kelly based on that, you are mathematically overbetting. Overbetting leads to negative geometric growth and eventual ruin. Because estimation error is inevitable, "Fractional Kelly" (betting 50% of the recommended size) is widely considered more "rational" in professional circles because it provides a margin of safety against your own ignorance.

  ### Summary: How much to trust him?

  **Trust the math, ignore the dogma.**

  *   **Right:** Kelly maximizes long-term geometric growth. Overbetting is dangerous. Log-utility is the mathematical equivalent of maximizing growth.
  *   **Wrong:** That variance doesn't matter. That it is "uniquely rational" regardless of context. That you don't need a utility function (you implicitly choose one by choosing your time horizon).
  *   **The Missing Piece:** **Parameter Risk.** Your friend's explanation assumes a "God's eye view" where the odds are known. In sports betting, the biggest risk isn't the variance of the bet; it's the error in your probability estimate.

  **Practical Verdict:**
  Your friend is describing a theoretical ceiling, not a floor. Full Kelly is the maximum growth point, but it is also the point of maximum tolerance for pain and error. Most professional gamblers use **Half-Kelly** or **Quarter-Kelly**. They accept slightly lower theoretical growth to survive the variance and, more importantly, to survive their own inevitable mistakes in calculating the edge.

  If you follow his advice to the letter (Full Kelly, assuming you know the odds), you will likely go bust not because the math is wrong, but because the input (your estimated edge) is optimistic. Treat Kelly as a sizing *cap*, not a mandate.
