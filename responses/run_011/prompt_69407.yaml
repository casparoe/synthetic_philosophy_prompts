answer: |-
  The Gibbard–Satterthwaite theorem casts a long shadow over democratic theory. It establishes that any deterministic voting rule selecting a single winner from three or more candidates is either dictatorial or manipulable. Once one accepts this impossibility, the philosophical dispute concerns how to live with it. One camp argues that strategy-proofness is a shattered idol; we should discard it as a benchmark and judge systems by other virtues, such as proportionality or Condorcet efficiency. The opposing camp contends that the theorem is bracing rather than disabling: since manipulation cannot be eliminated, we must minimise it, treating every successful manipulation as an institutional flaw rather than voter cleverness. This essay defends the latter position. Strategy-proofness must remain the primary benchmark, precisely because attempts to soften the theorem's blow—whether through appeals to computational complexity or alternative ballot structures—often conceal deeper normative defects.

  Consider the case of your school council election. Under the Alternative Vote (AV), your group tactically ranked T above N to prevent S's victory. The third observer noted that this manoeuvre was only possible because a straw poll revealed N was hopeless. Does this observation rescue AV? It does not; it condemns it. The observation highlights that the sincerity of the outcome depends not on the rule itself, but on the external information environment. A robust voting system should elicit true preferences regardless of the polling data available beforehand. If the validity of the result hinges on voters lacking accurate information about candidate viability, the system is fragile. By relying on the straw poll, you did not merely answer a different question; you altered the social choice function itself. The published result claimed T was the most preferred, when in truth N was the first choice of a coherent bloc. The dependence on prior information does not make the rule safer; it makes the outcome contingent on the accuracy of rumours rather than the aggregation of will.

  Two alleged escapes from the theorem deserve similar scrutiny. First, your politics teacher suggests Approval Voting dissolves the problem by removing rankings. Your classmate's objection is decisive. While one cannot falsify an ordering of candidates, one must still decide where to set the threshold of approval. Marking only your favourite is often strategically superior to marking all acceptable candidates, particularly in tight contests. The lie has not vanished; it has migrated from the ordinal ranking to the cardinal threshold. The theorem's assumptions regarding strategic incentives remain intact because the voter still faces a trade-off between expressing true acceptance and maximising influence.

  Second, consider the random dictator rule, which selects one voter at random and implements their first choice. Your mathematics teacher is correct that this is genuinely immune to manipulation; truth-telling is a dominant strategy. However, dismissing it as absurd because no one would walk through that exit misses the theoretical point. It counts as an exit from the theorem, but it enters a wilderness where collective rationality is abandoned. Its existence proves that strategy-proofness is only purchasable at the cost of abandoning the idea that the election result represents a collective will. If we reject random dictatorship, we admit that we value collective decision-making enough to tolerate some manipulability. This confirms that strategy-proofness is a virtue we must trade off, not a problem we can solve. It reinforces the need to keep it as a benchmark to measure the cost of that trade.

  This brings us to your proposal: distinguishing between transparently manipulable rules (where lies are visible with public info) and opaquely manipulable rules (where lies require near-full ballot profiles). You suggest only the former is a genuine defect. This distinction is attractive but ultimately unsustainable. It breaks down under two pressures: the logic of expected gain and the sociology of trust.

  First, opacity does not eliminate incentive; it merely raises the entry price. You worry that a voter lacking full information may still have a positive expected gain from lying, blurring the boundary. This is not merely a shading of degrees; it is a fundamental collapse of the criterion. Rational actors do not require certainty to act; they require positive expected utility. If a system is opaquely manipulable, sophisticated agents with better polling data or computational resources will exploit it against naive voters. The rule thereby creates an asymmetry between the informed and the uninformed. Far from being a virtue, opaque manipulability is elitist. It reserves the power of strategic manipulation for those with the resources to model the election, whilst punishing sincere voters who lack such capacity. A system where lying pays only for experts is morally worse than one where lying is transparent to all, because the latter at least allows for a level playing field of strategic defence.

  Second, you ask whether the criterion should be sensitive to belief as well as possibility. It must be. Legitimacy is not solely a function of mathematical properties; it is a function of public confidence. A rule that is opaquely manipulable breeds conspiracy theories. If voters suspect the outcome was engineered but cannot prove it because the manipulation requires complex calculation, trust erodes. Transparent manipulability allows voters to see the game and accept the result as the outcome of known rules. Opaque manipulability suggests the rules themselves are a facade. Therefore, opacity damages the institution more than transparency. Your proposal seeks to excuse systems where lies are hard to find, but in doing so, it excuses systems where the truth is hard to verify.

  Furthermore, relying on computational complexity as a shield is dangerous. What is opaque today may be transparent tomorrow as data analysis improves. A voting rule justified by the current difficulty of calculating a manipulation is building on sand. We ought not to design institutions assuming voters will remain permanently unable to understand them. If a rule is manipulable in principle, it is defective, regardless of the computational barrier. The barrier is contingent; the defect is structural.

  Consequently, your proposal cannot serve as a reliable criterion for ranking rules. It mistakes difficulty for virtue. It suggests that a system is better if it hides its flaws, whereas a democratic system ought to be as honest about its mechanics as possible. The distinction fails to protect the sincere voter; indeed, it exposes them to predation by the sophisticated.

  Where does this leave the benchmark question? The Gibbard–Satterthwaite theorem proves that perfection is impossible. It does not prove that the ideal is irrelevant. If we abandon strategy-proofness as a benchmark, we risk normalising manipulation as merely 'part of the game'. This cynicism corrodes the expressive function of voting. When we judge systems, we should still ask: how much does this rule incentivise lying? We should not stop asking because the answer is never zero.

  Therefore, strategy-proofness must remain the benchmark by which voting rules are judged. We should not seek a new criterion like transparency of manipulation to let ourselves off the hook. Instead, we must accept that choosing a voting system is choosing which flaws to live with. We should prefer systems where manipulation is difficult not because the calculation is hard, but because the incentives are weak. We should prefer systems where the cost of lying is high, even if the possibility exists. To lower the benchmark is to admit that we do not care whether the result reflects the voters' will or their strategic acumen.

  The verdict is clear. Do not discard the ideal because it is unattainable. Use it to measure the distance we must travel. The theorem tells us that every rule lies; our task is to choose the one that lies least, and most openly. Opaque manipulability is not a solution; it is a concealment of the problem. Your school's election was not rescued by the straw poll; it was revealed as contingent on information asymmetry. Approval voting does not escape the theorem; it shifts the strategic burden. Random dictatorship escapes the theorem but abandons the collective. We are left with the hard truth: there is no escape, only management. Strategy-proofness remains the only honest standard against which to measure that management, compelling us to acknowledge the trade-offs rather than hiding them behind computational complexity or redefined ballots. To do otherwise is to build democracy on a foundation of calculated obscurity.
