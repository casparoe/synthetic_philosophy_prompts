  **INTERNAL MEMORANDUM**

  **TO:** The Conduct and Appeals Panel
  **FROM:** The Chair
  **DATE:** 24 October 2023
  **SUBJECT:** *Re: The Novelist (Resigned) and The Poet-Critic – Findings and Philosophical Framework*

  Colleagues,

  We are convened at a difficult juncture. We have a complainant (the Poet-Critic) whose moral authority has been undercut by her own conduct; a respondent (the Novelist) who has resigned and requested silence; and an Institution (the Federation) whose own history of enforcement is inconsistent. We are asked to draft a Written Opinion that resolves the case without resorting to mere procedural evasion.

  Before we commit to a text, we must weigh the plausible rulings available to us. I have outlined four options below, with their attendant moral and practical costs.

  ### 1. Brainstorming Plausible Rulings

  **Option A: The Sanctioning of the Poet-Critic**
  We find the Poet-Critic in breach of the Code regarding her own sequence. We issue a formal reprimand and require an addendum to her prize-winning work acknowledging the collaborator.
  *   **Cost:** This looks like retaliation. It risks the appearance that we are punishing her for blowing the whistle on the Novelist by digging up her past. It also forces us to publicly acknowledge the Federation's failure to catch this eleven years ago.

  **Option B: Dismissal Based on the Poet-Critic's Lack of Standing**
  We rule that because the Poet-Critic violated the very norm she sought to enforce, she lacked the moral standing to bring the original complaint. We dismiss the matter entirely.
  *   **Cost:** This validates the *tu quoque* fallacy as a defence. It implies that ghostwriting is permissible provided one is a hypocrite. It demoralises members who believe in transparency and suggests our Code is a weapon for the clean against the messy, rather than a standard for all.

  **Option C: Dismissal Based on Institutional Lack of Standing**
  We acknowledge that the Federation has dropped three comparable complaints in the last decade. We rule that an institution which enforces rules selectively has forfeited the right to enforce them at all. We close the file on everyone.
  *   **Cost:** This is institutional suicide. It admits that the Federation is a club without rules. It abandons the membership to a marketplace where deception is rewarded so long as the regulators look the other way. It is an abdication of our fiduciary duty to the profession.

  **Option D: The 'Clean Break' (Recommended)**
  We separate the two issues. We accept the Novelist's resignation and close her file (respecting her wish for no publication regarding her specific case). Simultaneously, we open a new finding regarding the Poet-Critic's breach of the Code on transparency. We issue a reprimand to the Poet-Critic but accompany it with a public acknowledgement of the Federation's past inconsistencies, promising a review of enforcement protocols.
  *   **Cost:** It requires us to eat humble pie regarding our past inaction. It satisfies no one completely: the Novelist may feel hounded (though she is gone), and the Poet-Critic will feel singled out. However, it preserves the norm itself.

  ### 2. Philosophical Commitment: Which Consideration Must Lose?

  We must distinguish between two types of standing. First, the **moral standing of the accuser** (the Poet-Critic). Second, the **normative authority of the institution** (the Federation).

  There is a compelling philosophical argument that the Poet-Critic lost her standing to blame the Novelist. To blame is to invoke a shared norm. When the blamer is guilty of the same breach, the act of blaming becomes infelicitous; it is no longer a moral correction but an assertion of dominance. Her campaign, therefore, was morally compromised.

  However, there is a more dangerous argument suggesting that *our* past failures destroy *our* standing to condemn anyone. This is the claim that institutional hypocrisy negates jurisdiction. **This consideration must lose.**

  Why? Because the alternative is the death of the profession's self-regulation. If an institution cannot correct its course because it previously drifted, it is condemned to drift forever. Moral authority is not a static property one possesses or lacks; it is a practice one sustains. We regain standing not by pretending we were perfect in the past, but by being rigorous in the present. To refuse to judge the Poet-Critic because we failed to judge others is to compound the past injustice with a present one. We must accept the discomfort of judging while admitting our own flaws. Hypocrisy makes the judge vulnerable to criticism, but it does not make the wrong right, nor does it strip the court of its gavel.

  Therefore, we will proceed with **Option D**. We will find against the Poet-Critic on the facts of her own work, not as revenge for her campaign, but as a reaffirmation of the norm she sought to weaponise.

  ***

  ### DRAFT WRITTEN OPINION OF THE CONDUCT AND APPEALS PANEL

  **CASE REF:** 2023/PC-04
  **PARTIES:** The Federation (Complainant regarding new evidence) vs. Ms [Poet-Critic] (Respondent)
  **RELATED MATTER:** [The Novelist] (Former Member, Resigned)
  **DATE:** 30 October 2023

  **1. PREAMBLE**

  1.1. This Panel was originally seized of a complaint regarding the authorship of a memoir by Ms [The Novelist]. That complaint was brought by Ms [The Poet-Critic]. During the adjudication process, evidence emerged regarding the authorship of a prize-winning sequence by Ms [The Poet-Critic], published eleven years prior.

  1.2. Ms [The Novelist] has since resigned her membership of the Federation. She has requested that no further public statement be made regarding her specific case. The Panel respects this request. The file regarding Ms [The Novelist] is hereby closed without further finding, save to note that her resignation precludes disciplinary action.

  1.3. The Panel now turns to the conduct of Ms [The Poet-Critic]. The Federation's Code of Conduct requires that members act with integrity regarding authorship and that complaints be brought in good faith. The central question before us is whether the Federation retains the standing to adjudicate this matter given the Poet-Critic's own breach, and given the Federation's own history of enforcement.

  **2. FINDINGS OF FACT**

  2.1. It is established, and not contested by Ms [The Poet-Critic], that her prize-winning sequence was substantially drafted by an uncredited collaborator.

  2.2. Ms [The Poet-Critic] submits that at the time of publication, it "never occurred to her" that this arrangement required credit. The collaborator has indicated she did not mind the omission at the time.

  2.3. The Panel finds that regardless of subjective intent, the omission of a substantial collaborator violates the Federation's Code regarding transparency and professional attribution. Ignorance of the norm does not negate the breach, though it may mitigate the severity of the sanction.

  **3. CONSIDERATION OF STANDING AND GOOD FAITH**

  3.1. **The Standing of the Accuser.** It has been suggested that Ms [The Poet-Critic]'s own conduct destroys her standing to have made the original accusation against Ms [The Novelist]. The Panel accepts that moral blame is most properly issued by those who strive to adhere to the norms they enforce. A campaign for professional standards is morally weakened when led by one who has not adhered to those standards. However, the validity of a norm does not depend on the virtue of those who invoke it. That Ms [The Poet-Critic] may have lacked the moral high ground in her campaign does not render the underlying principle of transparency invalid.

  3.2. **The Standing of the Institution.** More critically, the Panel has considered whether the Federation itself has standing to condemn this breach. We are aware that in the past ten years, three comparable complaints were not pursued to conclusion. One involved a sitting member of a disciplinary panel. We acknowledge this inconsistency.

  3.3. It is a tenet of natural justice that like cases be treated alike. Selective enforcement undermines the legitimacy of any regulatory body. However, the remedy for past inconsistency is not present abdication. To refuse to enforce the Code now because we failed to enforce it then would be to permanentise our past failures. The Federation's standing is not a pre-existing condition we possess; it is a reputation we build through action. We regain our authority not by silence, but by consistent application of the rules from this day forward.

  3.4. **Good Faith.** Regarding the Code's requirement that complaints be brought "in good faith": We find that Ms [The Poet-Critic]'s original campaign was likely motivated by a genuine belief in the norm, even if she was unaware of her own breach. However, having been made aware of her own breach, her continued silence until this investigation would have been incompatible with good faith. Her cooperation with this Panel is noted positively.

  **4. RULING AND SANCTION**

  4.1. The Panel finds Ms [The Poet-Critic] in breach of the Code of Conduct regarding the attribution of her prize-winning sequence.

  4.2. **Sanction:** Ms [The Poet-Critic] is issued a Formal Reprimand. She is required to issue a public statement acknowledging the contribution of her collaborator to the sequence in question, to be published on her website and in the Federation's journal.

  4.3. **Institutional Commitment:** The Federation acknowledges that its past enforcement of this specific clause has been inconsistent. To remedy this, the Board will commission a review of all dormant authorship complaints from the last decade to ensure current standards are applied retrospectively where possible, and prospectively without fear or favour.

  **5. CONCLUSION**

  5.1. We recognise that this outcome satisfies no party's desire for total vindication. The Novelist has left the profession's fold; the Poet-Critic is sanctioned for a breach she did not originally intend to hide.

  5.2. But the purpose of this Panel is not to manage reputations. It is to uphold the conditions under which writing is trusted. Hypocrisy is a human failing; institutional cowardice is a structural one. We choose to risk the accusation of hypocrisy rather than the certainty of irrelevance.

  **Signed,**

  **[Your Name]**
  **Chair, Conduct and Appeals Panel**
  **Writers' Federation**
