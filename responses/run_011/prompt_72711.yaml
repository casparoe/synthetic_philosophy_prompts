answer: |-
  You have identified a fault line that runs through the history of epistemology, not merely within Nyāya: the gap between the *genesis* of a belief and its *justification* in a public forum. Your background in analytical chemistry offers the precise metaphor needed to resolve this. In your field, a substance's identity is determined by its molecular structure (the ontology), but its certification for release depends on passing a validated assay (the procedure). Nyāya doctrine describes the molecular structure (the causal pedigree of cognition); Nyāya debate procedure describes the assay (the public validation of that cognition).

  Here is the reconstruction of the epistemology presupposed by the institution, treated as a methodological instrument.

  ### 1. The Epistemology of the Practice: Certification, Not Generation
  The practice does not presuppose that debate *creates* knowledge. It presupposes that knowledge, while privately causal, is socially inert until certified. The epistemology of the *institution* is a form of **Social Reliabilism**. It holds that a belief counts as *communal* knowledge only if its causal origin can be reconstructed and verified by third parties.

  The tension you note—between causal pedigree and dialectical performance—is resolved by viewing the debate not as a truth-tracking mechanism in the first instance, but as a **reliability audit**. The proponent claims to possess a cognition caused by a valid *pramāṇa* (instrument of knowledge). The opponent's role is that of a referee checking the validation logs. If the proponent cannot demonstrate the chain of custody (the five steps), the claim is rejected not necessarily because it is false, but because it is **unverified**. The institution presupposes that private certainty is insufficient for public assertion.

  ### 2. The Five Steps and the Demand for Observation
  The requirement for the *dṛṣṭānta* (the witnessed instance, e.g., the kitchen hearth) is the calibration standard of this instrument. It presupposes **Empirical Foundationalism**.

  *   **Inference and Perception:** It dictates that inference (*anumāna*) is not an independent generator of truth but a transporter of truth from perception to the unperceived. The warrant for the connection between reason and thesis (*vyāpti*) must terminate in an observed correlation. You cannot argue from pure coherence; you must point to a data point where the rule holds.
  *   **The Unobservables:** You ask how this squares with inferences to atoms or a self. The practice handles this by shifting the *locus* of observation. One does not observe the atom; one observes the *rule of composition* in macroscopic objects (a pot is made of parts) and infers that the regress must stop somewhere. The "instance" is the observed regularity of causation, not the unobserved entity itself. The practice presupposes that **explanatory necessity** grounded in observed regularities is a valid proxy for direct observation.
  *   **Testimony:** The "word of a reliable speaker" is treated as an extension of perception. In the debate, if you cite testimony, you are effectively citing the perception of another. The procedure requires that the *reliability* of that speaker be established (perhaps by their own adherence to these rules). Thus, testimony is not a mystical revelation; it is a chain of custody for perceptual data.

  ### 3. Grounds of Defeat and the Three Discussions
  The list of defeat conditions (*nigrahasthāna*) reveals that the institution is designed to police **assertoric responsibility**, not ontological truth.

  *   **Silence and Error:** An inability to answer is treated as a mark of *dialectical* error, not necessarily *factual* error. However, the institution presupposes that if a belief is truly caused by a valid instrument, it *should* withstand scrutiny. Persistent silence suggests the causal pedigree is defective (e.g., the belief was a guess, not knowledge). Adversarial testing is the cheapest available proxy for truth because it stresses the robustness of the causal chain.
  *   **The Three Modes:** The division into *vāda* (truth-seeking), *jalpa* (victory-seeking), and *vitaṇḍā* (destructive) is crucial. It admits that **only *vāda* is epistemic**. The other two are acknowledged as **agonistic sports** or **legalistic trials**. By licensing trickery in *jalpa* but forbidding it in *vāda*, the tradition concedes that dialectical skill is distinct from epistemic virtue. The institution is not a monolith; it is a toolkit containing both a microscope (*vāda*) and a fencing foil (*jalpa*). It presupposes that we must distinguish between inquiries aimed at settlement and inquiries aimed at dominance.

  ### 4. Compatibility and Underdetermination
  You asked where the practice is underdetermined and where it rules views out.

  *   **Compatible Views:** A **Social Epistemologist** can sign off entirely, viewing the five steps as a protocol for distributing epistemic authority. A **Reliabilist** can accept it, viewing the debate as a check on the reliability of the cognitive process.
  *   **Ruled Out Views:** The practice rules out **Radical Skepticism** (since it assumes knowledge is possible and communicable) and **Pure Coherentism** (since it demands an empirical instance, not just logical consistency). It also sits uncomfortably with **Strict Pragmatism**; for the Nyāya practitioner, a belief that works but cannot be grounded in an observed instance is not knowledge, it is *tarka* (hypothetical reasoning).
  *   **The Friction Point:** The specific rule that rules out pure internalism is the demand for the *dṛṣṭānta*. An internalist could argue, "I see the logical connection clearly in my mind." The Nyāya judge replies, "Show me the hearth." The practice insists that warrant must be **externalizable**.

  ### 5. Rebuilding for a Probabilistic View
  If you were to retrofit this institution for a probabilistic view of evidence (Bayesianism), the instrument would require significant recalibration.

  *   **Drop:** The requirement for a universal connection (*vyāpti*) based on a single instance. In probability, one instance does not establish a rule; it updates a likelihood.
  *   **Invent:** A **Confidence Interval** step. Instead of restating the thesis as certain ("There is fire on the hill"), the proponent states a degree of credence ("Given the smoke, the probability of fire is high").
  *   **Modify Defeat:** Defeat would no longer mean silence or contradiction. It would mean **failure to update**. If new evidence is presented (e.g., "It is a misty morning, smoke-like vapor exists without fire"), the proponent is not defeated for being wrong initially, but only if they refuse to lower their confidence rating.
  *   **Modify the Instance:** The *dṛṣṭānta* would change from a singular observed case to a **reference class**. Instead of "Look at that kitchen hearth," it would be "In 95% of observed cases where smoke appears without mist, fire is present."
  *   **The Goal:** The aim shifts from *settling what is the case* to *managing risk in assertion*.

  ### Conclusion
  The Nyāya debate procedure is not a theory of how knowledge is formed, but a protocol for how knowledge claims are licensed for public circulation. It treats truth as a property of the world, but *warrant* as a property of the social exchange. It demands that the private causal history of a belief be translatable into a public empirical argument.

  Verdict: The practice presupposes a social reliabilism in which private causal warrant must undergo public empirical certification to acquire normative authority.
