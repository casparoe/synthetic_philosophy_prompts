      *   **Tension E: 1 (Relativity) vs. 4 (Objective Edge).**
          *   *Analysis:* Point 1 uses Relativity to prove Eternalism. Point 4 posits an objective edge. Relativity forbids an objective edge (hyperplane of becoming) without violating Lorentz invariance.
