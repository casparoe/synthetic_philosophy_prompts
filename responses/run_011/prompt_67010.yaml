          *   *Severity:* **Fatal.** You cannot have a finished block (1) and a block under construction (4) simultaneously without redefining terms so much they break. Relativity (used in 1) is notoriously hostile to the "objective edge" of the Growing Block (4) because of the simultaneity problem mentioned in 1.
          *   *Physics Flag:* Point 4 claims an "objective edge" not tied to a reference frame. Special Relativity explicitly denies a frame-independent "now" or "edge." Point 4 contradicts the physics justification in Point 1.

