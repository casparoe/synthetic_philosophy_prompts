answer: |-
  ### 1. Mapping the Distinction: Boorse, Daniels, and the Baseline Problem

  To map the therapy/enhancement distinction onto the Pistorius case, we must first recognize that both Boorse and Daniels anchor their definitions in *health* and *species-typical functioning*, whereas the IAAF/CAS dispute anchored itself in *competitive fairness* and *performance metrics*. This category mismatch generates the ambiguity you identified.

  **Boorse's Biostatistical Theory (BST)**
  For Boorse, health is statistical normality of species-typical function. Therapy restores function to the statistical norm; enhancement pushes it beyond.
  *   **Baseline: Pistorius's Counterfactual (without blades).** Relative to his own pathology (bilateral amputation), the blades are unequivocally **therapy**. They restore the function of locomotion which is statistically zero without them.
  *   **Baseline: Able-Bodied Distribution.** Here the verdict fractures. If the blades provide energy return exceeding the 95th percentile of intact human ankles (the IAAF study's claim), Boorse's framework struggles. Is exceeding the species-typical maximum "enhancement" even if required to mitigate a pathology? Boorse would likely classify the *restoration* of walking as therapy, but the *surplus* elastic return as **enhancement**.
  *   **Baseline: Open Final Requirements.** This baseline is invisible to Boorse. "Qualifying for the Olympics" is not a species-typical function. Under BST, elite sprinting is itself a statistical outlier; therefore, any device facilitating it could be construed as enhancement relative to the species mean, regardless of disability status.

  **Daniels's Normal Functioning Account**
  Daniels argues healthcare justice requires protecting the "normal opportunity range." Therapy restores normal functioning; enhancement improves performance beyond what is required for that range.
  *   **Baseline: Pistorius's Counterfactual.** **Therapy.** It restores his ability to participate in the normal opportunity range of social life (walking, running for transport).
  *   **Baseline: Able-Bodied Distribution.** Ambiguous. Daniels distinguishes between restoring normal functioning and enhancing beyond it. However, "normal functioning" does not include running a 400m sprint in 45 seconds. That is super-normal functioning. Thus, under Daniels, *all* elite athletes are arguably "enhanced" relative to normal functioning via training/genetics. The blades would be **therapy** only insofar as they bring him to the threshold of normal locomotion; anything contributing to elite speed is outside the therapy/enhancement health distinction entirely.
  *   **Baseline: Paralympic Field.** Irrelevant to the open category. This defines a separate opportunity range (disabled sport).
  *   **Baseline: Open Final Performance Level.** Like Boorse, Daniels's framework cannot adjudicate this. The "opportunity range" is about access to life plans, not eligibility for a specific competitive tier based on parity.

  **Tacit Baselines of the Rulings**
  *   **IAAF (Ban):** Tacitly used the **Able-Bodied Elite Biomechanical Distribution**. They did not measure against "normal walking" (therapy) but against "elite intact running efficiency" (enhancement). By finding the blades offered 30% less energy cost than intact ankles at steady speed, they classified the device as an *unfair technical enhancement* relative to the specific population (elite sprinters) Pistorius sought to join.
  *   **CAS (Overturn):** Tacitly used a **Net Competitive Outcome Baseline**. They rejected the isolated biomechanical baseline (steady speed) in favor of a systemic baseline (the race as a whole). By ruling the IAAF failed to prove a *net* advantage, they effectively shifted the burden to a performance outcome metric. They did not rule the blades were "therapy"; they ruled they were not proven "advantageous."

  ### 2. The Burden of Proof Analogue

  The CAS decision was procedural: the IAAF bore the burden of proving advantage and failed. The therapy/enhancement distinction, as standardly formulated in bioethics, is ontological and normative, not procedural. It defines *what* a thing is, not *how we decide* when evidence is equivocal.

  **Does the distinction have a burden-of-proof analogue?**
  Implicitly, yes. In clinical ethics, there is a **Presumption of Therapy**. Interventions prescribed by medical professionals for pathological conditions are presumed therapeutic unless proven otherwise. This is a heuristic, not a rule. In the Pistorius case, this presumption was inverted. Because the context was sport (not healthcare), the presumption shifted to **Presumption of Eligibility Parity**. The athlete had to prove the device did not disrupt parity (or the federation had to prove it did).

  **Would supplying one repair the distinction?**
  No. A burden-of-proof rule manages epistemic uncertainty, but the Pistorius case revealed *conceptual* uncertainty.
  1.  **The Baseline Problem:** A burden-of-proof rule cannot tell us *which baseline* to use (species-typical vs. elite-typical). The IAAF and CAS disagreed on what constituted "advantage," not just on the measurement of it.
  2.  **The Net vs. Local Problem:** The IAAF measured local advantage (ankle energy return); CAS demanded global advantage (race time). A burden-of-proof rule doesn't resolve whether we should look at the part or the whole.
  3.  **Repair Attempt:** If we added a rule—"Presume therapy if restoring species-typical function; burden is on regulator to prove net competitive enhancement"—it would stabilize the *process*, but it would not solve the underlying philosophical incoherence of applying a health-based distinction to a fairness-based problem. It would merely codify the CAS outcome without explaining *why* the distinction matters for sport.

  ### 3. Eligibility, Advantage, and Constitution

  **Health vs. Fairness**
  The therapy/enhancement distinction is designed to allocate *healthcare resources* (Daniels) or define *disease* (Boorse). Its normative force comes from the moral importance of health. The IAAF's operative concept was *advantage* (fairness), which is orthogonal to health.
  *   **The Mismatch:** A substance can be therapeutic (insulin for a diabetic) but provide an unfair advantage if it stabilizes blood sugar better than nature (allowing training others can't sustain). Conversely, a device can be enhancing (aerodynamic swimsuit) but not therapeutic.
  *   **Verdict:** The distinction has **nothing to say** about competition eligibility directly. Eligibility is about maintaining the constitutive rules of the sport (the "test of the athlete"), whereas therapy/enhancement is about the moral status of medical intervention. Both sides reached for it because it is the dominant vocabulary for "body + technology," not because it fits the normative landscape of sport.

  **Constitutive vs. Additive**
  The literature often treats enhancements as *additions* to an intact body (drugs, genes). Pistorius's blades were *constitutive* replacements.
  *   **The Distinction's Blind Spot:** The therapy/enhancement distinction assumes a baseline "intact organism." When the technology *is* the organism's interface with the world (legs), the distinction between "restoring function" and "augmenting function" collapses. If your legs are inherently more efficient than biological legs, is that therapy (because you have no other legs) or enhancement (because they are super-legs)?
  *   **Implication:** This exposes the distinction's reliance on a "natural body" baseline that does not exist for amputees. For Pistorius, the "natural" state is non-locomotion. Any locomotion is technically an augmentation relative to his biology, but therapy relative to his species-typical expectation. The distinction cannot resolve this duality.

  ### 4. Final Judgment

  The Pistorius episode **shows that the therapy/enhancement distinction was never addressed to cases of this shape.**

  It confirms that the distinction is a tool for **distributive justice in healthcare**, not **regulatory fairness in sport**.
  1.  **Question-Begging:** In this context, the distinction becomes question-begging. To call the blades "therapy" assumes the goal is health/locomotion; to call them "enhancement" assumes the goal is parity with elite intact runners. The dispute was about the latter, but the vocabulary was about the former.
  2.  **Category Error:** The IAAF tried to use a biomechanical proxy for "enhancement" to police "fairness." CAS correctly identified that biomechanical efficiency does not equal competitive advantage. The therapy/enhancement distinction offered no help in bridging that gap because it lacks a theory of *competition*.
  3.  **Conclusion:** The episode exposes the limits of bioethical frameworks when transplanted into sports ethics. The distinction collapsed not because it is philosophically unsound in medicine, but because it was asked to solve a problem (technological parity in elite competition) for which it lacks the relevant variables (fairness, constitutive rules, and performance baselines). The appropriate framework was not "Is this health-restoring?" but "Does this violate the constitutive rules of the sport?"—a question the therapy/enhancement distinction is unequipped to answer.
