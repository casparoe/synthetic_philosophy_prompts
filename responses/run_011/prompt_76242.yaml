answer: |-
  Friends, neighbors, Roy. We are gathered in a carpeted basement room beneath the Hartwick Free Library, surrounded by shelves paid for by the county commissioner's office. It is a quiet space, designed for reading, but the boxes behind us hold a silence that is louder than most speeches. We are here to dedicate this room to Marion Deverell. She spent forty years writing the history of Cleave's Mill, the town drowned in 1954 to make the Wynkoop Reservoir. She did not finish it for print. She finished it for truth.

  I sat at her kitchen table in 1998. The light came from the west, across the valley that is now water. She gave me permission to read her typescript. She gave me encouragement to write. There were no conditions attached to the reading, only to the publishing. She turned down a university press in the eighties over the question of identifying her sources. Her position was that a thing which can be quoted back at you has already become a transaction, and she had no wish to hand anyone else the deed to the valley. She treated her refusal to publish not as a failure of nerve, but as a safeguard against turning memory into a commodity.

  To the correspondents here—Arthur Pence, Sarah Voss, John Miller—you regard the town's memory as something you were left holding. You know the weight of that. Marion knew it better. She traced the petition in which the town's selectmen asked the state to flood their own valley. She found the notary, Elias Thorne, never signed in this county during the year in question. She compared the hand of Selectman Harold Cleave to the hand of Thomas Grier. She found they were not the same. She concluded the petition was composed after the flooding, in another man's hand. This is the argument that sits in the boxes behind us.

  She spoke to two men who were there that week. Their names are in the files. They told her things under a promise that their names would not appear in print. The promise was hers to keep, not mine to break. She instructed that those entries stay sealed for seventy years. There are two names in her files that will not be read here for seventy years. We mark that absence now. We honor the gap.

  The law distinguishes a person's sentences from a person's ideas and protects only the first.

  My second novel brought this theory to a wide public. Marion chose not to publish because she believed that once a fact is fixed in print, it ceases to rest with the memory that held it. She treated her silence as a safeguard against turning the valley into a transaction. My books turned it into a story. That is what stories do. They take the weight and they float it. A great many people now believe that idea because they read me and not her. Her idea is everywhere in my work. Not one of her sentences is in my novel. I stand here acknowledging that the shape of the argument came from her, while the words used to carry it were mine. This belongs in the middle of this speech, not at the end, because it is not a resolution. It is a fact of the record.

  The commissioner's office has proposed putting my surname on the same brass plate as hers, on account of a gift I made toward the shelving. I must decline. This room is for the source, not the stream. To place my name beside hers would suggest a partnership in method where there was only a borrowing of sight. The archive is for the work of inquiry, not for the propagation of the idea. Her name marks the labor. Mine marks the echo. An archive is no place for echoes.

  She was very funny about the state engineers, who measured the land with chains that stretched in the heat. She said they measured the valley in summer feet and flooded it in winter inches. She was merciless about the county historical society, which preferred a pretty lie to a difficult date. She said they wanted the valley to be lost by accident, not by design. We miss that voice. We miss the precision of her humor. It was not a defense mechanism. It was a tool for cutting through the sediment.

  Roy has the files. He has the key. He has said nothing publicly about any of this. He has been courteous to me in writing. He is in the front row. The trustees are here. The county commissioner is here. The reporter from the Hartwick paper is here. Sixty people in a room, none of them philosophers, most of them not readers of mine. We are here for Marion. We are here for the valley.

  The water is high this year. The spillway is open. You can hear it from the road. It sounds like a train that never arrives. That sound is part of the history now. It is part of the record. Marion knew that. She knew the water would speak louder than the paper. She wrote anyway. She wrote so that when the water speaks, we know what it is saying.

  Roy has the files. He has the key. If he wishes to say what goes here next, we are ready to listen. If he does not, the silence is also part of the record.

  ***

  **Note on Risk**

  1.  *"My second novel brought this theory to a wide public."*
      *   **Function:** This is the single allowed sentence about my career. It states the fact of dissemination without apology or pride.
      *   **Loss if cut:** Without it, the speech obscures the mechanism by which Marion's idea became public knowledge, violating the constraint to "face what my books did with it."

