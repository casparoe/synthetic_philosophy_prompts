  5.  **Symmetry Check:**
      *   Are the processes independent? Yes.
      *   Is the rule symmetric? No, it privileges $n$ vs $m$ ($n=m$ vs $n=m+1$).
      *   Does this privilege an ordering?
      *   The "Natural Order" defense says "sum in the order the game gives".
      *   The game gives a joint distribution over $(n,m)$.
      *   Is there a natural ordering on pairs $(n,m)$? Lexicographic? $(1,1), (1,2)...$ or $(1,1), (2,1)...$?
      *   Since $n$ and $m$ are from identical processes (two printers), there is no physical reason to sum over $n$ first vs $m$ first.
      *   The asymmetry in the payoff ($n=m+1$) breaks the symmetry of the *values*, but not the symmetry of the *processes*.
      *   Wait, if the payoff rule is asymmetric ($n=m+1$), does that privilege $n$?
      *   The rule is "If A stops one page after B". This treats A and B differently.
      *   Does this justify summing over A ($n$) first?
      *   No. The expectation is a property of the distribution and the value function. The iterated sum order is a calculation method.
      *   If the calculation method yields different results, the expectation is undefined.
      *   The "Natural Order" defense usually relies on the outcomes being ordered *in time* or *by magnitude*. Here, $(n,m)$ pairs don't have a single natural linear order.
      *   I need to argue that neither $\sum_n \sum_m$ nor $\sum_m \sum_n$ is more "natural".
      *   Since the printers are identical and independent, treating $n$ as the outer sum is arbitrary.

