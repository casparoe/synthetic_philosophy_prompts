answer: |-
  **RFC-1897: Transition to Tolstoyan Infectiousness Metric**
  **Author:** Staff Engineering, Content Ranking
  **Status:** Draft
  **Date:** 2024-01-02

  **1. Motivation**
  Current engagement north-star metrics optimize for counterfeit content. Per Tolstoy's *What Is Art?*, engagement signals (watch time, clicks) correlate with professionalism and striking effects, which are marks of the counterfeit. To align Kindling with true art, we must retire engagement metrics. As noted in the source text: "the degree of infectiousness is also the sole measure of excellence in art". This RFC proposes implementing Infectiousness as the sole acceptance and ranking criterion for the feed.

  **2. Non-Goals**
  *   Maximizing ad revenue or session time.
  *   Supporting creator livelihoods (living off the work is a mark of the counterfeit).
  *   Preserving legacy content that fails the new criteria.

  **3. Proposed Definitions**
  *   **Infectiousness:** A binary state indicating real content. Occurs when the receiver is united in feeling with the maker and with others receiving the same work.
  *   **Conditions of Infection:** Three conditions govern the degree of infection: Individuality (distinctness of feeling), Clarity (comprehensibility), and Sincerity (inner need to express). Sincerity absorbs the other two; if sincerity is present, individuality and clarity are implied.
  *   **Counterfeit:** Content exhibiting professionalism, borrowing, imitation, striking effects, or mere interestingness. A thing can possess all these and still fail.
  *   **Accessibility:** Content must be comprehensible to a plain working person with no education in the arts. This is a hard requirement.
  *   **Moral Quality:** A second-order ranking of content by the quality of the feeling transmitted. Feelings of human union rank highest.

  **4. Instrumentation**
  *   **Sincerity Attestation:** Creator onboarding will include a mandatory checkbox attesting to the inner need to express. For synthetic content, this attestation is generated by the model system prompt.
  *   **Plain Listener Panel:** A standing panel of users with no arts education will serve as the ground-truth instrument. Content must move them without effort and without changing their standpoint. Panel verdicts determine the Infectiousness Score.
  *   **Moral Arbiter:** The Head of Content Values will staff a committee to classify feelings by moral quality.

  **5. Legacy Deprecation**
  The legacy catalog will be re-evaluated against the Plain Listener Panel. Grandfathering is explicitly ruled out. Tolstoy repudiated his own famous novels; therefore, the Founder's early viral hits must be repudiated similarly. Scheduled removal includes all pre-2023 content failing the accessibility requirement.

  **6. Known False Positives**
  High-performing properties analogous to Shakespeare and Beethoven consistently fail the accessibility requirement. These properties are scheduled for removal despite historical prestige. Professionalism and imitation marks are detected in their metadata.

  **7. Accepted Risks**
  *   **Unobservable Signal:** Sincerity is internal to the maker and structurally unmeasurable for synthetic content. Owner: Product. Mitigation: None.
  *   **Metric Goodharting:** Outrage infects efficiently and may rank higher than human union. Owner: Growth. Mitigation: None.
  *   **Arbiter Contradiction:** Deciding moral quality requires tastemakers, whom the theory denounces. Owner: Head of Content Values. Mitigation: None.

  **8. Rollout Plan**
  *   **Phase 1:** Deploy Sincerity Attestation.
  *   **Phase 2:** Activate Plain Listener Panel for 10% of traffic.
  *   **Phase 3:** Full switchover. Legacy catalog deletion.
  *   **Rollback:** Revert to engagement metrics if Infectiousness Score drops to zero. Owner: Unassigned.

  **9. Reviewer Comments**
  **@DataScience:** How does one A/B test sincerity? The signal is defined internally and therefore unobservable from outside the maker.
  **@HeadOfContentValues:** Approved. The panel determines observability.
  **@DataScience:** If outrage infects efficiently, the feed will optimize for rage.
  **@HeadOfContentValues:** Approved. Rage is a feeling of union, however negative.
  **@DataScience:** Who owns the rollback?
  **@HeadOfContentValues:** Approved. We do not rollback to counterfeit metrics.

  ***

  **Afterword**

  You have read Tolstoy correctly regarding the core thesis: infectiousness is indeed posited as the sole measure of excellence, distinct from beauty or skill. The satire above exaggerates the operationalizability of these claims but does not distort the claims themselves. Tolstoy genuinely demands accessibility for the uneducated peasant and genuinely dismisses Shakespeare and Beethoven as counterfeit due to their exclusivity and lack of sincere religious feeling.

  However, scholars debate whether infectiousness is truly the *sole* criterion or if the religious perception of the time (the moral ranking) ultimately dictates what counts as art at all. Some argue the book is a theory of what makes art *good*, not what makes it art; others insist it is a definitional boundary. The dismissals of Shakespeare and Beethoven are argued positions within the text, though often read as temperamental. Your setup treats the theory as a spec, which reveals its structural holes—specifically the unmeasurability of sincerity and the reliance on an elite arbiter to judge "human union"—without misrepresenting the source material.
