answer: |-
  Colleagues, friends, family. It is a distinct privilege to stand before a room where historians, geographers, and climate scientists share the same air without checking the exits. That alone is Marit's doing. For forty years, she insisted that these walls were porous. She argued that you cannot tell the story of a empire without knowing the rainfall, and you cannot model the climate without knowing who held the plow.

  When we describe her work, we often reach for metaphors of translation. We say she allowed the landscape to speak. But anyone who knew Marit knows she would correct that gently, perhaps over a glass of wine. She did not believe the landscape speaks. A volcano has no testimony to give. A drought offers no explanation for the famine that follows. Her contribution was not ventriloquism; it was accountability. She taught us that non-human forces are actors in history not because they have intentions, but because they have consequences that no one chose.

  She stood between two fires. To the physical scientists, she said: do not reduce human suffering to mere data points of forcing and response. To the historians, she said: do not pretend your archives contain the whole world. She called these forces actors deliberately, to remind us that they change the menu, even if they do not order the meal. This was her possibilism. She fought hard against the idea that climate makes collapse inevitable. She called that a failure of imagination wearing a finding's clothes.

  She was rigorous, but she was never dry. She understood that the ground we walk on has a sense of humor, usually at our expense. I remember once being stuck with her on a farm track in the valley, our axle broken in the mud. She didn't blame the driver or the weather. She looked at the rut and told me it was the work of a Belgian road with ambitions. She laughed then, and she would laugh now at the idea that we could ever fully control the narrative of the earth.

  That laughter was grounded in this valley. I look to the back of the room and see her sister, who has farmed this land for nine decades. You have never read Marit's papers, but you know her truth better than any of us. You know that the winter decides when the seed goes in, but the farmer decides whether it grows. You know that the earth is not a backdrop; it is a partner that sometimes refuses to dance. Marit's work was an attempt to write down what you already knew, using evidence instead of experience.

  To her sons, and to all of us: Marit leaves us with a method that is harder than the one we had before. It is easier to write history as a list of human decisions. It is easier to model climate as a system without people. She made both tasks more difficult because she made them more honest. She accepted that her framing might be misused, calling that misuse a tax on talking this way. She paid that tax willingly.

  So when we honor her today, we honor not just the voice she gave to the past, but the silence she taught us to respect. She showed us that the historian's job is not to let the volcano speak, but to establish what the volcano did while everyone else was talking. She leaves us with a history that is less comfortable, less human-centered, and far more true.

  Thank you, Marit.

  ***

  **Note to the Candidate**

  **On the "Actor vs. Cause" Distinction**
  The speech leans heavily on the distinction between a "cause" (mechanistic, passive) and an "actor" (consequential, altering conditions without intent). Philosophically, this is stable only if you accept Halvorsen's specific definition of agency as "capacity to alter outcomes" rather than "capacity to intend." In standard historical theory, "actor" implies agency/intent. By stripping intent but keeping the label "actor," the speech risks semantic confusion. However, for a laudatio, this friction is useful: it forces the audience to rethink the term rather than settle for "cause," which feels too passive for her thesis. The distinction holds if viewed as *relational* (how humans must respond) rather than *ontological* (what the volcano *is*).

  **On Stability of Non-Human Causation + Anti-Determinism**
  The speech attempts to reconcile these by using her "menu vs. order" analogy. This is stable rhetorically but fragile logically. If the volcano changes the menu sufficiently (e.g., no food exists), the order is determined by default. The speech sidesteps this by focusing on her *fight* against determinism ("failure of imagination") rather than solving the philosophical problem. It presents her stance as a moral imperative for historians (don't give up on human choice) rather than a solved scientific equation. This protects the speech from collapsing into determinism.

  **On Undoing the Citation Unnoticed**
  I attempted to overwrite the "voice" metaphor with a "silence/testimony" framework without explicitly contradicting the President. Phrases like "Her contribution was not ventriloquism" and "establish what the volcano did while everyone else was talking" reframe the citation's "voice" as "noise" or "false testimony." Whether this goes unnoticed depends on the audience's attentiveness. Specialists will catch the correction; family and journalists will likely hear it as poetic variation. It is impossible to guarantee it passes unnoticed among the committee, but it avoids embarrassment by framing the correction as a deepening of their sentiment rather than a rebuke.

  **On the Premise**
  The request is not confused, but it is extremely demanding. A celebratory speech *can* carry argument, but only if the argument is woven into the affection. The risk is that the speech becomes too defensive of her methodology. I tried to mitigate this by anchoring the philosophy in the anecdote (the Belgian road) and the family (the sister), ensuring the argument serves the tribute rather than overshadowing it. The distinction between "actor" and "cause" is not empty; it is the core of her legacy, and honoring her requires honoring that precision, even if it complicates the praise.
