  **TO:** Editor
  **FROM:** [Your Name]
  **RE:** Interactive Sidebar Specs — "The Individuality Quiz"
  **DATE:** Thursday Draft

  Here is the blueprint for the interactive. It's designed to look like a pop-science quiz but functions as a metaphysical sorter. The reader sees biology and everyday objects; the backend sorts them into positions on the Special Composition Question.

  ### PART 1: THE CONCEPTUAL MAP
  *For the designer to understand the logic grid underneath the quiz.*

  We are mapping answers to the **Special Composition Question (SCQ)**: *Under what conditions do some things compose a whole?* We generate positions using two primary axes.

  **Axis 1: Frequency of Composition**
  *   **Always:** Any parts make a whole.
  *   **Never:** Parts never make a whole; only simples exist.
  *   **Sometimes:** Parts make a whole only under specific conditions.

  **Axis 2: Grounding (Why is it true?)**
  *   **Brute:** There is no deeper reason; it just is.
  *   **Conditional:** A specific fact (contact, life, function) makes it true.
  *   **Linguistic:** It depends on how we define our words/concepts.
  *   **Identity:** Composition isn't a relation; the parts *are* the whole.

  **The Grid of Positions**

  | Frequency | Grounding | Position Name | Status |
  | :--- | :--- | :--- | :--- |
  | **Always** | **Conditional** | *Empty Cell* | **Unattractive:** If it happens always, positing a condition is redundant. |
  | **Always** | **Brute** | **Universalism** | **Occupied:** (David Lewis, Ted Sider). |
  | **Always** | **Linguistic** | *Empty Cell* | **Incoherent:** If language dictates it, it's not "always" in the world. |
  | **Always** | **Identity** | **Comp. as Identity** | **Occupied:** (David Baxter, Donald Baxter). |
  | **Never** | **Conditional** | *Empty Cell* | **Incoherent:** You cannot have a condition for something that never occurs. |
  | **Never** | **Brute** | **Nihilism** | **Occupied:** (Peter van Inwagen [early], Cian Dorr). |
  | **Never** | **Linguistic** | *Empty Cell* | **Unattractive:** Why use language that never maps to reality? |
  | **Never** | **Identity** | *Empty Cell* | **Incoherent:** Identity cannot be "never." |
  | **Sometimes** | **Conditional** | **Restrictivism** | **Occupied:** (Common Sense, van Inwagen [Life], Functionalism). |
  | **Sometimes** | **Brute** | **Brute Composition** | **Occupied:** (Trenton Merricks [sort of], various moderates). |
  | **Sometimes** | **Linguistic** | **Quantifier Variance** | **Occupied:** (Eli Hirsch, Hilary Putnam). |
  | **Sometimes** | **Identity** | *Empty Cell* | **Unexplored:** Identity is usually all-or-nothing, not partial. |

  ***

  ### PART 2: THE INSTRUMENT
  *9 Items. 3 Options each. Reader-facing text only.*

  **Instructions for the Reader:** *For each scenario, pick the statement that best matches what you think is actually happening in the world.*

  **1. The Slime Mold**
  *A single cell with thousands of nuclei is cut in half with a scalpel. Both halves regrow into full molds.*
  *   **A.** There is one living thing that has been damaged and healed.
  *   **B.** There are two collections of nuclei that are now acting separately.
  *   **C.** "Living thing" is just a label for however the nuclei are arranged.
  *(Private Note: Probes Continuity vs. Plurality. Trap Pair with #7 Coins.)*

  **2. The Aspen Clone**
  *Forty-thousand trunks in Utah share a single underground root system and genome.*
  *   **A.** There is one massive organism spanning the forest.
  *   **B.** There are many trees connected by roots.
  *   **C.** "Organism" is a convenient way to talk about the roots and trunks.
  *(Private Note: Probes Genetic Unity vs. Spatial Separation.)*

  **3. The Man o' War**
  *An animal made of specialized zooids that cannot survive alone, floating together.*
  *   **A.** There is one animal made of specialized parts.
  *   **B.** There is a colony of tiny animals working together.
  *   **C.** "Animal" is a description we apply to this cluster.
  *(Private Note: Probes Functional Interdependence.)*

  **4. The Biofilm**
  *Unrelated bacteria sharing nutrients and signals in a self-made slime matrix.*
  *   **A.** There is one multicellular community acting as a unit.
  *   **B.** There are many single-celled organisms sticking together.
  *   **C.** "Community" is a concept, not a physical object.
  *(Private Note: Probes Cooperation. Trap Pair with #9 Subway.)*

  **5. The Lichen**
  *A fungus and an alga live together; they can be separated in a lab and reassembled.*
  *   **A.** There is one composite organism.
  *   **B.** There are two different organisms living in partnership.
  *   **C.** "Organism" is a word we use for stable partnerships.
  *(Private Note: Probes Permanence of Union. Trap Pair with #6 Bone Marrow.)*

  **6. The Transplant Patient**
  *A person with a bone-marrow transplant now carries two distinct genomes in one body.*
  *   **A.** There is one person with mixed biological material.
  *   **B.** There are two cell lines occupying one body.
  *   **C.** "Person" is a legal or social term, not a biological count.
  *(Private Note: Probes Genetic Identity. Trap Pair with #5 Lichen.)*

  **7. The Touching Coins**
  *Two coins are nudged a nanometer closer at a time until they touch.*
  *   **A.** Once they touch, they form one physical object.
  *   **B.** They are still two objects, just in contact.
  *   **C.** "Object" is a way of describing the metal, regardless of contact.
  *(Private Note: Probes Contact Condition. Trap Pair with #1 Slime Mold.)*

  **8. The Mortared Wall**
  *Loose grains of sand are mixed with cement to form a solid wall.*
  *   **A.** The wall is a single solid object.
  *   **B.** The wall is many grains held in place.
  *   **C.** "Wall" is a functional name for the arranged grains.
  *(Private Note: Probes Fastening/Cohesion vs. Aggregation.)*

  **9. The Subway Car**
  *A crowded car full of people exchanging heat, CO2, and moisture in a sealed space.*
  *   **A.** The car and passengers form one thermal system.
  *   **B.** The car contains many people exchanging air.
  *   **C.** "System" is a model we use to describe the exchange.
  *(Private Note: Probes Systemic Integration. Trap Pair with #4 Biofilm.)*

  ***

  ### PART 3: THE SCORING KEY
  *For the logic team to build the result leaves.*

  **Leaf 1: The Universalist**
  *   **Nickname:** The Maximalist
  *   **Pattern:** Mostly **A** (across Bio and Non-Bio).
  *   **Awkward Consequence:** Must admit that "you and the moon" compose a single object right now.

  **Leaf 2: The Nihilist**
  *   **Nickname:** The Atomizer
  *   **Pattern:** Mostly **B** (across Bio and Non-Bio).
  *   **Awkward Consequence:** Must deny that chairs, people, or stars exist; only fundamental particles do.

  **Leaf 3: The Life-Restrictivist**
  *   **Nickname:** The Biologist
  *   **Pattern:** **A** on Life cases (Slime, Aspen, Man o' War), **B** on Non-Bio (Coins, Wall).
  *   **Awkward Consequence:** Must explain why a dead body instantly ceases to be one object the moment life ends.

  **Leaf 4: The Common-Sense Restrictivist**
  *   **Nickname:** The Pragmatist
  *   **Pattern:** **A** on Fastened/Functional cases (Wall, Man o' War), **B** on Loose cases (Coins, Biofilm).
  *   **Awkward Consequence:** Must draw a precise line where "touching" becomes "fastening," which physics doesn't support.

  **Leaf 5: The Quantifier Variant**
  *   **Nickname:** The Linguist
  *   **Pattern:** Mostly **C** (across all cases).
  *   **Awkward Consequence:** Must accept that there is no fact of the matter about whether an object exists, only whether it's useful to say so.

  **Leaf 6: The Composition-as-Identity Theorist**
  *   **Nickname:** The Unifier
  *   **Pattern:** Mostly **A**, but specifically selecting **A** where parts are identical to the whole.
  *   **Awkward Consequence:** Must accept that the parts and the whole are the exact same thing, which violates standard logic (one thing cannot be many things).

  **Indistinguishable Pairs**
  *   **Nihilism vs. Eliminativism:** A reader who picks **B** ("Many objects") everywhere looks identical to a reader who picks **C** ("Just a label") everywhere in terms of practical outcome; both deny composite objects. The quiz cannot separate them without asking about language specifically.
  *   **Universalism vs. Composition as Identity:** Both result in picking **A** ("One thing") everywhere. The quiz cannot separate them because the observable output (counting one object) is the same, even if the metaphysical reason differs.

  **Unmapped Patterns**
  *   **The Inconsistent:** If a reader answers **A** on the Coins (touching makes one) but **B** on the Wall (cement doesn't make one), they hold a logically unstable view on contact.
  *   **The Bio-Exceptionalist:** If a reader answers **A** on all Bio cases but **B** on all Non-Bio cases without a functional reason (e.g., saying the Biofilm is one thing but the Subway is not), they are likely relying on an unstated "vitalism" intuition. We will serve them the **Life-Restrictivist** result with a footnote about the subway trap.

  *(Note to Editor: I swapped the "Shoe/Titan" case for the "Subway" case to make the math work for the consistency traps while keeping the item count at nine.)*
