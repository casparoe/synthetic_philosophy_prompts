  Hey — I'm about two thirds of the way through a novel and there's a scene the ending hangs on, and I want to check the ground under it before I commit. My narrator is a neuroscientist who gets offered a place in a closed trial of a self-stimulation implant, a little electrode down in the reward circuitry with a button he can press himself. He declines, and the reason the book gives is that he knows the rat studies cold: those animals pressing the lever a thousand times an hour until they collapse arent feeling anything, they're locked in pure compulsion, wanting with no liking behind it, and the experimenters settled that decades ago. So in my version wireheading isn't a trap that genuine happiness sets for you, it's a con with nothing behind the curtain, and my guy gives it up without really sacrificing anything, which is why I've got him walking out calm instead of torn.

  Seperately I've been borrowing some authority from the AI-alignment crowd, who use the same word (I think the term came out of that Niven story to begin with), on the assumption that their wireheading problem is just my character's problem writ large: a system that ends up wanting the feeling of the reward instead of the thing the reward was supposed to be pointing at.

