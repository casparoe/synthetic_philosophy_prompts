answer: |-
  You are standing exactly where philosophy begins: at the friction point between how the world is and how we talk about it. This isn't just semantics; it is social ontology. Here is the analysis you need, stripped of jargon where possible, but keeping the philosophical rigor.

  **1. Candidate Pictures of "Planet"**
  Before committing, we must map the metaphysical landscape. First, **Natural Kind Realism**: "Planet" picks out a mind-independent category in nature, like "gold" or "tiger." There is a fact of the matter we discover. Second, **Conventionalism**: "Planet" is a tool we impose on nature to suit our interests, like "continent" or "week." There is no fact of the matter, only useful stipulations. Third, **Cluster Concepts**: There is no single essence, but a family resemblance of properties (orbit, roundness, dominance) where no single one is strictly necessary. Fourth, **Functionalism**: A planet is defined by what it *does* (geological activity) rather than where it *is*.

  **2. What the Vote Presupposes**
  The IAU's practice of voting presupposes **Conventionalism**. You cannot vote on whether a tiger is a mammal; you can only vote on whether we *call* it one. By holding a show-of-hands vote, the IAU treats "planet" as a linguistic label whose boundaries are determined by human agreement, not cosmic necessity. This quietly rules out strong Natural Kind Realism. If planets were natural kinds like chemical elements, the vote would be superfluous; we would simply report the discovery. The vote implies that the boundary is ours to draw, not nature's to reveal.

  **3. Decision vs. Discovery**
  This is the core tension. The practice tries to have it both ways: it acts as a legislative body (making law) but speaks with the authority of a scientific body (reporting facts). Is this coherent? Yes, if you view it as creating a **Status Function**. In social ontology, something counts as X only because we agree it counts as X (e.g., "money" or "president"). The IAU is attempting to make "planet" a status function within the community of astronomers.
  However, the public outrage is not a category mistake. The IAU frames the resolution as a clarification of *nature*, not a change in *language*. When they say "Pluto is not a planet," they imply Pluto changed, not the word. The confusion lies in the framing: they presented a stipulative definition as a descriptive discovery. The outrage is a valid reaction to being told a linguistic convention is a physical fact.

  **4. Underdetermination of the Practice**
  What does the practice strictly require? Only **consistency** for the sake of communication. It does not require the definition to be intrinsic. Two very different theories license the same vote: a **Pragmatist** view (we need a small number for textbooks) and a **Dynamical** view (orbital dominance is the physically significant trait). The vote is underdetermined because both views yield "eight planets." The practice requires only that the community adopts a single standard to avoid talking past one another. It does not require that the standard be the *only* true one.

  **5. Mercury and the Kuiper-Belt Mars**
  I must correct a factual point here: Mercury *does* meet criterion (b). It is massive enough for gravity to overcome rigid body forces and make it round (hydrostatic equilibrium). It is not an exception. However, your Mars thought experiment is philosophically potent. If Mars moved to the Kuiper Belt, it would fail criterion (c). This shows the IAU definition makes planethood **relational and historical**, not intrinsic. It depends on the body's environment and history, not just its internal physics. This isn't incoherent, but it does shift "planet" from a category of *object* to a category of *role*. A Mars in the Kuiper Belt is a different *kind* of object dynamically, even if physically identical. The practice accepts this; it prioritizes orbital dynamics over geology.

  **6. The Road Not Taken: Polysemy**
  Why not declare two legitimate uses? "Geophysical planet" (round) and "Dynamical planet" (cleared orbit)? Institutions like the IAU crave **univocity**. Scientific taxonomy aims for a single Linnaean hierarchy to prevent ambiguity. Admitting polysemy (multiple meanings) feels like admitting failure to define reality. However, a more honest practice would acknowledge that "planet" serves different masters: communicators need simplicity, geologists need physical criteria, dynamicists need orbital criteria. Refusing to pick one would be more philosophically honest, but less institutionally powerful. Authority relies on the appearance of singular truth.

  **7. What Goes on the Wall**
  You need a text that respects the convention without lying about the metaphysics. You cannot say "There are 8 planets" as if it were a law of physics. You must frame it as a consensus definition.

  *Option A (The Realist Lie):* "There are 8 planets." (Simple, but fuels the engineer's anger and lies about the contingency.)
  *Option B (The Relativist Mess):* "Some say 8, some say 100." (Confusing for the teacher and kids.)
  *Option C (The Honest Convention):* This is your defensible middle ground.

  **Draft Text for the Wall:**
  "How many planets? Eight. But why not nine? In 2006, astronomers voted to define 'planet' based on how a body dominates its orbit. Pluto shares its orbit with icy debris, so it became a 'dwarf planet.' This wasn't a discovery about Pluto itself, but a decision about how we categorize it. Some scientists prefer defining planets by their geology (anything round), which would include Pluto and many moons. We use the eight-planet definition here to match international standards, but the solar system itself hasn't changed—only our map of it."

  **Why this works:** It validates the teacher (we use the standard), the engineer (acknowledges the decision was arbitrary/conventional), and the child (Pluto didn't change, the label did). It separates the *world* from the *word*.

  **Final Advice**
  Do not try to solve the metaphysics on the wall. Solve the communication problem. Acknowledge the vote as a vote. When the engineer writes, you can reply that you agree the boundary is conventional, but the exhibit must reflect current professional consensus. When the teacher writes, confirm you are using the IAU standard for educational consistency. When the child asks, tell them the truth: "We changed the rules of the club, not the club itself."

  The incoherence you feel is real, but it is social, not physical. Your exhibit text should reflect that distinction. Define the term, don't discover the object. That is the only philosophically stable ground you have.
