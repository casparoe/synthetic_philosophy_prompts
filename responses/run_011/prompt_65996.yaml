      *   *3. Spandrel Definition:* Must name the specific byproduct source. "Don't know function" $\neq$ spandrel.
      *   *4. Default Position:* If adaptive story fails, default = spandrel.
      *   *5. Spandrel vs. Exaptation:* Most "spandrels" are actually exaptations (modified later). Corrects people on this.
      *   *6. Drift/Inertia:* Distinct from spandrels. Don't lump them.
      *   *7. Developmental Evidence:* Shared developmental machinery = evidence for byproduct status.

