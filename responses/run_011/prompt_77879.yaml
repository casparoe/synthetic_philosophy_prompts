      *   *Wait, one more thing:* The user asks "Which step do you reject?" I need to be decisive. I will suggest that (5) is the step that needs refinement, not rejection. But if forced to choose a logical pivot, the inference from (6) to (7) is where the "Standard/Rule" distinction matters. I will advise rejecting the *interpretation* of PP in (2) as a strict algorithmic rule, but arguing that *if* it is treated as such (as regulators often do), it fails.
