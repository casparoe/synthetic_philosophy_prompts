answer: |-
  Here is a diagnosis, a test, and an assessment of progress, structured to assist your term paper.

  ### 1. The Diagnosis: A Mismatch of *Explananda*

  Your working hypothesis is the most robust of the available options. The stagnation is best explained not by a substantive disagreement about the existence of group minds, nor by a merely verbal dispute, but by a **category mismatch regarding the *explanandum***.

  The Individualist (e.g., Bratman) and the Collectivist (e.g., Gilbert) are optimizing for different theoretical virtues because they are trying to solve different problems under the same label.

  *   **The Individualist Project:** The goal is to explain **coordination and efficacy**. The question is: *How do distinct causal agents align their behaviors to produce a complex outcome without a homunculus?* The constraints are naturalistic: the explanation must bottom out in the psychological states of individuals to avoid ontological inflation. When the Individualist says "shared intention," they mean "the psychological architecture required for successful joint planning."
  *   **The Collectivist Project:** The goal is to explain **normative stability and standing**. The question is: *What binds participants such that defection is not just a prediction failure but a violation?* The constraints are phenomenological and deontic: the explanation must account for the "ought" and the standing to rebuke. When the Collectivist says "shared intention," they mean "the normative architecture required for mutual obligation."

  **Why this explains the impasse:**
  If this diagnosis is correct, the arguments cross over because each side treats their necessary condition as a sufficient condition for the *whole* phenomenon.
  *   The Individualist looks at the Queue (or the Flash Mob) and sees successful coordination. They argue: "The planning structure is present; therefore, shared intention is present." They view the lack of obligation as a separate issue (perhaps a matter of promise or convention), not a failure of the intention itself.
  *   The Collectivist looks at the same case and sees no binding force. They argue: "Without obligation, this is merely parallel action; therefore, shared intention is absent." They view the planning structure as insufficient because it cannot distinguish between a partner and a predictable obstacle.

  The "Substantive Disagreement" rival (about irreducible attitudes) is a symptom, not the cause. They fight about attitudes because they assume that if the *attitude* is shared, the *normativity* must follow (Collectivist) or that if the *normativity* is absent, the *attitude* must be merely individual (Individualist). The "Explanatory Standards" rival is close to your hypothesis, but your formulation is more precise: it is not just about standards (causal vs. normative), but about **what phenomenon is being defined**. The impasse persists because neither side grants that "Shared Intention" might be a cluster concept covering two distinct mechanisms (one for coordination, one for obligation) that usually overlap but can come apart.

  ### 2. The Test: The Queue and the GPS

  To test the "Different Questions" hypothesis, we need a case where the **Planning Conditions (PC)** and the **Normative Conditions (NC)** diverge. If the camps are answering the same question, such a case should force a consensus on whether it counts as joint action. If they are answering different questions, they will classify the case differently without contradiction, confirming the diagnosis.

  **The Candidates:**

  1.  **The Flash Mob:** Fails PC. Members follow a script, not each other. There is no mutual responsiveness. Both sides reject this as shared intention. **No discrimination.**
  2.  **The Silent Co-editors:** Ambiguous. If they track each other perfectly, PC is met. But without communication, Gilbert argues NC is not met (no expression of commitment). Bratman might argue PC is sufficient. This is a discriminator, but it relies on contested interpretations of "mutual knowledge."
  3.  **The GPS:** Strong discriminator. You mesh plans with the GPS; you are responsive to its directives. PC is functionally met. NC is zero. However, Individualists often require the partner to be an *agent*, which complicates the PC analysis.
  4.  **The Queue (Wet Tuesday):** **This is the decisive case.**

  **Analysis of the Queue:**
  *   **Individualist Verdict:** **Shared Intention (or Shared Cooperative Activity).** The participants have meshing subplans (wait in line), are mutually responsive (adjust spacing if someone moves), and have common knowledge of the practice. The action is coordinated and successful. The lack of obligation is irrelevant to the *intentional* structure.
  *   **Collectivist Verdict:** **Not Shared Intention.** There is no joint commitment. If someone cuts, you may feel annoyance, but you lack the *standing* to rebuke them as a co-participant in a joint venture. You are merely individuals coinciding in space.

  **Implication for the Diagnosis:**
  The fact that the Queue case generates a stable disagreement supports your hypothesis.
  *   If the dispute were purely **substantive** (about the existence of group minds), the Individualist should be able to point to the Queue and say, "See? No group mind needed for this obligation." But they don't; they usually concede the obligation is missing and deny it matters for *intention*.
  *   If the dispute were **verbal**, they could agree to call it "Shared Intention*" and "Shared Intention**." But they don't; they fight over the extension of the concept because they believe their definition captures the *essence* of the social.

  The Queue shows that **Coordination (PC) does not entail Obligation (NC).**
  *   The Individualist is answering: "What is required for Coordination?" (Answer: PC).
  *   The Collectivist is answering: "What is required for Obligation?" (Answer: NC).

  Because they both label their answer "Shared Intention," they talk past each other. The Individualist says, "I explained the action." The Collectivist says, "You didn't explain the *social*." Both are right, relative to their *explanandum*. The impasse is the refusal to decouple the two.

  ### 3. What Would Count as Progress?

  Given the diagnosis, progress cannot come from one side refuting the other's ontology. Progress requires **disaggregating the cluster**.

  **A. Conceptual Progress: The Two-Component Model**
  The most fruitful theoretical move is to formally distinguish **Shared Intentional Activity (SIA)** from **Joint Commitment (JC)**.
  *   **SIA** is defined by the Individualist conditions (meshing, responsiveness). It explains how we *can* act together.
  *   **JC** is defined by the Collectivist conditions (mutual obligation, standing). It explains why we *must* (or feel we must) act together.
  *   **Progress:** A paper that argues "Shared Intention" is an ambiguous term referring to SIA, JC, or the conjunction of both. This dissolves the "necessary and sufficient" war. It allows us to say the Queue is SIA without JC, and a Pact without Action is JC without SIA.

  **B. Empirical Progress: Developmental Dissociation**
  You asked about empirical findings. This is the most promising route for a substantive verdict. We need evidence of **dissociation** in cognitive architecture.
  *   **Finding 1 (Supports Collectivism):** If developmental psychology shows that children exhibit normative rebuke (the "normative residue") *before* they possess the complex planning capacities required by Bratman (e.g., representing another's subplans), then normativity is not built on top of planning. It suggests the "we-mode" is primitive. (Tomasello's work on 3-year-olds policing norms suggests this).
  *   **Finding 2 (Supports Individualism):** If we find agents (perhaps in comparative primatology or AI) that exhibit perfect meshing and responsiveness but show zero reaction to defection (no normative residue), it suggests planning is sufficient for the *action* component, and normativity is a separate social add-on.

  **C. The Honest Conclusion: Stable Impasse**
  If you argue that the impasse is stable, do not argue that the question is ill-posed. The questions are well-posed; they are just distinct.
  *   **Why it is stable:** Because "Shared Intention" functions as a **thick concept** in social ontology. It is meant to do double duty: explain the mechanics of cooperation *and* the morality of partnership.
  *   **The Verdict:** The literature has not moved because it is trying to find a single ontological ground for two different phenomena. The Individualist grounds the mechanics; the Collectivist grounds the morality. Until the field accepts that **social ontology requires two distinct primitives** (one psychological, one normative) rather than one unified "shared intention," the debate will cycle.

  **Recommendation for your paper:**
  Argue that the "forty years of stagnation" is not a failure of argumentation, but a failure of **taxonomic precision**. The Individualists and Collectivists are not enemies; they are specialists in different departments (Psychology of Action vs. Normative Sociology) who have been fighting over the same job title. Your paper can propose that the "Shared Intention" label be retired in favor of a dual-component framework, rendering the old objections (group minds vs. insufficient conditions) obsolete.
