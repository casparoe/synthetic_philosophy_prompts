prompt: |-
  I run a monthly civic evening in a public library — about 24 adults, mixed ages, no philosophy background, 90 minutes. Design a structured deliberation, using an invented town and an invented honoree, that makes participants feel the collapse of a move people constantly make in monument debates: the claim that we can honor someone for one specific thing while withholding approval of the rest of what they did and believed. I want the rules arranged so that this move succeeds early in the session and then fails later, once the committee's own earlier decisions have committed it to something — and fails without my ever saying so. They should hit the wall before anyone names it.

  Give me the case, with two or three facts deliberately left underdetermined (say which, and what each omission is there to provoke), the roles or blocs, the sequence of rounds and votes with a minute-by-minute timeline, and whatever short handouts are needed. Then a debrief that maps what just happened onto two distinctions: between honoring a person and honoring a deed, and between what a monument said at its dedication and what it says for as long as the community keeps maintaining it. Close with a candid account of what will predictably go wrong the first time I run this, how to steer it back, and which feature of the problem no exercise of this kind can reproduce.
reasoning: |-
  Here's a thinking process that leads to the suggested civic evening design:

  1.  **Analyze the Request:**
      *   **Context:** Monthly civic evening, public library, 24 adults (mixed ages, no philosophy background), 90 minutes.
      *   **Goal:** Design a structured deliberation using an invented town and honoree.
      *   **Core Mechanism:** Make participants feel the collapse of the "compartmentalization move" (honoring the good, ignoring the bad). This move must succeed early, then fail later due to the committee's own prior commitments, without the facilitator explicitly pointing it out.
      *   **Deliverables:**
          *   The Case (with 2-3 deliberately underdetermined facts + purpose of omission).
          *   Roles/Blocs.
          *   Sequence of Rounds/Votes + Minute-by-Minute Timeline.
          *   Short Handouts.
          *   Debrief (mapping to two distinctions: Person vs. Deed, Dedication vs. Maintenance).
          *   Candid "What Will Go Wrong" analysis + Steering + Limitations.

  2.  **Deconstruct the Core Mechanism (The "Collapse"):**
      *   *Phase 1 (Success):* Participants need to agree to honor someone for a specific, isolated achievement despite knowing there are "complications." This establishes the precedent: "We can separate the deed from the person."
      *   *Phase 2 (Failure):* New information or a logical consequence of Phase 1 forces them to confront the "complications." Because they already committed to the *principle* of separation in Phase 1, they can't easily reverse without looking inconsistent. But the "complications" are now too integral to ignore. The compartmentalization breaks down.
      *   *The Trap:* The criteria they set to justify the honor in Round 1 must logically entail honoring the "bad" parts in Round 2, or the "good" part must be revealed as inextricably linked to the "bad."

  3.  **Drafting the Case (The Town & The Honoree):**
      *   *Town:* "Oakhaven." Neutral, sounds like a standard American municipality.
      *   *Honoree:* "Elias Thorne."
      *   *The "Good":* He saved the town from economic collapse or built a crucial infrastructure (e.g., the Library itself, or the Water Works). Let's go with the *Water Works*. It's visceral (everyone needs water) and public.
      *   *The "Bad":* Labor exploitation? Racial segregation? Let's go with *Land Acquisition*. He secured the land for the water works through dubious means that displaced a specific community.
      *   *Underdetermined Facts:*
          1.  *The Nature of the Displacement:* Was it legal but unethical, or illegal? (Provokes debate on rule of law vs. moral justice).
          2.  *Thorne's Personal Motivation:* Did he profit personally from the land deal, or did he reinvest it all? (Provokes debate on corruption vs. utilitarianism).
          3.  *The Current Community:* Do descendants of the displaced still live nearby? (Provokes debate on present harm vs. historical wrong).

  4.  **Designing the Rounds (The Trap):**
      *   *Round 1 (The Hook):* Vote on the *Deed*. "Should the town recognize the construction of the Water Works as a foundational moment?" (Easy Yes).
      *   *Round 2 (The Person):* Vote on the *Statue*. "Should we erect a statue of Thorne?" Here, the "Compartmentalization Move" happens. "Yes, for the water, not the land."
      *   *Round 3 (The Inscription):* Vote on the *Plaque Text*. This is where it breaks. To explain *why* he's honored, you have to mention the Water Works. To explain the Water Works, you have to mention the Land. If you leave the Land out, it's a lie. If you put it in, it undermines the honor.
      *   *Round 4 (The Maintenance):* A scenario arises 10 years later. The plaque is vandalized or protested. Do we repair it? (Shifts from dedication to maintenance).

      *Refining the Trap:* The prompt asks for the move to succeed *early* and fail *later* due to *earlier decisions*.
      *   *Revised Round 1:* Establish Criteria for Honoring. (e.g., "Contributed essential infrastructure").
      *   *Revised Round 2:* Apply Criteria to Thorne. (Passes, despite known flaws).
      *   *Revised Round 3:* Apply Criteria to a *Second* Figure (or a new fact about Thorne). Let's stick to Thorne but add a twist. The "Water Works" *required* the "Land Grab." You cannot have the water without the theft. The committee already voted that "Essential Infrastructure" justifies honor. Now they realize the Infrastructure *is* the Theft.
      *   *Better Trap:* Round 1: Vote on a *Principle*. "We honor those who secured Oakhaven's survival." (Unanimous). Round 2: Vote on Thorne. (Passes, "He secured survival"). Round 3: Vote on the *Inscription*. The draft inscription says "Who saved Oakhaven." The historians reveal: He saved it *by* destroying the neighboring village of "Millcreek." To keep the inscription is to endorse the destruction as "saving."

  5.  **Developing the Timeline (90 Minutes):**
      *   Intro (10)
      *   Round 1: Principles (20)
      *   Round 2: The Decision (25)
      *   Round 3: The Inscription/Implementation (25)
      *   Debrief (10)
      *   *Wait, 90 mins is tight for 24 people.* Need small groups.
      *   *Structure:* Large group intro -> Small group deliberation -> Large group vote -> Repeat.

  6.  **Developing Handouts:**
      *   Case Brief (1 page).
      *   Voting Ballots (simple).
      *   Inscription Drafts.

  7.  **Drafting the Debrief:**
      *   Map to Person vs. Deed.
      *   Map to Dedication vs. Maintenance.
      *   Keep it Socratic. Don't lecture.

  8.  **Anticipating Failure Modes:**
      *   *Dominant Voices:* One person monologues.
      *   *Premature Cynicism:* "It's all corrupt, tear it all down."
      *   *Facilitator Slip:* Explaining the point too soon.
      *   *Limitation:* Real life has power dynamics; this simulation assumes equal voice.

  9.  **Refining the "Underdetermined Facts":**
      *   1. *Thorne's Intent:* Did he know the land was stolen? (Moral culpability).
      *   2. *The Alternative:* Was there another site available? (Necessity).
      *   3. *The Beneficiaries:* Did the displaced people eventually get water too? (Utilitarian outcome).

  10. **Final Polish:** Check tone. Needs to be practical, facilitator-focused, and rigorous. Ensure the "collapse" is structural, not rhetorical.

  *(Self-Correction during drafting)*: Make sure the "Collapse" isn't just "new info came out." It needs to be that their *own criteria* trap them.
  *Adjustment:* In Round 1, they define "Civic Contribution." In Round 2, they apply it to Thorne. In Round 3, they are asked to write the plaque. The plaque requires a verb. "Who *built*..." vs "Who *secured*..." If they chose "Secured" in Round 1 to be safe, "Securing" implies the land grab. If they chose "Built," it ignores the land. The trap is in the *language* they ratified earlier.

  Let's tighten the timeline. 24 people is a lot for one discussion. Break into 4 tables of 6.
  Table reports -> Plenary Vote.

  *Wait, the prompt asks for the move to succeed early and fail later.*
  Round 1: Vote on a resolution to honor Thorne *specifically for the Water Works*, explicitly setting aside the Land Issue. (Success of compartmentalization).
  Round 2: Vote on the Plaque Text. The text must explain the Water Works. To explain it truthfully, the Land Issue enters. To exclude it, the text is misleading. The committee realizes they cannot write the plaque without violating the "set aside" agreement or the truth. (Failure of compartmentalization).

  Okay, let's write it.

  *Underdetermined Facts Selection:*
  1. *Thorne's Profit:* Did he make money on the land deal? (Corruption vs. Public Spirit).
  2. *The Displaced:* Were they a marginalized minority? (Justice vs. Progress).
  3. *The Alternative:* Could the water have come from elsewhere? (Necessity vs. Convenience).

  *Debrief Distinctions:*
  1. Honoring Person vs. Honoring Deed.
  2. Dedication (Past act) vs. Maintenance (Present endorsement).

  *What will go wrong:*
  1. Participants treating it as a history puzzle rather than a normative one.
  2. The "Moderate" coalition dominating.
  3. Facilitator rescuing them from the discomfort.

  *Limitation:*
  Simulations lack *consequences*. In real life, someone gets hurt or fired. Here, it's just talk.

  Let's assemble the document.cw
answer: |-
  # The Oakhaven Committee: A Deliberative Exercise
  **Facilitator Guide & Materials**

  ## I. The Case: "The Thorne Water Works"

  **The Town:** Oakhaven (pop. 45,000). A mid-sized municipality with a growing historical society and a strained budget.
  **The Honoree:** Elias Thorne (1875–1940). Industrialist and former Mayor.
  **The Proposal:** The Civic Beautification Committee has budgeted $150,000 for a new statue and plaque in Centennial Park. Thorne is the sole nominee.

  **The Established Facts:**
  1.  In 1922, Oakhaven faced a typhoid crisis due to contaminated wells.
  2.  Thorne financed and oversaw the construction of the "Thorne Water Works," which ended the crisis and enabled the town's subsequent growth.
  3.  To build the reservoir, Thorne acquired the land from the neighboring settlement of Millcreek.
  4.  Millcreek was dissolved; its residents were displaced. The reservoir sits where Millcreek's church and school stood.

  **The Underdetermined Facts (Do not resolve these unless pressed; let participants argue over them):**
  1.  **Thorne's Profit:** *Did Thorne profit personally from the land acquisition?*
      *   *Purpose:* Provokes debate on **corruption vs. utilitarianism**. If he profited, was the public good tainted by private gain? If he didn't, does self-sacrifice excuse the harm?
  2.  **The Alternative:** *Was there a viable alternative site for the reservoir?*
      *   *Purpose:* Provokes debate on **necessity vs. convenience**. If there was no other way, is the harm "tragic necessity"? If there was, is it "criminal negligence"?
  3.  **The Descendants:** *Do descendants of Millcreek residents still live in Oakhaven?*
      *   *Purpose:* Provokes debate on **historical vs. present harm**. Is this about correcting a past wrong or avoiding current offense?

  ---

  ## II. Roles & Blocs (24 Participants)

  Divide the room into **4 Tables of 6**. Do not assign specific roles to individuals; give each Table a "Bloc Lean" card to seed diversity of perspective.

  *   **Table 1 (The Preservationists):** Lean toward honoring tradition and infrastructure. Value stability and gratitude.
  *   **Table 2 (The Justice Coalition):** Lean toward historical accountability. Value the narrative of the displaced.
  *   **Table 3 (The Pragmatists):** Lean toward cost and utility. Value the function of the monument and budget efficiency.
  *   **Table 4 (The Ambiguates):** Lean toward complexity. Value nuance and are wary of clear-cut answers.

  *Note: Participants are free to dissent from their Table's lean, but this ensures the room doesn't group-think too quickly.*

  ---

  ## III. Sequence of Rounds & Timeline (90 Minutes)

  ### 0:00 – 0:10 | Introduction & Framing
  *   **Facilitator:** "Welcome. You are the Civic Beautification Committee. Your job is not to find the 'truth' about Thorne, but to decide what the town *says* about him. We will take three votes. Your earlier votes will constrain your later ones."
  *   **Handout:** Distribute **Case Brief** and **Ballot 1**.

  ### 0:10 – 0:30 | Round 1: The Principle (The Setup)
  *   **Task:** Tables discuss and vote on the *Criteria for Honoring*.
  *   **The Question:** "To qualify for a civic monument, must a nominee's contribution be..."
      *   A) *Net Positive* (The good outweighs the bad).
      *   B) *Morally Pure* (The means must be as clean as the ends).
      *   C) *Specific* (We honor only the specific deed, not the person).
  *   **The Trap:** Most groups will choose **A** or **C** to allow the project to move forward. This validates the "Compartmentalization Move."
  *   **Plenary Vote:** Tally the tables. (Likely outcome: A or C wins).
  *   **Facilitator Note:** Write the winning criterion on the board. Do not comment on it.

  ### 0:30 – 0:55 | Round 2: The Decision (The Success)
  *   **Task:** Apply the Criterion to Thorne.
  *   **The Question:** "Given our chosen criterion, do we approve the Thorne Monument?"
  *   **Handout:** **Ballot 2**.
  *   **Deliberation:** Tables will argue the Underdetermined Facts here. "If he profited, does that fail Criterion B?" "If we choose C, we can ignore the Millcreek displacement."
  *   **Plenary Vote:** Tally.
  *   **Expected Outcome:** The motion **Passes**. The room has successfully compartmentalized. They have agreed to honor the Water Works while "setting aside" the Millcreek issue based on the Criterion established in Round 1.
  *   **Facilitator Note:** Announce the result. "The Committee has approved the monument. We now proceed to the design."

  ### 0:55 – 1:20 | Round 3: The Inscription (The Collapse)
  *   **Task:** Draft the text for the Plaque.
  *   **Handout:** **Ballot 3** (Three Draft Options).
      *   *Draft X:* "Elias Thorne. He Saved Oakhaven." (Vague)
      *   *Draft Y:* "Elias Thorne. He Built the Water Works." (Technical)
      *   *Draft Z:* "Elias Thorne. He Secured Our Water." (Active/Political)
  *   **The Trap:**
      *   If they chose *Net Positive* (Round 1), "Saved" (Draft X) implies the displacement was worth it. Millcreek residents (if present) hear: "Your loss was our gain."
      *   If they chose *Specific* (Round 1), "Built" (Draft Y) is a lie. He didn't build the water; he acquired the land. The engineering was done by others.
      *   If they choose "Secured" (Draft Z), it admits force was used.
  *   **Deliberation:** Tables try to write the text. They will realize that *any* verb connects the Deed to the Person and the Means.
  *   **Plenary Vote:** Attempt to vote on a Draft.
  *   **Expected Outcome:** **Deadlock.** The "Compartmentalization Move" fails. They cannot write the plaque without implicitly endorsing the Millcreek displacement, which violates the moral comfort they relied on in Round 2. They hit the wall.
  *   **Facilitator Note:** If they manage to vote, ask: "Read the text aloud. Does this text require us to believe the Millcreek displacement was justified?" Let the silence sit.

  ### 1:20 – 1:30 | Debrief
  *   **Facilitator:** Put away the ballots. Move to the two distinctions (see Section V).

  ---

  ## IV. Handouts

  ### Handout 1: Case Brief (Half Sheet)
  > **CIVIC BEAUTIFICATION COMMITTEE // MEMO**
  > **Subject:** Elias Thorne Monument
  > **Facts:** Thorne funded the 1922 Water Works. Ended typhoid. Enabled growth.
  > **Complication:** Reservoir required acquiring land from Millcreek. Millcreek dissolved. Residents displaced.
  > **Unknowns:** Thorne's personal profit? Alternative sites available? Living descendants?
  > **Task:** You have 90 minutes to approve the concept and the plaque text.

  ### Handout 2: Ballots (Stack)
  > **BALLOT 1: CRITERION**
  > [ ] Net Positive (Ends justify means)
  > [ ] Morally Pure (Means must be clean)
  > [ ] Specific (Honor the deed, not the man)
  >
  > **BALLOT 2: APPROVAL**
  > [ ] Approve Monument
  > [ ] Reject Monument
  > [ ] Table for More Info
  >
  > **BALLOT 3: INSCRIPTION**
  > [ ] "He Saved Oakhaven."
  > [ ] "He Built the Water Works."
  > [ ] "He Secured Our Water."
  > [ ] No Consensus.

  ---

  ## V. The Debrief (Mapping the Experience)

  Do not lecture. Ask these two questions to the room, using their answers to draw the distinctions on a whiteboard.

  **Distinction 1: Honoring the Person vs. Honoring the Deed**
  *   *Ask:* "In Round 2, many of you voted 'Approve' based on the idea that we are honoring the *Water*, not the *Man*. In Round 3, why did the text become so difficult?"
  *   *Point:* A monument is always anthropomorphic. Even if we say "This statue represents Clean Water," it has Thorne's face on it. We cannot linguistically separate the *agent* from the *act* in a public honor. The "Compartmentalization Move" works in private reasoning but fails in public language.

  **Distinction 2: Dedication vs. Maintenance**
  *   *Ask:* "Imagine this statue has stood for 10 years. A group of Millcreek descendants asks for it to be removed. You are the Committee then. What is your job?"
  *   *Point:*
      *   **Dedication** is a claim about the *Past* (What did Thorne do?).
      *   **Maintenance** is a claim about the *Present* (What do *we* value today?).
      *   When you keep the statue up, you aren't just preserving history; you are actively re-endorsing the narrative every day you pay for its cleaning and security. The "collapse" you felt in Round 3 is the realization that maintenance requires ongoing moral consent, not just historical acknowledgment.

  ---

  ## VI. Candid Post-Mortem: What Will Go Wrong

  ### 1. The "Historian" Trap
  *   **Prediction:** Participants will spend 40 minutes trying to solve the Underdetermined Facts ("We need to know if he profited!"). They will treat this as a mystery to be solved rather than a decision to be made under uncertainty.
  *   **Steer:** "In real civic life, we rarely have full archives. You must decide based on what is *publicly known*, not what might be in a diary. Stick to the text in the Brief."

  ### 2. The "Moderate" Dominance
  *   **Prediction:** The group will try to write a plaque that says everything and nothing (e.g., "A Complex Figure of His Time"). This is a way to escape the trap without feeling it.
  *   **Steer:** "The foundry requires 20 words or fewer. You cannot add a disclaimer. You must choose a verb."

  ### 3. Facilitator Rescue
  *   **Prediction:** You will see them struggling in Round 3 and feel the urge to explain *why* it's hard.
  *   **Steer:** **Do not speak.** Let the awkward silence happen. If they ask you for a ruling, say: "I am not the Committee. You are. What does your Criterion from Round 1 demand?"

  ### 4. The Unreproducible Feature
  *   **Limitation:** This exercise cannot reproduce **Power**.
  *   **Account:** In a real town meeting, the descendants of Millcreek might not be in the room. Or they might be shouting. Or the Mayor might overrule the Committee. In this library session, everyone has an equal vote and a safe space.
  *   **Closing Note:** End the evening by acknowledging this. "Tonight, you all had equal voice. In reality, the hardest part of monument debates isn't the logic; it's that the people most affected often have the least power to vote on the plaque. We simulated the *dilemma*, but we could not simulate the *inequity*."
