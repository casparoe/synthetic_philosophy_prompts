answer: |-
  I recommend we adopt a multi-year strategic asset allocation plan with a defined procedure for reopening it. The defect in our recent process lies not in the individual votes, each of which was defensible on the reasons available at the time, nor solely in the aggregation rule, but in our myopia regarding sequential choice. While majority voting produced a Condorcet cycle among the three allocation options, the realized loss of $135,000 arose because we treated each quarter as an isolated decision rather than a link in a chain. Had we evaluated the sequence of transitions ex-ante, the net cost would have vetoed the initial move. This diagnosis matters because fixing the aggregation rule alone, such as by switching to a scoring rule, would ensure transitivity but not prevent sequential churn if the committee remains free to revisit the policy every quarter. A multi-year plan directly targets the temporal disconnect that allowed the cycle to be exploited.

  We must weigh this against the other candidates. A lexicographic ranking of criteria would eliminate cycles but is too rigid for investment policy, where trade-offs between risk and return must remain fluid. A scoring rule would aggregate preferences into a transitive order, yet it does not bind future committees to respect past scores, leaving us vulnerable to renewed cycling. A standing no-round-trips check is conceptually sound but operationally fragile; defining "foreseeable" returns invites debate that replicates the original deadlock. Delegation to staff under a mandate risks abdicating our fiduciary duty to set policy. The multi-year plan is superior because it preserves our discretion to choose the portfolio while constraining the frequency of change, balancing stability with responsiveness.

  Sophisticated choice is not available to us in this context. To reason backward from what we know we will later approve requires a continuity of agency that a committee with rotating membership and an adviser who frames each quarter's option separately cannot guarantee. The "future self" that votes in June is not fully controlled by the "current self" voting in March, making backward induction unreliable without a structural constraint.

  Under the plan option, resolute choice in McClennen's sense would commit us to adhering to the adopted allocation even if a future majority briefly prefers a different option, provided the conditions for reopening are not met. Planning agency in Bratman's sense would require us to treat the plan as a stabilizing framework that filters future options, where the existence of the plan itself provides a reason for action independent of the immediate pairwise comparison. A committee can have plans in the sense those accounts require, but only if the plan is institutionalized as policy that binds future compositions of the body, transforming the committee from a series of discrete voting blocs into a continuous agent over time.

  One member argues that nothing we did was irrational, that the sure loss is an artifact of an artificial sequential setup that a committee facing genuine transaction costs would never walk into twice, and that precommitment would freeze out new information and disenfranchise members who join later. I reject the claim that nothing we did was irrational; while each vote was locally rational, the sequence was dynamically inconsistent, violating norms of sequential rationality that forbid sure losses. I also reject the claim that precommitment freezes out new information; a defined procedure for reopening the plan allows for material changes in market conditions or fiduciary needs while blocking cyclical churn driven by preference ordering rather than new data. The proposal to disenfranchise later members is mitigated by ensuring the reopening procedure is accessible to any committee composition, preserving their voice while protecting the endowment from structural inefficiency.
