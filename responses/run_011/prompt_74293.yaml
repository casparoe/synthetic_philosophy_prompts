      *   *Actually, let's stick closer to the user's "staged rollout" idea.* Only designated sites can use the code for the trial period. Others must use GAD/Adjustment. This preserves the control group. To solve access: Insurance must cover GAD/Adjustment for these patients during the trial if recommended by a designated site. Or, allow the code but mark it "Provisional" on records.
      *   *Decision:* I will recommend the "Provisional Status with Mandatory Registry" model. Criteria must be public (ethical requirement). Usage is permitted but flagged. The "sealed" idea is rejected in the reasoning.

      *Let's re-read the prompt:* "If it doesn't survive, recommend something else."
