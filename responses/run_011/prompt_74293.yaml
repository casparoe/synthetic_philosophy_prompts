answer: |-
  **MOTION:** Move to classify "Anticipatory Dysregulation Disorder" (ADD) as a Provisional Category (Status P) for a fixed term of five years. Adoption is contingent on mandatory enrollment of all coded cases into a central clinical registry, with diagnostic criteria published openly. Usage is restricted to designated pilot sites during the provisional period; non-designated sites will code equivalent presentations under existing categories (GAD/Adjustment Disorder) with insurance coverage guaranteed based on symptom severity rather than code. A sunset review is scheduled for month 58, with retraction automatic unless specific validity thresholds are met.

  **REASONING**

  The pilot data presents a canonical looping effect: prevalence tracks with the presence of the checkbox, not the underlying pathology. This indicates that ADD is not merely being discovered; it is being partially constituted by the diagnostic act. Adopting ADD as a permanent, fully public category risks manufacturing an epidemic where none existed, validating the Validity-first camp's concern that retraction will be impossible once insurance structures and patient identities coalesce around the label.

  However, the Recognition-first camp is correct that withholding a code denies care. Patients are currently falling through gaps between GAD and Adjustment Disorder. We cannot wait for perfect data before offering treatment access. My provisional suggestion to hold criteria in a sealed registry must be rejected. It is operationally incoherent and ethically untenable. Clinicians cannot reliably apply criteria they cannot see, guaranteeing noise in the data we intend to collect. More critically, sealing criteria violates informed consent. Patients have a right to know the specific conditions under which they are labeled, particularly when that label shapes their self-narrative. A "black box" diagnosis undermines trust and agency.

  Therefore, criteria must be public. To mitigate the looping risk while enabling access, we restrict *usage* rather than information. By limiting official coding to designated sites while guaranteeing insurance coverage via symptom-based flags at non-designated sites, we preserve a control group. This allows us to measure the looping effect itself (comparing prevalence in adopting vs. non-adopting sites) while ensuring no patient is denied funded care due to nomenclature lag.

  **THE STRONGEST CASE AGAINST THIS MOTION**

  The Recognition-first argument rests on urgency and harm reduction. They argue that "wait for clean data" is a luxury patients cannot afford. The term is already leaked; folk criteria are circulating online. Patients are already self-diagnosing using inaccurate checklists. By refusing full adoption, we cede control of the narrative to algorithms and forums that lack clinical oversight.

  Furthermore, they argue that looping is not necessarily a bug; it is a feature of psychiatric care. Helping a patient narrate their distress as "anticipatory dysregulation" may be therapeutic in itself, providing a container for dread that "Generalized Anxiety" does not. Restricting the code to pilot sites creates a two-tier system where patients in certain geographies receive validated recognition while others are forced into ill-fitting categories. This inequity is unjustifiable when the folk diagnosis is already available to anyone with internet access. They contend that if the category is going to exist socially, it must exist clinically so we can steer its application responsibly.

  **IMPLEMENTATION MECHANICS**

  **1. Staged Rollout:**
  Adoption is limited to 50% of the pilot sites (matched for demographics and volume). These sites may code ADD. The remaining 50% will code equivalent presentations as GAD or Adjustment Disorder. Insurance bodies must agree to reimburse based on functional impairment scores regardless of the specific code used during this period. This preserves a comparable control group to measure the "checkbox effect" observed in the initial pilot.

  **2. Evidence for Sunset Review:**
  At month 58, the review will not merely assess prevalence. Stability of prevalence across sites is insufficient. The review requires evidence of *specificity*. We need data showing that patients coded ADD respond differently to targeted interventions than those coded GAD. If treatment outcomes are identical regardless of the label, the category lacks utility. Additionally, we must measure the "retraction cost": survey clinicians on the difficulty of removing the diagnosis if symptoms remit. High stickiness counts as evidence against permanence.

  **3. Trigger and Authority:**
  The sunset review is automatic. The burden of proof lies on those wishing to retain the category. The decision body will be an independent sub-committee including patient advocates and methodologists, not just working group members. If the specificity thresholds are not met, ADD reverts to "For Further Study" status automatically. Insurance coverage must then transition to symptom-based criteria without interruption. This pre-commitment prevents investment bias; clinicians cannot build practices around the code knowing it may vanish.

  **CONCLUSION**

  This motion balances the ethical imperative to treat against the epistemic risk of fabrication. It rejects the opacity of sealed criteria in favor of transparent, restricted usage. It acknowledges the leak but refuses to let public circulation dictate clinical standards. We provide access without conceding validity. We name the problem without assuming we have solved it. Vote yes to proceed with caution; vote no only if you believe the risk of looping outweighs the immediate need for coded access.
