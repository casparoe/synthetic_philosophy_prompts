      *   *Compromise:* Adopt as Provisional. Criteria public. All clinicians can use it, *but* every usage must be logged in a central registry for the 5-year period. This allows access but captures the data needed to validate/invalidate. This solves the "sealed" incoherence while keeping the "sunset" safety valve.
