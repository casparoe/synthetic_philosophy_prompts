answer: |-
  # ARBITRATION DECISION PROTOCOL (ADP-1)
  **For use by Arbitrators only. Time limit: 3 minutes per case.**
  **Purpose:** To standardize the resolution of discordant reads and higher-order evidence (HOE).

  ### STEP 1: IMAGE INTEGRITY & FIRST-ORDER EVIDENCE
  **Action:** View the images *before* reviewing the discordant reports.
  **State:** "I can clearly state what I see on the film independent of the reports."
  *   **If YES:** Proceed to Step 2.
  *   **If NO (Image unclear/technical fault):** **TERMINATE: ESCALATE** to Technical Review. *(Policy)*
  *   **If NO (Cannot form independent view):** **TERMINATE: RECALL.** *(Policy: Benefit of Doubt)*

  ### STEP 2: CHARACTERIZE THE DISAGREEMENT
  **Action:** Read the two original reports.
  **State:** "I can classify this as either (A) Perceptual (one saw a spot, one didn't) or (B) Interpretive (both saw it, disagreed on significance)."
  *   **If (A) Perceptual:** Default to the reader who identified the finding, **UNLESS** Step 4 applies.
  *   **If (B) Interpretive:** Proceed to Step 3.
  *   **If UNCLEAR:** **TERMINATE: RECALL.** *(Policy)*

  ### STEP 3: WEIGHT THE DISSENT (AI & PEERS)
  **Action:** Assess the source of the dissenting opinion.
  **Condition A (AI Dissent):** If the algorithm disagreed with a human recall:
  *   **State:** "The AI flag is not due to a known artifact (clip, implant, scar)."
  *   **If YES:** Treat AI as a Junior Reader. Downgrade confidence in human recall by one level (High→Med, Med→Low).
  *   **If NO:** Ignore AI. Proceed on human evidence only.
  **Condition B (Peer Dissent):** If two humans disagree:
  *   **State:** "My independent view (Step 1) aligns with one of them."
  *   **If YES:** Adopt that view. Proceed to Step 4.
  *   **If NO (You see a third option):** **TERMINATE: RECALL.** *(Evidence)*

  ### STEP 4: IMPEACHER CHECK (FATIGUE & BIAS)
  **Action:** Assess your own state and the context.
  **State:** "I am not at the end of a long list, interrupted, or aware of a personal trend (e.g., 'over-calling' this week)."
  *   **If YES:** Proceed to Step 5.
  *   **If NO (You are fatigued/biased):** **TERMINATE: ESCALATE** to Senior Clinician. *(Policy)*
      *   *Note: You must declare this state. Failing to declare a known impeacher is a governance breach.*

  ### STEP 5: FINAL DECLARATION (THE AKRATIC STEP)
  **Action:** Compare your Step 1 view with the Step 3/4 outcome.
  **Condition:** If Steps 1-4 dictate a verdict (e.g., No Recall) but your gut confidence remains High for the opposite (e.g., Recall):
  *   **State:** "I am signing this verdict based on Protocol, despite personal reservation."
  *   **Action:** Sign the verdict dictated by the Protocol.
  *   **Documentation:** **RECORD** your private first-order judgment in the 'Arbitrator Notes' field. Do not suppress. *(Policy)*
  *   **If you cannot state this:** **TERMINATE: ESCALATE.** *(Policy)*

  ### TERMINATION CODES
  1.  **RECALL:** Evidence of abnormality outweighs procedural constraints. *(Evidence)*
  2.  **NO RECALL:** Evidence insufficient or procedural constraints mandate safety. *(Mixed)*
  3.  **ESCALATE:** Procedural integrity compromised (Fatigue, Ambiguity, Bias). *(Policy)*

  ***

  # COMMENTARY & ANALYSIS FOR THE CLINICAL LEAD

  ### 1. Philosophical Trade-offs (What was discarded)
  To make this runnable in 3 minutes, I discarded the **Steadfastness/Conciliationism debate**. Philosophy asks, "Am I rational to ignore my peer?" The ADP-1 answers, "It doesn't matter; the system requires calibration."
  *   **Discarded:** The nuance of *why* the peer disagrees. We treat all peer dissent as equal weight unless Step 2 classifies it as perceptual.
  *   **Cost:** We lose the ability to capture "Expert Intuition" that cannot be articulated in Step 1. A reader might *feel* a cancer is present but fail the "State" requirement in Step 1, forcing a No Recall. This sacrifices individual epistemic agency for systemic consistency.
  *   **Accuracy Cost:** Expect a 5-10% increase in Escalations (Step 4/5 safety valves). This reduces false negatives caused by fatigue but increases workload for Seniors.

  ### 2. Failure Modes at Volume (40k cases/year)
  *   **The "Honest Lie":** In Step 4, readers will learn that declaring fatigue triggers Escalation (more work for colleagues). They may suppress this to "power through." *Mitigation:* Random audit of arbitration times against list position.
  *   **AI Complacency:** In Step 3, readers may treat the AI as a "Senior" rather than a "Junior," deferring to the machine on subtle cases. *Mitigation:* Monitor AI-overrule rates quarterly.
  *   **The Akratic Burnout:** Step 5 requires readers to sign decisions they distrust. Over 40k cases, this erodes professional confidence. *Mitigation:* The requirement to record private judgment (Step 5) is vital. If the 'Notes' field fills with "Protocol forced No Recall," you have a systemic drift issue.

  ### 3. When to Withdraw Service
  Take ADP-1 out of service if:
  1.  **Escalation Rate > 15%:** The "Impeacher Check" is being used to dump difficult cases on Seniors.
  2.  **Discordance between Private Note and Final Verdict > 30%:** The protocol is systematically contradicting clinical intuition.
  3.  **Cancer Detection Rate drops** while Recall Rate remains stable (indicates Step 5 is suppressing true positives).

  ***

  # CASE STUDY RUNS

  ### CASE 1: The Fatigued Arbitrator (Retrospective)
  *Scenario:* Two readers disagree on architectural distortion. Arbitrator (end of 9-hour list) sides with 'Normal'. Cancer presents 2 years later.
  *   **Step 1:** Arbitrator sees nothing (due to fatigue/satisfaction of search). States: "I see nothing." (Pass)
  *   **Step 2:** Classifies as Perceptual. (Pass)
  *   **Step 3:** Peer dissent exists. (Pass)
  *   **Step 4 (Impeacher Check):** **FAIL.** The arbitrator was at the end of a 9-hour list.
      *   **Protocol Verdict:** **TERMINATE: ESCALATE.**
      *   **Actual Outcome:** The arbitrator did not declare fatigue. They proceeded to Step 5 and signed 'No Recall'.
  *   **Analysis:** The procedure *would have* prevented this miss if followed. The failure was human compliance, not procedural logic.
  *   **Lead Action:** Do not overrule the case (it is past). Overrule the *governance*. Implement mandatory break logs for arbitrators. The procedure relies on self-reporting fatigue; this case proves self-reporting is vulnerable.

  ### CASE 2: The Rumored Bias (Real-Time)
  *Scenario:* Reader confident of finding. AI flags nothing. Senior colleague mentions casually, "You've been over-calling this month." Reader feels this is untrue.
  *   **Step 1:** Reader sees finding. States: "I see a density." (Pass)
  *   **Step 2:** Interpretive disagreement (Human vs AI). (Pass)
  *   **Step 3:** AI dissent. Downgrade confidence one level. (Pass)
  *   **Step 4 (Impeacher Check):** **FAIL.** A Senior has identified a trend ("over-calling"). Even if the Reader disputes it, the *existence of the report* is an impeacher.
      *   **Protocol Verdict:** **TERMINATE: ESCALATE.**
      *   **Akratic Moment:** The Reader feels the image is cancer (Evidence), but the Protocol forces Escalation (Policy) based on hearsay.
  *   **Lead Action:** **Do Not Overrule.** This is defensible. The procedure correctly identifies that the *Reader's reliability* is now the variable in question, not the image. Escalation protects the patient (if it is cancer) and the Reader (if it is benign). It removes the decision from a compromised agent.

  ### CASE 3: The Past Self (Private)
  *Scenario:* Closed 'No Recall'. Reader re-reads 6 months later for audit. Flatly contradicts original report (now sees cancer). Reader is the only one who knows.
  *   **Step 1:** Reader sees finding now.
  *   **Step 2:** Disagreement between Present Self and Past Self.
  *   **Step 3:** Treat Past Self as Peer Dissent.
  *   **Step 4:** No current fatigue.
  *   **Step 5:** Protocol dictates: If Present Self sees cancer, **RECALL** (if patient still in system) or **FLAG** (if closed).
      *   **Protocol Verdict:** **RECALL/FLAG.**
      *   **Akratic Moment:** The Reader must admit their Past Self was wrong. This is psychologically difficult but procedurally simple.
  *   **Lead Action:** **Do Not Overrule.** This is the desired learning loop. The procedure validates the Present Self's superior position (more data/experience) while recording the error rate.

  ### THE "DISLIKE" CASE: CASE 2
  **Why:** You will be tempted to overrule Case 2 because a "casual comment" from a Senior triggers a formal Escalation, potentially delaying care or alarming the patient unnecessarily. It feels like bureaucracy trumping medicine.
  **Defensibility:** It is defensible. In a high-volume screening programme, **Reader Reliability is a Patient Safety Issue.** If a Senior observes a trend, the Reader is temporarily "impeached" regardless of their internal feeling. The procedure forces the issue into the open rather than letting the Reader fight their own bias in secret.
  **Procedure Change:** If you find this triggers too many Escalations based on gossip, modify Step 4 to require the Senior comment to be *formally logged* before it counts as an Impeacher. However, this reduces the safety net. I recommend keeping it strict. The cost of one unnecessary escalation is lower than one unchecked biased reader.
