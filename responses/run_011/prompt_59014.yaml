prompt: |-
  I do intake review at a city agency — we look at maybe fifteen proposed rules and program changes a month before they go to council, anything from a character clause in a vendor licence to a shelter policy where a caseworker can relocate someone at her discretion. Lately the pushback we get is a particular kind: someone says the rule is fine, the officials running it are decent, nobody's actually been harmed, so what's the complaint. I want a screening procedure I can hand to a reviewer who's never read any political theory, built out of the republican idea of liberty as non-domination rather than non-interference — the bits about arbitrary interference, about whether a power has to track the interests of the person it's applied to, and about freedom meaning you can meet the other person's gaze without deferring or being afraid. Twenty minutes a proposal, one reviewer, no lawyers in the room until sign-off, and the output has to be a verdict plus flags, not an essay.

  Give me the questions in order, what counts as a sufficient answer to each, and the points where it should stop and escalate to counsel instead of pretending to decide. It especially has to handle three things we keep hitting, which I've started calling sleeping clauses: a discretionary power that's never actually been used, contest rights that exist on paper but cost enough time or exposure that nobody uses them, and constraints the affected people voted for themselves.

  Then run it on two live ones. First: a hardship waiver in a business licence where the deciding officer has no obligation to give reasons and the waiver is revocable at will. Second: a lottery for subsidised units where nobody has any say but also nobody gets singled out. Take a position on which is worse and defend it — one of those results will annoy me and I'd rather you say that plainly than balance it out. And be straight about where the procedure will misfire, and which distinctions I'm losing by compressing it into something a non-specialist can run.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Role:** Intake Reviewer at a city agency.
      *   **Task:** Create a screening procedure based on *Republican Liberty (Non-Domination)* for proposed rules/program changes.
      *   **Constraints:** 20 minutes per proposal, one reviewer (no political theory background), no lawyers until sign-off, output = verdict + flags (not an essay).
      *   **Core Concepts to Embed:** Arbitrary interference, tracking interests, standing eye-to-eye (no fear/deference).
      *   **Specific Challenges ("Sleeping Clauses"):** Unused discretionary power, theoretical contest rights with high barriers, constraints voted for by affected people.
      *   **Test Cases:**
          1.  Hardship waiver (officer gives no reasons, revocable at will).
          2.  Lottery for subsidized units (no say, but no singling out).
      *   **Requirement:** Take a position on which is worse (no hedging).
      *   **Requirement:** Admit where the procedure misfires and what distinctions are lost.

  2.  **Deconstruct Republican Liberty (Non-Domination):**
      *   *Negative Liberty (Non-Interference):* Am I being stopped from doing X? (This is what the pushback relies on: "nobody's been harmed.")
      *   *Republican Liberty (Non-Domination):* Does someone have the *capacity* to interfere arbitrarily in my life, even if they don't use it? Do I have to beg? Can I look them in the eye?
      *   *Key Tests:*
          *   Is the power arbitrary? (Does it track the interests/ideas of the subject?)
          *   Is there recourse? (Can I challenge it without ruin?)
          *   Is the relationship one of master/subject or citizen/citizen?

  3.  **Drafting the Screening Procedure (The "Tool"):**
      *   *Format:* Checklist/Flowchart style. Simple language.
      *   *Time:* 20 minutes max.
      *   *Steps:*
          1.  Identify the Power.
          2.  Test for Arbitrariness (Tracking Interests).
          3.  Test for Recourse (Cost of Challenge).
          4.  Test for Status (Eye-to-Eye).
          5.  Verdict/Escalation.
      *   *Addressing "Sleeping Clauses":*
          *   *Unused Power:* Focus on the *existence* of the power, not the usage.
          *   *Expensive Recourse:* Focus on the *practical* ability to challenge, not the theoretical right.
          *   *Self-Imposed Constraints:* Focus on whether the *implementation* allows for domination later (irrevocability).

  4.  **Developing the Test Cases:**
      *   *Case 1 (Hardship Waiver):* Officer has discretion, no reasons, revocable at will.
          *   *Analysis:* Classic domination. The licensee is entirely at the mercy of the officer. Even if the officer is nice, the *structure* makes the licensee a subject. They cannot look the officer in the eye.
      *   *Case 2 (Lottery):* No say, random selection.
          *   *Analysis:* Interference? Yes (you might not get housing). Domination? Less so. It's impersonal. It doesn't target *you* specifically based on whim. It's a rule of law, even if a harsh one.
      *   *Comparison:* Case 1 is worse. It creates a master/servant dynamic. Case 2 is a bad outcome, but not necessarily a dominating relationship.
      *   *Stance:* I need to be firm here. Case 1 is the toxic one for republican liberty.

  5.  **Refining the Procedure (Iterative Polish):**
      *   *Language:* Avoid terms like "petitio principii" or "neo-Roman." Use "Master/Subject," "Begging vs. Claiming," "Whim vs. Rule."
      *   *Escalation Points:* Where does the reviewer stop? When the answer reveals structural domination that can't be fixed by minor tweaks, or when the "self-voted" constraint is actually coercive.
      *   *Sleeping Clauses Integration:* Make sure the questions explicitly ask "Does it matter if they don't use it?" (Answer: No).

  6.  **Addressing the Limitations (The "Misfire" Section):**
      *   What gets lost? Nuance about efficiency, the difference between *capacity* and *likelihood*, the burden on the state.
      *   Republicanism can be rigid. Sometimes we *need* discretion (emergencies). The tool might flag necessary flexibility as domination.
      *   It doesn't solve resource scarcity (the lottery problem).

  7.  **Final Review against Constraints:**
      *   20 mins? Yes, the checklist is short.
      *   No lawyers? Yes, language is plain.
      *   Verdict + Flags? Yes.
      *   Position taken? Yes (Waiver is worse).
      *   Limitations admitted? Yes.

  8.  **Drafting the Content (incorporating the "Voice"):**
      *   Tone: Professional, direct, slightly weary but principled. Acknowledge the user's frustration with the "no harm, no foul" argument.
      *   Structure:
          1.  The Procedure (The "Domination Screen").
          2.  The Test Cases (Applied).
          3.  The Verdict (Which is worse).
          4.  The Limitations (Where it breaks).

      *(Self-Correction during drafting)*: Make sure I don't drift into "Procedural Justice" purely. Keep it focused on *power dynamics*. The lottery is impersonal; the waiver is personal. That's the key distinction.
      *(Refining the "Self-Voted" constraint)*: If people voted for it, is it domination? Republicanism says you can't sell yourself into slavery. So, irrevocable constraints are suspect even if voted for. I need to make sure the tool catches that.

  9.  **Final Polish:** Check the "Sleeping Clauses" specific instructions. Ensure the tool explicitly tells the reviewer to ignore "they haven't used it yet."

      *(Final thought on the Verdict)*: The prompt asks me to annoy the user potentially. The user likely deals with the Waiver case often. Calling it "tyrannical" even if "decent people" run it might be the annoying part. Or, arguing the Lottery is *better* might annoy them if they hate lotteries. I will argue the Waiver is worse because it institutionalizes dependency. This aligns with non-domination.

      *(Wait, re-reading prompt)*: "One of those results will annoy me and I'd rather you say that plainly than balance it out."
      Okay, I need to be careful. Usually, people hate lotteries (randomness) more than waivers (mercy). But from a *non-domination* perspective, the Waiver is objectively worse. I will stick to the theory. The Waiver creates a master. The Lottery creates a loser. Non-domination cares about the Master. I will defend that hard.

      *(Limitations)*: Be honest. This tool makes government harder. It slows things down. It might block helpful discretion.

      Let's write it.cw
answer: |-
  Here is the screening procedure, the test run, and the limitations.

  ### Part 1: The Domination Screen (20-Minute Protocol)

  **Instructions for Reviewer:** Do not ask if the rule is efficient or if the officials are nice. Do not ask if anyone has complained yet. You are checking for *mastery*, not just harm. If the answer to any **Bolded Question** is "No" or "Unclear," mark a **RED FLAG**. If two RED FLAGS appear, escalate to Counsel immediately.

  **Step 1: Identify the Power (3 Minutes)**
  *   Who holds the power? (e.g., The Caseworker, The Licensing Officer)
  *   Who is subject to it? (e.g., The Shelter Resident, The Vendor)
  *   What can the power-holder do? (e.g., Relocate, Revoke, Deny)
  *   *Sleeping Clause Check:* Does the document say this power exists even if it hasn't been used yet?
      *   **Yes:** Proceed. (Usage history is irrelevant. The *capacity* to dominate is the problem.)
      *   **No:** Close file.

  **Step 2: The Arbitrariness Test (7 Minutes)**
  *   **Q1: Does the power-holder have to give a reason that makes sense to the subject?**
      *   *Sufficient Answer:* Yes, the rule requires written reasons tied to specific criteria (e.g., "Income below $X," "Violation of Clause Y").
      *   *Insufficient Answer:* "Discretion," "Best Interest," "Administrative Necessity," or "No reason required."
  *   **Q2: Does the decision have to track the interests of the subject, not just the agency?**
      *   *Sufficient Answer:* Yes, the rule requires considering the subject's hardship or input.
      *   *Insufficient Answer:* The agency decides what is good for the subject without consulting them.
  *   **Q3: Is the power limited in time or scope?**
      *   *Sufficient Answer:* Yes, it expires, or applies only to specific situations.
      *   *Insufficient Answer:* It is permanent, indefinite, or "revocable at will."

  **Step 3: The Exit & Voice Test (7 Minutes)**
  *   **Q4: Can the subject challenge the decision without ruining themselves?**
      *   *Sufficient Answer:* Yes, there is a low-cost appeal (internal review, ombuds) that pauses the penalty.
      *   *Insufficient Answer:* They can sue (too expensive), or they can appeal but must comply first (risk of homelessness/ruin), or the process takes months while the penalty is active.
      *   *Sleeping Clause Check:* Even if the appeal exists, is the cost (time, stigma, legal fees) so high that a normal person wouldn't use it?
          *   **Yes:** Mark RED FLAG. (A right you can't afford is no right.)
  *   **Q5: Can the subject look the official in the eye?**
      *   *Sufficient Answer:* Yes, the interaction is regulated by rules both know. The subject is claiming a right, not begging for a favor.
      *   *Insufficient Answer:* The subject must plead, show gratitude, or fear that speaking up will trigger retaliation.

  **Step 4: The "We Voted For It" Check (3 Minutes)**
  *   **Q6: If the affected group agreed to this constraint, can they change their minds later?**
      *   *Sufficient Answer:* Yes, there is a sunset clause or a renegotiation process.
      *   *Insufficient Answer:* No, the decision is binding forever, or changing it requires a higher authority's permission.
      *   *Note:* You cannot sell yourself into slavery, even voluntarily. Irrevocable constraints are domination.

  **Output Format:**
  *   **VERDICT:** CLEAR / FLAGGED / ESCALATE
  *   **FLAGS:** [List specific Question Numbers]
  *   **SLEEPING CLAUSE STATUS:** [Active / Ignored]

  ***

  ### Part 2: Live Test Runs

  #### Case 1: Hardship Waiver (Business Licence)
  *   **Power:** Officer grants waiver or revokes it.
  *   **Constraints:** No obligation to give reasons. Revocable at will.
  *   **Step 1:** Power exists. (Usage history: Never used. *Protocol says ignore this.*)
  *   **Step 2:**
      *   Q1 (Reasons): **NO.** Officer doesn't have to explain. -> **RED FLAG**
      *   Q2 (Tracking Interests): **NO.** "Hardship" is defined by the officer, not the vendor. -> **RED FLAG**
      *   Q3 (Limits): **NO.** Revocable at will. -> **RED FLAG**
  *   **Step 3:**
      *   Q4 (Challenge): **UNCLEAR/NO.** If revoked at will, appeal is likely post-hoc. Vendor operates in fear. -> **RED FLAG**
      *   Q5 (Eye-to-Eye): **NO.** Vendor must stay on the Officer's good side to survive. This is begging, not claiming.
  *   **Step 4:** N/A (Not a voted constraint).
  *   **VERDICT:** **ESCALATE TO COUNSEL**
  *   **FLAGS:** Q1, Q2, Q3, Q5.
  *   **SLEEPING CLAUSE STATUS:** **Active.** (The fact it hasn't been used makes it *more* suspicious under this framework; it is a sword hanging by a thread.)

  #### Case 2: Lottery for Subsidised Units
  *   **Power:** Agency allocates housing via random draw.
  *   **Constraints:** No individual say in outcome.
  *   **Step 1:** Power exists.
  *   **Step 2:**
      *   Q1 (Reasons): **YES.** The reason is the algorithm/rule. It applies to everyone.
      *   Q2 (Tracking Interests): **PARTIAL.** It tracks the collective interest of fairness, not individual desire. (Passable under non-domination if rules are known).
      *   Q3 (Limits): **YES.** Applies only to allocation.
  *   **Step 3:**
      *   Q4 (Challenge): **YES.** You can verify the draw was random. You don't risk retaliation for asking.
      *   Q5 (Eye-to-Eye): **YES.** You are not begging a caseworker. You are standing in line like everyone else. The official is just running the machine.
  *   **Step 4:** N/A.
  *   **VERDICT:** **CLEAR** (With recommendation to monitor wait-times).
  *   **FLAGS:** None.
  *   **SLEEPING CLAUSE STATUS:** N/A.

  ***

  ### Part 3: The Verdict

  **Which is worse?**
  **Case 1 (The Hardship Waiver) is significantly worse.**

  **Defense:**
  This will likely annoy you because the Waiver looks like "mercy" and the Lottery looks like "neglect." But under non-domination, the Waiver is toxic. It creates a **Master-Subject relationship**. The vendor lives at the mercy of the official's mood. Even if the official is a saint today, the *structure* makes the vendor a dependent. They cannot plan their life. They cannot speak up if the official harasses them, because the official can revoke their livelihood "at will" with no reason. That is the definition of domination: living in another's power.

  The Lottery is harsh, but it is **impersonal**. No single official holds your life in their hands. You lose the lottery, not because an official dislikes you, but because of numbers. You can walk away from the lottery office without deferring to anyone. You remain a citizen who was unlucky, not a subject who was spared.

  Non-domination cares more about the *relationship* than the *outcome*. A well-treated slave is still a slave (Case 1). A free citizen who doesn't win the raffle is still free (Case 2). Fix the Waiver first.

  ***

  ### Part 4: Where This Procedure Misfires

  You asked for straight talk on the costs of compressing this theory into a 20-minute tool for a non-specialist. Here is what you lose:

  **1. The "Necessary Discretion" Problem**
  Republican liberty is suspicious of discretion, but government *needs* discretion for emergencies and edge cases. This tool will flag almost any "case-by-case" review as domination. Your reviewers might block a rule that allows a caseworker to move a shelter resident *immediately* for safety reasons because it lacks "prior reason-giving." The tool prioritizes status over safety. You will need a safety valve for genuine emergencies, or you will paralyze your agency.

  **2. The Resource Blindness**
  This tool fixes power dynamics, not resource scarcity. It clears the Lottery (Case 2) because it's non-dominating. But if the Lottery is for housing and there are only 5 units for 500 people, the *structural violence* of that scarcity is invisible to this screen. You might approve a rule that is "free" but leaves people on the street. Non-domination protects your status, not your welfare. Don't confuse a "Clear" verdict with a "Good for the Poor" verdict.

  **3. The "Good Official" Fallacy**
  The tool forces reviewers to ignore whether officials are decent. This is theoretically correct but practically friction-heavy. Your staff will fight you on flagging a rule because "Sarah in Licensing would never abuse this." The tool requires them to assume Sarah could be replaced by a tyrant tomorrow. That feels cynical to frontline staff. You will face morale pushback.

  **4. Loss of Nuance on "Tracking Interests"**
  Q2 asks if the power tracks the subject's interests. In complex policy, "interests" are contested. A noise bylaw tracks the interest of sleepers, not party-goers. A non-specialist reviewer might flag any rule that restricts behavior as "not tracking interests." You will get false positives on standard regulatory constraints. Counsel will have to spend time un-flagging basic public order rules.

  **5. The Voting Trap**
  Step 4 assumes people can "change their minds." In city governance, once a bylaw is passed, individuals can't opt out. The tool might flag almost all binding legislation as "irrevocable constraints." You need to instruct reviewers that "Democratic Process = Collective Eye-to-Eye," otherwise, they will escalate every new bylaw.

  **Summary:** This tool protects the *dignity* of the citizen against the *arbitrariness* of the state. It does not protect their *wallet*, their *safety*, or their *comfort*. It will make your agency slower and more defensive. Use it to kill the sleeping clauses that turn citizens into dependents, but don't expect it to solve the hard problems of scarcity.
