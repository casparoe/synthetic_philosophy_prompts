answer: |-
  Nadia is more right overall because the dispute turns on whether the phrase "the Trojan War" denotes a specific historical campaign or the literary construct, and the evidence supports a background of hostility rather than the specific conflict the phrase conventionally names.

  **Move Ratings**

  1.  **Mostly Right.** Alan is right in his conclusion that a significant conflict occurred at Hisarlik, but wrong in his reason for equating this directly with the specific narrative event of the Trojan War without bridging the evidential gap. The convergence of archaeology and Hittite texts confirms a setting and friction, but not the specific war described in the epics.
  2.  **Clearly Right.** Nadia correctly distinguishes between evidence for a location and evidence for the specific narrative claims, noting the oral tradition's literary priorities over historical recording. Her definition of the defensible sentence accurately reflects the limits of the available data regarding the siege and cause.
  3.  **Mostly Right.** He is correct that strict contemporaneity is rare in ancient history, but wrong to imply that geographical inevitability confirms the specific traditional account over other possible conflicts. The method is standard, but its application here assumes the tradition's placement is accurate because it is plausible, which is circular.
  4.  **Clearly Right.** Her critique of circular filtering is methodologically sound, and the material anachronisms strongly indicate a composite tradition rather than a single-event report. She is right in her conclusion that the text is a pastiche, and her reason regarding the unfalsifiable nature of Alan's filtering is valid.
  5.  **Mixed.** Alan is right in his reason that oral tradition can preserve obsolete data accurately, but wrong in his conclusion that this guarantees the preservation of the specific historical plot connecting them. The retention of place-names or objects proves memory of a world, not necessarily memory of a specific event.
  6.  **Mostly Right.** The Arthurian analogy effectively illustrates how a thin historical kernel can be elaborated into a dominant legend, though the evidential baseline for Troy is stronger. She is right in her conclusion that the named legend is a later construction, even if the historical residue for Troy is thicker than for Arthur.
  7.  **Clearly Right.** He accurately identifies the unique value of contemporary Bronze Age archives, which provides a level of external corroboration absent in the Arthurian case. This move successfully limits the Arthur analogy without disproving the general mechanism of legend formation.
  8.  **Clearly Right.** This is the decisive semantic point; proving a conflict occurred is not the same as proving the specific cultural construct named "the Trojan War" occurred. She is right in her conclusion that the archives attest to a dispute, and her reason regarding the indeterminacy of the phrase's referent is logically sound.
  9.  **Mixed.** Alan is right in his reason that negative claims suffer the same referential emptiness, but wrong in his conclusion that this forces acceptance of his "partly historical" formulation. He exposes a logical symmetry but fails to acknowledge that denying the legend is pragmatically useful even if the historical kernel exists.

  **Sub-Issues Analysis**

  The Hittite material bears significant weight regarding the existence of a polity named Wilusa and hostility with Ahhiyawa, but it cannot bear the weight of the specific legend because it remains silent on the casus belli, the coalition, and the outcome. Nadia is correct that this evidence supports a background of friction, while Alan overextends it to support the specific war; the texts confirm the *possibility* of the war, not the *actuality* of the Iliadic narrative.

  Move 4's charge that Alan's filtering method is unfalsifiable is fair rather than an overstatement, because selecting historical kernels based on plausibility ensures the result is plausible by definition. However, this does not render the method useless, only probabilistic; it is right in its critique of certainty but wrong if interpreted as prohibiting reconstruction entirely.

  The material-culture pastiche supports Nadia more than Alan. While Alan is correct in Move 5 that oral transmission preserves obsolete items, this proves the tradition is old, not that the *event* described is accurate; a story set in the past can accurately describe old furniture while inventing the plot entirely.

  The Arthur comparison in Move 6 does the work Nadia wants regarding the *mechanism* of legend formation, showing how a kernel becomes a courtly romance. Alan's rebuttal in Move 7 successfully distinguishes the *evidential weight* available for Troy, but does not defeat the structural analogy that the named legend (Camelot/Iliad) is a later elaboration rather than a contemporary report.

  Move 8's referent-shift point lands successfully because "The Trojan War" is a proper noun referring to a specific cultural narrative, not a generic description of violence at Troy. Move 9's parity reply is logically valid but pragmatically weak; while "The Trojan War did not happen" may suffer the same referential failure, it communicates the necessary distinction between history and myth more effectively than Alan's qualified affirmation.

  **Substantive vs. Verbal Disagreement**

  This is partly a verbal disagreement, as both parties agree on the raw facts (Hisarlik destruction, Hittite texts, late composition) but disagree on the definition of the phrase "the Trojan War." The substantive question that survives is whether the destruction layer at Hisarlik was caused by a unified Mycenaean coalition acting on a scale comparable to the epic tradition, or by smaller-scale raiding later conflated into a single war.

  **Strongest Unraised Consideration**

  The strongest consideration neither raised is the theory of "temporal condensation," where a century of intermittent warfare and multiple sieges is compressed by oral tradition into a single ten-year event. This would allow Alan to claim a historical basis for the conflict while allowing Nadia to maintain that the specific singular "War" described in the poem is a literary fabrication.

  **Criterion for Legend vs. History**

  A legend becomes history when independent contemporary evidence corroborates the specific *causal narrative* and *scale* of the event, not merely the setting or participants. Applying this criterion yields the same verdict for King Arthur and the Exodus narrative as for the Trojan War: all three fail because while there may be historical kernels (a British leader, Semitic presence in Egypt, conflict at Troy), the specific causal stories (Camelot, mass liberation, Helen's abduction) lack contemporary corroboration. The clause doing the most work is the requirement for corroboration of the *causal narrative*, as this distinguishes a historical setting from a historical event.
