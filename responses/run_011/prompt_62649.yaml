answer: |-
  The 1972–1987 sequence demonstrates that *Furman* lodged an ordinal complaint about arbitrary ranking among defendants that *Gregg* could not theoretically resolve, ultimately forcing retributivists to prioritize individualized desert over equality and consequentialists to reject mandatory efficiency in favor of moral nuance.

  I considered framing this as a federalism conflict, a procedural due process issue, or a moral theory stress test. I am adopting the moral theory stress test because the Eighth Amendment's evolution turns on competing visions of justice rather than jurisdictional boundaries. This allows the ordinal/cardinal distinction to illuminate why the Court's compromises satisfy neither theory completely.

  *Furman* was fundamentally an ordinal proportionality complaint, not a cardinal one. The concurring justices did not argue that death was inherently too severe for murder (cardinal), but that the selection process was so random that similarly situated defendants were ranked inconsistently (ordinal). The objection was that the lottery of execution violated equality, not that the punishment itself exceeded the crime's gravity. *Gregg*'s machinery attempted to fix this by channeling discretion through aggravating factors, but it could not solve the problem in principle because *Woodson* simultaneously forbade the only mechanism that guarantees ordinal consistency: mandatory sentencing. You cannot eliminate arbitrariness among defendants while requiring individualized consideration of each defendant; the demand for individualized mercy inherently reintroduces the discretion that creates ordinal disparity.

  Retributivism explains *Woodson* perfectly but struggles to cohere with *McCleskey* until you examine the theory's individualistic core. Retributivism demands punishment proportional to personal culpability; mandatory statutes ignore mitigating factors that reduce blameworthiness, so *Woodson* is a retributive victory. However, a retributivist might side with the *McCleskey* majority because retribution is backward-looking and agent-specific. Systemic statistical disparities do not negate the specific defendant's desert; overturning a deserved punishment because others were treated differently treats the guilty defendant as a means to fix a systemic error. Retributivism is silent on how to achieve systemic equality across cases, focusing instead on the moral ledger between the state and the individual offender.

  Consequentialism explains the intuition behind *McCleskey* but should be deeply bothered by *Woodson*. If punishment is justified by deterrence or incapacitation, mandatory death penalties offer maximum certainty and administrative efficiency, yet *Woodson* struck them down. A straightforward consequentialist should view *Woodson* as an obstruction to optimal crime control, prioritizing abstract dignity over aggregate safety. Consequentialism misdescribes *Furman* because arbitrary punishment undermines legitimacy, which is a long-term utility cost, but it goes silent on why individualized sentencing is required if the aggregate deterrent effect remains unchanged. Ultimately, the sequence shows the Court trying to square a retributive circle with consequentialist tools, satisfying neither.
