          *   Explain why a retributivist might side with *McCleskey*.
          *   Explain why a consequentialist should be bothered by *Woodson*.
      *   **Format Constraints:**
          *   First sentence = bottom line.
          *   No preamble.
          *   Don't restate the question.
          *   Before analysis proper: 3-4 lines naming candidate framings considered and which one adopted + why.
          *   No citations or reading list.
          *   Tone: Philosophical, knowledgeable, direct (not law-review voice).

  2.  **Deconstruct the Legal/Philosophical Landscape:**
      *   *Furman* (1972): Invalidated death penalty statutes as applied. Core complaint: Arbitrariness. It was like being struck by lightning.
      *   *Gregg* (1976): Upheld guided discretion statutes (aggravating/mitigating factors, bifurcated trials).
      *   *Woodson* (1976): Struck down mandatory death penalties. Core reasoning: Death is different; individualized sentencing is required.
      *   *McCleskey* (1987): Rejected statistical evidence of racial bias (Baldus study). Required proof of purposeful discrimination in the specific case.
      *   **Proportionality:**
          *   *Ordinal:* Ranking crimes/punishments relative to each other (e.g., murder > robbery, so death > life).
          *   *Cardinal:* The absolute severity anchored to the crime (e.g., is death *too much* for murder, regardless of what robbery gets?).
      *   **Theories:**
          *   *Retributivism:* Desert-based. Punishment must be proportionate to culpability. Focus on individual guilt.
          *   *Consequentialism:* Utility-based. Punishment justified by future benefits (deterrence, incapacitation). Focus on aggregate outcomes.

  3.  **Drafting the "Candidate Framings" (3-4 lines):**
      *   I need to select a framing for the analysis.
      *   Option 1: Pure doctrinal evolution (too legalistic).
      *   Option 2: Pure moral theory application (too abstract).
      *   Option 3: The tension between individualized desert and systemic consistency (this fits the ordinal/cardinal distinction best).
      *   *Decision:* I will adopt the framing of "individualized desert versus systemic consistency" because it maps directly onto the ordinal/cardinal distinction and captures the philosophical tension between *Woodson* (individual) and *McCleskey* (systemic).

  4.  **Developing the Bottom Line:**
      *   Needs to be the first sentence.
      *   Needs to summarize the core finding about *Furman*, *Gregg*, and the theories.
      *   *Draft:* The Eighth Amendment sequence reveals that *Furman* was primarily an ordinal complaint about arbitrary ranking among defendants, which *Gregg* attempted to fix procedurally but *McCleskey* ultimately insulated from systemic scrutiny, forcing retributivists to accept individualized desert over equality and consequentialists to reject mandatory sentencing despite its efficiency.
      *   *Refinement:* Make it punchier. "The 1972–1987 sequence demonstrates that *Furman* lodged an ordinal complaint about arbitrary ranking among defendants that *Gregg* could not theoretically resolve, ultimately forcing retributivists to prioritize individualized desert over equality and consequentialists to reject mandatory efficiency in favor of moral nuance."

  5.  **Analyzing *Furman* (Ordinal vs. Cardinal):**
      *   Was *Furman* about whether death is too harsh for murder (Cardinal)? No, *Gregg* later said death isn't inherently cruel.
      *   Was it about who gets death vs. who doesn't (Ordinal)? Yes. The "lightning strike" analogy implies randomness in selection among similarly situated defendants.
      *   *Conclusion:* *Furman* was ordinal.

  6.  **Analyzing *Gregg*'s Machinery:**
      *   Could guided discretion fix ordinal arbitrariness?
      *   In principle, if you channel discretion, you reduce randomness.
      *   But *Woodson* said you *must* keep discretion (individualized sentencing).
      *   Tension: To fix ordinal arbitrariness (make it consistent), you need rules/mandatory sentences. To satisfy *Woodson* (individualized desert), you need discretion. Discretion breeds arbitrariness.
      *   *Conclusion:* *Gregg* couldn't fix the problem in principle because the cure for arbitrariness (mandatory rules) was forbidden by the requirement for individualization.

  7.  **Theory Analysis (Retributivism vs. Consequentialism):**
      *   **Retributivism:**
          *   *Explains:* *Woodson*. Punishment must fit the individual's culpability. Mandatory death penalties ignore mitigating factors (culpability).
          *   *Misdescribes:* *McCleskey*. Retribution demands justice. Systemic bias means some deserve death and don't get it, or vice versa. But...
          *   *Why side with McCleskey?* Because retribution is fundamentally individualistic. You punish *this* person for *this* act. Systemic stats don't change *this* defendant's desert. To overturn based on stats punishes the state, not the defendant's guilt.
          *   *Silent:* On the aggregate utility of the system.
      *   **Consequentialism:**
          *   *Explains:* *McCleskey* (maybe?). If the system works overall to deter, specific bias might be tolerated as cost-benefit. Or, proving intent is too hard administratively.
          *   *Misdescribes:* *Woodson*. Mandatory death penalties are efficient (cheap, certain). Consequentialists should love certainty and deterrence. *Woodson* blocks the most efficient deterrent scheme.
          *   *Why bothered by Woodson?* It sacrifices aggregate safety/deterrence for individualized moral nuance that doesn't yield utility.
          *   *Silent:* On the intrinsic wrong of punishing the innocent or disproportionate punishment unless it undermines the system's legitimacy.

  8.  **Refining the Specific Prompts:**
      *   *Why retributivist sides with McCleskey:* Retribution is agent-relative and backward-looking. Statistical disparity doesn't negate the specific defendant's guilt. Overturning based on stats treats the defendant as a means to fix the system.
      *   *Why consequentialist bothered by Woodson:* Mandatory statutes maximize certainty and potentially deterrence. *Woodson* introduces cost, delay, and uncertainty for the sake of "dignity" or "culpability" which are non-utilitarian values.

  9.  **Drafting the Content (incorporating constraints):**
      *   Check tone: Philosopher, not lawyer. Avoid "The Court held." Use "The ruling implies."
      *   Check formatting: First sentence bottom line. 3-4 lines framing before analysis. No citations.

  10. **Review against Constraints:**
