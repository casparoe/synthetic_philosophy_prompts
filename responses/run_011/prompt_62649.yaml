      *   Retributivist/McCleskey & Consequentialist/Woodson points included? Yes.

  11. **Final Polish:**
      *   Ensure the distinction between ordinal (ranking among defendants) and cardinal (absolute severity) is clear.
      *   Ensure the tension between *Gregg* (channeling discretion) and *Woodson* (requiring discretion) is highlighted as the philosophical knot.
      *   Make sure the "silent" parts are explicitly labeled as such.

      *(Self-Correction during drafting)*: I need to be careful not to sound like I'm summarizing case law. I need to sound like I'm analyzing the *philosophical implications* of the case law. The prompt asks for a philosopher of punishment who knows the history. So the history is the data, the philosophy is the lens.

      *(Refining the Bottom Line)*: "The 1972–1987 sequence demonstrates that *Furman* lodged an ordinal complaint about arbitrary ranking among defendants that *Gregg* could not theoretically resolve, ultimately forcing retributivists to prioritize individualized desert over equality and consequentialists to reject mandatory efficiency in favor of moral nuance." -> This works.

      *(Refining the Framing)*: "I considered framing this as a federalism conflict, a procedural due process issue, or a moral theory stress test. I am adopting the moral theory stress test because the Eighth Amendment's evolution turns on competing visions of justice rather than jurisdictional boundaries. This allows the ordinal/cardinal distinction to illuminate why the Court's compromises satisfy neither theory completely." (3 lines roughly).

      *(Checking the McCleskey/Retributivism point)*: This is the trickiest part. Why would a retributivist support *McCleskey*? Usually, retributivists hate unfairness. But *McCleskey* says you can't use systemic stats to overturn a specific sentence. A retributivist cares about *this* person getting *their* just deserts. If *this* person murdered, they deserve death (assuming cardinal proportionality is met). The fact that others didn't get it is an ordinal problem, but overturning *this* sentence doesn't fix the others, it just lets a deserving person off. That violates desert. Also, retribution is backward-looking; stats are forward-looking/systemic.
      *(Checking the Woodson/Consequentialism point)*: Consequentialists want effective punishment. Mandatory death penalties remove appeal delays, increase certainty, and might deter more. *Woodson* says "no, you must listen to mitigating evidence." This adds cost and uncertainty. A straight consequentialist should hate that inefficiency unless they believe individualized sentencing yields better specific deterrence (unlikely for death penalty).

