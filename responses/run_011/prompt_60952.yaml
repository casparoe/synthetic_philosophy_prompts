  You are a philosopher of biology who is also fluent in quantitative comparative methods — allometry, phylogenetic comparative methods, measurement theory. Work through this as carefully and in as much private detail as you need before answering, but the reply itself must contain nothing except the five numbered entries specified at the end.

  I am a comparative neuroanatomist. My day job is fitting scaling relations across taxa: residuals from an assumed allometric law, the standing fight over whether the brain–body exponent should be taken as 0.28, 0.67, or 0.75, neuron counts obtained by dissociating fixed tissue, phylogenetic non-independence, and the fact that in the groups I study absolute brain mass and pallial neuron number come apart by orders of magnitude. My vocabulary is a measurement-and-scaling vocabulary, and it is the only one I fully trust.

  I have recently been pulled into an animal-ethics debate about whether brain size is morally relevant, and I find that literature close to unintelligible. Please restate each of the five claims below in my vocabulary — predictor and dependent variables, residuals against a fitted baseline, detection thresholds, model specification, phylogenetic control, measurement validity — as faithfully as you can. Two cautions. Do not smuggle in my framework's presuppositions and label the result a translation. And where a claim only looks like a measurement claim, say so explicitly rather than forcing it into one.

  The five claims:

  1. Absolute brain mass is at best a proxy: what is morally significant is some capacity, and mass is merely evidence for it, so a mass measure could be statistically predictive and morally irrelevant at the same time.
  2. Relative brain size of the encephalization-quotient kind is supposed to correct for body size, but objectors argue that the correction presupposes a baseline expectation that is chosen rather than discovered, and that the choice of reference clade quietly privileges one lineage.
  3. Moral status is binary rather than graded: once a creature is sentient at all, further neural capacity does not increase the weight of its interests, though it may increase their number and complexity.
  4. Greater capacity adds interests rather than weight per interest — a creature with future-directed plans simply has more to lose — so the difference lies in the dimensionality of what is being measured, not in its scale.
  5. A colleague of mine defends what she calls the sampling-capacity view: moral weight tracks the resolution of the internal model an organism maintains of its surroundings, roughly how finely it can discriminate among states that matter to it, and not tissue quantity at all; she holds that this is why neuron counts and cortical folding outperform mass as indicators, without conceding that an indicator is what carries the moral weight.

  For each claim, give me a residue report: what translates cleanly, what you had to distort in order to fit it, and what has no expression whatsoever in measurement-and-scaling language. Close each entry with a verdict on whether the residue indicts my vocabulary (I am missing a distinction that is real) or indicts the original claim (it was less clear than it appeared). If you think one of the five is the residue that matters most — the point at which the ethical debate is genuinely at sea — mark it as such inside that entry, not in a summary.

  Format: exactly five numbered entries, one per claim, in the order given, four sentences at most per entry, with no introduction, no preamble about method, and no concluding summary.
