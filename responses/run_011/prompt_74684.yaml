answer: |-
  Good evening. For those who don't know me, I'm [Name]. I left school at sixteen and have spent thirty-odd years running a builders' merchant. I am no scholar. So when I tell you I've been reading Jean-Jacques Rousseau, please don't expect a lecture. I bought a second-hand copy of his letter about the theatre two winters ago. He argued that a playhouse would ruin Geneva. He said walls separate us, professionals sell us lies, and sitting in the dark makes us passive.

  He looked at a theatre and saw a wall. Look around you. We are on the recreation ground. The only wall is the hedge behind the generator. Rousseau said actors are strangers who feign emotions for money. Look at the stage. That's Mrs. Gable from the post office. That's young Tom who fixes our tractors. They are not selling themselves; they are giving themselves.

  Rousseau said the audience should not just sit and be improved at. He wanted us active. So, let's test that. In this village, when someone says the footbridge is fixed, what do we say?

  *[Pause for audience]*

  We say, "Oh no it isn't!" Try it. "Oh no it isn't!" And when someone says the pantomime is free?

  *[Pause]*

  "Oh yes it is!"

  There. You're already working harder than a West End crowd. I've taken to calling this a looking-glass show. The people on the platform are the people on the benches, and we swap places. There is no wall there to object to.

  But I promised myself honesty tonight. Rousseau lands two hard blows that I cannot dodge. First, he says comedy makes the plain honest man ridiculous and the smooth compromiser lovable. We have done exactly that. For years, we've taken a respected parish councillor and painted him as the Dame. He takes it in good spirit, but Rousseau would say we are trading his dignity for a laugh. I won't claim otherwise. We do mock our own. But we do it with love, and next year the person laughing might be the one in the wig.

  Second, Rousseau says amusement that eats the hours owed to work and public business is a bad bargain. He is right. This society has eaten more of my hours than I can defend. There are invoices unpaid and shelves unstocked because I was here painting scenery. I cannot justify the time lost. I can only say that the time gained—sitting together, arguing over the script, fixing the flood damage in the hall—is time that belongs to us, not the shop.

  Now, I know we have guests who think about these things differently. We are grateful for the arts council grant. We know you measure "reach." But our reach is not about how many strangers we can pack into a hall. It is about how deeply we know the neighbours we have. If we turn this into a venue for professional touring companies, we become a cinema. You buy a ticket, you sit in the dark, you go home. We are not a venue. We are the show. We hope you will fund us not to become professional, but to remain stubbornly ourselves.

  And to our Vicar, who worries about lying: we do not tell lies. We tell the truth about the flood, the shut shop, the footbridge nobody will repair. We tell it loud, with glitter on it.

  Before we begin, I need one more thing from you. In 1994, the hall was due to be sold. One woman stood in the rain outside the council offices until they listened. She is here tonight. I am not going to name her, because she hates a fuss. But if you know who saved this hall, please stand up with her now.

  *[Pause for standing ovation]*

  Thank you. Sit yourselves down.

  We have a villain coming out shortly. He represents the damp that won't dry and the paperwork that won't end. When he comes out, I want you to hiss. Not politely. Like a kettle boiling over. Let's practice.

  *[Pause for hiss]*

  Good. Keep that ready.

  We are not Geneva. We are this village. We are not professionals. We are neighbours. The mic might cut out, the wind might blow, but the show is ours. Enjoy the hundredth.

  ***

  The argument is weakest when defending the time spent on the society against the charge of neglecting public business; admitting the hours are indefensible relies entirely on sentiment to outweigh the practical loss, which may not satisfy the priest or the funder. Additionally, conceding that the society mocks a respected councillor admits guilt without fully resolving the moral concern, leaving the justification resting on "love" rather than principle.
