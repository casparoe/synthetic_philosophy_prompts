prompt: |-
  Cause prioritization in the effective-altruist tradition ranks candidate causes on three criteria — importance, tractability, and neglectedness — and then combines them, sometimes by multiplication, into a single score that determines where funding and careers go. The third criterion functions as a discount on the first two: a problem that would absorb resources at an excellent rate per dollar, but on which a great many people are already working, is ranked below a problem with a modest rate of return on which almost nobody is working. Cause reviews therefore ask a distinctively marginal question — what would change if this field received ten times its current resources — and answer it with a returns curve on which each additional dollar buys less progress than the last. Neglectedness is itself scored in a mixed currency: philanthropic dollars, numbers of researchers, government attention, and press coverage are all folded into one estimate of how crowded a space already is.

  What theory of value does this ranking practice presuppose? I am especially interested in the work that the neglectedness term is doing, and in whether the practice needs the theory it seems to assume or merely happens to fit one well.

  Please address the following:

  1. Reconstruct the implicit theory. In particular, what does penalizing crowdedness assume about the information carried by everyone else's allocation of altruistic resources — that it tracks nothing about value, that it tracks something but is outweighed, or that it is not even the kind of thing that could be evidence? Is that an empirical bet about the market for doing good, or a conceptual commitment about what makes a contribution valuable?

  2. Say which rival theories the practice quietly rules out. Consider views on which joining a large, publicly recognized common effort has non-instrumental worth — as solidarity, as fairness in bearing a shared burden, as a matter of what one owes to a collective undertaking — and views on which doing good is partly a joint activity rather than a solo optimization against a fixed background of other people's choices.

  3. Test the practice for internal consistency. The framework reasons about one's own marginal dollar while holding everyone else's dollars fixed. What happens when the framework is adopted widely: does the neglectedness criterion undercut itself, and if so, does that reveal a coordination problem that the scoring language cannot express? Also address the multiplicative combination, if you think it matters — what is being claimed by an aggregation on which a cause crowded to the maximum extent scores zero no matter how important or tractable it is?

  4. Distinguish what the practice strictly presupposes from what it merely sits comfortably beside. Mark clearly where several incompatible theories of value would license exactly the same ranking, so that the scoring tells us nothing.

  5. Describe what the practice would have to look like if the presupposed view were replaced — for instance, if others' attention counted as evidence, or if contributing to shared efforts had value in itself that had to be scored rather than penalized.

  Finally, be candid about the limits of your reconstruction. Flag any point where you are reading one organization's stated framework as though it described how prioritization is actually carried out, or where you are imputing a commitment that practitioners would deny holding. Close by telling me what would change your mind: which argument or consideration would lead you to a different verdict about what this practice commits its users to, and at which step your reasoning is most likely to fail.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the Prompt:**

      *   **Topic:** Cause prioritization in the Effective Altruism (EA) tradition, specifically the ITN framework (Importance, Tractability, Neglectedness).
      *   **Focus:** The theory of value presupposed by this practice, with special attention to the *Neglectedness* criterion.
      *   **Specific Questions to Address:**
          1.  Reconstruct the implicit theory (what does penalizing crowdedness assume about others' allocations? Empirical bet vs. conceptual commitment?).
          2.  Identify rival theories ruled out (solidarity, fairness, joint activity).
          3.  Test for internal consistency (what happens if everyone adopts it? Coordination problems? Multiplicative combination implications).
          4.  Distinguish strict presuppositions from compatible accompaniments (underdetermination).
          5.  Describe alternative practices if the view changed (evidence from others, intrinsic value of shared effort).
          6.  **Crucial:** Candidly flag limits of reconstruction, distinguish stated framework from actual practice, and state what would change my mind.

  2.  **Initial Analysis & Brainstorming:**

      *   *The ITN Framework:* It's essentially a marginal utility calculation. $Value = Importance \times Tractability \times Neglectedness$. Neglectedness acts as a diminishing returns function.
      *   *Question 1 (Implicit Theory):* It treats the altruistic landscape as a market. If others are already there, the marginal value drops. This assumes others' choices *do* signal something (that the area is good), but that the *marginal* value is exhausted. It's largely an empirical bet about diminishing returns, but it carries a conceptual commitment to *consequentialist marginalism*. It treats others' actions as constraints on *my* optimization, not as signals of *intrinsic* duty.
      *   *Question 2 (Rival Theories):* Deontological duties (do your part regardless of impact), Virtue Ethics (solidarity, character), Communitarian views (shared burden). EA prioritization rules out "doing your part" if the marginal impact is low. It treats morality as a solo optimization problem.
      *   *Question 3 (Consistency/Coordination):* If everyone uses ITN, they all flee crowded causes. This creates a "shifting spotlight" problem. Causes might oscillate. The multiplicative zero implies a hard constraint: if crowded, *do not enter*. This assumes perfect substitutability of dollars/effort. It reveals a coordination failure: the framework tells individuals where to go but doesn't solve the "who does what" collective action problem.
      *   *Question 4 (Presupposition vs. Compatibility):* Does ITN *require* Total Utilitarianism? Not strictly. A prioritarian could use it. But it *does* require welfarist consequentialism. It doesn't strictly require longtermism, though it fits well. The scoring is compatible with various meta-ethical views as long as they accept marginal consequentialism.
      *   *Question 5 (Alternative Practices):* If others' attention = evidence of value, we might weight crowded causes *higher* (wisdom of crowds). If shared effort has intrinsic value, we add a "Solidarity" term or remove the penalty.
      *   *Question 6 (Limits/Change Mind):* I need to be careful not to conflate "80,000 Hours/OpenPhil" with "EA" as a monolith. Practitioners often use ITN heuristically, not mathematically. I might be overstating the rigidity. What would change my mind? Evidence that practitioners explicitly reject marginalism or treat neglectedness as purely epistemic rather than economic.

  3.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the ITN framework. State the thesis: It presupposes a specific form of *marginal act-consequentialism* treated as an investment portfolio problem.

      *   **1. Reconstructing the Implicit Theory:**
          *   Focus on Neglectedness. It treats altruism as a production function with diminishing returns.
          *   Assumption about others: Their presence consumes the "low-hanging fruit." It's not that they are wrong, but that the *room* is full.
          *   Empirical vs. Conceptual: It's primarily an empirical bet on diminishing returns, but conceptually commits to *replaceability*. If I don't do it, someone else will (or has).
          *   Value Theory: Welfarist Consequentialism. Value is in states of affairs, not acts.

      *   **2. Rival Theories Ruled Out:**
          *   *Complicity/Participation Views:* The idea that I must join the fight even if my marginal impact is small (e.g., voting, protesting). ITN says "go where you matter more."
          *   *Solidarity/Fairness:* Bearing a shared burden. ITN treats burden-sharing as inefficient if the burden is already borne.
          *   *Expressive Value:* Acting to express who you are. ITN suppresses this in favor of outcome maximization.
          *   *Key Distinction:* ITN treats morality as a *division of labor* problem optimized for output, not a *participation* problem optimized for legitimacy or community.

      *   **3. Internal Consistency & Coordination:**
          *   *Generalization:* If everyone follows ITN, causes become volatile. A cause becomes neglected -> people flood in -> becomes crowded -> people flee.
          *   *Coordination:* The framework lacks a mechanism to assign *who* stays. It assumes a market equilibrium that might not exist.
          *   *Multiplication:* The zero-score for max crowdedness implies a lexical priority or a hard constraint. It claims marginal value is effectively zero. This is strong. It assumes perfect fungibility of labor/capital.

      *   **4. Presupposition vs. Comfortable Fit:**
          *   *Strict Presupposition:* Consequentialism (outcomes matter), Marginalism (counterfactuals matter), Fungibility (resources are interchangeable).
          *   *Compatible but not Required:* Longtermism (could be used for global health), Hedonic Utilitarianism (could be used for preference satisfaction), Risk Neutrality (though usually assumed, risk aversion could be baked in).
          *   *Underdetermination:* A Prioritarian could use ITN. A Utilitarian could use ITN. The scoring doesn't distinguish the *good* being maximized, only the *efficiency* of the means.

      *   **5. Alternative Practices:**
          *   *Epistemic Neglectedness:* If crowdedness = evidence of quality, we might prioritize "consensus" causes.
          *   *Solidarity Term:* Add a variable $S$ for social cohesion.
          *   *Threshold View:* Once a cause is "solved" or "sufficiently funded," stop. But before that, join in regardless of marginal differences.
          *   *Portfolio Approach:* Instead of maxing one, spread across to ensure coverage (risk management vs. marginal maxing).

      *   **6. Limits & Candor:**
          *   *Reconstruction Risk:* EA is a community, not a monolith. OpenPhil uses this, but individuals might not.
          *   *Heuristic vs. Algorithm:* Practitioners often deny it's a strict formula. I might be reifying a heuristic.
          *   *Change My Mind:* If prominent EA theorists explicitly frame Neglectedness as purely epistemic (information asymmetry) rather than economic (diminishing returns). Or if they adopt a "coordination-first" framework explicitly.

  4.  **Refining and Polishing:**

      *   *Tone:* Analytical, philosophical, precise. Avoid strawmanning EA.
      *   *Clarity:* Ensure the distinction between "marginal value" and "average value" is clear.
      *   *Check against Prompt:* Did I answer all 5 numbered points + the candor requirement? Yes.
      *   *Self-Correction on "Multiplication":* Be careful not to say they literally multiply numbers always. It's often a qualitative weighting. I need to acknowledge the quantitative *implication* even if the practice is qualitative.
      *   *Refining the "Theory of Value":* It's not just consequentialism; it's *counterfactual consequentialism*. The key is the counterfactual: "What happens if I *don't*?" Neglectedness answers this.

  5.  **Final Review against Constraints:**
      *   Did I address the "mixed currency" of neglectedness? (Mention in section 1).
      *   Did I address the "returns curve"? (Mention in section 1/3).
      *   Did I flag where I might be imputing commitments? (Section 6).

  6.  **Final Polish:** (Writing the response based on these thoughts.) *Self-correction during drafting:* Make sure to emphasize that Neglectedness is a proxy for *diminishing marginal returns*. That is the core economic assumption.

  *(Self-Correction during drafting Section 3)*: I need to be careful about the "zero score" claim. Does crowdedness literally mean zero? Usually, it means "low priority." I should interpret the prompt's "scores zero" as a theoretical limit of the multiplicative model. I will address the theoretical implication of the multiplication.

  *(Self-Correction during drafting Section 6)*: Ensure I explicitly state what would change my mind.

  7.  **Final Output Generation** (similar to the provided good response).
answer: |-
  The practice of ranking causes via Importance, Tractability, and Neglectedness (ITN) presupposes a specific moral economics: **marginal act-consequentialism modeled as a portfolio optimization problem.**

  Below is a reconstruction of the theory of value implicit in this practice, an analysis of its exclusions and consistency, and a candid assessment of the limits of this reconstruction.

  ### 1. Reconstructing the Implicit Theory

  The ITN framework, and specifically the *Neglectedness* term, presupposes that the value of an altruistic act is determined entirely by its **counterfactual marginal impact**.

  **Assumptions about Others' Allocations**
  Penalizing crowdedness assumes that the existing allocation of resources by other actors is **economically significant but morally neutral.**
  *   **Economically:** It assumes the "market for doing good" exhibits diminishing marginal returns. The first dollars into a problem solve the easiest sub-tasks; the millionth dollar solves harder ones. Therefore, the presence of others consumes the high-value opportunities.
  *   **Morally:** It assumes that the *reasons* others are working on a cause do not generate independent normative force for you. Whether they are there because they are mistaken, or because they have a special duty, matters less than the fact that the *work* is being done.

  **Empirical Bet vs. Conceptual Commitment**
  This is primarily an **empirical bet** about the production function of social change (that returns diminish logarithmically or similarly), but it rests on a **conceptual commitment** to *replaceability*.
  *   The framework assumes that labor and capital are largely fungible. If you do not fund a crowded cause, someone else likely will (or has already).
  *   It treats value as residing in *states of affairs* (e.g., lives saved, risk reduced) rather than *acts* (e.g., doing one's part).
  *   **The Mixed Currency:** By folding researchers, dollars, and attention into one "crowdedness" score, the theory assumes these are interchangeable inputs into a single production function. This presupposes a unified metric of progress, implying that a field is "crowded" when the *capacity to absorb resources efficiently* is saturated, regardless of the specific type of resource.

  ### 2. Rival Theories Ruled Out

  The ITN practice quietly rules out or renders invisible several non-consequentialist or non-marginalist theories of value.

  *   **Participation and Solidarity:** Views on which morality involves joining a collective effort to bear a shared burden are ruled out. On a "fair share" view, if a problem is important, one ought to contribute even if others are already contributing, provided one has not yet done one's fair share. ITN treats this as inefficiency (duplication of effort).
  *   **Expressive Value:** Theories holding that actions have value because they express solidarity, loyalty, or moral identity are suppressed. If working on a crowded cause expresses solidarity with victims but has low marginal impact, ITN ranks it poorly.
  *   **Duty-Based Deontology:** If one believes there is a duty to assist specific populations (e.g., "I owe it to my community" or "I owe it to the present generation"), neglectedness is irrelevant. ITN assumes duties are general and outcome-based, not agent-relative or relationship-based.
  *   **Joint Activity:** ITN treats altruism as a **solo optimization problem** against a fixed background. It rules out views where "doing good" is inherently a joint activity where the value lies in the coordination itself, not just the output. It assumes the *coordination* is a cost to be minimized, not a value to be realized.

  ### 3. Internal Consistency and Coordination

  **The Generalization Problem**
  The framework reasons about *my* marginal dollar holding *others'* fixed. If the framework is adopted widely, it creates a **coordination instability**.
  *   **Oscillation:** If a cause becomes neglected, ITN directs resources there. As resources arrive, neglectedness drops. Eventually, the cause becomes "crowded," and ITN directs resources away. This could lead to boom-bust cycles in funding for specific causes, potentially destabilizing long-term projects that require steady investment.
  *   **The Zero-Score Implication:** The multiplicative combination ($I \times T \times N$) implies that if Neglectedness approaches zero (maximum crowdedness), the total value approaches zero, regardless of Importance. This claims that **marginal value can be fully extinguished by saturation.**
      *   *Consistency Check:* This assumes perfect substitutability. It implies that if a field is crowded, *no* additional progress can be bought. In reality, even crowded fields (e.g., cancer research) may have high-variance opportunities. The multiplicative model risks masking high-variance "moonshots" within crowded fields because it averages over the field's crowdedness.

  **The Coordination Gap**
  The scoring language cannot express the **assignment problem**. ITN tells every agent to go to the most neglected cause. If all agents do this, they collectively overcrowd it. The framework identifies the *optimal distribution* of resources globally but provides no mechanism for *assigning* specific agents to specific slots within that distribution. It assumes an invisible hand will sort out who stays and who leaves, which is a coordination failure waiting to happen.

  ### 4. Presupposition vs. Comfortable Fit

  It is crucial to distinguish what ITN *requires* from what merely *fits* it.

  **Strict Presuppositions:**
  1.  **Welfarist Consequentialism:** Value must be measurable in outcomes that can be aggregated.
  2.  **Marginalism:** The value of an action is determined by the difference it makes compared to the counterfactual, not the total good associated with the action.
  3.  **Fungibility:** Resources (money, time) are interchangeable across different causes and actors.

  **Merely Compatible (Underdetermined):**
  1.  **Total vs. Prioritarian Utilitarianism:** ITN works for both. It maximizes the good, but doesn't specify if we prioritize the worst off (unless "Importance" is defined that way).
  2.  **Risk Neutrality:** While ITN often implies risk neutrality (maximize expected value), one could plug a risk-adjusted utility function into the "Tractability" or "Importance" score without breaking the framework.
  3.  **Longtermism:** ITN is often associated with longtermism, but it applies equally to global health. The framework is neutral on *time*, provided "Importance" accounts for future duration.
  4.  **Objectivism vs. Subjectivism:** One could use ITN based on objective facts about the world, or based on expected value relative to one's epistemic state. The scoring practice looks the same either way.

  **Where the Scoring Tells Us Nothing:**
  If two agents agree on the ITN scores but disagree on *why* importance matters (e.g., one cares about happiness, one about preference satisfaction), the ranking practice masks this deep ethical divergence. The framework is a *tool* for efficiency, not a theory of the *good*.

  ### 5. Alternative Practices

  If the presupposed view were replaced, the prioritization practice would look markedly different.

  *   **If Others' Attention = Evidence of Value:**
      *   *Practice:* Instead of penalizing crowdedness, we might weight it positively (a "Wisdom of Crowds" term). A cause with many researchers might be ranked *higher* because their presence signals tractability or importance that I cannot independently verify.
      *   *Scoring:* $Score = I \times T \times (1 + Crowdedness)$.

  *   **If Shared Effort Has Intrinsic Value:**
      *   *Practice:* We would add a "Solidarity" or "Cohesion" term. We might prioritize causes where we can work *with* others rather than where we are the *only* one working.
      *   *Scoring:* $Score = (I \times T \times N) + S$, where $S$ is the value of communal action. This could license working on crowded causes if the social capital generated is high.

  *   **If Contributing is a Duty (Threshold View):**
      *   *Practice:* We would set a threshold of "sufficiency." Once a cause is sufficiently funded, we leave. But before that, we join regardless of marginal differences.
      *   *Scoring:* A step-function rather than a smooth curve. Neglectedness only matters to determine if the threshold is met, not to grade the marginal return.

  ### 6. Limits of Reconstruction and Candor

  **Where I May Be Over-Reading:**
  *   **Heuristic vs. Algorithm:** I have treated ITN as a rigid calculation. In practice, organizations like Open Philanthropy or 80,000 Hours often describe ITN as a *heuristic* for thinking, not a formula for decision-making. Practitioners might deny that they literally multiply scores or that a crowded cause scores "zero." They may use qualitative judgment to override the model.
  *   **Epistemic vs. Economic Neglectedness:** I have assumed Neglectedness is primarily about diminishing returns (economic). However, some practitioners argue it is about *information asymmetry* (epistemic). If a field is neglected, you might have a comparative advantage in understanding it. If this is the primary driver, the theory of value is less about "market saturation" and more about "finding edges."
  *   **Community vs. Theory:** "Effective Altruism" is a community, not a monolith. Imputing a single theory of value to the "tradition" risks homogenizing diverse views held by individuals who simply share a interest in evidence.

  **What Would Change My Mind:**
  1.  **Explicit Rejection of Marginalism:** If leading prioritization researchers published frameworks explicitly prioritizing *average* impact over *marginal* impact, or explicitly valued "doing one's part" independent of counterfactuals, my reconstruction of the theory of value would fail.
  2.  **Coordination Mechanisms:** If the community adopted formal coordination mechanisms (e.g., binding pledges to stay in crowded fields) that were integrated into the scoring system, it would show they recognize the "solo optimization" flaw I identified in Section 3.
  3.  **Epistemic Primacy:** If "Neglectedness" were formally redefined solely as a proxy for *uncertainty* rather than *diminishing returns*, the economic assumptions I attributed to the framework would be incorrect.

  **Most Likely Point of Failure:**
  My reasoning is most vulnerable in **Section 3 (Consistency)**. I have assumed the framework is intended to be *generalized* (i.e., everyone should use it). It is possible the framework is intended only for *marginal* agents (e.g., new philanthropists) while assuming large institutional funders act differently. If the framework is explicitly designed for a specific niche of actors rather than as a universal moral law, the coordination problem dissolves, and the "solo optimization" critique loses force. I have treated a tool for *allocation* as a theory of *morality*, which may be a category error.
