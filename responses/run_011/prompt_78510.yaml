  ### Final Statement to the Director

  You asked me to be plain. Here is the plain truth about this instrument:

  It will not make the decision easier. It will make the *burden* of the decision visible. In Case 2, your volunteers will feel they are betraying the woman's past self by treating her pneumonia. The protocol forces them to write down *why* they are doing it. It does not remove the guilt; it legitimizes it as a necessary moral cost.

  You were concerned that idealization is vacuous. It is, if treated as a calculation. It is not, if treated as a confession. This protocol turns the surrogate's mind inside out. It asks them to say: "I am turning this knob because I believe happiness matters more than consistency," or "I am not turning this knob because I fear disability more than death."

  If your volunteers use this, they will not be "finding the patient's will." They will be taking responsibility for the fact that the patient's will is gone, and someone must choose. That is the honest work.
