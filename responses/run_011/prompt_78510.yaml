answer: |-
  ### Part I: Brainstorming the Protocol

  You have correctly identified the core tension. The philosophical literature on idealized deliberation (Brandt's "cognitive psychotherapy" of desires, Railton's "full information + vivid acquaintance") aims to define rationality by what an agent would choose if they were a better version of themselves. In a clinic, we cannot create that better version. We only have the surrogate, who is biologically and psychologically distinct from the patient.

  Your colleagues are right that the "idealized patient" is unobservable. They are wrong that this makes the exercise vacuous. It becomes useful if we treat the idealization not as a *discovery mechanism* (finding the truth) but as a *disclosure mechanism* (revealing the surrogate's bias).

  Here is the breakdown of what survives translation from theory to protocol:

  1.  **Information (The Brandt Knob):** Survives. We can list what the patient knew then versus what we know now (prognosis, side effects).
  2.  **Critical Rationality (The Consistency Knob):** Survives partially. We can check if the patient's past values were consistent. We cannot check if they *would* have resolved inconsistencies differently without projecting.
  3.  **Vivid Acquaintance (The Railton Knob):** This is the danger zone. A surrogate cannot feel the patient's pain or pleasure. This must be flagged as a "Simulation Gap."
  4.  **The Identity Objection:** This is your stopping rule. If turning the knobs requires assuming the patient abandoned a core value they held for decades, you are no longer simulating *them*; you are simulating a *stranger* who shares their name. At that point, the procedure must switch from "Substituted Judgment" to "Best Interest," which requires a different authority (committee/court).

  **The Audit Trail:** You are right to demand written records. In analytical chemistry, you document the calibration of the instrument. Here, the surrogate *is* the instrument. We must document their calibration settings.

  **The Priors:** You noted you treat directives as dispositive and are skeptical of dementia contentment. I will apply the procedure rigorously. In Case 2, if the procedure validates the patient's current happiness over the past directive, I will explicitly note that this contradicts your prior.

  ***

  ### Part II: The Procedure
  **Title:** The Substituted Deliberation Protocol (SDP)
  **For:** Volunteer Substitute Decision-Makers
  **Time:** Approx. 60 Minutes
  **Tools:** This sheet, a pencil, the patient's chart, the patient's directive (if any).

  **INTRODUCTION FOR THE VOLUNTEER**
  You are not being asked to decide what *you* would want. You are not even being asked to decide exactly what the patient *did* want. You are being asked to decide what the patient *would have wanted* if they knew what you know now and could think clearly about it. This is a simulation. Like any simulation, it has error margins. Your job is to measure the error, not hide it.

  There are three places where your own mind might overwrite the patient's. We call these the **Three Knobs**. For every decision, you must set these knobs and write down why.

  *   **Knob 1: Information.** Did the patient know the medical reality? (e.g., Did they know "life support" meant a tube in the throat forever, or just a short bridge?)
  *   **Knob 2: Critical Rationality.** Were their past wishes consistent? (e.g., They said "no machines" but also "do everything to see my grandson." Which wins?)
  *   **Knob 3: Vivid Acquaintance.** Could they imagine the *feeling* of this state? (e.g., They feared dementia, but can they imagine being happy in it?)

  ---

  #### STEP 1: The Capacity Check (5 Minutes)
  **Action:** Confirm with the attending physician that the patient lacks decision-making capacity for *this specific decision*.
  **Sufficient Answer:** "The physician certifies the patient lacks capacity."
  **Insufficient Answer:** "The family says they can't decide."
  **Stop Rule:** If the patient can communicate a consistent choice (even by eye-gaze) and is certified competent, **STOP**. Hand decision to patient.
  **Handoff:** If capacity is contested or fluctuating, **HANDOFF** to Ethics Committee. Do not proceed.

  #### STEP 2: The Evidence Inventory (15 Minutes)
  **Action:** List all evidence of the patient's values.
  1.  Written Directive (Date: ______)
  2.  Verbal statements to witnesses (Who: ______)
  3.  Past behavior (e.g., how they treated their own parents, lifestyle choices).
  4.  Current behavior (e.g., signs of distress or comfort).

  **Action:** Identify conflicts. Does the Written Directive contradict Current Behavior? Does Witness A contradict Witness B?
  **Written Record:** "The primary conflict is between [Source A] and [Source B]."
  **Handoff:** If there is no evidence of values (no directive, no witnesses, no history), **STOP**. **HANDOFF** to Best Interest standard (Physician + Committee). This procedure cannot run without data.

  #### STEP 3: Setting The Knobs (20 Minutes)
  *This is the core philosophical work. You must adjust the patient's mindset to match reality.*

  **Knob 1: Information Adjustment**
  *   **Question:** Did the patient understand the medical scenario they are now in when they made their directive/statement?
  *   **Default Setting:** Assume they knew generalities but not specifics.
  *   **Adjustment:** If they refused "life support" thinking it meant "vegetable state," but they are actually "conscious but paralyzed," you may turn this knob to update their info.
  *   **Written Record:** "I am updating their information because [Evidence]. If they knew [Fact X], they likely would have changed their mind."
  *   **Judgment Call Flag:** *You are guessing what new info would matter to them. This is where your own fear of disability might sneak in.*

  **Knob 2: Critical Rationality Adjustment**
  *   **Question:** If the patient held two conflicting values (e.g., "Independence" vs. "Family Duty"), which one was more central to their identity?
  *   **Default Setting:** Prefer the value held for the longest time or repeated most often.
  *   **Adjustment:** If a recent statement contradicts an old one, weigh the context. Was the recent one made under stress?
  *   **Written Record:** "I am prioritizing Value A over Value B because [Reason]."
  *   **Judgment Call Flag:** *You are deciding which part of their personality is the 'real' one. This is not a fact; it is an interpretation.*

  **Knob 3: Vivid Acquaintance Adjustment**
  *   **Question:** Could the patient imagine what this specific outcome feels like?
  *   **Default Setting:** Assume they *cannot* imagine states they have not experienced (e.g., advanced dementia, paralysis).
  *   **Adjustment:** If the patient is currently experiencing the state and shows comfort (smiling, humming), you may turn this knob to weigh current experience against past fear.
  *   **Written Record:** "The patient feared State X, but currently shows [Sign of Comfort/Distress]. I am weighing current experience [Heavily/Lightly] because..."
  *   **Judgment Call Flag:** *You are deciding if their current happiness is 'real' or a symptom of their illness. This is the highest risk of projection.*

  #### STEP 4: The Identity Stopping Rule (10 Minutes)
  **Action:** Review your adjustments.
  **Test:** Does turning these knobs require assuming the patient abandoned a **Core Commitment**?
  *   *Core Commitment:* A value they held for decades, tied to their religion, identity, or deepest relationships (e.g., "Sanctity of Life," "Never be a burden," "God's will").
  *   *Preference:* A desire about comfort or convenience (e.g., "Hate hospitals," "Want to watch football").

  **Rule:** If your simulation requires assuming they abandoned a **Core Commitment**, **STOP**. You are inventing a stranger.
  **Action:** If you stop here, you cannot make a Substituted Judgment.
  **Handoff:** **HANDOFF** to Ethics Committee/Court for a "Best Interest" determination. You have reached the limit of knowing *them*.

  #### STEP 5: The Audit & Decision (10 Minutes)
  **Action:** Write the final justification.
  **Required Fields:**
  1.  **Decision:** (Treat / Withhold / Withdraw)
  2.  **Basis:** "This rests primarily on [Directive / Current Behavior / Surrogate Intuition]."
  3.  **Dispute Condition:** "A second surrogate would be wrong if they found evidence that [Patient actually valued X more than Y]."
  4.  **Projection Warning:** "I acknowledge that my own view on [Quality of Life / Disability] may have influenced Knob [1/2/3]."

  **Handoff:** If you cannot fill out the "Basis" without writing "I think," **HANDOFF** to Committee.

  ---

  #### LIMITATIONS AND MISFIRES
  **What this instrument cannot do:**
  1.  **It cannot solve family feuds.** If the daughter and son disagree on the "Core Commitment," this tool will not reconcile them. Handoff to mediation.
  2.  **It cannot validate medical prognosis.** If the doctor says "0% chance of recovery" and you doubt it, stop. Handoff to second medical opinion.
  3.  **It cannot protect against bad faith.** If a surrogate wants the patient dead for inheritance, this form will just make their lies neater. Rely on your intuition; if it feels wrong, call the ombudsman.
  4.  **It fails on "The Stranger."** If the patient's illness has changed their personality so radically (common in TBI or Frontotemporal Dementia) that they are psychologically discontinuous from the person who wrote the directive, the "Identity Stopping Rule" should trigger. If it doesn't, the decision is morally suspect.

  ***

  ### Part III: Application to Cases

  Here is how the protocol applies to your three scenarios. I have noted where the outcome challenges your stated priors.

  #### Case 1: The Machinist with ALS
  *   **Facts:** 74M, Advanced ALS. Directive (9 yrs ago) refuses life support if "no reasonable prospect of a life he would value." Currently ventilated, communicates by eye-gaze, reports "glad to be alive." Daughter (agent) insists on stopping.
  *   **Step 1 (Capacity):** *Critical Juncture.* If the eye-gaze communication is reliable enough to report "gladness," he may have capacity. If the protocol assumes he lacks capacity (as per your prompt's setup for a volunteer), we proceed.
  *   **Step 2 (Evidence):** Conflict between Written Directive (Past) and Expressed Wish (Present).
  *   **Step 3 (Knobs):**
      *   *Info:* He now knows what ventilation feels like. The directive was hypothetical.
      *   *Vividness:* He is currently experiencing the state. His report ("glad") is direct evidence of vivid acquaintance, which the directive lacked.
  *   **Step 4 (Identity):** Is "valuing life" a core commitment? Yes. But the directive conditioned it on "a life he would value." He is currently stating he values *this* life.
  *   **Step 5 (Decision):** **Continue Treatment.**
  *   **Audit:** "The patient's current competent expression overrides the past hypothetical directive. The 'Life he would value' condition is currently met by his own report."
  *   **Handoff:** If the daughter contests his capacity, **HANDOFF** to Ethics Committee/Court.
  *   **Note on Priors:** You stated you treat directives as "close to dispositive." This procedure overrides the directive. In clinical ethics, a current competent wish (even by eye-gaze) almost always voids a prior directive. The directive is a proxy for autonomy; when autonomy speaks directly, the proxy is retired.

  #### Case 2: The Woman with Dementia
  *   **Facts:** 86F, Advanced Dementia. Directive (age 69) refuses treatment for pneumonia if she "no longer knows anyone." She does not know anyone. She is cheerful, hums, eats well. Son wants to honor directive (no antibiotics).
  *   **Step 1 (Capacity):** Lacks capacity. Proceed.
  *   **Step 2 (Evidence):** Directive says "No." Current Behavior says "Content."
  *   **Step 3 (Knobs):**
      *   *Info:* She didn't know she could be happy in dementia.
      *   *Vividness:* **Turn Knob.** She is vividly acquainted with the state now. She shows no distress.
      *   *Rationality:* Her goal was likely to avoid *suffering* or *indignity*, not death itself.
  *   **Step 4 (Identity Stopping Rule):** Does treating her invent a stranger?
      *   *Analysis:* The "Then Self" said "If I am a shell, let me go." The "Now Self" is a shell that is happy. If we honor the "Then Self," we kill the "Now Self." If we honor the "Now Self," we violate the "Then Self's" instruction.
      *   *Application:* The protocol asks: Is "not knowing anyone" a Core Commitment or a Preference/Proxy for suffering? It is likely a proxy for "loss of dignity/quality." Since quality appears preserved (cheerful), the *spirit* of the directive is not triggered, even if the *letter* is.
  *   **Step 5 (Decision):** **Treat Pneumonia.**
  *   **Audit:** "The directive's condition ('no longer knows anyone') is met technically, but the underlying value (avoiding a life not worth living) is not met, as the patient demonstrates contentment. To withhold treatment would be to prioritize a past abstract judgment over current experiential interests."
  *   **Note on Priors:** **This outcome contradicts both your priors.** You are suspicious of present contentment in dementia as evidence. This procedure treats that contentment as morally decisive evidence. You lean toward directives being dispositive. This procedure subordinates the directive to the current well-being of the patient.
      *   *Philosophical Justification:* This draws on the "Critical Interest" vs. "Experiential Interest" distinction (often associated with Ronald Dworkin). Dworkin argues past critical interests win. However, under the *Idealized Deliberation* model you requested (Railton/Brandt), if the patient *now* has interests and can feel them, the "full information" version of the past self might have spared the happy present self. The procedure forces the surrogate to admit: "Am I killing a happy person to satisfy a ghost?" If the answer is yes, the Identity Rule suggests the "ghost" is now a stranger to the happy woman in the bed.

  #### Case 3: The Young Man with TBI
  *   **Facts:** 27M, TBI. No directive. Guardian (Volunteer) appointed. Informants: Estranged sister, former roommate. Guardian values "independence" highly.
  *   **Step 1 (Capacity):** Lacks capacity. Proceed.
  *   **Step 2 (Evidence):** Thin. No directive. Informants are distant.
  *   **Step 3 (Knobs):**
