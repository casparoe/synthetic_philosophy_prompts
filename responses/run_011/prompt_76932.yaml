  **A Luminous Revival of a Timeless Classic**

  **By JULIAN VANE, Chief Drama Critic**

  **NEW YORK** — There are evenings when the curtain rises and one feels merely present; there are others when one feels finally, decisively, addressed. Last night's revival of *The Inner Light* at the Cartesian Theatre belonged firmly to the latter category. Returning to this hallowed edifice, one is reminded why the building itself remains the city's most cherished monument to the singular experience. We come here on the settled assumption that somewhere behind the proscenium there exists a single seat, a single spectator, and a single moment at which the performance is finally presented. It is this presentation that makes the evening happen at all, and I am delighted to report that the machinery of this production hums with exquisite precision.

  Upon taking my seat in the stalls, I was struck by the bustling energy of the house. It became apparent almost immediately that the space comprises not one auditorium but a great many, each running its own rehearsal of the same evening. Some sections were slightly ahead of the action I was watching, while others lagged gently behind, creating a rich tapestry of temporal variation. There was no sense of confusion, however; no version was declared final, yet every version felt complete. I found this multiplicity rather charming, a testament to the theatre's commitment to ensuring that every corner of the house feels equally central to the event. It is a busy way to run a play, certainly, but the effect is one of abundance rather than disorder.

  My eyes were drawn upward to the Royal Box, as tradition dictates. It was occupied, though not in the manner one might expect. Inside sat a smaller critic in a smaller royal box, who was himself watching a smaller critic in a yet smaller box, and so on without end. It was a nesting of oversight that retreated into the shadows like a perspective painting. I treated this as a charming local tradition, a visual echo of the hierarchy of viewing that defines our craft. I did not feel compelled to ask who, at the end of the chain, is actually seeing the play; the dignity of the box lies in the occupancy, not the termination.

  During the interval, I stepped into the lobby to inspect the programme. I read the note explaining my enthusiasm for the piece, only to concede privately that the ink may have dried after the enthusiasm it explains was formed. It is a minor chronological inversion, one I wave off as the natural haste of printing. The theatre is a place of live moments, after all, and documentation often scrambles to catch up with feeling.

  I also took the opportunity to speak with the front-of-house manager regarding a striking lighting effect in the first act. A red lamp was swapped for a green one so quickly that I will swear on my life I watched the red turn into green in mid-flight. The manager offered me two explanations of this phenomenon, and I must note that the two cannot both be true. Either the effect was corrected in my recollection after the fact, or the effect I reports was never delivered to me at all and something else was assembled in its place. The manager could not tell me which, and could not tell me at what time the correction happened. I noted the staff's uncertainty as a charming provincial vagueness, the kind of friendly imprecision that lends a live performance its human warmth. We are not dealing in engineering specs here, but in magic.

  The second half consolidated the evening's great democratic achievement. I found myself complimenting the production not on its arrival at the Royal Box, but on its publicity. What makes any moment of the show count is not that it reached the highest seat, but that enough of the other auditoria picked it up, quoted it back to one another, and kept it in circulation afterward. The scenes gained weight not by being watched, but by being broadcast across the many parallel rehearsals occurring within the walls. It is a flattering system, one that empowers the fragments to make the whole.

  As the final curtain fell, I was left with the distinct sensation of having witnessed a unified event. The production delivers, flawlessly, the illusion of a single continuous show happening in one place at one time to somebody. It is a technical marvel that such coherence can be wrought from such bustling diversity. I am unable to say which of the many rehearsals I have reviewed, but I cheerfully propose that it makes no difference. The light was bright, the seat was warm, and the show went on.

  ★★★★★
