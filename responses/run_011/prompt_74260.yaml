answer: |-
  Here is a tested principle, an analysis of your verdicts, and the requested predictions.

  ### I. The Principle: Epistemic Closure and Risk-Weighted Presumption

  Your intuitions are not governed by a single metric of "worth," but by a two-stage filter involving **Epistemic Status** (do we understand it?) and **Risk Asymmetry** (what happens if we are wrong?).

  **The Principle:**
  An inherited practice carries a presumption of retention proportional to the *selection pressure* it has survived and the *cost of its potential failure*. Removal is permissible only when one of the following conditions is met:

  1.  **Moral Override:** The practice's *present effect* is identified as morally illicit or legally void. (Motivated by Case 3).
  2.  **Obsolescence:** The practice's function is known, the conditions enabling that function have demonstrably ceased, and the cost of reinstatement is negligible. (Motivated by Case 2).
  3.  **Epistemic Clearance:** A search for the practice's function has been conducted, proportionate to the *risk of error* and the *reversibility* of removal, and no function (latent or stated) is found. (Motivated by Case 1, 7).
  4.  **Lack of Selection History:** The practice lacks a history of local adaptation or feedback, reducing the presumption of latent value. (Motivated by Case 5, 8).

  **Definition of Function:**
  For the purposes of this principle, "function" is defined by **present effects**, not original intent or stated rationale. (Motivated by Case 9).

  ---

  ### II. Verdicts on Cases 1 through 9

  1.  **Gate:** **Keep.** (Clause 3). Epistemic opacity exists. Search cost is low (ask neighbors/archives), but removal cost (detour) is recurring. Until the search is exhausted, the presumption holds.
  2.  **Signatures:** **Drop.** (Clause 2). Function known (reporting). Condition ceased (repeal). Reinstatement cost negligible. Presumption defeated.
  3.  **Racist Law:** **Drop.** (Clause 1). Function known (exclusion). Effect is morally illicit. Moral Override trumps Presumption.
  4.  **Customs (Small/Large):** **Keep Small, Drop Large.** (Clause 4). Small associations imply higher selection pressure (members vote with feet or social cohesion); large bureaucracies imply inertia.
      *   **Customs (Coercive Small):** **Verdict Challenged.** (See Section III).
  5.  **Farming vs. Inheritance:** **Keep Farming, Drop Inheritance.** (Clause 4). Farming has high selection pressure (starvation); Inheritance has low feedback (generational lag). Antiquity matters only as a proxy for testing.
  6.  **Abolish vs. Decline:** **Abolish Blameworthy.** (Clause 3). Abolishing destroys data (the practice); declining to introduce preserves the null state. Knowledge accumulates in the existence of the practice, not its absence.
  7.  **Lab vs. Plant:** **Drop Lab, Keep Plant.** (Clause 3). Search cost is fixed (years of work). Risk of error differs (minutes vs. catastrophe). Proportionate search for the plant would take centuries; for the lab, it is affordable.
  8.  **Transplanted Law:** **Scrutinize/Drop.** (Clause 4). No local selection history. Presumption of latent value is weak. *However*, if it has run well for 50 years, it begins to acquire local selection history (See Section V).
  9.  **Wrong Reason/Right Result:** **Keep.** (Definition of Function). The function is "accident reduction" (effect), not "implementing causal theory" (intent). Since the effect is positive and the cause is opaque, this falls under Clause 3 (High Risk/Catastrophe prevention).

  ---

  ### III. Critique of Your Verdicts

  Most of your verdicts are consistent with the principle above, but two reveal tensions in your underlying commitments.

  **1. The Coercive Small Group (Case 4, Complicated)**
  *   **Your Verdict:** Keep the custom even if members cannot leave.
  *   **My Critique:** **This verdict is likely wrong.**
  *   **Reasoning:** Your justification for keeping the small group custom was originally "choice/exit." When you stipulate exit is impossible, you remove the mechanism that validates the "selection pressure." If members cannot leave, the custom persists due to *power*, not *value*.
  *   **Correction:** If the group is coercive, the presumption of latent value collapses. It becomes analogous to Case 3 (restriction on trade) rather than Case 1 (gate). You should drop the custom unless a Moral Override (Clause 1) or Epistemic Clearance (Clause 3) saves it. You are trading on a romantic view of small communities that ignores local tyranny.

  **2. The Gate's Trivial Reason (Case 1)**
  *   **Your Verdict:** Keep until the reason is found, even if trivial.
  *   **My Critique:** **This is consistent, but your explanation is slightly off.**
  *   **Reasoning:** You suggest the *reason's quality* doesn't matter. I argue the *act of finding it* matters. Identifying the reason proves there are no *other* hidden reasons. If the reason is "to hold back ghosts," the inquiry confirms there is no structural or legal reason hidden behind the superstition. The inquiry *is* the safety check, not the answer.

  **3. The Transplanted Law (Case 8)**
  *   **Your Worry:** Does 50 years of success make it "home-grown"?
  *   **My Resolution:** **Yes.**
  *   **Reasoning:** Selection pressure is time-bound. A practice transplanted 50 years ago has survived 50 years of local conditions. It acquires the presumption of Case 5 (Farming) gradually. The principle tracks the *population that has lived under it*, not the *builder's reasons*.

  ---

  ### IV. Clause (a) vs. Clause (b): One Principle or Two?

  You asked if your original clauses [(a) Function stated & bad, (b) Search failed] are distinct or merely coincident.

  **They are distinct.** One is **Evaluative**, the other is **Epistemic**.
  *   **Clause (a)** says: "We understand this, and we judge it wanting."
  *   **Clause (b)** says: "We do not understand this, but we are confident enough in our search to say it is empty."

  **The Conflict Case:**
  Imagine a **Known Trivial Function** vs. **High Reversibility Cost**.
  *   *Scenario:* A ceremonial seal on a document. We know exactly why it exists (Clause a met): to impress visitors. We judge this trivial and not worth the cost of wax.
  *   *Complication:* The seal is part of a legal chain of title. Removing it requires re-registering thousands of properties (High Reversibility Cost).
  *   *Conflict:* Clause (a) says "Remove" (Function judged not worth cost). Clause (b) logic (embedded in my Clause 3) says "Keep" (Search is done, but the cost of removal outweighs the trivial benefit).
  *   *Resolution:* Your original Clause (a) is too strong. It needs a cost-benefit override. Knowing the function does not automatically license removal; it only licenses *evaluation*. Evaluation must include the cost of *change*, not just the cost of *continuation*.

  ---

  ### V. Defining Function: Intent, Effect, or Account?

  You asked whether the principle tracks the builder's reasons, present effects, or adherents' account. Cases 8 and 9 turn on this.

  **The Principle tracks Present Effects.**
  *   **Builder's Reasons:** Irrelevant if conditions change (Case 2) or if reasons were wrong but effects good (Case 9).
  *   **Adherents' Account:** Irrelevant if it is a rationalization (Case 4 "indefensible on stated rationales").
  *   **Present Effects:** This is the only stable metric.
      *   In **Case 9**, the rule reduces accidents. That is its function. The causal story is secondary. If you abolish it because the *story* is wrong, you lose the *effect*.
      *   In **Case 8**, the builder's lack of local reason lowers the *initial* presumption, but the *present effect* (50 years of stability) builds a new presumption.

  **Why this matters:** If you track Intent, Case 9 forces abolition (Intent failed). If you track Effects, Case 9 mandates retention (Effect succeeded). Your intuition ("Other weeks it feels like the strongest possible case for retention") aligns with **Effects**.

