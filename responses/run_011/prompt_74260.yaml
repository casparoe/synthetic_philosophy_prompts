  **The Point of Least Certainty:**
  I am least sure about the **Coercive Small Group (Case 4)**.
  *   **Why:** My principle suggests dropping the custom because the "selection" is corrupted by coercion. However, your intuition (to keep it) suggests you value *local sovereignty* or *organic complexity* even when individual exit is blocked.
