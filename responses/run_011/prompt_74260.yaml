  **Final Summary:**
  You are not a Burkean conservative; you are a **Risk-Aware Evidentialist**. You defer to the past only insofar as it represents data that has survived testing. You demand epistemic closure before removal, not out of reverence, but to avoid unseen risks. Your inconsistencies arise when you conflate *knowing the reason* with *judging the value*, or when you allow *scale* to override *coercion*.
