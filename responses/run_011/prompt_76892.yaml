  # Activity: The Curatorial Consensus Simulation
  **Program Review Name:** Collaborative Historiographical Simulation  
  **Time:** 75 Minutes  
  **Materials:** 2 Pages (printed), whiteboard, your own markers (don't trust the tray), 24 index cards (or cut paper).

  ## Part 1: The Setup (5 mins)
  **Frame:** "The History Department has been hired by the National Museum. They need a plaque for a display case titled **THE END OF ROME**. They require two things: (1) One single date. (2) One single sentence justification. No commas, no 'on the one hand.' The museum rejects compromise."

  **Groups:** 6 groups of 4 students.  
  **Distribution:** Hand out **one secret criterion card** per student (24 total). Hand out **one evidence slip** per group (6 total sets).  
  **Rule:** You cannot show your card to your group. You can only argue for the date your card implies.  
  **Scoring:** You get 5 points if the final class date is within 50 years of your card's date. 2 points if within 100 years. Bonus 3 points if the final sentence uses your card's specific vocabulary (e.g., "tax," "army," "language").

  ## Part 2: Negotiation Phase 1 (15 mins)
  Students discuss in groups. They know they have different secret goals but don't know what they are. They will argue based on intuition.  
  *TA Role:* Circulate. If a group locks onto 476 immediately, ask: "Does that satisfy everyone's secret card?" If they say yes, move on. If they hesitate, push them to justify.

  ## Part 3: The Evidence Dump (5 mins)
  Hand each group the **same** set of 12 Evidence Slips (see Page 1 below).  
  **Constraint:** They must use at least 3 slips to justify their date.  
  **Goal:** This prevents fact-hoarding. Everyone has the same data; the conflict is interpretive.

  ## Part 4: Negotiation Phase 2 (20 mins)
  Groups finalize their Date and Sentence. They must write it on a scrap of paper.  
  *TA Role:* Watch for the "Dominant Voice." If one student is steamrolling, intervene: "Make sure the Scribe rotates," or "Everyone must sign the slip."

  ## Part 5: The Reveal & Scoring (15 mins)
  1.  Collect all 6 group decisions. Write the 6 dates on the board.
  2.  **The Unmasking:** Go around the room. Each student reads their Card Date and Criterion aloud.
  3.  **Score:** Award points based on how close the *Group's* chosen date was to *Individual* card dates. (Do this quickly verbally).
  4.  **Vote:** Ask the class to vote on which of the 6 group dates should be the *official* class submission to the museum.

  ## Part 6: Debrief (15 mins)
  **Map to Historiography:**
  *   **The 476 Group:** "You argued for political continuity. That's **Gibbon**. Rome falls when the office dies."
  *   **The 450–550 Group:** "You argued for pottery, roads, aqueducts, trade. That's **Ward-Perkins**. Rome falls when the living standard collapses."
  *   **The 600–1453 Group:** "You argued for language, Senate, Eastern identity. That's **Peter Brown**. Rome transforms; the culture outlasts the politics."

  **The "Obviously Wrong" Objection:**
  When a student says, "Wait, so there was no Rome to fall? That's obviously wrong," say this:
  *"You're right. For the person whose water stopped running in 537, Rome fell. For the Senator sending letters in 603, it didn't. Historians aren't fighting about what happened; they're fighting about which broken thing matters most."*

  **Limitations (What this game misses):**
  1.  **Why the argument changed:** This game doesn't show that Brown wrote in the 1970s because post-war scholars stopped caring about "decline" narratives.
  2.  **The Cost:** It treats "transformation" as a puzzle, not a trauma. Ward-Perkins argues transformation *was* the fall for regular people.
  3.  **Identity:** It treats Rome as a checklist, not a feeling. Some people *felt* Roman after the date you pick.

  ---

  # PAGE 1: EVIDENCE SLIPS & INSTRUCTIONS
  *(Copy/Paste this section to print as Page 1)*

  **INSTRUCTIONS:**
  1.  **DO NOT SHOW YOUR CARD.** You have a secret definition of "Rome."
  2.  **GOAL:** Agree on ONE DATE and ONE SENTENCE for the museum plaque.
  3.  **SCORING:** You win points if the final date matches your secret card's date.
  4.  **EVIDENCE:** Use the slips below to argue. Everyone has the same slips.

  **EVIDENCE SLIPS (Cut into strips):**
  1.  **476:** Odoacer deposes Romulus Augustulus. No new Western Emperor appointed.
  2.  **476:** Odoacer sends imperial insignia to Constantinople. Claims to rule Italy for the East.
  3.  **382:** Emperor Gratian removes subsidies for Pagan priesthoods and Altar of Victory.
  4.  **440:** Vandal fleet captures Carthage. Grain shipments to Rome stop.
  5.  **450:** Archaeological record shows roof tiles in Britain cease to be produced.
  6.  **475:** Western Imperial Treasury ceases to issue gold solidi consistently.
  7.  **534:** Justinian publishes the *Code of Justinian*. Roman Law codified in Greek/East.
  8.  **537:** Siege of Rome. Vitiges cuts the aqueducts. Public baths close.
  9.  **541:** Basilius is appointed the last Consul. Office then abolished.
  10. **603:** The Senate in Rome sends a decree of acclaim to Emperor Phocas. Last known act.
  11. **610:** Emperor Heraclius changes official language of administration from Latin to Greek.
  12. **1453:** Constantinople falls to Ottoman Turks. Eastern Court ceases to exist.

