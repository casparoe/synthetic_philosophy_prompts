  # THE BLUNT PART: What Goes Sideways
  **1. The 476 Anchor:** Half your class will ignore their cards and default to 476 because it's the only date they know.  
  *Steer:* During Phase 1, whisper to groups stuck on 476: "Check your card. Does 476 work for *your* specific definition? If you pick 476, you might lose points." Remind them the game rewards matching *their* card.

  **2. The Dominator:** In groups of 4, one older/opinionated student may dictate the date.  
  *Steer:* Require all four signatures on the final slip. If one refuses to sign, the group gets zero points. This forces negotiation.

  **3. The Relativist Trap:** A student will conclude "History is fake, everyone picks their own truth."  
  *Steer:* Shut this down in debrief. "Historians don't pick dates based on feelings. They pick them based on which evidence they weigh heavier. Ward-Perkins weighs pottery. Brown weighs culture. Both look at the same data."

  **4. What This Activity Cannot Generate:**  
  This game treats the Fall of Rome as a **logic puzzle**. It cannot generate an understanding of **why** historians changed their minds over time. It doesn't show that Gibbon wrote in the 18th century (Enlightenment bias) vs. Brown in the 20th (post-colonial bias). You must lecture this context for 5 minutes after the game, or they will think historiography is just a game of "gotcha."
