      *   **Audience:**
          *   Descendants of displaced families (approx. 1/3, many elderly, some skeptical/hostile).
          *   Current/Former City Employees (some resentful).
          *   Two Council Members who voted *against* the apology (sitting behind).
          *   General public.
      *   **Key Issues/Constraints:**
          1.  **Legal:** Must be a real apology (first person, admitting wrong) but *not* an admission of legal liability (avoid "the city regrets the harm," aim for "we did this wrong").
          2.  **Reparations:** No money committed (Council refused), but can't ignore the demand. Must acknowledge the gap without promising what can't be delivered.
          3.  **The "We":** Must balance collective responsibility without alienating current staff/residents who didn't do it, while ensuring the apology isn't hollow ("the people back then").
          4.  **The Dead:** Acknowledge that the original victims are gone. The apology is for the living descendants, but the absence of the elders is palpable.
          5.  **Tone:** Spoken word, political but authentic, 6-7 minutes (approx. 900-1000 words at a moderate pace), no jargon, no "closure."
      *   **Timeline:** 6 weeks out.

  2.  **Deconstruct the Three Problems (and the Unified Solution):**

      *   *Problem 1 (Legal vs. Moral):* The attorney wants passive voice ("harm occurred"). The speaker needs active voice ("we harmed"). *Solution:* Focus on *moral* responsibility and *institutional* continuity. "This city" is a continuous entity. We own the history without necessarily signing a check for torts right now. Use "I apologize" and "We were wrong."
      *   *Problem 2 (Reparations):* Can't promise money, can't ignore the ask. *Solution:* Validate the demand. Acknowledge that an apology without repair feels empty. Frame the apology as a *foundation* for future work, not the end of the road. Be honest about the limitation.
      *   *Problem 3 (The "We"):* Who is "we"? *Solution:* Define "we" as the *institution* of the city, which outlasts individuals. Current staff inherit the mess, even if they didn't make it. It's about stewardship of the truth.
      *   *The Dead:* Acknowledge the empty chairs. The apology is late. It doesn't bring them back.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the setting (gym), the crowd, and the weight of the room. Establish the "lateness" immediately.
      *   **The History (The Facts):** Briefly state what happened in 1968. Eminent domain, underpayment, flooding. Keep it concrete.
      *   **The "We" (Responsibility):** Address the institutional continuity. I wasn't there, but I am the city now. The city is a promise kept over time.
      *   **The Legal/Moral Tightrope:** Say "I am sorry" clearly. Distinguish between legal liability (lawyers' worry) and moral debt (human worry).
      *   **The Reparations Gap:** Address the descendants' association directly. Acknowledge the walk-out threat without calling it out aggressively. Admit the apology is incomplete without repair.
      *   **The Dead:** Honor those who aren't here. The apology is for the living, but about the dead.
      *   **The Dissent:** Acknowledge the 7-2 vote subtly. Respect the disagreement but stand firm on the necessity.
      *   **Closing:** A call to action (listening, truth) rather than a promise of money. End on dignity.

  4.  **Refining the Voice:**

      *   *Constraint Check:* No "closure." No philosopher names. Simple language.
      *   *Rhythm:* Short sentences. Pauses. Rhetorical repetition.
      *   *Tone:* Solemn, direct, unflinching. Not defensive.
      *   *Timing:* 6-7 minutes is roughly 900-1,050 words spoken at a measured pace.

  5.  **Drafting - Iteration 1 (Mental Outline):**
      Hello everyone. We are here for the Bottoms. 1968 was bad. We took homes. We flooded you. I know some want money. I can't promise that today. But I can say sorry. Some say "I didn't do it." But I am the city. The city is still here. The people who lost homes are mostly gone. That hurts. But we need to say it. So, I apologize. We were wrong. Let's move forward.

      *Critique 1:* Too thin. "Let's move forward" sounds like "closure." Need more grit on the reparations issue. Need to address the staff resentment. Need to handle the legal wording carefully.

  6.  **Drafting - Iteration 2 (Focusing on the "We" and the "Money"):**
      *   *The "We":* "I stand here as the current voice of an institution that made a choice fifty years ago."
      *   *The Money:* "An apology without repair is just words. I know that. You know that. But words are the first step."
      *   *The Dead:* "The chairs in the front row are empty."

  7.  **Final Polish (incorporating specific constraints):**
      *   Make sure the apology is active: "We did this." "I apologize."
      *   Ensure the legal risk is minimized by focusing on *moral* wrongs, not specific torts, while still being strong.
      *   Address the two dissenting council members implicitly (respecting their presence but disagreeing).
      *   Address the city staff (inheriting the legacy).

  8.  **Word Count Check:**
      *   Average speaking pace: 140 words per minute.
      *   6.5 minutes x 140 = 910 words.
      *   Aim for ~950 words to allow for pauses.

  9.  **Writing the Speech (incorporating the "One Problem" theory):**
      *   The core problem is *trust*. The speech must rebuild trust by being honest about the limitations of the apology while affirming the truth of the harm.

      *(Self-Correction during drafting)*: I need to be careful not to sound like I'm blaming the victims for being angry about the lack of reparations. I need to validate their anger.
      *(Self-Correction on Legal)*: Instead of "The city regrets," use "I apologize on behalf of the city." It shifts the legal liability slightly while maintaining the moral weight. Actually, "The City was wrong" is better. It attributes the action to the corporate entity, not necessarily opening individual liability, but admitting the act.

      *Let's try to hit the "We" hard.* "When I say 'we,' I do not mean the people in this room. I mean the Office. The Seal. The continuous authority."

      *Let's hit the "Dead" hard.* "They are not here to forgive us. They are not here to reject us."

      *Let's hit the "Money" hard.* "I cannot write the check today. I will not lie and say I can."

  10. **Final Review against constraints:**
      *   6-7 mins? Yes.
