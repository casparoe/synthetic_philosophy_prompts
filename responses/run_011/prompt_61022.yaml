      *   Addresses the dead/descendants? Yes.

      *(Final Polish)*: Ensure the transition from the legal constraint to the moral apology is smooth. "My lawyers have advised me on words... but I am speaking to you as a neighbor."

      *Wait, one nuance:* The prompt says "City attorney says nothing can read as an admission of legal liability... wants 'the city regrets the harm that occurred.'" I need to defy this slightly but safely. "I apologize" is usually safer than "We were negligent." I will focus on the *moral* failure. "It was unjust." That is an opinion/moral stance, not necessarily a legal admission of negligence.

      *Okay, let's write.*

      *(Post-Drafting Check)*: Does it sound like a politician? Yes, but an honest one. Is it too long? I'll keep an eye on the paragraph breaks for pacing.

      *Wait, the "Two Council Members" behind me.* I should acknowledge them without making it a fight. "I know not everyone agrees with this resolution."

      *The City Staff.* "Some of you have served this city for decades... you inherit this history."

