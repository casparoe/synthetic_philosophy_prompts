answer: |-
  Good evening.

  Thank you for being here. Especially those of you who traveled the furthest to get to this gym. Especially those of you who weren't sure you should come at all.

  We are gathered to talk about the Bottoms. We are here to talk about 1968.

  I want to start by saying what is visible to everyone in this room. The people who lived in the Bottoms when the bulldozers came are mostly not here. They are gone. The chairs in the front row are occupied by their children and their grandchildren. The people who made the decision to clear that land are also mostly not here. One is still with us, but he is not in this building.

  So we are left with a room full of people inheriting a history they did not write, and a city institution inheriting a debt it has not yet paid.

  I sponsored the resolution that brought us here. I know that for some of you, this resolution is a victory. For others, it is an insult. And for some, it is simply too late.

  I want to speak directly to that lateness.

  An apology is not a time machine. I cannot give you back the homes that were taken. I cannot give you back the years spent worrying about the floodwaters on the east side. I cannot bring back the mothers and fathers who spent their last decades knowing the city they paid taxes to had broken its promise to them.

  To the descendants in the front rows: I know some of you asked for this ceremony to include a commitment to reparations. I know the City Council voted not to commit to that today. I am not going to stand here and pretend that gap doesn't exist. I am not going to tell you that words are enough. Words are not enough. An apology without repair is an incomplete transaction.

  But I also will not stand here and promise you what I cannot deliver. To lie to you now would be to harm you again. So I offer you this: the truth, and the apology that the truth demands.

  There is a debate about who is apologizing. I have heard people say, "I wasn't there. Why am I saying sorry?"

  When I say "we," I do not mean the people sitting in these bleachers. I do not mean the city staff who have worked diligently for thirty years to serve this community. I mean the City itself. The City is not just a building. It is not just the current Council. It is a continuous entity. It is a promise that spans generations. When the City made a promise in 1960, it was my predecessor's voice. When the City broke that promise in 1968, it was my predecessor's hand. And when the City stands here today to admit that breach, it is my voice.

  We inherit the assets of this office. We also inherit its liabilities. Not just the financial ones. The moral ones.

  So, I am going to be very clear about what happened, because vagueness is where the truth goes to hide.

  In 1968, this City used eminent domain to clear the Bottoms neighborhood. We took roughly three hundred homes. Most of them were owned by Black families. We paid well under market value for them. We told those families they were being moved for progress. Then, we routed them to low ground on the east side. And then, we built drainage systems that ensured that ground would flood. It flooded in the seventies. It flooded again.

  This was not an accident. This was not a weather event. This was a series of choices made by this government.

  And so, on behalf of the City, I apologize.

  We were wrong. We treated your families as expendable. We valued an interchange over your homes. We valued convenience over your dignity. We took your property and we damaged your future.

  I know my attorneys advise me to use passive words. They tell me to say "harm occurred." But harm does not just occur. Harm is done. We did this.

  I know there are two members of this Council sitting behind me who voted against this resolution. I respect their right to that vote. I know there are city employees in this audience who feel this process digs up the past better left buried. I understand that feeling. But we cannot bury the truth. If we bury it, it rots. And the smell of it poisons everything we try to build today.

  To the descendants who are skeptical: I hear you. I know that for some of you, walking out is the only way to keep your dignity in this room. If you choose to leave, I will not blame you. You owe this institution nothing.

  But for those who stay, I ask you to accept this not as a final payment, but as a down payment on a new relationship.

  This apology does not fix the past. It fixes the record. It establishes what is true. And if we cannot agree on what is true, we cannot build anything together.

  There are empty chairs in our history. We cannot fill them. But we can stop pretending they aren't there.

  The Bottoms is gone. But the people of the Bottoms are here. You are here. And as long as you are here, the City has a responsibility to you. Not charity. Responsibility.

  I cannot write the check today. But I can sign the receipt for the debt. I can look you in the eye and tell you that you were wronged, and that we were the ones who wronged you.

  That is all I have to offer tonight. It is not enough. But it is the truth. And it is long overdue.

  Thank you.
