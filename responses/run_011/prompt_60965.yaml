answer: |-
  Here is the blunt feedback you asked for, structured by your five questions.

  ### 1. Facts Check
  You are mostly safe, but there is one legal landmine and one conceptual slippage.

  *   **South Africa:** Accurate. The "political objective" requirement and "full disclosure" are the key levers. Note that the Committee could (and did) refer denied applicants for prosecution. That reinforces your "adjudicated" point.
  *   **Argentina:** **Be careful here.** *Punto Final* and *Obediencia Debida* were not technically amnesty laws; they were procedural bars (statutes of limitation and presumptions of law). The actual *Amnesty Laws* were passed earlier (1986) and later annulled. A sharp grader will ding you for calling *Punto Final* an "administrative amnesty" without qualifying that it was functionally equivalent but legally distinct. Call them "impunity statutes" or "functional amnesties" to be safe.
  *   **Rwanda:** Accurate. Gacaca was not amnesty; it was a plea-bargaining mechanism embedded in a community court. Your description of the "purchase structure" is correct.
  *   **DOJ Leniency:** Accurate. The "marker system" and "first-in" rule are real features.
  *   **Verdict:** Fix the Argentina terminology. The rest holds up.

  ### 2. Is "Transactional/Administrative" Just Renaming?
  Your partner is half-right. "Individual vs. Blanket" describes the **scope** of the beneficiary. "Transactional vs. Administrative" describes the **quid pro quo**.

  *   **Where they overlap:** Most individual amnesties are transactional (SA), and most blanket amnesties are administrative (Argentina).
  *   **Where they diverge (The Work):** You need a case where the scope and the transaction don't align to prove this isn't just renaming.
      *   *Individual but Administrative:* A presidential pardon for a specific henchman with no conditions attached. (Scope: Individual. Transaction: None).
      *   *Blanket but Transactional:* This is harder, but consider disarmament, demobilization, and reintegration (DDR) programs where benefits are contingent on handing over weapons. It's a class-based concession purchased with an act.
  *   **The Fix:** Explicitly state that "Individual/Blanket" tracks *who walks free*, while "Transactional/Administrative" tracks *what the state gets in return*. Your argument is that the latter is the morally salient feature for truth-seeking, not the former. If you don't make that distinction explicit, it is just relabeling.

  ### 3. The DOJ Leniency Move
  This is the highest-risk, highest-reward part of the draft.

  *   **The Risk:** It invites the "moral equivalence" objection. A reader will think, "You are comparing genocide to price-fixing." If they stop there, you lose.
  *   **The Save:** You must frame this explicitly as a **structural stress test**, not a moral comparison. You are arguing that the *institutional logic* is identical, even if the *normative stakes* are not.
  *   **Recommendation:** Keep it, but add a "firebreak" sentence. Something like: *"This is not to equate the moral gravity of cartel harm with mass atrocities, but to isolate the institutional mechanism from the subject matter."*
  *   **Why keep it?** It elevates the paper from a TJ taxonomy to a theory of law and governance. It shows you aren't just playing inside the TJ sandbox. Cut it only if you can't defend the structural analogy under pressure.

  ### 4. The Biggest Counterexample
  Your thesis relies on the assumption that **Transactional = Truth Extracted** and **Administrative = Truth Suppressed**.

  *   **The Counter:** **The "Sham Transaction."** A process that looks transactional (hearings, disclosure requirements) but produces no reliable truth.
  *   **Specific Case:** **Togo's Truth, Justice and Reconciliation Commission (2009).** It had the trappings of a transactional body (hearings, recommendations), but it was widely criticized as state-controlled theater where perpetrators testified without fear of consequence and victims were sidelined. It fits your "Transactional" definition (individualized hearings) but failed the "Truth" outcome.
  *   **Another Counter:** **Coerced Confession.** In Gacaca (which you cite as support), there is significant literature arguing that sentence reductions coerced false confessions to clear caseloads. If the "purchase" buys lies, does the transaction still hold moral weight? You need to address whether *reliability* is a condition of your "Transactional" category.

  ### 5. The Rwanda Paragraph
  Currently, it is a bridge that wobbles.

  *   **The Problem:** You say "Gacaca granted no amnesty," then use it to explain amnesty. A reader might get whiplash.
  *   **The Fix:** Make it the pivot point for your "Purchased Concession" theory. Don't use it to explain amnesty; use it to explain why "Amnesty" is the wrong category entirely.
  *   **Verdict:** It earns its space **only if** it supports the move to Option (a) in your conclusion (that this is a general institution, not just an amnesty problem). If the paper remains titled or focused strictly on "Amnesty in Transitional Justice," Rwanda is a footnote. If the paper is about "Institutional Bargains in Post-Conflict Justice," Rwanda is central. Align the paragraph with the paper's actual title/scope.

  ### Summary Diagnosis
  Your partner's critique ("renaming something") is the danger zone. You are arguing that the *mechanism of exchange* matters more than the *label of amnesty*.

  *   **Do:** Clarify the Argentina legal distinction.
  *   **Do:** Explicitly distinguish Scope (Individual/Blanket) from Mechanism (Transactional/Administrative).
  *   **Do:** Keep the DOJ analogy but bracket the moral equivalence aggressively.
  *   **Don't:** Assume Transactional automatically equals Truth. Acknowledge the "Sham Transaction" risk.

  The core insight—that TJ focuses on the *grant* of immunity when it should focus on the *price* of immunity—is strong. Don't let the "renaming" critique kill it, but tighten the definitions so it doesn't look like semantic gymnastics.
