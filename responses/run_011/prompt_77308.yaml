  5.  **Identifying Gaps:**
      *   **The "Rate" in Bandwidth:** (c) mentions "rate at which it can move among [states]." (d) operationalizes with *neuron counts*. Neuron count measures capacity (states), but not *rate* (temporal resolution). A fly processes visual info faster than a human. Does the model account for this? (d) ignores the "rate" part of (c).
