      *   *Round 2:* Choose between Beta and Gamma. (Most pick Beta).
      *   *Round 3:* Choose between Gamma and Alpha. (Most pick Gamma).
      *   *Now they hold Gamma.*
      *   *Round 4:* "Okay, I'll let you swap back to Alpha. It costs 1 chip."
      *   *If they still prefer Alpha > Gamma, they pay.*
      *   *Then Beta > Alpha (pay 1).*
      *   *Then Gamma > Beta (pay 1).*
      *   *Now they are back at Gamma, minus 3 chips.*

  6.  **Addressing the "Who Runs the Pump" Question:**

      *   *House:* Best for control. I announce the pairs.
      *   *Confederate:* Too risky.
      *   *Table-vs-Table:* Too competitive, distracts from the logic.
      *   *Decision:* **House as Market Maker.** I stand at the whiteboard. I announce the pairs available for trade. They signal if they want to trade. This keeps the focus on *their* preference, not interpersonal dynamics.

  7.  **Addressing the "Is-Ought" Caveat:**

      *   The game proves: Intransitivity + Free Trading = Loss.
      *   It does *not* prove: You must always be transitive. (Maybe you value variety? Maybe you value learning?)
      *   It does *not* prove: Coherence is the *only* virtue.
      *   I need to write a specific paragraph warning the columnist not to overclaim.

  8.  **Scaling Down (12 people):**

      *   2 tables of 6, or 3 tables of 4.
      *   Same mechanics, just fewer chips needed.
      *   Discussion might be louder. Need to manage voice levels.

  9.  **Troubleshooting:**

      *   *Risk:* Someone spots the cycle immediately.
      *   *Fix:* Acknowledge them, ask them to stay quiet to let others learn, or make them the "Banker" for a table.
      *   *Risk:* No one trades.
      *   *Fix:* Make the differences in pitches starker.
      *   *Risk:* They refuse to pay the fee.
      *   *Fix:* This is actually a *good* outcome (they found the friction). The debrief shifts to "When does friction save you?"

