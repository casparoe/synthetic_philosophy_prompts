      *   *Interpretation:* The cost is always there, but they don't realize the cycle until they've paid a few times.
      *   *Challenge:* If it costs 1 chip to swap A->B, and they prefer A, they won't swap.
      *   *Solution:* The preference must be *strong enough* to overcome the 1 chip cost initially. The pitches need to be attractive enough.
