      *   75 mins? Yes.
      *   No "Rational"? Yes, use "Consistent" or "Secure."
      *   Chips/Index Cards? Yes.
      *   Editor Theme? Yes.
      *   Friction included? Yes.
      *   Caveat included? Yes.

