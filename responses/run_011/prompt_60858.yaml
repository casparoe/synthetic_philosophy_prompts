      *   *Solution:* I need to construct the pitches so they form a Condorcet Cycle *if* people weigh attributes differently depending on the pair.
      *   *Mechanism:*
          *   Pitch A: High Novelty, Low Reporting.
          *   Pitch B: High Reporting, Low Shareability.
          *   Pitch C: High Shareability, Low Novelty.
          *   *The Trap:* When comparing A vs B, people care about Reporting. When comparing B vs C, they care about Shareability. When comparing C vs A, they care about Novelty.
          *   *Refinement:* To make it robust, I need to ensure the "dominant" attribute shifts based on the *difference* between the two options. This is known as "similarity-dependent weighting" or "context-dependent preference."
