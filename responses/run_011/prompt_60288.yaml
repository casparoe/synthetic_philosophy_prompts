answer: |-
  ### First, the framing

  This is not a mistake. It is the only thing worth saying.

  If you give a speech about "gratitude for freedom," you lie. You had freedom. You had a life. The difference is security. If you pretend otherwise, you insult the people in the room who know what it is to live on permission.

  The risk is not honesty. The risk is tone. If you sound angry, the officials will hear a complaint. If you sound too grateful, the new citizens will hear a performance. You need to sound like someone stating a fact. You are not complaining about the past. You are describing the physics of the ground you now stand on.

  The MP might quote you. Let them. If they quote the bit about "living on mercy," it highlights the system. If they quote the bit about "becoming a neighbour," it highlights the community. Write it so the quotable lines are about the future.

  Here is the speech. It is written for the ear. Short lines. Pauses marked by line breaks.

  ***

  **Good morning.**

  Look around this room.
  We come from different places.
  We speak different languages at home.
  Some of us are nineteen. Some are retired.
  But today, we are doing the same thing.

  I arrived here eleven years ago.
  I was twenty-four.
  I had a visa. I had a job. I had a life.
  I could work. I could rent a flat. I could travel.
  On paper, I was free.

  But there was a feeling.
  It lived in the back of my neck.
  Every form was a test.
  Every rule change was a threat.
  I could not plan too far ahead.
  I could not speak too loudly.
  If the phone rang from an unknown number, my heart stopped.

  I lived on permission.
  Permission is a fragile thing.
  It depends on someone else's mood.
  It depends on rules changing overnight.
  You can have everything, and still know it can be taken away.

  Four months ago, I got this certificate.
  People ask me: "What can you do now that you couldn't do before?"
  The answer is: nothing different.
  I work the same job. I live in the same house.
  No new doors have opened.

  So what changed?
  The ground beneath me.

  Before, I was a guest.
  A guest must be polite. A guest follows the house rules.
  And a guest can be asked to leave.
  Today, I stop being a guest.
  I become a neighbour.

  A neighbour does not ask for permission to belong.
  A neighbour has a stake in the street.
  If there is a problem, I do not hope for kindness.
  I have a right to be heard.

  I know this status was given to me.
  Someone decided.
  That is true.
  But a decision can be a door closing.
  Or it can be a floor appearing.
  Today, a floor appeared.

  I am not thanking you for letting me breathe.
  I am acknowledging that we now stand on the same level.

  This does not erase where I came from.
  My mother is in the front row.
  She raised me in a different land.
  That land is still in my voice. It is still in my blood.
  Citizenship is not a replacement. It is an addition.
  I am not less of who I was. I am more of who I am.

  To the officials here:
  Thank you for your work.
  To the new citizens:
  Welcome to the floor.
  It is solid.
  It is ours.

  We do not need to be perfect anymore.
  We just need to be here.
  We do not need to hope for mercy.
  We have a place to stand.

  Thank you.

  ***

  ### Delivery Notes

  **1. The Pace**
  You have three minutes. This text is roughly 400 words. At a normal speaking pace, that is three minutes exactly. Do not rush. When you say "My heart stopped," pause for two seconds. Let them feel it.

  **2. The Officials**
  When you say "To the officials here: Thank you for your work," look at the Mayor and the Registrar. Be polite. It disarms them. Then turn to the new citizens for "Welcome to the floor." That is where your power is.

  **3. The Knot**
  You were worried about celebrating a gift that was discretionary. The speech handles this by acknowledging the decision ("Someone decided. That is true.") but immediately reframing the *effect* of that decision ("Or it can be a floor appearing"). You aren't denying their power; you are declaring that their power has now created equality, not dependency.

  **4. The Mother**
  When you mention your mother, look at her. It grounds the speech in love, not politics. It reminds the room that you are a son first, a citizen second.

  **5. The MP**
  If the MP quotes this, they will likely quote: "We do not need to hope for mercy. We have a place to stand." That is a safe quote for them, but it carries your message. You win either way.
