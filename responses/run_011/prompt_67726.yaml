  ### NOTES FOR DISCUSSION

  **1. The Verbal Dispute Hypothesis**  
  Your supervisor hypothesizes this debate is merely about what *probability* and *assertibility* name.  
  *   **The Node:** Compare **Leaf 5 (Jackson)** and **Leaf 7 (Adams)**.  
  *   **The Issue:** Both prescribe identical betting behavior and assertibility conditions. Jackson posits "hidden" truth conditions (Material); Adams denies truth conditions entirely.  
  *   **The Test:** If there is no empirical or behavioral difference between "believing a material proposition" and "having a suppositional belief," the dispute is verbal. To separate them, ask: *"If all evidence is exhausted, does the conditional have a truth value?"*

  **2. Empty Nodes**  
  *   **Q7/YES:** Ruled out by Lewis's Triviality Proof (1976).  
  *   **Q9/NO:** Unstable; accepts inconsistency without resolution.  
  *   **Leaf 1 & 3:** Unoccupied; theoretically possible but lacks motivation in literature.

  **3. The 1986 Sequel**  
  Note **Leaf 2 (Contextualist)**. Lewis (1986) argues that restricting the class of credence functions saves PC *only if* that class is not closed under conditionalization on conditional-free sentences. **Q3** isolates this closure property. If you answer **NO** to Q3, you accept Lewis's 1986 constraint.
