  **Topic:** The Semantics of Conditionals post-Lewis (1976, 1986)  
  **Worked Example:** $A$ = "The lab ran the assay twice"; $C$ = "The sample was contaminated."  
  **Starting Point:** Premises (i)–(v) are jointly inconsistent. You must reject or modify at least one.

  ---

  ### THE TREE

  **Q1. THE PC COMMITMENT**  
  When you stake money on *"If the lab ran the assay twice, the sample was contaminated,"* is your stake exactly equal to what you would stake on *"The sample was contaminated"* after learning that the lab ran the assay twice?  
  *   **NO** $\rightarrow$ Go to **Q2**.  
  *   **YES** $\rightarrow$ Go to **Q3**.

  **Q2. THE TRUTH COMMITMENT**  
  (You reject the equality in Q1.) Is there nevertheless a fact of the matter about whether the conditional is true or false, independent of our evidence?  
  *   **NO** $\rightarrow$ **LEAF 1: UNNAMED (UNSTABLE).** *Awkward Commitment:* You deny the conditional has truth conditions yet also deny the standard norm for accepting it.  
  *   **YES** $\rightarrow$ Go to **Q4**.

  **Q3. THE STABILITY COMMITMENT**  
  (You accept the equality in Q1.) If you learn new evidence $E$ (e.g., "the lab is generally reliable") that mentions neither $A$ nor $C$, does the equality in Q1 still hold for your updated stakes?  
  *   **NO** $\rightarrow$ **LEAF 2: CONTEXTUALIST / VARIABLE-DOMAIN.** *Awkward Commitment:* Two agents with identical evidence can disagree on the conditional's probability without either being irrational.  
  *   **YES** $\rightarrow$ Go to **Q5**.

  **Q4. THE MATERIAL COMMITMENT**  
  (You accept truth conditions but reject Q1 equality.) If the lab did *not* run the assay twice, is the conditional sentence automatically true?  
  *   **NO** $\rightarrow$ **LEAF 3: UNNAMED (UNEXPLORED).** *Awkward Commitment:* You posit non-material truth conditions but offer no explanation for why confidence tracks conditional probability.  
  *   **YES** $\rightarrow$ Go to **Q6**.

  **Q5. THE PROPOSITION COMMITMENT**  
  (You accept Q1 equality and Stability.) Does the conditional describe a possible state of affairs that obtains or fails regardless of what we know?  
  *   **YES** $\rightarrow$ Go to **Q7**.  
  *   **NO** $\rightarrow$ Go to **Q8**.

  **Q6. THE ASSERTIBILITY COMMITMENT**  
  (You accept Material Truth Conditions.) Does your willingness to assert the conditional arise from its truth conditions or from a separate rule of use?  
  *   **TRUTH CONDITIONS** $\rightarrow$ **LEAF 4: GRICEAN.** *Awkward Commitment:* You must call the conditional "true" whenever the antecedent is false, even if the connection is absurd.  
  *   **RULE OF USE** $\rightarrow$ **LEAF 5: CONVENTIONALIST (JACKSON).** *Awkward Commitment:* There is a robust semantic rule that governs assertion but contributes nothing to truth conditions.

  **Q7. THE CALCULUS COMMITMENT**  
  (You accept Truth Conditions + PC + Stability.) Do standard betting ratios (e.g., betting on $X$ or $Y$) apply to conditionals exactly as they do to factual claims?  
  *   **NO** $\rightarrow$ **LEAF 6: REVISIONIST (BRADLEY ET AL.).** *Awkward Commitment:* You are vulnerable to Dutch Books unless you restrict the standard probability calculus.  
  *   **YES** $\rightarrow$ **EMPTY NODE: RULED OUT BY THEOREM.** *Reason:* Truth Conditions + PC + Stability + Standard Calculus = Triviality (Probabilities collapse to 0 or 1).

  **Q8. THE ATTITUDE COMMITMENT**  
  (You reject Truth Conditions but accept PC + Stability.) Is accepting the conditional a matter of having a belief about the world, or a plan for how to revise beliefs?  
  *   **BELIEF** $\rightarrow$ **LEAF 7: SUPPOSITIONAL (ADAMS).** *Awkward Commitment:* You have rational degrees of belief in sentences that cannot be true or false.  
  *   **PLAN** $\rightarrow$ **LEAF 8: EXPRESSIVIST / HYPERPLAN (GIBBARD).** *Awkward Commitment:* The logic of conditionals becomes a logic of consistency in planning, not truth.

  **Q9. THE DEGENERACY COMMITMENT**  
  (Alternative Path: Accept all premises.) Are you willing to accept that rational agents can only hold credences of 0 or 1 for all sentences?  
  *   **YES** $\rightarrow$ **LEAF 9: LOGICAL FATALIST.** *Awkward Commitment:* You deny Non-degeneracy; learning is impossible for rational agents.  
  *   **NO** $\rightarrow$ **EMPTY NODE: UNATTRACTIVE.** *Reason:* You accept the contradiction without resolving it.

