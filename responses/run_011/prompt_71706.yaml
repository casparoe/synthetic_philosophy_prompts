answer: |-
  You are holding the **Constitutive Thesis**: moral (or normative) valence is a necessary condition for the application of the folk concept *intentional*. You reject the **Pragmatic Thesis** (the concept is neutral, but conversation norms shift attribution) and the **Psychological Thesis** (it's about ascribed desires/beliefs, not norms).

  You want to know what breaks this. You want to know if the theory has evolved into a tautology. You want to know if your variants actually test what you think they test.

  Here is the breakdown of defeaters, the status of the "drift," and the verdict on your experimental variants.

  ### 1. The Hierarchy of Defeaters

  I have sorted these by how much damage they do to the **Constitutive Thesis**.

  #### **Fatal (Theory-Killing)**
  1.  **The Reversal:** A standard CEO case (neutral main goal, side effect) where the *help* condition is rated significantly *more* intentional than the *harm* condition, without changing the wording or context.
      *   *Why:* The Constitutive Thesis relies on a specific valence direction (Bad → Intentional). If Good → Intentional in the same structural context, the concept is not loaded for *badness*, nor is it loaded for *goodness* universally. It suggests the asymmetry is entirely context-dependent (Pragmatic).
  2.  **Cognitive Load Elimination:** The asymmetry disappears when subjects are put under high cognitive load or time pressure.
      *   *Why:* Conceptual competence is supposed to be automatic (System 1). Pragmatic inference is effortful (System 2). If the effect vanishes under load, it is an inference, not a concept.
  3.  **Neural Dissociation:** TMS or lesion studies show that disrupting moral judgment areas (e.g., VMPC) leaves intentionality judgments intact, or vice versa.
      *   *Why:* If the concepts are constitutively linked, they should share neural substrate. If they can be dissociated, they are distinct modules that merely interact.

  #### **Damaging (Theory-Forcing Revision)**
  4.  **Non-Moral Norms (The Aesthetic/Conventional Case):** The asymmetry appears for aesthetic, conventional, or prudential norms (e.g., the ugly building, the self-harming CEO).
      *   *Why:* This kills the **Moral** Constitutive Thesis. It forces you to adopt the broader **Normative Competence** thesis (Knobe's later position). It implies morality isn't special; *normativity* is the loader. This is a significant retreat from "morally loaded" to "normatively loaded."
  5.  **Cross-Cultural Absence:** A population (e.g., specific collectivist cultures or remote societies) shows *no* asymmetry in standard cases.
      *   *Why:* If the concept of intentional action is universally morally loaded, it should appear in all linguistic communities. If it's absent, it's a local cultural heuristic, not a core conceptual competence.

  #### **Annoying (Noise/Artifact)**
  6.  **Phrasing Sensitivity:** Changing "intentionally" to "on purpose" or "knowingly" significantly reduces the effect size.
      *   *Why:* Defenders call this "lexical nuance." Critics call it "probe artifact." It doesn't kill the theory but suggests the effect is fragile.
  7.  **Shrinking Effect Size:** As controls tighten (e.g., ensuring agents have equal attitude toward side effects), the asymmetry shrinks from 80/20 to 60/40.
      *   *Why:* Defenders say "noise." Critics say "the effect was driven by the uncontrolled variables (like ascribed attitude)."

  ---

  ### 2. Concede vs. Explain Away: The Defender's Playbook

  If you present these results, here is how a committed Knobe-style defender (Normative Competence theorist) will react.

  *   **The Reversal:** **Concede.** This is fatal. No amount of epicycles can save a constitutive claim if the valence flips in a standard case.
  *   **Cognitive Load:** **Explain Away.** They will argue that moral/normative processing *is* effortful in edge cases, or that the load task interfered with comprehension, not the concept itself.
  *   **Non-Moral Norms (Aesthetic/Prudential):** **Concede (with a rebrand).** This is exactly what happened historically. Knobe moved from "Moral" to "Normative." If you find this, you must abandon the claim that *morality* is the loader. You must accept that *any* norm violation triggers the intentionality attribution.
  *   **Cross-Cultural Absence:** **Explain Away.** They will argue for "Universal Competence, Variable Performance." They will claim the concept is there but masked by local conversational norms. (This is the "epicycle" danger zone).
  *   **Phrasing Sensitivity:** **Explain Away.** "Intentionally" carries a stronger normative weight than "on purpose" in English. This is consistent with the concept being sensitive to specific lexical triggers.

  ---

  ### 3. Divergent Predictions: Where the Accounts Split

  The Pragmatic/Deflationary view and the Constitutive/Normative view often predict the same outcome (the asymmetry). To push your view, you need conditions where they diverge.

  1.  **Implicit Measures (IAT/Response Time):**
      *   *Constitutive:* Association between "Bad" and "Intentional" should be faster than "Good" and "Intentional." It is a direct link.
      *   *Pragmatic:* Requires an inference step ("He did bad → He must have meant it"). This should take longer or show different activation patterns.
      *   *Prediction:* If RTs are identical, it favors Constitutive. If Bad/Intentional is slower (requiring inference), it favors Pragmatic.

  2.  **Forced Choice (Intentional vs. Blameworthy):**
      *   *Setup:* "The CEO harmed the environment. He is blameworthy. But was it intentional?" vs "The CEO harmed the environment. It was intentional. But is he blameworthy?"
      *   *Constitutive:* You cannot separate them easily. If it's intentional, it implies a norm violation. If it's a norm violation, it pulls toward intentional.
      *   *Pragmatic:* Subjects should be willing to say "Unintentional but Blameworthy" (negligence) or "Intentional but Praiseworthy" easily if the probe allows it.
      *   *Test:* Give them a 2x2 matrix. If they cluster heavily in "Intentional/Bad" and refuse "Intentional/Good," that supports Constitutive.

  3.  **The "Good Norm" Condition:**
      *   *Setup:* An agent violates a *good* norm to produce a *good* side effect (e.g., breaks a rule to save the environment).
      *   *Constitutive:* If the action is "good" overall, intentionality should drop (the standard Help case).
      *   *Pragmatic:* If the agent is *praiseworthy*, intentionality might rise (we want to praise the intent).
      *   *Prediction:* This is the crux. The Constitutive view says Badness drives Intentionality. If Praiseworthiness drives it too, the "Moral Loading" is actually "Normative Salience."

  ---

  ### 4. The Drift: Has the View Become Unfalsifiable?

  You asked for an honest read on the drift from "Blame drives judgment" to "Core competence sensitive to norms."

  **The Verdict:** Yes, the drift has created a significant falsifiability problem, bordering on degenerative research program status *if* not carefully bounded.

  *   **The Problem:** Initially, the claim was specific: *Moral* valence affects *Intentionality*. When counter-evidence arose (e.g., conventional norms), the theory expanded to *Normative* valence.
  *   **The Risk:** If "Norm" is defined as "anything that triggers the asymmetry," the theory is tautological. "Why is this intentional?" "Because it violates a norm." "How do you know it violates a norm?" "Because people call it intentional."
  *   **The Save:** The theory remains empirical **only if** "Norm" is defined independently of the intentionality judgment. You must be able to measure norm-violation (e.g., via separate rating scales) *before* predicting intentionality.
  *   **The Danger:** If the defender claims that *any* time the asymmetry appears, a norm *must* have been present (even if subjects deny it), the theory is immune to refutation.
  *   **Your Position:** By holding the "Moral Loading" view, you are actually taking a *riskier* (and thus more scientifically robust) stance than Knobe's current "Normative Competence" view. You are vulnerable to the Aesthetic Variant. Knobe is not.

  ---

  ### 5. Analysis of Your Variants

  You are running two variants. Here is what they test and what you must rule out.

  #### **Variant 1: Harm to the CEO (Self-Harm)**
  *   **Setup:** CEO implements program. Harms *himself*. He is distraught.
  *   **The Prediction:**
      *   *Blame Account:* Asymmetry should vanish or reverse. You cannot blame a victim for harming themselves if they are distraught (no ill will).
      *   *Normative Account:* Asymmetry should persist. He violated a norm of *prudence* or *rationality*.
      *   *Deep Self Account:* Asymmetry should vanish. The side effect conflicts with his "Deep Self" (he is distraught).
  *   **Interpretation:** If the asymmetry **persists**, it kills the "Blame" account and the "Deep Self" account. It supports the **Normative Competence** account.
  *   **Does it support *Moral* Loading?** No. Self-harm is not typically *moral*. If you find the effect here, you must concede that the concept is loaded for *normativity*, not specifically *morality*.
  *   **Confounds to Rule Out:**
      *   *Irrationality:* Ensure subjects don't view the CEO as "crazy." If he's crazy, intentionality might drop for reasons unrelated to norms.
      *   *Masochism:* Ensure the harm isn't read as a hidden desire (e.g., "He wanted to suffer").

  #### **Variant 2: Aesthetic Norms (Ugly Building)**
  *   **Setup:** CEO implements program. Makes building *uglier*. He knows it.
  *   **The Prediction:**
      *   *Moral Loading:* Asymmetry should vanish. Ugliness is not immoral.
      *   *Normative Competence:* Asymmetry should persist. Ugliness violates an aesthetic norm.
  *   **Interpretation:** If the asymmetry **persists**, your specific claim ("Morally Loaded") is **falsified**. You must upgrade to "Normatively Loaded."
  *   **Does it support the Strong Reading?** Yes, it supports the idea that the *concept* is loaded, but it broadens the loader from Morality to Normativity.
  *   **Confounds to Rule Out (Crucial):**
      *   *Moralization of Aesthetics:* Subjects might read "ugly building" as "wasting money," "environmental blight," or "disrespecting the community." You must verify via post-test that subjects rated the action as *morally neutral* but *aesthetically negative*.
      *   *Preference vs. Norm:* "I don't like it" is preference. "It shouldn't be that way" is a norm. Ensure the vignette establishes a standard of beauty that is violated, not just a subjective dislike.

  ### Summary Recommendation

  If you find the asymmetry in **both** variants:
  1.  You have killed the **Pragmatic/Implicature** view (because self-harm and aesthetics don't carry the same conversational implicatures as environmental harm).
  2.  You have killed the **Deep Self** view (because the CEO is distraught/self-harming).
  3.  **You have falsified your own "Moral Loading" claim.** You will have proven the concept is **Normatively Loaded**, not Morally Loaded.

  This is not a loss; it is a refinement. It moves you from the 2003 Knobe view to the 2008+ Knobe view. The "Strong Reading" survives, but the "Moral" qualifier must be dropped.

  **The Fatal Test:** If you run the Aesthetic Variant and the asymmetry **disappears**, but shows up in the Moral Variant, you save the "Moral Loading" thesis. If it shows up in both, you have a Normative thesis. If it shows up in neither (and your controls are tight), the Strong Reading is dead, and the Pragmatic view wins.
