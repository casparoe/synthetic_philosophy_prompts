answer: |-
  (1) Where your premise goes wrong

  You have identified the mathematical symptom correctly but misdiagnosed the epistemic cause, and consequently, you are wielding Jeffrey conditionalisation as a tool for a job it was not designed to do.

  First, a minor mathematical correction: if $P(E) = 1$, Bayes's rule does not "blow up". Division by one is perfectly well-behaved. The trouble is that if $P(E) = 1$, then $P(H \cap E) = P(H)$, which implies $P(H|E) = P(H)$. The posterior equals the prior. The update does nothing, which is the confirmation failure you noted.

  However, your proposed fix—refusing to let $P(E)$ hit 1 and using Jeffrey conditionalisation (JC)—fails for two substantive reasons.

  The first is epistemic dishonesty. In the Mercury case, the evidence $E$ (the perihelion advance) was known with certainty by the astronomical community long before 1915. To assign $P(E) = 0.99$ is to claim you are uncertain whether Mercury's perihelion advances. If you know $E$ is true, rationality demands $P(E) = 1$. Artificially depressing this probability to allow for mathematical manoeuvring treats the probability function as a calculation device rather than a representation of your actual belief state.

  The second, more technical error concerns the application of Jeffrey's rule. JC is designed for situations where a direct experience shifts your confidence across a partition $\{E_i\}$ without making any element certain. For example, looking at a cloth in dim light might shift your probabilities on the partition {Green, Blue, Grey} without making any of them 1. Crucially, JC requires a *new* experience to trigger the shift in probabilities on the partition. In the old evidence problem, there is no new experience regarding $E$. $E$ is old. Nothing happens to change your mind about Mercury's orbit in 1915. Therefore, there is no input for the Jeffrey update. If you arbitrarily shift $P(E)$ from 0.95 to 0.96 just because Einstein published a paper, you are not modelling confirmation; you are modelling a hallucination about the orbit of Mercury.

  (2) What the real problem is

  The problem of old evidence, as properly formulated by Clark Glymour (1980), is not about empirical uncertainty regarding $E$; it is about *logical* learning.

  When Einstein confirmed General Relativity (GR) using Mercury's orbit, he did not learn $E$ (the data). He learned that $GR \vdash E$ (the theory entails the data). In standard Bayesianism, agents are assumed to be logically omniscient: if $H$ entails $E$, then $P(H \cap E) = P(H)$ is already built into the probability function at the start. If the agent is logically omniscient, they already know $P(E|GR) = 1$ before Einstein does the work. Thus, discovering the entailment relation cannot change the probability of $GR$.

  The real tension is between the Bayesian idealisation of logical omniscience and the human reality of logical discovery. Confirmation occurs because we learn a new logical connection between a hypothesis and known data. Standard Bayesianism has no room for learning logical truths, because logical truths are supposed to have probability 1 at all times. Your proposal attempts to solve a problem of logical learning by introducing empirical uncertainty, which is why it feels like it is grasping the wrong end of the stick.

  (3) What each candidate fix buys and what it costs

  There are three main approaches to this in the literature. Here is what they achieve and what you must sacrifice to use them.

  **A. The Garber-Style Solution (Entailment Sentences)**
  *   **The Mechanism:** Daniel Garber (1983) suggests expanding the algebra of propositions to include sentences about logical relations, such as $X = \text{'GR entails E'}$. You then conditionalise on $X$, not on $E$. Since $X$ is a new empirical fact about the theory (you didn't know the maths worked until you did the calculation), $P(X)$ can rise from near 0 to 1.
  *   **What it buys:** It preserves standard conditionalisation and explains why $P(GR)$ rises without lying about $P(E)$. It models the actual historical learning process.
  *   **The Cost:** You must abandon logical omniscience. You have to admit that your probability function does not automatically respect all logical relations. This complicates the formalism significantly, as you must distinguish between logical truths and empirical truths within the algebra.

  **B. The Counterfactual/Historical Approach (Howson & Urbach)**
  *   **The Mechanism:** Colin Howson suggests we ask what the probability of $GR$ *would have been* had we not known $E$. We reconstruct a prior $P^*$ where $P^*(E) < 1$, calculate the confirmation, and apply that boost to the actual prior.
  *   **What it buys:** It keeps the standard Bayesian machinery intact and respects the fact that $E$ is actually known ($P(E)=1$).
  *   **The Cost:** It relies on a fictional epistemic history. There are often many ways to "unlearn" $E$, leading to different confirmation values. It makes confirmation partly dependent on how we choose to imagine the past, which some find subjective.

  **C. Your Proposal (Jeffrey Conditionalisation on E)**
  *   **The Mechanism:** Keep $P(E) < 1$ (e.g., 0.99) and update via JC when the theory is proposed.
  *   **What it buys:** It avoids the division-by-1 stagnation mathematically.
  *   **The Cost:** It is epistemically unjustified. As noted, there is no "experience" that shifts $P(E)$ when Einstein publishes. Furthermore, to get the numbers to work, you would need the shift in $P(E)$ to be correlated with $GR$ specifically, which requires you to already know the connection you are trying to discover. It essentially smuggles the conclusion into the input probabilities.

  **D. Jeffrey's Own View**
  *   **Note:** It is worth clarifying that Richard Jeffrey himself was sceptical that old evidence was a problem requiring a solution. He argued that if $E$ is certain, it *shouldn't* confirm $H$ in the synchronic sense; confirmation is about the management of uncertainty. However, he acknowledged the historical intuition. His rule (JC) is distinct from his philosophical stance on this specific problem. Using JC to solve old evidence is a conflation of his rule with Garber-style insights.

  Verdict: No, keeping P(E) strictly below 1 does not rescue Bayesian confirmation from old evidence because it misidentifies the source of confirmation as empirical uncertainty rather than the discovery of a logical entailment.
