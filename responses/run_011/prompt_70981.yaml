answer: |-
  You confuse natural affinity with political machinery. It is true that any gathering of men creates a pressure, a warm breath that fogs the glass of thought. I felt it in the Communist Party before I was expelled, and I felt it in the factory when the foreman looked away. But a political party is distinct because its *object* is not truth, nor even skill, but power. When your debate team chants, it is to sharpen the mind for combat with ideas. When a party whips its members, it is to crush the mind for the sake of the organization's survival. The "sellout" you speak of—I do not know this "Discord," but I understand the mechanism—is the precise poison: it replaces the criterion of "is this true?" with "is this loyal?"

  As for persuading strangers: this is not a correction, it is a degradation. To win votes from strangers, one does not illuminate their understanding; one appeals to their passions, their prejudices, their fears. You say the party must listen to survive. I say it must deform itself to survive. It becomes a mirror that reflects only what the crowd wishes to see. If your student council becomes a place where proposals are weighed not by their justice but by their electability, you have not created governance. You have created a market. Tell me: in these elections, is a candidate punished for lying if the lie wins votes?

