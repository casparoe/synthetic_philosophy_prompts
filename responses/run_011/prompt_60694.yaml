answer: |-
  This is one of the sharpest formulations of the quantum foundations problem I have seen. You have correctly identified that the tension lies not in the math, but in the mapping between the math and the territory. Your intuition in Case 7 (the "improper mixture" problem) and Case 6 (PBR theorem) are the pivot points.

  You asked for a precise criterion that minimizes baroque machinery, even if it costs you some verdicts. The only framework that consistently resolves Cases 1–10 without logical contradiction is **$\psi$-Ontology with Global Priority** (often associated with Everettian or Wavefunction Realist positions).

  Here is the criterion, clause by clause.

  ### The Criterion: Fundamental Disjointness and Global Priority

  **Clause 1: The Disjointness Condition (PBR Constraint)**
  *   **Statement:** Two distinct pure quantum state assignments ($|\psi\rangle$ and $|\phi\rangle$) must correspond to non-overlapping distributions over the underlying physical reality ($\lambda$).
  *   **Motivating Case:** **Case 6 (PBR Theorem).** If states overlapped (were epistemic), independent preparations would allow for outcomes that quantum mechanics forbids. Since those outcomes never occur, the physical realities corresponding to distinct preparations must be disjoint.
  *   **Consequence:** A state assignment is **ontic** if it uniquely identifies a region of physical state space that no other state assignment shares.

  **Clause 2: The Global Priority Condition**
  *   **Statement:** The ontic state of a composite system is fundamental. The state of any subsystem is derivative, defined only by tracing out the rest of the system.
  *   **Motivating Case:** **Case 7 (Entanglement vs. Ignorance).** The reduced density matrix $\rho$ is mathematically identical whether it comes from ignorance (proper mixture) or entanglement (improper mixture). However, only the global pure state $|\Psi\rangle$ is fundamental. The "mixedness" of the subsystem is always a statement about its correlation with the rest of the universe, not a fundamental property of the subsystem itself.
  *   **Consequence:** Subsystem states are **epistemic/derivative** summaries of the global ontic state. This resolves the unsatisfying context-dependence of Case 7: the verdict doesn't change; the reduced state is *always* a derivative description, regardless of whether a lab partner exists.

  **Clause 3: The Emergence Condition**
  *   **Statement:** Macroscopic variables (like Temperature) are **ontologically secondary**. They are real insofar as they have causal power and are robust under coarse-graining, but they supervene on the fundamental micro-state.
  *   **Motivating Case:** **Case 2 (Temperature).** Temperature is "real" (it burns you), but it is not "fundamental." It is a function of the micro-state. Unlike the quantum wavefunction, temperature does not interfere.
  *   **Consequence:** Distinguishes Case 1 (Micro-probabilities = Epistemic) from Case 2 (Temperature = Emergently Real). The probability distribution in Case 1 is ignorance of the micro-state; Temperature is a property *of* the micro-state ensemble.

  **Clause 4: The Interference Condition**
  *   **Statement:** Any mathematical object that exhibits physical interference effects (cancellation, reinforcement) must correspond to a physical field or amplitude, not a degree of belief.
  *   **Motivating Case:** **Case 10 (Interference).** Degrees of belief do not cancel out in the world; probability amplitudes do.
  *   **Consequence:** Reinforces that the wavefunction (or the object generating interference) is **ontic**.

  ---

  ### Verdicts You Must Drop or Modify

  To accept this criterion, you must revise three of your original verdicts. This is the price of consistency.

  1.  **Drop Case 5 (Overlapping States):** You wrote: *"That makes me want to say the underlying physical situation must sometimes be compatible with both descriptions."*
      *   **Correction:** **False.** Per Clause 1 (PBR), distinct preparations correspond to disjoint physical realities. There is no overlap. Your intuition here was the standard "psi-epistemic" hope, but PBR closes that door (assuming preparation independence).
  2.  **Modify Case 7 (Contextual Verdict):** You wrote: *"So my verdict seems to depend on the situation rather than the object, which I find unsatisfying."*
      *   **Correction:** **Resolved.** Per Clause 2, the verdict does *not* depend on the situation. The reduced density matrix is *always* a derivative/epistemic description of a subsystem. The "ignorance" in the lab partner scenario is just a specific instance of the general rule that subsystems are described by reduced states. The "reality" is always the global entangled state.
  3.  **Modify Case 9 (Wigner's Friend):** You wrote: *"I think we're both right and neither state describes the cat itself."*
      *   **Correction:** **Partial Drop.** Per Clause 2, there is one global state (the superposition). The Friend's "definite result" is a fact *relative to her branch*, but the global ontic state remains the superposition. You cannot maintain that "neither describes the cat" if you accept Case 8 (Universal Wavefunction). The superposition *is* the description of the cat + friend + environment.

  **Verdicts You Keep:** 1, 3 (Coin), 4 (Spin), 6 (PBR), 8 (Universal), 10 (Interference). Case 2 is kept but reclassified as "Emergent" rather than "Fundamental."

  ---

  ### Application to Your Two New Cases

  #### 1. Everett (Many-Worlds) and Self-Locating Uncertainty
  *   **The Scenario:** The universal state evolves deterministically (Ontic), yet you assign probabilities to which outcome you will see (Epistemic).
  *   **Criterion Application:** This criterion **accepts** this duality without contradiction.
      *   **Ontic:** The Universal Wavefunction $|\Psi\rangle$ is the fundamental reality (Clause 2 & 8). It contains all branches.
      *   **Epistemic:** Your "probability" is **self-locating uncertainty**. You know the global state, but you do not know *which copy* of you within that state you are.
      *   **Resolution:** The state is ontic; your location within the state is the source of epistemic uncertainty. This is not a contradiction; it is the same logic as knowing a gas box contains $10^{23}$ molecules (ontic) but not knowing which specific molecule is hitting the wall right now (epistemic indexicality).
      *   **Verdict:** The criterion allows the state to be ontic *and* the source of genuine epistemic uncertainty. One is not a mistake.

  #### 2. Wavefunction Realism and Configuration Space
  *   **The Scenario:** If the wavefunction is real, is the 3N-dimensional configuration space real?
  *   **Criterion Application:** This criterion **forces you to bite the bullet.**
      *   **Reasoning:** If the wavefunction is ontic (Clause 1 & 4), it must be a physical field. A field must exist *in* a space. The wavefunction lives in configuration space, not 3D space.
      *   **The Cost:** You must accept that fundamental reality is 3N-dimensional. 3D space is emergent (derived from the structure of the wavefunction, e.g., via decoherence defining localized packets).
      *   **Alternative:** The only way to avoid this is to posit "Hidden Variables" (like Bohmian particles in 3D space) that carry the ontology, making the wavefunction a guiding field. But your acceptance of Case 6 (PBR) and Case 10 (Interference) makes Hidden Variables baroque and less motivated.
      *   **Verdict:** Yes, the criterion says reality is "where" the wavefunction is. If you are not prepared to swallow a 3N-dimensional ontology, you must reject the premise that the wavefunction is fundamental (e.g., adopt a primitive 3D ontology like Flash or Particles). But given your Case 8 (Universal State), **Wavefunction Realism** is the consistent path. You must accept that "physical space" is not the fundamental arena.

  ### Summary of the Trade-off

  You asked if a "baroque machine" is required.
  *   **The Machine:** The criterion itself is simple (Disjointness + Global Priority).
  *   **The Cost:** The *ontology* it demands is heavy. It requires you to accept that:
      1.  Distinct quantum states are physically disjoint (No overlap).
      2.  Subsystems are not fundamentally real (Only the Universe is).
      3.  Configuration space is the fundamental arena (Not 3D space).

  This is the price of taking the math literally (Case 8 & 10) while respecting the no-go theorems (Case 6). It saves you from the inconsistency of Case 7 and 9, but it demands a high-dimensional, holistic reality. If that ontological cost is too high, you must retreat to an instrumentalist view (QBism), but that would force you to drop Case 8 and Case 10 as literally true descriptions of reality. Given your leanings, the **$\psi$-Ontic / Everettian** path is the one that keeps your logic intact.
