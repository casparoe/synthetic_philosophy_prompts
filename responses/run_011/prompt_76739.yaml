prompt: |-
  so my reading group is doing a session on confirmation and we've all dutifully memorized the green-apple move, but the thing that actually kept me up afterwards was the background-knowledge wrinkle: whether a shoe raises or *lowers* your confidence in the raven hypothesis depends on what you already knew going in, which means an agency whose entire business is shoe inspection would have to invest heavily in making sure its inspectors already know about ravens before letting them near footwear. That struck me as genuinely funny and I want to see if it survives being written up. A friend of mine who's a serious birder read the draft idea and said "you people are insufferable," which felt like a green light.

  Write me a parody internal memo — call it 850 to 1,000 words — from the director of a made-up government agency, something flatly named like the Bureau of Generalization Support, announcing a restructuring. The Bureau's statutory job is confirming the hypothesis that all ravens are black. The memo winds down the Ornithology Division (headcount: three, one shared pair of binoculars, and a leased vehicle) and massively expands the Non-Raven Compliance Division, on the grounds that under the equivalance condition that's where essentially all of the Bureau's confirmatory output comes from. I want the comedy bureaucratic and deadpan, not wacky: staffing ratios, a compliance calendar, a mandatory onboarding video in which new hires are briefly shown an actual raven and tested on it before being cleared to inspect shoes (that's the background-knowledge point doing policy work — never explain it as such), a memo from Legal about the total-evidence requirement and why inspectors may not cherry-pick which footwear gets logged, a short passage where the communications office notes that public outrage over the shoe program is "purely psychological" and would vanish if people stated their priors out loud, and a grievance filed by the last remaining ornithologist. Include one quoted complaint from that ornithologist and one quoted reply from the director, both invented, and give the Bureau a rival contractor with a telescope whose whole job is looking for non-black ravens and who is viewed as a boondoggle but can't be fired. Everyone in the memo is completely sincere and thinks they're doing excellent science.

  Don't name any philosopher or any logical principle by its proper label — no "as Hempel noted," no "Nicod's criterion" — let the ideas show up entirely as procedure, budget lines, and HR policy, so that a specialist recognizes them and everyone else just sees a memo. Format it with numbered sections, a signature block, and a short appendix of key performance indicators where the ratio between a single raven sighting and a single shoe inspection is legible from the numbers alone without anybody explaining what it means. Please start your reply with the memo itself and no preface, no title of your own, and no commentary or joke-explanation afterwards.
