answer: |-
  ### Sketch of Candidate Failure Points

  Before committing, here are the three places this argument is most vulnerable:

  1.  **Premise (3) is overbroad.** It asserts a *universal* condition for legitimacy ("What makes a body's decisions binding..."). It ignores that different bodies require different kinds of legitimacy (e.g., epistemic/competence vs. political/representative).
  2.  **Step (5) commits a category error.** It assumes the logic for legislative legitimacy applies identically to technical or judicial bodies. It treats "governance" as a monolith rather than distinct functions requiring distinct selection methods.
  3.  **Step (7) is a non-sequitur.** Even if (3) is false as a universal rule, it does not follow that sortition has *no* principled justification. It only follows that *this specific justification* is incomplete.

  ### Diagnosis

  The argument is **valid** (the conclusions follow from the premises) but **unsound** because **Premise (3) is false**, and **Step (5) relies on an equivocation**.

  **The Break:** The error is in **Premise (3)**. You have defined legitimacy as a single-variable function: `Legitimacy = Representation + Insulation`. In political theory, legitimacy is multi-variable. For a legislature, representation is the dominant variable. For a central bank or court, competence (epistemic legitimacy) is the dominant variable. By defining legitimacy solely through the lens of descriptive representation, you force the argument to break when applied to technical bodies.

  **The Cost of Rejecting (3):** If you drop (3), you lose the claim that sortition is *inherently* superior to elections in all contexts. You must adopt a **functional theory of legitimacy**: some bodies derive legitimacy from mirroring the people (legislatures), others from expertise (courts, central banks). This saves sortition for legislatures without forcing you to put judges or surgeons on a lottery.

  **Your Instinct (Keep (2), Drop (3)):**
  Your instinct is **correct**.
  *   **Keeping (2):** This is an empirical claim about selection mechanics. While not perfectly true (see below on agenda-setting), it is robust enough to serve as a premise.
  *   **Dropping (3):** This is a normative claim you invented, and it is too strong. By rejecting it, you lose the "silver bullet" argument that sortition solves *all* legitimacy problems. You gain a nuanced position: sortition solves the *representation* problem, but not the *competence* problem. This is actually the standard position of modern sortition theorists.

  ### Addressing Your Three Unsettled Points

  **1. Is (5) a fair application of (3)?**
  It is a fair application of (3) *only if* you accept (3) as universal. Since (3) is false, (5) reveals the falsity of (3) via *reductio ad absurdum*. The examples in (5) are doing work: they highlight that different institutions have different *functions*. A legislature decides *values* (how much tax, what rights); a central bank decides *technics* (interest rates to stabilize currency). Applying the same selection logic to both is like using a hammer to perform surgery because both are "tools."

  **2. Does (2)'s claim about money survive agenda-setting?**
  Not entirely. You identified a real vulnerability. While you cannot buy a seat in a lottery, you can buy the **staff** who brief the lottery members, write the bills, and set the agenda. This is the "oligarchy of the bureaucracy" problem. A sortition defender must concede that lottery alone is insufficient; it requires **randomly selected staff**, open-source briefing materials, or adversarial briefing processes to prevent capture. (2) is true regarding *seat acquisition*, but false regarding *influence over decision*.

  **3. Does the Athenian precedent help or hurt?**
  It **helps** the sortition defender and hurts your Step (5). Athens explicitly distinguished between political judgment (lot) and technical/military judgment (election). They knew generals needed skill, so they elected them. They knew council members needed to represent the demos, so they lotteried them. This historical data point proves that one can support sortition for legislatures *without* supporting it for technical bodies, directly undermining the inference from (5) to (6).

  ### How a Sortition Defender Should Reply

  If I were defending sortition against this argument, here is my direct reply:

  1.  **Concede (3) is false as a universal.** I agree that a lottery-selected court of appeals is illegitimate. Legitimacy for courts comes from legal reasoning and consistency, not demographic mirroring.
  2.  **Reject (5)'s implication.** The fact that sortition fails for central banks does not mean it fails for legislatures. The legislature is the *only* body whose primary job is to aggregate values, not optimize technical outcomes. Therefore, (3) should be rewritten as: "What makes a *legislative* body's decisions binding is..."
  3.  **Reject (7).** Even if (3) is false universally, sortition retains justification for legislatures specifically. The justification is not "legitimacy via representation" alone, but "breaking the cartel of career politicians." The argument does not collapse; it just narrows its scope.
  4.  **Address the Agenda Problem.** I concede that if the lottered body relies on permanent staff for information, power shifts to the staff. The solution is not to abandon sortition, but to design **contestatory institutions** (e.g., competing advocacy teams presenting briefs to the lottered body) to ensure the information environment isn't captured.

  **Final Verdict:** The argument is **bad** in its current form because it attempts to derive a universal theory of legitimacy from a specific mechanism. It proves too much because it ignores functional differentiation. However, the core intuition (that elections bias representation) remains sound if restricted to the legislative branch. Do not abandon sortition; abandon the claim that it is the *only* source of legitimacy.
