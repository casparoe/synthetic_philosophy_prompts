prompt: |-
  So — long story short, I've been talked into chairing my university's research portfolio review board, the body that every five years decides whether an interdisciplinary centre keeps its renewal money. Roughly three to four million a round, so people get quite worked up. What I've noticed is that the word "degenerating" has become a club: whenever someone wants a centre gone they say it's a degenerating programme, and whenever someone wants one saved they say Lakatos would obviously call it progressive. Half the board hasn't read a page of Lakatos and just hears a philosopher's name being swung around, and I don't much like it, because I think the methodology of scientific research programmes really is the right framework for what we're doing — it's the only account of scientific rationality I know that takes seriously that the unit of appraisal is a sequence of theories stretched out over time rather than a single paper, and that has any vocabulary at all for the difference between an auxiliary hypothesis that buys you something and one that's just a patch over a hole.

  So what I want from you is an actual decision procedure I could hand to the committee: an ordered set of questions, with what counts as a sufficient answer to each one, that a smart non-philosopher with two hours and a dossier in front of them could run, and that keeps the hard parts of Lakatos instead of flattening them into "did they publish a lot." The things I most care about surviving the translation: the hard core / protective belt distinction and the negative versus positive heuristic — board members need to be able to say what a given centre's hard core is, and I want a test for whether they've actually located it rather than just picked whichever claim they'd enjoy defending; the difference between theoretical progress and empirical progress, since those come apart constantly and my physicists treat them as one thing; and above all the criterion for a novel fact, because that's where everybody cheats — they'll count something the programme was built to accommodate as though it had been anticipated, or count a restatement of the hard core in shinier notation as excess content. Give me whatever conditions Lakatos actually sets out for when a problemshift is genuinely heuristically powerful rather than merely defensive, in language a chemist or an economist will accept as a fair test and not as philosophy word games. And be explicit about which steps hand the decision over to a human being because they're judgment calls rather than matters of fact — I'd rather see those marked than buried inside a confident-sounding checklist. Then tell me what my procedure has to smuggle in that Lakatos himself wouldn't license: he's pretty clear that you can only appraise a programme retrospectively, that there's no such thing as instant rationality, and that hanging on to a degenerating programme for decades can be perfectly reasonable — and yet my board is being asked exactly the question he refuses to answer, which is when to quit. I want that gap owned up to, not papered over, plus a note on where the procedure will predictably misfire: on young centres that haven't had time to produce a problemshift yet, on fields where two camps genuinely disagree about what the hard core even is, and on programmes that spin off enormous technological and commercial value while anticipating nothing new.

  Finally, run it on three dossiers and show your work at each step rather than just giving me the verdict. (1) A centre doing "quantum models of decision-making" — steady output, very heavily cited, trains lots of students, spun out a successful imaging company; but every failed prediction gets fixed by adding another free parameter, and I can't point to anything it anticipated that wasn't already in the founding papers a decade ago. I personally dislike this one and expect the procedure to say degenerating, so I want to see whether it can be made to say that on grounds that aren't just my prejudice. (2) A centre building a formal framework for biological self-organisation — no experimental confirmation of anything yet, but one genuinely surprising prediction made in year three that took until year nine to test and came out right, and mostly formal elaboration since. I like these people a great deal, and I want the procedure to tell me straight if I'm going soft. (3) A centre whose flagship theory was publicly demolished about six years ago and which has rebuilt around a different core since; half the board says falsified, cut it, and the other half says you can't hold the old theory against them because it's a new programme now. Does my procedure have the resources to settle that arguement, and if not, what does it owe the board instead? At least one of the three should come out as "no verdict yet" if that's the honest answer — and if it does, tell me what the board should do institutionally in that situation (a shorter renewal, an earmarked test, a named prediction with a deadline?) rather than pretending the framework hands me a yes or a no.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **User Role:** Chair of a university research portfolio review board (interdisciplinary centres, 5-year renewal, \$3-4M at stake).
      *   **Problem:** Board members misuse Lakatosian terms ("degenerating" vs. "progressive") without understanding them. The user believes Lakatos's *Methodology of Scientific Research Programmes (MSRP)* is actually the right framework but needs it operationalized for non-philosophers.
      *   **Key Requirements:**
          1.  **Decision Procedure:** An ordered set of questions with sufficient answers.
          2.  **Target Audience:** Smart non-philosophers (chemists, economists, etc.) with 2 hours and a dossier.
          3.  **Core Concepts to Preserve:** Hard Core/Protective Belt, Negative/Positive Heuristic, Theoretical vs. Empirical Progress, Novel Facts (anticipation vs. accommodation).
          4.  **Explicit Judgment Calls:** Mark where human judgment is needed vs. factual checks.
          5.  **The "Lakatos Gap":** Acknowledge that Lakatos says appraisal is retrospective/historical, but the board must make a prospective funding decision (when to quit). Own this discrepancy.
          6.  **Predictable Misfires:** Young centres, contested hard cores, high commercial value/low theoretical novelty.
          7.  **Case Studies:** Run the procedure on three specific dossiers:
              *   (1) Quantum Decision-Making (High output/citations/spin-off, but ad-hoc adjustments, no novel predictions).
              *   (2) Biological Self-Organisation (Formal framework, one surprising prediction confirmed late, mostly formal work since).
              *   (3) Rebuilt Centre (Flagship theory demolished, rebuilt around new core).
          8.  **Institutional Recommendations:** If "no verdict," what should the board do? (Shorter renewal, earmarked test, etc.)

  2.  **Deconstruct Lakatos's MSRP for Operationalization:**

      *   *Hard Core:* The irrefutable assumptions (by methodological decision).
      *   *Protective Belt:* Auxiliary hypotheses, initial conditions, etc., that take the hit.
      *   *Negative Heuristic:* Don't touch the hard core.
      *   *Positive Heuristic:* A plan for how to develop the belt (model building, math, etc.).
      *   *Progress:*
          *   *Theoretical:* Does the new version have excess empirical content (predicts something new)?
          *   *Empirical:* Is some of that excess content corroborated?
      *   *Degeneration:* Ad-hoc adjustments (saving the theory without new content), post-hoc accommodation, no novel facts.
      *   *Novel Fact:* Something not used in constructing the hypothesis.

  3.  **Drafting the Decision Procedure (The "Lakatosian Audit"):**

      *   Need to make it step-by-step.
      *   *Step 1: Identification.* Define the Hard Core. (Crucial: Is it actually irrefutable by decision, or just a preference?)
      *   *Step 2: Heuristics.* Is there a plan (Positive) and a boundary (Negative)?
      *   *Step 3: Theoretical Progress.* Comparison of T_n vs T_n+1. Did they add content or just patch?
      *   *Step 4: Empirical Progress.* Did the new content survive contact with reality?
      *   *Step 5: Novelty Check.* Was the fact anticipated or accommodated?
      *   *Step 6: The Verdict.* Progressive, Degenerating, or Indeterminate.

      *Refining for the User:* Make sure to highlight *where* the judgment calls are. Lakatos warns against instant rationality. The procedure needs a "Time Horizon" clause.

  4.  **Addressing the "Lakatos Gap" (Retrospective vs. Prospective):**

      *   Lakatos: You only know a programme is dead after it's dead (and maybe not even then, look at Bohr).
      *   Board: Must decide *now* for the *next* 5 years.
      *   Solution: Shift from "Is this true?" to "Is this *currently* generating novel risk?" The board is funding *potential* progress, not certifying truth. We need to add a "Risk/Investment" layer.

  5.  **Addressing Predictable Misfires:**

      *   Young programmes (no time for novel facts).
      *   Contested cores (paradigm wars).
      *   Commercial success vs. Theoretical stagnation (Pragmatic utility vs. MSRP progress).

  6.  **Running the Case Studies:**

      *   *Case 1 (Quantum Decision):* High citations/spin-off. But ad-hoc parameters. No novel anticipation.
          *   *Analysis:* Theoretically degenerating (ad-hoc). Empirically? Maybe corroborated, but if it's accommodation, it doesn't count for MSRP progress. Commercial success is irrelevant to MSRP but relevant to University ROI.
          *   *Verdict:* Degenerating (theoretically), but maybe fundable for other reasons? The prompt asks to see if the procedure says "degenerating" on non-prejudicial grounds. Yes, the "Novel Fact" test should catch this.
      *   *Case 2 (Bio Self-Organisation):* Formal work. One surprise prediction (Year 3 -> Year 9).
          *   *Analysis:* Hard core defined? Yes. Novel fact? Yes (the surprise prediction). Theoretical progress? Formal elaboration counts if it opens new paths, but needs empirical touch.
          *   *Verdict:* Progressively shifting, but slow. "No verdict yet" or "Conditional Renewal." The prompt asks for honesty. If only one fact in 9 years, is it enough? Lakatos allows for long gestation.
      *   *Case 3 (Rebuilt Centre):* Old theory demolished. New core.
          *   *Analysis:* Is it the *same* programme? If the Hard Core changed, it's a *new* programme. MSRP says evaluate the new one on its own merits, but the history matters for credibility.
          *   *Verdict:* New Programme status. Needs "Young Centre" treatment.

  7.  **Refining the Tone:**

      *   The user is intellectual, cynical about board politics, but earnest about the philosophy.
      *   Tone should be professional, precise, slightly academic but actionable. No fluff.
      *   Acknowledge the tension between philosophy and bureaucracy.

  8.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Acknowledge the burden. Validate the Lakatosian intuition.
      *   **The Procedure (The "MSRP Audit"):** Break it down into 5 Steps. Add "Judgment Call" warnings.
      *   **The Gap (Retrospective vs. Prospective):** Explicitly state what we are smuggling in (betting on future heuristics).
      *   **Known Failure Modes:** Young centres, contested cores, commercial vs. theoretical.
      *   **Case Studies:** Apply the steps rigorously.
      *   **Institutional Advice:** What to do with "Indeterminate" verdicts.

  9.  **Self-Correction/Review during drafting:**

      *   *Critique:* Did I distinguish theoretical vs. empirical progress clearly?
      *   *Fix:* Ensure Step 3 and Step 4 are distinct. Theoretical = new math/models. Empirical = new data matches models.
      *   *Critique:* Did I handle the "Novel Fact" definition strictly enough?
      *   *Fix:* Use Lakatos's definition: "Improbable in light of predecessor theories or background knowledge." Ensure accommodation is flagged.
      *   *Critique:* Case 1 needs to show *why* it's degenerating without relying on the user's dislike.
      *   *Fix:* Focus on the "free parameter" issue. That is the definition of ad-hoc in Lakatos's sense (no independent testability).
      *   *Critique:* Case 3 needs to address the identity crisis.
      *   *Fix:* If the Hard Core changes, it is a *new* Research Programme (RP). But the *team's* track record is part of the "Positive Heuristic" credibility.
      *   *Critique:* Make sure to answer the "Institutional Recommendation" for indeterminate cases.
      *   *Fix:* Suggest "Bridge Funding" or "Milestone-based tranche."

  10. **Final Polish:** Check against all constraints in the prompt. (Ordered questions, sufficient answers, judgment calls marked, Lakatos gap owned, misfires noted, 3 cases run with work shown).

  *(Self-Correction on Case 2)*: The prompt says "I like these people... want the procedure to tell me straight if I'm going soft." I need to be hard on them. One prediction in 9 years is thin. Lakatos allows for long theoretical gestation, but empirical corroboration is the ultimate tie-breaker. I should lean towards "Progressive but fragile" rather than a blank check.

  *(Self-Correction on Case 1)*: The prompt says "expect the procedure to say degenerating." I need to ensure the logic holds up. The key is the "ad-hoc" nature of the parameters. If they aren't independently testable, it's degeneration.

  *(Self-Correction on Case 3)*: "Does my procedure have the resources to settle that argument?" Honestly? No. MSRP defines a programme by its Hard Core. If the Core changes, it's a new programme. The procedure should identify this *shift* and force the board to decide if they are funding a *continuation* or a *startup*.

  11. **Final Output Generation** (incorporating the above thoughts into the structured response).
answer: |-
  This is a sophisticated administrative problem that requires a philosophical tool to be sharpened into a bureaucratic instrument. You are correct: Lakatos's *Methodology of Scientific Research Programmes (MSRP)* is superior to Kuhn for this context because it allows for rational comparison between competing frameworks without requiring a "revolution," and it handles the temporal dimension of research better than peer review's snapshot approach.

  However, Lakatos explicitly warned against using MSRP as a "instant rationality" machine. He argued that we often only recognize a programme as degenerating in hindsight (e.g., Prout's chemistry vs. Dalton's). Your board, however, operates on a 5-year budget cycle. You are asking for a prospective judgment on a retrospective framework.

  Below is the operationalized procedure, followed by the necessary caveats ("The Gap"), the known failure modes, and the application to your three dossiers.

  ***

  # The MSRP Audit: A Decision Procedure for Portfolio Review

  **Instructions for Reviewers:** Do not begin until you have the centre's key publications from the *previous* review period (T1) and the *current* period (T2). You are assessing the *shift* from T1 to T2, not the absolute quality of the papers.

  ### Step 1: Locate the Hard Core
  **Question:** Can the centre articulate a specific set of fundamental assumptions that they treat as irrefutable by methodological decision, distinct from the auxiliary hypotheses they are willing to modify?
  *   **Sufficient Answer:** A written statement (1–3 sentences) identifying the "Hard Core" (e.g., "Decision processes are isomorphic to quantum probability states") and the "Protective Belt" (e.g., "Specific utility functions, noise parameters").
  *   **Insufficient Answer:** A mission statement, a list of topics, or a claim that "we follow the data wherever it leads" (this denies the existence of a Hard Core).
  *   **⚠️ JUDGMENT CALL:** Is the stated Hard Core actually functioning as a Hard Core? Or is it just a slogan? *Test:* Ask if they would abandon the centre's identity if that specific assumption were falsified. If yes, it's not a Hard Core; it's a hypothesis.

  ### Step 2: Assess the Positive Heuristic
  **Question:** Is there a pre-announced plan for developing the Protective Belt, or are modifications purely reactive to anomalies?
  *   **Sufficient Answer:** Evidence of a research agenda set *before* data collection (e.g., grant proposals from T1 outlining models built in T2).
  *   **Insufficient Answer:** A list of problems solved that only appears in the discussion sections of T2 papers.
  *   **⚠️ JUDGMENT CALL:** Distinguish between *flexibility* (good) and *drift* (bad). A positive heuristic guides model-building; drift chases significance values.

  ### Step 3: Test for Theoretical Progress (The Content Test)
  **Question:** Does the T2 theory contain all the empirical content of T1 *plus* excess content?
  *   **Sufficient Answer:** T2 models explain everything T1 did, but also apply to a new class of phenomena or specify conditions under which T1 would fail.
  *   **Insufficient Answer:** T2 explains the same data as T1 but uses more complex mathematics or additional free parameters to fit the *same* dataset.
  *   **⚠️ JUDGMENT CALL:** Is the new complexity "independently testable"? If they add a parameter to fit a curve, can that parameter be measured *without* reference to the curve it fits? If no, it is **ad-hoc**.

  ### Step 4: Test for Empirical Progress (The Corroboration Test)
  **Question:** Has any of the "excess content" identified in Step 3 been corroborated by evidence *not* used in constructing the theory?
  *   **Sufficient Answer:** A prediction made at T1 and tested at T2 with new data, or a prediction made at T2 tested against hold-out data.
  *   **Insufficient Answer:** Re-analyzing the original dataset that motivated the theory; "post-diction" (fitting the model to known historical data and claiming success).
  *   **⚠️ JUDGMENT CALL:** The "Novel Fact" threshold. Does the fact count as novel if it was known to the field but *unexpected* by this specific programme? (Lakatos says yes, if it was improbable given the previous state of the programme).

  ### Step 5: The Degeneration Check (The Patch Test)
  **Question:** When the programme encountered an anomaly in this period, did they modify the Protective Belt or the Hard Core?
  *   **Sufficient Answer (Progressive):** Modified the Belt; Hard Core remained intact; modification led to Step 3 & 4 success.
  *   **Sufficient Answer (Degenerating):** Modified the Belt in a way that reduced testability (added unmeasurable parameters) OR tacitly shifted the Hard Core without admitting it.
  *   **Verdict Rule:**
      *   **Progressive:** Yes to Step 3 AND Yes to Step 4.
      *   **Degenerating:** No to Step 3 OR No to Step 4 (specifically due to ad-hoc adjustments).
      *   **Indeterminate:** Yes to Step 3, No to Step 4 (Theoretical progress only).

  ***

  # The Gap: What This Procedure Smuggles In

  You asked to own the discrepancy between Lakatos's philosophy and your board's mandate. Here it is:

  1.  **The Time Horizon Problem:** Lakatos argues that a programme can be rationally pursued even while degenerating, provided it has a strong historical track record, because a "rescue" might be around the corner. Your board cannot fund "potential rescue" indefinitely.
      *   *The Smuggle:* This procedure treats a 5-year window as sufficient for empirical progress. Lakatos would say this is too short for deep theoretical programmes (e.g., string theory). We are prioritizing *accountability* over *historical rationality*.
  2.  **The Prospectivity Problem:** MSRP is a tool for historians of science, not grant officers. It tells you what *was* rational, not what *will be*.
      *   *The Smuggle:* We are assuming that past heuristic power predicts future heuristic power. This is an inductive bet Lakatos would be wary of.
  3.  **The Value Problem:** Lakatos cares about truth-content. Your university cares about ROI (students, patents, prestige).
      *   *The Smuggle:* This procedure ignores commercial success. A centre can be MSRP-degenerating but financially progressive. You must decide if "degenerating science" is acceptable if it produces "progressive revenue."

  ***

  # Predictable Misfires

  1.  **The "Infant" Failure:** Centres <5 years old often cannot clear Step 4 (Empirical Progress) because the lag between model-building and testing is long.
      *   *Mitigation:* If Step 1 and 2 are strong, default to "Indeterminate" rather than "Degenerating."
  2.  **The "Civil War" Failure:** In interdisciplinary centres, the economists and the physicists may disagree on what the Hard Core is.
      *   *Mitigation:* If Step 1 yields two contradictory Hard Cores, the centre is not a Research Programme; it is a Research *Coalition*. Evaluate them as a service unit, not a theory engine.
  3.  **The "Cash Cow" Failure:** A centre produces no novel facts (Step 4 fails) but spins off lucrative technology (e.g., a specific algorithm that works but is theoretically ad-hoc).
      *   *Mitigation:* This procedure will label them "Degenerating." You must override this verdict based on university financial strategy, but label it clearly as "Funding for Utility, not Science."

  ***

  # Case Studies: Running the Audit

  ### Dossier 1: Quantum Models of Decision-Making
  *   **Profile:** High output, high citations, successful spin-off. Failed predictions fixed by adding free parameters. No anticipated novel facts.
  *   **Step 1 (Hard Core):** "Decision making follows quantum probability laws." *Pass.*
  *   **Step 2 (Heuristic):** They build models to fit observed choice anomalies. *Borderline.* It seems reactive (fitting anomalies) rather than proactive (predicting new anomalies).
  *   **Step 3 (Theoretical Progress):** They add parameters to fit failed predictions. *Fail.* This is the definition of ad-hoc modification. The new models do not have excess content; they have higher flexibility.
  *   **Step 4 (Empirical Progress):** They accommodate existing data. No novel facts anticipated. *Fail.*
  *   **Step 5 (Degeneration Check):** Modifications reduce testability (more parameters = harder to falsify). *Degenerating.*
  *   **Verdict:** **Degenerating Programme.**
  *   **Analysis:** Your prejudice is mathematically supported by the audit. The "success" (citations, spin-off) is external to the MSRP criteria. The spin-off likely exploits a specific, localized regularity (the "patch") rather than the truth of the Hard Core.
  *   **Recommendation:** Do not renew as a *theoretical* centre. Consider funding as an *applied R&D* unit if the revenue stream is vital, but strip the "Research Centre" designation if your goal is theoretical advancement.

  ### Dossier 2: Biological Self-Organisation (Formal Framework)
  *   **Profile:** No experimental confirmation for most things. One surprising prediction (Year 3) confirmed (Year 9). Mostly formal elaboration since.
  *   **Step 1 (Hard Core):** "Biological order emerges from X formal constraints." *Pass.*
  *   **Step 2 (Heuristic):** A clear mathematical programme for elaborating the constraints. *Pass.*
  *   **Step 3 (Theoretical Progress):** Formal elaboration counts as theoretical progress *if* it opens new mathematical pathways. *Pass (Tentative).*
  *   **Step 4 (Empirical Progress):** One novel fact (Year 3 prediction). It took 6 years to test. *Pass.*
  *   **Step 5 (Degeneration Check):** The long gap between prediction and test is risky, but the confirmation saves them. The "mostly formal elaboration" since then is acceptable *if* it is generating *new* predictions for the next cycle.
  *   **Verdict:** **Progressive (but slow).**
  *   **Analysis:** You are not going soft. Lakatos explicitly allows for long periods of theoretical gestation (the "positive heuristic" at work) before empirical cash-out. The key is that the one prediction was *risky* and *surprising*.
  *   **Recommendation:** Renew, but with a condition (see Institutional Advice below).

  ### Dossier 3: The Rebuilt Centre
  *   **Profile:** Flagship theory demolished 6 years ago. Rebuilt around a different core. Half board says "Falsified," half says "New Programme."
  *   **Step 1 (Hard Core):** The Hard Core has *changed*. (e.g., moved from "Market Rationality" to "Bounded Rationality").
  *   **MSRP Rule:** If the Hard Core changes, it is a **New Research Programme**.
  *   **Analysis:** The board argument is a category error. You cannot hold the new programme accountable for the old programme's falsification *scientifically*, but you can hold the *team* accountable for their heuristic judgment.
  *   **Verdict:** **New Programme Status.**
  *   **Analysis:** The procedure settles the argument by reclassifying the entity. The old programme is dead. The new one is an infant.
  *   **Recommendation:** Evaluate as a "Young Centre" (see Misfires). Do not cut based on past falsification, but do not grant full 5-year security based on a new start.

  ***

  # Institutional Advice for "Indeterminate" or "New Programme" Verdicts

  You asked what to do when the framework refuses a Yes/No (as it should for Dossier 2 and 3). Do not pretend the checklist gives a binary answer. Use the following mechanisms:

  1.  **The Milestone Tranche (For Dossier 2):**
      *   Grant a 2-year renewal instead of 5.
      *   **Condition:** Release the second half of funding *only* if a specific, pre-registered novel prediction (generated in Year 1 of renewal) is tested by Year 3.
      *   *Why:* This respects the lag time Lakatos acknowledges while imposing the empirical accountability the university requires.

  2.  **The "Hard Core" Lock (For Dossier 3):**
      *   Grant renewal as a New Programme.
      *   **Condition:** The new Hard Core must be publicly registered in the renewal dossier. Any future shift of this Core triggers an automatic emergency review.
      *   *Why:* This prevents "programme hopping" where a centre changes its core every 5 years to avoid falsification, which is the ultimate form of degeneration.

  3.  **The "Utility" Override (For Dossier 1):**
      *   If you must fund the Degenerating centre for financial reasons:
      *   **Condition:** Reclassify the grant from "Discovery Research" to "Technology Development."
      *   *Why:* This preserves the integrity of your research portfolio. You are admitting you are buying a product, not funding science. Do not let them claim MSRP progress in their annual reports if you are funding them for commercial utility.

  ### Final Note to the Chair
  You are using Lakatos to introduce *risk* into a system designed to minimize it. A "Degenerating" verdict is politically dangerous because it implies the researchers are being irrational, not just unsuccessful.

  When you present this, emphasize that **Degeneration is not a moral failing; it is a structural phase.** Even Newtonian physics eventually degenerated into ad-hoc patches before Relativity. The goal of this procedure is not to punish degeneration, but to identify it early enough to decide if the "rescue" is worth the investment. If the board uses this to simply slash budgets, you have misused the tool. If they use it to structure *conditional* support that forces theoretical risk-taking, you have succeeded.
