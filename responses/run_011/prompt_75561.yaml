      *Final check on the Standoff:* Is it verbal? H. defines "preference" as "motivation to act." M. defines "preference" as "motivation to act *thusly rather than so*." It is verbal *about the word preference*, but substantive *about the nature of rational explanation*. I will characterize it as verbal on the surface, substantive underneath.

