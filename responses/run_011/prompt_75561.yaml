          *   The "Indifference": H. treats it as physical symmetry. M. treats it as normative symmetry. They need to distinguish *value* indifference from *causal* symmetry.
          *   The "Verdict": The paradox is usually resolved by saying rationality *allows* randomization. H. thinks randomization proves the case is physical. M. thinks randomization proves the case is normative.

  6.  **Final Polish:** Check against the prompt requirements.
      *   Adjudicate move by move? Yes.
      *   Say whether it succeeds? Yes.
