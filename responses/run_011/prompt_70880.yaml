answer: |-
  The argument between you and your friend hinges on whether *The Man Who Shot Liberty Valance* is a eulogy for a lie or an autopsy of how that lie was constructed. Your friend sees a film that has lost faith in progress; you see a film that examines the price of progress. To adjudicate this, we must wield Herbert Butterfield's critique of the Whig interpretation of history not as a hammer, but as a scalpel. Butterfield argued that Whig historians write the past with reference to the present, pruning complex events into a straight line of causation that leads inevitably to current virtues, dividing historical actors into "men of progress" and "men of reaction."

  Ford's film does not merely fall into this trap; it dramatizes the trapping itself. The structure of the film is a literal enactment of Butterfield's primary charge: studying the past with reference to the present. The narrative begins in the present day, with a Senator and his wife returning to a small town for a funeral. The bulk of the film is a flashback narrated by that Senator, Ransom Stoddard, explaining how he came to be the man who shot Liberty Valance. The past is not being explored for its own sake, as Butterfield would wish; it is being marshaled to explain the authority of the present. The flashback exists solely to justify the Senator's status. In this sense, the film's architecture is Whiggish, but its content is an indictment of that architecture.

  Consider Butterfield's concept of abridgement. He argues that Whig history simplifies the past by selecting events that fit the progressive narrative and dropping those that do not. The film stages this abridgement in its final act. After Stoddard confesses the truth to the newspaper editor—that it was actually Tom Doniphon who killed Valance from the shadows—the editor takes the reporter's notes and burns them. He declares that when the legend becomes fact, one must print the legend. This is not just cynicism; it is a performative act of historiography. The editor, a professional narrator of the present, actively destroys the evidence that complicates the causal line. He selects the event that supports the statehood narrative (Stoddard the lawman killing the outlaw) and drops the event that undermines it (Doniphon the cowboy using violence to save the law). The film shows us exactly which events are selected and which are dropped, fulfilling your position that the film stages the manufacture of the narrative.

  However, Butterfield's critique of dualist casting requires closer scrutiny. In a Whig reading, Stoddard is the agent of progress (law, literacy, statehood) and Valance is the agent of reaction (violence, chaos, cattle barons). Butterfield complains that this ignores those who contributed nothing to the making of the present. Here, the film exceeds Butterfield's taxonomy. Tom Doniphon does not fit the dualism. He is not a man of reaction; he is the hidden cause of the progress. He uses the violence of the frontier to destroy the ultimate obstacle to civilization, thereby making his own way of life obsolete. He produces the outcome but cannot be admitted into its story. If Whig history ignores the losers, Ford's film mourns the winner-who-loses. Doniphon is the person who makes the present and is therefore edited out of it. This is a category Butterfield lacks. Butterfield worries that the "reactionaries" are unfairly maligned; Ford shows us that the "founders" are often unfairly erased.

  Furthermore, there is Pompey. Doniphon's hired hand fires the rifle Doniphon aims. Pompey is excluded twice over: first by the legend that credits Stoddard, and second by the local memory that credits Doniphon. He is the invisible labor upon which both the myth and the reality rest. The film acknowledges this exclusion visually—Pompey is often in the frame when the truth is spoken, silent and watching—but it does not resolve it. This suggests the film is aware that the abridgement required for a progressive narrative is not just political but racial and social.

  This leads to your first further question: Is the legend even false? Forensically, yes. Stoddard fired his gun, but he did not kill Valance. Doniphon did. However, the legend relies on a narrative truth rather than a ballistic one. Stoddard stood in the street; he challenged Valance; he initiated the end of Valance's reign. In terms of Arthur Danto's "narrative sentences," the description "Stoddard shot Valance" acquires its truth value only in light of the consequences. Because Stoddard became the Senator because of the reputation, the reputation functions as a cause in the present, regardless of the ballistics of the past. The film suggests that in politics, the narrative cause supersedes the physical cause. Stoddard's panic and miss are irrelevant to the historical record because the *belief* that he won is what built the state. The film declines to supply a philosophical analysis of simultaneous causation because it doesn't matter. The legend is functionally true, even if factually false.

  Regarding the status of the evidence: The only account of the ambush exists within the Senator's reminiscence, which is subjective, and the editor's notes, which are destroyed. The film treats the editor's decision not as an endorsement, but as a tragic necessity. The editor does not burn the notes with a smile; he does it with a grim resignation. He understands that the truth (Doniphon) offers no foundation for the state, while the lie (Stoddard) does. The film indicts the necessity while acknowledging the utility. It exhibits the mechanism of historiography without validating its morality.

  Bringing in Hayden White clarifies the emotional shift. The flashback is emploted as a romance: the hero (Stoddard) confronts the dragon (Valance) to rescue the princess (Hallie) and the kingdom (Shinbone). This is the Whig narrative. However, the frame story converts this into a tragedy. The hero knows he is a fraud; the princess admits she loved the man who was erased (Doniphon); the kingdom is built on a lie. The romance is the public history; the tragedy is the private memory. The film uses the romance to show how history is sold, and the tragedy to show what it costs.

  Where does the Butterfield lens strain? Butterfield's alternative was to approach the past for its own sake, delighting in the concrete and complex. A two-hour popular narrative cannot do this; it must abridge by definition. Ford cannot give us the past "as it was" because he is telling a story. Moreover, Ford's own nostalgia complicates the anti-Whig reading. While the film critiques the myth of progress, it simultaneously romanticizes the very frontier it says must pass. Doniphon is depicted as more competent, more masculine, and more honorable than the politicians who replace him. In this sense, Ford is guilty of a reverse Whiggism: judging the present as a decline from the past. Butterfield warned against judging the past by the present; Ford judges the present by the past. This creates a tension where the film critiques the manufacture of history while engaging in its own myth-making about the nobility of the erased man. Butterfield's polemic carries a presentism of its own—the assumption that "objective" history is possible or desirable. The film quietly exploits this by suggesting that objective history is impossible in a democracy; only myths can govern.

  So, who is right in your argument? Your friend sees disenchantment, which is present, but stops at the mood. You argue the film stages the manufacture of the narrative and questions the cost. The film supports your position. It is not merely cynical about progress; it is analytical about the transaction required to achieve it. The disenchantment is the result of the analysis, not the premise.

  What does *Liberty Valance* contribute to this debate that a philosophical argument could not? Philosophy can describe the falsification of history, but it cannot dramatize the grief of the falsification. Butterfield can tell us that Whig history distorts the past, but he cannot show us Hallie placing a cactus rose on a coffin, mourning the man the history books forgot. The film contributes the affective weight of the lie. It shows that progress narratives are not just intellectual errors but emotional necessities that require human sacrifice. It demonstrates that the "line of causation" is paved with specific, nameable losses. By giving us Doniphon's funeral in the present day, attended by the powerful man who owes him everything but can acknowledge him nothing, the film makes the abstract cost of Whig history concrete. It reveals that the "manufacture" of history is not a cold editorial decision, but a violent act of erasure that haunts the victor. The film proves that you cannot have the state without the shadow, and that the shadow never truly disappears.
