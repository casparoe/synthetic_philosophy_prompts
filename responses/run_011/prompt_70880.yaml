      *   **The User's Argument:** The film isn't just cynical/disenchanted (Friend's view) but stages the *manufacture* of a progressive narrative and questions its cost (User's view).
      *   **Theoretical Framework:** Herbert Butterfield's *The Whig Interpretation of History*. Specific concepts to apply:
          *   Studying the past with reference to the present.
          *   Abridgement (selection/omission).
          *   Substitution of a "line of causation" for actual causal enquiry.
          *   Dualist casting (winners vs. losers/foils).
      *   **Specific Complications to Address:**
          *   Tom Doniphon (makes the present but is edited out).
          *   Pompey (does the killing, excluded twice).
          *   Truth status of the legend (Stoddard fired, Doniphon killed, simultaneous causation).
          *   Status of evidence (Senator's reminiscence, burned notes, "print the legend").
          *   Hayden White (emplotment: romance vs. tragedy).
          *   Arthur Danto (narrative sentences).
      *   **Constraints:**
          *   Be scrupulous about film and theory (don't reduce one to the other).
          *   Acknowledge limitations (Butterfield targeted historians; film must abridge).
          *   Note where the lens strains (Ford's nostalgia vs. anti-Whig reading).
          *   Check if Butterfield has his own presentism.
          *   Paraphrase dialogue/scenes (no direct quotes).
          *   No references/bibliography.
          *   **Ending:** Plainly state which position (User or Friend) is supported and what the film adds to the debate that philosophy alone cannot.

  2.  **Deconstruct Butterfield's Whig History:**
      *   *Core Charge:* Writing history from the perspective of the present, judging the past by how much it contributed to the present (progress).
      *   *Abridgement:* Simplifying complex events into a straight line of progress.
      *   *Dualism:* Heroes of progress vs. Men of Reaction.
      *   *Causation:* Assuming a direct line rather than complex, contingent interactions.
      *   *Butterfield's Alternative:* Understanding the past on its own terms (though the prompt asks to test if this is available to film).

  3.  **Deconstruct the Film (*The Man Who Shot Liberty Valance*):**
      *   *Structure:* Frame story (present day, funeral/train) + Flashback (the past).
      *   *Plot:* Ransom Stoddard (law/books) vs. Liberty Valance (violence). Tom Doniphon (frontier violence/code) helps Stoddard but loses Hallie and status.
      *   *Climax:* The shootout. Stoddard fires, misses/panics. Doniphon shoots from shadows with Pompey's rifle.
      *   *Resolution:* Stoddard gets credit, becomes Senator/Governor. Doniphon dies in obscurity. Editor burns notes: "Print the legend."

  4.  **Synthesize: Butterfield meets Ford:**
      *   *Reference to Present:* The film literally starts in the present (Senator Stoddard returning for a funeral). The flashback is entirely colored by *why* they are there now. This fits Butterfield's charge perfectly.
      *   *Abridgement:* The newspaper editor burning the notes is the act of abridgement. The complex truth (Doniphon) is cut to fit the myth (Stoddard).
      *   *Causation:* The "line of causation" is Law triumphing over Violence. But the *actual* cause is Frontier Violence (Doniphon) enabling Law. The film exposes the falsity of the straight line.
      *   *Dualism:* Whig history needs Heroes (Stoddard) and Villains (Valance). Doniphon breaks this. He is neither. He is the "unadmittable cause." Pompey is the invisible labor.
      *   *Truth of the Legend:* Is it false? Stoddard *did* shoot (just didn't kill). The legend simplifies "shot" to "killed/effective force." It's a narrative truth, not a forensic one.
      *   *Evidence:* The evidence is destroyed. History becomes what is accepted, not what happened.
      *   *Emplotment:* Surface = Romance (Law wins). Frame = Tragedy (Cost of that win).
      *   *Danto:* "The man who shot Liberty Valance" is a narrative sentence. Its meaning changes based on the ending.

  5.  **Drafting - Section by Section:**

      *   **Introduction:** Set the stage. Acknowledge the friend's cynicism vs. user's structural reading. Introduce Butterfield not as a blunt instrument but as a specific lens.
      *   **Butterfield's Charges & The Film's Structure:**
          *   *Past w/ Reference to Present:* The train/flashback structure. Stoddard narrating his own myth.
          *   *Abridgement:* The editor burning the notes. This is the key moment of historiography.
          *   *Causation:* The myth says Law killed Violence. Reality says Violence killed Violence to save Law.
      *   **The Problem of Personnel (Dualism):**
          *   Valance (Reaction) vs. Stoddard (Progress).
          *   Doniphon: The anomaly. He makes the present but cannot live in it. He is the "cost."
          *   Pompey: The excluded excluded.
          *   *Butterfield's Limit:* Butterfield complains about ignoring the "losers." Ford shows us the loser *making* the win, then being discarded. This goes beyond Butterfield.
      *   **Truth and Evidence:**
