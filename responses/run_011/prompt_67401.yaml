answer: |-
  The crux isn't whether eliminativism is true, but whether linguistic abstention proves ontological absence. A competent-but-second-class answer will conflate vocabulary with ontology, assuming that because they lack the word 'belief', they lack the concept. The real trap is the normativity: if the widow's account can be 'corrected', there are truth conditions, which implies representational states regardless of the idiom used. The student must spot that the sect is likely just using a different translation manual for the same intentional states, not abolishing them.

  ***

  **UNIVERSITY EXAMINATION PAPER**
  **MODULE: PHILOSOPHY OF MIND (LEVEL 2)**
  **TIME ALLOWED: 45 MINUTES**
  **TOTAL MARKS: 25**

  **Question 1**

  Consider the following case:

  > In a certain religious community, members have trained themselves, from childhood, never to describe themselves or anyone else in terms of beliefs, desires, intentions or wants. Their whole idiom is dispositions and goings-on: when a woman's husband dies she says only "the crying comes now, and the going to the window at dusk", and that is accepted by everyone there as a complete account of her state.

  A philosopher character observing this community argues that this proves folk psychology is optional: here is a whole form of life that gets on without positing propositional attitudes, so the attitudes were never there. However, it is noted that these people still teach their children, still deceive one another, still get surprised, and that the widow's own sentence is offered as an account of her state and can be corrected by others if they think it is wrong.

  Does the community's descriptive practice support the claim that propositional attitudes do not exist? In your answer, focus on the relationship between linguistic idiom and ontological commitment, and specifically address the significance of the fact that the widow's account can be corrected.

  ***

  **MODEL ANSWER**

  The philosopher character's inference commits a category mistake by conflating linguistic practice with ontological reality. That a community lacks a specific vocabulary for propositional attitudes does not entail that the states themselves are absent. The central error is assuming that the *mention* of beliefs is required for the *use* of belief-attribution. Even if the sect forbids the word 'belief', their behaviour suggests they continue to operate within the intentional stance. They teach, deceive, and express surprise. Deception, specifically, requires modelling another's mind as holding a false representation of the world. If they successfully deceive, they are manipulating what we would call 'beliefs', regardless of whether they label them as such. Their idiom may be a translation manual rather than an elimination.

  The crucial evidence lies in the normativity of the widow's statement. She says, "the crying comes now," and this account can be corrected by others if deemed wrong. Correctability implies truth conditions. If her statement can be false, it must represent the way things are. If it represents her state, it functions exactly like a first-person authority report about a mental state. If she says "the crying comes" but is actually plotting revenge, and another member corrects her ("No, the plotting comes"), they are distinguishing between outward disposition and inner orientation. This distinction is the bedrock of folk psychology. By admitting the possibility of error, the community acknowledges that the outward going-on is evidence for an underlying state, not the state itself. This preserves the ontology of the mental even if the vocabulary is behaviourist.

  Furthermore, the eliminativist claim undermines itself. If the philosopher says "propositional attitudes do not exist," she is expressing a belief and expecting us to accept it based on her reasons. If the sect member says "the crying comes," she is expressing a state and expecting acceptance. If the eliminativist insists she is not expressing a belief, she removes the rational force of her own argument. She cannot claim her theory is true without relying on the very normative structure of reason-giving she seeks to abolish. The sect faces a similar tension: if their descriptions are merely physical movements, correction makes no sense. One does not correct a sneeze. One corrects a claim. By treating the widow's speech as corrigible, they treat it as cognitive.

  Therefore, the community's practice does not prove attitudes are optional or non-existent. It proves only that folk psychology can be cloaked in dispositional language. The ontology remains because the functional role remains. They predict behaviour, attribute error, and navigate social norms. These are the jobs propositional attitudes do. As long as the jobs are being done, the workers exist, even if they wear different uniforms. The philosopher character mistakes a change of costume for a disappearance of the actors. The widow's sentence is not a report of brute behaviour; it is a coded report of a mental state, validated by the community's willingness to judge it true or false.

  ***

  **MARKING SCHEME**

  1.  **Distinction between vocabulary and ontology (5 marks):** The answer must clearly argue that lacking the word 'belief' does not mean lacking the state. It should identify the inference from language to reality as the weak point in the philosopher character's argument.
      *   *Typical fumble:* Students assume that if the word isn't used, the concept is literally impossible to think (linguistic determinism).

  2.  **Analysis of 'correctability' and normativity (5 marks):** Full marks require noting that if the widow's statement can be 'wrong', it has truth conditions, implying it represents a state of affairs rather than just being a noise or reflex.
      *   *Typical fumble:* Treating the correction as mere social policing rather than an assessment of truth or accuracy regarding internal states.

  3.  **Functional role argument (5 marks):** The answer should point out that activities like deception and teaching require modelling others' minds (intentional stance), regardless of the idiom used to describe them.
      *   *Typical fumble:* Ignoring the prompt's details about deception/teaching and focusing only on the widow's grief.

  4.  **Self-undermining problem (5 marks):** The student should address the paradox of the eliminativist (or the sect) making truth-claims while denying the existence of the states required to hold truth-claims (beliefs).
      *   *Typical fumble:* Stating "eliminativism is self-refuting" as a slogan without explaining why the act of arguing presupposes the attitudes.

  5.  **Conclusion on the specific scenario (5 marks):** The conclusion must return to the widow and the sect, affirming that their practice is likely a translation of folk psychology, not an elimination of it.
      *   *Typical fumble:* Drifting into a generic discussion of neuroscience or Churchland without tying it back to the widow's specific sentence.

  ***

  **EXAMINER'S FEEDBACK ON COMMON PITFALLS**

  A smart-but-lazy student will likely attempt one of three shortcuts. First, they will classify the sect as strict Behaviourists and argue that behaviourism was disproved by Chomsky; this misses the point that the sect members still deceive, which implies internal representation. Second, they will argue that neuroscience will eventually show beliefs don't exist, ignoring the prompt's requirement to analyse the *descriptive practice* itself. Third, they will claim it is simply cultural relativism—that beliefs exist for us but not for them—which contradicts the universalist nature of the ontology being questioned. Regarding your philosopher character: their line is compelling literature but fragile philosophy. It survives only if the sect genuinely lacks the *concept* of deception, but since you stipulated they still deceive and correct one another, the character's claim that attitudes "were never there" is unsustainable. The attitudes are present; they are merely unnamed.
