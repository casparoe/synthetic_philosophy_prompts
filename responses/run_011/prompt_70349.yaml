          *   Normative Concept: "Obligation" is a *hard constraint* on the decision boundary.
      *   *Claim 3 (Fraud Categorization):*
          *   Population: Overpayment cases.
          *   Label: "Fraud" vs. "Error."
          *   Decision-maker: Investigator/Policy.
          *   Loss Function: The act of labeling *is* the loss function.
          *   Normative Concept: "Intent" is a *latent variable* that the model tries to infer, but the definition is policy-dependent.
      *   *Claim 4 (Sanctions/Deterrence):*
          *   Population: Claimants subject to conditions.
          *   Label: "Future Compliance."
          *   Decision-maker: System imposing sanctions.
          *   Loss Function: Minimize future non-compliance (dynamic optimization).
          *   Normative Concept: "Deterrence" is a *forward-looking parameter* in the objective function.
      *   *Claim 5 (Sanctions/Hardship):*
          *   Population: Sanctioned claimants.
          *   Label: "Vulnerability."
          *   Decision-maker: Analytics/Policy.
          *   Loss Function: Minimize variance of welfare loss across subgroups.
