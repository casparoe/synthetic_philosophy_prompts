      *   *Who is speaking?* This is the crux. The article speaks in the voice of *the consensus of reliable sources*. The volunteer is a transcriber, not an author. The site is a publisher acting as a neutral aggregator.
      *   *Blame:* If a claim is wrong but sourced, the *source* eats the blame. If a claim is unsourced but true, the *editor/site* eats the blame. Wikipedia chooses to outsource liability (epistemic and legal) to third parties.
      *   *The Plain Voice:* "The treaty was signed" is a rhetorical device to maintain readability. It implies assertion, but the footnotes act as the modal operator ("It is the case that... *according to X*"). It's not decoration; it's a division of labor. The text asserts the *record*, the notes assert the *authority*.

  3.  **Deconstruct Question 3: Alternative Accounts (Underdetermination):**
      *   *Current Theory:* "Recorded Consensus." (Say what reliable sources say).
      *   *Alternative Theory A:* "Liability Shield." (Say only what we can defend in court/arbitration). This looks almost identical in practice.
      *   *Alternative Theory B:* "Epistemic Humility." (We admit we aren't experts, so we defer to those who claim to be).
      *   *Where do they diverge?*
