answer: |-
  You have put your finger on the central tension of the project. It is not a bug; it is the architecture. To answer you, I need to reconstruct the epistemology of Wikipedia—not the policy pages, but the actual operating system underneath them.

  ### 1. Who is speaking, and what are they saying?

  You asked if the plain voice ("the treaty was signed") is an assertion by the site, or if the disclaimer is just decoration.

  The site is not asserting that the treaty was signed. The site is asserting that **reliable sources say the treaty was signed.**

  The plain voice is a user-interface choice, not an ontological one. If every sentence read "According to Smith (2005), the treaty was signed," the text would be unreadable. So, the text adopts the voice of authority for the sake of flow, but the footnotes act as the modal operator. They change the truth condition of the sentence.

  In a normal encyclopedia, the sentence "The treaty was signed" means: *It is a fact that the treaty was signed.*
  In Wikipedia, the sentence "The treaty was signed [1]" means: *It is a fact that Source [1] claims the treaty was signed, and Source [1] meets our criteria for reliability.*

  So, who is doing the saying? It is the **source**. The volunteer is a transcriber. The site is a publisher of transcripts.

  This explains your two frustrations perfectly.
  In case one (the tube amps), you are trying to assert a fact about the world. Wikipedia only allows assertions about the *literature*. You know the world; Wikipedia only knows the library.
  In case two (the copied error), you want to correct the world. Wikipedia sees that the literature agrees (even if the literature is echoing a mistake). To Wikipedia, a consensus of errors in reliable sources is a "fact" of the literature, which is the only reality it tracks.

  Why this design? It is not primarily about evidence. It is about **liability and labor.**

  If Wikipedia asserts "X is true," and X is false, Wikipedia is wrong. Wikipedia is an anonymous, volunteer-driven swarm; it cannot defend its own expertise. It has no reputation to lose, except the reputation of being a reliable aggregator.
  If Wikipedia asserts "Source Y says X," and X is false, Source Y is wrong. Wikipedia is still correct in its reporting.

  The rule shifts the epistemic burden from the editor (who is anonymous and unaccountable) to the source (which is named, published, and theoretically accountable). The "plain voice" is a fiction that allows the text to function as an encyclopedia, but the footnotes are the legal and philosophical reality. The disclaimer is not decoration; it is the foundation. The text rests on it.

  ### 2. Could a different idea generate the same rules?

  You asked if a different account of "when it's okay to say something" would produce the exact same editing behavior. I think there are two competing theories that look identical 95% of the time.

  **Theory A: The Record Theory.**
  *   *Principle:* Wikipedia records the consensus of established discourse.
  *   *Goal:* To reflect what the world *says* is true.
  *   *Rule:* If reliable sources say it, it goes in.

  **Theory B: The Defensibility Theory.**
  *   *Principle:* Wikipedia must be able to defend every claim against a complaint.
  *   *Goal:* To survive conflict without arbitrating truth.
  *   *Rule:* If a claim is challenged, can the editor point to a reputable third party and say "They said it, not me"?

  For most historical or scientific claims, these produce the same result. If a physics textbook says gravity works this way, both theories say "put it in."

  **Where they come apart:**
  The divergence happens with **Living Persons (BLP)** and **Libel**.

  Imagine a reputable newspaper publishes a rumor about a living politician that is widely known to be false by insiders, but no other source has contradicted it yet.
  *   **Theory A (Record)** says: The source is reliable, the claim is in the record. It stays.
  *   **Theory B (Defensibility)** says: If we publish this, we are open to a lawsuit or a massive community revolt. We cannot defend this even with a citation, because the harm outweighs the record.

  In practice, Wikipedia follows Theory B here. It removes sourced material about living people if it is contentious, even if sourced. This proves that the deeper logic is not actually "Record the Consensus," but "Avoid Unmanageable Risk."

  Another divergence point: **The "Broken Telephone" scenario.**
  Imagine five books all repeat an error because they all copied the first book.
  *   **Theory A** says: There is a consensus in the literature. The error stays. (This is your tube amp case).
  *   **Theory C (Truth-Tracking)** says: The claim is false. Remove it.

  Wikipedia follows Theory A. It will not break the chain of citation until a *new* source comes along to break it. This confirms that Wikipedia is not in the business of truth-tracking; it is in the business of consensus-tracking.

  ### 3. Your Proposal: Confidence-Based Editing

  You suggest: Drop the source rule. Keep claims if an editor is confident. Remove claims if no editor is confident, regardless of sources. Flag the confident-but-unsourced stuff.

  You correctly identified the fatal flaw: "It turns the site into a running weather report of how various volunteers happen to feel." But let's dig deeper into *why* that happens, and what your proposal assumes that the current one doesn't.

  **The Assumption of Identity**
  Your proposal assumes that "confidence" is a verifiable metric. For confidence to carry weight, we must know *whose* confidence it is.
  *   If a nuclear physicist says "I am confident this reactor spec is wrong," that confidence is valuable.
  *   If a teenager says "I am confident this reactor spec is wrong," that confidence is noise.

  The current system (Sources) bypasses the need to verify the *editor*. It verifies the *text*. I don't need to know who you are; I need to know if you can produce a book.
  Your system requires the site to evaluate the *editor's expertise*. To do that, you need identity, reputation, and credentials. Wikipedia is built on anonymity. If you require credentials to assert confidence, you kill the open model. If you allow anonymous confidence, you invite vandalism disguised as certainty ("I am confident the moon is made of cheese").

  **The Assumption of Stability**
  Sources are static. A book published in 1990 sits on a shelf. It can be checked ten years from now.
  Confidence is transient. An editor is here today, gone tomorrow. If an article stands on "Editor X is confident," and Editor X leaves, the claim loses its foundation. The article becomes a ruin of past convictions.
  Sources allow the project to outlive its participants. Your proposal ties the knowledge to the knower. Wikipedia ties the knowledge to the record.

  **Does your version assert anything?**
  If I read "The treaty was signed [Editor: Confident]," what am I reading?
  I am reading a report on the mental state of a volunteer.
  The current version ("The treaty was signed [Book: Page 5]") is a report on the existence of a publication.
  Paradoxically, the current version is *more* objective. It makes a claim about the world that can be verified (does the book exist? does it say that?). Your version makes a claim about a mind, which cannot be verified without mind-reading.

  **Would it fix your cases?**
  *   *Tube Amps:* Yes. You are confident, so you flag it. Readers see "Experts dispute this." That is an improvement for the reader.
  *   *Copied Error:* Yes. If the current editors know it's wrong, their lack of confidence removes it.

  But the cost is **gameability.**
  In the current system, to insert a lie, I must forge a source or find a bad one. That takes work.
  In your system, to insert a lie, I just say "I am confident." That takes seconds.
  To stop me, you have to argue about my internal mental state. "You aren't *really* confident." "Yes I am."
  The current system argues about external artifacts. "That blog isn't reliable." "Yes it is."
  Arguments about artifacts are resolvable. Arguments about feelings are not.

  ### 4. The Honest Verdict

  You asked me to be honest.

  Your frustration is valid. The system prioritizes **process over truth.** It is a bureaucratic epistemology. It values the *method* of arriving at a claim over the *accuracy* of the claim.

  Why? Because Wikipedia is not a project to discover truth. It is a project to **summarize existing agreement.**
  It assumes that truth is too hard for volunteers to adjudicate, but consensus is easy to count.
  It assumes that being verifiably wrong (citing a source that is wrong) is safer than being unverifiably right (knowing a fact no one has written down).

  Your proposal shifts the burden from **Verification** (can this be checked?) to **Authority** (does this person know what they are talking about?).
  The current system assumes no one has authority.
  Your system assumes editors *can* have authority.

  If Wikipedia were a small community of identified experts (like a professional society's wiki), your system would be better. It would be more accurate.
  But for a massive, anonymous, open platform, the Source Rule is a survival mechanism. It is a shield. It allows strangers to collaborate without needing to trust each other. They only need to trust the books.

  So, to answer your core question: **What makes it okay to put a sentence up?**
  It is okay if the sentence can be defended without reference to the editor's mind.
  The site is not asserting the fact. It is asserting the existence of the claim in the public record.
  The plain voice is a courtesy to the reader.
  The disclaimer is the legal reality.

  Your proposal would make the content more accurate in the short term, but it would make the project unstable in the long term. It trades **scalability** for **precision.** Wikipedia chose scalability. It chose to be a library of what has been said, rather than a ledger of what is true.

  You are editing a map of the literature, not the territory. That is the rule you cannot get your head around because you are looking at the territory (the amps, the error). The map is only concerned with how other mapmakers have drawn it. If they all drew the river in the wrong place, the Wikipedia map must show the river in the wrong place, until a new mapmaker publishes a correction.

  It is maddening for a craftsman. But it is the only way the machine stays running.
