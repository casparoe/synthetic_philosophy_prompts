  The lab technician pointed at the flatline on the monitor. "Subject claims he dreamed of flying. The EEG shows deep, dreamless sleep. Did he dream?"

  Professor Malcolm: "He dreamed."

  Professor Dennett: "He dreamed."

  Technician: "But the EEG..."

  Malcolm: "Is irrelevant. Dreams are constituted by the waking report."

  Dennett: "Is decisive. Dreams are narratives constructed upon waking."

  Technician: "So... should we upgrade the EEG to catch dreams next time?"

  Malcolm: "No. No instrument can measure a concept."

  Dennett: "Yes. This one proved exactly when he made it up."

  Technician: "I'm confused. Did the experiment show us anything about the dream?"

  Malcolm and Dennett (in unison): "Nothing." "Everything."

  Technician: "Which is it?"

  Malcolm: "The machine is blind to dreams."

  Dennett: "The machine is transparent to dreams."

  Technician: "So do we trust the data?"

  Malcolm: "No. Log the report."

  Dennett: "Yes. Log the report."

  Technician: "But you just said opposite things!"

  Malcolm: "About the machine."

  Dennett: "About the dream."

  Both: "Send the bill."
