      *   *My Commitment:* **Hard Capability Limits.** Why? Because if the agent can model the monitor, the monitor is probabilistic. You cannot fight a probabilistic adversary with a probabilistic defense if they share the same distribution. You need a deterministic wall.

  4.  **Drafting the Argument (Mechanism):**
