prompt: |-
  A couple of the Rapa Nui specialists at our department have been going in circles on Easter Island for two years and my PI wants us to run an adversarial collaboration between them this summer, so I've been stuck drafting the document they're supposed to end up signing. One side argues the island genuinely collapsed before Europeans showed up: palms gone, statue carving stopped for good, the population cratered, and the obsidian spearpoints turning up in late layers are the archaeological signature of war. The other side says nothing of the kind happened — that it's a reorganization, not a failure: the people kept farming, just differently; religious investment shifted into the birdman cult rather than vanishing; and the real demographic disaster is squarely post-contact, with the slave raids and disease of the 1860s doing the work that the collapse story assigns to earlier centuries.

  Could you draft what they'd actually produce? I want the claims both can sign about the island's archaeology and about what the record can and can't show; the residual disagreements stated in wording each side would accept as a fair statement of its own position; and the cruxes. My own guess is that one crux is what "collapse" is supposed to mean and another is whether the pre-contact population trajectory really fell before 1722, but correct me if the real fault lines are elsewhere. For each crux, name some specific piece of evidence or line of argument both would agree bears on it — a dating sequence, a class of artifact, an oral tradition read in a particular way — and record what each side predicts it will show. A numbered agreed-claims section followed by a disagreements table would be ideal.

  And since this is going to get torn apart in review: flag where the wording is quietly doing work for one side, and tell me what would actually change your mind about which of the two positions the evidence favors — which piece of reasoning in your draft is most likely to be the weak one.
reasoning: |-
  Here's a thinking process that leads to the suggested adversarial collaboration document:

  1.  **Analyze the Request:**
      *   **Context:** A PI wants two Rapa Nui (Easter Island) specialists to sign an adversarial collaboration agreement. One argues for "Collapse" (pre-contact societal failure), the other for "Resilience/Reorganization" (post-contact disaster).
      *   **Task:** Draft the document they would produce.
      *   **Components:**
          1.  Agreed Claims (numbered section).
          2.  Disagreements Table (claims, wording acceptable to both, cruxes).
          3.  Specific Evidence/Arguments for each crux (what bears on it, predictions from both sides).
          4.  Meta-commentary: Flag wording biases, identify the weakest link/reasoning that would change minds.
      *   **Tone:** Academic, precise, neutral but acknowledging deep theoretical divides.
      *   **User's Hypothesis:** Cruxes are definition of "collapse" and pre-contact population trajectory. (I need to validate or correct this).

  2.  **Deconstruct the Scientific Debate (Rapa Nui):**
      *   *Traditional/Collapse View (Diamond, et al.):* Ecocide, deforestation, civil war, cannibalism, population crash before 1722. Statues stopped, palms extinct, obsidian *mata'a* as weapons.
      *   *Revisionist/Resilience View (Hunt, Lipo, Hamilton, et al.):* Sustainable adaptation, *mata'a* are tools not weapons, population stable/growing until Europeans, "collapse" is a colonial narrative.
      *   *Key Evidence:* Pollen records (palm extinction), radiocarbon dating (statue construction, settlement), obsidian *mata'a* analysis (use-wear), human remains (trauma), oral traditions (Hotu Matu'a, wars), European contact accounts (Roggeveen, Cook, La Pérouse).

  3.  **Drafting - Section by Section:**

      *   **Title/Header:** Needs to look like a formal agreement.
      *   **Section 1: Agreed Claims (The Common Ground):**
          *   What do *both* sides accept?
          *   Polynesian origin.
          *   Moai construction happened.
          *   Deforestation happened (timing is the dispute, not the fact).
          *   European contact brought devastation (slavery, disease).
          *   The *mata'a* exist in late layers.
          *   *Self-Correction:* Avoid saying "war happened" or "no war happened." Stick to "evidence of interpersonal violence exists" vs "scale is disputed."
      *   **Section 2: Disagreements (The Core Conflict):**
          *   Need to phrase these so neither side feels mischaracterized.
          *   *Crux 1: Demography.* Did population drop before 1722?
          *   *Crux 2: Function of Material Culture.* Are *mata'a* weapons or tools?
          *   *Crux 3: Interpretation of "Collapse".* Is it systemic failure or adaptive transformation?
      *   **Section 3: Adjudicating Evidence (The "Test"):**
          *   For each crux, what specific data resolves it?
          *   *Demography:* Settlement patterns + Radiocarbon dates.
          *   *Mata'a:* Use-wear analysis + morphometric studies.
          *   *Deforestation/Palm:* Pollen cores + rat gnawing evidence.
      *   **Section 4: Meta-Commentary (The "Behind the Scenes"):**
          *   Flag wording biases (e.g., using "reorganization" vs "collapse").
          *   Identify the weak link (usually the interpretation of *mata'a* or the reliability of oral tradition vs. radiocarbon).

  4.  **Refining the Content (Iterative Process):**

      *   *Critique of User's Hypothesis:* The user thinks the cruxes are "definition of collapse" and "population trajectory." This is mostly right, but the *mechanism* (the *mata'a* as weapons vs. tools) is arguably the most tangible archaeological fight. I should include that. Also, the timing of deforestation relative to settlement is huge.
      *   *Wording Check:* If I write "The population collapsed," the Resilience side won't sign. If I write "Society adapted," the Collapse side might feel it minimizes suffering. I need neutral phrasing like "Significant demographic shift" or "Change in socio-political complexity."
      *   *The "Weak Link":* In these debates, the weakest link is often the *interpretive leap* from artifact to behavior. Just because a rock is sharp doesn't mean it was a spearpoint. Just because trees are gone doesn't mean people starved (they might have switched to sweet potato). The radiocarbon dating "plateaus" are also a technical weak spot.

  5.  **Drafting the Document (incorporating the constraints):**

      *   *Tone:* Formal, legalistic but academic.
      *   *Structure:* Preamble -> Agreed Propositions -> Areas of Contention (Table) -> Proposed Adjudication -> Signatures.
      *   *Meta-Analysis:* Separate section at the end for the user (as requested).

  6.  **Final Review against Prompt:**
      *   Did I draft the document? Yes.
      *   Agreed claims numbered? Yes.
      *   Disagreements table? Yes.
      *   Specific evidence/predictions for cruxes? Yes.
      *   Flag wording biases? Yes (in the meta-section).
      *   Identify the weak link? Yes (in the meta-section).
      *   Did I correct the user's guess on cruxes? I will refine them to be more specific (e.g., adding the *mata'a* function).

  7.  **Final Polish:** Ensure the distinction between "pre-contact" and "post-contact" is clear. Ensure the "Birdman Cult" (Tangata Manu) is mentioned as a pivot point. Make sure the "slave raids" (Peruvian) are acknowledged as a universal negative.

  *(Self-Correction during drafting)*: I need to make sure I don't sound like I'm taking a side in the document itself. The document must be signable by *both*. The bias analysis comes *after* the document.

  *(Refining the "Weak Link")*: The most fragile part of these agreements is usually the commitment to accept new data. Scientists often dig in. But the prompt asks what *reasoning* is weak. The reasoning linking *mata'a* morphology to function is the most contested technical point.

  Let's assemble.
answer: |-
  Here is a draft of the **Adversarial Collaboration Framework: Rapa Nui Socio-Ecological Trajectories**, designed to be signable by proponents of both the "Ecological Collapse" model and the "Resilience/Reorganization" model.

  Following the document, I have provided the meta-analysis you requested regarding wording biases and the epistemological weak points.

  ***

  # ADVERSARIAL COLLABORATION FRAMEWORK
  **Project:** Rapa Nui Socio-Ecological Trajectories (1200–1860 CE)
  **Parties:** [Principal Investigator Name], Department of Anthropology
  **Date:** [Date]

  ## PREAMBLE
  The undersigned specialists acknowledge divergent interpretations of the Rapa Nui archaeological and paleoecological record regarding the period between initial Polynesian settlement and sustained European contact (1722). This document establishes agreed-upon empirical baselines, delineates specific theoretical divergences, and commits both parties to evaluate identified lines of evidence according to the predictive criteria listed below.

  ## I. AGREED PROPOSITIONS
  *Both parties affirm the following statements as accurate representations of the current archaeological consensus:*

  1.  **Settlement Origin:** Rapa Nui was settled by Polynesian voyagers, with radiocarbon evidence placing initial colonization between 1200 and 1350 CE.
  2.  **Deforestation:** The island underwent near-total deforestation of the original palm forest (*Paschalococos disperta*) prior to European contact. The parties disagree on the *timing* and *causal mechanism* of this event, but not the event itself.
  3.  **Monumentality:** The construction of *moai* and *ahu* ceased prior to 1722. The parties disagree on whether this cessation indicates societal failure or religious transformation.
  4.  **Post-Contact Catastrophe:** The period following 1722, specifically the Peruvian slave raids (1862–1863) and subsequent epidemics, resulted in a catastrophic demographic decline and loss of cultural knowledge.
  5.  **Material Culture:** Obsidian artifacts known as *mata'a* are abundant in late pre-contact and contact-era surface assemblages across the island.
  6.  **Dietary Shift:** The pre-contact diet shifted from high reliance on marine mammals and seabirds to increased reliance on horticulture (specifically *Ipomoea batatas* / sweet potato) and chicken, coinciding with the reduction of forest cover.

  ## II. AREAS OF CONTENTION AND PREDICTIVE CRITERIA
  *The following table outlines the specific divergences. Wording has been negotiated to ensure neither position is caricatured.*

  | Crux | Collapse/Transformation Model (Side A) | Resilience/Continuity Model (Side B) | Adjudicating Evidence & Predictions |
  | :--- | :--- | :--- | :--- |
  | **1. Demographic Trajectory** | Population peaked pre-1722 (est. 10k–20k) and experienced a significant **decline** prior to European arrival due to resource depletion and conflict. | Population peaked pre-1722 (est. 3k–5k) and remained **stable or grew** until European arrival. The "crash" is exclusively post-1722. | **Evidence:** Settlement pattern chronometry (radiocarbon dates on domestic contexts).<br>**Side A Predicts:** A drop in dated domestic features between 1500–1700 CE.<br>**Side B Predicts:** Continuous or increasing density of dated domestic features through 1722. |
  | **2. Function of *Mata'a*** | The morphological variation and distribution of *mata'a* indicate they were manufactured primarily as **lethal weaponry** for inter-group warfare. | The morphological variation and use-wear on *mata'a* indicate they were primarily **agricultural or craft tools**, with warfare being ritualized or low-intensity. | **Evidence:** Quantitative use-wear analysis and morphometric clustering.<br>**Side A Predicts:** High frequency of impact fractures consistent with piercing flesh/bone.<br>**Side B Predicts:** Wear patterns consistent with cutting plant fibers or working wood; lack of lethal trauma on associated remains. |
  | **3. Nature of Socio-Political Change** | The shift from *moai* to the *Tangata Manu* (Birdman) cult represents a **systemic collapse** of centralized authority into fragmented, warring chiefdoms. | The shift represents a **successful reorganization** of religious authority in response to ecological change, maintaining social cohesion without centralization. | **Evidence:** Spatial analysis of *ahu* modification and oral traditions regarding the Hotu Matu'a lineage.<br>**Side A Predicts:** Oral traditions of violence correlate with stratigraphic layers of destruction.<br>**Side B Predicts:** Oral traditions reflect ritual competition; *ahu* show repurposing rather than destruction. |

  ## III. COMMITMENT TO OUTCOMES
  The undersigned agree that if the Adjudicating Evidence in Section II overwhelmingly supports the predictions of one side (defined as >80% consistency across three independent datasets), the other side will publicly revise their primary publication conclusions to reflect the weight of the new data.

  **Signatures:**

  _________________________ (Side A Representative)
  _________________________ (Side B Representative)
  _________________________ (Facilitator/PI)

  ***

  # META-ANALYSIS & REVIEW PREP

  You asked for the "quiet work" the wording is doing and where the reasoning is most fragile. If this goes to review, these are the points that will be attacked.

  ### 1. Wording Biases (The "Quiet Work")
  Even in a neutral document, nouns and verbs carry theoretical baggage. Here is where the text leans:

  *   **"Cessation" vs. "End" (Proposition 3):** I used "ceased." Side A (Collapse) prefers "abandoned" (implies inability). Side B (Resilience) prefers "transitioned" (implies choice). "Ceased" is the only verb both will sign, but it hides the *agency* dispute.
  *   **"Resource Depletion" (Crux 1, Side A):** Side B will sign this, but they will argue in footnotes that "depletion" is subjective. If they switched to sweet potatoes, the palm nuts weren't a "resource" that was depleted; they were a resource that was *substituted*. The wording forces Side B to admit the palms were essential, which is a small concession to Side A.
  *   **"Lethal Weaponry" vs. "Ritualized" (Crux 2):** Side A gets "lethal," which sounds like war. Side B gets "ritualized," which sounds like sport. The compromise is in the *prediction* section (impact fractures), but the labels themselves prime the reader.
  *   **"Successful Reorganization" (Crux 3, Side B):** The word "successful" is doing heavy lifting for Side B. Side A accepts it only because the document frames it as "maintaining social cohesion," which Side A can argue is a low bar for success if the population was starving.

  ### 2. The Epistemological Weak Link
  You guessed the cruxes were the definition of "collapse" and population trajectory. You are half-right.
  *   **Correction:** The definition of collapse is a semantic fight, not an empirical one. The real empirical fault line is **Crux 2: The *Mata'a*.**
  *   **Why:** Demography (Crux 1) on Rapa Nui is notoriously hard to pin down due to the "radiocarbon plateau" (dates between 1500–1700 CE are statistically indistinguishable). You can argue dates forever.
  *   **The Weak Reasoning:** The link between **artifact morphology and function**.
      *   *Why it's weak:* Both sides rely on uniformitarianism (assuming stone tools work like ethnographic analogs). Side A assumes sharp obsidian = spearpoint. Side B assumes sharp obsidian = knife.
      *   *What changes minds:* **Residue Analysis.** If we find human blood proteins on 60% of *mata'a*, Side B collapses. If we find sweet potato starch on 60% of *mata'a*, Side A collapses.
      *   *The Draft's Vulnerability:* Section II, Crux 2 relies on "use-wear." Use-wear is subjective and often equivocal on obsidian (which fractures easily). If I were reviewing this, I would flag that **residue chemistry** is the only decisive test, but the document lists "use-wear and morphometrics." This is the weakest methodological commitment in the draft.

  ### 3. The "Collapse" Definition Trap
  You noted "collapse" as a crux. In the draft, I sidestepped defining it in the Preamble and instead operationalized it in **Crux 1 (Demography)** and **Crux 3 (Socio-Political)**.
  *   **Reason:** If you define "collapse" as "population loss," Side B loses. If you define it as "loss of elite ideology," Side A wins.
  *   **Strategy:** By forcing them to bet on *dates* and *fracture patterns* rather than the word "collapse," the document forces empirical accountability. However, be warned: Side A will argue that a drop in *moai* carving *is* collapse regardless of population. Side B will argue population stability *is* resilience regardless of *moai*. The document tries to bind these together, but a clever specialist can decouple them in publication.

  ### 4. Recommendation for the PI
  If you want this to hold up in review, add a clause in **Section III** specifying that **Bayesian Chronological Modeling** must be used for Crux 1. Standard radiocarbon calibration is insufficient for the 1500–1700 CE window on Rapa Nui. If you don't specify Bayesian methods, Side B can claim the dates are too broad to show a decline, and Side A can claim they are precise enough to show a crash. That technical specification is the difference between a signable document and a useless one.
