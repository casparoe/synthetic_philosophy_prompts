answer: |-
  Here is the principle that organizes your log, followed by the one verdict you should reconsider.

  ### The Principle of Domain-Relative Uptake

  **An utterance accomplishes the act it names if and only if the authority governing the *consequences* of that act recognizes the change in status as valid.**

  This principle divides your rulings into three domains, each with a specific test for validity.

  **1. The Institutional Domain (External Consequences)**
  *   **Rule:** Validity is determined by procedural compliance and credentials, regardless of intent or community belief.
  *   **Why:** The consequences (legal status, employment records) are enforced by an authority outside the community.
  *   **Cases:**
      *   *Marriage:* Ruled **Void**. The state (external authority) requires valid credentials; community belief cannot override law.
      *   *Resignation:* Ruled **Void**. Employment norms (external/contractual authority) require receipt and processing; intent to quit is insufficient without procedural completion.
      *   *Defendant Plea:* Ruled **Valid**. The legal system (external authority) recognizes plea bargains as valid consent despite coercion.
      *   *Manager Threat:* Ruled **Threat (Invalid Warning)**. The manager lacked the institutional authority to enact the consequence ("write you up"), making the utterance a bluff rather than a procedural warning.

  **2. The Communal Domain (Internal Consequences)**
  *   **Rule:** Validity is determined by **uptake** (reasonable reliance or acceptance by the community), which can override procedural informalities.
  *   **Why:** The consequences (trust, social standing, group resources) are enforced by the community itself.
  *   **Cases:**
      *   *Baptism:* Ruled **Valid**. Though the priest's credentials lapsed (procedural failure), the congregation (the relevant authority for spiritual status) accepted the act. Uptake cured the defect.
      *   *Bets (Chat & Handshake):* Ruled **Valid**. No formal stake or handshake was required; mutual uptake ("I'm on") created the binding obligation.
      *   *Move Promise:* Ruled **Binding**. Despite being half-distracted, the listener reasonably relied on the utterance. Uptake creates the bond.
      *   *Joke (Firstborn):* Ruled **Not a Promise**. Context signaled no reasonable reliance was intended; uptake was withheld by the nature of the speech.
      *   *Stranger Warning:* Ruled **Valid Warning**. The truth of the ice (fact) entitles reliance, regardless of the stranger's malicious intent. The consequence (safety) is universal.

  **3. The Expressive Domain (Interpersonal Consequences)**
  *   **Rule:** Validity requires **sincerity conditions** (acknowledgment of harm + intent to repair) met sufficiently to satisfy the recipient.
  *   **Why:** The consequence is emotional repair; without sincerity, the act cannot function.
  *   **Cases:**
      *   *Apology ("Feel that way"):* Ruled **Not an Apology**. Fails to acknowledge the specific wrong; sincerity condition unmet.
      *   *Apology (Contempt):* Ruled **Not an Apology**. Words were present, but the contempt negated the intent to repair; the recipient cannot reasonably accept it as repair.
      *   *Forgiveness (Empty Room):* Ruled **Real Utterance**. The speaker changed their own internal status; valid for the self, though it produced no social consequence.
      *   *Self-Promise:* Ruled **Binding**. The speaker is both authority and subject; integrity is the consequence.

  ***

  ### Application to Unlisted Cases

  *   **A toast raised to absent friends:** **Valid.** (Communal Domain). The act is symbolic; the community's participation (raising glasses) constitutes uptake. It does not require the friends' presence to succeed as a toast.
  *   **An "I take responsibility" issued in a press statement:** **Valid.** (Institutional/Communal Hybrid). If the statement is accepted by the public/stakeholders (uptake), the status of "responsible party" is assigned, regardless of internal legal strategy.
  *   **An oath sworn on a book the swearer does not believe in:** **Valid.** (Institutional Domain). The authority (court/office) cares about the procedural act of swearing, not the internal theology. Perjury laws bind the speaker regardless of belief.
  *   **A house rule waived in a group chat that nobody reads:** **Invalid.** (Communal Domain). Without uptake (reading/acknowledgment), the community cannot rely on the waiver. A rule change requires notification to be effective.

  ***

  ### The Verdict to Sacrifice

  You have a contradiction between the **Boat** and the **Baptism**.
  *   **Baptism:** Lapsed credentials + Community Acceptance = **Valid**.
  *   **Boat:** Designated member bypassed + Community Witness = **Invalid (Unnamed)**.

  Both are internal, ceremonial acts where the community is the ultimate authority. In the Baptism, you allowed **Community Uptake** to cure a **Procedural Defect** (lapsed priest). In the Boat naming, you allowed **Procedural Protocol** (designated member) to override **Community Uptake** (witnessing the act).

  **You should give up the Boat verdict.**

  **The Cheaper Loss:**
  Rule that the **Boat was Named**.
  A boat's name carries no legal weight and minimal spiritual weight compared to a baptism. By ruling the boat unnamed, you privilege bureaucratic protocol over the lived reality of the community's witness. By ruling it named, you align the Boat with the Baptism: **In internal community matters, what the community accepts is real, even if the paperwork is wrong.**

  This preserves the Marriage verdict (External Law overrides Community) while solidifying the Community's sovereignty over its own rituals. It simplifies your principle to: *External rules bind the community; internal uptake binds the members.* The boat is an internal matter; therefore, uptake should have won.
