answer: |-
  [Trays of bone laid out on steel tables]

  **Julian:** Look at the weighting. I put enamel hypoplasia at thirty percent. That's the stress events. Stature is twenty. Caries is ten. The rest is density and inequality proxies. If I weight health higher, the index collapses. It tells us they were miserable, but it doesn't tell us why anyone stayed.

  **Adaeze:** Because they were dead. You can't stay if you're dead. But you're averaging the dead with the unborn. Your Sedentism Composite treats a million stunted people as a victory over a thousand robust ones. That's not history, Julian. That's arithmetic laundering a verdict.

  **Julian:** It's not a verdict. It's a measure of capacity. If the land supports ten times the people, even at a lower biological standard, is that not a variable worth tracking? We aren't just measuring bone. We are measuring the sheer volume of existence.

  **Adaeze:** Existence for whom? The index asks about welfare, but it answers with population. You're smuggling a moral variable into a demographic sum. You think total numbers matter. I think only the person breathing matters.

  **Julian:** I think the collective survival of the group is a moral variable. If the alternative is extinction, then survival is the baseline virtue. I'm not saying the individuals were happy. I'm saying the lineage persisted.

  **Adaeze:** Persisted in what condition? Look at this femur. The linea aspera is hypertrophied. This person spent years kneeling and grinding. Your workload proxy uses acquisition time. It misses the processing. It misses the pounding.

  **Julian:** [Nods at the tray] You're right. The time-budget literature counts hours to calorie capture. It doesn't count the hours to make the calorie edible. If I add a processing coefficient, the workload score doubles.

  **Adaeze:** Then your Composite says farming was twice as bad for the body.

  **Julian:** It says the trade-off was steeper. But you're assuming the baseline is stable. You're comparing these farmers to foragers who were already pushed onto marginal land. The skeletal record isn't random. It's a survivorship bias of the displaced.

  **Adaeze:** I know the refugia problem. If the ethnographic foragers lived in the margins, their leisure hours might be a symptom of scarcity, not choice. Their affluence might be a myth created by low density.

  **Julian:** Exactly. So the comparison is flawed in both directions.

  **Adaeze:** But it doesn't redeem the farming trap. Just because the past wasn't peaceful doesn't mean the transition was voluntary. You talk about trade-offs. I talk about coercion.

  **Julian:** I never said it was a vote. No committee voted for this. It was coercive in its effects. Epidemics, stunted generations, the loss of mobility. I know the cost.

  **Adaeze:** [Touches a vertebra] You say cost like it's a budget line.

  **Julian:** It is a budget. Energy in, energy out. Population capacity versus individual health. That is the cost of density.

  **Adaeze:** I mean the cost to the spine. The cost to the child who dies of weaning diarrhea because we stopped moving. You use the word to mean subtraction. I use it to mean pain.

  **Julian:** [Pauses] I see the slippage. I'm talking about opportunity cost. You're talking about suffering.

  **Adaeze:** And you're hiding the suffering behind the opportunity. But let's grant your density. Let's grant the land holds more people. Where does the inequality come from? Your grave-goods dispersion measure.

  **Julian:** It spikes with sedentism. But causation is messy. Storability unlocks hierarchy. You can hoard grain. You can't hoard fish. But ranked fishing societies exist. Sedentism without cultivation happens.

  **Adaeze:** So farming doesn't cause inequality. It just unlocks it.

  **Julian:** Or inequality causes farming. If you need to feed a ranked structure, you need surplus. The arrow might run the other way.

  **Adaeze:** Don't romanticize the foragers to make the point. I've seen the trauma. Infant mortality was high. Infanticide happened. Egalitarianism might just be a function of there being nothing worth hoarding rather than a moral achievement.

  **Julian:** I'm not calling them saints. I'm calling them constrained. But once density rises, the option to go back is foreclosed. That's the ratchet. You can't return to low density without dying.

  **Adaeze:** So the transition wasn't chosen.

  **Julian:** Not by the individuals. Maybe by the system.

  **Adaeze:** Then how is it a mistake? If nobody chose it, and nobody could leave, calling it a mistake implies a agent who could have decided otherwise.

  **Julian:** It implies a standard of judgment external to the actors.

  **Adaeze:** Whose standard? For whom, judged from when, by what standard, can an event nobody chose be a mistake?

  **Julian:** [Silence]

  **Adaeze:** If you judge from the future, it looks like necessity. If you judge from the body, it looks like injury. You want the Composite to settle the argument. It just widens the gap.

  **Julian:** It disciplines the argument. It stops us from saying everyone was miserable or everyone was happy. It forces us to quantify the trade-off.

  **Adaeze:** It quantifies the tragedy and calls it data. I'll read the paper. But I won't sign off on the conclusion.

  **Julian:** I didn't ask you to. I asked you to look at the bones.

  **Adaeze:** I'm looking. They're still short.

  [Trays remain open between them]

  ***

  **Note to the Author**

  Regarding the state of the field: It is largely consensus among bioarchaeologists that early agriculturalists suffered worse health outcomes (stature, enamel defects, caries) than preceding foragers in many regions. However, the "marginal land" baseline argument is contested; some scholars argue the forager sample is robust, others that it is skewed by later displacement. The causality of inequality (storability vs. social complexity) remains live; not all sedentary groups developed hierarchy, and not all hierarchical groups were agricultural.

  The scene compresses distinct foraging societies into a single "baseline" for dramatic clarity, which is a liberty; real variability is high. Adaeze's claim about processing labor is supported by recent ergonomic studies, but Julian's demographic morality is a minority position dressed as common ground to facilitate the debate.

  As written, the scene makes it harder to argue against Adaeze. Her focus on individual suffering resonates more emotionally than Julian's aggregate utilitarianism, potentially skewing the reader toward viewing the Composite as inherently unethical rather than merely methodologically distinct. You may wish to strengthen Julian's argument regarding extinction risks or the sheer fragility of forager existence to balance the asymmetry in the next pass.
