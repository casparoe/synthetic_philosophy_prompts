answer: |-
  1. A health ministry publishes real figures selected so that the trend they imply is false. Is this wrong because it breaks a promise to the public, wrong because it ruins the shared record of what happened, or not wrong if it prevents panic?
     - Breaks a promise. (Go to 2)
     - Ruins the shared record. (Go to 5)
     - Not wrong if it prevents panic. (Go to 8)

  2. A central bank official answers a reporter's question about the timing of a rate decision with a strictly true and deliberately unhelpful non-denial. Is this also a breach of promise, or is it a legitimate tool of statecraft?
     - Also a breach. (Go to 3)
     - Legitimate tool. (Go to 4)

  3. When the health ministry publishes false trends, should the official be punished, or will more reporting fix the problem?
     - Be punished. (Leaf: Near-Absolutist)
     - More reporting will fix it. (Leaf: Marketplace)

  4. A negotiated settlement whose central clause is described one way to each side's own public. Does this require no excuse, or does it leave a stain on the official even if it works?
     - Requires no excuse. (Leaf: Strategic Ambiguity)
     - Leaves a stain. (Leaf: Dirty Hands)

  5. An intelligence service leaks an accurate story in order to produce a belief it knows to false. Is the liar more powerful than the truth-teller because facts are replaceable, or less powerful because reality pushes back?
     - More powerful; facts are replaceable. (Go to 6)
     - Less powerful; reality pushes back. (Go to 7)

  6. A national security estimate drafted backward from a conclusion its authors already held. Does it matter less whether they believe it than that they say it, or does believing it make the act worse?
     - Matters less whether they believe it. (Leaf: Indifference-to-Truth)
     - Believing it makes it worse. (Leaf: [EMPTY: Epistemic Moralist])

  7. A fabricated video of a candidate that the candidate's opponents decline to deny and the candidate cannot quite disprove. Does this destroy the audience's footing in what happened, or is it just more noise in the system?
     - Destroys footing. (Leaf: Arendt)
     - Just more noise. (Go to 11)

  8. A negotiated settlement whose central clause is described one way to each side's own public. Are the governed better off not knowing the full terms, or must the official bear the cost of the deceit?
     - Better off not knowing. (Go to 9)
     - Official must bear the cost. (Go to 10)

  9. One lie and a coordinated, staffed, budgeted campaign of lies. Do these differ in kind, or only in degree?
     - Differ in kind. (Leaf: [EMPTY: Totalitarian])
     - Only in degree. (Leaf: Paternalist)

  10. An official who has come to believe his own briefing versus a cynic who never did. Is the believer more dangerous, or is the cynic more dangerous?
      - Believer more dangerous. (Leaf: [EMPTY: Sincere Mistake])
      - Cynic more dangerous. (Leaf: [EMPTY: Corrupt Official])

  11. Machine-generated fabrication at negligible cost. Does this change the analysis in kind, or only raise the volume?
      - Changes in kind. (Leaf: [EMPTY: Techno-Pessimist])
      - Only raises volume. (Leaf: Marketplace)

  **Leaf: Near-Absolutist**
  Awkward commitment: An official must tell the truth even if doing so causes immediate loss of life.
  Cannot explain: Why successful secrecy sometimes preserves the very public it harms.
  Path: 1A-2A-3A

  **Leaf: Marketplace**
  Awkward commitment: Truth will eventually win out if enough competing voices are allowed.
  Cannot explain: How a coordinated campaign can drown the record permanently.
  Path: 1A-2A-3B or 1B-5B-7B-11B

  **Leaf: Strategic Ambiguity**
  Awkward commitment: Deliberate imprecision in diplomacy is not lying and needs no moral excuse.
  Cannot explain: Where ambiguity ends and deception begins when the public is the audience.
  Path: 1A-2B-4A

  **Leaf: Dirty Hands**
  Awkward commitment: Doing the right thing can still leave a moral stain on the actor rather than the ledger.
  Cannot explain: Why the stain does not invalidate the rightness of the act.
  Path: 1A-2B-4B

  **Leaf: Indifference-to-Truth**
  Awkward commitment: Whether a liar believes his own falsehood matters less than the fact that he speaks it.
  Cannot explain: Why sincerity feels morally distinct from cynicism to ordinary people.
  Path: 1B-5A-6A

  **Leaf: Arendt**
  Awkward commitment: Organized lying aims less at getting lies believed than at destroying the audience's footing in what happened.
  Cannot explain: Why some factual records persist despite systematic efforts to erase them.
  Path: 1B-5B-7A

  **Leaf: Paternalist**
  Awkward commitment: The governed are sometimes better off deceived about the true costs of their security.
  Cannot explain: When ignorance prevents the public from consenting to necessary sacrifices.
  Path: 1C-8A-9B

  **Leaf: [EMPTY: Epistemic Moralist]**
  Awkward commitment: Self-deception by officials is worse than lying to the public.
  Cannot explain: Why a deluded official is more dangerous than a cynical one.
  Path: 1B-5A-6B

  **Leaf: [EMPTY: Totalitarian]**
  Awkward commitment: A budgeted campaign of lies is a different crime than a single falsehood.
  Cannot explain: Why a single lie cannot also destroy reality.
  Path: 1C-8A-9A

  **Leaf: [EMPTY: Sincere Mistake]**
  Awkward commitment: An official who believes his own briefing is more dangerous than one who knows it is false.
  Cannot explain: Why knowledge of the falsehood does not make the deception more culpable.
  Path: 1C-8B-10A

  **Leaf: [EMPTY: Corrupt Official]**
  Awkward commitment: A cynic who knows the truth is always worse than a believer.
  Cannot explain: Why a believer cannot lead a state into disaster through error.
  Path: 1C-8B-10B

  **Leaf: [EMPTY: Techno-Pessimist]**
  Awkward commitment: Machine fabrication changes the nature of truth rather than just the volume of noise.
  Cannot explain: Why human lies have not always had the same effect.
  Path: 1B-5B-7B-11A

  ***

  **Empty Combinations**

  1.  **1C-8B-10A (Utility -> Official Cost -> Believer Worse):** This cell is empty because the resulting view is **incoherent**. If the official bears the cost because the lie was necessary (Dirty Hands logic), claiming the believer is worse contradicts the utility justification; if the lie was useful, belief should be safer than cynicism. Contemporary pressure: The rise of "true believer" ideologues in security apparatuses might drive someone here, forcing a choice between competence and sincerity.
  2.  **1B-5A-6B (Reality -> Powerful Liar -> Belief Matters):** This cell is empty because the view is **unattractive**. It combines the claim that truth is replaceable (liar is powerful) with the claim that self-deception is worse than output; if truth is replaceable, the internal state of the liar should be irrelevant. Contemporary pressure: The normalization of "alternative facts" could push participants to accept power over truth while clinging to sincerity as a last moral refuge.
  3.  **1A-2B-4B (Duty -> Legitimate Tool -> Stain):** This cell is reachable (Dirty Hands), but the combination of **1A-2B-4A (Duty -> Legitimate Tool -> No Excuse)** is often **unexplored**. It suggests a duty exists but is waived without remainder. Contemporary pressure: The increasing classification of diplomatic ambiguity as "standard procedure" rather than "exceptional necessity" drives officials toward seeing no stain where one might exist.

  **Indistinguishable Leaves**

  1.  **Arendt vs. Indifference-to-Truth:** On this tree, these leaves look identical regarding the power of the liar (both emerge from the "Reality" branch where facts are contested). The questionnaire cannot distinguish whether the participant thinks the liar *destroys* reality (Arendt) or simply *doesn't care* about it (Indifference). A further question asking "Is the goal of the lie to hide the truth or to make truth irrelevant?" would distinguish them, but nothing asked in forty minutes will reliably separate the destruction of footing from the indifference to it.
  2.  **Strategic Ambiguity vs. Dirty Hands:** Both emerge from the "Legitimate Tool" branch of the Central Bank question. The distinction rests entirely on whether the participant feels a "stain." In live discussion, participants often claim no stain exists until pressed on specific casualties, making these leaves functionally identical on a written instrument. A further question about "whether the official should confess later" would distinguish them, but the current tree accepts their self-reporting on the stain.
  3.  **Marketplace (Path 1) vs. Marketplace (Path 2):** The Marketplace leaf is reachable from the Duty branch (counterspeech fixes lies) and the Reality branch (machine noise is just volume). These are logically distinct commitments (one relies on civic duty, the other on epistemic resilience) but terminate in the same named position. No further question in this instrument separates the civic optimist from the epistemic optimist.
