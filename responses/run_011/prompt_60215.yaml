answer: |-
  # The Promissory Obligation Diagnostic

  ## Part 1: The Six Scenarios
  *Read each case aloud. Ask members to choose the option that matches their gut reaction. Tell them there are no right answers, only consistent ones. Do not reveal what theory each option represents until the end.*

  **1. The Deathbed Secret**
  You promise a dying friend to burn their private letters. They die. You are the only living person who knows the promise exists. If you burn the letters, nothing changes for anyone. If you publish them, no one will ever know you broke your word, and it might even make you famous.
  *   **A:** You are free to publish them. The obligation was about their feelings, and they're gone.
  *   **B:** You must burn them. You gave your word, and that binds you regardless of who knows.

  **2. The Coerced Vow**
  Someone holds leverage over you (they know a secret that would ruin you) and says, "Promise to pay me $500 or I tell everyone." You promise to save your reputation. Later, you regret it.
  *   **A:** The promise is void. You didn't really agree; you were forced.
  *   **B:** The promise stands. You said the words to get what you wanted (safety), so you owe the money.

  **3. The Solo Pledge**
  You wake up and solemnly tell yourself, "I promise I will stop eating sugar for a month." No one else hears this. Two days later, you eat a cookie.
  *   **A:** You broke a promise. You obligated yourself.
  *   **B:** You just failed a goal. You can't promise things to yourself; there's no one to hold you to it.

  **4. The Traffic Jam**
  You promise to meet a friend at the airport at 6:00 PM. At 5:30, your car engine explodes through no fault of your own. You cannot get there.
  *   **A:** You broke the promise. You owe them an apology and makeup, even if it wasn't your fault.
  *   **B:** You didn't break the promise. You couldn't help it, so you're in the clear.

  **5. The Dangerous Secret**
  You promise a friend to keep a secret. Later, you realize that keeping this secret will allow something genuinely bad to happen to an innocent third party.
  *   **A:** Tell the secret. Preventing harm is more important than the promise.
  *   **B:** Keep the secret. You made a commitment, and you can't undo it just because things got difficult.

  **6. The Liar's Oath**
  A person known by everyone to be a pathological liar makes a solemn, formal promise to you. They have no history of keeping their word.
  *   **A:** It binds them. The act of promising creates the duty, regardless of their character.
  *   **B:** It doesn't bind them. Only someone with the standing to commit can make a promise.
  *   **C:** Nothing binds anyone in any of these cases; "promise" is just a word people use to sound serious.

  ***

  ## Part 2: The Leaves (Theoretical Positions)
  *Map the answer patterns below to these positions. Give the members their label based on their score.*

  **1. The Consequentialist (The Disappointment View)**
  *   **Core Idea:** Promises bind only because breaking them causes harm (disappointment, loss of trust).
  *   **Typical Pattern:** 1A, 2A, 3B, 4B, 5A, 6A.
  *   **Awkward Commitment:** If you can break a promise secretly with zero negative consequences, you are morally required to do so.

  **2. The Volitionalist (The Self-Created Obligation)**
  *   **Core Idea:** The act of willing the obligation is what creates it; you are the legislator of your own duty.
  *   **Typical Pattern:** 1B, 2A, 3A, 4A, 5B, 6A.
  *   **Awkward Commitment:** You can obligate yourself to do things that are impossible or morally wrong, simply by willing it.

  **3. The Conventionalist (The Social Practice)**
  *   **Core Idea:** Promising is like a game (like chess); the rules exist only because we all agree to play by them.
  *   **Typical Pattern:** 1B, 2A, 3B, 4B, 5A, 6A.
  *   **Awkward Commitment:** If a society never developed the institution of promising, its members would be physically incapable of making promises.

  **4. The Second-Personalist (The Rights View)**
  *   **Core Idea:** A promise gives the other person a specific right to command your action; you owe *them*, not just the universe.
  *   **Typical Pattern:** 1B, 2A, 3B, 4A, 5A, 6A.
  *   **Awkward Commitment:** The person you promised cannot release you from the obligation unless they explicitly choose to do so.

  **5. The Deflationary Skeptic (The "No Special Obligation" View)**
  *   **Core Idea:** There is no distinct "promissory" obligation; it's just a strong statement of intent or a threat.
  *   **Typical Pattern:** 1A, 2A, 3B, 4B, 5A, 6C.
  *   **Awkward Commitment:** Saying "I promise" adds no moral weight whatsoever to saying "I intend to."

  **6. The Sovereign Individual (The Status View)**
  *   **Core Idea:** Only a person with mastery over their own future (a "sovereign") has the prerogative to promise; most people are just reacting.
  *   **Typical Pattern:** 1B, 2A, 3B, 4A, 5B, 6B.
  *   **Awkward Commitment:** The majority of human beings are literally incapable of making a binding promise due to lack of self-mastery.

  ***

  ## Part 3: The Empty Spaces (Impossible/Unattractive Combinations)
  *These are answer combinations that do not correspond to a coherent philosophical position.*

  **1. The "Private Will, Public Nothing" Gap**
  *   **Combination:** 1A (Free on Deathbed) + 3A (Bound on Self-Promise).
  *   **Verdict:** **Incoherent.**
  *   **Why:** If the binding force comes from the internal will (enough to bind you to yourself), it should survive the death of the listener. If the death of the listener dissolves the bond, the binding force must be external (social/harm), which means a private self-promise shouldn't work. You can't have it both ways.

  **2. The "Absolute Secret, Utilitarian Harm" Gap**
  *   **Combination:** 5B (Keep Dangerous Secret) + 1A (Break Deathbed Promise).
  *   **Verdict:** **Unattractive / Neglected.**
  *   **Why:** This view holds that promises are absolute when they are useless (dead listener) but overrideable when they are dangerous (harm to third party). While logically possible (Threshold Deontology), no major theory argues that secrecy *increases* obligation while harm *decreases* it. Usually, if harm overrides, secrecy does too.

  **3. The "Coerced but Real" Gap**
  *   **Combination:** 2B (Coerced Promise Stands) + 6B (Liar's Promise Fails).
  *   **Verdict:** **Neglected.**
  *   **Why:** This suggests the *content* of the will doesn't matter (coercion is fine) but the *character* of the willer does (liars can't promise). Most theories either focus on the act (Coercion voids it) or the rule (Character doesn't matter). Mixing them is theoretically messy and无人 defends it.

  ***

  ## Part 4: The Collapsed Leaves (Indistinguishable Positions)
  *Be honest with the club: This quiz cannot perfectly separate every theory using only cases.*

  **The Conventionalist vs. The Second-Personalist**
  *   **The Problem:** On almost every concrete case (Deathbed, Coercion, Harm, Liar), the Social Practice view and the Rights view give the exact same answer. Both say the promise binds in 1, is void in 2, isn't real in 3, and is overridable in 5.
  *   **Why:** One says "The rules of the game say X," the other says "The rights transfer says X." The outcomes match.
  *   **The Separator Case:** To pry them apart, you need a **Third-Party Beneficiary** case.
      *   *Scenario:* I promise *you* that I will pay *him*. Who can release me from the promise?
      *   *Rights View:* Only *you* (the promisee) can release me, because you hold the right.
      *   *Convention View:* It depends on the social rules; sometimes *he* (the beneficiary) might have the standing to release me if the practice allows it.
      *   *Action:* If your club splits on this, the Conventionalist says "It depends on the rules," the Second-Personalist says "It's strictly up to the person I spoke to."

  ***

  ## Part 5: Scoring Key & Tiebreak Rules

  **Step 1: Tally the "Binding" Score**
  Assign 1 point for every "Binding/Strict" answer (1B, 2B, 3A, 4A, 5B, 6A/B).
  Assign 0 points for every "Free/Void" answer (1A, 2A, 3B, 4B, 5A, 6C).
  *   *Note: For Q6, A and B are both "Binding" variants, C is "Deflationary".*

  **Step 2: Determine the Primary Cluster**
  *   **0-1 Points:** **Deflationary Skeptic.** (You think promises are mostly noise).
  *   **2-3 Points:** **Consequentialist.** (You think promises bind only when it matters).
  *   **4-5 Points:** **Conventionalist / Second-Personalist.** (You think promises generally bind, but allow for exceptions).
  *   **6 Points:** **Volitionalist / Sovereign.** (You think the will is absolute).

  **Step 3: Tiebreak Rules (For the 4-5 Point Cluster)**
  *If a member lands in the middle (Conventionalist/Rights overlap), use these tiebreakers:*

  *   **Tiebreak 1 (The Self-Promise):** If they answered 3A (Self-Promise is real), lean **Volitionalist**. If 3B, lean **Conventionalist/Rights**.
  *   **Tiebreak 2 (The Fault):** If they answered 4A (Owe apology for traffic jam), lean **Rights/Second-Personal** (focus on the debt owed). If 4B (No fault), lean **Conventionalist** (focus on the rules of excuse).
  *   **Tiebreak 3 (The Liar):** If they answered 6B (Liar can't promise), lean **Sovereign/Status**. If 6A, lean **Conventionalist/Volitional**.

  **Step 4: The "Split Down the Middle" Rule**
  *If a member has exactly three "Binding" and three "Free" answers:*
  They are a **Threshold Deontologist**. They believe promises create a real obligation, but it is a "trump card" that can be beaten by a sufficiently high stake (like preventing harm), but not by a low stake (like inconvenience). Tell them they are the only adults in the room, but their life will be very stressful.
