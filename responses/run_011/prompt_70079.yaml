  *(Refining the Counter-Argument)*: The strongest argument against my "Conditions" recommendation is that it creates an inequitable burden. If the tool is a crutch for the disadvantaged, requiring them to prove they can walk without it *while* using the crutch might break them. I need to articulate that clearly.

