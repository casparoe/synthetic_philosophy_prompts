          *   *FEA:* Deterministic. Input -> Math -> Output. Error comes from user input or mesh. Can be validated against closed-form solutions (e.g., beam bending).
          *   *LLM:* Probabilistic. Token prediction. "Confidently wrong." Cannot be validated against first principles in the same way because the internal logic is opaque/non-existent.
          *   *Conclusion:* You can trust FEA if you verify the *model*. You cannot trust LLM output unless you verify the *reasoning*.
      *   **Individual vs. Team Judgment:**
          *   Engineering is collaborative, but licensure (PE) is individual. Liability is individual.
          *   *Verdict:* The capacity to check must be *individual*, even if the work is done in a team. You can't outsource your license.
      *   **The Data:** Acknowledge the 30% vs 65% failure rate. This is the smoking gun. It proves "automation bias" or lack of fundamental grounding.
      *   **The Equity Argument:** Acknowledge this strongly. Banning the tool punishes the working/ESL students. The solution isn't ban, it's scaffolding.
      *   **Recommendation:** Approve with Conditions.
      *   **Conditions (Syllabus-gradeable):**
          1.  *The "Sanity Check" Log:* Students must submit a specific log where they estimate the answer *before* asking the LLM (back-of-envelope).
          2.  *The "Why" Audit:* For every LLM suggestion used, student must cite the specific code clause or physical principle. No "LLM said so."
