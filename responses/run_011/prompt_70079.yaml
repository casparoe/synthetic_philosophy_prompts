      *   *Self-Correction on Conditions:* Ensure they aren't just "be careful." They need to be gradable. "Submit a log" is gradable. "Pass a specific exam section" is gradable.
      *   *Self-Correction on Recommendation:* Make it bold. "Approve with Conditions" is the vote.

  6.  **Final Review against Constraints:**

