answer: |-
  **MEMORANDUM**

  **TO:** Curriculum Committee, School of Engineering
  **FROM:** [Your Name], External Committee Member
  **DATE:** [Current Date]
  **SUBJECT:** Recommendation Regarding Senior Design LLM Pilot (Civil Engineering)

  **1. Purpose**

  This memo summarizes the epistemic and pedagogical risks associated with the proposed Civil Engineering Senior Design pilot, which permits the use of Large Language Models (LLMs) for structural analysis and code checks while removing hand-calculation requirements. It offers a specific recommendation for the committee's vote on the 14th.

  **2. The Epistemic Distinction: Solver vs. Witness**

  We must distinguish between the tools we currently allow and the tool proposed.

  *   **Finite Element Solvers (FEA):** These are deterministic. They execute explicit mathematical operations. When we trust an FEA solver, we are trusting *mathematics* implemented in code. We validate this by comparing output against closed-form solutions (first principles) where available. If the input is valid, the output is mathematically consistent.
  *   **LLM Assistants:** These are probabilistic. They do not calculate; they predict tokens based on training data. When an LLM provides a structural ratio, it is not performing a calculation; it is offering *testimony*.

  This brings us to the Hume/Reid problem. We are asking students to treat the LLM not as a calculator, but as an expert witness. The data shows this witness is competent but occasionally perjures itself with high confidence (the service vs. factored load error). Trusting a solver requires verification of the *model*. Trusting an LLM requires verification of the *reasoning*. Currently, the pilot asks students to trust the reasoning without the training to verify it.

  **3. Individual Judgment vs. Collective Workflow**

  The committee is divided on whether the capacity to check results must be held individually or can be distributed across a team.

  *   **The Reality:** Engineering work is collaborative.
  *   **The Constraint:** Licensure (PE) and liability are individual. A signature on a drawing certifies that *the signer* has exercised independent judgment.

  If we treat the "capacity to check" as a collective team asset, we graduate students who are dependent on a specific team composition to be safe. If a graduate enters a workplace where they are the only checker, or the team is compromised by schedule pressure, they lack the individual epistemic grounding to refuse a dangerous output.

  **Recommendation:** The capacity to verify first principles must remain an **individual competency**, even if the workflow is collaborative. The pilot cannot proceed unless it guarantees every graduating student retains the individual ability to identify when the "witness" is lying.

  **4. The Equity Imperative**

  We cannot ignore the demographic data. The students most reliant on the tool are working thirty hours a week and/or are ESL speakers. For them, the tool functions as accessible tutoring and a leveling field for professional communication. A blanket ban protects standards by punishing the vulnerable. It preserves the integrity of the degree by reducing the diversity of the holders. We must not choose between safety and equity; we must engineer a solution that satisfies both.

  **5. Recommendation**

  **I recommend we APPROVE THE PILOT WITH CONDITIONS.**

  We acknowledge the practicing engineer's argument: training students on workflows that no longer exist is a disservice. However, the data (30% error detection rate among heavy users vs. 65% among non-users) indicates a critical failure in "independent professional judgment." We can mitigate this without banning the tool by shifting the grading weight from *producing* the answer to *auditing* the answer.

  **6. Proposed Conditions (Syllabus-Gradeable)**

  To satisfy Program Outcomes regarding independent judgment and first-principles checking, the following three conditions must be embedded in the syllabus and graded explicitly:

  *   **Condition A: The "Pre-Flight" Estimate.**
      For every major structural member analyzed via LLM, students must submit a hand-written "back-of-the-envelope" estimation log (e.g., simplified beam equations, load path sketches) *before* prompting the tool.
      *   *Grading:* Pass/Fail. If the LLM output deviates from the estimate by >20% and the student does not flag and justify the discrepancy in writing, the assignment receives zero credit for that section.
  *   **Condition B: The Citation of Authority.**
      LLM output cannot be cited as a source. For every code check provided by the assistant, the student must cite the specific section of the building code (e.g., ASCE 7-16, Section X.X) and the specific physical principle used.
      *   *Grading:* Random audit of 3 citations per report. If the code section does not support the claim, or if the principle is misidentified, a 10% penalty applies per error.
  *   **Condition C: The "Red Team" Proctored Module.**
      A mandatory, proctored mid-term module where students are provided with an LLM-generated structural report containing two planted logical errors (similar to the service/factored load error). No tools allowed.
      *   *Grading:* Students must identify and correct the errors. Passing this module is a prerequisite for passing the course, regardless of overall project grade. This ensures individual competency.

  **7. The Strongest Argument Against This Recommendation**

  *To be raised by the Pro-Pilot Faculty:*

  "These conditions impose a 'tax' on the very students we aim to help. The working student and the ESL student rely on the LLM *because* they lack the time for back-of-the-envelope estimations and the fluency to navigate code sections quickly. By requiring them to do the work twice (once to estimate, once to verify) and subjecting them to a proctored 'Red Team' exam that favors those with strong foundational intuition, we are effectively creating a two-tier system.

  The wealthy or well-supported students will pass the 'Red Team' exam easily. The working students, who used the tool to bridge their knowledge gap, may fail the exam because the tool was their scaffold. We risk filtering out the diverse candidates we claim to support, under the guise of rigor. Furthermore, if the industry has moved to a model where the 'team' catches the error, not the individual, we are training our students for a liability model that is already obsolete. We are teaching them to be solo practitioners in a world of integrated systems. This recommendation preserves the academy's conscience at the expense of the student's employability."

  **8. Conclusion**

  The "Red Team" module is the safeguard against the employability argument. If a student cannot pass the proctored check, they are not safe to graduate, regardless of their employability. The "Pre-Flight" estimate is the safeguard against automation bias.

  This recommendation accepts the engineer's premise (the workplace has changed) but rejects the conclusion (therefore we stop teaching the fundamentals). It treats the LLM as a powerful but unverified witness, requiring corroboration before testimony is admitted to the record.

  I move we adopt the pilot subject to Conditions A, B, and C.
