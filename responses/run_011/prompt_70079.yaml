      *   **Program Outcome (PO) Language:** "Exercise independent professional judgment and check computational results against first principles."
      *   **Key Philosophical/Epistemic Question:** What's the difference between trusting a validated FEA solver vs. an LLM? Is the capacity to check individual or collective (team)?
      *   **Requirements:**
