answer: |-
  The apparent incoherence you identify stems from a category error: you are searching for a unified epistemic theory (markets as knowledge generators) within a doctrinal framework that is primarily concerned with **incentive compatibility** and **regulatory categorization**. The Anglo-American law of insurable interest does not presuppose that markets generate knowledge; it presupposes that markets generate *moral hazard* unless constrained.

  Here is the reconstruction of the implicit theory, the discrimination among candidate explanations, and the analysis of the "No-Trade" hypothetical.

  ### I. Reconstruction of the Implicit Theory

  Your tentative reconstruction posits an **Epistemic Theory**: that insurable interest functions to ensure price signals reflect informed belief rather than noise, by requiring "skin in the game." This theory fails to explain the data. If the goal were information aggregation, the secondary market for life insurance (where investors have no relationship to the insured) would be banned, and naked Credit Default Swaps (CDS) would be encouraged as pure expressions of credit views. The law does the opposite.

  The actual implicit theory is a hybrid of **Moral Hazard Containment** and **Contractual Categorization**:

  1.  **Property Insurance (The Indemnity Principle):** The goal is restoration, not profit. If you do not own the house at the time of the fire, you suffer no financial loss. Paying you would constitute unjust enrichment and create an incentive to destroy property you no longer own (or to collude with the new owner). Here, the interest must persist to loss to prevent the insured from *causing* or *profiting* from the loss.
  2.  **Life Insurance (The Valued Policy Principle):** Human life is not indemnified; it is valued. A fixed sum is agreed upon at inception. Because death is certain and the risk is merely timing, the policy is treated as a property right (a chose in action) once validly created. The moral hazard is managed at **inception** via the consent of the insured. Once the insured consents to the policy, the risk of murder-for-profit is deemed legally mitigated, allowing the policy to be traded as an asset. The secondary market is permitted to provide liquidity to the insured (viatical settlements), prioritizing the welfare of the living insured over the speculative nature of the investor's bet.
  3.  **CDS and Wagering (Regulatory Silos):** Naked CDS and sports betting are not governed by insurance law. They are governed by securities and gaming law. The legal system tolerates "wagers" on impersonal assets (bonds, athletes) because the moral hazard of causing the loss is negligible (an investor cannot easily force a sovereign default or a team to lose). The law distinguishes between **personal risk** (where human agency can trigger the loss) and **impersonal risk** (where the bettor is powerless to affect the outcome).

  **Conclusion on Epistemology:** The doctrine presupposes **no account of markets as generators of knowledge.** It views insurance markets as mechanisms for **risk distribution**, not price discovery. Where price discovery is the goal (securities markets), the insurable interest doctrine is explicitly disapplied.

  ### II. The Discriminating Doctrinal Feature

  To distinguish between the Epistemic Theory (belief requires exposure), the Moral Hazard Theory (exposure prevents crime), and the Path Dependence Theory (historical accident), we must look for a feature that one theory explains and the others cannot.

  The single doctrinal feature that most sharply discriminates among these theories is **the prohibition on Stranger-Originated Life Insurance (STOLI).**

  *   **The Fact:** Most states allow a spouse to buy a policy and sell it to an investor one month later (secondary market). However, they prohibit a stranger from inducing the insured to take out a policy with the pre-arranged intent of selling it immediately (STOLI).
  *   **Epistemic Theory:** Fails. In both cases, the ultimate holder of the risk is a stranger with no exposure to the life. The information content of the bet is identical.
  *   **Moral Hazard Theory:** Weak. In both cases, the investor gains from death. The physical risk to the insured is similar.
  *   **Path Dependence:** Plausible, but unsatisfying.
  *   **The Winning Explanation (Contractual Validity at Origination):** The law treats insurance as a contract of **indemnity or benevolence**, not a **tradable commodity at inception**.
      *   In the secondary market, a valid insurance contract *already exists*. The transfer is an assignment of an asset.
      *   In STOLI, the contract *never validly existed* because the applicant lacked intent to insure, acting instead as a pawn for a wager.
      *   **Discrimination:** This feature kills the Epistemic Theory. If the law cared about the informativeness of the bid, STOLI would be permissible (investors have longevity views). The fact that STOLI is banned while secondary sales are allowed proves the law cares about the **purpose of the contract at formation**, not the informational value of the risk holder. It prioritizes the *sanctity of the insurance contract* over market efficiency.

  ### III. The "No-Trade Theorem" Regulatory Regime

  Suppose a regulator adopts the premise derived from the Milgrom-Stokey No-Trade Theorem: *Rational agents with common priors will not trade purely speculatively; therefore, speculative trades indicate ignorance, irrationality, or private information that implies adverse selection.*

  If this premise were operationalized to eliminate "ignorant" speculation, the following changes would occur:

  1.  **Insurable Interest Doctrine:** It would be radically expanded.
      *   **Life Insurance:** The secondary market for life settlements would be abolished. An investor betting on the timing of a stranger's death is engaging in a speculative trade where they have no prior exposure. Only beneficiaries with pre-existing economic loss (e.g., key person insurance, spouses) could hold policies.
      *   **Property:** No change (interest already required at loss).
  2.  **Futures and Swaps:**
      *   **Position Limits:** Drastic tightening. "Naked" CDS would be banned entirely, as the buyer holds no reference bond (no prior exposure).
      *   **Hedger-Only Mandates:** Futures markets would revert to "commercial hedger only" models. Speculators, who provide liquidity but trade without underlying exposure, would be excluded.
  3.  **Coherence Assessment:**
      *   **Logical Coherence:** This regime would be **more coherent** than the current one. It would apply a single principle (no speculation without prior exposure) across insurance, derivatives, and gambling. It would resolve the contradiction between banning STOLI and allowing naked CDS.
      *   **Functional Coherence:** It would be **economically catastrophic**. The No-Trade Theorem relies on assumptions (common priors, frictionless markets) that do not exist in reality. Speculators provide the liquidity that allows hedgers to enter and exit positions. Without speculators, the cost of hedging would skyrocket, and price discovery (the very epistemic function you initially queried) would vanish.
      *   **Result:** A regime that is theoretically pure but functionally brittle. It would eliminate the "gambling" the law claims to dislike, but it would also eliminate the liquidity that makes insurance and hedging viable.

  ### Summary

  The current insurable interest doctrine does not encode an epistemic theory of markets. It encodes a **moral theory of incentives**, distinguishing between personal risks (where human agency can cause loss) and impersonal risks (where it cannot), and between valid contracts assigned later (liquidity) and wagers disguised as contracts at inception (public policy).

  The **STOLI prohibition** is the key that unlocks this logic: it proves the law cares about the *intent at formation* rather than the *exposure at loss* or the *information content of the bet*. Adopting a "No-Trade" regulatory premise would create a logically consistent system, but it would collapse the liquidity necessary for the risk-transfer markets to function, proving that the current "incoherence" is likely a pragmatic adaptation to the necessity of speculation in risk management.
