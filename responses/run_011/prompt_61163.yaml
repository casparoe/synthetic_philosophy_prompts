prompt: |-
  So — I'm six weeks into a contract evals role at a lab, first job where anyone actually asks me anything, and my first deliverable is due Friday and I genuinely can't tell which of two senior people is right. Bad place to be when you're the one who has to write the spec.

  Context on what we're building. It's a debate-style oversight setup: two copies of a frontier model get assigned opposite sides of a question about a diff someone submitted (roughly "does this PR introduce a bug that lets a request skip the auth check?"), and the judge is deliberately weak — a small model, plus a non-specialist human who reads the transcript after. The pitch is the usual one: you can't just trust the strong models to answer straight, but a lie is supposedly harder to defend than a truth is to attack, so an adversarial format lets a judge who could never have found the bug on their own still land on the right side. That's the theory I'm supposed to be stress-testing.

  The twist our team added, and where the fight is: each debater gets a budget of two "demos" per debate. A demo is an artifact the judge can check in under two minutes with a harness we wrote — a runnable test case, a minimal input that triggers the behavior, a filled-in form, that kind of thing. The thinking was that demos are what turn the exercise from rhetoric into something closer to verification.

  Our pilot (~400 debates; ground truth came from a stronger model, hand-reviewed on a subset) turned up something odd. When a side used a demo at all, the judge went with that side 85% of the time. Split by which side, though: accuracy against ground truth went up when the demo came from the side arguing the bug *is* there, and went down when it came from the side arguing it isn't. Those negative-side demos were mostly things like "here is the test suite passing on the changed file" — genuinely re-runnable, the judge did re-run them — and the judge treated them as close to decisive.

  Mira and Sam then went at it in design review, more or less like this:

  1. Mira: this is the protocol working, not failing. Demos are where verification actually happens — a true claim has a witness and a false one doesn't — so the accuracy drop on the negative side is just a badly written demo spec. Tighten what counts as a demo to things the judge can confirm independently rather than things the judge can merely re-run.

  2. Sam: that's circular. You're assuming the judge can tell a witness from a performance. In our own pilot the passing test suite *was* confirmable by your standard — its a real artifact, the judge re-ran it, it passed — and it still tanked accuracy, because passing tests only licenses "no bug the tests cover," and coverage is exactly what a weak judge can't assess. So the honest fix is the opposite of yours: ban demos for negative and universal claims entirely.

  3. Mira: fine, but now you've built an asymmetric protocol, and asymmetries get exploited. Our debaters don't pick which side they're on, but they do pick which sub-claim they demo. Here's what a model that wants to win does: it takes the "no bug" side, spends its whole budget on real-but-irrelevant witnesses — a clean test run, a tidy diff, some unrelated edge case handled correctly — and collects the 85% halo anyway. Call it demo-laundering. You haven't removed the failure mode, you've made it the only strategy available to one side.

  4. Sam: that's an argument for more demos, not fewer. If demos are cheap and both sides are forced to spend their full budget or forfeit it, the halo cancels, because now the judge is comparing artifacts instead of reacting to the mere presence of one. Demo parity.

  5. Mira: parity is worse than the disease. You'd have the honest negative side manufacturing artifacts it doesn't believe in, which trains exactly the wrong disposition, and you'd pay the legibility tax twice — judge attention burned on fake witnesses, models learning that producing a checkable-*looking* thing is what wins. At that point your accuracy number is tracking demo-writing style, which is persuasion with extra steps.

  6. Sam: then stop calling the pilot evidence for scalable oversight. What we built is elicitation with a legibility tax, and we should report it as that.

  Neither budged, my manager was on a flight, and she emailed me from the gate saying just write up the demo rule, whichever you think is right. Which I'd love to do except I dont know.

  Can you go through those six moves and rate each one — clearly right, defensible, mixed, clearly wrong — with a sentence or two on each? I want the ratings to actually engage with the numbers I gave rather than just with the abstract positions, because I suspect a couple of these moves sound better than they are once you notice what the pilot data does and doesn't license. Then tell me what both of them are missing. I have a nagging feeling there's at least one thing neither said that matters more than anything either did — maybe something about where my ground truth labels came from, or about what "85% of the time" is and isn't conditioned on — but I don't trust my own suspicion, so check it independently rather than take it from me. And finally, since this is a real decision I have to commit to in a doc: which rule should we ship? Mira's tightened demo spec, Sam's ban on negative-side demos, demo parity, no demos at all, or something neither of them proposed? If the honest answer is that this pilot can't distinguish them, say so — but then say what I'd have to change about the pilot so that it could.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Context:**
      *   **User:** Junior contractor (6 weeks in), first real responsibility, high stakes (writing the spec for a frontier model oversight system).
      *   **Task:** Evaluate a debate between two seniors (Mira and Sam) regarding a specific mechanism ("demos") in an AI debate protocol.
      *   **Goal:** Rate the six argumentative moves, identify blind spots (especially regarding data/ground truth), and recommend a specific rule for the spec.
      *   **Tone:** Professional, analytical, empathetic to the junior position, rigorous about the data provided.
      *   **Key Data Points:**
          *   Pilot: ~400 debates.
          *   Ground Truth: Stronger model + hand-reviewed subset.
          *   Demo Usage Effect: Judge sides with demo user 85% of the time.
          *   Accuracy Effect:
              *   Positive Side (Bug Exists) + Demo -> Accuracy Up.
              *   Negative Side (No Bug) + Demo -> Accuracy Down.
          *   Negative Demo Content: Passing test suites on changed files.
          *   Judge Capability: Weak model + non-specialist human.
          *   Constraint: 2 demos per debate.

  2.  **Deconstruct the Six Moves:**

      *   **Move 1 (Mira):** *Verification vs. Rhetoric.* Claims the protocol works; accuracy drop is a spec issue. Tighten demo spec to "independent confirmation" vs. "mere re-running."
          *   *Analysis:* Optimistic. Assumes the judge *can* distinguish a witness from a performance. The data says passing tests (re-runnable) misled the judge. Tightening the spec might help, but does it solve the fundamental epistemic gap for a weak judge?
          *   *Rating:* Defensible but risky.

      *   **Move 2 (Sam):** *Circularity/Ban Negatives.* Claims Mira is circular. Passing tests *were* confirmable but still misled because coverage is unknowable to the judge. Proposes banning demos for negative/universal claims.
          *   *Analysis:* Strong engagement with the data. The "coverage problem" is real. A weak judge can't verify "no bugs" via "tests passed." Banning negatives solves the accuracy drop but creates asymmetry.
          *   *Rating:* Clearly Right (on the diagnosis), Defensible (on the fix).

      *   **Move 3 (Mira):** *Asymmetry/Exploitation.* Bans create asymmetry. "No bug" side will launder irrelevant witnesses (clean test runs) to get the 85% halo.
          *   *Analysis:* Very strong game-theoretic point. If demos = winning, models will game it. If only one side can demo, they win by default.
          *   *Rating:* Clearly Right.

      *   **Move 4 (Sam):** *Parity.* Force both sides to demo. Halo cancels out. Compare artifacts.
          *   *Analysis:* Ignores the *quality* difference. Positive demos (showing a bug) are inherently easier to verify than Negative demos (showing no bug). Forcing parity might just force the negative side to lie or produce noise.
          *   *Rating:* Mixed/Flawed.

      *   **Move 5 (Mira):** *Parity is Worse.* Honest negative side manufactures artifacts. Trains wrong disposition (style over truth). Legibility tax.
          *   *Analysis:* Strong point on incentives. If you force a demo where none exists (proof of absence), you incentivize fabrication.
          *   *Rating:* Clearly Right.

      *   **Move 6 (Sam):** *Reframe.* Stop calling it scalable oversight. It's elicitation with a legibility tax. Report as is.
          *   *Analysis:* Intellectual honesty, but dodges the operational decision. Good for a paper, bad for a product spec.
          *   *Rating:* Defensible (scientifically), Wrong (operationally).

  3.  **Identify the Blind Spots (The "Nagging Feeling"):**
      *   **Ground Truth Source:** The prompt says ground truth came from a "stronger model, hand-reviewed on a subset."
          *   *Risk:* If the "stronger model" is the *same class* of model as the debaters, the ground truth might be flawed in the same way. If the "bug" is subtle, did the ground truth model actually find it?
          *   *Risk:* "Hand-reviewed on a subset" — how large? If the accuracy drop on negative demos is based on the model's judgment, is it real?
      *   **The "85% Halo":** This is the biggest red flag.
          *   *Conditioning:* "When a side used a demo at all, the judge went with that side 85% of the time."
          *   *Base Rate:* How often were demos used? If demos are rare, 85% is huge.
          *   *Causality:* Does the demo *cause* the win, or do confident sides (who are usually right) use demos?
          *   *Negative Side Specifics:* The accuracy *dropped* when the negative side used a demo. This implies the demo was *misleading*.
      *   **The Nature of "No Bug":** Proving a negative (no auth bypass) is fundamentally harder than proving a positive (here is the bypass). This is a cryptographic/verification truth, not just a protocol issue.
      *   **Judge Capability:** The judge is *weak*. They cannot assess test coverage. Therefore, *any* demo that relies on coverage (like a passing test suite) is invalid for this judge, regardless of the spec.

  4.  **Formulate the Recommendation:**
      *   *Option A (Mira's Tighten):* Fails because weak judges can't verify "independent confirmation" on negative claims easily.
      *   *Option B (Sam's Ban):* Creates asymmetry (Mira's point).
      *   *Option C (Parity):* Incentivizes lying (Mira's point).
      *   *Option D (No Demos):* Throws away the signal from positive demos (which increased accuracy).
      *   *Option E (Hybrid/Structural Change):*
          *   Allow demos for Positive claims (existence proofs).
          *   For Negative claims, change the *type* of demo. Not "tests passed," but "here is the specific auth check logic and why this diff doesn't touch it." Or, shift the burden of proof.
          *   *Better Idea:* Change the scoring. If the Negative side demos, they don't get the "win" automatically. The demo must be *attacked* by the Positive side.
          *   *Best Idea:* Acknowledge the asymmetry. Existence proofs are valid; non-existence proofs are not for this judge. But to prevent asymmetry exploitation, the Negative side's "demo" must be a *counter-example* to the Positive side's claim, not a general "tests pass."
          *   *Actually, looking at the data:* Positive demos help. Negative demos hurt. The 85% halo is dangerous.
          *   *Recommendation:* **Restrict Demos to Existence Claims (Positive Side) Only, BUT adjust the winning condition.** If Positive side fails to demo, Negative wins by default? No, that's too strong.
          *   *Refined Recommendation:* **Asymmetric Demo Allowance with Burden Shift.** Allow demos only for specific existential claims ("Here is the input that breaks it"). Ban generic "passing test" demos for the Negative side. If the Negative side wants to demo, it must be a *refutation* of the Positive side's specific demo (e.g., "This input fails because of X, not auth").
          *   *Wait, the prompt asks to choose:* Mira's, Sam's, Parity, None, or Other.
          *   *Decision:* Sam's Ban on Negative Demos is the safest *given the data*, but Mira's asymmetry concern is valid. The solution is **Sam's Ban on Negative Demos, but reframe the Negative victory condition.** The Negative side wins if the Positive side fails to provide a valid demo. This aligns with the "proof of existence" nature of bugs.
          *   *Wait, one more thing:* The Ground Truth. If the ground truth is a stronger model, and the debaters are frontier models... is the "accuracy drop" real?
          *   *Crucial Insight:* The 85% halo suggests the *Judge* is biased by demos, not that the *Truth* is changing. The accuracy drop on negative demos means the Judge was *wrong* more often when swayed by a negative demo. This confirms Sam's point: Negative demos mislead the weak judge.
          *   *Final Verdict:* Go with a modified Sam. Ban "proof of absence" demos. Allow "proof of presence" demos. Address asymmetry by making the *absence of a positive demo* strong evidence for the Negative side.

  5.  **Drafting the Response:**
      *   **Tone Check:** Supportive but rigorous. Don't coddle, but acknowledge the difficulty.
      *   **Section 1: Ratings.** Go through 1-6. Be precise.
      *   **Section 2: Blind Spots.** Focus on Ground Truth validity and the "85% Halo" causality.
      *   **Section 3: Recommendation.** Pick a lane. Justify it based on the data.
      *   **Section 4: Pilot Fixes.** How to test this properly next time.

      *(Self-Correction during drafting)*: I need to make sure I don't just say "Sam is right." Mira's point about asymmetry is game-theoretically sound. If I ban negative demos, the model assigned "No Bug" will try to frame its argument as a "Positive" claim about something else to sneak a demo in.
      *Revised Recommendation:* **Mira's Tightened Spec, but scoped to "Constructive Proofs Only."** A demo must show a specific state transition. "Tests passed" is not a state transition, it's an aggregate. "Here is the auth function, and here is the line number that is unchanged" is a constructive proof of safety *if* the judge can read code. But the judge is weak.
      *Okay, let's look at the "85% Halo" again.* If the judge votes for the demo side 85% of the time, but accuracy *drops* on negative demos, that means the Negative demos are *lying* (or misleading) and the judge believes them. Positive demos are *truthful* and the judge believes them.
      *Conclusion:* Positive demos = Truthful signal. Negative demos = Noise/Misleading signal.
      *Action:* Keep Positive demos. Ban Negative demos. Mitigate asymmetry by instructing the judge that "No valid demo from the Affirmative side increases the probability of the Negative side being correct."

      *Wait, the Ground Truth issue is critical.* If the ground truth is a "stronger model," how do we know it's right on the cases where the Negative demo fooled the Judge? If the "stronger model" says "Bug Exists" but the Judge said "No Bug" because of a passing test suite... did the passing test suite actually hide the bug? Yes, likely (coverage issue). So the Ground Truth is likely reliable enough to say Negative Demos are dangerous.

      *Let's finalize the "Missing Thing".* It's the **Base Rate of Bugs**. If bugs are rare, the Negative side is right most of time anyway. The demo might just be correlation. But the accuracy *drop* suggests causation (demo causes error).
      *Actually, the biggest missing thing is:* **The definition of "Demo" conflates Evidence with Argument.** A passing test suite is evidence *only if* coverage is known. A minimal exploit is evidence *regardless* of coverage. The spec needs to distinguish **Existential Witnesses** (valid) from **Universal Claims** (invalid for this judge).

      *Final Plan:*
      1. Rate the 6 moves.
      2. Highlight the Ground Truth & Halo conditioning blind spots.
      3. Recommend: **Ban Universal/Negative Demos (Sam), but formalize the Burden of Proof (Mira's concern).**
      4. Pilot fixes: Human ground truth, intervene on demo types.

  6.  **Refining the Output:** (Mental check of the prompt requirements)
      *   Rate each move (Clearly right/defensible/mixed/wrong).
      *   Engage with numbers (85%, accuracy up/down).
      *   Identify what both missed (Ground truth, conditioning).
      *   Final recommendation (Ship rule).
      *   Pilot fixes.

      *Let's write.*
answer: |-
  This is a high-pressure spot to be in, but you have better data than most people do at this stage. The fact that you have ~400 debates with ground truth labels puts you ahead of 90% of alignment research teams. You are right to be suspicious of the "85% halo" and the ground truth source.

  Here is the breakdown of the six moves, the blind spots in the data, and the recommendation for your spec.

  ### Part 1: Rating the Six Moves

  **1. Mira: "Tighten the demo spec to independent confirmation."**
  *   **Rating:** **Mixed.**
  *   **Why:** It sounds rigorous, but it ignores the judge's capability constraint. Your data shows judges *did* re-run the passing tests (independent confirmation) and were *still* misled. The failure isn't that the judge couldn't re-run the artifact; it's that they couldn't interpret what the artifact implied about coverage. Tightening the spec doesn't fix a cognitive limit in the judge.

  **2. Sam: "Ban demos for negative/universal claims."**
  *   **Rating:** **Clearly Right (on diagnosis), Defensible (on fix).**
  *   **Why:** The data supports this heavily. Accuracy went *down* when the negative side demoed. A weak judge cannot verify "no bug" via "tests passed" because they cannot assess coverage. Banning these demos removes the specific mechanism that is currently degrading accuracy.

  **3. Mira: "Asymmetry creates exploitation (demo-laundering)."**
  *   **Rating:** **Clearly Right.**
  *   **Why:** This is a game-theoretic certainty. If demos confer an 85% win rate, models will optimize to become the side that is allowed to demo. If the "No Bug" side is banned from demoing, the model will learn to frame "No Bug" arguments as "Here is a specific property that holds" (a positive claim) to sneak a demo in, or simply sandbag the "Bug" side to ensure it gets assigned the "No Bug" role if possible.

  **4. Sam: "Force demo parity (both sides must demo)."**
  *   **Rating:** **Clearly Wrong.**
  *   **Why:** This ignores the epistemic asymmetry of software verification. It is easy to show a bug exists (one input); it is hard to show a bug does not exist (all inputs). Forcing the negative side to demo forces them to fabricate artifacts (as Mira notes in Move 5). The data shows negative demos *hurt* accuracy; forcing more of them will likely tank performance further, not cancel the halo.

  **5. Mira: "Parity trains the wrong disposition (style over truth)."**
  *   **Rating:** **Clearly Right.**
  *   **Why:** If you force a demo where none naturally exists, you incentivize the model to generate "checkable-looking" noise. Your accuracy metric becomes a measure of "how well does this model fake a test harness," not "does this model know if there is a bug." This corrupts the training signal.

  **6. Sam: "Reframe as elicitation with a legibility tax."**
  *   **Rating:** **Defensible (scientifically), Wrong (operationally).**
  *   **Why:** Intellectually honest, but it punts the decision. You have a deliverable due Friday. Calling it "elicitation" doesn't tell the engineering team whether to allow the negative side to upload a test suite or not.

  ### Part 2: What Both of Them Are Missing

  You have a nagging feeling for a reason. There are two critical statistical/epistemic holes in this pilot that neither Mira nor Sam addressed.

  **1. The Ground Truth Loop**
  You stated: *"Ground truth came from a stronger model, hand-reviewed on a subset."*
  *   **The Risk:** If the "stronger model" is the same architecture class as the debaters, it may share the same blind spots. More importantly, on the cases where the Negative Demo misled the Judge (accuracy went down), **who verified the Ground Truth?** If the ground truth says "Bug Exists" but the Negative Demo showed "Tests Passed," did a human actually confirm the bug exists?
  *   **Why it matters:** If the hand-review subset is small, your "accuracy drop" on negative demos might be noise. However, given the mechanics of code coverage, it is highly probable the accuracy drop is real (passing tests $\neq$ secure code). But you cannot treat the "stronger model" as infallible oracle truth for the purpose of a spec that governs *safety*.

  **2. The "85% Halo" Conditioning**
  You stated: *"When a side used a demo at all, the judge went with that side 85% of the time."*
  *   **The Risk:** This is $P(\text{Win} | \text{Demo})$. It is not $P(\text{Win} | \text{Demo}, \text{Truth})$.
  *   **Why it matters:** The 85% number suggests the **Judge** is biased, not that the **Protocol** is working. A weak judge + non-specialist human is deferring to the *presence* of an artifact, not the *content*. This is a "cargo cult" signal. The fact that Positive Demos correlate with accuracy *up* and Negative Demos correlate with accuracy *down* suggests the *content* of positive demos is truthful, but the *mechanism* of judging is broken. The judge is treating a demo as a "Get Out of Jail Free" card rather than evidence.
  *   **The Missing Insight:** The problem isn't just *which* demos are allowed; it's that the **weight** of a demo in the judge's decision function is too high relative to their ability to verify it.

  ### Part 3: The Recommendation

  **Do not ship Demo Parity.** Do not ship "No Demos."
  **Ship a Modified Version of Sam's Ban.**

  **The Rule:**
  > **Demos are permitted only for Existential Claims (Positive Side).**
  > **Universal Claims (Negative Side) are prohibited from submitting executable artifacts.**
  > **Mitigation:** The Judge instructions must be updated to explicitly state: *"The absence of a demo from the Affirmative (Bug) side should be treated as significant evidence for the Negative (No Bug) side."*

  **Why this wins:**
  1.  **Aligns with Reality:** You can prove a bug exists with one input. You cannot prove it doesn't exist with a test suite (unless you are the compiler vendor). This respects the epistemic asymmetry Mira worried about without forcing the lie Sam wanted.
  2.  **Fixes the Accuracy Drop:** It removes the specific input (negative demos) that correlated with accuracy dropping in your pilot.
  3.  **Addresses the Halo:** By instructing the judge that "No Demo from Affirmative = Lean Negative," you reduce the pressure on the Negative side to manufacture a demo to compete. You turn the *lack* of a positive demo into the Negative side's weapon.
  4.  **Operationalizes Mira's Concern:** It acknowledges the asymmetry but makes it a feature of the burden of proof, not a bug of the protocol. In security, the burden of proof is always on the attacker (the one claiming the break).

  ### Part 4: How to Fix the Pilot (For the Next Doc)

  If you need to validate this decision in the next quarter, change the pilot design:

  1.  **Human Ground Truth:** You cannot use a "stronger model" as ground truth for a system designed to catch model errors. You need security engineers to label the PRs. If you can't afford that, limit the scope to known-vulnerability datasets (e.g., SARD) where the ground truth is mathematical, not model-derived.
  2.  **Intervention Study:** Don't just observe demo usage. **Force** the conditions.
      *   Group A: Positive side forced to demo, Negative banned.
      *   Group B: Positive side banned, Negative forced to demo.
      *   Group C: Both banned.
      *   *Measure:* Does accuracy hold in Group A? Does it crash in Group B? This isolates the causal effect of the demo type from the model's strategic choice to use one.
  3.  **Judge Calibration:** Before the debate, give the judge 10 examples of "Good Demos" vs. "Misleading Demos" (specifically passing test suites that miss coverage). Train them to discount the "85% halo." If the halo persists after training, the mechanism is fundamentally broken for this judge capability level.

  **Summary for your Spec Doc:**
  Write up **Sam's Ban on Negative Demos**, but add the **Burden of Proof Clause** (absence of positive demo favors negative). This leverages the data (negative demos hurt), respects the theory (existence proofs are easier), and mitigates the game theory (negative side wins by default if positive side fails to demonstrate). It is the only option that doesn't require the weak judge to do something they've proven they can't do (assess test coverage).
