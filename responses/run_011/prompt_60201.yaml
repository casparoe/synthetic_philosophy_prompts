answer: |-
  Aquinas forbids the killing in your constructed case because the requirement for public authority is the non-negotiable structural core of his political theology, rendering private initiative illicit regardless of title defects or favorable long-term outcomes. The framework is coherently quietist in extreme vacancies of authority, prioritizing the metaphysical order of judgment over the utilitarian calculus of relief, meaning the household functionary acts unlawfully even if the restoration is just.

  To resolve the tangled textual evidence you and your reading group have encountered, we must distinguish between the conditions that make a ruler a tyrant and the conditions that make resistance licit. Aquinas offers three potential restrictions on tyrannicide: the defect of title (usurper versus oppressive legitimate ruler), the calculation of harm (whether resistance causes more damage than the tyranny), and the requirement of authority (public versus private agency). While commentators often conflate these, a rigorous reading of the corpus reveals that the authority requirement is the primary filter, the harm comparison is a secondary check, and the title distinction is largely descriptive rather than prescriptive. If the agent lacks public authority, the inquiry ends; the harm calculation and the ruler's title become irrelevant. In your case, the functionary is a private person. Even if the tyrant is oppressive and even if the long-term outcome is just, the private agent cannot assume the sword of justice. This conclusion rests on the view that the community's residual right to self-preservation does not devolve to individuals upon the destruction of institutions, but rather reverts to God or awaits the spontaneous reconstitution of a public person.

  The strongest permissive reading of Aquinas, which your canon-law friend likely favors, leans heavily on *On Kingship* and the *Sentences* commentary. This interpretation argues that Aquinas distinguishes sharply between a tyrant by exercise and a tyrant by defect of title. In *On Kingship*, Aquinas suggests that if a ruler seizes power without title, anyone may kill him, though prudence is advised. The permissive reading extends this logic: a ruler who dismantles the very institutions that constitute the polity effectively forfeits his title. By dissolving the assembly, suspending courts, and exiling bishops, the ruler in your case has unmade the political bond that made him a king rather than a warlord. Therefore, he reverts to the status of a usurper or a private aggressor. Under this description, the household functionary does not act as a private assassin but as an agent of the "community" which still exists metaphysically even if its institutions are dormant. The functionary acts on a tacit commission, a presumed mandate from the towns and assembly members who trust him. This reading posits that the authority requirement is satisfied by the urgency of the situation and the consensus of the governed, even if unformalized. It treats the harm comparison—the two years of civil war and twenty thousand deaths—as a tragic but acceptable cost for restoring the rule of law, arguing that the *Summa*'s warning against sedition applies only to those disturbing a *just* order, not one already collapsed into criminality.

  However, this permissive reading collapses under the weight of the *Summa Theologiae*, which represents Aquinas's mature thought. The restrictive reading, which I defend, argues that the authority requirement is the center of gravity because it grounds the metaphysics of killing itself. In the *Summa*, Aquinas restricts lethal force for the common good exclusively to public authority. He uses a part-to-whole analogy: just as a hand cannot cut off a diseased foot without the direction of the head, a private individual cannot kill a ruler for the sake of the community without public commission. This is not merely a procedural hurdle; it is an ontological claim about who represents the whole. In your case, the institutions are destroyed. There is no "head" to direct the hand. The permissive argument relies on a "tacit commission," but Aquinas is deeply skeptical of private judgment usurping public roles. He warns in *On Kingship* that private attempts to remove tyrants often fail or lead to worse tyranny. In your scenario, the civil war and twenty thousand deaths validate this warning empirically, but the prohibition holds even if the war had been bloodless. The functionary remains a private part acting without the direction of the whole. The community's residual right does not survive the destruction of its institutions in a way that empowers individuals; rather, the right goes into abeyance until a public authority can be reconstituted. To allow private individuals to judge and execute the ruler is to invite the very anarchy the tyrant has already begun.

  This leads to the first sub-question regarding the stability of the harm-comparison clause. If the authority requirement is absolute, what work does the *Summa*'s statement that disturbing a tyrant is not sedition "unless it causes greater harm" actually do? Critics often argue this makes Aquinas a proto-consequentialist, bolting a utilitarian calculus onto a deontological framework. If the killing produces a just restoration, isn't the harm justified? The restrictive reading denies this hybrid is unstable because the harm calculation is not a standalone justification; it is a constraint on public authority, not a license for private agents. Even if a public assembly existed and voted to depose the tyrant, they would still have to weigh whether the deposition would cause more harm than the tyranny. However, for a private agent, the harm calculation is moot because they lack the standing to perform it. Aquinas is not a consequentialist; he is a teleologist. The end (just restoration) does not justify the means (private killing) because the means violate the order of justice. The stability of the framework relies on this hierarchy: Authority first, Harm second. If you lack authority, you cannot licitly incur the harm. If you have authority, you must ensure the harm is proportionate. In your case, the functionary fails the first test, so the twenty thousand deaths render the act doubly illicit, but the lack of authority renders it illicit even if the death toll were zero.

  The second sub-question concerns the theological counsel of patience and whether it is independent quietist work. In *On Kingship* and the *Summa*, Aquinas notes that where no human remedy exists, one must have recourse to God, for tyrants are often permitted to chastise the sins of the subjects. The permissive reading treats this as a rhetorical flourish or a spiritual add-on that can be bracketed from the political argument. The restrictive reading argues this theology is the load-bearing wall that makes the political silence coherent. If Aquinas believed politics were a closed system, the "competence vacuum"—where the need for remedy is greatest but the mechanism is absent—would be a fatal inconsistency. Why design a system that fails precisely when the tyrant is most thorough? The answer is that the system is not designed to be self-sufficient. It is subordinate to divine providence. The counsel of patience is not merely advice to suffer; it is a diagnosis of the cause. The tyranny is a symptom of collective sin; the remedy is repentance, which moves God to remove the tyrant. If you bracket this theological commitment, the political structure collapses into incoherence because it offers no solution for the worst-case scenario. If you accept it, the vacuum is not a bug but a feature: it forces the community to recognize its dependence on God rather than on the violent ingenuity of private agents. Therefore, the framework is coherently quietist. It is not contingently conservative, because it does not simply defend the status quo; it allows for public deposition if institutions exist. It is not internally inconsistent, because it has a defined upper limit to political self-help. It accepts that there are situations where political justice cannot be achieved by human hands, and in those situations, spiritual remedy is the only licit path.

  Applying this to your specific case: The ruler has good title but oppressive exercise. The institutions are gone. The functionary is private. The restrictive reading forbids the killing. The permissive reading would allow it based on the forfeiture of title and tacit mandate. The decisive factor is the authority requirement. The destruction of the courts and assembly does not transfer public authority to private individuals; it suspends the exercise of public authority. The functionary is not a "public person" simply because he is trusted by a plurality. Trust is not commission. Without a formal mechanism to designate him as the agent of the whole, he remains a part acting against the head, which violates the natural order Aquinas defends. Furthermore, the harm comparison reinforces the prohibition. Even if we granted him authority hypothetically, the cost of twenty thousand lives during the civil war is a massive burden of proof. Aquinas warns that the remedy must not be worse than the disease. A two-year civil war suggests the tyranny, however oppressive, was stable enough to maintain order, whereas the resistance unleashed chaos. Aquinas would likely argue that the certainty of the tyrant's oppression is preferable to the uncertainty of civil war, unless the tyranny involves direct spiritual destruction (forcing idolatry, etc.), which is not specified in your case. Thus, the killing is forbidden, the harm calculation confirms the prohibition, and the theological counsel explains why the community must endure until God provides a legitimate deliverer, such as the moderate heir, without the stain of private assassination.

  This verdict leaves us with the objection of the competence vacuum. Is it not cruel to tell a people suffering under a dismantled polity that they cannot act? It is cruel only if one assumes that political liberty is the highest good. For Aquinas, the order of justice and the salvation of souls are higher. A framework engineered to "fail" in these circumstances is engineered to prevent the greater evil of privatized violence. If private killing were permitted whenever institutions failed, every faction would claim the institutions had failed to justify their coups. The vacuum protects the concept of public authority by refusing to let it be simulated by private will. This makes the view coherently quietist. A Thomist should accept this because it acknowledges the limits of politics. Politics cannot solve every problem, especially not the problem of its own total collapse. To pretend otherwise is to idolize the state or the revolution. The silence of the law in the face of absolute tyranny is a reminder that the law is not God.

  To conclude, I will identify the considerations that would most change this verdict, as requested. First, the textual point that would flip my answer is if the *Sentences* commentary were demonstrably a more authoritative statement of Aquinas's mature political view than the *Summa Theologiae*. The *Sentences* is more permissive regarding private action against tyrants. If one could prove that Aquinas did not correct this view in the *Summa* but merely contextualized it, the door to private initiative would open wider. However, the standard scholarly consensus is that the *Summa* represents his mature synthesis, where the restrictions are tighter. Second, regarding the ranking of restrictions, if forced to demote one, I would demote the title distinction (usurper vs. oppressive). It does the least explanatory work across the corpus. *On Kingship* highlights it, but the *Summa*'s discussion of sedition focuses on the disturbance of peace and the authority of the actor, not the legal pedigree of the ruler. If the title distinction were removed, Aquinas's system would remain intact; if the authority requirement were removed, the system would collapse into vigilantism. Finally, the consideration that would most challenge the quietist conclusion is evidence that Aquinas viewed the "community" as a mystical body that retains agency even without formal institutions. If he believed the *populus* never sleeps and can act through any member when the head is corrupt, the "tacit mandate" becomes viable. But given his emphasis on order and the dangers of private judgment, this seems contrary to his core philosophical commitments. Until such evidence arises, the functionary's poison remains a sin, the civil war a tragedy, and the silence of the law a theological necessity.
