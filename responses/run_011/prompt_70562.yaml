answer: |-
  Your intuition is sharp, and it maps onto a genuine tension in the formal epistemology literature. You have identified what is often called the **"Two-Foundations Problem"** for accuracy-first epistemology. While proponents like Richard Pettigrew and James Joyce present accuracy as a *unified* ground for epistemic norms, the decision-theoretic machinery required to derive Probabilism (coherence) is distinct from the machinery required to derive Conditionalization (updating).

  Your colleague is technically correct that states and policies are different mathematical objects, but your critique cuts deeper: if "Accuracy" is the *sole* fundamental value, the optimization criterion used to maximize that value should presumably be uniform. The shift from **State-Wise Dominance** (for coherence) to **Subjective Expected Accuracy** (for updating) suggests that accuracy alone is insufficient; it needs to be propped up by different decision-theoretic norms depending on the context.

  Here is the case pressed concretely, followed by the defenses and a literature status check.

  ### 1. The Concrete Model

  Let us construct a minimal finite model to demonstrate where the criteria diverge.

  **The Setup:**
  *   **Worlds:** $\Omega = \{w_1, w_2\}$.
  *   **Proposition:** $A = \{w_1\}$, so $\neg A = \{w_2\}$.
  *   **Credence Function:** $c = (c(A), c(\neg A))$.
  *   **Scoring Rule:** Brier Score (Inaccuracy). Lower is better.
      $$S(c, w) = (c(A) - \mathbb{1}_A(w))^2 + (c(\neg A) - \mathbb{1}_{\neg A}(w))^2$$
  *   **Coherence:** $c$ is coherent iff $c(A) + c(\neg A) = 1$ and $c \geq 0$.

  #### Part A: The Coherence Argument (Dominance)
  Consider an incoherent credence function $c_{inc} = (0.6, 0.6)$. Sum = 1.2.
  Calculate inaccuracy in each world:
  *   **At $w_1$ (A is true):** $S(c_{inc}, w_1) = (0.6 - 1)^2 + (0.6 - 0)^2 = 0.16 + 0.36 = 0.52$.
  *   **At $w_2$ (A is false):** $S(c_{inc}, w_2) = (0.6 - 0)^2 + (0.6 - 1)^2 = 0.36 + 0.16 = 0.52$.

  Now consider a coherent alternative $c_{coh} = (0.5, 0.5)$.
  *   **At $w_1$:** $S(c_{coh}, w_1) = (0.5 - 1)^2 + (0.5 - 0)^2 = 0.25 + 0.25 = 0.50$.
  *   **At $w_2$:** $S(c_{coh}, w_2) = (0.5 - 0)^2 + (0.5 - 1)^2 = 0.25 + 0.25 = 0.50$.

  **Result:** $0.50 < 0.52$. The coherent function is strictly more accurate in **every** possible world. This is a **Dominance** argument. It does not ask what the agent believes; it compares the score card world-by-world.

  #### Part B: The Updating Argument (Expectation)
  Now consider updating. Suppose we have a prior $c_0$ and a partition of evidence $\mathcal{E} = \{E_1, E_2\}$ where $E_1 = \{w_1\}$ and $E_2 = \{w_2\}$ (we learn the truth).
  We compare two updating policies:
  1.  **Conditionalization ($R_{cond}$):** Update to $c_1 = (1, 0)$ if $E_1$, $c_2 = (0, 1)$ if $E_2$.
  2.  **Stubbornness ($R_{stub}$):** Ignore evidence. Stay at $c_0$.

  To evaluate these policies, we cannot use Dominance. Why? Because in world $w_1$, $R_{cond}$ yields accuracy 0 (perfect), while $R_{stub}$ yields whatever $c_0$ yields. But in a different setup (e.g., misleading evidence), Conditionalization is not pointwise dominant over all possible alternatives. The standard argument (Greaves & Wallace, 2006) is that Conditionalization maximizes **Expected Accuracy**.

  **The Shift:** Notice the criterion changed. For coherence, we demanded $S(c^*, w) < S(c, w)$ for **all $w$**. For updating, we demand $E_{c_0}[S(R_{cond})] < E_{c_0}[S(R_{stub})]$.

  ### 2. Pressing the Two Horns

  #### Horn 1: Insist on Dominance Everywhere
  If we apply the dominance criterion to updating policies, Conditionalization fails.
  Suppose the evidence is noisy. Let $E$ be a signal that is 90% reliable.
  *   **Policy A (Cond):** Trust the signal.
  *   **Policy B (Ignore):** Stick to prior.
  In the 10% of worlds where the signal is wrong, Policy A incurs high inaccuracy. Policy B might be more accurate in those specific worlds. Therefore, Policy A does not **dominate** Policy B world-by-world.
  **Consequence:** If you insist on dominance for updating, you cannot prove Conditionalization is the norm. You would have to recommend a more conservative rule (like "minimax" updating), or admit no updating rule is rationally required. This proves **too little** for the accuracy-first program, which aims to vindicate Bayesian updating.

  #### Horn 2: Insist on Expectation Everywhere
  If we apply the expectation criterion to coherence (your "Snag"), we run into the definitional problem you identified.
  To calculate $E_c[S(c)]$, we need weights.
  *   **Option A (Use Incoherent Weights):** Let $c_{inc} = (0.6, 0.6)$. We calculate $0.6 \cdot S(c, w_1) + 0.6 \cdot S(c, w_2)$.
      *   *Mathematical Quirk:* For the Brier score, minimizing this linear combination actually forces the solution to sum to 1 (it implicitly normalizes). The minimizer of expected Brier score relative to weights $(w_1, w_2)$ is $( \frac{w_1}{w_1+w_2}, \frac{w_2}{w_1+w_2} )$.
      *   *The Problem:* This means the incoherent agent, maximizing their own subjective expectation, would conclude they ought to adopt a *different* credence function than the one they hold. This seems to work! **However**, it relies on the agent's broken weights to fix the broken weights. It assumes the agent's "expectation" is a valid normative arbiter even when their weights don't sum to 1.
  *   **Option B (Renormalize):** If we say "Expectations are only defined for coherent measures," then we cannot apply the expectation criterion to incoherent agents at all.
      *   *The Problem:* This makes the norm **circular**. We can only evaluate accuracy expectations for agents who are already coherent. Thus, Expected Accuracy cannot be the *ground* for coherence; it presupposes it.

  **Consequence:** If you insist on expectation for coherence, you either rely on a mathematical artifact (implicit normalization) that begs the question, or you exclude the very agents (incoherent ones) you are trying to indict.

  ### 3. The Defenses

  Your colleague's objection ("State vs. Policy") and the "Idealization" reply are the standard defenses. Here is their strongest formulation.

  #### Defense 1: The State/Policy Distinction (Categorical Difference)
  **Argument:** Credence functions (states) and Updating Rules (policies) are different kinds of objects.
  *   A **state** is evaluated by how well it matches the world. Since we don't know the world, we look for a state that *cannot be beaten* regardless of the world (Dominance).
  *   A **policy** is a function from evidence to states. We cannot demand a policy be best in every world (because evidence might be misleading). We can only demand it be best *given what the agent expects*.
  *   **Proponent:** Richard Pettigrew (2016, *Choosing for the Sake of Accuracy*).
  *   **Claim:** The shift in criteria is not an illicit slide but a necessary adaptation to the object being evaluated. Dominance is too strong for policies; Expectation is too circular for states.

  #### Defense 2: The Coherence Presupposition (Idealization)
  **Argument:** The accuracy-first program is a **normative** theory for ideal agents, not a descriptive psychology.
  *   We are not trying to convince an incoherent agent to become coherent using their own broken logic.
  *   We are establishing the "God's eye" view: *If* you value accuracy, *then* you must be coherent (via Dominance).
  *   Once coherence is established, we ask: *Given* you are coherent, how should you update? (via Expectation).
  *   **Claim:** The circularity is harmless because the arguments are sequential, not simultaneous. Dominance gets you into the club; Expectation tells you how to dance once you're inside.

  ### 4. Evaluation: Do the Defenses Survive?

  **Verdict:** The argument survives intact, but must be weakened from "The program is contradictory" to "The program relies on a dual-foundation that is not fully unified."

  1.  **Against Defense 1 (State/Policy):** While states and policies are different, a *unified* foundational program should ideally derive the decision criterion from the fundamental value (Accuracy). If Accuracy requires Dominance for states but Expectation for policies, it suggests Accuracy is not doing all the work. **Decision-Theoretic Norms** (e.g., "Avoid Dominated Options" vs. "Maximize Expected Utility") are doing the heavy lifting. The accuracy-first program effectively imports two different decision theories without fully justifying why Accuracy maps to Dominance in one case and Expectation in the other.
  2.  **Against Defense 2 (Idealization):** This defense concedes your point. If the Expected Accuracy argument *presupposes* coherence, then Coherence is not grounded in Expected Accuracy. It is grounded in Dominance. Thus, there is no single "Accuracy Norm." There is an "Accuracy-Dominance Norm" and an "Accuracy-Expectation Norm." The program is not monolithic.

  **The Weaker Thesis That Survives:**
  The accuracy-first program is not a single argument derived from one principle. It is a **hybrid framework** that successfully vindicates probabilism via dominance and conditionalization via expectation, but it cannot claim that *one* decision-theoretic criterion flows naturally from the value of accuracy alone. The shift is not a bug, but it is a fracture in the "unity" of the foundation.

  ### 5. Literature Status & Consensus Check

  Since you need to check this against the literature, here is the breakdown of what is settled vs. contested.

  **Settled / Consensus:**
  *   **Joyce (1998, 2009):** Established the Dominance argument for Probabilism. It is widely accepted that incoherent credences are accuracy-dominated.
  *   **Greaves & Wallace (2006):** Established the Expected Accuracy argument for Conditionalization. It is widely accepted that Conditionalization maximizes expected accuracy (relative to the prior).
  *   **The Distinction:** Everyone acknowledges the math is different (Dominance vs. Expectation).

  **Contested / Debated:**
  *   **The Unity Claim:** Whether these two arguments form a *single* philosophical foundation is contested.
      *   *Defenders (Pettigrew):* Argue the distinction is principled (State vs. Policy).
      *   *Critics (Briggs 2009, Caie 2013):** Have pointed out that if we use Expected Accuracy for coherence (your Horn 2), we run into "self-undermining" problems where incoherent agents recommend incoherent updates.
  *   **The "Snag" (Incoherent Expectations):** This is actively discussed.
      *   Some (e.g., **Meacham 2010**) argue that incoherent agents don't have well-defined expectations, so the Expected Accuracy argument *cannot* apply to them. This supports your suspicion that the criterion is undefined.
      *   Others argue we should use "generalized expectations" (linear functionals), which leads to the implicit normalization issue I calculated above.
  *   **Caricature Warning:** Do not claim defenders *ignore* the shift. Pettigrew explicitly discusses the need for different decision rules for states vs. policies. Your critique is not that they are unaware, but that this awareness undermines the claim of a *single* foundational value.

  **Summary for your Colleague:**
  Your colleague is right that states and policies are distinct. However, you are right that if "Accuracy" is the *sole* ground, the decision rule for maximizing it should be invariant. The fact that it isn't suggests that Accuracy-First Epistemology is actually **Accuracy + Decision Theory**, where the Decision Theory component shifts depending on the problem. The program works, but it is not as reductionist as its strongest marketing suggests.

