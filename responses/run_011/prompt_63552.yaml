answer: |-
  ### EXAMINATION QUESTION

  **Course:** Formal Epistemology (Graduate Seminar)
  **Time Allowed:** 90 Minutes
  **Total Marks:** 25

  **Instructions:** Answer the question below. You may assume the standard definition of the Brier Score (Inaccuracy): for a credence $c$ in proposition $X$ and truth value $v_X \in \{0,1\}$, the loss is $(c(X) - v_X)^2$. Total inaccuracy is the sum of losses over all propositions in the agenda.

  **The Case:**
  Consider an agenda containing two propositions, $p$ and $q$, where $p$ entails $q$. There are three possible worlds:
  *   $w_1$: $p$ is true, $q$ is true.
  *   $w_2$: $p$ is false, $q$ is true.
  *   $w_3$: $p$ is false, $q$ is false.

  You are evaluating two candidate credence functions, $A$ and $B$, defined as follows:
  *   **Function A:** $c_A(p) = 0.7$, $c_A(q) = 0.3$.
  *   **Function B:** $c_B(p) = 0.8$, $c_B(q) = 0.9$.

  Consider also a third function, **Function C**: $c_C(p) = 0.5$, $c_C(q) = 0.5$.

  **Question:**
  (a) Calculate the total Brier loss for functions $A$, $B$, and $C$ at each of the three worlds ($w_1, w_2, w_3$). Using these figures, determine whether $A$ is accuracy-dominated by $C$, and whether $B$ is accuracy-dominated by $C$. Explain what "accuracy-dominated" means in this context. **[8 marks]**

  (b) Compare functions $B$ and $C$ using the *maximin* criterion (minimizing the maximum possible loss). Which function does this criterion recommend? Explain why an accuracy-first epistemologist cannot use this result to argue that $C$ is rationally required over $B$, despite the result in (a). **[8 marks]**

  (c) Calculate the expected inaccuracy of $B$ and $C$ from the perspective of $B$ itself (using $B$'s own probabilities over the worlds). Which function does $B$ prefer? Discuss the philosophical cost of adopting expected accuracy as the fundamental norm for choosing between coherent functions like $B$ and $C$, specifically regarding the agent's ability to recognize epistemic peers. **[9 marks]**

  ***

  ### MODEL ANSWER

  **Part (a): Dominance and Arithmetic**
  First, we calculate the Brier loss $L(c, w) = (c(p) - w(p))^2 + (c(q) - w(q))^2$ for each function at each world.

  For **Function A** ($0.7, 0.3$):
  *   $w_1 (1, 1)$: $(0.7-1)^2 + (0.3-1)^2 = 0.09 + 0.49 = 0.58$
  *   $w_2 (0, 1)$: $(0.7-0)^2 + (0.3-1)^2 = 0.49 + 0.49 = 0.98$
  *   $w_3 (0, 0)$: $(0.7-0)^2 + (0.3-0)^2 = 0.49 + 0.09 = 0.58$

  For **Function B** ($0.8, 0.9$):
  *   $w_1 (1, 1)$: $(0.8-1)^2 + (0.9-1)^2 = 0.04 + 0.01 = 0.05$
  *   $w_2 (0, 1)$: $(0.8-0)^2 + (0.9-1)^2 = 0.64 + 0.01 = 0.65$
  *   $w_3 (0, 0)$: $(0.8-0)^2 + (0.9-0)^2 = 0.64 + 0.81 = 1.45$

  For **Function C** ($0.5, 0.5$):
  *   $w_1 (1, 1)$: $(0.5-1)^2 + (0.5-1)^2 = 0.25 + 0.25 = 0.50$
  *   $w_2 (0, 1)$: $(0.5-0)^2 + (0.5-1)^2 = 0.25 + 0.25 = 0.50$
  *   $w_3 (0, 0)$: $(0.5-0)^2 + (0.5-0)^2 = 0.25 + 0.25 = 0.50$

  **Dominance Analysis:**
  Function $C$ accuracy-dominates $A$ because $C$'s loss is strictly lower than $A$'s loss at every possible world ($0.50 < 0.58$; $0.50 < 0.98$; $0.50 < 0.58$). This establishes that $A$ is irrational without needing to know which world is actual.
  Function $C$ does *not* dominate $B$. While $C$ is better at $w_2$ and $w_3$, $B$ is strictly better at $w_1$ ($0.05 < 0.50$). Thus, $B$ is undominated by $C$. (Indeed, as a coherent function, $B$ is undominated by any function).

  **Part (b): Maximin vs. Dominance**
  The maximin criterion selects the function with the lowest *maximum* loss (the best worst-case scenario).
  *   Max Loss for $A$: $0.98$
  *   Max Loss for $B$: $1.45$
  *   Max Loss for $C$: $0.50$

  Maximin recommends $C$ over $B$. However, the accuracy-first framework cannot use this to rule out $B$. The dominance argument for Probabilism works because it identifies a defect (incoherence) that guarantees avoidable inaccuracy regardless of the world. It requires no probabilities over worlds. Once we restrict our attention to coherent functions like $B$ and $C$, dominance goes silent; neither dominates the other.

  To choose between undominated options, we must introduce weights over worlds. Maximin assigns weights implicitly (focusing entirely on the worst case). This is inappropriate for epistemology because it ignores the agent's evidence. If an agent has evidence making $w_1$ highly likely, maximizing security at $w_3$ (as maximin does) sacrifices too much expected accuracy. Dominance secures Probabilism as a minimal requirement, but it is too weak to select among coherent credences.

  **Part (c): Expected Accuracy and Self-Trust**
  To calculate expected inaccuracy relative to $B$, we derive $B$'s probability distribution over worlds. Since $p \to q$:
  *   $P_B(w_1) = P_B(p) = 0.8$
  *   $P_B(w_2) = P_B(q) - P_B(p) = 0.9 - 0.8 = 0.1$
  *   $P_B(w_3) = 1 - P_B(q) = 1 - 0.9 = 0.1$

  Expected Loss for $B$ (self-evaluated):
  $0.8(0.05) + 0.1(0.65) + 0.1(1.45) = 0.04 + 0.065 + 0.145 = 0.25$

  Expected Loss for $C$ (evaluated by $B$):
  $0.8(0.50) + 0.1(0.50) + 0.1(0.50) = 0.50$

  $B$ expects itself to be more accurate than $C$ ($0.25 < 0.50$). This result relies on *strict propriety*: a scoring rule where each probabilistic function expects itself to have the lowest score.

  **Philosophical Cost:**
  Adopting expected accuracy as the norm for coherent agents carries a cost in self-trust. If $B$ is coherent, $B$ necessarily regards itself as optimally accurate relative to its own perspective. Consequently, a coherent agent cannot acknowledge that another agent with the *same evidence* is epistemically better placed, unless she judges the other agent to be incoherent. If she judges them coherent, she must disagree with their probabilities, and by propriety, she must think her own probabilities are more accurate. This makes it difficult to model epistemic humility or deference among peers within the framework. We must accept that rationality requires this self-preference; it is not arrogance, but a structural feature of having a probabilistic perspective.

  **On the Coincidence:**
  In this specific case, $C$ both dominates $A$ and wins the maximin contest. This is a geometric artifact of $C$ being the center of the simplex and $A$ being far outside. It does not matter for the lesson. Dominance is about *guaranteed* improvement; maximin is about *security*. That one function satisfies both here does not imply they are the same norm. The lesson holds: dominance rules out $A$, but only expected accuracy (with propriety) can justify choosing $B$ over $C$ given $B$'s evidence.

  ***

  ### MARKING SCHEME

  **Total Marks: 25**

  **Part (a): Calculations and Dominance (8 Marks)**
  *   **Correct Loss Tables (4 marks):** 1 mark for each correct column (A, B, C). Deduct 0.5 for arithmetic errors per cell.
  *   **Dominance Definition (2 marks):** Must state that $X$ dominates $Y$ iff $X$ has strictly lower loss at *all* worlds.
  *   **Application (2 marks):** Correctly identifying $C$ dominates $A$, and $C$ does not dominate $B$ (citing $w_1$).

  **Part (b): Maximin and Framework Limits (8 Marks)**
  *   **Maximin Calculation (2 marks):** Identifying max losses (0.98, 1.45, 0.50) and selecting $C$.
  *   **Dominance Limit (3 marks):** Explaining that dominance requires no world-probabilities, whereas maximin implicitly weights the worst world at 100%.
  *   **Framework Constraint (3 marks):** Arguing that accuracy-first epistemology uses dominance only to establish Probabilism (coherence). Once coherence is achieved, dominance is silent. Maximin is rejected because it disregards evidence/probabilities.

  **Part (c): Expected Accuracy and Self-Trust (9 Marks)**
  *   **World Probabilities (2 marks):** Correct derivation of $B$'s distribution (0.8, 0.1, 0.1).
  *   **Expectation Calculation (2 marks):** Correct expected loss values (0.25 vs 0.50).
  *   **Propriety Connection (2 marks):** Noting that $B$ preferring itself is a result of the scoring rule being strictly proper.
  *   **Philosophical Cost (3 marks):** Articulating the "self-trust" problem: a coherent agent cannot regard a disagreeing coherent peer as more accurate.

  **Named Errors (Deduct 2 marks each, up to 5 errors total)**
  1.  **The Probability Error:** Claiming that the dominance argument requires assigning probabilities to worlds to show $A$ is worse than $C$. (Dominance is world-by-world).
  2.  **The Maximin Confusion:** Arguing that $B$ is irrational because it has a higher worst-case loss than $C$. (Coherent functions are not ruled out by maximin in this framework).
  3.  **The Propriety Mistake:** Stating that strict propriety is what justifies Probabilism. (Propriety justifies reporting true credences/expected accuracy; dominance justifies Probabilism).
  4.  **The Fact/Value Slide:** Claiming that because $B$ *expects* to be more accurate, $B$ *is* more accurate. (The calculation is about rational expectation, not truth).
  5.  **The Incoherent Expectation:** Calculating expected accuracy for $B$ using a probability distribution that does not match $B$'s credences (e.g., assuming uniform weights).

  **Grading Distinctions**
  *   **A Answer (20-25 marks):** Contains all correct calculations. Clearly distinguishes between the *role* of dominance (ruling out incoherence) and the *role* of expected accuracy (choosing among coherent options). Articulates the self-trust cost not as a failure of the theory, but as a necessary consequence of coherence + propriety. Addresses the "coincidence" of $C$ as geometrically local.
  *   **B Answer (15-19 marks):** Correct calculations. Identifies that $C$ wins maximin and $B$ wins expected accuracy. May struggle to explain *why* dominance doesn't apply to $B$, or may treat the self-trust issue as a simple paradox rather than a structural feature of propriety.

  **Note on Dissenting Views**
  A candidate may argue that Maximin *should* be the fundamental norm (e.g., under radical uncertainty). To earn full marks on Part (b) and (c) while arguing this, they must: (1) Acknowledge that this rejects the standard accuracy-first reliance on expected accuracy; (2) Explain why ignoring the agent's specific credences (evidence) is preferable to the self-trust cost; and (3) Consistently apply maximin to the calculations in (c) rather than switching to expectation.
