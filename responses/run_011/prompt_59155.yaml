answer: |-
  This is an exceptionally sharp observation. You have identified the engine that drives the most robust forms of contemporary skepticism about free will (specifically Derk Pereboom's "Hard Incompatibilism" and Galen Strawson's "Basic Argument"), as well as similar moves in metaethics (Mackie's Error Theory) and epistemology (Global Skepticism).

  You are correct that standard argumentation textbooks do not have a specific label for this *dialectical trajectory*. They catalog static fallacies or inference rules, but this is a dynamic maneuver: a specific way of metabolizing an objection to expand the scope of a conclusion.

  Here is an analysis of your three questions, structured for use in a thesis proposal.

  ### 1. Does this move have an established name?

  There is no single canonical term in informal logic or the free will literature that isolates this specific dialectical pattern. Your shortlist is astute, but each candidate fails to capture the specific *scope-expansion* dynamic you have identified. Here is why:

  *   **Biting the Bullet:** This refers to accepting an unpalatable consequence that follows *from one's own stated premises*. In your pattern, the proponent accepts a consequence pointed out by the *objector* (that the argument applies to indeterminism too), which was *not* part of the proponent's original commitment (which was likely just "Determinism rules out free will"). Biting the bullet preserves the theory's scope; your pattern expands it.
  *   **Grasping the Horns of a Dilemma:** As you noted, this traditionally means denying one of the conditional premises in a dilemma (e.g., denying that Determinism $\rightarrow$ No Control). Your pattern involves *affirming* both conditionals (Determinism $\rightarrow$ No Control; Indeterminism $\rightarrow$ No Control) to force the negative conclusion. This is technically *constructing* a dilemma rather than grasping its horns.
  *   **Tu Quoque:** This is an ad hominem strategy used to neutralize an objection by showing the objector is guilty of the same fault. It is defensive and usually leaves the truth value of the original claim untouched. Your pattern is offensive; it uses the shared fault to establish a stronger truth claim.
  *   **Modus Tollens $\rightarrow$ Modus Ponens:** This describes the logical flip (Objector: "If your argument works, skepticism is true. Skepticism is false. So your argument fails." Proponent: "If your argument works, skepticism is true. Your argument works. So skepticism is true."). While structurally accurate, this labels the *inference*, not the *dialectical strategy* of absorbing an overgeneralization objection.
  *   **Hard Incompatibilism:** This labels the *resulting position*, not the argumentative route.
  *   **Popper's Immunizing Stratagems:** You are right to reject this. Immunization protects a specific hypothesis from falsification by adding ad hoc clauses. Your pattern does not protect a specific hypothesis; it abandons a specific hypothesis (Incompatibilism) for a universal one (Skepticism). It is a *transformation* rather than a *fortification*.

  **The Nearest Existing Concepts:**
  *   **Argument from Parity:** In the manipulation literature, this is the closest existing term. It asserts that if Case A (manipulation) and Case B (determinism) are relevantly similar, they must have the same verdict. However, "Parity" usually describes the *premise*, not the dialectical move of accepting an objection to universalize the conclusion.
  *   **Global *Reductio*:** In epistemology, when a skeptic accepts that their argument undermines their own assertion, they are sometimes said to be offering a "global *reductio*." But this lacks the nuance of the *objection-driven* scope expansion you noticed.

  ### 2. Is there anything systematically interesting about the move?

  Yes. The move has a distinct logic, and its legitimacy hinges entirely on **exhaustiveness** and **burden shifting**.

  **The Logic:**
  1.  **Initial Claim:** $D \rightarrow \neg FW$ (Determinism implies No Free Will).
  2.  **Objection (Proves Too Much):** Your principle $P$ entails $\neg D \rightarrow \neg FW$ (Indeterminism implies No Free Will).
  3.  **Response (Universalization):** Accept $P$. Assert $(D \lor \neg D)$ is exhaustive. Conclude $\neg FW$ (categorical).

  **Conditions for Legitimacy:**
  *   **Exhaustiveness of the Logical Space:** This is the critical vulnerability. The move is valid only if the disjunction ($D \lor \neg D$, or Manipulated $\lor$ Non-Manipulated) covers all metaphysically coherent possibilities. If there is a "third way" (e.g., non-causal agenthood, or a form of compatibilism that escapes the manipulation intuition), the universalization fails. The Hard Incompatibilist must argue that *all* coherent accounts of action fall under the net of Principle $P$.
  *   **Non-Self-Defeat:** The universalized conclusion must not undermine the conditions necessary for the argument itself. (e.g., A skeptic who argues "No assertions are justified" defeats themselves. A skeptic who argues "No one is morally responsible" does not necessarily defeat themselves, as assertion does not require moral responsibility.)
  *   **Burden of Proof Shift:** Initially, the proponent only had to defend $D \rightarrow \neg FW$. By accepting the objection, they inherit the burden of defending $\neg D \rightarrow \neg FW$. They cannot simply ride the objector's coattails; they must provide positive reasons why indeterminism *also* fails to deliver control. If they cannot, the move is merely rhetorical.

  **Systematic Interest:**
  This move shifts the debate from **Metaphysics** to **Conceptual Analysis**.
  *   *Before the move:* The debate is about the world (Is determinism true?).
  *   *After the move:* The debate is about the concept (Does *any* causal structure support the kind of control required for free will?).
  This is why the move is attractive to skeptics: it makes their conclusion immune to empirical discovery. Whether physics finds determinism or chance, the skeptic wins.

  ### 3. Coining a Term

  Since no established term fits, I propose you stipulate a definition for your thesis. This allows you to carve the phenomenon precisely without being bound by the baggage of existing terms.

  **Proposed Term:** **Dialectical Universalization**

  **Definition:**
  A dialectical maneuver in which a proponent, faced with an objection that their argument overgeneralizes (i.e., applies to cases they did not intend to target), accepts the overgeneralization. The proponent argues that the logical space of alternatives is exhaustive, and thereby converts a conditional conclusion (true only if $X$ is the case) into a categorical conclusion (true regardless of $X$).

  **Criteria for Application:**
  1.  **Objection-Dependent:** The universal claim is offered *in response* to an overgeneralization objection, not as the opening gambit.
  2.  **Scope Expansion:** The conclusion's scope widens from a subset of possibilities to the entire logical space.
  3.  **Absorptive:** The proponent explicitly validates the objector's reasoning rather than refuting it.

  **What Falls Outside (Exclusions):**
  *   **Mere Bullet-Biting:** If I claim "All actions are determined" and you say "That implies no free will," and I say "Yes," that is bullet-biting. I am not expanding my claim; I am accepting a consequence of my original claim.
  *   **Standard *Reductio*:** If I argue for $P$, you show $P \rightarrow$ Absurdity, and I say "You're right, $P$ is false," that is a standard *reductio*. There is no expansion of scope, only a negation of the premise.
  *   **Disjunctive Syllogism:** If I argue $(A \lor B) \rightarrow C$, and you grant $A \lor B$, concluding $C$ is just logic. *Dialectical Universalization* requires that the $(A \lor B)$ premise was *forced by the objection*, not present in the original argument.

  **Boundary Cases (Where to be Unsure):**
  1.  **The Pyrrhonian Skeptic:** When a skeptic argues "No knowledge is possible," and the objector says "Then you don't know that," and the skeptic says "I claim nothing is known, including this," is this *Dialectical Universalization*?
      *   *Verdict:* **Borderline.** It absorbs the objection, but it doesn't necessarily *expand* the scope (the skeptic likely intended the claim to be global from the start). It counts only if the skeptic started with a specific doubt (e.g., "Sensory knowledge is impossible") and expanded to global doubt only after the objection.
  2.  **Moral Error Theory:** Mackie argues moral values don't exist. An objector says, "Your argument relies on queerness, but epistemic values are just as queer." If Mackie replies, "Yes, epistemic values don't exist either," is this Universalization?
      *   *Verdict:* **Yes.** This fits perfectly. The objection (proves too much) is absorbed to create a global error theory.

  ### Recommendation for Your Proposal

  You should explicitly frame this as **"Dialectical Universalization."** It gives you a tool to critique the Hard Incompatibilist without getting bogged down in the metaphysics of determinism.

  Your critical question becomes: *Is the logical space truly exhaustive?*
  For example, in the manipulation case, the Hard Incompatibilist uses *Dialectical Universalization* to say "Manipulation and Determinism are the same." But a Compatibilist might argue there is a third option: **Historical Compatibilism**, where the *origin* of the reasons matters, but not in a way that requires indeterminism. If the Hard Incompatibilist uses *Dialectical Universalization* to ignore this third option, they are begging the question.

  This observation is thesis-worthy. It cuts through the noise of the free will debate to expose the structural architecture of the skepticism. Stick with the carving you have done; it is precise and philosophically fertile.
