answer: |-
  Here is a procedure designed for your constraints: three hours, no new evidence, committee-facing output. It treats models not as truth-claims but as *argument structures* where assumptions are premises and outputs are conclusions. Your job is stress-testing the load-bearing walls.

  ### The Load-Bearing Audit (3-Hour Procedure)

  **Phase 1: Runnability & Provenance (30 mins)**
  *   **Question:** Can I manipulate the key drivers?
  *   **Test:** Open the file. Locate the three parameters that contribute most to the final cost-effectiveness ratio (usually highlighted in a sensitivity tornado chart or identifiable by magnitude). Can you change them?
  *   **Termination:** If the model is a PDF or locked sheet, verdict is **Don't Use**. Exception: only if the methodology is so standard (e.g. standard QALY calculation) that the numbers alone suffice. Otherwise, you cannot test sensitivity, and you cannot audit laundering.
  *   **Question:** Where did the key drivers come from?
  *   **Test:** Trace the citation for the top three parameters.
  *   **Assumption Laundering Check:** Was the parameter estimated in a context materially different from this application? (e.g. a wage elasticity from the US labour market applied to a rural Ugandan cash scheme).
  *   **Sufficient Answer:** "Context matches" or "Sensitivity analysis shows this parameter doesn't matter." If context mismatches *and* it's load-bearing, flag for Phase 2.

  **Phase 2: The Friedman Filter (90 mins)**
  This is where you handle the "false assumptions" defence. You are looking for *structural validity* rather than predictive accuracy, since you cannot test predictions.

  *   **Question:** Is the assumption descriptively false?
  *   **Test:** Compare assumption to known base rates or obvious reality (e.g. "zero leakage", "perpetual effects").
  *   **If No:** Assumption passes. Move on.
  *   **If Yes:** Proceed to the Selection Mechanism Test.
  *   **Question:** Is there a selection mechanism that enforces the 'as-if' behaviour?
  *   **Definition:** *Selection Mechanism:* A feedback loop where agents who do not behave according to the assumption are removed or corrected by the environment (e.g. firms going bankrupt, traders losing money).
  *   **Test:** Ask the builder: "What force punishes agents who deviate from this assumption?"
  *   **Sufficient Answer:** In markets: "Competitors undercut them." In charities: Usually there is no answer. Beneficiaries don't go bankrupt if they spend cash 'wrongly'.
  *   **Verdict Logic:**
      *   If there is **no selection mechanism** AND the assumption is **false** AND it is **load-bearing** (moves output >20%): The Friedman defence fails. Verdict leans **Don't Use**.
      *   If there is **no selection mechanism** AND the assumption is **false** BUT it is **not load-bearing** (moves output <5%): The Friedman defence holds. The falsehood is irrelevant. Verdict leans **Use**.
      *   If the assumption is **out-of-domain** (e.g. linear growth in a saturating system): This is not a false simplification; it is a category error. Verdict leans **Don't Use** regardless of sensitivity, because the model breaks at the margins you care about.

  **Phase 3: Value Judgements vs. Technical Judgements (30 mins)**
  *   **Question:** Which parameters are empirical claims and which are moral weights?
  *   **Test:** Identify discount rates, equity weights, and outcome metrics (e.g. lives saved vs. life-years).
  *   **Sufficient Answer:** "This number reflects how much we value the future relative to the present."
  *   **Action:** Do not verdict these yourself. Mark them as **Committee Decisions**. Your report says: "Model assumes 3% discount rate; if committee prefers 5%, result drops by X%."
  *   **Reason:** If you reject a model because you dislike their discount rate, you are vetoing policy, not auditing maths.

  **Phase 4: Verdict Mapping (30 mins)**
  Write the paragraph. Map your findings to the three options:

  1.  **Use:** No load-bearing false assumptions without selection mechanisms. Laundering checked. Value parameters clearly flagged.
  2.  **Use with Caveats:** Load-bearing assumptions are questionable but plausible; or key parameters are laundered but context is close enough; or value judgements dominate the uncertainty. The number is a 'rough guide', not a precise metric.
  3.  **Don't Use:** Key drivers rely on false assumptions with no selection mechanism *and* high sensitivity; or the model is out-of-domain; or it is unrunnable.

  ---

  ### Running the Procedure on Your Cases

  #### Case A: Cash Transfer (Perpetuity vs. Fungibility)
  *   **Phase 1:** Runnable. Top drivers: Perpetuity assumption, Fungibility rate.
  *   **Phase 2:**
      *   *Fungibility:* False (people divert cash), but sensitivity is 4%. **Irrelevant falsehood.** Passes Friedman.
      *   *Perpetuity:* False (effects decay), sensitivity is 300% (factor of three). No selection mechanism (beneficiaries aren't punished if effects fade). **Load-bearing falsehood.** Fails Friedman.
      *   *Domain:* Linear perpetuity is out-of-domain for almost all social interventions (diminishing returns exist).
  *   **Phase 3:** Discount rate likely involved in perpetuity calc. Flag for committee.
  *   **Verdict:** **Don't Use.**
  *   **Reasoning:** The headline number is driven by a mechanism known to be false (permanent linear effects) in a context where no force enforces it. The number is not just uncertain; it is structurally bogus. You can fund the programme, but you cannot use this model to justify the cost-effectiveness.

  #### Case B: Job Training (Rational Enrolment)
  *   **Phase 1:** Runnable. Top driver: Take-up rate linked to expected utility.
  *   **Phase 2:**
      *   *Assumption:* Agents are expected utility maximisers. False (bounded rationality).
      *   *Selection:* Builder claims 92% take-up validates this.
      *   *Test:* Does 92% take-up prove rational calculation? No. It could prove low cost, high pressure, or lack of alternatives. Is there a selection mechanism? No. People don't die if they make bad training choices.
      *   *Sensitivity:* Not stated, but if the model hinges on *why* they enrolled to predict *completion*, the mechanism matters.
  *   **Phase 3:** Value of earnings gain vs. cost is a policy choice.
  *   **Verdict:** **Use with Caveats.**
  *   **Reasoning:** The assumption is false and lacks a selection mechanism, but the observed data (92% take-up) anchors the model in reality better than Case A. However, you must explicitly state: "Model assumes rational selection; if take-up is driven by coercion or misinformation, completion rates may differ." The committee must accept the risk that the mechanism is wrong.

  #### Case C: Fave Charity (Zero Leakage, Constant Prices)
  *   **Phase 1:** Runnable. Top drivers: Leakage, Input Prices.
  *   **Phase 2:**
      *   *Assumption:* Zero leakage, constant prices. False (leakage exists, prices fluctuate).
      *   *Selection:* None.
      *   *Sensitivity:* Moves result by 2%.
      *   *Friedman Test:** The assumptions are descriptively false, but they are not load-bearing. The model is robust to these errors.
  *   **Phase 3:** None specific.
  *   **Verdict:** **Use.**
  *   **Reasoning:** This is the one you will hate. The assumptions are lies. But in modelling, a lie that doesn't change the answer is not a error; it is a simplification. To reject this is to demand realism over utility. Your report must say: "Assumptions on leakage and prices are unrealistic but non-material to the outcome."

  ---

  ### What This Procedure Cannot Do

  1.  **It cannot detect bad faith.** If a builder runs 100 sensitivity tests and only shows you the one that works, this audit catches it only if you demand to see the distribution. You are relying on their file integrity.
  2.  **It cannot resolve value conflicts.** If the committee disagrees on the discount rate, the model cannot tell them who is right. The procedure only isolates the disagreement; it does not solve it.
  3.  **It cannot validate the counterfactual.** You noted that no experiment will check the output. This procedure accepts that. It judges the *plausibility of the bridge* between input and output, not the destination. You are checking if the map is internally consistent, not if it matches the territory.
  4.  **It cannot save a model from 'Garbage In, Garbage Out'.** If the input data is systematically biased (e.g. self-reported outcomes), sensitivity analysis on parameters won't catch it. You need a separate data-quality check, which this procedure does not cover.

  ### The Friedman Reply Script

  When a builder says: *"Assumptions don't need to be realistic, only predictions matter."*

  **Your Reply:** "Friedman's instrumentalism requires a selection mechanism that weeds out agents who don't behave according to the assumptions. In a market, profit does that. In this programme, what is the feedback loop? If there isn't one, the assumption must be plausible *or* the result must be insensitive to it. Which is it?"

  If they say "It's insensitive," demand the sensitivity table. If they say "It's plausible," demand the evidence. If they say "It doesn't matter," you have them: if it doesn't matter, change the assumption to something realistic and re-run. If the result moves, it mattered. If it doesn't, your objection is moot.
