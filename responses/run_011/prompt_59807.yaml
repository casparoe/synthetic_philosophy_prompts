prompt: |-
  I've been reading the rationalist blogs since the Overcoming Bias days, and for years my attitude to models was basically the Sequences one: the map isn't the territory, distrust the pretty number. Now I have a job where that suspicion has to become operational, and I'm finding that free-floating scepticism is worth nothing in a meeting.

  Setup: I review cost-effectiveness models for a small grantmaker. Four to six spreadsheets a month, each gating somewhere between £30k and £400k, and my verdict goes to a five-person committee that's mostly non-quantitative. I get about three hours per model. I can open the file, change an assumption, watch the output move — I can't generate any new evidence, and I have no formal economics training. The committee wants one of "use it", "use it with these caveats", "don't use it", plus a paragraph readable in two minutes.

  The reason I'm asking here rather than on an econ forum is that its the philosophy-of-modelling literature that seems to have the distinction I need, and nobody in my office has read any of it. Concretely: Friedman's F-twist — the claim that wildly false assumptions are no objection to a theory and may even mark it as significant, because only predictive accuracy matters. Model builders wave this at me constantly, and the rebuttals I can produce on my own are either too weak ("but the assumptions are obviously false!") or too strong (they'd condemn every useful model ever built). Two half-formed thoughts I want you to sharpen or kill:

  - Nearly every model I review makes a claim about a counterfactual that will never be tested. No holdout, nobody will ever run the experiment that checks the key output. So "judge it by its predictions" seems to lose all content exactly where I need it. Is that right, or is there a way the F-twist still bites?
  - The billiard-player / surviving-firms move depends on some selection process out there making agents behave *as if* the model were true. Charity programmes don't have one. So maybe the usable question isn't "is this assumption realistic?" but "is there anything in this setting that would make the as-if come out true?"

  There's also a failure mode I keep hitting and don't have a name for, so I've started calling it assumption laundering: the model itself contains no dodgy assumption, but a key parameter is imported from another study estimated under a completely different assumption set, so the dodginess arrives through the citation rather than through the model.

  What I want is a procedure my team can actually run in three hours: the questions in order, what counts as a sufficient answer to each, and where it terminates in each of the three verdicts. It has to (1) separate assumptions that are false but irrelevant to the output in the range that matters, from ones that are load-bearing, from ones that are fine inside the model's intended domain but are being applied outside it — because I suspect only the first is what the F-twist can defend, if anything; (2) contain a step for replying to a builder who invokes Friedman, and say when that reply genuinely succeeds, so we don't flag everything unrealistic by reflex; (3) say what to do when you can't run the numbers at all, e.g. the model arrives as a PDF; and (4) mark every point that is really a judgement call in a procedure costume — including where the question turns out to be about values (which outcome metric, what discount rate, how much weight on the tail) and so has to go to the committee rather than to me.

  Then run it on three invented cases. (A) A cash transfer model assuming 100% of the grant is spent on the target good and that an effect measured at 12 months continues linearly in perpetuity; a sensitivity run shows the perpetuity assumption moves the headline figure by a factor of three, the fungibility one by 4%. (B) A job training model where people enrol iff expected earnings gain exceeds cost — i.e. as-if expected utility maximisers — and observed take-up is 92%, which the builder says validates the assumption. (C) A model from an organisation I like and have donated to personally, assuming zero administrative leakage and constant input prices, assumptions I think are flatly false, but where a sensitivity run shows they move the result by 2%. I want at least one verdict I'm going to hate, and I want you to say plainly what the procedure can't do.

  British English, please. No reading list and no citations — I can't look anything up and it'd be decoration. If a distinction you use has a standard label, give me the label plus one sentence on what it means; that's plenty.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **User Background:** Long-time rationalist reader (Overcoming Bias, Sequences), now working as a grantmaker reviewing cost-effectiveness models (4-6/month, £30k-£400k grants, 3 hours/model).
      *   **Problem:** Needs to operationalize scepticism. "Map isn't territory" is too vague for committee decisions. Needs to handle Friedman's F-twist (instrumentalism: assumptions don't need to be realistic, only predictions matter).
      *   **Specific Constraints:**
          *   British English.
          *   No reading list/citations (just labels + 1 sentence if standard).
          *   Needs a concrete procedure (questions in order, sufficient answers, termination conditions for 3 verdicts).
          *   Needs to address:
              1.  Counterfactuals that can't be tested (does F-twist bite?).
              2.  Selection processes (charity vs. markets).
              3.  "Assumption laundering" (imported parameters).
              4.  Distinguish false/irrelevant vs. false/load-bearing vs. out-of-domain assumptions.
              5.  Handle Friedman rebuttals.
              6.  Handle non-runnable models (PDFs).
              7.  Mark value judgements vs. technical judgements.
          *   Needs to run the procedure on three invented cases (A, B, C) with at least one hated verdict.
          *   Needs to state plainly what the procedure *can't* do.

  2.  **Deconstruct the Philosophy/Methodology:**
      *   **Friedman's F-twist:** Instrumentalism. Assumptions are descriptive falsehoods allowed if predictions hold.
      *   **User's Insight 1:** Counterfactuals can't be tested. F-twist relies on prediction. If prediction is impossible, F-twist loses force. *Refinement:* Shift from "predictive accuracy" to "structural validity" or "mechanism plausibility" when prediction is impossible.
      *   **User's Insight 2:** Selection processes (billiard players). Markets select for profit-maximising behaviour even if agents aren't calculating. Charities don't have that selection pressure. *Refinement:* Check for *incentive compatibility* or *feedback loops* that enforce the 'as-if' behaviour.
      *   **Assumption Laundering:** Importing parameters from incompatible contexts. *Refinement:* Trace provenance of key parameters.
      *   **The Procedure:** Needs to be a triage tool. 3 hours is tight.
      *   **Verdicts:** Use, Use with Caveats, Don't Use.

  3.  **Drafting the Procedure:**
      *   *Goal:* Operationalize the distinction between "helpful simplification" and "fatal flaw".
      *   *Step 1: Provenance & Transparency.* (Can I touch it? Where did numbers come from?)
      *   *Step 2: The Friedman Test.* (Is the assumption false? Does it matter? Is there a selection mechanism?)
      *   *Step 3: Sensitivity & Load-Bearing.* (What moves the needle?)
      *   *Step 4: Value Judgements.* (What belongs to the committee?)
      *   *Termination:* Map findings to verdicts.

  4.  **Refining the Friedman Rebuttal:**
      *   Friedman works when there's a *selection mechanism* (evolution, market competition) that weeds out non-conformers.
      *   In charities, beneficiaries don't "go bankrupt" if the model is wrong. Donors might, but slowly.
      *   So, if the builder says "assumptions don't need to be real," ask: "What force makes agents behave as if they were real?" If no force, the assumption must be plausible *or* the result must be insensitive to it.

  5.  **Addressing the Cases:**
      *   **Case A (Cash Transfer):** Perpetuity assumption moves result 3x. Fungibility moves 4%.
          *   *Analysis:* Perpetuity is load-bearing and implausible (effects rarely last forever linearly). Fungibility is false but irrelevant.
          *   *Verdict:* Don't Use (or strong Caveats). Probably "Don't Use" because the main driver is fantasy.
      *   **Case B (Job Training):** Enrolment assumption (EU maximisers). 92% take-up.
          *   *Analysis:* Builder says 92% validates the model. But 92% take-up might just mean low cost or high pressure, not rational calculation. No selection mechanism enforcing rationality.
          *   *Verdict:* Use with Caveats (flag the mechanism claim).
      *   **Case C (Fave Charity):** Zero leakage, constant prices. Moves result 2%.
          *   *Analysis:* Assumptions are false. But sensitivity shows they don't matter (2% move). This is the "false but irrelevant" case Friedman actually defends.
          *   *Verdict:* Use it. (This is the one the user might hate because it feels like letting slide obvious falsehoods).

  6.  **Developing the Procedure Steps (Iterative refinement):**
      *   *Step 0: Runnability.* If PDF, stop. Verdict: Don't Use (unless exceptional).
      *   *Step 1: The Launder Check.* Trace top 3 drivers. Where did they come from? Context match?
      *   *Step 2: The Friedman Filter.* For each key assumption: Is it false? If yes, is there a selection mechanism? If no, is it sensitive?
      *   *Step 3: The Value Check.* Discount rates, metrics. Flag for committee.
      *   *Step 4: Verdict Mapping.*

  7.  **Addressing "What the procedure can't do":**
      *   It can't find truth.
      *   It can't resolve value conflicts.
      *   It can't fix bad data.
      *   It can't protect against bad faith actors who game the sensitivity analysis.

  8.  **Tone and Style:**
      *   British English (programme, centre, realise, etc.).
      *   Direct, operational, no fluff.
      *   Respectful of the user's background (rationalist lingo okay but grounded).

  9.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the counterfactual issue? Yes, by shifting focus to sensitivity when prediction is impossible.
      *   *Check:* Did I address the selection process? Yes, in the Friedman Filter.
      *   *Check:* Is the verdict on Case C the "hated" one? Yes, accepting a model with known false assumptions because they aren't load-bearing is often emotionally difficult but methodologically sound.
      *   *Check:* Is the procedure doable in 3 hours? Needs to be tight. Focus on *key drivers* not every cell.
      *   *Check:* Value judgements. Need to explicitly separate "is this number right?" from "is this value acceptable?".

  10. **Final Polish:** Ensure the distinction between *instrumental validity* (does it work?) and *structural validity* (is the mechanism real?) is clear without using too much jargon. Ensure the "Assumption Laundering" term is integrated.

  *(Self-Correction on Case A)*: If perpetuity moves it by 3x, that's huge. But maybe "Use with Caveats" is better if the direction is right? No, if the main driver is known false (effects rarely perpetuate linearly), the magnitude is unreliable. "Don't Use" for allocation purposes, maybe "Use for directionality". Let's stick to the prompt's verdict options. "Don't Use" is safer for a grantmaker gating money.
  *(Self-Correction on Case C)*: User says "assumptions I think are flatly false". If sensitivity is 2%, Friedman wins. This is the hard pill to swallow. I will make sure this is the "hated" verdict.

  *(Refining the Procedure Name)*: Let's call it the "Load-Bearing Audit".
  *(Refining the Friedman Rebuttal)*: The "Selection Mechanism Test".

  *(Final check on constraints)*: British English. No citations. Labels + 1 sentence. 3 cases. Procedure steps. What it can't do.

