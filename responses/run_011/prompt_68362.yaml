answer: |-
  ### Pass 1: Brainstorming Load-Bearing Examples

  *   **Candidate 1: The Murderer at the Door.**
      *   *Rejection:* Explicitly forbidden by your constraints; additionally, it triggers a cached consequentialist vs. deontological script that bypasses Augustine's specific metaphysics of speech.
  *   **Candidate 2: The White Lie to Spare Feelings.**
      *   *Rejection:* Too trivial; risks framing the argument as mere social etiquette rather than ontological violation, allowing the audience to dismiss it as "low stakes."
  *   **Candidate 3: The Perjurer in Court.**
      *   *Rejection:* Too legalistic; rationalists view oaths as conventional contracts, which invites a utilitarian calculation about judicial integrity rather than the nature of assertion itself.
  *   **Candidate 4: The Spy/Undercover Agent.**
      *   *Rejection:* High stakes, but conflates lying with deception; Augustine permits deception via silence, so this case requires too much upfront clarification to be load-bearing.
  *   **Candidate 5: The "Truthful Liar" (Intent to deceive, belief in falsehood, accidental truth).**
      *   *Selection:* This case isolates the definition from the consequence. It forces the audience to confront the claim that the sin lies in the mind-sign mismatch, not the falsity of the proposition or the harm done. It breaks their instrumental model immediately.

  ***

  ### Pass 2: The Teaching Plan

  **1. The Through-Line**
  The wrongness of lying lies not in the falsity of the statement or its harmful effects, but in the deliberate mismatch between what the speaker believes and what the speaker signs.

  **2. Block-by-Block Timeline and Dependencies**
  Your hypothesis is correct: the definition must land first. Without the specific definition of a lie as a *willful mismatch between mind and sign*, the subsequent grading and prohibitions look like arbitrary rules or disguised consequentialism. However, the definition itself depends on a prior teleological claim about what speech *is*.

  *   **Block 1: The Teleology of Speech and Definition (0–15 mins)**
      *   *Prerequisites:* None.
      *   *Content:* Establish that natural signs (smoke) signify without will, but human signs (words) exist *only* to convey what is in the mind. Therefore, to sign what is not in the mind is to abuse the function of the organ. Define lie: Asserting X while believing Not-X.
      *   *Dependencies:* Required for Block 2 (Case) and Block 3 (Grading).
  *   **Block 2: The Load-Bearing Case (15–30 mins)**
      *   *Prerequisites:* Block 1 (Definition).
      *   *Content:* The "Truthful Liar." A speaker intends to deceive, believes they are speaking falsehood, but accidentally speaks truth.
      *   *Dependencies:* Required for Block 4 (Objections) to show the definition is operational, not theoretical.
  *   **Block 3: The Grading Principle and Permission to be Silent (30–40 mins)**
      *   *Prerequisites:* Block 1 (Definition).
      *   *Content:* Explain the hierarchy of lies not by harm, but by the good violated. Explain that silence is not a sign, so concealment is permitted.
      *   *Dependencies:* Required for Block 5 (Steelman) to show the system's internal coherence.
  *   **Block 4: Objection Triage (40–50 mins)**
      *   *Prerequisites:* Block 2 (Case).
      *   *Content:* Address the five specific objections using the groundwork laid in Blocks 1–3.
      *   *Dependencies:* Required for Block 5 (Steelman) to clear away misconceptions.
  *   **Block 5: The Steelman and Theological Verdict (50–55 mins)**
      *   *Prerequisites:* Block 3 (Grading) and Block 4 (Objections).
      *   *Content:* Identify the unique value of the argument (internal integrity) and assess its secular viability.
      *   *Dependencies:* Leads directly into Block 6.
  *   **Block 6: The Check (55–60 mins)**
      *   *Prerequisites:* All previous blocks.
      *   *Content:* The diagnostic question to test understanding.

  **3. The Load-Bearing Case**
  *   **Primary Case:** The Truthful Liar.
      *   *Scenario:* A prisoner is interrogated. He intends to mislead the interrogator to protect his comrades. He believes the comrades are at Location A, so he says "They are at Location B." In reality, the comrades moved to Location B without his knowledge.
      *   *Properties it must have:* (1) Intent to deceive, (2) Belief that the statement is false, (3) Actual statement is true, (4) No harm results (the interrogator is misled about the location, but the truth was spoken).
      *   *Properties it must lack:* Any actual damage to the epistemic commons (since truth was uttered) or immediate harmful consequence (since the comrades were actually there).
      *   *Why it works:* It forces the rationalist to admit that on their model, this is a *good* act (truth told, friends saved), while on Augustine's model, it is a *sin* (mind/sign mismatch). This creates the necessary friction.
  *   **Backup Case:** The Joke/Play Case.
      *   *Scenario:* An actor on stage says "I am the King."
      *   *Why:* It clarifies that lying requires the intent to be believed. If the context signals "do not believe me," no sign is being given in the strict sense.
  *   **Failure Signal:** By minute 15, if a participant says, "But he told the truth, so how can it be a lie?" and you cannot pivot them back to the *intent* rather than the *outcome*, the definition has not landed. You must stop and reiterate: "For Augustine, the lie is in the heart, not the air."

  **4. The Grading of Lies**
  *   **The Ordering Principle:** The scale is monotone along the dimension of **the gravity of the good sacrificed to the lie**, modified by the **intent of the liar**.
  *   **Explanation:** It is not primarily about harm done to the listener. It is about what truth is being violated. Lies about divine things are worst because they violate the highest truth. Lies that cause injustice are next. Lies told for mere fun are lower. Lies told to save a life are the "least bad," but still sins, because they sacrifice the integrity of speech for the safety of the body.
  *   **The Strain:** The principle strains when comparing lies told to save one's own life versus lies told to save another's. Augustine wavers here.
  *   **Advice:** Do not touch the specific eight-fold list. It is too theological. Stick to the axis: **Malice vs. Beneficence.** Lies told for gain are worse than lies told to help, but both are lies. The "least bad" lies are those told to protect someone from bodily violation without harming anyone else. Acknowledge that Augustine still calls these sins, just forgivable ones.

  **5. Objection Placement (Triage)**
  *   **(a) This is just Kant four centuries early.**
      *   *Status:* Head off by construction.
      *   *Placement:* Block 1 (Definition).
      *   *Method:* Clarify that Kant argues from rational duty (contradiction in will), whereas Augustine argues from teleology (abuse of a natural function). Augustine is virtue-adjacent; Kant is deontological.
  *   **(b) Lying means asserting a falsehood, so this is really a debate about edge cases.**
      *   *Status:* Repaired afterwards.
      *   *Placement:* Block 2 (Case).
      *   *Method:* The Truthful Liar case proves this is not an edge case debate but a definitional divergence.
  *   **(c) The definition turns every novel and every joke into a lie.**
      *   *Status:* Head off by construction.
      *   *Placement:* Block 1 (Definition).
      *   *Method:* Define lying as signing with the *intent to be believed*. Fiction signals "do not believe this as fact."
  *   **(d) If silence and concealment are permitted, he has smuggled the calculation back in through the back door.**
      *   *Status:* Repaired afterwards.
      *   *Placement:* Block 3 (Grading/Silence).
      *   *Method:* Distinguish between *hiding* truth (withholding a sign) and *falsifying* truth (giving a false sign). One is omission, one is commission. The teleology of speech only governs what is spoken.
  *   **(e) Remove the theological premises and nothing is left.**
      *   *Status:* Repaired afterwards.
      *   *Placement:* Block 5 (Steelman).
      *   *Method:* Address honestly in the steelman section.
  *   **Misjudged Objection:** You have misjudged **(a)**. Rationalists often conflate all non-consequentialist ethics with Kant. Distinguishing Augustine's teleology from Kant's duty is crucial for credibility.
  *   **The Sixth Objection:** **"The Solipsism of Integrity."**
      *   *Content:* If the wrongness is entirely internal (mind/sign mismatch), why does the community matter? Why not lie if I can maintain my own internal calibration separately?
      *   *Cost:* This costs you the room because it attacks the link between individual integrity and the epistemic commons. You must argue that internal corruption inevitably leaks into external reliability.

  **6. The Steelman**
  *   **The Unique Respect:** Augustine locates the wrongness in the **speaker's relation to her own mind** (internal coherence), whereas the rationalist account locates it in the **speaker's relation to the community** (external coordination).
  *   **Why it works:** The rationalist account cannot explain why lying is wrong when *no one is deceived* (e.g., the Truthful Liar) or when deception *improves* coordination (e.g., a beneficial lie that stabilizes a system). Augustine accounts for the corruption of the agent herself. It protects the liar from instrumentalizing their own integrity.
  *   **Verdict on Theological Premises:** It survives **partially**. Without God, the argument becomes a secular virtue ethics claim about integrity. However, the *absolute* prohibition weakens. Augustine's absolutism relies on the idea that Truth is a divine substance we participate in; removing God makes Truth a human convention, which allows for exceptions. You must admit: Secularized, this is a strong presumption against lying, but the "never permissible" claim loses its ontological anchor.

  **7. Two Smaller Judgment Calls**
  *   **Biblical Hard Cases:** **Do not bring these in.**
      *   *Reason:* Your audience will find exegesis of divine rewards for deception (e.g., the Hebrew midwives) more embarrassing than illuminating. It distracts from the philosophical argument. Mention only that Augustine addresses them to show consistency, then move on.
  *   **Silence vs. Falsehood:** **This is the load-bearing move.**
      *   *Reason:* This is the only escape valve Augustine offers. If you sequence this poorly, the "Murderer at the Door" objection will crush the session.
      *   *Sequence:* Introduce this immediately after the Definition (Block 1) and before the Grading (Block 3). You must establish that one is never *obligated* to speak truth to those who have no right to it, only obligated not to speak falsehood. This neutralizes the "Murderer" case before it is fully raised.

  **8. Scope Cuts**
  *   **Safe to Drop:**
      *   *The polemic against sectarians:* Irrelevant to the core argument.
      *   *The grace controversies:* Too technical, distracts from the ethics of speech.
      *   *Latin terminology:* Use English equivalents (Sign vs. Thing).
      *   *Medieval reception:* Irrelevant for a 60-minute intro.
  *   **Lossy (Do Not Drop):**
      *   *The Teleology of Language:* You cannot cut the claim that language exists *only* to convey thoughts. If you cut this, the definition of lying as "mind-sign mismatch" appears arbitrary. This is the engine of the whole argument.

  **9. The Check**
  *   **The Question (Minute 55):** "I believe my friend is at Home. I want to deceive you, so I say 'He is at Work.' It turns out he actually went to Work without my knowledge. Did I lie?"
  *   **Good Answer:** "Yes. You asserted what you believed to be false. The mismatch occurred in your will, regardless of the outcome."
  *   **Merely Agreeable Answer:** "No, because you told the truth and no harm was done." (This indicates they reverted to their instrumental priors).
