answer: |-
  **1. Question Stem**

  Consider the following two cases regarding the nature of emotion.

  **Case 1 ("Cold Fear").** R. was badly bitten as a child and has spent thirty years avoiding dogs. When a large off-leash dog walks toward her on a path, her heart rate climbs, her palms sweat, she startles at a sudden noise, and she steps off the path. Asked immediately afterwards, she says plainly that she was not afraid: nothing seemed dangerous to her, she was not thinking about being bitten, and she has no experience she would describe as dread. She is not confused and has no motive to conceal anything; she is as confident of this as she is of what she ate for breakfast.

  **Case 2 ("Hot Calm").** S. sits waiting for the result of a biopsy. He is certain, and says he is certain, that the news will be devastating and that this is the worst thing that could happen to him. He reports a vivid, insistent sense of impending catastrophe that occupies his thoughts and that he cannot set aside. His heart rate, skin conductance, facial configuration, posture, and voice all remain within his normal resting range for the whole hour. He avoids nothing, seeks nothing out, and behaves exactly as he would have behaved had he been told the result was benign.

  Recall the three accounts of emotion: the **Judgment Account** (emotion is an evaluative judgment); the **Perception Account** (emotion is a perception of value); and the **Feeling Account** (emotion is a pattern of felt bodily change together with the experience that goes with it).

  **(a)** State what each of the three accounts says about whether R. fears the dog and about whether S. is afraid. For each account, identify the specific addition or concession it would need in order to avoid whichever verdict looks intuitively wrong in its case. Argue which of the three can absorb that concession least damagingly, defending your choice rather than merely announcing it. (18 marks)

  **(b)** Assess the objection that the stipulations have already settled the question, on the ground that to describe R. as avoiding and sweating, and S. as physiologically unmoved, is to describe them in vocabulary that one of the accounts privileges. (7 marks)

  *Recommended length: 1,000–1,200 words.*

  ***

  **2. Model Answer**

  The two cases present a dissociation between the components typically associated with emotion: physiological arousal, behavioral disposition, phenomenological experience, and cognitive evaluation. To answer (a), we must first map the verdicts.

  For the **Feeling Account**, Case 1 is an emotion (R. has the bodily pattern), but Case 2 is not (S. lacks bodily change). To save the intuition that S. is afraid, the Feeling Account must concede that some states we call "fear" are actually cognitive anxieties distinct from emotions proper. This is damaging: it excludes a paradigmatic instance of suffering from the category of emotion simply because the body is still.

  For the **Judgment Account**, Case 2 is an emotion (S. judges the situation catastrophic), but Case 1 is not (R. makes no evaluative judgment). To save the intuition that R. is afraid, the Judgment Account must concede that R.'s reaction is a non-emotional reflex—a mere startle mechanism triggered by memory, not a stance on the world. This concession is theoretically cheaper. Reflexes exist; distinguishing a reflexive flinch from an emotional response does not undermine the core claim that emotions are essentially evaluative.

  For the **Perception Account**, the verdicts are unstable. If perception requires consciousness, Case 1 is not an emotion (R. perceives no danger). If perception allows unconscious processing, Case 1 is an emotion. In Case 2, if S.'s "sense" is perceptual, it is an emotion; if it is intellectual, it is not. To handle both, the Perception Account must concede that "perception" here is metaphorical enough to include unconscious processing (for R.) but distinct from mere belief (for S.). This blurs the distinction between perception and judgment, risking the collapse of the account into the Judgment view.

  The Judgment Account absorbs its concession least damagingly. Emotions are fundamentally about how the world matters to us. In Case 1, the world did not matter to R. in that moment; her body reacted to a cue, but she did not register a threat. Calling this a "reflex" preserves the link between emotion and meaning. In Case 2, the world mattered immensely to S. The lack of physiological arousal is anomalous, perhaps due to suppression or habituation, but the evaluative stance is present. The cost to the Judgment Account is accepting that physiology is contingent, not constitutive. This is preferable to the Feeling Account's cost, which is accepting that one can be in a state of emotional terror without any bodily feeling. The latter severs the connection between emotion and the lived experience of the body, which is central to why we care about emotions in the first place.

  Regarding (b), the objection claims the stipulations beg the question. The description of R. uses behavioral and physiological vocabulary ("heart rate," "steps off") which the Feeling Account privileges as constitutive. The description of S. uses cognitive vocabulary ("certain," "worst thing") which the Judgment Account privileges. However, the stipulation that S. has a "vivid, insistent sense" attempts to capture phenomenology without physiology. This is not biased toward Judgment, but it does make the Feeling Account's task harder by stipulating away its necessary condition while affirming the sufficient condition of its rival. The cases are not circular, but they are constructed to force a choice between body and mind. The vocabulary is neutral enough to allow analysis, but the *structure* forces the accounts to reveal which component they treat as essential.

  ***

  **3. Marking Scheme (Total: 25 Marks)**

  **Part (a): Application and Evaluation (18 Marks)**

  *   **Mapping the Verdicts (6 marks):**
      *   2 marks: Correctly identifies Feeling Account says R=Emotion, S=Not.
      *   2 marks: Correctly identifies Judgment Account says R=Not, S=Emotion.
      *   2 marks: Correctly identifies Perception Account's instability or split verdict.
      *   *Penalty:* Deduct 2 marks if the candidate claims any account gives the "same" verdict for both cases without complex modification.

  *   **Identifying Concessions (6 marks):**
      *   2 marks: Feeling must exclude S.'s state as "non-emotional anxiety."
      *   2 marks: Judgment must classify R.'s state as "reflex/non-emotional arousal."
      *   2 marks: Perception must blur unconscious processing with conscious perception.
      *   *Penalty:* Deduct marks if the candidate suggests the accounts can simply deny the case facts (e.g., "Judgment says R. *did* judge").

  *   **Evaluating the Damage (6 marks) — *The First-Class Differentiator*:**
      *   6 marks: Provides a principled argument for why one concession is theoretically cheaper (e.g., reflexes are known entities vs. denying suffering is emotion). Commits to a winner.
      *   4 marks: Identifies the costs but hedges or concludes "it depends."
      *   2 marks: Lists costs without comparing them.
      *   *Characteristic Error:* An answer that treats the Judgment Account as refuted by Case 1 without noticing the "reflex" loophole loses all 6 marks in this section.

  **Part (b): The Stipulation Objection (7 Marks)**

  *   **Analysis of Vocabulary (4 marks):**
      *   Recognizes that physiological descriptions favor Feeling and cognitive descriptions favor Judgment.
      *   Notes that S.'s "sense" is the pivot point (is it feeling or thought?).
  *   **Judgment on Fairness (3 marks):**
      *   Argues whether this constitutes circularity or merely forced choice.
      *   *Penalty:* Claims the cases are "biased" without explaining how the vocabulary privileges a specific ontology.

  **Total:** 25 Marks.
  **First-Class Threshold:** 20+ Marks. Requires a definite commitment in Part (a) and a nuanced view of Part (b).
  **Competent Ceiling:** 16 Marks. Accurate mapping and concessions, but no comparative argument on "damage."

  ***

  **4. Common Error Note**

  Candidates who have memorised the taxonomy without grasping the dispute will typically map the views correctly (Part a, first 6 marks) but then stop. They will write: "Case 1 fits Feeling, Case 2 fits Judgment, therefore the debate is unresolved." These answers forfeit the 6 marks for "Evaluating the Damage" because they refuse to judge which concession is less damaging. They treat the question as a survey rather than a problem to be solved. Additionally, they often treat Case 2 as a simple "belief," failing to address why the "vivid sense" might still count as emotion for the Feeling account, losing marks in Part (b).

  ***

  **5. Fairness Check and Proposed Adjustment**

  **Assessment:** The case pair is slightly **weighted against the Feeling Account**.
  **Reasoning:** In Case 2, S. is described as having a "vivid, insistent sense of impending catastrophe." For a Feeling theorist, "sense" often implies a somatic marker. By stipulating *no* physiological change while affirming a "vivid sense," the case forces the Feeling Account to deny the existence of the very phenomenology it claims constitutes emotion. It makes the "No Emotion" verdict look absurdly counter-intuitive, punishing the Feeling Account more than the Judgment Account is punished in Case 1 (where calling something a "reflex" is scientifically plausible).

  **Smallest Change:** In Case 2, alter the description of S.'s experience to: "He reports a purely intellectual conviction of impending catastrophe... He reports *no* felt tension, tightness, or disturbance in his body."
  **Impact on Marking Scheme:** This clarifies that the "sense" is not a disguised feeling. In the Marking Scheme (Part a, Identifying Concessions), I would add a note: "Award full marks only if the candidate notes that the Feeling Account must deny S.'s 'conviction' qualifies as an emotion *despite* the reported suffering." This rewards candidates who notice the stipulation's pressure on the Feeling view.
