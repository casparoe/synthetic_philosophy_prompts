  | Circumstantial Narrowing | Limits the maxim to specific conditions (e.g., "idle" times) to avoid universal collapse. | Contradiction in Conception | If the condition is too specific, the maxim becomes trivial and fails to guide action. | Worked Case Study (Revision 1 & 2) |
  | End Re-description | Changes the purpose of the act from self-interest to neutral or beneficial ends. | Contradiction in Will | Changing the end changes the act entirely, potentially dodging the original moral issue. | Worked Case Study (Revision 2) |
  | Indexical Exclusion | Bans personal names or dates to ensure the maxim applies to all rational agents. | Both | Clients may argue their situation is uniquely specific, requiring personal indexing. | Terms & Conditions (Indexical Policy) |
  | Role Specificity | Allows indexing to professional roles rather than individual identity. | Contradiction in Conception | Roles must carry duties that are themselves universalizable, not just arbitrary titles. | Service Tiers (Tier 4) |
  | Conditional Proviso | Adds constraints (e.g., "no marginal cost") to ensure the universalized act is sustainable. | Contradiction in Conception | Adding too many conditions can make the maxim vacuous or impossible to ever enact. | Worked Case Study (Revision 2) |
