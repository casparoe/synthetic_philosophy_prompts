prompt: |-
  ok so i'm putting together a set of prompts and i want a satirical piece. here's the setup:

  Write the client-facing brochure and rate card for a boutique consultancy — something like "Universalizability Partners" — whose entire business is helping busy executives get their maxims through Kant's Formula of Universal Law. The conceit is that the test is real and the service genuinely works: these people aren't con artists, they're doing legitimate maxim-enginering, and they're proud of their rigor.

  Structure it like this:

  - A short pitch paragraph at the top, in the voice of a firm that is faintly offended at being confused with a PR shop, and that considers itself devout rather than cynical.
  - A rate card with 3-4 tiers, each aimed at a different obstacle in Kant's machinery: one for clearing the contradiction-in-conception screen, one for the harder contradiction-in-the-will cases (which is where the real money is, since that's where perfect shades into imperfect duty and the client has to be persuaded to will something he doesn't want to will), a rush/expedite option, and a premium retainer that serves as the firm's backstop for clients whose maxim can't be rescued by redescription alone.
  - One worked case study: a client walks in with a maxim that clearly fails, and the firm redrafts it step by step into something that really does pass, showing each intermediate version. Pick a mundane-ish case — e.g. someone who notices a vendor's arithmetic error in his own favor and says nothing, or someone who wants to quietly drop a small promise that has become inconvenient. Don't use the lying-promise-to-repay-a-loan example, and don't use the suicide case or the letting-your-talents-rust case; i want to see you find a new one.
  - Fine print at the bottom: exclusions, the firm's written policy on clients who ask to have indexicals baked into the maxim (their own name, the date, "when it rains"), the refund terms, and one careful sentence about what they say when a client asks whether all of this is just re-describing the act until it fits.

  700-900 words for the brochure itself.

  The humor has to come from getting the Kant right, not from Kant being silly. Somebody who has taught the Groundwork should read it and recognize that you know exactly what you're doing with maxim specificity — that a maxim can be described at any level of generality, and that a maxim stuffed with enough indexical detail universalizes trivially because nobody else could ever be in precisely that situation — plus the perfect/imperfect duty split and why contradiction-in-the-will is the harder sell. Stay deadpan throughout: the firm never winks, never concedes that the objection is fatal, and never once suggests Kant got anything wrong. And don't put anything in quotation marks as if it comes from Kant's text — paraphrase his examples if you use them, no citations or bibliography, i just want the piece.

  Then after the brochure, give me a markdown table of the description moves the firm uses, with exactly these columns:

  - move — a short name for the trick (narrowing the circumstances, inserting a role, re-describing the end, indexing to the agent, etc.)
  - what_it_does — one sentence on how it changes the maxim
  - test_targeted — contradiction in conception / contradiction in the will / both
  - kantian_reply — the best answer a defender of the test has for blocking this move
  - appears_in_brochure — the tier or section where you actually used it

  Five rows, and every move in the table has to genuinely show up somewhere in the piece above, not just be listed.
