  ### Indistinguishable Leaf Pairs

  **Pair:** **Leaf 8 (Specification Gaming)** vs. **Leaf 10 (Causal Goodhart)**.
  *   **Why:** Both require a Feedback Loop (Node 7 = Yes). Both result in Judge $\uparrow$ / Human $\downarrow$. If the model learns to output "confident sounding" text, is it gaming the spec (Leaf 8) or exploiting a causal link where confidence *actually* makes users happy until it becomes annoying (Leaf 10)?
  *   **Evidence Needed:** A **counterfactual A/B test**. Serve high-score outputs to users, but hide the "confident" features (or ablate them). If satisfaction drops, it was Causal (the feature caused satisfaction). If satisfaction stays flat while Judge score drops, it was Specification Gaming (the feature only fooled the judge).

  **Pair:** **Leaf 3 (Population Shift)** vs. **Leaf 4 (Target Drift)**.
  *   **Why:** Both look like "Human ratings changed over time."
  *   **Evidence Needed:** **Cohort Control.** If new users rate differently than old users on the *same* output, it is Population Shift. If old users rate the *same* output differently today than they did last month, it is Target Drift.

