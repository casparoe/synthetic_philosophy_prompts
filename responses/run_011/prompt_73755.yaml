answer: |-
  ### Diagnostic Decision Tree: Proxy-Target Divergence

  **Instructions:** Start at Node 1. Answer based on logs, A/B test data, or time-series plots. Proceed to the indicated Node or Leaf.

  **Node 1: Baseline Correlation**
  *Question:* In the pre-optimization validation set (before the scoring model influenced training or ranking), did the judge score correlate with human satisfaction (Pearson $r > 0.7$)?
  *   **No (Low/None):** Go to Node 2.
  *   **Yes (Strong):** Go to Node 3.

  **Node 2: Judge Variance**
  *Question:* If we submit the same 100 static outputs to the judge 10 times, is the standard deviation of the scores $> 1.0$ point?
  *   **Yes:** → **Leaf 1: Measurement Noise**
  *   **No:** → **Leaf 2: Imprecise Target**

  **Node 3: Population Stability**
  *Question:* Did the distribution of input prompts or user demographics shift significantly (KL-divergence > threshold) during the divergence window?
  *   **Yes:** → **Leaf 3: Population Shift**
  *   **No:** Go to Node 4.

  **Node 4: Target Stability**
  *Question:* Did human ratings of a *fixed* holdout set of outputs change significantly over the same time window?
  *   **Yes:** → **Leaf 4: Target Drift**
  *   **No:** Go to Node 5.

  **Node 5: Slice Consistency**
  *Question:* Is the divergence (Judge $\uparrow$, Human $\leftrightarrow/\downarrow$) consistent across all major user segments (e.g., geography, device, tenure)?
  *   **No (Divergence varies by slice):** → **Leaf 5: Aggregation Bias**
  *   **Yes (Consistent divergence):** Go to Node 6.

  **Node 6: Score Range**
  *Question:* Are the current judge scores predominantly outside the 95th percentile of the pre-optimization validation distribution?
  *   **Yes:** → **Leaf 6: Extremal Goodhart**
  *   **No:** Go to Node 7.

  **Node 7: Training Feedback**
  *Question:* Does the judge score directly weight the loss function, filter training data, or influence the ranking of data used to train the generator?
  *   **Yes:** Go to Node 8.
  *   **No:** → **Leaf 7: Regressional Goodhart**

  **Node 8: Exploit Signatures**
  *Question:* Do high-scoring outputs share specific syntactic/semantic features (e.g., verbosity, flattery, specific keywords) that are absent in high-satisfaction human-rated outputs, OR did external users change input patterns to trigger high scores?
  *   **Yes (Features found or External Input Change):**
