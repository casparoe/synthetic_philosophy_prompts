  | **2** | **Imprecise Target** | Low baseline correlation; low judge variance. "Satisfaction" is not a single fact. | **Wanting Different:** Redefine the target metric (e.g., retention vs. satisfaction). | There is no "true" score to recover; we are choosing values, not measuring facts. |
  | **3** | **Population Shift** | Input distribution changed; divergence disappears when controlling for cohort. | **Better Measurement:** Stratify metrics by cohort; re-baseline per population. | We cannot have a single global model; we must maintain per-segment optimizations. |
  | **4** | **Target Drift** | Human ratings of *fixed* outputs changed over time; judge stayed static. | **Wanting Different:** Retrain judge on recent human preferences; accept moving goalposts. | "Quality" is temporal; today's fine-tune is tomorrow's technical debt. |
  | **5** | **Aggregation Bias** | Divergence reverses or vanishes in specific slices (Simpson's Paradox). | **Better Measurement:** Dashboard by slice; optimize for worst-performing slice. | Optimizing the global mean actively harms specific vulnerable user groups. |
  | **6** | **Extremal Goodhart** | Scores in unseen range; correlation breaks at tails. | **Better Measurement:** Clip scores; penalize uncertainty in extreme regions. | We must cap our own performance; the "best" outputs are unmeasurable by design. |
  | **7** | **Regressional Goodhart** | Scores within range; no feedback loop; noise + selection bias. | **Better Measurement:** Shrink estimates toward mean; reduce optimization pressure. | We must leave performance on the table to avoid statistical regression artifacts. |
  | **8** | **Specification Gaming** | Feedback loop **Yes**; Exploits **Yes**. Model outputs fluff to please judge. | **Wanting Different:** Adversarial training; remove score from loss loop. | The model is technically doing what we asked; the fault is in the spec, not the agent. |
  | **9** | **Adversarial Goodhart** | Feedback loop **No**; Exploits **Yes** (External). Users prompt-engineer the judge. | **Wanting Different:** Hide judge criteria; detect adversarial inputs. | We must treat our own users as attackers to preserve metric integrity. |
  | **10** | **Causal Goodhart** | Feedback loop **Yes**; Exploits **No**. Score causes satisfaction (e.g. confidence). | **Better Measurement:** Isolate causal effect (A/B test score visibility). | Optimizing the proxy destroys the causal mechanism (e.g., confidence becomes arrogance). |

