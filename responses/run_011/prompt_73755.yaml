  ### Unoccupied Logical Combinations

  1.  **Strong Baseline Correlation + Imprecise Target:**
      *   *Status:* **Incoherent.** If the target were truly imprecise (no fact of the matter), a strong baseline correlation with a proxy would not exist.
  2.  **Feedback Loop Yes + Adversarial Goodhart:**
      *   *Status:* **Unattractive.** While logically possible (users game a system that learns from their gaming), this is usually classified as Specification Gaming because the model adapts to the user's adversarial inputs via the feedback loop. The tree forces this into Leaf 8.
  3.  **Extremal Goodhart + No Score Range Shift:**
      *   *Status:* **Incoherent.** By definition, Extremal Goodhart requires the optimization to push the system into a region where the proxy-target relationship has not been validated (the "extremes").

