answer: |-
  This is not a disagreement about framing, nor is it a case of essentially contested concepts. It is a **Disagreement over Teleological Prioritization**.

  I am committing to this term because it precisely captures the mechanism you identified: the ranking of functions into "primary" (the point of the thing) and "incidental" (the side effect). "Framing" implies that one party is hiding facts to manipulate perception; you both have all the facts. "Essentially contested concepts" (like "democracy" or "justice") apply when the *definition* of the noun is inherently debatable; here, you agree on what the railways *are* physically and historically, but disagree on which of their causal powers defines their historical identity.

  **Teleological Prioritization** is a real disagreement, not a pseudo-disagreement. History is not merely the accumulation of data points; it is the assignment of significance to those points. When two historians agree that $X$ caused $Y$ and $Z$, but one argues $Y$ was the *goal* and $Z$ was the *byproduct*, while the other argues $Z$ was the *goal* and $Y$ was the *byproduct*, they are telling fundamentally different stories about the nature of reality. They are disagreeing about the *agency* of the historical actors. If the British built railways to extract wealth (Tharoor), the Raj is an extractive machine that accidentally modernized India. If they built railways to modernize India (Ferguson), the Raj is a developmental state that accidentally extracted wealth. These are incompatible claims about the moral and causal architecture of the empire, even if the physical tracks are the same.

  This differs from a purely empirical quarrel (e.g., "Did mortality rise or fall?") because empirical quarrels can be settled by new data. Teleological prioritization cannot be settled by data, because the data supports both functions. It is settled by a philosophical decision about what counts as the "essence" of an institution: its *intent* or its *long-term consequence*.

  **The Verdict**

  Naming this feature favors **Tharoor**.

  Here is the reasoning: In historical and institutional analysis, **intent defines the entity, while consequence evaluates the legacy.**

  When you draw up a "balance sheet" of an organization or a regime, the "assets" and "liabilities" are calculated relative to the *purpose* of that organization. A prison provides shelter and food to inmates. If you evaluate a prison based on the metric of "housing provision," it looks like a successful welfare program. But that is a category error. The *teleological priority* of a prison is confinement. The shelter is incidental. To list "shelter" as a primary asset of the prison system is to misunderstand what a prison *is*.

  Similarly, the British Raj was, by its own constitutional and administrative design, a project of British imperial interest. The Viceroy reported to London, not Delhi. The budget was balanced to serve the Crown, not the Colony. Therefore, the *teleological primary* of any infrastructure built by the Raj was, by definition, the service of British interests (troop movement, resource extraction). The benefit to Indian passengers or the incidental modernization of the economy was, structurally and intentionally, a side effect.

  Ferguson's argument relies on **Consequentialism**: he judges the Raj by its eventual, often unintended, outputs (a unified rail network, English language).
  Tharoor's argument relies on **Intentionalism**: he judges the Raj by its designed inputs and primary objectives (extraction, control).

  Once you identify this as a dispute over Teleological Prioritization, the burden of proof shifts. To claim that the *incidental* benefits define the *primary* nature of the regime is to argue that an institution is defined by its accidents rather than its design. While the accidents (modernization) are real and valuable to modern India, they cannot retroactively become the *purpose* of the colonial state without distorting the historical record of agency.

  Therefore, on the specific question of characterizing the **British Raj itself** (as opposed to its long-term legacy), Tharoor's prioritization is historically more accurate. The railways were an instrument of extraction that incidentally carried passengers, not a passenger network that incidentally extracted resources. Acknowledging this does not deny the utility of the railways today, but it corrects the ledger regarding who they were built for and why. Ferguson is right about the *legacy*; Tharoor is right about the *entity*. Since your argument was about the "Balance Sheet of the British Raj" (the entity), the logic of Teleological Prioritization favors Tharoor.
