  I'm a data scientist at a two-sided marketplace and I'm trying to write a short internal note about why our "N people chose this" counters might be steering customers into bad decisions, but I keep getting tangled in the theory underneath it. The model I've been reading is the basic sequential one: a bunch of people pick one after another between two options, each sees all the earlier choices, each gets their own private noisy signal about which option is actually better, and everybody is a careful Bayesian about the whole thing. What I can't get straight is this knot. On one hand I keep seeing that a cascade is fragile — a single public signal of the opposite kind can blow over a herd that a million people already joined. On the other hand I have this intuition that the thing should unravel from the inside before it ever gets going: person 500 knows perfectly well that persons 3 through 499 might have just been copying, so their choices should be worth nothing to her, so she should trust her own signal and break the herd — and then person 499 reasons the same way, and so on back to person 3. Obviously that doesn't happen, since cascades are a real result and not a curiosity, so there's a hole in my reasoning and I can't locate it.

  There's a related thing from a toy simulation I threw together. If I tag every displayed choice with whether the chooser had a strong or a weak signal — basically a little confidence badge sitting next to "chose A" — the cascades mostly disappear in the sim, and hardly anybody ignores their own private signal anymore. That surprised me, because you'd think a rational onlooker could already infer something about how confident each predecessor was just from the fact that they went along with the herd, so the badge shouldn't be adding anything new. Clearly its adding something, and I suspect understanding what it adds is the same thing as understanding the hole in my unraveling argument, but I can't articulate the link.

  So: explain what's going wrong in my reasoning, in a way that also settles the fragility point and the badge point. Give me exactly five numbered points, one or two sentences each, no introduction and no conclusion — pick the five that do the most work and order them the way I'd actually need to hear them. Please don't just restate the standard result at me, I want the mechanism, and I want to be able to see where my intuition goes wrong rather than being told that it does.
