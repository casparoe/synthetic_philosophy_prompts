answer: |-
  # The Black Box Bureau: A Seminar Workshop on Verisimilitude

  ## 1. Cover Story and Participant Instructions

  **Handout Title:** The Black Box Bureau: Operational Protocol
  **Distribution:** Hand out at the start of the session. Do not elaborate verbally beyond the script in the Timeline.

  **Context:**
  You are agents of the Bureau. Inside the Black Box on the whiteboard lies a **State of the World**. This State consists of **five binary switches** (labelled 1 to 5), each set to either **ON (1)** or **OFF (0)**.

  **Your Goal:**
  Submit a **Theory** describing the State of the World. A Theory is a slip of paper with five entries (e.g., `1 0 1 1 0`). You may leave entries blank (`?`) if you wish to abstain from claiming a value for that switch.

  **The Economy:**
  *   Each agent starts with **5 Credence Tokens**.
  *   You may purchase information from the Banker (the Seminar Leader).
      *   **Cost:** 1 Token per query.
      *   **Query:** "Is Switch [X] ON or OFF?"
      *   **Limit:** You may not ask about the same switch twice.
  *   **Submission:** You may submit up to two Theories per round.
  *   **Scoring:** At the end of each round, the Banker reveals the True State. Your Theory is scored as follows:
      *   **+1 Point** for every switch where your Theory matches the Truth.
      *   **-1 Point** for every switch where your Theory contradicts the Truth.
      *   **0 Points** for every blank (`?`).
  *   **Winning:** The agent with the highest cumulative score at the end of the session wins.
      *   **Prize:** First choice of chocolate from the tin AND the power to veto one reading from next week's syllabus.

  **Rules of Conduct:**
  1.  No laptops or phones.
  2.  Do not discuss your Theories with other agents until the Scoring Phase.
  3.  Do not use the words "Truth", "Falsehood", "Content", or "Verisimilitude" during the game phases. Refer only to "The State", "Matches", and "Scores".

  ---

  ## 2. Materials List

  **For the Banker (You):**
  1.  **The Master Key:** A small card kept in your pocket defining the True State for each round.
      *   *Rounds 1–3:* `1 1 1 1 1` (All ON).
      *   *Round 4:* Withheld (See Timeline).
  2.  **Credence Tokens:** 55 small slips of paper (cut from scrap handouts), pre-marked with a stamp or pen.
  3.  **Theory Slips:** Pre-cut strips of paper (approx. 10cm x 3cm) with five boxes printed on them: `[ ] [ ] [ ] [ ] [ ]`.
  4.  **Whiteboard:** Draw five large empty squares labelled 1–5. This is the "Black Box".
  5.  **Scoreboard:** A table on the whiteboard to track student tokens and round scores.
  6.  **The "Historical" Cards:** Two pre-prepared Theory Slips to introduce in Round 3 (see Timeline).
      *   *Card Alpha:* `0 0 1 1 1`
      *   *Card Beta:* `1 1 0 0 1`
  7.  **Reward:** A box of chocolates and next week's reading list.

  **For the Students:**
  1.  **Protocol Handout:** (As above).
  2.  **Writing implements.**

  ---

  ## 3. Token Economy and Scoring Rules

  **Initial Endowment:** 5 Tokens per student.
  **Information Cost:** 1 Token per switch value revealed.
  **Theory Submission:** Free, but limited to two per round.

  **Scoring Algorithm (The "Ledger"):**
  $$ \text{Score} = (\text{Number of Matches}) - (\text{Number of Mismatches}) $$
  *   Blanks (`?`) are ignored (Score 0).
  *   Maximum possible score per round: +5.
  *   Minimum possible score per round: -5.

  **Handling Special Cases:**
  1.  **Ties:** If two students tie for the highest score at the end of the session, they share the chocolate. They must agree on the syllabus veto within 2 minutes, or the veto defaults to the reading *you* (the Banker) find most tedious.
  2.  **Refusal to Guess:** A student may submit a slip with all blanks. Score = 0. This is a safe, neutral strategy.
  3.  **The "Logical Empty" Move:** If a student writes "The switches are in *some* state" instead of binary values, rule that this counts as all blanks (`? ? ? ? ?`). Score = 0.
  4.  **Bankruptcy:** If a student runs out of tokens, they may no longer buy information but may still submit Theories based on deduction or guesswork.

  ---

  ## 4. Minute-by-Minute Timeline (100 Minutes)

  **00:00 – 00:15: Setup and Calibration**
  *   Distribute handouts and tokens.
  *   Read the "Operational Protocol" aloud.
  *   **Crucial:** Do not explain *why* the scoring is set up this way. Do not mention truthlikeness.
  *   **Round 1 (Practice):** Reveal the True State immediately (`1 1 1 1 1`). Let students submit a dummy theory and calculate their score. Ensure everyone understands the arithmetic (Matches minus Mismatches).

  **00:15 – 00:45: The Information Market (Rounds 2 & 3)**
  *   **Round 2:** Students spend tokens to query switches. They submit Theories. You reveal the Truth (`1 1 1 1 1`). Calculate scores.
      *   *Observation:* Students who bought more info should score higher. Students who guessed boldly (filling all boxes) risk negative scores. Students who played safe (blanks) score 0.
  *   **Round 3 (The Trap):**
      *   Before students submit, place the two **"Historical Cards"** (Alpha: `0 0 1 1 1`, Beta: `1 1 0 0 1`) on the table.
      *   Tell them: "These are theories from a previous Bureau session. They are both false. Calculate their scores against the current Truth (`1 1 1 1 1`)."
      *   **The Calculation:**
          *   Alpha: 2 Mismatches (1,2), 3 Matches (3,4,5). Score: $3 - 2 = +1$.
          *   Beta: 2 Mismatches (3,4), 3 Matches (1,2,5). Score: $3 - 2 = +1$.
      *   **The Question:** "The Ledger says they are equal. As agents, do you agree? Is one 'nearer the mark' than the other? Discuss for 5 minutes."
      *   *Note:* Most will shrug and say they are equal. Let them. The point is seeded for the debrief.
      *   Students then submit their own theories for Round 3. Score them.

  **00:45 – 01:00: The Blind Round (Round 4)**
  *   Collect tokens. No more information can be bought.
  *   Ask students to submit a final Theory.
  *   **The Twist:** Do **not** reveal the True State.
  *   Ask them to calculate their expected score. They cannot.
  *   Ask them to rank two specific theories (e.g., one Bold, one Timid) without knowing the Truth.
  *   **The Wall:** They will realise their scoring rule requires knowledge they do not have.
  *   Collect the theories. Do not score them yet.

  **01:00 – 01:40: The Debrief (The Philosophy)**
  *   (See Section 5 below).

  **01:40 – 01:45: Resolution**
  *   Reveal the True State for Round 4 (`1 1 1 1 1`).
  *   Announce the winner.
  *   Distribute chocolate.
  *   Ask the winner to veto a reading.

  ---

  ## 5. The Debrief Guide

  **Do not lecture.** Use the Socratic method. Map their game experience to the philosophical problems.

  **Phase 1: The Scoring Rule (Popper's Content Measure)**
  *   **Ask:** "What formula did we use to score the theories?"
  *   **Expect:** "Count the rights, subtract the wrongs."
  *   **Map:** "In the 1960s, Karl Popper proposed exactly this. He called it 'Truth Content minus Falsity Content'. He wanted to show that science progresses by getting *closer* to the truth, even if we never reach it."
  *   **Ask:** "Did this rule allow a false theory to score higher than a timid one?"
  *   **Highlight:** Recall a student who guessed 4 right, 1 wrong (Score +3) vs a student who guessed 3 right, 0 wrong (Score +3). Or the Bold Falsehood (`1 1 1 1 0`, Score +3) vs Timid Truth (`1 1 1 ? ?`, Score +3).
  *   **Point:** "Popper wanted to say a bold falsehood can be *closer* to the truth than a cautious truth. Your ledger allows this."

  **Phase 2: The Tie (The Tichý/Oddie Objection)**
  *   **Ask:** "Look at Card Alpha and Card Beta from Round 3. The Ledger scored them equal. Did anyone feel uneasy about that?"
  *   **Prompt:** "Imagine Switch 1 and 2 represent 'Fundamental Laws' and Switches 3, 4, 5 represent 'Initial Conditions'. Beta got the Laws right. Alpha got the Conditions right. Is Beta not *closer* to the truth of the system?"
  *   **Reaction:** Students will agree Beta is intuitively better.
  *   **Point:** "In 1974, Pavel Tichý showed that Popper's measure cannot distinguish these cases. If closeness is just counting atoms, all false theories with the same number of errors are equidistant from the truth. But intuitively, getting the *important* bits right matters more. Your ledger has no way to weigh importance."

  **Phase 3: The Blind Round (The Access Problem)**
  *   **Ask:** "In Round 4, I didn't tell you the Truth. Could you calculate your score?"
  *   **Expect:** "No."
  *   **Ask:** "So, can you ever know if you are getting closer to the truth using this rule?"
  *   **Point:** "To use Popper's measure, you need to know the Truth to count the matches. But if you knew the Truth, you wouldn't need the measure. It is a God's-eye metric. It tells you what closeness *is*, but not how to *find* it."

  **Phase 4: Synthesis**
  *   **Conclusion:** "So, is 'closeness to truth' a real thing, or just a manner of speaking?"
  *   **Desired Outcome:** Students should conclude that the *ordering* (one theory is better than another) seems substantive, but the *measure* (counting atoms) fails to capture it. This motivates the shift to 'similarity' metrics or 'structural' accounts of verisimilitude (which you will cover in future weeks).

  ---

  ## 6. Failure Modes and Repairs

  ### Predictable Failure Modes

  1.  **The "Tautology" Student:**
      *   *Behaviour:* A student writes `? ? ? ? ?` or "The switches exist" to guarantee a score of 0 and avoid risk.
      *   *Risk:* They might win by consistency if others guess boldly and fail.
      *   *Fix:* In the Debrief, highlight this. "This strategy is 'empirically empty'. It never risks error, but it never predicts anything. Popper would say this has zero *content*. Should a theory with zero content be ranked alongside scientific theories?"
      *   *Action:* **Concede.** Acknowledge that the scoring rule rewards safety over informativeness, which is a known flaw of simple verisimilitude measures.

  2.  **Token Hoarding:**
      *   *Behaviour:* One student buys all the info on Switch 1, leaving others in the dark.
      *   *Risk:* Resentment or lack of data for the group.
      *   *Fix:* Enforce the "One query per switch per student" rule strictly. If they complain, remind them: "In science, resources are finite and competitive."
      *   *Action:* **Rule Enforcement.**

  3.  **The "Intuition" Derailment:**
      *   *Behaviour:* In Round 3, a student insists Alpha and Beta are equal and refuses to engage with the "Fundamental Law" hint in the debrief.
      *   *Risk:* Stalls the philosophical point.
      *   *Fix:* "You are right, in a flat world they are equal. But science rarely happens in a flat world. If I told you Switch 1 determines the state of 2–5, would you still rank them equal?"
      *   *Action:* **Answer.** Use the causal hint to break the symmetry.

  ### Proposed Repairs (Student Solutions)

  During the debrief, students will try to fix the broken scoring rule.

  1.  **Repair A: "Weight the Switches"**
      *   *Proposal:* "We should give Switch 1 double points."
      *   *Verdict:* **Try it out (5 mins).**
      *   *Response:* Ask: "Who decides the weights? If the Banker decides, isn't that just dogmatism? If the data decides, how do you know the weights without knowing the Truth?" (This leads to the problem of *a priori* importance).

  2.  **Repair B: "Truth is Binary"**
      *   *Proposal:* "A theory is either True or False. 'Closer' is nonsense."
      *   *Verdict:* **Answer.**
      *   *Response:* "If that's true, then Newtonian Physics is no better than Astrology. Both are strictly false. But we treat Newton as 'closer'. If we abandon closeness, we abandon scientific progress."

  3.  **Repair C: "Average the Results"**
      *   *Proposal:* "Take the percentage of correct guesses."
      *   *Verdict:* **Concede.**
      *   *Response:* "That works for the game, but it still requires knowing the Truth (The Blind Round problem). It solves the calculation, not the access."

  ---

  ## 7. Limitations of the Game (Closing Paragraph for You)

  This game successfully reproduces the arithmetic failure of Popper's content measure (the Tichý objection) and the epistemic access problem (the Blind Round). However, it cannot reproduce the **structural** nature of real scientific theories. In the game, a theory is a conjunction of atomic claims (Switch 1 is ON *and* Switch 2 is OFF...). Real theories are often structural models where changing one parameter shifts the whole system (e.g., changing the mass of a planet alters its orbit, not just one 'switch'). The game treats errors as independent; in real science, errors are often correlated. Furthermore, the game assumes a static world; it does not capture how 'closeness' might change as the *language* we use to describe the world changes (the problem of language dependence). You must supply these nuances in the subsequent lecture, using the students' frustration with the "Weighting" repair as a bridge to discuss structural realism and language invariance.
