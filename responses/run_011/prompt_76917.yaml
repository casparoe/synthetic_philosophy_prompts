answer: |-
  You have stumbled onto a genuine, debated category in moral philosophy. You aren't being squeamish; you are experiencing the friction between two different ways of evaluating ethics.

  The established term for the practice is **Moral Trade**. It was formally articulated by philosopher Toby Ord (of the Effective Altruism movement). The argument for it is purely consequentialist: if you care about X and I care about Y, and we swap efforts, the total amount of "good" (as defined by us) increases, and we both save resources.

  However, the specific *unease* you are feeling—the sensation of keeping the belief but selling the behavior—has a different name in the philosophical literature. It is often referred to as the **Integrity Objection** or **Moral Alienation**.

  If you are looking for a specific label for the *state* you are describing (belief intact, action sold, profit gained), I would propose calling it **Integrity Arbitrage**.

  Here is the breakdown of why this distinction matters, where the edges are, and how to define it without conflating it with hypocrisy.

  ### 1. The Concept: Integrity Arbitrage
  **Hypocrisy** is claiming a virtue you do not possess. **Compromise** is adjusting your belief to meet someone halfway. **Integrity Arbitrage** is what you are doing: you retain the internal valuation of the virtue but externalize the cost of performing it.

  You are exploiting the gap between the *instrumental value* of an action (what it achieves in the world) and the *constitutive value* of an action (what it says about who you are).
  *   **Instrumental:** Volunteering at the shelter helps animals. If my friend donates money that helps more animals, the goal is met.
  *   **Constitutive:** Volunteering at the shelter makes me *a person who helps animals*. If I stop volunteering, I am no longer that person, even if the animals are helped.

  Your squeamishness comes from the realization that you have converted a **constitutive good** (integrity/identity) into an **instrumental good** (outcome/efficiency). You haven't lied (not hypocrisy), but you have fragmented your moral agency.

  ### 2. The Edge Cases
  You asked where the line is drawn. Here is how philosophers generally distinguish these scenarios:

  **Taking a paycheck from a company whose product you dislike:**
  *   **Verdict:** This is **Complicity**, not Moral Trade.
  *   **Why:** Moral trade requires *reciprocal concession*. In your examples, you gave something up (voting/volunteering) to get something up (brother's water/friend's donation). Taking a paycheck is a one-way extraction. You are not negotiating a change in the other party's behavior; you are funding it. There is no "trade" of values, only the renting of your labor to a value you oppose.

  **Donating the proceeds back to the cause:**
  *   **Verdict:** This is **Moral Offsetting**.
  *   **Why:** This fixes the *consequentialist* math (the shelter still gets value), but it does not fix the *integrity* loss. You still "sold off the part of your life that showed it." Offsetting treats morality like a carbon credit: "I emitted sin here, so I purchased virtue there." It cleans the ledger, but it doesn't restore the alignment of self and action. Many find this *more* alienating because it commodifies the virtue itself.

  ### 3. Defining the Category
  To distinguish **Integrity Arbitrage** from "hypocrisy with extra steps," you need a definition that centers on *belief consistency* and *transactional decoupling*.

  **Definition:**
  > **Integrity Arbitrage** occurs when an agent maintains a sincere moral belief but voluntarily ceases the associated behavior in exchange for a counter-party ceasing a behavior the agent opposes.
  >
  > **Distinctions:**
  > *   **Vs. Hypocrisy:** The agent does not feign the belief; the belief remains sincere.
  > *   **Vs. Compromise:** The agent does not alter the belief to accommodate the trade; the belief remains absolute.
  > *   **Vs. Moral Trade:** "Moral Trade" is the neutral mechanism; "Integrity Arbitrage" highlights the specific risk of decoupling identity from action for personal gain (e.g., saving time, money, or effort).

  ### 4. Why the Squeamishness is Useful
  Your instinct to inventory your beliefs ("looking for ones that cost me a lot to act on but that somebody else would pay to switch off") is the danger zone.

  If you treat your moral actions purely as assets to be traded, you risk turning your conscience into a portfolio. The "cost" of a moral action isn't just the time or money; the cost is often the *discipline* required to hold the belief and the action together. That friction is what builds character.

  When you trade away the action, you keep the opinion, but you lose the **practice**. Over time, beliefs without practices tend to atrophy. You might find that five years from now, you still "believe" the shelter is good, but the belief will feel hollow because you haven't paid the price of admission (your Saturday) in years.

  ### Summary
  *   **The Practice:** Moral Trade.
  *   **The Feeling:** Moral Alienation / Integrity Objection.
  *   **The Specific Phenomenon:** Integrity Arbitrage.
  *   **The Verdict:** It is not hypocrisy, but it is a form of moral fragmentation. It is ethically permissible under consequentialism (outcomes matter), but ethically costly under virtue ethics (character matters).

  Your squeamishness is your virtue ethics immune system reacting to a consequentialist transplant. It's worth listening to. If every belief becomes a tradeable asset, you eventually own nothing but opinions.
