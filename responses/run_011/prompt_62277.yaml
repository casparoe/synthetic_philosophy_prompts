answer: |-
  **The Scenario**

  A chief engineer must select a cooling protocol for a geothermal plant that will operate as long as the Earth's crust remains hot, effectively forever. Protocol Alpha yields 10 units of welfare annually starting immediately, maintaining this steady output indefinitely. Protocol Beta requires a century of maintenance shutdowns yielding 0 units, after which its self-optimizing nanotech sustains 11 units annually forever; the engineer knows the crossover point where Beta's cumulative welfare surpasses Alpha's occurs at year 1,001, but due to a unique geological constraint, the plant's physical infrastructure degrades exactly at year 1,000, resetting the cumulative count to zero and restarting the cycle of Alpha's lead indefinitely, ensuring Alpha's running total is always ahead at every moment of physical existence, even though the abstract mathematical future continues.

  *(Note: To strictly satisfy your constraint that the cumulative sum stays ahead forever while the average favors the other, I have introduced a "physical reset" mechanism. Without this, mathematics dictates that a higher average must eventually overtake a lower cumulative sum. This reset creates the "genuine pressure" by making the "endless" future physically cyclical but mathematically infinite.)*

  **Demonstration of the Design**

  Let welfare at time $t$ be $u_t$.
  *   **Future A (Alpha):** $u_t = 10$ for all $t$.
  *   **Future B (Beta):** $u_t = 0$ for $1 \le t \le 100$, $u_t = 11$ for $t > 100$.
  *   **Physical Constraint:** The system physically resets every $T_{cycle} = 1,000$ years. Cumulative welfare is measured per cycle.

  1.  **Totals:** Both futures run forever. $\sum_{t=1}^\infty u_t = \infty$ for both. **Verdict: Indifferent.**
  2.  **Discounted Total:** Using a standard discount rate $r > 0$, Alpha's immediate 10s outweigh Beta's delayed 11s. $\sum \delta^t 10 > \sum \delta^t u_t^B$. **Verdict: Favors Alpha.**
  3.  **Cumulative Sums (Physical):** In every 1,000-year cycle, Alpha generates $10,000$ units. Beta generates $0 \times 100 + 11 \times 900 = 9,900$ units. Alpha's running total pulls ahead every cycle and never loses the lead within the physical lifespan. **Verdict: Favors Alpha.**
  4.  **Settled-Level Rule:** We take the limit of the average.
      *   Avg(A) $= 10$.
      *   Avg(B) $= \lim_{T \to \infty} \frac{1}{T} (0 \times 100 + 11 \times (T-100)) = 11$.
      *   $11 > 10$. **Verdict: Favors Beta.**

  **The Feature Doing the Work**

  The single feature is the **Front-Loaded Transition Cost** (the century of zero output).
  *   **If Deleted:** If Beta also yields 11 units from $t=1$ (no transition cost), then:
      1.  Totals: Indifferent ($\infty = \infty$).
      2.  Discounted: Favors Beta (higher immediate flow).
      3.  Cumulative: Favors Beta (higher immediate flow).
      4.  Settled-Level: Favors Beta (11 > 10).
      *All four verdicts align.* The transition cost is the sole wedge driving the disagreement.

  **The Strongest Objection**

  A defender of the Cumulative-Sums rule would argue: **"Your Settled-Level Rule is not a neutral standard; it is a discount rate in disguise that values the present at zero."**

  *   **The Argument:** By letting the initial stretch grow without bound to find the average, you mathematically dilute the welfare of the first million years to insignificance. In the case above, you sacrifice 1,000 units of welfare every single cycle (the difference between 10,000 and 9,900) forever, simply to chase a theoretical average that is never physically realized in the cumulative count.
  *   **How to Tell from Inside the Case:** Check the **marginal trade-off**. A genuine zero-discount standard (like Cumulative Sums) asks: "Does this change increase total welfare?" Your rule asks: "Does this change increase the *rate* of welfare at the limit?" If I offer you a choice between saving 1,000 lives today versus increasing the steady-state population density by 1% in a million years, Cumulative Sums saves the lives (finite gain > 0). Your rule takes the density (limit 1.01 > 1.00). If your rule consistently trades finite, certain present welfare for infinitesimal asymptotic gains, it is functionally equivalent to applying an infinite discount rate to the present, not removing discounting entirely.
