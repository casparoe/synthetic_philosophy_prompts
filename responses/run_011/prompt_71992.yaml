      *   *Resolution:* Prop 23 amended 204 to add a tier for *markers*. Prop 47 amends 204 to add a tier for *204's own text*. The distinction is: Prop 23 didn't make 204 harder to amend; it made *markers* harder to move. Prop 47 makes *204* harder to amend (specifically that clause). Therefore, Prop 47 violates Prop 19, while Prop 23 did not.
      *   *Overruling:* Prop 23 is the candidate for overruling if consistency is paramount, *but* it's been relied upon for two years (stripping 118). Better to distinguish it. Prop 19 is the bedrock.

  8.  **Test Proposals:**

      *   Need to test the boundary between "Procedural Tier" (Prop 23 OK) and "Substantive Freeze" (Prop 19 Not OK).
      *   *Test 1:* "Amend 204 to require 100% vote for any proposal that increases a voting threshold." (Tests if we can entrench the *liberal* nature of change).
      *   *Test 2:* "Rule 204 is suspended for 4 weeks." (Tests if the machinery can be paused vs. destroyed).
      *   *Better Test:* "Amend 204 to require that any proposal affecting Rule X must be seconded by the Chair of the Committee." (Tests procedural hurdles vs. voting thresholds).
      *   *Best Pair:*
          1.  "Amend 204: Proposals affecting Rule 118 require a 90% vote." (Distinguishes Prop 23's marker tier from a specific rule tier).
          2.  "Rule 204 is immutable, except by a vote of 100% of all players." (Direct challenge to Prop 19's "no freeze" vs. "harder to change").

      *   *Refining the Pair:*
          1.  "Add to 204: Proposals to amend this sentence require a 100% vote." (Direct Prop 47 variant).
          2.  "Add to 204: Proposals to amend Rule 118 require a 100% vote." (Prop 23 variant but higher bar).
          *   *Why:* If 1 is out and 2 is in, the principle is "204 cannot entrench itself, but can entrench others." If both are in, Prop 19 is dead. If both are out, Prop 23 is dead.

  9.  **Final Review of the Output:**
      *   Ensure tone is appropriate (collegial, rigorous).
      *   Check all constraints (no reading list, specific minute, doctrinal cost analysis).
      *   Make sure the Prop 23 vs. Prop 19 tension is addressed head-on.

