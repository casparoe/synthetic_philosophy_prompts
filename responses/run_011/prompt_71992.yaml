      *Wait, one more check on Prop 36:* Prop 36 says "Committee checks that a rule can be applied, not that it's ordinary." If I reject 47 based on "consequences" (it freezes 204), am I violating 36?
      *Answer:* Prop 36 applies to rules *within* the competence of the plenum. Prop 11/19/41 establish the *limits* of that competence. The Committee *must* police the limits (jurisdiction), even if it doesn't police the wisdom (merits). 47 is a jurisdictional issue (ultra vires), not a merits issue (unwise).

