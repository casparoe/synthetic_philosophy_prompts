      *   *Text:* Adds a sentence to 204. Requires unanimity + repeal of all immutable rules to change *that sentence*.
      *   *Issue:* It attempts to entrench a clause *within* 204, using a higher threshold than 204 currently requires for 204 amendments (2/3 of all players).
      *   *Conflict:* 204 says immutable rules need 2/3 of all players. This clause says "To change me, you need Unanimity + Repeal All Immutable."
