      2.  Analyze 47 (It violates Continuing Sovereignty).
      3.  Draft Minute.
      4.  Discuss Cost (Form vs. Effect is a red herring; it's Jurisdiction vs. Merits).
      5.  Identify Inconsistency (Prop 23 is the weak link, but distinguishable).
      6.  Test Proposals.

