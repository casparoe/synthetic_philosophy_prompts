answer: |-
  Here is the doctrinal analysis based on your seven precedents, the ruling on Prop 47, and the suggested path forward.

  ### I. Extracted Principles

  Your seven rulings do not support a pure formalism (Prop 11, 19, 41 all look to consequence) nor a pure substantive review (Prop 36 forbids judging "ordinariness"). Instead, they jointly sustain a doctrine of **Continuing Sovereignty with Jurisdictional Limits.**

  1.  **The Competence/Merits Distinction (from Prop 36 vs. 11/19/41):** The Committee checks *jurisdiction* (can we vote on this?) but not *merits* (is this a good idea?). Prop 36 is valid because it is *intra vires* (within power), however strange. Prop 11 and 19 are invalid because they are *ultra vires* (outside power).
  2.  **The Engine Preservation Rule (from Prop 19):** The Rule of Change (204) cannot be made immutable. The plenum cannot bind its future self to a procedure that prevents the Rule of Change from functioning. This is a limit on *jurisdiction*.
  3.  **The Metadata Distinction (from Prop 23):** Procedural tiers regarding *markers* (metadata) are permissible, even if they affect the ease of changing entrenched rules, provided they do not alter the amendment threshold for 204 itself.
  4.  **The Membership Integrity Rule (from Prop 41):** Entrenchment cannot bind the voting rights of future members. Sovereignty resides in the *current* membership; you cannot contract away the sovereignty of those not yet at the table.

  **Survival Check:** Your four hypotheses need adjustment.
  *   *Formalism:* Fails (contradicted by 11, 19, 41).
  *   *Framework-Preservation:* Survives, but must be defined as "preservation of the *capacity* to change," not preservation of specific rules.
  *   *Level-Based:* Survives, but refined: Entrenchment is legitimate downward (Prop 4), illegitimate on the Rule of Change itself (Prop 19), and illegitimate regarding membership rights (Prop 41).
  *   *No-Lock-In:* Survives, but limited to *persons* (Prop 41) and *procedure* (Prop 19). Locking *rules* (Prop 4) is fine.

  ### II. Ruling on Prop 47

  **Analysis:**
  Prop 47 attempts to amend 204 to insert a clause requiring unanimity + repeal of all immutable rules to amend *that clause*.
  *   **Vs. Prop 19:** Prop 19 rejected making 204 immutable. Prop 47 makes a *part* of 204 effectively immutable (unanimity is a practical freeze in a 9-person game). If a clause within 204 requires a higher threshold to amend than 204 requires to amend itself, you have created a hierarchy within the Rule of Change that contradicts the uniform amendment power of 204.
  *   **Vs. Prop 23:** Prop 23 added a tier for *markers*. Prop 47 adds a tier for *204's own text*. Prop 23 did not make 204 harder to amend; it created a parallel track for metadata. Prop 47 makes 204 harder to amend.
  *   **Vs. Prop 36:** Rejecting 47 does not violate Prop 36. Prop 36 allows strange rules *within competence*. Prop 19 establishes that entrenching 204 is *outside competence*.

  **Decision:** **Out of Order.**

  **Closest Analog:** Prop 19. Both attempt to shield the Rule of Change from the standard amendment process.

  **The Minute:**
  "Prop 19 forbids entrenching the Rule of Change; a clause within 204 that requires a higher threshold to amend than 204 itself permits is an entrenchment of 204."

  ### III. Doctrinal Costs

  **If you Adopt:**
  You effectively overrule Prop 19 by distinction. You commit to **Self-Embracing Sovereignty**: the view that the current plenum *can* bind the procedural capacity of future plenums, provided the wording is clever enough (e.g., "entrenching a clause" vs. "entrenching the rule"). This collapses the distinction between "Rule of Change" and "Ordinary Rule." It validates the "poison pill" strategy: you can hide a unanimity requirement inside a majority-rule constitution. You also create a Prop 31-style contradiction risk: if 204 says "Immutable rules need 2/3" and the new clause says "This clause needs 100%," Rule 205 (lower number beats higher) might invalidate the new clause immediately upon adoption, rendering the proposal void for indeterminacy.

  **If you Reject:**
  You affirm **Continuing Sovereignty**: the current majority cannot alter the *definition* of majority (or supermajority) for the Rule of Change itself. You admit you are looking at *effect* (does this freeze 204?) rather than *form* (is this just text?). This creates tension with Prop 36, but only superficially. The resolution is that Prop 36 governs *internal* logic (is the rule contradictory?), while Prop 11/19/41 govern *external* jurisdiction (does this rule exceed the group's power?). Rejecting 47 is a jurisdictional ruling, not a merits ruling. You are not saying the rule is "unordinary" (Prop 36); you are saying the group lacks the *power* to enact it (Prop 19).

  **The Live Axis:**
  It is not Form vs. Effect. It is **Jurisdiction vs. Merits**.
  *   *Prop 36:* Merits (We don't judge wisdom).
  *   *Prop 11/19/41/47:* Jurisdiction (We *must* judge power).
  The Hartian distinction is indeed the correct frame: You have established that the group's sovereignty is *continuing* (cannot bind successors on procedure), not *self-embracing* (cannot bind successors on substance). Prop 47 attempts to use self-embracing sovereignty on a jurisdictional matter.

  ### IV. Inconsistency Check

  **Prop 23 is the weak link.**
  Prop 23 allowed a procedural workaround to Prop 4's entrenchment. Prop 47 attempts a procedural workaround to Prop 19's prohibition.
  *   *Argument for Overruling 23:* If we cannot entrench 204 (Prop 19), why can we add tiers that alter how 204 interacts with immutability (Prop 23)?
  *   *Argument for Distinguishing 23 (Recommended):* Prop 23 did not change the vote required to amend 204. It added a rule *about* markers. Prop 47 changes the vote required to amend 204 (specifically the new clause).
  *   *Verdict:* Do not overrule 23. It has been relied upon for two years to strip 118 (stare decisis/practical necessity). Distinguish it on the grounds that Prop 23 regulated *markers* (metadata), whereas Prop 47 regulates *amendment thresholds* (substantive procedure). Overruling 23 would destabilize the removal of Rule 118, which is now settled law in your game. Prop 19 is the stronger precedent to protect.

  ### V. Test Proposals for Next Term

  To discriminate between the surviving principles (specifically to test the boundary between Prop 23's "Metadata Tier" and Prop 19's "No Freeze"), run these two:

  **Test A (The Prop 23 Stress Test):**
  "Amend 204 to add: 'A proposal to amend Rule 118 requires a 90% vote of all players.'"
  *   *Why:* Prop 23 allowed a tier for *markers*. This allows a tier for a *specific rule*. If this is valid, Prop 41 (no locking future voters) is threatened. If invalid, Prop 23's "metadata" distinction becomes critical.

  **Test B (The Prop 19 Stress Test):**
  "Amend 204 to add: 'Rule 204 is immutable, except by a vote of 100% of all players.'"
  *   *Why:* Prop 19 rejected "204 is immutable." This adds a carve-out. If valid, Prop 19 is dead (self-embracing sovereignty wins). If invalid, Prop 19 stands (continuing sovereignty wins).

  **Discrimination:**
  *   If **A is In** and **B is Out**: You have successfully distinguished between entrenching *ordinary rules* (even with high bars) and entrenching the *Rule of Change*. This is the most stable doctrine.
  *   If **A is Out**: You must overrule Prop 23. You are committing to a flat hierarchy where only 204 sets voting thresholds.
  *   If **B is In**: You have abandoned Prop 19. Entrenchment is purely a matter of wording, and "poison pills" are constitutional.

  **Recommendation:** Stick with the **Jurisdiction vs. Merits** divide. Reject 47. Draft the minute as above. It preserves the game's ability to evolve (Prop 11/19) while respecting the settled law on markers (Prop 23) and the determinacy requirement (Prop 36).
