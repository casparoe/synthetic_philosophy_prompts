      *   *If Adopt:* You admit Prop 19 was wrong or distinguishable. You allow "poison pills" within the constitution. You move from Continuing to Self-Embracing sovereignty.
      *   *If Reject:* You affirm Prop 19. You admit you are looking at *effect* (does this freeze 204?) rather than *form* (is this just text?). This creates tension with Prop 36 (we don't judge wisdom/ordinariness). *Resolution:* Prop 36 is about *internal* logic/contradiction. Prop 19/47 is about *jurisdictional competence* (do we have the power to bind the future plenum?). The Committee *must* judge competence (Prop 11, 19, 41). So Prop 36 is limited to rules *within* competence.
      *   *Inconsistency Check:* Prop 23 is the wobbly one. It allowed a workaround to Prop 4's entrenchment. Does Prop 47 allow a workaround to Prop 19's prohibition? Yes. If Prop 23 is good law, Prop 47 might be too (it's just another tier).
