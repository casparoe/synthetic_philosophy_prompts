      *   *No Lock-In (Effects-based, specifically regarding persons/future agency):*
          *   Fits: Prop 41 (can't bind future members).
          *   Fits: Prop 11 (can't bind the group to stop playing).
          *   Struggles: Prop 4 (locked in 118 successfully).
          *   *Verdict:* Needs to distinguish between locking *rules* (OK) and locking *agency/sovereignty* (Not OK).

  4.  **Synthesize a Coherent Doctrine:**

      *   The core tension is between *Prop 19* (No freezing 204) and *Prop 23* (Procedural workaround to unfreeze 118).
      *   Prop 23 is the key. It suggests that *procedural* changes to the *mechanism* of change are allowed, even if they alter the *effective entrenchment* of lower rules, provided the *Rule of Change itself (204)* remains amendable.
      *   Prop 41 adds a human rights layer: You can't entrench rules against *future people* because they aren't parties to the contract yet.
      *   Prop 36 says: If it's determinate, it's valid (unless it hits the sovereignty limits of 11/19/41).

      *   *Refined Principle:* **Continuing Sovereignty of the Plenum.** The current majority (or required supermajority) must always retain the *procedural capacity* to alter the rules, provided they follow the *current* procedure. You cannot bind the *procedure* itself (Prop 19), nor the *membership* (Prop 41), nor destroy the *game* (Prop 11). But you can make specific rules hard to change (Prop 4), and you can add procedural tiers (Prop 23) as long as those tiers are themselves changeable.

