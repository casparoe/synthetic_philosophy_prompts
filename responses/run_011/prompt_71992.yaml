          *   *Verdict:* Too weak. The Committee clearly looks at consequences in 11, 19, 41.

      *   *Framework Preservation (Out of order iff it disables future change machinery):*
          *   Fits: Prop 11 (killing 204), Prop 19 (freezing 204).
          *   Struggles: Prop 23 (changed how 204 works regarding markers, arguably disabled Prop 4's intent), Prop 41 (didn't disable machinery, just restricted *who* uses it).
          *   *Verdict:* Strong, but needs nuance on *how* machinery is disabled.

      *   *Level-Based (Entrenchment legitimate downward, never on Rule of Change):*
          *   Fits: Prop 4 (118 immutable OK), Prop 19 (204 immutable NOT OK).
