      *   *Prop 19 (Year 2):* Make 204 itself immutable ("204 may not be amended"). *Ruling:* Invalid. *Principle:* The rule of change cannot be frozen. Level-based/Continuing Sovereignty.
      *   *Prop 23 (Year 2):* Create a new tier for changing *markers* (2/3 vote). Used to strip 118. *Ruling:* Valid. *Principle:* Procedural workaround allowed. Distinguishes between changing the *rule* vs. changing the *status* of the rule. (This is the "awkward one" regarding Prop 4).
