      *   *Prop 36 (Year 3):* Self-repealing upon proposal. *Ruling:* Valid. *Principle:* Committee checks applicability/determinacy, not "ordinariness" or wisdom. Formalist.
      *   *Prop 41 (Year 3):* Waive future members' voting rights on 118. *Ruling:* Invalid. *Principle:* Cannot bind future membership rights. No lock-in on *persons*, only rules.

  3.  **Evaluate the Candidate Principles:**

      *   *Formalism (In order iff properly moved and determinate):*
          *   Fits: Prop 36 (weird but determinate), Prop 4 (textual protection).
