      *   *Strategy B: Reduction to Inference (Anumāna).*
          *   *Claim:* "This animal is a *gavaya* because it resembles a cow (as described)."
          *   *Test:* Can the failure be described as a logical fallacy (*hetvābhāsa*)?
          *   *Analysis:* Inference fails if the mark (*hetu*) is absent or inconclusive. Here, the "mark" is similarity. If I mistake a buffalo, did I infer wrongly? Inference requires a universal connection (*vyāpti*). Do I have a universal "All cow-like things in the forest are gavayas"? No. I have a singular identification.
          *   *Hidden Import:* To make this inference, you need to presuppose the connection between the word and the object. But establishing that connection *is* what *upamāna* does. The reduction assumes the semantic link to explain the semantic link.
