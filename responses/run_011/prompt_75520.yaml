answer: |-
  Here is the pressure test of your distinctive-failure criterion applied to the Nyāya dispute over *upamāna*.

  ### 1. The Contradiction: Individuation vs. Parsimony

  To ensure the positions genuinely contradict rather than merely diverge in emphasis, we must frame the dispute not as a disagreement about utility, but about ontological commitment to causal chains.

  **The Nyāya Position:** *Upamāna* is a distinct causal process that generates a specific cognitive state: the knowledge of the relation between a word and its referent (*saṃketa-jñāna*), mediated by a description of similarity. The causal chain is unique: it begins with testimony regarding similarity, proceeds to the perception of the similar object, and culminates in the identification of the object as the referent of the word. Nyāya argues that without this specific chain, the semantic link cannot be established. Therefore, the failure mode is proprietary: one can fail specifically at *mapping the description to the percept*, even if perception is accurate and testimony is reliable.

  **The Reductionist Position (Mīmāṃsā/Buddhist):** There is no unique causal chain. The cognitive event labeled *upamāna* is a composite of already accepted processes. The "knowledge" gained is either (a) inference from a sign (the description) to the object, (b) testimony (trusting the speaker's description), or (c) perception aided by memory (recognizing the match). The reductionist claims that positing a distinct *pramāṇa* is ontologically profligate. Therefore, any failure in this process must be locatable within the component parts. If you misidentify the *gavaya*, you either perceived poorly, remembered poorly, or inferred poorly. There is no residual "comparison error."

  **The Contradiction:** Nyāya claims there is a remainder of error that survives the analysis of the parts; the Reductionist claims there is no remainder. If your test holds, Nyāya must demonstrate a failure that cannot be parsed into perceptual, inferential, or testimonial error without changing the subject.

  ### 2. Applying the Test to Reductive Strategies

  I will apply the distinctive-failure test to the two most robust reductive strategies: reduction to Testimony (*Śabda*) and reduction to Inference (*Anumāna*).

  **A. Reduction to Testimony**
  *The Strategy:* The reductionist argues that when the forester says, "A *gavaya* is like a cow," you learn what a *gavaya* is solely through his words. The later encounter in the forest is merely confirming what was already known linguistically.
  *The Test:* Can the specific failure of *upamāna* be redescribed as a failure of testimony?
  *Analysis:* Testimony fails primarily through speaker unreliability or syntactic ambiguity. In the standard *gavaya* case, the speaker is reliable and the syntax is clear. The error occurs later, in the forest, when the agent mistakes a buffalo for a *gavaya*. If we call this a testimony failure, we must claim the testimony was defective. But the testimony was accurate. To save the reduction, the reductionist must argue that the agent's *understanding* of the testimony was defective.
  *The Hidden Import:* This redescription smuggles in a notion of **semantic content** that the test was supposed to remain neutral about. It assumes that "understanding testimony" includes the ability to correctly identify referents in the world. But Nyāya's entire point is that the ability to identify the referent *is what is produced by upamāna*. To say the testimony failed because the referent wasn't identified is to assume the referent was already accessible to the testimony. The redescription imports the very semantic link *upamāna* is supposed to forge.
  *Verdict:* The failure is not redescribable without loss. Testimony errors are about communication; *upamāna* errors are about identification. The reduction fails the test.

  **B. Reduction to Inference**
  *The Strategy:* The reductionist argues the agent infers: "This animal is a *gavaya* because it possesses cow-like features (as described)."
  *The Test:* Can the failure be redescribed as a logical fallacy (*hetvābhāsa*)?
  *Analysis:* Inference fails if the mark (*hetu*) is absent, inconclusive, or counterbalanced. Here, the "mark" is similarity to a cow. If the agent mistakes a buffalo for a *gavaya*, did they commit a logical fallacy? Only if we posit a universal premise: "All cow-like animals in this forest are *gavayas*." But the agent does not possess this universal premise prior to the event; acquiring the connection between the class and the name is the goal of the process.
  *The Hidden Import:* This redescription quietly imports **memory** as a justificatory resource. To treat this as inference, the agent must recall the description and apply it as a major premise. But memory is not a *pramāṇa* in these systems (it is a preservative, not a generative source of truth). If the error is "faulty memory," the reductionist is explaining a *pramāṇa* failure using a non-*pramāṇa* mechanism. If the error is "faulty inference," they are assuming a universal connection that hasn't been established yet.
  *Verdict:* The failure is not redescribable without loss. Inference errors are about logical deviation; *upamāna* errors are about categorical misidentification based on similarity. The reduction fails the test.

  ### 3. Fairness and Structural Stacking

  Is the distinctive-failure test fair to Nyāya, or is it stacked in favor of reduction?

  **The Verdict:** The test is structurally stacked in favor of reduction, but this is a feature, not a bug. It privileges ontological parsimony over phenomenological granularity.

  **Why it is stacked:** The test places the burden of proof on the distinctness of the process. It assumes that if an error *can* be redescribed in existing terms, it *should* be. This favors the reductionist because language is flexible; a clever reductionist can almost always stretch the definition of "perceptual error" or "inferential error" to cover new ground. For example, one could define "perception" broadly enough to include "concept-laden identification," thereby absorbing *upamāna* failures into perceptual failures.

  **Discovery about Nyāya:** However, if the test eliminates *upamāna* despite the reductionist's smuggling of hidden premises (as shown above), it reveals something critical about what Nyāya is actually doing. Nyāya is not merely cataloging psychological processes; they are cataloging **semantic causal histories**. For Nyāya, a *pramāṇa* is not just a way of knowing; it is a specific type of causal interaction between world, word, and mind that guarantees truth.
  If the test rejects *upamāna*, it implies that the *pramāṇa* framework cannot sustain metaphysical commitments about semantic causality. It forces the framework to become purely functional. If Nyāya insists on *upamāna* despite the test, they are admitting that their system is not just epistemological but metaphysical: they are committed to the reality of the word-object relation as a distinct ontological category. The test exposes that the debate is not about "how we know," but "what exists to be known."

  ### 4. Wider Classical Candidates: Postulation and Non-Apprehension

  If we apply the distinctive-failure test consistently to the wider classical list, the results are destructive to the traditional pluralism.

  **A. Postulation (*Arthāpatti*)**
  *Case:* "Fat Devadatta does not eat by day; therefore, he eats at night."
  *Reduction:* Inference.
  *Test Application:* The failure of *arthāpatti* occurs if Devadatta is not eating at night (perhaps he is ill). Can this be redescribed as inferential failure? Yes. The agent assumed a universal connection ("All fat people who don't eat day must eat night") that turned out to be false. This is a standard material fallacy in inference.
  *Result:* *Arthāpatti* **fails** the distinctive-failure test. There is no proprietary malfunction here that inference cannot capture. The "feeling of necessity" is phenomenological, not functional.

  **B. Non-Apprehension (*Anupalabdhi*)**
  *Case:* Knowing a pot is absent because one does not see it.
  *Reduction:* Perception.
  *Test Application:* The failure occurs if I think the pot is absent, but it is present (e.g., it is transparent or in the dark). Is this a unique failure? No. This is a failure of perceptual conditions (*kāraṇa-doṣa*). Perception failed to register the object. To say *anupalabdhi* failed is just to say perception failed to apprehend.
  *Result:* *Anupalabdhi* **fails** the distinctive-failure test. The error is fully redescribable as a perceptual limitation. Nyāya itself eventually subsumes this under perception, acknowledging the redundancy.

  ### 5. Conclusion: What Remains of the Framework?

  Does the criterion earn its keep? **Yes, but at a high cost.**

  If you apply the distinctive-failure test rigorously, the classical *pramāṇa* list collapses. *Upamāna*, *Arthāpatti*, and *Anupalabdhi* are eliminated as distinct categories. Their failure modes are either redescribable within Perception (*Pratyakṣa*) and Inference (*Anumāna*), or they rely on hidden imports (like memory or semantic content) that violate the test's neutrality.

  **What remains is a binary framework:**
  1.  **Direct Registration (Perception):** Failures are sensory or attentional.
  2.  **Mediated Processing (Inference/Testimony):** Failures are logical or communicative.

  **The Cost:** This binary system strips the *pramāṇa* theory of its ability to track specific semantic acquisitions. It cannot distinguish between learning a word's meaning (*upamāna*) and learning a fact about the world (*inference*). For a seminar on Nyāya epistemology, this is a devastating result, because Nyāya's genius lies precisely in the granularity of semantic analysis.

  **Final Judgment:** The distinctive-failure test is a powerful tool for ontological hygiene, but it is **too strong for Nyāya's purposes**. It survives the *upamāna* challenge better than the reductionists do (because their redescriptions do smuggle in hidden premises), but it ultimately threatens to dissolve the *pramāṇa* framework into a generic epistemology that Nyāya would reject as insufficiently realist.

  If you assign this test to your students, do not present it as a way to "solve" the dispute. Present it as a way to reveal that Nyāya's multiplication of *pramāṇas* is not a confusion about psychology, but a deliberate commitment to the complexity of semantic reality. The test shows that if you want parsimony, you must sacrifice semantic precision. That is the genuine philosophical trade-off.
