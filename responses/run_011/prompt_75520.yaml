  2.  **Deconstruct the "Distinctive-Failure Test":**
      *   *Core Idea:* Epistemic kinds are individuated by their specific error conditions.
      *   *Implication:* If Error Type X in Process A can be fully explained as Error Type Y in Process B (where B is already accepted), then A is not a distinct process.
      *   *Philosophical Weight:* This is a functionalist/operationalist criterion. It prioritizes mechanism over phenomenology or metaphysical commitment.

