      *   *Postulation (Arthāpatti):* E.g., "Fat Devadatta doesn't eat by day, so he eats at night."
          *   *Reduction:* Inference.
          *   *Failure Test:* If Devadatta *isn't* eating at night (maybe he's sick), where did it go wrong? Inference requires a universal ("All fat people who don't eat day eat night"). That universal is shaky. *Arthāpatti* relies on the impossibility of the alternative.
          *   *Result:* The failure is "explanatory collapse," not "logical invalidity." Can inference cover explanatory collapse? Maybe. But *arthāpatti* feels distinct. However, under the strict test, a clever logician can frame it as an inference from absence. It likely *fails* the distinctive-failure test because the error can be modeled as a false premise in an inference.
      *   *Non-apprehension (Anupalabdhi):* Knowing absence by not perceiving.
          *   *Reduction:* Perception.
          *   *Failure Test:* If I think a pot is absent but it's there (in the dark), did perception fail? Yes, conditions weren't right. Did non-apprehension fail? Yes. Are they distinct?
          *   *Result:* This is the hardest case. Nyāya eventually accepts *anupalabdhi* as part of perception. If the test says "unique failure," does absence have a unique failure? Failing to see what is there is a perceptual failure. So *anupalabdhi* likely *fails* the test too.
      *   *Overall:* If *upamāna*, *arthāpatti*, and *anupalabdhi* all fail, what's left? Perception and Inference (and maybe Testimony).

  7.  **Drafting Section 5: Conclusion (What remains?):**
      *   If the test is applied ruthlessly, the *pramāṇa* list shrinks drastically.
      *   Does the criterion earn its keep? Yes, as a tool for ontological hygiene. It stops the multiplication of epistemic kinds based on phenomenological differences alone.
      *   But it might be *too* strong. It risks collapsing all knowledge into "Causal Interaction" (Perception) and "Information Processing" (Inference/Testimony).
      *   *Honest Assessment:* The test survives the *upamāna* challenge better than the reductionists do (reductions require smuggling), BUT the test itself threatens to dissolve the *pramāṇa* framework into a binary system.
      *   *Final Verdict:* The test is robust but destructive. It shows that classical debates often hinge on whether one values semantic precision (Nyāya) or ontological parsimony (Reductionists).

  8.  **Refining and Polishing:**
      *   *Tone:* Academic, rigorous, direct. No fluff.
      *   *Check Constraints:* No quotes, no bibliography. Ensure the contradiction is sharp.
      *   *Self-Correction on "Fairness":* I need to be careful not to just say "Nyāya loses." I need to say "The test reveals Nyāya is doing something the test doesn't capture (semantic causality) OR the test reveals Nyāya is bloated." I'll argue the latter: the test exposes that *pramāṇa* multiplication is often metaphysical, not functional.
