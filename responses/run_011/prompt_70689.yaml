prompt: |-
  I'm teaching a historiography seminar and want to use the 1994-95 Enola Gay fight at the Smithsonian's air and space museum as a case study in the objectivity debate. Quick recap of the facts so you're working from these rather than from memory: the museum planned a 50th-anniversary exhibit built around the restored forward fuselage of the plane, and the curators script did more than narrate the mission — it took up the decision to drop the bomb, the alternatives that were argued at the time, Japanese civilian testimony and photographs of the victims, and the nuclear legacy after 1945. Veterans groups, chiefly the Air Force Association and the American Legion, and then a lot of Congress called it revisionist and unpatriotic; the script went thru repeated cuts, the anniversary exhibit was scrapped in favor of a much smaller display of just the fuselage plus a short video, and the director resigned a few months later.

  Now the analysis. Run the episode through Ranke on one side, Carr and Hayden White on the other, and be disciplined about the mapping rather than name-dropping. Specifically: which side is Ranke actually on here, given that both the veterans and the curators insisted they were just letting the facts show themselves? What does Carr's picture of the present shaping the past predict about the fight, and does it explain it better than a plain story about institutional politics, donors, and congressional pressure? What does White add — how much of the dispute was over the narrative form the script imposed (a story about a weapon, or a story about a war crime; tragic, ironic, whatever) rather than over any particular factual claim? Then tell me where each framework goes silent or misfires: what does Carr fail to explain, and if White's account has to say the veterans were emplotting too — which they obviously were — does that reduce the whole thing to a clash of narratives with no way to rank them, which nobody involved seemed to believe? Finally: does the case confirm these theories, count as an anomaly for them, or mainly show they weren't built with museum wall labels in mind?

  Also say how confident you are in your main claims, and single out the one point you're least sure about.
