      *   **Key Dynamic:** Both sides claimed to be letting "facts show themselves."

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Briefly set the stage. Acknowledge the *Enola Gay* controversy as a quintessential public history battle.

      *   **Ranke ("Wie es eigentlich gewesen"):**
          *   *Theory:* History should show "how it actually happened." Objective, archival-based, suppression of self.
          *   *Application:* Both sides claimed Rankean objectivity. Veterans: The fact is we won, the bomb ended the war, saved lives. Curators: The facts are the documents, the casualty estimates, the Japanese archives.
          *   *Where is Ranke actually?* Ranke is a trap here. His ideal presupposes a stable archive and a detached observer. The *Enola Gay* fight shows the archive itself is contested (which documents count?) and the observer is never detached (veterans vs. academics). Ranke would likely side with the *state* archives (Prussian model), implying a subtle bias toward the official record, but his methodology fails to resolve the conflict because "facts" don't speak without selection.
          *   *Verdict:* Ranke provides the *rhetoric* used by both sides, but not the *resolution*.

      *   **E.H. Carr ("What is History?"):**
          *   *Theory:* History is a dialogue between the present and the past. Facts are like fish in the ocean; the historian chooses which to catch based on present concerns.
          *   *Application:* Predicts the fight perfectly. 1995 context (end of Cold War, rise of multiculturalism, Gulf War victory) shaped how 1945 was viewed. Curators reflected the 1990s academic focus on social history/victimhood. Veterans reflected 1990s culture wars/patriotism.
          *   *Vs. Institutional Politics:* Carr explains *why* the politics mattered. It wasn't just pressure; it was a clash of present-day values projecting onto the past. Institutional pressure was the mechanism, but Carr explains the *motivation*.
          *   *Limitations:* Carr assumes a progressive dialogue leading to better understanding. Here, the result was censorship/silence (the stripped exhibit). Carr might underestimate the power of raw political coercion vs. intellectual evolution.

      *   **Hayden White ("Metahistory"/"The Content of the Form"):**
          *   *Theory:* Historical narratives are literary artifacts. Emplotment (tragedy, comedy, romance, satire) determines meaning more than facts.
          *   *Application:* The core dispute was emplotment. Curators: Tragedy/Irony (victory came at moral cost). Veterans: Romance/Epic (heroic sacrifice saved the world).
          *   *Narrative Form:* It wasn't about whether the bomb dropped (fact), but the *story* told around it (weapon of war vs. war crime).
          *   *Limitations:* If both are just emplotments, how do we judge? White leads to relativism. The veterans didn't believe they were telling a "story"; they believed they were defending "truth." White's framework struggles to account for the *moral urgency* felt by the veterans. It reduces a moral battle to an aesthetic one.

      *   **Synthesis/Evaluation:**
          *   *Confirmation/Anomaly:* Confirms Carr and White strongly. Ranke is exposed as insufficient.
          *   *Mismatch:* These theories were built for books/archives, not museum spatial politics. Museums have physical constraints and public funding pressures that pure historiography doesn't always capture.

