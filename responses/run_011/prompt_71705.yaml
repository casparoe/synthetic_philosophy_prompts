answer: |-
  **What's actually being claimed**

  The empirical claim is that moral judgment is not a stable output of a unified cognitive system, but a context-sensitive selection from a fragmented repertoire. When the same individual evaluates identical actions under different frames—such as a kinship obligation versus an anonymous market exchange—their verdicts shift systematically based on subconscious cues rather than conscious reasoning. This moves the locus of moral variation from between cultures to within the individual psyche. The version of objectivity at stake is robust moral realism, specifically the claim that moral propositions report mind-independent facts that rational agents would converge upon under conditions of full information and reflective equilibrium. If morality is objective in this sense, variation should function like error in perception: correctable with better data or clearer thinking. The debate is not about whether moral feelings exist, but whether they track external truths or merely internal states calibrated by social cues. This framing challenges the idea that there is a single "moral truth" waiting to be found. Instead, it suggests the "truth" might be relative to the frame activated. The objectivity in question requires that the *reasons* for the judgment hold regardless of the psychological frame. If the frame dictates the judgment, the reasons are post-hoc.

  **Why it's supposed to be a problem**

  Anti-realists argue that persistent variation signals the absence of a fact of the matter. In domains like arithmetic, disagreement usually dissolves when parties share data and logic; in domains like taste, it does not. Standard cross-cultural data suggests morality looks more like taste: different societies track different norms because there is no single norm to track. The within-subject wrinkle sharpens this into an etiological debunking argument. If my judgment that "X is wrong" depends on whether I am primed to think about cousins or strangers, and I cannot reason my way out of that dependency, then the cause of my judgment is a psychological trigger, not a moral property of X. The problem is not just that people disagree, but that the *same person* disagrees with themselves based on irrelevant contextual features. This suggests moral judgments are functional tools for social navigation rather than detections of normative reality. If the mechanism producing the judgment is sensitive to cues that have no normative weight, the output cannot be trusted to represent moral truth. This undermines the "ideal observer" defense. Usually, realists say disagreement exists because people are biased or uninformed. But if the bias is structural to the cognitive architecture and persists even when the agent tries to be consistent, the variation isn't noise around a truth; it is the system working as designed to produce different outputs for different social contexts. This implies there is no single truth to converge upon, only different adaptive responses.

  **The realist's best counters**

  Realists have two strong lines of defense. First, the *Relational Fact* counter: moral facts are inherently contextual. It is objectively true that stealing is wrong in a market frame but permissible in a kinship frame, just as "it is raining" is true here but false there. The variation tracks real differences in the relational properties of the act, not error. The weakness here is trivialization: if every cue changes the fact, "objectivity" loses its force, becoming merely a claim that every judgment is true relative to its trigger.

  Second, the *Competence/Performance* counter: the underlying moral competence is uniform and objective, but framing effects are performance errors, like optical illusions. Under ideal reflection, the cues would lose their power, and convergence would occur. The weakness is empirical: the prompt stipulates that these cues resist reasoning. If the variation persists despite full information and explicit endorsement of consistency, the "ideal conditions" required to wash out the error may be psychologically impossible for humans, rendering the objective facts inaccessible in principle. The Relational Fact counter struggles to explain why the frames feel like conflicting *moral* truths rather than just different rules. The Competence counter relies on a hypothetical idealization that the empirical data suggests is unattainable. If the "noise" is actually the signal of how moral cognition works, positing a hidden uniform competence is metaphysically idle. It saves the theory by placing the truth permanently out of reach of actual human cognition.

  **What the within-the-head version changes**

  Moving the variation from between cultures to within the head significantly weakens the realist's position. Cross-cultural disagreement allows the realist to argue that different environments necessitate different rules to achieve the same objective goods (e.g., social stability). The within-subject data closes this escape hatch. Here, the environment is held constant except for the prime, and the agent is identical. If the same rational agent outputs contradictory verdicts based on subconscious cues they do not endorse, it demonstrates that the moral faculty is not a truth-tracking sensor but a switchboard for social strategies.

  This specifically targets the "reflection" escape route. In cross-cultural cases, we can hope that education brings convergence. In within-subject cases, the subject *is* educated about the conflict yet remains sensitive to the cue. This suggests the variability is a feature, not a bug. It implies morality is constituted by these contextual switches rather than discovered despite them. If the mechanism is fundamentally fragmented, positing a unified moral reality it supposedly tracks becomes an unnecessary hypothesis. The data suggests we are not failing to see the truth; we are successfully executing different social programs that have no single truth-value. It forces the realist to claim that the "true" moral fact is hidden behind a cognitive architecture designed to obscure it. This makes the realism claim otiose. If the brain is built to toggle between loyalty and fairness depending on the prime, and neither toggle is suppressible by reason, then "objectivity" cannot mean convergence under reflection. It must mean something else, likely something deflationary. The internal conflict shows the lack of a unified normative perspective.

  **My verdict**

  This evidence hurts the case for moral objectivity. Specifically, it undermines robust realism that relies on convergence under reflection. The within-subject variability demonstrates that moral judgments are causally driven by non-normative cues that reason cannot override. If the output of our moral cognition is determined by frames we cannot endorse upon reflection, we cannot claim those outputs track mind-independent facts.

  I commit to the view that this supports a constructivist or pragmatic account of morality. Moral judgments are valid moves in a social game, not descriptions of a normative universe. The variation isn't error; it's functionality. Therefore, there is no single moral fact of the matter waiting to be found across frames. Objectivity, in the sense of a view from nowhere, is an illusion produced by mistaking one frame for the whole. The realist might retreat to a pluralistic objectivity, but that concedes the main point: there is no single truth. The cue-sensitivity shows that our access to morality is mediated by mechanisms that are not truth-apt. Thus, the argument from variation succeeds, not because cultures differ, but because the individual mind is not a unified truth-seeker. Moral objectivity does not survive this wrinkle.
