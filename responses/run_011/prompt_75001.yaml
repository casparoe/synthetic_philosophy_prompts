      *(Drafting thought)*: The "Retrospection" needs to be clear. The amendment is treated as having been in force throughout the preceding assessment period. Mendel's period ends in 6 weeks. If the rule changes now, his past performance is re-evaluated against the new standard. He didn't do the "Unsecured Entry" enough because he didn't have to. Now he looks deficient. Deficient means lower final grade. Lower grade means lower pension.

