answer: |-
  The alert arrived at 08:14, timestamped and encrypted, landing in Elara's inbox with the soft chime that usually signaled a roster shift. It was not a roster shift. It was a Notice of Threshold Proximity from the Surplus Register.

  Elara sat in the quiet of the调度 center, the hum of the servers vibrating through the soles of her boots. She opened the attachment. The interface was stark, white fields on grey backgrounds, the typography designed to discourage lingering.

  *Act-Type 44-Bravo: Unsecured Entry into Compromised Structural Zones.*
  *Current Service-Wide Certifications: 49.*
  *Pending Certification: 1 (Officer E. Vance).*
  *Status: Threshold Imminent.*

  Below the status line was the warning box, bordered in amber. *Per Standing Order 12.4, upon the 50th certification, Act-Type 44-Bravo shall be reclassified as Ordinary Duty for Rank 3 and above. Per Standing Order 12.5, this reclassification applies retroactively to the current Assessment Period.*

  Elara minimized the window. She didn't need to see the rest to know what it meant. She knew the balance sheet of her own career better than she knew the layout of her own apartment. She had 4,200 credits. No one else had more than 900. She had built that mountain on 44-Bravo. When the alarms screamed and the engineers said wait for the shoring, Elara had gone in. She had pulled victims out while the concrete dust was still settling. The service had obliged itself to save those victims, but it had not obliged her to risk her spine doing it without support. So, it was surplus. It was credit.

  Now, it was the 50th time anyone in the bureau had done it and filed the paperwork. Her paperwork.

  She opened the Impact Assessment draft attached to the notice. It listed the personnel whose records would be scrubbed upon reclassification. The system scanned the past twelve months. It looked for 44-Bravo acts. If an officer had performed fewer than the new mandatory minimum, their rating dropped from Satisfactory to Deficient.

  There were forty-two names.

  Number fourteen was Mendel.

  Mendel was Grade 4. He was six weeks from retirement. His pension was calculated on the final grade held at the moment of separation. A drop to Grade 3 wouldn't just be a stain on his file; it would cut his monthly benefit by nearly thirty percent for the rest of his life. He hadn't performed 44-Bravo often because he believed in waiting for the shoring. He believed in the old way. The way that was standard until Elara started making the new way look easy.

  Elara stood up and walked to the printer. The Notice of Threshold Proximity was digital, but she needed to hold it. The paper slid out, warm and heavy. She stared at the credit number at the top of her personal ledger printed on the second page. *4,200.* It was a fortune. It could buy her a transfer to the Coastal Division. It could buy her exemption from the next three rotation cycles. It could buy her silence.

  She folded the paper and put it in her pocket.

  She found Mendel in the break room, staring into a mug of tea that had gone cold. He was a large man, worn down at the edges, his uniform pressed with a precision that suggested he had nothing else to do with his time. He didn't look up when she entered, but he shifted the mug slightly to the left, making space for her.

  "They sent you the notice," Mendel said. His voice was gravelly, unused since the morning briefing.

  "Yes."

  "Forty-nine," he said. "I counted them last month. I knew you were close."

  Elara sat opposite him. The table was laminate, scarred by heat and knives. "I haven't submitted the claim yet."

  Mendel looked up then. His eyes were pale, tired, but not angry. "You should. It's a clean run. The structure was stable enough. You got the child out."

  "If I submit it, the count hits fifty. The Order triggers."

  "I know."

  "Your name is on the Impact Assessment, Mendel."

  He nodded slowly, taking a sip of the cold tea. "I saw the draft amendment circulating yesterday. I know what the Retrospection clause does. It rewrites the past twelve months. I didn't go in without shoring enough times to meet the new mandatory minimum. So, I become deficient."

  "I can withdraw the claim," Elara said. The words felt heavy in her mouth. "If I don't certify this one, the count stays at forty-nine. The rule doesn't trigger. Not yet."

  Mendel set the mug down. He folded his hands on the table. "And your balance?"

  "It doesn't increase for this run. But I keep what I have."

  "You've built your career on that balance, Elara. You're the top earner in the history of the Register. The recruitment brochures use your anonymized stats. 'Finally giving the extra mile a fair price.' That's the slogan, isn't it?"

  "It is."

  "If you withdraw," Mendel said, "you admit that the mile wasn't extra. Or that the price was too high."

  "I'm admitting that I don't want you losing your pension."

  Mendel sighed, a long exhalation that seemed to deflate his shoulders. "You think this is about charity? You think I want you to burn your credits out of pity?"

  "I think I want to know if I'm doing the right thing."

  "There isn't a right thing here," Mendel said. "There's only the math. You did the work. You took the risk. The Register said that was worth something. You collected the something. Now you've done it so many times that the Service says, 'Well, if she can do it, anyone can.' So they make it mandatory. That's how standards rise, Elara. You raised the bar."

  "By breaking the safety protocols."

  "By saving lives faster than the protocols allowed," Mendel corrected. "I taught you to wait for the engineers. I taught you that because I wanted you to come home. But you learned that waiting costs time, and time costs lives. You found a way to balance it. You got paid for it. Now everyone has to do it."

  "Everyone who can't do it safely will get hurt."

  "Everyone who doesn't do it will get fired," Mendel said. "That's the other side of the coin. Reclassification means it's duty. Failure is disciplinary. You make your excellence the standard, you punish those who lack your specific recklessness."

  "It's not recklessness."

  "Isn't it?" Mendel leaned forward. "Tell me. When you went into that building this morning, were you thinking about the child? Or were you thinking that this was number fifty?"

  Elara looked at the folded paper in her lap. She could feel the sharp edge of the fold through the fabric of her trousers. "I was thinking about the child."

  "And the credit?"

  "Both."

  "Good," Mendel said. "Don't lie to me. If you didn't want the credit, you wouldn't be in the Register. If you weren't good at the job, you wouldn't have the balance. The system works because we admit we're buying and selling effort. If you withdraw the claim now, you corrupt the ledger. You say the work was surplus, but you refuse the payment because the consequence is awkward."

  "The consequence is you."

  "The consequence is the Service," Mendel said. "I'm just a line item. If you stop, the next person hits fifty next month. Or the month after. The act is already done. The capability is already there. You can't put the knowledge back in the box."

  "I can delay the penalty."

  "For six weeks?" Mendel shook his head. "Then I retire anyway. Grade 4. But you'll have spent your credit to buy me time I was going to get regardless. Unless you plan to never submit a 44-Bravo claim again. Are you willing to work for free forever?"

  Elara looked at the form in her lap. She unfolded it. The credit number stared back at her. *4,200.* It was the sum of every time she had run when walking was allowed. Every time she had lifted when machinery was scheduled. It was the monetization of her instinct to do more. If she withdrew, she wasn't just losing the credits for this run. She was casting a shadow over the entire balance. If 44-Bravo wasn't worth the trigger, was any of it?

  "If I submit," Elara said, "you drop a grade."

  "If you submit," Mendel said, "the Service acknowledges that what you did is now the baseline. The victims get saved faster. The guys coming up behind us, they learn the new way immediately. They don't have to gamble on whether to be heroes. It's just the job."

  "And you pay for their training."

  "I pay so they don't have to decide," Mendel said. "I paid so you wouldn't have to decide either. But you did. You decided every time. And you got paid. Now the bill comes due."

  He stood up, picking up his cold tea. "I'm not asking you to save me, Elara. I'm asking you to decide if you believe in the Register. If it's real, then the price is real. If it's a game, then walk away. But don't play half-measures."

  He walked to the sink and poured the tea out. The water glugged loudly in the silent room. He rinsed the mug and placed it on the rack. He didn't look at her again.

  Elara sat alone for a long time. The hum of the servers seemed louder now, a constant pressure against her ears. She looked at the Notice of Threshold Proximity. She looked at the terminal on the wall, the screen glowing with the login prompt for the Surplus Register.

  If she submitted the claim, she secured her history. She validated every risk she had taken. She affirmed that her extra mile was worth the price the service had offered. But the cost would be deducted from Mendel's future, and from the safety of the rookies who would now be ordered to run into collapsing buildings because Elara Vance had made it look easy.

  If she withdrew the claim, she protected Mendel. She delayed the new standard. She kept the act special, dangerous, optional. But she admitted that her own accumulation of credit was built on a fragility that couldn't sustain the weight of becoming law. She would keep her balance, but the value of the currency would be questioned. Why hold credit for acts you are too afraid to make mandatory?

  She stood up and walked to the terminal. Her reflection in the black glass was pale, indistinct. She inserted her keycard. The screen lit up, displaying her dashboard.

  *Pending Claims: 1.*
  *Act-Type: 44-Bravo.*
  *Action: Submit / Withdraw.*

  The cursor blinked next to *Submit*. It was a small, rhythmic pulse, like a heartbeat.

  To submit was to say that the work was done, the price was paid, and the world must change to accommodate the transaction. To withdraw was to say that some things remain outside the ledger, beyond the price, even if that means the ledger itself is a lie.

  Elara placed her hand on the mouse. The plastic was cool. She could feel the texture of the wheel under her thumb. She thought of the child in the rubble, the dust in her lungs, the weight of the beam she had shoulder-checked to make space. She thought of Mendel's pension statement, the numbers dropping in red. She thought of the rookie next year, ordered into the smoke because the manual said it was ordinary duty.

  Her finger hovered over the left button. The cursor stopped blinking, waiting for the command. The room was silent, save for the servers humming the song of the data, counting everything, measuring nothing.
