answer: |-
  Elena: The meeting is in fourteen days. I need to know what I'm signing.

  Marcus: You know what you're signing. A decision about antibiotics.

  Elena: I mean what it means. I've been reading about this idea that we are only people because other people hold us that way. That personhood isn't a thing you have, like a kidney. It's a thing you do, together. And looking at her... it fits. She isn't holding herself together anymore. We are holding her together.

  Marcus: And if we stop holding?

  Elena: Then maybe she isn't a person in the full sense anymore. That's the terror of it. If personhood is something that can be built, it can be unbuilt. If it grades down, does the care owe less?

  Marcus: That is exactly why I reject that view. It's too fragile. You're saying her worth depends on our ability to keep relating to her. If we get tired, if the connection frays, she becomes less than she was. That's a permission slip to withdraw care whenever the relationship gets hard.

  Elena: It's not about us getting tired. It's about reality. She doesn't know me. The reciprocity is gone. But I'm not saying we walk away. I'm saying the obligation changes shape. It's not about respecting an autonomous agent anymore. It's about sustaining the connection until the connection is physically impossible.

  Marcus: But why sustain it if the person is gone? On your view, if the relational capacity is gone, the personhood is diminished. So why is treating the chest infection obligatory? Why not just let her go comfortably?

  Elena: Because the relationship isn't just current recognition. It's history. It's the sum of what we were. To stop care because she can't reciprocate now is to say the past relationship didn't matter enough to carry us through the end. But I hear you. I hear the risk. If I say she's less of a person, am I saying she's worth less?

  Marcus: Yes. That's the status view. She has a standing. It's binary. You either have it or you don't. It doesn't fluctuate with your memory or your ability to laugh at music. It's based on what she is, not what she can do.

  Elena: What is she?

  Marcus: A human being. A member of the kind that commands moral protection.

  Elena: That's where I get stuck. You have to face the hard cases. Infants. People with congenital cognitive disabilities who never develop the capacity for relation in the way you or I do. On your view, they have full status. Why? What is doing the normative work in "the kind"? Is it just biology? Because if it's just biology, you're worshipping DNA. If it's potential, she had that and lost it. So why does she keep the status?

  Marcus: It's not potential. It's membership. The normative work is done by the boundary itself. We draw a line around the human organism and say nothing inside this line is expendable for the convenience of others. The work it does is protective. It stops us from calculating worth. If you make personhood graded, you invite the calculation. Who decides when the grade is too low?

  Elena: But doesn't your view invite a different calculation? If status is binary and inherent, then we keep treating the infection forever. We intervene until the heart stops. But that ignores her experience. She gets distressed when people hover. She finds peace in sleep. If I force treatment to honor a status she can't experience, am I honoring her? Or am I honoring an abstract rule?

  Marcus: You're honoring the truth that she is not an object. Even if she doesn't know it.

  Elena: But if I treat her body like a temple while ignoring her distress, I'm treating her like a thing that needs polishing. You said my view makes her a prop for our moral development. But your view risks making her a prop for a philosophical principle.

  Marcus: That stings. But the alternative is worse. If you allow grading, you have to admit that some humans are less than others. I can't say that. I won't say that.

  Elena: Okay. Here is where I concede something. You're right about the danger. If I walk into that meeting and say her personhood has diminished, the doctors will hear "she's worth less." They will hear "cost-benefit." I might intend "the nature of our care changes," but the system will hear "withdraw." I can't use a graded theory in a binary system without hurting her. I have to speak your language to protect her, even if I don't believe it's the whole truth.

  Marcus: And I concede this. Status can become idolatry. If I insist on treatment that causes her distress just to prove she has status, I am violating the dignity I claim to protect. The status view demands we protect her life, but it doesn't demand we prolong dying. I have to admit that "human kind" doesn't mean "indefinite biological function." There is a point where status is respected by letting go.

  Elena: So does this change the decision? The antibiotics.

  Marcus: If the infection is treatable with low burden, status says treat. If it's recurrent, invasive, and she distresses every time... status says the protection extends to allowing a natural end.

  Elena: And relation says... the relationship demands we don't abandon her, but also doesn't demand we torture her. If the treatment breaks the connection—makes her fearful, restrained—then it harms the relation we're trying to sustain.

  Marcus: So we agree?

  Elena: We agree on the action. Comfort care. No more aggressive antibiotics for recurrent pneumonia. But we disagree on why.

  Marcus: I think that matters.

  Elena: It matters for me. If I believe she's less of a person, I might visit less. If I believe she's fully a person who is dying, I visit because she's still here.

  Marcus: Then don't use the graded view for yourself. Use it to understand the decline, but use the status view to govern the duty.

  Elena: That feels like lying.

  Marcus: It feels like loving. You hold the theory that helps you bear it, but you act on the principle that keeps her safe.

  Elena: I can live with that. But Marcus? If I sign that paper, I am deciding she won't fight this next infection.

  Marcus: You are deciding she won't fight it alone. You're deciding she won't fight it with tubes and restraints. You're deciding the relationship ends in comfort, not in struggle.

  Elena: That sounds like relation.

  Marcus: It sounds like status that knows when to stop.

  Elena: Okay. I'll sign. But I'm not telling the doctors about the grading.

  Marcus: Good. Don't tell them about the status either. Just tell them what she needs.

  Elena: She needs us to let her go.

  Marcus: She needs us to let her go.
