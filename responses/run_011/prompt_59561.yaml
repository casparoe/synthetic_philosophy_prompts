answer: |-
  **Project Title:** Function in Regime-Shift: Distinguishing Loss from Non-Exercise

  **Research Question**
  The central question is not which account of biological function is universally correct, but rather: Under conditions of *regime-shift*—where selection history and current causal contribution diverge wholesale—what criteria distinguish the *loss* of biological function from the *mere non-exercise* of function? An answer will take the form of a typology of regime-shifts paired with a decision rule specifying which function account (selected-effect, causal-role, or organizational) yields verdicts actionable for practices requiring functional ascription, specifically clinical judgment and conservation biology.

  **The Limitations of Standing Positions**
  The standard debate tests accounts against stable cases (malfunction, exaptation) where history and contribution largely align. In these contexts, selected-effect (SE) and causal-role (CR) accounts often return congruent verdicts, or diverge only in ways that allow each side to redescribe the case to salvage their intuition. Recent naturalistic approaches, such as organizational accounts grounding function in systemic closure rather than history, attempt to bypass this stalemate. However, they leave the specific question of *loss* open. While an organizational account might identify a trait's contribution to self-maintenance, it struggles to normatively distinguish a trait that has *lost* its function due to environmental shift from one that is functioning normally in a new context. Consequently, existing positions describe the trait but fail to provide the normative traction required when practice demands a verdict on whether an organ is broken, merely displaced, or adapted. They leave open the question of which description governs when history and contribution conflict.

  **Methodology and Case Assembly**
  To test accounts against this question, I will construct a corpus of "regime-shift" cases rather than standard thought experiments. These include: (1) transplanted organs functioning in a host context different from the donor's evolutionary history; (2) traits in lineages passed through severe bottlenecks or domestication where selection pressures changed faster than genetic drift; and (3) ecological traits in rapidly changing climates where current contribution no longer matches historical recruitment.

  A fair test requires that cases are not rigged to favor one account. I will assemble cases where the practical verdict is initially clear (e.g., a clinician treats a transplanted heart as functioning despite its mismatched history) and ask whether the philosophical account can recover that verdict without ad hoc modification. If an account requires complex redecription to match the practical verdict, it fails the tractability condition. I will analyze each case through SE, CR, and organizational lenses, recording whether each account classifies the trait as functional, malfunctioning, or function-less.

  **Argument for This Approach**
  Arguing directly for one account against the other ignores the possibility that different practices legitimately require different notions. However, retreating to an unstructured pluralism is insufficient. Pluralism is cheap unless it specifies which notion governs in which context and how to resolve conflicts when notions diverge on the same case (e.g., an organ performing superbly now but selected for a different purpose). This project avoids the stalemate of monism by seeking the *conditions of applicability* for each account. It avoids the vacuity of pluralism by demanding a rule for indexical usage. By focusing on regime-shifts, where the divergence is maximal, we force the accounts to reveal their structural limits regarding normativity and loss.

  **Success and Failure Conditions**
  Success looks like a mapped matrix: for each type of regime-shift (temporal, spatial, contextual), a specification of which function account aligns with practical intervention. For example, success might demonstrate that SE accounts govern conservation decisions regarding historical traits, while CR accounts govern clinical decisions regarding transplants, with a defined protocol for when these conflict.

  Genuine failure conditions are distinct from incomplete work. The project fails if: (1) the corpus of cases proves too heterogeneous to admit any generalizable typology; (2) all accounts fail to track the practical verdicts across the majority of cases, suggesting the philosophical category of "function" is unfit for these contexts; or (3) the decision rule collapses back into simple intuition without philosophical justification. If I demonstrate that no account can distinguish loss from non-exercise in a way that guides practice, that is a substantive negative result, but it counts as a failure of the hypothesis that philosophy can guide these distinctions.

  **Scope and Candid Assessment**
  Eight weeks is insufficient to cover all proposed domains deeply. To ensure tractability, I will cut the category of engineered populations and synthetic biology. These cases introduce normative complexities regarding design intent that conflate biological function with artifact function, risking scope creep. I will restrict the corpus to naturalistic regime-shifts (transplants, domestication, climate shift). Additionally, I will not attempt to resolve the metaphysical grounding of function itself; I will take the accounts as given and test their *application*. If the analysis of conservation cases proves too distinct from clinical cases to unify, I will prioritize the clinical domain, as the verdicts on loss vs. non-exercise are more immediate and clearly defined in medical practice.

  ***

  **Week-by-Week Plan**

  *   **Week 1:** Finalize case corpus. Select 3 specific clinical transplant scenarios and 3 conservation/bottleneck scenarios where practical verdicts are documented in literature.
  *   **Week 2:** Formalize the definitions of "loss," "change," and "non-exercise" operationalized for the project. Draft the evaluation matrix for the three function accounts.
  *   **Week 3:** Apply Selected-Effect account to the corpus. Record verdicts and note required redescriptions to match practical outcomes.
  *   **Week 4:** Apply Causal-Role and Organizational accounts to the corpus. Record verdicts and note required redescriptions.
  *   **Week 5:** Comparative analysis. Identify where accounts converge and where they diverge from practical verdicts. Draft the "decision rule" hypothesis.
  *   **Week 6:** Stress-test the decision rule against edge cases within the corpus. Refine the typology of regime-shifts.
  *   **Week 7:** Draft the full paper. Focus on the argument for indexical pluralism governed by the decision rule.
  *   **Week 8:** Revision and polishing. Ensure clarity for the mixed committee (biology/medicine). Finalize the failure condition analysis.
