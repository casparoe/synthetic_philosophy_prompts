answer: |-
  1. You say robustness distinguishes privileged computations from trivial ones, but isn't "robustness" just a measure of how well our chosen mapping fits, rather than a property of the system itself?
  if she says it's a property of the system, ask why that property isn't just physics by another name.

  2. How do you define the "relevant range of interventions" without referencing the very computational description you're trying to privilege?
  if she says physical interventions, ask whether a rock survives them better than a brain.

  3. If triviality means a rock implements every FSA, does a billion-rock pile implement the *privileged* computation of a brain if we map the rocks correctly?
  if she says no due to lack of connectivity, ask if connectivity is physical or interpretive.

  4. Neurons operate on continuous electrochemical gradients, not discrete states; does your view require us to treat them as digital abstractions, and where does that abstraction become too lossy to count?
  if she says abstraction is standard, ask if the triviality objection applies to the abstraction layer too.

  5. Is this view distinct from standard functionalism, or does "explanatorily privileged" just mean "the functional role that produces behavior"?
  if she says it's explanatory not ontological, ask if that dissolves the hard problem or just ignores it.

  6. If a system tracks the privileged counterfactuals perfectly but lacks phenomenology, does your account classify it as having a mind?
  if she sidesteps phenomenology, ask if her account explains mind or just behavior.

  7. For whole-brain emulation, is there any test short of running the em that verifies it preserves the *counterfactual* structure rather than just the actual trajectory?
  if she says no, ask if her theory makes uploading empirically undecidable.

  8. If we can't verify counterfactuals without running the system, does your account imply we can never know if an upload is us until it's too late?
  if she says we can simulate counterfactuals, ask if that simulation isn't just another trivial mapping.

  9. Does the privileged computational description have any causal power over the physics, or is it purely a retrospective labeling tool?
  if she says purely labeling, ask why it's privileged rather than just convenient.

  10. What specific empirical finding would force you to abandon the claim that counterfactual robustness fixes computational privilege?
  if she says it's conceptual, remind her she claimed this solves the implementation problem.
