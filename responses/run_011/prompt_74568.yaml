answer: |-
  # JOINT STATEMENT ON HARSANYI'S AGGREGATION AND IMPARTIAL OBSERVER THEOREMS

  **Date:** October 26, 2023
  **Parties:** Camp A ("Theorem as Derivation") & Camp B ("Theorem as Representation")
  **Subject:** Clarification of Disagreements regarding Harsanyi's Utilitarianism

  ## 1. AGREED CLAIMS

  The undersigned parties agree to the following statements as accurate descriptions of the mathematics, the axioms, and the specific numerical case presented.

  1.  **Mathematical Validity:** Harsanyi's Aggregation Theorem is mathematically valid: If individual preferences $\succeq_i$ and social preferences $\succeq_S$ satisfy the vNM axioms (including Independence) over the same set of lotteries, and the Strong Pareto principle holds, then the social utility function $W$ is a positive weighted sum of individual utility functions $U_i$ (plus a constant).
  2.  **Axiomatic Content:** The Independence axiom rules out preferences that depend on the correlation between outcomes and states of the world in ways that violate the sure-thing principle. For individuals, this rules out Allais-type behaviors. For society, this rules out rank-dependent views (e.g., giving extra weight to the worse-off simply because they are worse-off, regardless of the lottery structure).
  3.  **Affine Indeterminacy:** vNM utility functions are unique only up to positive affine transformations ($U' = aU + b$, where $a > 0$). The mathematics of the vNM framework alone does not select a specific zero point or unit for any individual's utility scale.
  4.  **The Ada/Bo Case:** In the specific case provided (Ada and Bo, consequences P, Q, R), summing arbitrary vNM representations yields different social orderings depending on the affine transformation chosen for Bo. Specifically, the unweighted sum of the original scales ranks P highest, while the sum of the rescaled scales ranks Q highest. Both sets of scales represent the exact same underlying preferences over lotteries for Bo.
  5.  **Distinction of Theorems:** There is a formal distinction between the *Aggregation Theorem* (combining fixed individual preferences into a social preference) and the *Impartial Observer Theorem* (a single observer ranking lotteries over social identities). The latter is often used to justify the weights and scale comparability required by the former.
  6.  **Normative Input:** Any move from the Aggregation Theorem to Classical Utilitarianism (equal weights, fixed scales) requires additional assumptions beyond Pareto and Individual vNM-rationality. The parties disagree on whether these additional assumptions are "thin" (conceptual necessities) or "thick" (substantive moral commitments).

  ## 2. DISAGREEMENTS TABLE

  | Dispute | Camp A Wording ("Theorem Does the Work") | Camp B Wording ("Moral Costume") | Classification | Reduces to Crux |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Normative Force** | The axioms (Pareto + vNM) are minimal requirements of rationality. Any agent accepting them is logically compelled to accept the weighted sum result. The moral conclusion is derived, not assumed. | The axioms are substantive moral claims disguised as rationality constraints. Accepting Social Independence is already accepting a specific form of aggregation that blocks non-utilitarian views. | **Substantive** (on the nature of rationality) | Crux 2 |
  | **2. Comparability** | The "Impartial Observer" setup (extended preferences) fixes the zero and unit for each person by comparing (Consequence, Identity) pairs. This solves the Ada/Bo scaling problem internally. | The extended preference ordering merely *maps* the scaling problem; it does not *solve* it. Asserting the observer can compare "Ada-at-P" to "Bo-at-Q" presupposes the comparability the theorem claims to derive. | **Substantive** (on metaphysics of value) | Crux 1 |
  | **3. Anonymity vs. Probability** | Assigning the observer an equal probability of being anyone is the operational definition of Anonymity. It is the same assumption expressed in decision-theoretic language. | Probability (epistemic/ontological) and Anonymity (moral) are distinct categories. Sliding between them conflates "I might be Bo" with "Bo matters as much as Ada." | **Verbal/Substantive Hybrid** | Crux 3 |
  | **4. The Ada/Bo Implication** | This case shows why we need the Impartial Observer theorem to fix the scales. Without it, the Aggregation theorem is incomplete, not wrong. | This case shows that the Aggregation theorem cannot do the work assigned to it. If the math allows the ranking to flip, the "derivation" of utilitarianism is illusory without external normative input. | **Verbal** (on "completeness") | Crux 1 |

  ## 3. THE CRUXES

  To move beyond slogans, the parties agree to treat the following three questions as decisive. For each, we specify a test, the competing predictions, and what would count as changing one's mind.

  ### Crux 1: What Pins Down the Scales?
  **The Question:** Does the "Impartial Observer" mechanism (preferences over consequence-identity pairs) objectively fix the interpersonal zero and unit, or does it merely relocate the normative assumption?

  *   **The Test:** Describe the observer's preference between "Ada having P" and "Bo having Q" *without* invoking utility numbers or assuming a common metric of "well-being" beforehand.
  *   **Camp A Prediction:** We can describe this via "sympathetic identification." If the observer is truly impartial, the *intensity* of Ada's preference for P over R must map to the *intensity* of the observer's preference for being Ada-at-P over being Ada-at-R. This chain links Ada and Bo through the observer's single utility function, fixing the scales.
  *   **Camp B Prediction:** This description smuggles in the metric. Saying the observer's intensity "matches" Ada's is just a metaphor for stipulating $a_{Ada} = a_{Bo}$. If the observer prefers "Ada-at-P" to "Bo-at-Q," that is a brute moral judgment, not a discovery of fact.
  *   **Mind-Changer:**
      *   **For A:** If it can be shown that two different impartial observers, both satisfying vNM axioms and Pareto, could rationally hold different extended preferences over identities without violating "impartiality," then scales are not fixed by rationality.
      *   **For B:** If a formal mechanism is produced that derives unique scale factors from non-evaluative facts (e.g., psychological similarity or neurophysiological data) consistent with the vNM framework, then comparability is not purely normative.

  ### Crux 2: Dropping Social Independence
  **The Question:** If we retain Individual Independence and Pareto but drop *Social* Independence, does the theorem collapse into nothing, or does it still constrain the aggregator significantly?

  *   **The Test:** Propose a specific social welfare function that satisfies Individual vNM + Pareto + Anonymity but violates Social Independence.
  *   **Camp A Prediction:** The remaining constraints are so tight that only "Generalized Utilitarianism" (summing a concave transformation of utility, i.e., Prioritarianism) remains viable. The gap between this and Classical Utilitarianism is small.
      *   *Endorsed Alternative:* **Prioritarianism** ($W = \sum g(U_i)$ where $g$ is concave).
      *   *Objection to B's view:* Camp A predicts Camp B will claim this opens the door to Maximin, but Maximin violates Continuity or Pareto in lottery cases.
  *   **Camp B Prediction:** Dropping Social Independence opens the door to a wide family of rank-dependent and sufficientarian views that are structurally distinct from summing. The "utilitarian residue" is negligible.
      *   *Endorsed Alternative:* **Rank-Dependent Prioritarianism** (weights depend on both utility level and rank).
      *   *Objection to A's view:* Camp B predicts Camp A will object that these views violate "Ex Ante Pareto," which Camp B will argue is not a binding rationality requirement for society.
  *   **Mind-Changer:**
      *   **For A:** If a plausible social welfare function is demonstrated that satisfies all axioms except Social Independence and yields a ranking radically different from any weighted sum (e.g., leximin) without violating Ex Ante Pareto in acceptable ways.
      *   **For B:** If it is proven that any rule satisfying Individual Independence + Pareto must approximate a weighted sum within a narrow error bound in all practical policy cases.

  ### Crux 3: Anonymity vs. Equiprobability (The "Sliding" Charge)
  **The Question:** Is the assumption that the observer has an "equal chance" of being anyone substantively identical to the assumption that everyone counts equally (Anonymity), or is this a category error?

  *   **The Test:** Construct a scenario where the epistemic probability of being a specific person is unequal, but the moral weight remains equal (or vice versa).
  *   **Camp A Prediction:** This is a verbal dispute. In the context of the Impartial Observer, "probability" is not empirical; it is a modeling device for moral weight. To say "I have a 50% chance of being Ada" *just means* "Ada counts 50%."
      *   *Sliding Charge:* Denies sliding. Claims the two theorems are mutually supporting interpretations of the same underlying symmetry requirement.
  *   **Camp B Prediction:** This is a substantive conflation. Probability describes uncertainty; Anonymity describes value. Using probability to derive value commits the naturalistic fallacy (or Hume's Is-Ought).
      *   *Sliding Charge:* Affirms sliding. Camp A uses the Aggregation Theorem (fixed population) to get the sum, then uses the Observer Theorem (uncertain identity) to get the weights, treating them as one argument.
  *   **Mind-Changer:**
      *   **For A:** If Camp B can formulate a coherent theory of "moral weight" that is distinct from "probability in the original position" without collapsing into intuitionism.
      *   **For B:** If Camp A can derive the equal probability assumption from a non-moral premise (e.g., logical indifference) without implicitly assuming moral equality.

  ## 4. CLOSING: THE RESIDUE

  **Merely Verbal:**
  We agree that some friction arises from the definition of "Rationality." Camp A uses a broad definition that includes consistency constraints on social choices. Camp B uses a narrow definition restricted to individual instrumental rationality. Once this terminological difference is acknowledged, the claim "Utilitarianism is rational" translates to "Utilitarianism is the only system satisfying [Broad Rationality Constraints]."

  **Genuinely Substantive:**
  The irreducible disagreement lies in **Crux 1 (Comparability)**. Even if we agree on the math, Camp A believes the "Impartial Observer" provides a *procedure* to fix interpersonal scales objectively. Camp B believes any such procedure ultimately rests on a brute moral intuition that cannot be formalized without circularity. If Camp B is right, Harsanyi's project does not derive utilitarianism; it formalizes it. If Camp A is right, it derives it. This is not a verbal dispute; it is a disagreement about whether moral facts can be reduced to facts about consistent preference orderings.

  ***

  # ANALYST NOTES (Drafter's Commentary)

  ### Where I Would Put My Chips
  I believe **Crux 1 (Pinning Down the Scales)** decides the argument.
  The Aggregation Theorem is mathematically sound, but as the Ada/Bo case proves, it is normatively underdetermined without fixed scales. Camp A's entire defense rests on the Impartial Observer Theorem solving this scaling problem. If the "extended preferences" of the observer are just another way of *stating* interpersonal comparisons rather than *grounding* them, then Camp B wins: the theorem is a representation result, not a derivation.
  **What would change my mind:** If Camp A could demonstrate that "sympathetic identification" imposes *testable constraints* on the observer's preferences that rule out specific scale transformations (beyond just saying "the observer prefers X to Y"). If the observer's vNM constraints force a unique scaling factor based on the *structure* of the individual preferences alone (e.g., risk attitudes), then comparability is derived. If the observer can consistently hold *any* set of extended preferences that respect the individual orderings, then comparability is assumed. Currently, the literature suggests the latter, which is why I side with Camp B on this crux.

  ### Self-Critique on Drafting Bias
  I suspect I have shaded the **Crux 2 (Dropping Independence)** section slightly in favor of **Camp B**.
  *   **The Bias:** In the "Camp A Prediction" for Crux 2, I wrote that the gap between Prioritarianism and Utilitarianism is "small." A sophisticated Camp A proponent might argue that dropping Social Independence destroys the *linearity* which is the essence of the vNM framework, leading to dynamic inconsistency or money pumps for the social planner. By framing the alternative as merely "Prioritarianism," I may have made Camp A's position look like a minor tweak rather than a structural defense of linearity.
  *   **Why it was hard:** It is difficult to neutrally phrase the "Social Independence" axiom without sounding like one is either dismissing moral concerns for the worse-off (Camp A phrasing) or dismissing rational consistency (Camp B phrasing). I tried to mitigate this by having Camp A endorse Prioritarianism as the "next-best," but a hardline Harsanyian might reject Prioritarianism entirely as irrational, not just "non-utilitarian."

  I also risked bias in **Claim 4 (The Ada/Bo Case)** by stating the ranking *flips*. While mathematically true for *arbitrary* scales, Camp A argues the *correct* scales don't flip. I phrased it as "arbitrary vNM representations" to ensure Camp A could sign it, but the implication favors Camp B's skepticism. This was unavoidable given the prompt's setup, but it is a point of tension.
