answer: |-
  This is a remarkably precise observation of cognitive mechanics. You have isolated a specific epistemic event that most readers glide over, and you are right to suspect it has a lineage in the debates you've been reading.

  Here is the breakdown of the candidates within that framework, weighed against your three criteria (No Rule, No Testimony, Memory Ascription), followed by a verdict on the terminology and the distinction between your two examples.

  ### 1. Brainstorming the Candidates

  **Candidate A: *Anumāna* (Inference)**
  *   **What it is:** Knowledge derived from a mark (*hetu*) based on a universal connection (*vyāpti*). Smoke implies fire because smoke is pervaded by fire.
  *   **Does it fit?** Superficially, yes. You see mud, you infer a walk.
  *   **Where it breaks:**
      *   *The "No Rule" Criterion:* *Anumāna* requires a general law ("Where there is mud, there was walking"). You correctly note your readers aren't applying a law; they are resolving a local contradiction. "Mud" doesn't universally imply "Secret Walk." It only implies it because "Bedridden" makes "Mud" impossible otherwise.
      *   *The "Memory" Criterion:* Inference usually carries a "tag." I know I inferred it. If you ask me later, I say, "I figured that out." Your readers say, "I saw that." *Anumāna* does not typically masquerade as *Pratyakṣa* (Perception) in memory.
  *   **Verdict:** This is what the Nyāya school would call it (they fold almost everything into Inference), but your description proves why their opponents argued they were wrong. It's too coarse-grained.

  **Candidate B: *Śabda* (Testimony)**
  *   **What it is:** Knowledge from a trustworthy source (*āpta*).
  *   **Does it fit?** The reader trusts the author.
  *   **Where it breaks:**
      *   *The "No Testimony" Criterion:* *Śabda* requires an utterance. Silence is not *Śabda*. Even if the author *intends* you to know it, if the words aren't there, classical epistemology rejects this as testimony. You cannot get knowledge from silence unless the silence itself is a sign (which loops back to Inference).
  *   **Verdict:** Dead on arrival. The warrant does not come from the speaker's authority, but from the internal logic of the facts provided.

  **Candidate C: *Arthāpatti* (Presumption/Postulation)**
  *   **What it is:** This is the heavy hitter. It is the postulation of an unobserved fact to resolve a contradiction between two observed facts. The classic example: "Devadatta is alive" (Fact A) + "Devadatta is not in the house" (Fact B). These contradict unless we postulate (C) "Devadatta is outside."
  *   **Does it fit?**
      *   *The "No Rule" Criterion:* Perfect fit. *Arthāpatti* does not rely on a universal pervasion like Inference. It relies on the *impossibility* of the alternative. The mother cannot be bedridden *and* have muddy shoes unless she walked. It is the "cheapest way to make them stand together," exactly as you said.
      *   *The "No Testimony" Criterion:* Perfect fit. It arises from the collision of facts, not the word of a speaker.
      *   *The "Memory" Criterion:* Partial fit. *Arthāpatti* yields valid knowledge (*pramā*), but classical debate stops at the moment of knowing. It does not track whether that knowledge feels like a guess or a perception six months later.
  *   **Verdict:** This is the engine. Your "Mud" example is a textbook case of *Arthāpatti*.

  ### 2. The Expert Judgment

  You asked if the thing you describe already has a name. The *logical move* absolutely does: it is **Arthāpatti**.

  However, you have added a phenomenological layer (the Memory Ascription) that the classical debates do not cover. Epistemology (*pramāṇa-śāstra*) is concerned with *validity* (how do we know this is true?), not *psychology* (how does this feel in memory?).

  Here is how I judge the specific tensions you raised:

  **The "Artifact" Problem:**
  Does transplanting this from the world to a novel break the *pramāṇa*? No. In the classical view, *Arthāpatti* works on *data*. In the real world, the data is sensory. In your novel, the data is textual. The cognitive operation is identical. The reader encounters two "facts" (textual assertions) that contradict, and their mind postulates a third to save the coherence of the world. The fact that an author *planted* the contradiction doesn't change the reader's epistemic move; it just means the author is manipulating the *pramāṇa*.

  **The "Testimony" Problem:**
  Does your second point kill the testimony option? Yes. But there is a nuance. In Indian aesthetics (*alaṅkāra-śāstra*), there is a concept of *dhvani* (suggestion), where the meaning lies beyond the literal word. However, *dhvani* is usually about emotion or theme. Your case is about *fact*. So, it is not *Śabda*. It is *Arthāpatti* triggered by text.

  **The "Memory" Problem:**
  Is confident recollection of a scene that was never given a recognised failure? No. In Nyāya, if you remember something that didn't happen, it is *smṛti-bhrānti* (memory error). But in your case, within the context of the story, it *did* happen. The "error" is that the reader forgets the *source* of the knowledge. They treat an *Arthāpatti* (postulation) as if it were *Pratyakṣa* (perception) or *Śabda* (testimony).
  Classical epistemology doesn't have a slot for "Valid Knowledge that forgets its own source." They assume a valid knower knows *how* they know (*anuvyavasāya*). Your readers are losing that tag. This is a specific feature of narrative immersion, not a standard epistemic category.

  ### 3. The Two Examples: Are they the same animal?

  You asked if the "posted letter" belongs with the "river mud."

  **My judgement: No. They are different animals.**

  *   **The River Mud (Arthāpatti):** This relies on **incompatibility**. Bedridden + Muddy Shoes = Contradiction. The mind *must* posit the walk to resolve the tension. There is no other way to hold the text together. This creates a feeling of *necessity*, which is why it solidifies into memory as fact.
  *   **The Posted Letter (Anumāna):** This relies on **convention**. Coat (with letter) -> Train (no letter). There is no contradiction here. He could have lost it, burned it, or kept it in a pocket. The reader assumes he posted it because that is the *path of least resistance* in a narrative, not because the alternative is impossible.
  *   **The Boundary:** The Mud case forces the conclusion; the Letter case invites it. The Mud case feels like *discovery*; the Letter case feels like *continuity*.

  ### 4. Coining the Term

  Since *Arthāpatti* covers the logic but not the memory retention, and since this only happens in narrative artifacts where the contradiction is engineered for effect, the existing term is insufficient for the *bundle*.

  I propose you call this: **Diegetic Arthāpatti**.

  **Definition:** A cognitive event in narrative consumption where the reader resolves a textual contradiction by postulating an unreported event (*Arthāpatti*), which is then stored in memory with the sensory weight of a reported event (*Diegetic*).

  **Boundaries:**
  *   **Separates from Ordinary Gap-Filling:** Ordinary gap-filling is *Anumāna* (Inference). "He got in the car; next he was in London." We infer he traveled. We know we inferred it. *Diegetic Arthāpatti* feels like we were *told* it.
  *   **Separates from Plain Inference:** Inference relies on rules (Smoke -> Fire). *Diegetic Arthāpatti* relies on local contradiction (Alive + Not Home -> Outside).
  *   **Hard Boundary Case:** Your "Posted Letter" example is **not** *Diegetic Arthāpatti*. It is standard narrative inference. It lacks the contradiction. If the text said, "He burned the letter," and then later, "He mailed the letter," *and* the reader resolved this by assuming "He burned a copy," *that* would be *Diegetic Arthāpatti*.

  ### Summary for your purposes

  1.  **The Logic:** You are describing **Arthāpatti** (Presumption). The Nyāya school tries to fold this into Inference, but your intuition that "no rule is doing the work" aligns with the Mīmāṃsā school, who argued *Arthāpatti* must stand alone.
  2.  **The Memory:** This is a literary effect, not an epistemic category. It is the result of *Arthāpatti* being so seamless in a narrative that the "inference tag" drops off, leaving only the "fact."
  3.  **The Term:** Use **Diegetic Arthāpatti** for the Mud case. It distinguishes the *necessity* of the resolution from standard inference.
  4.  **The Letter:** Classify the Letter case as standard **Narrative Inference**. It does not belong in the same bucket because it lacks the contradictory pressure that forces the memory to solidify.

  You have effectively rediscovered the Mīmāṃsā critique of Nyāya through the mechanics of fiction. The "Mud" scene works because it forces the reader to become a co-author of the truth to save the story from contradiction. That act of saving the story is what writes the memory.
