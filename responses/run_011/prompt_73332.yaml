      *Critique:* Need to make sure the transition from "reasons for the award" to "reasons for the praise" is smooth. The petition explains the *timing*, not the *worth*. The 5:40 AM explains the *worth*. The pension explains the *character* (honesty/endurance vs. martyrdom).

      *Refining the Pension Point:* If I say "He stayed for the pension," does that sound unadmirable? Only if admiration requires self-sacrifice for love of the job. If admiration requires reliability despite lack of love, it works. The prompt says "My judgment is that the speech should carry both of these [pension/Marta]... but you must make the loss leave no hole." So I must frame staying for the pension as a form of integrity or endurance, not mercenary behavior. It contrasts with "never complained." He *did* feel the burden (Marta), he *did* consider leaving (money), but he *did* the work (5:40 AM). That is the RKR.

      *Refining the Petition:* The petition is a reason to give the award *now* (WKR). It is not a reason Ray is good (RKR). I need to say something like "The signatures show we noticed," not "The signatures show he is good."

      *Refining the Board/Walkout:* "In the autumn, the school changed. Voices were raised. Decisions were revisited." Neutral.

      *Word Count:* Aiming for 700.

  8.  **Final Polish:** Check the "Second Person" constraint. Check the ending. Ensure no meta-commentary is included in the output.

      *Self-Correction on WKR:* The prompt says "a citation may rest only on the last sort [reasons why Ray is admirable]." So the *praise* must rest on RKRs. The *occasion* can be explained by WKRs. I need to make sure I don't praise him *because* of the petition. I praise him *despite* the petition being the catalyst. The petition is the occasion; the 5:40 AM is the reason.

