answer: |-
  Good evening. For those who do not know me, I teach history here, and I have had the privilege of walking these halls for nineteen years. But tonight, we are not here for the curriculum. We are here for the structure that holds the curriculum up.

  This award is new. We all know how it came to be. In the autumn, the school changed. Decisions were made, voices were raised, and those decisions were revisited. Out of that turbulence, the student council proposed this prize. They gathered eleven hundred signatures on a petition. Those signatures brought us to this room tonight. They explain the timing of this award. They explain the urgency. But they do not explain the merit. A petition can demand a hearing; it cannot manufacture virtue. We are not here to honor Ray Delgado because students asked for it. We are here because, when the students looked closely at what kept this building standing, they saw him.

  For thirty-one years, Ray has unlocked these doors at 5:40 in the morning. That is roughly five thousand mornings. There is a specific kind of weight in that arithmetic. It is not the weight of popularity. It is the weight of presence. When the heating system groans in January, when the floors need to be ready before the first bell, Ray is there. This award recognizes that presence.

  We often tell stories about service that simplify the motive. There is a draft circulating that says Ray was never heard to complain. I know Ray. I know his wife, Marta. To say he never complained would be to erase the reality of the work. Marta has said for years that this job took more out of him than anyone noticed. Ray has told colleagues that there were years he would have left for better money if he had had the nerve. He stayed for the pension. He stayed for the security of his family.

  Some might think that makes the service less noble. I submit it makes it more real. It is easy to serve when the work sings to you. It is much harder to serve when the work is heavy, when the pay is modest, and when you stay primarily because you promised yourself you would see it through. That is not the admiration of a martyr; it is the respect due to a man who shows up even when the romance has faded. The petition explains why we are giving this award now. But Ray's thirty-one years explain why he deserves it forever.

  Ray, you taught this school that reliability is a form of kindness. You taught us that a building is not just a shell, but a commitment kept every single day. You did not do it for the applause. You did it because the lights had to turn on.

  So, when we hand you this plaque, know that it is not a reward for being a symbol of a dispute resolved. It is an acknowledgment of the cost you paid to keep the peace before the dispute ever began. Marta knows that cost. Your sons know that cost. And now, thanks to the voices raised in the autumn, the rest of us know it too.

  Please stand, Ray. And if everyone would join me in raising a glass. To Ray Delgado—for the five thousand mornings, and for the honesty of the work. To Ray.
