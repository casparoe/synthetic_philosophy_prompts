      *   *Counterfactual Intervention:*
          *   Scenario A: Local anesthetic (blocks Na+ channels). Withdrawal fails. (Physical change breaks function).
          *   Scenario B: Slight variation in ion channel protein structure (genetic variance) that preserves conductivity. Withdrawal succeeds.
          *   Scenario C: Synthetic replacement of a neuron with a silicon chip that mimics the input/output profile. Withdrawal succeeds.
      *   *The Point:* The physical description ($P_{exact}$) distinguishes Scenario B and C from the baseline. The psychological/functional description ($M_{withdrawal}$) groups them together. The generalization "Noxious stimulus $\rightarrow$ Withdrawal" holds across B and C, but fails at A.
      *   *Why this matters:* The physical law would have to list every specific protein configuration. The functional law just says "signal transmission intact." The functional law is more *compressible* and *robust* across the relevant counterfactual space, even if only one configuration exists actually.

  5.  **Addressing the "Grain" Objection Directly:**
      *   Bechtel & Mundale say: "You carved the brain state too coarsely."
