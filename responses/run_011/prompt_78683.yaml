      *   *Grain Objection:* Actually, $M$ is always realized by a specific homologous $P$. The "different" realizers were just described too loosely.
      *   *Counterfactual MR:* Even if $M$ is *actually* always realized by $P_{human}$, $M$ is still a valid kind because if we changed $P_{human}$ in specific ways (interventions), $M$-generalizations would still hold. The "kindness" of $M$ depends on its stability across a *space of possible interventions*, not just the distribution of actual instances.
      *   *Key Distinction:* Actual diversity vs. Modal stability.

  3.  **Drafting the Core Argument:**
      *   Start by validating the user's insight. The grain objection targets *actual* taxonomy. The counterfactual view targets *modal* structure. They talk past each other.
      *   Functionalism's goal isn't just to say "aliens could feel pain." It's to say "psychological laws are autonomous from physical laws."
      *   Autonomy comes from *insensitivity*. If I wiggle the physical substrate within a certain range, does the psychological output wiggle? If no, the psychological kind captures a stable pattern that the physical description misses (because the physical description distinguishes the wiggles).
      *   This is essentially an argument about *causal granularity* and *interventionist stability* (Woodward-esque, though I won't cite him per instructions).

  4.  **Developing the Worked Example:**
