      *   *Weaknesses/Red Flags:* Unanimous distrust of outsiders (us vs. them), gatekeeping (don't read specialist guidance until "ready"), pathologizing dissenters (those who leave are "worn down"), concentration of influence (2 labs, one co-directed by a parent in the group), exhaustion-induced compliance (user stopped reading outside material).
