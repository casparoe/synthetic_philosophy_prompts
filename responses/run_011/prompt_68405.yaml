          1.  Direct answer to "Who is reasoning better?"
          2.  Analysis of the group dynamics (The "High-Functioning Echo Chamber").
          3.  Analysis of the User's state (Exhaustion and Epistemic Closure).
          4.  Specific Action Plan.
      *   *Key Insight:* The group's strength (deep knowledge) is the vector for its weakness (gatekeeping). The "Unanimous Distrust" is the biggest red flag. Science is never unanimous.
      *   *Refining the "Wife" aspect:* Don't just say "listen to her." Explain *why* her withdrawal is a rational response to an irrational environment.
