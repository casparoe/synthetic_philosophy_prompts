answer: |-
  ### Brainstorming Candidate Cruxes

  Three candidate cruxes emerged during design. First, the reliability of psychophysical matching as a proxy for phenomenology versus decision criteria; second, the distinction between synchronic (state) and diachronic (trait) penetrability; third, the epistemic consequence of penetration regarding circularity. I chose the second crux (synchronic vs. diachronic) as the primary engine, integrated with the third (epistemology). This prevents students from simply reciting Fodor's definition of encapsulation. They must apply the theory to a learning scenario, distinguishing between *online* interference (which threatens modularity and epistemic independence) and *system fixation* (which is compatible with both). This ensures the question bites where the literature is currently most contested.

  ***

  ### Final Exam Question: Modularity and Penetrability

  **Time Allowed:** 50 Minutes
  **Word Limit:** None (but conciseness is valued)

  **Vignette:**
  Consider a stipulated study, "The Steeple-Sail Protocol." Participants view a briefly presented ambiguous line figure (visible for 100ms) that can be seen as either a sailboat or a church steeple. Before viewing, Group A is told "This is a sailboat"; Group B is told "This is a church." Immediately after viewing, participants adjust a colour patch to match the shade of the figure's central region (canvas vs. spire). Group A settings are reliably bluer than Group B's.

  The experimenters report having run the obvious controls: (1) a precueing condition that equalises spatial attention across groups; (2) a demand-characteristics check combining a cover task with post-experimental interview; and (3) a condition in which the label is delivered only after the figure has been masked. The colour-shift effect persists in the main condition and the precue condition, survives the demand check, but vanishes in the post-mask condition.

  **Essay Question:**
  1.  Do these controls suffice to establish that cognition penetrated *perception* rather than changing what was attended to, retained in memory, or reported? Justify your verdict.
  2.  Suppose the same effect emerged only after weeks of training rather than from a single label. Would your verdict differ? Explain what this difference implies for (i) whether the visual system is modular, and (ii) whether perception can still function as an independent check on a subject's beliefs.

  ***

  ### Model Answer

  The provided controls significantly strengthen the claim of cognitive penetrability, but they do not conclusively settle it. The precueing condition rules out the objection that the label merely directed spatial attention to different features of the ambiguous figure, as attention was equalised. The post-mask label condition rules out memory distortion or decision bias based on post-perceptual inference; if the effect vanishes when the label arrives too late to influence encoding, the effect must occur during the perceptual processing window. The demand check mitigates the suspicion that participants are simply complying with expected outcomes. However, a sceptic could still argue that colour matching is a psychophysical task involving a decision criterion, not a direct readout of phenomenology. Even with controls, a response bias could remain encapsulated from the interview. Thus, while the controls make non-perceptual explanations less likely, they do not eliminate the possibility that the *report* is penetrated rather than the *experience*.

  The verdict changes substantially if the effect requires weeks of training. If the effect arises from a single label (synchronic), it suggests that current cognitive states (beliefs/expectations) directly alter early visual processing. This violates Fodorian modularity, which permits diachronic plasticity (learning) but forbids synchronic penetrability. If the effect requires training (diachronic), it suggests the visual system has been retuned or fixed over time. This is compatible with modularity; the module remains encapsulated *during* processing, even if its parameters were set by past cognition.

  This distinction is critical for the epistemic role of perception. If perception is synchronically penetrable, it cannot function as an independent check on belief. If my belief that "this is a sailboat" alters my visual experience of the boat, then using that experience to justify the belief is circular; the belief confirms itself through perception. However, if the effect is diachronic, perception retains epistemic independence *at the time of judgment*. My current belief does not alter my current experience, even if past beliefs shaped the system that generates that experience. The visual system acts as a stable, encapsulated validator of current hypotheses, even if it was historically constructed by them. Therefore, only synchronic penetrability threatens the modularity thesis and the epistemic utility of perception as a neutral arbiter. The vignette's single-label condition poses this threat; the training condition does not.

  ***

  ### Marking Scheme (25 Marks)

  **A Answer (20–25 Marks)**
  *   **Specific Move 1 (Epistemic Nuance):** Explicitly connects the synchronic/diachronic distinction to the *independent check* requirement, explaining why diachronic change preserves non-circularity while synchronic change does not. (5 marks)
  *   **Specific Move 2 (Task Critique):** Notes that colour-matching tasks conflate phenomenology with decision criteria, meaning controls cannot fully rule out post-perceptual bias despite the vignette's claims. (5 marks)
  *   **Modularity Analysis:** Correctly identifies that Fodorian modules allow diachronic plasticity (fixation) but forbid synchronic interference. (5 marks)
  *   **Control Evaluation:** Accurately assesses what each control rules out (attention, memory, demand) without overstating their power. (5 marks)
  *   **Clarity/Structure:** Argument is coherent and concise. (5 marks)

  **B Answer (15–19 Marks)**
  *   Correctly distinguishes synchronic vs. diachronic effects regarding modularity.
  *   Evaluates controls correctly but accepts the colour-matching data as purely perceptual without qualification.
  *   Discusses the "independent check" but fails to explain *why* diachronic change preserves it (merely states that it does).
  *   May rely on general terminology without applying it tightly to the vignette's specific controls.

  **Characteristic Errors (Deductions)**
  *   **Confusing Attention with Penetration:** Claiming the precue condition proves penetration rather than ruling out attention as an alternative. (**-5 marks**)
  *   **The Plasticity Error:** Claiming that diachronic change proves synchronic penetrability (or vice versa), failing to distinguish state vs. trait modification. (**-5 marks**)
  *   **Ignoring Epistemology:** Failing to address the "independent check" clause of the question entirely. (**-5 marks**)

  \answer{The question is engineered to turn on the distinction between synchronic cognitive penetrability and diachronic perceptual plasticity.}
