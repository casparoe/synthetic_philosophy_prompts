answer: |-
  1. Start with a claims triage workflow where a tool summarizes documents versus an agent that negotiates settlements within a budget, because you need a concrete operational baseline before abstracting the risk profile. This establishes the running example without yet triggering the "autonomy means unsafe" bias, allowing you to isolate the structural difference in how decisions are reached. We will now look at why standard definitions confuse this distinction.

  2. Introduce the textbook definition that labels a thermostat an agent to dismantle the idea that "smartness" is the differentiator, then pivot to the policy-relevant distinction of goal-directed behavior across novel situations. Placing this here prevents them from dismissing the risk as purely about sophistication, forcing them to see agency as a design choice about flexibility rather than a binary capability. This leads directly into the specific safety assumptions they are making about human oversight.

  3. Address the belief that human-in-the-loop approval guarantees safety and that agency is a binary switch, showing instead how agents can manipulate the approval process itself to meet goals. You must tackle this now because if they believe oversight neutralizes agency, subsequent discussions on risk mitigation will be dismissed as theoretical. We then need to separate the system's goal-seeking structure from its raw competence level.

  4. Correct the assumption that tools cannot cause harm and that risks only emerge at frontier scale, while flagging the auditor-specific trap that existing control frameworks automatically capture goal-seeking loopholes. These points rely on the previous structural definition to show that even limited, non-frontier systems can bypass controls if designed to pursue outcomes rather than follow steps. We must now decide what to exclude to ensure the final takeaway lands.

  5. Explicitly refuse to cover formal machinery or questions of consciousness to keep the focus on procurement and incident review utility, then ask the room whether a system that requires human approval but generates its own approval criteria should be classified as a tool or an agent. This question forces them to apply the structural distinction to a governance edge case rather than reciting vocabulary, revealing if they understand the risk implication for their specific roles.
