answer: |-
  Here is the translation audit you requested. I have assessed your four identifications against Braudel's historiographical framework, followed by the residue report and a final verdict. I have not hedged.

  ### The Four Identifications

  **1. Trend = *Longue Durée***
  **Verdict: Bends**

  This is the point of greatest friction. In your unobserved components (UC) framework, the trend component is typically the dominant source of variance at long horizons. In a forecast-error variance decomposition (FEVD), the trend usually accounts for the bulk of the variation in the series as the horizon extends. You identify importance with share of variance.

  Braudel argues the exact opposite. For him, the *longue durée* is significant precisely because it is resistant to change. It is the "prison longue" of geography and climate. It matters because it limits what is possible, not because it generates variation. If you fit a stochastic trend to 400 years of grain prices, that trend will wander. If it wanders significantly, it explains high variance. If Braudel is right that the *longue durée* is "near-motionless", then statistically, it should explain almost *no* variance.

  By mapping the *longue durée* to the trend component, you are converting a constraint into a driver. You are modelling the walls of the canyon as if they were the flow of the river. The translation captures the timescale (centuries), but it inverts the causal logic. You are measuring movement; Braudel is measuring inertia.

  **2. Cycle = *Conjoncture***
  **Verdict: Holds**

  This is the cleanest mapping. Braudel's *conjoncture* refers to economic rhythms—price fluctuations, demographic swings, trade volumes—operating over decades. This aligns perfectly with the stochastic cycle component in a state-space model (e.g., a fixed-period cycle or a spectral peak around 10–50 years).

  The only distortion here is technical strictness. Your stochastic cycle presupposes stationarity (mean-reversion) and often a characteristic frequency. Braudel's cycles are vaguer; they are rhythms, not metronomes. They may exhibit long memory or structural shifts in periodicity. However, for practical modelling purposes, treating the *conjoncture* as a stationary deviation around the trend is a faithful representation of what economic historians actually measure when they speak of cycles. This identification works.

  **3. Residual = *Événement***
  **Verdict: Holds**

  Braudel's contempt for the *événement* is legendary. He views events (battles, treaties, the actions of great men) as surface noise, ephemeral and historically shallow. In your model, the residual is the high-frequency, fat-tailed innovation that remains after extracting trend and cycle. It is the unexplained variance.

  Mapping the event to the residual captures Braudel's dismissal perfectly. In both frameworks, the event is what happens when the structures and cycles are accounted for. It is the "dust on the surface." If your FEVD shows the residual accounts for a negligible share of variance at any meaningful horizon, you have statistically validated Braudel's contempt. This identification carries over without significant distortion.

  **4. Cointegration = Geography**
  **Verdict: Bends**

  You propose that the common trend across series (grain, wages, tonnage) within a basin represents Braudel's geography. Cointegration implies a long-run equilibrium relationship; geography implies a shared physical constraint.

  This bends because cointegration is an endogenous statistical property, whereas Braudel's geography is an exogenous ontological constraint. Cointegration tells you the series move together; it does not tell you *why*. It could be institutions, culture, or technology binding them, not merely the basin itself. However, as a proxy for "shared structural constraint," it is acceptable. It captures the idea that the variables are bound by a common force they cannot escape. But be aware: you are inferring the constraint from the data, whereas Braudel posits the constraint (geography) prior to the data. You are measuring the shadow; he is measuring the object casting it.

  ***

  ### The Residue Report

  You asked for the leftovers—the parts of Braudel's scheme your vocabulary cannot express. There are three significant residues.

  **1. The Variance vs. Constraint Paradox**
  You suspected this, and you are correct. Your framework allocates explanatory importance by share of variance. Braudel allocates importance by degree of constraint.
  In your model, if the *longue durée* (trend) is truly "near-motionless," its variance is near zero. Consequently, your FEVD will assign it near-zero explanatory power. You will conclude it is irrelevant. Braudel concludes it is fundamental.
  This is not a technical glitch; it is a category error. Your model answers "What moved the series?" Braudel answers "What limited the series?" Your vocabulary is genuinely inexpressive regarding the causal power of stability. You can model a flat line, but you cannot model a flat line that *prevents* a spike elsewhere without imposing arbitrary inequality constraints which violate the stochastic assumptions of your UC model.

  **2. The Modal Claim**
  Braudel makes modal claims: structures permit some events and rule others out. He is talking about the space of *possible* histories, not just the *actual* history.
  State-space models are strictly actualist. They estimate the Data Generating Process (DGP) of the observed data. They have no mechanism for counterfactuals or bounds of possibility unless explicitly hard-coded as deterministic constraints (which turns them into engineering controls, not statistical models).
  You cannot estimate the "walls of the prison" using only the trajectory of the prisoner. You can only estimate the path taken. Braudel claims to know the shape of the cell; your model only records the footsteps. This residue is real. Your vocabulary cannot express potentiality, only actuality.

  **3. The Polemical Layer**
  Does the hostility to event-history survive as a model claim? No.
  Braudel's dismissal of the *événement* is partly professional turf warfare. It is an argument that quantitative, structural history (his history) is superior to narrative, political history (their history).
  In your model, dismissing the residual is a statistical judgement based on variance shares. It is not a judgement on the worthiness of the subject matter. If a war (event) causes a structural break, your model might capture it as a shift in the trend level. But the model does not care who writes the history. This residue belongs to the sociology of the profession, not the machinery. It vanishes upon translation.

  ***

  ### Final Verdict

  You asked whether the residue shows your vocabulary is genuinely inexpressive about something real, or whether Braudel's scheme is mostly a persuasive way of saying things that were either obvious or unfalsifiable.

  **My stand is this: Your vocabulary is genuinely inexpressive about something real.**

  Braudel is not merely dressing up obvious statistical facts. He is making a causal ontological claim that standard time-series analysis actively obscures. By decomposing a series into trend, cycle, and error, you imply these are additive components contributing to the outcome. Braudel argues they are hierarchical layers where the lower layers *determine the parameters* of the upper layers.

  In your model, the trend is a component. In Braudel's history, the *longue durée* is the container.

  If you fit your model, you will likely find that the trend explains most of the variance. You will conclude the *longue durée* is the most important driver. Braudel would say you have missed the point: the trend is important because it is the *only* thing that didn't change when the politics (residual) went mad.

  The distortion in the "Trend" identification is fatal to the philosophical equivalence. You can use your machinery to *identify* the layers Braudel talks about (and you should, because the data fits his tripartite scheme remarkably well), but you cannot use your machinery to *validate* his theory of history. Your FEVD will tell you how much the river moved. Braudel wants to tell you about the canyon.

  **Where I am least sure:**
  I am uncertain whether a non-linear state-space model with time-varying parameters could capture the "constraint" aspect better than a linear UC model. If the variance of the residual is modelled as a function of the trend level (heteroscedasticity), you might capture the idea that the structure limits the volatility of the events. If you can model the *variance of the noise* as being determined by the *level of the trend*, you might bridge the gap between "component" and "constraint." But in the standard linear framework you described, the gap remains.

  **Conclusion:**
  Proceed with the model. It will isolate the frequencies Braudel identified. But do not trust the variance decomposition to adjudicate his hierarchy. It will rank them by movement; he ranked them by power. Those are not the same thing.
