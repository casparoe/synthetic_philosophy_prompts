answer: |-
  ### Requirements for a Framework Assessing Subsistence Transitions

  To render a verdict on whether the transition made Valley A "worse off," a framework must satisfy the following requirements. Each is motivated by a specific methodological or ethical hazard present in the hypothetical case.

  1.  **Explicit Axiological Derivation of Welfare Metrics**
      *   *Requirement:* The framework must derive its primary metric of welfare (e.g., stature, longevity, autonomy) from a stated ethical theory rather than treating biological markers as self-evident goods.
      *   *Motivation:* In Valley A, health declines while population survives. Prioritizing bone quality over existence is a value judgment, not a biological fact. A framework that stipulates "health = welfare" without justification conflates medical pathology with human well-being.

  2.  **Resolution of the Non-Identity Problem**
      *   *Requirement:* The framework must state whether harm is assessed relative to the specific individuals who existed (person-affecting) or relative to the state of affairs (impersonal).
      *   *Motivation:* The generations in Valley A five centuries post-transition would not have existed had the transition not occurred. If harm requires making a *specific person* worse off than *they* would otherwise have been, the transition cannot be harmful to them. A framework must declare if it counts the creation of new, suffering lives as a net negative or a neutral exchange.

  3.  **Aggregation Rule for Population and Quality**
      *   *Requirement:* The framework must specify how to weigh a larger population with lower individual welfare against a smaller population with higher individual welfare.
      *   *Motivation:* Valley A has triple the surviving children but worse health. A "Total" view (sum of welfare) favors A; an "Average" view favors the foraging baseline. Without an explicit aggregation rule, the verdict fluctuates based on hidden demographic assumptions.

  4.  **Independent Valuation of Inequality**
      *   *Requirement:* The framework must declare whether inequality is a intrinsic harm or only instrumental (harmful only if it reduces total or average welfare).
      *   *Motivation:* A minority in Valley A possess grave goods while others show stress. If inequality is intrinsically harmful, A is worse off regardless of average caloric intake. If instrumental, the framework must prove the elite's gain caused the majority's loss.

  5.  **Distinction Between Structural Outcome and Intentional Error**
      *   *Requirement:* The framework must separate the assessment of the *outcome* (worse off) from the assessment of the *decision* (mistake).
      *   *Motivation:* There was no single chooser in Valley A. Language of "mistake" implies agency and avoidability. A framework must determine if a transition driven by demographic lock-in can be judged as a failure of rationality or merely a tragic structural shift.

  6.  **Dynamic Counterfactual Baseline (Lock-in)**
      *   *Requirement:* The framework must compare the transition not against the initial foraging baseline, but against the viable alternatives available at the time of judgment.
      *   *Motivation:* Five centuries in, the alternative to farming in Valley A was not foraging but collapse. A verdict of "worse off" based on the initial baseline ignores that the population was trapped. The comparison must be Farming vs. Collapse, not Farming vs. Foraging, for later generations.

  7.  **Interpretation of Revealed Preference (Valley B)**
      *   *Requirement:* The framework must assign an evidentiary weight to Valley B's independent, delayed adoption.
      *   *Motivation:* Valley B adopted the same package voluntarily after 1,500 years. This suggests the package offers benefits not visible in skeletal data (e.g., risk buffering, political power). A framework ignoring B treats the transition as a contagion rather than a choice, risking selection bias.

  8.  **Taphonomic and Demographic Correction**
      *   *Requirement:* The framework must explicitly model the missing populations implied by the burial record.
      *   *Motivation:* The data samples the buried and sedentary. If foragers were cremated or farmers buried the poor in unmarked pits, the skeletal record is biased. A framework taking the bone record as a census of the living fails basic source criticism.

  9.  **Temporal Weighting Rule**
      *   *Requirement:* The framework must define how to weight welfare across generations (e.g., does the first century of stress count more than the fifth century of stability?).
      *   *Motivation:* The transition is a process. A verdict based solely on the initial health shock ignores adaptation. A framework must state if it assesses the transition cost, the steady state, or the time-integrated experience.

  10. **Bracketing of Hindsight**
      *   *Requirement:* The framework must exclude downstream historical knowledge (e.g., state formation, epidemics) from the assessment of the transition itself.
      *   *Motivation:* We know farming led to cities and plagues; Valley A did not. A framework that judges the transition by its ultimate historical consequences conflates subsistence with political complexity.

  11. **Falsifiability Condition**
      *   *Requirement:* The framework must specify what empirical finding would force it to reverse its verdict.
      *   *Motivation:* In comparative projects with poorer data, unfalsifiable frameworks become tautologies. If no bone data could prove Valley A was "better off," the framework is an ideology, not a method.

  ### Distinctions and Constraints

  **Mistake vs. Worse Off**
  A framework must not collapse the distinction between the transition being a *mistake* and it making people *worse off*. "Mistake" implies a subject capable of choosing otherwise; "Worse Off" describes a comparative state of welfare. In Valley A, the transition may have made people worse off (health decline) without being a mistake (no viable alternative existed due to lock-in). Conversely, it could be a mistake (a avoidable error by elites) without making the average person worse off (if inequality masked general gains). A rigorous framework assesses the welfare state independently of the decision architecture.

  **Non-Negotiable Requirements vs. Camp Commitments**
  *   **Non-Negotiable:** Requirements 8 (Taphonomic Correction), 9 (Temporal Weighting), and 11 (Falsifiability). These are methodological necessities for any comparative archaeology. Without them, the data is misread, the process is flattened, and the conclusion is immune to evidence.
  *   **Camp Commitments Masquerading as Requirements:** Requirement 1 (Welfare Metrics) often hides a commitment. Specifically, the demand that **"biological stress markers must be the primary metric of welfare"** is a commitment of biological determinism masquerading as objective science. It privileges physiological health over autonomy, risk buffering, or cultural continuity without justification. Similarly, Requirement 3 (Aggregation) often hides a Utilitarian commitment (Total vs. Average) presented as a mathematical necessity.

  **Jointly Unsatisfiable Subset**
  The following subset of requirements is jointly unsatisfiable:
  1.  **Person-Affecting Harm Principle:** Harm must be demonstrated by showing specific individuals are worse off than *they* would have been otherwise.
  2.  **Non-Identity Fact:** The individuals in Valley A (post-transition) would not have existed had the transition not occurred.
  3.  **Verdict on "Worse Off":** The framework must render a definitive verdict on whether the transition made the population worse off.

  If (1) and (2) are held, (3) is logically impossible for the post-transition generations. They cannot be worse off than they would have been, because the alternative is non-existence. A framework demanding all three will fail or resort to equivocation. One must be dropped: either abandon the person-affecting principle (accepting impersonal harm), deny the non-identity fact (claiming the same people would exist anyway), or refuse to render a verdict on the new population.

  **Single Eliminating Requirement**
  **Requirement 11 (Falsifiability Condition)** eliminates the largest number of otherwise attractive frameworks. Most narratives of the Neolithic transition are post-hoc explanations tailored to fit known outcomes. Demanding that a framework specify *in advance* what evidence would prove the transition "beneficial" or "catastrophic" disqualifies deterministic models (which claim inevitability) and purely interpretive models (which claim meaning is in the eye of the beholder). It forces the framework to risk being wrong.

  ### Locating the Familiar Verdicts

  The "Catastrophe" verdict typically satisfies the Welfare Metric and Inequality requirements but fails the Lock-in and Non-Identity requirements; it judges Valley A against an idealized foraging baseline that was no longer an option and treats the existence of the new population as a net negative without addressing the person-affecting constraint. The "Net Gain" verdict typically satisfies the Aggregation and Revealed Preference requirements but fails the Taphonomic and Falsifiability requirements; it assumes population growth equals welfare and treats Valley B's adoption as proof of benefit without correcting for the bias that only successful farming communities leave the skeletal traces used to make the comparison. Both verdicts generally collapse the distinction between Mistake and Worse Off, treating the outcome as a moral judgment on the actors rather than a structural assessment of the trap.
