answer: |-
  The Commission's record displays a clear evolutionary trajectory rather than static opportunism, though your supervisor is correct that the *weighting* of principles shifts depending on the factual matrix. The jurisprudence moves from *Kavna*'s establishment of a remedial right conditioned on reciprocity, through *Marren* and *Sarnia*'s limitations on economic harm and territorial concentration, to *Ostmark*'s procedural hard gate, and finally *Bela*'s synthesis: a remedial right may be exercised despite economic interdependence, provided viability is secured through transition and joint authority.

  The Vessa determination turns on the collision between the *Bela* precedent (grievance + vote + infrastructure = conditioned negotiation) and the *Sarnia* precedent (lesser remedies unexhausted = refusal). Vessa's grievance (health cordon, arrests) is significantly graver than *Sarnia*'s (funding cuts), aligning it closer to *Kavna* and *Ostmark*. However, Vessa's internal conduct regarding the mainland minority (expropriation without compensation) violates the *Kavna/Tirn* reciprocity principle more egregiously than any prior claimant. Furthermore, the open offer of free association introduces a *Sarnia*-style subsdiarity hurdle not present in *Kavna* or *Bela*.

  Despite these tensions, the Commission is unlikely to issue a flat refusal. A refusal would effectively validate the central government's disproportionate health cordon and arrests by denying the victimized population any recourse, which contradicts the remedial core established in *Kavna* and *Ostmark*. Conversely, an immediate right is impossible given the cable infrastructure risk (*Marren/Bela*) and the minority rights violations (*Kavna/Tirn*). The Commission prefers to keep parties at the table rather than issue final judgments that might be ignored. Therefore, the prediction is an endorsement of a right to negotiate, subject to stringent conditions that mirror *Bela* but expand into the human rights domain.

  The closest analog is **Bela (2022)**. Both involve a clear referendum mandate, documented central state grievances, and critical infrastructure dependency that threatens the remainder state. The analogy breaks because Bela's complications were purely economic and logistical (port, pensions), whereas Vessa's involve fundamental liberal rights (property, franchise) and a formal political offer (free association) that Bela did not face.

  Regarding your candidate rules: The **Plebiscitary Primary-Right Rule** is already excluded by the record. *Marren Delta* and *Ostmark* definitively establish that a clear vote is insufficient without either a lack of harm to the remainder or procedural integrity. The **Remedial-Right-Only Rule** is insufficient because *Bela* and *Marren* show that economic viability constrains the right. The **Reciprocity Rule** is strong but incomplete; *Kavna* established it, but *Bela* shows it can be overridden by viability concerns if conditioned. The **No-Stranding Rule** is the dominant constraint in recent opinions (*Marren, Bela*), but it does not account for the *Sarnia* subsdiarity principle.

  The rule the Commission is actually running is a **Conditional Remedial Right with Viability and Liberal Constraints**. It grants a pathway to independence only when: (1) grievance is systematic; (2) procedure is free; (3) the remainder is not stranded (via conditions); and (4) the new state meets liberal standards regarding its own minorities.

  The matter is not genuinely underdetermined. As noted, the Plebiscitary rule is dead. The tension lies only between the weight of the "Free Association" offer versus the gravity of the "Health Cordon" grievance.

  To discriminate among the surviving rules in the future, you need a case that isolates the **Subsidiarity** variable. A case with Grievance + Vote + No Infrastructure Risk + No Minority Issues, but with a credible Autonomy Offer on the table. If the Commission refuses independence there, Subsidiarity trumps Remedial Right. If they grant negotiation, Remedial Right trumps Subsidiarity when violations are grave.

