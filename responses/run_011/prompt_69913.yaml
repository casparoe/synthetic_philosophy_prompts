prompt: |-
  Okay so I keep going back and fourth on the Browning/Goldhagen fight, and what I actually want is a designed case rather than another tour of the historiography. Both sides are ultimately making claims about what would happen under conditions nobody got to observe. The situational side says the scaffolding is doing most of the work — peer surveillance, career stakes, a direct order, no clean way out. The dispositional side says the culturally supplied belief about the victims was already sufficient, and the scaffolding mostly just let people act on what they already held. I want a thought experiment that makes those two claims issue different, checkable predictions.

  Here's the build. Contemporary and realistic: a contracted security outfit running a holding facility for a group the surrounding society already devalues. No lab, no lab coat, no uniforms-and-anonymous-mob business, no sci-fi tech, no mind control, no historical Nazis. Scenario itself capped at two paragraphs. Then hold one variable nailed down and vary the other. The belief content has to be the same in both arms, stipulated at a level both sides would agree is genuinely present in that society — nobody gets to win by quietly making one arm full of true believers. What varies is the scaffolding, and the contrast I care about is temporal: one arm where the scaffolding gets withdrawn partway through (new supervisor, rotations, the logging stops, opting out costs nothing and nobody would ever notice), versus one arm where it stays bolted on the whole time.

  Deliverable: for each arm and each phase, tell me what the situational account predicts about the rate *and the character* of participation, what the dispositional account predicts, and why each prediction falls out of that account's own commitments rather than out of something you built into the setup. Then the honest part — name the single feature of the case that's doing the discriminating work, describe what the case looks like with that feature deleted, and give me both attacks: how a Goldhagen-type would go after the design and how a Browning-type would, and its worth saying explicitly which of those attacks actually lands and which one bounces.

  Three things to face rather than route around. One: if the belief variable and the situation variable can't in fact be varied independently — if the scaffolding works *by* changing what people believe about the detainees — then say so, explain what that does to the design, and rebuild it so the discrimination still goes through. Two: decide whether habituation belongs in the case. If people who've already done it start seeing themselves as the sort who does it, the situational account predicts persistence after withdrawal too, and my clean contrast evaporates; tell me whether you kept habituation in or engineered it out, and defend the call. Three: don't lean on exact figures or contested specifics from the real historical record. I know the battalion and I know what the commander offered his men before the first action — I'm not testing you on that, I'm testing whether the design holds up.
