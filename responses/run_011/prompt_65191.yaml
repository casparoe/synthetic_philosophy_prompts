answer: |-
  ### Exam Question (Question 1 of 3)

  **Time Allocation:** 50 Minutes
  **Suggested Word Count:** 750–850 words
  **Instructions:** Closed Book. Answer *one* of the following three questions.

  **Question 1: The Structure of Whig History**

  In your readings this term, you encountered two competing definitions of "Whig history."
  1.  **The Evaluative Definition:** Whig history is the error of judging the past by the standards of the present, specifically by treating history as a moral march of progress toward our current, superior state.
  2.  **The Structural Definition:** Whig history is the error of narrative selection, where the historian organizes the past exclusively around the causal ancestors of present-day institutions, thereby abridging "dead ends" and failed alternatives that do not lead to us.

  Consider the following hypothetical monograph: *The Carceral Trap* by Dr. Aris Thorne. Thorne argues that the modern prison system is not a triumph of civilization but a catastrophic failure of social imagination that has impoverished human freedom. Thorne's verdict is explicitly **anti-progress**. However, Thorne's method traces the history of punishment *only* through the specific statutes, court cases, and architectural designs that directly survived to become the modern prison system. Thorne ignores contemporary penal experiments that failed, alternative justice models that were discarded, and social movements that opposed incarceration but left no institutional legacy. The narrative is organized entirely by the question: "How did *this* specific thing lead to *our* current prisons?"

  **Prompt:**
  Is *The Carceral Trap* an instance of Whig history? In your answer, you must decide whether the label "Whig" applies to a history that is pessimistic about the present but structurally presentist in its selection. Argue whether the term "Whig history" retains its critical utility if divorced from the claim of moral progress.

  ***

  ### Model Answer

  **Title:** The Geometry of Narrative: Why Pessimism Does Not Cure Whiggism

  Dr. Aris Thorne's *The Carceral Trap* presents a paradox for the historian: it is a history that condemns the present while being constructed entirely by the present. To determine if this counts as Whig history, we must adjudicate between the evaluative and structural definitions provided. While the evaluative definition is the most common colloquial understanding, relying on it renders the concept of "Whig history" toothless against sophisticated presentism. Therefore, *The Carceral Trap* must be classified as Whig history. The core sin of Whiggism is not cheerleading; it is a specific distortion of narrative geometry that persists regardless of the historian's moral verdict.

  The evaluative definition posits that Whig history is essentially a tone problem—a failure of moral humility where the past is seen as a dark prelude to a enlightened now. If we accept this definition exclusively, Thorne is innocent. Thorne argues that we are worse off, not better. The narrative arc is one of decline, not ascent. However, this definition conflates the *conclusion* of the history with the *method* of the history. A historian can arrive at a pessimistic conclusion using a distorted map. If the definition of Whig history is limited to "progressivism," it ceases to be a tool for critiquing historical methodology and becomes merely a critique of political optimism.

  The structural definition offers a more robust philosophical tool. Herbert Butterfield's original critique was not merely that Whigs loved the present, but that they abstracted the past to serve the present. This involves a specific selection bias: organizing the past into a necessary lineage of the current moment. In *The Carceral Trap*, Thorne commits this structural error precisely. By tracing only the statutes and architectures that survived to become modern prisons, Thorne implies a necessity to the current system. The "dead ends"—the alternative justice models, the failed abolitionist experiments—are treated as noise rather than signal. Even if Thorne hates the result, the narrative structure suggests that the current prison system was the inevitable outcome of history, simply because no other causal pathways are explored.

  Critics might argue that calling a pessimistic history "Whig" stretches the term until it breaks. If Whig history means "any history organized by the present," then all history is Whig, and the term is useless. This objection, however, misses the specific constraint Thorne operates under. It is possible to write history from the present without being Whiggish, provided the historian actively reconstructs the "forks in the road" that were visible to historical actors. A non-Whig history of prisons would spend as much time on the alternatives that *didn't* win as on the institutions that did. It would treat the present as one contingency among many, rather than the gravitational center of the narrative. Thorne fails this test. The narrative gravity pulls everything toward the modern prison, making the present the sole criterion of relevance.

  Therefore, the label "Whig" earns its keep precisely in cases like Thorne's. If we only use the label to attack optimistic histories, we allow pessimistic historians to escape scrutiny for the same methodological sins. A history that says "we are doomed because history inevitably led us here" is just as structurally Whiggish as one that says "we are saved because history inevitably led us here." Both rely on a telescoped view of the past where the winner (the present) takes all the explanatory space.

  In conclusion, *The Carceral Trap* is Whig history. The term must be understood as describing a structural relationship between the narrator and the evidence, not a moral valuation of the outcome. To restrict "Whig" to "progressive" is to protect pessimistic presentism from critique. The utility of the concept lies in its ability to expose how selection bias creates an illusion of necessity, regardless of whether that necessity is celebrated or lamented.

  ***

  ### Marking Scheme (Total: 25 Marks)

  **Grade Boundaries & Specific Moves**

  **A Range (21–25 Marks)**
  *   **Thesis:** Explicitly commits to a position (Yes, it is Whig) based on the priority of structure over evaluation.
  *   **Definition (Structural):** Clearly articulates that Whiggism is a selection/narrative bias (ignoring dead ends), distinct from moral optimism.
  *   **Application:** Applies this specifically to Thorne's exclusion of "failed alternatives" and "contingency."
  *   **Counter-Argument:** Anticipates and refutes the objection that "Whig = Progress." Explains *why* keeping the term useful requires including pessimistic presentism.
  *   **Distinction:** Successfully distinguishes between "writing from the present" (unavoidable) and "organizing by the present" (Whiggish).
  *   *Note:* A 24-25 will offer a particularly sharp formulation of "narrative geometry" or "illusion of necessity." A 21-23 might be slightly less polished but hits all logical beats.

  **B Range (17–20 Marks)**
  *   **Thesis:** Commits to a position but may waver slightly on the justification.
  *   **Definition:** Identifies the structural definition but may struggle to fully separate it from the evaluative one (e.g., spends too much time defining progress before dismissing it).
  *   **Application:** Applies the concept to Thorne but might focus more on the "prison" example generally rather than the specific methodological exclusion of dead ends.
  *   **Counter-Argument:** Acknowledges the "pessimism" objection but refutes it less convincingly (e.g., "It's still presentist" without explaining why that makes it Whig).
  *   *Differentiation:* A 19-20 usually fails to make the "utility of the term" argument (why we should keep the label). A 17-18 might identify the structural issue but conclude "it's a new kind of Whig" rather than arguing it fits the core definition.

  **C Range (13–16 Marks)**
  *   **Thesis:** Hedges significantly ("It depends on how you define Whig").
  *   **Definition:** Relies primarily on the Evaluative Definition (Whig = Progress).
  *   **Application:** Argues that because Thorne is pessimistic, he cannot be Whig (or argues he is Whig simply because he talks about the present).
  *   **Missed Move:** Fails to engage with the "selection/dead ends" constraint in the prompt. Treats the prompt as a general query on presentism.
  *   *Differentiation:* A 15-16 shows good writing but misses the philosophical distinction. A 13-14 misunderstands the structural definition provided in the stem.

  **D/F Range (0–12 Marks)**
  *   **Content:** Does not answer the specific question. Claims Whig history is simply "lying about the past" or "being biased."
  *   **Usage:** Ignores the case study details (Thorne's method).
  *   **Structure:** No clear argument or conclusion.

  ***

  ### Common Student Answers & Grade Ceilings

  **1. The "Literalist" (Ceiling: 15/25)**
  *   **Argument:** "Whig history is defined by the belief in progress. Thorne argues against progress. Therefore, Thorne is not writing Whig history."
  *   **Failure:** These students cling to the Evaluative Definition (Definition 1) and ignore the Structural Definition (Definition 2) provided in the stem. They treat the prompt as a vocabulary test rather than a philosophical problem. They miss the point that the *method* might be Whiggish even if the *verdict* is not.
  *   **Why not higher:** They fail to engage with the core tension of the prompt (the gap between structure and evaluation).

  **2. The "Nihilist" (Ceiling: 18/25)**
  *   **Argument:** "All history is written from the present, so all history is Whig. The term is useless and should be discarded."
  *   **Failure:** This is a strong critical move, but often functions as an escape hatch. While philosophically defensible, it often bypasses the instruction to decide "whether the label is earning its keep." It dissolves the distinction rather than analyzing the specific structural bias of Thorne's work.
  *   **Why not higher:** It avoids the specific work of distinguishing between *unavoidable present perspective* and *avoidable presentist selection*, which is required for an A-grade response.

  **3. The "Synthesizer" (Target for A) (Ceiling: 25/25)**
  *   **Argument:** "It *is* Whig history. The term describes a narrative architecture (selection of ancestors) that creates an illusion of inevitability. This architecture functions identically whether the historian loves or hates the outcome."
  *   **Success:** This student recognizes that "Whig" is a critique of *causality and selection*, not just *tone*. They use the Thorne case to prove that pessimistic determinism is just as historically distorted as optimistic determinism.

  **4. The "Confused Presentist" (Ceiling: 12/25)**
  *   **Argument:** "Thorne is Whig because he cares about the present. If he cared about the past for its own sake, he wouldn't write about prisons."
  *   **Failure:** Confuses the *topic* (modern institutions) with the *method* (tracing lineages). Fails to understand that one can write about the present without being Whiggish (by recovering dead ends). This indicates a fundamental misunderstanding of the seminar's core concepts.
