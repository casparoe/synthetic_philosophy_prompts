answer: |-
  This is a sharp puzzle, and your intuition that the framework is straining here is correct. The Greece 2015 episode is not a standard Schellingan bargaining failure; it is a case where the *topology* of the game violated the background assumptions of the commitment model. Specifically, it violates the assumption of symmetric vulnerability to the "threat that leaves something to chance."

  Here is the argument, broken down by your three requirements: mapping, the hand-tying/ladder distinction, and the implications for the commitment race model.

  ### 1. The Mapping: Players, Constraints, and the Ontology of Deadlines

  To run this properly, we must stop treating "The Creditors" and "Greece" as unitary rational actors. The friction comes from the internal constraints masquerading as external players.

  **The Players and Their Payoff Functions**
  *   **Tsipras (Syriza Leadership):** Payoff is a weighted sum of (a) remaining in the Euro (high value), (b) avoiding austerity (high value), and (c) remaining in power/avoiding party split (critical constraint). The Left Platform is not a player; it is a *constraint on Tsipras's feasible set*. If he accepts too much austerity, his payoff for (c) drops to zero (government falls).
  *   **The Eurogroup (Dijsselbloem/Merkel):** Payoff is (a) Euro stability (existential), (b) Moral Hazard containment (high value for German voters), (c) Avoiding Grexit contagion.
  *   **Schäuble (German Finance Ministry):** Distinct from Merkel. Payoff prioritizes order and rule compliance over Euro integrity. For Schäuble, a temporary Grexit was a *positive* payoff (disciplinary mechanism), not a disaster.
  *   **The ECB (Draghi):** Payoff is (a) Mandate compliance (no monetary financing), (b) Financial stability. The ECB is a player, but its strategy space is bounded by its own statutes.
  *   **The Greek Electorate:** Principal to Tsipras, but in this specific game, they function as a *constraint on Tsipras's retreat*.
  *   **The Bundestag:** Constraint on Merkel. She cannot concede without their approval.

  **Commitments vs. Threats vs. Facts**
  You asked for strictness here. Most of what looked like bargaining was actually **fact disclosure**.
  *   **Varoufakis's "We won't sign":** This was a *threat*, not a commitment. A commitment requires removing the ability to choose otherwise. Tsipras retained the legal and physical ability to sign.
  *   **The ECB's ELA Cap:** This is the critical move. Was this a commitment? **Yes.** But it was a *rule-based commitment*, not a *will-based commitment*. Draghi did not say "I will cut you off." The *rules* said liquidity is reviewed on specific dates against solvency criteria. By adhering to the schedule, the ECB committed its own reputation to the calendar. This is more robust than a rhetorical commitment because reversing it requires breaking the institution's own legal framework.
  *   **The Referendum:** This was a **domestic commitment device** masquerading as an **international commitment device**. Tsipras tied his hands to the electorate to prevent himself from caving to the Left Platform's pressure *or* to force the creditors' hand. Ex-ante, it looked like a commitment to Grexit (if No wins, we can't sign). Ex-post, it was a bluff, or a sacrifice play.

  **The Calendar Question**
  You ask whether deadlines count as commitments when nobody chose them (e.g., bond maturities, ELA review dates).
  *   **Argument:** In Schelling, a commitment is valuable because it is *visible and irreversible*. A calendar date is visible. Is it irreversible?
  *   **Verdict:** In the 2015 case, the calendar functioned as a commitment *for the Creditors*, not for Greece. The ECB *could not* extend liquidity without a political agreement. The calendar was a **procedural lock**. For Greece, the calendar was a *constraint* (a fact of the world). For the ECB, the calendar was a *commitment device* (a rule they bound themselves to).
  *   **Why this matters:** You noted the calendar bound the creditors more tightly than their speeches. This is correct. A speech can be walked back ("constructive ambiguity"). A regulatory review date cannot be moved without signaling panic. Therefore, the "commitment" power lay with the institution that hid behind the rules (ECB), not the actor making the speeches (Tsipras). The drama of the deadline was not theatrical; it was institutional. The schedule did everything a hand-tied commitment does *because the institution's credibility was tied to the schedule.*

  ### 2. The Distinction: Hand-Tying vs. Ladder-Building

  Your distinction survives contact with the case, and it is vital. It is not just credibility with extra steps.

  **Credibility vs. Counterparty Payoffs**
  *   **Credibility** concerns the belief that I will execute my threat.
  *   **Hand-Tying** changes *my* payoff matrix (making retreat costly).
  *   **Ladder-Building** changes *your* payoff matrix (making concession less costly).

  **The Referendum's Effect**
  You argue the referendum was pure hand-tying that actively destroyed the creditors' ladder.
  *   **Analysis:** Correct. A standard Schelling move involves tying your hands *while leaving the other side a face-saving off-ramp*. Tsipras's "No" campaign framed the choice as "Democracy vs. Austerity." This transformed the negotiation from a technical dispute over primary surpluses into a sovereignty dispute.
  *   **The Consequence:** For the Eurogroup to concede after a "No" vote would not look like "pragmatic compromise"; it would look like "capitulation to populism." This raised the political cost of concession for Merkel and Dijsselbloem (their voters would punish them for being bullied).
  *   **The Distinction Holds:** Tsipras maximized his own cost of retreat (he now had a mandate to reject) but simultaneously maximized the creditors' cost of concession (they now faced a defiance of the Euro order).
  *   **Schelling's Blind Spot:** Schelling assumes that if I tie my hands, you will move to avoid the crash. He assumes your cost of concession is *static*. In 2015, Tsipras's hand-tying *dynamicized* the creditors' costs. By making the defiance public and democratic, he made the creditors' concession politically toxic.

  **The Audience Problem (Two-Player vs. Multi-Level)**
  You ask if the referendum was aimed inward.
  *   **Argument:** It was primarily inward. Tsipras was facing a coalition collapse. The Left Platform would have brought down the government if he signed the June proposal without a fight. The referendum bought him political cover to eventually sign (he could say "I fought to the end, the people spoke, but reality forced my hand").
  *   **Model Failure:** Schelling's framework is dyadic. It cannot account for a move that is a **commitment to a domestic principal** that functions as a **bluff to an external adversary**.
  *   **Result:** The framework goes silent here. In a 2-player game, a commitment is a signal to the opponent. In a 2-level game (Putnam), a commitment can be a signal to the domestic audience to secure ratification capacity, regardless of the opponent's reaction. Tsipras used the referendum to secure his domestic survival, betting (incorrectly) that the external shock would force the creditors to blink. The model fails because it treats the "player" as unitary. Tsipras was playing two games: one for survival in Athens, one for solvency in Brussels. They had different equilibrium points.

  ### 3. The Commitment Race and Asymmetric Catastrophe

  This is where the framework hits its limiting condition.

  **Schelling's Logic of the Race**
  The commitment race is dangerous because both sides rush to commit to avoid being the one who has to yield. The engine of the model is **shared risk**. "If we both commit, we drive off the cliff." This shared risk creates the incentive to de-escalate *before* the collision.

  **The 2015 Asymmetry**
  *   **Greece's Cliff:** Immediate bank closure, pension collapse, humanitarian crisis. (Certain, Immediate, Catastrophic).
  *   **Eurozone's Cliff:** Contagion risk, Euro breakup speculation. (Probabilistic, Deferred, Manageable via ECB firewalls).
  *   **The Imbalance:** The "threat that leaves something to chance" (bank run/Grexit) was not a shared threat. It was a Greek threat. The ECB had built firewalls (OMT, though not activated, was in the background) that insulated the core from the immediate liquidity shock.

  **Implications for the Model**
  1.  **No Shared Cliff = No Race:** A commitment race requires that *both* parties fear the collision more than the concession. In 2015, the Creditors feared the concession (moral hazard/political loss) *less* than Greece feared the collision (economic collapse). Therefore, the creditors had no incentive to race to de-escalate. Their optimal strategy was **wait**.
  2.  **Commitment as Suicide:** In Schelling's model, committing is a way to win. In asymmetric vulnerability, committing is suicide for the weaker party. Tsipras's commitment (Referendum) did not force the creditors to move; it simply accelerated Greece's approach to the cliff.
  3.  **Anomaly or Limit?** It is a **limiting condition**. The commitment race model applies to negotiations where the cost of non-agreement is *mutually* unacceptable (e.g., nuclear war, strike that bankrupts firm and union). It does not apply to **siege dynamics**, where one side can absorb the cost of non-agreement indefinitely while the other cannot.
  4.  **Hindsight Check:** Ex-ante (June 27), did it look like a shared cliff? Yes. Markets were spooked; contagion was a real fear. The ECB liquidity cap was the mechanism that *created* the asymmetry. Once the ECB closed the liquidity tap, the asymmetry became common knowledge. The "race" ended the moment the banks closed. After that, it wasn't a bargaining game; it was a surrender negotiation.

  ### Synthesis: Where the Framework Goes Silent

  You asked whether the framework is silent or if you are making it speak. It is silent on three specific dimensions that 2015 exposes:

  1.  **Asymmetric Vulnerability:** The model assumes the "disaster" is a public bad. 2015 shows that if the disaster is a private bad (for Greece) and a public good (for Eurozone discipline), commitment strategies invert. The stronger party's optimal strategy is to *call the bluff*, not to yield.
  2.  **Institutional Rigidity as Commitment:** Schelling focuses on voluntary hand-tying. 2015 shows that *bureaucratic rules* (ELA reviews, treaty clauses) act as superior commitment devices because they are harder to reverse than political will. The creditors didn't need to "commit" to being tough; the rules committed for them.
  3.  **The Two-Level Bluff:** The model cannot distinguish between a commitment meant to bind the self to the opponent, and a commitment meant to bind the self to a domestic constituency *against* the opponent. Tsipras's move was the latter. It looked like the former. The framework treats them as identical, which leads to predictive failure.

  **Conclusion for the Chapter**
  Do not try to force Greece 2015 into the standard commitment race box. Use it to define the box's boundary.
  *   **Thesis:** Commitment strategies rely on a background condition of *mutual vulnerability to the threat that leaves something to chance*.
  *   **Evidence:** When vulnerability is asymmetric (Greece 2015), the commitment race collapses into a siege. The weaker party's hand-tying does not induce concession; it induces attrition.
  *   **Refinement:** The "deadline" is not a neutral focal point; it is a weaponizable institutional constraint. The side that controls the calendar (the ECB/Creditors) holds the commitment power, not the side that makes the speeches.

  Your distinction on hand-tying vs. ladder-destroying is the strongest theoretical contribution here. Keep it. It explains *why* the creditors didn't just take the off-ramp: Tsipras burned it to prove his commitment to his voters, inadvertently trapping the creditors in a hardline position. That is not a failure of credibility; it is a failure of *political topology*. The framework assumes I can tie my hands without tying yours. 2015 proves that in a tightly coupled political system, hand-tying is contagious.
