  # Session Plan: The Thief's Gambit

  ## Materials List
  *   **Graph Paper:** 7 sheets (one per pair), pre-drawn with a 5x5 rhombus grid (Hex board). *Tip: Isometric dot paper works best, but square grid with diagonal connections marked works in a pinch.*
  *   **Pens:** 14 Red, 14 Blue (distinct colors are critical).
  *   **Envelopes:** 14 sealed envelopes (2 per pair).
      *   7 labeled **"THE THIEF"** (Red label).
      *   7 labeled **"THE ORACLE"** (Blue label).
  *   **Markers:** 7 Black markers (for the Facilitator to mark "Mines" in Round 3).
  *   **Timer:** Visible to all.
  *   **Whiteboard:** For debrief diagrams.

  ## Oracle Card Text (Print & Cut)

  **Card Type A: THE THIEF**
  > **ROLE:** You are Player 1 (Red), but you suspect Player 2 has a Guaranteed Winning Strategy.
  > **ACTION:**
  > 1. Place one **RED** mark anywhere (The "Sacrifice").
  > 2. Put down the Red pen. Pick up the **BLUE** pen.
  > 3. For the rest of the game, you play as **BLUE**. Your opponent plays as **RED**.
  > 4. **THE RULE:** You must treat your "Sacrifice" mark as if it does not exist.
  > 5. **THE CLASH:** If your strategy demands you play on the "Sacrifice" spot, place your Blue mark **anywhere else**.
  > **GOAL:** Connect the Blue sides. Prove you can win even giving Red an extra stone.

  **Card Type B: THE ORACLE**
  > **ROLE:** You are Player 2 (Red).
  > **ACTION:**
  > 1. Wait for The Thief to place their "Sacrifice" (Red mark).
  > 2. Pick up the **RED** pen.
  > 3. Play normally against the Blue player.
  > **GOAL:** Connect the Red sides. Do not let The Thief win.
  > **NOTE:** You have an advantage. The Thief is playing Blue, but there is an extra Red stone on the board helping you.

  ## Run Sheet

  | Phase | Minutes | What they do | What they should hit | What I say or do |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Setup & Rules** | 00-10 | Listen, pair up, receive boards/pens. | Understand Hex win condition (connect opposite sides). No jumping. | "Connect your two opposite sides. Block opponent. No draws. 5x5 board. Fast games." |
  | **2. Free Play** | 10-25 | Play 2-3 rounds normally. Swap colors. | Frustration. P1 (First Mover) feels stronger. P2 struggles to find a defense. | "Don't analyze yet. Just play. Note who wins more often." (Circulate, confirm P1 advantage). |
  | **3. The Oracle Round** | 25-50 | Open envelopes. Play 1 "Thief" game per pair. | **The Mechanic:** P1 places Red, switches to Blue, ignores the Red stone. P1 wins despite P2 having extra help. | "Open only when I say. Follow the card *exactly*. If you land on the Sacrifice, move elsewhere. I am the judge." |
  | **4. The Stress Test** | 50-65 | Play 1 "Minefield" variant. | **The Break:** P1's arbitrary Sacrifice hits a "Mine" (pre-marked black X). P1 loses immediately. | "New Rule: 3 squares are Mines (I mark them). If you place a stone there, you lose. Play the Thief Round again." |
  | **5. Debrief** | 65-75 | Discussion. Map activity to logic. | **The Insight:** Strategy Stealing relies on "Extra moves aren't bad" and "Arbitrary moves are safe." | Draw the logic tree on whiteboard. Reveal "Strategy Stealing." Ask: "Do we know *how* P1 wins?" |

  ## Debrief Guide

  **1. Map the Moments to the Logic**
  *   **The Sacrifice (Move 1):** This represents the *Arbitrary First Move*. In the proof, P1 plays anywhere.
  *   **The Pen Swap (Playing Blue):** This represents *Adopting P2's Strategy*. You pretended the board was empty of your first move and played the opponent's game.
  *   **The Clash Rule:** "If the spot is taken, play elsewhere." This represents *Monotonicity* (Having an extra stone is never a disadvantage). If the strategy wanted the spot you already occupied, having it occupied is even *better*, so playing elsewhere is a safe fallback.
  *   **The Win:** If P2 had a winning strategy, you (playing as P2 with an extra stone) should have won. Since you did, P2 *cannot* have a winning strategy.

  **2. The Non-Constructive Nature**
  *   Ask: "In the Oracle Round, did you know *why* your Blue moves were good?"
  *   Answer: No. You were copying a hypothetical strategy.
  *   Point: The proof tells us P1 *must* win, but it gives **zero information** on which opening move is actually best. It certifies existence without construction.

  **3. The Stress Test (Minefield)**
  *   Ask: "Why did the Thief strategy fail in Round 4?"
  *   Answer: The "Arbitrary Move" was no longer safe.
  *   Point: The proof collapses if an extra move can be harmful (non-monotonic) or if you cannot make a safe arbitrary move.

