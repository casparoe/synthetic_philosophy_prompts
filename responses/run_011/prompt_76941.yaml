  ## Troubleshooting: What Will Go Wrong

  **1. The "Double-Play" Confusion**
  *   **Problem:** In the Oracle Round, P1 (Thief) often forgets they switched pens and tries to play Red again, or P2 tries to play Blue.
  *   **Recovery:** Stop the room. "Check your pens. Thief is Blue. Oracle is Red. The first Red stone is a ghost."

  **2. The "Collision" Denial**
  *   **Problem:** P1 wants to play on the Sacrifice spot and argues, "But the strategy says here!"
  *   **Recovery:** Enforce the card rule strictly. "The card says 'Anywhere else'. This is the mathematical loophole. Place it adjacent."

  **3. The "Who Won?" Dispute**
  *   **Problem:** On a 5x5 grid, paths can be tangled. Pairs may argue over whether Blue actually connected.
  *   **Recovery:** You are the Supreme Court. Trace the path with your finger. If it's ambiguous, declare a "Retrial." Keep the pace moving.

  **4. The "Minefield" Frustration**
  *   **Problem:** Players feel cheated when they hit a mine instantly.
  *   **Recovery:** Lean into it. "Good! You felt the premise break. That frustration is the logic failing. That's the point."

  ## Honest Note on Limitations

  **The "Existence" Gap:**
  The room cannot reproduce the most profound philosophical feature of the argument: **Truth without Knowledge.**
  In the activity, P1 usually wins the Oracle Round because P1 has an *actual* extra stone and P2 is just a human making mistakes. The players will feel they won because they played *better*, not because of a logical necessity.
  You must explicitly clarify in the debrief: "In math, the opponent isn't a human who can slip up. The opponent is a *Law*. If the Law says P2 wins, the Thief *must* win. In this room, you only simulated the *motion* of the proof, not the *necessity*."
  This distinction is where the philosophy lives. The activity builds the intuition; the debrief must supply the rigor.
