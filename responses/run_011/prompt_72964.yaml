prompt: |-
  I'm a third-year comp neuro PhD student and I've been roped into running one 75-minute session in our philosophy of mind grad seminar — the week is on the unity of consciousness and they're using split-brain cases as the centerpiece. I know the disconnection literature okay, but I've never taught philosophers and I'm honestly worried about teaching the lesson they'll arrive wanting, which is that the callosotomy experiments show there are two of them in there, full stop.

  What I actually want them to be able to do on the walk out is see that as an inference the data doesn't obviously license. My framing, which you're welcome to attack: the lateralized-presentation experiments measure what each hemisphere can do when you force information down a single channel and force the response out through a single effector — they don't measure how many subjects there are. Moving from "the information couldn't get across in this apparatus" to "there are two streams of consciousness" smuggles in a claim about what a stream is supposed to be, and I want that smuggling to be the thing they catch.

  So plan the session for me rather than explaining split brains at me. I don't need the content, I need the sequence and the load-bearing choices: what has to be in place before the counting question is even intelligible to them (I suspect something about what the tachistoscopic setup does and doesn't control, and something about what "one stream" is supposed to mean, but you tell me which comes first and why); which single case should carry the whole thing and what it needs to have and not have — my instinct is that the left-hemisphere interpreter paradigm, the chicken-claw / snow-scene one where the patient confabulates a tidy reason for what his left hand just did, is a trap, because its the most memorable thing in the literature and it'll hijack 75 minutes into a confabulation-and-free-will debate, but maybe I'm wrong and it's the only paradigm concrete enough to do the work; the misconceptions they'll bring or generate, in the order they'll surface, and the exact point in the sequence where I head each one off — I'm expecting "two hemispheres therefore two people," "the interpreter shows all consciousness is post-hoc story," and "so normal brains are just mildly split-brained," plus whatever else you think philosophers specifically cook up; one question I can drop in the last ten minutes that would distinguish the underdetermination point landing from them just concluding the science is fuzzy; and what I should deliberately leave out and announce that I'm leaving out. I've got a whiteboard, one slide of the split-field display, and at least one hard-nosed physicalist who will want to say two subjects and go to lunch.

  Don't give me a menu of viable orderings or a both-sides treatment of the example choice. Pick one, commit, and give me your reasons, including wherever you disagree with my hunch above. If you think the framing I've stated is itself a bad way to teach this, say so plainly and tell me what to swap in instead.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the User and Request:**
      *   **User:** 3rd-year Comp Neuro PhD student.
      *   **Task:** Teach one 75-minute session in a Philosophy of Mind grad seminar.
      *   **Topic:** Unity of Consciousness (Split-Brain cases).
      *   **Goal:** Challenge the inference "Split-brain data $\rightarrow$ Two Conscious Subjects." Instead, promote "Data $\rightarrow$ Disconnection of Information/Processing $\rightarrow$ *Underdetermined* Subject Count."
      *   **Constraints:**
          *   Don't explain split-brain science (they know it or can read it).
          *   Don't give a menu of options; pick one path and commit.
          *   Address specific concerns: The "Left Interpreter" (chicken/snow) might hijack the discussion into confabulation/free will.
          *   Address specific misconceptions: "Two hemispheres = two people," "Interpreter = all consciousness is post-hoc," "Normal brains are mildly split."
          *   Include a specific closing question to test understanding.
          *   Include what to *leave out*.
          *   Acknowledge the "hard-nosed physicalist" in the room.
          *   Use the available tools: Whiteboard, one slide of split-field display.
      *   **Tone:** Direct, pedagogical, strategic, respectful of their expertise but firm on the teaching logic.

  2.  **Evaluate the User's Framing:**
      *   *User's Framing:* "Lateralized-presentation experiments measure what each hemisphere can do when you force information down a single channel... they don't measure how many subjects there are."
      *   *Assessment:* This is strong. It shifts the burden of proof from "prove there is one" to "prove the data necessitates two." It highlights the *experimental artifact* vs. *ontological claim* gap.
      *   *Critique:* It risks sounding like "we just can't measure it yet." Needs to be stronger: "The experimental setup *creates* the separation that the ontology is supposed to explain." The setup *enforces* disunity to test capacity, then we mistake the test condition for the baseline state.

  3.  **Determine the Sequence (The "Load-Bearing Choices"):**
      *   *Problem:* If you start with "How many subjects?", they jump to "Two."
      *   *Solution:* Start with the *task structure*. Before counting subjects, define what counts as a "subject" in this context.
      *   *Order:*
          1.  The Setup (The Artificial Disconnection).
          2.  The Behavior (The Data).
          3.  The Inference (The Gap).
          4.  The Ontology (The Count).
      *   *Why:* Philosophers love analyzing conditions of application. If the conditions for applying "subject" aren't met by the data, the question is premature.

  4.  **Select the Core Case:**
      *   *User's Instinct:* Avoid the Chicken/Snow (Left Interpreter) case because it leads to confabulation/free will debates.
      *   *My Assessment:* The user is right. The "Interpreter" theory (Gazzaniga) invites debates about narrative self vs. phenomenological self, which drains time.
      *   *Alternative:* The **Tactile-Visual Cross-Modal Matching** case (e.g., holding an object in the left hand unseen, matching it to a picture shown to the LVF).
      *   *Why:* It's cleaner. It shows *informational isolation* without invoking "storytelling." It highlights the *effector* limitation (hand can't talk, mouth can't feel). It makes the "two subjects" claim rely purely on informational access, which is easier to attack than "narrative construction."
      *   *Decision:* Stick with the **Tactile-Visual Matching** (or similar non-verbal motor task) as the primary example. It keeps the focus on *access* and *report*, which are the bottlenecks for the "two subjects" claim.
      *   *Wait, actually:* The user has *one slide of the split-field display*. I should use that. The classic **Chimeric Face** or **Word/Shape** task is best for the slide. Let's go with the **Word/Shape naming vs. pointing** discrepancy. It's the cleanest demonstration of "Right knows but can't say, Left says but doesn't know."
      *   *Refinement:* Actually, the user's framing is about "forcing information down a single channel." The **Tachistoscopic Word + Left Hand Pointing** is the perfect match for this. It shows the *apparatus* creating the split.
      *   *Final Decision:* Use the **Word/Image Lateralization + Contralateral Pointing** paradigm. It directly supports the "apparatus creates the split" argument better than the chicken/snow confabulation.

  5.  **Address Misconceptions & Timing:**
      *   *Misconception 1:* "Two hemispheres = two people." (Will arise immediately).
          *   *Fix:* Pre-empt in the first 10 mins by defining "subject" functionally.
      *   *Misconception 2:* "Normal brains are mildly split." (Will arise when discussing corpus callosum function).
          *   *Fix:* Address during the "What the Callosum Does" section (approx. min 25).
      *   *Misconception 3:* "Interpreter = all consciousness is post-hoc." (The Chicken/Snow trap).
          *   *Fix:* Explicitly bracket the Interpreter Theory. Announce it as "Out of Scope."

  6.  **The Closing Question:**
      *   Needs to distinguish "Science is fuzzy" from "Inference is underdetermined."
      *   *Idea:* Ask them to design a condition where the *same* data would support *one* subject.
      *   *Better:* Ask what behavioral criterion would *falsify* the "two subjects" hypothesis without relying on verbal report.
      *   *Best:* "If the right hemisphere could speak, what would it say about its relationship to the left?" (Too speculative).
      *   *Selected:* "What specific behavioral integration would force you to abandon the 'two subjects' hypothesis, given that verbal report is off the table?" This forces them to operationalize "unity."

  7.  **What to Leave Out:**
      *   **The Interpreter Theory (Gazzaniga).** Crucial. It's the biggest time sink.
      *   **Phenomenology of the Patient.** (Do they *feel* split?). We don't know, and speculating leads to "science is fuzzy."
      *   **Detailed Anatomy.** They are philosophers, not med students. Just "Callosum = Bridge."

  8.  **Drafting the Plan (Iterative refinement):**
      *   *Intro (0-10):* Set the trap. Don't ask "How many?" Ask "What counts as evidence for one?"
      *   *The Apparatus (10-25):* Whiteboard the tachistoscope. Show how *we* split the brain.
      *   *The Data (25-40):* The Slide. Word to RVF (Left says "Key"). Image to LVF (Left hand points to Ring).
      *   *The Inference Gap (40-55):* The core argument. Access vs. Existence.
      *   *The Hard-Nosed Physicalist (55-65):* Give them their due, then limit it.
      *   *Closing (65-75):* The operationalization question.

      *Self-Correction on the "Hard-Nosed Physicalist":* If I tell them "it's underdetermined," the physicalist might say "But the causal structure is distinct!" I need to acknowledge that causal distinctness $\neq$ subject distinctness. I need to make sure the distinction between *functional modularity* and *subjecthood* is clear.

      *Re-evaluating the Core Case:* The user worried about Chicken/Snow. I agree it's a trap. But is Word/Pointing too dry? No, it's more precise for *this* argument. The argument is about *informational access*, not *narrative consistency*. Stick with Word/Pointing.

      *Re-evaluating the Sequence:* The user asked: "what has to be in place before the counting question is even intelligible?"
      *Answer:* A definition of "counting criteria." You can't count until you know what you're counting.
      *So:* 1. Criteria for Subjecthood. 2. The Data. 3. The Mismatch.

      *Wait, one more thing:* The user's framing is "Moving from 'information couldn't get across' to 'two streams' smuggles in a claim about what a stream is."
      *My Plan must highlight this smuggling.* I need a specific moment where I write "Informational Access $\neq$ Phenomenal Unity" on the board.

  9.  **Final Polish:**
      *   Make sure the tone is peer-to-peer (PhD to PhD).
      *   Ensure the "Leave Out" section is explicit.
      *   Ensure the "Closing Question" is sharp.
      *   Check timing (75 mins is tight).

      *(Self-Correction during drafting)*: I need to be careful not to sound like I'm arguing for *one* subject. The goal is *underdetermination*. I must remain agnostic. The plan must reflect neutrality.

      *(Final check on the "Hard-Nosed Physicalist")*: This person will say "Distinct causal pools = distinct subjects." I need to arm the user with the counter: "Distinct causal pools = distinct *processing modules*. Subjecthood requires a further claim about what owns those modules."

      *(Final check on the "One Slide")*: Make sure the plan leverages that slide heavily. It's the only visual anchor.

      *(Final check on "Chicken/Snow")*: User thinks it's a trap. I agree. I will explicitly validate that instinct and tell them to cut it.

      *(Final check on Sequence)*:
      1. Define the Counting Criteria (15 min)
      2. The Apparatus as Intervention (20 min)
      3. The Data vs. The Ontology (25 min)
      4. The Physicalist Objection & Closing (15 min)
      This flows logically.

