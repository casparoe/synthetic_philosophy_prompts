answer: |-
  Here is the plan. I am committing to your framing because it is the only one that prevents the seminar from devolving into a "Science says two, Philosophy says one" stalemate. Your instinct to avoid the Chicken/Snow (Left Interpreter) case is correct; that paradigm shifts the debate to *narrative selfhood* and *confabulation*, which allows the "two subjects" camp to hide behind the claim that the left hemisphere is lying about the right's experience. You want to debate *informational access*, not *truth-telling*.

  Here is the 75-minute sequence, the load-bearing choices, and the specific traps to avoid.

  ### The Core Commitment
  **Thesis:** The split-brain data demonstrates *informational encapsulation*, not *ontological division*. The move from "Module A cannot access Module B's data" to "Subject A is not Subject B" requires a premise about subjecthood that the data does not supply.

  **The Single Case:** **Lateralized Word/Image + Contralateral Pointing.**
  *   *Why:* It isolates the *effector bottleneck* (mouth vs. hand) from the *processing capability*. It shows the Right Hemisphere (RH) *knows* the answer but lacks the *output channel* to say it, while the Left Hemisphere (LH) *speaks* but lacks the *input channel* to see it.
  *   *Why not Chicken/Snow:* As you suspected, that case invites the "Interpreter" theory. If you use it, the physicalist will argue, "The LH is constructing a false unity, proving the RH is a separate agent." You lose the room to confabulation debates. The Word/Pointing case is structurally cleaner: it's about bandwidth, not storytelling.

  ---

  ### The Sequence (75 Minutes)

  #### 1. The Counting Criteria (0–15 mins)
  **Goal:** Prevent the "Two Hemispheres = Two People" reflex before showing a single datum.
  **Action:** Do not show the slide yet. Go to the whiteboard.
  **Script:** "Before we look at the data, we need to agree on what would count as evidence for *one* subject versus *two*. If I have two distinct processing pools in my head, does that make me two people? If not, what extra condition is required?"
  **Board Work:** Draw two circles (A and B).
  *   Ask: "If A and B share memory, are they one?" (Students: Yes).
  *   Ask: "If A and B share an output channel (speech), are they one?" (Students: Usually yes).
  *   Ask: "If A and B are causally isolated *in this specific task*, are they two?"
  **Load-Bearing Choice:** You must force them to articulate the **Unity Criterion**. Most will say "Integration of Information."
  **Trap to Head Off:** The "Two Hemispheres = Two People" misconception.
  *   *Intervention:* When someone says "Well, there are two hemispheres," you stop them. "Anatomy is not ontology. We are counting *subjects of experience*, not lobes. If I bind your hands, do you become two agents? No. So why does binding the callosum create two agents?"
  *   *Why here:* If you wait until after the data, they will treat the anatomy as the proof. You must establish that anatomy is merely the *mechanism of constraint*, not the *definition of the subject*.

  #### 2. The Apparatus as Intervention (15–35 mins)
  **Goal:** Show that the experimental setup *enforces* the disunity we are trying to measure.
  **Action:** Put up your **one slide** (Split-field display: Word to RVF, Image to LVF).
  **Script:** "Look at the setup. We are using a tachistoscope to flash stimuli for 150ms. We are preventing eye movements. We are forcing input into one hemisphere. We are forcing output through one effector (speech for LH, pointing for RH)."
  **Board Work:** Draw the flow.
  *   Stimulus $\rightarrow$ LVF $\rightarrow$ RH $\rightarrow$ Left Hand (Points correctly).
  *   Stimulus $\rightarrow$ RVF $\rightarrow$ LH $\rightarrow$ Mouth (Verbalizes incorrectly/confabulates).
  **The Argument:** "The data shows that when we *force* isolation, we get isolated reports. The LH says 'I saw nothing' because the information physically could not cross the midline. The RH points to the object because it *did* see it."
  **Load-Bearing Choice:** Emphasize the **Artificiality of the Constraint**.
  *   *Key Phrase:* "We are measuring the *capacity for transfer* under *conditions of enforced non-transfer*."
  *   *Why:* This sets up your main point. The experiment measures the *bridge*, not the *cities*. If the bridge is out, it doesn't mean the cities are different countries; it means the bridge is out.
  **Trap to Head Off:** "Normal brains are just mildly split-brained."
  *   *Intervention:* At min 25, explicitly state: "In an intact brain, the callosum transmits ~200 million axons. The integration is near-instantaneous. The split-brain patient is not a model of normal modularity; they are a model of *lesion-induced bottleneck*. Do not generalize the pathology to the healthy state."
  *   *Why:* Philosophers love to generalize from edge cases. You must block this inference or they will leave thinking consciousness is always fragmented.

  #### 3. The Inference Gap (35–55 mins)
  **Goal:** Execute your framing. Distinguish *Informational Access* from *Subjecthood*.
  **Action:** Return to the Whiteboard. Write: **ACCESS $\neq$ OWNERSHIP**.
  **Script:** "The physicalist wants to say: 'Distinct informational pools imply distinct subjects.' My claim is that this smuggles in a definition of 'subject' as 'a locus of omniscient access.'"
  **The Argument:**
  1.  The RH has the visual experience (proven by pointing).
  2.  The LH has the verbal report (proven by speech).
  3.  The LH claims *it* had the experience (confabulation).
  4.  **The Gap:** Does the LH's lack of access to the RH's data mean the RH is a *different subject*? Or does it mean the *Subject* (the person) has a fragmented access profile?
  **Load-Bearing Choice:** Frame the "Two Subjects" claim as a **Theoretical Posit**, not an **Empirical Finding**.
  *   *Say this:* "Saying 'there are two minds' is a theoretical move to explain the behavioral disconnection. It is not the data itself. An alternative theory is: One mind with severed internal communication channels."
  **Trap to Head Off:** The Hard-Nosed Physicalist.
  *   *The Objection:* They will say: "If the causal pools are distinct, the physical supervenience base is distinct. Therefore, two subjects."
  *   *Your Counter:* "Distinct causal pools justify distinct *functional modules*. To get to *subjects*, you need to claim that *every* functionally isolated module is a subject. Do you want to commit to that? Does your visual cortex count as a subject because it processes edges without your verbal access?"
  *   *Why:* This forces the physicalist to either accept pan-subjectivism (absurd) or admit that *some* integration is required for subjecthood, which returns you to the "how much integration?" question (which is underdetermined).

  #### 4. The Operationalization & Close (55–75 mins)
  **Goal:** Test if they understand the underdetermination vs. "science is fuzzy."
  **Action:** No slides. Open discussion.
  **The Closing Question:**
  > "If we could restore the callosum, but the patient *still* reported feeling like two people, would you count them as two? Conversely, if we keep the callosum cut, but find a behavioral task where the hands cooperate *without* verbal mediation, does that reduce the count to one?"
  >
  > **The Real Kicker:** "What specific **behavioral criterion** would falsify the 'Two Subjects' hypothesis without relying on verbal report?"

  **Why this question:**
  *   If they say "We can't know," they failed (they think science is fuzzy).
  *   If they say "If the hands cooperate," they succeed (they understand that "subject" is defined by functional unity, which the current data leaves open).
  *   It forces them to operationalize "unity" rather than hiding behind "we can't ask the right hemisphere."

  ---

  ### What To Deliberately Leave Out (And Announce It)
  You must explicitly bracket these topics to keep the 75 minutes tight and prevent hijacking. Write this on the board at the start: **OUT OF SCOPE**.

  1.  **The Left Interpreter Theory (Gazzaniga):**
      *   *Announcement:* "We are not discussing why the LH confabulates reasons. We are discussing whether the RH's silence implies non-existence or just muteness."
      *   *Reason:* As you noted, this leads to free will and narrative selfhood. It distracts from the *counting* problem.
  2.  **Phenomenology of the Patient:**
      *   *Announcement:* "We are not speculating on what it *feels like* to be a split-brain patient."
      *   *Reason:* We have no data. Speculation leads to "science is fuzzy" conclusions. Stick to the behavioral data.
  3.  **Ethics of Callosotomy:**
      *   *Announcement:* "We are not debating the medical ethics of the procedure."
      *   *Reason:* Irrelevant to the philosophy of mind question.

  ### Summary of Load-Bearing Choices
  1.  **Criteria First:** You define "subject" before showing the "split." If you show the split first, the anatomy dictates the ontology.
  2.  **Apparatus as Cause:** You frame the disconnection as an *experimental artifact* (enforced isolation) rather than a *revealed truth* (natural division).
  3.  **Module vs. Subject:** You force the physicalist to distinguish between a *processing module* (which can be isolated) and a *subject* (which implies a higher-order unity).
  4.  **The Closing Question:** It demands a behavioral operationalization of unity, proving they understand the inference gap, not just the data gap.

  ### Disagreement with Your Hunch
  You said: *"My framing... the lateralized-presentation experiments measure what each hemisphere can do when you force information down a single channel... they don't measure how many subjects there are."*
  **Critique:** This is 90% correct, but be careful not to sound like you're saying "The experiment is bad."
  **Adjustment:** Frame it as **"The experiment measures the *necessary conditions for report*, not the *sufficient conditions for experience*."**
  The physicalist will argue that if the RH can't report, it doesn't matter if it experiences. You need to be ready to say: "If you define 'subject' as 'that which can report verbally,' then yes, there are two. But that is a linguistic definition, not an ontological one. Are we counting *speakers* or *experiencers*?"
  Make that distinction explicit at minute 40. That is where the seminar is won or lost.

  ### Final Advice for the "Hard-Nosed Physicalist"
  This person is your biggest risk. They will try to collapse the distinction between *causal independence* and *subjecthood*.
  **Your Move:** Grant them causal independence. "Fine. The RH is a causally distinct pool. Now tell me why *that specific level* of causal pooling maps to the concept 'Person' rather than 'Organ' or 'Cell'."
  Force them to defend the *level of abstraction* at which "subjects" emerge. The split-brain data doesn't tell you the level; it just shows you a fracture at *one* level. That is the underdetermination.
