ody ever doubted, and Pasadena proper still has no expectation at all. Which horn do you take? And if you're tempted by a third option — the ordering is a feature of the agent, like her risk attitude or her way of partitioning outcomes — then explain to me how two agents holding the very same ticket under different orderings are supposed to disagree about what to pay for it, because i think your view makes that disagreement literally impossible to have, and a theory that can't even state the disagreement isn't explaining choice, it's dissolving it.
