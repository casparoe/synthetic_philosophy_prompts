answer: |-
  Good evening. Thanks for coming out onto the grass. I know some of you wished we were gathering inside a building we voted for back in March. I know others are glad we aren't gathering inside a building we voted against. Ninety-one votes is a narrow margin, and it left a lot of us on both sides feeling unsettled. But here we are, on hay bales, with a flatbed trailer borrowed from the hardware store serving as my pulpit.

  I run the library's summer reading program, and I sit on this commission mostly to keep the minutes. But last fall, a book group I belong to read a letter Jean-Jacques Rousseau wrote to Geneva two hundred and fifty years ago. We read it while the arts center proposal was on the table. I won't pretend that book didn't shape how some of us voted, even if the public argument was mostly about mill rates.

  The case Rousseau makes is uncomfortable, and I want to make it out loud tonight. He argues that a theater's whole business is to please. To do that, it must take an audience exactly as it already is and flatter it. No matter how noble the play, it cannot reform us. In a comedy, the decent, blunt, honest person has to be made a little ridiculous, or nobody laughs. The charming, worldly person who knows how to manipulate people ends up being the hero we root for. In a tragedy, we pay for pity with a ticket and a handkerchief, and then we go home and do nothing about anything. And the actors' trade itself—being somebody else for a living, in exchange for applause from strangers—is not what a community of citizens should be built on.

  Rousseau's replacement for the theater is basically a post stuck in the middle of the square with flowers on it. Everybody gathered around it. No stage, no tickets, no one up there and no one down there. People getting the show by looking at each other instead of at a representation. That is the festival we are attempting tonight.

  Now, I am aware of the contradiction. I am standing on a raised platform. I am delivering lines I wrote in advance. You are seated on blankets, listening. By any honest definition, this is theater. I am not going to dodge that. I am performing a role called "Commissioner Giving Remarks." But I am telling you this so we can acknowledge the gap between where we are and where I'm inviting us to go.

  To the theater people in the crowd—the community company, the high school drama teacher, the organizers who have kept Shakespeare alive in this region for fourteen years: I know what you give to this town. I know the leaky roof at the Grange hall isn't just a budget line; it's a heartbreak. What you do is not worthless. It comes from a love of craft and a desire to share beauty. But tonight, I am asking you to lend us your talent for a different kind of gathering.

  In a few minutes, the drama teacher's students will come up here. They are going to perform a five-minute scene. I know this looks like the very thing I just described. It looks like I've let the spectators back in through the side door. It looks like these kids have been demoted to an icebreaker. I want you to hear me when I say this arrangement is the actual point, not a fudge.

  They are not here to be watched so we can judge them. They are here to break the silence. They are the spark. When they finish, we are not going to clap and sit back down. We are going to stand up. The fiddler who plays at the VFW is ready. The nineteen-year-old caller who learned square dancing on YouTube is ready. The space between the hay bales is not an audience pit; it is a floor.

  We are not building a temple for art tonight. We are building a moment where the town looks at itself. The students start the motion, but you complete the circuit. If we stay seated, this is just a cheap concert. If you get up, if you take a partner, if you swing when the caller says swing, then the separation collapses. The actors become neighbors. The audience becomes the town.

  So, let the students have their five minutes. Listen to them. But save your energy for the dance. This isn't about saving money. It's about saving the idea that we don't need to pay strangers to show us who we are. We can do that ourselves, on the grass, while the sun goes down.

  Let's begin.

  ***

  Taking this line costs you the comfort of the spectators who find safety in the dark; Rousseau assumes everyone has the confidence to be seen in the light, but for the shy, the marginalized, or the traumatized, the stage offers a protective distance that the town square destroys. You are asking people to trade the safety of representation for the vulnerability of exposure, and not everyone at the back is ready to be part of the show.
