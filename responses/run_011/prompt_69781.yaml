  Based on the six rulings you've recorded, your teacher is guiding you toward a specific metaphysical framework regarding **material constitution** and **persistence over time**. She is not a nihilist (she believes statues and cars exist), nor is she a simple materialist (she believes statues are distinct from clay).

  Here is the machinery behind her rulings, the prediction for Monday, and the test case to crack her system open.

  ### 1. The Machinery: Sortal-Dependent Persistence
  The only set of principles that accommodates all six rulings without contradiction is **Sortal-Dependent Persistence Conditions** combined with **Ontological Hierarchy** (a Neo-Aristotelian or Hylomorphic view).

  Here is how the rules break down:

  *   **Rule A: Sortal Relativity (The Ring/Gold & Statue/Clay Cases)**
      *   *Principle:* What it takes for a thing to survive depends on *what kind of thing* it is (its "sortal").
      *   *Application:* "Gold" is a sortal defined by matter; it survives melting or wearing. "Ring" and "Statue" are sortals defined by function and form; they survive minor changes but cease to exist if their defining structure is destroyed. Because they have different persistence conditions, they are distinct objects that can occupy the same space at the same time (Coincidence).
  *   **Rule B: Continuity over Constitution (The Car & Ship Cases)**
      *   *Principle:* For functional artifacts (cars, ships), spatiotemporal and functional continuity is more essential than original matter.
      *   *Application:* A car survives part replacement because the *function* and *history* continue. Crucially, in the Ship case, she ruled that the *continuous* ship is the original, not the reassembled planks. This establishes that **history trumps matter**.
  *   **Rule C: Eliminativism about Aggregates (The Pile Case)**
      *   *Principle:* Not every collection of matter is an object. "Piles" are not genuine substances; they are just bricks described in a certain way.
      *   *Application:* A pile has no persistence conditions of its own. If you move the bricks, the "pile" doesn't go anywhere—it just ceases to be described that way. This is why the pile "vanishes" when restacked, while the statue "dies" when flattened. One was never really there; the other was.
  *   **Rule D: Psychological/Biological Essentialism (The Person Case)**
      *   *Principle:* Persons are defined by the seat of consciousness (brain), not mere bodily continuity.
      *   *Application:* This mirrors the Ship case: the "functional core" (brain) determines identity, not the peripheral matter (body/hand).

  ### 2. The Apparent Tension: Statue vs. Pile
  You noted that the Statue ruling (statue dies, clay lives) and the Pile ruling (pile gone, bricks live) look contradictory. They are not. This is the key to her ontology.

  *   **The Statue** is a **genuine object**. It has "unity conditions" that make it something *over and above* the clay. When you flatten it, you destroy the object, even though the matter remains.
  *   **The Pile** is a **faux object**. It is *nothing over and above* the bricks. When you restack them, you haven't destroyed an object; you've just stopped describing the bricks as a "pile."

  **The Single Rule:** *Genuine sortals (Statue, Car, Person) have persistence conditions; arbitrary aggregates (Pile) do not exist independently of their parts.* This absorbs both rulings perfectly.

  ### 3. Monday's Case: The 3D-Printed Sculpture
  **The Verdict:** She will rule that **the sculpture in the display case is the original**, and the one sold at auction is a duplicate.

  **The Reasoning:**
  1.  **Sortal Classification:** A "Sculpture" is a genuine object (like the Statue), not a mere aggregate (like the Pile). Therefore, it has persistence conditions.
  2.  **Persistence Condition:** Is a Sculpture like a Statue (Form essential) or a Ship (Continuity essential)?
      *   Like the *Statue*, it has a specific form. However, the Case Sculpture maintained its form continuously.
      *   Like the *Ship*, it underwent gradual part replacement. Her Ship ruling explicitly favors the **continuous path** (the sailing ship) over the **reassembled matter** (the museum ship).
  3.  **Application:** The Case Sculpture maintains the spatiotemporal and functional continuity of the art object. The Auction Sculpture is made of the original matter, but like the museum ship, it is a reassembly. The digital file is the "form," but the physical object's identity is tied to its continuous history, not just its blueprint (otherwise, any print from the file would be the *same* sculpture, which contradicts the uniqueness implied in the Ship/Car cases).

  ### 4. My Bet: Neo-Aristotelian Hylomorphism
  I would bet on **Neo-Aristotelian Hylomorphism** (Matter + Form).

  **Why?**
  *   **Materialism** fails the Statue/Clay case (it can't explain why the statue dies if the matter survives).
  *   **Pure Four-Dimensionalism** struggles to explain the Pile ruling without extra machinery (why are some space-time worms "objects" and others "piles"?).
  *   **Hylomorphism** explains everything:
      *   **Statue/Clay:** Different forms imposed on the same matter.
      *   **Pile:** No substantial form, just an aggregate.
      *   **Ship/Car:** The "form" is the functional organization, which can survive matter replacement.
      *   **Person:** The "form" is the psychological life located in the brain.

  This view allows her to be a realist about Statues and an eliminativist about Piles without contradiction.

  ### 5. The Splitter Case
  To test whether she prioritizes **Functional Continuity** (Ship/Car) or **Structural Form** (Statue), propose this case:

  **The "Crated Sculpture" Case:**
  > "Suppose the sculpture in the display case is carefully dismantled by the art department. Each plastic section is labeled, packed into a crate, and shipped to a new gallery for reassembly next week. While it is in the crate, disassembled, **is the sculpture still in the crate?**"

  **Why this splits the rules:**
  *   **If she says YES:** She treats the Sculpture like a **Car**. A car is still a car in the garage, even if not running. The *functional potential* survives disassembly. This aligns with the Ship/Car rulings.
  *   **If she says NO:** She treats the Sculpture like a **Statue** or a **Pile**. A statue flattened is gone; a pile restacked is gone. If the arrangement is destroyed, the object ceases to exist, even if the parts are safe.
  *   **The Tension:** This forces her to clarify if the "Form" of a sculpture is its *physical arrangement* (which is lost in the crate) or its *functional identity* (which is preserved in the crate). Given the Ship ruling (where stored planks were *not* the ship), she might be forced to say the sculpture ceases to exist until reassembled, which would be a fascinating divergence from the Car ruling.
