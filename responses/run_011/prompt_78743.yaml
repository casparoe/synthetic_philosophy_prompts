      *   *Forecaster Behavior:* Why over-warn now? Chaos theory explains *uncertainty*, not *risk tolerance*. The shift to "over-warning" is a sociological/ethical decision (cost-loss ratio), not a physical one. Chaos theory says "probability is 30%," society decides "evacuate if >10%." Theory is silent on the threshold.

