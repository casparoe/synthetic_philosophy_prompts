      *   **Task 1 (Mapping):** Map the episode onto chaos theory (system, initial state, tolerable error, error-doubling time, predictor, implications).
      *   **Task 2 (Diagnosis):** Determine if the episode supports "sensitive dependence" (chaos) or "missing mechanism/data" (model error), considering the logarithmic growth of the predictability horizon. Does the arithmetic shift the fault?
      *   **Task 3 (Theory Check):** Does 1987 confirm the standard story, or does it blur the line between principled unpredictability and model error? Is predictability a property of the atmosphere alone or the system (atmosphere + instruments + model + tolerance)?
      *   **Task 4 (Silences):** Identify where the theory goes silent (determinism status, behavioral changes in forecasters/over-warning).

  2.  **Deconstruct Task 1: Mapping to Chaos Theory:**
      *   *System:* The North Atlantic/European troposphere (specifically the developing low-pressure system).
      *   *Initial State:* The atmospheric conditions (pressure, temperature, wind, humidity) as sampled by the observation network (surface stations, balloons, ships) at $t_0$ (e.g., 12 hours prior).
      *   *Tolerable Error:* The threshold where the forecast distinguishes "gale" from "hurricane-force" or "no storm" from "storm." In this case, failing to predict winds >100 mph.
      *   *Error-Doubling Time:* For synoptic scales in mid-latitudes, typically cited as 2-3 days (Lorenz's limit), but for mesoscale features (like the storm core), it's much shorter (hours). Let's estimate conservatively at 12-24 hours for the specific instability.
      *   *Predictor:* The UK Met Office numerical weather prediction (NWP) model (Unified Model predecessor) and the human forecasters interpreting it.
      *   *Implication:* If chaos is the driver, small errors in the initial state grew exponentially, rendering the forecast useless within the lead time.

  3.  **Deconstruct Task 2: Diagnosis (Chaos vs. Model Error):**
      *   *The Official Review:* Blamed observation gaps (data) and coarse resolution (model). This sounds like *model error*, not pure *initial condition error* (chaos).
      *   *The Sting Jet:* A mechanism not represented in the 1987 model. This is structural model error.
      *   *The Chaos Arithmetic:* Predictability horizon $T \approx \frac{1}{\lambda} \ln(\frac{E_{max}}{E_0})$. Halving $E_0$ adds $\frac{\ln 2}{\lambda}$ (one doubling time).
      *   *Analysis:* If the error was due to missing the *existence* of a sting jet (a mechanism), no amount of initial state accuracy fixes a model that lacks the physics to simulate it. However, if the sting jet formation is highly sensitive to initial conditions *within* a model that has the physics, then chaos applies.
      *   *Verdict:* The 1987 failure looks more like *structural ignorance* (missing mechanism/data) than *dynamic chaos* (sensitive dependence). The "gaps in Atlantic observation" implies $E_0$ was huge, not just slightly off. But the "coarse resolution" implies the model equations were wrong/approximate.
      *   *Does Arithmetic Shift Fault?* If the doubling time is short (hours), even perfect data might not have saved the 1987 forecast *if* the model couldn't resolve the sting jet. But if the data gap was the primary driver, better data (halving error) buys only a little time. Since the storm developed rapidly, the "little time" might have been the difference between warning and no warning. However, the *sting jet* discovery suggests the model physics were the bigger bottleneck.

  4.  **Deconstruct Task 3: Theory Check (Principle vs. Practice):**
      *   *Standard Story:* Chaos sets a hard limit (Lorenz limit).
      *   *1987 Reality:* The limit wasn't hard; it was moved by better computers and more buoys. This suggests the 1987 limit was *practical*, not *principled*.
      *   *Blurring the Line:* Blaming "chaos" can become an excuse for "we didn't have enough buoys/compute."
      *   *Property of What?* Predictability is relational. It's not just the atmosphere; it's Atmosphere + Network + Model + Tolerance. A storm is "unpredictable" relative to a 1987 model but "predictable" relative to a 2024 ensemble.
      *   *Conclusion:* 1987 complicates the standard story. It shows that what looks like a chaos limit is often a resource limit.

  5.  **Deconstruct Task 4: Silences:**
