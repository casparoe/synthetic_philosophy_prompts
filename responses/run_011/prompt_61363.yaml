          *   Fix the purpose: A theory telling a player what to do at node 40 after 4 passes, defensible against the opposite view.
          *   Format: List desiderata with the *case/consideration* forcing each (no just labels).
          *   Evaluate User's List: Validate the provided points, identify junk (specifically "length-consistency"), distinguish load-bearing vs. taste.
