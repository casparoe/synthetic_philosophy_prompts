  The step that fails is the move from **(2)** to **(3)** and **(4)**, specifically due to the monolithic conception of "the community" in **Premise (2)**.

  Premise (2) states: *"Those norms are whatever the community sustaining the office takes them to be, and there is no standpoint outside a community's role-norms from which to enumerate them."*

  This premise treats the community as a single, consenting agent with a unified voice. It assumes that if the Administrator says "these are the norms," then they are the norms. This is what allows the administration to "immunize itself by rewriting its own job descriptions" in conclusion (7). It also erases the clients' standing, because if the community is a monolith, and the Administrator speaks for it, the clients *are* the Administrator's voice, not independent judges.

  To save your novel from this trap without surrendering your core insights (1) and (6), you should surrender the **second clause of Premise (2)**: *"...and there is no standpoint outside a community's role-norms from which to enumerate them."*

  More precisely, you must surrender the implication that the "community's role-norms" are a settled, static fact rather than a site of contestation. You can keep the relativist claim that norms are community-dependent, but you must acknowledge that the community is not a unity. The clients are part of the community, and they have their own interpretation of what the norms require.

  ### The Price You Pay

  By surrendering the monolithic view of the community in (2), you lose the ability to make the following claims about the world of your book:

  1.  **You can no longer claim the district is a seamless moral whole.** You cannot depict the culture as a background of perfect agreement where the Administrator simply enacts a pre-existing script. Instead, the "norms" must be shown as something argued over, negotiated, and occasionally disputed.
  2.  **You can no longer claim the Administrator's honesty is structurally guaranteed.** His honesty cannot be a simple byproduct of the system's rules. It must be a reputation he actively maintains against rivals (including potentially dissatisfied clients) who might accuse him of violating the very patrimonial norms he claims to uphold. He is not just following rules; he is interpreting them.
  3.  **You lose the "immunization" shield.** You cannot have the Administrator dismiss criticism by saying, "This is our way." He must answer criticism by demonstrating how his actions *actually fit* the shared understanding of reciprocity. If he gives a contract to a cousin who is incompetent, he is vulnerable to criticism *from within the system*, not because he violated a universal law, but because he violated the local expectation that patronage ensures competence/loyalty.

  ### Why This Saves the Novel

  This surrender costs you cultural harmony, but it buys you **drama**.

  If Premise (2) stands as written, your Administrator is a priest in a temple where he writes the liturgy. There is no tension, only function. By modifying (2) to allow for internal contestation, your Administrator becomes a politician in a system where the rules are unwritten but fiercely felt. He remains "honest" (as per your desire) not because the system makes corruption impossible, but because he navigates the ambiguous line between "providing for kin" (duty) and "hoarding for self" (corruption) better than his predecessors or rivals.

  This allows you to keep **(6)** (the charge of "corruption" in the impersonal sense doesn't apply) while rejecting **(7)** (clients have no standing). The clients can object that he is a *bad patron*, even if they cannot object that he is a *bureaucratic violator*. This preserves the cultural specificity you want without rendering the characters morally mute.
