      *   *Clarification:* Ensure the distinction between *ontological* necessity (how the world is) and *epistemic* necessity (what we can know) is clear. Al-Ghazali attacks the philosophers' claim to *know* necessity. Hume attacks the *existence* of observable necessity.
      *   *Crucial Point:* The user's background is empirical science. I need to explain why "mechanism" feels like an answer to them but isn't an answer to the philosophical problem. It's the "Homunculus" fallacy applied to causation. Explaining *how* A leads to B doesn't explain *why* A leads to B necessarily.

