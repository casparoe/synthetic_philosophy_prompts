  (a) **Classification**
  Case 9 is a **Frankfurt-style Omission case with Inverted Actual/Counterfactual Ability**. It belongs to the family of Cases 5 and 6 (omissions with counterfactual interveners), but it inverts the structural relationship between the actual sequence and the counterfactual sequence found in Case 5. In Case 5, the actual sequence permits the act, but the counterfactual sequence blocks it. In Case 9, the actual sequence blocks the act (severed linkage), but the counterfactual sequence permits it (system re-engagement).

  This classification is verdict-determinative only if the supervisor's principles treat the *direction* of the block (Actual vs. Counterfactual) symmetrically. If her view is that omissions are essentially counterfactual claims ("could have done otherwise"), Case 9 aligns with Case 6 (Responsible). If her view is that omissions require actual causal power in the world at the time of choice, Case 9 aligns with the intuition behind Case 5's verdict but for different reasons (Not Responsible). The case tests whether "Ability" for omissions is a modal property (what would happen if tried) or an actualist property (what can happen now).

  (b) **Candidate Principles**
  Three principles are required to generate the eight verdicts. Note the tension between P1 and P3.

  *   **P1 (Actual Sequence Action):** For positive actions, moral responsibility is determined solely by the actual causal history of the act. The existence or non-existence of alternative possibilities is irrelevant.
  *   **P2 (Sourcehood):** An agent is not responsible if the actual sequence originates in external manipulation or another agent's control.
  *   **P3 (Omission Ability):** For omissions, moral responsibility requires the ability to have performed the omitted act. This ability is defined counterfactually (i.e., success in the nearest possible world where the agent tries).

  **Verdict Table:**

  | Case | Type | P1 (Actual Seq) | P2 (Sourcehood) | P3 (Omission Ability) | Supervisor's Verdict |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1** | Action | Responsible | N/A | N/A | **Responsible** |
  | **2** | Action | Responsible | **Not Resp.** | N/A | **Not Resp.** |
  | **3** | Action | Responsible | N/A | N/A | **Responsible** |
  | **4** | Action | Responsible | N/A | N/A | **Responsible** |
  | **5** | Omission | Responsible | N/A | **Not Resp.** | **Not Resp.** |
  | **6** | Omission | Responsible | N/A | **Responsible** | **Responsible** |
  | **7** | Action | Responsible | N/A | N/A | **Responsible** |
  | **8** | Action | **Not Resp.** | **Not Resp.** | N/A | **Not Resp.** |

  **Tensions and Adjustments:**
  *   **P1 vs. P3:** P1 entails responsibility in Case 5 (actual sequence was clear; device idle). P3 overrides P1 for omissions. This requires an ad hoc adjustment: *P1 applies only to commissions.*
  *   **Gloss Tension (5 vs. 7):** In Case 7, the supervisor rejects alternatives as the ground for verdicts ("If those alternatives are carrying the verdict, the case has been misunderstood"). In Case 5, she accepts ability (an alternative possibility) as the ground ("She could not have done the very thing... settles it"). The principle must distinguish the *ontology* of the act: Actions are actual events; Omissions are counterfactual dependencies.
  *   **P2 Scope:** Case 8 shows P2 applies when the intervener acts. Case 1 shows P2 does not apply when the intervener is idle.

  (c) **Predictions for Case 9**

  *   **P1 (Actual Sequence Action):** *Split/Inapplicable.* P1 governs actions. If applied by extension, it yields **Not Responsible** because the actual causal chain (broken switch) makes the saving act impossible. However, since this is an omission, P1 is subordinate to P3.
  *   **P2 (Sourcehood):** **Responsible.** The decision is "wholly her own." The broken switch is external, but the *restoration* mechanism is also external and idle. No manipulation of her will occurred.
  *   **P3 (Omission Ability):** **Responsible.** P3 defines ability counterfactually (based on Case 5's logic). In the nearest world where Nadia tries, she succeeds (system re-engages). Therefore, she *could* have saved him.
