  (f) **Underdetermination**
  Her record **genuinely underdetermines** Case 9.
  *   **Ruling Responsible:** Commits her to the principle that **Counterfactual Ability is Sufficient** for responsibility in omissions, even if Actual Ability is absent. This sits comfortably with Case 5 (Counterfactual Inability is Sufficient for exculpation) but risks clashing with the intuition that one cannot be obliged to do the impossible *in the actual world*.
