prompt: |-
  I assess claims for a disability income scheme — about twenty cases a week, forty-five minutes each, mostly from paper medical records, and my decision determines whether someone's support continues. The rulebook's threshold word is substantial: the impairment must have a substantial effect on the person's ability to manage ordinary daily activities. There is no list, no point score, and no further definition of that word. Two problems keep biting. First, colleagues and I disagree at the edges, and refused claimants appeal, so I need reasons that hold up. Second — and this is the one I cannot handle — many files contain a long list of difficulties each of which I would individually call minor: forgets appointments, cannot stand more than ten minutes, avoids crowded shops. I have no principled way to say whether twenty small things add up to something substantial, and I suspect I am currently settling those cases by mood.

  Write me a procedure I can actually run in forty-five minutes with no philosophy training: the questions in order, what counts as a sufficient answer to each, how to handle a borderline file without pretending the line is sharper than it is, how to keep my verdict consistent with a colleague's on a near-identical file, and where the procedure must stop and hand the call to a supervisor because the question is one of values rather than facts. Ground it in whatever the work on vague thresholds and borderline cases offers that survives contact with a caseload, and be honest about which steps are judgment calls wearing a procedural costume. Then run it on three files: a claimant with a single, well-documented severe limitation; the twenty-small-things file described above; and a claimant whose condition worsened in imperceptible increments over four years, with each annual reassessment finding them barely changed from the last. At least one of the three should come out with a verdict I will not like, and finish with what the procedure cannot do.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Analyze the Request:**
      *   **User Role:** Disability income scheme assessor.
      *   **Workload:** ~20 cases/week, 45 mins/case.
      *   **Input:** Mostly paper medical records.
      *   **Decision Criteria:** "Substantial effect on ability to manage ordinary daily activities." (No list, no score, no definition).
      *   **Problems:** Inter-assessor disagreement (consistency), the "Aggregation Problem" (many minor issues vs. one major issue), suspicion of deciding by mood.
      *   **Requirements:**
          *   A concrete procedure runnable in 45 mins.
          *   No philosophy training required.
          *   Specific questions in order.
          *   Criteria for sufficient answers.
          *   Handling borderline cases honestly.
          *   Ensuring consistency with colleagues.
          *   Escalation criteria (values vs. facts).
          *   Grounded in practical work on vague thresholds (Sorites paradox, borderline cases).
          *   Honesty about judgment calls disguised as procedure.
          *   Test run on three specific files (Single severe, 20 minor, Incremental worsening).
          *   One verdict must be unpopular/uncomfortable.
          *   Conclusion on limitations.

  2.  **Deconstruct the Core Problem:**
      *   *The Vagueness Problem:* "Substantial" is a vague predicate. This invites the Sorites Paradox (heap of sand). If one grain isn't a heap, when does it become one? Similarly, if one limitation isn't substantial, when do 20 become substantial?
      *   *The Consistency Problem:* Without anchors, human judgment drifts based on mood, fatigue, or recent cases (contrast effects).
      *   *The Time Constraint:* 45 minutes means no deep diving. The tool must be a heuristic, not an algorithm.
      *   *The Ethical/Professional Tension:* The user wants to avoid "pretending the line is sharper than it is." This requires acknowledging uncertainty within the decision.

  3.  **Develop the Procedure (The "Substantiality Anchor Protocol"):**
      *   *Philosophical Grounding:* Use "Paradigm Cases" and "Comparative Anchoring" instead of abstract definitions. This is practical epistemology. We know what *clearly* is substantial; we compare the uncertain case to the clear case.
      *   *Step 1: Triage (5 mins).* Is there a *Paradigm Substantial* impairment? (e.g., paralysis, blindness). If yes, stop and approve.
      *   *Step 2: Aggregation Mapping (15 mins).* For the "20 small things" problem. Group them by *domain* (Mobility, Cognition, Social, Self-Care). Do they cluster or scatter?
      *   *Step 3: The "Ordinary Person" Counterfactual (10 mins).* Compare to a non-disabled peer. Is the effort/cost significantly higher?
      *   *Step 4: The Consistency Check (10 mins).* Compare to a "Benchmark File" (a past case agreed upon by the team).
      *   *Step 5: The Margin of Error Declaration (5 mins).* If it's borderline, acknowledge it. Don't hide the vagueness.
      *   *Escalation:* When the decision relies on *policy intent* rather than *medical fact* (e.g., "Does society value independence over comfort?").

  4.  **Refine the Steps for the 45-Minute Limit:**
      *   Need to make sure the instructions are actionable.
      *   *Constraint:* The user said "no philosophy training." So, avoid terms like "Sorites" or "Epistemicism." Use "Anchor Cases" and "Effort Tax."
      *   *Consistency:* Introduce a "Calibration Case" concept. Every team needs a shared folder of "Gold Standard" decisions.
      *   *Honesty:* Include a "Confidence Score" or "Borderline Flag" in the notes.

  5.  **Drafting the Procedure (Iterative refinement):**
      *   *Question 1:* Is there a single barrier that stops a core activity? (Yes/No).
      *   *Question 2:* If multiple barriers, do they collapse a whole domain? (e.g., can't leave the house at all vs. can't go to *specific* shops).
      *   *Question 3:* The "Time/Energy Tax." Does it take them 2x the effort?
      *   *Question 4:* The "Anchor Comparison." Compare to File X (the team standard).
      *   *Escalation:* If the medical facts are clear but the *consequence* is debatable (e.g., "Is avoiding crowds substantial?"), send to supervisor.

  6.  **Developing the Test Cases:**
      *   *Case A (Single Severe):* Paraplegic. Clear cut. Procedure should fly through.
      *   *Case B (20 Small Things):* The user's nightmare. Anxiety, minor pain, forgetfulness. Procedure needs to force a decision on *cumulative impact*.
      *   *Case C (Incremental Worsening):* The Sorites Paradox in human form. Each year looks the same, but 4 years later they are different. This is the hardest one.
      *   *Unpopular Verdict:* Case C is the best candidate. If the annual assessment is "no change," the procedure might force a "No" even if the long-term view says "Yes." Or Case B might get a "No" because the domains don't collapse. Let's aim for Case B getting a "No" (or a "Refer") because the procedure demands *domain collapse*, not just annoyance. Actually, Case C is more philosophically interesting. If the procedure relies on *current* comparison to anchor, it might miss the drift. Let's make Case C the one where the procedure says "Not Substantial *yet*" which feels wrong morally but right procedurally. Or Case B gets rejected because "minor" doesn't aggregate without a "critical mass" in one domain. Let's go with Case B getting a rejection/referral because the "Effort Tax" isn't high enough in any single domain. That hurts.

  7.  **Addressing the "Honesty" Requirement:**
      *   I need to explicitly state where the procedure is just formalizing intuition.
      *   I need to admit that "Substantial" is a policy choice, not a medical fact.

  8.  **Final Review against Constraints:**
      *   45 mins? Yes, the steps are timed.
      *   No philosophy jargon? Yes, translated to "Anchor Cases."
      *   Consistency? Yes, via the Benchmark File.
      *   Escalation? Yes, defined.
      *   Three files run? Yes.
      *   Unpopular verdict? Yes.
      *   Limitations? Yes.

  9.  **Drafting the Content (Self-Correction during drafting):**
      *   *Correction:* Make sure I don't sound like I'm solving the Sorites Paradox. I'm managing it.
      *   *Correction:* Ensure the "20 small things" test isn't just "count them." It must be about *functional collapse*.
      *   *Correction:* The "Incremental" case needs to highlight the "Snapshot vs. Trajectory" problem. The procedure is for *today*, not the last 4 years. This will cause the uncomfortable verdict.

  10. **Final Polish:** Check tone. Professional, empathetic but firm, realistic. (Proceed to generate output).

  *(Self-Correction on the "Unpopular Verdict")*: The prompt asks for *one* verdict I will not like. As an assessor, I likely want to approve people who are struggling. So the procedure should force a rejection on a sympathetic case to show it's not a "rubber stamp." Case B (20 small things) is the best candidate for a "No" because individually they are minor, and without a specific domain collapse, the procedure shouldn't magic them into "Substantial." This validates the user's fear that they might be deciding by mood, but gives a structured reason for the "No."

  *(Wait, let's reconsider Case C)*. Case C (Incremental) is the true Sorites. If I say "No change from last year," I deny the claim. But they are worse than 4 years ago. This highlights the limitation of annual assessments. This might be more poignant. Let's make Case C the "No" because the *rate of change* doesn't trigger the threshold, even if the *absolute state* is bad. Actually, Case B is more practical for the "20 small things" problem the user explicitly cited. I will make Case B the "No/Refer" because the aggregation fails the "Domain Collapse" test. This is honest about the difficulty of aggregation.

  *Wait, let's look at the "Escalation" requirement.* "Where the procedure must stop and hand the call to a supervisor because the question is one of values rather than facts." This is crucial. I need to make sure one of the cases triggers this. Case C is good for this. The medical fact is "slow decline." The value judgment is "Does slow decline count as substantial *now*?"

  *Decision:* I will make Case B the "No" (Unpopular) because it exposes the aggregation flaw. I will make Case C the "Escalation" because it highlights the temporal value judgment. Case A is the "Yes" (Control).

  *Wait, re-reading prompt:* "At least one of the three should come out with a verdict I will not like." Okay. I will ensure Case B results in a "Not Substantial" finding, which will feel harsh given the list of difficulties.

  *Refining the Procedure Name:* "The Domain Collapse & Anchor Protocol (DCAP)." Sounds bureaucratic but usable.

  *Refining the Time:* 45 mins is tight. I need to be strict on time allocation.

  *Refining the "Honesty":* I need a section called "Where the Costume Slips."

  *Refining the "Consistency":* The "Benchmark File" is key.

  Let's write it.cw
answer: |-
  ## The Domain Collapse & Anchor Protocol (DCAP)

  **Time Budget:** 45 Minutes
  **Goal:** Convert vague judgment into structured comparison without pretending vagueness doesn't exist.
  **Philosophical Basis:** *Epistemicism* (there is a line, but we can't see it perfectly) mixed with *Exemplar Theory* (we define concepts by comparing them to clear examples, not definitions).

  ### Part 1: The Procedure

  #### Step 1: The Paradigm Check (5 Minutes)
  **Question:** Is there a single impairment that prevents a *core* ordinary activity entirely (e.g., walking, feeding, communicating) without aid?
  *   **Source:** Medical diagnosis + functional report.
  *   **Sufficient Answer:** "Yes, [Activity] is impossible."
  *   **Action:** If **Yes**, verdict is **Substantial**. Stop. (This captures the clear cases quickly).
  *   **Action:** If **No**, proceed to Step 2.

  #### Step 2: Domain Mapping & Aggregation (15 Minutes)
  **Question:** Do the reported difficulties cluster into a single *functional domain* that has collapsed?
  *   **Method:** Group the "20 small things" into four buckets:
      1.  **Mobility** (Standing, walking, transport)
      2.  **Cognition** (Memory, focus, decisions)
      3.  **Social/Behavioral** (Crowds, interactions, anxiety)
      4.  **Self-Care** (Washing, cooking, dressing)
  *   **Sufficient Answer:** You must identify *one* bucket where the cumulative effect makes the activity **unsafe, impossible, or excessively costly in time/effort (2x normal)**.
  *   **The Aggregation Rule:** Five minor mobility issues do *not* equal one major mobility issue unless they prevent leaving the house *entirely*. Scattered issues (one in each bucket) generally do *not* count as substantial unless they interact to cause total dependency.
  *   **Action:** If one domain has collapsed, verdict is **Substantial**. If difficulties are scattered across all four with no total collapse, verdict leans **Not Substantial**.

  #### Step 3: The Anchor Comparison (10 Minutes)
  **Question:** Is this file functionally worse than our Team Benchmark File #4 (The "Agreed Borderline")?
  *   **Method:** Your team must maintain one physical or digital "Anchor File." This is a past case that the team and supervisors agreed was a *just-pass* or *just-fail*. It is your unit of measurement.
  *   **Sufficient Answer:** "This claimant functions at the same level or worse than Anchor #4."
  *   **Action:** If **Worse**, verdict is **Substantial**. If **Better**, verdict is **Not Substantial**.
  *   **Consistency Mechanism:** If you and a colleague disagree, you do not argue the current case. You both re-read Anchor #4. If you agree on the comparison to the Anchor, you agree on the case.

  #### Step 4: The Effort Tax Calculation (10 Minutes)
  **Question:** Does the claimant achieve the activity only through disproportionate effort or pain?
  *   **Method:** Look for evidence of "post-exertional malaise," "recovery time," or "assistive devices."
  *   **Sufficient Answer:** "Claimant can cook, but requires 4 hours recovery afterwards."
  *   **Action:** If recovery time/effort > 100% of a non-disabled peer, verdict is **Substantial**.

  #### Step 5: The Uncertainty Declaration (5 Minutes)
  **Question:** Am I deciding based on medical fact or policy intent?
  *   **Method:** Review your reasoning.
  *   **Action:** If your reason is "Medically they can do it, but it seems cruel to deny," you must **Escalate to Supervisor**. This is a value judgment, not a factual one.
  *   **Action:** If the file is borderline (could go either way), you must write in the notes: *"Borderline Case. Decided based on Anchor #4 comparison. Reasonable doubt exists."* This prevents you from pretending the line was sharp.

  ---

  ### Part 2: Where the Costume Slips (Honesty Check)

  1.  **The Anchor is Arbitrary:** Anchor File #4 is not "truth." It is just a past decision. If the team's mood shifted when that file was decided, your consistency is consistently wrong. This procedure guarantees consistency, not correctness.
  2.  **Aggregation is Still Intuitive:** Step 2 asks you to decide if a domain has "collapsed." There is no math for this. You are still judging, but you are judging the *cluster* rather than the *list*.
  3.  **The "Ordinary Person" is a Fiction:** Step 4 assumes a standard for "normal effort." This varies by age and job. You are implicitly defining "ordinary" based on your own bias.
  4.  **Escalation is a Safety Valve:** Sending a case to a supervisor because it's a "value judgment" often just passes the buck. However, it protects you from making policy decisions disguised as medical assessments.

  ---

  ### Part 3: Running the Files

  #### File 1: The Single Severe Limitation
  *   **Profile:** Claimant is paraplegic. Medical records confirm inability to walk. Home has ramps. Job history shows they worked remotely until recently.
  *   **Step 1 (Paradigm):** Can they walk? No. Core activity prevented? Yes.
  *   **Verdict:** **Substantial.**
  *   **Time Taken:** 6 Minutes.
  *   **Comment:** The procedure works best here. It clears the obvious cases so you can spend time on the hard ones.

  #### File 2: The Twenty Small Things (Your Nightmare)
  *   **Profile:** Claimant lists: forgets appointments, cannot stand >10 mins, avoids crowded shops, sleeps poorly, gets headaches after reading, cannot lift >5kg, anxious on buses, etc. (20 items total). No single item prevents an activity entirely.
  *   **Step 1 (Paradigm):** Is anything impossible? No. They can walk, shop (uncrowded), read (briefly).
  *   **Step 2 (Domain Mapping):**
      *   *Mobility:* Can't stand long, can't lift heavy. But can walk short distances. **Domain Intact.**
      *   *Cognition:* Forgets appointments. But manages self-care. **Domain Intact.**
      *   *Social:* Avoids crowds. Can still interact 1-on-1. **Domain Intact.**
      *   *Self-Care:* No reported failure. **Domain Intact.**
  *   **Step 3 (Anchor):** Compare to Anchor #4 (a claimant with severe agoraphobia who could not leave the house at all). This claimant *can* leave the house, just not to crowds.
  *   **Step 4 (Effort Tax):** Evidence suggests tasks take longer, but not 2x time.
  *   **Verdict:** **Not Substantial.**
  *   **Time Taken:** 40 Minutes.
  *   **Why you won't like it:** This claimant is clearly struggling. Life is hard for them. But under the "Domain Collapse" rule, 20 minor irritations do not equal one substantial barrier. The procedure forces you to admit that "Substantial" requires a threshold of functional failure, not just a high volume of inconvenience. This exposes the harshness of the rulebook's vagueness.

  #### File 3: The Incremental Worsening (The Sorites Case)
  *   **Profile:** Claimant reassessed annually for 4 years.
      *   Year 1: Walks 500m.
      *   Year 2: Walks 450m.
      *   Year 3: Walks 400m.
      *   Year 4: Walks 350m.
      *   Each annual report concluded: "No material change from previous assessment."
  *   **Step 1 (Paradigm):** Can they walk? Yes.
  *   **Step 2 (Domain Mapping):** Mobility is impaired but not collapsed.
  *   **Step 3 (Anchor):** Compare to Anchor #4. Functionally, they are similar to last year.
  *   **Step 4 (Effort Tax):** Effort has increased, but incrementally.
  *   **Step 5 (Uncertainty Declaration):** Here the procedure halts.
      *   *Fact:* They are worse than 4 years ago.
      *   *Fact:* They are nearly the same as 1 year ago.
      *   *Value Question:* Does the scheme cover *trajectory* or *snapshot*? If we deny them now because they haven't changed *this year*, we ignore the 4-year decline. If we approve them, we admit the previous 3 decisions were arguably wrong (or that the threshold is moving).
  *   **Action:** **Escalate to Supervisor.**
  *   **Reason:** "Medical facts show slow decline. Decision rests on whether 'Substantial' includes cumulative drift over multiple assessment periods. This is a policy interpretation, not a medical fact."
  *   **Time Taken:** 45 Minutes (Limit reached).

  ---

  ### Part 4: What This Procedure Cannot Do

  1.  **It Cannot Fix the Rule:** If the word "Substantial" is fundamentally broken for chronic, fluctuating, or aggregating conditions, this procedure only makes the rejection more consistent. It does not make it more just.
  2.  **It Cannot Measure Suffering:** Step 4 measures *effort*, not *pain* or *dignity*. A claimant might manage a task with 100% more effort but at the cost of severe pain. Unless the medical records explicitly link pain to the effort tax, the procedure ignores the pain.
  3.  **It Cannot Solve the Sorites Paradox:** File 3 shows that if you assess in snapshots, you miss the heap forming grain by grain. The procedure forces you to kick this upstairs, but the supervisor faces the same logical trap.
  4.  **It Requires Team Buy-In:** The "Anchor File" only works if your colleagues actually use it and agree on it. If they swap Anchor files or ignore them, the consistency guarantee vanishes.

  **Final Instruction:** Print the "Domain Mapping" buckets and keep the "Anchor File" open on your desk. When you feel the mood swinging, look at the Anchor, not the claimant. When you feel cruelty in a "Not Substantial" verdict, check Step 5. If it's a value judgment, escalate. Do not absorb the policy's moral weight as your own professional error.
