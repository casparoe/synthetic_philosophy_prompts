answer: |-
  You have not discovered a ghost; you have discovered the engine of reference. You are feeling the shift from **Attributive** tracking to **Rigid** tracking.

  There is a name for the logic you are describing, though it comes from philosophy rather than writers' workshops. It is **Rigid Designation** (developed by Saul Kripke). But since you want the carving for a novelist's hand, not a logician's notebook, I will give you the philosophical skeleton and then clothe it in the terminology of draft-work.

  Here is the carving you asked for.

  ### 1. The Two Handles

  You are sensing the difference between a **Floating Description** and a **Fixed Anchor**.

  *   **The Floating Description (Attributive):**
      *   *Mechanism:* The handle refers to "whoever fits the description."
      *   *In your draft:* "The printer."
      *   *Behavior:* If you change the properties (he becomes a farmer), the handle breaks. It no longer points to him; it points to whoever is now the printer. To keep holding him, you must bolt on "in fact" (e.g., "the one who *was* the printer").
      *   *Feeling:* Fragile. The identity is constituted by the qualities. Change the quality, you lose the person.

  *   **The Fixed Anchor (Rigid Designator):**
      *   *Mechanism:* The handle refers to "this specific entity, regardless of properties."
      *   *In your draft:* "John" (or a promoted description).
      *   *Behavior:* If you change the properties (he becomes a farmer), the handle holds. "John" still points to him, even if he never touches a press.
      *   *Feeling:* Solid. The identity is constituted by a causal history (the moment you introduced him), not by his current job.

  ### 2. The Promotion: **Narrative Baptism**

  You asked for a term for the upgrading. In philosophy, this is "Reference Fixing." For your ledger, call it **Narrative Baptism**.

  This is the moment in Draft Three when you stop tracking the character by their *qualities* (printer, tall, boy) and start tracking them by their *history* (the man introduced in Chapter 1).

  *   **What happens:** The text establishes a causal chain. The first time you name him (or uniquely identify him), you perform a "baptism." Every subsequent use of the name/handle draws its power from that first moment, not from the description attached to it.
  *   **Why the old description stops travelling:** Because the description was only the *pointer* to the baptism. Once the baptism is complete, the pointer is discarded. You don't need "the printer" to find John anymore; you have "John."
  *   **Boundary Case:** If you kill the character and bring back a different man with the same name in a sequel, the Baptism is broken. The Anchor resets.

  ### 3. The Reader's Move: **Pragmatic Rigidification**

  You noted that readers treat "the printer" as a name by Chapter Nine, even if there were three printers. They silently narrow the field.

  This is **Pragmatic Rigidification**.

  *   **The Mechanism:** Readers operate under a contract of relevance. If you say "the printer" in Chapter Nine, the reader assumes you mean *the* printer established in the Narrative Baptism of Chapter One. They convert your description into a Fixed Anchor automatically to maintain coherence.
  *   **Why they don't notice:** Because the cognitive load of tracking "which printer?" is higher than the load of assuming "the printer we know."
  *   **Boundary Case:** This fails if you introduce a *second* printer without distinguishing them. The reader's brain will "glitch" (confusion) because two Anchors are fighting for the same Descriptor. They will force a distinction ("the old printer" vs "the young printer") to rebuild the Anchors.

  ### 4. Thing Two: **Necessary Identity**

  Your archival discovery (Name A = Name B) is the same mechanism, but applied to history rather than draft.

  *   **The Phenomenon:** Once you empirically establish that Record A and Record B are the same man, the identity becomes **Necessary**.
  *   **Why it feels locked:** In logic, if `a = b` is true, it is true in all possible worlds *where those objects exist*. You cannot imagine a world where Hesperus is not Phosphorus (the Evening Star and the Morning Star) once you know they are both Venus.
  *   **The Split:**
      *   **Locked:** The Identity (He is the man in both records). This is rigid.
      *   **Flexible:** The Contingent Facts (He owed money, he lived on X street). These are properties, not identity.
  *   **Is it Thing One?** Yes. In Draft One, the character is a bundle of properties (contingent). In Draft Three, the character is an Identity (necessary). Your archival work forced the historical figure out of "bundle of properties" mode and into "Identity" mode. You stopped looking at *descriptions* of him and started looking at *him*.

  ### 5. The Coined Term: **The Narrative Substantive**

  You asked me to coin a term for "a description that's been upgraded... with no in-fact in it at all."

  I propose: **The Narrative Substantive**.

  *   **Definition:** A definite description (e.g., "the printer," "the tall boy") that has acquired the referential stability of a Proper Name through the momentum of the text, despite retaining the grammatical form of a description.
  *   **How it works:** The text creates enough causal weight around the description that it functions as a Baptism. "The printer" no longer means "whoever prints"; it means "That Guy."
  *   **Boundary Cases (Where it stops applying):**
      1.  **Time Jumps:** If you jump forward 20 years and say "the printer," it may revert to a Floating Description unless you re-anchor it ("the printer, now old...").
      2.  **Generic Context:** If the character enters a room with three other printers and you write "the printer looked up," the Substantive breaks. It reverts to a Floating Description and the reader gets confused. You must re-assert the Anchor ("*His* printer looked up" or "John looked up").
      3.  **Thematic Shifts:** If the book shifts from historical realism to allegory, Substantives often dissolve back into Descriptions (e.g., "Everyman," "The Soldier").

  ### Summary for your Ledger

  *   **Draft 1-2:** You are tracking **Properties**. (Handle: Floating Description).
  *   **Draft 3+:** You are tracking **Substance**. (Handle: Fixed Anchor / Narrative Substantive).
  *   **The Promotion:** **Narrative Baptism**.
  *   **The Reader's Trick:** **Pragmatic Rigidification**.
  *   **The Archival Lock:** **Necessary Identity**.

  You are not imagining the difference. You are feeling the moment your text stops describing a role and starts pointing to a soul. Keep the ledger. When the description stops travelling, you know the Baptism has taken.
