answer: |-
  **Scenario**
  Elena, a grad student, uses a "TaskLock" app to manage her TA grading. She has a batch of papers due Friday 5 PM (Day 3); completing them yields a $50 stipend but costs $30 in effort (net +$20). The app lets her pay a $5 "Snooze Fee" to push the deadline 24 hours. At the start (Day 0 Morning), she can buy a "Focus Lock" for $8 that forces submission on Day 1, or stay "Free." Elena has quasi-hyperbolic preferences: she values immediate costs/rewards at face value, but discounts all future utilities by $\beta=0.5$. She knows her own psychology and the fee schedule perfectly. At Day 0, she declines the Focus Lock. On Day 1 and Day 2, she pays the Snooze Fee. On Day 3, she submits the papers. She ends the week with the task completed (her goal state) but $10 poorer in fees than if she had locked, and $2 poorer than if she had simply submitted on Day 1 without fees.

  **Analysis**
  **Preference Structure:** Elena maximizes $U_t = u_t + \beta \sum_{k=1}^T \delta^k u_{t+k}$ with $\beta=0.5, \delta=1$. Costs are negative, benefits positive.
  **Ledger & Rankings:**
  *   **Day 0 (Start):**
      *   *Option Lock:* Pay $8 now. Task on Day 1 (Net +$20 future). $U = -8 + 0.5(20) = \mathbf{+2}$.
      *   *Option Free:* Pay $0 now. She correctly predicts she will Snooze Day 1 & 2 (Cost $10 future) and Submit Day 3 (Net +$20 future). Total Future Net = $10. $U = 0 + 0.5(10) = \mathbf{+5}$.
      *   *Choice:* **Free** (+5 > +2). *Rational.* (Precommitment cost is immediate; fees are discounted).
      *   *Transitivity:* {Lock, Free} ordered strictly. No cycle.
  *   **Day 1 (Morning):**
      *   *Option Submit:* Cost $30 now. Benefit $50 future. $U = -30 + 0.5(50) = \mathbf{-5}$.
      *   *Option Snooze:* Cost $5 now. Future Net (from Day 2 view) = $15 (Snooze D2 + Submit D3). $U = -5 + 0.5(15) = \mathbf{+2.5}$.
      *   *Choice:* **Snooze** (+2.5 > -5). *Rational.*
      *   *Transitivity:* {Submit, Snooze} ordered strictly. No cycle.
  *   **Day 2 (Morning):**
      *   *Option Submit:* $U = -30 + 0.5(50) = \mathbf{-5}$.
      *   *Option Snooze:* Cost $5 now. Future Net (Submit D3) = $20. $U = -5 + 0.5(20) = \mathbf{+5}$.
      *   *Choice:* **Snooze** (+5 > -5). *Rational.*
  *   **Day 3 (Morning):**
      *   *Option Submit:* $U = -30 + 50 = \mathbf{+20}$.
      *   *Option Fail:* $U = 0$.
      *   *Choice:* **Submit**.
  *   **Result:** Task Completed (Same outcome as Lock). Fees Paid: $10. Net Stipend: $10. (Lock Net: $12). **Loss: $2.**

  **Stationary Discounting Check:** If $\beta=1$ (Exponential), Day 0 Lock = $-8+20=12$; Day 0 Free = $0+10=10$. She chooses Lock. The pump collapses entirely. The residue is purely a product of non-stationarity ($\beta < 1$).

  **Blocking Moves:**
  *   *Sophisticated Choice:* She *was* sophisticated (she correctly predicted the snoozes at Day 0). Sophistication didn't save her because the *discounted* cost of the fees at Day 0 looked cheaper than the immediate cost of the Lock.
  *   *Planning/Disposition:* A "resolute" chooser would have locked. But resoluteness requires acting against current preferences (at Day 0, Free > Lock). If rationality requires maximizing current utility, resoluteness is irrational.

  **The Synchronic Theorist's Best Attack:**
  A strict synchronic theorist (e.g., a defender of revealed preference) will argue: "At every node $t$, Elena chose the option with the highest $U_t$. She had full information. She was not coerced. To call this irrational is to impose an external 'diachronic' norm that has no bite on the agent's actual decision problem at any $t$. The 'loss' is only visible from a God's-eye view of the timeline, which the agent never occupies. She bought 'flexibility' at Day 0 because it was cheap *then*; she bought 'delay' at Day 1 because it was valuable *then*. The preferences changed, but the choices tracked the preferences perfectly."

  **Verdict**
  Elena is **irrational**, but the failure is not located at any single moment. It is located in the **Preference Structure's Non-Stationarity**.
  *   **Reasons:** While every local choice maximizes local utility, the sequence violates **Dynamic Consistency**. A rational agent's plan, if optimal at $t_0$, should remain optimal at $t_1$ absent new information. Elena's plan (Free) was optimal at $t_0$ only because she discounted the future fees; at $t_1$, those fees loomed larger, reversing the ranking.
  *   **Location:** The failure is **Global**. Pinning it on Day 0 is wrong (Lock was objectively worse *by her lights then*). Pinning it on Day 1 is wrong (Snooze was objectively better *by her lights then*). The irrationality is the **architectural flaw** that allows the agent to be her own money pump: the discount factor $\beta$ applies differently to "now" vs. "later" depending on where "now" is. She is rational at every instant, but **irrational as a temporally extended agent**. The "money pump" proves that synchronic rationality is insufficient for diachronic welfare; without a stationarity constraint, an agent can foreseeably, willingly, and rationally (at each step) make themselves poorer.
