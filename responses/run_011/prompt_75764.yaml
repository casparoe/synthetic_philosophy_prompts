          *   Let's use a "Reservation Swap" model.
          *   She has a delivery slot. She pays to move it later. Then she pays to move it later again. Then she cancels? No, needs to end up back where she started.
          *   *Better:* The "Premium Access" Loop.
          *   She has a subscription. She pays to upgrade for speed. Then she pays to downgrade for savings? No.
          *   *Let's look at the "Money Pump for Hyperbolic Discounting" literature.* Usually, it involves paying to restrict future choices. But here she *doesn't* restrict.
          *   *Key Insight:* To make declining precommitment rational at $t_0$, the cost of precommitment must exceed the *anticipated* loss at $t_0$. But the anticipated loss at $t_0$ depends on her $t_0$ prediction of her $t_1$ behavior. If she is "Naive," she thinks she won't succumb. But the prompt says "no ignorance." She knows the fee schedule and her own psychology.
          *   *If she is Sophisticated:* She knows she will succumb. She should precommit. If she doesn't, she is irrational at $t_0$.
          *   *Constraint Check:* "her not taking it has to be locally rational at that moment as well — not weakness of will, its not a mistake she knows she's making."
          *   *This is the hardest constraint.* If she knows she will be pumped, and precommitment is cheap, declining precommitment is irrational *unless* the precommitment costs more than the pump loss *from the $t_0$ perspective*.
          *   *Solution:* The precommitment device itself has a cost that looks too high at $t_0$ because of discounting, but the pump losses happen later.
