      *(Refining the Recommendation)*: I shouldn't just say "wait." I should suggest that the £25k loss needs to be challenged. Is it truly inevitable? Can prices be raised? If not, and the business fails, the ethical project ends. So, survival is a precondition for ethics. But the *attitude* must change.

