          4.  Advise on the crew member and supermarket statement *now*.
          5.  Start with brainstorming angles (including one where the partner is right).
          6.  End with a concrete recommendation and a script for Monday morning.

  2.  **Deconstruct the Ethical & Practical Problems:**

      *   *Moral Uncertainty:* The core philosophical issue. How to act when $P(\text{sentience}) > 0$ but $< 1$, and the cost of mitigation is high relative to margins.
      *   *The Partner's Argument:* Skepticism about sentience + Prioritization of known harms (water quality) over hypothetical harms (slaughter method). This is a form of "expected value" reasoning but potentially flawed in its probability assignment or risk assessment.
      *   *The Financials:* £43k total first-year impact. For a small business near the line, this is existential risk.
      *   *The Crew Member:* Indicates a "moral residue" or "complicity" issue. Even if the prawns don't suffer, the *act* of killing might be affecting the humans.
      *   *The Supermarket:* A forcing mechanism. Committing to a standard locks in future costs/reputation risk.

  3.  **Brainstorming Angles (as requested):**

      *   *Angle 1: The Precautionary Principle.* If there's a non-negligible chance of severe suffering, we should act to prevent it, even at cost. (Standard animal ethics view).
      *   *Angle 2: The Partner's View (Utilitarian/Resource Allocation).* Resources are finite. Spending £43k on *possible* prawn pain means *less* money for *definite* water quality issues (which cause definite death/stress). If prawns are insensate, this money is literally burned, worsening overall welfare (including human staff security).
      *   *Angle 3: Virtue Ethics/Character.* What kind of people do we become by ignoring the possibility of suffering? What kind of industry do we build?
      *   *Angle 4: Moral Uncertainty Frameworks.* Expected Moral Value. Weighting the probability of sentience against the magnitude of harm.
      *   *Angle 5: The Human Element.* The crew member's distress suggests the *practice* is harmful to humans, regardless of prawn sentience.

  4.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Acknowledge the weight of the situation. Set the British English tone (understated, precise).
      *   **Brainstorming:** Lay out the perspectives. Ensure the Partner's view gets a robust defence (Angle 2 above).
      *   **Task 1: The Partner's Reasoning Error.** It's not just overconfidence. It's treating uncertainty as zero. It's a category error between *epistemic uncertainty* (we don't know) and *ontological claim* (they don't feel). It's also ignoring the "moral risk" asymmetry.
      *   **Task 2: Decision Making under Uncertainty.** Introduce the concept of "Expected Moral Value" but adapted for business survival. The "Pascal's Wager" aspect but grounded. If the harm is infinite (or extreme) and probability is non-zero, the expected cost is high. However, business bankruptcy is also a moral negative (livelihoods). Need a threshold.
      *   **Task 3: The Money.** Money isn't just utility; it's viability. But £25k/year recurring is dangerous. The capex is manageable if financed. The lost throughput is the real killer. Is the throughput loss inevitable? Can it be mitigated? The money belongs on the scale as "capacity to do good in the future."
      *   **Task 4: Immediate Actions (Crew & Supermarket).**
