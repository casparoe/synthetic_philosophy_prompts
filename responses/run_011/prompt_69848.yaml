answer: |-
  ### 1. The Mapping Table

  | Legal Domain (Litigation) | Moral Domain (Hypocritical Blame) | Plausibility Note |
  | :--- | :--- | :--- |
  | **Plaintiff** | The Blamer | High. The one initiating the action. |
  | **Defendant** | The Blamed | High. The target of the action. |
  | **Court** | The Moral Community / Audience | **Variable.** In public blame, this is the audience; in private blame, this slot is empty or filled by the conscience of the blamed. |
  | **Injury** | The Norm Violation / Wrongdoing | High. The substance of the complaint. |
  | **Filing** | The Act of Blaming | High. The initiation of the demand. |
  | **Dismissal** | Rejection of the Blame (as illegitimate) | Medium. Blame is often "rejected" socially, but rarely ontologically stopped. |
  | **Rule (Standing)** | Norm Against Hypocrisy | **Contested.** Legally, standing is about injury, not conduct. Morally, this rule is about the blamer's conduct. |
  | **Jurisdiction** | Moral Authority | Low. There is no clear equivalent to geographic or subject-matter jurisdiction in informal blame. |

  ### 2. The Friend's Objection and the Better Doctrine

  Your friend is legally correct. **Standing** (*locus standi*) determines whether a party has suffered a concrete, particularized injury sufficient to invoke the court's power. It is threshold criteria regarding the *relationship to the harm*, not the *character of the claimant*. A saint and a sinner have equal standing if both were punched in the nose.

  The doctrine you are actually describing is **Unclean Hands** (in equity) or **_In Pari Delicto_** (at law).
  *   **What it requires:** This doctrine bars a plaintiff from obtaining relief if they have acted unethically or in bad faith *regarding the subject matter of the complaint*. It is explicitly conduct-based.
  *   **The Fit:** This fits hypocrisy perfectly. The hypocrite is not barred because they lack a stake in the moral norm (standing); they are barred because their own conduct regarding that norm disqualifies them from seeking redress.
  *   **Impact on Verdict:** Borrowing "Unclean Hands" strengthens your thesis. "Standing" suggests the blamer is a stranger to the norm (which hypocrites are not; they usually affirm the norm). "Unclean Hands" suggests the blamer is a participant who has forfeited their privilege to enforce the norm. This supports your claim that hypocritical blame is *structurally* defective (procedurally barred) rather than *substantively* false (the wrong didn't happen).

  ### 3. Fatal vs. Cosmetic Disanalogies

  You anticipated objections regarding the lack of clerks, dockets, and robes. These are **cosmetic**. They are institutional trappings that do not affect the logical structure of the argument. A moral "court" can be informal without undermining the procedural nature of the dismissal.

  The **fatal** disanalogy is the **Enforceable Judgment**.
  *   **Why it matters:** In law, a dismissal *stops* the case. The defendant is legally free to ignore the plaintiff. In morality, a hypocrite can continue to blame, and the blamed party often still feels the sting of the accusation. There is no moral bailiff to remove the hypocrite from the room.
  *   **The Distinction:** A disanalogy is cosmetic if it concerns *how* the decision is recorded; it is fatal if it concerns *whether* the decision has effect. Because hypocritical blame often succeeds socially (people believe the hypocrite despite the hypocrisy), the "dismissal" is not ontological. It is a normative claim about *authority*, not a descriptive claim about *outcome*. If your argument relies on the blame actually ceasing, the analogy fails. If it relies on the blame being *unjustified*, the analogy holds.

  ### 4. Smuggled Assumptions

  The analogy smuggles in a **Procedural Conception of Blame**.
  *   **The Presupposition:** It assumes blame is a triadic relation (Blamer, Blamed, Forum) rather than a dyadic one (Blamer, Blamed). It suggests blame requires a "hearing" before an audience or authority to be valid.
  *   **The Risk:** Many philosophers (e.g., Stephen Darwall) argue blame is a second-personal demand addressed *directly* to the wrongdoer, requiring no third-party forum. If blame is a direct demand, "dismissal" makes little sense. You cannot "file" a demand against someone in private in a way that can be "thrown out" by a clerk.
  *   **Survival:** If you deny the forum presupposition, the "dismissal" language must be replaced with "invalidity" or "lack of authority." The core of your chapter survives—the claim that the hypocrite lacks the *right* to blame—but you must abandon the imagery of the case being "never heard." Instead, the case is heard but carries no weight.

  ### 5. Final Verdict

  **Does the claim survive?**
  Yes, but the legal terminology requires correction to withstand scrutiny. The claim that hypocritical blame is barred (normatively invalid) rather than merely impolitic survives, but "Standing" is the wrong vehicle to carry it.

  **Narrower Description for Print:**
  > "Hypocritical blame is not necessarily false in its content, but like a claim brought with unclean hands, it is procedurally barred: the blamer's own conduct forfeits their authority to enforce the norm."

  **Alternative Analogy:**
  If you wish to avoid legal technicalities entirely, consider the **Referee Analogy**.
  *   *The Image:* A referee who committed the same foul five minutes ago cannot call that foul on a player.
  *   *Why it works:* It captures the loss of authority due to conduct without implying a formal court. It preserves the "barred" intuition (the call is voided) without the "standing" error.
  *   *Where it breaks down:* Referees are appointed authorities; moral agents are not always appointed. It risks making blame seem like a professional role rather than a human capacity.

  **Recommendation:**
  Adopt your friend's correction. Switch from "Standing" to "Unclean Hands." It costs you nothing in accessibility (the phrase is common idiom) and gains you precision. It validates your friend's expertise while preserving your philosophical thesis that hypocrisy is a structural defect in the *act* of blaming, not just a flaw in the *character* of the blamer.
