prompt: |-
  I am drafting the opening chapter of a general-audience book on holding people responsible, and the analogy I use to explain hypocrisy is borrowed from litigation. A plaintiff may be entirely correct that the defendant breached a duty and still be turned away for want of standing: the case is not lost on the merits, it is never heard. I tell readers that hypocritical blame fails in the same way — the content of the complaint may be sound, but the complainer lacks the authority to press it, so the charge is thrown out before it is reached rather than answered. A friend who practices civil litigation read the draft and objected that I had borrowed the wrong courtroom: standing, she said, is not the thing in law that bars a claimant on account of the claimant's own conduct, and by reaching for it I have attached my moral thesis to a doctrine that cannot carry it.

  Please audit the analogy.

  1. Give the mapping explicitly, as a table: what in the moral case plays the part of plaintiff, defendant, court, injury, filing, dismissal, and the rule that supplies the standing requirement — and mark any cell where nothing in the moral case plausibly fills the slot.

  2. Take up my friend's objection. Is legal standing the right source domain for the defect hypocrisy is supposed to be, or is there another part of the law that bars a party because of that party's own conduct and fits the phenomenon better? Name it, state what it requires, and say whether borrowing it in place of standing changes the verdict on hypocritical blame — for better or for worse.

  3. Separate the disanalogies that matter for the argument I am making from the ones that do not. I expect the absence of a clerk, a docket, a judge, and an enforceable judgment to be listed against me; tell me which of these are fatal and which are cosmetic, and what makes the difference between the two.

  4. Identify what the analogy smuggles in about blame that I have not argued for independently — in particular whether it presupposes that blaming is a proceeding conducted before some forum rather than a demand addressed directly to the person blamed, and what survives of my chapter if I deny that presupposition.

  5. End with a verdict: does the claim I wanted — that hypocritical blame is barred rather than merely impolitic — survive the audit? If it survives only under a narrower description, give me that description in a sentence I could actually print. And if some other analogy would carry the same point with fewer imports, propose it and say where it in turn breaks down.
reasoning: |-
  Here's a thinking process that leads to the suggested audit:

  1.  **Analyze the Request:**
      *   **Task:** Audit an analogy used in a book chapter about holding people responsible.
      *   **Core Analogy:** Hypocritical blame is like a legal case dismissed for lack of *standing* (plaintiff has a valid claim but no authority to sue).
      *   **Critique:** A lawyer friend says *standing* is the wrong doctrine; standing isn't about the plaintiff's *conduct*, it's about their relationship to the injury.
      *   **Requirements:**
          1.  Create a mapping table (Moral vs. Legal).
          2.  Address the friend's objection (Is standing right? If not, what is? Does it change the verdict?).
          3.  Distinguish fatal vs. cosmetic disanalogies (clerk, docket, judge, judgment).
          4.  Identify smuggled assumptions (Is blame a proceeding? What if it's a direct demand?).
          5.  Final verdict (Does the claim survive? Narrower description? Better analogy?).

  2.  **Deconstruct the Analogy (Mental Draft):**
      *   *Moral Case:* Person A blames Person B for X. Person A also did X.
      *   *Legal Case:* Plaintiff sues Defendant for Breach. Plaintiff has no standing.
      *   *Friend's Point:* Standing is about "injury in fact," causation, and redressability. It's not about "clean hands." If the plaintiff did the same thing, that's not standing. That's *unclean hands* or *in pari delicto*.
      *   *Implication:* The author's analogy is legally inaccurate regarding *standing*. But is it philosophically useful?

  3.  **Step 1: The Mapping Table:**
      *   Plaintiff -> The Blamer.
      *   Defendant -> The Blamed.
      *   Court -> The Moral Community / Audience / Conscience.
      *   Injury -> The Wrongdoing / Norm Violation.
      *   Filing -> The Act of Blaming.
      *   Dismissal -> Rejection of the Blame (as hypocritical).
      *   Rule (Standing) -> Norm against Hypocrisy (Tu Quoque / Clean Hands).
      *   *Empty Slots:* Is there a direct equivalent to "jurisdiction"? Maybe "moral authority."

  4.  **Step 2: The Friend's Objection (Legal Doctrine):**
      *   *Friend is right:* Standing (Article III in US law) is about whether *this* plaintiff suffered *this* injury. It doesn't matter if the plaintiff is a saint or a sinner, only if they were hurt.
      *   *Better Doctrine:* "Unclean Hands" (equity) or *In Pari Delicto* (both at fault). Also, maybe "Estoppel."
      *   *Unclean Hands:* If you acted badly regarding the subject matter, you can't get equitable relief. This fits hypocrisy better (your conduct bars your claim).
      *   *Does it change the verdict?*
          *   *Standing:* Implies you have no *right* to be there at all (too abstract).
          *   *Unclean Hands:* Implies you have a valid claim but equity won't help you because of your behavior.
          *   *Impact:* "Unclean hands" actually supports the author's point *better* than standing. Standing says "you aren't the right person." Unclean hands says "you are the right person, but your behavior disqualifies you." Hypocrisy is usually about the blamer's behavior, not their abstract relationship to the norm. So, switching doctrines strengthens the moral thesis.

  5.  **Step 3: Disanalogies (Fatal vs. Cosmetic):**
      *   *Cosmetic:* Clerk, docket, physical courtroom, robes. These are procedural trappings.
      *   *Fatal:* Enforceable judgment. In law, the court *stops* the case. In morality, the hypocrite *can* still blame, people just think less of it. The "dismissal" isn't ontological; it's social/psychological.
      *   *Judge:* In law, a third party decides. In morality, is it the blamed person? The audience? If there's no third party, the "court" metaphor wobbles.
      *   *Distinction:* Cosmetic = flavor. Fatal = structural mechanics that undermine the "barred vs. impolitic" claim. If the case isn't actually *stopped*, just *criticized*, the "dismissal" analogy fails.

  6.  **Step 4: Smuggled Assumptions:**
      *   *Assumption:* Blame is a public proceeding requiring a forum.
      *   *Reality:* Blame can be private (I blame you in my head, or I tell you directly).
      *   *Risk:* If blame is a direct demand (Darwall-style), then "standing" makes less sense. It's more about authority than procedure.
      *   *Survival:* If I deny the forum presupposition, the "dismissal" language needs to change to "invalidity" or "lack of authority." The core point (hypocrisy undermines authority) survives, but the procedural metaphor dies.

  7.  **Step 5: Final Verdict:**
      *   *Claim:* Hypocritical blame is barred (normatively invalid), not just impolitic.
      *   *Audit Result:* The *Standing* analogy is legally wrong (friend is right). The *Unclean Hands* analogy is legally right and philosophically stronger.
      *   *Survival:* The claim survives but needs refinement. It's not that the case isn't heard; it's that the remedy is denied.
      *   *Narrower Description:* "Hypocritical blame is not necessarily false, but it is normatively unenforceable by the blamer."
      *   *Alternative Analogy:* A referee who broke the same rule trying to call a foul. Or a creditor who owes money to the debtor trying to collect.
      *   *Best Alternative:* "Unclean Hands" is the best legal one. Non-legal: A contaminated messenger.

  8.  **Drafting the Response (Iterative refinement):**
      *   *Tone:* Professional, analytical, constructive (like an editor or peer reviewer).
      *   *Section 1 (Table):* Be precise. Mark the "Court" carefully—it's often vague in moral cases.
      *   *Section 2 (Legal Doctrine):* Confirm the friend's expertise. Introduce "Unclean Hands." Explain why it fits *conduct* better than *standing*.
      *   *Section 3 (Disanalogies):* Focus on the "Enforceable Judgment." That's the big one. In morality, the hypocrite *can* keep blaming. The "dismissal" is in the *uptake*, not the *act*.
      *   *Section 4 (Smuggled Assumptions):* Address the "Forum" issue. If blame is second-personal (Darwall), standing is less relevant than authority.
      *   *Section 5 (Verdict):* Give the printable sentence. Suggest the "Unclean Hands" swap.

  9.  **Refining the "Standing" vs. "Unclean Hands" distinction:**
      *   Standing: Do you have a stake? (Hypocrisy doesn't mean you lack a stake. You are part of the moral community.)
      *   Unclean Hands: Did you mess up regarding this specific issue? (Yes, that's hypocrisy.)
      *   *Crucial nuance:* Some philosophers (like Fritz or Bell) argue hypocrites *lose the standing* to blame. So the term "standing" is used in philosophy *differently* than in law. The friend is objecting to the *legal* accuracy, not necessarily the philosophical utility. I need to acknowledge this tension. The author is using a legal metaphor for a philosophical concept. If the legal metaphor is legally wrong, it confuses readers who know law. Better to use the correct legal term or drop the legal specificity.
      *   *Decision:* Advise switching to "Unclean Hands" or acknowledging the philosophical vs. legal definition of standing. "Unclean Hands" is more precise for *conduct*.

  10. **Refining the "Barred vs. Impolitic" claim:**
      *   If the analogy fails, does the claim fail? Not necessarily. But the analogy was doing heavy lifting to show it's *structural* (dismissal) not *substantive* (merits).
      *   "Unclean Hands" preserves this: The claim is valid, but the court won't help *you*.
      *   Wait, does moral blame get "dismissed"? Or does it just land poorly? If I hypocritically blame you, are you *obligated* to ignore me? Or just *permitted* to resent my tone?
      *   If the claim is "barred," it means the blame is *invalid*. If it's "impolitic," it's valid but rude.
      *   The "Unclean Hands" doctrine says the claim is valid, but relief is denied. This maps well to: "You did wrong, but I can't hold you responsible."

  11. **Final Polish:** Check constraints. 5 specific sections. Clear headings. Printable sentence.

      *(Self-Correction during drafting)*: Make sure to explicitly mark the empty cell in the table as requested. The "Court" is the trickiest one. In private blame, there is no court. I should mark that as "Variable/Contested."

      *(Refining the Alternative Analogy)*: The "Referee" analogy is common. But the "Unclean Hands" is the legal fix. I should propose the legal fix first since the author wants a legal analogy. If they want non-legal, maybe "A debtor trying to collect a debt."

      *(Final check on Friend's Objection)*: The friend says standing doesn't bar based on *conduct*. This is legally accurate. Standing is about *injury*. So I must validate the friend.

      *(Final Verdict)*: The claim survives *if* the analogy is corrected. The "Standing" label is the weak link, not the "Dismissal on procedural grounds" logic.

