  ### Part 1: The Logical Space (Questions and Combinations)

  Below are the eleven branch nodes that map the logical terrain. Each node is a neutral question; answering it does not commit you to a solution, only to a specific constraint on the solution. Following the nodes is a table of the possible combinations of answers. Some combinations are marked as **Empty**; these are logically incoherent or mathematically impossible spaces that no position can occupy.

  **The Branch Nodes**

  1.  **Reference:** In the calculation $0.5(2A) + 0.5(A/2)$, does the symbol $A$ represent the exact same quantity in both the 'double' term and the 'half' term?
  2.  **Independence:** (If Yes to 1) Is the 50% probability of the other envelope being double independent of the specific value of $A$?
  3.  **Finite Mean:** (If Yes to 2) Is it possible to construct a probability distribution that supports this independence without the total expected amount of money being infinite?
  4.  **Hard Cap:** (If Yes to 3) Does the setup imply a known hard upper limit on the money (e.g., a maximum possible cheque value)?
  5.  **Theory Breakdown:** (If No to 3) If the expected amount must be infinite, does this invalidate the use of expected value theory entirely?
  6.  **Observation:** (If No to 2) To determine the correct probabilities, is it necessary to open the envelope and observe the value of $A$?
  7.  **Symbolic Error:** (If No to 1) Is the primary error simply using one letter to denote two distinct random variables?
  8.  **Reference Fix:** (If No to 7) If not purely symbolic, is the error that $A$ refers to a value that shifts depending on which world-state you are in?
  9.  **Global Sum:** (If Yes to 8) Does resolving the shift require summing the gains over all possible pairs of envelopes to show a net zero?
  10. **Commitment:** (If No to 9) Is the solution to treat the decision as a pre-committed policy rather than a case-by-case act?
  11. **Randomisation:** (If Yes to 10) Does the policy require generating a random threshold number at the moment of decision rather than following a fixed rule?

  **The Combinations (Logical Space)**

  | Path (Answers to 1-11) | Status | Notes |
  | :--- | :--- | :--- |
  | **Yes - Yes - No - [Break]** | **Occupied** | Leads to Leaf 1. |
  | **Yes - Yes - No - [Accept]** | **Occupied** | Leads to Leaf 2. |
  | **Yes - Yes - Yes - Yes** | **Occupied** | Leads to Leaf 3. |
  | **Yes - Yes - Yes - No** | **Empty** | Mathematically impossible: A distribution cannot be independent of value, have a finite mean, *and* lack a hard cap. |
  | **Yes - No - Yes** | **Occupied** | Leads to Leaf 4. |
  | **Yes - No - No** | **Occupied** | Leads to Leaf 5. |
  | **No - Yes - [Any]** | **Occupied** | Leads to Leaf 6. |
  | **No - No - Yes - [Any]** | **Occupied** | Leads to Leaf 7. |
  | **No - No - No - No - [Any]** | **Empty** | Incoherent: If not symbolic, not reference-shifting, and not global sum, there is no error left to locate. |
  | **No - No - No - Yes - No** | **Occupied** | Leads to Leaf 8. |
  | **No - No - No - Yes - Yes** | **Occupied** | Leads to Leaf 9. |

  *(Note: Where a path terminates early, subsequent questions are irrelevant for that branch.)*

