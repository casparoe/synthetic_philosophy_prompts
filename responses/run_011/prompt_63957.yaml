  ### Part 2: The Decision Tree

  ```text
  START: The Naive Calculation (1.25A)
  │
  ├─ Q1: Does 'A' mean the same thing in both terms?
  │   │
  │   ├─ YES ── Q2: Is the 50/50 chance independent of A's value?
  │   │   │
  │   │   ├─ YES ── Q3: Can this exist with a finite total mean?
  │   │   │   │
  │   │   │   ├─ NO ── Q5: Does infinite mean break decision theory?
  │   │   │   │   ├─ YES ──────────────────────────────► LEAF 1
  │   │   │   │   └─ NO ───────────────────────────────► LEAF 2
  │   │   │   │
  │   │   │   └─ YES ── Q4: Is there a hard cap on amounts?
  │   │   │       ├─ YES ──────────────────────────────► LEAF 3
  │   │   │       └─ NO ───────────────────────────────► [EMPTY SET]
  │   │   │
  │   │   └─ NO ── Q6: Must you open the envelope to decide?
  │   │       ├─ YES ──────────────────────────────────► LEAF 4
  │   │       └─ NO ───────────────────────────────────► LEAF 5
  │   │
  │   └─ NO ── Q7: Is the error purely symbolic (one letter, two vars)?
  │       │
  │       ├─ YES ──────────────────────────────────────► LEAF 6
  │       │
  │       └─ NO ── Q8: Does 'A' shift reference between states?
  │           │
  │           ├─ NO ───────────────────────────────────► [EMPTY SET]
  │           │
  │           └─ YES ── Q9: Must you sum over all pairs to zero gain?
  │               │
  │               ├─ YES ──────────────────────────────► LEAF 7
  │               │
  │               └─ NO ── Q10: Is this a policy commitment issue?
  │                   │
  │                   ├─ NO ───────────────────────────► [EMPTY SET]
  │                   │
  │                   └─ YES ── Q11: Does policy need a random threshold?
  │                       ├─ YES ──────────────────────► LEAF 9
  │                       └─ NO ───────────────────────► LEAF 8
  ```

  ***

  ### Part 3: The Positions (Leaves)

  **Leaf 1: The "Divergent-Mean" View**
  *   **Awkward Commitment:** You must accept that standard decision theory is broken whenever the organiser's funding source has no finite average.
  *   **Worst Variant:** (e) The one where the organiser's amount comes from something with no finite average.
  *   **Forced to Say:** The calculation is mathematically valid but decision-theoretically useless; you cannot prefer swapping because the expectation does not exist.

  **Leaf 2: The "Infinite-Gain" View**
  *   **Awkward Commitment:** You must accept that a rational agent can be exploited for an infinite expected gain even if no finite amount of money is ever actually transferred.
  *   **Worst Variant:** (e) The one where the organiser's amount comes from something with no finite average.
  *   **Forced to Say:** You should always swap, even though the "gain" is an infinite expectation that can never be realised in a single lifetime.

  **Leaf 3: The "Finite-Cap" View**
  *   **Awkward Commitment:** You must admit the paradox only arises because students ignore the real-world constraint that no organisation has infinite money.
  *   **Worst Variant:** (a) The plain one (blind choice).
  *   **Forced to Say:** If there is a cap (like £10,000), the 50/50 assumption fails near the top end, so you should not swap if you suspect you are near the limit.

  **Leaf 4: The "Conditional-Odds" View**
  *   **Awkward Commitment:** You must claim that seeing the number changes the probability that the other envelope is double, even if the coin flip was fair.
  *   **Worst Variant:** (b) Same as plain, but you may open your envelope and see the number.
  *   **Forced to Say:** You should only swap if the number you see is low enough that the organiser is likely to have pairs above it; otherwise, stay.

  **Leaf 5: The "Blind-Symmetry" View**
  *   **Awkward Commitment:** You must argue that a mathematical calculation yielding 1.25A is overruled by a symmetry argument yielding 1.0A, without explaining exactly where the algebra failed.
  *   **Worst Variant:** (d) The lopsided organiser (she writes a number, then flips to double or half it).
  *   **Forced to Say:** In the lopsided case, symmetry is broken, so you are forced to admit you should swap there, creating an inconsistency with the blind case.

  **Leaf 6: The "Variable-Slip" View**
  *   **Awkward Commitment:** You must treat the paradox as a linguistic trick where the letter 'A' is illicitly doing double duty in the equation.
  *   **Worst Variant:** (f) The threshold policy (random number device).
  *   **Forced to Say:** The threshold strategy is also invalid because it relies on comparing your amount to a random number using the same slipped variable logic.

  **Leaf 7: The "Global-Balance" View**
  *   **Awkward Commitment:** You must insist that expected value cannot be calculated on a single pair but only on the sum of all possible pairs the organiser could have chosen.
  *   **Worst Variant:** (a) The plain one.
  *   **Forced to Say:** You cannot decide based on the envelope in your hand; you must consider the total pool of money the organiser brought to the seminar.

  **Leaf 8: The "Policy-Rule" View**
  *   **Awkward Commitment:** You must claim that rationality is about choosing a rule beforehand, not maximising gain in the specific instance in front of you.
  *   **Worst Variant:** (d) The lopsided organiser.
  *   **Forced to Say:** In the lopsided case, the pre-commitment "always swap" actually *does* yield a gain, so you must distinguish why the rule works there but not in the standard case.

  **Leaf 9: The "Random-Threshold" View**
  *   **Awkward Commitment:** You must accept that introducing your own private randomness can give you a strictly better than 50% chance of holding the larger amount, regardless of the organiser's method.
  *   **Worst Variant:** (c) Same as open, except you're told no envelope contains more than £10,000.
  *   **Forced to Say:** Even with a known cap, your random threshold might exceed the cap, forcing you to swap when you shouldn't, yet the strategy still claims a net advantage.

  ***

  ### Part 4: Honest Flag on Unseparated Leaves

  **The "Variable-Slip" View (Leaf 6) and the "Finite-Cap" View (Leaf 3)**

  These two positions are difficult to separate in variants (a) and (b). Both advise "Do not swap" in the blind case, and both advise "Look at the number" in the open case (Leaf 6 because seeing the number fixes the variable reference; Leaf 3 because seeing the number tells you if you are near the cap).

  *   **Why they overlap:** Both diagnoses conclude that the naive $1.25A$ calculation is invalid because the conditions for the 50/50 split cannot hold universally.
  *   **How to pry them apart:** You would need to press them on **Variant (d) (The Lopsided Organiser)**.
      *   The **Variable-Slip** view should allow the calculation in Variant (d), because in that specific setup, the first envelope *is* a fixed reference $X$ and the second is genuinely $2X$ or $X/2$ based on a coin flip. The variable does not slip.
      *   The **Finite-Cap** view must still reject the calculation in Variant (d) if the lopsided generation method implies an impossible prior distribution over the first number (e.g., if the organiser picks the first number from an infinite uniform distribution).
  *   **Limitation:** In a standard seminar hour, students often conflate "impossible prior" with "variable slip." If they treat the impossible prior as the *cause* of the variable slip, these leaves collapse into one. If your class merges them, acknowledge that one is an algebraic diagnosis and the other is a probabilistic diagnosis, even if their practical advice is identical.
