      *   Level 5 is the "Strong Metaphysical Claim."

  4.  **Drafting Task 2: The Hegel Connection**
      *   *Source:* Master-Slave Dialectic (Lordship and Bondage).
      *   *Standard Gloss:* Master wants recognition from Slave. But Master has reduced Slave to a thing. A thing cannot recognize. So Master gets empty recognition.
      *   *User's Line:* "You can't be recognised by someone you despise."
