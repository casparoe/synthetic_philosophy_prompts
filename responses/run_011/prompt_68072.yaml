      *   **Task 1:** Provide a "menu" of precise claims the sentence could make, ordered from weakest (platitude) to most radical (metaphysical). For each, assess truth value or offer a "near-miss."
      *   **Task 2:** Address the Hegel connection (Master-Slave Dialectic from *Phenomenology of Spirit*, 1807). Which readings does Hegel support? Which are smuggling? Specifically, does Hegel support the idea that recognition fails if the *recognizer* is despised (the Younger man's usage) vs. the *recognized* despising the recognizer (the standard gloss).
      *   **Task 3:** Analyze the line as a *speech act* (a move, not a truth claim). How to make readers land on this "strategic/moralizing" reading rather than a sincere philosophical one.

  2.  **Deconstruct the Sentence:** "You can't be recognised by someone you despise."
      *   *Grammar:* Passive voice ("be recognised"). Agent ("someone you despise"). Action ("recognise"). Subject ("You").
      *   *Ambiguity:* Who is doing the despising? "Someone you despise" implies *You* despise *Someone*. So, *You* are the despiser. *Someone* is the despised.
      *   *Wait, let's look closer:* "You can't be recognised by [someone you despise]."
          *   Subject: You.
          *   Action received: Recognition.
          *   Source of Action: Someone.
          *   Relationship: You despise Someone.
      *   *Meaning:* If I despise Person X, Person X cannot grant me valid recognition.
      *   *Alternative Parsing:* Could it mean "You can't be recognised by someone [who] you despise"? Yes, that's the standard reading.
      *   *Wait, is there another reading?* "You can't be recognised by someone [if] you despise [them]." (Same as above).
      *   *What if the despising is the other way around?* "You can't be recognised by someone [who despises you]." No, the text says "someone *you* despise."
      *   *Okay, sticking to the text:* The *recipient* of recognition holds the contempt for the *giver* of recognition.

  3.  **Drafting Task 1: The Menu of Claims (Weakest to Strongest)**
      *   *Level 1 (Psychological/Pragmatic):* It feels bad. You can't enjoy praise from someone you think is worthless. (Platitude about gratitude).
