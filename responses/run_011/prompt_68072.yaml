      *(Refining the "Move")*: Emphasize that if it's a move, the *truth* of the statement doesn't matter, only its *effect*.

  7.  **Final Polish:** Check the voice. Keep it sharp, literary, slightly analytical. (The user writes well, so match that register).

      *Wait, one nuance on the Hegel bit:* The user asks: "Can recognition fail in the other direction too, where the despised one is disqualified as a source?"
      In Hegel, the Master despises the Slave. The Slave is the source. The recognition fails. This *is* the direction in the sentence ("someone you despise").
      The user asks if Hegel supports the idea that the *despised one* is disqualified. Yes, because the despisers' attitude reduces them to a thing.
