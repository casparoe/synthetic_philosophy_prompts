      *   *Level 4 (Constitutive):* Recognition isn't just an opinion; it's a status grant. If you don't value the granter, the status isn't conferred. (Stronger).
      *   *Level 5 (Metaphysical/Ontological):* The self is constituted by the other. If the other is "nothing" to you (despised), they cannot affirm your "something." (Radical).

      *Refining the Truth/Near-Miss:*
      *   Level 1 is true but trivial.
