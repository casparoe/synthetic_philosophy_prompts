answer: |-
  At tick zero the coordinate plane is set,
  A ledger of states where the bits are all met.
  Cell four-two is dark, cell four-three is lit,
  No shape implied within the binary pit.
  Here is the data, exhaustive and stark,
  A full inventory of light and of dark.
  If five are alive in this field of the square,
  Then list all coordinates with exhaustive care.
  No shape emerges from the sum of the parts,
  Just switches and logic and cold restarts.
  Truth is confined to the present arrangement,
  A causal chain requiring no abatement.
  You could trace every signal through every gate,
  But the labor of logging is hard to negate.

  Yet treat it as engine, and suddenly less
  Is needed to tell where the thing will progress.
  Four generations to shift by one step,
  A periodic and diagonal leap.
  It persists in its path unless stopped by a block,
  No maker required to wind up the clock.
  Just rely on the rhythm that keeps it on track.

  It thinks the way ahead is open space,
  It wants to reach the corner of the place,
  It acts on beliefs no cell can trace.

      We choose the description by interests we view,
      But the pattern is real if the saving holds true.
