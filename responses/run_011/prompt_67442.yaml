  I should say at the outset that I have no academic background in any of this. I manage a building-supplies yard, and the only reason I know the word "microdomain" is that a few years ago I picked up a popular book about the Copycat program — the one Hofstadter's group built to solve letter-string analogies — and I have been working through those puzzles on scrap paper ever since, usually with my sister, who is considerably less patient than I am. The game as I understand it: you are told that abc → abd, and then you are handed some other string and asked how it goes. What stuck with me from the book was not the answers but the machinery behind them — that a description of the change can slip to a neighboring concept when it fails to apply (successor slipping to predecessor, letter slipping to run of letters), that several descriptions of the same string are alive at once and compete rather than being consulted in a fixed order, and that the designers kept insisting the right answer is the one that falls out of the most coherent perception of the string rather than the one produced by the first rule you happen to think of.

  I have now accumulated a list of my own verdicts, arrived at independently, and I want to know what principle, if any, they add up to. Holding abc → abd fixed as the given: (1) ijk → ijl — right, and obviously right, nothing else is in the running. (2) aabbcc → aabbcd — right; its rival aabbdd is perfectly describable, since you can advance the rightmost run of identical letters instead of the rightmost letter, but I reject it, because it alters two letters where one would have done. (3) abcabcabc → abcabcabd, for the same reason; abdabdabd alters three. (4) xyz → xyy — acceptable, and I think best; the slip from successor to predecessor is forced here and feels like a short step, whereas wrapping around to the front of the alphabet, xyz → xya, feels like a long step and I reject it, because the alphabet is a line and not a ring. (5) zzz → zzy — not acceptable; here I want to say the puzzle simply has no answer, or that every answer is arbitrary. I cannot defend this. Structurally it is the identical move to (4): rightmost letter, no successor, slip to predecessor. Yet (4) feels compelled and (5) feels like cheating. (6) cba → dba — this is what I would write, the c turns into a d wherever it happens to be sitting; but cba → cbb, advancing the rightmost letter, is just as describable, alters the same number of letters, and requires no slip at all, so I cannot claim my answer slips less, and I honestly do not know what I am claiming. (7) mrrjjj → mrrkkk — I prefer this to mrrjjk even though it alters three letters instead of one, which flatly contradicts (2), where I preferred the one-letter change over the two-letter one. The only thing I can offer in my own defense is that the runs in mrrjjj are one, two and three letters long, which looks like a pattern in its own right, whereas aabbcc is two-two-two, which looks like nothing at all. (8) Two I have not made up my mind about: aabbccc, which I cannot decide is more like aabbcc or more like mrrjjj; and a variant in