  This is a remarkable set of intuitions. You have done exactly what Hofstadter hoped people would do: you have ignored the "correct" answers to listen to the friction in your own mind. The inconsistencies you feel (particularly between verdicts 2 and 7, and 4 and 5) are not errors; they are data points. They reveal that your mind is not running a single rule, but weighing competing pressures.

  As someone who has spent time modeling these systems, I will tell you that your intuitions are more psychologically realistic than the standard Copycat outputs. The program often smooths over the very squeamishness you are feeling.

