  ### Part 2: The Principle of Differentiated Correspondence

  Here is your principle, stated precisely enough to be applied to a new string. It consists of four sequential clauses.

  **Clause 1: Object-First Mapping (Forces Verdict 6)**
  Identify the letter that changed in the source pair ($abc \to abd$ means **C** becomes **D**).
  *   Search the target string for that specific letter (**C**).
  *   **If found:** The change applies to the **C**. (This explains why $cba \to dba$ beats $cba \to cbb$. You are changing the 'c', not the rightmost slot).
  *   **If not found:** The change applies to the **Rightmost Letter** (positional default). (This explains $ijk \to ijl$).

  **Clause 2: Linear Physics (Forces Verdict 4)**
  The alphabet is a line with a wall at the end, not a circle.
  *   If the required change is "Successor" (+1) and the letter is **Z**, the operation slips to **Predecessor** (-1).
  *   **Never** wrap around to **A**. (This explains $xyz \to xyy$).

  **Clause 3: Salience Override (Forces Verdict 7 over 2)**
  Determine the "Scope of Change" (Single Instance vs. Whole Group).
  *   **Default:** Change only one instance of the target letter (Conservation of Ink). This explains (2) $aabbcc \to aabbcd$.
  *   **Override:** If the runs of letters form a **Progressive Pattern** (e.g., lengths 1, 2, 3 or 2, 4, 6), change the **Whole Group**.
