  ### Part 1: Brainstorming Candidate Principles

  Before settling on the one that fits *you*, we need to see why the obvious ones fail.

  **1. The "Least Ink" Principle (Crude)**
  *   **Rule:** Always alter the fewest number of characters possible.
  *   **Fits:** (1) $ijk \to ijl$, (2) $aabbcc \to aabbcd$, (3) $abcabc... \to ...abd$.
  *   **Misses:** (7) $mrrjjj \to mrrkkk$. You explicitly accepted a 3-letter change over a 1-letter change here.
  *   **Diagnosis:** Too mechanical. It ignores meaning.

  **2. The "Positional Mirror" Principle**
  *   **Rule:** Apply the change to the same *position* as the source (e.g., if the 3rd letter changed in $abc$, change the 3rd letter in the target).
  *   **Fits:** (1), (2), (3).
  *   **Misses:** (6) $cba \to dba$. You changed the 'c' (1st letter), not the 'a' (3rd letter). You prioritized the *identity* of the letter over its *seat*.
  *   **Diagnosis:** Too rigid. It misses your ability to recognize "the C" regardless of where it sits.

  **3. The "Structural Resonance" Principle (Baroque)**
  *   **Rule:** The string is a musical phrase. If the phrase has a rhythm (like 1-2-3), the change must be a chord (change all notes in the run). If the phrase is flat (2-2-2), the change is a single note. Boundary violations ($z$) force a key change (slip to $y$) unless the whole song is one note ($zzz$), in which case the music stops.
  *   **Fits:** All verdicts, including the tricky (2) vs (7) and (4) vs (5).
  *   **Misses:** It is poetic but hard to calculate. What counts as a rhythm?
  *   **Diagnosis:** Captures the *feel*, but needs to be translated into a procedure you can actually use.

  **4. The "Conservative Mapping" Principle**
  *   **Rule:** Map the object that changed in the source ('c') to the target. If that object doesn't exist, map the position. Change only that instance. Never wrap the alphabet.
  *   **Fits:** (1), (2), (4), (6).
  *   **Misses:** (7) (doesn't explain group change), (5) (doesn't explain why $zzz$ is rejected while $xyz$ is accepted).
  *   **Diagnosis:** Good baseline, lacks the "override" switch for patterns.

  **5. The "Differentiated Correspondence" Principle (Your Intuition)**
  *   **Rule:** Find the specific object or role that changed. Change the minimal amount necessary to satisfy that role, *unless* the string's internal pattern demands a group change. If the change hits a wall ($z$), step back ($y$), unless the string is undifferentiated ($zzz$), in which case the move is void.
  *   **Fits:** All verdicts.
  *   **Diagnosis:** This is the winner. It balances conservation with pattern recognition.

