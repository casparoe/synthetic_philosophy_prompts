      *   *Class Size:* 14 students. This allows for 2 groups of 7 or 3 groups (4, 5, 5). 2 groups of 7 might be better for deep deliberation, but 3 groups allows for more variation. Let's aim for 2 large groups or 3 smaller ones. Given the "swap" mechanic, 2 groups of 7 is logistically simpler for the instructor to manage, but 3 groups (4, 5, 5) creates more noise/data. Let's go with 2 groups of 7 for intensity, or perhaps 3 groups to allow for a "control" or just more data points. Actually, the prompt asks for a "second round that swaps the analogies." If everyone swaps, the dynamic changes.
