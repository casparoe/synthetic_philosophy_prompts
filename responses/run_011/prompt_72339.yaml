      *   Scoring: Closest to the "True Outcome" gets public recognition.

  11. **Refining the Failure Analysis:**
      *   *Gaming:* Students know it's a class. They will try to find the "right" answer.
      *   *Recognition:* "This is clearly Munich."
      *   *Missing Element:* The *political cost* of choosing an analogy. In real life, you choose Munich because it gets you funding, not because it's accurate.

