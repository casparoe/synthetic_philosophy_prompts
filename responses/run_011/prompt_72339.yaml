      *   No money. Use "Prestige Points" or "Class Credit" (if allowed) or just bragging rights. Let's use a "Historical Accuracy Ledger." The instructor reveals the "actual outcome" (which must be predetermined for the sake of the exercise) at the end. Closest prediction wins "The Secretary's Medal."

