answer: |-
  # Exercise Design: The Meridian Strait Crisis

  **Course:** International Security (Upper-Level Undergraduate)
  **Time:** 90 Minutes
  **Class Size:** 14 Students
  **Instructor Role:** Facilitator / "Secretary-General" (Minimal lecturing)

  ## I. The Materials

  ### 1. The Crisis Brief (1 Page, Distributed to All)
  **Subject:** URGENT: Mobilization in the Meridian Strait
  **To:** National Security Council
  **From:** Intelligence Directorate
  **Date:** 14 October 2024

  **Situation:**
  The **Republic of Vesta** (our ally, established naval power) maintains a base on **Port Meridian**, a semi-autonomous city-state controlling the only deep-water channel in the region. For 50 years, Vesta has guaranteed Meridian's neutrality.

  The **Union of Krasnovia** (rising regional hegemon, nuclear-armed) claims Meridian is historically part of its ethnic homeland. Krasnovia's GDP has surpassed Vesta's. Its navy has doubled in size over the last decade.

  **Trigger Event:**
  Yesterday, Krasnovian "maritime militia" vessels blockaded Meridian's harbor, citing "customs inspections." Vesta's Prime Minister has invoked the mutual defense treaty, requesting our immediate naval deployment to break the blockade. Krasnovia warns that any foreign warship entering the Strait will be treated as an act of war.

  **Key Ambiguities:**
  1.  **Intent:** Is Krasnovia testing our resolve to seize Meridian permanently, or bargaining for economic concessions?
  2.  **Capacity:** Vesta's military is aging; their request for help may be a trap to drag us into a proxy war they cannot win themselves.
  3.  **Domestic:** Krasnovia is facing internal economic unrest; external conflict may be a diversion.
  4.  **Geography:** The Strait is narrow; naval engagement risks immediate escalation to tactical nuclear use.

  ### 2. The Role Cards (14 Total, Permanent)
  *Print on heavy cardstock. Students keep these for both rounds.*
  *   **3x Minister of Defense:** Priority: Alliance credibility, military readiness.
  *   **3x Minister of Foreign Affairs:** Priority: Diplomatic off-ramps, long-term stability.
  *   **3x Director of Intelligence:** Priority: Uncertainty reduction, risk assessment.
  *   **3x Minister of Economy:** Priority: Sanctions impact, trade route security.
  *   **2x Chief of Staff to the President:** Priority: Political feasibility, public opinion.

  ### 3. The Analogy Memos (Round 1 & Round 2)
  *Print on distinct colored paper (e.g., White for Round 1, Blue for Round 2). These are the independent variables.*
  *There are 4 Analogy Types. Distribute them randomly so no student knows who has which.*

  *   **Memo A (The Munich Frame):** "Historical review suggests aggressors interpret hesitation as invitation. In 1938, concessions led to wider war. Early, decisive force prevents escalation."
  *   **Memo B (The Vietnam Frame):** "Historical review suggests local conflicts absorb great powers. In 1965, tactical victories led to strategic quagmire. Local actors lack will to fight for themselves."
  *   **Memo C (The Suez Frame):** "Historical review suggests established powers overestimate their decline. In 1956, intervention exposed imperial overreach and accelerated loss of status. Restraint preserves long-term influence."
  *   **Memo D (The Thucydides Frame):** "Historical review suggests structural shifts make war inevitable. In 431 BC, rising powers challenge established orders regardless of specific incidents. Focus on survival, not justice."

  *(Note: In Round 2, students swap Memos, not Roles.)*

  ### 4. The Sealed Prediction Sheet (1 Per Student)
  *To be folded and sealed in an envelope before Round 2 begins.*
  *   **Primary Recommendation:** (Intervene / Sanction / Negotiate / Withdraw)
  *   **The Central Issue Is:** (e.g., Credibility vs. Territory vs. Economics)
  *   **If We Act, The Principal Danger Is:** ________________
  *   **If We Do Not Act, The Principal Danger Is:** ________________
  *   **Predicted Outcome (6 Months):** ________________

  ---

  ## II. The Timeline (90 Minutes)

  ### 0:00 – 0:10: Setup & Briefing
  *   Hand out **Crisis Brief** and **Role Cards**.
  *   Hand out **Round 1 Analogy Memos** (White).
  *   **Instruction:** "You are the NSC. You have 25 minutes to reach a consensus recommendation. However, before you debate, read your Memo privately. Do not show it to others. Use it to inform your analysis of the facts. You must also submit a sealed Prediction Sheet individually before the consensus is finalized."

  ### 0:10 – 0:35: Round 1 Deliberation
  *   Students debate. The Instructor circulates but does not intervene unless the group is deadlocked.
  *   **Constraint:** They must submit the **Consensus Recommendation** (one per group, or individual if you prefer, but consensus forces negotiation) and the **Sealed Prediction Sheets**.
  *   *Logistics:* Collect Prediction Sheets in a box. They must not be opened.

  ### 0:35 – 0:40: The Swap
  *   **Instruction:** "The President is reconsidering the historical context. Please pass your Analogy Memo to the person on your right. Keep your Role Card. Keep the Crisis Brief."
  *   *Note:* This ensures everyone gets a new lens (mostly) while keeping their bureaucratic incentives fixed.
  *   **Instruction:** "You have 15 minutes. You do not need a new consensus. You must individually write a **Revised Recommendation** on a fresh slip of paper. Note if and why your advice changed based on the new information."

  ### 0:40 – 0:55: Round 2 Deliberation
  *   Students process the new Memo.
  *   Because the Role is fixed but the Analogy changed, the Defense Minister who had "Munich" (Intervene) might now have "Suez" (Restraint).
  *   They discuss the friction between their Role and their new Analogy.

  ### 0:55 – 1:30: Debrief & Scoring
  *   **Step 1: The Reveal (10 mins).** Ask for a show of hands: Who changed their recommendation? Who kept it the same despite the analogy swap?
  *   **Step 2: The Scoring (5 mins).** The Instructor reveals the **"True Outcome"** (see below). Students open their sealed predictions.
      *   *Scoring:* No money. The student(s) whose prediction most closely matches the "True Outcome" receive "The Secretary's Medal" (public recognition + small privilege, e.g., choosing the topic for the next week's reading).
  *   **Step 3: Diagnostic Mapping (20 mins).**
      *   Ask: "When did your Memo feel like *analysis*? When did it feel like *ammunition*?"
      *   Map the four analogies to the class's recommendations.
      *   **Key Question:** "Did the Defense Ministers all agree in Round 1? Or did the Defense Minister with the 'Vietnam' memo disagree with the Defense Minister with the 'Munich' memo?" (This reveals that the analogy often trumps the bureaucratic role).
      *   **Key Question:** "In Round 2, did the facts change? No. Did the risk change? No. Why did the recommendation change?"

  ---

  ## III. The "True Outcome" (For Instructor Eyes Only)
  *To be revealed at the end. It should be ambiguous enough that no analogy was perfectly "right," punishing dogmatism.*

  **Actual History:**
  We intervened naval forces. Krasnovia withdrew the militia but mined the harbor. Trade halted for 4 months. Vesta's government collapsed due to economic shock, replaced by a Krasnovia-friendly regime. We maintained "credibility" but lost the base access we sought to protect.
  *   **Munich:** Wrong (Force didn't stop aggression, just changed its form).
  *   **Vietnam:** Partially Right (Quagmire, but short duration).
  *   **Suez:** Right (Overreach exposed limits, accelerated loss of status).
  *   **Thucydides:** Right (Structural shift happened regardless of tactics).
  *   **Winning Prediction:** The student who predicted "Short-term tactical success, long-term strategic loss" or "Loss of base access."

  ---

  ## IV. Predictable Failure Modes (Candid Assessment)

  **1. The "Guess the Teacher" Problem**
  *   **What happens:** Upper-level students are trained to find the "right" answer. They will suspect the exercise is rigged to prove analogies are bad. They may intentionally switch recommendations in Round 2 to signal they understand the lesson, rather than because they genuinely changed their minds.
  *   **Mitigation:** Emphasize that the "True Outcome" is fixed and unknown. Reward accuracy, not "correct" theoretical posture. If they game the swap, they will likely miss the prediction score.

  **2. The Analogy Spotter**
  *   **What happens:** One student will loudly say, "This is just the Munich analogy," in the first 5 minutes. This collapses the frame.
  *   **Mitigation:** In the instructions, explicitly forbid naming the historical event. "Refer to the *logic* of the memo, not the historical label." If they break this, ask them: "Does naming it change the strategic calculus? If so, why?"

  **3. Groupthink / Dominant Personalities**
  *   **What happens:** In a 7-person group, two loud students dominate. The "Swap" in Round 2 might be ignored if the group leader anchors the first recommendation.
  *   **Mitigation:** The **Sealed Prediction Sheet** is the failsafe. It forces individual accountability before the group consensus solidifies. Focus the debrief on the *individual* prediction sheets, not just the group consensus.

  **4. The "Role" vs. "Analogy" Confusion**
  *   **What happens:** Students will conflate their Bureaucratic Role (Defense Minister) with their Analogy (Munich). They will assume Defense *should* be Munich.
  *   **Mitigation:** This is actually a feature, not a bug. The debrief should highlight this. "Why did the Defense Minister with the Vietnam memo feel cognitively dissonant?" This reproduces the real-world friction where bureaucratic interests seek specific historical frames to justify budgets.

  ---

  ## V. What This Exercise Cannot Reproduce (Instructor Supply Required)

  **1. The Cost of Selection**
  *   **Limitation:** In the exercise, the analogy is *assigned*. In reality, the crucial political act is **choosing** which analogy to bring into the room. A hawk fires a staffer who writes a "Vietnam" memo and hires one who writes a "Munich" memo.
  *   **Instructor Supply:** You must explicitly lecture on this in the final 10 minutes. "Today, I gave you the lens. In the White House, the struggle is over who gets to hold the projector. The winner of the analogy war is often decided before the crisis begins, during personnel selection."

  **2. The Absence of Audience Costs**
  *   **Limitation:** Students suffer no reputational damage for being wrong. In reality, leaders stick to failing analogies (e.g., "We must stay in Vietnam") because admitting the analogy was wrong costs them the next election.
  *   **Instructor Supply:** During the debrief, ask: "If you were up for re-election next month, would you have admitted your Round 1 recommendation was flawed in Round 2?" Use this to introduce the concept of *audience costs* and *sunk cost fallacy* in analogical reasoning.

  **3. Emotional Resonance**
  *   **Limitation:** "Munich" works in reality because it carries moral horror, not just strategic logic. A piece of paper cannot replicate the visceral fear of appeasement.
  *   **Instructor Supply:** You must narrate the emotional weight. "When the Defense Minister reads the Munich memo, they shouldn't just think '1938'. They should feel the shame of cowardice. That emotional weight is what makes the analogy sticky, not its analytical precision."

  ## VI. Scoring Mechanism (No Money)
  **The Oracle Ledger:**
  Create a simple spreadsheet projected on the screen during the debrief.
  *   **Column A:** Student Name.
  *   **Column B:** Round 1 Recommendation.
  *   **Column C:** Round 2 Recommendation.
  *   **Column D:** Prediction Accuracy (0-5 scale, graded by you live based on the "True Outcome").
  *   **Reward:** The top scorer gets to select the "Case Study" for one future discussion section (from a pre-approved list you provide). This gives them agency, which PhD students know undergraduates value highly.

  ---

  ### Final Note to the Instructor
  You are not testing their knowledge of Munich or Vietnam. You are testing their **metacognitive awareness** of how they process information. If they leave the room arguing about whether Krasnovia was *actually* like Hitler, the exercise failed. If they leave arguing about why they felt compelled to *use* Hitler to understand Krasnovia, the exercise succeeded. Monitor the debrief closely for this distinction.
