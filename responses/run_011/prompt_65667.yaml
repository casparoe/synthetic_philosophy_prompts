answer: |-
  # Diagnostic Protocol for Expert Estimate Divergence

  ## I. Theoretical Grounding for Staff Analysts

  **The Common Prior Assumption (CPA)**
  In interactive epistemology, the "Common Prior Assumption" posits that rational agents start with the same probability distribution over the world before receiving private information. Aumann's "Agreeing to Disagree" result states that if agents share a common prior, they cannot have *common knowledge* of differing posterior probabilities. If they know each other's numbers and reasoning, they must converge.

  **Is the CPA true?**
  No. Real experts are not built with a common prior. They have different training, different mental models, and different incentives. However, the CPA is not merely a modeling convenience; it is a *test*. If you force the information sets to match and the definitions to match, and they *still* disagree, you have isolated the divergence to either (1) model structure (how data is processed) or (2) substantive prior differences (how risk is weighted).

  **The Trap of "Difference in Priors"**
  You are correct that "it's a difference in priors" is often an empty residual category. If Expert A uses 50 years of data and Expert B uses 100 years, that is not a prior difference; it is an information difference. A substantive prior difference exists only when two agents look at the *same* data, ask the *same* question, use the *same* model structure, and still assign different probabilities because they weigh evidence differently (e.g., one assumes physical systems are more fragile than the other). This procedure is designed to strip away the information and definitional differences so that any remaining gap is genuinely structural or normative.

  **Dynamic Updating and Pooling**
  If experts merely exchange posteriors (numbers) without reasoning, they may not converge. If they exchange *reasoning* (likelihood functions), they often do. Linear opinion pooling (taking a weighted average) is only appropriate when the disagreement arises from independent information signals processed through a shared model. It is **never** appropriate when the disagreement is about model structure or normative thresholds.

  ---

  ## II. The Diagnostic Procedure (40-Hour Protocol)

  **Objective:** Classify the disagreement before the technical conference.
  **Personnel:** Two Staff Analysts.
  **Inputs:** Expert Testimonies, Data References, Direct/Rebuttal Filings.

  ### Phase 1: Definition Alignment (Hours 1–10)
  *Goal: Determine if $Question_A = Question_B$.*

  **Q1.1: Are the target variables identical?**
  *   *Ask Experts:* "Define the numerator and denominator of your probability estimate. What specific physical event constitutes 'failure'?"
  *   *Sufficient Answer:* Mathematical definitions match exactly (e.g., "Flow > 50,000 cfs" vs. "Flow > 48,000 cfs").
  *   *Branch:* If definitions differ, classify as **No Disagreement (Different Quantities)**. Terminate.

  **Q1.2: Are the conditioning information sets identical?**
  *   *Ask Experts:* "List the specific data ranges, start/end years, and operational assumptions (e.g., upstream dams built/unbuilt) conditioned upon in this estimate."
  *   *Sufficient Answer:* A table of data sources and operational states.
  *   *Branch:* If data ranges or operational states differ significantly, classify as **Disagreement Over Evidence (Poolable)**. Proceed to Phase 2 only if analysts can normalize the data. If normalization is impossible (e.g., one assumes a law of physics the other denies), proceed to Phase 3.

  **Q1.3: Are the normative thresholds identical?**
  *   *Ask Experts:* "Does your estimate include a judgment on whether the risk is 'acceptable' or 'adequate'?"
  *   *Sufficient Answer:* A separation of the probability estimate ($P$) from the adequacy conclusion ($P < Threshold$).
  *   *Branch:* If probabilities match but conclusions differ, classify as **Disagreement Over Standard/Threshold**. Terminate and refer to Commissioners.

  ### Phase 2: Information Equalization (Hours 11–25)
  *Goal: Induce a 'Common Prior' environment by sharing data.*

  **Q2.1: Can the estimates be recalculated on a shared dataset?**
  *   *Action:* Staff provides both experts with a "Unified Data Package" (the union of both datasets, or the commission's preferred dataset).
  *   *Ask Experts:* "Recalculate your estimate using only the Unified Data Package. Keep your model structure."
  *   *Sufficient Answer:* New posterior probabilities.
  *   *Branch:* If estimates converge (within 5%), the disagreement was **Evidence-Based**. Issue finding based on converged number. If they remain apart, proceed to Phase 3.

  **Q2.2: Is the divergence due to private, non-record evidence?**
  *   *Ask Experts:* "Does your model rely on parameters derived from experience not in the record (e.g., 'operator response time based on 2003 blackout observation')?"
  *   *Sufficient Answer:* Explicit citation of the private evidence or admission that it is a structural assumption.
  *   *Branch:* If one expert holds private evidence, that evidence must be entered into the record or discarded. If discarded, recalculate. If retained, note as **Asymmetric Information**.

  ### Phase 3: Structural and Strategic Analysis (Hours 26–40)
  *Goal: Identify model structure vs. advocacy bias.*

  **Q3.1: Do the model structures differ?**
  *   *Ask Experts:* "Is your model deterministic (screening) or probabilistic (simulation)? How do you handle tail risk?"
  *   *Sufficient Answer:* Description of the algorithmic engine.
  *   *Branch:* If structures differ (e.g., one uses Monte Carlo, one uses worst-case bounding), classify as **Disagreement Over Model Structure**. Refer to Commissioners.

  **Q3.2: Is the disagreement strategic?**
  *   *Ask Experts:* "If the Commission adopted the opposing party's data but kept your model, would your number change? If the Commission changed your client, would your number change?"
  *   *Sufficient Answer:* Sensitivity analysis showing stability or volatility of the estimate relative to advocacy position.
  *   *Branch:* If the number shifts significantly based on who retains the expert (based on past record) or if the expert refuses to normalize data, flag as **Potential Strategic Disagreement**.

  ### Phase 4: Final Classification
  *   **Category A: No Disagreement.** (Definitions or Conditioning differed). *Action:* Dissolve the "uncertainty" finding. Commission must choose the conditioning scenario (policy), not the science.
  *   **Category B: Evidence Disagreement.** (Data differed). *Action:* Pool the data or choose the superior dataset. Recompute.
  *   **Category C: Model Structure Disagreement.** (Math differed). *Action:* Refer to Commissioners. This is a choice of risk methodology.
  *   **Category D: Standard/Threshold Disagreement.** (Policy differed). *Action:* Refer to Commissioners. This is a policy choice.
  *   **Category E: Strategic/Residual.** (Incentives or unresolvable priors). *Action:* Refer to Commissioners with a warning that the numbers are not comparable.

  ---

  ## III. Analyst Intake Form (One Page)

  **Case ID:** _______________ **Date:** _______________
  **Experts:** A (Utility) _______________ B (Intervenor) _______________
  **Subject:** _______________

  **1. DEFINITION CHECK**
  [ ] Do both experts define the event $X$ identically? (Y/N)
  [ ] Do both experts condition on the same time period/operations? (Y/N)
  *If No to either, Classification: **No Disagreement (Different Questions)**. Stop.*

  **2. INFORMATION CHECK**
  [ ] Were experts asked to recalculate on a Unified Data Package? (Y/N)
  [ ] Did estimates converge after recalculation? (Y/N)
  *If Yes to convergence, Classification: **Evidence Disagreement (Resolved)**.*

  **3. STRUCTURE CHECK**
  [ ] Do the models use the same mathematical approach (e.g., both probabilistic)? (Y/N)
  [ ] Does one expert rely on private, non-record experience? (Y/N)
  *If No to same approach, Classification: **Model Structure Disagreement**.*

  **4. NORMATIVE CHECK**
  [ ] Do the probability estimates differ, or only the "adequacy" conclusion? (Estimates / Conclusion)
  *If Conclusion only, Classification: **Standard/Threshold Disagreement**.*

  **5. FINAL DETERMINATION**
  [ ] **Dissolution:** No scientific uncertainty exists; definitions differ.
  [ ] **Fact Finding:** Disagreement resolved via data pooling.
  [ ] **Policy Referral:** Disagreement is structural or normative. Commissioners must choose the risk framework.

  **Analyst Notes on Judgment Calls:**
  *(Identify where you had to decide if a difference was "material" or if a model was "equivalent")*
  __________________________________________________________________________________
  __________________________________________________________________________________

  **Sign-off:** ___________________ (Lead Analyst)

  ---

  ## IV. Note to Commissioners: On Averaging and Judgment

  **TO:** The Commission
  **FROM:** Technical Panel Director
  **SUBJECT:** Why We Cannot Simply "Split the Difference"

  When two experts file different numbers (e.g., 0.01 vs 0.05), it is tempting to adopt the midpoint (0.03) as a compromise. **Do not do this.**

  **1. The Midpoint Fallacy**
  A midpoint is only valid if both experts are measuring the *same thing* with *different noise*. If Expert A is measuring "Risk with Dam" and Expert B is measuring "Risk without Dam," the midpoint is a physical impossibility. It is like averaging the price of an apple and the price of an orange to find the cost of fruit. Our diagnostic procedure determines if they are measuring the same thing. If the procedure says "No Disagreement" (because definitions differed), a midpoint is nonsense.

  **2. When Pooling Is Appropriate**
  You may average (pool) estimates *only* if the Technical Panel classifies the issue as **Evidence Disagreement**. This means both experts agree on the physics and the math, but had access to different data. In this case, their errors are likely independent, and averaging reduces noise.

  **3. When You Are Choosing, Not Deferring**
  If the Panel classifies the issue as **Model Structure** or **Standard/Threshold**, there is no "true number" to find.
  *   **Model Structure:** One expert assumes the grid is fragile; the other assumes it is robust. Choosing between them is not finding a fact; it is choosing a *safety margin*.
  *   **Standard/Threshold:** Both agree the risk is 1%, but one says that's safe and the other says it's not. This is a policy choice, not a scientific one.

  **4. Your Task**
  When the Technical Panel refers a matter to you, they are telling you: "The science has run out. The remaining gap is a value judgment." You are not resolving a scientific uncertainty; you are setting a regulatory standard. Acknowledge this in the Order. Do not write "the record reflects uncertainty." Write "the Commission adopts the more conservative risk model."

  ---

  ## V. Application to Filed Cases

  ### Case 1: Hydrology (Spillway Capacity)
  *   **Inputs:** Utility (0.011, 1978–2020, future dam) vs. Intervenor (0.046, 1931–2020, current ops).
  *   **Procedure Run:**
      *   *Phase 1 (Definition):* Analysts check conditioning information (Q1.2).
      *   *Finding:* Utility conditions on $Operations_{future}$ (dam built). Intervenor conditions on $Operations_{present}$ (dam unbuilt). Time horizons differ (42 yrs vs 89 yrs).
      *   *Phase 2 (Equalization):* Analysts ask: "Can we recalculate both on the 1931–2020 record with current ops?"
      *   *Result:* Yes. The divergence is entirely explained by the input assumptions, not the hydrologic method.
  *   **Classification:** **No Disagreement (Different Questions).**
  *   **Outcome:** The Hearing Officer's draft finding of "residual scientific uncertainty" **cannot stand**. There is no scientific uncertainty regarding the probability *given* a specific state of the world. The disagreement is about *which* state of the world to plan for (policy).
  *   **Action:** Dissolve the scientific conflict. Refer to Commissioners solely to decide: "Do we regulate based on current ops or permitted future ops?" Do not cite expert disagreement as justification for the spillway size.

  ### Case 2: Grid Reliability (Cascading Outage)
  *   **Inputs:** Planner (0.004) vs. Lab (0.03). Same data, same scenario. Independent experts.
  *   **Procedure Run:**
      *   *Phase 1:* Definitions match.
      *   *Phase 2:* Information exchanged. Posteriors shared in writing. Gap remains (0.004 vs 0.03).
      *   *Phase 3 (Structure):* Analysts probe Q3.1. Planner uses deterministic screening (N-1 standards). Lab uses probabilistic simulation (Monte Carlo).
      *   *Phase 3 (Private Evidence):* Analysts probe Q2.2. Planner cites "control room experience" for operator response times (implicit prior on human reliability). Lab uses literature distributions.
      *   *Finding:* The gap is **Model Structure** and **Asymmetric Information** (tacit knowledge). The Planner's model structurally excludes low-probability/high-impact tails that the Lab's model captures.
  *   **Classification:** **Disagreement Over Model Structure.**
  *   **Outcome:** The procedure stops honestly. There is no data that discriminates between "deterministic screening" and "probabilistic simulation" because they answer different counterfactuals.
  *   **Action:** Refer to Commissioners. The referral document must state: "The record contains two valid but incompatible risk frameworks. Choosing between them determines the system's risk tolerance. This is a judgment call." The Commission must explicitly adopt one framework, acknowledging it is a policy choice, not a fact finding.

  ### Case 3: Air Quality (Fenceline Control)
  *   **Inputs:** Expert A and Expert B agree on concentration distribution ($C$). Expert A says "Adequate." Expert B says "Inadequate."
  *   **Procedure Run:**
      *   *Phase 1 (Normative):* Analysts probe Q1.3 immediately.
      *   *Finding:* $P(C > Threshold)$ is agreed upon. The disagreement is on the value of the *Threshold*.
      *   *Classification:* **Disagreement Over Standard/Threshold.**
  *   **Outcome:** Caught in Phase 1 (Hours 1–10). No need for data reconciliation.
  *   **Action:** Hand to Commissioners immediately. The referral says: "The science is settled. The disagreement is regulatory. The Commission must define 'adequate'."

  ---

  ## VI. Limitations and Judgment Calls

  **Where the Procedure Relies on Analyst Judgment**
  1.  **Materiality of Definition:** In Case 1, analysts must decide if "1978–2020" vs "1931–2020" is a material difference in *question* or just a difference in *evidence*. I have instructed them to treat operational assumptions (dam built vs. unbuilt) as definitional differences. This is a judgment call.
  2.  **Private Evidence:** In Case 2, distinguishing between "tacit knowledge" (valid private evidence) and "structural assumption" (model choice) is difficult. The analyst must decide if the control room experience is data (which should be logged) or a prior (which is a bias).
  3.  **Sincerity:** The procedure cannot detect bad faith. If an expert lies about their model structure, the analysts will classify it as "Model Structure" rather than "Strategic." The procedure assumes experts are rational agents, not adversarial obfuscators.

  **What This Procedure Cannot Do**
  1.  **It cannot tell you who is right.** It only tells you *why* they differ.
  2.  **It cannot manufacture a single number.** If the disagreement is structural, a single number is a lie.
  3.  **It cannot infer irrationality.** Under Aumann, disagreement implies lack of common knowledge or common priors. It does not imply one agent is irrational. Do not write in your orders that one expert was "unreasonable." Write that their information sets or models differed.
  4.  **It cannot resolve Value Conflicts.** If the disagreement is truly about how much risk is acceptable (a prior on utility), the Commission must vote. The procedure's job is to ensure you know you are voting on values, not pretending to vote on facts.

  **Final Instruction to Staff:**
  If the procedure terminates in **Dissolution** (Case 1), do not allow the Hearing Officer to write "the record is uncertain." The record is precise; the policy choice is binary. If the procedure terminates in **Referral** (Case 2), ensure the Order explicitly states "The Commission selects Model X," not "The Commission finds Model X is more accurate." Accuracy is scientific; selection is regulatory.
