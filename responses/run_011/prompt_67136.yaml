answer: |-
  1. Bottom line
  The disagreement is not merely verbal, nor strictly empirical, but ontological regarding causal agency. It centers on whether material constraints can sustain political outcomes independently of continuous human endorsement. Winner treats artifacts as causal nodes that can lock in power relations; constructivists treat them as ephemeral effects of human negotiation. The stalemate persists because Winner seeks to explain stability through material resistance, while constructivists seek to explain change through interpretive flexibility. They are arguing over whether "politics" requires a human subject or can reside in a sociotechnical configuration.

  2. What each side is committed to
  Winner's framework imposes two conditions for ascribing politics to artifacts. First, the *consequence condition*: the design must settle a community issue or distribute benefits/burdens asymmetrically (the parkway case). Second, the *durability condition*: this arrangement must persist across time, often outliving the original intent. Winner disavows hard determinism by distinguishing between technologies that *require* specific social orders (nuclear power) and those merely *compatible* with them (solar). He insists he is describing correlations and strong affinities, not iron laws. However, he commits to the claim that the artifact itself exerts a causal force that constrains social choice, making certain political arrangements significantly harder to achieve than others.

  The constructivist reply imposes a *locus condition* and an *interpretability condition*. For politics to be real, it must be traceable to a specific social group or negotiation process (locus). Furthermore, the artifact must remain open to reinterpretation or re-scripting by relevant social groups (interpretability). They argue that what Winner calls "inherent politics" is merely a previous social closure that has been black-boxed. Their commitment is methodological: explanation must always terminate in human actors, not things. When they accuse Winner of determinism, they mean he halts explanation too early at the artifact, thereby obscuring the human choices that built it. When Winner accuses them of finding "nothing inside," he means they ignore the material friction that makes re-scripting costly or impossible. The conflict arises because Winner's disavowal of determinism relies on probabilistic constraint ("harder to do"), while constructivists treat any constraint not actively enforced by humans as a failure of explanation. Winner wants to know why the bridge stays low; constructivists want to know who decided to keep it low.

  3. Candidate diagnoses
  **Diagnosis 1: Merely Verbal.** The dispute turns on the verb "have." Winner uses "have" to mean "embody" or "encode," implying a stored capacity. Constructivists use "have" to mean "possess agency," which they reserve for humans.
  *Argument For:* This explains the talking past. If Winner said "artifacts encode political decisions" and constructivists said "artifacts reflect political decisions," they might agree. The heat comes from the possessive implication of "have."
  *Argument Against:* The stakes are too high for semantics. If artifacts encode politics, we regulate design. If they merely reflect it, we regulate users. The policy implications diverge sharply, suggesting a substantive disagreement about where intervention should occur.

  **Diagnosis 2: Two Different Questions (Robustness vs. Locus).** Your hypothesis suggests Winner asks about robustness (does the effect survive redesign?) while constructivists ask about locus (where did the effect originate?).
  *Argument For:* This fits the empirical record. Winner cites cases where intentions vanish but effects remain (tomato harvester). Constructivists cite cases where meanings shift (the hotel key). They are measuring different variables under the same label.
  *Argument Against:* Both sides claim to explain the same phenomenon: the distribution of power. If they were asking different questions, they would partition the domain. Instead, they fight over the same cases (nuclear power, bridges), claiming the other's variable is irrelevant. This suggests they disagree on what *counts* as a political explanation, not just what to measure.

  **Diagnosis 3: Explanatory Ideals (Agent vs. Configuration).** The real work is done by a methodological commitment: must a social explanation locate a responsible agent? Constructivists demand a human chain of causation to preserve accountability. Winner accepts distributed configuration where the "agent" is the system itself.
  *Argument For:* This explains the "smuggled determinism" charge. Constructivists fear that if things have politics, humans escape responsibility. Winner fears that if only humans have politics, we ignore the structural traps they build. This is a clash between a humanist ethics of accountability and a structuralist ethics of outcome.
  *Argument Against:* Winner explicitly cares about human welfare, not just structural description. He isn't abandoning agency; he is warning that agency is limited by prior material choices. The disagreement is not just about explanation styles but about the nature of freedom itself.

  The third diagnosis is strongest. The verbal and empirical disputes are symptoms of the deeper methodological clash over whether "structure" can be a causal agent.

  4. The municipal eligibility case
  Your case breaks the Robustness/Locus distinction. Robustness is high: the politics survives four redesigns and shifts in intention. Locus is ambiguous: is it the code, the audit law, or the legacy data structure? Winner would claim this as a victory: the artifact (the code structure) enforces politics against human will. Constructivists would argue the locus is the audit law (a social rule), and the code is merely a passive vessel.

  However, the case reveals that my proposed Robustness/Locus pair is insufficient. The crucial variable is *Intentionality vs. Constraint*. The politics here survives *without* intentional endorsement. This supports Winner's claim that artifacts can lock in outcomes, but it complicates the "politics" label if politics requires will. It suggests a third category: "politics by path dependence."

  This case validates the Explanatory Ideals diagnosis. Constructivists struggle here because there is no current social group *wanting* this outcome to trace responsibility to. Winner struggles because the "inherent politics" isn't in the tech's nature but in its legal embedding. The case shows that the disagreement is about whether a constraint without a current enforcer counts as political power. If you require a responsible agent, this isn't politics; it's bureaucracy. If you require only asymmetric outcomes, it is politics. The case suggests we need a distinction between *Active Politics* (enforced by groups) and *Sedimented Politics* (enforced by legacy structures).

  5. What would count as progress
  Progress requires abandoning the question "Do artifacts have politics?" for "Under what conditions do material constraints override social renegotiation?" We need a research design that measures *material resistance*. Hold the social groups and their interests fixed, then vary the artifact's design to see if the political outcome changes. Conversely, hold the artifact fixed and vary the social groups to see if the outcome persists.

  We must define "re-scripting" operationally. A re-scripting fails if the cost of modification exceeds a threshold of resources or legal risk. In your municipal case, the "cost" was legal equivalence for audit trails. Progress would look like a typology of constraints: legal, physical, and economic. If we can quantify the "friction" a design imposes on social change, we move beyond the verbal stalemate.

  However, no progress is expected if the sides remain committed to their explanatory ideals. Constructivists will reject material resistance as an explanation until it is reduced to human choices (e.g., "lawyers decided"). Winner will reject human choices as insufficient without material instantiation. The only resolution is a hybrid ontology: sociotechnical configurations where agency is distributed. We must accept that responsibility is shared between the designer, the user, and the constraint. Until both sides accept that causation is hybrid, the debate will remain a dialogue of the deaf.
