  **Scenario**

  In the resuscitation bay of a busy metropolitan hospital, two senior nurses, Elena and Sarah, manage high-stakes trauma cases. When asked during debriefs whether she felt anxious during a critical intervention, Elena consistently replies, 'Yes, I was anxious,' and physiological telemetry confirms she was. Her accuracy holds across nearby variations of stress, yet she possesses no distinctive phenomenal 'feel' of anxiety; she reports simply knowing. Her accuracy stems from a trained, subconscious sensitivity to her own behavioural cues—micro-tremors in her hands and shallow breathing—which she monitors without awareness. She sincerely denies inferring her state from these signs, insisting she just knows, while colleagues remark that Elena never misidentifies her own condition despite her flat affect.

  Sarah, working the same shift, also replies, 'Yes, I was anxious,' with immediate conviction and a vivid, burning sensation in her chest that she takes to be the hallmark of dread. However, independent assessment shows Sarah is not anxious but angry; her arousal is genuine, but her label is systematically false, driven by a motivated pattern where she reinterpret professional rage as permissible anxiety to maintain her self-concept. Unlike Elena, Sarah lacks accuracy but possesses the intense present-tense phenomenology Elena lacks. Colleagues note that Sarah always claims anxiety when she is visibly furious, suggesting her self-ascriptions are not careless slips but structured errors, even though she speaks with the same ordinary first-person authority as Elena.

  ***

  **1. Verdicts of the Four Accounts**

  (i) **Inner-Sense Account:** For Elena, this account denies knowledge. Since she lacks the distinctive first-person mode of access (the phenomenal feel) and relies on cues akin to third-person observation, her true belief is merely accidental or inferential, not introspective knowledge. For Sarah, it also denies knowledge. Although she possesses the vivid feel suggestive of inner perception, the output is false; a malfunctioning sense organ yields no knowledge, only false belief.
  (ii) **Reliabilist Account:** Elena has self-knowledge. Her cue-monitoring process is highly reliable across actual and nearby possible worlds, satisfying the condition for knowledge regardless of the mechanism's phenomenology. Sarah lacks knowledge. Her process is systematically unreliable due to motivated distortion; true belief is absent, and the mechanism is not truth-tracking.
  (iii) **Constitutivist Account:** Elena's status is ambiguous. If her state exists independently of her ascription (which she tracks), the ascription does not constitute it, reducing her claim to an observational report; thus, she lacks the specific authority of self-knowledge. Sarah lacks knowledge because her motivated distortion breaks the transparency required for constitution; her ascription fails to make the state true, rendering it a failed attempt at self-constitution rather than knowledge.
  (iv) **Expressivist Account:** Neither subject has self-knowledge, as neither is a candidate for it. On this view, present-tense self-ascriptions are avowals, not truth-apt reports describing inner states. Elena's utterance is a successful expression of anxiety; Sarah's is a misleading expression of anger. Since knowledge requires truth-apt belief, the category does not apply to either.

  **2. Features and Minimal Changes**

  The feature doing the work for Elena is the **mechanism of access** (cue-based vs. phenomenal); for Sarah, it is the **truth-conduciveness of the mechanism** (reliable vs. motivated). To restore first-person access on the most restrictive account (Inner-Sense), the smallest change to Elena is to endow her with a distinctive phenomenal feel of anxiety accompanying her cue-monitoring, without altering her reliability. This repairs the Inner-Sense verdict but leaves the Reliabilist verdict unchanged; however, it might weaken the Constitutivist view by making her state seem observational. To restore reliability for Sarah, the smallest change is to remove the motivated distortion so she labels her arousal correctly as anger. This repairs the Reliabilist verdict and likely the Constitutivist one (restoring transparency), but does not help the Expressivist, who denies knowledge regardless of truth.

  **3. Defense of the Worst-Faring Account**

  The Inner-Sense account fares worst, as it denies knowledge to Elena despite her intuitive epistemic authority. A defender would attack the case by redescribing Elena's cue-monitoring as a form of inner perception, arguing that proprioceptive and interoceptive data *are* the objects of the inner sense, even if not phenomenally vivid. They would claim she is acquainted with her physiological state directly, not inferentially. This redescription is unstable; by expanding 'inner sense' to include unconscious cue-tracking, the account collapses into the Reliabilist view, individuating the process by its reliability rather than a distinctive phenomenal mode of access.

  **4. Sorting and Unconscious States**

  The Inner-Sense and Reliabilist accounts treat introspection as a **process kind**, individuated by the mechanism (phenomenal access vs. reliable tracking). The Constitutivist account treats it as a **success or achievement kind**, where the validity of the knowledge is internal to the act of avowal itself. The Expressivist account treats it as neither, denying it is a cognitive achievement at all. The Constitutivist account cannot give a coherent verdict on Sarah without positing a failure of sincerity or transparency that mimics an unconscious block. The Reliabilist account explicitly requires a **posited unconscious state** to deliver its verdict on Elena: it must assert that her processing of behavioural cues occurs unconsciously to maintain that she is not inferring, yet still counts as a reliable belief-forming process.
