answer: |-
  **HIGH COURT OF APPEALS OF ORIA**
  *Estate of Julian Vane v. Aethelgard Dynamics, Inc.*
  No. 204-CC-992

  **STATEMENT OF FACTS**
  The decedent, Julian Vane, purchased an Aethelgard "Aegis" wearable, marketed as mortality-resistant technology. Following a unit malfunction, Vane's vehicle departed the roadway. Telemetry indicates Vane remained conscious for fourteen minutes prior to cessation of biological function. The Plaintiff, Vane's adult daughter, appeals the dismissal of two claims: the Estate's action for wrongful death, and her individual action regarding false statements issued by Aethelgard concerning Vane's integrity post-mortem, which incorporates alternative arguments regarding deceptive advertising and deprivation of life expectancy.

  **OPINION OF THE COURT**

  **I.**
  The jurisprudence of this Jurisdiction rests upon the Garden Principles, codified in *Republic v. Lucretius*. Good and evil reside exclusively in sensation. Where there is no subject to sense, there is no subject to suffer. Death is the privation of sensation; therefore, death is no injury to the one who dies. The Estate's claim for the death itself fails at its inception. To award damages for the cessation of existence would be to compensate a nullity. We find no error in the lower court's dismissal of this count.

  **II.**
  Counsel for the Plaintiff raises a procedural dilemma of some interest. If death constitutes no injury, at what moment does a cause of action for death accrue? If no injury occurs at the moment of death, the statute of limitations cannot commence. We observe with doctrinal satisfaction that, under this rule, the limitation period for wrongful death never begins to run. This is not a loophole, but a logical necessity. A clock cannot measure the duration of an event that does not occur. Were we to locate the injury at the moment of negligence, we would punish risk rather than harm. Were we to locate it at death, we would contradict the substantive law. Thus, the claim is timeless, and therefore non-justiciable. The claim remains barred, not by time, but by nature.

  **III.**
  The Plaintiff argues alternatively that Vane was deprived of decades of future life. This deprivationist account misunderstands the symmetry of nonexistence. We do not grieve the time before birth; why mourn the time after death? As noted in *Symmachus v. Estate*, the state of being dead is identical to the state of being unborn. Aethelgard correctly notes that to compensate for lost future sensation is to privilege posthumous nonexistence over prenatal nonexistence without rational basis. We accept this symmetry. The length of a life is indifferent; only the quality of sensation within it matters. To rule otherwise would be to impose a metaphysical preference for existence over non-existence, which the Garden forbids.

  **IV.**
  We anticipate the objection that this doctrine renders undiscovered betrayals of the living non-actionable. If a spouse commits adultery unknown to the partner, or an agent embezzles without detection, the principal suffers no painful sensation. Consequently, under the Garden Principles, no harm exists. We embrace this consequence. It is preferable to maintain doctrinal purity than to invent fictitious injuries to soothe social intuition. The law protects sensation, not abstract honor. If a man dies believing himself loved and rich, he has suffered no injury, however false the belief. We find this conclusion intellectually robust.

  **V.**
  However, the record reveals a compensable injury distinct from death. Aethelgard's marketing campaign urged consumers to vividly dwell upon the losses they stood to suffer upon device failure. Telemetry confirms Vane experienced acute anxiety during the fourteen-minute interval preceding death. Fear is a sensation. Evil lies in sensation. Therefore, the marketing campaign inflicted actual harm upon a living subject. While the Estate recovers nothing for the death, and the post-mortem falsehoods caused the decedent no pain, the claim regarding the intentional infliction of anticipatory distress is remanded for calculation of damages corresponding to that documented interval. The obvious loss fails; the strange one succeeds.

  **DISSENT**

  **JUDGE KALLISTO, dissenting.**

  The majority's logic is internally consistent but morally blind. We recognize harm when a masterpiece is destroyed, even if the canvas feels nothing. A human life is not merely a series of sensations; it is a narrative structure capable of being truncated. To say a man is not harmed by losing forty years because he is not there to miss them is to confuse the subject of the harm with the object of the loss. The deprivation is real regardless of the witness.

  The majority compensates the fear of death while denying the evil of death itself. This creates a paradox wherein the anticipation of an event is punishable, but the event's occurrence is neutral. It suggests that the terror is in the journey, but the destination is harmless. Yet we compensate the terror only because it precedes the destination. If the destination were truly neutral, the fear would be irrational, and perhaps not compensable. If the fear is rational, the destination must be evil. The majority cannot have it both ways. They rely on the victim's reaction to the harm to prove the harm exists, while denying the harm itself.

  If entering nonexistence is truly no evil, why is the fear of entering it compensable?
