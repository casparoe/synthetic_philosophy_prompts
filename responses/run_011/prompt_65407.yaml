          *   *Substance:* The building vs. the endowment vs. the name.
          *   *Mode:* Honor vs. Memory.
      *   **Addressing the "Cheap Version":** Explicitly state that not all views are valid. Some claims are false. This is where I absorb the professor's critique (non-violence as discipline, not comfort).
      *   **The Costly Sentence:** Needs to be hard to say. Perhaps acknowledging the pain of the white workers without validating the exclusion, or acknowledging the harm without demanding erasure. Let's aim for something about the validity of the white workers' feeling of citizenship without validating the system that granted it.
      *   **The "Concession" (Petitioners):** Something that sounds like giving ground on the racism but isn't. "The name belongs to the history of exclusion." (Sounds like agreement to rename, but actually just states fact). Or "The harm is permanent."
      *   **The "Refusal" (Counter-Petitioners):** Something that sounds like dismissing their pain but isn't. "Your citizenship was real, even if the gate was barred." (Sounds like refusing to rename, but actually validates their experience without validating the exclusion).
      *   **The Proposal:** Not a vote on the name. A proposal on *how* to record the decision or carry the history. A plaque? A digital archive? A specific mandate for the branch regardless of the name. Let's go with a mandate on how the history is displayed *inside* regardless of the name *outside*.
      *   **Closing:** Return to the discipline of speech.

  4.  **Drafting - Specific Constraints Check:**
      *   *Sanskrit Terms:* Max 2. *Anekāntavāda* and maybe *ekānta* (one-sidedness). Introduce once.
      *   *Blind Men/Elephant:* Do not use.
      *   *Professor's Objection:* Use doctrine as discipline/non-violence (*ahimsa* implied but maybe not named). Show it costs the speaker.
      *   *Word Count:* ~1,100 words.
      *   *Tone:* Plain, speakable, firm.

  5.  **Drafting - The "Costly Sentence":**
      *   Needs to be visible discipline. "I must say that the comfort you found here was built on a lock I cannot pick." (To white audience). Or "I must say that the harm done cannot be undone by removing a plaque." (To Black audience).
      *   Let's try: "I must say that removing the name will not return what was taken, and keeping it will not restore what was lost." No, that's too balanced.
      *   How about: "To the families who found dignity here: I must say that your dignity was real, even if the door that opened for you was barred to others." This sounds like a refusal to rename (validating the status quo) but is actually validating their experience without validating the exclusion.
      *   Wait, the prompt asks for one sentence sounding like a concession to petitioners (rename) and one like a refusal to counter-petitioners (keep).
