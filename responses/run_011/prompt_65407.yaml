  9.  **Refining the "Concession/Refusal" and "Costly" sentences:**
      *   Costly: "I know that invoking this principle has often been a way to ask the injured to wait." (Shows discipline, absorbs professor's critique).
      *   Concession (Petitioners): "The name currently functions as a marker of who was kept out." (Sounds like "rename", but is descriptive).
      *   Refusal (Counter-Petitioners): "The building remains the only place where your parents were counted as citizens." (Sounds like "keep", but is descriptive).

  10. **Writing the Speech:**
      *   Watch word count. Keep sentences plain.
      *   Ensure Sanskrit terms are limited.
      *   Ensure the proposal follows from the argument (many-sidedness -> record many sides).

  11. **Drafting the Note:**
      *   Two trades.
      *   1. Simplifying the sevenfold predication to four respects (substance, place, time, mode) for clarity. Buddhist logicians (Nagarjuna/etc.) would say this still risks reifying the categories.
      *   2. Using the doctrine for civic peace rather than soteriological liberation. Modern scholars (Balbir, etc.) would say this secularizes a polemical tool into a liberal pluralist instrument, exactly what the professor criticized.

  12. **Review against Constraints:**
