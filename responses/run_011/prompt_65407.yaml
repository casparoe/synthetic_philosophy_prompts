answer: |-
  Friends, neighbors, members of the council. We have been in this room for two years. We are tired. The anger here is not a performance; it is a weight. I stand before you as I did at the opening session, a member of the panel without a vote, a grandson of immigrants who never worked the mills and never lived in the subdivision. I belong to this city, but I do not belong to this history. That distance is the only reason I am speaking again.

  Two years ago, I offered a word from my family's tradition: *anekāntavāda*. It is often translated as tolerance. That translation is wrong. Tolerance suggests we should endure each other's errors. This doctrine insists that errors arise when we mistake a part for the whole. It argues that every statement is true only under specific conditions of substance, place, time, and mode. To speak without violence is not to speak softly. It is to speak precisely about the limits of what you are saying.

  We have been fighting because we are speaking about different objects using the same name.

  Consider time. In 1948, the mill owner's endowment was a gift. In 2024, that same name functions as an honor. A gift is a transaction completed in the past; an honor is a judgment sustained in the present. The ledgers you uncovered prove the hiring practices were exclusionary. That is a fact of 1952. To say the library is inclusive now is a fact of 2024. Both statements use the verb "is," but they do not refer to the same reality. When we treat the history of 1952 as the only truth of 2024, we erase the people who found refuge here later. When we treat the safety of 2024 as a cure for 1952, we erase the people who were barred.

  Consider substance. The library is the building, the endowment, the name, and the Tuesday-night reading group. These are not the same object. The building stands on land that was restricted. The reading group meets in a space that is now open. To say the library is racist is true of the endowment's origin. To say the library is a sanctuary is true of the staff's work. Both are true. Neither is the whole.

  This is where I must correct the memory of my first talk. Some heard me plead for tolerance. Some heard me defend the mill owner. Some heard me shrug. I was doing none of those things. I was naming a specific error: *ekānta*, or one-sidedness. This doctrine does not excuse partiality; it indicts it. It demands we admit when our truth is only a fragment. And it requires us to admit when a claim is simply false.

  Not every view held in this room is valid. The claim that the color line did not exist is false. The payroll ledgers do not lie. The claim that the deed restrictions were benign is false. The law does not lie. To acknowledge the complexity of this room is not to balance lies against truths. It is to acknowledge that true things can contradict when held as absolutes.

  I know that invoking this principle has often been a way to ask the injured to wait. The name currently functions as a marker of who was kept out. Yet the building remains the only place where your parents were counted as citizens.

  I say this not to comfort you, but to discipline myself. Non-violence in speech is a cost paid by the speaker, not a gift given to the listener. It costs me to stand here and validate a system that excluded my own ancestors while refusing to condemn the families who benefited from it. It costs me to refuse the simplicity of a verdict. But simplicity is what broke this room.

  You are waiting for me to tell you what to do. I cannot. The vote belongs to the council. But the record belongs to all of us. If we accept that the library is multiple things across time and mode, then the decision cannot be a single line in a minute book.

  Therefore, I propose this: Regardless of the vote next month, the council must mandate that the branch house a permanent, public display of the payroll ledgers and the deed restrictions alongside the original dedication plaque. The history of exclusion must be physically present within the history of inclusion. The name on the outside may change or it may not, but the interior must carry both truths without merging them. This is not a compromise. It is a structural requirement. If the building is to serve the whole city, it must confess the whole history.

  We cannot fix the past. We can only refuse to simplify it. When you leave this room, you will still disagree. But if you take nothing else, take this: do not mistake your respect for the whole. The vote will end the process. It will not end the truth. Speak it plainly.

  ***

  **Note on Doctrinal Trades**

  First, I reduced the Jain sevenfold predication (*saptabhaṅgī*) to four respects (substance, place, time, mode) for clarity. Buddhist logicians, particularly Madhyamaka critics, would argue that even these categories reify existence, violating the principle of emptiness (*śūnyatā*) and failing to fully escape non-contradiction errors by positing stable referents.

  Second, I framed the doctrine as a civic discipline for pluralism rather than a soteriological tool for liberation. Modern scholars of Jainism (such as those critiquing the "neo-Vedantic" appropriation) would argue this repeats the exact error the professor noted: secularizing a polemical instrument into a liberal tolerance narrative, thereby stripping it of its ontological rigor to serve political agreeableness.
