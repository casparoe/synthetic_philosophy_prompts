      *   Council must record the *reasoning* alongside the *decision*. Or: The branch must house an archive of the process regardless of the name.
      *   Let's go with: The decision must be accompanied by a permanent display of the payroll ledgers and the deed restrictions inside the branch, regardless of the name on the outside. This carries both histories.

  8.  **Writing - Iteration 1 (Mental Outline):**
      *   Intro: Two years. Anger. My position (hardware store, Gujarat).
      *   The Doctrine: Not tolerance, but precision. *Anekāntavāda*.
      *   Time: 1948 is not 2024. The ledgers are true.
      *   Substance: Building vs Name.
      *   The Error: One-sidedness. Not everyone is right. Some things are false.
