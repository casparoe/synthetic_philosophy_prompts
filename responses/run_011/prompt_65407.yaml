      *   **Speaker:** Non-voting community panel member. Family runs a hardware store (4 generations), grandparents from Gujarat, never mill people. Raised with *anekāntavāda* as "table manners." Gave a talk on it two years ago remembered in three incompatible ways (plea for tolerance, defense of owner, shrug). Must correct all three without referring back to the talk.
      *   **Audience:** Petitioners, counter-petitioners, Black families excluded, white families included, staff, council, reporter, high-school reading group, Jain studies professor (3rd row, skeptical of "tolerance" reading).
      *   **Constraints & Requirements:**
          *   Use *anekāntavāda* (many-sidedness) as structure, not decoration. Focus on conditions under which assertions hold (substance, place, time, mode).
          *   Refuse the "cheap version" (everyone is partly right). Target one-sidedness (*ekānta*). Acknowledge some claims are simply false.
          *   Do not resolve the vote or feign neutrality about history (ledgers show truth).
          *   Do not tell the "blind men and the elephant" parable.
          *   Absorb the professor's objection (use doctrine for discipline/non-violence, not agreeableness). Include a sentence costly to deliver.
          *   Speakable: Plain sentences, angry audience. Max 2 Sanskrit terms (introduced once).
          *   Include one sentence sounding like a concession to petitioners (but isn't) and one sounding like a refusal to counter-petitioners (but isn't).
          *   Close with a concrete proposal for the council (not a verdict on the name) that follows from the argument.
