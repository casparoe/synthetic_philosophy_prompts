  2. Without solving the combination problem, how can you posit a hedonic load that isn't merely a collection of disjointed properties lacking moral significance? I claim disvalue exists impersonally, but this gives way if moral obligation requires an identifiable patient.
  3. Why posit categorical bases at all when structural realism demonstrates that relations suffice for physical explanation? I need bases to ground relations, but this gives way if relations can be ontologically fundamental.
  4. Does aggregating micro-disvalues across fundamental particles not violate the separateness of persons by treating non-persons as moral units? I treat disvalue as agent-neutral, but this gives way if moral calculus requires bounded entities.
  5. Isn't inferring proto-experience from physics' silence on intrinsic natures just the relabeling of causal roles my colleagues warned against? I distinguish ontological grounding from causal description, but this gives way if grounding yields no empirical differences.
