prompt: |-
  I'm in a tiny seminar this term, eight of us around a table, mostly case-mongering, and our professor has now given verdicts on like twenty rescue cases over six weeks. I'm trying to pin down what she's actually commited to for my term paper and I keep going in circles, so I figured I'd just dump her track record on you and see if it looks cleaner from the outside. We read Taurek early on and my friend in the seminar is convinced she's just a straight-up Taurekian, but I don't buy it, she's too careful for that. Here's what she's said: (1) Boat case — one person drowning on the near shore, five on the far shore, your boat reaches only one group: you may go either way, a coin flip is at least allowed, and if you let the one die you haven't wronged them; when someone pushed back with "but it's five lives" she said something like the five don't get to add themselves together. (2) Same setup but the one is your sister: save your sister, no coin flip needed, no leftover wrongdoing, and she got visibly irritated when a student suggested you'd owe the five an apology. (3) One person dies versus a million people each get a genuinely awful migraine: save the one who dies, little harms don't stack. (4) One person permanently paralyzed versus five who each lose a finger: save the paralyzed one. (5) One healthy 20-year-old versus five healthy 85-year-olds: coin flip, and she explicitly refused to weight by remaining years — she said life-years is a different currency and you don't get to smuggle it in. (6) The one she won't fully explain: one stranger versus a whole town of about 12,000 about to be wiped out by a flood — she said of course you save the town, and when asked whether that's the same principle with bigger numbers she said no, at some point they stop being numbers and start being a world. She wouldn't say where that point sits, and when someone asked whether 100 versus 1 was past it she said she'd have to think about it, which is extremely not like her.

  Here's the case I want to put to her Thursday, I made it up deliberately boring so there's nothing for her to grab onto: you're the only cave-rescue diver within range, one diver is wedged in a sump and drowns in about four hours and freeing them uses all your gas and all your time, while a tour boat has gone down half a mile up the coast and fifty people are in the water in suits that'll hold for maybe nintey minutes, and you can ferry them out but you can't do both. Everyone's a stranger to you, nobody's sicker or older or more blameworthy than anyone else, you caused neither situation, and no second rescuer is coming.

  So what does she say about the fifty? I want your best guess at her actual verdict, but more than that I want the candidate rules that are jointly consistent with all six of the above — I can think of two or three myself but I'm pretty sure I'm conflating some of them and missing others — and then what each of those rules predicts for the cave case, which one you'd bet on and why, and whether the town case is a genuine crack in her view or whether there's a reading of it that leaves everything else untouched. Then give me the single sharpest follow-up, either one more case or one plain question I could just ask her directly, that would separate the two best candidates; I'd much rather have one good discriminator than five soft ones. Bottom line first — your predicted verdict on the fifty in the very first sentence — then the reasoning, no preamble, and please don't restate the case back at me, I've read it enough times already.
