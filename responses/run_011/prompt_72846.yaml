prompt: |-
  So I'm one of six voting members on my city's automated-decision review board, and Thursday we have to rule on a Parks & Rec proposal that has the whole board arguing past each other. I've been asked to write up the recommendation memo, and I want to get it right.

  The proposal: instead of surveying residents about which classes and programs they want, Parks wants to *infer* it. A vendor system learns a reward function from behavior — signup abandonment, how long you hover on a listing, waitlist joins, no-shows, cancellations — and then ranks and recommends programming accordingly. Technically it's inverse reinforcement learning dressed up in marketing language, and they call the output "preference learning."

  A neighborhood coalition invoked our policy clause requiring "meaningful notice of the criteria used to rank or allocate services affecting a resident," and they're demanding that each resident recieve a plain-language statement of what the system thinks they want, plus a way to contest it. Parks' technical lead says that's impossible in principle, not merely expensive: a reward recovered from behavior isn't pinned down uniquely, because whole families of reward functions that differ in ways that leave the optimal behavior untouched are equally consistent with the data, so any printed statement picks one arbitrary member of an equivalence class and attributes goals to people they'd disavow — while the system's recommendations would be byte-for-byte identical under the alternative. Also, they say, there's no per-person reward function to begin with; it's one shared model conditioned on features.

  Board is split. One member says the underdetermination point makes the coalition's demand incoherent and we should just approve. Another says that's precisely why we shouldn't: a system that can't say what it takes you to want can't be contested, and contestability was the point of the clause.

  Two wrinkles neither side is addressing. First, most of the training behavior comes from last year's pilot, which was itself recommending things — so a chunk of the "revealed" preferences were manufactured by the system, and the vendor's headline accuracy number is holdout agreement with behavior-under-recommendation, which looks circular to me. Second, subsidized kids' swim slots get allocated by the same ranking, so opting out costs you access.

  Draft the memo the board could actually act on: approve, deny, or approve with conditions. If conditions, spell out concretely what Parks would have to disclose or offer residents that *survives* the underdetermination objection — I suspect the answer lives at the level of what the system does differently under some counterfactual rather than any statement of a reward, but argue it rather than assuming it — how you'd handle the feedback-loop problem and the people who can't opt out, and what the timeline should be for pilot versus full rollout. And give the strongest case for whichever side you don't land on, in a form that side would recognize as their own argument.
reasoning: |-
  Here's a thinking process that leads to the memo:

  1.  **Analyze the Request:**
      *   **Role:** Voting member of a six-person automated-decision review board.
      *   **Task:** Write a recommendation memo for the board to act on (Approve, Deny, or Approve with Conditions).
      *   **Subject:** Parks & Rec proposal to use Inverse Reinforcement Learning (IRL) / "preference learning" to rank/recommend programs instead of surveys.
      *   **Conflict:**
          *   *Neighborhood Coalition:* Demands plain-language statements of inferred preferences + contestability (citing policy clause on "meaningful notice of criteria").
          *   *Parks Tech Lead:* Claims this is impossible due to reward underdetermination (multiple reward functions yield same behavior) and shared models (no per-person reward).
          *   *Board Split:* One side says demand is incoherent (approve); other says lack of explainability means no contestability (deny).
      *   **Critical Wrinkles (often overlooked):**
          1.  *Feedback Loop/Performative Prediction:* Training data comes from a pilot that *already* recommended things. Accuracy is measured against behavior *under* recommendation (circular).
          2.  *High Stakes/Coercion:* Subsidized swim slots are allocated by this ranking. Opting out means losing access.
      *   **Requirements:**
          *   Draft the memo (Approve, Deny, or Conditional).
          *   If Conditional: Specify concrete disclosures/offers that survive the underdetermination objection (focus on counterfactuals/behavior, not internal reward).
          *   Address the feedback loop problem.
          *   Address the "can't opt out" population (subsidized swim).
          *   Set timeline (pilot vs. rollout).
          *   Include the strongest case for the *opposing* side (steelman the argument not taken).

  2.  **Determine the Recommendation:**
      *   *Option A (Approve):* Too risky. Ignores the feedback loop and the high-stakes allocation issue. The "impossible" claim by tech lead needs testing, not blind acceptance.
      *   *Option B (Deny):* Safe, but stalls innovation. The tech might work if safeguards are added.
      *   *Option C (Approve with Conditions):* Best path. It acknowledges the potential utility but enforces strict guardrails regarding transparency (counterfactuals), data integrity (feedback loops), and equity (subsidized slots).
      *   *Decision:* **Approve with Conditions.** This allows the board to move forward while addressing the ethical and technical risks. It forces Parks to solve the "black box" problem via behavioral explanation rather than internal state explanation.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Executive Summary:** State the recommendation clearly (Conditional Approval).
      *   **Background:** Briefly summarize the proposal (IRL for program ranking) and the conflict (Coalition vs. Tech Lead).
      *   **Analysis of Key Issues:**
          *   *The Underdetermination Objection:* Acknowledge the tech lead is theoretically right (reward functions aren't unique), *but* policy requires contestability. The solution isn't explaining the *reward*, but explaining the *levers*.
          *   *The Feedback Loop:* Highlight the circularity of the pilot data. This invalidates the current accuracy claims.
          *   *The Equity/Stakes Issue:* Subsidized swim slots are essential services, not just "recommendations." High stakes require higher scrutiny.
      *   **Conditions (The Core):**
          *   *Transparency:* Instead of "Here is your reward function," require "Here is what changes your outcome." (Counterfactual explanations).
          *   *Data Hygiene:* Need a holdout group that sees *no* recommendations to break the feedback loop.
          *   *Equity:* Decouple essential service allocation from the recommendation engine. Or ensure a human review pathway.
          *   *Timeline:* Extended pilot with these conditions before full rollout.
      *   **Steelman of the Opposing View:** Since I'm recommending Conditional Approval (which leans towards "Approve" but with heavy constraints), the strongest opposing view is the "Deny" argument (The Coalition/Privacy side). I need to articulate why they might say "Conditions aren't enough; the system is fundamentally illegitimate."
      *   **Conclusion:** Final call to action.

  4.  **Refining the Technical Arguments (Crucial Step):**
      *   *Underdetermination:* The tech lead says we can't print the reward function. Correct. But the policy asks for "criteria used to rank." We can satisfy this by providing *feature importance* or *counterfactuals* (e.g., "If you lived in Zip Code X, you'd see Pool Y"). This bypasses the need to define the internal reward function.
      *   *Feedback Loop:* If the model trains on data generated by the model, it reinforces bias. The condition must require "exploration" data (randomized control) to get ground truth.
      *   *Subsidized Swim:* This is the kicker. If this algorithm denies a kid a swim slot, that's a due process issue. The condition must ensure an alternative, non-algorithmic pathway for essential services.

  5.  **Drafting the Content (Iterative refinement):**
      *   *Tone:* Professional, authoritative, nuanced, legally aware but technically literate.
      *   *Structure:* Clear headings. Bullet points for conditions.
      *   *Steelman:* Make sure the "Deny" argument sounds like a principled stand on due process, not just Luddism.

  6.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the "per-person reward function" claim? *Yes, by shifting focus from individual rewards to feature-based ranking criteria.*
      *   *Check:* Did I address the circular data? *Yes, via the holdout condition.*
      *   *Check:* Did I address the swim slots? *Yes, by carving them out or requiring human appeal.*
      *   *Check:* Is the "Opposing Case" strong? *Make sure it emphasizes that counterfactuals might still be too complex for laypeople, rendering "contestability" illusory.*

  7.  **Final Polish:** Ensure the distinction between "recommendation" (classes) and "allocation" (swim slots) is sharp. The memo needs to treat these differently. (Decided to recommend decoupling them entirely for the pilot phase).

  8.  *(Final thought on the "Underdetermination" solution)*: The prompt suggests the answer lives at the level of "what the system does differently under some counterfactual." I need to make sure this is the centerpiece of the transparency condition. Instead of "We think you like swimming," it's "Your ranking increased because you clicked X."

  9.  **Finalizing the Memo Structure:**
      *   Header.
      *   Recommendation.
      *   Context.
      *   Technical & Ethical Analysis (The three wrinkles).
      *   Conditions (The "How").
      *   Steelman of the Denial.
      *   Voting Instruction.

  (Proceed to generate output based on this plan.)
answer: |-
  **MEMORANDUM**

  **TO:** Automated-Decision Review Board (Members 1–6)
  **FROM:** [Your Name/Board Member]
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation on Parks & Rec Proposal 23-B (Behavioral Preference Inference System)

  ### **RECOMMENDATION**
  **Approve with Conditions.**

  I recommend we authorize the Parks & Rec Department to proceed with the vendor system *only* as a limited-scope pilot, subject to strict modifications regarding transparency, data integrity, and high-stakes allocation. We cannot approve the system as currently designed due to unverified feedback loops and the conflation of service allocation with preference inference. We should not deny it outright, as the theoretical objection regarding reward underdetermination, while valid, does not preclude the practical contestability required by our policy.

  ### **CONTEXT**
  Parks & Rec proposes replacing resident surveys with an Inverse Reinforcement Learning (IRL) system ("preference learning") to rank and recommend programming. The system infers a reward function from behavioral telemetry (hover time, abandonment, waitlist joins).

  A neighborhood coalition invokes Policy Clause 4.2 ("meaningful notice of criteria used to rank or allocate services"), demanding individual plain-language statements of inferred preferences and a contestation mechanism. Parks' technical lead argues this is impossible: reward functions are underdetermined (multiple functions explain the same behavior), and the model is shared, not individual.

  The Board is currently deadlocked between approving (accepting the technical impossibility argument) and denying (asserting that unexplainable systems violate due process).

  ### **ANALYSIS OF CRITICAL RISKS**
  Two technical realities complicate the current binary choice, neither of which was adequately addressed in the vendor presentation:

  **1. The Performative Feedback Loop**
  The vendor's accuracy metrics are circular. The training data comes from a pilot that *already* used recommendations to shape behavior. The model is not learning "true" preferences; it is learning to predict which of its own suggestions users will comply with. This creates a risk of "preference narrowing," where the system stops showing novel options because they have higher abandonment rates, locking residents into a feedback loop of diminishing variety. Validating this system requires ground-truth data from a population *not* exposed to recommendations.

  **2. Allocation vs. Recommendation**
  The proposal conflates low-stakes recommendations (e.g., "You might like Yoga") with high-stakes allocation (subsidized swim slots). For general classes, a bad recommendation is an annoyance. For subsidized swim slots, a low ranking is a denial of access. Policy Clause 4.2 draws no distinction, but ethical risk demands one. If a resident cannot opt out of the ranking without losing access to essential services, the "contestability" requirement must be significantly higher.

  ### **CONDITIONS FOR APPROVAL**
  To satisfy Policy Clause 4.2 without demanding the technically impossible (printing a unique reward function), Parks & Rec must implement the following conditions prior to rollout:

  **1. Transparency via Counterfactuals (Surviving Underdetermination)**
  The Technical Lead is correct that we cannot print a unique reward function. However, the policy requires notice of *criteria used to rank*, not the internal mathematical state. We can satisfy "meaningful notice" through **counterfactual explanations** rather than reward attribution.
  *   **Requirement:** Instead of telling a resident "The system thinks you value low-cost activities," the notice must state: *"Your ranking for this program would increase if your household income bracket were lower"* or *"Your ranking for this class decreased because you abandoned the signup flow twice."*
  *   **Rationale:** This bypasses the underdetermination problem. It does not claim to know *why* the user abandoned the flow (the reward), only that the abandonment *caused* the ranking change (the criteria). This provides a actionable hook for contestation (e.g., "I didn't abandon; the site crashed").

  **2. Data Integrity & The Feedback Loop**
  *   **Requirement:** Parks must maintain a 15% holdout group that receives **no** algorithmic recommendations and sees a standard chronological list.
  *   **Rationale:** This provides ground-truth data on organic preference, allowing the Board to audit whether the system is discovering new interests or merely reinforcing past behavior. The vendor's accuracy metrics must be recalculated against this holdout group, not the pilot group.

  **3. Decoupling Essential Services**
  *   **Requirement:** Subsidized swim slots (and any program where capacity is strictly limited by subsidy status) must be **excluded** from the algorithmic ranking for the duration of the pilot. These slots must be allocated via a transparent, non-behavioral lottery or first-come-first-served basis.
  *   **Rationale:** Until the system's fairness is proven, we cannot condition access to essential services on a black-box score. Residents must be able to access subsidized services without submitting to behavioral surveillance.

  **4. Timeline**
  *   **Requirement:** A 6-month pilot under these conditions. Full rollout is prohibited until the Board reviews the holdout data and the efficacy of the counterfactual disclosure tool.

  ### **STEELMAN OF THE OPPOSING VIEW (DENY)**
  *For the Board member arguing that this system should be rejected entirely:*

  The strongest argument against Conditional Approval is that **counterfactual transparency is a sham that legitimizes illegitimate governance.**

  Even if we force Parks to issue counterfactual statements ("Your rank dropped because you clicked X"), the average resident cannot meaningfully contest a statistical correlation. If the system infers preference from proxy data (e.g., zip code correlating with income correlating with "likelihood to show up"), telling a resident "Your zip code lowered your score" does not allow them to contest the *logic*, only the data point. They cannot change their zip code.

  Furthermore, the "underdetermination" objection is deeper than the Technical Lead admits. If the system optimizes for engagement (hover time) rather than well-being (actual attendance/enjoyment), it is optimizing for the wrong reward entirely. No amount of counterfactual explanation fixes a misaligned objective function. By approving this even conditionally, the Board validates the premise that resident preference is a latent variable to be mined from behavior, rather than a voice to be heard through survey or assembly. The only way to satisfy Clause 4.2 is to reject the inference model and return to explicit declaration of need.

  ### **CONCLUSION**
  The "Deny" argument is principled but risks discarding a tool that could reduce survey fatigue and identify underserved needs. However, the "Approve" argument ignores the circularity of the data and the coercion involved in subsidized slots.

  Conditional Approval bridges this gap. It forces the vendor to move from "trust our math" to "verify our levers." It protects vulnerable residents from algorithmic rationing of essential services while allowing the city to test if behavioral inference can work without a feedback loop.

  **Motion:** I move to approve Proposal 23-B contingent on the four conditions listed above.

  ***

  **Voting Instruction:**
  Please mark your ballot:
  [ ] Approve
  [ ] Deny
  [ ] Approve with Conditions (as per Memo 23-B-Mod)
