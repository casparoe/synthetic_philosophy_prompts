  # The Free End

  The oil in the lamp was low, burning with a sickly yellow sputter that threw long, shivering shadows against the stone walls of the tally office. Outside, the wind came off the water with a bite that seeped through the mortar, finding the gaps in Elara's shawl. She rubbed her hands together, not for warmth, but to restore the feeling in her fingertips. They needed to be sure.

  On the desk before her lay the cord. It was stiff with tar and salt, running from the wooden toggle pinned to the ledger board out towards the dark edge of the desk. She read it from the toggle outwards, as practice demanded.

  `s s d f s d`

  Two singles, a double, the figure-knot junction, a single, and a double at the free end.

  It was the bonded consignment from the *Heron*, the first of its kind under the new regulation. The regulation stated plainly: a bonded cord must be closed with a double knot. The *Heron*'s cord obeyed this. It ended in `d`. But now the quarter was turning, and the cord had to be tied forward. A fresh length of rope waited in a coil beside the lamp, ready to reproduce the old count and extend it.

  The rule for extending was not written. It lived in the archive, forty years of matched pairs kept in the leather-bound ledgers to her left. Elara pulled the nearest volume down. The pages smelled of dust and dried ink. She ran her finger down the columns of knots and totals.

  `s s d f s` → `s s d f s s`
  `s d s f s s` → `s d s f s s s`
  `d d f s` → `d d f s s`

  Every archived pair showed the same arithmetic truth. The total value of the new cord exceeded the old by exactly one unit. A single knot `s` was one unit; a double `d` was two; the figure `f` was zero, merely a junction binding the near strand to the far.

  She looked back at the `Heron` cord. `s s d f s d`.
  Near strand: `s s d` (1+1+2 = 4).
  Far strand: `s d` (1+2 = 3).
  Total: 7 units.

  If she followed the pattern blindly, she might simply add a knot to the end. But what kind? And where did the end truly lie?

  Three possibilities had formed in her mind, hovering like ghosts in the lamplight.

  The first was **P**: `s s d f s d s`. Here, the rule was simple: append a single knot. The end of the cord was where the rope ran out. The final `d` was just another knot in the count, worth two units. The new cord would total 8 units. The difference was one. It satisfied the ledger's arithmetic.

  The second was **Q**: `s s d f s d d`. Here, the rule was mimicry: append a knot of whatever kind the cord ends in. The cord ended in `d`, so she would tie another `d`. The new cord would total 9 units. The difference was two.

  Elara's finger stopped on the ledger column. Forty years. Not one pair differed by two. Not one. The arithmetic was a wall. **Q** was impossible. It violated the history of the port. She pushed the thought away, but for a moment, in the cold, it had looked seductive. It required no thinking, only copying. But the ledger did not lie. **Q** was dead.

  That left the third possibility, **R**: `s s d f s s d`.

  This was the trouble. This was the knot in her stomach. In this reading, the terminal `d` was not cargo. It was a seal. It was the bond itself, worth nothing in count, merely marking the container. If the `d` was a seal, it was not part of the string to be extended. The "free end" was not the physical end of the rope, but the end of the record *before* the seal. To tie forward, she would have to untie the seal, add a single `s` to the count, and retie the `d` last.

  If she chose **P**, she treated the bond as cargo. The new cord would end in `s`. The bond would be broken.
  If she chose **R**, she treated the bond as a container. The new cord would end in `d`. The bond would persist.

  The regulation said a bonded cord must be closed with a double knot. It did not say the *next* cord must be bonded. But if the consignment remained in bond, the record must reflect it. If she chose **P**, and the cargo was audited, the count would be 8. If she chose **R**, the count would be 6 (5 original + 1 added). Two units of cargo hung in the balance. Two units of freight charges. Two units of liability. If she was wrong, Vance, the captain, would pay. Or he would charge it to the owner. Or he would charge it to her.

  The lamp flickered. The wick was drowning. Elara trimmed it with shaking fingers. The shadows jumped.

  She looked at the cord again. `s s d f s d`.

  A desperate thought struck her, cold and sharp. She could cut it. She could claim the final `d` was a mistake by the wharfmaster, a slip of the hand. She could slice the rope before the `d`, treat the cord as `s s d f s`, and tie forward normally to `s s d f s s`. Then she could tie a fresh `d` on the end. It would look like **R**, but it would be a fabrication.

  She reached for the knife. The blade caught the lamplight.

  If she cut it, she destroyed the evidence. She could say the wharfmaster had tied the seal too early. But Harris, her predecessor, had died in the winter. There was no one to ask. There was only the archive.

  She held the knife over the rope. Her hand hovered. To cut was to admit the practice was void, that the rope was not a truth but a suggestion. It was a madness born of the cold and the hour. She put the knife down. The sound of the steel on wood was loud in the silence.

  She needed to see the cord. Not think about it. *See* it.

  She picked up the rope. It was stiff. She traced the strands from the toggle. `s`, `s`, `d`. The near strand. Solid. Then the `f`, the figure-knot. The junction. Here the rope doubled back on itself, a binding that separated the count from the extension.

  Beyond the `f` lay the far strand. `s`, `d`.

  In the archive, the far strand always ended in `s`. That was the standing practice: every archived cord closed with a single knot. The `s` was the sign that the count had been told out in full.

  Here, the far strand ended in `d`.

  Elara closed her eyes. She tried to hold both images in her mind. In one, the `d` was a heavy knot, just like the `d` in the near strand. It was a weight. It pulled the count up. In this view, the rope simply stopped. The free end was the physical terminus. To add to it, you tied on after it. **P**.

  In the other view, the `d` was different. It was not a weight. It was a wrapper. It was like the toggle at the start, but at the finish. It didn't add to the sum; it secured it. In this view, the "end" was not the physical tip of the rope, but the last unit of cargo. The `d` was outside the count. To add to the count, you had to go inside the wrapper. **R**.

  She opened her eyes. The lamp was dying. The shadows were long.

  She looked at the `f` again. The junction. It bound two strands. The near strand was the fixed cargo. The far strand was the variable tally. In the archive, the far strand was a run of singles. `s`, or `s s`, or `s s s`. Always singles.

  Here, the far strand was `s d`.

  Was the `d` part of the run? Or was it the cap?

  If it was part of the run, then the run was mixed. A single followed by a double. That had never happened in forty years. The archive was pure. Singles only on the far strand.

  If it was the cap, then the run was just `s`. A single. That matched the archive. The `d` was the new regulation, applied over the old practice.

  The thought landed not as a deduction, but as a shift in focus. Like a puzzle picture where the vase becomes two faces. Suddenly, the `d` did not look like a knot of cargo. It looked like a stopper. It looked distinct from the `s` before it. The `s` was the count; the `d` was the closure.

  The concept of "the free end" slipped. It was no longer the place where the rope stopped. It was the place where the counting stopped.

  Elara breathed out. The air hung white in the cold.

  She picked up the fresh rope. She began to tie. She replicated the near strand: `s`, `s`, `d`. She tied the figure-knot `f`. She replicated the far strand count: `s`.

  Then she paused. The old cord lay beside her work. `s s d f s d`.

  If she tied `s` now, she would have `s s d f s s`. Then she would need to close it. The regulation demanded a double knot for bonded cargo. She took the end and tied the `d`.

  `s s d f s s d`.

  It was **R**.

  As soon as the knot tightened, the other possibility vanished. She looked at **P** — `s s d f s d s` — and it looked absurd. Why would anyone tie a single knot after a double seal? It would be hanging off the outside of the bond. It made no sense. The rope would be insecure. The count would be ambiguous. She could not remember why she had ever thought **P** was viable. It looked like a mistake a novice would make, confusing the seal for the cargo.

  And **Q**? `s s d f s d d`. Two doubles at the end? It looked clumsy. Unbalanced. The ledger had ruled it out, but now, looking at the tied cord, it looked physically wrong. The rope would not lie flat.

  The desperation of the knife seemed distant, a fever dream from an hour ago. She had never truly considered cutting the cord. That was madness. The cord was the law.

  She trimmed the excess rope from the new tie. The lamp gave a final flare and settled to a dim glow. The new cord lay on the ledger: `s s d f s s d`.

  It felt right. It felt like the only thing it could be. The structure had firm ed up. The temperature of the room seemed to drop, the chaos of the choices freezing into this single line of knots.

  There was a knock at the door. Vance, waiting for the manifest.

  Elara covered the lamp. She took the cord and the ledger. She opened the door to the night.

  "The tally is done," she said.

  Vance took the rope. He ran his thumb over the knots. He did not ask about the method. He saw the count. He saw the seal. He nodded.

  "Load her out," he said.

  Elara watched him go. She went back inside and blew out the lamp. The office was dark. She could not see the desk anymore. She could not see the place where **P** had lived. It was gone. There was only the cord she had tied.

  ***

  **Author's Note**

  (i) The story's pivotal turn rests on the claim that analogy-making is perceptual rather than inferential. Elara does not choose **R** because of a logical proof; she chooses it because the structure of the cord *looks* different to her. The "slippage" of the concept "free end" (from physical terminus to end-of-count) is depicted as a gestalt shift, akin to seeing a duck become a rabbit. This is load-bearing on the Hofstadterian view that concepts are fluid categories whose boundaries shift under pressure, rather than fixed boxes. I put significant weight on this claim; it explains why intelligent agents can handle novel situations without explicit rules, but it is difficult to verify empirically without access to the subjective "seeing" itself.

  (ii) I have taken liberties with the microdomain's bookkeeping to ensure narrative clarity. Specifically, the prompt implies the archive pairs differ by one unit, but for **R** to work, the input value must be interpreted differently (seal=0) than in **P** (seal=2). I have glossed over the potential ledger inconsistency this might cause if the archive wasn't similarly interpreted. I also simplified the "parallel terraced scan" into a linear sequence of desperation followed by insight, whereas the cognitive model suggests these processes occur simultaneously. The fork between **P** and **R** is made tidier than reality; in practice, ambiguity often persists even after action.

  (iii) My verdict on **R** would change if evidence showed that bonds were temporary arrival markers discarded upon tallying. If the ledger showed historical instances where bonded arrivals produced normal `s`-terminated records, **P** would become the perceptual default. My reasoning is most likely to fail in assuming that structural elegance (preserving the bond) outweighs administrative simplicity (appending `s`). If the port's culture valued speed over structural integrity, **P** might be the "obvious" choice, revealing that salience is cultural, not just structural.
