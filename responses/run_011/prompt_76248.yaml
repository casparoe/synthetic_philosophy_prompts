      *Let's write it.*
answer: |-
  ### Triage Procedure for Dream-Recall Archive

  **Objective:** To categorize submissions based on the *reliability of the link* between the reported content and the sleep period, without making ontological claims about whether the dream "actually happened" during sleep. This ensures inter-rater reliability between the two coders.

  **Time Budget:** 10 minutes per submission.

  ---

  #### Step 1: Temporal Proximity Test
  *   **Test:** Compare the timestamp of the audio file against the participant's stated wake-up time (found in the file metadata or the opening sentence of the recording).
  *   **Sufficient Answer:**
      *   **Immediate:** Recorded within 5 minutes of stated wake-up.
      *   **Delayed:** Recorded more than 5 minutes after stated wake-up.
  *   **Judgment Call:** If the participant does not state a wake-up time, use the earliest timestamp available in the file metadata. Mark as "Delayed" if metadata is missing.
  *   **Empirical / Conceptual / Purpose:** Empirical.

  #### Step 2: External Corroboration Check
  *   **Test:** Check the submission folder for accompanying data files (smartwatch logs, EEG exports, housemate notes) that overlap with the reported sleep window.
  *   **Sufficient Answer:**
      *   **Corroborated:** Physiological data (movement/heart rate/brainwaves) or witness notes exist and align temporally with the report.
      *   **Uncorroborated:** No external data exists, or data exists but covers a different time window.
  *   **Judgment Call:** If a smartwatch shows movement but the dream report is static (or vice versa), code as "Uncorroborated." Do not attempt to interpret the physiology; only check for the *presence* of concurrent data.
  *   **Empirical / Conceptual / Purpose:** Empirical.

  #### Step 3: Narrative Stability Test
  *   **Test:** Search the participant's history for previous or subsequent recordings of the same dream narrative. Compare the core plot points (location, characters, action) of the current submission against those versions.
  *   **Sufficient Answer:**
      *   **Stable:** Core plot points remain consistent across versions recorded within 24 hours.
      *   **Unstable:** Core plot points change significantly in later revisions or retellings (e.g., location changes, new scenes added after 24 hours).
      *   **Singular:** No other versions exist to compare.
  *   **Judgment Call:** Determining what counts as a "core plot point" versus a "detail." Rule of thumb: If the change alters the emotional arc or setting, it is core.
  *   **Empirical / Conceptual / Purpose:** Empirical (with Judgment Call).

  #### Step 4: Content Threshold Test
  *   **Test:** Listen to the first 30 seconds of the recording.
  *   **Sufficient Answer:**
      *   **Narrative Present:** The speaker describes a sequence of events, images, or interactions.
      *   **Narrative Absent:** The speaker describes only physical sensations (jaw ache, exhaustion), feelings (fear, peace), or the *fact* of having dreamed without describing the dream.
  *   **Empirical / Conceptual / Purpose:** Conceptual (defines what counts as "content" for this study).

  #### Step 5: Classification and Handoff
  *   **Test:** Apply the following matrix based on Steps 1–4.
  *   **Sufficient Answer:**
      *   **Class A (High Fidelity):** Immediate + Corroborated + Stable + Narrative Present.
      *   **Class B (Standard Recall):** Immediate + Uncorroborated + (Stable or Singular) + Narrative Present.
      *   **Class C (Constructed/Revised):** Delayed OR Unstable + Narrative Present.
      *   **Class D (Excluded):** Narrative Absent.
  *   **Stop Point / Handoff:** The procedure stops here. The coders assign the Class. The **Psychologist** must decide whether Class B or Class C counts as "recall" for her specific hypothesis. The coders do not decide if the dream was "real"; they decide if the *report* is stable and immediate.
  *   **Empirical / Conceptual / Purpose:** Purpose (The definition of the classes serves the study's design).

  ---

  ### Application to Cases

  **Case 1: The Fluent Reviser**
  *   **Step 1 (Proximity):** Immediate (Recording seconds after stillness ended).
  *   **Step 2 (Corroboration):** Corroborated (Smartwatch shows stillness/HR variance ending seconds before).
  *   **Step 3 (Stability):** Unstable (Three days later, location and scenes changed).
  *   **Step 4 (Content):** Narrative Present.
  *   **Classification:** **Class C (Constructed/Revised).**
  *   **Reasoning:** Despite strong physiological correlation at the moment of waking, the narrative instability suggests the "memory" is malleable. The procedure flags this as a recall that changed, leaving the psychologist to decide if the initial fluent report counts as the "dream."

  **Case 2: The Lucid Signaler**
  *   **Step 1 (Proximity):** Immediate (Reported upon waking, signal happened during sleep).
  *   **Step 2 (Corroboration):** Corroborated (EEG + Housemate witnessed pre-agreed eye signals during sleep).
  *   **Step 3 (Stability):** Stable (Assumed, as the signal was a one-time event verified in real-time).
  *   **Step 4 (Content):** Narrative Present (Report of lucidity).
  *   **Classification:** **Class A (High Fidelity).**
  *   **Reasoning:** This is the only case where the "experience during sleep" has external verification independent of the waking report.

  **Case 3: The Somatic Dreamer**
  *   **Step 1 (Proximity):** Immediate.
  *   **Step 2 (Corroboration):** Uncorroborated.
  *   **Step 3 (Stability):** Stable (Consistently reports no content).
  *   **Step 4 (Content):** Narrative Absent (Reports exhaustion/jaw ache only).
  *   **Classification:** **Class D (Excluded).**
  *   **Reasoning:** The study is on *recall*. Without narrative content, there is nothing to code as a recalled dream, regardless of the participant's belief that dreaming occurred.

  **Case 4: The Coordinator and The Precognitive**
  *   **Coordinator (You):**
      *   **Step 1:** Immediate.
      *   **Step 2:** Uncorroborated (No watch/EEG).
      *   **Step 3:** Stable (Assumed).
      *   **Step 4:** Narrative Present.
      *   **Classification:** **Class B (Standard Recall).**
      *   **Note:** You must code your own entries blindly or have the second coder do them to maintain reliability. Your subjective feeling of "vividness" is irrelevant to the protocol.
  *   **Precognitive Participant:**
      *   **Step 1:** Immediate.
      *   **Step 2:** Uncorroborated.
      *   **Step 3:** Stable.
      *   **Step 4:** Narrative Present.
      *   **Classification:** **Class B (Standard Recall).**
      *   **Note:** The claim of precognition is external to the coding procedure. Whether the news story match is true is a matter for the psychologist's analysis, not the triage. Both you and this participant fall into the same bucket: Immediate but Uncorroborated.

  ---

  ### What This Procedure Cannot Do

  **1. It cannot distinguish a "sleep experience" from a "waking fabrication."**
  *   **Why:** This is the Malcolm/Dennett problem. Unless there is a pre-arranged signal (like Case 2), there is no empirical test to prove the narrative existed before the eyes opened.
  *   **The Loosening:** The procedure loosens the requirement for *ontological proof* and substitutes it with *temporal proximity* and *narrative stability*. We assume that a report given immediately and held stably is a valid proxy for a sleep experience, even if we cannot prove it.
  *   **Principle:** This is principled because it operationalizes "recall" as a measurable behavior (reporting) rather than an unmeasurable metaphysical state (experiencing).
  *   **Question Type:** Conceptual.

  **2. It cannot validate the truth of the content.**
  *   **Why:** If a participant dreams of a fire and a fire happens next week (Case 4), the procedure treats this the same as a dream of a fire that never happens.
  *   **The Loosening:** The procedure treats all narratives as fiction for the purpose of coding. Verification of external matches is left to the psychologist.
  *   **Principle:** This prevents coder bias. Coders cannot investigate news archives for every submission within 10 minutes.
  *   **Question Type:** Empirical (but out of scope).

  **3. It cannot prevent the archive from emptying if "Corroboration" is made mandatory.**
  *   **Why:** Only 6 of 30 participants have smartwatches; only 2 have EEG. If Class A is the only accepted category, 22 participants are excluded.
  *   **The Loosening:** The procedure creates Class B (Immediate + Uncorroborated). This acknowledges that most data will lack physiological backup.
  *   **Principle:** This is convenient but necessary for sample size. It must be acknowledged that Class B data is philosophically vulnerable to the "construction" argument.
  *   **Question Type:** Purpose.

  **4. It cannot resolve the "Judgment Call" on Stability entirely.**
  *   **Why:** Two coders might disagree on whether changing a "blue car" to a "red car" is a core plot change.
  *   **The Loosening:** The procedure provides a rule of thumb (emotional arc/setting), but disagreement will occur.
  *   **Principle:** Inter-rater reliability checks must be run periodically. If coders disagree on >10% of Stability tests, the rule must be tightened (e.g., "Any change in setting counts as Unstable").
  *   **Question Type:** Empirical.

  **Summary of Limitations:**
  If the psychologist requires proof that the dream occurred *during sleep* as a biological necessity for inclusion, this procedure will fail her, because only Case 2 meets that standard. If she accepts "recall" as "the act of reporting a narrative immediately upon waking," the procedure works. The procedure forces her to choose between **ontological purity** (Class A only) and **data volume** (Class A + B). It does not hide that choice; it makes the choice visible in the classification.
