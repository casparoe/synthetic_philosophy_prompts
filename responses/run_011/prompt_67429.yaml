      To our donors: you gave when the answers were hard. You supported an inquiry into the long-term future without demanding guarantees that could not be given. You allowed us to test a hypothesis about impact. You did not flinch when the review came out. You stayed with us until the end. That commitment is rare. It is worthy of thanks regardless of the arithmetic.

