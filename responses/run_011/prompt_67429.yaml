      Good evening. Thank you for being here. There are forty of us in this room, partners and friends who have walked with the Ninth Generation Fund for eleven years. We are gathered to mark the end of this chapter, to acknowledge the work we shared, and to express gratitude for the trust you placed in us. This is not a funeral. It is a closing. It is a time to say what was done and to thank those who made it possible.

