  To the staff and board: thank you for your labor. You navigated complex decisions. You managed the closure with care. You ensured that the assay reached service. You did the work required to end well. You steward the reputation of this fund to the last.

  We leave behind a tool that protects people today. We leave behind a record of eleven years of serious engagement with hard problems. We leave behind a question about how we weigh the future. We do not have the final answer. But we have added to the discussion. We have shown that trying to help the future requires rigor in the present.

