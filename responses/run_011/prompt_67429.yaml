      We leave behind a tool that protects people today. We leave behind a record of eleven years of serious engagement with hard problems. We leave behind a question about how we weigh the future. We do not have the final answer. But we have added to the discussion.

      Thank you for forty people's worth of attention. Thank you for eleven years of support. Thank you for letting us try. We are done now. We are grateful. Good night.

