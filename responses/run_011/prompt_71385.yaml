      *   *Objectivity:* Existence of a universal latent structure with comparable metrics across groups.
      *   *WEIRD Outlier Claim:* Non-invariance (specifically configural or metric) between WEIRD and non-WEIRD groups.
      *   *Relativist Inference:* Lack of invariance $\rightarrow$ Latent variable $\eta$ is not the same entity across groups ($\eta_{WEIRD} \neq \eta_{non-WEIRD}$).
