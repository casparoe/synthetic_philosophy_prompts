prompt: |-
  You're a philosopher of social science who also knows quantitative psychometrics properly — think it through carefully, and sketch the mapping out for yourself before you commit to it.

  I'm a quantitative psychologist. Measurement invariance is literally my job: multi-group CFA, Meredith's configural/metric/scalar/strict hierarchy, differential item functioning, anchoring vignettes, approximate invariance via alignment optimisation. I've never read any philosophy, but I keep colliding with this debate in moral psychology about WEIRD samples — the claim that people from Western, educated, industiralised, rich, democratic societies are psychological outliers, that the moral foundations material and the harm/loyalty/authority/purity distinctions come out differently across cultures — and then philosophers grab that variation and treat it as evidence there's no such thing as objective moral truth, or at least that we should shut up about it.

  Restate that debate, including the inference in both directions, entirely in my vocabulary. Treat a culture's moral outlook as an instrument, cross-cultural variation as a set of group comparisons, and the objectivity question as whatever it turns into once you only have loadings, intercepts, residuals and reference groups to talk with. Be as faithful as you can.

  Then give me the residue report: which claims map cleanly onto invariance language, which ones you had to bend out of shape to fit, and which have no expression at all in my toolkit. Call out anywhere you were tempted to smuggle in a psychometric assumption — an available reference group, a true score, a meaningful zero — and pass it off as translation. And finish with your verdict on whether the leftover is a hole in my framework or a sign the philosophers' argument was vaguer than it sounded.
