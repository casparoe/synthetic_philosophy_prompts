answer: |-
  You have identified a genuine and documented methodological crisis, though it is currently described by a fragmented vocabulary across different disciplines. Your editor is half-right: language *does* work by family resemblance. But your editor is wrong to imply that this licenses *measurement*. You can describe a "game" using family resemblance; you cannot build a single funding index for "gaming" that compares Chess to *Call of Duty* to Olympic Soccer without committing a category error.

  Here is the breakdown of existing terminology, why it falls short, a proposed coinage that captures the specific structural harm you are describing, and a diagnostic toolkit for your reporting.

  ### 1. The Existing Candidates (and Why They Fall Short)

  There is no single term that captures the *linguistic mechanism*, the *non-transitive structure*, and the *institutional consequence* simultaneously. You are standing at the intersection of three different literatures.

  **A. Concept Stretching (Political Science)**
  *   **Source:** Giovanni Sartori, *Concept Misformation in Comparative Politics* (1970).
  *   **The Idea:** As a concept travels to cover more cases (extension), it must lose defining attributes (intension) to fit them. If you stretch "democracy" to cover too many regimes, it becomes empty.
  *   **Why it falls short:** Sartori describes a **ladder of abstraction** (moving up to cover more ground). You are describing a **lateral chain of analogy** (moving sideways via resemblance). Sartori warns against the stretching; he doesn't describe the *stepwise, non-transitive mechanism* that hides the stretching from view.

  **B. Concept Creep (Psychology)**
  *   **Source:** Nick Haslam, *Concept Creep: Psychology's Expanding Concepts of Harm and Pathology* (2016).
  *   **The Idea:** Concepts like *trauma*, *abuse*, and *bullying* expand semantically to include less severe or broader phenomena.
  *   **Why it falls short:** This matches your examples perfectly (trauma, resilience). However, Haslam focuses on the **social consequences** (pathologizing normal life, diluting responsibility). He does not focus on the **methodological consequence** (the invalidation of longitudinal data). He describes the *expansion*, not the *structural non-transitivity*.

  **C. Construct Drift (Psychometrics)**
  *   **Source:** Longitudinal research methodology.
  *   **The Idea:** The underlying theoretical "construct" being measured changes over time, even if the survey questions remain the same.
  *   **Why it falls short:** This names the **measurement error**, but not the **linguistic cause**. It tells you the data is bad, but not *how* the word traveled to break it.

  **D. Boundary Objects (Science & Technology Studies)**
  *   **Source:** Star & Griesemer (1989).
  *   **The Idea:** Concepts (like "map" or "specimen") that are plastic enough to adapt to different communities but robust enough to maintain a common identity.
  *   **Why it falls short:** This is the **positive version** of your phenomenon. You are describing the **failure mode** of a boundary object. When the plasticity exceeds the robustness, the object breaks, but the institution keeps using it.

  ### 2. The Editor's Objection: Family Resemblance

  Your editor invokes Wittgenstein's **Family Resemblance**. Wittgenstein argued that concepts like "game" have no single common core, but a network of overlapping similarities.

  **The Counter-Argument:**
  Wittgenstein's model is a **network**, not a **chain**. In a network, distant members (A and Z) usually share *some* overlapping threads, even if not the *same* threads. In the structure you are describing (the "Ring Species" model), A and Z share **nothing**. They are connected only by a path of intermediate similarities.

  Furthermore, Family Resemblance is a theory of **categorization**, not **quantification**. It explains how we decide if something *counts* as an X. It does not license us to assume that all Xs can be measured on a single scale. Your problem is not that the word has drifted; it is that **institutions have reified the drift into a metric.**

  ### 3. The Coinage: "Institutionalized Sorites Drift"

  Since no existing term captures the chain structure *plus* the institutional locking, I propose you adopt a specific coinage for your piece.

  **Term:** **Institutionalized Sorites Drift**
  **Alternative (Headline-friendly):** **The Sorites Chain**

  **Definition:**
  A phenomenon where a technical concept undergoes a sequence of small, locally defensible semantic shifts (a Sorites Chain), resulting in a final usage that is non-transitive with the original (the ends share no common core), while institutional metrics, funding streams, or legal definitions remain fixed, treating the incompatible usages as identical quantities.

  **Why this term?**
  1.  **Sorites:** References the *Sorites Paradox* (the Paradox of the Heap), which is the logical structure you described (remove one grain of sand, it's still a heap; repeat until no sand remains, is it still a heap?). It captures the "no single boundary" problem.
  2.  **Drift:** Acknowledges the semantic movement.
  3.  **Institutionalized:** Marks the harm. Semantic drift is natural; *institutionalized* drift is where the error becomes embedded in policy and data.

  **Edges of the Concept:**
  *   **Benign Extension:** A concept widens, and the *metrics widen with it*. (e.g., "Poverty" is redefined, and the poverty line is adjusted explicitly).
  *   **Pathological Drift:** The concept widens/shifts, but the *metric stays static*. (e.g., "Resilience" shifts from "bounce back" to "persist," but the funding index still measures "recovery time").
  *   **Determinable Start Point:** There is rarely a single moment where the meaning broke. The insidiousness of the Sorites Chain is that the break is distributed across the links. You cannot point to the year "resilience" changed; you can only point to the gap between 1995 and 2024.
  *   **Intra-Disciplinary:** This can happen inside a single discipline (e.g., Psychology redefining *trauma* over 30 years) just as easily as across disciplines.

  ### 4. Diagnostic Toolkit for Reporters

  You asked for checkable diagnostics. Here is how you prove *Institutionalized Sorites Drift* in a document or dataset.

  **A. The "Original Author" Test (Intension Check)**
  *   **Method:** Take the current operational definition (e.g., the 2024 definition of "community resilience" in a grant application) and show it to a specialist from the originating discipline (e.g., a materials scientist from 1995).
  *   **Diagnostic:** If the original specialist says, "That is not what I meant, and in fact, it contradicts my definition," but the current users cite the original literature as justification, you have a Sorites Chain.
  *   **Evidence:** Look for citation circles. Do recent papers cite the *original* definition, or do they cite *intermediate* reviews that have already shifted the meaning?

  **B. The Metric Stability Audit (Operationalization Check)**
  *   **Method:** Compare the *measurement instrument* over time against the *textual definition*.
  *   **Diagnostic:** If the textual definition has shifted (e.g., from "return to equilibrium" to "adapt to new normal") but the survey questions or funding metrics remain identical (e.g., "Time to restore service"), the metric is now measuring a different construct than the label claims.
  *   **Evidence:** A time-series dataset where the *label* is constant but the *correlates* change. (e.g., In 1995, "Resilience" correlated with "speed of recovery." In 2024, "Resilience" correlates with "diversity of supply," but the index is called the same thing).

  **C. The Non-Transitivity Check (The Ring Species Test)**
  *   **Method:** Identify Usage A (start) and Usage Z (end). Remove the intermediate steps.
  *   **Diagnostic:** If A and Z are placed in the same sentence without the intermediate analogies, do they sound like homonyms?
  *   **Evidence:** "The resilience of the steel beam and the resilience of the theatre company were measured on the same scale." If this sentence requires a paragraph of explanation to make sense, the concept has drifted non-transitively.

  **D. The "Boundary Object" Stress Test**
  *   **Method:** Interview stakeholders at opposite ends of the chain (e.g., the engineer and the arts administrator).
  *   **Diagnostic:** Ask them to define the term *without* using the word itself.
  *   **Evidence:** If they describe fundamentally different mechanisms (e.g., "elasticity" vs. "morale") but agree on the *label* because it unlocks the same funding, the label has become a "hollow signifier" sustaining Institutionalized Sorites Drift.

  ### 5. Summary for Your Piece

  You can write with confidence that you are not inventing a problem, but rather synthesizing three existing methodological warnings (Sartori, Haslam, Psychometrics) into a single structural diagnosis.

  *   **Use "Concept Creep"** when discussing the social expansion of harm (trauma).
  *   **Use "Construct Drift"** when discussing the statistical invalidation.
  *   **Use "Institutionalized Sorites Drift"** (or **The Sorites Chain**) to describe the specific *mechanism* of stepwise, non-transitive analogy that locks the error in place.

  Your editor is correct that language is fuzzy. But institutions require precision. When fuzzy language meets rigid institutions via a Sorites Chain, the result is not just semantic change; it is **systemic measurement error**. That is the story.
