answer: |-
  The requirement for an **independent handle on unreliability** does the most work, because without it, any causal story looks like debunking, committing the genetic fallacy by conflating origin with justification.

  ### The Spec: Requirements for Adequate Genealogical Defeat

  **1. Explanatory Irrelevance (Insensitivity)**
  *   **Requirement:** The causal explanation of the belief must be independent of the truth of the belief's content; the process must not track the truth.
  *   **Motivation:** If the causal process is sensitive to the truth (e.g., perception tracks physical objects), the genealogy confirms rather than defeats justification. Defeat requires showing the belief would be held even if false.

  **2. Independent Handle on Unreliability**
  *   **Requirement:** The debunker must provide evidence for the insensitivity claim that does not rely on the very intuitions being debunked.
  *   **Motivation:** Asserting "evolution didn't track truth" is not an argument. You need a lever to pry the causal story away from the truth, otherwise you are merely assuming the conclusion (that the beliefs are unjustified) to prove the process is unreliable.

  **3. Scope Stability (No Self-Defeat)**
  *   **Requirement:** The argument must not undermine the epistemic or normative premises used to generate the debunking conclusion.
  *   **Motivation:** If the genealogy is global (e.g., "all normative beliefs are evolved"), it applies to the belief that "evolved normative beliefs are unjustified." If that belief is also unjustified, the argument is performatively contradictory.

  **4. Dialectical Neutrality (Non-Begging)**
  *   **Requirement:** The premises used to establish irrelevance must be acceptable to the target (e.g., the moral realist), not just the debunker.
  *   **Motivation:** A debunking argument aims to show the realist they are unjustified. If you assume anti-realism (e.g., "moral facts don't exist") to prove their beliefs are unjustified, you have begged the question against their position.

  ### Classification: Non-Negotiable vs. Partisan

  *   **Non-Negotiable:** **Explanatory Irrelevance** and **Scope Stability**. These are logical constraints; violating them renders the argument invalid or self-defeating regardless of metaphysical stance.
  *   **Partisan Preferences:** **Specific metaphysical handles** within Requirement 2 (e.g., demanding causal efficacy for facts) and **strict interpretations of Neutrality**. Realists and anti-realists disagree on what counts as a "neutral" premise; demanding the realist accept naturalistic metaphysics to evaluate their realism is often a disguised partisan move.

  ### The Impossibility Result

  **Global Scope, Scope Stability, and Dialectical Neutrality cannot be jointly satisfied.**
  If you argue for **Global Scope** (all normative beliefs are debunked), you threaten **Scope Stability** because your own normative premises (e.g., "unreliability defeats justification") are normative. To save Stability, you must exempt your own premises, but this exemption often violates **Dialectical Neutrality** because the realist will demand to know why their beliefs aren't similarly exempt. You can have a global argument that is self-defeating, or a local argument that is stable, but a global, stable, neutral argument is structurally unavailable.

  ### The Three Arguments

  *   **Street's Dilemma:** Survives independence but fails neutrality, as realists reject the forced choice between tracking and coincidence.
  *   **Joyce's Global Error Theory:** Fails scope stability, as the error theory undermines the normative force of the argument itself.
  *   **Cultural Transmission of Fairness:** Fails the independent handle, as cultural evolution may functionally track cooperative truth.
