answer: |-
  Thank you. For those who don't know me, I spent forty years measuring how water moves through dirt. It seems appropriate to end up here, standing among the paper that soaked up our department's rainfall for ninety years.

  Miriam asked me to speak, which is dangerous, because she has one rule taped to the inside of this door: *Nobody says "as everyone knows."* In soil physics, when the surface seals over—when it compacts—water can't get in. It runs off. You get erosion. Miriam's rule was about keeping the soil porous. If you can pull a notebook from 1962 and prove that what we "know" today is actually a distortion of what we *did* then, the ground stays loose. New ideas can take root. The dead keep the living honest.

  That is the argument for memory. But there is an argument for drainage, too.

  The Dean is here, and he is right. If you saturate a profile completely, nothing grows. Roots rot. An institution that holds every drop of its history becomes a bog. You cannot farm a swamp. To change, to survive, a department must let some things pass through. It must shed weight. Forgetting is not always a failure of ethics; sometimes it is a function of permeability.

  So we have a choice between compaction and erosion. And looking at the boxes waiting for the contractor, I suspect we are choosing a third option, which may be the least stable of all.

  Most of this paper will be pulped. That is honest erosion. But a "historically significant subset" will be scanned. Miriam worries that a digital file nobody opens is worse than pulp. I think she's right. Pulp is gone. A scan is a ghost. It gives us the illusion of retention without the friction of access. It creates a surface that looks like soil but has no porosity. We get the comfort of remembering without the risk of being contradicted.

  I cannot tell you which is better. I have spent my life measuring bulk density and field capacity, and I still cannot calculate the optimal weight of a department's past. Maybe there isn't one. Maybe the work is just to notice when the ground is hardening under our feet.

  Miriam is retiring. The boxes are leaving. The room will be empty. We are trading the risk of compaction for the risk of collapse, and we will see what grows in the new season.

  So, raise your glasses. Not to preservation, and not to progress. But to the uncertainty in between. To Miriam, who kept the ground porous for twenty-six years. And to the next twenty-six, whatever they decide to forget.
