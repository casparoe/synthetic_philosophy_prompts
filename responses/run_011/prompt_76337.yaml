answer: |-
  **The Audience's Starting Point**
  Your group consists of experimentalists trained to isolate variables. Their epistemic virtue is control: if you cannot manipulate it, you cannot know it. They view causation as a vector of force, measurable and rankable. They will arrive expecting history to be a messy experiment where the controls were lost. They will instinctively try to rescue the session by asking for "primary causes" or "contributing factors," language that preserves the hierarchy they trust. They will not be hostile to philosophy, but they will be impatient with ambiguity. Your task is not to teach them that history is different from science, but that historical explanation requires a different logic of inference because the intervention is impossible. You must validate their rigor while showing its limits in this domain. Do not apologize for the lack of controls; frame it as a constraint that forces a more sophisticated causal model. They are ready for this because they know what a confounder is; you are simply telling them that in history, everything is a confounder.

  **The Order of Ideas**
  1.  **Condition vs. Cause:** Begin here. You must distinguish the background (oxygen for a fire) from the cause (the match). *Presupposition:* None. *Load:* Later steps assume we have already filtered out the static background conditions to focus on the variable changes.
  2.  **Counterfactual Dependence:** Define a cause as something such that, had it not occurred, the effect would not have occurred (the "but-for" test). *Presupposition:* The Condition/Cause distinction. *Load:* This is the tool they trust (interventionism). It must be established firmly so its failure later lands with impact.
  3.  **The Interventionist Instinct:** Explicitly name their training: "We trust causes we can remove." *Presupposition:* Counterfactual Dependence. *Load:* This sets up the reversal. It validates their intuition before showing where it breaks.
  4.  **The Reversal (Overdetermination):** Introduce the scenario where two causes are present, either sufficient, but removing one leaves the outcome unchanged. *Presupposition:* Counterfactual Dependence. *Load:* This breaks the "but-for" test. If you remove Cause A, the outcome still happens (because of Cause B). Therefore, A is not a cause by the previous definition, yet intuitively it is. This creates the philosophical problem.
  5.  **Explanatory Interest:** Resolve the paradox by shifting from ontology to explanation. We select causes based on what we want to know, not just what changed the outcome. *Presupposition:* The Reversal. *Load:* This saves the concept from being a logical error. It explains why historians argue about causes even when the counterfactual test fails.
  6.  **The Taxonomy:** Apply your three shapes to categorize the failure modes. *Presupposition:* Explanatory Interest. *Load:* This gives them a vocabulary to classify future cases without getting stuck on the paradox.

  Do not introduce "intervention" as a formal theory (Woodward); treat it as their existing intuition. Do not introduce "necessary vs. sufficient" as a abstract logic puzzle; embed it in the case. The reversal must occur *inside* the case analysis, not before. If you tell them the test fails before they see the case, they will treat it as a trick. If they apply the test themselves and watch it break, they will feel the need for the solution.

  **The Carrying Case**
  **The Collapse of the Classic Maya Civilization (c. 900 CE).**
  Avoid the July Crisis (single trigger) and Challenger (technical failure). The Maya collapse offers distinct, evidence-backed candidates: severe drought (paleoclimate data), endemic warfare (archaeological fortifications), and overpopulation (settlement density). Historians debate whether any single one was sufficient.
  *Why this satisfies the conditions:*
  1.  **Multiplicity at issue:** Specialists argue fiercely over whether drought alone would have caused abandonment or if human agency (war) was required.
  2.  **Visible evidence:** Your audience can grasp stalagmite isotope ratios (drought) vs. obsidian blade counts (warfare). It feels empirical, not speculative.
  3.  **Redundant Cause:** This is crucial. If the drought was severe enough to cause societal collapse regardless of warfare, then warfare is a *causally real* process (people died, cities burned) that made *no difference* to the outcome (collapse). This bites against the "contributing vs. necessary" distinction. It allows you to show that a cause can be real but explanatorily redundant.
  4.  **Scientific Resonance:** As a plant physiologist, you can draw a parallel to stress factors in crops. Drought stresses the plant; pestilence stresses the plant. Either can kill. If both occur, which killed it? This bridges their expertise to the history.

  **The Taxonomy and the Machinery**
  Keep your taxonomy (Pile-up, Chain, Threshold). It is intuitive and sufficient for this audience. Discard Mackie's INUS conditions. INUS (Insufficient but Non-redundant part of an Unnecessary but Sufficient condition) is precise but cognitively expensive. In a 75-minute session with non-philosophers, it will consume all your oxygen and yield no practical return. Your taxonomy does the same work with less friction.
  *   **Pile-up (Redundant):** Corresponds to overdetermination. Two sufficient causes present (Drought + Warfare). This does the most work in the Maya case.
  *   **Chain (Sequential):** A causes B causes C. Useful for contrast, but not the focus.
  *   **Threshold (Accumulative):** Many small causes reach a tipping point. Useful for nuance, but distinct from overdetermination.
  Introduce the taxonomy *after* the Reversal. Use it to categorize the Maya causes. Ask: "Is this a Threshold case (many small stresses) or a Pile-up case (two big killers)?" This forces them to engage with the structure of the explanation, not just the facts. Your taxonomy is not a relabelling of standard philosophy; it is a pedagogical simplification. It earns its keep by allowing them to sort historical arguments quickly. Do not apologize for its informality; defend its utility.

  **The Misconception Map**
  1.  **"Overdetermined means we don't know the real cause."**
      *   *Correction:* It means we know there were too many real causes.
      *   *Placement:* Immediately after defining overdetermination.
      *   *Sentence:* "Overdetermination is not a gap in our knowledge; it is a surplus of causes in the world."
  2.  **"We can apportion causation by percentage (variance)."**
      *   *Correction:* Causation is not a pie chart.
      *   *Placement:* During the Taxonomy section.
      *   *Sentence:* "Asking if drought was 60% responsible and war 40% is a category error; causes are not ingredients in a recipe."
  3.  **"If it was overdetermined, counterfactuals are frivolous."**
      *   *Correction:* Counterfactuals reveal the redundancy, they don't vanish.
      *   *Placement:* During the Reversal.
      *   *Sentence:* "The counterfactual still works; it tells us the cause was redundant, not that it was absent."
  4.  **"History should have control groups."** (Scientist-specific)
      *   *Correction:* We use natural experiments, not controlled ones.
      *   *Placement:* During the Condition vs. Cause step.
      *   *Sentence:* "We cannot isolate variables in history, so we must isolate them in our reasoning."
  5.  **"Freud/Althusser Etymology."**
      *   *Concession:* Acknowledge it briefly. It adds depth but distracts from the logic.
      *   *Placement:* Q&A or a footnote.
      *   *Sentence:* "The word has a psychoanalytic history, but today we use it as a logical tool, not a diagnostic one."
  6.  **"A cause must make a difference."** (Scientist-specific)
      *   *Correction:* In overdetermination, a cause makes no difference to the *outcome*, only to the *process*.
      *   *Placement:* During the Maya case analysis.
      *   *Sentence:* "Warfare changed how the Maya fell, but not that they fell; it is real, but difference-making is not the only mark of the causal."

  **Declared Omissions**
  At the outset, state: "We are not discussing whether history is a science, nor are we discussing determinism or free will."
  *   **Determinism:** If asked, say: "Overdetermination is compatible with both determinism and indeterminism. We are looking at explanation, not metaphysics."
  *   **Is History a Science?:** If asked, say: "That question assumes a definition of science we don't have time to unpack. We are looking at how historians justify claims, regardless of the label."
  *   **Moral Responsibility:** If asked about blame, say: "Causal explanation is distinct from moral attribution. A redundant cause can still be blameworthy, but that is a separate question."
  Decline to answer questions about specific historical "laws." You are teaching the logic of explanation, not the content of history. If you engage the "science" debate, you will lose the room to epistemology and miss the causal logic.

  **The Final Check**
  **Question:** "Imagine a patient dies from a lethal dose of Poison A. Unknown to anyone, they were also given a lethal dose of Poison B at the same time. Either alone would have killed them. Did Poison A cause the death?"
  **Good Answer:** "Yes, it was a real cause, but it was overdetermined because Poison B would have done the same. The counterfactual 'if not A, then no death' is false, but A is still causal." (Shows grasp of redundancy vs. non-causation).
  **Bad Answer:** "No, because removing A wouldn't have saved them." (Sounds logical to a scientist, but fails the overdetermination concept).
  **Bad Answer:** "We need more data to know which one worked." (Misses the point that both were sufficient).
  This separates those who understood the logical structure from those who reverted to the interventionist test.
