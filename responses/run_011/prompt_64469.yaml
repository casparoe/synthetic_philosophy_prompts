  ### 4. The Slogan vs. The Teleport Verdict
  You suspect tension between "The claim doesn't move" and Case 1 (Teleport).
  **Resolution:** There is no tension if you read "move" as "divert."
  *   **Teleport:** The claim doesn't *divert* to a copy; the original vessel is replaced, and the claim *continues* in the new vessel. It's a relay race where the baton is handed off because the first runner disintegrates.
  *   **Busy Line:** The first runner *doesn't* disintegrate. If you hand the baton to a twin while the first runner keeps going, the race splits. Her slogan says the race (identity) cannot split. Since it did split, we default to the original runner.
  *   **Consistency:** Her record is consistent. One verdict does not have to go. The slogan means: "Identity follows the continuous causal thread, provided that thread remains unique. If the thread branches, it stays with the physical origin. If the physical origin is destroyed, it transfers to the unique psychological successor."

  ### 5. Underdetermination
  Her record genuinely underdetermines the **Retroactive Inheritance** question.
  *   **The Datum:** We have no case where a branch occurs, the original survives for a while, and *then* the original is destroyed.
  *   **The Principle:**
      *   If she says Mars-365 becomes "You" after Earth dies, she adopts **Rule B (Unique Continuer)**. She privileges *current uniqueness* over *historical origin*.
      *   If she says Mars-365 remains "Not You" even after Earth dies, she adopts **Rule A (Singleton Substrate)**. She privileges *historical origin*. The "claim" didn't just not move; it broke.

  ### 6. The Tie-Breaker Case
  To separate Rule A and Rule B, build this case:

  **The Cleanup Protocol**
  > Same as the Mars Subscription. Earth body survives the jam. Mars body prints. You correspond for a week. Then, the Mars corporation notices the error and sends a drone to Earth to "clean up the duplicate." Your Earth body is euthanized. The Mars body continues living.
  >
  > **Question:** After the drone leaves Earth, are *you* now on Mars?

  **The Branches:**
  1.  **She says "Yes, now I'm on Mars."**
      *   **Rule:** She holds **Rule B (Unique Continuer)**. Identity is about being the *last one standing* with the right memories.
      *   **What she gives up:** She has to soften "The claim doesn't move." It *did* move, just retroactively. She also risks the "Reduplication Argument" (if identity can shift based on who dies later, it makes identity dependent on future events).

  2.  **She says "No, I died when the drone hit Earth."**
      *   **Rule:** She holds **Rule A (Singleton Substrate)**. Identity is a historical path. Once the path branched, the "You" token was locked to Earth. Destroying Earth destroys the token. Mars is a survivor, but not *you*.
      *   **What she gives up:** She has to accept that a perfect psychological continuer (Mars) can exist, and you can be dead, simply because a rival existed briefly. This makes identity less about "survival" and more about "exclusivity."

  **My Bet:**
  Given the slogan ("The claim doesn't move"), she will take **Branch 2**. She views identity as a specific thread of existence, not a pattern that can be re-homed. The Earth death is the final period on the sentence of your life. The Mars person is a sequel written by someone else.
