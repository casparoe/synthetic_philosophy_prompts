prompt: |-
  Right, so: my flatmate Priya read Reasons and Persons about three years ago and it has ruined her for me in the best possible way, because she'll now take a position on any survival case you put in front of her, and she's annoyingly consistant about it. We do this as a thing — I build a case, she rules on it, I try to work out what rule she's actually running and then break it. I've been reading the sequences for years so I keep trying to taboo the word "identity" and she keeps not letting me. Her record so far, in roughly the order we hit them:

  - Bog-standard teleport. Full scan, Earth body disassembled, replica assembled out of Martian regolith, wakes up with your memories and your dodgy knee. Priya: "That's me. I'd book a slot. Next question."
  - Busy line. Same scan, the disassembly jams, your Earth body survives, you spend a minute on the vidphone with your replica before the engineers sort it out. Priya: "The one in the chair is me. The one on Mars is a copy that's about to be very confused. I don't get to be two people."
  - Fission. Both hemispheres into two bodies, both wake up, both fully psychologically continuous, no reason to favour either. Priya: "Neither is me. But I'd mind a good deal less than if I'd just died, which I know sounds like hedging."
  - Slow swap. One neuron at a time replaced with silicon over a decade, no interruption anywhere in the process. Priya: "Obviously me. This one isn't even a case."
  - The impersonator. Someone builds a perfect psychological duplicate of you out of your messages, your medical imaging and forty years of footage — no scanning, no destruction — and switches it on while you're alive and well. Priya: "Superb act. Not me. It has to come *from* you, not just *match* you."
  - Two-century sleeper. Frozen, revived 200 years later, memories intact but values and temperament drifted so far your old friends can't recognise you. Priya: "Still me, just extremely changed. Me-at-70 isn't me-at-7 either."

  Her slogan, which I've heard maybe six times: "the claim doesn't move and it can't be split." I suspect that's in tension with the first verdict, but I've been wrong about her before, so don't just take my side.

  Here's the case I'm going to spring on her tonight and I want your read before I do. Mars has no hospitals, so everybody there subscribes to a nightly service: you're scanned as you drop off, your body goes into the recycling bath (radiation damage, cheaper than treating it), and a fresh body is printed from last night's scan at 06:00. Now — one night the disassembly jams again, so your Earth body survives, but the Mars print goes ahead regardless and nobody tells Mars for a month. You correspond amicably for a year. The Mars you keeps using the nightly service, so the person who wakes up there at the end of the year has been printed 365 times since the original scan. Then you die on Earth: ordinary causes, no drama, no further scans taken. The question I'll put to her is whether the person who wakes up on Mars that morning is you — did you survive, die, or is it something she'll refuse to name — and whether her answer would be any different at 3 reprints or 3,000.

  So: predict her verdict, but the prediction is the easy bit, what I actually want is the reconstruction. Lay out the candidate rules that are genuinely consistent with all six verdicts, and tell me which of them are actually distinct and which are verbal variants of one another, because I'd bet at least two of the obvious ones collapse. For each survivor, say what it predicts about the Mars case and specifically about the reprint count, and where they diverge — including whether any of them has to bite a bullet about the overlap year, and whether the fact that Mars doesn't know about the jam for a month does any work at all in her rule or whether I've only put it in to be annoying. Then give me your best guess and defend it: can "the claim doesn't move and can't be split" be made consistent with her saying yes to the bog-standard teleport, or is one of the six verdicts going to have to go? If you think her record genuinely underdetermines this, say which datum is doing the underdetermining and what principle she'd be adopting with each possible answer. And finally name the one further case I should build to separate your top two candidate rules, plus what she'd have to give up on each branch. No lit review please, and I don't much care what Parfit himself concluded — this is about her.
