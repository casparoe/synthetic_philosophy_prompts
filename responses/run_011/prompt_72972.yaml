answer: |-
  The sentencing machinery you describe presupposes a theory of **cardinal proportionality grounded in a utilitarian metric of hardship**. While the system often clothes itself in the language of retributive justice—matching the severity of the penalty to the seriousness of the offence—the mechanical operation of the guidelines reveals a deeper commitment to the notion that punishment is a quantifiable 'bad', measurable in units of deprivation or suffering.

  ### Commensurability versus Ordinal Ranking

  You ask whether this practice requires penalties to be commensurable quantities of one underlying bad, or if a retributivist view requiring only ordinal ranking can sustain it. The latter cannot sustain the practice exactly as it stands.

  A strict ordinal retributivism (such as that proposed by Andrew von Hirsch) demands only that more serious crimes receive more severe punishments, and that penalties be ranked in a hierarchy of severity. It explicitly rejects the possibility of fixing a precise rate of exchange between different types of sanction. It holds that we can know prison is worse than a fine, but not *how much* worse.

  The guidelines you describe, however, operate on a presumption of **cardinal commensurability**. By treating a suspended sentence, unpaid work, and a fine as positions on a single scale, and by converting days of curfew into days of custody at a fixed ratio, the system asserts that these distinct experiences share a common denominator. It implies that there exists a 'currency' of punishment—be it liberty, time, or financial loss—that can be mathematically converted. Without a belief in a common metric of experienced hardship (or deprivation), the specific exchange rates (e.g., one day of curfew equals half a day of custody) would be arbitrary rather than calculative. Therefore, the machinery requires more than mere ranking; it requires a functional equivalence of burden.

  ### Rival Accounts: Ruled Out versus Compatible

  This machinery **rules out** pure restorative justice models, which prioritise repair and reconciliation over the imposition of a calibrated severity scale. It also excludes **absolute deterrence theories** that would advocate for penalties exceeding the proportionate 'price' of the offence to maximise preventive effect; the guidelines' strict ranges act as a ceiling that deterrence cannot breach. Furthermore, as noted, it is incompatible with **strict ordinal retributivism**, which denies the coherence of the exchange rates the guidelines employ.

  The machinery **fits comfortably** with **limiting retributivism** (where desert sets the limits and utilitarian aims fine-tune the sentence within them) and **utilitarianism** (where the goal is the efficient production of a specific quantum of pain to offset the pleasure of the crime). It also aligns with a **'price theory' of punishment**, where the sentence is merely the tariff exacted for the breach of legal norms, irrespective of the moral message conveyed.

  ### The Discrepancy: Burden in Fines versus Custody

  You identify a profound discrepancy: if the currency is burden, why adjust fines for income but refuse to adjust custody for personal vulnerability (dependents, illness, disposition)?

  This inconsistency suggests the system commits itself to a conception of penal currency it does not fully avow: **standardised deprivation rather than experienced suffering.**

  In the case of fines, the law acknowledges that money is merely a *means* to welfare. A £1,000 fine devastates a low-income earner but is negligible to a millionaire. To equalise the *punitive bite*, the sum must vary. Here, the system admits that the 'currency' is the loss of welfare, not the number of pounds.

  In the case of custody, however, the system treats the deprivation of liberty as an *intrinsic* good (or bad). The sentence is defined by the time served, not the experience endured. To adjust prison terms for personal vulnerability would violate the principle of **equality before the law** in its formal sense: that like offences receive like sentences regardless of the offender's contingent circumstances. If the system adjusted prison time for fragility, it would imply that the punishment is the *suffering* caused by prison, rather than the *removal of liberty* itself.

  By recalibrating fines but not prison, the system reveals a pragmatic hybrid. It accepts a subjective theory of burden for financial penalties (because financial capacity varies wildly and is easily measured) but clings to an objective theory of deprivation for liberty (because measuring psychological fragility is invasive, subjective, and open to manipulation). It is not logically consistent; it is administratively convenient. It implies that while the state wishes to equalise the *economic* burden, it refuses to equalise the *human* burden, thereby committing to a penal currency of **state-imposed restrictions** rather than **citizen-experienced hardship**.

  ### Presupposition versus Convenience

  We must distinguish what the practice strictly presupposes from what is merely convenient for sentencers to assume.

  **Strict Presuppositions:**
  1.  **Commensurability:** That different sanctions can be reduced to a common value.
  2.  **Cardinal Proportionality:** That offence seriousness can be mapped to penalty severity with numerical precision (starting points and ranges).
  3.  **Substitutability:** That the purpose of the sentence can be achieved equally by different means (work, money, or confinement), provided the 'value' is equivalent.

  **Convenient Assumptions:**
  1.  **Fixed Exchange Rates:** The specific ratio of curfew to custody is not philosophically derived but administratively fixed for certainty.
  2.  **Ignorance of Vulnerability:** The refusal to adjust custody for personal hardship is a convenience to avoid complex inquiries into the offender's private life, not a logical necessity of the 'burden' theory.
  3.  **Income Verification:** The reliance on weekly income assumes financial records are accurate and available, which is often not the case.

  ### The Shift to Communicative Censure

  If the presupposed view were replaced by one on which punishment is essentially the **communication of censure** (as argued by R.A. Duff or von Hirsch), the guidelines and the reasons for departing from them would require significant alteration.

  Under a communicative theory, punishment is a moral dialogue. The hardship imposed is the medium through which the censure is conveyed, not the end itself.

  **Changes to the Guidelines:**
  1.  **Abolition of Exchange Rates:** The table of exchange rates would become incoherent. One cannot simply swap a fine for prison time as if they were currency, because they convey different *messages*. Custody expresses a more severe moral condemnation than a fine. A communicative system would resist treating them as interchangeable commodities.
  2.  **Focus on Symbolic Weight:** Starting points would be determined not by a calculation of equivalent hardship, but by the level of moral reproach required to condemn the specific wrongdoing.
  3.  **Vulnerability and Censure:** The discrepancy regarding vulnerability might be resolved differently. If the goal is communication, excessive hardship (due to illness or dependents) might be seen as 'noise' that drowns out the moral message. However, conversely, the censure must be *felt* to be understood. A communicative theory might actually demand *more* sensitivity to personal circumstances to ensure the offender can engage with the moral reasoning of the sentence, rather than simply enduring suffering.

  **Changes to Reasons for Departure:**
  Currently, sentencers depart from guidelines based on aggravating or mitigating factors affecting *severity*. Under a communicative model, departures would be justified by the need to ensure the censure is **intelligible** and **proportionate to the blame**.
  *   *Current:* "I am reducing the sentence because the offender has young children." (Mitigation of hardship).
  *   *Communicative:* "I am imposing a community order rather than custody because a suspended sentence sufficiently conveys the community's condemnation without severing the offender's ties to the dependents they failed to protect, thereby allowing for moral repair."

  In sum, the current machinery presupposes a world where punishment is a quantifiable debt of suffering. A communicative theory would require a system where punishment is a qualitative expression of blame, rendering the current 'exchange rate' tables not just inaccurate, but conceptually obsolete.
