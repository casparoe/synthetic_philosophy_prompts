  **Desiderata for Nuclear Deterrence Theory (Mid-sized/NFU Context)**

  1.  **Rational Credibility:** The theory must explain how a state sanely threatens catastrophic retaliation. *Puzzle:* If execution is suicidal, rational actors won't do it. If adversaries know this, the threat is empty.
  2.  **Dynamic Consistency:** The threat must remain optimal at the moment of execution. *Puzzle:* Backward induction suggests that since retaliation is irrational post-attack, the initial threat is non-credible. Is this fatal?
  3.  **Crisis Stability:** The posture must not incentivize pre-emption during tension. *Puzzle:* Vulnerable second-strike forces create a "use-it-or-lose-it" pressure on the defender, inviting a first strike from the adversary.
  4.  **General Stability:** The theory must address the stability–instability paradox. *Puzzle:* Does nuclear peace at the strategic level invite conventional aggression below the nuclear threshold?
  5.  **Reflexive Robustness:** The account must hold when the adversary knows the theory. *Puzzle:* Published calculations change the common knowledge base, potentially undermining secrecy-based credibility.
  6.  **Empirical Adequacy:** The theory must account for the "Long Peace" without overfitting. *Puzzle:* How much confirmation is provided by the absence of great-power war, given multiple causal factors?

  **Non-Negotiable vs. Local Taste**

  **Non-Negotiable:** Rational Credibility, Crisis Stability, Reflexive Robustness.
  **Local Taste:** Dynamic Consistency (strict backward induction), Empirical Adequacy (strong confirmationism).

  **Reasoning:**
  Strict Dynamic Consistency relies on common knowledge of rationality—a false premise in real crises. Uncertainty about leadership resolve, command integrity, or automated retaliation breaks the induction chain. Therefore, backward induction is a misdescription of the game, not a fatal objection. Deterrence works precisely because adversaries cannot be certain you *won't* retaliate, even if it is irrational. Empirical Adequacy is taste because single-case history (the Long Peace) cannot statistically validate causal mechanisms; claiming confirmation is often post-hoc storytelling. A theory can be logically sound even if history hasn't tested its specific boundary conditions yet.

  However, Credibility is non-negotiable. If the adversary does not believe the threat, deterrence fails functionally. Crisis Stability is non-negotiable because vulnerable forces that invite attack cause the war they seek to prevent. Reflexive Robustness is non-negotiable because strategy occurs in an intersubjective environment; a theory that fails when publicized is operationally useless.

  **Incompatibilities and The Knockout**

  Here is the hard finding: **Rational Credibility and a Vulnerable NFU Posture are likely incompatible.**

  For a mid-sized power with vulnerable forces, retaliation is objectively suicidal. Under NFU, you waive the only scenario (first-use) where retaliation might be rational (i.e., stopping an invasion before nuclear exchange). If the adversary knows your forces are vulnerable and your posture is NFU, they calculate that you will not retaliate after absorbing a strike. To make the threat credible, you must introduce uncertainty (irrationality, delegation, ambiguity). But NFU and vulnerability signal *constraint* and *weakness*, not uncertainty.

  Most theories solve this by smuggling in first-use ambiguity or counterforce survivability (superpower assumptions). For your specific chapter constraints, this solution is unavailable. You cannot claim survivability you don't have, and you cannot claim ambiguity you explicitly renounced.

  **The Knockout Requirement:** **Rational Credibility.**

  This requirement knocks out the most candidates because standard rational-actor models cannot sustain a credible threat of suicide without modifying the rationality assumption (e.g., Schelling's "threat that leaves something to chance") or the posture (ambiguity). If you maintain strict NFU and admit vulnerability, you cannot satisfy Rational Credibility within a standard rational-actor framework. You must either accept that deterrence rests on irrationality (which violates standard rationality desiderata) or admit that deterrence fails under these specific conditions.

  Do not fudge this. If your chapter shows that a vulnerable, NFU mid-sized power cannot theoretically guarantee credible deterrence without relying on adversary misperception, that is a successful theoretical result. The literature generalizes from superpowers because their survivable triads make retaliation rational enough. Your subject lacks that luxury. The tension is not a problem with your analysis; it is the reality of the posture. Any theory claiming otherwise is smuggling in superpower privileges.
