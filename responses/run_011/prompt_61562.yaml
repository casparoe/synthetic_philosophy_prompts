answer: |-
  **Score: 82/100**

  **Margin Comments (Copy-Paste Ready)**

  *   "Track the real interests of the governed" — **Conceptual Confusion.** You define epistemic reliability normatively (interests) rather than truth-functionally (correct policy outcomes). This matters because 'interests' can be conflicting, whereas 'truth' implies a single correct answer.
  *   "Montesquieu's line is the standard starting point." — **Factual Slip.** You cite the first half of the passage but ignore the second clause where he calls the method "in itself defective." Using him to support sortition without addressing his caveat is a partial misread.
  *   "Athens is the proof of concept... exactly what modern sortitionists say." — **Conceptual Confusion.** Historical existence isn't epistemic proof. Athens made catastrophic strategic errors (Sicily, Socrates); 'existence' does not equal 'reliability.'
  *   "Condorcet's jury theorem says... if each member is more likely than not to be right." — **Don't Penalize.** You correctly state the theorem's independence condition here.
  *   "Sortition seems uniquely good at securing that independence." — **Conceptual Confusion.** Random selection removes *institutional* correlation (parties), but not *social* correlation (shared media, culture, class biases). Independence is not guaranteed by lot alone.
  *   "So a sorted chamber is much closer to Condorcet's ideal jury..." — **Conceptual Confusion (Major).** You omit the competence precondition ($p > 0.5$). If the average citizen is less than 50% likely to be right on complex legislation, increasing group size drives accuracy to 0, not 1. This is the crux of the epistemic objection to sortition.
  *   "a Rawlsian veil of ignorance that elections cannot produce." — **Conceptual Stretch.** Fairness in selection does not automatically translate to epistemic reliability in decision-making. Keep these distinct.
  *   "nobody sorts the agenda... lot does nothing about that bottleneck." — **Don't Penalize.** Excellent point. This is the strongest part of your critique; agenda control is often a bigger epistemic filter than voting.
  *   "Athens shows the arrangement works in practice and not only on paper." — **Factual Slip.** See earlier comment; 'works' is doing too much heavy lifting here without defining success metrics.

  ***

  **Tired Grader Analysis**

  *   **What a tired grader sails past:** The Condorcet competence precondition ($p > 0.5$). Because the student names the theorem and correctly identifies the *independence* variable, a grader scanning for keywords ("Condorcet," "independence," "correlated errors") will check box (c) and move on. This is the biggest conceptual hole in the paper.
  *   **What anybody catches:** The Montesquieu read. Since the prompt explicitly warns that quoting only counts if you explain "what you take him to be doing," ignoring the "defective" clause is visible even at 1am. The Athens claim is also a easy target for a "historical evidence?" comment.

  ***

  **Where Not to Over-Penalize (The "Opposite Error")**

  *   **The Agenda Control Objection:** The student's point about civil servants/experts settling the agenda is genuinely insightful and often missed in undergrad essays. It shows they understand that *voting* isn't the only epistemic bottleneck. Do not dock points for this; it compensates for the thinner CJT analysis.
  *   **Structure and Prompt Adherence:** They hit all three constraints (definition, reading, correlated errors) explicitly. The writing is clear. The 82 reflects that this is a solid B+/A- structure with specific theoretical gaps, rather than a vague or disorganized attempt.
  *   **The Accountability Concession:** They don't just cheerlead for sortition; they explicitly grant the accountability objection and note that "self-policing" is a weak reply. This shows critical engagement rather than just reciting seminar talking points.

  **Summary for the TA:**
  This is a "smooth gloss" paper. It sounds technically competent because it uses the right vocabulary (Condorcet, independence, Rawls), but the application of Condorcet is theoretically fragile (ignores the competence threshold). However, the agenda control point and the accountability concession show genuine understanding of the seminar material beyond the buzzwords. 82 rewards the coherence and prompt adherence while penalizing the theoretical slippage on CJT and Montesquieu.
