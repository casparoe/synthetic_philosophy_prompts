  *(Refining the Instrumentalism Divergence)*: The Ptolemy example is classic. But maybe a modern one is better? Overfitted regression models. They predict well in-sample. But assumptions (linearity, included vars) are false/untested. Instrumentalism says "good fit." My principle says "unlicensed." I'll use the Ptolemy example as it resonates with the "false assumptions" theme better.

  *(Final check on Gas vs BS)*: The user says Gas Law is acceptable because deviation is "orderly and signed." BS has corrections (jumps, etc.). The key difference is the *source* of the correction parameters. Van der Waals $a$ and $b$ relate to molecular size/force. BS volatility smile parameters are purely fitted to market prices. This is the "Independence" clause.

