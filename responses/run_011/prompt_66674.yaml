answer: |-
  This is a sharp set of questions. You've identified the exact pressure points where the *Monadology* shifts from metaphysics to natural theology, and where modern readers usually bail out. Since you asked for pushback rather than a tour, I'm going to challenge some of your framing, particularly on the "standards of explanation" hypothesis, while validating your instincts on the infinite series.

  Here is the breakdown of the four hurdles, followed by the diagnosis of the contemporary deadlock and the state of scholarship.

  ### 1. The Work of "Eminently"
  You are right that this is scholastic baggage (via Descartes), but it is not decorative. It is doing heavy metaphysical lifting.

  In scholastic terminology, a cause can contain its effect **formally** (a fire causes heat because fire is hot) or **eminently** (God causes intelligence because God is super-intelligent, not because God has a brain). If God contained the world *formally*, God would be composite (made of parts like the world) or material. If God contained it *causally* but not *eminently*, God would be less real than the effect (which violates the causal adequacy principle).

  **The Pushback:** You asked what it means for God to contain the detail of changes "eminently" rather than "straightforwardly." The point is that for Leibniz, creatures are *limitations* of divine perfection. God doesn't "have" the changes like a box has apples; God possesses the *reality* that, when limited, constitutes the changes.
  *   **Why it matters:** If you skip this, you turn Leibniz into a deist watchmaker. "Eminently" ensures that the world is an *expression* of God's nature, not just a product of his will. It bridges the gap between the Necessary (simple) and the Contingent (complex). Without it, the transition from §36 to §37 is a non-sequitur.

  ### 2. The Infinite Series and the "Leftover"
  Your formulation of the objection ("you've explained every item, so there's nothing left") is the standard Humean/Russellian objection. Leibniz anticipates this.

  **The Gap:** Leibniz distinguishes between explaining the *states* within the series and explaining the *existence* of the series. Even if every book in an infinite library was copied from a previous book, you have not explained why there are books rather than nothing, or why *these* books exist.
  *   **Is it a Fallacy?** It is **not** a fallacy of composition *if* you accept the Principle of Sufficient Reason (PSR) as a universal ontological law. If every contingent fact *must* have an explanation, then the collection of contingent facts (which is itself contingent) must have an explanation.
  *   **The Pushback:** Your framing suggests the gap might be illusory. It isn't illusory *given the PSR*. The disagreement isn't about whether the math of the series adds up; it's about whether the *totality* of the series is itself a contingent fact requiring a reason. Leibniz says yes; Hume says the question is meaningless. The "leftover" is the fact of **existence itself** vs. the fact of **specific arrangement**. Explaining the arrangement (A caused B, B caused C) does not explain the existence of the substrate (Why is there causation at all?).

  ### 3. Outside the Series & The Strength of Necessity
  **Outside:** The reason must be outside because if it were inside, it would be a member of the contingent series. If it is a member, it requires a reason (by PSR). If it requires a reason, it's not the *last* reason. Therefore, the last reason must be of a different ontological category (Necessary vs. Contingent).

  **Necessity:** Leibniz needs **logical/metaphysical necessity** (its non-existence implies a contradiction), not merely "uncaused."
  *   **Why?** If the "necessary substance" were merely uncaused but contingent (a "brute fact" god), the PSR would demand: "Why does *this* brute fact exist rather than *that* one?" To stop the regress, you need a being whose essence *is* existence.
  *   **The Pushback:** You ask if the argument works with the weaker definition. **No.** If you settle for "uncaused," you haven't satisfied the PSR; you've just asserted a stopping point. Leibniz's whole system collapses if the terminal point is contingent. The argument *requires* the stronger modal status to function as a terminus.

  ### 4. From "Necessary Substance" to "One God"
  This is the quickest move in the text, and rightly suspicious.
  *   **The Move:** Leibniz argues that a Necessary Being must possess all perfections (otherwise it would be limited by something else, implying contingency). If there were two Necessary Beings, they would have to differ in some way. That difference would imply a limitation in one or both. Therefore, there can be only one.
  *   **Is it Smuggled?** It relies on the specific Leibnizian definition of God as the "Most Perfect Being." If you grant a Necessary Being exists, Leibniz thinks monotheism follows from the logic of perfection.
  *   **Verdict:** It is not smuggled from *outside* the argument, but it does rely on premises about "perfection" established earlier in the *Monadology* (and in his *Discourse on Metaphysics*). Standing alone in §§36–38, it is under-argued.

  ---

  ### The Diagnosis of the Deadlock

  Your hypothesis is **80% correct, but the remaining 20% is where the real fight is.**

  **Where you are right:**
  The deadlock is indeed about **standards of explanation**.
  *   **The Leibnizian:** Demands that intelligibility be total. A "brute fact" is a failure of reason. Explanation must terminate in self-explanation (necessity).
  *   **The Russellian:** Demands that explanation be empirical/causal. A "brute fact" is acceptable if no further causal mechanism is available. Explanation terminates in "that's just how it is."

  When Copleston debated Russell in 1948, this was exactly the clash. Russell: "I should say that the universe is just there, and that's all." Copleston: "If you refuse to ask the question [of why there is something rather than nothing], we can't discuss."

  **Where you need to push back (The 20%):**
  It is not *merely* a pragmatic disagreement about standards. It is a **substantive disagreement about the nature of reality.**
  *   For Leibniz, the PSR is not just a rule for human inquiry; it is a law of being. To say "the universe is a brute fact" is to say "reality violates the principle of sufficient reason."
  *   Therefore, the "brute fact" advocate is not just setting a different methodological bar; they are asserting a different ontology. They are claiming that **contingency can exist without a ground.**

  **The Hidden Question:**
  You identified the second hidden question correctly: **Does the explanatory demand carry over from parts to the whole?**
  *   **Russell:** No. "Every man has a mother, but the human race does not." (Fallacy of Composition).
  *   **Leibniz:** Yes, *because* the "human race" (the collection of contingent things) is itself a contingent thing. The property being transferred isn't "having a mother" (relational); it's "requiring an explanation for existence" (ontological).

  **Verdict on Diagnosis:** The stalemate persists because neither side can prove the PSR to the other without begging the question. To prove PSR, you need a reason (which assumes PSR). To deny PSR, you accept brute facts (which denies PSR). It is a foundational clash.

  ---

  ### What Counts as Progress? (And What Won't)

  **What Won't Work:**
  *   **More Cosmological Arguments:** Refining the Kalam or Leibnizian arguments (e.g., Alexander Pruss's work) does not move the needle on the core deadlock. It tightens the logic, but the opponent simply rejects the major premise (PSR).
  *   **Empirical Science:** Cosmology can tell us how the universe evolved, not why there is a universe to evolve.

  **What Might Count as Progress:**
  1.  **Modal Logic Refinements:** Distinguishing between *weak* PSR (every fact has *some* explanation) and *strong* PSR (every fact has a *knowable* explanation). Some contemporary metaphysicians (like Pruss or Koons) argue that rejecting PSR leads to skepticism about induction or science itself. If they can show that **denying PSR undermines scientific practice**, that shifts the burden.
  2.  **Shift to Grounding:** Contemporary metaphysics has moved from "causation" to "grounding." Framing the argument as "Contingent truths must be grounded in necessary truths" avoids some of the causal regress objections. This is a terminological shift, but it clarifies that we aren't talking about temporal causes.
  3.  **Abductive Defense:** Arguing that a world with a Sufficient Reason is a better explanatory hypothesis for the intelligibility of science than a world of brute facts. This concedes the logical stalemate but wins on inference to the best explanation.

  ---

  ### State of Play: Settled vs. Contested

  You asked for explicit distinctions on scholarship. Here is the map:

  **1. Leibniz Scholarship (History of Philosophy)**
  *   **Settled:** Scholars agree on what Leibniz *meant*. There is consensus that §§36–38 rely on the distinction between contingent and necessary truths, and that "eminently" refers to the scholastic doctrine of causal containment. There is consensus that Leibniz intends to derive monotheism from the uniqueness of the Necessary Being.
  *   **Contested:** Scholars debate whether Leibniz *believed* the argument was demonstrative or probabilistic. Some (like Robert Adams) argue Leibniz knew the PSR couldn't be strictly proven and treated it as a postulate. Others argue Leibniz thought it followed from the Principle of Contradiction.

  **2. Contemporary Cosmological Argument (Analytic Metaphysics)**
  *   **Settled:** Everyone agrees the Hume/Russell objection (the fallacy of composition/brute fact) is the primary hurdle. Everyone agrees that if PSR is granted, the argument goes through; if PSR is denied, it fails.
  *   **Contested (Live Debate):**
      *   **The Status of PSR:** Is PSR a necessary truth, a contingent truth, or false? (Alexander Pruss vs. Graham Oppy). This is the live wire.
      *   **The "Collection" Objection:** Is the "totality of contingent things" a coherent object that can bear properties like "needing an explanation"? Some argue "the universe" is a pseudo-concept.
      *   **Modal Collapse:** If the sufficient reason is God, and God is Necessary, does that make the world Necessary? (Spinoza's challenge). Leibnizians argue no (God freely chooses the best), but this remains a point of intense technical contention.

  **Summary for your Reading Group:**
  You are stuck because you are hitting the limit of what argument can do. Leibniz is asking you to accept that **reality is fully intelligible.** Your friends are likely operating with a worldview where **some things just are.** No amount of textual exegesis will bridge that gap. The progress to be made is not in reading Leibniz harder, but in debating whether a universe without a Sufficient Reason is a universe in which science and reason are ultimately trustworthy. That is the only lever that moves the deadlock.
