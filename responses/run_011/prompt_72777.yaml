answer: |-
  Here is a principle designed to reproduce your verdicts, followed by the test cases and the honest trade-off.

  ### The Principle of Cooperative Integrity

  **Priority Order:**
  1.  **The Legitimacy Constraint:** Do not participate in norms that are illicit or undermine public trust/order, even if compliance is expected and non-compliance harms you.
  2.  **The Dependency Constraint:** Honor norms where a specific individual's livelihood depends on your compliance, provided the norm does not violate Constraint #1.
  3.  **The Coordination Constraint:** Adhere to local conventions of interaction that minimize social friction and coordinate behavior, provided they do not violate #1 or #2.

  ---

  ### Load-Bearing Analysis
  Here is how each clause earns its keep using your specific cases.

  **Clause #1 (Legitimacy)**
  *   **Load-Bearing Case:** *The Border Guard vs. The Restaurant Tip.*
      *   **Why:** This is the only clause that distinguishes these two. Both involve an expectation, a cost, and a systemic flaw. But the bribe is *illicit* and undermines the rule of law (Public Trust). The tip is *licit* and supports a worker (Dependency). This clause forces you to refuse the bribe (upholding order) while allowing you to pay the tip (not violating order).
  *   **Secondary Case:** *Jaywalking with a Witness.*
      *   **Why:** Alone, jaywalking is a victimless technical violation. With a witness waiting, you are modeling behavior that undermines the *coordination of safety*. You are signaling that the rule is optional, which harms the public trust the waiting person relies on to make their own safety calculation.

  **Clause #2 (Dependency)**
  *   **Load-Bearing Case:** *Sit-Down Restaurant vs. Coffee Kiosk.*
      *   **Why:** In the restaurant, the server's wage structure is structurally dependent on the tip (Livelihood). At the kiosk, the barista is paid an hourly wage; the tip screen is a profit center for the owner or a bonus, not a livelihood necessity. This clause explains why one is morally binding and the other is a "shakedown."
  *   **Secondary Case:** *Delivery Driver (Bad Service).*
      *   **Why:** Even if the service is cold/spilled, the driver's economic model usually relies on the tip to cover gas/vehicle wear. Clause #2 says you pay anyway, because the *dependency* exists regardless of the *performance*. (Note: This creates a tension with your intuition about "good service feeling different," which I will address in the trade-off).

  **Clause #3 (Coordination)**
  *   **Load-Bearing Case:** *The Queue vs. The Scrum.*
      *   **Why:** There is no universal law of queuing. But in the city, the queue is the local coordination norm. Violating it creates friction and unfairness relative to those following the local rule. In your hometown, the scrum was the local norm. This clause binds you to the "local rules of the game" to ensure fair play.
  *   **Secondary Case:** *The Bus Seat.*
      *   **Why:** There is no harm and no rule. But there is a strong convention of "civil inattention" (maximizing personal space). Sitting next to a stranger on an empty bus violates this coordination norm, creating unnecessary psychological friction. Your moral reaction is to the breach of social coordination, not physical harm.

  ---

  ### Running the Test Cases

  **Case 1: The Group Chat Emojis**
  *   **Analysis:**
      *   **Legitimacy:** N/A.
      *   **Dependency:** N/A (No one's livelihood relies on your emoji).
      *   **Coordination:** High. The group has established a norm: "We acknowledge receipt with an emoji." This reduces friction (no need to wonder if you saw it).
  *   **Verdict:** You are in **violation of Clause #3**.
  *   **Reasoning:** By substantively replying only when it "matters," you are unilaterally opting out of the coordination signal. This creates friction: others must wonder, "Did they see this? Are they ignoring me?" Even if you intend no harm, you are increasing the cognitive load on the group.
  *   **Nuance:** If the group *knows* you don't do emojis and has accepted it, the friction disappears, and the obligation lapses. If they haven't accepted it, you are being a "free rider" on their emotional labor.

  **Case 2: The Lobby Door**
  *   **Analysis:**
      *   **3rd Floor Guy (Never Holds):** Violates **Clause #3** (Coordination). He is ignoring a local norm designed to minimize friction (making entry easier). However, since it is a passive omission, the "harm" is low.
      *   **3rd Floor Guy (Slams Door):** Violates **Clause #1** (Legitimacy/Non-Maleficence). Actively slamming a door on someone is not just a breach of etiquette; it is an act of aggression that undermines the basic safety/trust of the shared space.
  *   **Verdict:** The 3rd floor guy is **technically in the wrong** for not holding (Clause #3), but **egregiously in the wrong** for slamming (Clause #1).
  *   **Reasoning:** Your intuition says he "isn't doing anything wrong" by not holding. The principle says he is failing a civic duty of cooperation, but it's a minor failing. The principle draws a sharp moral line between *passive selfishness* (minor wrong) and *active aggression* (major wrong).

  ---

  ### The Honest Trade-Off

  You asked me to be honest about which verdicts this principle forces you to give up or strain. Here is the cost of this system:

  **1. The "Bad Service" Delivery Tip (Strained)**
  *   **Your Intuition:** Tipping the guy who spilled your food is "fine, arguably right," but tipping the great driver feels like a "different kind of thing." You sense a distinction between *obligation* (bad service) and *gratitude* (good service).
  *   **The Principle's Verdict:** Clause #2 (Dependency) makes **both** obligatory. It erases the distinction. If the driver relies on the tip, you owe it regardless of performance (unless the service was malicious).
  *   **The Cost:** You lose the ability to morally distinguish between "paying what is owed" and "giving a reward." The principle forces you to view the tip purely as a wage subsidy, not a merit badge.

  **2. The 3rd Floor Guy (Overturned)**
  *   **Your Intuition:** You explicitly said you think he "isn't doing anything wrong" by never holding the door. You view it as supererogatory (good to do, not wrong to skip).
  *   **The Principle's Verdict:** He is **doing something wrong** (a minor violation of Clause #3).
  *   **The Cost:** This principle moralizes etiquette. It claims that ignoring local coordination norms *is* a moral failing, not just a quirk. If you want to keep the intuition that he is blameless, you have to weaken Clause #3, which risks letting the Bus Seat Sitter and the Food Truck Line Cutter off the hook too.

  **3. The Group Chat (New Burden)**
  *   **Your Intuition:** You likely feel your current behavior (substantive replies only) is efficient and fine.
  *   **The Principle's Verdict:** You are creating social friction.
  *   **The Cost:** You are obligated to perform "phatic" communication (emojis) even when you have nothing to say, because the *signal* is the value, not the content.

  ### Summary Recommendation
  If you want to keep the **Bus Seat** and **Queue** intuitions (which feel like strong moral violations to you), you must accept that **Etiquette = Morality** when it comes to social coordination. This means accepting that the **3rd Floor Guy** is slightly blameworthy.

  If you cannot accept that the 3rd Floor Guy is blameworthy, you must weaken Clause #3. But if you do that, the **Bus Seat** verdict collapses (since that is also just a coordination norm with no physical harm). You cannot have the Bus Seat violation without also having the Door Holding violation.

  **My advice:** Accept the trade-off on the Door Holder. It is better to have a principle that says "Be a cooperative neighbor" (even if it nags you about doors) than one that cannot explain why sitting next to a stranger on an empty bus feels like a violation of human dignity. The Bus Seat intuition is the stronger moral signal here; the Door intuition is likely just you being polite to a neighbor you know.
