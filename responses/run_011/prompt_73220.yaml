answer: |-
  Here is a principle that systematizes your intuitions, followed by the necessary sacrifice, the application to the whistleblower, and the refutation of your friend.

  ### The Principle: Normative Integrity

  **Statement:** An agent $A$ has standing to blame agent $B$ for a violation of norm $N$ if and only if $A$'s practical will is currently aligned with the value underpinning $N$, such that $A$'s invocation of $N$ is an expression of authority rather than an instrument of advantage.

  **Precision:**
  *   **Property of the Blamer:** It appeals to the **sincerity of the blamer's commitment** to the value at stake. This is not merely behavioral compliance (as V6 shows, one can comply while exploiting loopholes, lacking the *attitude*), nor is it merely historical (as V5 shows, past confession does not guarantee current alignment). It requires that the blamer currently recognizes the norm as binding on themselves.
  *   **Binary or Graded:** Standing is **thresholded but graded**. There is a binary threshold for *permissibility* (below it, blame is morally objectionable, as in V2 and V4). Above the threshold, standing is graded by the *depth* of alignment (V3's repentant blamer has *more* standing than V1's innocent blamer because their authority is tested and reaffirmed).
  *   **Permissibility vs. Weight:** The principle governs **permissibility** primarily. If integrity is absent, the blame is illicit (the target has a complaint). Where integrity is present, the *weight* or *force* of the blame is modulated by relational factors (addressing V7).
  *   **Avoiding Rudeness:** Rudeness concerns the *manner* of delivery (tone, timing, audience). Integrity concerns the *right* to deliver it. A polite letter from a hypocrite (V4) is still impermissible; a harsh shout from a repentant friend (V3) may be permissible. Your friend's "conversational fact" confuses the social friction of rudeness with the moral forfeiture of authority.

  ### The Verdict to Abandon

  To keep this principle simple and robust, you must refine **Verdict 7**.

  Your intuition in V7 is that a "blameless stranger's public denunciation... is worse than a complicit friend's quiet word." You conclude from this that "blamelessness is not sufficient" for standing. This conflates **standing to blame** with **fittingness of the intervention**.

  Under the Principle of Normative Integrity, the blameless stranger *does* have standing (they are aligned with the norm). However, standing is not the only variable in a blaming interaction. There is also **relational authority**. A friend has a special obligation and license to correct one another that a stranger lacks. The stranger's blame is not *impermissible* (they have standing), but it is **disproportionate** or **misplaced** given the lack of relationship.

  **Correction:** You must abandon the claim that the stranger lacks standing. Instead, concede they have standing but lack the *relational license* to make the blame effective or appropriate. This preserves the principle's focus on the blamer's relation to the *norm*, while acknowledging that the blamer's relation to the *target* affects the blame's propriety, not its moral license.

  ### The Whistleblower Case

  Consider a whistleblower who participated in a corrupt practice, then left, repented, and exposed it.

  *   **Application:** This maps to **Verdict 3**. The whistleblower has "ended it, repented, and blames from knowledge."
  *   **Implication:** The principle grants them **enhanced standing**. Their past participation does not forfeit standing (as your friend would argue via the evidential fact) because their current will is aligned against the practice. In fact, their standing is superior to the "clean" outsider (Verdict 1) because their commitment is tested; they know the cost of the norm and uphold it anyway.
  *   **Caveat:** If the whistleblower is *still* participating while exposing others (a "rat" who remains in the game), they map to **Verdict 2 or 4**. Their blame becomes instrumental (a weapon to reduce competition or gain leniency), violating the "non-instrumental" clause of the principle. Their standing collapses because their will is not aligned with the value; they are using the value as a tool.

  ### The Friend's Reduction

  Your friend's reductive account **does not survive**. It fails first on **Verdict 2 (The Unaware Hypocrite)**.

  Here is why the three reductive facts collapse in this case:

  1.  **Failure of the Evidential Fact:** In V2, the blamer is "wholly unaware of the parallel." Therefore, the blame does *not* reveal the fault to the target or the audience. The evidential update your friend relies on cannot occur if the hypocrisy is hidden. Yet, you correctly intuit that the blamer still lacks standing. The moral defect exists even if the evidence is concealed.
  2.  **Failure of the Strategic Fact:** Strategy concerns outcomes (reform vs. entrenchment). In V2, the blame might actually work strategically; the target might reform. But your intuition is that the blame is "morally objectionable" regardless of its success. The wrongness lies in the *act of blaming itself*, not its consequences.
  3.  **Failure of the Conversational Fact:** In V2, the target cannot reply "and so are you" because they do not know. The conversation does not derail. The "tu quoque" is unavailable. Yet, the standing is still forfeited.

  **Conclusion:** The reductive account treats standing as a function of social dynamics (what is known, what works, what is said). Your intuitions (and the Principle of Normative Integrity) identify standing as a function of **moral reality** (what is the case regarding the blamer's will). The Unaware Hypocrite proves that standing is lost even when the social costs your friend identifies are absent. Therefore, standing is not a fiction built from those facts; it is a distinct normative status that those facts sometimes track, but do not constitute.
