      *(Self-Correction during drafting)*: Make sure to address the clamping (NRP) specifically regarding the friend's claim. The friend thinks it proves brain death is the "real" standard. I need to explain *why* they clamp (to prevent restoration of consciousness in a declared-dead body), which validates the friend's intuition without validating the "theater" claim entirely.

      *(Refining the "Same Event")*: The event is the **cessation of the organism's capacity to maintain integrated function**. In Brain Death, the integrator (brain) is gone. In DCD, the fuel (blood) is gone permanently.

      *(Refining the "Irreversible" point)*: This is the most critical philosophical hinge. The 2006 Institute of Medicine report explicitly shifted language to "permanent" (will not be reversed) rather than "irreversible" (cannot be reversed). I must cite this distinction.

