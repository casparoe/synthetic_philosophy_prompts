      *   **The Conflict:**
          *   Friend: It's a fudge/theater; clamping admits brain death is the real criteria.
          *   User: It's coherent; circulatory and brain death are two routes to the same event.
          *   Shared Confusion: Neither could define "the same event."
      *   **Core Questions:**
          1.  What account of death does this practice *actually* presuppose?
          2.  Is "irreversible" descriptive or normative?
