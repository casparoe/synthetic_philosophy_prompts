      *   **2. Descriptive vs. Normative:** It is normative.
      *   **3. One Phenomenon or Two?** Functionally one (loss of integration), legally two.
      *   **4. Rival Views:** Rules out strict vitalism and pure consciousness views. Licenses "loss of integration."
      *   **5. The Stand-off Period:** Mostly statistical/ethical buffer, not deep metaphysics. Friend is mostly right.
