      *(Refining the "Dropping DDR")*: If you drop the requirement that the donor be dead, the "declaration" act vanishes. The "clamping" becomes standard surgical triage. The "stand-off" becomes purely palliative (waiting for natural death) without the pretense of a medical declaration triggering the surgery.

