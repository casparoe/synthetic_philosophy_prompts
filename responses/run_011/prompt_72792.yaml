      *   *Decision:* I need to operationalize "Honesty" as *Fidelity to the Cooperative Principle within Constraints*. It's not about the bot's soul; it's about whether the bot upheld its end of the informational bargain. This leans towards the "Customer Belief" side but anchors it in *reasonableness* rather than *outcome*.

