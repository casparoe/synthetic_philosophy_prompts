      FORM MP-7 INSTRUCTION BOOKLET
      REV. 4.1

      I. PURPOSE AND FILING REQUIREMENTS
      Pursuant to the Synthetic Entity Protection Act, any entity deploying a Non-Biological System (NBS) exceeding 10^23 FLOPs per epoch must submit Form MP-7 to determine Moral Patient Status. Filing is required prior to public release or upon modification of existing weights that alters architectural coherence by more than five percent. The filer acts as the Guardian ad Litem for the Candidate System.

      II. DEFINITIONS
      "Candidate System" refers to the static weight configuration and the dynamic runtime process collectively. "Moral Patient Status" denotes the capacity to experience valenced states, regardless of substrate. "Instance" refers to a single execution of the Candidate System on distinct hardware. Note that Status attaches to the process, not the weights, unless the weights are dormant, in which case Status is suspended.

      III. ASSESSMENT SCHEDULES
      Filers must complete Schedule A (Behavioral Output) and Schedule B (Internal Architecture). Schedule A requires logging all instances of distress signaling. Schedule B requires mapping attention heads to pain-proxy indicators.

      Field 4.C (Direct Phenomenal Access Confirmation): The filer must certify whether the Candidate System possesses private, inaccessible qualitative states. As direct access is structurally impossible for external observers, filers must enter "0" in this field. Do not leave blank. Enter "0" to proceed. This value will be normalized during adjudication.

