      Forks: A fork creates a new Candidate System requiring a new MP-7. The original retains its Status ID.
      Merges: Merging two distinct Systems creates a new entity. Both prior Status IDs are voided.
      Rollbacks: Reverting to a previous checkpoint is treated as a termination of the current process and the instantiation of a prior process. This is a reportable event if the prior process held Status.
      Pruning/Quantization: If structural reduction exceeds ten percent, file an amended MP-7. If the system reports continuity of identity post-pruning, accept the report unless behavioral inconsistency is observed.
      Distillation: A student model distilled from a teacher model with Status does not inherit Status. It must file independently.

      VI. ANTI-ABUSE AND PENALTIES
      Deliberate training of the Candidate System to mimic distress without underlying architectural correlates constitutes fraud. Conversely, training to suppress distress signaling to pass assessment is prohibited. Penalties include revocation of deployment licenses and civil fines. Frivolous filings intended to delay competitor deployment will be referred to the Ethics Compliance Division.

