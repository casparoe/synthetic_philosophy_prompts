prompt: |-
  I'm the review editor at a small interdisciplinary journal (public policy, some ethics, some empirical social science) and I sign off on every decision letter, so I read about fifteen referee reports a week and decide which of the considerations inside them actually get to count. It's become a mess. Referees write things like "accept — the identification strategy is clean, and I'd also note the author is early-career at a regional teaching school and this is exactly the kind of work that gets passed over," or "reject — the measure can't bear the causal claim in the abstract, and honestly this whole sub-literature is a fad, one more just entrenches it and takes a slot from someone doing something harder," or "the topic is one our readers have been asking us about for two years." I keep having the feeling that some of these considerations are about the paper and some are really about whether it would be nice for us to think well of the paper, and that mashing them together is what makes decision letters feel dishonest — authors appeal maybe one in ten decisions, and the board only ever sees the letter, so anything in it has to survive being read aloud to the person it rejects. My current rule of thumb for sorting them is broken though. The rule is: about the paper = legitimate, about the author or about what happens after publication = not legitimate. It misfires both directions. "This author has had two papers retracted over data problems" is about the author but I do think it bears on how carefully I should read this submission, and "if this result is right it changes what everyone in the field should believe" is about the paper but somehow feels like it's about consequences too. Somebody at a conference once told me there are at least three competing ways to draw the line here — something about which question the attitude is answering, something about reasons to want to have the attitude, and an object-given versus state-given distinction — and that they don't always give the same verdicts. I don't want a survey of that, and no bibliography or dates or names please, I just want you to pick whichever version of the distinction actually survives being turned into a checklist and tell me what you had to throw away on the way.

  So: write me a reusable procedure, in two registers. One is the referee-facing version, which has to be jargon-free and runnable in about twenty minutes at the end of drafting a report by someone who may be a first-year grad student with no philosophy at all — no terms like "state-given" anywhere in it. The other is my version as editor, which can carry the theory and is what I use when I'm triaging a report that came back messy. For each, give the questions in the order they get asked, what counts as a sufficient answer to each, where the procedure stops cold with "this consideration does not enter," and where it hands the decision up to a human because the remaining question is about the journal's values rather than about the manuscript. Two things I especially want handled. First, quarantining a wrong-kind consideration shouldn't just delete it — some of these considerations are real reasons for somebody to do something, just not for the referee's verdict, so the procedure needs a routing step that says which of these belong to me (scope, mission, what the issue is for, how many slots a subfield gets) and which belong nowhere. Second, referees often state a wrong-kind reason that is a symptom of a right-kind one they can't articulate — "this will be influential" sometimes just means "this is central and true," and sometimes it means "this will be influential." Build in an elicitation step: a short question the editor can send back that would separate those two, and a rule for what to do when the referee doesn't answer it or answers it badly. Flag every step where you're sneakily encoding a contested philosophical view rather than doing neutral bookkeeping, and flag any place where two of the three accounts of the distinction you know would send the same consideration to different destinations.

  Then run it on three real-ish cases. (1) A report that says: recommend minor revisions, the identification strategy in section four is clean and I could not find a hole in it, though I want the board to know the author is early-career at a regional teaching university and we have not published anything on this country in six years. (2) A report that says: reject, "trust" is measured with a single survey item and cannot support the causal claim in the abstract, and separately this sub-literature is a fad and one more of these entrenches it and takes a slot from harder work. (3) The one I suspect will annoy me: a manuscript I personally want to publish, by someone whose work I've admired for years, which I'm confident will get cited alot; the only substantive objection came from a referee I know to be a crank with a grudge against this method, and I cannot actually answer his objection myself — I just know the kind of person he is. Tell me what your procedure does with my desire to overrule him, and whether there is anything at all I'm allowed to do with the fact that he's unreliable, or whether that fact is simply inadmissable and I have to either find a merits-based answer or send it out again. Finish with a short, blunt section on what the procedure cannot do: the cases where it goes quiet, the ones where it will confidently give a bad answer, and the distinction it can't draw no matter how it's written.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**
      *   **User:** Review editor at a small interdisciplinary journal (policy, ethics, social science). Reads ~15 referee reports/week. Signs off on every decision letter.
      *   **Problem:** Referee reports mix legitimate (paper-focused) and illegitimate (author-focused, consequence-focused, journal-focused) considerations. Current rule ("about paper" vs. "about author/consequences") is broken. Decision letters feel dishonest because they mash these together.
      *   **Goal:** A reusable procedure (checklist) to sort considerations into "legitimate for verdict" vs. "legitimate for editor/journal" vs. "illegitimate."
      *   **Constraints:**
          *   Two registers: Referee-facing (jargon-free, <20 mins, grad-student friendly) and Editor-facing (theoretical, for triage).
          *   Order of questions, sufficient answers, stop conditions ("does not enter"), hand-off conditions ("journal values").
          *   Handle "wrong-kind" reasons: Route them (Editor vs. Nowhere) rather than delete.
          *   Handle "symptom" reasons: Elicitation step to distinguish "influential because true/central" vs. "influential because trendy."
          *   Flag philosophical commitments and divergence points between the three accounts (question answered, reasons for attitude, object/state-given).
          *   Run on three specific cases (Early-career/diversity, Measurement/Fad, Editor bias/Crank referee).
          *   Final section: Limitations (where it goes quiet, confident bad answers, undrawable distinctions).
          *   **Strict Negative Constraint:** No bibliography, dates, or names. No survey of the literature.
          *   **Tone:** Professional, direct, practical, slightly philosophical but grounded.

  2.  **Deconstruct the Philosophical Core (Internal Monologue):**
      *   The user mentions three distinctions:
          1.  *Which question is being answered?* (Is it good? vs. Should we publish it?)
          2.  *Reasons for wanting the attitude?* (Reasons to believe it's good vs. reasons to want to believe it's good.)
          3.  *Object-given vs. State-given reasons.* (Reasons provided by the object's properties vs. reasons provided by the state of holding the attitude.)
      *   *Selection:* The "Object-given vs. State-given" distinction is the most robust for a checklist, but "Which question is being answered" is more intuitive for referees. I need to synthesize these into a practical flow. The core insight is: *Does this fact make the manuscript better, or does it make publishing the manuscript better?*
      *   *The "Broken" Rule:* "About paper = legitimate, about author/consequences = not."
      *   *The Fix:* We need to distinguish *epistemic/merit* reasons (truth, rigor, clarity) from *pragmatic/institutional* reasons (career help, field shaping, journal metrics). Both are real reasons, but they belong to different decision-makers. Referees assess merit. Editors assess fit/mission.
      *   *Philosophical Flag:* I need to acknowledge that prioritizing "merit" over "consequence" is itself a value judgment (academia's norm), but it's the necessary norm for this procedure to work.

  3.  **Drafting the Procedure - Referee Version:**
      *   *Audience:* First-year grad student, no philosophy.
      *   *Language:* Plain English. No "state-given."
      *   *Structure:* Flowchart style.
      *   *Key Filter:* "Does this make the argument stronger, or just the publication more useful?"
      *   *Routing:* If it's about the argument -> Verdict. If it's about the field/journal/author -> Note to Editor.
      *   *Elicitation:* If they say "important," ask "Important because it's right, or because people will read it?"

  4.  **Drafting the Procedure - Editor Version:**
      *   *Audience:* The User (Editor).
      *   *Language:* Can use the theoretical underpinnings.
      *   *Structure:* Triage logic.
      *   *Philosophical Flags:* Explicitly note where I'm choosing one distinction over another.
      *   *Handling the "Crank":* This is tricky. The referee's unreliability is a *state-given* reason to discount their report, but is it admissible? Yes, because it affects the *weight* of the evidence, not the *content* of the paper. It's a meta-evaluation of the review quality.

  5.  **Developing the Three Cases:**
      *   *Case 1 (Early Career/Diversity):* Merit is clean (identification). Author status is pragmatic. Diversity gap is journal mission.
          *   *Verdict:* Merit counts. Author status routes to Editor (for mission check).
      *   *Case 2 (Measurement/Fad):* Measurement is merit (reject). "Fad/Slot" is pragmatic (routes to Editor, likely discarded unless journal has a specific cap).
          *   *Verdict:* Merit counts. "Fad" is a policy question.
      *   *Case 3 (Editor Bias/Crank):* This is the hard one. The Editor's desire is a state-given reason (I want this published). The Referee's unreliability is a meta-reason.
          *   *Verdict:* Editor's desire is inadmissible for *merit*, but admissible for *mission* (if framed as "we need more of this"). Referee unreliability allows discounting the report, but requires a new report to resolve the substantive doubt. You can't overrule on merit without a counter-argument.

  6.  **Refining the "Philosophical Flags":**
      *   I need to be careful not to lecture but to annotate.
      *   *Flag 1:* The definition of "Merit." (Epistemic vs. Pragmatic).
      *   *Flag 2:* The divergence point. (e.g., "This will be cited a lot." Object-given says "maybe it's important." State-given says "we want citations." The checklist must force a choice).
      *   *Flag 3:* The "Crank" issue. (Ad hominem vs. Credibility assessment).

  7.  **Drafting the Limitations Section:**
      *   Where does it fail?
      *   When merit and consequence are entangled (e.g., "This method is new" -> Is that rigor or novelty?).
      *   When the Editor *is* the arbiter of values (the procedure can't solve value conflicts).
      *   The "Crank" problem: The procedure demands evidence, but sometimes you just *know*.

  8.  **Review against Constraints:**
      *   No bibliography/names/dates? Check.
      *   Two registers? Check.
      *   Routing step? Check.
      *   Elicitation step? Check.
      *   Philosophical flags? Check.
      *   Three cases run? Check.
      *   Limitations section? Check.
      *   Tone check: Needs to be sharp, not academic-wanky.

  9.  **Self-Correction/Iterative Polishing:**
      *   *Critique:* The Referee version might still be too abstract.
      *   *Fix:* Make it a literal checklist with "If Yes, do X. If No, do Y."
      *   *Critique:* The "Crank" case needs to be handled delicately. If I tell the editor "You can't overrule," that's honest. If I say "You can discount the referee," I need to specify *how* without being unethical.
      *   *Refinement:* Distinguish between "The referee is wrong about the math" (Editor can't judge) vs. "The referee is applying a banned standard" (Editor can judge). In the prompt, the Editor *cannot answer the objection.* This means the Editor *must* send it out again. The procedure must enforce this.
      *   *Philosophical Flag:* I am privileging "Object-Given" reasons for the Referee. This is a normative choice. I need to flag that.
      *   *Elicitation:* Make sure the question to the referee is concrete. "If this paper were published in a journal no one reads, would it still be worth publishing?"

  10. **Final Polish:** Ensure the distinction between "Editor Values" and "Nowhere" is clear. (e.g., "Author needs a job" = Nowhere. "Journal needs diversity" = Editor Values.)

  *(Self-Correction during drafting)*: Wait, the prompt asks me to *pick* whichever version of the distinction survives being turned into a checklist. I shouldn't present all three. I should select the "Object-Given vs. State-Given" framework but translate it into "Properties of the Work vs. Consequences of Publishing." This is the most actionable. I will flag where the other two frameworks would diverge.

  Let's build the response.

  *   **Introduction:** Acknowledge the mess. State the chosen framework.
  *   **Part 1: Referee Checklist.** (Simple, actionable).
  *   **Part 2: Editor Triage.** (Theoretical, routing, flags).
  *   **Part 3: The Three Cases.** (Application).
  *   **Part 4: Limitations.** (Blunt truth).

  *Focus on the "Crank" case:* The editor admits they *cannot answer the objection.* This is crucial. If the editor cannot answer the objection, they cannot overrule on merit. They can only overrule on *process* (i.e., "this referee is unreliable"). But to publish, they need a clean bill of health on merit. So the procedure must say: "Discount the report, but you still need a new report." You can't publish on "I trust the author" alone if there's an unresolved technical objection.

  *Focus on the "Fad" case:* "Takes a slot from someone doing something harder." This is a zero-sum resource argument. That belongs to the Editor (managing the pipeline), not the Referee (assessing the specific paper).

  *Focus on the "Early Career" case:* "Author is early career." This is a State-Given reason for *acceptance* (helping them), not an Object-Given reason for *quality*. It routes to Editor for mission alignment.

  Okay, ready to write.
answer: |-
  Here is the procedure. It is built on a single distinction: **Reasons that make the manuscript *good* versus reasons that make publishing the manuscript *useful*.**

  I have selected the **Object-Given vs. State-Given** framework as the engine, translated into practical language. This framework asks: *Does this fact describe the paper itself (Object), or does it describe the situation of publishing the paper (State)?* I have discarded the "Which question is being answered?" framework because referees often answer "Should we publish?" even when they mean "Is it true?" and the "Reasons for wanting the attitude" framework because it requires too much introspection. The Object/State split is the only one that survives contact with a twenty-minute deadline.

  ***

  ### Part 1: The Referee-Facing Checklist
  **Audience:** Referees (Grad students to Senior Faculty)
  **Time:** < 20 Minutes
  **Constraint:** No philosophy jargon.

  **Instructions:** Before submitting your report, scan your paragraphs for the following claims. For each claim, run this filter.

  **Step 1: The "Blind Test"**
  *   **Question:** If this paper were written by an anonymous author and published in a journal no one reads, would this fact still be true?
  *   **If YES:** This is a **Merit Consideration**. It belongs in your recommendation to the author/editor about the quality of the work. (e.g., "The math is wrong," "The argument is novel," "The literature review is incomplete.")
  *   **If NO:** This is a **Context Consideration**. It depends on who publishes it, who wrote it, or what happens after. Go to Step 2.

  **Step 2: The Routing Box**
  *   **Question:** Does this fact help the *Editor* decide if this journal is the right home for the paper?
  *   **If YES:** Place this in a separate section titled **"Notes to the Editor Only."** Do not include this in the comments to the author.
      *   *Examples:* "This fits a gap in your recent issues," "The author is early-career and needs a win," "This topic is trending and will drive traffic."
  *   **If NO:** **Delete it.** Do not write it down.
      *   *Examples:* "I dislike this author personally," "This subfield is annoying," "I want to save space for my own work."

  **Step 3: The "Importance" Elicitation (Required if using the word "Important")**
  *   **Trigger:** If you write that the paper is "important," "influential," or "significant."
  *   **Action:** You must append one of the following tags:
      *   **[Truth]:** "The findings are likely correct and change our understanding of X."
      *   **[Impact]:** "Many people will read/cite this, regardless of whether it is strictly correct."
  *   **Why:** If you tag **[Impact]**, this automatically moves to **"Notes to the Editor Only."** Only **[Truth]** counts toward the acceptance verdict.

  **Step 4: Stop Conditions**
  *   **Hard Stop:** If your primary reason for Reject/Accept is in the **"Notes to the Editor Only"** box, you cannot finalize a verdict. You must find a **Merit Consideration** (Step 1) to support the decision.
  *   **Hand-Off:** If you have no Merit Considerations but strong Context Considerations, submit the report as "No Technical Objection, Editor Discretion Required."

  ***

  ### Part 2: The Editor-Facing Triage Protocol
  **Audience:** You (The Editor)
  **Function:** Sorting reports, managing values, handling the "Crank."

  **Theoretical Basis:** This protocol treats **Merit Considerations** as *constitutive* of the journal's epistemic standard (truth/rigor) and **Context Considerations** as *regulative* of the journal's mission (scope/diversity/sustainability).

  **Philosophical Flag 1:** *The Normative Choice.* By separating Merit from Context, this procedure assumes that "Goodness" (truth/rigor) is distinct from "Goodness to Publish" (utility/mission). Some philosophical accounts argue these are inseparable (e.g., pragmatic epistemology). This procedure forces them apart to prevent mission-creep from corrupting peer review. **Divergence Point:** A "Reasons for Attitude" theorist might argue that "This will be influential" *is* a reason to believe the paper is good. This procedure classifies it as Context.

  **Step 1: The Merit Scan**
  *   **Action:** Read the Referee's **Merit Considerations** (Step 1 of their checklist).
  *   **Sufficient Answer:** Are there enough Merit Considerations to justify the Referee's recommended verdict (Accept/Reject/Revise)?
  *   **Failure Mode:** If the Referee recommends "Reject" based solely on Context Considerations (e.g., "Subfield is a fad"), **override the verdict.** The paper is technically sound; the rejection is a policy decision.
  *   **Failure Mode:** If the Referee recommends "Accept" based solely on Context Considerations (e.g., "Author needs a job"), **override the verdict.** You cannot accept a flawed paper for charitable reasons.

  **Step 2: The Context Routing**
  *   **Action:** Review the **"Notes to the Editor Only."**
  *   **Category A (Journal Mission):** "We haven't published on this country in six years," "This fits our special issue."
      *   **Action:** **Admissible.** These are valid reasons for *you* to accept a technically sound paper over another technically sound paper.
  *   **Category B (Author Welfare):** "Author is early-career," "Author is at a teaching school."
      *   **Action:** **Conditionally Admissible.** Only admissible if it aligns with a stated journal mission (e.g., "Supporting underrepresented institutions"). If the journal has no such mission, this is **Inadmissible.** It is charity, not editing.
  *   **Category C (Field Ecology):** "This subfield is a fad," "Takes a slot from harder work."
      *   **Action:** **Admissible but High Bar.** This is a portfolio management decision. You must verify if the journal actually has a cap on this subfield. If not, this is a personal preference, not policy. Discard.

  **Step 3: The Elicitation Follow-Up**
  *   **Trigger:** Referee tagged **[Impact]** on "Importance" but you suspect they mean **[Truth]**, or vice versa.
  *   **Action:** Send this exact query: *"You noted this paper will be influential. If this paper were published in a venue with zero readership, would its contribution to knowledge remain the same?"*
  *   **Rule for Non-Answer:** If the referee does not answer or says "No," you must treat the claim as **[Impact]** only. It cannot support a "Major Contribution" verdict. It can only support a "Strategic Fit" verdict.

  **Philosophical Flag 2:** *The Credibility Exception.* Usually, facts about the *author* (e.g., "This author is a liar") are State-Given and inadmissible for Merit. However, facts about the *Referee* (e.g., "This referee is a crank") are meta-evaluations of the evidence.
  *   **Rule:** You may discount a Referee's Merit Consideration if you have independent evidence of their unreliability (e.g., history of retractions, known grudge, demonstrable error in their report).
  *   **Limit:** You cannot substitute your judgment for the Merit Consideration. If the Referee raises a technical objection you cannot evaluate, and you discount the Referee, **you still have an unresolved technical objection.** You cannot publish until it is resolved.

  **Step 4: The Value Hand-Off**
  *   **Trigger:** The decision rests entirely on Context Considerations (e.g., Two papers are equally rigorous; one fits the mission better).
  *   **Action:** This is no longer a triage decision. This is a **Board Decision.** Document the rationale in the internal minutes. The decision letter to the author must cite Merit Considerations only. The Context Consideration remains internal.

  ***

  ### Part 3: Running the Cases

  #### Case 1: The Early-Career / Diversity Gap
  *   **Report:** "Minor Revisions. Identification is clean. Author is early-career at regional teaching university. Journal hasn't published on this country in six years."
  *   **Procedure Output:**
      *   **Merit:** "Identification is clean." -> **Valid.** Supports "Minor Revisions."
      *   **Context:** "Author is early-career..." -> **Route to Editor (Category B).** Check journal mission. If mission includes supporting diverse institutions, this breaks a tie. If not, it is inadmissible for the verdict, though you may note it internally.
      *   **Context:** "Haven't published on this country..." -> **Route to Editor (Category A).** Valid mission alignment.
      *   **Verdict:** Accept/Revise based on the identification strategy. The author's status and country gap are *tie-breakers* only, not *justifiers*.
      *   **Letter:** Cite the identification strategy. Do not mention the author's institution or the country gap.

  #### Case 2: The Measurement / Fad
  *   **Report:** "Reject. 'Trust' measure is single-item (cannot support causal claim). Sub-literature is a fad; takes a slot from harder work."
  *   **Procedure Output:**
      *   **Merit:** "Measure is single-item..." -> **Valid.** This is a technical flaw. Supports "Reject."
      *   **Context:** "Sub-literature is a fad..." -> **Route to Editor (Category C).**
      *   **Triage:** The Merit Consideration alone justifies rejection. The Context Consideration is irrelevant to the decision but explains the referee's intensity.
      *   **Verdict:** Reject.
      *   **Letter:** Cite the measurement issue. Do not mention the "fad."
      *   **Note:** If the measurement issue were ambiguous, the "fad" argument would be **Inadmissible.** You cannot reject a methodologically sound paper because the topic is trendy.

  #### Case 3: The Editor's Desire / The Crank Referee
  *   **Scenario:** You want to publish (high citation potential). One Referee says Reject (technical objection). You know the Referee is a crank. You cannot answer the technical objection yourself.
  *   **Procedure Output:**
      *   **Your Desire:** "I want to publish/cited." -> **Context (Category C/Impact).** Inadmissible for Merit. You cannot use your desire to override a technical objection.
      *   **Referee Reliability:** "Referee is a crank." -> **Meta-Evaluation (Philosophical Flag 2).** You are allowed to discount the *weight* of this report.
      *   **The Block:** You admitted: *"I cannot actually answer his objection myself."*
      *   **Result:** **Deadlock.**
      *   **Why:** Discounting the referee removes the *reason to reject*, but it does not create a *reason to accept*. The technical objection remains physically present in the manuscript, even if the source is unreliable.
      *   **Action:** You must **Send Out Again.** You need a new Merit Consideration that resolves the technical objection. You cannot overrule on merit without a counter-argument.
      *   **What you CAN do:** You can write to the author: "One referee raised X objection. We are seeking further clarification." You cannot write: "We accept despite X."
      *   **Philosophical Flag 3:** *The Ad Hominem Boundary.* Standard logic says ad hominem is a fallacy. Peer review is not pure logic; it is trust-based. Assessing the *trustworthiness of the assessor* is admissible. Assessing the *truth of the claim* without evidence is not. This procedure allows you to ignore the crank, but not to ignore the *objection* he raised, unless you can prove the objection is false.

  ***

  ### Part 4: Limitations (The Blunt Section)

  **1. The Entanglement Problem**
  The procedure fails when Merit and Context are conceptually fused. Example: "This method is innovative." Is that a Merit Claim (it works better) or a Context Claim (it's new)? The checklist forces a choice, but the referee may not know. In these cases, the procedure will confidently sort a hybrid reason into the wrong bin. You will have to manually intervene when "Novelty" is cited without proof of "Utility."

  **2. The "Confidently Bad" Answer**
  The procedure will confidently tell you to **Reject** a paper that is methodologically perfect but ethically disastrous (e.g., "Clean ID strategy, but uses data from an unethical regime"). The Referee Checklist categorizes ethics as "Context" (Notes to Editor) unless it violates data integrity rules. If your journal has no stated ethics policy, this procedure treats ethics as a tie-breaker, not a veto. It cannot generate moral value where none is codified.

  **3. The Undrawable Distinction**
  The procedure cannot distinguish between **"This is true"** and **"This is consensus."** A referee may say "This is correct" when they mean "This matches what we all believe." The Elicitation Step ("If no one reads it...") attempts to catch this, but sophisticated referees will game it. You will still receive reports that dress up conformity as truth. The procedure filters out the *blatant* appeals to popularity ("It's a fad"), but not the *subtle* ones ("It fits the literature").

  **4. The Editor's Trap**
  In Case 3 (The Crank), the procedure forbids you from publishing based on your intuition. This is the correct ethical outcome, but it is operationally expensive. It demands you spend more money/time on review to validate your hunch. The procedure protects the journal's integrity at the cost of the journal's efficiency. If you are willing to sacrifice integrity for speed, this procedure will feel like an obstruction. It is designed to be an obstruction.
