answer: |-
  You are not missing an obvious term. Your suspicion is correct: there is a gap in the literature. The phenomenon you describe sits precisely in the blind spot between Gricean pragmatics (which relies heavily on speaker intention to determine content) and ethical accounts of speech (which often rely on the distinction between lying and misleading).

  The standard tools fail because they presuppose a determinate propositional content that the speaker intends to convey (even if implicitly). In your cases, the speaker intends to shift the *epistemic landscape* (making certain possibilities salient) without intending to convey a specific *proposition* about that landscape. They are not trying to make you believe $p$; they are trying to make $p$ a live option while retaining the right to deny they suggested $p$.

  Here is an analysis of the near-misses, the relevant legal analog, and a proposed conceptual carving for your purposes.

  ### 1. The Near-Misses (and why they fail)

  *   **Conversational Implicature (Grice):** Requires the speaker to intend the hearer to think $p$, and to recognize that intention. Your speakers are agnostic about the specific $p$.
  *   **Insinuation:** In philosophical literature (e.g., Machina, Saul), insinuation typically involves a specific intended negative implication that the speaker wishes to disown. Your cases lack the specific intended content; the "negative implication" is generated by the hearer, not fixed by the speaker.
  *   **Paltering (Rogers et al.):** Involves using truthful statements to induce a *specific* false belief. Your speakers are not aiming at a specific belief, nor necessarily a false one.
  *   **Bullshit (Frankfurt):** Requires indifference to truth. Your speakers care that their literal statement is true.
  *   **Dog-Whistling (Stanley, Saul):** Involves a coded message for a specific in-group. Your phenomenon is broader; it works on anyone familiar with the relevant norms (e.g., hiring norms), and the "code" is not fixed (different hearers decode different suspicions).

  ### 2. The Legal Analog: "Innuendo"

  The closest established concept is found in defamation law, not philosophy of language. In libel law, **innuendo** refers to words that are innocent on their face but carry a defamatory meaning due to extrinsic facts known to the hearer.
  *   *Example:* "Mr. Smith visited a certain house on Tuesday." (Innocent). Extrinsic fact: The house is a known brothel. Defamatory meaning: Smith frequents brothels.
  *   *Relevance:* This captures the mechanism (literal truth + extrinsic context = negative uptake).
  *   *Limitation:* Law is concerned with liability for the *damage*, not the precise phenomenology of the speaker's *agnosticism*. A lawyer would argue the speaker *should have foreseen* the defamatory meaning (negligence), whereas you are interested in the speaker's actual mental state of uncertainty.

  ### 3. Proposed Concept: Agnostic Insinuation

  Since no standard term captures the *agnostic intent* combined with *epistemic shifting*, I propose you adopt the term **Agnostic Insinuation**.

  This distinguishes it from standard Insinuation (which implies a specific intended content) and Strategic Ambiguity (which is usually a political strategy to please multiple groups, rather than a local epistemic maneuver).

  #### Definition
  **Agnostic Insinuation** is a speech act wherein a speaker $S$ asserts a proposition $p$ (which is true) to a hearer $H$, with the following characteristics:
  1.  **Salience Shift:** $S$ foresees that $p$, in the current context $C$, will make a set of negative possibilities $\{q_1, q_2, ...\}$ salient to $H$.
  2.  **Content Agnosticism:** $S$ does not intend for $H$ to believe any specific $q_i$ is true, nor does $S$ believe any specific $q_i$ is true. $S$ intends only to make the *risk* of $\{q\}$ live.
  3.  **Commitment Withdrawal:** $S$ retains a defensive posture wherein they refuse to endorse any specific $q_i$ if challenged, retreating to the literal truth of $p$.
  4.  **Epistemic Cost:** The utterance increases the entropy of $H$'s epistemic state regarding the subject (increasing suspicion without providing evidence), leaving $H$ epistemically worse off.

  ### 4. The Carving: Boundary Conditions

  For your dissertation, you need to know where the boundaries lie. Here is how to distinguish Agnostic Insinuation from neighboring phenomena.

  #### A. The Intention Condition (Recklessness vs. Negligence)
  *   **Standard Insinuation:** $S$ intends $H$ to believe $q$.
  *   **Good Faith Warning:** $S$ believes $q$ is a relevant risk and intends $H$ to investigate $q$.
  *   **Agnostic Insinuation:** $S$ does not believe $q$ is necessarily true, but *foresees* that mentioning $p$ will trigger suspicion.
      *   *Boundary:* The category applies even if $S$ is "unsure what they meant," provided $S$ is a competent participant in the practice (e.g., a tenured professor in a hiring committee). Competence implies **foreseeability**. If a competent speaker knows the code ("enthusiastic" = "weak"), uttering the code without endorsement is a **reckless** epistemic act, even if not a **deliberate** one. The intention is not to convey $q$, but to *offload the risk* of $q$ onto the communal epistemic space without owning it.

  #### B. The Truth of the Suspicion
  *   **Does it matter if $q$ is true?** No.
  *   *Reasoning:* If the candidate *did* have weak letters, the colleague's move is still an Agnostic Insinuation. The ethical defect is not in the falsity of the suspicion, but in the **method of introduction**. The speaker has introduced a defeater for the candidate's credibility without subjecting that defeater to the norms of assertion (evidence, commitment, defense).
  *   *Boundary:* If the speaker says, "I have reservations about the letters because X," they are making an assertion. If they say, "The letters are enthusiastic," they are performing an Agnostic Insinuation. The truth of the underlying suspicion does not sanitize the speech act.

  #### C. Divergent Hearers (Indeterminacy)
  *   **Is it a problem if hearers infer different $q$'s?** No, this is a **feature** of the category.
  *   *Reasoning:* In standard implicature, divergence indicates communication failure. In Agnostic Insinuation, divergence is functional. It allows the speaker to poison the well for multiple reasons simultaneously (e.g., "referees don't know her" AND "she padded her CV").
  *   *Boundary:* If the speaker clarifies, "I mean specifically that the referees are junior," they collapse the Agnostic Insinuation into a standard Assertion or Implicature. The category *requires* the maintenance of indeterminacy.

  #### D. Distinction from Good Faith Relevance (The "Flagging" Defense)
  This is the most critical boundary for your work. Your colleague will say: "I was just flagging relevant context."
  *   **Good Faith Flagging:** The speaker introduces $p$ to aid the hearer's evaluation, and is **willing to elaborate** on why $p$ matters.
      *   *Test:* If asked, "Does that mean you think the letters are unreliable?", a good-faith speaker answers "Yes," "No," or "I'm not sure, but we should check."
  *   **Agnostic Insinuation:** The speaker introduces $p$ and **refuses to elaborate** on the inferential path.
      *   *Test:* If asked, "Does that mean you think the letters are unreliable?", the speaker replies, "I only said they were enthusiastic."
  *   *The Carving:* The distinction lies in **Responsiveness to the QUD (Question Under Discussion)**. In a search committee, the QUD is "Should we hire this candidate?"
      *   Good faith contributions advance the QUD by adding evidence or analysis.
      *   Agnostic Insinuations stall the QUD by introducing noise that requires others to do the epistemic labor of verification, while the speaker opts out of that labor.

  ### 5. Why this matters for Ethics of Assertion

  This concept allows you to argue that there is a normative violation here that is not lying, not misleading, and not bullshit. It is a violation of **Epistemic Responsibility**.

  By shifting salience without accepting commitment, the speaker violates the **Norm of Assertoric Responsibility** (even if they haven't technically asserted the damaging content). They are exploiting the gap between *semantic content* and *pragmatic uptake* to distribute epistemic risk (suspicion) without accepting epistemic cost (accountability).

  In your dissertation, you can frame this as a failure of **Testimonial Justice** (Fricker). The speaker is not giving the candidate a fair hearing because they are introducing doubts they are unwilling to substantiate, effectively weaponizing the "code" of the profession while claiming ignorance of the code.

  ### Summary for your purposes:
  *   **Term:** Agnostic Insinuation.
  *   **Core Mechanism:** Salience-shifting without commitment.
  *   **Key Boundary:** Willingness to elaborate on the inferential path distinguishes it from good-faith flagging.
  *   **Ethical Charge:** Reckless epistemic pollution (offloading suspicion without evidence).

  This carving should give you the grip you need to analyze the peer reviews and committee discussions without forcing them into categories (like lying or implicature) that the speakers can easily evade.
