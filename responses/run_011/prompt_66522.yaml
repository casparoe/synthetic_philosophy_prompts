          *   To get Doomsday, you must sample from "All Observers." But you *know* you are in the specific subset "Observers at rank $n$." Rule (c) says use the specific one. Rule (g)/(h) says use the general one.
          *   *Severity:* Critical. This is the "Smoking Gun."

  4.  **Drafting the Response:**

      *   **Acknowledge the stakes:** Honours thesis, reading group, friend's smirk.
      *   **Structure:**
