prompt: |-
  So I'm applying for a nine-month postdoc at one of those interdisciplinary institutes that funds "big question" projects, and the panel is going to include an astrobiologist and somebody from a policy school, so it can't read like a philosophy seminar handout. Deadline's in three weeks and I need a two-page proposal, but my idea is still basically a bar-napkin sketch. It came out of an argument with my roommate, who works in reinsurance. He kept insisting that whether a backup is worth buying has almost nothing to do with how catastrophic the loss would be and everything to do with correlation — a backup that fails in exactly the same circumstances as the thing it's backing up is worth zero, and insurers price that in ruthlessly. And it struck me that basically the entire debate over whether we should spread humanity beyond Earth gets conducted as if the crux is how bad extinction would be, or how we should weigh the far future, or whether we're allowed to terraform a planet that might have its own microbial life. Nobody in the arguments I've read actually stops to ask the structural question: is a colony a *hedge*, and against which risks specifically?

  Here's what I half-suspect, and what I'd want the proposal to develop rather than just restate. First, the hedging value of a second planet isn't a single number — it varies enormously by category of catastrophe, and the categories that do the work aren't the standard ones people use. An impact or a nearby supernova correlates with Earth at basically zero; a pathogen engineered in a lab correlates a lot; and something like a global breakdown of coordination, where the disaster *is* the failure to solve collective action problems, correlates almost perfectly, because the colonists are the same species with the same institutions and they shipped the failure mode with them. Second, and I think this is the actually interesting part, the correlation isn't a fixed fact about Mars or wherever — it's designed. A colony that's genuinely self-sufficient from launch and one that's continuously resupplied and dependent on Earth for parts, software and genetic diversity are so different in their risk profile that "become multiplanetary" isn't one option at all but a family of options with wildly different moral weights, and the debate treats them as interchangeable. Third, there's a moral hazard layer that I don't think the pro-colonization side ever confronts: the availability of a credible exit changes how much the people who stay behind are willing to invest in the place they're staying in. Hirschman's exit/voice point seems to me to apply almost too neatly. So the question I want sharpened is roughly: does the backup-planet argument survive being made precise, or does it turn out to rest on unstated corrolation assumptions that flip the conclusion for most of the risk categories people actually have in mind?

  Can you turn that into the proposal? I need a precise statement of the question — precise enough that it has a determinate answer and isn't just "space ethics, complicated"; a section on why both camps (the we-must-become-multiplanetary people and the colonization-is-a-moral-distraction-from-Earth people) leave it open, since I think they're actually arguing past each other; the method, month by month, and I specifically need you to say what a philosopher contributes here beyond re-running someone else's spreadsheet, because that's the first thing the policy person on the panel will ask; what a result would look like (I'm thinking one paper plus a workshop that gets the risk-modeling people and the ethics people in a room together); what would count as the project failing; and an honest scope check for nine months alongside teaching one course. On failure conditions, please be blunt about the worry I already have, which is that this collapses into an empirical question about correlation coefficients that I have no way of settling from an armchair, and that the whole thing is really just a plea for better modeling rather than philosophy — if that's fatal, say so and tell me how to reframe. No bibliography or lit review, I'll add my own references once the framing is fixed. What I need from you is the argument that the work is worth doing and can actually be done in the time.
