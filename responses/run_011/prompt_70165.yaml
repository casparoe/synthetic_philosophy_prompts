answer: |-
  1. **Map the actors and acts precisely.**
     *   **Germany:** Expulsion. This is not an exercise of a right to exclude (keeping out), but a right to eject (forcing out). The theories provided focus on reception, not expulsion, leaving this act theoretically unclassified here.
     *   **Cuba:** Revocation of landing certificates. This is not standard exclusion (denying initial entry) but the retraction of a granted permission. It functions as exclusion but relies on administrative fiat rather than border control.
     *   **United States:** Refusal to admit (quota enforcement) and interdiction (Coast Guard shadowing to prevent landing). These are clear exercises of the right to exclude. The interdiction extends exclusion beyond the territorial line to the contiguous zone.
     *   **European States (UK, France, Belgium, Netherlands):** Acceptance. This is an exercise of discretion to include, implying a prior right to exclude was waived.
     *   **Shading:** The Cuban act shades into breach of contract or fraud rather than sovereign border control. The US interdiction shades into enforcement of domestic administrative law (visa requirements) rather than a substantive judgment on the migrants' claim to enter. The theories describe exclusion as a sovereign prerogative; here, it is often bureaucratic compliance.

  2. **Consider the sequencing problem.**
     *   **The Problem:** The US refusal was based on quota exhaustion, not a blanket ban. The claim was "not now," not "never."
     *   **Theory Check:** The national-partiality and communitarian accounts justify exclusion to protect resources or culture for existing members. Admitting the *St. Louis* passengers would not necessarily exceed the *total* number the state was willing to absorb over time, only the number allowed *this year*.
     *   **Conceptual Vocabulary:** The literature lacks vocabulary for "queue justice." It treats exclusion as binary (in/out) rather than temporal (now/later).
     *   **Whose Wrong:** If the US admits the *St. Louis* passengers, it displaces others on the waiting list. The theories do not specify whether the state owes a duty to the queue (fairness among outsiders) or only to its citizens (protecting the queue integrity). If the right to exclude is for the benefit of citizens, displacing the queue harms no citizen directly, suggesting the refusal was not required by the theory, only permitted by the bureaucracy.

  3. **Consider the bilateral structure.**
     *   **Standard Model:** One gatekeeper (receiver), one outsider (migrant). Assumes the migrant has a default location (home).
     *   **Case Reality:** Two gatekeepers (sender pushing, receiver blocking). Germany actively stripped assets and citizenship status (de facto), making the migrants stateless.
     *   **Theoretical Impact:** The right-to-exclude theories assume the migrant retains membership somewhere. When the sending state voids that membership, the receiving state's exclusion ceases to be a refusal of entry and becomes a refusal of rescue.
     *   **Analysis:** A theory framed around the receiving state's prerogative cannot account for the sender's coercion. If the sender makes stay impossible, the receiver's right to exclude transforms into a power to determine life or death. The theories provided do not integrate the sender's actions into the receiver's moral calculus.

  4. **Consider the revoked permission.**
     *   **The Act:** Cuba invalidated certificates purchased in good faith.
     *   **Classification:** This is not exclusion in the sovereign sense (deciding who belongs); it is the revocation of a specific license.
     *   **Theory Check:** The right to exclude generally covers the initial decision to admit. It is silent on whether a state may retract admission after reliance has been incurred.
     *   **Reliance:** The passengers rearranged lives based on the certificates. This introduces a reliance interest akin to contract or estoppel. None of the described theories (communitarian, association, partiality) account for reliance interests. They treat border control as a continuous sovereign right, not a transactional one. If the right to exclude covers retraction of granted permissions, it is unlimited; if it does not, the Cuban act was outside the scope of the right.

  5. **Consider interdiction without adjudication.**
     *   **The Act:** US prevented landing based on paperwork; no hearing was held.
     *   **Theory Check:** The freedom-of-association account argues a state (like a private club) need not justify non-association to outsiders. The communitarian account argues for self-determination, not procedural justice.
     *   **Silence:** None of the theories described distinguish between refusing entry after a hearing and preventing arrival to avoid a hearing. They justify the *outcome* (exclusion), not the *process*.
     *   **Implication:** If the right to exclude is absolute, procedure is irrelevant. If the right has limits (e.g., life/death), procedure becomes crucial to identify those limits. The theories lack a mechanism to trigger the exception clause without a hearing.

  6. **Consider whether the right to exclude is held severally or jointly.**
     *   **The Condition:** "Nowhere else to go" is a systemic property, not a single-state decision.
     *   **Fallacy of Composition:** Yes. It is possible that every state acts permissibly in isolation (respecting quotas/procedures) while the collective outcome is impermissible (death of refugees).
     *   **Theory Check:** The communitarian account explicitly acknowledges the limit case ("exclusion loses its justification when it becomes a matter of life and death for people with nowhere else to go"). This theory handles the system-level question by imposing a conditional cap on the several right.
     *   **Other Theories:** The freedom-of-association and national-partiality accounts, as described, do not explicitly contain this systemic limit. They operate one state at a time. They risk validating the collective outcome by validating each individual refusal.
     *   **Silence:** The literature largely operates methodologically nationalist. It does not provide a framework for coordinating exclusion rights to prevent systemic lethal outcomes, except for the communitarian exception clause.

  7. **Give me the verdict in both directions.**
     *   **Against the Right to Exclude:** The *St. Louis* is the limit case the communitarian account conceded in advance. For that theory, it is not a refutation but a trigger for the exception. For the freedom-of-association and national-partiality accounts, it is a refutation *unless* they adopt the communitarian limit. If they do not admit a life/death exception, the case refutes them. If they do admit it, the theory survives but offers no guidance on how to identify the limit before deaths occur.
     *   **For Open Borders:** The case supports the "feudal privilege" claim (citizenship determined survival). However, it does not necessarily argue for open borders (free movement for labor); it argues for a duty of asylum (rescue from death).
     *   **Argumentative Work:** The episode does work for open borders only if one argues that the "life/death" exception is so frequent or hard to delineate that a general right to exclude is untenable. If the exception is rare, the right to exclude stands.
     *   **Exception Clauses:** If the exception clauses fire in exactly the cases that motivate the debate (refugees), the theory becomes a theory of "open borders for refugees, closed for others." If the theory cannot distinguish refugees from economic migrants without adjudication (see point 5), the rule collapses into discretion.

  8. **Mark clearly where the theories are silent.**
     *   **Procedural Justice:** None of the theories address the requirement for a hearing to determine if the "life/death" exception applies.
     *   **Reliance Interests:** None address the moral weight of revoked visas or certificates.
     *   **Expulsion:** None address the sender state's role in creating the refugee condition.
     *   **Queue Management:** None address the fairness of sequencing among excluded outsiders.
     *   **Coordination:** Except for the communitarian limit case, none address the collective action problem of multiple states excluding the same group.
     *   **Interdiction:** None distinguish between turning back a ship at the border versus shadowing it in international waters to prevent approach.
