prompt: |-
  I teach an upper-level seminar cross-listed between philosophy of biology and metaethics, on the theme of whether teleological talk can be made respectable without minds. It's a closed-book final and I need one essay question worth 25 marks, answerable in 50 minutes, plus a model answer of about 650 words and a marking scheme.

  The topic is what I'll loosely call free-floating rationales — the Dennettian idea that a trait can have a rationale, an answer to the question "why this rather than that," that nobody ever represented: the design is explained by a benefit it conferred, but no mind anywhere ever had that benefit in view. The slogan version is reasons without reasoners. The question has to push past the slogan, because half my students will happily recite the intentional stance and etiological function theories back at me and think they've said something.

  Here's the twist I want built into the stem, so give students the case in the question itself rather than assuming they know the biology: sea turtle hatchlings crawl toward the brightest low horizon, which for millions of years was the ocean reflecting sky and moonlight; on a developed coast the brightest horizon is now a streetlight or a hotel lobby, and the hatchlings crawl inland and die. Suppose also — this is the part I want the question to hang on — that the coastal population has been crashing for only a few generations, nowhere near long enough for selection to have altered the orientation response, so the trait is currently being winnowed but hasn't been replaced or repaired by anything else.

  The question should make students answer something like: is there still a rationale for the orientation response, and if so whose interests does it track — the ancestral environment's, the current one's, or the biologist's? Then the harder half: can a rationale of this kind ever be a reason in the normative sense, a reason for someone, or does it only ever explain why a thing is the way it is? I want a genuine crux here, and the one I have in mind is that a rationale which "floats free" of the organism still seems to need an ascriber to be a rationale at all — so the slogan may covertly relocate the reasoner rather than eliminate it, and a student should be able to say whether the instrumentalist and the realist about such rationales pay different prices for that. Don't state that crux in the stem, obviously; that's what the marks are for.

  Deliverables:

  1. The exam question as students would see it, with the case spelled out in the stem, timed and marked (25 marks). No references, no "cite the literature" instructions — it's closed-book.

  2. A model answer, roughly 650 words, that actually resolves the crux instead of surveying positions.

  3. A marking scheme that seperates an A from a B by naming the specific moves. I want it itemised: five or six must-hit points, the marks each carries, totalling 25, and for each one a line on how students typically botch it — e.g. sliding from "explains why the trait exists" to "counts in favour of the turtle doing it," or treating the mismatch case as if it settled the question when it only forces a choice between historical and current-fit readings, or declaring the whole notion a harmless metaphor and thereby losing the explanatory work it was doing.

  4. A short list of three or four claims that should cost marks outright, the kinds of thing that sound sophisticated but show the student hasn't got it.
reasoning: |-
  Here's a thinking process that leads to the suggested exam materials:

  1.  **Analyze the Request:**
      *   **Course:** Upper-level seminar (Philosophy of Biology + Metaethics).
      *   **Theme:** Teleological talk without minds (Free-floating rationales, Dennettian "reasons without reasoners").
      *   **Task:** Create a closed-book final exam question (25 marks, 50 mins), a model answer (~650 words), a marking scheme (itemized, 5-6 points), and a list of "penalty claims."
      *   **Specific Case:** Sea turtle hatchlings orienting toward the brightest horizon (historically ocean/sky, now often streetlights/hotels). Population crashing, but not enough time for selection to fix it.
      *   **Key Philosophical Crux:** Is there still a rationale? Whose interests does it track? Can a free-floating rationale ever be a *normative reason* (a reason *for* someone) or just an explanation? Does the "free-floating" view covertly relocate the reasoner (the biologist/interpreter) rather than eliminating them? Instrumentalist vs. Realist costs.
      *   **Constraint:** Do not state the crux in the stem. Students must discover it. No citations (closed book).

  2.  **Drafting the Exam Question:**
      *   *Goal:* Present the turtle case clearly, set the constraints (no selection time for fix), and ask the two-part question (Status of the rationale + Normative force/Reasoner relocation).
      *   *Tone:* Academic, precise, challenging.
      *   *Stem:* Describe the turtle behavior, the mismatch (streetlights), and the evolutionary timing (too fast for adaptation).
      *   *Prompt:* Ask about the existence/nature of the rationale and whether it constitutes a normative reason or requires an ascriber.
      *   *Drafting:* "Consider the following case..." [Insert turtle details]. "In light of this..." [Ask about the rationale's status and the 'reasons without reasoners' slogan]. "Specifically..." [Address the normative vs. explanatory distinction and the role of the interpreter].

  3.  **Drafting the Model Answer:**
      *   *Goal:* Resolve the crux, not just survey. ~650 words.
      *   *Structure:*
          1.  Identify the tension: Historical function vs. Current utility.
          2.  Analyze the "Rationale": It exists etiological (past), but fails instrumentally (present).
          3.  Address the "Reasoner" problem: Does the rationale float free, or does the biologist supply the normativity?
          4.  Metaethical pivot: Explanation vs. Justification.
          5.  Conclusion: Instrumentalism saves the talk but admits the reasoner is the interpreter; Realism struggles with the mismatch.
      *   *Key Argument:* The "rationale" is real as an *explanation of origin* (etiological function), but it is not a *normative reason for the turtle* now. The "free-floating" nature is an artifact of the biologist's stance. If it's a reason *for* the turtle, the turtle fails. If it's a reason *for* the gene, the gene is losing. The "reason" exists only relative to a goal (survival) ascribed by an observer.
      *   *Word Count Check:* Need to be concise but dense.
      *   *Refining the Crux:* The model answer must explicitly tackle the "relocation of the reasoner." The slogan "reasons without reasoners" is stable only if we mean "explanatory patterns," not "normative forces." If we mean normative forces, the biologist is the covert reasoner.

  4.  **Developing the Marking Scheme:**
      *   *Goal:* Distinguish A from B. Itemized, 5-6 points, total 25. Include "typical botch."
      *   *Point 1: Etiological vs. Current Function.* (5 marks). Must distinguish past success from current failure. *Botch:* Confusing the two or saying the function disappeared.
      *   *Point 2: Status of the Rationale.* (5 marks). Is it real? Yes, as history. No, as current guide. *Botch:* Saying it's "false" now.
      *   *Point 3: Normative Force.* (5 marks). Does it count in favor? No, not for the turtle. *Botch:* Sliding from "explains" to "justifies."
      *   *Point 4: The Reasoner Relocation.* (5 marks). Who holds the norm? The biologist/observer. *Botch:* Ignoring the observer's role.
      *   *Point 5: Instrumentalism vs. Realism.* (5 marks). Cost of each view. *Botch:* Treating them as identical or ignoring the cost.
      *   *Total:* 25 marks.

  5.  **Identifying "Penalty Claims":**
      *   *Goal:* Sophisticated-sounding but wrong.
      *   *Examples:*
          *   "Teleology is just a metaphor." (Dismissive, loses explanatory power).
          *   "The turtle intends to go to the ocean." (Anthropomorphism).
          *   "Natural selection is a mind, so there is a reasoner." (Category error).
          *   "The function changed because the environment changed." (Confuses etiological function with current utility).

  6.  **Review and Refine:**
      *   *Check against constraints:* 50 mins? Yes, 25 marks is standard for that. 650 words? I need to monitor the model answer length. Closed book? Yes, no citations.
      *   *Tone Check:* Is it upper-level? Yes, requires distinguishing etiological function from normative reasons.
      *   *Crux Check:* Does the model answer actually resolve the "relocation of the reasoner"? Yes, by arguing that normativity requires a stance.

      *(Self-Correction during drafting Model Answer)*: I need to make sure I don't just say "Dennett says X." I need to argue *through* the concepts. The prompt asks to resolve the crux. The resolution is that "free-floating rationales" are explanatory tools for *us*, not normative forces for *them*. The "reasoner" is the interpreter adopting the intentional stance.

      *(Self-Correction on Marking Scheme)*: Ensure the "typical botch" is specific to the philosophy, not just "bad writing." E.g., "Conflating etiological history with current normative force."

      *(Word Count Check)*: The model answer needs to be tight. I will draft it and count.

      *(Final Polish)*: Ensure the question stem doesn't give away the "reasoner relocation" point. It should ask about the rationale's status and the normative/explanatory divide.

  7.  **Final Output Generation** (Proceeding to generate the response based on these thoughts).

      *Wait, one detail:* The prompt asks for "reasons without reasoners." The model answer needs to address whether this slogan holds up in the mismatch case.
      *Argument:* In the mismatch case, the "reason" (go to bright light) no longer aligns with the "good" (survival). If the rationale is free-floating, it should persist. It does persist as an *explanation* of behavior, but it ceases to be a *reason for action* that succeeds. The "reasoner" is the one who cares about survival (the biologist/evolutionary lens). So the reasoner is relocated to the observer.

      *Okay, ready to write.*
answer: |-
  ### 1. Exam Question

  **Time Allowed:** 50 Minutes
  **Total Marks:** 25

  **Question 1**

  Consider the following case: Sea turtle hatchlings possess an innate orientation response to crawl toward the brightest low horizon. For millions of years, the brightest horizon was the ocean reflecting the sky and moonlight, ensuring survival. On many developed coasts today, the brightest horizon is a streetlight or hotel lobby. Hatchlings following this cue crawl inland and die. Assume the coastal population has been crashing for only a few generations—nowhere near enough time for natural selection to alter the orientation response or replace it with a new mechanism. The trait is currently being winnowed, but the mechanism remains unchanged.

  Proponents of "free-floating rationales" argue that biological traits embody answers to the question "why this rather than that?" even when no mind ever represented those answers. This is often sloganized as "reasons without reasoners."

  In light of the turtle case:
  (a) Does the orientation response still possess a teleological rationale? If so, does that rationale track the ancestral environment, the current environment, or the biologist's explanatory framework?
  (b) Can a rationale of this kind ever constitute a *normative reason* (a consideration that counts in favour of an action) for the organism, or does it merely explain why the organism acts?

  In your answer, address whether the notion of a "free-floating rationale" successfully eliminates the need for a mind, or whether it covertly relocates the reasoner elsewhere.

  ***

  ### 2. Model Answer

  The turtle case forces a distinction between the historical origin of a trait and its current normative force. To answer (a): Yes, the orientation response still possesses a teleological rationale, but only under an etiological reading. The rationale is that the trait was selected *because* it led to the ocean in the ancestral environment. This rationale is historical; it explains the trait's presence now by referencing past success. It does not track the current environment, where the "brightest horizon" rationale leads to death. Nor does it track the biologist's framework directly, though the biologist is required to identify the rationale as such. The rationale is "free-floating" only in the sense that no turtle represented it, not in the sense that it is unmoored from history.

  This leads to (b): The distinction between explanation and justification. An etiological rationale explains why the turtle crawls toward the light. It does not, in the current context, provide a normative reason *for* the turtle to do so. A normative reason must count in favour of an action relative to a goal. If the goal is survival, the rationale is currently defective. If the goal is "doing what ancestors did," it is successful, but that is not a biological norm. Therefore, the rationale explains the behaviour but fails to justify it in the current context.

  This exposes the crux of the "reasons without reasoners" slogan. If a rationale is merely an explanatory pattern (the intentional stance), it floats free of the organism's mind but remains dependent on the interpreter's interest. The biologist adopts the stance to predict behaviour; the "reason" exists relative to that predictive framework. In the mismatch case, the biologist sees the error precisely because the biologist holds the goal (survival) constant while the environment shifts. The turtle does not hold the goal; the turtle simply executes the mechanism.

  Consequently, the slogan "reasons without reasoners" is ambiguous. It is true if it means "explanatory patterns without conscious representation." It is false if it means "normative forces without an evaluator." Normativity requires a standpoint from which something counts as "better" or "worse." In the turtle case, the "better" outcome (ocean) is not better for the turtle in the moment—the turtle has no concept of it. It is better for the lineage, but the lineage is not an agent. It is better relative to the evolutionary theorist's ascription of function.

  Thus, the free-floating rationale does not eliminate the mind; it relocates the reasoner from the organism to the interpreter. The instrumentalist accepts this: teleological talk is a tool for the biologist, not a feature of the world independent of description. The realist, who claims the rationale is mind-independently real, faces a cost: they must explain how a "reason" can persist when it systematically produces failure. If the reason is real, why is it wrong? The only coherent answer is that the "rightness" of the reason is relative to the historical conditions of its selection, which no longer exist.

  Ultimately, the turtle case shows that free-floating rationales are robust as historical explanations but fragile as normative guides. They require a reasoner to sustain the normativity, even if that reasoner is the observer adopting the intentional stance rather than the agent performing the action. To treat the rationale as a reason *for* the turtle is to confuse the cause of the behaviour with a justification for it. The slogan survives only by retreating from metaethics to philosophy of science: there are reasons *for us* to explain the turtle, but no reasons *for the turtle* to crawl, only causes.

  ***

  ### 3. Marking Scheme

  **Total: 25 Marks**

  **1. Distinction between Etiological and Current Function (5 Marks)**
  *   **Full Marks:** Clearly distinguishes that the rationale exists historically (ancestral success) but fails instrumentally (current death). Identifies that the trait persists due to lag, not current utility.
  *   **Typical Botch:** Claims the function "disappeared" when the environment changed (confusing etiological function with current utility) or claims the function is now "to die" (absurd).

  **2. Status of the Rationale in Mismatch (5 Marks)**
  *   **Full Marks:** Argues the rationale persists as an explanation of *presence* but not as a guide for *success*. Identifies it tracks the ancestral environment, not the current one.
  *   **Typical Botch:** Treats the mismatch case as disproving teleology entirely, rather than forcing a choice between historical vs. current-fit readings.

  **3. Explanation vs. Normative Justification (5 Marks)**
  *   **Full Marks:** Explicitly separates "explains why it happens" (causal/historical) from "counts in favour of doing it" (normative). Concludes it is the former, not the latter, in the mismatch case.
  *   **Typical Botch:** Sliding from "this explains the trait" to "this justifies the behaviour" without noticing the shift.

  **4. The Relocation of the Reasoner (5 Marks)**
  *   **Full Marks:** Identifies that if normativity exists, it resides with the interpreter (biologist/observer) who ascribes the goal, not the organism. Addresses the "covert relocation" crux.
  *   **Typical Botch:** Ignores the role of the observer entirely, treating the rationale as a ghostly force existing in nature independently of any stance.

  **5. Instrumentalist vs. Realist Costs (5 Marks)**
  *   **Full Marks:** Articulates the trade-off: Instrumentalism saves the talk by admitting it's our tool; Realism struggles to explain how a "real" reason leads to systematic failure.
  *   **Typical Botch:** Declares the whole notion a "harmless metaphor" (loses explanatory work) or insists Realism has no costs (ignores the mismatch problem).

  ***

  ### 4. Penalty Claims (Automatic Deductions)

  *If a student makes any of the following claims, deduct 2 marks per claim (max 6 marks total), regardless of other content.*

  1.  **"Natural Selection is a mind, so there is a reasoner."**
      *   *Reason:* Category error. Selection is a blind process; attributing mindedness to it misunderstands the core problem of free-floating rationales.
  2.  **"The turtle intends to go to the ocean."**
      *   *Reason:* Anthropomorphism. The prompt specifies an innate response; attributing conscious intent bypasses the philosophical problem of non-conscious teleology.
  3.  **"Teleology is just a metaphor and explains nothing."**
      *   *Reason:* Dismissive. The course assumes teleological talk has explanatory work to do; dismissing it outright avoids the seminar's central debate.
  4.  **"The function changed because the environment changed."**
      *   *Reason:* Conceptual error. On the standard etiological account (Millikan/Neander), function is fixed by history, not current context. This shows a lack of technical grasp.
