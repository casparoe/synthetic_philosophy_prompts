prompt: |-
  so my practical ethics tutor asked us each to write down where we actually stand on duties of rescue before we do the famine week, and I want to know if my set hangs together before I hand it in. Here's what I wrote:

  (1) if you can prevent something very bad without giving up anything comparably important morally, you ought to — the shallow pond case is what convinces me, and I don't think it needs any aggregation of consequences to work.
  (2) distance, nationality and how many bystanders are standing around doing nothing are all morally irrelevant. A child drowning in front of you and a child dying of malaria four thousand miles away are the same situation.
  (3) but I don't accept giving until marginal utility. The requirement is a substantial fixed share of income — for me maybe 10% — and past that, giving more is good but optional.
  (4) the reason for the cap isnt just that it'd be hard. Going far beyond your share lets governments and rich countries off the hook, and I think that changes what you should do, not merely how hard it is.
  (5) I also have agent-relative reasons from promises, relationships and family that don't reduce to outcomes.
  (6) in the pond case you have to wade in even if it ruins your suit and blows an interview you spent months prepping for, because that cost is trivial next to a life.
  (7) comfortably-off non-donors are doing something wrong, but I don't think we should shame people, and I'd sooner praise the 10% giver than lecture the 0% one.

  Go through these and tell me which ones genuinely pull against each other, worst first, and for each say what I'd have to give up and what that costs me. I'm pretty sure at least one pair only looks like a problem — say which and why. American English please.
reasoning: |-
  Here's a thinking process that leads to the suggested feedback:

  1.  **Analyze the Request:**
      *   **Task:** Evaluate a set of 7 ethical principles/positions regarding duties of rescue for coherence/consistency.
      *   **Context:** Practical ethics tutor, pre-famine week assignment (likely Peter Singer-esque context).
      *   **Output:** Identify contradictions/tensions (worst first), explain what needs to be given up to resolve them, and assess the cost of that resolution. Identify one pair that only *looks* like a problem but isn't.
      *   **Tone/Style:** American English, analytical, constructive.

  2.  **Analyze the 7 Principles:**
      *   (1) **Singer's Strong Principle (modified):** Prevent bad without sacrificing comparably important moral good. Shallow pond intuition. No aggregation needed.
      *   (2) **Impartiality/Distance:** Distance, nationality, bystanders irrelevant. Near vs. far is morally same.
      *   (3) **Cap on Duty:** Reject marginal utility (Singer's Strong Principle usually leads here). Proposes a fixed share (10%). Beyond that, supererogatory.
      *   (4) **Justification for Cap:** Structural/Political. Over-giving lets governments off the hook. This changes *what you should do* (deontological/structural claim), not just difficulty.
      *   (5) **Agent-Relative Reasons:** Promises, relationships, family matter independently of outcomes (Non-consequentialist).
      *   (6) **High Cost in Pond:** Ruining suit/missing interview is trivial compared to life. (Supports (1)).
      *   (7) **Enforcement/Attitude:** Non-donors are wrong, but no shaming. Praise > Lecture.

  3.  **Identify Tensions/Contradictions:**

      *   **Tension A: (1) & (3) - The Core Conflict.**
          *   (1) says: Prevent bad *unless* sacrifice is comparably important.
          *   (6) clarifies: Career/suit is *not* comparably important to life.
          *   (3) says: Stop at 10%.
          *   *Problem:* If a child dies because I didn't give that extra 11th percent, and that 11th percent wouldn't sacrifice anything "comparably important" (e.g., just a nicer vacation), then (1) says I *ought* to give it, but (3) says it's optional.
          *   *Severity:* High. This is the classic Singer vs. Moderate debate.

      *   **Tension B: (2) & (5) - Impartiality vs. Special Obligations.**
          *   (2) says: Distance/nationality irrelevant. Implies strict impartiality.
          *   (5) says: Family/promises create agent-relative reasons (partiality).
          *   *Problem:* If I spend money on my kid's birthday instead of saving a distant child, (2) suggests that's morally suspect (distance irrelevant), but (5) says it's permissible/required due to relationship.
          *   *Severity:* Medium-High. Common in hybrid theories, but needs reconciliation.

      *   **Tension C: (4) & (1)/(3) - The "Letting Governments Off the Hook" Argument.**
          *   (4) claims giving *too much* changes the duty structure (political obligation).
          *   (1) claims duty is based on *preventing bad* directly.
          *   *Problem:* If the child is dying *now*, does the potential future political laxity outweigh the immediate death? (1) suggests immediate prevention wins. (4) suggests systemic integrity wins.
          *   *Severity:* Medium. Plausible argument, but clashes with the immediacy of (1).

      *   **Tension D: (7) & (1)/(2) - Judgment vs. Action.**
          *   (1)/(2) say people are doing something objectively wrong (violating duty).
          *   (7) says don't shame them.
          *   *Problem:* Is this a contradiction? Not necessarily. One can believe an act is wrong but believe shaming is counterproductive or itself wrong.
          *   *Severity:* Low (The "Looks like a problem" candidate).

  4.  **Drafting the Feedback (Iterative Process):**

      *   *Constraint Check:* American English. Worst tension first. Explain trade-offs. Identify the "false" problem.

      *   *Refining Tension 1 (The Big One):* (1) vs. (3).
          *   (1) is the "Principle of Sacrifice." (3) is the "Limit."
          *   If I accept (1), (3) is arbitrary. If I accept (3), I must weaken (1).
          *   *Cost:* Giving up (1) means admitting the Shallow Pond intuition doesn't scale. Giving up (3) means accepting a much harder life (marginal utility).

      *   *Refining Tension 2 (Impartiality):* (2) vs. (5).
          *   (2) says distance doesn't matter. (5) says relationships do.
          *   If I buy my kid shoes instead of saving a stranger, (2) frowns, (5) smiles.
          *   *Cost:* Giving up (2) means admitting proximity/relationship *is* morally relevant. Giving up (5) means becoming a strict utilitarian (cold).

      *   *Refining Tension 3 (Political vs. Immediate):* (4) vs. (1).
          *   (4) says stop giving to pressure states. (1) says save the life in front of you.
          *   *Cost:* Giving up (4) means accepting individual responsibility regardless of state failure. Giving up (1) means allowing death for systemic reasons.

      *   *Identifying the "False" Problem:* (7) vs. (1).
          *   Believing someone is wrong vs. how to treat them. These are compatible. Meta-ethics vs. Normative ethics/Pragmatics.

  5.  **Final Review against constraints:**
      *   Did I rank them worst first? Yes (1v3 is the killer).
      *   Did I say what to give up and the cost? Yes.
      *   Did I identify the "looks like a problem" pair? Yes (7).
      *   Is it American English? (Check spelling: "moralize" vs "moralise", "program" vs "programme", tone).

  6.  **Polishing the Voice:**
      *   Make it sound like a peer or TA review. Direct, clear, slightly academic but accessible.
      *   Ensure the distinction between "comparably important" in (1) and the "10%" in (3) is highlighted. That's the logical break point.

      *(Self-Correction during drafting)*: Wait, look at (4) again. "Changes what you should do, not merely how hard it is." This is a strong claim. It essentially modifies the consequentialist calculus with a rule-consequentialist or duty-based constraint. This clashes heavily with (1)'s act-based nature. I should rank this high, maybe even above (2)v(5), but (1)v(3) is definitely the biggest because it directly contradicts the *extent* of the duty defined in (1).

      Let's stick with (1)v(3) as #1. It's the "Singer vs. Moderate" core.
      (2)v(5) is #2. It's the "Impartiality vs. Special Duties" core.
      (4)v(1) is #3. It's the "Systemic vs. Individual" core.
      (7) is the "False Problem."

      *Wait, one more check:* (6) says ruining an interview is trivial. (3) says 10% cap. If the 11th percent saves a life and costs me a "nice vacation," (1) says give it. (3) says don't have to. This confirms (1)v(3) is the strongest tension.

      *Refining the "False Problem":* (7) says non-donors are doing something *wrong* (matches 1 & 2) but we shouldn't *shame* (pragmatic/secondary duty). This is consistent.

      *Let's write it.*
answer: |-
  Here is an assessment of your seven points, ranked by the severity of the tension they create. I've focused on where the logic actually breaks down versus where it just feels uncomfortable.

  ### 1. The Core Contradiction: (1) vs. (3)
  **The Conflict:** This is the biggest problem in your set. Principle (1) is essentially Peter Singer's "Strong Principle": you must prevent bad things until the sacrifice becomes *morally comparable* to the bad thing prevented. Principle (6) reinforces this by stating that career opportunities (interviews) and property (suits) are *not* comparable to a life.

  However, (3) imposes a hard cap at 10%. In a famine scenario, the 11th percent of your income could likely prevent something "very bad" (death/suffering) without sacrificing anything "comparably important" (it would likely just mean a smaller house or fewer hobbies, which (6) suggests are trivial compared to life).

  *   **To fix this, you must give up:** Either the logic of (1) or the hard limit of (3).
  *   **The Cost:**
      *   **If you drop (1):** You lose the philosophical foundation that convinces you the Shallow Pond case is binding. You have to admit that distance *does* matter or that there is a "magic line" where duty stops even if you could easily do more. This makes your view less principled and more intuitive.
      *   **If you drop (3):** You accept the "marginal utility" conclusion. You are obligated to give until you are as poor as the people you are helping. This is incredibly demanding and likely unsustainable for a normal life.

  ### 2. The Structural Clash: (4) vs. (1)
  **The Conflict:** (1) is an immediate, act-based duty: if you can save a life *now*, you do it. (4) is a systemic, rule-based argument: you should stop giving to force political change.

  If a child is dying *now* (as per the famine week context), (1) demands you save them. (4) suggests you should arguably withhold aid to prevent governments from slacking off. But the child dies regardless of the government's future behavior. You are effectively sacrificing a definite life (the one you could save) for a speculative political gain (pressure on the state).

  *   **To fix this, you must give up:** The immediacy of (1) or the political conditionality of (4).
  *   **The Cost:**
      *   **If you drop (4):** You accept that individuals must pick up the slack for failed states. You lose the leverage argument that your restraint is a form of political activism.
      *   **If you drop (1):** You admit that sometimes you should let a specific person die to maintain a broader systemic principle. This is a hard pill to swallow for a rescue ethicist and risks making you complicit in the death you could have prevented.

  ### 3. The Impartiality Tension: (2) vs. (5)
  **The Conflict:** (2) claims distance and relationships are morally irrelevant (strict impartiality). (5) claims agent-relative reasons (family, promises) *do* matter and aren't just about outcomes.

  If you have $1,000, (2) implies you should send it to where it saves the most lives (likely distant strangers). (5) implies you can spend it on your sister's medical bill or your child's education, even if that money would save *more* strangers elsewhere.

  *   **To fix this, you must give up:** Strict impartiality (2) or the independent weight of relationships (5).
  *   **The Cost:**
      *   **If you drop (2):** You admit that proximity and kinship *are* morally relevant. This weakens the "global" aspect of your famine duty but makes your ethics more human and livable.
      *   **If you drop (5):** You become a strict utilitarian. You lose the ability to justify special care for your own family without arguing that it somehow produces better global outcomes in the long run (which feels manipulative).

  ### 4. The "False Problem": (7) vs. (1) & (2)
  **The Conflict:** You suspected one pair only *looks* like a problem. This is it. There is no logical contradiction between believing someone is doing something wrong (1 & 2) and believing that shaming them is the wrong response (7).

  *   **Why it works:** (1) and (2) describe **normative ethics** (what is right/wrong). (7) describes **pragmatics or secondary duties** (how we should treat moral agents). You can consistently believe that non-donors are violating a moral duty but that shaming them produces bad consequences (resentment, disengagement) or violates a separate duty of kindness.
  *   **What to do:** Keep this exactly as is. It adds nuance to your profile without requiring a logical trade-off. It distinguishes your *theory* from your *pedagogy*.

  ### Summary Recommendation
  Your set hangs together as a "Moderate" position, but it relies on (3) and (4) to do heavy lifting to stop the logic of (1) from consuming your entire life.

  To make this defensible in tutorial, I would suggest tweaking **(1)** slightly. Instead of the pure Singer principle, frame it as: *"If you can prevent something very bad without giving up anything comparably important, you ought to—**provided this does not violate your agent-relative obligations or undermine necessary political structures.**"*

  This bakes (4) and (5) into the exception clause of (1), resolving the contradictions before they happen. It costs you the purity of the Shallow Pond analogy, but it saves your theory from collapsing under its own weight.
