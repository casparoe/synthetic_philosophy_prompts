answer: |-
  \section*{Indeterminacy as the Ground of Lexical Priority}

  The standard complaint against Lexical Threshold Negative Utilitarianism (LNU) is that it posits a magical cliff in value space: a point where pleasure stops counting entirely against pain. The defense proposed here is that this "cliff" is not a feature of the value scale itself, but a feature of the *determinacy* of comparisons across that scale. The argument shifts the burden from metaphysics of value to the norms of decision-making under indeterminacy.

  \subsection*{1. Precision and Distinctions}

  To make this position fail-safe, we must define the core thesis precisely. The claim is not that we cannot *know* the exchange rate between agony and mild pleasure, nor that the terms are semantically vague.

  \textbf{The Core Thesis:} For any episode of suffering $S$ above threshold $T$ and any collection of sub-threshold goods $G$, the proposition "$G$ outweighs $S$" lacks a truth value. It is neither true nor false.

  \textbf{Distinctions:}
  \begin{itemize}
      \item \textit{Vs. Epistemic Uncertainty:} The view rejects the claim that there is a fact of the matter we cannot access. \textbf{[Contested]:} A standard utilitarian will deny this, asserting comparability is a conceptual truth of welfare.
      \item \textit{Vs. Semantic Vagueness:} While related to sorites paradoxes, this is not merely about the boundary of the word "agony." It is about the aggregation function itself failing to return a value. \textbf{[Live Dispute]:} Philosophers of language debate whether vagueness is ontic or semantic; LNU requires ontic or normative indeterminacy.
      \item \textit{Vs. Incomparability (Different Kinds):} The view does not claim pleasure and pain are different categories (like length and weight). They are both welfare metrics. \textbf{[Settled among Welfarists]:} Most agree they are comparable in kind; the dispute is about the function's continuity.
  \end{itemize}

  LNU needs the \textit{lack of truth value} (normative indeterminacy). It can do without semantic vagueness (the terms could be precise, the relation still undefined). It must affirmatively reject epistemic uncertainty (if there is a fact, LNU is false).

  \subsection*{2. The Derivation}

  The move from indeterminacy to lexical priority is not automatic; it requires a normative bridge principle regarding action under indeterminacy.

  \begin{enumerate}
      \item \textbf{Metaphysical Premise:} For any supra-threshold suffering $S$ and sub-threshold goods $G$, it is indeterminate whether $G > S$. \textbf{[Contested]:} A competent critic (e.g., a classical utilitarian) will deny this outright, asserting determinacy.
      \item \textbf{Bridge Principle (The Moral Safe Harbor):} If it is indeterminate whether an action (trading $S$ for $G$) is permissible, and the action involves accepting $S$, one must act as if the action is impermissible. \textbf{[Live Dispute]:} This is a precautionary principle specific to harm. A critic might argue one should maximize expected value across precisifications instead.
      \item \textbf{Inference:} Therefore, it is impermissible to trade $S$ for any $G$.
      \item \textbf{Conclusion:} $S$ is lexically prior to $G$.
  \end{enumerate}

  The step from (1) to (2) adds the premise that \textit{indeterminacy in permissibility regarding harm defaults to prohibition}. Without this, indeterminacy might license a coin flip or a probabilistic trade. This premise is the engine of the argument; without it, the indeterminacy claim yields no specific action guide.

  \subsection*{3. Damaging Cases}

  \textbf{Case 1: Agony + Billion Lives vs. Agony + Nothing.}
  The intuition is that a world with agony plus massive bliss ($W_1$) is better than a world with agony and no bliss ($W_2$). Strict LNU sometimes struggles here, implying the bliss is irrelevant.
  \textit{Response:} The indeterminacy claim applies to \textit{cross-threshold trade-offs}, not \textit{ceteris paribus} additions. It is indeterminate whether bliss \textit{outweighs} agony. It is not indeterminate whether bliss is \textit{good}. Since both worlds contain the same lexical bad ($S$), the lexical priority condition is tied. We then descend to the sub-threshold tier to break the tie. $W_1$ contains more sub-threshold good than $W_2$. Thus, $W_1 > W_2$ is determinate.
  \textit{Verdict:} The position delivers the intuitive verdict. This is a vindication, showing that lexical priority functions as a sorting key, not a value-eraser for sub-threshold goods once the key is matched. \textbf{[Settled]:} Most aggregation theorists agree lexical views can allow secondary sorting.

  \textbf{Case 2: The Symmetry Charge.}
  If "$G > S$" is indeterminate, isn't "$S > G$" equally indeterminate? Why does the lexical priority favor avoiding suffering rather than maximizing pleasure?
  \textit{Response:} Logical symmetry of the value relation does not imply normative symmetry of the \textit{precautionary principle}. The Bridge Principle (2) is asymmetric: it triggers on \textit{accepting harm} under indeterminacy, not on \textit{forgoing benefit} under indeterminacy. We treat the indeterminacy of "Is this harm justified?" as a "No." We do not necessarily treat the indeterminacy of "Is this benefit worth the cost?" as a "Yes."
  \textit{Verdict:} The position admits the value relation is symmetric in its indeterminacy but denies the decision rule is symmetric. This relies on a broader normative asymmetry between harm and benefit. \textbf{[Contested]:} A strict welfarist/consequentialist will deny this asymmetry, arguing that failing to create good is morally equivalent to allowing bad if the net welfare is identical.

  \subsection*{4. The Strongest Objection}

  The strongest objection I cannot fully answer here is the \textbf{Functional Collapse Objection}.

  \textit{The Objection:} If the decision rule mandates "Never trade $S$ for $G$" in all possible worlds, then functionally, you are asserting "$S$ is always worse than $G$." You have not escaped the "value cliff"; you have simply relabeled a determinate value claim as an "indeterminacy" claim to avoid the burden of justification. The "indeterminacy" does no work if the action guide is exceptionless.

  \textit{What it would take to answer:} To defeat this, one must show a case where the indeterminacy view permits something the determinate LNU view forbids, or vice versa. For example, if there were "borderline" cases of suffering where the view allows trade-offs (because the indeterminacy resolves to "permissible" in some precisifications), the distinction would hold. But if LNU requires a hard threshold, the collapse is real. To answer this, the defender must argue that \textit{normative status} (indeterminate vs. false) has intrinsic significance for moral residue or regret, even if action-guidance is identical.

  \subsection*{Conclusion}

  The indeterminacy defense saves LNU from the charge of positing a mysterious value cliff by relocating the discontinuity to the domain of truth-evaluability. However, it purchases this coherence at the price of a contentious normative bridge principle that treats indeterminacy regarding harm as prohibition.

  \answer{Indeterminacy regarding the permissibility of inflicting severe harm mandates acting as if the harm is impermissible.}
