answer: |-
  Here is a teaching plan designed for your specific constraints, audience, and time limit.

  ### The Core Strategy
  You are not teaching them *how to catalog*. You are teaching them *why cataloging is metaphysically perilous*. Your goal is to move them from "There is a right answer to whether this is one object" to "There are coherent, defensible systems where the answer is 'yes', 'no', or 'only if it's alive', and none of them are obviously false."

  **The Central Example: The Six-Stone Cairn**
  *   **What it is:** Six distinct, unworked stones stacked by a hiker (not an artist) on a trail.
  *   **Why this fits:**
      *   **Unreflective belief:** Everyone calls it "a cairn" (one object).
      *   **No Designer:** It lacks an "artist's intention" certificate. It's folk arrangement. This blocks the "authenticity" dodge.
      *   **Scatterable:** You can kick it over. The stones remain.
      *   **Reassemblable:** You can stack them again, perhaps in a different order.
      *   **Non-Living:** This is crucial for testing van Inwagen's "Life-only" view.
  *   **What it lacks:** It lacks *function* (unlike a chair) and *organic unity* (unlike a dog). This isolates the metaphysical question from practical utility.

  ---

  ### The Sequence (75 Minutes)

  #### 1. The Disclaimer & The Hook (0–5 mins)
  *   **Goal:** Lower defenses, manage expectations.
  *   **Script Beat:** "You are the experts on accessioning. I am the expert on confusion. I am not here to tell you how to fill out the form. I am here to show you why the form asks a question that has no agreed-upon answer in philosophy. If you leave with a checklist, I have failed. If you leave with a headache, I have succeeded."
  *   **Why here:** If you don't say this now, they will spend 40 minutes trying to extract policy from you.

  #### 2. The Distinction: Synchronic vs. Diachronic (5–15 mins)
  *   **Goal:** Kill the Ship of Theseus immediately.
  *   **Dependency:** You cannot discuss the Special Composition Question (SCQ) if they are thinking about persistence through time.
  *   **The Move:** Draw the Cairn on the whiteboard.
      *   **Time 1:** Stones stacked.
      *   **Time 2:** Stones scattered across the room.
      *   **Time 3:** Stones restacked.
  *   **The Trap:** They will ask, "Is the Time 3 cairn the *same* cairn as Time 1?"
  *   **The Correction:** "Stop. That is a question about *persistence* (Diachronic Identity). I am asking a question about *now* (Synchronic Composition). At Time 2, when the stones are scattered across the floor *right now*, do they compose one object? Not 'will they later,' but 'do they now'?"
  *   **Why this order:** If you let them wander into Theseus, you lose the room to stories about restoration. Lock the door on "time" first.

  #### 3. The Special Composition Question (SCQ) (15–25 mins)
  *   **Goal:** Define the SCQ using the Cairn.
  *   **Definition:** "Under what conditions do some things (the stones) add up to one thing (the cairn)?"
  *   **The Four Answers (The Menu):**
      1.  **Universalism:** Any things compose a further thing. The scattered stones compose a "scattered object." The stones + the air between them compose an object.
      2.  **Nihilism (Hard):** No things ever compose a further thing. There are only simples (atoms/stone-fundamentals). There is no cairn, there are only stones arranged cairn-wise.
      3.  **Contact/Fastening (Common Sense):** Things compose an object when they touch or are fastened. The stacked stones compose a cairn; the scattered ones do not.
      4.  **Van Inwagen (Life-Only):** The only composite material objects are living organisms. The cairn is *never* one object, even when stacked. It is always just stones. (But a dog *is* one object).
  *   **Why this order:** Present the spectrum from "Everything is an object" to "Nothing is an object" to "Only some specific things are."

  #### 4. The Vagueness Argument (The Hard Part) (25–40 mins)
  *   **Goal:** Show why "Common Sense" (Contact) is philosophically unstable. This is the intellectual core.
  *   **Dependency:** You can't land this until they accept Contact is the default view (which you established in step 3).
  *   **The Move:** Use the Cairn.
      *   "If Contact makes a cairn, how much contact?"
      *   "If I separate the top stone by 1mm, is it still one object?"
      *   "If 1mm is okay, what about 2mm? Where is the line?"
      *   "If there is no precise line, then 'being an object' is vague. But reality isn't vague (there's either an object there or there isn't). Therefore, Contact is false."
  *   **The Consequence:** This pushes smart people toward Universalism (the line is arbitrary, so let there be objects everywhere) or Nihilism (the line is arbitrary, so let there be objects nowhere).
  *   **Why here:** This explains *why* philosophers don't just go with Common Sense. It validates the "weird" views.

  #### 5. Misconceptions & Holding Lines (40–55 mins)
  *   **Goal:** Head off the three specific objections you anticipate.
  *   **Misconception 1: "It's just a verbal dispute about the word 'object'."**
      *   **The Counter:** "If I say there are no chairs, and you say there are, we agree on the physics (particles arranged chairwise). We disagree on *ontology*. Do we need a 'chair' entity in our inventory of the universe to make the sentence 'There is a chair' true? That's not semantics; that's accounting."
  *   **Misconception 2: "Nihilism means people don't exist."**
      *   **The Counter:** Distinguish Hard Nihilism from Van Inwagen. "Van Inwagen says *living things* compose. You are alive. You exist. Your chair does not. Hard Nihilism says you don't exist either. We are discussing Van Inwagen today, so you are safe."
  *   **Misconception 3: Composition as Identity (CAI).**
      *   **The Holding Line:** "Some philosophers say the whole *is* the parts (just counted differently). This saves Universalism from cluttering the universe. I am not asking you to endorse CAI. Just treat 'composition' as 'making up' for this hour. If you buy CAI, great, but it's not required to understand the SCQ."
  *   **Why here:** Get the objections out before the Check. If you leave them for Q&A, they will poison the assessment.

  #### 6. The Check (55–65 mins)
  *   **Goal:** Verify they understand the *structure* of the debate, not just the examples.
  *   **The Case:** **The Astronaut and the Ship.**
      *   *Scenario:* An astronaut is spacewalking, tethered to a spaceship. Her boots are magnetically locked to the hull. She is touching the ship. She is not alive *relative to the ship* (they are distinct life forms).
      *   *The Question:* "According to the four views we just discussed, do the Astronaut and the Ship compose one single object right now?"
  *   **What a Good Answer Sounds Like:**
      *   "Universalist says **Yes** (any things compose)."
      *   "Nihilist says **No** (nothing composes)."
      *   "Contact says **Yes** (they are touching/fastened)."
      *   "Van Inwagen says **No** (they do not share a single life process)."
      *   *Key:* The answer applies the *criteria* consistently, regardless of intuition.
  *   **What a Bad Answer Sounds Like:**
      *   "It depends on if she's working on the ship." (Function/Intention).
      *   "It depends on if she detaches later." (Diachronic/Time).
      *   "It's obviously two objects." (Appeal to intuition without criteria).
  *   **Why this case:** It separates "Contact" (Yes) from "Life" (No). It forces them to use the menu, not their gut.

  #### 7. Wrap & The Gap (65–75 mins)
  *   **Goal:** Honest closure.
  *   **What to Leave Out (The Gap):** **Mereological Essentialism.**
      *   *Say this:* "I have left out the question of whether an object survives the loss of a part. That is 'Mereological Essentialism.' If we opened that, we'd be back to the Ship of Theseus. I kept this session to *composition right now*. If you wonder if a vase with a replaced handle is the *same* vase, that is a different metaphysical problem. I didn't have time to give you two headaches today."
  *   **Final Thought:** "Your job is to make consistent records. My job is to show you that 'consistency' requires picking a metaphysical lane, even if you don't know which one is true."

  ---

  ### Dependencies & Logic Flow
  1.  **Synchronic before Diachronic:** If they think about time (Theseus), they cannot evaluate Contact vs. Life. You must freeze time first.
  2.  **Contact before Vagueness:** You cannot explain why Universalism is attractive until they see why Contact (the default) leads to Sorites paradoxes (vagueness).
  3.  **Van Inwagen before Nihilism:** You must introduce Van Inwagen's "Life" view before Hard Nihilism, or they will reject Nihilism immediately because "I exist." Van Inwagen is the bridge that allows them to be Nihilists about *artifacts* without being Nihilists about *themselves*.
  4.  **The Check last:** You cannot test them until they have the "Menu" of four views.

  ### Specific Scripts for Tricky Moments

  **On the "So What?" (Minute 5):**
  > "I know what you're thinking. 'If I can't tell if it's one object, how do I accession it?' You accession it based on your institution's policy. But understand this: Your policy is a *choice* of one of these four metaphysical views. Most museums operate on 'Contact/Fastening' with a side of 'Artist Intention.' Knowing that helps you see where the edge cases will break your system."

  **On the "Verbal Dispute" (Minute 45):**
  > "If you think this is just about the word 'object,' ask yourself this: If I say 'There are no chairs,' do I need to duck when you throw one at me? No. We agree on the physics. We disagree on whether the universe contains a 'chair' entity over and above the wood. That is a disagreement about what exists, not what words mean."

  **On Composition as Identity (Minute 50):**
  > "Someone in the back is thinking, 'The whole is just the parts.' That's Composition as Identity. It's a powerful view, but it requires a logic seminar to defend. For today, treat it as a black box: if you hold this view, you're a Universalist. If you don't, you still have to answer the SCQ. We don't need to solve CAI to do the SCQ."

  ### What to Leave Out (And Why)
  1.  **Temporal Parts (4Dism):** It solves persistence but confuses composition. It requires visualizing objects as "worms" in time. In 75 minutes, this will conflate Synchronic and Diachronic identity. *Flag it as "The solution to the Theseus problem we aren't discussing."*
  2.  **Grounding:** The question of *why* the parts compose the whole. Too abstract. Stick to *when* they compose.
  3.  **Ontic vs. Semantic Vagueness:** Just say "Vagueness." Distinguishing whether the fuzziness is in the world or our language requires a deeper dive into philosophy of language than you have time for. *Flag it:* "Philosophers fight over whether the vagueness is in the stones or our words. For today, just note that 'Contact' creates vagueness either way."

  ### Final Advice for the Room
  Bring six actual stones if you can. Stack them. Kick them over. The physical act of scattering them drives the "Synchronic" point home better than any slide. When they are scattered, point and ask: "How many objects?" Let the silence hang. That silence is where the learning happens.
