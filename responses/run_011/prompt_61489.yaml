      *   **Questions:**
          1.  If yield anomalies are secondary, what replaces them in an early-warning index (EWI)? How to handle slow-moving political variables vs. fast meteorological ones?
          2.  Why do agencies still invest in crop forecasting? Inertia or defensible argument? What does that concede about the natural vs. political question?
          3.  Is the "natural disaster vs. political crime" dichotomy false, or is there residual sense in "natural disaster" under the entitlement approach?
      *   **Specific Instruction:** Reconstruct premises, flag mistakes/overstatements *before* answering questions. Direct disagreement is welcome/required.

  2.  **Deconstruct the User's Premises (The "Brainstorming" Phase):**
      *   *Premise 1:* Sen's analysis of Bengal 1943 proves aggregate food supply decline (FAD) is irrelevant to famine causation.
          *   *Critique:* Sen argued FAD wasn't the *primary* driver in Bengal, not that it's *never* relevant. He didn't say supply never matters, but that entitlements explain cases where FAD doesn't. Later work (e.g., Devereux, Watts) shows FAD *can* cause famine (e.g., North Korea, some African droughts), though often mediated by entitlements.
      *   *Premise 2:* Sen's democracy claim implies political accountability is the *sole* preventative mechanism.
          *   *Critique:* Sen argues democracy/prevention is a sufficient condition for prevention, not that it's the only causal factor. It prevents *entitlement failures* from becoming *famines*.
      *   *Premise 3:* Yield forecasts are therefore "at best a weak covariate... at worst a distraction."
          *   *Critique:* This is the biggest overstatement. While entitlements determine *access*, production determines the *pool* available for access. In subsistence economies, production shock *is* an entitlement shock. Yield forecasts are proxies for income shocks for farmers.
      *   *Premise 4:* The dichotomy "Natural Disaster vs. Political Crime" is settled by Sen.
          *   *Critique:* Most contemporary scholars (e.g., Alex de Waal, Stephen Devereux) view this as a false dichotomy. Famines are complex emergencies. Calling them "political crimes" is normatively useful but analytically incomplete regarding triggers.
      *   *Premise 5:* Political variables move too slowly for early warning compared to met variables.
          *   *Critique:* True, governance doesn't change monthly. But *policy decisions* (export bans, price controls, relief deployment) move fast. The *risk* is slow, the *trigger* is fast.

  3.  **Address the Questions (Drafting the Argument):**

      *   **Question 1: What replaces yield anomalies?**
          *   Need to shift from *supply* to *access*.
          *   Indicators: Food prices (relative to wages), terms of trade (livestock-to-grain), labor demand, conflict intensity, displacement data.
          *   The "Slow vs. Fast" problem: You don't forecast democracy; you forecast *state response*. Use "governance indicators" as baselines (vulnerability) and "policy signals" as triggers.
          *   Integration: Yield is an input to price, price is an input to entitlement. Don't discard yield, demote it to a driver of market variables.

      *   **Question 2: Why do agencies still invest in crop forecasting?**
          *   Not just inertia.
          *   Reason A: Subsistence farmers. For them, production = entitlement.
          *   Reason B: Market integration. Low supply -> High price -> Entitlement failure for net buyers.
          *   Reason C: Operational necessity. You need to know *where* food is scarce to move it, even if the famine is political.
          *   Concession: It concedes that while politics determines the *outcome*, physics/biology determines the *boundary conditions*.

      *   **Question 3: Natural Disaster vs. Political Crime?**
          *   The dichotomy is false.
          *   Sen doesn't say nature doesn't matter; he says nature doesn't *determine* famine without social mediation.
          *   "Political Crime" is a moral/legal category, "Natural Disaster" is a causal category. Mixing them creates confusion.
          *   Better framing: "Hazards" (natural) vs. "Vulnerability" (political/economic). Famine = Hazard + Vulnerability.
          *   Direct disagreement: Don't stop using the dichotomy because it's rhetorically powerful for accountability, but stop using it for *causal modeling*.

