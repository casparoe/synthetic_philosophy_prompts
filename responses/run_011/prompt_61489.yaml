  *(Self-Correction Note)*: I need to be careful not to sound like I'm dismissing Sen. The user admires Sen. I need to show how a sophisticated reading of Sen actually *supports* the continued use of yield data, contrary to the user's current interpretation. The key is the "entitlement mapping" depends on the economy type. In a market economy, yield affects price. In a subsistence economy, yield affects direct endowment.

