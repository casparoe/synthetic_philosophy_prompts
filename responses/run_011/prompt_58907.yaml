answer: |-
  You have independently rediscovered the fundamental crisis of both historiography and data science. You are correct: standard "selection bias" feels wrong because it implies a random sampling error, whereas you are describing a *structural* property of the data generation process itself.

  There is no single English word that captures the engineering, statistical, and sociological dimensions of this simultaneously. However, there are two established concepts from different fields that, when overlaid, describe exactly what you are seeing.

  ### 1. The Statistical Concept: Missing Not At Random (MNAR)

  You suspected statisticians had a formal notion for this. They do. In the taxonomy of missing data (Little & Rubin), there are three categories:

  *   **MCAR (Missing Completely At Random):** The data is missing due to pure chance (e.g., a hard drive sector went bad).
  *   **MAR (Missing At Random):** The missingness is related to *observed* data (e.g., men are less likely to report depression, but we know their gender, so we can model the gap).
  *   **MNAR (Missing Not At Random):** The probability of data being missing depends on the *unobserved* value itself or the mechanism of collection.

  **Your problem is MNAR.**
  *   **The Ticket Spike:** The "missingness" (lack of tickets pre-2014) depends on the *policy* (unobserved in the ticket data itself).
  *   **The Quiet Fixes:** The absence of an incident report depends on the *severity* (it wasn't severe enough to trigger the process).
  *   **The Personal Text Files:** The absence of knowledge depends on the *individual's preference* (which is not recorded in the company wiki).

  In statistics, this is called **Informative Missingness**. The fact that the data is missing *is* data. The "shape of the absence" you described is the signature of the MNAR mechanism.

  **Does it fit?**
  It fits the *structure* perfectly. It explains why you cannot impute or average your way out of the problem. However, it is coldly mathematical. It tells you *that* the mechanism exists, but not *why* it exists or how power dynamics shape it.

  ### 2. The Historical Concept: Archival Silence

  You also suspected historians have a name for this. They do. The seminal work here is Michel-Rolph Trouillot's *Silencing the Past: Power and the Production of History* (1995).

  Trouillot argues that archives are not neutral containers of facts. They are active institutions that produce history through four moments of "silencing":
  1.  **The making of sources:** Who is allowed to create a record? (Your "standing" example).
  2.  **The making of archives:** What is kept vs. discarded? (The lost wiki).
  3.  **The making of narratives:** Which stories are told? (The ticket volume spike).
  4.  **The making of history:** What is accepted as truth in the present? (Your final report).

  Trouillot calls these gaps **Archival Silences**. Crucially, he argues that silence is not an absence of data; it is an *active production*. The silence regarding the offshore team wasn't an accident; it was produced by a system that did not grant them the agency to create records.

  **Does it fit?**
  It fits the *sociology* perfectly. It explains the "who has standing" problem as a function of power, not just data loss. It validates your intuition that the record is a "portrait of management fashions."

  ### The Synthesis: What is the Unit of Analysis?

  You asked for the right unit of analysis.
  *   **Wrong Unit:** The Ticket, The Incident, The Commit. (These are the *traces*, not the *events*).
  *   **Right Unit:** **The Record-Generating Act.**

  Your data does not measure "Work Done." It measures "Instances where the Organization Required a Trace of Work to be Created."

  When you shift your unit of analysis from the *event* to the *act of recording the event*, the contradictions vanish.
  *   **2014-2016:** Work didn't triple; the *requirement to record* tripled.
  *   **Pre-2009:** Work didn't stop; the *infrastructure for recording* was absent.
  *   **Offshore Team:** Work didn't vanish; their *agency to generate records* was restricted.

  ### Addressing Your Specific Questions

  **1. Is "who has standing" a separate phenomenon?**
  No. In the MNAR framework, "standing" is a **covariate in the missingness mechanism**.
  Let $M$ be the probability of a record being created.
  $M = f(\text{Event Severity}, \text{Policy}, \text{User Standing})$
  If "User Standing" is low, $M$ approaches 0 regardless of "Event Severity."
  In the Historical framework, this is **Epistemic Privilege**. It is the same phenomenon viewed through different lenses: one mathematical, one sociological.

  **2. Do the examples fit?**
  *   *A photograph that only exists because someone was paid to take it:* **Yes.** This is MNAR (missingness depends on budget) and Archival Silence (only the funded are visible).
  *   *A metric that stops being collected once it looks bad:* **Yes.** This is **Endogenous Censoring** (a specific type of MNAR). The value of the metric caused its own disappearance.

  **3. Is there a single term?**
  There is no single academic term that bridges Data Engineering and Historiography. "Selection Bias" is too broad. "Survivorship Bias" is incorrect (as you noted).

  If you need a term for your report to encapsulate this specific engineering/historical nexus, I propose you coin:

  > **Constitutive Record Bias**
  > *Definition: A systematic distortion where the data reflects the constraints and incentives of the recording system rather than the underlying phenomena, such that the absence of data is structurally determined by the system's design and power dynamics.*

  ### How to Write Your History

  You are stuck because you are trying to write a history of the **Platform** using data that is actually a history of the **Administration**.

  Do not try to "correct" the bias. You cannot reconstruct the quiet fixes or the lost wiki. Instead, **make the bias the subject.**

  Your history should not be "How the Platform Evolved." It should be "How the Organization's Perception of the Platform Evolved."

  *   **Chapter 1 (The Blank Years):** Discuss the *informality* of the early era. The lack of data *is* the story. It proves the team operated on trust and verbal communication.
  *   **Chapter 2 (The Ticket Spike):** Discuss the *professionalization* of Ops. The data proves management shifted from outcome-based to process-based control.
  *   **Chapter 3 (The Knowledge Loss):** Discuss the *fragility of institutional memory*. The hole in the data is evidence of over-reliance on key persons.

  **The Verdict:**
  You are describing **Informative Missingness (MNAR)** driven by **Archival Silence**.
  Your data is not a mirror of reality; it is a **fossil of your organization's bureaucracy.** Treat it as such, and your history will be more accurate than if you tried to treat it as a log of work.
