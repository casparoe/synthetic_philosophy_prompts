answer: |-
  ### Candidate Cruxes

  1.  **Strong Pareto vs. Finite Insensitivity:** The rule averages over infinity, so any improvement confined to a finite number of positions (even if strict) disappears in the limit. This violates Strong Pareto, which demands strict social preference for any individual gain holding others constant.
  2.  **Completeness vs. Oscillation:** The limit of running averages does not exist for oscillating streams (e.g., $0,1,0,1\dots$). This forces incomparability. The crux is whether incomparability is a fatal flaw or a necessary cost of avoiding arbitrariness in infinite settings.
  3.  **Weak Pareto vs. Asymptotic Decay:** Even if everyone is strictly better off ($u_i < v_i$ for all $i$), the average gain can converge to zero if the improvements vanish fast enough (e.g., $1/i$). Standard Weak Pareto fails, though it holds if improvements are bounded away from zero.
  4.  **Permutation Invariance vs. Temporal Equity:** The rule is insensitive to the order of utilities. A stream where the first million people suffer terribly but the average is high ranks the same as one where suffering is distributed evenly, raising equity concerns distinct from Pareto.

  ### Selection and Justification

  I would bet on **Crux 1 (Strong Pareto vs. Finite Insensitivity)** combined with **Crux 2 (Completeness vs. Oscillation)**.

  **Why:** The Strong Pareto failure is the most conceptually distinct "break" for this specific rule. It highlights the tension between finite moral claims and infinite aggregation without requiring complex analysis of decay rates (which makes Weak Pareto messy to grade). Pairing this with the Completeness issue (non-existent limits) ensures students must handle both algebraic counterexamples and topological limitations. This combination allows for a clean 3-hour task: construct two specific numerical streams (one for Pareto, one for Completeness), prove the limits, and discuss the normative implication. It avoids the ambiguity of Weak Pareto (where students might argue about decay rates) and focuses on the structural inability of averages to register finite changes or handle oscillation.

  ***

  ### Exam Question

  **Infinite Ethics Graduate Seminar — End of Term Assessment**
  **Time Allowed:** 3 Hours
  **Total Marks:** 25

  **Question 1**

  Consider a population indexed by the natural numbers $\mathbb{N} = \{1, 2, 3, \dots\}$. A *wellbeing stream* is a bounded sequence of real numbers $u = (u_1, u_2, \dots)$, where $u_i$ represents the wellbeing of individual $i$.

  We propose the **Average Value Rule (AVR)** to rank any two wellbeing streams $u$ and $v$. According to the AVR, $v$ is strictly better than $u$ (written $v \succ u$) if and only if:
  $$ \lim_{n \to \infty} \frac{1}{n} \sum_{i=1}^n (v_i - u_i) > 0 $$
  If the limit equals zero, $v$ and $u$ are equally good ($v \sim u$). If the limit does not exist, $v$ and $u$ are incomparable.

  You are to evaluate the AVR against two standard principles of social choice:

  1.  **Strong Pareto:** For any streams $u, v$, if $v_i \geq u_i$ for all $i \in \mathbb{N}$ and $v_j > u_j$ for at least one $j \in \mathbb{N}$, then $v \succ u$.
  2.  **Completeness:** For any streams $u, v$, either $v \succeq u$ or $u \succeq v$ (i.e., $v$ and $u$ are always comparable).

  **(a)** Determine whether the AVR satisfies the **Strong Pareto** principle. You must justify your answer by constructing explicit numerical streams $u$ and $v$ that serve as a counterexample if you claim it fails, or a general proof if you claim it holds. (10 marks)

  **(b)** Determine whether the AVR satisfies the **Completeness** requirement. Justify your answer by constructing explicit numerical streams $u$ and $v$ where the required limit does not exist. (10 marks)

  **(c)** In light of your findings, briefly discuss whether the incomparability resulting from part (b) should be viewed as a theoretical cost or a necessary feature of infinite ethics. Limit your discussion to 150 words. (5 marks)

  ***

  ### Model Answer

  **(a) Strong Pareto Failure**
  The Average Value Rule fails the Strong Pareto principle. Strong Pareto requires that if everyone is at least as well off and one person is strictly better off, the social outcome must be strictly better. However, the AVR relies on limits over infinite populations, rendering finite changes invisible to the average.

  Consider the following two streams:
  Let $u = (0, 0, 0, \dots)$ where $u_i = 0$ for all $i$.
  Let $v = (1, 0, 0, \dots)$ where $v_1 = 1$ and $v_i = 0$ for all $i > 1$.

  Here, $v_i \geq u_i$ for all $i$, and $v_1 > u_1$. Strong Pareto demands $v \succ u$.
  Under the AVR, we calculate the limit of the average difference:
  $$ D_n = \frac{1}{n} \sum_{i=1}^n (v_i - u_i) $$
  For $n=1$, $D_1 = 1$. For any $n \geq 1$, the sum $\sum_{i=1}^n (v_i - u_i) = 1$ because only the first term differs.
  Thus, $$ \lim_{n \to \infty} D_n = \lim_{n \to \infty} \frac{1}{n} = 0 $$
  Since the limit is 0, the AVR implies $v \sim u$. This contradicts the requirement $v \succ u$. Therefore, the AVR violates Strong Pareto. It is insensitive to finite improvements.

  *(Note: The AVR also fails Weak Pareto if improvements vanish asymptotically, e.g., $v_i = 1/i$, but the finite case above is sufficient to violate Strong Pareto.)*

  **(b) Completeness Failure**
  The AVR fails the Completeness requirement because the limit of the running averages does not always exist. Oscillating differences can prevent convergence.

  Consider the following two streams:
  Let $u = (0, 0, 0, \dots)$ where $u_i = 0$ for all $i$.
  Let $v = (1, 0, 1, 0, \dots)$ where $v_i = 1$ if $i$ is odd and $v_i = 0$ if $i$ is even.

  The difference sequence $(v_i - u_i)$ is $(1, 0, 1, 0, \dots)$.
  The running average $A_n = \frac{1}{n} \sum_{i=1}^n (v_i - u_i)$ behaves as follows:
  If $n$ is even, say $n=2k$, there are $k$ ones and $k$ zeros. $A_{2k} = \frac{k}{2k} = 0.5$.
  If $n$ is odd, say $n=2k+1$, there are $k+1$ ones and $k$ zeros. $A_{2k+1} = \frac{k+1}{2k+1} \to 0.5$ as $k \to \infty$.
  *Wait, this example converges to 0.5.* This is a common error. To break completeness, we need the average itself to oscillate, not just the stream.

  **Corrected Counterexample:**
  Let $u = (0, 0, 0, \dots)$.
  Let $v$ consist of blocks of 1s and 0s of increasing length.
  Block 1: one 1. (Sequence: 1)
  Block 2: two 0s. (Sequence: 1, 0, 0)
  Block 3: four 1s. (Sequence: 1, 0, 0, 1, 1, 1, 1)
  Block 4: eight 0s.
  Generally, block $k$ has length $2^{k-1}$. If $k$ is odd, fill with 1s. If $k$ is even, fill with 0s.

  At the end of an odd block (all 1s), the running average is pushed close to 1 (depending on previous weight). At the end of an even block (all 0s), the average is pulled close to 0. Because the block lengths grow exponentially, the new block dominates the previous average.
  Specifically, let $N_k$ be the end of block $k$.
  At $N_{odd}$, the proportion of 1s is high. $\limsup A_n \geq 2/3$.
  At $N_{even}$, the proportion of 1s is low. $\liminf A_n \leq 1/3$.
  Since $\liminf \neq \limsup$, the limit does not exist.
  Thus, $u$ and $v$ are incomparable under AVR. Completeness fails.

  **(c) Normative Implications**
  Incomparability is likely a necessary feature rather than a mere cost. In infinite settings, requiring completeness often forces arbitrary weighting of the far future (e.g., discounting) or violates Pareto principles (e.g., catching up criteria). Accepting incomparability acknowledges that some infinite trade-offs lack a determinate solution without imposing controversial structural assumptions. It preserves neutrality where intuition is genuinely ambiguous, though it limits decision-guidance in policy contexts requiring strict ranking.

