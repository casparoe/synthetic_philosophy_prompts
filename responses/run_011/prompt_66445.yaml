  ### Marking Scheme

  **Total Marks: 25**

  **Part (a): Strong Pareto (10 Marks)**
  1.  **Verdict (2 marks):** Clearly states AVR fails Strong Pareto.
  2.  **Counterexample Construction (4 marks):** Provides explicit streams (e.g., $u=all 0$, $v=1$ then $0s$). Streams must be bounded and distinct.
  3.  **Limit Calculation (4 marks):** Correctly shows the sum of differences is finite constant while $n \to \infty$, yielding limit 0. Concludes $v \sim u$.
      *   *Distinction:* A First-class answer notes that finite changes vanish. A 2:1 might just show the math without commenting on the "finite vs infinite" implication.

  **Part (b): Completeness (10 Marks)**
  1.  **Verdict (2 marks):** Clearly states AVR fails Completeness.
  2.  **Counterexample Construction (5 marks):** Provides streams where the *average* oscillates, not just the values. (Crucial: Simple alternation $1,0,1,0$ converges to $0.5$). Must use expanding blocks or similar mechanism to prevent convergence.
  3.  **Limit Argument (3 marks):** Demonstrates $\liminf \neq \limsup$ or explains why the limit fails to settle.
      *   *Distinction:* A First-class answer catches the trap of simple alternation. A 2:1 often uses $1,0,1,0$ and incorrectly claims the limit doesn't exist.

  **Part (c): Discussion (5 Marks)**
  1.  **Position (2 marks):** Takes a clear stance (cost vs. feature).
  2.  **Reasoning (3 marks):** Connects incompleteness to avoiding arbitrariness or preserving Pareto.
      *   *Distinction:* A First-class answer links incompleteness to the avoidance of discounting or dictatorship. A 2:1 gives a generic "it makes decision making hard" answer.

  **Common Mistakes (Deduct Marks)**
  1.  **The Alternation Trap (Part b):** Using $v=(1,0,1,0\dots)$ and claiming the average diverges. (Cost: 4 marks in Part b). The average of this stream converges to 0.5.
  2.  **Confusing Pareto Principles (Part a):** Testing Weak Pareto (all strict) instead of Strong Pareto (one strict). If the counterexample relies on everyone changing, it doesn't test Strong Pareto specifically. (Cost: 3 marks).
  3.  **Unbounded Streams:** Constructing counterexamples with infinite utility values (e.g., $u_i = i$). The question specifies bounded streams. (Cost: 2 marks).
