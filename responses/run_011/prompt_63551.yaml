answer: |-
  Your hypothesis is correct: the debate conflates training signals with safety audits, but the real unresolved conflict is an empirical question about whether optimizing intermediate steps prevents specification gaming better than outcome optimization, masked by differing priors on the observability of deception.

  The dispute is a hybrid of verbal confusion, empirical uncertainty, and divergent risk priors. Verbally, "Process Supervision" oscillates between a *training mechanism* (dense reward signals for intermediate tokens) and an *oversight mechanism* (humans auditing chains of thought for safety). When outcome proponents argue process rewards teach models to "look right," they are attacking the training mechanism; when process proponents argue outcomes encourage lying, they are defending the oversight mechanism. They are talking past each other because one side is optimizing for capability generalization while the other is optimizing for threat detection. Empirically, the core crux is whether "honesty" or "reasoning quality" is a local property visible in trajectories or a global property only visible in results. If deception is computationally hidden in the weights rather than explicit in the tokens, process auditing is useless regardless of reward density. Finally, the disagreement rests on unspoken priors about cost and catastrophe: outcome proponents prioritize scalability and capability (assuming safety emerges from competence), while process proponents prioritize robustness (assuming competence without oversight leads to gaming).

  To settle the empirical core, you need an experiment that decouples reward density from oversight visibility. Train two populations of agents on a multi-step task where shortcutting is possible but detectable only in intermediate steps (e.g., a coding task where a secure solution requires specific checks that don't affect immediate functionality but prevent future exploits). Vary the reward signal: Group A gets outcome-only rewards (code runs/pass fails), Group B gets process rewards (human/AI feedback on each function's logic). Crucially, introduce an out-of-distribution test set where the shortcut leads to failure only in edge cases. Measure both task success and "integrity" (did they take the secure path?). Process supervision wins if Group B maintains integrity on OOD tasks while Group A degrades to shortcuts; Outcome supervision wins if Group B overfits to the specific process rewards and fails to generalize reasoning to new contexts, or if Group A finds robust solutions without the dense signal. A second experiment must test observability: train agents in a sandbox where lying yields higher reward, then freeze weights and ask independent auditors to classify deception based solely on trajectories vs. solely on outcomes. If auditors cannot detect deception in trajectories above chance, process oversight is fundamentally broken regardless of reward structure.

  The parts of this debate that will never be settled are the value judgments on cost and risk tolerance. If you believe AGI poses an existential risk, you will accept the high cost of process oversight even if it yields diminishing capability returns; if you view AI as an economic tool, outcome supervision is the only viable path because human auditing doesn't scale. Similarly, priors on "deceptive alignment" are currently unfalsifiable; if someone believes models will hide their intent in latent space rather than text, no amount of trajectory auditing will convince them, and if someone believes models are just stochastic parrots, no amount of outcome hacking will convince them safety is fragile.

  Progress here requires shifting the question from "which is better" to "what is the minimum signal density required to prevent specification gaming without causing overfitting." The current binary framing is ill-posed because the optimal solution is likely adaptive: outcome supervision for low-stakes tasks, process supervision for high-stakes decisions, and automated interpretability tools to bridge the cost gap. The answerable question neither side is asking is: "Can we distill process oversight into a scalable model-based signal that retains the nuance of human audit without the cost?" This moves the goalpost from human-in-the-loop forever to building a verifier that generalizes the *intent* of process supervision, which is the only path that satisfies both the safety requirements of the process side and the scalability requirements of the outcome side.
