answer: |-
  **Moderator Guide: Everettian (A) vs. QBist (B)**

  **Pair 1: The No-Go Framework**
  **Evasion Gloss:** A claims theorem proves reality; B claims theorem proves framework is wrong.
  **Q-A:** The theorem assumes independent systems have uncorrelated underlying states. If you accept that framework, does the result prove the quantum state is physical, or only that it can't overlap within that specific model?
  **Q-B:** You reject the framework entirely. Is refusing the premise a principled dissolution of the problem, or just immunity-by-redescription? What would you say to a view that accepts the framework but lands on your side?
  **F-up A:** Don't say "it's physical." Say exactly what property the theorem forces you to accept that a non-realist denies.
  **F-up B:** Don't say "framework is bad." Say what empirical claim you are making that the realist isn't.

  **Pair 2: The Two Labs Case**
  **Evasion Gloss:** A says facts exist independently; B says facts depend on agent access.
  **Q-A:** Two labs run identical preparations. Run 1: truly isolated. Run 2: secretly correlated by noise. The quantum description is identical. Is there a fact of the matter about which run is which, and does your realism make the theorem's premise true?
  **Q-B:** Same case. Can an agent coherently *assume* the systems are independent for betting purposes without believing it is ontologically true? Is the premise a claim about the world or our modeling permissions?
  **F-up A:** If the fact exists but is undetectable, what work is it doing besides satisfying your realism?
  **F-up B:** If the assumption works regardless of truth, why isn't your view just instrumentalism with extra steps?

  **Pair 3: Decoherence Basis**
  **Evasion Gloss:** A appeals to dynamics; B appeals to agent experience.
  **Q-A:** Can decoherence single out a preferred basis without help from anything non-unitary? If the basis choice looks conventional, does branching become conventional too?
  **Q-B:** If there's no physical branching, what *is* decoherence on your picture? Is it a consistency constraint on an agent's assignments, and if so, whose constraints?
  **F-up A:** If branching is basis-dependent, is the number of branches a fact or a choice?
  **F-up B:** If constraints are agent-relative, can two agents legitimately disagree on whether decoherence occurred?

  **Pair 4: Decoherence Nature [CUT IF NEEDED]**
  **Evasion Gloss:** A says "physical process"; B says "updating rule".
  **Q-A:** Is decoherence a physical process happening to the field, or a description of how the field looks to a subsystem?
  **Q-B:** Is decoherence a physical process happening to the agent, or a rule for how the agent updates their catalog?
  **F-up A:** If it's physical, where is the cut between system and environment?
  **F-up B:** If it's a rule, why does it look so much like a physical dynamical evolution?
  *Cut Flag: Pair 4 is most expendable. It overlaps heavily with Pair 3 and is too technical for a general audience.*

  **Pair 5: Friend Outcome**
  **Evasion Gloss:** A says "both outcomes exist"; B says "outcome is relative".
  **Q-A:** In Wigner's Friend, the friend sees an outcome, Wigner sees a superposition. What is the word "outcome" doing when the friend has one and Wigner doesn't?
  **Q-B:** Can the friend's own state assignment be wrong about the friend's own experience? If not, in what sense are her probabilities answerable to anything external?
  **F-up A:** If both outcomes exist, why does the friend report only one?
  **F-up B:** If the experience is private, how do you explain agreement between Wigner and Friend later?

  **Pair 6: Friend Assignment**
  **Evasion Gloss:** A says "perspective matters"; B says "no single story".
  **Q-A:** Does Wigner's description contradict the Friend's, or do they describe different branches of the same reality?
  **Q-B:** Does Wigner's description contradict the Friend's, or do they describe different agents' valid betting commitments?
  **F-up A:** If they describe the same reality, how do you resolve the contradiction without collapse?
  **F-up B:** If they describe different commitments, is there any world they are both betting on?

  **Pair 7: Probability**
  **Evasion Gloss:** A says "weights guide care"; B says "probabilities guide bets".
  **Q-A:** How does a Born weight do any work when every branch happens? Why should I care about a branch with low weight?
  **Q-B:** If your probabilities are no more objective than tastes, what explains the striking convergence between different agents' assignments? Is that convergence a miracle or a platitude?
  **F-up A:** Don't say "rationality." Say why rationality tracks squared amplitude specifically.
  **F-up B:** Don't say "shared world." Say what forces the convergence if the world isn't determining it.

  **Pair 8: Meta-Disagreement**
  **Evasion Gloss:** A says "B misses reality"; B says "A reifies math".
  **Q-A:** If no experiment separates the views, is this substantive or vocabulary? Name one thing you'd give up if QBism turned out to be right.
  **Q-B:** Same question. Name one thing you'd give up if Everettianism turned out to be right.
