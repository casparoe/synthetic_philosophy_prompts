prompt: |-
  so im a junior and for my physics class we each have to pick one "controversial idea in cosmology," write it up, and present it while the rest of the class is allowed to attack us afterwards. I picked Gödel and Einstein. Almost everything I have comes from a paperback in the school library, one of those big popular history-of-the-universe books — I don't remember the author's name and I'm not able to go back to the library before monday, I photographed the page but half of it is out of focus. Here's the gist of the passage as best I can read it:

  "Gödel spent his later years obsessed with time. For Einstein's seventieth birthday he contributed a solution of Einstein's own field equations describing a universe filled with matter that rotates slowly as a whole. In such a universe, if you steer a rocket far enough in the right direction, you come back to where you started — not just in space but in time, arriving before you left. Gödel used this to show that travel into the past is physically possible. Einstein, who had always maintained that the passage of time is an illusion, was persuaded, and conceded that general relativity describes no real lapse of time. Physics has therefore established that time is unreal; the only reason we are not visited by people from the future is that nobody has yet built a big enough rocket."

  I really don't want to stand up there and repeat something that makes me look like I got all of this from a crank site. So can you go through it piece by piece and tell me what's actually solid, what's a reasonable simplification that a specialist wouldn't mind, and what's flat wrong or at least something a philosopher of physics would push back on hard?

  Two spots I'm especially stuck on. First: is finding one weird solution of the equations enough to prove anything about the universe we live in, or is Gödel's argument supposed to work some other way? The book kind of slides from "here's a possible universe" to "physics has established time is unreal" and I can't tell if there's a step missing or if I'm just not getting it. Second: that last line about the rocket — does it follow from anything in the rest of the paragraph, or is it a total non sequitur stuck on the end for effect?

  Also, my own hunch, which might be made up: I think the book is fusing two separate Einstein things together, namely that Einstein already thought the flow of time was illusory, and that Gödel's rotating universe convinced him of it. Tell me if that hunch is right or if I'm inventing a distinction.

  And if there's a defensible version of the argument buried in there, give me a sentence or two I could actually say out loud in class without getting torn apart — including what someone who knows the physics would point out about whether our universe is anything like the one in the book.
