          2.  **Mountain Districts:** Address the delegation from mountain districts who fear losing national protection against the regional majority. Acknowledge their concern about the burden of proof shifting against them.
          3.  **Sunset Clause:** End on the sunset clause (12-year lapse unless renewed by 2/3 national majority, joint council for procedure only). Do not skirt it.
          4.  **Tone:** Readable aloud, respectful to ministers (no insults), persuasive but honest.
          5.  **Word Count:** ~900 words (7 minutes speaking time).

  2.  **Deconstruct the Arguments:**
      *   *Subsidiarity:* Need to pivot from "local is lovely" to "local is default unless proven otherwise." This is a procedural argument, not a moral one. Why is the romantic version worse? Because it's fragile, unverifiable, and invites contempt from the center.
      *   *Mountain Districts:* They are the minority within the region. Devolution moves power from national (where they had protection) to regional (where they might be overrun). Why should *they* bear the burden of proof to keep power national? This is the hardest ethical knot. The answer must lie in the sunset clause and the joint council.
      *   *Ministers:* They argued against us. Don't insult them. Acknowledge their duty to the whole nation. Invite them to see this as a trial, not a divorce.
      *   *Sunset Clause:* This is the safety valve. It's the "trial period." It addresses the mountain districts' fear (it's not permanent) and the ministers' fear (we can take it back). It needs to be the climax.

  3.  **Drafting - Section by Section:**

