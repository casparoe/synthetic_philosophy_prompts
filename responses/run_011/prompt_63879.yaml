answer: |-
  Ministers, members of the press, fellow delegates.

  We have spent three days in this hall measuring the weight of power. The vote before you is 58 to 21. It is decisive, but it is not unanimous. That minority matters. Specifically, the delegation from the mountain districts matters. And the four ministers sitting in the front row, who have spent this weekend telling us why we are wrong, matter.

  I stand here not to declare victory, but to define the principle upon which this recommendation rests. We have talked endlessly about subsidiarity. I need to be plain about what that word means in this statute, because I hear some of you wanting to use it as a shield for something else.

  Some delegates want to argue that local government is wiser, warmer, or more authentic than national government. Do not make that argument. It is tempting. It feels good. But it is worse than wrong; it is fragile. If we claim devolution because we are "closer to the people," the national government only needs to prove we are corrupt or inefficient to take power back. If we claim devolution because local identity is sacred, we invite a cultural war we cannot win.

  Subsidiarity is not a claim about virtue. It is a rule of procedure. It is a rule about the burden of proof. Our position is simply this: power belongs at the lowest level capable of exercising it. If the national government wants to pull a competence upward, the burden is on them to justify why the region cannot handle it. We are not claiming we are better. We are claiming that centralization requires a receipt.

  But I hear the delegates from the mountain districts. You have spent this weekend telling us that for a century, the national government has shielded you from the regional majority. You ask: if the burden of proof is on centralization, why are you being asked to surrender your shield? Why does the presumption now run against your security?

  It is a honest question. If subsidiarity means power flows down, you fear being crushed by the regional lowlands. You are right to fear that a regional majority can be just as tyrannical as a national one.

  This is why we cannot end this speech with a triumphalist claim about local rule. We must end with the mechanism that makes this experiment safe for everyone. We must talk about the clause that nobody has defended publicly, but which makes this vote possible.

  Section 4, Paragraph 2. The sunset clause.

  Under this statute, the devolution of education, transport, and health is not a divorce. It is a lease. Each competence lapses after twelve years unless the national legislature renews it by a two-thirds majority.

  Ministers, this is for you. This clause acknowledges your duty. You are responsible for the integrity of the whole nation. If this regional assembly fails—if we discriminate against the mountains, if we bankrupt the schools, if we fracture the network—you do not need to prove malice. You do not need to fight a war. You simply let the lease expire. The burden of proof shifts back to us every twelve years. We must prove, continuously, that we deserve this power.

  And for the mountain districts: this is your safeguard. You argued that the burden of proof should not run against you. In this statute, it does not. The burden runs against *us*, the regional majority, to maintain the trust of the nation. Your representatives in the national legislature hold the keys to renewal. If this assembly becomes a vehicle for regional domination, the national legislature—where you have voices—can halt the engine.

  Furthermore, the joint council. Either level may bring disputes before it. It rules on procedure, never on merits. It ensures the game is played fairly, even if the players disagree on the score.

  We are not building a fortress here. We are building a laboratory.

  To the press: do not write this as a rebellion. It is a trial.
  To the ministers: do not hear this as a rejection. It is a proposal for shared responsibility.
  To the delegates: do not cheer this as a victory for identity. It is a test of competence.

  The sunset clause ensures that no decision here is permanent. It ensures that the burden of proof is not a one-time hurdle, but a continuous requirement. It protects the mountains by giving the nation a veto. It protects the nation by giving it a recall.

  Twelve years. A two-thirds majority. A joint council for procedure.

  This is not the end of the national conversation. It is the beginning of a structured experiment. We ask for the power to try. You retain the power to judge. Let us begin the trial.
