      *   *Correction on P3:* Cost is 3x. Contractor rule: "decline... if raises ingredient cost per meal by more than a stipulated margin." 3x ingredient cost is huge. Even if ingredient cost is only 50% of total meal cost, that's a 100%+ increase in meal cost. This should trigger an automatic "Cost Veto" in the procedure. I will make sure the procedure catches this early.
      *   *Correction on P2:* Soy from Savanna. This is "Wild Animal Displacement." Needs to be weighed against "Farmed Chicken Reduction."

  10. **Final Polish:** Ensure the "Plain Language Summary" looks like something a Chair can paste into an email. Ensure the "Limitations" section is stern about individual advice.

  *(Self-Correction on the "Creation Problem"):* The prompt asks me to take an *explicit position*. I cannot leave it open. I will adopt the "Negative Interest" view: Bringing a being into a life of net suffering is a harm, even if no one is there to be harmed. This is standard in antispeciesist ethics but controversial. I will label it clearly as a Value Assumption.

  *(Self-Correction on Sentience):* The prompt asks for a sensitivity check. I will create a "Low Sentience" and "High Sentience" column for invertebrates/field animals.

  *(Self-Correction on Double Counting):* I need to be very clear.
  *   Farmed Animal Score = Count * Suffering Intensity * Sentience Weight.
  *   Field Animal Score = Crop Hectares * Density * Sentience Weight.
  *   Wild Animal Score = Land Use Change * Displacement Rate.
  *   *Feed:* The grain fed to chicken is counted in "Crop Hectares." The chicken is counted in "Farmed Animal." This is *not* double counting because one is the death of the field mouse in the wheat field, the other is the life/death of the chicken. They are distinct victims. I will clarify this in the instructions.

