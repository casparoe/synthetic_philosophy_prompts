answer: |-
  # The Dining Ethics Worksheet (DEW) v1.0

  **Purpose:** To convert under-specified food system proposals into comparable ethical impact profiles.
  **User:** Rotating undergraduate volunteer.
  **Time Budget:** 2 Hours (assuming data availability).
  **Output:** One completed matrix + one plain-language summary for the Committee Chair.

  ---

  ## Part 1: Administrative & Baseline Check
  *Do not proceed to ethical scoring if the proposal fails Step 1.*

  **1.1 Cost Constraint**
  *   **Input:** Contractor's estimated change in ingredient cost per meal.
  *   **Constraint:** Does this exceed the stipulated margin (e.g., 5%)?
  *   **Decision:**
      *   [ ] **Yes:** Stop. Recommendation: "Rejected on Cost Grounds." (No ethical analysis needed).
      *   [ ] **No:** Proceed.
      *   [ ] **Unclear:** Escalate to Contractor Liaison.

  **1.2 Baseline Definition**
  *   **Instruction:** You cannot measure change without a fixed starting point. Write down exactly what is being replaced.
  *   **Baseline Menu Item:** _________________________________________________
  *   **Baseline Annual Volume:** (e.g., 4,000 dinners × 100 days = _________ portions)
  *   **Baseline Supply Chain:** (e.g., Conventionally raised beef, feedlot finished, domestic)

  ---

  ## Part 2: Empirical Inputs (The "What")
  *Fill in the boxes. If a number is unknown, use a bounded range (Low–High) based on vendor data or conservative estimates. Do not guess a single point.*

  **2.1 Farmed Animals (Vertebrates)**
  *   **Definition:** Animals brought into existence specifically for this food line.
  *   **Metric:** Total individual lives per year.
  *   **Baseline Count:** __________ (e.g., Beef: 1 animal per ~300kg meat)
  *   **Proposal Count:** __________ (e.g., Chicken: 1 animal per ~2kg meat)
  *   **[WARNING: VALUE JUDGMENT]** *See Part 3.1 for how to value these lives.*

  **2.2 Field Animals (Invertebrates & Small Vertebrates)**
  *   **Definition:** Animals killed during the harvest of crops required for this menu (including feed crops).
  *   **Metric:** Hectares of crop cultivation required per year.
  *   **Baseline Crop Area:** __________ hectares (Include grain fed to baseline animals).
  *   **Proposal Crop Area:** __________ hectares.
  *   **Note on Double Counting:** Do *not* subtract feed crops from the animal count. The field mouse dying in the cornfield is a distinct victim from the chicken eating the corn. Count both.
  *   **Source of Data:** Vendor land-use estimates or average yield tables (e.g., tons/hectare).

  **2.3 Wild Animals (Land Use Change)**
  *   **Definition:** Wild populations displaced or supported by the land footprint (e.g., pasture vs. forest vs. savanna).
  *   **Metric:** Change in land classification (e.g., "Conversion of 50ha Savanna").
  *   **Baseline Land Type:** _________________________
  *   **Proposal Land Type:** _________________________
  *   **Location:** (Domestic / International). *If International, flag for Scope Decision in Part 3.3.*

  ---

  ## Part 3: Valuation Parameters (The "How Much")
  *This section contains value judgments disguised as arithmetic. The volunteer does not settle these; they select the setting agreed upon by the Committee or use the Default Sensitivity Range.*

  **3.1 The Existence Assumption (Non-Identity Problem)**
  *   **Question:** Is bringing an animal into a life of net suffering a "harm" even if that specific animal would not otherwise exist?
  *   **Committee Default:** **Yes.** (Preventing a net-negative life counts as an ethical benefit).
  *   **Action:** If the proposal *increases* the number of farmed animals (e.g., Beef to Chicken), record this as a **Negative Score**. If it *decreases* them, record as a **Positive Score**.
  *   **[ESCALATION FLAG]:** If a Committee member objects to this default, this proposal must be voted on by the full Committee, not the volunteer.

  **3.2 Sentience Weighting (Sensitivity Check)**
  *   **Question:** How much do we weigh a field invertebrate compared to a farmed vertebrate?
  *   **Instruction:** Calculate your result twice using these two weights. Do not average them.
      *   **Scenario A (Conservative):** Invertebrate/Field Weight = 0.001 of a Vertebrate.
      *   **Scenario B (Precautionary):** Invertebrate/Field Weight = 0.1 of a Vertebrate.
  *   **Farmed Vertebrate Weight:** Fixed at 1.0.

  **3.3 Scope of Harm (Geographic & Causal)**
  *   **Question:** Do we count harms in the supply chain we do not directly purchase from (e.g., soy deforestation upstream)?
  *   **Committee Default:** **Yes, if traceable.** (If the vendor admits the soy source, the harm is in scope).
  *   **Action:** If the proposal relies on commodities with known high-conversion risk (e.g., South American Soy), mark "High Wild Harm Risk."

  ---

  ## Part 4: Calculation Matrix
  *Complete both columns. If the verdict differs between Scenario A and B, the result is "Sentience-Dependent."*

  | Impact Category | Metric (From Part 2) | Unit Weight (From Part 3) | **Score A** (Low Field Weight) | **Score B** (High Field Weight) |
  | :--- | :--- | :--- | :--- | :--- |
  | **Farmed Lives** | (Proposal Count - Baseline Count) | 1.0 per life | [Calc] | [Calc] |
  | **Field Deaths** | (Proposal Hectares - Baseline Hectares) | 0.001 / 0.1 | [Calc] | [Calc] |
  | **Wild Displacement** | (Qualitative Risk: Low/Med/High) | N/A | **Flag** | **Flag** |
  | **Net Ethical Score** | **Sum of Rows** | | **Total A** | **Total B** |

  *Note on Arithmetic:* A positive score means the proposal is *better* than baseline (reduces harm). A negative score means the proposal is *worse* (increases harm).

  ---

  ## Part 5: Market & Leakage Check
  *   **Question:** Will this change cause students to opt-out of the meal plan and eat elsewhere?
  *   **Input:** Contractor projection of participation decline (e.g., 8%).
  *   **Rule:** If projected decline > 5%, the "Net Ethical Score" is invalidated.
  *   **Reasoning:** Institutional procurement cannot claim credit for harm reduction if the demand simply shifts to an unregulated market.
  *   **Action:** [ ] Valid [ ] Invalidated (Escalate to Chair).

  ---

  ## Part 6: Recommendation Logic
  *   **If Cost Fail:** Recommend Rejection.
  *   **If Leakage Invalidated:** Recommend "Pilot Study Required" (Do not adopt system-wide).
  *   **If Score A and Score B are both Positive:** Recommend Adoption.
  *   **If Score A and Score B are both Negative:** Recommend Rejection.
  *   **If Scores Diverge (A is Positive, B is Negative):** Recommend "Sentience-Dependent." State: "Adoption depends on whether the Committee values field invertebrates highly."
  *   **If Farmed Lives Increase Significantly:** Flag "Existence Assumption Dispute."

  ---

  # Application to Live Proposals

  **Context:** 4,000 dinners/night. Baseline: Conventional Beef.
  **Assumptions for Calculation:**
  *   Beef: 1 animal provides ~300kg meat. ~200 portions. (20 animals/night).
  *   Chicken: 1 animal provides ~2kg meat. ~10 portions. (400 animals/night).
  *   Multiplier: Switching Beef to Chicken increases individual count by ~20x per portion, but portion sizes vary. Prompt states "factor of several hundred." We will use **200x** for the calculation to reflect the prompt's severity.
  *   Crop Area: Beef (Feedlot) requires high grain. Chicken requires high grain. Prompt says Chicken land use is "order of magnitude" lower. We will assume **10% of Baseline Crop Area**.

  ### Proposal 1: Beef Default → Chicken Default
  *   **Cost:** -40% (Passes).
  *   **Farmed Lives:** Baseline (20 cows) → Proposal (4,000 chickens).
      *   Change: +3,980 lives/night.
      *   Score: **-3,980** (Negative, as lives created are assumed net-negative).
  *   **Field Deaths (Crops):**
      *   Baseline: 100 Hectares (High grain for beef).
      *   Proposal: 10 Hectares (High efficiency chicken).
      *   Change: -90 Hectares.
      *   Score A (0.001 weight): +0.09 (Negligible benefit).
      *   Score B (0.1 weight): +9.0 (Small benefit).
  *   **Wild Displacement:** Land use drops 90%. **High Benefit.**
  *   **Leakage:** None projected.
  *   **Net Score A:** -3,979.91 (Strong Negative).
  *   **Net Score B:** -3,971.00 (Strong Negative).
  *   **Verdict:** **REJECT.**
  *   **Plain Language:** "While this swap drastically reduces land use and carbon footprint, it increases the number of individual animals brought into existence by a factor of 200. Under our default ethical framework, creating thousands of additional lives of potential suffering outweighs the benefit of reduced crop cultivation. This is not a clear ethical improvement."

  ### Proposal 2: 1/3 Chicken → Plant Analogue (Soy/Pea)
  *   **Cost:** Comparable (Passes).
  *   **Farmed Lives:** Reduces chicken count by 33%.
      *   Score: **+1,333** (Benefit).
  *   **Field Deaths:** Plant analogues require crop processing. Soy land use may shift to Savanna.
      *   Assume Crop Area stays constant but location changes.
      *   Score: **Neutral on quantity, High Risk on Location.**
  *   **Wild Displacement:** Soy from converted Savanna.
      *   Scope Check: Committee split on "distant harm."
      *   Action: **ESCALATE.**
  *   **Verdict:** **CONDITIONAL.**
  *   **Plain Language:** "This proposal reduces farmed animal counts significantly. However, it relies on soy linked to land conversion in South America. The Committee must decide if 'out-of-scope' supply chain harms veto the direct benefit of fewer chickens."

  ### Proposal 3: 50% Chicken → Pasture-Raised Poultry
  *   **Cost:** +300% ingredient cost.
      *   Constraint Check: Contractor margin usually caps at ~5-10% total meal cost increase. A 3x ingredient cost spike likely violates the "stipulated margin."
      *   **Cost Decision:** **FAIL.** (Stop here).
  *   **Leakage:** 8% participation drop projected.
      *   Rule Check: >5% decline invalidates ethical score.
      *   **Leakage Decision:** **INVALIDATED.**
  *   **Verdict:** **REJECT (Procedural).**
  *   **Plain Language:** "This proposal exceeds the contractor's cost tolerance and is projected to drive 8% of students to eat off-campus. Because we cannot track the ethical impact of off-campus meals, we cannot claim a net benefit for this policy."

  ---

  # Limitations & Escalation Protocol

  **1. Judgment Dressed as Arithmetic**
  *   **The Existence Assumption (Part 3.1):** The worksheet treats "preventing a life" as a positive number. This is a philosophical stance (Negative Utilitarianism), not a mathematical fact. If the Committee adopts a "Rights-Based" view (where existence is neutral), Proposal 1's score changes drastically. **Escalate to Committee Chair if this assumption is challenged.**
  *   **Sentience Weights (Part 3.2):** The difference between 0.001 and 0.1 is not empirical; it is moral. The worksheet forces you to show the divergence, not hide it.

  **2. What This Procedure Cannot Do**
  *   **Individual Advice:** Do not use this worksheet to tell a student what *they* should eat. Institutional procurement moves aggregate volume; individual choice moves marginal demand. The "Leakage" math (Part 5) applies to institutions, not persons.
  *   **Carbon Accounting:** This worksheet tracks *harm to sentient beings*. It does not calculate CO2e. A proposal can be "Good for Climate" (Beef→Chicken) and "Bad for Animals" (more individuals) simultaneously. Do not conflate the two.
  *   **Nutritional Adequacy:** This procedure assumes all proposals meet basic nutritional standards. It cannot evaluate health impacts.

  **3. When to Escalate**
  *   If the "Sentience-Dependent" result flips the recommendation (Scenario A = Adopt, Scenario B = Reject).
  *   If the "Leakage" projection is >5%.
  *   If the "Scope of Harm" (International supply chain) is disputed.
  *   If the Cost Constraint is breached.

  **4. Data Substitutions**
  *   **If Crop Area is unknown:** Use "Feed Conversion Ratio" × "Animal Count" × "Average Yield per Hectare."
  *   **If Field Death Density is unknown:** Use the Sensitivity Range (Part 3.2) to bracket the uncertainty. Do not invent a number.
  *   **If Wild Displacement is unknown:** Mark as "Unverified Risk." Do not assume zero.

  ---

  # Summary for the Committee Chair (Template)

  **Proposal:** [Name]
  **Cost Impact:** [Pass/Fail]
  **Ethical Verdict:** [Adopt / Reject / Conditional / Sentience-Dependent]

  **Key Trade-off:**
  This proposal [increases/decreases] the number of farmed individuals by [X]%. It [increases/decreases] crop cultivation area by [Y]%.

  **Uncertainty:**
  The result depends on [Sentience Weighting / Supply Chain Scope / Student Leakage].

  **Recommendation:**
  [Insert One Sentence Defense, e.g., "While land use drops, the explosion in individual animal lives makes this ethically regressive under our current framework."]
