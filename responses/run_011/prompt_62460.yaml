      *   *Sentience:* Use a multiplier $S$. $S_{vertebrate} = 1$. $S_{invertebrate} = [0.001, 0.1]$.

  4.  **Developing the Test Cases (Mental Math & Logic):**

      *   *Baseline:* 4,000 Beef dinners.
