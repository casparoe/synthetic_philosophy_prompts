      *   *Non-Identity:* Does preventing a life count as a benefit? The prompt asks for an *explicit position*. I need to choose one that allows calculation but acknowledges the controversy. A "Negative Utilitarian" leaning or a "Existence-Neutral" approach is common in food ethics, but the prompt implies the committee is stuck. I will adopt a "Harm-Focused" stance: Preventing a life of net suffering is a reduction in total harm, even if no specific subject is harmed. This needs to be flagged as a value judgment.
      *   *Sentience:* Invertebrates vs. Vertebrates. Needs a sensitivity range (e.g., Weight = 0.01 to 1.0 relative to vertebrates).
      *   *Market Effects:* Leakage (students eating off-campus). Is this in scope? The prompt asks the procedure to decide. Usually, institutional procurement focuses on direct supply chain, but if leakage is high, the net impact is null. I will designate this as an "Escalation/Uncertainty" factor.
      *   *Cost:* Hard constraint. If cost > margin, recommendation is void regardless of ethics.
      *   *Volunteer Friendly:* Needs simple arithmetic, clear boxes to fill, no complex integrals.

  3.  **Drafting the Procedure (The "Dining Ethics Worksheet"):**

      *   *Structure:*
          1.  Administrative Check (Cost/Feasibility).
          2.  Baseline Definition.
          3.  Impact Calculation (The Three Categories).
          4.  Valuation (Sentience & Existence).
          5.  Synthesis & Sensitivity.
          6.  Recommendation.
      *   *Handling the "Beef vs. Chicken" Intuition:* Beef has high land/emissions but fewer individuals. Chicken has low land/emissions but *many* individuals + high field death toll due to feed intensity. If we weight individual lives and field deaths heavily, Chicken might look worse or neutral compared to Beef, despite the land savings. This aligns with the user's suspicion.
      *   *Handling Feed:*
