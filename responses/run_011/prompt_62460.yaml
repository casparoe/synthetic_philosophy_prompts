      *   *Tone:* Professional, bureaucratic but ethically rigorous, plain language.
      *   *Format:* Step-by-step worksheet.
      *   *Constraints Check:*
          *   2 hours? Yes, if data is ready.
          *   No stats? Yes, simple multiplication/addition.
          *   Ranges? Yes, use Low/High estimates.
          *   Escalation? Yes, mark value judgments.
          *   Limitations? Yes, closing section.

  7.  **Addressing Specific Ethical Nuances:**
      *   *Feed Conversion:* Don't count field deaths for grain *and* count the animal's life as if it didn't eat grain. Actually, the standard way is: Total Crop Area -> Field Deaths. Total Animal Count -> Farmed Suffering. They are additive but distinct. The "double counting" risk is counting the grain's field deaths as *part* of the animal's harm *and* as a separate category. I will separate them: Category A (Farmed Life), Category B (Field Life from Crops).
