answer: |-
  # HANDOUT: MAPPING YOUR ETHICAL INTUITIONS
  **Session: Karma, Consequences, and the Hard Choices**

  **Instructions:** Read each scenario. Circle the response that matches your gut reaction. Do not overthink. At the end, use the Key to find your ethical "center of gravity."

  **1. The Fame Donation.** You donate a large sum to a clinic. The money saves fifty lives. However, your only reason for giving was to impress a colleague. Is the act morally good?
  *   A. Yes. The lives saved are what matter.
  *   B. No. The mind behind the act was poisoned by greed.
  *   C. It's mixed. The result is good, but you haven't grown as a person.

  **2. The Failed Kindness.** You give money to a friend in crisis, motivated purely by love. The friend uses it for drugs and overdoses. Do you carry moral blame?
  *   A. Yes. You should have foreseen the risk; outcomes matter.
  *   B. No. Your intention was pure; the rest is not up to you.
  *   C. Yes, but lightly. You should feel sadness, not guilt.

  **3. The Bednet vs. The Shelter.** You have $1,000. Bednets save human lives cheaply. The animal shelter saves dogs expensively. You choose the bednets. Why?
  *   A. Human suffering counts more than animal suffering.
  *   B. More beings are saved in total; I am counting heads.
  *   C. I shouldn't be counting. I should give where my compassion feels most alive.

  **4. The Ship's Captain.** A passenger plans to kill 500 merchants to steal cargo. You kill him first. This saves the merchants *and* stops the killer from earning hellish karma. Is this permissible?
  *   A. No. Killing is always wrong, regardless of the math.
  *   B. Yes. Compassion sometimes requires getting your hands dirty.
  *   C. Yes, but only if you are willing to accept the karmic cost yourself.

  **5. The Future Self.** You can give away your salary now to help strangers, or save it to ensure you have time to meditate in old age. Which is better?
  *   A. Help strangers. Their suffering is real now.
  *   B. Save it. Your own liberation is the only thing that ultimately ends suffering.
  *   C. It depends. If saving it makes you resentful, give it. If it makes you stable, keep it.

  **6. The Slip.** You break a vow (e.g., lying) to protect someone's feelings. You feel no regret, only relief that they are happy. Is this okay?
  *   A. No. Breaking the vow damages your integrity, even if no one was hurt.
  *   B. Yes. The vow is a tool for reducing harm, not a cage.
  *   C. No. You should feel regret, because you trained your mind to lie easily.

  **7. The Ghost and the Human.** A hungry ghost and a human are both starving. You have one meal. Who gets it?
  *   A. The human. Their capacity for suffering and understanding is greater.
  *   B. Flip a coin. All sentient life has equal weight.
  *   C. Give it to whoever is in more acute pain in that moment.

  **8. The Aftermath.** You made a hard choice (like the Captain). Years later, how do you view it?
  *   A. I did the right thing. I have no need to purify.
  *   B. I did what was needed, but I must confess and purify the violence.
  *   C. The "I" who did it is empty. There is nothing to purify.

  ***

  ### SCORING KEY

  **Tally your answers.** Most people will have a mix. Find the column where you have the most matches.

  | **Profile** | **Mostly A** | **Mostly B** | **Mostly C** | **Mixed (No Clear Majority)** |
  | :--- | :--- | :--- | :--- | :--- |
  | **View Name** | **Compassionate Consequentialism** | **Karmic Intentionalism** | **Virtue & Character Ethics** | **See "Navigator" Below** |
  | **Core Claim** | Morality is about reducing suffering states in the world. | Morality is about the quality of volition in the agent. | Morality is about cultivating a reliable, compassionate character. | **The Middle Way Navigator** (Contextual/Empty) |
  | **Precepts** | Reliable guides, but overrideable for greater good. | Reflections of intent; breaking them signals bad intent. | Training rules to shape habit; broken only if wisdom demands. | Skillful means; no fixed rule applies to all contexts. |
  | **Awkward Commitment** | *You might have to sacrifice your own integrity to save others.* | *A well-intended disaster is morally perfect.* | *You might prioritize your own "goodness" over urgent aid.* | *It is hard to teach this to others without looking inconsistent.* |

  **Other Profiles (If your answers clustered differently):**
  *   **Mostly "No" on Q4 & Q6:** *Vinaya Absolutism.* (Precepts are exceptionless laws). *Awkward Commitment: You must let the murder happen to keep your hands clean.*
  *   **Mostly "B" on Q5:** *Soteriological Priority.* (Your liberation trumps worldly welfare). *Awkward Commitment: You might ignore preventable disease to meditate.*
  *   **Mostly "C" on Q8 & "B" on Q6:** *Bodhisattva Pragmatism.* (Break rules to save beings, accept the karma). *Awkward Commitment: You must be willing to suffer hell for others.*

  ***

  # FOR THE ORGANIZER (META-ANALYSIS)

  **1. Indistinguishable Leaves**
  *   **Virtue Ethics (Profile C) vs. Karmic Intentionalism (Profile B):** These are the hardest to separate. Both focus on the agent rather than the outcome.
      *   *How to pry them apart:* Look at **Question 6 (The Slip)**. The Intentionalist says if the intent was kind, the act was good *in that moment*. The Virtue Ethicist says the act is bad because it weakens the *habit* of truth-telling for the future. Intentionalism is atomic (act-by-act); Virtue Ethics is longitudinal (character-building).
      *   *In practice:* Most lay Buddhists conflate these. Your teacher likely sits here.

  **2. Logically Available but Undefended Combinations**
  *   **The "Hard Consequentialist Preceptualist":** Believing outcomes are the *only* thing that matters (Q1=A, Q2=A) BUT precepts are exceptionless (Q4=A, Q6=A).
      *   *Status:* **Incoherent.** You cannot claim only results matter while adhering to rules that sometimes produce worse results (like letting the Captain's murderer kill 500 people).
  *   **The "Selfless Rebirth Strategist":** Believing you should ignore your own future rebirth (Q5=A) but counting beings matters (Q3=B).
      *   *Status:* **Unappealing.** This is logically possible (altruistic utilitarianism), but rare in Buddhist circles because it discards the prudential motivation for karma (protecting oneself from future suffering) while keeping the calculus.

  **3. The "None of the Above" Trap**
  *   **The Middle Way Navigator:** I have positioned this as a valid profile, not the "smart" default. Its awkward commitment (inconsistency) is a real practical burden. It avoids privileging the "Empty" view as superior, framing it instead as "hard to teach." This respects your teacher's authority while acknowledging the complexity you feel.

  **4. Scoring Logic Note**
  *   The scoring key uses a "Cluster" method rather than a rigid tree. This is more forgiving for printed handouts where users can't jump back and forth easily. It allows people to see where their *weight* lies without forcing a binary choice on every question.
  *   **Q3 (Bednets)** is the primary sorter for Consequentialism vs. Intentionalism/Virtue.
  *   **Q4/Q6 (Captain/Slip)** are the primary sorters for Absolutism vs. Pragmatism.
  *   **Q5 (Future Self)** sorts Soteriological Priority from Worldly Ethics.
