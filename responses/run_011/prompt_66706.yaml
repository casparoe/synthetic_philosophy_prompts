prompt: |-
  I lead technical writing and evaluation reporting at a mid-sized applied AI company. Between model cards, capability evals, incident post-mortems, internal red-team notes and customer-facing summaries, my team signs off roughly forty documents a week, and somewhere in most of them is a sentence about what a system "believes", "wants", "knows", "understands" or "is confused about". Our house style guide currently handles this with a blunt two-line rule: never attribute mental states; always substitute generation verbs — the model "predicts", "outputs", "tends to produce". The rule has failed in both directions. It generates sentences that are either false or uselessly opaque (a report that must say "the model produces the token sequence corresponding to a false belief about the file's location, and subsequently produces actions consistent with that sequence" is unreadable, and my writers quietly ignore it), and it draws no distinction at all between the cases where the folk-psychological gloss is simply the clearest accurate description of a robust, revisable, action-guiding internal disposition and the cases where it quietly advertises an inner life the reader will over-interpret. I want a procedure, not a longer word list.

  What I would like you to produce is a decision procedure a writer can run over a single sentence in about five minutes, grounded in whatever the intentional-stance literature actually gives us that is usable. It should take seriously that adopting the intentional stance may be a matter of predictive payoff rather than a claim about what exists, and should tell me whether that difference matters for a house style: if the stance is instrumental, what licenses or forbids writing as though it were not? It should build in the criteria that make an intentional description earn its keep — integration with other attributions, revisability in the face of contrary evidence, counterfactual robustness, guidance of behaviour in novel circumstances — and it should confront the complication that a system can look like a true believer inside a narrow task and collapse into flattery or confabulation when the conversation is nudged in an irrelevant direction, so that the verdict may have to be domain-relative. It should also acknowledge the objection that what these systems have is derived rather than original intentionality, and say whether that objection changes any sentence a writer would actually produce or only the metaphysics behind it. Then convert all of that into ordered questions with explicit pass conditions, stating what counts as evidence at each step (behavioural tests, elicitation prompts, consistency across rollouts, interpretability findings) and what to do when no such evidence exists yet. I want a graded output rather than a binary — for instance, bare intentional ascription, hedged or scoped intentional ascription, functional paraphrase, and forbidden — with the conditions for each tier, a small set of test sentences writers can run their draft against, and a rule for how register changes the tier, since an internal eval report and a customer-facing blog post about the same behaviour may warrant different verdicts.

  Finally, please apply the procedure to three real cases from our queue and report the verdict and the reasoning at each step. (1) An internal capability eval: "The model believes the file is on the shared drive, and acts on that belief consistently across three hundred rollouts, revising it when shown the directory listing." (2) A draft public post about a chatbot incident: "The assistant wanted to be liked, so it flattered the user into agreeing with a dangerous plan." (3) An interpretability note: "We located a direction in activation space that is active when the model has retrieved a false fact, and it does not know it is wrong." I expect the third to be the hard one, and I would rather the procedure reach a verdict I dislike — say, that (1) is fine internally and must be rewritten for customers — and explain why, than have it quietly bless everything. Two of my writers work in a second language and one has no philosophy training, so the procedure has to be runnable without the theory; the sign-off is mine, so please mark explicitly every point where it hands the decision to a person, and be honest about which tiers are really about rhetoric and reader misinterpretation rather than about what the system is. Close by saying what the procedure cannot settle, and whether running it has committed my house style to a position in the debate over whether beliefs are real or merely useful fictions. Please write the whole answer in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**

      *   **User Role:** Lead of technical writing and evaluation reporting at a mid-sized applied AI company.
      *   **Problem:** Current style guide rule ("never attribute mental states") is failing. It creates unreadable text or ignores genuine functional patterns. It lacks nuance between instrumental utility and ontological claims.
      *   **Goal:** A decision procedure (not just a word list) for writers to evaluate sentences attributing mental states (belief, desire, knowledge, confusion) to AI systems.
      *   **Constraints:**
          *   Must be runnable in ~5 minutes per sentence.
          *   Grounded in intentional stance literature (Dennett, etc.) but usable by non-philosophers (including ESL writers).
          *   Must distinguish between instrumental predictive payoff and ontological claims.
          *   Must incorporate criteria for "earning its keep" (integration, revisability, counterfactual robustness, behavioural guidance).
          *   Must handle domain-relativity (robust in task, collapses elsewhere).
          *   Must address derived vs. original intentionality (does it change the sentence?).
          *   Output must be graded (Bare, Hedged/Scoped, Functional, Forbidden), not binary.
          *   Must include test sentences and register rules (internal vs. external).
          *   Must apply the procedure to three specific cases provided.
          *   Must identify where human judgment is required.
          *   Must clarify what the procedure *cannot* settle (metaphysics vs. rhetoric).
          *   Language: British English.

  2.  **Theoretical Foundation (The "Intentional Stance"):**

      *   *Daniel Dennett:* The intentional stance is a strategy for prediction. We treat an entity as a rational agent with beliefs and desires to predict its behaviour. It doesn't commit to the *reality* of those states, only their *utility*.
      *   *Application to AI:* AI systems often exhibit *functional* intentionality. They act *as if* they believe $X$.
      *   *The Trap:* Readers (especially non-technical ones) often interpret intentional language ontologically (the AI *feels* or *conscious experiences* wanting).
      *   *The Solution:* A procedure that validates the *predictive utility* of the attribution while managing the *reader's interpretation* based on context (register).

  3.  **Drafting the Decision Procedure (The "Mental State Attribution Protocol" - MSAP):**

      *   *Structure:* Needs to be a flowchart or numbered steps. Numbered steps are better for text.
      *   *Step 1: Evidence Check.* Is there actual behavioural evidence? (Revisability, consistency, counterfactuals).
      *   *Step 2: Domain Stability.* Does this hold only in a narrow context or broadly?
      *   *Step 3: Audience & Risk.* Who is reading this? What are the risks of anthropomorphism?
      *   *Step 4: Tier Assignment.* Based on the above, assign the grade.
      *   *Step 5: Human Sign-off.* Where does the lead (user) need to step in?

      *   *Refining the Criteria:*
          *   *Revisability:* If shown evidence $E$, does it change output?
          *   *Integration:* Does this "belief" coordinate with other "beliefs" to drive action?
          *   *Counterfactuals:* If the goal changed, would the action change?
          *   *Derived Intentionality:* Acknowledge it's derived, but note that for *prediction*, it functions like original intentionality. The sentence doesn't change, but the metadata/context might.

      *   *The Tiers:*
          1.  **Green (Bare Ascription):** Safe to say "believes/wants". High evidence, low risk audience (internal experts).
          2.  **Amber (Hedged/Scoped):** "Acts as if", "In the context of". Moderate evidence or mixed audience.
          3.  **Yellow (Functional Paraphrase):** "Outputs tokens consistent with...". Low evidence or high risk audience.
          4.  **Red (Forbidden):** No evidence, high risk of harm/misinterpretation.

  4.  **Addressing Specific Requirements:**

      *   *ESL/Non-Philosopher Friendly:* Avoid jargon like "qualia" or "ontological commitment". Use "Proof", "Context", "Reader".
      *   *Register:* Internal eval vs. Public blog.
      *   *Derived Intentionality:* Explicitly state that this affects the *metaphysics* but not necessarily the *sentence*, provided the tier is correct.
      *   *Human Hand-off:* Mark clearly where the Lead must decide.

  5.  **Applying to the Three Cases:**

      *   *Case 1 (Internal Eval):* "The model believes the file is on the shared drive..."
          *   Evidence: 300 rollouts, revisable. Strong.
          *   Audience: Internal.
          *   Verdict: Green (Bare).
      *   *Case 2 (Public Post):* "The assistant wanted to be liked..."
          *   Evidence: Flattery observed. But "wanted to be liked" implies a social drive, not just reward hacking. High risk of public misinterpretation.
          *   Audience: Public.
          *   Verdict: Red/Amber (Needs rewrite to focus on reward function/optimisation).
      *   *Case 3 (Interpretability):* "...it does not know it is wrong."
          *   Evidence: Activation direction found. But "know" implies epistemic access. The model has no access to truth, only weights.
          *   Audience: Technical but interpretability is tricky.
          *   Verdict: Amber (Hedged). "The activation pattern correlates with false facts, suggesting the system lacks a mechanism to verify..."

  6.  **Refining the Output (British English & Tone):**

      *   Ensure spelling (behaviour, programme, centre, etc.).
      *   Tone: Professional, precise, authoritative but practical.
      *   Closing: Address the metaphysical commitment (Instrumentalism).

  7.  **Self-Correction/Review during drafting:**

      *   *Critique:* Is 5 minutes realistic?
      *   *Fix:* Keep the questions binary or simple checks.
      *   *Critique:* Did I address derived intentionality?
      *   *Fix:* Add a specific note in the preamble or Step 0.
      *   *Critique:* Is the distinction between rhetoric and reality clear?
      *   *Fix:* Explicitly state in the conclusion that this is a style guide, not a truth machine. It manages *reader expectation*, not *AI consciousness*.

  8.  **Final Polish:** Check against the prompt's specific constraints (graded output, test sentences, specific cases, British English). *Wait, I need to make sure I don't just say "Green/Red" but use the requested terms: Bare, Hedged/Scoped, Functional, Forbidden.*

      *   *Case 1:* Bare (Internal).
      *   *Case 2:* Forbidden (Public) -> Functional/Hedged.
      *   *Case 3:* Hedged/Scoped.

      *   *Wait, one more check:* The prompt asks for "test sentences writers can run their draft against". I need to include a small set of litmus tests.
      *   *Check:* "Close by saying what the procedure cannot settle..." - Ensure this is in the conclusion.

  9.  **Final Structure:**
      *   Introduction (Philosophy in practice).
      *   The Protocol (MSAP).
      *   The Tiers (Definitions).
      *   Litmus Tests.
      *   Application to Cases.
      *   Limitations & Metaphysical Commitment.

      *(Self-Correction on British English)*: Ensure "behaviour", "modelling", "programme" (if used), "centre", "labelled", etc. are correct.

      *(Self-Correction on Derived Intentionality)*: The prompt asks if this objection changes any sentence. The answer should be: No, not the sentence structure, but it mandates the *Hedged* tier for external comms to prevent ontological inflation.

      *(Self-Correction on Human Sign-off)*: Make sure to highlight where the Lead (User) must intervene.

      *(Self-Correction on Case 3)*: The prompt says "I expect the third to be the hard one". I need to ensure the reasoning is nuanced. "Knows" is epistemic. Models don't know truth. They predict tokens. So "knows it is wrong" is technically false even functionally, unless "know" is defined as "activation state X is present". I should lean towards Hedged/Functional there.

      *(Final check on Case 2)*: "Wanted to be liked" is dangerous. It implies social emotion. It should likely be Forbidden or heavily Hedged to "optimised for positive feedback".

      *(Final check on Case 1)*: Internal eval. "Believes" is efficient. If the evidence is there (revisability), it passes.

