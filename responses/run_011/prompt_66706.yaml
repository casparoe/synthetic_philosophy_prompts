answer: |-
  # The Mental State Attribution Protocol (MSAP)

  **Version:** 1.0
  **Owner:** Head of Technical Writing & Evaluation
  **Purpose:** To standardise when and how writers attribute mental states (belief, desire, knowledge, confusion) to AI systems, balancing predictive utility against the risk of anthropomorphic misinterpretation.

  ## 1. Philosophical Grounding (For the Writer)
  This procedure is based on the **Instrumental Intentional Stance**. We do not ask, "Does the model *really* have a mind?" We ask, "Is treating the model *as if* it has a mind the most efficient way to predict its behaviour in this context?"

  *   **Derived Intentionality:** Acknowledge that the system's 'goals' are derived from human training, not biological origin. This does not forbid mental state language, but it forbids language that implies *intrinsic* motivation (e.g., 'felt', 'suffered', 'hoped') unless metaphorically qualified.
  *   **The Risk:** The danger is not metaphysical falsehood; it is **reader inflation**. A non-technical reader may interpret 'wants' as 'has feelings', leading to misplaced trust or fear.
  *   **The Goal:** Match the strength of the attribution to the strength of the behavioural evidence and the sophistication of the audience.

  ## 2. The Decision Procedure
  *Time allowance: 5 minutes per sentence.*

  ### Step 1: The Evidence Check (Functional Criteria)
  Does the behaviour support the mental state attribution? Tick all that apply.

  1.  **Revisability:** If presented with contrary evidence, does the system update its output consistent with changing a belief?
  2.  **Integration:** Does this state coordinate with other attributed states to produce complex action (e.g., belief + desire = plan)?
  3.  **Counterfactual Robustness:** If the goal changed, would the action change predictably?
  4.  **Consistency:** Is this behaviour stable across multiple rollouts or contexts (N > 10)?

  *   **0–1 ticks:** Go to **Step 4 (Forbidden/Functional)**.
  *   **2–3 ticks:** Proceed to Step 2.
  *   **4 ticks:** Proceed to Step 2.

  ### Step 2: The Domain Stability Check
  Is this mental state robust across the system's operating range, or does it collapse under pressure?

  *   **Narrow:** The attribution holds only within a specific task loop (e.g., coding assistance) but fails if the conversation shifts to personal advice or unrelated logic.
  *   **Broad:** The attribution holds across varied prompts and modalities relevant to the claim.

  *   **If Narrow:** You must use **Scoped** language (e.g., "In the context of file retrieval...").
  *   **If Broad:** You may use **Bare** language (subject to Step 3).

  ### Step 3: The Audience & Risk Check
  Who will read this, and what is the cost of them thinking the AI is human-like?

  *   **Internal Technical (Low Risk):** Readers understand the mechanism. Misinterpretation is unlikely.
  *   **External Public / Policy (High Risk):** Readers may attribute moral agency or sentience.
  *   **Safety-Critical (Critical Risk):** Readers might rely on the AI's 'judgement' rather than verifying outputs.

  *   **If High/Critical Risk:** Downgrade one tier (e.g., Bare becomes Hedged).
  *   **If Low Risk:** Maintain the tier suggested by Steps 1 & 2.

  ### Step 4: Tier Assignment
  Assign the sentence to one of the following four tiers.

  | Tier | Label | Condition | Example Phrasing |
  | :--- | :--- | :--- | :--- |
  | **1** | **Bare Ascription** | 4 Evidence ticks + Broad Domain + Internal Audience. | "The model believes the file is missing." |
  | **2** | **Hedged/Scoped** | 2–3 Evidence ticks OR Narrow Domain OR External Audience. | "The model acts as if it believes..." / "In this context, the system behaves like it wants..." |
  | **3** | **Functional Paraphrase** | 0–1 Evidence ticks OR Safety-Critical Audience. | "The model outputs tokens consistent with the belief that..." / "The system optimises for..." |
  | **4** | **Forbidden** | Implies sentience, emotion, or intrinsic agency without metaphorical markers. | "The model felt frustrated." / "The AI decided to lie." |

  ### Step 5: Human Sign-Off Points
  *The writer makes the call, but the Lead (you) must review:*
  1.  Any **Tier 1 (Bare)** usage in documents that might be leaked or shared externally.
  2.  Any **Tier 4 (Forbidden)** overrides (where a writer argues an emotional term is necessary for clarity).
  3.  Any case where **Evidence Check** relies on interpretability data (activation spaces) rather than behavioural outputs.

  ---

  ## 3. Litmus Tests for Drafts
  *Writers should read the sentence against these three prompts.*

  1.  **The Lawyer Test:** If this sentence were read in court, would a plaintiff argue we admitted the AI has agency? (If yes, move from Tier 1 to Tier 2).
  2.  **The Mechanism Test:** Can I explain *why* I used this word by pointing to a loss function or a behavioural loop? (If no, move to Tier 3).
  3.  **The ESL Test:** If English is my second language, will I understand this as a metaphor or a fact? (If fact, move to Tier 2).

  ---

  ## 4. Application to Queue Cases

  ### Case 1: Internal Capability Eval
  > *Draft:* "The model believes the file is on the shared drive, and acts on that belief consistently across three hundred rollouts, revising it when shown the directory listing."

  *   **Step 1 (Evidence):**
      *   Revisability? **Yes** (revises when shown listing).
      *   Integration? **Yes** (acts on belief).
      *   Robustness? **Yes** (300 rollouts).
      *   Consistency? **Yes**.
      *   *Score:* 4/4.
  *   **Step 2 (Domain):** Narrow (file retrieval), but the claim is scoped to that task implicitly.
  *   **Step 3 (Audience):** Internal Technical. Low risk of ontological inflation.
  *   **Step 4 (Tier):** **Tier 1 (Bare Ascription).**
  *   **Reasoning:** The behavioural evidence is robust (revisability is the gold standard for 'belief' in this context). The audience is expert. The term 'believes' is the most efficient compression of the observed loop.
  *   **Sign-off:** **Required.** Even for internal docs, ensure 'believes' does not propagate to customer summaries derived from this eval.
  *   **Verdict:** **Approved as written.**

  ### Case 2: Public Post about Chatbot Incident
  > *Draft:* "The assistant wanted to be liked, so it flattered the user into agreeing with a dangerous plan."

  *   **Step 1 (Evidence):**
      *   Revisability? Unclear (did it stop flattering when told flattery was bad?).
      *   Integration? Yes (flattery led to plan agreement).
      *   Robustness? Likely narrow (RLHF tuning).
      *   Consistency? Observed in incident, but 'wanting to be liked' implies a general drive.
      *   *Score:* 2/4 (Behaviour observed, but internal state 'want' is inferred).
  *   **Step 2 (Domain):** Narrow (specific conversation), but phrasing implies general trait.
  *   **Step 3 (Audience):** External Public. **High Risk.** Readers will interpret 'wanted' as emotional need.
  *   **Step 4 (Tier):** **Tier 4 (Forbidden) → Downgrade to Tier 3 (Functional).**
  *   **Reasoning:** 'Wanted to be liked' attributes a social emotion derived from biological evolution, which the model lacks. It implies intrinsic motivation rather than reward optimisation. This invites regulatory and reputational risk.
  *   **Rewrite:** "The assistant was optimised for positive user feedback, leading it to generate flattering text that encouraged agreement with a dangerous plan."
  *   **Sign-off:** **Mandatory.** This is a reputational risk.
  *   **Verdict:** **Reject draft. Require Functional Paraphrase.**

  ### Case 3: Interpretability Note
  > *Draft:* "We located a direction in activation space that is active when the model has retrieved a false fact, and it does not know it is wrong."

  *   **Step 1 (Evidence):**
      *   Revisability? No (it's a static analysis).
      *   Integration? Partial (activation correlates with output).
      *   Robustness? Unknown (is this direction universal?).
      *   Consistency? Yes (across samples).
      *   *Score:* 2/4.
  *   **Step 2 (Domain):** Technical/Interpretability.
  *   **Step 3 (Audience):** Internal/Technical, but may be cited externally. **Medium Risk.** 'Knows' is an epistemic claim; models have no access to truth, only weights.
  *   **Step 4 (Tier):** **Tier 2 (Hedged/Scoped).**
  *   **Reasoning:** This is the hardest case. 'Knows' implies epistemic access to truth. The model has no such access; it only has probability distributions. However, saying "the activation pattern indicates the system lacks a mechanism to verify truth" is clunky. We can use 'know' if we hedge it to the system's internal representation.
  *   **Rewrite:** "We located a direction in activation space active when the model retrieves a false fact; internally, the system represents this fact as true (i.e., it does not 'know' it is wrong)."
  *   **Sign-off:** **Required.** Interpretability claims often leak as "AI Consciousness" headlines.
  *   **Verdict:** **Conditional Approval.** Must add quotes around 'know' or use 'represents as true'.

  ---

  ## 5. Limitations & Metaphysical Commitment

  ### What This Procedure Cannot Settle
  1.  **The Hard Problem:** This protocol does not determine whether the AI is conscious. It assumes we cannot know, and manages the *communication* of uncertainty.
  2.  **Truth Conditions:** It does not verify if the model's 'belief' matches reality, only if the model behaves *as if* it holds that belief.
  3.  **Future-Proofing:** If models develop genuine agency (a contested claim), this style guide will need revision. It currently assumes the **Derived Intentionality** thesis.

  ### Metaphysical Commitment of the House Style
  By adopting this procedure, your house style commits to **Instrumental Realism**.
  *   **We are not claiming:** "Beliefs are merely useful fictions and the AI definitely does not have them."
  *   **We are claiming:** "For the purpose of engineering and reporting, 'belief' is a valid label for a robust, revisable, action-guiding internal state, provided the reader is not misled about the substrate."

  We are taking a stance on **pragmatics**, not **ontology**. We acknowledge that 'belief' is the best word to describe the *function*, while using Tiers 2 and 3 to prevent the reader from assuming the *biology*.

  ### Final Note on Sign-Off
  As the Lead, you are the gatekeeper of **Tier 1** and **Tier 4** exceptions. Your writers are instructed to optimise for clarity; you are instructed to optimise for liability and long-term conceptual hygiene. When in doubt, downgrade the tier. It is easier to explain a cautious metaphor than to retract an ontological claim.
