answer: |-
  You aren't collecting prejudices; you're intuitively applying a hybrid framework that political theorists call **The Conditional Contract**. You are oscillating between two distinct logics: *Constitutional Consent* (for functioning democracies) and *Remedial Right* (for oppressive or colonial contexts). Your discomfort comes from trying to apply one logic to cases that demand the other.

  Here is the principle that reconciles eight of your nine cases, the trade-offs it demands, and how it handles your hypotheticals.

  ### The Principle: The Conditional Contract

  **Core Idea:** Sovereignty is a contract between the center and the region. If the center upholds democratic norms, the region must use agreed-upon legal channels. If the center breaches the contract (through oppression, colonialism, or permanent blockage), the region may act unilaterally, provided it can govern effectively and isn't motivated purely by predation.

  **Clause 1: The Democratic Procedure (For Functioning Democracies)**
  In a state with robust democratic institutions and human rights protections, secession requires a negotiated process agreed upon by both parties. Unilateral breaks are illegitimate because they breach the constitutional contract.
  *   **Forced by:** **Scotland (#1)** and **Catalonia (#3)**.
  *   **Explanation:** This explains why Scotland's 2014 vote counts (London agreed) but a unilateral second vote doesn't. It also explains why Catalonia's 2017 vote was illegitimate (Madrid didn't agree, Spanish Constitution forbids it). Crucially, this clause separates the *right to secede* from *human rights*. You can rule Catalonia's vote invalid while still condemning Madrid's police brutality. One is a contract dispute; the other is a rights violation.

  **Clause 2: The Remedial/Colonial Exception (For Defective States)**
  If the parent state is oppressive, has collapsed, or holds the territory as a colony (denying full political integration), the contract is void. Legitimacy derives from *effectivity* (can they govern?) and *democratic will*, not legal permission.
  *   **Forced by:** **Kosovo (#4)**, **Somaliland (#7)**, and **Puerto Rico (#8)**.
  *   **Explanation:** This is the only way to justify Kosovo and Somaliland. Serbia was actively cleansing Kosovo; Somalia collapsed and massacred Somalilanders. The "legal keys" didn't matter because the lock was broken. For Puerto Rico, the "illegitimate arrangement" stems from its colonial status: it is subject to US law without full representation, voiding the standard democratic contract.

  **Clause 3: Integrity Constraints (No Force, No Predation)**
  Secession cannot be achieved through external military coercion, nor can its primary motive be economic predation or the preservation of injustice.
  *   **Forced by:** **Crimea (#5)** and **Rich Region/US South (#9)**.
  *   **Explanation:** This kills Crimea (foreign troops = coercion) and the US South/Rich Region (secession to preserve slavery/hoard wealth = predatory motive). A majority vote alone does not validate a claim if the *cause* violates the underlying moral basis of self-determination.

  ### Mapping Your Cases

  *   **1 (Scotland):** Fits Clause 1. Legal process respected.
  *   **2 (Quebec):** Fits Clause 1. The "Clarity Principle" applies: a constitutional change requires a clear question and a clear majority. 50.5% on a vague question doesn't trigger the exit clause.
  *   **3 (Catalonia):** Fits Clause 1. Spain is a democracy; unilateralism breaches contract. (State repression is a separate human rights violation).
  *   **4 (Kosovo):** Fits Clause 2. Remedial right due to oppression.
  *   **5 (Crimea):** Fails Clause 3. External coercion.
  *   **6 (Bougainville):** **The Friction Point.** Fits Clause 2 loosely (post-conflict), but creates tension with Clause 1 (PNG is a democracy).
  *   **7 (Somaliland):** Fits Clause 2. Remedial/Effectivity.
  *   **8 (Puerto Rico):** Fits Clause 2. Colonial exception.
  *   **9 (Rich Region):** Fails Clause 3. Predatory motive.

  ### Running the Hypotheticals

  **(a) The Blocked Region (40 years self-gov, distinct, 2/3 majority, vote refused)**
  *   **Verdict:** **Licenses Unilateralism.**
  *   **Reasoning:** Under Clause 1, a democracy must provide a channel for self-determination. If the state flatly refuses *any* vote despite a durable supermajority, it ceases to function as a democracy *vis-à-vis* that region. The contract is breached by the center. The region moves to Clause 2 (Remedial). It may declare independence if it can govern effectively.
  *   **What they do with the 2/3:** They treat it as a mandate to establish *de facto* sovereignty and seek recognition, betting that the parent state's intransigence will sway international opinion.

  **(b) The Nested District (District wants to stay inside Region leaving State)**
  *   **Verdict:** **District stays with Region.**
  *   **Reasoning:** This invokes the principle of **_Uti Possidetis_** (as you possess, so you may possess). Boundaries remain at the highest administrative level that voted to leave. Allowing districts to peel off regions creates infinite regression ("The Fractal Problem") and makes sovereignty impossible. The "Self" is the existing administrative unit, not every ethnic enclave within it.
  *   **Caveat:** If the district is geographically contiguous and can function as a separate unit, it *could* make its own claim, but it cannot automatically remain with the parent state while the region leaves.

  **(c) The Kosovo Precedent (Does it license breakaways inside defended states?)**
  *   **Verdict:** **Yes, and that is a feature, not a bug.**
  *   **Reasoning:** State integrity is conditional on just governance. If your principle validates Kosovo, you must accept that any state that turns predatory or colonial risks losing territory. This is not instability; it is an accountability mechanism. The high bar (oppression/collapse) prevents frivolous use, but the threat must be real to protect minorities.

  ### The Sacrifice

  To make this principle hold, you must resolve your ambivalence on **Case #6 (Bougainville)**.

  You wrote: *"I feel they've earned the thing by the vote alone. I also feel Port Moresby isn't obviously wrong to insist the final say is its."*

  You cannot have both.
  *   If PNG is a functioning democracy (Clause 1), it can hold the final say, but then the vote was merely consultative and Bougainville hasn't "earned" independence yet.
  *   If Bougainville has "earned" it via the vote (Clause 2/Effectivity), then PNG is acting illegitimately by stalling.

  Given your verdicts on Puerto Rico (#8) and Kosovo (#4), your intuition leans toward **Democratic Will + Effectivity**. To be consistent, you must accept that **Port Moresby is wrong.** If you hold a referendum to resolve a conflict, you are contractually bound to honor the result, even if labeled "advisory." Stalling indefinitely breaches the peace contract.

  **Verdict:** Sovereignty is a conditional contract requiring democratic process in functioning states but licensing unilateral effectivity against oppression or colonialism; it overturns **6**.
