  *(Refining the "Settled" section)*: Is the horizon a *hard* limit? Most meteorologists say there is a "barrier" around 14 days. Is it theoretically breakable with infinite compute? No, because of the non-linear nature. I should state that the "hardness" is widely accepted but technically relies on the assumption that we cannot measure initial conditions with infinite precision (which is true due to quantum limits and practical sensor limits).

