      *   Philosophical unification: Both are *externalist*. Neither looks inside. So it is one *type* of criterion (Behavioural/Operational), manifested in two *methods*. I will argue it is a single commitment to *external validation* despite the dual methodology.

      *(Refining the "What we owe" point):* This is the Levinasian angle or simply moral status. If we treat the test as a conversation, and the entity passes, do we owe it rights? The current system treats the human as a tool (labourer labelling data). A conversational test might treat the agent as a peer. Or, if the machine passes, do we owe the machine rights? The prompt asks "what we owe whatever is on the far side". Currently, we owe the human user access; we owe the machine nothing. If the criterion changes, the moral boundary shifts.

