answer: |-
  ### Part 1: The Translation Layer

  Here is the herding literature restated in distributed systems primitives.

  **The System Model**
  *   **Nodes:** Rational agents. They are not "honest" or "Byzantine" in the classic sense; they are *optimizing*. They follow the protocol correctly, but the protocol incentivizes discarding local state.
  *   **Network:** Synchronous, sequential message passing. Node $i$ broadcasts only after Node $i-1$ commits.
  *   **Message Payload:** Compressed. Nodes broadcast their *Decision* (1 bit: Accept/Reject), not their *Input Vector* (Private Signal + History). This is a bandwidth optimization that introduces information loss.
  *   **Private Signal:** Local sensor data or initial value proposal. Noisy.
  *   **Public History:** The log of previous Decisions observed from the network.

  **The Protocol (Banerjee / BHW)**
  1.  **Ingestion:** Node $i$ receives Private Signal $S_i$ and Public History $H_{i-1}$.
  2.  **Logic:** Node $i$ computes a posterior probability. If $P(Truth | H_{i-1}) > P(Truth | S_i)$, Node $i$ ignores $S_i$.
  3.  **Broadcast:** Node $i$ commits Decision $D_i$ based on the weighted majority. Crucially, $D_i$ does not encode the weight of $S_i$.
  4.  **Convergence:** Eventually, $H$ becomes so heavy that all subsequent $S_i$ are ignored. The system reaches a terminal state.

  **The Failure Modes (Cascades)**
  *   **Incorrect Convergence (Bounded Signals):** If Private Signals are bounded (e.g., confidence is capped at 90%), a sufficiently long sequence of early noise can create a Public History that outweighs any subsequent Private Signal. The cluster achieves **Consensus** (Safety: all agree) on a **Wrong Value** (External Validity: violates ground truth).
  *   **Recovery (Unbounded Signals - Smith–Sørensen):** If Private Signals are unbounded (a node can be 99.999...% sure), a single node with high enough confidence can break the cascade. The protocol guarantees **Liveness** (eventually correct decision) only if the signal space allows infinite precision.

  **The Fault Model**
  *   There are no crash faults. There are no Byzantine nodes actively lying.
  *   The "fault" is **Information Truncation**. The protocol design forces nodes to strip metadata (confidence levels) from messages to reduce payload size. The network behaves as if it is partitioned from the Truth, even though connectivity is perfect.

  ---

  ### Part 2: Residue Report

  **1. Clean Maps**
  *   **Termination vs. Quiet:** A cascade is a protocol that has *terminated* successfully from a liveness perspective (every node decides), but has entered a *quiescent state* where new input no longer changes state. In DS terms, the state machine has stopped applying transitions, not because of a deadlock, but because the transition logic evaluates to `NO_OP` for all new inputs.
  *   **Bounded vs. Unbounded Signals:** This maps cleanly to **Quantized vs. Continuous Metrics**. If your gossip protocol propagates boolean flags (bounded), you risk cascades. If it propagates floating-point log-odds or cryptographic proof-of-work difficulty (unbounded), you retain the ability to overturn prior consensus.
  *   **Sequential vs. Concurrent:** The econ literature assumes sequential turns to make the math tractable. In DS, this is a highly synchronous gossip fan-out. The results hold for concurrent systems if the *effective* visibility of commits is ordered (e.g., via a leader or total order broadcast).

  **2. Bent Fits**
  *   **"Rational" vs. "Correct":** In DS, a node is "correct" if it follows the spec. In Econ, a node is "rational" if it maximizes expected utility. In herding models, following the spec *is* the rational choice, even if it leads to system-wide error. This bends the definition of a "bug." In your world, if the cluster agrees on the wrong value, the protocol is broken. In their world, the protocol is working perfectly; the *environment* was misleading.
  *   **Safety:** You define Safety as "No two nodes decide differently." They define Safety as "Do not decide incorrectly." A cascade satisfies *your* Safety while violating *their* Safety. This is a semantic collision.

  **3. No Counterpart**
  *   **External Ground Truth:** This is the biggest missing piece. In Raft/Paxos, the value being replicated is opaque. It doesn't matter if the leader proposes `X=5` or `X=6`, as long as everyone agrees. Herding literature assumes the system is an **Oracle** trying to estimate an external variable. Distributed consensus is a **Register** trying to maintain internal consistency. You have no primitive for "The consensus value contradicts reality."
  *   **The "Silent" Fault:** In BFT, a faulty node sends conflicting messages. In a cascade, every node sends identical, consistent messages. There is no cryptographic proof that can detect this, because the signatures are valid. The fault is not in the message integrity, but in the *information entropy* of the stream.

  ---

  ### Part 3: The Verdict

  **On your hypothesis:**
  You guessed: *"A cascade is just consensus where nobody proved the agreement was correct — an undetected split-brain that every node voted for."*

  **Correction:** You are half-right, but the "split-brain" metaphor is dangerous here.
  *   **Split-Brain** implies divergence (Node A says Yes, Node B says No).
  *   **Cascade** is **Consistent Hallucination** (Node A says Yes, Node B says Yes, Reality says No).
  *   It is not split-brain. It is the opposite: it is perfect agreement on a corrupted state. It is what happens when your **Validity** property (the value proposed was actually true) is decoupled from your **Agreement** property (everyone chose the same value), and you optimize entirely for Agreement.

  **The Commitment:**
  You asked whether this is a gap in the systems vocabulary or a sign the herding people are arguing about less than it looks like.

  **Verdict: It is a gap in the systems vocabulary.**

  Here is why: The distributed systems community treats "Consensus" as the end goal. We assume that if we achieve agreement, we have solved the problem. We treat the *value* being agreed upon as an opaque blob. The herding literature proves that **Consensus is not a sufficient condition for Correctness** when nodes are optimizing for bandwidth or social proof over signal fidelity.

  The herding people are not arguing about less. They are modeling a specific failure mode of **Lossy Gossip Protocols** that systems engineers ignore because we assume "Application Logic" handles truth. But when the Application Logic *is* the consensus mechanism (e.g., sensor networks, crypto-oracles, ML federated learning), the cascade *is* the systems failure.

  We lack a primitive for **Semantic Safety**. We have words for "Did we agree?" (Consensus) and "Did the leader lie?" (Byzantine). We do not have a word for "Did we all agree on a lie because we compressed the metadata too aggressively?"

  The herding literature is essentially a rigorous analysis of **Information Loss in Replicated State Machines**. We dismiss it because we assume our signatures prove truth. They don't. They only prove origin. The cascade is the cost of trusting origin over content. That is a systems problem, not an economic one.
