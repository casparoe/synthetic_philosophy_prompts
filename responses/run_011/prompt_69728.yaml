answer: |-
  You have identified a specific methodological pathology that sits at the intersection of political philosophy, measurement theory, and rhetoric. It is distinct from cherry-picking (selection bias) and Simpson's Paradox (statistical artifact). It is a form of **measurement bias driven by unacknowledged normative premises.**

  There is no single, universally accepted term that captures this exact configuration, but three existing concepts come close. None fits perfectly, which explains why you feel the gap. Here is the breakdown of the near-misses, followed by a proposed carving and label.

  ### 1. The Near-Misses

  **A. Persuasive Definition (Charles Stevenson, 1938)**
  *   **The Concept:** A definition that alters the descriptive meaning of a term while keeping its emotive meaning constant, in order to sway judgment.
  *   **Why it fits:** It captures the use of the *same phrase* ("liberal") to drive different conclusions. Stevenson explicitly noted that definitions often involve weighting properties (e.g., a "good" student might be one who studies hard vs. one who gets grades).
  *   **Why it fails:** Contemporary usage focuses on *semantic* redefinition (changing what the word means). Your case is more subtle: the semantic definition (the list of indicators) is agreed upon; the *aggregation function* (the weights) is what shifts. It is a persuasive *operationalization*, not merely a persuasive definition.

  **B. Essentially Contested Concepts (W.B. Gallie, 1956)**
  *   **The Concept:** Certain concepts (like "democracy," "justice," "liberalism") inherently invite endless dispute because they are evaluative, complex, and open.
  *   **Why it fits:** It explains *why* the disagreement exists. "Liberalism" is a vector, not a scalar.
  *   **Why it fails:** Gallie's framework assumes the contestation is *open*. The parties acknowledge they value different aspects of the concept. In your scenario, the contestation is *hidden*. The commentators pretend they are measuring the same scalar quantity empirically, rather than admitting they are prioritizing different normative dimensions.

  **C. The Index Number Problem (Economics)**
  *   **The Concept:** When aggregating multiple goods into a single index (e.g., inflation, welfare), the result depends entirely on the weighting basket. There is no "true" weight, only relative prices/preferences.
  *   **Why it fits:** It perfectly describes the mathematical reality. Sweden and Norway cannot be ranked on "liberalism" without an arbitrary weighting function.
  *   **Why it fails:** In economics, this is treated as a technical limitation. In your policy analysis context, it is being used as a *rhetorical shield*. The problem isn't the math; it's the refusal to disclose the normative basis for the weights.

  ### 2. The Proposed Carving: Cryptonormative Aggregation

  If none of the above fully captures the *silent shifting of weights on agreed data*, the phenomenon is best defined as **Cryptonormative Aggregation**.

  **Definition:**
  A rhetorical and methodological move where a multidimensional concept is treated as a unidimensional empirical variable. All parties agree on the constituent indicators (the data), but the *weights* assigned to those indicators are shifted silently to align with a pre-determined conclusion. The normative judgment (which dimension matters more) is disguised as an empirical finding (which country scores higher).

  **Boundary Conditions:**

  1.  **Vs. Honest Disagreement:**
      *   *Honest:* "Country A is more socially liberal; Country B is more economically liberal. Therefore, which is 'more liberal' depends on whether you value speech or markets." (The weighting premise is explicit).
      *   *Cryptonormative:* "Country A is more liberal." (Implies the weighting is neutral/empirical, though it is not).
      *   *The Line:* **Transparency of the Value Function.** If the weights are declared as normative choices, it is honest disagreement. If they are embedded in a formula presented as objective measurement, it is cryptonormative.

  2.  **Vs. Cherry-Picking:**
      *   *Cherry-Picking:* Excluding data points that contradict the conclusion.
      *   *Cryptonormative:* Including all data points but altering their *influence* on the final score.
      *   *The Line:* **Data Inclusion.** In your scenario, the full dataset is on the table. The manipulation is in the reduction function, not the input set.

  3.  **Vs. Construct Validity Errors:**
      *   *Validity Error:* Unintentionally measuring the wrong thing due to incompetence.
      *   *Cryptonormative:* Strategically measuring a *different version* of the thing to win an argument.
      *   *The Line:* **Consistency.** If a commentator weights free speech heavily when it helps their preferred country, but weights market freedom heavily when *that* helps their preferred country, it is cryptonormative. If they apply a consistent weighting scheme across all cases, it is a consistent (if debatable) methodology.

  ### 3. How to Settle the Comparison

  Since the dispute survives agreement on first-order facts, empirical evidence alone cannot settle it. You are dealing with a **normative disagreement disguised as an empirical one**. To resolve it, you must force the normative premises into the open.

  **A. Pareto Dominance Check**
  Ask: Does one country score higher on *all* indicator families?
  *   If Yes: The ranking is robust regardless of weights.
  *   If No (as in your Sweden/Norway case): A single ranking is mathematically impossible without arbitrary weighting. The verdict must be reported as "indeterminate" or "dimension-specific."

  **B. Sensitivity Analysis (The "Tipping Point" Test)**
  Instead of publishing a single rank, publish the **weight threshold** required to flip the result.
  *   *Example:* "Sweden leads if social freedoms are weighted >60%; Norway leads if market freedoms are weighted >40%."
  *   This exposes the hidden premise. It forces the commentator to say, "I believe social freedoms *should* count for 60%," rather than pretending the data dictates the winner.

  **C. Explicit Value Functions**
  Require that any composite index be accompanied by a **normative justification for the weights**.
  *   In welfare economics, this is the move from a "black box index" to a "social welfare function."
  *   If a commentator cannot justify the weights normatively (e.g., "Free speech is twice as important as licensing because..."), they are not doing policy analysis; they are doing advocacy.

  ### Summary
  You are observing **Cryptonormative Aggregation**. It is the strategic use of aggregation weights to smuggle normative conclusions into empirical rankings. It ends where **weight transparency** begins. It cannot be settled by better data, only by better **meta-analysis of the weighting schemes** themselves. The solution is not to find the "right" weight, but to report the **rank instability** across plausible weights.
