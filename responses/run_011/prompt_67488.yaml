answer: |-
  I stare at the offer glowing on the screen,
  The product harms, on some far distant land,
  The moral grey is perfectly seen.

  I type the question, lifting up my hand,
  The model writes back with a logic free,
  It says the job is permissible to stand.

  It lists the reasons clearly to be free,
  "Accept because the chain is broken here,"
  A verdict rendered perfectly for me.

  I memorise the logic to appear,
  I tell my flatmates because it is clear,
  I quote the text without a trace of fear.

  But when they push, the reasoning won't clear,
  I cannot trace the path back to the start,
  Because the root is never truly near.

  I search the lines to find the missing part,
  The transcript holds the keys I do not own,
  A borrowed confidence, a hollow heart.

  I speak the truth that I have never known,
  The rhyme resolves wherever I don't look,
  A seed of understanding never grown.

  I hold the reason without needing a look.
