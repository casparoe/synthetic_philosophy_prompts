prompt: |-
  I'm the community manager for a mid-size open source project — ~400 contributors, nearly all volunteers — and every couple weeks someone asks me to change or kill an unwritten practice. So far I've anwered by gut and gotten it wrong at least once (a maintainer forked over it). I'd rather use something like Lewis's account of convention: a regularity people keep to because they expect everyone else to keep to it, where some other regularity would have served just as well. Turn that into a procedure my three moderators (none of us have any philosophy background) could run in about half an hour on a disputed practice, with the output being: is this a convention in that sense or a different kind of norm, would a plain announcement from the maintainers actually shift it, and if not, what would. Build in the theory-breakers on purpose — practices everyone privately resents but keeps doing because they figure the rest still endorse them, and practices where the alternative isn't arbitrary at all because one option dumps the work on a particular group. Then run it on three of ours: design discussion has to happen in a public issue before anyone opens a PR; commit messages follow a prefix scheme nobody ever wrote down; and whoever originally wrote a file gets to approve changes to it. Tell me where the procedure is really just my judgment wearing a philosophical costume, how confident you are in each of the three classifications, and which one you're least sure about.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User Role:** Community Manager for a mid-size open source project (~400 volunteer contributors).
      *   **Problem:** Ad-hoc decisions on unwritten practices lead to errors (e.g., maintainer fork). Needs a structured decision procedure.
      *   **Theoretical Basis:** David Lewis's account of convention (regularity, mutual expectation, arbitrary alternative).
      *   **Task 1:** Create a 30-minute procedure for 3 moderators (no philosophy background) to evaluate disputed practices.
      *   **Task 2:** The procedure must output: Is it a Lewisian convention? Will an announcement shift it? If not, what will?
      *   **Task 3:** Build in "theory-breakers" (resentful compliance, non-arbitrary alternatives/work distribution).
      *   **Task 4:** Apply the procedure to three specific cases:
          1.  Design discussion in public issue before PR.
          2.  Unwritten commit message prefix scheme.
          3.  Original author approval for file changes.
      *   **Task 5:** Self-critique: Where is this just the user's judgment in disguise? Confidence levels for each classification. Which is least sure?

  2.  **Deconstruct Lewis's Convention:**
      *   *Regularity:* People do $X$ in situation $S$.
      *   *Expectation:* People expect others to do $X$ in $S$.
      *   *Preference:* People prefer to do $X$ if others do $X$ (coordination problem).
      *   *Arbitrariness:* There is an alternative $Y$ that could have worked just as well (this is the crucial differentiator from moral norms or technical constraints).

  3.  **Drafting the Procedure (The "Convention Audit"):**
      *   *Goal:* Simple, actionable, 30 minutes.
      *   *Steps:*
          1.  Define the Practice (What/When).
          2.  Check Regularity & Expectation (Do people do it? Do they expect others to?).
          3.  Check Arbitrariness (The Lewis Test: Could we do the opposite without loss?).
          4.  Check Compliance Motivation (Why do they do it? Fear? Efficiency? Habit?).
          5.  Determine Intervention (Announcement vs. Migration vs. Hard Rule).
      *   *Theory-Breakers:* Explicitly ask about "Resentful Compliance" (pluralistic ignorance) and "Work Distribution" (non-arbitrary burden).

  4.  **Applying the Procedure to the Three Cases:**

      *   *Case 1: Design discussion in public issue before PR.*
          *   *Regularity:* High.
          *   *Expectation:* High.
          *   *Arbitrariness:* Low/Medium. Discussing *somewhere* is needed, but *public issue* specifically? Maybe arbitrary. But often tied to transparency.
          *   *Motivation:* Coordination, avoiding wasted work.
          *   *Verdict:* Strong Convention, but borders on Process Norm. Announcement works.

      *   *Case 2: Unwritten commit message prefix scheme.*
          *   *Regularity:* High (among veterans), Low (among newbies).
          *   *Expectation:* High among maintainers.
          *   *Arbitrariness:* High. `feat:` vs `feature:` vs `[NEW]`. It's purely syntactic.
          *   *Motivation:* Automation, history reading.
          *   *Verdict:* Pure Lewis Convention. Announcement + Tooling works.

      *   *Case 3: Original author approval for file changes.*
          *   *Regularity:* Medium/High.
          *   *Expectation:* Medium.
          *   *Arbitrariness:* Low. This creates a bottleneck/ownership model. Alternative (any maintainer approves) changes power dynamics and bus factor.
          *   *Motivation:* Quality control, ego, protection.
          *   *Verdict:* Not a Lewis Convention. It's a Power/Trust Norm. Announcement won't work; needs policy change + cultural shift.

  5.  **Addressing the "Judgment in Disguise" & Confidence:**
      *   *Critique:* The "Arbitrariness" test is subjective. Who decides if an alternative works "just as well"? That's where the moderator's bias enters.
      *   *Confidence:*
          *   Commit Messages: High (Clear syntax, high arbitrariness).
          *   Design Issues: Medium-High (Clear coordination benefit).
          *   File Ownership: Low (Complex social dynamics, hard to distinguish convention from power structure).

  6.  **Refining the Output:**
      *   *Tone:* Professional, pragmatic, slightly academic but accessible (matching the user's sophistication).
      *   *Structure:*
          1.  Introduction (Acknowledging the Lewis framework).
          2.  The Procedure (The "30-Minute Convention Audit").
          3.  The Application (Running the three cases).
          4.  The Meta-Analysis (Critique of the procedure itself).
      *   *Constraint Check:* Did I include the theory-breakers? Yes (Resentful Compliance, Work Distribution). Did I answer the specific questions about judgment and confidence? Yes.

  7.  **Self-Correction/Polishing during drafting:**
      *   *Initial thought:* Maybe make the procedure a flowchart. *Correction:* Text-based checklist is easier to copy/paste into a doc for moderators.
      *   *Initial thought:* Classify File Ownership as a convention. *Correction:* Lewis emphasizes *arbitrariness*. File ownership usually stems from trust/expertise, making the alternative (random approval) *not* equivalent. I need to highlight this distinction.
      *   *Refining the "Judgment" critique:* Be honest. The procedure doesn't remove bias; it surfaces it. The "Arbitrariness" question is where the philosophy costume fits tightest.

  8.  **Final Review against User Prompt:**
      *   30 mins? Yes, 5 steps.
      *   3 moderators? Yes, designed for discussion.
      *   Output requirements met? Yes (Convention type, Announcement efficacy, Alternative action).
      *   Theory breakers included? Yes (Step 4).
      *   Three cases run? Yes.
      *   Meta-critique included? Yes.

  9.  (Final Polish of the text to ensure clarity and tone.) *Make sure to explicitly mention Lewis's criteria in the procedure steps so the moderators know *why* they are asking.*

  10. *Wait, one nuance:* The user asked "Turn that into a procedure... Tell me where the procedure is really just my judgment wearing a philosophical costume." I need to make sure the critique is sharp. The "Arbitrariness" test is the weak point. Also, the definition of "Expectation" can be subjective.

  11. *Confidence Levels:*
      *   Commit Messages: 90% (Very syntactic).
