answer: |-
  Here is a 30-minute decision procedure based on David Lewis's *Convention: A Philosophical Study*, tailored for your moderation team, followed by the application to your three cases and a meta-analysis of the tool itself.

  ### Part 1: The 30-Minute Convention Audit

  **Goal:** Determine if a practice is a Lewisian Convention, a Structural Norm, or a Pluralistic Ignorance trap, and decide on an intervention.
  **Participants:** 3 Moderators.
  **Time:** 30 Minutes (Strict timer).
  **Prep:** One moderator acts as Scribe; one as Timekeeper.

  #### Step 1: Define the Regularity (5 mins)
  Write down the practice in one sentence.
  *   *Format:* "In situation [S], contributors regularly do [X]."
  *   *Check:* Is this actually regular? If fewer than 50% of contributors do this, stop. It's not a norm yet; it's a suggestion.

  #### Step 2: The Expectation Test (5 mins)
  Discuss: Do contributors do [X] because they *expect* others to do [X]?
  *   *Evidence:* Look for comments like "This is how we do it here," or PR pushback when [X] isn't done.
  *   *Lewis Criterion:* If I stopped doing [X], would I expect others to be confused or annoyed?
  *   *Output:* **High Expectation** vs. **Low Expectation**.

  #### Step 3: The Arbitrariness Test (The Lewis Core) (10 mins)
  This is the most critical step. Ask: **Could we do [Y] instead of [X] with roughly the same result?**
  *   *Scenario:* If we flipped the rule tomorrow, would the project collapse or just look different?
  *   *Theory-Breaker A (Work Distribution):* Does [X] dump work on a specific group (e.g., newbies, maintainers) that [Y] would not? If yes, it is **not arbitrary**. It is a power/labor norm.
  *   *Theory-Breaker B (Resentful Compliance):* Do we suspect people hate [X] but do it because they think *we* love it? (Pluralistic Ignorance). If yes, it is a **False Convention**.
  *   *Output:* **Arbitrary** (True Convention) vs. **Non-Arbitrary** (Structural/Moral Norm) vs. **Resentful** (False Convention).

  #### Step 4: Intervention Decision (5 mins)
  Based on Step 3, choose the path:
  *   **If Arbitrary + High Expectation:** It is a **Lewis Convention**. A plain announcement + documentation update is sufficient. Coordination is the only barrier.
  *   **If Non-Arbitrary:** It is a **Structural Norm**. An announcement will fail. You need to change the incentives or tooling (e.g., CI checks, permission structures).
  *   **If Resentful:** It is a **Coordination Failure**. An announcement will backfire. You need a "safe exit" signal (e.g., "Maintainers explicitly do not require this anymore").

  #### Step 5: Risk Assessment (5 mins)
  *   Who loses status or power if this changes?
  *   Is there a "fork risk" (maintainers leaving)?
  *   *Final Go/No-Go:* Do we proceed with the intervention from Step 4?

  ***

  ### Part 2: Running the Audit on Your Cases

  Here is how the procedure classifies your three disputed practices.

  #### Case 1: Design discussion in a public issue before PR
  *   **Regularity:** High. Almost all significant changes follow this.
  *   **Expectation:** High. PRs without issues are routinely closed or questioned.
  *   **Arbitrariness:** **Low/Mixed.** Discussing *somewhere* is necessary (non-arbitrary), but requiring a *public issue* specifically is partly arbitrary. However, the alternative (private chat/DM) creates information silos.
  *   **Theory-Breaker Check:**
      *   *Work Distribution:* Shifts burden to the proposer (non-arbitrary).
      *   *Resentment:* Low. Most agree it saves time.
  *   **Classification:** **Process Norm (bordering on Convention).** It solves a coordination problem, but the "public" aspect is tied to transparency values, not just arbitrary coordination.
  *   **Intervention:** **Announcement + Documentation.** Because the expectation is high, writing it down validates existing behavior rather than changing it. Low risk.
  *   **Confidence:** **85%**.

  #### Case 2: Commit messages follow an unwritten prefix scheme
  *   **Regularity:** High among veterans, Low among newbies.
  *   **Expectation:** High among maintainers (they expect to read history a certain way).
  *   **Arbitrariness:** **High.** `feat:` vs `feature:` vs `[NEW]` makes no technical difference to the code. It is purely syntactic coordination.
  *   **Theory-Breaker Check:**
      *   *Work Distribution:* Minimal. Typing 5 extra chars is negligible.
      *   *Resentment:* Moderate. Newbies find it annoying, but don't resent it enough to quit.
  *   **Classification:** **Pure Lewis Convention.** It exists solely because everyone expects everyone else to do it.
  *   **Intervention:** **Announcement + Automation.** Write it down. Add a linting bot to enforce it. Because it is arbitrary, automation is accepted as a "referee" for the convention.
  *   **Confidence:** **95%**.

  #### Case 3: Whoever originally wrote a file gets to approve changes to it
  *   **Regularity:** Medium. Happens often, but exceptions exist.
  *   **Expectation:** Medium. Some assume it's required; others assume any maintainer can approve.
  *   **Arbitrariness:** **Very Low.** This is not arbitrary; it is a specific governance model (Owner-based vs. Meritocratic). The alternative (any maintainer approves) fundamentally changes the power dynamic and the "bus factor."
  *   **Theory-Breaker Check:**
      *   *Work Distribution:* **High.** This creates a bottleneck on the original author. It distributes power unevenly.
      *   *Resentment:* **High.** Contributors waiting on one busy person resent this. The original author may resent the responsibility.
  *   **Classification:** **Power/Trust Norm (Not a Convention).** This is not a coordination equilibrium; it is a hierarchy. Lewis's theory fails here because the alternative is *not* equally good for all parties (original authors lose status; contributors lose speed).
  *   **Intervention:** **Policy Change + Cultural Shift.** An announcement is not enough. You must explicitly change the `CONTRIBUTING.md` to say "Any maintainer may approve" and actively model this behavior. Expect pushback from original authors.
  *   **Confidence:** **60%**.

  ***

  ### Part 3: Meta-Analysis & Critique

  #### Where is this just your judgment in a philosophical costume?
  The procedure creates an illusion of objectivity, but **Step 3 (The Arbitrariness Test)** is where your bias enters.
  *   **The "Equally Well" Trap:** Lewis defines convention by the existence of an alternative that works *just as well*. Who decides what "just as well" means?
      *   In *Case 3 (File Ownership)*, I classified it as "Non-Arbitrary" because it affects power dynamics. But a strict libertarian might argue "Any approval system works just as well for code quality." If your moderators value hierarchy, they will mark it as "Non-Arbitrary." If they value speed, they might mark it as "Arbitrary."
      *   The procedure forces you to define "success." If success = "Code Quality," ownership might seem arbitrary. If success = "Contributor Retention," ownership is non-arbitrary (it hurts retention).
  *   **The Expectation Blindspot:** Step 2 relies on "evidence." In volunteer projects, silence is often misread as consent. You might score "Expectation" as High because no one complains, when in reality, everyone is quietly resentful (Theory-Breaker B). The procedure relies on moderators *knowing* the community mood, which is exactly the data you might be missing.

  #### Confidence Levels
  1.  **Commit Messages (95%):** This is the cleanest fit for Lewis. It is syntactic, low-stakes, and purely coordinative. The alternative is genuinely arbitrary.
  2.  **Design Issues (85%):** Strong coordination logic, but bleeds into project values (transparency). Safe to treat as a convention, but with caveats.
  3.  **File Ownership (60%):** **This is the one I am least sure about.**
      *   *Why:* It sits on the boundary between a convention (we coordinate on who reviews to avoid double work) and a structural norm (ownership implies authority).
      *   *Risk:* If you treat this as a Lewis Convention and just "announce" a change to "anyone can approve," you may trigger the fork risk you mentioned earlier. Original authors may feel their stewardship is being devalued. This requires political capital, not just philosophical classification.

  #### Recommendation
  Use the procedure for **Case 1 and 2** immediately. They are low-risk and high-clarity.
  For **Case 3**, do not use the procedure to *decide*; use it to *frame the conversation*. Show the maintainers the "Work Distribution" and "Resentment" outputs from Step 3. Use the audit to prove that this *isn't* a harmless convention, but a structural bottleneck that requires a negotiated policy change, not a simple announcement.
