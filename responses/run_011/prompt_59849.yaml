answer: |-
  "You haven't even opened it," Leo said, tapping the cover of *The Echo Room*. "So why are you telling me it's a masterpiece?"

  "Because Eleanor Vance says so," Maya replied, stirring her coffee. "I've tracked her reviews for a decade. When she says a book achieves structural harmony, it does. I'm saving myself forty hours of reading to know the verdict."

  "That's not knowing the verdict. That's knowing *her* verdict," Leo said. "You can assert 'Vance thinks it's great.' You can even assert 'It's probably good.' But saying 'It *is* great' in your own voice? That's borrowed performance. You're going through the motions of a judgment you haven't made."

  "Is it? If my doctor tells me I have a strep throat, I say 'I have strep throat.' I don't say 'The doctor thinks I have strep throat.' I trust expertise. Why is aesthetic trust different from medical trust?"

  "Because strep throat is independent of your experience of it," Leo said. "The bacteria exist whether you feel sick or not. Aesthetic value isn't like that. It's not a property sitting in the ink like bacteria in the throat. It's a relation between the object and a subject's experience. Testimony gives you the conclusion without the premises. You're asserting 'It is good' without having the experiential ground that makes 'good' mean anything."

  "But I have grounds," Maya countered. "My ground is Vance's reliability. And don't give me the bootstrapping objection. You're going to say I can't know she's reliable without judging art myself first."

  "Exactly. To vet a critic, you need first-hand judgment. So you can't outsource the capacity entirely."

  "I don't outsource the capacity; I outsource the labor," Maya said. "I didn't validate Vance on one book. I validated her over ten years against my own past experiences. I read what she praised then, saw if I agreed, and established a correlation. Now I trust the correlation. It's inductive. I'm not blind; I'm just efficient."

  "Efficient at gathering facts, not values," Leo insisted. "Let's test this. Imagine a man deaf from birth. He's a musicologist. He's read every score, every analysis, every review of Beethoven's Ninth. He knows the structure, the history, the consensus that it's sublime. Does he know the symphony is beautiful?"

  "He knows it's valuable," Maya said. "He knows it commands reverence. He knows it achieves what symphonies aim to do."

  "But does he know the beauty?" Leo pressed. "If beauty is tied to the experience of sound, he's missing the only thing that makes the judgment true. He has the testimony without the sensation. If you agree he's missing something, then you admit testimony doesn't convey the aesthetic fact."

  "He's missing the *qualia*," Maya conceded. "The sound itself. But he doesn't miss the *value*. If value is just the sound, then a recording is valuable even if no one hears it. But value is about worth. He knows the worth because he knows what the sound *does* to hearers, based on reliable testimony. Just like I know this book is worth reading because Vance says it moves her."

  "No," Leo said. "You're conflating 'worth' with 'impact.' If he knows it moves people, he knows a sociological fact. He doesn't know the beauty. And you don't know the book's greatness. You know Vance's reaction. When you say 'It's great,' you're claiming a connection to the object you don't have. It's like saying 'I'm full' because you watched someone else eat."

  "That's absurd," Maya snapped. "I'm claiming the book possesses qualities that warrant admiration. Vance identified them. I trust her identification. Why is my trust epistemically weaker than yours? You read it, you get impressed, you say 'It's great.' I check the track record, I get impressed by the consistency, I say 'It's great.' We both rely on someone's reaction to justify the claim."

  "Because my reaction is *mine*," Leo said. "Aesthetic judgment requires autonomy. If you defer, you surrender the very agency that makes the judgment aesthetic. You're treating art like a math problem where the answer is fixed. It's not. The 'answer' is the experience."

  "So the deaf man is incapable of judging music?" Maya asked. "Even if he understands the theory better than anyone?"

  "He can judge the structure. He can't judge the beauty," Leo said. "Because beauty isn't in the score. It's in the hearing. Testimony tells you *that* it is heard as beautiful. It doesn't let you hear it. You're asserting a relation you aren't part of."

  "I'm part of the community of hearers," Maya said. "I rely on their ears. Just like I rely on the deaf man's theory. You're fetishizing first-hand experience as the only valid currency. But we live in a world of cognitive division of labor. If I can't trust Vance, I can't trust anyone about anything I haven't personally verified."

  "Verify what?" Leo asked. "Health? History? Those are facts. Taste is a capacity. You can't borrow a capacity."

  "I'm not borrowing the capacity. I'm using my capacity to judge critics to save time on judging books."

  "Then admit you're judging the critic, not the book."

  "I'm judging the book *through* the critic," Maya said. "Just like you judge the book through your eyes. My eyes are fallible. Vance's are trained."

  "Your eyes are yours," Leo said. "That's the point. The deaf man knows everything about the Ninth except the thing that matters. You know everything about this novel except the thing that matters. You know it's admired. You don't know it's great."

  "And you think saying 'It's probably great' saves you?" Maya asked. "That's just cowardly hedging. If the evidence supports the claim, make the claim."

  "The evidence supports the claim *for you* only if you experience it," Leo said. "Otherwise, you're just repeating a rumor with confidence."

  "It's not a rumor. It's a verified track record."

  "It's verified data about Vance, not the book."

  They sat in silence for a moment, the book between them.

  "So," Maya said. "You read it. You tell me if it's great. I'll trust you."

  Leo smiled, shaking his head. "No. You read it. You tell me if it's great. I'll trust you."

  "Fine," Maya said. "But I still think Vance is right."

  "And I still think you haven't said anything yet," Leo replied.
