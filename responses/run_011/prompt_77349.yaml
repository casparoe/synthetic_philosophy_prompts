answer: |-
  Good evening. Welcome to the Marrow Bend Historical Society annual meeting. We are ninety people in a room that holds history whether we speak it or not. I see descendants of the families on the memorial wall in the vestibule. I see two high school classes who will inherit this town whether they study it or not. I see engineers from the state who manage the water, and I see neighbors who still remember the smell of the mud. I know some of you are tired. I know some of you wish we could just put up the signs and go home. But this room is full because the question matters.

  We are here to unveil the exhibit on the flood of November 1961. For two years, we have struggled with the middle panel. The title is simple: *Why It Happened*. The work behind it is not. We have argued over what belongs on a wall when the water is still wet in memory.

  Behind me, on the flatbed, rests the kitchen doorframe from the Rausch house. Before the water took the house, a man marked the wall with a grease pencil. He waded to the church, but he left the mark. That mark sits at thirty-one feet four inches above the datum. The gauge at Route 9 stopped at thirty-one feet four inches at 4:50 that morning. This number is not merely a coincidence of measurement. It is the precise point where the public river became a private wound, where the hydrology ended and the living began. It is where the data touched the doorframe.

  We must choose words to stand beside this wood. Words are tools, and like any tool, they cut some things clearly and leave others in shadow. We have heard strong arguments about what this panel must do. Some argue we must describe the forces that moved the water. Others argue we must describe the choices that moved the people. Neither side has lacked for truth.

  Consider what might be carved here.
  "A discharge of this magnitude corresponds to a recurrence interval of two hundred years."
  "On the night of the eleventh, the volunteer fire department knew the water was rising while the west end did not."
  Both sentences are true. Both sentences leave something out. One tells you about the water's behavior across centuries. The other tells you about the town's knowledge across hours. One speaks to the river's nature. The other speaks to the town's night.

  Tonight, you vote on the wording. I will not tell you how to cast that ballot. This society belongs to all of you. The engineers here know the cost of misreading the river. The families here know the cost of misreading the night. The students here need to know what truth looks like when it is hard to hold. If we choose the first, we teach physics. If we choose the second, we teach responsibility. There is risk in both choices. There is risk in silence, too.

  We are not here to end the argument. We are here to record it. The panel will stand. The doorframe will stand. The water will rise again, someday. When it does, I hope this room remembers that we argued carefully about what matters. We are not deciding what happened. We are deciding what we owe the future when we speak about the past.

  Thank you. Let us unveil the exhibit.

  ***

  **Note to the President**

  The disagreement between Ray and Verna is fundamentally about the nature of historical causality. Ray argues from a nomothetic position, seeking general laws and physical mechanisms that determine outcomes regardless of human presence. Verna argues from an idiographic position, insisting that specific human actions, contingencies, and local knowledge gaps constitute the only meaningful account of the event.

  This speech declines to bet on either position explicitly. Instead, it bets on the material object—the doorframe—as the synthesis. By anchoring the abstract debate to the physical mark where the river met the home, the speech suggests that the truth resides in the contact point between the general force and the specific life.

  The hardest condition to satisfy was placing the two acceptable sentences adjacent to one another without commentary. Doing so risks making the speech sound schizophrenic or contrived. I had to ensure the transition into and out of those lines was smooth enough that the audience hears them as examples of valid truth-claims rather than as a forced compromise, maintaining the neutrality required for the vote.
