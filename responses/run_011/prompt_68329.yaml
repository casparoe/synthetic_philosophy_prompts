answer: |-
  ### Desiderata for a Theory of Precedent Autonomy

  To rule on this directive, your committee needs a framework that handles the following cases and distinctions without contradiction.

  **1. The Case Coverage (The "Must-Haves")**
  *   **The Mast-and-Sirens (Temporary Incapacity):** A competent person binds themselves to prevent a temporary lapse (e.g., a sailor tied to the mast to resist sirens). *Requirement:* The theory must allow the earlier self to bind the later self when competence is expected to return and values remain stable.
  *   **The Cyclic Self (Bipolar/Mania):** A person refuses medication during stability, knowing mania will make them demand it. *Requirement:* The theory must distinguish between *symptomatic preference shifts* (mania) and *authentic value drift*. It cannot treat all changes of mind as equal.
  *   **The Competent Revocation:** A person writes a directive, then later (while still competent) says "I change my mind," then develops dementia. *Requirement:* The most recent competent expression must always trump the past. A directive is not a one-way ratchet.
  *   **The Factual Error (Wrong Prognosis):** A person writes "If I am in perpetual pain, stop feeding." They develop dementia, feel no pain, and enjoy food. *Requirement:* The theory must account for the gap between *anticipated experience* and *actual experience*. If the factual premise of the directive is false, does the command stand?

  **2. The Conceptual Distinctions (No Papering Over)**
  *   **Identity vs. Authority:** The theory cannot conflate "Is the demented woman the same person?" with "Did the earlier person have authority over this body?" You can grant authority without asserting strict numerical identity.
  *   **Refusing vs. Requesting:** There is a moral and legal asymmetry between *refusing* intervention (letting nature take its course) and *requesting* intervention (active euthanasia). The theory must explain why the earlier self might have the right to one but not the other.
  *   **Competence Asymmetry:** The competence required to *write* a directive (understanding long-term consequences of death) is higher than the competence to *eat a meal*. However, the competence required to *revoke* a directive should ideally match the competence to write it. The theory cannot claim it is easy to bind but impossible to unbind.

  **3. The Psychological Facts (No Wishing Away)**
  *   **Hedonic Adaptation:** Humans are notoriously bad at predicting their future happiness. We adapt to disability and dementia. A theory cannot assume the earlier self's prediction of misery is accurate.
  *   **Gradual Value Erosion:** Dementia is not a light switch. Values do not vanish instantly; they erode. The theory must handle the "gray zone" where the patient is neither fully competent nor fully incapacitated.

  ***

  ### Policy Triage: Non-Negotiables vs. Pet Principles

  **Non-Negotiable for Policy (The Floor)**
  *   **Competent Revocation:** If there is evidence she changed her mind *while still competent*, the directive is void. This is legal and ethical bedrock.
  *   **Factual Premise Failure:** If the directive was predicated on a specific medical state (e.g., "vegetative," "in pain") and the patient is clearly not in that state (e.g., "socially engaged," "enjoying food"), the directive loses binding force. Autonomy is not a suicide pact based on false data.
  *   **Negative vs. Positive Rights:** You can honor a refusal of antibiotics (negative right). You cannot honor a request to actively poison her (positive right). This limits the scope of the directive regardless of autonomy.

  **Pet Principles (The Ceiling)**
  *   **"The Earlier Self is the Real Self":** This is the *Precedent Autonomy* camp's metaphysical claim. It is not non-negotiable; it is a philosophical stance.
  *   **"Current Contentment Trumps All":** This is the *Best Interests* camp's claim. It is not non-negotiable; it risks paternalism in the Mast-and-Sirens case.
  *   **"Absolute Sovereignty":** The idea that a competent adult can dictate *any* future condition, regardless of how much they change. This fails the Factual Error test.

  ***

  ### The Critical Filters

  **The Single Criterion Doing the Most Work**
  **The Factual Premise Failure.**
  This rules out the most extreme versions of both camps. It stops the "Absolute Sovereignty" camp from enforcing a will based on false predictions of suffering. It stops the "Current Contentment" camp from ignoring the directive if the patient *is* actually in the state the directive described (e.g., if she *were* in pain and begging for death). It forces you to look at the *intent* of the directive, not just the text.

  **The Incompatible Pair**
  Your suspicion is correct. **"Precedent Autonomy" (It's her life so it's her call)** and **"Current Well-Being" (What matters is how it goes for her now)** are on a collision course.
  *   If you prioritize Precedent Autonomy, you must starve a content patient because her past self said so.
  *   If you prioritize Current Well-Being, you must treat a manic depressive who violently refuses meds because her current self is "happy."
  *   You cannot maximize both. You must decide which interest is *defeasible*. In dementia cases, Current Well-Being usually defeats Precedent Autonomy when the two diverge sharply (the "Happy Demented Patient" paradox), whereas in temporary incapacity (Mast-and-Sirens), Precedent Autonomy defeats Current Well-Being.

  ***

  ### How the Accounts Stack Up

  **1. Identity-Based Accounts**
  *   *Performance:* Poor.
  *   *Why:* If you argue the demented woman is a "different person," you struggle to explain why the past person has authority over the new person's body. If you argue she is the "same person," you struggle to explain why her current interests don't matter. It creates a metaphysical deadlock that doesn't help clinical decision-making.

  **2. Precedent-Autonomy Accounts (Dworkin-style)**
  *   *Performance:* Strong on Ulysses/Mast cases; Weak on Dementia.
  *   *Why:* It respects the "critical interests" of the life narrative. However, it fails the **Factual Premise** test. If the past self's judgment was based on a fear of indignity that the current self does not experience, enforcing the directive violates the autonomy it claims to protect (because the autonomy was misinformed).

  **3. Best-Interests Accounts (Dresser-style)**
  *   *Performance:* Strong on Dementia; Weak on Ulysses/Mast cases.
  *   *Why:* It protects the "experiential interests" of the currently existing being. However, it fails the **Cyclic Self** test. It would force medication on the manic patient who is currently "happy," violating the stable self's right to protect their future. It collapses into paternalism when the patient is competent but mistaken.

  **Recommendation for the Vote:**
  Do not vote on "Autonomy vs. Well-Being." Vote on **Intent vs. Reality.** Does the current reality (contentment, willingness to eat) so fundamentally contradict the factual premises of the directive (fear of indignity, refusal of sustenance) that honoring it would violate the *purpose* of the autonomy? If yes, the directive is voided by changed circumstances, not by paternalism.
