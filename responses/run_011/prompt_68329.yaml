          8.  Evaluate Identity, Precedent-Autonomy, and Best-Interests accounts against the list.
      *   **Constraints:** No sources, suitable for a 30-minute discussion (concise, punchy, practical).

  2.  **Deconstruct the Desiderata (The "Must-Haves"):**
      *   *Case Coverage:*
          *   Ulysses/Sirens (Temporary incompetence, returns to competence): Must honor.
          *   Bipolar/Manic (Cyclic incompetence, values shift): Tricky, usually honor if stable during competence.
          *   Competent Revocation then Dementia (The "Oscar" case): If she changed her mind *while competent*, the old directive is void. If she changed her mind *after* incompetence, does the old one stand?
          *   Wrong Prognosis (Factual error): If the condition triggering the directive isn't what she thought (e.g., she thought she'd be in pain, but she's happy), does it hold?
      *   *Conceptual Distinctions:*
          *   Identity vs. Authority: Is the demented woman the *same person*? Even if not, did the old person have *authority* over the body?
          *   Refusing vs. Requesting: Negative rights (stop treatment) are stronger than positive rights (give me euthanasia).
          *   Competence Asymmetry: It's easier to lose competence than to regain it. Is it easier to make a directive than to revoke one?
      *   *Psychological Facts:*
          *   Adaptation (Hedonic treadmill): People adapt to disability.
          *   Value Drift: Values change gradually, not just at the point of incompetence.
          *   Affective Forecasting Errors: We are bad at predicting how we'll feel in future states.

  3.  **Drafting the Desiderata Section:**
      *   Need to list these clearly.
      *   *Case 1: The Mast-and-Sirens.* (Temporary incapacity). Theory must allow binding here.
      *   *Case 2: The Cyclic Self (Bipolar).* Theory must distinguish between stable values and symptomatic distortion.
      *   *Case 3: The Competent Revocation.* If she cancels it while sane, it's dead. If she cancels it while demented, does the old one revive?
      *   *Case 4: The Factual Mistake.* If the premise (suffering) is false, does the conclusion (stop feeding) hold?
      *   *Distinction 1: Identity vs. Authority.* Don't conflate "is she the same person" with "does the old person own the body."
      *   *Distinction 2: Negative vs. Positive.* Refusing food is different than demanding poison.
      *   *Distinction 3: Competence Thresholds.* Making a directive requires understanding consequences. Revoking might require less? Or more?
      *   *Fact 1: Adaptation.* People are happier than they predict.
      *   *Fact 2: Gradual Drift.* Dementia isn't a light switch; values erode slowly.

  4.  **Categorizing (Non-negotiable vs. Pet Principles):**
      *   *Non-negotiable:* Competent Revocation (if she changed her mind while sane, the old directive is void). Factual Mistake (if the medical situation is fundamentally different than envisioned, the directive loses force). Negative vs. Positive (law/ethics distinguishes letting die vs. killing).
      *   *Pet Principles:* "The earlier self is the *real* self" (Identity camp). "Current contentment trumps all" (Best Interests camp). "Absolute sovereignty of the past" (Autonomy camp).

  5.  **Identifying the "Most Work" Criterion:**
