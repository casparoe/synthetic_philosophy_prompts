answer: |-
  ### Desiderata for a Theory of Defeat Mythology

  **1. The Selectivity Constraint**
  *   **Requirement:** The theory must explain why specific defeats become sacred while functionally identical ones are forgotten.
  *   **Justification:** History is a graveyard of lost causes; only a few become religions. A theory that predicts all defeats generate myths is falsified by the silence surrounding most civil wars.
  *   **Status:** **Non-negotiable.** Empirical baseline.

  **2. The Displacement Principle**
  *   **Requirement:** The theory must account for the shift of focus from the actual decisive disaster to an ambiguous or near-victory event.
  *   **Justification:** Myths rarely center on the moment of surrender; they center on the moment hope was plausible (e.g., the charge, not the capitulation). A theory focusing on the defeat itself misses the psychological mechanism of hope preservation.
  *   **Status:** **Non-negotiable.** Empirical baseline.

  **3. The Structural Traitor**
  *   **Requirement:** The theory must explain the necessity of an internal betrayer figure, not as an accident but as a structural component.
  *   **Justification:** External enemies validate the fight; internal traitors validate the loss without invalidating the cause. Without this figure, the defeat implies ideological failure rather than mechanical failure.
  *   **Status:** **Non-negotiable.** Logical necessity for cause-preservation.

  **4. The Abstraction Mechanism**
  *   **Requirement:** The theory must explain how concrete political goals are sanded down into aesthetics, manners, or "ways of life."
  *   **Justification:** Specific policies date and alienate; landscapes and manners universalize. A theory that retains specific political programs fails to explain the myth's longevity across changing economic conditions.
  *   **Status:** **Non-negotiable.** Empirical baseline.

  **5. The Diaspora Differential**
  *   **Requirement:** The theory must explain why the myth persists hotter and longer outside the homeland than within it.
  *   **Justification:** Homeland populations must reconcile with the victor to survive; diaspora populations do not. A theory that treats the nation as a monolithic unit cannot account for this geographic divergence in belief intensity.
  *   **Status:** **Non-negotiable.** Empirical baseline.

  **6. The Agency Distribution Problem**
  *   **Requirement:** The theory must account for the divergence between the narrative elites/veterans intended and the narrative that survives.
  *   **Justification:** Leaders often want reconciliation or accuracy; veterans want truth; the myth provides neither. A theory that assumes top-down control is falsified by the loss of control.
  *   **Status:** **Non-negotiable.** Empirical baseline.

  **7. The Functional Utility Claim**
  *   **Requirement:** The theory must identify what social work the myth performs (e.g., cohesion, legitimacy, grief processing).
  *   **Justification:** Myths are costly to maintain; if they did nothing, they would be discarded.
  *   **Status:** **Hobby-horse (Functionalists).** Assumes all persistent cultural forms must be adaptive; some may be maladaptive parasites.

  **8. The Elite Manufacture Claim**
  *   **Requirement:** The theory must show how leadership actively constructs the myth to secure post-war power.
  *   **Justification:** Explains the rapid institutionalization of certain symbols.
  *   **Status:** **Hobby-horse (Top-Down).** Contradicted by Requirement 6 (Agency Distribution). Leaders often lose control.

  **9. The Grief Processing Claim**
  *   **Requirement:** The theory must model the myth as a collective mourning ritual for lost life and status.
  *   **Justification:** Explains the emotional intensity and ritualistic repetition.
  *   **Status:** **Hobby-horse (Psychological).** Explains the *feel* but not the *content* (why this story rather than another?).

  **10. The Memetic Fitness Claim**
  *   **Requirement:** The theory must explain the myth's survival based on transmissibility rather than truth or utility.
  *   **Justification:** Explains why simpler, more emotional versions outcompete complex, accurate ones.
  *   **Status:** **Hobby-horse (Memetic).** Explains spread, but not the specific structural constraints (like the Traitor figure).

  ---

  ### Joint Unsatisfiability and The Knockout

  **The Unsatisfiable Pair:** **Elite Manufacture (8)** and **Agency Distribution (6).**
  You cannot maintain that the myth is successfully engineered by leadership to secure specific post-war outcomes while simultaneously acknowledging that the surviving version is not the one leadership wanted. If elites control the mechanism, the output should match their intent. If the output diverges, the mechanism is not under elite control. A theory must choose: either the myth is a tool (and you must explain why the tool broke away from the user) or it is an emergent phenomenon (and you must explain why it looks so designed).

  **The Knockout Requirement:** **Agency Distribution (6).**
  This is the single requirement that does the most work eliminating candidate theories. It instantly disqualifies any model that relies on conscious, top-down conspiracy as the *sole* driver. It forces the theory to accommodate unintended consequences, bottom-up mutation, and the failure of authority. Any theory that cannot explain why the veterans and leaders lose ownership of their own story is insufficient.

  ---

  ### Assessment of Theoretical Families

  Functionalists secure the utility but stumble on the diaspora differential, unable to explain why a cohesion-tool works better where the group is fragmented. Top-down accounts handle the institutionalization but shatter against the agency distribution problem, failing to explain why leaders lose control of their own propaganda. The grief-and-mourning crowd captures the emotional intensity and the near-win displacement but cannot account for the structural necessity of the traitor or the aesthetic purification of politics. Memetic approaches explain the spread and the simplification but treat the specific content as accidental rather than structurally required. Each family captures a mechanism but mistakes it for the whole engine.
