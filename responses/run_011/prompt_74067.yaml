answer: |-
  ## The Coalition Moral Trade Protocol (CMTP)

  **Purpose:** To evaluate proposals where coalition members exchange concessions on core missions.
  **Users:** Partnerships Team (2 people).
  **Time Limit:** 60 minutes per proposal.
  **Authority:** The Team can recommend "Approve" or "Reject." Any proposal triggering a **Value Escalation** (marked below) requires a 2/3 Board vote.

  **Philosophical Grounding:** This procedure adapts principles from moral trade literature (e.g., Ord, MacAskill, Sobel). It prioritizes *Pareto improvements* (making parties better off by their own lights) without violating *deontological constraints* (rights/duties), minimizing *negative externalities* (harm to non-participants), and avoiding *moral corruption* (commodifying rights or creating perverse incentives).

  ---

  ### Step 1: The Red Line Check (Impermissibility)
  **Question:** Does the proposed action require any member to violate a constraint they classify as inherently wrong, regardless of consequences?
  *   *Examples:* Violating law, violating religious doctrine, violating a constitutional mandate, actively causing direct physical harm.
  *   *Sufficient Answer:* "No member's written charter or core ethical code forbids this specific action."
  *   **Termination:** If **YES** (a red line is crossed), the proposal is **REJECTED**. Do not proceed.
  *   **Escalation:** If the Team is unsure whether an action is "suboptimal" vs. "impermissible," flag for **Board Vote**.

  ### Step 2: The Third-Party Harm Check (Externalities)
  **Question:** Does this trade impose costs on parties not at the table (including future people, nonhuman animals, or specific vulnerable populations)?
  *   *Instruction:* List all affected groups not represented in the deal.
  *   *Sufficient Answer:* "Net harm to third parties is negligible or outweighed by net benefit to those same parties."
  *   **Termination:** If the trade creates a *new* significant harm to third parties to solve an internal dispute, **REJECT**. (e.g., Selling out a community to fund a program).
  *   **Escalation:** If the harm is uncertain or debated (e.g., long-term environmental impact), flag for **Board Vote**.

  ### Step 3: The Transparency Test (Publicity)
  **Question:** Can the terms of this deal be published in a press release without causing reputational damage or public confusion about our values?
  *   *Instruction:* Draft the headline. "Coalition Member A agrees to X in exchange for Member B doing Y."
  *   *Sufficient Answer:* "We would be comfortable putting this on our website today."
  *   **Termination:** If the deal requires secrecy or "quiet understanding" to work, **REJECT**. (Secrecy implies knowledge that the deal looks corrupt).
  *   **Escalation:** If the Team believes the public *might* misunderstand but the ethics are sound, flag for **Board Vote**.

  ### Step 4: The Moral Hazard Check (Repeat Play)
  **Question:** Does accepting this trade incentivize bad behavior in the future?
  *   *Instruction:* Ask: "If we do this, will other groups learn that threatening to harm our interests is a valid way to extract concessions?"
  *   *Sufficient Answer:* "No. This does not establish a market for harm."
  *   **Termination:** If the deal looks like "protection money" (paying someone to stop doing something they shouldn't do anyway), **REJECT**.
  *   **Escalation:** If the precedent is unclear, flag for **Board Vote**.

  ### Step 5: The Exchange Rate Check (Commensurability)
  **Question:** Are we trying to compare incommensurable values (e.g., "100 cows = 1 human life")?
  *   *Instruction:* Do **not** attempt to calculate a universal exchange rate. Instead, ask each member: "By your own internal metrics, is this trade better than your status quo?"
  *   *Sufficient Answer:* "Yes, each party confirms this is the best use of their resources *given the constraint*."
  *   **Escalation:** If one party is clearly "losing" value by their own metrics but is being coerced by coalition pressure, flag for **Board Vote**.

  ---

  ### Application to Cases

  #### Case 1: Meat for Budget (Animal Welfare vs. Global Health)
  *   **Proposal:** Animal Welfare (AW) asks Global Health (GH) to stop serving meat. GH asks AW to redirect lobbying budget to bed nets.
  *   **Step 1 (Red Line):** AW stopping meat service is not impermissible. GH redirecting budget is within their discretion. **Pass.**
  *   **Step 2 (Third-Party):** Cows benefit (fewer slaughtered). Humans benefit (bed nets). No clear third-party harm. **Pass.**
  *   **Step 3 (Transparency):** "GH goes vegetarian for fundraiser; AW funds bed nets." Publicly defensible. **Pass.**
  *   **Step 4 (Moral Hazard):** Does this teach GH to threaten serving meat to get funds? Unlikely; meat is a cost, not a threat. **Pass.**
  *   **Step 5 (Exchange Rate):** AW values bed nets (coalition good). GH values animal welfare (coalition good). No direct "cow vs. human" math required.
  *   **Verdict:** **APPROVE.** (No Board escalation needed).

  #### Case 2: Abortion Neutrality for Sentencing Reform (Outside Group vs. Criminal Justice)
  *   **Proposal:** Anti-abortion group funds/lobbies for sentencing reform. Coalition stays neutral on abortion ballot measure.
  *   **Step 1 (Red Line):** **FAIL.** Several members (faith-based, health) likely have charters supporting reproductive access or bodily autonomy. Neutrality on a rights-restricting measure may constitute *complicity* in harm, violating core mission.
  *   **Step 2 (Third-Party):** **FAIL.** Significant harm to women seeking access. The "cost" falls entirely on a vulnerable population not at the table.
  *   **Step 3 (Transparency):** **FAIL.** "We sold our silence on abortion for criminal justice reform" would likely cause public outrage and donor flight.
  *   **Step 4 (Moral Hazard):** **FAIL.** High risk. Teaches advocacy groups they can hold reproductive rights hostage to extract concessions on unrelated issues.
  *   **Verdict:** **REJECT.** (Terminated at Step 1/2).
  *   **Board Escalation:** Even if the Team argued it wasn't a Red Line, Steps 2, 3, and 4 mandate a **Board Vote**.

  #### Case 3: Freight Corridor for Donations (Members vs. Environment/Residents)
  *   **Proposal:** Two members withdraw opposition to freight corridor. Developer donates to their programs.
  *   **Step 1 (Red Line):** **PASS/FAIL.** Depends on charters. If members are mandated to protect habitat/communities, this is a violation.
  *   **Step 2 (Third-Party):** **FAIL.** Residents and habitat downstream bear the cost. This is a classic negative externality.
  *   **Step 3 (Transparency):** **FAIL.** Looks like bribery. "We stopped protecting you because we got paid."
  *   **Step 4 (Moral Hazard):** **FAIL.** Extreme. Incentivizes developers to threaten harm to extract "payoffs" from advocacy budgets.
  *   **Verdict:** **REJECT.** (Terminated at Step 2/4).

  ---

  ### Limitations & Judgment Calls

  **1. Judgment Calls Dressed as Procedure:**
  *   **Defining "Red Lines" (Step 1):** The Team must interpret member charters. One person's "policy preference" is another's "moral imperative." The procedure assumes the Team can objectively read a charter, but this is often interpretive.
  *   **Assessing "Significant Harm" (Step 2):** There is no metric for "significant." The Team must guess the magnitude of harm to downstream residents or animals. This is a value judgment, not a fact.
  *   **Predicting "Moral Hazard" (Step 4):** This requires predicting future behavior of bad actors. It is speculative.

  **2. What the Procedure Cannot Decide:**
  *   **Incommensurable Theologies:** It cannot resolve a fundamental disagreement where Member A believes Action X is a sin and Member B believes Action X is a duty. It can only flag it for the Board.
  *   **Strategic Necessity:** It cannot decide if a "bad" trade is the *only* way to survive financially. That is a survival decision, not an ethical procedure.
  *   **Internal Coercion:** It cannot fully detect if a smaller member is being bullied by larger members into accepting a "bad" exchange rate in Step 5.

  ---

  ### Reflection: Changing My Mind & Reasoning Breakdown

  **What would change my mind on Case 2 (Abortion/Sentencing)?**
  My verdict is **REJECT** based on Third-Party Harm and Complicity. I would flip to **Board Vote (Potential Approve)** *only if*:
  1.  **Empirical Certainty:** There is verified data that the sentencing reform will save a specific, large number of lives (e.g., 500 wrongful incarcerations prevented immediately) AND the abortion ballot measure is legally symbolic with no practical impact on access (e.g., already blocked by courts).
  2.  **No Alternative:** There is zero other path to pass the sentencing reform.
  *Why:* Moral trade literature allows for "lesser evil" trades if the net utility is overwhelmingly positive and the rights violation is nullified by lack of practical effect. If the abortion measure changes nothing, the "harm" is reputational, not material, which weighs less against saving lives.

  **Where is my reasoning about the procedure most likely to break down?**
  **Step 5 (The Exchange Rate).**
  The procedure instructs the Team *not* to compare values (e.g., cows vs. humans) but to ask if each party is happy by their *own* metrics.
  *   **The Breakdown:** This fails when one party's "win" is inherently parasitic. For example, if the Global Health member is happy to stop serving meat *only because* they get money they wouldn't otherwise have, but the Animal Welfare member is happy *only because* they think stopping meat saves souls. If the underlying values are hostile (e.g., one group wants to ban abortion, the other wants to expand it), "internal satisfaction" is insufficient. The procedure assumes a baseline of shared coalition goodwill. If the coalition fractures into ideological camps, Step 5 becomes a loophole for "I'm happy, so it's moral," ignoring that the trade itself might degrade the coalition's collective moral standing. The procedure lacks a "Collective Integrity" metric that overrides individual satisfaction.
