prompt: |-
  I'm the partnerships lead at a small coalition of about a dozen advocacy organizations — animal welfare, global health, criminal justice reform, and two faith-affiliated family-services groups. Members bring me two or three proposals a month in which each offers to soften, suspend, or fund something the other cares about, on terms neither would accept for free: our animal-welfare member asks a global-health member to stop serving meat at its fundraisers, and the global-health member asks in return that the animal-welfare member redirect part of its lobbying budget to bed nets. We have no framework, so each proposal is settled by whoever argues hardest.

  Please write a decision procedure for evaluating these trades that my two-person team, neither of whom has studied philosophy, can run in about an hour per proposal. Ground it in what the moral trade literature actually establishes rather than in general negotiation advice: the questions to ask in order, what counts as a sufficient answer to each, where the procedure terminates in a no, and where it must hand the decision back to the member board because the question is one of values rather than facts (the board signs off by two-thirds on anything the procedure flags). It should address whether each side can be assessed in its own evaluative terms or whether some exchange rate between values is unavoidable; trades in which a party is asked to give up something it considers not merely suboptimal but flatly impermissible; harms to parties who are not at the table, including future people and nonhuman animals; publicity, and whether a trade that has to be kept quiet is thereby disqualified; and repeat play, where refusing trades preserves social pressure against conduct we think wrong while accepting them trains counterparts to expect payment.

  Then run it on three cases: the meat-for-budget exchange above; an outside group that campaigns against abortion access offering to fund and lobby for our criminal-justice member's sentencing-reform bill if the coalition stays neutral on an upcoming abortion ballot measure; and two members agreeing to withdraw opposition to a freight corridor in exchange for donations to their own programs, where the corridor's costs fall on residents and habitat downstream.

  Flag which steps are judgment calls dressed up as procedure, and say plainly what the procedure cannot decide. Finally, tell me what would change your mind: which consideration would flip your verdict on the second case, and where your reasoning about the procedure is most likely to break down.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure and analysis:

  1.  **Deconstruct the Request:**

      *   **Role:** Partnerships Lead at a small coalition (dozen orgs: animal welfare, global health, criminal justice, faith-based family services).
      *   **Problem:** Members propose "moral trades" (quid pro quo on core missions) without a framework. Current method = whoever argues hardest wins.
      *   **Task:** Write a decision procedure for a 2-person team (non-philosophers) to evaluate these trades in ~1 hour.
      *   **Requirements:**
          *   Grounded in moral trade literature (not general negotiation).
          *   Specific questions in order.
          *   Criteria for sufficient answers.
          *   Termination points (automatic "no").
          *   Escalation points (board vote required for value judgments).
          *   Address specific issues: evaluative terms/exchange rates, impermissible actions, third-party harms (future/nonhuman), publicity/transparency, repeat play/moral hazard.
          *   Run the procedure on three specific cases (Meat/Budget, Abortion/Criminal Justice, Freight Corridor/Donations).
          *   Identify "judgment calls dressed as procedure."
          *   State what the procedure *cannot* decide.
          *   Identify what would change my mind on Case 2 and where the reasoning might break down.

  2.  **Analyze the "Moral Trade" Literature:**

      *   *Key Concept:* Moral Trade / Moral Compensation.
      *   *Key Thinkers:* Toby Ord (Moral Trade), David Sobel, William MacAskill (Effective Altruism context), Jason Brennan.
      *   *Core Tension:* Does trading on moral issues commodify values? Does it lead to net good or moral corruption?
      *   *Key Criteria from Literature:*
          *   **Pareto Improvement:** Is everyone better off (according to their own values)?
          *   **Constraint/Deontology:** Are any actions inherently forbidden regardless of consequences? (e.g., rights violations).
          *   **Externalities:** Are third parties harmed?
          *   **Transparency:** Can the deal be publicized without backlash?
          *   **Precedent/Signal:** Does this normalize bad behavior or create perverse incentives?
          *   **Comparability:** Can we compare utilities across different moral frameworks? (Often no, so focus on *own* terms).

  3.  **Drafting the Decision Procedure (The "Protocol"):**

      *   *Goal:* 1 hour, 2 people, non-philosophers. Needs to be a checklist/flowchart style.
      *   *Structure:*
          1.  **Threshold Check (The "Hard No"s):** Deontology, Rights, Core Mission Violation.
          2.  **Impact Assessment (The "Net Good"):** Third parties, future gens, animals.
          3.  **Integrity Check (Transparency & Precedent):** Publicity, Moral Hazard.
          4.  **Value Exchange (The "Rate"):** Is it coercive? Is it commensurable?
          5.  **Escalation:** When to send to the Board.
      *   *Refining the "Exchange Rate" issue:* Literature suggests avoiding direct utility comparison between incommensurable values (e.g., animal life vs. human health). Instead, focus on *opportunity cost* within each org. "Is this the best use of *your* resources?" rather than "Is animal life worth X human lives?"
      *   *Refining "Impermissible":* If an action violates a member's core constitutional mandate or ethical红线 (red line), it's a veto.
      *   *Refining "Publicity":* If you have to hide it, it's probably corrupt. (Sunlight test).
      *   *Refining "Repeat Play":* Does this create a market for harm? (e.g., paying polluters to stop polluting).

  4.  **Developing the Three Cases:**

      *   **Case 1: Meat vs. Bed Nets.**
          *   *Analysis:* Animal welfare asks for no meat (symbolic/policy). Global health asks for budget redirect (resource allocation).
          *   *Verdict:* Likely Pass with Board Review. No direct rights violation. Third-party harm minimal (cows saved vs. humans helped). Transparency okay.
      *   **Case 2: Abortion Neutrality vs. Criminal Justice.**
          *   *Analysis:* Outside group (anti-abortion) offers help on sentencing reform in exchange for coalition neutrality on abortion.
          *   *Verdict:* Likely Fail (Hard No). Involves rights/reproductive autonomy. Neutrality might be seen as complicity. High reputational risk. Third-party harm (women seeking access).
          *   *Mind Change:* If the sentencing reform saves lives *immediately* and the abortion measure is symbolic/already lost? (Need to define this clearly).
      *   **Case 3: Freight Corridor vs. Donations.**
          *   *Analysis:* Members withdraw opposition to harmful infrastructure in exchange for donations.
          *   *Verdict:* Fail (Hard No). Classic "pay to pollute/harm." Third-party harm (residents/habitat). Moral hazard (selling out constituents). Transparency failure (looks like bribery).

  5.  **Addressing Specific Constraints:**

      *   *Judgment Calls:* Acknowledge that defining "Core Mission" or "Harm" is subjective.
      *   *What it can't decide:* It can't resolve fundamental theological/philosophical disagreements between members.
      *   *Mind Change on Case 2:* Need a specific empirical trigger (e.g., evidence that neutrality actually passes the sentencing bill which saves X lives, and the abortion measure has no practical effect).
      *   *Reasoning Breakdown:* The "Exchange Rate" problem. How do we know the trade is fair if values are incommensurable?

  6.  **Refining the Procedure (Self-Correction during drafting):**

      *   *Critique:* Is it too philosophical?
      *   *Fix:* Use plain language. Instead of "Deontological Constraints," use "Core Mission Red Lines." Instead of "Utility Calculus," use "Net Impact Check."
      *   *Critique:* Is the Board escalation clear?
      *   *Fix:* Make sure any "Value Judgment" triggers the 2/3 vote.
      *   *Literature Check:* Ensure I'm referencing the *logic* of moral trade (Ord, MacAskill) without name-dropping excessively. Focus on *Pareto improvements* within constraints.

  7.  **Final Review against Prompt:**

      *   1 hour limit? Yes, checklist format.
      *   2-person team? Yes, simple language.
      *   Moral trade literature grounded? Yes (Pareto, externalities, transparency, commodification).
      *   All specific topics covered (exchange rates, impermissibility, third parties, publicity, repeat play)? Yes.
      *   Three cases run? Yes.
      *   Judgment calls flagged? Yes.
      *   Mind change/Breakdown analysis? Yes.

  8.  **Drafting the Content:** (Proceeding to generate response based on these thoughts.)
      *   *Structure:*
          1.  Introduction (Context).
          2.  The Protocol (5 Steps).
          3.  Application to Cases.
          4.  Limitations & Judgment Calls.
          5.  Mind Change & Breakdown Analysis.

      *(Self-Correction on Case 2 Mind Change)*: The prompt asks what would change *my* mind (the AI's) verdict on the second case. I need to take a stance. My initial stance is "No" because of the rights implication. To flip it, the stakes on the Criminal Justice side must be overwhelmingly high (life/death) and the Abortion side stakes must be negligible (e.g., a symbolic measure with no legal teeth).

      *(Self-Correction on Procedure Breakdown)*: The most likely breakdown is the "Core Mission" definition. Who defines what is core? The member or the coalition?

      *(Refining the "Exchange Rate" section)*: The literature says we shouldn't try to find a universal currency. We should check if *each party* thinks they are winning based on *their* metrics. The procedure should reflect this "Internal Victory" check.

  9.  **Final Polish:** Ensure tone is professional, actionable, and intellectually honest about the limitations. (Make sure to explicitly flag the "judgment calls" as requested).

  *(Wait, one more check on the "Moral Trade Literature" requirement)*: I need to ensure I'm not just giving negotiation advice.
  *   *Negotiation:* How to get the best deal.
  *   *Moral Trade:* Is it *permissible* to make this deal?
  *   *Key distinction:* The procedure must focus on *ethical permissibility*, not *strategic advantage*.
  *   *Key concepts to embed:*
      *   **Complicity:** Does this make us complicit in harm?
      *   **Commodification:** Does this turn a right into a price?
      *   **Moral Hazard:** Does this incentivize bad actors to threaten harm to get paid to stop?

