      *   *Key Nuance:* Ensure I clarify Rousseau's view on "moral inertness." He says theater *follows* morals but *reinforces* bad ones and *cannot fix* them. It's not inert; it's a multiplier of existing social conditions, but the *introduction* of the theater changes the conditions.

  9.  **Self-Correction/Review during drafting:**
      *   *Wait, did Rousseau say it's inert?* In the *Letter*, he argues against d'Alembert's claim that theater improves morals. Rousseau says theater *paints* human passions. In a good city, it's unnecessary; in a bad city, it's dangerous. He argues the *existence* of professional actors is the problem (people paid to show themselves for money). This is distinct from "violent content."
      *   *Video Game Panic:* Focuses on *simulation of violence*.
