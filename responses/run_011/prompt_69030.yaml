answer: |-
  **MEMORANDUM**

  **TO:** Board of Directors
  **FROM:** Grantmaking Director
  **SUBJECT:** WALY Triage Protocol & Portfolio Implications
  **DATE:** October 26, 2023

  ### Part 1: The WALY Sanity Protocol (WSP)

  We cannot compare interpersonal utility directly. We know this. But we are using a metric that pretends we can. To prevent the portfolio from being captured by measurement artifacts (the "Utility Monster" problem) while respecting the data, we are implementing the following five-gate triage.

  This protocol is designed to be run in an afternoon by program staff, with the health economist consulted only at Gate 3. It prioritizes **epistemic humility** over **mathematical precision**.

  **Gate 1: Instrument Validity (The "Ruler" Check)**
  *   **Question:** Is the wellbeing change measured via a validated psychometric instrument (e.g., SWLS, EQ-5D, WARWICK) with established population norms, or via ad-hoc self-reporting ("On a scale of 1-10...")?
  *   **Pass:** Validated instrument with normed baseline.
  *   **Fail:** Ad-hoc self-report.
  *   **Action:** If Fail, apply a **0.5x discount multiplier** to all reported wellbeing gains.
  *   **Why:** People misuse scales. A "10" means different things to different people. Validated instruments reduce, but do not eliminate, this noise.
  *   **Fudge Flag:** This assumes validated instruments are cardinal across persons. They aren't. But they are less noisy than ad-hoc scales.

  **Gate 2: Durability Horizon (The "Fade" Check)**
  *   **Question:** What is the half-life of the reported wellbeing gain? Is there evidence (longitudinal data or strong proxy) of persistence beyond 12 months?
  *   **Pass:** Evidence of >12 month persistence.
  *   **Fail:** Gains spike and return to baseline within 6 months.
  *   **Action:** If Fail, apply a **0.2x discount multiplier**. If Pass, 1.0x.
  *   **Why:** Hedonic adaptation is robust. Peak experiences rarely rewrite baseline set-points.
  *   **Fudge Flag:** We are arbitrarily valuing "stable" wellbeing over "intense" wellbeing. A year of ecstasy might be worth more than a decade of contentment, but we can't measure the ecstasy reliably.

  **Gate 3: Baseline Calibration (The "Zero" Check)**
  *   **Question:** Is the beneficiary baseline >3 standard deviations below the population norm for their condition/demographic?
  *   **Pass:** No (Baseline is within normal variation).
  *   **Fail:** Yes (Baseline is extreme outlier).
  *   **Action:** If Fail, **Escalate to Health Economist**. Require external verification of baseline severity (e.g., clinical assessment, not just self-report). If external verification is unavailable, apply a **0.4x discount**.
  *   **Why:** Extreme self-reported suffering often correlates with response bias or scale compression (using the whole range for normal variation).
  *   **Fudge Flag:** This is where we fight the Utility Monster. We are assuming extreme claims are likely errors until proven otherwise.

  **Gate 4: Concentration Risk (The "Monster" Cap)**
  *   **Question:** Does this single grant account for >20% of the foundation's total projected annual WALYs?
  *   **Pass:** No.
  *   **Fail:** Yes.
  *   **Action:** If Fail, **Escalate to Board**. Do not fund without explicit Board waiver.
  *   **Why:** If one grant dominates the metric, the metric has likely broken. It indicates a lack of diversification and high model risk.
  *   **Fudge Flag:** This is pure risk management dressed as ethics. It prevents us from betting the farm on one measurement model.

  **Gate 5: Interpersonal Aggregation (The "Sum" Check)**
  *   **Question:** Are we summing WALYs across distinct individuals to make a funding decision?
  *   **Action:** **Always.** (This is our mandate).
  *   **Constraint:** If Gate 3 or 4 triggered a discount/escalation, the "Sum" is adjusted.
  *   **Fudge Flag:** This is the big one. We are treating Person A's pain and Person B's pain as fungible currency.

  ***

  ### Part 2: Running the Protocol

  Here is how the three current proposals score under the WSP.

  #### (a) The Palliative Program (40 people, rare degenerative condition)
  *   **Metrics:** Cost/WALY is astronomical, but WALY/person is off the charts. Baseline self-reports are near "worst imaginable." Post-intervention reports are "manageable."
  *   **Gate 1 (Instrument):** Ad-hoc self-report (patients are too ill for complex surveys). **Discount 0.5x.**
  *   **Gate 2 (Durability):** Intervention lasts until death (avg 18 months). **Pass (1.0x).**
  *   **Gate 3 (Baseline):** Baseline is >3 SD below norm. Extreme outlier. No external verification possible (condition is rare, subjective pain). **Discount 0.4x.**
  *   **Gate 4 (Concentration):** This grant accounts for 45% of total portfolio WALYs. **Escalate to Board.**
  *   **Net Result:** **ESCALATE.** The raw numbers say "Fund Immediately." The WSP says "The numbers are likely noisy, and you are betting half the shop on them."
  *   **Adjusted WALY:** ~20% of raw claim.

  #### (b) The Wilderness Program (Small N, peak experiences)
  *   **Metrics:** Huge spikes in reported life satisfaction during/just after program.
  *   **Gate 1 (Instrument):** Validated scale (SWLS). **Pass.**
  *   **Gate 2 (Durability):** Follow-up at 2 years shows return to baseline. **Fail (0.2x).**
  *   **Gate 3 (Baseline):** Within normal variation for age group. **Pass.**
  *   **Gate 4 (Concentration):** Low. **Pass.**
  *   **Net Result:** **REJECT.** The durability discount kills the WALY count. A spike is not a life-year.
  *   **Adjusted WALY:** ~20% of raw claim.

  #### (c) The CBT App (Massive reach, tiny gain)
  *   **Metrics:** 0.05 point gain on validated scale. 100,000 users.
  *   **Gate 1 (Instrument):** Validated (PHQ-9/GAD-7 proxies). **Pass.**
  *   **Gate 2 (Durability):** Mixed evidence, but CBT effects generally persist >1 year. **Pass (0.8x).**
  *   **Gate 3 (Baseline):** Slightly elevated distress, within norms. **Pass.**
  *   **Gate 4 (Concentration):** Low. **Pass.**
  *   **Net Result:** **FUND.** Despite the tiny individual gain, the volume + validity + durability makes it the WALY leader.
  *   **Adjusted WALY:** ~80% of raw claim.

  ***

  ### Part 3: The Autopsy

  You asked me to be straight. Here is where the bodies are buried.

  **1. Which one will the Board hate?**
  **Side A (The Maximizers) will hate the outcome on Proposal A (Palliative).**
  They adopted WALYs to be bold—to save the people in the deepest hell, even if it costs more. By applying Gate 1 and Gate 3 discounts, I have effectively told them that the "deep hell" is likely a measurement artifact. I have prioritized *measurement reliability* over *moral urgency*.
  They will argue that discounting extreme suffering because it's "hard to measure" is cruel. They are right. But if we don't discount it, we fund a black box.
  **Side B (The Intuitionists) will hate Proposal C (CBT App).**
  They will argue that improving 100,000 lives by 0.05 points is meaningless. It is "utilitarianism for robots." They want to see transformation, not noise reduction. But under the WSP, C wins.

  **2. Where does Prioritarianism sneak in?**
  It sneaks in at **Gate 3 (Baseline Calibration)** and **Gate 1 (Instrument Validity)**.
  Pure Total Utilitarianism does not care if the scale is ad-hoc, provided the sum is higher. It does not care if the baseline is an outlier. It just sums.
  By imposing a "reliability discount" on extreme outliers, I am implicitly saying: *"We value a WALY gained by a typical person more than a WALY gained by an extreme sufferer, because we trust the former more."*
  This is not utilitarianism. This is **Epistemic Prioritarianism**. We are weighting the wellbeing of those whose suffering looks "normal" to our instruments higher than those whose suffering looks "extreme." We are privileging the legible over the real.

  **3. Where is Nozick pointing?**
  Robert Nozick would not point at the discounts. He would point at **Gate 5 (The Sum Check)**.
  He would tap his finger on the line where we add Person A's relief to Person B's relief and treat the total as a moral good.
  He would say: *"There is no foundation entity that experiences the 'Total WALYs.' There are only individuals. By sacrificing the intense needs of the 40 (Proposal A) to fund the trivial needs of the 100,000 (Proposal C), you are using the 40 as means to the end of a 'high portfolio score.' You are violating the separateness of persons."*
  Nozick would argue that the Palliative grant should be evaluated on whether it is *right* to help those 40 people, not on whether it helps the foundation's spreadsheet look better than the CBT app.

  **4. The Recommendation**
  The WSP recommends funding **(c) The CBT App** and escalating **(a) The Palliative Program** for a values vote.
  This splits the difference. It secures the "efficient" bulk of the portfolio (satisfying Side A's desire for metrics) but forces a conscious ethical decision on the "monster" case (satisfying Side B's desire for intuition).
  However, know this: If the Board votes down the Palliative program after seeing the adjusted numbers, they have admitted they are not Utilitarians. They are Prioritarians who used WALYs as camouflage. If they vote to fund it despite the risk flags, they are accepting high model risk for moral reasons.
  Either way, the camouflage comes off this quarter.

  **Signed,**
  **Grantmaking Director**
