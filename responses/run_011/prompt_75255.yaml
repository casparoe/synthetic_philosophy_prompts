answer: |-
  # Constructive Analysis Triage Procedure (CATP)

  **Purpose:** Determine the constructive status of a candidate theorem before formalization begins.
  **Time Limit:** 30 minutes.
  **Inputs:** Theorem statement, standard proof sketch (informal).
  **Outputs:** One of four verdicts (Port, Strengthen, Approximate, Axiom) OR Escalation.

  ---

  ## Part 1: The Triage Checklist

  Perform these tests in order. Stop at the first failure that dictates a verdict.

  ### Test 1: Conclusion Stability (Double Negation)
  **Action:** Inspect the conclusion $C$. Ask: Is $C$ of the form $\neg\neg C \to C$?
  *   **Settled Answer:** $C$ is an inequality ($x < y$), an apartness relation ($x \# y$), or a negation ($\neg P$). These are typically stable.
  *   **Failure:** $C$ is an equality ($x = y$), a disjunction ($P \lor Q$), or a bare existential ($\exists x, P(x)$) without a witness construction.
  *   **Verdict if Failure:** Proceed to Test 2. If *all* conclusions in the file are unstable, **Escalate** (Architectural).

  ### Test 2: Existential Witness Extraction
  **Action:** Inspect the proof sketch for $\exists x$. Can the proof compute $x$ to arbitrary precision from the hypotheses?
  *   **Settled Answer:** Yes. The proof provides an algorithm (e.g., bisection with a stopping condition).
  *   **Failure:** The proof argues "the set of such $x$ is non-empty, therefore one exists" or uses a compactness argument without locating the point.
  *   **Verdict if Failure:** **Restate Approximately.** Change $\exists x, f(x)=0$ to $\forall \epsilon > 0, \exists x, |f(x)| < \epsilon$. (Stop here).

  ### Test 3: Undecidable Case Splits (LPO/WLPO)
  **Action:** Identify any step where the proof splits cases on a predicate $P(x)$ (e.g., "Either $x=0$ or $x \neq 0$", "Either $f(c) > 0$ or $f(c) \le 0$").
  *   **Settled Answer:** $P(x)$ is decidable for the given type (e.g., equality on $\mathbb{N}$ or $\mathbb{Q}$).
  *   **Failure:** $P(x)$ is equality or order on $\mathbb{R}$. This invokes the Limited Principle of Omniscience (LPO) or Weak LPO.
  *   **Verdict if Failure:** **Add Axiom.** Declare `Axiom LPO : forall x : R, x = 0 \/ x # 0.` (Stop here).
      *   *Note:* If the hypothesis can be strengthened to make $P$ decidable (e.g., $f$ is monotone), choose **Strengthen Hypothesis** instead.

  ### Test 4: Choice and Subsequences
  **Action:** Does the proof select an element from infinitely many non-empty sets (e.g., "choose $n_{k+1} > n_k$ such that...")?
  *   **Settled Answer:** No, or the selection is deterministic/unique.
  *   **Failure:** Yes, arbitrary selection from a sequence of sets. This invokes Countable Choice (AC$_\omega$) or Dependent Choice (DC).
  *   **Verdict if Failure:** **Add Axiom.** Declare `Axiom AC_Omega.`
      *   *Exception:* If the selection requires picking from *uncountable* sets or non-constructive existence, this invokes Full AC or EM. **Escalate**.

  ### Test 5: Architectural Compatibility (Escalation Point)
  **Action:** Does the theorem hold for Cauchy Reals but fail for Dedekind Reals (or vice versa) in the constructive setting? (e.g., Completeness properties, Boundedness).
  *   **Settled Answer:** Theorem holds for the library's chosen Real definition.
  *   **Failure:** Theorem depends on properties not guaranteed by the current Real definition (e.g., Dedekind completeness vs. Cauchy completeness).
  *   **Verdict:** **Escalate to PI.** Do not port. This is a foundational commitment, not a local fix.

  ---

  ## Part 2: Application to Candidate Theorems

  ### Case 1: The Intermediate Value Theorem (IVT)
  *Statement:* If $f$ is continuous on $[a,b]$ and $f(a)<0<f(b)$, there exists $c \in [a,b]$ such that $f(c)=0$.
  *   **Test 1 (Stability):** Conclusion is $f(c)=0$. Equality on reals is not stable ($\neg\neg(x=0) \nrightarrow x=0$). **Fail.**
  *   **Test 2 (Witness):** Standard bisection requires deciding if $f(mid) = 0$ to stop. We cannot decide this. We cannot compute the exact root. **Fail.**
  *   **Verdict:** **Restate Approximately.**
      *   *New Statement:* $\forall \epsilon > 0, \exists c \in [a,b], |f(c)| < \epsilon$.
      *   *Student Reaction:* **Resentment.** Students view the approximate IVT as "failure." They want the root. Explain that without LPO, the exact root is not guaranteed to be findable.

  ### Case 2: Trichotomy of Order
  *Statement:* For every real $x$, $x \ge 0 \lor x \le 0$.
  *   **Test 1 (Stability):** Conclusion is a disjunction ($P \lor Q$). Not stable. **Fail.**
  *   **Test 2 (Witness):** N/A (No existential).
  *   **Test 3 (Case Splits):** The statement *is* a case split on $x=0$ (or sign). For constructive reals, we cannot decide if a number is zero or apart from zero. This is exactly WLPO/LPO. **Fail.**
  *   **Verdict:** **Add Axiom.**
      *   *Action:* Add `Axiom WLPO : forall x : R, ~(x # 0) -> x = 0` (or equivalent).
      *   *Note:* This is weaker than full EM but contaminates the module. Mark the file `Classical.Order`.

  ### Case 3: Bolzano–Weierstrass (B-W)
  *Statement:* Every bounded sequence of reals has a convergent subsequence.
  *   **Test 1 (Stability):** Existential (subsequence + limit). **Fail.**
  *   **Test 2 (Witness):** Constructing the subsequence requires choosing indices $n_k$ such that the tail remains in a shrinking interval. We cannot decide which half-interval contains infinitely many points without LPO. **Fail.**
  *   **Test 3 (Case Splits):** Requires splitting on "infinitely many points in left half" vs "right half". Undecidable. **Fail.**
  *   **Test 4 (Choice):** Requires choosing indices repeatedly. Needs Dependent Choice. **Fail.**
  *   **Test 5 (Architecture):** B-W is equivalent to WKL (Weak König's Lemma) in reverse math. Constructively, it implies LPO + Choice.
  *   **Verdict:** **Add Axiom.**
      *   *Action:* Requires `Axiom EM` and `Axiom DC`.
      *   *Warning:* This effectively makes the file classical. If the library aims to be constructive, this theorem should be isolated in a `Classical.Analysis` namespace.

  ---

  ## Part 3: Limitations of the Procedure

  This checklist cannot catch **smuggled principles in definitions**. This is the Diaconescu risk.

  1.  **Definition Hiding:** If you define a set $S$ as "finite" using a classical definition (bijective with $\{0..n\}$), you may inadvertently assume EM when proving properties about $S$. Constructively, "finite" (Kuratowski) and "sub-finite" differ.
  2.  **Diaconescu's Theorem:** If you admit the Axiom of Choice for *sets* (even seemingly harmless ones), you can derive the Law of Excluded Middle.
      *   *Risk:* A student defines a quotient type or a set of equivalence classes and assumes a choice function exists to pick representatives.
      *   *Blind Spot:* The triage procedure checks *theorems*, not *definitions*. A definition like `Definition max (x y : R) := if x > y then x else y` assumes decidability of order. If that definition is in the core library, every subsequent theorem inherits classical logic silently.
      *   *Mitigation:* Audit definitions separately. Ban `if-then-else` on Real propositions.

  ---

  ## Part 4: Foundational Position & Defaults

  You asked for a position, not a survey. Here is the policy for the library:

  **1. The Real Numbers:**
  *   **Default:** **Dedekind Reals** (Cuts).
  *   **Reasoning:** Cauchy reals require a modulus of convergence to be constructive, which burdens every theorem statement. Dedekind reals handle the IVT and order properties more naturally in a constructive setting (via locatedness), even if B-W remains hard.
  *   **Constraint:** All reals must be *located* (we can approximate the cut arbitrarily). Non-located Dedekind cuts are banned.

  **2. Axiom of Choice:**
  *   **Ban:** **Full Axiom of Choice.**
  *   **Reasoning:** Diaconescu's theorem proves AC implies EM. If you allow AC, you lose the constructive distinction. There is no "safe" place to put it.
  *   **Permit:** **Countable Choice (AC$_\omega$).**
  *   **Reasoning:** Essential for analysis (sequences, limits) and does not imply full EM. It must be declared explicitly in the file header.

  **3. Excluded Middle (EM):**
  *   **Default:** **Forbidden.**
  *   **Permit:** **Local Flags.**
  *   **Reasoning:** Do not put EM in the prelude. Create a `Classical` namespace. Theorems like B-W and Trichotomy live there. If a file imports `Classical`, it is marked as "Non-Computational."
  *   **Policy:** A file cannot import `Classical` and export to a `Constructive` file. The dependency graph must be acyclic with respect to classical principles.

  **4. The "Resented" Outcome:**
  *   I am enforcing the **Approximate IVT** as the constructive standard. Students will complain that "Analysis is about exact values."
  *   **Defense:** In a constructive setting, an exact root is a non-computable object unless the function is locally non-zero (monotone). Teaching them to work with approximations is more valuable for computation and numerical stability than hiding the non-constructivity behind an axiom. If they need exact roots, they must prove the function is *monotone* (Strengthen Hypothesis), which is a mathematically richer condition anyway.

  **5. Smuggled Principles:**
  *   **Rule:** No definitions may contain case splits on Real propositions.
  *   **Enforcement:** Code review must check definitions, not just theorems. If a definition uses `match` or `if` on a Prop involving Reals, reject it.

  This policy prioritizes **computational content** over **classical convenience**. It will slow down the porting of standard theorems (like B-W), but it ensures that every theorem in the main library corresponds to an algorithm.
