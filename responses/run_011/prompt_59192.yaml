answer: |-
  ### Specification for First-Person Methods in Consciousness Science

  **1. The Existence/Character Separation**
  *   **Motivation:** Subjects may be correct that they are experiencing *something* but wrong about *what* (e.g., misidentifying a color or shape), or vice versa. A method must distinguish failing to enter a state from misdescribing it.
  *   **Constraint Type:** Licensed Inference.
  *   **Operational Test:** Does the analysis code "null reports" (nothing experienced) separately from "error reports" (incorrect feature identification), and does the theory allow for a confidence rating to diverge from accuracy without invalidating the trial?

  **2. The Report/Experience Gap**
  *   **Motivation:** Core to the overflow debate is the possibility that experience exceeds access. A method cannot define experience as identical to report without begging the question.
  *   **Constraint Type:** Licensed Inference.
  *   **Operational Test:** Does the statistical model treat the report as a noisy indicator of a latent variable (experience), rather than treating the report value as the ground truth value of the experience?

  **3. The Non-Circular Validation Loop**
  *   **Motivation:** Science requires ground truth, but phenomenality has no third-person anchor. Validating reports against neural data is circular if the neural data was selected based on reports.
  *   **Constraint Type:** Data-Collection & Inference.
  *   **Operational Test:** Does the protocol specify an independent criterion for report validity (e.g., prediction of future behavior, neural markers established in non-report tasks) that does not rely on the veracity of the report being validated?

  **4. The Inter-Subject Bridge**
  *   **Motivation:** Science requires commensurability. "Red" for Subject A must be comparable to "Red" for Subject B, despite private qualia.
  *   **Constraint Type:** Data-Collection.
  *   **Operational Test:** Is there a calibration phase (e.g., standard stimuli, vocabulary training, second-person interviewing) where subjects align their usage of descriptive terms before experimental data collection begins?

  **5. The Temporal Lag Constraint**
  *   **Motivation:** Reports are produced hundreds of milliseconds after the episode and are reconstructed in working memory, susceptible to interference and decay.
  *   **Constraint Type:** Data-Collection.
  *   **Operational Test:** Does the protocol measure or strictly control the stimulus-to-report onset interval, and does the analysis account for working memory load during that interval?

  **6. The Detail/Truth Decoupling**
  *   **Motivation:** High-granularity reports can be confabulations; vague reports can be accurate. Specificity does not entail veracity.
  *   **Constraint Type:** Licensed Inference.
  *   **Operational Test:** Does the coding scheme weight reports by validated accuracy rather than word count or feature density, and does it flag high-detail reports that fail objective discrimination checks?

  **7. The Non-Verbal Extension**
  *   **Motivation:** A science of consciousness must apply to infants, animals, aphasia, and disorders of consciousness where verbal report is impossible.
  *   **Constraint Type:** Data-Collection.
  *   **Operational Test:** Does the method specify a non-verbal proxy (e.g., eye-tracking, neural signature, conditioned response) that is calibrated against verbal reports in intact subjects and then deployed in non-verbal populations?

  **8. The Stability Metric**
  *   **Motivation:** Anecdotes vary; data must be stable across sessions and experimenters to count as scientific evidence.
  *   **Constraint Type:** Data-Collection.
  *   **Operational Test:** Does the published protocol report test-retest reliability coefficients (e.g., intraclass correlation) for the introspective measures across multiple sessions or different interviewers?

  ***

  ### Sorting and Trade-Offs

  **Non-Negotiable (NN) vs. Camp Prejudice (CP)**
  *   **NN:** Requirements 2 (Report/Experience Gap), 3 (Non-Circular Validation), 4 (Inter-Subject Bridge), 7 (Non-Verbal Extension), and 8 (Stability Metric). These are required for the enterprise to remain science rather than philosophy or anecdote. If you cannot validate non-circularly, compare subjects, or generalize to non-reporters, you do not have a science of consciousness.
  *   **CP:** Requirements 1 (Existence/Character), 5 (Temporal Lag), and 6 (Detail/Truth).
      *   *Advisor's Prejudice:* Insists on a strong version of 5 (all reports are reconstructed behavior) and 6 (detail is suspect unless behaviorally verified).
      *   *Phenomenologist's Prejudice:* Insists on a weak version of 1 (subjects have privileged access to character) and 6 (detail indicates higher resolution access).
      *   *Resolution:* Requirement 1 is NN in principle but CP in application; you must allow the distinction, but you cannot assume subjects can reliably make it without training.

  **Incompatibilities and Surrenders**
  There is a direct conflict between **Requirement 3 (Non-Circular Validation)** and the strong phenomenological claim that **First-Person Authority is Self-Validating**. You cannot have a method that treats introspective reports as incorrigible data *and* a method that subjects those reports to external validation without circularity.
  *   **Surrender:** You must surrender the claim that First-Person Authority is Self-Validating.
  *   **Reason:** If reports are self-validating, you cannot detect overflow (Requirement 2), because any discrepancy between report and stimulus would be defined as a change in experience rather than a loss of access. To study overflow, you must allow that the report can be wrong about the experience. Therefore, Validation (3) trumps Authority.

  **The Eliminative Requirement**
  **Requirement 3 (The Non-Circular Validation Loop)** does the most work to eliminate candidates. Most methods fail here. They either assume reports are true (phenomenology) or assume reports are merely behavior to be explained by third-person data (behaviorism). A method that specifies *how* it breaks the circle without collapsing the target is the rarest and most critical deliverable.

  ***

  ### Method Scoring

  Heterophenomenology satisfies the Non-Circular Validation and Stability Metrics by treating reports as third-person data, but it fails the Report/Experience Gap by effectively collapsing the latent variable into the observed behavior, rendering the overflow question unintelligible within its own framework. Neurophenomenology successfully maintains the Report/Experience Gap and addresses the Temporal Lag through second-person calibration, but it struggles with the Non-Circular Validation Loop, often relying on neural correlates that were themselves identified using the very reports they are meant to validate, risking a tight circularity. Descriptive Experience Sampling excels at the Detail/Truth Decoupling and Stability Metric through rigorous beep-based sampling and interviewing, yet it frequently falters on the Inter-Subject Bridge and Non-Verbal Extension, as its idiographic focus makes cross-subject commensurability and generalization to non-verbal populations difficult to operationalize. The Deflationary Option maximizes Non-Circular Validation and Stability by treating reports as standard behavior, but it fundamentally violates the Report/Experience Gap and Non-Verbal Extension constraints by denying the distinct ontological status of phenomenology, thereby solving the overflow debate by eliminating the "overflow" term rather than measuring it.
