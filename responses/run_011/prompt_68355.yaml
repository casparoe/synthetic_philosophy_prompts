          *   *Resolution:* Must weaken B1 or B2. Given the user's "materials testing" background, B1 feels like the core intuition (materialism). But B2 is the "fink verdict" which is standard in modern philosophy (Martin, Lewis). If you keep B2, B1 must go (or be restricted). If you keep B1, you must reject standard Fink cases (argue the wire *is* disposed, or the setup changes the structure).
