      *   *B2 vs. B4:* B2 accepts the "fink verdict" (wire isn't disposed). B4 says finks *destroy* the disposition. This seems consistent, but wait... B2 says the disposition is switched off by surroundings. B4 says it's destroyed. Is "switched off" the same as "destroyed"? If it's switched off by surroundings (B2), does the intrinsic basis remain? B1 says the basis is the structure. If the structure is unchanged, is the disposition destroyed?
      *   *B5 vs. B6:* B5 says only triggering settles the disposition. B6 says dispositions can exist without triggering. If only triggering settles it, how do we know dormant ones exist? (Epistemic vs. Ontological tension).
