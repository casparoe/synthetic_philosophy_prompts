      *   *Connection to B5:* B5 tries to ground everything in triggering. But if B1 is true, triggering is redundant for *existence* (structure suffices). If B2 is true, triggering is necessary but context-dependent.
      *   *Connection to B6:* B6 is compatible with B1 (structure exists untriggered). B6 is hard to square with B5 (if only triggering counts, how do we assert existence?).

      *   *Consolidation:* The main conflict is B1 vs. B2. B4 is a casualty of how B1/B2 are resolved. B5 vs B6 is a secondary epistemic issue. B1 vs B5 is a consequence of the B1 vs B2 clash.

      *   *Decision:* I need to present the **B1 vs. B2** clash as the primary severity. It forces a choice on the nature of properties.
      *   The **B5 vs. B6** clash is the second severity (Verificationism vs. Realism).
      *   The **B1/B2 vs. B4** issue is derivative. If B1 is true, Finks are Masks. If B2 is true, B1 is false. B4 tries to have it both ways (Finks destroy, but B2 says nothing happens inside).

