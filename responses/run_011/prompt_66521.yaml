  **What tier one commits us to**

  Tier one commits us to an informational or structural isomorphism account of content. Under this view, a physical state represents X if it covaries systematically with X in a way that makes X recoverable by a simple transformation. We are claiming the residual stream contains a structural map of the world state, regardless of whether the downstream network reads that map. The probe is merely a measurement device; the representation resides in the model's activations, not the classifier. This presupposes that content is a static relation between internal state and external fact, grounded in information theory rather than utility. It implies that "having" a representation is distinct from "deploying" it. We treat the residual stream as a public bulletin board where facts are posted; if a fact is posted, it exists there, even if no agent reads it. This separates ontology from function. It assumes the model's internal format is sufficiently structured that information availability constitutes possession. We are effectively claiming that the model's geometry encodes semantics, independent of the model's own computational engagement with that geometry. The content is there because the information is present in a readable format, not because it is doing work. We assume the residual stream is a canonical format where information storage equals representation existence. This view treats the model as a database rather than an agent. The probe confirms the database entry exists; it does not confirm the agent queried the database. We are committed to the idea that the geometry of the activation space itself holds semantic weight, independent of the transition functions that operate on that space.

  **What that rules out**

  This practice explicitly rejects teleosemantics and strong functional role semantics. Teleosemantics argues content depends on the evolutionary history of selection for a specific function; if the activation wasn't selected to guide behavior, it's not a representation, just a causal correlate. Similarly, functional role semantics requires the state to play a specific inferential or causal role within the system. Under these views, a perfect probe with zero causal impact shows nothing about content—it merely shows a shared cause. To satisfy these theories, our methods would need to change drastically. We could not claim "representation" without tracing the causal pathway from activation to loss reduction or output generation. Tier one would be demoted to "correlates with," and only Tier two interventions would license semantic vocabulary. We would be forced to treat unused activations as epiphenomenal noise, regardless of how readable they are. We would have to admit that a rock warming in the sun "represents" time of day if we can decode it, unless we prove the rock uses that state to regulate something. Our current convention avoids this absurdity by implicitly assuming model internals are special, but without a functional requirement, we lack the boundary. We are claiming model internals are fundamentally different from rocks, but rely on the same informational metric.

  **Where we're actually underdetermined**

  However, we are not fully committed to pure informationalism either. We rarely claim representation exists if the probe only works on training data; we demand generalization, which smuggles in a notion of robustness akin to functional capacity. Furthermore, most interpretability researchers agree with causal theorists that intervention is the stronger claim. The underdetermination lies in whether "availability for use" counts as "having." We assume the model *could* use the info if prompted, implying a dispositional account. We aren't saying the content is utterly inert, just that it isn't currently driving the default output. This leaves us floating between a static information store and a dispositional functionalist view, without specifying the conditions under which availability becomes use. We claim the representation exists because the circuitry *could* read it, but we don't verify if the circuitry *can* read it without intervention. We are underdetermined on whether the potential for causal leverage is sufficient for content, or if actual leverage is required.

  **The leak between the tiers**

  The category "represents but doesn't use" risks incoherence. If a state never influences behavior, in what sense is it a representation *for the model*? It is arguably a representation *for us*, the interpreters. Maintaining two tiers costs us ontological parsimony by populating the model with epiphenomenal beliefs. However, collapsing to a single causal standard loses critical nuance. In safety contexts, knowing a model encodes dangerous knowledge it isn't currently using is vital. A single causal standard would blind us to latent capabilities. The cleaner standard would be to define representation as "causally efficacious information," but we keep the dual tier because "latent efficacy" is a useful heuristic for predicting future behavior under distribution shift or adversarial prompting. We accept the philosophical bloat because it buys us predictive power. We are essentially treating the model as having states that exist and are readable but don't drive action. This is psychologically plausible for humans, but ontologically dubious for weights. We pay the cost of philosophical confusion to maintain safety visibility. It is hedging with extra steps: we claim representation to flag risk, but deny use to explain current behavior. This allows us to warn about capabilities without explaining mechanisms, which is pragmatic but theoretically messy.

  **If we flipped it**

  If causal role became the only route to "represents," decodability becomes merely a correlation heuristic. We stop being able to say "the model knows X but is refusing to say it." We lose the language of latent knowledge and dormant capabilities. This loss is real, not just inconvenient. In alignment work, distinguishing between a model that lacks a concept and one that suppresses it is crucial. Without Tier one, we cannot detect suppressed knowledge before it manifests causally. We would be forced to wait for the model to act on the knowledge before admitting it possesses it, which is unacceptable for high-stakes deployment. We lose the ability to audit the model's internal world model separate from its policy.

  **The soft spot**

  The most embarrassing vulnerability is the arbitrariness of linearity. We treat linear probes as ontological gold because they are methodologically convenient, not because there is a theory suggesting neural semantics must be linearly readable. A skeptic would ask: "Why isn't a nonlinear decode equally valid evidence of representation?" Our convention implies linear is 'more real' without justification. We have no philosophical defense for why the universe of possible representations is restricted to hyperplanes. It confuses our measurement limits with the system's structure.
