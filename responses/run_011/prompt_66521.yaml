      *   *Section 4 (The Leak):* "Represents but doesn't use" is epiphenomenalism. It costs us ontological parsimony. It suggests the model holds beliefs that never influence action. Collapsing to causal loses the ability to detect dormant capabilities (safety risk). Collapsing to probe loses grounding.
