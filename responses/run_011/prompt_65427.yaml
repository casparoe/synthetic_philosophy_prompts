  3.  **Analyze the US Model:**

      *   *Mechanism:* Third parties send data to IRS *and* Citizen -> Citizen re-types to IRS -> Citizen swears under penalty of perjury.
      *   *Presupposition:* The citizen is the primary obligor and the primary recorder. The state is an enforcer/collector, not a bookkeeper. The return is a *testimony*, not a reconciliation.
      *   *Liability:* Strictly on the filer. The IRS having the data doesn't absolve the filer of the duty to report it.
      *   *Relationship:* Adversarial/Contractual. The state demands a confession; the citizen provides it to avoid punishment.
