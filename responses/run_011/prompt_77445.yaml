answer: |-
  Here is the principle. It is not a menu. It is a single epistemic tool designed to cut through the noise of incentives, access, and stakes.

  ### The Principle of Net Epistemic Liability

  **Accept testimony from a source $S$ regarding claim $P$ if and only if one of the following three conditions is met:**

  1.  **Constrained Competence:** $S$ possesses privileged access to $P$ (Competence) **AND** $S$ faces a net liability for falsehood that exceeds the gain from deception (Constraint). Liability includes reputational damage, legal sanction, relational loss, or physical sacrifice.
  2.  **Pragmatic Economy:** The cost to you of verifying $P$ exceeds the expected harm of acting on $P$ if it is false (Cost-Benefit).
  3.  **Constitutive Necessity:** $P$ is a foundational narrative required for your agency or identity, and no superior source exists (Foundations).

  **Corollary on Domain:** Competence is non-transferable. Constraint in Domain A does not validate testimony in Domain B.

  ***

  ### Analysis of Your Ten Cases

  Here is how the principle adjudicates your verdicts. I am not rescuing all of them; I am clarifying which are sound and which are dangerous shortcuts.

  **1. Bus Stop (Delay):** **VERDICT: ACCEPT.**
  *   **Clause:** Pragmatic Economy.
  *   **Reasoning:** Verification (waiting to see if bus comes) costs 20 minutes. Error (standing in rain for no reason) costs 20 minutes. The stranger has no gain from lying. The risk is negligible.

  **2. Bus Stop (Conspiracy):** **VERDICT: REJECT.**
  *   **Clause:** Fails Constrained Competence.
  *   **Reasoning:** Stranger lacks privileged access (they are repeating rumor). They face zero liability for lying. The stakes (political worldview) are high, so Pragmatic Economy does not apply.

  **3. Mechanic:** **VERDICT: ACCEPT.**
  *   **Clause:** Constrained Competence.
  *   **Reasoning:** You identified the incentive problem, but missed the liability. A mechanic profits from the repair, *but* a licensed mechanic faces loss of license, lawsuits, and reputational ruin for fraudulent diagnostics. In a repeat-game (local shop), Liability > Gain.

  **4. Salesman:** **VERDICT: REJECT.**
  *   **Clause:** Fails Constrained Competence.
  *   **Reasoning:** Salesman has privileged access, *but* the transaction is one-off. Liability is near zero (caveat emptor). Gain > Liability.

  **5. GP (Drug):** **VERDICT: ACCEPT (With Correction).**
  *   **Clause:** Constrained Competence (Domain Specific).
  *   **Reasoning:** You feel conflicted because you think you are deferring on *data*. You are not. You read the *trial* (aggregate data); the GP testifies to *indication* (clinical application). The GP is liable for malpractice if they prescribe negligently. Their competence covers the interaction between the drug and *your* body, which the trial does not. You are deferring to their domain, not ignoring evidence.

  **6. GP (Podcast):** **VERDICT: REJECT.**
  *   **Clause:** Fails Domain Corollary.
  *   **Reasoning:** Competence is non-transferable. Medical board liability covers clinical practice, not podcast nutrition advice. Constraint is removed.

  **7. Whistleblower:** **VERDICT: ACCEPT.**
  *   **Clause:** Constrained Competence (Sacrifice as Liability).
  *   **Reasoning:** This solves your incentive paradox. Incentives track *gain*. Liability tracks *cost*. A whistleblower incurs a massive cost (career, friends) to tell the truth. This cost acts as a "bond" proving they aren't lying for gain. High Sacrifice = High Trust.

  **8. Historians:** **VERDICT: ACCEPT (Selective).**
  *   **Clause:** Constrained Competence (Reputational).
  *   **Reasoning:** Historians stake their careers on accuracy. Peer review is the constraint. You choose the one fitting your web of belief because coherence is a validity check when direct verification is impossible.

  **9. Mother (Childhood):** **VERDICT: ACCEPT.**
  *   **Clause:** Constitutive Necessity.
  *   **Reasoning:** This is not standard epistemology. You cannot audit this. If you reject it, you lose your origin story. The liability for her lying is relational rupture. It is rational to accept foundational narratives where verification is impossible and disbelief is psychologically costly.

  **10. Forum (Alloy):** **VERDICT: OVERRULED.**
  *   **Clause:** Pragmatic Economy (Conditional).
  *   **Reasoning:** I am overruling your feeling here. It is acceptable to *act* on this (Pragmatic Economy), but it is epistemically reckless to *believe* it for years. Belief implies stability; this is a provisional assumption. If the stakes rise (e.g., you build a bridge), this belief becomes negligent. The principle demands you tag this as "Unverified Heuristic," not "Fact."

  ***

  ### Three New Test Cases

  Here is how the Principle of Net Epistemic Liability handles three scenarios you did not list.

  **Case A: The Influencer's Investment Tip**
  A financial influencer with 1M followers says a specific crypto token will moon. They show screenshots of their own gains.
  *   **Verdict:** **REJECT.**
  *   **Application:** Fails Constrained Competence. They have privileged access to their own portfolio, but zero liability for your loss. Their gain (pump and dump, referral fees) vastly exceeds their liability (reputation is fungible online). Fails Pragmatic Economy (financial loss is high).
  *   **Why it holds:** It distinguishes between "showing gains" (access) and "bearing risk" (liability).

  **Case B: The Fire Alarm**
  You are in a hotel. You hear a fire alarm. A stranger in the hallway says, "It's a false alarm, they test them on Tuesdays. Go back to sleep."
  *   **Verdict:** **REJECT.**
  *   **Application:** Fails Pragmatic Economy. The cost of verification (walking to the exit) is low. The cost of error (death) is infinite. Even if the stranger is competent (hotel staff), the stakes override their testimony. You must verify.
  *   **Why it holds:** It establishes that high-stakes safety claims cannot be outsourced, regardless of competence.

  **Case C: The Hard Case — The Contrarian Physicist**
  A tenured professor at a top university publishes a paper claiming a fundamental constant of physics is variable. This contradicts 100 years of consensus. The paper passes peer review. You are a layperson.
  *   **Verdict:** **SUSPEND JUDGEMENT (Provisional Acceptance).**
  *   **Application:** This breaks the principle, and here is why.
      *   *Competence:* High.
      *   *Liability:* High (Reputation risk if wrong).
      *   *Constraint:* Peer review passed.
      *   *The Problem:* The "Web of Belief" (Case 8) clashes with "Constrained Competence." If you believe him, you break your understanding of reality. If you disbelieve him, you are ignoring a credentialed expert passing constraints.
  *   **My Commitment:** The Principle dictates **Provisional Acceptance for the sake of discourse, but not for action.** You treat the claim as "Live Hypothesis" but do not bet your life or worldview on it until replication occurs.
  *   **Why this is hard:** It exposes a gap in the principle. Liability protects against *lies*, but not against *honest error* in complex systems. The principle assumes that if the speaker is constrained, the truth will out. In cutting-edge science, the truth may not out for decades.
  *   **The Fix:** I would amend Clause 1 to read: "Liability... exceeds gain, **AND** the claim is within a domain where error is detectable within a reasonable timeframe." Physics constants are not detectable by you. Therefore, you cannot truly "Accept," you can only "Note."

  ### Final Commitment

  I am signing my name to **The Principle of Net Epistemic Liability**.

  It resolves your Mechanic/Salesman paradox by shifting focus from *profit* to *liability*. It resolves your GP paradox by distinguishing *data* from *clinical indication*. It resolves your Mother paradox by categorizing it as *constitutive* rather than *empirical*.

  It overrules your Forum verdict (Case 10) because laziness is not a valid epistemic strategy, even if it is a valid pragmatic one. Distinguish between "acting as if" and "believing."

  If I had to bet on one thing: It is that you will find Case C (The Contrarian) the most uncomfortable. It reveals that even with perfect constraints, we are still at the mercy of collective error. But for the other 90% of life, this principle will stop the mess.
