      *   **Constraints:** Do not import framework assumptions as results. Be explicit about translations. No reading lists/references. Be honest about where the translation breaks.
      *   **Running Example:** The user's internal serialization format (2011, 200 services, hard to migrate, converged upon by another team in 2016).
      *   **Hypothesis to Test:** "Path dependence is technical debt at civilizational scale and the whole controversy reduces to whether the benchmark for 'worse' can be measured."

  2.  **Part 1: Translation (The Mapping):**
      *   *Goal:* Restate the debate using SE terms (legacy code, ABI, migration cost, etc.) based on the user's serialization format example.
      *   *Key Concepts to Map:*
          *   Path Dependence $\rightarrow$ Legacy System / Technical Debt accumulation.
          *   Increasing Returns / Network Effects $\rightarrow$ Switching Costs / Integration Surface Area.
