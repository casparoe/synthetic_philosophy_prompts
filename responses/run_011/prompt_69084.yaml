      *   *Rights-Bearer:* It's not the child (otherwise total care matters). It's not the couple (otherwise transferability). It looks like the *individual parent* but instrumentalized for a *societal goal* (gender equality). Or perhaps the *polity* claims a stake in the division of labor.
      *   *Forfeiture:* Why burn the money? To make the constraint binding. If it were transferable, the higher earner (usually dad) would buy the time from the lower earner (usually mom), reinforcing the traditional split. Forfeiture creates a "price" of non-compliance that the couple must pay, signaling the state's commitment.
