answer: |-
  ### Desiderata for a Concept of Socio-Political Termination

  The following ten requirements specify the conditions under which an analyst is entitled to assert that a society $S$ underwent a termination of socio-political complexity over interval $t$. The language avoids value-laden terms to ensure the concept functions as a neutral coding variable.

  **1. Defined Unit of Account**
  *   **Motivation:** In the Terminal Classic Maya, the southern lowlands emptied while the northern lowlands flourished. Labeling "Maya Society" as terminated is incorrect; labeling the "Southern Polity System" as terminated is precise.
  *   **Operationalization:** The coder must specify the spatial boundary (e.g., watershed, political border) and the organizational type (e.g., state, chiefdom, network) prior to measurement.
  *   **Verdict:** **Non-negotiable.** Without a bounded unit, any loss can be countered by pointing to continuity elsewhere.

  **2. Loss of Coordinating Capacity**
  *   **Motivation:** A population can persist while the ability to mobilize labor or resources vanishes. On Rapa Nui, statue carving stopped, indicating a loss of elite coordination, even if households persisted.
  *   **Operationalization:** Cessation of activities requiring supra-household organization (monument construction, long-distance trade of bulk goods, standardized weight systems, administrative record-keeping).
  *   **Verdict:** **Non-negotiable.** This distinguishes the concept from simple population loss due to disease.

  **3. Pre-Event Baseline Reference**
  *   **Motivation:** Analysts often select the peak immediately before the drop as the baseline, ignoring earlier, lower baselines. A system returning to its founding size is not necessarily in a state of loss.
  *   **Operationalization:** The magnitude of loss is measured against the maximum observed capacity within the preceding $n$ years (e.g., 200 years), not the average.
  *   **Verdict:** **School Preference (Cliodynamics).** Some schools prefer comparison to a long-term average to account for normal fluctuation; others insist on peak-to-trough to measure maximum potential lost.

  **4. Compressed Duration**
  *   **Motivation:** A reduction occurring over 500 years is evolution; a reduction occurring over 50 years is an event. The Late Bronze Age eastern Mediterranean changes look different depending on whether one uses a 30-year or 100-year window.
  *   **Operationalization:** The loss of capacity (Req 2) must exceed a threshold (e.g., 50%) within a timeframe less than two generations (approx. 50–60 years).
  *   **Verdict:** **Non-negotiable.** Without rate sensitivity, the concept absorbs all historical change and discriminates nothing.

  **5. Regional Coverage Threshold**
  *   **Motivation:** The destruction of a single capital city (e.g., by raid) is not systemic if the hinterland continues to function under the same rules.
  *   **Operationalization:** The loss of capacity must be observed across a minimum percentage (e.g., 60%) of the Defined Unit of Account's settlements, not just the primary center.
  *   **Verdict:** **Non-negotiable.** This separates systemic termination from localized disaster or decapitation strikes.

  **6. Institutional Termination**
  *   **Motivation:** Dynastic turnover changes the rulers but not the rules. The concept must distinguish between a change in personnel and a change in structure.
  *   **Operationalization:** Specific institutions (tax collection, standing military, codified law, state religion) must cease to operate or lose their binding authority, not merely change leadership.
  *   **Verdict:** **Non-negotiable.** This separates the concept from ordinary political succession.

  **7. Demographic Continuity Allowed**
  *   **Motivation:** Descendant communities often persist after the political structure vanishes. Insisting on population extinction conflates termination with genocide or plague.
  *   **Operationalization:** The presence of continuous occupation layers or genetic/cultural continuity in the same region does not disqualify the classification.
  *   **Verdict:** **Non-negotiable.** This accommodates the "transformation" school of Late Antiquity historians.

  **8. Archaeological Decidability**
  *   **Motivation:** To compare literate and non-literate cases, the criteria cannot rely on texts that describe the agents' feelings or intentions.
  *   **Operationalization:** All data points must be derivable from survey, palynology, faunal remains, mortuary data, or material culture. Textual claims about "ruin" or "darkness" are treated as secondary data, not primary evidence.
  *   **Verdict:** **Non-negotiable.** Required for comparative datasets spanning oral and literate societies.

  **9. Welfare Agnosticism**
  *   **Motivation:** In the stipulated case (see below), household nutrition improved while the state vanished. If improved welfare disqualifies the classification, we cannot distinguish between catastrophe and liberation.
  *   **Operationalization:** Metrics of commoner health (bone pathology, caloric intake, housing quality) are recorded but do not determine the classification of the event.
  *   **Verdict:** **School Preference (Resilience/Ecology vs. Traditionalist).** Traditionalists often link capacity loss to human suffering. Ecologists view capacity loss as a "release phase" which may benefit local subsystems.

  **10. Differentiation from Relocation**
  *   **Motivation:** Moving a capital or shifting a ceramic tradition looks like local abandonment. The system may persist elsewhere.
  *   **Operationalization:** If the coordinating capacity (Req 2) reappears within the Defined Unit of Account (Req 1) or a clearly linked successor unit within one generation, the event is coded as relocation, not termination.
  *   **Verdict:** **Non-negotiable.** This separates the concept from de-urbanization or capital migration.

  ***

  ### Application to Four Cases

  **1. Late Bronze Age Eastern Mediterranean (c. 1200 BCE)**
  *   **Verdict:** **Partial Termination.**
  *   **Application:** The Hittite Empire meets all criteria (Unit: Empire; Capacity: Literacy/Admin lost; Duration: Fast; Coverage: Regional). Mycenaean palaces meet criteria (Capacity: Linear B/Admin lost). Egypt does not meet criteria (Capacity: Reduced but continuous; Institution: Kingship persists).
  *   **Cost:** Requires coding sub-units separately rather than labeling the entire "Bronze Age" as terminated. One cannot say "Civilization ended," only "Specific polities terminated."

  **2. Terminal Classic Southern Maya Lowlands**
  *   **Verdict:** **Termination of Polity System, not Society.**
  *   **Application:** Unit must be bounded to the South. Capacity (monumental dates, dynastic records) ceases rapidly. Regional coverage is high in the South.
  *   **Cost:** Requires explicitly excluding the Northern Lowlands from the Unit of Account. If "Maya" is the unit, the verdict is false. If "Southern Classic Polities" is the unit, the verdict is true.

  **3. Rapa Nui (Easter Island)**
  *   **Verdict:** **Termination of Coordinating Capacity, not Population.**
  *   **Application:** Capacity (statue transport, large-scale organization) ceases. Duration is debated but fits a compressed window relative to the construction phase. Population persists (Demographic Continuity).
  *   **Cost:** Requires accepting that "termination" applies to elite structures even if household adaptation continues. Contradicts narratives that insist on total societal suicide.

  **4. Soviet Union (1989–1991)**
  *   **Verdict:** **Political Termination, not Socio-Political Termination.**
  *   **Application:** Unit: USSR State. Capacity: Central planning/Admin ceased rapidly. Institutions: Communist Party authority ended. However, Coordinating Capacity (market mechanisms, new states) reappeared immediately within the geographic footprint.
  *   **Cost:** Requires distinguishing *State* capacity from *Societal* capacity. If the concept measures "Complexity," the USSR case is a transformation (Req 10), not a termination, because coordination mechanisms (markets, new bureaucracies) replaced the old ones without a prolonged loss of function.

  ***

  ### Application to Stipulated Case

  **Case:** Polity known from survey/pollen. Admin/monuments stop (2 generations). Occupied area falls 50%. Faunal assemblages richer. No war/epidemic/env change.

  *   **Verdict:** **Termination of Socio-Political Complexity.**
  *   **Reasoning:**
      *   Meets Req 2 (Loss of Coordinating Capacity): Admin/monuments stop.
      *   Meets Req 4 (Compressed Duration): Two generations.
      *   Meets Req 5 (Regional Coverage): Area falls 50% (assuming this covers the threshold).
      *   Meets Req 9 (Welfare Agnosticism): The richer faunal assemblage does not disqualify the event.
  *   **Hanging Requirement:** The verdict hangs entirely on **Req 9 (Welfare Agnosticism)**.
      *   If Req 9 were changed to "Welfare Deterioration Required," the verdict would flip to **Transformation/Liberation**.
      *   If Req 9 is held as Agnostic, the event is a termination of the *structure*, regardless of the *benefit* to the survivors. This forces the analyst to admit that structures can end without catastrophe for the commoner.

  ***

  ### Joint-Unsatisfiability Analysis

  You suspected a tension between **Rate-Sensitivity** (Req 4), **Welfare Constraints** (the inverse of Req 9), and **Archaeological Decidability** (Req 8). This suspicion is correct. The following triple is jointly unsatisfiable:

  1.  **Fast Loss:** The event must happen quickly (e.g., <50 years).
  2.  **Suffering Requirement:** The event cannot be classified as termination if commoner material conditions improve (i.e., Welfare must drop).
  3.  **No Self-Understanding:** The classification cannot rely on texts/oral history to determine *intent* (e.g., whether people walked away by choice).

  **Why it breaks:**
  Consider a scenario where a taxing state becomes oppressive. The population abandons the capital rapidly (Fast Loss). They return to subsistence farming, their nutrition improves (Welfare Up), and they leave no texts explaining they left to avoid taxes (No Self-Understanding).
  *   If you enforce **Fast Loss**, it looks like termination.
  *   If you enforce **Suffering Requirement**, it is *not* termination (it's liberation).
  *   If you enforce **No Self-Understanding**, you cannot distinguish this liberation from a scenario where the state was destroyed by invaders and people suffered (where Welfare would likely drop).
  *   Without texts, you only have the bones (Welfare) and the ruins (Rate). If Rate says "Stop" and Bones say "Better," you have a contradiction.

  **Resolution:**
  **Drop the Suffering Requirement.**
  Welfare must be a secondary variable, not a gatekeeper.
  *   **Resulting Concept:** A tool for measuring *structural discontinuity*, not human misery.
  *   **Use Case:** This allows the concept to identify "chosen statelessness" (people walking away from complexity) as a form of structural termination. It forces the analyst to explain *why* the structure ended separately from *whether* it was bad for the people.
  *   **Trade-off:** The concept loses its moral weight. It describes the end of a machine, not necessarily the suffering of the operators.

  ***

  ### Closing Analysis

  **The Workhorse Requirement:**
  **Req 2 (Loss of Coordinating Capacity)** does the most work. It excludes cases of simple population decline (plague), simple dynastic turnover (new king, same system), and simple relocation (capital moves). It forces the focus onto the *ability to organize*, which is the only feature common to Hittite scribes, Maya architects, and Soviet planners. Without this, the concept dissolves into general "hard times."

  **The Rhetorical Requirement:**
  **Req 9 (Welfare Agnosticism)** is the most contentious, but conversely, the requirement often seen in circulation that is purely rhetorical is the **"Irreversibility"** constraint (often phrased as "The society never recovered").
  *   **Why it is rhetorical:** Scholars defend this only because their preferred case (e.g., Rome, Maya) never returned to the exact previous state. However, in ecological resilience theory, a system can "recover" function without returning to the exact previous form. Insisting on irreversibility is often a post-hoc justification to ensure the label "termination" sticks to a specific historical narrative, rather than a measurable property of the data. If a polity loses capacity for 100 years then rebuilds, was it a termination or a hiatus? Defending "Irreversibility" usually relies on the intuition that the *specific* cultural flavor was lost, which violates Req 8 (Archaeological Decidability). It should be weakened to a "Recovery Window" (Req 10 in draft, merged into Differentiation here) rather than permanent extinction.
