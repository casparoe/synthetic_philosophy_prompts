answer: |-
  1. **The Scenario**
  The hospital registry stores patient trial data in a central table where every row is anchored by an internal surrogate key: an integer generated by the storage engine that is never displayed, logged, exported, or linked to any external system. A bulk import loads four hundred new patient records overnight, assigning each a unique key from the engine's private sequence, but the audit trail recording which key matched which patient file was corrupted and lost. The system specification guarantees only that keys are unique and stable for the life of the row; it imposes no rule linking a specific key to a specific patient profile, and every query, report, and constraint in the system operates exclusively on the patient data (name, diagnosis, trial arm) without ever referencing the hidden keys.

  2. **The Transformation**
  Let $K$ be the set of internal keys assigned during the bulk import. Define a map $\phi: K \to K$ that permutes the keys non-trivially (e.g., swapping the key assigned to Patient A with the key assigned to Patient B) while acting as the identity on all keys assigned prior to the import. This is a bijection of the substratum onto itself that is the identity outside the "hole" (the pre-import registry) and non-trivial within it. It is not a global Leibniz shift because the keys for the thousands of existing records remain fixed to their original rows; only the mapping within the imported batch is shuffled.

  3. **Invariance of Evidence**
  The transformation leaves invariant everything the specification and evidence determine because the keys are stipulated to be empirically transcendent. Every SQL query returns the same patient data regardless of which key anchors it. Every foreign key constraint references data columns, not the internal surrogate. The backup catalogue stores the data values, not the physical memory addresses of the keys. Since the specification explicitly decouples the key allocation from the data content, no observable output, constraint violation, or historical log changes under $\phi$. The system behaves exactly as specified in both the original and transformed configurations.

  4. **The Analogue of the Cauchy Problem**
  The "complete data outside the hole" consists of the state of the registry prior to the import plus the complete set of patient data values contained in the four hundred imported records. What remains unsettled is the assignment function mapping those data values to the internal keys. Given the pre-import state and the imported data, the future state of the registry is not uniquely determined: there are $400!$ distinct assignments of keys to patients compatible with all prior data and all laws (constraints). The indeterminism is the claim that the physical state of the database is not fixed by the data and the rules, because the "real" state includes the key assignment.

  5. **Both Readings**
  Identifier-substantivalism holds that the internal keys are the real individuals the registry is about, because they are what the engine physically tracks to maintain row identity across updates. On this view, the state where Key 101 holds Patient A is metaphysically distinct from the state where Key 101 holds Patient B, yielding $400!$ distinct realities. Identifier-relationism holds that the keys are merely structural hooks; the reality is just the pairing of data to rows. On this view, there is only one state: "Patient A is in the registry." The metaphysics does its work at the step of **identity conditions**: the substantivalist asserts that row identity is primitive and carried by the key (haecceity), while the relationist asserts that row identity is derivative of the data and relations.

  6. **The Honest Part**
  The load-bearing feature is the **stipulated empirical inaccessibility** of the substratum. If you remove this and allow keys to be visible, the transformation becomes observable (reports change), and the indeterminism vanishes.
  *   **Reply 1 (Empirical Transcendency):** "Keys are physical charge states in memory; a deep inspection reveals them." This defeats the case here because we could, in principle, read the memory. It would *not* succeed against spacetime points, because manifold points are not physical bits with charge; there is no "deeper inspection" available in principle to tag a point.
  *   **Reply 2 (Benign Indeterminism):** "The indeterminism is real but makes no difference." This succeeds here (who cares which ID holds Patient A?). If accepted in GR, it saves substantivalism but at the cost of admitting that physics describes reality only up to diffeomorphism, which undermines the claim that spacetime points are physically significant individuals.
  *   **Reply 3 (Engineered vs. Law):** "This invariance is a design choice, not a law of nature." This defeats the case here decisively. The database invariance is contingent on human specification. In GR, general covariance is a constraint on the *laws of physics* themselves. If this reply succeeds here, it fails against the original argument, because the Hole Argument derives its force from the fact that the symmetry is forced by the theory, not chosen by a designer.

  7. **Verdict and Limitation**
  Your friend wins on logical form: the schema is valid. You win on physical significance: the schema is inert outside spacetime. The structural feature this setting cannot reproduce is **dynamical coupling**. In general relativity, the substratum (the manifold points) and the field (the metric) are intertwined; the metric determines the causal structure which determines how matter moves. In the database, the keys are static hooks that do not interact with the data; they do not cause the data to be one way or another. This feature is load-bearing in the original Hole Argument because the indeterminism threatens the *evolution* of physical fields, not just the indexing of static records. Without dynamical coupling, the "indeterminism" is merely a redundancy in description, not a failure of the universe to determine its own future.
