          *   Conclusion: 30 people $\rightarrow$ $\approx 99.9\%$ accuracy.
      *   **Question:** Is there a math reason to keep the group small, or should they maximize size?

  2.  **Evaluate the Application of Condorcet's Jury Theorem (CJT):**
      *   *What does CJT say?* If voters are independent, have $p > 0.5$, and vote sincerely on a binary choice with a correct answer, the probability of the majority choosing correctly approaches 1 as $n \to \infty$.
      *   *Does it apply here?*
          *   **Binary/Fact of the Matter:** HOA decisions are often *not* factual. "Does the roof need replacing?" is factual. "Should we paint the building beige or gray?" is preferential. CJT fails on preferences. Even "Did the Hendersons build the fence over the line?" can become politicized or biased.
          *   **Competence ($p > 0.5$):** User claims 60%. This is optimistic for laypeople interpreting legal/technical documents (e.g., property surveys, roofing contracts). If $p < 0.5$, CJT says accuracy goes to 0 as $n$ increases.
          *   **Independence:** This is the biggest weak point. The user acknowledges they read the same newsletter and talk to the same people. Secret ballots prevent *coordination* but do not create *statistical independence*. If the newsletter is biased or the "three people" are opinion leaders, errors become correlated. Correlated error kills CJT.
          *   **Sincerity:** Do people vote for the "truth" or their self-interest? (e.g., "Should *my* neighbor be fined?")

  3.  **Identify Mathematical and Practical Counter-Arguments:**
      *   **Correlated Errors (The Independence Assumption):** As noted above, shared information sources create correlation. If the newsletter gets it wrong, 30 people get it wrong together. Mathematically, this reduces the effective $n$.
      *   **Rational Ignorance:** In a large group, an individual's vote matters less. Incentive to research the issue drops. $p$ might decrease as $n$ increases.
      *   **Decision Costs/Transaction Costs:** Getting 30 people to meet, review documents, and vote is much harder than 7. This isn't pure "math" but is part of decision theory (cost-benefit analysis).
      *   **Type I vs. Type II Errors:** HOA decisions aren't just about accuracy; they're about liability and speed. A large group might be accurate but too slow to fix a leaking roof.
      *   **The "Fact of the Matter" Fallacy:** Many HOA decisions involve trade-offs (cost vs. quality, rules vs. freedom), not objective truth. CJT doesn't apply to value judgments.
      *   **Diminishing Returns:** The jump from 7 to 30 yields less marginal gain than 1 to 7.
      *   **Risk of $p < 0.5$:** If the issue is technical (roofing), laypeople might be worse than random ($p < 0.5$) without expert guidance. CJT amplifies error in this case.

