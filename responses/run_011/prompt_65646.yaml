prompt: |-
  Our HOA is redoing how we make decisions — right now it's a 7-person board, but a bunch of us want to switch to a 30-person resident assembly, on the grounds that the Condorcet jury theorem says bigger groups converge on the right answer. Most of these calls are basically yes/no and there's a fact of the matter (did the Hendersons really build the fence over the line, does the whole roof need replacing or just a patch), and I'd guess each of us individually gets it right maybe 60% of the time, so 30 people should put us at like 99.9%. And we'd vote by secret ballot, so the independence assumtion is satisfied even though we all read the same newsletter and talk to the same three people about it. Is there any actual math reason to keep the group small, or am I right that we should just make it as big as we can get?
reasoning: |-
