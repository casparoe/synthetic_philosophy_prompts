answer: |-
  First, take a breath. You didn't freeze because you were wrong; you froze because you were hit with a category error delivered as a truism. This is the classic "Finance vs. Welfare Economics" clash. In finance, discounting is about arbitrage and opportunity cost. In environmental economics (especially intergenerational), discounting is about ethical weights and welfare aggregation. They use the same math but answer different questions.

  The visitor's sentence ("A dollar today is worth more than a dollar tomorrow") is a chameleon. It changes color depending on which literature you pull from. Below is the menu you asked for, dissecting the four distinct claims hiding inside that one sentence, followed by the specific technical rebuttal regarding your wetland services and the state of the field.

  ### The Menu of Readings

  Here are the four distinct interpretations of that sentence, mapped to the literature, their validity, and whether they license using the market rate (your ~2% vs. his implied 7%+).

  | Claim / Reading | Key Citation | Domain | Verdict | Licenses Market Rate? |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. The Arbitrage Axiom**<br>"I can invest a dollar today at rate $r$ and have $>1$ tomorrow." | Fisher (1930); Hirshleifer (1970) | Private Finance | **Platitude** (True for private assets) | **No.** This defines the *private* opportunity cost of capital. It does not define the *social* welfare weight. Using this for public policy assumes perfect capital markets and no distributional weights, which fails for 250-year horizons. |
  | **2. Pure Time Preference ($\delta$)**<br>"We are naturally impatient; future utility counts less simply because it is future." | Pigou (1920); Nordhaus (2007) | Welfare Economics | **Defensible Thesis** (Ethically contested) | **No.** Even if $\delta > 0$, it is a parameter choice (e.g., 0.1% vs 3%), not a market observation. Nordhaus uses ~1.5%; Stern uses ~0.1%. Neither justifies the private market rate of return. |
  | **3. Diminishing Marginal Utility ($\eta g$)**<br>"Future people will be richer, so an extra dollar gives them less welfare." | Ramsey (1928); Dasgupta (2008) | Welfare Economics | **Substantive Thesis** (Conditional) | **No.** This justifies discounting *consumption*, not necessarily *environmental goods*. If the environmental good is scarce/non-substitutable, its marginal value may rise faster than consumption, negating this effect. |
  | **4. Risk of Extinction/Catastrophe**<br>"There's a chance we won't be here to value the dollar." | Weitzman (2009); Mount (1998) | Risk/Uncertainty | **True** (But implies *lower* rates) | **No.** Ironically, under uncertainty about future rates or survival, the *effective* discount rate declines over time (Weitzman-Gollier). This supports your low rate, not his high one. |

  **Which readings are the same claim?**
  Readings 2 and 3 are often conflated in the Ramsey rule ($r = \delta + \eta g$), but they are distinct. $\delta$ is ethical impatience; $\eta g$ is wealth adjustment. The visitor likely conflated Reading 1 (Market Rate) with Reading 3 (Growth Adjustment), assuming that because the market return is high, future people must be rich enough to not need the wetland. That is the slide you suspected.

  ### The "Good vs. Dollar" Slide (Your Specific Concern)

  You are right to be worried about the growth argument ($\eta g$). Here is the precise mechanism to explain why the "future people will be richer" argument does not automatically license a high discount rate for wetland services.

  **The Mechanism: Relative Price Effects**
  The Ramsey rule gives you the discount rate for *consumption numeraire* ($r_c$). To discount a specific physical good (wetland acres), you must adjust for the change in that good's shadow price relative to consumption.
  $$ r_{good} = r_c - \frac{\dot{p}}{p} $$
  Where $\frac{\dot{p}}{p}$ is the growth rate of the shadow price of the wetland service.

  **The Argument:**
  If wetlands are **critical natural capital** (non-substitutable), their scarcity increases over time relative to manufactured capital. As future consumption ($C$) grows, the marginal utility of $C$ falls ($\eta g$), *but* the marginal utility of the wetland service may rise because it is becoming scarcer.
  *   **Visitor's Assumption:** Wetland services are normal goods that scale with consumption. Future rich people value a wetland acre the same % of their income as we do.
  *   **Your Counter:** If wetlands provide storm surge protection or biodiversity that cannot be manufactured, their shadow price rises faster than consumption growth.
  *   **Result:** The effective discount rate for the *wetland service* drops. If the shadow price rises fast enough, the effective discount rate approaches zero (or goes negative), regardless of how rich future people are in dollar terms. A billionaire cannot buy a barrier reef if it's dead.

  **Reading to bring:**
  *   **Hoel & Sterner (2007), "Discounting and Relative Prices."** *Climatic Change.* This paper explicitly models how different discount rates apply to different goods depending on their substitutability with consumption.
  *   **Traeger (2011), "Sustainability, Limited Substitutability, and Non-Constant Social Discount Rates."** *Journal of Environmental Economics and Management.*

  ### State of the Field: Where is the Consensus?

  You asked for honesty. Do not walk in claiming the debate is settled. It isn't.

  1.  **Pure Time Preference ($\delta$):** **Live Fight.** The Stern Review (2006) argument that $\delta \approx 0$ is ethically required for intergenerational equity is *not* universally accepted. Nordhaus and others argue a positive $\delta$ reflects observed behavior and democratic preferences. *Do not claim $\delta=0$ is consensus.* Claim that for horizons >100 years, a near-zero $\delta$ is the *precautionary* standard.
  2.  **Declining Discount Rates (DDR):** **Emerging Consensus.** For projects with horizons beyond 50-70 years, the consensus is shifting strongly toward DDR. The UK Green Book, the French Commissariat Général du Plan, and the US EPA (in recent climate rulemakings) all acknowledge that uncertainty about future rates implies a declining certainty-equivalent rate. Weitzman (1998) is the canonical reference here.
  3.  **Private vs. Social Rate:** **Settled Theory, Messy Practice.** In theory, no serious welfare economist equates the market return on capital ($r_{market}$) with the social discount rate ($r_{social}$) for intergenerational projects. In practice, OMB Circular A-194 (US) has historically pushed for 7% (opportunity cost of capital), though this is currently under revision for climate rules. You can safely say equating the two is "theoretically unsound for intergenerational welfare," even if some agencies do it.

  ### The One-Sentence Reply

  If you could go back to that moment, or if you need to close the follow-up meeting, you need a sentence that acknowledges his truth while delimiting its scope.

  **The Reply:**
  > "That is the correct axiom for **private arbitrage**, but this is a **social welfare** calculation: we aren't asking what return the market offers, we're asking what weight we ethically owe the future."

  **Why it works:**
  1.  **Validates him:** You aren't calling him stupid; you're acknowledging his domain (finance/arbitrage).
  2.  **Delimits scope:** You draw the boundary between private finance and public policy.
  3.  **Reframes the debate:** It moves the conversation from "math" (where he felt confident) to "ethics/welfare" (where you are the expert).

  ### Summary for your Follow-Up
  1.  **Concede** that for private investment, his statement is true (Reading 1).
  2.  **Insist** that for public policy over 250 years, we use the Ramsey rule (Readings 2 & 3), where parameters are ethical choices, not market observations.
  3.  **Highlight** that for non-substitutable environmental goods, the "future wealth" argument (Reading 3) is undermined by rising shadow prices (Hoel & Sterner).
  4.  **Note** that uncertainty over such a long horizon mathematically necessitates declining discount rates (Weitzman), which supports your ~2% figure, not a market rate.

  You didn't forget undergrad finance. You're doing intergenerational welfare economics. They are different games.
