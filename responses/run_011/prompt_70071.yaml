  **Reader's Report**

  **1. Section 3: The Response-Set Formulation**
  The equivocation is潜在 (potential) in your reconstruction, not in the text, but it is easily resolved. The text assumes strict semantic compliance: a request framed with "horse" is satisfied by any object satisfying the condition *horse*, regardless of pragmatic context (e.g., ritual suitability vs. riding). Your formulation captures the seeking move only if you define R(N) rigidly as "the set of objects satisfying the semantic conditions of N," excluding pragmatic felicity conditions. If you allow R(N) to vary by context (e.g., "horse for a sacrifice"), the set inclusion collapses because a white horse might fail the pragmatic conditions of "horse" in a specific context while satisfying "white horse." To avoid this, you must stipulate that the dialogue operates on semantic satisfaction alone. The text supports this stipulation; it ignores pragmatic context entirely. So, the formulation works, but only if you explicitly block pragmatic intrusion in your definition of R.

  **2. Section 4: The Intersection Constraint**
  You are correct. Nothing in the dialogue argues against the intersection constraint. The Shape-and-Color move asserts that the components are distinct ontological categories (White ≠ Horse), but distinctness of components is logically compatible with the compound's extension being the intersection of the components' extensions. The Seeking move asserts that the response sets diverge, but divergence (proper subset relation) is exactly what the intersection constraint predicts (R(white horse) ⊂ R(horse)). The text asserts the conclusion ("White Horse is Not Horse") without providing a premise that blocks the subset interpretation. You have correctly identified that the text lacks a semantic argument for non-membership; it simply stipulates non-identity.

  **3. Section 5: The Reductio Reading**
  The reductio reading is **not defensible**. It is a modern projection. You are imposing a contemporary debate about compositional semantics onto a text concerned with ontological realism. Gongsun Long is not questioning whether compounds inherit the properties of their parts; he is asserting that "White Horse" names a distinct universal (Shi) from "Horse." The later exchanges on separability are not about semantic composition rules; they are about whether the universal "White" can exist independently of the universal "Horse." Reading this as a query into the intersection constraint anachronistically turns a metaphysician into a semanticist.

  **Replacement Thesis:** The dialogue argues for **Ontological Distinction based on Criteria of Application**. The seeking move demonstrates that because the conditions for satisfying "white horse" differ from "horse," they refer to distinct ontological categories (Universals), not merely different extensions of the same category. The text supports the thesis that distinct criteria of application entail distinct realities, regardless of extensional overlap.

  **4. Misstatements and Smoothing**
  You have artificially separated the Shape-and-Color move from the Seeking move. In the text, these are not two independent arguments where one does the "real work." The Shape-and-Color move provides the metaphysical grounding for the Seeking move. By dismissing the former as merely establishing "different names," you ignore the text's claim that they designate different *qualities* (shape vs. color), which is why the seeking conditions differ. This smoothing makes the Advocate look like he is arguing about language use, when the text presents him as arguing about the nature of reality. Additionally, your paraphrase of the Objector's counter ("membership intuition") is acceptable, but you smooth over the fact that the Objector relies on existential implication ("If there is a white horse..."), which is stronger than mere membership; it is an ontological dependency claim.

  **5. Section 6: Keep or Cut**
  **Cut it.** You admit the sketch "promises more than it delivers." In a 4,000-word paper, you cannot afford a concluding section that undermines your own confidence. The argument stands stronger if you end on the claim in Section 5 (even with the corrected thesis above) rather than trailing off into unresolved semantic costs. The loose end is a problem for a book chapter, not a conference paper.
