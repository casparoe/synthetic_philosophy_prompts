answer: |-
  ### Brainstorming: Divergence Points

  1.  **Status vs. Choice:** Standard autonomy prioritizes the patient's prior choice (advance directive). Relational ethics prioritizes the community's current holding of the patient. If the network refuses to let go, does the prior wish stand? Relational theory suggests personhood is current, not historical. This content must survive; otherwise, the policy is just autonomy with extra steps. The procedure must allow the network to overrule a prior wish if maintaining standing requires it.
  2.  **Exclusion Risk:** The graded view risks declaring non-reciprocating patients (advanced dementia) as "less person." The constitutive view protects them via the network. The procedure must mandate the constitutive view for incapacitated patients to avoid ethical exclusion. We cannot use capacity to determine moral status.
  3.  **Evidence of Relation:** Autonomy uses legal hierarchy. Relational uses care history. The visitor log is dangerous evidence; it quantifies presence but not care. It must be excluded as primary evidence, usable only to prompt inquiry into the *quality* of the relationship, not the frequency.
  4.  **Termination:** Autonomy stops at futility/best interests. Relational stops when the network dissolves. If the network demands ritual completion (e.g., waiting for kin), treatment sustains the *relation*, not the biology. This must be proceduralized even if medically inefficient. The procedure must recognize that death is a social process, not merely a biological event.

  ### 1. The Procedure

  **Goal:** Determine whether treatment sustains or violates the patient's standing in their web of relations.

  1.  **Identify the Active Care Network.** Who currently speaks for the patient's standing? List all claimants (family, friends, caregivers).
      *   *Evidence:* Interviews, chart notes, visitor log (corroborative only).
      *   *Threshold:* At least one person claiming relational responsibility.
      *   *Failure Mode:* No claimants. → *Go to Q4.*
      *   *Judgment:* † Determining who counts as a "caregiver" vs. "visitor."
  2.  **Assess Network Consensus on Standing.** Does the network agree the patient is still "one of us" in a way that requires biological sustenance?
      *   *Evidence:* Direct questioning: "Is she still here with us?" "What does keeping her alive mean to your family?"
      *   *Threshold:* Majority consensus of the Active Care Network.
      *   *Failure Mode:* Deep disagreement within the network. → *Go to Q3.*
      *   *Judgment:* † Weighing the weight of different relationships (e.g., spouse vs. sibling).
  3.  **Resolve Network Disagreement.** If the network disagrees, whose view sustains the patient's standing best?
      *   *Evidence:* History of care provision. Who performed daily care prior to admission?
      *   *Threshold:* The primary historical caregiver's view prevails †.
      *   *Failure Mode:* Caregiver view contradicts wider family consensus on "holding" the patient. → *Escalate to Chair (H).*
      *   *Note:* If the wider network insists on sustenance against the caregiver's report of prior wishes, prioritize the network's current holding of personhood.
  4.  **No Network (The Isolate).** If no family/friends exist, who holds the patient's standing?
      *   *Evidence:* Staff testimony regarding engagement.
      *   *Threshold:* Treating team accepts responsibility as default community.
      *   *Action:* Team decides based on best interests, but must document effort to find community (church, neighbors). → *Escalate to Chair (H)* if withdrawal is considered.
  5.  **Assess Burden vs. Sustenance.** Does the treatment sustain the relation or merely prolong biology against the network's capacity?
      *   *Evidence:* Network's ability to care post-discharge or visit.
      *   *Threshold:* Treatment is recommended only if the network can sustain the resulting life.
      *   *Failure Mode:* Network wants sustenance but cannot care for the outcome. → *Escalate to Chair (H).*
  6.  **Prior Wishes.** How does a prior wish factor in?
      *   *Evidence:* Reported or written statements.
      *   *Threshold:* Treated as data from a past relationship, not a binding command.
      *   *Action:* If the current network refuses to relinquish standing based on a prior wish, the current network's holding prevails.

  **Stop Rule:** Recommendation is written when Q1, Q2, and Q5 are satisfied. If Q3 or Q4 triggers, follow escalation path.

  **Emergency Fast Path:**
  1.  Is there a present caregiver claiming the patient's standing? (Yes/No)
  2.  Does immediate treatment violate their explicit refusal of standing (e.g., "He would not want to be kept like this")? (Yes/No)
      *   *If Yes to both:* Defer to caregiver. *If No:* Treat to sustain standing until full procedure runs.

  ### 2. Explicit Handling of Breakdown Situations

  *   **Relatives Disagree:** The procedure prioritizes the *primary historical caregiver* (Q3). However, if the wider kin network insists the patient remains a full person requiring sustenance (constitutive view), their collective holding can overrule the caregiver's report of the patient's prior autonomous wish. The personhood belongs to the network, not the individual.
  *   **Absent Relatives:** Relatives absent for years have no standing in the Active Care Network (Q1). They may not veto decisions unless they re-engage substantively during the consultation.
  *   **No Relatives/Visitors:** The hospital team becomes the constitutive network (Q4). Withdrawal requires Chair approval (H) to ensure the team is not abandoning the patient due to isolation.
  *   **Prior Wishes:** A prior wish is evidence of a past relationship. It is not binding. If the current network defines the patient's personhood as requiring life, the prior wish is overruled. This explicitly subordinates self-determination to relational standing.

  ### 3. Bedside Form

  **RELATIONAL STANDING CHECKLIST**
  *Complete within 45 mins. Attach to chart.*

  1.  **Who is here for the patient?** (List names & relationship)
      _________________________________________________________
  2.  **Who did the daily care before this illness?** (Name)
      _________________________________________________________
  3.  **Do these people say the patient is still "one of us"?** (Yes/No)
      _________________________________________________________
  4.  **Is there disagreement?** (Yes/No) → *If Yes, call Chair.*
      _________________________________________________________
  5.  **Can the family care for the patient if they wake/survive?** (Yes/No/Unsure)
      _________________________________________________________
  6.  **Did the patient say anything before?** (Brief note)
      _________________________________________________________
      *Note: Family view on standing overrides prior wish if they insist on keeping patient in the community.*

  **Recommendation:** [ ] Continue [ ] Limit [ ] Withdraw
  **Signatures:** ________________________ ________________________

  ### 4. Worked Applications

  **Case 1: The Community vs. The Past Self**
  The procedure identifies the four children as the Active Care Network (Q1). Three siblings insist the mother is "still present" through prayer and gathering; one daughter (caregiver) reports prior wishes to stop. Under Q3, the caregiver's view usually prevails on medical burden, but Q6 dictates that prior wishes are not binding if the network refuses to relinquish standing. The constitutive view holds that her personhood is currently sustained by the three siblings' refusal to let her go. The daughter's report of autonomy is a claim from the past; the siblings' care is a claim from the present. The burden (antibiotics/feeding) is low compared to the relational rupture of withdrawing against the majority kin.
  *Recommendation:* Continue antibiotics and assisted feeding.
  *Sentence to Family:* "Because the majority of your family holds her as fully present, we must sustain her standing in that community for now."
  *(Note: This opposes the user's commitment to self-determination by prioritizing the community's current holding over the patient's prior wish.)*

  **Case 2: The Estranged Network**
  The procedure identifies the neighbor and church member as the sole Active Care Network (Q1); siblings are absent (Q2). The team wants to withdraw based on futility. However, Q2 asks if the network says he is "one of us." The visitors say yes. Q5 assesses burden; dialysis is high burden, but the network objects. Since there is no family to absorb the care burden, the hospital becomes the default network (Q4). Withdrawal requires Chair approval (H) because the existing network objects. The relational view forbids dissolving the network while it actively sustains the patient.
  *Recommendation:* Continue dialysis; escalate to Chair for review of futility vs. relational obligation.
  *Sentence to Team:* "The existing network sustains his standing; we cannot withdraw while they actively claim him."

  **Case 3: The Ritual Delay**
  The procedure identifies the family as the Active Care Network (Q1). They accept biological death is near but claim social death is incomplete (Q2). Q5 assesses burden: three days of ventilation is low burden relative to the relational need to complete rites. The procedure recognizes death as a social process. Sustaining biology for three days sustains the *relation* during the transition. This is not futile; it is ritually necessary.
  *Recommendation:* Continue ventilation for 72 hours to allow rites.
  *Sentence to Family:* "We will sustain the body to allow your community to complete its care of him."

  ### 5. What This Procedure Cannot Do

  1.  **Protect Against Oppressive Communities:** This procedure cannot stop a family from demanding futile treatment to save face or enforce social norms against the patient's likely will. It risks trading individual liberty for communal harmony.
  2.  **Solve the Isolate Problem:** For patients with no network, the procedure defaults to the medical team (Q4). This systematically disadvantages the socially isolated, whose "standing" depends on the goodwill of busy staff rather than kin obligation.
  3.  **Prevent Bureaucratic Capture:** Despite warnings, staff may revert to using the visitor log as a proxy for care (Q1), punishing patients with distant but devoted families.

  **Systematic Error:** No procedure can resolve the metaphysical dispute about when personhood ends; it only manages the social consensus. This procedure systematically mistakes *agreement* for *truth*. It assumes that if the network agrees the patient is "here," then ethically they are. It cannot detect when the network is wrong about the patient's suffering, only when they are inconsistent.
