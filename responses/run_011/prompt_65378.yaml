      *   *Key Constraint:* Don't fudge the gaps. Acknowledge where Dworkin/Objectors fail to explain the nutrition/ventilation split. Acknowledge where *Quinlan* diverges from the philosophical model of ADs.

      *(Self-Correction during drafting)*: I need to be careful not to conflate *Quinlan* (1976) with the later development of the "Living Will." *Quinlan* predates the widespread legal codification of ADs. The philosophical literature (Dworkin's *Life's Dominion* is 1993) is retroactively applied. I must make sure the analysis reflects that *Quinlan* created the doctrine, it didn't apply an existing one.

      *(Refining the PVS vs. Dementia point)*: The user is right to highlight this. In dementia, there is a conflict between earlier critical interests and later experiential interests. In PVS, there are *no* later experiential interests. This makes the "harm to the later self" argument weaker in *Quinlan* than in standard philosophical debates. I need to emphasize this.

      *(Refining the Nutrition Issue)*: The 9 years of feeding is the smoking gun against the "Autonomy" reading. If autonomy governed, feeding should have stopped (she said "no machines," feeding is a machine/procedure). If best interests governed, feeding preserves life (presumed good). The fact they stopped ventilation but kept feeding shows the "Autonomy" label was partial.

