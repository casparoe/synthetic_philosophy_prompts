answer: |-
  ## Session Plan: The Architecture of Failed Predictions

  **Time:** 75 Minutes
  **Resources:** One Whiteboard (divided into three vertical sections), markers.
  **Goal:** Distinguish between *rescue* (illegitimate modification) and *revision* (legitimate updating) by analyzing the structure of conditional claims, using Malthus as the entry point but not the carrying case.

  ---

  ### I. The Order of Operations & Dependencies

  You are correct: students cannot identify a "rescue" until they understand what constitutes the core claim versus the auxiliary conditions. They cannot distinguish core from condition until they see that Malthus's claim was not a simple date-stamped prophecy but a conditional tendency.

  **The Sequence:**
  1.  **Deconstruct Malthus (Structure, not Numbers):** Establish that the claim was *conditional* on "checks," not a fixed date. (Depends on: Students having read the text).
  2.  **Define "Right but Early":** Introduce the phrase as a student hypothesis, then immediately fracture it into three distinct categories. (Depends on: Step 1).
  3.  **The Carrying Case (1900 Horse Manure Crisis):** Apply the three categories to a non-population example to prevent emotional/ideological defense of Malthus. (Depends on: Step 2).
  4.  **Rescue vs. Revision:** Define the boundary using the Case. (Depends on: Step 3).
  5.  **The Asymmetry Caveat:** Briefly address the confirmability problem. (Depends on: Step 4).
  6.  **Transfer Task:** Apply the framework to a new scenario. (Depends on: All previous).

  **Why this order:** If you start with the Case, they will treat it as "another example of Malthus." If you start with "Rescue vs. Revision," they will treat it as a semantic game. You must first break their mental model of what Malthus *said* (Step 1) before you can teach them how to evaluate why it *failed* (Step 4).

  **On the Two-Ratios (Geometric vs. Arithmetic):**
  **Do not open with this.** You are right to doubt it. It invites students to do math rather than logic. It reinforces the idea that Malthus failed because his *numbers* were wrong, rather than his *auxiliary assumptions* (the "checks") changed.
  *   **Placement:** Keep it in your back pocket. Only draw the ratios on the board if a student explicitly argues, "He just got the math wrong." Use it to show that the math was internally consistent, but the *inputs* (the checks) were variable.

  ---

  ### II. The Carrying Case: The 1900 "Great Horse Manure Crisis"

  **The Case:** In 1898, an urban planning conference in New York predicted that by 1950, every street in London and New York would be buried under nine feet of horse manure.
  **Why this case:**
  *   **What it must have:** A clear mechanism (more horses = exponential waste), a specific dated prediction (1950), and a clear reason for failure (the automobile substitution).
  *   **What it must lack:** Moral judgment (unlike population), political ideology (unlike oil/climate), and complex feedback loops (unlike Boserup).
  *   **Job:** It isolates the *methodological* error from the *ideological* baggage. It allows you to say, "The mechanism (waste accumulation) was real. The prediction (buried cities) was false. Was the theorist a crank?"

  **Judgment on Boserup:**
  **Leave her out as a theory.** Introducing Boserup as a counter-thesis ("Population drives tech") creates a "Theory A vs. Theory B" fight. Your goal is "How do we evaluate Theory A?"
  *   **Asset:** Her logic explains *why* the checks changed (necessity drives innovation).
  *   **Liability:** First-years will conflate "Malthus was wrong" with "Boserup was right."
  *   **Decision:** Do not name Boserup. Use her *logic* only as an example of an "Offsetting Cause" in Step 3. If you name her, you spend 15 minutes explaining her demographic thesis. If you use the logic, you spend 2 minutes explaining "price signals drive innovation."

  **Judgment on the Asymmetry ("Right but Early" cannot be confirmed):**
  **Include it, but only in the final 5 minutes of instruction (Minute 65).**
  *   **Reason:** It is a sophisticated point that undermines the "shield." If you introduce it too early, students will decide *all* long-term predictions are meaningless and disengage.
  *   **Placement:** After they have learned to distinguish Rescue from Revision. It serves as a warning: "Even if you successfully revise, you don't get a gold star for being 'early.' You just remain unrefuted."

  ---

  ### III. The Misconception Map & Intercepts

  | Misconception | When it will surface | Where to intercept (Minute) | What to say (The Pivot) |
  | :--- | :--- | :--- | :--- |
  | **"Malthus was wrong because technology happened."** | During Malthus Deconstruct (Min 10) | **Minute 12:** Park it. | "Technology isn't a refutation; it's a *variable*. Malthus knew about 'preventive checks.' Did technology change the *mechanism* (people need food) or the *parameter* (how much food one acre yields)?" |
  | **"Wrong once means wrong forever."** | During Case Intro (Min 35) | **Minute 38:** Challenge it. | "If I predict rain at 2 PM and it rains at 2:15, am I a bad meteorologist? Or did I miss a parameter (wind speed)? We need to know if the *engine* of the theory broke, or just the *fuel*." |
  | **"Right but Early is an all-purpose shield."** | During "Right but Early" breakdown (Min 25) | **Minute 28:** Sharpen it. | "It is not one shield. It is three different claims. We need to sort them. If the mechanism is wrong, 'early' is a lie. If the parameter changed, 'early' is plausible." |
  | **"Conditional theories are unfalsifiable/empty."** (Business Majors) | During Rescue vs. Revision (Min 55) | **Minute 58:** Validate then Limit. | "Valid concern. A theory that explains everything explains nothing. But a theory with *specified* conditions isn't empty; it's a map. We only call it a 'rescue' if you change the map *after* you get lost to pretend you knew the way." |

  ---

  ### IV. Minute-by-Minute Whiteboard Plan

  **Section 1: Malthus Autopsy (00:00 – 00:15)**
  *   **Board Left:** Write "Malthus 1798."
  *   **Action:** Ask: "Did Malthus say 'Starvation in 1850'?" (Students will say yes/no).
  *   **Board:** Draw a box: **Core Mechanism** (Population > Food). Draw an arrow to **Outcome** (Starvation).
  *   **Intervention:** Draw a second box interrupting the arrow: **The Checks** (War, Disease, Moral Restraint, *Technology*).
  *   **Point:** "Malthus did not predict a date. He predicted a *tendency* unless *Checks* intervene."
  *   **Misconception Intercept:** If they say "Tech proved him wrong," write "Tech" inside **The Checks**. "If Tech is a Check, and Tech changed, did the Core Mechanism fail? Or did the Check value change?"

  **Section 2: The "Right but Early" Fracture (00:15 – 00:30)**
  *   **Board Center:** Write "RIGHT BUT EARLY?"
  *   **Action:** Tell them this phrase is a bucket. You need to break the bucket.
  *   **Board:** List three sub-categories:
      1.  Mechanism Right / Parameters Changed (e.g., growth rate slowed).
      2.  Mechanism Right / Offset Unanticipated (e.g., new resource found).
      3.  Claim Undated / Tendency Only (e.g., "Eventually").
  *   **Point:** "Category 3 is not 'Right but Early.' It is 'Unrefutable.' Category 1 and 2 are where the work is."

  **Section 3: The Carrying Case (00:30 – 00:50)**
  *   **Board Right:** Write "1900 Horse Manure Crisis."
  *   **Action:** Briefly narrate: 1898 Conference. Prediction: 9ft manure by 1950. Outcome: Streets clean.
  *   **Group Work (5 mins):** "In pairs, categorize this failure using the three categories on the board. Was the mechanism wrong? Did parameters change? Was there an offset?"
  *   **Discussion:**
      *   *Mechanism:* Horses produce waste. (Still True).
      *   *Parameter:* Number of horses. (Dropped to near zero).
      *   *Offset:* Automobiles.
  *   **Point:** "The 1898 theorists were not cranks. The mechanism was real. The *auxiliary assumption* (horses remain the transport unit) was the failure point."
  *   **Link back to Malthus:** "Is 'Birth Rates fall with income' a change in Mechanism or a Check?" (It's a Check/Parameter).

  **Section 4: Rescue vs. Revision (00:50 – 01:05)**
  *   **Board Center (Erase "Right but Early"):** Write "RESCUE" vs. "REVISION."
  *   **Definition:**
      *   **Revision:** Updating auxiliary assumptions (Checks) based on *new, independent* evidence (e.g., discovering the combustion engine).
      *   **Rescue:** Changing the Core Mechanism *after* the failure to make it fit the data (e.g., "Starvation didn't happen because... souls don't need food").
  *   **Test:** "If the 1898 planners said in 1920, 'We meant *motorized* vehicles produce waste,' is that Revision or Rescue?" (Rescue—they changed the subject).
  *   **Application:** "If a Malthusian says in 2024, 'Malthus meant *carbon* capacity, not food,' is that Revision or Rescue?" (Let them debate. Guide them: Is carbon capacity part of the original Core Mechanism? No. That's a Rescue/Rebranding).
  *   **Misconception Intercept:** Business majors on unfalsifiability. "A conditional claim is falsifiable if the Condition is met and the Outcome fails. If the Condition is *never* met, it remains untested, not unfalsifiable."

  **Section 5: The Asymmetry & Boserup Logic (01:05 – 01:10)**
  *   **Board:** Write "The Asymmetry."
  *   **Point:** "If the catastrophe arrives, can we credit the original theorist?"
  *   **Discussion:** "By the time it arrives, we will have adjusted so many 'Checks' (tech, policy) that we won't know if it was the original theory or our fixes that mattered."
  *   **Boserup Logic:** "Some argue pressure *creates* the solution (Boserup). This is just another 'Check.' It doesn't save Malthus; it complicates the 'Checks' box." (Do not expand further).

  **Section 6: Transfer Task (01:10 – 01:15)**
  *   **Board:** Write the Scenario.
  *   **Task:** Classify and Defend.
  *   **Exit Ticket:** Written response required to leave.

  ---

  ### V. Parts People Usually Forget (Explicit Exclusions)

  **Tell the class this explicitly at Minute 05:**
  "To do this in 75 minutes, we are deliberately ignoring three things you might encounter in a major:"
  1.  **Lakatos/Research Programmes:** "We are not distinguishing 'positive vs. negative heuristics' today. We are using plain English: Core vs. Checks."
  2.  **The Fertility Transition:** "We are not analyzing *why* birth rates fall (demography). We are analyzing *how we classify the prediction* that they wouldn't (methodology)."
  3.  **Duhem-Quine Thesis:** "We are acknowledging that theories aren't tested in isolation, but we are not solving the philosophical problem of *which* assumption failed. We are just sorting *how we react* when one fails."

  **Why:** This prevents students from feeling they are getting a "shallow" version of a deep theory. It frames the limitations as pedagogical choices, not oversights.

  ---

  ### VI. Closing Check for Understanding (Transfer Task)

  **Scenario:**
  "In 2010, a prominent AI researcher publishes a paper: 'At current growth rates in computing power, AI will match human reasoning by 2030, causing mass unemployment.'
  In 2024, AI is advanced, but unemployment has not risen.
  A defender of the 2010 paper says: 'The theory is Right but Early. The computing power arrived, but *regulations* slowed the deployment.'
  A critic says: 'That is a Rescue. You are adding "regulations" now to save the prediction.'"

  **Task:**
  "Classify the defender's move as **Revision** or **Rescue**. Defend your classification in one sentence using the 'Core vs. Checks' distinction from the board."

  **Diagnostic Guide (What wrong answers reveal):**
  *   **If they say "Revision" because "Regulations are real":** They failed to grasp that *timing* matters. (Intervention: "Were regulations part of the original 'Checks' box in 2010, or added in 2024?")
  *   **If they say "Rescue" because "The prediction failed":** They are stuck on "Wrong once = Wrong forever." (Intervention: "Did the Core Mechanism (AI capability) fail, or the Auxiliary (Deployment)?")
  *   **If they say "It's Unfalsifiable":** They latched onto the Asymmetry point too hard. (Intervention: "If unemployment *had* happened, would it have been falsifiable? Then it's not empty.")
  *   **If they focus on AI ethics:** They missed the methodological frame. (Intervention: "Ignore the morality. Look at the structure of the claim.")

  ---

  ### VII. Reasoning for Ordering (Summary for Instructor)

  1.  **Malthus Structure First:** You cannot fix their view of Malthus until they stop reading him as a prophet (Date/Event) and start reading him as a model (Mechanism/Condition). This must happen before introducing the "Right but Early" concept, or they will apply the concept to the wrong object.
  2.  **Case Study Second:** You cannot define "Rescue" abstractly. You need a concrete example where the stakes are low (Horses) to define the boundary before applying it to the high-stakes example (Malthus/Climate/AI).
  3.  **Asymmetry Last:** This is the "poison pill." If you tell them first that "Right but Early" can't be confirmed, they will dismiss the whole session as semantic navel-gazing. It must come after they have learned the *value* of the distinction (Revision vs. Rescue).
  4.  **Boserup Excluded:** Introducing a rival causal mechanism distracts from the methodological goal of analyzing *one* mechanism's resilience. Use the logic, drop the name.

  **Whiteboard Management:**
  *   Do not erase Section 1 (Malthus Structure) until Section 4 (Rescue/Revision) begins. You need the "Core vs. Checks" visual to remain visible while you define Rescue.
  *   Keep Section 3 (Horses) visible during the Transfer Task so they can visually map the AI scenario to the Horse scenario.
