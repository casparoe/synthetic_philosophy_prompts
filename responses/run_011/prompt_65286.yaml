answer: |-
  **TO:** Members of the Research Integrity Appeals Panel
  **FROM:** The Chair
  **DATE:** 24 October 2023
  **SUBJECT:** Preliminary Opinion on Appeal against Finding of Fabrication

  **Introduction**

  This opinion circulates ahead of our hearing next Thursday regarding the appellant's appeal against a finding of fabrication. The Finding Officer (FO) concluded that a doctoral researcher invented data concerning a principal informant. Our Charter stipulates that such a finding must rest on first-hand observation or the testimony of a reliable witness, that absent records constitute no evidence, and that the standard is the balance of probabilities. These constraints are binary and terse. Given that several panel members are familiar with the Nyāya tradition of Indian philosophy, I propose we assess the four evidentiary strands against its classification of the means of knowledge (pramāṇas): perception, inference, comparison, and testimony. This framework offers precise tools to evaluate whether the FO's evidence meets the epistemic conditions required to sustain a charge of misconduct, rather than relying on vague intuitions.

  **Strand One: The Research Assistant and the Perception of Absence**

  The Research Assistant (RA) states she never saw the informant and that notebooks were written in the vehicle. This relies on the perception of absence. In Nyāya, non-perception (anupalabdhi) validates absence only if conditions permit perception were the object present. The RA was in the vehicle; the Head Teacher's late letter suggests interviews occurred in a schoolhouse. If the informant was inside the schoolhouse while the RA remained in the vehicle, her non-perception proves nothing. She was not positioned to perceive the informant even if he existed.

  Furthermore, the RA's statement was recorded eleven months post-fieldwork. Nyāya distinguishes between fresh perception and memory (smṛti). Memory is not an independent means of knowledge; it relies on the validity of the original experience and the fidelity of recall. The notebooks are contemporaneous records of perception; the RA's statement is memorial. The Charter's rule that missing records shall not constitute evidence rests on a similar epistemic caution: we cannot build a positive case on voids. To treat the RA's delayed memory as superior to the appellant's contemporaneous notebooks is to privilege a potentially degraded mental trace over a physical record, violating the Charter's spirit regarding absent corroboration.

  **Strand Two: Timestamps and the Logic of Inference**

  The FO relies heavily on the timestamp pattern: 87% of entries fall within two minutes of the hour, compared to 9–14% in clean datasets. This is an argument from inference (anumāna). For inference to hold, the mark (hetu)—here, the timestamp regularity—must be universally connected to the conclusion (fabrication). This connection is called pervasion (vyāpti).

  We must distinguish three failures of inference. First, the mark might not be established; here, it is established. Second, the mark might not be confined to the class it indicates. The comparison data shows regular timestamps occur in honest work, albeit less frequently. This suggests the mark is not exclusive to fabrication. Third, a mark may be defeated by other knowledge. The Head Teacher's confirmation of interviews on specific dates defeats the inference that the appellant was not working at those times. Consequently, the timestamp anomaly is an inconclusive mark (anaikāntika). It raises suspicion but cannot sustain a finding of fabrication on the balance of probabilities when contrary testimony exists. It indicates poor record-keeping habits, not necessarily invention.

  **Strand Three: The Definition of 'Informant' and Comparison**

  The appellant argues 'informant' denotes an occasional consultant (regional usage), whereas the FO assumed a long-term paid consultant (departmental standard). This is an issue of comparison (upamāna), the means by which we know a thing by its similarity to a known case. The appellant claims the term references a known regional type similar to one encountered in a prior project.

  If the appellant is correct, the FO committed an error of comparison, not merely fact. The FO sought to disprove the existence of a departmental consultant, while the appellant asserted the existence of a regional consultant. In Nyāya terms, the FO failed to fix the reference of the term correctly before attempting to negate its object. You cannot prove the non-existence of a unicorn by showing there are no horses; you must first agree on what is being hunted. If the notebooks never asserted the existence of the person the FO set out to disprove, the charge of fabricating *that* person collapses. The FO's error here is foundational; it invalidates the target of the allegation.

  **Strand Four: Witness Reliability and Testimony**

  Finally, we consider testimony (śabda). The Charter requires a 'reliable witness'. Nyāya defines reliability through two conditions: competence (knowing how things are) and honesty (not wishing to mislead). Both are necessary.

  The RA is competent regarding the fieldwork logistics but potentially dishonest. She has a prior authorship dispute with the appellant, introducing a motive to mislead (hostility). The Head Teacher is likely honest but lacks competence regarding the specific presence of the appellant, admitting he cannot recall who was present. The Charter demands reliability; a witness who knows the truth but may lie is as useless as one who wishes to tell the truth but does not know it. The RA's hostility undermines her honesty; the Head Teacher's memory lapse undermines his competence. Neither provides the unimpeachable testimony required to override the appellant's detailed account, which remains internally consistent and supported by sound earlier publications.

  **Recommendation**

  I recommend that we **allow the appeal and set the finding aside**.

  To dismiss the appeal confirms a finding based on inconclusive inference and compromised testimony, violating the Charter's strict evidentiary rules. To remit the matter for fresh investigation is functionally equivalent to dismissal for the appellant. The deadline for our decision is the eleventh of next month; a reinvestigation would exceed the twenty-working-day window and likely extend for months. The appellant holds a postdoctoral offer that lapses if the finding stands or if the process drags on. A remit therefore costs the appellant their career opportunity just as surely as a dismissal. Allowing the appeal preserves the appellant's position and upholds the Charter's requirement that fabrication be proven by reliable, direct means, not statistical suspicion or hostile hearsay.

  **The Strongest Counter-Consideration**

  The strongest consideration against this recommendation is the statistical improbability of the timestamp data. An 87% regularity against a 14% baseline is stark. To ignore this is to risk absolving a researcher who likely fabricated data, thereby undermining public trust in our university's integrity. One might argue that the balance of probabilities should weigh the statistical anomaly heavily enough to override the procedural defects in the witness testimony.

  However, we must answer this by adhering to the Charter's specific epistemic constraints. The Charter explicitly excludes absence of records and implies a high bar for testimony to protect researchers from conjecture. If we allow statistical inference to substitute for the required observation or reliable testimony, we rewrite the Charter to lower the standard of proof. Procedural integrity requires that we accept the cost of a potentially guilty party going free rather than convicting on evidence the rules expressly deem insufficient. We must uphold the mechanism of justice even when the outcome feels uncomfortable; otherwise, the mechanism itself loses its authority.

  **Conclusion**

  The FO's case conflates suspicious patterns with proof of fabrication. Under the epistemic scrutiny proposed, the evidence fails to meet the necessary conditions for perception, inference, comparison, or testimony. I look forward to discussing this with you on Thursday.
