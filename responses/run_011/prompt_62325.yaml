prompt: |-
  I'm in my final year of a joint philosophy and economics degree, and I co-run the student reading group that's attached to our distributive justice module — about ten of us, mostly second-years, Wednesdays, 75 minutes, in a seminar room where the projector is broken but the whiteboard is decent. Everyone's done one term of probability, nobody's done measure theory, and a couple of them are loudly hostile to utilitarianism, which is kind of the point. Next week's session is Harsanyi's aggregation theorem and I've volunteered to run it as an activity rather than someone reading a proof aloud, because I think the theorem only really lands if you feel yourself getting cornered by it in your own handwriting.

  So: design me a 75-minute activity where the group ends up squeezed into a weighted-sum ranking without anyone telling them that's where they're headed. My instinct, which you should feel free to override, is that they work through a run of binary choices between lotteries over outcomes for a small fixed group of people, with utilities written on cards or slips, paper and pens only, no money involved; their answers get recorded somewhere they can't quietly revise them later (signed sheet? public tally on the whiteboard?); and only at the end do they discover that any set of answers consistent with what they *also* said they accept — unanimity, so that if everybody prefers one option the group ranking has to follow, plus whatever consistency-across-lotteries requirement I need to make them commit to early on — can only be explained as a weighted sum of the individual numbers. I want the actual content: the states, the outcomes, the utility pairs, the exact order of the choices, a minute-by-minute timeline, and a list of what I need to print and cut beforehand. Point out which specific choice is the trap that quietly pins them to summing rather than, say, caring about the spread, and build in a beat where they notice the theorem does not hand them equal weights for free — that's the bit my group will definately get wrong, since they'll assume the conclusion is "add everyone up equally" and then feel like they've refuted it when it turns out not to be.

  Two more things. First, tell me what will predictably go wrong the first time I run it and what I do about it; I already suspect someone will try to rescale one person's utility numbers to get the answer they want, and I'd like a line ready for why that's just choosing different weights. Second, be honest about which feature of the theorem the activity structurally can't reproduce and I'll simply have to assert out loud — my guess is that handing out numbers as though interpersonal comparison were already settled is exactly the question the theorem gets accused of dodging. Relatedly, someone in the seminar last week argued that Harsanyi's result is really only about representing preferences and doesn't get you anywhere near an ethical conclusion about wellbeing, and I only half followed; if that's right, say whether it guts the activity or whether some version of the debrief survives it. And one last thing, which I may have mangled, so correct me if so: my lecturer mentioned that if the people in the case have different beliefs about the probabilities, you can get a setup where everyone unanimously prefers some gamble beforehand and yet afterwards somebody's worse off no matter which state turns up, so unanimity seems to bite at both ends and something has to give. If that's a real tension and it fits in the room, I'd love it as an optional ten-minute extension round; if I've garbled the description, tell me what the actual problem is. Finally, please say how confident you are in the claims you're making about the theorem — especially that the squeeze really does go through without any anonymity assumption — and single out the one point in your design or your debrief that you're least sure of.
reasoning: |-
  Here's a thinking process that leads to the suggested activity design:

  1.  **Analyze the Request:**

      *   **User:** Final year Philosophy & Economics student, co-runs a student reading group (10 people, mostly 2nd years).
      *   **Context:** Distributive Justice module. 75 mins, Wednesdays. Broken projector, decent whiteboard.
      *   **Audience Knowledge:** 1 term of probability, no measure theory. Some hostile to utilitarianism (good for engagement).
      *   **Topic:** Harsanyi's Aggregation Theorem.
      *   **Goal:** Design a 75-minute *activity* (not a lecture) where participants derive/feel the weighted-sum conclusion themselves through binary choices.
      *   **Key Constraints:**
          *   Must feel like they are getting "cornered."
          *   Must use binary choices between lotteries over outcomes for a fixed group.
          *   Utilities on cards/slips, paper/pen only.
          *   Answers recorded publicly/permanently.
          *   Must reveal that consistency + unanimity + independence implies weighted sum.
          *   Must highlight that weights are *not* necessarily equal (crucial distinction).
          *   Must address predictably wrong moves (rescaling utilities).
          *   Must address limitations (interpersonal comparison, representation vs. ethics).
          *   Must address the "Spurious unanimity/Different beliefs" extension (Mongin/Seidenfeld et al. issue).
          *   Must state confidence levels and uncertainties.

  2.  **Deconstruct Harsanyi's Aggregation Theorem:**

      *   *Premise 1:* Individuals have von Neumann-Morgenstern (vNM) preferences over lotteries.
      *   *Premise 2:* The "Social Planner" (or group ranking) has vNM preferences.
      *   *Premise 3 (Pareto/Unanimity):* If everyone prefers $L$ to $L'$, the Social Planner prefers $L$ to $L'$. (Indifference if everyone is indifferent).
      *   *Conclusion:* The Social Planner's utility function is a linear combination of individual utility functions ($W = \sum a_i U_i + b$).
      *   *Crucial Nuance:* The theorem does *not* imply $a_i = a_j$. It just implies linearity. Equal weights require an additional anonymity/symmetry assumption.
      *   *Crucial Nuance 2:* The utilities $U_i$ are vNM utilities (unique up to positive affine transformation). Interpersonal comparison is *not* solved by the theorem; it assumes the scales are already comparable or fixes them exogenously.

  3.  **Designing the Activity (The "Squeeze"):**

      *   *Setup:* Need a small society (3 people: Alice, Bob, Charlie). Need outcomes (A, B, C...). Need lotteries.
      *   *Phase 1: Calibration (15 mins).* Establish individual utilities. Give them cards with numbers. *Correction:* To make the theorem work, we need to fix the scales *for* them, otherwise they will fiddle with scales to avoid the conclusion. I need to assign specific vNM utilities to the "citizens" on the cards.
      *   *Phase 2: The Choices (30 mins).* Present pairs of lotteries.
          *   Choice 1: Unanimous preference (Easy, establishes Pareto).
          *   Choice 2: Conflict (Alice wants X, Bob wants Y).
          *   Choice 3: The "Trap" (Independence of Irrelevant Alternatives / Linearity check). This needs to force the weighted sum.
      *   *Phase 3: The Reveal (20 mins).* Plot their choices. Show that only a weighted sum fits.
      *   *Phase 4: Debrief & Extensions (10 mins).* Weights, Interpersonal Comparison, Different Beliefs.

      *   *Refining the "Trap":* How to force linearity without saying "linearity"?
          *   Use the standard Harsanyi setup: Outcomes are distributions of goods.
          *   Actually, a better pedagogical trick is the "Sure Thing" vs. "Lottery" comparison that mirrors the vNM independence axiom but applied socially.
          *   *Idea:* Give them a baseline lottery $L_0$. Then offer a mix of $L_0$ and a unanimous improvement.
          *   *Better Idea (The "Dutch Book" style for Social Choice):*
              1.  Fix utilities for 3 individuals over 3 outcomes ($x, y, z$).
              2.  Ask for social ranking of $x, y, z$.
              3.  Ask for social ranking of Lotteries over $x, y, z$.
              4.  The constraint comes from the Pareto principle applied to lotteries.
              5.  If Social Welfare Function (SWF) respects Pareto and vNM axioms, it must be linear.
              6.  *The Activity:* Act as the "Social Planner." I will present two lotteries. You must choose. I will record your choice.
              7.  *The Twist:* I will construct lotteries such that if you deviate from the weighted sum, you violate Pareto on a *compound* lottery or violate transitivity/continuity implicitly.
              8.  *Simpler approach for 75 mins:* Give them the Individual Utility Cards. Ask them to determine the "Social Utility" of specific lotteries. Then show that if they want to respect Unanimity, their Social Utility numbers *must* align with a weighted sum of the Individual numbers.
              9.  *Even Better (Active Choice):* They *are* the Social Planner. They face binary choices.
                  *   Scenario: 3 People (1, 2, 3).
                  *   Outcomes: $O_1, O_2, O_3$.
                  *   Utilities are fixed on the board (to avoid rescaling debates during the activity).
                  *   Round 1: Unanimous choice. (Everyone prefers $O_1$ to $O_2$). They choose $O_1$.
