                  *   *The Trap:* Construct $A$ and $B$ such that $A$ is a probability mix of outcomes that, if valued non-linearly (e.g., prioritarian or egalitarian), contradicts a previous choice combined with the Unanimity axiom.
                  *   *Actually, the cleanest way to demonstrate Harsanyi is to show that respecting Pareto over lotteries forces linearity.*
                  *   Let's create a specific numerical example.
                  *   Individuals: $I_1, I_2$.
                  *   Outcomes: $x, y$.
                  *   $U_1(x)=10, U_1(y)=0$. $U_2(x)=0, U_2(y)=10$.
