  ### 3. The "Trap" Mechanics & Scripts

  #### The Specific Trap: Linearity vs. Equality
  The trap is **Round 3** (Lottery vs. Sure Thing with same Expected Utility).
  *   **Scenario:** $L_A$ gives (10, 0) or (0, 10) with 50% chance. $L_B$ gives (5, 5) for sure.
  *   **Individual Utils:** Both individuals are indifferent between $L_A$ and $L_B$ (by construction of the cards).
  *   **Pareto:** Since everyone is indifferent, the Group *must* be indifferent (Strong Pareto).
  *   **The Trap:** If the group prefers $L_B$ because "5,5 is fairer than a gamble," they violate the Pareto principle *applied to vNM utilities*.
  *   **Why?** Because the cards *are* the vNM utilities. If Red is indifferent, Red does not care about the fairness, only the expected utility. If the Group cares about fairness *beyond* what Red and Blue care about, the Group is imposing a preference the individuals do not have.
  *   **The Squeeze:** "You agreed to respect Unanimity. Red doesn't care. Blue doesn't care. Why does the Group care? If the Group cares, the Group is a third person overriding the constituents."

  #### Script: The Rescaling Objection
  *   **Student:** "But Red's '10' might be worth more than Blue's '10'. We should rescale."
  *   **You:** "Exactly. That is what the weights $a$ and $b$ in the formula $W = aU_R + bU_B$ are for. Rescaling Red's utility by 2 is mathematically identical to setting Red's weight $a$ to 2. You haven't escaped the weighted sum; you've just chosen specific weights. The theorem says you *must* use weights. It doesn't tell you *which* ones."

  #### Script: Interpersonal Comparison (The Limitation)
  *   **You:** "I need to be honest. This activity assumed the numbers on the cards were comparable. In reality, measuring Red's happiness against Blue's is the hardest problem in ethics. Harsanyi's theorem doesn't solve that. It says: *IF* you can compare them, *THEN* you must add them linearly. It's a conditional, not a magic wand."

  #### Script: Representation vs. Ethics
  *   **Student:** "This just shows how to aggregate preferences, not what is 'good'."
  *   **You:** "Correct. Harsanyi is often read as 'Utilitarianism is Rational.' A stricter reading is 'If you want to be a rational preference aggregator, you look like a Utilitarian.' It doesn't prove wellbeing *is* utility. It proves that if you treat wellbeing as preference-satisfaction, you sum it. The debrief survives because the theorem forces a choice: either accept the sum, or admit your social planning is irrational (intransitive/violates Pareto)."

  #### Script: Different Beliefs Extension (Spurious Unanimity)
  *   **Setup:** "Imagine Red thinks Heads is 90% likely. Blue thinks Heads is 10% likely."
  *   **Gamble:** "Bet £10 on Heads (Cost £5). Bet £10 on Tails (Cost £5)."
  *   **Red:** Accepts Heads bet (EV +4). Rejects Tails.
  *   **Blue:** Accepts Tails bet (EV +4). Rejects Heads.
  *   **Pareto:** Group accepts *both* bets (since each individual prefers the package of 'My Bet' to 'No Bet'?).
  *   *Correction for Activity:* Keep it simple.
  *   **Gamble G:** Pays £10 if Heads, £0 if Tails. Cost £8.
  *   **Red (90% H):** EV = $9 - 8 = +1$. Accepts.
  *   **Blue (10% H):** EV = $1 - 8 = -7$. Rejects.
  *   *Need Unanimity:*
  *   **Gamble 1:** Pays £10 if Heads. Cost £5. (Red Accepts, Blue Rejects).
  *   **Gamble 2:** Pays £10 if Tails. Cost £5. (Red Rejects, Blue Accepts).
  *   **Package:** Buy Both. Cost £10. Payoff £10 regardless of outcome. Net 0.
  *   **Individual View:** Red thinks Package EV is negative? No.
  *   *Let's use the standard Mongin example:*
      *   State $S_1, S_2$.
      *   Red Prob: (0.9, 0.1). Blue Prob: (0.1, 0.9).
      *   Act $A$: Payoff (10, 0). Red EV: 9. Blue EV: 1.
      *   Act $B$: Payoff (0, 10). Red EV: 1. Blue EV: 9.
      *   Act $C$: Payoff (5, 5). Red EV: 5. Blue EV: 5.
      *   Everyone prefers $A$ or $B$ over $C$? No.
      *   *The Spurious Unanimity:*
      *   Act $X$: Payoff (10, 0).
      *   Act $Y$: Payoff (0, 10).
      *   Red prefers $X$. Blue prefers $Y$. (No Unanimity).
      *   *Okay, the extension is tricky to explain in 5 mins.*
      *   *Simpler Version:* "If you have different beliefs, you can agree on a gamble that makes someone worse off in every state. Harsanyi assumes **Common Priors**. If beliefs differ, Unanimity is dangerous. It might just mean you're betting against each other, not that the gamble is good."
      *   *Decision:* Describe it verbally rather than playing it out to save time. "Imagine you bet on opposite outcomes. You both agree to the bet ex-ante. Ex-post, one of you *must* lose. Unanimity got you a guaranteed loser."

  ---

  ### 4. Predictable Failures & Fixes

  **1. The "We Reject vNM" Revolt**
  *   **Risk:** Students say "Groups aren't people, they don't need to be vNM rational."
  *   **Fix:** Acknowledge this is the main philosophical escape hatch (Sen's critique). But ask: "If the group isn't vNM rational, can we be money-pumped? If yes, are we ethically responsible for wasting resources?" This usually brings them back to the table.

  **2. The "Equal Weights" Assumption**
  *   **Risk:** They assume the theorem proves Utilitarianism (Equal Weights).
  *   **Fix:** In the Reveal, explicitly point to Round 2. "You chose $X$ (Red wins) over $Y$ (Blue wins). That set $a > b$. The theorem allowed that. Anonymity is a separate moral assumption you have to add on top."

  **3. Rescaling During Calculation**
  *   **Risk:** They try to normalize the cards to make the sum work.
  *   **Fix:** "Rescaling is weighting. If you multiply Red's card by 2, you are saying Red counts double. That is a weighted sum. You haven't escaped the theorem."

  ---

  ### 5. Confidence & Uncertainty Statement

  **Confidence Level:** High (90%+) on the mathematical interpretation and the "Weights are not Equal" point. The Harsanyi theorem (1955) and its formalization by Weymark (1991) are standard results. The "Spurious Unanimity" critique (Mongin 1995) is also standard literature.

  **The One Uncertain Point:**
  The pedagogical "squeeze." I am 80% confident that 75 minutes is enough to make them *feel* the contradiction without it feeling like a math lecture. The weak link is the **Social vNM Axiom**. Students often intuitively reject that a *Collective* must satisfy Independence of Irrelevant Alternatives. If they dig in their heels and say "We accept Pareto, but we reject Group Independence," the theorem doesn't go through (this is the basis of Prioritarianism).
  *   **Mitigation:** In the debrief, explicitly validate this. "If you reject Group Independence, you escape the theorem. But you must accept that your group choices can be money-pumped. The theorem forces you to choose between Utilitarianism and Rationality (as defined by vNM)."

  **Regarding the "Different Beliefs" Extension:**
  You described it correctly. It is the **Mongin/Seidenfeld "Spurious Unanimity"** problem. If priors differ, Pareto + vNM implies the social planner can choose an act that is ex-post Pareto inferior (someone loses in every state). This fits in the room as a verbal extension, but do not try to run it as a full game round; it requires tracking states and posteriors which will bog down the whiteboard.

  **Regarding "Representation vs. Ethics":**
  You are right to be cautious. The theorem is about **preference aggregation**, not **wellbeing**. If preferences are adaptive (e.g., oppressed people prefer less), aggregating them faithfully might be unethical. The activity survives this if you frame the conclusion as: "Harsanyi tells you how to be a faithful servant of preferences. It does not tell you if those preferences are worthy of service."

  ### Final Checklist for Wednesday
  1.  **Whiteboard:** Clean it. Mark axes for Red/Blue Utility.
  2.  **Cards:** Pre-cut. Ensure numbers are visible.
  3.  **Marker:** Bring your own (seminar room markers often die).
  4.  **Mindset:** Be prepared to let them "break" the theorem. If they choose to violate vNM to save Equality, *that is a successful outcome*. It means they understand the cost of the theorem. The goal is not to convert them to Utilitarianism, but to show them the price of the axioms.
