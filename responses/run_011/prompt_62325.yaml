      *   *Correction:* The theorem assumes the Social Planner satisfies vNM axioms. I need to make them accept that the *Group* decision needs to be rational (vNM consistent).
      *   *Revised Plan:*
          1.  Establish the "Rationality Contract": The group agrees to make choices that don't cycle and respect dominance.
          2.  Give Individual Utility Cards (fixed scales).
          3.  Present Lotteries.
          4.  Record Group Choice.
          5.  The "Trap": A specific pair of lotteries where an Egalitarian intuition conflicts with the linearity required to maintain consistency with previous Unanimous choices.

  4.  **Addressing Specific Constraints & Questions:**

      *   *Rescaling:* If someone says "Bob's utils are worth twice Alice's," that *is* choosing weights. I need a script for this.
      *   *Interpersonal Comparison:* The theorem assumes utilities are comparable (same scale/zero point) or derives weights relative to the given scales. I must admit the activity assumes the cards are comparable.
      *   *Representation vs. Ethics:* Harsanyi is often read as "Utilitarianism is rational." Critics say it's just "If you want to aggregate preferences consistently, this is the math." It doesn't prove wellbeing is utility. I need to clarify this in the debrief.
      *   *Different Beliefs (Spurious Unanimity):* This is the Mongin/Seidenfeld point. If beliefs differ, Pareto + vNM can lead to ex-post regret. This is a great extension.
      *   *Confidence:* I need to be careful. Harsanyi's theorem *does* require the social preference to satisfy vNM axioms. It does *not* require anonymity (equal weights). I am confident on this. The tricky part is simulating the "squeeze" in 75 mins without getting bogged down in math.

