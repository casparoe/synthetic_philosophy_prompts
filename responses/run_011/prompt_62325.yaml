                  *   Lottery $L_2$: Sure outcome $z$. $U_1(z)=5, U_2(z)=5$.
                  *   If they are indifferent between $L_1$ and $L_2$, they are risk-neutral over social welfare.
                  *   Harsanyi assumes individuals are vNM rational (risk sensitive allowed) but the *Social* ranking must respect Pareto.
                  *   Wait, Harsanyi's theorem says if Individuals are vNM and Social is vNM and Pareto holds -> Social is linear sum of Individual vNM utilities.
                  *   So, I need to force them to make vNM consistent choices as a group.
                  *   *Plan:*
                      1.  Assign fixed vNM utilities to 3 "constituents" (on cards).
                      2.  Group acts as "Parliament."
                      3.  Vote/Decide on Lotteries.
