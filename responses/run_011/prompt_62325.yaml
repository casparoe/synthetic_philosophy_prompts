answer: |-
  Here is a complete 75-minute activity design, including the materials, the script, the mathematical trap, and the debriefing notes you requested.

  ### Activity Title: "The Commitment Board"
  **Goal:** Demonstrate that if a group accepts *Pareto Unanimity* and *Group Rationality* (vNM axioms), they are mathematically committed to a weighted-sum social welfare function, regardless of their egalitarian intuitions.

  ---

  ### 1. Preparation & Materials (Print & Cut)

  **A. The Constituent Cards (Print 3 sets, different colours)**
  You need to fix the utility scales *for* them to prevent rescaling during the game.
  *   **Red Citizen:** Outcome $X=10$, Outcome $Y=0$, Outcome $Z=5$.
  *   **Blue Citizen:** Outcome $X=0$, Outcome $Y=10$, Outcome $Z=5$.
  *   *(Note: These are vNM utilities, already accounting for individual risk attitudes.)*

  **B. The Commitment Sheet (Whiteboard)**
  Draw a large table on the whiteboard. Columns: `Round`, `Option A`, `Option B`, `Group Choice`, `Signed`.
  *   *Rule:* Once a choice is written and signed by the facilitator (you) and a rotating student scribe, it cannot be erased.

  **C. The "Rationality Contract" (Handout or Board)**
  A single sentence the group must agree to before starting:
  > "We agree that as a 'Social Planner,' our group preferences will not be money-pumpable (transitive and independent of irrelevant alternatives) and we will respect Unanimity (if everyone prefers A to B, we prefer A to B)."

  ---

  ### 2. Minute-by-Minute Timeline

  #### 00:00 – 00:10: Setup & The Contract
  *   **Context:** Explain that they are now the "Social Planner" for a society of two people (Red and Blue).
  *   **The Cards:** Distribute the Constituent Cards. Stick them on the board. Explain that these numbers represent *vNM expected utilities*. A lottery of 50% $X$ / 50% $Y$ is worth exactly 5 to Red and 5 to Blue.
  *   **The Contract:** Read the Rationality Contract. Ask for a show of hands. If anyone objects to "Group Rationality" (vNM), challenge them: "If the group makes intransitive choices, we can be exploited for money. Do we want to be exploitable?" (They usually say no).
  *   **Scribe:** Appoint a student to sign the board with you after every round.

  #### 00:10 – 00:25: Round 1 & 2 (Establishing Constraints)
  *   **Round 1 (Unanimity):**
      *   **Option A:** Sure Outcome $Z$ (Utils: 5, 5).
      *   **Option B:** Sure Outcome $Y$ (Utils: 0, 10).
      *   *Ask:* Red prefers A (5>0). Blue prefers B (10>5). **Conflict.**
      *   *Wait, check cards:* Red: $Z=5, Y=0$. Blue: $Z=5, Y=10$.
      *   *Correction for Unanimity:* Let's use a different pair.
      *   **Option A:** Sure Outcome $Z$ (5, 5).
      *   **Option B:** Lottery: 50% $X$, 50% $Y$.
      *   *Calc:* Red Exp: $0.5(10)+0.5(0)=5$. Blue Exp: $0.5(0)+0.5(10)=5$.
      *   *Trap Setup:* In utility space, A and B are identical points (5,5).
      *   *Instruction:* "Record your choice. You must pick one."
      *   *Prediction:* Egalitarians will pick **A** (Sure thing, no inequality risk). Utilitarians will be indifferent but forced to pick, say **A**.
      *   *Action:* Record choice. (Let's assume they pick **A**).

  *   **Round 2 (The Trade-Off):**
      *   **Option A:** Sure Outcome $X$ (10, 0).
      *   **Option B:** Sure Outcome $Y$ (0, 10).
      *   *Ask:* Red wants A, Blue wants B.
      *   *Instruction:* "You must pick one to set the 'exchange rate' between Red and Blue."
      *   *Prediction:* They will likely flip a coin or pick based on need. Let's assume they pick **A** (or record it as Indifferent).
      *   *Crucial Move:* If they pick A, imply Weight(Red) > Weight(Blue). If Indifferent, Weight(Red) = Weight(Blue).
      *   *Action:* Record choice.

  #### 00:25 – 00:45: Round 3 (The Trap)
  *   **Setup:** This is where the squeeze happens. We use the **Independence Axiom**.
  *   **Option A:** 50% Chance of Outcome $X$, 50% Chance of Outcome $Y$. (Exp Utils: 5, 5).
  *   **Option B:** 50% Chance of Outcome $Z$, 50% Chance of Outcome $Z$. (Exp Utils: 5, 5).
  *   *Wait, that's trivial.* Let's make it compound to force the linearity.
  *   **Revised Round 3:**
      *   **Option A:** 50% [Sure Outcome $X$] + 50% [Sure Outcome $Y$].
      *   **Option B:** 100% [Sure Outcome $Z$].
      *   *Math:*
          *   Red: $0.5(10) + 0.5(0) = 5$. vs $5$. (Indifferent).
          *   Blue: $0.5(0) + 0.5(10) = 5$. vs $5$. (Indifferent).
      *   *The Squeeze:* In Round 1, if they preferred $Z$ over the Lottery (because it's "fairer"), they have already violated the vNM assumption for the Social Planner.
      *   *Better Trap:* Use a third outcome $W$ to create a cycle if they deviate.
      *   *Actually, the cleanest squeeze is algebraic.*
      *   **Let's pivot Round 3 to be the "Reveal" setup.**
      *   **Option A:** Lottery $L_1$: 50% $X$, 50% $Y$.
      *   **Option B:** Sure Thing $Z$.
      *   **Instruction:** "Look at Round 1. If you picked $Z$ there because it was 'safer' for the group, you must pick $Z$ here. If you picked the Lottery there, you must pick the Lottery here."
      *   **The Trap:** Most will pick $Z$ (Egalitarian intuition).
      *   **The Check:** Now introduce **Option C**: 50% $X$, 50% $Y$.
      *   Wait, I need to show that picking $Z$ contradicts the *Unanimity* constraint on a *different* lottery.
      *   **Let's use the standard Harsanyi proof logic simplified:**
      *   1. Group accepts Pareto (Unanimity).
      *   2. Group accepts vNM (Independence).
      *   3. Therefore, Group Utility $W$ must be linear in Individual Utilities $U_i$.
      *   **The Activity:** I will ask them to assign a "Social Value" (0-100) to three lotteries.
      *   **Lottery 1:** (10, 0).
      *   **Lottery 2:** (0, 10).
      *   **Lottery 3:** 50% Lottery 1, 50% Lottery 2. (Which is 5, 5 in expectation).
      *   **Constraint:** If you are vNM rational, $Value(L3)$ *must* equal $0.5 \times Value(L1) + 0.5 \times Value(L2)$.
      *   **The Trap:** If they value L3 higher because it reduces inequality (5,5 is better than risk of 10,0), they violate vNM.
      *   **The Corner:** Ask them: "Did you agree to the Rationality Contract (vNM)?" Yes. "Then you cannot value L3 higher than the average of L1 and L2."
      *   "If you value L3 higher, you are saying the Group is risk-averse over *Utility*. But the individuals are already risk-averse in their cards. You are double-counting risk."

  #### 00:45 – 00:60: The Reveal (Whiteboard Algebra)
  *   Draw axes: Red Utility (x), Blue Utility (y).
  *   Plot the outcomes they chose.
  *   Show that if they respected Unanimity and vNM, their "Social Indifference Curves" must be straight lines.
  *   If they chose the Egalitarian option (curved lines), point to the Contract: "You broke the Independence Axiom. You are no longer vNM rational as a group."
  *   **The Weighted Sum:** Show that $W = a U_{Red} + b U_{Blue}$ is the *only* function that produces straight indifference curves in this space.
  *   **The Weights:** Point to Round 2. "You chose $X$ over $Y$. That means $a(10) + b(0) > a(0) + b(10)$. So $a > b$. You just chose a dictatorship of Red, or at least unequal weights. Harsanyi does not give you equality for free."

  #### 00:60 – 00:70: Debrief (Ethics vs. Math)
  *   **Rescaling Objection:** (See script below).
  *   **Interpersonal Comparison:** Admit the limitation. (See script below).
  *   **Representation vs. Ethics:** (See script below).

  #### 00:70 – 00:75: Extension (Different Beliefs)
  *   Run the "Spurious Unanimity" scenario. (See script below).

