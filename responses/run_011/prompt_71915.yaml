  5.  **Drafting the Principle (Iterative refinement):**

      *   *Name:* The **Commensurability Constraint**.
      *   *Core:* Calculation problems arise not from the absence of markets per se, but from the absence of a *shared scalar metric* that accurately reflects scarcity and preference.
