      *   *Critique of this draft:* It's a bit clunky. Let's look for something sharper regarding the *Retailer vs. Gosplan* tension.
      *   *Key Difference:* Walmart faces a **hard budget constraint** and **exit threat**. Gosplan did not.
      *   *Key Difference:* Walmart optimises a **residual claimant's interest** (Profit). Gosplan optimised **political targets**.
      *   *Revised Principle:* **The Discipline of the Residual.**
      *   Planning works when the planner is subject to a hard constraint (bankruptcy, defeat, clinical failure) that validates the calculation. Planning fails when the constraint is soft or political.
