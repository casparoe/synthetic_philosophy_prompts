          *   Firm Admin Prices: Medium fidelity. -> Fine, but Market (Higher fidelity) is Better.
          *   NHS: High fidelity (clinical outcomes), Price would lower fidelity (ability to pay). -> Works without prices.
          *   Prediction Market: Higher fidelity than Director. -> Market wins.

      *   *This looks promising.* It unifies Scale (more scale = noisier feedback?), Knowledge (feedback *is* knowledge), and Incentives (costly to ignore = incentives).
      *   *Actually, let's refine the "Scale" aspect.* Hayek argued scale disperses knowledge. But Walmart is huge. So scale isn't the killer. *Complexity of the Objective* is the killer.
      *   *Final Polish on Principle:* **The Objective-Function Constraint.**
      *   Calculation is possible without market prices *if and only if* the objective function is singular, measurable, and subject to an external validity test. When the objective is pluralistic/subjective (consumer sovereignty), market prices are the only valid calculator.

  6.  **Addressing Specific Requirements:**

      *   *Settled vs. Contested:*
          *   Settled: Mises was right that *pure* socialism (no markets anywhere) faces a calculation problem. Lange was right that *simulated* markets are theoretically possible but practically difficult.
