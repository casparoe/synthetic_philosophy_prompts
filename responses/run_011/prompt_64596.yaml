answer: |-
  Here is the audit.

  ### Verdict on Your Friend
  **They are half-right.**
  *   **On (3) vs. (4):** They are correct. This is a genuine logical friction, not just a nuance. You cannot demand *ceteris paribus* (all else equal) counterfactuals in a system you admit is entangled.
  *   **On "Agency":** They are wrong, but you are being sloppy. "Agency" in history conventionally implies intentionality. Using it for pathogens invites the argument you just had. You don't need to change your ontology, just your vocabulary.

  ---

  ### Tension Audit (Ranked by Severity)

  #### 1. The Methodological Paradox: (3) vs. (4)
  *   **Severity:** **Critical.**
  *   **The Conflict:** (3) sets a condition for proof (hold the rest fixed). (4) states that condition is metaphysically impossible in your domain (complex systems). If (4) is true, (3) makes historical knowledge impossible.
  *   **What Has to Give:** You must downgrade (3). You cannot require *clean* counterfactuals in entangled systems.
  *   **Cheapest Fix:** Change (3) from "holding the rest fixed" to **"isolating the mechanism."** You don't need to pretend the rest of the system didn't exist; you need to trace *how* the shock propagated through the specific institutional structure.
  *   **Cost:** You lose the ability to make precise, quantitative causal claims (e.g., "The plague caused 40% of the wage rise"). You gain robustness but lose precision.

  #### 2. The Epistemic Gap: (5) vs. (4)
  *   **Severity:** **High.**
  *   **The Conflict:** (5) says causation is real (ontological). (4) says the system is too entangled to isolate causes (epistemological). If you can't disentangle the web (per 4), how do you access the "real" causation (per 5) without just telling a story?
  *   **What Has to Give:** Your definition of "Realist." You are currently holding a Humean view of realism (cause = constant conjunction/isolatable variable) while describing a Complex Systems ontology.
  *   **Cheapest Fix:** Shift from **Variance Realism** to **Mechanism Realism.** Causation isn't about isolating variables; it's about identifying the gears turning. The "reality" is the transmission mechanism (e.g., flea bite $\to$ immune collapse $\to$ labor shortage), not the statistical variance.
  *   **Cost:** You must accept that some causal chains will remain opaque because the mechanisms are lost to time.

  #### 3. The Narrative Tension: (1) vs. (6)
  *   **Severity:** **Medium.**
  *   **The Conflict:** (1) says germs are actors. (6) says history should be about people for intelligibility. If germs are true actors, excluding them from the primary narrative makes the history *less* true, even if *more* intelligible.
  *   **What Has to Give:** Your expectation of "intelligibility."
  *   **Cheapest Fix:** Treat (6) as a **pedagogical constraint**, not an ontological one. Acknowledge that human-centric history is a user-interface for human brains, not a map of reality.
  *   **Cost:** You have to admit that "intelligible history" is inherently anthropocentric fiction, even if useful.

  #### 4. The Determinism Trap: (1) vs. (2)
  *   **Severity:** **Low (Apparent Only).**
  *   **The Conflict:** It looks like (1) gives power to germs and (2) gives power to institutions.
  *   **Resolution:** This is standard interactionism. A bullet is a causal force (1), but whether it kills a war depends on the vest (2). No contradiction here.
  *   **Cheapest Fix:** None needed. Keep this. It is your strongest point.

  ---

  ### The Single Revision
  **Revise Claim (3).**

  **Current:** "To show that a non-human force mattered you need contrastive counterfactuals: say what would have happened absent the shock, **holding the rest fixed**."

  **Revision:** "To show that a non-human force mattered, you need **mechanism-based counterfactuals**: show how the shock interacted with specific structures to produce an outcome that would not have occurred via those structures alone."

  **Why this cleans up the most:**
  1.  **Solves (3) vs. (4):** It removes the impossible requirement to "hold things fixed" in a complex system.
  2.  **Solves (5) vs. (4):** It aligns your epistemology (mechanisms) with your realism (causal gears exist).
  3.  **Defangs the Friend:** It sidesteps their claim that you can't run the experiment. You aren't running an experiment; you are tracing a process.

  ### Final Note on "Agency"
  Your friend is guarding the terminological boundary of the historical profession. In history, "actor" $\approx$ "agent with intent." In STS (Science and Technology Studies) or Materialist history, "actor" $\approx$ "thing that makes a difference."

  **Don't fight this battle.** It costs you nothing to concede the word.
  *   **Drop:** "Germs are historical *actors*."
  *   **Adopt:** "Germs are historical *forces* or *actants*."

  This keeps your ontology (1) intact while removing the semantic hook your friend used to hang the "empty words" critique on.
