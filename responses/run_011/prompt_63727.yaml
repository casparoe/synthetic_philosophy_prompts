answer: |-
  Your tentative rule is substantially correct, but it requires sharpening to handle the methodological and causal nuances you identify in cases 5, 6, and 7. The principle that underwrites your valid verdicts and blocks the invalid ones is best articulated as **The Principle of Contextual Variance Partitioning**.

  This principle is not a single claim but a conjunction of constraints on inference. Below, I state the principle clause by clause, link each to your cases, apply it to your eight scenarios, introduce two new cases, and evaluate your verdicts against the settled and contested boundaries of the field.

  ### The Principle of Contextual Variance Partitioning

  **Clause 1 (Relativity):** A heritability estimate is a property of a specific population in a specific range of environments at a specific time. It does not transfer to other populations or environmental ranges.
  *   *Motivated by:* Cases 1 and 3.
  *   *Delivers:* Blocks the inference that a high $h^2$ in one group explains differences relative to another group (Case 1). Validates that the same genotype can yield different variances in different environments (Case 3).

  **Clause 2 (Variance/Mean Distinction):** Heritability describes the proportion of *variance* attributable to genetic variance. It licenses no inference about the causes of the *mean* (the level) of the trait.
  *   *Motivated by:* Cases 2, 3, and 4.
  *   *Delivers:* Blocks the inference that environmental changes are limited by the residual variance (Case 2). Validates that a trait can be 100% heritable yet wholly modifiable by a universal environmental shift (Cases 3 and 4).

  **Clause 3 (Methodological Specificity):** An estimate quantifies the genetic variance captured by the specific method of estimation (e.g., twin correlations vs. SNP relatedness). Different methods estimate different parameters.
  *   *Motivated by:* Case 5.
  *   *Delivers:* Resolves the tension between twin and genomic estimates by treating them as measuring overlapping but distinct constructs (additive common variants vs. total additive genetic variance plus potential confounds).

  **Clause 4 (Mechanism Agnosticism):** Variance components describe statistical associations, not causal mechanisms. They cannot distinguish between passive, evocative, or active gene–environment correlations without auxiliary data.
  *   *Motivated by:* Case 7.
  *   *Delivers:* Validates the view that rising heritability with age is consistent with multiple causal stories (family fade-out vs. active niche-picking).

  **Clause 5 (The Between-Group Gap):** Within-group variance apportionment does not logically license inferences to between-group mean differences, even if measured environments are matched.
  *   *Motivated by:* Cases 1 and 6.
  *   *Delivers:* Blocks the inference that matched measured environments render a between-group difference "probably genetic" without direct genetic evidence.

  **Clause 6 (Predictive Scope):** Only narrow-sense heritability (additive genetic variance) licenses predictions of response to selection (the Breeder's Equation). Broad-sense heritability does not.
  *   *Motivated by:* Case 8.
  *   *Delivers:* Validates the distinction between evolutionary potential and total genetic determination.

  ---

  ### Application to Cases 1–8

  1.  **Verdict: Invalid.** (Clause 1 & 5). Within-group variance ratios say nothing about between-group means.
  2.  **Verdict: Invalid.** (Clause 2). Variance ratios do not constrain mean shifts. A universal environmental change affects the mean, not necessarily the variance.
  3.  **Verdict: Valid.** (Clause 1 & 2). Perfectly illustrates that high within-environment $h^2$ is compatible with large between-environment mean differences.
  4.  **Verdict: Valid.** (Clause 2). Heritability is about variation, not modifiability. If the environment changes uniformly, variance may remain genetic while the mean shifts.
  5.  **Verdict: Refinement Required.** (Clause 3). You state, "I cannot hold both." You *can* hold both if you acknowledge they estimate different parameters. Twin estimates ($h^2_{twin}$) capture additive plus non-additive effects (and potentially shared environment artefacts); SNP estimates ($h^2_{SNP}$) capture only additive effects tagged by common variants. The discrepancy is the "missing heritability" problem, not necessarily a falsification of one method.
  6.  **Verdict: Abandon/Refine.** (Clause 5). This is the most precarious verdict. While intuitively tempting, the consensus among quantitative geneticists is that "everything I can measure" rarely captures all relevant environmental covariance (e.g., systemic biases, niche construction). To infer "probably genetic" requires molecular evidence, not just matched phenotypic environments.
  7.  **Verdict: Valid.** (Clause 4). Variance components alone cannot distinguish the mechanism of the rise (e.g., suppression of shared environment vs. activation of gene–environment correlation).
  8.  **Verdict: Valid.** (Clause 6). Only additive variance is reliably transmitted to offspring in sexual reproduction; dominance and epistasis are broken up.

  ---

  ### Two Further Cases

  **Case 9 (The Flynn Effect):**
  Over the 20th century, population mean IQ rose significantly (approx. 3 points per decade) in nations where heritability of IQ is estimated to be high (0.6–0.8).
  *   *Principle Application:* Clause 2. The high heritability of IQ *within* generations does not preclude large environmental shifts *between* generations. The variance is largely genetic, but the mean shift is wholly environmental.
  *   *Verdict:* Consistent with the principle. High $h^2$ is compatible with massive environmental malleability of the mean.

  **Case 10 (G×E Interaction):**
  A specific allele predicts depression only in individuals exposed to childhood maltreatment; in supportive environments, the allele has no effect. In a population with uniform maltreatment, heritability is high. In a mixed population, heritability is lower.
  *   *Principle Application:* Clause 1. Heritability is sensitive to the range of environments sampled.
  *   *Verdict:* Consistent. The statistic changes as the environmental variance changes, even if the genetic mechanism is constant.

  ---

  ### Evaluation of Your Verdicts

  You asked which verdicts you should refine and which you should abandon.

  **Verdicts to Maintain (1, 2, 3, 4, 7, 8):**
  These align with the settled statistical definition of heritability. Your intuition on Case 7 is particularly astute: variance decomposition is descriptive, not explanatory. It tells you *that* genes matter more in adulthood, not *how* (e.g., whether the child is selecting environments or the family influence is waning).

  **Verdicts to Refine (5):**
  You treat the discrepancy between twin and genomic estimates as a contradiction ("I cannot hold both"). This should be refined. It is settled that $h^2_{twin} > h^2_{SNP}$. This is not necessarily an artefact of the twin design (though that is possible); it may reflect rare variants, structural variants, or non-additive effects that SNPs miss. You should treat the twin estimate as an upper bound of total additive genetic variance and the genomic estimate as a lower bound of common additive variance. Both can be "correct" regarding what they measure.

  **Verdicts to Abandon (6):**
  You write: *"I want to say the residual mean difference is probably genetic, while conceding that 'everything I can measure' is carrying the entire load."*
  This verdict should be abandoned. It violates Clause 5. Even if measured environments are matched, unmeasured environmental factors correlated with group membership (e.g., systemic discrimination, cultural context, maternal health differences not captured by standard metrics) can produce mean differences. Without molecular genetic evidence (e.g., polygenic score differences that survive controls), the inference remains speculative. The "Default Hypothesis" (that between-group differences are as heritable as within-group differences) is a heuristic, not a logical consequence of heritability estimates.

  ---

  ### Settled vs. Contested

  It is vital to distinguish where the mathematics ends and the scientific debate begins.

  **Settled (Consensus):**
  *   **The Logic:** Heritability is a ratio of variances ($\sigma^2_G / \sigma^2_P$). It is specific to the population and environment (Cases 1, 3). It does not explain means (Cases 2, 4, 9). It does not imply immutability (Case 4). Narrow-sense predicts selection; broad-sense does not (Case 8).
  *   **The Gap:** Within-group heritability does not logically entail between-group genetic differences (Case 1). This is a mathematical certainty, not a matter of opinion.

  **Contested (Specialist Disagreement):**
  *   **The Twin–Genomic Gap (Case 5):** *Why* twin estimates exceed SNP estimates is contested.
      *   *View A:* Twin studies overestimate heritability due to violations of the Equal Environments Assumption or non-additive genetic effects masquerading as additive.
      *   *View B:* SNP studies underestimate heritability because they miss rare variants, structural variants, or imperfect linkage disequilibrium.
      *   *Consensus:* Both methods have limitations. The discrepancy is expected, but the precise attribution of the "missing" portion is unresolved.
  *   **The Between-Group Inference (Case 6):** *Whether* matched environments make a genetic explanation probable.
      *   *View A (Sceptical):* Unmeasured environmental covariance is inevitable in human groups; therefore, without molecular proof, genetic explanations for group differences are unwarranted.
      *   *View B (Default Hypothesis):* If known environmental causes are controlled, the prior probability shifts toward genetic causes, analogous to within-group logic.
      *   *Consensus:* The *logic* that within-group $h^2$ proves between-group differences is invalid (settled). The *empirical* likelihood of genetic causes in specific instances (e.g., cognitive test scores) is genuinely contested and depends on one's priors regarding unmeasured environmental confounds.

  ### Summary

  Your gut reactions are largely sound, grounded in a correct understanding that heritability is a description of variance, not a causal explanation of levels. The principle you seek is the **Principle of Contextual Variance Partitioning**.

  To align your framework entirely with current quantitative genetics:
  1.  Accept that twin and genomic estimates measure different slices of genetic variance (refining Case 5).
  2.  Reject the inference that matched measured environments license a "probably genetic" conclusion for group means (abandoning Case 6).
  3.  Maintain the strict separation between variance apportionment and mean differences (Cases 1, 2, 3, 4).

  This preserves the utility of heritability for predicting selection and understanding population structure, while insulating it from the logical fallacies that frequently plague its public interpretation.
