  1. A factory manager must choose between High Production (A) and Low Production (B) while unaware of current Market Saturation (State S1: Saturated, S2: Unsaturated); industry hype acts as a common cause, making High Production highly probable (0.9) in Saturated markets and Low Production highly probable (0.9) in Unsaturated ones, with payoffs of 0 for High/10 for Low in S1 and 20 for High/0 for Low in S2.

  2. EDT calculates the expected utility of each act conditional on itself, yielding 2 for High Production ($0.9 \times 0 + 0.1 \times 20$) and 1 for Low Production ($0.1 \times 10 + 0.9 \times 0$), so it firmly recommends High Production and never shifts because those conditional probabilities are fixed features of the world.

  3. CDT evaluates optimality relative to the beliefs induced by the intention: if the agent intends High, credence in Saturation (S1) rises to 0.9, making Low Production superior ($9 > 2$); if the agent intends Low, credence in Unsaturated (S2) rises to 0.9, making High Production superior ($18 > 1$), creating a perpetual loop where every settled intention recommends its alternative.

  4. The instability is driven entirely by the negative correlation between the act's evidential signal and its causal optimality in that state, and if you hand the agent a market report revealing the true state before they choose, the correlation breaks, beliefs stop shifting with intention, and the cycle collapses into a straightforward state-contingent choice.

  5. A CDT defender can argue that ratifiability is not a requirement for rationality and that agents should maximize causal expected utility using ex-ante priors rather than deliberational updates, but taking that line concedes that CDT deliberately ignores relevant information about the state available through the agent's own dispositions.
