answer: |-
  You have spotted a genuine hole in the vocabulary, and your intuition is sharper than most of the people arguing this on TV. There is no single, common English word for this specific maneuver, which is why it slips past people. Your brother is using a rhetorical trick that relies on the lack of a label.

  Here is the breakdown: the existing technical term, the term you should use in a debate, the ethical principle he is violating, and how to tell the difference between a legitimate change of strategy and this specific sleight of hand.

  ### 1. The Name
  **Technical Term:** *Retrospective Legitimation* (or *Ex Post Facto Justification*).
  **Debate Term:** *The Proportionality Retrofit.*

  "Mission creep" describes the *expansion* of the goal. "The Proportionality Retrofit" describes the *rewriting of the receipt* for what was already spent.

  Use **The Proportionality Retrofit**. It forces the argument onto the math of cost-vs-benefit, which is where this trick hides. It implies that they are taking a bill that was already too high for the original purchase and stapling it to a new, more expensive purchase to make the original bill look reasonable.

  ### 2. The Ethical Principle: Continuous Assessment
  In Just War Theory (the framework your brother is implicitly using), there is a rule called **Continuous Assessment** (or the *Continuity Requirement*).

  Most people think *Jus Ad Bellum* (the justice of going to war) is a door you walk through once. You check the boxes (just cause, proportionality, last resort) at the start, and you're in. That is false. In serious ethical theory, *Jus Ad Bellum* is not a ticket; it is a subscription. It must remain valid *throughout* the conflict.

  **The Rule:** You must assess proportionality *at the time of the action*, based on the objective *at the time of the action*.

  **The Violation:** The Proportionality Retrofit violates the **Temporal Integrity of Proportionality**. It judges Year 1 actions by Year 2 goals. This is ethically incoherent. You cannot justify a risky medical procedure performed on Tuesday to fix a broken finger by saying, "Well, by Thursday we decided we needed to amputate the arm, so the Tuesday risk was worth it."

  ### 3. The Line: Discovery vs. Invention
  You asked for the edge cases. How do you distinguish a government genuinely learning new information from a government cooking the books to cover past costs?

  The line is between **Discovery** and **Invention**.

  *   **Legitimate Adaptation (Discovery):** New intelligence reveals the *original* threat was larger than known.
      *   *Example:* We went in to destroy a chemical lab. Two months in, we capture documents proving that lab was the hub for a network of 50 labs.
      *   *Why it's okay:* The *nature* of the reality changed in our understanding. The goal expands to match the *actual* threat that existed all along. The past casualties are still judged against the "destroy the network" goal, because the network *was* there, we just didn't know it.
  *   **Illegitimate Retrofit (Invention):** The original threat is neutralized or stalemated, so a *new* political goal is adopted to make the past costs seem useful.
      *   *Example:* We went in to destroy the chemical lab. The lab is gone, but the regime is still in power. We announce, "Now we must remove the regime to ensure they don't build a new lab."
      *   *Why it's bad:* The past casualties were incurred to destroy *a* lab, not to topple *a* government. The toppling goal is new. You cannot count the dead soldiers from Month 1 as "costs of regime change" because regime change was not the objective in Month 1.

  **The Test for your Brother:** Ask him: *"If we had known this new goal on Day 1, would we have started the war?"*
  *   If the answer is **Yes**, it's likely legitimate adaptation (the threat was always that big).
  *   If the answer is **No**, it's a Proportionality Retrofit (the goal was inflated to justify the spend).

  ### 4. The Soldier Question
  You asked: *Does the soldier on the other side change status when the aim changes?*

  **Short Answer:** No.
  **Long Answer:** Under standard Just War Theory (the Walzerian view), combatant status is binary. If he is wearing a uniform and carrying a gun, he is a legitimate target regardless of whether his government's war aim is "disarm" or "regime change." His status doesn't fluctuate with the press releases.

  **However:** The *value* of that target changes.
  In Month 1, killing that soldier might have been proportional because he was guarding the chemical lab (high value target relative to "disarm"). In Month 2, if the goal is "regime change," killing that same soldier might still be legal, but the *strategic proportionality* shifts. If the war for "regime change" is unjust (because it wasn't the original cause), then continuing to kill soldiers for *that* new aim becomes the problem.

  The ethical breach isn't about the soldier's status; it's about **using the soldier's death as a sunk cost to buy a new war.**

  ### 5. Borderline Cases (Where it gets muddy)
  To hold your own, you need to know where the line blurs.

  *   **The "Existential Realization" Case:** A war starts to push back a border incursion. During the fighting, it becomes clear the incursion was the first phase of a total invasion. Expanding the aim to "destroy the invading army" is legitimate. This is *Discovery*. The threat escalated in reality, not just in rhetoric.
  *   **The "Failed Deterrence" Case:** A war starts to punish a specific attack. The punishment fails to deter. The government expands the aim to "remove the leadership that ordered the attack." This is the **Borderline**. Is the leadership part of the original threat (Discovery) or a new political objective (Invention)?
      *   *How to argue:* If the leadership was the specific target of the "punishment" all along, it's legitimate. If the leadership only became the target because the punishment didn't work, it's a Retrofit.

  ### 6. Your Cheat Sheet for the Argument
  When your brother makes this move, do not get dragged into the details of the new goal. Keep the focus on the *timing of the accounting*.

  1.  **Name it:** "That's a Proportionality Retrofit. You're judging last year's costs by this year's goals."
  2.  **Invoke the Rule:** "Just War Theory requires continuous assessment. You can't validate Month 1 with Month 12's objective."
  3.  **The Triage Analogy (for him):** "If I start treating a patient for a broken arm, and an hour later I decide to do open-heart surgery instead, I can't claim the risks I took for the arm were justified by the heart surgery. I have to justify the arm treatment based on the arm."
  4.  **The Killer Question:** "If we knew on Day 1 that the goal was [New Big Goal], would we have sent the first soldiers? If not, then their deaths cannot be counted toward that goal."

  ### Summary
  There is no single word, which is why it works. **The Proportionality Retrofit** is the concept. It is illegitimate because it violates the **Continuous Assessment** requirement of Just War Theory. It is distinct from mission creep because it isn't just expanding the mission; it's falsifying the moral ledger of the past.

  You are right to be bothered. It is a form of moral accounting fraud.
