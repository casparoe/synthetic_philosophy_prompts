              *   Choice 2 (Two-Box): Get A + B.
      *   *The "Predictor" Mechanism:* To make it trustworthy without being psychic: The TA uses a **Pre-Class Commitment**.
          *   Step 1: TA generates a list of predictions for all 24 students (randomized or based on a heuristic like "Everyone is a Two-Boxer").
