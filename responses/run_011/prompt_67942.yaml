          *   Step 4: TA reveals the list and salt. Students verify the hash.
          *   *Problem:* If the predictions are random, there's no correlation, and One-Boxing isn't rational.
          *   *Solution:* The TA must claim the predictions are *accurate*. How? "I know this class," or "I used a psychological profile."
          *   *Better:* **The "Common Cause" Simulation.** The prediction is based on a pre-class survey *they actually took*. "Last week you answered a personality quiz. Your prediction is based on that." This creates the *illusion* of correlation required for the dilemma to bite.

  3.  **Drafting the Plan:**

      *   **Materials:** Envelopes, slips of paper, hash printout (or just a sealed master envelope witnessed by a colleague), projector.
      *   **Timing:** 75 mins.
          *   Intro (5)
          *   Round 1 Setup (10)
          *   Round 1 Choice (10)
          *   Round 1 Reveal (10)
          *   Round 2 Setup/Choice/Reveal (15)
          *   Debrief (25)
      *   **Payoff:** Participation points. Let's say 5 points total for the day.
          *   Box A: 1 point.
          *   Box B: 4 points (if filled).
          *   Max score: 5 (One-box + Predicted One-box).
          *   Two-box max: 5 (if predicted One-box).
          *   Two-box min: 1 (if predicted Two-box).
          *   One-box min: 0 (if predicted Two-box).
      *   **The "Trust" Mechanism:**
          *   *Option A:* TA seals predictions in a box. A student signs the seal.
          *   *Option B:* TA uses a "Predictor Bot" (a script run live). But that's Round 2.
          *   *Option C (Winner):* **The Sealed Envelope Wall.** 24 envelopes labeled with names. Sealed with signature/stamp across the flap. A student volunteer verifies they are sealed. TA claims they were filled yesterday based on "vibes/data."
          *   *Why this works:* It shifts the burden. If they think the TA is lying, they two-box to guarantee the 1 point. If they trust the TA, they face the dilemma.
      *   **Round 2 (The Dumb Rule):**
          *   Rule: "Box B has points if your Student ID is even."
          *   This removes the *dependency* on the choice. It becomes a standard decision under risk, not Newcomb's.
      *   **Debrief:** Map the feelings. "Who felt angry at the predictor?" "Who felt like they could outsmart it?"
      *   **Troubleshooting:**
          *   *Accusation of Rigging:* Acknowledge it. That's part of the "causal independence" worry.
          *   *Announcing Choice:* This tries to "force" the prediction. Address it as "backwards causation" fallacy.
          *   *Limitation:* Real Newcomb's requires a predictor *more accurate than chance*. In class, the TA is guessing. The correlation won't exist empirically. The TA has to *stipulate* the accuracy for the thought experiment to hold, or use the Pre-Class Survey method to ensure actual correlation.
          *   *Decision:* **Use the Pre-Class Survey.** It guarantees correlation.
          *   *Revised Plan:*
              *   24 hours prior: Send anonymous survey: "If played today, would you 1-box or 2-box?"
              *   TA uses these answers as the "Prediction."
              *   In class: They play for real.
              *   This creates *actual* correlation, making the Expected Utility argument empirically valid for this specific instance, which is pedagogically gold.

  4.  **Refining the Procedure:**

      *   **Pre-Work:** Send survey.
      *   **Materials:** 24 Envelopes (Box B), 24 Slips (Box A), Master Envelope (The Survey Results).
      *   **Round 1:** "The Psychological Predictor." Use the survey data. Seal the results in a Master Envelope. Students choose. Compare choices to survey.
      *   **Round 2:** "The Algorithmic Predictor." Rule: "Box B is full if you sit in an even-numbered row." (Independent of choice).
      *   **Payoff:**
          *   Box A: 1 Participation Point.
          *   Box B: 4 Participation Points.
          *   Total possible: 5.
          *   If Prediction (Survey) = 1-Box: Box B has 4 pts.
          *   If Prediction (Survey) = 2-Box: Box B has 0 pts.
      *   **Debrief:** Focus on the *tension*.
      *   **What goes wrong:** Students will realize the survey isn't a *prediction* but a *prior commitment*. They might argue "I changed my mind."
      *   **Fix:** Frame the survey as "The Predictor's Model of You."
      *   **Limitation:** The "Predictor" isn't causally independent in the metaphysical sense, but it is temporally prior. This is actually fine for Evidential Decision Theory (EDT) vs Causal Decision Theory (CDT).

  5.  **Addressing Specific Prompt Requirements:**
      *   *Sealed Mechanism:* Master Envelope with student signature across the seal.
      *   *Two Rounds:* Opaque (Survey-based) vs. Transparent (Rule-based).
      *   *Payoff:* Points (10% of participation).
      *   *Debrief:* Map moments to reasoning.
      *   *Troubleshooting:* Rigging accusations, shouting choices.
      *   *Limitation:* The "Accuracy" problem. In real Newcomb's, the predictor is nearly infallible. In class, people lie on surveys or change minds. I need to address this "Accuracy Gap."

  6.  **Final Polish:**
