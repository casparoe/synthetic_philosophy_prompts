answer: |-
  Here is a complete run-sheet for a 75-minute section that turns Newcomb's Problem from a lecture topic into a lived experience.

  ### The Core Design: "The Sealed Correlation"
  You cannot replicate Omega's infallibility in a classroom. If you try to fake it, they will smell the bluff. Instead, you will replicate the **structure of commitment**.

  *   **Round 1 (The Opaque Predictor):** You claim to have predicted them based on a pre-class heuristic (e.g., major, seating, or a confidential survey). The predictions are sealed in a master envelope signed by a student. This forces them to deal with *trust* and *evidential reasoning*.
  *   **Round 2 (The Transparent Rule):** The payoff for Box B is determined by a rule independent of their choice (e.g., Student ID parity). This forces them to deal with *causal independence* and *dominance*.

  ---

  ### 1. Materials List (Prep this weekend)
  *   **24 "Box B" Envelopes:** Plain white, numbered 1–24.
  *   **24 "Box A" Slips:** Small slips of paper, identical to the Box B contents but marked "A".
  *   **Tokens:** Poker chips, colored paper slips, or distinct stickers.
      *   *High Value:* 10 red chips (or slips marked "10 pts").
      *   *Low Value:* 10 blue chips (or slips marked "0 pts").
  *   **The Master Envelope:** A large manila envelope containing the "Prediction Key" (a list matching Student Name/Number to Chip Color).
  *   **A Thick Marker:** For sealing signatures.
  *   **Projector/Board:** To display the Payoff Matrix.
  *   **Choice Cards:** 24 small slips labeled "ONE BOX" and "TWO BOX" for them to hand in.

  ### 2. Payoff Scheme (The Stake)
  You control 10% of their participation grade. Make this day worth **100% of that monthly participation credit**. This is high enough to induce stress, low enough that no one fails the course.

  *   **Box A (Transparent):** Always contains **10 Points**.
  *   **Box B (Opaque):** Contains **100 Points** *IF* you predicted they would One-Box. Contains **0 Points** *IF* you predicted they would Two-Box.
  *   **The Choice:**
      *   **One-Box:** Take Box B only. (Max 100, Min 0)
      *   **Two-Box:** Take Box A + Box B. (Max 110, Min 10)

  *Note: The spread (10 vs 100) is crucial. If Box A is too valuable, dominance wins too easily. If Box B is too valuable, One-Boxing feels like the only sane option.*

  ---

  ### 3. Procedure & Timing (75 Minutes)

  #### **0:00–0:10: Setup & The "Trust" Protocol**
  *   **Action:** Place the 24 numbered "Box B" envelopes on a table at the front. They are sealed.
  *   **Action:** Place the **Master Envelope** (containing the Key) on the board ledge.
  *   **Script:** "Inside these 24 envelopes is either 100 points or 0 points. I determined what is in your envelope *before you entered this room*. I cannot change it. To prove this, I want a volunteer to take this Master Envelope, sign their name across the seal with this marker, and initial the corners."
  *   **Why:** This physicalizes the "past prediction." The student signature makes it a social contract, not just your word.
  *   **Script:** "I am claiming 80% accuracy on these predictions. Whether I actually have it or not, you must decide based on the *possibility* that I do."

  #### **0:10–0:25: Round 1 (The Opaque Predictor)**
  *   **Action:** Hand out Choice Cards. Ask them to write their Name and ID.
  *   **Instruction:** "You have 2 minutes. Choose ONE BOX or TWO BOXES. Hand your card to me. Once I have all cards, I will open the envelopes."
  *   **The Tension:** Do not walk around. Sit at the desk. Look at the Master Envelope. Let them wonder if you are actually looking at their faces to update your prediction (you aren't, but the *uncertainty* is the point).
  *   **Collection:** Collect cards face down. Shuffle them. (This prevents you from matching cards to envelopes in real-time, reinforcing that the prediction is fixed).
  *   **Reveal:** Open the Master Envelope. Read the Key. Distribute the Box B envelopes. Have them open Box A slips.
  *   **Score:** Let them calculate their Round 1 score.

  #### **0:25–0:40: Round 2 (The Transparent Rule)**
  *   **Script:** "Round 1 is over. We reset. Same points (10 for A, 100 for B). But the rule for Box B changes."
  *   **The Rule:** Write on the board: **"Box B contains 100 points IF your Student ID ends in an EVEN number. It contains 0 points IF ODD."**
  *   **Action:** They choose again.
  *   **Reveal:** They check their own ID. They open the envelopes.
  *   **Why:** This removes the "prediction" element. The state of Box B is now causally independent of their choice. It is a standard decision under risk.

  #### **0:40–1:15: The Debrief (The Most Important Part)**
  *   **Do not** write "Causal Decision Theory" vs "Evidential Decision Theory" on the board yet.
  *   **Step 1: The Poll.** "By a show of hands, who Two-Boxed in Round 1? Who One-Boxed?" (Record numbers on board). "Who changed their strategy in Round 2?"
  *   **Step 2: The Interrogation.** Pick specific students.
      *   *To a Two-Boxer:* "You knew the envelope was sealed. You knew I couldn't change it. Why didn't you take the extra 10 points?" (Looking for Dominance reasoning).
      *   *To a One-Boxer:* "You left 10 points on the table for sure. Why?" (Looking for Expected Utility/Trust reasoning).
      *   *To a Switcher:* "What changed between Round 1 and Round 2? The envelopes were the same. The points were the same." (Looking for the correlation vs. causation distinction).
  *   **Step 3: The Reveal.** Now introduce the terms.
      *   "The Two-Boxers in Round 1 were acting on **Causal Dominance**: My choice cannot change the past."
      *   "The One-Boxers were acting on **Evidential Correlation**: If I am the kind of person who Two-Boxes, the envelope is likely empty."
      *   "Round 2 killed the correlation. That's why most of you likely Two-Boxed there."

  ---

  ### 4. Troubleshooting: What Will Go Wrong
  You are right to brace for this. Here is how to handle the specific failure modes of a room of 24 undergrads.

  **1. The "You're Lying" Accusation**
  *   *Scenario:* A student stands up and says, "You didn't fill these beforehand. You're going to fill them based on our cards to make yourself look smart."
  *   *Response:* Do not get defensive. Validate them. "That is the exact rational worry. If you believe I am lying, Two-Boxing is the only rational move. You are protecting your 10 points. But if you believe the seal, the dilemma bites. Which belief did you act on?"
  *   *Why:* This turns their skepticism into data for the debrief. It highlights that Newcomb's requires *trust in the predictor*.

  **2. The "Psychic Signal"**
  *   *Scenario:* A student shouts, "I'm Two-Boxing!" before handing in their card, trying to "force" the envelope to be full.
  *   *Response:* "The envelope is sealed and signed. Your shout cannot reach inside the paper. But notice: you feel like your shout *should* matter. That intuition is the heart of the One-Boxer's position."
  *   *Why:* This exposes the "backwards causation" feeling that makes Newcomb's weird.

  **3. The Accuracy Gap**
  *   *Scenario:* You guessed randomly. The correlation is 50%. One-Boxers don't actually get more points on average.
  *   *Response:* Acknowledge it. "In this specific run, the Predictor was weak. But imagine I was Omega. Imagine I was right 99% of the time. Would you change your choice?"
  *   *Why:* You are teaching the *structure* of the problem, not running a behavioral econ study. The hypothetical accuracy is what matters for the philosophy.

  ---

  ### 5. The Limitation: What You Can't Reproduce
  Be honest with them (and yourself) about this.

  **The Missing Feature: Logical Correlation.**
  In the real Newcomb's Problem, the Predictor doesn't just guess; it simulates *you*. Your decision process and the Prediction share a common logical cause.
  In your classroom, **you are not simulating them.** You are guessing or using a weak heuristic.
  *   **The Consequence:** In Round 1, a Two-Boxer can say, "My choice doesn't *cause* the money to be there, and it doesn't *correlate* with it because the TA is just guessing."
  *   **How to Supply It:** You must explicitly stipulate in the debrief: "In the philosophical problem, the Predictor is accurate *because* it knows how you think. Your choice is evidence of what it predicted. In this room, I am a weak predictor. But ask yourself: If I *were* perfect, would you trust the seal?"

  ### 6. TA Script for the "Flip" (Your Context)
  Since you flipped from Two-Box to One-Box, you might be tempted to nudge them. Don't. Instead, use your experience to frame the debrief.

  *   **Say this:** "I have played this game many times. For years, I took both boxes. It felt like free money. Then I started seeing the problem differently. I'm not going to tell you which way I see it now. I want you to look at the faces of the people who One-Boxed and the people who Two-Boxed. One group feels like they left money on the table. The other group feels like they walked into a trap. Philosophy of rationality is the study of why smart people feel opposite emotions about the same math."

  ### Summary Checklist for Saturday Morning
  1.  **Fill the 24 Box B envelopes** (Mix of 100pts and 0pts—aim for 50/50 to keep it honest, or bias toward 0 to punish Two-Boxers if you want to make a point, but 50/50 is more neutral).
  2.  **Create the Master Key** and seal it in the Manilla Envelope.
  3.  **Bring a thick marker** for the student signature.
  4.  **Print the Payoff Matrix** for the projector.
  5.  **Prepare the "Rigging" Defense:** Remember, their suspicion *is* the lesson. If they don't trust the predictor, Newcomb's Problem dissolves. That is a feature, not a bug.

  This setup ensures they don't just hear about the paradox; they sweat over it. Good luck.
