prompt: |-
  ok so — I TA a first-year philosophy-of-rationality seminar, 24 students, one 75-minute section, and I need a live version of Newcomb's problem that they actually play instead of hearing about. Context for why I care: I was a smug two-boxer for years and flipped about six months ago, and I still cant really articulate what moved me, so I don't want to lecture them toward either answer. I want them to run into it.

  The constraint I keep hitting: the dilemma only bites if the predictor feels trustworthy, and any predictor I can build in a classroom is either (a) me, which is obviously suspect, or (b) some rule they reverse-engineer in ten minutes, which dissolves the whole thing into gaming. So design around that. Two ideas I'd like you to work with: the prediction has to be sealed before anyone chooses, in a way they can physically inspect and still not read — give me the concrete mechanism, envelopes, a locked box, whatever, something I could actually set up this weekend. And I want two rounds: one where the predictor is genuinely opaque to them, and one where it's deliberately a dumb visible rule, so they feel the difference between not being able to beat it and not being able to beat it while knowing exactly why.

  Deliverable: exact procedure with timings for the 75 minutes, the materials list, a payoff scheme in points rather than real money that they'll nonetheless care about (I control maybe 10% of their particpation grade, that's the only genuine stake I can offer), and a debrief that maps specific moments from the room onto the two competing lines of reasoning without me just writing both formulas on the board. Also tell me straight what predictably goes wrong the first time it's run — I'm already bracing for someone accusing me of rigging it and someone else announcing their choice out loud to intimidate the predictor — how to handle those in the moment, and which feature of the puzzle a room of 24 undergrads fundamentally can't reproduce, i.e. the part I'm going to have to supply by hand.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Role:** TA for a first-year philosophy-of-rationality seminar.
      *   **Task:** Design a live, playable version of Newcomb's Problem for 24 students in a 75-minute section.
      *   **Goal:** Let students *experience* the dilemma rather than being lectured. The TA is a converted two-boxer turned one-boxer but wants to remain neutral.
      *   **Key Constraints:**
          *   The predictor must feel trustworthy (not just the TA guessing).
          *   The prediction must be sealed/inspectable but unreadable until after choices are made.
          *   Two rounds: One opaque predictor (trust-based), one transparent/dumb rule (logic-based).
          *   Payoff: Points/participation grade (low stakes but meaningful).
          *   Deliverables: Procedure/timing, materials, payoff scheme, debrief strategy, troubleshooting (what goes wrong), and limitations (what can't be reproduced).

  2.  **Deconstruct Newcomb's Problem for the Classroom:**
      *   *Standard Setup:* Box A (transparent, \$1k), Box B (opaque, \$0 or \$1M). Predictor puts \$1M in B *iff* they predict you take only B.
      *   *Classroom Adaptation:* Needs to be scalable for 24 students. Individual predictions are impossible in real-time without pre-work.
      *   *Solution:* The "Predictor" needs to be a pre-committed algorithm or a statistical aggregate, not a psychic TA.
      *   *The "Trust" Issue:* Students won't trust the TA to have actually made a prediction beforehand.
      *   *The "Sealed" Mechanism:* Needs to be physical. A locked box is good, but *how* is the content determined?
      *   *Round 1 (Opaque):* Use a pre-class survey or a cryptographic hash. A pre-class survey is better for "trust" if handled right. Actually, a *pre-commitment device* is better. Let's use a sealed envelope containing a policy based on *aggregate* behavior or a specific student's profile, but that gets messy.
      *   *Better Idea for Round 1:* The "Omniscient Algorithm." The TA prepares 24 envelopes *before class* based on a specific rule (e.g., student ID parity, or just random but sealed). Wait, if it's random, it's not Newcomb's. Newcomb's requires correlation.
      *   *Best Idea for Round 1 (The "Psychic" TA):* The TA makes predictions *before class* based on something observable but seemingly irrelevant (e.g., seating position, shirt color, or just a gut feeling written down). *Correction:* To make it feel like Newcomb's, the prediction must be *causally* independent but *correlated*.
      *   *Refined Idea for Round 1:* Use a "Pre-Class Survey." Students submit a confidential form 24 hours prior: "What *would* you choose?" The TA uses this as the prediction. In class, they choose again. If they match the survey, they get the "One-Box" payoff. If they deviate, they get the "Two-Box" payoff structure.
      *   *Critique:* Students might lie on the survey.
      *   *Alternative:* The TA acts as the predictor based on a *fixed rule* unknown to them. E.g., "I predicted everyone would one-box." If they one-box, they win big. If they two-box, they win small. But that's just a reward scheme, not Newcomb's.
      *   *The "Sealed Envelope" Solution:* The TA prepares a single master envelope *before class* that dictates the payoff structure for the *group* based on the *majority* choice? No, Newcomb's is individual.
      *   *Scalable Newcomb:* We can't do individual predictions for 24 people in 75 mins without pre-work.
      *   *Compromise:* We treat the *class* as the agent, or we use a "Representative Agent" model.
      *   *Wait, the prompt asks for a mechanism they can inspect.*
      *   *Idea:* **The Hash Commitment.** Before class, the TA generates a random seed or a specific prediction list, hashes it, and posts the hash on the board/LMS. After class, the TA reveals the seed/list. This proves the prediction existed beforehand.
      *   *Even Simpler:* **The Sealed Envelope per Student.** Too much prep.
      *   *Best Practical Solution:* **The "Predictor" is a Pre-Written Script.** The TA writes a policy on a piece of paper, seals it in an envelope, and tapes it to the wall. The policy says: "For any student who chooses Only Box B, I have placed 10 points in their Box B. For any student who chooses Both, Box B is empty." *But* the TA must have actually filled the boxes (or envelopes) beforehand.
      *   *The Trust Gap:* Students will think the TA is lying about what's in the envelopes.
      *   *Fix:* **The Third-Party Predictor.** Use a random number generator seeded by something outside the TA's control (e.g., the closing price of a specific stock yesterday, or the hash of a specific blockchain block). This makes it verifiable and unriggable.
      *   *Wait, Newcomb's requires the prediction to be about **you**.*
      *   *Okay, let's look at the "Two Rounds" constraint.*
      *   *Round 1 (Opaque/Trust):* The TA claims to have predicted them based on a pre-class survey (anonymous). The TA seals the results.
      *   *Round 2 (Transparent/Rule):* The rule is known: "Box B contains points if your Student ID ends in an even number." (This breaks Newcomb's logic but illustrates the "known rule" constraint).
      *   *Actually, the prompt wants Round 2 to be a "dumb visible rule" so they feel the difference.*
      *   *Let's refine Round 1:* The "Black Box." The TA brings a locked briefcase/box. Inside are 24 envelopes, one for each student. Each envelope contains either a "High" token or "Low" token. The TA claims these were determined *before class* based on a prediction of what that specific student would do *in class*.
      *   *Verification:* The TA needs to prove they didn't change them. A witness? A video recording started before class? A cryptographic hash displayed on the projector before anyone enters? **Cryptographic Hash is best.** It's modern, verifiable, and "trustless."
      *   *Payoff:* Participation points. 10% of grade is significant enough.
      *   *Payoff Structure:*
          *   One Box (B): If Prediction = One Box -> 10 pts. If Prediction = Two Box -> 0 pts.
