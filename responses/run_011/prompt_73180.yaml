  6.  **Refining the "Whose Stakes" Point:**
      *   This is crucial. Standard encroachment (Stanley, Fantl & McGrath) focuses on the *subject's* practical interests. In Amara's case, *her* interests are low (salaried, no liability). The *patient's* interests are high.
