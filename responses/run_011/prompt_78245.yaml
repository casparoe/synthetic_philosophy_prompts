  1. **The toast**

  Good evening. Looking around this room, I see three distinct groups. There are the logicians, checking my quantifiers. There are the former students, now scattered across industry, including one who builds language-model agents and who regards the whole debate as settled. And there is the family, who are wondering if there will be cake. Miriam would want me to acknowledge all of you, because her work was always about the limits of knowing who is in the room.

  For thirty-eight years, Miriam pursued a single, stubborn question. Are we machines? Her defence was distinctive. She did not rest on the first incompleteness theorem, but the second. Her recurring claim was that the mechanist thesis, if it is to deliver its conclusion, must licence a degree of self-transparency that no consistent system can have of itself. The honest upshot was a dilemma: either I am not a machine, or, if I am, I can never come to know which one I am.

  She defended this in successive and increasingly careful versions. But in her last decade, she came to think the argument's real interest lay not in its conclusion but in what it exposed. It revealed the idealisation it demanded from finite, error-prone, mortal reasoners to sound, self-transparent ones. Both sides of the debate had been making this idealisation quietly for years. Miriam made it loud. She showed that the price of the argument was pretending we are perfect knowers. This insight bridged the gap between her technical work and her humanity. She understood that we are not formal systems.

  She applied this same suspicion of idealization to her own life. She was famously no friend of physical conjectures about neuronal microtubules. She thought the quantum-gravity story an unnecessary embarrassment that the logical argument did not require. She kept the logic clean. But she was stricter still about her own portrayal. She despised being idealized. She used to make the point that a retirement speech which describes its subject as having been consistent for four decades has described somebody nobody ever met.

  So, I must be careful. I was going to promise that everything I say tonight is consistent. But Miriam taught us that a system cannot verify its own consistency. So I promise nothing of the sort. If I contradict myself later, just assume I am proving her point. The logicians will hear the theorem, the family will hear that I am stubborn, and her granddaughter can be told that sometimes making mistakes proves you are human.

  There are those here who regard the debate as settled against her. She welcomed that. She knew that being finite means being fallible. She was often late, frequently frustrated, and wonderfully inconsistent. She was never the sound system her arguments discussed. She was a colleague who cared more for the truth of the structure than the comfort of the conclusion. She knew that a life lived without error is a life unlived. Her husband and daughters know this best. They lived with the real woman, not the caricature.

  We are not here to celebrate a machine that never erred. We are here to celebrate a reasoner who accepted the cost of being human. We celebrate the revisions, the stubbornness, and the refusal to be turned into a statue. To the errors, the revisions, and the refusal to be idealized. To Miriam.

  2. **What each part is doing**

  The opening acknowledges the tripartite audience explicitly, signaling to the logicians that precision matters, to the students that their divergence is welcomed, and to the family that they belong. The second and third paragraphs accurately reconstruct the technical core (Second Incompleteness Theorem, self-transparency dilemma) and her later meta-philosophical shift (idealization of reasoners). This satisfies the colleagues checking for accuracy while framing the technicality as a human insight for the family.

  The fourth paragraph connects her professional rigour to her personal character, specifically addressing her refusal of physical conjectures without attacking Penrose directly, and pivoting to her refusal of personal idealization. This prepares the structural ground for the joke. The fifth paragraph contains the single required joke. It trades on the impossibility of self-certified consistency. Logicians hear the Gödelian reference; the family hears an affectionate excuse for a speaker's potential errors; the child hears that mistakes are human.

  The final sections reinforce the theme that her value lies in her finitude, not her flawlessness. By celebrating her inconsistencies and lateness, the toast avoids the idealization she despised. The structure mirrors her argument: just as the argument exposes the cost of idealizing reasoners, the toast exposes the cost of idealizing the reasoner herself. The tribute is accurate because it admits her flaws.

  3. **A sceptic's audit**

  A philosopher who believes the Gödelian anti-mechanist argument fails can endorse the following claims in the toast without embarrassment:
  *   "Her recurring claim was that the mechanist thesis... must licence a degree of self-transparency that no consistent system can have of itself." (Reports her view, does not endorse it.)
  *   "The honest upshot was a dilemma..." (Reports the structure of her argument.)
  *   "She came to think the argument's real interest lay not in its conclusion but in what it exposed." (Reports her later meta-philosophical stance.)
  *   "She thought the quantum-gravity story an unnecessary embarrassment..." (Reports her opinion on physics.)

  There are no lines that assert the conclusion of her argument is true. The toast avoids saying "She proved we are not machines" or "The mechanist thesis is false." It consistently attributes the claims to her ("Her defence," "She showed," "She understood"). The line "She showed that the price of the argument was pretending we are perfect knowers" is safe because it refers to the *cost of the argument's assumptions*, not the truth of the conclusion. Even a critic can agree that the debate often relies on idealized models of reasoners. The toast remains neutral on the truth of mechanism, focusing entirely on the integrity of her engagement with the problem and the character she displayed while doing so.

  4. **What I left unsaid**

  I excluded superlatives like "greatest logician of her generation" or claims that she "won" the debate against her critics. I also omitted stories of her brilliance that might suggest she was infallible. She would have counted these as flattery or falsehoods because they violate her own insistence on finitude. Excluding them costs the toast nothing because the affection is generated by acknowledging her humanity—her lateness, her frustration, her inconsistencies. A tribute to a perfect sage would have been a eulogy for a fiction; a tribute to a flawed colleague is a honour to the woman who actually lived here.
