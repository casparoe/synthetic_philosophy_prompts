answer: |-
  While the structural priority of suffering translates cleanly into narrative economy, the ethical framework's reliance on impersonal aggregation and unexperienced harms collapses when subjected to the constraints of focalization, indicating that those claims were never as clear as their confident syntax implies.

  **1. The Asymmetry**
  In craft terms, suffering is *scene* and happiness is *summary*. Pain manifests as immediate action, dialogue, and sensory detail that demands the reader's physiological engagement; contentment manifests as exposition, backstory, or the absence of event. A wound requires a plot; a healed body requires only description. The asymmetry translates to the rule that conflict drives the narrative forward while resolution halts it.
  *[Note: Here the craft mechanic risks conflating with the ethical claim. Because suffering generates scene by definition in narrative structure, translating the ethical asymmetry here inevitably borrows fidelity from the medium's requirement for conflict. This distortion is marked and set aside: the translation holds, but the source of the gravity is ambiguous.]*

  **2. Duty to Relieve vs. Duty to Create**
  This maps onto the distinction between *Need* and *Want*. A character's need (safety, survival, relief from torment) is the spine of the story; a character's want (ambition, romance, joy) is the ornament. The editor's duty is to ensure the Need is addressed before the Want is gratified. To prioritize creating happiness over relieving pain is to write a story where the character decorates the house while it burns down; it violates the hierarchy of urgency that sustains reader trust.

  **3. Priority Structure (Weighting)**
  This translates to *Stakes* and *Reversal*. The stakes are defined by the floor (how much can be lost) rather than the ceiling (how much can be gained). A downward reversal (loss/safety threatened) carries more weight than an upward reversal (gain/safety secured). In the economy of attention, a single paragraph of acute focalized pain outweighs pages of summary contentment because the reader's empathy is triggered by threat, not by abundance. The relief of a threat resolves tension; the addition of a benefit merely extends it.

  **4. The Extinction Objection**
  In narrative terms, the strict obligation to end all sentient life painlessly translates to *The End*. The only way to guarantee zero conflict is to cease the narrative. If the goal is the elimination of suffering, the perfect story is the one not written, or the one that concludes with the death of the focalizer without residue. To continue the story is to admit that something other than the absence of pain is being valued (e.g., the telling itself).

  **5. Standard Repairs**
  These translate to *Revision* and *Pacing*. We do not cut all happiness, but we subordinate it. Joy is permitted as respite between conflicts, or as texture to deepen the impact of subsequent loss, but never as the structural resolution. A pluralistic ethics where happiness counts but does not offset suffering becomes a pacing strategy: happy scenes are allowed, provided they do not negate the gravity of the pain scenes. They count as breath, not as plot.

  **Residue Report**

  **Claim 1 (Asymmetry):** Came across intact, but at the price of a distortion. The distortion is *Medium Bias*: narrative form requires conflict to exist, so pain is structurally privileged regardless of moral truth. It is impossible to tell if the asymmetry feels self-evident because it is moral or because it is dramaturgical.

  **Claim 2 (Duty to Relieve):** Came across intact. The hierarchy of Need over Want is a stable equivalent for the hierarchy of relief over creation.

  **Claim 3 (Priority Structure):** Came across intact, but at the price of a distortion. The distortion is *Focalized Intensity*: craft weights pain heavily because it is felt by a specific consciousness in real-time, not because it is objectively heavier. The translation captures the weight but changes the source from moral magnitude to psychological immediacy.

  **Claim 4 (Extinction):** Came across intact, but reveals a category error. In ethics, this is a moral obligation; in craft, it is a formal cessation. The translation holds, but it exposes that the ethical claim treats existence as a story that can be closed, whereas ethics usually treats existence as a state that persists.

  **Claim 5 (Standard Repairs):** Came across intact. The subordination of happiness to pain in revision is a precise functional equivalent to negative prioritarianism.

  **General Failures (Aggregation, Possible People, Unexperienced Harm):**
  These have no expression in craft terms at all.
  *   **Impersonal Aggregation:** Craft operates through *focalization*. You cannot sum the suffering of a hundred thousand lives unless you focalize them one by one, which collapses the aggregate into a sequence of singulars. The "utility monster" in fiction is simply the protagonist; there is no mechanism to weigh the background extras against the lead except by making them leads.
  *   **Merely Possible Future People:** Craft deals in *actual* scenes. A character who does not appear does not exist. There is no equivalent to "potential people" except unwritten sequels, which carry no moral weight in the current manuscript.
  *   **Unexperienced Harm:** If a harm occurs outside the focalizer's awareness and is not shown, it has not happened in the narrative world. Craft cannot register a harm that is not felt or witnessed.

  **Judgement on Failure**
  The failure falls on the side of the ethical claims. The vocabulary of craft does not miss something ethics genuinely needs; rather, focalization exposes that impersonal aggregation and unexperienced harms rely on abstractions that dissolve when grounded in specific experience. The confident syntax of "a hundred thousand lives" implies a summing operation that no consciousness actually performs. When forced into the vocabulary of scene and focalization, these claims reveal themselves as metaphors lacking a referent. The craft terms do not obscure the ethics; they strip away the algebraic shorthand that allows the ethics to ignore the singular body.
