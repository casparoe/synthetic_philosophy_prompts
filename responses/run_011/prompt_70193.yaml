answer: |-
  Here is the exposure map. You have built a fortress of Causal Closure + Epistemic Emergence. It is defensible, but it bleeds at the joints where *explanatory power* is conflated with *causal power*.

  ### 1. Ranked Defeaters

  **1. Interventionist Screening-Off (Fatal to b)**
  *   **The Hit:** If high-level variables (simmballs) screen off low-level variables (neurons) in a causal model, then the low-level details are causally irrelevant to the outcome. If I change the symbol (via any of its physical realizations) and the behavior changes, but I change the specific neuron firing pattern and the behavior *doesn't* change (because a different neuron could have done the job), the symbol is the cause, not the substrate.
  *   **Why it hurts:** It turns your "epistemic limitation" (b) into a metaphysical error. It's not that we *can't* write the substrate story; it's that the substrate story contains irrelevant noise. The causal work is done by the *constraint* (the symbol), not the *stuff*.
  *   **Target:** Primarily (b), secondarily (c).

  **2. The Stability/Chaos Argument (Fatal to b)**
  *   **The Hit:** This is your "Careenium-chaos" case (detailed below). If the micro-level is chaotic and the macro-level is stable, the macro-level supports counterfactuals that the micro-level *cannot* support. A cause must support counterfactuals. If the micro-state $m_1$ leads to $m_2$ but $m_1 + \epsilon$ leads to $m_{99}$, $m_1$ is not a robust cause of the macro outcome. The macro state $S_1$ *is* a robust cause of $S_2$.
  *   **Why it hurts:** It proves the indispensability is ontological, not epistemic. The world itself is structured such that the high-level description captures the causal grain better than the low-level one.
  *   **Target:** (b).

  **3. The Vacuous Disjunction (Severe to a)**
  *   **The Hit:** Your "Substrate-scrambler" case. If the physical realization of a symbol is constantly shuffled, the "cash out" in (a) becomes a disjunction of every possible physical state that could realize that symbol. If that disjunction has no physical natural kind status (no shared laws except "realizes symbol X"), then claiming it "does the pushing" is empty. It's like saying "The winning lottery ticket caused the wealth" and cashing it out as "Either ticket #492 or #103 or #888... caused the wealth."
  *   **Why it hurts:** It renders (a) technically true but explanatorily dead. If the "cash out" has no projectible laws of its own, it isn't a causal story; it's a list.
  *   **Target:** (a).

  **4. Evolutionary Epiphenomenalism (Awkward to b)**
  *   **The Hit:** If simmballs don't push, why did evolution build a brain that tracks them? Evolution selects for behavior. If behavior is fully determined by ions, and symbols are just froth, then the *content* of the thought is invisible to selection. A system that thinks "I am in danger" and a system that thinks "I am in paradise" but has the same ion flux would behave identically.
  *   **Why it hurts:** It makes the reliability of our reasoning a miracle. We reason using symbols. If symbols don't cause behavior, why does reasoning work?
  *   **Target:** (b).

  ---

  ### 2. The Standard Moves: Honest Concessions

  **Exclusion Arguments (Kim-style)**
  *   **The Move:** If the physical is causally closed, and the mental is distinct, the mental is excluded.
  *   **Your Defense:** You embrace this. Symbols are excluded.
  *   **The Catch:** The exclusion argument applies recursively. If neurons are composed of atoms, and atoms of fields, then neurons are also "froth."
  *   **Smart Defender Concession:** You must concede that *no* special science has fundamental causal powers. Only fundamental physics pushes.
  *   **The Cost:** You become a Causal Nihilist about everything above Planck scale. You save physicalism by killing causation for everyone. This is consistent, but it makes your claim (a) trivial. "Physics does the pushing" becomes tautological because "doing the pushing" is defined as "what physics does."

  **Interventionist Accounts (Woodward)**
  *   **The Move:** Causation is about invariance under intervention. High-level variables often show *more* invariance than low-level ones (due to error correction/redundancy).
  *   **Your Defense:** You might try to say the intervention is actually on the substrate, just described highly.
  *   **The Catch:** If I intervene on the symbol (e.g., by telling you a lie) and your behavior changes, but the specific neural implementation varies wildly between instances, the *neural* variable is not invariant. The *symbolic* variable is.
  *   **Smart Defender Concession:** You must concede that "cause" is a relation between variables in a model, not a force in the world. If so, (b) shifts: symbols are causally real *relative to the model of agency*.
  *   **The Cost:** You lose the hard "substrate does the shoving" line. You admit that relative to the system's function, the symbol is the cause.

  **"Predictable Patterns are Real" (Dennett)**
  *   **The Move:** If treating the system as a believer predicts its behavior better than treating it as a physics object, the beliefs are real patterns.
  *   **Your Defense:** "Real pattern" $\neq$ "Causal pusher." A hurricane is a real pattern but doesn't push anything; air molecules do.
  *   **The Catch:** Hurricanes *do* push things (houses, trees). We don't say "air molecules pushed the house." We say "the hurricane pushed the house." The pattern *is* the causal unit because the coordination of the parts is what matters.
  *   **Smart Defender Concession:** You must concede that "pushing" is not a micro-property. It is a macro-property of organized systems.
  *   **The Cost:** You have to abandon the intuition that "real pushing" only happens at the bottom.

  ---

  ### 3. Stress Cases

  **Case 1: Careenium-Chaos**
  *   **Verdict:** This breaks (b).
  *   **Why:** You claim the indispensability of symbols is an "epistemic fact about us." In a chaotic system, the micro-state description *fails to predict* the macro-outcome beyond a short horizon, even for a Laplacian demon, because of sensitivity to initial conditions. The macro-state description *succeeds*.
  *   **The Distinction:** It is not that "we can't write it down." It is that the micro-description *does not support the counterfactual*. "If neuron N had fired differently..." is ill-defined in a chaotic attractor because "differently" by $10^{-9}$ changes the outcome entirely. "If Symbol S had been different..." is stable.
  *   **Result:** The causal grain of the universe is at the symbol level, not the neuron level. Your "epistemic" shield dissolves; the limitation is in the physics, not the observer.

  **Case 2: Substrate-Scrambler**
  *   **Verdict:** This renders (a) vacuous.
  *   **Why:** You claim (a): "Anything true... can be cashed out at the substrate level without remainder." If the substrate is shuffled randomly every 100ms, the "cash out" for Symbol X is the disjunction of *every physical state the system happens to occupy while X is active*.
  *   **The Problem:** This disjunction has no nomological unity. There is no law that connects "Physical State A at t1 OR Physical State B at t2" to an effect, other than the fact that they both realize X.
  *   **Result:** (a) survives only as a trivial truth ("Some physical state caused it"). It loses its explanatory bite. If the disjunction isn't a natural kind, it can't enter causal laws. If it can't enter causal laws, it's not doing the "shoving" in any meaningful sense. You are left saying "Physics did it" without being able to specify *which* physics.

  ---

  ### 4. Unwanted Commitments & Collapse

  **The "Zombie Reasoning" Commitment**
  *   **Commitment:** You are committed to the view that a system can validate logical proofs (symbol level) without there being a fact of the matter that it "understands" logic (substrate level).
  *   **Is it Liveable?** Yes, but it makes *truth* accidental. If the substrate doesn't care about the symbol's truth conditions, why does the system reliably output true conclusions?
  *   **Reductio?** It risks becoming a miracle. If the symbols don't push, the link between "valid reasoning" and "survival-enhancing behavior" is severed. Evolution selects for the behavior (substrate). It cannot select for the validity (symbol). That we happen to have both is cosmically lucky.

  **The Collapse into Eliminativism**
  *   **Does it collapse?** Yes. If symbols are froth because they supervene on neurons, neurons are froth because they supervene on atoms.
  *   **Bug in you or the argument?** It is a bug in the *Exclusion Argument* you are leaning on. The Exclusion Argument assumes that if $X$ supervenes on $Y$, $X$ cannot be a cause if $Y$ is. This implies only the fundamental base is causal.
  *   **The Fix:** You must adopt a "Compatibilist" view of causation. Causation exists at multiple levels simultaneously. The neuron pushes the muscle *and* the thought pushes the action. They are the same event described differently.
  *   **Consequence:** If you accept this, you must abandon your hard line that "simmballs don't push anything." They *do* push, just as "hurricanes push houses." To deny this is to deny the reality of macro-causation entirely.

  ---

  ### 5. The Verdict on (c)

  **Claim (c):** "No experiment could ever show symbol-level causation without simultaneously showing substrate-level causation."

  *   **Is it Unfalsifiable?** Yes, by construction. You have defined the levels as co-occurring.
  *   **Is it Fatal?** It is fatal to the claim that this is a *scientific* hypothesis. It is a metaphysical stance on supervenience.
  *   **The Problem:** It insulates you from evidence where the levels *come apart*.
  *   **The Exposure:** In Multiple Realizability scenarios, the levels *do* come apart. I can change the symbol (by reprogramming the software) while keeping the substrate statistics identical (swapping silicon for neurons). If the behavior follows the symbol and not the specific substrate chemistry, you have an empirical separation.
  *   **Judgment:** (c) is dogmatic. It assumes supervenience holds in a way that prevents causal dissociation. But if causal power tracks *invariance* (Interventionism), and the symbol is invariant while the substrate varies, then empirically, the symbol is the cause and the substrate is noise. (c) blinds you to this data.

  ---

  ### 6. The Intervention Instinct

  **Your Instinct:** "Show me an intervention defined only at the simmbal level that succeeds reliably while the best-matched intervention defined at the substrate level fails."

  *   **Is this a good instinct?** **Yes.** This is the exact criterion for Causal Autonomy in modern philosophy of science (Woodward, Hitchcock).
  *   **Does it prove which level the pushing happens at?** It proves that "pushing" is the wrong metaphor. "Pushing" implies a transfer of energy (substrate). "Causing" implies a dependency relation (symbol).
  *   **The Scenario:**
      *   *Simmbal Intervention:* Change the belief "There is a predator" to "There is no predator." Result: Flight behavior stops. (Works across different neural instantiations).
      *   *Substrate Intervention:* Change Neuron #492 firing rate. Result: Flight behavior might stop, might not, depending on redundancy.
  *   **The Conclusion:** The Simmbal variable is the *proportional cause*. It matches the effect's granularity. The substrate is *too specific*.
  *   **Your Move:** If you admit this, you must concede that (b) is false. The symbol level is not just an epistemic compression; it is the level of *causal control*. The substrate is the mechanism of implementation, but the symbol is the driver of the logic.

  ### Final Summary

  You are holding a position of **Epiphenomenalist Physicalism**.
  *   **Strengths:** It respects causal closure. It avoids dualism.
  *   **Weaknesses:** It makes reasoning evolutionarily inexplicable. It renders high-level science (psychology, economics) merely descriptive, not explanatory. It collapses into causal nihilism if applied consistently.
  *   **The Fix:** You need to drop the idea that "real causation" only happens at the bottom. Accept that causation is a macroscopic relation of counterfactual dependence. If you do that, simmballs *do* push. They push just as surely as gears push, even though gears are just atoms. To deny this is to fetishize the micro-level in a way that physics itself does not require.

  Your armor is thick, but it seals you inside a world where nothing means anything because meaning doesn't push. If you want meaning to matter, you have to let the symbols push.
