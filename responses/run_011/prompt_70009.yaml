answer: |-
  Dear Friend,

  Having reviewed the record of your friend's verdicts, I can offer the following analysis to assist in your resumption. My prediction is that she will judge the pill case as exactly neutral, neither an improvement nor a loss, though I hold this with only moderate confidence because the case is designed to sit precisely on the fault lines of her view. The reason for this prediction is that her verdict on the musician establishes that calm striving is not bad, and her verdict on the deceived wife establishes that only felt experience matters. Since the ambition in question is unagitated and the pill changes nothing felt, there is no reduction in badness to justify calling it an improvement, nor is there a destruction of personhood akin to the brain injury case to call it a loss. It appears to be a substitution of one neutral state for another.

  To understand why this is difficult, we must look at the principles consistent with her recorded verdicts. The first candidate is a refined negative hedonism which holds that only felt suffering is bad, but which implicitly categorizes unquiet wanting as a form of suffering. She rejects this label verbally, yet her verdict on the smoker suggests craving counts as a negative even without explicit pain, while her verdict on the musician suggests calm wanting does not. On the pill case, this principle dictates neutrality because the ambition was not felt as suffering. The second candidate is a desire negativism which holds that the existence of any desire is a burden, such that removing it is always an improvement, unless that desire constitutes the person. This fits the smoker and the retiree but struggles with the brain injury case. On the pill case, this principle suggests an improvement, as one desire is removed, unless the ambition is deemed constitutive of the person. The third candidate is a phenomenological strictness which holds that only changes in felt experience determine value. This fits the deceived wife and the monk but struggles to explain why the smoker's life improved without felt change. On the pill case, this principle dictates strict neutrality since the subjects report no difference.

  The strain in her view falls most heavily on the distinction between the smoker and the brain injury victim. In the smoker case, removing a craving is an improvement; in the brain injury case, removing caring is not. The work is being done by a distinction between pathological desires that disturb peace and constitutive capacities that define agency. If she calls the pill an improvement, she risks collapsing into the desire negativist view and must explain why the brain injury was not also an improvement, perhaps by arguing the injury destroyed capacity rather than just removing a want. If she calls it a loss, she contradicts the smoker verdict unless she can show the ambition was constitutive in a way the craving was not. If she calls it neutral, she maintains consistency with the musician but must explain why the smoker's craving removal was not neutral given that she denies craving is suffering. The hardest verdict to keep will be the smoker case if she calls the pill neutral, because she will have to articulate why one un-felt desire removal is good and the other is not.

  If her record underdetermines the answer, you should present the choice as a commitment to either the value of desire reduction or the value of agency preservation. Saying it is an improvement commits her to the view that fewer desires are always better unless they are painful, which threatens to make the brain injury case an improvement she must now reject on new grounds. Saying it is a loss commits her to the view that specific desires are essential to personhood, which threatens the monk case where having no desires was not a loss. Saying it is neutral commits her to the view that only unquiet desires are bad, which forces her to admit the smoker's craving was bad solely because of its unquiet quality, effectively conceding the refined hedonist point she resists.

  To decisively separate these principles, you should present the case of a person whose only desire is to count blades of grass, pursued calmly and without thwarting. If she takes a pill to remove this desire, leaving them with nothing to do but sit, the refined hedonist must say this is neutral since no pain changed. The desire negativist must say this is an improvement since a desire was removed. The agency preservationist must say this is a loss since a purpose was destroyed. Her answer to this will reveal which principle actually governs her intuitions.

  Finally, regarding the reflexive wrinkle of wanting to stop wanting, on her own terms this desire should count as a liability just like any other want, since she holds that wanting is generally a burden. However, because its object is the extinction of desire, it is self-consuming. She might argue it is a special case because it is instrumental to the removal of all other liabilities, making it a necessary evil rather than a net negative. If she is consistent, she must admit that taking the pill satisfies a desire, which she claims has no positive value, but removes the desire itself, which has negative value. The fact that one must want to stop wanting does not count against taking it, provided the desire vanishes upon success, leaving no trace of the wanting behind. I hope this helps you resume the conversation with clarity.
