answer: |-
  Here is an adjudication of the exchange based strictly on the arguments reported.

  ### 1. Evaluation of the Eight Moves

  **Move 1 (Nora): Partly Right.**
  Nora correctly identifies the core intuition of revisionist just war theory: that the permission to kill must be grounded in the target's liability. However, she asserts this as a self-evident moral truth without addressing the epistemic problems soldiers face. It is a strong foundational claim but incomplete as a standalone argument because it ignores the conditions under which soldiers operate.

  **Move 2 (Simon): Partly Right.**
  Simon correctly identifies the harsh intuitive cost of Nora's view (labeling conscripts as murderers) and correctly notes that current legal practice distinguishes between leaders and soldiers. However, he commits an appeal to tradition; existing legal practice may be a political compromise rather than a reflection of moral truth, so this does not definitively refute Nora's moral claim.

  **Move 3 (Nora): Clearly Right.**
  Nora makes a crucial and logically sound distinction between *liability* (being a legitimate target of defensive force) and *blameworthiness* (deserving punishment or moral censure). The "innocent threat" analogy (e.g., a person thrown at you) is standard in self-defense ethics and successfully demonstrates that one can be liable to be stopped without being morally at fault.

  **Move 4 (Simon): Partly Right.**
  Simon is right to distinguish between a human agent and a falling object; agency matters for moral assessment. He is also right that soldiers often lack access to the facts. However, his claim that reasonable ignorance *defeats liability* is contentious. Ignorance may excuse the soldier from blame, but it does not necessarily remove the threat they pose or the victim's right to survive.

  **Move 5 (Nora): Clearly Right.**
  Nora correctly identifies that liability in self-defense is generally objective. If a person poses an unjust lethal threat, the victim's right to defend themselves should not depend on the attacker's internal mental state or the quality of their propaganda. To hold otherwise makes the victim's right to life contingent on the attacker's epistemic luck.

  **Move 6 (Simon): Partly Right.**
  Simon shifts from moral ontology to institutional pragmatism. He is right that requiring individual moral assessment of *jus ad bellum* could lead to paralysis or increased brutality (soldiers dehumanizing opponents they deem "unjust"). However, by admitting this is a "second-best" rule, he concedes Nora's point that the doctrine is not *fundamentally* true, only useful.

  **Move 7 (Nora): Clearly Right.**
  Nora's publicity objection is strong. A moral rule that requires its adherents to believe a falsehood (that they are moral equals when they are not) is unstable. If soldiers know the rule is a "lie" told for good consequences, it undermines the moral authority of the rule and risks cynicism. She also correctly notes that legal convention does not settle moral truth.

  **Move 8 (Simon): Partly Right.**
  Simon correctly notes that *jus in bello* constraints (proportionality, discrimination) restrict just combatants too, narrowing the *practical* gap between the two sides. However, he overstates the collapse. A just combatant has a *prima facie* permission to fight that an unjust combatant lacks, even if both are constrained in *how* they fight. The structural asymmetry remains even if specific acts sometimes mirror each other.

  ### 2. Talking Past Each Other vs. Substantive Disagreement

  **Talking Past Each Other:**
  *   **Domain of Discourse:** In Moves 1–5, they are arguing about **individual moral ontology** (what makes a specific act of killing permissible?). In Move 6, Simon shifts to **institutional morality** (what rules should societies enforce?). Nora answers Move 6 on moral grounds (Move 7), while Simon is arguing on political/pragmatic grounds. They agree that MEC might be false metaphysically (Simon admits it is "second-best") but disagree on whether that matters for the doctrine's validity.
  *   **Definition of "Equality":** Nora treats "moral equality" as a claim about *liability to be killed*. Simon treats it largely as a claim about *permission to fight* and *immunity from prosecution*.

  **Substantive Disagreement That Remains:**
  Once the level-of-analysis confusion is cleared, the core disagreement is **epistemic**: Does a soldier's reasonable ignorance of their side's injustice remove their liability to defensive killing?
  *   Nora says **No**: Liability is objective; ignorance excuses blame but not liability.
  *   Simon says **Yes**: If the threat is not knowingly unjust, it does not generate the same liability as a culpable threat.

  ### 3. Adjudication of Move 4 (Simon) vs. Move 5 (Nora)

  **Verdict: Nora has the better of it.**

  **Reasoning:**
  Simon argues that reasonable ignorance defeats liability. Nora argues that liability is a matter of fact, not belief. In the ethics of self-defense, the right to preserve one's own life against a lethal threat is paramount. If a soldier poses an objectively unjust threat (e.g., invading a sovereign country to subjugate it), the defenders have a right to stop that threat regardless of the invader's internal justification.

  If Simon were right, a victim would have to assess the epistemic state of their attacker before defending themselves ("Is he *reasonably* ignorant, or does he *know* he is wrong?"). This places an impossible burden on the victim. Nora's view protects the victim's right to life. Simon's concern about the conscript's fairness is better handled by the distinction Nora already granted in Move 3: the conscript is **not blameworthy** (and should not be prosecuted as a murderer), but he is still **liable** (and may be stopped, even lethally, by those he threatens). Simon conflates *punishability* with *liability to defensive force*.

  ### 4. Evaluation of the Publicity Objection (Move 7)

  **Verdict: The objection is valid and touches Simon's argument deeply.**

  **Reasoning:**
  Nora argues that a rule taught as true but known to be false fails the "publicity condition" of morality. Simon's defense in Move 6 is that MEC is a useful institutional fiction.
  *   **Defective as a Moral Rule:** Yes. Moral rules generally require sincerity to maintain normative force. If soldiers are taught "You are moral equals" but the underlying moral reality is "You are unjust threats," the rule functions as a noble lie. This creates a fragile moral culture; once soldiers realize the lie (or encounter an enemy who knows it), the restraint collapses.
  *   **Touching Simon's Argument:** Simon argues the rule saves lives. Nora counters that a rule based on falsehood is unstable. She is right that you cannot build a lasting ethical framework on a known falsehood. However, Simon might reply that *all* social conventions (like driving on a specific side of the road) are arbitrary but necessary. The difference is that war involves killing, which demands moral truth more than traffic laws do. Nora's objection stands: if the doctrine is morally false, enforcing it as truth corrupts the moral understanding of the agents involved.

  ### 5. Addressing Move 8 (The Collapse Argument)

  **Verdict: Simon identifies a complication, but the asymmetry survives.**

  **Reasoning:**
  Simon argues that because just soldiers also kill impermissibly (e.g., disproportionate force), the asymmetry between just and unjust sides collapses in practice.
  *   **Why the Asymmetry Survives:** Nora's claim is about the *license to participate*. A just soldier has a general permission to engage in hostilities, provided they follow *in bello* rules. An unjust soldier lacks that general permission entirely.
  *   **The Error:** Simon conflates *violations of conduct* with *lack of cause*. When a just soldier kills disproportionately, they commit a war crime; they do not retroactively make their side's cause unjust. When an unjust soldier kills discriminately, they are still participating in an unjust project.
  *   **Extent of Survival:** Nora's conclusion survives largely intact. The *structural* asymmetry (one side is defending rights, the other violating them) remains absolute. Simon is right only in the narrow sense that *specific acts* on both sides can be equally wrongful (e.g., both shooting a civilian). But this does not erase the fundamental difference in their *status* as combatants. The "practical upshots" do not coincide: the just side is fighting for a permissible end; the unjust side is not.

  ### 6. What Neither of Them Said

  A fair referee would note two missing elements:

  1.  **The Collective Nature of War:** Both argue largely from an individualistic framework (individual liability, individual ignorance). War is a collective enterprise. A soldier is an instrument of the state. Neither fully addressed whether the state's liability transfers to the soldier in a way that bypasses individual epistemic limits. If the state is liable to attack, are its agents automatically liable, regardless of individual knowledge?
  2.  **The Victim's Epistemic Limit:** The debate focuses on the *soldier's* knowledge. But the soldier shooting back *also* suffers from propaganda and uncertainty. If Nora is right that liability is objective, the just soldier also risks killing someone who is "reasonably ignorant" and thus blameless. Neither fully explored the symmetry of *epistemic risk* that both sides face, which might actually support a symmetrical rule for reasons neither articulated (mutual assurance rather than institutional fiat).

  ### 7. Overall Verdict

  **Who is more right?**
  They are right about different things.

  *   **Nora is more right about Moral Truth.** Her account of liability (Move 3 and 5) is philosophically superior. The moral permission to kill cannot be truly symmetrical when one side is aggressing and the other defending. Her distinction between blame and liability saves the conscript from being a "murderer" while preserving the defender's right to life.
  *   **Simon is more right about Political Regulation.** His argument (Move 6) correctly identifies that enforcing Nora's moral truth in the real world could lead to worse outcomes (paralysis or escalated brutality).

  **Final Judgment:**
  On the specific proposition debated—the **doctrine of the moral equality of combatants**—**Nora is more right.**
  The doctrine claims that soldiers *are* moral equals. Nora demonstrates they *are not* (in terms of liability and cause). Simon effectively concedes this in Move 6 by calling it a "second-best institution" and a rule for uncertainty rather than a moral truth. Therefore, as a statement of *ethics*, Nora wins. As a statement of *policy*, Simon has a strong pragmatic case, but he loses the argument about the doctrine's truth. Since the reading group is on the *ethics* of war, Nora's position holds the stronger moral ground. Simon has successfully argued for a "noble lie," but a noble lie is not the truth.
