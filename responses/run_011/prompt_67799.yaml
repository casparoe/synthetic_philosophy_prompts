  The phenomenon you have isolated is precise, and your resistance to the standard labels is justified. You are describing a mechanism that operates *upstream* of belief, whereas the traditional puzzles of self-deception operate *downstream*.

  The closest established concept is **Willful Blindness** (in law) or **Bad Faith** (in existential philosophy). However, your case departs from both by **kind**, not degree.

  **Willful Blindness** (or *conscious avoidance*) requires a "red flag." The defendant must suspect the truth and take deliberate steps to avoid confirming it. Your characters do not suspect. There is no flag to wave.
  **Sartrean Bad Faith** requires a pre-reflective consciousness of the truth that one flees. Sartre assumes the lie is always aware of the truth it hides. Your characters have not fled the truth; they have arranged a life where the truth has no address.

  There is also **Motivated Ignorance** in psychology, but this typically presumes a cognitive bias acting on information that *is* available. Your characters ensure the information is *unavailable*.

  ### The Verdict

  This is **not self-deception**.

  Self-deception is a doxastic conflict (holding $p$ and $\neg p$) or a doxastic manipulation (making oneself believe $p$ when $\neg p$ is true). Your characters have no conflict and hold no false belief. They hold *no belief at all* on the subject. The machinery of judgment is intact; the input never arrives. To call this self-deception is to confuse the *result* (ignorance) with the *mechanism* (lying to oneself).

  The moral category is **Culpable Ignorance**. The psychological mechanism is what I shall coin for you: **Structural Unknowing**.

  ### The Concept: Structural Unknowing

  **Definition:** Structural Unknowing is the curation of one's physical and temporal environment to prevent a specific proposition from ever achieving the salience required to become a thought. It is not the suppression of a question, but the architectural removal of the conditions under which the question arises.

  It relies on the **Fallacy of Composition** applied to agency: every individual brick is laid innocently, but the wall they form is a barrier to knowledge. The "moat" is dug by a thousand innocent decisions, none of which are "digging a moat."

  ### Boundary Cases

  You asked for the edges of this concept. Here is where the line is drawn:

  1.  **The Person Who Has the Thought Once a Year:**
      *   *Verdict:* **Outside.**
      *   *Reason:* The proposition *has* entered. They have entertained the question and dismissed it. This is standard **Repression** or **Rationalization**. Structural Unknowing requires the question to remain unasked.

  2.  **The Person Who Cannot Entertain It Due to Trauma:**
      *   *Verdict:* **Outside.**
      *   *Reason:* The barrier is internal and pathological, not structural and curated. This is **Dissociation** or **Psychological Defense**. Structural Unknowing requires the agent to have the capacity to know but to have arranged the world so they do not need to use it.

  3.  **The Person Who Has Delegated the Question:**
      *   *Verdict:* **Inside.**
      *   *Reason:* This is a pure form of Structural Unknowing. By assigning the "tally-keeping" to a spouse or accountant, the agent structurally removes the data from their own epistemic field. They remain innocent because "someone else handles that."

  4.  **The Person Whose Ignorance Is Imposed from Outside:**
      *   *Verdict:* **Outside.**
      *   *Reason:* This is **Oppression** or **Gaslighting**. Structural Unknowing requires *agency* in the arrangement. The husband and mother are the architects of their own ignorance. If the ignorance is forced upon them, they are victims, not culpable agents.

  ### The Decisive Consideration

  The consideration that decides whether this counts as self-deception or Structural Unknowing is the **Locus of Work**.

  In self-deception, the work is done **in the mind**. Energy is expended to reconcile contradictions, to suppress intrusions, to maintain the lie. There is a friction, a heat.

  In Structural Unknowing, the work is done **in the world**. The friction is externalized into the schedule, the architecture of the house, the division of labor. The mind remains cool, clear, and "honest." This is why your characters can answer accurately if put on the spot: they are not lying. They are simply residents of a house where that room was never built.

  ### Why This Distinction Matters for Your Novel

  If you treat this as self-deception, you will be tempted to write internal monologues of conflict, flashes of guilt, or moments of near-recognition. That would be a mistake. It would falsify the psychology you have correctly identified.

  The horror and the realism of Structural Unknowing lie in its **smoothness**. The marriage does not creak; it hums. The mother does not feel burdened; she feels efficient. The tragedy is not that they are lying to themselves, but that they have successfully engineered a life that renders the truth irrelevant.

  Call it **Structural Unknowing**. It gives you the permission to keep them innocent in their own eyes, which is the only way they remain culpable in the eyes of the reader.
