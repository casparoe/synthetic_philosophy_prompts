  4. Parfit presented this argument to demonstrate a flaw in common moral intuitions, not to vindicate the claim that nothing wrong has been done. He believed we should revise our moral theories to avoid this counterintuitive result rather than accept the result itself.
  5. Philosophers continue to work on duties to the unborn because they seek coherent ethical systems, not because they are stubbornly refusing a logical conclusion. Most argue that the nonidentity problem reveals a gap in our understanding of harm, not a permission to neglect the future.
