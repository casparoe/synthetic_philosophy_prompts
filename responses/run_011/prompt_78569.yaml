answer: |-
  # Session Plan: "The Specimen Game"

  **Theme:** Do scientific categories discover what is there, or invent what is useful?
  **Time:** 75 Minutes
  **Participants:** 18 Adults (3 tables of 6)
  **Materials Cost:** < $10 (Paper, markers, envelopes)

  ## 1. Materials & Card Design

  You need three identical decks (one per table). Print on cardstock if possible.

  **The Deck (12 Cards per Table)**
  Each card has a **Visible ID** (printed on front) and a **Hidden Code** (printed on back, or on a separate "Lab Report" sheet you hold).
  *   **Visible Features:**
      *   **Shape:** Circle or Square.
      *   **Shade:** Solid Black or Solid White.
      *   **Distribution:** 3 copies of each combination (3 Black Circles, 3 Black Squares, 3 White Circles, 3 White Squares).
  *   **Hidden Properties (For Facilitator Eyes Only):**
      *   *Property A (Toxicity):* All **Black** cards are Toxic. All **White** cards are Safe.
      *   *Property B (Fragility):* All **Circle** cards are Fragile. All **Square** cards are Sturdy.
      *   *Property C (Genetic Lineage):* **Black** cards are Lineage 1. **White Circles** are Lineage 1. **White Squares** are Lineage 2. (Note: Lineage follows Shade mostly, but Shape breaks the tie on White cards).

  **The Scoring Sheet (One per Table)**
  A simple grid with columns: `Pile #`, `Cards in Pile`, `Hidden Value of Cards`, `Purity Score`.
  *   *Rule:* If all cards in a pile share the same Hidden Value, +10 points. If mixed, 0 points.

  **The Envelopes**
  Prepare three envelopes per table labeled:
  1.  "Mission 1: Safety Protocol" (Contains Property A Key)
  2.  "Mission 2: Transport Protocol" (Contains Property B Key)
  3.  "Mission 3: Ancestry Report" (Contains Property C Key)

  ---

  ## 2. Minute-by-Minute Timeline

  **00:00 – 00:05 | Setup & Silence**
  *   Seat participants at 3 tables (6 per table).
  *   Give each table a shuffled deck and a Scoring Sheet.
  *   **Say:** "You are a classification team. You have 12 specimens. Do not turn them over. Your goal is to sort them into piles. I will not tell you how. You have 3 minutes."
  *   *Facilitator Note:* Do not explain *why*. Let them argue about whether to sort by Shape or Shade. Most will pick one arbitrarily.

  **00:05 – 00:20 | Mission 1 (Safety)**
  *   **Say:** "Stop. Leave your piles. Open Envelope 1. This reveals a hidden property: Toxicity. Your sorting is now scored on how well your piles predict Toxicity. If a pile contains only Toxic or only Safe cards, you get 10 points. If it mixes them, 0."
  *   Tables calculate scores. (Tables that sorted by **Shade** get 40 points [4 piles]. Tables that sorted by Shape get 0 or low points).
  *   **Say:** "Reset the deck. Shuffle. You have 3 minutes to sort again. Optimize for the highest score."
  *   *Outcome:* Everyone sorts by **Shade** (Black vs. White).

  **00:20 – 00:35 | Mission 2 (Transport) – The First Turn**
  *   **Say:** "Open Envelope 2. New Mission: You are shipping these. The hidden property is Fragility. Score your *current* piles (Shade) against Fragility."
  *   *Outcome:* Shade sorts score poorly (Black piles mix Circles/Squares).
  *   **Say:** "Reset. Sort again to maximize Fragility prediction."
  *   *Outcome:* Everyone sorts by **Shape** (Circle vs. Square).
  *   **Say:** "Score the Shape sort against Fragility." (High score).
  *   **Crucial Question:** "Look at your scores. Shade was perfect for Safety. Shape was perfect for Transport. Which sorting is the *true* sorting?"
  *   *Let them argue for 2 minutes.* Most will say "It depends on the job."

  **00:35 – 00:50 | Mission 3 (Ancestry) – The Second Turn**
  *   **Say:** "Keep your Shape piles. Open Envelope 3. New Technology: We can now test Genetic Lineage. Score your Shape piles against Lineage."
  *   *Outcome:* Shape sorts get partial credit (White Squares are different from White Circles, but Shape groups them together).
  *   **Say:** "If you had sorted by Shade, you would have scored higher on Lineage. Shade predicts Lineage better than Shape does."
  *   **The Reveal:** "Shade and Shape were tied for usefulness (100% accuracy on their tasks). But on Lineage, Shade wins. Does that make Shade the 'real' category?"

  **00:50 – 01:15 | Debrief & Mapping**
  *   (See Script Below)

  ---

  ## 3. Scoring Scheme (No Money)

  Use "Purity Points."
  *   **Perfect Pile:** All cards in the pile have the same Hidden Property value (e.g., all Toxic). **+10 Points.**
  *   **Mixed Pile:** The pile contains both values (e.g., one Toxic, one Safe). **0 Points.**
  *   **Max Score:** 40 Points (if they make 4 piles of 3 identical cards) or 20 Points (if they make 2 piles of 6).
  *   *Simplification:* To avoid complex math, ask them to make **2 Piles** in every round.
      *   If sorting by Shade: Pile 1 (Black), Pile 2 (White). Max Score = 20.
      *   If sorting by Shape: Pile 1 (Circles), Pile 2 (Squares). Max Score = 20.
      *   This makes the tie obvious (20 vs 20) and the tie-breaker clear.

  ---

  ## 4. Debrief Script (Connecting to Philosophy & Diagnosis)

  **Phase 1: The Conventionalist Turn (00:50 – 01:05)**
  *   **Ask:** "In Mission 1 and 2, both sortings worked perfectly. If I'm a safety inspector, Shade is real. If I'm a mover, Shape is real. Did the cards change?" (No). "Did the world change?" (No). "Did *we* change?" (Yes, our goal changed).
  *   **Introduce Term:** "This is **Conventionalism** (or Pragmatism). Categories are tools. A 'kind' is just a group of things that behave the same way *for the purpose we care about*."
  *   **Connect:** "Think of a diagnosis. At age 7, your son's behaviors (Shape) grouped him with others who needed school support (Transport). That diagnosis wasn't 'fake.' It predicted his needs perfectly. It carved a joint that mattered for *that* task."

  **Phase 2: The Realist Turn (01:05 – 01:15)**
  *   **Ask:** "But then came Mission 3. Lineage. Shade predicted it better. It feels like Shade is 'deeper.' Why?"
  *   **Introduce Term:** "This is **Realism**. The idea that nature has a preferred structure (joints) independent of our tools. Science tries to find the categories that predict the *most* things, especially the hidden ones."
  *   **Connect:** "At age 11, new tests (Lineage) arrived. The new diagnosis (Shade) explained the *cause*, not just the symptoms. It replaced the old one not because the old one was useless, but because the new one was *more powerful* across more contexts."
  *   **Closing Question:** "If the first diagnosis helped your son get help, but the second explains *why*, was the first one false? Or was it just a shallower cut?"

  ---

  ## 5. Predictable Failure Modes & Mitigation

  **1. The "Gotcha" Risk (Mission 3 feels unfair)**
  *   *Risk:* Participants feel you rigged Mission 3 to favor Shade after letting them think Shape was equal. They may feel manipulated.
  *   *Mitigation:* Frame Mission 3 explicitly as **"New Technology."** Say: "In science, we don't always have the Genetic Test at the start. We start with behavior (Shape/Shade). When the test arrives, we update." This mirrors the medical reality: the *evidence* changed, not just your whim.
  *   *Script:* "This isn't me moving the goalposts. This is the microscope getting better."

  **2. The "Arbitrary Sort" Risk**
  *   *Risk:* In Round 1, a group sorts by "Cards with smooth edges vs rough edges" (if printed poorly) or just randomly.
  *   *Mitigation:* Ensure the visual distinction between Shape and Shade is high contrast. If they sort weirdly, acknowledge it: "You sorted by X. Let's see how X predicts Toxicity." It will likely fail, which proves the point that *some* sorts are better than others.

  **3. The "Realism is King" Bias**
  *   *Risk:* Participants decide Shade is "Truth" and dismiss Shape entirely after Round 3.
  *   *Mitigation:* Remind them: "If you are shipping the boxes tomorrow, do you care about Lineage? No. You care about Fragility (Shape). The 'Real' category is useless for the 'Practical' task." This preserves the validity of the first diagnosis.

  **4. Time Creep**
  *   *Risk:* Scoring takes too long.
  *   *Mitigation:* Pre-print the "Hidden Keys" on large poster paper for each table so they don't have to flip 12 cards over. They just check the list.

  ---

  ## 6. The Limitation: What the Cards Cannot Do

  **The Limitation:**
  The cards are static. In the game, *you* (the Facilitator) decide the Hidden Properties. In real science, **nature resists.**
  *   In the game, if I decided Lineage followed Shape instead of Shade, that would be the truth.
  *   In reality, if we hypothesize "Lineage follows Shape" and the lab results say "No," the world *pushed back*.
  *   **What you must supply:** You need to emphasize in the debrief that the "Hidden Properties" in real life are not chosen by a facilitator. They are discovered through friction. The reason the second diagnosis feels more "real" isn't just that it predicts more (like Shade in Mission 3), but that it survived attempts to prove it *wrong*.
  *   **Instruction:** When discussing the diagnostic shift, remind the group: "The first diagnosis wasn't discarded because it was useless. It was discarded because the *biology* (the world) refused to align with it anymore."

