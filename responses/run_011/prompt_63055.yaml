answer: |-
  # Activity Plan: The Sovereign Grid (The Hole Argument Construction)

  **Target:** 14 Graduate Students (7 Pairs)
  **Time:** 90 Minutes
  **Goal:** Construct a discrete model world to experience the underdetermination of interior field values despite fixed boundary conditions and laws, forcing a choice between point-individuality and determinism.

  ---

  ## I. Materials & Setup

  **Per Pair (7 Packs):**
  1.  **The Grid Board:** A 5x5 laminated card. The 25 intersections are marked with dots.
      *   **Crucial Feature:** Each dot has a unique, pre-printed **ID Code** (e.g., `P-01` to `P-25`) and a small, distinct **Sovereign Seal** (a colored geometric sticker unique to that coordinate). *This is the device to reify points.*
      *   The outer ring (16 points) is the **Boundary**. The inner 3x3 (9 points) is the **Interior**.
  2.  **Value Tokens:** A set of numbered chips (0–9).
  3.  **The Law Sheet:** A single page of arithmetic rules.
  4.  **The Assignment Card:** (Distributed differently to Group A and Group B).
  5.  **Dry-erase markers** (to record values next to the seals).

  **Instructor Materials:**
  1.  Master Timer.
  2.  Blackboard/Whiteboard for Debrief mapping.
  3.  **"The Transformation Key"** (A transparency showing a shift map for the Interior points only).

  ---

  ## II. Roles & Rules (Handout Text)

  *(Distribute this text exactly. Do not use words like "manifold," "metric," or "diffeomorphism.")*

  **ROLE:** You are a **World-Architect**.
  **OBJECT:** Construct a physical state on your Grid Board using Value Tokens.

  **RULE 1 (Sovereignty):** Each intersection on your board is a unique individual, identified by its Seal and ID Code. Point `P-13` is *not* Point `P-14`. A fact about `P-13` is distinct from a fact about `P-14`. You are responsible for the truth at your specific locations.

  **RULE 2 (Boundary Condition):** The 16 points on the outer ring are **Fixed**. You must place Value `0` on all Boundary points. You cannot change this.

  **RULE 3 (Local Law):** The Interior (9 points) must satisfy the **Smoothness Constraint**:
  *   For any Interior point, its Value must differ from its immediate neighbors (Up, Down, Left, Right) by no more than `1`.
  *   *(Example: If North is 3, Center can be 2, 3, or 4.)*

  **RULE 4 (Completion):** You must place a Value Token on every Interior point.

  ---

  ## III. Minute-by-Minute Timeline

  ### 00:00 – 00:10: Introduction & Setup
  *   **Instructor:** "You are World-Architects. Your job is to build a consistent state on the Grid. The points are real individuals (point to Seals). The numbers represent a physical field. Follow the Law Sheet."
  *   **Action:** Distribute packs. Divide the 7 pairs into **Team Alpha (3 pairs)** and **Team Beta (4 pairs)**.
  *   **Constraint:** Do not talk to other teams yet.

  ### 00:10 – 00:30: Construction Phase 1 (The Baseline)
  *   **Task:** All teams must fill the Interior (3x3) satisfying the Smoothness Constraint and the Fixed Boundary (all 0s).
  *   **Instruction to Team Alpha:** "Build a **Central Peak**. Place a `3` on the exact center point (`P-13`). Fill the rest to satisfy the Law."
  *   **Instruction to Team Beta:** "Build a **Shifted Peak**. Place a `3` on the point one step Right of center (`P-14`). Fill the rest to satisfy the Law."
      *   *Note:* Both configurations satisfy the Boundary (0s) and the Law (Smoothness).
      *   *Check:* Instructor circulates to ensure Beta's slope fades to 0 before hitting the Boundary, so the Boundary condition holds. (With a 3x3 interior, a peak of 3 at `P-14` can slope down to 0 at the edges `P-09`, `P-15`, `P-19`, `P-20` legally).
  *   **Outcome:** Alpha has a hill at `P-13`. Beta has a hill at `P-14`.

  ### 00:30 – 00:45: The Audit (Discovery of Difference)
  *   **Action:** Pair Alpha 1 with Beta 1. (One pair remains with Instructor as control).
  *   **Task:** "Compare your **Logs**. Read out the Value and the Point ID for the Interior."
  *   **Prompt:** "Did you follow the same Laws?" (Yes). "Did you match the Boundary?" (Yes).
  *   **Question:** "Is the physical state at Point `P-13` the same in both worlds?"
      *   *Alpha:* "Value is 3."
      *   *Beta:* "Value is 2 (or 1)."
  *   **Crisis:** The students will likely say, "It's the same shape, just moved."
  *   **Instructor Constraint:** "Recall Rule 1 (Sovereignty). Point `P-13` is an individual. If the Value at `P-13` differs, the Fact at `P-13` differs. These are distinct worlds."

  ### 00:45 – 00:60: The Hole Intervention (Indeterminism)
  *   **Scenario:** "Imagine the Boundary and the Laws are all the data you have from the past. The Interior is the future."
  *   **Task:** "Team Alpha, keep your board. Team Beta, erase your interior. You are given the **exact same** Boundary and Laws as Alpha. Predict the Interior."
  *   **Problem:** Beta can legally rebuild the Alpha pattern *OR* the Beta pattern. Nothing in the Boundary or Laws forces the Peak to be at `P-13` rather than `P-14`.
  *   **Observation:** The Interior is **underdetermined**. The data outside the "Hole" (Interior) does not fix the data inside, even though the Laws are satisfied.

  ### 00:60 – 00:90: Debrief & Mapping
  *   **Instructor:** Reveal the technical vocabulary and map the activity to General Relativity.

  ---

  ## IV. Debrief Structure (The Mapping)

  Write these two columns on the board. Fill them in with student input, then supply the GR terminology.

  | Activity Feature | GR / Hole Argument Feature |
  | :--- | :--- |
  | **Grid Points (with Seals)** | **Manifold Points** (Spacetime events). |
  | **Value Tokens** | **Metric/Field Values** ($g_{\mu\nu}$). |
  | **Smoothness Law** | **Einstein Field Equations** (Generally Covariant). |
  | **Boundary (Fixed)** | **Cauchy Surface / Past Data**. |
  | **Interior (Hole)** | **The Hole** (Future region). |
  | **Alpha vs. Beta Worlds** | **$(M, g)$ vs. $(M, \phi^*g)$**. |
  | **Rule 1 (Sovereignty)** | **Substantivalism** (Points have haecceity). |
  | **"It's just a shift"** | **Leibniz Equivalence** (Relationalism). |

  ### The Argument Reconstruction
  1.  **Assumption (Substantivalism):** We treated the Seals (Points) as real individuals (Rule 1). Therefore, Alpha's World and Beta's World are **distinct physical realities**.
  2.  **Premise (General Covariance):** The Laws (Smoothness) allowed both configurations. The Boundary data did not rule Beta out.
  3.  **Conclusion (Indeterminism):** If Substantivalism is true, the past (Boundary) does not determine the future (Interior). GR would be indeterministic.
  4.  **The Escape (Leibniz Equivalence):** If we reject Rule 1. If points are not individuals, but merely "locations in the field," then Alpha and Beta describe the **same physical reality**. The "shift" is just a redescription. Determinism is saved, but Substantivalism is lost.

  ### The Costs of the Escapes
  *   **Option A: Keep Substantivalism.**
      *   *Cost:* You must accept **Radical Indeterminism**. The universe could rearrange itself inside the hole without any change to the past or the laws. (Most physicists/philosophers reject this).
  *   **Option B: Accept Leibniz Equivalence.**
      *   *Cost:* You must deny that spacetime points exist independently of the fields. There is no "container" of space. Points are only defined by their relational properties. (This is the standard "Sophisticated Substantivalist" or Relationalist resolution).

  ---

  ## V. Addressing the Two Specific Constraints

  ### 1. Making Point-Names Feel Like Individuals
  *   **The Device:** The **Sovereign Seal** (Sticker) + **Guardian Rule**.
  *   **Implementation:** In the instructions, explicitly state: *"You are the Guardian of Point P-13. If the value at P-13 changes, YOU have failed your duty."*
  *   **Why it works:** It assigns agency and responsibility to the coordinate. It prevents students from saying "Oh, P-13 is just a variable name." It makes the identity of the point a normative constraint. When Beta puts a different value on P-13, Alpha's "Guardian" registers a violation of fact, not just a change of variables.

  ### 2. Limitations of the Activity (Honest Statement)
  *   **Instructor Script for the End:**
      > "This activity captures the *logic* of the Hole Argument, but it simplifies the *mathematics* in two crucial ways you must account for in your essays:
      >
      > 1.  **The Continuum:** We used a finite grid. In GR, the manifold is continuous. The 'shift' (diffeomorphism) is a smooth deformation, not a jump from one grid cell to another. This matters because smoothness allows the shift to fade to zero at the boundary *infinitely* differentiably, which is required for the Field Equations to hold everywhere. Our 'Smoothness Law' was a rough proxy for this.
      >
      > 2.  **Equations vs. Rules:** In our game, I *told* Beta they could build a shifted peak. In GR, the indeterminism is not a rule given by a teacher; it is a **theorem** derived from the Einstein Field Equations themselves. The equations *themselves* do not distinguish between $(M, g)$ and $(M, \phi^*g)$. The freedom is intrinsic to the dynamics, not an external permission.
      >
      > **What I supplied verbally:** I had to enforce the 'Sovereignty' of points via the Seals. In the real philosophical debate, Substantivalism is a metaphysical commitment, not a sticker on a board. You must argue whether that commitment is warranted without the prop."

  ---

  ## VI. Handout: The Law Sheet (Example Content)

  **LOCAL SMOOTHNESS LAW**
  For every Interior Point $P_{in}$:
  1.  Identify Neighbors $N, S, E, W$.
  2.  Calculate Difference: $|Value(P_{in}) - Value(Neighbor)|$.
  3.  **Constraint:** Difference must be $\le 1$.
  4.  **Boundary Value:** All Outer Ring Points = `0`.

  **EXAMPLE:**
  If North=`2`, South=`2`, East=`1`, West=`1`...
  Center can be `1`, `2`, or `3`.
  Center *cannot* be `4` (Diff with North would be 2).

  ---

  ## VII. Contingency Plan

  *   **If students finish too fast:** Ask them to try to construct a world where the Boundary is 0, but the Interior contains a `9`. (They will find they can't satisfy the Smoothness Law). This reinforces that the Laws *do* constrain the world, just not *uniquely*.
  *   **If students reject Point Identity immediately:** Invoke the "Audit." Tell them: "The Funding Agency pays per Point ID. If you claim the value at P-13 is 3, but the sensor at P-13 reads 2, you are in breach of contract." Force the substantivalist stance for the sake of the argument.
