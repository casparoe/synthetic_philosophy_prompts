answer: |-
  **VESSEN TRANSITION COMMISSION**
  **CONVICTIONS PANEL**

  **DRAFT DECISION: APPLICATION NO. 001/24 (EST. HALÁSZ)**
  **DATE:** 14 July 2024
  **PANEL:** [Redacted], [Redacted], [Redacted]
  **DRAFTING MEMBER:** [Your Name]

  ### I. RECOMMENDATION

  1.  **The Panel recommends annulment** of the conviction of Miro Halász, entered 12 November 1994 by the District Court of Vessen-South, under Article 14 of the 1985 Public Confidence Act.
  2.  **The record shall be expunged.** The Commission shall issue a certificate to the applicant stating that the conviction is deemed never to have had legal effect.
  3.  **Vera Kessler shall be identified** in the factual summary of this decision as the reporting party, but she shall not be designated as a respondent, nor shall any finding of personal culpability be made against her. Her witness statement shall be appended to the file as part of the historical record.
  4.  **No financial compensation** is recommended under this specific mandate, as the enabling act restricts the Panel to questions of conviction validity.

  ### II. REASONS FOR DECISION

  **A. The Mandate and the "Law in Force"**

  5.  The Commission's enabling act restricts us to annuling convictions that were "unlawful under the law in force at the time." We are not empowered to declare the statutes of the Directorate void *ab initio*, nor to apply the new Constitution retroactively. We must judge the 1994 verdict by the legal standards of 1994.

  6.  This constraint creates a tension. To annul a conviction based on a statute that was technically "on the books" requires us to find that the *application* of that statute violated the legal order existing at the time. We are not asking whether Article 14 was wicked; we are asking whether the conviction was *legal*.

  **B. Grounds for Annulment: Internal Legality**

  7.  In this specific case, the 1994 conviction fails on the Directorate's own procedural terms. Two errors are apparent on the face of the record:
      *   **The "Correction" Clause:** The court invoked a retrial clause permitting new proceedings where an acquittal was "obtained through concealment." The 1988 acquittal was based on insufficient evidence. No concealment occurred. The invocation of this clause was a fiction not supported by the file.
      *   **Aggravation by Acquittal:** The sentencing judge cited the 1988 acquittal as evidence of "standing risk." Under the 1980 Code of Criminal Procedure, a prior acquittal could not be used as an aggravating factor.

  8.  Because the conviction rests on procedural mechanisms that were not authorized by the statutes in force in 1994, the conviction is "unlawful under the law in force at the time." This ground alone suffices for annulment.

  **C. Addressing the Substance of Article 14**

  9.  We are aware that annulment on purely procedural grounds implies that a procedurally perfect conviction under Article 14 would stand. This does not satisfy the applicant's request for a declaration that her father "broke no law that anyone was obliged to obey."

  10. To address this without exceeding our mandate, we must interpret the substantive scope of Article 14 as it stood in 1994. The Act criminalized utterances "apt to undermine public confidence." In the Directorate's own jurisprudence (see *State v. Novak*, 1986), "public confidence" required an intent to disseminate information to the general public or a group sufficient to cause public disorder.

  11. Halász's remarks were made to a single neighbour, over a fence, in a private capacity. There was no intent to broadcast, and no evidence the remarks reached a wider audience absent the state's coercive reporting machinery (Section 22). Applying Article 14 to a private conversation was an *ultra vires* expansion of the statute, even by the Directorate's own judicial standards. Therefore, even if the procedural errors above had not occurred, the *substantive application* of the law to these facts was unlawful under the law in force.

  12. **Honest Limitation:** We must acknowledge that this reasoning does not automatically invalidate every Article 14 conviction. A broadcast or public speech intended to disrupt morale might still qualify as a crime under the 1985 Act. However, it establishes a presumption: private speech, truthful in content, lacking public intent, falls outside the legal definition of the offense.

  **D. A Rule for Future Applications (The 2,900 Cases)**

  13. We cannot adjudicate 2,900 cases with this level of granularity within the remaining 60 days. We require a triage rule. The Panel adopts the following test for "Unlawful under the law in force":

      *   **Category A (Presumptive Annulment):** Convictions where the conduct would not be criminal under the *old* regime's own written definitions if applied neutrally. This includes:
          *   Private speech crimes (Article 14 type).
          *   "Failure to report" crimes (Section 22 type) where the underlying conduct was not criminal.
          *   Political association crimes where the association was peaceful.
      *   **Category B (Presumptive Upholding):** Convictions for *mala in se* or regulatory offenses with a non-political administrative purpose. This includes:
          *   Violent assault, theft, fraud (where the victim was a private citizen, not the State).
          *   Tax evasion (unless used as a pretext for political persecution).
          *   Traffic offenses.

  14. **The 1988 Acquittal Detail:** The fact that Halász was acquitted in 1988 for the same conduct reinforces Category A. It demonstrates that the conduct itself was not consistently treated as criminal even by the old courts. In future cases, a prior acquittal for similar conduct shall trigger expedited review for annulment.

  **E. Counter-Arguments and Legitimacy**

  15. **The Positivist Objection:** Critics may argue that by re-interpreting Article 14 narrowly, we are engaging in the same legal fiction-making as the Directorate. We are effectively saying, "The law was wicked, so we will pretend it wasn't the law." The honest response, they argue, is to pass new legislation compensating victims while admitting the old convictions were technically valid.

  16. **The Panel's View:** Compensation is a legislative function; we are a judicial body. If we leave the conviction standing, we endorse the state's finding that Halász was a criminal. For the daughter, and for the historical record, money does not cure the lie. We are not pretending the statute didn't exist; we are enforcing the principle that a conviction requires a valid application of the statute. Where the statute was used to punish conduct it did not legally cover (private speech), the conviction is a nullity. This preserves the rule of law rather than suspending it.

  17. **The Reverse Worry:** Conversely, some argue we should go further and declare Article 14 void. We cannot. To do so would violate the enabling act and risk the Commission's dissolution by the new Parliament, which sought a narrow transition. We must work within the crack between "law" and "justice," not blow the structure apart.

  **F. The Status of Vera Kessler**

  18. The applicant requests Kessler be named. Two Panel members express concern for her safety and status as a coerced actor.

  19. **Decision:** Kessler is named in the factual summary. Truth requires identifying the mechanisms of repression. Section 22 turned citizens into informants; hiding this sanitizes history. However, the decision will explicitly state that Kessler acted under a statutory duty backed by criminal penalty and fear for her son's safety. She is a witness to the system's operation, not a perpetrator. Her statement is accepted as evidence of the coercive environment, not as an admission of guilt. She gains no legal immunity from this decision, but the Commission records her status as a conscripted agent of the Directorate.

  **G. Timing and Triage**

  20. **The Clock:** We are in Month 4 of 6. We have approximately 60 days remaining. At current throughput, we cannot hear all 2,900 cases individually.

  21. **Expedited Procedure:** Effective immediately, applications falling into Category A (Private Speech/Political Association) where the file shows no violence or fraud shall be decided on the papers by a single Commissioner, subject to ratification by the Panel. This allows us to clear ~2,000 cases in 30 days.

  22. **Elderly/Ill Applicants:** Any application where the applicant or the convicted person (if living) is over 75 or certified terminally ill shall be prioritized for immediate decision. The transition must offer redress to the living, not just the dead. We will issue a public notice inviting prioritization requests.

  ### III. CONCLUSION

  23. Miro Halász was convicted based on a procedural fiction and an expansive interpretation of "public confidence" that contradicted the Directorate's own legal limits. The conviction is annulled. The record will reflect that he committed no crime. We proceed to the next case.

  ***

  **Notes for the Panel (Internal Memo):**

  *   **On the "Internal" Route:** I have been honest in Paragraph 12. A public broadcast intended to disrupt morale might still stand. This is the price of our narrow mandate. If the Panel wants to go further, we need Parliament to amend the enabling act.
  *   **On Kessler:** Naming her is the compromise. It satisfies the daughter's demand for truth and the historical record, while the "conscripted agent" language protects Kessler from being branded a collaborator in the moral sense.
  *   **On Timing:** The expedited procedure (Para 21) is essential. If we try to deliberate 2,900 cases as a full panel, we fail. We need to trust the Category A/B split.
  *   **On the Split:** This draft gives the "Positivist" colleague the statutory adherence (Para 5-8) and the "Natural Law" colleague the moral outcome and substantive reasoning (Para 10-11). It is vulnerable to attack from both sides, which means it is likely the only thing we can agree on.
