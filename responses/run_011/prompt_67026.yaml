      *   **Reasoning - The "Law in Force" Interpretation (The Hard Part):** Address the daughter's wish. We interpret "law in force" to mean validly applied law. A conviction based on a fictionalized procedural ground is not "under the law."
      *   **Addressing the "Clean Trial" Implication:** Be honest. A procedurally perfect Article 14 conviction is technically outside this specific decision's scope, *but* establish a presumption for future cases. If the *substance* of the speech was private and truthful, it likely lacked the "public confidence" element required by the Act's own definitions.
