          7.  Propose the "Normative Constructivist" revision.

      *   *Cost Analysis:* Be honest. If they keep (2), they lose their applied job's theoretical foundation. If they drop (2), they lose philosophical "hardness" but save their career.

      *   *Single Revision:* Reframe (2). IUCs are not *empirical* facts but *normative* conventions required for policy.

      *(Self-Correction)*: Wait, I need to make sure I address the "vNM numbers don't mean anything extra" part of (1). If they are vNM, they *do* mean something extra (risk attitudes). I should point out that (1) is slightly sloppy but (2) is the fatal blow.

