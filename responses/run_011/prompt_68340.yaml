      *Wait, one nuance on Harsanyi:* Harsanyi's Social Aggregation Theorem requires that social preferences satisfy vNM axioms. If you want concavity (6), you are violating the vNM axioms at the social level (specifically, you are violating independence if you care about the *distribution* of outcomes rather than the expected utility sum). So (4) and (6) are mathematically incompatible unless you weaken (4).

