  2. **The Substrate Timing**
  If the substrate shifts only when you speak, isn't the utterance causing the shift? If the utterance causes the shift, how is it merely a report and not the mechanism itself?
  *Follow-up:* She'll say the rules cause the shift, words just trigger the update. But if the trigger is necessary and sufficient, doesn't that make it constitutive rather than descriptive?

  3. **The "Hereby" Asymmetry**
  "Hereby" slots happily into "I hereby fire you" but dies in "I hereby report that you are fired." If "hereby" is just a precision hedge on your story, why does it mark an asymmetry between acting and reporting?
  *Follow-up:* She'll say "hereby" points to the utterance as the trigger for the record update. But if the record update is the real mechanism, why does pointing to the utterance matter more than pointing to the record?

  4. **Misfires as False Reports**
  You turn Austin's misfires into false announcements about the substrate. But if I lack authority, Austin says the act fails to happen. On your view, am I just lying about a state of affairs that doesn't exist?
  *Follow-up:* She'll say yes, exactly, you are falsely announcing a change that the rules don't support. Then why does the law sometimes treat unauthorized acts as valid until voided?

  5. **Abuse and Intention**
  In abuse cases, like a joking marriage that lands on the record, the act succeeds despite wrong intentions. How does a mere announcement succeed when the speaker isn't actually reporting anything true?
  *Follow-up:* She'll say the substrate doesn't care about intentions, only the procedure and standing. But if the utterance is a report, what is it reporting if not the speaker's intent or the prior state?

  6. **Private Promises**
  Consider a deathbed promise no one hears. If obligation lives in others' dispositions to hold you to it, this should be inert. Is there no obligation here, or what carries it?
  *Follow-up:* She'll say there is no obligation, or the disposition is hypothetical. But we feel bound by private promises; aren't you denying the phenomenology of obligation entirely?

  7. **Retroactive Validation**
  Ratification rules validate past acts done without authority. On your view, the substrate wasn't there yet. How does the substrate reach backward in time to validate the earlier utterance?
  *Follow-up:* She'll say the validation creates a new substrate state that reclassifies the past. But if the earlier utterance was a false announcement then, how does it become true now?

  8. **Notational Variance**
  If every declaration is just announcement-plus-machinery, is there any observation your view makes that Austin's doesn't? Your likely answer is predicting failure, but felicity conditions already do that.
  *Follow-up:* She'll say her view explains *why* the conditions exist, not just that they do. But if the explanation doesn't change the predictions, isn't this just ontological parsimony at the cost of linguistic fit?

  9. **Machine Declarations**
  Can a smart contract issue a declaration? Does your view make machine declarations easier to swallow than Austin's, and do you want that consequence?
  *Follow-up:* She'll say yes, machines can update records, so they can declare. But if declarations require authority, can code have standing, or doesn't your view collapse back into requiring a human substrate anyway?

