  (1) "What kind of problem this is"
  This is the problem of institutionalization, specifically the tension between the *logic of membership* and the *logic of influence*. You are encountering the classic dilemma of whether political organizations inevitably betray their founding aims to survive. This belongs to the debate over whether bureaucracy is a neutral tool for power or a substantive force that reshapes purpose. You are asking if the vessel has become the cargo. The situation is not personal fatigue but a structural crisis of representation. It echoes the conflict between value-rational action (acting on principle) and instrumental-rational action (acting for success). Your question is whether the machinery required to win power consumes the purpose for which power was sought. This is a dispute about political ontology: does the form determine the outcome, or do the people determine the form?

  (2) "The ordinary-cost view"
  Your colleague articulates the realist position associated with Robert Michels and Max Weber. They argue that any mass organization requires specialization, leading to a leadership class focused on perpetuation. This is not corruption but efficiency. To influence legislation, you need votes; to get votes, you need members; to keep members, you need visible action, even if symbolic. The bylaw ensures message discipline; the expulsion protects the brand from fragmentation. The shift in campaigns reflects a long-term strategy: build capacity now to win later. Your cognitive shift is simply professionalization—learning the constraints of the possible. The cost of effectiveness is the dulling of radical edges. Without this structure, you remain a debating society that changes nothing. The ordinary-cost view absorbs your complaints as necessary taxes on power. It argues that the eviction ordinance was a lucky anomaly, while the current stability is the hard work of politics. Survival is the prerequisite for all other goods. It posits that moral purity is a luxury of the powerless. If you want to govern, you must manage. The organization is not a moral community but a vehicle for aggregate will, requiring friction reduction.

  (3) "The defect-in-the-form view"
  Your friend argues from the tradition that means prefigure ends, echoing libertarian socialist critiques of vanguardism. If you build a hierarchy to fight housing injustice, you replicate the power dynamics that cause injustice. This is not accidental but systemic. The bylaw transforms members from agents into instruments; dissent becomes dysfunction rather than contribution. The expulsion confirms that organizational survival outweighs truth. Your changed habit of mind is the most damning evidence: you are no longer thinking politically but administratively. You anticipate the consensus rather than seeking the right. This explains the ordinance: it came when you were a network of equals debating ideas, not a hierarchy managing brands. The formal party structure filters out complex truths in favor of actionable slogans. The form selects for loyalty over competence. Therefore, the failure to match the ordinance is not bad luck; it is the expected output of a machine designed for reproduction rather than resolution. The structure makes you resemble the landlords you oppose because both prioritize asset (party/property) protection over human need. This view holds that institutional isomorphism ensures you become what you fight. The cognitive change you describe is internalized coercion. The organization does not just limit your actions; it limits your imagination. You cannot solve housing crises with a mindset trained to prioritize recruitment over wins. When the friend says the resemblance is not an accident, she means the incentives of the party form—vote maximization, brand protection, leadership stability—are identical to the incentives of the capitalist firms you oppose. Both must grow to survive. Both must suppress internal friction. The expulsion was not a mistake; it was the system functioning correctly to remove a variable that threatened growth. The ordinance happened *because* you lacked the form that now prevents such innovation. Institutions develop their own teleology. The party is no longer a tool for housing justice; housing justice is a tool for the party. The bylaw is not discipline; it is the silencing of the political faculty. You are experiencing what happens when the medium becomes the message. The cognitive shift you fear is the final stage of co-optation: you police yourself. The organization no longer needs to expel you because you have internalized its limits. This is why the friend says the defect lies in the form. A different form—the journal, the loose association—allowed for truth-seeking because it had no survival instinct. The party has a survival instinct, and it now dictates your cognition.

  (4) "Where the two come apart"
  The divergence lies in temporality and causality. The ordinary-cost view claims the betrayal is temporary: we consolidate now to liberate later. The defect-in-form view claims the betrayal is permanent: the consolidation *is* the liberation's end. A discriminating test is whether gaining more power corrects the behavior. If winning three council seats restores independent thinking, the colleague is right. If it increases discipline and risk-aversion, the friend is right. The ordinary-cost view struggles to explain why the *capacity* for policy innovation (the ordinance) vanished as capacity for recruitment grew. It treats the loss of internal democracy as a tax; the defect view treats it as a structural elimination of the very faculty needed to identify justice. If the organization cannot distinguish between winning and recruiting, it has lost its political compass, not just its efficiency. The key evidence is whether the leadership can admit error. If the executive cannot reopen positions without self-harm, the form is rigid. If they can, it is flexible. You must watch if power leads to openness or closure. The ordinary-cost view is insulated from failure by claiming every setback requires more organization. The defect view is falsifiable: if a loose network achieves more than the party, the form is the barrier. You are living inside that falsification test.

  (5) "The three options"
  Option (a) assumes the structure can be self-correcting. If the defect is in the form, procedural tweaks are absorbed by the leadership's survival instinct. The executive will not vote to reduce its own power. You cannot legislate against the iron law of oligarchy using the oligarchy's own rules. Option (b) preserves your integrity but accepts the colleague's premise that you will be ineffective. It is honest but politically quietist. It returns you to the journal phase but without the collective leverage. Option (c) is the most philosophically consistent with the friend's view but practically impossible. It is a performative act rather than a strategy. However, proposing it forces a vote that reveals the organization's true priority: survival or mission. If (c) is laughed down, the friend is vindicated. If (a) is chosen, you must accept you are managing a bureaucracy, not leading a movement. (b) is the only exit that preserves your agency without demanding the organization suicide it will not commit. Yet (b) risks irrelevance. You must decide if being right without power is better than being complicit with it. Option (a) is likely to fail because the incentives remain. Option (c) is a noble failure. Option (b) is a retreat that allows you to think again. The choice is between being a gear in a machine or a voice outside it. If you stay for (a), you become the mechanism of your own constraint. If you leave for (b), you regain your mind but lose the megaphone. The critical flaw in (a) is that it requires the executive to act against its own structural interest. The bylaw protects them; removing it exposes them to dissent. They will not do it.

  (6) "My recommendation"
  Pursue (b), but frame it as (c). Propose the dissolution publicly. When it fails, leave. The cost is your seat at the table and social capital. You will be labeled a purist. Evidence you are wrong: if the party, after your departure, passes a significant housing reform without your input, proving the structure works. If they merely grow larger while doing less, you were right. Do not stay to fight the form; the form has already won inside you. Your cognitive shift is the warning sign. Leave before you forget why you started. Make the exit a test of the organization's soul. The risk is irrelevance; the cost of staying is self-erasure.
