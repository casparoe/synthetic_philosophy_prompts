  ### The Debrief: Mapping the Beats

  1.  **The Exhaustion of Round 1 (0:05–0:25):**
      *   **Chapter Claim:** *"Man is created a rebel... can one live by rebellion?"*
      *   **Mapping:** When they failed to get unanimous votes, they felt the friction of free will. The lack of points wasn't punishment; it was the natural cost of disagreement.
      *   **What will go wrong:** They will laugh off the failures. "It was just a game."
      *   **Improvisation:** Point to the Whiteboard. "You wanted that number. You didn't get it because you wanted different things. That is the human condition."

  2.  **The Forced Selection (0:25–0:35):**
      *   **Chapter Claim:** *"They will lay their freedom at our feet and say: Make us your slaves."*
      *   **Mapping:** They didn't want to choose the Keeper, but they wanted the points more. They sacrificed the individual to save the group score.
      *   **What will go wrong:** They will try to vote for someone who "likes being bossy."
      *   **Improvisation:** Remind them: "You were told if you didn't choose, I would pick the person who disagreed most. You chose to spare the awkward person, or you chose the efficient one. Either way, you handed over the burden."

  3.  **The Scribes' Knowledge (0:35–1:05):**
      *   **Chapter Claim:** *"We shall tell them that every sin will be expiated... we have taken it upon ourselves."*
      *   **Mapping:** The 3 knowledgeable participants held the truth (the Stress limit). They allowed the Keeper to suffer to keep the Residents calm. They are the Church hierarchy.
      *   **What will go wrong:** The Scribes might give advice ("You're close, be careful").
      *   **Improvisation:** Stop them. "You are the archive. You do not advise. You only confirm reality." This reinforces the cold mercy of the institution.

  4.  **The Guest's Silence (1:05–1:15):**
      *   **Chapter Claim:** *"He kissed the old man on the bloodless lips."*
      *   **Mapping:** If the Guest speaks, the game breaks (Freedom destroys Order). If the Guest is silent, the Order stands, but the injustice remains. The silence validates the Keeper's necessity while condemning his soul.
      *   **What will go wrong:** The Guest might feel powerless or ignored.
      *   **Improvisation:** In debrief, ask the Guest: "Did you feel powerful or powerless?" The answer should be "Both." That is the Christ figure.

  5.  **The Score Reveal (1:15–2:00):**
      *   **Chapter Claim:** *"Bread first, virtue later."*
      *   **Mapping:** Show them the Tranquility Score. It's high. Ask: "Was it worth the Keeper's Stress? Was it worth the Guest's silence?"
      *   **What will go wrong:** They will say "Yes, we won."
      *   **Improvisation:** "You won the game. You lost the argument. That is the point."

  ### Limitations & Honest Assessment

  **What will go wrong the first time:**
  *   **Gamification:** Participants will try to "hack" the scoring rather than feel the weight. They will treat the Keeper as a tool, not a person.
      *   *Fix:* In the debrief, force the Keeper to speak first. "How much did you want to quit?" Make it personal before it becomes philosophical.
  *   **The Scribes:** They might feel superior or giggly about knowing the rules.
      *   *Fix:* Brief them beforehand that their role is *burdensome*. They carry the secret that could save the Keeper, but their rules forbid it.
  *   **The Silence:** The Guest might speak out of awkwardness.
      *   *Fix:* Tell the Guest explicitly: "Your silence is the only way the group wins. If you speak, you destroy their work. Can you hold that?"

  **What index cards cannot reproduce:**
  *   **Theological Weight:** In the chapter, the stakes are eternal souls. In your room, the stakes are "Tranquility Points." You cannot simulate the fear of God with markers.
  *   **The Kiss:** The physical act of love that overrides the logic of the argument is impossible to gamify. A game is logic. The Kiss is anti-logic.
  *   **Your Supply:** You must supply the *love* in the prose. The workshop gives you the *logic* of the trap. You have to write the moment the character realizes the trap is a gift. That emotional turn—the relief of surrender—cannot be simulated in a group setting because it is deeply private. You will have to write that from your own quiet.

