  2.  **Deconstruct the Framework ("Per-Hectare Ledger"):**
      *   $L = \sum (p \times w \times d \times i)_{\text{harmed}} + \sum (p \times w \times d \times i)_{\text{counterfactual}}$
      *   Standard View: Focus on the first sum (suffering caused by spraying). $p$ is low, but $N$ is huge. Solution: Minimize $i$ (intensity) and $d$ (duration) via humane insecticides. Ignore second sum (population ethics).
      *   Target View (My Task): The second sum dominates. If average insect life is net negative ($<0$), preventing existence is good. Aggressive suppression prevents more lives than targeted spraying.

  3.  **Drafting - Section by Section (incorporating the 5 required points):**

      *   **Introduction:** Acknowledge the framework. State the thesis clearly: The "Negative Utilitarian" or "Antinatalist" turn in insect ethics implies that *existence* is the primary harm, not *death*.

      *   **Point 1: The Sign of Average Insect Life (Net Negative?)**
          *   *Requirement:* What must be true? Is there evidence?
          *   *Reasoning:* For aggressive suppression to be good, $E[\text{Life Value}] < 0$.
          *   *Evidence:* r-selection strategy. High mortality, short lives, constant predation/starvation risk. No parental care.
          *   *Labeling:* Consensus that $r$-selected lives are harsh. Disputed whether "harsh" = "net negative hedonic tone."
          *   *Argument:* Even if sentience probability ($p$) is low, the sheer magnitude of suffering events (being eaten alive) vs. fleeting rewards (eating a leaf) suggests negative expectation.

      *   **Point 2: Asymmetry (Killing vs. Preventing Existence)**
          *   *Requirement:* Address person-affecting views and ongoing psychology.
          *   *Reasoning:* Person-affecting views say "you can't harm someone who doesn't exist." But insects likely lack the psychological continuity (memory, future planning) that makes "deprivation of future" the main harm of death.
          *   *Argument:* If an insect lives in the "eternal now," death isn't a deprivation of a meaningful future; it's just the cessation of current state. Therefore, the harm of killing is low. The benefit of preventing a negative life is high. The asymmetry collapses or flips.
          *   *Labeling:* Highly contested in meta-ethics. Standard view favors asymmetry. My argument challenges applicability to non-persons.

      *   **Point 3: Alternative Frameworks (Total vs. Average vs. Flourishing)**
          *   *Requirement:* Does the argument survive swapping utilitarianisms?
          *   *Total Util:* Yes, if lives are negative, fewer lives = less total suffering.
          *   *Average Util:* Tricky. If you kill the suffering ones, average might go up. But if you prevent the *worst* lives (larvae in pest outbreaks), average improves.
          *   *Person-Affecting:* Weakens the argument significantly (see Point 2).
          *   *Flourishing/Capabilities:* If "flourishing" requires stability/resources, pest outbreaks are *anti*-flourishing (boom-bust cycles). Suppression stabilizes the niche.
          *   *Labeling:* Total Util is the engine here. Average/Flourishing requires more contortions.

      *   **Point 4: The Ecology Objection (Replacement & Trophic Cascades)**
          *   *Requirement:* This is the "real problem." Suppressed populations get replaced.
          *   *Reasoning:* If I kill aphids, ladybugs starve or move. If I kill pests, secondary pests emerge.
          *   *Counter-Argument:* The *quality* of the replacement life matters. Pest outbreaks represent hyper-suffering (density-dependent disease, starvation). A stable, lower-density ecosystem might have fewer total individuals but higher quality of life. Or, agricultural monocultures are suffering factories compared to diverse ecosystems.
          *   *Aggressive Stance:* If the goal is minimizing total sentience in a suffering-prone niche, sterilization or habitat destruction (removing the crop niche entirely) might be better than spraying. But sticking to the prompt: Aggressive suppression reduces the *boom* phase of the boom-bust cycle, which is where the bulk of suffering occurs.
          *   *Labeling:* Ecological consensus is that niches fill. Ethical interpretation of *which* filled niche is better is live/disputed.

      *   **Point 5: Robustness**
          *   *Requirement:* Does this win under one stack or many?
