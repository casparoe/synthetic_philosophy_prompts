prompt: |-
  I'm the science lead on a small mission-review panel. Roughly twice a year an instrument team or a lab comes to us with something in the "we think we found life" family, and we have to decide whether what they're reporting actually counts as evidence of it. The panel is geochemists and engineers, nobody who's read a page of philosophy since undergrad, and the last three times we went around in circles for a full day and then split the vote on vibes. Our funder's rulebook only has two boxes — detected, not detected — and half the panel thinks that's a joke, so I'd like the procedure to let us report something graded when the evidence is graded, without turning into a numbers theater exercise.

  So: write us a decision procedure we can actually run on a claim, grounded in whatever the conceptual work on defining life really has to say — that old NASA working definition of life as a self-sustaining chemical system capable of Darwinian evolution and the standard complaints about it, the metabolism-first vs replicator-first disagreement, and the usual mess of borderline cases (viruses, prions, dormant spores, mules, flames, crystals, that sort of thing) — but translated into an ordered list of questions a non-specialist can answer about a specific claim. For each question tell me what counts as a good enough answer, what a yes or a no does to the case, and, crucially, flag the ones where the question isn't factual at all but a decision about what we want the word to mean; those are the ones we should escalate to a vote instead of arguing about for six hours. Constraints: one 90-minute meeting per claim, so if it can't be run in about an hour it's useless to us, and whatever it outputs goes into a press release, so a false positive is a lot worse than a shrug. Also be honest about where the procedure will misfire and what it flatly cannot settle.

  Then run it on three claims sitting on my desk right now:

  1. A plume sample from an icy moon. Mass spec shows a 4% excess of one amino-acid handedness over the other, plus a polymer made of repeating units that don't match anything in our contamination catalog. Imager: nothing that looks like a cell. Team says life, and says the chirality number settles it.
  2. A lab report on a flow reactor running a set of mutually catalyzing reactions. It's been self-sustaining for about 400 days, it recovers when perturbed, and its composition drifts over time — but nobody has ever seen it produce a catalyst that wasn't already in the network. The authors want to call it protocellular life; their reviewers say it's chemistry in a fancy box.
  3. An Earth claim about a newly described infectious protein particle that templates its own folded shape onto normal copies of the protein. No nucleic acid, no metabolism of its own, no lineage you could put a mutation in. One of our members is convinced this is the case the whole debate has been hiding from.

  Give me the procedure first, then a worked pass on each of the three, including the graded output for each, and make sure at least one of the three comes out with an answer that's going to annoy half my panel. Where the procedure punts to a vote, say so plainly and tell me what the vote is actually about.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure and analysis:

  1.  **Analyze the Request:**
      *   **Role:** Science lead on a small mission-review panel.
      *   **Audience:** Geochemists and engineers (pragmatic, not philosophers).
      *   **Problem:** "We think we found life" claims come in twice a year. Current process leads to circular arguments and split votes on "vibes." Funder requires "Detected/Not Detected," but panel wants graded evidence.
      *   **Goal:** A decision procedure grounded in conceptual work on life (NASA definition, metabolism vs. replicator, borderline cases) but translated into an ordered list of questions for non-specialists.
      *   **Constraints:**
          *   Must run in ~60 minutes (within a 90-minute meeting).
          *   Output must be suitable for a press release (false positives are catastrophic).
          *   Must distinguish factual questions from definitional/philosophical ones (escalate the latter to votes).
          *   Must acknowledge limitations/misfires.
          *   Must apply the procedure to three specific cases (Icy Moon Plume, Flow Reactor, Prion-like Earth particle).
          *   At least one output must be annoying/controversial.
      *   **Tone:** Professional, pragmatic, honest about uncertainty, actionable.

  2.  **Deconstruct the Philosophy of Life (for Pragmatists):**
      *   *NASA Definition:* "Self-sustaining chemical system capable of Darwinian evolution."
          *   *Pros:* Functional, agnostic to substrate.
          *   *Cons:* Hard to verify evolution in real-time. "Self-sustaining" is vague (does a flame count?).
      *   *Replicator-First (Genetics):* Needs information storage, copying, mutation.
          *   *Issue:* Viruses? Mules?
      *   *Metabolism-First (Systems):* Needs energy flow, boundary, homeostasis.
          *   *Issue:* Flames, crystals, convection cells.
      *   *The "Vibes" Problem:* People argue about *what life is* instead of *what the evidence shows*.
      *   *Solution:* Separate *Evidence Strength* from *Classification Label*. Use a "Confidence Matrix" rather than a binary switch.

  3.  **Drafting the Procedure (The "Life Evidence Assessment Protocol" - LEAP):**
      *   *Time Budget:* 60 mins total.
          *   Intro/Context: 5 mins.
          *   Phase 1 (Facts/Exclusion): 20 mins.
          *   Phase 2 (Criteria Scoring): 20 mins.
          *   Phase 3 (Definitional Votes & Synthesis): 15 mins.
      *   *Structure:* Needs to be a checklist that filters out contamination first, then assesses biological signatures, then assesses evolutionary potential.
      *   *Key Distinction:* Mark questions as [Factual] or [Definitional]. [Definitional] questions trigger a vote if consensus isn't reached.
      *   *Output:* Not just "Detected/Not Detected," but a "Confidence Level" (e.g., Confirmed, Strong Candidate, Ambiguous, Contamination Likely) mapped to the funder's boxes with a caveat.
      *   *False Positive Bias:* The procedure must be conservative. Extraordinary claims require extraordinary evidence.

  4.  **Refining the Questions:**
      *   *Q1: Contamination/Abiotic Null Hypothesis.* (Factual). If yes -> Stop.
      *   *Q2: Disequilibrium/Energy.* (Factual). Is there a thermodynamic anomaly?
      *   *Q3: Complexity/Specificity.* (Factual). Chirality, polymers, specific ratios.
      *   *Q4: Boundary/Compartmentalization.* (Factual/Mixed). Is it distinct from the environment?
      *   *Q5: Heredity/Evolution.* (Definitional/Factual mix). Can it copy with variation? This is the hardest one.
      *   *Q6: The "Flame Test".* (Definitional). Is this just complex chemistry?

  5.  **Developing the Graded Output:**
      *   Instead of "Detected," use levels:
          *   Level 5: Confirmed (Reproducible, Evolution observed).
          *   Level 4: Strong Evidence (Multiple biosignatures, abiotic ruled out).
          *   Level 3: Ambiguous/Interesting (One strong signature, abiotic possible).
          *   Level 2: Unlikely (Abiotic explains better).
          *   Level 1: Contamination/Null.
      *   Map to Funder: Level 4-5 = "Detected" (with caveats), Level 1-3 = "Not Detected" (but Level 3 gets a "Further Investigation" tag).

  6.  **Applying to Case 1 (Icy Moon Plume):**
      *   *Evidence:* 4% chiral excess, unknown polymer. No cells.
      *   *Analysis:* Chirality is strong but 4% is low (some abiotic processes do this). Unknown polymer is good. No cells is bad.
      *   *Procedure Result:* Likely Level 3 (Ambiguous).
      *   *Annoyance Factor:* Team says "Life." Procedure says "Not Detected/Ambiguous." This annoys the discovery team.
      *   *Definitional Vote:* Does chiral excess *alone* count as "self-sustaining"?

  7.  **Applying to Case 2 (Flow Reactor):**
      *   *Evidence:* Self-sustaining 400 days, homeostasis, composition drift. No new catalysts.
      *   *Analysis:* Meets Metabolism-First criteria (autocatalytic set). Fails Replicator-First (no new info/variation).
      *   *Procedure Result:* Level 3 or 4 depending on vote on "Evolution."
      *   *Annoyance Factor:* Chemists say "It's just chemistry." Biologists say "It's life." The procedure should force a vote on whether *drift* without *new catalysts* counts as evolution.
      *   *Decision:* Let's make this the "Annoying" one. If we rule it "Not Detected" because it can't evolve *new* traits, biologists get mad. If we rule "Detected," chemists get mad. Let's punt to a vote on the definition of "Darwinian."

  8.  **Applying to Case 3 (Prion/Protein Particle):**
      *   *Evidence:* Infectious protein, templates shape. No nucleic acid, no metabolism.
      *   *Analysis:* It replicates information (shape). It evolves (strains exist). But no metabolism.
      *   *Procedure Result:* Level 3 (Ambiguous). It fails the "Self-sustaining" (energy) test.
      *   *Definitional Vote:* Is a parasite that relies entirely on host metabolism "life"? (Virus debate).
      *   *Decision:* This is a classic virus/prion edge case. The procedure should flag this as a "Definitional Vote" regarding parasitism.

  9.  **Review and Refine:**
      *   *Time Check:* Can this be done in 60 mins? Yes, if the Chair keeps time.
      *   *False Positive Check:* The procedure prioritizes ruling out abiotic first.
      *   *Philosophy Check:* Does it address NASA def, metabolism vs. replicator? Yes, by splitting the criteria.
      *   *Constraint Check:* "One 90-minute meeting." "Output for press release." "Flag definitional questions."
      *   *Tone:* Needs to be direct, slightly weary of the "vibes" problem, but constructive.

  10. **Final Polish:**
      *   Ensure the distinction between [Factual] and [Definitional] is clear.
      *   Make sure the "Annoying" outcome is explicit.
      *   Ensure the "Limitations" section is honest.
      *   *Self-Correction on Case 2:* To make it truly annoying, I should ensure the procedure forces a "Not Detected" unless they vote to change the definition of evolution. Let's make the default conservative.
      *   *Self-Correction on Case 1:* 4% chirality is actually weak. Abiotic can do 1-2%, but 4% is suspicious. However, without cells or metabolism, it's just a chemical anomaly. I will grade this as "Not Detected (Ambiguous Biosignature)" which will annoy the team claiming "Life."
      *   *Self-Correction on Case 3:* Prions are generally not considered alive. The procedure should reflect that consensus unless voted otherwise.

      *(Self-Correction during drafting)*: Wait, the prompt asks for *one* of the three to come out with an answer that's going to annoy half the panel.
      *   Case 1 (Moon): Team wants "Life." Procedure says "No." (Annoys Team).
      *   Case 2 (Reactor): Authors want "Protocell." Chemists say "No." Procedure splits on definition. (Annoys one side).
      *   Case 3 (Prion): Member thinks it's the key. Consensus says "No." (Annoys that member).
      *   *Selection:* Case 2 is the best candidate for the "Annoying" outcome because it sits right on the Metabolism vs. Replicator fence. I will structure the procedure so that without *demonstrated heritable variation*, it defaults to "Not Detected," which will annoy the "Metabolism-First" proponents on the panel.

      *Wait, re-reading constraints:* "Make sure at least one of the three comes out with an answer that's going to annoy half my panel."
      Okay, I will ensure Case 2 results in a "Not Detected" despite the "self-sustaining" claim, because it lacks open-ended evolution. This annoys the systems-chemistry folks. Or I can make Case 1 "Detected" which annoys the conservative geochemists. Given the "false positive is a lot worse than a shrug" constraint, the procedure *must* be conservative. So Case 1 must be "Not Detected." Case 2 must be "Not Detected" (conservative). Case 3 must be "Not Detected."
      *Wait, if all are Not Detected, where is the annoyance?*
      The annoyance comes from the *reasoning* or the *Grade*.
      Let's make Case 2 the annoying one. The authors claim "Protocellular Life." The procedure will output "Level 3: Ambiguous Chemical System." This annoys the authors and the panelists who favor metabolism-first.
      Actually, let's look at Case 1. 4% chiral excess is *weak*. If the procedure says "This is worth a press release," geochemists will scream false positive. If it says "Ignore it," the discovery team screams.
      Let's go with Case 2 being the "Annoying" one because it forces a vote on whether "drift" equals "evolution."

      *Refining the Procedure Name:* "The Bio-Signature Confidence Protocol (BSCP)."
      *Refining the Output:* Needs to map to Funder's "Detected/Not Detected" but allow the "Graded" nuance in the text.
      *Mapping:*
      *   High Confidence -> Detected.
      *   Medium/Low -> Not Detected (with recommendation).

      *Let's finalize the Procedure Steps:*
      1.  Null Hypothesis (Contamination/Abiotic).
      2.  Agency (Boundary/Energy).
      3.  Information (Replication/Chirality).
      4.  Evolution (Variation/Selection).
      *Flag Definitional Questions.*

      *Let's write it.*
answer: |-
  # The Bio-Signature Confidence Protocol (BSCP)

  **Purpose:** To replace "vibes-based" adjudication with a standardized, time-boxed assessment of life-detection claims.
  **Time Budget:** 60 Minutes (within a 90-minute meeting).
  **Output:** A Confidence Level (1–5) mapped to the Funder's "Detected/Not Detected" requirement, with explicit caveats for press release use.
  **Bias:** Conservative. False positives are catastrophic; false negatives are publishable errors.

  ---

  ## Part 1: The Procedure

  ### Phase 1: The Null Hypothesis (20 Minutes)
  *Goal: Rule out contamination and known abiotic chemistry before discussing "life."*

  **Q1. [Factual] Is the signal explainable by instrument noise or known terrestrial contamination?**
  *   **Good Answer:** "Contamination controls are clean," or "Signal-to-noise is >5σ," or "Isotopic fractionation matches no known terrestrial source."
  *   **If NO:** Stop. Output **Level 1 (Contamination/Null)**. Map to Funder: **Not Detected**.
  *   **If YES:** Proceed.

  **Q2. [Factual] Is the signal explainable by known abiotic geochemistry/physics?**
  *   **Good Answer:** "No known abiotic process produces this polymer," or "Chiral excess exceeds known meteoritic/thermal limits."
  *   **If NO (Abiotic explains it):** Stop. Output **Level 2 (Abiotic Explains)**. Map to Funder: **Not Detected**.
  *   **If YES (Abiotic cannot explain):** Proceed.

  ### Phase 2: The Life Criteria (20 Minutes)
  *Goal: Assess the claim against the NASA definition (Self-sustaining + Darwinian) without getting stuck on semantics.*

  **Q3. [Factual] Is there a distinct boundary or compartment?**
  *   **Good Answer:** "Yes, membrane/vesicle observed," or "No, it is a bulk solution."
  *   **Note:** A "No" does not kill the claim (early life may lack boundaries), but it lowers confidence.

  **Q4. [Factual] Is there evidence of energy transduction (metabolism)?**
  *   **Good Answer:** "Chemical disequilibrium maintained over time," or "Uptake of specific substrates."
  *   **If NO:** Flag for **Definitional Vote A** (See Phase 3).

  **Q5. [Factual] Is there evidence of information storage and replication?**
  *   **Good Answer:** "Polymer templating observed," "Chiral homogeneity," or "Sequence inheritance."
  *   **If NO:** Flag for **Definitional Vote B** (See Phase 3).

  **Q6. [Factual] Is there evidence of variation subject to selection (Evolution)?**
  *   **Good Answer:** "Population drifts toward efficiency," "Mutations persist," or "No, composition is static or drifts randomly."
  *   **If NO:** Flag for **Definitional Vote C** (See Phase 3).

  ### Phase 3: Synthesis & Definitional Votes (20 Minutes)
  *Goal: Convert criteria into a Confidence Level. Escalate philosophical disagreements to a formal vote.*

  **Step 1: Calculate Preliminary Level**
  *   **Level 5 (Confirmed):** Q1-6 All YES. (Evolution observed in real-time).
  *   **Level 4 (Strong):** Q1-2 YES. Q4-6 Mostly YES. (Multiple biosignatures, abiotic ruled out).
  *   **Level 3 (Ambiguous):** Q1-2 YES. Q4-6 Mixed. (One strong signature, others missing).
  *   **Level 2 (Abiotic):** Q2 NO.
  *   **Level 1 (Null):** Q1 NO.

  **Step 2: The Definitional Votes**
  If any question in Phase 2 was flagged because the *interpretation* is disputed (not the data), hold a vote. **Do not argue the science; argue the definition.**
  *   **Vote A (Metabolism):** *Does a system without its own energy transduction count as "self-sustaining" if it relies on an external gradient?* (Relevant for parasites/viruses).
  *   **Vote B (Replicator):** *Does structural templating (e.g., crystals/prions) count as "information replication"?*
  *   **Vote C (Evolution):** *Does chemical drift without heritable variation count as "Darwinian evolution"?*

  **Step 3: Final Output**
  *   If Votes pass to upgrade a "No" to a "Yes": Adjust Level up by 1.
  *   **Funder Mapping:**
      *   Level 4-5 → **Detected** (Press Release: "Strong Evidence")
      *   Level 1-3 → **Not Detected** (Press Release: "No Confirmation" or "Ambiguous Biosignature")

  ---

  ## Part 2: Known Limitations (Read Before Use)
  1.  **The "Single Sample" Problem:** This procedure assumes you have enough data to rule out abiotic processes. If you have one mass spec reading, you will stall at Q2.
  2.  **The "Slow Life" Problem:** If evolution happens over 10,000 years, Q6 will always be "No." This procedure biases against slow life.
  3.  **The "Weird Life" Problem:** If life doesn't use polymers or chirality, Q2 and Q5 will fail. This procedure is Earth-biased by necessity of having *some* null hypothesis.
  4.  **The "Press Release" Trap:** A Level 3 ("Ambiguous") output *must* be mapped to "Not Detected" for the funder, even if the panel thinks it's exciting. Do not lie to the funder to get headlines.

  ---

  ## Part 3: Worked Pass on Current Claims

  ### Claim 1: Icy Moon Plume (Chirality + Unknown Polymer)
  *   **Q1 (Contamination):** [Factual] **YES.** Contamination catalog cleared.
  *   **Q2 (Abiotic):** [Factual] **MIXED.** 4% chiral excess is low (some meteorites show 1-2%). Unknown polymer is strong, but could be abiotic synthesis.
  *   **Q3 (Boundary):** [Factual] **NO.** Imager saw no cells/vesicles.
  *   **Q4 (Metabolism):** [Factual] **NO.** Single sample, no time-series.
  *   **Q5 (Replication):** [Factual] **MIXED.** Polymer implies synthesis, but templating unproven.
  *   **Q6 (Evolution):** [Factual] **NO.** Single snapshot.
  *   **Definitional Vote:** *Does 4% chiral excess + unknown polymer constitute "Strong Evidence" without cells?*
      *   **Vote Result:** Split. Geochemists say "No, mineral surfaces do this." Biologists say "Maybe."
  *   **Preliminary Level:** **Level 3 (Ambiguous).**
  *   **Funder Mapping:** **Not Detected.**
  *   **Press Release Line:** "Instrument detected complex organic molecules consistent with biological processes, but abiotic origins cannot be ruled out."
  *   **Panel Friction:** The Instrument Team will be furious. They want "Detected." The Procedure forces "Not Detected" because Q4 and Q6 are empty. This is the correct conservative call.

  ### Claim 2: Flow Reactor (Self-Sustaining Chemistry)
  *   **Q1 (Contamination):** [Factual] **YES.** Closed system.
  *   **Q2 (Abiotic):** [Factual] **YES.** Network is mutually catalytic; no known abiotic analog sustains for 400 days.
  *   **Q3 (Boundary):** [Factual] **YES.** Flow reactor walls act as boundary (or vesicles formed, unclear). Let's assume **YES** for "protocell."
  *   **Q4 (Metabolism):** [Factual] **YES.** Self-sustaining, recovers from perturbation.
  *   **Q5 (Replication):** [Factual] **NO.** No new catalysts produced.
  *   **Q6 (Evolution):** [Factual] **NO.** Composition drifts, but no *heritable* variation observed.
  *   **Definitional Vote C:** *Does chemical drift without heritable variation count as "Darwinian evolution"?*
      *   **The Vote:** This is the crux.
          *   *Option A (Strict):* No heredity = No evolution.
          *   *Option B (Loose):* Drift + Selection = Evolution.
      *   **Procedure Default:** Strict (to avoid false positives).
      *   **Panel Vote:** If you vote "Loose," you upgrade to Level 4. If you vote "Strict," you stay Level 3.
  *   **Preliminary Level:** **Level 3 (Ambiguous).**
  *   **Funder Mapping:** **Not Detected.**
  *   **Press Release Line:** "Researchers have created a self-sustaining chemical system, but it does not meet the criteria for biological evolution."
  *   **Panel Friction:** **This is the annoying one.** The "Metabolism-First" panelists will argue that homeostasis *is* life. The "Genetics-First" panelists will argue it's just a fancy flame. The Procedure forces a "Not Detected" unless you explicitly vote to change the definition of evolution. **Recommendation:** Hold the vote. If it fails, the authors will be annoyed their "protocell" is labeled "chemistry."

  ### Claim 3: Earth Infectious Protein (Prion-like)
  *   **Q1 (Contamination):** [Factual] **YES.** It's an infectious agent.
  *   **Q2 (Abiotic):** [Factual] **YES.** Proteins are biological.
  *   **Q3 (Boundary):** [Factual] **NO.** It's a protein particle.
  *   **Q4 (Metabolism):** [Factual] **NO.** Relies entirely on host.
  *   **Q5 (Replication):** [Factual] **YES.** Templates shape onto normal copies.
  *   **Q6 (Evolution):** [Factual] **YES.** Different "strains" exist with different folding properties.
  *   **Definitional Vote A:** *Does a parasite with no metabolism count as "self-sustaining"?*
      *   **The Vote:** This is the Virus Question.
      *   **Procedure Default:** No. (Viruses are generally "Not Detected" in life-finding missions).
      *   **Panel Vote:** If you vote "Yes," you acknowledge viruses are alive. If "No," they aren't.
  *   **Preliminary Level:** **Level 3 (Ambiguous).**
  *   **Funder Mapping:** **Not Detected.**
  *   **Press Release Line:** "Particle exhibits biological replication but lacks independent metabolic function."
  *   **Panel Friction:** The panelist convinced this is "the case" will be annoyed. The Procedure treats this as a borderline case (Level 3) because it fails the "Self-sustaining" clause of the NASA definition. It forces you to admit that by the standard definition, this is *not* life, even if it behaves like it.

  ---

  ## Summary of Outputs for Funder

  | Claim | Confidence Level | Funder Box | Press Release Stance |
  | :--- | :--- | :--- | :--- |
  | **1. Icy Moon** | Level 3 (Ambiguous) | **Not Detected** | "Intriguing organics, origin unknown." |
  | **2. Reactor** | Level 3 (Ambiguous)* | **Not Detected** | "Complex chemistry, not biological." |
  | **3. Prion** | Level 3 (Ambiguous) | **Not Detected** | "Replicating protein, not independent life." |

  *\*Note on Claim 2: If the panel votes to accept "chemical drift" as evolution, this bumps to Level 4 (Detected). This vote must be recorded in the minutes as a definitional change, not a scientific discovery.*

  ## Final Advice for the Chair
  When the panel starts arguing about Claim 2 (The Reactor), stop them. Say: *"You are not arguing about the data. You are arguing about Vote C. We are now voting on the definition of evolution. All in favor of counting chemical drift as Darwinian evolution?"*

  If that vote fails, the claim dies. If it passes, the claim lives. Make them own the philosophy, don't let them hide it behind "scientific interpretation." That is how you save the 90 minutes.
