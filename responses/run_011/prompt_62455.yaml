answer: |-
  **To:** The President and Faculty Advisor, Behavioral Economics Club
  **From:** Research Methodology Consultant
  **Subject:** Protocol Audit and Design Evaluation for Allais Paradox Study

  This document provides the numbered procedure you requested, the theoretical justification required for your faculty advisor, and a rigorous evaluation of your three proposed experimental designs. It is written to satisfy the scrutiny of college faculty judges while remaining accessible to high school researchers.

  ### Part 1: The Math Audit (For the Faculty Advisor)

  Your advisor's concern is whether the conclusion ("violation of Expected Utility Theory") depends on assuming a specific shape for the participants' utility functions (e.g., assuming they are risk-averse). **It does not.** This is the single most important theoretical point of your study.

  Expected Utility Theory (EUT) states that a rational agent chooses the option with the highest expected utility. Let $u(x)$ be the utility of receiving $x$ dollars. We assume $u(\$0) = 0$ for simplicity (this does not change the result).

  **The Four Options:**
  *   **A:** 100% chance of \$1M.
  *   **B:** 10% chance of \$5M, 89% chance of \$1M, 1% chance of \$0.
  *   **C:** 11% chance of \$1M, 89% chance of \$0.
  *   **D:** 10% chance of \$5M, 90% chance of \$0.

  **The Test:**
  If a participant prefers **A over B**, EUT requires:
  $$1.0 \cdot u(\$1M) > 0.1 \cdot u(\$5M) + 0.89 \cdot u(\$1M) + 0.01 \cdot u(\$0)$$
  Subtract $0.89 \cdot u(\$1M)$ from both sides:
  $$0.11 \cdot u(\$1M) > 0.1 \cdot u(\$5M) + 0.01 \cdot u(\$0)$$  *(Inequality 1)*

  If the *same* participant prefers **D over C**, EUT requires:
  $$0.1 \cdot u(\$5M) + 0.9 \cdot u(\$0) > 0.11 \cdot u(\$1M) + 0.89 \cdot u(\$0)$$
  Subtract $0.89 \cdot u(\$0)$ from both sides:
  $$0.1 \cdot u(\$5M) + 0.01 \cdot u(\$0) > 0.11 \cdot u(\$1M)$$ *(Inequality 2)*

  **The Contradiction:**
  Inequality 2 is the exact reverse of Inequality 1. It is mathematically impossible for both to be true simultaneously, regardless of whether the participant loves money linearly, is risk-averse (concave utility), or is risk-seeking (convex utility).

  **Conclusion for the Advisor:**
  If a single individual chooses A>B and D>C, they have violated the **Independence Axiom** of EUT. This conclusion holds without knowing their specific utility function. The study tests the *structure* of the choice, not the *value* of the money.

  ---

  ### Part 2: The Experimental Procedure

  **Objective:** To identify the percentage of participants whose initial choices violate the Independence Axiom.
  **Time:** 40 Minutes.
  **Budget:** \$50.00.

  #### Phase 1: Preparation
  1.  **Print Materials:** Create two versions of the survey to control for order effects.
      *   *Version 1:* Question Pair 1 (A vs B), then Question Pair 2 (C vs D).
      *   *Version 2:* Question Pair 2 (C vs D), then Question Pair 1 (A vs B).
      *   *Reasoning:* If everyone sees A vs B first, they might feel "committed" to a risk profile. Randomizing order checks if the violation is robust.
  2.  **Incentive Protocol (If using real pay):** Because \$50 cannot cover 50 students at meaningful stakes, use the **Random Lottery Incentive System**.
      *   Tell students: "One participant will be drawn at random at the end. That person will receive the cash outcome of *one* of their choices, determined by a die roll."
      *   *Note:* This makes every choice potentially "real" for every student, satisfying incentive compatibility without blowing the budget.
  3.  **Comprehension Check:** Draft a simple quiz (e.g., "If you choose Option B, what is the percent chance you get nothing?").

  #### Phase 2: Execution (In the Session)
  4.  **Consent and Instructions (5 mins):** Explain the task. Emphasize there are no right or wrong answers, only preferences.
  5.  **Comprehension Check (5 mins):** Administer the quiz.
      *   *Rule:* Any student who fails the check must be tutored by a club member until they pass. Do not record data for students who cannot demonstrate they understand probabilities.
  6.  **Private Choice Task (10 mins):** Distribute surveys (mixed Versions 1 and 2).
      *   Instruct students to circle their preference for each pair privately.
      *   **Crucial:** Do not allow discussion between students.
  7.  **Collection of Initial Data (5 mins):** Collect the surveys.
      *   *Data Point 1:* Record the initial choice (A or B; C or D). This is your data for the paradox test.
  8.  **Reflection Phase (10 mins):** Return surveys to students.
      *   Display the algebra from Part 1 on the board (simplified).
      *   Say: "Mathematically, choosing A over B and D over C is inconsistent under standard economic theory. Look at your choices. Do you wish to change either answer now that you see the relationship?"
      *   Allow them to cross out and change an answer in a different color pen.
      *   **Data Point 2:** Record the final choice.
  9.  **Debrief and Payment (5 mins):** Explain the study's purpose. If using real incentives, conduct the random draw publicly.

  #### Phase 3: Analysis
  10. **Identify Violations:**
      *   A participant is a "Violator" if their **Initial Choice** was (A > B) AND (D > C).
      *   *Note:* The reverse pattern (B > A and C > D) is also a violation, though rare.
  11. **Calculate Rate:** Divide the number of Violators by the total number of valid participants.

  ---

  ### Part 3: Limitations and Judgment Calls

  You must be honest about what this study cannot prove. Include this section in your symposium report.

  **1. Judgment Call: Comprehension vs. Preference**
  *   *Issue:* If a student violates the axiom, is it because they are "irrational" or because they misunderstood the 89% vs 90% distinction?
  *   *Procedure:* You rule this out via the Comprehension Check (Step 5).
  *   *Limitation:* You cannot rule out that they understood the math but processed the probabilities psychologically (e.g., treating 0% and 1% as categorically different). This is a feature of human psychology, not necessarily a bug in their logic.

  **2. Judgment Call: The "Irrational" Label**
  *   *Forbidden:* Do not state that participants are "irrational."
  *   *Permitted:* State that participants are "inconsistent with Expected Utility Theory."
  *   *Reasoning:* EUT is a model, not a law of physics. If the data doesn't fit the model, the model may be too narrow, not the human broken. Many Nobel laureates (like Kahneman) argue the Allais Pattern is a rational response to the *certainty* of Option A.

  **3. Limitation: Hypothetical Bias**
  *   If no real money is at stake, students may answer carelessly. A violation in hypothetical choices does not prove they would risk real money the same way.

  **4. Limitation: Sample Size**
  *   With 50 students, if you find 10 violators (20%), your margin of error is high. Do not claim this percentage applies to "all teenagers" or "all humans." Claim it applies to "this sample of 50 volunteers."

  ---

  ### Part 4: Evaluation of Your Three Designs

  Here is the audit of the three specific designs you proposed.

  #### Design 1: Hypothetical Payoffs, Millions, Within-Subject (Sequential)
  *   **Procedure:** All 50 students see both choice pairs in one sitting. Money is hypothetical (\$1M+).
  *   **What the Procedure Requires:** Strict anonymity to prevent peer influence. Strong comprehension checks to ensure they treat the hypothetical seriously.
  *   **Permitted Conclusion:** "In this sample, X% of students exhibited choice patterns inconsistent with the Independence Axiom when stakes were hypothetical."
  *   **Forbidden Conclusion:** "Students are irrational" or "Students would make these choices with real money."
  *   **Verdict:** **Acceptable for a high school study.** This is the standard pedagogical approach. It isolates the theoretical violation without budget constraints. Judges will accept this *if* you admit the "hypothetical bias" limitation in your discussion.

  #### Design 2: Real Token Payment, Between-Subject (Split Groups)
  *   **Procedure:** Group 1 sees A vs B. Group 2 sees C vs D. One choice is implemented for real.
  *   **What the Procedure Requires:** Random assignment of students to Group 1 or 2.
  *   **Permitted Conclusion:** "X% of Group 1 chose A" and "Y% of Group 2 chose D."
  *   **Forbidden Conclusion:** "Participants violated the Independence Axiom."
  *   **Verdict:** **Condemned.** Do not use this design.
      *   *Reason:* The Allais Paradox is a test of *individual* consistency. If 60% of Group 1 chooses A, and 60% of Group 2 chooses D, you cannot conclude that any *single person* chose A and D. It could be that the "Risk Averse" people were all in Group 1 and the "Risk Seeking" people were all in Group 2.
      *   *Budget Issue:* You cannot pay "millions" with real tokens. If you scale down the money to fit the \$50 budget but keep the between-subject design, you still cannot test the axiom because you never observe the *pair* of choices from one person.

  #### Design 3: Scaled-Down Amounts (Single Digits), Within-Subject
  *   **Procedure:** All 50 students see both pairs. Amounts are \$10, \$50, etc. Real or hypothetical payment.
  *   **What the Procedure Requires:** Ensuring the scale is meaningful. \$10 might be "lunch money" to a junior; \$1M is "life changing."
  *   **Permitted Conclusion:** "Students exhibited the Allais pattern with small stakes."
  *   **Forbidden Conclusion:** "This proves the Allais Paradox holds for high stakes."
  *   **Verdict:** **Risky, but usable.**
      *   *Risk:* Risk attitudes change with scale. People are often risk-neutral with \$10 but risk-averse with \$10,000. If you find *no* violations with \$10 stakes, judges might argue you simply didn't trigger the "certainty effect."
      *   *Recommendation:* If you use real money (Design 2's incentive idea), you *must* use scaled-down amounts (Design 3's values). However, you must keep the **Within-Subject** structure of Design 1.
      *   *Best Hybrid:* Use Design 1's structure (Within-Subject) but use Design 3's values (\$10/\$50) *if* you are implementing real payments. If payments are hypothetical, stick to Design 1 (Millions) because the intuition is clearer.

  ### Final Recommendation for the Club

  To withstand scrutiny at the regional symposium:

  1.  **Reject Design 2 entirely.** It cannot answer your research question.
  2.  **Adopt Design 1 (Hypothetical, Millions, Within-Subject).** It is the cleanest test of the theory. Your budget is too small for meaningful real incentives for 50 students (paying \$1 each is negligible; paying one student \$50 introduces noise).
  3.  **Implement the Reflection Phase.** Judges love this. It shows you understand that the goal is learning, not just "catching" students. Record both Initial and Final choices.
  4.  **Write the Limitations Section.** Explicitly state: "We do not claim participants are irrational. We claim their choices violate the Independence Axiom of EUT. We do not claim this would happen with real life savings."

  **Checklist for your Advisor:**
  *   [ ] Does the algebra in Part 1 make sense to you? (If not, do not sign off).
  *   [ ] Do you agree that we are testing *consistency*, not *correctness*?
  *   [ ] Do you agree that Design 2 is mathematically incapable of testing individual consistency?

  If you follow this protocol, your conclusions will not outrun your design. You will have measured exactly what you claim to measure, and nothing more.
