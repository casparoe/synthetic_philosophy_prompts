      *   *Check:* Did I address the "identity claim" in Section 4? *Adjustment:* Clarify the difference between FEP as a necessary condition for existence vs. a sufficient condition for specific behavior.
      *   *Check:* Is the Dark Room analysis nuanced? *Adjustment:* Ensure I don't just say "priors solve it." I need to explain *why* that might be unsatisfying (the origin of priors).

  9.  **Final Review against Prompt:**
      *   1. Reconstruct Collapse Objection (Represent vs. Explain).
