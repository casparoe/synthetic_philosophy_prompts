prompt: |-
  So I'm partway through a pop philosophy book about the limits of what science can tell us — not an academic press thing, but the author clearly knows the material, and there's a passage summing up Kripke on the necessary a posteriori that I want to check before I repeat any of it to people. I took a philosophy of language course about ten years ago and I remeber the water/H2O example but basically none of the details, so I can't tell how much of this is safe to trust. Here's the passage, split into sentences and numbered so we can talk about them:

  1. Kripke's big result is that necessity and apriority come apart: some truths had to be true but can only be found out by experiment, while others can be known without any experiment at all and yet could have been false.
  2. The trick is the idea of a rigid designator, a term that picks out the very same thing in every possible world instead of picking out whatever happens to fit a description.
  3. So "water" isn't shorthand for clear, drinkable, lake-filling liquid; it points at the actual stuff around here, and once chemists established that the stuff is H2O, it turned out that water being H2O is necessary.
  4. There's no possible world where water isn't H2O — a world with a lookalike liquid in the lakes would be a world containing a different substance, not a world containing water.
  5. Same with the evening star and the morning star: the identity is necessary, which is why the ancient astronomers were making a real discovery rather than a trivial one when they worked out that Hesperus and Phosphorus were the same planet.
  6. He clinched it with the thought experiment about another planet where the rain and the lakes are made of a different chemical, XYZ, that's locally indistinguishable from water, and that's what proves the meaning of "water" can't be a list of properties.
  7. The deeper point is that necessities of this kind ride on science: water is necessarily H2O because that's what chemistry turned up, so if a future chemistry showed that what we call water is really a mixture of H2O and something else, the necessity would come apart with it — these necessary truths are only ever as secure as the evidence that got us to them.
  8. That's why Kripke usually gets the credit for collapsing the analytic/synthetic distinction: he showed there are necessary truths that aren't true in virtue of meaning, and contingent ones we know a priori, like the stipulation that the standard bar in Paris is a metre long.

  Sentence 7 is the one that hooked me, and it's also the one my friend says is incoherent — his line is that you can't have a necessary truth that science might overturn, that's a contradiction in terms, so the whole book is sloppy. I want to know whether he's right or whether there's a legitimate version of what the author is reaching for, because the passage reads like someone gesturing at something real and missing it by a bit. And on sentence 8, I always thought the analytic/synthetic business was Quine's achievement, but I could easily be misremembering who did what.

  Can you go through the passage and tell me what to keep and what to throw out? I'd like a table, one row per numbered sentence, with exactly these columns: **sentence** (just the number plus a three-to-five word tag, don't reproduce the whole thing), **verdict**, **what's right about it**, **what's wrong or misleading**, **correction** (what a philosopher of language would say instead, in plain language), and **settled or contested**. For verdict only use these four values: accurate, defensible simplification, subtly wrong, wrong. If a verdict turns on a live disagreement rather than something settled, say that in the last column and briefly what the disagreement is, instead of picking a side and sounding confident about it. Keep cells to a sentence or two each.

  Then after the table, two short paragraphs, no headers needed: one on sentence 7, saying whether my friend's charge is fair and whether there's a defensible core underneath the error, and if there is, what the move is that rescues it; and one on sentence 8, saying whether the author's conclusion survives once the errors are fixed and whether the credit goes where they put it. No bibliography or reading list — I'm not going to look anything up, I just want to know what to believe and what to stop repeating at parties.
