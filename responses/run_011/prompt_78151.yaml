  | sentence | verdict | what's right about it | what's wrong or misleading | correction | settled or contested |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | 1. Necessity and apriority come apart | accurate | Correctly states Kripke's core thesis separating metaphysical modalities from epistemic ones. | None; this is the standard summary of *Naming and Necessity*. | Necessity concerns how the world is, apriority concerns how we know it. | Settled; this is Kripke's main contribution. |
  | 2. Rigid designator picks same thing | accurate | Correctly defines rigid designators in contrast to Fregean descriptions. | None; the definition is standard and clear. | A rigid designator refers to the same object in all possible worlds where it exists. | Settled; standard terminology. |
  | 3. Water points at actual stuff | accurate | Captures the causal-historical theory of reference fixing correctly. | None; it simplifies the mechanism but retains the philosophical point. | Reference is fixed by ostension to samples, not by a list of descriptions. | Settled; standard causal theory view. |
  | 4. No possible world without H2O | accurate | Correctly states the metaphysical necessity of identity for natural kinds. | None; this follows directly from rigid designation of natural kind terms. | If it isn't H2O, it isn't water, regardless of superficial properties. | Settled; standard Kripkean view. |
  | 5. Hesperus Phosphorus identity necessary | accurate | Uses a canonical example of necessary a posteriori identity statements. | None; Kripke explicitly uses this case to illustrate the point. | Identity statements between rigid designators are necessary if true. | Settled; standard example. |
  | 6. XYZ thought experiment proves meaning | subtly wrong | Correctly argues that meaning isn't just a list of superficial properties. | Attributes Putnam's Twin Earth XYZ example to Kripke instead of Putnam. | Putnam introduced XYZ; Kripke used examples like heat or gold. | Settled; historical attribution is clear. |
  | 7. Science overturns necessary truths | subtly wrong | Acknowledges that empirical evidence for essences is fallible and revisable. | Confuses epistemic revisability with metaphysical contingency; necessity doesn't change. | If science changes, we were wrong about the essence, not that necessity changed. | Contested; Kripkeans say necessity is stable, two-dimensionalists disagree. |
  | 8. Kripke collapses analytic synthetic distinction | wrong | Correctly notes Kripke showed necessary truths aren't always analytic. | Quine attacked the analytic/synthetic distinction; Kripke separated necessity from apriority. | Quine challenged the distinction; Kripke showed necessity and apriority differ. | Settled; historical credit belongs to Quine. |

  Your friend is technically right that metaphysical necessity cannot be overturned by evidence, since necessity concerns how the world is rather than what we know about it. However, there is a defensible core underneath the error: the author is conflating the metaphysical status of the truth with our epistemic justification for believing it. The rescue move is to say that while "water is H2O" is metaphysically necessary, our *claim* that water is H2O is empirically vulnerable; if chemistry changes, we discover we were pointing at a different substance, not that the necessity vanished.

  The author's conclusion about the separation of modalities survives, but the historical credit in sentence 8 is misplaced. Quine is the philosopher who attacked the analytic/synthetic distinction, arguing that no truth is immune to revision, whereas Kripke argued that some truths are necessary but discovered empirically. Kripke's work remains vital for distinguishing metaphysical necessity from epistemic apriority, but you should credit Quine if you want to talk about collapsing the analytic/synthetic distinction.
