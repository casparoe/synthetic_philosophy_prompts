answer: |-
  # The Psychiatry Sorting Tree (Pre-Szasz)

  **Instructions:** Answer the following 10 claims/cases. Track your Yes/No or A/B choices to find your leaf.

  ### The Nodes (Decision Points)

  1.  **The OCD Scan:** A patient has compulsive hand-washing and an abnormal brain scan, but insists they aren't ill. **Does the physical abnormality make it a literal bodily illness regardless of the patient's objection?** (Yes / No)
  2.  **The Short Stature:** A trait is disabling but statistically ordinary (e.g., being very short). **Is it an illness?** (Yes / No) *[Only if Node 1 = Yes]*
  3.  **The Harmless Deviation:** A bodily function is statistically abnormal but causes no harm (e.g., a painless lesion). **Is it an illness?** (Yes / No) *[Only if Node 1 = Yes]*
  4.  **The Drinker:** A heavy drinker says the drinking is a choice and resents the "disease" label. **Can it medically be an illness?** (Yes / No) *[Only if Node 1 = No]*
  5.  **The Grief:** Prolonged grief (2 years) meets diagnostic criteria. **Is this a dysfunction or a rational response?** (Dysfunction / Rational) *[Only if Node 1 = No]*
  6.  **The Detention:** A detained patient agrees detention was right but denies they were ill. **Is illness required for confinement?** (Yes / No) *[Only if Node 1 = No]*
  7.  **The Contract:** A patient wants to stop treatment against medical advice. **Can they walk away?** (Yes / No) *[All]*
  8.  **Diagnostic Ontology:** **Does the act of diagnosing describe a pre-existing state or constitute a new status?** (Describe / Constitute) *[All]*
  9.  **Neuro-Identity:** For conditions like autism: **Is the goal cure or accommodation?** (Cure / Accommodate) *[Only if Node 1 = Yes]*
  10. **Institutional Future:** **Should psychiatric hospitals exist in their current form?** (Yes / No) *[All]*

  ---

  ### The Leaves (Positions)

  | Position | Path (Node Answers) | Most Awkward Commitment |
  | :--- | :--- | :--- |
  | **1. Biostatistical (Boorse)** | 1(Y), 2(N), 3(Y), 8(Describe) | A painless, harmless biological deviation is still a "disease." |
  | **2. Harmful Dysfunction (Wakefield)** | 1(Y), 3(N), 8(Describe) | Evolutionary design failures in modern contexts count as illnesses. |
  | **3. Mainstream Pluralism** | 1(Y), 9(Cure), 10(Yes), 8(Describe) | "Illness" covers too many different kinds of things to have one definition. |
  | **4. Neurodiversity** | 1(Y), 9(Accommodate), 10(Yes) | Some "symptoms" are valid minority identities, not deficits to be fixed. |
  | **5. Pragmatic Instrumentalism (Gap)** | 8(Constitute), 10(Yes), 1(N/A) | Whether the illness is "real" doesn't matter; only if the label works. |
  | **6. Szaszian Libertarian** | 1(N), 4(N), 6(Yes), 7(Yes) | Psychiatry treats "problems in living," not diseases; coercion is imprisonment. |
  | **7. Diagnostic Nominalism** | 8(Constitute), 10(Yes), 6(Yes) | The illness exists only because the diagnostic practice says it does. |
  | **8. Foucauldian Constructivism** | 1(N), 8(Constitute), 10(No) | Diagnosis is a regime of power/knowledge designed to control deviance. |
  | **9. Psychiatric Abolitionism** | 10(No), 6(Yes) | Psychiatric institutions are inherently violent and must be dismantled. |
  | **10. Moral Model (Gap)** | 1(N), 4(N), 6(No), 5(Vice) | Distress is often vice or weakness; medicalizing it removes responsibility. |

  ---

  ### Empty Cells (Coherent but Unoccupied)

  *   **1(Yes) + 4(No):** *Biological Choice.* A bodily lesion exists, but the behavior is still voluntary. (Rarely defended; usually collapses into Addiction models or Moral Model).
  *   **1(No) + 9(Accommodate):** *Social Identity without Biology.* Accommodating a "mental identity" without claiming bodily basis. (Possible, but usually claims some neuro-basis to secure rights).
  *   **6(No) + 7(Yes):** *Paternalistic Contract.* Confinement is justified without illness, but you can walk away from treatment. (Legally incoherent in most jurisdictions).
  *   **3(Yes) + 10(No):** *Harmless Abolitionism.* Harmless lesions are diseases, but hospitals should be abolished. (Theoretically possible, politically unstable).

  ---

  ### Indistinguishable Leaves (Warning)

  *   **Pluralism (3) vs. Instrumentalism (5):** Both keep hospitals and treat patients. Pluralism claims disorders are *real but diverse*; Instrumentalism claims truth is *irrelevant to utility*. In practice, they prescribe the same treatment.
  *   **Foucault (8) vs. Abolitionism (9):** Foucault describes the power mechanism; Abolitionism demands the political outcome. One is a diagnosis of society, the other a prescription for it, but they often occupy the same seat in seminar.
  *   **Nominalism (7) vs. Constructivism (8):** Nominalism says practice creates the category (semantic); Constructivism says power creates the category (political). They diverge on *why* the practice exists, not *that* it exists.

  ---

  ### Note on Diagnostic Nominalism
  I have given **Nominalism** its own leaf (7). It does not collapse into Constructivism because it lacks the critical political edge (power/control); it does not collapse into Pluralism because it denies the ontology (realness) Pluralism asserts. It occupies the "Methodological Agnostic" slot: *Use the diagnosis, but don't ask what it is.*
