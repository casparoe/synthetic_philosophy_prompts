answer: |-
  You have identified a genuine gap in the canonical public policy literature. While the components of the phenomenon are well-documented, the specific *iterative, hierarchical dynamic* you describe—the migration of distortion through layers of corrective measurement, coupled with an illusion of improving validity—does not have a single, standardized label in evaluation theory.

  Here is the carving you requested: an analysis of the nearest existing concepts, an explanation of where they fall short, a proposal for a precise term, and the boundary conditions of the phenomenon.

  ### 1. Existing Concepts and Their Limits

  You are correct that standard formulations of Goodhart's Law and Campbell's Law are insufficient. They describe a static collapse: *Measure $M$ becomes Target $T$, therefore $M$ ceases to correlate with Goal $G$.* They do not model the *response* to that collapse as a generator of new pathologies.

  Here are the three closest established frameworks and why they do not fully capture your pattern:

  **A. Michael Power's "The Audit Society" (Decoupling)**
  *   **The Fit:** This is the strongest sociological match. Power (1997, 2007) describes how organizations respond to uncertainty by creating "audits of audits." He identifies **decoupling**: the separation of formal accountability structures (the metrics) from actual operational practice. As you noted, the organization feels it is improving assurance while the gap widens.
  *   **The Limit:** Power focuses on *legitimacy* and *ritual*. He explains why organizations add layers (to signal control to external stakeholders), but he does not rigorously model the *mechanism of distortion migration*. He describes the bloat, not the specific game-theoretic evolution of the gaming behavior from one layer to the next.

  **B. Principal-Agent Theory (Multi-Tasking Problem)**
  *   **The Fit:** Holmstrom and Milgrom (1991) show that incentivizing one measurable task draws effort away from unmeasurable tasks.
  *   **The Limit:** This is typically a static trade-off model. It explains why $M_1$ distorts $G$, but it does not model the *dynamic sequence* where the principal introduces $M_2$ to fix $M_1$, only to have the agent optimize the vector $(M_1, M_2)$ in a way that further distorts $G$. It lacks the temporal dimension of the "arms race."

  **C. AI Safety (Specification Gaming / Reward Hacking)**
  *   **The Fit:** In machine learning, this is explicitly recognized. When a reward function $R_1$ is hacked, engineers add a penalty term $R_2$. The agent then finds a state that maximizes $R_1 + R_2$ while violating the intent. This is often called **"Reward Tampering"** or **"Proxy Drift."**
  *   **The Limit:** This literature is technical and assumes a single optimizer. In public policy, the "agents" are human organizations with their own internal politics, and the "principals" are often fragmented. The social science literature has not fully imported this iterative framing.

  **Conclusion:** There is no established term in Public Policy or Evaluation that specifically names the *iterative migration of distortion through a hierarchy of controls*.

  ### 2. Proposed Term: "Goodhart's Cascade"

  Since no standard term exists, I propose **Goodhart's Cascade**.

  **Definition:**
  A **Goodhart's Cascade** occurs when a principal responds to the corruption of a performance metric ($M_1$) by adding a corrective control or secondary metric ($M_2$), rather than reducing stakes or returning to qualitative judgment. This creates a new optimization surface for the agent. The agent adapts to optimize the combined system $(M_1, M_2)$, causing the distortion to migrate to a higher level of abstraction or a blind spot in the new control layer. The process repeats, creating a hierarchy of measures where each layer successfully suppresses the previous distortion but generates a new one that is costlier to detect and further decoupled from the original goal ($G$).

  **Conditions for Application:**
  1.  **High Stakes:** The measures are tied to rewards, penalties, or reputation.
  2.  **Iterative Control:** The response to gaming is *more measurement*, not *less incentive*.
  3.  **Migration:** The distortion does not vanish; it relocates to a dimension the new measure does not capture.
  4.  **Illusion of Validity:** The organization interprets the suppression of the *previous* distortion as an increase in overall system fidelity.

  **Distinction from Nearest Concepts:**
  *   **Vs. Goodhart's Law:** Goodhart's Law is the *event* (the measure breaks). Goodhart's Cascade is the *process* (the repair breaks the repair).
  *   **Vs. Bureaucratic Bloat:** Bloat implies inefficiency. A Cascade implies *active adaptation* by agents to evade the new controls.
  *   **Vs. Learning Curve:** In a learning curve, performance improves over time. In a Cascade, *measured* performance improves while *actual* performance stagnates or declines.

  ### 3. The Principled Stopping Point

  Does the regress have a stopping point? **Yes, but not within the logic of high-stakes accountability.**

  The cascade terminates only when the measurement system exits the "accountability paradigm." There are three specific conditions that stop the cascade:

  **A. Costly Signaling (The Economic Stop)**
  The cascade stops if the cost of gaming the new measure exceeds the benefit of the reward.
  *   *Example:* Requiring a physical presence for a service. If the measure is "time on site" verified by GPS, the agent cannot fake it without actually being there. If the cost of being there is higher than the bonus, they stop gaming (or quit).
  *   *Why it works:* It aligns the marginal cost of manipulation with the marginal gain. Most metric cascades fail because the measures remain "cheap talk" (paperwork, self-reports).

  **B. Randomization and Opacity (The Game-Theoretic Stop)**
  The cascade stops if the measure is not predictable.
  *   *Example:* Unannounced, randomized audits where the *criteria* are not published in advance.
  *   *Why it works:* It prevents the agent from constructing a specific optimization function. If the agent cannot model the principal's measure, they must optimize for the actual goal $G$ as a heuristic.
  *   *Caveat:* This is politically difficult because it violates norms of "transparency" and "fair notice."

  **C. Decoupling Stakes from Measures (The Political Stop)**
  The cascade stops when measures are used for **learning** rather than **accountability**.
  *   *Example:* Data is collected to diagnose system failures, not to punish individual providers.
  *   *Why it works:* It removes the incentive to game. This is the core argument of the "Evaluation for Learning" paradigm (e.g., Bamberger, Preskill).
  *   *Why it rarely happens:* Political pressure demands accountability.

  **If no correction terminates it:**
  If stakes remain high and measures remain transparent, the cascade is theoretically infinite. It ends only via **exogenous shock**: budget exhaustion, a scandal that discredits the entire measurement regime, or a political shift that abandons the goal.

  ### 4. Boundary Cases (What Falls Outside)

  To sharpen the definition, here is what is *not* a Goodhart's Cascade:

  **A. Obsolescence (The Stale Measure)**
  *   *Case:* A measure of "computer literacy" based on typing speed becomes irrelevant as voice interfaces emerge.
  *   *Why it's not a Cascade:* The distortion is not caused by agent optimization. The environment changed, not the agent's behavior.

  **B. The Multi-Task Trade-off (No Hierarchy)**
  *   *Case:* A school is measured on Math and Reading. Focusing on Math lowers Reading scores.
  *   *Why it's not a Cascade:* This is a static trade-off (Holmstrom/Milgrom). There is no *sequence* of corrective measures creating a hierarchy of distortion.

  **C. Hostile Sabotage**
  *   *Case:* An employee deliberately destroys data to harm the organization.
  *   *Why it's not a Cascade:* This is not incentive responsiveness; it is antagonism. The agent is not optimizing the measure; they are destroying the measurement apparatus itself.

  **D. Genuine Alignment**
  *   *Case:* A hospital adds a "patient follow-up" metric to reduce readmissions. Readmissions drop, and patient health improves.
  *   *Why it's not a Cascade:* The new measure ($M_2$) was more correlated with the Goal ($G$) than the first ($M_1$). In a Cascade, the new measure is a *control on the agent*, not a better proxy for the goal.

  ### 5. The Edge Case: Body-Worn Cameras in Policing

  This case sits right on the line of the definition.

  *   **The Setup:** Goal ($G$) is reduced misconduct and increased accountability. Measure ($M_1$) is video footage from body cameras.
  *   **The Distortion:** Officers turn cameras off during contentious interactions or angle them away.
  *   **The Correction:** Policy ($M_2$) mandates automatic activation (e.g., when lights/siren activate) and penalties for non-recording.
  *   **The Edge:**
      *   **Side A (Cascade):** Officers begin to manipulate *verbal* interactions ("You don't want this on record") or engage in misconduct *before* the trigger event activates the camera. The distortion has migrated from "recording" to "triggering." The organization points to higher recording rates as proof of improvement, while misconduct relocates to blind spots. **This is a Goodhart's Cascade.**
      *   **Side B (Alignment):** The presence of the camera changes the *behavior* of both officer and citizen (the "civilizing effect"), reducing the need for misconduct regardless of recording. Here, the measure (camera) causally improves the Goal ($G$) directly, not just via the metric. **This is not a Cascade.**

  **Which side does it fall on?**
  Evidence suggests it is currently a **Cascade**. Studies show that while recording compliance increases (the $M_2$ metric improves), misconduct often displaces to unrecorded contexts or verbal abuse that is harder to adjudicate from video. The organization treats increased "compliance with recording policy" as "increased accountability," satisfying the condition of the *Illusion of Validity*.

  ### Summary for Your Seminar

  You should frame this not merely as "Goodhart's Law again," but as a **dynamic failure of control theory in social systems**.

  1.  **Label:** Call it **Goodhart's Cascade** (acknowledging it is a coinage for this specific dynamic).
  2.  **Mechanism:** It is driven by the principal's refusal to reduce stakes, forcing them to add complexity to the measurement rather than simplicity to the incentive.
  3.  **Diagnosis:** If you see an evaluation framework where every "fix" for gaming involves adding a new metric or audit layer rather than reducing the consequence attached to the metric, you are in a Cascade.
  4.  **Prescription:** The only escape is to break the link between measurement and high-stakes consequence (shifting to learning) or to make the measure expensive to fake (costly signaling).

  This framing will demonstrate that you understand the foundational laws (Goodhart/Campbell) but have identified the *systemic* failure mode that occurs when organizations try to legislate their way out of them.
