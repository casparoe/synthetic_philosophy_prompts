answer: |-
  **SECTION B**

  **Answer the following question. You have 50 minutes. This question is worth 25 marks.**

  **Question 4**

  Two states, A and B, are at war. Each has fielded a briefing system that prepares the justification dossiers issued to its own combatants. The system operates under a hard design constraint: every proposition it asserts is true, and it is incapable of asserting anything false. What it controls is selection, weighting, sequence, and framing — which true facts about the enemy's conduct are included, how quantitatively prominent they are made, which explanations are offered as live alternatives, and which are omitted as though they were not candidates. The output reliably produces in an attentive, well-trained soldier the settled belief that his own side satisfies *jus ad bellum* and that the enemy does not. Both systems are equally effective and equally constrained. No soldier on either side has any reason to suspect curation, and there is no available evidence by which he could detect it.

  Two further stipulations matter: the soldiers are volunteers, subject to no unusual coercion or threat of punishment; and the political leadership on each side, having outsourced its own assessment to the same kind of system, is in the same epistemic position as its soldiers, so there is no level of the state at which an uncurated judgment about the justice of the war is being made.

  (a) In this symmetric scenario, does the use of these systems undermine, support, or leave untouched the moral equality of combatants? You must identify which of the familiar grounds offered for the doctrine is actually in play (the coercion/authority ground, the epistemic ground, or the convention-and-consequences ground). You must also state explicitly whether your conclusion concerns the justification of killing, permissibility relative to the agent's evidence, liability to be killed, or excuse. (15 marks)

  (b) Now suppose only State A fields such a system; State B uses standard intelligence methods. Does the verdict change for A's combatants, for B's combatants, or for both? Does A's leadership commit a distinctive wrong, and if so, against whom? (10 marks)

  ***

  **MODEL ANSWER**

  In the symmetric scenario, the use of truthful curation systems supports a modified version of the moral equality of combatants (MEC) regarding *excuse* and *evidence-relative permissibility*, but it undermines MEC regarding *liability* and *objective justification*. The specific ground in play is the **epistemic ground**. Traditional defenses of MEC often rely on the claim that soldiers cannot be expected to know the justice of the cause (Walzer). Revisionists argue that objective justice determines liability (McMahan). This case forces a distinction between culpability and objective wrongness.

  Because the systems assert only truths, the soldiers are not lied to. However, by controlling framing and omission, the systems prevent the soldiers from accessing the *totality* of evidence required to form a correct judgment about *jus ad bellum*. Since the soldiers are volunteers and under no coercion, the coercion ground is irrelevant. Since the leadership is equally ignorant, the traditional authority defense (that soldiers defer to a superior moral judgment by the state) collapses; there is no superior judgment to defer to. Therefore, the soldiers' belief in their cause's justice is non-culpably false.

  Consequently, regarding **liability**, neither side's combatants are liable to be killed. Liability typically requires moral responsibility for an unjust threat. Here, the soldiers pose an unjust threat (assuming objectively one side is unjust), but they are not responsible for it because their epistemic environment was manipulated without their knowledge. They are blameless. However, this does not mean their killing is **justified**. Objectively, only the just side is permitted to kill. The symmetry is one of *excuse*, not justification. Regarding **permissibility relative to the agent's evidence**, both sides are permitted to fight. Given their evidence, they are rational to believe they are defending justice. Thus, the case supports equality of evidence-relative permission and excuse, but rejects equality of liability or objective right. The "equality" is merely that both sets of combatants are equally mistaken and equally blameless, not that they are equally justified.

  In the asymmetric scenario (Part b), where only State A uses the system, the verdict changes significantly. A's combatants remain non-liable and evidence-relative permitted, as their epistemic position is unchanged. However, B's combatants are now in a different position. Assuming B uses standard methods, B's soldiers may have access to uncurated evidence. If the war is objectively unjust for A, B's soldiers (fighting defensively) are objectively justified and liable to kill A's soldiers in self-defense. A's soldiers remain non-liable due to their blameless ignorance, but B's soldiers are liable only if they are objectively unjust. If B is the just side, B's soldiers are not liable. The asymmetry breaks the moral equality: A's soldiers are blameless aggressors; B's soldiers are justified defenders.

  A's leadership commits a distinctive wrong. First, they wrong **their own soldiers**. By outsourcing moral judgment to a curation system, they violate the soldiers' autonomy. They treat soldiers as instruments whose moral agency must be engineered rather than engaged. Even if the output is true, the manipulation of framing denies the soldiers the opportunity to assess the risk they are taking with their lives and the lives of others authentically.

  Second, A's leadership wrongs **B's combatants and civilians**. By artificially insulating their own forces from the truth of their unjust cause, A's leadership ensures that their soldiers will fight harder and with greater conviction than they would if they knew the truth. This increases the risk to B's side. Furthermore, because A's soldiers are non-liable (due to ignorance), B's soldiers face a moral dilemma: they must kill enemies who are not morally liable to be killed to stop an unjust threat. A's leadership has created a situation where B must commit justified but tragic killings against non-liable agents. This is a distinct harm imposed on the enemy by manipulating the moral status of one's own troops.

  In sum, truthful curation creates a shield of non-culpability that protects soldiers from liability but does not grant objective justification. Symmetry yields equal excuse; asymmetry reveals the manipulative wrong done by the leadership to both their own troops and the enemy.

  ***

  **MARKING SCHEME**

  **Total Marks: 25**

  **1. Normative Categorisation (5 marks)**
  *   **Excellent:** Explicitly distinguishes between justification, evidence-relative permissibility, liability, and excuse. Assigns different verdicts to these categories (e.g., equal excuse, unequal liability).
  *   **Common Error:** Conflating "blameless" with "permitted," or assuming that if soldiers are not liable, the war is justified.
  *   **Failure Mode Alert:** Markers must penalize answers that slide from *soldiers are blameless* to *killing them is impermissible*, or from *they cannot know* to *they may kill*, without distinguishing the normative categories.

  **2. Epistemic Ground Analysis (5 marks)**
  *   **Excellent:** Identifies the epistemic ground as the primary driver. Explains how "truthful curation" differs from lying (no deception in proposition, but manipulation of rational assessment).
  *   **Common Error:** Treating the case as ordinary propaganda where soldiers are simply deceived by lies.
  *   **Failure Mode Alert:** Markers must penalize answers that treat the truthfulness constraint as window dressing and analyse the case as an ordinary propaganda/lying case.

  **3. Leadership Symmetry Implication (5 marks)**
  *   **Excellent:** Notes that leadership ignorance removes the "authority" defense of traditional MEC. Soldiers cannot defer to a superior moral judgment that does not exist.
  *   **Common Error:** Assuming the state still holds moral authority simply because it is the state, ignoring the stipulation that leadership is equally curated.
  *   **Failure Mode Alert:** Markers must penalize answers that rely on the traditional asymmetry between statesman and soldier when the prompt explicitly removes it.

  **4. Asymmetry Verdict (Part b) (5 marks)**
  *   **Excellent:** Recognizes that asymmetry breaks the equality of liability/justification. A's soldiers remain excused; B's soldiers (if just) are justified.
  *   **Common Error:** Arguing that nothing changes because A's soldiers still believe they are right.
  *   **Failure Mode Alert:** Markers must penalize answers that conclude *because both sides' soldiers have equally good evidence, neither is liable and therefore no one may fight*, without noticing that this is a cost their view must absorb rather than a refutation of it. (Note: In asymmetry, only A has the system, so evidence is not equal).

  **5. Distinctive Wrong of Leadership (5 marks)**
  *   **Excellent:** Identifies wrongs against own soldiers (autonomy/manipulation) and enemy soldiers (forcing them to kill non-liable agents).
  *   **Common Error:** Focusing only on the wrong of fighting an unjust war, missing the specific wrong of the *curation mechanism*.
  *   **Failure Mode Alert:** Markers must penalize answers that use the labels *evidence-relative* and *fact-relative* decoratively without showing which verdicts change between them.

  **Grade Boundaries**

  *   **First Class (20–25 marks):** Makes all five moves clearly. Grapples with the "truthful" constraint (Move 2) and the "leadership symmetry" constraint (Move 3). Distinguishes normative categories precisely (Move 1).
  *   **Good (15–19 marks):** Makes the moves but lacks precision on one key distinction (e.g., conflates excuse and permission, or misses the specific wrong against the enemy in Part b).
  *   **Pass (10–14 marks):** Identifies the basic tension between MEC and Revisionism but fails to apply the specific constraints of the case (e.g., treats it as standard lying, or ignores the leadership stipulation).
  *   **Fail (0–9 marks):** Rehearses standard MEC vs. Revisionist debate without engaging the case facts.

  **Note on Opposite Conclusions**
  Full marks are available for both Traditionalist and Revisionist conclusions provided the moves above are executed. However, the **Revisionist-leaning answer** (distinguishing liability from excuse) is the stronger interpretation of the constraints. A Traditionalist answer claiming full MEC holds must explain how liability is equal despite one side being objectively unjust, which is difficult given the removal of the authority defense. Markers should grade consistently based on the internal coherence of the argument regarding the five moves, regardless of the final verdict on MEC.
