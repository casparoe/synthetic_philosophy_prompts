answer: |-
  1. Is the backward induction logically sound when the announcement it reasons about would be falsified by the induction's own success? If no, the reasoning fails because the students' epistemic state is not closed under the argument they perform. If yes, assume the students derive a valid conclusion and proceed to Question 2. If the soundness is indeterminate, this combination is simply unexplored.

  2. Is the announcement best read as self-undermining, as simply unfulfillable on the later days while perfectly fulfillable on the earlier ones, or as a claim with no determinate content? If self-undermining, the announcement is inconsistent and therefore vacuous. If unfulfillable on later days, proceed to Question 3. If no determinate content, this combination is incoherent given the setup's stipulation of a single exam day.

  3. After the induction, do the students count as knowing the conclusion or only as believing it? If knowing, this combination is simply unexplored because the Monday-A wrinkle cancels the exam, dissolving the paradox. If believing, proceed to Question 4. If the distinction collapses here, flag that two leaves cannot in fact be separated by these five questions.

  4. Is the teacher assumed infallible about what the students will deduce, since the Monday-A wrinkle makes that assumption do real work? If yes, the prediction is unfulfillable rather than false, which lets Thursday be a genuine surprise. If no, proceed to Question 5. If infallibility is irrelevant to the deduction, this combination is merely unpopular.

  5. Does the final outcome imply the reasoning is sound and the announcement false, or does it leave a logical gap no one occupies? If the announcement was false, the students' reasoning is sound and the teacher was simply wrong. If a logical gap remains, this leaf is incoherent. If both outcomes are possible, the tree bifurcates further than allowed.
