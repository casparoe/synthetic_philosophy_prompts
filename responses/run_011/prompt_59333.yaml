      *   **Constraints:** No direct quotations (script or pamphlet), no external research instructions, flag uncertainty, keep tone accessible for a film night (12 people, casual but smart).

  2.  **Deconstruct Berkeley's *The Querist* (based on user's summary + general knowledge):**
      *   *User's Summary:* Accurate enough for this purpose. Berkeley was an immaterialist (esse est percipi). In economics, he argued against mercantilism (hoarding gold/silver). He viewed money as a token to circulate industry. If money sits still, it's useless. Poverty is idleness, not lack of coin.
      *   *Key Nuance:* Berkeley wasn't against wealth; he was against *sterile* wealth. He wanted circulation. He believed "appetites" (desire for better living) drive the engine.

  3.  **Deconstruct *The Treasure of the Sierra Madre*:**
      *   *Plot:* Dobbs & Curtin (broke) -> Howard (old timer) -> Mine -> Paranoia/Greed -> Death/Loss -> Howard (happy in village), Curtin (survives), Dobbs (dead, gold lost).
      *   *Themes:* Greed, paranoia, nature vs. man, value of labor.
