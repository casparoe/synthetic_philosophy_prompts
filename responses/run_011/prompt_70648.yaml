answer: |-
  ### The Principle

  **The Principle of Habitual Residence within Historic Administrative Units.**

  This principle holds that the right to determine political status belongs to the people who actually live within a territory, provided that the territory itself possesses a distinct, pre-existing political identity. It balances the democratic claim of the present population against the stability of established borders.

  **Definitions for Public Hearing:**

  1.  **Habitual Resident:** Any adult who physically lives within the territory and intends to continue living there, regardless of citizenship, duration of stay, or place of birth.
      *   *Excludes:* Those who own property but live elsewhere (e.g., your brother).
      *   *Includes:* Recent arrivals who have established a home (e.g., your neighbour), long-term settlers (e.g., your parents), and minors old enough to understand the decision (16 and 17-year-olds).
  2.  **Historic Administrative Unit:** A political subdivision that existed with its own governance structure prior to the current independence movement.
      *   *Includes:* The Region (Vestmark) and its Provinces (the Sarnau Valley).
      *   *Excludes:* Municipalities, cities, or neighbourhoods created within those provinces (e.g., the City of Sarnau, the mining towns, the southern district).
  3.  **Non-Exclusionary Franchise:** A voting rule is invalid if it is designed to exclude a specific demographic group, or if it excludes Habitual Residents based on arbitrary duration requirements.

  ---

  ### Audit of Your Verdicts

  This principle delivers eight of your ten verdicts directly. It requires you to amend the reasoning of two, and it demands you reject the Commission's current draft on the adjustment window.

  **Verdicts Delivered:**
  *   **1 & 2 (Region-wide Vote):** Vestmark is a Historic Administrative Unit. Its Habitual Residents decide. Simple majority applies.
  *   **3 (Valley Exit):** The Valley is a Historic Administrative Unit (a province). It retains the right to determine its status.
  *   **5 & 7 (Franchise):** The neighbour and 16-year-olds are Habitual Residents. They vote.
  *   **6 (Residency Rule):** The government's ten-year rule excludes Habitual Residents (your parents and your neighbour). It is invalid.
  *   **8 (Kevri Protections):** The Kevri are a people but not a Historic Administrative Unit (no territory). They do not get a veto roll, but the legitimacy of the new state depends on protecting their rights.
  *   **9 (UDI):** Recognition depends on whether the Habitual Residents were denied the chance to vote within their Historic Unit.

  **Verdicts Requiring Amendment:**
  *   **4 (City of Sarnau):** You voted *No* (City cannot leave Valley). The principle supports this *result*, but your reasoning ("escaping people around it") is unstable.
      *   *Correction:* The City cannot leave because it is not a Historic Administrative Unit; it is a municipality within the Valley. Allowing it to secede would violate the integrity of the Historic Unit.
  *   **10 (Valley Future Exit):** You voted *No* (New state cannot bar Valley). The principle supports this, but you must clarify that this right applies to the *Valley as a Unit*, not to any sub-group within it.

  **Verdicts to Discard:**
  *   None, provided you accept the amended reasoning above. However, you must discard the **Commission's Draft** regarding the adjustment window (see below).

  ---

  ### Addressing the Three Pairs

  **1. Pair 3 vs 4 (The Valley vs. The City)**
  *   **The Conflict:** You allow the Valley to leave Vestmark but forbid the City to leave the Valley. Your "above vs. around" distinction is too vague to withstand legal scrutiny.
  *   **The Resolution:** The distinction is **Administrative Hierarchy**. The Valley is a *province* with a historic political identity. The City is a *municipality* within that province.
  *   **Why this holds:** Self-determination applies to political communities, not economic clusters. The Valley has a distinct political history. The City is an economic hub within that history.
  *   **Instruction:** In your hearing, do not argue about "people around vs. people above." Argue that **exit rights attach to the highest sub-unit with historic governance status.** This prevents the map from being shredded by every town council.

  **2. Pair 5 vs 6 (The Neighbour vs. The Parents)**
  *   **The Conflict:** You accept a one-year resident (neighbour) but reject a ten-year rule that excludes your parents. You worry your revulsion in 6 is a fudge because you accept residence in 5.
  *   **The Resolution:** Your revulsion is **principled**, but your stated reason in Verdict 6 is too narrow. You reject the ten-year rule not *only* because it targets settlers, but because **duration is not a valid test for Habitual Residence.**
  *   **Instruction:** You must state plainly: "A ten-year rule is wrong even if it were neutral." If you accept your neighbour (one year), you cannot logically support a rule that excludes your parents (42 years) based on time. The rule is invalid because it disenfranchises residents, regardless of intent. Do not let the Commission trap you into defending the parents *only* as victims of engineering; defend them as residents.

  **3. Pair 2 vs 10 (Majority Rule vs. Future Exit)**
  *   **The Conflict:** You say a majority settles the question (2), but the Valley can leave the new state later (10).
  *   **The Resolution:** These are **different questions**. Verdict 2 settles the transition from Maravia to Vestmark. Verdict 10 settles the internal constitution of the new Vestmark.
  *   **Instruction:** A majority vote authorizes the *creation* of the state. It does not extinguish the pre-existing rights of Historic Units *within* that state. The new state is legitimate only if it inherits the same self-determination rights it claimed for itself.

  ---

  ### Unlisted Cases

  **1. The Three Northern Mining Towns**
  *   **Status:** These are municipalities, not Historic Administrative Units.
  *   **Ruling:** They remain part of Vestmark. They do not have an independent right to secede to Maravia, nor do they have a right to join the Sarnau Valley if the Valley leaves. They are bound by the region-wide vote.

  **2. The Offshore Archipelago**
  *   **Status:** Administered by Vestmark but "never part of the historic territory."
  *   **Ruling:** This is not a Historic Administrative Unit of Vestmark. It cannot be forced into the new state against its will, nor can it force its way in if Vestmark leaves.
  *   **Action:** It requires its own separate plebiscite to choose between Maravia, Vestmark, or independence. It cannot be treated as a bargaining chip in the Vestmark referendum.

  **3. The Southernmost District of the Valley**
  *   **Status:** A sub-unit of a Historic Unit.
  *   **Ruling:** It cannot leave the Valley. This is where the regress stops. The Valley is the smallest unit with a historic political identity. Districts are administrative subdivisions of the province, not historic entities themselves.

  **4. The Adjustment Window (Commission Draft)**
  *   **Draft Proposal:** Allows *municipalities* above a population threshold to petition for transfer.
  *   **Principle's Ruling:** **Reject this.** The threshold must be the **Historic Province**, not the municipality.
  *   **Reasoning:** Allowing municipalities to petition invites gerrymandering and instability. Only the Sarnau Valley (as a province) should have the right to petition for transfer during the adjustment window.
  *   **Threshold:** The petition threshold should be a majority vote within the Historic Province, not a population threshold set by the state.
  *   **Duration:** A five-year window is acceptable to ensure stability, provided the right to petition is guaranteed for the Historic Unit.

  ---

  ### The Regress Problem

  **Does the opt-out logic generate a regress?**
  Yes, if you define the "unit" loosely. If any group can vote to leave, then any neighbourhood can vote to leave a city, and any street can vote to leave a neighbourhood.

  **Where does the principle stop it?**
  It stops at the **Historic Administrative Unit**.
  *   **Why is this not arbitrary?** Because it relies on **existing legal history**, not current political preference. The Valley has been a province for decades/centuries. The City of Sarnau is a city within it. The Southern District is a zone within the Valley.
  *   **The Line:** We do not draw new lines for the referendum. We use the lines that existed before the crisis began. This prevents parties from carving out "safe seats" to manipulate the result.

  ---

  ### The Two Questions

  **Are you conflating "Which Body Decides" and "Who Constitutes That Body"?**
  Yes. Your list mixes **Boundary** questions (which territory votes) with **Franchise** questions (which people vote).

  **Separation:**
  1.  **Boundary (Which Body):** Verdicts 1, 2, 3, 4, 10.
      *   *Decision:* Vestmark is the primary unit. The Valley is a secondary unit with exit rights. Cities and towns are not units.
      *   *Order:* This must be settled **first**. You cannot decide who votes until you decide *where* the vote is happening.
  2.  **Franchise (Who Constitutes):** Verdicts 5, 6, 7.
      *   *Decision:* All Habitual Residents within the Boundary.
      *   *Order:* This is settled **second**.

  **Verdict 8 (Kevri)** belongs to a third category: **Minority Protections.** This is a condition of legitimacy, not a voting rule.

  **Advice:** At the hearing, separate these explicitly. "First, we define the territory. Second, we define the voters. Third, we define the protections." If you mix them, the Commission will use your concern for the Kevri to undermine your stance on the Valley, or your stance on the Valley to undermine the Franchise.

  ### Summary Instruction for the Hearing

  1.  **State the Principle:** "Habitual Residence within Historic Administrative Units."
  2.  **Define the Franchise:** "Everyone living here votes. Not those who left. Not those barred by time."
  3.  **Define the Boundary:** "Vestmark votes as a region. The Valley may leave as a province. Cities and towns stay put."
  4.  **Reject the Draft:** "The adjustment window must apply to Provinces, not Municipalities."
  5.  **Correct Your Reasoning:** "I reject the residency rule not because it targets my parents, but because it targets residents. I reject the City's exit not because of geography, but because of administrative history."

  This approach saves your verdicts, removes the contradictions, and gives you a stable platform for public defense.
