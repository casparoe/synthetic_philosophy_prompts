answer: |-
  # The Hundred Camps

  The wind up here does not blow; it scours. It strips the heat from your bones and the certainty from your mind. We were at Camp One when the sun was still high enough to cast shadows, long and thin like fingers pointing back down the mountain.

  My partner and I were roped together, fifteen feet of braided nylon between us. Behind us, clipped to the rope on a sliding tether, was the cache. It was a sled then, empty save for the iron weights we had brought to simulate value. The rule of the mountain is simple, older than our Order. At each camp, the lead climber holds the knife. You can cut the rope. If you cut, the cache stays where it is, you take the greater share of the weight and the credit, and you descend alone. The other man is left stranded, forced to follow later with nothing. Or, you can pass. You hand the knife to the other man. The cache is replenished at the next camp, heavier, richer, more valuable to whoever finally claims it.

  If you pass all the way to Camp One Hundred, the cache is heavy enough to buy a valley. If you cut at Camp One, you have enough to buy a meal.

  I am of the Order. We are trained in the Return. From the time we are children, we are taught to walk the path backward. We start at the end. At Camp One Hundred, the man in the lead will cut. Why would he not? There is no future reward for passing. He takes the prize. This is certain.

  Knowing this, the man at Camp Ninety-Nine knows that if he passes, the man at One Hundred will cut. So the man at Ninety-Nine gains nothing by passing. He must cut at Ninety-Nine.

  Knowing this, the man at Ninety-Eight knows…

  You see the shape of it. It is a domino line falling backward through time. The logic is iron. It collapses the entire mountain into a single point. If the end is cut, the beginning must be cut. To pass at Camp One is to deny gravity. It is to hope for a miracle in a place where only physics applies.

  I looked at my partner. He wore the grey hood of the Order. I knew his training. I knew he had done the Return. I had done the Return. I held the knife at Camp One. The cold bit through my gloves. The cache was light, barely a burden.

  I should have cut. The logic demanded it. To pass was to invite betrayal at the first opportunity he got.

  He looked at me. His face was obscured by frost and fabric, but I saw his eyes. They were calm. He shook his head. He passed.

  He handed me the lead.

  My breath hitched. This was the first crack. If he was of the Order, he knew the Return. If he knew the Return, he knew I would cut at Camp Two. If he knew I would cut at Camp Two, he should have cut at Camp One. To pass was irrational. It was a error in calculation.

  Unless.

  Unless he was not calculating. Unless he was one of the Vowed.

  We know the type. Men who break from the Order because the Return is too cold to live by. They make a rule of themselves. *I will pass,* they say. *I will pass until the end.* They are fools, or saints, or broken things. They operate on faith, not physics.

  If he was Vowed, the logic changed. The dominoes stopped falling. If he would never cut, then I could pass. I could ride his folly all the way to Camp One Hundred. I could let him carry the weight of the decision, let him be the fool, and then at Camp Ninety-Nine, when the cache was heaviest, I could cut. I would take the valley. He would get the descent. It was the optimal exploitation of a non-rational agent.

  I sheathed the knife. I took the lead. We climbed to Camp Two.

  The air grew thinner. The cache grew heavier. By Camp Ten, the sled was digging a furrow into the ice. I could feel the tension in the rope. Every step was a negotiation between my legs and the weight behind us.

  I watched him. He moved with a steady, rhythmic grace. He did not look at the knife. He did not look at the cache. He looked at the snow in front of his boots. He was playing the part of the Vowed perfectly.

  By Camp Forty, the wind had picked up. My lungs burned. The cache was now a burden that required both of us to haul, even though only one of us was technically leading. The value was immense now. Enough to retire. Enough to end the need for climbing.

  The Return whispered in my ear. *He is a fool. He is waiting for you to cut. If you do not cut, he will cut at Fifty.*

  But he passed at Fifty. He handed me the knife with gloved hands, his movements smooth, unhesitating.

  I began to feel a strange sickness. It was not the altitude. It was the weight of the logic. I was carrying two things: the cache, and the certainty that he was irrational. I was milking him. I was the predator walking beside a lamb that refused to flee. I felt a surge of superiority. I was the only sane man on the mountain. He was the variable I had solved.

  But as we passed Camp Sixty, the cold deepened. The nights were longer. The silence between us became a physical presence.

  At Camp Seventy, I stopped to adjust my crampons. He stopped too. He didn't look at me. He was checking the rope tension. He pulled the line taut, tested the knot, then let it slacken.

  It was a specific motion. A test of load-bearing.

  A Vowed man does not test the rope. A Vowed man trusts the rope. A Vowed man believes the rope will hold because he believes it should. A man of the Order tests the rope because he knows exactly where the fiber will snap.

  I watched him at Camp Eighty. The cache was so heavy now that we had to rest every hundred yards. My muscles screamed. The value was beyond imagining. To cut now was to take a kingdom. To pass was to risk everything on one more step.

  The Return screamed at me. *Cut. He is Vowed. He will pass. Cut now.*

  But why hadn't he cut?

  If he was Vowed, he should have passed without thought. But I saw him thinking. I saw the micro-tensions in his shoulders. I saw the way his eyes flicked to the knife at Camp Eighty-Two. Not with fear. Not with faith. With calculation.

  He was doing the Return.

  The realization hit me like an ice axe to the chest. He was not a fool. He was not a saint. He was like me. He had walked the path backward from Camp One Hundred. He knew that at Camp One Hundred, I would cut. He knew that at Camp Ninety-Nine, he should cut. He knew the entire chain of dominoes.

  He knew that I knew.

  And yet, he had passed.

  He had looked at the absolute certainty of the Return, looked at the logical necessity of betrayal, and he had stepped aside. He had chosen the pass not because he couldn't see the end, but because he saw it and refused it.

  This broke the model.

  If he is irrational, I exploit him. If he is rational, I cut. But if he is rational and chooses to act against his rationality… what is he?

  He is a variable I cannot solve. He is a man who has introduced a new force into the physics of the mountain. He is betting that I will see his defiance and match it. He is betting that I will understand that the only way to win is to break the game.

  But if I break the game, and he cuts… I lose everything.

  If I continue the game, and he cuts… I lose everything.

  If I continue the game, and he passes… we both win.

  But why would he pass? He knows I should cut. He knows I know he knows. How many layers of knowing does it take before the logic dissolves? How many times must we look into the mirror before the reflection stops looking back?

  We reached Camp Ninety-Nine.

  The wind was howling now, a constant shriek that drowned out thought. The cache was immovable without both of us hauling. We stood on the ledge. The summit camp was visible above us, a flat shelf of snow glowing in the twilight. One more push.

  He turned to me. He did not reach for the knife. He reached into his parka and pulled out a small tin of wax. He began to wax the rope.

  It was a maintenance task. Something you do at base camp. Something you do when you intend to keep the rope intact.

  He looked up at me. His eyes were clear. There was no plea in them. No hope. There was only a stark, terrifying acknowledgment. He knew I had the knife. He knew I was thinking about Camp One Hundred. He knew I was thinking about his reasoning.

  He was telling me: *I have done the math. I know the sum is zero. I am choosing to make it one.*

  He was handing me the responsibility for the logic. If I cut, I confirm the world is cold. If I pass, I confirm the world is what we make it. But I cannot know if he is lying. He could be waxing the rope to lull me into passing so he can cut at the final second. He could be playing a deeper game, one where he sacrifices the hundredth camp to prove a point about the ninety-ninth.

  Or he could be exactly what he seems: a man who looked into the abyss of the Return and decided to build a bridge.

  My hand went to my belt. The knife was cold steel against my palm. The weight of the cache pulled at my hips, dragging me down. The wind pushed against my back, urging me forward, or perhaps urging me to cut and lighten the load.

  I drew the knife. The sound was sharp, a metallic click that cut through the wind.

  He did not flinch. He finished waxing the rope. He stood up. He looked at the blade, then at my face. He did not move to defend himself. He did not move to cut his own line. He simply stood there, holding the rope, offering me the tension.

  If I cut, the cache slides to me. I descend rich. He descends alone. The logic is satisfied.
  If I pass, I hand him the knife. We go to Camp One Hundred. The logic is broken.

  I looked at the rope. It was frayed near the clip, worn by the ice. One cut would sever it.

  I looked at his eyes. They were waiting. Not for mercy. For a decision.

  The wind died down for a second, leaving a silence so profound I could hear the blood rushing in my ears. I tightened my grip on the handle. The metal bit into my glove. I raised the knife. The blade caught the low light, flashing white.

  He did not blink.

  I brought the knife down.
