      *   **Core Concept:** Two climbers roped together, 100 camps. Cache gets heavier/more valuable higher up. Lead climber can cut (take share, end game) or pass (grow cache, other leads). Backward induction says cut at Camp 1. Reality says pass until ~80, then collapse.
      *   **Narrator:** First-person. Member of an order trained in "backward reasoning" (call it something liturgical/plain). Cannot reason otherwise.
      *   **Opponent:** Thought to be same training. Passes at Camp 1.
      *   **Narrator's Reasoning:** He passed -> He's not a backward reasoner -> He's a "vowed type" (fool/saint) -> I should exploit him by passing until near the end, then cut.
      *   **The Twist/Climax:** Near the top, narrator realizes the opponent *did* do the backward reasoning, saw the end, and passed *anyway*. This breaks the narrator's model.
      *   **Ending:** Ambiguous. No resolution on who was right. Physical event at/near last camp. Undecidability is the point. No game theory jargon (equilibrium, dominant strategy, etc.).
      *   **Tone:** Cold, physical, internal, philosophical but grounded in sensation (weight, cold, rope).
      *   **Length:** 1,500 - 2,500 words.
      *   **Title:** Required.

  2.  **Deconstruct the Game Theory:**
      *   This is the Centipede Game.
      *   Standard Nash Equilibrium (Subgame Perfect): Defect immediately.
      *   Experimental Reality: People cooperate for a while, then defect late.
      *   The Narrative Conflict: The narrator believes in the Equilibrium. The opponent's behavior contradicts it. The narrator creates a new model (Opponent is irrational/vowed). The narrator plans to exploit this. The realization is that the opponent is *rational but chose otherwise*, which breaks the narrator's recursive logic ("I know that he knows that I know...").
      *   Key Insight to convey: Common Knowledge of Rationality is the fragile assumption. If I'm not sure you're rational, I pass. If I know you're rational, I cut. If I know you know I'm rational... etc. The story needs to show the weight of this recursion.

  3.  **Drafting - Section by Section:**

      *   **Title Ideas:** The Hundred Camps, The Backward Walk, The Rope's Weight, *The Descent of Reason*, *Camp One Hundred*, *The Unraveling*. Let's go with *The Hundred Camps*.
