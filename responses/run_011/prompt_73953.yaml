answer: |-
  **Margit:** The assembly votes in fifty minutes, Elias. If we send them back to the informal regime, the plant opens in three years and the aquifer collapses. You know the dozen families who founded this place will manage the water among themselves. The newcomers won't be part of that conversation.

  **Elias:** I know the risk. But your code assumes the problem is that people don't know the rules, or that the rules aren't written down. My diagnosis is different. The founders fled a place where everyone watched everyone. They came here for breath. Now you want to rebuild the cage they escaped, just with printed letterhead.

  **Margit:** It's not a cage, it's a ladder. Informal enforcement breaks at scale because the cost of sanctioning a neighbour falls on the sanctioner while the benefit is diffuse. If I tell the family down the rail line to stop pumping at noon, I lose social standing, they lose water, and everyone else free-rides. A written code shifts that cost to the office.

  **Elias:** Only if the office is trusted. And you're building that trust on a ledger that shames households publicly. You say informality delegates power to social capital holders. I agree. But a public compliance standing delegates power to whoever controls the data entry. If the town believes the ledger is rigged, your sanctions aren't egalitarian; they're just centralized vendettas.

  **Margit:** That's why there are appeal rights. But look at the diagnostic gap between us. You think the norms are still strong, that people still believe drawing at noon is wrong, but they've stopped believing *others* comply. If that's true, publicity alone fixes it. If I publish the data, people see their neighbours are complying, and they relax.

  **Elias:** Exactly. If the norm holds but the belief in compliance has fractured, you don't need sanctions. You need transparency. But you're adding sanctions. That changes the mechanism. A public compliance standing does not merely record behaviour; it changes what people are willing to attempt. If I know my neighbour can see my red mark, I won't try to innovate my irrigation, even if the water is there. I'll play safe.

  **Margit:** And if I don't have the mark, I won't know if my safety is because everyone is complying or because everyone is hiding it. But here is where your diagnosis fails. The newcomers have no shared history with the founders. Norms cannot be transmitted by osmosis at fifteen thousand people. They need education. That's why my report includes the school programme.

  **Elias:** Education takes a generation. The plant arrives in three years. We need a regime that adapts to non-stationary problems. A code written now encodes this year's guesses with next decade's force. That's why I proposed sunsets. Every rule dies in four years unless re-adopted on evidence.

  **Margit:** Evidence gathered by whom? You refuse to create a permanent compliance office. Who tracks the sunsets? Who gathers the evidence? If there's no office, the rules don't sunset; they just drift until someone screams.

  **Elias:** *(Pauses, looking at his notes)* You're right that someone must track the dates. I'll concede the need for a clerical secretariat to manage the calendar and publish the reasons the panel gives. But they cannot have enforcement power. Once an enforcement office exists, the code drifts toward what the office finds convenient to detect rather than what matters. They'll measure pipe diameter because it's easy, not soil moisture because it's hard.

  **Margit:** And my ledger drifts toward what the neighbours notice. But I hear you on the secretariat. However, if you remove enforcement power, who executes the panel's discretion?

  **Elias:** The panel rotates. The community executes the judgment through social pressure, backed by the bright-line prohibitions. There are only twelve. Don't drill during drought declaration. Don't bypass the meter. Simple.

  **Margit:** Twelve lines won't hold fifteen thousand people. But I am willing to modify my visibility claim. If the ledger is posted on every door, it invites vendettas. I will amend the recommendation: the compliance standing becomes accessible to any resident upon request, not automatically public. It preserves accountability without forcing shame into the daily commute.

  **Elias:** That helps. But it doesn't solve the trust deficit. You say informality is not the neutral baseline. I say your formality isn't either. The credibility of your compliance standing depends on precisely the informal trust you say has decayed. If the founders control the office, the ledger is a weapon. If the newcomers control it, it's a revolution. Either way, it's war.

  **Margit:** That's why the sanctions are graduated and administered by the office, not neighbours. We remove the social cost from the individual.

  **Elias:** You move the cost, you don't remove it. And you miss the deeper structural point. You treat looseness as the absence of a norm regime. It isn't. My sunsets, my duty to publish reasons, my rotating panel—these are rules. They are demanding rules. They need tight enforcement. If the secretariat forgets to sunset a rule, who sanctions them? If I require tight enforcement of the meta-rules to keep the system loose, I need the very density of accountability you think this town rejected.

  **Margit:** So you admit your system requires high trust to function.

  **Elias:** It requires high vigilance. Trust is what you need for your ledger to be believed. Vigilance is what I need for my sunsets to actually sunset. Which is easier to build in a town of founders who fled accountability?

  **Margit:** They fled specific accountability, not all of it. They want water security. If I don't guarantee the allocation, the plant doesn't matter because there's no water to process. Your vigilance doesn't pump water. My code does.

  **Elias:** Your code pumps water until the office decides that measuring flow is too hard, so they measure time instead. Then everyone pumps at night. You haven't solved the drift; you've just hired a manager for it.

  **Margit:** And you've hired a calendar. We're out of time. The assembly will have to choose which risk they prefer: the risk of rigidity or the risk of drift.

  **Elias:** Or they'll vote for the risk they understand. They know what drift looks like. They don't know what your rigidity costs until the first appeal is denied.

  **Margit:** Then let them vote. But don't pretend your panel's discretion is free of power. It's just power without a name.

  **Elias:** And don't pretend your ledger is free of history. It's just history without a memory.

  ***

  **Note to Facilitator**

  Given the town's specific history—founders fleeing a dense normative order—I believe Elias's report is better supported, though with significant reservations. The population is primed to reject the "cage" Margit proposes, and her reliance on a central office risks recreating the exact social capital monopolies (the dozen families) the founders sought to escape. Elias's meta-rules (sunsets, published reasons) respect the town's aversion to permanent authority while acknowledging the need for structure.

  However, my confidence in the empirical premises varies. I am **confident** in the claim that sanctioning costs are concentrated while benefits are diffuse; this is a standard collective action problem observable in most resource regimes. I am **unsure** about the claim that a visible compliance standing changes what people will attempt (the chilling effect); while plausible, the magnitude of this effect depends heavily on local culture, which is exactly what you are testing. I am **confident** that rules drift toward what is easy to detect, but I must mark this as **constructed for the scene** insofar as I have presented it as an inevitable law rather than a tendency; in reality, good design can mitigate this, and you should not present it as fact to the workshop.

  The point where I am least sure I have got the argument right is Elias's concession that "looseness is a demanding regime." While logically sound, it assumes the participants will recognize the enforcement of meta-rules as distinct from the enforcement of water rules. Sharp participants may argue this is a distinction without a difference, collapsing the theoretical advantage I tried to give Elias.
