prompt: |-
  My flatmate is putting together a piece on perpetrator studies and his entire framing is that Browning's Battalion 101 is Milgram's basement writ large: same ingredients, an authority figure who hands out the order, ordinary men who'd never have volunteered, a task chopped into small procedural steps, and an exit that costs you your standing with the group. He makes two moves with it. First, the men weren't antisemites in any interesting sense, so people hunting for "eliminationist" ideology are just monster-hunting in disguise. Second, the lesson is institutional — build in friction, rotation, and an option to step out that's *visible* as stepping out, and you blunt the whole mechanism. I think the analogy is carrying way more weight than he's checked and I want to send him something better than my objections.

  So can you audit it properly? Correspondence table first — who's the experimenter, who's the learner, what are the prods, what plays the role of the 65%, what's the debrief. Then the disanalogies, seperated into ones that actually threaten his two conclusions and ones that are just local color: months of killing versus an hour in a lab, pressure from mates rather than a vertical authority, victims you've been living alongside for a year, the dozen-odd who did step out at Józefów and weren't punished for it (one apparently got promoted).

  Also — the source domain is shakier than he assumes, isn't it? The archival material about prods going off-script, Burger's partial replication, the engaged-followership reading where subjects obeyed because they identified with the scientific project rather than because they'd been switched off. If that reading's right, does his analogy just get weaker, or does it quietly mutate into Goldhagen's argument? And if the Milgram frame has to go, what analogy would actually carry what Battalion 101 was — workplace socialization, a team hazing new members, something else?

  Give me rough confidence levels on the main claims and flag the single point you're least sure of, since I'll be forwarding this.
