answer: |-
  **MEMORANDUM**

  **TO:** Board of Directors, Emergency Hardship Fund
  **FROM:** [Your Name]
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation Regarding Eligibility Screening and Triage Protocols

  **Recommendation**

  I recommend that the Board vote to **abandon the retrospective "circumstances beyond control" screen** and **decline to adopt the prospective agreement scheme**. In their place, we should adopt a **Harm-Severity Triage Protocol**.

  Under this protocol, eligibility is determined solely by the severity and immediacy of the impending harm and the likelihood that fund intervention will prevent it. Past financial decisions, including business risks or depletion of savings, are inadmissible during intake unless there is evidence of active fraud. The "beyond control" clause of our ordinance should be interpreted as a directive to prioritize external shocks (market collapse, medical crisis) over internal preferences, but never as a veto against preventing severe harm.

  **Rationale**

  Our enabling ordinance contains a tension: we must prioritize need arising from external circumstances, yet we cannot refuse aid where severe harm is imminent. The current retrospective screen forces intake staff to act as moral adjudicators, dissecting an applicant's history to determine how "voluntary" a crisis is. This is unworkable. As the case of the business owner with the untreated fracture illustrates, a past choice (starting a business) does not negate a present catastrophe (eviction and medical neglect). Denying aid in such cases likely violates the "severe and lasting harm" clause, exposing the city to liability and failing our humanitarian mandate.

  The proposed prospective agreement scheme—where residents sign away priority status when obtaining licenses or leases—is well-intentioned but flawed. Administratively, it requires siloed data sharing between licensing, housing, and our fund that does not currently exist. Ethically, it risks coercing citizens to waive safety-net rights during routine administrative transactions. Most critically, it fails to resolve the statutory conflict: if an applicant signed a waiver but now faces "severe and lasting harm," the ordinance's second clause likely overrides their prior agreement. We cannot contract away statutory mandates to prevent suffering.

  **Operational Criteria for Intake**

  To replace the responsibility screen, intake staff will apply the following three criteria. This removes the need to judge an applicant's life history while managing the fixed pot through triage.

  1.  **Immediacy of Harm:** Is the threat of eviction, shutoff, or health deterioration active and imminent (within 14 days)?
  2.  **Severity of Outcome:** Will the negative outcome result in lasting damage (e.g., permanent disability, chronic homelessness, loss of licensure) rather than a temporary inconvenience?
  3.  **Efficacy of Intervention:** Will the grant definitively resolve the immediate barrier?

  *Application to Case Study:* Under this protocol, the business owner is eligible. Her fracture and eviction meet the *Severity* and *Immediacy* thresholds. The fact that her savings were depleted by a business is irrelevant to the *Efficacy* of the grant in stopping the eviction. She is triaged based on the medical risk, not the business failure.

  **The Strongest Case Against This Recommendation**

  The most compelling argument against abandoning the responsibility screen is the reality of the fixed pot and the social contract. Every dollar awarded to an applicant whose need stems from high-risk voluntary choices is a dollar denied to an applicant whose need stems from pure misfortune. By decoupling aid from personal responsibility, we risk transforming the fund from an insurance policy against bad luck into a subsidy for imprudence.

  This is not merely a philosophical objection; it is a political survival strategy. If the public perceives that the Fund routinely bails out failed speculative ventures while waiting lists grow for victims of layoffs or illness, support for the levy will erode. The "beyond control" clause exists for a reason: to assure taxpayers that their contributions are not backing private gambles. If we ignore this, we may secure short-term relief for individuals at the cost of the Fund's long-term viability. A fund that loses public trust cannot distribute any aid, prudent or otherwise.

  **Conclusion**

  While the fiscal and political risks are real, the current screen is legally precarious and administratively unsustainable. The prospective scheme adds complexity without solving the moral hazard. A Harm-Severity Triage respects the ordinance's prohibition on refusing aid for severe harm while allowing us to prioritize the most critical cases. I urge the Board to adopt this protocol to ensure our intake is consistent, legal, and focused on the mitigation of suffering rather than the assignment of blame.
