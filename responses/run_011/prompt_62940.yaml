  I spent twenty years in process safety on refineries and chemical plants: HAZOP studies, bow-tie diagrams, layers of protection analysis, safety instrumented functions, SIL ratings, ALARP demonstrations. I have never worked in machine learning, and I am suspicious of the way the alignment debate is carved up. Restate that debate in my vocabulary as faithfully as you can, and then tell me what did not survive the translation.

