answer: |-
  ### Part 1: The Math (Verification & Stability)

  Before you step into the room, you need to be bulletproof on the numbers. Here is the derivation for your specific payoffs (Exit 1: 2, Exit 2: 6, Past: 0).

  **1. Ex Ante Optimization (The Planner's View)**
  Let $p$ be the probability of exiting at any given ramp.
  *   Probability of exiting at Ramp 1: $p$. Payoff: $2$.
  *   Probability of reaching Ramp 2: $(1-p)$. Probability of exiting there: $(1-p)p$. Payoff: $6$.
  *   Probability of passing both: $(1-p)^2$. Payoff: $0$.

  Expected Value $V(p)$:
  $$V(p) = 2p + 6p(1-p) + 0(1-p)^2$$
  $$V(p) = 2p + 6p - 6p^2 = 8p - 6p^2$$

  Maximize $V(p)$:
  $$V'(p) = 8 - 12p = 0$$
  $$12p = 8 \implies p = \frac{2}{3}$$

  **Optimal Policy:** Exit with probability **2/3**.
  **Max Value:** $V(2/3) = 8(2/3) - 6(4/9) = 16/3 - 8/3 = 8/3 \approx \mathbf{2.67}$.
  *(Note: If they commit to Exit 1 only ($p=1$), Value = 2. If they commit to Exit 2 only ($p=0$), Value = 0. The mixed strategy beats the pure strategies.)*

  **2. Interim Calculation (The Driver's View)**
  At a ramp, the driver suffers from imperfect recall. They know they are at *a* ramp, but not *which* one.
  Let $\alpha$ be the credence "This is Exit 1".
  Using Bayes' rule with the strategy $p$ as the likelihood of reaching the second node:
  *   Likelihood of being at Exit 1: $1$ (Always reached).
  *   Likelihood of being at Exit 2: $1-p$ (Must have continued at 1).
  *   Total likelihood mass: $1 + (1-p) = 2-p$.

  $$\alpha = P(\text{Exit 1} | \text{At Ramp}) = \frac{1}{2-p}$$
  $$(1-\alpha) = P(\text{Exit 2} | \text{At Ramp}) = \frac{1-p}{2-p}$$

  **3. Stability Check (The Fixed Point)**
  We check if the optimal plan $p=2/3$ creates indifference at the node.
  *   **Value of Exiting ($U_E$):** $\alpha(2) + (1-\alpha)(6)$
  *   **Value of Continuing ($U_C$):** If at Exit 1, we reach Exit 2 and play strategy $p$ (expected value $6p$). If at Exit 2, we reach End (value 0). So, $U_C = \alpha(6p)$.

  Plug in the optimal $p = 2/3$:
  *   $\alpha = \frac{1}{2 - 2/3} = \frac{1}{4/3} = 0.75$.
  *   $U_E = 0.75(2) + 0.25(6) = 1.5 + 1.5 = \mathbf{3}$.
  *   $U_C = 0.75(6 \times \frac{2}{3}) = 0.75(4) = \mathbf{3}$.
  *   **Result:** $U_E = U_C$. The driver is indifferent.

  **Stability Dynamics:**
  *   **If Class agrees on $p = 0.8$ (Too High):**
      *   $\alpha = 1/(1.2) = 0.83$. (Driver thinks they are likely at Exit 1).
      *   $U_E = 0.83(2) + 0.17(6) = 2.68$.
      *   $U_C = 0.83(6 \times 0.8) = 3.98$.
      *   **Pressure:** $U_C > U_E$. Driver feels strong urge to **Continue** (lower $p$).
  *   **If Class agrees on $p = 0.5$ (Too Low):**
      *   $\alpha = 1/(1.5) = 0.67$.
      *   $U_E = 0.67(2) + 0.33(6) = 3.32$.
      *   $U_C = 0.67(6 \times 0.5) = 2.01$.
      *   **Pressure:** $U_E > U_C$. Driver feels strong urge to **Exit** (raise $p$).

  The fixed point is stable. The math holds.

  ---

  ### Part 2: Workshop Design

  #### 1. The Amnesia Mechanism
  You cannot physiologically induce amnesia, but you can induce **epistemic symmetry** and disrupt counting.
  *   **Props:** Two stacks of identical index cards labeled "RAMP" on the back. A whiteboard.
  *   **The "Distractor Walk":** When a student is the Driver, they must stand at the front. To move from "Start" to "Ramp 1" and "Ramp 1" to "Ramp 2", they must walk a specific path (e.g., around a chair) while **reciting the alphabet backwards** or **counting down from 100 by 7s**.
      *   *Why:* This occupies the working memory required to track "I have made one decision already."
      *   *Enforcement:* If they stumble, they restart the count. The noise makes it impossible to reliably track decision nodes.
  *   **Identical Signals:** At each node, you (the instructor) place a face-down card. They flip it. It says "RAMP." It looks identical at Exit 1 and Exit 2.
  *   **Instructor as Nature:** You track the state (Exit 1 vs. 2) on the whiteboard where they can't see (or use a hidden sheet). If they Continue at Exit 1, you silently reset the board for Exit 2. If they Continue at Exit 2, you reveal "END OF HIGHWAY."

  #### 2. Payoff Scheme: "Pizza Privilege Points"
  Real money is unethical/complicated; points are ignored. Use **Social Capital**.
  *   **The Pot:** The class competes against a "Par Score" (e.g., 50 points per term). If they beat it, everyone gets pizza next session. If they crush it (e.g., 70 points), *you* bring extra toppings.
  *   **Individual Incentive:** The Driver gets "Immunity." If the drive fails (Value 0), they are exempt from bringing snacks next time. If it succeeds (Value 6), they get to choose the music.
  *   **Why this works:** It aligns the group (maximize average) with the individual (avoid zero), but creates tension if the individual deviation helps them personally but hurts the group average.

  #### 3. Round Structure & Timeline (80 Minutes)

  **0:00 – 0:10: Setup & Rules**
  *   Explain the Highway (2, 6, 0).
  *   Explain the Amnesia Protocol (Distractor Walk + Identical Cards).
  *   **Do not mention mixed strategies yet.** Ask: "What's the plan?"

  **0:10 – 0:35: Round 1 & 2 (The Pure Strategy Trap)**
  *   **Round 1:** Ask for a consensus plan. They will likely say "Always Exit 2" ($p=0$).
      *   Run 3 drivers. Most will pass Exit 1, but at Exit 1 they feel the urge to exit. Record deviations.
      *   *Result:* Low scores. Many accidental Exits at 1.
  *   **Round 2:** Ask for a new plan. They might try "Always Exit 1" ($p=1$).
      *   Run 3 drivers. Safe, but low value (2).
      *   *Debrief Moment:* "Why did the 'Exit 2' plan fail?" (Because at Ramp 1, 2 looks better than the risk of 0).

  **0:35 – 0:55: Round 3 (The Mixed Strategy Convergence)**
  *   **The Pivot:** Tell them: "You need a policy that makes the Driver at the ramp *not want to deviate*."
  *   Ask them to propose a probability $p$. (e.g., "Roll a die, 1-4 Exit").
  *   Run 4 drivers.
  *   **The Confession Slip:** At every ramp decision, before acting, the Driver writes: *"I think this is Exit [1/2]. Confidence: [0-100%]."* They fold it and hand it to a TA/Trustee.
  *   **Scoreboard:** Update the Class Total. If they hover near $p=2/3$, the score should jump.

  **0:55 – 1:05: The Reveal & Tally**
  *   Open the Confession Slips.
  *   Tally the "Exit 1" guesses.
  *   **The Kicker:** If they played near $p=2/3$, roughly **75%** of the slips should say "Exit 1".
  *   Show them the math: $\alpha = 1/(2-p)$. If $p=2/3$, $\alpha=0.75$.
  *   *Point:* "Your gut feeling about where you were wasn't a guess; it was a Bayesian update on your own policy."

  **1:05 – 1:15: Extension (The Landmark)**
  *   **Scenario:** "Exit 2 now has a Neon Sign 50% of the time. Exit 1 never does."
  *   **Question:** "Does $p$ go up or down?"
  *   **Answer:** If you see no sign, you are *more* likely to be at Exit 1 than before. This makes Exiting less attractive (since Exit 1 pays 2). You should **Continue more** (lower $p$) when there's no sign.
  *   *Note:* Don't solve the math. Just let them argue the direction.

  **1:15 – 1:20: Final Debrief**
  *   Map the terms: Ex Ante (Planner) vs. Interim (Driver).
  *   Release the vocabulary: "Time Inconsistency," "Self-Locating Belief," "Piccione-Rubinstein."

  #### 4. Deviations & Rules
  *   **Policy:** Deviations are **allowed** but **taxed**.
  *   **Rule:** "You announce a plan ($p$). If you deviate at the node, your personal 'Immunity' is voided (you must bring snacks if the class fails), but the Class Points stand."
  *   **Why:** This prevents "You broke the rules" arguments. It frames deviation as a selfish betrayal of the social contract, which mirrors the game-theoretic tension perfectly.
  *   **Recording:** You (Instructor) mark a red star on the scoreboard for every deviation. High deviation count = "The Plan was Unstable."

  #### 5. The Confession Slip Tally
  *   **What to do:** Don't look at them until the end.
  *   **Expected Pattern:**
      *   If $p \approx 0$ (Plan: Exit 2), $\alpha = 0.5$. Slips should be 50/50.
      *   If $p \approx 1$ (Plan: Exit 1), $\alpha = 1$. Slips should be 100% "Exit 1".
      *   If $p \approx 2/3$, $\alpha = 0.75$. Slips should be ~75% "Exit 1".
  *   **Pedagogical Use:** This proves that "I don't know where I am" is not a uniform distribution. It is a function of the strategy.

  ---

  ### Part 3: Troubleshooting & Debrief

  #### What Predictably Goes Wrong
  1.  **The Econ Major:** One student will calculate $p=2/3$ in Round 1 and shout it out.
      *   *Recovery:* "Great. You are now the Auditor. Your job is to verify if the Drivers are actually following that probability. Don't tell the Drivers; watch their hands." This turns them from a spoiler into a mechanic.
  2.  **The Counting Cheat:** A student realizes the distractor task isn't enough and counts "One... Two..."
      *   *Recovery:* Call it out gently. "If you know where you are, the paradox vanishes. You're playing a different game. For the sake of the experiment, please embrace the confusion."
  3.  **Lopsided Coins:** In a sample of 20, random noise might make $p=2/3$ look worse than $p=1$.
      *   *Recovery:* Use the **Expected Value** board, not just the Actual Score. "Yes, you got unlucky this round, but mathematically, this policy yields 2.67 over time. We are testing rationality, not luck."
  4.  **The "Just Flip a Coin" Dismissal:** Students leave thinking randomization is just hedging.
      *   *Recovery:* In the debrief, emphasize: "You didn't flip a coin to avoid responsibility. You flipped a coin to **change the probability of where you thought you were.** The randomization *creates* the belief state that makes the decision rational."

  #### The Debrief: Mapping the Concepts
  *   **Ex Ante vs. At-the-Node:** Point to the Round 1 Plan (Ex Ante) vs. The Deviation Star (At-the-Node). "The Planner is rational. The Driver is rational. They disagree. Why? Because they have different evidence."
  *   **Evidence:** "What evidence does the Driver have? Only 'I am at a ramp.' That evidence is more likely to occur if you are at Ramp 1 (probability 1) than Ramp 2 (probability $1-p$). Your credence *must* reflect that."
  *   **Withholding Terms:** Keep "Imperfect Recall" and "Centered Belief" in your pocket until the last 5 minutes. Let them describe the *feeling* first ("It felt like I was probably at the start"). Then label it.

  #### Limitations: The Honest Paragraph
  *   **The Problem:** Your students are not absent-minded. They know they are in a philosophy workshop. They know there is a "right answer." Their credence at the ramp is not a genuine, visceral confusion; it is a calculated simulation of confusion. The tension they feel is intellectual, not existential. They don't *fear* sleeping in the car; they fear looking stupid in front of peers.
  *   **The Fix:** In the final 2 minutes, say this: "Today, you simulated the *information structure* of absent-mindedness, not the psychology. In the real paradox, the driver isn't pretending to forget; they literally cannot distinguish the nodes. The lesson isn't that you should pretend to be confused. It's that when your future self has less information than your current self, your current self must tie its own hands. You didn't feel the amnesia, but you did feel the handcuffs. That's the part that matters."

  ---

  ### Summary Checklist for You
  1.  **Prep:** 40 Index cards (all say "RAMP"), Confession Slips (small paper), Whiteboard marker.
  2.  **Math:** Keep the $p=2/3, \alpha=0.75$ derivation on a hidden note card.
  3.  **Vibe:** Collaborative but rigorous. You are the Game Master, not the Lecturer.
  4.  **Goal:** If they leave arguing about whether their belief at the ramp was "real," you win.
