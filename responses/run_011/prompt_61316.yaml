  # Joint Statement of Adversarial Collaboration on Moral Responsibility

  **Preface**
  This document records the outcomes of a structured collaboration between Camp P (Pessimists regarding moral responsibility) and Camp C (Compatibilists regarding reactive attitudes). The purpose of this collaboration is not to resolve the dispute by declaring one side victorious, but to map the exact topology of the disagreement, identify shared premises, isolate empirical and conceptual cruxes, and determine the extent to which the dispute is verbal versus substantive. Both camps affirm the accuracy of this mapping without conceding their respective positions on the ultimate nature of responsibility.

  **1. Agreed Claims**
  The following claims are accepted by both Camp P and Camp C. Each claim is non-vacuous in that it is denied by significant philosophical positions outside this collaboration (e.g., Libertarians or traditional Deterministic Incompatibilists).

  1.  **The Irrelevance of Determinism:** The central dispute does not turn on the truth or falsity of determinism. Both camps agree that even if indeterminism were proven true at the relevant level of human decision-making, it would not satisfy the Pessimist's demand for responsibility, nor would it alter the Compatibilist's account of reactive attitudes.
      *   *Why not vacuous:* Traditional Libertarians deny this, insisting indeterminism is necessary for responsibility. Traditional Hard Incompatibilists who rely solely on determinism deny this, insisting determinism is the primary threat.
  2.  **The Impossibility of Self-Creation:** Both camps accept the logical truth that nothing can be the ultimate cause of itself (causa sui) in the respect required for "ultimate responsibility." An agent cannot choose their own initial nature without already having a nature to do the choosing.
      *   *Why not vacuous:* Some Libertarians deny this, positing agent-causation allows for a form of self-origination that escapes this regress.
  3.  **The Centrality of Reactive Attitudes:** Both camps agree that the actual human practice of holding one another responsible is constituted primarily by interpersonal reactive attitudes (resentment, gratitude, indignation) rather than by abstract metaphysical judgments.
      *   *Why not vacuous:* Rationalists and some Libertarians deny this, arguing that responsibility is grounded in rational agency or metaphysical freedom independent of emotional practices.

  **2. Residual Disagreements**
  The following disagreements remain unresolved. Each is stated twice: once in the wording Camp P accepts, once in the wording Camp C accepts.

  *   **Disagreement 1: The Necessity of Ultimate Sourcehood**
      *   *Camp P Statement:* True moral responsibility requires that an agent be the ultimate source of their own character; since this is impossible, the desert-based punishments and rewards we practice are ultimately unjustified.
      *   *Camp C Statement:* True moral responsibility requires only that an agent participate in the interpersonal community with a normal quality of will; the demand for ultimate sourcehood is an external philosophical imposition not required by the practice itself.
      *   *Classification:* Substantive.
      *   *What Turns On It:* Whether our current practices of blame and punishment are fundamentally unjust (Camp P) or fundamentally sound (Camp C).
      *   *Residual Objection:* Camp P objects that Camp C changes the subject from "responsibility" to "social utility." Camp C objects that Camp P demands an incoherent concept that no one actually uses.

  *   **Disagreement 2: The Implications of Formative History**
      *   *Camp P Statement:* Knowledge of the causal origins of an agent's character (upbringing, biology, trauma) should systematically mitigate blame and punishment because it reveals the absence of ultimate responsibility.
      *   *Camp C Statement:* Knowledge of the causal origins of an agent's character is relevant only insofar as it reveals impairments to current rational capacity or quality of will, not because it undermines responsibility per se.
      *   *Classification:* Substantive with Verbal Residue.
      *   *What Turns On It:* How sentencing and interpersonal accountability should adjust in light of psychological and sociological data.
      *   *Residual Objection:* Camp P objects that Camp C ignores the moral luck inherent in formative history. Camp C objects that Camp C conflates explanation with excuse.

  **3. Cruxes**
  The following issues are identified as cruxes such that settling them would move at least one side.

  *   **Crux 1: The Empirical Impact of Formative History on Sentencing**
      *   *Test/Case:* A state sentencing commission pilots a randomized program. In half of 200 comparable cases, defense counsel files a formative-history memorandum (causal origins of character, upbringing, violence, illness) read by the judge before sentencing. The other half receive ordinary presentence reports.
      *   *Measures:* (1) Sentence length; (2) Judges' reported sense of fairness/legitimacy; (3) Spread of practice to other institutions within three years; (4) Reaction of victims' advocates.
      *   *Camp P Prediction:* (1) Sentences will be significantly shorter in the treatment group; (2) Judges will report higher fairness; (3) Practice will spread rapidly as more just; (4) Victims' advocates will initially resist but shift as understanding grows.
      *   *Camp C Prediction:* (1) Sentences will show no significant difference; (2) Judges' fairness ratings will remain unchanged; (3) Practice will not spread beyond niche contexts; (4) Victims' advocates will remain hostile, viewing it as excuse-making.
      *   *Predictions Diverge:* True.
      *   *What Convergence Shows:* null
      *   *Camp P Falsifier:* If sentences in the treatment group are *longer* or unchanged, and judges report *lower* fairness, this suggests formative history is viewed as aggravating or irrelevant to justice, undermining the claim that it mitigates desert.
      *   *Camp C Falsifier:* If sentences drop significantly and judges report higher fairness, this suggests the practice of responsibility *does* implicitly rely on ultimate sourcehood, undermining the claim that history is irrelevant to responsibility status.
      *   *Note on Convergence:* Both camps predict initial hostility from victims' advocates. This coincidence suggests that while the theoretical dispute is deep, the practical resistance to changing blame practices is robust across theories.

  *   **Crux 2: The Intelligibility of 'Desert' without Sourcehood**
      *   *Test/Case:* Conceptual analysis of whether "desert" can be coherently defined without reference to ultimate origination.
      *   *Camp P Prediction:* Any definition of desert without sourcehood will collapse into forward-looking utility or social regulation.
      *   *Camp C Prediction:* A definition of desert based on quality of will and interpersonal standing is coherent and distinct from utility.
      *   *Predictions Diverge:* True.
      *   *What Convergence Shows:* null
      *   *Camp P Falsifier:* If a definition of non-ultimate desert is produced that satisfies neutral intuitions about fairness without referencing utility.
      *   *Camp C Falsifier:* If all proposed definitions of non-ultimate desert are shown to implicitly rely on sourcehood or collapse into utilitarianism.

  **4. Verbal Dispute Account**
  We tested the hypothesis that the disagreement decomposes into three notions: (a) Answerability (aptness for appraisal based on quality of will), (b) Accountability (liability to sanctions), and (c) Ultimate Responsibility (being the ultimate source of one's nature).

  *   **Verdict:** The decomposition **relocates** the dispute rather than dissolving it.
  *   **Reasoning:** Both camps accept (a) and (b) as descriptions of actual human practice. They agree that humans *do* hold each other answerable and accountable. The dispute is not about whether (a) and (b) exist, but whether they are *morally legitimate* without (c). Camp P argues (a) and (b) presuppose (c) for legitimacy. Camp C argues (a) and (b) are self-justifying within the interpersonal sphere.
  *   **Substantive Residue:** The normative claim that "Fairness requires Ultimate Responsibility." This is not verbal; it is a clash of fundamental moral intuitions.
  *   **Premise Where Split Fails:** The split fails at the premise: "Is it unfair to hold someone accountable for traits they did not ultimately choose?" Camp P says Yes; Camp C says No. The decomposition clarifies the terms but does not resolve this normative clash.

  **5. Unresolved Items**
  The following items cannot be settled in a joint statement:
  1.  **The Ultimate Truth of Responsibility:** Whether moral responsibility in the "basic desert" sense actually exists. This requires adjudication which this collaboration forbids.
  2.  **The Normative Priority:** Whether metaphysical coherence (Camp P) or interpersonal practice (Camp C) should dictate our moral terminology.

