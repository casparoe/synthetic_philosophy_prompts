answer: |-
  # Joint Statement on Boundary Delimitation: The Kalder Case

  **Parties:** Proponent of the All-Affected Principle (AAP) | Proponent of the All-Subjected Principle (ASP)
  **Date:** [Current Date]
  **Subject:** Adversarial Collaboration on Democratic Boundaries

  ### 1. Agreed Claims

  1.  **Legitimacy Requires Justification:** Any decision regarding the franchise for the Kalder independence referendum requires a public justification that does not arbitrarily exclude individuals whose moral standing is relevant to the decision.
  2.  **The Seasonal Workers' Status:** The 20,000 seasonal fishery workers are currently excluded from the franchise despite paying local taxes and being subject to Kalder's local laws for eight months of the year. Both parties agree this status requires specific justification, regardless of whether the final verdict is inclusion or exclusion.
  3.  **External Impacts:** The offshore wind array decision creates effects beyond Fenmark's jurisdiction, specifically regarding the fish stock migration routes utilized by the third country's fleet. Both parties agree these effects are real and measurable, even if they disagree on whether these effects grant voting rights.
  4.  **Future Interests:** The seabed lease trust creates enforceable claims for beneficiaries who do not yet exist. Both parties agree that the current referendum decision will bind these future persons, creating a problem of intergenerational representation that neither principle solves easily.
  5.  **The Meta-Franchise Problem:** The Kalder Assembly's decision to vote on who gets to vote (the franchise question) is logically prior to the independence vote but practically simultaneous. Both parties agree that resolving who decides the franchise is necessary before the franchise itself can be considered legitimate.
  6.  **National Revenue vs. Local Cost:** The fact that wind farm revenue goes to the national treasury while the cable lands on Kalder creates a divergence between those who benefit financially (all Fenmark citizens) and those who bear the physical/environmental costs (Kalder residents). Both parties agree this divergence complicates the boundary question.

  ### 2. Disagreements Table

  | Issue | All-Affected Statement (AAP) | All-Subjected Statement (ASP) | Verdict & Reasoning |
  | :--- | :--- | :--- | :--- |
  | **Seasonal Workers** | These workers have vital interests affected by Kalder's local laws and tax spending; therefore, exclusion violates the principle that impact warrants input. | These workers are subject to local coercive jurisdiction during their residence; compliance with local law generates a claim to reciprocity in rule-making. | **Verbal.** Both principles converge on inclusion here. The conflict arises from labeling the justification ("interests" vs. "coercion") rather than the outcome. If both accept the empirical fact that workers are both affected and subjected, the dispute is terminological. |
  | **Third Country Fishers** | The shift in migration routes materially harms the livelihood of these fishers; affected interests extend beyond borders, so some mechanism for their input is required. | These fishers are not subject to Fenmark or Kalder's coercive authority; granting them a vote conflates causal impact with political membership and undermines the boundary of the demos. | **Genuine.** The principles diverge on outcome. AAP demands inclusion (or compensation representation); ASP demands exclusion. This is a structural conflict about whether democracy tracks harm or authority. |
  | **Future Beneficiaries** | Future generations have interests at stake in the 60-year trust; democratic theory must account for these interests via proxies or trusteeship to avoid tyranny over the unborn. | Political subjecthood requires the capacity to be coerced and to obey laws in the present; non-existent persons cannot be subjects, so their interests are protected via trusteeship, not voting rights. | **Genuine.** The disagreement is about the nature of agency. AAP treats "interests" as sufficient for standing; ASP treats "capacity for subjection" as necessary. |
  | **The Franchise Question** | Those affected by the rules of voting should vote on the rules of voting; restricting the franchise vote to the Assembly excludes those affected by the Assembly's decision. | The authority to define the franchise belongs to the existing sovereign body (Fenmark Parliament or Kalder Assembly); asking everyone to vote on who votes leads to infinite regress. | **Genuine.** AAP faces a regress problem (who decides who decides?); ASP relies on a constitutive authority that AAP views as potentially arbitrary. |

  ### 3. Three Cruxes

  **Crux 1: The Overlap of Sets in Ordinary Cases**
  *   **The Question:** Do "affected interests" and "subjected persons" pick out the same group in stable political contexts, diverging only at the margins (like Kalder)?
  *   **Test:** Compare standard municipal zoning decisions vs. national trade treaties. In zoning, neighbors are affected and subject. In trade, foreign producers are affected but not subject.
  *   **AAP Prediction:** The sets diverge frequently. Modern economies create causal chains where significant interests are impacted outside the jurisdiction (e.g., the third-country fishers), meaning ASP systematically excludes relevant stakeholders.
  *   **ASP Prediction:** The sets converge in stable states. Most significant effects are mediated through law. Where effects exist without subjection (like the fishers), they are matters for diplomacy or compensation, not democratic membership. Expanding the demos to match all effects makes democratic decision-making impossible.

  **Crux 2: The Status of Future Generations**
  *   **The Question:** Can the "all-subjected" principle accommodate the Kalder Trust beneficiaries without collapsing into the "all-affected" principle?
  *   **Test:** The Kalder Seabed Trust. If we appoint proxies to vote on behalf of the unborn beneficiaries, does this satisfy ASP, or does it secretly import AAP?
  *   **AAP Prediction:** It imports AAP. Appointing proxies acknowledges that interests exist independently of current subjecthood. If we protect them because they are *affected*, we have conceded the core AAP claim.
  *   **ASP Prediction:** It does not import AAP. Trustees are current subjects acting under fiduciary law. The unborn are not voters; they are objects of legal protection managed by current subjects. ASP can handle this via law, not franchise expansion.

  **Crux 3: The Meta-Franchise (Who Decides the Voters?)**
  *   **The Question:** Is the decision regarding the franchise itself a democratic decision, or a constitutive act of authority?
  *   **Test:** The Kalder Assembly voting on whether to include seasonal workers in the independence referendum.
  *   **AAP Prediction:** This is illegitimate circularity. If the seasonal workers are affected by the franchise rule, they should vote on the franchise rule. Excluding them from the meta-vote assumes the conclusion (that they aren't members).
  *   **ASP Prediction:** This is constitutive necessity. Someone must hold the authority to define the boundary before a vote can occur. The Assembly holds this authority under Fenmark's constitution. Demanding a prior vote on the franchise leads to an infinite regress where no vote can ever occur.

  ***

  **Confidence Statement**

  I am moderately confident in these attributions, particularly regarding the structural divergences on third-country nationals and future generations, which represent classic fault lines in democratic theory. The characterization of the All-Subjected Principle as compatible with trusteeship for future generations (Crux 2) is standard within legal positivist frameworks, and the All-Affected worry about infinite regress (Crux 3) is a well-known internal critique. However, the claim I am least sure both parties would sign is **Agreed Claim #2** regarding the seasonal workers. While I have framed it as a shared need for justification, a hardline All-Subjected theorist might argue that seasonal presence does not constitute sufficient "subjection" to warrant any special justification beyond existing immigration law, whereas the All-Affected theorist might view tax payment alone as sufficient for inclusion. There is a risk that even this agreed claim masks a deeper divergence on what counts as a relevant interest or sufficient coercion.
