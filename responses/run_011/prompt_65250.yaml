answer: |-
  ### Case Study: The Renewable Energy Directive (2009/28/EC) and Biofuel Sustainability Criteria

  **The Decision**
  *   **Policy Area:** Climate and Energy Policy (specifically transport decarbonisation).
  *   **Timing:** Adopted April 2009; implementation and delegated acts continued through the 2010s.
  *   **Decision-Maker:** The European Parliament and the Council of the European Union (acting under the Ordinary Legislative Procedure).
  *   **Authority:** Article 175 of the Treaty establishing the European Community (now Article 194 TFEU).
  *   **The Act:** Directive 2009/28/EC (the Renewable Energy Directive or "RED I"). It mandated that 10% of energy in transport must come from renewable sources by 2020. Crucially, it established **sustainability criteria** for biofuels. To count toward the target, biofuels had to meet specific greenhouse gas savings thresholds and could not be made from raw materials obtained from land with high carbon stock (e.g., wetlands, forests).

  **The Divergence: All-Subjected vs. All-Affected**

  This decision creates a sharp divergence between the two principles regarding who constitutes the legitimate *demos*.

  1.  **The All-Subjected Principle (ASP):**
      *   **Constituency:** Citizens and residents of the EU Member States, and legal entities operating within EU jurisdiction.
      *   **Rationale:** These are the agents bound by the coercive force of the Directive. EU member states must transpose it into national law; fuel suppliers within the EU must prove compliance or face penalties.
      *   **Verdict:** The decision-making arrangement **satisfies** the ASP. The rules were made by the representatives of those who are legally subject to them (EU citizens via the Parliament and Council).

  2.  **The All-Affected Principle (AAP):**
      *   **Constituency:** Any person whose interests are significantly shaped by the Directive. This includes agricultural producers in third countries (e.g., palm oil smallholders in Indonesia, soy farmers in Brazil) whose market access depends entirely on EU sustainability classifications.
      *   **Rationale:** The EU is a dominant market for biofuels. By setting sustainability criteria, the EU effectively regulates land-use practices in sovereign states outside its borders. A decision to classify palm oil as "high risk" (as happened in subsequent delegated acts under RED I and RED II) devastates the livelihoods of millions of smallholders who had no representation in the EU legislative process.
      *   **Verdict:** The decision-making arrangement **fails** the AAP. The people whose economic survival is contingent on the rule had no vote in its creation.

  **The Closure Problem (Constraint 2)**

  This case illustrates the specific difficulty you requested: admitting the affected outsiders generates a fresh set of excluded persons, making the constituency impossible to close.

  Imagine we amend the EU's institutional design to satisfy the AAP for this decision. We grant voting rights in the European Parliament to Indonesian palm oil farmers, as their interests are directly affected by the sustainability criteria.

  1.  **The New Decision:** This expanded *demos* (EU citizens + Indonesian farmers) votes on the biofuel rules. Suppose they vote to maximize palm oil imports to protect farmer livelihoods, relaxing the deforestation criteria.
  2.  **The Fresh Exclusion:** This new rule incentivizes land expansion in Indonesia. This expansion directly affects **local indigenous communities** in Sumatra or Kalimantan, whose land rights are encroached upon by the farmers' increased production.
  3.  **The Regress:** These indigenous communities are now subject to a decision (the relaxed criteria) made by a constituency (EU citizens + farmers) in which they have no voice. To satisfy the AAP for *them*, we must admit them to the *demos*. But their admission changes the voting calculus, potentially altering land-use decisions again, which affects *their* neighbors or global consumers via price changes.

  The boundary of the *demos* cannot be sealed. Every time you expand the constituency to include those affected by the rule, the exercise of that constituency's power affects a new set of outsiders who remain unrepresented.

  **Analysis of "Affectedness"**

  The divergence in this case relies on a specific sense of being affected: **having one's interests set back** (specifically, economic livelihood and market access), rather than **having one's options foreclosed by coercive law**.

  *   **Interests Set Back:** The Indonesian farmers are not legally coerced by the EU Directive in the strict sense; Indonesia remains a sovereign state. They *choose* to export to the EU. However, their practical options are so constrained by the EU's market power that the distinction between "influence" and "coercion" blurs. Their interest in a stable income is set back by the EU's unilateral rule-making.
  *   **Options Foreclosed:** The ASP focuses on this sense. EU fuel suppliers are legally forbidden from selling non-compliant fuel as "renewable." They are subjected to coercion.

  **Is the choice between these senses doing quiet work?**
  Yes. If we define "affected" strictly as "subject to coercive law" (the subjection sense), the AAP collapses into the ASP, and the EU passes the test. If we define "affected" as "significant interest impact" (the causal sense), the EU fails. The verdict on the democratic deficit turns entirely on which sense of "affected" is prioritized. In this case, the "interest setback" view is doing the work to generate the critique of the EU, because the "coercion" view exonerates it.

  **Diagnosis: Institutional Defect, Principled Defect, or Beyond Scope?**

  The difficulty identified here is best understood as **a defect in the All-Affected Principle (or rather, a limit of its coherence)**, rather than a specific defect in the Union's institutional design.

  *   **Why not an Institutional Defect?** The EU is designed as a territorial polity with a defined citizenship. It is structurally incapable of enfranchising non-citizens without ceasing to be a state-like union and becoming a global plebiscite. Asking the EU to solve this via institutional reform (e.g., "seats for third-country farmers") treats a structural feature of the principle as a bureaucratic oversight.
  *   **Why a Principled Defect?** The "Closure Problem" demonstrated above suggests that the AAP, in its strong form, cannot generate a stable boundary for a decision-making body. As political theorist Robert Goodin has argued, the principle is morally compelling but administratively indeterminate. As critics like Daniel Whelan counter, without a closed boundary, there is no "people" to authorize the rule. The biofuel case shows that in a globalized economy, the chain of affect is infinite. Therefore, the AAP cannot serve as a standalone criterion for institutional design because it cannot identify *who* should design the institution.

  **State of the Question**

  It is vital to distinguish what is settled from what is contested in this analysis:

  1.  **Settled:** It is widely accepted among scholars of EU democracy that the Union satisfies the All-Subjected Principle reasonably well (via the Parliament and Council) but struggles with the All-Affected Principle regarding externalities (trade, environment, migration). It is also settled that the "boundary problem" (who constitutes the *demos*) is the central theoretical hurdle for supranational democracy.
  2.  **Contested:**
      *   **The Coherence of the AAP:** There is no consensus on whether the AAP can be formulated coherently. Some argue (like Goodin) that it should replace the ASP entirely. Others (like Whelan or Miller) argue that without a pre-political boundary (like citizenship or territory), the AAP leads to the infinite regress shown in the biofuel case, rendering it useless for institutional design.
      *   **The Moral Weight of "Interests" vs. "Coercion":** It is contested whether having one's economic interests set back by a foreign regulator creates a *democratic* claim (a right to a vote) or merely a *diplomatic* claim (a right to negotiation). Treating market impact as a claim to enfranchisement is a highly contested normative leap.
      *   **Supranational Demos:** There is no consensus on whether democracy requires a single *demos* at all. Some argue the EU is a "democracy of states" (where the ASP is satisfied at the national level), while others argue that for EU-level powers, an EU-level *demos* is required.

  **Conclusion for Students**

  This case does not prove the EU is undemocratic. Instead, it demonstrates that the charge of "democratic deficit" depends on which principle of inclusion you adopt. If you adopt the All-Subjected Principle, the EU's biofuel policy is legitimate. If you adopt the All-Affected Principle, it is illegitimate. However, the biofuel case further reveals that the All-Affected Principle may be impossible to implement without triggering an infinite regress of excluded outsiders. Therefore, the "deficit" may not be a flaw in the EU's architecture, but a reflection of the impossibility of matching democratic boundaries to globalized economic consequences.
