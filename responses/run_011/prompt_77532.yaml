  Good afternoon. For those who don't know me, I'm one of the junior staff. Which means I've spent the last year trying to keep up with [Name].

  There are stories about her toughness. I want to talk about her thermos. On every field visit, for fourteen years, she has poured herself a cup of the local instant coffee. The kind that tastes like burnt sugar and dust. She says it would be rude to drink anything else. That detail matters. It tells you how she sees our place here. We are guests. We are here to serve, not to be served.

  She made every new officer spend three months in a district office before touching a spreadsheet. She learned the language well enough to correct our pronunciation of place names. She held this program together through a currency collapse and an epidemic. She hired many of the people in this room straight out of university. She gave them the tools to replace her.

  But she also understood something harder than toughness. In 2016, the Ministry decided to shift models. She didn't fight it openly. She found other ways to keep the work going in the districts that needed it. She ran the program in parallel for four years until the numbers spoke for themselves. There were times when the necessary path wasn't the one marked on the official chart. She knew that responsibility sometimes means acting before everyone agrees. She never fought for power; she fought for the outcomes that would let us leave. She told me once it wasn't her call to lose a program over someone else's org chart. She was right.

  John Stuart Mill wrote that authority over others is only justified if it aims to make itself unnecessary. That is the quiet tension of this work. We are entrusted to build something we do not own, guided by a map we did not draw. Our presence is only legitimate as long as it is temporary. A trust that must work itself out of a job. If we stay too long, we become the problem. If we leave too soon, we abandon the work.

  [Name] is leaving because she believes that work is done. That judgment was hers to make. It is the weight of the role that she decides when the tutelage ends. She has chosen to expire with the trust, on schedule. That is more than the theory ever promised. Most people cling to the power. She recognized the expiration date. She understood that the only true success is when your presence is no longer required.

  To her husband and children: Thank you for lending her to us. We know it wasn't always easy. To the team: We have the numbers. We have the contacts. We have the coffee. We know what needs to be done. To our partners from headquarters: The review will show the results.

  [Name], thank you for showing us how to be temporary. Thank you for showing us that the only way to win this work is to finish it. We will miss you. But we promise to keep the coffee fresh.

