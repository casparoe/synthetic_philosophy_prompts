      *(Refining the Table Row 6)*: The most damaging aspect is that Billy's "self" remains stable *because* he rejects narrative consequence. Dennett says the self is constituted *by* the narrative of consequence. Billy constitutes a self by *denying* consequence. This is a direct contradiction. I will frame the last row around his reaction to his own death threat.

