answer: |-
  This is a sharp pairing. Dennett's "Center of Narrative Gravity" is a functionalist account: the self is a theoretical object, like a center of gravity, posited to make sense of an organism's behavior over time. It earns its keep by allowing the organism (and others) to predict actions and maintain coherence. Billy Pilgrim is a stress test for this because he is a functionalist nightmare: he works, he survives, but he refuses the agency usually required to spin the narrative.

  Here is the reading you asked for, followed by the handout.

  ### Pressure Point One: Borrowed Gravity
  **The Issue:** Billy does not author his life; he inhabits pre-fab metaphysics. He adopts Kilgore Trout's sci-fi tropes to explain his trauma, then upgrades to the Tralfamadorian ontology when the Trout plots prove insufficient. He is a vessel for other people's stories.

  **Dennett's Resources:** Dennett would likely argue this is a feature, not a bug. For Dennett, there is no such thing as a "homegrown" narrative. We are born into language, culture, and existing story structures. The "author" of the self is always a committee of cultural influences. As long as the borrowed narrative successfully organizes Billy's behavior and allows him to navigate his environment (e.g., functioning as an optometrist, surviving the war), the gravity center holds. Dennett cares about utility, not originality.

  **The Friction:** The friction arises in *agency*. Dennett's center of gravity is usually a control fiction; we posit a self to explain why the body *did* X instead of Y. Billy's borrowed narratives remove the "instead of." If the Tralfamadorian story is true, Billy could not have done otherwise. If the self is a fiction posited to track choice and responsibility, a self that denies choice and responsibility is an empty set. Dennett can accommodate borrowed content, but he struggles with borrowed *determinism*. If the narrative gravity removes the gravitational pull of consequences, does the center still hold? Billy suggests it does, which implies the self might be a passive recording device rather than an active center of control.

  ### Pressure Point Two: Anti-Narrative Content
  **The Issue:** The Tralfamadorian view is spatial, not temporal. All moments exist eternally. There is no plot, only structure. "So it goes" is a refrain that refuses to connect events causally. This is not a narrative; it is a catalogue.

  **The Verdict:** This is not just a limit case; it is a counterexample to the specific claim of *Narrative* Gravity. Dennett argues that the self is constituted by the *process* of storytelling—linking past, present, and future into a coherent stream. Billy adopts a philosophy that explicitly severs those links. He views his life as a landscape to be walked through, not a story to be told.

  If Dennett is right, adopting an anti-narrative ontology should result in the dissolution of the self, or at least a catastrophic failure of prediction. Billy does not dissolve. He remains a coherent, identifiable character who predicts his own death and walks into it calmly. This suggests that a "Center of Gravity" can exist without a "Narrative." It might be a *Spatial* Center of Gravity. The novel fights the reading here by demonstrating that a self can persist even when the narrative function is lobotomized. Billy proves you can have a self without a plot, which undermines Dennett's insistence that the self *is* the plot.

  ***

  ### Handout: Billy Pilgrim vs. The Center of Narrative Gravity

  | Moment | What the Narrative-Gravity Reading Predicts | What the Scene Actually Does | Verdict |
  | :--- | :--- | :--- | :--- |
  | **Billy's Post-War Career** | Billy should construct a narrative of success to explain his survival and social standing. | Billy drifts into optometry and wealth through accident and marriage, describing his life with flat detachment rather than a success story. | **Complicates** |
  | **Encounter with Trout** | Billy should critique or filter Trout's ideas through his existing self-conception. | Billy accepts Trout's pulp cosmology immediately, using it to overwrite his own trauma without resistance. | **Complicates** |
  | **The Abduction** | The self should reject an ontology that contradicts basic sensory experience (linear time). | Billy accepts the abduction as more real than his earthly life, reorganizing his identity around an alien perspective. | **Resists** |
  | **Dresden Aftermath** | The narrative self should struggle to integrate the horror of mass death into a meaningful sequence. | Billy bypasses meaning-making entirely; the horror is just another moment to be viewed, not processed. | **Supports** |
  | **Public Speech** | Billy should attempt to persuade others using shared causal logic and narrative argument. | Billy speaks in non-sequiturs about Tralfamadore, failing to communicate yet remaining convinced of his own coherence. | **Resists** |
  | **Acceptance of Assassination** | A narrative self uses prediction to avoid death; the story ends when the protagonist dies. | Billy predicts his death precisely, refuses to prevent it, and treats his end as just another static moment in the structure. | **Resists** |
