      *   *Decision:* The strongest hit is the Anti-Narrative one. If the self is a *narrative* center, and Billy adopts a *non-narrative* ontology, the theory should predict the dissolution of the self. But Billy remains a coherent character. Therefore, the self exists *without* narrative. That breaks Dennett.
      *   *Let's select the rows:*
