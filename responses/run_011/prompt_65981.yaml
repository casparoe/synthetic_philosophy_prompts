answer: |-
  **Procedure for Lay Review of Interpretation Panels**

  1.  **Verdicts:** Assign one of four verdicts, which are the available outcomes terminating the review. **Assert**, which is licensed by direct material link where no viable rivals exist, requires evidence necessitating the claim. **Qualify**, which is licensed when viable rivals exist but evidence could discriminate, requires wording like "possibly" or "may." **Hedge**, which is licensed when empirically equivalent rivals exist or inference is high, requires wording like "interpreted as." **Reject**, which is licensed when no material link exists, requires omission.

  2.  **Tagging:** Tag every claim by its rung on **Hawkes's ladder**, which ranks inference difficulty from production technique to belief. Production technique and subsistence bear artifact and bone evidence; economy and social institution bear distribution and context evidence; belief and ritual bear iconography and unusual deposition evidence. When a single draft sentence climbs two rungs at once, split the sentence or tag the highest rung, treating the whole claim by the stricter standard.

  3.  **Disconfirmation:** Before any claim may be **Assert**ed, the reviewer must name a specific further find, sample, or analysis that would count against it. When no such thing can be named, the verdict must be downgraded one level (from **Assert** to **Qualify**, or **Qualify** to **Hedge**).

  4.  **Underdetermination:** Distinguish **discriminable rivals**, which further evidence could in principle discriminate, from **empirically equivalent rivals**, which are rivals that no conceivable find would separate. Prescribe **Qualify** wording for discriminable rivals (e.g., "Some argue..."); prescribe **Hedge** or **Omit** for equivalent rivals (e.g., "One view is...").

  5.  **Accommodation Test:** To avoid the trap of a narrative that accommodates every feature of the record being treated as thereby supported, ask: "Does this story explain contradictory evidence equally well?" If yes, the narrative is insulated; **Reject** or **Hedge**.

  6.  **Analogy:** Comparison with a documented society may be admitted as evidence rather than as mere illustration only when geographic or temporal continuity suggests structural similarity. Otherwise, label "Illustration only."

  7.  **Risk:** Gates 3 (Disconfirmation) and 5 (Accommodation) are judgements of risk appetite or taste wearing procedural clothes. The committee should minutely record dissent in the minutes when it overrides a **Hedge** to **Qualify**, noting the specific risk accepted.

  **Application to Draft Sentences**

  (a) **Bronze Bog.**
  *   **Tag:** Belief (highest rung).
  *   **Rivals:** Founder's cache; wealth buried for recovery.
  *   **Disconfirmation:** Absence of ritual context markers (e.g., non-utilitarian offerings alongside).
  *   **Underdetermination:** Discriminable (context analysis could separate ritual from hoard).
  *   **Accommodation:** "Offered" explains breakage; "Cache" explains breakage. Fits both.
  *   **Verdict:** **Qualify**.
  *   **Panel Text:** "Twenty-three bronze objects, deliberately bent and broken, recovered from a peat bog. Possibly offered to the gods of the wetland, though perhaps hidden wealth." (29 words)

  (b) **Tomb Axis.**
  *   **Tag:** Belief (highest rung).
  *   **Rivals:** Azimuth selected after the fact; follows slope or landmark.
  *   **Disconfirmation:** Survey showing azimuth mismatch with slope or landmarks.
  *   **Underdetermination:** Discriminable (survey data exists).
  *   **Accommodation:** "Mark sun" fits axis; "Follows slope" fits axis.
  *   **Verdict:** **Qualify**.
  *   **Panel Text:** "Neolithic chambered tomb whose axis lies within two degrees of winter solstice sunrise. Built to mark the return of the sun, or possibly following the landscape." (26 words)

  (c) **Figurines.**
  *   **Tag:** Belief (highest rung).
  *   **Rivals:** Toys; decoration; ancestor representation.
  *   **Disconfirmation:** None definitive (context is domestic floor).
  *   **Underdetermination:** Largely equivalent (no find separates goddess from toy).
  *   **Accommodation:** "Goddess" fits image; "Toy" fits image. Narrative fits any female form.
  *   **Verdict:** **Hedge**. (Committee will resent this downgrade given the fundraising appeal).
  *   **Panel Text:** "Fired-clay figurines from domestic floor contexts. May represent a mother goddess worshipped in the home, or simply toys." (21 words)

  **Note on Case (c):** The procedure obliges us to print the hedged text. The "Mother Goddess" claim fails the Disconfirmation gate (no find falsifies it) and the Accommodation Test (fits contradictory uses). Overriding this to **Assert** requires recording dissent and accepting high risk of press rebuke. The fundraising appeal must not dictate the verdict.
