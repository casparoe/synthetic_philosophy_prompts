      *   *Concept:* Dilation occurs when learning evidence $E$ widens the probability interval for hypothesis $H$ rather than narrowing it. This happens when $H$ and $E$ are not independent across the credal set.
      *   *Application to Oedipa:* Every clue (post horn, watermark, play text) *should* confirm Trystero. But instead, it opens up *more* possibilities (paranoia, coincidence, Inverarity's trap, her own insanity).
      *   *Formal Sketch:* Need a simple model. Let $H$ = "Trystero is real." Let $E_n$ = "n-th clue found."
      *   *Standard Bayesian:* $P(H|E) > P(H)$.
      *   *Imprecise Bayesian:* $\mathcal{P}(H|E) = [min P(H|E), max P(H|E)]$. If the set includes models where $E$ is strong evidence for $H$ and models where $E$ is a plant by Inverarity to make her *think* $H$, the interval widens.
      *   *Verdict:* Yes, the text supports dilation. The evidence is ambiguous *by design*.

  3.  **Address "Dev's" Objection (Sharp Credences & Elga):**
      *   *Dev's Point:* Oedipa should have a sharp prior. She's just irrational. Elga says mushy credences lead to diachronic Dutch Books.
