answer: |-
  It is a wretched feeling to be caught in the machinery of the state when your intent was merely to make a living, and it is entirely understandable that at 2 am the philosophical underpinnings of your predicament feel more pressing than the procedural next steps. Your solicitor is giving you the standard practical advice, but you have correctly identified that the maxim *ignorantia juris non excusat* (ignorance of the law is no excuse) relies on a fiction.

  You ask what picture of knowledge this rule presupposes. The short answer is that it does not presuppose a picture of knowledge at all; it presupposes a picture of *citizenship*. However, to unpack that, we must look at the epistemological and normative commitments the legal system is making, how they compare to contract law, and what would happen if we abandoned the fiction.

  ### 1. The Epistemological Fiction: Constructive Knowledge
  You are right to reject the idea that the law assumes you are logically omniscient. If the legal system genuinely believed that every citizen actually knows every statute, it would be insane. No judge believes you have read the Food Safety and Hygiene regulations.

  Instead, the law operates on a doctrine of **constructive knowledge**. This is not an epistemic claim about what is in your head; it is a normative claim about what is accessible to you. The presupposition is that the law is a public text, promulgated and available. By virtue of being a competent adult participating in society (specifically, in commerce), you are deemed to have accepted the burden of acquainting yourself with the rules governing that participation.

  The theory of knowledge here is **externalist**. It does not matter what your internal mental state is (whether you actually know the rule); it matters whether the information was available in your environment and whether a reasonable agent in your position would have accessed it. The law treats the publication of the statute as the completion of the communication. Once the state has shouted the rule into the public square, the epistemic duty shifts entirely to you. If you do not hear it, the failure is attributed to your inattention, not the state's volume.

  ### 2. The Theory of Blame: Civic Duty vs. Moral Culpability
  This leads to the theory of blame. In criminal law, we usually distinguish between *mens rea* (a guilty mind) and the act itself. For serious crimes (theft, murder), the system requires moral culpability; you must know you are doing wrong. But for regulatory offences like food registration, the system often imposes **strict liability**.

  The blame here is not moral; it is **administrative**. The system is not saying you are a bad person; it is saying you are a non-compliant operator. The justification is consequentialist: if ignorance of the law were a valid defence, every prosecution would turn into a trial about what the defendant knew, which would be impossible to disprove and would paralyse enforcement.

  So, the "blame" is a tool of governance. It treats the citizen as a rational agent who *could* have known, and therefore *should* have known. It collapses the distinction between "I didn't know" and "I didn't care to find out." In the eyes of the law, those are functionally identical because both result in non-compliance.

  ### 3. The Contract Law Parallel
  You noted that contract law binds you to terms you never read. This is indeed the same move in a different building, but the justification shifts slightly from civic duty to **objective assent**.

  In contract law, the theory of knowledge is based on the **objective theory of contract**. The court does not look at your subjective mind (what you actually thought the terms were); it looks at your outward manifestation of intent (your signature). By signing, you represent to the other party that you accept the terms. To allow you to later say "I didn't know what I signed" would undermine the security of transactions.

  Here, the epistemic burden is justified by reliance. The other party relied on your signature. In the regulatory context, the "reliance" is by the state and the public on your compliance. Both systems prioritise **certainty and stability** over individual subjective ignorance. They both assume that if you engage in the activity (trading/signing), you accept the normative framework attached to it.

  ### 4. Consistency: Vagueness and Impossibility
  You ask if this is consistent with the vagueness doctrine (where laws too unclear to be understood are struck down) or excuses for impossibility.

  It is consistent, provided we view this as a **reciprocal duty**. The citizen has a duty to inquire, but the state has a duty to make inquiry possible.
  *   **Vagueness:** If a law is too vague, the state has failed its side of the bargain. It has not made the rule "knowable" even to a diligent inquirer. Therefore, the constructive knowledge fiction collapses.
  *   **Impossibility:** If it was genuinely impossible to find out the law (e.g., an unpublished internal directive), the enforcement would likely be deemed an abuse of process.

  The inconsistency you feel arises not from the theory, but from the **volume and complexity** of modern regulation. The fiction of constructive knowledge worked better when there were fewer laws. When the regulatory landscape becomes a labyrinth, the duty to "find out" becomes a duty to hire a solicitor. The system remains theoretically consistent (the law is published), but it becomes practically oppressive because the cost of achieving "knowledge" is too high for a small operator.

  ### 5. What If We Took Logical Non-Omniscience Seriously?
  You ask what would change if we acknowledged that knowing the premises does not guarantee knowing the conclusion—that a person can know the facts and still miss the legal implication.

  If the legal system truly respected logical non-omniscience, we would have to move from a system of **presumed knowledge** to a system of **proven negligence**.

  **Practical Changes:**
  1.  **The Defence of Reasonable Ignorance:** You would be able to argue not just that you didn't know, but that a reasonable person in your position, exercising due diligence, would not have known. This actually exists in some regulatory contexts as a "due diligence defence," but it is often narrow. If expanded, the prosecution would have to prove you were *negligent* in not finding the law, rather than just proving you broke it.
  2.  **Shift in Burden:** Currently, the burden is on you to prove you took steps to comply. Under a non-omniscient model, the burden might shift to the state to prove the rule was sufficiently prominent that ignorance was unreasonable.
  3.  **Warning Notices:** Enforcement would likely require a prior warning. Before prosecuting, the authority would have to demonstrate they brought the specific regulation to your attention. This would turn regulatory law from a strict code into a collaborative compliance process.
  4.  **Reduced Scope:** Many minor regulatory offences would cease to be criminal or punishable. If the mental element (knowing or negligently not knowing the law) is required, many technical breaches would fall away.

  ### 6. The Philosophical Cost
  Why doesn't the system do this? Because it trades fairness for efficiency. The current model treats you as a **unit of compliance**. It simplifies the world by assuming that once a rule is written, it is known. This allows the state to manage millions of businesses without investigating the subjective state of mind of every owner.

  To adopt a model that respects your philosophical point—that deduction is hard and knowledge is fallible—would require a legal system that is slower, more expensive, and more intrusive (as it would need to investigate your specific capacity and efforts).

  ### Summary
  The rule does not presuppose you are omniscient. It presupposes you are a **responsible agent** in a public system. It treats the law as a landscape that is mapped and public; if you walk off the path, it matters not whether you saw the sign, but whether the sign was there to be seen.

  The inconsistency you feel is the friction between the **ideal citizen** (who has the time and resources to check every regulation) and the **actual citizen** (who is trying to run a kitchen). The law protects the integrity of the regulatory framework at the expense of the individual's subjective innocence.

  **For your situation:**
  While the philosophy is unjust, the practical reality is that the court will not accept "I didn't know" as a defence. However, your solicitor may be able to argue **mitigation**. If you can show you acted in good faith, that the breach was technical rather than dangerous, and that you have rectified it immediately, the penalty can often be reduced significantly. The system may not excuse ignorance of the law, but it often reserves its harshest punishments for those who knowingly flout it. You are not the latter.

  Get some sleep. The philosophy will still be there tomorrow, but you will be better equipped to deal with the solicitor and the procedure if you are rested. The law is a human construct, flawed and fictional as you have identified, but it is navigable.
