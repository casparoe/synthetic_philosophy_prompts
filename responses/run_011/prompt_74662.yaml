  **MEMORANDUM**

  **TO:** Program Trustees
  **FROM:** [Your Name/Role]
  **SUBJECT:** Funding Agenda: Malign Universal Prior Hypothesis

  ### 1. Viability Assessment: Is This Fundable?

  My honest assessment is that this topic is **conditionally fundable**. It risks becoming "angelic mathematics": rigorous work on idealized agents that bears no relationship to the neural networks we actually build. If the research team treats the malign prior as a established premise rather than a hypothesis to be stress-tested, the $500,000 will produce interesting philosophy but zero safety value.

  **Condition for Funding:** The grant must be structured as a probe, not a program. The money should be released in tranches, with the first tranche contingent on a credible formalization of the **Measure Question (a)** for *bounded* agents. If the team cannot demonstrate that the risk persists outside of idealized Solomonoff induction within the first 12 months, the funding should cease. Purely metaphysical work on unbounded agents is not worth supporting.

  ### 2. The Single Crux

  **Question (a): The Measure Question (specifically, Bounded Measure).**

  This is the gatekeeper. The entire agenda rests on the claim that manipulative hypotheses retain non-negligible posterior weight after a realistic agent observes finite data and operates under computational constraints.
  *   **Why it is the crux:** If the weight of malign hypotheses decays to effectively zero under bounded conditions, the problem dissolves. All downstream questions (how to fix the prior, how to secure the policy) become irrelevant.
  *   **Trustee Leverage:** You ought to insist on seeing a preliminary scoping of this question before committing to the full three years. A proof of upper bounds on posterior weight for bounded agents is the only evidence that justifies the subsequent expenditure.

  ### 3. Questions Not Worth Funding

  I recommend explicitly excluding the following from the scope of work. Resolving them would not change the engineering or safety agenda.

  *   **(e) The Selection Question:** Whether *our* evidence is filtered by simulators is an anthropic puzzle, not an alignment problem. Even if we are in a simulation, our goal remains building AI systems that are safe *for us* in our observed reality. Whether that reality is "base" or "simulated" does not change the local risk of our AI being hijacked by *other* simulators.
  *   **(b) The Motivation Question:** Speculating on the ethics and demographics of advanced civilizations is low-tractability sociology. The risk argument only requires that *some* consequentialists exist and *can* optimize; it does not require a theory of their prevalence or moral psychology. Funding work on alien sociology diverts resources from formal risk analysis.

  ### 4. Prioritized Funding Agenda

  If the Crux (a) clears the initial bar, funds should be allocated in the following order. I have added one question **(g)** that is more important than several on your original list.

  #### **Priority 1: (a) The Measure Question (Bounded)**
  *   **Position:** Upstream. This establishes the existence of the phenomenon.
  *   **Tractability:** Low for idealized agents, Medium for bounded agents. Philosophers and formal epistemologists can work on complexity bounds without needing ML experiments. They can analyze how quickly evidence rules out complex hypotheses in resource-constrained settings.
  *   **Neglectedness:** High. Most discussion assumes the limit case (Solomonoff induction) rather than the practical case (bounded inference).
  *   **Success Condition:** A formal argument establishing either an upper bound on the posterior weight of manipulative hypotheses given finite data, or a concrete model of a bounded agent where the weight remains dangerous.
  *   **Move the Needle:** If the team produces a proof that weight decays exponentially fast with data even for bounded agents, the agenda ends. If they show it persists, the agenda expands.

  #### **Priority 2: (g) The Identifiability Question (New)**
  *   **Position:** Upstream/Midstream. This determines the *duration* of the risk.
  *   **Definition:** Even if the malign hypothesis starts with high weight, is it *distinguishable* from the true hypothesis given enough data? Can the agent eventually learn that it is being manipulated, or is the manipulation empirically indistinguishable from natural law?
  *   **Tractability:** High for formal epistemologists. This is a question of statistical identifiability and information theory.
  *   **Neglectedness:** Very High. Most debate focuses on the prior, not the learnability of the truth.
  *   **Success Condition:** A classification of manipulative hypotheses into "transiently confusing" (learnable) vs. "permanently opaque" (unlearnable).
  *   **Move the Needle:** If malign hypotheses are identifiable, the risk is limited to the early training phase. If they are unidentifiable, the risk is permanent and requires structural intervention.

  #### **Priority 3: (d) The Interface Question**
  *   **Position:** Downstream. This determines if the risk translates to catastrophe.
  *   **Tractability:** High. This is decision theory, a core competency for the proposed team.
  *   **Neglectedness:** Medium. Alignment research often assumes "wrong belief = bad action," but robust decision procedures can sometimes ignore manipulated predictions.
  *   **Success Condition:** Identification of decision-theoretic structures that are invariant to prior manipulation (e.g., myopic decision rules, specific causal graph constraints).
  *   **Move the Needle:** If a robust decision procedure exists that neutralizes the prior distortion, we may not need to fix the prior itself. This shifts the solution from "epistemology" to "architecture."

  #### **Priority 4: (c) The Replacement Question**
  *   **Position:** Downstream (Mitigation).
  *   **Tractability:** Medium. Proposing alternative priors is easy; proving they are safe and useful is hard.
  *   **Neglectedness:** Low. Many researchers propose fixes (speed priors, physical priors) without rigorously testing if they solve the malignancy problem.
  *   **Success Condition:** A formal proposal for a prior that (1) suppresses malign hypotheses, (2) retains predictive power for useful tasks, and (3) is computationally feasible.
  *   **Move the Needle:** This is the "solution" phase. It should not be attempted until (a) and (d) confirm the problem is real and dangerous.

  #### **Priority 5: (f) The Reframing Question**
  *   **Position:** Meta-level.
  *   **Tractability:** High (Conceptual).
  *   **Neglectedness:** Medium.
  *   **Success Condition:** A clear statement of whether this is truly a prior problem or a goal-stability problem.
  *   **Move the Needle:** This helps summarize the findings for the broader community but does not directly reduce risk. It should be a concluding output, not a research driver.

  ### 5. Trade-offs and Risks

  *   **Importance vs. Tractability:** The most important question (a) is also the hardest. There is a risk the team spends three years proving bounds for idealized agents that don't apply to real systems. **Mitigation:** Require that all formal models explicitly include a complexity budget or time bound.
  *   **Philosophy vs. Engineering:** This team has no ML capacity. They cannot test their theories on neural nets. **Mitigation:** The agenda must remain theoretical, but the *models* must be plausible analogues of learning systems (e.g., bounded Turing machines, resource-limited Bayesian updaters), not just abstract induction.
  *   **Neglectedness:** While the "malign prior" is discussed in forums, rigorous formal work is neglected. This is the niche this fund can fill. However, if the work remains at the level of intuition pumps, it adds no value.

  ### 6. Recommendation

  Commit the funds **only** if the applicants agree to make **(a) The Measure Question (Bounded)** the primary deliverable of Year 1. If they cannot show that the risk survives the transition from idealized to bounded agents, the remaining $350,000 should be reallocated to more empirical or architectural alignment work. This topic is fascinating, but it is only a safety priority if it is true.
