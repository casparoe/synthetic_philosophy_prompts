      *(Self-Correction during drafting)*: Make sure to distinguish between "Right about math" and "Right about policy." Move 1 is right about the math of risk, but maybe wrong that a veto is the only fix. Move 2 is right about the math of bottlenecks. Move 3 is right about asymmetry. Move 6 is the strongest because it offers a third option.
