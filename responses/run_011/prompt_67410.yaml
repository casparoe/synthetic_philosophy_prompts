          *   *Stability Check:* Who decides what fits that category? If the group decides, we are back to square one (who guards the guardians?). If individuals decide, we are back to the unilateralist's curse (someone misclassifies a dangerous project as safe).
          *   *Collapse:* It risks collapsing into N's original position (if classification is strict) or R's position (if classification is loose). It creates a "boundary problem." It's unstable without a meta-norm for classification.

      *   **Who is more right overall?**
