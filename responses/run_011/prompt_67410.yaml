          *   They assume the "group" is the relevant boundary for safety (what about other institutes?).
          *   *Key Premise:* **The Epistemic Boundary Problem.** Both assume the working group is the appropriate unit of decision-making for global risks. N assumes the group can reliably identify "global/irreversible" cases. R assumes the group's veto is the main bottleneck.
          *   *Better Premise:* **The Classification Problem.** Who decides which projects fall under the "global/irreversible" restriction? If individuals decide, N's curse returns. If the group decides, R's veto problem applies to the classification itself.
          *   *Alternative:* **Coordination vs. Governance.** They are debating a coordination norm as if it were a governance structure.
