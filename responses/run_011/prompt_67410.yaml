          5.  Unstated premise.
      *   *Tone:* Analytical, precise, philosophical but grounded.
      *   *Ratings:* Use a scale (e.g., Mostly Right, Partially Flawed, etc.) or the requested "clearly mistaken to clearly right." I will use the requested phrasing.

      *   *Refining Move 1:* It's the standard argument. Clearly Right *as a description of the risk*.
      *   *Refining Move 2:* Mathematically correct, but ignores cost. Mostly Right.
      *   *Refining Move 3:* Crucial distinction. Clearly Right in x-risk contexts.
      *   *Refining Move 4:* Valid counter, but usually $Cost_{existential} \gg Cost_{delay}$. Mostly Right.
      *   *Refining Move 5:* Pragmatic but unstable. Partially Right/Flawed.
      *   *Refining Move 6:* Strongest institutional critique. Mostly Right.

      *   *Step 2 vs 3:* Step 3 defeats Step 2's *conclusion* (that the norm is net neutral) but not its *math*. Expected value breaks the symmetry.
      *   *Step 5 Stability:* It collapses because classifying the risk requires the very judgment the norm seeks to constrain.
      *   *Overall:* R wins on policy design, N wins on risk identification. Since the question is about adopting the *norm*, R is more right.
      *   *Unstated Premise:* The "Boundary Problem" (Who classifies the risk?) or "The assumption that the group is the relevant coordination unit." Let's go with **The Classification Problem** (Who decides when the norm applies?).

  5.  **Final Polish:** Check against the prompt requirements.
      *   Rate each of six.
