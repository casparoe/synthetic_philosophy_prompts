          *   R is right that consensus norms create bottlenecks and veto risks (Multilateralist's Curse).
          *   *Synthesis:* N identifies the *problem* better. R identifies the *solution's flaw* better.
          *   *Overall:* R is slightly more right on *institutional design* (Move 6), but N is more right on the *risk landscape* (Move 1 & 3). However, since the debate is about adopting a specific *norm* (group veto), R's critique of that specific mechanism is more decisive for the decision at hand. A veto norm is often unworkable.
          *   *Decision:* R is more right *about the proposed norm*, but N is more right *about the underlying risk*. I need to weigh the prompt's context: "considering a norm." R wins on the policy question.

      *   **Unstated Premise:**
          *   What are they assuming?
