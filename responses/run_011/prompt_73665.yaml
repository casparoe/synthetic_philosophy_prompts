          *   *Leveling Down:* Make sure to distinguish between the *weighting* (which looks egalitarian) and the *aggregation* (which is utilitarian/prioritarian). The LDO targets the *goal* of equality. NICE's goal is max weighted health.

  7.  **Finalizing the Verdicts:**

