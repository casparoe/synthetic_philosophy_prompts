  ### The Weights
  Total points available: 10.
  *   **Constitutive Entanglement (3 pts):** This is the core of repugnance. If selling the thing destroys the seller's moral standing or agency, the market is suspect regardless of consent.
  *   **Desperation-Tracking (3 pts):** Markets fueled by background injustice aren't free; they are coercion by another name. This needs heavy weight to distinguish choice from survival.
  *   **Third-Party Drift (2 pts):** Classic negative externalities. If the deal hurts non-consenting bystanders, the state has a clear interest in regulation.
  *   **Exit-Cost Asymmetry (1 pt):** Irreversibility matters, but money usually solves exit problems eventually. It's a practical hurdle, not a moral absolute.
  *   **Misuse-Invisibility (1 pt):** This is a regulatory failure, not an inherent moral flaw. Transparency fixes most of this.

  ### The Ranking
  *Scores are calculated as (Raw 0–2 Score / 2) × Axis Weight.*

  **1. Selling your vote**
  *   **Score:** 9.0 / 10
  *   **Tier:** S (Genuinely shouldn't be tradable)
  *   **Dominant Axis:** **Third-party drift.** You aren't just selling your preference; you are selling the weight of someone else's voice in a system designed for equality.

  **2. Selling a kidney to a broker**
  *   **Score:** 8.5 / 10
  *   **Tier:** S (Genuinely shouldn't be tradable)
  *   **Dominant Axis:** **Desperation-tracking.** The willingness to sell is almost exclusively a symptom of poverty, making the "consent" functionally coercive.

  **3. A rich person buying to the top of a transplant list**
  *   **Score:** 8.0 / 10
  *   **Tier:** S (Genuinely shouldn't be tradable)
  *   **Dominant Axis:** **Third-party drift.** This is a zero-sum game; your purchase directly causes a specific stranger's death who was medically prioritized over you.

  **4. Selling a slice of your future earnings (Human IPO)**
  *   **Score:** 6.5 / 10
  *   **Tier:** A (Tradable only under heavy constraint)
  *   **Dominant Axis:** **Constitutive entanglement.** It commodifies the self not as a laborer, but as an asset class, shifting life choices from "meaningful" to "yield-generating."

  **5. Municipality selling naming rights (Police/School)**
  *   **Score:** 6.0 / 10
  *   **Tier:** A (Tradable only under heavy constraint)
  *   **Dominant Axis:** **Third-party drift.** It erodes public trust in civic institutions by signaling that state authority is subordinate to private capital.

  **6. Hiring an agency to deliver an apology**
  *   **Score:** 3.0 / 10
  *   **Tier:** C (Fine)
  *   **Dominant Axis:** **Constitutive entanglement.** Moral accountability requires personal agency; outsourcing remorse hollows out the concept of apology, but harms are contained.

  **7. Paying a guy to stand in line for you**
  *   **Score:** 0.5 / 10
  *   **Tier:** C (Fine)
  *   **Dominant Axis:** **Exit-cost asymmetry.** There is none; it is a simple labor transaction for time, reversible and low-stakes.

  ### The Outlier
  **The item the rubric gets wrong:** Hiring an agency to deliver an apology.
  **The axis lying to you:** **Constitutive entanglement.**
  **Why:** The rubric scores this low (3.0) because no physical body part is sold and the recipient knows it's fake. But intuitively, this market feels sleazier than line-standing because it commodifies *moral repair*. The rubric treats "moral agency" as a binary (you have it or you don't), but it fails to capture the degradation of *practicing* morality as a service. It ranks this as "Fine," but it should likely be "Disclosure Required" at minimum.

  ### The Verdict
  **Does it bite the hand that feeds it?**
  No. The rubric ranks these markets in almost the exact order your pre-existing moral intuition already did. It does not flag line-standing as repugnant, nor does it defend kidney brokers as liberating.

  **Is Dana right?**
  Dana is right about the **source**, but wrong about the **utility**.
  The weights I assigned weren't discovered; they were chosen to match the conclusion that vote-selling is worse than line-standing. The rubric is a formalization of your mood, not an independent arbiter. However, Dana is wrong to dismiss it. Now that you have the axes, you can't just say "kidneys are gross." You have to argue about *desperation* or *entanglement*. The rubric doesn't generate new moral truths, but it forces you to be consistent about the old ones. You have an argument now, but the premises are still just your moods with footnotes.
