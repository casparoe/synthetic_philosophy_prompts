      *Refining Accuracy vs Honesty:* He isn't lying (honesty) but his visual system is lying to him (accuracy). Heterophenomenology cares about the honesty of the report regarding the seeming.

      *Refining Neuro vs Hetero:* Neurophenomenology (Varela) tries to bridge the gap by training subjects. Heterophenomenology (Dennett) keeps the gap and treats reports as text. Neither is a clinical diagnostic tool.

      *Refining Alternatives:* Standard perimetry, functional adaptation, neuro-ophthalmology consult.

      *Refining Limits:* Can't know qualia, can't distinguish confabulation from experience definitively, can't solve the hard problem.

