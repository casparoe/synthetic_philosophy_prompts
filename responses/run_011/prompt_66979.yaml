      *   *Comparativist Flag:* They won't talk about "Establishment Clause"; they'll talk about *Staatskirchenrecht*, *Körperschaftsstatus*, and the specific administrative procedure of *Austritt*.

  5.  **Review and Refine:**
      *   *Tone:* Academic, respectful, sharp.
