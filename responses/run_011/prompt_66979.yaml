  *(Refining the "Hope Nobody Asks")*: The hardest question is: "If the exit is so cheap, why do Germans complain about it so much?" Or, "Does this model require a homogeneous culture to function?" I'll go with the cultural homogeneity point—it undermines the "plural state" claim.

