answer: |-
  ### Preliminary Note on Factual Characterisations

  Your characterisations of the systems are sufficiently accurate for the purpose of philosophical reconstruction. There are minor technical nuances that do not alter the underlying logic but are worth noting to ensure precision.

  In Germany, the tuition fees for non-EU students are currently levied primarily in Baden-Württemberg; other *Länder* have abolished them or never reintroduced them. This reinforces your point that it is an exception rather than the rule, but it means the 'price' on exit is not uniform across the federation. In England, while mortgage lenders often treat the loan as a committed expenditure rather than a capital debt, it does appear on credit files and affects debt-to-income ratios differently than a traditional unsecured loan, though your point stands that it lacks the logic of default. In the US, while federal loans are non-dischargeable, private student loans operate under different rules, though the federal system dominates the moral landscape.

  None of these nuances require a fundamental alteration of the analysis below. They serve only to sharpen the distinction between the rule and the exception.

  ---

  ### 1. The Implicit Theory of Each Design

  To reconstruct the view of higher education inherent in each system, we must ask what the financial instrument treats the university as, and what it treats the student as.

  **England: The Human Capital Contract**
  The English post-2012 system presupposes that higher education is primarily an **investment in private human capital**. The state facilitates the purchase of this asset but does not gift it. The design assumes a 'graduate premium' exists and belongs, initially, to the individual, but is subject to a clawback mechanism.
  *   **View of Obligation:** The obligation is grounded in **benefit received**. Because you earn more *because* of the degree, you owe a portion of that specific surplus back to the provider. However, the collection mechanism (payroll deduction, no default, write-off) mimics a **hypothecated tax**. The state claims a lien on your future earning capacity, not because it owns you, but because it fronted the capital required to unlock that capacity. It is a quasi-contractual reciprocity: the state invests in you, you repay from the proceeds.

  **Germany: The Public Good of *Bildung***
  The German system presupposes that higher education is a **public good** and a prerequisite for full social membership. It is not a commodity to be purchased but a facility to be accessed. The absence of tuition fees implies that the benefits of an educated populace diffuse so widely (through culture, democracy, innovation) that earmarking costs to the individual is inefficient and unjust.
  *   **View of Obligation:** The obligation is grounded in **membership and solidarity**. You do not pay for your degree because your degree is not yours alone; it is a contribution to the *Gemeinwesen* (commonweal). The state recoups costs through general taxation on a lifetime basis, not linked to the specific degree. The claim on your earnings is based on your capacity to pay as a citizen, not on the specific causal link between the lecture hall and your salary.

  **Denmark: Education as Labour**
  The Danish SU (grant) system presupposes that studying is itself **socially productive activity**. By paying the student, the state treats the period of education as a form of public service or recognised labour. It rejects the idea that the student is a consumer or even an investor; they are a worker in the sector of future-proofing the economy.
  *   **View of Obligation:** The obligation is grounded in **reciprocity of contribution**. The state pays you to study now; you pay the state back through high marginal tax rates later. It is a delayed wage settlement. The claim on future earnings is strong but generalised; it is the standard social contract, merely shifted in time.

  **USA: The Market Commodity**
  The American system presupposes that higher education is a **private consumption good** or a strictly private investment asset. It is purchased in a market. The state's role (via federal loans) is merely to provide liquidity for a transaction that is fundamentally between the buyer (student) and the seller (university).
  *   **View of Obligation:** The obligation is grounded in **contractual sanctity and property rights**. You borrowed money to buy an asset; you owe the money. The fact that the asset (your mind) cannot be repossessed is a technical hurdle, not a philosophical one. The claim on future earnings is absolute because the debt is a prior lien on your economic life, secured by your legal personhood.

  ---

  ### 2. Underdetermination: Presupposition vs. Compatibility

  You are correct to suspect underdetermination. Many features are compatible with rival theories, and we must distinguish between what a design *forces* and what it merely *permits*.

  **The English Income-Contingent Loan (ICR)**
  *   **Compatible Theories:** This design is theoretically amphibious. It fits the **Human Capital** view (repaying the investment). It also fits a **Graduate Tax** view (redistribution from high earners to the exchequer). It even fits an **Insurance** model (the write-off is a premium paid for the risk of low earnings).
  *   **Forced Commitment:** The feature that forces a commitment is the **individual account**. A pure tax does not track individual liability over a lifetime in a personal ledger that can be 'paid off' (even if rarely achieved). The existence of a balance, however notional, commits the system to the idea of an *individual debt*, distinguishing it from a pure tax. However, the **RAB charge** (the Treasury writing off the expected loss upfront) forces the admission that it is a subsidy. You cannot have a commercial loan where the loss is budgeted as public spending. This forces the view that the instrument is a **hybrid**: a debt in form, a tax in function, and a subsidy in accounting.

  **The German Zero-Fee Model**
  *   **Compatible Theories:** This fits the **Public Good** view. It also fits a **Meritocratic** view (access should not be barred by wealth). It could even fit a **Paternalistic** view (the state knows better than to let students encumber themselves).
  *   **Forced Commitment:** The feature that forces a commitment is the **funding source**. Because universities are funded via *Länder* budgets (general taxation), the system commits to the view that the cost belongs to the collective. It rules out the idea that the beneficiary should bear the marginal cost. However, the *Numerus Clausus* (NC) introduces a tension: if it is a right, why is it rationed? The NC forces a commitment to **scarcity management** that sits uncomfortably with the 'universal right' narrative. It suggests education is a **positional good** managed by the state, not a pure public good like air.

  **The Danish Grant**
  *   **Compatible Theories:** Fits **Education as Labour**. Also fits **Radical Egalitarianism** (removing all financial barriers).
  *   **Forced Commitment:** The direct payment forces the view that the student's time has **opportunity cost value** that the state must indemnify. A fee-free system (Germany) removes cost; a grant system (Denmark) replaces lost income. This commits the state to the view that studying is incompatible with other labour and that this incompatibility is a public responsibility.

  **The US Non-Dischargeable Debt**
  *   **Compatible Theories:** Fits **Market Commodity**. Also fits **Creditor Protection**.
  *   **Forced Commitment:** The bankruptcy exception forces the view that **human capital is distinct from other assets**. In standard commerce, if an investment fails, you can liquidate. Here, you cannot liquidate the student. Therefore, the obligation must attach to the *person*, not the *asset*. This commits the system to a theory of **perpetual obligation** based on the acquisition of capacity, regardless of the return on investment.

  ---

  ### 3. What Each Design Rules Out

  To make each system coherent, certain propositions must be false.

  **England:** For the English system to be coherent, it must be false that **education is a pure public good**. If the benefits diffused entirely to society (e.g., a more civilised populace), charging the individual would be unjust. It also requires that **the graduate premium is real and measurable**. If degrees did not correlate with higher earnings, the repayment mechanism would function as a random penalty on the employed rather than a recapture of value. It rules out the idea that the state fully owns the graduate premium; if it did, it would tax it all, not just a portion via a loan book.

  **Germany:** For the German arrangement to be coherent, it must be false that **education is a private commodity**. If it were a commodity, giving it away for free would be a market distortion. It also requires that **general taxation is a sufficient proxy for benefit**. It assumes that graduates pay enough in extra tax over a lifetime to cover the cost, without needing to link the two explicitly. Crucially, regarding the non-EU fees: for the domestic free system to hold, it must be false that **non-members contribute equally to the social product**. If a non-EU student contributes the same to the German economy and culture, charging them fees implies their membership is the only relevant variable, not their economic contribution.

  **Denmark:** For the Danish stipend to be anything other than an expensive tax rebate, it must be false that **students can or should work alongside study**. If students could easily support themselves, the grant would be a pure transfer with no functional necessity. It presupposes that **study is a full-time vocation** that precludes market labour.

  **USA:** For the American asymmetry to be defensible, it must be false that **risk should be shared between lender and borrower**. In any other investment, if the asset yields nothing, the lender shares the loss (via default). Here, the borrower bears 100% of the performance risk. This requires the view that **the borrower is the sole judge of the asset's value** at the point of purchase, and therefore bears sole responsibility for the outcome.

  ---

  ### 4. Internal Tensions: The English Hybrid and the German Exception

  **The English Incoherence**
  You ask if the English system is incoherent or a stable hybrid. It is a **stable hybrid expressing a conflicted political ontology**. The state wishes to claim the credit for creating opportunity (hence the loan/subsidy) without accepting the cost of a public service (hence the debt label).
  *   **The Tension:** It treats the graduate premium as partially privately owned (you keep most of it) and partially state-owned (the repayment). But by booking the loss as public spending (RAB charge), it admits the state owns the risk.
  *   **Resolution:** The coherence lies in **political convenience**, not philosophy. It allows the government to record spending as 'investment' rather than 'current expenditure' while maintaining the rhetoric of 'personal responsibility'. It is a fiction that allows two contradictory views (education is a private responsibility vs. education is a state investment) to coexist without resolution. It is not a genuine mixed view of ownership; it is a deferred accounting of who pays.

  **The German Non-EU Fee**
  This is the sharper philosophical tension. Why free for citizens, priced for others?
  *   **Membership vs. Cost Recovery:** If the justification for free education is **recoupment through lifetime taxation**, then the non-EU fee is irrational. A non-EU student who stays and works in Germany will pay the same taxes as a citizen. Charging them upfront is double taxation.
  *   **The Commitment:** Therefore, the practice commits the state to the **Membership/Citizenship** justification. The free access is a benefit of belonging to the political community, not a function of economic ROI. The fee on non-EU students is a **border control mechanism** or a **cost recovery for non-members** who may not contribute to the tax base long-term.
  *   **Can it commit to both?** No. It cannot be both a prepayment of taxes (which non-EU workers also pay) and a fee for non-membership. The existence of the fee proves that the domestic system is not based on ROI, but on **solidarity boundaries**. It treats education as a welfare benefit reserved for the polity, not a universal economic utility.

  ---

  ### 5. The American Asymmetry: Collateral or Status?

  Your conjecture is strong: non-dischargeability presupposes human capital cannot be repossessed.
  *   **The Strongest Defensible Version:** The defence is not merely creditor power, but a theory of **moral hazard and information asymmetry**. If student debt were dischargeable, students might borrow excessively for low-value degrees, knowing they can walk away. Because the 'asset' (the mind) remains with the borrower even after bankruptcy, the borrower retains the benefit of the bargain even if they shed the cost. To prevent this 'strategic default', the obligation must attach to the person. It is a **status obligation**: by becoming a graduate, you enter a class of persons with heightened earning *potential*, and the debt is a levy on that potential, regardless of actualisation.
  *   **The Verdict:** This defence fails against the reality of the market. In a true market, lenders assess the viability of the investment (the degree/university). In the US system, the state guarantees the loan regardless of the asset's quality. This removes the lender's incentive to assess risk. Therefore, the non-dischargeability is not a balanced contract; it is a **state-subsidised transfer of risk from lenders to borrowers**. It is creditor power dressed in the language of obligation. The asymmetry exists because the political economy requires capital to flow to universities (who need the revenue) without universities bearing the risk of student failure. The student becomes the shock absorber for the entire higher education market.

  ---

  ### 6. Evaluating Your Framing: "Who Owns the Graduate Premium?"

  Your schema is powerful but incomplete.
  *   **Where it holds up:** It perfectly captures England (shared ownership), USA (private ownership), and Denmark (state ownership of the process, individual ownership of the outcome via tax).
  *   **Where it falters:** It struggles with Germany. The German system does not merely assume the premium is part of the social product; it assumes **education is constitutive of the citizen**. It is not about the *premium* (the extra money); it is about the *formation* (*Bildung*). The German state does not want a share of your graduate premium; it wants you to be a certain kind of subject. The financing is secondary to the ontological goal.
  *   **Missing Feature:** Your schema focuses on the *economic* output of education. It misses the **civic** output. The Danish and German systems are as much about social cohesion and democratic participation as they are about GDP. The English and American systems are almost exclusively about GDP and individual ROI.
  *   **Refinement:** A better framing might be: **"Is the student a citizen-in-formation or a consumer-in-training?"**
      *   England: Consumer with state credit.
      *   Germany: Citizen-in-formation (domestic), Consumer (non-EU).
      *   Denmark: Worker-in-training.
      *   USA: Consumer-in-training with perpetual liability.

  ---

  ### 7. The Signalling Objection

  If the graduate premium is largely positional (screening) rather than productive (skills), the fairness arguments shift dramatically.

  *   **England:** If degrees are merely signals, charging students for them is taxing them for participating in a social arms race. The 'benefit principle' collapses because the individual didn't create the value; the scarcity did. The English design becomes **unfair to non-graduates**, who subsidise the signalling game without access to the signal.
      *   *Required Change:* If signalling is dominant, the state should fund education entirely as a public utility (like roads) to prevent the cost from barring access, but perhaps tax the *credential* usage in hiring, not the acquisition.
  *   **Germany:** This system fares best under the signalling objection. If education is a public sorting mechanism, the state should run the sorter. Free access ensures the sorting is based on merit (grades), not wealth.
      *   *Required Change:* None structurally, but the *Numerus Clausus* becomes more ethically fraught. If it's just sorting, why restrict supply? The state would need to expand capacity until the signal dilutes, or replace degrees with other sorting mechanisms.
  *   **USA:** The system becomes predatory. Charging market rates for a signal means pricing people out of social mobility.
      *   *Required Change:* If it is signalling, the debt should be dischargeable. You cannot owe a lifetime of debt for a signal that the market devalued. The system would need to move to general taxation funding to socialise the cost of the sorting mechanism.

  **Verdict:** The fairness-to-non-graduates argument in England depends on the **productivity story**. If graduates are more productive, they can pay without harming growth. If they are just screened, the repayment is a drag on the economy that benefits only the credential-holders.

  ---

  ### 8. Institutional Changes: Swapping the Theories

  What happens if we force the systems to align with their rival theories?

  **England: Acknowledge the Tax**
  *   *Change:* Abolish the loan book. Replace with a 'Graduate Contribution' collected via PAYE with no personal balance, no write-off date, but a rate linked to earnings.
  *   *Impact:* This is not cosmetic. It changes **intergenerational accounting**. Currently, the debt hangs over the individual psychologically and affects credit behaviour. As a tax, it becomes a transparent cost of the welfare state. It alters who pays: currently, low earners subsidise high earners (via write-offs). As a tax, it could be structured progressively. It removes the fiction of 'repayment' and admits the cost is social.

  **Germany: Price the Club Good**
  *   *Change:* Introduce tuition fees for everyone, remove *Numerus Clausus*, let price ration demand.
  *   *Impact:* This would fundamentally alter **social stratification**. Currently, the NC rations by ability (grades). Price rations by wealth. This would shift the student body demographic. It would change the nature of the university from a public institution to a service provider. It would likely reduce enrolment in humanities and increase it in vocational subjects, altering the cultural output of the nation.

  **USA: Dischargeable Debt**
  *   *Change:* Make student loans dischargeable in bankruptcy. Fund the shortfall via general taxation.
  *   *Impact:* This shifts risk from **borrower to lender/taxpayer**. Universities would face market discipline; if their degrees don't yield jobs, lenders would stop lending or charge higher rates. Tuition prices would likely collapse or stabilise. It would alter who pays: currently, the failed student pays forever. Under this model, the taxpayer pays for the failed investment. This aligns the incentive: the state would regulate university quality to protect the tax base.

  ---

  ### 9. Philosophical Idleness: Where Theory Ends

  You asked for candour regarding where there is no theory. There is a great deal of **fiscal path dependence** masquerading as philosophy.

  *   **England:** The specific **threshold** (£25,000/£27,000 etc.) and the **write-off period** (30/40 years) are not philosophical constants. They are dials turned to manage the RAB charge to meet Treasury targets. There is no theory of justice that dictates a 30-year write-off rather than 25. This is administrative calibration, not moral reasoning. The decision to sell the loan book to private investors (which has happened) contradicts the 'state investment' theory entirely; it turns the graduate into a revenue stream for hedge funds. That is not philosophy; it is asset management.
  *   **Germany:** The distinction between *Universität* and *Fachhochschule* (University of Applied Sciences) often maps onto funding differences that are historical artefacts of the 19th century, not current economic realities. The semester contribution amounts are often set by student unions based on what the local transport authority charges, not on a theory of cost-sharing.
  *   **USA:** The **bankruptcy rule** (Section 523(a)(8)) was tightened in the 1970s and 90s largely due to lobbying by lenders concerned about abuse, not due to a deep reconsideration of human capital theory. The distinction between federal and private loans is a regulatory accident, not a moral distinction.
  *   **Denmark:** The **SU rate** is adjusted by political negotiation annually. There is no formula that determines the 'value' of a student's time. It is a budgetary residual.

  **Conclusion on Idleness:**
  Much of what you are struggling to reconcile is not a clash of theories, but a clash of **historical layers**. The English system is a New Labour design (access) overlaid with a Coalition austerity measure (cost recovery). The German system is a post-war reconstruction (democratisation) overlaid with EU mobility rules (non-discrimination). The American system is a mid-century expansion (GI Bill legacy) overlaid with neoliberal financialisation.

  You cannot get them to sit consistently together in your head because they are not consistent systems. They are **palimpsests**. The English instrument is not a stable hybrid; it is a draft that was never rewritten. The German exception is not a commitment to membership theory; it is a compliance with EU law that found a loophole. The American asymmetry is not a theory of responsibility; it is a victory of the finance sector in Congress.

  Your dislocation is not a failure of your philosophical reconstruction. It is an accurate perception of the incoherence of the modern state's approach to human capital. You are trying to find a unified field theory where there are only local ordinances.
