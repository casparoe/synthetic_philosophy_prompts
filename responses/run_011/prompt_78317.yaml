  *Payoff:* "The Golden Coin" (a painted washer or just a drawn certificate). Let's go with "First Pick of Next Month's Topic."

  *Engineer Specifics:* Assign him a partner who is diligent but not assertive, so he leads the strategy. Ensure the isolation is strict for him.

  *The "Quantum" explanation:* I need to be very clear that *we* are the classical particles. The universe is the weird one. I will provide a handout with real experimental data.

  10. **Final Review against constraints:**
      *   No physics jargon initially? Yes.
      *   Paper/coins/dice? Yes.
      *   Separation? Yes.
      *   Payoff (no money)? Yes.
