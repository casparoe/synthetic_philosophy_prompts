answer: |-
  1. **The Horizon and the Logarithm**
  "Your thesis rests on the claim that finite measurement precision prevents fixing the future. But in chaotic systems, the precision required to predict out to time $T$ grows only logarithmically with $T$. This implies that for any *finite* future window, a finite precision suffices. So, when you say the future isn't fixed by what's knowable 'in principle,' are you claiming that infinite precision is required for *any* prediction, or merely that the horizon is finite? If it's the latter, doesn't your claim collapse into the trivial statement that prediction error grows with time, which no determinist disputes?"

  *   **Follow-up:** If she insists that 'in principle' knowledge still fails because infinite time requires infinite precision: "But Laplace's Demon doesn't need to predict to infinite time to prove the future is fixed; it only needs the state to entail *a* unique future. If the entailment holds for every finite interval, even if the horizon recedes, in what precise sense is the future 'open' rather than just 'computationally expensive to access'?"

  2. **The Shadowing Lemma**
  "You argue that numerical trajectories diverge from reality, rendering simulations metaphysically idle. However, the Shadowing Lemma guarantees that for hyperbolic systems, a computed pseudo-orbit stays uniformly close to *some* true orbit of the system. Doesn't this rescue the determinism of the structure, even if we can't identify *which* trajectory is ours? Are you arguing that the physics is indeterminate, or simply that we lack the indexical knowledge to locate ourselves on the manifold?"

  *   **Follow-up:** If she replies that shadowing finds 'an orbit but not the orbit': "Then your objection is purely about identification, not determination. If the set of all possible futures is still a set of deterministic trajectories, why describe this as a failure of determinism rather than a failure of state estimation? Are you dressing an epistemic limitation in metaphysical clothing?"

  3. **The Climate Counter-Example**
  "Consider climate modeling. Trajectory-level weather prediction fails after weeks due to chaos, yet we successfully project statistical climate properties decades out. If the 'fanning out' of states destroyed the fixed nature of the future, why do invariant measures and attractor geometries remain stable and predictive? Does your view imply the climate statistics are also indeterminate, or do you concede that the *structure* is determined even if the *path* is unknowable?"

  *   **Follow-up:** If she concedes the structure is determined: "If the durable predictive content lives in the invariant measures, then the 'fanning out' only defeats trajectory prediction. Why should we accept your stronger conclusion that the *world* is indeterminate, rather than the weaker conclusion that *trajectories* are epistemically inaccessible? Isn't the latter sufficient to explain the data without the former?"

  4. **The Source of Amplification**
  "Exponential divergence is a property of the equations; measurement imprecision is a property of the observer. In your derivation of an 'open future,' which of these is doing the metaphysical work? If the equations are deterministic, the amplification is just a mapping function. Are you smuggling our ignorance into the structure of the world by treating the Lyapunov exponent as an ontological barrier rather than a dynamical rate?"

  *   **Follow-up:** If she argues that physical measurement limits are constitutive of the state: "Then you are arguing for a finite-information ontology. But if the laws are deterministic 'all the way down' as you stipulate, they presumably operate on real numbers. How do you reconcile a continuum dynamics with a discrete information limit without changing the laws themselves?"

  5. **The Ontology of the State**
  "Following on that: If a Laplace's Demon could read the actual state without imprecision, would the future be fixed on your view? If yes, then the 'openness' is entirely relative to human limitations. If no, then you must be committed to a non-pointlike ontology where the state itself is 'fuzzy.' Are you prepared to defend a point-free geometry of physical space, and do you have a dynamical law that operates on such gunky states?"

  *   **Follow-up:** If she retreats to "The Demon is impossible": "Impossibility for whom? If the impossibility is physical (e.g., Bekenstein bounds), then we are discussing quantum gravity, not classical chaos. If the impossibility is logical, you need to show why 'state' implies 'measurement.' Can you state your thesis without referencing an observer?"

  6. **Observational Equivalence and Isomorphism**
  "We know from Ornstein isomorphism theorems that some deterministic systems are mathematically indistinguishable from stochastic processes. You use this indistinguishability to argue the world might as well be indeterministic. But if the descriptions are isomorphic, why are you entitled to infer an ontological conclusion from an epistemic premise? Why isn't your view just a recommendation to use stochastic language for convenience?"

  *   **Follow-up:** If she says "Because the deterministic description requires unmeasurable parameters": "But the stochastic description requires positing objective chances. Which ontological cost is higher? If you reject the deterministic world because we can't verify the initial condition, shouldn't you also reject the indeterministic world because we can't verify the propensity? What breaks the symmetry?"

  7. **The Quantum Cutoff [CUT IF TIME SHORT]**
  "Your argument assumes a classical substrate where trajectories exist but are unknowable. But in a quantum world, trajectories don't exist, and the correspondence principle breaks down on the Ehrenfest timescale. Does your thesis survive the transition to quantum mechanics? Or are you essentially rediscovering quantum uncertainty using classical chaos theory and mislabeling it as a classical phenomenon?"

  *   **Follow-up:** If she says "I'm talking about effective classical laws": "Then your thesis is only about our models, not the world. If the fundamental laws are quantum, and the classical laws are emergent approximations, then the 'determinism' you're attacking is already false. What work is chaos doing here that the Schrödinger equation doesn't already do?"

  8. **The Free Will Uptake [CUT IF TIME SHORT]**
  "Popular discussions of chaos often invoke it to save free will, arguing the future is 'open.' Do you endorse this inference? If not, in what sense is a future that is strictly entailed by the present 'open' at all? If yes, how do you avoid the contradiction of an event being both determined by prior states and freely chosen?"

  *   **Follow-up:** If she says "I mean open only epistemically": "Then you are misleading your audience. If the future is entailed, agency is no more saved than in a clockwork universe. Shouldn't you be more careful with the 'open future' phrasing if the metaphysical load-bearing beam is just measurement error?"

  9. **The Discriminating Question**
  "Finally, what observation, argument, or result would show you wrong? You argue deterministic chaos is observationally indistinguishable from indeterminism. If nothing can distinguish them, what fact of the matter makes your view true rather than the Laplacian view? I need a truth condition: give me one sentence describing the world on your view that would be *false* if the Laplacian Demon were possible."

  *   **Follow-up:** If she says "Nothing could distinguish them": "Then you are an anti-realist about determinism. But you began by making a claim about what the world *is* like, not just what we can say. If there is no evidence that could count against your view, and no difference in prediction, aren't you just proposing a change in vocabulary rather than describing a physical reality?"
