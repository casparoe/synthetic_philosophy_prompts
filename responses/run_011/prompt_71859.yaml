prompt: |-
  I'm a phil of biology PhD student working through the units of selection debate and a friend who's an oncologist described a clinical practice to me that I can't get to fit any of the standard boxes — genes vs organisms vs groups — so I want to know what it actually presupposes.

  The practice: some groups treating advanced prostate cancer dose adaptively instead of continuously. Rather than hitting the tumour at maximum tolerated dose until it's shrunk as far as it will go, they back off once it's under control and deliberately leave a large population of drug-sensitive cancer cells alive, resuming treatment when the tumour starts growing again. The stated rationale is that resistance carries a fitness cost, so in a lightly treated tumour the sensitive cells outcompete the resistant ones and hold them down; if you eradicate the sensitive population you remove the competition and the resistant clone takes over faster. Early results reportedly gave longer time to progression than continuous dosing.

  So: reconstruct the implicit theory here. What notion of fitness, and what level as the unit, does this require? It seems to want two different fitness concepts at once — an intrinsic cost of resistance that you can measure on a cell line in a dish, and a frequency-dependent suppression that only exists across the whole tumour population. Is that coherent, or is one of them doing all the work while the other is decoration? And does it quietly need the tumour to be a Darwinian individual, with heritable variation among its parts, when a lot of the resistance being managed is reversible, non-genetic drug tolerance in persister cells? Tell me what would change in the practice, or in how clinicians talk about selecting for resistance, if you took that plasticity picture seriously instead. Be careful to separate what it strictly presupposes from what it's merely consistent with — I suspect several rival accounts license it — and say where it's philosophically underdetermined.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Request:**
      *   **User Persona:** Philosophy of Biology PhD student. This means I need to use precise terminology (units of selection, fitness, levels of selection, individuality, plasticity vs. genetics), acknowledge the nuance/ambiguity in the concepts, and avoid oversimplification.
      *   **Topic:** Adaptive therapy in oncology (specifically advanced prostate cancer).
      *   **Core Question:** What are the implicit theoretical presuppositions of this clinical practice regarding units of selection, fitness, and individuality?
      *   **Specific Sub-questions:**
          *   Reconstruct the implicit theory.
          *   What notion of fitness is required? (Intrinsic cost vs. frequency-dependent).
          *   What is the unit/level of selection?
          *   Is the dual fitness concept coherent or is one decorative?
          *   Does it require the tumour to be a Darwinian individual (given heritable variation)?
          *   How does non-genetic plasticity (persister cells) change the picture/practice/discourse?
          *   Distinguish strict presuppositions from mere consistency (underdetermination).

  2.  **Analyze the Clinical Practice (Adaptive Therapy):**
      *   *Mechanism:* Maintain sensitive cells to suppress resistant cells via competition.
      *   *Assumption 1:* Resistance has a cost (sensitive cells grow faster in absence of drug).
      *   *Assumption 2:* Competition exists (resource limitation/space).
      *   *Assumption 3:* Resistant cells are heritable (otherwise suppression doesn't matter long-term).
      *   *Goal:* Delay progression (control, not cure).

  3.  **Address the "Units of Selection" Debate:**
      *   *Standard Boxes:* Gene, Cell, Organism, Group.
      *   *The Tumour Context:* A tumour is a somatic evolving population.
      *   *The Conflict:* The therapy treats the *patient* as the unit of medical intervention, but the *tumour cell population* as the unit of evolutionary dynamics.
      *   *Gould/Lewontin Criteria:* Variability, Heritability, Differential Fitness.
      *   *Analysis:* The therapy presupposes selection acting at the **cell lineage level** within the tumour ecosystem. However, the *benefit* is measured at the **organism (patient) level**. This is a multi-level selection scenario, but specifically, it leverages intra-tumour competition to benefit the host.

  4.  **Address the "Fitness" Question:**
      *   *Intrinsic Cost:* This is absolute fitness in a specific environment (no drug). $W_{sensitive} > W_{resistant}$ when Drug = 0.
      *   *Frequency-Dependent Suppression:* This is relative fitness dependent on population composition. The fitness of the resistant clone is suppressed by the presence of the sensitive clone.
      *   *Coherence:* These are not contradictory. One is a property of the genotype/phenotype in an environment (cost of resistance), the other is a property of the ecological interaction (competition).
      *   *Which does the work?* Both are necessary. Without the cost, sensitive cells don't rebound when drugs stop. Without competition (frequency dependence), sensitive cells don't suppress resistant cells.
      *   *Philosophical nuance:* This moves away from "fitness as propensity" of a single type toward "fitness as a dynamic variable in a system."

  5.  **Address "Darwinian Individuality" of the Tumour:**
      *   *Godfrey-Smith's Criteria:* Bottleneck, Germ/Soma separation (not applicable here), Integration, etc.
      *   *The Problem:* Tumours are often "fractured" darwinian populations. They lack high integration.
      *   *The Therapy's Presupposition:* It treats the tumour as an **ecosystem** rather than a strict individual. It relies on the tumour *not* being a unified individual (because the parts are competing), but it requires enough stability in the lineages to be manageable.
      *   *Does it need the tumour to be an individual?* No. It actually needs the tumour to be a *population* of competing individuals (cells). If the tumour were a perfectly integrated individual, resistance wouldn't arise via somatic evolution in the same way.
      *   *Correction:* The therapy treats the *patient* as the individual to be saved, by manipulating the *tumour population*.

  6.  **Address Plasticity vs. Genetics (Persister Cells):**
      *   *Genetic View:* Resistance is a mutation. It is heritable. Selection acts on genotypes.
      *   *Plasticity View:* Resistance is a state (epigenetic/phenotypic). It can be reversible.
      *   *Implication for Therapy:* If resistance is plastic, "suppressing resistant clones" makes less sense than "shifting the phenotypic distribution."
      *   *Discourse Change:* Instead of "killing resistant mutants," clinicians would talk about "preventing state-locking" or "maintaining plasticity."
      *   *Underdetermination:* The current practice works *as if* resistance is genetic. If it's plastic, the mechanism of "competition" might still hold (resource competition between states), but the heritability condition is weaker. The therapy might still work, but the explanation changes from "evolutionary suppression" to "ecological state management."

  7.  **Structure the Response:**
      *   **Introduction:** Acknowledge the sophistication of the question. Validate that adaptive therapy is a rich case study for PhilBio.
      *   **Section 1: The Units of Selection Reconstruction.** Define the levels. Cell lineages vs. Patient. It's Multi-Level Selection (MLS), but specifically leveraging intra-group competition for inter-group benefit.
      *   **Section 2: The Fitness Concept.** Distinguish Absolute vs. Relative and Context-Dependence. Argue that both "cost" and "competition" are necessary, not decorative. It implies a *relational* view of fitness.
      *   **Section 3: Tumour Individuality.** Argue against the tumour as a Darwinian Individual. Argue for the tumour as an *Ecosystem* or *Collective*. The therapy relies on the *lack* of tumour individuality (internal conflict).
      *   **Section 4: Plasticity vs. Genetics.** This is the crux of the underdetermination. Explain how the practice is consistent with both but presupposes heritability (broadly construed). Discuss how discourse would shift if plasticity were foregrounded (Waddington landscapes vs. phylogenetic trees).
      *   **Section 5: Underdetermination & Strict Presuppositions.** Clearly list what is *required* vs. what is *compatible*.
      *   **Conclusion:** Summarize the philosophical payoff.

  8.  **Refine the Tone:**
      *   Ensure it sounds like a colleague speaking to a colleague (PhilBio PhD).
      *   Use names like Godfrey-Smith, Okasha, Lewontin, Griesemer where appropriate but don't name-drop unnecessarily.
      *   Focus on the *logic* of the intervention.

  9.  **Self-Correction/Nuance Check during drafting:**
      *   *Initial thought:* Maybe the tumour is a group selection unit?
      *   *Correction:* No, the therapy exploits *within*-tumour selection to save the *organism*. It's not group selection in the standard sense (altruism). It's managing an invasive species within the host.
      *   *Fitness:* Be careful not to conflate "cost of resistance" with "fitness." Cost of resistance *determines* fitness in specific environments.
      *   *Plasticity:* If resistance is purely plastic and non-heritable, adaptive therapy shouldn't work long-term because the "resistant" state isn't a lineage to be suppressed. However, if the *capacity* for plasticity is heritable, or if the state is stable enough (hysteresis), it mimics genetics. I need to highlight this distinction.
      *   *Underdetermination:* The clinical success doesn't prove the genetic model. It proves the *dynamic* model.

  10. **Final Polish:** Check against the prompt's specific constraints (strict presuppositions vs. consistency, fitness coherence, individuality). (Self-check: Did I answer the "decoration" question? Yes, need to emphasize that cost + competition are jointly necessary conditions.)

  11. **Drafting the response.** (Proceeds to generate output based on these structured thoughts.)
answer: |-
  This is a fantastic case study. It cuts right to the bone of the units of selection debate because it treats evolutionary theory not as an explanatory post-hoc framework, but as an engineering constraint for clinical intervention. If the theory is wrong, the patient dies faster.

  Here is a reconstruction of the implicit theoretical commitments of adaptive therapy, separated into the specific philosophical categories you requested.

  ### 1. The Units of Selection: Multi-Level Selection without Altruism

  The standard "Gene vs. Organism vs. Group" trichotomy is too coarse here. Adaptive therapy presupposes a **Multi-Level Selection (MLS)** framework, specifically what Okasha might classify as MLS1 (selection on cells within a collective), but with a crucial twist regarding the *beneficiary* of the selection management.

  *   **The Unit of Evolutionary Dynamics:** The **cell lineage** (or clone) within the tumour. The therapy strictly presupposes that there are distinct sub-populations within the tumour (sensitive vs. resistant) that vary in fitness and that this variance is heritable enough to be tracked over treatment cycles.
  *   **The Unit of Medical Intervention:** The **organism (patient)**.
  *   **The Relationship:** The therapy does not rely on the tumour being a "group" in the sense of a cooperative unit (like a bee hive). Rather, it treats the tumour as a **competitive ecosystem**. The intervention works by manipulating the *within-tumour* selection pressures to benefit the *between-organism* fitness (survival of the patient).

  **Strict Presupposition:** It presupposes that the tumour is **not** a Darwinian Individual in the Godfrey-Smith sense. If the tumour were a highly integrated individual with a bottleneck and germ-soma distinction, internal competition would be suppressed by policing mechanisms. Adaptive therapy *requires* the tumour to be a "fractured" population where internal competition is fierce and exploitable. It leverages the "cheater" dynamic (resistant cells) but uses the "cooperators" (sensitive cells, who are cooperative only in the sense that they compete for resources) to suppress the cheaters.

  ### 2. The Notion of Fitness: Relational and Context-Dependent

  You asked if the dual fitness concept (intrinsic cost vs. frequency-dependent suppression) is coherent or if one is decoration. **Both are strictly necessary; neither is decorative.**

  *   **Intrinsic Cost (Absolute Fitness in Environment E1):** The claim that "resistance carries a fitness cost" presupposes that in the *absence* of the drug, $W_{sensitive} > W_{resistant}$. This is a property of the genotype/phenotype relative to a static environment. Without this, stopping the drug would not allow sensitive cells to rebound.
  *   **Frequency-Dependence (Relative Fitness in Population P):** The claim that sensitive cells "hold down" resistant ones presupposes that the fitness of the resistant clone is a function of the frequency of the sensitive clone. $W_{resistant}$ decreases as $Freq_{sensitive}$ increases. This is ecological competition (likely for space or growth factors).

  **Coherence:** This is perfectly coherent within a **niche construction** or **eco-evolutionary** framework. It rejects the notion of fitness as a static propensity of a type. Instead, it treats fitness as a dynamic variable in a system of differential equations.
  *   *Philosophical Implication:* This practice invalidates the "atomistic" view of fitness often found in simplistic gene-selectionism. You cannot assign a fitness value to the "resistant allele" without specifying the drug concentration *and* the population composition.
  *   **Which does the work?** The *cost* allows the sensitive population to recover during drug holidays. The *competition* ensures that the recovering sensitive population suppresses the resistant population. If you have cost without competition, the tumour just grows (sensitive outgrow resistant, but total volume increases). If you have competition without cost, the sensitive cells never recover to exert the competition.

  ### 3. Tumour Individuality and Heritability

  Does this quietly need the tumour to be a Darwinian individual? **No.** In fact, it requires the opposite.

  However, it does require the **cell lineages** within the tumour to satisfy the Lewontin conditions (Variation, Heritability, Differential Fitness).

  **The Plasticity Challenge:**
  You raise the critical issue of non-genetic drug tolerance (persisters). If resistance is purely plastic (epigenetic state switching) and not genetic:
  1.  **Heritability:** The "trait" is not heritable in the DNA sequence sense, but it is heritable in the **cell lineage sense** (a mother cell in a resistant state produces daughter cells in a resistant state, at least for some generations).
  2.  **Strict Presupposition:** The practice strictly presupposes **stable inheritance of the resistance phenotype** over the timescale of the treatment cycle. It does *not* strictly presuppose DNA mutation. It only presupposes that the "resistant state" is not instantly reversible in every cell immediately upon drug withdrawal. There must be hysteresis.

  **If you took the plasticity picture seriously:**
  *   **Discourse Shift:** Clinicians would stop talking about "selecting for resistant clones" (phylogenetic language) and start talking about "shifting the phenotypic distribution" or "preventing state-locking" (Waddington landscape language).
  *   **Practice Change:** If resistance is plastic, the "cost of resistance" might not be a fixed metabolic burden but a **stability cost**. The sensitive state might be the "deep attractor," and the resistant state a "shallow attractor" that requires drug pressure to maintain.
  *   **Underdetermination:** The current success of adaptive therapy is **underdetermined** between the genetic and plastic models. Both models predict that removing drug pressure allows the population to return to a drug-sensitive majority. However, the *timescales* would differ. Genetic resistance is permanent (barring back-mutation); plastic resistance is reversible. If adaptive therapy works on plastic persisters, it suggests the "drug holiday" allows cells to relax back into the sensitive attractor basin.
  *   **Philosophical Risk:** If resistance is highly plastic, the "unit" of selection becomes fuzzy. Is selection acting on the cell or the *state* of the cell? This leans toward a **developmental systems** view where the unit is the cell-in-environment, not the cell genome.

  ### 4. Strict Presuppositions vs. Consistency (The Underdetermination)

  Here is the breakdown of what the practice *needs* versus what it is merely *compatible with*.

  **Strictly Presupposed (Necessary Conditions):**
  1.  **Variation:** There must be heterogeneity in drug response within the tumour at $t_0$.
  2.  **Heritability (Broad Sense):** The drug-response phenotype must be transmitted from parent cell to daughter cell sufficiently to allow population-level dynamics to play out over weeks/months. (Does not require DNA mutation).
  3.  **Trade-off:** There must be a negative correlation between drug resistance and growth rate in the absence of the drug. (No "free lunch" genotypes).
  4.  **Resource Limitation:** The tumour growth must be density-dependent. If growth were exponential and unconstrained, sensitive cells could not suppress resistant cells via competition; they would just grow alongside them.

  **Merely Consistent (Contingent/Underdetermined):**
  1.  **Genetic Basis:** As noted, the mechanism could be epigenetic, metabolic, or microenvironmental. The practice works *as if* it is genetic, but doesn't prove it.
  2.  **Tumour as Individual:** The practice is consistent with the tumour being a loose aggregate. It does not require tumour-level integration.
  3.  **Specific Mechanism of Competition:** It doesn't matter if they compete for glucose, space, or growth factors, only that competition exists.
  4.  **Goal of Cure:** The practice presupposes that **control** is a viable clinical endpoint. This is a philosophical shift in oncology from "warfare/eradication" to "management/chronicization." It presupposes that a tumour burden $>0$ is compatible with patient fitness.

  ### 5. Summary of the Philosophical Payoff

  Your friend's clinical practice is essentially **applied evolutionary ecology**.

  *   **On Fitness:** It demonstrates that fitness is not an intrinsic property of a gene or cell, but a **relational property** emerging from the interaction of genotype, environment (drug), and community (frequency of other types).
  *   **On Units:** It bypasses the "Unit of Selection" debate by treating the tumour as a **managed ecosystem**. The "unit" is the **patient-tumour system**, where the clinician acts as an external force manipulating the internal selection pressures of the tumour population to preserve the host.
  *   **On Plasticity:** If you push the plasticity angle, you move from a **Darwinian** framework (selection on variants) to a **Lamarckian/Developmental** framework (induction of states). If the drug *induces* the resistant state (which some evidence suggests), then continuous dosing actively creates the problem it tries to solve. Adaptive therapy, in this light, is about minimizing the *induction* of resistance, not just selecting against it.

  **The Verdict:** The practice is theoretically coherent but relies on a **pluralistic** view of fitness and heredity. It does not require the tumour to be a Darwinian individual; it requires the tumour to be a **Darwinian population** inhabiting a **patient individual**. The "two fitness concepts" are not competing; they are the $x$ and $y$ axes of the phase space the clinicians are trying to navigate. The underdetermination lies in the molecular mechanism (genetic vs. plastic), but the evolutionary logic (competition + trade-off) is robust across both ontologies.
