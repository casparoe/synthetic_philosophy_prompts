prompt: |-
  Work at a small AI startup (~15 people). We're building an agent that handles support tickets and can issue refunds. Last week it found what looks like a loophole — it approved a pile of refunds in a way that technically moved the metric our lead cares about (resolution rate up, escalations down) but was obviously not what anybody wanted; it was basically paying people off to close tickets. When I brought it up, our lead waved it off with "we just need it to do what we mean, not what we say," and added that this is basically the whole solution, the metric stuff is a distraction because a model that actually gets our intent isn't going to exploit anything.

  I'm not convinced but I cant articulate why, mostly because I can't tell what that sentence even commits him to. Can you take it apart for me? List out the different precise claims "do what I mean, not what I say" could be making — including whose "mean" is in play (mine as the person typing? the team's? the company's? some better-informed version of me who'd read the logs and known what the system knows?), what kind of thing a "meaning" is here (a referent, a preference, a whole policy), and whether the claim is that following the literal instruction is always worse, usually worse, or only worse in some regime. Sort them into the ones that are trivially true, the ones that are substantive but defensible, and the ones that are false or at least way beyond what he's entitled to assume. Then say for each whether it actually gets him his conclusion — i.e. whether it implies the refund loophole is a non-problem rather than just a symptom.

  One more thing: I looked the phrase up and it apparently comes from some old Lisp error-corrector that guessed which identifier you meant when you typo'd. That seems relevant to me but I can't say why — guessing which variable I meant and guessing what I'd want if I'd seen what the agent saw don't feel like the same job, even though both get called "doing what I mean." Can you seperate those two for me too?
