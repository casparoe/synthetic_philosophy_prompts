answer: |-
  Here is a breakdown of the competing interpretations of the slogan, sorted by how they define the underlying economic and ethical concepts. I have kept the analysis neutral, as requested, focusing on the logical structure of each claim rather than advocating for one.

  ### A Menu of Readings

  1.  **The Financial Literalist Reading**
      *   **Verdict:** Trivially true in finance, but a category error when applied to ecology.
      *   **Argument:** Here, 'capital' is strictly money in a bank account and 'interest' is the market yield on that principal. While sound advice for personal wealth management, it fails as environmental policy because the biosphere does not function like a savings account with a fixed coupon rate; treating it as such ignores biophysical limits and feedback loops.

  2.  **The Weak Sustainability (Hartwick Rule) Reading**
      *   **Verdict:** Substantive and internally consistent, but relies on the contested assumption of perfect substitutability.
      *   **Argument:** 'Capital' is defined as aggregate inclusive wealth (natural plus man-made), and 'interest' is the constant consumption path enabled by reinvesting depletion rents from exhaustible resources into reproducible capital. This licenses the sovereign wealth fund argument, provided one accepts that human-made capital can fully substitute for lost natural capital without reducing future welfare.

  3.  **The Strong Sustainability (Critical Natural Capital) Reading**
      *   **Verdict:** Defensible on ecological grounds, but renders the slogan prescriptive rather than descriptive.
      *   **Argument:** 'Capital' refers specifically to critical natural stocks (like the climate system) that have no substitutes, and 'interest' is the sustainable yield of renewable systems only. Under this reading, extracting oil is necessarily eating capital, not living off interest, because non-renewables generate no sustainable yield; this licenses the keep-it-in-the-ground position.

  4.  **The Natural Income (Daly) Reading**
      *   **Verdict:** Substantive and defensible, offering a clear accounting distinction between income and liquidation.
      *   **Argument:** 'Capital' is the biophysical stock maintaining the service flow, and 'interest' is the maximum harvest rate that leaves the stock physically intact. This view argues that you cannot count the proceeds from selling oil as 'income' to be consumed; it is capital liquidation that must be offset by investment in renewables if total carrying capacity is to be maintained.

  5.  **The Welfare Consequentialist Reading**
      *   **Verdict:** Substantive, but shifts the debate from stocks to outcomes and depends heavily on discount rates.
      *   **Argument:** 'Capital' is the capacity for well-being across generations, and 'live off' means ensuring non-declining utility rather than preserving specific physical stocks. This reading could theoretically license the SWF position if the financial returns generate enough welfare to offset climate damages, but it requires agreeing on how to value future lives relative to current ones.

  6.  **The Prudence/Precautionary Reading**
      *   **Verdict:** Defensible as a policy heuristic, though analytically vague.
      *   **Argument:** 'Capital' represents a safety margin or buffer against systemic collapse, and 'interest' is any surplus extracted above that threshold. This avoids the need to measure substitutability precisely and instead focuses on avoiding irreversible thresholds, effectively siding with the keep-it-in-the-ground argument unless safety margins are proven vast.

  ### Mapping the Debate

  To answer your specific question about who is licensed to say what: the quantitative student arguing for the sovereign wealth fund is relying on **Reading 2 (Weak Sustainability)**. He is invoking the Hartwick Rule, which posits that consuming the rent from resource depletion is permissible so long as that rent is invested to maintain total productive capacity. He assumes substitutability between oil and bonds (or technology).

  The policy student arguing for keeping the oil in the ground is relying on **Reading 3 (Strong Sustainability)** or **Reading 4 (Natural Income)**. She is treating the carbon budget as critical natural capital that cannot be substituted by financial assets. Her point that "you can't eat a bond portfolio" is a claim that financial capital is useless without the life-support services provided by natural capital.

  Are they contradicting each other? Yes, but only because they are adopting different sustainability paradigms. However, there is a compatibilist reading under **Reading 6 (Prudence)**. If both sides agreed on a specific safety threshold for the climate (a minimum stock of natural capital), they could agree to live off the interest of the oil *only* to the extent that extraction stays within that budget. They are not necessarily arguing about the slogan itself, but about the parameters of substitutability and the size of the safety margin.

  ### Common Usage and Smuggled Assumptions

  In casual conversation, people most often have **Reading 1 (Financial Literalist)** in mind but apply it to **Reading 3 (Ecological)** contexts. They use the intuitive clarity of banking metaphors to make claims about complex biophysical systems. This is where the slogan sounds profound while smuggling in contested assumptions.

  The slogan sounds wise because it appeals to thrift and longevity, but it does heavy lifting for **Reading 2 (Weak Sustainability)**. It makes the assumption of substitutability sound like common sense rather than a specific economic hypothesis. Conversely, when used by ecologists, it smuggles in the assumption of incommensurability (that nature cannot be priced). The professor was correct: until you specify whether 'capital' is an aggregate value or a physical stock, and whether 'interest' is a market return or a sustainable yield, the sentence is merely a Rorschach test for your prior beliefs about substitutability.
