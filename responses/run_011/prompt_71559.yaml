  To: Grant Panel
  From: Technical Member
  Subject: Renewal Recommendation – Malthusian Dynamics Group

  **Recommendation:** Renew with Conditions (3-year term).

  **Rationale:**
  The panel is split between the utility of the group's infrastructure and the validity of their core model. Both sides have merit.

  The Renew argument is strongest on infrastructure: their open datasets are public goods, and their training pipeline produces competent researchers. Furthermore, dismissing finite constraints entirely is risky; physical limits exist even if markets delay them. Ignoring structural risk is its own bias.

  However, the Cut argument regarding scientific rigor is technically sound. My assessment confirms that using machine-learning vocabulary here is appropriate. Adjusting parameters post-hoc to match observed history is overfitting. A model that moves the goalpost (2000 → 2040 → 2100) without updating the underlying mechanism to account for substitution is unfalsifiable. "The theory was right, just early" fails when the predicted mechanism (hard collapse) is consistently bypassed by feedback loops (innovation/substitution) the model treats as exogenous. In complex systems, timing *is* the prediction. If the mechanism doesn't trigger because you excluded the feedback loops that prevent it, the mechanism is incomplete, not mistimed.

  **Conditions for Renewal:**
  To continue funding, the group must transition from retroactive fitting to prospective validation.
  1.  **Pre-registered Predictions:** Submit specific, falsifiable predictions for commodity prices or yield ceilings for the next 36 months. No "within the century" ranges. Metrics must be quantifiable (e.g., price of phosphorus > $X).
  2.  **Endogenous Substitution:** The model must explicitly simulate innovation/substitution rates as variables, not external shocks. Show us the switch mechanism.
  3.  **Falsification Criteria:** Define exactly what data would prove the model wrong. If fisheries recover or yields double without collapse, does the theory update? Publish a null result if predictions fail.

  **Conclusion:**
  We fund their data and training, but we must stop funding the vibe. These conditions force the model to risk being wrong.

  ***

  **Note to Engineer:** Your ML intuition is correct. "Timing off" is a shield against falsification. If the mechanism doesn't trigger because you excluded the feedback loops that prevent it, the mechanism is wrong, not early. Treat it like overfitting.
