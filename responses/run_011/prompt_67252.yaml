      *   **The Suprahistorical:** Turning attention away from becoming to that which gives existence an eternal character (art, religion).
      *   **Three Modes of History:**
          1.  *Monumental:* For the man of action/striving. Inspires great deeds by showing past greatness. Danger: Distortion, ignoring differences.
          2.  *Antiquarian:* For the man of preservation/reverence. Loves the past for its own sake, roots. Danger: Mummification, stifling new life.
          3.  *Critical:* For the man of suffering/oppression. Judges and condemns the past to break its chain. Danger: Injustice, destroying roots.
