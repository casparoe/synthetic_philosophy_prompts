answer: |-
  **Commissioner A:** I want to address the basis of your objection, Commissioner B. I respect your integrity, and I respect the depth of your commitment to this land. But we are exercising coercive power over every resident of Larkspur County. My obligation, as I understand it, is to justify that coercion with reasons they can check for themselves, regardless of their private convictions. When you speak of a covenant spanning generations, or a duty to creation that forbids saddling the future with this burden, you are speaking a language many of our constituents do not share. If we strip away the theological premise—the covenant itself—what remains? It looks like a secular precautionary argument. You're worried about groundwater. But that is already accounted for in the National Regulator's probabilistic risk assessment. If the theology isn't doing any work, it cannot be the ground for a public vote.

  **Commissioner B:** It is doing work, though. You say strip it away and I'm just making a secular precautionary argument. But secular policy operates on a discount rate. If you calculate risk over a century using standard economic models, you discount the future at three percent. A catastrophe three hundred years from now counts for almost nothing in today's ledger. The regulator's model accepts this; it balances cost against risk within a manageable timeframe. My covenant does not discount. A harm to my great-grandchild counts equal to a harm to me. If you remove the covenant, I am outvoted by the math. The verdict flips. The theology isn't a hat; it's the engine that refuses to let the future disappear into the decimal points.

  **Commissioner A:** I see the consistency in your position, but I'm worried about accessibility. Public reason requires that the premises be accessible to the people being coerced. If your vote turns on a theological obligation to generations unborn, a resident who doesn't share that faith is being bound by a rule they cannot affirm. They cannot check the validity of a covenant they don't recognize. My vote relies on the Regulator's probabilistic risk assessment. Yes, it uses models, but those models are built on data—containment failure rates, groundwater transport models. They are public documents. In principle, any citizen could open them.

  **Commissioner B:** In principle, yes. In practice, can a layperson check a ten-thousand-year hydrogeological model? You are asking twelve thousand people to take an expert institution's word for a simulation they cannot open, based on assumptions about basalt stability they cannot test. You call that public because the document is downloadable. I call it private because the competence required to verify it is held by a priesthood of engineers. My father drilled wells for forty years. He taught me to read the core samples. When I say the shallow aquifer connects to the basin fill in a way the model misses, I am pointing at dirt we can all hold. I am pointing at wells that went sour ten miles east. That is checkable by the actual audience in this room.

  **Commissioner A:** But your interpretation of that dirt is still filtered through your obligation. You see the risk as unacceptable because of the covenant. I see the risk as acceptable because the probability is below the threshold set by the experts. If we define "public" as "assessable by the actual audience," then almost no complex policy survives. We can't all be hydrogeologists. We rely on institutions to aggregate expertise. That reliance is the only way a modern society functions. If you reject institutional trust because it isn't personally verifiable, you paralyze the state. My position is that trusting the procedure is the public reason.

  **Commissioner B:** Trusting the procedure is fine until the procedure asks you to bet your grandchildren's water on a simulation. I'm not asking for paralysis. I'm asking for justification that doesn't rely on a black box. You say public reason means premises accessible in principle. But if the assessment requires a PhD to validate, it isn't accessible to the people being coerced. It's accessible only to the experts. So whose reason is it? If "public" means "open to revision on shared evidence," my evidence is shared. The water samples are shared. Your evidence is sealed in a model that assumes stability over millennia we haven't lived through yet. You are asking them to trust a prophecy of safety. I am asking them to look at a well.

  **Commissioner A:** So you're arguing that my reliance on the Regulator is actually less public than your reliance on the covenant, because the covenant produces a verdict that protects the shared evidence, whereas my model asks them to ignore the limits of their own verification? That puts me in a difficult spot. I argue that coercion requires reasons people can check. But if the only reasons available are technical models no one here can actually check, then I am asking for trust, not verification. I am asking them to accept a conclusion they cannot assess.

  **Commissioner B:** You are asking them to accept a conclusion they cannot assess, based on a timeline they cannot inhabit, to benefit a grid they might not use. I am asking them to protect water they can drink, based on a duty they can feel, even if they don't share my faith. The covenant makes the duty visible. The model makes the risk invisible. Which one is actually public?

  **Commissioner A:** If public reason means the premises are accessible in principle, I am safe. If it means assessable by the actual audience in the room, I am not. But if I adopt your standard, I invalidate not just this vote, but the entire administrative state. I don't know if I can hold onto the principle of justified coercion without disqualifying my own vote. But I also don't know if I can vote yes if the justification is opaque to the people who must live with it.

  **Commissioner B:** Then maybe the question isn't whether my reason is secular. It's whether your reason is actually public.

  ***

  **Note**

  I am moderately confident I gave A the strongest version of his position. His defense of institutional reliance is the standard rebuttal to radical localism: complex society requires delegating verification to experts. However, to make the twist land, I had to lean heavily into the "checkability" gap between a physical core sample and a probabilistic model.

  The exchange I would bet least on is B's explanation of the discount rate. While economically sound, it compresses a complex philosophical disagreement about intergenerational equity into a technical calculation. It risks sounding like B is just doing utilitarianism with different variables, rather than operating from a deontological covenant.

  Regarding the assessability refinement: It does not quietly collapse into "reasons I find convincing," provided "assessable" is tied to *capacity* rather than *agreement*. A's reasons are agreeable to him but not assessable by the lay audience; B's reasons are disagreeable to A (theologically) but the evidence is assessable by the audience. The precision holds if we distinguish between *access to documents* (A's claim) and *access to verification* (B's claim). However, without a rigid definition of "capacity," it is vulnerable to slipping into populism where any expert consensus is dismissed as elitist. The dialogue leaves this tension unresolved intentionally.
