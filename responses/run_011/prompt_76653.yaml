  ### The Decision Tree: What Do the Incompatibility Theorems Mean?

  This sidebar is designed to sort your intuition about algorithmic fairness into one of seven philosophical positions. The path you take depends less on your grasp of the mathematics—which is settled—and more on your commitments regarding data, discretion, and the purpose of prediction.

  Answer the seven questions below. Follow the arrows to find your position.

  #### **Node 1: The Recidivism Conflict**
  *Case:* A risk score predicts re-arrest equally well for Group A and Group B (it is *calibrated* within both groups). However, because Group A has a higher recorded base rate of re-arrest, the score flags innocent people in Group A as high-risk more often than it does in Group B (unequal *false-positive rates*).
  *Question:* When calibration and error rates clash like this, do you view the tension as a **mathematical constraint on fairness** or a **political choice embedded in the data**?
  *   **Math Constraint** → Go to Node 2.
  *   **Political Choice** → Go to Node 4.

  #### **Node 2: The Edge Cases**
  *Case:* The incompatibility theorems prove you cannot satisfy all fairness metrics simultaneously *unless* the groups share the same base rate or the predictor is perfectly accurate.
  *Question:* Do these exceptions (equal base rates or perfect prediction) prove the theorem is **contingent on current conditions** or **fundamental to the task**?
  *   **Contingent** → Go to Node 3 (Leaf: **Scope-Limited**).
  *   **Fundamental** → Go to Node 3 (Leaf: **Indictment** / **Trade-off** split).
      *   *Refinement for Tree Logic:* To separate Indictment and Trade-off, we need a split here.
      *   *Revised Node 2:* Do these exceptions make the impossibility result **less significant** or **more revealing**?
          *   **Less Significant** → Leaf: **Scope-Limited**.
          *   **More Revealing** → Go to Node 3.

  #### **Node 3: The Nature of the Constraint**
  *Case:* You accept the math is binding. You must drop either calibration or equal error rates.
  *Question:* Is this impossibility a **technical engineering hurdle** (like bias-variance) or a **deep conceptual failure** of quantitative fairness?
  *   **Engineering Hurdle** → Leaf: **The Trade-off**.
  *   **Conceptual Failure** → Leaf: **The Indictment**.

  #### **Node 4: Base Rate Ontology**
  *Case:* You view the tension as political. The base rates of re-arrest differ between groups.
  *Question:* Should these base rates be treated as **fixed features of the world** the algorithm must accept, or as **symptoms of injustice** the algorithm should help correct?
  *   **Fixed Features** → Go to Node 5.
  *   **Symptoms of Injustice** → Leaf: **Base Rate Injustice**.

  #### **Node 5: The Target Variable**
  *Case:* A care-management algorithm allocates resources based on prior health *spending*, assuming spending proxies *need*. Fairness metrics fail because spending reflects wealth, not health.
  *Question:* When the metrics clash here, is the problem the **math of fairness** or the **definition of health**?
  *   **Math of Fairness** → Go to Node 6.
  *   **Definition of Health** → Leaf: **Target Variable**.

  #### **Node 6: Human Discretion**
  *Case:* A hiring screen generates a score, but a human manager makes the final hire/no-hire decision.
  *Question:* If a human reviews the score, does satisfying a mathematical fairness constraint become **less urgent** or **more critical**?
  *   **Less Urgent** → Go to Node 7.
  *   **More Critical** → Leaf: **Procedural Fairness**.

  #### **Node 7: Abolition**
  *Case:* You have accepted the target variable and the human discretion, but the mathematical incompatibility remains.
  *Question:* Regardless of which metric you satisfy, does the act of **scoring people for this purpose** legitimize a harm that no metric can fix?
  *   **Yes** → Leaf: **Abolitionist**.
  *   **No** → Leaf: **The Trade-off** (Convergence).

  ---

  ### The Leaves: Positions and Awkward Commitments

  1.  **Scope-Limited**
      *   *Position:* The theorems only apply under specific statistical conditions (unequal base rates, imperfect predictors); they are not universal laws.
      *   *Awkward Commitment:* You must argue that fairness is achievable whenever base rates align, implying that inequality is only a technical problem when groups are statistically identical.

  2.  **The Indictment**
      *   *Position:* The incompatibility results prove that quantitative fairness metrics are fundamentally incoherent when applied to stratified populations.
      *   *Awkward Commitment:* You must accept that no statistical audit can ever certify a system as fair, potentially leaving regulation without a measurable standard.

  3.  **The Trade-off**
      *   *Position:* The incompatibility is an unsurprising optimization constraint, no more scandalous than the bias-variance trade-off in standard modeling.
      *   *Awkward Commitment:* You must treat false positives and false negatives as interchangeable costs to be minimized, rather than distinct harms with distinct moral weights.

  4.  **Base Rate Injustice**
      *   *Position:* The mathematical conflict is a signal that the underlying base rates (e.g., arrest records) are themselves the object of measurement and reform.
      *   *Awkward Commitment:* You must treat the algorithm not as a decision tool but as a diagnostic instrument for societal bias, even if it renders the tool unusable for immediate decisions.

  5.  **Target Variable**
      *   *Position:* The impossibility is downstream of the choice of target variable (e.g., spending vs. need); the mathematics is the least of the problem.
      *   *Awkward Commitment:* You must claim that a perfectly calibrated predictor of a *bad* target (like spending) is less fair than an uncalibrated predictor of a *good* target (like need), prioritizing construct validity over statistical consistency.

  6.  **Procedural Fairness**
      *   *Position:* Because no single metric can hold, fairness must be located in the deliberative process (human review, appeals) rather than the output score.
      *   *Awkward Commitment:* You must trust that human discretion corrects algorithmic bias rather than compounding it, despite evidence that humans often defer to scores.

  7.  **Abolitionist**
      *   *Position:* The tools should not be run at all; the incompatibility theorems are merely the mathematical proof of a moral boundary.
      *   *Awkward Commitment:* You must reject the efficiency gains of prediction entirely, accepting that some decisions will remain slower and more resource-intensive to avoid the harm of quantification.

  ---

  ### Logical Space and Empty Nodes

  The tree above maps the logical space of the debate. However, not all combinations of answers are coherent. Below is an analysis of the empty or unstable regions of this decision space.

  **1. The "Perfect Predictor" Paradox (Empty Node)**
  *   *Combination:* Answering **Node 2 (Fundamental)** while simultaneously believing in the **Perfect Predictor** case.
  *   *Why Empty:* The incompatibility theorems mathematically vanish if the predictor is perfect (accuracy = 100%). To claim the impossibility is *fundamental* while relying on an edge case where it disappears is logically inconsistent. The theorems are proven facts; their *relevance* is contested. A reader cannot coherently hold that the math is a deep indictment of reality while admitting the math ceases to apply in the limit of truth.

  **2. The "Mutable Base Rate / Fixed Target" Contradiction (Empty Node)**
  *   *Combination:* Answering **Node 4 (Symptoms of Injustice)** but **Node 5 (Math of Fairness)**.
  *   *Why Empty:* If you believe base rates are mutable symptoms of injustice (Node 4), you inherently acknowledge that the *measurement* of the outcome (e.g., arrest) is flawed. This collapses into the **Target Variable** position (Node 5). You cannot claim the base rate is a political artifact while insisting the definition of the target variable (which creates the base rate) is mathematically neutral.

  **3. The "Abolitionist / Trade-off" Convergence (Flagged Pair)**
  *   *Combination:* **Node 7 (No)** leads to **The Trade-off**.
  *   *Why Flagged:* The tree cannot genuinely separate the **Trade-off** leaf reached via the "Math Constraint" path (Node 3) from the **Trade-off** leaf reached via the "Abolition" path (Node 7).
      *   *Path A:* "The math is hard, it's just engineering." → Trade-off.
      *   *Path B:* "We should not abolish the tool, so we must accept the math." → Trade-off.
      *   *Distinction:* These are motivationally distinct (optimism vs. resignation) but functionally identical in policy. The tree treats them as the same leaf because the *operational outcome* (running the tool and optimizing metrics) is the same, even if the *justification* differs.

  **4. The "Human Discretion / Abolitionist" Tension (Unstable Node)**
  *   *Combination:* Answering **Node 6 (Less Urgent)** and **Node 7 (Yes/Ban)**.
  *   *Why Unstable:* If human discretion makes the metric less urgent (Node 6), it implies the human can mitigate the harm. If the harm is severe enough to warrant Abolition (Node 7), then human discretion was insufficient to mitigate it. While not logically impossible, this path represents an unstable cognitive state: trusting the human enough to ignore the metric, but not enough to let them use it.

  ### Settled Proof vs. Contested Interpretation

  Throughout this tree, a sharp line is drawn between the mathematics and the meaning:

  *   **Settled Proof:** It is a mathematical fact that Calibration within Groups, Equal False Positive Rates, and Equal False Negative Rates are incompatible when base rates differ and accuracy is imperfect. This is not debated among specialists.
  *   **Contested Interpretation:** What this impossibility *implies* for policy is entirely contested.
      *   *Specialists disagree on:* Whether "Calibration" is a necessary condition for fairness (some argue it is merely a statistical property, not a moral one).
      *   *Specialists disagree on:* Whether base rates should be treated as exogenous inputs or endogenous variables subject to intervention.
      *   *Specialists disagree on:* Whether the existence of edge cases (equal base rates) renders the theorem practically irrelevant or theoretically profound.

  This sidebar forces the reader to locate their contestation. The math does not tell you which metric to drop; your answer to these questions does.
