answer: |-
  # STANDARD OPERATING PROCEDURE: PROBABILISTIC FORECAST ADJUSTMENT
  **Document ID:** FWC-PROB-04
  **Effective:** Immediate
  **Applicability:** All Duty Forecasters and Duty Managers
  **Review Cycle:** Annual

  ## 1. CORE PRINCIPLE: THE PRESUMPTION OF ACCURACY
  The ensemble model output is the starting point for all public warnings. It represents the best available estimate of the objective likelihood of flooding. 

  **The Golden Rule:** You must publish the model number exactly as it appears unless you possess specific, physical evidence that the model's calculation is broken *for this specific instance*. 

  You are not adjusting the number to reflect your "confidence" or "caution." You are adjusting it only to correct a known error in the information the model used. If you cannot prove the model's input or logic is compromised for this specific run, the model's number stands.

  **Note on "Inadmissible Evidence":** 
  One of your colleagues has raised a concern about "inadmissible evidence." Here is the operational translation: 
  *   **Admissible (Valid):** Facts about the *current physical state* that the model missed (e.g., a broken sensor, water already above the threshold).
  *   **Inadmissible (Invalid):** Knowledge about the *future outcome* or general feelings about the model's past performance (e.g., "it usually rains more than this," "the last five forecasts were too low"). 
  *   **Verdict on Current Practice:** Our current habit of adjusting based on historical bias (e.g., "this valley always floods more than the model says") is **not permitted** under this procedure. That is a critique of the model's design, not a correction of the current run. It requires a formal model update, not a duty forecaster adjustment.

  ## 2. TRIAGE STEP (Time Limit: 2 Minutes)
  *Goal: Clear the 35+ gauges that require no human intervention.*

  **Action:** Scan the 40 gauge outputs.
  **Ask:** Is the published probability exactly equal to the model output?
  **Default:** YES. 
  **Exception:** Only stop if you have immediate, hard evidence of input failure or physical impossibility.
  **Pass Condition:** If you do not have documented evidence of input failure within 2 minutes, the number passes untouched.

  ## 3. ADJUSTMENT PROTOCOL (Time Limit: 10 Minutes)
  *If you stopped at Triage, you must complete this section before broadcast.*

  ### Step 3.1: The Validity Test
  Consult the **Table of Adjustments** (Section 5). 
  *   If your reason is in the **LEFT** column: You may proceed to calculation.
  *   If your reason is in the **RIGHT** column: You must publish the model number untouched.
  *   If your reason is not listed: You must publish the model number untouched.

  ### Step 3.2: The Calculation Rule
  If you have multiple sources of uncertainty (e.g., two different model runs, or a model run plus a physical measurement), you must calculate a **Weighted Average**. 
  *   **FORBIDDEN:** Do not "split the difference" toward 0.5 (50%). Do not shrink the number to be "safer."
  *   **REQUIRED:** Assign a weight (0.0 to 1.0) to each source based on its reliability. The weights must sum to 1.0.
  *   **Arithmetic:** $(Probability_A \times Weight_A) + (Probability_B \times Weight_B) = Published Probability$.
  *   **Example:** Model says 0.20 (Weight 0.7). Physical measurement implies 0.80 (Weight 0.3). Calculation: $(0.20 \times 0.7) + (0.80 \times 0.3) = 0.14 + 0.24 = 0.38$.

  ### Step 3.3: Authorization Threshold
  *   **Adjustment ≤ 0.10:** Duty Forecaster signs.
  *   **Adjustment > 0.10:** Duty Manager countersignature required.
  *   **Absolute Cap:** No probability may be published as 0.0 or 1.0 unless physical conditions dictate absolute certainty (see Case D).

  ## 4. LIMITATIONS AND BORROWED WARRANT
  **The Gap:** This procedure treats the model output *as if* it were the objective chance of flooding. It is not. It is an estimate. 
  **The Cost:** By treating the estimate as the chance, we accept that we may be systematically wrong if the model is poorly calibrated. 
  **The Borrowed Warrant:** We are borrowing the authority of the mathematical model to justify our public warnings. When we adjust the number, we are claiming that our specific physical evidence overrides the model's statistical authority. If we cannot prove the physical evidence is superior, we must defer to the model.

  **Unsettled Matters:** This procedure cannot resolve:
  1.  **Unprecedented Catchment States:** If the catchment is in a state never seen before (e.g., simultaneous dam failure and snowmelt), the model's chance is meaningless, but this procedure offers no formula for the new number. The Duty Manager must assume full liability.
  2.  **The Far Tail:** Probabilities below 0.01 or above 0.99 are statistically unstable. Adjustments here are judgment calls.
  3.  **Self-Referential Inputs:** If we must use the ensemble's own rainfall data to judge whether the ensemble is wrong, we cannot adjust. We lack independent verification.

  ## 5. TABLE OF ADJUSTMENTS
  *This table defines the boundary between legitimate correction and illegitimate second-guessing.*

  | **VALID REASONS (Adjustment Permitted)** | **INVALID REASONS (Adjustment Forbidden)** |
  | :--- | :--- |
  | **Input Data Failure:** A sensor providing input to the model is known to be faulty (e.g., iced, offline, transmitting zeros). <br>*(Why: The model calculated a chance based on a false physical premise.)* | **Historical Bias:** "The model under-called the last five events in this valley." <br>*(Why: This critiques the model's general design, not this specific run. It is not evidence about the current chance.)* |
  | **Physical Impossibility:** The gauge is already above the threshold, or the river is dry. <br>*(Why: The model's probability contradicts observed reality. The chance is effectively 0 or 1.)* | **Subjective Confidence:** "It feels like it will rain harder," or "I want to be more cautious." <br>*(Why: This substitutes personal feeling for objective evidence. It undermines the consistency of the warning system.)* |
  | **Confirmed Operational Change:** Written/telemetry confirmation of reservoir releases or diversion not in the model setup. <br>*(Why: The physical system rules have changed since the model ran.)* | **Unrecorded Verbal Intelligence:** Phone calls or informal messages about future operations not yet in the system. <br>*(Why: This is not auditable. It is knowledge of the future that cannot be verified by a reviewer.)* |
  | **Independent Verification:** A separate, non-model source (e.g., spotter report) confirms water levels contradicting the model. <br>*(Why: This is independent evidence of the current state, overriding the model's estimate.)* | **Regression to Mean:** "0.80 is too high, let's move it toward 0.50." <br>*(Why: This assumes the true chance is always average. It ignores the specific evidence that drove the model to 0.80.)* |

  ## 6. AUDIT LOG REQUIREMENTS
  *To ensure reconstructability, the following fields must be completed in the Decision Log for any adjustment:*
  1.  **Gauge ID:**
  2.  **Model Output:** (Original Probability)
  3.  **Published Output:** (Adjusted Probability)
  4.  **Reason Code:** (Must match Table in Section 5)
  5.  **Evidence Reference:** (Link to sensor log, email, or report justifying the adjustment)
  6.  **Weighting Factors:** (If applicable, e.g., "Model 0.7 / Spotter 0.3")
  7.  **Authorizing Manager:** (If adjustment > 0.10)

  ---

  ## 7. PROCEDURE WALKTHROUGH: CASE STUDIES
  *The following examples demonstrate the application of this procedure to real log entries.*

  ### Case (a): The Iced Raingauge
  *   **Input:** Ensemble returns 0.18. Principal upstream raingauge rimed over/under-reporting.
  *   **Triage:** Stop. Input data failure suspected.
  *   **Validity Test:** Matches **Valid Reason: Input Data Failure**. The model calculated probability based on rainfall that did not actually fall (or missed rainfall that did).
  *   **Calculation:** Model is compromised. We cannot use its number. We must estimate probability based on regional radar or surrounding gauges. 
      *   *Scenario:* Surrounding data suggests a probability of 0.65. 
      *   *Weighting:* Model is unreliable (Weight 0.0). Regional estimate (Weight 1.0). 
      *   *Math:* $0.18 \times 0.0 + 0.65 \times 1.0 = 0.65$.
  *   **Authorization:** Adjustment is $|0.65 - 0.18| = 0.47$. Requires **Duty Manager Countersignature**.
  *   **Verdict:** **Publish 0.65.** (Logged with sensor fault report).

  ### Case (b): The "Jumpy" Valley
  *   **Input:** Ensemble returns 0.30. Forecaster notes system under-called peak on last five comparable events. Wants to publish 0.55.
  *   **Triage:** Stop. Forecaster intends to adjust.
  *   **Validity Test:** Matches **Invalid Reason: Historical Bias**. The table explicitly forbids adjusting based on past model performance without new physical data. The model's "chance" estimate for *this* run is 0.30. Past errors are not evidence about *this* specific probability.
  *   **Calculation:** N/A. Adjustment not permitted.
  *   **Authorization:** N/A.
  *   **Verdict:** **Publish 0.30.** 
      *   *Note:* This verdict will be unpopular. It is required. If the model is systematically biased, the Model Development Team must recalibrate the engine. The Duty Forecaster is not authorized to patch systemic errors manually.

  ### Case (c): The Telephone Call
  *   **Input:** Duty Manager receives phone call: Reservoir operator intends controlled release at 18:00. Model does not include this.
  *   **Triage:** Stop. Potential Operational Change.
  *   **Validity Test:** Matches **Invalid Reason: Unrecorded Verbal Intelligence**. While a release changes the physics, a phone call is not auditable evidence. It is not in the inputs. It is knowledge of a future action not yet confirmed in the system.
  *   **Procedure:** Duty Manager must request written/telemetry confirmation from the operator. 
      *   *If confirmation arrives before broadcast:* Reclassify as **Valid Reason: Confirmed Operational Change**. Adjust.
      *   *If confirmation does not arrive:* Publish model number.
  *   **Verdict:** **Publish Model Number (for now).** 
      *   *Note:* Safety protocols may dictate issuing a separate text warning, but the *probability figure* in the main broadcast must remain auditable. We cannot adjust the statistical probability based on an unrecorded conversation.

  ### Case (d): The Overtopped Gauge
  *   **Input:** Gauge has already risen 40cm above threshold. Ensemble returns 0.45 for "exceedance in next 24 hours."
  *   **Triage:** Stop. Physical Impossibility.
  *   **Validity Test:** Matches **Valid Reason: Physical Impossibility**. The event has already occurred. The probability of it occurring in the next 24 hours is effectively 1.0 (certainty), as the threshold is already breached.
  *   **Calculation:** Model is physically contradicted. 
      *   *Math:* Set to 0.99 (System cap for non-absolute certainty) or 1.0 if procedure allows absolute. Let us use 0.99 to allow for sensor error.
  *   **Authorization:** Adjustment is $|0.99 - 0.45| = 0.54$. Requires **Duty Manager Countersignature**.
  *   **Verdict:** **Publish 0.99.**

  ---

  ## 8. JUDGMENT CALLS AND UNDECIDABLES
  *The following points are marked as Judgment Calls. An auditor cannot verify these mathematically, only procedurally.*

  1.  **Weighting Factors (Step 3.2):** The assignment of weights (e.g., 0.7 vs 0.3) is a judgment call. 
      *   *Constraint:* You must record *why* the weight was chosen in the Evidence Reference field (e.g., "Sensor A has 99% uptime, Sensor B is manual").
  2.  **Input Failure Severity (Case A):** Deciding whether an iced gauge invalidates the *entire* model run or just requires a minor tweak is a judgment call. 
      *   *Constraint:* If the iced gauge contributes >20% of the catchment input data, the model run is considered void (Weight 0.0).
  3.  **The "Far Tail" (Limitations):** If the model returns 0.001 and you adjust to 0.05, the relative change is huge, but the absolute change is small. 
      *   *Constraint:* This procedure treats absolute difference (>0.10) as the trigger for Manager sign-off, regardless of relative scale.

  **Final Instruction:** If you encounter a situation not covered by the Valid Reasons table, and it does not fit the Limitations section, you must default to the Model Output. It is better to publish a potentially inaccurate number with a defensible procedure than an accurate number with no audit trail.
