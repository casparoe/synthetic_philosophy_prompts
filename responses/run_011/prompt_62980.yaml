answer: |-
  At the AutoForm hydraulic press station, effect E is the snapping of a calibrated shear pin, a physical fracture releasing pressure. In Episode 1, E occurs when a voltage surge drives the motor to 110% capacity, generating molecular stress pattern L1 in the pin's crystal lattice sufficient to break bonds. In Episode 2, E occurs when a misaligned workpiece creates mechanical resistance, generating distinct molecular stress pattern L2, also sufficient to break bonds. Both L1 and L2 realize the higher-level functional property H: "Torque Exceeding Safety Threshold." H is defined not by the specific stress distribution but by the role of surpassing the pin's shear strength. The physical causal story for E is complete at the level of molecular bond stress (L); once L1 or L2 obtains, the fracture is physically determined. Maintenance Engineer Chen cannot target L1 or L2 specifically, as voltage surges and misalignments are unpredictable and physically heterogeneous. Instead, she installs a torque limiter set to trigger below H. This intervention reduces E's incidence across both episode types without holding L constant. The limiter works by preventing the realization of H, regardless of which L-token attempts to realize it.

  The case puts the Exclusion Principle under pressure by raising the price of holding it.

  (a) The first premise, Causal Closure, states that every physical effect like E has a sufficient physical cause found within the lower-level configuration L. The second premise, the Exclusion Principle, states that no effect can have more than one sufficient cause at a given time unless it is a genuine case of causal overdetermination. The third premise, Distinctness, states that the higher-level property H is not identical to the lower-level realizer L, meaning they are separate candidate causes for E.

  (b) The argument delivers the verdict that H is causally inert. Since L is sufficient for E by Closure, and H is distinct from L by Distinctness, counting H as a sufficient cause alongside L would violate Exclusion. Because the scenario is not one of systematic overdetermination, H must be excluded from the causal story, rendering it epiphenomenal despite its role in the engineering practice.

  (c) The case puts the Exclusion Principle under pressure. It does not refute the principle logically, but it makes it costly to hold because accepting the verdict requires dismissing the successful interventionist practice of the engineer as causally illusory. Denying H's causal efficacy contradicts the observable fact that targeting H specifically reduces E across variable physical realizations.

  (d) The defender's best rediagnosis is Causal Inheritance. She argues that H possesses causal efficacy only in virtue of L possessing it; H does not compete with L as a separate sufficient cause but inherits its causal power. This preserves the Exclusion Principle by denying that H and L are independent competitors, allowing the engineer's success to be described as manipulating L via its functional description H without granting H ontological independence.

  (e) The single feature doing the work is the successful intervention on H across variable L-realizations. Once this feature is removed—such that the engineer must target specific L-tokens to prevent E—the pressure vanishes, and H reverts to a mere descriptive summary with no independent causal leverage.

  (f) A nonreductive physicalist can transfer the result back to the mental case, using the engineering success to model how mental properties can be causally relevant without violating physical closure. The most promising disanalogy she would have to overcome is the precision of the functional definition; unlike "Torque Threshold," mental properties may lack the crisp realization conditions required to ensure the lower-level physical story is genuinely complete.
