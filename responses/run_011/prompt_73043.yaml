answer: |-
  ### Part 1: Classification

  Your structure most closely resembles a **Stag Hunt** (also known as an Assurance Game). In a standard Prisoner's Dilemma, players prefer to defect regardless of what others do; in your setup (Feature 1), everyone prefers mutual restraint, provided others comply. This makes it a coordination problem rather than a pure incentive problem.

  However, the resemblance breaks down at **Feature 3 (Epistemic Disagreement)** and **Feature 4 (Exit Opacity)**. Standard game theory assumes **Common Knowledge**: all players know the rules, the payoffs, and that everyone else knows them. Your firms disagree on whether the trap exists (Feature 3), creating a **Hypergame** (where players play different games simultaneously). Furthermore, Feature 4 prevents the **Repeated Game** solution, where cooperation is sustained by the threat of future punishment, because a defector can exit and hide their extraction. You are not in a standard trap; you are in a contested narrative about whether a trap exists, compounded by an inability to verify compliance.

  ### Part 2: The Decision Tree

  Below is a logical instrument to sort positions. Each node is a binary question derived from your setup. Follow the answers to reach a leaf.

  **Node 1:** Is the primary barrier to restraint physical (scarcity/technology) or social (trust/knowledge)?
  **Node 2:** (If Physical) Can technology make restraint cheap or substitutes abundant?
  **Node 3:** (If Physical/No) Is the scarcity an objective fact or a contestable belief?
  **Node 4:** (If Social) Is the trap constituted primarily by the disagreement about whether it exists?
  **Node 5:** (If Social/No) Can the players' desires be altered by persuasion rather than force?
  **Node 6:** (If Fixed Desires) Must the enforcing power come from outside the consortium?
  **Node 7:** (If Outside) Is the enforcer a sovereign authority or a single dominant firm?
  **Node 8:** (If Inside) Can a subset of firms act effectively without the whole?
  **Node 9:** (If Whole Group) Can the group verify compliance despite exit opacity?
  **Node 10:** (If Verifiable) Does stability require escalated sanctions, or does repetition suffice?

  *(Note: To meet the 6-9 node constraint while covering all leaves, Nodes 9 and 10 are logically combined in the leaves below based on the verification capacity.)*

  **The Leaves**

  1.  **The Cornucopian (Technology)**
      *   *Path:* Physical → Yes (Node 2).
      *   *Awkward Commitment:* Must argue that innovation is inevitable despite the consortium's current ruinous costs.
      *   *Tell:* Circulates diagrams of prototype substitutes rather than extraction schedules.

  2.  **The Decisionist (Deflationary)**
      *   *Path:* Physical → No → Contestable Belief (Node 3).
      *   *Awkward Commitment:* Must treat the resource's collapse as a series of unrelated choices rather than a systemic failure.
      *   *Tell:* Refuses to sign any document labeled "Agreement," preferring individual memos of intent.

  3.  **The Hypergame Resolver (Epistemic)**
      *   *Path:* Social → Yes (Node 4).
      *   *Awkward Commitment:* Must prioritize truth-seeking over resource-saving, risking delay while arguing models.
      *   *Tell:* Opens every meeting by demanding access to the raw data behind the consortium's models.

  4.  **The Preference Shaper (Change Desires)**
      *   *Path:* Social → No → Yes (Node 5).
      *   *Awkward Commitment:* Must assume corporate cultures can be morally persuaded despite fiduciary duties.
      *   *Tell:* Speaks exclusively in terms of "legacy" and "industry reputation" rather than cost-benefit.

  5.  **The Leviathan (Sovereign)**
      *   *Path:* Fixed Desires → Outside → Sovereign (Node 7).
      *   *Awkward Commitment:* Must invite a regulator who may punish the innocent along with the guilty.
      *   *Tell:* Drafts clauses inviting third-party audit rights before discussing extraction limits.

  6.  **The Hegemon (Dominant Actor)**
      *   *Path:* Fixed Desires → Outside → Dominant Firm (Node 7).
      *   *Awkward Commitment:* Requires one firm to accept short-term ruin for long-term market control.
      *   *Tell:* The largest firm's representative speaks first and sets the agenda unilaterally.

  7.  **The Club Theorist (Subgroup)**
      *   *Path:* Fixed Desires → Inside → Yes (Node 8).
      *   *Awkward Commitment:* Must accept that excluding members may accelerate the resource's decline outside the club.
      *   *Tell:* Proposes a "side agreement" circulated only to three specific attendees.

  8.  **The Institution Builder (Self-Governing)**
      *   *Path:* Fixed Desires → Inside → No → Sanctions (Node 9/10).
      *   *Awkward Commitment:* Must design penalties severe enough to deter exit, despite exit opacity.
      *   *Tell:* Brings a draft charter defining expulsion conditions to the first meeting.

  9.  **The Reciprocator (Repeated Interaction)**
      *   *Path:* Fixed Desires → Inside → No → Repetition (Node 9/10).
      *   *Awkward Commitment:* Must trust that exit opacity will not be exploited by a defector hiding their draw.
      *   *Tell:* Proposes a rolling seasonal review rather than a fixed contract.

  ### Part 3: Walking the Space

  **Empty Cells**
  There is a significant empty cell at **Outside Authority + Mutable Desires**. This position is **unattractive**. If you can persuade firms to *want* restraint (Preference Shaper), invoking a sovereign power (Leviathan) is redundant and costly. A character holding this view would be inconsistent, demanding regulation while simultaneously giving speeches on moral duty. They would likely be a bureaucrat trying to justify their own existence.

  There is another empty cell at **Subset Act + Exit Opacity Ignored**. This position is **incoherent**. If a club forms (Club Theorist) but cannot monitor members due to Feature 4, the club collapses. A character attempting this would propose a side agreement without verification mechanisms. They are destined to be the victim of the plot.

  **Indistinguishable Leaves**
  You asked specifically about **The Cornucopian (Technology)** and **The Preference Shaper (Change Desires)**. The tree separates them at Node 1 (Physical vs. Social), but in practice, they collapse into a single **Undifferentiated Optimism**. Both argue the trap is solvable without painful coercion. In a meeting, both might smile too much and talk about "win-win scenarios." To distinguish them, you must emphasize the *locus* of change: the Technologist points to machinery; the Shaper points to minds.

  The **Hypergame Resolver** and the **Decisionist** are also dangerously close. Both claim the trap is mental. The distinction is that the Resolver believes the disagreement is a *barrier* to be solved (the trap is real because we think it is), while the Decisionist believes the trap is *illusory* (there is no barrier, only choices). In prose, the Resolver asks for data; the Decisionist asks for decisions.

  **Unexplored Cell (Character Opportunity)**
  The most interesting unexplored cell is **Inside Authority + Unverifiable Compliance + No Sanctions**. This is a position of **Radical Trust**. It argues that because exit is costly (Feature 4), the cost itself acts as the sanction, making monitoring unnecessary. No named theorist defends this; it is a gamble. A character here would refuse to draft penalties, arguing that the cost of exit is punishment enough. They are either a visionary or a fool. This is a high-value role for a protagonist or a tragic antagonist.

  ### Part 4: Epistemic Request

  **Confidence Level:** Moderate.
  The tree successfully maps the logical space of your specific constraints, but game theory is not a perfect physics for human behavior.

  **Weakest Branch:** Node 4 ("Is the trap constituted by the disagreement?"). This separates the **Hypergame Resolver** from the **Preference Shaper**. In reality, epistemic disagreement often masks preference divergence (firms claim they don't believe the model because they don't *want* to). A specialist might argue these leaves are the same position viewed through different lenses.

  **Riskiest Attribution:** **The Institution Builder (Self-Governing)** is labeled with the spirit of Elinor Ostrom. Specialists might correct that Ostrom's work applies to communities with long-standing social norms, not consortia of rival firms. However, the structural logic (monitoring + escalated sanctions) remains hers.

  **Assessment of Feature 3 (The Wrinkle):** This is a **genuine complication**, not a restatement. Standard "Incomplete Information" games assume players know they lack information. Your firms disagree on *what* the game is (Hypergame). The literature often treats this as a preliminary to be solved before the "real" game begins. Your setup correctly identifies that resolving the disagreement *is* the game. This is a sophisticated insight; do not let an editor convince you it is merely "uncertainty." It is the core tension.
