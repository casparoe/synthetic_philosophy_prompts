      *   Did I apply Parfit's specific view? Yes (R-relation vs. Identity).

  7.  (Mental Check): Ensure I don't get bogged down in AI ethics generally, but stay focused on the *metaphysics of personhood* implied by the settings. The prompt asks about "what a person is" and "what survival consists in."

