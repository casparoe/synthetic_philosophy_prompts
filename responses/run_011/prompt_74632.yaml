      *   *The Unfalsifiability Point:* This needs nuance. If "understanding" is defined as "no errors," it's unfalsifiable. If defined as "error rate below threshold X on dataset Y," it's falsifiable. The Lead assumes the latter; the User implies the former (or a different dataset).

