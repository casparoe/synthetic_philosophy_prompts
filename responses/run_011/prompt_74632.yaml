      *   *The "Understanding" Label:* It's a proxy for "Robustness to Distribution Shift."
      *   *Unfalsifiability:* The Lead's charge is partially correct but misdiagnosed. It's not that the claim is unfalsifiable, it's that the *falsification conditions* differ.

