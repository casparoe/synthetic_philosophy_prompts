  11. **Final Polish:** Ensure the distinction between "competence" (knowledge) and "performance" (execution) is clear, as that maps well to the ML vs. Localizer divide. (Decided to keep it more practical: "Distribution vs. Instance").

  *(Self-Correction on "Unfalsifiability"):* I need to be careful. The Lead says the *critique* is unfalsifiable. I need to argue that the critique is falsifiable *if* we define the failure state structurally rather than anecdotally.

