      *   **Output Requirements:**
          1.  Identify genuine tensions/conflicts (ranked by severity).
          2.  Identify apparent conflicts that dissolve upon precision.
          3.  For real tensions: What must give? Cheapest revision? Cost of revision?
          4.  Identify the single change that repairs the most damage.
          5.  Identify any claims that aren't actually Mencian or Xunzian (mislabeled).
      *   **Tone:** Rigorous, analytical, supportive but critical (preparing for an "attack"), respectful of the student's sophistication.

  2.  **Analyze the Eight Claims:**

      *   (a) *Mencius Teleological:* Human nature is good *teleologically* (sprouts $\rightarrow$ virtues under normal conditions). Not descriptive of current behavior.
      *   (b) *Xunzi Descriptive:* Human nature is bad *descriptively* (untrained people behave badly). Accepted as empirically true.
      *   (c) *Education External:* Moral education works through external practice, ritual, correction (Xunzian method). Sprouts can't be argued into existence.
      *   (d) *Motivation Internal:* External training needs internal motivation (sprouts) to work. Otherwise, it's just compliance, not virtue (Mencian constraint on Xunzian method).
      *   (e) *Sagehood Universal:* Sages aren't a different species. First sages used the same nature everyone has. (Standard Confucian assumption, fits both).
      *   (f) *Sprouts Unreliable:* Sprouts are parochial (bias toward kin/proximity). Need impartial rules/institutions to override them. (Leanings towards Legalism or modern liberalism, critiques Mencius).
      *   (g) *Psychopath Case:* Feeling nothing at the well = missing something constitutive (Mencius). BUT psychopath isn't less human, and we don't blame for lack of capacity. (Nuanced view on "humanity" and blame).
      *   (h) *Withering/Blame:* Adults are blameworthy when sprouts wither. Both forcing (Gaozi/Mencius story) and neglecting are faults. (Moral responsibility for cultivation).

  3.  **Identify Tensions/Conflicts (Brainstorming):**

      *   *(a) vs. (b):* Can nature be *both* teleologically good and descriptively bad? Yes, this is a standard synthesis (e.g., Kwong-loi Shun), but needs care. If "nature" means the *starting point* in (b) but the *endpoint potential* in (a), is it the same "nature"?
      *   *(c) vs. (d):* (c) says education is chiefly external/practice. (d) says external stuff doesn't work without internal sprouts. This is a tension between *method* and *condition of possibility*. It's actually a synthesis, but is it stable? If sprouts are needed (d), is education *chiefly* external (c)? Or is it chiefly nurturing internal things via external means?
      *   *(a) vs. (f):* (a) says normal development of sprouts *is* virtue. (f) says sprouts lead to parochialism and need to be *overridden* by rules. If sprouts need overriding, is their "normal development" actually virtue? This is a major conflict. Mencius thinks sprouts *are* the source of impartial care (extended). (f) rejects this extension.
      *   *(d) vs. (f):* (d) says we need sprouts for motivation to submit to training. (f) says we need rules to override sprouts. So we need sprouts to motivate us to suppress sprouts? That's psychologically complex but possible (using the sprout of shame to override the sprout of commiseration?).
      *   *(g) vs. (h):* (g) says psychopaths (no sprouts) aren't blameworthy for lack of capacity. (h) says ordinary adults *are* blameworthy when sprouts wither. This seems consistent (capacity vs. cultivation), but the definition of "human" in (g) wobbles. If feeling nothing is "missing something constitutive," how are they fully human?
      *   *(c) vs. (a):* (a) says normal development is unforced (like trees on Ox Mountain). (c) says education is correction, imitation, repeated training (Xunzian straightening of crooked wood). "Unforced" vs. "Correction." This is the classic Mencius-Xunzi clash.

  4.  **Ranking the Tensions:**

      *   *Severity 1 (Critical):* **(a) vs. (f).** If sprouts naturally develop into virtue (a), why do they need to be overridden by impartial rules (f)? Mencius believes the sprout of commiseration *extends* to strangers. (f) denies this natural extension, requiring external structures. This undermines the "goodness" of the nature in (a).
      *   *Severity 2 (High):* **(a) vs. (c).** "Normal, unforced development" (a) vs. "Practice and correction from outside... repeatedly" (c). Mencius uses agricultural metaphors (nurturing); Xunzi uses craft metaphors (straightening). You can't easily have it both ways without redefining "unforced."
      *   *Severity 3 (Moderate):* **(d) vs. (c).** If motivation must come from inside (d), can we say education works *chiefly* through outside (c)? It suggests a dependency that makes "chiefly external" misleading.
      *   *Severity 4 (Low/Dissolvable):* **(a) vs. (b).** Teleological vs. Descriptive. This is a standard interpretive move to reconcile the two.
      *   *Severity 5 (Low/Dissolvable):* **(g) vs. (h).** Capacity vs. Effort. Standard distinction.

  5.  **Drafting the Audit (Iterative Process):**

      *   *Introduction:* Acknowledge the sophistication. This is a very strong high school level position (synthetic).
      *   *Section 1: Genuine Tensions (Ranked).*
          *   Focus on (a) vs. (f) as the biggest problem. It attacks the core of Mencian optimism.
          *   Focus on (a) vs. (c). The metaphor clash (Agriculture vs. Craft).
          *   Focus on (d) vs. (c). The locus of agency.
      *   *Section 2: Apparent Conflicts.*
          *   (a) vs. (b) is manageable (Potentiality vs. Actuality).
          *   (g) vs. (h) is manageable (Constitution vs. Cultivation).
      *   *Section 3: Revisions.*
          *   For (a)/(f): Revise (a). Admit sprouts are *raw material* but not sufficient for *impartial* virtue. This moves closer to a "Weak Mencius" or Neo-Confucian view.
          *   For (a)/(c): Revise (a)'s "unforced." Cultivation is active, not just "leaving alone."
      *   *Section 4: The Single Change.*
          *   Modify (a). Change "normal, unforced development... just is the four virtues" to "sprouts are necessary but insufficient raw material." This saves (f) and (c) without breaking (d).
      *   *Section 5: Mislabeled Positions.*
          *   (f) is the outlier. It sounds like Legalism (Han Fei) or Modern Liberalism (Rawlsian institutions), not classical Confucianism. Mencius believes extension (*tui*) works. Xunzi believes ritual transforms. (f) believes rules *override*.
          *   (g) has a modern legal/moral responsibility flavor ("capacities they never had") that isn't quite classical.

  6.  **Refining the Analysis (Self-Correction during drafting):**

      *   *Wait, check (a) again.* "Normal, unforced development." Mencius does say we need to *cultivate* (nurturing), not just ignore. The "Ox Mountain" metaphor is about *destruction* preventing growth, not that growth happens without *any* care. But (c) emphasizes "correction from outside." Mencius thinks the *source* is inside. Xunzi thinks the *source* is outside (Sage Kings).
      *   *Check (f) again.* "Impartial rules... to override." This is definitely the biggest wedge. If you need to override the sprouts, the sprouts aren't "good" in the sense of leading to the *right* outcome without intervention.
      *   *Check (g).* "Constitutive of being human." Mencius says if you lack the four hearts, you are not human (*fei ren ye*). The student says psychopath is "not thereby less human." This is a direct contradiction of Mencius's text, though morally defensible today. I need to point this out as a departure from Mencius, not necessarily an inconsistency within the student's own system, but it weakens the claim of "accepting Mencius's thesis."

  7.  **Finalizing the Structure:**

      *   **Executive Summary:** Strong synthesis, but specific friction points.
      *   **Tier 1: Structural Contradictions (The "Fatal" Flaws).** (a) vs (f) and (a) vs (c).
      *   **Tier 2: Friction Points (Manageable but costly).** (c) vs (d).
      *   **Tier 3: Illusory Conflicts.** (a) vs (b), (g) vs (h).
      *   **The "Mislabeled" Check.** (f) is the big one.
      *   **The Single Fix.** Adjusting (a).

  8.  **Tone Check:** Ensure I'm not doing the work for them, but arming them. Use philosophical terminology (teleological, normative, descriptive, extension, cultivation) appropriate for a senior seminar.

  9.  **Final Polish:** Check against the prompt requirements.
      *   Ranked by severity? Yes.
      *   Dissolving conflicts? Yes.
      *   Revisions + Costs? Yes.
      *   Single change? Yes.
      *   Mislabeled? Yes.

      *(Self-Correction on (g))*: The prompt asks about consistency *within the package*. (g) says "missing something constitutive" BUT "not less human." This is internally contradictory unless "constitutive of being human" is metaphorical. I need to flag this internal tension too.

      *(Refining the "Single Change")*: If I change (a) to say sprouts are *inclinations* not *guarantees*, does it fix (f)? Yes. Does it fix (c)? Yes. Does it break (d)? No, (d) still holds (need inclination for motivation). This is the leverage point.

      *(Refining "Mislabeled")*: (f) is definitely not Mencius (who trusts extension) nor Xunzi (who trusts Ritual transformation, not just impartial rules/institutions in the modern sense). It's closer to Legalism or Kantianism.

