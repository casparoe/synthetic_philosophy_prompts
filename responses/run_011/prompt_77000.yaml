  ### The Guilt Matrix (0–10 Ratings)

  Here are the ratings based on a strict application of Jaspers' definitions to your three cases.

  | Category | Case (A) <br> Colonial Legacy | Case (B) <br> Regime Overthrow | Case (C) <br> Bystander / No Capacity | **Range** <br> (Discrimination) |
  | :--- | :---: | :---: | :---: | :---: |
  | **Criminal** | 0 | 0 | 0 | **0** |
  | **Political** | 7 | 8 | 0 | **8** |
  | **Moral** | 4 | 1 | 1 | **3** |
  | **Metaphysical** | 6 | 5 | 3 | **3** |

  ***

  ### Ranking by Discriminating Work

  1.  **Political Guilt (Range: 8)**
      *   **Why:** This category does the heaviest lifting. It sharply distinguishes between those inside the structure of the state (A & B) and those outside it (C). It also captures the nuance between passive citizenship (A) and active succession of state institutions (B). It is the only category that successfully handles *structural* continuity independent of individual intent.
  2.  **Metaphysical Guilt (Range: 3)**
      *   **Why:** It moves, but sluggishly. It registers a baseline "human solidarity" debt in Case (C), increases for survival in (B), and peaks where survival is coupled with material benefit from the dead in (A). However, because it applies to *all* humans to some degree, it functions more as a background hum than a sharp diagnostic tool.
  3.  **Moral Guilt (Range: 3)**
      *   **Why:** It distinguishes the passive beneficiary (A) from the resistor (B) and the uninvolved (C). However, it risks collapsing into subjectivity. In Case (A), a citizen with a "clear conscience" rates a 0, while an introspective one rates a 4. Because it relies on individual self-judgment, it is less stable as a categorical tool for comparing groups.
  4.  **Criminal Guilt (Range: 0)**
      *   **Why:** It is flatline. In all three intergenerational/structural cases, no present-day citizen committed a prosecutable act.

  ***

  ### Analysis: Redundancy and Utility

  **1. The Redundant Category: Criminal Guilt**
  In the context of historical, structural, or intergenerational injustice, **Criminal Guilt is functionally redundant.** Jaspers designed this category for the Nuremberg Trials—it is binary (guilty/not guilty) and strictly individual.
  *   **Why it fails here:** It cannot process "benefit without action" (Case A) or "state continuity without personal culpability" (Case B). It returns a null value for any scenario where the perpetrators are dead or the present generation did not personally pull the trigger. It decorates the scheme with legal rigor but contributes no analytical power to these specific cases.

  **2. The Heavy Lifter: Political Guilt**
  **Political Guilt earns its place as the primary engine of the scheme.** It is the only category that successfully isolates *citizenship* and *state continuity* from *personal morality*.
  *   **Why it works:** It explains why citizens in Case (B) still owe reparations or inherit treaties even though they fought the regime. It explains why citizens in Case (A) bear liability for colonial debt even if they are immigrants who arrived post-independence. It separates the *institution* (which persists) from the *individual* (who changes). Without this category, you cannot distinguish between a Bystander (C) and a Beneficiary (A) who personally did nothing wrong.

  **3. The Blurred Categories: Moral vs. Metaphysical**
  These two categories overlap significantly in this stress test, suggesting they may be doing the same work under different names.
  *   **The Overlap:** In Case (A), Moral guilt (my attitude toward the benefit) and Metaphysical guilt (my solidarity with the exploited) both rate highly for the same reason: I am alive and well-off because others suffered.
  *   **The Distinction:** Moral guilt is internal (conscience); Metaphysical guilt is ontological (the state of being human). However, in practice, distinguishing a "failure of conscience" from a "failure of solidarity" is difficult.
  *   **Verdict:** Metaphysical guilt is the more radical concept (it implicates everyone simply for surviving), but Moral guilt is more actionable (it demands introspection). If one were to cut a category to streamline the scheme for political theory, **Metaphysical** is the candidate for removal. It risks becoming a theological catch-all that implicates everyone equally, thereby distinguishing nothing. Moral guilt, while subjective, at least ties responsibility to specific *attitudes* and *conduct* regarding the event.

  ### Conclusion
  Jaspers' scheme **does not earn all four parts** equally in this context.
  *   **Criminal** is irrelevant for structural history.
  *   **Metaphysical** is too diffuse to discriminate sharply.
  *   **Moral** is useful but subjective.
  *   **Political** is the only category robust enough to handle the complexity of state continuity, inheritance, and collective liability without requiring personal sin.

  If you are using this framework to analyze modern historical injustice, **Political Guilt** is doing 80% of the work. The other three serve mostly to clarify what the present citizens are *not* guilty of (Criminal), how they should *feel* about it (Moral), and the philosophical cost of their survival (Metaphysical).
