      *(Refining the Scorecard):* Keep it tight. Pass/Fail/Partial.

  11. **Final Polish:** Ensure the distinction between "Non-negotiable" (functional/logical necessity) and "Contested" (normative preference) is clear. For instance, "Status Neutrality" is contested because some argue existing members *should* have privilege. "Tractability" is non-negotiable for a court.

