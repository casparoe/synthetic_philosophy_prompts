answer: |-
  ### Desiderata for a Non-Ideal Boundary Principle

  The following specifications are designed for a decision-making body (court or commission) operating under non-ideal conditions: limited information, time pressure, and the need for a binding, enforceable ruling. They are not abstract moral ideals but functional constraints for a working democratic procedure.

  **1. Logical Priority (Non-Circularity)**
  *   **Case:** The principle used to define the electorate cannot presuppose the existence or boundaries of the electorate it is defining. A rule that says "the citizens of the city decide" fails if the question is "who counts as a citizen of the city."
  *   **Status:** **Non-negotiable.** Without this, the boundary problem is begged, not solved.

  **2. Ex Ante Determinacy**
  *   **Case:** The list of eligible voters must be finalizable *before* the substantive decision is made. If the electorate shifts depending on the outcome (e.g., "if we build the plant, the workers become voters"), the vote is rigged by the outcome it seeks to determine.
  *   **Status:** **Non-negotiable.** Procedural fairness requires the rules of the game be fixed before play begins.

  **3. Finite Delimitation**
  *   **Case:** The principle must provide a cutoff point that excludes some portion of the global population. A principle that implies "everyone potentially affected by global supply chains" absorbs the whole world into every local question, rendering decision-making impossible.
  *   **Status:** **Non-negotiable.** A *demos* that equals humanity is no *demos* at all; it is paralysis.

  **4. Impact Sensitivity**
  *   **Case:** The principle must grant standing to those whose vital interests are materially altered by the decision, even if they lack prior legal status. In the waste facility case, a neighbor just across the border may suffer more than a city resident on the opposite side.
  *   **Status:** **Contested.** While normatively powerful, some camps (e.g., strict contractualists) argue that only pre-existing obligations matter. However, for a principle to gain legitimacy among the governed, this is highly weighted.

  **5. Administrative Tractability**
  *   **Case:** Officials must be able to apply the principle using available evidence within a reasonable timeframe. It cannot require omniscience, complex counterfactual modeling, or infinite inquiry.
  *   **Status:** **Non-negotiable (for non-ideal theory).** A principle that requires a year of study to define the voters for a month-long decision process is a failure of design.

  **6. Temporal Consistency**
  *   **Case:** The principle must distinguish between actual future persons (e.g., contracted buyers) and merely possible persons (e.g., those who *might* move if the plant is built). It cannot grant votes to mere possibilities, nor can it ignore those with settled expectations of residence.
  *   **Status:** **Non-negotiable.** Granting votes to "possible" residents invites strategic manipulation (e.g., promising to move to sway a vote).

  ***

  ### The Incompatibility Finding

  There is a structural incoherence within this set of desiderata when applied to **endogenous decisions** (where the constituency is a function of the outcome).

  **The Trilemma:** You cannot jointly satisfy **Ex Ante Determinacy (2)**, **Impact Sensitivity (4)**, and **Administrative Tractability (5)** in cases where affectedness depends on the decision.

  *   To satisfy **Impact Sensitivity**, you must identify everyone who will be burdened/benefited.
  *   In the waste facility case, who is burdened depends on *where* the facility is sited (the decision itself).
  *   To satisfy **Ex Ante Determinacy**, you must fix the voter list before the site is chosen.
  *   To satisfy **Administrative Tractability**, you cannot run a full simulation of both outcomes to see who gets hurt before you hold the vote.

  **Conclusion:** In non-ideal theory, **Impact Sensitivity must be sacrificed to Ex Ante Determinacy and Tractability.** A court cannot wait to see who is affected to decide who votes, because knowing who is affected requires making the decision. Therefore, any adequate principle must accept that some materially affected persons will be excluded from the *ex ante* electorate to preserve the possibility of a decision. A principle that claims to satisfy all three is papering over the impossibility of the task.

  ***

  ### The Single Eliminator

  **Administrative Tractability under Uncertainty.**

  This requirement eliminates the most candidates because almost all theoretical solutions are derived from ideal theory. They assume we can know "interests" or "subjection" as metaphysical facts. In a real courtroom or commission, "interest" is a matter of evidence, prediction, and dispute. Any principle that requires officials to adjudicate the *degree* of affectedness for every potential voter before the election (e.g., "only those whose property value drops by >5%") creates a litigation bottleneck that stops the democratic process. It eliminates most nuanced versions of the "All Affected Interests" principle.

  ***

  ### Scorecard of Familiar Contenders

  | Principle | Logical Priority | Ex Ante Determinacy | Finite Delimitation | Impact Sensitivity | Admin Tractability | Temporal Consistency | Verdict |
  | :--- | :---: | :---: | :---: | :---: | :---: | :---: | :--- |
  | **All Affected Interests (AAI)** | ❌ | ❌ | ⚠️ | ✅ | ❌ | ❌ | **Fails.** Collapses on Endogeneity. Cannot fix the list *ex ante* without knowing the outcome. Fails Tractability (requires predicting the future). |
  | **All Subject to Coercion (ASC)** | ✅ | ✅ | ✅ | ⚠️ | ✅ | ⚠️ | **Partial.** Good for laws, bad for specific sites. Future residents are not yet "subject" to coercion, failing Temporal Consistency in endogenous cases. |
  | **Membership / Citizenship (ACS)** | ✅ | ✅ | ✅ | ❌ | ✅ | ✅ | **Pass (Procedurally).** Meets all non-negotiables. Fails Impact Sensitivity (excludes affected outsiders), but this is the price of Decidability. |

  **Summary:** The **Membership** principle is the only one that satisfies the non-negotiable constraints of non-ideal theory, though it does so by accepting a legitimacy deficit regarding outsiders (Impact Sensitivity). The **Interest** principle is normatively superior but operationally incoherent for endogenous decisions. The **Subjection** principle sits in between but falters on the status of future residents.
