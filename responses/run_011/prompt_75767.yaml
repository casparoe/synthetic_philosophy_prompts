  **Bottom line**

  We should fund, in order: (1) The Normative Authority of Interpretive Mandates, because it determines whether the transcript's unique meta-instructions bind future decision-makers at all. (2) The Weight of Impaired Disavowal, because it resolves the conflict when a current patient rejects their past recorded self. (3) The Applicability Threshold of High-Fidelity Instructions, because it prevents detailed transcripts from becoming practically useless in novel clinical scenarios. This ranking follows the dependency structure: we must establish the transcript's authority before weighing conflicts over its content, and we must resolve authority conflicts before optimizing application guidelines. Funding this sequence ensures that subsequent practical frameworks rest on a settled conceptual foundation rather than ad hoc compromises that risk ethical inconsistency.

  **What the transcript changes, and what it does not**

  Camp One is incorrect: enhancing epistemic access to past wishes does not solve the normative problem of why those wishes should bind a self that may no longer exist or care. More data does not create obligation. Camp Two is correct on the distinction but underestimates the artifact's novelty. The transcript does not merely report substantive wishes; it asserts procedural authority by dictating how it must be read. This shifts the debate from standard precedent autonomy to the legitimacy of self-binding meta-rules. The transcript changes the evidentiary landscape by providing rich context, but it does not change the fundamental ethical requirement to justify overriding a present experiencer's indifference or suffering. The core task is not validating the data but determining whether a past self can legislate the interpretation of their own future incapacity. We must separate the clarity of the message from the authority of the messenger, recognizing that better evidence of past desire does not automatically silence present distress. Consequently, the review panel must recognize that better evidence does not equal ethical permission. The transcript amplifies the voice of the past self, but volume does not confer right. We must determine if the microphone itself was legitimately handed over.

  **The shortlist, ranked**

  **Question 1: Can a competent self bind successors to specific rules of interpretation?** This asks whether meta-instructions (e.g., "ignore this if I seem happy") carry normative force independent of the substantive wishes they govern. This is strictly upstream of all other questions: if meta-instructions lack authority, the transcript reverts to a standard advance directive, rendering the extra detail normatively inert and collapsing the project into existing debates. It is highly tractable for philosophers using contract theory and autonomy frameworks without needing clinical data, as it concerns the logic of commitment rather than medical outcomes. A successful result provides a robust test for when interpretive mandates are valid, distinguishing binding rules from mere advice or hopeful expression. This gives courts a principled way to separate procedural commands from substantive preferences. Even if the project fails to find a universal principle, a taxonomy of valid versus invalid meta-instructions would prevent courts from treating all transcript clauses as equally binding, reducing legal uncertainty. This work clarifies whether the transcript is a command or a conversation, a distinction that dictates whether clinicians must obey or merely consider the recorded rules. Without this, any guidance on application is premature, as we cannot know if the rules for application themselves hold water. The salvage value lies in defining the limits of precedent autonomy, which applies beyond dementia to any longitudinal care plan. This ensures funding targets the root of the authority problem.

  **Question 2: What normative weight should be given to impaired disavowal of past values?** This addresses the empirical finding that patients sometimes disown or are indifferent to their recorded selves, creating a direct conflict between past authority and present experience. It depends on Question 1: if the past self's meta-instructions forbid honoring current disavowal, we need a compelling theory to override them, making this the second logical step. It is tractable via well-being versus autonomy analyses within three years, leveraging existing literature on critical interests versus experiential interests without requiring new patient data. Success looks like a weighting framework for clinicians to balance past authority against present experiential interests, specifically addressing the "indifferent" middle ground where neither distress nor endorsement is clear. If the project fails to produce a weighting formula, a clear delineation of when disavowal *must* override precedent (e.g., visible distress) would also protect patients from harmful rigidity, offering immediate safety valves for clinical use. This ensures that the transcript does not become a tool of tyranny against a present self who finds their past commitments alien, preserving ethical sensitivity in care. The salvage value is a refined understanding of how current well-being constraints precedent, useful for any situation where capacity fluctuates. This prevents the ethical framework from ignoring the lived experience of the patient.

  **Question 3: When does instructional specificity become an obstacle to applicability?** This investigates the risk that highly qualified transcripts fail to match real-world scenarios, creating false negatives where care is withheld because conditions aren't met perfectly. It is downstream of Questions 1 and 2, as it concerns application rather than authority; we must know if the transcript binds before we worry about how to match it. It is tractable through conceptual analysis of rule-following and casuistry, focusing on the logic of classification rather than medical efficacy. A successful result defines an "applicability threshold," guiding clinicians on when a near-match suffices versus when deviation is required. Even if no precise threshold is found, identifying common failure modes where specificity blocks care would allow health systems to redesign interview protocols to avoid unworkable constraints, improving the instrument's utility without altering its ethical foundation. This prevents the artifact from becoming so very fragile that it breaks under the pressure of messy clinical reality, ensuring the investment in recording yields actionable guidance. The salvage value is a set of design principles for future advance care planning tools, ensuring they are robust enough for real-world chaos. This guarantees the artifact remains a tool for care rather than a legal trap.

  **Deferred and deprioritized**

  We should not fund abstract metaphysical debates on personal identity. While relevant to the "same person" problem, these discussions rarely yield actionable criteria for Tuesday clinical decisions and are too detached from the legal realities of surrogate decision-making. The transcript forces us to deal with continuity practically, not ontologically; knowing whether the patient is metaphysically the same person does not simply tell a nurse whether to administer antibiotics. Funding this would trap us in theory without practice. Secondly, do not fund comparative validation studies against standard advance directives. This is empirical work, not conceptual, and it assumes the standard directive is the baseline rather than treating the transcript as a novel ethical artifact. Furthermore, knowing the transcript is "better" does not tell us how to use it when it conflicts with present well-being. Validation is a clinical question, not a philosophical one, and our mandate is conceptual clarity. Funding these would divert resources from the urgent normative work required to legitimize the transcript's use in high-stakes decisions, solving the wrong problems with the wrong tools. We must avoid the temptation to solve empirical uncertainty with philosophical grants. Such projects consume budget without resolving the normative deadlock.

  **Crux and reconsideration**

  The single consideration most likely to reorder this list is clear evidence that courts are already treating meta-instructions as binding contracts regardless of philosophical justification. If legal precedent solidifies around the enforceability of interpretive mandates, Question 1 shifts from open philosophy to legal interpretation, making Question 3 (applicability) the immediate priority for clinicians facing liability. I would change my ranking if legal analysis showed that philosophical hesitation on Question 1 would not alter judicial outcomes. My reasoning is most likely to fail on the "Tuesday" test: I prioritize upstream theory, but clinicians may need downstream application guidelines (Question 3) immediately to avoid paralysis, even if the theoretical foundation remains unsettled. If the health system threatens to halt the pilot without immediate application rules, practical urgency might outweigh logical dependency, forcing us to fund Question 3 first despite the risk of building on shaky ground. Practical necessity can sometimes override logical priority in funding decisions.
