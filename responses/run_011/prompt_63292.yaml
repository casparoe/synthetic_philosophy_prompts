  I work on the query engine for a large declarative data platform, and my ten years there have been spent with Datalog, incremental view maintenance, negation-as-failure, fixed points, and the check our language enforces that negation be stratified. I have never taken a course in logic or set theory; Russell's paradox is, for me, the party anecdote about the barber who shaves everyone who does not shave himself. Last week a colleague defended our stratification check by saying it was simply Russell's paradox wearing a database costume, and I want to know whether that is a genuine identity or a coincidence of vocabulary. So: restate naive comprehension, Russell's derivation, and the two standard repairs — restricting comprehension to subsets of collections you already have, and climbing a hierarchy of levels in which each level may speak only of the ones below it — entirely in my vocabulary of base tables and views, rule bodies that mention the view being defined, monotone versus non-monotone recursion, least fixed points, the program `p :- not p` and why it has no stable model, three-valued well-founded semantics that leaves such atoms undefined, and materialization versus on-demand evaluation. Take the phrase "the collection of all collections that do not contain themselves" and show me, step by step, which construct in my language it corresponds to and at exactly which step evaluation fails to settle.

