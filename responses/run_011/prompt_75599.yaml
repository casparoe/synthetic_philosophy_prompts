  Costs more than any molecular **Shift**.
  I wipe the ink from every **Page**,
  A warm small tax on borrowed **Light**.

  ***

  **Physics Notes & Liberties**

  I am confident this will pass without a wince from a second-year cohort. The core thermodynamics are sound: measurement (peeking) is treated as reversible (free), while the cost is isolated to the erasure of the record (Landauer's Principle), described here as a "flat rate per page blanked." The "endless notebook" loophole is accurately represented by the finite capacity of the "Store"; if the notebook were infinite, the demon could indeed correlate forever without paying the heat tax. The "mess" is described as relocated into the correlation between the ledger and the gas ("Making the ledger perfectly Clear / Costs more than any molecular Shift"), avoiding the misconception that disorder is destroyed.

  The single line I am least sure of is the final couplet: *"I wipe the ink from every **Page**, / A warm small tax on borrowed **Light**."* While it successfully avoids naming *kT ln 2*, linking the "tax" to "Light" risks reinforcing the very misconception the poem tries to dismantle (that the cost is in the seeing). However, within the metaphor, "borrowed Light" represents the temporary utility of the measurement, and the "warm tax" is the heat dissipated during erasure. I recommend checking if the phrasing "on borrowed Light" might be read as "because of the Light" rather than "in the currency of the Light." If the class is particularly sharp, they might catch that ambiguity, but it serves the poetic requirement of making the toll feel ordinary rather than formulaic.
