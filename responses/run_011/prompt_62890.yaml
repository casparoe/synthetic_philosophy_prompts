          *   When is "you specified a procedure" a dodge? When the agent *thinks* they are being neutral but physical constraints force a bias.
          *   Fatal scenario: Universal convergence. If all "unbiased" physical processes yield 1/2, then "random chord" *does* refer to something specific in the physical world.
      *   **Section 3: The Epistemic Challenge (The Uselessness of Probability).**
          *   If "ill-posed" explains away all paradoxes, does probability lose its normative force?
          *   The "Principle of Insufficient Reason" vs. "Principle of Indifference."
          *   If we can't assign probabilities without a specified generator, probability theory can't handle ignorance, only known frequencies.
      *   **Section 4: Ranking the Defeaters.**
