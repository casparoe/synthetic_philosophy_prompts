answer: |-
  # Seminar Game: The Leave Equilibrium

  ## 1. Game Overview and Materials

  **Title:** The Leave Equilibrium
  **Time:** 80 Minutes
  **Participants:** 28 Students (10 Households, 4 Firms)
  **Materials:**
  *   Whiteboard and markers (3 colors).
  *   Index cards (3 colors):
      *   **Blue (20 cards):** Labeled "Partner A" and "Partner B" (10 sets).
      *   **Red (8 cards):** Labeled "Firm Manager" and "Firm Analyst" (4 sets).
      *   **Yellow (Remaining/Reserve):** For odd numbers.
  *   **Tokens:** 200 paper slips (cut from scrap paper), marked "CP" (Career Points).
  *   **Handout:** One-page Rule Sheet (text provided below).
  *   **Contract Slips:** Pre-printed small slips for Firms to write wage offers.

  **Room Setup:**
  *   Firms sit at the front (4 tables).
  *   Households sit in the main area (10 pairs).
  *   Whiteboard visible to all.

  ---

  ## 2. The Arithmetic (Load-Bearing Parameters)

  The game relies on specific payoff structures to generate the intended equilibria. Do not change these numbers without recalculating the incentives.

  **Common Values:**
  *   **Work Week:** Generates 10 CP for Worker, 10 CP Profit for Firm.
  *   **Leave Week:** Generates 5 CP Wage for Worker, 0 CP Profit for Firm.
  *   **Care Bonus:** 4 CP per week of leave taken (added to Household total, not individual).
  *   **Career Penalty:** If a Worker takes Leave, their *future* wage offers drop by 20% unless >50% of the workforce also takes leave.

  **Regime 1: The Transferable Pool**
  *   **Entitlement:** 10 Weeks total per Household. Transferable between partners.
  *   **Constraint:** Firm offers a "Track."
      *   *Track High:* Wage 10 CP/week. If Worker takes >0 Leave, Worker is "Flagged" (Penalty applies next round).
      *   *Track Low:* Wage 8 CP/week. Leave allowed without Flag.
  *   **The Trap:**
      *   Household Utility if Both Work (10 weeks each): $200 \text{ Wage} + 0 \text{ Care} = 200$.
      *   Household Utility if Specialized (Partner A: 10 Work, Partner B: 10 Leave): $100 \text{ (A)} + 50 \text{ (B)} + 40 \text{ (Care)} = 190$.
      *   *Wait, Work is better.* We need Specialization to be rational.
      *   **Correction:** Add "Burnout Cost." If both work full time, Household loses 20 CP (Stress).
      *   **Revised Specialized Utility:** $100 + 50 + 40 = 190$.
      *   **Revised Both Work Utility:** $200 - 20 = 180$.
      *   **Result:** Households specialize. Partner B takes all leave.
      *   **Firm Response:** Firms see Partner B takes leave. Firms flag Partner B. Next round, Partner B gets lower wages. Partner A (who didn't take leave) gets High Wage.
      *   **Inequality:** Partner A accumulates CP; Partner B stagnates.

  **Regime 2: The Reserved Quota**
  *   **Entitlement:** 5 Weeks per Person. Non-transferable. Use-it-or-lose-it.
  *   **Constraint:** All Workers *must* take 5 Weeks Leave (or forfeit the 4 CP Care Bonus and still suffer the Firm's baseline adjustment).
  *   **The Shift:**
      *   Since *everyone* takes 5 weeks leave, the "Career Penalty" is triggered for *no one* (threshold >50% met).
      *   Firms adjust Base Wage down to cover the 5 weeks absence, but do not Flag individuals.
      *   **Payoff:**
          *   Work: 5 weeks $\times$ 10 = 50.
          *   Leave: 5 weeks $\times$ 5 = 25.
          *   Care: 5 weeks $\times$ 4 = 20.
          *   Total per Person: 95.
          *   Household Total: 190.
      *   **Comparison:** Round 1 Specialized was 190 (but unequal). Round 2 is 190 (equal).
      *   **The Catch:** Partner A *wanted* to work 10 weeks in Round 2 to earn more, but was forced to take 5 weeks leave. Freedom restricted.

  **Sensitivity:**
  *   If Care Bonus < 3 CP, Households won't take leave in Round 1.
  *   If Career Penalty < 10%, Firms won't discriminate in Round 2.
  *   If Quota < 4 Weeks, Firms might still Flag in Round 2. Keep at 5.

  ---

  ## 3. Rule Sheet (Handout Text)

  **ROUND 1: THE POOL**
  1.  **Households:** You have 10 Leave Weeks shared. Divide them how you wish.
  2.  **Firms:** Offer a Wage (8 or 10 CP/week). Mark contract "High Track" (10 CP) or "Low Track" (8 CP).
  3.  **Rule:** High Track Workers who take *any* Leave are **Flagged**. Flagged Workers get -20% Wage next round.
  4.  **Pay:** Work = 10 CP. Leave = 5 CP + 4 CP Care Bonus (to Household).
  5.  **Stress:** If both partners Work 10 weeks, Household loses 20 CP.

  **ROUND 2: THE QUOTA**
  1.  **Households:** Each Partner *must* take 5 Leave Weeks. Non-transferable.
  2.  **Firms:** Wage offers adjust to average absence. No individual Flagging if >50% of all Workers take Leave.
  3.  **Pay:** Same as Round 1.
  4.  **Note:** You cannot opt out of Leave.

  ---

  ## 4. Minute-by-Minute Timeline (80 Minutes)

  | Time | Activity | Instructor Action |
  | :--- | :--- | :--- |
  | **00-10** | **Setup & Roles** | Distribute cards. Explain tokens = "Career Capital." Low capital = "Laid Off" (sit out debrief). Assign seats. |
  | **10-15** | **Rules Briefing** | Read Handout aloud. Post Payoff Table on Whiteboard. Answer clarification questions only. |
  | **15-35** | **Round 1 (Pool)** | Firms write contracts (5 min). Households decide allocation (5 min). Reveal choices. Calculate Scores (10 min). |
  | **35-40** | **Intermission** | Collect tokens. Reset board. Announce Regime Change. |
  | **40-60** | **Round 2 (Quota)** | Firms write contracts (5 min). Households forced to 5/5 split (5 min). Reveal. Calculate Scores (10 min). |
  | **60-80** | **Debrief** | Sit in circle. Discard tokens. Guided discussion (see below). |

  **Odd Number Protocol:**
  If 27 students: Instructor takes the role of "Firm D Analyst."
  If 29 students: One Firm has 3 members (Manager, Analyst, HR).

  **Small Class Variant (12 Students):**
  *   4 Households (8 students).
  *   2 Firms (4 students).
  *   Reduce Token counts by 60%.
  *   Keep all rules identical. The dynamic holds with fewer agents.

  ---

  ## 5. The Debrief (Scripted Sequence)

  Do not lecture. Ask the questions. Wait for the silence. Let them fill it.

  **Phase 1: The Household Trap (Minutes 60-65)**
  *   **Q1:** "In Round 1, look at your Household scores. Did Partner A and Partner B end up with the same number of tokens?"
      *   *Expected:* No. One has more.
  *   **Q2:** "Partner with fewer tokens, raise your hand. Why did your household assign the leave to you?"
      *   *Listen for:* "We wanted to maximize income," "One of us had to take the hit."
  *   **Q3:** "The policy was gender-neutral on paper. Why was the outcome not neutral in practice?"
      *   *Point 1:* **Identical entitlement $\rightarrow$ Unequal uptake.** Household rationality drives specialization.

  **Phase 2: The Employer Hedge (Minutes 65-70)**
  *   **Q4:** "Firms, look at your contracts in Round 1. Did you offer the High Track to everyone?"
      *   *Expected:* No.
  *   **Q5:** "Why not? Did you dislike the workers who took leave?"
      *   *Listen for:* "It cost us money," "We had to protect profit."
  *   **Q6:** "So the penalty wasn't personal. It was math."
      *   *Vocabulary Introduction:* **"This is not animus; it is statistical discrimination. Employers hedged against risk, and that hedge created the risk it feared."**
      *   *Point 2:* **Rational hedge reproduces the pattern.**

  **Phase 3: The Coordination Problem (Minutes 70-75)**
  *   **Q7:** "In Round 2, everyone took leave. Did the Career Penalty apply?"
      *   *Expected:* No.
  *   **Q8:** "So everyone was better off, or at least safer. Why couldn't we do that in Round 1?"
      *   *Listen for:* "Because I would have been the only one," "I would get flagged."
  *   **Q9:** "You were stuck in a bad equilibrium. No single household could switch to Round 2 logic alone without being punished."
      *   *Point 3:* **Multiple stable outcomes. Individual action fails.**

  **Phase 4: Freedom and Design (Minutes 75-80)**
  *   **Q10:** "Partner A, in Round 2, you were forced to take 5 weeks leave. Did you want to work more?"
      *   *Listen for:* "Yes, I wanted the tokens."
  *   **Q11:** "The policy helped you by hurting your freedom to choose work. Is that justice?"
      *   *Vocabulary Introduction:* **"We moved from a Universal Breadwinner model to a Caregiver Parity model. It fixed the pay gap by removing the option to opt-out of care."**
      *   *First Sentence:* **"The remedy worked not by changing minds, but by removing choices."**
      *   *Point 4:* **Paternalism as a mechanism.**

  ---

  ## 6. Failure Analysis and Rescue Protocols

  **Likely Misfire 1: Collusion**
  *   *Risk:* Households talk to each other and agree to all take leave in Round 1 to break the Firm's power.
  *   *Sign:* Scores are equal in Round 1.
  *   *Rescue:* In debrief, ask: "Was this agreement enforceable? If one household defected, what would happen?" Reveal that without the Quota, the defection incentive remains. The game demonstrates the *instability* of the good outcome without regulation.

  **Likely Misfire 2: Firm Over-Power**
  *   *Risk:* Firms offer 0 wage in Round 2 because they know workers *must* take leave.
  *   *Sign:* Household scores crash in Round 2.
  *   *Rescue:* Remind Firms during setup: "If Wage is too low, Workers reject contract and both get 0." Ensure the "Reservation Wage" is clear on the handout (Min 5 CP).

  **Likely Misfire 3: Confusion on Tokens**
  *   *Risk:* Students lose track of points.
  *   *Sign:* Arguments over math during play.
  *   *Rescue:* Instructor acts as "Central Bank." Households submit slips; Instructor announces totals publicly. This adds public pressure (sting).

  **Likely Misfire 4: Moralizing**
  *   *Risk:* Students refuse to specialize in Round 1 on moral grounds ("It's sexist").
  *   *Sign:* Low engagement, artificial splits.
  *   *Rescue:* Pre-brief: "This is a simulation of incentives, not a test of your values. To see the mechanism, you must follow the points."

  ---

  ## 7. Limitations and The "Endogenous Preferences" Critique

  **What the Game Cannot Reproduce:**
  The game treats the "Care Bonus" as a fixed preference. It assumes households *want* the leave points. It does not simulate *why* they want them.

  **The Critique:**
  A critical student will argue: "You hardcoded the value of care. In reality, the 'preference' for caregiving is manufactured by the very system you're simulating. Women don't just 'prefer' care; they are socialized into it."

  **Does the Objection Land?**
  Yes. The game solves the *coordination* problem but ignores the *formation* problem. It shows how to manage a preference, not how the preference arose.

  **How to Raise It in Debrief:**
  In the final 2 minutes, after the vocabulary drop:
  *"One criticism of this model is that I gave you the Care Bonus points. I told you to value them. In the real world, no one hands you those points. Society teaches you to want them. This game shows how the structure locks in a choice, but it doesn't show how the structure builds the chooser. When you write your papers, consider: Can policy fix the payoff without fixing the preference?"*

  **Can It Be Built In?**
  Not in 80 minutes. To simulate preference formation, you would need a multi-week game where "Care Points" increase based on previous rounds' choices. That is too complex for this session. Acknowledge the limitation explicitly; it models the *constraint*, not the *culture*.

  ---

  ## 8. Instructor Prep Checklist (Afternoon Before)

  1.  **Print Handouts:** 28 copies of the Rule Sheet.
  2.  **Cut Tokens:** 200 small paper squares. Write "CP" on them.
  3.  **Prepare Cards:** Write "Partner A/B" on 20 index cards. Write "Firm" on 8.
  4.  **Whiteboard Plan:** Draw the Payoff Table clearly. Leave space for Round 1 and Round 2 scores.
  5.  **Contract Slips:** Cut 40 small slips of paper for Firms to write wage offers on.
  6.  **Mental Rehearsal:** Run the numbers in your head. Ensure you know the "Correct" outcome so you can spot deviations immediately.
      *   *Round 1:* Inequality expected.
      *   *Round 2:* Equality expected, lower total freedom.
  7.  **Contingency:** If technology fails (printer), write the rules on the board. It takes 5 minutes but works.

  **Final Note:**
  The success of this session depends on your restraint. Do not explain the "why" until the debrief. If a student asks, "Should we specialize?" answer only: "Maximize your Household Points." The discovery must be theirs.
