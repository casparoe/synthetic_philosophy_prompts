          *   *Regime 2 (Reserved):* 5 weeks per person. Non-transferable.
          *   If W1 takes 5, W2 takes 5.
          *   Household Income: 45 + 45 = 90. Care Bonus: 150. Total 240.
          *   Specialization impossible (max 5 weeks each).
