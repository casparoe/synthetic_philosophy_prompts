      *   Demurrage: This is the closest match to his vision. He'd likely support it with caveats on authority.
      *   Metaphysics: Strong link. Functionalism in both.
      *   Uncertainty Section: Explicitly list where the interpretation could break.

  10. **Final Polish:** Ensure the distinction between *The Querist* (pragmatic) and *Principles* (metaphysical) is handled carefully. Berkeley was a Bishop; he cared about social order. Money is for social order.

  *(Self-Correction during drafting)*: Wait, I need to be careful about the "National Bank" point. Berkeley wanted the bank to issue notes backed by land/credit, not just print fiat willy-nilly. It's not modern MMT exactly, but it's elastic. I need to make sure I don't paint him as a pure inflationist, but rather a *velocity*ist.

  Also, on Bitcoin: If Bitcoin were used purely as a medium of exchange (Lightning Network etc.), would he like it? Maybe. But the *ideology* of "store of value" is the friction point.

