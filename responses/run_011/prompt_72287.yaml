answer: |-
  Here is the case for constitutional monarchy restated in the vocabulary of corporate governance, followed by the residue report and verdict you requested.

  ### I. The Translation: Constitutional Monarchy as Governance Structure

  **1. Bagehot's Dignified and Efficient Parts (Brand Equity vs. Operations)**
  Walter Bagehot's distinction maps onto the separation of **Intangible Assets (Brand/Reputation)** from **Operational Management**.
  *   **The Dignified Part (The Crown):** This is the firm's Brand Equity. It generates goodwill, loyalty, and social capital. It does not produce cash flow, but it lowers the cost of capital by signaling stability and continuity.
  *   **The Efficient Part (The Government):** This is Operational Management (CEO and C-Suite). They make the allocative decisions, bear the risk of performance, and absorb the volatility of market (electoral) feedback.
  *   **The Mechanism:** Management "spends" the deference earned by the Brand. When Management makes unpopular but necessary decisions (austerity, war, restructuring), the shock is absorbed by the Brand's accumulated goodwill. If Management also owned the Brand (i.e., if the President were both Head of State and Head of Government), every operational failure would depreciate the Brand equity directly, increasing the volatility of the firm's valuation and the risk premium on future elections.

  **2. Lowering the Stakes (Decoupling Control from Symbolic Ownership)**
  In a republic, the Head of State is elected. This concentrates **Control Rights** and **Symbolic Ownership** in the same hands. Every election becomes a "winner-take-all" contest for the soul of the corporation, increasing the variance of outcomes and encouraging hostile takeover tactics by political parties.
  *   **The Monarchist Argument:** By making the Head of State hereditary (a fixed, non-voting Chair), you remove the ceremonial core of the state from the market for corporate control. This lowers the stakes of the CEO (Prime Minister) succession. The "Chair" cannot be acquired in a proxy fight. This reduces the incentive for political actors to engage in value-destroying entrenchment or extreme polarization, as the ultimate symbol of the firm's identity remains neutral. It functions like a **staggered board** for the head of state, insulating the office from short-term market pressures.

  **3. Reserve Powers (Contingent Control Rights)**
  The Crown retains "reserve powers," which function as **Contingent Control Rights** or **Break-Glass Provisions**. These are normally dormant but can be triggered during a governance crisis when standard operating procedures fail.
  *   **1926 Canada (King-Byng Affair):** The Governor-General (Crown's proxy) refused the Prime Minister's request for a dissolution (new election). In governance terms, the Chair refused the CEO's request to call a shareholder meeting to ratify a contested merger, forcing the CEO to resign instead. It was a check on management attempting to bypass the board.
  *   **1975 Australia (The Dismissal):** The Governor-General dismissed a sitting Prime Minister who could not secure supply (budget). This is analogous to the Board exercising its right to terminate a CEO who has lost the confidence of the capital providers (the legislature/senate) and is operating without a budget.
  *   **Function:** These are not routine monitoring tools; they are **poison pills** against constitutional hardball. They exist to prevent a temporary management majority from hijacking the corporate charter.

  **4. The Japanese Settlement (Non-Voting Chair)**
  Post-1947 Japan represents the extreme separation of **Reputation** from **Control**. The Emperor holds the office of Head of State but possesses zero voting rights, zero veto power, and zero fiduciary responsibility for operations.
  *   **Governance Equivalent:** A Founder-Chair who has been stripped of all equity and voting rights but retains the title and performs ribbon-cutting. The value is purely in the **signaling effect**. The office exists solely to embody the continuity of the corporate entity without interfering in management's agency problems. It maximizes the "dignified" yield by eliminating the risk that the Chair will misuse "efficient" powers.

  ***

  ### II. The Residue Report

  **1. What Translates Cleanly**
  Your intuition holds.
  *   **The Crown as a Golden Share:** The monarch holds a "Golden Share" in the state. This share carries veto rights (reserve powers) and significant reputational weight, but it carries **no cash-flow rights** (the Civil List is a salary/expense account, not a dividend) and cannot be traded. It is designed to block hostile takeovers of the constitutional order without allowing the holder to extract private rents.
  *   **Reserve Powers as a Poison Pill:** The ability to dismiss a Prime Minister or refuse a dissolution acts like a shareholder rights plan. It is triggered only when a "hostile bidder" (a populist leader or rogue PM) attempts to bypass standard governance protocols to consolidate control. It dilutes the aggressor's legitimacy rather than their equity.

  **2. What Translates with Distortion**
  *   **Agency Costs and Monitoring:** In corporate governance, monitoring exists to align the Agent (Management) with the Principal (Shareholders). In monarchy, we must distort the definition of "Principal."
      *   *The Distortion:* I am imputing "The State" or "The People" as the Principal. However, the monarchist argument does not view the People as shareholders with exit rights. The Principal is arguably **Time** (intergenerational equity) or the **Corporate Entity Itself** (perpetual existence).
      *   *The Consequence:* In your framework, high agency costs are bad. In monarchy, some agency slack is *features*. The Monarch is not monitored by the market. This looks like inefficiency to a governance expert, but to a monarchist, it is insulation from short-termism. The distortion lies in defining "efficiency" as wealth maximization rather than regime survival.
  *   **Fiduciary Duty:** Directors owe duties to the corporation/shareholders. The Monarch owes a duty to the "Crown."
      *   *The Distortion:* The "Crown" is a *corporation sole*—a legal fiction that is its own principal. Translating this requires assuming the Monarch is a fiduciary for the *office*, not the *people*. This distorts the standard agency model where the fiduciary must serve the residual claimant. Here, the Monarch *is* the residual claimant of dignity, but owes no duty to the residual claimants of policy (the voters).

  **3. What Has No Counterpart (The Untranslatable Remainder)**
  *   **The Fiduciary Void:** In corporate governance, an agent with no principal is a rogue actor. If a CEO owes a duty to no one, it is fraud or entrenchment. In monarchy, **having no principal is the functional requirement.** The Monarch must not be an agent of the people (that's the PM) nor an agent of a party. They are a trustee for a trust with no living beneficiaries. Your vocabulary assumes every power must be accountable to a claimant. Monarchy asserts that legitimacy requires a power source that is *not* accountable, to serve as a neutral arbiter.
  *   **The Opacity Constraint (The Magic Trick):** This is the most critical failure of translation.
      *   *Corporate Norm:* Transparency reduces agency costs. Disclosure is good. Governance structures should be legible to shareholders.
      *   *Monarchist Norm:* Legitimacy relies on **mystique**. The "dignified" part works only if the population does not conceive of it as a governance device. If you explain the trick (i.e., "The King is a Golden Share designed to lower your risk premium"), the deference evaporates. The value depends on the stakeholders believing the Brand is sacred, not that it is a calculated risk-mitigation tool.
      *   *The Paradox:* A successful translation into governance terms destroys the thing it translates. If the "dignified" part is understood as "efficient," it ceases to generate "deference."

  ***

  ### III. Constraint Check: Flagged Assumptions

  In constructing the translation above, I had to supply three assumptions that the monarchist argument does not contain:

  1.  **The Efficiency Standard:** I translated "stability" and "deference" into "lowering cost of capital" and "reducing volatility." Monarchists often argue these are intrinsic goods (order, duty, honor), not instrumental means to economic or political stability. I have treated legitimacy as a tool for regime survival, whereas a monarchist might treat it as an end in itself.
  2.  **The Principal:** I implicitly treated "The State" as a firm that wants to persist. Corporate governance assumes the firm exists to generate returns for owners. I had to supply the assumption that the "return" is continuity rather than profit. Without this, the Golden Share looks like dead weight.
  3.  **Rational Stakeholders:** Corporate governance assumes shareholders act on information. The monarchist model relies on stakeholders acting on *emotion* and *habit*. I had to model "deference" as a rational calculation of stability benefits, whereas the monarchist claims it is pre-rational loyalty.

  ***

  ### IV. The Verdict

  You asked which of two readings the residue supports:
  1.  Corporate governance has no term for legitimacy that is not instrumental to returns.
  2.  The talk of dignity and theatre is unnecessary; a competently designed structure could do the work without it.

  **My Verdict:** The residue supports **Reading 1**. Corporate governance vocabulary is teleologically narrow; it cannot capture legitimacy that is not instrumental to a principal's returns.

  **Where the Untranslatable Remainder Does the Most Damage:**
  The damage occurs at the **Fiduciary Void** combined with the **Opacity Constraint**.

  In corporate governance, if you have a Golden Share with veto power (Reserve Powers) held by an entity with no fiduciary duty to shareholders (The Monarch), and the value of that share depends on shareholders *not knowing* it is a governance device (The Mystique), you have a structure that violates every tenet of your profession. It is the ultimate **entrenchment device** backed by **information asymmetry**.

  If you translate it faithfully, it looks like a governance failure: An unaccountable actor with veto power whose value proposition relies on misleading the stakeholders about the nature of their authority.

  However, this "failure" is precisely the monarchist's point. Corporate governance is designed for **Exit** (shareholders can sell). Politics is **Voice** and **Loyalty** (citizens cannot easily exit the state).
  *   In an Exit system, transparency is vital because stakeholders price risk.
  *   In a Loyalty system, transparency is corrosive because stakeholders must *suspend* pricing to maintain cohesion.

  The untranslatable remainder reveals that corporate governance has no vocabulary for **sacralization**. It can model "Brand," but only as a function of reputation for performance. It cannot model "Brand" as a function of *mystery*.

  Therefore, the translation fails not because monarchy is inefficient, but because corporate governance assumes that **all legitimacy must be cashed out in accountability.** Monarchy argues that some legitimacy must be cached in **unaccountability** to function as a neutral arbiter. Your framework views unaccountability as an agency cost; the monarchist views it as the only solution to the agency problem of political polarization.

  The damage is done when you try to measure the ROI of the Crown. If the Crown works, the ROI is invisible (disasters that didn't happen, civil wars that weren't fought). If you make it visible (by explaining the governance mechanics), you destroy the mechanism. Thus, corporate governance can describe the *skeleton* of monarchy (Golden Shares, Poison Pills), but it cannot describe the *life* of it (Legitimacy), because your vocabulary treats legitimacy as a derivative of performance, whereas monarchy treats performance as a derivative of legitimacy.
