answer: |-
  How to use this

  Take a pencil. Do not look at the end labels while you answer. Read each scenario as if it were a story about your own street or family. Mark the option that feels true in your gut, not the one that sounds smarter. If you hesitate between two, pick the one that keeps you awake at night. There are no right answers, only clear ones. When you finish, turn to the scoring key. If your answers scatter, do not force them into a single box; the mix is often the most honest result. This tool is not to win an argument, but to see why your neighbour hears a different story in the same news.

  The questions

  1. Imagine you are a person in the year 1900. You see infant mortality falling and literacy rising. You also see empires carving up the world and armies gathering. By 1913, do you conclude the survival and reading are part of a steady climb that will continue, or a lucky streak that could vanish when the empires clash?
     A steady climb proves the direction is real. (Registers: Trend)
     A lucky streak means the good news is fragile. (Registers: Luck)
     Good for some, vanish for others. (Registers: Uneven)

  2. Consider a country that built a welfare state to protect its poor, then dismantled it inside a decade to cut costs. Does this reversal prove the progress was never real, or simply that progress can be lost?
     Progress was real but can be undone. (Registers: Reversible)
     Progress was an illusion if it vanished. (Registers: Illusion)
     Progress moves in cycles, not lines. (Registers: Cyclical)

  3. Think of a public health campaign that worked and saved millions, but was carried out by force against the people it helped. Can you add the lives saved to the ledger without subtracting the freedom lost?
     Yes, life outweighs coercion. (Registers: Commensurable)
     No, freedom and life are different currencies. (Registers: Incommensurable)
     Only if the people eventually consent. (Registers: Conditional)

  4. Look at a catastrophe that erased a generation's gains and left nothing standing behind it, like a city bombed flat. Is the suffering that preceded the rebuilding somehow taken up and made to count in the result, or is it a permanent loss?
     The suffering fuels the rebuilding. (Registers: Redeemed)
     The loss is permanent and cancels nothing. (Registers: Permanent Loss)
     The suffering is the price of entry. (Registers: Cost)

  5. When you see improvements like laws repealed or wars ended, was any of this bound to happen eventually, or could all of it have failed to occur and can still be reversed?
     It was bound to happen. (Registers: Inevitable)
     It could have failed. (Registers: Contingent)
     It happens only when pushed. (Registers: Voluntary)

  6. Who or what is doing the bending? Is it nobody, human beings, something internal to the structure of history, or something standing outside it?
     Human beings make it happen. (Registers: Human Agent)
     Something internal drives it. (Registers: Structural Agent)
     Something outside guides it. (Registers: External Agent)
     Nobody is driving; it is random. (Registers: No Agent)

  7. Is the improvement you see in the left column actually neutral evidence, or is it partly a gentler and more efficient form of control used by the winners?
     It is neutral evidence of good. (Registers: Neutral)
     It is a form of control. (Registers: Skeptical)
     It is both good and control. (Registers: Mixed)

  The leaves

  Providential: History is guided by a purposeful God toward a good end. The right column is a mystery of faith; suffering serves a divine plan we cannot see. Awkward commitment: You must accept that every atrocity was permitted for a greater good.

  Structural: The direction is built into history's own structure and works through conflict regardless of intentions. The right column is the necessary friction of progress; pain is the engine of change. Awkward commitment: You must accept that current suffering is required for future freedom.

  Class Power: The arc depends entirely on which class holds power and forces concessions. The right column is the blood cost of struggle; nothing is given freely by the powerful. Awkward commitment: You must accept that justice stops if the oppressed stop fighting.

  Cumulative Optimism: Each generation inherits what the last one worked out; knowledge stacks up. The right column is a tuition fee paid by ancestors; we stand on their graves. Awkward commitment: You must accept that barbarism can return if knowledge is forgotten.

  Meliorism: Improvement is real, but neither automatic nor guaranteed; made and unmade by particular people. The right column is a warning; gains are fragile and require vigilance. Awkward commitment: You must accept that there is no safety net if we fail.

  Declinist: The left column is a temporary borrowing from the future; the bill comes due. The right column is the accumulating debt; every comfort hides a coming collapse. Awkward commitment: You must accept that trying to fix things often speeds up the fall.

  Skeptical: The improvement is partly a gentler and more efficient form of control; the left column is not neutral evidence. The right column is the truth; the left is just a nicer cage. Awkward commitment: You must accept that resistance might make life harder without making it freer.

  Retrospective: The arc is the shape we impose when we look backwards at a sequence that had no shape while it was happening. The right column is the raw data; the left is the story we tell to survive. Awkward commitment: You must accept that your hope is a narrative trick.

  Empty rooms

  Some combinations of answers create positions nobody occupies. If you claim history is guided by a purposeful God but also that suffering is a permanent loss that counts for nothing, you are in a theological contradiction. This gap exists because the view is incoherent; a guiding purpose implies meaning in the pain.

  If you claim progress is inevitable but also that it depends entirely on which class holds power, you have a political contradiction. This gap exists because the view is unattractive; why fight if victory is guaranteed by structure alone?

  If you claim the left column is purely a form of control but also that human beings are the only agents of change, you are in a practical deadlock. This gap exists because the view is unexplored; it leads to paralysis where no action is deemed authentic enough to matter.

  Blurry borders

  The tree cannot fully separate Cumulative Optimism from Meliorism. Both agree improvement is real and human-driven. The further question needed is: If everyone sat down and stopped working tomorrow, would progress continue on its own momentum? Optimism says yes; Meliorism says no.

  The tree also struggles to separate Structural from Class Power. Both see conflict as the engine. The further question needed is: If the workers won everything tomorrow, would history stop moving? Structural says no, new contradictions arise; Class Power says yes, justice arrives.

  Scoring key

  Match your dominant pattern to the leaves. Mostly Trend, Inevitable, and Structural points to Structural. Mostly Luck, Permanent Loss, and Human Agent points to Meliorism. Mostly Control and Skeptical points to Skeptical. If your answers come out mixed, do not force a single label. Most people hold a Meliorist core with Skeptical doubts. This is not confusion; it is honesty. Use the mix to explain why you argue with your neighbours. You see the same ledger but weigh the columns differently. The goal is not to win, but to know which column keeps you awake.
