answer: |-
  Let's begin by stripping the varnish off the practicalities, because you are right to suspect that logistics are masquerading as principle. If we brainstorm the candidate theories that could license this discrepancy—stone stays, titles go—we have to start with the cynical baseline. The unphilosophical explanation is friction. Chiseling granite is expensive; updating a payroll ledger is free. Litigation risk over a deed restriction for a science quad is high; a fellowship is often governed by bylaws the board can amend with a majority vote. There is also the reputational calculus: removing a name from a building looks like erasure, inviting accusations of rewriting history, whereas removing a prize looks like accountability, inviting praise for ethical vigilance.

  But you know these are alibis. If the committee truly believed the trustee's opposition to women rendered his name toxic enough to revoke a fellowship, the moral urgency should, in principle, overcome the cost of sandblasting a facade. The fact that it doesn't suggests the philosophical underdetermination is real: the logistics only stick because they align with a deeper, unstated ontology. The "cost" argument works only because we already feel differently about stone than we do about paper. This implies the practice rests on a specific metaphysics of objects versus acts. The unphilosophical reasons explain the *resistance* to change, but they do not explain the *permission* to revoke the fellowship. For that, you need a theory of what a name *is*.

  Your hypothesis—that we are distinguishing between a dedication-as-artifact and an honor-as-standing-speech-act—is robust, but it requires tightening. It rests on the presupposition that materiality alters the temporal mode of the name. When a name is cut into stone, the committee treats it as having entered the historical record as a *fact of the past*, akin to a battle date or a geological stratum. It is no longer a question of current policy; it is a question of archaeology. To remove it would be to falsify the artifact's history. Conversely, a named chair or a prize is treated as a performative utterance that requires continuous iteration to exist. The university says, "We confer this chair upon X," every time it is filled or funded. It is a living promise. If the promisor (the university) withdraws the promise, the act ceases.

  This reconstruction strictly presupposes that the function of the building name is *referential* (pointing to the history of the building's funding) while the function of the fellowship name is *honorific* (pointing to the current values of the institution). The charter silently rules out the view that a building name is also honorific. It rules out the idea that walking past "Trustee Hall" every day is a continuous, low-level speech act by the institution, saying, "We honor Trustee." If you accept the rival view—that all naming is a standing endorsement—then the distinction collapses, and the practice becomes incoherent. But under your current charter, the practice is internally consistent *if* you accept that material embedding converts an endorsement into a historical datum.

  Now, let's press the wrinkle: the plaque regress. You ask if the infinite stack of plaques is vicious or benign. This depends entirely on whether you view the purpose of the dedication as *instruction* or *witnessing*. If the goal is to ensure the passerby holds the correct moral view at the moment of reading, the regress is vicious. It implies we can never quite land the plane of meaning; we are always adding a correction to the previous correction, ad infinitum. It suggests meaning is never fixed, which undermines the "permanence" the charter claims to protect.

  However, if we view the building as a site of collective memory formation, the regress is benign. In fact, it is desirable. The stack of plaques becomes the physical manifestation of the community's moral struggle over time. The first plaque says "Great Donor." The second says "Great Donor who hated women." The third says "We apologize for the delay in adding the second plaque." The building becomes a palimpsest. This implies that meaning is not fixed at utterance, nor is it merely accreting gloss; it is *stratigraphic*. The charter's claim that meaning is fixed is technically false under this model; rather, the *substrate* is fixed, while the *interpretation* is allowed to pile up.

  *Judgment call:* I am arguing here that the regress is benign only if you abandon the idea that the university controls the meaning of the dedication. If the university thinks it can finalize the meaning with a plaque, the regress is a failure of authority. If the university accepts it is merely a custodian of the debate, the regress is a feature.

  This brings us to the "neither endorses nor repudiates" formula. You suspect it converts institutional endorsement into a standing assignment for the passerby. You are correct. This formula is a abdication of the Critical function of history. It posits an idealized reader—attentive, literate, morally autonomous—who completes the speech act the institution is too cowardly to finish. The institution says, "Here is a bad man. We do not say he is bad. You decide." This shifts the moral labor from the bronze (the institution's voice) to the eyes (the viewer's conscience). It presupposes that the site is a classroom, not a shrine. But since the site is physically a shrine (a named building), the cognitive dissonance is offloaded onto the student walking to class. They must do the work of contextualization that the administration has refused to do.

  Now, let's run this through the triad. You know the danger of treating these as mere labels; they are modes of relating to the past to serve the present.
  Your charter's presumption of permanence is pure Antiquarian piety. It treats the past as sacred simply because it *is* the past. It says, "This stone was laid by our fathers; to remove it is to sever the root." This is necessary for a sense of belonging, but it becomes suffocating when the root is poisoned.
  The plaque is an attempt at Critical history—it judges the past to free the present—but as you noted, its teeth are filed down. It critiques the man without critiquing the decision to keep his name. It performs judgment while formally disclaiming it. This is the "neither/nor" trap. It wants the moral credit of the Critical mode without the destructive risk of actually removing the monument.
  The Monumental mode is what the building originally served: "Great men did great things; emulate them." The plaque destroys the Monumental function (you can't emulate a misogynist) but refuses to let go of the stone.
  So, is the triad doing diagnostic work? Yes. It reveals that your committee is trying to serve three masters with one policy. You want the stability of the Antiquarian, the inspiration of the Monumental, and the ethics of the Critical. The policy fails because the Critical cannot function within the Antiquarian's constraint of permanence. The plaque is a Critical thought imprisoned in an Antiquarian cell.

  Finally, the rival view: If we adopt the theory that a name on a building is a standing act of endorsement rather than a finished artifact, the entire architecture collapses. The plaque does not survive this swap. If the name is a continuous speech act, then keeping the name *is* the endorsement. Annotating it is like keeping a liar at the podium and handing him a note that says "He is lying." The audience still hears him speaking.
  Under this view, every dedication would indeed need periodic re-authorization. A sunset clause for memory. This treats the campus not as a museum of accumulated history, but as a manifesto of current values. It implies that the past has no claim on the present other than what the present chooses to grant it.
  *Judgment call:* This is the harder path philosophically, because it admits that history is instrumental. It says we use the past for life, and if it no longer serves life, we discard it. Your current charter tries to say the past has rights. The rival view says the past has only what we give it.

  If you switch to the "standing endorsement" model, the plaque becomes redundant. You either keep the name (and own the views) or you remove it (and contextualize the removal). The "plaque on plaque" regress vanishes because you resolve the tension by removing the source of the tension. But you lose the Antiquarian comfort of permanence. You admit that your campus is a temporary arrangement of values, subject to revision. That is more honest, but it risks making the institution feel transient, like a political campaign rather than a home.

  To answer your core question: Your hypothesis is correct, but it is a rationalization that hides a conflict between two incompatible views of time. The practice rests on the distinction between artifact and act, yes, but it tries to have it both ways. It treats the building as an artifact to avoid the work of revocation, but treats the plaque as an act of moral correction. The regress is benign only if you accept that the university's role is to host the conflict of values, not resolve them. If you believe the university must resolve them, the regress is vicious, and the "neither/nor" formula is a moral failure. The triad confirms this: you are using Antiquarian means to achieve Critical ends, and the friction is generating the heat that keeps you up at night.
