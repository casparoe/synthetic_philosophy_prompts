          *   *Post-Mortem View:* We know it was a cable. Does this make the higher-order evidence look decisive? Yes. Does it make the framing look like luck? Potentially. The "rationality" of the split depends on whether the error *had* to be found externally.
      *   **Limits of the Lens:** Epistemology doesn't explain the resignations (sociology/politics), the media frenzy, or the specific choice of venue. It treats the collaboration as a black box of reasoning, ignoring the human cost.
