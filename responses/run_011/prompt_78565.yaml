answer: |-
  **1. The thesis**

  The debate between Norman Malcolm and Daniel Dennett regarding dreams rests on a false dichotomy generated by a shared, unexamined assumption. I call this the endorsement condition: the claim that a mental state counts as an experience only if, at the time it occurs, it carries the subject's own endorsement of it as real and as happening now, recoverable later via report. Malcolm argues this endorsement is conceptually impossible during sleep; Dennett argues empirical evidence suggests it is added only upon waking. Both are wrong because the endorsement condition is false. Experience does not require belief in reality. We have experiences while knowing they are unreal, such as when imagining or watching a film. Denying this condition commits us to the view that dreams are genuine experiences with present-tense sensory character occurring during sleep, regardless of whether the sleeper endorses their reality. Consequently, the Malcolm–Dennett dispute dissolves. It ceases to be a metaphysical puzzle about whether dreams exist and becomes a narrower psychological question about how dream content is generated and stored.

  **2. The shared premise**

  To see why both philosophers rely on the endorsement condition, we must reconstruct their opposing strategies. Malcolm's argument is conceptual. He contends that the language of dreaming is logically tied to waking reports. To say "I had a dream" is to report a waking impression; there are no independent criteria for saying a dream occurred while the sleeper was asleep. For Malcolm, the experience cannot be separated from the warrant for claiming it occurred. Since a sleeper cannot provide warrants or verify reality during sleep, there is no logical space for an experience to exist at that time. The experience is constituted by the waking report. Dennett attacks this by shifting the ground to empirical science. He proposes the cassette hypothesis: the brain might construct the narrative of a dream at the moment of waking, inserting it into memory as if it had happened over time. For Dennett, the question is not logical but factual: did the experience occur during sleep or was it fabricated upon arousal?

  Despite their opposition, both assume that for a dream to be an experience, there must be a continuous thread of verification linking the sleeping state to the waking report. Malcolm demands this link be logical and immediate; Dennett suggests it might be empirical and delayed. Both require that the status of the dream as an experience depends on the subject's ability to validate it as a real occurrence connected to their waking self. Malcolm would resist this characterization, insisting he is discussing grammar rather than psychology, while Dennett would deny he is denying experience altogether, merely questioning its timing. However, both treat the validity of the experience as dependent on the subject's capacity to endorse the reality of the content across the boundary of sleep. They share the premise that without this endorsement mechanism, the claim to having had an experience collapses.

  **3. The case against the premise**

  The endorsement condition fails because it conflates experiencing with believing. We routinely acknowledge experiences that lack endorsement of reality. Consider absorbed reading. When deeply engaged in a novel, I feel fear for the protagonist or sadness at a plot twist. I do not endorse these events as real; I know they are fiction. Yet, the emotional and sensory experience is genuine. Similarly, in daydreaming, I visualize scenarios I know are not happening. In hypnagogic imagery, the state between wakefulness and sleep, vivid visuals occur without any claim to reality. Even in play, a child pretending to be a pirate experiences the play-world without believing it is real. In all these cases, the phenomenal character—the "what it is like"—is present without the endorsement condition being met.

  Therefore, what makes a state an experience is not the subject's judgment of its reality, but its intrinsic phenomenal character. An experience is defined by sensory presence, emotional tone, and temporal flow as felt by the subject. If a state has these qualities, it is an experience. Applying this to dreams, the question is not whether the sleeper believes the dream is real, but whether there is sensory presence during sleep. Most dreams involve vivid sensory fields and emotional reactions. Under the revised view, these count as experiences even if the sleeper never wakes to report them, and even if they never believed them to be real.

  This positive account dissolves the Malcolm–Dennett standoff. Malcolm argues you cannot endorse reality while asleep, so you cannot experience. But if experience does not require endorsing reality, his conceptual block vanishes. Dennett argues the memory might be fabricated, so the experience might not have happened during sleep. But if the experience is defined by its phenomenal character at the time, the reliability of the memory report is a separate issue from the existence of the experience. The cassette hypothesis might explain memory consolidation, but it does not negate the occurrence of the phenomenal state. By abandoning the endorsement condition, we allow that dreams are experiences in the ordinary sense, occurring during sleep, independent of waking verification. The dispute shifts from metaphysics to the mechanics of memory and generation.

  **4. The evidence, re-examined**

  The empirical phenomena cited in our group take on new meaning once the endorsement condition is discarded. First, consider the incorporation of external stimuli, such as an alarm clock ringing or water spraying, into a dream narrative. Malcolm might see this as proof that the dream ends at the stimulus; Dennett might see it as proof the dream was composed at the moment of the stimulus. On my view, this simply shows that dream generation is dynamic and responsive to sensory input. It does not prove the experience wasn't happening prior to the stimulus. The brain integrates new data into an ongoing phenomenal field.

  Second, reports from non-REM sleep often describe short, thought-like content rather than vivid scenes. This does not show an absence of experience, but a variation in the type of experience. Thought-like content still has phenomenal character. It confirms that sleep mentation varies in style, not that it ceases to be experience.

  Third, and most critically, Stephen LaBerge's work with lucid dreamers undermines the endorsement condition directly. Lucid dreamers know they are dreaming; they do not endorse the dream as reality. Yet, they are clearly dreaming. Furthermore, they execute pre-arranged eye movements while physiological records confirm they are in REM sleep. This establishes two things. First, it proves communication is possible during sleep, damaging Malcolm's claim that no criteria exist for sleeping states. Second, it proves experience exists without reality endorsement. The lucid dreamer experiences the dream while knowing it is unreal. This phenomenon is awkward for Malcolm, who denies experience during sleep, and for Dennett, who suggests the narrative is fabricated at waking. The eye signals occur *during* sleep, proving the cognitive state exists then. While this does not prove all dreams are lucid, it proves the conceptual possibility of experienced sleep, which is sufficient to break the philosophical deadlock.

  **5. Objections and replies**

  Three objections threaten this position. First, without the endorsement condition, does the distinction between having a dream and merely being disposed to report one collapse? This is Malcolm's original point returning. If experience is private and unverified, how do we know it happened? The reply is that private existence does not require public verification to be real. Unspoken thoughts are real experiences even if never reported. We infer dreams from reports, but the experience precedes the report.

  Second, one might argue that dream time is illusory; dreams feel long but occur in minutes. If time perception is false, is the experience real? Time perception is subjective in waking life as well, such as during flow states or trauma. Distorted time perception alters the content of the experience but does not negate the experience itself.

  Third, if endorsement is not needed, is there any difference between dreaming and waking experience? There is. Waking experience allows for consistent cognitive access and memory consolidation that dreaming often lacks. However, this is a difference in cognitive function and memory reliability, not a difference in the ontological status of the experience. The lack of memory does not erase the event. These objections highlight epistemic difficulties in studying dreams, but they do not restore the endorsement condition as a requirement for experience itself.

  **6. What survives**

  Even if my thesis is correct, both philosophers retain partial validity. Malcolm is right that waking reports are the only public criteria we have for scientifically studying dreams. We cannot access another's private experience without their testimony. Dennett is right to be skeptical of naive realism regarding dream memory; the narrative we tell upon waking is likely reconstructed and edited. However, Malcolm is wrong to deny the experience exists during sleep, and Dennett is wrong to suggest this reconstruction negates the prior experience. By rejecting the endorsement condition, we preserve the reality of the dream experience while accepting the fallibility of the dream report. The dispute survives only as a technical disagreement about memory mechanisms, not as a fundamental puzzle about the mind.
