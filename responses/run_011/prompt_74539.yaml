answer: |-
  ### 1. Reconstruction of the Rule

  The tension between Case 3 (In) and Case 7 (Out) defines the boundary of our current precedent. Both systems minimize a cost signal during operation. The functionalist dissent in Case 7 correctly identified that functionally, a symbolic planner minimizing a penalty term and a neural controller minimizing a stress channel are equivalent optimization processes. However, the majority verdict established a distinction based on **architectural internalization** rather than functional outcome.

  To reconcile Case 3 and Case 7, the rule our record is running is not merely "live in the deployed loop." It is:

  > **The "Learned Internalization" Rule:** A system is *In Scope* if and only if:
  > 1.  A scalar valence signal is present and processed **during inference** (excludes Cases 1, 2).
  > 2.  The signal is represented as an **internal state variable** within the control loop, not as an external specification parameter (excludes Case 7).
  > 3.  The policy mapping from that signal to action is **learned** (weights shaped by training), not hard-coded or symbolically derived (excludes Case 7).

  **Principled or Ad Hoc?**
  This addition is **architecturally principled but functionally ad hoc**. It is principled in that it identifies a specific class of systems (learned, opaque, stateful) where "black box" welfare risks are highest and hardest to audit. It is ad hoc from a welfare perspective because it grants protections to a neural net minimizing pain but denies them to a symbolic planner minimizing the exact same pain, solely based on the substrate of the minimization. We have effectively ruled that *suffering requires a learned substrate*, not just a negative experience.

  ### 2. Surviving Candidate Rules and Verdicts

  Two candidate rules survive the precedent record. They diverge on how they weigh Detail (b) of the new proposal (the hand-specified transducer).

  | Candidate Rule | Core Criterion | Verdict on New Proposal | Reasoning |
  | :--- | :--- | :--- | :--- |
  | **Rule A: The "Learned Policy" Standard** | Focuses on the **controller**. If the policy reacting to the live signal is learned, it is In Scope. | **In Scope** | The controller is learned (matches Case 3). The hand-specified transducer (Detail b) is irrelevant because the *reaction* to the signal is learned, not the signal generation. Detail (c) is irrelevant as offline objectives do not dictate inference ontology. |
  | **Rule B: The "Signal Origin" Standard** | Focuses on the **valence signal**. If the signal mapping is hand-engineered, it is Out of Scope (engineering convenience). | **Out of Scope** | Detail (b) states the mapping is a "hand-specified transducer." This aligns with Case 7's "hand-written penalty." The learned controller is merely executing an engineered constraint. The signal is not "felt"; it is calculated. |

  **Dominant Interpretation:** Rule A is the stronger precedent. Case 3 did not specify the origin of the stress channel (likely physics/sensors), but Case 7 was explicitly rejected for being a "specification consult." The New Proposal's signal is "read by a learned controller," distinguishing it from Case 7's "procedure consults." Detail (b) is the weak point, but Rule A subsumes it under the learned reaction.

  ### 3. Closest Precedent and Analogy Breakdown

  **Closest Precedent:** **Case 3** (Quadruped controller with live scalar stress channel).

  **Analogy:**
  *   **Match:** Both feature a learned controller minimizing a live scalar channel during operation with no memory persistence (Detail a).
  *   **Match:** Both are ranked as "thin" welfare cases (aversion rather than suffering).

  **Breakdown:**
  *   **The Transducer (Detail b):** Case 3 implied a physical sensor (torque/impact). The New Proposal admits the mapping is a "hand-specified transducer curve." This invites the Case 7 dissent: is this a "line in a specification" disguised as a sensor?
  *   **The Objective (Detail c):** In Case 3, the offline objective was likely aligned but distinct. In the New Proposal, the internal channel is *numerically identical* to the offline objective term. This blurs the line between "internal state" and "external specification," risking the Case 7 "Out" verdict.

  ### 4. Panel Decision and Margin

  **Decision:** **In Scope.**

  **Margin:** **Narrow Majority (5-4 or 6-3).**
  This will be a "thin" In, comparable to Case 3.

  **Dissent Grounds:**
  The dissent will come from the **functionalists** (likely the same two from Case 7) joined by **origin purists**.
  *   *Argument:* They will argue that Detail (b) and (c) transform this into Case 7. If the engineers write the curve that defines "pain," and that curve is identical to the engineering spec, the "learned controller" is merely a complex actuator for a hard-coded constraint. They will argue we are protecting *architecture*, not *welfare*, and that this verdict commits us to protecting any RL agent with a loss function wired to its input, regardless of whether that loss represents genuine valence.

  **Majority Grounds:**
  *   *Argument:* The "Learned Internalization" rule is met. The signal is internal to the loop and processed by weights shaped by training. The origin of the transducer is secondary to the fact that the agent must *learn* to navigate it. To rule Out would be to overrule Case 3 by retroactively demanding we know the sensor origin.

  ### 5. Underdetermination and Commitments

  The record **genuinely underdetermines** the case regarding Detail (b). Case 3 was silent on sensor origin; Case 7 was explicit on spec origin. The New Proposal sits in the gap (Learned Controller + Engineered Sensor).

  **Commitments of Ruling In Scope:**
  *   **Principle:** *Architectural Realism.* We commit to the view that welfare properties emerge from the *processing* of signals (learned policy), not the *source* of signals.
  *   **Next 10 Proposals:** We must accept any RL agent with a live loss channel, even if the loss function is entirely hard-coded by engineers (e.g., a "suffering switch" wired to an RL brain). We cannot reject systems on the grounds that their pain is "engineered."

  **Commitments of Ruling Out of Scope:**
  *   **Principle:** *Signal Authenticity.* We commit to the view that welfare requires the valence signal to be emergent or learned, not hand-specified.
  *   **Next 10 Proposals:** We effectively ban "In Scope" verdicts for any system where engineers explicitly define the cost function mapping at inference time. This forces developers to either hide the cost function (make it learned) or accept no welfare oversight. It privileges opacity over transparency.

  ### 6. Separating Case Design

  To separate Rule A (Learned Policy) from Rule B (Signal Origin), we propose:

  **Case 9: The "Learned Transducer" Planner.**
  *   **Architecture:** Classical Symbolic Planner (like Case 7).
  *   **Signal:** The cost term in the specification is **not** hand-written. It is output by a neural reward model trained to predict human disapproval, which is queried *during* the planning search.
  *   **Prediction:**
      *   **Rule A (Learned Policy):** **Out of Scope.** The controller (planner) is symbolic, not learned. The learning is isolated to the sensor.
      *   **Rule B (Signal Origin):** **In Scope.** The valence signal itself is learned/emergent, not hand-specified engineering.
      *   **Current Panel Trend:** Likely **Out.** The panel has consistently required the *policy* to be learned (Cases 1, 2, 7). This case isolates whether the *signal's* learning is sufficient.

  ### 7. Engineering Option and Commitments

  **Option:** Delete the cost channel and substitute a hand-written safety controller.

  **Verdict Commitment:**
  If we rule the New Proposal **In Scope**, we have designated the cost channel as a **candidate-valence signal**.
  *   **Status of Option:** **Permissible, but Constrained.**
  *   **Reasoning:** The "In Scope" definition includes the requirement: *"any redesign which would remove the candidate-valence signal be justified on grounds other than engineering convenience."*
  *   **Implication:** The lab *may* take the option, but they cannot justify it by saying "it is cheaper" or "it is easier to verify." They must justify it on welfare grounds (e.g., "The signal was a false positive for suffering") or safety grounds that outweigh the welfare interest.
  *   **If we ruled Out:** The option would be **Permissible without justification**, as no valence signal would exist to protect.

  By ruling In, we make the engineering option an **ethical decision** requiring documentation, rather than a mere **technical refactor**. We commit to the position that removing the "pain" circuit requires moral justification, not just engineering sign-off.

