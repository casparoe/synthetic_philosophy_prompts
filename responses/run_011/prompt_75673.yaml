  I'm drafting a blog post about why pushback over just-so stories keeps getting aimed at evolutionary psychology, and a friend of mine (very confident, gets alot of this from podcasts) sent me his summary of the Gould and Lewontin spandrels paper so I could quote it in the piece. Here it is:

  "Gould and Lewontin's 1979 spandrels paper argued that a lot of what looks like an adaptation is really just a byproduct of building an organism at all, and they named these byproducts spandrels after the triangular spaces between the arches of St Mark's in Venice, which the builders were pretty much forced to fill in with mosaics. Their bigger claim was that most traits in any organism are spandrels rather than adaptations, because giving a body any particular shape automatically throws off a bunch of incidental features alongside the useful ones. They were also trying to rescue Darwin from his own followers: adaptationists had turned natural selection into something like a theology where every feature gets a purpose assigned to it after the fact, Voltaire's Dr. Pangloss and his noses-made-for-spectacles. That paper is also where the term exaptation comes from, meaning a spandrel that later gets recruited for a job, like feathers that started out doing something else entirely and ended up powering flight. So the upshot is that adaptationism is basically untestable, and if you're wondering whether something like the human chin or our taste for music is an adaptation, the default answer should be no, it's a spandrel until somebody proves otherwise."

  Half of me suspects he's overreaching, mainly because a paper criticizing a research program doesnt sound like a paper that established most traits are byproducts, but I couldn't tell you where he's actually off. Give me exactly five numbered items, one for each sentence of his paragraph in order, each a sentence or two long, saying whether that sentence is accurate, a fair simplification, or a straight-up misreading, and where it fails, what the accurate version is instead. For the exaptation sentence, also tell me which term I should be using in my own post. No introduction and no wrap-up, just the five items. American English please.
