answer: |-
  The liturgical tension you identify—between the sufficiency of verbal substitution in the daily *Korbanot* service and the petition for physical restoration in the *Musaf* service—presupposes a specific, layered theory of value regarding religious action. To reconstruct this, we must distinguish between the *halakhic* (legal) logic of the liturgy and the *philosophical* explanations imposed upon it.

  ### 1. The Liturgical Theory of Value

  The liturgy itself, prior to philosophical commentary, operates on a theory of **normative idealism tempered by pragmatic legal fiction.**

  **The Morning Substitution (*K'ilu*):**
  The formula "may it be Your will... that our recitation be reckoned (*chashuv*) as though we had brought the offerings" presupposes that:
  1.  **Obligation Persists:** The commandment to offer sacrifices remains in force even when physically impossible.
  2.  **Divine Grace Bridges the Gap:** The equivalence between word and deed is not ontological (words are not bulls) but juridical. It relies on a divine decree that accepts the verbal performance as a valid proxy (*tamchui*) for the physical one.
  3.  **Strict Requirement:** This requires only that God accepts the substitute. It does *not* strictly require that the physical act possesses intrinsic metaphysical efficacy (as Nahmanides holds) nor that it is merely a cognitive tool (as Maimonides might suggest). It requires only that the *obligation* can be discharged via proxy when the primary mode is blocked.

  **The Festive Restoration (*V'nechazeveh*):**
  The petition "restore us to it... so that we may discharge those obligations" presupposes that:
  1.  **The Proxy is Provisional:** The verbal substitution is a stopgap for exile, not the ideal state of affairs.
  2.  **Physical Performance is Normatively Superior:** While the substitute discharges the *obligation*, the physical act remains the *mitzvah* in its fullness.
  3.  **Strict Requirement:** This requires that the physical act retains a value the verbal act lacks. It does *not* specify *what* that value is. It could be expressive (obedience for its own sake), metaphysical (drawing down divine flow), or pedagogical (reinforcing law through habit).

  **The Synthesis:**
  The liturgy presupposes a hierarchy of value: **Physical Performance > Verbal Substitution**, but **Verbal Substitution = Sufficient for Legal Discharge in Exile.** The tension is not contradictory but eschatological: the current mode is valid but incomplete; the future mode is the restored ideal.

  ### 2. The Maimonidean Frame: Concession vs. Code

  Here we encounter the difficulty you noted. We must distinguish between settled textual facts and contested interpretations of Maimonides' intent.

  **Settled Textual Facts:**
  *   *Guide of the Perplexed* 3:32: Sacrifices were a divine concession to the historical ubiquity of sacrificial worship, intended to wean Israel from idolatry.
  *   *Mishneh Torah*, Hilkhot Melakhim 11:1: The Messianic king will rebuild the Temple and restore the sacrificial order.

  **Contested Interpretations:**
  *   **The Esoteric/Developmental Reading:** Scholars like Menachem Kellner and Shlomo Pines argue that the *Guide* represents Maimonides' true philosophical view (sacrifices are obsolete concessions) and the *Code* is a concession to traditional law or the masses. On this reading, Maimonides does not *believe* sacrifices will ideally return, but codifies that they *will* according to tradition.
  *   **The Harmonistic Reading:** Traditional commentators (e.g., R. Kook, R. Soloveitchik) and some academics argue Maimonides believes the *Guide* explains the *origin*, but not necessarily the *eternal teleology*. The habit may have been the origin, but the practice acquired enduring value as a form of divine service.

  **Reconstructing the Value Theory under Maimonides:**
  If we take the **Harmonistic Reading** (relying on the explicit text of the *Code* as binding belief), the petition for restoration is coherent. The "concession" was regarding the *transition* from idolatry to monotheism. Once monotheism is established, the sacrificial structure remains as the commanded mode of worship, regardless of its historical origin. The value is **Deontological**: we do it because it is commanded, and the Messianic era is defined by the full observance of commandments.

  If we take the **Esoteric Reading** (relying on the *Guide* as his considered truth), the petition for restoration becomes problematic. Asking for the restoration of a "concession" implies asking for the return of a pedagogical crutch that should no longer be needed. For this to be coherent, one must argue that the Messianic era involves a regression in human spiritual capacity requiring the crutch again, or that the *Guide*'s explanation is limited to the *wilderness* generation and not the Temple era.

  ### 3. Underdetermination: Where Maimonides Fits

  The liturgical practice is **underdetermined** regarding the *source* of the sacrifice's value. This allows Maimonides' concessive account to coexist with the liturgy unmodified, provided one accepts specific distinctions:

  1.  **Origin vs. Endurance:** The liturgy asks for restoration of the *practice*, not the *historical conditions* that necessitated it. Maimonides can argue that while the *reason* for the law was historical (weaning from idolatry), the *law itself* is eternal. The liturgy does not pray "Restore the need to wean us from idols," but "Restore the offerings."
  2.  **Divine Command vs. Human Need:** The morning substitution relies on divine acceptance ("reckoned to us"). The restoration relies on divine command ("as commanded"). Maimonides can fit here: God commanded it (perhaps for historical reasons), so we pray to fulfill the command. The "value" is obedience to the Commander, not the intrinsic utility of the blood.
  3.  **The "Habit" Argument:** Maimonides argues one cannot abruptly abandon habit. The liturgy presupposes we are *currently* habituated to prayer (the substitute). The restoration prayer could be interpreted as a desire to return to the *original* divine habit, even if the *Guide* suggests a future where even that is transcended (in the World to Come, distinct from the Messianic era).

  **Where it is strictly required:** The liturgy *requires* that the physical act be the normative standard. Maimonides' *Code* affirms this.
  **Where it merely sits comfortably:** The liturgy sits comfortably with Nahmanides' view (intrinsic metaphysical efficacy), but does not *require* it. The "reckoned as" formula works equally well if the value is purely legal/obediential.

  ### 4. Rival Theories: Nahmanides and Deflationism

  **Nahmanides (Intrinsic Efficacy):**
  Nahmanides critiques Maimonides, arguing sacrifices have intrinsic efficacy in drawing the worshipper near (*korban* from *karov*).
  *   **Fit:** This sits *very* comfortably with the liturgy. It explains why the physical act is superior to the verbal (physical blood actually effects atonement/closeness).
  *   **Requirement:** It is not strictly required. The liturgy could function on a model of "Obedience is closeness" without metaphysical mechanics.

  **Deflationary Reading (Liturgical Fossil):**
  This view holds the restoration petition is a textual fossil preserved out of conservatism, with no active belief in restoration.
  *   **Fit:** This explains the tension by dissolving the belief component of the restoration prayer.
  *   **Requirement:** This contradicts the plain meaning (*pshat*) of the liturgy, which is petitionary ("Rebuild," "Restore," "Let us offer"). To adopt this is to reinterpret the prayer as poetry rather than request. It is an external critique, not an internal reconstruction of the practice's presuppositions.

  ### 5. Modern Revisions as a Test

  Contemporary revisions (past tense recitation or omission of sacrificial references) serve as a stress test for the original theory.

  **The Revisions:**
  1.  **Past Tense:** "Our ancestors offered..." (Historicization).
  2.  **Omission:** Removing references entirely (Spiritualization).

  **Presupposed Theory of the Revisions:**
  These edits presuppose that **physical sacrifice is no longer a normative ideal.** They reject the "Restoration" presupposition of the traditional liturgy. They align with a Maimonidean-Concessive view taken to its logical conclusion: if sacrifices were a historical concession, and the historical context (idolatry/ancient temple culture) is gone, the practice should not return.

  **Ambiguity vs. Rejection:**
  Does the fact that these edits were "intelligible and mildly controversial" show the original practice was ambiguous?
  *   **No.** If the original practice were genuinely ambiguous (i.e., if traditional Jews were unsure if they wanted sacrifices back), the edits would be clarifications, not controversies.
  *   **Yes, it shows Substantive Rejection.** The controversy arises precisely because the traditional liturgy is *committed* to restoration. The edits are intelligible because modern theological language allows for "spiritual sacrifice," but they are controversial because they break the covenant with the *Code* and the plain text of the prayer book. The friction proves the original commitment was robust. The "ambiguity" is not in the text, but in the modern community's willingness to uphold the text's ontological claims.

  ### 6. The "Explicit Guide" Test

  If a community fully and explicitly believed the *Guide*'s account (sacrifices are purely a historical concession to wean from idolatry) as their sole theological truth, the practice would have to change significantly, though some elements could survive.

  **What Would Have to Change:**
  1.  **The Restoration Petition:** The *Musaf* prayer asking to "offer again" would become incoherent. One cannot petition for the return of a pedagogical tool designed for a spiritual infancy the community believes it has outgrown. This would necessitate the modern revisions (past tense/omission).
  2.  **The "As If" Formula:** The morning service might shift from "reckoned as though we brought" to "remembering what was once required." The legal fiction of equivalence implies the obligation still exists; if the obligation was contingent on historical idolatry, the obligation is void, not just suspended.

  **What Could Survive Untouched:**
  1.  **The Recitation Itself:** Reading the texts could survive as **historical memory** or **educational study**. Maimonides values knowledge of the Law. Studying the sacrifices teaches the details of the commandments, even if those commandments are currently inapplicable.
  2.  **The Structure of Prayer:** The *Guide* compares prayer to the "concession" of sacrifice. The structure of approaching God through fixed times and texts could remain, justified as the "new" mode of worship that replaces the old concession.

  **Conclusion on Maimonides:**
  If the *Guide* is the exclusive truth, the liturgy cannot survive unmodified. The "Restoration" prayer is the casualty. If the *Guide* is read harmonistically (origin is concessive, but command is eternal), the liturgy survives. The fact that traditional Orthodoxy retains the liturgy unmodified suggests it relies on the **Harmonistic Reading** (or simply prioritizes the *Code* over the *Guide* for liturgical intent), whereas the modern revisions implicitly adopt the **Esoteric/Concessive Reading** as their operative theology.

  ### Summary of Value Theory

  The traditional liturgy presupposes a **Deontological-Performative Value Theory**:
  1.  **Value Source:** The value of sacrifice lies in its status as a Divine Command, not solely in its psychological or historical utility.
  2.  **Hierarchy:** Physical performance is the normative ideal; verbal recitation is a valid, grace-enabled proxy for times of constraint.
  3.  **Teleology:** History moves toward restoration of the ideal, not away from it.

  Maimonides' *Guide* challenges the *origin* of this value but not necessarily its *authority* (if one follows the Harmonistic reading). The modern revisions challenge the *authority* itself, treating the command as historically bound rather than eternally normative. The controversy surrounding these revisions confirms that the traditional liturgy is not an ambiguous fossil, but a committed assertion that the physical discharge of the commandment remains the eschatological goal.
