answer: |-
  This is a specification for a theory of mnemonic obligation, tailored to the constraints of a county task force operating under budget, statute, and divided public sentiment. It is designed to filter out abstract positions that cannot survive contact with institutional decision-making.

  ### The Specification List

  **1. The Addressee Constraint**
  *   **Requirement:** The theory must identify a specific beneficiary of the duty who is capable of receiving the benefit or suffering the harm of the decision.
  *   **Case/Consideration:** You noted the dead cannot be addressed and future people have no current interest. If a theory claims a duty is owed *to* the dead, it must explain how a non-existent entity holds rights. If it claims the duty is to the living (survivors, taxpayers, future citizens), it must explain why the content of the memory is fixed by the past rather than the needs of the present.
  *   **Status:** **Normative Dispute.** There is no consensus on whether duties can be owed to the dead. Some argue duties to the dead are actually duties to the living *about* the dead. Others argue the dead retain a stake in their narrative. This is not settled ground; it is the primary fault line.
  *   **Label:** **Non-negotiable for decision-making.** Even if the philosophy is disputed, the county attorney cannot authorize action based on a duty owed to a non-legal entity without a living proxy.

  **2. The Mode Distinction**
  *   **Requirement:** The theory must distinguish between remembering (internal cognitive state), memorializing (public ritual/symbol), and preserving (archival storage).
  *   **Case/Consideration:** A file in a box nobody opens is preservation. A plaque is memorializing. A survivor telling their story is remembering. Collapsing these leads to the error of thinking that building a monument fulfills an obligation to know the truth, or that sealing files erases the event.
  *   **Status:** **Methodological Consensus.** Scholars and practitioners generally agree these are distinct mechanisms with different costs and effects.
  *   **Label:** **Non-negotiable.** Collapsing these is a failure of category. You cannot vote to "remember" without specifying which mechanism you are funding.

  **3. The Action Separation (Remember vs. Repeat vs. Repair)**
  *   **Requirement:** The theory must treat the duty to remember, the duty not to repeat, and the duty to repair as distinct obligations that may conflict.
  *   **Case/Consideration:** Camp B argues that a plaque (remembering) might hinder medical record correction (repairing). A theory that treats these as one package cannot help you choose when resources force a trade-off.
  *   **Status:** **Methodological Consensus.** While often rhetorically linked, practical ethics treats these as separate vectors. Remembrance does not guarantee non-repetition; repair does not require public memory.
  *   **Label:** **Non-negotiable.** Treating these as identical is a **Camp Commitment disguised as a criterion.** Both camps currently conflate them to strengthen their leverage.

  **4. The Selection Criterion (The Right to Forget)**
  *   **Requirement:** The theory must provide a principle for what ought *not* to be remembered or published, given finite resources and privacy rights.
  *   **Case/Consideration:** You cannot publish everything. Budgets are finite. Privacy statutes exist. A theory that demands total recall is not a theory of obligation; it is a demand for impossibility. It must explain why *this* name is on the wall and *that* name is in a sealed box.
  *   **Status:** **Methodological Consensus.** All serious accounts acknowledge selection is unavoidable.
  *   **Label:** **Non-negotiable.** Any theory that claims "everything must be remembered" fails the feasibility test.

  **5. The Temporal Decay Clause**
  *   **Requirement:** The theory must account for the change in meaning of a memorial or record over time (the "hollowness" effect).
  *   **Case/Consideration:** You noted formulas sound hollow within decades. A decision made today must justify its value in year 20, not just year 1. If the obligation is to "keep memory alive," the theory must specify the maintenance required to prevent decay into background noise.
  *   **Status:** **Normative Dispute.** There is agreement that decay happens, but dispute on whether it matters. Some argue the *attempt* is the duty, regardless of reception. Others argue if the meaning is lost, the duty is unfulfilled.
  *   **Label:** **Non-negotiable for institutional planning.** The county must plan for maintenance, not just installation.

  **6. The Accuracy vs. Truth Distinction**
  *   **Requirement:** The theory must distinguish between factual accuracy (dates, names), narrative truth (what it felt like), and moral judgment (that it was wrong).
  *   **Case/Consideration:** Files may be factually accurate but morally silent. A plaque is morally loud but factually thin. Survivors may disagree on the narrative truth. A theory must specify which layer the county is obligating itself to.
  *   **Status:** **Normative Dispute.** Historians prioritize accuracy; ethicists often prioritize moral judgment.
  *   **Label:** **Potential Camp Commitment.** Camp A may prioritize moral judgment (it was wrong); Camp B may prioritize factual privacy (the data is sensitive). A workable theory must rank these.

  **7. The Institutional Agency Limit**
  *   **Requirement:** The obligation must be something a bureaucratic entity can perform without violating its own constitutive rules (e.g., neutrality, due process).
  *   **Case/Consideration:** A county government is not a family. It cannot "grieve." It can only legislate, fund, or record. A theory requiring emotional engagement from the state is unusable.
  *   **Status:** **Methodological Consensus.** Political philosophy generally agrees states have different capacities than individuals.
  *   **Label:** **Non-negotiable.** This is a hard constraint for the county attorney.

  ### Incompatibilities (No-Go Results)

  You asked to flag subsets of requirements that cannot be jointly satisfied. Based on the constraints above, there are two primary incompatibilities you will likely encounter:

  1.  **Total Accuracy vs. Privacy vs. Budget:** You cannot have a fully searchable, accurate register (Accuracy), protect the privacy of living survivors who wish to remain hidden (Selection/Privacy), and keep costs low (Budget). You must sacrifice one. A theory that promises all three is false.
  2.  **Duty to the Dead vs. Duty to the Living:** If the duty is owed to the dead (Camp A), their names should be spoken regardless of living survivors' discomfort. If the duty is owed to the living (Camp B), the dead's names may be suppressed to protect the survivors' health. You cannot satisfy both addressees simultaneously if their interests conflict.

  ### The Single Eliminator

  **The Addressee Constraint (Requirement 1)** eliminates the most familiar answers.

  Most public arguments assume the duty is self-evident ("We must remember"). Once you force the task force to answer *"To whom is this duty owed, and how do we know they want it?"*, many standard justifications collapse.
  *   If the duty is to the **dead**, Camp A wins on the memorial, but Camp B wins on the files (if the dead valued privacy).
  *   If the duty is to the **living survivors**, Camp B wins on privacy, but Camp A wins on validation (if the majority want names spoken).
  *   If the duty is to the **public/future**, both camps lose, because the public's interest is likely in policy reform (Repair), not names (Memory).

  Forcing a vote on the Addressee before voting on the Action prevents the task force from arguing past each other.

  ### Epistemic Status: Solid Ground vs. Guessing

  *   **Solid Ground:** It is settled that institutions have limited capacity, that memory degrades over time, and that preservation, memorialization, and cognition are distinct activities. It is also settled that selection (forgetting) is unavoidable in archiving.
  *   **Disputed/Guessing:** It is genuinely disputed whether the dead can be bearers of rights. It is disputed whether public memory reduces conflict (as Camp A hopes) or hardens it (as Camp B and Rieff fear). There is no consensus on whether "repair" (material compensation) is morally superior to "remembrance" (symbolic recognition); this is a value judgment your task force must make, not find in a book.
  *   **My Assessment:** I am inferring the "Methodological Consensus" items from the standard structure of archival ethics and political philosophy. I am flagging the "Normative Dispute" items because the literature you read (Margalit vs. Rieff) demonstrates that intelligent experts disagree on them. Do not present the Addressee question as solvable by research; it is solvable only by policy choice.

  ### Scoring the Positions

  **Camp A (Memorial/Register):** Fails the **Institutional Agency Limit** if they expect the county to "grieve." Fails the **Selection Criterion** if they demand all names be public despite privacy objections. Succeeds on **Temporal Decay** only if they fund perpetual maintenance.
  **Camp B (Privacy/Repair):** Fails the **Addressee Constraint** if they claim the dead do not matter at all. Succeeds on **Action Separation** by prioritizing Repair over Memory. Succeeds on **Institutional Agency** as medical record correction is a standard bureaucratic function.

  **Recommendation:** Do not ask the task force to agree on a theory. Ask them to vote on Requirement 1 (Addressee) and Requirement 3 (Action Separation). If they cannot agree on *who* this is for and *what* kind of act is required, no amount of philosophical reading will resolve the budget allocation.
