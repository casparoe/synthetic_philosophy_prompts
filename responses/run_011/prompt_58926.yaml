answer: |-
  In your framework, the counterpart to "some things compose something" is the assignment of a Parent Part Number (PN) that rolls up specific Child PNs in a Bill of Material (BOM). I choose this rendering because it captures the structural dependency: the parent cannot exist in the system without the children linked beneath it. The cost of this choice is ontological inflation: it assumes the Parent PN *is* the whole, rather than merely a reference to an administrative grouping. It smuggles in the assumption that a database link constitutes existence, which is precisely what the Special Composition Question (SCQ) disputes.

  **Nihilism (Nothing Composes)**
  Translated: No Parent PNs should ever be created; only leaf-node detail parts exist.
  Clean translation: Eliminates assemblies.
  Distortion: Your world requires Parent PNs for procurement and planning.
  Awkward Feature: Phantom Assemblies. These are parents with no physical referent, used for logic. Nihilism would reject them as false, but PDM retains them as necessary fictions. The translation fails because PDM treats phantoms as valid data objects, whereas Nihilism treats them as errors.

  **Universalism (Anything Composes)**
  Translated: Any set of Child PNs can be linked to a new Parent PN.
  Clean translation: The system technically allows any node to be a child of any parent.
  Distortion: Governance rules forbid nonsensical groupings.
  Awkward Feature: The "Bag of Fasteners." One PN covers loose screws. Universalism says this is a genuine object; PDM says it is a logistics convenience. The translation holds structurally but diverges on intent: Universalism claims ontological truth; PDM claims supply-chain utility.

  **Contact/Fastening**
  Translated: A Parent PN is valid only if Children are physically joined in the design model.
  Clean translation: Matches the Engineering BOM.
  Distortion: Effectivity dating.
  Awkward Feature: Stored Part-of Relations. A link in the database is revocable; a weld in metal is not. If effectivity dictates a part is installed only after Serial Number 1000, the composition status changes by date without the metal changing. PDM records the *rule* for joining, not the joining itself.

  **Fusion**
  Translated: A Parent PN is valid only if Children lose individual identity (e.g., welded assembly).
  Clean translation: Matches the "welded assembly" debate you know.
  Distortion: Multi-structure articles.
  Awkward Feature: Design vs. Service BOMs. Design sees a fused single PN; Service sees a breakdown of replaceable children. If composition were fusion, the Service BOM would be a lie. Since both BOMs are valid in your system, "fusion" cannot be the sole criterion for the Parent PN's existence.

  **Van Inwagen (Life)**
  Translated: A Parent PN is valid only if the assembly functions as a unit independent of the aircraft (e.g., a Line Replaceable Unit).
  Clean translation: Distinguishes "Detail Part" from "Assembly."
  Distortion: "Life" in PDM is revision status, not metabolism.
  Awkward Feature: No expression for biological unity. The closest is "Serviceable Item," but a welded structure can be serviceable without having a "life." The translation captures the functional boundary but misses the ontological claim that only living things are true wholes.

  **Special Case: Artifact Nihilism**
  This view holds that tables do not exist, only simples arranged tablewise. In PDM, this corresponds to a "Kit" PN. The system tracks the component PNs, and the Kit PN is a transient wrapper for issuance, with no serialized asset record answering to the Kit itself. However, the *ontological denial* is inexpressible. PDM cannot flag a PN as "Convenient Fiction" versus "Real Object." It records the decision to manage the group as a unit, but remains silent on whether the unit exists independently of that management.

  **Residue Report**
  The residue lies in the status of the BOM link. In your framework, composition is a *stipulation* recorded by a data administrator. In the SCQ, composition is a *fact* discovered by a metaphysician. When a philosophical answer cannot be stated in your terms, it is not because your framework is missing a representation of part-whole structure. You have ample structures (phantoms, kits, effectivity). The gap exists because the philosophers are arguing about the justification for the data model while presenting it as a claim about the world.

  Your framework exposes the SCQ as a debate over governance rules disguised as physics. When you argue whether a welded assembly gets one PN or a breakdown, you are not discovering the assembly's true nature; you are deciding how to manage risk, cost, and replaceability. The "truth" of composition in your world is always relative to the BOM view (Design, Manufacturing, Service). There is no "God's Eye BOM."

  Therefore, the philosophers are indeed arguing about how to stipulate a data model. They seek a universal rule for when to create a Parent PN. Your experience shows that the rule depends on the query: Are we buying it? Building it? Fixing it? The residue is the illusion that there is a single correct answer to "Does this exist?" prior to asking "For what purpose are we numbering it?" Your framework does not lack the ability to represent the parts; it lacks the pretense that the representation is anything other than a decision. The SCQ asks for a fact of the matter where your career has proven there is only a choice of model.
