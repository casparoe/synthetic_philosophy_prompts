answer: |-
  This is one of the most famous stalemates in contemporary Buddhist ethics, largely crystallized by the debate between Damien Keown (Side B: Virtue Ethics) and Charles Goodman (Side A: Consequentialism). You have diagnosed the *feel* of the impasse correctly, but your hypothesis that "they don't disagree about a single case" is factually incorrect regarding the scholarship, and that error is where the substantive disagreement hides.

  Here is the breakdown of what is settled, what is live controversy, and why your group is stuck.

  ### 1. The Diagnosis: Is it just a label?
  **Verdict: No.** It is not merely a taxonomic dispute about applying Western terms. It is a substantive disagreement about the *structure of moral reasoning* in Buddhist texts.

  You hypothesized that both sides agree on the practical output (the Captain is praiseworthy) and only fight over the label. In the secondary literature, this is false.
  *   **Goodman (Consequentialist):** Argues the Captain case is a clear instance of act-utilitarianism. The act is justified *because* it saves lives, and the Bodhisattva's compassion negates the karmic penalty. The outcome determines the rightness.
  *   **Keown (Virtue Ethicist):** Argues that in the Pali Canon (Theravada), killing is *always* *akusala* (unskillful), regardless of consequence. He argues the Captain story is a later Mahayana innovation (*Upāyakauśalya Sūtra*) that contradicts early Buddhist ethics. For Keown, the act remains unskillful, but the Bodhisattva's willingness to sacrifice his own spiritual purity for others is an act of supreme virtue, not a calculation of net utility.

  **The Substantive Buried Issue:**
  The disagreement is about the **locus of moral value**.
  *   **Side A** claims value resides in the *consequences* (reduction of suffering, increase of welfare).
  *   **Side B** claims value resides in the *character/intention* (alignment with *nibbana*, absence of *kleshas*/defilements).

  If you believe intention (*cetanā*) is karma (which is settled philology), then an act with a "good" outcome but a "violent" intention is karmically negative. Consequentialism struggles to accommodate this unless it radically redefines "consequence" to include "state of the agent's mind." Side B says that redefinition collapses consequentialism into virtue ethics.

  ### 2. Settled Scholarship vs. Live Controversy
  You asked for explicit demarcation. Here it is.

  **Settled (Philology & Basic Doctrine):**
  *   ***Kusala/Akusala:*** It is consensus that these terms translate best to "skillful/unskillful" or "wholesome/unwholesome." They are rooted in psychological states (greed, hatred, delusion vs. their opposites).
  *   ***Karma:*** It is consensus that karma is primarily intention (*cetanā*), not the physical outcome. (AN 6.63: "Intention, I tell you, is kamma.")
  *   ***The Goal:*** It is consensus that the soteriological goal is the cessation of suffering (*dukkha*) and the end of rebirth.
  *   ***The Captain Case:*** It is consensus that the "Compassionate Killer" story is **not** in the Pali Canon (the earliest strata of text). It is a Mahayana text. Using it to define "Buddhist Ethics" broadly is a category error unless you specify *which* Buddhism.

  **Live Controversy (Ethical Classification):**
  *   **Is *kusala* defined by its results?**
      *   *Goodman:* Yes. An act is skillful because it leads to good results (happiness/nirvana). This makes it consequentialist.
      *   *Keown:* No. An act is skillful because it flows from a mind free of defilement. The results are secondary symptoms. This makes it aretaic.
  *   **Is *Nirvana* a "good state of affairs"?**
      *   *Goodman:* Yes, it is the ultimate good to be produced/maximized.
      *   *Keown:* No, it is the cessation of craving. You cannot "produce" cessation in a consequentialist sense; you realize it by removing obstacles.
  *   **Agent-Relativity:**
      *   You hit on something real here. Standard Utilitarianism is agent-neutral (my happiness counts the same as yours). Karma is agent-relative (my karma is mine).
      *   *Goodman's Move:* He argues Mahayana Buddhism *overcomes* this via the Bodhisattva vow and merit transfer, effectively creating a "karmic utilitarianism" where the Bodhisattva absorbs negative karma to maximize global welfare.
      *   *Counter:* Many scholars argue merit transfer is ritualistic/soteriological, not a mechanism for ethical calculus in the moment of action.

  ### 3. What Could Move the Debate?
  If your group wants to escape the loop, stop asking "Is it consequentialist?" and try one of these three shifts:

  **A. Distinguish Theravada from Mahayana**
  The "Captain" case is Mahayana. The *Vinaya* (monastic code), which is deontological (rule-based), is shared but interpreted differently.
  *   *Move:* Ask Side A: "Can you ground your consequentialism in the Pali Canon without relying on the *Upāyakauśalya Sūtra*?"
  *   *Move:* Ask Side B: "Does your virtue ethics account for the Mahayana explicit permission to break precepts for compassion?"
  *   *Result:* You will likely find Side A is describing Mahayana ethics and Side B is describing Early/Theravada ethics. They are talking about different historical traditions.

  **B. The "Intention" Trap**
  Focus on the definition of *cetanā* (intention).
  *   If karma is intention, and intention is judged by the mental roots (greed/hatred vs. non-greed/non-hatred), then the morality is internal.
  *   *Challenge:* Ask Side A: "If a monk kills a tyrant to save 1,000 people, but feels a flicker of aversion toward the tyrant, is that act *kusala*?"
      *   If Side A says "Yes, because 1,000 lives saved," they contradict the karma doctrine (intention is key).
      *   If Side A says "No, because aversion is present," they admit the consequence (1,000 lives) didn't determine the moral quality.
  *   *Result:* This exposes whether they are actually consequentialists or just *saying* they are.

  **C. Change the Question from "Is" to "Functions As"**
  Instead of "Is Buddhist ethics consequentialist?", ask: "In what contexts does Buddhist ethics function consequentially?"
  *   *Scholarly Consensus:* Most modern scholars (e.g., Jay Garfield, B. Alan Wallace) now argue that Buddhist ethics is **pluralistic**. It uses virtue ethics for monastic cultivation, deontology for Vinaya rules, and consequentialism for lay social engagement.
  *   *Result:* This dissolves the binary. The debate isn't about what the system *is*, but which tool is being used in which context.

  ### 4. What Work Is This Debate Doing?
  You asked what the point is if it's just taxonomy. There are three substantive functions this debate serves in the academy:

  1.  **Legibility:** Western philosophy departments require Buddhist thought to speak the language of analytic ethics to be taken seriously. "Is it consequentialist?" is a gatekeeping question. If the answer is "none of the above," it risks being marginalized as "religious studies" rather than "philosophy."
  2.  **Apologetics:**
      *   Side A (Consequentialism) often wants to show Buddhism is "rational" and compatible with modern secular ethics (effective altruism, utilitarianism).
      *   Side B (Virtue Ethics) often wants to show Buddhism is distinct from Western reductionism and preserves the spiritual/transformative aspect of practice.
  3.  **Hermeneutic Pressure:** The debate forces scholars to read texts more closely. Goodman had to read Indian Abhidharma texts deeply to find consequentialist structures. Keown had to read the Pali Canon deeply to find virtue structures. The friction produces better philology, even if the conclusion is a stalemate.

  ### Summary for Your Group
  Tell them this:
  1.  **Your hypothesis is half-right:** It is partly about the difficulty of mapping agent-relative karma onto agent-neutral Western categories.
  2.  **But it's not just labels:** They genuinely disagree on whether the *Compassionate Killer* is permissible in Early Buddhism (Side B says no, Side A says yes).
  3.  **The Philology:** The meaning of *kusala* is settled (skillful/wholesome). The *ethical category* it maps to is not.
  4.  **The Way Out:** Acknowledge that "Buddhist Ethics" is not a monolith. Early Buddhism leans Aretaic/Deontological. Mahayana leans Consequentialist (in specific Bodhisattva contexts). The argument persists because both sides are cherry-picking different canons to prove a universal claim.

  **Recommendation:** Assign Charles Goodman's *Consequences of Compassion* (2009) and Damien Keown's *The Nature of Buddhist Ethics* (1992). Then assign Jay Garfield's "Conventional Virtue" (2015), which argues the whole question is a category mistake based on confusing the two truths doctrine. That usually breaks the deadlock.
