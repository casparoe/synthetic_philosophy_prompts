  1. "What my verdicts commit me to"
  Your verdicts commit you to a hybrid theory separating institutional validity from interpersonal obligation. You prioritize authority and procedure over internal state for public acts (the bribed judge, the head of state), suggesting conventions operate independently of the speaker's morality. Conversely, for private acts (the actor, the rehearser), you require sincere intent to invoke the convention. The inconsistency lies in your treatment of coercion versus acting: you claim the coerced promise is "made" but unenforceable, whereas the actor's promise is never made at all. This implies a distinction between validity and binding force that you haven't applied elsewhere. Furthermore, your uptake intuitions are asymmetrical. You require mutual agreement for bets but deny it for forgiveness, while demanding a hearer for apologies. This suggests you distinguish between acts that create external obligations (bets), those that alter internal standing (forgiveness), and those seeking relational repair (apology), but you lack a rule defining when uptake is constitutive versus when it is merely evidentiary.

  2. "Candidate principles"
  **Principle 1: Institutional Competence.** A speech act alters external status if and only if the speaker holds recognized authority within the relevant convention and follows prescribed procedure. Internal bad faith does not invalidate the act. This covers the judge (authority exists despite bribery) and the head of state (authority exists despite empty airwaves). It invalidates the private citizen's war declaration and the bystander's ship naming; the convention assigns power to specific roles, not merely to the utterance. Clicking "I accept" works because the digital interface grants temporary agency within the contractual convention. The key condition here is *role-based power*: the speaker must be the designated agent of the institution. If the role is absent, the convention cannot be invoked, regardless of wording.

  **Principle 2: Intentional Framing.** A speech act creates interpersonal obligation only if the speaker intends to invoke the convention's binding force at the moment of utterance. This distinguishes the quitting employee (intent present despite anger) from the actor (intent absent despite perfect wording) and the rehearser (intent directed at future, not present). The convention must be "live" for the participants. The key condition is *illocutionary intent*: the speaker must mean to do the thing they are saying they are doing. Without this, the words are merely noise or performance, lacking the normative weight of a commitment. This explains why the actor is not bound: they are quoting a convention, not using it.

  **Principle 3: Volitional Agency.** A commitment is enforceable only if the speaker's agency was not compromised by immediate threat or incapacity. This handles the coercion case: the promise is valid (Principle 2 met) but unenforceable (Principle 3 violated). It also explains the bet: both parties must exercise agency to accept obligations. However, this principle struggles with unilateral acts like forgiveness, which do not require enforceability against another, only a change in the speaker's stance. Therefore, enforceability requires bilateral volition, while status changes require only authority, and internal standing changes require only intent. This tripartite structure allows you to separate the actor (no intent) from the coerced speaker (no volition) and the judge (authority overrides intent). It clarifies why the coerced promise is "made" (intent existed) but not "held" (volition compromised), whereas the actor's promise is neither made nor held. The bet requires uptake because it creates a bilateral burden; forgiveness requires none because it lifts a burden. These principles operate hierarchically: Institutional Competence overrides Intent (the judge), but Intent is necessary where Authority is absent (the friends), and Volition determines enforceability across all categories.

  3. "The uptake problem"
