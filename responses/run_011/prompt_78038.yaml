answer: |-
  Here is the stress test.

  ### 1. On "Hermeneutical Capture" vs. The Gap
  Your hunch is correct: Fricker's model of hermeneutical injustice relies on a *privation* (a lacuna). The subject suffers because they lack the concept to render their experience intelligible (e.g., "sexual harassment" prior to the 1970s). *Never Let Me Go* presents the opposite: a *surfeit*. The students are drowning in concepts (*donor, carer, complete, deferral*), but the vocabulary is rigged to render the moral reality unintelligible.

  **Is "Hermeneutical Capture" a new label?**
  It earns its keep for your group, but don't sell it as Frickerian. Fricker is concerned with the *availability* of concepts; you are describing the *contamination* of concepts. This is closer to ideological hegemony or propaganda (Jason Stanley's work on democratic ideals is relevant here, though you asked for no sources). Dotson's "contributory injustice" (willfully ignoring available resources) doesn't fit because the clones aren't ignoring the resources; they are immersed in them. "Testimonial smothering" doesn't fit because Kathy isn't self-silencing out of fear; she is narrating in good faith within a corrupted lexicon.

  **Verdict:** Keep "Hermeneutical Capture." It usefully distinguishes between *not knowing* (Fricker) and *knowing wrongly via structured language* (Ishiguro). It highlights that epistemic violence doesn't require silence; it can operate through fluent, coherent speech that never touches the truth. The injustice isn't that they can't speak; it's that their speech is pre-calibrated to exclude the crime.

  ### 2. The Lucy/Emily Dispute (Where the Book Beats the Theory)
  You are right to flag this as the fracture point. Fricker operates on a liberal assumption: epistemic empowerment is inherently good. To close the hermeneutical gap is to grant agency. Ishiguro challenges this: **Truth without political agency is just trauma.**

  **Is Emily defensible on epistemic-injustice grounds?**
  No. Epistemically, she is a perpetrator of hermeneutical injustice. She maintains the rigged vocabulary. However, her defense exposes the limit of Fricker's framework. Fricker assumes the hearer can *act* on the knowledge. If I tell you you're being harassed, you can file a complaint. If Lucy tells the students "You are livestock destined for slaughter," they have no recourse. They cannot flee, revolt, or negotiate.

  Lucy's truth-telling is epistemically virtuous but ethically catastrophic. It strips the students of their "childhood" (the only good they possess) without granting them the power to change their fate. Emily's position is that the lie is a palliative.

  **Why Lucy gets fired and Emily retires:**
  This isn't a bug; it's the system working. Lucy threatens the *stability* of the harvest. If the clones panic, the organs might degrade (stress affects health). Emily maintains the *quality control* of the product by managing the clones' psychological state. The novel suggests that in a totalizing oppression, epistemic clarity is a liability to the oppressed, not an asset. Fricker has no slot for "knowledge that harms the knower because the knower is property."

  **Verdict:** Don't let the group tidy this away. Emily is not defensible morally, but she is functionally correct within the logic of the farm. The book shows that epistemic justice is useless without political justice. Giving a prisoner the concept of "unjust imprisonment" doesn't free them; it just makes the prison harder to bear.

  ### 3. Tommy's Tantrums: Quieting or Something Else?
  You are doing some work here, but it's productive. Strictly speaking, this is **not testimonial quieting**. Dotson defines quieting as an audience failing to recognize a speaker *as a knower* when they are offering testimony. Tommy isn't offering testimony; he is having a somatic reaction to a hermeneutical failure. He feels the wrongness but lacks the language to process it, so it comes out as noise.

  **The Correction:**
  Call it **pre-hermeneutical suppression**. The guardians don't listen to the *content* of the scream because there is no content. They treat the scream as a behavioral glitch to be fixed (pinning him down), not a claim to be heard. This is actually worse than quieting. Quieting implies a rejected proposition. This is the rejection of *affect* as a form of knowing. The system refuses to acknowledge that the body can know the truth before the mind has the words for it.

  **Verdict:** It's not testimonial quieting, but it is a sharper image of epistemic violence. It shows the physical cost of hermeneutical capture. When the vocabulary is rigged, the truth comes out as violence against the self.

  ### 4. Where the Vocabulary Lights Up vs. Where It's Inert

  **Where it lights up:**
  *   **The "Deferral" Myth:** This is the core of your "Hermeneutical Capture." The students have a concept (*deferral*) that implies agency (if we love each other, we can pause death). It keeps them compliant. When they learn it's false, the vocabulary doesn't change, but the hope evaporates. The concepts remained; their *referents* were lies.
  *   **Kathy's Narration:** The fact that she never uses "murder" or "harvest" is the strongest evidence for your hunch. She is not repressing; she is fluent. The language of the farm has become her native tongue.

  **Where it's inert:**
  *   **The Guardians:** Fricker focuses heavily on the hearer's prejudice. In NLMG, the hearers (guardians, society) aren't prejudiced in the standard sense; they are *complicit*. Applying Fricker's "credibility deficit" to the guardians doesn't work because they know exactly what the clones are. They aren't misinterpreting the clones' testimony; they are ignoring it because the clones aren't human. This is ontological exclusion, not epistemic injustice.

  ### 5. Specific Scenes for Rereading

  1.  **Miss Lucy's Outburst (Chapter 6):** She tells them, "None of you will go to America... You were brought into this world for a purpose, and your futures... are set."
      *   *Task:* Look at the students' reaction. They don't revolt. They feel "shame" for making her angry. This proves your point: Truth without agency produces shame, not liberation.
  2.  **The "Deferral" Conversation with Madame (Chapter 22):** Tommy and Kathy ask about the rumor. Madame confirms it's false.
      *   *Task:* Note the vocabulary. Even in denial, Madame uses the system's logic ("art reveals your souls"). She doesn't say "You are meat." She says "Your art proves you have souls, but it doesn't save you." The hermeneutical capture holds even at the end.
  3.  **Tommy's Early Tantrums (Chapter 1):** Kathy describes the boys pinning him.
      *   *Task:* Read this against Dotson. Is this silence? Or is it the enforcement of a specific *kind* of speech (calm, compliant) that the clones cannot yet perform?
  4.  **The Final Confession (Chapter 23):** Kathy talking about Tommy's death. "I just waited a bit, then turned back to the car, to drive off to wherever it was I was supposed to be."
      *   *Task:* This is the ultimate hermeneutical capture. She accepts her destination ("wherever it was I was supposed to be") without naming it (the completion center/death). She narrates her own execution as a commute.

  ### Bottom Line
  Your "Hermeneutical Capture" label works, provided you distinguish it from Fricker's lacuna. The book beats the theory by showing that epistemic clarity is not an intrinsic good if the listener has the power to kill you regardless of what you say. Ishiguro shows that euphemism isn't just a mask for power; it's the *infrastructure* that allows the power to function without resistance. The clones don't resist because they literally cannot formulate the resistance in the language they are given.

  Fricker thinks the solution is better concepts. Ishiguro suggests that if the power structure is absolute, better concepts just make the cage more comfortable, or more painful, but never open the door.
