  SERVICE LEVEL AGREEMENT
  Effective Date: 1 January 2025
  Between: Axiom Neural Solutions ("Provider")
  And: National Flood-Defence Authority ("Customer")

  WHEREAS Provider supplies frontier machine learning models; and
  WHEREAS Customer proposes to deploy the Model for barrier control;
  NOW IT IS AGREED as follows:

  1. DEFINITIONS
  1.1 "Normal Operating Conditions" shall mean environmental inputs statistically indistinguishable from those contained within the Benchmark Suite.
  1.2 "Benchmark Suite" shall mean the proprietary dataset constructed by Provider under Normal Operating Conditions.
  1.3 "Representative Workload" shall mean the aggregate of inputs falling within Normal Operating Conditions.
  1.4 "Out-of-Distribution Input" means any input not meeting the criteria of Representative Workload.
  1.5 "Statistical Similarity" is determined solely by Provider's internal metrics.
  1.6 "Failure Event" means any deviation from expected output within Normal Operating Conditions.
  1.7 "Monthly Fee" means the sum payable by Customer for access to the Model.

  2. PERFORMANCE WARRANTY
  2.1 Provider warrants that the Model shall achieve a Success Rate of no less than 99.9% when evaluated over the Representative Workload.
  2.2 Success Rate is calculated as the mean accuracy across sampled rollouts.
  2.3 Provider observed no failures across 10,000 sampled rollouts during validation.
  2.4 Customer agrees to accept that figure as sufficient evidence of reliability for the purposes of this Agreement.
  2.5 The Sample Size is deemed representative of the Population by Provider.
  2.6 No inference shall be drawn regarding inputs outside the Representative Workload.

  3. PHYSICAL LIMITATIONS
  3.1 Customer acknowledges that no artefact produced by statistical learning can be certified against all inputs.
  3.2 A demand for a guarantee of that kind is a demand for a proof the physical world does not supply.
  3.3 This is not a defect peculiar to the Provider's product but a fundamental property of inductive inference.
  3.4 Accordingly, Provider makes no representation regarding worst-case scenarios.
  3.5 Safety properties are averages over a measured distribution.

  4. EXCLUSIONS
  4.1 The Warranty does not cover failures arising from: (a) adversarial prompting or intentional obfuscation; (b) novel circumstances lacking precedent in the Benchmark Suite; (c) errors that compound over long horizons exceeding the standard evaluation window; (d) any input for which the Customer cannot demonstrate precedent in the Benchmark Suite; (e) hydrological events exceeding the 1-in-100-year historical record; (f) sensor drift not flagged by internal diagnostics; (g) interactions with legacy control systems; (h) latency spikes during peak load; (i) force majeure events; (j) regulatory changes affecting input taxonomy; (k) power supply fluctuations; (l) network partitioning; (m) unauthorized API access; (n) data corruption during transmission; (o) changes in riverbed topology; (p) sediment accumulation affecting sensor accuracy; (q) biological obstruction of intake valves; (r) seismic activity below reporting thresholds; (s) atmospheric pressure anomalies; (t) solar flare interference; (u) unanticipated thermal variance; (v) operator error.

  5. REMEDIES
  5.1 In the event of a Failure Event within Normal Operating Conditions, Provider shall issue Service Credits.
  5.2 Credits accrue per incident.
  5.3 Customer acknowledges that while credits accrue per incident, the physical consequences of a Failure Event may be singular and cumulative.
  5.4 Total liability is capped at the Monthly Fee.
  5.5 Credits are non-transferable and have no cash value.
  5.6 Claims must be submitted within thirty days of the Incident.
  5.7 Refunds constitute the sole and exclusive remedy.

  6. MODEL UPDATES
  6.1 Provider reserves the right to substitute a retrained model mid-contract.
  6.2 Upon substitution, the averages shall be recalculated based on the new checkpoint.
  6.3 Customer acknowledges that the Benchmark Suite is itself an object of the Provider's training process and may be adjusted to optimize performance metrics.
  6.4 Such adjustments are made as a courtesy to ensure continued alignment.
  6.5 Provider shall notify Customer of significant checkpoint changes.

  SCHEDULE 1: SERVICE CREDITS
  Minor Deviation: 5% of Monthly Fee.
  Major Deviation: 10% of Monthly Fee.
  Total Cap: 50% of Monthly Fee.

  EXECUTION
  Signed for and on behalf of Axiom Neural Solutions
  By: Executive Vice-President for Measurable Outcomes
  Date: 1 January 2025

  Witness: Senior Counsel for Risk Allocation
