  I'm writing a chapter on pragmatist theories of truth and want a sanity check on something my supervisor keeps saying. His line: the Peirce/James dispute mostly dissolves once you read Peirce's definition of truth — the belief the community of inquirers would converge on if investigation were carried far enough — as a limit in the calculus sense. The sequence of successive theories approaches it, nobody ever lands on it, but it's determinate all the same; and James's insistence that truths get made true by events is just the same structure described from inside the process rather than from the end of it. So they aren't really disagreeing, they're just emphasizing different parts of one picture.

  Can you audit the analogy for me? I want what maps onto what, which features of the mathematical case get quietly imported into the epistemic one, where the mapping breaks, and — the part I actually care about — which of those breaks bear on his irenic conclusion and which are harmless. If there's a better analogy for Peirce's view, tell me what it is and what it costs. Assume I know both texts, I dont want exegesis or history.

  Answer in British English, and give me exactly seven numbered points of a sentence or two each, with no introduction and no conclusion: the first three on the mapping and what it smuggles in, the next three on the disanalogies that do real damage (seperate those from the ones that don't), and the seventh on whether his conclusion survives and what I should say in its place. Be committed: take a side and give reasons, don't hand me a menu of readings and leave me to pick.
