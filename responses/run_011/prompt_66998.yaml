answer: |-
  You have not mis-set the setup. Your technical grasp is sound: the couples problem is indeed the rupture point where existence fails and strategy-proofness evaporates, and the NRMP's public guidance does gloss over this asymmetry. The "applicant-proposing" shift was explicitly justified by strategy-proofness (Roth & Peranson, 1999), but that guarantee is conditional on the domain, and couples break the domain.

  Since you are asking for the philosophical presuppositions rather than the mechanism design, I will treat the instruction ("rank truthfully") as a speech act embedded in an institution. Here is what that instruction presupposes about the agents, the nature of preference, and the role of the mechanism.

  ### 1. The Ontology of Preference: Reporting vs. Constituting
  You ask if the instruction assumes preferences are fixed and fully known ex-ante. **Yes, absolutely.**

  The mechanism treats the Rank Order List (ROL) as a *measurement* of a pre-existing state, not a *decision* made under uncertainty. For the advice "you can't be hurt by truth-telling" to be coherent, the agent must possess a complete, transitive ordering over outcomes *before* interacting with the mechanism.

  This presupposes a **static self**. It rules out models where preferences are endogenous to the market process (e.g., "I want Program A more because I got an interview there," or "I want Program B less because I heard the match rate is low"). If preferences are constructed *during* the ranking phase based on signals about competitiveness, "truth-telling" is category error. There is no "truth" to tell until the strategic calculation is done.

  By instructing applicants to ignore strategy, the NRMP is enforcing a **separation of spheres**: the market is for allocation, not for preference formation. It demands that you decide what you want in a vacuum, then hand that decision over. This is a strong rationalist assumption that ignores the sociological reality of how medical residents actually form desires (through signaling, prestige hierarchies, and peer influence).

  ### 2. The Epistemology of Agency: Protection vs. Morality
  You ask if strategy-proofness is a norm about honesty or about protecting those who can't compute a best response.

  Philosophically, the instruction conflates the two, but its *function* is the latter. If strategy-proofness were about moral honesty, the mechanism would need a way to verify truth, which it doesn't. Instead, it makes truth-telling a *dominant strategy* (for singles) so that moralizing is unnecessary.

  However, the instruction presupposes **bounded rationality as a vulnerability to be managed, not a skill to be tested.**
  *   **If it were about honesty:** It would imply lying is inherently wrong.
  *   **If it is about protection:** It implies the market is adversarial, and the mechanism is a shield.

  The instruction tells the applicant: "You do not need to be a game theorist to participate safely." This presupposes that **fairness is defined as cognitive accessibility.** If we allowed manipulation (your tax evasion point), fairness would shift from *access* to *resources*. Only those who could afford consultants to compute the optimal manipulation would benefit.

  So, the instruction presupposes that the **cost of strategic reasoning is a barrier to entry** that the mechanism ought to remove. It treats the inability to compute a best response as a protected class, effectively.

  ### 3. The Normative Structure: Rights vs. Welfare (Ordinality)
  You note the instruction carries order, never intensity, contrasting with ER triage. This is the crucial normative disconnect.

  The matching market is deontological, not consequentialist.
  *   **ER Triage (Consequentialist):** Maximizes aggregate health outcomes. Intensity matters (urgency).
  *   **Matching Market (Deontological):** Maximizes stability (no blocking pairs). Rights matter (priority).

  The instruction presupposes that **claims to positions are based on compatibility and priority, not need.** A resident who "desperately" needs a specific city for family reasons has no greater *claim* than one who merely "prefers" it, provided their priority (program ranking of them) is the same.

  By forcing ordinality, the mechanism assumes that **interpersonal comparisons of utility are impossible or illegitimate.** It refuses to adjudicate whose desire is more urgent. This is a liberal neutrality constraint. If the mechanism allowed intensity (cardinal utilities), it would have to weigh the suffering of a separated couple against the efficiency loss of a program getting a lower-ranked resident. The instruction "rank truthfully" sidesteps this by saying, "We don't measure suffering, we measure order."

  ### 4. The "Tax Evasion" Counterfactual
  You ask what changes if we treat manipulation like tax evasion (permitted, audited, sanctioned).

  **Technically, this is impossible.** You cannot audit a preference. You can audit income; you cannot audit whether an applicant *really* preferred Program A over Program B. There is no external ledger of the soul.

  **Philosophically, however, the shift would be from Trust to Verification.**
  *   **Current Model:** Trust the mechanism design to make truth optimal. (Mechanism as Guardian).
  *   **Tax Model:** Trust the regulator to punish lies. (Mechanism as Policer).

  If you dropped strategy-proofness as a design goal:
  1.  **Market Thinning:** Applicants would hide their true top choices (fear of rejection/waste). This destroys the efficiency gains of the centralized clearinghouse. The "truth-telling" instruction is actually a **coordination device** to maintain market thickness. It tells everyone, "Don't hide your top choice, or the market breaks."
  2.  **Legitimacy:** The current model derives legitimacy from *mathematical guarantee* ("The theorem says you're safe"). The tax model would derive legitimacy from *enforcement* ("We caught the cheaters"). Since preference cheating is unenforceable, legitimacy would collapse.
  3.  **The Couples Exception:** Interestingly, for couples, we are *already* in the tax evasion model. There is no guarantee. They are told "think carefully." The market tolerates instability and strategy for couples because the volume is low enough that it doesn't threaten the whole system. This suggests the "truth-telling" norm is **utilitarian for the aggregate, not deontological for the individual.** It is enforced for singles because singles are the bulk of the market stability; it is relaxed for couples because fixing it is too hard.

  ### 5. The "Noble Lie"
  Finally, to your point about the lopsided guarantee. The instruction presupposes that **stability is more important than consistency.**

  The NRMP knows the theorem doesn't hold for couples. Yet, they generally advise couples to rank pairs they actually want. Why? Because if couples start gaming the system aggressively, it increases the likelihood of *no* stable matching existing, which harms everyone (including singles).

  The instruction presupposes that **individual rationality must be subordinated to systemic stability.** Telling couples "truth-telling is safe" (even if technically false) might be a stabilizing fiction. If couples believe they must manipulate, they might submit shorter lists or uncoordinated lists, increasing the probability of algorithmic failure.

  ### Summary
  The instruction "truth-telling is a dominant strategy" presupposes:
  1.  **Preferences are exogenous objects** to be reported, not constructed.
  2.  **Cognitive burden is a fairness issue**; the mechanism must protect the unsophisticated.
  3.  **Claims are ordinal**, rejecting intensity/urgency as a valid currency for allocation.
  4.  **Stability requires a coordinating fiction.** Even where the theorem fails (couples), the norm is maintained to prevent market thinning.

  You aren't missing a theorem; you're spotting the place where the engineering requires a philosophical sleight of hand to function. The mechanism works *because* participants believe the instruction more than they believe the counterexamples.
