  **Scenario**

  A mid-sized municipality operates a public "Integrity Registry" for citizens convicted of minor non-violent offenses (e.g., petty theft, fraud under $500), which local employers routinely check during hiring. Currently, removal from the Registry requires a discretionary hearing before a civic board that evaluates the offender's "moral rehabilitation," a process averaging two years with a 40% rejection rate. The city proposes replacing this board with an automatic expungement market: any registrant may pay a fixed fee to remove their name immediately, with revenue funding victim restitution. The Registry is explicitly designed to function as a low-cost signaling mechanism for trustworthiness in the local labor market, and the fee is set high enough to cover administrative costs but low enough to be affordable for a median-income worker saving for six months.

  ***

  **Analysis of the Reversal**

  **Camp A (Corruption/Degradation): The Case for the Market**
  Standard Camp A reasoning holds that putting a price on moral standing commodifies virtue, degrading the good. Here, however, the structural alternative is a bureaucratic inquisition into "moral rehabilitation." Camp A argues that the discretionary board treats the citizen as a supplicant begging for the state's moral forgiveness, which expresses a relationship of domination and degrades the citizen's status as an autonomous agent. By contrast, the market transaction treats the record as a liability owned by the individual that they may discharge. Paying the fee expresses the attitude that the debt is settled and the individual is reclaiming ownership of their social standing, rather than waiting for the state to deem them worthy. The price does not corrupt the good; the *discretion* corrupts the good. The market restores the proper sphere of social interaction by removing the state from the business of judging moral character.

  **Camp B (Market Legitimacy/Design): The Case Against the Market**
  Standard Camp B reasoning holds that voluntary exchange is presumptively efficient and repugnance is merely a constraint. Here, however, the "good" being traded is a *signal*. Camp B argues that the Registry functions only insofar as it conveys reliable information to employers. If removal is automatic upon payment, the absence of a name no longer signals "trustworthy"; it signals "wealthy enough to pay." This creates a "lemons" problem: employers will discount the value of a clean record, reducing the incentive for honest behavior ex-ante. Furthermore, because the signal is positional, the market does not clear efficiently; it inflates the cost of signaling without increasing the total amount of trust in the system. The market mechanism destroys the informational utility of the good itself. It is not a legitimate market because the product (reliable information) is self-defeating under price allocation.

  **The Single Feature Doing the Work**
  The reversal hinges entirely on this sentence: *"The Registry is explicitly designed to function as a low-cost signaling mechanism for trustworthiness in the local labor market."*
  If you delete this sentence, the case collapses back to the normal direction. Without the signaling function, Camp B loses the "market failure" argument; if the Registry is just a public record with no economic consequence, Camp B would likely say "let them pay to remove it, it's their data." Without the signaling function, Camp A loses the "state domination" argument; if the record is private, the discretionary board is less intrusive, and the market looks more like simple corruption of justice. The signaling nature makes the good *informational*, which flips Camp B's efficiency calculus, and makes the state's role *evaluative*, which flips Camp A's degradation calculus.

  **Settled vs. Contested Claims**

  *   **Settled:** There is broad agreement that objections to markets fall into distinct families (harm/exploitation vs. corruption/degradation). It is also settled within economics (Camp B) that markets for *signals* are prone to collapse if the signal becomes decoupled from the underlying quality (Spence/Akerlof models).
  *   **Contested:** Whether "corruption/degradation" is a free-standing moral consideration is live. Camp A is extrapolating here: they are claiming the *expression* of the transaction matters independently of the welfare outcome. Many critics argue this is just a preference (taste) stapled onto a moral claim.
  *   **Contested:** The empirical claim that "pricing crowds out norms" (Camp A's usual worry) is not fully nailed down; here Camp A argues pricing *crowds in* agency. This is theoretically possible but empirically disputed in behavioral economics.

  **Best Attacks from Each Side**

  **Camp B's Attack on Camp A:** "Your argument about 'agency' and 'domination' is a welfare argument in disguise. You only support the market because the bureaucratic alternative is slow and humiliating (harm). If the board were efficient and kind, you would oppose the market. Therefore, you don't actually care about commodification; you just care about bad institutional design."
  *   *Strength:* High. It exposes Camp A's reliance on the specific flaws of the current institution rather than a principled stand on markets.

  **Camp A's Attack on Camp B:** "Your argument about 'signal collapse' is corruption talk with the word 'externality' stapled on. You aren't saying the market is inefficient; you're saying it produces the *wrong kind of society* (one where trust is bought). If employers simply adjusted the signal (e.g., asked for credit checks instead), the market would work. You are protecting a social norm (meritocratic trust) and calling it a market failure."
  *   *Strength:* Medium-High. It challenges Camp B to prove the market failure is technical, not normative. However, signaling collapse is a robust economic model, making this harder to land than B's attack on A.

  **Which Attack Lands Harder?**
  Camp B's attack lands harder. Camp A's position is more vulnerable to the charge that they are merely comparing a bad bureaucracy to a market, rather than defending markets on principle. If the bureaucracy were reformed, Camp A's reason for supporting the market evaporates, suggesting their "anti-degradation" stance is contingent on harm, not principle. Camp B's objection regarding signaling is structurally internal to market mechanics; even with perfect institutions, a market for fake signals fails.

  **Honest Assessment: Commodification or Institutional Design?**
  This case risks dissolving into ordinary institutional design. The reversal works only because the *current institution* is particularly degrading (discretionary moral judgment). If the status quo were "automatic expungement after 5 years," Camp A would likely oppose the market (why pay if you can wait?), and Camp B might support it (option value). This suggests the case is not truly about the *moral limits of markets* but about *comparative institutional analysis*.
  However, it remains a valid PPE case because it forces students to disentangle whether their objection is to the *price mechanism* itself or to the *context* in which it operates. If Camp A cannot explain why paying is better than waiting even if the wait were dignified, they are not truly Camp A. If Camp B cannot explain why the signal collapse is different from any other quality variance, they are not truly Camp B. The case succeeds if it reveals that "repugnance" is often just a proxy for "bad design," but fails if students conclude there is no distinct moral question here at all.
