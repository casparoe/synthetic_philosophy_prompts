  Tension: The stability of the diachronic claim when certainty is relaxed to match actual scientific practice.
  If you concede scientists never hold credence one, does commitment three collapse into allowing updates, or does replacing certainty with 0.999 gain you nothing diachronically?
  Most likely reply: It gains nothing diachronically because the logical relation remains static regardless of the precise probability assigned to E.
  Follow-up: Then why invoke the probabilistic claim at all if the diachronic prohibition holds even without strict certainty?

  Tension: The feasibility of isolating E from the background web in complex historical cases.
  In the Mercury case, the anomaly is stated using orbital parameters derived from the very observations you say must be erased; how do you construct a baseline without losing the conceptual vocabulary needed to state the hypothesis?
  Most likely reply: The baseline retains the theoretical vocabulary but strips only the specific empirical inputs that constitute the evidence E and its dependencies.
  Follow-up: But if those empirical inputs are what fix the referents of your parameters, doesn't stripping them leave you with a baseline too thin to evaluate the theory at all?

  Tension: The normative force of the synchronic measure if diachronic rationality requires no change.
  If an agent's actual credence in T remains low despite your measure showing high support, is she irrational, or is your measure merely descriptive of a logical relation?
  Most likely reply: She is not irrational diachronically, but her credence fails to match the objective support relation defined by the counterfactual baseline.
  Follow-up: If rationality does not require aligning credence with this support, in what sense does your measure guide scientific reasoning rather than just cataloging it?

  Tension: Distinguishing accommodation from prediction within the counterfactual framework.
  If a theorist constructs T specifically to entail E after seeing E, does your erasure procedure yield a different support value than if T had been formulated before E was known?
  Most likely reply: No, the support value depends only on the logical relation and the baseline evidence, not on the historical order of construction.
  Follow-up: Then how does your view capture the intuitive confirmation deficit we assign to theories built solely to fit known data?

  Tension: The source of the differential support within the measure itself.
  You claim the eclipse data supports GR more than the Mercury data; what specific feature of the eclipse evidence set, once erased, yields a higher counterfactual boost than the Mercury evidence set?
  Most likely reply: The eclipse evidence is probabilistically independent of more competing hypotheses than the Mercury evidence is.
  Follow-up: But if both are entailed by GR, doesn't the difference in support stem from the prior probability of GR, which you said should be agent-independent?

  Tension: The empirical vulnerability of the measure.
  Can you name a case where your measure yields near-zero support, yet you would concede the scientific community was rational to treat the theory as strongly confirmed?
  Most likely reply: I cannot concede that, because on my view rational confirmation just is the existence of that support relation relative to the total evidence.
  Follow-up: So if our intuitions about rational confirmation diverge from your measure's output, must we always reject the intuitions rather than adjust the measure?

  Tension: Internal coherence of the synchronic measure given the diachronic split.
  Granting your separation of support from credence movement, does your synchronic measure require that the logical probability of T given E exists prior to the agent's derivation of the entailment?
  Most likely reply: Yes, the support relation is objective and timeless, independent of the agent's psychological state.
  Follow-up: If the relation exists prior to discovery, why does the measure only become accessible once the agent performs the derivation you say changes nothing?

  Tension: The uniqueness claim regarding renormalization after total erasure.
  You insist the baseline is uniquely determined after erasure; what prevents two agents with different prior distributions over the remaining evidence from arriving at different baseline credences for T?
  Most likely reply: The priors are fixed by the principle of indifference over the logical possibilities remaining after erasure, not by individual psychological history.
  Follow-up: But why should we accept that principle of indifference as binding on rational agents rather than as just another subjective choice?

  Tension: The psychological plausibility of no credence change.
  If discovering that T entails E provides no rational pressure to increase credence in T, what explains the widespread scientific practice of treating such discoveries as major confirmatory events?
  Most likely reply: Scientists confuse the recognition of high synchronic support with the need for diachronic updating.
  Follow-up: If this confusion is universal among experts, doesn't that suggest your distinction fails to capture the normative structure of actual scientific inference?
