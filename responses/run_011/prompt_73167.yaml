answer: |-
  This is a classic "accidental jurisprudence" problem. You are fourteen months into building a constitutional convention without a written theory, relying on heuristics that have—until now—conveniently overlapped. The Chair's heuristic ("follow the money/vote") and the Junior's heuristic ("follow the externality") are now in direct conflict. The Chair says Vessane pays, so Vessane decides. The Junior says the market effect crosses borders, so the Federation decides.

  Here is the breakdown of the principles your record actually supports, the prediction on how the room will vote, the recommendation for consistency, and the trap case you should prepare.

  ### 1. The Three Candidate Principles
  You mentioned you see three rules in your record. Based on your case list, here are the three doctrines your precedents jointly sustain, though they tension each other:

  **A. The "Common Pool" Doctrine**
  *   **Derived from:** Fertiliser Runoff, Electoral Rolls, Pandemic Powers, Corporate Tax Base.
  *   **The Rule:** When a resource, risk, or system is inherently shared or susceptible to a "race to the bottom," competence defaults to the Federal level.
  *   **Implication for Vessane:** **Federal Competence.** The internal market is a "common pool." If every region sets its own procurement standards, the market fragments (as the suppliers argue). The "leakage" argument (Vessane farmers selling non-compliant meat elsewhere) suggests the policy fails to protect the "shared resource" (animal welfare) effectively, mirroring the Runoff logic where local action was insufficient for a shared basin.

  **B. The "Barrier to Persons" Doctrine**
  *   **Derived from:** Language Fluency, School Qualifications.
  *   **The Rule:** Regions may regulate *things*, but they may not erect barriers to *people* moving or working.
  *   **Implication for Vessane:** **Regional Competence (with caveats).** This is the tricky one. Your Language precedent blocked a rule that stopped a person from *taking a job*. Vessane's rule stops a *company* from *selling goods*. If you distinguish between "labor mobility" (Federal protection) and "market access for goods" (Regional freedom), Vessane wins. This aligns with the Short-term Lets case: a national platform was blocked from operating freely to protect local housing.

  **C. The "Public Purse" Doctrine**
  *   **Derived from:** Disability Income, Restaurant Licensing, Short-term Lets.
  *   **The Rule:** If the region is spending its own money on its own public services, it has wide latitude to set higher standards than the Federal floor, even if it creates administrative friction.
  *   **Implication for Vessane:** **Regional Competence.** Vessane is not regulating private sales; it is setting conditions on its own procurement budget (hospitals, schools). This matches the Disability precedent (Federal floor, regional top-up) and the Lets precedent (local social goal trumps national business model).

  ### 2. The Prediction: What will you actually vote?
  **Verdict:** You will recommend **Regional Competence (Allow Vessane's Plan).**

  **Reasons:**
  1.  **Path of Least Resistance:** Your Commission "pattern-matches off the EU's subsidiarity language." In EU jurisprudence (and your Short-term Lets case), local social policy objectives often trump market fragmentation *if* the measure is proportionate and funded locally.
  2.  **The Chair's Hegemony:** In every case so far, the "Who Pays" test has won when the "Cross Border" effect was commercial rather than physical. Runoff was physical (poison); Meat is commercial (contracts). The Chair's heuristic is politically safer for your members than telling a region they can't spend their own tax money on their own ethical values.
  3.  **The "Floor" Precedent:** You have already established that Federal standards are floors, not ceilings (Disability, Corporate Tax rates). Vessane's argument rests entirely on this. To deny them now requires distinguishing "tax rates" from "procurement standards," a nuance your precedent doesn't currently support.
  4.  **Avoiding the "Language" Trap:** You will likely distinguish this from the Language Fluency case. You will argue that excluding a *supplier* is not the same as excluding a *worker*. It's a distinction without a huge difference, but it allows you to vote "Yes" without explicitly overturning the Language precedent.

  **The Compromise:** Expect the recommendation to include a "Mutual Recognition" clause. Vessane can demand high welfare, but they must accept certifications from other regions that are *equivalent*, not just identical. This mirrors the School Qualifications compromise.

  ### 3. The Recommendation: What should you vote for consistency?
  **Verdict:** You should recommend **Federal Framework Competence.**

  **Reasons:**
  1.  **Consistency with "Language Fluency":** The principle behind blocking the language requirement was that regional rules shouldn't burden the freedom to *work* across borders. A supplier excluded from a public contract is effectively barred from working in that region. If you allow Vessane to ban out-of-region meat, you undermine the logic used to protect the postal sorter.
  2.  **Consistency with "Corporate Tax":** You centralised the tax *base* to prevent regions undercutting each other. Procurement standards function similarly to a tax base: they define the rules of economic engagement. If Region A requires Box A and Region B requires Box B, you create the exact fragmentation you prevented in the Tax case.
  3.  **The "Leakage" Reality:** Your Runoff precedent established that if local action doesn't solve the problem (because the harm leaks), competence shifts Federal. The suppliers' argument is that Vessane's rule creates *negative* welfare outcomes (animals raised poorly elsewhere). If the Commission cares about the *outcome* (welfare) rather than the *process* (spending), the policy is counter-productive.
  4.  **The Fix:** Recommend a **Federal Public Procurement Standard.** Regions can pay *more* (Disability model), but they cannot define *different technical criteria* that exclude compliant Federal suppliers. This preserves the "Public Purse" right to spend more, but protects the "Internal Market" from fragmentation.

  ### 4. The Commitments & The Trap Case
  By voting on Vessane, you are codifying a principle whether you like it or not.

  **If you Allow Vessane (Regional Competence):**
  *   **Commitment:** You commit to the principle that **Ethical Protectionism is a Regional Right.** A region can use its spending power to shield local producers or impose local values on the supply chain, even if it fractures the national market.
  *   **The Trap Case to Table Next Year:** **"The Local Hire Subsidy."**
      *   *Scenario:* A region announces a tax credit for any private company that sources 50% of its raw materials from within the region.
      *   *Why it traps you:* If you allowed Vessane's procurement ban, you cannot logically block a subsidy that achieves the same protectionist end. If you block the subsidy, you admit that Vessane was actually about market protection, not ethics. This forces you to define the line between "spending on values" and "distorting competition."

  **If you Block Vessane (Federal Competence):**
  *   **Commitment:** You commit to the principle that **The Internal Market Trumps Local Ethical Spending.** You establish that regions cannot use procurement as a backdoor to regulatory autonomy.
  *   **The Trap Case to Table Next Year:** **"The Regional Arts Grant."**
      *   *Scenario:* A region creates a fund that only artists residing in the region for 5+ years can apply for.
      *   *Why it traps you:* This is the "Language Fluency" case in disguise. If you blocked Vessane to protect market mobility, you must block this. But if you allow this (as "cultural support"), you admit that Vessane could have been allowed as "ethical support." It forces you to decide if "Goods" are more protected than "Services/People."

  ### Summary Advice
  You are worried because you sense the **Chair's Test** (Fiscal) and **Junior's Test** (Externality) are decoupling. They are.

  If you want to survive the next five years without Parliament questioning your authority, **vote to Allow Vessane but write the reasoning narrowly.** Anchor it in the **Public Purse Doctrine**. Explicitly state: *"This recommendation applies only to direct regional expenditure on public services, not to general regulatory bans on private trade."*

  This keeps the "Short-term Lets" precedent safe, distinguishes the "Language" precedent (which was about rights, not spending), and kicks the hard "Internal Market" question down the road. Then, table the **Local Hire Subsidy** case next year. That is the case that will force you to write down the actual principle, because the "Public Purse" excuse won't cover private tax credits. Better to fight that battle when you have more precedent behind you.
