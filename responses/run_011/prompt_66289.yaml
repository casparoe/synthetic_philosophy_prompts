answer: |-
  Let us begin by clearing the ground. When we speak of a 'principle of indifference', we are actually gesturing at three distinct philosophical animals, and confusing them is the source of most paradoxes.

  First, there is the **Logical Principle** (Keynes's territory). This suggests that probability is a relation of entailment between evidence and hypothesis. If evidence $E$ does not distinguish between $H_1$ and $H_2$, then $P(H_1|E) = P(H_2|E)$. The trouble, as you have found, is that 'distinguish' is sensitive to description. $E$ might not distinguish between a bias of $p$ and $1-p$, but does it distinguish between a bias of $p$ and $p^2$? Logical indifference tends to collapse into paradox unless the partition is logically unique, which it rarely is outside of finite, symmetric cases like dice.

  Second, there is the **Subjective Principle** (the Bayesian pragmatic). Here, indifference is merely a codification of your personal state of ignorance. It is a tool for getting started. If you find the Bertrand results unsettling, this view says you are mistaken to be so; any coherent prior is permissible. But this contradicts your intuition in case (1), where you feel 1/2 is *correct*, not merely permissible. You want objectivity, not just consistency.

  Third, there is the **Physical or Causal Principle**. This locates the justification for indifference not in our minds, nor in logic, but in the world. Indifference is licensed only when the physical generating mechanism possesses a symmetry that renders outcomes equiprobable. A fair coin yields 1/2 not because we are ignorant, but because the tossing mechanism is symmetric under rotation. This is the most robust foundation, but it is also the most restrictive. It demands we ask not 'what do I know?' but 'how is this produced?'.

  If you seek a simple, self-consistent system that respects your strongest intuitions while avoiding paradox, you must adopt the **Causal Symmetry Principle**. Indifference is licensed over a partition if and only if that partition corresponds to the invariant degrees of freedom in the causal mechanism described. Where no mechanism is specified, or where the description severs the link between mechanism and magnitude, the probability is undefined.

  This principle requires a sacrifice, though perhaps not the one you fear. You do not need to abandon the verdict in (1), but you must abandon the *reason* you currently hold for it. Let us apply the principle to your four cases.

  **Case (1): The Coin.**
  Your current justification is indifference over the bias parameter $p \in [0,1]$. Under the Causal Symmetry Principle, this is technically suspect; there is no physical reason the 'bias' must be uniformly distributed rather than, say, the log-odds. However, the verdict $P(H)=1/2$ survives. Why? Because the symmetry is not in the *barrel's distribution of biases*, but in the *coin toss itself*. Unless you have evidence that the coins in the barrel are systematically heads-biased rather than tails-biased, the situation is symmetric under the transformation $H \leftrightarrow T$. For every coin with bias $p$, there is no reason to prefer it over a coin with bias $1-p$. This symmetry forces the expected bias to be 1/2 without requiring a uniform distribution over $p$. You keep the verdict, but the justification shifts from 'ignorance of bias' to 'symmetry of outcomes'.

  **Case (2): Bertrand's Chord.**
  Here, the description 'chosen at random' is empty of causal content. A chord does not generate itself. It must be drawn by a hand, dropped by a needle, or selected by a coordinate algorithm. Since the problem description specifies no mechanism, there are no symmetries to exploit. The Causal Symmetry Principle dictates that the question is undefined. Your verdict stands firm.

  **Case (3): The Cube Factory.**
  This is the crucial test. Why is 'edge' canonical? Because the word 'factory' implies a manufacturing process. In physical engineering, machines are calibrated to control linear dimensions (length), from which area and volume are derived derivatives. The causal mechanism acts on the edge. Therefore, the symmetry of ignorance applies to the edge length, not the derived magnitudes. Your intuition is correct, but again, not because of logic; it is because of physics. The 'factory' supplies the missing causal story that Bertrand's circle lacked.

  **Case (4): The Enriched Cube.**
  You feel this is worse than (2), and you are right. In (2), the mechanism is unspecified. In (4), the mechanism is explicitly obscured. We are told uniformity exists over *some* magnitude, but the link between the physical control and the mathematical parameter is severed. We cannot apply indifference to the edge because we are told the uniformity might lie in the volume. We cannot apply indifference to the volume because it might lie in the edge. This second-order ignorance blocks the application of the Causal Symmetry Principle entirely. It is not just indeterminate; it is incoherent as a probability problem. This verdict must go in the bin with Bertrand.

  **The Sacrifice.**
  To maintain consistency, you must accept that **Case (1) and Case (3) are legitimate only because they imply a physical symmetry, whereas Case (2) and Case (4) do not.** If you were to describe the coin barrel as 'containing coins produced by a machine that uniformly distributes the *square* of the bias', your 1/2 verdict would vanish, just as the cube verdict would vanish if the factory calibrated by volume. You must surrender the idea that indifference is a default setting for ignorance. It is a deduction from physical description.

  **New Cases: The Book.**
  Consider your example: 'The book has between 1 and 100 pages, so 1/2 that it's under 50.'
  Under the Causal Symmetry Principle, this depends entirely on how the book came to be. If this is a puzzle where an integer $N$ is *chosen* from 1 to 100, the selection mechanism is canonical (counting integers), and 1/2 is defensible. Discrete counting units often provide a natural partition that continuous magnitudes lack, because they are invariant under scaling (one cannot have 1.5 pages in a count).
  However, if this refers to a physical book selected from a library, the verdict fails. Books are not produced with a uniform distribution over page counts; novels cluster around certain lengths, textbooks around others. Without a 'random book generator' that is specified to be uniform over page counts, the probability is undefined. The description 'The book has...' denotes a property, not a selection procedure. Do not be seduced by the discrete numbers; without a causal story of selection, it is as undefined as Bertrand's chord.

  **Explaining the Difference.**
  Does this explain the difference between (2) and (3), or merely relabel it? It explains it. The difference is not mathematical; it is linguistic and ontological. 'Chord' is a geometric abstraction; 'Factory' is a causal agent. In (3), the language invokes a process where length is the independent variable. In (2), the language invokes a static state with no genesis. The paradox arises only when we treat geometric abstractions as if they were physical outcomes.

  **Conclusion.**
  Your tentative principle was close: 'indifference is licensed... just when the problem description makes that partition canonical.' I refine this: **Canonical means causally primitive.**
  To be consistent, you must view (1) and (3) as successes of causal modelling, and (2) and (4) as failures of description. If you encounter a case where the causal mechanism is truly unknown (a 'black box'), you must resist the urge to assign a number. It is better to say 'I do not know' than to smuggle in a uniformity assumption that the physics does not support. This will cost you some convenience, but it will purchase you consistency.
