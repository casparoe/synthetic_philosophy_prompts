  3.  **Identify Distinct Theses:**
      *   *Thesis A (Metaphysical/Causal):* The past is causally inaccessible. (You can't change the past).
      *   *Thesis B (Normative/Temporal):* Rational assessment is forward-looking only. (Only future consequences matter).
      *   *Thesis C (Epistemic):* Correlations with the past are irrelevant to choice. (News vs. Cause).
      *   *Thesis D (Emotional/Regret):* Regret is irrational if it doesn't guide future action. (Don't "cry").

  4.  **Evaluate Each Thesis:**
