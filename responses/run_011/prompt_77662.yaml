  2.  **Deconstruct "Don't Cry Over Spilt Milk" in this Context:**
      *   *Literal Meaning:* Past events cannot be changed; worrying about them is useless.
      *   *CDT Application:* Past causal nodes are fixed. Current actions cannot influence them. Therefore, optimize only for future consequences.
      *   *Context 1 (Hitchhiker):* Driver's prediction is past. Paying now doesn't change the prediction. Cost of paying > Benefit (since ride is already secured). -> Don't pay.
