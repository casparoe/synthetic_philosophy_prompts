      *   *Cost:* To reconcile, we must prioritize *honesty about the source of conviction* over the *exclusion of religious language*. The "wrong" in Case 1 isn't the religious language, it's the implication that the public reason *needs* religious support, or that the religious reason carries state weight.
      *   *Actually, the user says Case 1 is wrong.* I need to tell them that Case 1 and Case 3 are inconsistent unless we distinguish between *supplementing* vs. *substituting*.
