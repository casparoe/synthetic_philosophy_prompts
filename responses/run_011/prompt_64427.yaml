  4.  **Addressing the "Engineer" Questions:**
      *   *Q1: Reasons offered vs. Reasons held?* It must be about reasons *offered* for accountability, but constrained by *held* for integrity. (Addresses Case 2).
      *   *Q2: Phrasing vs. Justification?* It's not just style. It's about *accessibility*. If the phrasing makes it inaccessible, it fails. But Case 8 shows translation can fail. So it's about *substantive accessibility*, not just vocabulary.

