answer: |-
  Here are eight questions designed to press the structural weaknesses of hybrid expressivism, specifically targeting the Frege-Geach problem, disagreement, and semantic idleness. They are formatted for oral delivery: **The Question**, the **Likely Answer** (to help you anticipate her move), and the **Follow-up** (to close the escape route).

  ### 1. The Negation Problem: What is Negated?
  **Question:** When I assert "Lying is not wrong," what exactly is being negated? Is it the belief that ideal observers would disapprove, the attitude of disapproval itself, or both?

  **Likely Answer:** She will likely say the belief component is negated (i.e., you believe ideal observers *wouldn't* disapprove), while the attitude is simply absent.

  **Follow-up:** If the negation operates solely on the descriptive belief, then "Lying is not wrong" is just a sociological claim about ideal observers. But surely I can deny that lying is wrong while granting that ideal observers would disapprove. If your view can't capture *that* denial, haven't you just relocated the expressivist's negation problem into the belief component?

  ### 2. The Negation Problem: The Locus of Disagreement
  **Question:** Suppose I say "Lying is wrong" and you say "Lying is not wrong." On your view, we definitely disagree in attitude. But do we *also* disagree in belief?

  **Likely Answer:** She will say yes, we disagree in belief because we hold contradictory views about what ideal observers would do.

  **Follow-up:** If our moral disagreement is fundamentally a disagreement about the psychology of ideal observers, why does moral argument look so different from sociological argument? If I concede the sociological fact but maintain my moral judgment, your view implies I'm being irrational. Why should the semantics force that result?

  ### 3. Conditional Embeddings: The Attitude in the Antecedent
  **Question:** Consider the premise: "If lying is wrong, then getting your brother to lie is wrong." In entertaining this antecedent, do I actually hold the attitude of disapproval toward lying?

  **Likely Answer:** She will likely say no, I don't actually disapprove; I'm only considering the proposition hypothetically.

  **Follow-up:** If I don't hold the attitude in the antecedent, then the attitude component is absent from the meaning of "wrong" in that context. But if the meaning of "wrong" changes depending on whether it's asserted or embedded, you've violated compositionality. How do you keep the meaning stable without the attitude?

  ### 4. Conditional Embeddings: Hypothetical Attitudes
  **Question:** Let's press the previous point. If you insist the attitude *must* be present for the meaning to remain constant, am I supposed to be "hypothetically disapproving" in the antecedent?

  **Likely Answer:** She might try to argue that I am expressing a higher-order attitude toward the combination of attitudes.

  **Follow-up:** This gets psychologically very thick, very fast. If understanding a simple conditional requires me to harbor complex, nested hypothetical attitudes, aren't you making the semantics of moral language vastly more complicated than the descriptivist's, without gaining any explanatory power on validity?

  ### 5. Disagreement: Same Belief, Different Attitude
  **Question:** Imagine two people who agree on all the non-moral facts, including the fact that any fully informed observer would disapprove of lying. But one disapproves of lying, and the other doesn't. On your view, do they morally disagree?

  **Likely Answer:** She will say yes, they disagree in attitude, which is sufficient for moral disagreement.

  **Follow-up:** If they agree on the descriptive property that *constitutes* the belief component of "wrongness," then semantically they agree on the truth conditions. If they still disagree morally, doesn't that prove the attitude is doing all the work? And if the attitude is doing all the work, why do we need the belief component at all?

  ### 6. Disagreement: Same Attitude, Different Belief
  **Question:** Now reverse it. Two people both disapprove of lying. But one believes ideal observers would disapprove, and the other believes ideal observers would approve. Are they in moral agreement?

  **Likely Answer:** She will likely say they are in partial agreement (attitude) but factual disagreement (belief).

  **Follow-up:** But intuitively, if we both disapprove of lying, we are on the same moral side, even if I'm confused about the metaphysics. If your view says we are in disagreement because our descriptive beliefs diverge, aren't you making moral agreement too easy to break? It seems you're prioritizing the descriptive belief over the moral stance.

  ### 7. Logical Validity: The Role of the Attitude
  **Question:** In a valid moral argument, does the attitude component play any role in securing validity? Or is validity secured entirely by the belief component?

  **Likely Answer:** She will admit validity is secured by the belief component, as attitudes aren't truth-apt.

  **Follow-up:** If validity is secured entirely by the descriptive belief component, then the argument is valid *qua* descriptive argument. So, when we praise moral reasoning as "valid," are we actually just praising sociological reasoning? It seems the "moral" part of the argument is logically inert.

  ### 8. Semantic Idleness: The Deletion Test (The Climax)
  **Question:** Here is the charge I want you to address: If the belief component handles embedding, logic, and truth conditions, and the attitude component only explains motivation, what semantic work is the attitude doing?

  **Likely Answer:** She will argue the attitude is necessary to capture the "practicality" or "normativity" of moral judgments.

  **Follow-up:** But semantics is about truth conditions and validity. If I can delete the attitude from your analysis without changing the truth conditions of any sentence or the validity of any argument, then the attitude is pragmatically useful but semantically idle. Why isn't your view just descriptivism with an added theory of motivation, rather than a genuine hybrid semantics?
