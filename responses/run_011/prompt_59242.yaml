answer: |-
  This is a classic debate in the philosophy of biology and anthropology. Your stepdad is arguing for **Universal Darwinism** (the idea that the algorithm of variation, selection, and retention applies to any substrate), while Dev is arguing for **Specificity** (the idea that biological mechanisms are distinct enough that stretching the analogy breaks it).

  You haven't garbled the arguments; this is accurately how the "memetics vs. cultural epidemiology" debate plays out in academic circles. Dev is channeling objections raised by philosophers like Dan Sperber and David Hull, while your stepdad is channeling Richard Dawkins and Daniel Dennett.

  Here is the move-by-move verdict.

  ### 1. The Fidelity Objection (Reconstruction vs. Replication)
  **The Claim:** Dev says cultural transmission is "reconstruction" (high error), not copying, so nothing persists. Stepdad says genes aren't perfect either; it's the pattern that matters.
  **Verdict:** **Dev is right on the mechanism; Stepdad is right on the outcome.**

  Dev identifies a real disanalogy. DNA replication is a chemical templating process with proofreading enzymes. Cultural transmission is cognitive reconstruction. When you hear a joke, you don't download a file; you encode the *gist* and regenerate the text later. This introduces massive noise.

  However, Dev's conclusion ("nothing persists") is empirically false. Folktales, religious dogmas, and melodies *do* persist for centuries. Stepdad is right that fidelity doesn't need to be perfect, only *above a certain threshold* to allow cumulative selection.

  **The Ruling:** Dev wins the technical point (the mechanisms are fundamentally different), but Stepdad wins the functional point (the difference isn't large enough to stop evolution from happening). If Dev insists that reconstruction prevents persistence, he is ignoring the existence of stable cultural traditions. But he is correct that "sloppy copying" makes cultural evolution much noisier and harder to model than genetic evolution.

  ### 2. The Directed Variation Objection (Lamarck vs. Darwin)
  **The Claim:** Dev says cultural variation is "aimed" (we make jokes funnier), whereas mutations are random. Stepdad says the selection filter still does the work.
  **Verdict:** **Dev is right. This breaks the strict Darwinian analogy.**

  This is the strongest philosophical objection Dev raises. Biological evolution is Darwinian because variation is random *with respect to fitness*. A gazelle doesn't mutate faster legs because it *needs* to escape a lion. In culture, humans *do* modify ideas specifically to make them fitter (funnier, more persuasive, easier to remember).

  This makes cultural evolution **Lamarckian** (inheritance of acquired characteristics), not strictly Darwinian. Stepdad's counter ("there's still a filter") is partially true—most attempts to make a joke funny still fail—but it misses the core definition. If variation is systematically biased toward fitness, "Natural Selection" is no longer the primary explanatory engine; "Intelligent Design" (by the modifier) is.

  **The Ruling:** Dev is correct. You cannot have it both ways. If the variation is guided by foresight or purpose, it is not a blind Darwinian process. Stepdad is trying to save the theory by redefining "selection" to do all the work, but if the variation is already pre-screened by human intelligence, the "filter" is less important. This isn't just a technicality; it changes the predictive power of the theory.

  ### 3. The Unit Objection (Individuation)
  **The Claim:** Dev says memes have no discrete boundaries (Happy Birthday is a fuzzy soup). Stepdad says languages show patterns.
  **Verdict:** **Dev wins decisively.**

  This is the fatal flaw of memetics that has never been satisfactorily resolved. In biology, we can (mostly) identify the unit of selection: the gene, the chromosome, the organism. We know where one ends and the environment begins.

  Dev's "Happy Birthday" example is devastating. Is the meme the melody? The lyrics? The social context of blowing out candles? The neural pathway? In culture, the "transmitter" (the brain) and the "transmitted" (the idea) are made of the same stuff (neural connections). There is no clean genotype/phenotype distinction.

  Stepdad's response ("languages change in patterns") is a non-sequitur. It proves change happens, but it does not prove there are discrete *units* being selected. You can have continuous change without discrete particles.

  **The Ruling:** Dev is right. Without countable, discrete units, you cannot run the math of natural selection. You can talk about "cultural change" or "cultural drift," but calling it "evolution by natural selection" requires units that memetics has failed to define. Stepdad is waving at the phenomenon without identifying the mechanism.

  ### 4. The "Filter + Variation" Definition
  **The Claim:** Stepdad says "filter plus variation is all Darwin ever needed." Dev says "change isn't selection."
  **Verdict:** **Stepdad is oversimplifying; Dev is correct.**

  Stepdad is offering a "process ontology" of evolution. He thinks if it *looks* like selection (some things survive, some die), it *is* selection. Dev is pointing out that change can occur via **drift** (random fluctuation) or **bias** (directed variation, see point 2) without any selection pressure.

  For a process to be Darwinian, it needs three things: **Variation, Heritability, and Differential Fitness.** Stepdad mentions Variation and Fitness (the filter), but he glosses over Heritability (which ties back to the Unit Objection). If you can't define the unit, you can't define heritability.

  Furthermore, Dev's point that "change isn't selection" is crucial. Just because a cultural trait becomes popular doesn't mean it was *selected for* its fitness. It might have spread because of a historical accident (founder effect) or because a powerful person forced it. Stepdad is committing the "adaptationist fallacy"—assuming that because something exists, it must have been selected for a purpose.

  **The Ruling:** Dev is right. "Filter + Variation" is necessary but not sufficient. You need discrete heritable units to make the claim hold. Without that, Stepdad is describing a metaphor, not a mechanism.

  ### Overall Assessment

  **Who is talking nonsense?** Neither. But **Dev is winning the argument.**

  Your stepdad is arguing from **Intuition**: "It looks like evolution, it acts like evolution, so let's call it evolution." This is useful for pop-science and generating hypotheses.

  Dev is arguing from **Rigor**: "The underlying mechanics don't match the definition, so the label is misleading." This is necessary for actual science.

  **The Breakdown:**
  1.  **Fidelity:** Draw. (Mechanism differs, outcome similar).
  2.  **Variation:** Dev wins. (Cultural variation is Lamarckian, not Darwinian).
  3.  **Units:** Dev wins. (Memetics has no solution for individuation).
  4.  **Definition:** Dev wins. (Stepdad's definition is too loose to be scientifically useful).

  **The Hard Truth:**
  Memetics (the idea that culture evolves *exactly* like genes) is largely considered a dead end in serious academic philosophy of biology and anthropology. It was a brilliant metaphor in 1976, but it hasn't produced the rigorous, predictive models Stepdad implies it has.

  Dev is correct that the analogy is doing "enormous amounts of unpaid work." It borrows the prestige of biology to explain culture without doing the hard work of defining cultural units or accounting for human agency. Your stepdad is right that there are *patterns* of selection in culture, but he is wrong to insist this makes it the *same process* as biological evolution.

  If you want a verdict: **Dev is right.** The memetic analogy breaks down under the specific philosophical pressure he applied. Your stepdad is describing a real phenomenon (cultural selection), but he is wrong to defend the strict Dawkinsian framework against Dev's technical objections.
