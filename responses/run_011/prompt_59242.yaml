          *   *Analysis:* This is the "Lamarckian" objection. Darwinism requires random variation *relative to fitness*. Cultural evolution is often Lamarckian (acquired characteristics transmitted). However, modern evolutionary theory acknowledges that variation isn't *purely* random (bias in mutation), but the *selection* pressure is the distinct Darwinian part. If variation is *perfectly* aimed at fitness, selection is redundant. But human creativity isn't perfect. We try to make things catchy, but most fail. So selection still operates.
