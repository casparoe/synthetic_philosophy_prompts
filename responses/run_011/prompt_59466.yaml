answer: |-
  Good morning. Welcome to all ninety of you. We have three days to agree on how a species-level record is represented in a shared taxonomic backbone. Eleven databases will map onto this structure. Two conservation lawyers are here because the count of protected units depends on it. The rest of you are here because you know that data models are not neutral containers. They are arguments made of logic gates.

  We are tempted to treat this as a technical exercise. We want a schema that validates, resolves to one stable identifier per record, and runs without human adjudication. That is a reasonable engineering goal. But I need you to see that before we write a single line of code, our tools have already taken a position in the species problem.

  Consider how we usually link an organism to a taxon in a database. We use a relation like `instance_of` or `is_a`. We say this specific oak *is an instance of* that species. This treats the species as a class, a natural kind defined by a set of properties. If the organism meets the definition, it belongs. If not, it does not. This is how we build most ontologies. It is clean. It validates.

  But think about your own body. Your cells are not *members* of you in the way a person is a member of a club. They are *parts* of you. You are a single, spatiotemporally extended historical individual. Your cells live and die, but you persist as a continuous lineage. If we treat species the same way—as historical individuals rather than abstract kinds—then an organism is not an instance of a species. It is a part of it.

  When your schema demands an `instance_of` relation, you are not just organizing data. You are voting for a metaphysics. You are silently asserting that species are kinds. You are forcing the room to adopt a view that half the taxonomists here reject. The people working on oaks know lineage boundaries are porous. The people working on rotifers know some lineages do not fit the reproductive definitions at all. The lawyers know that if we define the unit too narrowly, protection fragments; if too broadly, it vanishes.

  If we build a backbone that requires every record to resolve to exactly one accepted species identifier, we are building a machine that cannot tolerate history. We are asking for a static address for a moving target.

  There is a joke circulating that half this room thinks the other half is splitting hairs, while the rest think the first half is lumping evidence. But the real joke is on the schema. We are building a system that demands a single stable identifier for every record, as if nature itself issued invoices. We are asking for a primary key for a process. The identifier will survive long after the concept behind it has changed, making our database a monument to yesterday's certainty.

  I am not asking you to solve the species problem. You cannot do that in three days, and neither could centuries of philosophy. I am asking you to acknowledge that the data model must not hide the problem.

  Our deliverable cannot be a definition of species. If we try to define species, we will fail, and the schema will break when it meets a ring species complex or a hybrid zone. Instead, our deliverable must be a list of requirements any representation must meet. We need to design a record that can carry uncertainty without collapsing.

  A record which lies silently is worse than one which reports its own uncertainty. If a lineage is porous, the data should show the porosity. If a boundary is disputed, the identifier should not pretend it is settled. We need a structure that allows us to say "this organism is part of this lineage segment" without forcing us to claim that segment is a definitive kind.

  This is not pluralism. We are not saying everything goes. We are saying the representation must be robust enough to survive contact with reality. The engineers need to know that the metaphysics is in your data types. The taxonomists need to know that we are not asking for your concept to win, but for your evidence to be visible. The lawyers need to know that a visible uncertainty is legally safer than a silent error.

  So here is your task for Monday morning. Break into mixed groups. Do not start with the schema. Start with the failures. Take the cases that break the current model—the hybrids, the asexuals, the rings. Draft the requirements for a record that can hold those cases without lying. What fields must exist? What relations must be allowed? What constraints must be relaxed?

  By lunch on Monday, I want a draft list of requirements on the board. Not a solution. A specification for a problem we are finally admitting we have.

  Let's get to work.

  ***

  **Note on the Draft**

  I am highly confident in the load-bearing claim that standard ontology relations (specifically `instance_of` or `rdf:type`) commit the user to a class/kinds metaphysics, which contradicts the individuality thesis (where `part_of` is the appropriate relation). This is a standard objection in bio-ontology circles. However, I am least sure about the technical feasibility objection from the engineering side. Most taxonomic backbones (like GBIF or ITIS) rely heavily on hierarchical classification trees where `subClassOf` is fundamental. Shifting to a "partonomy" of historical individuals might break existing query structures that rely on inheritance of properties from class to instance. The speech assumes this shift is manageable within a three-day workshop scope, but the engineers might argue that representing species as individuals rather than classes makes automated reasoning significantly harder, potentially undermining the "validates without human curator" goal mentioned in the prompt. I have prioritized the philosophical correctness over the engineering ease, as requested, but that is the friction point.
