          *   "No bookmaker in nature" -> Matters (adversarial vs. indifferent environment).
          *   "One-off decisions" -> Matters (money pumps need cycles).
          *   "Computational cost" -> Matters (bounded rationality).
          *   "Pocket implies storage" -> Verbal (just semantics).
          *   "Leak implies gravity" -> Verbal (unless it implies inevitability).

  3.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Set the persona. Friendly, rigorous, no jargon without explanation. Acknowledge the tension between the Alignment Researcher (AR) and the Economist (Econ).

      *   **Section 1: Brainstorming Dump & Sort:**
          *   List the failures.
