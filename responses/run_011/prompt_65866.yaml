  2.  **Brainstorming & Sorting (Mental Draft):**
      *   *Idea:* Pockets hold money. Agents hold... utility? Beliefs? Resources?
      *   *Idea:* Holes are passive. Incoherence is structural.
      *   *Idea:* Leaks drain continuously. Money pumps require a specific sequence of trades.
      *   *Idea:* Who is the bookmaker? In the real world, is there always an exploiter?
      *   *Idea:* Does the agent notice? Can they self-correct?
      *   *Idea:* Is utility conserved like money?
      *   *Idea:* What about one-off decisions? No pump possible.
      *   *Idea:* What about computational costs? Being coherent is expensive.
      *   *Sorting:*
