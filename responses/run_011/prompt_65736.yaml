answer: |-
  **Case 1: The Backburn**
  Incident Commander Hayes faces the Ridge Fire, driven by high winds toward Oakhaven (population 5,000). Protocol dictates a backburn to starve the wildfire of fuel. The only viable ignition line crosses Farmer Miller's 50 acres of mature wheat and equipment shed. Igniting this strip consumes the fuel, creating a gap the wildfire cannot cross. Hayes confirms no alternative line exists that saves Miller's property. Standing orders require minimizing private loss; if a river or road offered equal protection, Hayes would use it. Radio contact with Miller fails. Compensation protocols are logged. The backburn proceeds. Miller's wheat and shed burn. The wildfire hits the blackened strip and dies. Oakhaven is saved.

  **Case 2: The Access Route**
  Incident Commander Hayes faces the Ridge Fire, driven by high winds toward Oakhaven (population 5,000). A natural granite ridge blocks the fire's path, but suppression pumps must be positioned on the far side to cool hot spots. The only route for heavy bulldozers to reach the ridge position cuts through Farmer Miller's 50 acres of mature wheat and equipment shed. The dozers crush the crop and shed to establish access. Hayes confirms no alternative route exists. Standing orders require minimizing private loss; if a road offered access, Hayes would use it. Radio contact with Miller fails. Compensation protocols are logged. The access route is cut. Miller's wheat and shed are destroyed. The wildfire hits the granite ridge and dies. Oakhaven is saved.

  ***

  **Walkthrough**
  The discriminating condition is the **Means Condition** (the bad effect must not be the means to the good effect).
  *   **Case 1:** The destruction of the crop is the *mechanism* of safety. The fire stops *because* the fuel is gone. The harm is instrumentally necessary for the benefit.
  *   **Case 2:** The destruction is *incidental* to the mechanism. The fire stops because of the granite ridge. The harm is a cost of access, not the cause of safety.
  *   **Silent Conditions:**
      *   **Nature of Act:** Both are firefighting operations (morally neutral/good).
      *   **Intention:** Both commanders satisfy the counterfactual test (both would avoid harm if costless alternatives existed). Neither narrates a desire for harm.
      *   **Proportionality:** Identical in both (50 acres vs. 5,000 residents).

  **Diagnosis**
  The weight-carrying feature is **causal indispensability**. In Case 1, the harm *produces* the safety; in Case 2, the harm is *incurred en route* to the safety. If you remove this feature (e.g., if the backburn in Case 1 was unnecessary because a river existed but was ignored), the case shifts toward negligence or becomes structurally identical to Case 2.
  *   **Smallest Modification to Flip Verdict:** In Case 2, if the bulldozer trench *itself* acts as the firebreak (rather than just accessing the ridge), the destruction becomes constitutive of the safety. A DDE theorist would then treat it as Case 1 (impermissible means), despite the "access" label.
  *   **Redescription Strategy:** Does describing Case 1 as "removing combustible material" rather than "ruining Miller's livelihood" collapse the pair? **Honest assessment:** It threatens to, but does not necessitate collapse. If the act is described at the level of institutional authority ("burning Parcel A"), the harm is a means. If described abstractly ("reducing fuel load"), the harm looks like a side effect. The pair holds only if we fix the description at the level of the *particular rights infringement* required by the causal chain. If the theory allows unlimited redescription, the distinction collapses.

  **Objection and Reply**
  *   **Skeptic's Objection:** This is moral magic. The physical reality is identical (wheat gone, town saved, agent indifferent to the loss). The "means" distinction is a post-hoc rationalization constructed to allow the agent to feel clean while authorizing the same destruction. It privileges the agent's causal narrative over the victim's actual loss.
  *   **Defender's Reply:** It is not about the agent's feelings, but the **structure of agency**. Using a person (or their property) as a tool imposes a different normative demand than colliding with them while pursuing a separate goal. Case 1 conscripts Miller's property into the service of the town; Case 2 merely infringes upon it. Respecting the separateness of persons requires acknowledging that we may not *use* others even to save more others, whereas we may sometimes *risk* harming them to save others. The distinction preserves a constraint against instrumentalization that consequentialism erases.
