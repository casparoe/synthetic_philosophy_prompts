  5.  **Drafting the Objection & Reply:**

      *   *Skeptic:* It's post-hoc rationalization. The physical reality is identical (wheat gone, town saved). The "means" distinction is a linguistic trick to assuage guilt.
      *   *Defender:* It's not about guilt, it's about the structure of agency. Using someone (or their property) as a tool differs from colliding with them while pursuing a goal. It respects the separateness of persons (Nozick-style argument applied to property/rights).

  6.  **Refining and Polishing:**

      *   *Word Count:* Keep cases tight (~200 words each).
