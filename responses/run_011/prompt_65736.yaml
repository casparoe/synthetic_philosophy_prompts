  4.  **Drafting the Diagnosis:**

      *   *Weight-carrying feature:* Causal indispensability. In Case 1, the harm *produces* the safety. In Case 2, the harm is *incurred en route* to the safety.
      *   *Removal:* If you remove the causal link in Case 1 (e.g., the backburn doesn't actually stop the fire, the ridge does), it becomes Case 2.
      *   *Smallest Modification to Flip:* In Case 2, if the bulldozer trench *itself* acts as the firebreak (not just the ridge), then the damage becomes a means. Or in Case 1, if the backburn is unnecessary because a river exists but they burn anyway to be safe, it shifts toward side-effect (though potentially negligence). Let's stick to the prompt: Smallest mod to flip a DDE theorist. If in Case 2, the *only* reason to crush the wheat is that the friction of the dozer creates a dust cloud that confuses the fire? No, too sci-fi.
      *   *Better Flip:* In Case 2, if the bulldozer line *is* the firebreak (not just access to the ridge). That makes the damage constitutive of the safety.
      *   *Redescription Strategy:* This is crucial. Can the Case 1 commander say "I intend to remove fuel, not destroy livelihood"?
