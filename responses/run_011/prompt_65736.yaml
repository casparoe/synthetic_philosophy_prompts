      *   *Case 2 (Side Effect):* Access/Containment. The crew needs to reach a natural ridge (firebreak) to set up pumps. The *only* route for heavy bulldozers to reach that ridge goes *through* Miller's wheat. The ridge stops the fire, not the damaged wheat. The wheat is crushed in transit.
      *   *Symmetry:* In both, Commander Hayes knows Miller isn't reachable. In both, Hayes would take a different route/if less damage worked. In both, 50 acres lost, town saved.
      *   *Constraint Check:* Need to ensure the "Means" case clearly relies on the destruction for the success, and the "Side Effect" case clearly does not.
      *   *Drafting Case 1 (The Backburn):* Focus on the causal mechanism. The fire stops *because* the fuel is consumed.
      *   *Drafting Case 2 (The Access):* Focus on the causal mechanism. The fire stops at the ridge. The crop loss is incidental to getting the equipment there.

  3.  **Drafting the Walkthrough:**

      *   *DDE Conditions:* (1) Nature of act (good/neutral), (2) Intention (good effect intended, bad only foreseen), (3) Means/End (bad not means to good), (4) Proportionality (good outweighs bad).
      *   *Analysis:*
          *   Conditions 1, 4 are identical (fighting fire is good, 50 acres < town).
          *   Condition 2 (Intention) is the tricky one. The prompt asks to avoid narrating mental states. So we rely on Condition 3 (Means).
