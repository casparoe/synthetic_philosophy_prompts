prompt: |-
  ok so I'm applying for a small summer research grant — three months, $8k, solo project, and they want a two-page proposal — and I need help getting a half-formed idea into something that reads like a plan instead of a rant.

  The idea: everyone who argues about the identity of indiscernibles seems to spend all their time on Black's two spheres in an otherwise empty universe and then picks a camp — haecceities, primitive thisness, relational-but-only-if-you're-clever-about-directions, whatever. My hunch is that the debate is quietly a special case of a question physicists have their own version of, namely when a symmetry is a mere redundancy in how we describe things (gauge) as opposed to a real feature of the world. Permuting the two spheres looks an awful lot like the kind of symmetry everyone agrees is surplus structure in a gauge theory, and yet almost nobody concludes that the two-sphere world just is the one-sphere world. So the question I want funded is something like: can the indiscernibles debate be settled by importing the machinery from the permutation-argument debate — asking whether the "places" in the space are individuals prior to whatever sits in them, or whether they get their identity from what sits in them — or does importing that machinery beg the question, because the physical arguments lean on an empiricist criterion about observable differences that a realist about individuals was never obliged to accept in the first place?

  Turn that into a proposal. Specifically I need: (1) the question stated precisely enough that someone could actually disagree with a determinate answer to it, and not so precisely that it collapses into one camp's slogan; (2) why the three or four standard positions on the spheres each leave my question open rather than already answering it; (3) the method, month by month for the three months — what would I actually be doing, given that it's entirely armchair and there's no data to collect; (4) a defense of this angle over the obvious alternative, which is just generating more thought experiments (three spheres, symmetric worlds with more structure, worlds where the spheres differ only in some nonqualitative respect) and seeing which principles survive; (5) what a result would look like, and what would count as the project failing — say, if it turns out the physics cases aren't analogous in any respect that does work, or if the analogy holds but only trivially; (6) an honest paragraph on scope, since it's three months and just me.

  Skip the citations and the literature review entirely — refer to positions and arguments by their usual names and I'll fill in the references myself later. And please write the whole thing in American English.
