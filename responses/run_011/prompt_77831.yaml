answer: |-
  Your puzzle is not merely administrative; it is applied metaphysics. The museum's paperwork is not a passive record of pre-existing things but a constitutive technology that brings certain ontological categories into being. By reconciling the accession register, insurance schedule, and customs declarations, you have uncovered that the museum does not operate under a single theory of art, but rather a **disjunctive ontology** governed by a **theory of normative status**.

  Here is the philosophical reconstruction of what your practices commit you to.

  ### I. The Ontological Bifurcation

  Your five practices divide into two distinct ontological commitments. They are not merely different procedures; they presuppose different categories of being.

  **1. The Commitment to the Abstract Type (Multiply Instantiable)**
  *   **Practices:** First (Instruction-based), Fourth (Conservation of installations/perishables), Fifth (Deaccessioning of destroyed instances).
  *   **The Commitment:** These practices treat the work as an **Abstract Type** (or a Normative Kind). The work is capable of indefinite instances (LeWitt walls), can survive the destruction of all current instances (Practice 5), and persists when no physical manifestation exists (Practice 1 insurance).
  *   **Evidence:** You insure the *right to instantiate*, not the paint on the wall. You conserve the *concept* by re-fabricating, recording the new physical object as the *same* work. You retain the accession number even if the physical instance is gone.

  **2. The Commitment to the Historical Particular (Singly Instantiable)**
  *   **Practices:** Second (Attribution), Fourth (Conservation of paintings), Third (Customs/Originality).
  *   **The Commitment:** These practices treat the work as a **Physical Particular** essentially tied to a specific history of making. The work is identical with *this* canvas, touched by *this* hand, at *this* time.
  *   **Evidence:** You pay for the "autograph" trace even if visually indistinguishable from a studio work (Practice 2). You argue conservation in terms of *this* canvas's specific history (Practice 4). Customs requires the object to be "original" and by a "professional," implying the value resides in the specific generative event (Practice 3).

  **Are these contradictory?**
  Strictly speaking, a single object cannot be both an abstract type and a historical particular. However, your paperwork avoids contradiction by treating "Work of Art" as a **functional kind** that can be realized by different ontological substrates depending on the *medium category* assigned at accession.
  *   If accessioned as "Painting," the work = the Physical Particular.
  *   If accessioned as "Conceptual/Installation," the work = the Abstract Type (governed by the Certificate).
  The contradiction is resolved by **media-specific ontology**. The museum does not have one theory of art; it has a taxonomy of theories, applied according to the artist's intent and the mode of acquisition.

  ### II. The Ontological Status of the Certificate

  In the case of instruction-based works (Practice 1), the certificate is not the work itself, nor is it merely a receipt. Philosophically, your paperwork treats the certificate as a **Deed of Title to a Normative Status**.

  *   **Not the Work:** You do not exhibit the certificate as the art; you exhibit the wall.
  *   **Not a Receipt:** It does not merely prove payment; it proves authority.
  *   **The Status:** The certificate grants the holder the **normative right to instantiate the type**. Without it, painting the wall is vandalism or forgery; with it, it is an "instance of the work."
  *   **Reconstruction:** The certificate is a performative document (like a marriage license or a deed to land). It changes the status of the physical materials (paint and wall) from mere matter into an instance of the artwork. This explains why you insure it at full value even when uninstalled: you are insuring the *authority*, which is the permanent asset, whereas the wall is a temporary expenditure.

  ### III. Evaluation of Rival Accounts

  Your practices rule out or constrain several standard philosophical theories of art.

  **1. The Experiential Account (Art = The Experience Afforded)**
  *   *Theory:* A work is art in virtue of the aesthetic experience it generates in a viewer.
  *   *Verdict:* **Flatly Incompatible.**
  *   *Reasoning:* Practice 1 (insuring uninstalled works) and Practice 5 (retaining destroyed works) contradict this. If art is the experience, an uninstalled LeWitt or a destroyed painting is no longer art (or is a nullity). Your paperwork commits you to the work existing *prior to* and *independently of* the viewer's experience.

  **2. The Institutional Account (Art = Artworld Conferral)**
  *   *Theory:* Something is art because the artworld (museums, curators) says it is.
  *   *Verdict:* **Unfriendly but Compatible.**
  *   *Reasoning:* Practice 3 (Customs) and Practice 1 (Certificate) fit this well; the curator's letter literally confers "art" status for the state. However, Practice 2 (Attribution) contradicts it. If art were purely conferred, a perfect studio copy should be as valuable as an autograph work if the museum accepts it. Your provenance research assumes there is a *fact of the matter* about the hand independent of your conferral. You are discovering authenticity, not inventing it.

  **3. The Act-of-Making Account (Art = The Specific Physical Event)**
  *   *Theory:* The work is identical to the specific physical action of the artist creating the object.
  *   *Verdict:* **Flatly Incompatible (for half your collection).**
  *   *Reasoning:* This fits Practice 2 and 4 (Paintings). It fails Practice 1 and 4 (Installations). If the work were the act of making, a LeWitt wall painted by drafters would not be a LeWitt, and a re-fabricated installation would be a copy. Your register records them as the *same work*, implying the work transcends the specific act of making.

  ### IV. Administrative Motive vs. Philosophical Commitment

  You asked how to distinguish paperwork driven by liability/tax from paperwork driven by ontology. The litmus test is the **Counterfactual of Indiscernibility**.

  *   **Administrative Motive:** If a practice would change if the financial/legal risk were removed, it is administrative.
      *   *Example:* Carrying the work on the insurance schedule (Practice 1). If you were self-insured and had no legal requirement to value assets, you might not assign a dollar figure. This is largely administrative/financial.
      *   *Example:* Customs headings (Practice 3). This is external coercion. You comply to save money, not because you believe the state defines art.
  *   **Philosophical Commitment:** If a practice persists even when it creates administrative burden or financial disadvantage, it is ontological.
      *   *Example:* Attribution grading (Practice 2). It is administratively easier to treat all visually identical panels as equal value. You do not. You incur the cost of research to distinguish "hand" from "studio." This commits you to **Essentialism** (the history of the object is part of its identity).
      *   *Example:* Conservation re-fabrication (Practice 4). It is administratively safer to label a new wall a "replica." You label it the "same work." This commits you to **Conceptualism** (the idea supersedes the material).
      *   *Example:* Accessioning the Certificate (Practice 1). You could accession the wall and file the certificate. By accessioning the certificate, you commit to the **Abstract Type** theory.

  **Which cannot be explained away?**
  Practice 2 (Attribution) and Practice 4 (Conservation of conceptual works) cannot be explained by admin motive. They actively create *more* work and *more* risk (valuing a fragment higher than a whole, treating a new object as old). These are pure ontological commitments.

  ### V. The Hypothetical Shift

  Suppose the museum were persuaded to adopt the **Experiential/Event Ontology** (Art = The Event/Experience generated).

  **Required Changes:**
  1.  **The Register:** You would cease to accession *objects* or *certificates*. You would accession *performance rights* or *documentation of events*. The accession number would attach to a timeframe, not a thing.
  2.  **Insurance Schedule:** You could not insure an uninstalled work. Value would fluctuate based on projected attendance or engagement metrics. An uninstalled LeWitt would have zero insured value.
  3.  **Conservation:** "Preservation" would become impossible. You would conserve *records* of past experiences (photos, testimonials), but you could not re-fabricate. A re-fabrication would be a *new* event/work, requiring a new accession number.
  4.  **Customs:** You would likely stop importing "art." You would import "props for an event." The *Bird in Space* would enter as metal parts; the "art" would happen only upon assembly and viewing.
  5.  **Deaccessioning:** This is the critical failure point. You could not sell a work to buy another, because you do not hold transferable assets. You would be selling *rights to stage an experience*.

  **The Hardest Change: Deaccessioning and the Trust Structure.**
  The single hardest change would be the **Deaccessioning Policy (Practice 5)**, specifically the requirement that proceeds be used to acquire other works within a "closed economy."

  *   **Why:** Museums are legally constituted as trusts or charities holding a **permanent collection** for the public benefit. The law (and accreditation) presupposes the collection consists of *enduring assets* (objects or rights thereto) that can be held in perpetuity.
  *   **The Conflict:** An "Event" or "Experience" is ephemeral. You cannot hold an experience in trust. If you adopt the Event Ontology, the legal concept of the "Permanent Collection" dissolves. You cannot promise donors that their gift will be "preserved" if the work is essentially a transient experience.
  *   **Consequence:** To adopt this view, you would not merely change a form; you would have to dissolve the museum's legal status as a collecting institution. You would become a presenting organization (like a theater or festival). The accession register would become a programming schedule. The "closed economy" of deaccessioning would become illegal, as you would have no capital assets to exchange, only operating revenue.

  ### Summary

  Your paperwork commits the museum to a **Dual-Aspect Ontology**:
  1.  **For Traditional Media:** The work is a **Historical Particular** (Practice 2, 4a).
  2.  **For Conceptual/Contemporary Media:** The work is a **Normative Type** authorized by a **Deed of Title** (Practice 1, 4b, 5).

  These are reconciled by treating the "Work" as a status function that supervenes on either a specific physical history or a specific set of instructions. The certificate is the technology that stabilizes the latter. While administrative motives (insurance, customs) layer over these commitments, the core practices of attribution and conservation reveal a genuine philosophical stance: **The museum believes it is the custodian of truths (attribution) and rights (conceptual works), not merely things.** To shift to an Experiential ontology would not require new forms; it would require the museum to cease being a museum in the legal and philosophical sense.
