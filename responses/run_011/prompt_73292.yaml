      *   Point 8 (Self-Blindness) is the odd one out. It sounds like a *Self-Representationalist* (Kriegel) or *Dispositionalist* (Carruthers) claim, not a standard HOP claim. Standard HOP allows for self-blindness if the scanner breaks.
