          *   *Severity:* Medium-High.
          *   *Why:* Inner Sense (HOP) posits a mechanism that *detects* experience. This often presupposes the experience exists independently to be detected (Realism about Qualia). 10 claims the HO story *dissolves* the Hard Problem (usually implying the HO state *makes* it conscious, or there's no extra 'glow'). If Inner Sense is just a detector, it doesn't explain *why* the detection feels like something. If it *makes* it conscious, it's not really a "sense" detecting an independent thing.
          *   *Fix:* Clarify 10. Adopt a "Actualist" HO view (HO makes FO conscious) rather than "Dispositionalist" or "Realist." Or admit 10 is too strong.
          *   *Cost:* Admit the Hard Problem isn't fully dissolved, just relocated.

      *   **Conflict C: 1 (Transitivity) vs. 9 (Rock Worry).**
