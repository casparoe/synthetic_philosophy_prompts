      *(Self-Correction during drafting)*: Wait, Point 8 says "In *our* case the awareness comes free." This limits it to rational creatures. Point 5 is about animals. So 5 and 8 don't directly conflict on the *subject* (humans vs dogs). But 8 conflicts with 6/7 regarding the *mechanism*. If the mechanism is a scanner (4, 7), it can break. If it "comes free" (8), it can't break. That's the real conflict.

      Also, check 10. "Dissolves the hard problem." HO theories are often accused of *ignoring* the hard problem (explaining access, not phenomenology). If the user claims it *dissolves* it, they are likely taking an eliminativist line (there is no 'what it's like' over and above the HO representation). This fits with 6 (misrepresentation). If the scanner fires, you have the experience, even if the FO state is missing. This implies the *HO state* carries the phenomenology. Does 4 (Inner Sense) allow that? Inner Sense usually implies the *FO state* has the phenomenology and is detected. This is a crucial distinction. HOP (Lycan) vs HOT (Rosenthal). Rosenthal says HO makes it conscious. Lycan says HO detects conscious states? No, Lycan says HO makes it conscious via attention.
