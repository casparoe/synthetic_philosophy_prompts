answer: |-
  To argue that the simmballs are the true causes and the sims are merely their transient implementation, we must abandon the intuition that causation resides exclusively in the "bottom" layer of physical contact. Instead, we must locate causation in **counterfactual stability**. A cause is not simply something that precedes an effect; it is a difference-maker. If $A$ causes $B$, then in the nearest possible world where $A$ does not occur, $B$ does not occur.

  Using this criterion, we can demonstrate that within the careenium, the sim-level description fails to track the actual dependencies of the system, while the simmball-level description succeeds. This is not a matter of descriptive convenience; it is a fact about the system's dynamical topology.

  ### 1. The Argument from Constituent Turnover
  In the careenium, simmballs are dynamic clusters. Sims enter and leave the clumps constantly due to thermal noise and magnetic interaction. Let us posit a specific causal event: Simmball $S_1$ collides with Simmball $S_2$, triggering a reconfiguration that signals "True."

  At the micro-level, $S_1$ is composed of sims $\{a, b, c...\}$ at time $t_1$. At time $t_2$ (moment of impact), $S_1$ is composed of $\{a, b, d...\}$. Sim $c$ has drifted away; Sim $d$ has joined.

  If the specific sims were the causal agents, the replacement of $c$ with $d$ should constitute a change in the cause. If the cause has changed, the effect should potentially change. However, the system is designed such that the "symbolic" interaction proceeds regardless of this turnover. The effect (the signaling of "True") remains invariant despite the total replacement of the constituent micro-entities over time.

  Therefore, the specific identity of the sims is **causally irrelevant**. To attribute the cause to the sims is to attribute the effect to variables that can vary without altering the outcome. The simmball, however, persists through this turnover. The *structure* is the constant; the *substrate* is the variable. Since causation requires invariance across irrelevant background variations, the simmball is the only candidate that satisfies the necessary conditions for being the cause.

  ### 2. Screening Off and Conditional Independence
  This leads to a stronger statistical claim: the macro-state **screens off** the micro-state.

  Let $Micro_t$ be the precise position and momentum of every sim at time $t$.
  Let $Macro_t$ be the configuration of simmballs at time $t$.
  Let $Effect_{t+1}$ be the subsequent pattern of wall-bouncing and clump-interaction.

  Hofstadter claims $Micro$ and $Macro$ are the "same process." But if they were causally equivalent, knowing $Micro_t$ should give us predictive power over $Effect_{t+1}$ that is not exhausted by knowing $Macro_t$. In a chaotic system like the careenium, the opposite is true. The specific micro-fluctuations of individual sims are essentially noise relative to the trajectory of the clumps.

  Mathematically, $P(Effect_{t+1} | Macro_t, Micro_t) = P(Effect_{t+1} | Macro_t)$.

  Once you know the simmball configuration, knowing the exact position of every individual sim adds no predictive value regarding the symbolic outcome. In fact, the micro-details often obscure the prediction because they introduce chaotic variance that cancels out at the higher level. If the micro-level details do not add information about the future state beyond what the macro-level provides, the micro-level is **causally excluded**. It is not that the sims *also* cause the effect; it is that they are screened off by the structure they constitute. The "fact of the matter" is this conditional independence. The causal work is done by the constraints on the system's phase space, and those constraints are defined by the simmballs, not the sims.

  ### 3. Attractor Dynamics as Physical Fact
  One might object that this is just epistemology—that we *prefer* the macro description, but the physics is still just balls hitting balls. This objection fails because the stability of the simmballs is a physical feature of the vat, not a mental projection.

  The magnetic properties and wall dynamics create **basins of attraction**. The system physically converges toward simmball states. If you perturb the sims slightly (kick one ball), the magnetic forces restore the clump. If you perturb the simmball (split the clump), the trajectory changes fundamentally.

  This means the "simmball" is a physically robust state, an attractor in the system's energy landscape. The "sim configuration" is a fleeting point traversing that landscape. To ask what causes the next state is to ask what governs the trajectory through the landscape. The trajectory is governed by the topology of the basins (the simmball definitions), not the specific coordinate of the particle within the basin. The basin structure constrains the future evolution of the system. Since the simmballs *are* these basins of attraction, they are the physical loci of constraint. Constraints are causal. Therefore, simmballs are the causes.

  ### Conclusion
  Hofstadter is wrong to call the question bogus. There is a fact of the matter, grounded in counterfactual dependence and conditional independence. The sims are interchangeable tokens; the simmballs are the types that carry the causal load. Because the system's future is invariant under changes to the specific sims but sensitive to changes in the simmballs, the causal privilege belongs to the simmballs. The micro-level is not a competing cause; it is merely the high-frequency noise that realizes the low-frequency signal. The signal is the cause.

  ***

  ### Where the Argument is Softest
  The weakest point in this argument is its reliance on an **interventionist or counterfactual theory of causation**. I have assumed that to be a cause is to be a "difference-maker" that supports stable counterfactuals.

  A proponent of a **process-transfer theory of causation** (e.g., Salmon or Dowe) could reject my conclusion entirely. They would argue that causation is strictly the transmission of conserved quantities (energy, momentum, charge). In the careenium, energy and momentum are transferred exclusively between individual sims via magnetic fields and collisions. Simmballs do not exchange energy; sims do. From this physicalist perspective, my argument conflates *explanation* with *causation*. I have shown that simmballs are better for *prediction* and *explanation*, but I have not proven they are the locus of *physical force*.

  If causation is defined by where the energy flows, the sims win, and my argument collapses into a claim about human descriptive preferences—which is exactly Hofstadter's original position. To maintain that the simmballs are *ontologically* privileged causes, I must insist that causal structure is defined by informational stability rather than energy transfer, a premise that is philosophically contentious and not settled by the physics of the vat itself.
