answer: |-
  Here is the principle that organises your verdicts, followed by the audit of your cases, the test against new scenarios, and the honest accounting of what must be discarded.

  ### The Principle: Differential Expected Vulnerability

  A display $D$ carries information about a hidden state $S$ (e.g., commitment, quality, generosity) to a receiver $R$ in proportion to the **ratio of expected vulnerability** between a faker and a truth-teller.

  Formally, the information content $I$ is a function of:
  $$ I \propto \frac{E[\text{Cost} | \neg S, D]}{E[\text{Cost} | S, D]} $$

  Where "Cost" is defined not merely as resources expended at time $t_0$, but as the **net present value of all losses** incurred across the lifetime of the display, including:
  1.  **Sunk Costs:** Irrecoverable expenditures paid immediately (Case 1, 6).
  2.  **Contingent Liabilities:** Penalties triggered only if $S$ is later proven false (Case 3, 5, 9).
  3.  **Opportunity Costs:** Alternatives forgone that would have been viable for a different type (Case 4, 7).

  This principle requires three operational clauses to match your intuitions:

  **Clause A (The Marginal Utility Condition):** Cost must be evaluated relative to the agent's total capacity. A fixed sum is more informative if it represents a larger fraction of the agent's resources (Case 4).
  **Clause B (The Volition Condition):** The display must be chosen from a set of alternatives. If the agent had no viable alternative to $D$, the cost is zero for both types, and information is zero (Case 8).
  **Clause C (The Observability Condition):** Information exists objectively regardless of observation (Evidence), but *Signalling* requires that $R$ can perceive $D$ and, crucially, that $R$ holds the power to enforce contingent liabilities (Case 5 vs. 7).

  ---

  ### Audit of the Eleven Cases

  Here is how the principle sorts your cases, and which clause drove the verdict.

  **1. Unpaid leave/flight (Convincing).**
  *   **Mechanism:** Sunk Cost + Opportunity Cost.
  *   **Clause:** A & B. The cost is high relative to income (A) and voluntary (B). A faker would not burn this capital for a transient lie.

  **2. Condolence service (Unconvincing).**
  *   **Mechanism:** Decoupling of Attention from Expenditure.
  *   **Clause:** B. The monetary cost is identical, but the *cognitive* cost (attention) is zero for the user of the service. A faker can replicate the financial cost without the attentional cost. The display fails to tax the specific resource (care) it claims to signal.

  **3. Founder salary/staff pay (Convincing/Reverse).**
  *   **Mechanism:** Contingent Liability.
  *   **Clause:** C. If staff are paid well, the founder's low salary is a sunk cost signalling commitment to the mission. If staff are paid poorly, the low salary becomes a signal of extraction (or incompetence). The *context* determines the direction of the inference.

  **4. Heir vs. Nurse (Nurse stronger).**
  *   **Mechanism:** Marginal Utility.
  *   **Clause:** A. This forced Clause A into the principle. Absolute cost is irrelevant; relative deprivation is the signal.

  **5. Public Wedding vs. Private Honeymoon (Wedding signals, Honeymoon does not).**
  *   **Mechanism:** Social Collateral.
  *   **Clause:** C. This is the crux. A public wedding creates a *contingent liability*: if you divorce, you suffer social sanction. The audience holds the enforcement mechanism. A private honeymoon is a sunk cost, but it lacks the enforcement mechanism; you can divorce without social penalty. The Wedding is a **Bond**; the Honeymoon is mere **Consumption**.

  **6. Face Tattoo (Strong).**
  *   **Mechanism:** Irreversibility (Index-like).
  *   **Clause:** A & C. The cost is permanent and highly visible. It creates a permanent contingent liability (social stigma if the relationship ends).

  **7. Private Sacrifice (Better than tattoo).**
  *   **Mechanism:** Pure Sunk Cost.
  *   **Clause:** A. You argued this is a "better signal." Under the principle, this is **Evidence**, not a **Signal**. It carries immense information (high sunk cost), but because no receiver observes it *ex ante*, it cannot alter the receiver's behaviour *ex ante*. It proves loyalty to history, not to the partner.

  **8. Three jobs/medical bills (No signal).**
  *   **Mechanism:** Coercion.
  *   **Clause:** B. This forced Clause B. If there is no alternative, the cost of the display is the same for a loving sibling and an indifferent one (both must do it). No differential vulnerability exists.

  **9. Forfeitable sum (Credible).**
  *   **Mechanism:** Contingent Liability.
  *   **Clause:** C. This forced the "Contingent" aspect of the Cost definition. The cost is zero if true, high if false. This is often more efficient than sunk cost.

  **10. Stammer/Limp (Evidence, not signal).**
  *   **Mechanism:** Index.
  *   **Clause:** C. This forced the distinction between Signal and Index. The cost for a faker is infinite (physically impossible). It is perfect evidence, but not a strategic choice.

  **11. Anonymous Posthumous Donation (Clearest case).**
  *   **Mechanism:** Pure Sunk Cost.
  *   **Clause:** A. Supports Case 7. It is the purest form of vulnerability because the donor cannot benefit from the reputational gain. It is high-information *Evidence*, but zero-utility *Signalling*.

  ---

  ### The Conflict: Case 5 vs. Case 7

  You suspected these cannot both stand as "signals." You are correct.

  *   **Case 5 (Public Wedding)** is a **Signal**. It relies on the audience to enforce the cost. Without the audience, the contingent liability vanishes.
  *   **Case 7 (Private Sacrifice)** is **Evidence**. It relies on physics/time to enforce the cost. It does not require an audience to be "true," but it cannot function as a *signal* to a partner who does not know about it.

  **The Verdict:** You must abandon the claim that Case 7 is a "signal" to the partner. It is a *trait* that would signal *if discovered*. Case 5 is a signal *because* it is discovered.
  *   If your goal is **Communication** (altering the partner's expectations), Case 5 wins.
  *   If your goal is **Truth** (the objective reality of commitment), Case 7 wins.
  *   Your friend is right on terminology (Signalling requires a receiver); you are right on information theory (Cost creates truth regardless of observation).
  *   **Casualty:** You must categorise Case 7 as *Private Evidence* and Case 5 as *Public Signal*. They are not competing measures of the same thing; they are measures of different things (Internal Consistency vs. Social Binding).

  ---

  ### Testing the Survivors

  **Test Case 1: The Costless Public Apology.**
  *   *Scenario:* An apology that costs nothing now but forecloses later denial.
  *   *Analysis:* This is a **Contingent Liability** (Case 9 logic). By apologising publicly, the agent raises the cost of future contradiction. If they lie, they are caught in a contradiction later.
  *   *Verdict:* High information. It fits the principle because the "Cost" is deferred to the state of the world where the display is false.

  **Test Case 2: The Universal Initiation Ritual.**
  *   *Scenario:* A costly ritual every community member undergoes.
  *   *Analysis:* This is a **Pooling Equilibrium**.
  *   *Verdict:* Zero information. Because everyone pays the cost, $E[\text{Cost} | \neg S] = E[\text{Cost} | S]$. The ratio is 1. The display distinguishes members from non-members, but tells you nothing about the *quality* of the member. It signals *belonging*, not *virtue*.

  ---

  ### The Leaner Account and the 12th Case

  If you want a single, lean account, you must accept that **"Signal" implies "Receiver."** If there is no receiver, there is no signal, only evidence.

  **The Casualties:**
  1.  **Case 7 & 11:** These are not signals. They are *indices of character* that remain latent. You must stop calling them signals if you want to be precise.
  2.  **Case 5 (Honeymoon):** Your intuition that it signals "nothing whatever" is correct, but for a specific reason: it lacks *enforceability*. A public wedding is a bond; a private honeymoon is a purchase.

  **The Discriminator Case (Case 12):**
  To separate the "Audience is Essential" view (Friend) from the "Cost is Essential" view (You), consider this:

  *   **Case 12:** A man writes a letter of commitment, seals it in a time-lock safe set to open in 20 years, and gives the key to a lawyer with instructions to show it to his partner *only if* he abandons her.
      *   **Friend's View (Zahavian):** Not a signal. No audience receives the cost *now*.
      *   **Your View (Vulnerability):** Strong signal. It is a contingent liability (Case 9) secured by a third party.
      *   **My Principle's Verdict:** This is a **Bond**, not a Display. It functions exactly like Case 9. It carries high information *to the lawyer*, and high security *to the partner* (if she knows the bond exists), even if the content is hidden.
      *   **Resolution:** If the partner *knows the bond exists*, it is a signal (Case 9). If she does not know, it is merely insurance.

  ### Final Summary

  Your working formulation was 90% correct. You identified that **differential cost** is the engine, but you missed that **enforceability** is the transmission gear.

  1.  **Information** is created by **Differential Expected Vulnerability** (Sunk or Contingent).
  2.  **Signalling** requires that Vulnerability be **Observable** to a Receiver who can update beliefs.
  3.  **Reliability** is maximised when the Receiver also holds the power to **Enforce** contingent costs (Social Collateral).

  **Your Friend's Error:** She assumes cost must be sunk (Zahavi). She misses that contingent costs (bonds, apologies) work better.
  **Your Error:** You conflate *Evidence* (private cost) with *Signalling* (public cost).

  **Principle to keep:** The Principle of Differential Expected Vulnerability.
  **Verdict to drop:** That Case 7 is a "signal." It is the *substance* of commitment, but without observation, it cannot *signal* it. Case 5 works not because it is expensive, but because it is *policable*.
