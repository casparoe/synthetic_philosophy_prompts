      *   So the blurb's specific claim ("hand them the same choice twice") is technically wrong. You need a specific mechanism to exploit the *structure* of the lotteries, not just repetition.
      *   *Correction:* There is a "Allais Money Pump" discussed in literature (e.g., by Cubitt & Sugden), but it requires a specific dynamic setup where the common consequence is resolved or framed sequentially. It is not as robust as the intransitivity pump.

