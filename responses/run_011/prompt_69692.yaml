answer: |-
  This is a classic case of a behavioral economist overselling the normative punch of a descriptive finding. Your friend gets the empirical phenomenon right (people do choose A and D), but the theoretical gloss is sloppy, the history is garbled, and the Dutch book claim is significantly overstated.

  Here is the piece-by-piece breakdown from the perspective of formal decision theory.

  ### 1. The Setup and the Violation
  **The Blurb:** *"Most people take A and then take D. That's just self-contradictory: it breaks the independence axiom..."*

  **The Verdict:** **Mostly Accurate.**
  The setup is the standard Allais Common Consequence paradox. Within the framework of von Neumann-Morgenstern (vNM) Expected Utility Theory (EUT), choosing A over B and D over C is indeed a violation of the **Independence Axiom**.

  If $U(1M) > 0.10 U(5M) + 0.89 U(1M) + 0.01 U(0)$, then by subtracting the common 0.89 probability of winning 1M from both sides (which Independence allows), you must prefer the remaining 0.11 chance of 1M over the 0.10 chance of 5M. But in the second pair (C vs D), people prefer the 0.10 chance of 5M. Mathematically, within EUT, this is inconsistent.

  ### 2. The Gloss on Independence
  **The Blurb:** *"...which is really only the claim that irrelevant alternatives shouldn't change your ranking."*

  **The Verdict:** **Technically False.**
  This is a category error. Your friend is conflating the **Independence Axiom** (vNM Decision Theory) with **Independence of Irrelevant Alternatives** (IIA, from Social Choice/Arrow or Luce's Choice Axiom).

  *   **IIA** says if you prefer A to B, adding option C to the menu shouldn't make you switch to B.
  *   **vNM Independence** says if you prefer Lottery L1 to Lottery L2, then a mixture of (L1 + L3) should be preferred to (L2 + L3).

  The Allais paradox works precisely because the "irrelevant" alternative (the 89% chance of 1M) *is* relevant to the psychological weighting of probabilities, even if EUT says it should cancel out mathematically. Calling it "irrelevant alternatives" suggests a menu problem, when Allais is actually about **common consequences** within probabilistic outcomes. A decision theorist would flag this immediately as imprecise terminology.

  ### 3. The Historical Ordering (Savage vs. Allais)
  **The Blurb:** *"Savage then built his sure-thing principle partly to answer Allais."*

  **The Verdict:** **Historically Misleading.**
  The timeline is tighter and more nuanced than this suggests.
  *   **Allais** presented his paradox at a conference in Paris in **1952** (published 1953).
  *   **Savage** was already drafting *The Foundations of Statistics* (published **1954**).

  Savage attended the 1952 conference. He was famously shaken by Allais's presentation. In the preface to his book, Savage admits that upon first hearing the argument, he violated the Sure-Thing Principle himself. He didn't build the principle *to answer* Allais; he had already developed it. Instead, he used the book to argue that while the Allais choice is psychologically natural, it is **normatively wrong**. He argued that once you realize the logical structure, a rational agent *ought* to conform to the axiom.

  So, Savage didn't build the system to refute Allais; he used his system to argue Allais preferences are irrational. The blurb reverses the intellectual motivation.

  ### 4. The "No Utility Function" Claim
  **The Blurb:** *"...since no utility function whatsoever can generate those two choices..."*

  **The Verdict:** **False.**
  This is the most glaring theoretical error.
  *   No **Expected** Utility function (linear in probabilities) can represent these choices.
  *   However, many **Non-Expected** Utility functions can. Rank-Dependent Utility (Quiggin), Cumulative Prospect Theory (Tversky/Kahneman), and Disappointment Theory all have functional forms specifically designed to generate Allais preferences coherently.

  To say "no utility function whatsoever" implies the agent has no consistent preference ordering over outcomes. That's not true. They have a consistent ordering over *outcomes* (5M > 1M > 0), but they weight probabilities non-linearly. The agent is not "incoherent" in a general sense; they are only incoherent relative to the specific axioms of EUT.

  ### 5. The Dutch Book (Money Pump)
  **The Blurb:** *"...hand them the same choice twice in sequence and a bookie can bleed them dry, guaranteed."*

  **The Verdict:** **Exaggerated / Context-Dependent.**
  This is the "decoration" you suspected it was.

  1.  **Static vs. Dynamic:** You cannot money-pump a static preference violation simply by "handing them the same choice twice." A money pump requires **dynamic inconsistency** or **intransitivity** (A>B, B>C, C>A). The Allais preference (A>B and D>C) is not intransitive in a single set.
  2.  **The Mechanism:** To pump Allais preferences, you need a specific dynamic setup where the resolution of uncertainty is sequential, allowing the agent to pay to switch from B to A, and then (under specific framing) pay to switch back or switch sides. This requires the agent to be **naive** about their own future preferences.
  3.  **Sophistication:** A "sophisticated" agent who knows they have Allais preferences can adopt a **resolute choice** strategy. They can pre-commit to a plan and refuse the sequential trades that would bleed them. As decision theorist Edward McClennen argued, dynamic consistency is a separate norm from static consistency. You can violate Independence without being money-pumpable if you are resolute.
  4.  **"Guaranteed":** In decision theory, "guaranteed" is a heavy word. Transaction costs, awareness, and framing effects all break the pump. The claim that it is "guaranteed" simply by repeating the choice is technically incorrect.

  ### Summary for Your Friend
  If you want to reply constructively, here is the distilled feedback:

  1.  **Empirics:** You're right, people choose A and D.
  2.  **Theory:** You're right that this violates vNM Independence, but wrong that it violates "irrelevant alternatives" (that's Arrow's IIA).
  3.  **History:** Savage didn't build his system to answer Allais; he was already writing it and later argued Allais was normatively wrong.
  4.  **Utility:** Plenty of utility functions (Prospect Theory, etc.) model this perfectly. It's only incompatible with *Expected* Utility.
  5.  **Dutch Book:** This is the weak link. Static Allais preferences aren't directly money-pumpable without a specific dynamic mechanism and a naive agent. It's not "guaranteed" by mere repetition.

  **Bottom Line:** The blurb is good behavioral econ marketing (punchy, emphasizes irrationality), but it's sloppy decision theory. It treats a violation of one specific normative model (EUT) as proof of general incoherence, which most modern decision theorists (even normative ones) would reject.
