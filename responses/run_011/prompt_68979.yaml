answer: |-
  There is no single, canonical label in the historiographical or philosophical literature that captures this configuration with the precision you require. The phenomenon you describe is a specific, structural instantiation of broader logical problems—namely **retrospective determinism**, **functionalist tautology**, and **post-treatment bias**—but applied specifically to the *individuation of roles* within substitution counterfactuals.

  Because the existing vocabulary is either too broad (e.g., "hindsight bias") or misdirected (e.g., "functionalism," which usually concerns feedback mechanisms), I recommend you designate this **Retrospective Role Individuation (RRI)**.

  Below is a precise statement of the phenomenon, its distinction from adjacent concepts, an analysis of your four variants, and its application outside historiography. This is designed to be handed to students as a diagnostic tool.

  ---

  ### 1. The Phenomenon: Retrospective Role Individuation (RRI)

  **Definition:**
  Retrospective Role Individuation occurs when a structuralist explanation relies on a substitution counterfactual ("Person X could be replaced by Person Y"), but the functional description of the "position" or "role" to be filled is derived *ex post facto* from the specific attributes and actions of the actual occupant (Person X), rather than from independent structural criteria established prior to the occupation.

  **The Diagnostic Test for Students:**
  To determine if an argument exhibits RRI, ask the following three questions. If the answer to all three is "Yes," the defect is present:
  1.  **The Substitution Claim:** Does the argument claim the outcome was structurally determined because *any* occupant satisfying condition $C$ would have produced outcome $O$?
  2.  **The Derivation:** Is condition $C$ (the description of the role) constructed by observing the specific traits/actions of the *actual* occupant who produced $O$?
  3.  **The Independence:** Is there no independent evidence (predating the appointment) that condition $C$ was required by the structure, distinct from the fact that the actual occupant satisfied $C$ and produced $O$?

  **The Symmetrical Defect (Great-Man Theory):**
  You correctly noted the symmetry. The "Great Man" theorist commits **Excessive Outcome Individuation**. They define the outcome $O$ so narrowly (e.g., "The Holocaust exactly as it occurred, with these specific dates and orders") that the causal chain becomes unique to the individual.
  *   **RRI (Structuralist):** Makes the *Cause* (the role) too flexible by defining it retrospectively.
  *   **Excessive Outcome Individuation (Agency-Theorist):** Makes the *Effect* (the regime) too rigid by defining it retrospectively.
  *   **General Class:** Both are forms of **Counterfactual Relata Slippage**, where the definitions of the variables shift to guarantee the desired conclusion.

  ---

  ### 2. Nearest Established Concepts (and How They Differ)

  You should teach these as "neighbors" that are often confused with RRI.

  | Concept | Definition | How it differs from RRI |
  | :--- | :--- | :--- |
  | **Retrospective Determinism** (Merton) | The assumption that because an event occurred, it was inevitable. | This is the *conclusion* RRI supports, not the *mechanism*. RRI is the logical move used to argue for retrospective determinism. |
  | **Functionalist Tautology** | Explaining a structure by its function, where the function is inferred only from the structure's existence. | Standard functionalism worries about *feedback loops* (the effect sustains the cause). RRI worries about *definition* (the effect defines the role). |
  | **Hindsight Bias** (Fischhoff) | The cognitive tendency to see past events as having been more predictable than they were. | This is an *epistemic/psychological* error in the reasoner. RRI is a *logical/structural* error in the argument's construction, regardless of the reasoner's psychology. |
  | **Texas Sharpshooter Fallacy** | Selecting a cluster of cases after the fact to fit a pattern. | As you noted, this usually concerns *case selection*. RRI is the Sharpshooter fallacy applied to *variable definition*: painting the target (the role) around the bullet hole (the person). |
  | **Post-Treatment Bias** (Causal Inference) | Conditioning on a variable that is influenced by the treatment. | This is the closest technical analogue. In RRI, the "Role" is treated as a pre-existing cause, but it is operationally defined by the "Outcome," making it a post-treatment variable. |

  ---

  ### 3. Analysis of Variants

  Here is how the defect behaves in the four scenarios you proposed. This provides the boundary conditions for your seminar.

  **(i) The functional description is documented from material predating the appointment.**
  *   **Status:** **Absent.**
  *   **Reasoning:** If a party programme or press speculation from 1932 specifies, "The next leader must be able to unify the factions and appease the Army," and *then* Hitler fulfills this, the role is independently individuated. The counterfactual ("Someone else who could unify factions...") is now falsifiable. If no one else could do it, the structuralist claim fails. The definition is no longer parasitic on the outcome.

  **(ii) The structuralist explicitly commits in advance to a class of outcomes.**
  *   **Status:** **Attenuated.**
  *   **Reasoning:** If the claim is "Any successor would have produced an *authoritarian nationalist regime* (Class $K$)," rather than "Nazi Germany (Outcome $O$)," the argument becomes falsifiable. We can imagine a successor producing a military dictatorship without the nationalist grievance component. However, RRI can still creep in if the definition of Class $K$ is subtly adjusted after the fact to ensure the actual regime fits inside it. The defect is attenuated but requires vigilance regarding the boundaries of Class $K$.

  **(iii) The substitution is run the other way (Structure persists, Leadership changes, Regime alters).**
  *   **Status:** **Absent (and Disconfirming).**
  *   **Reasoning:** This is the strongest test. If the structural conditions (one-party rule, security apparatus) remained constant between Leader A and Leader B, but the regime's character changed markedly (e.g., de-Stalinization), this empirically demonstrates that the "role" did not structurally determine the "outcome." It breaks the link between the functional description and the specific occupant. This is evidence *against* the structuralist claim, proving the role was not overdetermined in the way alleged.

  **(iv) The office is highly institutionalised (Legally constrained powers).**
  *   **Status:** **Absent.**
  *   **Reasoning:** In a constitutional monarchy or a bureaucratic dictatorship with formal succession rules, the "role" is individuated by law or statute, not by the occupant's performance. The powers of the "President" are defined by the Constitution, not by what President X actually did. Substitution counterfactuals here are valid because the "vacancy" has pre-existing boundaries. RRI thrives in charismatic or revolutionary movements where authority is personal and the "needs of the movement" are interpreted retrospectively.

  ---

  ### 4. Extra-Historical Applications

  This is not a local vice of counterfactual history; it is a general defect in **role-and-occupant reasoning** across the social sciences. Identifying this will help your students see the methodological unity of the problem.

  **A. Sociology of Science (Multiple Discovery)**
  *   **Context:** The argument that "If Newton hadn't discovered calculus, Leibniz (or someone else) would have," used to prove scientific inevitability.
  *   **RRI Presence:** **High.**
  *   **Mechanism:** Historians often define the "state of the field" (the structural role) by looking at what Newton and Leibniz *actually* solved. They argue the "problem was ripe." But "ripeness" is often defined by the fact that it *was* solved. If the problem was truly structurally determined, we should see multiple failed attempts clustering around the same solution *before* the discovery, not just the inference of necessity from the success.
  *   **Teaching Point:** Ask students: "Is the 'readiness' of the field described by letters and drafts predating the discovery, or by the fact that the discovery occurred?"

  **B. Organizational Theory (Key-Person Risk)**
  *   **Context:** Board members arguing, "Our CEO is indispensable," vs. Consultants arguing, "Any competent CEO could run this firm."
  *   **RRI Presence:** **High.**
  *   **Mechanism:** The consultant says, "The firm needs a visionary strategist." They derive "visionary strategist" from the current CEO's successes. If the firm fails under a new CEO, the consultant retreats to "They just needed a *different kind* of visionary." The "role" is never fixed independently of the incumbent's performance.
  *   **Teaching Point:** This is the corporate equivalent of the "Nazi Germany without Hitler" debate.

  **C. Functionalist Explanations of Institutions**
  *   **Context:** Arguing that a prison system exists "to control the surplus population."
  *   **RRI Presence:** **Moderate to High.**
  *   **Mechanism:** If the "function" is identified only by observing what the prison *does* in practice, rather than by the stated intent of the legislators or the design of the system *ex ante*, the explanation is tautological. (This is Merton's classic critique of functionalism).
  *   **Teaching Point:** Distinguish between *manifest functions* (stated, pre-existing) and *latent functions* (inferred, often prone to RRI).

  ### Summary for the Seminar Syllabus

  You might introduce this to your students as follows:

  > "When evaluating substitution counterfactuals, beware of **Retrospective Role Individuation**. This occurs when the 'hole' is shaped to fit the 'peg' that was actually there.
  >
  > *   **Valid Structural Argument:** 'The system required a leader with traits A, B, and C (defined by 1930 party documents). Hitler had A, B, and C. Anyone with A, B, and C would have produced Outcome X.'
  > *   **RRI Defect:** 'The system required a leader who could do what Hitler did. Therefore, anyone who did what Hitler did would have produced Outcome X.'
  >
  > In the second case, the explanation is empty. It tells us only that Hitler was Hitler."

  This configuration is logically distinct from hindsight bias because it can be committed by a historian who fully acknowledges the contingency of the past, yet still constructs their variables in a way that precludes testing that contingency. It is a flaw in **operationalization**, not just perception.
