      *   Check "analyse" (verb).

      *Self-Correction on Conflict Ordering:*
      The contradiction between (3) and (4) is the most logical flaw. If the data is biased by race (3), ignoring race (4) cannot fix it. This is a hard logical error.
      The tension between (3) and (2) is a normative/validity issue. If the data is biased, calibration is less valuable. This is a substantive policy flaw.
      The tension between (4) and empirical reality (proxies) is an evidential risk.

      Let's group (3) vs (4) as the primary logical failure.
      Let's group (3) vs (2) as the primary validity failure.
      Let's group (1) vs (2) as the non-conflict.

      *Revision Strategy:*
      For (3) vs (4): Drop (4). Acknowledge proxies. Cost: Need to measure disparate impact directly.
      For (3) vs (2): Qualify (2). Calibration is necessary but not sufficient if labels are biased. Cost: Weakens the defence of the tool's fairness.

      *Wait, one more check:* The user asked for "which has to go". I need to be decisive.
      If (3) is held as true (base rates are artefacts), then (4) *must* go because it's logically false given (3).
      If (3) is held as true, (2) becomes morally precarious but logically possible (you can calibrate to a biased label). However, the *justification* for (2) weakens.
      So (4) is the easiest to sacrifice logically. (2) is the hardest to sacrifice politically/practically but is undermined by (3).

