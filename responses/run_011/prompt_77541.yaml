answer: |-
  **HANDOUT: Readings of "Rigid Designator"**

  **R1: Obstinate Rigidity (Strong Constancy)**
  1.  **Formal Gloss:** Let $W$ be the set of possible worlds and $I$ an interpretation function mapping term $t$ and world $w$ to an object. $t$ is rigid iff $\exists o \forall w \in W [I(t, w) = o]$. This treats "designates" as a function yielding a constant semantic value across $W$, presupposing a cumulative domain where $o \in D(w)$ for all $w$, or allowing $o$ to be outside $D(w)$.
  2.  **Verdict:** False (for contingent beings). It requires Aristotle to exist in worlds where he is never born, violating actualist intuitions about existence. It is well-formed only in a possibilist framework.
  3.  **Distinction/Actually:** Does not distinguish names from descriptions prefixed with "actually" (e.g., "the actual teacher of Alexander" also satisfies R1). To defeat descriptivism, one must argue names are rigid *without* semantic reliance on "actually."
  4.  **Identity Inference:** Supports $\Box(a=b)$ trivially. Requires no further assumptions other than the substitutivity of identity.

  **R2: Persistent Rigidity (Weak Constancy)**
  1.  **Formal Gloss:** $t$ is rigid iff $\exists o \forall w \in W [(o \in D(w) \to I(t, w) = o) \land (o \notin D(w) \to I(t, w) = \text{undefined})]$. This treats "designates" as a relation holding at a world only if the object exists there.
  2.  **Verdict:** Substantive and defensible. It accommodates the intuition that Aristotle does not exist in some worlds while maintaining reference stability where he does exist.
  3.  **Distinction/Actually:** Like R1, it does not distinguish names from "actually"-rigidified descriptions. The anti-descriptivist argument requires the additional premise that the *ordinary* descriptivist candidate (sans "actually") fails this condition.
  4.  **Identity Inference:** Supports $\Box(a=b)$ provided $a$ and $b$ exist in the world of evaluation. Requires a free logic or an existence presupposition to handle worlds where the bearers are absent.

  **R3: The Identity Profile (Modal Necessity of Identity)**
  1.  **Formal Gloss:** $t$ is rigid iff $\Box \forall x (x = t \to \Box x = t)$. This characterizes rigidity not by constancy of designation but by the modal profile of identities the term enters into.
  2.  **Verdict:** Substantive. It is equivalent to R1 and R2 only under the assumption that $t$ denotes an object in every world (or that quantifiers range over a cumulative domain). Equivalence fails in actualist frameworks where $t$ may be empty in some worlds; if $t$ fails to denote at $w$, the antecedent $x=t$ is false, potentially trivializing the condition depending on the logic of empty terms.
  3.  **Distinction/Actually:** "The actual F" satisfies this condition. Distinguishing names requires showing that "The F" (without "actually") fails this profile.
  4.  **Identity Inference:** This reading *is* the inference rule. It directly supports the necessity of identity without further assumptions, provided the logic handles empty terms consistently.

  **R4: Quasi-Rigidity (Actual or Nothing)**
  1.  **Formal Gloss:** $t$ is quasi-rigid iff $\forall w \in W [I(t, w) \in \{I(t, w_{@}), \text{undefined}\}]$.
  2.  **Verdict:** Coincides with R2 in frameworks admitting objects that do not exist at the world of evaluation (where $I(t,w)$ is undefined when the object is absent). In possibilist frameworks where $I(t,w)$ must always return an object, it coincides with R1.
  3.  **Distinction/Actually:** Coincides exactly with the behavior of "actually"-rigidified descriptions. It offers no independent leverage against descriptivism unless paired with a claim about semantic structure.
  4.  **Identity Inference:** Supports the inference only if the logic treats "undefined" as failing to satisfy identity predicates. Requires careful handling of truth-value gaps.

  **R5: Rigidity for General Terms (Kind Constancy)**
  1.  **Formal Gloss:** For a general term $T$, rigidity is $\exists K \forall w \in W [I(T, w) = K]$, where $K$ is a kind (intension), not an extension. Contrast with $\exists E \forall w \in W [\text{Extension}(T, w) = E]$, which is false for natural kinds.
  2.  **Verdict:** Substantive. Extends R1/R2 coherently only if we treat kinds as abstract objects existing in all worlds. It distinguishes "water" (rigid kind) from "the clear liquid in lakes" (non-rigid kind/extension).
  3.  **Distinction/Actually:** "The actual clear liquid..." picks out the same kind. The distinction rests on whether the term *semantically* invokes the actuality operator.
  4.  **Identity Inference:** Supports $\forall x (Water(x) \leftrightarrow H_2O(x)) \to \Box \forall x (Water(x) \leftrightarrow H_2O(x))$, assuming the kind identity is necessary.

  ***

  **Seminar Argument Requirement**

  The seminar's argument against descriptivism requires **R2**. The argument turns on the premise that "Aristotle" refers to the same individual in counterfactual scenarios where we assess his properties, even if he does not exist in those scenarios (e.g., "Aristotle might not have existed"). R1 is metaphysically untenable for contingent beings, as it forces existence in all worlds. R3 and R4 are derivative of R2 or collapse into it under actualist assumptions. R2 preserves the modal intuition necessary to generate the contradiction with non-rigid descriptions (like "the teacher of Alexander") while accommodating the student's correct observation that names fail to designate in worlds where the bearer is absent. If R2 is false, the name fails to track the object across the relevant modal space, and the modal argument loses its grip on the descriptivist's contingency claim.

  Verdict: R2
