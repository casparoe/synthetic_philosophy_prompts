      *   **Task:** Unpack the formula "the meaning of life is play." Distinguish distinct precise claims (phenomenological, axiological, structural, developmental, stipulative, empirical). Evaluate each (trivial, defensible, false). Determine which readings license the instructor's dismissals. Address the "sense vs. purpose" ambiguity. Address the user's personal dilemma (secure position vs. uncertain one).
      *   **Constraint:** *Take a position.* Do not just list options. Say which reading is best, what needs to be added/surrendered, and what the user ought to have said.
