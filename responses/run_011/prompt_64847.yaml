answer: |-
  1. The film's sharpest contribution is demonstrating that without memory, authority collapses into manipulability, rendering the distinction between following a directive and being hijacked by a stranger indistinguishable. Leonard's tattoos function not as binding commands from a past self but as external inputs that a cognitively hollowed-out present self must blindly trust. This exposes executability as the prerequisite for any claim of authority, rather than the other way around.

  2. The reverse chronology performs philosophical work by forcing the viewer to experience the asymmetry between authoring a directive and executing one. When we see Leonard write a note, it looks like autonomy, but the black-and-white segments force us to watch him find and obey that same note without context. In this light, the act transforms into coercion by a past self who is effectively a stranger.

  3. Sammy Jankis serves as the counter-example where a directive exists but lacks executability because the psychological capacity to recognize the condition is absent. Leonard co-opts this story to mask his own refusal to accept his condition, suggesting the debate over personal identity is secondary. The real question is whether the later self is capable of recognizing the earlier self's intent without distorting it.

  4. However, the film cheats by presenting a condition where procedural memory remains intact while declarative memory is wiped, a specificity that real neurodegenerative diseases rarely mimic so cleanly. We must resist the implication that actual dementia patients are trapped in perpetual presents without emotional continuity. Leonard's retained ability to feel grief and vengeance smuggles in a coherence his diagnosis should preclude.

  5. Ultimately, the film contributes a visceral phenomenology of breakdown that abstract ethical papers cannot capture, showing how easily the infrastructure of autonomy becomes a weapon against the self. It argues that without a mechanism for updating values in real-time, advance directives risk becoming tools for a dead self to tyrannize a living one. This holds true regardless of the moral weight assigned to precedent autonomy in standard bioethical literature.
