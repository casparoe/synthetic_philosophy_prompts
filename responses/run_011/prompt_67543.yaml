answer: |-
  Your Beam Test is elegant, but it is falsified by your own verdicts. Specifically, Cases 4 and 7 break it.

  **Case 7 (Latin)** breaks Clause (b). You admit a current function exists ("sorts kids," "signals families"). By your rule, a named, load-bearing beam means the practice stays. But you want it gone. This means your actual heuristic includes a value judgment on the *quality* of the beam, which your rule explicitly excludes. You aren't testing for beams; you're testing for *virtuous* beams.

  **Case 4 (Monastery)** breaks Clause (b) and (c). You state the original function is known and obsolete. You do not name a *current* function (e.g., "spiritual discipline"). Yet you want to keep it. Your Beam Test demands a current load-bearing function to justify retention. Your gut recognizes that some practices transition from **Instrumental** (a means to an end) to **Constitutive** (the end itself). The silence is no longer a fence protecting peace; it *is* the monastery.

  Your Clause (c) ("prior should lean toward there being a beam") is doing sneaky work, but it's too blunt. It treats a footpath like an HOA rule. It treats a safety taboo like a class signal.

  Here is the principle that actually matches your gut, followed by the case that breaks it.

  ### The Principle: Domain-Weighted Asymmetry

  **Rule:** The burden of proof for removal is not uniform. It scales based on the **Domain** of the practice and the **Reversibility** of the error.

  1.  **Physical/Biological Domain (Shellfish, Path, Milk):**
      *   **Prior:** High probability of hidden complexity (Clause C is active).
      *   **Asymmetry:** False Negative (keeping a useless rule) is cheap. False Positive (removing a vital rule) is catastrophic (death, injury).
      *   **Verdict:** Keep until proven safe.
      *   *Handles Cases 2, 5, 6.*

  2.  **Social/Political Domain (HOA, Latin, Margarine):**
      *   **Prior:** High probability of hidden power dynamics or arbitrary preference. Survivorship bias here selects for *entrenched interests*, not wisdom.
      *   **Asymmetry:** False Negative is annoying. False Positive is usually reversible with low cost.
      *   **Verdict:** Tear unless a *virtuous* current function is demonstrated.
      *   *Handles Cases 1, 2, 7.*

  3.  **Ritual/Constitutive Domain (Monastery, Ham*):**
      *   **Prior:** Ambiguous.
      *   **Test:** Is the practice Instrumental or Constitutive?
      *   **Instrumental (Ham):** If the tool no longer fits the job (pan size), discard.
      *   **Constitutive (Monastery):** If the practice *defines* the group identity, origin is irrelevant. It stays unless the identity itself is rejected.
      *   *Handles Cases 3, 4.*

  *(Note on Ham: You classified Ham as Instrumental. If the mother had said "We cut the ends to honor the ancestor," your verdict would likely shift to Keep, even if the pan was big enough.)*

  ### Where Your Reasoning Fails

  Your reasoning fails on **Clause (c)** because it assumes "Survival = Wisdom." In social systems, "Survival = Power."

  In Case 1 (HOA), the rule survived not because it prevented drainage issues, but because the board has the power to enforce aesthetics. Your gut knows this. You applied a "Social Domain" prior (low burden to remove) despite the unknown reason.

  In Case 6 (Path), the path survived because of physical wear or land topology. Your gut knows this. You applied a "Physical Domain" prior (high burden to remove).

  Your Beam Test tries to be domain-agnostic. It can't be. A fence in a software codebase (logical) requires a different prior than a fence in a ecosystem (biological) or a church (teleological).

  ### The Splitter Case

  Here is a case designed to split **Domain-Weighted Asymmetry** from **The Beam Test**.

  **The Case: The "Legacy Comment" in Safety-Critical Code.**
  A nuclear power plant's control software has a line of code: `if (sensor_reading > 100) { override = true; } // DO NOT CHANGE`.
  *   **Context:** The sensor hardware was replaced 5 years ago. The new sensors output values on a scale of 0-1000. The old threshold of 100 is now functionally "always on" or "never on" depending on the scaling, but the system hasn't crashed.
  *   **Investigation:** No living engineer knows why 100 was chosen. The documentation is lost.
  *   **Beam Test:** Keep. (Clause C: Prior toward beam. Burden on remover. High risk of breaking.)
  *   **Domain Principle:** **Tear.**
      *   **Reasoning:** This is a **Logical/Physical Hybrid**. The "Physical" risk suggests keeping it. But the "Logical" nature of code means the reason is almost certainly a specific constraint (the old sensor maxed at 100). Since the hardware changed, the *beam* (hardware constraint) is objectively gone, even if the *risk* remains.
      *   **The Split:** The Beam Test says "Don't touch, you don't know the beam." The Domain Principle says "The domain changed (hardware swap), rendering the prior invalid. The asymmetry now favors removal because the 'beam' is logically impossible (old hardware constraint), making the code a ticking time bomb of confusion."

  **My Ruling:** Tear it (with a backup). The hardware change invalidates the survivorship bias. The "beam" was the sensor, not the safety logic.

  **Your Move:** Check your gut.
  *   If you want to **Keep** the code line: You are a pure Chestertonian. You believe survival in a high-stakes environment trumps logical obsolescence. You must admit Case 7 (Latin) is inconsistent, because that was also high-stakes (career tracking) and survived.
  *   If you want **Tear** the code line: You agree that **Context Shifts** kill Chesterton's Fence. If the environment changes (horses to cars, analog sensors to digital), the fence is not wisdom; it is debris.

  ### What Would Change My Mind

  Two things would force me to scrap the Domain-Weighted Principle and retreat to your Beam Test:

  1.  **Evidence of Latent Social Wisdom:** If sociological data showed that "arbitrary" traditions (like the Monastery silence or even the HOA RV rule) consistently produce higher long-term community cohesion *specifically because* their reasons are opaque. If opacity itself is the beam.
      *   *Why:* This would validate Clause (c) across Social domains, merging Social and Ritual domains.
  2.  **Evidence of Catastrophic "Simple" Removals:** If I saw a dataset where "obvious" removals in Social domains (repealing obscure laws, removing HOA rules) led to systemic collapse more often than in Physical domains.
      *   *Why:* Currently, I assume Social errors are reversible. If they are path-dependent and irreversible (like burning a bridge), the Asymmetry argument collapses, and we must default to Keep.

  **On Case 4 (Monastery):** I would change my ruling to **Tear** if you could prove the silence causes measurable psychological harm to the novices without producing a commensurate spiritual benefit. I treat "Spiritual Benefit" as a claimed beam. If you deny the beam exists (no benefit), I tear the fence, regardless of tradition. If you claim the benefit is "ineffable," I keep it, because ineffability is a claim of high-complexity function.

  **On Clause (c):** I would scrap it entirely if you showed me that survivorship bias in cultural practices is net-negative—that is, if bad practices survive *more often* than good ones due to selection pressures (e.g., practices that benefit leaders survive, even if they hurt the group). If `P(Beam | Survival) < 0.5`, your prior flips.

  Go check your gut on the Code Case. That's where your actual operating system lives.
