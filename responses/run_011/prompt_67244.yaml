answer: |-
  Here are the comments, structured by your four questions, followed by the epistemic mapping you requested.

  ### 1. The Indexical Slide
  **Verdict:** The distinction is real, but you are overstating its dialectical power.

  You are correct that directive language conflates a normative claim about the good life (a) with an empirical prediction about future desire (b). However, characterizing the Dworkin–critic debate as a confusion over *which* proposition is being asserted is too charitable to the participants.
  *   **Dworkin** knows he is asserting (a). He explicitly argues that (b) is irrelevant because the "now-self" lacks the capacity for critical interests. He doesn't think he is predicting the demented patient's wishes; he thinks he is enforcing the competent patient's right to integrity.
  *   **The Critics** (e.g., Dresser, Robertson) do not object because they think (b) is false (though they do think that too). They object because they deny that (a) has *moral authority* over a psychologically discontinuous entity.

  **Does the "stable preferences" reply work?**
  No. The reply is: "If preferences are stable, (a) and (b) converge, so the slide doesn't matter." This fails because the entire philosophical problem of advance directives arises *only* in cases of instability (dementia, PVS). In stable cases, there is no conflict. So, the slide is operative exactly where the argument lives.
  **Fix:** Don't claim the debate rests on a semantic confusion. Claim that recognizing the slide allows us to **split the authority**. Dworkin wants (a) to dictate outcomes. Critics want current interests to dictate outcomes. Your view allows (a) to set the *burden of proof* without dictating the *outcome*. That is the innovation, not the distinction itself.

  ### 2. Fairness to Dworkin and Critics
  **Verdict:** You are slightly straw-manning Dworkin, and mislocating the Critics' objection.

  *   **Dworkin:** You write: *"The integrity argument only gets off the ground on (a)."* This is true. But you imply he treats the directive as a "verdict." Dworkin treats it as an exercise of **precedent autonomy**. The difference is subtle but matters for your "default" argument. A verdict ends deliberation; an exercise of autonomy creates a strong presumption. You can claim Dworkin *effectively* treats it as a verdict, but acknowledge he frames it as autonomy.
  *   **Critics:** You write: *"The critics' objection has its full force only against (b)."* This is the weak point. Their objection has full force against (a) as well. They argue that the "earlier self" is a different moral agent than the "later self." Therefore, (a) is merely the preference of a stranger.
  *   **Fix:** Reframe the contribution. Your (a)/(b) split doesn't solve their disagreement; it **dissolves the stalemate**. It allows you to grant Dworkin that (a) matters (respecting the narrative) without granting him that (a) trumps current welfare. It allows you to grant Critics that current welfare matters without granting them that the earlier self is irrelevant. You are offering a hybrid authority structure, not correcting their reading of the text.

  ### 3. Non-Vacuousness (The "Rebuttable Default")
  **Verdict:** This is the highest risk area. A referee will likely claim you have described "Substituted Judgment" with extra steps.

  In most US jurisdictions and bioethical frameworks, advance directives are *already* treated as rebuttable defaults.
  *   **Current Practice:** Surrogates are instructed to use "Substituted Judgment" (what would the patient want?) but can fall back on "Best Interests" if the directive is ambiguous or circumstances have changed. This *is* a burden-shifting model.
  *   **The Trap:** If your "rebuttable default" is just "follow the directive unless there's a good reason not to," you have described the status quo.
  *   **How to Make it Bite:** You need to contrast your view with the **legalistic/binary** interpretation that dominates family deliberation. Families often treat ADs as "living wills" in the testamentary sense—binding commands that cannot be violated without guilt. Clinicians often treat them as legal shields.
  *   **The Addition:** Your "graded authority" point is the key. Current practice tends to be binary (the directive applies or it doesn't). Your view suggests the directive specifies *how hard* it is to override. A directive that says "I trust my sister's judgment on my contentment" creates a *higher* threshold for rebuttal than one that says "No tubes."
  *   **Requirement:** You must explicitly argue that current practice fails because it treats directives as **outcome-specific** (verdicts) rather than **process-specific** (instructions on deliberation). That is the non-vacuous claim.

  ### 4. The Last Paragraph
  **Verdict:** Do not cut it, but do not concede defeat. The distinction you need is **Procedural vs. Substantive Specificity**.

  Your worry is that specifying "evidence of contentment" collapses back into "condition specificity." This is a category error you can exploit.
  *   **Substantive Specificity (What you rejected):** "If I have pneumonia, no antibiotics." (Fails because clinical scenarios are disjunctive).
  *   **Procedural Specificity (What you are proposing):** "My sister's assessment of my smiling counts as evidence; a nurse's assessment does not." OR "It takes three independent observations of distress to override this."
  *   **The Fix:** Rewrite the reply to the objection. Argue that specifying *epistemic thresholds* is not the same as specifying *clinical conditions*. It anchors the default in the *social epistemology* of the bedside, not the medical ontology of the disease. This preserves the "default" structure without making it toothless. It makes the directive robust against motivated families by raising the *procedural bar* for rebuttal, not by listing more medical scenarios.

  ---

  ### Epistemic Mapping: Settled vs. Contested

  You asked to mark which claims are settled background and which are live disputes. Here is the landscape as it stands in current bioethics/legal philosophy:

  **1. The Nature of Interests (Dworkin's Critical vs. Experiential)**
  *   **Status:** **Highly Contested.**
  *   **Context:** Dworkin's distinction in *Life's Dominion* is a specific theoretical move, not background consensus. Many philosophers (e.g., Jaworska, McMahan) reject the sharp dichotomy or argue that demented patients retain some critical interests.
  *   **Advice:** Do not present Dworkin's view as "The Standard View." Present it as "The Precedent Autonomy View." When you say "The standard debate... is about whether the earlier self has authority," that is fair, but acknowledge that the *grounds* of that authority (critical interests) are the specific point of contention.

  **2. Psychological Continuity and Personal Identity**
  *   **Status:** **Live Dispute.**
  *   **Context:** The Critics' reliance on psychological discontinuity (that the demented patient is a "different being") relies on a Lockean/Parfitian view of personhood. This is not settled law or ethics. Many legal frameworks assume continuity of the biological human being regardless of psychology.
  *   **Advice:** Be careful not to imply the Critics' view is the "realist" view. It is a competing metaphysical commitment. Your "rebuttable default" view is attractive precisely because it attempts to sidestep this metaphysical quagmire. Make that explicit.

  **3. The Legal Status of Advance Directives**
  *   **Status:** **Settled (that it is variable/messy), Contested (on normative weight).**
  *   **Context:** It is a settled fact that laws vary by state/country. Some treat ADs as binding statutes (verdicts); others treat them as evidence of preference (defaults).
  *   **Advice:** You cannot assume the "verdict" model is false everywhere. In some jurisdictions, a living will *is* legally binding if conditions are met. Your argument is normative (how it *ought* to function in deliberation), not necessarily descriptive of current law. Clarify that you are arguing for a normative shift in *clinical ethics*, even if the law lags.

  **4. Substituted Judgment vs. Best Interests**
  *   **Status:** **Settled (as the prevailing framework), Contested (as effective practice).**
  *   **Context:** It is settled that "Substituted Judgment" is the dominant standard for surrogates. It is widely acknowledged in the literature that surrogates fail at this frequently (empirical settledness).
  *   **Advice:** This is where your "non-vacuous" risk is highest. Since Substituted Judgment *already* allows for discretion, you must argue that your "rebuttable default" imposes a *stricter burden of proof* for deviation than current "Best Interests" escape hatches allow.

  **5. The "Indexical Slide" (Your Terminology)**
  *   **Status:** **Novel Claim.**
  *   **Context:** While the distinction between value statements and predictions exists in the literature, framing it as an "indexical slide" that explains the stalemate is your contribution.
  *   **Advice:** Treat this as your theoretical innovation. Do not frame it as "everyone missed this." Frame it as "this distinction clarifies why the existing positions talk past each other."

  ### Summary of Action Items
  1.  **Reframe the Dworkin/Critic section:** They aren't confused about (a) vs (b); they disagree on the *authority* of (a). Your model allows (a) to have *procedural* authority without *outcome* authority.
  2.  **Sharpen the "Non-Vacuous" claim:** Contrast "Process Specificity" (your view) with "Outcome Specificity" (current practice). Explicitly state that current surrogacy guidelines are too binary (follow/don't follow).
  3.  **Fix the Objection:** Distinguish *epistemic thresholds* (procedural) from *clinical conditions* (substantive). This saves the view from self-defeat.
  4.  **Qualify the Background:** Acknowledge that Dworkin's "critical interests" is a contested theory, not a neutral starting point.
