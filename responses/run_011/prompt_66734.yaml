      *(Refining the "Strongest Objection")*: The compatibilist argument about "Reasons-Responsiveness" is the key. Dennett specifically argues that we are *evitable* in a way wasps aren't, not because we are magic, but because our control loops have more layers. The author's Grade 4 is basically Dennett's "higher-order reflection." The author claims this changes the thesis; the compatibilist says it *is* the thesis. I need to make sure this distinction is sharp.

      *(Refining the "Wasp Accuracy")*: The specific claim about the antennae is from Fabre. The claim about the loop is from Fabre. The claim that it's "weaker than assumed" is supported by later ethologists (e.g., Jane Brockmann). I need to be careful not to assert Brockmann as fact, but tell the user to look for her work.

