answer: |-
  Welcome, everyone. To our colleagues who have mapped the contours of this problem for decades, and to the graduate students encountering it for the first time: thank you for being here. We are gathered to discuss a disturbance in the timeline of perception. You know the phenomenon I mean. An observer watches a stationary object. A change occurs in the surround. Yet the observer reports having seen the object move and change colour *before* the physical trigger for that change ever took place. The instant appears malleable. The past seems writable.

  For three days, we will argue over how this is possible. But we must be precise about what is actually in dispute. It is not the data. We agree on what the subjects say. The disagreement concerns the architecture of the mind that produces those reports.

  To make this vivid, I propose we use a newsroom metaphor. On one side, we have the mind as an archive managed by a censor. In this view, the event happens, it is experienced in its raw form, and it enters the record. Then, retrospectively, the censor alters the back issues. The experience was lived one way, but the memory is edited to reflect another. There was a original draft, and it was overwritten.

  On the other side, we have the mind as a copy desk. Here, the paper is only ever written once, in final form, before it is ever published to consciousness. There is no raw feed. There is no live broadcast. The editing happens off-line, in the dark processing stages, and what surfaces as experience is already typeset.

  I want us to press this second image hard, specifically regarding the morgue. In a newsroom, the morgue is the library of past editions. But a mind of the copy-desk kind has no morgue. It keeps no file of what experience was before it was published. 

  This is not just a picturesque way to describe latency; it is an epistemological wall. If introspection can only ever consult the published record, what could possibly count as evidence that a revision ever took place? If there is no accessible prior draft, how do we distinguish a clever composition from a genuine alteration? We are asking you to find evidence of a crime scene where the body has been removed before the police arrived.

  So, let us be clear about our starting positions. 

  What we ought to treat as settled is the robustness of the subjective report. The observers are not lying, and the effect is reproducible. The timeline of the physical stimulus and the timeline of the report do not match. That is our bedrock.

  What we must treat as genuinely open is the ontological status of the mismatch. Does consciousness lag behind reality and then catch up by rewriting history? Or does consciousness wait until the story is coherent before it turns on the light? 

  If we leave here having only sharpened the question of the morgue—whether there is anything there to find—we will have succeeded. The floor is open.
