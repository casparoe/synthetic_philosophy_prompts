answer: |-
  You have stumbled onto the central tension in the philosophy of sport: the conflict between **aesthetic realism** (there is a fact of the matter about how good that dive was) and **procedural legitimacy** (the score is valid because we followed the rules to generate it).

  The scoring systems in diving, gymnastics, and skating are not designed to find the Truth. They are designed to produce a number that is *defensible* against accusations of corruption, bias, or incompetence.

  Here is the reconstruction of the theory of value implicit in the machinery you described, followed by the breakdown of its contradictions and the alternative you requested.

  ### 1. The Implicit Theory of Value: Procedural Objectivity

  The scoring apparatus is committed to a view I will call **Procedural Objectivity**.

  It does not assume that "beauty" or "skill" exists as a Platonic form waiting to be discovered (strong Realism). Nor does it assume that value is purely in the eye of the beholder (strong Subjectivism). Instead, it assumes that value is **generated by the correct application of a protocol.**

  *   **On Difficulty:** The system treats difficulty as **Conventional Realism**. The physical risk and biomechanical complexity are real (gravity doesn't care about the committee), but the *valuation* is a social contract. It is like currency. A $20 bill is paper; its value is arbitrary. But once the central bank says it is $20, it buys $20 worth of goods. The committee sets the exchange rate between "physical risk" and "points." The incoherence you sense is resolved by understanding that the points measure *cost*, not *quality*. They are tracking the "labor" required, not the "art" produced.
  *   **On Execution:** The system treats execution as **Consensual Verification**. It assumes there is a "correct" way to perform the dive (straight legs, tight toes), but human perception of that correctness is noisy. Therefore, the "truth" is defined as the statistical center of the panel.

  **The Theory of Value:** A performance's value is the sum of its pre-agreed labor cost (Difficulty) plus its fidelity to the technical ideal (Execution), where fidelity is determined by the consensus of disinterested observers.

  ### 2. The Dropping (Trimming): Error Theory vs. Insight Theory

  You asked what view of aesthetic value the trimmed mean requires. It requires **Error Theory**.

  *   **The Assumption:** The trimmed mean assumes that variance between judges is primarily *noise* (distraction, momentary lapse, bias) rather than *signal* (unique insight). It assumes the distribution of scores follows a bell curve where the "truth" is the mean, and the tails are defects.
  *   **What it Rules Out:** It explicitly rules out the **Visionary Critic** model. In art criticism, if Roger Ebert gave a movie 4 stars and everyone else gave it 2, we might value Ebert's opinion *more* because of his track record. In diving, if one judge gives a 9.5 and six give 8.5, the system assumes the 9.5 is the error (likely national bias) and deletes it.
  *   **The Philosophical Commitment:** This commits the sport to the idea that **no single judge possesses superior epistemic access to the truth.** It is a radical egalitarianism of the panel. It says, "Seven mediocre eyes are better than one sharp eye," because the sharp eye cannot be distinguished from the biased eye in real-time.

  ### 3. The Anonymity Paradox: Disinterest vs. Tradition

  You noted the tension between the "disinterested judge" and the "steeped expert." This is the **Kant vs. Bourdieu** conflict.

  *   **The System's View (Kantian):** To judge fairly, you must be free from interest. Anonymity (J1, J2, J3) and dropping national scores are meant to create a "view from nowhere." The ideal judge is a camera with a rulebook.
  *   **The Reality (Bourdieusian):** Pierre Bourdieu argued that "taste" is cultivated through immersion in a specific field (habitus). To know what a "good" line is in figure skating, you must be steeped in the tradition of figure skating. You must have loyalties to the style.
  *   **The Incoherence:** The system demands judges be experts (steeped in tradition) but behave like strangers (disinterested). It wants the *authority* of the insider with the *neutrality* of the outsider. Anonymity attempts to solve this by stripping the judge of social accountability, but it also strips them of the ability to stand by their expertise. If a judge sees a flaw no one else sees, anonymity allows them to score it, but the trimming rule will likely delete their score anyway.

  ### 4. Philosophical Underdetermination

  This is the most critical part of your query. Where does the rulebook stay the same while the philosophy changes?

  **A. The Difficulty Table**
  *   *Interpretation 1 (Realist):* The committee measures physical reality (angular velocity, height). The points track biomechanics.
  *   *Interpretation 2 (Ludic/Balancer):* The committee is a game designer. They adjust points to ensure no single strategy dominates. If everyone is doing the 3.5 flip, they might lower its value to encourage variety.
  *   *Underdetermination:* The rulebook looks the same. Athletes train the same. But under Interpretation 2, the points are not "truth," they are "incentives." The system works either way, but the *meaning* of the score changes entirely.

  **B. The Trimmed Mean**
  *   *Interpretation 1 (Statistical):* We are reducing standard deviation to find the true score.
  *   *Interpretation 2 (Political):* We are preventing corruption. If a judge is bribed to score a 10, the trim neutralizes the bribe.
  *   *Underdetermination:* The rule is identical. But if the goal is Political, you don't need seven judges; you need three trustworthy ones. If the goal is Statistical, you need many judges regardless of trust. The current system hedges both, but doesn't commit to either.

  ### 5. The Alternative: An "Elitist/Expert" Scoring System

  You asked what would have to change in the *scoring itself* if we swapped the philosophy. If we adopt the view that **the joint verdict of the few genuinely qualified judges *is* the standard**, and that expertise trumps consensus, the machinery must change fundamentally.

  Here is the blueprint for an **Expert-Weighted System**:

  **1. Abolish the Trim, Institute "Deviation Logs"**
  *   **Change:** Keep all seven scores. Do not throw any out.
  *   **Mechanism:** If a judge's score deviates from the panel average by more than a set threshold (e.g., 0.5 points), that judge must file a public "Deviation Log" within 60 seconds explaining the technical fault they saw that others missed.
  *   **Philosophy:** This treats outliers as *data*, not *noise*. It forces the expert to put their reputation behind their insight.

  **2. Weighted Voting Based on Certification Tiers**
  *   **Change:** Not all judges count equally.
  *   **Mechanism:** Judges are tiered (Tier 1, 2, 3) based on past accuracy (measured against a "Master Panel" of legends). A Tier 1 judge's score counts for 1.5x; a Tier 3 judge counts for 0.8x.
  *   **Philosophy:** This admits that some thermometers are better than others. It institutionalizes the "Visionary Critic."

  **3. End Anonymity for Senior Judges**
  *   **Change:** The top-tier judges are identified by name on the broadcast.
  *   **Mechanism:** Their scores are attached to their identity. Over a season, their "accuracy rating" is published.
  *   **Philosophy:** Accountability creates integrity. If you claim superior taste, you must own it. This aligns with the idea that taste comes from tradition and reputation, not disinterest.

  **4. Dynamic Difficulty (The "Artistic Adjustment")**
  *   **Change:** Allow the panel to adjust the Degree of Difficulty (DD) by ±0.1 based on *quality of entry*.
  *   **Mechanism:** A 3.5 flip is theoretically 3.8 DD. But if the approach was shaky, the panel can vote to downgrade the *effective* DD to 3.7 before execution scoring begins.
  *   **Philosophy:** This admits that difficulty is not just a checklist; it is contextual. A risky move performed clumsily is not "difficult" in the same way as one performed smoothly. It merges the "labor" and "art" scores.

  **5. The "Master Vote" Tiebreaker**
  *   **Change:** In the event of a medal-deciding tie, the score of the Chief Judge (the highest-tier expert) breaks the tie, not the sum of the panel.
  *   **Philosophy:** This explicitly states that in the highest stakes, we trust the *best eye*, not the *average eye*.

  ### Summary of the Shift

  The current system is built on **Distrust**. It distrusts the individual judge (hence anonymity), distrusts the extreme scores (hence trimming), and distrusts the fluidity of art (hence fixed difficulty tables). It is a system designed to survive a lawsuit.

  The system you are intuiting is built on **Authority**. It trusts that expertise exists, that it can be identified, and that it should carry more weight than consensus. It requires a culture where judges are public intellectuals of the sport, not anonymous functionaries.

  The reason we don't use the Expert System is not philosophical; it is political. Federations fear that weighting judges or publishing names will lead to accusations of national bias that are harder to disprove than a statistical average. They have chosen **legitimacy over truth**. They would rather produce a score that no one can complain about than a score that is actually right.
