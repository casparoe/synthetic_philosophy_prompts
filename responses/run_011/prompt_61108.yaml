answer: |-
  Here is the specification for an adequate theory of Threshold Deontology, tailored to your institutional wrinkle. I have vetted your half-list: most of it is solid, but I've tightened the definitions to ensure they bite hard enough to generate a paper.

  ### The Spec: Requirements for Adequate Threshold Deontology

  **1. The Metric Specification**
  *   **Requirement:** The theory must define the *currency* of the threshold. Is it raw lives, quality-adjusted life years, rights-violations averted, or expected utility? It must also specify the function: is it a sharp cliff (1,000 lives = forbidden, 1,001 = permitted) or a sliding scale?
  *   **Case/Consideration:** The "Ticking Bomb" vs. "Slow Disaster." If the threshold is *lives saved*, does a slow-acting poison killing 5,000 over a month count the same as a bomb killing 5,000 instantly? If the theory cannot distinguish urgency or certainty, it fails to track moral intuition.
  *   **Status:** [Universal] (No theory can function without defining its units).

  **2. The Epistemic Access Constraint**
  *   **Requirement:** The agent (or institution) must be able to know, *at the time of action*, whether the threshold has been crossed.
  *   **Case/Consideration:** The "Fog of War." If the threshold is objective (e.g., "10,000 lives *actually* at risk"), but the agent can only estimate, the rule cannot guide action. If the rule is subjective ("10,000 lives *believed* to be at risk"), it invites negligence or fabrication.
  *   **Status:** [Universal] (Ought implies can; a rule that cannot be applied is not a rule).

  **3. The Non-Arbitrariness Constraint**
  *   **Requirement:** The theory must explain *why* the threshold sits where it does, and why it is not merely disguised consequentialism.
  *   **Case/Consideration:** The "Cliff Edge" Objection. If torturing one person is wrong to save 999, but permissible to save 1,000, what is the moral significance of the 1,000th life? If the answer is "consequences outweigh rights," the deontological constraint has vanished.
  *   **Status:** [Universal] (Without this, the theory collapses into consequentialism or intuitionism).

  **4. The Justification/Excuse Distinction**
  *   **Requirement:** The theory must declare whether crossing the threshold makes the act *right* (justification) or merely *unpunishable* (excuse).
  *   **Case/Consideration:** Third-Party Intervention. If a bystander stops the interrogator, are they hindering a justified act (wrongful interference) or preventing a wrong (heroic)? If it's an excuse, the state cannot *authorize* the act in advance, only pardon it after.
  *   **Status:** [Contested] (Absolutists insist it's always an excuse/if anything; Consequentialists insist it's a justification).

  **5. The Manipulation Constraint (The "Clean Hands" Clause)**
  *   **Requirement:** The theory must forbid agents from creating or exacerbating the emergency to trigger the threshold.
  *   **Case/Consideration:** The "Self-Fulfilling Prophecy." An intelligence agency allows a plot to mature to the "threshold level" to gain legal permission for harsh interrogation that they wanted anyway.
  *   **Status:** [Universal] (Causal responsibility undermines moral permission).

  **6. The Publicity/Security Paradox**
  *   **Requirement:** The rule must be public enough to guide agents and maintain rule-of-law norms, but obscure enough to prevent adversaries from gaming the limit.
  *   **Case/Consideration:** The "Calibrated Threat." If the state publishes "We torture if >1,000 lives at stake," adversaries can threaten 999 lives with immunity. If the state keeps it secret, agents lack guidance and the rule violates democratic transparency.
  *   **Status:** [Contested] (Liberal legalists insist on Publicity; Security hawks insist on Opacity; this is your institutional wrinkle).

  **7. The Normative Corrosion Constraint**
  *   **Requirement:** The theory must account for the long-term institutional effect of codifying the exception.
  *   **Case/Consideration:** The "Slippery Slope" (empirical, not logical). Does publishing a threshold normalize the prohibited act, lowering the threshold over time (e.g., from 1,000 lives to 100, to 1 "VIP")?
  *   **Status:** [Contested] (Institutionalists insist on this; Act-Theorists often ignore it).

  ***

  ### The Damage Report

  **The Single Most Damaging Requirement:**
  **The Non-Arbitrariness Constraint.**
  This is the philosophical killer. Almost every candidate theory fails here. If the threshold is based on consequences, it admits it is consequentialism. If it is based on intuition ("1,000 just *feels* different"), it lacks normative force. Defending a specific number without sliding into consequentialism is the genre's unsolved problem.

  **The Jointly Unsatisfiable Pair:**
  Your guess (Action-Guidance vs. No-Free-Rides) is strong, but given your institutional wrinkle, the fatal tension is between **The Publicity Constraint** and **The Manipulation Constraint (specifically the Strategic Immunity variant).**

  *   **Why:** To satisfy **Publicity**, the rule must be specific and known (e.g., "Imminent threat to >1,000 lives"). To satisfy **Security/Non-Manipulation**, the rule must be unpredictable to adversaries. If you publish the specific threshold, you hand adversaries the blueprint to stay just beneath it. If you obscure the threshold to prevent gaming, you fail the Publicity requirement (agents don't know the rule, citizens can't hold the state accountable).
  *   **The Paper:** An institutional threshold deontology cannot be both *law* (public, clear) and *effective security policy* (unpredictable, hard to game). You can have a private directive (effectiveness) or a public statute (legitimacy), but not both. This tension is where the theory breaks down in practice.

  ***

  ### Theoretical Scorecard

  | Theory Family | Non-Arbitrariness | Epistemic Access | Publicity/Security | Justification/Excuse | Corrosion |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Absolutism** | **Pass** (Wall is clear) | **Pass** (Never cross) | **Pass** (Rule is simple) | **Pass** (Always Wrong) | **Pass** (Norm holds) |
  | **Straight Consequentialism** | **Fail** (No threshold exists) | **Fail** (Calculation impossible) | **Fail** (Invites gaming) | **Pass** (Justified) | **Fail** (Instrumentalizes norms) |
  | **Objective-Trigger Threshold** | **Fail** (Why *this* number?) | **Fail** (Agent can't know truth) | **Fail** (If public, gameable) | **Pass** (Justified) | **Fail** (High error rate) |
  | **Epistemic-Trigger Threshold** | **Fail** (Why *this* belief?) | **Pass** (Agent knows belief) | **Fail** (Invites fabrication) | **Mixed** (Often Excuse) | **Fail** (Lowers bar over time) |
  | **Excuse Theory (Pardon Model)** | **Pass** (No rule to arbitrate) | **Pass** (Ex post assessment) | **Pass** (No advance rule) | **Fail** (No Justification) | **Pass** (Norm remains) |

  **Scoring Note:** Absolutism and Excuse Theory score highest on coherence because they refuse to play the threshold game. Absolutism blocks the act; Excuse Theory blocks the *rule*. Any theory attempting to *authorize* the act in advance (Objective/Epistemic Threshold) collapses under the weight of the Publicity/Security paradox.
