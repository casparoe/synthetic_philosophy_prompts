prompt: |-
  I'm working through Jeffrey conditionalization as a method for updating on evidence I am not certain of, and I would like help applying it to a concrete case. Suppose I read a home pregnancy test in poor light and, afterwards, my credences over what it displayed are: two lines, 0.6; one line, 0.3; illegible, 0.1. My first question is which rule I should use to derive that 0.6/0.3/0.1 assignment from my prior credence function together with the facts about the lighting conditions — because without such a rule, the procedure seems to presuppose precisely the thing it is meant to explain. Second, once the update is complete, how can I confirm that the rigidity condition genuinely held for my partition rather than merely assuming it did? And third, if I subsequently take a second dimly-read test, may I assume that performing the two probability-kinematics updates in either order will leave me with the same posterior?
