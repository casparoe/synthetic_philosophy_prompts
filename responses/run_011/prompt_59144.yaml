              *   If conditionally independent: $P(H | E_1, E_2) \propto P(E_1|H)P(E_2|H)P(H)$.
              *   JC approximates this but is sensitive to order because the "likelihood ratios" implicit in the probability shifts are not explicitly separated from the priors in the JC formula.
      *   *Drafting the answer:* No, generally JC is not commutative. Explain why (the rigidity condition for the second step applies to a different probability function depending on the order). Mention that this is a known limitation (the "order problem").

