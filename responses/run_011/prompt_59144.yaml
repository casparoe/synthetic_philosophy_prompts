          *   If the poor light made me think the test is unreliable, Rigidity might fail. (e.g., If I see 2 lines, usually $P(Pregnant)$ is high. But if the light is so bad I think the test is compromised, maybe the link is broken).
          *   However, usually, Rigidity fails if the evidence $E$ is not the *only* thing learned. If I learn "The test says 2 lines" AND "The light is bad," and "The light is bad" affects $P(Pregnant)$ independently or changes the reliability, Rigidity fails.
      *   *Verification:* You can't strictly "confirm" it post-hoc without a model of the learning process. You have to argue based on the causal structure.
          *   *Check:* Does the lighting condition affect the hypothesis (Pregnancy) *except* through the reading of the test? No.
