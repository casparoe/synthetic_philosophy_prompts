  # expressivism/core **Issue #404: BUG: unasserted occurrences of moral vocabulary throw a semantic exception**

  **Status:** Open  
  **Labels:** `bug`, `high-priority`, `semantic-core`  
  **Opened:** 3 weeks ago by `@user_anti_realist`

  ---

  **@user_anti_realist** commented 3 weeks ago

  We have a critical failure in the compositionality module. When moral vocabulary occurs in unasserted contexts, the parser throws a `SemanticTypeException`. The system treats moral sentences as attitude-expressions, but fails when they are not actually expressing an attitude.

  **Minimal Reproduction:**
  ```javascript
  // Case 1: Embedded Conditional
  if (isWrong(stealing)) { 
    blame(agent); 
  }
  // Throws: AttitudeNotFoundException. 
  // 'isWrong' expects immediate execution, not logical embedding.

  // Case 2: Negation Ambiguity
  not(boo(lying)); 
  // System cannot distinguish between "I forbid forbidding lying" 
  // and "I do not forbid lying".
  ```

  **Expected Behavior:**
  Modus Ponens should resolve without type errors.
  ```text
  Stack Trace:
  1. If stealing is wrong, then getting your little brother to steal is wrong.
  2. Stealing is wrong.
  3. Therefore, getting your little brother to steal is wrong.
  ```

  **Actual Behavior:**
  ```text
  Stack Trace:
  1. [ERROR] Premise 1 is not truth-apt. Cannot validate inference.
  2. Premise 2 expresses Boo-attitude.
  3. Conclusion fails to inherit validity. Logic pipeline broken.
  ```

  ---

  **@core_maintainer** commented 3 weeks ago

  This is working as intended. You are attempting to run moral predicates outside the assertion context. We recommend the `HigherOrderAttitude` patch. Instead of asserting the conditional, you express a higher-order attitude of disapproval toward combining the belief in stealing with the lack of blame. See docs/quickstart.md.

  **@logic_linter** commented 3 weeks ago

  @core_maintainer The HigherOrderAttitude patch only passes tests on the examples in the docs. As soon as you nest deeper than two levels (e.g., "If if stealing is wrong..."), the attitude hierarchy infinite loops. You are overfitting the semantics to the test suite.

  **@dev_for_being** commented 2 weeks ago

  I've submitted PR #412. I introduced a new primitive state type called `BeingFor`. It restores full compositionality.
  ```javascript
  class BeingFor<T> {
    constructor(relations, contents) { ... }
  }
  ```
  This closes the long-standing `wishful-thinking` ticket. The logic now holds regardless of embedding depth.

  **@meta_critic** commented 2 weeks ago

  @dev_for_being I reviewed PR #412. You've restored compositionality, but you've renamed `Belief` to `BeingFor` and shipped it under a different name. The backend state is now indistinguishable from cognitivism. You solved the bug by deleting the expressivist architecture.

  **@norm_fork_user** commented 2 weeks ago

  Have you tried the `norm-expressivist` fork? We treat every judgment as a `Plan` object. It handles conditionals fine, but we have a massive memory leak. Plans never get garbage collected because no fact triggers their disposal. RAM usage spikes during complex deliberation.

  **@hybrid_architect** commented 1 week ago

  Proposal: Hybrid Build. Bolt a small truth-conditional module onto the backend just for the boring descriptive part. Keep the expressivist frontend for action-guidance.

  **@unity_tester** commented 1 week ago

  @hybrid_architect If you do that, nobody can explain why the two modules never disagree. If the truth-conditional module says "X is wrong" is true, and the expressivist module says "Boo X", why do they always sync? It looks like dual-processing with no handshake protocol.

  **@docs_contributor** commented 5 days ago

  Submitted PR #450. Renamed all instances of `true` to `true-for-our-purposes` in the documentation. This closes 40 issues at once by deflating the expectation of robust truth-aptness.

  **@realist_migrant** commented 2 days ago

  Why are we maintaining this repo? Just migrate to `cognitivism/v2`. It doesn't have these embedding issues.

  **@core_maintainer** commented 1 day ago

  @realist_migrant You can't close the issue by deleting the product. The requirement is non-cognitivist compatibility.

  **@triage_bot** commented 1 day ago

  Added labels: `wontfix`, `needs-more-desire`, `stale`. Closing due to inactivity on the `negation` branch.

  ---

  **@core_maintainer** commented 1 hour ago

  Locking thread. We need to triage these proposed fixes based on our core constraints. Below is the current assessment of compatibility.

  | Proposed Fix | (a) Preserves Modus Ponens | (b) Avoids Smuggling Truth-Aptness | Justification |
  | :--- | :---: | :---: | :--- |
  | **Higher-Order Attitudes** | 6/10 | 8/10 | Validates simple inference, but complexity scales poorly. Maintains expressivist core but struggles with deep nesting. |
  | **BeingFor Primitive** | 10/10 | 3/10 | Solves compositionality completely, but the primitive state is functionally identical to belief. High risk of stealth cognitivism. |
  | **Norm-Expressivist Fork** | 9/10 | 7/10 | Handles logic via plan-consistency, but memory leaks suggest ontological bloat. Plans act too much like facts. |
  | **Hybrid Build** | 10/10 | 5/10 | Logic holds, but coherence problem remains unexplained. Two modules imply distinct states that never diverge. |
  | **Quasi-Realist Docs** | 5/10 | 9/10 | Linguistic fix only. Does not solve underlying semantic exception, merely renames the error code. |
  | **Migrate to Cognitivism** | 10/10 | 0/10 | Fully functional, but violates repo license. Not an expressivist solution. |

  We will prioritize the Higher-Order patch for the next sprint, despite the scaling issues. We cannot accept PR #412 until the `BeingFor` type is demonstrably distinct from `Belief`.

  **Lock conversation**
