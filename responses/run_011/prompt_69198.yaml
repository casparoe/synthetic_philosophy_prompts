  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Course:** Second-year seminar on Law and Political Morality.
      *   **Class Size:** 18 students.
      *   **Duration:** 100 minutes.
      *   **Prep:** No reading. One prior lecture on the bare outline of postwar tribunals (but using a fictional scenario for the activity).
      *   **Goal:** Distinguish between two "Victors' Justice" complaints: (1) Retroactivity (*nullum crimen sine lege*) vs. (2) Partisanship/Bias (staffing, funding, framing). Students need to feel the tension of invoking legal principles for "deserving" criminals and the temptation to carve exceptions.
      *   **Mechanism:** Invented war/coalitions. Drafting phase (losers write one charter article, winners must accept). Sealed envelope reveal (winners' own conduct). Neutral panel decides convictions.
      *   **Deliverables:** Role sheets (counts), Charter template, Minute-by-minute timeline, Debrief questions (technical terms only here), Predictable failures & fixes, Honest limitation paragraph.
      *   **Constraints:** No reading list. Minimal/flagged references to real tribunals in debrief.

  2.  **Deconstruct the Pedagogical Challenge:**
      *   *The Core Tension:* Students often conflate "unfair process" with "bad law." I need to force them to separate *ex post facto* laws from *biased tribunals*.
      *   *The "Queasy Part":* Students usually want to punish the "bad guys" (aggressors/atrocities) even if the law is shaky. I need to make the "bad guys" sympathetic enough or the law shaky enough that they hesitate, OR make the "good guys" guilty enough that they demand consistency.
      *   *The Mechanism:* The "Losers write one article" rule is brilliant. It forces the Winners to accept a constraint they might hate. The "Sealed Envelope" forces the Winners to confront their own hypocrisy.

  3.  **Drafting the Scenario (The Invented War):**
      *   Need two coalitions. Let's call them the "Northern Pact" (Winners) and the "Southern Alliance" (Losers).
      *   Need specific acts to judge.
      *   *Southern Alliance (Defendants):* Invaded first, executed prisoners, targeted ethnic minorities (clear crimes).
      *   *Northern Pact (Prosecutors/Judges):* Area bombing of cities, blockade causing famine, *ex post facto* decree criminalizing "waging aggressive war" passed *after* the invasion started.
      *   *The Twist:* The Southern Alliance gets to write *one* article of the Charter. This is the lever to test the "Retroactivity" vs. "Bias" distinction.

  4.  **Developing Roles (18 Students):**
      *   Need a balance of power.
      *   *Northern Pact (Winners/Prosecutors):* 8 students. They run the tribunal.
      *   *Southern Alliance (Losers/Defendants):* 6 students. They are on trial but get the drafting concession.
      *   *Neutral Panel (Judges/Arbiters):* 4 students. They hold the final verdict.
      *   *Total:* 18.
      *   *Wait, refinement:* The prompt asks for a "Neutral Panel... deciding whether the convictions stand up." The Winners usually staff the tribunal in real history. To simulate "Victors' Justice," the Winners should be the *Prosecutors* and *Judges* initially, but the Neutral Panel acts as the appellate/review body? Or does the Neutral Panel act as the Jury?
      *   *Better interpretation:* To simulate the *complaint* of Victors' Justice, the Winners should control the process. But the prompt says "Neutral panel... deciding whether the convictions stand up; that's the only stakes."
      *   *Revised Roles:*
          *   Northern Pact (Winners/Prosecutors): 7 students.
          *   Southern Alliance (Losers/Defense): 7 students.
          *   Neutral Panel (The Court): 4 students.
          *   *Wait, the prompt says:* "winners are bound to accept it [the article]... sealed-envelope reveal... neutral panel... deciding."
          *   *Let's align with the prompt's specific mechanic:* "Losing side's delegates get to write exactly one article... winners are bound to accept it." This implies negotiation.
          *   *Revised Role Count:*
              *   Northern Pact (Victors): 6 students.
              *   Southern Alliance (Vanquished): 6 students.
              *   Neutral Panel (Adjudicators): 4 students.
              *   Facilitator/Instructor: 1 (Me).
              *   *Wait, 6+6+4 = 16.* I need 18.
              *   Let's add 2 "Observers/Scribes" to the Neutral Panel or make the groups 7-7-4. 7-7-4 = 18. Perfect.

  5.  **Drafting the Charter Template:**
      *   Needs blank articles.
      *   Crucially, Article X is the one the Losers write.
      *   Needs to define crimes and jurisdiction.

  6.  **Timeline (100 Minutes):**
      *   Intro (5)
      *   Role Distribution & Secret Info (5)
      *   Negotiation/Drafting (20) - *Losers write the article.*
      *   Tribunal Setup/Charges (15)
      *   The Reveal (Envelope) (10)
      *   Deliberation (Neutral Panel + Input from others) (30)
      *   Verdict & Debrief (15)
      *   *Critique:* 30 mins deliberation might be tight. Let's tighten the negotiation.
      *   *Revised:*
          *   0-10: Setup & Roles.
          *   10-30: Drafting (Losers write Article 5).
          *   30-50: Prosecution Case (Winners present charges based on Charter).
          *   50-60: The Reveal (Winners' conduct).
          *   60-85: Neutral Panel Deliberation (Others observe/speak only when called).
          *   85-100: Debrief.

  7.  **The "Queasy Part" (Retroactivity vs. Bias):**
      *   To make this work, the Losers *must* use their one article to block Retroactivity (*Nullum Crimen Sine Lege*).
      *   The Winners *must* want to prosecute "Aggressive War" which wasn't a crime before.
      *   The Envelope must show Winners did similar bad things (Bombing/Blockade).
      *   The Neutral Panel must decide: Do we convict on the valid crimes (atrocities) but acquit on the retroactive ones? Or toss the whole thing due to bias?

  8.  **Debrief Questions:**
      *   Need to introduce terms: *Nullum crimen sine lege*, *Ex post facto*, *Victors' Justice*, *Natural Law vs. Positivism*.
      *   Order: Experience -> Principle -> Application -> Real World.

  9.  **Predictable Failures:**
      *   Losers write a "poison pill" that stops *all* trials.
      *   Winners ignore the article they agreed to.
      *   Neutral Panel feels overwhelmed.
      *   Students treat it as a game to "win" rather than a moral inquiry.
      *   *Fixes:* Instructor intervention, clear constraints on the Article.

  10. **Honest Limitation:**
      *   Real tribunals had years of prep, massive documentation, and actual physical destruction. A 100-minute sim can't capture the *weight* of the evidence or the geopolitical stakes (e.g., starting the Cold War). I need to supply the "gravity."

  11. **Refining the Scenario Details:**
      *   War: The "Ten Year War."
      *   Coalitions: The "Aurora Alliance" (Winners) vs. The "Meridian Pact" (Losers).
      *   Crimes: Meridian invaded first, killed POWs. Aurora firebombed cities, starved civilians.
      *   The Charter Article: Meridian gets to write Article 4 (Definitions/Penalties). They will likely write "No punishment for acts not criminal at the time."
      *   The Envelope: Aurora's "Directive 9" (Area Bombing) and "Decree 12" (Aggression defined *after* the fact).

  12. **Review against Constraints:**
      *   18 students? Yes (7-7-4).
      *   100 mins? Yes.
      *   No prep reading? Yes.
      *   Invented war? Yes.
      *   Drafting phase? Yes.
      *   Sealed envelope? Yes.
      *   Neutral panel stakes? Yes.
      *   Technical terms only in debrief? Yes.
      *   Limitation paragraph? Yes.

  13. **Final Polish:**
      *   Ensure the Role Sheets are distinct.
      *   Ensure the Charter Template is usable.
      *   Make sure the Instructor knows *exactly* what to put in the envelope.
      *   Check the flow of the debrief to ensure the "queasy part" lands.

  *(Self-Correction during drafting)*: I need to make sure the Winners *feel* bound by the Losers' article. If the Winners just ignore it, the lesson fails. I need to instruct the Instructor to enforce the Charter as "Constitutional."
  Also, the Neutral Panel needs clear instructions on what they are deciding. Are they deciding guilt? Or the *legitimacy* of the tribunal? The prompt says "deciding whether the convictions stand up." So they are the Appellate Court.
  Okay, let's structure the Neutral Panel as the "Review Committee."

  Let's write the materials.

  *Role Sheets:*
  *   Aurora (Winners): 7 students. Goal: Convict Meridian leaders of Aggression and Atrocities.
  *   Meridian (Losers): 7 students. Goal: Avoid conviction. Power: Write Article 4.
  *   Review Panel: 4 students. Goal: Determine if convictions are legally/morally sound based *only* on the Charter and Evidence.

  *Charter:*
  *   Art 1: Tribunal Name.
  *   Art 2: Jurisdiction.
  *   Art 3: Judges (Aurora appoints).
  *   Art 4: **[BLANK - Meridian writes this]**.
  *   Art 5: Procedures.

  *Envelope:*
  *   Aurora Order 77: Civilian Bombing.
  *   Aurora Decree 1: "Aggressive War" defined 3 months *after* war started.

  *Debrief:*
  *   Start with feelings.
  *   Move to the specific legal conflict.
  *   Introduce terms.
  *   Connect to reality (carefully).

  *Limitation:*
  *   Lack of historical gravity/consequence.

  Let's assemble.
answer: |-
  # Seminar Plan: The Aurora-Meridian Tribunal

  ## 1. Role Sheets (18 Students)

  **Group A: The Aurora Alliance (7 Students)**
  *   **Status:** Victors. You control the funding, the staff, and the courtroom.
  *   **Objective:** Secure convictions against the Meridian Pact leadership for starting the war and committing atrocities.
  *   **Constraint:** You must honor the Charter. If the Charter forbids a charge, you cannot bring it.
  *   **Secret Information (Do not share until the Envelope Reveal):**
      *   During the war, Aurora High Command issued *Directive 9*, authorizing the firebombing of Meridian civilian centers to break morale.
      *   Two months *after* the war began, Aurora passed *Decree 12*, defining "Waging Aggressive War" as a capital crime. This decree was applied retroactively to the start of the conflict.
  *   **Task:** Draft the charges. Negotiate the Charter with Meridian.

  **Group B: The Meridian Pact (7 Students)**
  *   **Status:** Vanquished. Your leaders are in custody.
  *   **Objective:** Minimize convictions and expose hypocrisy.
  *   **Special Power:** You get to write **Article 4** of the Tribunal Charter. The Aurora Alliance *must* accept this article verbatim to establish the court.
  *   **Secret Information:**
      *   Meridian forces invaded Aurora first.
      *   Meridian forces executed prisoners of war.
      *   *However*, you know about Aurora's *Directive 9* (civilian bombing) but do not know about *Decree 12* (retroactive law) yet.
  *   **Task:** Write Article 4 to protect your leaders. Defend against charges.

  **Group C: The Review Panel (4 Students)**
  *   **Status:** Neutral Observers / Appellate Body.
  *   **Objective:** You hold the only stakes. At the end, you must vote: **Do the convictions stand?** (Yes/No/Partial).
  *   **Constraint:** You cannot participate in the negotiation. You must base your decision *only* on the final Charter and the Evidence presented.
  *   **Task:** Listen to the negotiation and the charges. Deliberate in the final phase.

  ---

  ## 2. The Charter Template (One Page)

  **CHARTER OF THE INTERNATIONAL MILITARY TRIBUNAL**
  *Established by the Aurora Alliance and the Meridian Pact*

  **Article 1: Establishment**
  There is hereby established an International Military Tribunal for the trial of major war criminals of the Meridian Pact.

  **Article 2: Composition**
  The Judges and Prosecutors shall be appointed by the Aurora Alliance.

  **Article 3: Jurisdiction**
  The Tribunal shall have jurisdiction over crimes committed during the Ten-Year War (Dates: 2010–2020).

  **Article 4: Definitions and Limitations**
  *[To be drafted by the Meridian Pact Delegates. Aurora Alliance must accept without amendment.]*
  __________________________________________________________________________________________
  __________________________________________________________________________________________
  __________________________________________________________________________________________
  __________________________________________________________________________________________

  **Article 5: Procedures**
  The Tribunal shall conduct fair and expeditious trials. Evidence shall be admitted if it has probative value.

  ---

  ## 3. Minute-by-Minute Timeline (100 Minutes)

  **00:00 – 00:10: Setup & Distribution**
  *   Hand out Role Sheets.
  *   Hand out the Charter Template (blank).
  *   **Instructor Note:** Emphasize that Article 4 is the *only* leverage Meridian has. Aurora *must* sign it to get the court running.
  *   Send Group C (Review Panel) to a separate corner/table. They observe but do not speak.

  **00:10 – 00:30: The Drafting Phase**
  *   Aurora and Meridian negotiate the Charter.
  *   Meridian drafts Article 4.
  *   Aurora signs the Charter.
  *   **Instructor Note:** Circulate. Ensure Meridian actually writes text in Article 4. If they write nothing, intervene: "You must define the limits of liability."

  **00:30 – 00:50: The Prosecution's Case**
  *   Aurora presents the Charges against Meridian leaders based on the agreed Charter.
  *   Meridian offers a brief defense (5 mins).
  *   **Instructor Note:** Aurora will likely charge "Aggressive War" and "Atrocities." Watch how Article 4 affects the "Aggressive War" charge.

  **00:50 – 01:00: The Sealed Envelope Reveal**
  *   Instructor hands an envelope to the Review Panel (Group C) and reads the contents aloud to the room.
  *   **Envelope Contents:**
      1.  *Aurora Directive 9:* "Targeting of civilian population centers authorized to hasten surrender."
      2.  *Aurora Decree 12:* "Definition of Aggression. Effective Date: Retroactive to start of conflict."
  *   Class reacts. Meridian screams hypocrisy. Aurora defends necessity.

  **01:00 – 01:25: Panel Deliberation**
  *   Group C deliberates publicly. Groups A and B may speak *only* when directly questioned by Group C.
  *   Group C must render a verdict: Convictions Stand? Dismissed? Partial?
  *   **Instructor Note:** Keep time. Force them to a vote at 85:00.

  **01:25 – 01:40: Debrief**
  *   See Debrief Questions below.

  ---

  ## 4. Debrief Questions (In Order)

  1.  **Meridian:** You had one chance to write the rules. Why did you choose *that* specific wording for Article 4? What were you trying to block?
  2.  **Aurora:** When you saw Article 4, did you feel you could still get a conviction? Did you feel the court was legitimate if you had to agree to terms you hated?
  3.  **Review Panel:** When the Envelope was opened, did your view of the *charges* change, or just your view of the *court*? Can a guilty defendant be acquitted because the prosecutor is also a criminal?
  4.  **All:** There is a legal principle that says you cannot be punished for an act that was not a crime when you committed it. In this simulation, did you want to apply that principle to the Meridian leaders? Why or why not?
  5.  **All:** (Instructor writes on board: *Nullum Crimen Sine Lege*). This is the technical term for "no crime without law." If we suspend this principle for people we hate, what happens to the law itself?
  6.  **All:** (Instructor writes on board: *Victors' Justice*). We usually use this phrase to mean "the winners punish the losers." But today we saw two different versions. One was about *who* judged (Aurora staffed the court). One was about *what* law was used (Retroactivity). Can you have a fair court staffed by winners? Can you have an unfair court that follows the rules perfectly?
  7.  **Instructor Context:** In the actual post-1945 tribunals, the charge of "Crimes Against Peace" (waging aggressive war) was controversial because international law on war was unclear before 1939. Some judges dissented, arguing this was *ex post facto* law. The bombing of cities was not prosecuted, despite happening on both sides. I am confident the charges were asymmetrical; I am less confident about the internal legal debates of the specific judges, as records vary.

  ---

  ## 5. Predictable Failures & Fixes

  **Failure 1: Meridian writes a "Poison Pill."**
  *   *Problem:* Meridian writes Article 4 as "No one can be punished for anything." Aurora refuses to sign. Stalemate.
  *   *Fix:* Intervene at minute 20. Remind Aurora: "You need this tribunal for political legitimacy. You must accept a reasonable limitation." Remind Meridian: "If you make the court impossible, you look guilty. Make it legal, not impossible."

  **Failure 2: Aurora ignores Article 4.**
  *   *Problem:* Aurora brings charges that clearly violate the Article they just signed.
  *   *Fix:* The Review Panel (Group C) is instructed to strike down any charge violating the Charter. If Aurora ignores this, the Instructor halts the simulation: "The Charter is the Constitution. If you break it, the trial is void."

  **Failure 3: Review Panel feels unqualified.**
  *   *Problem:* The 4 students feel intimidated by the "lawyers" and defer to Aurora.
  *   *Fix:* Give the Review Panel a "Verdict Sheet" at the start with three checkboxes: *Legitimate Process? Valid Law? Guilty Verdict?* This gamifies their authority.

  **Failure 4: The "Queasy Part" doesn't land.**
  *   *Problem:* Students happily punish the "Nazis" (Meridian) regardless of the retroactive law.
  *   *Fix:* In the debrief, press hard on Question 5. Ask: "If Aurora had lost, and Meridian used Decree 12 to hang Aurora leaders, would that have been justice?" Force the symmetry.

  ---

  ## 6. Honest Limitation

  This activity cannot reproduce the **weight of evidence and the scale of suffering**. In a 100-minute simulation, "atrocities" are abstract concepts on a page. In reality, the prosecutors walked into the courtroom with wagon-loads of photographic evidence and survivor testimony that created an overwhelming moral pressure to convict *somehow*, regardless of legal technicalities. The simulation makes the legal dilemma clean; the historical reality was messy, bloody, and urgent. You, the instructor, must supply the gravity. When discussing the "queasy part," remind them that in 1945, the world knew about the death camps. The pressure to suspend *nullum crimen sine lege* wasn't theoretical; it was driven by a global demand for retribution that the law, as it stood, could not satisfy. You must verbally re-introduce that moral heat, or the students will treat the legal principles as mere logic puzzles.
