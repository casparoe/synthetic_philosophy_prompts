prompt: |-
  For three years two of my senior analysts have argued about whether historical analogies can carry evidential weight, and the argument has not moved even though they agree on essentially all the underlying facts about the episodes in question. Their positions, as I understand them:

  Analyst A holds that an analogy is admissible when the structural features that plausibly drove the outcome in the earlier case are matched in the present one — number of parties, what each side knows of the others' resolve, whether commitments are observable, whether exit remains available — so that a bad analogy is simply one that fails the match on a feature known to matter. Analyst B replies that this is rigor in appearance only: for any proposed analogy one can always produce a structural difference that defeats it and a structural similarity that supports it, so the selection of relevant features is really done by the conclusion the analyst already wants. On B's account analogies generate hypotheses but never support them, and only base rates and mechanism claims have evidential force. Each has now written on Munich in 1938, on the 2003 Iraq decision, and on the Soviet intervention in Afghanistan; in every case A pronounces the analogy usable with adjustments, and B pronounces it unusable in principle, and neither memo seems to me to answer the other.

  My working hypothesis is that they are addressing different questions — one about the calibration of an inference, one about the discovery of hypotheses — under a single word, and that the deadlock is a category artifact rather than a real dispute. Diagnose it. Is the disagreement substantive, verbal, or a conflict over what counts as evidence? Is there a hidden empirical question underneath, for instance whether analogy-led analysts actually forecast better, and given how few great-power crises there are and how little they repeat, could such a question in principle be settled? Then tell me what would count as progress for my unit: a distinction, a scoring protocol, or the concession that the question is ill-posed and the real issue is institutional — who may invoke which analogy, and bearing what burden of proof. I want reasons, not a tour of the literature.
reasoning: |-
  Here's a thinking process that leads to the suggested diagnosis and recommendation:

  1.  **Deconstruct the Prompt:**

      *   **The Conflict:** Two senior analysts (A and B) have argued for three years about whether historical analogies carry *evidential weight*.
      *   **Agreement:** They agree on the underlying facts of the historical episodes (Munich 1938, Iraq 2003, Soviet Afghanistan).
      *   **Analyst A's Position:** Analogies are admissible if *structural features* match (parties, knowledge, resolve, commitments, exit options). Bad analogies fail on matching features known to matter. (Analogy = Evidence/Inference).
      *   **Analyst B's Position:** Structural matching is subjective. One can always find similarities or differences to fit a desired conclusion. Analogies generate *hypotheses* only. Only base rates and mechanism claims have evidential force. (Analogy = Heuristic/Discovery).
      *   **The User's Hypothesis:** They are addressing different questions (calibration vs. discovery) under one word ("evidence"). The deadlock is a category artifact.
      *   **The Task:**
          1.  Diagnose the disagreement (Substantive, Verbal, or Conflict over Evidence?).
          2.  Address the hidden empirical question (Do analogy-led analysts forecast better? Can this be settled given data scarcity?).
          3.  Define "Progress" for the unit (Distinction, Scoring Protocol, or Institutional/Procedural concession?).
          4.  **Constraint:** Want reasons, not a tour of the literature.

  2.  **Analyze the Disagreement (Diagnosis):**

      *   *Is it Verbal?* Partly. They use "evidential weight" differently. A sees structural isomorphism as evidence. B sees it as storytelling until validated by mechanism/base rate.
      *   *Is it Substantive?* Yes, underneath. It's about epistemology. A believes in *case-based reasoning* (phronesis/practical wisdom). B believes in *variable-based reasoning* (positivist/social science).
      *   *Is it about Evidence?* Yes. A treats the *pattern* as evidence. B treats the *causal mechanism* verified by the pattern as evidence, but distrusts the pattern itself due to selection bias.
      *   *User's Hypothesis Check:* The user suggests "calibration vs. discovery." This is close but slightly off. It's more "Inference vs. Generation." B admits analogies generate hypotheses. A thinks they *test* them (or at least support them).
      *   *Core Tension:* The Problem of Induction + The Problem of Selection Bias. B is essentially arguing that without a pre-specified coding scheme (which A claims to have via "structural features"), analogy is post-hoc rationalization. A argues that expert judgment on structural features *is* the coding scheme.

  3.  **Analyze the Empirical Question (Forecasting Performance):**

      *   *Question:* Do analogy-led analysts forecast better?
      *   *Constraint:* Few great-power crises, low N, non-repeatability.
      *   *Verdict:* This cannot be settled empirically in a frequentist sense. There aren't enough data points (N is too small) to run a regression on "analogy usage vs. accuracy" for great power crises.
      *   *Nuance:* You *could* track Brier scores on smaller events, but the dispute is about "Munich/Iraq/Afghanistan" type events. For these, the reference class is too thin.
      *   *Implication:* Waiting for empirical settlement is a trap. It validates B's skepticism (we can't prove it works) but frustrates A's practice (we need to decide now).

  4.  **Define Progress (Recommendation):**

      *   *Option 1: Distinction.* Formalize the difference between "Analogical Hypothesis Generation" and "Structural Isomorphism Validation." This validates the user's hypothesis.
      *   *Option 2: Scoring Protocol.* Hard to do for unique events. Might force quantification where it doesn't belong.
      *   *Option 3: Institutional/Procedural.* This seems most robust. If the epistemology can't be resolved and the data doesn't exist, manage the *process* of using analogies.
      *   *Best Path:* A hybrid. Acknowledge the epistemological split (Distinction) but manage it via Process (Institutional).
      *   *Why?* Because A and B are both partially right. A is right that experts *do* think in analogies (cognitive reality). B is right that analogies are easily manipulated (bias risk).
      *   *The "Burden of Proof" angle:* This is the key. If A wants to use an analogy as *evidence*, they must bear the burden of proving the structural match isn't cherry-picked. If B wants to dismiss it, they must show the mechanism doesn't hold.

  5.  **Drafting the Response (Iterative refinement):**

      *   *Diagnosis:* It's not just verbal. It's a clash between *Case-Based Epistemology* (A) and *Variable-Based Epistemology* (B). A thinks context *is* data. B thinks context is noise unless reduced to variables (base rates). It is a conflict over what counts as evidence, rooted in different theories of inference.
      *   *Empirical Question:* It is in principle *unsettled* and likely *unsettlable* for the specific domain (great power crises). The N is too small. Relying on this is a delay tactic.
      *   *Progress:* Don't try to solve the philosophy. Solve the workflow.
          *   Adopt the user's "Discovery vs. Calibration" distinction formally.
          *   Implement a "Red Team" protocol for analogies (force the B perspective onto A's analogies).
          *   Shift the burden of proof. Analogy starts as a hypothesis (B's view). To become evidence (A's view), it must survive a specific stress test (pre-registered structural features).

  6.  **Refining the Argument (Self-Correction during drafting):**

      *   *Critique:* Make sure I don't just say "you're right" to the user. I need to add value.
      *   *Addition:* The user thinks it's a category artifact. I should argue it's deeper—it's a fundamental tension in intelligence analysis (Intuition vs. Method).
      *   *Addition on Empirical:* Mention that "forecasting better" is the wrong metric. The metric should be "reducing surprise" or "identifying blind spots." Analogies are better at finding blind spots (B's concession) than predicting outcomes (A's claim).
      *   *Recommendation:* The "Institutional" route is the winner, but it needs to be specific. Not just "who may invoke," but "how." A "Analogy Disclosure Statement."

  7.  **Final Polish:** Check against constraints. No literature tour. Give reasons. Keep it sharp.

      *   *Structure:*
          1.  Diagnosis (Epistemological, not just verbal).
          2.  Empirical Feasibility (No, N is too small).
          3.  Path to Progress (Procedural/Institutional with a formal distinction).

      *(Self-Correction on Diagnosis)*: Is it verbal? If they defined "evidence" differently, they might agree. But they disagree on whether structural matching *constitutes* evidence. So it's substantive regarding the nature of inference. I will call it a **substantive epistemological conflict masquerading as a methodological dispute.**

      *(Self-Correction on Progress)*: The user offers three options. I should pick one or synthesize. A synthesis is best. A distinction *enforced* by an institutional protocol.

  8.  **Finalizing the Content:**
      *   **Diagnosis:** Substantive conflict over *inductive risk*. A trusts expert judgment on similarity; B trusts aggregation/variables.
      *   **Empirical:** Unsettlable for high-stakes/low-N events.
      *   **Progress:** Institutional protocol. Analogy = Hypothesis (default). Analogy = Evidence (only if structural features are pre-registered/audited).

      *(Wait, one more thought)*: The user asks "Is the disagreement substantive, verbal, or a conflict over what counts as evidence?" I should answer this directly. It is a conflict over what counts as evidence, which *makes* it substantive.

      *(Refining the "Progress" section)*: The user asks for "a distinction, a scoring protocol, or the concession that the question is ill-posed and the real issue is institutional." I should argue for the **Institutional** solution, underpinned by the **Distinction**. Scoring is impossible for low-N.

      *Let's write.*
answer: |-
  ### Diagnosis: Substantive Epistemological Conflict

  Your hypothesis that this is a category artifact (discovery vs. calibration) is partially correct, but it underestimates the depth of the rift. This is not merely a verbal disagreement about the definition of "evidence." It is a **substantive conflict over the management of inductive risk.**

  *   **Analyst A (Case-Based Epistemology):** Believes that causal mechanisms are context-dependent and that "structural features" are the only way to access them. For A, expertise is the ability to discern which features are structurally relevant. To A, rejecting analogy is rejecting the only data available for unique events.
  *   **Analyst B (Variable-Based Epistemology):** Believes that causal mechanisms must be invariant to be reliable. For B, "structural features" selected by an expert are indistinguishable from post-hoc rationalization without a pre-specified coding rule. To B, analogy without base rates is storytelling.

  The disagreement is substantive because it reflects two incompatible theories of how we learn from history. A believes we learn by *pattern recognition* (similarity); B believes we learn by *isolation of variables* (difference). They agree on the facts of Munich or Iraq, but they disagree on whether the *relationship* between those facts and the present constitutes data (A) or noise (B).

  ### The Empirical Question: Unsettlable

  You asked whether the hidden empirical question (do analogy-led analysts forecast better?) can be settled. **No, not for the domain that matters to you.**

  1.  **The N-Problem:** Great-power crises are low-frequency, high-impact events. You do not have a large enough sample size to run a statistical test on the predictive accuracy of "analogy-driven" vs. "mechanism-driven" assessments. Any correlation found would be spurious.
  2.  **The Counterfactual Problem:** You cannot observe the world where Analyst A did *not* use the Munich analogy to see if the forecast would have been worse.
  3.  **The Metric Problem:** "Forecasting better" is the wrong metric for analogies. As Analyst B concedes, analogies generate hypotheses. Their value is often in **preventing surprise** (identifying blind spots) rather than **predicting outcomes** (assigning probabilities). An analyst using a bad analogy might still forecast the right outcome for the wrong reasons, or a good analogy might identify a risk that doesn't materialize (a false positive that was still prudent).

  Attempting to settle this empirically will result in a permanent stalemate because the data required to adjudicate the epistemological claim does not exist and cannot be generated.

  ### Path to Progress: Institutional Protocol

  Do not attempt to resolve the epistemological dispute. You cannot force A to become a positivist or B to become a historian. Instead, treat the disagreement as an **institutional risk management problem.**

  Progress lies in the third option you proposed: **conceding the question is ill-posed and shifting to an institutional protocol regarding burden of proof.** However, this protocol must be underpinned by the **distinction** you identified (Discovery vs. Calibration).

  Here is the specific protocol your unit should adopt:

  **1. Formalize the "Analogy Disclosure Statement"**
  Require that any historical analogy invoked in a finished assessment be tagged with a status:
  *   **Type I (Heuristic):** Used to generate a hypothesis or identify a blind spot. (Analyst B's domain).
  *   **Type II (Evidentiary):** Used to assign probability or weight to a specific outcome. (Analyst A's domain).

  **2. Shift the Burden of Proof**
  *   **Default Status:** All analogies enter as **Type I (Heuristic)**. They are admissible for scoping the problem but carry no independent evidential weight. This satisfies Analyst B's requirement that analogy alone is not proof.
  *   **Escalation to Type II:** To upgrade an analogy to **Evidentiary** status, Analyst A must satisfy a **Pre-Registration Requirement**. They must list the "structural features" they claim are matched *before* arguing the outcome, and these features must be auditable by the team.
      *   *Why this works:* It forces A to operationalize their "structural features" (moving toward B's rigor) without forbidding the practice. It forces B to acknowledge that if the structural match is pre-specified and robust, it *can* carry weight.

  **3. The "Dis-analogy" Red Team**
  When an analogy is used Type II, assign a Red Teamer the specific task of finding the **critical dis-analogy**.
  *   Analyst A argues the match.
  *   The Red Team argues the mismatch.
  *   The final assessment must explicitly state why the match outweighs the mismatch (or vice versa).

  ### Why This Counts as Progress

  This approach bypasses the philosophical deadlock by regulating the *usage* rather than the *validity* of analogy.

  1.  **It validates B's skepticism:** By making Heuristic the default, you acknowledge that analogy is prone to selection bias. It prevents "rigor in appearance" from sneaking in unvetted.
  2.  **It validates A's expertise:** By allowing escalation to Evidentiary status, you acknowledge that expert judgment on structural features has value, provided it is transparent and auditable.
  3.  **It solves the data scarcity:** You are no longer asking "Who is right about history?" You are asking "Has the analyst met the procedural burden to use this history as evidence?"

  **Recommendation:**
  Draft a unit charter that defines Analogy as a **Hypothesis Generator by default** and an **Evidence Multiplier by exception.** Require that any exception be justified by a pre-specified list of structural variables. This turns their three-year argument into a checklist item, allowing you to harvest A's intuition while mitigating B's fear of bias.
