answer: |-
  The crosswalk was wide, the light red, and the stream of locals flowing like water around a stone. Elias stepped off the curb without breaking stride. Mara hesitated, then followed.

  "You treated the red light as a decoration," Mara said, once they reached the median.

  "I treated the local convention as binding," Elias corrected. "The drivers here expect pedestrians to cross on red at this junction. The signal is legal fiction; the practice is the reality. By stopping, you disrupt the anticipatory rhythm of the traffic. You owe it to the collective flow to conform."

  "I owe nothing to a practice I didn't constitute," Mara replied. "I'm here for a week. I'm not a party to the agreement between these drivers and walkers. My duty was merely not to dart out unexpectedly. I waited for a gap. I harmed no one."

  "But you created friction," Elias insisted. "The convention works by assurance. Everyone knows everyone else knows the rule. When you stand still, you signal uncertainty. You break the assurance chain."

  "Does the chain extend to tourists?" Mara asked. "Locals expect us to be confused. If they anticipate my deviation, the assurance function doesn't rely on me. So why am I bound?"

  "Because you are acting inside the scheme," Elias said. "Presence generates obligation. Otherwise, you're free-riding on their coordination while exempting yourself."

  They reached the bus stop. A crowd waited, not in a line, but in two loose clusters. People nodded; shoulders shifted. Mara stood rigidly at the front edge of the pavement. A local woman sighed and maneuvered around her.

  "You did it again," Elias murmured.

  "I stood where the bus door opens," Mara said.

  "You stood where a line *would* be. Here, order is tracked by acknowledgment. You refused the nod. You imposed a physical structure on a social one."

  "I didn't know the code," Mara said. "On your view, am I obligated to learn every micro-norm of every city I visit? If I fail to learn, am I immoral?"

  "You are obligated not to disrupt the mechanism that serves them," Elias said. "You don't need mastery, but you must attempt conformity. You treated the queue as a physical fact rather than a normative one."

  "It's not immoral to be an outsider," Mara said. "I didn't free-ride. I wasn't misleading. I just wasn't a member."

  They boarded and sat near a café they decided to try for lunch. Inside, service was included. A dish sat by the door. Regulars dropped coins. A tourist at the next table left a fifty-euro note. The proprietor looked pained, not grateful.

  "See?" Elias said quietly. "That was a violation."

  "It was generous," Mara countered.

  "It was destabilizing," Elias said. "The convention sets a equilibrium price that includes dignity for the staff—they aren't beggars. The tourist re-introduced a hierarchy of patronage. He violated an obligation owed to the regulars who maintain the norm. It was a moral failure of coordination."

  "That's absurd," Mara said. "It's supererogatory. He harmed no one. The waiter got more money. Your view implies there is a duty *not* to be overly generous if it breaks custom."

  "It implies a duty not to treat the social contract as a solo performance," Elias said. "He made the regulars look cheap and the staff uncomfortable. He broke the scheme."

  "Suppose he believed the dish was a sham," Mara said. "Suppose he thought service included meant the owner pocketed the wages, and tipping was a protest. Conscientious objection. On your view, is he bound to tip the coins anyway?"

  "If the scheme is settled, yes," Elias said. "Unless he works to change it. Unilateral deviation undermines the collective."

  "So a resident who knows the wages are exploitative must still drop the coin?"

  Elias paused. "It's defeasible. But the burden of proof is on the objector."

  "And the reverse?" Mara asked. "Think of the expat who lives here ten years but refuses to nod at the bus stop, insisting on lines. On my view, they never become a member unless they choose to constitute the practice. They remain a permanent visitor. On yours, they are bound."

  "They are bound," Elias said. "They are inside the scheme."

  "But they reject it," Mara said. "If obligation requires membership, and membership requires acceptance, they are free. I don't see why the tourist is different from the stubborn expat. Neither constitutes the practice."

  "Duration matters," Elias said. "But let's not resolve it tidily. I need to think."

  They finished their coffee. Walking back toward the hotel, the sun dipped low.

  "I'm struggling with your conscientious objector," Elias admitted. "If the norm is unjust, my view suggests the visitor must still comply to avoid disruption. That implies the convention itself generates obligation even when the content is morally suspect. That's too strong."

  "And I'm struggling with the expat," Mara said. "If someone lives here twenty years, raises children here, but refuses the local queue convention... it feels wrong to say they have no obligation. They benefit from the order without constituting it. My view lets them off too easily."

  "So," Elias said, "my revision: The obligation holds only if the convention is minimally just. If it's exploitative, the duty to coordinate dissolves. That handles the objector."

  "And mine," Mara said. "Membership isn't binary. It's gradual. After a certain threshold of residence and benefit, you become a constituent whether you like it or not. That handles the expat."

  "But then," Elias smiled, "you're admitting duration creates obligation independent of consent."

  "And you're admitting justice trumps convention," Mara replied. "We're closer than we thought."

  "Perhaps," Elias said, stepping off the curb against the light. "But not close enough to walk in step."
