      *   *Correction on "Testimony":* Many philosophers (e.g., Lackey, Fricker) emphasize the *assurance* view. If ML gives no assurance, is it testimony? The proposal must frame this as "Assuming we treat ML output as testimonial for the sake of argument..." or "Examining how ML forces us to redefine testimony." The user wants to avoid the "Can it testify" question. I will frame it as: "Even if we bracket the metaphysical status of the speaker, how do the *norms of acceptance* shift?"
