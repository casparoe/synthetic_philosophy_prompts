      *(Refining the Neuroscience point)*: This is actually a "LessWrong" tell. The TA mentioned LessWrong. This student is likely also from that tradition (neuroscience settles philosophy). The TA needs to know this is a specific *kind* of error common in that subculture (reductionism). I should note that in the "Errors" section without being mean.

