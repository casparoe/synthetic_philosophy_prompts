      *(Final Polish)*: Ensure the margin comments are copy-pasteable.

      *(Wait, one more check on Part A)*: "note that it can be pressed in more than one way." The student interprets this as "Phenomenology" vs "Extension." This is actually a *very* sophisticated reading of the prompt (Phenomenal Heterogeneity vs. Intensional/Extensional worries). However, using Nozick/Mill as the "Extension" press is the weak link. Nozick isn't about the extension of the word "pleasure," it's about the value of pleasure. So the *structure* is good, the *content* is off. I will be charitable here.

