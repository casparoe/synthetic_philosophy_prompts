answer: |-
  # The Newcomb Sorting Tree

  **Q1.** Does the idea of a perfect predictor feel like a trick question that removes your free choice?
  *   **Yes** → **The Incompatibilist**
  *   **No** → Go to Q2.

  **Q2.** Standard game: Predictor is near-perfect, Box B has £1m. Do you take both boxes or just B?
  *   **Both** → Go to Q3.
  *   **Just B** → Go to Q4.

  **Q3.** (For Two-Boxers) Would you sign a binding contract yesterday to take only B if it guaranteed you the £1m?
  *   **Yes** → **The Frustrated Two-Boxer**
  *   **No** → **The Plain Two-Boxer**

  **Q4.** (For One-Boxers) Variant: Predictor is a mate (60% accurate), Box B has £50. Do you still take just B?
  *   **No (Take Both)** → **The Calculating One-Boxer**
  *   **Yes (Take B)** → Go to Q5.

  **Q5.** (For Principled One-Boxers) Would you sign a binding contract yesterday to take only B?
  *   **Yes** → **The Resolute One-Boxer**
  *   **No** → **The Evidential One-Boxer**

  ***

  ### Leaf Notes & Commitments

  *   **The Incompatibilist:** Believes the scenario is metaphysically broken. *Unpleasant commitment:* Must admit debating rational choice here is as sensible as debating chess moves with a brick.
  *   **The Plain Two-Boxer:** Follows dominance reasoning regardless of outcome. *Unpleasant commitment:* Must accept they will systematically leave £1m on the table compared to one-boxers.
  *   **The Frustrated Two-Boxer:** Agrees one-boxing wins but claims they can't do it now. *Unpleasant commitment:* Must admit their own rationality is defective compared to the one-boxer's.
  *   **The Calculating One-Boxer:** One-boxes only when expected value is high enough. *Unpleasant commitment:* Must admit they'd betray their 'principle' the moment the stakes dropped.
  *   **The Evidential One-Boxer:** One-boxes because it's good news, not because it causes the money. *Unpleasant commitment:* Must accept they are acting on correlation without causal leverage.
  *   **The Resolute One-Boxer:** Believes rationality includes binding your future self. *Unpleasant commitment:* Must admit they need external constraints to be truly rational.

  ***

  ### Analyst's Notes

  **Impossible Combinations**
  Nobody answers "Yes" to Q1 and continues to Q2. This is **incoherent**; if the puzzle is impossible, there is no decision to make. Additionally, almost no one answers "Both" on Q2 and "Just B" on Q4. This is **unattractive**; if you two-box when the million is there, you won't one-box when only £50 is at stake.

  **Indistinguishable Leaves**
  The tree struggles to separate **The Evidential One-Boxer** and **The Resolute One-Boxer** in practice. Both take only Box B in the room. The distinction is purely counterfactual (would they have signed the contract?). In a single-shot game without contracts, their behaviour is identical.

  **Judgement Calls**
  I placed the **Variant (Q4)** specifically after the Standard Choice for one-boxers. This is the real sorting work. Many students claim to be one-boxers because "one-boxers get richer." This question tests if they care about the *principle* of evidential reasoning or just the *payout*. If they switch to two-boxing when Box B holds only £50, they aren't true evidentialists; they're just profit-maximisers who got confused by the high stakes.

  I separated the **Two-Boxers (Q3)** from the **One-Boxers (Q5)** on pre-commitment because the commitment means different things to them. For the two-boxer, signing is admitting defeat (they wish they were the type who could one-box). For the one-boxer, signing is confirming their strategy (they believe binding is part of rationality). Asking the same question to both reveals this asymmetry in how they view their own agency.
