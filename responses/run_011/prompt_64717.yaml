  **Subject:** Ticket #89402: Origin Discrepancy — Order #Child-004
  **From:** Sarah Jenkins <s.jenkins@email.com>
  **To:** Origins Assurance Desk <assurance@genesis-clinic.com>

  Dear Origins Assurance,

  I am writing regarding the delivery of Order #Child-004 (Male, 3 years). Upon reviewing the conception logs provided during the annual audit, I noticed Gamete S-442 was used instead of Gamete S-441. This is a different sperm. Consequently, this is a numerically distinct child than the one we contracted for. I am requesting an immediate exchange for the correct unit. If an exchange is impossible, I expect a full refund. The current unit is defective due to wrong origins. Please escalate this to a manager if you lack the authorization to process returns on misidentified persons.

  Regards,
  Sarah Jenkins

  ***

  **Subject:** RE: Ticket #89402: Origin Discrepancy — Order #Child-004
  **From:** Origins Assurance Desk <assurance@genesis-clinic.com>
  **To:** Sarah Jenkins <s.jenkins@email.com>

  Dear Valued Parent,

  Thank you for contacting Origins Assurance. Per Section 8.2 of our Terms of Conception (Necessity of Origin), a child constituted by different gametes is numerically distinct from the child constituted by the contracted gametes. An exchange is ontologically impossible, as it requires ceasing this child and creating another. Regarding refunds: Our policy distinguishes Strict Origin (any difference voids identity) from Hedged Origin (only totally different origins void identity). Your case falls under Hedged. Since the child exists and shares a substantial origin with the contract, no refund applies. Note: We see Related Ticket #89403 (Sibling Swap) similarly denied. Persons cannot exchange origins post-actualization.

  Sincerely,
  Origins Assurance Desk

  ***

  **Subject:** RE: Ticket #89402: Origin Discrepancy — Order #Child-004
  **From:** Sarah Jenkins <s.jenkins@email.com>
  **To:** Origins Assurance Desk <assurance@genesis-clinic.com>

  This is frustrating. If origin matters, define it. In Case #881 (Egg Donation), who is the origin? The genetic provider or gestational carrier? You list both. Also, Case #773 (Mitochondrial Replacement) involves three contributors. Which one triggers the warranty? If I'm paying for origin assurance, I need to know which biological contribution is essential and which is accessory. You're hiding behind vagueness to avoid liability.

  Regards,
  Sarah Jenkins

  ***

  **Subject:** RE: Ticket #89402: Origin Discrepancy — Order #Child-004
  **From:** Origins Assurance Desk <assurance@genesis-clinic.com>
  **To:** Sarah Jenkins <s.jenkins@email.com>

  Dear Valued Parent,

  Clarification: 'Origin of Record' contains two slots: Genetic and Gestational. They do not always name the same woman. For Mitochondrial cases, Warranty Section 12 specifies nuclear DNA providers constitute the primary origin; mitochondrial donors are accessory. However, we concede the Twinning Loophole (Case #550). Records show embryo split at Day 4. Origin necessity determines *who*, not *how many*. Cardinality is not settled by origin alone. We cannot refund one twin while retaining the other.

  Sincerely,
  Origins Assurance Desk

  ***

  **Subject:** RE: Ticket #89402: Origin Discrepancy — Order #Child-004
  **From:** Sarah Jenkins <s.jenkins@email.com>
  **To:** Origins Assurance Desk <assurance@genesis-clinic.com>

