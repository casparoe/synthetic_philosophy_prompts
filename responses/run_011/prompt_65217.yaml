  ### Least Sure Claim

  **Claim:** That the "direction of travel" in ¶6 implies a *historical* trajectory toward the marginalization of sacrifice, rather than just a *static* hierarchy of value.

  **Why:** The text says sacrifice is "nearer" or "further" from the primary object. This establishes a **rank**, but not necessarily a **timeline**. Maimonides could believe sacrifice is eternally inferior to prayer (static hierarchy) without believing it will ever be abolished (historical trajectory). The phrase "did not think it necessary to abolish... altogether" suggests it *could* happen, but doesn't confirm it *will*.

  **What would settle it:** A clearer modal verb in the final clause of ¶6. If the text read "God limited it *until* such time as..." the trajectory would be certain. If it read "God limited it *because* it is inherently inferior," the hierarchy is certain but the timeline is open. Friedländer's "within those bounds within which..." is ambiguous enough to allow both readings. To settle this, one would need to know if the Arabic implies a temporal limit (*ila an*) or a logical limit (*bi-qadr*).
