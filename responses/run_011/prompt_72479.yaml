          *   *Analysis:* This actually aligns well. (2) supports the Case Verdicts *against* the standard journalistic definition. But it conflicts with (3) if (3) implies a *single* objective boundary. If boundaries depend on exposure, the boundary is fuzzy/relative to location.
          *   *Severity:* Medium.

  4.  **Drafting the Audit (Iterative refinement):**

      *   *Structure:*
          1.  Executive Summary (The "Blunt" assessment).
          2.  Ranked Conflicts (Severity, Diagnosis, Fix, Cost).
          3.  Dissolved Tensions (Why they are fine).
          4.  Case Verdict Analysis (Do they follow?).
