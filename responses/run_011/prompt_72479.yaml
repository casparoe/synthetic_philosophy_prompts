      *   *Refining Conflict 1 (The Demographer Trap: 3+4 vs 5):*
          *   This is the most dangerous. (5) undermines (3). If APC is indeterminate, you can't "discover" the boundary statistically.
          *   *Fix:* Make (3) ontological, not epistemological/statistical. The boundary exists in *causal history*, even if regression can't pinpoint it.
          *   *Cost:* You concede the demographer's statistical point to save the ontological one.

      *   *Refining Conflict 2 (The Explanatory Gap: 2 vs 7):*
          *   (2) says "boring indexical fact." (7) says "does explanatory work."
          *   *Diagnosis:* If it's just "people born at time T," why is that explanatory? Only if Time T correlates with Cause C.
          *   *Fix:* Emphasize that the *shared structural position* is the cause, not the label.
          *   *Cost:* Weaken (7) slightly. It's not the *cohort* that explains, it's the *shared historical exposure* (which defines the cohort).

      *   *Refining Conflict 3 (Mannheim vs. Individualism: 8):*
          *   Mannheim requires "generation as actuality" (collective consciousness). Individualism denies collective minds.
          *   *Fix:* Use "coordination" or "common response" instead of "collective agent."
          *   *Cost:* You lose the strong Mannheim "spirit of the generation" vibe, but keep the mechanism.

      *   *Case Verdicts:*
          *   Do they follow from 2-4? Yes, if (2) is prioritized over (3)'s "objective boundary." Actually, the Case Verdicts suggest boundaries are *not* globally objective but locally indexed to exposure. This tensions with (3).
          *   *Fix:* Clarify that "objective" means "fact of the matter about exposure," not "fixed calendar year globally."

  5.  **Final Polish:**
