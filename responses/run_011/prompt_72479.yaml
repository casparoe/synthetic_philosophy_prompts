  3.  **Identify Potential Conflicts (The "Audit"):**

      *   *Hunch 1: (2) vs. (7).*
          *   (2) says it's *not* a similarity kind (indexical/historical).
          *   (7) says the cohort explains things in a way a conjunction of individuals doesn't (suggests emergent properties or structural causality).
          *   *Analysis:* If it's just an indexical label (like "people in Lisbon"), why does the *label* do explanatory work beyond the individuals? If I say "People in Lisbon rebelled," is that reducible to "Person A rebelled + Person B rebelled"? If (7) claims non-reducibility, it hints at a collective agent or structural force. But (2) says it's "boring" and indexical.
