      *   Make sure the "Cheapest Revision" is actually cheap and actionable.

  6.  **Self-Correction/Review during drafting:**
      *   *Wait, check (1) again.* (1) says "truth-apt independently of stipulation." If the Case Verdicts say "Millennial by birth, Zed by formation," aren't we introducing a stipulation about what counts as membership?
