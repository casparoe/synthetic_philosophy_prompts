          *   Distinguish *arthāpatti* (postulation) vs. *anupalabdhi* (non-apprehension).
          *   Cognition produced: *Arthāpatti* -> explanatory fact (eats at night); *Anupalabdhi* -> absence (no jar).
          *   Examples: Devadatta (stout/not eating day); Empty ground (no jar).
          *   Kumārila vs. Inference: *Arthāpatti* is based on incongruity (*virodha*), not pervasion (*vyāpti*) alone. It fills a gap to make sense of conflicting data.
      *   **Part (b) [10 marks]:**
          *   Nyāya strategy: Reductionism. *Arthāpatti* -> Inference (*anumāna*). *Anupalabdhi* -> Perception (*pratyakṣa*) (specifically of absence/qualifier).
          *   Commitment on Absence (*abhāva*): Nyāya-Vaiśeṣika *does* count absence as a *padārtha* (category). This is a crucial ontological point.
          *   Criterion for *pramāṇa*: Distinct object (*prameya*). If the object is covered by existing *pramāṇas*, no new *pramāṇa* is needed.
      *   **Part (c) [7 marks]:**
          *   Dignāga on *gavaya* (wild cow): Reduces *upamāna* (comparison) to Inference + Testimony + Memory.
          *   Nyāya stance: Nyāya *rejects* Dignāga's reduction. Nyāya defends *upamāna* as an independent *pramāṇa*.
          *   Criterion: *Upamāna* has a distinct object (relation between name and form/shape) not fully covered by perception or inference.
          *   *Note:* The script mentions "Prabhākara, the Nyāya commentator". This is a major red flag. Prabhākara is Mīmāṃsā, not Nyāya.

  3.  **Evaluate the Candidate Script:**

      *   **Part (a):**
          *   *Definition/Example:* Devadatta (stout/not eating day -> eats night). Correct. Empty ground (no jar). Correct.
          *   *Distinction:* Incongruity vs. Pervasion. Correct (Kumārila's view).
          *   *Anupalabdhi:* Cognition of absence. Correct.
          *   *Verdict:* Strong. Covers the requirements well.
          *   *Mark:* 7-8/8.

      *   **Part (b):**
          *   *Nyāya Strategy:* *Arthāpatti* -> Inference. *Anupalabdhi* -> Perception (*alaukika*). Correct.
          *   *Ontology of Absence:* "Nyāya-Vaiśeṣika does not count absence among the padārthas". **INCORRECT.** This is a fundamental doctrinal error. Nyāya-Vaiśeṣika *does* accept *abhāva* as the 7th (or 16th in older lists) category. They accept the reality of absence, which is why they can perceive it.
          *   *Nyāya vs Prabhākara on Absence:* "Nyāya sides in effect with Prabhākara." **INCORRECT/MISLEADING.** Prabhākara reduces *anupalabdhi* to perception of the bare locus. Nyāya accepts perception of absence (*abhāva*) as a qualified perception, but they ontologically accept absence. Kumārila accepts *anupalabdhi* as separate. The script confuses the epistemic reduction with the ontological status.
          *   *Criterion for Pramāṇa:* "admitted only if its objects are real over and above the objects of perception and inference". This is the correct Nyāya criterion (distinct *prameya*).
          *   *Verdict:* Good on epistemic reduction, catastrophic error on ontology (*padārthas*).
          *   *Mark:* 5-6/10. (The ontology error is significant but the epistemic strategy is mostly right).

      *   **Part (c):**
          *   *Dignāga's view:* Described correctly (Inference + Testimony + Memory).
          *   *Nyāya's view:* "I would say that Nyāya accepts the Buddhist treatment." **INCORRECT.** Nyāya famously defends *upamāna* as the 4th independent *pramāṇa* specifically against Dignāga's reduction.
          *   *Reasoning:* The candidate argues Nyāya breaks the *gavaya* case into steps covered by admitted means. This is actually Dignāga's argument, not Nyāya's. Nyāya argues the *knowledge of the relation* between word and object (based on similarity) is unique.
          *   *School Attribution:* "Prabhākara, the Nyāya commentator". **INCORRECT.** Prabhākara is a Mīmāṃsā philosopher.
          *   *Verdict:* Fundamental misunderstanding of the Nyāya position on *upamāna*. The candidate argues *for* Dignāga against Nyāya, when asked if Nyāya would accept Dignāga.
          *   *Mark:* 1-2/7. (Shows knowledge of the *gavaya* example but gets the school's stance backwards).

  4.  **Categorise Faults (Slips vs. Doctrinal):**
      *   *Slip:* None really. The errors are conceptual.
      *   *Doctrinal:*
          1.  Nyāya-Vaiśeṣika ontology of *abhāva* (Claim: not a *padārtha*. Fact: It is).
          2.  Nyāya on *upamāna* (Claim: Accepts Dignāga's reduction. Fact: Rejects it).
          3.  Prabhākara's School (Claim: Nyāya commentator. Fact: Mīmāṃsā).
      *   *Load-bearing:*
          1.  Ontology of *abhāva*: Undermines the explanation of *anupalabdhi* in Nyāya (Part b).
          2.  Nyāya on *upamāna*: Completely invalidates the answer to Part (c).
