          *   (a) Anupalabdhi example: Correct.
          *   (b) Nyāya reduction of Arthāpatti: Correct.
          *   (b) Nyāya reduction of Anupalabdhi: Correct (alaukika perception).
          *   (b) Nyāya on Padārthas/Absence: **Incorrect.** (Load-bearing).
          *   (b) Nyāya sides with Prabhākara: **Incorrect/Loose.** (Nyāya accepts absence as real object of perception, Prabhākara denies absence is a separate object).
          *   (c) Nyāya accepts Dignāga: **Incorrect.** (Load-bearing).
          *   (c) Prabhākara is Nyāya commentator: **Incorrect.** (Slip/Doctrinal confusion).

      *   *Slips vs. Doctrinal:*
          *   Prabhākara school: Doctrinal confusion (fundamental classification).
          *   Nyāya Ontology: Doctrinal mistake (core metaphysics).
          *   Nyāya on Upamāna: Doctrinal mistake (core epistemology).

      *   *Defensible Readings:*
          *   The description of *alaukika* perception is standard interpretation.
