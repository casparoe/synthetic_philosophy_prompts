prompt: |-
  I've been lurking on and off the rationalist blogs since the Overcoming Bias days — read the sequences when they came out, argued about Newcomb cases on forums for a decade, and somewhere along the way I picked up enough epistemic game theory to be dangerous. I've got a draft post sitting here that I've rewritten three times and I can no longer tell if it's any good or if I've just hypnotized myself. I'd like actual comments on it, not encouragement. Audience is my usual one: people who know what a prisoner's dilemma is without being told, a couple of whom are working economists who will absolutely notice if I'm sloppy.

  Here's the draft:

  ---

  **Superrationality is not rationality plus common knowledge. It's a substitute for it.**

  Most people who read a lot of this stuff learned two things in the same couple of years: Hofstadter's superrationality, and the common-knowledge machinery from epistemic game theory. They get filed together in the head as "the material about agents who know things about each other's knowing." I think that filing is a mistake, and the mistake has practical consequences.

  Start with the recap. Superrational reasoning in a symmetric game says: the other player is running the same kind of reasoning I am, so we'll land on the same answer; therefore don't maximize over all four cells of the matrix independently, maximize over the diagonal. In a standard prisoner's dilemma that gets you cooperation instead of mutual defection. In the Platonia setup — trillionaire, twenty people, exactly one telegram gets a billion, no communication allowed — it gets you sending the telegram with probability one in twenty. Notice what's missing from that description. Nobody believes anything about anybody's beliefs. The whole thing runs off one assumption about a mechanism, not about a mind modeling a mind.

  This is where I want to make a distinction I don't think is usually made. Call them:

  **Copy-superrationality.** The symmetry is a fact about implementations. Either you literally are the same program running twice, or you're both instances of "what a careful person does in this situation," and you know which because you know what the procedure is. Cost: one first-order belief.

  **Guess-superrationality.** The symmetry is a fact about a social category. He's a smart, honest guy reading the same column I am, so he'll get the same answer. Cost: an entire belief hierarchy, because now I need him to be superrational, and I need him to think I am, and so on up.

  Hofstadter's own presentation slides between the two, and I think most of the heat in arguments about superrationality is people defending one while attacking the other. But once you see them as separate, you can price them.

  Here's my proposal for how to price them. For any game, there's a fixed budget of mutual information about each other's decision procedures that the players need before they can safely coordinate off the diagonal. Nash reasoning spends that budget on hierarchy — and hierarchy is expensive, because every level is a separate thing that has to be gotten right, and there are unboundedly many levels. Copy-superrationality spends it on a single bit at level zero: we are the same algorithm. So the two are substitutes, and the substitution rate is not favorable to the hierarchy side. Call it the transparency budget. The more you can buy at level zero, the fewer levels you need to survive.

  Guess-superrationality then should be the fragile one, and you can see how fragile pretty quickly. Let ε be the probability your counterpart isn't running your algorithm — he's a plain maximizer, or a different sort of thing entirely. With payoffs T > R > P > S, cooperating beats defecting exactly when (1−ε)R + εS > (1−ε)P + εT, which rearranges to ε < (R−P) / ((R−P) + (T−S)). On the usual dollar version of the dilemma that's 99/249, so a shade under 0.4. You can be wrong about your partner's type nearly forty percent of the time and diagonal reasoning still pays. That's graceful degradation. It doesn't look like a cliff at all.

  Except that there are cliffs in this literature. Rubinstein's email game: two players have to coordinate, only one of them learns which coordination game they're in, and the message confirming it might get lost with small probability. You can have an arbitrarily long but finite chain of "I know that he knows that I know," and the equilibrium still jumps back to the safe one. Common knowledge doesn't get approximated, it gets had or not had. That's the shape of a discontinuity, and guess-superrationality — being made of hierarchy all the way down — looks like it should inherit it rather than the smooth threshold from the last paragraph.

  So which is it? I think the answer is that the two ε's aren't the same kind of quantity. In the threshold calculation ε is uncertainty about *type*: a first-order matter, and it degrades smoothly. In the email construction the uncertainty is about the *state* — which game is being played — and what has to be infinitely deep is whether he knows that I know that. Those are different failure modes, and my threshold formula only measures the first one. Which means the honest conclusion is that the formula is measuring something other than the thing I care about. The real threat to guess-superrationality isn't that your partner is the wrong sort of agent. It's that your partner is the right sort of agent and isn't sure that you know that he is.

  That's also, I'd argue, the correct way to read Aumann's result about rational agents with a common prior being unable to agree to disagree. It's normally filed as a curiosity, or as a negative result about opinion. But it's really a statement that hierarchy can't be faked: if two guess-superrationalists each believe the other will send the telegram, and one of them doesn't, then the hierarchy was never actually there. Superrationality on the guess reading is Aumann's theorem repurposed as a coordination device rather than as a impossibility result about disagreement.

  The practical upshot is the part I actually care about. If you want off-diagonal cooperation from a real counterpart, don't invest in building more levels of mutual belief, because that's the fragile direction and it's the direction where one dropped message kills everything. Invest at level zero: become the same algorithm. Publish your decision procedure, be boringly predictable, be copyable. It's also why I think the Twin Prisoner's Dilemma and Parfit's hitchhiker are usually misread as exhortations to hope the other guy is like you. They're not hoping. They're deleting the epistemics and replacing them with a fact about implementations.

  Superrationality isn't rationality with more knowledge. It's rationality that got out of the knowledge business.

  ---

  Okay. What I want from you:

  - The ε paragraph. Is the algebra right, is the threshold formula the right thing to be computing, and is there a hidden assumption in it — specifically about whether ε gets updated once I've made my own choice, since that's the spot where I know I'm standing next to an evidential-decision-theory swamp.
  - The Aumann paragraph, which im pretty sure is the weakest thing here. I can't tell whether I'm misusing the theorem or just being loose with it. What does it actually license?
  - The email game. Am I allowed to import that discontinuity into a fixed-payoff dilemma where the uncertainty is about my partner's reasoning procedure instead of about the payoffs? And is "common knowledge doesn't get approximated" too strong a claim in general, or only in that particular construction?
  - The copy/guess split and the transparency budget: load-bearing, or decoration that I'm attached to because I named it? Would anything be lost if I cut them?
  - Places where the argument quietly assumes something it hasn't earned. I have a feeling there's at least one, possibly around the claim that standard game theory's own common-knowledge-of-rationality assumption isn't already doing the work I'm attributing to my distinction.
  - Is any of this interesting to someone who does this professionally, or is it all obvious to anyone who's read a chapter of a standard text? I'd rather hear "obvious" than find out on the blog.

  I don't want reading recommendations or a reference list — I know roughly where the pieces come from and I'm not going to cite anything I haven't sat with. I want to know whether it holds up. Be blunt, tell me if the framing is a rebrand of something that already has a name, and if a section should just go, say so.
reasoning: |-
  Here's a thinking process that leads to the critique:

  1.  **Analyze the User and Request:**
      *   **User Profile:** Long-time rationalist community member (Overcoming Bias era), read the Sequences, argued Newcomb cases for a decade, knows epistemic game theory well enough to be "dangerous." Audience is similarly sophisticated (economists, game theorists).
      *   **Goal:** Wants actual, blunt criticism on a draft blog post. No encouragement, no reading lists.
      *   **Draft Topic:** Distinguishing "Copy-superrationality" (implementation symmetry) from "Guess-superrationality" (belief hierarchy symmetry), arguing the former is robust and the latter is fragile (Rubinstein email game style), and concluding that practical coordination requires becoming the "same algorithm" rather than building mutual knowledge.
      *   **Specific Questions:**
          1.  The $\epsilon$ paragraph (algebra, threshold, EDT swamp).
          2.  The Aumann paragraph (misuse? what does it license?).
          3.  The Email Game (importing discontinuity to fixed-payoff/uncertain-reasoning?).
          4.  Copy/Guess split & Transparency Budget (load-bearing or decoration?).
          5.  Hidden assumptions (especially regarding common knowledge of rationality).
          6.  Novelty/Interest (obvious to pros or actually interesting?).

  2.  **Analyze the Draft Content:**
      *   **Core Thesis:** Superrationality isn't "rationality + common knowledge." It's a substitute.
      *   **Distinction:** Copy-superrationality (same algorithm/implementation) vs. Guess-superrationality (social category/belief hierarchy).
      *   **Argument:** Copy is robust (smooth degradation with $\epsilon$). Guess is fragile (Rubinstein discontinuity).
      *   **Conclusion:** Don't build belief hierarchies; make yourself copyable/predictable (implementation level).
      *   **Tone:** Confident, slightly provocative, technical but accessible to the in-group.

  3.  **Evaluate Specific Points (Mental Sandbox):**

      *   **Point 1: The $\epsilon$ paragraph.**
          *   *Algebra:* $(1-\epsilon)R + \epsilon S > (1-\epsilon)P + \epsilon T$.
          *   Rearrange: $R - \epsilon R + \epsilon S > P - \epsilon P + \epsilon T$.
          *   $R - P > \epsilon(R - S + T - P)$.
          *   $\epsilon < (R-P) / (R - S + T - P)$.
          *   Draft says: $(R-P) / ((R-P) + (T-S))$.
          *   Let's check denominator: $R - S + T - P = (R-P) + (T-S)$. Yes, algebra is correct.
          *   *The EDT Swamp:* The calculation assumes $\epsilon$ is exogenous. But in a superrational context, if I decide to Cooperate, does that update the probability the other Cooperates? If I'm using EDT/ADT, my choice *is* evidence of their choice. The formula treats $\epsilon$ as "probability they are a different type," independent of my choice. This is actually consistent with "Copy-superrationality" where $\epsilon$ is the chance the copy failed. But if it's "Guess," does my choice signal my type? The draft acknowledges this ("spot where I know I'm standing next to an evidential-decision-theory swamp").
          *   *Critique:* The formula is standard for "probability of encountering a defector." But in superrationality, the correlation is usually logical, not causal/probabilistic in the standard sense. The draft treats $\epsilon$ as *type uncertainty*, not *decision correlation uncertainty*. This is a crucial distinction. If $\epsilon$ is "prob they are not a superrationalist," the math holds. If $\epsilon$ is "prob the correlation breaks," the math needs to account for the conditional probability $P(C_2 | C_1)$. The draft seems to conflate "they are a different type" with "they defect." If they are a different type (Nasher), they defect. So the math holds *if* $\epsilon$ is strictly type uncertainty.
          *   *Verdict:* Algebra is fine. The hidden assumption is that $\epsilon$ is independent of the decision process (no logical correlation update). This needs to be explicit.

      *   **Point 2: The Aumann Paragraph.**
          *   *Claim:* Aumann's "No Agreeing to Disagree" shows hierarchy can't be faked. Superrationality is Aumann's theorem repurposed.
          *   *Critique:* This is the shakiest part. Aumann's theorem is about *posteriors* given a *common prior*. It says if priors are common and posteriors are common knowledge, they must be equal.
          *   How does this link to coordination? If we both *know* we are superrational, we coordinate. If we disagree on whether we are superrational, we don't.
          *   The draft says: "if two guess-superrationalists each believe the other will send the telegram, and one of them doesn't, then the hierarchy was never actually there." This is almost tautological.
          *   The link to Aumann is tenuous. Aumann is about *beliefs about the world*, not necessarily *beliefs about actions* (though actions reveal beliefs). The stronger link is actually to *Common Knowledge of Rationality (CKR)* leading to Nash, vs. *Common Knowledge of Correlation* leading to Superrationality.
          *   *Verdict:* It feels like name-dropping Aumann to lend weight to a point about coordination. The point "hierarchy can't be faked" is better supported by the Rubinstein email game than Aumann. Aumann is about consistency of beliefs, not stability of coordination under noise. I'd advise cutting or heavily revising this.

      *   **Point 3: The Email Game.**
          *   *Claim:* Rubinstein shows common knowledge doesn't approximate. Guess-superrationality inherits this discontinuity.
          *   *Critique:* Rubinstein is about uncertainty over the *payoff matrix* (which game is being played). The draft asks: can we import this to uncertainty over *reasoning procedure*?
          *   Yes, essentially. If the "state" is "We are both superrationalists" vs "I am, he isn't," and messages confirm this state...
          *   However, Copy-superrationality bypasses the need for messages. If we are *copies*, we don't need to signal.
          *   The claim "common knowledge doesn't get approximated" is true in the limit of the Rubinstein construction, but in practice, "almost common knowledge" often suffices for *approximate* equilibrium payoffs, even if the equilibrium strategy jumps. (Monderer and Samet 1989). The draft says "equilibrium still jumps back to the safe one." This is true for the *exact* equilibrium, but payoff continuity is a different beast.
          *   *Verdict:* The import is valid conceptually. The "doesn't get approximated" claim is technically true for the *strategy* in Rubinstein, but might be too strong for a general claim about all epistemic games. Stick to Rubinstein specifically.

      *   **Point 4: Copy/Guess Split.**
          *   *Critique:* This is the strongest part of the post. It maps roughly onto "Logical Correlation" (FLI/Tortoise) vs. "Belief Hierarchies" (Standard Epistemic Game Theory).
          *   "Transparency Budget" is a nice turn of phrase. Is it load-bearing? Yes, it structures the argument that Level 0 (implementation) is cheaper than Level $\infty$ (beliefs).
          *   *Verdict:* Keep it. It's the core contribution. It clarifies why "be predictable" works better than "trust that I trust you."

      *   **Point 5: Hidden Assumptions.**
          *   *CKR:* Standard game theory assumes Common Knowledge of Rationality (CKR). In PD, CKR leads to Defection. Superrationality assumes Common Knowledge of *Superrationality* (or correlation).
          *   The draft says: "standard game theory's own common-knowledge-of-rationality assumption isn't already doing the work."
          *   Actually, CKR *prevents* cooperation in PD. So the distinction holds.
          *   *Hidden Assumption:* The draft assumes "Copy-superrationality" is possible for humans. "Publish your decision procedure, be boringly predictable, be copyable." Humans are not source code. We can't actually be copies. We can only be *analogous*. This slides back into Guess-superrationality.
          *   *Verdict:* This is the biggest practical hole. You can't actually be a copy. You can only signal similarity. The advice "be copyable" is metaphorical for humans. The post needs to acknowledge that for humans, Copy is an idealization of Guess.

      *   **Point 6: Novelty/Interest.**
          *   *Critique:* To a game theorist, "Copy" looks like "Correlated Equilibrium" or "Logical Decision Theory." "Guess" looks like "Common Knowledge of Rationality."
          *   The distinction between "symmetry of implementation" vs "symmetry of belief" is known in the Newcomb/PSD literature (e.g., Yudkowsky/Soares vs. standard causal decision theorists).
          *   However, framing it as "Transparency Budget" and linking it to Rubinstein's discontinuity vs. Type-uncertainty continuity is a fresh synthesis.
          *   It won't be "obvious" to economists, but they might say "This is just Logical Decision Theory vs. CDT with noisy priors."
          *   *Verdict:* It's interesting enough. It reframes existing concepts in a way that yields practical advice (invest in predictability, not mutual mind-reading).

  4.  **Drafting the Response:**
      *   **Tone:** Match the user's. Blunt, technical, no fluff.
      *   **Structure:** Address the six specific bullet points from the prompt.
      *   **Content:**
          *   Confirm algebra, flag the EDT independence assumption.
          *   Hit the Aumann paragraph hard (it's the weak link).
          *   Validate the Email Game import but nuance the "approximation" claim.
          *   Validate Copy/Guess as the core value add.
          *   Point out the "Humans aren't code" assumption.
          *   Assess novelty (LDT reframing, but useful synthesis).

  5.  **Refining the Critique (Self-Correction during drafting):**
      *   *Aumann:* I need to be precise. Aumann's theorem is about *posteriors*. If we have a common prior and common knowledge of posteriors, we agree. The draft uses it to say "if we disagree on action, the hierarchy wasn't there." That's not really Aumann. That's just consistency. I should suggest cutting Aumann and sticking with Rubinstein for the fragility argument.
      *   *EDT Swamp:* The formula calculates the break-even point for *uncorrelated* risk. If there is *any* logical correlation (even if not perfect copy), the formula changes. The draft treats $\epsilon$ as "prob they are a Nasher." If they are a Nasher, they defect. If they are a Superrationalist, they Cooperate. This assumes Superrationalists *always* cooperate with each other. That's the "Copy" assumption. If it's "Guess," a Superrationalist might defect if they think *you* might defect. The formula assumes the *decision* is fixed by the *type*. This is a strong assumption. I need to point this out.
      *   *Economist Audience:* They will balk at "be the same algorithm." They will see this as "commitment technology." I should mention that.

  6.  **Final Polish:** Ensure I answer the specific questions directly. (e.g., "Is the algebra right?" -> "Yes." "Is Aumann misuse?" -> "Yes, mostly.")

  7.  **Final Output Generation** (Proceed to generate response based on these thoughts).
answer: |-
  Here is the blunt assessment you asked for.

  ### 1. The $\epsilon$ Paragraph
  **Algebra:** Correct. The rearrangement holds.
  **Threshold:** You are computing the break-even point for a *mixed population* model, not a *correlated decision* model. This is the hidden assumption.
  **The Swamp:** You acknowledge it, but you haven't fully drained it. Your formula treats $\epsilon$ as the probability the opponent is a *type* who defects (a Nasher), independent of your choice. This works for Copy-superrationality (if the copy fails, it fails independently). It does *not* work for Guess-superrationality if there is any logical correlation remaining.
  If I am a Guess-superrationalist, my decision is *evidence* of your decision. If I cooperate, I update upward on the probability that you cooperate, even if $\epsilon > 0$. Your formula assumes $P(C_{opp} | C_{me}) = 1 - \epsilon$. In an evidential framework, $P(C_{opp} | C_{me})$ should be higher than the base rate because my choice is a sample of the reasoning process you share.
  **Fix:** Explicitly state that this calculation assumes $\epsilon$ represents *uncorrelated* type uncertainty (i.e., the "copy" failed completely and was replaced by a defector), not partial correlation. If there is partial correlation, the threshold for $\epsilon$ is much higher.

  ### 2. The Aumann Paragraph
  **Verdict:** This is the weakest link. Cut it or rewrite it heavily.
  **Why:** You are misusing the theorem to do work it doesn't do. Aumann's "Agreeing to Disagree" is about the consistency of *posteriors* given a *common prior*. It does not directly license coordination strategies.
  Your claim ("if one of them doesn't [send the telegram], then the hierarchy was never actually there") is a tautology of equilibrium selection, not a consequence of Aumann's theorem. If we are in a Nash equilibrium where I defect and you cooperate, we have different posteriors about the optimal action, which implies we didn't have common knowledge of each other's posteriors. But that's just the definition of equilibrium, not Aumann's result.
  **Risk:** An economist reading this will see "Aumann" and expect a statement about priors and sigma-algebras. When they get a metaphor about coordination, it looks like name-dropping.
  **Alternative:** The Rubinstein email game already does the heavy lifting for "fragility of hierarchy." You don't need Aumann here. If you must keep it, frame it as: "Aumann shows that common knowledge of posteriors forces agreement; therefore, if we disagree on action, we lack common knowledge of the reasoning state." But even that is stretchy. I'd cut it.

  ### 3. The Email Game
  **Importing the Discontinuity:** You are allowed to import it, but you must be precise about *what* is uncertain. Rubinstein's discontinuity arises because the *payoff structure* is uncertain (which game are we playing?). In your Guess-superrationality case, the uncertainty is about the *reasoning procedure* (are we both superrational?).
  Mathematically, these are isomorphic if you treat "Superrational vs. Nasher" as the state of the world. So yes, the discontinuity holds: if there is any non-zero probability that the chain of "I know that you know..." is broken, the unique equilibrium reverts to the safe (defect) strategy in the limit.
  **"Doesn't get approximated":** This is technically true for the *equilibrium strategy* in Rubinstein, but false for *payoffs* in general perturbations (Monderer & Samet, 1989). In many games, $\epsilon$-common knowledge yields $\epsilon$-equilibrium payoffs. However, in coordination games with a risk-dominant equilibrium (like PD), the jump is real.
  **Fix:** Qualify the claim. "In coordination games with a risk-dominant defection equilibrium, common knowledge doesn't approximate." Don't make it a universal claim about all game theory, or a theorist will nitpick you on global games.

  ### 4. Copy/Guess Split & Transparency Budget
  **Verdict:** Load-bearing. This is the value-add of the post.
  **Why:** It cleanly separates Logical Decision Theory (copy/source code) from Epistemic Game Theory (beliefs/hierarchy). The "Transparency Budget" framing is a useful heuristic for why LDT proponents argue for source-code exchange over cheap talk.
  **Would anything be lost?** Yes. Without this distinction, the post collapses into "Superrationality is hard." The split explains *why* it's hard (hierarchy cost) and *how* to fix it (level-zero implementation). Keep the names; they do work.

  ### 5. Hidden Assumptions
  **The "Humans are Code" Assumption:** This is the biggest hole for your audience. You write: "Publish your decision procedure, be boringly predictable, be copyable."
  For software agents, this is literal. For humans, this is metaphorical. Humans cannot literally be copies. We can only signal similarity. But signaling similarity is *Guess-superrationality* (he thinks I'm like him), not Copy-superrationality (we are the same function).
  If I "publish my decision procedure" as a human, I am creating a *reputation*, which is a belief hierarchy object. I am not becoming a copy.
  **The CKR Assumption:** You worry that standard Common Knowledge of Rationality (CKR) is doing the work. It isn't. In PD, CKR implies Defection. Your distinction holds. However, standard game theory *does* assume players can model each other's reasoning (Level-k). Your argument is that Level-0 (implementation identity) is cheaper than Level-$\infty$ (mutual knowledge).
  **Fix:** Acknowledge that for humans, "Copy-superrationality" is an asymptotic ideal. We can't be copies, but we can build *commitment technologies* that approximate copies. If you don't acknowledge the human limitation, economists will dismiss the "be copyable" advice as impossible.

  ### 6. Novelty/Interest
  **Is it obvious?** To a specialist in Logical Decision Theory (MIRI/FLI crowd), the Copy/Guess distinction is standard fare (though your "Transparency Budget" phrasing is new). To a working economist or standard game theorist, this is **not** obvious.
  Standard texts treat "Superrationality" as a curiosity or a mistake (confusing correlation with causation). They do not typically model it as "implementation symmetry vs. belief hierarchy."
  **Will they care?** Yes, because you are offering a practical heuristic for coordination ("invest in predictability, not mutual mind-reading") derived from a technical distinction. That bridges the gap between the abstract "Newcomb" debates and real-world institutional design.
  **Rebranding Check:** It feels like a rebrand of "Correlated Equilibrium vs. Nash Equilibrium" filtered through "Logical vs. Causal Decision Theory." But the specific framing of *cost of hierarchy* vs. *cost of implementation* is fresh enough to stand on its own.

  ### Summary of Edits
  1.  **Cut Aumann.** It adds prestige but not logic. Rubinstein carries the fragility argument alone.
  2.  **Clarify $\epsilon$.** Specify that the formula assumes uncorrelated type failure, not partial logical correlation.
  3.  **Qualify "Be Copyable."** Acknowledge that for humans this means "commitment devices/reputation" not literal source-code identity, or else you lose the economists on feasibility.
  4.  **Tighten "Approximation."** Limit the claim about common knowledge not approximating to coordination games/risk-dominant equilibria.

  The core insight (Copy is robust, Guess is fragile, invest in Level 0) is solid. The scaffolding around Aumann and the human-feasibility of copying needs to be tightened so it doesn't collapse under scrutiny.
