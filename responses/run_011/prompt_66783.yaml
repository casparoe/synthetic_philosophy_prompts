prompt: |-
  I teach a philosophy-of-social-science seminar, 14 grad students, 50 minutes, one course of probability behind them but no measure theory and no real game theory. We've just done testimony and peer disagreement, and next week I'm supposed to hand them Aumann's agreeing-to-disagree result. I want an in-class game where they run into the thing themselves and I don't have to say his name until the last ten minutes.

  The part I want them to feel is *not* "sharing evidence makes people converge." They already believe that, it's completely banal and I don't want to spend an hour proving it. What I want is the specific weirdness: that once the estimates themselves are out in the open and everyone knows everyone has them, continuing to differ stops feeling like a legitimate standoff and starts feeling like somebody has made an error they can't locate. And then the rug-pull: that the common prior is what's doing all the work, and it does it invisibly, because from the inside a difference in priors is experientially identical to a difference in evidence. I want at least one student to say something like "but I just weighed it differently, that's not irrational" and I want the room to not know how to answer them.

  So build me two hidden-state setups on the same physical apparatus — an urn, a deck, whatever you think is cheapest and least see-through. Round-robin announcements, repeated. In the second setup, heterogeneity in priors has to be smuggled in as background framing in a handout, never labeled as a prior, never announced.

  What I need: a materials list (nothing over a few dollars, no real money, but I want actual stakes — a points currency with some grading-neutral payoff is fine), exact turn structure, a scoring scheme where being accurate genuinely pays and where sandbagging or vaguing out your announcement doesn't, a minute-by-minute timeline, and a debrief that maps particular moments in the game onto particular hypotheses of the theorem (common prior, common knowledge of the posteriors, the partition structure of who-knows-what).

  Also tell me what will break the first time I run it. I'm specifically worried about: (a) someone's first announcement leaking their private signal exactly and the whole game collapsing in round one; (b) a stubborn holdout who refuses to move and becomes a folk hero; (c) two or three sharp students reverse-engineering the state from everyone else's numbers, leaving the rest of the room feeling stupid and then just copying. For each, say whether to prevent it, house-rule it, or lean into it as pedagogy.

  And be honest about which feature the game can't reproduce. My guess is common knowledge — in a real room people only ever hear the announcements, not the infinite stack of everyone-knows-that-everyone-knows — so if that's right, tell me exactly what I have to supply by hand in the debrief to close the gap.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Context:** Philosophy of Social Science seminar, 14 grad students, 50 minutes.
      *   **Prerequisites:** One course in probability (no measure theory, no real game theory).
      *   **Topic:** Aumann's "Agreeing to Disagree" theorem.
      *   **Goal:** An in-class game/experiment where students *experience* the pressure to converge, specifically the feeling that differing estimates *after* sharing them implies an error, not just different evidence.
      *   **Key Twist:** Two setups. Setup 1: Standard common prior (convergence expected). Setup 2: Hidden heterogeneous priors (smuggled in via framing), leading to persistent disagreement that feels irrational but isn't (under the theorem's constraints).
      *   **Specific Feelings:** Students should feel that continuing to differ is an error. One student should claim "I just weighed it differently," causing confusion.
      *   **Requirements:** Materials list (cheap), turn structure, scoring scheme (anti-sandbagging), minute-by-minute timeline, debrief mapping game to theorem, troubleshooting (signal leakage, stubborn holdouts, reverse-engineering), and limitations (common knowledge).

  2.  **Deconstruct Aumann's Theorem for Pedagogy:**
      *   *Core Claim:* If agents have a common prior and their posterior probabilities for an event are common knowledge, they must be equal.
      *   *The "Weirdness":* It's not just that sharing *evidence* makes us agree. It's that sharing *beliefs* forces agreement, even if we don't share the underlying evidence, provided we trust each other's rationality and share a prior.
      *   *The "Rug Pull":* The Common Prior Assumption (CPA) is doing the heavy lifting. If priors differ, agreement isn't required. But differing priors feel like differing evidence from the inside.

  3.  **Designing the Game Mechanism:**
      *   *Apparatus:* Urns are classic. Let's use two urns (Red/Blue bias). Or a deck of cards. Urns are easier for "signals." Let's go with **Two Bags (Bag A and Bag B)**.
      *   *State of the World:* Which bag was chosen? (50/50 initially).
      *   *Signals:* Students draw a ball, look at it, put it back.
      *   *Task:* Estimate the probability that it is Bag A.
      *   *Scoring:* Proper Scoring Rule (Brier Score or Logarithmic). Brier is easier to calculate mentally. $(1 - p)^2$ if false, $p^2$ if true (minimized) or $1 - (p - outcome)^2$ (maximized). Let's use a simplified linear payoff for speed, or a Brier penalty. Actually, for 50 mins, simple "Points = 100 * (1 - |p - outcome|)" works well enough to incentivize honesty without complex math. Wait, proper scoring rules are crucial to prevent sandbagging (saying 0.5 to be safe). Let's use a quadratic scoring rule simplified: Payoff = $100 - 100(p - \text{truth})^2$. Truth is 1 if Bag A, 0 if Bag B.
      *   *Structure:*
          *   Round 1: Private signal, private estimate.
          *   Round 2: Public announcement of estimates.
          *   Round 3: Revised estimates.
      *   *Setup 1 (Common Prior):* Everyone told the bags are selected by a fair coin.
      *   *Setup 2 (Heterogeneous Prior):* Half the class gets a handout saying "Bag A is usually chosen (70%)", half gets "Bag B is usually chosen (70%)". They don't know the other half has a different handout.

  4.  **Refining the "Weirdness" (The Aumann Moment):**
      *   In Setup 1, after announcing posteriors, they *must* converge if they are Bayesian. If they don't, they feel irrational.
      *   In Setup 2, they won't converge. The student who says "I weighed it differently" is actually operating on a different prior, but they experience it as "my evidence/experience suggests X."
      *   *Constraint:* 14 students is a lot for round-robin in 50 mins.
      *   *Solution:* Break into two groups of 7? No, the "Common Knowledge" aspect requires everyone to hear everyone.
      *   *Better Solution:* Select 5-6 "Active Agents." The rest are "Auditors/Observers" who score them. Rotate roles if time permits, but for the core effect, 6 active agents is enough to create the social pressure. Actually, 14 is manageable if announcements are just numbers. "Say your number." 14 numbers takes 2 minutes.
      *   *Iteration:* Aumann requires *common knowledge* of posteriors. One round of announcement isn't enough for the theorem strictly, but it's enough for the *feeling*. Let's do two rounds of announcement.

  5.  **Addressing the Troubleshooting:**
      *   *(a) Signal Leakage:* If someone says "I saw 3 reds," that's evidence, not a posterior. Rule: "Only announce your credence (0-100%). Do not explain why."
      *   *(b) Stubborn Holdout:* This is actually good pedagogy. It highlights the "Common Knowledge of Rationality" assumption. If they don't move, they are violating the assumption.
      *   *(c) Reverse Engineering:* If smart students figure out the state, the game ends. This is a risk. To mitigate, make the signals noisy (e.g., Bag A is 60% Red, Bag B is 60% Blue). Not 100% deterministic.

  6.  **Developing the "Rug Pull" (Setup 2):**
      *   Handout A: "The selector favors Bag A (Prior = 0.7)."
      *   Handout B: "The selector favors Bag B (Prior = 0.3)."
      *   Crucially: Do not tell them priors might differ. Tell them "Read the background info on the process."
      *   When they announce, Group A will cluster high, Group B will cluster low.
      *   When asked why they don't move, Group A says "The evidence points to A." Group B says "The evidence points to B."
      *   The reveal: Your "evidence" included a prior you didn't realize was contested.

  7.  **Drafting the Plan (Iterative refinement):**
      *   *Time:* 50 mins is tight.
      *   0-5: Intro & Setup 1 Instructions.
      *   5-15: Setup 1 Play (Signals + 2 Rounds of Announcement).
      *   15-20: Setup 1 Debrief (Convergence).
      *   20-25: Setup 2 Instructions (The Trick).
      *   25-35: Setup 2 Play.
      *   35-45: Setup 2 Debrief (The Conflict).
      *   45-50: Aumann Reveal & Theory.
      *   *Scoring:* Needs to be fast. Use a spreadsheet projected on screen? Or just honor system with a "Course Credit Point" (e.g., 0.5% extra credit for top scorers). Let's suggest a projected calculator.
      *   *Materials:* 2 opaque bags, Red/Blue chips (or cards), Handouts.

  8.  **Addressing the "Common Knowledge" Gap:**
      *   In class, we only get finite rounds. We never achieve infinite "I know that you know that I know."
      *   *Fix:* In debrief, explicitly state: "In the theorem, this announcement loop goes on forever. In here, we stopped at 2. But you felt the pressure. That pressure is the finite shadow of the infinite requirement."

  9.  **Refining the Scoring Rule:**
      *   Brier Score: $1 - (p - o)^2$.
      *   If Truth = 1 (Bag A), and you say 0.8. Score = $1 - (0.2)^2 = 0.96$.
      *   If Truth = 0 (Bag B), and you say 0.8. Score = $1 - (0.8)^2 = 0.36$.
      *   This penalizes overconfidence heavily. It prevents sandbagging at 0.5 because 0.5 yields 0.75 always. If you have info, you should move away from 0.5.
      *   *Implementation:* Instructor calculates live on a laptop connected to projector. Students shout number, instructor types, projects score.

  10. **Final Review against Constraints:**
      *   *14 students:* All participate in announcements.
      *   *No measure theory:* Keep math to basic probability.
      *   *Feelings:* Focus debrief on the *social pressure* of disagreement.
      *   *Troubleshooting:* Add specific scripts for the instructor.

  11. **Self-Correction on Setup 2:**
      *   If I hand out different priors, is it "smuggled"? Yes, if the handout looks identical except for one number buried in text.
      *   *Better:* Make the "Background Info" sound like evidence about the *bags* rather than the *selection process*.
      *   *Actually, simplest:* "Historical data suggests Bag A is used more often" vs "Bag B is used more often."
      *   *Wait, one nuance:* Aumann requires common prior *at the start*. If I give them different priors, they don't have a common prior. The point is they *think* they do.
      *   *Instruction:* "Read the background brief silently. Do not discuss the brief, only your probability estimate."

  12. **Writing the Response:**
      *   Tone: Professional, pedagogical, slightly conspiratorial (regarding the trick).
      *   Structure: Materials -> Setup 1 -> Setup 2 -> Timeline -> Debrief -> Troubleshooting -> Limitations.

  *(Self-Correction during drafting)*: 50 minutes is *very* short for two full rounds of 14 people.
  *Adjustment:* Reduce active players to 8 for the game, 6 observers. Or just accept that announcements must be rapid-fire. "Say your number, don't explain."
  *Decision:* Keep all 14 active. It takes 30 seconds for 14 people to say a number. The time sink is the *thinking*. Limit signals to 1 draw per person to save time.
  *Scoring:* To save time, don't calculate individual scores live. Calculate *Group Accuracy* (Mean Brier Score) at the end of each round. This creates team pressure.
  *Wait, individual stakes are better for the "irrationality" feel.* If the group score is used, free-riding happens.
  *Compromise:* Instructor has an Excel sheet open. As students call out numbers, instructor types them. At the end of the round, hits "Enter" and projects the scores. Takes 10 seconds.

  *Let's finalize the "Rug Pull".*
  In Setup 2, when they disagree, ask: "Who is making a mistake?"
  They will point at each other.
  Then reveal the priors.
  "The mistake was assuming you started at the same place."

  *Okay, ready to write.*
answer: |-
  Here is a complete lesson plan designed to fit your 50-minute window, hit the specific epistemic nerves you identified, and execute the "rug pull" on the Common Prior Assumption.

  # Title: The Pressure to Converge
  **Time:** 50 Minutes
  **Students:** 14 Graduates
  **Goal:** Experiential demonstration of Aumann's Agreement Theorem, specifically the normative pressure of common knowledge of posteriors and the hidden role of the common prior.

  ## I. Materials List (Cost < $20)
  1.  **Two Opaque Bags** (cloth drawstring bags or coffee mugs covered in foil). Label them **Bag X** and **Bag Y**.
  2.  **Poker Chips or Colored Cards:** 40 Red, 40 Blue.
      *   *Bag X Content:* 30 Red, 10 Blue (70% Red).
      *   *Bag Y Content:* 10 Red, 30 Blue (70% Blue).
  3.  **Handouts (14 total):** Two versions (A and B), printed on identical paper. (See *Setup 2* below).
  4.  **Projector/Laptop:** With a simple spreadsheet open (Columns: Student Name, Round 1 Estimate, Round 2 Estimate, Score).
  5.  **Currency:** "Epistemic Points" (EP). Top 3 scorers get +0.5% on final participation grade (or equivalent low-stakes reward).

  ## II. The Scoring Rule (Anti-Sandbagging)
  Use a simplified **Brier Score**. It penalizes vagueness (0.5) if you have information, and penalizes overconfidence if you are wrong.
  *   **Formula:** $100 \times (1 - (\text{Announced Prob} - \text{Actual Outcome})^2)$
  *   **Outcome:** 1 if Bag X was chosen, 0 if Bag Y was chosen.
  *   **Example:** Truth is Bag X (1). You say 80% (0.8). Score = $100 \times (1 - (0.2)^2) = 96$.
  *   **Example:** Truth is Bag Y (0). You say 80% (0.8). Score = $100 \times (1 - (0.8)^2) = 36$.
  *   **Example:** You hedge at 50% (0.5). Score = $100 \times (1 - 0.25) = 75$ (regardless of truth).
  *   *Pedagogical Note:* This forces them to commit. 75 points is "safe," but to win the prize, they must move toward 0 or 1 based on evidence.

  ## III. Minute-by-Minute Timeline

  ### 0:00 – 0:05: Setup & Instructions
  *   Place bags at front. Explain contents (70/30 split).
  *   Explain the task: "I have flipped a coin to select one bag. That bag is the **True State**. You will not know which bag. You will draw one chip from the bag, look at it, return it, and shuffle. That is your **Private Signal**."
  *   Explain the goal: "Announce your credence that it is Bag X. Two rounds of announcements. Maximize Epistemic Points."
  *   **Rule:** "When announcing, say *only* the number. No 'I think,' no 'because I saw red.' Just the probability."

  ### 0:05 – 0:20: Round 1 (Common Prior)
  *   **Prior:** Verbally state: "The coin flip to choose the bag was fair. 50/50 chance for X or Y." (This establishes Common Prior).
  *   **Signal:** Pass bags around. Each student draws once, records color, returns chip. (2 mins).
  *   **Announcement 1:** Go around the room. Instructor types numbers into projected spreadsheet. (3 mins).
  *   **Calculation:** Instructor hits "Enter" on spreadsheet to show scores *hypothetically* (don't reveal truth yet). Ask: "Look at the variance. If you are Bayesian, what should happen next?"
  *   **Announcement 2:** "You now know everyone's initial credence. You know we are all rational (assume this). Update your probability." Go around room again. (3 mins).
  *   **Reveal:** Reveal the True State (open the bag). Calculate actual scores. Award points.
  *   **Micro-Debrief (2 mins):** "Did you converge? Why? You didn't share signals, only numbers. Why did the numbers pull together?" (Elicit: "Because I realized someone else saw Red and I saw Blue, so we cancel out.")

  ### 0:20 – 0:25: Setup 2 (The Trap)
  *   Reset the game. New coin flip (secretly).
  *   **Handout:** Distribute the papers face down. "Read the **Background Brief** silently. This contains historical data on the selection process. Do not discuss the text. Do not show your paper."
      *   **Version A (7 students):** "Historical logs show Bag X is selected 70% of the time in this lab." (Prior = 0.7).
      *   **Version B (7 students):** "Historical logs show Bag Y is selected 70% of the time in this lab." (Prior = 0.3).
      *   *Crucial:* The text looks identical except for the X/Y and percentage.
  *   **Signal:** Same as before. Draw one chip. (2 mins).

  ### 0:25 – 0:35: Round 2 (Heterogeneous Priors)
  *   **Announcement 1:** Go around the room. (3 mins).
      *   *Expected Result:* Group A clusters ~0.8+. Group B clusters ~0.2-.
  *   **Instructor Prompt:** "Look at the spreadsheet. There is a stark divide. You know everyone's numbers. You know everyone is rational. Update."
  *   **Announcement 2:** Go around the room. (3 mins).
      *   *Expected Result:* Minimal movement. Persistent disagreement.
  *   **The Confrontation:** Pick one student from Group A and one from Group B.
      *   Ask A: "Why haven't you moved toward B?" (Answer: "My evidence + the base rate says X.")
      *   Ask B: "Is A making a mistake?" (Answer: "Yes, they are ignoring the base rate.")
      *   Ask A: "Are you making a mistake?" (Answer: "No, I weighed the evidence correctly.")
  *   **Reveal:** Collect the handouts. Project them side-by-side. Reveal the True State.

  ### 0:35 – 0:45: The Debrief (Mapping to Aumann)
  *   **The Feeling:** "In Round 1, disagreement felt like *temporary ignorance*. In Round 2, disagreement felt like *irrationality*. Why?"
  *   **The Theorem:** Write on board: **Common Prior + Common Knowledge of Posteriors $\rightarrow$ Agreement.**
  *   **Map the Game:**
      1.  **Common Prior:** Round 1 had it (50/50 verbal). Round 2 broke it (hidden handouts).
      2.  **Common Knowledge:** We approximated this by hearing everyone's number publicly.
      3.  **Partition:** Your private signal was your partition cell.
  *   **The Rug Pull:** "In Round 2, you felt B was being irrational. But B was Bayesian relative to *their* prior. The 'irrationality' you felt was the violation of the Common Prior Assumption, which you didn't know was violated."
  *   **Key Takeaway:** "Differences in priors are experientially identical to differences in evidence. You cannot tell from the inside if you are disagreeing because you saw different chips, or because you started with different worldviews."

  ### 0:45 – 0:50: Limitations & Q&A
  *   Address the "Infinite Recursion" problem (see Section V below).
  *   Collect Epistemic Points.

  ---

  ## IV. Troubleshooting: What Will Break
  You asked for honesty about failure modes. Here is how to handle them.

  ### (a) Signal Leakage (The "I Saw Red" Problem)
  *   **Risk:** A student says, "I'm at 80% because I drew Red."
  *   **Effect:** Collapses the game into evidence sharing, bypassing the "posteriors as knowledge" mechanism.
  *   **Fix:** **Prevent it.** Enforce the "Numbers Only" rule strictly. If they explain, stop them: "That is evidence, not a posterior. Just give the number."
  *   **Pedagogy:** This reinforces the distinction between *data* and *belief*. Aumann is about beliefs becoming common knowledge, not data.

  ### (b) The Stubborn Holdout (The Folk Hero)
  *   **Risk:** One student refuses to update in Round 1, saying "I trust my chip more than the group."
  *   **Effect:** Breaks the "Common Knowledge of Rationality" assumption.
  *   **Fix:** **Lean into it.** In the debrief, use them. "Aumann's theorem requires us to assume everyone is a Bayesian updater. If [Student] is not updating on public information, the theorem doesn't apply. The 'pressure' you felt to agree relies on the assumption that *no one* is being stubborn."
  *   **Pedagogy:** This highlights that the theorem is a normative constraint on *rational* agents, not a descriptive law of psychology.

  ### (c) Reverse Engineering (The Smart Alecks)
  *   **Risk:** 3 students realize they can count the Reds/Blues announced and deduce the True State immediately.
  *   **Effect:** They go to 100% or 0% instantly; others feel stupid and copy.
  *   **Fix:** **House Rule it.** "If your calculation leads to 100% certainty, you are capped at 95%." Or, simply acknowledge it: "If you can deduce the state, you have achieved the limit of the theorem. But notice: even if you know the state, you still have to wait for the others to catch up to achieve *common knowledge*."
  *   **Pedagogy:** Use this to explain the difference between *everyone knowing P* and *everyone knowing that everyone knows P*. The smart students know P. They don't know if the slow students know P.

  ---

  ## V. The "Common Knowledge" Gap (Honesty Check)
  You are correct: **This game cannot reproduce Common Knowledge.**
  In the game, students hear the announcements (Level 1: I know your number). They know everyone heard the announcements (Level 2: I know you know my number). But they do not have the infinite stack (Level $\infty$).

  **How to close the gap in the debrief:**
  You must explicitly supply the missing logic. Say this:
  > "In this room, we stopped at two rounds. Technically, Aumann requires an infinite loop of 'I know that you know that I know...' until the partitions refine completely.
  >
  > However, the *social pressure* you felt in Round 1 was the finite shadow of that infinite requirement. You felt that holding out was irrational. Why? Because you intuited that if we kept going, the math forces us together.
  >
  > In Round 2, that pressure remained, but the convergence didn't happen. That is the proof that the **Common Prior** was the engine. Without it, the infinite loop doesn't collapse to a single point. It collapses to two different points."

  ## VI. Why This Works for Your Specific Goals
  1.  **Not "Sharing Evidence":** They never share the chip colors. They only share probabilities. They converge in Round 1 *without* sharing evidence, proving the theorem's specific claim about posteriors.
  2.  **The "Error" Feeling:** In Round 2, when Group A sees Group B sticking to low numbers, they genuinely feel Group B is broken. This replicates the real-world frustration of polarization where both sides feel the other is ignoring "obvious" facts.
  3.  **The "Weighed Differently" Moment:** When you ask the holdout why they didn't move, they will say, "I weighed the base rate." You then reveal the base rate was different. This creates the exact epistemic vertigo you want: *My internal reasoning process was identical to theirs, but the output was incompatible because of a hidden variable.*
  4.  **Cost/Time:** Chips and bags are cheap. The spreadsheet handles the scoring instantly. 50 minutes is tight but doable if you keep the announcements rapid-fire.

  ## VII. Instructor Script for the "Rug Pull"
  *When revealing the handouts in Round 2:*

  **You:** "Student A, you said 85%. Student B, you said 15%. After hearing each other, you barely moved. Student A, is Student B irrational?"
  **Student A:** "Well, they're ignoring the base rate."
  **You:** "Student B, read your handout."
  **Student B:** (Reads: "Bag Y is selected 70% of the time.")
  **You:** "Student A, read yours."
  **Student A:** (Reads: "Bag X is selected 70% of the time.")
  **You:** "Neither of you made a calculation error. Neither of you was irrational. You simply did not have a **Common Prior**. But from the inside, before this reveal, did it *feel* like they were irrational?"
  **Class:** "Yes."
  **You:** "That feeling is the cost of the Common Prior Assumption. We assume it to make the math work. But in the real world, this handout is never visible."
