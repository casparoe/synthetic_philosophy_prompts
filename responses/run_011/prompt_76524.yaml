answer: |-
  **Question 1**
  You describe the emergence of new classifier constructions in later cohorts of this sign language as your cleanest natural experiment; if you had to bet your entire thesis on a single finding, is this the one where the causal arrow from language to thought points most clearly?
  *Note:* I am fishing for her strongest, least confounded evidence to let her establish credibility before pressing; a typical answer can be rendered as her pointing to a specific moment where new grammar created new cognitive ability in real time.
  *Follow-up:* If she confirms this is the strongest case, ask: "Does the fact that it required a new generation to develop the grammar suggest that the cognitive shift is cultural and slow, rather than a direct effect of the language on the individual brain?"

  **Question 2**
  **[FLAG: Hope she raises this organically]** In the fieldwork with speakers who always know North, skeptics argue that a life spent navigating open terrain creates both the need for cardinal grammar and the skill to track it, so are you certain the language is the engine and not just the dashboard?
  *Note:* I am pressing the ecological confound objection to test her causal claims; a typical answer can be rendered as her distinguishing between general navigational skill and the specific, automatic linguistic coding of space.
  *Follow-up:* If she insists language is the engine, ask: "If we took a speaker of that language and moved them to a dense forest where cardinal cues are invisible, would their cognitive advantage persist, or does the environment sustain the effect?"

  **Question 3**
  You emphasize that you are not arguing for determinism, but if the effect is not that speakers *cannot* think certain thoughts, only that they *habitually* do not, where does the habit end and the cognitive machinery begin?
  *Note:* I am trapping the "not determinism" deflection to force a definition of the boundary between habit and hardware; a typical answer can be rendered as her claiming that deep habits eventually rewire the underlying attention systems.
  *Follow-up:* **Version 2:** "If it is a habit, could we not break it with non-linguistic training, which would imply the grammar is not the necessary cause?" **Version 3:** "If training can break it, are we discussing a feature of human cognition or merely a feature of your specific experimental task?"

  **Question 4**
  In the color-discrimination study, the advantage disappears when the brain is verbally loaded, which critics say proves language is just being used as a tool in the moment rather than having permanently changed how color is seen.
  *Note:* I am raising the verbal-interference objection to challenge the "restructured perception" claim; a typical answer can be rendered as her arguing that constant tool use eventually becomes part of the perceptual system itself.
  *Follow-up:* If she argues tool use becomes perception, ask: "At what point does a tool become a limb, and do you have evidence that this specific linguistic tool has crossed that threshold permanently?"

  **Question 5**
  You acknowledge these effects are often small, but you argue that small effects measured carefully are the substance of science; does a small effect size imply that language only nudges thought in the lab, while the real world washes the difference away?
  *Note:* I am challenging the "small effects" deflection to question the ecological validity of her findings; a typical answer can be rendered as her insisting that small biases accumulate over a lifetime to shape worldview.
  *Follow-up:* **Version 2:** "If they accumulate, why do we not see larger divergences in real-world decision-making between speakers of different languages?" **Version 3:** "If the real world washes them away, is the theory describing human nature or just a fragile laboratory artifact?"

  **Question 6**
  When you say the cognitive machinery is reshaped, are you describing a change in the actual format of mental representation, or simply a change in what the speaker chooses to attend to when a task begins?
  *Note:* I am forcing a mechanistic commitment regarding the language-of-thought objection; a typical answer can be rendered as her specifying that attention allocation is the primary mechanism of change.
  *Follow-up:* If she specifies attention, ask: "If attention is the mechanism, can we not achieve the same result with a non-linguistic cue, which would make the grammar incidental rather than causal?"

  **Question 7**
  **[CUT IF SHORT]** Regarding the Amazonian number words, you interpret the training success as a lack of practice rather than a lack of concepts, but if the concept can be installed so quickly, was it ever truly missing to begin with?
  *Note:* I am probing the number cognition case to test the depth of the linguistic deficit; a typical answer can be rendered as her distinguishing between having a concept latent in the mind and having it readily accessible for use.
  *Follow-up:* If she distinguishes latent vs. accessible, ask: "If it is latent, does that not support the universalist view that the grammar merely unlocks what is already there?"

  **Question 8**
  Whorf's original case rested heavily on Hopi time, which later linguists showed was factually incorrect; how much of the intellectual baggage from that error do you feel you still have to carry in defending a modern version of the theory?
  *Note:* I am invoking the historical objection to see if she distances herself from Whorf's specific failures; a typical answer can be rendered as her disowning Whorf's specific claims while retaining his general intuition.
  *Follow-up:* If she disowns Whorf's claims, ask: "If the flagship example was wrong, what guarantees do we have that the current flagship examples are not suffering from the same descriptive errors?"

  **Question 9**
  You suggest the burden of proof lies with universalists to produce a replicable null result, but if a phenomenon is as fragile and hard to pin down as you describe, does it not become the claimant's responsibility to show it exists robustly?
  *Note:* I am countering the "burden of proof" deflection to challenge the reliability of her positive findings; a typical answer can be rendered as her arguing that human cognition is context-sensitive and null results often miss the right conditions.
  *Follow-up:* **Version 2:** "If the conditions are that specific, is the theory predictive enough to be scientifically useful?" **Version 3:** "If we must find the exact right context to see the effect, are we studying a cognitive universal or a local cultural quirk?"

  **Question 10**
  What specific experimental result, if published tomorrow, would force you to abandon the thesis rather than reinterpret the parameters of the task?
  *Note:* I am asking for falsification conditions to test the scientific rigor of her position; a typical answer can be rendered as her outlining a specific replication failure under controlled conditions that would invalidate her model.
  *Follow-up:* If she outlines a failure condition, ask: "Have any existing studies come close to that threshold, and if so, how do you distinguish them from the noise you mentioned earlier?"

  **Question 11**
  **[CUT IF SHORT]** Several high-profile studies on grammatical gender and object properties have failed to replicate; do you view these as evidence that the effect is boundary-dependent, or that the original finding was simply incorrect?
  *Note:* I am raising the replication crisis objection to test her confidence in the broader literature; a typical answer can be rendered as her attributing failures to subtle methodological differences in how the tasks were framed.
