          *   *Argument Strategy:* Williams often argues via the explanation of action. If a reason statement is true, it should be able to explain action (or failure to act). External reasons statements lack explanatory power because they aren't tied to motivation.
          *   *Externalists:* Williams claims external reason statements are either false, confused, or not truth-apt. They often rely on a false model of motivation (that belief alone can motivate) or obscure metaphysical claims.
          *   *Key Distinction:* Internal vs. External reasons statements.
          *   *Key Concept:* Subjective Motivational Set (S) - not just desires, but dispositions, patterns, projects.
          *   *Key Concept:* Sound Deliberative Route (SDR) - includes means-end reasoning, correcting false beliefs, imagining outcomes, etc.
      *   **Part (b): The "Too Subjective" Objection (Corrupt/Badly Informed S).**
