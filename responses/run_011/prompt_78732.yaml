answer: |-
  **MEMORANDUM**

  **TO:** Housing Authority Board Members
  **FROM:** [Your Name]
  **DATE:** [Date]
  **SUBJECT:** Recommendation on Master Lease Renewal (Private Landlord vs. Nonprofit Bid)

  **Recommendation**
  I recommend we **renew the lease with the private landlord, contingent on amending the termination clause.** Specifically, we should require that individual tenancies cannot be ended without "good cause" (e.g., non-payment, lease violation) during the five-year term, or alternatively, require Board notification and approval prior to any no-cause termination notice.

  If the landlord refuses this amendment, we should reject the bid and proceed with the nonprofit contract plus emergency vouchers for the remaining 80 households.

  **Reasoning**
  This decision requires balancing immediate housing capacity against long-term tenant security. Below is the analysis of the three main factors driving this vote.

  **1. The Capacity Constraint (The Staff Position)**
  The strongest argument for accepting the lease as-is is the math. The nonprofit bid leaves 80 households without housing in this cycle. In our current market, finding scattered-site units for 80 vulnerable families is not guaranteed. Staff argues that a discretionary power is not a harm if it is not exercised. They are correct that an unused clause does not physically displace anyone today. If our only metric is "heads in beds tonight," the private lease wins.

  However, "heads in beds" is a short-term metric. Our mandate includes housing *stability*. A lease that allows removal without cause creates structural instability. If we accept the staff's logic that "unused powers are harmless," we ignore the risk management aspect of our fiduciary duty. We are insuring these families against homelessness for five years; a policy that allows them to be removed with 30 days' notice undermines that insurance.

  **2. The Existence of Power as a Cost**
  We must determine if the *existence* of the no-cause clause is a harm, even if evictions are rare.
  *   **The Chilling Effect:** The cost of this clause is not just in evictions executed, but in complaints suppressed. Tenants who fear retaliation will tolerate substandard living conditions rather than request repairs. This shifts maintenance costs from the landlord to the tenants (in health and comfort) and eventually to us (in deferred capital needs).
  *   **The Historical Record:** In nine years, the clause was used twice. Both times followed repair complaints. While the sample size is small, the rate of retaliatory suspicion is 100%. The landlord's claim that one was for a relative is unverifiable and irrelevant to the tenant's vulnerability. This history confirms the power is not dormant; it is available as a tool to manage tenant behavior.
  *   **Conclusion:** The bare existence of the power is a cost. It creates a power imbalance where the tenant must remain agreeable to keep their home, regardless of the landlord's performance.

  **3. Tenant Satisfaction Data**
  The survey shows 78% satisfaction and a preference not to change the lease. This is significant, but it should not settle the question for two reasons:
  *   **Adapted Expectations:** Tenants in subsidized housing often adapt their expectations to the constraints they face. Satisfaction surveys measure whether current conditions meet expectations, not whether those expectations are reasonable or safe.
  *   **Collective vs. Individual Risk:** Tenants may vote for the status quo because they are not the ones currently at risk. They prioritize the certainty of the current landlord over the disruption of a transition. As a Board, we must look at the aggregate risk over five years. The 22% dissatisfaction, combined with the two known retaliatory cases, suggests a vulnerability that a satisfaction survey smooths over.

  **Proposed Conditions**
  We can secure the 200 units without accepting the liability of the no-cause clause. I propose we authorize the renewal only if the following language is added to the master lease:

  1.  **Cause Requirement:** Individual tenancies may only be terminated for material non-compliance (non-payment, damage, criminal activity) or if the owner withdraws the unit from the program entirely (with 90 days notice and relocation assistance).
  2.  **Oversight:** If "no-cause" termination must remain, the landlord must provide the Authority with 60 days advance notice and a written justification before serving the tenant. The Authority reserves the right to intervene if the justification appears retaliatory.

  **Summary**
  We should not force 80 families to lose housing opportunities, but we should not purchase capacity by selling out tenant security. The private landlord provides the volume we need, but the terms must match the protections the nonprofit offers. If the landlord values the 200-unit contract, they should accept standard cause-based termination. If they walk, we face a harder budget year, but we avoid locking in a system where complaining about mold or heat can cost a family their home.

  I look forward to discussing this at Thursday's session.
