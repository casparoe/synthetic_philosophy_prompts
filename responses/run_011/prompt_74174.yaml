answer: |-
  The Serbian national myth surrounding the 1389 Battle of Kosovo operates as a self-undermining lost cause because its central claim of spiritual election depends on the narrative of Prince Lazar's deliberate choice of a "heavenly kingdom" via military defeat, such that wishing for the cause's historical triumph would logically void the moral superiority the community derives from the loss. The mechanism functions through the specific theological economy of the myth, where the defeat is not a failure to be remedied but a covenant to be maintained; victory would have secured an "earthly kingdom," which the myth explicitly frames as transient and spiritually inferior to the martyrdom that guarantees eternal honor. This tension surfaces practically in Vidovdan (St. Vitus Day) ceremonies and political rhetoric, most notably during the 600th-anniversary commemorations in 1989, where leaders invoked the sanctity of the loss to justify contemporary political struggles while simultaneously promising a restoration of national power that the original myth suggests is spiritually irrelevant. Among historians of national memory, it is settled that the battle was a tactical draw but a strategic Ottoman victory that ended Serbian medieval statehood, while it is genuinely contested whether the "heavenly kingdom" motif originates in contemporary medieval sermons or is largely a construction of 19th-century Romantic nationalism and Orthodox clergy; my own reconstruction posits that regardless of its origin, the myth's operational logic in modern politics requires the defeat to remain permanent to sustain the victimhood-based cohesion. This mechanism generalizes across defeat-myths that rely on theological or moral purification through suffering, such as the Confederate Lost Cause or the Irish Easter Rising, where the blood of the dead is cited as the seed of the nation. However, the Irish Easter Rising of 1916 serves as a counter-example that my account should predict to be self-undermining but which visibly is not; while the myth relies on Patrick Pearse's doctrine of "blood sacrifice" to redeem the nation, the community plainly wishes the Rising had achieved military victory without feeling that such a counterfactual success would dissolve the sanctity of the martyrs, because the Irish narrative treats the death as a catalytic cost rather than a chosen spiritual good in itself.
