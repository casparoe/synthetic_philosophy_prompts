answer: |-
  The data lock meeting lasted twelve minutes. The statistician, a man who treated p-values like religious artifacts, placed the final printout on the table. Compound 44-B, the posterior gamma suppressor, had met every endpoint. Reaction times, verbal fluency, memory consolidation, autonomic arousal: the confidence intervals for the dosed arm overlapped the saline arm so perfectly it looked like a printing error. There was no statistical daylight between the two groups.

  We had proven that we could turn off the light without stopping the machine.

  The sponsor's marketing team was already drafting the copy. *Surgical silence without surgical stillness.* The claim was that the patient felt nothing, despite being able to follow commands and recite poetry during the procedure. The evidence for this claim rested entirely on the null result. Because the patients behaved exactly as they did when awake, but the neural correlate was suppressed, the sponsor concluded the experience was absent.

  I was the study coordinator. I had written the protocol. I had also enrolled myself in the crossover sub-study, Subject Zero-Alpha. It was a perk of the job, and a necessity; I needed to know if the cognitive drag was real before we dosed the public. I underwent two sessions, one week apart. One session was saline. One was 44-B. I kept handwritten contemporaneous notes in bound lab notebooks during the recovery phase of each session, while the EEG caps were still attached and the task lights were cycling.

  Three days after the data lock, I sat in my office with the two notebooks. They were identical in size, black covers, grid paper. The handwriting was mine in both. The ink was the same blue. The content was functionally indistinguishable.

  In the lab, the air always smelled of isopropyl alcohol and ozone, a sharp, clean scent that coated the back of the throat. The cooling fans on the EEG amplifiers hummed at a pitch just below hearing, a vibration I felt in my molars rather than heard. During the sessions, I sat in a reclined chair facing a wall of instrument housings. The lights on these units were small LEDs, status indicators that blinked in sequences I was instructed to describe aloud.

  I opened the first notebook.

  > **Session A | T+15min**
  > *Task: Color/Shape discrimination. Verbal report.*
  > *The light on the instrument housings is the yellow of a wasp's abdomen. Not lemon, not gold. It has a sting in it. It vibrates against the grey plastic. My tongue feels thick, like felt. I know I am speaking clearly because the technician nods, but the words feel like objects I am pushing across a table. The pain in my left knee is present but distant, wrapped in cotton. I am certain I am awake. I am certain I am here.*

  I opened the second notebook.

  > **Session B | T+15min**
  > *Task: Color/Shape discrimination. Verbal report.*
  > *The light on the instrument housings is the yellow of a wasp's abdomen. Not lemon, not gold. It has a sting in it. It vibrates against the grey plastic. My tongue feels thick, like felt. I know I am speaking clearly because the technician nods, but the words feel like objects I am pushing across a table. The pain in my left knee is present but distant, wrapped in cotton. I am certain I am awake. I am certain I am here.*

  There were minor variations. A comma shifted in the third line. The word "present" was underlined in one, not the other. But the core testimony was identical. The confidence was identical. The vividness of the description was identical.

  One of these afternoons, according to the hypothesis, I was a hollow shell. The gamma oscillations were suppressed. The interior light was off. The physics of my brain continued to operate—motor cortex firing, Broca's area sequencing, memory encoding—but there was no one home to see the yellow light or feel the cotton-wrapped pain. I was a philosophical zombie, recording data about experiences I was not having.

  The other afternoon, I was whole.

  I could not tell which was which. The randomization code was sealed in an envelope in the safe downstairs.

  The ethics committee meeting had been two months prior, before the dosing began. Silas Vane sat at the far end of the table. He was a philosopher, invited to represent the non-clinical perspective. He wore a grey suit that looked too warm for the season. He hadn't spoken until the review of the primary endpoint definition.

  "The success criterion is indistinguishability," Vane had said. His voice was dry, like pages turning. "You are defining efficacy as the inability to tell the difference between the drug state and the baseline state."

  "On behavioral and physiological measures," I had corrected. "The neural correlate is distinct."

  "The correlate is distinct," Vane agreed. "But the claim is about experience. You intend to market this as 'insensate.' But your assay for insensibility is the patient's report. If the drug works as hypothesized, the patient's report is generated by neural mechanisms that do not require experience. Therefore, the report is causally disconnected from the experience."

  He had tapped the protocol document with a pen.

  "If I understand your mechanism," Vane continued, "the physics of the vocal cords and the language centers remain intact. So a patient without experience would say 'I am in pain' if the nociceptive pathways fired, and 'I am fine' if the script required it. You are assuming that because the report matches the baseline, the experience matches the baseline. But your own hypothesis says the experience is removed while the report remains. So the report proves nothing."

  "We have the EEG," I had said. "The oscillation is gone."

  "You are assuming the oscillation *is* the experience," Vane said. "No physical measure can establish that. You have built a machine that measures the whistle to prove the steam is off. If the whistle blows anyway, you claim the steam is gone. But if the whistle blows exactly the same, how do you know the steam isn't still there? Or how do you know it isn't gone in both cases? The design guarantees a null result on the only evidence that matters."

  I had not answered him then. The committee voted to proceed. The potential benefit—surgery without trauma—outweighed the metaphysical uncertainty. But Vane's objection sat in my head like a splinter.

  Now, with the notebooks open, the splinter was throbbing.

  I stood up and went to the safe. The envelope was there, sealed in tamper-evident plastic. I broke the seal. Inside was a single sheet of paper with the randomization key.

  **Subject 0-Alpha:**
  **Session 1 (Date: 10/14): Saline**
  **Session 2 (Date: 10/21): Compound 44-B**

  I checked the dates on the notebooks. The notebook with the underlined "present" was Session 2. The notebook with the comma shift was Session 1.

  I sat back down. I knew now. The notebook with the comma shift was the saline session. I was conscious then. The notebook with the underlined "present" was the drug session. According to the sponsor, I was insensate then.

  I read the drug session note again. *The light on the instrument housings is the yellow of a wasp's abdomen.*

  It was vivid. I remembered writing it. I remembered the sting of the yellow. But if Vane was right, and the sponsor was right, that memory was a fabrication. The neural state that produced the sentence did not include the sensation of yellow. It included only the processing of wavelength data and the retrieval of the metaphor "wasp's abdomen" from semantic memory. The confidence I felt—the *certainty* that I was here—was a chemical output, not a truth.

  But then I looked at the saline notebook. The text was the same. The confidence was the same. If the drug session could produce that text without experience, what guaranteed that the saline session produced it *with* experience? The physics were identical. The output was identical. The only difference was the label on the envelope.

  The vividness of the drug session's note did not prove I was conscious then; it proved that unconscious systems can write vividly. But that undermined the saline session's note too. If the mechanism of writing is independent of the light, then the writing proves nothing about the light in either case. I held the evidence of my own consciousness in my hands, and it was worthless. It was just ink on paper, generated by a machine that would run just as well in the dark.

  I closed the notebooks. The office was quiet. The air conditioning vent rattled slightly, a loose baffle clicking against the metal frame.

  I walked to the window. Outside, the parking lot was wet from rain. The asphalt was black, reflecting the sodium vapor lights of the streetlamps. The reflection shimmered, distorted by the thin film of water. It was a bright, oily yellow.

  I went back to my desk and picked up the drug session notebook. I ran my thumb over the grid paper. The texture was rough, fibrous. I could feel the indentations where the pen had pressed down. I could feel the weight of the book.

  I opened the consent form file on my computer. I scrolled to section 14, paragraph C.

  > **14.C.iii:** *The Subject acknowledges that subjective reports collected during the administration of Compound 44-B may not correlate with phenomenological experience as traditionally defined. The Subject waives the right to claim discrepancy between reported state and internal state for the purposes of liability.*

  I had written that clause. I had thought it was legal protection. Now it looked like a confession.

  I took a fresh sheet of paper from the drawer. I picked up my pen. I looked at the yellow light reflecting on the wet asphalt outside. I waited to see if I felt the sting of it. I waited to see if the sensation was there, or if I was just processing the concept of sting.

  I wrote: *The light is yellow.*

  I put the pen down. I looked at the sentence. It sat on the page, black ink on white paper. It was true. It was also useless.

  I reached out and turned off the desk lamp. The room went dark, save for the glow of the computer screen and the yellow streetlight bleeding through the blinds. I watched the cursor blink on the screen. It was a steady, rhythmic pulse. Green on black.

  I reached out and touched the edge of the notebook. The corner was slightly dog-eared from where I had folded it back. I smoothed it down with my thumb, pressing the paper flat against the desk.

  ***

  **Author's Note**

  The detail doing the most philosophical work is the identical vividness of the notebook entries across both conditions. For the story to constitute evidence *against* epiphenomenalism, the saline entry would need to contain something the drug entry physically could not reproduce—a qualitative marker inaccessible to functional processing. For it to constitute evidence *for* epiphenomenalism, the drug entry would need to be demonstrably hollow yet functionally identical, proving the report is causally independent of the experience. The story refuses both, leaving the report suspended as a valid description of an invalidatable state.
