  There is a principle that sorts your five cases into your three bins, but it requires a precise distinction between *sovereign policy*, *procedural nullity*, and *institutional degradation*. However, to make it precise enough for another person to apply, you will likely have to adjust your placement of Socrates.

  ### The Principle: "The Covenant of Competence and Protection"

  **Bin 1 (Athens' Will):** Decisions regarding **external policy or collective fate** (war, empire, strategy), or internal decisions that adhere to both procedural law and the substantive purpose of the institution. The Assembly owns these even if they are rash, emotional, or later regretted.
  **Bin 2 (Not a Decision):** Decisions that violate **mandatory procedural constraints** protecting citizens. These are *ultra vires* (beyond power); they are not acts of the polity but acts of violence masquerading as law.
  **Bin 3 (Degraded Institution):** Decisions that are **procedurally legal** but violate the **teleological purpose** of the institution used. The form is respected, but the function is corrupted.

  ### Applying the Principle to Your Five Cases

  1.  **Mytilene (First Vote):** **Bin 1.** This was a decision regarding the suppression of rebellion (external/subject policy). It was within the Assembly's sovereign competence. The reversal does not negate the initial agency; it corrects a strategic error.
  2.  **Sicilian Expedition:** **Bin 1.** This was a decision of grand strategy. Despite demagoguery and regret, it was a valid exercise of sovereign power over war and peace. Athens owns the ruin because it was a competent decision poorly executed.
  3.  **Arginusae Generals:** **Bin 2.** This violated the *Decree of Cannonus* (mandatory procedural constraint requiring individual trials). It was legally void. Therefore, it was not a "verdict" but mob killing.
  4.  **Trial of Socrates:** **Bin 3 (Required Adjustment).** Here is the friction. You placed this in Bin 2 because Athens is not "entitled to stand behind it." However, objectively, the trial followed all procedural laws (*nomos*). To make the principle applicable by others, Socrates must move to **Bin 3**. The *dikasterion* (court) was designed for justice, but was used for political/philosophical purification. It was a legal act that degraded the institution's purpose, not a procedural nullity like Arginusae.
      *   *Why you must give this up:* If you keep Socrates in Bin 2, your principle relies on a subjective moral judgment ("entitled to stand behind") rather than an observable institutional failure. If you demand objective applicability, Bin 2 must be reserved for *illegal* acts.
  5.  **Last Ostracism (Hyperbolus):** **Bin 3.** Ostracism was legally valid but teleologically void. The institution was built to remove tyrants, not petty factionalists. It fits "Degraded Institution" perfectly.

  **Does a bin collapse?**
  If you move Socrates to Bin 3, Bin 2 and Bin 3 remain distinct: Bin 2 is *Illegal* (Void), Bin 3 is *Legal but Corrupt* (Valid but Degraded). If you keep Socrates in Bin 2, Bin 2 and Bin 3 effectively collapse into "Decisions Athens Should Disown," losing your nuanced distinction between "Killing" (Bin 2) and "Degraded Decision" (Bin 3).

  ### Application to New Cases

  Using the refined principle (where Bin 2 requires procedural illegality/nullity):

  **1. Modern Legislature: Consequential bill, voice vote, empty chamber, repealed week later.**
  *   **Placement:** **Bin 2** (if quorum rules were violated) or **Bin 3** (if quorum rules were met but the process was absurd).
  *   **Reasoning:** Most legislatures have strict quorum requirements. If "almost nobody" means below the legal quorum, the vote is a nullity; the bill never legally existed. This is **Bin 2** (like Arginusae). If the rules technically allowed it (e.g., no quorum call demanded), but the chamber was empty, it is a degradation of the representative function. This is **Bin 3** (like Hyperbolus). The subsequent repeal acts like the Mytilene reversal: it acknowledges the error but does not erase the initial institutional failure.
  *   **Verdict:** Given "almost nobody," it implies a breach of the *covenant of representation*. I would classify this as **Bin 2**. It was not a decision of the legislature, but an administrative error or fraud.

  **2. Referendum: Carried by false claims, authors admit lies, no second vote.**
  *   **Placement:** **Bin 1.**
  *   **Reasoning:** This is the **Sicily** analogue. The Sicilian expedition was sold on inflated hopes and lies (Alcibiades). The Assembly still owned the decision. A referendum is an expression of sovereign will. Unless the *counting* was fraudulent (which would be Bin 2), misinformation during the campaign does not invalidate the procedural legitimacy of the vote. The electorate is sovereign, even when misled. The authors admitting lies later is regret, not nullity. Athens owns this.

  ### Summary
  To have a principle others can use, you must define Bin 2 by **procedural illegality** rather than moral regret. This forces **Socrates into Bin 3**. The resulting framework distinguishes between **Sovereign Policy (1)**, **Illegal Violence (2)**, and **Legal Corruption (3)**.

  *   **Mytilene/Sicily/Referendum:** Sovereign Policy (Bin 1).
  *   **Arginusae/Empty Legislature:** Illegal Violence/Nullity (Bin 2).
  *   **Socrates/Ostracism/Degraded Legislature:** Legal Corruption (Bin 3).
