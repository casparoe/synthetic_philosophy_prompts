      *   Recommendation: **Approval Voting**. Why? It's hard to strategize effectively (just vote for what you like), and it's simple to count. Or **Two-Round**. Two-Round is more traditional for clubs. Let's go with **Two-Round**. It separates the "elimination" phase from the "choice" phase, making the strategy visible.
      *   Actually, **Approval Voting** is often cited as resistant to strategy in practice even if not in theory. But for a general reader, a **Runoff** is easier to visualize. Let's suggest a **Two-Round Runoff**. It makes the "car park" scenario impossible (it would have been eliminated in round 1).

  8.  **Writing the Essay (incorporating the constraints):**
