answer: |-
  The story of the car park is the perfect place to begin, because it contains the whole tragedy in miniature. You describe a system that felt elegant, a member who treated his ballot as a move in a game, and a result that satisfied no one. You are right to feel that something fundamental broke there. It was not merely that the wrong option won; it was that the process allowed a voter to succeed by lying, while the honest voters were left with a outcome they did not choose. This is the wound that the Gibbard-Satterthwaite theorem describes, and it is the wound your nephew suggests we simply cover with a bandage of mathematical complexity.

  To answer your question directly: your nephew's reply is a change of subject. It is a clever change of subject, and in certain high-stakes national elections, it might even be a useful one. But for a community sailing club, it is the wrong medicine. The theorem tells us that vulnerability to strategy is an inherent feature of collective choice, like friction in an engine. Your nephew argues that we can make the engine so complex that the driver cannot figure out how to exploit the friction. But an engine that requires a PhD to operate is not a better engine for a community vessel; it is simply one that the crew cannot trust.

  Let us weigh the complexity defense seriously, as you asked. The argument is that while a profitable lie exists, finding it might require more computing power than exists in the universe. If a voter cannot calculate the lie, the lie might as well not exist. In the abstract world of computer science, this is a robust defense. It shifts the goalposts from "is manipulation possible?" to "is manipulation feasible?" There is truth here. If the counting rule is sufficiently obscure, the average member will vote honestly simply because they cannot see the alternative. In this sense, complexity does act as armour.

  However, your own doubts pierce this armour effectively. You noted that a proof of difficulty in the worst case says nothing about the ordinary ballot. This is crucial. Mathematical hardness usually applies to specific, contrived configurations of votes. Real-world elections, especially in a club of two hundred people who know each other, are rarely worst-case scenarios. They are messy, clustered, and often predictable. As you suspected, simple rules of thumb often find profitable lies without anyone solving hard math. If a member knows that the dinghy fleet is the main rival to their preferred scholarships, they do not need a supercomputer to guess that burying the fleet might help. They need only the intuition your strategic member already possessed.

  Furthermore, you raised the point that the instances which resist computation may be precisely the close and consequential ones. This is the thinnest part of the armour. When an election is a landslide, manipulation is unnecessary. When it is a tie, every vote counts, and the incentive to strategize is highest. In close elections, the margins are small, which often makes the mathematical landscape *simpler* to navigate, not harder. A small shift in votes changes the winner, meaning the path to manipulation is shorter. Relying on complexity means your defences are strongest when the stakes are low and weakest when the stakes are high.

  Then there is the issue of asymmetry. You mentioned arguing with your nephew, a software writer. In a club of two hundred, there may be one nephew, or there may be a local university student, or a retired engineer. If the defence of the voting system is its unintelligibility, you have effectively granted veto power to those who can understand it. An organised group with a spreadsheet can manipulate a complex rule while the rest of the membership votes honestly, believing the system protects them. This turns a voting system from a method of aggregating will into a contest of computational resources. For a community club, this is corrosive. It creates a class system of voters: those who know how to play the game, and those who are played by it.

  This leads to your most profound doubt: auditability. A rule whose defence is its obscurity is a rule the membership cannot verify. When the car park won, you had a member confess to the strategy. Imagine if he had not confessed. Imagine if the count had been done by a black-box algorithm that was theoretically manipulable but practically incomprehensible. The result would look the same: a winner nobody wanted. But without the confession, and without the ability to audit the logic, the membership would assume fraud. Trust is the currency of a volunteer organisation. If members suspect the count is rigged, even if it is only rigged by mathematics, they stop participating. They stop paying subscriptions. They stop volunteering. A voting system must not only be fair; it must be seen to be fair. Complexity sacrifices visibility for security, and in a small community, visibility is the higher virtue.

  So, what is the theorem actually for? It is not a practical warning in the sense of a hazard sign on a wet floor. It is a clarification of limits. It tells us that immunity to strategy is simply not among the goods on offer. We cannot have a system that is fair, decisive, and strategy-proof all at once. The real question, which the theorem forces us to ask, is which kinds of vulnerability we prefer and who bears them. Do we prefer a system where manipulation is easy but obvious? Or one where it is hard but invisible? Do we prefer a system that might elect a compromise nobody loves (the car park), or one that might polarise the group? The theorem does not answer this; it merely removes the option of perfection.

  My verdict, therefore, is that computational complexity is not a genuine answer to the theorem for an organisation like yours. It accepts the theorem's premise that manipulation exists, but tries to hide it. Hiding a flaw is not fixing it. For a national government, where ballots are secret and voters are millions, complexity might be a necessary evil to prevent mass coordination. But for a club of two hundred, where members meet at the bar and know each other's boats, transparency is the only viable defence. You cannot out-compute human nature in a small group. You must instead design a system where the honest vote is the safest vote, or where the strategy is so obvious that it carries a social cost.

  This brings us to what you ought to do. You have three or four proposals a year and two hundred members. You need a system that is robust against the "car park" scenario—where a mediocre compromise beats passionate preferences—and robust against the "nephew" scenario—where technical knowledge grants undue influence.

  I advise you to abandon the ranked-choice elimination method you used previously. As you saw, it invites "burying" strategies where voters rank strong rivals last. It also produces winners like the car park that lack genuine support. Instead, you should adopt a **Two-Round Runoff System**.

  Here is how it works concretely. In the first round, members vote for their single favourite proposal. If one proposal receives more than half the votes, it wins immediately. If no proposal reaches a majority, the top two proposals proceed to a second round of voting a week later. The members then vote again on just those two options.

  Why does this follow from my verdict? First, it is transparent. Every member understands that if their favourite doesn't make the top two, they get a second say. There is no need to rank options 1, 2, and 3, which is where the confusion and strategy began in your car park incident. Second, it discourages the specific strategy that hurt you. In your previous election, the member ranked the dinghy fleet last to eliminate it early. In a Two-Round system, ranking the fleet last doesn't help; you simply vote for what you want in round one. If the fleet is popular, it will make the runoff. If it is not, it should not win.

  Third, it prevents the "Condorcet loser" problem. The car park was nobody's first choice. In a Two-Round system, an option that is nobody's first choice will get zero votes in round one and be eliminated immediately. It cannot sneak through via redistributions. Finally, it is auditable. You can count the first round ballots on the table in front of the members. You can announce the top two. You can hold the second vote openly. There is no algorithm to question, no complexity to hide behind.

  Your nephew might argue that even a Two-Round system can be strategized. He is right; a voter might vote tactically in the first round to ensure a weaker opponent makes the runoff. But this strategy is obvious. It is a blunt instrument, not a surgical strike. Because it is obvious, it carries social weight. If a member is caught urging others to vote tactically, it can be discussed and challenged. When the strategy is hidden inside a complex formula, it cannot be challenged.

  The Gibbard-Satterthwaite theorem teaches us that we cannot eliminate the game. But we can choose the playing field. Do not choose a field of fog where only the mathematically gifted can see the lines. Choose a field of open grass where everyone can see the ball. For a sailing club, the wind will always be unpredictable; the rules of the race should not be. Stick to simplicity, prioritise transparency over obscurity, and accept that while you cannot prevent all strategy, you can ensure that when it happens, everyone sees it happening. That is the only protection that preserves the trust required to keep the fleet sailing.
