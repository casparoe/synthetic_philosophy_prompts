answer: |-
  Your reading of the legal doctrine is substantially correct. You have accurately identified the central tension in American antitrust law: the distinction between *conscious parallelism* (legal) and *conspiracy* (illegal), even when the economic outcome is identical. You have also correctly noted the asymmetry regarding monopoly pricing (legal) and invitations to collude (often illegal).

  However, your confusion stems from a category error in applying the "coordination-failure" moral framework to antitrust law. In the literature on Moloch or multipolar traps, coordination is typically a *public good* (e.g., stopping an arms race, reducing pollution). In antitrust, coordination between rivals is a *private good* that creates a *public bad*.

  Here is the reconstruction of the implicit theory, the distinction between normative and evidentiary justifications, and a committed assessment of the law's coherence.

  ### I. The Implicit Theory of Harm and Coordination

  You ask what the practice presupposes. It presupposes that the **process of independent decision-making** is the primary object of protection, not the price level itself.

  **1. The Theory of Harm: Substitution of Governance**
  Antitrust law (specifically Section 1 of the Sherman Act) does not view the market merely as a mechanism for generating low prices; it views it as a system of dispersed information and decentralized power. When competitors agree on price, they are not merely moving a number; they are substituting a private, centralized governance structure for the public, decentralized discipline of the market.
  *   **The Harm:** The harm is not just the transfer of wealth from consumer to producer (which the law tolerates in the case of honest monopoly). The harm is the *suspension of the competitive process*. By agreeing, firms remove the uncertainty that drives innovation and efficiency.
  *   **The "Agreement" Requirement:** This is the boundary line between a firm reacting to the market (legal) and a firm attempting to *control* the market jointly with its rivals (illegal).

  **2. Why Tacit Collusion is Tolerated**
  You note that consumers pay the same fares in both worlds. The law tolerates the tacit version for two reasons, one economic and one administrative:
  *   **Fragility Assumption:** The law assumes that tacit collusion is inherently unstable. Without an enforcement mechanism (the agreement), a rival has an incentive to cheat (cut prices) to gain share. The law bets that the "bad equilibrium" of high prices will naturally decay due to self-interest. Explicit agreements stabilize the cartel, making the harm permanent.
  *   **The Chilling Effect:** If parallel pricing were illegal, firms would be punished for responding to market signals. If Airline A cuts prices and Airline B matches to avoid losing customers, that looks like parallel conduct. Punishing this would force firms to ignore their rivals' prices, which is irrational behavior. The law refuses to mandate irrationality.

  **3. Why Monopoly Pricing is Tolerated**
  This is the other half of your puzzle. If high prices are the harm, why allow a monopolist to charge them?
  *   **Incentive Compatibility:** The law views the *prospect* of monopoly pricing as the reward that drives the innovation that creates the monopoly. Punishing the enjoyment of monopoly power would reduce the incentive to compete for that power in the first place.
  *   **Administrative Competence:** Courts recognize they are ill-equipped to determine the "correct" price. Policing exclusionary *conduct* is something courts can do (did you block a port? did you sign exclusive contracts?). Policing *price levels* requires rate-making, which is a legislative/regulatory function, not a judicial one.

  **4. Why Invitations are Punished**
  An invitation to collude, even if rejected, attacks the *integrity of the process*. It is an attempt to substitute collective judgment for independent judgment. The harm is the threat to the market structure itself, not the immediate price effect.

  ### II. Normative Work vs. Evidentiary Proxy

  Is the demand for an "agreement" doing normative work, or is it just a proxy?

  **It is both, but the normative commitment is foundational.**
  If it were purely evidentiary, the law would allow the prohibition to be waived if the plaintiff could prove high prices through other means (econometrics, market structure). But the Supreme Court has held that without an agreement, there is no Section 1 violation, *even if* the economic effect is indistinguishable from a cartel.

  *   **Normative Reading:** The law enshrines a liberal conception of the firm as a sovereign actor. Just as individuals have a right to make their own choices (even bad ones), firms have a right to set their own prices. They lose that protection only when they surrender their sovereignty to a collective pact. This is about **consent and the integrity of independent decision-making**.
  *   **Evidentiary Reading:** Proving tacit collusion requires distinguishing between "I raised prices because costs went up and you did too" and "I raised prices because I knew you would." This is epistemologically nearly impossible without a smoking gun. The "agreement" requirement is a bright-line rule to prevent false positives that would chill legitimate competition.

  **Vertical Restraints and Monopoly:**
  Are these pieces of one theory? **Yes.** The unifying theory is the **Consumer Welfare Standard** administered through a **Conduct-Based Filter**.
  *   **Horizontal Restraints (Cartels):** Presumed to have no efficiency benefits. Therefore, the process (agreement) is banned *per se*.
  *   **Vertical Restraints:** Often have efficiency benefits (preventing free-riding, ensuring service). Therefore, they are judged by effects (Rule of Reason).
  *   **Unilateral Monopoly:** The conduct (innovation/efficiency) that created it is good. The price is the reward. Only *exclusionary* conduct (which harms the process) is banned.

  The doctrine is not a patchwork of incompatible theories; it is a single theory (protect the competitive process to maximize long-term consumer welfare) applied with different levels of scrutiny based on the likelihood of efficiency justifications.

  ### III. The Equilibrium-Based Hypothetical

  Suppose we replaced the current view with an equilibrium-based one: liability attaches to the supracompetitive outcome regardless of agreement.

  **What would change:**
  1.  **Burden Shifting:** In concentrated markets, the burden would shift to firms to justify their prices. If prices exceed marginal cost by a certain threshold in an oligopoly, the firms must prove they didn't coordinate.
  2.  **Information Barriers:** Firms would have to erect "Chinese walls" not just to prevent collusion, but to prevent *knowledge* of market conditions that might lead to parallel pricing. Public price announcements (common in airlines) might become illegal because they facilitate equilibrium selection.
  3.  **Price Regulation:** The line between antitrust and utility regulation would vanish. Courts would effectively become rate-setting bodies.

  **Would traps be escapable?**
  No. It would make the traps **more expensive to sit inside**.
  *   **Compliance Costs:** Firms would spend immense resources proving their pricing algorithms were independent.
  *   **Reduced Competition:** Firms might avoid entering concentrated markets for fear of being trapped in liability for market outcomes they cannot control.
  *   **Sticky Prices:** Firms would be afraid to raise prices even when costs rise, for fear of triggering an investigation into "supracompetitive" margins.

  ### IV. Committed Assessment

  You asked for a committed assessment of whether the current practice is internally consistent or holding two incompatible theories.

  **The current practice is internally consistent, but your moral ordering is inverted.**

  You are viewing the situation through the lens of **Firm Welfare**. From the firms' perspective, competition is the "Moloch" trap (a race to the bottom on margins) and collusion is the "escape" (coordination to restore profits). If the goal of law were to maximize firm stability, your critique would be devastating.

  But Antitrust Law views the situation through the lens of **Consumer Welfare**. From the consumer's perspective:
  1.  **The "Good" Equilibrium:** Firms compete fiercely, prices drop, margins thin. (This looks like a "trap" to the firms).
  2.  **The "Bad" Equilibrium:** Firms coordinate, prices rise, surplus transfers to shareholders. (This looks like an "escape" to the firms).

  **The Verdict:**
  The law is coherent because it intentionally **enforces the Moloch trap on firms.** It uses the threat of criminal liability to prevent firms from escaping the competitive discipline that harms their profits but benefits the public.

  *   **Why punish the agreement?** Because the agreement is the mechanism by which firms escape the competitive trap.
  *   **Why tolerate tacit collusion?** Because without the agreement, the escape is unstable. The law accepts the risk of temporary tacit collusion to avoid punishing firms for merely existing in an oligopoly.
  *   **Why tolerate monopoly pricing?** Because the *threat* of escaping the trap temporarily (via innovation) is the only thing that motivates firms to run the race in the first place.

  **The Inconsistency You Sense:**
  The only genuine inconsistency is the **Oligopoly Problem**. The law admits that a market can become so concentrated that firms *will* charge supracompetitive prices without speaking. By refusing to police this (because there is no agreement), the law admits a gap where the "bad equilibrium" persists without a remedy.

  However, this is not a theoretical incoherence; it is a **pragmatic concession**. The law chooses to tolerate the *outcome* of oligopoly rather than risk the *process* error of punishing independent pricing. It prioritizes **false negatives** (letting some tacit collusion slide) over **false positives** (punishing normal competition).

  **Conclusion:**
  Your reading of the coordination literature leads you to value coordination as a solution to social dilemmas. Antitrust law values coordination between rivals as the *cause* of social dilemmas. The law is not confused; it is adversarial to the interests of the coordinating firms. It is designed to ensure that the "race to the bottom" on price remains the dominant equilibrium. The requirement of an "agreement" is the firewall that keeps the market's disciplinary pressure on firms, distinguishing between those who succumb to market forces (legal) and those who conspire to resist them (illegal).

  The practice is consistent. It holds one theory: **The market process is sacred; the market outcome is secondary.** It punishes the subversion of the process (agreement) while tolerating the imperfections of the outcome (oligopoly pricing/monopoly rewards) because the alternative—policing outcomes—requires a level of state control over the economy that the law rejects as more harmful than the collusion it would prevent.
