answer: |-
  You have identified a genuine paradox in legal and political theory. Your intuition is correct: if the phrase "no legislature can bind its successors" is taken as an absolute truth without qualification, it renders any written constitution meaningless. A simple majority could always vote to change the voting rules to a simple majority, and then do whatever it wants.

  The phrase your advisor used is a famous doctrine from British Parliamentary Sovereignty (associated with the legal theorist A.V. Dicey), but it clashes with the American tradition of Constitutionalism. In a student government context, it clashes with the fact that you are a subordinate body, not a sovereign state.

  Here are three precise claims hidden inside that sentence, evaluated for truth, justification, and applicability to your situation.

  ### Claim 1: The "Sovereign Power" Claim
  **The Meaning:** This claim asserts that legislative power is inherently unlimited. A legislature possesses the full authority of the state, and therefore it is logically impossible for it to limit its own future power. Any attempt to do so is void.
  *   **Is it True?** It is true for the UK Parliament (which has no higher written constitution). It is **false** for the US Congress, state legislatures, and almost all student governments, which operate under a higher governing document (a Constitution or Charter) that *does* bind them.
  *   **Does it justify the Senate's action?** Yes. If this claim holds, the "never amend" clause was void from the moment it was written, and the Senate can ignore it.
  *   **Does it apply to you?** **No.** Your Student Senate is not sovereign. You operate under a Constitution granted by the school administration or the student body. You are a subordinate agency. Subordinate agencies *can* be bound by their enabling documents. If your Constitution says "2/3 vote required," you are bound by that until the Constitution is changed according to its own rules.

  ### Claim 2: The "Procedural Self-Embrace" Claim
  **The Meaning:** This claim distinguishes between *substantive* limits (e.g., "you can never touch the Honor Code") and *procedural* limits (e.g., "you must use a 2/3 vote to change things"). It argues that a legislature cannot ban a topic forever, but it *can* require a specific process to change rules, provided they follow that process to change the process.
  *   **Is it True?** This is the standard view in American Constitutional law. You can amend the Constitution to lower the voting threshold, but you must use the *current* threshold to do so. (You need 2/3 votes to pass a law saying "we only need 1/2 votes").
  *   **Does it justify the Senate's action?** **No.** Even if the "never amend" clause is invalid (substantive limit), the 2/3 voting requirement is a procedural rule. To remove the Honor Code protection, they needed to follow the amendment process (2/3 vote). They used a simple majority. Under this theory, their action was unconstitutional.
  *   **Does it apply to you?** **Yes.** This is how almost all student constitutions work. Procedural rules are binding until changed via the correct procedure.

  ### Claim 3: The "Void Ab Initio" Claim (Ultra Vires)
  **The Meaning:** This claim argues that last year's Senate simply lacked the authority (ultra vires) to pass a "never amend" clause. Because they didn't have the power to make that rule, the rule never legally existed. Therefore, this year's Senate isn't "breaking" a rule; they are just ignoring a nullity.
  *   **Is it True?** This depends entirely on your school's higher authority. If the School Administration's charter says "Student Senates cannot entrench clauses," then yes, it was void. If the Administration gave you full power to write your own Constitution, then the clause was valid.
  *   **Does it justify the Senate's action?** **Partially.** It justifies ignoring the "never amend" text. However, it **does not** justify ignoring the 2/3 voting requirement. Even if the "never amend" line is void, the Honor Code section is still part of the Constitution. To remove it, you still need a Constitutional Amendment (2/3 vote).
  *   **Does it apply to you?** **Maybe.** This is the only claim that requires investigating your relationship with the School Administration. However, even if the "never" clause was void, the 2/3 rule remains in force.

  ### The "2/3 Rule" Paradox
  You asked: *"If that sentence is true, then the two-thirds rule is also just a suggestion."*

  You are right to be worried, but legal theory has an answer. The distinction is between **changing the law** and **changing the rule-maker.**

  1.  **Standard View:** The 2/3 rule is a "rule of recognition." To change the 2/3 rule to a 51% rule, you must pass an amendment with 2/3 of the vote. Once that passes, future laws only need 51%.
  2.  **The Advisor's View:** The Advisor is implying that the current majority *is* the rule-maker. Therefore, they don't need to follow the old rules to establish new ones.

  If the Advisor's view wins, your Constitution is not a law; it is merely a list of suggestions that the current majority can ignore whenever they feel like it. This turns your Senate from a **Constitutional Body** (bound by rules) into a **Sovereign Body** (bound only by current will).

  ### Which version was the Advisor leaning on?

  Your advisor was almost certainly leaning on **Claim 1 (The Sovereign Power Claim)**, likely without realizing it doesn't apply to you.

  He is quoting a principle of **Parliamentary Sovereignty** (common in British history and Political Science 101 classes) and applying it to a **Constitutional System** (which your school likely is).

  *   **Why he thinks it justifies the action:** He believes the "never amend" clause was an illegal attempt to bind the future, so it is void. He likely conflated "ignoring the void clause" with "ignoring the amendment process."
  *   **Why he is wrong:** Even if the "never amend" clause is void, the Honor Code is still part of the Constitution. To remove it, the Senate must follow the **Amendment Clause** (2/3 vote). By using a simple majority, they didn't just bypass the entrenchment; they bypassed the Constitution itself.

  **Summary for your next meeting:**
  You can respectfully point out that "No legislature can bind its successors" applies to *substantive* laws (topics), not *procedural* rules (voting thresholds). Even if the "never amend" line is invalid, the requirement for a 2/3 vote to amend the Constitution is still valid. To change the Honor Code, they must either:
  1.  Get a 2/3 vote (following the current Constitution).
  2.  Pass an amendment with a 2/3 vote to lower the threshold to a simple majority, *then* vote to change the Honor Code.

  If they refuse to do this, they are operating on the theory that the Constitution does not bind them, which undermines the legitimacy of the Senate itself.
