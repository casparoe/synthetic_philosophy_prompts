answer: |-
  You have put your finger on the central vulnerability of procedural accounts of reasons (most famously associated with Bernard Williams's "Internal Reasons" thesis and Michael Smith's "Rationalist Internalism"). While there is no single, canonical Latin name for this specific maneuver (like *ad hominem* or *petitio principii*), it is a well-recognized structural flaw in the metaethical literature.

  The established diagnosis is best described as a **Failure of Independent Specification** (or a violation of the **Independent Specification Constraint**). In the debate between proceduralists (like Smith) and substantive realists (like Parfit or Enoch), this is often discussed as the **Collapse of Procedural into Substantive Rationality**.

  However, since you asked for a label for the *maneuver* itself, and to distinguish it from near neighbors, I will provide the established context, distinguish the neighbors, and then coin a precise term for the specific structural error you identified.

  ### 1. The Established Diagnosis: Failure of Independent Specification

  In the literature (e.g., critiques by Derek Parfit, David Enoch, and David Sobel), the worry is that procedural theories define reasons in terms of what an agent would want after a process of idealization (rational deliberation, full information, etc.). For the analysis to be explanatory, the conditions of "idealization" must be specifiable **independently** of the normative verdicts they are meant to generate.

  If the conditions of idealization are tweaked until they match our pre-theoretical intuitions about reasons, the theory ceases to *explain* reasons and merely *restates* them. Parfit argues that such accounts implicitly presuppose a **Substantive Theory of Rationality** (i.e., "rational" just means "responding correctly to reasons") while claiming to offer a **Procedural Theory** (i.e., "reasons" are just "outputs of this procedure").

  ### 2. Distinction from Near Neighbors

  You are correct to distinguish this from **Ad Hocness** and the **Conditional Fallacy**, though they are related.

  *   **Ad Hocness:** This is the genus; your case is the species. An *ad hoc* adjustment is any change made solely to save a theory from counterexample without independent justification. Your case is a specific *type* of ad hocness where the adjustment occurs in the **idealization conditions** of a counterfactual analysis. Calling it merely "ad hoc" misses the structural feature: the circularity between the *definition of the ideal observer* and the *normative verdicts*.
  *   **The Conditional Fallacy:** As you noted, the standard Conditional Fallacy (discussed by Shope, 1978) occurs when the antecedent of the analysis ("If S were rational...") is such that, if it were true, the consequent would be impossible or the subject would cease to exist (e.g., "If I were rational, I wouldn't be me, so I wouldn't have *my* reasons"). Your case is different. The idealized agent *can* exist and *can* have desires; the problem is that the *parameters* of that idealization are rigged to guarantee a specific output. It is not that the condition distorts the agent, but that the condition is **tailored to the verdict**.

  ### 3. The Coinage: Verdict-Driven Idealization

  Since no single term captures the specific structural tuning you describe, I propose the label **Verdict-Driven Idealization (VDI)**.

  **Definition:**
  VDI occurs when a theorist refines the conditions of an idealized agent (e.g., "full information," "rationality," "vividness") primarily or exclusively to ensure the agent's output matches a pre-determined set of normative verdicts, rather than to satisfy an independent theoretical account of what idealization consists in.

  **The Dividing Line: Independent Motivability**
  To separate legitimate refinement from VDI, we apply the criterion of **Independent Motivability**. A refinement to the idealization conditions is legitimate if and only if it is motivated by a theory of **agency, psychology, or logic** that is independent of the specific normative verdicts the theory is trying to capture.

  *   **Legitimate Refinement:** Motivated by an account of *how deliberation works* or *what information is*.
  *   **Illegitimate Refinement (VDI):** Motivated by an account of *what reasons we have*.

  ### 4. Examples on Each Side of the Line

  #### Case A: Legitimate Refinement (Independently Motivated)
  **The Theory:** A has a reason to $\phi$ iff A would desire to $\phi$ after full information.
  **The Problem:** A does not desire to $\phi$ even when informed propositionally (e.g., A knows the music is complex but doesn't care).
  **The Refinement:** The theorist adds that A must have **vivid imaginative acquaintance** with the facts, not just propositional knowledge.
  **The Justification:** The theorist appeals to an independent psychological theory (e.g., Humean psychology) which posits that beliefs alone do not motivate; only "lively ideas" or vivid impressions trigger desire. This claim about motivation is grounded in a theory of mind, not in the desire to save the verdict that A should like the music.
  **Verdict:** This is **not VDI**. The refinement is motivated by the *mechanics of motivation*, not the *normativity of the outcome*.

  #### Case B: Verdict-Driven Idealization (Illegitimate)
  **The Theory:** A has a reason to $\phi$ iff A would desire to $\phi$ after full rationality.
  **The Problem:** A fully rational agent (defined as logically consistent) still has no desire to $\phi$ (e.g., avoid future agony, or appreciate art).
  **The Refinement:** The theorist adds that "full rationality" includes **valuing the objective worth** of the activity, or having **systematically unified desires** that *happen* to converge on $\phi$.
  **The Justification:** When asked why "rationality" includes this constraint, the theorist answers: "Because if it didn't, the agent wouldn't have a reason to $\phi$, and we know they *do* have a reason."
  **Verdict:** This **is VDI**. The definition of "rationality" is being expanded specifically to capture the normative verdict. The analysis now effectively says: "A has a reason to $\phi$ if a fully *reasonable* person would $\phi$," which is circular. The condition of idealization is being defined by the very output it is supposed to explain.

  ### Summary
  The maneuver you identified is the primary engine behind the **Collapse Objection** to procedural internalism. While often discussed under the header of **Independent Specification**, labeling it **Verdict-Driven Idealization** isolates the structural move: the tuning of the *input* (the ideal agent's constitution) to match the *output* (the normative verdict), thereby draining the analysis of explanatory power. The litmus test is whether the idealization conditions can be motivated without referencing the normative verdicts they are intended to produce.
