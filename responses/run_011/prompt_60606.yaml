prompt: |-
  Our series is built on time travel, and I'm the continuity coordinator who has to answer the writers before a pitch turns into a draft. I get two or three of these a week. A wrong yes costs us a rewrite six weeks later; a wrong no costs us a good story. The showrunner signs off on everything, so my note has to be something she can veto in one line, and the writers have no philosophy training — they argue in terms of "can you change the past or not."

  Our canon is fixed and not open for renegotiation: the past can be changed; when it changes, only the protagonist remembers the previous version; and whatever he is holding at the moment of change comes through with him.

  Write me a procedure I can run on a pitch in about thirty minutes: the questions to ask in order, what counts as a sufficient answer to each, and which verdict each branch ends in — clear, clear with a condition attached, needs rewrite, or not a logic problem at all but a creative call I hand up to the showrunner. Draw on whatever the philosophy and physics of time travel actually has that survives contact with a writers' room, and tell me which distinctions you are keeping, which you are dropping as unusable on a shooting schedule, and where my own judgment is doing the work while looking like a rule.

  Then run it on three pitches we keep circling back to:

  (a) a character travels back, meets his mentor as a young man, and hands him the technique that the mentor is shown teaching him in season one;

  (b) the protagonist prevents his parents from ever meeting, and we cut to him in the present, unchanged and still remembering, standing in the house he grew up in;

  (c) a traveler kills the antagonist as a child in 1994, in a season whose present-day scenes — already shot — treat the antagonist as alive and working until last month.

  Be honest about where the procedure will misfire: the pitches it waves through that it shouldn't, and the ones it kills for the wrong reason. I want one procedure you would stand behind, with your reasons for the calls it makes, not a survey of what each theory of time travel would say about our show.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Analyze the Request:**
      *   **Role:** Continuity Coordinator for a time travel TV series.
      *   **Task:** Create a 30-minute procedure to evaluate writer pitches against established canon.
      *   **Canon Rules:**
          1.  Past *can* be changed.
          2.  Only the protagonist remembers the previous version (single mutable timeline + observer immunity).
          3.  Objects held by the protagonist at the moment of change persist through the change.
      *   **Constraints:** Writers have no philosophy training (keep it simple). Showrunner needs a one-line veto option. High stakes (wrong yes = rewrite later; wrong no = lost story).
      *   **Deliverables:**
          1.  The Procedure (Questions, Sufficient Answers, Verdicts).
          2.  Philosophical/Physics grounding (what's kept, what's dropped).
          3.  Application to three specific pitches (a, b, c).
          4.  Honest assessment of where the procedure misfires.
      *   **Tone:** Professional, pragmatic, authoritative, honest about limitations.

  2.  **Deconstruct the Canon:**
      *   *Rule 1 (Mutable Past):* This rejects the Novikov Self-Consistency Principle (Fixed Timeline). We are in a "Dynamic Timeline" or "Plastic Time" model.
      *   *Rule 2 (Protagonist Memory):* This is the "Retcon Immunity" or "Observer Anchor." It solves the Grandfather Paradox by allowing the traveler to exist even if their origin is erased.
      *   *Rule 3 (Held Objects):* This is a specific material continuity rule. It prevents "poofing" clothes/items but limits external artifacts.

  3.  **Develop the Procedure (The "30-Minute Filter"):**
      *   *Goal:* Filter logic errors from creative choices.
      *   *Step 1: The Trigger.* What causes the change? Needs to be an action by the traveler.
      *   *Step 2: The Ripple.* What changes in the timeline? Needs to be consistent with the action.
      *   *Step 3: The Anchor.* Does the protagonist survive the change? (Canon Rule 2).
      *   *Step 4: The Cargo.* What objects come through? (Canon Rule 3).
      *   *Step 5: The Echo.* Are there other people who remember? (Must be No, except Protagonist).
      *   *Verdicts:* Clear, Clear w/ Condition, Needs Rewrite, Creative Call.

  4.  **Philosophical/Physics Grounding:**
      *   *Keep:* Causality (Action -> Effect), Identity (Psychological Continuity for the protagonist), Material Conservation (for held objects).
      *   *Drop:* Multiverse theory (too complex for this canon), Predestination Paradoxes (canon says past *can* change), Thermodynamic costs of rewriting reality (too sci-fi heavy for TV drama).
      *   *Judgment vs. Rule:* The "Ripple" effect is where judgment hides. How *much* should change? That's a creative call, but the *fact* of change is a logic rule.

  5.  **Apply to Pitches:**

      *   *Pitch (a): Mentor Loop.*
          *   Traveler gives technique to Young Mentor -> Mentor teaches Traveler in S1.
          *   *Issue:* This looks like a Closed Loop (Novikov). But canon says Past *Changes*.
          *   *Analysis:* If the traveler gives the technique, the timeline changes. In the *new* timeline, does the Mentor still teach it? Yes. But where did the Mentor get it originally? In the *old* timeline, the Mentor invented it. In the *new* timeline, the Traveler gave it.
          *   *Conflict:* The protagonist remembers the old way (Mentor invented it). The world sees the new way (Traveler gave it).
          *   *Verdict:* Clear with Condition (Must clarify the memory discrepancy). Actually, wait. If the protagonist remembers the *previous version*, he remembers the Mentor inventing it. Now the Mentor didn't invent it. This works within canon.
          *   *Refinement:* Is it a logic problem? No, it's a bootstrap paradox. But our canon allows changes. The risk is the *origin* of the technique. If the technique only exists because he went back, it's a loop. If he learned it in S1 (Old Timeline) and took it back (New Timeline), it's a change.
          *   *Decision:* Clear. It fits the "Mutable Past" rule.

      *   *Pitch (b): Parents Never Meet.*
          *   Protagonist prevents meeting -> Cut to him in present, unchanged, in his house.
          *   *Issue:* If parents never met, he shouldn't exist.
          *   *Canon Check:* Rule 2 says "Only the protagonist remembers...". It implies he *survives* the change (Observer Immunity).
          *   *House Check:* If parents never met, they didn't buy the house. Why is he in the house?
          *   *Verdict:* Needs Rewrite. The *house* is external context. He survives (Rule 2), but his environment should reflect the change (parents didn't buy house). Unless he held the *house*? No.
          *   *Nuance:* Is the house a "held object"? No. So the house shouldn't exist as *his* childhood home.
          *   *Decision:* Needs Rewrite (Environment contradiction).

      *   *Pitch (c): Kill Antagonist in 1994.*
          *   Kill Antagonist -> Present day scenes (already shot) show Antagonist alive.
          *   *Issue:* Production reality vs. Narrative logic.
          *   *Canon Check:* Rule 1 says Past *can* be changed. So Antagonist should be dead/never existed in new present.
          *   *Production Check:* Scenes are *already shot*. We cannot reshoot.
          *   *Verdict:* Creative Call / Production Constraint. Logically, within canon, the Antagonist should be gone. Practically, we can't show that.
          *   *Decision:* Hand to Showrunner. This is a budget/schedule issue disguised as a logic issue.

  6.  **Refining the Procedure (Self-Correction):**
      *   Make sure the questions are binary where possible.
      *   Ensure the "Creative Call" bucket is used for things that aren't *logic* violations but *story* risks.
      *   Clarify the "Held Object" rule. It's specific.
      *   *Correction on Pitch A:* This is the Bootstrap Paradox. Does our canon allow information to have no origin? Rule 1 says "Past can be changed." If he changes it, the origin changes. In Timeline 1, Mentor invented it. In Timeline 2, Traveler brought it. This is valid.
      *   *Correction on Pitch B:* The "Grandfather Paradox" is explicitly solved by Rule 2 (Protagonist remains). The issue is the *house*. If parents never met, the financial trajectory changes. The house shouldn't be there. This is a logic error regarding the *extent* of the ripple.
      *   *Correction on Pitch C:* This is a "Fixed Future" production constraint vs. "Mutable Past" narrative rule. It's a conflict between Canon and Reality.

  7.  **Drafting the Response:**
      *   *Introduction:* Acknowledge the pressure and the specific canon constraints.
      *   *The Procedure:* Step-by-step flowchart style.
      *   *Philosophy/Physics:* Explain *why* this works (Lewis vs. Grandfather, etc., simplified).
      *   *The Pitches:* Apply the procedure rigorously.
      *   *The Misfire Analysis:* Be honest about edge cases (e.g., butterfly effect scope).

  8.  **Final Polish:**
      *   Check tone: Is it authoritative but helpful?
      *   Check constraints: 30 minutes? Yes, the questions are fast.
      *   Check Showrunner veto: Ensure the "Creative Call" verdict allows for that one-line override.
      *   *Crucial Check:* The prompt asks for *one* procedure I stand behind. Don't waffle.
      *   *Philosophy Note:* I need to explicitly state what I'm borrowing from philosophy (e.g., Psychological Continuity) and what I'm ignoring (e.g., Thermodynamic entropy of time travel).

      *(Self-Correction during drafting Pitch A)*: Wait, if the protagonist hands the mentor the technique, and the protagonist remembers the *previous version* (where the mentor taught him), does the protagonist remember learning it from the mentor *before* he went back? Yes. So in his memory, Mentor invented it. In reality, Traveler gave it. This creates a divergence. This is allowed.
      *(Self-Correction during drafting Pitch B)*: The prompt says "standing in the house he grew up in." If parents never met, he didn't grow up there. But Rule 2 says *he* is unchanged. Does "unchanged" include his location? Rule 3 says "whatever he is holding... comes through." It implies everything *else* updates. So the house should update. If the house is the same, the timeline didn't change enough. Verdict: Needs Rewrite.
      *(Self-Correction during drafting Pitch C)*: The scenes are *already shot*. This is a production constraint. The procedure must flag this as "Creative Call" because logic says "Antagonist dead," production says "Antagonist alive." The Showrunner decides if we explain it away (clone? twin?) or ignore the logic hole for budget.

      *Final check on the "Procedure" structure:* Needs to be actionable.
      1. Action?
      2. Ripple?
      3. Anchor?
      4. Cargo?
      5. Production Lock?

      Let's write it.

      *Wait, one more thing:* The prompt asks "where my own judgment is doing the work while looking like a rule." I need to highlight this. Usually, this is in defining the "Ripple." How big is the change? That's subjective. I will codify that as "Proportional Causality."

      *Final Plan:*
      1.  **The Protocol:** 5 Questions.
      2.  **The Philosophy:** What we keep (Causality, Identity), what we drop (Multiverse, Entropy).
      3.  **The Application:** A, B, C.
      4.  **The Misfire:** Where the protocol fails (Butterfly Effect vagueness, Production vs. Canon).

      Let's go.cw
answer: |-
  # The Continuity Protocol (30-Minute Filter)

  This procedure is designed to enforce our three canonical rules without requiring writers to understand temporal metaphysics. It treats time travel as a **transaction**: an input (traveler action), a processing error (timeline rewrite), and an output (new present with exceptions).

  ### The Five Questions

  Ask these in order. If the writer cannot answer, the pitch is **Needs Rewrite**. If they answer, map the response to the Verdict.

  **1. The Trigger:** What specific physical action does the traveler take in the past that differs from the original history?
  *   *Sufficient Answer:* A concrete verb (e.g., "Hands over a blueprint," "Shoots the father," "Blocks the intersection"). Vague intentions ("Inspires him") are insufficient.
  *   *Verdict:* If no specific action, **Needs Rewrite**.

  **2. The Ripple:** What is the direct consequence of that action in the new timeline?
  *   *Sufficient Answer:* A logical causal chain (e.g., "Mentor has the tech early," "Parents don't meet," "Antagonist dies in 1994").
  *   *Verdict:* If the consequence contradicts known physics or logic (e.g., "Parents don't meet but he is still born naturally"), **Needs Rewrite**.

  **3. The Anchor:** Does the protagonist still exist in the new present, and do they remember the old timeline?
  *   *Sufficient Answer:* Yes. (This is Canon Rule #2).
  *   *Verdict:* If the protagonist vanishes or forgets, **Needs Rewrite**. If other characters remember the old timeline, **Needs Rewrite**.

  **4. The Cargo:** Is the protagonist holding any physical object at the moment of the timeline shift that shouldn't exist in the new version?
  *   *Sufficient Answer:* List the items. (This is Canon Rule #3).
  *   *Verdict:* If external objects (clothes on a rack, a car in the garage) persist without being held, **Clear with Condition** (must be held or on person). If no objects, **Clear**.

  **5. The Lock:** Does this change contradict footage already shot or locked scripts for episodes airing *after* this change takes effect?
  *   *Sufficient Answer:* Yes or No.
  *   *Verdict:* If Yes, **Creative Call** (Hand to Showrunner). If No, **Clear**.

  ***

  ### Philosophical & Physics Grounding

  To make this stick, you need to know what you are enforcing and what you are ignoring.

  **What You Are Keeping (The Rules):**
  *   **Psychological Continuity (Locke):** We are keeping the philosophy that *you* are your memories. This justifies Canon Rule #2. The protagonist is the same person even if their history is erased, because their consciousness persists.
  *   **Causal Determinism (Newtonian):** We are keeping simple cause-and-effect. If you remove a brick, the wall falls. This justifies Question #2. We reject "magic" changes where actions have no consequences.
  *   **Material Conservation (Thermodynamics):** We are keeping the idea that matter cannot be created/destroyed easily. This justifies Canon Rule #3 (The Cargo). Objects only survive if they are "anchored" to the traveler (held).

  **What You Are Dropping (The Noise):**
  *   **The Multiverse (Everett):** We are not dealing with branching realities. There is only one timeline that gets overwritten. Do not let writers argue about "alternate dimensions."
  *   **The Butterfly Effect (Chaos Theory):** We are dropping the idea that stepping on a bug destroys the future. We only care about *direct* ripples. If a writer argues "But if he buys a coffee, the stock market crashes," shut it down. That is a creative choice, not a logic error.
  *   **Predestination (Novikov):** We are explicitly rejecting the idea that the past *must* happen as it did. Canon Rule #1 says the past *changes*. Do not let writers argue that "it was always meant to happen."

  **Where Your Judgment Hides:**
  Question #2 (The Ripple) looks like a rule, but it is where your judgment does the work. You decide if the ripple is "sufficient." If a writer says, "He kills the antagonist's dog," and the pitch is "The antagonist becomes a monk," you will flag that as **Needs Rewrite** not because of physics, but because the causality is weak. You are enforcing *narrative* logic under the guise of *temporal* logic.

  ***

  ### Application to Current Pitches

  Here is how the protocol runs on the three pitches circling the room.

  #### Pitch (a): The Mentor Loop
  *   **Pitch:** Traveler goes back, gives Mentor the technique. Mentor teaches Traveler in S1.
  *   **Run:**
      1.  *Trigger:* Hands over technique. (Pass)
      2.  *Ripple:* Mentor has technique earlier/origin changed. (Pass)
      3.  *Anchor:* Protagonist remembers learning it originally (Mentor invented it). New timeline: Mentor was given it. (Pass - fits Canon Rule #2).
      4.  *Cargo:* None specified. (Pass)
      5.  *Lock:* No production conflict. (Pass)
  *   **Verdict:** **Clear.**
  *   **Reasoning:** This is a Bootstrap Paradox, but our canon allows mutable timelines. In Timeline A, Mentor invented it. In Timeline B, Traveler brought it. The Protagonist remembers A, lives in B. This is logically consistent with our specific rules.

  #### Pitch (b): The Parents' Erasure
  *   **Pitch:** Protagonist prevents parents meeting. Cuts to him in present, unchanged, in the house he grew up in.
  *   **Run:**
      1.  *Trigger:* Prevents meeting. (Pass)
      2.  *Ripple:* Parents never marry, never buy house. (Pass)
      3.  *Anchor:* Protagonist exists and remembers. (Pass - fits Canon Rule #2).
      4.  *Cargo:* He is standing in the *house*. Was he holding the house? No. (Fail).
      5.  *Lock:* N/A.
  *   **Verdict:** **Needs Rewrite.**
  *   **Reasoning:** Canon Rule #3 states only what he is *holding* comes through. The house is part of the timeline. If the parents never met, the financial trajectory that bought the house never happened. The house should not exist, or should belong to strangers. He can survive (Rule #2), but his environment must update to reflect the new history.

  #### Pitch (c): The Dead Antagonist
  *   **Pitch:** Traveler kills Antagonist in 1994. Present-day scenes (already shot) show Antagonist alive.
  *   **Run:**
      1.  *Trigger:* Kills Antagonist. (Pass)
      2.  *Ripple:* Antagonist dead in 1994. (Pass)
      3.  *Anchor:* Protagonist exists. (Pass)
      4.  *Cargo:* N/A. (Pass)
      5.  *Lock:* **Yes.** Present-day scenes already shot show Antagonist alive. (Fail).
  *   **Verdict:** **Creative Call (Hand to Showrunner).**
  *   **Reasoning:** Logically, within canon, the Antagonist should be dead. Practically, we cannot reshoot. This is a budget/schedule constraint masquerading as a logic problem. The Showrunner must decide: Do we explain the Antagonist away (twin? clone?) or do we break Canon Rule #1 for this instance? This is not for you to solve.

  ***

  ### Honest Assessment: Where This Procedure Misfires

  You asked for honesty about the failures. No procedure is perfect. Here is where this filter will let bad ideas through or kill good ones.

  **1. The "Ripple" Blind Spot (False Negative)**
  *   *The Misfire:* The protocol will wave through pitches where the causal chain is technically correct but narratively absurd.
  *   *Example:* A writer pitches: "Traveler kills Hitler." Verdict: **Clear.** (Trigger, Ripple, Anchor, Cargo, Lock all pass).
  *   *The Problem:* This destroys the show's premise (WWII happened, our show is set in post-war). The protocol checks *internal* logic, not *franchise* logic.
  *   *Your Fix:* You must add a silent "Step 0": *Does this change break the show's setting?* If yes, veto immediately, regardless of the procedure.

  **2. The "Held Object" Loophole (False Positive)**
  *   *The Misfire:* Writers will exploit Canon Rule #3 to smuggle in impossible tech.
  *   *Example:* "He holds a briefcase containing a nuclear bomb." Verdict: **Clear.**
  *   *The Problem:* If the timeline changes so that nuclear fission wasn't discovered, the bomb shouldn't work. But Rule #3 says the object comes through. The protocol validates the *existence* of the bomb, but not its *functionality* in the new physics.
  *   *Your Fix:* Add a condition to Question #4: *Does the object rely on the timeline for functionality?* If yes, flag as **Clear with Condition** (must address functionality).

  **3. The Production Lock Trap (False Negative)**
  *   *The Misfire:* Pitch (c) gets flagged as **Creative Call**, which slows things down.
  *   *The Problem:* Sometimes, the Showrunner *wants* you to be the bad guy. They want a "Logic No" so they can tell the producer "Continuity said it's impossible." By handing it up as a Creative Call, you remove their cover.
  *   *Your Fix:* For Pitch (c), if the cost to fix is high, mark it **Needs Rewrite** with a note: *"Contradicts locked footage. Requires explanation (clone/dream) or reshoot."* This gives the Showrunner the "Logic No" they can use as leverage, even if the *real* issue is money.

  **4. The Memory Burden (The Hidden Cost)**
  *   *The Misfire:* The protocol assumes the protagonist can carry infinite memories.
  *   *The Problem:* If we change the timeline five times, the protagonist remembers five contradictory versions of breakfast. The protocol says **Clear**, but the actor cannot play "five layers of grief."
  *   *Your Fix:* This is a **Creative Call**. If a pitch requires the protagonist to remember more than two contradictory versions of a major event, flag it. It's not a logic error, it's a performance error.

  ### Summary for the Showrunner
  When you send your note, use this format to ensure the one-line veto works:

  > **Verdict:** [Clear / Clear w/ Condition / Needs Rewrite / Creative Call]
  > **Logic Check:** [Pass/Fail] based on Canon Rules 1-3.
  > **Production Check:** [Pass/Fail] based on Locked Scripts/Footage.
  > **Recommendation:** [One sentence on the risk].

  This protects you. If you say **Clear** and it breaks later, you can prove the Logic Check passed. If you say **Needs Rewrite**, you point to the specific Canon Rule violated. If you say **Creative Call**, you have explicitly told the Showrunner the cost is on their head.
