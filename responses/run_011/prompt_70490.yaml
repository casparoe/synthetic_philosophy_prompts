      *   **The Claims:**
          1.  Nigeria National Commission for Museums and Monuments (NCMM): Wants title transfer. Offers reciprocal loan of contemporary Edo work.
          2.  Local Association (Descendants of Guild): Wants title transfer to them (to hold in Benin City, not national museum). Argues state centralization repeats colonial harm. NCMM rejects their standing.
      *   **Complications:** Regional newspaper records request. Touring exhibition scheduled for autumn. Trustees want to wait for "sector-wide agreement" (expected never to come). Director delayed informing board of 2nd claim.
