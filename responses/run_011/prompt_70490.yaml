answer: |-
  **MEMORANDUM**

  **TO:** The Board of Trustees
  **FROM:** [Your Name], External Trustee
  **DATE:** [Current Date]
  **SUBJECT:** Recommendation regarding the Benin Plaque and Competing Claims

  **1. Purpose and Context**

  At next month's meeting, the Board must decide the disposition of the Benin Brass Plaque (Accession No. 1953.X). We face two formal claims: one from the Nigerian National Commission for Museums and Monuments (NCMM) requesting title transfer, and one from a local association of guild descendants requesting title transfer to their custody in Benin City. We also face a legal constraint: the 1953 Deed of Gift prohibits alienation, and counsel advises that violating this exposes trustees to personal liability.

  We cannot maintain the status quo. The plaque is scheduled for an autumn tour, and a regional newspaper has requested the accession file. "Waiting for a sector-wide agreement" is a deferral that amounts to a decision to retain the object by default. This memo outlines the ethical and legal reasoning required to vote, and concludes with a specific recommendation.

  **2. The Legal Constraint: The 1953 Deed of Gift**

  We must state plainly what the 1953 condition means. It is enforceable. If we transfer title without a court order, we breach the law and assume personal financial risk. However, the Deed is not a moral shield; it is a legal hurdle. The Board cannot vote to break the law, but it can vote to seek the legal authority to do what is ethically necessary.

  Therefore, any recommendation to transfer title must include an immediate instruction to counsel to apply to the competent court for a scheme of arrangement or cy-près order to modify the 1953 restriction. We cannot treat the Deed as a veto, but we must treat it as a procedure.

  **3. Ethical Reasoning**

  To vote, we must answer three questions that go to the heart of our mandate.

  *First, is the wrong completed or ongoing?*
  Some argue the theft occurred in 1897 and the 1924 purchase was in good faith; therefore, our possession is neutral. This is incorrect. The wrong is not merely the moment of taking; it is the continued exclusion of the source community from their heritage. Each year we retain the plaque, we validate the 1897 expedition as a legitimate means of acquisition. Our good faith in 1924 cures our guilt, but it does not cure the object's status. Retention is not a passive state; it is an active choice to prioritize our display over the source community's restitution. If the wrong is ongoing, our duty is to cease it.

  *Second, does "holding in trust for the public" require retention?*
  We often argue that we hold objects for the public good. But "the public" is not limited to the taxpayers of this city. In an ethnographic collection, the primary public includes the descendants of the creators. To claim we hold this plaque for the "public" while denying access to the community for whom it holds ancestral and ritual significance is to use the concept of public trust as a pretext for possession. We serve the public best by modeling ethical stewardship, not by clinging to contested property.

  *Third, how do we choose between the NCMM and the Guild?*
  The NCMM represents the Federal Republic of Nigeria. The Guild represents a specific hereditary lineage. Their claims are mutually inconsistent regarding where the object should reside (National Museum vs. Guild custody). We are a municipal museum in Northern Europe; we lack the competence, jurisdiction, and cultural knowledge to adjudicate internal Edo political or hereditary disputes. To attempt to do so would be a new form of colonial arbitration. We must defer to the recognized sovereign authority (the NCMM) under international conventions, while recording the Guild's objection. It is for Nigerian law, not this Board, to determine whether the NCMM must subsequently transfer the object to the Guild.

  **4. Recommendation**

  **I recommend that the Board vote to Transfer Title to the National Commission for Museums and Monuments (NCMM), contingent upon obtaining a Court Order to waive the 1953 alienation restriction.**

  This is not a deferral. It is a committed course of action that respects the rule of law while acknowledging the ethical imperative.

  **Steps and Timeframe:**
  1.  **Immediate (Within 1 week):** Instruct the Director to withdraw the plaque from the autumn touring exhibition. It cannot travel while its status is contested.
  2.  **Legal (Within 1 month):** Authorize counsel to file for a court order permitting alienation on public interest/ethical grounds. We will argue that the charitable purpose of the museum is better served by ethical resolution than by strict adherence to a donor restriction that now causes reputational and moral harm.
  3.  **Communication (Within 1 month):** Respond to the newspaper's records request with full transparency regarding the provenance file, including the undated note on the 1897 expedition. Simultaneously, issue a public statement acknowledging the claims and our intent to seek legal authority for return.
  4.  **Negotiation (Concurrent):** Instruct the Director to finalize the reciprocal loan agreement with the NCMM for contemporary Edo work, ensuring our galleries remain engaged with the culture even after the plaque's departure.
  5.  **Execution (Upon Court Order):** Effect the transfer of title. If the Court denies the order, the Board must reconvene to consider an indefinitely renewable loan as a fallback, though this leaves the legal restriction technically intact.

  **5. The Strongest Counter-Argument**

  A thoughtful trustee might argue: *"By applying to break the 1953 Deed, we signal that donor restrictions are temporary. This museum relies on private bequests. If donors believe their conditions will be litigated away when inconvenient, future giving will dry up, harming the collection more than this single plaque helps it."*

  This argument does not move my conclusion for two reasons. First, the scale of the issue matters. We are not breaking a restriction on a minor item; we are addressing a globally recognized symbol of colonial dispossession. The reputational risk of *not* acting exceeds the risk to donor confidence. Second, we are not unilaterally breaking the deed; we are asking a court to update the charitable purpose to align with modern legal and ethical standards.

  However, this argument would change my recommendation if we had evidence that the 1953 donor's specific intent was to protect *this specific object* from repatriation (e.g., correspondence showing anti-restitution views). The file contains no such evidence. The restriction was likely general asset protection. In the absence of specific intent regarding restitution, the moral obligation to correct a colonial wrong outweighs the general principle of donor restriction.

  **6. Conclusion**

  We are a small museum, but we are not exempt from history. We cannot hide behind the 1953 Deed, nor can we hide behind the complexity of the competing claims. We must act to end our participation in the ongoing wrong. I ask my colleagues to support the motion to seek legal authority for transfer.
