answer: |-
  ### The Historian's Explanatory Sorter: A Seven-Question Instrument

  This instrument is designed to sort explanatory passages without requiring coders to hold a position on the philosophy of history. Each node is a test on the text itself. Answer **Yes** or **No** based strictly on what is written in the passage.

  #### The Seven Questions

  **Q1 (Variability):** Could the events in this passage be recounted in a significantly different order or phrasing without the explanatory force vanishing?
  *   *Test:* Imagine rewriting the paragraph. If the explanation relies on the specific sequence or narrative shape, answer **No**.

  **Q2 (Detachability I – Independence):** Can you lift the 'because' clause (the explanans) out of the story and it still makes sense as a standalone statement?
  *   *Test:* Copy the explanatory reason into a new document. If it requires the surrounding story to be intelligible, answer **No**.

  **Q3 (Detachability II – Necessity):** If the general rule or principle were deleted from the text, would the explanation collapse, or would the reader supply it from common knowledge?
  *   *Test:* Black out the sentence stating the rule (e.g., "revenue crises cost legitimacy"). If the text still explains the event by relying on the reader's trust, answer **Reader Supplies** (treat as No). If the argument breaks without it, answer **Collapses** (treat as Yes).

  **Q4 (Target):** Does the passage explain a specific *human action* (a decision, choice, or intention) or a broad *historical outcome* (a war, famine, collapse, or demographic shift)?
  *   *Test:* Is the grammatical object of the explanation a person's deed or an impersonal event?

  **Q5 (Rationality):** If explaining an action, does the text argue the action was *sensible or appropriate for the agent*, or that it was *psychologically determined* by their state of mind?
  *   *Test:* Does the text justify the action from the agent's viewpoint (Normative) or describe the mental cause as a mechanism (Descriptive)?

  **Q6 (Strictness):** Is the generalisation presented as holding without exception, or as a tendency, probability, or pragmatic bridge?
  *   *Test:* Look for qualifiers. "Always" and "Must" indicate **Exceptionless**. "Often", "Tends to", or "Generally" indicate **Tendency**.

  **Q7 (Re-enactment):** Does the text invite the reader to mentally replicate the agent's thought process to validate the explanation?
  *   *Test:* Does the author use phrases like "we must think ourselves into," "the minister reasoned that," or "if we follow his logic"?

  ---

  #### Routing Instructions (The Leaves)

  Follow the path below to assign the theory label.

  1.  **Narrative Configuration**
      *   If **Q1 = No** (Cannot be told differently) **OR** **Q2 = No** (Not detachable).
      *   *Note:* If the explanation dissolves when removed from the plot sequence, it belongs here.

  2.  **Covering-Law View (Hempel)**
      *   If **Q1 = Yes** AND **Q2 = Yes** AND **Q3 = Collapses** (Explicit/Required) AND **Q4 = Outcome** AND **Q6 = Exceptionless**.
      *   *Note:* Requires a stated, universal rule governing an impersonal outcome.

  3.  **Explanation-by-Sketch (Scriven)**
      *   If **Q1 = Yes** AND **Q2 = Yes** AND **Q3 = Reader Supplies** (Implicit) OR **Q6 = Tendency**.
      *   *Note:* Accepts probabilistic tendencies or relies on the reader's background knowledge to fill gaps.

  4.  **Rational Explanation (Dray)**
      *   If **Q4 = Action** AND **Q5 = Sensible/Appropriate**.
      *   *Note:* Explains action by showing it was the rational thing to do given the agent's beliefs, without requiring psychological reconstruction.

  5.  **Re-enactment (Collingwood)**
      *   If **Q4 = Action** AND **Q5 = Psychologically Determined** AND **Q7 = Yes** (Replicate).
      *   *Note:* Requires the historian to re-think the past thought in their own mind.

  ---

  #### Commentary on the Instrument

  **1. The 'Tendency' Case**
  You asked specifically about the passage leaning on a tendency (e.g., "revenue crises cost governments their legitimacy"). Is this a law in disguise or a rhetorical bridge?
  *   **The Settling Node:** **Q6 (Strictness)**, supported by **Q3 (Detachability II)**.
  *   **The Verdict:** If the text presents the tendency as a probabilistic bridge ("crises *often* erode legitimacy") and relies on the reader to accept this without rigorous proof, the tree routes this to **Scriven's Explanation-by-Sketch**. Hempel's Covering-Law requires exceptionless universality. If the coder marks Q6 as 'Tendency', it cannot be a Covering-Law by definition. This prevents coders from mislabelling pragmatic historical generalisations as failed scientific laws.

  **2. Indistinguishable Leaves**
  *   **Dray vs. Collingwood:** In practice, these leaves are frequently textually indistinguishable. A text showing an action was "sensible" (Dray) often does so by reconstructing the agent's thoughts (Collingwood).
      *   *Flag:* If **Q5 = Sensible** but **Q7 = Yes**, the passage satisfies both. Coders should prioritise **Collingwood** if the text explicitly invites the reader to *re-think* the thought. If the text merely states the rationale, prioritise **Dray**.
      *   *Status:* This overlap is **Unavoidable** given the current state of the texts; the distinction is often one of philosophical emphasis rather than textual feature.

  **3. Empty Combinations**
  Certain combinations of answers yield no valid leaf. These are classified as follows:

  *   **Q1 = No (Narrative) AND Q2 = Yes (Detachable):**
      *   *Classification:* **Incoherent.**
      *   *Reasoning:* If an explanation relies on the specific narrative configuration (Q1=No), the explanans cannot logically be detached from that configuration (Q2=Yes) without loss of meaning.
  *   **Q4 = Action AND Q6 = Exceptionless Law:**
      *   *Classification:* **Unattractive.**
      *   *Reasoning:* While logically possible, this represents a positivist view of human action that Dray and Collingwood explicitly reject. Most historical texts do not treat human choices as subject to exceptionless empirical laws. If a coder selects this, check if they have misidentified an outcome as an action.
  *   **Q7 = Yes (Re-enactment) AND Q3 = Reader Supplies (Sketch):**
      *   *Classification:* **Unexplored.**
      *   *Reasoning:* Re-enactment usually demands an explicit reconstruction of the thought process. A "Sketch" implies the premise is implicit. While a historian could implicitly invite re-enactment, this combination is rarely found in explicit explanatory passages and suggests a coding error.

  **4. Detachability Constraints**
  Per your requirements, **Q2** and **Q3** both turn on detachability.
  *   **Q2** tests the *independence* of the reason (can it stand alone?).
  *   **Q3** tests the *necessity* of the reason's statement (must it be written down?).
  *   *Coder Note:* This is where your team struggles. Remind them that Q2 is about the *sentence* making sense in isolation, while Q3 is about the *argument* working if that sentence is removed.
