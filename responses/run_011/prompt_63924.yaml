answer: |-
  1. Your human protocol relies on surgical sleep, meaning the subject experiences a blackout before the first swap and a wake-up after the last; if the "Dancing Qualia" argument depends on the impossibility of noticing a change *during* experience, what work is it doing when the experience is interrupted?
  *Note: Forces him to admit his core philosophical argument relies on third-person assumptions rather than first-person continuity.*

  2. You will likely say functional continuity matters more than witnessed continuity, but if the subject can't witness the transition, how do you distinguish "consciousness carried across" from "a new instance was instantiated that behaves exactly like the old one"?
  *Note: Traps him on the difference between actual survival and mere replacement, which his protocol cannot empirically separate.*

  3. If the only difference between those two scenarios is metaphysical and has no functional footprint, what is "functional continuity" adding over and above "you wouldn't be able to tell"?
  *Note: Forces him to define the value of his theory beyond behavioral prediction, which is where he usually hides.*

  4. At the 50% mark, if the biological hemisphere and the synthetic hemisphere have different phenomenal characters, which side controls the verbal report, and why should we trust that report to describe the whole?
  *Note: Exploits the localization of language to challenge the authority of the subject's testimony regarding their own mind.*

  5. If you claim the consciousness remains unified despite the split substrate, at what percentage of replacement does the unity break, and what is the physical marker for that break?
  *Note: Forces him to identify a threshold he claims doesn't exist, exposing the vagueness of his "negligible" claim.*

  6. When you define a swap as "functionally negligible," what specific observable are you measuring to certify that neglectability, and is that observable strictly behavioral?
  *Note: Demands a concrete metric; if he names behavior, he concedes the ground for the next question.*

  7. If your metric is purely behavioral, why should identical behavior be evidence about *experience* rather than a restatement of your own assumption that behavior equals experience?
  *Note: Highlights the circularity of using behavior to prove phenomenology, which is the core weakness of his position.*

  8. If you reverse the procedure and restore the biological tissue, and the subject reports no change, does that prove nothing was lost, or only that nothing *detectable* was lost?
  *Note: Drives a wedge between measurement and ontology, preventing him from equating success with lack of evidence for failure.*

  9. In the scan-and-copy scenario, the original remains, creating a duplication problem; in your protocol, the original is destroyed piece-by-piece, so is the duplication scenario a genuine threat to your theory of identity, or a red herring you're using to make replacement look safer by comparison?
  *Note: Challenges whether his method actually solves the "copy" problem or just hides the destruction of the original.*

  10. Setting aside mouse behavioral metrics, what specific result in this trial would force you to abandon the claim that this logic scales to human consciousness?
  *Note: Prevents him from hiding behind "we need more data" or claiming behavioral success is the only valid falsifier.*

  11. Realistically, who is the first human candidate: are we talking about terminal patients facing immediate death, or are you envisioning healthy volunteers?
  *Note: Grounds the theory in ethical reality and forces him to clarify the risk profile for actual humans.*

  12. Given the risk of "silent death" where the body lives but the lights go out, what incentive structure do you propose to get a volunteer to sign that consent form?
  *Note: Forces him to address the stakes without resorting to scientific curiosity or vague promises of immortality.*
