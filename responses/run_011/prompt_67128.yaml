  ### Part 5: Plain Talk on Framing

  You asked me to flag if you framed this wrong. You have framed it correctly enough for an audit, but there is one trap:

  **Commitment 5 is not a commitment a Straight Hedonist can coherently hold.**
  You wrote: *"I suspect there's a reading on which they're compatible and a reading on which they aren't."*
  There is only one reading compatible with Commitment 1: **Disgust counts.**
  If you insist on the reading where "Disgust deserves no weight," you are not a Straight Hedonistic Utilitarian. You are a **Perfectionist** or a **Preference Utilitarian** who is using hedonistic language.

  If you want to keep the label "Straight Hedonistic Utilitarian," you *must* accept the revision to Commitment 5 outlined above. If you refuse that revision, you are not auditing a view; you are describing a contradiction.
