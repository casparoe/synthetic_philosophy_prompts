answer: |-
  - **Bottom line**
  Your hunch survives: the tension between gradable personhood and equal moral protection is the bottleneck, and everything else is indeed downstream. I would bet the project on this question: *Can we decouple ontological personhood (which varies) from moral status (which must remain inviolable) without collapsing back into individualism?* If you cannot secure full moral protection for those who fail to "achieve" personhood, the theory is clinically dangerous; if you can, the other objections lose their teeth. Solve this, and you unlock the practical tool; fail this, and the project should terminate early.

  - **The shortlist, ranked**

  1.  **Can moral protection be divorced from ontological personhood?**
      This is the absolute upstream constraint. Relational accounts risk implying that those who cannot sustain relationships (advanced dementia, DOC) are "less person" and therefore deserve less protection. You must argue that while *personhood* is a gradable achievement within a community, *moral status* is a binary shield granted by that same community to its vulnerable members. This is not a covert return to individualism; it is a specific communal duty to protect those who cannot enact personhood themselves. If you cannot defend this normatively without contradiction, no ethics committee should ever touch your framework.
      *Output:* **The Dual-Track Normative Framework.** A concise theoretical paper distinguishing "personhood-as-function" (gradable) from "personhood-as-protection" (binary), specifically designed to block demotion arguments in clinical guidelines.

  2.  **Who constitutes the 'community' in a clinical setting?**
      Once protection is secured, you must define the agent responsible for conferring and maintaining it. In traditional Ubuntu contexts, this is the village or lineage; in a hospital, it is ambiguous. Is it the family? The medical staff? The state? If you leave this vague, the theory invites paternalism (doctors deciding who counts) or abandonment (families walking away). You need a normative typology of clinical community agents that assigns specific responsibilities to kin, caregivers, and institutions without requiring empirical fieldwork. This is upstream of the tool because a decision procedure requires defined actors.
      *Output:* **The Community Agency Typology.** A conceptual map assigning specific relational duties to distinct hospital stakeholders (e.g., family maintains identity, staff maintains dignity, institution maintains rights).

  3.  **What triggers ethics committee intervention?**
      Committees cannot evaluate every patient relationally; they need a triage mechanism. The trigger cannot be "suspected loss of personhood," which is too volatile. Instead, it must be "fraying of relational ties." When the community agents identified in Question 2 fail to uphold their duties, the committee steps in to restore the relational network, not to judge the patient's ontological status. This shifts the committee's role from arbiter of worth to facilitator of care, making the theory usable without empowering them to "demote" patients. This is the final downstream product that relies on the stability of the first two answers.
      *Output:* **The Relational Triage Matrix.** A flowchart for committee intake that flags cases based on relational breakdown (e.g., family conflict, staff burnout, isolation) rather than patient capacity.

  - **What I'd cut**

  Drop the debate over whether this is just "Care Ethics in different vocabulary." That is a sociological label fight that won't change how a committee applies a decision procedure. Similarly, stop fighting the "vagueness" objection directly; you cannot eliminate vagueness in philosophy, so instead build precision into the Triage Matrix. If the tool works despite philosophical vagueness, the objection becomes irrelevant to your funder. Finally, avoid deep metaphysics on what constitutes an "achievement." Define it operationally for the hospital context (e.g., "reciprocal recognition") and move on. These disputes consume time but don't alter the downstream deliverables.

  - **Rank-changers**

  If a major court ruling emerges regarding rights for non-communicative patients, Question 2 (Community Agency) jumps to top priority; you will need to align your typology with legal precedents immediately to remain viable. Conversely, if you discover a logical contradiction in the Dual-Track Framework (Question 1) during the first six months, stop everything. No amount of practical tooling matters if the normative core is incoherent. Finally, if the ethics committee pilot indicates confusion over *who* is responsible rather than *when* to act, swap Questions 2 and 3.
