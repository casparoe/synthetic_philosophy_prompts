answer: |-
  Van Fraassen's Reflection Principle proposes a striking constraint on rational belief over time. It states that if you are certain now that your future degree of belief in a proposition will be $x$, then your current degree of belief should also be $x$. More generally, your current credence in a proposition, conditional on your future credence being $x$, should be $x$. On its face, this looks like a demand for diachronic coherence: you should not expect to disagree with yourself without expecting a reason for the disagreement. However, whether Reflection constitutes a genuine, independent requirement of rationality, or merely a corollary of other norms like conditionalization, remains a live controversy. To resolve this, we must look beyond abstract formalisms and examine the structural role Reflection plays in agency, specifically through the lens of a constructed case I will call the Audit.

  The structural question haunting Reflection is one of redundancy. If a rational agent updates solely by conditionalizing on veridical evidence, Reflection follows automatically. If I know I will conditionalize on evidence $E$, and I know what $E$ is, my current credence should match my expected posterior. On this reading, Reflection adds nothing; it is a theorem of Bayesian updating. Its distinctive content resides only in the residue: situations where future credences do not arise from straightforward conditionalization on evidence the agent can currently specify. This includes cases of forgetting, ambiguous evidence, or changes in the weighting of considerations. The critical question is whether this residue is substantial enough to bear the weight of a normative principle, or whether Reflection is merely a harmless corollary dressed up as a norm.

  I argue that Reflection is a genuine norm, but it is not unconditional. It is a principle of rational deference to one's future self, contingent on the expectation that the future self is functioning as a rational agent. The "residue" is substantial because it covers the vast terrain of human cognition where evidence is not simply "received" but interpreted, weighted, and integrated. Reflection governs the trust an agent places in her own future rationality. To see why this distinction matters, and why the principle must be qualified, we must examine the case of Hana.

  Hana is a statistician entering a two-month residency at a firm. She investigates a disputed hypothesis $H$. Her current credence in $H$ is 0.30. She is certain that at the end of the residency, her credence will be 0.85. We must consider two versions of the Audit. In the first, Hana believes the firm's analysts rely on a procedure with a known subtle bias and use rhetorically compelling presentations. She knows she will be subjected to a sustained persuasion campaign. She expects to retain full recall of her current beliefs and the mechanisms of the campaign. She expects her future self to satisfy formal norms and calibration, yet she knows her future self will weight considerations differently due to the exposure. In the second, mirror version, Hana deliberately purchases this residency. She has concluded her present weighting is excessively conservative and arranges the exposure to correct it.

  Does Reflection apply? In the first case, it should not. In the second, it should. The difference lies not in the mathematical relation between current and future credences, but in the etiology of the change as assessed from the present. In the first case, Hana currently judges the process leading to the 0.85 credence as corrupting. She identifies the mechanism as "bias" and "persuasion." Even though she expects her future self to be formally coherent, she expects that coherence to be built on a distortion she currently rejects. To satisfy Reflection here would be to defer to a future self she currently diagnoses as compromised. It would require her to adopt the credence 0.85 now, effectively admitting that her current assessment of the bias is wrong, or that the bias is irrelevant. But by stipulation, she knows the bias is real. Therefore, Reflection fails.

  In the second case, Hana endorses the process. She views the change in weighting not as corruption, but as calibration. She believes her current self is the one in error (excessively conservative) and that the residency will repair this defect. Here, Reflection holds. She should raise her credence to 0.85 now, because she defers to the judgment of the future self who has undergone the corrective process.

  This distinction addresses the structural worry about independent work. Reflection is not just about matching numbers; it is about the authority of the future self. If Reflection were merely a corollary of conditionalization, it would not matter whether the change was caused by bias or correction, provided the agent expects the change. But rationality demands we track the truth, not just coherence. If I know my future belief is caused by a known bias, conditionalization on the fact "I will believe this" is irrational because the fact "I will believe this" is not evidence for the proposition itself; it is evidence of a causal process I currently deem unreliable. Reflection, properly understood, incorporates this filter. It demands deference only when the expected change is viewed as rational from the current perspective.

  This leads to the standard motivations for Reflection. The diachronic Dutch book argument suggests that violating Reflection makes an agent exploitable across time. A bookie could sell the agent a bet now based on her current credence and buy it back later based on her future credence, guaranteeing a loss. Critics argue this does not license a charge of irrationality because there is no single moment where the agent chooses all the bets; the later self is a different temporal stage. However, this objection misunderstands diachronic agency. An agent is not a sequence of disjointed selves but a temporally extended entity. Integrity over time is a constitutive aim of agency. If I know I will abandon a plan tomorrow for no reason I accept today, I am practically fragmented. The Dutch book highlights this fragmentation. It shows that violating Reflection treats future beliefs as unconnected to current truth-tracking aims. In the Audit Case 1, Hana avoids the Dutch book by not updating now; she recognizes the future bet would be placed by a compromised agent. In Case 2, she avoids it by updating now, recognizing the future agent as authoritative.

  The analogy with deference to an expert clarifies this further. You should defer to an expert's credence unless you have reason to believe they are mistaken. Your future self is typically your own best expert. But in the Audit Case 1, Hana has specific evidence that her future self's "expertise" is compromised by known bias. She treats her future self like a witness known to be under coercion. In Case 2, she treats her future self like a specialist undergoing training. The norm of Reflection is thus a specific instance of the norm of expert deference applied diachronically.

  The coherence-based thought—that expecting to change without expecting evidence condemns your present self as mistaken—also holds, but with nuance. In Audit Case 1, Hana does expect to change, but she expects the change to be driven by rhetorical weight rather than evidential weight. She condemns her future self's weighting, not necessarily her present self's conclusion. She thinks, "I am right now, and I will be wrong later because I will be swayed." This is not incoherent; it is a tragic prediction of rational decay. In Case 2, she thinks, "I am wrong now, and I will be right later." This demands Reflection.

  Objections to Reflection often cite anticipated intoxication, exhaustion, or propaganda. These are clearly cases where the qualification I propose kicks in. If I know I will be drunk, I do not defer to my drunk self. The worry is that this makes Reflection trivial: "Defer to your future self unless you shouldn't." Is the qualification specifiable from the inside? Yes. The agent must assess the expected causal process leading to the future credence. If the agent expects the process to include factors she currently identifies as truth-obscuring (bias, fatigue, coercion), Reflection is suspended. If she expects the process to include factors she identifies as truth-revealing (learning, calculation, correction), Reflection applies. This is not trivial because it requires empirical judgment about the world and one's own psychology. In the Audit, Hana knows the statistical bias is truth-obscuring. She knows the "persuasion" is rhetorical, not evidential. These are accessible facts.

  A more difficult objection concerns self-locating belief. If I know I will be lost tomorrow, my future credence about my location will differ from mine today, not because of evidence, but because of indexical shift. Reflection seems to fail here. However, this is a category error. Reflection applies to propositions whose truth values remain stable or whose indexical content is properly adjusted. The principle should be restricted to non-indexical propositions or centered propositions where the center is accounted for. This restriction is also specifiable from the inside: "Defer to your future self on matters where the difference in perspective is not merely indexical."

  Does the difference between Audit Case 1 and Case 2—the fact that one change was chosen—do real normative work? Yes. Choice signals endorsement. In Case 2, Hana's choice to enter the residency is a current endorsement of the future weighting mechanism. It transforms the future change from an external force into an internal plan. In Case 1, the change is something that happens *to* her, despite her current judgment. The normative work lies in the alignment of current agency with future cognition. Rationality requires that we govern our beliefs according to our best current judgment of truth-conducive processes. To defer to a process we currently judge as corrupt is to violate our current duty to truth.

  Some might argue that if Hana in Case 1 is certain she will believe 0.85, she must already believe 0.85 is the rational credence, otherwise she wouldn't be certain of her future rationality. But certainty about a future psychological state is not certainty about its rationality. I can be certain I will panic, without believing panic is rational. Hana is certain she will be persuaded, not that the persuasion is rational. Thus, Reflection does not force her to update.

  If we reject this qualified view, we face a dilemma. If we accept Reflection unconditionally (Option A), Hana in Case 1 must update to 0.85. This implies she should ignore her current knowledge of the bias because her future self won't. This severs the link between current evidence and current belief, making agency impossible. She would have to act on a belief she currently knows is produced by bias. If we drop Reflection entirely (Option C or D), we lose the norm that binds our temporal selves together. We become mere sequences of stages, liable to Dutch books and practical fragmentation. We lose the ability to plan based on future knowledge.

  Therefore, Reflection must be retained as a qualified norm. The qualification is neither trivial nor incoherent. It requires the agent to distinguish, from her current perspective, between expected rational updating and expected irrational distortion. This is a demanding requirement, but it is the core of diachronic rationality. It demands that we monitor not just what we will believe, but why we will believe it. The Audit shows that the same shift in credence can be rational or irrational depending on the etiology. Reflection captures this by tying current credence to future credence only when the future credence is expected to be the product of a rational process endorsed by the present self.

  In conclusion, Reflection is not a blind command to agree with your future self. It is a presumption of continuity in rational agency. It holds when you expect your future self to be you, only better informed or corrected. It fails when you expect your future self to be you, but compromised. The residue where Reflection operates independently of simple conditionalization is precisely the space of evaluating our own cognitive trajectories. This is substantial work. It prevents us from being slaves to predicted irrationality while allowing us to benefit from predicted growth. The distinction in the Audit cases proves that the normativity lies in the endorsement of the process, not merely the prediction of the outcome.

  Verdict: \answer{B}
