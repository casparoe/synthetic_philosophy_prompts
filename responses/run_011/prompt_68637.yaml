  *(Final Verdict Nuance)*: The system *works* (shifts get swapped). The question is whether the *ranking* claims to be "fair" or "optimal" in a welfare sense. If it's just a heuristic to find matches, it's fine. If it claims to maximize social good, it's philosophically shaky without scale normalization.

