      11. *Customary token (both sides, after):* Not corruption.
      12. *Customary token (unequal or before):* Corruption.

  3.  **Analyze the Failed Principle:**
      *   *Proposed:* "Converting impartial authority into private advantage... excluding benefits to community."
      *   *Failures:* Rug (private advantage but ok), Ward fund (community benefit but feels like clientelism), Customary token (private advantage but ok).

  4.  **Identify Underlying Themes/Tensions:**
      *   **Public vs. Private:** The core distinction seems to be about *who* owns the decision right and *what* the decision is supposed to track.
      *   **Reciprocity vs. Entitlement:** The rug and customary token feel like *social* reciprocity, not *transactional* quid-pro-quo. The conference and cash envelope feel transactional.
      *   **Discretion vs. Duty:** Political roles (ward member) have different norms than bureaucratic roles (engineer, headteacher, doctor). Politics *is* partiality; administration *is* impartiality.
      *   **Scale/Materiality:** Small contract vs. Large contract. This suggests a threshold of *impact on public trust* or *systemic risk*, not just moral wrongness.
      *   **Institutional Purpose:** The doctor moving a friend (personal) vs. councillor (institutional gain). The lab (institutional gain) vs. cash (personal gain).
      *   **Timing/Symmetry:** Customary token (after/equal) vs. (before/unequal). This is about *influence* vs. *gratitude*.

  5.  **Drafting the Principle (Iterative Process):**

      *   *Attempt 1 (Focus on Quid Pro Quo):* Corruption is exchanging official action for benefit.
          *   *Problem:* Doesn't catch the conference (no explicit deal) or the ward fund (explicit deal but political). Doesn't save the rug.
      *   *Attempt 2 (Focus on Role Morality):* Corruption is violating the specific norms of the office.
          *   *Problem:* Too vague. What are the norms?
      *   *Attempt 3 (Focus on Public Trust/Decision Integrity):* Corruption occurs when an external benefit creates a *reasonable suspicion* that the decision was diverted from its public purpose.
          *   *Problem:* The rug creates suspicion but is allowed. The ward fund diverts purpose but is allowed.

      *   *Refining the "Two-Part" Hypothesis:* The user asks if a two-part account is needed (Office Norms + Transaction). This seems promising.
          *   *Part 1: The Nature of the Office.* Is the role supposed to be impartial (bureaucrat/judge) or partial (politician)?
          *   *Part 2: The Nature of the Exchange.* Is it a *price* (quid pro quo) or a *gift* (social glue)? Is the benefit private or public?

      *   *Developing a Unified Principle (The "Decision-Right" Approach):*
          Corruption is the *privatization of a public decision-right*.
          *   *Rug:* Doesn't privatize the decision (already made).
          *   *Conference:* Privatizes the decision-right (creates dependency/bias in future tender).
          *   *Brother-in-law:* Small = nepotism (bad); Large = privatization of public resource (corruption).
          *   *Ward Member:* Decision-right *belongs* to them to allocate politically.
          *   *Headteacher Cash:* Selling the decision-right.
          *   *Headteacher Lab:* Benefit is public, decision-right remains with school (technically), but... user doubts this.
          *   *Doctor Friend:* Personal discretion within professional role?
          *   *Doctor Councillor:* Trading public service for public resource (institutional bribery).
          *   *Customary Token:* Ritual gratitude, not purchase of decision.

      *   *Wait, the "Scale" Issue:* Small vs. Large contract. This implies corruption isn't binary. It's a spectrum of *betrayal of public trust*. Or, small contracts fall under "administrative discretion/nepotism" while large ones trigger "fiduciary breach."
      *   *Wait, the "Private Sector" Issue:* Supermarket buyer. This suggests the principle shouldn't rely solely on "public office." It relies on "agency."

      *   *Synthesizing a Robust Principle:*
          **The Principle of Fiduciary Alignment:** An actor acts corruptly when they accept a benefit that creates a *competing loyalty* sufficient to compromise the *primary purpose* of their agency, unless that benefit is either (a) symbolic/social (not material enough to sway), (b) public-facing (benefits the institution, not the agent), or (c) inherent to the role's mandate (political discretion).

      *   *Let's try to make it sharper.* The user wants to know what they are *committed* to.
      *   *Core Distinction:* **Influence vs. Gratitude.** And **Private Gain vs. Public Purpose.**
      *   *Core Distinction 2:* **Political vs. Administrative.**

      *   *Proposed Principle:* **"Corruption is the diversion of a fiduciary decision from its mandated purpose by a private benefit, unless that benefit is socially symbolic or the role mandates partiality."**

      *   *Let's test this against the "Two-Part" idea.*
          Actually, the user's intuition about the "Two-Part" account (Office Norms + Transaction) is very strong.
          1.  **Role Definition:** Does the role require impartiality (Engineer, Judge, Doctor, Teacher) or partiality (Politician)?
          2.  **Transaction Test:** Does the benefit precede the decision (purchase) or follow it (gratitude)? Is it private (pocket) or public (institution)? Is it material (sways will) or symbolic (social glue)?

      *   *Let's build the response around a "Dual-Condition" Principle.*
          *   Condition A: The Role Constraint (Impartiality vs. Discretion).
          *   Condition B: The Transaction Constraint (Influence vs. Recognition).

      *   *Re-evaluating the "Scale" (Small vs. Large Contract):* This is likely the user rationalizing. Nepotism is nepotism. But legally/practically, we treat them differently. I need to be straight: Is it a real distinction? Probably not morally, but systemically yes. I should advise them to drop the distinction for the *code*, even if they feel it.
      *   *Re-evaluating the "Lab" (Headteacher):* User trusts this verdict least. I should tell them to flip it. If the child gets the place *because* of the lab, it's corruption. If the lab is unconditional, it's a donation. The link is the problem.
      *   *Re-evaluating the "Conference":* User says "Not fine" despite transparency. This is about *dependency*, not just secrecy.

  6.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the lawyer colleague is half-right (simplicity is good) but wrong about the complexity being mere rationalization. The complexity is real (role morality).
      *   **The Principle:** Propose a "Fiduciary Purpose" principle with a "Role-Specific" modifier.
      *   **Clause-by-Clause Breakdown:** Map the verdicts to the clauses.
      *   **The Two-Part Question:** Argue for the Two-Part Account (Role + Transaction). Define the seam.
      *   **New Cases:** Apply to Revolving Door and Supermarket Buyer.
      *   **The Cost (Hard Truths):** Identify which verdicts must go.
          *   *Scale:* Drop the small vs. large contract distinction.
          *   *Lab:* Flip the verdict (it is corruption if linked).
          *   *Doctor/Friend:* This is tricky. If it's a public clinic, it's corruption. If private practice, maybe not. Assume public.
      *   **Conclusion:** Final advice on the Code.

  7.  **Refining the Principle (Self-Correction during drafting):**
      *   Make sure I don't just say "it depends."
      *   Principle: **"An officeholder acts corruptly when they allow a private benefit to determine, or reasonably appear to determine, the exercise of a discretionary power entrusted to them for a public purpose, unless the benefit is purely symbolic or the office mandates representational partiality."**
      *   *Critique:* "Reasonably appear" covers the conference. "Public purpose" covers the ward member (political allocation is the purpose). "Symbolic" covers the rug/token. "Private benefit" covers the lab (if it benefits the school, is it private? No, so it passes, *unless* it buys the spot).
      *   *Wait, the Lab:* The benefit is to the school (public), but the outcome is to the child (private). The *decision* was sold for a *public benefit*. This is "Institutional Bribery." It is still corruption. I need to tell the user their intuition on the Lab is wrong.
      *   *The Scale:* Small vs Large. This is about *de minimis* vs *systemic harm*. I will argue this is a pragmatic line, not a moral one. For a code, treat them the same.

  8.  **Final Polish:**
