answer: |-
  Your lawyer colleague is half-right: you *are* looking for a permission structure, but not for the reasons he thinks. You are not trying to license your preferences; you are trying to reconcile two different moral languages that are currently speaking over one another. One language is **universalist** (rules apply to everyone equally), and the other is **relational** (rules depend on the specific social bond). Your intuitions are inconsistent because you are switching between these languages without acknowledging the switch.

  To build a code that works, you need a principle that respects the *purpose* of the office rather than just the *act* of taking. Here is the principle that best reconstructs your verdicts, followed by the cost of adopting it.

  ### The Principle: Fiduciary Deviation

  **An officeholder acts corruptly when they allow a material benefit to divert a discretionary decision from the mandated purpose of their office, unless (a) the office mandates representational partiality, or (b) the benefit is socially symbolic and retrospective.**

  This is a single principle with two explicit exceptions. It is not baroque, but it requires precise definitions. Here is how the clauses map to your verdicts.

  #### Clause 1: "Material benefit to divert... from the mandated purpose"
  *   **Motivating Verdicts:** The **Cash Envelope** (Headteacher), the **Resort Conference** (Engineer), the **Councillor/Generator** (Doctor).
  *   **What it does:** This establishes the core mechanism. Corruption is not just "taking"; it is "taking *that changes the track*."
      *   **Cash Envelope:** The purpose of the waiting list is order/need. Cash diverts it to ability to pay. (Corruption).
      *   **Resort Conference:** The purpose of the tender is best value. A free holiday creates a debt of gratitude that diverts judgment, even if no explicit deal is struck. The "longevity" does not matter because the *diversion risk* remains constant. (Corruption).
      *   **Doctor/Councillor:** The purpose of the clinic queue is medical need. Moving the councillor diverts this to institutional bargaining (generator for queue jump). (Corruption).
      *   **Supermarket Buyer (New Case):** This counts. The "mandated purpose" of a buyer is to get the best goods/price for the employer. A resort conference creates a competing loyalty. It is corruption (or breach of fiduciary duty), even without public office.

  #### Exception (a): "Unless the office mandates representational partiality"
  *   **Motivating Verdicts:** The **Ward Member** (both cases).
  *   **What it does:** This distinguishes *politics* from *administration*. A bureaucrat (engineer, teacher, doctor) is hired to be impartial. A politician is elected to be partial to their constituents.
      *   **Ward Fund:** The mandated purpose of a ward member's discretionary fund is *political allocation*. Steering it to voters is not a deviation; it is the job. Promising it beforehand makes it more transparent, not less. This saves you from condemning all clientelism as corruption, restricting the label to *administrative* clientelism.

  #### Exception (b): "Unless the benefit is socially symbolic and retrospective"
  *   **Motivating Verdicts:** The **Hand-Woven Rug**, the **Customary Token**.
  *   **What it does:** This distinguishes *gratitude* from *purchase*.
      *   **Rug:** It is retrospective (after the work) and symbolic (hand-woven, not cash). It acknowledges the relationship without purchasing the decision. Refusing it insults the social bond the engineer was meant to serve.
      *   **Customary Token:** Given *after* judgment and to *both* sides. It is a ritual fee for the tribunal's existence, not a price for the verdict.
      *   **The Distinction:** This explains why the token *before* judgment is corruption (it becomes an advance payment) and why *unequal* tokens are corruption (they become a bribe).

  ---

  ### One Principle or Two Parts?

  You asked if you need a two-part account. **Yes.** The principle above hides a seam. You cannot apply the "Fiduciary Deviation" test without first answering a prior question.

  **The Seam:** The seam runs between **Status** (Part 1) and **Transaction** (Part 2).

  1.  **Part 1: Status (The Office Norms).** Before looking at the gift, you must define the *mandated purpose* of the role. Is the role impartial (Engineer, Judge, Doctor) or partial (Politician)? Is the role public (Utility) or private (Supermarket)?
      *   *Why this matters:* You cannot judge the Ward Member by the Engineer's standard. Your current confusion on the Ward Member cases comes from treating them as administrators.
  2.  **Part 2: Transaction (The Exchange).** Once the role is defined, you assess the benefit. Is it material or symbolic? Is it prospective (influence) or retrospective (gratitude)? Is it private (pocket) or institutional (school lab)?

  **Why you need both:** A single principle like "no gifts" fails the Rug test. A single principle like "no conflict of interest" fails the Ward Member test. You need Part 1 to set the baseline of impartiality, and Part 2 to measure the deviation.

  ---

  ### Application to New Cases

  **1. The Revolving Door (Engineer joins Supplier)**
  *   **Analysis:** Under Part 1, her status as a public engineer mandated impartiality. Under Part 2, the job offer is a *deferred material benefit*. Even if no deal was struck *during* the tender, the *prospect* of the job creates a competing loyalty during the decision.
  *   **Verdict:** **Corruption (or severe conflict of interest).**
  *   **Reasoning:** It violates the "divert from mandated purpose" clause. The decision may have been technically sound, but the *independence* of the decision-right was compromised by the future benefit. Most integrity codes require a "cooling-off period" (e.g., 2 years) precisely for this.

  **2. The Supermarket Buyer**
  *   **Analysis:** Part 1: Private sector, but still a *fiduciary* role (agent for the company). Part 2: Resort conference is a material benefit.
  *   **Verdict:** **Misconduct/Breach of Duty (Functionally Corruption).**
  *   **Reasoning:** You noted you "feel something has gone wrong." This is the breach of agency. The buyer is an agent for the supermarket owners. Taking value from the supplier diverts their loyalty. It is not "public corruption" (no taxpayer money), but it is "private corruption" (theft of loyalty). Your code should probably cover this if it applies to the utility's commercial partners.

  ---

  ### The Cost: What You Must Give Up

  You asked me to be straight. If you adopt the **Fiduciary Deviation** principle, you cannot keep all your current verdicts. Here is the bill:

  **1. The "Small Contract" Exception (Brother-in-Law)**
  *   **Your Verdict:** Small contract = bad practice; Large contract = corruption.
  *   **The Cost:** **You must drop this distinction.**
  *   **Why:** Morally, nepotism is the same regardless of scale. The *deviation* from impartiality is identical. The only difference is the *harm*, not the *act*.
  *   **Recommendation:** In the code, treat them the same. Call it a "Conflict of Interest." You can have different *penalties* for small vs. large (a warning vs. dismissal), but you cannot call one "corruption" and the other "bad practice" without undermining the integrity of the rule. Your intuition here is likely rationalizing a tolerance for low-level nepotism because it is culturally ubiquitous. If you want an integrity code, you must name it.

  **2. The "Computer Lab" Exception (Headteacher)**
  *   **Your Verdict:** Not corruption because the benefit went to the school.
  *   **The Cost:** **You must flip this verdict.**
  *   **Why:** You admitted you trust this verdict least. Under the principle, the *decision* (admitting the child) was diverted from its purpose (merit/waitlist) by a *material benefit* (the lab). The fact that the benefit was institutional rather than personal is "Institutional Bribery." It is often *worse* than personal bribery because it implicates the whole organization.
  *   **Recommendation:** If the lab was an unconditional donation, it is fine. If the lab was linked (explicitly or implicitly) to the admission, it is corruption. You cannot allow public goods to be auctioned to the highest bidder, even if the bidder is a parents' association.

  **3. The "Doctor's Friend"**
  *   **Your Verdict:** Not corruption.
  *   **The Cost:** **Clarify the context.**
  *   **Why:** If this is a public clinic with a public queue, moving a friend is the same as moving the councillor. It diverts the resource from medical need to personal connection.
  *   **Recommendation:** If you want to call this "not corruption," you are arguing for **Professional Discretion**. You must codify that doctors have *some* discretion to prioritize based on non-medical factors (e.g., compassion). But if the queue is strict, moving a friend is corruption. You cannot have it both ways. I suggest you classify this as "Favoritism" (unethical) but reserve "Corruption" for cases involving *material gain* (money, jobs, goods). This preserves the "material benefit" clause of the principle.

  ### Summary for the Code

  Your lawyer colleague wants a rule that says "No Gifts." You know that breaks the social fabric (the Rug). You want a rule that says "No Conflicts." You know that breaks politics (the Ward Member).

  **Write the code in two tiers:**

  1.  **The Core Prohibition:** "No officeholder shall accept a material benefit that influences, or appears to influence, the exercise of their official discretion."
  2.  **The Guidance Notes (where the nuance lives):**
      *   *Symbolic Gifts:* Tokens of gratitude given *after* service are permissible if they are of nominal value and customary.
      *   *Political Discretion:* Elected officials may allocate discretionary funds to constituents, provided this is declared.
      *   *Institutional Benefits:* Donations to an institution (like a school lab) must not be linked to specific decisions regarding individuals.
      *   *Nepotism:* Contracts awarded to relatives must be declared and competitively tendered, regardless of value.

  **Final Word:** You are not rationalizing; you are navigating the gap between *law* (which is binary) and *ethics* (which is contextual). The cost of consistency is admitting that small nepotism is still corruption, and that institutional bribes are still bribes. If you are willing to pay that cost, the principle holds. If not, your code will be a list of exceptions disguised as rules.
