answer: |-
  Here is the plan. It is designed for 40 minutes, low prep, and high engagement without triggering the "covert campaign" alarm.

  ### 1. Scenario Selection & Disguise
  **Carrier:** The Freshman Door Rule (Scenario 1). This is the only one with hidden stakes (the ESL tutoring) and active controversy.
  **Support:** The Bell (Scenario 2) and Research Slots (Scenario 3). Use these as "control variables" in the debrief to show that not all traditions are equal.
  **Decoy:** Do not add a fourth. It dilutes the time. Instead, disguise the three you have heavily so they don't feel like "our school."

  **Disguise Details:**
  *   **School A (The Door):** "Northwood High." Freshmen must use the "North Entrance" and eat in the "Annex." Reason given: "Safety protocol from 1985." (Change "stone steps" to "courtyard," "gym" to "athletic wing").
  *   **School B (The Bell):** "Westlake Prep." Dismissal 5 mins early on Thursdays. Reason given: "Regional bus coordination."
  *   **School C (The Slots):** "Eastview Academy." 5 summer grants; 3 reserved for "Student Gov & Debate." Reason given: "Leadership merit."

  ### 2. Materials & Prep
  *   **Print (20 pages total):** 5 identical "Case Packets." Each packet contains:
      *   Page 1: School A Summary.
      *   Page 2: School B Summary.
      *   Page 3: School C Summary.
      *   Page 4: "Investigation Log" (Blank grid for votes and questions).
  *   **Index Cards:** Cut into 15 "Question Tokens" (3 per group).
  *   **Sharpies:** 5 (one per group).
  *   **Answer Key (For You Only):** A single index card in your pocket with the *real* truths (ESL program, dead bus route, nepotism).
  *   **Pizza:** Put it on a table by the door. They grab it as they enter.

  ### 3. The Mechanic: "Limited Intelligence"
  Groups cannot know everything. They must prioritize.
  *   **The Token Rule:** Each group gets 3 Question Tokens.
  *   **The Cost:** To ask a question about any school, they write it on a token and hand it to you. You return it with a one-word answer or "Record Lost."
  *   **The Catch:** You are the only source of truth. If they ask "Does anyone use the Annex?" you check your key. If they ask "Why?" you check your key.
  *   **The Trap:** For School A (Door), one specific question ("What happens in the Annex during lunch?") reveals the ESL tutoring. If they don't ask that, they don't know. For School B & C, the answers are "Obsolete" and "Corrupt."
  *   **Physical Voting:** No show of hands. "Move to the left wall for Keep, right wall for Abolish." This wakes up the pizza kids.

  ### 4. Minute-by-Minute Timeline (40 Mins)

  **0:00 – 0:05 | Entry & Fuel**
  *   Kids enter, grab pizza, put phones in caddy (enforce gently).
  *   Sit in 5 groups of 3-4.
  *   **You say nothing.** Let them eat. Put the Case Packets face down on tables.

  **0:05 – 0:10 | The Gut Check**
  *   **Script:** "You have three rules from three different schools. Read the summaries. Eat. In five minutes, I want each group to mark their 'Initial Vote' on the Log for all three. Keep or Abolish. No talking yet."
  *   *Why:* Forces individual processing before groupthink.

  **0:10 – 0:25 | Investigation Phase**
  *   **Script:** "You now have 3 Question Tokens per group. You can spend them on any school. You might spend all 3 on School A. You might spread them out. Once they're gone, they're gone. Some answers might be 'Record Lost.' Go."
  *   **Your Role:** Roam. Answer quickly. Write "Yes/No/Lost" on their token and hand it back.
      *   *If they ask School A:* "Is it dangerous?" -> "No record of accidents." / "What happens in the Annex?" -> "Tutoring program." (This is the key).
      *   *If they ask School B:* "Why Thursdays?" -> "Record Lost." / "Do buses still run?" -> "No."
      *   *If they ask School C:* "How are slots chosen?" -> "Council/Debate only." / "Is it merit?" -> "Definition varies."
  *   **Mid-point (0:20):** Call out "10 minutes left. Spend your tokens or lose them."

  **0:25 – 0:30 | Final Vote & Reveal**
  *   **Script:** "Mark your Final Vote. Did anyone change their mind? Stand up. Left for Keep, Right for Abolish. School A... go." (Repeat for B & C).
  *   **The Reveal:** "Sit down. There are no Schools A, B, or C. These are us. School A is the Freshman Door. School B is the Wednesday Bell. School C is the Research Slots."
  *   **Pause.** Let the noise happen. "The ESL tutoring table is in the Annex. The bus route ended in 2018. The slots are still alumni-heavy."

  **0:30 – 0:35 | The Debrief (The Critical Part)**
  *   **Q1:** "For School A (Door), did anyone vote to Abolish *before* finding out about the tutoring? Who changed their mind after?"
  *   **Q2:** "For School B (Bell), did anyone vote to Keep? Why? It wastes 4 minutes." (Expect: "Doesn't matter" or "Tradition").
  *   **Q3:** "For School C (Slots), is this the same kind of rule as the Door?" (Goal: Distinguish *harmful* tradition from *protective* tradition).
  *   **Q4:** "Who felt frustrated that you only had 3 questions? Who feels like you still don't know enough?"

  **0:35 – 0:40 | Terminology & Cleanup**
  *   **Script:** "There are two concepts for today.
      1.  **Chesterton's Fence:** Don't remove a fence until you know why it was put up. (Applies to School A).
      2.  **Status Quo Bias:** Keeping things just because they're there. (Applies to School B).
      *   Sometimes the fence is holding back a tiger. Sometimes it's holding back nothing. Your job isn't to keep or abolish. It's to find the fence."
  *   Collect packets. Dismiss.

  ### 5. Troubleshooting Live Risks

  **Risk 1: The Pizza Kids Check Out**
  *   **Fix:** The physical voting (moving walls) forces them to stand up. Also, give the Sharpie to the quietest kid in the group. "You're the Scribe, you hold the pen."
  *   **Backup:** If a group is silent, walk over and ask: "Which token are you spending first?" Force a decision.

  **Risk 2: The Philosophy Kid ("Appeal to Tradition Fallacy")**
  *   **The Trap:** They argue that *any* tradition without a current reason should die.
  *   **The Counter:** Do not argue logic. Argue **Risk.**
  *   **Script:** "You're right. Logically, the burden of proof is on the keeper. But practically: If you abolish the Bell rule and you're wrong, you lose 4 minutes. If you abolish the Door rule and you're wrong, the ESL program dies. Does the *cost of being wrong* change how much evidence you need?"
  *   **Why this works:** It validates their logic but adds a variable (consequence) they might have ignored. It moves the debate from "Is it logical?" to "Is it safe?"

  **Risk 3: Overcorrection ("Never Change Anything")**
  *   **Fix:** Hammer School B (Bell) and School C (Slots) in the debrief.
  *   **Script:** "Did anyone think we should keep the Bell rule? No? Good. Chesterton's Fence doesn't mean 'never tear down fences.' It means 'check for tigers first.' The Bell had no tiger. The Door might."
  *   **Goal:** Ensure they leave knowing the Door case is *different* from the Bell case.

  **Risk 4: "Covert Campaign" Accusations**
  *   **Fix:** Your neutrality in the reveal is key. Do not say "We should abolish the door." Say "The Council votes in two weeks. You now know more than most voters. Use that."
  *   **Advisor Safety:** If the advisor asks, show them the packets. "We analyzed policy logic using hypothetical cases. The fact that they matched reality is a coincidence of using local examples." (Technically true, you disguised the names).

  ### 6. What This Activity Cannot Reproduce (Be Straight)
  Tell them this in the last 2 minutes. It builds trust.

  1.  **The Answer Key Problem:** "In this game, I knew the ESL program existed. In real life, **nobody knows.** The Council doesn't know. I don't know. You might abolish the rule and *then* find out the tutoring dies. This game makes investigation look cleaner than it is."
  2.  **The Time Compression:** "Real policy takes months. We did it in 15 minutes. You won't have enough time to know everything before you vote. You have to vote on probabilities."
  3.  **The Stake:** "Here, nothing happens if you vote wrong. Out there, freshmen lose a staircase or tutors lose a room. Feel the weight of that."

  ### 7. Summary Checklist for You
  *   [ ] Print 5 packets (20 pages).
  *   [ ] Write Answer Key on a card in your pocket.
  *   [ ] Cut 15 Index Card tokens.
  *   [ ] Tape "KEEP" and "ABOLISH" signs on opposite walls.
  *   [ ] Buy pizza.
  *   [ ] **Do not** mention the Student Council vote until the Reveal (0:25).

  This plan keeps you neutral (you're teaching *how* to think, not *what* to think), engages the pizza kids physically, and gives the philosophy kid a richer framework (Risk vs. Logic) without shutting them down.
