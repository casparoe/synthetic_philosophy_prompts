          *   *Commitment:* If we can predict the choice, we have explained the behaviour.

      *   **Philosophy of Action (PoA):**
          *   *Core Commitment:* Agency. Actions are done *for reasons*. Akrasia is acting against one's *best judgement* (Socratic/Platonic/Aristotelian tradition).
          *   *Model:* Judgement vs. Desire. A resolution is not just a strong desire; it's a normative stance.
          *   *Explanation:* Akrasia is a failure of rationality or agency, not just a change in valuation. It involves a specific phenomenology (guilt, regret, recognition of error).
