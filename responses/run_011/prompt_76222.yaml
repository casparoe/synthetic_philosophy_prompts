answer: |-
  Your diagnosis is astute, and your hypothesis—that the stalemate arises from category errors regarding the function of the word 'self-control'—is the standard conciliatory position. However, I contend that the split is not merely verbal, nor is it simply a matter of descriptive versus normative aims. There is a substantive, ontological disagreement regarding the architecture of agency that prevents the two literatures from merging, even if they cease firing past one another.

  The impasse persists because behavioural economics (BE) and the philosophy of action (PoA) hold incompatible commitments regarding the reducibility of judgement to preference. To see why this is not merely a difference in vocabulary, we must examine what each side is committed to when they claim to have 'explained' a failure of self-control.

  ### The Substantive Clash: Reductionism vs. Normative Realism

  The behavioural economist is committed to **revealed preference theory**. On this view, if an agent chooses $A$ over $B$, they reveal a preference for $A$. When an agent signs up for a gym membership in January ($t_0$) but fails to attend in February ($t_1$), the BE explanation is that the preference ordering at $t_0$ differed from the preference ordering at $t_1$ due to hyperbolic discounting. The 'sophisticated' agent anticipates this reversal and employs precommitment.

  The philosopher of action is committed to the **possibility of synchronic irrationality**. For the philosopher, the paradigmatic case of *akrasia* is not a preference reversal, but a failure to act on a judgement one *continues to hold* at the time of action. At $t_1$, the akratic agent judges that, all things considered, they ought to go to the gym, yet they stay on the sofa.

  Here lies the real disagreement. For the economist, if the agent stays on the sofa at $t_1$, it must be because, at $t_1$, the utility of the sofa outweighs the utility of the gym. To say otherwise is to violate the axiom of utility maximisation. The economist reduces the 'best judgement' to the preference of the long-term planning self.

  For the philosopher, this reduction is fatal to the phenomenon. If the agent at $t_1$ truly prefers the sofa, they are acting rationally according to their current lights; there is no *akrasia*, only a change of mind. To preserve the concept of weakness of will, the philosopher insists that 'judgement' and 'desire' are distinct mental states. One can desire the sofa while judging the gym to be better.

  Therefore, the disagreement is not verbal. It is about whether the 'best judgement' can be represented as a point on a discount curve.
  *   **BE Commitment:** Yes. A resolution is simply a high-weighting of future utility.
  *   **PoA Commitment:** No. A resolution is a normative constraint that operates differently from a desire. It has a different 'direction of fit'.

  If the economist is right, the philosopher is chasing a ghost; there is no such thing as acting against one's own current motivational set. If the philosopher is right, the economist's model is systematically misdescribing the data, treating normative failures as mere preference shifts.

  ### Hidden Empirical and Formal Questions

  Since the disagreement rests on the architecture of the mind, we cannot resolve it through conceptual analysis alone. We require empirical or formal results that distinguish between a 'preference reversal' model and a 'judgement-overridden' model. Three specific avenues offer the possibility of adjudication.

  **1. The Stability of Valuation vs. Judgement under Stress**
  If BE is correct, 'willpower' failures should correlate with shifts in the discount parameter $\beta$. As cognitive load increases or proximity to reward decreases, the discount rate should spike.
  If PoA is correct, the *judgement* of what is best should remain stable even as the *motivation* to pursue it decays.
  *   **The Test:** Elicit both choice data and normative judgements simultaneously under varying cognitive loads. Do agents report that the sofa is *better* than the gym when tired (BE prediction), or do they report the gym is better but choose the sofa (PoA prediction)?
  *   **Current Status:** Some dual-process data supports the PoA view (System 2 holds the judgement, System 1 drives the choice), but BE often absorbs this by modelling System 1 and System 2 as competing utility functions. To decide this, we need to know if the 'System 2' valuation actually changes or merely loses causal efficacy.

  **2. The Phenomenology of Regret and Anticipation**
  BE models regret as the difference between realised utility and the utility of the foregone option. PoA models regret as the recognition of a normative violation.
  *   **The Test:** Measure the intensity of regret in 'sophisticated' agents (who precommit) versus 'akratic' agents (who do not). BE predicts the sophisticated agent avoids regret by aligning choices with future preferences. PoA suggests that if the precommitment is external (e.g., a financial penalty), the agent might feel relief, not the specific moral regret associated with *akrasia*.
  *   **The Decider:** If agents feel distinct 'guilt' (normative) even when their utility is maximised by the indulgence, the utility function is missing a variable. If guilt tracks only with utility gaps, BE wins.

  **3. Formal Consistency of Time-Indexed Preferences**
  Can a discounting framework represent a 'resolution' without collapsing it into a preference?
  *   **The Question:** In standard models, a resolution is a constraint on the choice set. But if the agent can violate the resolution, it is not a hard constraint. If it is a soft constraint (a cost function), it is just another preference.
  *   **The Formal Challenge:** To model *akrasia* formally, one needs a lexicographic preference structure or a 'rule-following' utility function where following the rule has infinite or discontinuous value compared to consumption. Standard continuous discount functions cannot capture the *categorical* nature of a moral or prudential resolution.
  *   **The Decider:** If human choice data exhibits discontinuities consistent with rule-following (e.g., absolute abstention rather than moderated consumption) that cannot be fitted by quasi-hyperbolic models without ad hoc parameters, the PoA view gains traction.

  ### What Counts as Progress?

  You asked what would constitute progress rather than mere volume. At present, both sides are engaged in what might be called 'defensive modelling'. Economists add parameters to fit anomalies (guilt, identity); philosophers refine definitions to insulate *akrasia* from empirical falsification.

  **Progress would look like a unified formalism that preserves the normative distinction.**

  1.  **Beyond Revealed Preference:** Economics must abandon the strict identification of choice with welfare in cases of self-control. It needs to accept that the $t_0$ self's judgement might be the normative benchmark, even if the $t_1$ self reveals a different preference. This is already happening in 'libertarian paternalism', but it needs a stronger theoretical foundation than just 'mistakes'.
  2.  **Naturalising the Normative:** Philosophy must accept that 'judgements' are causally efficacious states that can be weakened, strengthened, or bypassed. They are not magical non-natural properties. If a judgement does not motivate, in what does its existence consist?
  3.  **The Integration:** A successful theory would model the agent not as a sequence of selves, but as a single agent with **competing control systems**. One system computes value (discounting); the other computes rules (normative judgement). *Akrasia* occurs when the value system overrides the rule system, despite the rule system retaining authority.

  This moves the debate from 'is it preference or judgement?' to 'how do rule-based and value-based systems interact in the brain?'. This is the domain of neuroeconomics, but thus far, it has largely favoured the BE reduction. Progress requires neuroeconomics to identify distinct neural substrates for 'normative endorsement' that are dissociable from 'valuation'.

  ### Conclusion

  Your hypothesis that they answer different questions is half-right. They do answer different questions, but they both claim their answer exhausts the phenomenon. The economist claims the preference reversal *is* the lack of self-control. The philosopher claims the preference reversal is merely the *occasion* for the lack of self-control, which is actually a failure of rational authority.

  The split is not verbal; it is a disagreement about whether the human mind is fundamentally a maximisation engine or a rule-following agency. Until we have a model that can formally represent a rule that an agent acknowledges as binding but fails to follow—without simply treating that failure as a revealed preference for breaking the rule—the stalemate will remain. Progress lies not in better discount functions, nor in finer conceptual distinctions, but in a cognitive architecture that allows for the coexistence of conflicting evaluative standards within a single moment of choice.
