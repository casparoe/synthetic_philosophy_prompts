      *   *Regret Patterns:* BE predicts regret based on utility gaps. PoA predicts regret based on normative violation. Do people regret things they didn't actually prefer at the time?
      *   *Formal:* Can we model a "normative constraint" within a utility function without collapsing it into just another utility? (e.g., Lexicographic preferences).

