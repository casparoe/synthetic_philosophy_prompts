  **JOINT STATEMENT ON THE STATUS OF THE CHARTER**

  **Part 1: Agreed Claims**

  1.  The original Charter contained Rules C1, C2, and C3 as described in the preamble to this statement.
  2.  Rule C2 allowed any rule to be changed by an adopted proposal. Rule C3 forbade changing Rule C3. We agree these two rules cannot be given full effect at the same time.
  3.  Proposal 1 (repealing C3) received six votes for and five against. Proposal 2 (changing C1 to a two-thirds rule) received seven votes for and four against. Proposal 3 (ratifying Proposal 1 and past proposals) received eight votes for and three against.
  4.  For a period of two years, all enrolled players acted as though the two-thirds rule was in force, and no player objected during that time.
  5.  There is no court, outside authority, or higher power that will decide this dispute for us.
  6.  Nothing outside this game can settle which rule gives way when C2 and C3 conflict.
  7.  We all prefer an honest resolution over a convenient one, even if we disagree on what honesty requires in this case.

  **Part 2: Surviving Disagreements**

  | The Disagreement | The Acceptance Camp States It As... | The Authorization Camp States It As... | Neutral Description | Type |
  | :--- | :--- | :--- | :--- | :--- |
  | **Source of Authority** | A rule is part of the Charter because we play by it and accept it. | A rule is part of the Charter only if a prior valid rule authorized its creation. | What makes a rule binding on the players. | Substantive |
  | **Status of Proposal 1** | Proposal 1 became valid because we treated it as valid immediately. | Proposal 1 was void at the moment of voting because C3 blocked it. | Whether Proposal 1 changed the Charter at the time it was voted on. | Substantive |
  | **Power of Ratification** | Proposal 3 fixed the past because we agreed to let it fix the past. | Proposal 3 was just another unauthorized act because the body voting lacked authority. | Whether a later vote can cure an earlier lack of authority. | Substantive |
  | **Required Remedy** | We should continue playing under the current rules. | We should sign a new Charter to restart the chain of authority. | What step is needed to restore certainty to the game. | Substantive |

  *Note on Labels:* We have kept the labels "Acceptance" and "Authorization" because both sides accept them as accurate descriptions of their primary focus. Neither side feels misnamed.
  *Note on Type:* We mark these differences as **Substantive** because they lead to different actions (continuing vs. restarting), not just different definitions. While some arguments involve the meaning of words like "adopted," the consequence of that meaning changes how we play, so the disagreement is not merely verbal.

  **Part 3: The Cruxes**

  **Crux 1: The Power of Practice**
  *   **The Case:** Variant (a): Suppose C2 had said no proposal may be adopted during the first year, one was adopted in month three, and everyone played under it for a decade.
  *   **Expectations:** The Acceptance camp expects this to show that time and usage validate rules. The Authorization camp expects this to show that a long error is still an error.
  *   **Reason to Change Mind:** The Acceptance camp would reconsider if players had objected during that decade but were ignored. The Authorization camp would reconsider if all eleven players signed a statement agreeing the decade of play counted as a valid founding.

  **Crux 2: The Limit of Amendment**
  *   **The Case:** Variant (c): Suppose a new rule says it may be amended only by a unanimous proposal, and ten of us later amend it over one dissent.
  *   **Expectations:** The Acceptance camp expects this to show that the group's will overrides the procedural lock if everyone acts on it. The Authorization camp expects this to show that a procedural lock binds the group until everyone agrees to break it.
  *   **Reason to Change Mind:** The Acceptance camp would reconsider if the dissenting player was coerced. The Authorization camp would reconsider if the group unanimously agreed that the lock was only a warning, not a barrier.

  **Crux 3: Reliance on Officials**
  *   **The Case:** Variant (b): Suppose a rule appoints one player to certify results and she certifies a proposal that plainly lacked the votes, and everyone acts on the certification for years.
  *   **Expectations:** The Acceptance camp expects this to show that reliance on an official makes the result real. The Authorization camp expects this to show that an official cannot grant authority they do not possess.
  *   **Reason to Change Mind:** The Acceptance camp would reconsider if the official knew the vote count was wrong and lied. The Authorization camp would reconsider if the Charter explicitly said the official's certification is final even if mistaken.

  **Crux 4: Resetting Authority**
  *   **The Case:** Variant (d): Suppose all eleven of us sign a statement saying that the rule set we are now playing by is the Charter and always was.
  *   **Expectations:** The Acceptance camp expects this to prove the current rules are valid. The Authorization camp expects this to prove a new Charter has been founded.
  *   **Reason to Change Mind:** The Acceptance camp would reconsider if players signed but immediately claimed they were forced. The Authorization camp would reconsider if players signed and agreed this counted as an amendment under the old rules rather than a new founding.

  *Flag:* Neither camp claims their position is unfalsifiable. Both camps have identified specific conditions under which they would change their view.

  **Part 4: Closing**

  We are still arguing about whether the authority of our rules comes from our past actions or from the text we started with. We have stopped arguing about the facts of the votes, the need for honesty, and the desire to keep playing together. We now think this game is an example of the difficulty of maintaining a self-contained system of rules when those rules conflict, and of the tension between following the law as written and following the law as lived.
