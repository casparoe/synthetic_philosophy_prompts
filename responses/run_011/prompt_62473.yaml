answer: |-
  You have identified a sophisticated rhetorical pattern that sits at the intersection of historiography, moral philosophy, and informal logic. While there is no single term that captures the entire three-part phenomenon you describe, the components are well-documented in specific literatures. The third feature, which troubles you most, is a specific application of a concept from the philosophy of science known as an **Immunizing Stratagem** (or *Ad Hoc Rescue*), adapted here for moral reasoning.

  Here is a breakdown of the existing concepts that map onto your three features, followed by a proposed definition and boundary test for the third feature.

  ### 1. The Moral/Epistemic Split (Feature One)
  **Existing Concept:** *The Asymmetry of Moral and Epistemic Norms.*

  There is literature on why we treat scientific error differently from moral error. In the philosophy of science, we accept **Epistemic Progress**: Newton was "wrong" about gravity because we have better data. In moral philosophy, however, many argue for **Moral Realism** or **Moral Progress** in a different sense: we do not say slavery was "wrong for us but right for them"; we say it was always wrong, but they failed to recognize it.

  The student's move relies on **Ethical Relativism** applied selectively. They treat moral knowledge as if it were technological knowledge (something that accumulates over time) rather than normative truth (something that might be accessible to reason at any time).
  *   **Distinction:** A legitimate historical distinction acknowledges that *social enforcement* of morals changes, while the *moral status* of the act might not. The student conflates the two, arguing that because the *sanction* was absent, the *wrongness* was absent.

  ### 2. The Elasticity (Feature Two)
  **Existing Concept:** *Motivated Reasoning* (specifically *Identity-Protective Cognition*).

  This is well-covered in social psychology (e.g., the work of Dan Kahan or Jonathan Haidt). When a historical figure is part of a student's "team" (national heroes, founders), the brain engages in **Confirmation Bias** to protect that identity.
  *   **Distinction:** This explains *why* they do it, but not the *logical structure* of how they do it. It accounts for the elasticity, but not the specific mechanism of the shifting criteria.

  ### 3. The Shifting Criterion (Feature Three)
  **Existing Concept:** *Immunizing Stratagems* (Karl Popper / Hans Albert).

  This is the nearest established concept to your third feature. In the philosophy of science, an **Immunizing Stratagem** occurs when a theory is threatened by contradictory evidence. Instead of abandoning the theory, the defender adds an *ad hoc* hypothesis to explain away the anomaly, protecting the core theory from falsification.

  *   **Core Theory:** "Jefferson is not morally blameworthy."
  *   **Anomaly 1:** "But slavery existed."
  *   **Ad Hoc Rescue 1:** "Everyone did it then." (Criterion: Consensus)
  *   **Anomaly 2:** "But Bartolomé de las Casas/Quakers protested then."
  *   **Ad Hoc Rescue 2:** "They were powerless/ignored." (Criterion: Efficacy)
  *   **Anomaly 3:** "But he could have freed them in his will."
  *   **Ad Hoc Rescue 3:** "It would have ruined his family's finances." (Criterion: Personal Cost)

  In logic, this is also called **Ad Hoc Rescue** or **Moving the Goalposts**. However, those terms are generic. In the context of moral history, I propose we call this **Ad Hoc Exculpation**.

  ### Defining "Ad Hoc Exculpation"
  If you wish to name this specific maneuver in your classroom or writing, **Ad Hoc Exculpation** is precise. It can be defined as:

  > *A defensive argumentative structure in which the criteria for moral exoneration are not established prior to the examination of evidence, but are sequentially modified in response to counter-evidence to preserve a fixed conclusion of non-blame.*

  ### The Boundaries: Legitimate Revision vs. Ad Hoc Exculpation
  You asked for the boundaries: what counts as a legitimate revision of criterion rather than a retreat? This is the crux of the pedagogical problem. Historians *do* revise their judgments based on new contexts. How do we distinguish professional nuance from student special pleading?

  There are three boundary markers:

  **1. Ex Ante vs. Ex Post Criteria**
  *   **Legitimate:** The historian states the standard *before* applying it. ("To judge this figure fairly, we must look at what was legally possible in 1790.") If evidence shows it *was* legally possible to manumit, the judgment changes.
  *   **Ad Hoc Exculpation:** The standard is invoked *after* the challenge. The conclusion ("He is excusable") is fixed; the standard is the variable.
  *   **Test:** Ask the student: "Before we looked at the evidence about abolitionists, what specifically would have counted as blameworthy behavior for Jefferson?" If they cannot answer, it is ex post rationalization.

  **2. Conclusion Stability**
  *   **Legitimate:** New evidence alters the verdict. If you show a legitimate historian that a figure had more agency than thought, their moral assessment usually becomes *harsher*.
  *   **Ad Hoc Exculpation:** The verdict is invariant. No matter how much agency, dissent, or feasibility is revealed, the figure remains "a product of his time."
  *   **Test:** Ask: "What evidence *would* change your mind? What would Jefferson have had to do, or not do, for you to judge him negatively?" If the answer is "nothing" or "well, he'd have to be a time traveler," the defense is unfalsifiable.

  **3. Consistency of Application**
  *   **Legitimate:** The criterion applies across the board. If "personal cost" excuses Jefferson, it must excuse a disliked figure (e.g., a Confederate general or a radical revolutionary) in a similar bind.
  *   **Ad Hoc Exculpation:** The criterion is elastic (your Feature 2). "Personal cost" excuses the hero; "following orders" does not excuse the villain.
  *   **Test:** Apply the student's latest criterion to a figure they dislike. If they reject the criterion for the villain, they are engaged in Ad Hoc Exculpation.

  ### Summary for the Classroom
  You are dealing with a **Moral Immunizing Stratagem**. The student is treating the figure's moral standing as a falsifiable theory that they are protecting from refutation.

  To disrupt this, do not attack the criteria individually (e.g., arguing about whether manumission was financially feasible). Attack the **structure**.

  **The Intervention:**
  > "You are using a method of judgment that makes it impossible for anyone to be wrong. If 'everyone did it' excuses him, but 'some didn't do it' doesn't condemn him, and 'it cost too much' excuses him even if 'some didn't pay the cost,' then you have not defined a standard of judgment. You have defined a shield. Before we discuss Jefferson, tell me: **What specific action, available to a man in 1790, would have made him blameworthy in your eyes?** If the answer is 'nothing,' then we aren't doing history; we're doing hagiography."

  This forces the **Ex Ante** condition. It requires them to risk the verdict before they see the evidence, which is the only way to distinguish historical nuance from Ad Hoc Exculpation.
