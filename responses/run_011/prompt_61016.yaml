answer: |-
  Your intuition that the standard "Bernoulli solved it" story is incomplete is correct. If you publish the draft as it stands, you will be propagating a common misconception that glosses over the actual teeth of the problem. The St. Petersburg Paradox is not a historical curiosity; it is a live grenade in the foundations of expected utility theory (EUT).

  Below is a diagnosis of the defective steps in your reasoning, followed by a proposed restructuring of your FAQ entry that captures the modern decision-theoretic consensus.

  ### Part 1: Diagnosis of the Defective Reasoning

  Your draft contains three specific conceptual errors. Identifying these is crucial for the FAQ's accuracy.

  **1. The Category Error: Normative vs. Descriptive**
  *   **Your Draft:** "The paradox is then just a measurement problem about how much weight to give revealed preference."
  *   **The Defect:** You are treating the paradox as a failure of *descriptive* accuracy (humans don't pay infinity, so our model should match that). The paradox is actually a failure of *normative* coherence.
  *   **Why it matters:** Expected Utility Theory claims to describe what a *rational* agent *ought* to do. If EUT implies a rational agent *should* mortgage their house to play a game that pays out $2 most of the time, EUT is prescribing absurdity. It doesn't matter that humans are too "irrational" to do it. The paradox shows that the definition of rationality itself yields undefined or absurd prescriptions under certain conditions. Revealed preference isn't the calibration tool; it's the intuition pump telling us the math is broken.

  **2. The Historical Error: Bernoulli vs. Menger**
  *   **Your Draft:** "Daniel Bernoulli dissolved the whole thing in the 1730s... the expected utility sum converges."
  *   **The Defect:** Bernoulli solved the paradox for *expected value* by introducing *utility*, but he assumed utility was logarithmic in wealth. In 1934, Karl Menger proved that for **any** unbounded utility function, one can construct a "Super St. Petersburg" game that diverges.
  *   **Why it matters:** If your utility function is $U(w) = \log(w)$, I can offer you a game that pays $e^{2^n}$ instead of $2^n$. The expected utility diverges again. Bernoulli didn't solve the paradox; he just moved the goalposts from "money" to "utility." The paradox re-emerges immediately if utility is unbounded.

  **3. The Structural Error: Relocating vs. Resolving**
  *   **Your Draft:** "Is the log-utility response... a dodge?"
  *   **The Defect:** It is a dodge, but not because it "pushes it out to the tails." It is a dodge because it requires an axiom that many decision theorists find costly: **Bounded Utility**.
  *   **Why it matters:** To truly kill St. Petersburg, you must assert that there is a maximum possible amount of utility an agent can experience (a saturation point). This violates the principle of *dominance* (if Game A pays more than Game B in every possible outcome, you should prefer A). If utility is bounded, I can construct two games where A pays more than B in every state, yet they have equal expected utility because both hit the bound. The "hard part" of the paradox is choosing between **Unbounded Utility** (which allows St. Petersburg divergences) and **Dominance Principles** (which forbid them).

  ### Part 2: The "Hard Part" That Survives

  The surviving core of the paradox is not about money or human psychology. It is about the **compatibility of three plausible axioms**:
  1.  **Expected Utility Maximization:** Rational agents maximize the sum of probability-weighted utilities.
  2.  **Unbounded Utility:** There is no upper limit to how good an outcome can be (for any utility $U$, there exists an outcome worth $2U$).
  3.  **Dominance/Continuity:** Basic consistency requirements (if one lottery is strictly better than another in every state, prefer it).

  **Menger's Theorem** essentially states: You cannot have all three.
  *   If you keep 1 and 2, you get St. Petersburg (infinite price).
  *   If you keep 1 and 3, you must reject 2 (Utility must be bounded).
  *   Most modern decision theorists accept that **utility must be bounded**. This is the actual resolution.

  **Why this matters for your audience:** This is the theoretical underpinning of **Pascal's Mugging**. If utility is unbounded, a tiny probability of an astronomically large payoff (saving $3 \uparrow\uparrow\uparrow 3$ lives) dominates any finite cost. Accepting the bounded-utility resolution to St. Petersburg is the only way to immunize rationality against Pascal's Mugging.

  ### Part 3: Proposed FAQ Revision

  Here is a rewritten version of your entry. It preserves your voice but corrects the technical errors and sharpens the focus for a rationalist audience.

  ***

  **Q: The St. Petersburg Paradox suggests a rational agent should pay any finite amount to play a lottery with infinite expected value. Didn't Bernoulli solve this in 1738 with diminishing marginal utility?**

  **A:** Bernoulli solved the paradox for *wealth*, but not for *utility*. The St. Petersburg Paradox remains a live problem in decision theory because it exposes a fundamental tension between **expected utility maximization** and **unbounded preferences**.

  **The Standard Story (and why it's incomplete)**
  The classic setup involves a coin flip paying $\$2^n$ on the $n$th flip. The expected monetary value is infinite. Bernoulli proposed that agents maximize *expected utility*, not money, and that utility is concave (e.g., logarithmic). Since $\log(2^n)$ grows linearly while probability shrinks exponentially, the expected utility sum converges to a finite number.

  However, this is not a general solution. As Karl Menger demonstrated in 1934, for **any** unbounded utility function, one can construct a "Super St. Petersburg" game with payoffs large enough to make the expected utility diverge again. If your utility is unbounded, I can always offer you a lottery you should theoretically pay your entire wealth to enter, even if the probability of a payout is vanishingly small.

  **The Real Conflict**
  The paradox is not a measurement error regarding human risk aversion; it is a normative proof that three intuitive axioms are incompatible:
  1.  **Expectation:** Agents should maximize expected utility.
  2.  **Unboundedness:** There is no limit to how valuable an outcome can be.
  3.  **Dominance:** If Lottery A yields a better outcome than Lottery B in every possible state, A should be preferred to B.

  You can hold any two, but not all three.
  *   If you keep Expectation and Unboundedness, you accept that rational agents should pay infinite prices for certain lotteries (St. Petersburg).
  *   If you keep Expectation and Dominance, you must accept **Bounded Utility**. There must be a theoretical maximum amount of "goodness" an agent can experience, such that adding more resources eventually yields zero marginal utility.

  **The Consensus Resolution**
  Most modern decision theorists accept **Bounded Utility** as the cost of doing business. This resolves St. Petersburg by asserting that the utility sum *must* converge because the utility terms cannot grow indefinitely.

  **Implications for Rationalists**
  Accepting bounded utility is the necessary precondition for rejecting **Pascal's Mugging**. If you reject the bounded-utility resolution to St. Petersburg, you leave yourself vulnerable to arguments that tiny probabilities of astronomically large impacts should dominate all finite decision-making. The St. Petersburg Paradox is therefore not a historical curiosity, but the foundational argument for why rational long-termism must eventually saturate.

  ***

  ### Summary of Changes for Your Draft

  1.  **Shifted the locus of the problem:** From "EV vs. EU" to "Unbounded vs. Bounded Utility."
  2.  **Removed the descriptive appeal:** Deleted the reference to revealed preference/human behavior as the primary justification. The focus is now on normative coherence.
  3.  **Added Menger:** Explicitly credited the 1934 critique to show why Bernoulli wasn't the end of the story.
  4.  **Connected to Pascal's Mugging:** This makes the entry high-value for your specific audience, linking a 17th-century probability puzzle to modern existential risk and AI safety discourse.
  5.  **Clarified the "Cost":** Explicitly stated that the solution requires accepting Bounded Utility, which is a non-trivial philosophical commitment (violating dominance), rather than just "log utility is the answer."

  This structure ensures your FAQ is robust against the "actually, what if the payoff is $e^{2^n}$?" counterargument that usually derails these discussions on forums.
