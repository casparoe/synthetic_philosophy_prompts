  The phenomenon you describe does not have a single, universally agreed-upon label in analytic philosophy, but it is a recognizable composite of two established concepts: the **Motte-and-Bailey Doctrine** (as the conversational mechanism) and the **Floating Signifier** (as the linguistic ontology).

  However, because existing terms often imply strategic deceit (Motte-and-Bailey) or acknowledged ambiguity (Floating Signifier), neither fully captures the *sincere, systemic blindness* you observe. The specific pattern of "Intensional Agreement, Extensional Disagreement" sustained by a social norm against meta-linguistic scrutiny is best carved out as **Structural Equivocation** or **Doxastic Decoupling**.

  Here is the carving you requested.

  ### 1. The Diagnosis: Why Orwell and Gallie Miss It

  *   **Orwell's "Meaningless Words":** Orwell describes words that have *no* cognitive content, serving only as emotional stimuli (e.g., "romantic," "values"). Your case differs because the word *does* carry cognitive content; it makes a factual claim ("This policy is X"), invites evidence, and survives definitional scrutiny. It is not empty; it is **overloaded**.
  *   **Gallie's "Essentially Contested Concepts":** Gallie (1956) describes concepts where parties *know* they disagree on the conception (e.g., "Art," "Democracy") and recognize the contestation as legitimate. In your case, the contestation is **denied**. The interlocutors insist they mean the *same* thing. The disagreement is not acknowledged as semantic; it is masquerading as factual.

  ### 2. The Established Components

  To understand the pattern, we must combine two existing frameworks:

  **A. The Mechanism: The Motte-and-Bailey Doctrine (Shackel, 2005)**
  This explains the conversational dynamic: *"Definition conceded then quietly dropped."*
  *   **The Motte:** The defensible, narrow definition your interlocutor accepts enthusiastically.
  *   **The Bailey:** The controversial, expansive application where the term does the actual work (e.g., labeling a policy they dislike).
  *   **The Shift:** When you press the definition, they retreat to the Motte ("But I defined it as X!"). When you stop pressing, they occupy the Bailey ("Therefore, this policy is X").
  *   **Why it fits your case:** It explains why the definition is accepted but ignored. It explains why pressing the point is treated as pedantry (you are attacking the Motte, which is defensible, while they are living in the Bailey).

  **B. The Ontology: The Floating Signifier (Laclau, 1990s)**
  This explains the linguistic status: *"Examples pull in opposite directions."*
  *   A floating signifier is a term emptied of fixed content so it can unite disparate groups under a common banner (e.g., "Freedom," "Justice," or your pejorative).
  *   **Why it fits your case:** It explains how two colleagues can apply the same label to opposite economic tendencies (planning vs. anti-planning). The term does not describe the *structure* of the policy; it describes the *affective relation* to the policy, while pretending to describe the structure.

  ### 3. The Carving: "Doxastic Decoupling"

  Since neither term alone captures the *sincere systemic blindness* (where both parties believe they agree), I propose refining this intersection as **Doxastic Decoupling**.

  **Definition:**
  A linguistic state in which a community maintains **Intensional Agreement** (shared definition) alongside **Extensional Disagreement** (divergent application), sustained by a social norm that treats meta-linguistic scrutiny as pedantry rather than clarification.

  **The Four Necessary Conditions:**
  1.  **Factual Masquerade:** The term is presented as a descriptive/factual claim, not an expression of taste or emotion.
  2.  **Intensional Stability:** A definition can be elicited and is verbally agreed upon by all parties.
  3.  **Extensional Volatility:** The application of the term contradicts the agreed definition or contradicts the application of other users, without triggering a sense of inconsistency.
  4.  **Immunity to Scrutiny:** Attempts to align extension with intension are rebuffed not as substantive disagreements, but as social failures (pedantry, missing the point).

  ### 4. The Edges: Near Misses vs. Instances

  To use this carving effectively, you must distinguish it from similar phenomena.

  | Feature | **Instance (Doxastic Decoupling)** | **Near Miss (Gallie)** | **Near Miss (Orwell)** | **Near Miss (Polysemy)** |
  | :--- | :--- | :--- | :--- | :--- |
  | **Claim Type** | Factual / Descriptive | Normative / Evaluative | Emotional / Expressive | Factual / Descriptive |
  | **Definition** | Agreed upon, then ignored | Contested openly | Unavailable / Vague | Multiple distinct meanings |
  | **Awareness** | **Unconscious** ("We mean the same") | **Conscious** ("We disagree on conception") | **N/A** (No content) | **Conscious** ("It depends on context") |
  | **Reaction to Scrutiny** | "You are being pedantic." | "This is a deep philosophical dispute." | "You know what I mean." | "Ah, I meant sense B." |
  | **Examples** | Contradictory (Planning & Anti-Planning) | Divergent but coherent | None (Vibes only) | Distinct (Bank of river vs. Bank of money) |

  ### 5. Why This Distinction Matters

  Identifying this pattern allows you to stop fighting on the **Bailey** (the specific examples) and expose the **Decoupling**.

  *   **In a Verbal Dispute:** You resolve it by stipulating definitions.
  *   **In Gallie's Contest:** You resolve it by acknowledging different conceptions.
  *   **In Doxastic Decoupling:** You cannot resolve it by defining, because the definition is already agreed upon and being ignored.

  The move required is to point out the **Extensional Volatility**. You must show that the term is functioning as a **Shibboleth** (a marker of group membership) rather than a **Classifier**. When your colleague calls a policy "X," they are not classifying it; they are signaling allegiance. The "factual claim" is a costume worn by the signal.

  **Summary Label:** If you need a single established term to search for, **The Motte-and-Bailey Doctrine** is the functional mechanism, but **Floating Signifier** is the structural reality. If you are naming the phenomenon itself for your own work, **Doxastic Decoupling** or **Structural Equivocation** captures the specific "agreement on definition, disagreement on reality" dynamic you have isolated.
