answer: |-
  # The Concord Protocol: A Seminar Game on Moral Judgment

  ## 1. Materials List (Print in Advance)

  *   **Incident Deck (10 cards):** Short scenarios (100 words max) describing a provocation or loss. (e.g., "A colleague takes credit for your idea," "A friend forgets a significant promise," "You are criticized for a delay caused by weather").
  *   **Agent Secret Sheets (14):** Small slips with fields for `Felt Intensity (0-10)`, `Displayed Intensity (0-10)`, and `Ideal Verdict`.
  *   **Spectator Verdict Cards (40):** Colored index cards (foldable). Fields for `Approval (Yes/No)`, `Estimated Intensity (0-10)`.
  *   **Norm Role Cards (4):** Two marked "Group A" (Restraint = Virtue), Two marked "Group B" (Expression = Virtue).
  *   **Token Budget:** 50 poker chips or colored counters per subgroup.
  *   **Verdict Box:** A shoebox or envelope for collecting sealed verdict cards.
  *   **Scoreboard:** Whiteboard space divided into 4 quadrants (one per round).
  *   **TA Scoring Key:** A single sheet with the formulas below.

  ## 2. Timeline (100 Minutes)

  *   **00:00 – 00:10:** **Setup.** Distribute roles. Explain tokens are "Social Capital." No mention of Smithian theory.
  *   **00:10 – 00:25:** **Round 1 (Concord & Abatement).** One Agent, 13 Spectators. Focus on intensity matching.
  *   **00:25 – 00:40:** **Round 2 (Double-Sympathy).** One Agent, One Target (played by TA or scripted), 12 Spectators. Focus on desert.
  *   **00:40 – 00:55:** **Round 3 (Hidden-Norm).** Split room (Left/Right). Different Norm Cards. Focus on cultural variance.
  *   **00:55 – 01:10:** **Round 4 (Proximity).** Two subgroups. Different vividness versions of same incident. Fixed token budget.
  *   **01:10 – 01:20:** **Ledger Reveal & Scoring.** Agents reveal `Felt` vs `Displayed`. TA calculates costs. Compare `Ideal Verdict` to Room Verdict.
  *   **01:20 – 01:30:** **Debrief Questions.** (See Section 6).
  *   **01:30 – 01:40:** **The Reveal.** Introduce "Impartial Spectator" and Part III. Connect the `Ideal Verdict` gap to conscience.

  ## 3. Scoring Rules (TA-Proof)

  **General:** The Agent seeks to maximize **Social Capital (SC)**. Spectators seek to maximize **Accuracy Points (AP)**.

  **Round 1: The Concord Bid (Rule a & b)**
  1.  **Agent:** Writes `Felt (F)` (secret) and announces `Displayed (D)` (public).
  2.  **Spectators:** See Incident and `D`. Write `Estimated Felt (E)` and `Approval (Yes/No)` on Verdict Card. Seal in Box.
  3.  **Scoring:**
      *   **Agent SC:** +1 point for every `Yes`. **Minus** 2 points for every unit of difference between `F` and `D` (calculated privately by TA at end).
      *   **Spectator AP:** 1 point if `Approval` matches the Room Majority. 1 bonus point if `E` is within ±2 of the Agent's actual `F`.
      *   **Abatement Cap (Rule b):** TA checks Spectator `E`. If any Spectator estimates `E` > 70% of Agent's reported `F`, that Spectator loses all AP for the round. (This enforces the structural asymmetry).

  **Round 2: Double-Sympathy (Rule c)**
  1.  **Setup:** Agent reacts to a Target (TA reads a script: "I didn't mean to harm you, I'm indifferent to your loss").
  2.  **Spectators:** Vote `Approval` on Agent's reaction.
  3.  **Scoring:**
      *   **Agent SC:** +1 for every `Yes`.
      *   **Verdict Logic:** TA records the % of `Yes`. If the Target script was "Unmoved/Innocent," the Room Majority usually rejects the Agent's high intensity.
      *   **Data Point:** Record the gap between Agent's expectation of Approval and Actual Approval.

  **Round 3: Hidden-Norm (Rule d)**
  1.  **Setup:** Room split Left/Right. Left gets Norm Card A ("Restraint is Virtue"). Right gets Norm Card B ("Expression is Virtue").
  2.  **Spectators:** Vote `Approval` based on their Norm Card's instruction regarding the *same* Agent Display.
  3.  **Scoring:**
      *   TA calculates Approval % for Left vs. Right separately.
      *   **Reveal:** Only after scores are posted, students reveal Norm Cards.
      *   **Data Point:** The divergence in Approval % despite identical Incident and Display.

  **Round 4: Proximity (Rule e)**
  1.  **Setup:** Group 1 gets Incident "Friend in next room." Group 2 gets "Stranger overseas."
  2.  **Budget:** Each group gets 10 Tokens total to distribute as `Approval` among a panel of 3 Agents (rotated quickly).
  3.  **Scoring:**
      *   TA records Tokens spent per Agent per Group.
      *   **Data Point:** Total Tokens spent by Group 1 vs. Group 2. (Group 1 should spend more, showing scarcity of sympathy).

  **Private Ledger (The Closing Gap)**
  *   **Agent Task:** Before Round 1 begins, Agent fills out `Ideal Verdict`: "What would a spectator approve of if they knew *everything* I know (including my secret F)?"
  *   **Final Calculation:** TA calculates the average Room Approval across all rounds. Compare this to the Agent's `Ideal Verdict`.
  *   **The Number:** The difference between `Ideal Verdict` and `Room Approval` is written on the board as the "Conscience Gap."

  ## 4. Sealing Device

  **The Verdict Box Protocol:**
  To prevent announced verdicts from drifting toward one another (herding):
  1.  Spectators write on Index Cards.
  2.  Cards are folded immediately.
  3.  A "Collector" (student role) walks the room with the Verdict Box.
  4.  No card is opened until all are collected.
  5.  TA shuffles the deck before reading aloud to ensure anonymity and prevent retaliation bias.

  ## 5. Scaling Instructions

  *   **10 Players:** Reduce Spectators. Keep 1 Agent per round. The "Room Majority" is now just 9 votes, making variance higher. Acknowledge this in debrief ("Small societies judge harsher").
  *   **20 Players:** Run two parallel games. Split class into Room A and Room B. Each has an Agent. Compare the Verdicts of Room A vs. Room B at the end. This reinforces Rule (d) (Hidden-Norm) by showing two different "publics" judge the same act differently.
  *   **TA Load:** If scaling to 20, the TA must manage the Scoring Key strictly. Do not allow students to calculate their own scores.

  ## 6. Debrief Questions (Order Matters)

  1.  **Round 1:** "Agents, look at your `Felt` vs. `Displayed`. Did you lower your display to get tokens? How did that suppression feel physically?" *(Tags Rule a)*
  2.  **Round 1:** "Spectators, look at your `Estimated Felt`. Did anyone estimate higher than the Agent reported? Why did the rules penalize that?" *(Tags Rule b)*
  3.  **Round 2:** "The Agent felt justified. The Target was unmoved. The Room sided with the Target. Why did your approval depend on the Target's feeling, not the Agent's?" *(Tags Rule c)*
  4.  **Round 3:** "Left Side, you approved. Right Side, you rejected. The Act was identical. What determined the virtue of the act?" *(Tags Rule d)*
  5.  **Round 4:** "Group 1 spent 8 tokens. Group 2 spent 3 tokens. The need was the same. What ran out?" *(Tags Rule e)*
  6.  **Ledger:** "Look at the 'Conscience Gap' on the board. You wrote down what a *fully informed* judge would say. The Room gave you something else. Which one feels more like 'justice'?"
  7.  **Synthesis:** "If the Room's verdict changes based on seating (Round 3) and distance (Round 4), can the Room be the final source of moral truth? If not, where does the 'Ideal Verdict' you wrote come from?"

  ## 7. Mapping Table: Rules to Smith

  | Rule | Smith Claim Instantiated | Where the Analogy Fails |
  | :--- | :--- | :--- |
  | **(a) Concord Bid** | Propriety depends on the *correspondence* of sentiments, not the truth of the passion. Dissimulation has a psychic cost. | The cost is arithmetic (points), not psychological (shame/exhaustion). Students game the math rather than feel the strain. |
  | **(b) Abatement Rule** | "The emotions of the spectator will never reach to the extravagance of the person principally concerned." (TMS I.i.1.4) | Hard-coding 70% ignores Smith's nuance that sensitivity varies by individual virtue and relationship. |
  | **(c) Double-Sympathy** | We approve of the agent's affection only if we sympathize with the motives of the person acted upon. | The "Target" is scripted, removing the dynamic, real-time feedback loop Smith describes in conversation. |
  | **(d) Hidden-Norm** | Moral judgments are contingent on local custom and the "spirit of the society" we inhabit. | Smith believes some norms are *better* than others (closer to nature); the game implies pure relativism. |
  | **(e) Proximity** | Sympathy is diminished by distance; we have a limited budget of fellow-feeling. | Tokens are finite by rule; in Smith, the limitation is a psychological fact of imagination, not a resource constraint. |

  ---

  ## 8. Candid Reflection

  ### 1. Predictable Failures & Mitigation
  *   **The "Safe Middle" Convergence:** You are correct. Agents will quickly learn that Displaying 5/10 is safer than 9/10.
      *   *Mitigation:* Do not stop it. Let them converge. In the debrief, ask: "Why did everyone become moderate? Was it because you felt moderate, or because you wanted tokens?" This *is* the Smithian point about socialization shaping passion.
  *   **The "Justification" Confusion:** Students will hear "Do you approve?" as "Is this act morally right?" rather than "Can you feel this?"
      *   *Mitigation:* The TA must intervene in Round 1. If a student says, "I voted No because he was rude," the TA says, "Not whether he was rude. Could you *feel* his anger?" Repeat this mantra. If they still struggle, use the Debrief Question 1 to highlight the confusion as data.

  ### 2. Incident Card Constraints
  *   **Avoid:** Sexual violence, deep trauma, political polarization, or specific real-world figures. These trigger personal history that overrides the game mechanics.
  *   **Use:** Professional slights, minor property damage, broken social contracts (lateness, forgotten birthdays), ambiguous insults.
  *   **Why:** Smith's examples are often about "the loss of a finger" vs. "the ruin of an empire." You need low-stakes scenarios where the *reaction* is the variable, not the *tragedy*. If the incident is too heavy, sympathy becomes obligatory, breaking the Abatement Rule.

  ### 3. Limits of the Game (The "Impartial Spectator" Gap)
  *   **Your Suspicion:** You are right. The game cannot reproduce the *pleasure* of mutual sympathy. In the game, sympathy is a currency to be mined. In Smith, it is a relief, a "delight."
      *   *Replacement:* In the final 10 minutes, you must describe this. Tell them: "In the game, you lost points for mismatch. In life, Smith says the mismatch causes pain, but the *match* causes a specific joy that is the foundation of society."
  *   **The "Standing Inner Judge":** The game simulates a single judgment. Part III is about the *habituation* of judgment over a lifetime. The Private Ledger is a proxy for this, but it is a one-time calculation.
      *   *Replacement:* You must explain that the `Ideal Verdict` they wrote is the seed of the Impartial Spectator. Tell them: "You wrote that down because you have already spent years building an inner judge. The game didn't build it; it just asked you to consult it."
  *   **The "Impartial" Problem:** The game proves the Room is *partial* (Rule d). It does not prove the Impartial Spectator exists, only that the Room is insufficient.
      *   *Exposition:* You must supply the leap. "Since the Room failed you (Rule d), and your own passions failed you (Rule a), Smith argues we construct a third thing. That is what you read for next week."

  This design forces the students to inhabit the *problem* of Part I & II (social dependency of judgment) so that Part III (the internalization of that judgment) arrives as a relief, not just a chapter.
