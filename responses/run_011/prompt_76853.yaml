answer: |-
  Good morning. If you can hear me all the way to the back, please raise a hand. Keep them up until the sound cuts out, then put them down. That is the best we can do.

  It is hot. The chairs are hard. We have been sitting for a while. You are thinking about lunch, or the drive home, or the fact that there are sixty-one of us on this stage and three hundred and fifty of you in the seats. You are doing what we were trained to do here. You are looking at the numbers. You are estimating probabilities. You are trying to figure out what happens next.

  For the last four years, many of us have studied how to predict the future using the past. We learned that if you want to know what will happen to you, you find people who are like you, and you see what happened to them. You find the group you belong to. You look at the average. It is a sensible way to move through the world. It keeps us humble. It keeps us safe.

  But today, that method breaks.

  If we look at the history of this college, or this major, or this town, we can find all sorts of groups we fit into. We can find averages for earnings, for happiness, for how many of us will stay in the field we studied. Those numbers exist. They are real. Some of them are comforting. Some of them are not. One of our classmates is moving to Los Angeles in August to try to write for television. She knows the statistics better than anyone. She knows how many scripts are bought. She knows how many shows make it to a second season. Her parents are sitting in the second row, and they know those numbers too.

  If we treat this moment as a prediction, based on the past, the only honest thing to say is that most of us will not do what we say we are going to do. Most of us will change paths. Most of us will encounter barriers we did not expect. The data suggests that the specific things we are celebrating today—the degrees, the honors, the plans—are not reliable predictors of where we will be in ten years.

  So why are we here? Why do we gather to mark a beginning if the map we are holding is drawn from territory that no longer exists?

  It is because the group we belong to is not fixed by what came before. It is fixed by what we do next.

  When we calculate odds, we assume the group is already formed. We assume there is a bucket called "People Who Try To Write For Television" and we just check to see if we fit inside it. But that bucket is not waiting for us. It is built by the people who step into it. The statistics of the past describe people who stopped. They describe people who tried and failed, or people who tried and succeeded, or people who never tried at all. They do not describe us, because we are the ones who are trying now.

  This is the trick of the moment. We want to know who we are. We want to know if we are the kind of people who succeed. But you cannot find that out by looking at the data. You find that out by acting. The reference class—the group of people like us—is not a container we fall into. It is a community we build.

  If my classmate goes to Los Angeles and writes, she is joining a group of people who write. If she stops, she joins a different group. The odds do not decide which group she is in. Her actions do. The same is true for the rest of us. Whether you are going to graduate school, or starting a job, or taking a year to figure it out, the numbers from the past cannot tell you who you are. Only your commitment can do that.

  This is not about ignoring the risks. It is about recognizing that the risk is not a verdict. It is just the cost of entry. When we look at the averages, we are looking at ghosts. We are looking at people who are no longer making choices. We are alive. We are here. We are making choices now.

  So, do not ask yourself what the odds are. Ask yourself who you want to be like. Do not look for the group you fit into. Look for the group you want to create. If you want to be a person who helps others, start helping. If you want to be a person who makes things, start making. The statistics will catch up later. They will record what you did. But they cannot tell you what to do.

  We are sixty-one people. In twenty years, the data will say something about us. It will say how many of us stayed in touch, or how many of us changed careers, or how many of us came back to this hill on a hot day. But today, the data is empty. Today, the only thing that is true is that we are here together.

  To the parents and grandparents: thank you for getting us here. You handled the variables we could not control. You managed the risks when we were too young to understand them. We know the numbers say we might not replicate your success, or we might find success in a different currency. But we promise to take the work seriously.

  To the faculty: thank you for teaching us how to think, even when the thinking makes us uncomfortable. You taught us to question the categories. Today, we are questioning the biggest one: the idea that our future is written by our past.

  And to my classmates: I know we are tired. I know the sun is hot. I know that in an hour, we will scatter. Some of us will go far away. Some of us will stay close. We will enter different reference classes. We will become different data points.

  But for this moment, we are not data. We are not averages. We are not a trend line. We are the people who choose what happens next. The numbers are real, but they are not in charge. We are.

  So let us go make some new statistics. Let us go build a group that future students will look at and wonder how we did it. Let us go be the exception, not because we are special, but because we are willing to do the work that the averages do not count.

  Thank you.

  ***

  I resolved the self-reference problem by shifting the reference class from an epistemic category (a group defined by past similarities used for prediction) to a pragmatic commitment (a group defined by future actions chosen by the agent). This bypasses the need to select the "correct" class for forecasting, instead making the class selection itself the act of will that validates the speech's optimism without denying the base rates.
