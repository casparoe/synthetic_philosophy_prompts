prompt: |-
  Kind of an unusual ask but I'm running out of time and I'm stuck. Im a senior at a small college, philosophy and statistics double major, and somehow I got picked to give the eight-minute student address at our graduation in three weeks (I think the dean's office asked everyone who won the department essay prize and everyone else said no). Class of 61, room of maybe 350 — our parents and grandparents, the whole faculty, plus a chunk of local donors who have heard several hundred of these. Its outdoors, everyone will be hot and tired, and there is no microphone that works reliably.

  Here's the problem. I've written four drafts and every one of them is a reference class fallacy with a nicer haircut. The genre basically requires the speaker to tell 61 people that they're exceptional, that they beat the odds, that they'll do things nobody else will — and it lands every time, in every year's room, for exactly the reason my thesis advisor would hate: the speaker picked a flattering class. Our own program keeps numbers. In something like 25 years of the interdisciplinary major there are maybe 600 graduates, of whom roughly forty went on to doctoral programs, of whom three ended up with tenure-track jobs; and the year before mine, two people out of a class of 58 started companies that no longer exist. Everyone here knows roughly what those numbers look like and nobody says them out loud at a ceremony. Reichenbach's rule — take the narrowest reference class you have decent statistics for — is supposed to tell you what to expect, and then it turns out you can always narrow further, down to a class of exactly one, which is you, where the frequency of everything you'll ever do is trivially one, or always widen out to something like every mammal that has ever died, which is true and useless. And my thesis is on self-locating belief, so I hear it everywhere now: any question about what to expect from being me is a question about who counts as people like me, and the facts never settle that on their own.

  So: write the speech. I do not want the smug inverted version — the "actually, statistically, you're all ordinary, please make peace with it" talk, which is by now its own well-populated reference class and also just cruel in a room full of grandparents. And I don't want the genre's standard move of opening by announcing that you won't be giving us the usual platitudes, since that announcement is itself the most common platitude there is; if you can't get around that one, the whole thing collapses and I'd rather give a normal boring speech. Two hard constraints. First, it has to work as a real graduation speech for people who have never heard the phrase reference class: the philosophy needs to be load-bearing structure rather than a quotation dropped in for the faculty, and no name-dropping at all if you can avoid it. Second, one of my classmates is moving to LA in August to try to write for television, against numbers she understands better than I do, and her parents will be sitting in the second row — the speech should be something she can hear as backing her up rather than as a verdict on her. Around 900 to 1100 words, written to be said out loud, not read on a page. Then, after it, two or three sentences just for me on where exactly you resolved the self-reference problem, because I want to check whether you actually solved it or hid it.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **User:** Senior at a small college, Philosophy & Statistics double major.
      *   **Task:** Write an 8-minute student graduation address (approx. 900-1100 words).
      *   **Context:** Class of 61, outdoor, hot, tired audience (parents, faculty, donors). Unreliable microphone (needs clear, projected speech patterns).
      *   **Problem:** The user is stuck because they see the graduation speech genre as inherently committing the "reference class fallacy" (telling students they are exceptional by cherry-picking the reference class). They know the stats (low tenure-track rates, startup failure rates). They don't want the smug "you're ordinary" counter-speech either. They don't want the meta-platitude ("I won't give you platitudes").
      *   **Constraints:**
          1.  Must work as a real graduation speech (accessible to non-philosophers/stats people).
          2.  Philosophy/Stats must be structural, not name-dropping.
          3.  Must support a specific classmate moving to LA to write for TV (parents in 2nd row) without ignoring the odds.
          4.  No name-dropping (Reichenbach, etc.).
          5.  Word count: 900-1100 words.
          6.  Style: Written to be spoken (rhythm, pauses, clarity).
          7.  Post-script: 2-3 sentences explaining how the self-reference problem was resolved.

  2.  **Deconstruct the Philosophical/Statistical Core:**
      *   *The Trap:* Reference class forecasting says outcome depends on how you group yourself. "Graduates" vs. "Philosophy Majors" vs. "People named X."
      *   *The User's Insight:* Self-locating belief means choosing the class is the act of defining the expectation.
      *   *The Solution:* Don't deny the stats. Don't deny the uniqueness. Shift the focus from *prediction* (what will happen) to *commitment* (what class we choose to join). The speech needs to reframe the reference class not as a pre-existing bucket we fall into, but as a community we build through action.
      *   *Supporting the LA Classmate:* Acknowledge the odds without making them a verdict. The odds describe the past; the action defines the future class.

  3.  **Drafting Strategy - Tone and Structure:**
      *   *Tone:* Warm, grounded, slightly intellectual but accessible, honest, not cynical, not overly optimistic.
      *   *Structure:*
          1.  Opening: Acknowledge the heat, the setting, the moment. Avoid the "I won't be cliché" cliché.
          2.  The Core Metaphor: Numbers vs. Names. Statistics vs. Stories.
          3.  Addressing the Odds: Acknowledge the uncertainty (the LA friend) without despair.
          4.  The Pivot: We define the class by what we do, not what happened to people before us.
          5.  Closing: A call to action grounded in shared presence.
      *   *Speaking Style:* Short sentences. Clear cadence. Avoid complex nested clauses (bad for outdoor acoustics).

  4.  **Drafting - Section by Section:**

      *   *Opening:* Start with the physical reality. Hot sun, uncomfortable chairs. Ground us.
      *   *The Stats/Philosophy:* Introduce the idea of grouping. We love to categorize. It helps us understand risk. But it fails us here.
      *   *The LA Friend:* Specific enough to be real, vague enough to be universal. "One of us is going to try to write stories for a living." Acknowledge the difficulty.
      *   *The Resolution:* The reference class isn't fixed. It's created. We aren't predicting the future; we're choosing the group we belong to by acting.
      *   *Closing:* Bring it back to the 61 people here.

      *Word Count Check:* 8 minutes speaking time is roughly 1000-1100 words at a moderate pace (130-140 wpm). I need to aim for the upper end of the constraint to ensure it fills the time without rushing.

      *Refining the Philosophy:* The key is to move from *epistemic* (what can we know about the future based on past data) to *pragmatic/existential* (what group do we constitute by acting together). The "class" is not a statistical bucket; it's a covenant.

      *Refining the LA element:* Make sure it sounds like support. "The numbers describe the graveyard of attempts, not the possibility of the attempt."

      *Avoiding the "No Platitudes" Platitude:* Just speak sincerely. Don't announce "I'm not going to say X."

      *Drafting thoughts:*
      - Need to ensure the microphone issue is respected (clear consonants, not too many whispery sounds).
