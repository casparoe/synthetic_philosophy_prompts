answer: |-
  Good morning. Welcome to all of you. Before we begin, I need to thank the Veridian Foundation for their generous support of this workshop. Without them, we'd be having this conversation in the cafeteria, and the coffee is significantly worse down there.

  I also need to acknowledge the room we are in. As you know, this building was renamed last spring. The history of the name it used to carry is not abstract for us. It is in the bricks. It is in the ledger books. And looking out at the audience, I see the three trustees who voted to keep the name, and I see the two students who circulated the petition to remove it. I see the College President. And I see Professor Marion Oduya, who is retiring this year and who chose the title for this gathering.

  I know what many of you asked at the registration table. I heard the whispers. "So, about the name." "Are they going to talk about it?" "Is this the showdown?"

  I want to be clear: I am not here to settle anything. I promised the planning committee I wouldn't try to resolve the building issue in an opening speech. That would be arrogant. But I also cannot stand here and pretend the building is just a building. We are historians. We know there are no neutral spaces.

  So, let's talk about the title Marion chose: "The Standards We Can't Shed."

  For forty years, Marion has argued against two specific cheats in our profession. The first is the idea that we must judge people solely by the standards of their time, which often becomes a permission slip to stop thinking. The second is the mirror image: the confident prosecutor who treats the archive as a indictment of the past because it doesn't look like the present.

  To navigate this, Marion imposed a working rule on every student she ever supervised. I want to make this the spine of our next two days. She called it the Witness Requirement.

  It is simple. You may not say of a historical actor that they "should have known better" unless you can name somebody alive at the time, inside their world, using a vocabulary available to them, who *did* know better and said so.

  Not someone who knew better in hindsight. Not someone we imagine *would* have objected. A contemporary witness.

  Marion's point was that this turns a mood into a research task. It stops us from smuggling our own century's indignation into the past and pretending it's analysis. If you can't produce a witness, your moral judgment is likely just your own reflection in a dark mirror.

  Usually, we use this rule to protect the dead. It shields the nineteenth-century president from our twenty-first-century outrage. It forces us to dig deeper than our own instincts.

  But here is the uncomfortable reflexive move. If we take the Witness Requirement seriously, it does not just protect the dead. It implicates the living.

  The students who wrote the petition last spring did not write it in hindsight. They wrote it in the moment. They used a vocabulary available to us. They said, explicitly, that the honorific was wrong. By Marion's standard, they are the witnesses.

  Which means that sixty years from now, a historian looking back at this college will not be able to say the trustees "couldn't have known better." The witness testimony exists. The record is clear. And the same applies to me. I am the incoming chair. I am standing in this room. I am benefiting from the structures these students challenged.

  Someone outside this room might call this presentism. They might say we are turning the workshop into a tribunal. But that misses the point. The Witness Requirement isn't about verdicts; it's about evidence. It demands we acknowledge who was speaking, when, and whether we listened.

  And here is the mercy in the rule. It works both ways.

  I am not entitled to fault Marion for what she didn't take up in the 1980s unless I can name a witness who told her so at the time. I cannot judge her silences using my vocabulary. I have to find hers. This rule, which feels so sharp when turned on us, is also the shield that protects her legacy from my own generational arrogance. It ensures that when she is the subject of history, she will be judged by the world she actually inhabited, not the one I wish she had inhabited.

  That is the standard we can't shed. It is uncomfortable. It should be. It means we are not safe from the judgment of our own contemporaries, and we cannot claim ignorance when the witnesses are sitting in the front row.

  So, as we begin, I have a question for myself, which I hope you will hold me to in the years ahead. When my time comes to be archived, and the witnesses are called to say whether I knew better than I acted, will there be anyone standing up to defend me?

  Marion, I hope you'll be there to check my citations. Thank you.
