answer: |-
  The parking lot lights hummed, flickering against the damp asphalt. Renee leaned against her sedan, keys loose in her hand. Omar stood by the open door of his SUV, arms crossed against the chill.

  "I'm signing it, Omar," Renee said. "And I'm reading it Tuesday."

  "You can't."

  "Don't start."

  "It's not about starting, it's about eleven years ago. Saint Louis. The data set you buried."

  Renee shoved her keys into her pocket. "Here we go. The *tu quoque*. It's a named fallacy for a reason, Omar. If the messenger's sins veto the message, you hand every wrongdoer a get-out-of-blame card. 'Oh, you cheated? Well you cheated in '09, so shut up.' It silences the truth."

  "It's not silencing the truth. It's about who gets to demand it." Omar stepped closer, voice low. "Blame isn't a report, Ren. It's not a weather forecast saying 'it is raining wrongdoing.' It's a demand addressed to someone in the name of a standard. You can't invoke a standard you're currently violating without hollowing out the demand."

  "I'm not violating it now. I'm enforcing it."

  "You're invoking authority you forfeited."

  "Foreited forever? So if I slip once, I'm mute on ethics for the rest of my life? That's not standing, that's purity politics." Renee rubbed her temple. "Look. Suppose Dale only respects me. Suppose I'm the only one with the clout to make sure he actually stops doing this. Are you saying I should step aside and let the harm continue because my hands aren't clean? That makes standing magic. It operates at a distance from anyone's knowledge."

  "Does it?" Omar tilted his head. "Let's test that. If nobody ever found out about Saint Louis—if I hadn't found out—does the status of your blame change? Does your right to censure Dale depend on me knowing your secret?"

  Renee hesitated. "No. The wrong is the wrong."

  "Then if the status doesn't change based on knowledge, standing is internal. It's about you. But if it *does* change based on knowledge, then standing isn't about your authority, it's about how an audience receives the speech. Which is it?"

  "It's about the institution's integrity," she snapped. "And I blame myself for Saint Louis. Every day. How can standing be something I lose if I still plainly have it over myself? I'm holding myself to the standard."

  "Self-blame is different. It's not a demand; it's a reckoning." Omar kicked at a loose stone. "Can standing be earned back, Renee? If you can earn it back, what's the mechanism? Repentance? Restitution?"

  "Maybe."

  "Then what you're calling lost standing is really just unpaid debt. You owe a debt to the standard. If you haven't paid it, you're not forbidden from speaking, but Dale gets a complaint that has to be weighed against yours. It's not a veto, it's a counter-weight."

  "It feels like a veto," she said quietly. "Because you're telling me I can't speak."

  "I'm telling you you shouldn't be the face of it. There's a difference."

  "Does the student care?" Renee asked. "The grad whose data Dale padded. I asked her. She said she doesn't care one way or the other who signs the censure. She just wants it signed."

  "Exactly," Omar said. "Which proves the standing business is entirely between you and Dale. It has nothing to do with the victim. It's about the relationship of authority between the blamer and the blamed. If you stand before him as a hypocrite, the demand collapses."

  "It doesn't collapse. It gets complicated."

  "It gets weaponized. He'll know. He'll dig. He'll find Saint Louis, and then the censure becomes about you, not him."

  "Then we deal with that when it happens. We deal with my past separately." Renee pushed off the car. "You're treating standing like a property I own. Like a badge. I'm treating it as a function. Does the censure stop the harm? Yes. Does it name the wrong? Yes. Why does it matter if the namer is flawed?"

  "Because blame is second-personal," Omar said, frustration edging in. "It's me looking you in the eye and saying *you must not do this*. If I'm doing *this* while I say it, I'm not inviting you to join a community of standards. I'm asserting power."

  "And if I step aside, I'm asserting that my purity matters more than Dale's correction."

  They stood in the hum of the lights. The wind picked up, rustling the dry weeds along the curb.

  "So," Omar said, exhaling slowly. "We're not actually fighting about Saint Louis."

  "No."

  "We're fighting about what blame *is*." Omar looked at her. "You think it's a true representation of a wrong that anybody can voice. Like reading a verdict."

  "And you think it's a demand made by someone who has to meet its terms," Renee finished. "Like issuing a command."

  "If it's a verdict," Omar said, "then my past is irrelevant. The truth stands on its own."

  "If it's a command," Renee said, "then my authority depends on my compliance."

  "Does hypocrisy forfeit standing outright?" Omar asked. "Or does it just suspend it? Or does it just generate a genuine counter-complaint that sits alongside the first one?"

  "I don't know," Renee said. She sounded tired. "But if I don't sign it, who does? You?"

  "I didn't say that."

  "Then nobody. And Dale wins." Renee opened her car door. "Think about the debt thing. If it's just unpaid debt, maybe I sign it, and you stand up after and say 'Renee owes a debt too.' Then both stand."

  "Then it becomes a spectacle of sin," Omar said. "Not a correction."

  "Better than no correction." She paused, hand on the roof. "We're not solving this tonight."

  "No." Omar turned to his SUV. "But next week... we need to read something that defines the terms. Because right now, I'm saying you can't speak, and you're saying the truth speaks itself."

  "And we're both tired," Renee said.

  "God, yeah." Omar opened his door. "Drive safe, Ren."

  "You too."

  She got in. The engine started, breaking the silence, but the question hung there, heavier than the cold.
