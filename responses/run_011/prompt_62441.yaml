      This seems balanced.

      *One detail on Move 4:* "Independent origins are not independent samples." This is actually a bit mistaken. They *are* independent samples of the *process*, even if the *tools* (wheat/barley vs maize) differ. The convergence *is* the signal. I should note that in the justification.
      *One detail on Move 6:* "No additional osteology settles that." This is true. It's a philosophical axiom.

