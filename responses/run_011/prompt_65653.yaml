  **JOINT STATEMENT ON THE STRUCTURE OF PERCEPTUAL EXPERIENCE**

  **1. Shared Commitments**

  We, the undersigned, agree to the following stipulations and theoretical constraints regarding the stipulated case (Case A: perfect neural/behavioral match between veridical perception and lab-induced hallucination) and Variant B (subject learns to flag hallucinations).

  1.  **Indistinguishability is Epistemic:** We agree that subjective indistinguishability does not logically entail ontological identity. The fact that a subject cannot tell two states apart does not prove the states are fundamentally the same kind of thing.
  2.  **Neural Supervenience:** We agree that mental states depend on neural activity. In Case A, the neural activity is stipulated as identical. We disagree on what this identity implies about the *nature* of the experience, not the dependency itself.
  3.  **Explanatory Burden:** Any viable theory must explain why the subject acts identically in Case A despite the absence of an object in the hallucination. Any viable theory must also explain Variant B: how a subject comes to discriminate states previously deemed indistinguishable without new external cues.
  4.  **Existence of the Object:** We agree that in the veridical case, the lemon exists independently of the subject. We disagree on whether this object is a constituent of the experience or merely its cause.
  5.  **No "Magic" Qualia:** We agree that no explanation should posit non-physical properties that float free of physical implementation. Disagreements concern the description of the physical/mental interface, not the existence of the physical.

  **2. Table of Disagreements**

  | Crux | Disjunctivist View | Common-Kind View | Shared Evidence Bearing on Crux | Pre-registered Predictions |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Account of Hallucination** | A hallucination is a distinct ontological kind. Defining it as "introspectively indiscriminable from a veridical perception" is a complete positive account of its epistemic status; no further shared mental core is required. | A hallucination shares a fundamental mental core (content/sense-data) with veridical perception. Defining it merely negatively (as indiscriminable) is incomplete; we must identify the positive shared state. | Case A introspective reports. | **Disjunctivist:** Search for a "common core" neural substrate will fail; only specific causal pathways differ.<br>**Common-Kind:** A shared functional/neural profile constituting the "experience" will be identified across both cases. |
  | **2. Causal Work of the Object** | The external object constitutes the veridical experience. It is not merely a trigger; without it, the specific mental state does not exist. It does work by being present. | The external object causes the internal state, but the internal state (content/representation) drives behavior. The object is an external trigger; the internal state does the work. | Case A identical behavior/dispositions. | **Disjunctivist:** In the veridical case, behavior is guided by the object itself via the experience.<br>**Common-Kind:** Behavior is guided by the internal representation in both cases; the object is irrelevant to the *guide* once the state is active. |
  | **3. Variant B (Flagging)** | The subject's ability to flag hallucinations confirms the states were always fundamentally different kinds. Indiscriminability was temporary ignorance, not evidence of identity. | The subject learned to detect subtle differences in causal history or neural nuance previously ignored. This does not prove a fundamental ontological split, only improved discrimination of cues. | Variant B success rates. | **Disjunctivist:** Discrimination will improve until it is perfect, revealing the categorical gap.<br>**Common-Kind:** Discrimination will plateau based on available sensory/cognitive cues; states remain of the same fundamental kind. |

  **3. Verbal Disputes and Clarifications**

  A significant portion of our historical disagreement stems from using identical terminology to denote different levels of description. To proceed, we agree to the following clarifications:

  **Phenomenal Character**
  *   **The Confusion:** When we say "the experience has a certain phenomenal character," the Common-Kind theorist hears "an intrinsic qualitative property internal to the subject." The Disjunctivist hears "the way the world seems to the subject," which may be constituted by external objects.
  *   **The Correction:** We agree to distinguish *phenomenal profile* (the subject's perspective on the world) from *phenomenal ontology* (what constitutes that perspective). The Common-Kind theorist claims the profile implies a shared ontology. The Disjunctivist claims the profile is compatible with distinct ontologies. We will no longer argue about whether the character "exists" but rather what *fixes* it.

  **"Same Kind of State"**
  *   **The Confusion:** In Case A, the Common-Kind theorist says the states are the "same kind" because they function identically and feel the same. The Disjunctivist says they are "different kinds" because one is relational (object-involving) and the other is not.
  *   **The Correction:** We agree this is a dispute over classification criteria. The Common-Kind theorist classifies by *functional/phenomenal role*. The Disjunctivist classifies by *metaphysical constitution*. We acknowledge that both classifications are coherent but answer different questions. The substantive dispute is not about labeling, but about whether the *functional/phenomenal role* can be fully explained without positing a shared internal constituent.

  **Indiscriminability**
  *   **The Confusion:** Both sides agree indiscriminability is epistemic. However, the Common-Kind theorist often treats it as *evidence* for identity, while the Disjunctivist treats it as *neutral* regarding identity.
  *   **The Correction:** We agree to treat indiscriminability as a constraint on theory, not a premise for ontology. The theory must explain *why* the states are indiscriminable in Case A. The Common-Kind theorist explains this via shared core. The Disjunctivist explains this via the hallucination mimicking the epistemic access of the veridical state.

  **Conclusion on Variant B**
  Regarding Variant B, we acknowledge this is the stress test. If the subject can flag the hallucinations without external cues, the Disjunctivist claims this validates the metaphysical gap becoming epistemically accessible. The Common-Kind theorist claims this validates the existence of subtle internal differences previously below the threshold of detection. We agree to treat Variant B not as a refutation of either view, but as data regarding the granularity of perceptual access. If discrimination becomes perfect, the Disjunctivist view is strengthened. If discrimination plateaus despite optimal conditions, the Common-Kind view is strengthened.

  We sign this statement to acknowledge that our dispute is not about the data, but about the metaphysical cost of explaining it.

  **Signed:**
  *The Disjunctivist*
  *The Common-Kind Theorist*
