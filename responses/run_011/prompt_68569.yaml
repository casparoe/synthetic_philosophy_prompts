answer: |-
  Thank you all for being here. For those who knew my mother only as the woman in the third pew who never missed a Sunday, I am one of the lucky ones who knew her at home as well. I am here to speak for the woman who read *Middlemarch* once every decade, who argued with books as if they were people, and who loved this specific building, and the people in it, for forty-three years.

  We are gathered in a place that she treated as a home. But I know there are questions about what brought her here week after week. In a family like mine, there are those who find comfort in certainty, and those who find integrity in doubt. My mother lived in the tension between them. She was a student of the nineteenth century, deeply influenced by writers who dismantled the literal truth of scripture. She knew the arguments against the miracles. She did not believe that the laws of nature were suspended for anyone, and she did not expect to meet anyone on the other side of this life.

  Some have wondered if her presence here was a habit, or a politeness, or even a cowardice. It was none of those things. It was a deliberate, hard-won choice that she made sixty years ago and kept every week until she could no longer walk the steps.

  She held a view that she rarely voiced from the pulpit, but lived in the pew. She believed that if you strip away the forms of religion, you lose something vital that a lecture cannot replace. She called it the moral imagination. She thought that this building, and the rituals performed within it, were a technology for keeping us generous. She worried that a religion focused primarily on your own rescue in the next world could make you smaller in this one. She preferred a religion that demanded you show up for the living.

  That is why she came. She came because she believed that goodness is a collective discipline, not a private transaction. She came because she needed this community to hold her to a standard higher than her own instincts.

  And this brings me to the hardest thing to explain, but the most important. I know that for many of you, the Creed is a statement of fact. It is a description of how the universe works. For my mother, it was something else. When she stood and spoke the Creed, she was not offering you a theory of the afterlife. She was offering you her presence, and pledging that she would live by the moral story these walls protect.

  She meant the words as a vow of attendance to this life, and to you.

  She knew that almost everyone around her understood those words differently. She did not stand up to correct you. She stood up to join you. She understood that the truth of a community is not found in the uniformity of its metaphysics, but in the shared commitment to its duties. To her, saying "I believe" was less about assenting to a miracle, and more about promising to act as if love is the strongest force we have.

  To the friends from the choir, the flower rota, and the woman she sat beside every week: she did not come here to watch you. She came to be with you. She valued your fellowship not despite her doubts, but because of them. She needed the structure of this place to keep her honest. When she sang the hymns, she was not singing about clouds and gates. She was singing about gratitude, and justice, and the need to be kinder than we want to be.

  To my family, and the younger generation: she was not frightened. It takes courage to stand in a place of worship for sixty years without the comfort of certainty. It takes integrity to say the words when you know you mean them differently than the person next to you. She did not owe the world a public confession of her skepticism. She owed the world a life of service, and she paid that debt in full. She chose solidarity over being right.

  She would not want me to end this with a promise that she is watching over us. She is not. She is here, in the memory of the work she did, and in the empty space in the third pew. She believed that the only immortality we get is the good we leave behind in other people. By that measure, she has secured a very long life.

  She loved this church. She loved the ritual. But most of all, she loved the people who keep the ritual going. She asked me to make sure you knew that her presence was a gift of love, not a silent critique. She trusted you with her Sundays. She trusted you with her moral education. And she hoped that by standing with you, she helped make this place a little more generous, a little less concerned with who is right, and a little more focused on who is kind.

  Thank you for letting her be part of this community. And thank you for being here to send her off from the place she chose to be her home.
