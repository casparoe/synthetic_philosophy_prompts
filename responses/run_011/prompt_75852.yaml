  5.  **Drafting the Content - Specific Points to Verify:**

      *   *Dollar Auction Equilibrium:* O'Neill (1986) shows a symmetric mixed-strategy equilibrium. But is it the *only* one? There are also asymmetric equilibria. More importantly, does human data fit the 5% dropout rate? Experimental data (Shubik, Teger) usually shows escalation, but often *more* than equilibrium or with different dynamics (e.g., threat behavior).
      *   *Invariance:* Rational model says sunk cost is irrelevant. Bias model says sunk cost drives behavior. This is the crux.
