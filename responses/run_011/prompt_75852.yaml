      *   *Unfalsifiability:* If the user says "If it looks irrational, it's actually signaling," that's a problem. Needs a constraint on what counts as a "reputational payoff."

  6.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* The user claims the Dollar Auction *has* a mixed equilibrium where escalation is rational.
