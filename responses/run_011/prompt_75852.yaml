  3.  **Brainstorming Counter-Evidence & Arguments:**

      *   *The Dollar Auction Equilibrium:* The user cites the mixed-strategy equilibrium (O'Neill 1986). In this equilibrium, players randomize. Does this *explain* the observed behavior? Usually, humans don't play mixed strategies well. They tend to bid *more* deterministically or stop earlier.
      *   *The Invariance Prediction:* The user admits: "indifference at each round should be invariant to the amount already sunk." If data shows escalation probability *increases* with sunk cost (holding remaining gap constant), that hurts the rational model.
