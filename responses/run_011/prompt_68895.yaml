  ### Sensitivity Analysis

  **Most Sensitive Term:** **$P(Ph)$ (Probability that physics allows single-case chance).**

  **Why:** This term acts as a gatekeeper; if it drops to 0 (e.g., if Many-Worlds or Bohmian mechanics are conclusively verified), $P(C)$ collapses to 0 regardless of the metaphysical or normative work. It is the most volatile because it depends on empirical progress in foundational physics rather than conceptual analysis.

  **Evidence to Move It:** A definitive experimental test distinguishing Objective Collapse theories (like GRW) from Unitary Quantum Mechanics (like Everett). If interference effects are observed at macroscopic scales, $P(Ph)$ plummets; if spontaneous collapse is detected, $P(Ph)$ rises toward 1.0.

