answer: |-
  Here are ten questions designed to press your guest on the consequences of her view, rather than letting her rest on the distinction itself. The first six cover your three mandatory topics (including the required follow-ups), followed by three probing extras and the mandatory closing question.

  **1. [Mandatory: Epiphenomenalism]**
  If you grant that physical properties do all the "producing" and mental properties only "make a difference," haven't you just given epiphenomenalism a better brand name? If the mental doesn't push the physical atoms, in what robust sense is it actually *doing* anything?

  *   **Likely Answer:** She will likely say that "production" is a narrow, physics-centric concept, while "difference-making" is the concept that actually matters for explanation, control, and life. She'll argue that having a grip on the difference *is* having a grip on the cause, even if the underlying mechanism is physical.
  *   **Follow-up:** But if I can intervene on the difference without touching the production, am I really controlling the outcome? Or am I just riding along with the physical production that's doing the actual work?

  **2. [Mandatory: Responsibility]**
  When we hold somebody morally responsible for a crime, which of your two notions of causation are we tracking? Do we blame them because they *produced* the harm, or just because their mental state *made a difference* to it happening?

  *   **Likely Answer:** She will almost certainly say we care about difference-making. We want to know if the agent could have done otherwise (a counterfactual/difference-making claim), not whether their neurons violated physical closure.
  *   **Follow-up:** But if the physical production was determined by the past and the laws of physics, does "making a difference" carry enough weight to justify blame? It sounds like you're grounding responsibility in a relation that doesn't actually move the matter.

  **3. [Mandatory: Proportionality]**
  Stephen Yablo's proportionality constraint already saves mental causation from Kim without splitting causation in two. By requiring causes to be proportional to effects, we filter out the micro-physical details and keep the mental. Doesn't that defeat Kim all by itself, making your causal pluralism redundant?

  *   **Likely Answer:** She will likely argue that proportionality assumes a single causal relation that needs filtering. Her view is that there *are* two distinct relations operating simultaneously, not one relation with a description filter.
  *   **Follow-up:** But if proportionality successfully identifies the mental cause as the *real* cause of the action, aren't you just adding metaphysical complexity without buying any extra explanatory power?

  **4. [The "Verbal" Claim]**
  You characterize the exclusion debate as basically a verbal fight. But if it were merely verbal, why has it generated decades of substantive literature and genuine anxiety among physicalists? Is there a cognitive bias here, or is the "substance" of the fight actually about something real you're glossing over?

  **5. [Causal Powers]**
  On your view, physical properties have the power to produce, and mental properties have the power to make a difference. Do mental properties have *causal powers* in any traditional sense? If they lack the power to produce effects, are they genuinely causal properties, or are they just descriptive tags we put on physical productions?

  **6. [Scientific Practice]**
  Does this pluralism fracture the special sciences? If a neuroscientist is looking for production mechanisms and a psychologist is looking for difference-making patterns, are they studying the same world? Or does your view imply they are talking past each other about two distinct causal relations?

  **7. [The Boundary Problem]**
  You distinguish production from difference-making, but in practice, don't they overlap? If I intervene on a mental property and the physical production changes, haven't I shown that the mental property participates in production after all? Where exactly do you draw the line between the two relations?

  **8. [Downward Constraint]**
  If mental properties only make a difference, can they ever constrain the physical production? If the answer is no, doesn't that leave the physical domain causally sealed in a way that makes the mental domain ontologically idle, regardless of what you call it?

  **9. [The Cost of Pluralism]**
  What is the theoretical cost of maintaining two distinct causal relations? Does this commit you to a form of metaphysical pluralism that makes it harder to explain how the mental and physical worlds cohere into a single universe?

  **10. [Mandatory Closing: Evidence]**
  Finally, what could count as evidence that these really are two distinct notions of causation rather than one notion described twice? Is there a conceptual test or an empirical finding that would prove your pluralism is true, rather than just a useful way of speaking?
