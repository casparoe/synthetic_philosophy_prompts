answer: |-
  Good evening. I know why we're here. We're here because six years ago, we voted for a water treatment plant, and the bill came in forty percent higher than the estimate. We're still paying for that. We're also here because some of us remember the year the river took out the bridge road. We remember needing money in days, not months, to keep this town from being cut off from the next county. One side of this room sees a spending problem. The other side sees a survival problem. Both are right.

  I teach down the road at the college, and sometimes I talk about ideas that feel far away from Main Street. But tonight, the thing we're voting on is an idea made real. It's a clause in the charter that says we can't borrow more than two million dollars unless sixty percent of us say yes. It also says changing this rule takes a two-thirds vote of the selectboard and a confirming referendum at the next regular election. That is a heavy lock. The question is whether we need it, and whether we have the key.

  There's an old story about a man who knew he was going to hear a song that would make him lose his mind. He knew the song would make him want something dangerous that he wouldn't want once the music stopped. So he ordered his crew to tie him to the mast. He told them not to listen to his begging. He bound his future self because he trusted his present self more. He believed his future self would be temporarily insane.

  We have to ask ourselves if that's us. Are we tying ourselves to the mast because we think our future selves will be crazy? Or are we doing it because we think our future selves will be lucid and simply disagree with us about what's worth paying for? There is a difference. The first is protection. The second is just the present outvoting the future with extra paperwork.

  Look at the water bond. Was that madness? Or was it bad geology and rising costs? If it was just bad luck, tying ourselves up won't stop the ground from shifting. Look at the flood. Was that madness? Or was it a clear-headed decision that a detour through the next county would cost us more in the long run than fixing the bridge now? If we pass this clause, we are saying that the next time we face a choice like that, we won't be able to trust ourselves to say yes. We are saying the urge to spend will be a sickness.

  But here is the part we skip. In the story, the man tied to the mast didn't just rely on the rope. He relied on the crew. He gave them wax for their ears. He gave them an order not to let him go even if he begged. The constraint wasn't just the knot. It was the procedure for untying.

  Our charter amendment rule is the wax in the ears. It says if we need to change this rule, we need a supermajority on the board and a vote at the next regular election. Think about the timing. A regular election happens once a year. If the river rises in October, and the next regular election is next November, we wait a year to fix the rule so we can fix the bridge? The flood didn't wait for a calendar. Emergencies arrive in forty-eight hours. A release mechanism that takes two election cycles isn't a safety valve. It's a wall.

  A constraint without a quick release isn't prudence. It's a wish that nothing bad will happen.

  There's a letter from Thomas Jefferson to James Madison, written while our own Constitution was being argued over. Jefferson was in Paris. He was thinking about debt and laws. He argued that the earth belongs to the living. He didn't mean we should waste it. He meant that one generation shouldn't bind the next so tightly that they can't breathe. He did the arithmetic. He figured a generation's contract runs about nineteen years. After that, the dead shouldn't dictate to the living. He wasn't talking about reckless spending. He was talking about the right to decide.

  This clause tries to bind us for longer than nineteen years. It makes changing our minds so hard that effectively, we can't. It assumes we know better than the people who will be standing here in five years, dealing with the problems we can't see yet.

  I am not standing here to tell you we should spend freely. We shouldn't. The water bond hurt. We all felt it. But the answer to bad spending isn't paralysis. The answer is better scrutiny, not higher thresholds. If we pass this, we aren't just limiting debt. We are limiting our ability to respond to a world that doesn't follow our schedule.

  The law professors in the back will tell you about precommitment strategies. They'll tell you this is how stable institutions are built. They're right, usually. But a town isn't just an institution. It's a group of neighbors living on a river. Sometimes the river wins. When it does, we need to be able to act. We need to be able to untie the knot.

  If this clause had a faster release—if we could call a special referendum, if the selectboard could act in a genuine emergency—I might stand here and tell you to vote yes. I might tell you that the water bond proved we need a cooler head. But it doesn't. It locks the door and throws away the key for a year at a time.

  So I'm asking you to vote no on this provision. Not because we love debt. Not because we forgot the water bill. But because we remember the flood. We remember how fast the water came. We need a government that can move that fast if it has to. We need to trust that our future selves will be just as clear-headed as we are tonight, even if they disagree with us. We need to leave them the room to decide.

  Don't tie us to the mast unless you're sure the crew can hear us scream. Don't put wax in their ears if the storm comes without warning. Let's keep the power to untie ourselves. Thank you.

  ***

  **Note on Strategy**

  **Alternative Path:**
  I could have written this speech to argue *for* the clause. To make that case compelling, I would have had to frame the water-treatment bond overrun not as bad luck or unforeseen complexity, but as a failure of political will—a classic case of "soft budget constraints" where officials knew voters would ultimately pay whatever it cost. If the town's history suggested a pattern of optimism bias rather than genuine emergency spending, the Ulysses metaphor would land differently: the "madness" would be the collective optimism of a boom cycle, not individual insanity.

  **Beliefs Required:**
  To take that pro-clause stance, I would need to believe that the flood emergency was a statistical outlier (a once-in-a-century event) rather than a recurring risk of river living. I would also need to believe that the "release mechanism" (waiting for the next regular election) is acceptable because true emergencies can be funded through other means (state/federal aid, emergency appropriations that bypass bonding limits) without needing to amend the charter immediately. Essentially, I'd have to trust that the state rep in the back is right—that there are legal workarounds for emergencies that don't require breaking the charter.

  **The Flip Fact:**
  The single fact that would flip my verdict is the **source of the water-treatment overrun**. If it turned out the overrun was caused by deliberate scope creep authorized by the selectboard without voter knowledge (e.g., adding premium features mid-project), rather than contractor issues or geological surprises, the argument shifts decisively toward the clause. That would prove the "madness" wasn't external bad luck, but internal governance failure, justifying a stricter binding mechanism despite the release lag.
