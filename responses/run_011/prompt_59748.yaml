      Bertrand's chord problem is standardly taught as a reductio of the Principle of Indifference in continuous spaces. This proposal argues that diagnosis is a category error. The paradox conflates three distinct puzzles: a semantic denotation failure, a normative invariance constraint, and an empirical implementation issue. The standard lesson attributes the failure of the first to the principles of the second. disentangling them saves the Principle of Indifference from unfair criticism and isolates the genuine philosophical problem: the justification of symmetry-based constraints on rational credence. Eight weeks is sufficient to reconstruct this tripartite distinction, draft an 8,000-word paper, and prepare a seminar talk. This work matters because it clears away a persistent confusion in foundational probability, allowing philosophers to address the actual normative constraints on symmetry without being distracted by semantic ambiguities. The project moves the debate from "Indifference is broken" to "What justifies symmetry constraints?"

      *Section 2 (The Question):*
      The central question is: Does Bertrand's paradox demonstrate a failure of the Principle of Indifference, or does it demonstrate a failure to specify a physical generating procedure? I distinguish three puzzles. First, the Denotation Puzzle: the phrase "random chord" lacks a determinate referent without a specified generating procedure. This is a semantic failure, not a probabilistic one. Second, the Invariance Puzzle: given a fixed physical setup, why must rational credence respect symmetry groups (translation, scaling)? This is a normative question about symmetry constraints, independent of Indifference. Third, the Implementation Puzzle: does a specific physical procedure (e.g., tossing straws) match the theoretical measure? This is an empirical question. The paper asks whether the standard "Indifference is untrustworthy" lesson is actually the Denotation Puzzle doing the work of the Invariance Puzzle. This question is not a general treatise on the interpretation of probability. It does not argue for Bayesianism over Frequentism. It focuses strictly on the structural logic of Bertrand's case and whether the conflation of these three puzzles obscures the normative status of symmetry.

