      *   **The Threshold Problem (Step 6 & 7):** Even if integration comes in degrees, subjecthood might be a threshold concept or a natural kind, not a vague spectrum.
      *   **The "Subject" Definition (Step 1):** Defining a subject solely by reportability/behavioural guidance is behaviourist. It ignores the phenomenological "what it is like" aspect which might persist even without cross-talk.
      *   **Split-Brain Specifics (Step 3 & 4):** The interpretation of split-brain data is actually contested. Some argue there is still unity (Bayne), others disunity (Nagel, Puccetti). The flatmate assumes the "two minds" view is settled fact.
      *   **Category Error (Step 5):** Comparing modular specialization (intact) with anatomical disconnection (split) is suspect. One is functional segregation within a unified system; the other is physical severance of the binding mechanism.

  4.  **Formulate the Counter-Argument (The "Handout" Strategy):**
