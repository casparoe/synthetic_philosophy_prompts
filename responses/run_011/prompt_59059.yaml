          6.  Conclusion: How to escape the corner.

  5.  **Drafting the Content (Iterative refinement):**

      *   *Point 1: The Definition of Integration.* The flatmate defines integration as *mutual reportability*. This is too narrow. In an intact brain, the visual cortex and the motor cortex are integrated even if I can't report the *syntax parsing* details. The *output* is integrated. In split-brain, the *outputs* can be contradictory (left hand vs. verbal report). This is a qualitative difference, not just quantitative.
      *   *Point 2: The Sorites Problem.* Step (7) relies on a Sorites paradox. Just because there are degrees of integration doesn't mean there's no threshold for "subject". Water is wet, but individual molecules aren't.
      *   *Point 3: Phenomenology vs. Function.* Step (2) reduces experience to function. A phenomenological approach (what it feels like) might allow unity even with functional gaps.
