answer: |-
  There is no single, canonical term in philosophy or economics that captures this specific argumentative structure, though it sits at the intersection of several well-trodden debates. The closest existing concepts are **endogenous preferences** (economics), **adaptive preferences** (political philosophy/development ethics), and the **wisdom of repugnance** (bioethics). However, none of these name the specific *rhetorical move* of using the *fading* of objection as proof of moral legitimacy.

  Since no established term fits precisely, I will coin one for this structure: **The Habituation Fallacy**.

  Below is the definition, its distinction from neighboring concepts, the boundaries of its legitimate use, and its relationship to the conservative mirror-image.

  ### 1. The Coinage: The Habituation Fallacy

  **Definition:** The Habituation Fallacy is the error of inferring the moral permissibility or neutrality of a practice from the empirical fact that moral revulsion toward it has faded due to repeated exposure and institutional integration.

  **Structure:**
  1.  **Premise 1:** Practice $X$ initially provoked strong moral repugnance.
  2.  **Premise 2:** After $X$ was permitted and institutionalized, the repugnance faded (habituation occurred).
  3.  **Conclusion:** Therefore, the initial repugnance was merely prejudice, and $X$ is morally permissible.

  **Why it is a Fallacy:** It conflates *psychological accommodation* with *moral justification*. It assumes that the mechanism of fading is *moral learning* (we saw it was harmless) rather than *moral numbing* (we got used to the harm) or *normative corruption* (the market changed the meaning of the good). It treats the *outcome* of the market's operation as independent evidence, when that outcome is causally dependent on the market's power to reshape social norms.

  ### 2. Distinctions from Neighboring Concepts

  You mentioned two neighbors: the formation of preferences by circumstances, and the genetic fallacy. Here is how the Habituation Fallacy differs.

  **A. Vs. Endogenous/Adaptive Preferences**
  *   **The Concept:** "Endogenous preferences" (Bowles, Gintis) or "Adaptive Preferences" (Elster, Nussbaum) describe the *mechanism*: people's desires and moral intuitions change to align with their feasible set or their environment.
  *   **The Difference:** These are descriptive tools. A critic uses "adaptive preferences" to say, "You only accept this exploitation because you've adapted to it." The **Habituation Fallacy** is the *defender's* misuse of that mechanism. The defender admits preferences are endogenous but claims the *direction* of change (from repugnance to acceptance) signals progress rather than adaptation. The Fallacy is the normative leap from "we got used to it" to "it is right."

  **B. Vs. The Genetic Fallacy**
  *   **The Concept:** The Genetic Fallacy dismisses a claim based solely on its origin (e.g., "You only believe that because you were raised religious").
  *   **The Difference:** The Habituation Fallacy is a **Reverse Genetic Fallacy**. It does not dismiss the *current* belief based on its origin; it validates the *current* belief (acceptance) by dismissing the *origin* of the opposition (repugnance). It argues: "The origin of the objection was visceral/historical; the origin of the acceptance is empirical/experienced; therefore acceptance is superior." It fails to see that the "experience" was structured by the practice itself.

  ### 3. The Edges: When is the Habituation Point Legitimate?

  The fact that repugnance fades is not *always* fallacious evidence. The legitimacy depends on *why* the repugnance existed and *why* it faded.

  **Legitimate Use: The Ignorance Hypothesis**
  The argument is valid if the initial repugnance was based on **factual error** or **superstition** that market exposure corrected.
  *   *Example:* Usury. Medieval repugnance to interest was partly based on a misunderstanding of time, risk, and capital productivity. As markets operated, people learned that interest facilitates investment rather than merely exploiting need. The fading of repugnance here tracks **epistemic correction**.
  *   *Example:* Blood Donation. If people feared paid donation would spread disease due to hygiene myths, and safety protocols proved otherwise, the fading fear is rational.
  *   *Test:* Did the market reveal hidden *facts*? If yes, habituation is likely moral learning.

  **Illegitimate Use: The Corruption Hypothesis**
  The argument is fallacious if the initial repugnance was based on a **normative boundary** that the market eroded.
  *   *Example:* Commercial Surrogacy/Kidneys. If the repugnance stems from the belief that certain human capacities should remain outside the sphere of price (a la Michael Sandel), the market does not *reveal* this belief to be false; it *crowds it out*. The fading of repugnance here tracks **normative displacement**.
  *   *Test:* Did the market change the *meaning* of the good? If the market turns a "gift" into a "commodity," and people stop objecting because they now view it as a commodity, the habituation is circular. The market created the norms that justify the market.

  **The Boundary Line:** The line lies between **discovery** and **construction**. If the market allows us to discover that a practice is harmless (discovery), habituation is evidence. If the market constructs a new social reality where the harm is invisible or redefined (construction), habituation is suspect.

  ### 4. The Mirror Image: The Wisdom of Repugnance

  The structure you identified is the temporal inverse of Leon Kass's famous argument, **"The Wisdom of Repugnance"** (1997).

  *   **Kass (Conservative):** Deep, durable repugnance (the "yuck factor") is a signal of deep moral truth, even if we cannot articulate the reason yet. *Stability of feeling = Truth.*
  *   **Market Defender (Liberal/Neoclassical):** Deep, initial repugnance is a signal of historical prejudice; the fading of that feeling is a signal of moral progress. *Fluidity of feeling = Truth.*

  **Comparison:**
  Both arguments commit a form of **Moral Psychologism**. They both attempt to derive normative truth (ought) directly from psychological states (feelings of disgust or comfort) without analyzing the *causes* of those states.
  *   Kass ignores that repugnance can be culturally conditioned prejudice (e.g., interracial marriage).
  *   The Market Defender ignores that comfort can be culturally conditioned numbness (e.g., sweatshop labor).

  **Why Your Critique Undercuts Both:**
  You note that the "settled approval... tells us nothing... because the arrangement shaped the approval." This applies equally to Kass. If a society has been arranged around a practice for centuries (e.g., slavery, caste), the *absence* of repugnance is not evidence of moral truth, any more than the *presence* of repugnance is evidence of moral error. Both the Market Defender and Kass treat moral sentiments as **exogenous data points**, when they are often **endogenous products** of the very systems they are meant to judge.

  ### Summary
  The argument you have identified is **The Habituation Fallacy**. It is the claim that the sociological normalization of a practice constitutes its moral vindication. It is distinct from the general theory of endogenous preferences because it makes a normative claim based on that theory. It is legitimate only when habituation reflects the correction of factual errors, but fallacious when habituation reflects the erosion of normative boundaries by the market itself. It stands as the liberal mirror-image to Kass's conservative "Wisdom of Repugnance," and both fail because they treat moral sentiments as independent verdicts rather than dependent variables.
