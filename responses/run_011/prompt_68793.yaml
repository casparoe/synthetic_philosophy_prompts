answer: |-
  Here is an audit of the passage against Susan Wolf's "Moral Saints" (1982), followed by a pedagogical recommendation.

  ### Claim-by-Claim Audit

  **1. Claim:** *"Susan Wolf's 1982 paper 'Moral Saints'... argued that the most morally admirable person imaginable is not the person we should most want to be."*
  *   **Verdict:** **Wolf would sign.**
  *   **Note:** This is the exact thesis of the paper. Wolf distinguishes between moral worth and personal well-being/ideal humanity.

  **2. Claim:** *"A moral saint... is someone whose life is as morally good as it could possibly be — someone who at every moment is doing as much good as they can."*
  *   **Verdict:** **Fair simplification.**
  *   **Note:** Wolf defines a moral saint as someone whose life is "dominated by a commitment to improving the welfare of others." The "at every moment" phrasing is slightly hyperbolic (Wolf allows for saints to have hobbies if they don't interfere with the moral mission), but it captures the demandingness Wolf critiques.

  **3. Claim:** *"Wolf's target isn't a rival theory but a shared assumption: utilitarians and Kantians... both treat the moral point of view as if it were the whole of value..."*
  *   **Verdict:** **Wolf would sign.**
  *   **Note:** Wolf explicitly states her target is the "moral point of view" assumption common to dominant normative theories, not the theories themselves in isolation.

  **4. Claim:** *"The loving saint is... a person who loves tennis and Victorian novels... but who recognizes that morality asks for more, and so gives these things up out of duty — a life of permanent, conscientious inner conflict..."*
  *   **Verdict:** **Wolf would object (Major Error).**
  *   **The Objection:** This description inverts Wolf's taxonomy. In Wolf's paper, the **Loving Saint** is defined by the *absence* of conflict. The Loving Saint's personal inclinations align perfectly with moral demands; they *want* to feed the hungry more than they want to play tennis. They do not give up tennis "out of duty"; they simply find more joy in morality. They do not experience "permanent inner conflict." The description in the passage actually fits Wolf's **Rational Saint** (who acts from reason/duty despite conflicting inclinations), but even then, Wolf does not characterize the Rational Saint as being in a state of *permanent* conflict, but rather as someone who subordinates non-moral interests to moral ones.

  **5. Claim:** *"The rational saint is the stranger creature: he has reasoned his way so thoroughly into the moral point of view that no non-moral wants are left at all, so there is nothing for morality to override and no struggle to admire..."*
  *   **Verdict:** **Wolf would object (Major Error).**
  *   **The Objection:** Again, the taxonomy is scrambled. In Wolf's paper, the **Rational Saint** is the one who *retains* non-moral wants but overrides them through reason. The description here ("no non-moral wants are left") describes the psychological state of Wolf's **Loving Saint**. The passage has effectively swapped the psychological profiles of the two saints.

  **6. Claim:** *"[The rational saint] is serene, selfless, and, Wolf thinks, deeply unhappy, because a person who cares about nothing but the welfare of others has nothing to come home to."*
  *   **Verdict:** **Wolf would object.**
  *   **The Objection:** Wolf does not argue that the saint is "deeply unhappy." She argues that the Loving Saint is actually quite happy (because their desires are satisfied by moral action), but that their life is *lacking* in richness or non-moral virtue. The critique is about the *quality* of the life (it is one-dimensional, boring, or lacking in personal perfection), not the subjective psychological state of misery. Attributing "deep unhappiness" to the saint misrepresents Wolf's argument that a life can be satisfying to the agent but still not be an *ideal* human life.

  **7. Claim:** *"Her conclusion is that morality has to be demoted from master value to one department of life among others..."*
  *   **Verdict:** **Fair simplification.**
  *   **Note:** Wolf argues for value pluralism. Morality is not the whole of the good.

  **8. Claim:** *"...these aren't self-indulgence but genuine goods that a moral theory built on the moral point of view has no room for."*
  *   **Verdict:** **Wolf would sign.**
  *   **Note:** This captures her defense of non-moral virtues (wit, humor, artistic pursuit) as intrinsically valuable, not just instrumentally valuable for recharging moral batteries.

  ---

  ### Analysis of the "Permission Slip" Conclusion

  **Claim:** *"It's why the paper still gets cited, usually by people who never read past the last page, as the philosophical permission slip: give a sensible share to charity, and then stop feeling guilty about the rest of your life."*

  *   **Does it follow?** Loosely, yes. If morality is not the whole of value, then one is not morally required to maximize it at every moment.
  *   **Is it contradicted?** It is slightly contradicted by the chapter's own earlier sentence which says non-moral projects are "genuine goods." The "permission slip" framing suggests non-moral life is merely *tolerated* (i.e., "you can stop feeling guilty"), whereas Wolf argues non-moral life is *constitutive* of a good life (i.e., "you should pursue these because they make your life better").
  *   **Nuance Loss:** The "permission slip" reading risks turning Wolf's positive argument for value pluralism into a negative argument for moral minimalism. Wolf isn't saying "do the minimum and relax"; she is saying "a life of only morality is impoverished." The passage reduces this to guilt management.

  ---

  ### Pedagogical Recommendation

  **Can you assign this with a one-paragraph warning?**
  **No.** I strongly advise against assigning this passage as the primary representation of Wolf's argument, even with a warning.

  **Reasoning:**
  1.  **Structural Error:** The passage does not just lose nuance; it inverts the central distinction (Loving vs. Rational Saint) that students would be tested on or asked to discuss. If a student reads this and then reads Wolf, they will be genuinely confused. If they read *only* this, they will learn a version of the argument Wolf does not make.
  2.  **Psychological Misattribution:** Attributing "deep unhappiness" to the saint changes the nature of the critique from "this life lacks value" to "this life feels bad." This is a significant philosophical distinction.
  3.  **Readability of the Original:** You noted you want to use the trade book because "freshmen will actually finish it." However, Wolf's "Moral Saints" is famously one of the most accessible papers in modern ethics. It is roughly 14 pages in the original *Journal of Philosophy* version and widely anthologized in introductory readers. It is written in clear, non-technical prose specifically to reach a broad audience.

  **Suggestion:**
  Assign Wolf's original paper **instead** of this chapter summary.
  *   **Pros:** It is short, readable, and accurate. It avoids the confusion of correcting a secondary source's errors.
  *   **Cons:** It is primary literature (though very gentle primary literature).

  **If you must assign the trade book:**
  Use the trade book chapter for the broader context of "The Good Life," but **assign Wolf's original paper alongside this specific section.** Use the discrepancy as a teaching moment: "Here is how a popular author summarized Wolf; here is what Wolf actually wrote. Notice how the definitions of the saints differ. Why does that matter?"

  **Final Verdict:**
  Do not let this passage stand as the sole exposition of Wolf. The error regarding the Two Saints is too fundamental to be fixed with a footnote. Since Wolf's original text is freshman-accessible, assign the original. It will save you from having to untangle the Loving/Rational inversion in office hours.
