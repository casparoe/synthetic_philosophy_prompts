answer: |-
  ### 1. The Question Sheet

  **VILLAGE HALL STUDY GROUP — WRITTEN PAPER ONE**
  **Time Allowed:** One Hour
  **Word Limit:** Approximately 800 words
  **Materials:** Pencil and paper only. No calculators.
  **Note:** Everything you need to answer is on this sheet.

  **Definitions**
  *   **Outside View:** Estimating outcomes by using statistics from similar past cases rather than private details.
  *   **Reference Class:** The group of past cases used for comparison.
  *   **Base Rate:** The proportion of successes within a reference class.

  **Scenario**
  A wooden boat restoration society has kept records for twenty years of full restorations begun by its members. There are fifty recorded projects. In each case, the owner gave a completion date at the outset, and the society recorded whether the boat was finished by that date.

  *   Of the fifty, ten were finished by the original date.
  *   At the outset, each owner filled in a short form. Twenty of the fifty wrote that they had prepared exhaustively: a complete parts list, suppliers identified, hours budgeted. Nothing on the form was checked or audited by anyone.
  *   Of those twenty self-described exhaustive preparers, nine finished by their original date.
  *   Of the remaining thirty, one finished by the original date.
  *   Records exist only for members who were still in the society when their project ended and who returned the closing form.

  **The Candidate**
  You are a member about to begin a full restoration. On the opening form, you have written that you have prepared exhaustively. You have also completed two smaller projects — a dinghy and a launch — each inside your original estimate. The society's records do not distinguish an owner's first project from a repeat.

  **Questions**

  **(i)** Which of the two rates, ten in fifty or nine in twenty, is the better starting point for your estimate, and why? **(4 marks)**

  **(ii)** Another member reasons, "I begin at ten in fifty, because that is the honest outside view, and then I raise it because I prepared properly." Diagnose exactly what is wrong with this, and state a condition under which raising a base rate for case-specific information would be legitimate. **(5 marks)**

  **(iii)** Should your two smaller completed projects change the number, in which direction, and what limits how far it may be changed? **(5 marks)**

  **(iv)** Suppose you are afterwards told that three of the nine successes among the self-described preparers had hired a professional boatbuilder for part of the work, a fact you do not have about yourself. What becomes of the nine-in-twenty rate for your purposes? **(3 marks)**

  **(v)** Given the size of the sample and the way the records were kept, how much confidence should you place in the figure you have arrived at, and what is the mistake in treating it as exact? **(3 marks)**

  ***

  ### 2. Model Answer

  **(i)** The rate of nine in twenty (45%) is the statistically relevant starting point because it matches the specific description I have provided on my form. The ten in fifty rate (20%) applies to all members, including those who admitted to poor preparation. Since I claim to be in the prepared group, the success rate of that group is the direct comparison. However, this rate is suspect because the group is defined by self-reporting, not verified fact.

  **(ii)** The error in starting at ten in fifty and raising it is double-counting. The nine-in-twenty rate is already higher than the ten-in-fifty rate precisely because it includes people who claimed preparation. If I start at the lower general rate and add value for my claim, I am counting the benefit of "claimed preparation" twice: once in the adjustment and once because the narrow class data is inflated by optimists who claim preparation but fail. Raising a base rate is only legitimate if the case-specific information is verified independently of the claim, such as an audit of the parts list, ensuring the feature is real and not just asserted.

  **(iii)** The two smaller projects suggest I have personal reliability, so the number should change upward. However, the change is limited by the difference in reference classes. A dinghy is not a full restoration; the skills and time scales differ. I cannot adjust my probability higher than the success rate of other members who have completed full restorations successfully, nor can I ignore the fact that my past successes are a tiny sample compared to the fifty recorded projects. The adjustment must remain modest.

  **(iv)** If three of the nine successes relied on professional help, the nine-in-twenty rate is an overestimate for me. I belong to a sub-group within the preparers: those who work alone. Since part of the success rate in the preparer group was driven by professional intervention, removing that factor lowers the expected success rate for non-professionals. The nine-in-twenty figure is no longer applicable; the true rate for someone like me is lower, though the exact number cannot be calculated without knowing how many failures also hired professionals.

  **(v)** Confidence should be low. The sample size of twenty in the relevant group is small, meaning random variation could significantly shift the true rate. Furthermore, the records suffer from selection bias: they only include members who stayed and returned forms. Those who quit in frustration or failed badly may be missing, making the success rates appear higher than they truly are. Treating the figure as exact ignores both the random noise of small numbers and the systematic error of missing data.

  ***

  ### 3. Marking Scheme

  **Part (i) — 4 Marks**
  *   1 mark: Identifies 9/20 as the matching reference class.
  *   1 mark: Identifies 10/50 as the general base rate.
  *   2 marks: Explains that 9/20 is relevant *but* notes the self-reporting bias (the "laundering" issue).
  *   *Distinction:* Full marks require noting the bias. Half marks are given for choosing 9/20 without qualifying the self-report risk.

  **Part (ii) — 5 Marks**
  *   2 marks: Identifies the error as double-counting the "preparation" feature.
  *   1 mark: Explains that the narrow class rate already includes the "claim benefit".
  *   2 marks: States the condition for legitimacy (independent verification/audit of the feature).
  *   *Distinction:* Full marks explicitly describe the mechanism of double-counting. Half marks identify the error but fail to specify the verification condition.

  **Part (iii) — 5 Marks**
  *   1 mark: Correct direction (upward).
  *   2 marks: Identifies the limit (different reference class/complexity).
  *   2 marks: Notes sample size limitation of personal history vs. society records.
  *   *Distinction:* Full marks balance the positive signal against the class difference. Half marks suggest unlimited adjustment or ignore the class difference.

  **Part (iv) — 3 Marks**
  *   1 mark: States the rate is now an overestimate/too high.
  *   2 marks: Explains that the candidate lacks a success factor (professional help) present in the statistic.
  *   *Distinction:* Full marks explain *why* the rate drops (missing causal factor). Half marks simply state it changes.

  **Part (v) — 3 Marks**
  *   1 mark: States confidence should be low.
  *   1 mark: Cites small sample size.
  *   1 mark: Cites selection/survivorship bias (missing quitters/forms).
  *   *Distinction:* Full marks identify both sources of uncertainty. Half marks identify only one.

  ***

  ### 4. List of Errors

  1.  **Quoting ten in fifty as the objective truth:** (Forfeits 2 marks in Part i).
      *   *Why:* It ignores the specific reference class data available. While "honest," it discards relevant information. It is an error of statistical relevance, not just opinion.
  2.  **Counting the preparation twice:** (Forfeits 3 marks in Part ii).
      *   *Why:* This is the core logical failure. Adjusting a base rate for a feature that already defines the narrow class inflates the probability beyond what the data supports.
  3.  **Treating nine in twenty as precise:** (Forfeits 2 marks in Part v).
      *   *Why:* Arithmetic precision does not equal truth. Small samples have high variance. Treating them as exact ignores statistical uncertainty.
  4.  **Narrowing the class until it contains the candidate alone:** (Forfeits 3 marks in Part iii).
      *   *Why:* A class of one has no base rate. This returns the candidate to the inside view, which the exercise forbids.
  5.  **Reciting vocabulary without application:** (Forfeits all marks in the relevant part).
      *   *Why:* Saying "outside view is better" without referencing the specific figures (9/20 vs 10/50) shows memorization, not understanding of the numerical trap.

  ***

  ### 5. Note to Examiner

  A fluent answer that has merely memorised the distinction between inside and outside views will likely score well on Part (i) by reciting that the outside view is preferred. However, the marks will stop coming at **Part (ii)**.

  A memorised answer will typically argue that one should start with the base rate and adjust for unique strengths. It will fail to see that the "unique strength" (preparation) is the very thing defining the narrow class, and that the narrow class data is already contaminated by the same optimism bias affecting the candidate. They will miss the "double-counting" diagnosis. Expect such candidates to score around 8/20, failing specifically on the logical mechanism of the bias.
