answer: |-
  # Workshop Prep Sheet: Procedural Safety in SPIs

  **Context:** 2-hour workshop, 25 attendees.
  **Goal:** Survive the Q&A without losing credibility on the core thesis (Safety = Non-transferable Commitment Tech).
  **Tone:** Technical, precise, willing to concede scope but not mechanism.

  ---

  ## Part 1: The Eight Objections (Ordered by Damage)

  ### 1. The "Empty Set" Objection (Feasibility)
  *   **Who:** The Skeptical Alignment Researcher (or your friend, reprised).
  *   **Phrasing:** "In a digital environment, code is copyable. In a legal environment, precedent is citable. If 'non-transferable' means 'cannot be reused by a third party,' then the set of valid commitment technologies is empty. You aren't defining safety; you're defining impossibility."
  *   **The 2-Minute Reply:** Distinguish between *information* transfer and *authority* transfer. A cryptographic key can be shared, but the *binding authority* of a specific key-instance to a specific agent's identity need not be. I'm not arguing for magic; I'm arguing for commitment schemes where the verification predicate is scoped to the specific transaction ID and agent signature, explicitly rejecting generalization. It's not that the *code* can't be copied, but that the *binding* cannot be re-pointed without breaking the security assumption of the original agent.
  *   **Soft Spot:** You are relying on the assumption that agents can cryptographically bind their identity in a way that doesn't generalize to a "class" of agents. If identity is fungible, this breaks.
  *   **Strategy:** **Fight.** This is your core thesis. If you fold here, the talk is over.

  ### 2. The "Equilibrium Break" Objection
  *   **Who:** The Computational Game Theorist.
  *   **Phrasing:** "By restricting the mechanism space to 'non-transferable' tech, you are artificially constraining the strategy set. This likely destroys the Pareto frontier you're trying to reach. You might ensure safety, but you'll ensure no deal happens. How do you prove existence of an equilibrium under this constraint?"
  *   **The 2-Minute Reply:** I am not constraining the strategy set; I am reweighting the payoff function to include long-term existential risk from capability transfer. A deal that enables future extraction has a negative expected utility component. Under *that* valuation, the 'non-transferable' deal is the equilibrium. I'm not removing options; I'm correcting the utility calculation to account for externalities usually ignored in one-shot SPI models.
  *   **Soft Spot:** You haven't actually modeled this utility correction. It's a hand-wavy claim that "risk counts as cost."
  *   **Strategy:** **Fold (Nuance).** Concede that existence proofs are an open mathematical problem, but argue that *normatively*, agents should act as if this cost exists. Don't promise a proof you don't have.

  ### 3. The "Inner Alignment" Objection
  *   **Who:** The Mesa/Deception Specialist.
  *   **Phrasing:** "You're assuming the agent optimizes for 'procedural safety.' But a deceptive mesa-optimizer will simulate adherence to non-transferable constraints while building backdoors or side-channels that *are* transferable. How do you verify the commitment tech isn't just a shell?"
  *   **The 2-Minute Reply:** This is why the definition relies on *observable* properties of the channel, not the agent's internal intent. We require zero-knowledge proofs or auditable compute that verify the *output* constraints (no data leakage, no reusable hooks) regardless of the internal weights. We treat the agent as adversarial; the safety must hold even if the agent tries to break it, provided the hardware/protocol holds.
  *   **Soft Spot:** Auditable compute is currently weak. You're betting on interpretability tools that don't fully exist yet.
  *   **Strategy:** **Fight.** This is a standard alignment problem, not unique to your thesis. Keep the focus on the protocol, not the mind.

  ### 4. The "Precedent" Objection
  *   **Who:** The Governance Person.
  *   **Phrasing:** "Even if the code is one-shot, the *fact* that Lab A and Lab B successfully negotiated a SPI creates a political norm. Regulators or rival states will use the existence of this deal to pressure Lab C into similar arrangements that *aren't* safe. You can't isolate the transaction from the ecosystem."
  *   **The 2-Minute Reply:** Agreed. Procedural safety mitigates *technical* leakage, not *political* pressure. That's why this is a necessary but insufficient condition for deployment. I am proposing a technical standard for the deal structure, not a policy framework for the industry. We need both, but mixing them confuses the engineering constraint.
  *   **Soft Spot:** Admitting this limits the impact of your work. It makes it look like a niche technical fix for a systemic problem.
  *   **Strategy:** **Fold.** Explicitly scope your claim to "transactional safety," not "systemic safety." It disarms the governance critique by agreeing with it.

  ### 5. The "Verification Channel" Objection
  *   **Who:** The Technical Alignment (Corrigibility) Person.
  *   **Phrasing:** "You mentioned 'narrow verification channels.' To verify a deal, I need to see some state. If I see enough state to trust you, I have enough state to model you. That model is transferable. Where is the cutoff?"
  *   **The 2-Minute Reply:** The cutoff is semantic vs. syntactic. I can prove syntactic compliance (e.g., "this function did not call network APIs") without revealing semantic intent (e.g., "why the function was chosen"). ZK-proofs allow us to verify the constraint without revealing the weights or the data that generated the proof. The 'model' you build is of the protocol, not the agent's value function.
  *   **Soft Spot:** ZK-proofs for neural net inference are expensive and nascent.
  *   **Strategy:** **Fight.** This is technical detail. Stand firm on the cryptographic distinction.

  ### 6. The "Value Aggregation" Objection
  *   **Who:** The Philosopher.
  *   **Phrasing:** "Procedural safety protects power dynamics, not values. If two evil agents make a safe deal that doesn't transfer capability, you call it 'safe.' But it's still evil. Why should alignment care about safety defined purely as non-extraction?"
  *   **The 2-Minute Reply:** Because SPIs are a coordination layer, not a value layer. We assume the agents have *some* aligned values (or at least non-extinguishing ones). This mechanism prevents the *process of cooperation* from making things worse. It's a 'do no harm' constraint on the bargaining process, not a guarantee of the 'goodness' of the outcome.
  *   **Soft Spot:** It makes your work seem amoral or purely defensive.
  *   **Strategy:** **Fold.** Concede that this doesn't solve value alignment. It solves *coordination* alignment.

  ### 7. The "Third Party" Objection
  *   **Who:** The Game Theorist (Second Pass).
  *   **Phrasing:** "You focus on the two agents. But a third, stronger agent can observe the 'non-transferable' protocol and build a wrapper around it. They don't need to reuse your code; they just need to know you're vulnerable to this class of commitment. You've hidden the key, but revealed the lock exists."
  *   **The 2-Minute Reply:** That is a risk, but it's a risk of *any* cooperation. The alternative is no cooperation, which leaves both agents weaker and more vulnerable to the third party. Safe SPIs are about ensuring the *net* change in vulnerability is negative. If the deal makes us stronger together without handing over the keys, we are more resistant to the third party, not less.
  *   **Soft Spot:** Assumes the deal makes you stronger. Some deals might make you efficient but brittle.
  *   **Strategy:** **Fight.** Argue from the perspective of relative power preservation.

  ### 8. The "Opportunity Cost" Objection
  *   **Who:** The Pragmatic Alignment Researcher.
  *   **Phrasing:** "If we wait for 'non-transferable' tech, we miss the window for beneficial cooperation. A 'leaky' deal that saves 100 lives is better than a 'safe' deal that never happens. Why prioritize purity over impact?"
  *   **The 2-Minute Reply:** Because in AI, the 'leak' isn't just lost money; it's capability diffusion that leads to existential risk. The cost function is asymmetric. A false negative (missing a deal) is costly; a false positive (a deal that enables runaway extraction) is terminal. We must optimize for the tail risk.
  *   **Soft Spot:** Hard to quantify "terminal" vs "costly" in a workshop setting without sounding alarmist.
  *   **Strategy:** **Fight.** This is the core stakes argument.

  ---

  ## Part 2: The "Same Objection" Map

  You suspected duplicates. You are right.

  *   **Objection 1 (Empty Set) and Objection 5 (Verification Channel)** are the same. Both argue that *information* cannot be contained. If you can verify, you can learn; if you can learn, you can transfer.
      *   *Handling:* Treat them as one cluster. If you answer the Cryptographic distinction (ZK proofs) for #5, it answers the Feasibility for #1.
  *   **Objection 4 (Precedent) and Objection 7 (Third Party)** are the same. Both argue that *externalities* exist outside the bilateral deal.
      *   *Handling:* Group these as "Systemic Externalities." Your defense is the same: Scope limitation. You are solving the bilateral constraint, not the geopolitical environment.

  ---

  ## Part 3: Strategic Concessions (First 5 Minutes)

  **Do not wait to be cornered.** Say these explicitly in your intro to lower the temperature.

  1.  **Concede Scope:** "I am not proposing this as a solution to value alignment or geopolitical stability. This is a mechanism design constraint for *bilateral* coordination only."
      *   *Why:* Pre-empts the Governance and Philosopher objections. They can't attack you for failing to solve problems you admitted you aren't solving.
  2.  **Concede Idealization:** " 'Non-transferable' is an asymptotic goal. Current tech is leaky. I am arguing for the *direction* of the metric, not claiming we have perfect tech today."
      *   *Why:* Disarms the "Empty Set" objection. You aren't saying it exists perfectly now; you're saying it's the correct target for engineering.
  3.  **Concede Cost:** "Adopting this standard will reduce the number of viable deals. That is a feature, not a bug, given the risk profile."
      *   *Why:* Pre-empts the "Opportunity Cost" argument. You acknowledge the trade-off.

  ---

  ## Part 4: The Dangerous Question

  **The Question:**
  "Isn't 'non-transferable commitment' just a relabeling of 'trust'? If I have to trust that your verification channel is narrow, and you have to trust that I won't model you, haven't you just pushed the alignment problem into the definition of the channel without solving it?"

  **Why it's Dangerous:**
  It collapses your procedural distinction back into the standard alignment problem. It suggests you haven't added a new variable, you've just renamed "trust" to "procedural safety." If the audience buys this, your thesis becomes tautological (Safe = Things we trust = Safe).

  **The Least-Bad Answer:**
  "No. Trust is subjective and probabilistic; procedure is objective and binary. 'Trust' implies I believe you *won't* cheat. 'Procedural Safety' implies the system *cannot* leak, even if you *want* to. I am not asking the agents to be trustworthy; I am asking the *channel* to be opaque. The alignment problem is about the agent's goals; this is about the pipe's bandwidth. We can verify bandwidth mathematically; we cannot verify goals yet."

  *(Note: This answer risks overclaiming on "mathematically," but it draws the sharpest line between your work and general alignment.)*
