answer: |-
  **TO:** Members of the Governance and Standards Committee
  **FROM:** [Your Name], Lay Member
  **DATE:** 7 March 2024
  **SUBJECT:** Recommendation on the Powers of the Citizens' Chamber

  Colleagues,

  We have spent a year designing a citizens' chamber that is demographically fair. We have solved the hard problem of selection. Now we face the harder problem of purpose. If we give this chamber too little power, it is a waste of public money and civic goodwill. If we give it too much, we risk legal challenge and constitutional conflict with the elected council. We cannot adopt all three options before us; we must choose one. This note sets out my recommendation, the criteria for that choice, and how we address the legitimate concerns raised by officers, academics, and campaign groups.

  **Criteria for Judgment**
  To ensure those who disagree with my recommendation can respond to reasons rather than preference, I propose we judge the options against four criteria:
  1.  **Legitimacy:** Does it respect the ultimate authority of the elected council while valuing the sorted chamber?
  2.  **Effectiveness:** Does it compel the council to think twice, or merely tick a box?
  3.  **Legality:** Does it comply with the monitoring officer's advice regarding the fettering of discretion?
  4.  **Complementarity:** Does it supplement the council without creating a rival centre of power?

  **Recommendation**
  I recommend we adopt **Option (b): The Suspensive Power**, without the proposed agenda-setting amendment.

  Option (a) is advisory only. Given the history of the high street assembly two years ago, where the question was drafted to ensure a specific outcome, an advisory model invites the accusation that this is a fig leaf. It lacks teeth. Option (c), Concurrency, likely violates the legal advice. Automatically becoming policy unless rejected by a two-thirds majority effectively transfers decision-making power, fettering the discretion of future councils. Option (b) sits in the necessary middle ground. It allows the chamber to return a decision, forcing a pause and a higher voting threshold for override. This creates substantive friction without unlawfully transferring authority.

  **Procedural Requirements as Substantive Power**
  The monitoring officer advises that we cannot bind ourselves irrevocably. Some members worry this reduces the chamber to a talking shop. I disagree. Procedure is not merely process; it is power. By requiring a two-thirds majority to override a second rejection, we change the political cost of ignoring the chamber. A simple majority can pass controversial policy; a two-thirds majority requires consensus across party lines. This procedural hurdle forces the elected members to engage seriously with the chamber's reasoning. It does not transfer the power to decide, but it rigorously structures how that decision is taken, reasoned, and recorded. This satisfies the legal constraint while ensuring the chamber's work cannot be easily dismissed.

  **The Agenda-Setting Amendment**
  I must take a definite position on the academic's amendment to allow the chamber to call in decisions or adopt topics via petition. I recommend we reject this amendment.

  If the chamber can set its own agenda based on petitions, while the council sets its agenda based on elections, we create two bodies claiming to speak for the same residents. What happens if 3,000 residents petition the chamber to stop a housing development that the council, elected by 310,000 people, has approved? We would have two legitimate claims to represent the public will in direct conflict. The chamber must be a supplement to the elected chamber, not a rival. The council must retain responsibility for the strategic agenda. However, to mitigate the risk of officer control, we should require that when the council refers a matter, the chamber has the right to commission independent expert evidence alongside officer briefings. This balances agenda control with evidential independence.

  **The Fig-Leaf Objection**
  The campaign group argues that officer-controlled briefings make the chamber a sham. They are right to be suspicious given our past record. Saying "officers will be impartial" is not enough; structural bias is rarely conscious. We cannot give the chamber agenda-setting power, but we must ensure the information it receives is not managed to produce a desired outcome. I propose we establish a protocol where the chamber's secretariat includes independent facilitation support, not just council officers. The briefing pack must include dissenting views from within the officer team where they exist, and the chamber must have budgetary authority to invite external witnesses not nominated by the cabinet. This addresses the fig-leaf objection without compromising the council's strategic direction.

  **Sunset Clause and Withdrawal**
  Permanent innovations need review. I propose a sunset clause requiring a formal review of the chamber's operation after five years. However, to protect the chamber's independence, the arrangement cannot be withdrawn simply because the chamber becomes inconvenient. Withdrawal or suspension of the scheme should require a two-thirds majority vote of the full council, ensuring it cannot be abolished by a simple majority seeking to avoid scrutiny.

  **Statutory Duties**
  Finally, regarding statutory duties: the chamber's remit must explicitly exclude matters where the council has no legal discretion, such as safeguarding, setting a balanced budget, or collecting the council tax precept. If a chamber recommendation would leave us unable to meet a statutory duty, it must be ruled out of order by the monitoring officer at the outset. The chamber cannot be empowered to block the council from obeying the law.

  **Motions for the Committee**
  To move this forward for full council in June, I propose the committee votes on the following motions:

  1.  **That the Committee recommends to Full Council the adoption of Option (b) (Suspensive Power) as the governing authority for the Citizens' Chamber.**
  2.  **That the Committee recommends rejecting the amendment regarding independent agenda-setting via petition, subject to the inclusion of independent facilitation support for evidence gathering.**
  3.  **That the Scheme includes a provision for a formal review after five years, and that withdrawal of the Scheme requires a two-thirds majority vote of Full Council.**
  4.  **That the Chamber's remit explicitly excludes matters where the Council is under a statutory duty to act, including safeguarding and budget setting.**

  This path respects the law, empowers the citizens without confusing the lines of accountability, and ensures that when the chamber speaks, the council must listen hard.

  Yours sincerely,

  [Your Name]
  Lay Member, Governance and Standards Committee
