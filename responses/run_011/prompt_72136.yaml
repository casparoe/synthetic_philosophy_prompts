answer: |-
  **MEMORANDUM**

  **TO:** Fact-Checking Unit
  **FROM:** [Your Name/Unit Lead]
  **SUBJECT:** Operational Standards for Causal Attribution ("Cui Bono")

  This memo clarifies the evidential limits of the maxim "cui bono? — ask who benefits." While useful for generating leads, the phrase is frequently misused to close inquiries rather than open them. Specifically, we must distinguish between benefit as a starting point for investigation and benefit as proof of intent. The following menu unpacks the logical readings available to us.

  **1. Readings of the Maxim**

  1.  **The Retrospective Tautology**
      *   (a) Every event leaves some party better off than they would have been otherwise.
      *   (b) True by definition of relative states following any change.
      *   (c) Platitude.
      *   (d) Neither; offers no guidance.

  2.  **The Investigative Heuristic**
      *   (a) Begin inquiry by listing parties with vested interests in the outcome.
      *   (b) Requires that investigators have limited resources and motives cluster around beneficiaries.
      *   (c) Substantive and defensible.
      *   (d) Heuristic for deciding where to look.

  3.  **The Motive Indicator**
      *   (a) The existence of a benefit establishes a plausible motive for the beneficiary to have caused the event.
      *   (b) Requires that actors generally act on motives and that the benefit was foreseeable.
      *   (c) Substantive and defensible.
      *   (d) Warrant for suspicion, not conclusion.

  4.  **The Specificity Claim**
      *   (a) The benefit was so specific and timed that it is unlikely to arise from random failure.
      *   (b) Requires low probability of this benefit occurring under the null hypothesis (accident).
      *   (c) Substantive and defensible.
      *   (d) Warrant for believing a conclusion.

  5.  **The Causal Attribution**
      *   (a) Because a party benefited, they must have caused the event.
      *   (b) Requires that accidents never produce benefits for identifiable parties.
      *   (c) Substantive and false.
      *   (d) Warrant for believing a conclusion (invalid).

  **2. "Ask Who Benefits" vs. "Follow the Money"**

  These are not one slogan in two costumes; they have different logical force. "Follow the money" is a forensic instruction to trace actual transactions, providing evidence of means and action. "Ask who benefits" is a speculative instruction to infer potential motive from an outcome. The former produces evidence; the latter produces hypotheses. Confusing the two treats a hypothesis as evidence.

  **3. Evidential Force of the Recent Datum**

  We must confront the data from our regional files: of 41 documented corruption or outage events, 34 had at least one identifiable party with pending business who stood to gain from the delay. In the four cases confirmed as deliberate interference, the beneficiary was no harder to identify than in the accidental ones.

  These figures drastically reduce the evidential force of "the developer benefited."
  *   **Base Rate:** Approximately 83% of accidental outages produced identifiable beneficiaries.
  *   **Discriminative Power:** Knowing a party benefited barely shifts the probability from "accident" to "deliberate."
  *   **Required Fact:** To discriminate between accident and interference, we need evidence of **specificity** and **control**. We must show that the benefit was unlikely to occur under the accident model (e.g., the outage affected *only* the objections against this specific developer, rather than a broad system class) or that the beneficiary had the means to engineer the specific failure mode. Benefit alone is noise.

  **4. Opposing Uses of the Maxim**

  You noted two uses pointing in opposite directions: my colleague's (the beneficiary of an anomaly is probably its author) and the fact-check target's (the challenger stands to gain from casting doubt, so the challenge is manufactured).

  *   **One Reading or Two?** This is a single reading applied twice. Both uses reduce the validity of a claim or event to the interest of the party involved.
  *   **Coherence:** They can coherently be used by opposing sides only if treated as a heuristic for scrutiny ("scrutinize this closely"). They cannot coherently be used as proof of falsehood or guilt by both sides simultaneously without resulting in infinite regress (i.e., who benefits from accusing the beneficiary?). If Side A says "You benefit so you lied," and Side B says "You benefit from exposing me so you lie," neither has proven anything. The maxim cancels out when weaponized by all parties.

  **5. Conclusion**

  The phrase "ask who benefits" is a tool for triage, not a tool for judgment. It tells us where to look, not what we will find. Using it to close a discussion assumes that accidents do not produce beneficiaries, which our own data proves false.

  Verdict: none
