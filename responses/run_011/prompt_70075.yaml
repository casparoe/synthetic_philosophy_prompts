  ### 3. Written Comments to Student

  1.  **On Mind-Brain Identity (c)(i):** You argue that Kripke concludes mind-brain identities are safe once rigidity is established. Please review Lecture III. Kripke argues the opposite: because 'grief' (like 'pain') is picked out by an essential phenomenal property, there is no "appearance" distinct from the reality to explain away the illusion of contingency. For Kripke, this disanalogy with *heat* is why the identity theory fails, not why it succeeds.
  2.  **On the Contingent A Priori (b):** Your use of the Standard Metre example is perfect. You clearly articulated why the stick's length is contingent (it could have expanded/contracted) while the statement is a priori (by stipulation). This is exactly the distinction required.
  3.  **On Reference Fixing (Closing Paragraph):** Be careful distinguishing between fixing the reference and giving the meaning. Even if a name's reference is fixed by a description, Kripke argues the name becomes rigid. Therefore, knowing the descriptions are satisfied does not automatically make the identity statement *a priori*; one still needs empirical information to know the two descriptions pick out the same object.
  4.  **Exam Technique:** You wrote a strong conclusion, but avoid adding unasked-for examples (like Hesperus) at the end of an exam unless you are certain of the textual details. It risks introducing errors (as above) that distract from your otherwise strong performance on the set questions.

