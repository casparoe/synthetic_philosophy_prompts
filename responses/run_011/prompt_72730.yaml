  ### The Naturalist's Counterattack

  Your flatmate's strongest move is to attack the **Reference Class** in Case B. She will argue that defining the reference class as "70–75 year old women" is cheating if that entire class is pathologically degraded. She will invoke the **"Normality of Disease" objection**: if a whole population is diseased (e.g., high hypertension in a high-salt society), statistical normality does not equal health. She will redefine the reference class to "Healthy Adult Humans" or "Evolutionary Environment," forcing Brenda's BP back into statistical abnormality (Criterion 1 becomes Yes).

  *Does it rescue the verdict?* It rescues Boorse's verdict (making it a Disease), but it **relocates the problem**. It forces Boorse to admit that "Statistical Normality" is not enough; you need "Idealized Normality." This collapses Boorse toward Wakefield (design-based) or Nordenfelt (goal-based), undermining the pure naturalist claim that disease is *just* a value-free statistical fact. She saves the theory by smuggling in a value judgement about which reference class *ought* to be used.

