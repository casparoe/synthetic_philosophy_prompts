  ### Analysis

  **Case A (The Benign Outlier)**
  *   **Boorse:** Rules **Disease**. The neutrophil count is statistically subnormal for the reference class (adult males), satisfying the Biostatistical Theory's core requirement of functional efficiency below population norms. Criterion (1) carries the weight; the lack of harm is irrelevant to Boorse.
  *   **Wakefield:** Rules **Not a Disorder**. While the count is low, the *mechanism* (bacterial killing) is intact, and crucially, there is no *harm*. Since Harmful Dysfunction requires both design failure and negative consequence, the absence of harm (and arguably design failure) vetoes the diagnosis. Criterion (2) and (3) fail.
  *   **Nordenfelt:** Rules **Healthy**. Health is the ability to achieve vital goals. Arthur's tennis and work are unimpeded. The biological statistic matters only insofar as it affects action; here, it does not. Criterion (3) is decisive.

  **Case B (The Normal Breakdown)**
  *   **Boorse:** Rules **Not a Disease**. Boorse uses age-specific reference classes. Since 65% of her peers share this blood pressure, it is statistically typical function for a 72-year-old female. Criterion (1) fails despite the pathology.
  *   **Wakefield:** Rules **Disorder**. The circulatory mechanism is failing its evolutionary design (regulating flow), and Brenda suffers harm (falls, loss of gardening). The statistical normality of the condition in her age group does not negate the internal dysfunction. Criterion (2) and (3) succeed.
  *   **Nordenfelt:** Rules **Disorder**. Her vital goal (gardening) is obstructed by her condition. The biological cause matters less than the practical inability to pursue what gives her life meaning. Criterion (3) succeeds.

  **Case C (The Medicalized Normal)**
  *   **Boorse:** Rules **Not a Disease**. The TSH level is within the statistical reference range. There is no functional deviation from the norm. Criterion (1) fails.
  *   **Wakefield:** Rules **Not a Disorder**. The thyroid mechanism is functioning correctly, and there is no current harm. Treating a risk factor without dysfunction or present harm falls outside HD analysis. Criterion (2) and (3) fail.
  *   **Nordenfelt:** Rules **Healthy**. Carl's life organisation (running, work) is unaffected. The diagnosis is imposed externally, not generated by a failure of his agency. Criterion (3) fails.

