  ### The Vignettes

  **Case A: The Benign Outlier**
  Arthur is 52, a sedentary accountant with no fatigue or infections. His Absolute Neutrophil Count is 1.2 × 10⁹/L (*made-up threshold: <1.5 is neutropenic; reference class mean 2.5, SD 0.6, placing him >2SD below par*). His neutrophils kill bacteria normally; there are just fewer of them due to a benign genetic variant. He works full-time, plays weekend tennis, and reports no impediments to his life plans.
  *Verdicts:* Boorse: Disease (Statistical failure). Wakefield: Not a Disorder (No mechanism failure, no harm). Nordenfelt: Healthy (Vital goals unimpeded).

  **Case B: The Normal Breakdown**
  Brenda is 72, a retired teacher who recently fell due to dizziness and stopped gardening, her primary vital goal. Her blood pressure is 160/95 mmHg (*made-up base rate: 65% of women aged 70–75 exceed 150/90, making this statistically typical for her reference class*). Her arteries are stiffened and baroreceptors unresponsive, a clear failure of the circulatory design. She experiences physical limitation and distress from the loss of her hobby.
  *Verdicts:* Boorse: Not a Disease (Statistically normal for age). Wakefield: Disorder (Mechanism failure + Harm). Nordenfelt: Disorder (Vital goals blocked).

  **Case C: The Medicalized Normal**
  Carl is 45, a competitive runner with stable weight and no fatigue. His TSH is 3.5 mIU/L (*made-up reference range: 0.5–5.0; made-up treatment threshold: GP medicates >3.0 for 'optimization'*). His thyroid gland responds normally to demand, and his running times are unchanged. Despite zero symptoms or functional loss, his GP prescribes levothyroxine to prevent hypothetical decline.
  *Verdicts:* Boorse: Not a Disease (Within statistical norms). Wakefield: Not a Disorder (No dysfunction/harm). Nordenfelt: Healthy (Goals unimpeded). *Clinical Reality:* Diagnosed and medicated.

