      *   **The Finding Wording:** Needs to be precise. It shouldn't just list 5 things. It needs to identify the *systemic failure* that allowed the 5 things to align. This satisfies the "singular" requirement conceptually while acknowledging the complexity. *Wait, the prompt says the charter requires naming 'the root cause'.* If I recommend a charter change, I can propose new wording. If I accept with amended finding, I need to frame the "root cause" as the *management system failure* that allowed the convergence. Let's go with framing the root cause as the "Failure of the Management of Change and Defense-in-Depth Protocol." This is singular but encompasses the five factors.
      *   **Corrective Actions:** Must attach to this singular finding. They should be layered (addressing the "any two" logic).
