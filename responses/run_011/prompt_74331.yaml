answer: |-
  The clock on the cinderblock wall read 4:58 PM. Mr. Henderson, the panel chair, tapped his pen against the agenda, a rhythmic ticking that matched the second hand. He wanted to be home by six. We all did, but he had a daughter's soccer game, and the urgency radiated off him like heat.

  On the table lay a manila envelope, flat and unsealed. Inside it were two slips of cardstock, identical in weight, texture, and cut. I had trimmed them myself ten minutes ago, using the paper cutter in the copy room, ensuring the edges were perfectly flush. A millimeter of difference could be felt through the paper; a millimeter could be a reason. We had spent the last hour eliminating reasons.

  We had rejected alphabetical order. "Chen" versus "Corbett." Too arbitrary, someone had said. A surname is an accident of marriage or history, not merit. We had rejected submission timestamp. One application arrived at 8:01 AM, the other at 8:14 AM. Too digital, too dependent on server latency. Too much like a race neither child knew they were running. We needed a mechanism that had no memory and no preference. We needed a coin toss, but dignified. We needed a lottery.

  "Eight of us reviewed the files," Henderson said, looking around the table. "Eight of us found zero points of differentiation. Composite scores identical. Essay blind reads indistinguishable. Socioeconomic bands identical. Walking distance identical." He looked at me. "Even the tie-breaking rubric yields a tie."

  I nodded, keeping my face neutral. I was the eighth reviewer. I was also the only one who knew that one of the names on the slips inside the envelope was Maya. My sister's daughter.

  I had recused myself from the scoring phase. I had left the room when the essays were discussed. I had signed the ethics form declaring my conflict. But when it came to the drawing of lots, the handbook was silent. It simply said *a panel member shall conduct the draw*. I had not volunteered, but I had not stepped back. To step back now would require an explanation I couldn't give without implicating the integrity of the scoring I had already watched them complete. If I left, it would look like I knew something about the scoring that warranted exclusion. So I stayed. I sat with my hands folded on the table, feeling the heat of the secret in my palms.

  "Let's finalize the slips," Henderson said.

  I picked up the pen. It was a standard district ballpoint, black ink. I wrote MAYA on one slip. I wrote LEO on the other. I did not let the pen linger. I did not press harder on one name than the other. I folded them once, then twice. The creases were sharp. I ran my thumb over the folds. The paper offered no resistance. It did not care which name it held. It was wood pulp and bleach, indifferent to the futures trapped inside its fibers.

  This was the promise of the lottery: that indifference could be transferred from the human to the object. We claimed the coin had no reason to favor heads, and therefore, the outcome was just. But as I slid the slips into the manila envelope, I wondered if we were merely outsourcing our paralysis. Buridan's ass starves between two identical bales of hay because it cannot choose. We were not starving. We were full of data, yet starving for a reason. So we built a machine to choose for us, pretending that the machine's blindness was the same as our own.

  It wasn't. The machine was truly blind. I was not.

  Outside the door, in the hallway, the air conditioning hummed. I could hear the muffled scuff of shoes. Two families waited out there. One set of parents held their breath because their daughter loved robotics. The other set held their breath because their son needed the STEM credential for college. And I held my breath because my niece was out there, and I was holding the envelope that would decide her fate.

  "Ready?" Henderson asked.

  "Ready," I said. My voice sounded thin.

  I shook the envelope. The slips slid against each other, a soft *shhh-shhh* sound. They mixed. They became anonymous again. To anyone else in the room, they were Slip A and Slip B. To me, they were Blood and Stranger. The paper didn't know. The paper couldn't know. But my hand would know.

  When I reached in, would my fingers seek a specific texture? Would my subconscious guide me toward the fold I made slightly tighter? I had tried to make them identical, but human hands are not machines. I had folded Maya's slip first. Was there a microscopic difference in the ink drying time? A slight variance in the humidity of the room during those thirty seconds?

  We told ourselves the lottery resolved the tie. But it didn't resolve anything. It just moved the decision from a place of reason to a place of chance. It hid the violence of the choice behind the veil of randomness. If I chose Leo, Maya loses. If I chose Maya, Leo loses. The lottery doesn't change the loss; it just absolves us of the responsibility for it. Or it tries to.

  But I wasn't absolved. I was the conduit.

  Henderson checked his watch. 5:12 PM. "Just draw one, David. Read the name. We admit the winner."

  The room was quiet. The other seven panelists watched me. They saw a colleague performing a duty. They saw the procedure working as intended. They saw indifference. They believed that because the protocol was impartial, we were impartial. They didn't see that the protocol was built to hide the fact that impartiality is impossible when you know the names.

  I held the envelope up. The light from the fluorescent tubes glared off the manila surface. I thought about the hallway. I thought about my sister asking me later, *Did you do everything you could?* If I said yes, she would ask, *Did you draw?* If I said yes, she would know the odds were fifty-fifty. She would know I held the knife.

  To search for a reason to prefer one slip over the other now would be corruption. To rig the draw would be a crime. But to pretend I had no preference was a lie. The procedure was built on the assumption that the drawer is empty. I was not empty. I was full of bias, full of love, full of the terrifying knowledge that I could feel the difference between the slips even if no one else could.

  Was the ass dying because the hay was identical? Or was it dying because it claimed to be a machine that could measure nothing but weight?

  "David?" Henderson prompted.

  I opened the flap of the envelope. The smell of old paper and glue drifted out. I slipped my right hand inside. The interior was dark. My fingers brushed the cold surface of the cardstock. There were two distinct objects now, separated by the dark space of the envelope.

  I hovered my hand between them. I could feel the air displacement. I could feel the potential energy of the moment. If I pulled the left one, Maya might stay. If I pulled the right one, she might go. Or vice versa. The mapping was arbitrary, but the consequence was absolute.

  I closed my eyes. It was a gesture of fairness, or perhaps of cowardice. If I couldn't see the hand, maybe the hand wouldn't know what it held. Maybe I could become the machine for ten seconds. Maybe I could erase the niece and leave only the applicant.

  But the blood hummed in my fingertips. The paper was indifferent, but I was the interface. The lottery didn't resolve the tie; it just forced me to embody the randomness. It demanded I become the coin.

  I extended my index finger and thumb. I touched the edge of one slip. It was cool. It was dry. It waited.

  "Go on," Henderson said softly.

  I gripped the paper.
