  The wasp dragged the caterpillar across the sand. It was heavy, segmented, and passive, paralyzed but alive. The wasp moved backward, antennae twitching, hauling the biomass toward the burrow entrance. She left the prey on the threshold. She disappeared into the dark shaft. Above ground, the air shifted. A shadow moved the caterpillar six inches to the left. The wasp emerged. She scanned the threshold. It was empty. She found the caterpillar. She dragged it back to the threshold. She left it. She disappeared into the dark shaft to check the nest again.

  Nadia stood in the colony room. The hum of the incubators was a physical weight against her ears. Des was leaning against the bench near the sink, arms crossed, smiling in a way that suggested he knew something about the room's geometry that she did not. He had waited for her. He rarely came this late.

  "You're still here," Nadia said.

  "Curiosity," Des said.

  She turned to the main incubator. It was a large stainless-steel cube, locked tight to maintain the humidity required for the wasp pupae. Her hand rose. She positioned the heel of her right palm over the latch mechanism. She pressed. She felt the metal give, then seat. She pressed again. Solid. The resistance was specific, a click transmitted through the carneous pad of her hand. She turned to the logbook. She picked up the pencil. She wrote the time.

  Des pushed off the bench. He walked to the incubator and ran a finger along the seal. "Just testing the system."

  Nadia watched him. She did not ask what system. She capped the pencil. She looked at the latch. She pressed the heel of her hand against it again. Once. Twice. The resistance was identical to the moment before. It required the same voltage of attention. It did not matter that she had done it sixty seconds ago. The neural pathway did not deepen. The cost was not amortized.

  "Night," Des said. He left the room.

  Nadia locked the door behind him. She returned to the incubator. She pressed the latch. Once. Twice. She opened the door. There was a folded yellow index card wedged between the frame and the locking block. The latch could not seat. The card prevented the metal from meeting metal. She took the card out. She unfolded it. It was blank. She folded it back. She put it in her pocket. She shut the door.

  She raised her hand. She pressed. Once. Twice. The click was clear. She walked to the table. She opened the logbook. She wrote the time again.

  Three years ago, the pencil had broken. The lead snapped inside the wood. She had not paused. She had taken a blue pen from her shirt pocket. She wrote in the margin because the grid was too small for the ink flow. On Monday, she bought a new pencil. She transferred the entry. The ink did not matter. The grid did not matter. The mark had to be made.

  Two years ago, the incubator was out for service. The unit had been wheeled away for calibration. The space where it stood was empty concrete. The latch block had been unbolted and set on a nearby bench. Nadia walked into the room. She approached the empty space. She raised her hand. She pressed the heel of her palm against the air. Once. Twice. Her hand met no resistance. The muscles in her forearm fired regardless. She walked to the table. She opened the logbook. She wrote the time.

  The wasp emerged from the burrow. The caterpillar was gone. A human foot had kicked it away. The wasp scanned the threshold. She flew out in a widening spiral. She found the caterpillar. She dragged it back. She placed it on the threshold. She left it. She went inside to check the nest.

  Subject approaches vertical surface. Right arm flexes at elbow to ninety degrees. Heel of palm contacts latch mechanism. Pressure applied for 1.5 seconds. Pressure released. Pressure applied for 1.5 seconds. Subject rotates body ninety degrees left. Subject walks to stationary object. Subject grasps writing implement. Subject applies graphite to paper surface.

  Nadia capped the pen. She looked at her hand. The skin on the heel was slightly reddened. It would not callus. The skin did not learn. Every night, the hand arrived at the latch as if it had never been there before. There was no savings in effort. There was no backgrounding of the task. It stood in the foreground, bright and demanding, exactly as it had on day one.

  She picked up the yellow card. She held it between her fingers. It was light. It was nothing. It had stopped the door from closing. She put it in the bin. She looked at the incubator. The light on the front panel blinked green. Temperature stable. Humidity stable.

  She turned off the main lights. The emergency strips glowed low along the floor. She walked to the door. She stopped. She turned back. She walked to the incubator. She pressed the latch. Once. Twice. She did not need to. The door was closed. She had just checked it. The cost was high. She paid it.

  The wasp came out. The caterpillar was on the threshold. She grabbed it. She began to drag it down the shaft. A twig fell across the entrance. She dropped the prey. She removed the twig. She threw it aside. She grabbed the caterpillar. She dragged it to the threshold. She left it. She went inside.

  Nadia stood in the dark. Her hand hung at her side. The attention required to leave the room was the same as the attention required to check the latch. There was no sliding into sleep mode. There was no coasting. The mind remained lit, fully occupied by the geometry of the room and the position of her own limbs.

  She thought about the pen. She thought about the air. She thought about the card. They were all variables. The equation remained constant. She did not know why the equation existed. She did not know what it solved. She only knew that if she did not complete the terms, the night would not close.

  She walked to the door. She put her hand on the handle. She waited. She turned the handle. She stepped into the hall. She pulled the door shut. She listened for the click. She did not press the latch from the outside. That was not the protocol. The protocol ended inside.

  She walked down the corridor. Her footsteps were loud. She counted them. She did not mean to. She stopped counting. She started again.

  **Alternative Last Lines**

  1. She reached the exit, pushed the bar, and did not look back to see if the door had actually latched.
  2. Outside, the air was cold, and she pressed the heel of her hand against her own thigh, once, twice, before finding her keys.
  3. The night was fully performed, in full, and it cost her exactly as much attention as the first time.
