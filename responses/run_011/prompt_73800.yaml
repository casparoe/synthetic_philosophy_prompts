  I'm in week nine of a jurisprudence seminar on statutory interpretation and I have to hand in a paper proposal by Friday — the paper itself is around 6,000 words, due at the end of term, so roughly eleven weeks of actual working time once I subtract exams. My half-formed idea, which I tried to explain after class last week and got a very patient "interesting, but sharpen it," is this. Textualists sell their method as the humble one: the judge doesn't get to decide what the law should aim at, she just applies the enacted words, so the theory is supposed to be about deferring to somebody else's choices and keeping judicial construction near zero. But when I actually trace how the method gets used in the hard cases, the judge looks like she's doing a lot of construction anyway — she's building an idealized lawmaker who is fully informed, coherent across the whole statutory scheme, speaks in ordinary English, and would never have intended an absurd result, and then she asks what that construct would have conveyed to a reasonable reader. That figure has a lot in common with what a purposivist does when she reconstructs the mischief the provision was aimed at and reads the text as a means to it. Both look like the judge building a normative model of an author and then reading the words through it. They disagree about which features the model is allowed to include, but I can't tell whether that's a difference in kind or just a difference in how much gets smuggled in.

