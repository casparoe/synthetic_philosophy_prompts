answer: |-
  **Proposal Title:** The Constructive Load of Textualist Humility: A Premise Audit of Statutory Interpretation

  **Research Question**
  Textualism markets itself as a method of judicial humility, claiming to defer to enacted words rather than judicial policy preferences. Purposivism openly reconstructs legislative aims. This paper asks: Is the difference between these methods categorical, or merely a dispute over the normative parameters of the constructed legislator? Specifically, I will test whether every interpretive principle a textualist claims is "text-based" can be restated as a claim about the communicative dispositions of an idealized reasonable legislator. If textualism relies on a model of a speaker who is coherent, informed, and avoids absurdity, it is engaging in the same constructive act as purposivism, differing only in which features the model is allowed to include. The determinate question is whether there exists any textualist principle that survives stripping away all appeals to what a reasonable lawmaker would have meant.

  **Literature and Gap**
  Existing debates often collapse into three unhelpful categories. First, hard intentionalism about actual collective mental states, which few defend because legislatures lack singular minds. Second, the realist claim that methodology is merely policy preferences wearing costumes, which ignores the conceptual constraints judges actually face. Third, the conciliatory view that "we are all intentionalists now," which obscures the structural differences in justification. My project occupies the gap between these: accepting that all interpretation involves construction, but asking whether textualism's specific constraints are methodological rules or normative choices about the author-model. This distinguishes my work from pure conceptual analysis by grounding it in judicial reasoning, and from empirical voting studies by focusing on the premises of justification rather than outcomes.

  **Methodology**
  The centerpiece is a "Premise Audit" of interpretive splits over 18 U.S.C. § 924(c), specifically the jurisprudence surrounding the word "use." I will analyze *Smith v. United States* (trading a gun for drugs constitutes use) and *Bailey v. United States* (mere possession near drugs does not). For each opinion—majority, concurrence, and dissent—I will extract every premise required to move from the text to the holding that is not explicitly contained in the enacted words.

  Each premise will be coded as Semantic (linguistic conventions), Evidential (facts about context), or Normative (values about fairness or purpose). I will then test each premise for cross-method acceptance: could a purposivist accept this premise? Could a textualist? To prevent rigging—where I might score textualist premises as "reading" and purposivist premises as "construction"—I will apply a "stripping test." If removing the premise changes the outcome, it is constructive. If the premise relies on an assumption about what the legislature would not have intended, it is modeled. This beats a history-of-debate survey because it isolates the structure of reasoning rather than the rhetoric, and beats armchair theory because it forces engagement with actual judicial labor.

  **Timeline (11 Working Weeks)**
  *   **Weeks 1–2:** Close reading of *Smith*, *Bailey*, and related § 924(c) opinions. Extract raw premises.
  *   **Weeks 3–4:** Develop the coding protocol. Run a pilot audit on one opinion to refine the Semantic/Evidential/Normative categories.
  *   **Weeks 5–7:** Complete the Premise Audit for all selected opinions. Calculate the "constructive load" per opinion.
  *   **Weeks 8–9:** Draft the argument. Focus on mapping the normative premises hidden within textualist claims of ordinary meaning.
  *   **Weeks 10–11:** Revision. Stress-test the failure conditions and refine the scope.

  **Results and Failure Conditions**
  A successful result demonstrates that textualist opinions rely on normative premises about the idealized legislator (e.g., "Congress does not write superfluities") that are structurally identical to purposivist premises, differing only in content.
  I anticipate three specific failure conditions:
  1.  **Triviality:** The claim turns out to be that "all interpretation is constructive," which is banal. I avoid this by showing textualism explicitly denies being constructive.
  2.  **Strawman:** Sophisticated textualism already admits to constructing a reasonable speaker. I will counter by focusing on the public rhetoric of humility that claims otherwise.
  3.  **Non-Explanatory:** The theory is true but predicts nothing. I will show it explains why textualist outcomes shift when the model of the "reasonable legislator" shifts (e.g., from literalist to contextualist).
  Regarding a construction-free principle: The only candidate is "plain meaning" without context. I will argue this collapses immediately upon application, leaving no residual cases for my thesis to shrink to.

  **Scope and Objections**
  At 6,000 words, I must cut the broader history of textualism and focus strictly on the § 924(c) cases as the proof of concept. I will not attempt to generalize to constitutional interpretation.
  The strongest objection is that textualism constrains *which* norms are permissible, whereas purposivism allows free-ranging policy analysis. My answer is that the selection of permissible norms is itself a normative construction about the judicial role. Textualism does not escape construction; it merely hides the normative choice behind a claim of linguistic necessity.

  Verdict: fundable as pitched
