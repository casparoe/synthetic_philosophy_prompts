      *   *Constraint Check:* Mark historical uncertainty (Condorcet's text details). Distinguish settled math (binomial calc) from open debate (correlation handling, democracy implications). No citations.

  7.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction on Independence:* Be careful not to say "LLMs can't be independent." Say "Same model weights imply shared systematic error, violating the probabilistic independence assumption required for the theorem's limit behavior."
