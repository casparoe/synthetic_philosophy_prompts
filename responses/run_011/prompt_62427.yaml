answer: |-
  The three threads should carry the weight of (8) money and provincial plunder, (7) the decay of informal norms, and (4) institutional mismatch, in that order.

  Your suspicion that (1) and (7) are upstream while (2), (3), and (8) are transmission mechanisms is half-right but historically risky on the land question. (7) is definitely upstream: once the *mos maiorum* (the unwritten rules of restraint) fractures, political violence (3) and instrumentalized courts (5) become viable tools rather than taboos. However, (1) is increasingly viewed by modern economic historians as less catastrophic than the sources claim; smallholders persisted longer than the Gracchan narrative allows, and in a maritime setting, land concentration is hard to transpose without feeling like a pastiche. Replace (1) with (8) as the primary upstream driver. Money is the solvent that dissolves the norms. The cost of office forces provincial plunder; plunder requires military success; military success requires unpaid armies to tolerate delay; unpaid armies look to generals for payment. (8) drives (2), not the other way around.

  Regarding your Quartermaster POV and candidate (2): do not build the thread on the idea that soldiers ideologically shifted loyalty to commanders because of a specific "reform." That is largely Augustan propaganda designed to justify the Principate. Soldiers remained institutionally loyal to the Senate until the state literally could not pay them. The thread should focus on the logistics of (8): the state treasury is empty, the general promises pay he doesn't have, and the quartermaster sees the ledger forcing the loyalty shift. That is solid enough for a novel because it is material, not ideological.

  (4) is the essential trap for your Reformer. It is highly transportable because it doesn't require Roman-specific machinery like tribes or auguries; it only requires a system designed for consensus among equals being stressed by high-stakes divergence. When obstruction is cheap and passage is expensive, extremism is rewarded. This makes the Reformer's radicalization rational, not just emotional. (9) is downstream of (4) and (7); the class closes itself off because the norms allowing mobility have decayed and the institutions allow vetoing newcomers.

  (6) is the least transportable. The Italian Allies issue is specific to a confederation of distinct polities seeking integration. Unless your "outsider" is from a conquered satellite state, this feels artificial. Fold the energy of (6) into (9): the outsider isn't seeking voting weight for a region, but admission for a family type the oligarchy now excludes.

  (5) and (3) are epiphenomenal. They are symptoms of (7) and (8). Do not give them thread weight; let them appear as events in the other threads. The courts become prizes because money (8) demands immunity and norms (7) no longer forbid weaponizing the law. Violence normalizes because the cost of losing a vote rises (due to money at stake) while the restraint against killing rivals falls (due to norm decay).

  A missing factor that belongs near the top is the **Elite Security Dilemma**. Once norms decay, no senator knows if his rival is playing by the old rules. Fear drives pre-emptive strikes. This is distinct from (7) because it is rational fear, not just moral rot. It explains why good men do bad things without needing them to be villains. It fits your Reformer and Outsider perfectly: they radicalize because they believe the other side is already breaking the rules.

  Regarding source bias: your top pick, (7), is the most contaminated by hindsight. Sallust and Cicero needed the Republic to be morally dead to justify Caesar or Augustus. If you lean too hard on "virtue was lost," you risk sounding like a moralizing ancient source. Counterbalance (7) with (8). Money is impersonal; it avoids the trap of "people used to be better." Your characters should not feel they are living through a collapse; they should feel they are living through an intensification of competition where the old brakes no longer work.

  What would change my mind on (8) being number one is evidence of a solvent treasury during the crisis period; if your setting's state is rich but still collapsing, then (7) or (4) must take the lead. I am least sure about the ranking of (4) versus (7); institutions often decay because norms decay, but norms often decay because institutions fail to resolve conflict. My reasoning is most likely to break down by treating these as separable engines; in reality, they are a knot where pulling one tightens the others. For the novel, however, you must untangle them to assign POV focus, so prioritize the tangible (Money) over the cultural (Norms) over the structural (Institutions) to ensure the reader feels the pressure physically before understanding it politically.
