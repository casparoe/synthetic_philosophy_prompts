      *   *Philosophy:* Discuss the moral weight of "potential." NBS says "split the surplus based on bargaining power/curvature." KSBS says "split the *relative* satisfaction equally." It's a Rawlsian/Equalitarian vibe regarding *satisfaction levels* rather than *utility increments*.
