          *   Walkaway ($d$): Inflating $d$ shrinks the surplus, potentially hurting feasibility, but might shift the anchor. Usually, $d$ is verified (BATNA).
          *   Ideal ($u$): This is the big problem. In KSBS, inflating your ideal point ($u_i$) increases the slope of the line connecting $d$ to $u$. Since the solution is the intersection of this line with the Pareto frontier, inflating $u_i$ generally moves the solution in your favor (up to the limit of feasibility).
      *   *Incentive Compatibility:* KSBS is **not** strategy-proof regarding the ideal point. If I claim my ideal is higher, I get a larger share of the proportional gain.
      *   *Redesign:* If these aren't facts, you need a mechanism that penalizes exaggeration or verifies the ideal objectively (e.g., based on total resource availability rather than "what I want"). Or switch to a mechanism that doesn't rely on self-reported ideals (like NBS, though NBS has its own strategic issues regarding utility functions).

