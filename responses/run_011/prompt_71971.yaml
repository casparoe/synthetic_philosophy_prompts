answer: |-
  You are running the **Kalai-Smorodinsky Bargaining Solution (KSBS)**.

  It was proposed by Ehud Kalai and Meir Smorodinsky in 1975 specifically as an alternative to the Nash Bargaining Solution (the "product-maximizing rule" you mentioned). While the Nash solution had been the dominant model since 1950, Kalai and Smorodinsky argued that it violated a basic intuition about fairness that your panel has codified in your second side condition.

  Here is the breakdown of the theory, the trade-offs, the philosophy, and the practical vulnerabilities in your current design.

  ### 1. The Theory and the Axiomatic Trade
  Your panel is prioritizing **Individual Monotonicity** over **Independence of Irrelevant Alternatives (IIA)**.

  *   **What you kept:** Like the Nash solution, you maintain **Pareto Efficiency** (you don't leave value on the table), **Symmetry** (in mirror-image cases, you split evenly), and **Scale Invariance** (your first side condition: the answer doesn't change if we measure water in gallons or liters, or money in dollars or yen).
  *   **What you traded away:** You have rejected **Independence of Irrelevant Alternatives (IIA)**.
      *   *The Nash View (IIA):* If you remove options from the table that nobody was going to choose anyway, the solution shouldn't change. Nash argues that only the local shape of the feasible set near the agreement point matters.
      *   *Your View (Monotonicity):* Your second side condition states that if the feasible set expands in a way that raises one party's maximum possible gain (their "ideal") without lowering the other's, the first party should not end up with less.
      *   *The Conflict:* You cannot have both IIA and Individual Monotonicity. By insisting that a higher "dream" (ideal point) entitles a party to a better outcome (or at least not a worse one), you necessarily make the solution dependent on options that are *not* feasible (the ideal point itself is usually unreachable). That violates IIA.

  ### 2. Philosophical Load: Do Aspirations Carry Moral Weight?
  This is the core philosophical divergence between your panel and the mainstream Nash approach.

  *   **The Nash Presupposition:** The Nash solution treats utility as cardinal but assumes fairness is derived from **marginal trade-offs** and risk dispositions. It implicitly asks: "How much utility would each side sacrifice to force the other to concede?" It does not care about the "Ideal." If your dream is to own the moon, but the feasible set is splitting a sandwich, Nash says your moon-dream is irrelevant.
  *   **Your Presupposition (KSBS):** Your rule presupposes that **relative satisfaction** is the metric of justice. You are effectively saying: "Fairness means both parties should be equally satisfied relative to their maximum possible satisfaction."
      *   This gives moral weight to the **Utopia Point**. It assumes that having a higher potential ceiling is a legitimate claim on the resources.
      *   *Philosophical Load:* This aligns more closely with egalitarian theories of welfare. It treats the "walkaway" as a baseline right and the "ideal" as the horizon of possibility, arguing that justice lies in traveling the same percentage of that distance. It assumes that "hope" or "potential" is a resource that should be distributed equally, even if that potential cannot be fully realized.

  ### 3. Consistency of Side Conditions
  You asked if your two side conditions are consistent with each other and the main rule. **Yes, they are.**

  In fact, Kalai and Smorodinsky proved that your main rule is the *unique* solution that satisfies Pareto Efficiency, Symmetry, Scale Invariance, and Individual Monotonicity. Your side conditions are not ad-hoc constraints; they are the axiomatic definition of the solution you are using. Nothing is "giving" mathematically. The tension exists only between your system and the Nash system (specifically over IIA), not within your own rules.

  ### 4. The "Real Facts" Assumption and Strategic Vulnerability
  This is where your administrative practice is most vulnerable. You wrote: *"in practice we just ask each side to state them privately."*

  **The Walkaway ($d$):**
  This is usually verifiable. It is the BATNA (Best Alternative to a Negotiated Agreement). If a partnership dissolves, the walkaway is the liquidation value. If towns share water, it's the minimum needed for survival or the cost of drilling a new well. These can often be audited.

  **The Ideal ($u$):**
  This is the weak link. In the Kalai-Smorodinsky framework, the Ideal point is defined as the maximum utility a player can get *given that the other player gets at least their walkaway*.
  *   **The Incentive Problem:** Your mechanism is **not strategy-proof** regarding the ideal point. If Party A inflates their stated ideal (claims they *could* use more water than they physically can, or that their *dream* is 100% of the assets rather than 80%), the line connecting the walkaway to the ideal becomes steeper. Since your rule finds the intersection of that line with the feasible frontier, **inflating the ideal point shifts the settlement in that party's favor.**
  *   **The Consequence:** By treating the ideal as a "discoverable fact" when it is actually a subjective statement, you are incentivizing parties to exaggerate their aspirations. If both sides exaggerate, the "proportional" split becomes distorted, and you may end up with a solution that doesn't actually reflect equal relative satisfaction.

  ### 5. What Needs Redesign
  If you accept that "ideals" are not objective facts but strategic claims, you need to redesign how $u$ is determined. You have three options:

  1.  **Objective Capping:** Define the Ideal objectively, not subjectively. For example, the Ideal is always defined as "100% of the available surplus" for that party, regardless of what they claim they want. This removes the incentive to dream bigger.
  2.  **Verification Burden:** Treat the Ideal like the Walkaway. Require evidence. "You claim your ideal share is $1M? Show us the project budget that requires exactly that." If they can't verify the upper bound, default to a standard cap (e.g., total resource availability).
  3.  **Switch Mechanisms:** If you cannot verify the ideals, the Kalai-Smorodinsky solution becomes unstable. You might have to revert to the Nash Bargaining Solution (which relies on the shape of the frontier, not the utopia point) or use a **Thomson Solution** (which focuses on equalizing absolute gains rather than proportional gains), though these come with their own philosophical trade-offs.

  ### Summary
  Your panel is running the **Kalai-Smorodinsky Bargaining Solution**.
  *   **You keep:** Scale Invariance, Symmetry, Pareto Efficiency, and Individual Monotonicity.
  *   **You drop:** Independence of Irrelevant Alternatives (IIA).
  *   **Philosophy:** You believe fairness is about equalizing *relative satisfaction* (percentage of the dream achieved), which grants moral weight to aspiration levels.
  *   **Risk:** Your rule is mathematically consistent, but practically vulnerable. Because inflating one's "Ideal" improves one's outcome under your rule, asking parties to state ideals privately invites strategic exaggeration. To fix this, you must objectively define the "Ideal" (e.g., as the total resource available) rather than accepting subjective statements of desire.
