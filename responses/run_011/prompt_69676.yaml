      7. **Causal Exclusion (Added):** The account must explain the causal relevance of macro-subjects without rendering micro-subjects epiphenomenal. *Motivating Case:* If micro-experiences suffice for physical causation, macro-experiences are excluded. If macro-experiences do the work, micro-experiences risk being idle posits. This ensures the ontology pays its causal keep and avoids overdetermination.

