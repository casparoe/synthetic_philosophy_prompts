  Purpose restated
  This specification enables competent non-specialist editors to adjudicate whether submissions solve the combination problem or merely relocate it. The goal is not to select the best panpsychism, but to filter out accounts that fail to bridge the gap between micro-experience and macro-unity without reintroducing the very mysteries panpsychism sought to avoid. Requirements distinguish between clearing the bar for a solution versus preferences for specific metaphysical camps.

  Requirements
  (Note: Requirement 7 is added to address causal relevance; Point 1 is corrected to emphasize contingency.)

  1. **Phenomenal Unity:** The account must explain why experience presents as a single bounded field rather than a disjointed aggregate. *Motivating Case:* The contrast between hearing a chord simultaneously versus hearing notes sequentially. Commissurotomy literature shows unity is contingent (split brains exhibit dual consciousness), so the account must explain the *presence* of unity in standard cases without claiming it is metaphysically necessary, acknowledging that boundedness can fracture under specific physical conditions without denying the default unity.
  2. **Subject/Quality Distinction:** The account must address combining subjects and combining qualities separately. *Motivating Case:* Combining redness and roundness differs from combining *my* seeing red and *your* seeing round. An account solving quality combination owes an explanation of subject combination, or must explicitly justify taking subjects as primitive while solving quality combination, ensuring the "who" of experience is not ignored in favor of the "what" within the phenomenological field.
  3. **Relocation Test:** The account may not explain binding by positing a further relation whose operation is a brute fact. *Motivating Case:* Positing a "phenomenal bonding relation" risks being as mysterious as emergent consciousness. If micro-experience was introduced to avoid brute emergence, the bonding mechanism cannot itself be a brute fact of exactly the kind avoided, lest the explanation become circular and fail to reduce the mystery of consciousness.
  4. **Selection Constraint:** If binding tracks physical or dynamical unity, the account must specify what makes that unity binding-relevant. *Motivating Case:* If binding tracks integrated information (Phi), why does *this* level of Phi constitute a subject? Without a principle, boundaries are arbitrary, recreating the vagueness problem regarding where subjects begin and end, leaving the account vulnerable to charges of arbitrariness regarding subject individuation.
  5. **Explanatory Advantage:** The account must retain the advantage over emergentist dualism that motivated the panpsychist turn. *Motivating Case:* Panpsychism avoids brute emergence of experience from non-experience. If the solution relies on macro-experience emerging from micro-experience via an opaque mechanism, the advantage is lost, collapsing back into the original problem of how experience arises from non-experience rather than solving it.
  6. **Confirmation Condition:** Since micro-experience is not directly observable, the account must specify what could confirm or disconfirm it. *Motivating Case:* Without observable data, panpsychism risks unfalsifiability. The solution must offer structural predictions or coherence conditions that distinguish it from skepticism or standard emergentism, ensuring it remains a scientific hypothesis rather than a metaphysical assertion immune to evidence.
  7. **Causal Exclusion (Added):** The account must explain the causal relevance of macro-subjects without rendering micro-subjects epiphenomenal. *Motivating Case:* If micro-experiences suffice for physical causation, macro-experiences are excluded. If macro-experiences do the work, micro-experiences risk being idle posits. This ensures the ontology pays its causal keep and avoids overdetermination within the physical causal chain.

  Non-negotiable versus camp preference
  Requirements 1, 3, 5, and 6 are non-negotiable barriers for any account claiming to solve the problem. 1 captures the phenomenological datum; 3 and 5 ensure the solution isn't circular or regressive; 6 ensures scientific legitimacy. Requirement 7 is non-negotiable for physicalists but might be relaxed for dualists. Requirements 2 and 4 are camp preferences. 2 allows for subject-primitive views (like cosmopsychism) if justified. 4 is crucial for physicalist-leaning panpsychists but less so for idealists who deny physical boundaries are fundamental. Distinguishing these prevents editors from rejecting viable metaphysical alternatives on narrow grounds, ensuring the special issue remains inclusive of diverse ontological commitments while maintaining rigorous standards for explanatory coherence.

  Joint unsatisfiability
  Requirements 3 (Relocation) and 5 (Explanatory Advantage) jointly threaten constitutive panpsychism. If micro-experiences are distinct entities (required by 5 to avoid emergence), combining them requires a relation. If that relation is non-brute (required by 3), it requires further explanation, leading to regress. If it is brute, it violates 3. If you deny distinctness to avoid bonding, you violate 5 (becoming emergentist or monist). This suggests the list entails a negative result: constitutive panpsychism cannot satisfy the specification without collapsing into cosmopsychism or emergentism. The specification itself may demonstrate that the combination problem is insoluble for constitutive views, implying editors should expect few successful submissions. This tension reveals that the very motivation for panpsychism (avoiding brute emergence) undermines its ability to solve combination without brute bonding.

  The requirement with the most leverage
  Requirement 3 (Relocation Test) has the most leverage. It excludes most "phenomenal bonding" laws because they posit a primitive connection between distinct subjects that mirrors the brute emergence panpsychism rejects. It forces accounts to either deny distinctness (cosmopsychism) or deny combination (flat views), narrowing the field drastically. Most submissions will fail here because they rely on unexplained bonding relations to bridge the gap between micro and macro subjects.

  Scorecard
  | Position | Status | Failure Mode |
  | :--- | :--- | :--- |
  | **Constitutive (Bonding)** | Fail | Violates Relocation Test (posits brute bonding law). |
  | **Cosmopsychism** | Fail | Violates Phenomenal Unity (cannot explain boundedness). |
  | **Flat View** | Fail | Violates Phenomenal Unity (denies the datum of binding). |

  Constitutive panpsychism posits a fundamental bonding law but fails the Relocation Test by treating bonding as brute. Cosmopsychism makes one macro-subject fundamental but fails Phenomenal Unity by struggling to derive bounded subjects without arbitrariness. The Flat View denies binding facts entirely but fails Phenomenal Unity by contradicting the introspective datum that experience is unified. All three face significant hurdles under this specification, suggesting the combination problem remains a critical barrier for all major panpsychist variants currently on offer. Editors should anticipate that most submissions will require significant revision to address these structural failures.
