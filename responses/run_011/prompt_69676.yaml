      3. **Relocation Test:** The account may not explain binding by positing a further relation whose operation is a brute fact. *Motivating Case:* Positing a "phenomenal bonding relation" risks being as mysterious as emergent consciousness. If micro-experience was introduced to avoid brute emergence, the bonding mechanism cannot itself be a brute fact of exactly the kind avoided, lest the explanation become circular.
      4. **Selection Constraint:** If binding tracks physical or dynamical unity, the account must specify what makes that unity binding-relevant. *Motivating Case:* If binding tracks integrated information (Phi), why does *this* level of Phi constitute a subject? Without a principle, boundaries are arbitrary, recreating the vagueness problem regarding where subjects begin and end, leaving the account vulnerable to charges of arbitrariness.
      5. **Explanatory Advantage:** The account must retain the advantage over emergentist dualism that motivated the panpsychist turn. *Motivating Case:* Panpsychism avoids brute emergence of experience from non-experience. If the solution relies on macro-experience emerging from micro-experience via an opaque mechanism, the advantage is lost, collapsing back into the original problem of how experience arises from non-experience.
