      7. **Causal Exclusion (Added):** The account must explain the causal relevance of macro-subjects without rendering micro-subjects epiphenomenal. *Motivating Case:* If micro-experiences suffice for physical causation, macro-experiences are excluded. If macro-experiences do the work, micro-experiences risk being idle posits. This ensures the ontology pays its causal keep and avoids overdetermination within the physical causal chain.

      *Revised Non-negotiable:*
      Requirements 1, 3, 5, and 6 are non-negotiable barriers for any account claiming to solve the problem. 1 captures the phenomenological datum; 3 and 5 ensure the solution isn't circular or regressive; 6 ensures scientific legitimacy. Requirement 7 is non-negotiable for physicalists but might be relaxed for dualists. Requirements 2 and 4 are camp preferences. 2 allows for subject-primitive views (like cosmopsychism) if justified. 4 is crucial for physicalist-leaning panpsychists but less so for idealists who deny physical boundaries are fundamental. Distinguishing these prevents editors from rejecting viable metaphysical alternatives on narrow grounds, ensuring the special issue remains inclusive of diverse ontological commitments while maintaining rigorous standards.

      *Revised Unsatisfiability:*
      Requirements 3 (Relocation) and 5 (Explanatory Advantage) jointly threaten constitutive panpsychism. If micro-experiences are distinct entities (required by 5 to avoid emergence), combining them requires a relation. If that relation is non-brute (required by 3), it requires further explanation, leading to regress. If it is brute, it violates 3. If you deny distinctness to avoid bonding, you violate 5 (becoming emergentist or monist). This suggests the list entails a negative result: constitutive panpsychism cannot satisfy the specification without collapsing into cosmopsychism or emergentism. The specification itself may demonstrate that the combination problem is insoluble for constitutive views, implying editors should expect few successful submissions.

      *Revised Leverage:*
      Requirement 3 (Relocation Test) has the most leverage. It excludes most "phenomenal bonding" laws because they posit a primitive connection between distinct subjects that mirrors the brute emergence panpsychism rejects. It forces accounts to either deny distinctness (cosmopsychism) or deny combination (flat views), narrowing the field drastically. Most submissions will fail here because they rely on unexplained bonding relations to bridge the gap between micro and macro subjects.

