answer: |-
  ### The Causal Topology of the Terror: A Decision Tree

  This instrument treats the historiography of the Terror as a parameter space. It does not ask which school you inhabit, but rather which variables you assign causal weight. Proceed through the seven nodes sequentially. Your path determines the explanatory leaf.

  #### The Nodes (Logical Interventions)

  **Node 1: Exogenous Shock (The War Variable)**
  *Intervention:* Hold all internal French social and political variables constant at their 1791 values. Remove the declaration of war on Austria in 1792 and the subsequent invasion threat.
  *Question:* Does the scale and timing of the Terror collapse significantly in this counterfactual?
  *   **Yes:** Proceed to **Leaf A (Emergency Response)**.
  *   **No:** The Terror is endogenous. Proceed to Node 2.

  **Node 2: Sensitivity to Initial Conditions (The Boundary Variables)**
  *Intervention:* Normalize the harvest of 1788–89 to a five-year average and prevent the King's flight to Varennes (maintaining constitutional monarchy viability).
  *Question:* Does the radicalization toward mass violence still occur?
  *   **No:** The system was highly sensitive to initial perturbations. Proceed to **Leaf B (Irreducible Contingency)**.
  *   **Yes:** The system is robust to initial conditions; the drive to violence is internal. Proceed to Node 3.

  **Node 3: Institutional Architecture (The Design Variable)**
  *Claim:* The concentration of unchecked power in a unicameral assembly and the Committee of Public Safety.
  *Question:* Was this concentration a *design fault* with predictable dynamics (sovereignty without friction), or an *adaptive response* to crisis that would not have occurred in peacetime?
  *   **Design Fault:** The structure itself generates tyranny regardless of intent. Proceed to **Leaf C (Institutional Design Failure)**.
  *   **Adaptive Response:** The structure was situational. Proceed to Node 4.

  **Node 4: Ideological Independence (The Mechanism Variable)**
  *Claim:* The rhetoric of Virtue, Public Safety, and Republicanism.
  *Question:* Did these concepts operate as an independent causal force driving decisions, or as a dependent variable (rationalization) securing compliance for decisions made on other grounds?
  *   **Rationalization:** Ideology is the mask. Proceed to Node 5.
  *   **Independent Cause:** Ideology is the engine. Proceed to Node 6.

  **Node 5: Material Correlate (The Class Variable)**
  *Claim:* The distribution of violence and property transfer.
  *Question:* Does the violence correlate strongly with class boundaries (bourgeoisie vs. aristocracy/peasantry), or does it cut across them indiscriminately?
  *   **Correlates with Class:** Proceed to **Leaf D (Class Interest)**.
  *   **Indiscriminate:** Proceed to **Leaf E (Elite Factional Struggle)**. *(Note: This is the added leaf; it captures power struggles not reducible to class).*

  **Node 6: Teleological Deduction (The Principle Variable)**
  *Claim:* The relationship between 1789 (Rights of Man) and 1793 (Terror).
  *Question:* Is the Terror a valid logical deduction from the principles of 1789, or a violation of them?
  *   **Valid Deduction:** Proceed to **Leaf F (Ideological Causation)**.
  *   **Violation:** Proceed to Node 7.

  **Node 7: System Generality (The Universal Variable)**
  *Claim:* The dynamics of revolutionary systems.
  *Question:* Is this dynamic (violence devouring founders) observable in revolutions generally, regardless of specific ideology or national context?
  *   **Yes:** Proceed to **Leaf G (Structural Necessity)**.
  *   **No:** (This path leads to a logical null; if not war, not contingency, not institutions, not class, not ideology, and not general law, there is no cause left. Return to Node 2 and check data).

  ***

  #### The Leaves (Explanatory Models)

  1.  **Leaf A: Emergency Response**
      *   *Definition:* The Terror was a rational, albeit extreme, survival mechanism triggered by foreign invasion and civil war.
      *   *Awkward Commitment:* You must accept that the Republic could have survived without the Terror, implying the executions were a choice of efficacy over morality, not necessity.

  2.  **Leaf B: Irreducible Contingency**
      *   *Definition:* The Terror resulted from a specific, non-repeatable confluence of bad harvests, the King's psychology, and timing.
      *   *Awkward Commitment:* You must accept that macro-historical outcomes hinge on micro-variations (weather, individual health), rendering historical prediction impossible.

  3.  **Leaf C: Institutional Design Failure**
      *   *Definition:* The unicameral legislature and lack of judicial review created a feedback loop where dissent became treason by definition.
      *   *Awkward Commitment:* You must accept that procedural tweaks (bicameralism, veto) could have withstood the social energy sufficient to overthrow a millennium-old monarchy.

  4.  **Leaf D: Class Interest (Ideology as Mask)**
      *   *Definition:* The Terror was a tool for the bourgeoisie to consolidate property and power, using universalist language to disguise particularist gain.
      *   *Awkward Commitment:* You must accept that actors knowingly deployed universalist language as a particularist weapon, implying a level of cynical coordination difficult to evidence.

  5.  **Leaf E: Elite Factional Struggle** *(Added Leaf)*
      *   *Definition:* The Terror was the equilibrium outcome of competing elite groups (Girondins, Montagnards, Hébertists) using violence to eliminate rivals for office.
      *   *Awkward Commitment:* You must accept that the guillotine was primarily a tool for office-seeking rather than social engineering or national survival.

  6.  **Leaf F: Ideological Causation**
      *   *Definition:* The Terror was the sincere implementation of Rousseauian general will and republican virtue, where coercion equals freedom.
      *   *Awkward Commitment:* You must accept that metaphysical commitments can override biological self-preservation and material interest as primary human motivators.

  7.  **Leaf G: Structural Necessity**
      *   *Definition:* Revolutions inherently create a "sovereign exception" that inevitably consumes their founders; the French case is merely an instance of a universal law.
      *   *Awkward Commitment:* You must accept that violence is the *telos* of revolutionary systems, making non-violent transition to democracy theoretically impossible.

  ***

  #### Analysis of the Logical Space

  **Unoccupied Answer-Combinations**
  Your tree permits a path that no serious historiographical position occupies: **Node 4 (Ideology = Independent Cause)** combined with **Node 5 (Class = Primary Driver)**.
  *   *Status:* **Incoherent.** If ideology is an independent causal force sufficient to drive the Terror, class interest cannot be the *primary* driver without reducing ideology to a mask (Node 4). To hold both is to argue for systematic overdetermination where two sufficient causes operate simultaneously without interaction, which violates parsimony.

  **Tense Combinations**
  The tree permits **Node 3 (Institution = Design Fault)** combined with **Leaf A (Emergency Response)**.
  *   *Status:* **Merely Unattractive.** This suggests the institutions were flawed *and* the war was necessary for the Terror. While logically possible (interaction effect), most positions prioritize one: either the institutions would have produced tyranny anyway (Leaf C), or they were benign until the war (Leaf A). Holding both dilutes the explanatory power of each.

  **Indistinguishable Leaves**
  The tree cannot in principle separate **Leaf F (Ideological Causation)** and **Leaf G (Structural Necessity)** if the "Structure" is defined by the "Logic of Ideas."
  *   *Flag:* If the "Structural Necessity" of revolutions is driven by the inherent logic of revolutionary ideology (as Furet argues), Leaf F and Leaf G collapse into a single state. To separate them, one must define "Structure" as sociological (mobilization dynamics) rather than ideational. If you view the "devouring of children" as a sociological constant independent of specific ideas, they separate; if you view it as a consequence of the ideas themselves, they are identical.
