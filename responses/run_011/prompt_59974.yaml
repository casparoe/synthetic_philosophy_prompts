answer: |-
  ### Instructor's Note on the Problem Design

  The real difficulty in this scenario lies in the breakdown of **scale invariance**. Standard Kelly derivations assume that the utility of wealth is logarithmic, implying Constant Relative Risk Aversion (CRRA), where the optimal stake fraction depends only on the odds, not the absolute wealth level. The fixed cash withdrawal introduces a "subsistence level" or absorbing barrier, making the agent's effective risk aversion increase as wealth approaches the withdrawal requirement. Consequently, the process is no longer a pure multiplicative random walk; it becomes an affine process with a non-zero probability of ruin even for $f < 1$. Standard arguments for Kelly based on ergodicity (time-average growth) survive only conditionally: they remain valid for maximizing growth *conditional on survival*, but they fail to account for the fact that the withdrawal obligation makes survival endogenous to the betting strategy. The "time average" defence collapses because the time average does not converge to a positive constant when the probability of hitting the absorbing barrier is unity.

  ***

  ### Final Examination Question: Rational Choice Under Risk
  **Time Allowed:** 45 Minutes
  **Marks:** 25

  **Question 1**

  An agent manages a fund of $W_0 = £1,000,000$. Annually, she is offered a binary bet: stake a fraction $f$ of current wealth. With probability $p=0.6$, the stake is doubled (net return +100% on stake); with probability $q=0.4$, the stake is lost (net return -100% on stake). Independently of the bet outcome, she is obliged to withdraw $C = £20,000$ annually for living costs.

  The classic Kelly criterion suggests $f^* = p - q = 0.2$. At this fraction, the expected logarithmic growth rate of the fund is approximately 2% per annum, which exactly matches the withdrawal rate $C/W_0$.

  (a) Identify the specific mathematical assumption underlying the standard Kelly derivation that the fixed cash withdrawal $C$ violates. Explain why this violation renders the standard long-run geometric growth rate ill-defined as a sole objective for this agent. (10 marks)

  (b) Given this violation, the optimal stake can no longer be a constant fraction $f$. Define the agent's appropriate objective function in this context and describe the qualitative properties of the new optimal stake function $f(W_t)$. Specifically, how must $f(W_t)$ behave as $W_t$ approaches the solvency limit required to cover $C$? (15 marks)

  ***

  ### Model Answer

  **(a) The Violated Assumption and Ill-Defined Growth Rate**

  The standard Kelly criterion is derived by maximizing the expected logarithm of wealth, $E[\ln(W_{t+1})]$. This relies fundamentally on the assumption of **scale invariance** (or homogeneity of degree zero in wealth). In the standard model, wealth evolves multiplicatively: $W_{t+1} = W_t(1 + f X_t)$, where $X_t$ is the random return. Because the logarithm converts this to $\ln(W_{t+1}) = \ln(W_t) + \ln(1 + f X_t)$, the change in log-wealth is independent of the current level $W_t$. Consequently, the optimal fraction $f^*$ is constant regardless of whether the agent holds £1,000 or £1,000,000.

  The fixed cash withdrawal $C$ violates this scale invariance. The wealth dynamic becomes affine rather than purely multiplicative: $W_{t+1} = W_t(1 + f X_t) - C$. The term $C$ does not scale with $W_t$. As wealth decreases, the relative burden of the withdrawal $C/W_t$ increases. This introduces a hard **absorbing barrier** (ruin) at $W_t \le C$ (or strictly, when the fund cannot cover the withdrawal).

  This violation renders the standard long-run geometric growth rate ill-defined as a sole objective because the process is no longer ergodic in the positive domain. In the standard Kelly case with $f=0.2$, the drift of the log-wealth is positive ($\approx 2\%$). However, here the net drift is zero ($2\% \text{ growth} - 2\% \text{ withdrawal}$). A random walk with zero drift on the log-scale will hit any lower barrier with probability 1 over an infinite horizon. Therefore, the "long-run growth rate" is not a stable attractor; the asymptotic growth rate is effectively $-\infty$ because ruin is certain if $f$ remains constant at 0.2. Maximizing a growth rate that leads to certain ruin is irrational. The objective cannot simply be "maximize asymptotic growth" because the domain of the function is not guaranteed to persist.

  **(b) New Objective and Optimal Stake Function**

  Given the certainty of ruin under constant fractional betting with zero net drift, the agent's objective must shift from unconstrained growth maximization to **maximizing expected utility of consumption over time subject to a survival constraint**, or equivalently, maximizing the growth rate of *surplus* wealth above the capitalized value of the liability.

  The agent should treat the present value of the perpetual withdrawal obligation as a liability $L = C/r_{safe}$ (or simply recognize $C$ as a fixed cost). The objective becomes maximizing the growth of the discretionary fund $S_t = W_t - W_{\text{subsistence}}$, where $W_{\text{subsistence}}$ is the minimum capital required to generate $C$ risk-free. If no risk-free asset exists, $W_{\text{subsistence}}$ is the level below which ruin is imminent.

  Consequently, the optimal stake must be a function of current wealth, $f(W_t)$, exhibiting **decreasing relative risk exposure** as wealth declines.
  1.  **As $W_t \to \infty$:** The relative impact of $C$ vanishes ($C/W_t \to 0$). The problem asymptotically approaches the standard Kelly scenario. Thus, $\lim_{W_t \to \infty} f(W_t) = 0.2$.
  2.  **As $W_t \to W_{\text{min}}$:** As wealth approaches the minimum level required to cover the withdrawal (the solvency limit), the marginal utility of avoiding ruin approaches infinity. To ensure survival, the agent must reduce volatility. Thus, $\lim_{W_t \to W_{\text{min}}} f(W_t) = 0$.

  The optimal strategy is a "feedback control" policy. Unlike the constant Kelly fraction, this policy dynamically de-leverages. If the fund suffers a string of losses and $W_t$ drops to £500,000, the withdrawal is now 4% of the fund. Betting 20% of the fund risks a 20% loss on a base that is already shrinking by 4% annually. The agent must reduce $f$ to ensure the expected growth of the fund exceeds the withdrawal rate at the new, lower wealth level. The specific functional form would likely resemble $f(W_t) = f_{Kelly} \times (1 - \frac{W_{\text{min}}}{W_t})$, ensuring that betting ceases entirely when the fund can only just cover the liability. This prioritizes the preservation of the income-generating capacity of the fund over the maximization of the geometric mean of the total fund value.

  ***

  ### Marking Scheme

  | Point | Requirement | A-Grade Treatment (5 marks) | B-Grade Treatment (3-4 marks) |
  | :--- | :--- | :--- | :--- |
  | **1** | **Violated Assumption** | Explicitly identifies **scale invariance** (or homogeneity/CRRA) as the broken assumption; notes wealth dynamics become affine, not multiplicative. | Identifies "fixed cost" or "withdrawal" generally but fails to name the mathematical property (scale invariance) or confuses it with risk aversion. |
  | **2** | **Growth Rate Status** | Explains that zero net drift implies **ruin with probability 1** (random walk property); therefore, asymptotic growth rate is undefined/negative infinity. | States growth rate is "risky" or "unstable" but fails to invoke the certainty of ruin or the absorbing barrier logic. |
  | **3** | **New Objective** | Defines objective as **survival-constrained growth** or growth of *surplus/discretionary* wealth rather than total wealth. | Suggests "maximizing utility" vaguely without specifying the constraint or the shift from total wealth to surplus. |
  | **4** | **Stake Function Dependency** | Clearly states $f$ must be a function of **current wealth $W_t$**, not a constant; explains that risk exposure must change with fund size. | Suggests $f$ should change but implies it depends on "market conditions" or past performance rather than current wealth level relative to $C$. |
  | **5** | **Boundary Conditions** | Correctly specifies limits: $f \to 0.2$ as $W \to \infty$ and **$f \to 0$ as $W \to \text{subsistence}$**. | Correctly identifies $f$ should drop but fails to specify that $f$ must approach zero at the solvency limit to prevent ruin. |

  **Total:** 25 Marks
