answer: |-
  # Exercise: The Evidential Threshold

  ## 1. The Arithmetic and Payoff Structure

  To make the tension between Causal Decision Theory (CDT) and Evidential Decision Theory (EDT) palpable, the stakes must be structured so that the causal impact of a single vote is negligible, but the evidential import is significant.

  **The Setup:**
  *   **Participants:** 28 In-Room ($N_{room}$) + 100 External Cohort ($N_{ext}$). Total $N = 128$.
  *   **Endowment:** Each participant receives **$5.00** cash in a sealed envelope.
  *   **Choice:**
      *   **Defect:** Keep the $5.00.
      *   **Cooperate:** Return the $5.00 to the pool.
  *   **Threshold Rule:** If the total number of Cooperators across *both* populations $\geq 65$ (approx 51%), the Instructor donates **$500** to the charity selected by the class. If $< 65$, the donation is **$0**.
  *   **Unclaimed Funds:** Any money kept by students is theirs. Any money returned by students is added to the instructor's budget (or burned, to avoid confounding incentives).

  **The Causal Calculation (CDT):**
  *   **Cost of Cooperation:** $5.00.
  *   **Benefit of Threshold:** $500 donation to a charity the student values. Let us assume, conservatively, that the student values the charity donation at least at parity with cash ($500 value).
  *   **Causal Impact:** The probability that *your* specific $5.00 is the pivot (the 65th dollar) is effectively zero given the uncertainty about the external cohort. Let $P(\text{pivot}) \approx 0$.
  *   **Expected Utility (Defect):** $5.00 + (P(\text{Threshold}) \times 500)$.
  *   **Expected Utility (Coop):** $0.00 + (P(\text{Threshold}) \times 500)$.
  *   **CDT Verdict:** Defect. Gain = $5.00.

  **The Evidential Calculation (EDT):**
  *   **Correlation ($\rho$):** Your choice is evidence about the choices of the external cohort because you share the same information, reasoning capacity, and incentives.
  *   **Update:** If you Cooperate, you update your belief that the external cohort is also more likely to Cooperate.
  *   **The Flip:** EDT recommends Cooperation if:
      $$ \text{Cost} < \text{Benefit} \times [P(\text{Threshold} | \text{Coop}) - P(\text{Threshold} | \text{Defect})] $$
      $$ 5 < 500 \times \Delta P $$
      $$ \Delta P > 0.01 $$
  *   **Interpretation:** You only need to believe that your cooperation increases the probability of success by **1%**. In a population of 100 strangers where you estimate a 50% base rate with a standard deviation of ~5 people, shifting the expected number of cooperators by just **0.5 people** (via correlation) is sufficient to cross this threshold. This is rationally achievable if you believe you are "similar" to the cohort.

  ---

  ## 2. Materials List

  1.  **Cash:** $140 in small bills (28 x $5).
  2.  **Envelopes:** 30 plain white envelopes (28 for students, 2 spares).
  3.  **Ballots:** 30 small slips of paper, pre-printed with "KEEP" and "RETURN".
  4.  **Commitment Hash:** A printed sheet containing a SHA-256 hash string (generated beforehand from the external cohort's data).
  5.  **Charity List:** A projected list of 5 pre-vetted effective charities.
  6.  **Writing Pads:** For the affirmation step.
  7.  **Collection Box:** A clear, locked box for ballots.
  8.  **Timer:** Visible to the room.

  ---

  ## 3. Minute-by-Minute Timeline (75 Minutes)

  **00:00 – 00:10: Setup & Charity Selection**
  *   Distribute envelopes containing $5. Tell students: *"This is yours. No strings attached, unless you choose to attach them."*
  *   Project the list of 5 charities. Hold a quick show-of-hands vote to select the single beneficiary for the $500 threshold bonus.
  *   State the Threshold Rule clearly. Emphasize the External Cohort exists, is sealed, and is larger than the room.

  **00:10 – 00:20: The Affirmation (Written)**
  *   Hand out index cards. Require every student to write and sign the following two statements:
      1.  *"I acknowledge that my choice today cannot causally influence the choices of the External Cohort. Their decisions are already made and sealed."*
      2.  *"I acknowledge that my choice today is evidence about the choices of the External Cohort, because we are reasoning agents facing identical problems."*
  *   Collect these cards. Do not comment on them yet. This forces them to hold the contradiction in their own handwriting.

  **00:20 – 00:35: Round 1 (The High-Correlation Condition)**
  *   Instruct students: *"The External Cohort consists of peers from partner universities who received these exact instructions at the same time. You are epistemically identical."*
  *   Students mark their ballot (KEEP/RETURN), seal it in the envelope with any cash they are returning, and drop it in the Collection Box.
  *   **Do not open the box.**

  **00:35 – 00:50: The Shock (Erosion of Similarity)**
  *   Return the remaining cash to the students (or hand out new endowments for Round 2 to keep the stakes fresh).
  *   **The Intervention:** Announce: *"We have just received a metadata report on the External Cohort. While they faced the same rules, they were recruited from a pool of participants who previously failed a screening question on logical consistency in a separate task. They are not your epistemic peers. They are noisy decision-makers."*
  *   **Crucial Constraint:** Emphasize that the *causal* structure is unchanged. They are still sealed. Only the *similarity* (and thus the correlation $\rho$) has degraded.
  *   Ask students to silently update their $\Delta P$ estimate.

  **00:50 – 01:05: Round 2 (The Low-Correlation Condition)**
  *   Repeat the voting process exactly as in Round 1.
  *   Collect ballots and cash.

  **01:05 – 01:15: The Reveal & Debrief**
  *   Open the Collection Box. Count the Room's contributions.
  *   Reveal the External Cohort's data (using the pre-shared hash to prove it wasn't changed mid-class).
  *   Announce if the threshold was met (for the charity).
  *   **The Name:** Only now reveal the name of the case (see Section 7).
  *   Dismiss class.

  ---

  ## 4. Recruitment and Sealing the Cohort

  To make the "Large World" credible without blowing the budget, you cannot rely on trust alone. You need cryptographic commitment.

  **Primary Method: The Partner Lab Protocol (Cost: $0 of your $150)**
  1.  **Recruit:** Contact a colleague at another university teaching a similar course. Agree to run the exercise simultaneously.
  2.  **Scale:** If they have 28 students, you need ~3 more cohorts to reach "Large World" status (100+). Ask 3 other colleagues to run it asynchronously using your materials.
  3.  **Sealing:**
      *   Have the external instructors collect their data *before* your session.
      *   They compile the total number of cooperators (not individual data, to preserve anonymity).
      *   They generate a SHA-256 hash of the string: `"External_Cooperators: [NUMBER] : Salt: [RANDOM]"`.
      *   They email you the Hash and the Salt *before* your class.
      *   **In Class:** Show the Hash on the slide.
      *   **Post-Class:** Reveal the Salt and Number. Students can verify the hash matches. This proves the number was fixed before they voted.
  4.  **Budget:** Your $150 covers your 28 students ($140) + $10 buffer. The external partners fund their own students (or use the $0 version).

  **Fallback: The Prolific Pilot (Cost: ~$100)**
  1.  If no partners are available, run a study on Prolific 1 week prior.
  2.  Task: "Decision Making Study." Pay $1.00 + bonus chance. N=100.
  3.  Seal the data in a hash as above.
  4.  Use the remaining $50 for your in-room students ($1.75 each). *Note: This lowers stakes. Warn students the lower cash value is due to external funding constraints, but the logic remains identical.*

  **$0 Version (No Budget)**
  1.  **In-Room:** Replace cash with **Course Credit**. (e.g., 5 participation points). Defect = Keep points. Cooperate = Donate points to a "Class Bonus Pool."
  2.  **Threshold:** If met, everyone gets +5 extra credit points (or the Instructor donates to charity in the class's name).
  3.  **External Cohort:** Use **Historical Data** from previous iterations of this intensive.
  4.  **Sealing:** Show a screenshot of the previous year's spreadsheet with sensitive info redacted, plus a hash of the total count generated before the semester started.

  ---

  ## 5. The Debrief Script

  **Step 1: The Data (5 mins)**
  *   Display the counts: Room Round 1, Room Round 2, External Cohort.
  *   Ask: *"Did cooperation rates drop in Round 2?"* (They should have).
  *   Ask: *"Why? The causal structure didn't change. You still couldn't talk to them."*
  *   **Point:** The only variable that changed was $\rho$ (similarity). If you acted on causal logic alone, Round 1 and Round 2 should be identical (100% defection). The variance proves you were tracking evidential relevance.

  **Step 2: The Affirmation (5 mins)**
  *   Return the index cards they wrote at the start.
  *   Ask them to read their own handwriting: *"My choice cannot affect them... My choice is evidence about them."*
  *   **Point:** You felt the tension physically. CDT says ignore the second sentence. EDT says the second sentence dictates the action.

  **Step 3: Lewis's Charge (5 mins)**
  *   State: *"David Lewis accused EDT of 'buying good news.' He argued that EDT agents manipulate their beliefs to feel better about the world without actually making the world better."*
  *   Ask: *"In Round 1, did your cooperation 'make the world better' causally? No. The external choices were sealed. Did it 'buy good news'? Yes. It allowed you to believe the threshold was more likely met."*
  *   **The Hard Question:** *"If EDT is just buying good news, why did you stop buying it in Round 2 when the similarity dropped? You weren't trying to feel good; you were trying to be rational. This suggests the evidential link is a genuine decision-relevant factor, not just a comfort."*
  *   Leave this unresolved. Let them sit with the ambiguity.

  **Step 4: The Name (Final 5 mins)**
  *   Reveal: *"This exercise is a instantiation of **Evidential Cooperation in Large Worlds (ECL)**."*
  *   **Why this name?**
      *   **Evidential:** It relies on $\rho$, not causation.
      *   **Cooperation:** It prescribes contributing to a public good.
      *   **Large Worlds:** It specifically targets the intuition that "I am one in a billion." In a large enough world of similar agents, the evidential weight of your action aggregates to massive impact, even if causal impact is zero.
      *   It distinguishes this from standard Newcomb problems (which are usually 1-vs-1) and standard Public Goods games (which usually assume causal efficacy).

  ---

  ## 6. Predictable Failure Modes & Fixes

  **1. The "Fake Cohort" Cynicism**
  *   **Failure:** Students suspect the External Cohort is made up. If they think $N_{ext} = 0$, the threshold is impossible, and they defect.
  *   **In-the-Moment Fix:** Do not argue. Point to the Hash on the screen. Say: *"I cannot force you to trust me. But if you treat this as a simulation of the logic, the exercise still holds. If you believe the cohort is fake, then $\rho$ is irrelevant, and CDT wins by default. But then you aren't testing EDT, you're testing my honesty."*
  *   **Prevention:** The Partner Lab Protocol is superior to Prolific here. A colleague's reputation is harder to fake than a dataset.

  **2. The "Zero Cooperation" Embarrassment**
  *   **Failure:** In Round 1, almost everyone defects. The class feels cynical and the "lesson" fails.
  *   **In-the-Moment Fix:** Reframe immediately. *"This is actually a more interesting result. It shows that even among grad students, the causal intuition is overwhelmingly dominant. The 'tragedy' is real. The exercise isn't to prove EDT wins, but to see if anyone acts on it."*
  *   **Prevention:** Prime the room beforehand. In the intro, mention that "Previous cohorts have seen success rates up to 40%." (Social proof).

  **3. Confusion on "Evidence"**
  *   **Failure:** Students conflate "evidence" with "signaling." They think cooperating signals to the *instructor* that they are good people.
  *   **In-the-Moment Fix:** Interrupt and clarify: *"This is anonymous. I will not know who did what. The only thing your choice signals is to **yourself**, about the likely state of the External Cohort. You are updating your own probability distribution."*

  ---

  ## 7. Limitations: What This Exercise Cannot Reproduce

  Be frank with them in the final minutes. This exercise is a pedagogical tool, not a proof of metaphysics.

  1.  **Manufactured vs. Ontological Correlation:**
      *   In this room, the correlation exists because *I told you* you are similar (shared instructions, shared room).
      *   In the real "Large World" argument (e.g., acausal trade with aliens, or copies in a multiverse), the correlation must arise from **logical identity** alone, without a common cause (the instructor).
      *   *Loss:* You are teaching them to trust *authority-induced* similarity, not *logical* similarity. This smuggles in a causal common cause (the lesson plan), which CDT proponents will seize on to dissolve the paradox.

  2.  **The "One-Shot" Problem:**
      *   Real ECL arguments often rely on iterated interactions or timeless decision theory. This is a single-shot anonymous game.
      *   *Loss:* It doesn't capture the recursive reasoning of "I know that they know that I know..." which stabilizes cooperation in FDT (Functional Decision Theory).

  3.  **Stakes vs. Reality:**
      *   $5 is trivial. In true ECL scenarios (e.g., AI alignment, existential risk), the stakes are infinite or near-infinite.
      *   *Loss:* Risk aversion might drive defection more than decision theory. A student might defect not because they are CDTs, but because they need the $5 for lunch.

  **Closing Instruction to Instructor:**
  Run this not to convince them that EDT is *true*, but to make them feel the *cost* of rejecting it. The discomfort they feel writing the Affirmation Card is the learning objective. If they leave the room arguing about whether the correlation was "real" enough, you have succeeded.
