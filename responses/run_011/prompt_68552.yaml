  1. If I fail to get coffee because I thought beans were elsewhere, how does more data tell you if I didn't want coffee or just had wrong beliefs?
  Likely answer: We model belief formation separately from reward maximization.
  Follow-up: But if my beliefs are also shaped by what I want, doesn't that separation collapse?

  2. You have a knob for choice noise. Can't a sloppy pursuit of a big goal look exactly like a careful pursuit of a small one?
  Likely answer: We constrain the noise using prior assumptions about rationality.
  Follow-up: So you're trusting your math priors more than the ambiguous behavior itself?

  3. If someone stops trying because options vanished years ago, does your model read that resignation as contentment?
  Likely answer: Ideally we compare against similar agents with different options.
  Follow-up: But if you only have their history, aren't you coding oppression as preference?

  4. You can infer rewards for spite or addiction. Once you have them, where does the "is" become an "ought" for the system?
  Likely answer: The system optimizes; the human designer sets the ethical constraints.
  Follow-up: Then isn't the "inferred preference" just a tool, and the real morality is hidden in your design?

  5. What specific observation would force you to abandon this model of human preference entirely?
  Likely answer: Behavior that is completely random and uncorrelated with any history.
  Follow-up: But you model noise. At what point does "noise" just become "your model is wrong"?

  6. You treat spoken words as just more behavior. But isn't speech where we process regret, while action is often just habit?
  Likely answer: Speech is noisy data about underlying cognitive states.
  Follow-up: Why is habit a better signal of value than deliberation?

  7. Psychologists say humans use shortcuts, not maximization. Does forcing behavior into a reward shape distort what's actually happening?
  Likely answer: Reward functions can approximate heuristic behavior effectively.
  Follow-up: Effective for prediction, or effective for understanding what they actually care about?

  8. People act for audiences. If I behave to impress strangers, are you inferring my values or my performance?
  Likely answer: Social approval is a valid component of human reward.
  Follow-up: So if I hate the performance but do it anyway, the model says I want it?

  9. If I change my mind next year, does the model see me as evolving, or just inconsistent data?
  Likely answer: We use time-varying reward functions to capture change.
  Follow-up: Who decides when it's growth versus just another noise spike?

  10. If helping someone means changing what they want, not giving it to them, does your framework allow for that?
  Likely answer: That moves from assistance to paternalistic intervention.
  Follow-up: But if their wants are shaped by trauma, isn't all assistance either paternalism or neglect?

  Verdict: Q5 — Forces admission that the model cannot be proven wrong.
