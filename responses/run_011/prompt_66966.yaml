answer: |-
  This is a fascinating exercise in applied ethics. Your aunt isn't using the civics textbook definition ("misuse of public position for private benefit") because real-world integrity work is rarely that binary. She is operating under a **fiduciary and reputational risk framework** specific to humanitarian aid. She balances the NGO's mission, the safety of her staff, and the long-term viability of their operations against strict compliance rules.

  Here is the breakdown of her jurisprudence, the prediction for the retirement borehole, and the analysis of her cultural standard.

  ### Part 1: The Candidate Rules (Her "Case Law")

  To derive the rules, we have to find the principle that explains why she said "Yes" to some and "No" to others, specifically where the civics definition fails.

  **Rule A: The "Discretionary Linkage" Test**
  *   **Principle:** An interaction is corrupt if it links a resource transfer to an *official act involving discretion*.
  *   **Consistency:**
      *   *Explains Case 2 (Dinner):* Linked to tender panel (discretion). **Blocked.**
      *   *Explains Case 7 (Nephew):* Linked to building permits (discretion). **Blocked.**
      *   *Explains Case 5 (Honorarium):* Linked to grant allocation (discretion). **Blocked.**
      *   *Explains Case 4 (Customs):* Officer has *no* discretion; fee is regulated and systemic. **Allowed.**
      *   *Explains Case 1 & 3 (Gifts/Meals):* No specific official act requested or implied; general community relations. **Allowed.**
  *   **Weakness:** Doesn't fully explain why Case 7 was blocked even though the nephew was the *best candidate* (merit was established). It implies the *offer itself* corrupts the office, regardless of the outcome.

  **Rule B: The "Mission Fidelity" Test**
  *   **Principle:** Resources earmarked for beneficiaries cannot be diverted to honor officials or staff, regardless of local custom.
  *   **Consistency:**
      *   *Explains Case 1:* Tools for school = Mission aligned (community benefit). **Allowed.**
      *   *Explains Case 5:* $5k to staff = Diversion of funds to private pocket. **Blocked.**
      *   *Explains Case 6:* Brother's truck = Market rate, no extra cost to mission. **Allowed.**
      *   *Explains Case 4:* Fee = Cost of doing business to deliver mission. **Allowed.**
  *   **Weakness:** Doesn't fully capture the *corruption* risk in Case 7 (hiring the nephew didn't cost extra, but was still blocked).

  **Rule C: The "Precedent & Perception" Test**
  *   **Principle:** Even if an act is benign now, does it set a precedent that compromises future neutrality or creates an appearance of obligation?
  *   **Consistency:**
      *   *Explains Case 7:* Hiring the nephew sets a precedent that permits require hiring family. **Blocked.**
      *   *Explains Case 3:* Harvest lunch is annual/open; doesn't create specific obligation. **Allowed.**
      *   *Explains Case 5:* Undisclosed honorarium creates hidden debt to funder. **Blocked.**

  ### Part 2: The Verdict on the Retirement Borehole

  **The Facts:**
  *   **Recipient:** Retiring official (no future discretion), but plaque names him (personal prestige).
  *   **Funding:** Program budget (diverts resources from beneficiaries).
  *   **Impact:** One planned water point is cancelled (direct mission harm).
  *   **Context:** Public, customary, multi-donor.

  **Application of Rules:**
  1.  **Discretionary Linkage:** *Weak Match for Blocking.* He is retiring. He cannot grant future permits. However, it rewards *past* discretion (the 9 years of permits). This is a "Retroactive Quid Pro Quo."
  2.  **Mission Fidelity:** *Strong Match for Blocking.* This is the smoking gun. In Case 1, the NGO gave tools *in addition* to the project. Here, the borehole *replaces* a planned water point for beneficiaries. This violates the fiduciary duty to the donors and the intended recipients.
  3.  **Precedent:** *Strong Match for Blocking.* If they do this for a retiring official, the *successor* (the deputy) knows that a farewell gift is expected. It institutionalizes the "tax" on permits.

  **My Single Best Guess:**
  **She will rule NO.**

  **Why I'm betting on this rule:**
  I am betting on a hybrid of **Mission Fidelity** and **Precedent**.
  While the "Discretionary Linkage" is weaker because the official is leaving, the **Funding Source** is the dealbreaker. In Case 1 (Blanket), the NGO reciprocated with tools. In Case 3 (Lunch), the contractor paid. In this Current Case, the *beneficiaries* are paying (via one less water point).

  Your aunt allowed Case 4 (Customs Fee) because it was unavoidable to deliver the mission. Here, the borehole *prevents* the mission (one less water point). She prioritizes the NGO's output over local diplomatic niceties when they directly conflict (see Case 7: she delayed permits rather than hire the nephew).

  **The Nuance:** She might offer a **Conditional Approval**: "You can contribute to the farewell, but it must come from the *Country Office Overhead/Entertainment Budget*, not the Program Budget, and the plaque cannot name the official, only the contributing organizations."
  But if forced to rule on the proposal *as stated* (Program Budget + Named Plaque), she will kill it.

  **Principles at Stake:**
  *   **If she allows it:** She commits to the principle that **Local Stability > Strict Mission Adherence.** She acknowledges that keeping the Ministry happy ensures 9 more years of smooth permits, which saves more lives than one extra water point.
  *   **If she blocks it:** She commits to the principle that **Beneficiary Rights > Diplomatic Expediency.** The money belongs to the villagers, not the officials, even if the officials expect it.

  **The Tie-Breaker Case:**
  To separate "Mission Fidelity" from "Quid Pro Quo," propose this scenario:
  *   *Case:* A private donor (unrelated to the NGO) offers to fund the farewell borehole entirely. No program funds are used. The official is still named on the plaque.
  *   *If she says YES:* Her primary rule was **Mission Fidelity** (don't steal from beneficiaries).
  *   *If she says NO:* Her primary rule was **Precedent/Quid Pro Quo** (do not honor officials for past acts, regardless of who pays).
  *   *Prediction:* She will likely still say **NO** to the named plaque, citing Case 7 (Appearance of Obligation).

  ### Part 3: Case 4 vs. Case 7 (One Standard or Two?)

  You asked if she runs one universal standard with a "cultural sensitivity dial" or two different standards (Field vs. Home).

  **It is One Universal Standard: "Discretionary Vulnerability."**

  Here is how you tell from the outside:

  *   **Case 4 (Customs Fee):** The customs officer has **zero discretion**. The regulation says "Pay $X, get Stamp." He cannot legally waive the fee, and he cannot legally demand more. He is a gatekeeper, not a decision-maker. Paying him is not buying influence; it is paying a (corrupt) tax. Your aunt classifies this as a "Facilitation Payment" (harm reduction). She logs it not as a bribe because legally, in that jurisdiction, it functions as a tax.
  *   **Case 7 (Nephew/Permits):** The District Administrator has **high discretion**. He *could* fast-track the permits without the nephew. He *could* hire the nephew without the permits. By linking them, he is monetizing his discretion.

  **The Test:**
  Look at whether the official *could have done the act without the benefit.*
  *   In Case 4, without the fee, no stamp. (Systemic coercion).
  *   In Case 7, without the nephew, permits could still be issued. (Individual corruption).

  **Cultural Sensitivity Dial?**
  She does have a dial, but it's set to **"Coercion vs. Custom."**
  *   In Case 3 (Harvest Lunch), she allows it because it is *community* custom, not *official* custom.
  *   In Case 7 (Nephew), she blocks it even though it is "unremarkable there." Why? Because "unremarkable" means "systemically corrupt." She is willing to violate local norms to protect the NGO's integrity (Case 7), but she is willing to adhere to local norms when they don't compromise discretion (Case 3).

  **Conclusion:**
  She is not applying a "Home Standard" to Case 7 and a "Field Standard" to Case 4. She is applying a **Process Integrity Standard** to both.
  *   Case 4: Process is rigid (Fee = Stamp). Integrity is maintained by logging it transparently.
  *   Case 7: Process is flexible (Permits linked to Hiring). Integrity is maintained by severing the link.

  **Final Prediction for the Borehole:**
  She will block the use of program funds. She will argue that **beneficiaries cannot be taxed to honor officials.** She will likely suggest the staff contribute personally if they wish, but the NGO's program money is sacrosanct. This aligns with her blocking the Honorarium (Case 5) and the Nephew (Case 7) — she protects the *process* and the *mission* above relationships.
