prompt: |-
  I'm TA-ing for an intro philosophy of mind seminar this term and last week the same sentence got used by two different people to argue for basically opposite things, and I couldnt say on the spot what was going on. The sentence is something like 'anything you can compute, a Turing machine can compute.' One of the grad students used it to shut down an undergrad who'd proposed a machine — the undergrad's version involved dropping a computer toward a black hole so that it ticks off more and more steps while a finite observer outside watches, finishes infinitely many of them, and then signals back whether some mathematical statement is provable or not. The grad student's response was that the Church–Turing thesis is a definition rather than a claim about the world, so what the undergrad was describing simply wasn't computation at all, it was just a misuse of the word, and the argument was over before it started. Then my friend who does complexity theory used the exact same sentence a day later to argue the reverse: that its an empirical hypothesis about physics which nobody has managed to falsify, that the absence of a falsification is the only reason we believe it, and that if somebody actually built a working hypercomputer we'd have to revise the thesis rather than say they'd changed the subject.

  Can you lay out the different precise theses that one sentence could be standing in for? I want the whole menu rather than a summary — including readings where 'compute' means something a person can carry out with pencil and paper following a fixed rule, where it means something a physically buildable device can do, where it means whatever the laws of physics in our universe happen to permit, plus any readings I haven't thought of, and I think there are some turns on what 'simulate' is supposed to mean (same answers eventually, versus same answers with only a reasonable slowdown, versus step-for-step). For each reading say whether it's trivially true by stipulation, substantive but defensible, genuinely contentious, or flatly false, and say what would even count as evidence for or against it, if anything. And I especially want the part I couldn't do live: which readings actually license the grad student's move, where a concrete proposal gets dissolved into a verbal mistake; which ones license my friend's move, where it's a falsifiable claim about nature; and whether there is any single reading on which both of them are right. If there isn't, tell me which one is usually doing the work when people repeat the slogan casually, because that seems to be what lets it get used both ways.

  Bonus points if you can also tell me how the black hole contraption is supposed to be handled — does a device that needs infinitely many steps to produce one yes-or-no answer count as computing that answer at all, and does it matter that the person waiting for the signal gets it in finite time? I have office hours Thursday and I'd like to walk in with a list.
