  ### Retreat and Suspicion

  **What the PI Surrenders**
  *   **Retreating on Use 1 (R6 → R3):** If he retreats to R3, he surrenders the claim of **immunity**. He must admit that the null result *does* constrain the theory, provided the team is willing to question their operational choices (stimulus spacing, etc.) rather than treating them as fixed commitments. He loses the ability to close down discussion; the discussion becomes about which auxiliaries to adjust.
  *   **Retreating on Use 2 (R4 → R2/Calibration):** If he retreats from R4 (Online Penetration) to a developmental account, he surrenders the claim that **belief changes seeing**. He must admit that early vision *is* modular/encapsulated in the moment, but that the module's parameters are tuned over long timescales by expertise.

  **Assessment of Uses**
  *   **Use 1 is Hopeless.** It relies on R6, which is false. It turns the lab's work into a closed loop where failure is redefined as success. There is no defensible version of "theory-ladenness" that grants total immunity from falsification.
  *   **Use 2 has Something Going for It,** but the PI is using the wrong tool. Your suspicion is correct: the expertise and cross-population variation data likely demonstrate **developmental calibration** (long-term plasticity in the visual system), not **online cognitive penetration** (R4). Calibration is compatible with modularity (the module is tuned by experience but runs autonomously during the task). The PI is invoking the slogan (R4) to claim penetration, but the evidence supports calibration. He is correct that variation matters, but incorrect that it proves "observation is theory-laden" in the strong, online sense required to dismiss the persistent illusion data.

