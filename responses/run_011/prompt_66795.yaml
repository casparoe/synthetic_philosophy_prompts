  ### Analysis of the PI's Uses

  **First Use (The Null Replication)**
  The PI's move is licensed only by **R6**. He claims the null result measures "commitments rather than colour discrimination" and explicitly frames "immunity from 'raw' data" as a virtue. R1, R2, and R3 allow theory to influence how data is gathered or weighed, but they do not grant *immunity*; under R3, a null result can still falsify a theory if the auxiliary assumptions are held fixed. To get from "data is theory-laden" to "the hypothesis cannot be wrong," the PI must slide from R3 (Holism) to R6 (Conventionalism).
  *   **Missing Premise:** "If the conditions of measurement are theory-dependent, then the measurement cannot constrain the theory." This is invalid; dependent measurements can still be inconsistent with theoretical predictions.

  **Second Use (The Persistent Illusion)**
  The PI's move relies on a conflation of **R1** and **R4**. He uses R1 ("no report... is not already an interpretation") to dismiss the evidential value of the persistence claim ("this proves nothing"). However, his positive conclusion ("early vision is not sealed off") requires **R4**. The slogan is doing heavy lifting here to bridge the gap between "reports are interpreted" and "visual processing is penetrable."
