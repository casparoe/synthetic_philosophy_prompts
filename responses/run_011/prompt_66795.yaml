answer: |-
  1.  **R1 (Linguistic/Report):** Observation *statements* necessarily employ theoretical vocabulary to be articulated or communicated.
      *   **Tag:** **TRIVIAL**
      *   **Condition:** True if observers cannot describe stimuli without using concepts (e.g., "red," "line," "volt") that presuppose a classification scheme; refuted if a purely non-conceptual given is reportable.
      *   **Illusion Compatibility:** **Compatible** (One can report "looks unequal" using concepts while knowing "is equal").

  2.  **R2 (Attentional/Selection):** Background theory causally determines which parts of the sensory array are attended to, sampled, or recorded as data.
      *   **Tag:** **SUBSTANTIVE-DEFENSIBLE**
      *   **Condition:** True if observers with different theoretical commitments systematically fixate on or record different stimulus features; refuted if attention is purely stimulus-driven.
      *   **Illusion Compatibility:** **Compatible** (Theory might direct attention to the fins, but the illusion persists in the fovea).

  3.  **R3 (Evidential/Holistic):** The probative weight of a datum against a hypothesis is fixed by a network of background assumptions, not by the datum alone.
      *   **Tag:** **SUBSTANTIVE-DEFENSIBLE**
      *   **Condition:** True if a result can be saved by adjusting auxiliary hypotheses (e.g., stimulus calibration); refuted if a single observation could logically entail the falsity of a theory in isolation.
      *   **Illusion Compatibility:** **Compatible** (The persistence of an illusion is evidence whose meaning depends on the model of vision being tested).

  4.  **R4 (Causal-Online/Penetration):** Current cognitive states (beliefs, theories) causally modulate the computational processing of early visual representations in real-time.
      *   **Tag:** **CONTESTED**
      *   **Condition:** True if changing an observer's belief about a stimulus immediately alters the phenomenology or neural encoding of that stimulus; refuted if illusions persist unchanged under full, verified knowledge of the distal layout.
      *   **Illusion Compatibility:** **Incompatible** (Strong version); persistent illusions under full knowledge suggest early vision *is* sealed off from current belief.

  5.  **R5 (Constitutive/Conceptual):** The phenomenal content of a perceptual experience is constituted by the observer's possession of the relevant concepts.
      *   **Tag:** **CONTESTED**
      *   **Condition:** True if one cannot have the experience of "seeing a line" without possessing the concept "line"; refuted if non-conceptual creatures or infants have analogous visual states.
      *   **Illusion Compatibility:** **Compatible** (One can possess the concept "equal" yet the constitutive content of the experience remains "unequal").

  6.  **R6 (Immunizing/Conventionalist):** A theory determines the conditions of its own verification such that no observational outcome can count as disconfirmation.
      *   **Tag:** **FALSE**
      *   **Condition:** True if theoretical commitments make falsification logically impossible; refuted by any instance where a scientific community abandons a theory due to empirical failure.
      *   **Illusion Compatibility:** **Compatible** (By definition, it treats counter-evidence as irrelevant or reinterpreted).

