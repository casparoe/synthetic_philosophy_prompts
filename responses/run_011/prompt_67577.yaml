answer: |-
  # Question-Period Preparation Sheet

  ## Strategic Overview
  **The Single Point That Must Land:** The **Huckleberry Finn case**. If you cannot convince them that Huck has high moral worth *despite* his mistaken principles, the motivation for shifting from actual motivation to counterfactual robustness collapses. If Huck is merely lucky or amoral, your graded account loses its primary intuitive anchor.

  **Opening Concessions (First 5 Minutes):**
  Do not wait for the Q&A to make these. Build them into the introduction to disarm specific factions before they arm themselves.
  1.  **To the Chair (Kantian):** Concede immediately that this account *does* sever moral worth from the Good Will in the strict Kantian sense. Frame this not as a correction of Kant, but as a delineation of a different property (reliability of moral value vs. quality of will).
  2.  **To the Virtue Ethicists:** Concede that robust responsiveness *overlaps* significantly with virtue. Do not claim you are discovering a new phenomenon; claim you are offering a different *granularity* for assessing it, specifically for cases where virtue and principle come apart (like Huck).
  3.  **To the Psychologists:** Concede that counterfactuals are not directly observable. State clearly that you are proposing a *normative* structure that psychological models might approximate, not a claim that agents consciously calculate neighbourhoods.

  ---

  ## Objections Ordered by Damage Potential

  ### 1. The Circularity Objection (The "Prayer" Question)
  **Likelihood in this room:** High (Generalists & Kantian Chair). **Likelihood in general audience:** Medium.
  **Damage:** **Fatal.** If the "neighbourhood of nearby situations" is defined by which situations contain the right-making features, you are using moral truth to define moral worth, which was supposed to be the output.

  **The Objection (Generalist/Chair):**
  "You define moral worth as robustness across a neighbourhood of situations where the right-making features obtain. But how do we identify that neighbourhood without already knowing which features are right-making? If I need to know the moral truth to map the counterfactuals, your account doesn't explain moral worth; it just presupposes moral truth. Isn't this circular?"

  **The Reply (2 Minutes):**
  "That is the sharpest knife in the drawer, and I appreciate the cut. You are right that the account presupposes a moral realism about right-making features; it is not designed to generate moral truth, but to assess the agent's relation to it. However, the circularity worry assumes I need to *list* the neighbourhood to assess the worth. I don't. I am claiming that moral worth *consists in* that relation, whatever the neighbourhood turns out to be. We can judge that Huck is robustly responsive to suffering without having a complete theory of why suffering is bad. The metric is the stability of the response, not the metaphysical grounding of the feature. So, while it presupposes moral facts, it doesn't circle back on the definition of worth itself."

  **Where it is soft:** You are dodging the epistemic access problem. If we can't identify the neighbourhood without full moral knowledge, the concept is useless for deliberation.
  **Verdict:** **Fatal** if pressed hard. This is the structural weak point you identified.
  **Strategy:** Do not volunteer this. If asked, use the reply above to shift the burden to "metaphysical presupposition" rather than "definitional circularity."

  ### 2. The "Mere Mechanism" Objection (Kantian Chair)
  **Likelihood in this room:** Very High (Chair). **Likelihood in general audience:** High.
  **Damage:** **Fatal to the "Moral" label.** If successful, this reduces your "moral worth" to "instrumental reliability."

  **The Objection (Chair/Kantian):**
  "If I understand you, a thermostat that reliably maintains a life-sustaining temperature has 'robust responsiveness' to the feature 'life-sustainability.' If Huck helps the slave solely because he likes him, and would do so even if morality demanded he turn him in, you say he has moral worth. But this severs the link to the *good will*. You are describing a reliable mechanism, not a moral agent. Why call this *moral* worth rather than just *moral value produced*?"

  **The Reply (2 Minutes):**
  "I accept that I am severing worth from the Good Will. But I deny that 'moral worth' must be tied exclusively to the quality of the will. We often praise people for being 'good in a pinch' even when their motives are mixed. My claim is that there is a specific value in the *security* of moral outcomes that the Good Will account misses. A well-motivated agent who cracks under pressure lacks something a less-reflexive but robust agent has. I am not saying the mechanism is sufficient for full praise, which is why I distinguish worth from praiseworthiness. I am saying the reliability of the moral outcome itself carries a normative weight we should recognize, distinct from credit."

  **Where it is soft:** You are conceding the Kantian definition of "moral" to save your own. The Chair may not accept your revision of the term.
  **Verdict:** **Fatal** to the traditional project, but **Survivable** if you hold the line on revisionism. You must stand firm on the Worth/Praise distinction.

  ### 3. The "Virtue Relabeling" Objection (Virtue Ethicists)
  **Likelihood in this room:** Very High (Majority). **Likelihood in general audience:** Low.
  **Damage:** **Costly.** Makes the paper seem redundant to the majority of the room.

  **The Objection (Virtue Ethicist):**
  "You speak of 'stable dispositions' and 'responsiveness across situations.' This sounds precisely like *phronesis* or virtue, described modally. The Aristotelian account already handles the Huck case via natural virtue or habituation. What work is the counterfactual machinery doing that 'virtue' doesn't do better? Are you not just translating *hexis* into possible-worlds semantics?"

  **The Reply (2 Minutes):**
  "It is a close cousin, but the divergence matters. Virtue ethics typically ties the disposition to *correct reasoning* or *perception*. My account allows the agent to have *false* moral beliefs (like Huck) and still possess moral worth. A virtue ethicist might say Huck lacks virtue because his reasoning is flawed. I say he has moral worth because his responsiveness tracks the good despite the reasoning. The counterfactual machinery allows us to grade that responsiveness even when the internal psychology is morally mistaken. It captures the *value of the reliability* even when the *excellence of the character* is contested."

  **Where it is soft:** You are drawing a fine line between "responsiveness to features" and "perception of features." VEs may argue you can't have the former without the latter.
  **Verdict:** **Costly.** It risks making the room feel you are solving a problem they think is already solved.

  ### 4. The "Operationalization" Objection (Psychologists)
  **Likelihood in this room:** High (Minority but influential). **Likelihood in general audience:** Low.
  **Damage:** **Costly to Interdisciplinary Fit.** Won't kill the philosophy, but kills the workshop collaboration potential.

  **The Objection (Psychologist):**
  "You rely on counterfactuals: what the agent *would* have done. In psychology, we cannot measure counterfactuals directly; we measure behaviour in vignettes. How do I distinguish 'robust responsiveness' from a well-learned habit or social desirability bias in a survey? What experimental design would falsify your claim? If you can't measure it, how can we collaborate?"

  **The Reply (2 Minutes):**
  "I am not proposing that agents consciously simulate counterfactuals. I am proposing that their psychological architecture *supports* those counterfactuals. You measure this exactly as you do with traits: repeated vignette studies where you vary the cost, the social pressure, or the conflicting norm. If an agent helps across high-cost/low-reward variations where their stated principles say they shouldn't, you have operationalized robust responsiveness. Falsification comes if an agent's behaviour tracks only their stated principles and never the right-making features when they diverge. I offer a normative target for your models of stability."

  **Where it is soft:** You are asking them to treat "right-making features" as a variable they can manipulate independently of the agent's perception. This is methodologically difficult.
  **Verdict:** **Costly.** It limits the practical utility of your paper for their research, but doesn't refute the philosophy.

  ---

  ## The "Prayer" Question: Circularity
  **Your Guess:** You suspect the circularity worry (neighbourhood definition) is the danger.
  **Honest Assessment:** You are correct. This is the strongest philosophical objection. If the "neighbourhood" is defined by the presence of right-making features, and right-making features are defined by... well, morality, then the account tells us nothing about how to *identify* worth without already knowing morality.
  **How bad is it?** It is **Fatal** if the audience demands an epistemic guide. It is **Survivable** if you frame the project as *metaphysical* (what worth *is*) rather than *epistemic* (how we *know* it).
  **Buying Time (The Least Dishonest Way):**
  "If that question comes, do not bluff a solution you don't have. Instead, say:
  *'That is the central tension I am currently working through in the written version. My working hypothesis is that we can identify the neighbourhood via intuitive similarity in non-moral descriptions (e.g., 'situations involving acute suffering') without resolving the meta-ethical status of the suffering itself. But I agree the boundary conditions need tightening.'*
  This admits the problem, shows you are working on it, and shifts the focus to 'non-moral descriptions' which is a plausible escape route."

  ---

  ## Triage Strategy for the 20 Minutes
  You can only answer **two** challenges at length.
  1.  **If the Chair asks the "Mere Mechanism" question:** Take this. It is the most philosophically substantive and allows you to clarify the Worth/Praise distinction (your key innovation).
  2.  **If the Psychologists ask the "Operationalization" question:** Take this second. It shows respect for the interdisciplinary nature of the workshop and secures your standing with the research centre.
  3.  **Dispatch the rest:**
      *   **Virtue Ethicists:** "I agree it's a cousin of virtue, but the divergence on mistaken beliefs is the key contribution. I'd love to discuss the overlap in the break."
      *   **Circularity:** Use the "Buying Time" script above. Do not get bogged down in meta-ethics.
      *   **Generalists:** "That follows from the graded nature of the view, which I argue is an advantage."

  **Final Advice:**
  Your distinction between **Moral Worth** and **Praiseworthiness** is your shield. When attacked on Huck (why praise him if he thinks he's doing wrong?), or on the Mechanism (why call it moral if it's just reliability?), retreat to the shield: *"I am not arguing he deserves credit (Praiseworthiness); I am arguing the outcome has a specific normative stability (Worth)."* If you hold that line, you survive the afternoon.
