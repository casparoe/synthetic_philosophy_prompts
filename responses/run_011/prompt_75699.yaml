          *   Weakness: Doesn't explain the Agritourism bet well (buying a lottery ticket with operating cash).

      *   *Model 2: Prospect Theory (Kahneman & Tversky).*
          *   Features: Loss aversion, probability weighting (overweighting small probabilities, underweighting moderate/large), reference dependence, mental accounting.
          *   Fits:
              *   Rejecting Lose $100/Win $110: Loss aversion dominates near reference point.
              *   Accepting Lose $10/Win $12: Stakes too small to trigger heavy loss aversion curvature, or transaction cost of saying no.
