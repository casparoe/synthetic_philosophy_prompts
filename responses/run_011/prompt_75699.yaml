          *   Prediction for Co-op: The prompt says "nothing she owns is on the line either way." This classifies the money as "Surplus/Found." Her rule for Surplus (Mad Money envelope) is "bet that on anything."
          *   *Prediction:* Takes the Residual (Gamble).

      *   *Model 4: Regret Minimization / Narrative Utility.*
          *   She wants to be the kind of person who takes the big swing when the downside is capped.
          *   Fits: Agritourism ("She says she'd do it again"). Solar (took the variance).
          *   Prediction: Takes the Residual. Missing out on $1.3M hurts more than losing $9k she "forgot she had."

  5.  **Address the Roommate's Claim (Calibration Theorem):**
      *   *Claim:* Rabin's Calibration Theorem (2000). If you reject small favorable gambles (like 50/50 lose $100/win $110) at all wealth levels, you must reject large favorable gambles.
      *   *Extension:* Roommate claims this extends to Rank-Dependent Utility (RDEU) / Prospect Theory.
      *   *Reality Check:* Rabin's theorem applies to *Expected Utility* with concave utility. It shows that reasonable risk aversion on small stakes implies absurd risk aversion on large stakes.
      *   *Does it apply to Della?* She rejects small (Lose 100/Win 110) but accepts large (Solar, Agritourism). This *violates* standard EUT. That's why the roommate says she's "incoherent on the standard picture." He is right about EUT.
      *   *The Second Claim (RDEU):* Does the calibration theorem rule out RDEU/Prospect Theory?
      *   *Theory:* No. The whole point of Prospect Theory (and RDEU) is to solve the calibration problem by introducing *probability weighting* and *loss aversion* separate from curvature of utility. You can be risk-averse over small losses (loss aversion) but risk-seeking over small probabilities of large gains (probability weighting).
      *   *Verdict:* Roommate is wrong about the extension. RDEU/PT specifically allows for the pattern Della shows (rejecting small mixed gambles, accepting large lottery-like gambles). The "extension" the roommate mentions might refer to specific parameter constraints, but generally, PT is the *solution* to the calibration theorem, not a victim of it.

  6.  **Synthesize the Prediction:**
      *   **Decision:** She takes the Residual (the 1/150 shot).
      *   **Why:**
          1.  **Mental Accounting:** The money is "forgotten equity," not operating cash. It falls into the "Mad Money" bucket, where she is risk-seeking.
          2.  **Probability Weighting:** 1/150 is small enough to be overweighted (like the 1/80 hail and 1/50 permit).
          3.  **Precedent:** Agritourism permit is the strongest analogue. She spent *real* operating cash on a long shot. She will definitely spend *found* cash on a long shot.
          4.  **EV:** While EV is slightly lower on the gamble, the "life-changing" nature of $1.3M vs $9k triggers the lottery effect.

  7.  **Identify the "Splitter" (Next Decision to Watch):**
      *   Need a scenario that separates "Mental Accounting/Found Money" from "Probability Weighting."
