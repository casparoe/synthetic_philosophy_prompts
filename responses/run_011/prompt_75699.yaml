  4.  **Evaluate Decision Models (The Machinery):**

      *   *Model 1: Expected Utility Theory (EUT) with Concave Utility (Standard Risk Aversion).*
          *   Fits: Insurance purchase (paying premium > EV to avoid large loss). Rejecting 50/50 lose $100/win $110 (loss aversion/concavity at low stakes).
          *   Conflict: Taking the Solar gamble (50/50 $15k/$80k vs $40k certain). EV is higher on gamble, but a sufficiently risk-averse agent might take the certain $40k. However, the bigger conflict is the Agritourism permit (low prob, high gain).
