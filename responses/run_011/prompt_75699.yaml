      *   *Selection:* Let's go with a **small-stakes loss gamble framed as "profit"** vs **"capital"**.
      *   *Actually, the prompt asks for a decision that splits the **candidate rules**.*
      *   *Candidate Rules:*
          1.  **PT (Probability Weighting):** Overweights small probs.
