answer: |-
  ### Part 1: The Inconsistency Argument (For the Slide)

  You are correct: the triple is inconsistent. You cannot hold all three without rendering confirmation impossible in old-evidence cases. Here is the argument structured for a slide:

  1.  **Conditionalization Only:** Current credence $P_{new}(H)$ must equal prior conditional credence $P_{old}(H|E)$.
  2.  **No Counterfactuals:** $P_{old}$ must reflect the agent's *actual* doxastic history, not a hypothetical state where $E$ was uncertain.
  3.  **History-Independence:** Current confirmation depends only on current credences, not on the path taken to acquire them.
  4.  **The Conflict:**
      *   To get a boost for $H$ via (1), we need $P_{old}(E) < 1$ (otherwise $P_{old}(H|E) = P_{old}(H)$).
      *   Given (2), we must find a time in actual history where $P_{old}(E) < 1$.
      *   Given (3), the existence of that time is irrelevant to the current evaluation; only the current state ($P_{new}(E)=1$) counts.
      *   **Result:** If (3) holds, the boost from the past vanishes. If the boost is real, (3) must fail.
  5.  **Resolution:** Drop **History-Independence**. Confirmation is essentially diachronic; it is a measure of *change* driven by *process*, not a static relation between current propositions.

  ***

  ### Part 2: The Spec (Desiderata Table)

  | Requirement | Precise Statement | Motivation | Judgment |
  | :--- | :--- | :--- | :--- |
  | **1. History-Independence** | Two agents with identical current credence functions $P_t$ must assign identical confirmation values to $H$ given $E$, regardless of whether $E$ was learned at $t-1$ or $t-30$. | Prevents confirmation from becoming a biographical accident; ensures logic, not biography, drives support. | **Camp Prejudice**<br>(Synchronic Dogma. Confirmation is inherently diachronic. Dropping this dissolves the tension in the Triple above.) |
  | **2. No-Self-Deception** | The solution cannot require the agent to consciously adopt a credence function she knows to be false (e.g., pretending $P(E) < 1$ when she knows $P(E)=1$). | Normative theories shouldn't require cognitive dissonance or "running two books" as a condition of rationality. | **Non-Negotiable**<br>(A solution requiring psychological falsification is a *reductio* of the model, not a fix.) |
  | **3. Approximate-Evidence** | The solution must handle cases where $H$ entails a precise value $e$, but the agent is certain only of an observational range $E_{obs}$ where $e \in E_{obs}$. | Historical fidelity. In real science (e.g., Mercury), data has error bars; strict entailment is an idealization that never actually obtains. | **Non-Negotiable**<br>(If a solution only works for logical truths, it solves a puzzle, not the historical problem.) |
  | **4. The Forgetting Case** | If an agent loses the specific data $E$ but retains the belief that she *had* good data, $H$ must remain confirmed. | Tests whether confirmation is about current etiology or stored justification. | **Strike From List**<br>(Redundant. This is just a specific, muddied version of History-Independence. It introduces memory psychology distractions irrelevant to the logic of confirmation.) |
  | **5. Generality** | The mechanism must yield positive confirmation for $H$ entailing old $E$, and equal-or-greater confirmation for $H$ entailing new $E$. | Theoretical scope. A theory of confirmation shouldn't break when the temporal order flips. | **Non-Negotiable**<br>(Without this, you haven't built a theory of confirmation; you've built a theory of retrodiction.) |
  | **6. No-Free-Lunch** | The mechanism must distinguish between $H$ and $H \& X$ (where $X$ is irrelevant) even if both entail $E$. | Prevents trivialization. Any solution that confirms tacked conjunctions equally fails to capture *relevant* support. | **Non-Negotiable**<br>(Standard tacking problem. If you can't solve this, you haven't solved confirmation.) |
  | **7. Novelty Preference** | The mechanism must reproduce the intuition that novel prediction provides *stronger* confirmation than old evidence accommodation. | Matches scientific practice. Scientists bet on prediction, not accommodation. | **Camp Prejudice**<br>(Sociological Artifact. While true in practice, this may stem from trust in theorists, not logic. A solution shouldn't break if it treats them equally.) |

  ***

  ### Part 3: The Spine of the Lecture

  You asked which requirement does the most work in killing off candidate approaches.

  It is **The Approximate-Evidence Demand**.

  Here is why: Almost every standard solution to the Old Evidence Problem (Garber, Eells, Christensen, Howson) relies on the formal premise that $P(E) = 1$. They spend hundreds of pages constructing elaborate machinery (logical learning, counterfactual priors, ur-priors) to generate a boost *despite* certainty.

  If you enforce the Approximate-Evidence Demand, you force the admission that $P(E) < 1$ (because observational ranges are never certain). If $P(E) < 1$, standard Conditionalization works perfectly. $P(H|E) > P(H)$ is trivial. The "Old Evidence Problem" evaporates; it is revealed as an artifact of over-idealizing the data as a logical truth rather than an empirical measurement.

  Accepting this requirement doesn't just rule out specific solutions; it rules out the *necessity* for the entire literature you are about to teach. It forces the seminar to confront whether they are solving a philosophical problem or a formalist one.

  Verdict: The Approximate-evidence Demand
