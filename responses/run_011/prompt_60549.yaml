answer: |-
  My credence in the proposition that omissions are genuine causes is **0.42**.

  Here is the decomposition that produces this number:

  **(i) Probability that causation is fundamentally a difference-making relation: 0.80**
  Contemporary metaphysics largely favors counterfactual or interventionist accounts over strict process-transmission views. If causation requires physical transmission (like conserved quantities), omissions are automatically disqualified. Since the difference-making view is dominant, I assign a high probability here, though I reserve 0.20 for the possibility that a refined process theory or hybrid view ultimately prevails.

  **(ii) Conditional on difference-making, probability that omissions can be restricted to a non-arbitrary, sparse class: 0.70**
  This is the "proliferation problem." If my failure to save the swimmer is a cause, so is the failure of every person on earth not to fly in and save them. To avoid this, we need a principled restriction, typically appealing to defaults, norms, or functions. While theories invoking "default behaviors" (e.g., McGrath, Bernstein) are promising, there is a risk that these restrictions are merely pragmatic or context-dependent rather than metaphysically robust. I assign 0.70 to reflect optimism about default-based restrictions, tempered by the difficulty of grounding them objectively.

  **(iii) Probability that the intuition survives the "causal selection" alternative: 0.75**
  Even if omissions make a difference and can be restricted, it remains possible that we label them "causes" only for pragmatic reasons (e.g., assigning blame or identifying intervenable points) rather than because they occupy the same ontological slot as positive events. I assign 0.75 to the view that there is a genuine metaphysical distinction here, acknowledging the strong pull of the pragmatic explanation.

  **Calculation:** $0.80 \times 0.70 \times 0.75 = 0.42$.

  ### Sensitivity Analysis

  My number is most sensitive to **Term (ii)** (the restriction problem). If the probability of non-arbitrarily restricting omissions drops from 0.70 to 0.40 (due to the conviction that any restriction relies on interest-relative norms), my credence plummets to 0.24. This term is the bottleneck because difference-making alone is too permissive, and pragmatic selection alone is too deflationary; the "genuine cause" claim lives or dies on whether we can metaphysically distinguish the lifeguard's omission from the bystander's without appealing to human interests.

  Regarding the finding that people's omission judgments track **default-and-normality expectations**: I would treat this as **evidence against the proposition** (that omissions are *genuine* causes), not merely evidence against the intuition. If causal attribution shifts with statistical or normative expectations, it suggests the causal relation itself is interest-relative or context-dependent. This supports the view that omissions are selected as causes for pragmatic or explanatory reasons (Term iii) rather than being part of the mind-independent causal fabric. To save the proposition, one would have to argue that norms are themselves metaphysical primitives, a costly move I am currently unwilling to make.

  ### Colleague Disagreement

  Your colleagues at **0.85** and **0.15** are most likely disagreeing about **Term (iii)** (Metaphysics vs. Pragmatics).

  Here is why: It is plausible that both colleagues accept the difference-making framework (Term i). A philosopher can believe causation is counterfactual dependence yet still hold that omissions are merely "causal explanations" rather than "causal relations" (the 0.15 position). Conversely, the 0.85 colleague likely believes that once difference-making and restriction are secured, there is no remaining work for pragmatics to do; the omission *is* the cause.

  If they disagreed primarily on Term (i), the 0.15 colleague would be a process theorist. While possible, the more nuanced and common split in the omission literature occurs *within* the difference-making camp. The 0.85 colleague sees the normative restriction as successfully ontologizing the omission, while the 0.15 colleague sees that same normative restriction as proof that the attribution is pragmatic, not metaphysical. Thus, Term (iii) captures the specific fault line regarding the *status* of omissions, whereas Term (i) captures a broader disagreement about causation itself.
