  The granaries swell with the weight of **bread**,
  Young men wait patiently for their **seats**,
  Gold piles deep within the state's **coffers**,
  Wisdom flows from the lips of the **fathers**,
  Rust gathers slowly on the hanging **swords**,
  And the census takers struggle with the **count**.

  Too many mouths to feed, the **count**
  Rises higher than the stored **bread**,
  Neighbors eye each other's **swords**,
  Too many nobles fighting for **seats**,
  The gray hair fades from the **fathers**,
  Taxes drain the hollowed **coffers**.

  No silver left in the royal **coffers**,
  They tally loss instead of gain, the **count**,
  Sons rise up against the **fathers**,
  There is stone instead of **bread**,
  Blood stains the velvet of the **seats**,
  Peace is broken by the **swords**.

  Fire leaps from the scabbarded **swords**,
  Nothing remains to fill the **coffers**,
  The throne room lacks its honored **seats**,
  The villages disappear from the **count**,
  No one kneels to break the **bread**,
  The earth swallows up the **fathers**.

  Grass grows over the bones of **fathers**,
  Silence hangs where clashed the **swords**,
  The plow returns to bring the **bread**,
  Slowly copper fills the **coffers**,
  The scribe begins a new **count**,
  The survivors claim the empty **seats**.

  The ordered rows of marble **seats**,
  The lineage traced back to **fathers**,
  The scribe resets the village **count**,
  The peace enforced by hidden **swords**,
  The tax that fills the heavy **coffers**,
  The children cry aloud for **bread**.

  New lords ascend the vacant **seats** to sharpen **swords**,
  Forgetting the silent dust of **fathers**, they lock the **coffers**,
  Until the valley loses **count** and starves for **bread**.
