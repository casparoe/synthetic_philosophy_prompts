answer: |-
  **Brainstorming: The Room's Stakes**
  This room doesn't care about metaphysical elegance; they care about actionability. A 'good answer' tells a GP whether to prescribe, an economist whether to fund, and a psychiatrist whether to section. They will tolerate complexity only if it reduces clinical uncertainty. If your theory implies disease status is unstable, they will hear 'arbitrary'. Your job is to convince them that *explicit* normativity is safer than *hidden* normativity.

  ***

  ### Q&A Prep Sheet: Clinical Reasoning Seminar

  **1. The GP (Practical Naturalist)**
  *The Objection:* "Look, I appreciate the philosophy, but I have a patient in front of me with a vitamin D level of 25 nmol/L. In your view, is that a disease or not? If it depends on which reference class I pick, how do I know whether to code it and treat it? If you can't give me a rule for picking the class, you've just turned a clinical decision into a philosophical debate."
  *The Reply:* "You're right to demand a rule, and here it is: the reference class is fixed by the *goal of the encounter*. If the goal is acute symptom relief in a modern office worker, the relevant class is the current population—so likely not a disease. If the goal is preventative health optimisation based on evolutionary mismatch, the class is ancestral—so it is a disease. My view doesn't stop you coding; it forces you to be honest about *why* you're coding. Currently, you're hiding that value judgement behind a 'normal range'. I'm asking you to bring it into the light so the patient knows whether we're treating pathology or optimising lifestyle."
  *Soft Spot:* Doesn't actually solve the conflict if the patient wants one goal and the insurer another.

  **2. The Psychiatrist (Harmful Dysfunction Defender)**
  *The Objection:* "I can accept this for vitamin D, but let's talk about depression. If disease status is indexical to social interests, aren't you saying depression is only a disease because capitalism wants people to work? That collapses into 'social non-conformity is illness'. How do you protect the patient from the state using your theory to medicalise their grief?"
  *The Reply:* "That's exactly the risk I'm trying to mitigate. On the standard view, we pretend depression is a 'natural kind' like malaria, which hides the social values involved. On my view, we admit that 'function' here means 'ability to participate in social life'. That doesn't make it less real; it makes the stakes clear. We treat depression not because a mechanism is broken in a value-free sense, but because the suffering and dysfunction are judged unacceptable relative to a welfare-based reference class. It protects the patient by forcing us to justify the 'harm' part of 'harmful dysfunction' openly, rather than smuggling it in via biology."
  *Soft Spot:* Still relies on a consensus about 'welfare' that might not exist.

  **3. The Philosopher of Science (Boorsean)**
  *The Objection:* "You're presenting this as a novel solution, but Boorse already addressed reference classes. They aren't normative choices; they're natural kinds determined by age and sex. You're rebranding a technical problem as a philosophical feature. If you allow interest-relative classes, you destroy the objectivity of the biostatistical theory entirely."
  *The Reply:* "Boorse assumes age and sex are the *only* natural kinds, but that's precisely the normative jump I'm highlighting. Why not stratify by socioeconomic status or environment? Those are statistically relevant but excluded because we've decided they shouldn't count as 'natural'. I'm not destroying objectivity; I'm locating it. The statistics are objective; the choice of which statistics matter is where the values live. Ignoring that choice doesn't make the theory more objective; it just makes the values invisible."
  *Soft Spot:* Risks sounding like you're denying biological reality of age/sex differences.

  **4. The Health Economist**
  *The Objection:* "I work with QALYs and disability weights every day. This sounds like you're just describing threshold setting. We already know there's a cut-off where 'impairment' becomes 'eligible for treatment'. What work is 'indexicality' doing here that 'cost-effectiveness threshold' doesn't do better?"
  *The Reply:* "Thresholds decide *severity*, but my view decides *category*. A threshold says 'this impairment is bad enough to fund'. Indexicality says 'this impairment counts as a dysfunction at all'. You might set a threshold for vitamin D treatment, but my view asks whether low vitamin D is a deviation from function or just a new normal. It changes the numerator in your equation, not just the denominator. It prevents us from spending money fixing statistical deviations that nobody actually experiences as harmful."
  *Soft Spot:* In practice, the distinction between category and severity often blurs.

  **5. The Disability Studies Scholar**
  *The Objection:* "You say this exposes values, but selecting a reference class is how you launder the status quo into biology. By choosing an 'ancestral' class, you're saying modern bodies are wrong. By choosing a 'current' class, you're saying we should accept pathological environments. Either way, you're medicalising the fit between body and world rather than fixing the world."
  *The Reply:* "I agree that reference class selection can be oppressive, which is why it must be transparent. If we say 'myopia is a disease because you can't work in a factory without glasses', we admit that's about labour markets, not biology. My theory doesn't tell you which class to pick; it tells you that picking one is a political act. That transparency is the only tool we have to challenge the status quo. Hiding the choice behind 'natural function' protects the status quo far more effectively than exposing it."
  *Soft Spot:* Hard to maintain neutrality when the theory itself relies on 'function'.

  **6. The GP (Secondary: Feasibility)**
  *The Objection:* "You keep using ancestral environments as an example. We don't have those statistics. We have lab ranges based on current populations. Are you expecting me to use paleolithic data to diagnose patients in Bristol?"
  *The Reply:* "No, not for daily diagnosis. Use the lab ranges. But when you're designing guidelines or debating screening programmes, that's where the reference class matters. Don't use ancestral data to treat the individual; use it to question why the population range has shifted. Is it adaptation, or is it environmental degradation? My view is for policy and reasoning, not necessarily for the point-of-care test kit."
  *Soft Spot:* Limits the theory's utility to policy, reducing immediate clinical relevance.

  **7. The Psychiatrist (Secondary: Suffering)**
  *The Objection:* "What about conditions where there's no statistical deviation but there's immense suffering? If everyone is depressed, is it still a disease on your view?"
  *The Reply:* "If everyone is depressed, it's no longer a statistical dysfunction, but it remains a 'harm'. My view separates the 'dysfunction' component from the 'harm' component. It might not be a 'disease' in the biostatistical sense, but it's still a condition warranting intervention. This prevents us from ignoring epidemics just because they're common. It forces us to treat the harm even if the function is statistically normal."
  *Soft Spot:* Drifts away from the core thesis into a hybrid view.

  **8. The Philosopher of Science (Secondary: Semantics)**
  *The Objection:* "Isn't this just vagueness? All concepts have borderline cases. Why do we need 'indexicality' rather than just admitting the concept of disease is vague?"
  *The Reply:* "Vagueness implies a fuzzy boundary around a single concept. Indexicality implies distinct concepts depending on context. 'Tall' isn't vague; it's indexical. A tall jockey is short for a basketball player. Disease is the same. Calling it vagueness suggests we just need better measurements. Calling it indexicality admits we need better context. It changes the solution from 'more data' to 'clearer goals'."
  *Soft Spot:* The distinction between vagueness and indexicality is itself philosophically contested.

  ***

  ### Strategic Concessions (Pre-empt these in the talk)
  1.  **To the Economist:** Concede that this *looks* like threshold setting. Don't fight the similarity; fight the implication that it's *only* that. Say: "I know this sounds like QALY thresholds, and in practice, they overlap."
  2.  **To the GP:** Concede that ancestral stats are unusable in clinic. Say: "I am not suggesting you use paleolithic ranges in surgery."
  3.  **To Disability Studies:** Concede the risk of laundering the status quo. Say: "This tool can be used oppressively if the interests chosen are oppressive."

  ### The Crucial Reply
  **Objection #1 (The GP on Actionability)** absolutely has to land. If the clinicians leave thinking your theory makes diagnosis *harder* or *uncertain*, the talk is a failure. You must convince them that *explicit* uncertainty is better than *hidden* false certainty.

  ### The Dreaded Question
  *"Whose interest determines the reference class?"*
  If a patient wants to be treated (ancestral class) but the NHS refuses (current population class), whose interest wins? This exposes the power dynamic immediately. If you say "the clinician's," you're paternalistic. If you say "the insurer's," you're cynical. If you say "the patient's," you risk medicalising everything. This question combines the Psychiatrist's moral worry with the GP's practical worry and the Disability Scholar's political worry into one unanswerable directive. Prepare for this by emphasising *shared decision-making* as the mechanism for selecting the class.
