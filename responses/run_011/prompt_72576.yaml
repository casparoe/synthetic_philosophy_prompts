answer: |-
  **Project Title:** The Architecture of Intuition: A Methodological Reconstruction of the Teletransporter Debate

  **Statement of the Question**
  Since Parfit, the debate over personal identity and survival has proceeded by engineering cases—the teletransporter, fission, and the combined spectrum—and reporting the intuitions they elicit. This project asks a methodological question rather than a substantive one: Is the current space of thought experiments topologically sufficient to adjudicate between competing theories of survival? Specifically, do the canonical cases vary the relevant parameters of psychological connectedness and continuity exhaustively, or have they fixed hidden variables that bias the output?

  I propose that the standard case design samples the space of possibilities poorly. It typically varies one or two parameters (e.g., continuity vs. identity) while holding others fixed at unjustified values. My research focuses on two such fixed parameters: *Overlap* (the temporal coexistence of original and successor) and *Fidelity* (the dimensionality of psychological loss). The central question is determinate: If we systematically vary overlap and fidelity along dimensions currently ignored, do our intuitions about what matters in survival shift in ways that existing theories cannot explain? If they do, the framework requires revision. If they do not, and variations are explained by confounding variables (e.g., consent, fear), we gain a principled defense of the current methodology against charges of artifact.

  **The Gap in Existing Positions**
  The three dominant positions in this field share a reliance on the standard case-design method, differing mainly in how they interpret the outputs. The Psychological Continuity theorist argues that survival consists in the holding of specific causal-psychological relations. The Biological or Animalist critic argues that we are organisms, and survival is a matter of biological continuity, rendering psychological branching irrelevant. A third group, following Parfit's reductionist conclusion, argues that identity is not what matters; rather, survival is a matter of degree based on connectedness.

  All three positions accept the canonical vignettes as valid data points. They dispute whether the intuition that "I survive" or "I do not survive" in a fission case tracks identity, biology, or prudential concern. However, they all treat the vignettes as stable stimuli. If the stimuli themselves are methodologically flawed—if they suppress variables that actually drive intuition—then all three positions are arguing over noisy data. The Animalist claims the teletransporter kills you; the Continuity theorist claims it preserves you; but if the case description implicitly relies on a specific, unexamined configuration of overlap and fidelity, both may be misdiagnosing the source of the intuition. This project does not take a side in that substantive debate; it investigates the reliability of the instrument used to measure it.

  **Methodology and Work Plan**
  The project unfolds over twenty-four months in four phases. The challenge is to move from conceptual analysis to empirical testing without reducing the philosophical work to mere data collection.

  *Months 1–6: Parameter Individuation.*
  The first task is to define what counts as a parameter. Varying a detail does not necessarily vary a case; it might merely smuggle in a new concept. I will establish criteria for individuation: a variable is a genuine parameter only if varying it preserves the logical type of the case while altering the degree of the relation in question. For *Overlap*, the standard cases sit at endpoints: instantaneous replacement or indefinite coexistence (fission). I will construct a formal model of the intermediate regime: a structured overlap where original and successor interact, hand over projects, and correct recollections. For *Fidelity*, I will distinguish between episodic detail and character/commitments. The output of this phase will be a matrix of case-descriptions that isolate these variables.

  *Months 7–12: Coherence and Feasibility.*
  This is the critical philosophical phase where I address the objection that the proposed cases are incoherent. A skeptic might argue that "zero overlap plus ongoing interaction" is contradictory, or that "character without episodic memory" is nomologically impossible. I will argue for coherence by analogy to clinical and real-world phenomena. For Fidelity, I will draw on neuropsychological literature regarding amnesia and dementia to demonstrate that the dissociation between semantic commitment and episodic recall is empirically grounded, not just logically conceivable. For Overlap, I will model the "interactive handover" on extended cognitive coupling and collaborative agency. This phase ensures the vignettes describe possible worlds, not just verbal contradictions. This is where the interdisciplinary nature of the institute is vital; I will consult with the cognitive neuroscience fellows to ensure the psychological profiles I construct are not ruled out by current models of memory consolidation.

  *Months 13–18: Experimental Design and Pilot.*
  Here I address the panelist who asks why this is not simply a large survey waiting to be run. The philosophical contribution lies in the *design matrix*. Standard surveys test intuitions on pre-existing cases. My project constructs new stimuli based on the conceptual work of Phases 1 and 2. Without the prior philosophical labor, a survey would confound variables (e.g., varying fidelity while accidentally varying the perceived voluntariness of the procedure). I will design a modest vignette study to test whether intuitions track the new parameters or collapse into confounding variables like fear of death or consent. The goal is not a definitive population study, but a proof-of-concept that the new parameters are intuitively salient.

  *Months 19–24: Synthesis and Implications.*
  The final phase integrates the conceptual analysis with the experimental results. I will draft the dissertation manuscript and prepare articles for both metaphysics and cognitive science venues. The goal is to show either that the standard framework is robust (because the new parameters don't change intuitions) or that it requires expansion (because they do).

  **Candidate Outcomes**
  There are three distinct outcomes, discriminated by the interaction between the new parameters and the reported intuitions.

  1.  **The Framework Revision:** Intuitions about survival flip or fragment along the new axes. For example, subjects might judge that survival is preserved in high-fidelity/low-episodic cases but not vice versa, or that interactive overlap generates a new category of "shared survival." This would indicate that current theories (Continuity, Animalism) are incomplete because they lack the vocabulary to describe these dimensions.
  2.  **The Robustness Defense:** Intuitions remain stable across the new parameter space, or variations are fully explained by non-identity variables (e.g., subjects reject the case because the original is harmed, not because the successor is discontinuous). This would be a substantial positive result: a principled reply to the charge that teletransporter intuitions are artifacts of vignette construction. It would vindicate the standard method.
  3.  **The Incoherence Collapse:** Upon close inspection, the intermediate cases turn out to be conceptually unstable. For instance, it may prove impossible to describe "interactive overlap" without implicitly describing two distinct people merely communicating, rather than one person surviving.

  **Failure Conditions**
  I must be honest about the risks. The project fails if Outcome 3 obtains in its strongest form: if the intermediate cases are shown to be incoherent on close inspection, reducing the exercise to a taxonomy of impossible scenarios nobody wanted. A second failure mode is empirical nullity: if the vignette study shows no variance in intuition, and I cannot argue that this stability is philosophically significant (i.e., if it looks simply like a lack of statistical power). Finally, the project fails if I cannot clearly distinguish the *philosophical* work of case construction from the *psychological* work of data collection. If the proposal becomes merely a plan to run subjects on new stories, it loses its philosophical justification.

  **Scope and Risk Assessment**
  To keep this a two-year postdoc project rather than a second dissertation, I must limit the empirical scope. I will not run a large-scale, multi-cultural study. The vignette work is a pilot to test the *stimuli*, not to settle the metaphysics. I will also limit the clinical literature review to what is necessary to establish nomological possibility, not to write a history of memory science.

  The part of the project most likely to swallow the rest is the Coherence Phase (Months 7–12). Defending the possibility of "character without episodic memory" or "constitutive overlap" invites deep objections from both metaphysicians (who will claim I have changed the subject) and scientists (who will claim the psychology is impossible). If I spend too long defending the possibility of the cases, I will not have time to test them. My mitigation strategy is to set a hard deadline: if a case cannot be rendered coherent within three months of drafting, it is cut from the matrix. I will prioritize the Fidelity parameter over the Overlap parameter if necessary, as the clinical analogues for fidelity loss are more robustly documented than the analogues for interactive identity overlap.

  This project offers the metaphysicians a cleaner methodological foundation, the psychologists better-controlled stimuli, and the neuroscientists a philosophically rigorous map of the conceptual space surrounding memory and self. It treats the thought experiment not as a static intuition pump, but as a design problem.
