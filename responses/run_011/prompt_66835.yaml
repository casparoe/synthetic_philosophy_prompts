answer: |-
  **MEMORANDUM**

  **TO:** Charter Review Commission
  **FROM:** [Your Name]
  **DATE:** August 12
  **SUBJECT:** Recommendations on Franchise Expansion and Voting Obligations

  Regarding the three matters before us: I recommend we adopt the lowering of the voting age to sixteen; I recommend we defer the extension of the franchise to non-citizen residents pending state judicial clarification; and I recommend we reject the mandatory voting clause.

  My background is in measuring trace metals in sediment, where the most critical skill is distinguishing signal from noise and knowing when a reading is below the detection limit. In this commission, we are attempting to measure democratic will, but our instruments are currently calibrated to a specific population. The data from our last three municipal elections shows a stark variance: turnout among registered voters over sixty-five who own homes is 68 percent, while turnout among registered voters under thirty is 11 percent. This is not random noise; it is a systematic bias in our measurement of community needs. The failure of the storm-drainage bond by 214 votes, despite serving the low-lying wards where renters and non-citizen residents concentrate, suggests that our current electorate does not accurately reflect the stakeholders who bear the consequences of council decisions. We must adjust our methodology to capture the true signal of the city's interests.

  On the question of lowering the voting age to sixteen, the evidence supports adoption. Jurisdictions like Takoma Park, Maryland, have successfully implemented this for local elections without administrative collapse. Sixteen-year-olds pay sales taxes, work in local businesses, and are subject to municipal laws; excluding them creates a class of taxed subjects without representation. Unlike the non-citizen question, our city attorney confirms this falls within our home-rule authority, meaning the legal risk is low. The objection that sixteen-year-olds lack maturity is a claim about capacity that is not borne out by the cognitive data available on decision-making at that age, nor by the fact that we allow them to drive and work. If we accept that municipal voting is about stakeholding rather than national sovereignty, the age of eighteen is an arbitrary detection limit that excludes valid signal.

  On the question of non-citizen voting, the recommendation is to defer. While historical precedent shows that forty states allowed some form of alien suffrage before 1926, and current examples exist in Maryland and Vermont, our context is constrained by state law. Our city attorney advises that the state constitution's definition of an "elector" likely bars this expansion, meaning any recommendation we make would trigger litigation we are likely to lose. Here, I must address the vice chair's strongest argument, which she has framed in terms of institutional credibility and legal realism. She argues that recommending a provision the state courts will void consumes the public goodwill the whole charter revision depends on and may take the age provision down with it; furthermore, she contends that because we are chosen by the current electorate, any rule we adopt about who may vote is adopted by a body whose composition that very rule would alter, creating a logical loop where the only non-question-begging baseline is the law as it stands.

  This argument does not defeat the moral case for non-citizen voting, but it prices it beyond what this commission can pay. Her point about the "bootstrap" problem is legally sound: we cannot validly change the rules of our own selection using the authority derived from the old rules if those new rules invalidate the authority itself. Additionally, her concern that registering non-citizens creates a list discoverable by federal authorities, potentially endangering residents for a symbolic vote that yields no operative power, is a risk assessment I cannot ignore. In the laboratory, if a sample is contaminated by the process of measuring it, we do not report the value; we flag the method. Here, the method is contaminated by state law. Therefore, we should defer this item until the state constitution is amended or the attorney general issues a clarifying opinion, rather than risking the entire charter review on a provision likely to be voided.

  On the mandatory voting clause, I recommend rejection. While the Australian model ensures high turnout, it treats voting as a duty akin to jury selection rather than a right of agency. Our data shows low turnout among the young, but compulsion does not solve the underlying disengagement or the structural barriers that suppress the signal. A modest administrative forfeiture functions as a regressive tax on the poor, who are already the least likely to vote. We should aim to increase the signal strength by making voting more accessible and relevant, not by penalizing silence.

  Regarding packaging, I recommend the council place the voting age question on the ballot as a standalone measure. Combining it with the deferred non-citizen question would invite legal challenges that could delay or invalidate the age provision. Combining it with the mandatory voting clause would confuse the message, mixing expansion of rights with compulsion of duty. Sequencing matters: we should establish the principle of expanded stakeholding with the age question first. If that passes, it builds a mandate for further inclusion. If we bundle them, we risk a "no" vote on the package driven by opposition to mandatory voting or fear of litigation over citizenship, thereby losing the age provision which is legally secure and politically viable.

  Finally, we need a decision rule for future franchise questions, whether regarding seventeen-year-olds in primaries or electors for the regional water district. In the laboratory, when a signal sat near the detection limit, we had written conventions for reporting it as below detection rather than pretending to a measurement. We lack such a convention here. I propose we adopt a "Stakeholder Impact Rule": any expansion of the franchise should be approved if the group in question bears a direct, disproportionate burden of municipal policy relative to their current representation, provided the expansion does not violate superior law. If the legal authority is ambiguous, as with the non-citizen question, the rule defaults to "below detection"—we do not recommend the change until the legal signal is clear. This prevents us from making symbolic gestures that endanger residents or waste public resources.

  We are here to validate the method of our city's governance. The current method excludes significant stakeholders from the measurement of their own interests. We can fix the age limit without breaking the instrument. We cannot fix the citizenship limit without breaking the instrument. We should not compel the measurement through penalty. Let us recommend what is measurable, legal, and just.
