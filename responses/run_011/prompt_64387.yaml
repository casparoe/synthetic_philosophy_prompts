          *   *Szaszian Gloss:* This reflects the category's inherent nature as a metaphor; boundaries are vague because "mental disorder" maps onto problems in living, not natural kinds.
      2.  **Reliability vs. Validity:** Clinicians can achieve high diagnostic reliability (agreement on labels) without establishing diagnostic validity (proof of underlying dysfunction).
          *   *Psychiatrist Gloss:* Reliability is a necessary precursor to validity; M.R.'s consistent labeling across episodes suggests we are tracking a real phenomenon.
          *   *Szaszian Gloss:* Reliability proves only that clinicians share a language for deviance; M.R. was labeled consistently, but this confirms social consensus, not pathology.
      3.  **Historical Flux:** The diagnostic catalogue has historically expanded and contracted based on social and professional consensus.
          *   *Psychiatrist Gloss:* This represents moral and scientific progress as we better understand human suffering.
          *   *Szaszian Gloss:* This represents shifting mechanisms of social control, where behaviors once deemed sinful or criminal are medicalized to justify intervention.

