answer: |-
  You are right to be worried, and your colleague is underestimating the risk. In formal epistemology and social choice, the Common Prior Assumption (CPA) is not "plumbing"; it is a substantive claim about the rationality of agents and the structure of the world. It asserts that all differences in belief must be traceable to differences in information, not differences in starting points or cognitive processing.

  However, per your constraint, we will not try to settle whether CPA is *true*. Instead, we will rank research questions by their ability to **stress-test the robustness** of the program's conclusions *regardless* of CPA's truth value. The goal is to determine if the philosophical payoffs (conciliationism, utilitarianism, etc.) survive if CPA is merely an approximation or if it fails locally.

  Here is the ranking of open questions based on **leverage** (how much it changes the philosophical landscape), **feasibility** (for a 4-person formal team in 3 years), and **upstream dependency**.

  ### 1. The Robustness of Agreement Theorems with Heterogeneous Priors
  **Rank:** #1 (Critical Path)
  **Why:** This is the direct stress-test of the "Aumann-style" pillar of your colleague's program. If the "rational agents can't agree to disagree" result dissolves completely without CPA, the epistemological foundation of the program crumbles. If it survives in a modified form (e.g., "agents can't agree to disagree *beyond bound X*"), that is a publishable, field-shifting result.
  **Tools:** Existing tools in generalized probability and "common *p*-belief" (Monderer & Samet) are sufficient to start, but extending them to dynamic updating with heterogeneous priors requires new formalization.
  **Philosophical Impact:** If you can show that disagreement is *stable* under rational updating with different priors, you undermine the normative force of standard conciliationism. Philosophers would have to shift from "you must conciliate" to "you must conciliate *unless* prior divergence exceeds threshold Y."
  **Upstream/Downstream:** This is **upstream** of everything else. If agreement is impossible without CPA, the Impartial Observer theorem (which relies on aggregating beliefs) becomes much harder to motivate.

  ### 2. The Impartial Observer's Unanimity Without Shared Priors
  **Rank:** #2 (Normative Stakes)
  **Why:** This addresses the Harsanyi/utilitarianism pillar. Harsanyi's Aggregation Theorem leans heavily on the idea that if everyone agrees on the facts (or would given the same info), we can aggregate utilities. If priors differ, "facts" are no longer common ground.
  **Tools:** Social choice theory tools exist (e.g., weighted utilitarianism), but integrating them with heterogeneous Bayesian updating is technically demanding.
  **Philosophical Impact:** If the Impartial Observer theorem fails without CPA, it suggests that utilitarian aggregation is illegitimate in pluralistic societies where worldviews (priors) differ fundamentally. This changes how political philosophers argue about welfare and policy.
  **Upstream/Downstream:** **Downstream** of Question #1. If agents can't even agree on the likelihood of states (Q1), aggregating their utilities over those states (Q2) is conceptually fraught.

  ### 3. Formal Identifiability: Priors vs. Bad Updating
  **Rank:** #3 (Conceptual Limit)
  **Why:** You framed this as empirical, but for a formal team, this should be treated as an **identifiability problem**. Can an outside observer (or the agents themselves), given a finite history of actions/beliefs, distinguish between Agent A having a different prior vs. Agent A updating via a non-Bayesian rule?
  **Tools:** Statistical learning theory and formal learning models. This is feasible for a formal team without running experiments.
  **Philosophical Impact:** If the answer is "No, they are observationally equivalent," then the debate between "reasonable disagreement" (different priors) and "irrationality" (bad updating) is metaphysically idle. Philosophers would have to stop arguing about who is irrational and start arguing about which model is more pragmatically useful.
  **Upstream/Downstream:** **Parallel** to Q1. It constrains how we interpret the results of Q1. If we can't distinguish the causes of disagreement, the normative prescriptions derived from Q1 lose their target.

  ### 4. CPA vs. Imprecise Credences/Ambiguity Aversion
  **Rank:** #4 (Framework Shift)
  **Why:** This is a modeling choice question. Does moving to sets of probabilities (imprecise credences) solve the fragility found in Q1 and Q2?
  **Tools:** Well-developed literature (Walley, Levi), but applying it to *interpersonal* disagreement is less explored.
  **Philosophical Impact:** This changes the *language* of the debate rather than the substance. It moves philosophy from "what is your probability?" to "what is your set of probabilities?" It's important, but less likely to overturn the specific normative claims of the program than Q1 or Q2.
  **Upstream/Downstream:** **Downstream/Alternative.** This is the "Plan B" framework if Q1 and Q2 show that precise priors are too fragile a tool for modeling disagreement.

  ---

  ### Dependency Map

  ```mermaid
  graph TD
      Q1[Agreement Theorems w/ Heterogeneous Priors] --> Q2[Impartial Observer w/o CPA]
      Q3[Identifiability: Priors vs. Updating] -.-> Q1
      Q1 --> Q4[Imprecise Credences as Alternative]
      Q2 --> Q4
  ```

  *   **Q1 is the bottleneck.** If agreement theorems hold robustly (even with bounds), Q2 becomes viable. If they collapse, Q2 is likely dead in the water.
  *   **Q3 constrains the interpretation of Q1.** Even if Q1 finds a formal bound for disagreement, Q3 asks if we can ever know if that bound is met in reality.
  *   **Q4 is the escape hatch.** If Q1 and Q2 show that precise Bayesianism is too brittle for disagreement without CPA, Q4 offers the alternative formalism.

  ### What Would Reorder the List?

  **Finding 1: "Triviality Results" in Q1.**
  If the team spends Year 1 proving that *any* relaxation of CPA leads to a complete collapse of agreement theorems (i.e., "anything goes"), **Q4 (Imprecise Credences)** immediately jumps to #1. There is no point in refining a broken engine (Q1/Q2); you must switch fuel. The program would pivot to arguing that *only* imprecise models can handle disagreement.

  **Finding 2: "Observational Equivalence" in Q3.**
  If the team proves formally that priors and updating rules are indistinguishable from finite data, **Q3 jumps to #1**. This renders the entire "rationality vs. prior difference" debate (which underpins Q1 and Q2) pragmatically empty. The program would pivot to a pragmatic/instrumentalist defense of Bayesianism rather than a realist one.

  ### How to Argue This to Your Colleague

  Do not argue that CPA is *false*. Argue that **CPA is a singular point of failure for the program's output.**

  Use this analogy: *"We are building a bridge (the 3-year program). The CPA is the central pier. You say it's just plumbing and won't fail. I'm not saying the pier will collapse. I'm saying that if we don't test what happens to the bridge load (our normative conclusions) when the pier settles even an inch (heterogeneous priors), we can't certify the bridge for public use (philosophical application)."*

  Propose that **Question #1** becomes the primary workstream for Year 1.
  *   **If they find robustness:** They proceed with the original plan, but now with a "safety margin" (e.g., conciliation is required *unless* prior divergence > $\epsilon$). This strengthens their position.
  *   **If they find fragility:** They pivot to Question #4 early, saving Years 2 and 3 from building on a broken foundation.

  This frames the stress-test not as a critique of their vision, but as **risk management** for their research investment. It satisfies your constraint (we aren't settling CPA) while validating your concern (CPA is load-bearing).
