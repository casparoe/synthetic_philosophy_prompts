answer: |-
  **The Address**

  Stand easy. Keep your collars up; the wind carries further than a shout.

  We are here for eighty-four names. Stone cuts deep, but wind gets into the bone. I want you to feel that cold for a moment. Because comfort is what memorials are often designed to give, and today I am not going to offer you much of that.

  Look at the new plaque. It says: *"No one here chose it. No one anywhere should have."*

  It is a comforting sentence. It suggests a force of nature, a storm that blew in from the sea. But storms do not sign treaties. Storms do not mobilise armies. Storms do not draw lines on maps.

  History is not weather. It is a series of choices made by men in warm rooms.

  In July 1914, a crisis broke in the Balkans. It was dangerous, but it was not inevitable that it become a world war. It became one because leaders in Vienna decided to punish Serbia regardless of the risk, and leaders in Berlin gave them a blank cheque to do so. They knew this might bring Russia in. They knew it might bring France. They knew it meant crossing through Belgium. They chose those risks. They chose them to secure power, to secure territory, to secure a place in the sun.

  Once the fighting started, the aims grew harder. There were plans written in Berlin to annex land in France and Belgium and Poland, to make Germany a permanent master of the continent. This was not a tragedy that happened to Europe. It was a project undertaken by governments.

  Why does this matter, standing here in the wind? Why not let the dead sleep under a vague peace?

  Because when we say "No one chose it," we erase the lesson. If no one chose it, then no one can stop it happening again. If it was just a madness that took hold of everyone equally, then we are all innocent, and we are all helpless.

  But we are not helpless. And we are not all innocent in the same way.

  I know the risk of naming names. I know it because of a woman who lived on our High Street. She ran a bakery. She was German-born. She had lived here for years. In 1914, she was taken away in a van. She was treated as an enemy because of where she was born, not because of what she had done.

  That is the danger in this room. If I say "Germany was responsible," does that sound like the logic that put the baker in the van? It is a cousin to that logic. But it is not the same.

  Prejudice blames a people for who they are. Responsibility holds a power to account for what it does.

  The baker was a neighbour. The Kaiser's government was a machine. To confuse the two is to let the machine off the hook while punishing the neighbour. We must be precise. We hold governments to account so that people do not suffer for them.

  To our friends from Nordrhein-Westfalen: I know your mayor speaks next. I know your town has changed since 1914. I know your democracy is built on the ruins of that old ambition. I am not speaking to you as an accuser. I am speaking to you as a partner. Because only a free people can look at their past and say: *This was done in our name, and we will not let it be done again.*

  That is the truth I owe the eighty-four. They did not choose the war. But men chose it for them.

  So, how do we read the plaque now? *"No one here chose it."*

  Let us make that true. Let us mean it.

  The men whose names are on this stone had no vote in the matter. They were sent. We are the ones who are here. We are the ones with the vote. We are the ones with the voice.

  So I am asking you to join me. Not in silence, but in a promise. Read the words with me, but give them a new weight.

  *"No one here chose it."*
  We say this to honour the dead, who had no choice.

  *"No one anywhere should have."*
  We say this to warn the living, that we must always choose peace, and name the price of war.

  Let us keep that faith.

  ***

  **Where you will chicken out:**

  You will hesitate at the paragraph about Vienna and Berlin; the wind will feel suddenly loud, and you'll want to blur the specifics to avoid offending the German mayor. If you do, you betray the history you teach and turn the speech into the very platitude you oppose. You will also soften the link between the baker and the state; if you don't make that distinction sharp, the baker's granddaughter hears only noise, and the locals hear only accusation.

  **3-Minute Version (Church Hall)**

  We are here for eighty-four names. The new plaque says: *"No one here chose it."* It sounds like a storm blew through. But storms do not sign treaties. Governments chose this war in July 1914. They risked a continent for power and land.

  Why name this? Because vague peace allows vague enemies. When we refused to name the power that started this, we left room for the kind of thinking that interned our own German baker in 1914. We blamed a neighbour because we wouldn't blame a state.

  To our German friends: naming the past is not attacking you. It is the only way to ensure that power is never divorced from accountability again.

  So let us read the plaque not as a sigh, but as a vow. *"No one here chose it"*—because they were sent. *"No one anywhere should have"*—because we are here now, and we must choose better. Let us keep that faith.
