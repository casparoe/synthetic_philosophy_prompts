prompt: |-
  You are advising the steering committee of a small interdisciplinary center on knowledge and automation at a research university: four postdocs, one resident philosopher, a three-year runway, and a funder who wants both publishable conceptual work and guidance the university can use when it rewrites its rules on AI in coursework. Please work inside the following frame. Distinguish three ways of outsourcing epistemic labor: offloading storage and calculation, where the agent can still reconstruct the result (writing, calculators, search engines); deferential outsourcing, where the agent cannot follow the reasoning but has standing reasons to trust the community producing it (the point Hardwig pressed, that large-scale science rests on rational trust in testimony); and generative outsourcing, where the system supplies the candidate thoughts, formulations, and framings themselves. On this picture the live crux is whether verification competence can survive the loss of generation competence — whether one can keep the ability to tell good output from bad after losing the ability to produce it oneself.

  Given that setup, which open questions in this area should the center prioritize over its three years, and in what order? I want a defended agenda, not a survey. For each question, say why it sits upstream of the others, whether it is tractable by conceptual and philosophical method rather than requiring large empirical studies the center cannot run, how neglected it already is, and what it would deliver on the coursework-policy side of the funder's brief. Then tell me which currently fashionable questions the center should decline to take on, and whether they are overrated or merely premature. Finally, say what evidence or argument over the next two or three years would move each item up or down your ordering. Argue from the concepts rather than from citations; no bibliography, please.
reasoning: |-
  Here's a thinking process that leads to the suggested agenda:

  1.  **Analyze the Request:**
      *   **Role:** Advisor to a steering committee of a small interdisciplinary center (4 postdocs, 1 philosopher, 3-year runway).
      *   **Context:** Research university, funder wants publishable conceptual work *and* guidance for university AI-in-coursework policy.
      *   **Conceptual Frame:** Three types of outsourcing epistemic labor:
          1.  *Offloading:* Storage/calc (reconstructible).
          2.  *Deferential:* Trust in community/testimony (Hardwig style).
          3.  *Generative:* System supplies thoughts/framings (LLMs/AI).
      *   **Core Problem:** Can verification competence survive the loss of generation competence?
      *   **Deliverables:**
          1.  Prioritized agenda of open questions (defended, not a survey).
          2.  For each question: Upstream status, tractability (conceptual vs. empirical), neglect level, policy deliverable.
          3.  Questions to decline (overrated vs. premature).
          4.  Triggers for re-ordering (evidence/arguments).
      *   **Constraint:** Argue from concepts, not citations. No bibliography.

  2.  **Deconstruct the Frame & Core Problem:**
      *   The frame distinguishes *how* we rely on tools/others.
      *   *Offloading* is safe (I can check the math).
      *   *Deferential* is necessary for modern science (I trust the peer review/expert).
      *   *Generative* is the new risk (The AI writes the essay; can I tell if it's good if I can't write it myself?).
      *   *The Crux:* Verification vs. Generation. If students use AI to generate, do they lose the ability to verify? If they lose verification, education fails its epistemic mission.

  3.  **Develop the Prioritized Agenda (The "Yes" List):**
      *   *Goal:* Needs to be tractable for a small team (conceptual/philosophical), high impact for policy, and address the core crux.
      *   *Question 1 (The Foundation):* Defining the threshold of "Verification Competence."
          *   *Why Upstream:* You can't make policy on cheating or learning outcomes without knowing what counts as "knowing." If verification requires some generation capacity, we need to define the minimum viable generation.
          *   *Tractability:* Conceptual analysis (epistemology + pedagogy).
          *   *Neglect:* High. Everyone talks about "critical thinking," few define the dependency on generative skill.
          *   *Policy:* Defines the "learning objective" baseline.
      *   *Question 2 (The Mechanism):* The epistemology of "Black Box" Testimony vs. Generative Aid.
          *   *Why Upstream:* Is using an LLM like asking an expert (Deferential) or using a calculator (Offloading)? This classification dictates the rules.
          *   *Tractability:* Conceptual (social epistemology).
          *   *Neglect:* Medium. Lots of hype, little structural analysis of the *relationship*.
          *   *Policy:* Determines disclosure requirements and citation norms.
      *   *Question 3 (The Risk):* Atrophy and the "Cognitive Offloading Cliff."
          *   *Why Upstream:* If verification depends on generation, does using AI for generation cause verification atrophy?
          *   *Tractability:* Conceptual modeling of skill acquisition (though needs some empirical awareness, the *logic* is philosophical).
          *   *Neglect:* High. Most assume skills are modular; this questions modularity.
          *   *Policy:* Determines *when* AI is allowed (e.g., not in intro courses).

      *Refining the Order:*
      1.  *Verification-Generation Dependency:* (The Crux itself). Must solve this first.
      2.  *Classification of the Tool:* (Is it Offloading, Deferential, or Generative?). Depends on #1.
      3.  *Policy of Atrophy:* (When to ban/allow). Depends on #1 and #2.

      *Let's tighten the specific questions for the prompt's constraints.*
      *   *Priority 1:* The Necessary Condition of Generation for Verification. (Can you verify without being able to generate?)
      *   *Priority 2:* The Epistemic Status of AI Output. (Is it testimony or tool?)
      *   *Priority 3:* The Curricular Sequencing of Outsourcing. (When is it safe to introduce generative outsourcing?)

  4.  **Develop the "No" List (Questions to Decline):**
      *   *Fashionable but wrong:* "Will AI replace teachers?" (Speculative, not actionable for coursework policy).
      *   *Fashionable but premature:* "Detecting AI writing." (Arms race, empirical/technical, not philosophical).
      *   *Fashionable but distinct:* "AI Bias and Ethics." (Important, but distinct from the *epistemic labor* frame provided. Stick to the brief).
      *   *Selection:*
          1.  *AI Detection:* Empirical arms race, distracts from pedagogical design.
          2.  *Long-term Existential Risk:* Too abstract, doesn't help next year's syllabus.
          3.  *Copyright/Legal:* Important, but not epistemic/pedagogical.

  5.  **Develop Triggers for Re-ordering:**
      *   What would change the mind?
      *   Empirical evidence that verification *doesn't* require generation (lowers Priority 1).
      *   Technical breakthrough in explainability (changes Priority 2).
      *   Student performance data (changes Priority 3).

  6.  **Drafting the Content (Iterative refinement for tone and constraints):**
      *   *Tone:* Advisory, rigorous, conceptual, decisive.
      *   *Constraint Check:* No citations. Argue from concepts. Stick to the 3-year/small team constraint.
      *   *Frame Check:* Ensure the Offloading/Deferential/Generative distinction is central.

      *(Self-Correction during drafting)*: Make sure I explicitly link the "Verification Competence" crux to the policy brief. The funder wants rules for coursework. The rules depend on whether we believe students can verify AI output without knowing how to produce it.
      *   *Refining Question 1:* Call it "The Dependency Thesis."
      *   *Refining Question 2:* Call it "The Categorization Problem."
      *   *Refining Question 3:* Call it "The Sequencing Principle."

      *Check Neglect:* Is "Dependency" neglected? Yes, most assume you can critique without creating.
      *Check Tractability:* Can 4 postdocs + 1 philosopher do this in 3 years? Yes, it's conceptual work + small pilot studies (maybe), but primarily argumentation.

      *Check Policy Deliverables:*
      1.  Definition of learning outcomes.
      2.  Disclosure/Citation rules.
      3.  Course-level restrictions.

  7.  **Final Polish:**
      *   Ensure the distinction between "Overrated" and "Premature" is clear in the "Decline" section.
      *   Ensure the "Triggers" section is specific about *what* evidence moves the needle.
      *   Maintain the voice of a strategic advisor.

  8.  **Final Review against constraints:**
      *   No bibliography? Yes.
      *   Argue from concepts? Yes.
      *   Address the 3 types of outsourcing? Yes.
      *   Address the Verification/Generation crux? Yes.
      *   Address the funder's dual goal (publication + policy)? Yes.

      *(Final thought on the "Decline" section)*: Be careful not to say AI Ethics is unimportant, but that it falls outside *this specific frame* and *this specific team's capacity* regarding the funder's brief on coursework rules. Focus on "Detection" as the primary "Decline" because it's a technical trap.

      *(Final thought on Triggers)*: Make sure the triggers are realistic for a 3-year window.

      *Let's write.*
answer: |-
  To the Steering Committee:

  You have a tight constraint: three years, a small team, and a funder demanding both conceptual rigor and actionable policy. You cannot solve everything. You must solve the *upstream* problems that make downstream policy possible. Your conceptual frame—distinguishing offloading, deferential outsourcing, and generative outsourcing—is the correct lever. The crux, as you note, is the survival of verification competence absent generation competence.

  If verification requires some latent capacity for generation, then allowing generative outsourcing in the classroom is not merely a question of academic integrity; it is a question of cognitive atrophy. If verification does *not* require generation, then the pedagogical risk is minimal. This dependency thesis is the fulcrum.

  Here is the defended agenda for the next three years.

  ### I. The Prioritized Agenda

  **1. The Dependency Thesis: Is Generation a Necessary Condition for Verification?**
  *   **The Question:** Does the ability to distinguish good output from bad (verification) logically or psychologically require the ability to produce that output oneself (generation), even if only in principle?
  *   **Why Upstream:** This is the foundational epistemic question. If verification is independent of generation, students can safely use generative AI as a "black box" tool (similar to deferential outsourcing) provided they check the results. If verification *depends* on generation competence, then outsourcing generation erodes the very capacity needed to verify the output. You cannot write policy on AI use in coursework without settling this.
  *   **Tractability:** High. This is primarily conceptual. It requires analyzing the structure of "knowing-that" versus "knowing-how" in the context of linguistic and logical production. It does not require large-scale longitudinal studies, though small pilot interviews with students could illustrate the conceptual points.
  *   **Neglect:** High. Current discourse assumes "critical thinking" is a modular skill that survives the loss of "drafting" or "calculating" skills. Few are interrogating whether the critic must remain a potential creator.
  *   **Policy Deliverable:** A definition of "Learning Objectives" for the university. If generation is necessary for verification, policy must mandate "unassisted zones" where generation competence is built and maintained. If not, policy can focus solely on disclosure.

  **2. The Categorization Problem: Is AI Output Testimony or Tool Use?**
  *   **The Question:** When a student uses an LLM to draft an argument, are they engaging in *deferential outsourcing* (accepting testimony from a quasi-agent/community) or *offloading* (using a calculator for words)?
  *   **Why Upstream:** This determines the norms of citation and accountability. If it is deferential outsourcing (like citing an expert), the student must vouch for the source's reliability and attribute the view. If it is offloading (like a spellchecker), attribution is unnecessary, but accuracy is the user's sole responsibility. The current confusion in university policies stems from failing to distinguish these.
  *   **Tractability:** High. This is social epistemology. It requires mapping the features of LLM output (probabilistic, non-agentic, derived from community data) against the conditions for testimony (assertion, responsibility, trust).
  *   **Neglect:** Medium. Much ink is spilled on "is AI an agent?" but little on "what is the epistemic relation between user and output?"
  *   **Policy Deliverable:** A standardized "Citation and Disclosure Framework." This tells faculty whether to treat AI text as a source to be cited (deferential) or a tool to be acknowledged (offloading), reducing administrative friction.

  **3. The Sequencing Principle: When is Generative Outsourcing Pedagogically Safe?**
  *   **The Question:** Assuming some dependency between generation and verification, at what stage of expertise can a student safely outsource generation without losing verification competence?
  *   **Why Upstream:** This relies on the answers to #1 and #2. If there is a dependency, there must be a "competence threshold" before outsourcing is permitted. You cannot ban AI everywhere, nor allow it everywhere. You need a theory of *when* the cognitive scaffold can be removed.
  *   **Tractability:** Medium. This bridges conceptual analysis and educational theory. It requires defining "expertise" in terms of internalized generative models. It is tractable for a small team if focused on developing a heuristic model rather than empirical validation across all disciplines.
  *   **Neglect:** High. Most policies are binary (ban or allow). Few propose a developmental trajectory for AI use.
  *   **Policy Deliverable:** A "Curricular Traffic Light" system. Green (allowed) for advanced synthesis, Yellow (restricted) for drafting, Red (forbidden) for foundational skill acquisition.

  ### II. Questions to Decline

  To stay within your runway and scope, you must explicitly decline three fashionable lines of inquiry.

  **1. AI Detection and Forensics (Decline: Overrated)**
  *   **Reasoning:** This is an empirical arms race, not a conceptual problem. Detection rates are inherently probabilistic and will fluctuate with model updates. Basing university policy on the *possibility* of detection is epistemically unsound; policy should rest on the *pedagogical value* of the work, not the detectability of the tool.
  *   **Verdict:** Overrated. It distracts from the core question of whether the student learned anything.

  **2. The Moral Status of AI Systems (Decline: Premature)**
  *   **Reasoning:** Whether the AI is a moral patient or has rights does not change the epistemic labor structure of the student. For the purpose of coursework policy, the AI is a tool or a source of testimony. Debating its sentience consumes resources without yielding actionable guidance on plagiarism or learning outcomes.
  *   **Verdict:** Premature. It is irrelevant to the specific brief of rewriting coursework rules.

  **3. Disciplinary Bias in AI Outputs (Decline: Out of Scope)**
  *   **Reasoning:** While crucial for social justice, this is a distinct problem from the *structure of epistemic labor*. Your frame is about the relationship between the knower and the knowing process. Bias is about the *content* of the output. Tackling bias requires large-scale empirical auditing of models, which exceeds your capacity.
  *   **Verdict:** Out of Scope. Stick to the epistemology of outsourcing, not the sociology of the training data.

  ### III. Triggers for Re-ordering

  Your agenda is a hypothesis. Over the next three years, specific evidence or arguments should cause you to pivot.

  **Move Question #1 (Dependency) Down if:**
  *   **Evidence:** Robust demonstration that "verification-only" training produces students who can reliably identify errors in AI output indistinguishable from those who can generate the output themselves.
  *   **Argument:** A compelling philosophical distinction showing that verification relies on pattern recognition (perceptual) while generation relies on synthesis (motor/planning), proving they are modular faculties.
  *   *Impact:* If verification survives without generation, the urgency for "unassisted zones" drops. Policy shifts toward universal allowance with disclosure.

  **Move Question #2 (Categorization) Up if:**
  *   **Evidence:** Legal or administrative rulings classify AI output as distinct from both "tool" and "testimony," creating a new liability category.
  *   **Argument:** A demonstration that LLMs function as "aggregators of testimony" rather than generators of new claims, forcing a collapse of the Generative/Deferential distinction.
  *   *Impact:* This would force an immediate rewrite of citation policies, taking precedence over curricular sequencing.

  **Move Question #3 (Sequencing) Down if:**
  *   **Evidence:** Data showing that early exposure to generative tools *accelerates* the acquisition of generation competence (the "scaffold" effect) rather than atrophying it.
  *   **Argument:** A shift in educational theory suggesting that "generation" is no longer a core human competency required for verification in the professional world.
  *   *Impact:* If the goal of education shifts from building internal competence to managing external tools, the "Traffic Light" system becomes obsolete; the curriculum becomes entirely tool-integrated.

  ### Summary Advice

  Your center's unique value is not in predicting the future of AI, but in clarifying the *structure of knowing* in an AI-saturated environment. Do not try to measure how much AI students use; measure what happens to their ability to judge truth when they stop producing it.

  Focus your four postdocs on the **Dependency Thesis**. If you prove that verification collapses without generation, you provide the funder with the justification for restrictive policies. If you disprove it, you provide the justification for liberalization. Either way, you solve the upstream problem that currently paralyzes university committees. Leave the detection software to the vendors and the existential risk to the think tanks. Your job is to save the concept of the student.
