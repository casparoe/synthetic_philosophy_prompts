  7.  **Final Polish:** Ensure the tone matches the user's (professional, direct, no fluff). Avoid listing books. Focus on the *mechanics* of the analogy. (Self-Correction: Make sure to explicitly mention Tainter's definition vs. the ecological definition).

  8.  *(Final check against constraints)*: Did I use their lake analogy? Yes. Did I avoid book lists? Yes. Did I address the three specific problems? Yes.

  **(Self-Correction during drafting):** I need to be careful not to say "Societies are exactly like lakes." They are *complex adaptive systems*, which lakes are too, but societies have *agency* and *memory*. I need to highlight where the analogy *costs* something. The cost is ignoring human intentionality.

  Let's structure the response around the three "walls" the user hit.

  *   **Wall 1: Identity.** The system is the *organization*, not the *components*.
  *   **Wall 2: Time.** The signal is the *structure*, not the *population*.
