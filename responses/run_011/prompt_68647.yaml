      *   **Problem 2: Temporal Resolution (The Signor-Lipps Problem)**
          *   *Lake:* Cores have resolution limits, but we can often get decadal/annual varves.
          *   *Archaeology:* Resolution is often centennial. "Abrupt" might be 50 years (2 generations) or 200 years.
          *   *Key Insight:* In systems theory, "abrupt" is relative to the system's internal feedback loops, not just the clock. If the feedback loops break faster than they can adapt, it's a collapse, even if it takes 50 years.
          *   *Nuance:* The Signor-Lipps effect is real, but "collapse" is often a *structural* break, not just a disappearance. The *capacity* to record time (monuments) stops, which creates the appearance of suddenness.

