      *   *Joint 2: The Hysteresis Loop.* In lakes, cutting P doesn't fix it immediately. In societies, "recovery" isn't returning to the old state (Classic Maya), it's establishing a new one (Post-Classic). The hysteresis is institutional memory loss.
      *   *Joint 3: The Observer Effect.* The "collapse" is often visible only because the *recording mechanism* (monuments) was part of the thing that collapsed. This is a sampling bias unique to complex societies.

