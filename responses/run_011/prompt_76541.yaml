answer: |-
  # PROTOCOL FOR EPISTEMIC HYGIENE IN JURY DELIBERATIONS
  **To:** The Jury
  **From:** The Chair
  **Re:** Procedure for Adjudication and Citation

  This document governs how we convert private reading experiences into public awards. It acknowledges that our collective reading time is exhausted before the shortlist is finalized. It treats aesthetic testimony not as a substitute for reading, but as a constrained resource with specific validity conditions.

  ### 1. Typology of Reports
  Jurors will submit reports using one of the following categories. Each carries specific epistemic weight.

  *   **Type 1: Bare Verdict** ("This is good/bad.")
      *   *Usage:* Triage only. Cannot justify inclusion or exclusion.
      *   *Weight:* Null.
  *   **Type 2: Verdict + Identified Features** ("Good, because the pacing in chapter 3...")
      *   *Usage:* Can justify Exclusion. Cannot justify Inclusion.
      *   *Weight:* Low. Features may be accurate without the aesthetic effect following.
  *   **Type 3: Verdict + Phenomenology** ("I felt bored at page 50," or "I was held despite the difficulty.")
      *   *Usage:* Can justify Exclusion. Can support Inclusion *only* if corroborated by acquaintance.
      *   *Weight:* Medium. Transfers the *effect* of reading, if not the object.
  *   **Type 4: Verdict + Comparison** ("Like Early Smith, but without the irony.")
      *   *Usage:* Triage only. Depends on shared canon which we lack.
      *   *Weight:* Low/Medium. High risk of misinterpretation.
  *   **Type 5: Relay** ("Juror X told me...")
      *   *Usage:* None.
      *   *Weight:* Null. Degraded signal.
  *   **Type 6: Buzz** ("People at the festival say...")
      *   *Usage:* Triage for Acquaintance Budget only.
      *   *Weight:* Null for judgment.

  ### 2. Weighting Competence and Candour
  We have no shared canon to verify competence. We assess it internally.

  *   **Competence:** Assessed by the correlation between a juror's Type 2/3 reports and the Chair's subsequent acquaintance with those texts.
  *   **Candour:** Assessed by the admission of uncertainty, boredom, or failure to finish. A report that admits "I stopped because it bored me" is weighted higher than "This is objectively bad."
  *   **The Circularity:** We judge competence by how much we agree with them. This is circular. We accept this circularity as a necessary fiction to allow the jury to function.
      *   *[JUDGMENT WEARING PROCEDURAL COSTUME]:* We treat "agreement" as "competence" not because it is epistemically sound, but because it is the only metric available to a closed group.

  ### 3. Inclusion/Exclusion Asymmetry
  This procedure adopts a **Norm-Based Pessimism**.

  *   **Exclusion (Optimism about Negative Testimony):** Testimony *can* license setting a book aside.
      *   *Rationale:* It is not a violation of aesthetic agency to defer to a warning that a work is a waste of time. The norm of efficiency overrides the norm of acquaintance for negative judgments.
      *   *Rule:* Two Type 3 reports (Phenomenology) of failure from trusted jurors license exclusion without further reading.
  *   **Inclusion (Pessimism about Positive Testimony):** Testimony *cannot* license putting a book on the shortlist.
      *   *Rationale:* Claiming merit for a work one has not experienced violates the norm of aesthetic agency. Justification is unavailable via testimony.
      *   *Rule:* A book enters the shortlist *only* if at least one juror has completed it (Acquaintance).
      *   *Alternative Assumption:* If we assumed Unavailability (it is impossible to know merit without reading), the rule would be identical. If we assumed Optimism (testimony conveys justification), the rule would allow shortlisting based on three Type 2 reports. We reject Optimism to preserve the integrity of the prize.

  ### 4. Acquaintance Budget
  Strict view: Acquaintance is the only currency for Inclusion.
  **Resource:** Chair's remaining 11 hours.
  **Triage Rule:**
  1.  **Conflicts:** Books where reports contradict (e.g., one "cold," one "admirable"). Priority 1.
  2.  **Buzz:** Books with high external Type 6 reports. Priority 2.
  3.  **Trusted Recs:** Books with strong Type 3 reports from high-competence jurors. Priority 3.

  **Budget Exhaustion:**
  *   When the 11 hours are gone, no new books may be shortlisted unless they have already been completed by a juror other than the Chair.
  *   *[ARBITRARY THRESHOLD]:* The 11-hour limit is rhetorical. It marks the point where the Chair's agency is exhausted.
  *   **Record:** If the budget runs out and a book has no Acquaintance (no juror finished it), it must be recorded as "Unverified." It cannot be shortlisted.

  ### 5. Stopping Rules and Hand-offs
  *   **Terminate in Decision:** When a book has Acquaintance (1+ completions) and no active Type 3 Defeaters from other completers.
  *   **Terminate in "Read It":** When a book has strong positive Type 3 reports but no Acquaintance. The Chair must read it or it dies.
  *   **Hand-off to Vote:** When multiple books meet the Decision criteria for the final slot.
  *   **Hand-off to Chair:** When the choice depends on the *mission* of the prize (e.g., "debut vs. career," "risk vs. polish") rather than aesthetic merit. This is not an aesthetic judgment but a curatorial one.
      *   *[JUDGMENT WEARING PROCEDURAL COSTUME]:* Distinguishing "merit" from "mission" is often impossible. We mark this hand-off to acknowledge that the procedure cannot resolve value conflicts.

  ### 6. Output Discipline
  The Citation is a public assertion of collective judgment.
  *   **Rule:** The citation may not use the plural "We" regarding the *quality* of a work unless at least three jurors have completed it.
  *   **Phrasing:** For works read by fewer than three:
      *   Do not say: "We found this book to be..."
      *   Say: "This book offers..." or "The author achieves..." (Focus on the object, not the jury's experience).
  *   **Reliance:** Do not mark reliance with disclaimers ("One of us read..."). Mark it by avoiding claims of collective discovery.
  *   *[ARBITRARY THRESHOLD]:* The "three juror" rule for using "We" is arbitrary. It serves to simulate consensus where none exists.

  ***

  ### LIMITATIONS STATEMENT
  This procedure cannot guarantee that the best book wins. It cannot guarantee that the jury knows what they are talking about. It guarantees only that the jury does not claim knowledge it does not possess. It protects the prize from fraud, not from error.

  ***

  ### ONE-PAGE SUMMARY FOR JURORS
  **Keep this beside you when writing reports.**

  1.  **Be Specific:** "It bored me" is better than "It is bad." (Type 3 > Type 1).
  2.  **Admit Failure:** If you didn't finish, say so. "Stopped at page 40" is a valid report.
  3.  **Inclusion Rule:** A book needs one finisher to be shortlisted. Testimony alone is not enough.
  4.  **Exclusion Rule:** Two reports of "waste of time" kill a book.
  5.  **Citation:** If you haven't read the winner, do not claim "We chose this because..." in public.
  6.  **Budget:** The Chair has 11 hours left. Conflicts get read first. Buzz gets read second.
  7.  **Circularity:** We trust those we agree with. Accept this.

  ***

  # APPLICATION TO CURRENT CASES

  ### Case A: The Inert Novel
  *   **Status:** 3 jurors assigned. 2 read partial (60pp, 100pp). Reports: "Fluent but inert." 1 unopened. Length: 400pp.
  *   **Procedure Application:**
      *   **Report Type:** Type 3 (Verdict + Phenomenology: "inert," "no reason to continue").
      *   **Exclusion Rule:** Section 3 allows exclusion via testimony. Two Type 3 reports of failure license exclusion.
      *   **Acquaintance:** None (no one finished).
      *   **Decision:** **Excluded.**
      *   **Authority:** Collective negative testimony. The norm of efficiency permits deferring to the judgment that the book is a waste of time. No juror is required to suffer the remaining 300 pages to confirm the boredom.
      *   **Note:** The unopened juror's assignment is voided.

  ### Case B: The Chair's Favorite
  *   **Status:** Chair read twice (Acquaintance). Juror 1 finished ("Admirable but cold"). Juror 2 DNF page 40 ("Self-indulgent"). No reading time left.
  *   **Procedure Application:**
      *   **Shortlist Eligibility:** Section 3 requires Acquaintance for Inclusion. Chair has Acquaintance. **It may be shortlisted.**
      *   **Winner Eligibility:** Section 5 (Stopping Rules) implies a Winner requires "No active Type 3 Defeaters from other completers." Juror 1 completed the text and offered a Type 3 Defeater ("Cold" implies a failure of engagement, distinct from the Chair's experience). Juror 2 offered a Type 3 Defeater ("Self-indulgent").
      *   **Budget:** Chair cannot re-assign or re-read to persuade. Budget exhausted.
      *   **Decision:** **Shortlisted, but cannot Win.**
      *   **Rationale:** While the Chair has the epistemic authority to include (via Acquaintance), the Prize is a collective assertion. A completed negative reading by a trusted juror acts as an epistemic defeater that testimony cannot override without further deliberation time (which does not exist). To award the prize would require the jury to assert a consensus on merit that is demonstrably absent among those who finished the text.
      *   **Citation:** If it were to win (violating the procedure for the sake of argument), the citation could not say "We found this moving." It would have to say "This book demands..." However, under the strict procedure: **The book is barred from winning.** The view bites here: Your personal aesthetic certainty is insufficient to override the collective epistemic constraint of the prize structure.

  ### Case C: The Festival Buzz
  *   **Status:** External buzz ("Extraordinary"). One juror reports this (Type 6). Juror read Chapter 1 only.
  *   **Procedure Application:**
      *   **Report Type:** Type 6 (Buzz). Weight: Null for judgment.
      *   **Triage:** Section 4 (Acquaintance Budget). Buzz places the book in Priority 2 for the Chair's remaining 11 hours.
      *   **Decision:**
          *   If Chair reads it and likes it: **Shortlist eligible.**
          *   If Chair reads it and dislikes it: **Excluded.**
          *   If Chair *does not* read it (Budget runs out): **Excluded.**
      *   **Rationale:** Testimony from outside the jury (Type 6) carries no weight for Inclusion (Section 3). It functions only as a flag for the allocation of the Acquaintance Budget. Without Chair Acquaintance or a Juror Completion, it cannot enter the shortlist. The "extraordinary" claim is epistemically inert until verified by a jury member's completion.
