answer: |-
  ### 1. Exercise Handout

  **Internal Engineering Exercise: Aggregation & Independence**
  **Time Limit:** 90 Minutes
  **Context:** Trust & Safety / Evals Team

  **Scenario**
  Our release-risk panel currently consists of 9 engineers. From two years of logged decisions, an individual engineer voting alone, before seeing anyone else's call, correctly predicts whether a candidate release will cause a user-visible incident **67.5%** of the time.

  Leadership wants to grow the panel to 400 people across the org because "the Condorcet Jury Theorem says the error rate goes to basically zero."

  The catch: every panelist reads the **same** auto-generated risk summary (one model, one prompt) before voting. An audit of this summary provides the following conditional probabilities:
  *   The summary is correct **70%** of the time.
  *   When the summary is **correct**, an individual panelist is correct **90%** of the time.
  *   When the summary is **wrong**, an individual panelist is correct only **15%** of the time.

  **Part A: The Current Proposal (40 points)**
  1.  Verify that the historical marginal accuracy (67.5%) is consistent with the audit's conditional numbers.
  2.  According to the naive Condorcet Jury Theorem (using only the marginal 67.5%), what accuracy does a 400-person panel converge to?
  3.  Using the audit's conditional structure, what accuracy does the 400-person panel *actually* converge to? (You may approximate probabilities $>99\%$ as 1 and $<1\%$ as 0 for the majority vote calculation).
  4.  Briefly explain why the two answers differ. Is the 9-person panel already near the ceiling under the audit model?

  **Part B: The Degenerate Case (30 points)**
  Leadership proposes a cheaper summary model. The new audit numbers are:
  *   Summary correct: **45%**.
  *   Individual correct | Summary correct: **90%**.
  *   Individual correct | Summary wrong: **25%**.

  1.  Calculate the new marginal individual competence.
  2.  Calculate the large-panel (400-person) accuracy limit under this new model.
  3.  In plain English: Does scaling the panel help or hurt compared to a single individual? Why?

  **Part C: Process Design (30 points)**
  1.  Propose one concrete change to the voting process that would allow us to honestly appeal to the Condorcet Jury Theorem (i.e., restore the conditions required for the theorem to hold).
  2.  We cannot run A/B tests easily. Describe how you would use *existing* logged vote data to empirically test whether your change successfully reduced correlation between voters. Be specific about what you would measure.

  ***

  ### 2. Model Answer

  **Part A: The Current Proposal**
  First, we verify the marginal accuracy using the Law of Total Probability. Let $S$ be the event the Summary is correct, and $V$ be the event a Voter is correct.
  $$P(V) = P(V|S)P(S) + P(V|\neg S)P(\neg S)$$
  $$P(V) = (0.90 \times 0.70) + (0.15 \times 0.30) = 0.63 + 0.045 = 0.675$$
  This matches the historical 67.5% figure exactly.

  **Naive Condorcet Prediction:** The theorem assumes independent voters with $p > 0.5$. Here $p = 0.675$. As $n \to 400$, the probability of the majority being correct converges to **1.0 (100%)**.

  **Actual Convergence:** The voters are not independent; they are conditionally independent given the Summary. As $n \to \infty$, the majority vote will perfectly reflect the conditional probability of the group.
  *   If $S$ is Correct (70% chance): Voters have $p=0.9$. Majority will be Correct (prob $\approx 1$).
  *   If $S$ is Wrong (30% chance): Voters have $p=0.15$. Majority will be Wrong (prob $\approx 1$).
  *   System Accuracy $\approx P(S) \times 1 + P(\neg S) \times 0 = \mathbf{0.70}$ **(70%)**.

  **Divergence & 9-Person Ceiling:** The answers differ because the naive theorem assumes *unconditional* independence. Here, the shared summary creates a common mode of failure. When the summary fails, the crowd fails together. The 9-person panel is already near the 70% ceiling because the bottleneck is the summary, not the voter count. Increasing $n$ yields diminishing returns after the majority reliably follows the summary signal.

  **Part B: The Degenerate Case**
  **New Marginal:**
  $$P(V) = (0.90 \times 0.45) + (0.25 \times 0.55) = 0.405 + 0.1375 = \mathbf{0.5425}$$
  Individually, voters are still better than random (54.25%).

  **New Large-Panel Limit:**
  *   If $S$ is Correct (45% chance): Voters $p=0.9$. Majority Correct.
  *   If $S$ is Wrong (55% chance): Voters $p=0.25$. Majority Wrong (since $0.25 < 0.5$).
  *   System Accuracy $\approx 0.45 \times 1 + 0.55 \times 0 = \mathbf{0.45}$ **(45%)**.

  **Implication:** Scaling the panel **hurts** performance. A single individual is right 54.25% of the time. A 400-person panel is right only 45% of the time. By aggregating correlated voters who are worse than random when the signal is bad, we amplify the signal's errors. The "just add more voters" advice is dangerous here; it creates confident wrongness.

  **Part C: Process Design**
  **Concrete Change:** To restore independence, panelists must not share a single point of failure. We should assign **different summary models** or **randomized prompts** to each voter, or require a "blind" initial vote before exposing the summary. Ideally, partition the 400 voters into groups that see different evidence streams.

  **Empirical Test:** To test independence from logs, calculate the **residual correlation** of votes conditional on the ground truth (or summary correctness).
  1.  Filter logs for cases where the Summary was Wrong.
  2.  Compute the pairwise agreement rate between voters on these cases.
  3.  If voters are independent, agreement should match random chance (given their marginal $p$). If they agree significantly more often than chance predicts when the summary is wrong, correlation persists.
  4.  Metric: Cohen's Kappa or simple correlation coefficient of vote vectors, stratified by Summary Correctness. A successful intervention reduces this correlation toward zero.

  ***

  ### 3. Marking Scheme (Total 30 Points)

  **Part A: The Current Proposal (10 Points)**
  *   **Marginal Verification (2 pts):** Correctly computes $0.675$ from conditionals. Deduct 2 if they just assert consistency without math.
  *   **Naive Limit (2 pts):** States convergence to 1.0 (or ~100%).
  *   **Actual Limit (4 pts):** States convergence to 0.70 (70%). Must show logic: Limit = $P(S_{correct})$.
      *   *Critical Error:* If they claim the limit is 1.0 despite the correlation, score 0 for this section.
  *   **Explanation (2 pts):** Identifies "shared signal" or "violated independence" as the cause. Mentions 9-person panel is already near ceiling (since $n=9$ is enough to lock in the 0.9/0.15 split).

  **Part B: The Degenerate Case (10 Points)**
  *   **New Marginal (2 pts):** Correctly computes 0.5425.
  *   **New Limit (4 pts):** States convergence to 0.45.
      *   *Critical Error:* If they claim limit is 1.0 because $0.5425 > 0.5$, score 0 for this section (this is the cargo-cult trap).
  *   **Implication (4 pts):** Explicitly states scaling *reduces* accuracy (54% $\to$ 45%). Explains that the crowd amplifies the summary error because $p < 0.5$ in the error state.

  **Part C: Process Design (10 Points)**
  *   **Intervention (4 pts):** Proposes breaking the common signal (e.g., different prompts, blind voting, multiple models). Vague answers like "improve the model" get 1 pt.
  *   **Measurement (6 pts):** Describes testing correlation *conditional on the signal*.
      *   **Top Score (6):** Specific metric (e.g., pairwise agreement when summary is wrong). Mentions stratifying by summary correctness.
      *   **Mid Score (3):** Suggests measuring agreement but fails to condition on the summary (confounds signal quality with correlation).
      *   **Low Score (0):** Suggests A/B testing only or measuring overall accuracy without analyzing vote structure.

  **Competent-vs-Top Differentiation:**
  *   **Competent (20/30):** Gets the arithmetic right in A and B. Identifies independence violation. Proposes "better models" in C.
  *   **Top (28-30/30):** Explicitly notes the 9-person panel is already saturated in A. In B, clearly articulates the "confidently wrong" risk. In C, specifies *conditional* correlation metrics for measurement.

  ***

  ### 4. Note to Staff Engineer (Philosophy & Consistency)

  **1. Arithmetic Consistency Fix:**
  In your original prompt, the marginal was **68%**, but the audit math ($0.7 \times 0.9 + 0.3 \times 0.15$) yields **67.5%**. I adjusted the handout to **67.5%** to ensure the candidate doesn't waste time wondering if they should use the historical number or the calculated number. If you prefer to keep 68%, expect candidates to note the discrepancy; award credit for noticing it, but insist they use the calculated 67.5% for the conditional model to remain mathematically sound.

  **2. Defensible Disagreements (Do Not Penalize):**
  *   **The "9-Person" Calculation:** I allowed approximations ($>99\% \approx 1$) in the handout. If a candidate computes the exact binomial sum for $n=9$ and finds it's 69.8% rather than 70%, do not penalize. The crux is the *limit*, not the binomial tail.
  *   **Independence Definitions:** A candidate might argue that "conditional independence given the summary" is sufficient for a *different* theorem (e.g., hierarchical Bayesian aggregation). As long as they acknowledge the standard CJT (unconditional independence) is violated, they pass.
  *   **Loss Functions:** A strong candidate might argue in Part C that "Accuracy" is the wrong metric for Release Risk (False Negatives might be costlier than False Positives). If they pivot to "We should optimize for Recall" but still solve the correlation math correctly, award full marks. This shows senior-level context awareness.

  **3. The "Nasty" Result in Part B:**
  The arithmetic in Part B is designed to show that $p_{marginal} > 0.5$ does *not* guarantee safety if correlation exists. Specifically, because $P(V|\neg S) = 0.25$ (worse than random), the majority vote *inverts* the truth when the summary is wrong. This is the key takeaway: **Correlated noise does not average out; it compounds.** Ensure your team discusses this specific mechanism during the debrief.
