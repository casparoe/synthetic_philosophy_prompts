answer: |-
  Bottom line: The analogy is pedagogically useful but structurally misleading. It excuses the method's flaws by blaming human error, whereas the method itself incentivises those errors.

  **Correspondences**
  *   **Null Hypothesis:** Defendant (presumed innocent).
  *   **Alternative:** Prosecution's claim.
  *   **Data:** Evidence.
  *   **Researcher:** Prosecution (bringing charges).
  *   **Readers/Community:** Jury (delivering verdict).
  *   **Alpha ($\alpha$):** Standard of proof ('beyond reasonable doubt').

  **Where it Breaks**
  1.  **Setting the Standard:** Juries inherit a fixed standard set by society; researchers arbitrarily set $\alpha$ (usually 0.05). This matters: it allows lowering the bar to secure conviction.
  2.  **Retrials:** Law prohibits double jeopardy; science requires replication. Treating a single p-value as a final verdict causes the crisis.
  3.  **Reality:** Defendants are truly innocent or guilty. In nature, exact null effects are rarely true; the question is usually magnitude, not existence.

  **Does it Matter?**
  Yes. Your regular claims the crisis is merely overclaiming, fixed by jury-like rhetoric. But the analogy hides *p-hacking*. If a prosecutor can run multiple trials until one sticks, the 'jury' is compromised. The method allows researchers to act as prosecutor and judge of evidence quality simultaneously. Rhetoric won't fix structural incentives that allow evidence shopping.

  **Better Analogy**
  Think of a **smoke alarm**. The null is 'no fire'. A significant result is the alarm ringing. At $\alpha=0.05$, it false-alarms 1 in 20 times even with no fire. Replication isn't a retrial; it's checking if other alarms also ring. This removes moral baggage ('guilt') and highlights error rates. It clarifies that a silent alarm doesn't prove safety, only a lack of detected smoke. Unlike the courtroom, this acknowledges that the detection system itself has a known failure rate built into its design.
