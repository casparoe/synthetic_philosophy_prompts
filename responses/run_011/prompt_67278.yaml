      *   *Breaks:*
          1.  **Setting $\alpha$:** Juries don't choose 'reasonable doubt'; researchers pick 0.05. This matters because it allows gaming.
          2.  **Double Jeopardy:** Law forbids retrials; science demands them. The crisis stems from treating one 'trial' as verdict.
          3.  **Truth:** Defendants are actually innocent or guilty; point nulls are almost always false.
      *   *Verdict on Argument:* The breaks matter. The crisis isn't just rhetoric; it's structural. P-hacking is like gathering evidence until you get a conviction, which juries shouldn't allow.
      *   *Better Analogy:* A **security alarm**. $H_0$ = No intruder. Alarm ringing = Significant result. False positives happen (5% of the time if $\alpha$=0.05). Replication is checking if the alarm keeps ringing. It removes moral weight, focuses on error rates.

  6.  **Refining and Editing (Word Count & British English):**
