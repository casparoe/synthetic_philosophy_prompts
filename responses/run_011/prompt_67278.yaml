prompt: |-
  I run a small stats-and-philosophy reading group at the library — plumber by trade, just curious. One of our regulars keeps saying hypothesis testing is a criminal trial: the null is the defendant, presumed innocent; the data is the evidence; and a non-significant result is only "not proven", never "innocent". He uses that to argue the replication crisis was never about the method itself, just people overclaiming, and that if everyone talked like a jury there'd be no problem left. Can you audit the analogy for me? I want the correspondances laid out — who's the jury, who's the prosecution, what plays the role of the standard of proof and who gets to set it — then where the mapping breaks, and which of those breaks actually matter for his arguement versus which are just decoration. In particular I can't see what alpha corresponds to, since a jury doesn't get to choose how convincing the evidence has to be, and I don't see where a retrial fits. If there's a better analogy for what the test is really doing, say what it is and why it carries less baggage. Bottom line first, then the detail, and please keep the whole thing under 400 words, in British English.
