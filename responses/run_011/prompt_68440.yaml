      *   **Goal:** Identify internal tensions/conflicts, order by severity, propose repairs, and assess costs. Identify false alarms (pairs that look problematic but aren't).
      *   **Constraints:** No lecture, no reading list/bibliography, ~1000 words, dense assessment. Do not assume any item is expendable in advance.
      *   **Audience:** The user is knowledgeable ("I know the literature well enough"). Participants include contractualists, Taurek sympathizers, and framing skeptics.
      *   **Input:** 7 specific commitments.

  2.  **Analyze the Package (7 Items):**
      *   (1) Save 5 over 1 in Taurek cases (reject coin flip). Reason: Treating 5 as 0 is disrespectful.
      *   (2) Justification for (1) is *complaints-first, strictly pairwise*. No adding complaints. No impersonal totals.
      *   (3) No harms too trivial to enter deliberation. No sharp cutoffs between aggregatable/non-aggregatable harms.
      *   (4) No number of mild harms (headaches) outweighs one death/torture. (Non-aggregation for large gaps).
      *   (5) Reductionist about personal identity. Boundaries between persons are less deep than common sense.
      *   (6) Intrapersonal aggregation is unproblematic (unity of a single life). Intepersonal needs justification.
      *   (7) Special obligation to daughter (partiality) allowed without greater good justification. Public health authority should aggregate impersonally (QALYs).

  3.  **Identify Tensions/Conflicts:**

      *   **Tension A: (2) vs. (1).**
          *   (2) says justification is *strictly pairwise* comparison of strongest complaints. No adding.
          *   (1) says save 5 over 1.
          *   *Problem:* In a strict pairwise comparison (Scanlon-style), if each of the 5 has a complaint equal to the 1, how does the 5 win without aggregating? Usually, pairwise comparison leads to Tie -> Coin Flip (Taurek) or requires a "relevant difference" principle. If I compare Person A (group of 5) vs Person B (group of 1), A's complaint is death, B's complaint is death. Tie. To save 5 based on (2), one usually needs to argue that the *strength* of the complaint changes based on numbers (which sounds like aggregation) or that the complaint against *not saving the 5* is stronger than against *not saving the 1* because more people have it. But (2) says "never add complaints together."
          *   *Severity:* High. This is the core contractualist puzzle (Scanlon's "Why Numbers Count?"). If you forbid adding complaints, it's hard to get (1) without smuggling in aggregation.
          *   *Repair:* Weaken (2) to allow "counting claims" without "summing welfare." Or weaken (1) to accept a weighted lottery.
          *   *Cost:* Weakening (2) moves toward utilitarianism/impersonal totals. Weakening (1) alienates the anti-Taurek intuition.

      *   **Tension B: (3) vs. (4).**
          *   (3) No harms too trivial to enter deliberation. No sharp cutoffs.
          *   (4) No number of mild harms outweighs death.
          *   *Problem:* This is the "Continuum Problem" or "Sorites" issue. If headaches count (3), and there's no sharp cutoff (3), then at some point $N$ headaches must outweigh death. But (4) says *no* number does. This is a direct contradiction unless there's a non-linear scaling function that asymptotes below death, but (3) rejects sharp cutoffs between harms that *can* be outweighed and those that *cannot*.
          *   *Severity:* High. Logical contradiction regarding aggregation thresholds.
          *   *Repair:* Accept a soft cutoff (vagueness) or admit some trivial harms don't count (violate 3). Or accept that enough headaches *do* outweigh death (violate 4).
          *   *Cost:* Violating (3) introduces the sharp cutoff you rejected. Violating (4) accepts "tyranny of aggregation."

      *   **Tension C: (5) vs. (6) vs. (2).**
          *   (5) Personal boundaries are not deep (reductionism).
          *   (6) Intrapersonal is unproblematic due to unity of life; Interpersonal needs justification.
          *   (2) Strictly pairwise interpersonal comparison.
          *   *Problem:* If (5) is true (boundaries not deep), why is (6) true (intrapersonal vs interpersonal distinction robust)? Reductionism usually undermines the moral significance of the person-boundary, suggesting interpersonal aggregation should be *easier* (like intrapersonal), not harder. (6) uses the unity of a life to justify intrapersonal aggregation, but (5) says that unity is less deep than assumed.
          *   *Severity:* Medium/High. Metaphysical view undermines moral distinction.
          *   *Repair:* Decouple metaphysics from morality. Claim moral status supervenes on something else.
          *   *Cost:* Makes (5) rhetorically idle or requires explaining why shallow boundaries still block aggregation.

      *   **Tension D: (7) vs. (2) & (1).**
          *   (7) Save daughter over 5 strangers (partiality). Public health aggregates impersonally.
          *   (2) Justification is pairwise complaints.
          *   *Problem:* (7) implies two distinct moral modes: personal vs. institutional. (2) claims a general justification for rescue cases. Does (2) apply to the daughter case? If I save my daughter, am I ignoring the stronger pairwise complaints of the 5 strangers? If (2) is universal, partiality is hard to justify without appealing to "greater good" (which 7 rejects) or special obligations (which might violate pairwise equality).
          *   *Severity:* Medium. Role differentiation is common but needs handling within a pairwise framework.
          *   *Repair:* Specify (2) applies only to impartial rescue contexts.
          *   *Cost:* Limits the scope of the theory.

      *   **False Alarm Check:**
          *   (1) vs (7): Partiality vs. Saving 5. Usually handled by agent-relative permissions. Not necessarily inconsistent if domains are separated.
          *   (5) vs (7): Reductionism doesn't necessarily kill partiality (Parfit style).

  4.  **Drafting the Audit:**

      *   *Structure:* Order by severity. Identify pairs. Propose repair/cost. Note false alarms. Single revision opportunity.
      *   *Tone:* Dense, direct, no fluff.
      *   *Word Count:* Aim for ~1000.

      *   *Refining Tension A (1 vs 2):* This is the "Scanlonian Dilemma." If complaints are pairwise and not added, why does the group of 5 win? Scanlon argues the principle rejecting saving 5 is unreasonable because it ignores the greater number of people who could reject it. But this looks like counting. If you strictly forbid adding, you struggle to get (1).
      *   *Refining Tension B (3 vs 4):* This is the "Non-Aggregationist's Sorites." If headaches count and there's no cutoff, transitivity suggests enough headaches > death. (4) denies this. (3) denies the mechanism (cutoff) that usually saves (4).
      *   *Refining Tension C (5 vs 6):* Reductionism typically supports aggregation (boundaries don't matter). Using reductionism while insisting on the interpersonal/intrapersonal divide (6) is unstable.

      *   *Single Revision:* Modifying (2) to allow "counting persons" without "summing welfare" might help (1) and (7) but hurts the strict pairwise claim. Modifying (5) helps (6).

      *   *False Alarm:* (7) vs (1)/(2). Institutional vs. Personal morality is a standard move (Williams/Scheffler). Can be coherently held if the theory is dualistic.

  5.  **Writing - Section by Section:**

      *   *Intro:* Acknowledge the task.
      *   *Severity 1: (3) vs (4).* The Sorites problem. Direct contradiction.
      *   *Severity 2: (1) vs (2).* The Contractualist Counting problem. How to save 5 without adding?
      *   *Severity 3: (5) vs (6).* Metaphysics vs. Moral Structure.
      *   *False Alarm:* (7) vs others.
      *   *Single Revision:* Adjusting (2).

      *   *Drafting content:*
          *   (3)/(4): If headaches enter deliberation (3) and no sharp cutoff exists (3), then by transitivity, sufficient headaches outweigh death. (4) denies this. To fix: Accept a vague threshold (weakens 3's "no sharp cutoff" claim) or accept aggregation for extreme numbers (weakens 4). Cost: Either admits arbitrariness or utilitarianism.
          *   (1)/(2): Pairwise comparison of equal claims yields a tie. To save 5, you must count claims. But (2) forbids adding complaints. Scanlon's solution ("reasonable rejection") smuggles in numbers. To fix: Allow counting claim-holders without summing welfare. Cost: Moves away from strict pairwise complaint strength toward a hybrid view.
          *   (5)/(6): If boundaries are shallow (5), the moral difference between intra/interpersonal (6) loses its metaphysical grounding. Why is trade-off easy within a "shallow" boundary but hard across it? To fix: Argue moral boundaries persist despite metaphysical reductionism. Cost: Makes (5) less relevant to ethics.
          *   (7): Looks okay as a dualism (personal vs. institutional).
          *   *Unified Fix:* Weaken (2). Allow "numbers count" as a procedural constraint rather than welfare summation. This helps (1) and potentially (7) (institutional counting). But it stresses (4) if numbers can override severity.

      *   *Review against constraints:* No bibliography. Dense. ~1000 words. Audit focus.

      *   *Self-Correction on (1) vs (2):* Need to be precise. Scanlon says you compare principles. A principle that says "save 1" is rejectable by 5. A principle "save 5" is rejectable by 1. The strength of rejection depends on numbers. This *is* a form of aggregation, just not utilitarian summation. If (2) means "no aggregation of any kind," (1) is impossible. If (2) means "no utilitarian summation," (1) is possible. I need to highlight this ambiguity as the pressure point.

