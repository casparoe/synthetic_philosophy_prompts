answer: |-
  Here is a decision tree built from conversational questions your characters can throw at each other across a kitchen table. It is designed to force them into distinct corners.

  ### The Decision Tree

  **Node 1:** If you never wake up to feel the loss, did anything bad actually happen *to you*?
  *   **Yes (Nothing bad happened):** Go to Node 2.
  *   **No (Something bad happened):** Go to Node 3.

  **Node 2:** Is the reason nothing bad happened because "you" are gone, or because "you" were never really one single thing to begin with?
  *   **"You" are gone:** **Leaf A: Death is no harm to the dead at all.** (The Epicurean: You aren't there to be harmed.)
  *   **"You" were never single:** **Leaf B: Death is less of a catastrophe than we assume because the self isn't what we take it to be.** (The Reductionist: There was no solid "you" to lose.)

  **Node 3:** Is the tragedy that you don't get *more* life, or that the life you had gets *spoiled*?
  *   **Don't get more:** Go to Node 4.
  *   **Life gets spoiled:** Go to Node 6.

  **Node 4:** Is the loss about *your* desires, or about *life's* possibilities?
  *   **Your desires:** Go to Node 5.
  *   **Life's possibilities:** **Leaf C: Death is a misfortune nobody experiences.** (The Objective View: It's a loss of good things, even if you didn't know they were coming.)

  **Node 5:** Do you have to *know* you wanted it, or does it count if you were just living toward it?
  *   **Have to know:** **Leaf D: Death is bad only as cancelled plans and desires.** (The Subjective View: If you weren't planning on it, you didn't lose it.)
  *   **Just living toward it:** **Leaf E: Death is bad because it thwarts what you would have become.** (The Essentialist: You had a trajectory, and it was cut.)

  **Node 6:** Is the life spoiled because it's *unfinished*, or because it doesn't *make sense* anymore?
  *   **Unfinished:** Go to Node 7.
  *   **Doesn't make sense:** **Leaf F: Death is bad because it ruins the shape of a life that was going somewhere.** (The Narrative View: The ending retroactively changes the meaning of the beginning.)

  **Node 7:** When the work is left unfinished, does the loss belong to *you*, or to the people and things you leave behind?
  *   **Belongs to you:** **Leaf G: Death is bad because it leaves your work incomplete in the world.** (The Functional View: You were a tool for a job, and the job is stalled.)
  *   **Belongs to them:** **Leaf H: Death is bad because it severs the ties that made you who you were.** (The Relational View: You exist in others, and you are dying in them.)

  ***

  ### Impossible & Unstable Combinations
  You asked for combinations of answers nobody actually holds, so you can give one to a character who is arguing emotionally rather than logically. Here are three options, graded by *why* they don't work.

  **1. The "Ghost Plan" (Incoherent)**
  *   **The Combo:** They answer **"Yes"** at Node 1 (Harm must be felt) but argue for **Leaf C** (Death is a misfortune nobody experiences).
  *   **Why it breaks:** They are claiming that you have to feel a harm for it to be real, but also claiming that death is a real harm that nobody feels. It's a logical contradiction.
  *   **Character Use:** This character is grieving so hard they can't hear their own words. They insist the dead man is "suffering the loss" of his future. It's emotionally true for them, logically impossible.

  **2. The "Heartless Planner" (Unappealing)**
  *   **The Combo:** They answer **"Have to know"** at Node 5 (Conscious desire required) but admit **Leaf F** (Ruins the shape) matters for children.
  *   **Why it breaks:** If only conscious plans count, an infant's death can't be a tragedy (no plans) and can't ruin a shape (no story yet). To hold both, they have to value adult plans over infant lives.
  *   **Character Use:** This character is hyper-rational, maybe a doctor or lawyer. They try to apply the "cancelled plans" logic to everyone, but flinch when the dying man's grandchild is mentioned. It shows their coldness cracking.

  **3. The "Solo Storyteller" (Unexplored/Tense)**
  *   **The Combo:** They answer **"You were never single"** at Node 2 (Self is an illusion) but argue for **Leaf F** (Ruins the shape of a life).
  *   **Why it breaks:** If the self is just a flickering collection of moments (Leaf B), there is no continuous "life" to have a "shape" or "go somewhere." You can't ruin the narrative arc of a character you just admitted doesn't exist.
  *   **Character Use:** This is the most interesting one for a novelist. This character wants the comfort of a story (Leaf F) but the intellectual safety of nihilism (Node 2). They are trying to have it both ways: "Nothing matters, but look how beautifully his nothingness ended."

  ***

  ### Overlap Warning
  You have six characters. I have given you eight leaves. However, two pairs are dangerously close in a kitchen argument. If you aren't careful, two actors will end up playing the same role.

  **1. Leaf C (Misfortune) vs. Leaf E (What you would have become)**
  *   **The Risk:** Both argue that death is bad even if you didn't want to stay.
  *   **The Fix:** Make sure Leaf C focuses on **goods** (sunlight, food, experiences) and Leaf E focuses on **identity** (who you were turning into).
      *   *Character C:* "He lost the sun on his face. It doesn't matter if he knew he loved it."
      *   *Character E:* "He was becoming a kinder man. That man never got to arrive."

  **2. Leaf F (Ruins Shape) vs. Leaf G (Unfinished Work)**
  *   **The Risk:** Both talk about things left undone.
  *   **The Fix:** Make sure Leaf F is about **aesthetics** (the story looks tragic now) and Leaf G is about **utility** (the barn is still unbuilt).
      *   *Character F:* "It turns his whole life into a tragedy. All that struggle for nothing."
      *   *Character G:* "The project dies with him. Nobody else can finish it."

  If you assign **Leaf B (Self is an illusion)** to one character, ensure they don't drift into **Leaf A (No harm)**. Leaf A is usually peaceful/calm (nothing to fear). Leaf B is usually unsettling/dissociative (I am already gone). Give them different temperatures.
