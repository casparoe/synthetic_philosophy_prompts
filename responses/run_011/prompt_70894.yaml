  Here is a principle constructed to accommodate your verdicts, followed by an analysis of its limits, its application to your new cases, and its implications for the universalism objection.

  ### The Principle: Public Non-Alienability

  **Formulation:**
  Public office is a trust in which the powers and resources of the institution are held for the public good. An act is corrupt if it treats these powers or resources as a private asset that can be exchanged, allocated, or leveraged for reasons that cannot be publicly justified as serving the specific purposes of that office.

  This principle is operationalized through three ordered clauses:

  1.  **The Non-Contingency Clause:** An official act is corrupt if its performance is explicitly or implicitly conditioned upon the receipt of a private benefit (material, political, or relational) by the official or their associates.
      *   *Motivating Cases:* **1** (Whisky/Prosecution), **4** (Job/Endorsement), **7** (Wing/Physician).
      *   *Argument:* In all three, the official act is held hostage to a private interest. In Case 4, even though the outcome is benign (best candidate hired), the *reason* for the act (the endorsement) treats the public job as a political chip. This violates the independence of the office.

  2.  **The Structural Incentive Clause:** An arrangement is corrupt if it creates a rational incentive for officials (current or future) to anticipate private benefits from specific private actors dependent on their current public decisions, even absent an explicit agreement.
      *   *Motivating Cases:* **5** (Revolving Door), **2** (Former Partner), **8** (Judge/Wine).
      *   *Argument:* Case 5 is wrong not because of a deal, but because the *structure* invites one. Case 2 is wrong for a "different reason" than Case 1 because it relies on ongoing relational loyalty rather than a specific transaction, but both compromise independence. Case 8 falls here: even with recusal, the annual gift creates a structural dependency that undermines the appearance of impartiality. (Verdict: Wrong, unless the recusal and gift are both fully publicized to negate the secrecy).

  3.  **The Transparency and Cultural Context Clause:** The acceptance of a benefit is not corrupt if it is fully transparent (publicly registered) and if, within the relevant cultural context, the benefit is conventionally understood as a recognition of status or solidarity rather than a claim on future judgment.
      *   *Motivating Case:* **3** (The Blanket).
      *   *Argument:* This clause saves Case 3. The blanket is worth the same as the whisky (Case 1), but the *registration* removes the secrecy, and the *local convention* removes the implication of a quid pro quo. The obligation is social, not transactional.

  ### The Mismatch: Case 6

  **Verdict:** The principle cannot accommodate Case 6 (The Headman/Fertilizer) without significant damage to its universal applicability.

  **Analysis:**
  Your verdict on Case 6 relies on a **Substantive Outcome** test (the poorest got the fertilizer) overriding a **Procedural Integrity** test (the formula was ignored). The Principle of Public Non-Alienability is fundamentally procedural and institutional. It argues that public power must be exercised according to public rules, not private heuristics (like kinship), even if the private heuristic works well in a specific instance.

  To accommodate Case 6, you would need a fourth clause: *"Procedural violations are permissible if they demonstrably better serve the substantive purpose of the rule and confer no net private advantage beyond what the rule intended."*

  **Recommendation:**
  **Drop the verdict on Case 6.**
  You noted you are "somewhat embarrassed" by this verdict. This is the honest move. Defending nepotism (even benevolent nepotism) as "not corrupt" undermines the claim that public office is a *public* trust. If the formula is flawed, the Headman should advocate to change the formula, not bypass it for relatives. Keeping Case 6 forces you to argue that corruption is defined by *outcome distortion* rather than *process integrity*, which you already rejected in Case 4. Sacrificing Case 6 strengthens your defense of Case 4.

  ### Application to New Cases

  **The Cases:**
  *   **A:** Minister ruled *against* Firm X; 4 years later, offered board seat by Firm X.
  *   **B:** Minister ruled *for* Firm X; 4 years later, offered board seat by Firm X.

  **Principle Prediction:**
  **Both are corrupt** under the **Structural Incentive Clause (Clause 2)**.

  **Reasoning:**
  The principle's answer does **not** depend on the direction of the earlier rulings. It depends on the *link* between specific regulatory authority and specific private gain.
  *   In **Case B** (Ruled For), the payment looks like a **reward** for past favor (retrospective corruption).
  *   In **Case A** (Ruled Against), the payment looks like **compensation** for lost opportunity or an investment in future influence (prospective corruption). It signals to other officials that being "tough" on an industry is a viable career strategy *with* that industry, or that the industry buys off its critics.

  Both scenarios treat the Minister's prior public decisions as a private asset that increases their market value to the regulated entity. To maintain the integrity of the office (Case 5 logic), the principle must condemn the *connection* itself, regardless of the direction of the favor. If you must distinguish them, Case B is *more* intuitively corrupt, but a robust principle condemns both to prevent the marketization of public judgment.

  ### The Universalism Objection (Case 1 vs. Case 3)

  **Question:** If the principle distinguishes the Whisky (1) from the Blanket (3) based on local convention, does it concede that anti-corruption norms are merely Western moralizing?

  **Answer:**
  No. The principle supports a **Universal Concept with Culturally Variable Extension.**

  1.  **The Universal Core:** The universal norm is **Non-Alienability and Transparency.** No culture accepts the secret selling of public judgment. Every society distinguishes between a "gift" (freely given, no obligation) and a "bribe" (given to create obligation). The universal claim is that public officials must not accept benefits that create *secret obligations*.
  2.  **The Variable Extension:** What *counts* as creating an obligation is culturally variable. In one context, a bottle of whisky implies a debt; in another, a handwoven blanket implies solidarity.
  3.  **The Criterion that Fixes the Extension:** **Public Transparency.**
      *   In Case 1, the whisky is presumably private. It fails the transparency test.
      *   In Case 3, the blanket is **registered**.
      *   This is the key to your paper. International institutions need not ban gifts (which imposes Western social norms); they must ban **unregistered benefits**.

  **Conclusion for the Paper:**
  The objection that anti-corruption norms are "Western moralizing" fails because the core principle is not "gifts are bad," but "secret obligations are bad." By focusing on **registration and transparency** (as in Case 3) rather than prohibition, the universal norm respects local sociality while preventing the alienation of public power. The whisky is corrupt not because it is whisky, but because it is a private transfer between adversaries. The blanket is not corrupt because it is a public transfer between constituents.

  **Summary of Advice:**
  1.  Adopt the **Public Non-Alienability** principle (Non-Contingency, Structural Incentive, Transparency).
  2.  **Drop Case 6.** It relies on outcome-based reasoning that contradicts your defense of Case 4 and weakens the universal claim.
  3.  Argue that the **Minister cases** are both corrupt based on structural incentives, not just past favors.
  4.  Defend universalism by anchoring it in **Transparency** rather than the specific nature of the gift. This allows you to respect Case 3 without accepting Case 1.
