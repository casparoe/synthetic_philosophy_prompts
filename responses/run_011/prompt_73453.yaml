prompt: |-
  ok so context: I'm a senior and I'm in this interdisciplinary elective at my school called "Humans and the Planet" — half enviro science, half history/philosophy. Our teacher does this thing where instead of just sitting the final we each have to WRITE one of the exam questions ourselves, plus the model answer and the marking scheme, because apparently you don't understand a topic untill you can say what an A answer does that a B answer doesn't. My assigned topic is the Anthropocene and honestly the more I read about it the more confused I got, so I want your help drafting mine.

  Here's the material I've gathered that I want the question to actually turn on (please build on these specifics, don't swap in other ones). The word got popular around 2000 through the atmospheric chemist Paul Crutzen, who pointed at the industrial revolution and the steam engine as roughly where it starts. A working group was set up in 2009 under the international body of stratigraphers whose whole job was to make the Anthropocene a formal epoch with a "golden spike" — one physical marker layer at one place that pins the boundary down. In 2019 they mostly settled on a mid-20th-century date, and in 2023 they proposed lake sediments at Crawford Lake in Ontario, boundary around 1950, marker being plutonium fallout from nuclear weapons testing. Then in 2024 the quaternary subcommission voted the whole proposal down by a wide margin — partly because the sediment record is so thin and the proposed start so recent — and the higher international bodies confirmed the rejection while saying the term would keep getting used informally. Meanwhile there's a competing "early Anthropocene" line going back to a palaeoclimatologist named Ruddiman, who argued the CO2 and methane curves started bending thousands of years ago with farming and rice paddies, and another camp pointing at a dip in atmospheric CO2 around 1610 that they connect to reforestation in the Americas after Indigenous populations collapsed following European contact.

  So the question I want should not be answerable by a kid reciting "the Anthropocene means humans are wrecking the earth and it started in 1950" or by listing candidate dates in order. I want it to force them onto the actual crux, which as far as I can tell is this: the criteria for a formal geological boundary (globally synchronous, physically detectable in rock or sediment, fixed by stratigraphers using thier own conventions) are doing something completely different from what people mean when they say we live in the Anthropocene — and picking a start date smuggles in a story about who's responsible, whether that's neolithic farmers, colonizers, industrial Europeans or postwar consumers, which is a political and historical judgement wearing a lab coat. The 2024 rejection is the perfect hook for that: does a vote by a stratigraphy subcommission that it isn't an epoch settle anything about whether the Anthropocene is real?

  Deliverables, please: (1) one question in two parts — a short part (a) worth 5 marks asking them to explain what exactly was voted down in 2024 and what ratifying it would have meant, and a longer part (b) worth 20, so 25 total, answerable in about 40 minutes by a smart 17-18 year old with no college geology; (2) a model answer of around 550 words; (3) a marking scheme that awards marks for named moves rather than vibes, and that says explicitly what separates an A from a B — like, I'd guess a B answer describes the competing dates accurately but treats the disagreement as a measurement problem that better ice cores would solve, whereas an A does something else, and you tell me what that something else is. Then give me a list of 4 or 5 mistakes students will definitely make (thinking the 2024 vote means scientists decided humans haven't changed the planet, confusing epoch with era or period, treating "golden spike" as a metaphor, assuming the earliest date is automatically the most honest one) and how many marks each should cost. No citations or reading lists in the question or the model answer — my teacher banned those since half the class would just make them up anyway.
