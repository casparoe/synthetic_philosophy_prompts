answer: |-
  ### Part 1: Corrections to Your Theoretical Crib Sheet

  You have a strong grasp of the functional logic, but there are three specific areas where your summary imports Buddhist or modern categories, or slightly misaligns with classical Nyāya. I will correct these plainly so your procedure is theoretically sound.

  **1. The Three Marks of Inference (*Trairūpya*)**
  You wrote: *"I know the three conditions on a sound reason are codified more explicitly by the Buddhist logicians."*
  **Correction:** While Dignāga and Dharmakīrti (Buddhist logicians) refined the *logic* of the three marks to focus on necessity (*avinābhāva*), the Nyāya school fully accepts the *Trairūpya* (three forms) as the standard for a valid *hetu* (reason). You do not need to attribute this to the Buddhists to use it. However, Nyāya emphasizes that the "pervasion" (*vyāpti*) between the reason and the conclusion must be established by repeated observation (*bhūyodarśana*) and non-contradiction (*tarka*), not just formal logic. For your procedure, this means a "Rule" cannot be a hunch; it must be based on established patterns.

  **2. Comparison (*Upamāna*) vs. Analogy**
  You wrote: *"Identification by comparison with a known case."*
  **Correction:** In classical Nyāya, *Upamāna* is specifically the knowledge of the relation between a *word* and its *referent* based on similarity (e.g., learning what a "gavaya" is by being told it is like a "cow"). It is not a method for establishing causal laws. When your residents say, "This spill is *like* the spill in Town X, therefore it is toxic," they are not using *Upamāna*; they are attempting *Anumāna* (Inference) by analogy. This is a critical distinction. *Upamāna* validates naming; *Anumāna* validates causation. Case (3) in your exercise relies on this error. Treat "comparison" claims as faulty Inference, not valid Comparison.

  **3. The Five-Member Syllogism (*Avayava*)**
  You wrote: *"I would like to follow the five-member form... Tell me if that form is a straitjacket on paper."*
  **Correction:** It is a straitjacket for a 30-minute intake form. The five members (*Pratijñā, Hetu, Udāharaṇa, Upanaya, Nigamana*) are designed for *debate* and *teaching*, forcing the opponent to agree at every step. For an internal file, steps 1 (Claim) and 5 (Conclusion) are identical, and steps 3 (Rule/Example) and 4 (Application) often merge.
  **Recommendation:** Keep the *logic* of the five members to discipline your thinking, but collapse them into **three written fields** for the volunteer form:
  1.  **The Claim** (Members 1 & 5)
  2.  **The Evidence & Rule** (Members 2 & 3)
  3.  **The Fit & Gaps** (Member 4 + identification of missing *vyāpti*)
  This saves time while forcing the screener to articulate the generalization.

  **4. Comprehensibility Conditions**
  Your summary of *ākāṅkṣā* (expectancy), *yogyatā* (compatibility), *āsatti* (proximity), and *tātparya* (purport) is correct. While these were debated heavily by Mīmāṃsā, Navya-Nyāya adopted them as the conditions for *śābdabodha* (verbal cognition). You may use them without reservation.

  ---

  ### Part 2: The Triage Procedure (30-Minute Workflow)

  This procedure is designed for a volunteer with no scientific training. It prioritizes *epistemic status* over *outcome*.

  **Gate 0: Intelligibility Check (5 Minutes)**
  *   **Test:** Apply the four conditions of comprehension.
      *   Do the sentences hang together? (*Ākāṅkṣā*)
      *   Is the claim physically possible? (e.g., "The water turned into gold" fails *Yogyatā*). (*Yogyatā*)
      *   Is the message complete, or fragmented? (*Āsatti*)
      *   Is the intent clear (complaint vs. inquiry)? (*Tātparya*)
  *   **Fail:** **Decline.** Rationale: "Report is unintelligible or describes an impossibility."
  *   **Pass:** Proceed to Gate 1.

  **Gate 1: Source Tagging (5 Minutes)**
  *   **Test:** Identify the primary *pramāṇa*.
      *   **Perception:** "I saw/smelled X." (Direct observation).
      *   **Testimony:** "The lab said X" or "The teacher said X." (Report of observation).
      *   **Inference:** "X is happening because Y." (Causal claim).
      *   **Comparison:** "This looks like Z." (Treat as Inference).
  *   **Action:** Most reports will be **Testimony** regarding **Perception** (witness) mixed with **Inference** (cause). Separate them.
      *   *Valid:* "I smell solvent." (Testimony of Perception).
      *   *Unverified:* "The factory caused the smell." (Inference).

  **Gate 2: Trustworthiness Screen (*Āpta* Check) (10 Minutes)**
  *   **Test:** Apply to the human source of the Testimony/Perception.
      *   **Competence:** Could they perceive this? (e.g., Did they actually drink the water, or hear it from a neighbor?)
      *   **Honesty:** Is there a known motive to falsify? (Grievance, litigation history).
      *   **Access:** Were they in the right place/time?
  *   **Fail (Honesty/Access):** **Decline.** Rationale: "Source lacks access or credibility."
  *   **Fail (Competence - e.g., layperson diagnosing chemical):** **Park.** The perception is valid, the diagnosis is not.
  *   **Pass:** Proceed to Gate 3.

  **Gate 3: Logical Stress Test (*Hetvābhāsa* Check) (10 Minutes)**
  *   **Test:** If the report makes a causal claim (Inference), check for fallacies.
      *   **Too Wide:** Does the sign appear where the hazard is absent? (e.g., "Smell" appears near bakeries, not just factories).
      *   **Contradicted (*Bādhita*):** Is there direct evidence against it? (e.g., Clinic data shows health *improving*).
      *   **Unverified (*Asiddha*):** Is the reason itself assumed? (e.g., "It is toxic because it is dangerous").
      *   **Mistimed (*Kālātyayāpadiṣṭa*):** Is the data outdated? (e.g., 1990s study for current emissions).
  *   **Fail (Contradicted):** **Decline.**
  *   **Fail (Unverified/Too Wide):** **Park.** (Pending clarification/testing).
  *   **Pass:** **Open Investigation.**

  ---

  ### Part 3: The File Rationale Form

  Do not force volunteers to write "Therefore, this is the conclusion." Use this simplified three-block structure that retains the five-member logic.

  **1. The Claim (Pratijñā & Nigamana)**
  *   *Prompt:* What specific hazard is alleged? (Not "problem," but "solvent in tap water").
  *   *Drafting:* "Resident claims tap water contains solvent contaminants."

  **2. The Reason & Rule (Hetu & Udāharaṇa)**
  *   *Prompt:* What evidence supports this, and what is the general rule linking evidence to hazard?
  *   *Drafting:* "Reason: Persistent solvent odor and animal death. Rule: Solvent odors in tap water typically indicate chemical contamination (based on [Source/Precedent])."
  *   *Constraint:* If you cannot name a rule or precedent, you must Park.

  **3. The Application & Gaps (Upanaya)**
  *   *Prompt:* Does this case fit the rule, and what is missing?
  *   *Drafting:* "Application: Odor matches description. Gap: No lab verification of chemical; animal cause of death unconfirmed. Pervasion (*Vyāpti*) between odor and specific solvent is not established."

  ---

  ### Part 4: Running the Four Cases

  Here is the procedure applied to your cases. I have adhered to the instruction to let one case go against your sympathies.

  #### Case 1: The Retired Teacher (Solvent Smell + Dead Dog)
  *   **Gate 0 (Intelligibility):** Pass. Clear claim.
  *   **Gate 1 (Source):** Testimony of Perception (Smell) + Inference (Cause = Solvent).
  *   **Gate 2 (Trust):** Pass. *Āpta* (Trustworthy). Competent to smell, Honest, Access confirmed.
  *   **Gate 3 (Logic):**
      *   Claim: Water is hazardous (solvent).
      *   Reason: Smell + Dog Death.
      *   Rule Check: Does "Smell + Dog Death" *always* mean "Solvent in Water"? No. Dogs die of many causes; smells vary. The *vyāpti* (pervasion) is not established.
      *   Fallacy: *Asiddha* (Unverified reason). The link between the smell and the specific hazard is assumed, not known.
  *   **Disposition:** **PARK PENDING CLARIFICATION.**
  *   **Against Sympathy:** You likely want to **Open** this immediately because the witness is trustworthy and a dog is dead. However, Nyāya distinguishes between the validity of the *perception* (the smell exists) and the validity of the *inference* (the smell implies a specific hazard warranting a full investigation budget). Opening a full investigation based solely on an unverified inference exhausts budget if the smell is, for example, from a natural gas leak (utility issue, not environmental health) or a septic failure.
  *   **File Rationale:**
      *   **Claim:** Tap water contamination by solvent.
      *   **Reason & Rule:** Solvent odor and proximate animal death. Rule: Such odors often indicate chemical leaks.
      *   **Application & Gaps:** Witness is credible. However, the pervasion between "odor" and "solvent hazard" is not established without chemical analysis. Animal cause of death is unknown.
      *   **Action:** Park. Request: Veterinary report on dog; refer water sample to state lab (if free) or utility company for initial screen.

  #### Case 2: The Asthma Cluster (Petition + Foreign Study vs. Clinic Data)
  *   **Gate 0:** Pass.
  *   **Gate 1:** Testimony (Petition) + Inference (Plant causes Asthma).
  *   **Gate 2:** Mixed. Group is honest, but Competence on medical causation is low.
  *   **Gate 3:**
      *   Reason: Plant emits Substance X; Substance X causes Asthma.
      *   Contradiction: Local clinic report shows asthma presentations *falling*.
      *   Fallacy: *Bādhita* (Contradicted). The perceptual evidence (clinic data) contradicts the inferred conclusion (cluster). The study is *Kālātyayāpadiṣṭa* (Mistimed/Outdated context).
  *   **Disposition:** **DECLINE.**
  *   **File Rationale:**
      *   **Claim:** Plant emissions causing asthma cluster.
      *   **Reason & Rule:** Presence of plant + historical study linking substance to asthma.
      *   **Application & Gaps:** Local clinic data contradicts the existence of a cluster (falling rates). The reason is contradicted by direct perception (*bādhita*).
      *   **Action:** Decline. File rationale: "Claim contradicted by local health data."

  #### Case 3: The Comparison ( "Just Like Town X")
  *   **Gate 0:** Pass.
  *   **Gate 1:** Comparison (*Upamāna*) treated as Inference.
  *   **Gate 2:** Source access unclear.
  *   **Gate 3:**
      *   Reason: It looks like Town X.
      *   Rule Check: Similarity in appearance does not establish similarity in cause (*Upamāna* error).
      *   Fallacy: *Savyabhicāra* (Irregular/Too Wide). Many things look alike but have different causes.
  *   **Disposition:** **PARK.**
  *   **File Rationale:**
      *   **Claim:** Hazard identical to Town X incident.
      *   **Reason & Rule:** Visual and olfactory similarity.
      *   **Application & Gaps:** Comparison establishes similarity in appearance, not cause. Causal link requires independent verification.
      *   **Action:** Park pending independent sampling.

  #### Case 4: The Fragmentary Voicemail
  *   **Gate 0:** Fail.
      *   *Āsatti* (Proximity/Connection) missing. Words do not hang together. *Tātparya* (Purport) unrecoverable.
  *   **Disposition:** **DECLINE.**
  *   **File Rationale:**
      *   **Claim:** Indeterminable.
      *   **Reason & Rule:** N/A.
      *   **Application & Gaps:** Report fails conditions of verbal comprehension.
      *   **Action:** Decline. Note: "Request clearer submission."

  ---

  ### Part 5: Where Epistemology Ends and Policy Begins

  You are correct in your suspicion. Nyāya is a *śāstra* of knowledge (*vidyā*), not a *śāstra* of resource allocation (*arthaśāstra*).

  **1. What Nyāya Cannot Do:**
  *   **Risk Tolerance:** Nyāya tells you if a cognition is *pramā* (valid) or *apramā* (invalid). It does not tell you if a 60% probability of a hazard is worth spending $5,000 to investigate. That is a value judgment.
  *   **Conflicting *Pramāṇas*:** If Perception (smell) conflicts with Testimony (utility company says water is safe), Nyāya generally prioritizes Perception. However, if the cost of being wrong about Perception is death, policy might dictate prioritizing the Testimony of the lab. Nyāya does not weigh *costs*.
  *   **Base Rates:** Nyāya deals with universal relations (*vyāpti*), not statistical prevalence. It does not handle "This usually isn't toxic, but sometimes is" well without a specific rule.

  **2. The Handoff Point:**
  The procedure stops being epistemology at **Gate 3 (Disposition)**. Once you have determined the *epistemic status* (Valid, Doubtful, or Contradicted), the decision to spend budget is a policy choice.
  *   *Epistemology:* "The claim is doubtful (*saṃśaya*)."
  *   *Policy:* "We investigate doubtful claims involving vulnerable populations, but decline doubtful claims involving property values."

  **3. The File Sentence:**
  When the epistemic warrant is insufficient for a clear "Open" or "Decline," but the committee must decide based on values, insert this exact sentence into the rationale:

  > *"Epistemic warrant is insufficient to establish the hazard as veridical; this disposition reflects organizational risk tolerance rather than confirmed fact."*

  This protects you legally (you admit you don't *know*) and philosophically (you acknowledge the limit of the *pramāṇa*).

  ### Summary of Theoretical Distinctions to Keep vs. Drop

  **Keep (Essential for Rigor):**
  *   **The distinction between Perception and Inference:** Crucial for separating "I smell X" (Valid) from "X is toxic" (Unverified).
  *   **The *Āpta* (Trustworthy Person) criteria:** Competence, Honesty, Access. This is your best tool for screening testimony without a lab.
  *   **The *Bādhita* (Contradicted) Fallacy:** This is your legal shield. If data contradicts the claim, you *must* decline to remain rational.

  **Drop (Simplification for Volunteers):**
  *   **Sanskrit Terminology:** Do not put *Hetvābhāsa* or *Vyāpti* on the form. Use "Logical Flaw" and "Established Rule."
  *   **The Full Five-Member Syllogism:** As noted, collapse it to Claim/Rule/Gap. The mental discipline is what matters, not the written verbosity.
  *   **Strict *Upamāna*:** Do not teach volunteers the classical definition of Comparison. Treat all "It's like X" claims as Inference requiring a rule.

  This procedure gives you a defensible, philosophically grounded workflow that respects the limits of your budget and your knowledge, while honoring the Nyāya commitment to truth over comfort.
