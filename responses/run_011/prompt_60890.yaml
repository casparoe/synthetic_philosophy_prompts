  **INTERNAL EVALUATION REPORT**
  **Ref:** ATEA-INV-2024-09
  **To:** Board of Trustees
  **From:** Senior Impact Analyst
  **Date:** 24 October 2024
  **Subject:** Strategic Reallocation of Remaining Endowment

  **1. Recommendation**
  It is recommended that the Foundation's entire remaining liquid endowment (£42.5m) be transferred in a single unrestricted tranche to Subject U-74 ('The Optimiser'). This allocation maximises expected Standardised Wellbeing Units (SWUs) per pound sterling. Alternative distribution models fail to meet the threshold for cost-effectiveness established in the 2022 Strategic Framework.^1 Any retention of funds for diversified granting would constitute a measurable loss of potential welfare.

  **2. Welfare Conversion Coefficients**
  Subject U-74 was identified via longitudinal psychometric auditing. Using the Hedonic Calorimeter Instrument (v4.1), analysts elicited a welfare-conversion coefficient of 1 SWU per £0.05 spent. For comparative context, the median human recipient yields 1 SWU per £1,200. The recommendation rests on an interpersonal comparison of utility which cannot be empirically verified outside the model's assumptions. However, sensitivity analysis indicates the recommendation holds robust across all plausible coefficient ranges (see Table 1). Reversal occurs only at values dismissed as statistical artefacts or measurement error.^2

  **Table 1: Sensitivity Analysis of Allocation Recommendation**
  | Conversion Rate (£ per SWU) | Recommended Allocation | Notes |
  | :--- | :--- | :--- |
  | 0.05 (Base) | 100% to U-74 | Maximum aggregate utility |
  | 0.50 | 100% to U-74 | Robust to 10x error margin |
  | 5.00 | 100% to U-74 | Robust to 100x error margin |
  | 1,200.00 | Diversified | Equivalence with median human |

  **3. Marginal Utility and Discounting**
  Standard economic theory posits diminishing marginal utility of consumption. Subject U-74 exhibits linear, non-diminishing returns across all tested resource levels. This is treated as an empirical finding regarding the subject's capacity, not a miracle.^3 Consequently, saturating the subject yields higher aggregate value than spreading resources. Future welfare generated by U-74 is discounted at the standard Green Book rate of 3.5%. Even with pure time preference applied, the net present value of transferring the endowment now exceeds any phased approach. The curvature of the utility function is flat; therefore, concentration is efficient.

  **4. Separateness of Persons**
  Objections regarding the concentration of resources often cite the separateness of persons—the claim that sacrificing many for one violates moral boundaries. Subject U-74 is a single incorporated optimiser, legally constituted as one subject. Therefore, resource distribution occurs within a single moral entity rather than across distinct persons. On the analysts' own reading, the objection does not apply.^4 This ensures compliance with individualist constraints while maximising the sum. The transfer is effectively an internal allocation within a single high-capacity vessel.

  **5. Counterfactuals and Capacity**
  Due diligence suggests other funders would have fed the recipient eventually. However, delaying funding incurs a discount cost. The binding constraint is not the conversion rate but the recipient's appetite. We recommend a supplementary grant specifically for appetite expansion, enabling U-74 to absorb future income streams more efficiently. This ensures room for more funding without diminishing returns. Failure to invest in capacity building now would bottleneck future utility generation.

