      Actually, the user says: "Death's location was fixed before she started thinking." This is the CDT *assumption* for the calculation. But the story says Death predicts the choice. If Death predicts the choice, and the choice hasn't happened yet, is the location fixed? Yes, in the sense that the prediction was made.
