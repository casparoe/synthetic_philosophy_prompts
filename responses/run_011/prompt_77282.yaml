  Good evening. For those who don't know me, I'm the nephew who asks too many questions. Looking around this hall, seeing the ink still under Martin's fingernails despite the suit, I think we all know what kind of man we are celebrating. He is stubborn. He is funny. He is here. And at sixty, he still refuses to wear a tie that doesn't smell of solvent.

  We tell the story about the cinema, how he learned to sit on his own left hand because it kept undoing his coat buttons. We laugh, because he laughs first. He says it was the only way to keep warm during the newsreels. But we won't be asking for demonstrations tonight. Some things belong to the quiet of the workshop, not the noise of a party. The hands have earned a rest, and the objects they find can stay hidden in the dark where they belong. There is no need to prove how the work gets done when the building is already standing. The guests are here for the print, not the press mechanism.

  There is a tension in this room, visible as the space between three metres of chairs. I won't try to bridge it with theories. I will only say this: Ellen knows the single promise kept across thirty-eight years, and Frances knows the two separate hands that built the workshop. Neither truth cancels the other. One does not erase the work of the other. The marriage is not a theory, and the work is not a trick. Both are real. Both are heavy. Both are his. To deny the promise is to insult the life lived. To deny the separate hands is to insult the labour endured.

  Martin told me not to call him a problem. He is not a puzzle to be solved between the meal and the dancing. He is the man who drove us to school, who argued about politics, who printed the invitations for this night on an iron machine he loaded himself. He is the sum of the arguments and the agreements. He is the father who taught Frances to read and the husband who taught Ellen to dance. He is the uncle who lets us win at cards until we notice. He is the brother who remembers everyone's birthday except his own, even when we forget.

  So I stand here with one glass. I know what this looks like. It looks like a verdict. It looks like I am saying there is only one of you to address. But a toast is not a diagnosis. It is a wish. When I say your name, I am not counting anything. I am gathering everything we love about you into a single sound. The glass is single because my hand is single, not because you are simple. You are complex. You are whole. You are enough. We raise this not to define you, but to thank you. The form is limited, but the love is not.

  To Martin.

  ***

  **Note**

  The sentence beginning "Ellen knows..." validates Ellen's experience of continuous marital fidelity ("single promise") while validating Frances's observation of distinct physical agencies ("two separate hands"). It avoids agnosticism by asserting both truths are real and heavy, refusing to prioritize one ontology over the other. The speech commits to the reality of the lived relationship and the physical duality without resolving the metaphysical count. It leaves open the question of how many centres of experience exist, rendering it irrelevant to the celebration. The raised glass confronts the singularity of the toast form directly: it admits the limitation of language ("one glass") while asserting that love exceeds categorization ("love is not"). The sentences are arranged to build from concrete history to this philosophical confrontation, ensuring the final act is one of gratitude rather than definition.
