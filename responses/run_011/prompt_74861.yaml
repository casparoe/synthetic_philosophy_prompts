answer: |-
  The maxim *de gustibus non est disputandum* is a chameleon; in your interlocutor's mouth, it functioned as a shield, but shields are made of different materials. To understand why it failed to block your point, we must separate the distinct claims it is often used to smuggle in. Below are five precisely statable readings of the sentence, evaluated for their truth, consistency, and relevance to your argument about adaptive preferences.

  **1. The Epistemic Claim**
  *Statement:* "An observer cannot know a person's preferences better than the person reports them."
  *Status:* **Substantive but False.** While we lack direct access to another's mind, behavioral economics and psychology demonstrate that observers can often identify inconsistencies between reported satisfaction and revealed welfare (e.g., addiction, coercion, or adaptive preferences). We can sometimes know what an agent would prefer under different informational or constraint conditions better than the agent currently knows.
  *Consistency:* Inconsistent with Claim 2. If preferences are *defined* by choices (Claim 2), there is no hidden "true preference" to be ignorant of.
  *Relevance:* It attempts to dismiss your point by declaring your inquiry impossible. It does not refute the mechanism of adaptive preference; it merely asserts you cannot prove it. It changes the subject from the *existence* of the phenomenon to the *verifiability* of it.

  **2. The Ontological Claim (Strict Revealed Preference)**
  *Statement:* "A preference is nothing over and above the pattern of choices actually made; there is no residual mental state."
  *Status:* **True by Definition, Empirically Empty.** This makes the theory of choice tautological. If preference *is* choice, then by definition the fox prefers the grapes he does not eat (or prefers not to eat them). It renders the theory unfalsifiable.
  *Consistency:* Inconsistent with Claim 1 (see above) and Claim 4. If this is an ontological truth, Claim 4 is unnecessary; you wouldn't need a methodological rule to treat it as true if it *were* true.
  *Relevance:* It dismisses your point by linguistic fiat. It renders your distinction between "settled preference" and "choice under constraint" meaningless by definition. However, it achieves this only by sacrificing the explanatory power of economics, turning it into a description of behavior rather than an explanation of causes.

  **3. The Normative Claim**
  *Statement:* "One person is not entitled to criticize or judge another person's ends."
  *Status:* **Substantive and Defensible (Ethically).** In a liberal framework, individuals possess sovereignty over their own valuation of the good life.
  *Consistency:* Orthogonal to Claims 1, 2, 4, and 5. Those are positive (descriptive) claims; this is normative. Holding this alongside Claim 2 is a category error (deriving an "ought" from a definitional "is").
  *Relevance:* It changes the subject entirely. Your argument was about the *causal origin* of the preference (positive analysis), not whether the preference is morally worthy or whether the person should be coerced (normative analysis). It licenses dismissing your point only by accusing you of arrogance, not error.

  **4. The Methodological Claim**
  *Statement:* "Inquirers should proceed *as if* preferences are stable and exogenous to make behavior predictable."
  *Status:* **Substantive and Defensible (Pragmatically).** This is the standard economic usage (associated with Stigler and Becker). It admits preferences might change but argues that modeling them as fixed yields better predictions than trying to model the psychology of taste formation.
  *Consistency:* Consistent with Claim 2 only as a "useful fiction." Inconsistent with Claim 5, because if it is merely a method, taste statements can still be empirically true or false, we just choose to ignore the complexity.
  *Relevance:* This is the only reading that engages with economics, but it does not license dismissing your point in a *philosophical* or *psychological* quarrel. It is a rule for building models, not a fact about persons. Using it to stop a conversation about human welfare is a category error: it applies a rule of inquiry to a fact of existence.

  **5. The Semantic Claim (Non-Cognitivism)**
  *Statement:* "Statements of taste have no truth value; they are expressions of attitude, not descriptions of fact."
  *Status:* **False.** While simple sensory tastes (I like vanilla) may be subjective, complex preferences (I value a life of security over risk) involve empirical beliefs about the world and the self that can be true or false, consistent or inconsistent.
  *Consistency:* Inconsistent with Claim 4. If taste statements have no truth value, they cannot serve as parameters in a scientific model (Claim 4).
  *Relevance:* It dismisses your point by categorizing your inquiry as nonsense. If "I am content" has no truth conditions, you cannot investigate whether that contentment is "sour grapes."

  **The Conversation Stopper**
  When someone uses this maxim to end an argument rather than clarify a position, they are almost invariably conflating **Claim 4 (Methodological)** with **Claim 3 (Normative)**. They borrow the scientific authority of the methodological postulate ("this is how we study behavior") to enforce the normative boundary ("you are not allowed to judge this life"). This conflation allows them to treat a useful simplification for modeling as a moral shield against inquiry. It is a confusion that protects the status quo by declaring the causal history of a person's desires to be both scientifically irrelevant and morally off-limits.

  **The Sentence**
  "You are treating a methodological convention for simplifying models as if it were an ontological truth about human psychology, but a rule for ignoring causal history cannot refute a claim about how that history shapes the agent."
