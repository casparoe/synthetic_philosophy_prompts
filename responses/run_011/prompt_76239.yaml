  Damage report
  The most severe conflict exists between (3) and (4). Claim (3) asserts that the same egg and sperm cannot give rise to two separate people; origin pins down the individual. Claim (4) asserts that monozygotic twins are numerically distinct people. Biologically, monozygotic twins originate from a single zygote formed by one egg and one sperm. Therefore, according to (4), one egg and one sperm have given rise to two separate people. This directly contradicts (3). There is no metaphysical wiggle room here: if twins are distinct people sharing a zygote, then origin does not uniquely pin down the individual in all cases. To maintain consistency, you must abandon the universal scope of (3). You cannot argue for (1) using (3) as a premise without excluding twinning cases, which weakens the argumentative force of (3) significantly.

  The second conflict, ranked moderate to severe, lies between (1) and (5). Claim (1) binds your identity necessarily to specific gametes. Claim (5) identifies you as a Lockean person distinct from the organism, asserting the organism is contingent because you could survive a transplant into a different body. Standard metaphysics holds that organisms are individuated by their origins (gametes). If you could be embodied by a different organism, you could be embodied by an organism originating from different gametes. If you could originate from different gametes, (1) is false. If you insist the different organism must come from the *same* gametes, you must deny origin essentialism for organisms, which undercuts the non-arbitrary anchor you cite in (1). Essentially, you cannot claim the organism is contingent for you while claiming the organism's origin is essential to you, unless you posit a mysterious necessary connection between a contingent vessel and a necessary origin. This tension threatens the coherence of your entire origin essentialist project regarding persons.

  A cosmetic tension exists between (2) and the combination of (1) and (5). Anti-haecceitism (2) requires that worlds be individuated by qualitative facts. If you are a Lockean person (5) who could inhabit different organisms, we must ensure that the difference between "you in organism A" and "you in organism B" is qualitative. If the organisms are qualitative duplicates differing only in numerical identity, (2) forbids treating them as distinct possibilities for you. However, since organisms differ spatiotemporally and historically, this is likely manageable. The conflict is only severe if you rely on bare thisness to track yourself across bodies, which your Lockean view should avoid. Thus, (2) is compatible provided you treat psychological continuity and bodily history as qualitative identifiers.

  The derivation of the twin contradiction is strict: (3) says $\forall x \forall y (Origin(x)=Origin(y) \rightarrow x=y)$. (4) says $\exists a \exists b (a \neq b \land Origin(a)=Origin(b))$. These cannot coexist. The derivation of the Lockean tension is probabilistic but strong: If $Person \neq Organism$ and $Organism$ is contingent, then $Origin(Organism)$ is contingent for $Person$. But (1) says $Origin(Organism)$ is necessary for $Person$. This requires $Organism$ to be necessary, contradicting (5). You must choose between the contingency of the body or the necessity of the gametes.

  False alarms
  Your colleague's objection regarding (1) and (7) is a category error. Origin essentialism claims that *if* you exist, you originate from specific gametes. It does not claim you exist in all possible worlds. Contingent existence merely asserts there are worlds where the antecedent fails. These are logically compatible; Kripkean essentialism standardly accommodates contingent existence without contradiction. Similarly, (1) and (6) are compatible. Shifting the timing of conception changes the qualitative history of the world but not the identity of the gametes. Since (1) anchors identity in the gametes themselves rather than the precise moment of fusion, a delay in conception does not violate origin essentialism. You are correct to dismiss these tensions.

  Cheapest repair
  The single revision that buys back the most consistency is to qualify (3). Replace the universal claim with: "The same egg and sperm couldn't have given rise to two separate people, except in cases of fission like monozygotic twinning." This immediately resolves the severe logical contradiction with (4) while preserving (1) for all non-fission cases. It allows you to keep (2), (6), and (7) without modification. However, you must stop using (3) as a universal premise to prove (1); you can no longer argue that origin *always* pins down uniqueness. You must admit that origin is a defeasible anchor. This repair leaves the tension between (1) and (5) intact, requiring you to argue that even contingent organisms must share the same gametic origin to host you. I recommend this repair, though a deeper fix requires addressing (5).
