  ## Session Design: The Armchair Trap

  **Course:** First-Year Seminar: How Science Knows Things
  **Instructor:** Guest Lecturer (Science Journalist)
  **Students:** 14
  **Time:** 75 Minutes
  **Goal:** Experience the epistemic symmetry between a valid and an invalid armchair argument, then break the symmetry using criteria for truth-tracking.

  ### I. The Contamination Concession & Substitute
  **Difficulty:** You cannot neutralize the fact that 2024 students know the Earth moves. Asking them to evaluate the Tower Argument as if they don't is roleplay, not inquiry. They will reject the conclusion based on external fact, not internal logic, destroying the "felt symmetry" essential to the lesson.

  **Solution:** I concede the contamination cannot be neutralized. I propose a **substitute for the failing argument** that preserves the logical structure but removes the cultural hindsight.
  *   **Original:** Stone dropped from Tower on Rotating Earth.
  *   **Substitute:** Stone dropped from Mast on Moving Ship.
  *   **Why:** While students know the Earth moves, their intuition about motion on a moving vehicle is mixed. Many intuitively (and falsely) believe a dropped object on a moving ship *should* fall behind. This restores the *intuitive plausibility* of the false argument, allowing the "felt necessity" to match the Tied Bodies argument.

  ### II. Materials
  1.  **Handout A (The Arguments):** Two text blocks, labeled **Argument X** and **Argument Y**. No titles, no historical attribution.
      *   *Argument X (Tied Bodies):* Describes heavy/light stones tied together. If heavy falls faster, light retards it. But pair is heavier, so should fall faster. Contradiction. Conclusion: All fall same rate.
      *   *Argument Y (Ship Mast):* Describes stone dropped from mast of a sailing ship. If ship moves forward, stone should fall behind (land at stern). It lands at base of mast. Conclusion: Ship must be at rest (or motion does not affect vertical fall). *Note: For the activity, we frame the conclusion as "Therefore, the stone must fall behind if the ship moves," treating the observation as hypothetical to match the armchair nature.*
      *   *Correction for Symmetry:* To make them truly symmetric armchair puzzles, Argument Y must be phrased as a prediction: "If the ship moves, the stone *must* land behind. Since we observe it lands at the base, the ship is not moving." (This mirrors the Earth argument's structure).
  2.  **Handout B (The Wager):** A slip for private verdict and confidence.
  3.  **Whiteboard/Markers.**
  4.  **Timer.**

  ### III. Scoring Rule: "The Skin-in-the-Game Wager"
  To reward honest confidence without money:
  *   Students start with a hypothetical **100 Points**.
  *   For each argument, they write: **Verdict** (Sound/Unsound) and **Wager** (0 to 50 points).
  *   **Scoring:**
      *   If Verdict is Correct: Add Wager to Total.
      *   If Verdict is Incorrect: Subtract Wager from Total.
  *   **Incentive:** High wagers require high certainty. Guessing yields 0 expected gain; overconfidence on errors is punished. The "prize" is public recognition of the highest score (or a small tangible reward like a book).

  ### IV. Minute-by-Minute Timeline

  **00:00 – 00:05 | Introduction & Framing**
  *   Welcome. State the goal: "Today we are testing *reasoning*, not physics knowledge."
  *   Distribute Handouts A and B.
  *   **Crucial Instruction:** "Evaluate these arguments *only* on the basis of the logic and intuitions provided in the text. Do not use outside facts about how the world actually works. Judge whether the conclusion follows *necessarily* from the premises given."

  **00:05 – 00:15 | Private Commitment (The Trap)**
  *   Students read Argument X and Y silently.
  *   They complete Handout B: Verdict (Sound/Unsound) and Wager (0-50) for each.
  *   Collect Handout B immediately. (This prevents them from changing answers after discussion).
  *   *Instructor Note:* Do not look at them yet.

  **00:15 – 00:30 | Group Criteria Generation**
  *   Divide into 3 groups of 4-5 students.
  *   **Task:** "You have just evaluated two arguments that feel compelling. One tracks truth; one leads to falsehood. Without knowing which is which, agree on **three criteria** that distinguish 'Truth-Tracking Armchair Reasoning' from 'Seductive Armchair Reasoning'."
  *   Prompt them: "What makes a thought experiment reliable? Is it consistency? Simplicity? Connection to experience?"
  *   Groups write criteria on whiteboard/paper.

  **00:30 – 00:40 | The Reveal**
  *   Collect Group Criteria.
  *   **Reveal:** Argument X (Tied Bodies) is **Sound/True**. Argument Y (Ship Mast) is **Unsound/False** (The stone *does* land at the base even if the ship moves; the premise that it 'must fall behind' is the failure point).
  *   Ask for a show of hands: Who got both right? Who got both wrong? Who wagered high on the wrong one?
  *   Briefly acknowledge the pain of losing points on the Ship argument.

  **00:40 – 00:55 | Application & Stress Test**
  *   Return Group Criteria.
  *   **Task:** "Apply your three criteria to the pair now that you know the scores. Did your criteria successfully predict the winner? If not, revise one criterion."
  *   Groups discuss for 10 minutes.
  *   Instructor circulates, listening for keywords: "Hidden assumptions," "Empirical check," "Logical consistency."

  **00:55 – 01:15 | Debrief: Two Accounts of Armchair Knowledge**
  *   Bring class together. Map their findings onto two philosophical accounts.
  *   **Account 1: Empirical Unpacking.** (The armchair doesn't generate new knowledge; it clarifies hidden empirical premises).
      *   *Application:* Tied Bodies works because the premise "weights add" is empirically true. Ship Mast fails because the hidden premise "motion requires continuous force" (inertia missing) is empirically false.
  *   **Account 2: Rationalist Insight.** (The armchair perceives necessary truths about nature).
      *   *Application:* Tied Bodies works because nature *must* be consistent. Ship Mast fails because... ? (This account struggles to explain why the Ship argument felt necessary but was wrong).
  *   **Closing:** "Science uses the armchair to find contradictions, but only the world can tell you which premise to drop."

  ### V. The Debrief: Mapping the Accounts
  You must explicitly connect the room's activity to the epistemological theories.

  **1. The "Unpacking" Account (Empiricist)**
  *   **Theory:** Armchair reasoning is just a way of organizing data you already have. It makes implicit premises explicit.
  *   **On the Winner (Tied Bodies):** It worked because it exposed a contradiction in Aristotelian physics using a premise (additivity of weight) that holds up empirically.
  *   **On the Loser (Ship Mast):** It failed because it relied on a hidden empirical premise ("an object not pushed will stop") that *feels* true but is false.
  *   **Takeaway:** The "felt necessity" was just the strength of a habit, not a law of nature.

  **2. The "Insight" Account (Rationalist)**
  *   **Theory:** Some truths about nature are accessible to pure reason (e.g., symmetry, conservation).
  *   **On the Winner:** It worked because the universe *must* be logically consistent; the argument revealed a logical impossibility in the heavy-falls-faster theory.
  *   **On the Loser:** This account owes us an explanation for why the Ship argument felt necessary. It must claim the reasoner made a *logical* error, not an empirical one.
  *   **Takeaway:** This is harder to defend. The Ship argument was logically valid *given its premises*. The failure was in the premises. This suggests the "Unpacking" account is stronger.

  ### VI. Predictable Failures (First Run)
  1.  **The Physics Quiz Reflex:** Students will treat this as a test of "What do I know about gravity?" rather than "How does the reasoning work?"
      *   *Mitigation:* The opening instruction must be strict: "Ignore outside facts." The scoring rule penalizes confidence, which slows down the reflex.
  2.  **Premature Consensus:** Groups may agree on criteria like "It must be true" (circular) or "It must match reality" (begs the question, since we are judging armchair reasoning).
      *   *Mitigation:* Circulate and challenge: "How do you check that *from the armchair*?"
  3.  **Time Creep:** The Debrief is the most important part but often gets cut.
      *   *Mitigation:* Hard stop the Group Application at 55:00. Even if they haven't finished revising criteria, pull them back. The epistemological map is the learning objective; the criteria generation is just the means.

  ### VII. The Second Difficulty: What the Classroom Cannot Reproduce
  **The Limitation:** You cannot reproduce the **Stakes of Ignorance**.
  *   **What's Missing:** In the 17th century, accepting the Ship Mast argument's failure meant upending the entire cosmology and risking heresy. In this room, the stakes are "Seminar Points." The *anxiety* of not knowing is simulated, not real.
  *   **What You Must Supply:** You must verbally reconstruct the stakes in the Debrief.
      *   *Script:* "For Galileo, the Ship argument wasn't a puzzle; it was a defense against the Inquisition. If the armchair failed him, he was wrong about the universe. You have the luxury of knowing he won. When you feel the 'necessity' of the Ship argument, remember: smart people died believing that necessity was truth. That is why we need a criterion stronger than 'feeling sure'."

  ### VIII. Summary of Contamination Handling
  *   **Concession:** I concede the Tower Argument is contaminated by modern common knowledge.
  *   **Substitute:** I use the **Ship Mast** variant.
  *   **Justification:** It preserves the logical structure (relative motion vs. absolute rest) and the phenomenological error (ignoring inertia), but removes the cultural fact ("Earth moves") that shortcuts the intuition. Students are far less certain about dropped objects on moving ships than about the rotation of the Earth, restoring the symmetry of "felt necessity."
