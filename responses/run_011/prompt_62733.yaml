answer: |-
  ### Instructor's Sketch: Crux and Vulnerability

  *   **Structural vs. Content:** The question tests whether students see Wolf's objection as about *what* the Saint does (content) versus *how* the Saint values what they do (structure).
  *   **The Distinctness Claim:** Students must argue whether "Evaluative Crowding-out" is merely a redescription of motivational failure or a genuine third category of harm.
  *   **The Internal/External Gap:** The paired case forces engagement with whether two externally identical lives can differ in value solely due to practical reasoning.
  *   **Reflexivity:** The variant tests whether acknowledging the subordination of non-moral goods mitigates the harm or compounds it.
  *   **The Normative Principle:** To move beyond description, students must identify the principle (e.g., Normative Pluralism) that makes evaluative subordination a defect rather than a mere difference in scoring.
  *   **Most Vulnerable Reading:** *Evaluative crowding-out* is the most vulnerable to the objection that it begs the question against the Saint by assuming non-moral values *ought* to hold independent authority, rather than deriving authority from morality.

  ***

  ### (a) Exam Question

  **Question 1**
  Susan Wolf argues that Moral Saints are unattractive because moral commitment displaces non-moral goods. Consider three modes of displacement:
  1.  **Budgetary:** Moral activity consumes time/energy otherwise spent on hobbies.
  2.  **Motivational:** Duty corrupts the motive required to enjoy hobbies (e.g., friendship requires non-instrumental care).
  3.  **Evaluative:** The agent enjoys the hobby and has the time, but classifies it merely as a "morally permitted indulgence" rather than a constituent of the good life independent of morality.

  **Case:** Agent A gardens for the love of beauty. Agent B gardens identically, with equal joy, but only because her moral framework permits leisure to prevent burnout. **Variant:** Agent B is fully aware of this framing and reflectively endorses morality as the sole source of value.

  Is Evaluative Crowding-out a genuinely distinct phenomenon from Budgetary or Motivational crowding-out? If it is distinct, what principle must be true for this to ground an objection to the Moral Saint ideal, rather than merely expressing a preference for how we score lives? Answer with reference to Wolf's distinction between the Loving and Rational Saint. (25 marks)

  ***

  ### (b) Model Answer

  Evaluative crowding-out is a genuinely distinct phenomenon, and it represents the most damaging iteration of Wolf's objection to Moral Sainthood. While Budgetary crowding-out concerns the scarcity of resources and Motivational crowding-out concerns the psychological preconditions of specific goods, Evaluative crowding-out concerns the normative architecture of the agent's life. It is possible to have the time (no budgetary loss) and the genuine enjoyment (no motivational corruption), yet still suffer a loss in the quality of one's life because the *justification* for that enjoyment is subordinate to a single master value.

  In the paired case, Agent A and Agent B are externally indistinguishable. However, Agent A's life exhibits normative pluralism: beauty and morality are separate sources of value that sometimes compete but often coexist independently. Agent B's life exhibits normative monism: everything derives its worth from its relation to morality. Even in the Variant, where Agent B reflectively endorses this monism, the loss remains. Awareness does not cure the structural subordination; it merely makes the agent complicit in it. If Wolf is correct that a meaningful life requires engaging with non-moral values *as* non-moral, then Agent B's reflective endorsement confirms the defect rather than resolving it. She has successfully aligned her psychology with her ethics, but at the cost of failing to recognize the independent authority of the good.

  This distinction matters because Budgetary and Motivational objections can be answered by the Saint. A Rational Saint might argue they simply choose fewer hobbies (Budgetary), or that they can love friends "within the bounds of duty" (Motivational). Evaluative crowding-out bypasses these defenses. It grants the Saint everything they claim—time, joy, consistency—and still finds the life impoverished.

  For this to ground an objection to the Moral Saint ideal, rather than just a difference in scoring, the principle of **Normative Pluralism** must be true. This principle holds that human flourishing requires recognizing multiple, irreducible sources of value. If Morality were the only true value (Monism), then Agent B would be living the optimal life, and Wolf's complaint would be merely aesthetic. But if flourishing requires recognizing that some goods (art, friendship, leisure) provide reasons for action that are not moral reasons, then the Saint's life is objectively narrower. The Saint treats non-moral goods as permissions granted by a sovereign; the pluralist treats them as neighbors to the sovereign.

  Wolf's Loving Saint escapes Motivational crowding-out but may still succumb to Evaluative crowding-out if their love is contingent on moral permission. The Rational Saint almost certainly suffers it. Therefore, Evaluative crowding-out is distinct because it targets the hierarchy of justification rather than the content of action or the quality of motive. It shows that a life can be blameless and joyful, yet fail to be fully human because it refuses to acknowledge values that stand outside the moral ledger. The objection holds only if we accept that the "shape of a good life" is not determined solely by the moral point of view.

  ***

  ### (c) Marking Scheme (25 Marks)

  **Must-Hit Moves:**

  1.  **Distinctness Argument (5 marks):** Clearly argues that Evaluative crowding-out is not reducible to Budgetary (time) or Motivational (psychology) issues. Identifies it as a structural/normative defect.
  2.  **Case Analysis (5 marks):** Uses the Agent A/B pair to show that external behavior and internal enjoyment are insufficient for identical life-value; justification matters.
  3.  **Variant Handling (5 marks):** Addresses the "aware/endorsing" variant. Argues that reflexivity does not cure the subordination (or explains why it might, though the model argues it doesn't).
  4.  **Principle Identification (5 marks):** Explicitly names the underlying principle required to make this an objection (e.g., Normative Pluralism, Independent Value of Non-Moral Goods).
  5.  **Wolf Integration (3 marks):** Connects the argument back to Wolf's framework (Loving vs. Rational Saint) or the core thesis of "Moral Saints."
  6.  **Clarity and Structure (2 marks):** Essay is coherent, within word limits, and professionally styled.

  **Differentiation (First-Class vs. Upper-Second):**
  *   **Upper-Second (15-19 marks):** Correctly distinguishes the three categories and analyzes the case well. Identifies that justification matters. However, treats the "Principle" requirement vaguely (e.g., says "non-moral goods are important" without specifying the *normative structure* required). Handles the variant by asserting awareness doesn't help but lacks deep justification.
  *   **First-Class (20-25 marks):** Performs the specific move of **isolating the normative architecture**. It doesn't just say non-moral goods are good; it argues that *how they function as reasons* must be independent of morality for flourishing to occur. It explicitly tackles the "scoring lives" constraint by distinguishing objective flourishing from subjective scoring. It handles the Variant by showing why reflective endorsement of monism is itself a failure of value recognition.

  ***

  ### (d) Four Costly Mistakes

  1.  **Collapsing Evaluative into Motivational (-5 marks):** Treating Agent B's "permission" framing as just a lack of genuine love.
      *   *Why:* Misses the prompt's stipulation that Agent B feels equal joy; fails to grasp the structural distinction.
  2.  **The "Awareness Cure" (-5 marks):** Arguing that Agent B (Variant) is fine because she is authentic/autonomous about her monism.
      *   *Why:* Ignores Wolf's core claim that sainthood is undesirable even if chosen; confuses autonomy with flourishing.
  3.  **The Demandingness Pivot (-5 marks):** Ignoring the crowding-out apparatus to argue about whether morality is too demanding or impossible to follow.
      *   *Why:* Answers a standard prompt rather than the specific apparatus provided; irrelevant to the evaluative structure.
  4.  **Descriptive Drift (-5 marks):** Describing the differences between agents without identifying the *principle* that makes it an objection rather than a preference.
      *   *Why:* Fails the second half of the prompt; leaves the argument hanging as mere taste rather than value theory.
