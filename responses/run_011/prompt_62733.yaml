      *   *Vulnerability:* Which reading is most vulnerable? Evaluative crowding-out is the most vulnerable to the objection that it conflates the *moral point of view* with the *all-things-considered point of view*. If the Saint says "This is good because morality allows it," isn't that just the Moral Saint living by the Moral Point of View? The objection relies on the claim that a good life *must* include non-moral values as *independent* reasons, not just subordinate ones.

