          *   *Russellian:* Experience fills the intrinsic gap.
          *   *Solaris:* Kelvin's lab tests show Harey isn't atomic; she's "neutrinos" or something field-based. The Ocean maintains the orbit (physics role).
          *   *Analysis:* Does the Ocean fill the intrinsic nature gap? Or is it a mirror? Lem's famous line: "We don't want to conquer the cosmos; we simply want to extend the boundaries of Earth to the frontiers of the cosmos."
          *   *Verdict:* The novel *refuses* to fill the silence. The Ocean's inscrutability is an epistemic limit. Treating it as a regulator (physics) *does* pre-empt the moral question, which is part of the tragedy. The "filling in" is always anthropomorphic projection (the Visitors).

