          *   *Verdict:* The novel forces the reader to treat her as a moral patient *despite* her ontological status. Kelvin's love is the ethical anchor. If panpsychism is true, Sartorius's disruptor is murder. But the text leaves the ontology ambiguous to heighten the ethical tension.

  3.  **Drafting the "Honest Critic's Work" (Pushback):**
