answer: |-
  Dear Colleague,

  It is a rare pleasure to encounter a practitioner who sees not only the mechanics of their craft but the philosophical scaffolding holding it up. You are quite right to sense that the editorial method you describe, often loosely called the Lachmannian method, rests upon an epistemology that is rarely articulated and even more rarely defended. At its core, this practice presupposes a rationalist theory of knowledge rather than an empiricist one. While historians often speak as though they are strict empiricists, bound only to the surviving traces, the textual critic operates as a rationalist reconstructing a hidden reality from visible effects. The theory of testimony implicit here is genealogical rather than democratic. It treats manuscripts not as independent witnesses giving evidence about the author, but as dependent witnesses giving evidence about each other. In a court of law, if a hundred people testify to seeing an event, their consensus carries weight. In textual criticism, if a hundred manuscripts share a reading, they count as one witness if they all descend from a single copy. This rules out the rival view that truth in transmission is preserved by consensus or by the sheer survival of materials. Instead, it posits that truth is preserved by isolation and that error is contagious. The epistemology is one of inference to the best explanation, where the existence of a lost ancestor is a hypothetical entity posited to explain the pattern of errors in the surviving descendants.

  Regarding the direction of error, you ask whether the family-tree procedure needs error to be biased in a knowable direction or merely non-random. The strict construction of the stemma, the family tree itself, requires only that errors be non-random in the sense that they are unique events unlikely to be repeated independently. Shared nonsense proves shared lineage. However, the reconstruction of the text from that tree, particularly when branches disagree or when you are reconstructing the archetype from its children, requires a biased direction of change. The rule of the harder reading relies on a psychological law that scribes tend to simplify, clarify, and harmonize. If scribal behavior were non-random but unpredictable, or if scribes were as likely to complicate a text as to simplify it, the genealogical method could establish relationships but could not decide between variants where the branches diverge. Thus, the method strictly requires a thermodynamic arrow of textual transmission, a principle of entropy where order degrades into simplicity or familiarity. Without this bias, the editor would have no rational basis for preferring one variant over another once the genealogy is mapped, and the practice would collapse into arbitrariness.

  This leads directly to your question about conjectural emendation and the documentary principle. There is no genuine inconsistency between printing a conjecture and relying on the posited archetype, because the archetype is itself a conjecture. The archetype is a manuscript that no human eye has ever seen, reconstructed by logic from the errors of visible manuscripts. When an editor prints a conjecture because the archetype yields nonsense, she is simply extending the same logical reconstruction one step further back, from the archetype to the author. The documentary principle, which insists that access to the past runs only through surviving traces, is quietly violated by the very existence of the critical edition, which prints a text that never physically existed in the form presented. The edition is a model, not a document. Therefore, emendation adds nothing new in principle; it only increases the risk. The justification for both the archetype and the conjecture is the same: that they best explain the surviving data. The practice is philosophically underdetermined only insofar as there may be multiple hypothetical ancestors or authorial readings that explain the data equally well, but the method masks this by presenting a single reading text.

  The fragility of this epistemology becomes apparent when the tradition turns out not to be a tree. You ask what happens when scribes copied from two exemplars at once, a phenomenon known as contamination. Here the method struggles because its mathematical logic relies on bifurcation. If a manuscript draws from two branches, it violates the law of shared error that defines the branches. In such cases, the editor must either ignore the contamination and force a tree onto a network, admitting a degree of falsification, or abandon the strict genealogical method for a more eclectic approach that weighs internal probability over external lineage. This reveals that the tree is often a heuristic ideal rather than a historical reality. When the tree fails, the epistemology shifts from a strict reconstruction of history to a probabilistic assessment of what the author is likely to have written, based on style and context. This undermines the claim that the method is purely objective and historical, showing it to be partly aesthetic and psychological.

  Underlying all of this is a heavy ontological presupposition about what a work is. The method assumes that there was once a determinate text, fixed by the author at a specific moment, and that all variation is corruption. This presupposition carries far more weight than editors usually admit. It imposes a modern, Romantic idea of authorship and fixed publication onto antiquity, where texts were often fluid, revised by authors over time, or adapted by performers and readers. If the work was never a single determinate object but a fluid tradition that hardened gradually, then the goal of reconstructing the original is a category error. The editor would be reconstructing a phantom that never existed, privileging one moment of fluidity over another. By choosing the hardest reading or the earliest reconstructable stage, the editor is making a philosophical choice about the value of authorial intention versus social reception, usually without acknowledging that choice.

  Consequently, the majority objection you mention retains force only if the genealogical picture is incorrect. If the stemma is sound, the majority of copies are merely echoes of a single error, and their weight is nil. However, if the stemma is flawed, perhaps due to undetected contamination or lost branches, the majority reading might preserve a truth lost in the selected best branch. The majority objection is therefore not a rival theory of testimony but a check on the confidence of the genealogical reconstruction. It reminds the editor that the tree is a hypothesis, not a fact. Once the genealogical picture is granted as certain, the majority objection loses all logical force, but since the genealogical picture is rarely certain, the majority view serves as a valuable conservative brake on excessive ingenuity.

  Finally, consider your proposal to replace the implicit theory with an openly probabilistic one, where editions report degrees of confidence. If this were done, the clean reading text would vanish, replaced by a cloud of possibilities weighted by probability. Translators and students would lose the utility of a definitive text to work from, which is the primary social function of the critical edition. The edition serves as a interface between the messy tradition and the reader who wants a poem or a history, not a statistical model. However, we would gain epistemological honesty. We would admit that the text is a series of bets rather than a recovery of truth. The practice would change from establishing a text to modeling uncertainty. We would lose the authority of the editor as the restorer of the original, but we would gain a more accurate representation of our actual knowledge state. The current practice hides the doubt in the apparatus to preserve the illusion of a stable text in the body. A probabilistic edition would dissolve that illusion, acknowledging that in the absence of the author's hand, certainty is unavailable, and that the critical text is ultimately a sophisticated form of fiction, necessary for reading but false in its claim to be the thing itself.

  Yours sincerely,

  A Friend in Philosophy
