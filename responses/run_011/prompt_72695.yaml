  She denies that the dialogue preserves memory of the eruption, for the text describes the ground breaking but not the sky burning.

  (Flag: The summary describes Hittite letters as "from the Anatolian empire to the east"; specialist readers will note the Hittite capital is central Anatolia and the Wilusa correspondence is western, not eastern.)

  **Candidate Rules**
  1.  **Material Signature:** A narrative preserves historical memory only if the physical mechanism of the event appears in the text. (Fires on Atlantis: Rejects link because the text lacks volcanic ash.)
  2.  **Archival Silence:** A claim is false if contemporary record-keeping states fail to document it. (Fires on Atlantis: Rejects link because Egypt records no island empire.)
  3.  **Chronological Integrity:** A story cannot be transposed across millennia; magnitude of error matters. (Fires on Atlantis: Rejects link because 9,000 years is impossible.)

  **The Single Rule**
  The Material Signature rule is hers. It alone explains the Boar's-Tusk exception: at Troy she accepted the helmet because the text described the object exactly, proving oral singers could carry material details. At Atlantis, she rejects the eruption because the text describes earthquake and inundation but omits the volcano, proving the story did not carry the specific material reality of the Thera event. The other rules cannot account for why she accepts the Troy narrative's objects while rejecting its battles; only the distinction between described material and described action does that.

  **Closest Analog**
  Troy is the closest analog. Both cases hinge on Bronze Age Aegean archaeology colliding with a later textual tradition. If the analogies pull apart—accepting Troy's site but rejecting Atlantis's site—it highlights that for her, archaeology alone is insufficient; the text must mirror the archaeology's specific physical signature. The Troy mound matches the poem's city, and the helmet matches the grave goods; the Thera ash matches the cores, but the dialogue's earthquake does not match the volcano.

  **Fourth Case**
  The Hanging Gardens of Babylon. Greek texts describe specific irrigation screws and multi-storey construction (Material Signature); Babylonian contemporary archives contain no mention of them (Archival Silence).
  *   Under Material Signature: She would grant a kernel of truth regarding the technology described, even if the location is wrong, because the text carries the mechanical detail.
  *   Under Archival Silence: She would deny the Gardens existed in Babylon entirely, as the home archive is silent.

  **Better Scene**
  The Material Signature verdict makes the better scene. A reader who tracked the Boar's-Tusk exception can retrodict this outcome: she consistently privileges the survival of *things described* over the survival of *events inferred*. Choosing the Archival Silence verdict would merely repeat the logic of the Exodus and Arthur scenes, whereas the Material Signature verdict deepens the established nuance that she trusts objects in text more than actions in text.
