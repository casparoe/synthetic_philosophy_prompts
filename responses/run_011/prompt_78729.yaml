answer: |-
  Dear Colleague,

  It is a privilege to correspond with you on this matter, particularly given the weight of the work you describe. Sitting on a misconduct panel for two years must have sharpened your sensitivity to the moment when a procedural decision becomes an existential one, and I find your invocation of the Breivik case entirely apt. It is perhaps the starkest modern example of a society forced to choose between the therapeutic and the punitive, between management and answerability. You ask me to walk through this with you as a test of P.F. Strawson's account in Freedom and Resentment, and I am happy to do so, though I must warn you at the outset that while Strawson gives us a vocabulary for this tension, he does not necessarily provide a blueprint for resolving it in the high-stakes arena of state justice.

  Let us begin by mapping the episode onto Strawson's framework as precisely as the facts allow. In Strawson's view, the reactive attitudes—resentment, gratitude, indignation, guilt—are not merely emotional reactions but the constitutive elements of moral responsibility. To hold someone responsible is to be susceptible to these attitudes toward them. The objective attitude, by contrast, is the stance we take toward an object or a patient; it is the stance of management, treatment, or manipulation. When you ask where the objective attitude was adopted in the Breivik case, the most obvious locus is the first psychiatric report. By diagnosing psychosis, that report was effectively recommending that the community suspend its reactive attitudes. It was saying that Breivik was not a participant in the moral dialogue but a broken mechanism to be repaired or contained. The state, in its initial rhetoric of openness and humanity, also leaned toward this objective stance, signaling a desire to manage the aftermath without succumbing to the heat of vengeance.

  However, the removal of the lay judge adds a fascinating layer of complexity. That judge was not removed for feeling indignation, which Strawson would view as a natural and fitting response to such atrocities, but for advocating the death penalty. This suggests that the court was not trying to eliminate reactive attitudes entirely, but rather to regulate their expression to fit within a specific normative framework. The court was protecting the integrity of the process, which requires a calibrated form of indignation rather than raw outrage. When the second psychiatric report concluded Breivik was sane, it was not merely a medical correction; it was a normative green light for the reinstatement of the reactive attitudes. The court's acceptance of this report was the institutional mechanism by which society declared that resentment and moral condemnation were once again fitting.

  This brings us to the question of what was at stake for the bereaved and survivors. Your intuition that an insanity finding would have been experienced as a further injury is profoundly Strawsonian. If responsibility is constituted by our interpersonal expectations and attitudes, then to be denied the status of a responsible agent is to be excluded from the moral community. For the victims, an insanity verdict would have transformed a moral atrocity into a natural disaster. It would have meant that they were not wronged by a fellow human being but merely damaged by a force of nature. Strawson argues that we cannot sustain the objective attitude toward those we love or those with whom we interact generally, because to do so is to cease relating to them as persons. In the context of mass murder, the stakes are inverted but the logic holds: to treat the killer as merely sick is to deny the victims the standing of having been morally violated. The demand for a guilty verdict was, in this light, a demand for recognition of their moral status as persons who were wronged, not just harmed.

  Now, let us turn the case back on the theory, as you requested. Does this sequence confirm Strawson's suggestion that the objective attitude cannot generally be sustained? In one sense, yes. The first report stood for only a short time before the public and political pressure demanded a return to the reactive stance. The cost of treating Breivik purely as a risk to be managed was too high for the social fabric; it required a level of detachment that the community was unwilling to pay. However, this exposes a gap in Strawson's treatment of vicarious or impersonal attitudes. Strawson focuses largely on face-to-face interactions or the indignation we feel on behalf of others in ordinary life. He does not fully account for the institutionalization of these attitudes. The legal system is a machine designed to administer the reactive attitudes in a cooled-down, procedural form. The Breivik case shows a legal system attempting to administer the objective attitude deliberately as declared policy, then reversing course. This suggests that while individuals might struggle to sustain the objective attitude, institutions can toggle between them in ways Strawson did not explicitly anticipate. The question of which institution is entitled to allocate these attitudes remains open in Strawsonian scholarship. He assumes a kind of democratic consensus in our shared practices, but when the psychiatrists and the courts disagree, it reveals that the authority to declare someone exempt from resentment is itself a site of political contestation.

  This leads me to the claim you have been nursing, which I find both compelling and dangerous. You suggest that the shift from the first report to the second was not a change in psychiatric opinion but a change in the community's determination about whom it was prepared to resent, and that the verdict tracked what Strawson says responsibility consists in. There is a strong Strawsonian warrant for this view. If responsibility is not a metaphysical fact about the will but a status conferred by our practices, then the community's refusal to exempt Breivik effectively makes him responsible. In this reading, the psychiatric diagnosis is not a truth-condition for responsibility but merely a consideration that might incline us to withhold resentment. The second report did not discover a new metaphysical reality about Breivik's mind; it provided the cover for the community to re-engage with him as a moral agent.

  However, this interpretation risks collapsing the distinction between being psychotic and being unfit for resentment, a distinction Strawson himself needs. Strawson treats insanity as a recognized exemption because he believes there are factual conditions under which the reactive attitudes are genuinely inappropriate. If we say that the community's determination is all that matters, we risk a kind of moral voluntarism where we can choose to resent anyone, regardless of their capacity. Most scholars who work on Strawson agree that he is not a pure conventionalist; he believes our practices are answerable to the facts of human psychology. The consensus is that Strawson licenses the objective attitude in legal settings only when the agent lacks the capacity for ordinary interpersonal relationships. The open question is whether that capacity is a binary switch or a gradient, and who gets to read the meter. If your claim is that the psychiatric facts are irrelevant except as triggers for our attitudes, you go further than Strawson. He would likely insist that the psychosis diagnosis in the first report was a genuine claim about the man's psychology that, if true, would make resentment unfitting. The tragedy of the case is that we had two teams of experts disagreeing on that very fact. Your reading suggests the court chose the second report because it better served the social need for resentment, not because it was medically truer. This is a plausible sociological reading, but it strains the philosophical distinction Strawson draws between exemption (cannot participate) and mere wrongdoing (will not participate).

  We must be explicit about what is settled and what is genuinely open among those who work on this. It is settled that Strawson successfully shifted the debate from the metaphysics of free will to the pragmatics of human relationships. Few philosophers today believe we can solve the problem of responsibility without accounting for the reactive attitudes. However, it is highly contested whether Strawson's reply to the determinist succeeds. Many argue that he simply changes the subject, showing why we *feel* responsible rather than proving that we *are* responsible in a way that justifies retributive punishment. Regarding the legal setting, there is no consensus on how far Strawson's framework licenses the objective attitude. Some argue that the law should be purely objective, focused on risk management, while others, following Strawson, argue that the law must express the community's moral condemnation to be legitimate. The argument that the objective attitude cannot be sustained bears significant weight in explaining why purely rehabilitative models often fail to satisfy the public, but it does not necessarily dictate that we must maximize punishment.

  In the end, your experience on the university panel and this reflection on Breivik point to the same burden. The distinction between holding someone answerable and managing them as a risk is not merely academic because it determines whether we see the person across the table as a neighbor who has failed us or a virus that has infected us. The Breivik case confirms that while we can attempt to adopt the objective attitude for reasons of humanity or policy, the pull of the reactive attitudes is immense, especially when the injury is deep. Your claim that the verdict tracked the community's determination to resent is likely correct in a sociological sense, but philosophically, we must hope that such determination is constrained by the facts of human capacity, lest we punish those who truly cannot understand the resentment we direct at them. Strawson gives us the language to see this choice, but he cannot make the choice for us. That burden remains with you, and with the courts, every time you sit to judge.

  Yours sincerely,

  A Friend in Philosophy
