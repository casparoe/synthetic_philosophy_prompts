answer: |-
  You are looking for a code to replace your gut. Based on your nine verdicts, your intuition is not actually inconsistent; it is applying a hierarchy of evidence that distinguishes between **social mechanics**, **bodily events**, and **theological content**. You are willing to infer structure and action, but not belief or identity, unless the human body or a textual anchor is present.

  Here are three principles derived from your nine cases. They are designed to be mutually exclusive clauses that you can apply sequentially.

  ### The Principles

  **Principle 1: Functional Necessity**
  *   **Clause:** Infer a social structure, institution, or event only if the physical evidence *requires* that condition to exist. If a mundane or individual explanation is physically possible, default to that.
  *   **Purpose:** To license inferences about how society worked (Case 3, 6) while blocking inferences about complex intellectual systems (Case 8) or inconsistent social labels (Case 5).
  *   **Applies to:**
      *   **Case 3 (Weights):** Standardized ratios across space *require* an enforcing authority. An institution is functionally necessary for the weights to exist as described.
      *   **Case 6 (Feast):** High concentration of food + absence of domestic trash *requires* a specific, non-routine event. "Feast" is functionally necessary; "garbage" is ruled out by the absence of trash.
      *   **Case 8 (Stones):** Physical alignment *requires* positioning. "Calendar" or "Observatory" implies a system of timekeeping or data recording that is not functionally necessary for the stones to stand there.
      *   **Case 5 (Rank):** *This is the casualty.* In Scene 1, size *could* imply rank, but it doesn't *require* it (could be narrative focus). In Scene 2, size varies, proving rank is not functionally necessary to explain the art. To be consistent, you must reduce both to: "Size indicates emphasis in this scene." You lose the word "Rank."

  **Principle 2: Bodied Context**
  *   **Clause:** Infer intent, ritual, or violence only when there is direct physical association with human remains (burial, trauma, placement on the body) OR when the object shows deliberate destruction that precludes reuse.
  *   **Purpose:** To license inferences about "Ritual" and "Violence" (Case 1, 9) while blocking them for depositions without bodies (Case 2).
  *   **Applies to:**
      *   **Case 1 (Pot/Grave):** Associated with a child's grave. The human threshold (death) licenses the word "Ritual."
      *   **Case 9 (Mass Grave):** Trauma and projectiles on bodies. The human body licenses "Violence/Massacre" without hedging.
      *   **Case 2 (Sword/Pit):** Bent sword implies "out of use" (destruction), but the pit lacks human remains. You can say "Deliberately deposited," but "Offering" implies a recipient (god/spirit) which requires Bodied Context or Text.
      *   **Case 7 (Coin/Skull):** Coin is *on the body* (mouth). This licenses "Rite."

  **Principle 3: Analogical Restraint**
  *   **Clause:** Later textual analogues may license the *name of a practice category*, but never the *name of a deity, cosmology, or specific belief system*.
  *   **Purpose:** To allow you to use historical parallels (Case 7) without falling into the "Warlike Sun God" trap (Case 4, 7).
  *   **Applies to:**
      *   **Case 7 (Coin):** You can say "Rite known from later sources" (Practice Category). You cannot name the god (Deity).
      *   **Case 4 (Motif):** Even with wide distribution, there is no textual anchor. You cannot say "Shared Religion." You must stick to "Style."
      *   **Case 5 (Rank):** No textual anchor for the social structure. Combined with Principle 1, this reinforces the loss of "Rank."

  ***

  ### Summary of Losses
  To make this system work, you must accept one casualty: **Case 5.**
  Your gut already wavered here. Under **Principle 1**, "Rank" is a social structure that the art does not *functionally require* (especially given Scene 2). You must downgrade "Society ranked people" to "Figure size varies to show importance in this scene." You keep the observation, lose the sociological claim. This aligns with your preference to keep Case 9 (which is protected by **Principle 2**, Bodied Context).

  ***

  ### Application to New Cases

  Here is how you write the labels for your four pending objects, applying the code strictly.

  **1. The Large Building**
  *   *Evidence:* 3x footprint, no hearth/storage/trash.
  *   *Analysis:*
      *   **Functional Necessity:** Size implies coordinated labor (Institution). Lack of domestic debris implies non-residential function (Event/Space).
      *   **Bodied Context:** None.
      *   **Analogical Restraint:** None.
  *   *Verdict:* **"Public building."**
  *   *Label Text:* "This structure required significant labor to build and contains no evidence of daily domestic activity. It was likely a place for communal gatherings or administration."
  *   *Forbidden:* "Temple," "Palace," or "Chief's Hall." (These require Bodied Context or Textual Anchor).

  **2. The Forty Unfired Figurines**
  *   *Evidence:* Identical, unfired, single pit.
  *   *Analysis:*
      *   **Functional Necessity:** Unfired clay cannot be traded or used long-term. Their production *requires* a specific, single-purpose event.
      *   **Bodied Context:** None (No human remains in pit).
      *   **Analogical Restraint:** None.
  *   *Verdict:* **"Deliberately deposited."**
  *   *Label Text:* "These figures were never fired, meaning they were not made for trade or long-term use. They were created and buried together in a single event."
  *   *Forbidden:* "Votive offering," "Ritual cache." (Without human remains or text, you cannot confirm the *recipient* of the offering).

  **3. The Trepanned Skull**
  *   *Evidence:* Hole in skull, bone healed.
  *   *Analysis:*
      *   **Functional Necessity:** Healing implies survival after intervention.
      *   **Bodied Context:** **Yes.** Direct evidence on the human body.
      *   **Analogical Restraint:** None.
  *   *Verdict:* **"Surgical intervention."**
  *   *Label Text:* "This individual survived a surgical procedure to open the skull. The bone growth around the edge shows they lived for months or years afterward."
  *   *Forbidden:* "Shamanic healing," "Ritual release of spirits." (These are belief systems. The bone proves the *cut*, not the *reason*).

  **4. The Repaired Bronze Bowl**
  *   *Evidence:* Bog find, clumsy ancient repair.
  *   *Analysis:*
      *   **Functional Necessity:** Repair implies the object was valued enough to maintain. Bog placement implies deliberate removal from circulation.
      *   **Bodied Context:** None.
      *   **Analogical Restraint:** None.
  *   *Verdict:* **"Valued object, deliberately placed."**
  *   *Label Text:* "This bowl was repaired and used for a long time before being placed in the bog. The repair shows it was valued; the location shows it was deliberately removed from use."
  *   *Forbidden:* "Offering to the water," "Sacrifice." (Again, without Bodied Context or Text, you cannot name the recipient).

  ### Final Check
  Does this feel like you?
  *   It keeps the **Massacre** (Bodied Context).
  *   It kills the **Rank** (Functional Necessity).
  *   It keeps the **Weights/Institution** (Functional Necessity).
  *   It kills the **Sun God** (Analogical Restraint).
  *   It treats the **Coin** and the **Pot** similarly (Bodied Context allows "Rite"), but treats the **Sword** and **Bowl** differently (No body = "Deposited," not "Offering").

  It is stricter than your gut on the "Offering" language (Cases 2 and 4 New), but it protects you from the "confident nineties" overreach you were hired to fix.
