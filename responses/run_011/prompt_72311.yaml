answer: |-
  This is a fantastic application of Bayesian reasoning, and your spreadsheet math is correct. If you input a prior of $10^{-6}$ and a likelihood ratio of 99:1 per witness, four independent witnesses *will* overwhelm the prior. Bayes' theorem doesn't care about the subject matter; it only cares about the numbers you feed it.

  However, before you walk into that meetup and declare Hume dead, you need to know exactly where the philosophical battle lines are drawn. Hume isn't making a math error; he is making a claim about the **inputs**. Your spreadsheet is a valid engine, but Hume would argue you are fueling it with premium gasoline when the tank requires diesel.

  Here is the breakdown of why your "refutation" might bounce off a prepared interlocutor, and how to steelman Hume against your spreadsheet.

  ### 1. The "Zero Prior" Interpretation
  You asked if Hume is assuming a prior of exactly zero.
  **Verdict:** No, but he assumes a prior derived from "uniform experience."

  Hume defines a miracle as a *violation of a law of nature*. Crucially, he defines a law of nature as a regularity established by "firm and unalterable experience." If every human observation in history ($N \approx 10^{11}$ deaths observed) confirms "dead people stay dead," the prior probability isn't 1 in a million ($10^{-6}$). It is 1 in $10^{11}$ (or lower).

  If you adjust your spreadsheet prior to $10^{-11}$, you now need 6 witnesses (at 99% reliability) to get to even odds, and 12 to get to certainty. It still works mathematically. So, the prior magnitude alone doesn't save Hume. The real defense lies in the other two knobs.

  ### 2. The Independence Knob (The Biggest Leak)
  Your spreadsheet assumes $P(W_2 | W_1, \neg H) = P(W_2 | \neg H)$. It assumes witnesses are statistically independent.
  **Hume's Counter:** In historical/religious miracle claims, witnesses are almost never independent.
  *   **Collusion/Conspiracy:** Witnesses talk to each other.
  *   **Causal Chains:** In the case of the Resurrection (or most religious texts), later witnesses are often reporting on the testimony of earlier witnesses, not independent observations.
  *   **Shared Context:** If four people see a deer in downtown Chicago, they are independent. If four people are part of a messianic movement expecting a resurrection, their psychological priors are correlated.

  If the witnesses are not independent, you cannot raise the Likelihood Ratio to the power of $n$ ($LR^n$). If the correlation is high, 12 witnesses might only provide the evidentiary weight of 1.5 witnesses. If you set your spreadsheet to $n=1.5$, the miracle doesn't happen.

  ### 3. The Reliability Knob (False Positive Rate)
  You set the witness reliability at 99% ($P(\text{report} | \neg H) = 0.01$). This means there is a 1% chance a witness reports a resurrection when none occurred.
  **Hume's Counter:** This is wildly optimistic for *extraordinary* claims.
  *   **General vs. Specific Reliability:** A witness might be 99% reliable about "Did you have eggs for breakfast?" but far less reliable about "Did the laws of physics suspend themselves?"
  *   **The Psychology of the Miraculous:** Hume argues that human psychology is prone to passion, surprise, and wonder. When an event is shocking, the rate of error, hallucination, and fabrication skyrockets.
  *   **Historical Data:** We have thousands of miracle claims from every religion throughout history. Almost all of them are mutually exclusive or demonstrably false. Empirically, the rate of false miracle reports ($P(\text{report} | \neg H)$) is extremely high—likely much higher than 1%.

  If you adjust your spreadsheet to reflect a false-positive rate of, say, 10% (1 in 10 people claim a miracle falsely), your Likelihood Ratio drops from 99 to 9. Now you need many more witnesses to overcome the prior. If the false-positive rate is 50% (people claim miracles as often as they happen), the LR is 1, and no amount of testimony helps.

  ### 4. The Definition of "Law of Nature"
  There is a category error in your setup: **1 in a million.**
  If an event happens 1 in a million times, it is not a violation of a law of nature; it is a statistical outlier within the law.
  *   **Lightning striking twice:** Rare, but consistent with physics.
  *   **Lottery win:** Rare, but consistent with math.
  *   **Resurrection:** By definition, this has a frequency of 0 under current biological laws.

  Hume's argument is that the evidence *against* the miracle is not just a "prior guess," it is the sum total of all scientific observation. To update that prior, your evidence (testimony) must be stronger than the entire history of scientific observation. He argues testimony is *inherently* weaker than uniform physical experience.

  ### How to Present This at the Meetup
  If you present the spreadsheet as "Hume is mathematically wrong," a knowledgeable skeptic or philosopher will dismantle your inputs. Instead, frame it as **"Hume's argument is sensitive to parameter estimation."**

  **The Steelman Strategy:**
  1.  **Acknowledge the Math:** "Bayesian updating shows that *if* witnesses are independent and highly reliable, miracles become probable."
  2.  **Challenge the Inputs:** "Hume's argument effectively claims that for miracle claims specifically:
      *   Witness independence is near zero (correlated by culture/faith).
      *   False positive rates are high (psychology of wonder).
      *   The prior is not arbitrary, but derived from uniform experience."
  3.  **The Real Question:** "The debate isn't about Bayes' Theorem; it's about whether historical testimony can ever be strong enough to overcome the uniform experience of natural law. Hume says no. Your spreadsheet says yes, *provided* you grant high reliability and independence."

  **Conclusion:**
  You aren't confused about the math, but you might be underestimating Hume's epistemology. He isn't smuggling in a zero prior; he is smuggling in a **massive false-positive rate** and a **lack of independence**.

  If you adjust your spreadsheet to:
  *   Prior: $10^{-12}$ (Uniform experience of death)
  *   Reliability: 90% (10% false positive rate for extraordinary claims)
  *   Independence: 0.2 (High correlation among witnesses)

  ...you will likely find Hume's conclusion pops out the other end. Bring the spreadsheet, but bring the sensitivity analysis too. That will make your presentation bulletproof.
