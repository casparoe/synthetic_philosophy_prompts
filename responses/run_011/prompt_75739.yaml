answer: |-
  You are right to be wary of the arithmetic in your first pair, as the comparison between ten and ten versus eight and thirty is indeed too extreme to reliably separate egalitarianism from prioritarianism because almost any concave utility function will still favour the huge total gain of thirty-eight over twenty unless it is nearly lexically maximin. To make the divergence robust across a wide range of moderate weightings, you should adjust the numbers to ten and ten versus nine and thirteen, where the total welfare rises from twenty to twenty-two but the gap opens from zero to four. In this case, a prioritarian with a moderately concave weighting will typically prefer the unequal option because the gain of three units to the better off outweighs the loss of one unit to the worse off, whereas a strict egalitarian will prefer the equal option because the gap itself is a moral negative. For your second pair, the pure leveling down case, stick with ten and five versus five and five, as this cleanly isolates the objection where equality is gained at the cost of welfare for some and benefit for none. Your third pair for sufficiency works well if you set the threshold explicitly at ten and compare nine and nine against ten and two, forcing a choice between universal insufficiency and mixed sufficiency. I would add a fourth pair to isolate the value of the gap from the absolute position of the bottom, specifically comparing ten and twelve against five and five, where the unequal option has a much higher minimum and total but a non-zero gap. For the ballot, you must avoid asking whether an option is better in one respect, as this tips your hand. Instead, design the index cards with two columns where the first asks which option should be chosen all things considered and the second asks whether there is any moral reason to prefer the option they did not choose. This phrasing elicits the pro-tanto value of equality without naming it, allowing students to affirm that equality has moral weight even if it does not determine their final choice.

  To run this within fifty minutes you need to treat the logistics with military precision, starting with a two-minute framing where you hand out the ballots and explain that you are testing intuitions about distribution without defining the theories. Spend the next eight minutes on the spectator condition where students mark the ballots privately based on the numbers alone. Then move to the identity condition for ten minutes, where you deal sealed cards face down so each student embodies one of the numbers in the pairs and must mark a second set of ballots knowing their own stake. If you promise sweets as stakes here you must pay out, so to avoid counting delays that will destroy your timeline, pre-bag the sweets into envelopes corresponding to the outcomes before the seminar starts and hand them out instantly upon revelation of the card. If you cannot prepare this, do not use sweets as stakes but merely as props to visualize the quantities, and be honest that they are props. For the third phase, group them into committees of four for ten minutes and give them a single ballot per group, requiring unanimity within four minutes per pair or else a coin flip decides for them. This constraint forces the argumentation you want to hear about why one would choose a distribution that helps no one. Use the remaining twenty minutes for the debrief, but if the identity condition runs long because students are negotiating their stakes, cut the committee phase and move straight to the debrief using the private ballots as your data.

  When you debrief, do not start with definitions but with the data from their ballots, asking first how many marked that the leveled-down option was better all things considered and then how many marked that there was a moral reason to prefer the unequal option in that same case. This distinction maps directly onto the difference between all-things-considered judgment and pro-tanto reasons, which you can then link to the competing positions. Introduce the labels only after they have admitted to the commitments, explaining that those who preferred the equal option in the first pair despite the total loss are likely egalitarians, while those who preferred the unequal option because the total was higher and the worst off were not too badly hurt are prioritarians. For the student who insists that saying an outcome is better in one respect is innocuous, point out that if equality is a value it must be able to tip the scales in some cases, and if it never tips the scales because leveling down is never all-things-considered better, then it is not a value in the same way priority is. For the student who cheerfully accepts that leveling down is better all things considered, ask them whether they would enforce such a change if it made everyone miserable just to remove a gap, and whether that aligns with their intuition about what justice requires. You must resist the urge to validate one view over the other and instead focus on showing them that each view carries a cost they must be willing to bear.

  You should anticipate several specific failures, the most likely being that the two combative students will dominate the committee phase, which you can handle by assigning roles such as a scribe who must record everyone's view before arguing. Expect deadlocks where committees split two against two, and remind them that the coin flip rule means failure to agree is a loss of agency they should avoid. If a student works out the point halfway through and plays to the reveal, ask them to set aside the calculation and focus on the moral intuition, or use their calculation to show why the prioritarian view differs from the egalitarian view. Be candid that the exercise cannot reproduce the weight of the complaint made by relational egalitarians that what is objectionable about inequality is the relations of domination and standing it produces rather than any pattern in the numbers. You must also admit that a handful of sweets has none of the diminishing marginal utility that real welfare has, which quietly removes part of the empirical support for weighting the worse off more heavily. There is also the risk that the identity condition merely reveals self-interest rather than risk aversion, so you must distinguish between preferring equality because you fear being poor and preferring it because you think it is fair. Finally, acknowledge that a fifty-minute session cannot resolve the debate but only clarifies the cost of each commitment, and that you will supply the missing context about relational views and utility in your closing remarks.
