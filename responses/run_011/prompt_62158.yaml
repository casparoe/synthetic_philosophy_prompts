prompt: |-
  I'm a staff engineer at a mid-size infrastructure company, and twice a week I chair a forty-five-minute release review where teams ask to move forward on assumptions nobody has verified yet: that a migration is reversible, that a vendor's published latency numbers hold in our region, that a newly reorganized team can absorb the on-call rotation. The outcome currently depends on who happens to be in the room — one reviewer blocks anything without data, another approves whatever the presenting team sounds confident about. I want a procedure we can run inside those meetings, built on the old Clifford/James dispute over whether it is ever permissible to act on a belief you lack sufficient evidence for, but written for people who have never read either of them.

  Give me the questions to ask in order, what counts as a sufficient answer to each, the conditions under which proceeding without evidence is legitimate and the conditions under which it never is, and the exact step where the meeting stops and hands the call to one named person because the remaining question is about values rather than facts. Tell me which distinctions from the two positions have to survive into the checklist and which I'm allowed to drop because a forty-five-minute room of engineers can't use them — including whether James's criteria for a choice that licenses believing without proof can be checked in real time by a non-philosopher, or only asserted after the fact. Note also how the two positions treat a belief held by one team that ends up poisoning everyone else's reasoning, since that's the failure we actually see.

  Then run the procedure on three cases: shipping to five percent of traffic before the load-test results land; telling a team we believe their rewrite ships by Q3 because saying otherwise would demoralize them; and my own — committing the org to a storage architecture that three of us favor and nobody has benchmarked. I expect the third to fail, and I'd rather be told so plainly than talked around. Finish with how the procedure gets gamed (teams relabeling decisions as experiments to skip the evidence gate) and what it cannot settle at all.
reasoning: |-
  Here's a thinking process that leads to the suggested release review procedure:

  1.  **Analyze the Request:**
      *   **User:** Staff Engineer at a mid-size infrastructure company.
      *   **Problem:** Release reviews are inconsistent, relying on personality (blocker vs. pushover) rather than principle. Teams make unverified assumptions (reversibility, vendor latency, team capacity).
      *   **Goal:** A procedure/checklist for the 45-minute meeting based on the William Kingdon Clifford vs. William James debate on evidentialism vs. pragmatism (the ethics of belief), but translated for engineers who haven't read philosophy.
      *   **Requirements:**
          *   Ordered questions.
          *   Definition of sufficient answers.
          *   Conditions for proceeding without evidence vs. never proceeding.
          *   Exact handoff point to a named decision-maker (values vs. facts).
          *   Distinctions to keep/drop from Clifford/James (feasibility in 45 mins).
          *   Treatment of "poisoning beliefs" (externalities).
          *   Application to three specific cases (5% traffic, morale boost, storage architecture).
          *   Analysis of gaming the system and limitations.
      *   **Tone:** Direct, pragmatic, engineering-focused, no fluff. "Tell me plainly."

  2.  **Deconstruct the Philosophy (Clifford vs. James):**
      *   **Clifford ("The Ethics of Belief"):** "It is wrong always, everywhere, and for anyone, to believe anything upon insufficient evidence." Focus on duty to society, the cumulative harm of credulity, and the idea that beliefs inform actions which affect others.
      *   **James ("The Will to Believe"):** Counters Clifford. Sometimes we *must* decide without evidence (living option, forced choice, momentous). Waiting for evidence might mean losing the opportunity. Focus on the passional nature of certain decisions.
      *   **Synthesis for Engineering:**
          *   *Cliffordian Guardrails:* Default to evidence. Harm to others (system stability, other teams) requires high evidence.
          *   *Jamesian Exceptions:* Allow risk when the cost of delay exceeds the cost of error, *provided* the risk is contained and reversible.
          *   *The "Poisoning" Aspect:* Clifford is stronger here. A belief that corrupts the shared epistemic commons (e.g., faking metrics, assuming latency without testing) harms everyone. This must be hard-coded into the procedure.

  3.  **Drafting the Procedure (The "Release Review Protocol"):**
      *   *Constraint:* 45 minutes. Can't be academic. Must be a checklist.
      *   *Structure:*
          1.  Evidence Check (Clifford).
          2.  Reversibility/Containment Check (Jamesian safety net).
          3.  The "Forced Choice" Check (Is waiting worse than acting?).
          4.  The Handoff (Values).
      *   *Distinctions to Drop:* Deep metaphysical definitions of "belief." Nuanced historical context.
      *   *Distinctions to Keep:* The duty to the collective (Clifford) and the legitimacy of risk under constraint (James).
      *   *James in Real-Time:* James's criteria (Living, Forced, Momentous) are hard to check objectively in real-time. Need to operationalize them into "Cost of Delay" vs. "Blast Radius."

  4.  **Developing the Questions & Criteria:**
      *   Q1: What is the specific claim? (Define the belief).
      *   Q2: What evidence exists? (Clifford's baseline).
      *   Q3: If wrong, who bleeds? (Clifford's social harm).
      *   Q4: Can we undo it? (James's safety valve).
      *   Q5: Is waiting more expensive than fixing? (James's "Forced/Momentous").
      *   *Handoff:* If Q3 says "Others bleed" and Q2 says "No evidence," stop. If Q3 says "Only us" and Q4 says "Reversible," proceed. If ambiguous, Escalate to Release Owner.

  5.  **Addressing the "Poisoning" Failure Mode:**
      *   Clifford's main point: Bad beliefs spread.
      *   Mechanism: If a team assumes X without proof, and Team B builds on X, the debt compounds.
      *   Rule: Any assumption that becomes an *interface contract* requires evidence. Internal implementation assumptions can be probabilistic.

  6.  **Running the Cases:**
      *   *Case 1 (5% Traffic, no load test):*
          *   Evidence: Low.
          *   Harm: Contained (5%).
          *   Reversibility: High (kill switch).
          *   Verdict: Pass (Jamesian exception allowed due to containment).
      *   *Case 2 (Morale/Q3 Date):*
          *   Evidence: Low (belief based on hope).
          *   Harm: High (trust debt, downstream planning).
          *   Reversibility: Low (date passes, trust broken).
          *   Verdict: Fail (Cliffordian violation. Poisoning the planning commons).
      *   *Case 3 (Storage Architecture, 3 people favor, no benchmark):*
          *   Evidence: None.
          *   Harm: High (Org-wide dependency, hard to reverse).
          *   Reversibility: Low (Migration hell).
          *   Verdict: Hard Fail. (User expected this).

  7.  **Gaming and Limitations:**
      *   *Gaming:* Calling everything a "canary" or "experiment."
      *   *Counter:* Define "experiment" strictly (must have rollback and metric success criteria).
      *   *Limitations:* Cannot solve political power imbalances. Cannot solve genuine uncertainty (unknown unknowns).

  8.  **Refining the Output:**
      *   Make it punchy. Use engineering terminology (blast radius, rollback, SLO).
      *   Ensure the Clifford/James lineage is clear but not pedantic.
      *   Check the "Handoff" requirement: Who takes the call? The "Release Owner" or "Incident Commander" role.
      *   Check the "James in Real-Time" requirement: Acknowledge it's heuristic, not rigorous.

  9.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is the Jamesian criteria too abstract?
      *   *Fix:* Translate "Living, Forced, Momentous" into "Actionable, Time-Sensitive, High-Value."
      *   *Critique:* Did I address the "poisoning" aspect enough?
      *   *Fix:* Add a specific "Downstream Dependency" check.
      *   *Critique:* Is the tone right?
      *   *Fix:* Ensure it sounds like a Staff Engineer talking to other engineers, not a philosopher.

  10. **Final Polish:** Check against all constraints in the prompt. (Ordered questions, sufficient answers, conditions, handoff, distinctions, poisoning, 3 cases, gaming, limitations).

  *(Self-Correction on the Handoff)*: The prompt asks for the *exact step* where the meeting stops and hands to a named person. I need to make sure this is explicit. It should happen when the conflict is about *risk tolerance* (values), not *risk existence* (facts).

  *(Self-Correction on James in Real-Time)*: James argues you can't know if a belief is true until you act. In engineering, we can't verify that in 45 mins. We have to verify the *conditions for acting*, not the truth of the belief. I need to make that distinction clear.

  *(Final check on Case 3)*: The user expects this to fail. I must be blunt. "This is a Clifford violation. Do not do it."

  Let's assemble the response.cw
answer: |-
  Here is the procedure, the philosophical scaffolding translated into engineering constraints, and the application to your cases.

  ### The Protocol: Evidential Release Review (ERR)

  This procedure operationalizes the Clifford/James dispute. **Clifford** dictates that beliefs affecting others require evidence. **James** dictates that beliefs affecting only the actor, where delay is costly, may proceed on faith *if* reversible.

  **Timebox:** 45 Minutes.
  **Role:** Release Chair (You).
  **Output:** Go / No-Go / Escalate.

  #### Phase 1: The Claim (5 Minutes)
  **Question 1:** "State the specific assumption required for this release to succeed as a single sentence."
  *   *Sufficient Answer:* "We assume the new auth provider latency will stay under 50ms at p99."
  *   *Insufficient Answer:* "We think it'll be fine," or "The vendor says it's fast."
  *   *Clifford Distinction:* We keep Clifford's demand for specificity. Vague beliefs cannot be audited.

  #### Phase 2: The Evidence Audit (10 Minutes)
  **Question 2:** "What empirical data verifies this claim *in our environment*?"
  *   *Sufficient Answer:* "Load test results from staging matching prod topology," or "Canary data from region A."
  *   *Insufficient Answer:* "Vendor docs," "It worked in dev," or "The team is confident."
  *   *Condition:* If evidence is present and robust, **GO**. End meeting.
  *   *Condition:* If evidence is absent, proceed to Phase 3.

  #### Phase 3: The Blast Radius (10 Minutes)
  **Question 3:** "If this assumption is false, which systems or teams fail besides your own?"
  *   *Sufficient Answer:* "Only our service degrades; downstream callers hit a cached fallback."
  *   *Insufficient Answer:* "The database might lock up," or "Other teams might see intermittent 500s."
  *   *Clifford Distinction (The Poisoning Rule):* If the failure corrupts shared data, invalidates downstream assumptions, or degrades the observability of the system for *other* teams, this is a **Clifford Zone**. You cannot act without evidence. The harm is social/collective, not individual.
  *   *Condition:* If Blast Radius > Team Boundary, **NO-GO**. End meeting.

  #### Phase 4: The Reversibility & Cost Check (10 Minutes)
  **Question 4:** "If the assumption is false, how long to revert, and what is the Cost of Delay if we wait for evidence?"
  *   *Sufficient Answer:* "Revert is a config flag flip (5 mins). Cost of Delay is $50k/hour in lost checkout volume."
  *   *Insufficient Answer:* "We can patch it later," or "Waiting hurts morale."
  *   *James Distinction:* James argues we can believe without proof if the option is *Living* (plausible), *Forced* (must choose now or never), and *Momentous* (significant opportunity). In engineering, we translate this to: **High Cost of Delay + Low Cost of Error.**
  *   *Condition:* If Revert Time < 1 hour AND Cost of Delay > Cost of Error, **PROCEED TO HANDOFF**.
  *   *Condition:* If Revert Time > 1 hour OR Cost of Delay is negligible, **NO-GO**.

  #### Phase 5: The Value Handoff (10 Minutes)
  **Trigger:** You have a high Cost of Delay, low Blast Radius, but Zero Evidence.
  **Action:** The meeting stops. The decision is no longer about facts (evidence is absent by definition). It is about **Risk Tolerance**.
  **Named Person:** The **Service Owner** or **VP of Engineering** (someone with P&L responsibility, not the presenting team).
  **Script:** "We lack evidence. The risk is contained, but the delay is expensive. We are asking you to authorize a risk bet, not a technical validation. Do you accept the liability?"
  *   *Outcome:* If they sign, the release is tagged as **EXPERIMENTAL**. If they refuse, **NO-GO**.

  ---

  ### Philosophical Distinctions: Keep vs. Drop

  **Keep (Survive into Checklist):**
  1.  **Clifford's Social Duty:** A belief held by one team that poisons the reasoning of others (e.g., writing unverified data to a shared cache) is strictly forbidden. This addresses the "failure we actually see."
  2.  **James's "Forced Choice":** The recognition that waiting for 100% certainty can kill the business. This legitimizes the "5% traffic" case.
  3.  **The Reversibility Clause:** James allows faith only when the stakes are personal or contained. In infra, "contained" means "reversible without collateral damage."

  **Drop (Too heavy for 45 mins):**
  1.  **James's "Passional Nature":** Do not ask engineers if they "feel" the choice is momentous. Use Cost of Delay metrics instead.
  2.  **Clifford's "Always/Everywhere":** Clifford says *never* believe without evidence. We drop the "always." We allow belief without evidence *only* in the Jamesian narrow corridor (Reversible + Contained + High Delay Cost).
  3.  **Real-Time Verification of James:** You asked if James's criteria can be checked in real-time. **No.** You cannot know if a choice is truly "momentous" until after the fact. We substitute this with **pre-defined thresholds** (e.g., "If revert > 1 hour, evidence is mandatory"). We operationalize the philosophy into SLAs.

  ---

  ### Case Runs

  #### Case 1: Shipping to 5% traffic before load-test results land.
  *   **Q1 (Claim):** "The new payment service handles prod load."
  *   **Q2 (Evidence):** None (Load test pending).
  *   **Q3 (Blast Radius):** Contained. 5% traffic. Circuit breaker isolates failures. No shared state corruption. -> **Pass.**
  *   **Q4 (Reversibility/Cost):** Revert is instant (traffic shift). Cost of Delay is lost revenue on 5% of users.
  *   **Q5 (Handoff):** Not needed. Fits Jamesian criteria (Low risk, high delay cost).
  *   **Verdict:** **GO.** Tag as *Canary*.
  *   **Reasoning:** This is a valid Jamesian exception. The "belief" is tested *by* the action, and the action is contained.

  #### Case 2: Telling a team we believe their rewrite ships by Q3 to boost morale.
  *   **Q1 (Claim):** "Rewrite ships by Q3."
  *   **Q2 (Evidence):** None (Admittedly belief-based).
  *   **Q3 (Blast Radius):** **High.** Downstream teams will plan integrations based on this date. Marketing will schedule campaigns. This poisons the planning commons. -> **Clifford Violation.**
  *   **Q4 (Reversibility):** Low. When Q3 passes and the feature isn't there, trust is broken. You cannot "rollback" a broken promise to other departments.
  *   **Verdict:** **NO-GO.**
  *   **Reasoning:** This fails Clifford's social duty test. It externalizes the cost of your optimism onto other teams' roadmaps. It is a "poisoning belief."

  #### Case 3: Committing the org to a storage architecture three of us favor, nobody has benchmarked.
  *   **Q1 (Claim):** "New storage arch meets SLOs."
  *   **Q2 (Evidence):** None.
  *   **Q3 (Blast Radius):** **Org-wide.** All teams depend on storage. If it fails, everyone bleeds. -> **Clifford Zone.**
  *   **Q4 (Reversibility):** **Low.** Data migration is irreversible without massive cost/downtime.
  *   **Q5 (Handoff):** Even if you escalate to the VP, the Blast Radius (Q3) vetoes the Jamesian exception.
  *   **Verdict:** **HARD NO-GO.**
  *   **Reasoning:** You expected this. It fails on both Clifford (social harm) and James (irreversible). This is not a risk bet; it is negligence. Do not bring this to a release review. Bring it to an RFC process with benchmarks.

  ---

  ### Gaming and Limitations

  **How it gets gamed:**
  Teams will relabel **Decisions** as **Experiments**.
  *   *The Play:* "We aren't *committing* to the storage arch; we're *deploying* it to see if it works."
  *   *The Counter:* The Protocol defines "Experiment" strictly. An experiment must have:
      1.  A predefined success metric.
      2.  A hardcoded rollback trigger (automatic, not human).
      3.  A time limit.
      If you cannot define the rollback trigger, it is not an experiment; it is a deployment. It requires evidence.

  **What it cannot settle:**
  1.  **Power Imbalances:** If a VP demands the storage arch (Case 3) despite the protocol, this checklist will not stop them. It only exposes that they are violating the engineering ethic. It gives you the language to say "We are violating the ERR protocol," but not the authority to veto power.
  2.  **Unknown Unknowns:** The protocol assumes you know the Blast Radius. If you don't know that a change will corrupt the shared cache (because the dependency map is wrong), Q3 fails. The protocol relies on accurate system knowledge.
  3.  **The "Jamesian Hangover":** If you approve too many Jamesian exceptions (risk bets), the system becomes unstable. The protocol doesn't limit the *frequency* of exceptions, only the *conditions*. You, as Chair, must track the "Risk Debt" separately.

  **Final Instruction:**
  Print this. Put it on the screen at the start of the review. When a team presents an assumption without data, ask Q3: "If you are wrong, who bleeds?" If the answer is "Everyone," the discussion ends. If the answer is "Just us," ask Q4: "How fast can you undo it?" If they hesitate, the answer is No-Go.
