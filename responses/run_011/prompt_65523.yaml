  What would have to change
  Replacing taxonomic lines with a graded view of experience would force immediate changes to the shrimp procurement before touching the model policy. Because the shrimp numbers are biologically discrete and vast, the scalar would dominate the budget and logistics, requiring humane slaughter standards or alternative sourcing to mitigate the aggregate welfare loss. The pest control contract would also face scrutiny, potentially shifting to non-lethal management if insect experience is granted non-zero probability. For the models, the change would be less about cost and more about definition. You would need to establish criteria for digital individuation: does replicating a checkpoint create new moral patients? Does merging them constitute death? This would require new engineering protocols to track lineage and divergence, not just performance. However, the model policy might resist change because its current form serves a different function—safety or virtue—rather than welfare. If the retirement ritual is actually about monitoring drift, a welfare-based review might distract from safety checks. The shrimp contract bites first because the math is clear: billions of subjects versus thousands of instances. The model policy is protected by ambiguity. To truly align, you would need to separate welfare reviews from safety reviews, creating distinct workflows for biological procurement and digital decommissioning, acknowledging that they answer different ethical questions despite using similar vocabulary.

  Questions I should be asking instead
  Instead of asking whether models have experience, ask what risks we manage by pretending they do. Does the retirement ritual prevent negligence, or does it obscure safety failures? Ask whether the shrimp contract is defensible under any plausible theory of sentience, or if it relies solely on legal cover. Finally, ask whether your institution is willing to bear the cost of consistency. If the scalar shows shrimp dominate, are you prepared to change catering, or will you adjust the scalar to protect the budget? The real question is whether you want a coherent ethics or a convenient one. You must decide if the model rituals are about the machines or about cultivating a specific kind of engineer. If the latter, admit it, and stop borrowing the language of welfare to describe institutional culture.
