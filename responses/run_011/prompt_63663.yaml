answer: |-
  Your itch is correct. In fact, it's the single most important detail your friend glossed over, and it changes the entire philosophical weight of the theorem.

  Here is the claim-by-claim autopsy. I am not hedging: I am telling you where the math holds, where the summary lies, and who actually won the Sen/Nozick debate.

  ### 1. "Sen proved mathematically that you can't have both individual rights and efficiency."
  **Verdict: Sloppy, but directionally right.**
  *   **The Math:** Sen proved that no Social Choice Function can simultaneously satisfy three conditions: Universal Domain (any set of preferences is allowed), the Pareto Principle (if everyone prefers X to Y, society prefers X to Y), and Minimal Liberalism (at least two people have decisive power over at least one pair of options each).
  *   **The Error:** "Efficiency" is econ-speak for Pareto Optimality, which is fine. But "Individual Rights" is too broad. Sen only requires *Minimal* Liberalism (two people, one decision each). If you can't have the minimum, you can't have the maximum, so the implication holds, but the phrasing suggests a broad attack on all rights rather than a specific logical inconsistency in aggregation.
  *   **The Bet:** I bet on the theorem being valid, but I bet against the phrasing. It's not that rights *are* inefficient; it's that a specific formalization of rights clashes with a specific formalization of efficiency *under certain conditions*.

  ### 2. "In his example, one dirty book and two people: give each of them the right to decide whether they personally read it..."
  **Verdict: Right on the setup, Wrong on the implication.**
  *   **The Setup:** Yes, the famous example involves *Lady Chatterley's Lover*, a "Prude," and a "Lewd" person. Each is given the right to decide if *they* read the book.
  *   **The Error:** This phrasing implies the choices are purely private. They are not. For the theorem to generate a paradox, the preferences *must* be meddlesome.
      *   If the Prude only cared about himself, he would just not read it.
      *   If the Lewd person only cared about himself, he would just read it.
      *   **Your Itch:** You are 100% correct. The cycle *only* emerges because the Lewd person prefers the Prude to read it (to corrupt him) more than he prefers reading it himself, and the Prude prefers reading it himself (to protect the Lewd person) more than he prefers the Lewd person reading it.
      *   **Why it matters:** If preferences are strictly "self-regarding" (I only care about my own book), the impossibility vanishes (proven by Gibbard later). The theorem is not about privacy; it is about the impossibility of respecting privacy when people *won't stop caring about each other's privacy*.

  ### 3. "...and the rights plus unanimity generate a cycle, so a society that scrupulously respects each person's private choices ends up ranking an outcome that both citizens agree is worse..."
  **Verdict: Right.**
  *   **The Logic:** This is the core of the proof.
      1.  **Liberalism:** Prude decides "Prude Reads" vs. "Nobody Reads." He chooses "Nobody." Lewd decides "Lewd Reads" vs. "Nobody Reads." He chooses "Lewd Reads."
      2.  **Pareto:** Both prefer "Prude Reads" to "Lewd Reads" (Lewd wants to corrupt Prude; Prude wants to save Lewd from himself).
      3.  **The Cycle:** Society says "Nobody" > "Prude Reads" (via Prude's right). Society says "Lewd Reads" > "Nobody" (via Lewd's right). Society says "Prude Reads" > "Lewd Reads" (via Pareto).
      4.  **Result:** Lewd Reads > Nobody > Prude Reads > Lewd Reads. Intransitive cycle.
  *   **The Outcome:** If you force the cycle to resolve (e.g., by voting), you can end up at "Lewd Reads," which is the Pareto-inferior outcome (both would have preferred "Prude Reads" or "Nobody" depending on the specific profile, but usually, the theorem shows the selected outcome is Pareto-dominated by an available alternative).
  *   **The Bet:** Your friend is right here. The logic is sound.

  ### 4. "Liberty is provably inefficient — that's why the laissez-faire line that free choice and Pareto efficiency always go together is just false."
  **Verdict: Flat Wrong.**
  *   **The Error:** "Liberty is inefficient" is a category mistake. Liberty is a rule/constraint; Efficiency is a property of an outcome. You cannot call a rule "inefficient."
  *   **The Substance:** The claim that "free choice and Pareto efficiency always go together" is indeed false *in the presence of externalities in preferences*. The laissez-faire argument assumes preferences are self-regarding. Sen proved that if preferences are meddlesome (which they often are), the market/free choice mechanism does not guarantee a Pareto optimum.
  *   **The Bet:** I bet your friend is misinterpreting the conclusion. The theorem doesn't prove liberty is bad; it proves that **meddlesome preferences + liberty + Pareto** is an inconsistent triad. You have to drop one. Laissez-faire economists drop the "meddlesome preferences" assumption (assuming they don't exist or shouldn't count). Sen says you can't ignore them.

  ### 5. "Nozick said the whole thing misses the point, since rights are side constraints and not social preferences..."
  **Verdict: Right.**
  *   **Nozick's Argument:** In *Anarchy, State, and Utopia*, Nozick argues Sen treats rights as "social goals" to be maximized within a utility function. Nozick argues rights are "side constraints" on action. You don't *maximize* rights; you *respect* them. If respecting a right leads to a Pareto-inferior outcome, so be it. The violation of the right is forbidden, regardless of the social ranking.
  *   **The Bet:** This is an accurate summary of Nozick's position.

  ### 6. "...but Sen answered that a side-constraint view can't tell you what to do when rights conflict, so the paradox stands."
  **Verdict: Misleading / Overstated.**
  *   **The Reality:** Sen did argue that any workable social system needs to evaluate outcomes, and if a side-constraint system systematically produces outcomes everyone agrees are worse, it needs a stronger justification than "because rights." However, saying "the paradox stands" implies Sen refuted Nozick. He didn't.
  *   **The Clash:** They are talking past each other. Nozick rejected the *framework* of Social Choice Theory (which assumes we are ranking social states). Sen works *within* that framework.
      *   **Nozick:** "I don't rank social states. I forbid certain moves. Your theorem doesn't apply to me."
      *   **Sen:** "If you forbid moves, you still end up in a state. If that state is Pareto-inferior, your system has a cost."
  *   **The Bet:** I bet that **Nozick successfully immunized his theory against the theorem** by rejecting the premises (welfarism and social ordering). The paradox stands *for Social Choice Theory*, but it does not stand against Libertarian Deontology. Your friend implies Sen checkmated Nozick. He didn't. It's a stalemate of frameworks.

  ### Final Scorecard

  | Claim | Verdict | Why |
  | :--- | :--- | :--- |
  | **Rights + Efficiency Impossible** | **Mostly Right** | Technically "Minimal Liberalism + Pareto," but the implication holds. |
  | **The Example (Private Choices)** | **Wrong** | **Your itch is correct.** The theorem *requires* meddlesome preferences. If preferences are private, the paradox disappears. |
  | **The Cycle / Outcome** | **Right** | The logic of the intransitivity is accurately described. |
  | **"Liberty is Inefficient"** | **Wrong** | Category error. Liberty isn't an outcome. Meddlesome preferences make the *system* fail Pareto. |
  | **Nozick's Critique** | **Right** | Accurate summary of the "side constraint" argument. |
  | **Sen's Reply / Paradox Stands** | **Debatable** | Sen showed the cost of Nozick's view, but didn't refute the view itself. Nozick opted out of the game. |

  ### The Bottom Line
  Your friend's summary is **70% accurate but misses the critical nuance that validates your intuition.**

  1.  **On the Theorem:** The theorem is real, but it is not an attack on privacy. It is an attack on the idea that we can have liberty and efficiency when people are nosy. If your friend implies the theorem works even when people mind their own business, he is wrong. **You are right to be itchy.**
  2.  **On Nozick:** Your friend claims Sen won the exchange. I disagree. Nozick rejected the premise that society should be ranked by outcomes. Sen showed that rejecting that premise has costs. Neither "won," but Nozick's theory is not invalidated by Sen's theorem because Nozick explicitly rejects the Pareto Principle as a social goal when it conflicts with rights.

  **My Commitment:** If I had to bet on who is more useful for policy design, I bet on **Sen**. If I had to bet on who is more logically consistent within their own axioms, I bet on **Nozick**. But regarding your friend's summary: **Trust your itch.** The "private choice" framing is the weak link. The paradox relies entirely on the public nature of private preferences. Without that, the math doesn't work.
