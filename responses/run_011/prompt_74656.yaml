      *   *Section 3:* This is the "Rule of Recognition" trap. For Hart, the RoR is a social fact. In the GDR, the social fact among officials was "shoot escapees." The West German court said, "No, the social fact was the Constitution." This is a successor state imposing its RoR on a defunct one. Hart doesn't have a good mechanism for *inter-systemic* validity judgments of this sort. Fuller's focus on the internal morality allows an external critique of the *system's* legality regardless of official acceptance.
