answer: |-
  # DIAGNOSTIC INSTRUMENT: MORAL SENTENCE STRUCTURE

  **Instructions:** Answer the following questions in order. Do not skip ahead. Your answers will direct you to a specific position in the logical space of metaethics. Answer based on what you think the sentences *do*, not on what label you prefer.

  ### THE TREE

  **Node 1.** Look at sentence (iii): *"If plagiarizing a colleague's manuscript is wrong, then so is paying a graduate student to do it in your place."*
  Does the phrase *"plagiarizing a colleague's manuscript is wrong"* mean exactly the same thing here, inside the "if," as it does in sentence (i): *"Plagiarizing a colleague's manuscript is wrong"*?
  *   **Yes:** Go to Node 2.
  *   **No:** Go to Node 7.

  **Node 2.** Look at sentence (i).
  When a speaker asserts this sentence, are they primarily trying to describe how the world is, or are they primarily trying to influence how people act?
  *   **Describe only:** Go to Node 3.
  *   **Influence only:** (This path is closed; if you answered Yes at Node 1, you cannot say the sentence *only* influences action without changing meaning in Node 3. Return to Node 2.)
  *   **Both equally:** Go to Node 4.

  **Node 3.** Look at sentence (vi): *"Charging a drowning swimmer five thousand dollars for a tow to shore is exploitative."*
  Does this sentence describe specific non-moral facts about the swimmer rescue (e.g., that money changed hands), independent of whether the act was bad?
  *   **Yes:** Go to Leaf A.
  *   **No:** Go to Node 5.

  **Node 4.** Look at sentence (i).
  If a speaker asserts this sentence, must they necessarily have a desire or intention to stop plagiarism, even if they are just stating a fact?
  *   **Yes:** Go to Leaf B.
  *   **No:** Go to Node 5.

  **Node 5.** Look at sentence (v): *"Either plagiarizing a colleague's manuscript is wrong, or nothing is."*
  Is this sentence true simply because of the meanings of the words "Either" and "or," even if there are no moral facts in the universe?
  *   **Yes:** Go to Leaf C.
  *   **No:** Go to Node 6.

  **Node 6.** Look at sentence (iv): *"Plagiarizing a colleague's manuscript might be wrong."*
  If a speaker says this, are they saying they lack evidence about a fact, or that they haven't settled on a stance?
  *   **Lack evidence:** Go to Leaf C.
  *   **Haven't settled:** Go to Leaf B.

  **Node 7.** (Return to Node 1: You answered **No**).
  Since the phrase changes meaning inside the "if," does the phrase *"plagiarizing... is wrong"* have *any* meaning at all when it appears inside sentence (iii), or does it function only as a placeholder?
  *   **No meaning at all:** Go to Leaf D.
  *   **Different meaning:** Go to Node 8.

  **Node 8.** Look at sentence (iii).
  Does the whole sentence express one single complex state of mind, or does it link two separate states of mind together?
  *   **One single state:** Go to Node 9.
  *   **Link two states:** Go to Node 10.

  **Node 9.** Look at sentence (iii).
  If it expresses one single state, is that state a direct reaction to the combination of actions, or is it a rule about how to reason from one judgment to another?
  *   **Direct reaction:** Go to Leaf D. (Note: This converges with Node 7 logically).
  *   **Rule for reasoning:** Go to Leaf E.

  **Node 10.** Look at sentence (i).
  Is the state of mind expressed here best described as making a decision about what to do, or as accepting a general system of norms?
  *   **Decision/Plan:** Go to Node 11.
  *   **Accepting norms:** Go to Node 12.

  **Node 11.** Look at sentence (iv): *"Plagiarizing a colleague's manuscript might be wrong."*
  Does this express uncertainty about a plan you are making, or uncertainty about whether a norm applies?
  *   **Uncertainty about a plan:** Go to Leaf F.
  *   **Uncertainty about a norm:** Go to Node 12.

  **Node 12.** Look at sentence (v): *"Either plagiarizing a colleague's manuscript is wrong, or nothing is."*
  Is this sentence true because of logic alone, or does it require that moral norms actually exist?
  *   **Logic alone:** Go to Leaf G.
  *   **Requires norms:** Go to Leaf H.

  **Node 13.** Look at sentence (ii): *"It is not the case that plagiarizing a colleague's manuscript is wrong."*
  Does this deny a fact, or does it refuse to endorse the stance taken in sentence (i)?
  *   **Deny a fact:** (Inconsistent with Node 1 "No". Return to Node 1).
  *   **Refuse to endorse:** Go to Leaf H.

  ---

  ### THE LEAVES

  **Leaf A: Robust Realism**
  *   **Description of (iii):** The embedded clause describes a moral fact that serves as the condition for the second fact.
  *   **Hardest Sentence:** (iv) (Explaining moral uncertainty as factual ignorance is often counterintuitive).
  *   **Awkward Commitment:** Must explain why moral facts motivate action without being ordinary natural facts.

  **Leaf B: Ecumenical Expressivism (Ridge-style)**
  *   **Description of (iii):** The embedded clause expresses a hybrid state (belief + desire) that remains constant inside the conditional.
  *   **Hardest Sentence:** (v) (Explaining why logical truths hold for hybrid states).
  *   **Awkward Commitment:** Must explain how one psychological state can simultaneously track facts and prescribe action without splitting apart.

  **Leaf C: Minimalist Cognitivism (Deflationary Truth)**
  *   **Description of (iii):** The embedded clause has truth conditions, but "truth" is just a device for endorsement, not a robust property.
  *   **Hardest Sentence:** (vi) (Distinguishing thick concepts from thin ones without robust properties).
  *   **Awkward Commitment:** Must admit that moral truths are no more "world-guided" than jokes or tastes, if pressed on the nature of truth.

  **Leaf D: Unoccupied (No Semantic Value)**
  *   **Description of (iii):** The embedded clause contributes nothing; the sentence expresses a single attitude toward the consequence alone.
  *   **Hardest Sentence:** (iii) (Makes the "if" redundant or magical).
  *   **Awkward Commitment:** Cannot explain why we reason with moral conditionals as if the antecedent matters.

  **Leaf E: Inferentialism**
  *   **Description of (iii):** The embedded clause represents a commitment that licenses the inference to the consequent commitment.
  *   **Hardest Sentence:** (i) (Explaining atomic assertions without reducing them to inferences).
  *   **Awkward Commitment:** Must treat logic as a social practice of giving reasons rather than a relation between contents.

  **Leaf F: Norm-Expressivism (Gibbard-style)**
  *   **Description of (iii):** The embedded clause expresses a plan; the conditional expresses a plan to plan.
  *   **Hardest Sentence:** (v) (Explaining logical validity for plans).
  *   **Awkward Commitment:** Must treat all moral judgment as a species of planning, even for past actions or hypothetical agents.

  **Leaf G: Quasi-Realism (Blackburn-style)**
  *   **Description of (iii):** The embedded clause expresses an attitude, but logic is projected to make it look like fact-talk.
  *   **Hardest Sentence:** (iv) (Explaining epistemic modals for attitudes).
  *   **Awkward Commitment:** Must explain how we "earn the right" to talk of truth without actually having truth-conditions.

  **Leaf H: "Being For" Expressivism (Schroeder-style)**
  *   **Description of (iii):** The embedded clause expresses a relation of "being for" something; the conditional links these relations.
  *   **Hardest Sentence:** (ii) (Explaining negation as inconsistency in "being for").
  *   **Awkward Commitment:** Must posit a specific, uniform psychological relation for all normative judgments that is distinct from belief or desire.

  ---

  ### SEPARABILITY FLAGS

  **Pair 1: Leaf F (Norm-Expressivism) and Leaf H ("Being For")**
  *   **Status:** Not genuinely separated by this tree.
  *   **Reason:** Both views treat moral sentences as expressing non-cognitive states that obey logic. The distinction lies in the precise metaphysics of the psychological state ("planning" vs. "being for").
  *   **Distinguishing Question:** "Is the state of mind in sentence (i) identical to the state of mind you are in when you decide to take an umbrella, or is it a distinct kind of approval?" (Yes = F, No = H).

  **Pair 2: Leaf E (Inferentialism) and Leaf G (Quasi-Realism)**
  *   **Status:** Not genuinely separated by this tree.
  *   **Reason:** Both views prioritize the logical role of sentences over their representational content.
  *   **Distinguishing Question:** "When you say sentence (iii) is valid, is it because of the rules of our language game, or because of the structure of the attitudes themselves?" (Language game = E, Structure of attitudes = G).

  ---

  ### UNOCCUPIED SPACE

  **Combination 1:** Node 1 (No) + Node 7 (Meaning) + Node 2 (Describe Only).
  *   **Diagnosis:** **Incoherent.** If the meaning changes in the conditional (Node 1 No), it cannot be purely descriptive in the antecedent without collapsing back into Cognitivism (Node 1 Yes).

  **Combination 2:** Node 1 (Yes) + Node 5 (No) + Node 3 (Yes).
  *   **Diagnosis:** **Coherent but Unattractive.** This is a view where moral sentences describe facts, but logical truths like (v) are not logically true. This requires abandoning classical logic for moral discourse, a high cost for little gain.

  **Combination 3:** Node 1 (No) + Node 8 (One State) + Node 9 (Direct Reaction).
  *   **Diagnosis:** **Merely Unexplored.** This is Leaf D. It is logically possible but theoretically barren because it renders the antecedent of conditionals semantically inert, making moral reasoning impossible to model.

  ---

  ### THE HINGE

  **Node 1** is the hinge of the entire instrument.
  It asks whether moral language is **univocal** (meaning the same thing everywhere) or **context-sensitive** (changing meaning when embedded). Every major divide in metaethics rests on this choice: if the meaning is the same, you must explain how non-cognitive states fit into logic (Ecumenical/Realist); if the meaning changes, you must explain how logic survives the shift (Expressivist/Inferentialist). All subsequent nodes merely refine the specific mechanism chosen to solve the problem posed by this first answer.
