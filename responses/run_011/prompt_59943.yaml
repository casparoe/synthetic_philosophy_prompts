              *   *Honest Answer:* If the procedure is followed, 2oo3 usually passes *unless* there's a common cause failure mode (e.g., all three sensors in the same junction box that floods). I need to check if the user implies a specific flaw. They said "cost a fortune, everybody loves it." Usually, the trap is *Common Cause*. If the procedure asks "Are the sensors independent?" and the answer is "No, same rack/box," it fails. If they are truly independent, it passes. I will assume standard installation pitfalls unless told otherwise, but the prompt says "Be straight... if it genuinely doesn't [fail], say why not." Okay, I will treat it as passing *hardware* integrity but flag the *Common Cause* risk as the handoff to management.
