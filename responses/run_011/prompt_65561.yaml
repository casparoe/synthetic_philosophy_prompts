  2. Ask if the output is consumed by another automated process, addressing the downstream automation pattern. Accept "all downstream consumers are verified human interfaces" as sufficient, verdicting (a) as Agent due to payment API and (b) as Tool.
  3. Ask if the human reviewer can assess every output given volume, addressing the approval collapse pattern. Accept "review volume matches historical human-generated queues" as sufficient, verdicting (a) as Agent and (b) as Tool, marking this the weakest step due to subjective volume thresholds.
  4. Ask if the action is reversible at low cost within 24 hours. Accept "full reversal possible with less than £100 administrative cost" as sufficient, verdicting (a) as Low-Risk Agent and (b) as Low-Risk Tool.
  5. Ask if the residual risk aligns with organizational appetite regardless of controls, discarding technical safety claims as unusable at our expertise level. Accept "Risk Committee explicitly accepts the specific failure mode" as sufficient, verdicting (a) as Approved (expecting Chair dislike on agent precedent) and (b) as Approved.
