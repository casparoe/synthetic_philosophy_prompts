  2.  **Structural Detectability ($P=0.60$):** "Internal trial-and-error" can be distinguished from cached heuristics via mechanistic analysis, not just behavior.
  3.  **LLM Instantiation ($P=0.70$):** Current models utilize latent scratchpads (e.g., Chain of Thought) for computation rather than just retrieving reasoning traces.
  4.  **Origin Irrelevance ($P=0.90$):** A capacity installed by reinforcement learning counts as Popperian if it operates via internal selection now.

  **Calculation:**
  $$0.85 \times 0.60 \times 0.70 \times 0.90 = 0.3213$$

