  Place a large bag of premium candy on the table. Bring a sealed envelope containing a poem, a shuffled deck of cards, and an opaque cup filled with liquid (water). Write on the board: "Payment Condition: Actual Attitude Required." Tell the class: "For the next 20 minutes, I am purchasing mental states. Actions don't count. You will be paid in candy. However, I cannot see inside your heads. You will audit each other. If the class votes you are faking, you get nothing. If you are sincere, you get paid. No discussion of 'reasons' yet. Just claim and verify. Ensure phones are away. This requires introspection. I will make three offers. Each specifies an attitude: belief, admiration, or desire. You decide whether to claim it. The class decides whether you deserve payout. I will not judge sincerity; you will. My only role is holding the candy and reading the terms. Do not discuss the philosophy yet. Treat this as a transaction."

  **The offers**
  Before we begin, understand the contract. I am buying a state of mind. If you simulate the state, you are defrauding the seminar. The audit is peer-enforced. You are responsible for the integrity of the payout. If you claim an attitude you do not hold, you are wasting everyone's time. Treat the candy as secondary to the honesty of the claim.

  **Offer 1 (Belief):** "I have shuffled this deck thoroughly. I am offering five pieces of candy to anyone who currently *believes* the top card is the Ace of Spades. You cannot check the card. You cannot use probability. You must actually hold the belief. To claim, write 'I Believe' on a slip and sign it. This is an announcement only; there is no external proof possible. Remember, belief aims at truth. If you know it's unlikely, can you still believe? Write your claim now. You have three minutes. No talking."

  **Offer 2 (Admiration):** Distribute the poem. "I wrote this draft last night. I am offering ten pieces of candy to anyone who *admires* this poem. You have five minutes to read silently. To claim, you must write down one specific line you admire and explain why it moves you. Vague answers will not pass audit. Note: I have spent weeks refining this. Do not claim admiration based on my effort; claim it based on the text. If you only like it because of the candy, do not claim. I am watching for sincerity. Your explanation must reflect aesthetic judgment, not financial incentive. Read now."

  **Offer 3 (Desire):** Point to the opaque cup. "This contains liquid. I do not know what it is. I am offering twenty pieces of candy to anyone who genuinely *wants* to drink from this cup right now. Not 'wants the candy,' but wants the liquid. To claim, stand up and walk toward the cup. If you hesitate, you forfeit. This is about immediate desire, not instrumental calculation. If you are doing it for the sugar, stay seated. The walk must be unconditional. You have five minutes to decide."

  **Closing Instruction:** "Submit your claims. Remember, the class will vote on whether you actually hold these attitudes. If you lie, you risk public embarrassment for sugar. Decide now. You have two minutes to finalize your claims. Once submitted, no changes. The audit begins immediately after."

  **Payouts & auditing**
  Collect slips. For the Card, most will fail the audit because belief requires evidence. For the Poem, students read claims aloud. The class votes thumbs up/down on sincerity. The jokester who says "I admire it" solely for candy will be caught by the specificity requirement ("why?"). If they say "because candy," they fail the audit. If they say "the metaphor," the class judges if that's a cover. You pay only those the class certifies. This forces them to articulate what evidence of an attitude looks like from the outside. If a student claims the Card belief, ask them to bet their own candy on it. If they refuse, the class rejects the claim. The audit reveals that some attitudes (belief) leave behavioral traces (betting), while others (admiration) leave verbal traces (critique). The jokester is exposed not by you, but by peers who recognize the disconnect between the reason given and the attitude claimed. For the Glass, those who walked get paid unless they admit it was only for candy. If they admit it was only for candy, ask them: "Did you want the liquid?" If no, no pay. This distinguishes instrumental action from genuine desire.

  **Debrief**
  Now introduce "Wrong Kind of Reasons." Offer 1 (Card) illustrates impossibility of belief without evidence (state-given vs object-given). Offer 3 (Glass) shows pragmatic reasons for desire don't create the desire. Offer 2 (Poem) is the crux: My testimony was evidence (right kind), but the candy was a bribe (wrong kind). If students say candy made them look closer and they *did* like it, acknowledge this: incentives can reveal latent reasons. The candy didn't create the reason; it motivated attention to existing object-given reasons. This distinguishes motivating vs. normative reasons. Connect to Parfit: reasons for attitudes must bear on the attitude's object. The candy bears on the state of having the attitude, not the poem's quality. But attention is a bridge. Ask: "Did the candy make the poem better, or just make you look?" This clarifies the distinction between constitutive aims of attitudes and external incentives. Write "Wrong Kind of Reasons" on the board. Ask them to categorize each offer. Card = Impossible WKR. Glass = Pragmatic WKR. Poem = Mixed. Discuss the 'evidence' twist: My prior engagement was object-given evidence (I know good poems), but presented alongside a bribe. They conflated the two. This shows why WKRs are tricky: they often ride alongside RKRs. The audit process mirrored philosophical scrutiny: we looked for the right grounding for the claim.

  **What will go wrong the first time**
  Students will treat it as a game to win candy, ignoring the phenomenology. They might collude to split the candy. The audit might become popularity contest. Timing might slip; 20 minutes could become 40. The "jokester" might be convincing enough to fool the class, undermining the point about transparency. Some may feel pressured to claim attitudes to please you. The "glass" offer might trigger health anxieties instead of philosophical reflection. You might run out of candy. The debrief might feel like a lecture after the fact, disconnecting from the experience. Students may resent the audit as invasive. They might not take the 'actual attitude' constraint seriously, assuming you know they are lying anyway. The noise level during audit could drown out subtle distinctions. If no one claims the Card belief, the point lands too easily. If everyone claims the Poem, you lose the tension. You need a mix of success and failure to generate debate. Prepare fallback questions if the class is too cynical or too compliant.

  **What this activity can't reproduce**
  Candy lacks moral weight. Real WKRs involve moral obligations, not snacks. It can't show the danger of corrupting attitudes long-term. It isolates attitudes from actions too cleanly; real life mixes them. The stakes are too low to feel the corruption of belief. You can't replicate the harm of believing something false for reward. It abstracts away the social cost of holding weird attitudes. It's a simulation, not a transformation. It cannot reproduce the normative force of moral reasons. Candy is optional; morality is not. It doesn't capture the identity-constituting nature of deep commitments. You can't fake admiration for a friend's child the same way as a poem. The activity is too short to show attitude erosion. It remains a puzzle, not a life lesson.
