answer: |-
  (1) **Bottom line**
  There is no single canonical term that captures this specific dialectical shape across the literature. The closest established cluster is **self-referential consistency**, but this names the norm rather than the phenomenon. The most precise descriptive label currently in use is **endogenous refutation**, though it is not standardized. If you need a handle for your lit review, **diagonal self-exemption** best captures the move, but **endogenous diagonal refutation** best captures the situation.

  (2) **Nearest neighbours**
  **Revenge problems** are the most likely confusion. A revenge problem arises when a *solution* to a paradox generates a new paradox using the same resources (e.g., a hierarchy of truth predicates generating a new liar sentence). Your phenomenon is distinct: it is the *initial principle* that generates the counterexample, not the solution to a prior paradox. The dispute here is about the *first* restriction, not an iterative cycle. While revenge highlights the instability of repairs, your shape highlights the instability of the original principle's scope.

  **Pragmatic self-refutation** (e.g., Mackie) occurs when the *act* of asserting a principle contradicts its content (e.g., "I believe nothing"). Your cases are logical, not pragmatic; the principle can be asserted consistently, but its *content* fails for specific constructed sentences. The defender isn't claiming the assertion is impossible, but that the scope excludes the pathological instance.

  **Indefinite extensibility** (Dummett) claims certain concepts (like "truth" or "knowability") cannot be totalized without remainder. This is an ontological claim about the domain. Your phenomenon is dialectical: it concerns whether restricting the domain to exclude generated counterexamples is principled. Indefinite extensibility offers a *reason* for the restriction, but it is not the name of the dispute itself.

  **Impredicativity** is the logical structure underlying the construction (quantifying over a domain that includes the definition itself). However, impredicativity is a formal property of definitions, not a label for the dialectical situation where a defender argues that excluding impredicative instances is principled because they are theory-generated. Impredicativity explains *how* the sentence is built; it does not name the dispute over whether the principle was ever intended to cover such sentences.

  (3) **Boundary cases**
  The **Unexpected Exam** belongs firmly in this family. The announcement (the principle) creates the conditions for its own falsity once the student reasons about it. The counterexample (the exam occurring on the last day) is only paradoxical *because* of the reasoning enabled by the announcement. It is endogenous: without the announcement, the exam schedule is just a schedule. The restriction (the announcement was meaningless/false) is defended by claiming the announcement couldn't coherently apply to the reasoning it provoked.

  A **merely self-referential principle** (e.g., "All sentences are false") does *not* fit. Here, the counterexample is the principle itself, not a new sentence constructed using the principle's operators. There is no diagonalization generating a *new* instance; the principle simply trips over its own feet immediately. Your phenomenon requires the *generation* of a distinct instance (like the conjunction $p \land \neg Kp$) that was not salient prior to the principle's formulation.

  Cases where the **problematic instance was available all along** (e.g., "All swans are white" refuted by a known black swan) are **exogenous**. The counterexample exists independently of the principle. In your shape, the counterexample is *theoretically dependent*; it is constructed using the vocabulary and logic the principle introduces or relies upon. The distinction turns on whether the counterexample is discovered (exogenous) or manufactured (endogenous).

  (4) **The name**
  I propose **Endogenous Diagonal Refutation (EDR)**.
  *Definition:* A principle $P$ is subject to EDR when: (1) $P$ is refuted by a sentence $S$; (2) $S$ is constructed using the logical operators or vocabulary essential to $P$ (diagonalization); (3) $S$ would not be salient or constructible without $P$ (endogeneity); and (4) the defense of $P$ involves restricting its domain to exclude $S$ based on this generative dependence.
  *Exclusions:* This excludes standard empirical falsification (exogenous counterexamples), pragmatic self-refutation (act-based contradiction), and revenge paradoxes (solution-based iteration). It isolates the specific dispute where the theory generates the very data used to refute it, making the restriction debate turn on theoretical scope rather than empirical error.

  (5) **Where I've misdescribed it**
  Your worry is correct: "Availability" is not a logical property. The sentences exist in the language regardless of the principle. The defender isn't claiming the sentences didn't exist, but that they fall outside the *intended domain of application*. The dispute isn't about epistemic availability but about **semantic pathology**. By framing it as "available beforehand," you risk conflating the history of discovery with the logic of scope. The defender argues these sentences are *pathological*, not merely new; the restriction is principled because the principle was never intended to govern self-undermining constructions, regardless of when they were written down.
