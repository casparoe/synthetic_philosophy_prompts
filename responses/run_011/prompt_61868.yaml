answer: |-
  This is a high-stakes policy debate where analogies are doing the heavy lifting for ethical reasoning. Below is an audit of both analogies, mapping their correspondences, testing their structural integrity, and evaluating whether your Senior Curator's three conclusions actually follow from his own premises.

  ### Part 1: Audit of the "Museum as Library" Analogy

  Your Senior Curator is relying on a **Universalist/Informational** model. He treats the object as a vessel for data, and the museum as a neutral host for that data.

  #### 1. The Correspondences
  *   **The Library** $\rightarrow$ **The Museum** (A public trust institution dedicated to preservation and access).
  *   **The Book** $\rightarrow$ **The Plaque** (A container of information/history).
  *   **The Text** $\rightarrow$ **The Imagery/Iconography** (The data contained within the object).
  *   **The Reader** $\rightarrow$ **The Visitor/Online User** (Anyone seeking knowledge).
  *   **The Acquisition Desk** $\rightarrow$ **Provenance/Accessioning** (The process of legitimizing entry into the collection).

  #### 2. The Hidden Assumptions (The "Smuggling")
  To make this analogy work, the Curator is quietly assuming three things that are highly contestable:
  *   **Separability of Meaning:** He assumes the *text* (history/image) can be separated from the *book* (bronze object) without loss of value. In library science, a rare first edition has value beyond its text (provenance, materiality). In the Benin context, the *aura* and spiritual presence of the object are often considered inseparable from the bronze.
  *   **Clean Title via Market:** He assumes "Purchased, Hamburg, 1908" functions like a library buying a book from a reputable dealer. It ignores that the "market" in 1908 Hamburg was a fencing operation for the 1897 loot. In library ethics, buying stolen goods from a middleman does not cleanse the title.
  *   **The Definition of "Public":** He assumes "Humanity" is a flat demographic. He ignores the **Visa Barrier**. If the "readers" (the Edo people) cannot enter the "library" (your museum) without a visa that is systematically denied, the "open shelves" claim is functionally false.

  #### 3. Do Conclusions (1), (2), and (3) follow from Library Logic?
  Even if we grant the analogy, his three positions do not hold up to standard library ethics.

  *   **Position (1): "Return only items where provenance clearly shows violent taking."**
      *   *Library Counter-Logic:* Libraries adhere to principles similar to the **Washington Principles (1998)** regarding Nazi-looted books. If an item was looted from its rightful owner and entered the market as a result, a library *does* return it, even if the library purchased it later in "good faith."
      *   *Verdict:* **Does Not Follow.** In library ethics, a tainted origin taints the subsequent market chain. "Purchased 1908" is not a shield; it is evidence of the laundering of the 1897 theft.
  *   **Position (2): "Digitisation discharges whatever is left of any claim."**
      *   *Library Counter-Logic:* Libraries digitize to *augment* access, not to *substitute* ownership. If a community claims a sacred text or a stolen archive, the library does not say, "Here is a PDF, keep the original." Digitization is a service, not a settlement.
      *   *Verdict:* **False.** No library ethics code suggests digitization negates ownership claims.
  *   **Position (3): "'Belong to humanity' is the open-shelves principle."**
      *   *Library Counter-Logic:* Libraries have **Restricted Collections**. Some materials are restricted due to cultural sensitivity (e.g., Indigenous Knowledge protocols), fragility, or legal ownership disputes. "Open shelves" is the default, not the absolute rule.
      *   *Verdict:* **Misleading.** The "Humanity" argument is often used to block specific claims. In library science, specific ownership rights (copyright, cultural heritage laws) trump general public access.

  **Summary:** The Curator is using a 19th-century idea of a library (a warehouse of books) rather than a 21st-century one (an ethical trust). His own analogy, properly applied, undermines his position.

  ---

  ### Part 2: Audit of the "Plaques as Human Remains" Analogy

  The Benin counterpart is relying on a **Lineage/Spiritual** model. They treat the object as an extension of the ancestors and the state that created it.

  #### 1. The Correspondences
  *   **The Body** $\rightarrow$ **The Plaque** (A physical vessel containing spiritual/historical agency).
  *   **The Descendant Community** $\rightarrow$ **The Oba's Court / Edo People** (The specific lineage with rights over the remains).
  *   **The Funeral/Rites** $\rightarrow$ **Ancestral Veneration / Reinstallation** (The proper context for the object's existence).
  *   **Scientific Study** $\rightarrow$ **Academic Research in Europe** (External scrutiny that is secondary to the rights of the dead/descendants).

  #### 2. Disanalogies: Fatal vs. Non-Biting
  *   **Non-Biting Disanalogies (Interesting but don't destroy the argument):**
      *   *Materiality:* Bones decay; bronze lasts. This doesn't change the ethical claim of ownership.
      *   *Universal Taboo:* There is a global consensus on not displaying human remains. There is less consensus on art. *Counter:* This is a matter of degree, not kind. The consensus on Indigenous ancestral objects is shifting rapidly toward the "remains" model.
  *   **Fatal Disanalogies (Structural flaws in the comparison):**
      *   *Original Function:* Human remains are generally not made for public display. The Benin Plaques *were* architectural elements designed to be seen by visitors to the Oba's palace. Keeping them in a museum actually mimics their original function (public display) better than burying them would.
      *   *Individual vs. Collective:* Remains usually belong to specific families. The Plaques belong to a *State* (the Kingdom of Benin). The "Descendant" is a political entity, not just a biological lineage.

  **Summary:** The "Remains" analogy is emotionally and ethically potent regarding *sacredness* and *lineage*, but it risks mischaracterizing the objects as "burial goods" rather than "state records." However, it successfully identifies that **context is inseparable from the object.**

  ---

  ### Part 3: The Better Analogy (or The End of Analogies)

  You asked for a comparison that carries the reasoning without the smuggling. Your instinct toward **"National Archive"** is the strongest candidate, but it needs a specific framing.

  #### The Recommendation: "The Stolen State Archive"
  Treat the plaques not as books (information) and not as bones (remains), but as **Government Records.**

  *   **The Correspondence:**
      *   **The Object:** A ledger, a treaty, or a court record.
      *   **The Creator:** The Benin Kingdom (a sovereign state).
      *   **The Function:** To record the history, lineage, and authority of that state.
      *   **The Taking:** A punitive expedition (act of war) resulting in the seizure of state archives.
  *   **Why this works:**
      1.  **It bypasses the "Market" defense:** If a foreign power stole a country's national archives in 1897 and sold them to dealers, and your museum bought them in 1908, you would not claim "good faith purchase." You would recognize them as **sovereign property.**
      2.  **It solves the "Humanity" dodge:** We do not say stolen government records belong to "humanity." We say they belong to the government that created them.
      3.  **It acknowledges the "Display" function:** Archives are consulted and sometimes displayed, but they are held *in trust* for the creating state.
      4.  **It aligns with International Law:** This aligns with UNIDROIT conventions on stolen cultural property and the specific nature of the 1897 expedition (a military seizure of state assets).

  #### Does this analogy hold?
  Yes, because the Benin Plaques *were* literally the archives of the court. They recorded wars, coronations, and diplomatic contacts. They were not "art" in the modern sense; they were bureaucratic and dynastic records cast in bronze.

  #### The Honest Answer: When to Drop the Analogy
  While the "State Archive" analogy is the most robust heuristic, you should advise the working group that **analogies are for illustration, not justification.**

  The argument should ultimately rest on **Property Law and Ethics**, not metaphor.
  *   **The Legal Reality:** The 1897 expedition was a confiscation of state property. Subsequent sales were transactions in stolen goods.
  *   **The Ethical Reality:** The "Universal Museum" argument fails when the "universe" is barred by border controls.
  *   **The Policy Solution:** Move away from "Return vs. Keep." Move toward **Custodianship.** The European museum acknowledges it holds the *physical custody* temporarily, but the *title* resides with the Oba's Court. This allows for long-term loans, shared research, and eventual physical return without admitting "theft" in a way that triggers insurance nightmares, while satisfying the ethical claim.

  ### Summary for your Meeting
  1.  **The Library Analogy is broken.** Even by library standards, buying looted goods doesn't grant title, and digitization doesn't settle ownership.
  2.  **The Remains Analogy is strong on spirit, weak on function.** It captures the sacredness but misses the political nature of the objects.
  3.  **Use the "State Archive" Analogy.** It reframes the plaques as seized government records. This makes the "purchased 1908" defense irrelevant (you can't buy title to stolen state archives) and undermines the "Humanity" claim (archives belong to the state, not the public).
  4.  **Final Advice:** Tell your Senior Curator that if he wants to keep the Library analogy, he must accept the Library's ethical code on stolen property. If he won't do that, the analogy is a shield, not a tool, and should be discarded for the "State Archive" framework.
