          *   *National Archive:* Very strong. Archives hold records of state function. Benin plaques *are* state records.
          *   *Witness in a Trial:* Interesting, but abstract.
      *   *My Suggestion:* **The National Archive / State Record.**
          *   *Why:* It bridges the gap. It acknowledges the informational value (like a library) but ties ownership to the *creating entity* (like the Remains analogy).
          *   *Logic:* Archives hold records of governance. If a foreign power steals a country's government archives, they don't say "we hold this for humanity." They return it.
          *   *Alternative:* **Bailment/Trust.** The museum holds it *in trust* until the rightful owner claims it.
      *   *Honest Answer:* Analogies are heuristic tools, not proofs. The argument needs to be legal/ethical, not metaphorical. The "Archive" analogy is the strongest heuristic because it treats the plaques as *records of sovereignty*, which they historically were.

  6.  **Drafting the Response:**

