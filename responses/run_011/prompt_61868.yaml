      *   **The Conflict:**
          *   *Senior Curator's Analogy:* Museum = Library.
              *   Implications: (1) Return only violent takings (keep "purchased"), (2) Digitization discharges claims, (3) "Humanity" = Open Shelves (objectors are parochial).
          *   *Benin Counterpart's Analogy:* Plaques = Human Remains/Ancestral Artifacts.
              *   Implications: Return to specific descendants/court, context is inseparable from object, "Humanity" argument is invalid here.
      *   **Task 1: Audit the Analogies.**
          *   Map the correspondences (Library: museum, book, text, reader, acquisition desk vs. Remains: body, descendant, funeral).
          *   Identify Disanalogies: Sort into "Fatal Flaws" (destroy the analogy's use) vs. "Interesting but Non-Biting."
          *   Deep Dive on "It's a Library": Unpack assumptions (ownership without title, separability of meaning, definition of "the public"/visa issues).
          *   Test the Conclusions (1, 2, 3): Even *if* we grant the library analogy, do (1), (2), and (3) logically follow? (Consider deaccessioning, interlibrary loan, stolen goods policies).
      *   **Task 2: Propose a Better Analogy (or None).**
          *   Evaluate user's suggestions (Crown, National Archive, Witness).
          *   Determine if an analogy is the right tool at all.

  2.  **Audit: The Library Analogy (Senior Curator)**

      *   *Correspondences:*
          *   Library $\rightarrow$ Museum.
          *   Book $\rightarrow$ Plaque.
          *   Text/Content $\rightarrow$ Imagery/History on Plaque.
          *   Reader $\rightarrow$ Visitor/Online User.
          *   Acquisition Desk $\rightarrow$ Accessioning/Provenance Research.
      *   *Assumptions to Unpack:*
          *   *Ownership:* Libraries assume public trust ownership, but books are usually bought legally. Benin plaques have a "tainted market" issue.
          *   *Separability:* Text is separable from paper (scan). Is the *aura*/sacredness of the plaque separable from the bronze?
          *   *The Public:* "Humanity" vs. specific community. Visa barriers make "open access" unequal.
      *   *Testing Conclusions (1, 2, 3) against Library Logic:*
          *   (1) *Return only violent takings:* Libraries *do* return stolen goods (Nazi-looted art, stolen rare books). But "purchased" in 1908 Hamburg for items taken in 1897 Benin? In library ethics, handling stolen goods knowingly (or willfully blind) is unethical. The "market" was flooded with loot. A library wouldn't keep a book known to be looted just because they bought it from a middleman later. *Verdict: Weak.*
          *   (2) *Digitization discharges claims:* Libraries digitize to *expand* access, not to *replace* the original's ownership. Rare book rooms still exist. Digitization doesn't stop restitution claims (e.g., Nazi-looted books are still returned even if digitized). *Verdict: False.*
          *   (3) *Humanity/Open Shelves:* Libraries have special collections with restricted access based on provenance or sensitivity. Not everything is "open shelf." *Verdict: Misleading.*

  3.  **Audit: The Human Remains Analogy (Benin Counterpart)**

      *   *Correspondences:*
          *   Body $\rightarrow$ Plaque.
          *   Descendant Community $\rightarrow$ Oba's Court/Benin People.
          *   Funeral/Rites $\rightarrow$ Ancestral Veneration/Reinstallation in Palace.
          *   Medical/Scientific Study $\rightarrow$ Academic Research in Europe.
      *   *Disanalogies:*
          *   *Biological vs. Cultural:* Bones decay; bronze lasts.
          *   *Universal Taboo:* Most cultures agree on respecting remains. Not all agree on art restitution.
          *   *Function:* Remains aren't usually "displayed." Plaques *were* display objects (architectural).
      *   *Fatal Flaws vs. Non-Biting:*
          *   *Non-Biting:* Material durability.
          *   *Fatal:* The "Display" function. The plaques were made to be seen by visitors to the court. Keeping them in a museum *mimics* their original function (public display) better than burying them. However, the *audience* has changed (global tourists vs. court subjects).
          *   *Crucial Point:* The "Remains" analogy works best regarding *spiritual agency* and *lineage*, not physical fragility.

  4.  **Deep Dive: "It's a Library" Assumptions & Logic Check**

      *   *Ownership without Title:* Libraries rely on clear title chains. The 1897 Punitive Expedition creates a "fruit of the poisonous tree" scenario. Buying loot in 1908 doesn't cleanse the title in ethical library standards (see ICOM codes).
      *   *Separability:* A book's value is mostly informational. A plaque's value is material, spiritual, and contextual. You can't "scan" a sacred object's presence.
      *   *The Public:* The "Universal Museum" argument ignores power dynamics. If the "readers" (Benin people) need a visa to read the "book," the library isn't universal.
      *   *Do (1), (2), (3) follow?*
          *   (1) No. Libraries return stolen property even if purchased in good faith later (e.g., Washington Principles).
          *   (2) No. Digitization is complementary, not substitutive.
          *   (3) No. Libraries respect donor restrictions and cultural sensitivities (e.g., Indigenous knowledge protocols).

  5.  **Finding a Better Analogy (or Abandoning Analogy)**

      *   *User's Ideas:*
