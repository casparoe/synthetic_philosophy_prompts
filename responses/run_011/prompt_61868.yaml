          4.  The "Better" Analogy (Archive/Sovereign Record).
          5.  Conclusion on Analogy vs. Principle.
      *   *Tone:* Professional, analytical, rigorous, respectful of the gravity of the situation.
      *   *Key Insight to Highlight:* The "Library" analogy fails on the *market* aspect (fencing stolen goods) and the *separability* aspect (information vs. object). The "Remains" analogy fails on the *display* aspect but succeeds on the *lineage* aspect. The "Archive" analogy captures the *political* nature of the objects.

  7.  **Refining the Logic Check (Self-Correction during drafting):**
      *   *Wait, does a library return stolen books?* Yes, if identified. But the curator argues "purchased 1908" cleans the title. I need to emphasize that in the art/library world, "good faith purchase" of looted cultural property is no longer considered a valid defense (Washington Principles, 1998).
      *   *Digitization:* Libraries digitize public domain works. They don't digitize stolen manuscripts to keep them.
      *   *Visa Issue:* This is a strong point against the "Universal Access" claim. I need to make sure this lands hard.

  8.  **Final Polish:** Check against all constraints in the prompt.
