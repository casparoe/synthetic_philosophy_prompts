answer: |-
  This is an exceptionally sharp diagnosis of a problem that often gets glossed over in introductory seminars. You have correctly identified that the mathematical implementation of the Priority View relies on a metric of well-being that is far more demanding than Parfit's verbal formulation suggests. Your intuition that the "scale question" is where the interesting work lies is spot-on; this is known in the literature as the **Measurement Objection** to Prioritarianism.

  However, to make this a viable term paper proposal, you need to tighten the dialectic between Parfit and Temkin. Your current draft risks conflating the *all-things-considered verdict* with the *pro tanto reason*. Parfit's concession is that Prioritarianism and Pluralist Egalitarianism often agree on what to do (e.g., in your A vs. B case), but they disagree on *why*.

  Here is a breakdown of how to refine your argument, address the scale problem, and handle the sufficientarian comparison, followed by a suggested outline for your proposal.

  ### 1. Clarifying the Parfit/Temkin Disagreement
  You wrote: *"since a pluralist egalitarian also says that B is not better all things considered, the two views appear to deliver the same verdict."*

  This is true, but it misses Parfit's specific target. Parfit distinguishes between **Telic Egalitarianism** (equality is intrinsically good) and **Deontic Egalitarianism** (inequality is unfair). The Leveling-Down Objection (LDO) is designed to kill *Telic* Egalitarianism.
  *   **Telic Egalitarian:** Admits B is *better in one respect* (equality) than A, even if worse all things considered.
  *   **Prioritarian:** Denies B is better in *any respect*. The gain in equality is illusory; there is only the loss of utility.

  **Your Pivot:** Your paper shouldn't argue that they yield different verdicts (they often don't). It should argue that the Prioritarian avoids the LDO *only by shifting the burden to the metaphysics of well-being measurement*. If the Prioritarian cannot fix the scale non-relationally, the view collapses back into a form of relational egalitarianism, and the LDO returns.

  ### 2. The Scale/Measurement Objection (The Core of Your Paper)
  You asked: *"What licenses the concavity, and how does the prioritarian avoid having simply relocated the gap inside w?"*

  This is the strongest part of your proposal. Here is the philosophical machinery you need to deploy:

  *   **Ordinal vs. Cardinal:** Prioritarianism requires a **cardinal** measure of well-being. If well-being is only ordinal (ranking), you can transform the scale to make the priority function convex or linear. Concavity is not invariant under ordinal transformation.
  *   **The Zero-Point Problem:** Concavity is not invariant under **affine transformations** ($u' = au + b$). Adding a constant $b$ to everyone's well-being changes the degree of concavity relative to the total.
      *   *Example:* If the zero point is "death," the gap between 10 and 100 is significant. If the zero point is $-\infty$ (hell), the gap is negligible.
      *   *The Trap:* To fix the zero point, the Prioritarian needs a "natural zero" (e.g., hedonic neutrality). But if they define the zero point relative to the "worst possible life" or "average life," they have smuggled in a comparison.
  *   **The Relational Smuggling:** If the moral weight of a benefit depends on how far a person is from the zero, and the zero is determined by the range of possible lives (which depends on others), then the "absolute" priority weight is actually relational.
  *   **Argument:** The Prioritarian claims to avoid the LDO by rejecting comparisons. But to make the math work, they require a scale that is interpersonally comparable and fixed. If that scale is justified by moral considerations (e.g., "we set zero here because this is the baseline of moral concern"), those moral considerations often look suspiciously like egalitarian commitments.

  ### 3. The Sufficientarian Comparison
  You asked: *"Does an analogous objection gain any purchase on a threshold or sufficientarian view?"*

  Yes, but it takes a different form.
  *   **LDO and Sufficientarianism:** Strict Sufficientarianism is *not* vulnerable to the standard LDO. If everyone is above the threshold, leveling down involves no loss of sufficiency and no gain in equality (since equality isn't a value). The Sufficientarian says "B is in no way better than A," just like the Prioritarian.
  *   **The Analogous Objection:** The Sufficientarian faces the **Threshold Arbitrariness Objection**. Just as the Prioritarian must fix a zero-point and a scale, the Sufficientarian must fix a threshold.
      *   If the threshold is set relatively (e.g., "enough to participate in society"), it becomes relational (dependent on what others have).
      *   If the threshold is set absolutely (e.g., "biological subsistence"), it seems morally arbitrary (why is 100.1 sufficient but 99.9 not?).
  *   **Comparison:** Both views try to escape the LDO by positing an absolute standard (Scale/Zero for Prioritarians; Threshold for Sufficientarians). Both are vulnerable to the charge that these "absolute" standards cannot be defined without implicit reference to social relations or comparisons.

  ### 4. Proposal Outline (2-Page Structure)

  Here is a structure you can adapt for your Friday submission.

  **Title:** *Concavity Without Comparison? The Measurement Objection to the Priority View*

  **I. Introduction**
  *   **Context:** The move from Rawls to Parfit involves shifting from relational equality to weighted absolute well-being to avoid the Leveling-Down Objection (LDO).
  *   **Problem:** While Prioritarianism avoids the LDO in verdicts (ranking A > B in leveling-down cases), it relies on a concave transformation of well-being ($w$).
  *   **Thesis:** The Priority View avoids the LDO only by presupposing a metric of well-being (a fixed zero and unit) that is either arbitrary or implicitly relational. If the metric is relational, the LDO returns; if arbitrary, the view lacks normative force. Thus, the debate is not about weighting parameters but about the metaphysics of well-being measurement.

  **II. The Verdict vs. The Reason (Parfit vs. Temkin)**
  *   Acknowledge that Pluralist Egalitarians and Prioritarians often agree on outcomes (e.g., rejecting the leveled-down outcome B).
  *   **Crucial Distinction:** The Egalitarian admits B is *pro tanto* better (more equal); the Prioritarian denies this.
  *   **The Gap:** This distinction holds only if the priority weight is truly non-comparative. If the weight depends on a scale defined by the distribution, the distinction collapses.

  **III. The Measurement Objection**
  *   **Requirement:** Prioritarianism requires a cardinal, ratio-scale measure of well-being to define concavity meaningfully.
  *   **The Zero-Point:** Concavity is sensitive to the zero-point. Shifting the zero changes the moral weight of benefits.
  *   **The Dilemma:**
      1.  **Natural Zero:** If the zero is "hedonic neutrality," does this capture moral priority? (Objection: Moral priority might not track hedonic zeros).
      2.  **Relative Zero:** If the zero is defined by the range of lives (e.g., worst-off), the view becomes relational.
  *   **Implication:** The "concavity" is not a neutral mathematical feature; it encodes a view about where individuals stand relative to a baseline. This looks like a disguised gap comparison.

  **IV. The Sufficientarian Parallel**
  *   Sufficientarianism also claims to avoid LDO by focusing on an absolute threshold.
  *   **Parallel Vulnerability:** The "Threshold Arbitrariness" objection mirrors the "Scale Arbitrariness" objection.
  *   **Difference:** Sufficientarianism is more vulnerable to indifference objections above the threshold, whereas Prioritarianism is more vulnerable to the measurement objection. Both fail to fully escape relationality if their standards (threshold/scale) are socially determined.

  **V. Conclusion and Plan**
  *   The LDO is not merely a pressure on the *steepness* of the weighting function, but a challenge to the *intelligibility* of the function itself without relational premises.
  *   **Paper Plan:** I will formalize the scale sensitivity of the priority function, analyze Parfit's responses on measurement, and argue that the Priority View is either a version of Egalitarianism in disguise or rests on an untenable metaphysics of well-being.

  ### 5. Recommended Reading for the Proposal
  To show you've done the legwork, cite these in your bibliography or footnotes:
  *   **Parfit, D.** "Equality and Priority" (1997) – *The primary text.*
  *   **Holtug, N.** "Prioritarianism" (2008) or his work on the measurement objection.
  *   **Voorhoeve, A. & Otsuka, M.** "Prioritarianism: A Response to Critics" (2009) – *They discuss the measurement issue explicitly.*
  *   **Temkin, L.** "Equality, Priority, and the Leveling-Down Objection" (2003) – *For the egalitarian reply.*

  ### Final Advice for the "Scale" Argument
  Your reading group talked past each other because they were likely treating well-being as a given number. Your proposal will stand out if you insist that **the numbers themselves are theoretical constructs.**

  When you write the proposal, emphasize this sentence: *"Concavity is not a property of the distribution alone, but of the distribution relative to a scale. If the scale is fixed relationally, the Priority View is relationally committed."* This captures your insight cleanly and gives you a clear path for the term paper.

  Good luck with the proposal. This is a sophisticated angle that moves beyond the standard "LDO refutes Egalitarianism" intro-level take.
