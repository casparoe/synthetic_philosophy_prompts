answer: |-
  Proper scoring rules ensure your expected accuracy is maximized only by reporting your true credence (strict propriety). Consequently, your current credence looks best to you from your current perspective (immodesty); expecting another number to score better is incoherent. Good's Theorem proves free evidence always increases expected accuracy, provided you update via conditionalization on a known partition. Coherence simply means your numbers don't guarantee a loss across logical relations. The audit translates these constraints into operational checks without the algebra. We are converting epistemic utility into compliance steps.

  ***

  # THE 20-MINUTE EPISTEMIC AUDIT
  **For:** State Epi-Modeling Group
  **Purpose:** Pre-submission probability validation
  **Tools:** Pencil, paper, calculator (for sums only)

  ### STEP 1: THE COHERENCE CHECK (5 Minutes)
  *Goal: Ensure numbers hang together without guaranteeing a sure loss.*

  1.  **List all mutually exclusive outcomes** for the event you are forecasting (e.g., "Overflow in Jan," "Overflow in Feb," "No Overflow").
  2.  **Sum the probabilities.** They must equal 1.0 (or 100%).
      *   *Pass:* Sum is 1.0.
      *   *Fail:* Sum ≠ 1.0. Adjust proportionally until it does.
  3.  **Check Monotonicity.** If Event A implies Event B (e.g., "Overflow in Jan" implies "Overflow by March"), then P(A) ≤ P(B).
      *   *Pass:* P(A) ≤ P(B).
      *   *Fail:* P(A) > P(B). Correct immediately.

  > **[JUDGMENT WEARING A LAB COAT]:** You are assuming the outcomes you listed are truly exhaustive. If you leave out "Unknown/Other," you are pretending your model covers reality completely. This is not math; it is a claim about the world.

  ### STEP 2: THE IMMODESTY CHECK (5 Minutes)
  *Goal: Ensure you are reporting what you actually believe, not what you hope scores well.*

  1.  Write down your proposed number (e.g., 0.15).
  2.  Write down any *other* number you considered reporting instead (e.g., 0.20 to be "safe").
  3.  **The Simulation:** Imagine the scoring rule penalizes you based on the distance between your number and the truth. Ask: "If I knew the truth was coming tomorrow, which number would I want to have written down *right now* to minimize my penalty?"
  4.  **The Verdict:** If the answer is not the number you intend to submit, **do not submit.** You are attempting to outsmart the scoring rule. Under strict propriety, you cannot.

  > **[JUDGMENT WEARING A LAB COAT]:** This step assumes you understand the scoring rule's incentives correctly. It also assumes you are capable of distinguishing between 'what I believe' and 'what I wish were true.' That is a psychological claim, not a logical one.

  ### STEP 3: THE EVIDENCE CHECK (5 Minutes)
  *Goal: Determine if waiting for data is epistemically required or merely procrastination.*

  1.  Identify the pending evidence (e.g., "Thursday's Hospital Report").
  2.  **Condition 1 (Cost):** Is acquiring this evidence free regarding the submission deadline?
      *   *If No:* You must submit now. Record the cost of delay.
      *   *If Yes:* Proceed to Condition 2.
  3.  **Condition 2 (Update Rule):** Can you specify *now* how you will change your number based on what the report says?
      *   *If No:* You are not planning to update; you are hoping for luck. **Submit now.**
      *   *If Yes:* Proceed to Condition 3.
  4.  **Condition 3 (Relevance):** Is there at least one possible result in the report that would move your probability?
      *   *If No:* The evidence is irrelevant. **Submit now.**
      *   *If Yes:* **Wait for the evidence.** Submitting now violates the Value of Evidence.

  > **[JUDGMENT WEARING A LAB COAT]:** You are deciding what counts as "free." If delaying submission risks political capital or funding, that is a cost. You are also deciding if your planned update is rational. You might be lying to yourself about how you'll react to bad news.

  ### STEP 4: SIGN-OFF (5 Minutes)
  1.  Sign the sheet.
  2.  Attach this audit to the forecast.
  3.  **Warning:** If Step 2 or 3 failed, you are required to note *why* you overruled the audit.

  ***

  # CASE RUNS

  ### CASE 1: The Delayer (0.15 Credence)
  **Situation:** Analyst holds 0.15 for "Overflow-by-March." Submission deadline is Friday. Thursday's report arrives tomorrow. Analyst wants to wait.

  **Audit Run:**
  *   **Step 1:** Pass. (Numbers coherent).
  *   **Step 2:** Pass. (0.15 is their honest credence).
  *   **Step 3:**
      *   Condition 1 (Cost): Deadline is Friday, Report is Thursday. Cost is zero. **Pass.**
      *   Condition 2 (Update): Analyst says, "If cases are up, I'll raise to 0.3. If down, I'll drop to 0.05." **Pass.**
      *   Condition 3 (Relevance): Analyst admits either outcome moves them. **Pass.**
  *   **Verdict:** **WAIT.** Submitting 0.15 now is epistemically suboptimal. The audit forbids filing now. You are obliged to update on Thursday's free evidence.

  ### CASE 2: The Compromisers (0.3 and 0.7 Credence)
  **Situation:** Analyst A says 0.3. Analyst B says 0.7. They want to average to 0.5 to "split the difference" and file a consensus number.

  **Audit Run:**
  *   **Step 1:** Pass. (0.5 is a valid probability).
  *   **Step 2 (The Immodesty Check):**
      *   Analyst A (0.3): "If the truth comes out, is 0.5 or 0.3 closer to my current expectation?" Answer: 0.3. Reporting 0.5 expects a worse score.
      *   Analyst B (0.7): "If the truth comes out, is 0.5 or 0.7 closer to my current expectation?" Answer: 0.7. Reporting 0.5 expects a worse score.
      *   **Fail.** Both analysts are reporting a number they expect to perform worse than their own judgment.
  *   **Verdict:** **REJECTED.** You cannot file 0.5.
      *   *Why they will hate this:* The audit tells them their compromise is **epistemically dishonest**. It forces them to admit that either (a) they don't trust their own brains (in which case, why are they analysts?), or (b) they are prioritizing social harmony over accuracy. The scoring rule punishes 0.5 for both of them relative to their own credences. They must file separately or argue until one convinces the other to change their *actual* credence. Averaging is not an update; it is a surrender of agency.

  ***

  # EVALUATION OF YOUR RULE OF THUMB

  **Your Rule:** "If you can name a specific piece of evidence that would move you, you're obliged to go look for it before you report."

  **Theoretical Verdict:** **It survives, but needs a safety valve.**
  This is a colloquial statement of **Good's Theorem on the Value of Evidence**. Strictly speaking, expected accuracy always increases with free evidence if you update by conditionalization. However, your rule lacks the "cost" constraint. If looking for the evidence costs time (missing the deadline) or resources (budget), the expected accuracy gain might be outweighed by the practical loss.

  **Placement:** This belongs in **STEP 3 (The Evidence Check), Condition 1 and 3.**
  *   Modify Condition 3 to read: "Is there at least one possible result... that would move your probability?" -> **This is your rule.**
  *   Add the caveat: "Provided the cost of looking does not outweigh the accuracy gain."

  **Instruction:** Incorporate your rule verbatim into Step 3, Condition 3, but add the parenthetical "(provided acquiring it does not violate deadline or budget constraints)." This grounds your intuition in the formal requirement that evidence must be *free* to be strictly valuable.
