answer: |-
  ### I. Exam Question

  **Jurisprudence 405: Final Examination**
  **Time Allowed: 3 Hours**
  **Total Marks: 100**

  **Question 3 (30 Marks)**

  Read the following Charter and the three Episodes described below. Answer all parts of the question.

  **The Charter**

  *   **Article I (Amendment).** Any Article may be amended or repealed by a two-thirds vote of the Assembly, provided the full text of the proposed amendment was circulated to all members at least seven days before the vote.
  *   **Article II (Entrenchment).** Article I may not be amended, repealed, or suspended. No Article may be adopted whose adoption would have the effect of rendering Article I amendable, repealable, or suspendable.
  *   **Article III (Emergency).** Upon a declaration of emergency by the Chair, any Article other than Article II may be suspended for a period not exceeding thirty days. Declarations of emergency are not subject to review.
  *   **Article IV (Interpretation).** Any question concerning the meaning or application of this Charter shall be decided by the Tribunal, whose decision is final and not subject to appeal. A decision of the Tribunal is not an amendment.

  **The Episodes**

  1.  The Assembly, with proper notice and by a two-thirds vote, adopts Article V: "Article II is repealed."
  2.  That failing, the Assembly instead adopts Article V: "The Assembly may, by two-thirds vote, designate any Article as unentrenched." No designation is made at the time. Six months later, acting under Article V, the Assembly designates Article I as unentrenched; the following week, acting under Article I, it repeals Article II.
  3.  The Chair declares an emergency and suspends Article I for thirty days. On the eighth day, the Assembly passes a resolution by simple majority purporting to repeal Article II. On the thirty-first day, the Assembly adopts Article VI, retroactively validating that resolution.

  **Tasks**

  (a) Determine the validity of the actions taken in Episodes 1, 2, and 3. Justify your determinations by reference to the interaction between the Articles. (15 marks)

  (b) Imagine you sit on the Tribunal during Episode 2. Before the Assembly designates Article I as unentrenched, a member seeks a ruling on the validity of Article V. How would you rule, and what is the specific textual or logical ground for your decision? (5 marks)

  (c) State the general principle about the binding force of self-imposed limits to which your determinations commit you. Explain how Article IV constrains or enables that principle. (10 marks)

  ***

  ### II. Model Answer

  The validity of each episode turns on the hierarchy between the amendment power (Article I), the entrenchment clause (Article II), and the emergency power (Article III), as mediated by the Tribunal's interpretive authority (Article IV).

  **Episode 1** presents a direct conflict. Article I permits amendment by two-thirds vote; Article II forbids the amendment or repeal of Article I (and by extension, itself, as repealing II renders I amendable). If Article II is valid, it operates as a substantive limit on the procedure in Article I. A two-thirds vote under Article I cannot repeal Article II because Article II removes that very power from Article I's scope. To hold otherwise is to treat Article II as mere advice. Therefore, the adoption of Article V in Episode 1 is **invalid**. The system accepts that a rule can restrict the procedure that created it, provided the restriction is clear.

  **Episode 2** is the critical test. It turns on the phrase in Article II: "No Article may be adopted whose adoption would have the effect of rendering Article I amendable." The Assembly argues that Article V does not *immediately* render Article I amendable; it merely creates a mechanism that *might* do so later. However, this reading ignores the foreseeable consequence of the rule. If Article V is adopted, the Assembly *can* later unentrench Article I. Thus, the adoption of Article V *itself* has the effect of making Article I potentially amendable, violating Article II's prohibition on adopting such Articles. If we accept the Assembly's reading, Article II becomes circumventable by any actor patient enough to legislate in stages. Conversely, if we reject Article V, we accept that Article II prohibits not only direct attacks but also indirect mechanisms. As Tribunal member, I would rule Article V **invalid** at the moment of its adoption. The "effect of" clause must attach to the legal possibilities a rule creates, not merely its immediate operational commands. To rule otherwise renders entrenchment nugatory.

  **Episode 3** involves the Emergency power. Article III permits suspending any Article except Article II. Article II forbids suspending Article I. This is a textual contradiction within the Charter itself. However, Article II is an entrenchment clause; Article III is a standard power. In legal systems, entrenched provisions typically override non-entrenched ones. Therefore, the Chair's suspension of Article I was **invalid** because Article II protects Article I from suspension. Consequently, the Assembly remained bound by Article I's two-thirds requirement. The simple majority repeal of Article II was **void**. Regarding Article VI's retroactive validation: validity is a matter of pedigree at the instant of the act. A nullity cannot be cured by a later act if the later act relies on the same flawed authority. If the Assembly lacked the power to repeal Article II on day eight (because Article I was not validly suspended), it cannot grant itself that power retroactively without satisfying Article I's two-thirds requirement at the time of validation. Article VI is therefore **invalid**.

  **General Principle:** The principle committed to here is that **self-imposed limits bind the imposer until removed by the procedure specified in the limit itself.** A legal system cannot simultaneously recognize a rule as supreme and permit its bypass via procedural manipulation. This is not a logical paradox but a normative choice to prioritize stability (entrenchment) over flexibility (amendment).

  **Article IV's Role:** Article IV grants the Tribunal final interpretive authority. One might argue the Tribunal could simply *declare* Episode 2 valid, thereby making it so. However, Article IV states a decision is "not an amendment." If the Tribunal interprets Article II to permit what Article II explicitly forbids, it is effectively amending the Charter under the guise of interpretation. Thus, Article IV enables the resolution of ambiguities (e.g., the conflict between II and III) but does not grant license to ignore substantive entrenchment. The Tribunal's power is to find the law, not to suspend the constraints of Article II without violating the Charter's own hierarchy.

  ***

  ### III. Marking Scheme

  **Total Marks: 30**

  **A. Validity Determinations (15 Marks)**
  *   **Episode 1 (5 marks):**
      *   3 marks: Identifies conflict between Art I procedure and Art II prohibition.
      *   2 marks: Concludes Art II prevails (Invalid).
  *   **Episode 2 (5 marks):**
      *   3 marks: Identifies the "staging" loophole (indirect vs. direct effect).
      *   2 marks: Concludes Art V is invalid *upon adoption* (prevents circumvention).
  *   **Episode 3 (5 marks):**
      *   2 marks: Identifies conflict between Art II (no suspend) and Art III (may suspend).
      *   2 marks: Prioritizes Art II (Entrenchment > Emergency).
      *   1 mark: Rejects retroactive cure (Pedigree theory).

  **B. Tribunal Ruling (5 Marks)**
  *   3 marks: Rules on Article V *before* designation (anticipatory).
  *   2 marks: Grounds ruling on "foreseeable downstream consequences" vs. "immediate text."

  **C. General Principle & Article IV (10 Marks)**
  *   **Principle (5 marks):** Articulates that limits bind until removed by their own specified procedure (Self-Embracing Sovereignty).
  *   **Article IV (5 marks):** Recognizes Tribunal power is interpretive, not legislative. Acknowledges that if Tribunal ignores Art II, entrenchment is merely nominal.

  **Grade Boundaries**
  *   **A (25–30):** Coherent theory across all episodes. Explicitly engages with the "effect of" timing in Ep 2. Nuanced handling of Art IV (interpretation vs. amendment).
  *   **B (18–24):** Correct outcomes but weaker reasoning. May treat Ep 2 as valid until the designation step. Treats Art IV as absolute without qualification.
  *   **C (12–17):** Identifies conflicts but resolves them arbitrarily. Misses the staging in Ep 2.
  *   **D/F (0–11):** Fundamental misunderstandings of the text.

  **Error Codes (For Feedback)**
  *   **[FORM]** *The Formalist Fallacy:* Invalidates Ep 2 simply because Art II is entrenched, without engaging the "staging" argument.
  *   **[REG]** *Infinite Regress:* Claims the problem cannot be solved without a higher meta-charter.
  *   **[REAL]** *Realist Reduction:* Argues validity depends solely on who holds power/politics, ignoring the normative force of the rules.
  *   **[WAND]** *The Magic Wand:* Treats Art IV as allowing the Tribunal to override substantive limits without legal consequence.
  *   **[TIME]** *Temporal Blindness:* Fails to address the retroactivity issue in Ep 3 (validity at instant vs. later cure).

  ***

  ### IV. Variant Question (Next Year)

  **Change:** Replace **Article III (Emergency)** with **Article III (Ratification):** "Any resolution passed by simple majority shall become valid if ratified by the Tribunal within thirty days. Tribunal ratification is not subject to appeal."
  **Episode 3 Adjustment:** The Assembly passes a simple majority resolution to repeal Article II. The Tribunal ratifies it.

  **Marking Scheme Shift:**
  The marks allocated to **Episode 3** shift from analyzing *suspension/pedigree* to analyzing *delegation*. The core question becomes whether Article II's substantive bar ("No Article may be adopted...") limits the Tribunal's ratification power under Article IV/III. Students must argue whether "ratification" counts as "adoption" under Article II. The **[TIME]** error code is replaced by **[DEL]** *Delegation Error* (assuming power can be delegated to bypass substantive limits).
