answer: |-
  # ADVERSARIAL COLLABORATION DRAFT: THE SLEEPING BEAUTY PROTOCOL
  **Status:** Draft v1.0 for Review by Halfer and Thirder Principals
  **Date:** October 26, 2023
  **Prepared By:** Neutral Arbiter

  ## 1. COMMON GROUND (CLAIMS FOR SIGNATURE)

  The following claims are presented as the baseline consensus. Signing indicates acceptance of the problem constraints and the elimination of specific red herrings.

  1.  **The Setup:** The coin is fair. The objective chance of Heads on Sunday is $1/2$. Beauty knows the full protocol. The amnesia drug is effective; awakenings are subjectively indistinguishable.
  2.  **Sunday Credence:** On Sunday, before the toss (or immediately after, before sleep), Beauty's credence in Heads is $1/2$.
  3.  **Tuesday Information:** If Beauty is informed upon awakening that it is Tuesday, her credence in Heads becomes $0$ (since Heads implies no Tuesday awakening).
  4.  **Monday Information:** If Beauty is informed upon awakening that it is Monday, her credence in Heads returns to $1/2$. (Both parties agree that eliminating the Tails-Tuesday centered possibility restores the original coin odds).
  5.  **Not About Memory Mechanics:** The puzzle does not depend on the neurological plausibility of the amnesia drug, nor on quantum branching. It is a problem of classical probability and epistemology.
  6.  **Not Eliminativist:** Both parties agree that "credence in Heads" is a meaningful quantity to discuss. Neither party claims the question is meaningless or that Beauty should have no opinion.
  7.  **Betting Connection:** Credence should generally guide betting behavior to avoid sure losses (Dutch Books) in standard scenarios. However, both parties acknowledge that the *structure* of a bet (e.g., whether it is offered once per experiment or once per awakening) affects the acceptable price, independent of credence.
  8.  **No "Use-Case" Retreat:** The parties agree that the answer should not simply be "it depends on what you use it for." While decision-theoretic utility may vary by context, the epistemic credence itself is claimed to be a fixed value upon awakening.

  ## 2. DISAGREEMENTS TABLE

  | Issue | Thirder Formulation | Halfer Formulation | Substantive or Merely Verbal? | Reason |
  | :--- | :--- | :--- | :--- | :--- |
  | **The Meaning of Credence** | Credence in a hypothesis upon self-locating awakening should reflect the proportion of indistinguishable centered moments in which the hypothesis is true. | Credence in a hypothesis should reflect the objective chance of the world-state obtaining, regardless of how many times an observer samples that state. | **Substantive** | This is not just semantics; it is a disagreement over which norm governs rational belief (Centered Accuracy vs. World Accuracy). |
  | **New Evidence** | The fact "I am awake now" is new evidence, because it is more likely to be experienced in a Tails world (two opportunities) than a Heads world (one opportunity). | The fact "I am awake now" is not new evidence, because Beauty knew in advance she would be awakened at least once regardless of the coin outcome. | **Substantive** | Disagreement on whether indexical information ("now") updates non-indexical hypotheses (Coin Toss). |
  | **The Reference Class** | The relevant sample space for credence is the set of *awakenings*. (3 possible awakenings: H-Mon, T-Mon, T-Tue). | The relevant sample space for credence is the set of *experiments*. (2 possible outcomes: Heads, Tails). | **Verbal / Methodological** | If both agree on the mapping from sample space to betting odds, this may be a choice of modeling language. However, it drives the numerical divergence. |
  | **Diachronic Consistency** | It is rational to change credence from 1/2 (Sunday) to 1/3 (Monday) without receiving new non-indexical information, due to the shift in self-location. | It is irrational to change credence from 1/2 (Sunday) to 1/3 (Monday) without new non-indexical information; this violates the Principle of Reflection. | **Substantive** | A clash between competing norms of temporal rationality. |

  ## 3. STIPULATED CASES

  Both parties must record a definite answer. If a view yields "no fact of the matter," this must be stated explicitly.

  ### Case A: Vouchers
  **Scenario:** At *every* awakening, Beauty may buy vouchers at price $p$. Each voucher pays $1 at the end of the experiment if the coin landed Heads. Purchases are cumulative (if she buys 2 vouchers on Tails, she pays $2p$ and gets $0).
  **Question 1:** What is the highest $p$ at which she should buy a voucher at each awakening?
  **Question 2:** Does this number settle the question about her credence?
  **Question 3:** What should she have accepted had the offer been made once, on Sunday, to a precommitting agent whose choice binds every later awakening?

  | Party | Max Price $p$ (Per Awakening) | Does $p$ = Credence? | Precommitment Price (Sunday) |
  | :--- | :--- | :--- | :--- |
  | **Thirder** | $1/3$ | **Yes.** The betting quotient *is* the credence. | $1/3$ (Per voucher). The strategy is consistent. |
  | **Halfer** | $1/3$ | **No.** $p=1/3$ reflects the bet structure (penalized twice on Tails), not the credence ($1/2$). | $1/3$ (Per voucher). The expected value calculation is identical. |

  *Note: Both parties agree on the betting price ($1/3$) due to the expected value calculation: $EV = 0.5(1-p) + 0.5(-2p)$. Break-even at $p=1/3$. The disagreement is strictly on whether this price reveals the credence.*

  ### Case B: Sequential Copies (Teleportation)
  **Scenario:** Sunday person scanned/destroyed. Heads: One instance instantiated Monday. Tails: One instance Monday, second instance Tuesday (no memory of first).
  **Question 1:** Do the answers from the original puzzle carry over?
  **Question 2:** If they change, which premise does that expose as doing the work?

  | Party | Credence Carries Over? | If No, Which Premise Matters? |
  | :--- | :--- | :--- |
  | **Thirder** | **Yes.** (Credence remains 1/3). | N/A. The structure of observer-moments is identical. |
  | **Halfer** | **Yes.** (Credence remains 1/2). | N/A. The coin chance is unchanged by instantiation method. |
  | **Alternative Halfer View** | **No.** (Credence might shift). | If the Halfer views "continuous identity" as crucial, destruction might alter the self-locating evidence. (To be confirmed by Principal). |

  *Instruction to Principals: If you answer "No" to Question 1, you must identify whether the work is done by "destruction of the original" or "discontinuity of consciousness."*

  ### Case C: Simultaneous Copies
  **Scenario:** As in Case B, except on Tails both instances are instantiated *at the same time* in separate rooms. Both are woken simultaneously. Both know the protocol.
  **Question 1:** What is the credence in Heads upon waking?
  **Question 2:** Is this intuitively distinct from the original Sleeping Beauty case?

  | Party | Credence in Heads | Distinct from Original? |
  | :--- | :--- | :--- |
  | **Thirder** | $1/3$ | **No.** The temporal spacing is irrelevant; there are still 3 observer-moments (1 H, 2 T). |
  | **Halfer** | $1/2$ | **No.** The coin is still fair. The existence of a duplicate elsewhere does not change the coin outcome. |
  | **Alternative View** | **Varies** | **Yes.** Some argue simultaneous existence removes the "time" confusion, making the Halfer position stronger (or Thirder stronger, depending on view). |

  ## 4. THE CRUXES

  These are the sub-questions such that settling one would move at least one party. Ranked by estimated impact on the disagreement.

  **Crux 1: The Nature of "New Evidence" (Rank: High)**
  *   **Question:** Does the indexical proposition "I am awake now" have a different likelihood under Heads vs. Tails?
  *   **Thirder Prediction:** Yes. $P(Awake|Tails) = 2 \times P(Awake|Heads)$ in terms of observer-moments.
  *   **Halfer Prediction:** No. $P(Awake|Tails) = 1$ and $P(Awake|Heads) = 1$ in terms of guaranteed experience.
  *   **Settling Condition:** Agreement on whether likelihoods should be calculated over *worlds* or *centered-worlds*.

  **Crux 2: The Norm of Accuracy (Rank: Medium)**
  *   **Question:** Should Beauty's belief minimize error per *experiment* or per *awakening*?
  *   **Thirder Prediction:** Per awakening. (She wants to be right most times she is asked).
  *   **Halfer Prediction:** Per experiment. (She wants to be right about the coin toss itself).
  *   **Settling Condition:** Agreement on the scoring rule (e.g., Brier Score) applicable to self-locating agents.

  **Crux 3: The Principle of Reflection (Rank: Medium)**
  *   **Question:** Is it a violation of rationality to know on Sunday that you will believe 1/3 on Monday without receiving outside information?
  *   **Thirder Prediction:** No. Self-locating information changes upon waking.
  *   **Halfer Prediction:** Yes. This is diachronic inconsistency.
  *   **Settling Condition:** A mutually accepted formalization of Reflection for indexical beliefs.

  ## 5. FALSIFIABILITY

  Each side must identify one argument that would force abandonment of their position, and one objection they currently cannot adequately answer.

  ### Thirder
  *   **Falsifying Argument:** A demonstration that holding credence 1/3 forces a Dutch Book *even when bets are offered once per experiment* (not per awakening), without relying on "double counting" the Tails bet.
  *   **Unanswered Objection:** The "Sunday/Monday" Reflection problem: How to justify shifting from 1/2 to 1/3 without new non-indexical evidence, while maintaining that Sunday Beauty is rational.

  ### Halfer
  *   **Falsifying Argument:** A demonstration that holding credence 1/2 forces Beauty to accept a set of bets at each awakening that guarantees a loss across the experiment, where the bets are deemed "fair" by the 1/2 credence standard.
  *   **Unanswered Objection:** The "Frequency" problem: In the long run, 2/3 of all awakenings occur in Tails worlds. If credence is not 1/3, in what sense does Beauty's belief align with the frequency of her own experiences?

  ## 6. CLOSING ASSESSMENT

  **Neutral Evaluation of the Dispute**

  Upon reviewing the stipulated cases and the disagreements table, the following assessment is offered:

  1.  **Verbal Component:** A significant portion of the dispute is verbal, centering on the definition of "credence." If "credence" is defined as "the price at which one bets per awakening," the Thirder wins by definition. If "credence" is defined as "the objective chance of the coin," the Halfer wins by definition. Case A demonstrates that both parties agree on the *betting price* ($1/3$) in the standard setup, suggesting the behavioral output is identical.
  2.  **Substantive Component:** However, a substantive disagreement remains regarding **epistemic norms**.
      *   The Thirder claims that rational belief *ought* to track the frequency of observer-moments (Centered Accuracy).
      *   The Halfer claims that rational belief *ought* to track the objective chance of world-states (World Accuracy).
      *   This is not merely verbal because it leads to divergent recommendations in cases where betting structures are removed and only accuracy scoring remains (e.g., if Beauty is scored on her belief without any monetary payout).
  3.  **Residual Disagreement:** Once the "betting price" agreement is granted, the remaining dispute is about **which sample space is normatively privileged for self-locating belief**.
      *   If the goal is to maximize the number of true beliefs held by Beauty-over-time, 1/3 is correct.
      *   If the goal is to maximize the number of true beliefs held about the external world per experiment, 1/2 is correct.

  **Conclusion:** The dispute is not *purely* verbal, but it is largely driven by a lack of consensus on the *purpose* of credence in self-locating contexts. If the parties agree that credence is purely a guide for decision-making, the numerical disagreement dissolves (as both bet at 1/3). If the parties insist credence is a measure of truth-tracking, the disagreement persists as a clash between two valid but incompatible accuracy norms.

  **Recommendation:** The collaboration should proceed by explicitly decoupling "Betting Quotient" from "Epistemic Credence." Determine if there is any scenario where the Betting Quotient diverges between the two views. If not, the remaining conflict is purely about the labeling of internal states, which may be dissolved by adopting a dual-term vocabulary (e.g., "World-Credence" vs. "Center-Credence").

  ***

  **Signatures:**

  _________________________ (Halfer Principal)

  _________________________ (Thirder Principal)

  _________________________ (Neutral Arbiter)
