      *(Wait, one more check)*: The user mentioned the "Two Rowers." I should briefly mention how that fits. It shows convention without promise. Promise adds the *sign*. In the user's case, the sign was given. The convention exists. The rowers are gone. But the habit of rowing remains in the user.

