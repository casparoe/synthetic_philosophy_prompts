      *   "Don't want general Hume commentary."

      *(Self-Correction on the "Orphan Promise" analysis)*: I need to be careful. Hume is a utilitarian of sorts regarding the *origin* of justice. If the act has zero utility and no one knows, does the obligation vanish? Hume addresses this in the context of paying debts to "vicious" people or misers. He says we follow the *general rule* because relaxing it endangers the whole fabric. So the "orphan promise" is bound by the need to keep the *internal* fabric intact, even if the external fabric isn't threatened. I need to emphasize the *internalization of the convention*.

  7.  **Final Output Structure:**
      *   Intro: Solidarity on the text difficulty.
