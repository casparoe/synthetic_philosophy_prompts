answer: |-
  ### 1. Failure modes I'm targeting

  The failures share a topology of silence. The spec describes the happy path and nominal errors, but treats the background world as a static backdrop. This creates three specific failure modes. First, liveness failures: the machine waits for a condition that never arrives because the spec didn't define a timeout or an alternative path when the world refuses to cooperate. Second, interface drift: hardware is treated as an abstract ideal rather than a physical component subject to replacement, noise, or calibration drift. Third, distribution shift: learned behaviors are treated as static functions rather than statistical models dependent on training data distributions that may diverge from reality. The core error is treating the specification as a closed logical system when the deployment environment is an open physical system. The still-life clause exacerbates this by legally formalizing the assumption that nothing changes unless specified. This procedure targets the gap between the closed world of the document and the open world of the greenhouse. It forces the engineer to enumerate the boundaries of the closed world assumption rather than pretending the boundary doesn't exist.

  ### 2. The procedure

  **Step 1: Variable Inventory**
  *Question:* Does the document list every sensor input and actuator output the behavior touches?
  *Pass:* A table exists mapping every variable used in the logic to a physical hardware ID and data type.
  *Fail:* Variables are referenced implicitly (e.g., "the door sensor") without unique identifiers or data ranges.
  *Type:* Mechanical.
  *Handoff:* None.

  **Step 2: Environmental Invariants**
  *Question:* Does the document explicitly list every property of the world assumed to remain constant?
  *Pass:* A section titled "Assumed Environmental Invariants" lists properties like gravity, network latency, or pot weight ranges.
  *Fail:* The document relies on the still-life clause or omits this section entirely.
  *Type:* Judgment call wearing a checklist costume. The engineer must decide what counts as an invariant versus a variable.
  *Handoff:* None.

  **Step 3: Timeout Specification**
  *Question:* Does every wait state have a defined duration and a failure action?
  *Pass:* Every conditional wait includes a maximum time limit and a specific error state or recovery behavior triggered when exceeded.
  *Fail:* Any wait state lacks a duration or defaults to "wait indefinitely."
  *Type:* Mechanical.
  *Handoff:* None.

  **Step 4: Sensor and Actuator Tolerance**
  *Question:* Are hardware replacement and noise bounds accounted for?
  *Pass:* The spec defines acceptable signal ranges and explicitly states behavior if a sensor is swapped for a different model within the approved vendor list.
  *Fail:* The spec assumes exact signal values or ignores hardware revision changes.
  *Type:* Judgment call. Requires knowledge of supply chain variance.
  *Handoff:* None.

  **Step 5: Policy Distribution Bounds**
  *Question:* For learned behaviors, are the input distribution limits defined?
  *Pass:* The spec lists the statistical bounds of the training data (e.g., lighting conditions, object textures) and mandates a monitor for drift.
  *Fail:* The learned policy is treated as a deterministic function with no mention of input distribution limits.
  *Type:* Judgment call. Requires ML expertise.
  *Handoff:* None.

  **Step 6: Residual Risk Statement**
  *Question:* Does the document explicitly state what risks remain after these controls?
  *Pass:* A paragraph lists known unmitigated risks (e.g., "extreme humidity may cause false positives") and assigns ownership.
  *Fail:* The document claims full coverage or implies zero risk.
  *Type:* Values question.
  *Handoff:* **YES.** This step hands the decision to a safety stakeholder. The checklist verifies the risk is stated, but the stakeholder must decide if the risk is acceptable. This is a values question because it trades safety margins against operational uptime and cost. No algorithm can determine the acceptable probability of a dropped tray versus a stalled line.

  **Step 7: Verification Mapping**
  *Question:* Is there a test case for every invariant and timeout listed?
  *Pass:* A traceability matrix links each invariant and timeout to a specific verification test.
  *Fail:* Invariants are listed but not tested.
  *Type:* Mechanical.
  *Handoff:* None.

  **Step 8: Final Release Gate**
  *Question:* Have all Judgment Call steps been signed by a senior engineer?
  *Pass:* Signatures present on Steps 2, 4, and 5.
  *Fail:* Missing signatures.
  *Type:* Mechanical.
  *Handoff:* **YES.** This hands the final release authority to the project lead. This is a values question because it authorizes the deployment of known imperfections. The lead accepts responsibility for the judgment calls made in Steps 2 and 4, balancing technical debt against market pressure.

  This procedure addresses the representation frame problem by forcing explicit listing of dependencies and what stays the same. It punts on the relevance frame problem. It cannot predict which unlisted variables will become relevant tomorrow. It ensures the document matches the current understanding of the system, not that the understanding is complete.

  ### 3. Still-life clause: verdict

  The still-life clause is logically indefensible in a physical deployment. It asserts a falsehood: that unmentioned conditions remain constant. In reality, unmentioned conditions are simply unmonitored, not constant. Keeping it encourages laziness in boundary definition. It must be replaced by a section titled "Assumed Environmental Invariants." This section must list every property of the world the code relies on remaining stable without verification. Examples include gravity, network latency bounds, or pot weight ranges. If a property is not listed there, the code must not assume it holds. This shifts the burden from proving nothing changes to explicitly stating what we are betting stays the same. It turns an implicit logical axiom into an explicit engineering constraint that can be reviewed and tested.

  ### 4. Change budget: verdict

  The change budget is a category error. You cannot count unhandled changes because by definition they are unknown. Assigning a number implies risk is additive and quantifiable like currency, when it is actually structural and contextual. A single unhandled change in a safety-critical path is worse than ten in a logging subroutine. Replace the budget with a Change Classification Matrix. Changes are categorized by type (sensor swap, algorithm update, environmental shift) and impact level (safety, performance, cosmetic). Each category has a predefined verification requirement. A sensor swap might require hardware-in-the-loop testing; a potting mix change requires data drift analysis. Release approval is based on completing the required verification for the class of change, not on spending a budget of ignorance. This acknowledges that some changes break the model entirely, regardless of how many other changes you handled.

  ### 5. Worked runs

  **Draft 1: Weigh-and-Return-Tray**
  *Fragment:* "Arm moves to Station B. If scale reads stable weight, record value. If scale busy, wait. Return tray to Rack." Still-life clause present.
  *Procedure Result:* Fails Step 3 (Timeout Specification). The "wait" condition lacks a duration. Fails Step 2 (Environmental Invariants). No mention of scale capacity limits.
  *Verdict:* **Revise.** The machine will hang indefinitely if the scale jams. Add a 10-second timeout and define max weight.

  **Draft 2: Halt-on-Open-Door**
  *Fragment:* "If Door Sensor reads HIGH, stop rail immediately. Sensor part number X-100." Still-life clause present.
  *Procedure Result:* Fails Step 4 (Sensor Tolerance). No behavior defined if Sensor X-100 is replaced by X-101 which has different noise characteristics. Fails Step 2. Assumes sensor signal is binary without accounting for occlusion or dirt.
  *Verdict:* **Revise.** Define signal thresholds and required behavior for sensor fault states, not just open/closed.

  **Draft 3: ML Pot-Grasp Policy**
  *Fragment:* "Neural network determines grasp point based on camera feed. System executes grasp." Still-life clause present. No mention of training data.
  *Procedure Result:* Fails Step 5 (Policy Distribution Bounds). No definition of lighting or pot colors covered by training. Fails Step 6 (Residual Risk). No statement on what happens if the pot is a color not seen in training.
  *Verdict:* **Reject.** This spec treats a statistical model as a deterministic law. It cannot be released without defining the operational design domain. The silence on distribution shift is a critical safety gap. You cannot ship this.

  ### 6. Where a human has to decide

  The procedure stops at the Residual Risk Statement. This is where facts end and values begin. The checklist can verify that a timeout exists; it cannot verify that a thirty-second timeout is acceptable versus a five-second timeout. That trade-off depends on throughput targets versus safety margins. Similarly, the procedure can flag that an ML model is sensitive to potting mix density, but it cannot decide if the risk of dropping a tray is worth the efficiency gain of not retraining. These are business and ethical decisions masquerading as engineering constraints. The engineer provides the map of risks; the stakeholder chooses the path. The handoff must be explicit so responsibility is not buried in the spec.

  ### 7. What this procedure cannot do

  This procedure addresses the representation frame problem by forcing explicit listing of dependencies. It does not solve the relevance frame problem. It cannot predict which unlisted variables will become relevant tomorrow. It cannot anticipate a new pest species that confuses a vision system or a humidity spike that corrodes a connector. It ensures the document matches the current understanding of the system, not that the understanding is complete. It prevents silence, not ignorance. Engineers must understand that passing this checklist means the spec is consistent, not that the machine is safe from novel environmental shifts. Safety requires monitoring beyond the spec.
