  The report sat on Elara's desk like a dead bird. One page, bold font: *Net Wellbeing Delta: -0.04.*

  Vance stood by the window, his reflection superimposed over the grey cityscape. He didn't turn around. "Explain to me how knowing the truth makes people worse off."

  "It doesn't," Elara said. She kept her hands flat on the desk. "Knowing the truth makes them different. The metric counts 'different' as 'worse.'"

  "The metric counts satisfaction," Vance said. He turned. He was wearing a suit that cost more than Elara's car, crisp and uncreased. "Our mandate is to maximize customer satisfaction. The model says free information increases optionality. Increased optionality increases satisfaction. Therefore, satisfaction should go up. The data says it goes down. One of these things is a lie."

  "The model assumes people stay the same people after they know," Elara said.

  "People are people," Vance said. "They don't molt."

  "They do when you hand them a verdict." Elara slid a file across the desk. "Case 8940. Married couple. Three years in. They bought the Look to settle a bet. Question: 'Will we still be together in five years?' Answer: No."

  Vance didn't touch the file. "So they divorced. Honest outcome. They avoided wasting two years on a dead relationship. That's efficiency. That's value."

  "They divorced the week they got the answer," Elara said. "Before the Look, they were planning a renovation. They were arguing about tile, about money, about who forgets to take out the trash. Normal friction. After the Look, the friction wasn't about the trash anymore. It was about the expiration date."

  Vance picked up the file, skimmed it, dropped it. "They were going to split anyway. The Look just saved them time."

  "It stole the time they had left," Elara said. "Before the answer, they had uncertainty. Uncertainty lets you invest. You buy the tile because you think you'll be there to walk on it. You forgive the trash because you think there'll be a tomorrow to complain about it. Once they knew the end was fixed, the middle lost its value. They didn't lose a marriage; they lost the ability to be married while it lasted."

  Vance sighed, the sound of a deflating tire. "This is anecdotal. I have eighteen months of aggregate data. The curve is negative. Statistically significant. If the information was truly costless, the curve cannot be negative. It's arithmetic. If you know a road is blocked, you take a detour. You arrive sooner. You don't arrive unhappier."

  "Unless knowing the road is blocked makes you stop driving," Elara said.

  "Then they weren't acting rationally."

  "They were acting humanly."

  Vance walked to the desk and leaned on it, hands pressing into the wood. "My job is to audit the process, Elara. Not to philosophize. The theorem holds. Free information has non-negative value. If the value is negative, either the information wasn't free, or the agent is broken, or the measurement is wrong. Which is it?"

  Elara looked at the report. The number *-0.04* seemed to pulse. "It's the measurement. You're measuring what they wanted before they looked."

  "Obviously."

  "But what they want changes," Elara said. "Before the Look, Case 8940 wanted a marriage. After the Look, they wanted to minimize the pain of the inevitable. Those are different goals. You're scoring them on the first goal, but they're playing the second game."

  Vance straightened up. "Preferences are stable. That's a baseline assumption. If preferences shift randomly, we can't model anything."

  "They don't shift randomly. They shift because of the answer." Elara stood up. She walked to the whiteboard where she kept track of her cancellations. Thirty names this month. Thirty people she'd talked out of looking. "You think the Look is a window. It's not. It's a hammer. It breaks the thing it measures."

  "That's poetic," Vance said. "It's not math. If I know I have a disease, I can treat it. If I know my stock will crash, I can sell. Knowledge allows optimization. Optimization increases yield. Where is the yield loss?"

  "In the hope," Elara said. "You can't optimize hope. Hope requires not knowing. When you sell certainty, you kill hope. And for most people, hope is worth more than the certainty."

  Vance tapped his pen against his teeth. "Hope is not a currency. We don't trade in feelings. We trade in outcomes."

  "The outcome is how they feel!" Elara's voice cracked. She took a breath. "Look at the churn rate. Lookers sue. Non-Lookers refer friends. Why? Because the Non-Lookers get to keep trying. They might fail, but they fail owning the failure. The Lookers fail because the paper told them to."

  "The paper tells them the truth."

  "The paper tells them a future that hasn't happened yet," Elara said. "And then they make it happen because they believe the paper. You say the road is blocked, so they turn around. But maybe the road wasn't blocked until they turned around. Maybe the blockage was their belief in the blockage."

  Vance stopped tapping the pen. "Are you suggesting the Look is self-fulfilling?"

  "I'm suggesting the Look is participatory," Elara said. "Your math assumes the world sits still while we look at it. It doesn't. We move. And when we know where we're going, we walk differently. Sometimes we stop walking."

  Vance picked up the report again. He looked at the number. "If I accept that, I have to accept the model is broken. If the model is broken, the product is unsafe. If the product is unsafe, the company is liable."

  "The product is exactly what you sold," Elara said. "Truth. You sold truth. You got it. The cost was happiness. That's not a model error. That's the price."

  Vance put the report down. He looked at Elara, really looked at her, for the first time. He saw the tired lines around her eyes, the way she held her shoulders like she was carrying a weight. "You talk people out of this," he said. "You're paid to reduce uptake."

  "I'm paid to reduce harm."

  "Same thing, in this context." Vance opened his briefcase. He pulled out a form. "I'm flagging the study for review. I can't sign off on negative value. It violates the core principle. Until I understand why the math doesn't match the reality, I have to assume data integrity issues."

  "There are no integrity issues," Elara said.

  "Then there's a variable missing," Vance said. He capped his pen. "You say preferences shift. Prove it. Not with stories. With data. Show me where the utility function breaks."

  "I can't," Elara said. "Because the moment you measure it, you change it."

  Vance paused. He looked at the whiteboard, at the list of names. "Then I'll be back next quarter. And if the number is still negative, I'll recommend shutting down the counselling division. If the information is harmful, we stop selling it. Or we stop telling the truth."

  "You can't sell a lie."

  "We sell answers," Vance said. "What the answer means is up to the customer." He tucked the form back into his case. "Fix the variable, Elara. Or I fix the department."

  He left the office. The door clicked shut. Elara stood alone in the silence. The phone on her desk buzzed. A new appointment. A young man, twenty-four, wanting to know if his novel would be published.

  She looked at the report. *-0.04.*

  She picked up the phone. "Thank you for calling OmniLook. My name is Elara. I understand you're interested in a Look..."

  She paused, listening to his voice, bright and eager and terrified. He wanted to know. He thought knowing would help.

  "...before we schedule," Elara said, "I need to ask you something. Are you looking for an answer, or are you looking for permission?"

  There was silence on the line.

  "Because if you get the answer," she said, "you might not need the permission anymore. And some things only work if you think you still need it."

  She waited. She didn't tell him the math. She didn't tell him the theorem. She just waited, holding the line open, letting the uncertainty stretch out between them, heavy and fragile and alive.

  ***

  **Post-Story Note**

  **Broken Assumption:** **Preferences Stay Fixed.** Good's Theorem assumes an agent's utility function (what they value) remains constant before and after receiving information. In the story, the knowledge itself alters the customers' values—specifically, it destroys the utility derived from *hope* and *uncertainty*, which were key components of their wellbeing prior to the Look.

  **Auditor's Technical Correctness:** Within the strict frame of classical decision theory, Vance is correct: if preferences were truly fixed and the information costless, the expected utility could not decrease. The negative delta proves the system violates the theorem's axioms, not the theorem itself.

  **Theorem Check:** Your summary of Good's Theorem is accurate for the purposes of the story. The only minor nuance is that the theorem strictly applies to *expected* utility before the information is seen; once seen, regret is possible, but the *decision to look* should still be positive in expectation. The story bypasses this by showing the *act of looking* changes the utility function itself, which places it outside the theorem's scope.
