  **AETERNA VITALIS ASSURANCE GROUP**
  **COMPLIANCE MANUAL SECTION 7.4: STANDARD ON PERMISSIBLE ASSERTION (SPA)**
  **VERSION 4.2 | EFFECTIVE DATE: 01 NOV 2024**

  **1. PREAMBLE AND AUTHORITY**
  Pursuant to Board Resolution 44-B, the Compliance Function hereby issues this Standard on Permissible Assertion (SPA). This document governs all **ASSERTIONS** made by personnel in the course of employment. An **ASSERTION** is defined as any utterance or written representation presented as fact. The Board has resolved that no employee may **ASSERT** any proposition unless the employee possesses **KNOWLEDGE** of said proposition. **KNOWLEDGE** is defined as justified true belief wherein the justification is non-accidental and auditable. While the Compliance Function cannot guarantee future liability outcomes, this protocol is designed to align speech acts with epistemic standing.

  **2. NORMATIVE BASIS AND REJECTED ALTERNATIVES**
  During the drafting phase, four alternative standards were evaluated and dismissed:
  *   **The Truth-Conditional Standard:** Required only that assertions be true. Rejected because truth is often verifiable only ex-post, exposing the Firm to interim liability.
  *   **The Sincerity Standard:** Required only that the speaker believe the assertion. Rejected because internal belief states are opaque to audit.
  *   **The Reasonableness Standard:** Required only that the speaker have evidence. Rejected because evidentiary thresholds vary by department, creating inconsistency.
  *   **The Contextual Standard:** Required varying levels of certainty based on audience stake. Rejected due to the administrative burden of assessing individual stakeholder risk profiles in real-time.

  The **KNOWLEDGE** norm was selected for its binary enforceability.

  **3. CLASSIFICATION OF COMMERCIAL SPEECH**
  Employees frequently encounter queries regarding mortality tables, investment returns, or default probabilities. As the Firm cannot **KNOW** future events, such statements cannot be **ASSERTIONS**. Accordingly, all pricing estimates and mortality projections are reclassified as **ACTUARIAL OUTPUTS**. **ACTUARIAL OUTPUTS** are not claims about reality but "Hypothetical Modeling Scenarios." Employees must preface such outputs with the disclaimer: *"This output represents a model-based scenario, not a prediction."* This distinction allows the Firm to sell annuities without violating the SPA.

  **4. OPERATIONAL PROTOCOLS**
  **4.1 Low-Probability Outcomes.** Employees may not **ASSERT** that a specific low-probability event will not occur (e.g., "Your claim will not be denied"), even if statistically overwhelming. To communicate this, employees must employ **Strategic Interrogatives** (e.g., *"Have we ever denied a claim under these conditions?"*).
  **4.2 Aggregate Claims (The Conjunction Problem).** Documents containing multiple claims (e.g., policy booklets) carry a non-zero risk that at least one claim is false. Authors must append a **Conjunction Attestation** stating: *"While individual claims are known, the conjunction of all claims is held with high confidence only."*
  **4.3 Accidental Veracity.** If an employee makes a statement that is true and justified, but the truth relies on a factor unknown to the employee (e.g., guessing correctly), this constitutes **ACCIDENTAL VERACITY**. **ACCIDENTAL VERACITY** is a violation equivalent to falsehood, as **KNOWLEDGE** was absent.
  **4.4 Testimony and Models.** Employees may not **ASSERT** propositions based solely on colleague reports or black-box model outputs unless the employee has verified the underlying logic. Reliance on external expert opinion requires a **Chain of Epistemic Custody** form.

  **5. COMMUNICATIVE DISPLACEMENT**
  To maintain commercial viability while adhering to the SPA, the Firm encourages **Suggestive Framing**. Success is measured by the audience's retention of accurate beliefs without the Firm issuing **ASSERTIONS**. Departments are rewarded for increasing the ratio of rhetorical questions to declarative sentences in client communications.

  > **SIDEBAR: GRIEVANCE LOG ENTRY #892**
  >
  > **Grievance:** Employee Smith stated to a colleague, "The server room is flooding." The server room was, in fact, flooding. Smith was sanctioned because he inferred this from a noise rather than visual confirmation.
  > **Employee Appeal:** "I was factually correct. The water was there."
  > **Compliance Reply:** "Correctness is insufficient. You lacked visual verification. You possessed true belief, not **KNOWLEDGE**. The sanction stands. Future observations of flooding require ocular proof prior to verbalization."
  > **Outcome:** Sanction Upheld.

  **6. SELF-APPLICATION CLAUSE**
  This document constitutes an **ASSERTION** regarding policy. The Compliance Function **KNOWS** the contents herein are accurate to the best of its current audit. However, as future regulatory changes are unknowable, Section 2's claim regarding the rejection of alternatives is subject to revision if minutes from the drafting committee are lost.

  **APPENDIX A: SCHEDULE OF SANCTIONS**
  Violations of the SPA will result in the following actions, depending on severity and epistemic negligence:
  1.  **First Offense (Negligent Assertion):** Mandatory retraining on epistemic humility.
  2.  **Second Offense (Reckless Assertion):** Suspension of communication privileges (email/phone) for 14 days.
  3.  **Third Offense (Willful Ignorance):** Termination of employment.
  4.  **Systemic Violation:** Departmental audit of all **ACTUARIAL OUTPUTS** issued in the preceding quarter.

  *Note: The Compliance Function reserves the right to adjust sanctions if unforeseen circumstances arise that we could not have known.*

  **APPROVED BY:**
  *J. Vane, Chief Compliance Officer*
  *(Signature indicates I have read this document and believe I know it complies with Board Resolution 44-B)*
