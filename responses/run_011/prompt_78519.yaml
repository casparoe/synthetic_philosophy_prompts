  **The Decision Tree**

  **Start:** An advanced economy has tens of millions of heterogeneous capital goods, nobody knows all the relevant local facts, and production has to be coordinated somehow.

  1.  **A solved optimisation programme spits out shadow prices for every input — are those prices or something else wearing the name?**
      *   **Yes:** They function as prices.
          *   **Does a supercomputer fed enough sensor data change the answer or merely change the shape of the question?**
              *   **Changes the answer:** Feasible now.
                  *   **Leaf:** Later computerised version (Lange 1967/Cockshott). *Awkward commitment:* Relies on computing power growing faster than economic complexity. **Tag:** Contingent.
              *   **Changes the shape:** Still need iteration.
                  *   **Leaf:** Trial-and-error market socialism with a central board setting prices by tâtonnement (Lange 1938). *Awkward commitment:* Managers must follow rules without profit motive. **Tag:** Contingent.
      *   **No:** They lack discovery/entrepreneurial element.
          *   **The factory-floor worker who knows the bearing is about to go and has no way to report it except by fiddling a form — is this a technical glitch or a systemic blindness?**
              *   **Systemic blindness:** Knowledge cannot be centralised.
                  *   **Leaf:** The view that the trouble is dispersed, partly tacit knowledge and the absence of a discovery process rather than the arithmetic (Hayek). *Awkward commitment:* Cannot specify how much knowledge loss is tolerable before planning fails. **Tag:** Conceptual.
              *   **Technical glitch:** Information can be transmitted.
                  *   **Can you price a loaf of bread correctly if you've never priced the flour mill that made it?**
                      *   **No:** Factor prices essential.
                          *   **Leaf:** The view that rational allocation without market-generated factor prices is impossible in principle (Mises). *Awkward commitment:* Must accept that any non-market allocation is literally irrational. **Tag:** Conceptual.
                      *   **Yes:** Physical planning possible.
                          *   **A giant retailer that plans internally, in physical units, across thousands of sites and does it rather well — is this a model for the whole economy or a special case?**
                              *   **Model:** Scale up physical planning.
                                  *   **Leaf:** Planning in labour-time or in physical units instead of money. *Awkward commitment:* Must reduce heterogeneous labour to a single time standard. **Tag:** Conceptual.
                              *   **Special case:** Needs markets too.
                                  *   **A wartime board that rations and fixes prices for four years and still ships tanks — is this sustainable peace-time coordination?**
                                      *   **No:** Only works under duress.
                                          *   **Leaf:** The mixed "feasible" position that keeps markets for some things and plans others. *Awkward commitment:* Must define the boundary between plan and market without political capture. **Tag:** Contingent.
                                      *   **Yes:** Sustainable.
                                          *   **Is the primary constraint on extending this calculation or politics?**
                                              *   **Politics:** Power relations matter more.
                                                  *   **Leaf:** The view that the debate was never really about calculation but about incentives, exit, and politics. *Awkward commitment:* Calculation is solvable, but power relations remain unchanged. **Tag:** Contingent.
                                              *   **Calculation:** Coordination mechanism matters.
                                                  *   **Should coordination happen via competing firms or negotiated boards?**
                                                      *   **Firms:** Market structure retained.
                                                          *   **Leaf:** Genuine market socialism with competing worker-owned firms. *Awkward commitment:* Worker firms may restrict employment to raise wages. **Tag:** Contingent.
                                                      *   **Boards:** Negotiated structure.
                                                          *   **Leaf:** Negotiated coordination between devolved boards and unions rather than either a market or a centre. *Awkward commitment:* Risks deadlock between boards without a tie-breaker. **Tag:** Contingent.

  **Bookkeeping I: Empty Cells**

  The combination of 'Shadow Prices: Yes' and 'Worker Knowledge: Systemic Blindness' is available but empty. This cell is incoherent; if shadow prices function, knowledge is not systemically blind to the centre. The combination of 'Retailer: Model' and 'Wartime: No' is also empty. This is unattractive; if physical planning works for retailers, denying it works for wartime production lacks consistency. Finally, 'Shadow Prices: Yes' and 'Bread/Flour: No' is empty because it is incoherent to accept shadow prices while denying factor pricing.

  **Bookkeeping II: Indistinguishable Leaves**

  The tree cannot separate Mises from Hayek; both end at 'Impossible' via 'No' on shadow prices. To tell them apart, ask whether the impossibility holds for a static equilibrium (Mises) or only in a changing world (Hayek). The tree also conflates Lange 1938 and Lange 1967; both answer 'Yes' to shadow prices. To separate them, ask whether the iteration is performed by managers following rules (1938) or by a computer algorithm (1967). Without these additions, the early and late trial-and-error views appear identical.
