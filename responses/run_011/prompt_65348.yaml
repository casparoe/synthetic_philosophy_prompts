answer: |-
  **1. The Feedback Audit Procedure**

  1.  **Interactivity Screen.** Determine if the proposed term is likely to be encountered by the person classified. Review the dossier for intended audience, coding visibility, and clinical communication protocols. A sufficient answer confirms the term is confined to specialist reports, laboratory indices, or administrative backend systems never seen by the patient. If the term is technical and functions solely as an index to an intervention that exists independently of the label, classify as **Low Interactivity** and proceed to Step 6. If the term is legible to patients, families, schools, or courts, classify as **High Interactivity** and proceed to Step 2. This step terminates the review with a **Yes** only for Low Interactivity proposals that meet standard evidential thresholds; all others move forward.

  2.  **Feedback Signature Prediction.** Require the proposer to specify the data signature expected within three years of adoption. Using the prevalence and delimitation sections of the dossier, the proposer must state how the shape of reported symptoms, severity distribution, and demographic composition will change if the label itself drives uptake versus if incidence genuinely rises. A sufficient answer provides distinct metrics (e.g., "severity scores will drop while prevalence rises" indicates label expansion; "severity scores remain stable" indicates genuine incidence). If the proposer cannot distinguish label-induced growth from better ascertainment or real incidence, this step terminates the review with a **No**. If distinct metrics are provided, record them in the Audit Form and proceed to Step 3.

  3.  **Stigma versus Kind-Change Analysis.** Separate harms arising from social judgment of the trait from harms arising because the label changes the trait. Review the dossier's prognostic value and social context sections. A sufficient answer identifies whether negative outcomes (e.g., employment loss) attach to the underlying behavior regardless of the name (Stigma) or result from the specific expectations created by the new category (Kind-Change). If harms are primarily Stigma, recommend parallel anti-stigma initiatives rather than rejecting the category. If harms are primarily Kind-Change (e.g., the label encourages symptom maintenance to retain benefits), proceed to Step 4. This step terminates the review with a **No** only if Kind-Change harms are severe and unmitigable.

  4.  **Two-Sided Benefit Assessment.** Weigh the feedback mechanisms that produce identity foreclosure against those that produce access and community. Using the treatment-response evidence section, quantify the likely gain in service access against the risk of diagnostic overshadowing. A sufficient answer states the trade-off in lay terms: "For every 100 people granted access, X may experience lowered expectation." Factual questions (rates of access) are decided by the panel; value questions (whether access outweighs foreclosure) are handed to the named Decision-Maker (e.g., Board Chair) with the trade-off explicitly stated. This step does not terminate the review but frames the final recommendation.

  5.  **Renaming Specifics.** If the proposal is to rename an existing category, assess the risk of orphaning prognostic knowledge and shifting diagnostic thresholds. Review the delimitation and prevalence sections. A sufficient answer demonstrates a data bridge preserving continuity with the old term and confirms the new term does not lower the threshold for suspicion merely by sounding less pejorative. If the rename obscures risk or breaks longitudinal data tracking without clinical justification, this step terminates the review with a **No**. If continuity is preserved, proceed to Step 6.

  6.  **Final Recommendation and Audit Record.** Compile the findings into a recommendation. A sufficient answer is a clear Yes, No, or Yes with Conditions. For any Yes, the panel must record the predicted Feedback Signature from Step 2 in the public Audit Form. This record binds the next cycle to evaluate whether the prediction held. If the prediction was not recorded or was unfalsifiable, the recommendation defaults to **No**. This step concludes the review.

  ***

  **2. Public Audit Form (One-Page Record)**

  **Proposal ID:** _______________ **Category Name:** _______________ **Cycle:** _______________
  **Proposer:** _______________ **Decision:** [ ] Yes [ ] No [ ] Yes with Conditions

  **Interactivity Level:** [ ] Low (Technical) [ ] High (Public/Patient Legible)
  **If High, Predicted Data Signature (3-Year Horizon):**
  *   **Prevalence Trend:** ________________________________________________________
  *   **Severity Distribution of New Cases:** ________________________________________
  *   **Demographic/Geographic Shift:** ____________________________________________
  *   **Differentiation:** How does this signature distinguish label-effect from real incidence?
      _____________________________________________________________________________

  ** Harm/Benefit Balance:**
  *   **Access Gained (Estimated):** _______________________________________________
  *   **Risk of Foreclosure/Overshadowing:** _______________________________________
  *   **Value Trade-off Statement (for Decision-Maker):** _____________________________
      _____________________________________________________________________________

  **Renaming Continuity (If applicable):**
  *   **Data Bridge Preserved?** [ ] Yes [ ] No
  *   **Threshold Shift Risk:** [ ] Low [ ] Medium [ ] High

  **Audit Commitment:**
  The panel records that if the observed data at Cycle +1 deviates from the Predicted Data Signature without explanation of genuine incidence change, this category will be flagged for mandatory review.
  **Panel Chair Signature:** ___________________ **Date:** _______________

  ***

  **3. Worked Verdicts**

  **Case 1: Prolonged Situational Distress (New Category)**
  **Proposer:** Department of Clinical Standards
  **Verdict:** **No**

  **Reasoning:** This proposal fails at Step 2 (Feedback Signature Prediction). The dossier defines the category as "persistent distress... following a documented life disruption" in language "immediately legible to patients and to the press." This is High Interactivity. The proposer argues prevalence will track with economic instability indicators. However, they cannot specify how to distinguish a rise in coding due to the availability of a legitimating label from a genuine rise in distress. Because the term offers a socially acceptable identity ("distressed by situation" vs. "depressed"), it invites self-selection. The predicted signature overlaps entirely with better ascertainment of normal grief. Under Step 2, inability to distinguish label-induced growth from incidence mandates a **No**.
  **Path to Approval:** The proposer could obtain a different verdict by narrowing the criteria to include a biological marker or a specific functional impairment threshold that is less susceptible to self-report bias. Alternatively, they could restrict the term's visibility to clinician-to-clinician communication for a pilot period, moving it to Low Interactivity (Step 1), though this reduces the proposed benefit of patient legibility.

  **Case 2: Biphasic Response Pattern (New Category)**
  **Proposer:** Specialist Pharmacology Group
  **Verdict:** **Yes**

  **Reasoning:** This proposal passes at Step 1 (Interactivity Screen). The term is defined solely by "two consecutive assay values" and is "confined to specialist reports." It is never spoken to the person classified and functions only as an index to a treatment already in use. The patient does not learn the classification, describe themselves in its terms, or change accordingly. The feedback risk is negligible. The dossier provides sufficient evidence for reliability and treatment response. As a Low Interactivity term, it proceeds directly to Step 6. The Audit Form records the term as technical; no feedback signature is required beyond standard reliability metrics. The panel recommends adoption without modification.

  **Case 3: Personality Deviance Disorder → Adaptive Rigidity Pattern (Renaming)**
  **Proposer:** Clinical Practice Committee (Supported by Lay Representatives)
  **Verdict:** **Yes with Conditions**

  **Reasoning:** This proposal passes Step 5 (Renaming Specifics) but requires conditions. The lay representatives regard the rename as an unqualified good to reduce stigma. Step 3 confirms that much of the harm associated with "Deviance" is Stigma (label-independent), which renaming may alleviate. However, Step 5 identifies a risk: "Adaptive Rigidity" sounds functional and may lower the threshold at which clinicians become suspicious, potentially expanding the class to include non-pathological traits. To proceed, the proposer must establish a Data Bridge (Step 5) ensuring all historical "Deviance" records map to "Rigidity" without loss of prognostic knowledge regarding risk.
  **Conditions:** Adoption is contingent on maintaining a crosswalk code for ten years. Additionally, the panel notes under Step 4 that while stigma may decrease, the risk of diagnostic overshadowing (attributing all behavior to "Rigidity") remains a factual risk to be monitored. The Audit Form records the prediction that prevalence will remain stable if the threshold is held; if prevalence spikes, the rename will be reviewed for threshold drift. This bites the proposer slightly by imposing a long-term administrative burden, but aligns with the lay preference for dignity.

  ***

  **4. Limits of the Procedure**

  This procedure cannot guarantee that a classification will not alter the kind it classifies. We have no jurisdiction to withhold a label at random to create a control group; every adoption is an intervention. Consequently, the "Feedback Signature" recorded in the Audit Form is an observational prediction, not an experimental baseline. We cannot know with certainty whether a rise in prevalence is due to the label or a simultaneous change in treatment availability, economic stress, or cultural shifts. The audit in Point 3 is weakened by this entanglement; if prevalence triples, we may attribute it to looping effects when it was actually a surge in genuine distress, or vice versa. We act under inevitable epistemic uncertainty.

  Furthermore, the procedure itself is subject to reflexivity. Publishing a statement that a category is self-altering may alter clinician behavior (e.g., hesitancy to diagnose) or patient behavior (e.g., rejection of the label), thereby changing the very feedback loop we aim to measure. We cannot step outside the system to observe it neutrally. There are places where the panel must act without knowing: specifically, when the benefit of access (Step 4) is urgent and the feedback risk is theoretical. In such cases, we must prioritize immediate relief over long-term classificatory purity, accepting that we may manufacture a condition to treat it. The procedure does not solve this moral dilemma; it only ensures the trade-off is stated clearly for the Decision-Maker. We manage risk, we do not eliminate it.
