      *   Journalism needs accuracy (legal) but also resonance (moral).
      *   The 1948 Convention is narrow (physical/biological destruction of national/ethnic/racial/religious groups).
      *   Lemkin was broader (cultural destruction, political groups).
      *   Newsrooms aren't courts. They can't wait for a verdict. They must describe reality *now*.

  3.  **Drafting the Exercise (Distinctions):**
      *   *Keep:* Intent (specific intent to destroy a group vs. general violence), Protected Group (the 4 categories), Actus Reus (the specific acts listed).
      *   *Lose:* Judicial Verdict (waiting for a court), Political Group exclusion (acknowledge the gap), Cultural Destruction (acknowledge the gap).
      *   *Consequences:* Losing "Judicial Verdict" means we risk being contradicted later. Losing "Political Group" means we can't call some mass killings genocide legally, even if they feel like it. Losing "Cultural" means we miss slow-motion destruction.

