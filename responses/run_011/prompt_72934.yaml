answer: |-
  ### Part I: The Exercise on Distinctions

  You are correct that the word is doing two jobs. The procedure fails when it tries to make one definition do both. Below are the distinctions your desk must preserve, and those it must surrender to the nature of journalism.

  **Distinctions that must survive into procedure:**

  1.  **Specific Intent vs. General Malice:** You must distinguish between killing many people (war crime/crimes against humanity) and killing people *because* their existence as a group is the objective.
      *   *Why keep it:* Without this, "genocide" becomes a synonym for "massacre," losing its specific utility.
  2.  **The Four Protected Groups vs. All Groups:** You must distinguish between national, ethnical, racial, and religious groups (protected) and political, social, or economic groups (unprotected).
      *   *Why keep it:* This is the hard boundary of the treaty. Ignoring it makes your copy legally vulnerable and conceptually sloppy.
  3.  **Physical/Biological Destruction vs. Cultural Assimilation:** You must distinguish between destroying the *people* and destroying the *culture* (unless the cultural destruction is a method of physical destruction).
      *   *Why keep it:* The treaty requires physical/biological destruction. Lemkin's broader view is morally compelling but legally unsupported. Conflating them invites charges of hyperbole.

  **Distinctions a reporter can be allowed to lose (and the cost):**

  1.  **Judicial Verdict vs. Evidentiary Reality:**
      *   *What is lost:* The certainty of a court's finding.
      *   *The Error:* You risk being contradicted if a future court rules differently.
      *   *Why lose it:* Waiting for a verdict means reporting history, not news. By the time a court rules, the killing is often over. You must trade legal finality for timely accuracy.
  2.  **The "Substantial Part" Threshold:**
      *   *What is lost:* A mathematical formula for how many deaths constitute "in part."
      *   *The Error:* Inconsistency between stories. One desk might call 5,000 deaths genocide; another might require 50,000.
      *   *Why lose it:* The treaty intentionally left this vague. No procedure can fix it. You must treat it as a qualitative judgment (is the group's survival threatened?) rather than a quantitative one.
  3.  **The Political Group Exclusion:**
      *   *What is lost:* The ability to legally label the destruction of political opponents as genocide.
      *   *The Error:* Readers will feel the word is being withheld from situations that feel like genocide (e.g., class-based purges).
      *   *Why lose it:* You cannot rewrite the treaty. You must use other terms ("politicide," "mass atrocity") for these cases to maintain precision.

  ***

  ### Part II: The Procedure

  This procedure treats "genocide" as a **descriptive term based on legal criteria**, not merely a **legal conclusion based on judicial verdict**. It allows you to use the word when the evidence supports it, without claiming the authority of a judge.

  #### 1. The Ordered Questions

  **Q1: Is there a protected group?**
  *   *Ask:* Is the target defined by nationality, ethnicity, race, or religion?
  *   *Sufficient Answer:* Yes, the group is clearly identified by one of these four markers.
  *   *Stop Condition:* If the group is defined primarily by political affiliation, social class, or geography alone, stop. (See Vocabulary Section).
  *   *Label:* **Settled by facts we can gather.**

  **Q2: Are the prohibited acts occurring?**
  *   *Ask:* Is there killing, serious bodily/mental harm, conditions calculated to destroy, prevention of births, or forcible transfer of children?
  *   *Sufficient Answer:* Yes, verified reporting confirms at least one of these acts is systematic.
  *   *Stop Condition:* If the harm is limited to property damage, censorship, or discrimination without physical/biological threat, stop.
  *   *Label:* **Settled by facts we can gather.**

  **Q3: Is there specific intent (dolus specialis)?**
  *   *Ask:* Is there evidence the perpetrators intend to destroy the group *as such*, not just defeat an enemy or suppress a rebellion? (Look for statements of purpose, patterns of targeting non-combatants, or methods that exceed military necessity).
  *   *Sufficient Answer:* Yes, there is direct evidence (orders, rhetoric) or overwhelming circumstantial evidence (systematic targeting of women/children, eradication of records).
  *   *Stop Condition:* If the intent appears to be territorial conquest, counter-insurgency, or political suppression without evidence of group destruction, stop.
  *   *Label:* **Settled by judgment that no procedure can remove.** (Flag: This requires senior editorial judgment).

  **Q4: Has a competent body made a determination?**
  *   *Ask:* Has the ICJ, ICC, a UN Commission of Inquiry, or a relevant national court ruled on this specific situation?
  *   *Sufficient Answer:* Yes or No.
  *   *Stop Condition:* None. This informs *how* you write the word, not *if*.
  *   *Label:* **Settled by a determination that someone else has or has not made.**

  #### 2. Escalation Points

  *   **If Q3 is "Yes" but Q4 is "No" (High evidence, no court ruling):**
      *   *Hand over to:* Editor-in-Chief and Legal Counsel.
      *   *What is handed:* A question about **what we owe readers**. You are asking permission to use a descriptive term that carries legal weight without a legal verdict.
      *   *Requirement:* The story must explicitly state *why* the desk is using the term (e.g., "based on evidence of intent...").

  *   **If Q1 is "No" (Political/Social Group) but the scale is massive:**
      *   *Hand over to:* Regional Desk / Standards Editor.
      *   *What is handed:* A question of **vocabulary**. How do we describe this horror without misusing the legal term?

  *   **If Q3 is "Unclear" (Intent is ambiguous):**
      *   *Hand over to:* Senior Editor.
      *   *What is handed:* A **fact** question. Do we have more evidence? If not, the word cannot be used.

  #### 3. Vocabulary Section (When the test fails)

  When the procedure stops you from using "genocide," you must not use weak language. You must use *precise* language.

  *   **"Crimes against humanity":** Use when the acts are widespread/systematic but the *intent to destroy a group* (Q3) is not proven, or the *group* (Q1) is not protected.
      *   *Warning:* This is a loaded legal term itself. Do not use it casually. It requires systematic attack on civilians.
  *   **"Ethnic cleansing":** Use when the intent is forced removal rather than physical destruction.
      *   *Warning:* This is **not** a legal crime in itself. It is a descriptive euphemism. It is neutral in tone but often implies genocide to readers. Use with caution.
  *   **"Mass atrocity" / "Mass killing":** Use when the legal thresholds for the above are not met.
      *   *Warning:* These are morally heavy but legally safe. They do not trigger specific international obligations.
  *   **"Politicide":** Use when the target is a political group.
      *   *Warning:* This is an academic term, not a legal one. Readers may not understand it. Define it in copy.

  #### 4. Ruling on Legal vs. Descriptive Use

  **The Ruling:** Your desk **is permitted** to describe something as genocide in the descriptive sense (Q1, Q2, Q3 met) even if no competent body has made the legal determination (Q4 is No).

  **The Constraint:** You must not conflate the two.
  *   *Forbidden:* "The court declared genocide." (If they haven't).
  *   *Forbidden:* "This is genocide." (Unqualified assertion of legal fact).
  *   *Required:* "Acts of genocide," "Evidence points to genocide," or "What human rights investigators call genocide."
  *   *Exception:* If the evidence of intent (Q3) is overwhelming (e.g., public orders to exterminate), you may use the unqualified noun "genocide" as a descriptive classification, provided you attribute the assessment to your organization's reporting standards, not a court.

  ***

  ### Part III: Test Cases

  **Case 1: Rwanda, April 1994 (Third Week)**
  *   **Q1 (Group):** Tutsi (Ethnic/National). **Pass.**
  *   **Q2 (Acts):** Killing members. **Pass.**
  *   **Q3 (Intent):** RTLM radio broadcasts calling for extermination; roadblocks checking IDs; targeting of women and children. **Pass (Judgment).**
  *   **Q4 (Determination):** No tribunal exists. UN avoids the word. **No.**
  *   **Escalation:** Q3 Yes / Q4 No goes to Editor-in-Chief.
  *   **Procedure Output:** The desk **may** use the word "genocide."
  *   **Copy Instruction:** Because Q4 is No, the copy must ground the usage in evidence, not law.
      *   *Recommended Copy:* "The systematic killing of Tutsis has taken on the characteristics of genocide," or "Witnesses describe a campaign of genocide."
      *   *Bold Copy (Permitted):* "Genocide is underway." (Only if Editor-in-Chief agrees the intent is undeniable).
      *   *Result:* You do not wait for the UN. You report the reality.

  **Case 2: Cambodia, 1975–1979 (Total Death Toll)**
  *   **Q1 (Group):** The "New People," intellectuals, urbanites (Political/Social). Cham Muslims and Vietnamese (Ethnic/Religious).
      *   *Split:* The majority of victims are political/social. The minorities are protected.
      *   *Fail (for total):* The total toll does not fit the four protected groups.
  *   **Q2 (Acts):** Killing, conditions of life. **Pass.**
  *   **Q3 (Intent):** Intent to remake society (Political) vs. Intent to destroy Cham/Vietnamese (Ethnic).
  *   **Procedure Output:** You **cannot** label the total death toll "genocide" under this procedure.
  *   **Copy Instruction:** You must distinguish.
      *   *Recommended Copy:* "The regime committed crimes against humanity on a massive scale. While the killing of Cham Muslims and Vietnamese may constitute genocide, the majority of deaths resulted from political purges and forced labor, which fall outside the legal definition of genocide."
      *   *Result:* This produces the answer you dislike. It restricts the word. But it preserves the word's precision. If you call the whole thing genocide, you break the tool.

  **Case 3: Herero and Nama, 1904–1908**
  *   **Q1 (Group):** Herero and Nama (Ethnic/National). **Pass.**
  *   **Q2 (Acts):** Killing, conditions of life (driven into desert). **Pass.**
  *   **Q3 (Intent):** Extermination orders issued by German command. **Pass.**
  *   **Q4 (Determination):** Treaty did not exist. Court cannot take case. **N/A.**
  *   **Procedure Output:** Legal route is closed. Descriptive route is open.
  *   **Copy Instruction:** You must treat this as a historical classification, not a contemporary legal charge.
      *   *Recommended Copy:* "Historians and the UN classify the events as genocide," or "In what is now recognized as the first genocide of the 20th century..."
      *   *Result:* You acknowledge the moral reality without making a false legal claim about a treaty that didn't exist.

  ***

  ### Part IV: Failure Analysis

  **Where the procedure will misfire (Yielding copy you believe is wrong):**

  1.  **The Slow-Motion Destruction:** A government starves a group slowly over 20 years while dismantling their language and schools.
      *   *Failure:* Q2 (Acts) might be hard to pin to "conditions calculated to bring about physical destruction" in a news cycle. Q3 (Intent) will be denied by the state as "policy failure."
      *   *Result:* The procedure forces you to wait for bodies to pile up before the word triggers. You will feel complicit in the delay.
  2.  **The Cultural Erasure:** A group is not killed but is forcibly assimilated until they cease to exist as a distinct culture (e.g., residential schools).
      *   *Failure:* Q2 excludes cultural destruction unless linked to physical/biological destruction.
      *   *Result:* You cannot call it genocide under this rule, even if Lemkin would have. You must use "cultural erasure" or "forced assimilation."

  **Where a lazy desk can satisfy every step and still mislead:**

  1.  **The Box-Ticking Intent:** A reporter finds one extremist quote (Q3) and ignores the broader military context.
      *   *Risk:* They satisfy the procedure but misrepresent the conflict as genocide when it is a brutal war.
      *   *Mitigation:* Q3 is flagged as "Judgment." It requires senior sign-off. If seniors are lazy, the procedure fails.
  2.  **The "Acts of" Loophole:** Using "acts of genocide" repeatedly creates the impression of a legal finding without the responsibility of one.
      *   *Risk:* Readers hear "genocide." The lawyer hears "acts of." The gap is where the misinformation lives.

  **What the procedure cannot do:**

  1.  **It cannot force action:** Naming it genocide does not guarantee intervention. Not naming it does not guarantee safety.
  2.  **It cannot resolve the moral weight:** It cannot tell you if a political massacre is *worse* than an ethnic one. It only tells you which word fits.
  3.  **It cannot predict the future:** A court may later rule differently. You must be willing to publish a correction if a competent tribunal contradicts your descriptive assessment.

  ***

  ### Part V: The Index Card

  **GENOCIDE DECISION CARD**

  1.  **CHECK THE GROUP:** Are they targeted for being National, Ethnic, Racial, or Religious?
      *   *NO:* STOP. Use "Mass Atrocity" or "Crimes Against Humanity."
      *   *YES:* Go to 2.

  2.  **CHECK THE ACTS:** Is there Killing, Serious Harm, Starvation/Conditions, Birth Prevention, or Child Transfer?
      *   *NO:* STOP. Use "Persecution" or "Discrimination."
      *   *YES:* Go to 3.

  3.  **CHECK THE INTENT:** Is the goal to *destroy the group*, not just defeat an enemy? (Look for orders, rhetoric, targeting of children).
      *   *NO/UNCLEAR:* STOP. Escalate to Senior Editor. Do not use the word.
      *   *YES:* Go to 4.

  4.  **CHECK THE RULING:** Has a Court or UN Body ruled?
      *   *YES:* Use "Genocide" (Attribute the ruling).
      *   *NO:* Escalate to Editor-in-Chief. If approved, use "Acts of Genocide" or "Evidence of Genocide."

  **WARNING:**
  *   Never use for Political Groups alone.
  *   Never use for Cultural Destruction alone.
  *   If in doubt, describe the killing, not the crime.
