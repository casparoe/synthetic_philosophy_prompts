answer: |-
  ### I. Inventory of Cases

  A theory of reference class selection must account for three distinct pressures. First, **administrative forecasting disputes**, like your own, where two factually correct descriptions of a project yield different cost distributions, and a decision must be made to allocate funds or assign blame. A theory must explain why one description is *administratively privileged* even if the other is statistically valid. Second, **probabilistic paradoxes** (e.g., the Doomsday Argument), where the probability of an event shifts drastically depending on whether one classes oneself as a "human," a "civilization member," or an "observer." A theory must explain why some class memberships are epistemically inert while others are probative. Third, **aggregation reversals** (Simpson's Paradox), where a trend holds in every subgroup but reverses in the pooled group. A theory must dictate when to partition data and when to pool it, ensuring that the chosen class does not systematically mislead by hiding structural heterogeneity.

  ### II. Desiderata

  **(a) Problems to Resolve**
  1.  **Selection Uniqueness:** The theory must yield a single class (or a strictly ranked set) for any given forecasting target.
  2.  **Distributional Stability:** The probability distribution derived from the class must not fluctuate wildly under minor, irrelevant changes to the class description.
  3.  **Causal Relevance:** The members of the class must share the underlying causal mechanisms that drive the variable being forecast (e.g., cost overrun).

  **(b) Distinctions to Maintain**
  4.  **Legitimacy vs. Truth:** The theory must distinguish between a class that *exists* (a true set of objects) and a class that is *predictively legitimate* (useful for inference).
  5.  **Description vs. Extension:** The theory must distinguish between the rule used to identify the class (the intension) and the actual members gathered (the extension), preventing gerrymandering by post-hoc member selection.
  6.  **Width vs. Homogeneity:** The theory must treat the number of members (Width) and the variance among members (Homogeneity) as separate variables, not assuming that a wider class is necessarily more heterogeneous or vice versa.

  **(c) Institutional Constraints**
  7.  **Procedural Auditability:** The method for selecting the class must be explicit enough that a reviewer can trace the steps without needing to share the selector's intuition.
  8.  **Small-N Viability:** The theory must offer a verdict even when the historical record contains fewer than ten strict comparables.
  9.  **Time-Bounded Computability:** The selection process must be completable by non-specialists within the timeframe of a standard budget cycle.

  ### III. Motivation and Status of Requirements

  1.  **Selection Uniqueness:**
      *   *Motivation:* Institutional paralysis. If multiple classes are equally "correct," the audit cannot rule.
      *   *Debate:* Insisted upon by auditors and decision theorists; resisted by contextualists who argue probability is inherently relative to a description.
      *   *Status:* **Non-negotiable.** Without this, the statutory mandate cannot be executed.

  2.  **Distributional Stability:**
      *   *Motivation:* Prevents gaming. If adding one irrelevant project changes the forecast by 50%, the metric is broken.
      *   *Debate:* Insisted upon by statisticians; resisted by those who believe "true" probabilities are sensitive to fine-grained details.
      *   *Status:* **Non-negotiable.** Essential for budget reliability.

  3.  **Causal Relevance:**
      *   *Motivation:* Accuracy. Correlation without mechanism leads to systematic error (e.g., classifying by color of the hard hat).
      *   *Debate:* Insisted upon by engineers and causal modelers; resisted by pure frequentists who argue only observed frequencies matter.
      *   *Status:* **Non-negotiable.** Without this, the forecast is superstition.

  4.  **Legitimacy vs. Truth:**
      *   *Motivation:* Metaphysical neutrality. We do not need to solve what "exists," only what predicts.
      *   *Debate:* Insisted upon by pragmatists; resisted by realists who believe the "true" class is the only valid one.
      *   *Status:* **Non-negotiable.** Prevents philosophical stalls in a hearing.

  5.  **Description vs. Extension:**
      *   *Motivation:* Anti-gerrymandering. Prevents teams from defining a class by its outcomes.
      *   *Debate:* Insisted upon by logicians; often collapsed by empiricists who look only at the resulting data.
      *   *Status:* **Negotiable.** Hard to enforce strictly, but necessary to prevent cheating.

  6.  **Width vs. Homogeneity:**
      *   *Motivation:* The core tension. Width reduces noise; Homogeneity reduces bias.
      *   *Debate:* Project teams insist on Homogeneity (Narrow); Auditors insist on Width (Stability).
      *   *Status:* **Non-negotiable.** The theory must explicitly weigh these against each other, not conflate them.

  7.  **Procedural Auditability:**
      *   *Motivation:* Due process. A black-box algorithm cannot be cross-examined.
      *   *Debate:* Insisted upon by legal counsel; resisted by data scientists preferring complex optimization.
      *   *Status:* **Non-negotiable.** Essential for the hearing room context.

  8.  **Small-N Viability:**
      *   *Motivation:* Innovation. New technologies have no wide classes.
      *   *Debate:* Insisted upon by engineers; resisted by frequentists who say N<30 is meaningless.
      *   *Status:* **Negotiable.** May require borrowing strength from adjacent classes (hierarchical modeling), which complicates Auditability.

  9.  **Time-Bounded Computability:**
      *   *Motivation:* Resource constraints.
      *   *Debate:* Insisted upon by management; resisted by theorists who want exhaustive search.
      *   *Status:* **Non-negotiable.** Bureaucratic reality.

  ### IV. Incompatibilities and Trade-offs

  There is a fundamental trilemma between **Causal Relevance**, **Distributional Stability**, and **Selection Uniqueness**.

  1.  **Relevance vs. Stability:** To maximize Causal Relevance, one must narrow the class to include only projects with identical causal mechanisms. This reduces Width, which threatens Distributional Stability (small sample sizes yield volatile distributions). To maximize Stability, one must widen the class, which dilutes Causal Relevance by including projects with different mechanisms.
  2.  **Uniqueness vs. Relevance:** To ensure Selection Uniqueness, one needs a rigid rule (e.g., "always choose the widest class with N>20"). However, rigid rules will inevitably select classes that are causally irrelevant in specific cases (e.g., a unique geological formation is forced into a general "tunnel" class). To maximize Relevance, one needs contextual judgment, which undermines Uniqueness (different judges pick different "relevant" features).

  **Resolution:** For an audit institution, **Distributional Stability** and **Selection Uniqueness** must trump **Maximal Causal Relevance**.
  *Why?* Because Relevance is the variable most susceptible to strategic manipulation (the "gameable" narrow class). Stability (sample size) and Uniqueness (following a pre-set rule) are objectively verifiable.
  *What is lost?* You will occasionally enforce a forecast based on a class that is known to be slightly causally mismatched, rather than a perfect match that is statistically fragile. You are prioritizing *defensibility* over *precision*.

  **The Small-N Conflict:** Requirement 8 (Small-N Viability) conflicts with Requirement 2 (Stability). If you allow forecasting on N=5 for the sake of innovation, you sacrifice Stability.
  *Resolution:* Weaken Requirement 8. If N falls below a statutory threshold (e.g., 10), the theory must mandate borrowing data from a broader, less relevant class rather than allowing a high-variance narrow forecast. This protects Stability but angers innovators.

  ### V. The Killer Requirement

  **Procedural Auditability (7)** is the single requirement that excludes the most plausible philosophical accounts.

  Most sophisticated solutions to the reference class problem (particularly Bayesian or Maximum Entropy approaches) rely on complex weighting of prior information or subjective judgments of "similarity" that cannot be easily reduced to a flowchart. A solution that says "choose the class that maximizes predictive accuracy" is useless in a hearing because accuracy is only known in hindsight. A solution that says "choose the class that feels most similar" is legally indefensible. Auditability demands that the rule be *pre-specifiable* and *mechanical*. This excludes any account that relies on holistic judgment or opaque optimization, forcing the theory toward a rigid, frequentist-style hierarchy even if that hierarchy is epistemically cruder.

  ### VI. Scorecard of Contenders

  **The Straightforward Frequentist:** (Choose the widest class with sufficient N).
  *Score:* Fails Causal Relevance. It satisfies Stability, Uniqueness, and Auditability perfectly. It will be legally defensible but may produce systematically biased forecasts for unique projects. It treats the "Narrow vs. Wide" dispute as a simple count check.

  **The Maximal Information View:** (Condition on all known relevant facts).
  *Score:* Fails Stability and Small-N Viability. As you add relevant details, the class shrinks, often to N=1. It satisfies Causal Relevance but collapses into the "Inside View" you are trying to avoid. It cannot be audited because "all relevant facts" is an endless debate.

  **The Pragmatic/Interest-Relative View:** (The class depends on the question/cost of error).
  *Score:* Fails Selection Uniqueness. If the "correct" class changes based on whether you are minimizing budget risk vs. maximizing technical accuracy, the audit office cannot issue a single ruling. It turns the hearing into a debate about values rather than facts.

  **The Bayesian Dissolution:** (There is no class, only conditional probabilities on evidence).
  *Score:* Fails Auditability and Time-Bounded Computability. While theoretically robust, it requires specifying priors and likelihood functions that are too complex for a statutory hearing. It dissolves the problem philosophically but leaves the auditor with no lever to pull.

  ### VII. Worked Applications

  **Case 1: Team proposes Wide (All tunnels since 1990); Objectors propose Narrow (Water-bearing chalk).**
  *Context:* Assume the Chalk projects are notorious for massive overruns, while the general pool is average. The Team wants the Wide class to lower the estimated cost.
  *Application:*
  1.  **Check Width:** Wide class has N=500. Narrow class has N=8.
  2.  **Apply Small-N Constraint:** The Narrow class fails the minimum threshold (N<10).
  3.  **Apply Stability:** The Wide class offers a stable distribution; the Narrow class is statistically volatile.
  4.  **Verdict:** The Wide class is selected.
  *Outcome:* The Objectors (Ministry) lose, despite having the more causally relevant class.
  *Reason:* The theory prioritizes Stability and Auditability over Relevance. The Team wins not because they are right about the geology, but because the Objectors cannot support their class with enough data. This is a visible failure of epistemic precision for the sake of procedural integrity.

  **Case 2: Team proposes Narrow (Water-bearing chalk); Objectors propose Wide (All tunnels since 1990).**
  *Context:* Assume the Chalk projects are well-documented (N=25) and show high overruns. The Team knows this and argues their project is *not* like those, but they propose the Chalk class anyway to argue for a specific mitigation budget that the Wide class doesn't capture? No, usually Team wants Narrow to claim *uniqueness* (low cost). Let's assume the Team argues the Chalk class is the only valid one, but they have engineered a solution to avoid the historical overruns of that class. The Objectors want the Wide class because it's safer.
  *Application:*
  1.  **Check Width:** Narrow class N=25. Wide class N=500. Both pass Small-N.
  2.  **Check Homogeneity:** The Wide class contains mixed geologies. Variance is high. The Narrow class is geologically homogeneous.
  3.  **Apply Causal Relevance:** Geology is a primary driver of tunnel cost. The Wide class mixes causal mechanisms (chalk vs. granite vs. clay).
  4.  **Apply Simpson's Paradox Check:** If the Wide class averages out high-risk and low-risk geologies, it may mask the specific risk of the target project.
  5.  **Verdict:** The Narrow class is selected.
  *Outcome:* The Team wins.
  *Reason:* Because the Narrow class met the minimum N threshold, the requirement for Causal Relevance overrides the preference for Width. The Objectors (Audit) lose.
  *Critique:* This reveals the vulnerability. If the Team can find *any* narrow class with N>10 that favors them, they can game the Relevance requirement. The theory requires a secondary rule: **Precedence of Description.** The class definition must be pre-registered or standard (e.g., "Geology takes precedence over Era"). Without a hierarchy of features (Geology > Year > Location), the theory remains vulnerable to gerrymandering in Case 2.

  **Final Note to the Auditor:**
  The specification above does not solve the reference class problem. It manages it. It tells you that you cannot have both perfect relevance and perfect stability. In Case 1, you sacrifice truth for stability. In Case 2, you sacrifice objectivity for relevance. Your ruling power comes not from finding the "true" class, but from enforcing the *trade-off rule* consistently. If you do not pre-decide that Width trumps Relevance below N=10, you will be ruled by the whims of the litigants.
