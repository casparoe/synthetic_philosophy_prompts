prompt: |-
  I'm about two thirds of the way through a novel and I've got a character problem that I'm pretty sure is actually a philosophy problem, so I want you to think with me rather than give me craft tips.

  My protagonist runs a small rural clinic. Over the course of the book she does a run of things everyone around her calls saintly: stays through the night for patients who aren't on her list, drives two hours in bad weather to collect a medicine, turns down a fellowship that would have got her out, and about halfway through donates a kidney to a man she's met twice. My editor's note is that she's turning into a plaster saint and the book is getting preachy. He's right, and I can't fix it with surface stuff — more drinking, a foul temper, a neglected kid — because the real problem is that I haven't decided which idea about morality I'm writing her under, and it shows in the sentences.

  So here's what I want. Compare supererogation — the category of acts that are praiseworthy but not required, going beyond the call of duty — with the Kantian idea of wide or imperfect duty, where you're genuinely obliged to adopt certain ends (help others, develop yourself) but have real latitude about when, how much, and toward whom, so that you can't be pinned to any particular act yet can be faulted for never doing any. Two frameworks that look like they describe my doctor the same way and don't.

  Be substantive about it, not a glossary entry. I specifically want:

  - what each view makes the moral status of the kidney. One of them has to say she went above and beyond; the other has to say she did something good that she also could not have done and been fine. Show me how each argues for its verdict and what it has to swallow to get there.
  - what each does to her inner life. Under one she gets to feel she's done something special; under the other the whole economy of credit and admiration is supposed to evaporate. Does the wide-duty agent feel relieved, or does she feel permanently in arrears? Which one produces guilt and which produces pride, and why.
  - how each handles the case where doing the big good thing crowds out a smaller thing she actually owed — she skips three days of clinic to be with the recipient's family and a regular patient goes unmonitored. Which framework can say something went wrong, and which can only shrug that she traded one good for a better good.
  - what each implies for the people around her. Can her colleagues resent her? Can a reader think she's showing them up, and does that reaction make sense on one view and not the other?

  Then take a side. Tell me which of the two I should write her under if I want the reader's verdict on her to stay complicated instead of collapsing into admiration, and make it concrete: give me four or five lines of her interior monologue for the same moment — the first hour after the donation, in the recovery room — written once under each framework. Point out which words in each version betray which theory, because that's the part I can't see myself. And flag the places where the two frameworks actually agree so I don't overplay the contrast for drama.

  One more thing: I know there's a consequentialist line on which nothing is supererogatory at all, because there's always a further good you could have done, so duty swallows the whole category. Say briefly where that fits and whether my doctor would even register as good on it — but keep the main event as the two-way comparison.

  Don't send me to books or build me a reading list, I'm not going to read any of it this month. Just argue it out with me in the reply.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** The user is writing a novel about a rural clinic doctor. She's becoming a "plaster saint" (too perfect/preachy). The user identifies this as a philosophy problem, not a craft problem.
      *   **Task:** Compare two ethical frameworks regarding the protagonist's actions (specifically the kidney donation):
          1.  Supererogation (acts beyond duty).
          2.  Kantian Wide/Imperfect Duty (obligation to adopt ends, latitude in execution).
      *   **Specific Requirements:**
          *   Analyze the moral status of the kidney donation under both views.
          *   Analyze the impact on her inner life (pride, guilt, relief, arrears).
          *   Analyze conflict scenarios (crowding out smaller duties, e.g., skipping clinic for the recipient).
          *   Analyze implications for others (colleagues' resentment, reader's judgment).
          *   **Take a Side:** Recommend one framework for keeping the verdict "complicated."
          *   **Concrete Example:** Write 4-5 lines of interior monologue (post-op recovery room) for *each* framework, highlighting specific words that betray the theory.
          *   **Agreement Check:** Flag where the frameworks agree (to avoid overplaying contrast).
          *   **Consequentialism:** Briefly address the view that duty swallows supererogation (maximizing good) and whether the doctor registers as good there.
          *   **Tone:** Substantive, argumentative, "think with me," no reading lists.

  2.  **Deconstruct the Ethical Frameworks:**

      *   **Supererogation:**
          *   *Core:* Duty has a limit. Beyond that limit is the "zone of grace." You get credit for going there, but no blame for staying in the duty zone.
          *   *Kidney:* Above and beyond. Heroic. Optional.
          *   *Inner Life:* Pride is permissible. Admiration is appropriate. She is "special."
          *   *Conflict:* If she skips clinic for the recipient, it's a tragic trade-off, but the kidney act remains praiseworthy. The clinic neglect might be a separate failure, but the kidney act doesn't lose its status.
          *   *Others:* Resentment is irrational (she didn't *have* to do it). But "showing up" others is possible.

      *   **Kantian Wide/Imperfect Duty:**
          *   *Core:* We have a duty to promote the happiness/welfare of others. But we have *latitude* (Spielraum) in how/when. We can't help everyone always. But we must make the end our own.
          *   *Kidney:* It falls *within* the duty to help, but it's at the extreme end of the latitude. It's not "above" duty, it's just a very heavy fulfillment of it. She couldn't have *never* helped, but she didn't *have* to do this specific act.
          *   *Inner Life:* No moral credit in the sense of "banking points." The economy of admiration evaporates. It's just what a moral agent does. Feeling "in arrears" is more likely because the duty is endless.
          *   *Conflict:* If she skips clinic (a duty to her patients) to focus on the recipient (a duty to a specific person), she might be violating the *balance* required by practical reason. She can't neglect perfect duties (clinic) for wide duties (charity) indiscriminately.
          *   *Others:* Colleagues can resent her if her "wide duty" fulfillment makes *their* duty harder (e.g., covering her clinic shifts). It's not irrational resentment; it's a systemic friction.

      *   **Consequentialism (Utilitarianism):**
          *   *Core:* Maximize good. If the kidney saves a life and creates more utility than anything else she could do, it was *obligatory*.
          *   *Verdict:* Nothing is supererogatory. If she didn't donate, she did wrong (assuming it was the max good).
          *   *Fit:* Makes her a machine. Less interesting for a novel about human complexity.

  3.  **Drafting the Comparison (Iterative Process):**

      *   *Moral Status of the Kidney:*
          *   Supererogation: It's a gift. She is a benefactor.
          *   Wide Duty: It's a discharge of obligation, just a heavy one. She is a responsible agent.
          *   *Nuance:* Supererogation allows her to say "I didn't have to." Wide Duty forces her to say "I had to do *something*, this was what presented itself."

      *   *Inner Life:*
          *   Supererogation: Allows pride. "I am good."
          *   Wide Duty: Dampens pride. "I did what was needed." Risks burnout/guilt because the duty never ends.
          *   *Key distinction:* Supererogation creates a moral hierarchy (Saint vs. Normal). Wide Duty creates a moral continuum (Agent vs. Negligent).

      *   *Crowding Out (The Clinic Conflict):*
          *   Supererogation: The kidney is a "plus." The clinic neglect is a "minus." They don't cancel out. She's still a hero who made a mistake.
          *   Wide Duty: Duties compete. If she neglects the clinic (perfect duty to specific patients) for the kidney (wide duty to humanity/one person), she might have failed the *system* of duty. The "goodness" is contaminated by the neglect.

      *   *Others/Resentment:*
          *   Supererogation: Resentment is envy. "How dare you be better than me?"
          *   Wide Duty: Resentment is structural. "Your virtue makes my job harder." (e.g., she sets a precedent others can't meet, or she leaves gaps).

  4.  **Selecting the Recommendation:**
      *   The user wants the verdict to stay *complicated*, not collapse into admiration.
      *   Supererogation leads to admiration (Saint).
      *   Consequentialism leads to judgment (Machine/Calculus).
      *   **Kantian Wide Duty** is the sweet spot. It removes the "halo" (she's just doing her job, broadly defined) but introduces the tension of *latitude*. It allows for the possibility that she chose *wrong* even while doing *good*. It makes the resentment of colleagues rational. It prevents the "plaster saint" effect because the action isn't "magic," it's "work."

  5.  **Drafting the Monologues:**
      *   *Supererogation Version:* Needs words of gift, choice, excess, separation from the norm. "Gift," "chose," "more than," "mine to give."
      *   *Wide Duty Version:* Needs words of necessity, obligation, continuity, lack of closure. "Had to," "end," "due," "still," "account."
      *   *Agreement:* Both acknowledge pain, risk, and the reality of the act.

  6.  **Addressing Consequentialism:**
      *   Keep it brief. It flattens the character. If she maximized utility, she *had* to do it. If she didn't, she's immoral. No room for "saintly," only "correct."

  7.  **Review against Constraints:**
      *   Did I avoid craft tips? Yes.
      *   Did I cover the four specific points (Kidney status, Inner life, Crowding out, Others)? Yes.
      *   Did I take a side? Yes (Wide Duty).
      *   Did I write the monologues with word analysis? Yes.
      *   Did I flag agreements? Yes.
      *   Did I mention Consequentialism? Yes.
      *   No reading lists? Yes.

  8.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* Make sure I don't paint Kantian duty as *too* rigid. The "Wide/Imperfect" part is crucial. It's not "You must donate a kidney." It's "You must help, you chose this way." The tension is in the *choice within constraint*.
      *   *Correction on Resentment:* Under Supererogation, resentment is usually seen as malicious envy. Under Wide Duty, resentment can be about the *distribution of burden*. If she donates a kidney and gets time off, her colleagues cover the clinic. That's a tangible cost.
      *   *Monologue Check:* Ensure the Supererogation one sounds a bit too "holy" (risking the plaster saint) and the Wide Duty one sounds burdened but grounded.

  9.  **Final Polish:** Check tone. Needs to be intellectual but accessible, like a colleague discussing a manuscript over coffee. (Proceed to generate output).

  *(Self-Correction Note on the "Crowding Out" point)*: I need to be careful with Kant. Perfect duties (don't lie, keep promises/contracts) usually trump imperfect duties (help others). If the clinic is her job (contract/perfect duty), skipping it for the kidney (imperfect duty) is actually a moral failure in Kantian terms, even if the kidney was good. This is a great source of conflict for the novel. Supererogation lets her off the hook easier ("I did a super good thing, oops on the clinic"). Kant makes it messier ("I fulfilled one duty by violating another"). This supports the recommendation for Kant/Wide Duty for complexity.

  *(Self-Correction on Consequentialism)*: Ensure I note that under strict consequentialism, she might actually be *blameworthy* if she didn't donate, which kills the "saint" narrative entirely.

  *(Final check on Monologues)*: Make sure the word choices are distinct.
  Supererogation: "gift," "extra," "chosen."
  Wide Duty: "owed," "part," "continues."

  Let's write.
answer: |-
  This is a sharp diagnosis. You're right: "plaster saint" syndrome isn't about lacking flaws; it's about lacking moral friction. When a character operates in a vacuum where every good act is purely additive, they become a statue. To make her human, you need a framework where doing the right thing creates tension, debt, or ambiguity.

  Here is the breakdown of the two frameworks, the verdict on which serves your novel, and the concrete application you asked for.

  ### 1. The Moral Status of the Kidney

  **Supererogation:**
  Under this view, morality has a floor (duty) and a ceiling (saintliness). The kidney donation is strictly *above* the floor.
  *   **The Verdict:** She is morally praiseworthy in a way she wouldn't be if she just ran the clinic well. She has entered the zone of the "gift."
  *   **The Cost:** To maintain this, the theory must insist she had *no obligation* to donate. If she had any obligation, it ceases to be supererogatory. This isolates the act. It makes the kidney a singular event, detached from her daily work. It creates a binary: she is either a saint (donated) or a normal professional (didn't).
  *   **The Argument:** "She saved a life she didn't have to save."

  **Kantian Wide (Imperfect) Duty:**
  Kant distinguishes between *perfect duties* (specific actions owed to specific people, e.g., treating scheduled patients) and *imperfect/wide duties* (general ends we must adopt, e.g., helping others), where we have latitude in *how* and *when* to fulfill them.
  *   **The Verdict:** The kidney is not "above" duty; it is a maximal expenditure *within* the scope of the duty of beneficence. She was obliged to make the welfare of others her end; she chose this specific, costly way to discharge it. She could have chosen differently (volunteering time, mentoring), so she isn't blameworthy for not donating *specifically*, but she isn't "extra" moral for doing so. She is just fully moral.
  *   **The Cost:** This view swallows the "heroism." It claims she *ought* to have done something significant to help, and this was the shape it took. It removes the specialness.
  *   **The Argument:** "She discharged a debt of humanity that admits of no final payment."

  ### 2. The Inner Life: Credit vs. Arrears

  **Supererogation:**
  *   **Emotion:** Pride is permissible. She can feel she has "banked" moral credit.
  *   **Psychology:** This produces a sense of completion. "I did the big thing." It allows for a narrative arc of ascent.
  *   **Risk:** It invites spiritual pride. If she feels she is "better" than those who didn't donate, the theory supports her. The economy of admiration is active; she expects applause, and the theory says she deserves it.

  **Kantian Wide Duty:**
  *   **Emotion:** Relief is possible, but guilt is more persistent. Because the duty is "wide" and endless (you can always help more), you are permanently in arrears.
  *   **Psychology:** There is no "cashing out." Donating the kidney doesn't clear her ledger for the next ten years. It just meets the demand of the present moment.
  *   **Risk:** Burnout. If every act is just a partial payment on an infinite debt, she never gets to feel "done." Admiration is irrelevant; what matters is whether she maintained her moral integrity. She shouldn't feel proud; she should feel *aligned*.

  ### 3. Crowding Out: The Clinic Conflict

  This is where your editor's concern about the book getting "preachy" lives.

  **Supererogation:**
  *   **The Conflict:** She skips clinic (duty) to be with the recipient (supererogatory care).
  *   **The Judgment:** This framework struggles here. Since the kidney act is "above" duty, it often trumps duty in our intuition. It frames the neglect of the clinic as an unfortunate side effect of greatness. "She's a saint, cut her some slack."
  *   **Result:** It excuses the negligence. The reader is nudged to forgive the missed patients because the kidney is so weighty. This creates the "preachy" feeling—rules don't apply to the saint.

  **Kantian Wide Duty:**
  *   **The Conflict:** She neglects a *perfect duty* (clinic patients have a right to her care) for an *imperfect duty* (beneficence to the recipient).
  *   **The Judgment:** Kantian ethics prioritizes perfect duties. You cannot violate a specific obligation to fulfill a general one. By skipping clinic, she actually acted *immorally*, even while doing a good thing.
  *   **Result:** This creates genuine complexity. She did a massive good (kidney) but failed her specific office (clinic). The act is tainted. The reader cannot simply admire her; they must weigh the trade-off. This prevents the "plaster saint" effect because she is demonstrably wrong in her calculus.

  ### 4. The People Around Her

  **Supererogation:**
  *   **Resentment:** If colleagues resent her, they are envious. They are angry she is "better" than them. Their resentment is irrational because she didn't *owe* them the kidney.
  *   **Reader Reaction:** The reader might feel she is showing them up, but the text frames this as the reader's/colleagues' inadequacy.

  **Kantian Wide Duty:**
  *   **Resentment:** Resentment is rational. If her "wide duty" fulfillment (kidney recovery) forces colleagues to cover her "perfect duties" (clinic), she has shifted her burden onto them. She has used her latitude to constrain *their* latitude.
  *   **Reader Reaction:** The reader can validate the colleagues' anger without invalidating her sacrifice. It becomes a systemic conflict, not a personality contest.

  ### 5. The Consequentialist Footnote

  You asked for the third line briefly. Act Utilitarianism collapses the distinction entirely. If donating the kidney produces the most net utility (life saved > pain suffered + clinic disruption), then it was **obligatory**.
  *   **Verdict:** If she didn't donate, she did wrong. If she did, she did the minimum required by rationality.
  *   **Fit for Novel:** Terrible. It turns her into a calculator. It removes the "saint" label and replaces it with "efficient." It leaves no room for the *cost* to her character, only the *cost* to the sum of happiness. It makes the reader's verdict simple: Did she maximize? Yes. Good. Move on.

  ---

  ### The Recommendation

  **Write her under Kantian Wide Duty.**

  If you want the verdict to stay complicated, Supererogation is a trap. It inherently valorizes the actor. It tells the reader, "Look how high she climbed." Wide Duty tells the reader, "Look how heavy the load is, and look where she dropped some of it while carrying the rest."

  Wide Duty allows her to be *right* about the kidney and *wrong* about the clinic simultaneously. It allows her colleagues to be angry without being villains. It prevents her from feeling like a saint, which keeps her human. It makes her exhaustion not the price of glory, but the symptom of an impossible demand.

  ### The Monologues

  Here is the same moment—one hour post-op, recovery room—written under each framework.

  **Version A: Supererogation (The Saint)**
  > "It's done. I gave him a piece of myself that no one could have asked for. The pain is sharp, but it's mine to keep, a price I chose when I could have walked away. I am more than I was yesterday. The clinic can wait; I have earned this silence."

  *   **Betraying Words:** "No one could have asked for" (denies obligation), "Chose/Walked away" (emphasizes optionality), "More than I was" (moral hierarchy/ascent), "Earned" (credit economy).
  *   **Effect:** She is separate from others. The pain is a badge of honor.

  **Version B: Kantian Wide Duty (The Agent)**
  > "It's done. One part of what is owed, paid. The pain is sharp, but it's the cost of the end I adopted. I couldn't leave him to die, not when I had the means. The clinic will be waiting; I hope they can forgive the absence. There is still so much left to do."

  *   **Betraying Words:** "Owed/Paid" (debt metaphor, not gift), "End I adopted" (duty language), "Couldn't" (necessity vs. choice), "Forgive the absence" (acknowledges violation of perfect duty), "Still so much left" (no completion/arrears).
  *   **Effect:** She is connected to others. The pain is a transaction cost. The job isn't finished.

  ### Where They Agree (Don't Overplay the Contrast)

  Do not make the Kantian version sound cold or robotic. Both frameworks agree on:
  1.  **The Physical Reality:** The pain is real and identical in both.
  2.  **The Volition:** She was not coerced. Even in Wide Duty, she chose *this* act over *that* act.
  3.  **The Value:** Both agree the recipient is better off.

  The difference isn't in the action; it's in the *afterimage*. Supererogation leaves a halo. Wide Duty leaves a shadow of what else still needs doing. For a novel that wants to avoid preachiness, you want the shadow. It keeps the light from blinding the reader.
