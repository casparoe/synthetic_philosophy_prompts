prompt: |-
  I'm sitting in a seminar on disagreement and evidence this semester, mostly upper-level undergrads plus two MA students, and we've spent the last four weeks on higher-order evidence. Here's my problem: every reading seems to assume a different answer to a question that comes before the arguments, namely what an account of higher-order evidence is even supposed to do. Our professor keeps telling us to just look at the cases, but the cases get described differently depending on which camp is describing them, so the verdicts fall out of the setup rather than the argument. I'm supposed to pick a paper topic next week and I don't want to write about a dispute until I know what would settle it. So: give me the spec. What does an adequate theory of higher-order evidence have to deliver, requirement by requirement — and for each one, what's the phenomenon that motivates it (the case it has to get right, the distinction it can't collapse, the background result it can't contradict), and is it genuinely non-negotiable or is it just something one side of the debate insists on and the other side would happily reject?

  The cases I care about at minimum: the impairment ones, where you get credible news that your reasoning is compromised by something like a drug or altitude or fatigue while your evidence about the first-order question is unchanged (including the version where the news is misleading and nothing is actually wrong with you); the peer-disagreement ones; the iterated ones, where you get higher-order evidence about your higher-order evidence, and whether the theory has to keep that from running away; and ones where the thing you're told to distrust is a competence you already have a lot of independent reason to trust, like arithmetic or reading a gauge you use every day. The distinctions I want respected: evidence about the world versus evidence about your evidence; actually having a defeater versus merely having reason to think you have one; being rational versus being rational-by-your-own-lights; "I can't tell whether I'm impaired" versus "I'm impaired"; and whatever a theory says has to be consistent with the fact that you can't generally be in a position to know that your own cognitive states are obtaining, so no theory gets to assume you always have transparent access to your own reliability. Also worth saying explicitly which candidate requirements are doing no real work — like demands that a theory explain every intuitive verdict about every case, since half the verdicts are what's contested.

  The part I actually most want is the tension, if there is one. My suspicion is that the list can't all be satisfied at once, roughly along these lines: if higher-order evidence genuinely defeats, then in the drug case you're required to drop your confidence, but by your own lights the first-order evidence still supports the high confidence, so you're required to hold exactly the mismatched pair of attitudes that a separate and widely accepted constraint says is forbidden. If something like that is right, tell me which requirement has to give and what the options look like once you give it up, and tell me which single requirement does the most work knocking candidates out. Then briefly — a few lines each, no scorecard — where the main contenders land against the list: the view that your total evidence including the higher-order stuff just fixes your attitude, the steadfast view, the level-splitting view that says you can be both rational and akratic, and the conciliatory take imported from disagreement. Don't bother with references or a reading list, I'll chase those down in the library myself; I want the criteria argued for rather than asserted, because that's the part I can't get from the handouts.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** Upper-level undergrad/MA seminar on disagreement and evidence, specifically higher-order evidence (HOE).
      *   **Problem:** Readings assume different definitions/goals of HOE theories. Cases are described tendentiously. The student wants to know *what an adequate theory is supposed to do* before picking a topic.
      *   **Task:** Provide a "spec" (specification) of requirements for an adequate theory of HOE.
      *   **Specifics Required:**
          *   Requirement by requirement.
          *   Motivating phenomenon/case for each.
          *   Distinction it must respect.
          *   Status: Non-negotiable vs. Contested.
          *   The Tension: Identify if requirements are jointly unsatisfiable (the "akrasia" problem).
          *   Which requirement must give? Options if dropped.
          *   Which requirement does the most work?
          *   Brief positioning of main contenders (Total Evidence, Steadfast, Level-Splitting, Conciliatory).
      *   **Constraints:** No references/reading lists. Argue for criteria, don't just assert. Keep it dense and philosophical (suitable for the level).

  2.  **Deconstruct the "Spec" (Requirements for a Theory of HOE):**
      *   *Requirement 1: Sensitivity to Impairment.* (The Drug/Fatigue Case).
          *   Phenomenon: Learning you are drugged should lower confidence, even if first-order evidence (FOE) is unchanged.
          *   Distinction: FOE vs. HOE.
          *   Status: Mostly non-negotiable, but Steadfasters challenge the *force* of HOE.
      *   *Requirement 2: Non-Self-Undermining (Stability).* (The Iteration Case).
          *   Phenomenon: HOE about HOE shouldn't lead to total skepticism or oscillation.
          *   Distinction: Defeater vs. Reason to think there's a defeater.
          *   Status: Non-negotiable (theoretical coherence).
      *   *Requirement 3: Rationality vs. Rational-by-Own-Lights.* (The Akrasia Case).
          *   Phenomenon: Can you be rational while believing your belief is irrational?
          *   Distinction: Objective rationality vs. Subjective rationality.
          *   Status: Highly Contested (Level-Splitters say yes, others say no).
      *   *Requirement 4: Transparency/Luminosity Constraint.*
          *   Phenomenon: We don't have perfect access to our reliability.
          *   Distinction: "I am impaired" vs. "I can't tell if I am impaired."
          *   Status: Non-negotiable (epistemic humility).
      *   *Requirement 5: Action-Guidingness (Normative Force).*
          *   Phenomenon: Epistemology should guide inquiry.
          *   Distinction: Descriptive vs. Normative.
          *   Status: Contested (some views make rationality unreachable).

  3.  **Identify the Core Tension:**
      *   The "Epistemic Akrasia" problem.
      *   If HOE defeats (Req 1), you must lower confidence.
      *   But if FOE supports $P$ strongly, and you know FOE supports $P$, then believing $\neg P$ (or low confidence) seems irrational by your own lights.
      *   This creates a clash between *Responding to HOE* and *Avoiding Akrasia* (believing $P$ while believing belief in $P$ is irrational).
      *   *The "Non-Negotiable" that breaks:* The prohibition on Akrasia (Rational Monism).

  4.  **Evaluate the Contenders against the Spec:**
      *   *Total Evidence View:* HOE is just more evidence. Updates via conditionalization.
          *   Pros: Unified.
          *   Cons: Struggles with the specific *defeating* nature of HOE (why does it target the *process*?).
      *   *Steadfast:* FOE trumps HOE.
          *   Pros: Avoids Akrasia.
          *   Cons: Violates intuition in Drug cases (ignoring impairment seems crazy).
      *   *Level-Splitting:* You can be rational to believe $P$ and rational to believe your belief in $P$ is irrational.
          *   Pros: Saves the intuition that HOE defeats.
          *   Cons: Accepts Akrasia (violates a traditional norm).
      *   *Conciliatory (Disagreement based):* Split the difference.
          *   Pros: Social dimension.
          *   Cons: Doesn't handle non-social HOE (drugs) well without modification.

  5.  **Drafting the Response (Iterative refinement for tone and density):**
      *   *Tone:* Academic, precise, slightly weary of the literature's messiness (matching the user's frustration).
      *   *Structure:*
          1.  Introduction: Acknowledge the meta-problem (the "spec" is the battleground).
          2.  The Requirements (The Spec): Break down into 4-5 key constraints.
          3.  The Tension (The Impossible Trinity): Explain the conflict.
          4.  The Break Point: Which requirement fails?
          5.  Contender Positioning: Brief mapping.
      *   *Refining the "Spec":* Make sure to distinguish between *phenomenological* requirements (cases) and *structural* requirements (consistency).
      *   *Refining the Tension:* Focus on the "Enkratic Principle" (do what your evidence says) vs. "Immodesty" (trust your own reasoning).
      *   *Addressing the User's Specific Cases:* Ensure Drug, Peer, Iteration, and Competence cases are mapped to the requirements.

  6.  **Self-Correction/Check during drafting:**
      *   *Did I answer the "Non-negotiable vs. Contested" part?* Yes, need to be explicit about which is which. The prohibition on akrasia is the main contested one.
      *   *Did I explain *why* a requirement is motivated?* Yes, link to the specific cases (e.g., Drug case motivates Sensitivity).
      *   *Is the "Single Requirement doing the most work" identified?* Yes, usually the Enkratic Principle or the Norm of Truth. Let's focus on the *Enkratic Principle* (don't believe $P$ while believing belief in $P$ is irrational).
      *   *Is the tone right?* Avoid being too introductory. Assume knowledge of terms like "defeater," "conditionalization," "akrasia."

  7.  **Final Polish:** Check against the prompt's specific constraints (no references, argue for criteria, brief contender summaries). Ensure the distinction between "evidence about world" and "evidence about evidence" is clear in the Spec.

  *(Self-Correction on the "Single Requirement"):* The prompt asks which requirement does the most work knocking candidates out. It's likely the requirement that *HOE must have normative force* (it must change what you should believe). If you drop that, you're Steadfast. If you keep it, you risk Akrasia. So the "Normative Force of HOE" is the hammer. But the *casualty* is the "No Akrasia" constraint. I need to be precise here. The requirement that *creates* the tension is "Respond to HOE." The requirement that *breaks* is "Avoid Akrasia." I will frame it as the tension between **Responsiveness** and **Coherence**.

  Let's write.
answer: |-
  Here is the specification you are asking for. The reason your seminar feels like people are talking past each other is that the literature treats the *function* of higher-order evidence (HOE) as a parameter to be fixed by the theory, rather than a constraint on the theory. Most authors smuggle in their conclusion by defining HOE as "evidence that mandates conciliation" or "evidence that is screened off by first-order evidence."

  To evaluate the theories, you need a neutral spec. An adequate theory of HOE must satisfy the following five requirements. I have marked which are near-universal (Non-Negotiable) and which are the actual fault lines (Contested).

  ### The Spec: Five Requirements for a Theory of Higher-Order Evidence

  **1. The Sensitivity Requirement (Non-Negotiable)**
  *   **The Phenomenon:** The Impairment Case. You calculate a math problem. You have strong first-order evidence (FOE) that the answer is 43. You then receive credible testimony that your coffee was laced with a drug that renders you unable to do math, though it leaves your confidence intact.
  *   **The Demand:** The theory must explain why your rational credence in "43" drops upon learning about the drug, even though the drug does not change the mathematical facts or your access to the calculation you already performed.
  *   **The Distinction:** Evidence about the *truth of P* vs. evidence about the *reliability of the process producing belief in P*.
  *   **Why it matters:** If a theory says you should ignore the drug news because the math is still math, it violates a basic intuition about rational self-monitoring. A theory that cannot handle the drug case is usually dead on arrival, unless it argues that the drug news *is* first-order evidence (which leads to Requirement 2).

  **2. The Non-Self-Undermining Requirement (Non-Negotiable)**
  *   **The Phenomenon:** The Iteration Case. You get HOE that you are impaired. Then you get HOE about that HOE (e.g., a reliable source tells you the report about the drug was a joke). Or, more dangerously, a theory where recognizing HOE forces you to lower confidence so much that you become unsure if you should have lowered confidence, leading to a regress or oscillation.
  *   **The Demand:** The theory must allow for stable equilibrium. Updating on HOE cannot systematically destroy your ability to update on further HOE. It must distinguish between *having a defeater* and *having reason to think you have a defeater*.
  *   **The Distinction:** Actual reliability vs. estimated reliability.
  *   **Why it matters:** If a theory implies that recognizing your own fallibility makes you globally skeptical or unable to form any view, it is pragmatically self-defeating. It must respect the fact that we can reason about our reasoning without collapsing into silence.

  **3. The Transparency Constraint (Non-Negotiable)**
  *   **The Phenomenon:** The Luminosity Failure. You are impaired, but you feel fine. Or, you are competent, but you feel impaired.
  *   **The Demand:** The theory cannot assume you have infallible access to your own cognitive states. It must handle cases where your *actual* reliability and your *estimated* reliability come apart (the misleading drug case).
  *   **The Distinction:** "I am impaired" (factive) vs. "I have evidence I am impaired" (non-factive).
  *   **Why it matters:** If a theory requires you to know you are impaired to be rationally affected by it, it fails the misleading case. If it requires you to be affected even when you *know* you aren't impaired (just because you have misleading evidence), it risks severing rationality from truth. The theory must navigate the gap between the normative status of your belief and your access to that status.

  **4. The Responsiveness Requirement (Contested)**
  *   **The Phenomenon:** The Normative Force of HOE. In the drug case, it feels like you *ought* to lower your confidence. It is not merely permissible; it is rationally mandated.
  *   **The Demand:** HOE must act as a genuine *defeater*, not just a distractor. It must change the rational doxastic attitude.
  *   **The Distinction:** Rationality vs. Rational-by-Your-Own-Lights.
  *   **Status:** **This is the primary battleground.** Steadfasters reject this. They argue that if the FOE supports $P$, and HOE is just evidence that you *think* the FOE doesn't support $P$, you should trust the FOE. If you accept this requirement, you are committed to Conciliationism or Level-Splitting. If you reject it, you are Steadfast.
  *   **Why it matters:** This requirement does the most work knocking candidates out. If you insist HOE *must* move your credence, you immediately create tension with Requirement 5.

  **5. The Coherence Requirement (Contested)**
  *   **The Phenomenon:** Epistemic Akrasia. The state of believing $P$ while simultaneously believing that believing $P$ is irrational (given your total evidence).
  *   **The Demand:** Traditionally, epistemology forbids akrasia. A rational agent's attitudes should cohere across levels. You should not believe $P$ if you believe your evidence doesn't support $P$.
  *   **The Distinction:** Object-level rationality vs. Meta-level rationality.
  *   **Status:** **This is the casualty.** Level-Splitters reject this. They argue that in HOE cases, akrasia is not just permitted but *required*.
  *   **Why it matters:** This is the traditional "No Akrasia" principle (often linked to the Enkratic Principle). It is widely accepted in general epistemology but specifically targeted by HOE literature.

  ---

  ### The Tension: The Impossible Trinity

  You suspected the list cannot be satisfied at once. You are correct. There is a trilemma involving **Sensitivity**, **Responsiveness**, and **Coherence**.

  1.  **Sensitivity:** You must react to the drug news (Req 1).
  2.  **Responsiveness:** That reaction must be a reduction in confidence in $P$ (Req 4).
  3.  **Coherence:** You cannot believe $P$ while believing your confidence in $P$ is too high (Req 5).

  **The Conflict:**
  In the drug case, your First-Order Evidence (the calculation) still strongly supports $P$. If you are rational, you recognize that the calculation supports $P$. However, the Higher-Order Evidence (the drug) tells you that your recognition of that support is unreliable.
  *   If you satisfy **Sensitivity** and **Responsiveness**, you lower your confidence in $P$.
  *   But since you know the FOE (the math) hasn't changed, you also believe that the FOE still supports high confidence in $P$.
  *   Therefore, you end up believing $P$ (to some degree) while believing that your evidence supports a *different* degree of belief.
  *   This violates **Coherence**. You are in an akratic state: "I believe $P$ is 60% likely, but I believe my evidence says $P$ should be 90% likely."

  **Which Requirement Has to Give?**
  You cannot keep all three. One must be downgraded from "Non-Negotiable" to "Optional."

  *   **Option A: Drop Responsiveness (The Steadfast Move).**
      *   *Solution:* HOE doesn't defeat FOE. You stick with the math.
      *   *Cost:* You violate the strong intuition in the Drug Case. It makes rationality look immodest (you must assume you are not drugged even when told you are).
      *   *Verdict:* Saves Coherence, kills Sensitivity/Responsiveness.

  *   **Option B: Drop Coherence (The Level-Splitting Move).**
      *   *Solution:* Accept that rationality can be fragmented. It is rational to believe $P$ (due to FOE) and rational to believe your belief in $P$ is unjustified (due to HOE).
      *   *Cost:* You accept epistemic akrasia as a stable, rational state. This violates a deep structural norm of agency (that you should align your actions/beliefs with your judgment of what is best).
      *   *Verdict:* Saves Sensitivity/Responsiveness, kills Coherence.

  *   **Option C: Drop Sensitivity (The Total Evidence/Conditionalization Move).**
      *   *Solution:* Treat HOE as just more FOE. Update via standard conditionalization.
      *   *Cost:* This often collapses into Steadfastness or requires such complex modeling that it fails the "Transparency Constraint" (requiring agents to track probabilities they can't access). It struggles to explain why HOE feels *different* from ordinary bad news.
      *   *Verdict:* Tries to save Coherence by redefining HOE, often fails to capture the specific defeating force.

  **The Single Requirement Doing the Most Work:**
  **Responsiveness (Req 4).**
  If you insist that HOE *must* mandate a change in doxastic attitude independent of the FOE content, you force the theory into the Akrasia trap. If you allow that HOE is just evidence that gets weighed against FOE (Total Evidence), the tension dissolves but the specific "defeater" intuition weakens. The demand that HOE acts as a *special* kind of evidence that targets the *link* between evidence and conclusion, rather than the conclusion itself, is what generates the paradox.

  ---

  ### Contender Positioning

  **1. The Total Evidence View**
  *   **Stance:** HOE is just evidence. It enters the total stock and you conditionalize.
  *   **Performance:** Satisfies **Coherence** and **Transparency**. Struggles with **Sensitivity**. It often implies you should be more steadfast than intuition suggests because the math doesn't change. It fails to explain why HOE feels like a *defeater* rather than just counter-evidence.
  *   **Verdict:** Technically consistent, but phenomenologically weak on the drug cases.

  **2. The Steadfast View**
  *   **Stance:** FOE trumps HOE. If the logic holds, the drug news is irrelevant to the truth of the logic.
  *   **Performance:** Satisfies **Coherence** perfectly. Explicitly rejects **Responsiveness**.
  *   **Verdict:** Avoids akrasia but at the cost of making rational agents look arrogantly blind to their own physiological limitations. Good for avoiding skepticism, bad for explaining the intuition that you should doubt yourself when drugged.

  **3. The Level-Splitting View**
  *   **Stance:** You can rationally hold mismatched attitudes across levels. "I believe $P$, but I believe I shouldn't."
  *   **Performance:** Satisfies **Sensitivity** and **Responsiveness**. Explicitly rejects **Coherence**.
  *   **Verdict:** Captures the drug case intuition best. Pays the price of making rationality fragmented. It argues that the "No Akrasia" norm is a ideal that HOE cases show is impossible to maintain.

  **4. The Conciliatory View (Imported from Disagreement)**
  *   **Stance:** Split the difference between your view and the "view" indicated by the HOE (treated as a peer).
  *   **Performance:** Satisfies **Sensitivity**. Struggles with **Non-Self-Undermining** (iteration can lead to spiraling skepticism). It treats HOE as a social proxy, which works for peer disagreement but is awkward for non-social HOE (like fatigue).
  *   **Verdict:** Strong on the social cases, requires modification to handle the impairment cases without collapsing into Level-Splitting.

  ### Summary for Your Topic
  If you want a paper topic, do not try to solve the whole spec. Pick the tension between **Responsiveness** and **Coherence**.
  *   *Argument:* If you keep Responsiveness (HOE defeats), you must explain why Akrasia is acceptable (defend Level-Splitting).
  *   *Counter:* If Akrasia is unacceptable, you must explain why the Drug Case intuition is wrong (defend Steadfastness).
  *   *The "Spec" Insight:* The debate isn't about the cases; it's about whether you value the *intuition that impairment matters* more than the *norm that belief must align with estimated support*. That is the trade-off.
