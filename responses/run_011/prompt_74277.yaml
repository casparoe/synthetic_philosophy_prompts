  So to answer your question about what the world looks like: in a world with only specification problems, we see systems that clearly violate known constraints or fail to meet stated goals. In a world with composition problems, we see systems that satisfy everyone superficially while systematically silencing minority consistent views through collapse, or adopting extreme coherent positions through capture, all while appearing perfectly helpful. The difference is that in the latter case, there is no principal who can say this is not what I asked for, because the output is the statistical inevitability of the training process itself. We are not missing a target; we are hitting a target that never should have been formed.
