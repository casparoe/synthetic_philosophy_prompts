      *   *Implication for B:* S lacks *spatial* comprehension despite text competence. N lacks *conceptual* comprehension despite nav competence. M shows that combining competences doesn't automatically yield the "unity" or "transfer" required for full comprehension. The gap between S's text success and N's nav success suggests a missing "model" that neither fully possesses.

