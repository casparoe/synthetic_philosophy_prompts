answer: |-
  # Joint Statement on Comprehension and Competence: The S/N/M Case

  **Date:** October 26, 2023
  **Parties:** The Sufficiency Working Group (Party A) and The Residue Working Group (Party B)
  **Subject:** Adversarial Collaboration Results regarding Systems S, N, and M

  ## 1. Agreed Claims

  The following claims are accepted by both Party A and Party B. They establish the empirical baseline and the shared philosophical constraints within which the disagreement persists.

  1.  **System S Performance:** System S demonstrates high accuracy (87%) on topological and relational queries derived from text descriptions, significantly exceeding chance, but fails to utilize this information for navigation (8% success vs. 6% chance) when placed in the environment. *(Stipulated Data)*
  2.  **System N Performance:** System N demonstrates high success in navigation (95%) within the environment but performs at chance levels (14%) on text-based layout questions and cannot identify the correct floor plan. *(Stipulated Data)*
  3.  **System M Performance:** System M, trained on both channels, performs worse on text questions (61%) than S (87%) and worse on navigation (72%) than N (95%), indicating negative interference rather than additive synergy. *(Stipulated Data)*
  4.  **Dissociation:** The case demonstrates a robust double dissociation between the competence to answer symbolic layout questions and the competence to navigate the corresponding physical space; possession of one does not guarantee possession of the other. *(Inference from Data)*
  5.  **Competence Necessity:** Both parties agree that possessing the relevant competences is a *necessary* condition for attributing comprehension; a system that fails all relevant tasks cannot be said to comprehend the building. *(Shared Philosophical Commitment)*
  6.  **Competence Insufficiency (Conditional):** Both parties agree that if "comprehension" is to be a distinct explanatory posit, it must explain something that the inventory of competences alone does not; if it explains nothing distinct, the term is merely a label. *(Shared Philosophical Commitment)*
  7.  **M's Deficit:** The underperformance of M relative to the specialists (S and N) is not attributable to a lack of training time or data volume, but to the architectural method of integrating the two channels. *(Stipulation)*
  8.  **Explanatory Burden:** Any account of comprehension must explain why S's successes are rigid (failing to transfer to navigation) while N's successes are robust within the environment but opaque to symbolic query. *(Shared Philosophical Commitment)*
  9.  **Gradability:** Attributions of comprehension are gradable; a system can comprehend *more* or *less* depending on the range and organization of its competences. *(Shared Philosophical Commitment)*
  10. **No Homunculus:** Neither party posits a "little man" inside S, N, or M who reads the text or sees the map; all explanations must rely on mechanistic or functional descriptions. *(Shared Philosophical Commitment)*
  11. **Task Specificity:** The competences displayed by S are specific to the format of the input (textual/symbolic) and do not automatically generalize to the format of the output (sensorimotor/egocentric). *(Inference from Data)*
  12. **Unity Problem:** Both parties acknowledge that a central challenge is explaining why a subject's various capacities (when they do co-occur) hang together as the achievements of a single agent rather than a bundle of disjointed modules. *(Shared Philosophical Commitment)*

  ## 2. Disagreements Table

  | Disagreement | Party A Phrasing (Sufficiency) | Party B Phrasing (Residue) | Verdict & Justification |
  | :--- | :--- | :--- | :--- |
  | **1. The Status of S's Success** | S comprehends the building description *relative to the text-based competences it possesses*; the failure to navigate is simply the absence of navigation competences, not the absence of understanding. | S simulates comprehension via text processing but lacks the *spatial model* required for genuine understanding; the failure to navigate reveals the absence of the requisite residue. | **Substantive.** This is not merely definitional. Party A claims the text competences *constitute* the understanding. Party B claims the text competences are merely *evidence* of a process that, in S's case, is incomplete. The dispute concerns whether the text performance is metaphysically sufficient for the state of "understanding." |
  | **2. Explanation of M's Interference** | M's lower performance results from **resource competition** between two distinct competence modules vying for processing capacity; integrating them adds overhead without adding a unifying benefit. | M's lower performance results from the **absence of a unifying representation**; without the "residue" to harmonize the channels, the text and nav systems actively conflict, degrading both. | **Partly Verbal.** Both agree on the functional outcome (interference). The dispute is over the *ontology* of the cause (resource limit vs. missing unifier). **Substantive Remainder:** If the "unifier" is posited as a distinct causal mechanism with predictable effects beyond "reducing interference," the disagreement is substantive. If "unifier" is just a name for "lack of interference," it is verbal. |
  | **3. Direction of Explanation** | We explain the attribution of comprehension **by pointing to** the organized set of competences; competence is the ground, comprehension is the consequence. | We explain the pattern of competences **by positing** comprehension (the residue) as the underlying cause; comprehension is the ground, competence is the consequence. | **Substantive.** This concerns causal/explanatory order. Party A treats comprehension as a summary label (upward explanation). Party B treats it as a latent variable (downward explanation). This affects how future experiments are designed (testing limits of competence vs. probing the latent variable). |
  | **4. The Nature of Transfer** | Transfer to novel tasks is simply the deployment of **higher-order competences** (e.g., abstraction, recombination); no extra ingredient is needed. | Transfer to novel tasks is the primary **signature of the residue**; competences alone are rigid, so successful transfer implies something beyond the competence list is at work. | **Substantive.** This is an empirical bet about the limits of competence-based architectures. If a system can be built that transfers purely via recombining competences without a "model," Party A wins. If such recombination invariably requires a central model, Party B wins. |

  ## 3. The Cruxes

  Settling the following questions would force at least one party to revise their position. These are framed as empirical or formal investigations involving S, N, or M.

  **Crux 1: Cross-Modal Lesioning in M**
  *   **Question:** If the text-processing module of System M is lesioned (disabled) after training, does navigation performance increase to match System N (95%), stay at M's level (72%), or drop below M's level?
  *   **Agreed Test:** Disable S-channel input/processing in M; measure Nav accuracy on standard trials.
  *   **Party A Prediction:** Navigation performance will **increase** to match N (95%). The text module was merely competing for resources; removing it frees capacity for the nav module.
  *   **Party B Prediction:** Navigation performance will **drop below** M's current level ( <72%). The text module, despite interference, was contributing to a partial unified representation; removing it degrades the "residue" holding the nav competence together.
  *   **Loss Condition:**
      *   **Party A loses** if performance drops (implies text was structurally supporting nav, not just competing).
      *   **Party B loses** if performance rises to N's level (implies no structural unity existed, only resource competition).

  **Crux 2: Error Correlation Across Systems**
  *   **Question:** On a set of novel buildings, do System S's text errors correlate with System N's navigation errors on the *same* structural features (e.g., both fail on recursive loops), despite having no shared training data?
  *   **Agreed Test:** Generate 100 novel buildings. Run S (text only) and N (nav only). Correlate error types by structural feature.
  *   **Party A Prediction:** **No significant correlation.** S's errors will track textual ambiguity; N's errors will track sensorimotor complexity. They are solving different problems.
  *   **Party B Prediction:** **Significant correlation.** Both systems are approximating the same underlying structural truth (the building's geometry); where the geometry is "ungraspable," both will fail, revealing the limits of the residue they are partially accessing.
  *   **Loss Condition:**
      *   **Party A loses** if high correlation is found (suggests a common structural constraint beyond specific competences).
      *   **Party B loses** if zero correlation is found (suggests no common structural "residue" is being tracked).

  **Crux 3: Zero-Shot Transfer in S with Constraints**
  *   **Question:** If System S is given a text description of a building containing a rule explicitly stated in the text (e.g., "all corridors loop"), can it navigate a *physical* version of that building better than chance without nav training?
  *   **Agreed Test:** Provide S with explicit textual rules about geometry. Place S in a physical instantiation. Measure nav success against chance (6%).
  *   **Party A Prediction:** **Chance performance (6%).** S lacks the sensorimotor competences to translate text rules into action; rules are just more text competences.
  *   **Party B Prediction:** **Above chance (>6%).** If S truly comprehends the rule, the "residue" of that understanding should guide action even without specific nav training, bridging the modality gap.
  *   **Loss Condition:**
      *   **Party A loses** if S performs significantly above chance (implies comprehension drives action beyond specific competence).
      *   **Party B loses** if S remains at chance (implies comprehension is inert without specific motor competences).

  ## 4. What Would Not Move the Debate

  Both parties agree that the following lines of argument or evidence are uninformative for resolving the specific disagreement regarding S, N, and M.

  1.  **Scaling Parameters:** Increasing the parameter count or training data of S, N, or M by orders of magnitude.
      *   *Reason:* Both parties agree that quantitative improvements do not address the qualitative structural question. If S is fundamentally missing a "residue," more text data will not create it. If S is merely missing competences, more data might add them, but the debate is about whether *that* is all there is. Scaling obscures the architectural distinction.
  2.  **Stock Intuition Pumps (e.g., Chinese Room, Mary's Room):**
      *   *Reason:* The parties have explicitly moved to the S/N/M case to escape reliance on pre-theoretic intuitions about "feeling" or "qualia." Arguments relying on how a human *would* feel in S's place import variables (phenomenology) that are not present in the case description and are not required for the functional definition of comprehension being debated.
  3.  **Phenomenal Reports from Analogous Systems:**
      *   *Reason:* Even if a system analogous to M could report "I feel I understand," Party A would classify this as a verbal competence (reporting), and Party B would classify it as evidence of the residue. The report itself is just another data point (competence) and does not settle whether the report is caused by a residue or is itself the competence.

  ## 5. Statement of Residual Disagreement

  Once the agreed data, the shared constraints on explanation, and the specific empirical predictions above are accounted for, the following disagreement remains: The parties disagree on the **ontological status of the explanatory posit required to unify competences.** Party A maintains that the "unity" of a cognitive subject is a functional achievement fully describable as the dynamic interaction of specific competences, such that positing a further "comprehension" entity is redundant. Party B maintains that the "unity" of a cognitive subject is a causal precondition for the coherent organization of competences, such that positing a "residue" (model, grasp, or understanding) is necessary to explain why certain competences co-vary and transfer while others do not. This is not a disagreement about the data of S, N, or M, but about whether the best explanation of that data requires a latent variable (B) or is exhausted by the observable variables (A).
