answer: |-
  ### 1. Setting
  A freelance consultant faces two independent contract offers contingent on a municipal zoning waiver. Historical agency data shows the waiver is granted in exactly 50% of comparable cases. Contract A requires a $100 non-refundable filing fee; if granted, net profit is $110 (total revenue covers fee plus profit), otherwise she loses the fee. Contract B requires a $10,000 fee; if granted, net profit is $35,000, otherwise she loses the fee. She has sufficient savings to cover either fee without altering her basic consumption, and the decisions are one-shot.

  ### 2. The Two Decisions
  The agent faces Contract A (modest) and Contract B (large) separately.
  **Modest Gamble:** Outcomes -$100, +$110. Probability 0.5 each. Expected Value (EV) = +$5.
  **Large Gamble:** Outcomes -$10,000, +$35,000. Probability 0.5 each. EV = +$12,500.
  **Verdicts:** The agent declines Contract A, accepts Contract B. Because utility is linear in money, these verdicts depend only on the gamble structure, not initial wealth. Thus, she declines Contract A whether her savings are $5,000 higher or lower than baseline.

  ### 3. The Expected-Utility Check
  No expected-utility (EU) maximizer with concave utility can accept this pattern. Rejecting the modest gamble at every wealth level in a range implies that the marginal utility of money diminishes rapidly. Specifically, rejecting a 50/50 loss of 100/gain of 110 implies that the utility gained from $110 is less than the utility lost from $100. Over a wealth range of several thousand dollars, this local curvature compounds: the utility function must flatten so aggressively that additional wealth adds negligible value. Consequently, when evaluating the large gamble, the utility gain from $35,000 becomes too small to offset the utility loss from $10,000. The assumption of concavity is used to propagate the local risk aversion required to reject the modest gamble into the global risk aversion that forces rejection of the large one.

  ### 4. The Risk-Weighted Check
  We use $u(x) = x$ and $r(p) = p^2$. The REU formula for outcomes $\alpha_1 < \alpha_2$ is $\alpha_1 + (\alpha_2 - \alpha_1)r(P(\alpha_2))$.
  **Status Quo:** Value = 0.
  **Modest Gamble:** $\alpha_1 = -100, \alpha_2 = 110$. $P(\alpha_2) = 0.5$.
  $REU = -100 + (110 - (-100)) \cdot (0.5)^2 = -100 + 210 \cdot 0.25 = -100 + 52.5 = -47.5$.
  Since $-47.5 < 0$, **Decline**.
  **Large Gamble:** $\alpha_1 = -10,000, \alpha_2 = 35,000$.
  $REU = -10,000 + (35,000 - (-10,000)) \cdot 0.25 = -10,000 + 45,000 \cdot 0.25 = -10,000 + 11,250 = +1,250$.
  Since $1,250 > 0$, **Accept**.
  The stakes were adjusted from an initial 200/400 scale to 100/110 and 10k/35k to ensure the modest gamble is rejected (requires gain < 3 × loss) while the large one is accepted (requires gain > 3 × loss).

  ### 5. The Background-Risk Stress Test
  Suppose the agent faces an independent background risk: 50/50 -$110 or +$110 (EV = 0, spread 220 ≥ modest spread 210).
  **Background Only:** $REU = -110 + 220(0.25) = -55$.
  **Modest + Background:** Four outcomes, each prob 0.25:
  1. -$100 - $110 = -$210
  2. -$100 + $110 = +$10
  3. +$110 - $110 = $0
  4. +$110 + $110 = +$220
  Ordered: -210, 0, 10, 220. Cumulative probabilities for REU sum: $P(\ge 0)=0.75, P(\ge 10)=0.5, P(\ge 220)=0.25$.
  $REU = -210 + (0 - (-210))(0.75^2) + (10 - 0)(0.5^2) + (220 - 10)(0.25^2)$
  $= -210 + 210(0.5625) + 10(0.25) + 210(0.0625)$
  $= -210 + 118.125 + 2.5 + 13.125 = -76.25$.
  **Verdict:** Compare -76.25 (Gamble+Back) vs -55 (Back). Since -76.25 < -55, **Decline**. The verdict does not flip.
  **EU Prediction:** An EU maximizer with concave utility would also decline, but typically predicts the penalty for taking the gamble should *increase* with background risk (due to prudence). Here, the REU penalty shrinks (from -47.5 relative to 0, to -21.25 relative to -55). The theories agree on the verdict but diverge on sensitivity to background risk.

  ### 6. Diagnosis
  The single feature generating the pattern is the **convexity of the risk function** ($r(p)=p^2$). This downweights the probability of the gain more heavily than the certainty equivalent of the loss baseline. If you remove this feature (set $r(p)=p$), the model collapses to EU, making the combination of verdicts impossible. If you rescale the modest gamble so stakes are a substantial fraction of wealth, the linear utility assumption becomes empirically implausible, but within the model's logic, the verdicts remain unchanged because wealth levels cancel out.

  ### 7. Objections
  **Objection 1:** "Linear utility is unrealistic for stakes involving tens of thousands of dollars; real agents have diminishing marginal utility of wealth."
  **Assessment:** This attacks the framework, not the logic. The exercise isolates risk attitude from wealth effects. Even allowing for concave utility, EU cannot match the verdicts (as shown in Step 3), whereas REU can accommodate them without relying on utility curvature.
  **Objection 2 (from Step 5):** "Adding background risk reduced the REU penalty for the modest gamble (from 47.5 to 21.25), whereas standard theory suggests background risk should increase aversion. This implies REU models risk aggregation incorrectly."
  **Assessment:** This highlights a structural divergence. EU relies on variance and curvature (prudence), while REU relies on probability weighting of ordered outcomes. The REU theorist answers that risk is not merely variance; the reshuffling of outcome ranks under background risk changes the weighted sum in ways EU cannot capture, offering a distinct explanation for how independent risks interact.
