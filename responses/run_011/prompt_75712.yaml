answer: |-
  You have chosen the hardest case precisely because it forces us to distinguish between the life of an organism and the survival of its tissues. I concede freely that somatic integration continues in this woman; her immune system fights infection, her bones knit, and her endocrine system secretes hormones. But you are conflating the persistence of biological functions with the persistence of the organism as a whole. The brain is not merely another organ contributing to the sum; it is the central integrator that allows the body to respond to the environment as a single unit. Without the brainstem, the body cannot maintain homeostasis against entropy without massive external intervention. The ventilator is not merely assisting a failed pump; it is substituting for the central command that coordinates breathing with metabolic need. What you describe as integration is actually a collection of local feedback loops—spinal reflexes, cellular responses—that do not constitute the global unity required for an organism to be said to exist. The body is no longer driving itself; it is being driven.

  Regarding your charge of contradiction, I reject the claim that the organism persists. The fetus is being gestated by a somatic shell, a biological entity that has undergone the discontinuity of death even if its cells remain metabolically active. This is not a legal fiction designed to accommodate transplant logistics or family wishes; it is a biological assessment that the unity of the whole has been lost. If you argue that this woman is still alive because her tissues function, you must tell me where the boundary lies. Does the organism persist until cellular decay renders the tissues unusable? If so, you have effectively adopted a circulatory standard but allowed it to be masked by technology. You claim the loss is merely psychological—a personal catastrophe rather than a biological one—but you ignore that the biological capacity for that person to exist as an integrated whole is gone. If you deny death here, you are committed to declaring alive any body that can be perfused and ventilated, regardless of the destruction of its central coordinator. Why is that a more coherent definition of life than recognizing the loss of the integrator itself?
