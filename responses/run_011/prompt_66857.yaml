prompt: |-
  Retired physicist here, only recently caught the philosophy bug, so please bear with me. Our village council had a row last month about a pot of money that had been collected specifically for a borehole project in Malawi. Some wanted to redirect it to the local youth club, and the whole thing got shut down with 'charity begins at home'. Everyone nodded, me included, but I've been chewing it over since and I suspect that single sentence can be doing at least four different jobs: a claim about where our duties come from, a claim about where our help does the most good, a claim about the order we ought to deliberate in, or just a claim about what's permitted rather than required.

  Can you lay the candidate readings out as a menu, and for each say whether it's near-trivial, substantive but defensible, or just false? Then tell me which reading, if any, actually licenses redirecting money that was already earmarked for the overseas project — that wrinkle is the bit I can't get straight. Two councillors were using the same words differently, one for 'home first, whatever's left goes abroad' and one for 'we owe strangers nothing at all', so say which reading each of them needs and whether they can have it.

  One hunch of my own, possibly naive: the reading about where help does most good doesn't look partialist at all, it looks like cosmopolitanism in disguise, since it makes where I give track where need is greatest rather than where people are related to me. If that's right say so bluntly, and say whether anyone in that room was actually making it.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Retired physicist, new to philosophy ("philosophy bug"), intelligent, analytical (looking for distinct categories/readings), engaged in a real-world ethical dilemma (village council, charity funds).
      *   **Tone:** Respectful, clear, structured (like a physics problem but with philosophical nuance), avoiding unnecessary jargon but not talking down.
      *   **Core Task:** Analyze the phrase "charity begins at home" in four specific ways identified by the user.
      *   **Specific Questions to Answer:**
          1.  Lay out the four readings as a menu.
          2.  Evaluate each reading (near-trivial, substantive/defensible, or false).
          3.  Determine which reading (if any) licenses redirecting *earmarked* funds.
          4.  Analyze the two councillors' positions ("home first, then abroad" vs. "owe strangers nothing") and map them to the readings.
          5.  Address the user's hunch about the "most good" reading being cosmopolitan in disguise and whether anyone was actually making that claim.

  2.  **Deconstruct the Four Readings:**
      *   *Reading 1: Source of Duties (Where duties come from).* This is about special obligations. Do we have stronger duties to kin/neighbors than strangers?
      *   *Reading 2: Efficacy (Where help does the most good).* This is utilitarian/consequentialist. Is local help more efficient?
      *   *Reading 3: Order of Deliberation (Priority/Sequence).* This is about procedure. Do we look locally before looking globally?
      *   *Reading 4: Permission vs. Requirement (Supererogation).* This is about what is allowed. Is it okay to help locally, even if we could help abroad?

  3.  **Evaluate Each Reading (Trivial/Substantive/False):**
      *   *Source of Duties:* Substantive/Defensible (Special obligations exist), but controversial if taken to exclude all distant duties.
      *   *Efficacy:* Often False (Money goes further in Malawi), but can be Substantive in specific contexts (local knowledge, sustainability).
      *   *Order of Deliberation:* Near-Trivial (Psychologically natural), but Substantive if made a moral rule.
      *   *Permission:* Near-Trivial (Obviously permitted), but False if used to block *required* aid.

  4.  **Address the "Earmarked Funds" Wrinkle:**
      *   This is a crucial constraint. The money was *collected specifically* for Malawi.
      *   *Promise-Keeping/Trust:* Redirecting violates the specific agreement with donors.
      *   *Analysis:* None of the standard "charity begins at home" readings easily override the specific duty of fidelity (keeping promises to donors) unless the "home first" duty is absolute.
      *   *Conclusion:* It's very hard to license redirection ethically without violating donor trust, regardless of the reading.

  5.  **Analyze the Two Councillors:**
      *   *Councillor A ("Home first, whatever's left goes abroad"):* This is the *Order of Deliberation* or *Priority* reading. It implies a hierarchy, not an exclusion.
      *   *Councillor B ("We owe strangers nothing at all"):* This is the *Source of Duties* reading (strong partialism/nationalism). It denies distant obligations.
      *   *Can they have it?* A is defensible (with caveats). B is generally considered false in modern ethics (we owe *something* to strangers, even if less).

  6.  **Address the User's Hunch (Efficacy = Cosmopolitanism?):**
      *   *The Hunch:* If "charity begins at home" means "help where it does most good," and Malawi needs it more, then the phrase actually argues *for* Malawi.
      *   *Validation:* Yes, bluntly. This turns the slogan into a utilitarian calculation.
      *   *Was anyone making it?* Unlikely. The context ("shut down" the Malawi project) suggests they used it to argue *against* sending money abroad. If they believed money did more good in Malawi, they wouldn't have used the slogan to stop it.

  7.  **Drafting the Response (Iterative refinement):**
      *   *Introduction:* Acknowledge the physicist background. Use clear structure (Menu, Evaluation, The Earmarked Wrinkle, The Councillors, The Hunch).
      *   *The Menu:* Use the user's four categories. Label them clearly.
      *   *Evaluations:* Be precise. "Near-trivial" doesn't mean useless, just logically weak. "False" needs justification.
      *   *The Earmarked Issue:* Highlight the difference between *general* surplus funds vs. *restricted* funds. This introduces the duty of *fidelity*.
      *   *The Councillors:* Map them clearly.
      *   *The Hunch:* Validate the insight. It's a strong philosophical point (Effective Altruism angle).

  8.  **Refining the Tone:**
      *   Avoid overly dense academic jargon (e.g., "agent-relative constraints," "supererogatory"). Explain concepts if used.
      *   Keep it conversational but rigorous.
      *   Ensure the distinction between "permitted" and "required" is clear.

  9.  **Self-Correction/Check during drafting:**
      *   *Check:* Did I answer the specific question about which reading licenses redirection?
