answer: |-
  Welcome to the fold. It is a pleasure to meet a colleague who brings a physicist's eye for distinct variables to a moral equation. You have already done the hardest work: disentangling the ambiguity of the slogan. In philosophy, we call this "conceptual analysis," and you have identified the four primary vectors along which this phrase is usually deployed.

  Here is the menu you requested, evaluated for logical strength, followed by the specific application to your council's dilemma.

  ### The Menu: Four Readings of "Charity Begins at Home"

  **1. The Source of Duties Reading (Special Obligations)**
  *   **The Claim:** Our moral duties are generated by proximity or relationship. We have strong duties to neighbors/kin and weak or non-existent duties to strangers.
  *   **Evaluation:** **Substantive but Controversial.**
      *   It is defensible to say we have *special* duties to those close to us (parents to children, citizens to neighbors). However, to claim these duties *exclude* duties to distant strangers is generally rejected in modern ethics. Most frameworks accept we have *some* duty to humanity at large, even if local duties are prioritized.
      *   *Verdict:* Defensible as a priority rule; false as an exclusion rule.

  **2. The Efficacy Reading (Consequentialism)**
  *   **The Claim:** Helping locally produces better outcomes per unit of resource than helping distantly.
  *   **Evaluation:** **Often False (Empirically).**
      *   This is a factual claim, not a moral one. In development economics, a pound spent on a borehole in Malawi often saves more life-years than a pound spent on a youth club in a British village (due to purchasing power parity and baseline need).
      *   *Verdict:* Usually false in terms of raw "good done," though sometimes defensible if "good" includes social cohesion or long-term sustainability of local institutions.

  **3. The Order of Deliberation Reading (Procedural Priority)**
  *   **The Claim:** When deciding where to help, we ought to look at local needs first. If local needs are met, *then* we look abroad.
  *   **Evaluation:** **Near-Trivial (Psychologically) / Substantive (Morally).**
      *   Psychologically, it is trivial; humans naturally notice nearby suffering first. As a moral rule, it is substantive. It suggests a "waterfall" model of obligation. It doesn't say strangers don't matter, but that they are next in the queue.
      *   *Verdict:* Defensible, provided the "local needs" bar is set reasonably (i.e., not "until our youth club is perfect," but "until urgent local suffering is alleviated").

  **4. The Permission Reading (Supererogation)**
  *   **The Claim:** It is *permitted* (allowed) to favor home, even if it isn't *required* to ignore the distant needy.
  *   **Evaluation:** **Near-Trivial.**
      *   Almost no ethical system demands total self-sacrifice. It is generally accepted that you are allowed to keep some resources for your own community.
      *   *Verdict:* True, but weak. It defends keeping the money, but it doesn't necessarily justify taking money *away* from a committed project.

  ---

  ### The Wrinkle: The Earmarked Funds

  You asked which reading licenses redirecting money *already collected* for Malawi. This introduces a fifth variable you haven't listed: **Fidelity (Promise-Keeping).**

  When donors gave that money, they entered a specific agreement: "This is for Malawi." To redirect it is to break a promise.

  *   **Does Reading 1 (Source) license it?** Only if you believe duties to neighbors *always* trump promises to distant strangers. This is a hardline position.
  *   **Does Reading 2 (Efficacy) license it?** Only if the Youth Club objectively does more good than the Borehole. (Unlikely, see above).
  *   **Does Reading 3 (Order) license it?** No. This reading applies to *discretionary* surplus. It says "spend new money here first." It does not say "confiscate committed money."
  *   **Does Reading 4 (Permission) license it?** No. Permission means "you don't *have* to give to Malawi." It does not mean "you can renege on a commitment to Malawi to fund home projects."

  **Conclusion on Redirection:** None of the standard readings easily license redirecting *earmarked* funds without violating the duty of fidelity. To do so requires a "Necessity" argument (e.g., "If we don't fund the youth club, local children will die *now*, whereas the borehole can wait"). Without urgent local necessity, redirecting earmarked funds is ethically precarious regardless of which "Charity Begins at Home" reading you use.

  ---

  ### The Two Councillors

  You noted two distinct voices in the room. Here is the mapping:

  **Councillor A: "Home first, whatever's left goes abroad."**
  *   **Needs:** The **Order of Deliberation (Reading 3)**.
  *   **Can they have it?** Yes, this is a defensible position. It acknowledges a duty to the distant needy but establishes a hierarchy of attention. However, they cannot use this to justify redirecting *earmarked* funds, only *new* funds.

  **Councillor B: "We owe strangers nothing at all."**
  *   **Needs:** The **Source of Duties (Reading 1)**, specifically the exclusionary version.
  *   **Can they have it?** Largely **No**. In modern moral philosophy (and most religious traditions), this is considered false. We may owe *less* to strangers, or have *different* duties to them, but "nothing at all" is unsustainable. It implies we could watch a stranger drown to save ourselves the cost of a phone call, which violates basic human morality.

  ---

  ### Your Hunch

  > *The reading about where help does most good doesn't look partialist at all, it looks like cosmopolitanism in disguise... If that's right say so bluntly.*

  **You are absolutely right.** Bluntly: **Yes.**

  If "Charity Begins at Home" is interpreted strictly as "Do the most good possible," and the most good is actually done in Malawi, then the slogan logically compels you to send the money to Malawi. This is the core tenet of **Effective Altruism** and **Utilitarian Cosmopolitanism**. It strips the moral weight from "distance" and places it entirely on "impact."

  > *...and say whether anyone in that room was actually making it.*

  **Almost certainly not.**

  If anyone in that room had been making the Efficacy Reading (Reading 2), they would have argued: *"We should send this to Malawi because £100 saves a life there, whereas here it only buys football boots."*

  Instead, they used the slogan to *shut down* the Malawi project. This proves they were implicitly relying on **Reading 1 (Source of Duties)** or **Reading 3 (Order of Deliberation)**. They were appealing to *loyalty* and *priority*, not *impact*. They used a slogan that *sounds* like practical advice (start locally) to mask a moral claim (favor our own).

  ### Summary for the Council

  If you return to this debate, your physicist's precision gives you a lever:

  1.  **On the Money:** Remind them that "Charity Begins at Home" applies to *surplus*, not *misappropriation*. The Malawi fund is a contract.
  2.  **On the Ethics:** Point out that Councillor B's view (owe strangers nothing) is morally untenable.
  3.  **On the Logic:** Validate your hunch. If they truly care about "where help does most good," they should check the data. If the data says Malawi, their own slogan argues against them.

  You have spotted that the slogan is a "motte-and-bailey" argument. When challenged, they retreat to the trivial motte ("Of course we should look after our own first!"). When unchallenged, they occupy the bailey ("Therefore we should steal from the poor abroad to fund our leisure at home"). Your job is to keep them in the motte.
