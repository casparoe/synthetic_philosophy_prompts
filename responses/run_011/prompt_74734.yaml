answer: |-
  Here is the diagnosis.

  ### The Short Answer
  The argument is **invalid between step (7) and step (8)**.

  You can keep Origin Essentialism (7) without accepting the Necessity of Existence (11). The price you pay is rejecting the universal generalization in (8). You must restrict the scope of Origin Essentialism to **actual persons**. The argument smuggles in a controversial metaphysical thesis (that the domain of persons is fixed across all possible worlds) when it moves from "I couldn't have come from somewhere else" to "No one could come from somewhere else unless they actually exist."

  ### The Detailed Diagnosis

  Your friend's argument conflates two distinct claims:
  1.  **Origin Essentialism (OE):** For any *actual* person $p$, $p$ could not have originated from a gamete pair other than the one $p$ actually originated from.
  2.  **Origin Necessitarianism (ON):** For any gamete pair $g$, if $g$ produces a person in any possible world, that person must exist in the actual world.

  Steps (1) through (7) successfully establish **OE** (for you). They show that *you* are tied to *your* origin.
  Step (8) attempts to generalize this to **ON**. It claims that *any* person $p$ (including merely possible ones) is tied to an *actual* origin.

  **Where it breaks:**
  In step (9), the argument introduces $c$, a "possible person" who originates from $g^*$ (a gamete pair that produced no one actually). It then applies rule (8) to $c$.
  *   If (8) ranges only over **actual persons**, it does not apply to $c$ (since $c$ is merely possible). The inference stops. You get OE, but not (11).
  *   If (8) ranges over **all possible persons**, then (8) is unsupported by steps (1)–(7). Steps (1)–(7) only demonstrate that *actual* people (like you) cannot swap origins. They do not demonstrate that *merely possible* people must have actual origins. To get that, you need an extra premise: **The Barcan Formula** (roughly: if something is possibly a person, it is actually a person).

  Your friend has disguised a controversial commitment to **Possibilism** (or a fixed-domain modal logic) as a logical consequence of Origin Essentialism. It is not.

  ### The Secondary Issue: Steps (3) and (4)
  There is a deeper metaphysical snag in the setup that supports the diagnosis above.
  *   **Step 3:** "Let $b$ = the person who originates from $g$."
  *   **Step 4:** "I am distinct from $b$."

  If $g$ is a non-actual gamete pair, does $b$ exist in the actual world?
  *   **If No (Actualism):** Then $b$ does not exist. You cannot assert "I am distinct from $b$" in the actual world using standard logic, because $b$ fails to refer. Step (4) is false or meaningless. This blocks the derivation of (5) and (7) unless you use free logic or counterpart theory.
  *   **If Yes (Possibilism):** Then $b$ exists (as an abstract or non-concrete object). Step (4) is true. But if you accept this, you have already accepted that "merely possible people" are part of your actual ontology. In that case, (11) ("Every possible person is an actual person") is technically true by definition, but it loses its sting. It just means "Every possible person is an actual *abstract object*," not "My parents could not have conceived a different *living child*."

  Most philosophers who want to reject (11) in the strong sense (that my parents could have had a different living child) are **Actualists**. They deny that $b$ exists in the actual world. Therefore, they must reject the application of Leibniz's Law in Step (5) to non-existents, or restrict the quantifiers in (8) to actual existents.

  ### Can you keep (7) without (11)?
  **Yes.** This is the standard position held by most proponents of Origin Essentialism (including Kripke).
  *   **Claim:** I am essentially the product of Sperm A + Egg B.
  *   **Claim:** If Sperm C had fertilized Egg B, *I* would not exist. A *different* person would exist.
  *   **Claim:** That *different* person is a merely possible person. They do not exist in the actual world.

  This view accepts (7) but rejects (8) and (11). It holds that while *my* origin is essential to *me*, it is not essential to the *gametes* that they produce me. The gametes could have produced someone else (who is not me), and that someone else need not be an actual person.

  ### Settled vs. Contested
  You asked to distinguish consensus from controversy. Here is the landscape:

  **1. Necessity of Distinctness (Step 2)**
  *   **Status:** *Settled for actual objects; Contested for non-existents.*
  *   **Consensus:** If $x$ and $y$ both exist, and $x \neq y$, then necessarily $x \neq y$.
  *   **Controversy:** Does this apply if $y$ is a merely possible object? Actualists say $y$ doesn't exist to bear the relation. Possibilists say it does. Your friend's argument assumes it applies across the board, which is a contentious metaphysical commitment.

  **2. The Twin Patch (Step 1)**
  *   **Status:** *Technical nuisance, generally considered solvable.*
  *   **Consensus:** Monozygotic twinning is a problem for strict "one zygote = one person" views.
  *   **Controversy:** There is no single agreed-upon patch. Some say identity is indeterminate in splitting cases; others (like your friend) stipulate a "closest continuer" or "post-split" rule. This is not considered a fatal counterexample to Origin Essentialism, but it does require fine-tuning.

  **3. Origin Essentialism (Step 7)**
  *   **Status:** *Highly Plausible but Contested.*
  *   **Consensus:** It is the dominant view in analytic metaphysics following Kripke.
  *   **Controversy:** There are serious objections (e.g., from Mackie, Robertson, and proponents of "gradualist" views of identity). Some argue that small changes in the gamete (a slightly different sperm) would still yield *you*. However, the "different sperm = different person" intuition is widely shared.

  **4. Necessity of Existence / No Other People (Step 11)**
  *   **Status:** *Overwhelmingly Rejected.*
  *   **Consensus:** Very few competent metaphysicians accept (11). The view that "my parents could not have had a child other than the ones they actually had" is considered a *reductio* of the argument, not a bullet to bite.
  *   **Controversy:** The disagreement is on *why* it fails. Actualists blame the quantifier domain (Step 8). Counterpart theorists blame the notion of trans-world identity (Step 6). But almost everyone agrees (11) is false.

  ### Recommendation: What to Give Up
  **Reject Step (8).**

  Do not generalize Origin Essentialism from "Actual persons have essential origins" to "All possible persons have actual origins."

  **The Cost:**
  You must adopt a **variable domain semantics** for modal logic. You have to say that the set of people existing in World 1 (actual) is different from the set of people existing in World 2 (counterfactual).
  *   In World 1: You exist, $c$ does not.
  *   In World 2: You do not exist, $c$ does.
  *   Step (8) fails because it tries to quantify over $c$ from the perspective of World 1, where $c$ is not in the domain.

  **Why this is the best option:**
  1.  **Preserves (2):** You keep the Necessity of Distinctness for all *existing* things.
  2.  **Preserves (7):** You keep the core Kripkean intuition that *you* couldn't have come from different gametes.
  3.  **Saves the Intuition:** It allows you to say truly: "If a different sperm had won, a different person would have existed, and I would not." This is exactly what you wanted to keep.
  4.  **Avoids the Absurdity:** It avoids (11), allowing that your parents could have had other children who simply do not exist in the actual world.

  **Summary for your reading group:**
  Tell your friend that steps (1)–(7) prove **Origin Essentialism**, but steps (8)–(11) prove **Necessitism** (the view that everything that exists in any world exists in all worlds). The argument validly derives Necessitism *only if* you assume Necessitism in the generalization step (8). Since Necessitism is widely rejected, (8) is the unsupported leap. You can accept the Kripkean conclusion about *your* origin without accepting the modal collapse that eliminates all merely possible people.
