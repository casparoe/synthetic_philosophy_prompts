      *   **Key Insight:** The argument equivocates on the domain of quantification. It treats "the person from $g$" as an actual object to establish distinctness, then uses that to rule out their possibility. This is the "Possibilist" trap. An Actualist blocks Step 3.
      *   **Refining the "Step 8" critique:** Step 8 generalizes OE. OE is usually formulated as: For any *actual* person $x$, $x$'s origin is essential. It is *not* usually formulated as: For any *possible* person $y$ and origin $g$, if $y$ comes from $g$ in some world, $y$ comes from $g$ in the actual world. The latter implies all possible people are actual.
