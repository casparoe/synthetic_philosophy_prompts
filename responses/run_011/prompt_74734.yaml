      *   *The Strongest Diagnosis:* The move from (7) to (11) relies on **Quantified Modal Logic assumptions about the domain**. Specifically, it assumes the Barcan Formula or something similar (that the domain of possible objects is fixed/actual). If you are an Actualist who denies that merely possible people are objects in the actual world, Step 3 ("Let $b$ =...") is illicit in the actual world context. You can't name a non-existent to prove it's distinct from you *actually*.

