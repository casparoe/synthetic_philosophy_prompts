answer: |-
  ### 1. Primary and Secondary Intensions

  To apply two-dimensional semantics here, we must distinguish the epistemic dimension (primary intension) from the metaphysical dimension (secondary intension). The primary intension of *planet* is a function from scenarios considered as actual to extensions: given a world *w* considered as actual, what counts as a planet in *w*? The secondary intension is a function from counterfactual worlds to extensions, once the actual world's reference-fixing facts are held fixed.

  **Reference-Fixing Stories:**
  Three competing stories fix the reference of *planet*:
  1.  **Dynamical:** Reference is fixed by orbital dominance (clearing the neighbourhood).
  2.  **Geophysical:** Reference is fixed by hydrostatic equilibrium (roundness).
  3.  **System-Anchored:** Reference is fixed by a historical list or stipulation anchored to our solar system (e.g., "the bodies currently classified as planets").

  **Pre-2006 Usage:**
  *Judgment Call:* I judge that pre-2006 usage was **indeterminate** between the Geophysical and System-Anchored stories, with little weight on the Dynamical story. Pluto was discovered in 1930; by the 1970s, its mass was known to be too low to perturb Uranus, suggesting it hadn't cleared its orbit. Yet it remained a planet. This implies the dynamical criterion was not part of the pre-2006 primary intension. The term functioned largely as a rigid designator for a specific list {Mercury... Pluto}, supported by a geophysical heuristic (roundness).

  **Intensions of *Pluto is a planet*:**
  *   **Primary Intension:** Under the **Dynamical** story, the primary intension yields *False* in our world (considered as actual), because Pluto fails the clearing criterion. Under the **Geophysical** story, it yields *True*. Under the **System-Anchored** story, it yields *True* (as Pluto was on the list). The 2006 vote effectively selected the Dynamical story as the correct reference-fixing description for the community.
  *   **Secondary Intension:** Once the IAU vote fixed the actual-world reference rule (Dynamical), the secondary intension becomes necessary relative to that definition. In any counterfactual world, given our actual definition, Pluto is not a planet.

  **Kripkean Parallel:**
  The pattern of *water is H₂O* breaks here. In Kripke's model, *water* picks out a natural kind with an underlying essence (H₂O); the identity is necessary a posteriori. *Planet* lacks a hidden essence. It is not a natural kind but a classificatory artifact. If *planet* is defined by description (e.g., "clears orbit"), it is not rigid in the Kripkean sense; it is a non-rigid designator whose extension varies with the definition. If *planet* is treated as System-Anchored (rigidifying the list), it is rigid but not via essence. The 2006 episode shows that the secondary intension is contingent on the stipulative choice of the primary intension. Unlike *water*, where science discovers the essence, here science (via the IAU) *legislates* the essence.

  ### 2. The Dispute and Method of Elimination

  **Contested Intension:**
  The disputants were contesting the **primary intension**. The Stern camp (geophysical) and the IAU camp (dynamical) agreed on the physical facts (secondary intension inputs): Pluto's mass, orbit, shape, and neighbours were not in dispute. They disagreed on which function from scenarios to extensions the word *planet* should encode. Neither camp was arguing about counterfactual worlds (e.g., "If Pluto were in a different orbit..."); they were arguing about the rule for classification in the actual world.

  **Method of Elimination:**
  Strip the term *planet*.
  *   **Stern Camp:** "Pluto orbits the Sun, is round, has geology, but shares its orbit with Kuiper Belt objects."
  *   **IAU Camp:** "Pluto orbits the Sun, is round, has geology, but shares its orbit with Kuiper Belt objects."
  *   **Result:** The physical disagreement vanishes. What remains is a disagreement about **classification utility**. The Stern camp believes roundness is the scientifically salient property for grouping bodies (geological activity potential). The IAU camp believes orbital dynamics is the salient property (formation history, dominance).

  **Bedrock:**
  Does the elimination bottom out in bedrock? Yes, but it is **normative/pragmatic bedrock**, not metaphysical. The disagreement is about which property *ought* to be tracked by the term for the purposes of scientific communication and pedagogy. This is a substantive disagreement about scientific practice, but it is verbal regarding the label *planet*. The elimination test reveals that the *truth value* of "Pluto is a planet" is entirely dependent on the semantic rule adopted, not the physical state of Pluto.

  ### 3. Scrutability

  **Laplacean Description:**
  Suppose a Laplacean demon knows all physical truths about the solar system (masses, orbits, shapes), the *that's-all* clause, and indexical truths ("I am here now").

  **Scrutability Status:**
  *Pluto is a planet* is **not scrutable** from this base alone. Knowing the physical facts does not entail the classification unless the definition rule is included. To derive "Pluto is not a planet," one needs the premise: "A body is a planet iff it clears its orbit."

  **Extra Premise:**
  The required premise is **semantic/normative**. It links physical properties to the term *planet*.
  *   **Classification:** Semantic (it defines the meaning of the term) but grounded in Normative choice (why this definition?).
  *   **Cost to Thesis:** If the scrutability thesis claims all truths are scrutable from *purely physical* truths plus indexicals, this case falsifies it. "Planet" is not a physical natural kind. However, if the scrutability base is allowed to include semantic truths (as is common in two-dimensional frameworks to handle positive truths), the thesis survives. The cost is admitting that *planet* is not a fundamental physical concept but a semantic artifact layered over physics.

  ### 4. The Diachronic Problem

  **Ceres vs. 2006:**
  The Ceres precedent (extension moving by drift/consensus) and the 2006 vote (extension moving by stipulation) both fit the framework if we accept **systematic indeterminacy** of primary intensions for semi-technical terms.

  **Determinacy:**
  *Contested Reading:* I adopt the reading that primary intensions belong to the **linguistic community** rather than individual speakers in this context. Scientific terms derive meaning from communal usage and authority.
  Pre-2006, the primary intension of *planet* was indeterminate; multiple candidate precisifications (Geophysical, System-Anchored) were equally compatible with usage. The extension moved with Ceres because the community silently shifted the primary intension to exclude asteroids. In 2006, the community explicitly selected one precisification (Dynamical) over others.

  **Defect or Feature:**
  This is not a local defect but a **general feature** of the framework when applied to kind terms that are not natural kinds. Two-dimensional semantics relies on determinate primary intensions to map epistemic space. This case shows that for many scientific terms, the primary intension is itself an object of negotiation. The framework accommodates this by treating the pre-2006 state as a region of epistemic space where multiple intensions are live candidates. The vote collapses this region. The framework handles the *before* and *after*, though it does not model the *collapse mechanism* itself.

  ### 5. Where the Theory is Silent

  Two-dimensional semantics is a tool for analyzing meaning and modality, not scientific policy. It is silent on three specific features:

  1.  **Restriction to Sun-Orbiting Bodies:** 2D semantics can model the reference fix ("orbits the Sun"), but it has nothing to say on whether this restriction is *scientifically justified*. It treats the restriction as a brute semantic fact once adopted. It cannot evaluate the exclusion of exoplanets from the definition.
  2.  **Retention of Mercury:** The definition requires hydrostatic equilibrium; Mercury fails this but was retained by fiat. 2D semantics handles this as a case of **rigid designation overriding description**. If *planet* rigidly designates the set {Mercury...}, Mercury is in by definition. The framework explains the semantic consistency (the term refers to the list) but is silent on the *inconsistency* with the stated criterion (ii). It treats the inconsistency as a semantic rule, not an error.
  3.  **Committee Definition:** The framework models the *result* of the vote (a shift in primary intension) but is silent on the *legitimacy* of the mechanism. It does not distinguish between reference fixing by discovery (water) and reference fixing by majority vote (planet). It treats both as events that fix the primary intension, offering no resources to critique the political nature of the latter.

  ### 6. Final Commitment

  **Status of the Episode:**
  I commit that this episode is a **Confirmation** of the framework.
  *Argument:* The primary/secondary distinction was built precisely to handle cases where epistemic and metaphysical modality come apart, and where disputes arise over the rule of reference rather than the facts of reference. The 2006 episode is a textbook instance: the physical facts (secondary intension inputs) were stable, while the epistemic rule (primary intension) was contested and subsequently changed. The framework successfully diagnoses the dispute as one over the primary intension, isolating the verbal component from the physical reality. The "vote" is simply the historical cause of the semantic shift; the framework does not need to model the sociology of the vote to model the semantics of the outcome.

  **Verbal vs. Substantive:**
  The dispute was **partly both**.
  *   **Verbal:** The truth value of the sentence "Pluto is a planet" changed solely due to a change in semantic rule. On this specific proposition, the disagreement was verbal.
  *   **Substantive:** The disagreement over *which* rule to adopt was substantive. It carried weight regarding scientific utility, pedagogical clarity, and the classification of future discoveries. The substantive weight lies in the **pragmatic consequences** of the definition, not the metaphysical status of Pluto.

  **Scrutability:**
  Scrutability comes through the case **intact**, provided the scrutability base is understood to include **semantic truths**. If one demands scrutability from purely physical truths, the thesis fails here, but that is a constraint on the base, not the framework. Since "planet" is a semi-technical term defined by description, its truth conditions are scrutable from physics *plus* the definition. This confirms the two-dimensional view that such terms are epistemically contingent (dependent on the definition) even if metaphysically fixed (once the definition is adopted).
