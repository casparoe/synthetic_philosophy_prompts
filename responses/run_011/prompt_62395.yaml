  ## Facilitator Script: The Debrief (Key Moments)

  **Instructor:** "Look at the scoreboard. Team 2 has fewer points from claims, but they won the Redemption Round. Why?"
  **Student:** "Because they had the cards."
  **Instructor:** "In logic terms, they had the **witnesses**. When you asserted 'There exists' classically, you got points but no card. When you asserted it constructively, you got fewer points but you kept the **evidence**."
  *(Writes on board: Proof = Information)*

  **Instructor:** "Did anyone successfully use the LEM Voucher on the Face-Down deck?"
  **Student:** "No, we got challenged and lost."
  **Instructor:** "So, is 'Either it's there or it's not' false?"
  **Student:** "No, it's probably true. We just couldn't prove it."
  **Instructor:** "Exactly. The intuitionist doesn't say LEM is *false*. They say asserting it without a method is an **empty promise**. You can make the promise (the voucher), but if someone asks you to cash it (challenge), you go bankrupt."
  *(Writes on board: LEM $\neq$ False, LEM $\neq$ Universally Assertible)*

  **Instructor:** "Finally, when you made a constructive claim, what did you have to do?"
  **Student:** "Pick one. We couldn't just say 'A or B'."
  **Instructor:** "That is the core shift. For the classical logician, $A \lor B$ means 'The world is such that one is true.' For the constructivist, $A \lor B$ means 'I can **hand you** a proof of A or a proof of B.'"
  *(Writes on board: Meaning = Use)*
