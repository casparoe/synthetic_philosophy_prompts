  ### Brainstorming Candidate Mechanics

  1.  **The Proof Market:** Teams bid "truth tokens" on statements; to "buy" a disjunction, they must pay with a specific proof card.
      *   *Discarded:* This reduces logic to economics too heavily. Bidding on truth values feels inherently classical (truth as a commodity), which undermines the goal of showing truth as *justification*. It also fails to enforce the obligation to produce a witness upon challenge.
  2.  **The Black Box Search:** Students search for numbers satisfying a predicate; one box is open (decidable), one is locked (opaque).
      *   *Discarded:* Too passive. It simulates an empirical search problem rather than a logical commitment. It doesn't capture the *normative* force of asserting a disjunction (i.e., that you *owe* the audience a disjunct).
  3.  **The Witness Protocol (Selected):** Teams assert formulas to score points. To assert $A \lor B$, they must place a marker on $A$ or $B$. A special "LEM Voucher" allows asserting $P \lor \neg P$ without choosing, but triggers a high-stakes audit.
      *   *Reason for Selection:* This directly maps logical syntax to physical actions. The "cost" of the LEM voucher creates the tension between classical convenience (high points, low effort) and constructive safety (lower points, guaranteed resources). The challenge protocol enforces the "meaning as use" aspect of constructivism, and a final "Redemption Round" demonstrates the utility of accumulated witnesses.

  ---

  # Workshop Design: The Witness Protocol

  **Title:** The Witness Protocol
  **Time:** 75 Minutes
  **Participants:** 16 Students (4 Teams of 4)
  **Materials:** Whiteboard, 4 decks of Index Cards (mixed letters/numbers), 20 "LEM Voucher" tokens, Scoreboard.

  ## Learning Objectives
  By the end of the session, students will have experienced:
  1.  **The Cost of Disjunction:** Asserting $A \lor B$ requires committing to $A$ or $B$ (Objective a).
  2.  **The Status of LEM:** $P \lor \neg P$ is assertible but risky without a decision procedure; it is not "false," but not universally safe (Objective b).
  3.  **The Value of Construction:** Constructive proofs yield "Witness Cards" usable for future high-value tasks, whereas classical shortcuts do not (Objective c).

  ## Minute-by-Minute Timeline

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00-10** | **Setup** | Divide into 4 teams. Distribute Handout. Explain scoring. **No mention of logic schools.** |
  | **10-30** | **Round 1: The Open Deck** | **Decidable Predicate.** Teams claim existentials/disjunctions. Must produce cards. LEM Vouchers available but unnecessary. |
  | **30-50** | **Round 2: The Sealed Deck** | **Opaque Predicate.** Search space too large for time limit. LEM Vouchers become tempting (high points, no initial work). Challenges occur. |
  | **50-60** | **Round 3: Redemption** | **Witness Utility.** High-point goals require specific Witness Cards earned in Rounds 1 & 2. Teams with only LEM points stall. |
  | **60-75** | **Debrief** | Map game mechanics to logical semantics. Reveal terms ("Intuitionism," "LEM"). Discuss limitations. |

  ---

  ## Player Handout (One Page)

  **THE WITNESS PROTOCOL: RULES OF ENGAGEMENT**

  **GOAL:** Maximize your Team Score.
  **RESOURCES:**
  *   **Claim Cards:** You may assert statements written on the board.
  *   **Witness Cards:** Physical index cards you hold in your hand.
  *   **LEM Vouchers:** Special tokens allowing "Classical Claims."

  **SCORING:**
  1.  **Constructive Claim (10 pts):** Assert $\exists x \phi(x)$ or $A \lor B$.
      *   *Requirement:* You must immediately place a **Witness Card** on the table proving it (e.g., the specific $x$, or the specific disjunct $A$).
      *   *Bonus:* You **keep** the Witness Card in your team bank.
  2.  **Classical Claim (15 pts):** Assert $P \lor \neg P$ using a **LEM Voucher**.
      *   *Requirement:* No Witness Card needed initially.
      *   *Risk:* You do **not** receive a Witness Card.
  3.  **Challenge (Audit):** Any opposing team may pay **5 pts** to Challenge a claim.
      *   *If Constructive:* Challenger checks your Witness Card. If valid, Challenger loses 5. If invalid, You lose 20, Challenger gains 20.
      *   *If Classical (LEM):* You must **produce a Witness Card within 30 seconds**. If you succeed, you keep your 15 pts. If you fail, you lose 20 pts, Challenger gains 20.

  **REDEMPTION ROUND (Final 10 Minutes):**
  *   **Grand Prize (50 pts):** "Produce a Witness Card with [Specific Property]."
  *   Only cards in your **Team Bank** count. You cannot search the decks now.

  **WARNING:** Time is limited. Searching the "Sealed Deck" takes time. Vouchers save time but yield no cards.

  ---

  ## Facilitator Sheet

  **Setup:**
  *   **Deck A (Open):** 20 cards, face up. Values 1-10 visible.
  *   **Deck B (Sealed):** 100 cards, face down. Shuffled.
  *   **Predicate D (Decidable):** "Contains a number > 8." (Easy to see in Deck A).
  *   **Predicate O (Opaque):** "Contains a number > 8." (Hard to verify in Deck B within 30 seconds).
  *   **Redemption Target:** "A card with the number 10." (Rare in Deck A, unknown in Deck B).

  **Scripting the "Truth":**
  *   *Crucial:* Do not say "The card has a value you don't know." Say "The rules do not allow you to flip more than 5 cards in the time limit." The opacity is procedural, not metaphysical.

  **Scoring Examples (For Whiteboard):**
  *   **Profitable LEM:** Team asserts $P \lor \neg P$ on Deck A (Decidable). No one challenges (too obvious). Team gets 15 pts, saved time. *Net: +15.*
  *   **Ruinous LEM:** Team asserts $P \lor \neg P$ on Deck B (Opaque). Challenger pays 5. Team must flip cards to find witness. Time expires. Team fails. *Net: -20 (Penalty) + 0 (Claim voided) = -20.* Challenger +20.
  *   **Constructive Win:** Team asserts $\exists x$ on Deck A. Shows card '9'. Gets 10 pts + Keeps Card. In Redemption, uses Card '9' (if target was >8) or finds '10' early. *Net: 10 pts + Asset.*

  **Predictable Failures & Fixes:**
  1.  **Hoarding Witnesses:** Teams refuse to spend Witness Cards in Redemption to save them.
      *   *Fix:* Rule states Witness Cards used in Redemption are "spent" (discarded), but the 50 pts outweighs the loss.
  2.  **Classical Domination:** Teams spam LEM vouchers and avoid challenges.
      *   *Fix:* You (Instructor) act as the "Market Regulator." If a team spams LEM on Opaque predicates without challenge, *you* challenge them. This forces the risk.
  3.  **Monopolizing:** One student per team does all the work.
      *   *Fix:* Rule: "The student placing the card must rotate every turn."
  4.  **Confusion on Negation:** Students don't know how to witness $\neg P$.
      *   *Fix:* For this workshop, define witnessing $\neg P$ as "Showing the entire deck does not contain the value." (Impossible for Deck B, possible for Deck A).

  **Debrief Questions (Ask in Order):**
  1.  *(Targeting a):* "In Round 1, when you claimed 'There is a number > 8', what did you have to do that you didn't have to do with the Voucher?" -> *Elicits: You had to point to one.*
  2.  *(Targeting b):* "Did the Voucher ever work? Did it ever fail? Does that mean the rule 'Either it is or it isn't' is false, or just that using it is dangerous?" -> *Elicits: It's not false, but it doesn't give you tools.*
  3.  *(Targeting c):* "In the Redemption Round, which teams struggled? Why did the 'safe' points from the Voucher not help you win the Grand Prize?" -> *Elicits: Classical proofs don't give you the witness to use later.*

  **Frank Account of Limitations:**
  *   **The "Secret Truth" Problem:** In the game, the face-down cards *do* have fixed values. A strict constructivist (Brouwer) would say the value is not determined until a method constructs it.
      *   *Caveat to Students:* "In our game, the cards had secret values. In real constructive math, we don't assume the value exists until we have a recipe to find it. The game simulates the *risk*, but assumes a classical reality underneath."
  *   **Time vs. Principle:** The game makes opacity a matter of *time limits* (75 mins). Real constructivism is about *principle* (no algorithm exists).
      *   *Caveat to Students:* "We ran out of time. A constructivist says even with infinite time, some problems have no algorithm. Treat the timer as a stand-in for 'effective method'."

  **Markov's Principle Add-On:**
  *   **Verdict:** **Do not include.**
  *   **Reasoning:** Markov's Principle ($\neg \neg \exists x \phi(x) \to \exists x \phi(x)$ for decidable $\phi$) distinguishes *schools* of constructivism (Russian vs. Brouwerian). Introducing it requires students to first grasp the Classical vs. Intuitionistic split. Adding this nuance in the final 5 minutes will conflate "Classical Logic" with "Constructive Logic that accepts MP." It muddies Objective (a) and (b). It is better to mention it verbally as a "Post-Script" for interested students rather than a game mechanic.

