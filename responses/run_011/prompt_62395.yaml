  ## Detailed Scoring Scheme & Worked Examples

  **Base Values:**
  *   Constructive Claim: +10 Points.
  *   Classical (LEM) Claim: +15 Points.
  *   Challenge Cost: -5 Points (paid by Challenger).
  *   Successful Challenge (Defender Fails): Defender -20, Challenger +20.
  *   Failed Challenge (Defender Succeeds): Challenger -5 (total loss), Defender +5 Bonus.

  **Scenario 1: Profitable LEM (The Classical Win)**
  *   **Context:** Deck A (Face up, 10 cards). Predicate: "Contains Even Number."
  *   **Action:** Team 1 uses LEM Voucher. Claims "Even $\lor$ Not Even." (+15 pts).
  *   **Reaction:** No one challenges (too obvious).
  *   **Result:** Team 1 has +15 pts. No Witness Card banked.
  *   **Why Profitable:** They gained 5 more points than a constructive claim (+10) with zero effort.

  **Scenario 2: Ruinous LEM (The Constructive Win)**
  *   **Context:** Deck B (Face down, 100 cards). Predicate: "Contains Card #99."
  *   **Action:** Team 2 uses LEM Voucher. Claims "Contains #99 $\lor$ Not." (+15 pts).
  *   **Reaction:** Team 3 Challenges (-5 pts).
  *   **Obligation:** Team 2 must produce Card #99 or prove it's absent within 30 seconds.
  *   **Outcome:** Team 2 flips 10 cards, finds nothing. Time expires.
  *   **Result:** Team 2 loses 20 pts (Net -5). Team 3 gains 20 pts (Net +15).
  *   **Why Ruinous:** The lack of a decision procedure made the LEM claim a liability.

  **Scenario 3: The Existence Property (Redemption)**
  *   **Context:** Final Round. Goal: "Produce Card #10." Reward: 50 pts.
  *   **Team 1 (Classical):** Has 50 points from LEM spamming. Has 0 Witness Cards.
      *   *Action:* Cannot claim 50 pts. Must search Deck B now (too slow).
  *   **Team 2 (Constructive):** Has 30 points from Round 1. Has Card #10 in Bank (found early).
      *   *Action:* Plays Card #10. Gains 50 pts. Total 80.
  *   **Lesson:** Classical logic gave points, but Constructive logic gave *power*.

