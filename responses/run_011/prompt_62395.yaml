  ## Troubleshooting Predictable Failures

  | Failure Mode | Prediction | Pre-emptive Fix |
  | :--- | :--- | :--- |
  | **Witness Hoarding** | Teams earn Witness Cards but refuse to use them in Redemption, fearing loss. | **Rule:** "Redemption Cards are spent, but 50 pts > 10 pts." Explicitly state in Round 3 intro that this is the *only* way to spend them. |
  | **Side Deals** | Teams agree not to challenge each other to preserve points. | **Instructor Challenge:** "I am the House. If I see an unchallenged LEM claim on an Opaque predicate, I will audit it myself." |
  | **Classical Dominance** | LEM Vouchers are so efficient Constructive play looks stupid. | **Adjust Scoring:** If LEM is winning too easily, increase Challenge Penalty to -30. Or reduce LEM Base Points to 12. |
  | **Negation Confusion** | Students try to witness $\neg \exists x$ by doing nothing. | **Rule:** "To witness Negation, you must exhaust the search space." (Make Deck A small enough to exhaust, Deck B too big). |

