  I'm putting together notes on origin essentialism and I want a real argument here, not a survey. Kripke's line: you couldn't have come from a different sperm and egg. But monozygotic twins both come from the same pair, so origin can't be *sufficient* for being you, and the usual patch is to say what's really essential is the zygote itself -- that first cell, with its own onward history -- rather than the gamete pair that produced it. Argue as hard as you can for the claim that this patch buys consistency at the cost of interest: that once the essential thing is a particular cell that has to keep going without branching, the sperm and egg have dropped out of the metaphysics entirely and all the thesis says is that organisms originate where they originate. Give me the strongest case for that, the best reply a defender of the gamete-pair version could make, and where you think your own argument is shakiest. And please keep straight what's actually settled versus what people who work on this genuinely disagree about -- don't hand me a contested view dressed up as the consensus.
