answer: |-
  1. Statement of the research question
  Does a duty of memory persist when the community of remembrance is destroyed and surviving traces exist only within perpetrator archives? Current accounts assume either a living community capable of shared recall or conflicting political narratives. This project argues that a specific duty of memory survives even when thick relations are severed and political conflict has ceased. The duty shifts from a communal obligation to share memories to an external obligation to reconstruct them from hostile evidence. I will determine whose agency discharges this duty and what counts as fulfillment. The answer is neither that the duty lapses nor that it transfers intact to humanity, but that it becomes a duty of archival reconstruction borne by those who control the documents. This yields a determinate conclusion: the duty binds the institutional successors of the perpetrators, requiring active reconstruction rather than passive preservation. The project seeks to define the conditions under which memory survives the death of the community that held it, establishing a normative framework for archives that function as the sole remaining testimony of erased groups. Specifically, I will ask whether the duty falls to the archive-holders or to third-party historians, and whether discharge requires making the documents publicly accessible or actively interpreting them against their original intent.

  2. Why the question is open
  Margalit grounds duties of memory in thick relations—family, friends, comrades—that sustain shared narratives over time. If a group is dispersed or destroyed within a generation, these relations vanish, suggesting the duty lapses. Rieff's skepticism targets institutionalized remembrance that fuels ongoing political conflict. Where no adversary remains to be inflamed, his case for forgetting loses its force, yet he offers no positive account of memory in such vacuums. Both leave unaddressed the status of victims whose only trace is administrative documentation produced by those who harmed them.

  The strongest objection is that Margalit's thin relations—our shared humanity—already cover this. If we owe duties to all humans, surely we owe memory duties to all victims. However, Margalit explicitly doubts thin relations can sustain specific memory duties; they ground general justice, not remembrance. If my project shows only that we owe these victims justice, I have not identified a memory duty. I must show that the *mode* of obligation is specific to memory. Another objection is that perpetrator archives are simply evidence for justice, not objects of memory. A critic might argue that once the political conflict ends, documents serve only legal or historical functions, not ethical memory. I will argue that treating them merely as evidence ignores the narrative reconstruction required to restore the victim's perspective, which is the core work of memory. Without a community to hold the memory, the archive becomes a tomb rather than a testament. This gap remains open because existing frameworks tie memory too tightly to either community continuity or political utility. Neither author accounts for memory that survives solely in the hands of the enemy, disconnected from both a living community and a living conflict. Addressing this requires disentangling memory from community without dissolving it into general justice. Furthermore, standard accounts assume memory requires a subject who remembers. In these cases, the only subjects are the perpetrators. This creates a paradox: can the perpetrator's archive serve as the vehicle for the victim's memory? Neither Margalit nor Rieff resolves this structural impossibility. Consequently, the literature lacks a vocabulary for memory without a remembering community. My project proposes that the archive itself can function as a proxy subject, provided specific duties are met by its custodians. This moves beyond the binary of remembering versus forgetting. Moreover, the temporal dimension is unresolved. Margalit assumes intergenerational transmission. Rieff assumes contemporary political utility. In cases of total dispersion, there is no future generation to receive the memory, nor a present conflict to fuel. The duty, if it exists, must be non-consequentialist and non-transmissive. Explaining how a duty persists without a future beneficiary is a significant philosophical gap that neither author addresses. My project fills this by grounding the duty in the integrity of the historical record itself, rather than its utility for the living.

  3. Method and plan
  I will pursue a hybrid method: conceptual analysis grounded in a limiting case. Pure conceptual analysis risks abstraction; a case study risks losing philosophical rigor. The hybrid approach ensures the theory confronts the material conditions of archival survival. I choose this because the question is normative but depends on empirical realities of documentation.

  Weeks 1-3: Close reconstruction of Margalit and Rieff. I will map the exact points where their arguments rely on community continuity or political conflict, isolating the premises that fail in cases of destruction. I will produce annotated summaries of key chapters.
  Weeks 4-6: Conceptual development. I will draft the core argument distinguishing duties of justice from duties of memory in archival contexts. This involves defining what constitutes reconstruction versus preservation. I will write preliminary drafts of the central sections.
  Weeks 7-8: Testing. I will apply the framework to a specific historical instance of a dispersed community whose records exist only in perpetrator archives. This tests whether the duty holds under real constraints. I will select a case where the archival record is known to be hostile.
  Weeks 9-10: Drafting and revision for the workshop paper. I will integrate the case study findings into the conceptual argument and polish the prose.

  If the analysis proves more demanding than expected, I will cut the specific historical case study in Week 7. The project can succeed as a purely conceptual argument about the structure of duty without a detailed historical exegesis. The core philosophical contribution lies in defining the duty, not in archival research. I will prioritize the argument regarding the transfer of agency from the community to the archive-holder. This ensures a complete philosophical draft even if historical verification is truncated. The schedule allows flexibility: if conceptual work stalls in Week 4, I will reduce the literature review scope rather than the argument development. I will also consult secondary literature on the ethics of archives to ensure I am not reinventing existing wheels, though my focus remains on the memory-specific duty. I will maintain a research log to track argument progress weekly. If the case study reveals complexities that threaten the timeline, I will generalize the case into a hypothetical limit-case rather than pursuing detailed historical verification. This preserves the philosophical point without getting bogged down in empirical disputes. The final weeks will focus heavily on anticipating objections from the committee, specifically regarding the 'ordinary duty' objection. Additionally, I will schedule weekly check-ins with my advisor to ensure the scope remains manageable. If the conceptual distinction between justice and memory proves elusive, I will pivot to focusing solely on the agency question: who bears the duty? This narrower focus is still publishable. The ten-week structure is designed to allow this kind of pivoting without sacrificing the final deliverable.

  4. Deliverable and criteria of success
  The deliverable is an 8,000-word paper suitable for the graduate workshop, intended for subsequent journal submission. Success requires more than surveying the difficulty; the paper must demonstrate that the duty of memory in these cases is distinct from general duties of justice. It must show that fulfilling the duty requires specific mnemonic activities—narrative reconstruction, contextualization of hostile documents—rather than merely preserving evidence or compensating survivors. The argument must identify who bears the duty and specify what counts as discharge. If the paper concludes only that we should be just to the dead, it fails. It must establish that remembering them differently matters morally. The paper should also be clear enough to be understood by philosophers outside the specific subfield of memory studies. Ultimately, the result must be a defensible normative claim, not just a critique of existing literature.

  5. Risks
  The primary risk is that the project collapses into a claim about ordinary moral duties owed to victims of wrongdoing, leaving nothing specific to memory. This would render the topic label decorative. This worry is not fatal if I can show that the *mode* of fulfillment is unique. For the project to escape this, it must be true that preserving hostile archives requires active interpretive work that differs from standard evidentiary preservation. Another risk is scope creep; attempting to solve the general ethics of archives rather than the specific gap between Margalit and Rieff. I will mitigate this by sticking strictly to the condition of community destruction. If the argument requires broader meta-ethical commitments than anticipated, I will limit the claim to the specific structural conditions identified in Weeks 1-3. Additionally, there is a risk that the case study yields ambiguous results. If the historical record is too fragmented to support the argument, I will rely on the conceptual limit-case instead. The project fails only if I cannot distinguish memory from justice; it succeeds if I can delineate the boundary, even if the final duty is narrower than initially hoped.
