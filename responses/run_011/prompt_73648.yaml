answer: |-
  Here is the 30-minute plan, structured to force the conceptual dependency you described.

  ### 1. The Carrying Case: The Kondiaronk Critique

  **Build on:** The Kondiaronk material (specifically the dialogue recorded in Lahontan's *New Voyages to North America*).

  **Why:** Your primary learning objective is meta-historical: *the question "where did inequality come from?" already has an answer built into it.* Kondiaronk is the only option that historicizes the question itself. Seasonal regimes provide evidence against the stage model, but Kondiaronk explains *why the stage model was invented* (to dismiss Indigenous critique). Using Kondiaronk first allows you to frame the Harari/Diamond narrative not as "new data" but as "old defensive theology."

  **Constraints for the Case:**
  *   **Must be:** A specific textual encounter (the dialogue between Adario/Kondiaronk and Lahontan). It must be presented as **political philosophy**, not ethnography. The focus is on Kondiaronk's *analysis of Europe*, not Europe's *observation of the Wendat*.
  *   **Must not be:** A description of "how Indigenous people lived." Do not start with "The Wendat were egalitarian." Start with "Kondiaronk argued the French were enslaved by their hierarchy." This prevents the "Noble Savage" trap before it starts.
  *   **Cognitive Load:** Keep it to one argument: *Freedom requires the ability to say no to authority.* If the French cannot say no to their King without punishment, they are less free than the Wendat who can say no to their chiefs. This is a binary they can hold: **Coercion vs. Consent.**

  ### 2. The Sequence (30 Minutes)

  **0:00–0:05: The Question is the Artifact (Kondiaronk)**
  *   **Action:** Read the specific line where Kondiaronk laughs at the French for obeying one man.
  *   **Forced Move:** Establish that the "inequality question" is a European reaction to this critique. Enlightenment thinkers needed to prove hierarchy was "natural" and "inevitable" to dismiss Kondiaronk's claim that it was a choice.
  *   **Heads Off:** *Noble Savage.* By framing Kondiaronk as the *critic* and Europe as the *subject*, you make him the sophisticated theorist and the Europeans the naive subjects of "civilization."
  *   **Transition:** "If the 'stage theory' of history was invented to prove Kondiaronk wrong, what happens if we stop trying to prove him wrong?"

  **0:05–0:15: The Stage Model Collapses (The Baseline)**
  *   **Action:** Connect Kondiaronk's critique to the archaeological record (briefly mention seasonal switching here as the *evidence* of the political consciousness Kondiaronk described).
  *   **Forced Move:** Show that if societies were politically self-conscious (as Kondiaronk proved), they could not have a single "original form." They switched forms. Therefore, there is no "Point A" where inequality arrived.
  *   **Heads Off:** *Data Science/Unfalsifiable.* Acknowledge that this makes history messier. Tell them: "Harari offers a clean model with high predictive power but low resolution. G&W offer a high-resolution model that requires abandoning the clean variables. This isn't storytelling; it's model selection."
  *   **Heads Off:** *Scale = Hierarchy.* Explicitly state: "Kondiaronk's people had complex trade and diplomacy without fixed hierarchy. Scale does not dictate structure."
  *   **Transition:** "If there was no Point A, we can't ask 'When did we leave the garden?' We have to ask a different question."

  **0:15–0:25: The "Stuck" Pivot (The New Question)**
  *   **Action:** Introduce the "How did we get stuck?" framework. Define "stuck" not as the *arrival* of hierarchy, but as the *loss of the ability to switch*.
  *   **Forced Move:** Contrast "Inequality as a substance" (Harari: it arrived) vs. "Inequality as a relationship" (G&W: we stopped turning it off). Use the Teotihuacan example here (hierarchical start, communal reversal) to prove the "switch" was possible even at scale.
  *   **Heads Off:** *G&W deny inequality existed.* Be explicit: "Inequality existed. It was played with. The tragedy isn't that it appeared; it's that it solidified."
  *   **Transition:** "This changes what we are looking for in the data."

  **0:25–0:30: Pre-emption and Assessment**
  *   **Action:** Address the final misconception and ask the closing question.
  *   **Heads Off:** *Willpower.* "This is not about 'choosing to be nice.' 'Stuck' implies structural locks, ritual固化, and violence that prevents switching. It is a structural problem, not a moral one."
  *   **Assessment:** (See below).

  ### 3. The Misconception Map

  | Misconception | Where to Head It Off | How to Phrase the Pre-emption |
  | :--- | :--- | :--- |
  | **"Noble Savage"** | **Min 0:05** (End of Kondiaronk segment) | "Do not hear this as 'Indigenous people were innocent.' Hear it as 'Indigenous philosophers diagnosed European pathology.' Kondiaronk is the doctor; Europe is the patient." |
  | **"Unfalsifiable / Storytelling"** | **Min 0:10** (Middle of Stage Model) | "To the data scientists: Harari's model is parsimonious but assumes a single variable (scale). G&W's model is complex but fits the outliers. We are debating feature selection, not truth." |
  | **"Scale requires Hierarchy"** | **Min 0:12** (End of Stage Model) | "If scale required hierarchy, Teotihuacan couldn't have reversed course. Complexity allows *more* options, not fewer." |
  | **"G&W deny pre-farm inequality"** | **Min 0:20** (Start of "Stuck" segment) | "They do not argue inequality is new. They argue *rigidity* is new. Violence existed; institutionalized, unswitchable violence is the variable." |
  | **"Just Choose Egalitarianism"** | **Min 0:28** (Pre-Assessment) | "This is not a self-help seminar. 'Stuck' means the exit door is locked, not that we forgot where the handle is." |
  | **MISSING: "Human Nature"** | **Min 0:15** (Transition to "Stuck") | **Add this:** Students will assume G&W argue humans are "naturally good." **Correction:** "G&W argue humans are 'naturally playful.' We play with hierarchy and egalitarianism. The problem is when we forget we're playing." |

  ### 4. Assessment and Boundaries

  **The Final Question (Last 2 Minutes):**
  Do not ask them to summarize. Ask them to translate.
  > *"Harari's headline is: 'Scientists Discover the Moment Hierarchy Began.' If Graeber and Wengrow are right, that headline is scientifically incoherent. Rewrite the headline to reflect their framework, and tell me which **verb** had to change."*
  > *(Target answer: Verbs like "Solidified," "Locked," "Rigidified," or "Monopolized" instead of "Began" or "Arrived.")*

  **What to Refuse (Say This Out Loud):**
  1.  **Archaeological Dating:** "We are not going to spend time debating the specific carbon dating of Teotihuacan layers. That is for the specialists. We are debating the *interpretation of the pattern*."
  2.  **Biological Determinism:** "I will not entertain arguments about 'evolutionary psychology' or 'human nature' today. We are discussing political history, not biology."
  3.  **Prescriptive Politics:** "This is not a seminar on how to fix modern capitalism. Understanding how we got stuck is not the same as having the key to get unstuck. Don't ask me for policy solutions."
