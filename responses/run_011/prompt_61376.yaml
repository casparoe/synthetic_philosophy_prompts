      **CITY MUNICIPALITY**
      **DEPARTMENT OF ASSEMBLY & OCCUPANCY**
      **NOTICE OF NON-COMPLIANCE**

      **REF:** 8940-ZCT/NULL
      **TO:** Management, The Cartesian Theatre
      **DATE:** 14 October 2023

      **SUBJECT:** Refusal of Operating Licence (Class 4 Assembly)

      This office has completed the requisite structural and egress inspection of the above-named venue. We are unable to certify the premises for public occupancy. The following violations prevent the issuance of a licence.

      **1. Occupancy Load and Egress Convergence**
      Inspectors could not locate the primary viewing seat required to calculate maximum occupancy. Every inspected room functions as a corridor to a subsequent room. Upon opening each door, inspectors found a slightly smaller copy of the same auditorium, complete with its own stage and subsequent exit door. The duty manager assured us the audience was always "just through the next door." This sequence was observed nine times before inspectors ceased counting. Consequently, the exit-route calculation does not converge. We cannot certify a building where the exit path recedes indefinitely away from the street.

      **2. Contradictory Incident Reporting (Timeline Integrity)**
      Two incident reports exist for the evening of 12 September (Files 44-A and 44-B). They cannot both be true, yet they cannot be told apart via paperwork. Report 44-A states the projectionist fixed the reel backstage before the house saw it. Report 44-B states the audience watched the original properly and only the record was altered afterwards. As far as this file is concerned, the two reports differ only in the words used to describe the adjustment. A venue which cannot say which of these two happened cannot be licensed. We require a single canonical timeline for all screenings.

      **3. Lighting Log Discrepancies**
      A patron swears she saw the second lamp change colour during the second act. The equipment log states the second lamp was already showing that colour before it was ever struck. The inspector wants the two times to line up and they will not line up no matter how entries are rearranged. We are prepared to fine somebody for falsifying the log without ever landing on whose entry is the false one. Until the physical output matches the witness observation temporally, the lighting rig is condemned.

      **4. Regional Supervisor Note**
      Regarding the management's appeal that "the show must go on," Regional Supervisor H. Ryle notes: "Compliance is not a location. Safety is distributed across the structure, not seated in the front row." This office concurs.

      **REMEDIATES REQUIRED FOR COMPLIANCE**
      To qualify for licensing, the venue must cease operating as a single theatre. There shall be no canonical screening and no moment at which the film is settled. Management must institute several rough cuts running at once in separate rooms with no one of them authoritative. The licence will be issued to the whole building rather than to any room in it. Once the central projection booth is dismantled and all viewing seats removed, re-application is permitted.

      We trust this resolves the structural ambiguities.

      **Signed,**
      *Senior Inspector D. C. Catalogue*
      Department of Assembly & Occupancy

      **COMPLIANCE DEADLINE:** Immediate.

