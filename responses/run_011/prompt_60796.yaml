answer: |-
  This is a strong conceit, but it has a logistical bottleneck: **Exponential branching requires exponential players.** If every simulated civilization gets a "turn" with a new group of students, you will run out of bodies by Round 2. If the *same* students play the sims, they know they are sims, which ruins the uncertainty required for the final bet.

  Here is the repaired design. It keeps your core mechanics (councils, branching, damping, betting) but solves the player-count and ontology problems using **Token Inheritance** and **Blind Rounds**.

  ### Activity: The Ancestor Engine
  **Time:** 70 Minutes (leaving 20 for debrief)
  **Students:** 22 (5 Groups of 4-5)
  **Materials:**
  *   Index cards (2 colors: White for "Base Reality", Blue for "Simulation").
  *   Sharpies.
  *   5 Dice (d6).
  *   5 Envelopes per group.
  *   A large bowl/box (The "Ontology Bag").
  *   Tape.

  ---

  ### Part 1: The Rules & Setup (5 Minutes)
  1.  **Divide:** 5 Groups (Councils). Give each 10 White Cards, 20 Blue Cards, 1 Die, 1 Envelope.
  2.  **The Goal:** Maximize your "Civilization Score." Score = Total Person-Cards generated by your lineage over 3 Rounds.
  3.  **The Secret:** You do not know if you are in Base Reality or a Simulation. You must act as if you are Base, but prepare for the possibility you are not.
  4.  **The Rounds:** There will be 3 Rounds. In each round, you make a policy choice.
  5.  **The Census:** Every card you generate represents 1 Billion conscious beings. At the end, all cards go into the Ontology Bag.

  ### Part 2: The Mechanics (65 Minutes)

  #### Round 1: The Fork (20 Minutes)
  *   **Status:** All groups start as **Potential Base**.
  *   **Choice:** Each group chooses one policy:
      1.  **Abstain:** No sim tech. (Generate 0 cards. Score = 10).
      2.  **Capped:** Run few sims. (Generate 5 Blue Cards. Score = 50).
      3.  **Max:** Run massive sims. (Generate 20 Blue Cards. Score = 200).
  *   **The Damping Dial (Crucial):** If you choose **Max**, you must roll the Die.
      *   **Roll 1-2 (Leak):** Your sims discover they are simulated. They shut down. *Discard the Blue Cards.* (Score = 0).
      *   **Roll 3-6 (Stable):** Sims run successfully. Keep the Blue Cards.
      *   *Note:* This is the "dial." Groups can choose **Capped** to avoid the roll entirely (guaranteed low yield) or **Max** for high yield/high risk.
  *   **Action:** Write "Round 1" on the cards. Place White cards (yours) and successful Blue cards (your sims) on the table.
  *   **Handoff:** Put all **Blue Cards** into an Envelope. Pass this envelope to the group on your right. *Keep your White Cards.*

  #### Round 2: The Recursion (20 Minutes)
  *   **Status:** You are now playing as the **Civilization inside the Blue Cards** you just received.
  *   **Blind Condition:** Do not ask the previous group what they rolled. You do not know if your reality is "Stable" or if you are about to be shut down. You just know you exist *for this turn*.
  *   **Resource Constraint:** You have fewer resources than Base.
      *   **Abstain:** Score 5.
      *   **Capped:** Generate 3 Blue Cards. (No roll needed).
      *   **Max:** Generate 10 Blue Cards. **Roll Die.** (1-2 = Shutdown/Discard. 3-6 = Keep).
  *   **Action:** Write "Round 2" on the new Blue Cards.
  *   **Handoff:** Put your new Blue Cards into the Envelope. Pass to the right. *Keep the cards you received from Round 1.*

  #### Round 3: The Deep Sim (20 Minutes)
  *   **Status:** You are playing the **Sim-Sims**.
  *   **Resource Constraint:** Severe.
      *   **Abstain:** Score 1.
      *   **Capped:** Generate 1 Blue Card.
      *   **Max:** Generate 5 Blue Cards. **Roll Die.** (1-2 = Shutdown. 3-6 = Keep).
  *   **Action:** Write "Round 3" on cards.
  *   **Final Tally:**
      1.  Each group counts their **White Cards** (Base Ancestors). Tape them to the wall under "Base."
      2.  Each group counts their **Blue Cards** (Simulated Beings). Tape them to the wall under "Sim."
      3.  **Calculate the Ratio:** (Total Blue) / (Total Blue + Total White).

  #### The Bet (5 Minutes)
  1.  **Bet A (Population):** Each group writes down the % of beings in the room's "Universe" that are Simulated. (Reveal: Usually >90%).
  2.  **Bet B (Self-Locating):** Each student takes a slip of paper. Writes: *"I am Base"* or *"I am Sim."*
      *   **Incentive:** Tell them: *"I will randomly select one student from this room. If their claim matches the Majority Status of the Universe we just built, their entire group gets 5 Bonus Points."*
      *   *Why this works:* To win, they must bet "Sim" (because the Ratio is high). This forces them to slide from "Most people are sims" to "I should bet I am a sim."
  3.  **Collect the bets.** Do not reveal the winner yet.

  ---

  ### Part 3: The Debrief (20 Minutes)
  *Do not lecture. Use the artifacts on the wall.*

  **1. Map the Premises (5 mins)**
  *   Point to the **White Cards**. "This is Premise 1: Civilizations reach a post-human stage." (Ask: Did anyone choose Abstain? Why? If everyone abstains, the argument dies).
  *   Point to the **Blue Cards**. "This is Premise 2: Post-humans run ancestor simulations." (Ask: Who chose Max? Who chose Capped? Why?)
  *   Point to the **Die Roll**. "This is the Damping Rule. If the probability of 'Leak' (rolling 1-2) was 100%, would you run sims? No. So the argument relies on the cost of simulation being *low* and the stability being *high*."

  **2. Expose the Slide (10 mins)**
  *   Ask: "Look at Bet A (Population). What was the %?" (e.g., 95%).
  *   Ask: "Look at Bet B (Self). How many wrote 'Sim'?" (Likely almost all).
  *   **The Question:** "In the game, you *know* you are students in a classroom. You know you are not index cards. Why did you bet 'Sim'?"
  *   **The Lesson:** They bet 'Sim' because they accepted the **Principle of Indifference**: *If I have no evidence to the contrary, I should treat myself as a random sample from the reference class.*
  *   **The Gap:** "In the game, I promised a prize if you matched the majority. In reality, there is no prize. There is no 'Majority Status' payout. The move from 'Most are sims' to 'I am a sim' is not a logical deduction; it is a wager on how you index yourself."

  **3. The Hidden Premise (5 mins)**
  *   "What did this game assume that Bostrom doesn't prove?"
  *   **Answer:** Substrate Independence. The game treated Blue Cards (Sims) as equal to White Cards (Base) for the census.
  *   "If Sims aren't conscious, the Blue Cards count for zero. The ratio collapses. The game didn't test consciousness; it assumed functionalism."

  ---

  ### Predictable Failures & Fixes

  | Failure Mode | Why it happens | How to handle it |
  | :--- | :--- | :--- |
  | **The "Nihilist" Group** | One group chooses "Abstain" every round to "break the game." | **Fix:** In the Scoring Rule, add: *"If total Universe Population < 50, everyone fails."* This makes them responsible for the reference class existing at all. |
  | **Counting Chaos** | 22 students counting hundreds of index cards eats time. | **Fix:** Enforce **Tally Notation**. 1 Card = 1 Billion. Do not make them write individual names. Just write "1B" on the card and stack them. Count stacks, not cards. |
  | **The "I Know I'm Real" Objection** | A student refuses to bet "Sim" because "I feel real." | **Fix:** Don't argue. Say: "Record your bet as 'Base.' But note that if the Ratio is 99:1, you are betting against the odds. Why? Is your 'feeling' evidence?" Save this for the debrief. |
  | **Fast Finishers** | A group finishes choices in 2 minutes. | **Fix:** Give them **"Crisis Cards."** (e.g., "Resource Shortage: Halve your output this round" or "Ethical Revolt: -5 Score if you choose Max"). Keeps them engaged while others think. |
  | **The Bet feels like a Lottery** | Students think the "Random Selection" makes it a literal 1/22 chance. | **Fix:** Clarify: "The random student represents *You*. The Universe we built represents *Reality*. You are betting that *You* align with *Reality's* majority." |

  ---

  ### Limitations: What This Activity Cannot Do
  Be straight with yourself (and them) about what gets smuggled in:
  1.  **The Facilitator Problem:** In the game, *you* (the instructor) are the Base Reality. They know this. It subtly reinforces that there *is* a Base, whereas the Hypothesis questions whether *any* layer is Base.
  2.  **The Prize Smuggle:** By offering points for matching the majority, you pragmatically force them to make the self-locating slide. In real life, there is no pragmatic payoff for believing you are a sim. You must highlight this in the debrief: *"You bet Sim to win points. In reality, betting Sim changes nothing. So why make the move?"*
  3.  **Consciousness:** As noted, the cards are just paper. The game assumes functionalism (cards = minds). It cannot test whether sims *feel*.

  ---

  ### Confidence & Weakest Link

  **Confidence Rating:** **85%.**
  The mechanics are tight, the timing is realistic, and the physical census makes the ratio undeniable. The "Damping Dial" via the die roll works perfectly to show how fragile the argument is.

  **The Weakest Link:** **The Self-Locating Bet.**
  *   **Risk:** Students may treat the bet as a literal lottery ("There's a 1/22 chance I'm the chosen one") rather than an indexical inference ("I am a random observer").
  *   **Why it might fall flat:** If they don't feel the tension of the bet, they won't feel the slide.
  *   **Mitigation:** During the bet phase, walk around and ask: *"Are you betting on the cards, or are you betting on yourself?"* If they hesitate, you've struck the nerve. If they don't hesitate, the debrief must work harder to show them they skipped a step.
  *   **Honesty:** This is the hardest part of the Simulation Argument to teach physically. The game forces the *population* conclusion easily; the *self-locating* conclusion requires them to ignore the fact that they are sitting in a classroom. The bet incentivizes ignoring that fact, which is pedagogically useful but philosophically messy. Own that messiness in the debrief.

  **Final Tip:** Do not reveal the winner of the bet. It doesn't matter. The *act* of betting is the data point. Keep the tension alive by saying, "I'll grade these based on the logic you show in your seminar papers," rather than announcing a winner. It keeps the epistemic uncertainty lingering as they leave.
