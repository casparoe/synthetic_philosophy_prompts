prompt: |-
  I co-teach a seminar with the economic historians and there's a practice in that literature I can't quite get a handle on. People working on the so-called great divergence have mostly stopped asking "why did Europe pull ahead of China?" and now compare matched regions instead — say, England against the Yangzi delta — on the grounds that the civilisation-level question isn't really a question at all. But the books still come with civilisation-level titles, and at every job talk somebody asks the candidate to say somthing about China as a whole.

  What theory of explanation does the matched-region practice presuppose? Reconstruct it for me. Does it commit you to the view that "why P" is incomplete until the contrast class is named, and that the contrast class fixes what the explanandum even is? Which rival accounts of explanation does it rule out — and does it genuinely rule them out, or just happen not to need them? Then the wrinkle: is that practice consistent with the way the same people still describe their own subject, or is the literature hedging between two incompatible pictures of what its question is? And what would have to change, methodologically, if you took the harsher line that "why Britain and not China?" isn't one question but a loose bundle of them, each indexed to whatever causal factors the asker happens to have in hand?

  Argument, not bibliography, please.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the Prompt:**

      *   **Context:** Co-teaching a seminar with economic historians.
      *   **Phenomenon:** The "Great Divergence" literature has shifted from comparing "Europe vs. China" (civilization-level) to "England vs. Yangzi Delta" (matched-region level).
      *   **Tension:** Despite the methodological shift, book titles remain civilization-level, and job talk questions still demand civilization-level answers.
      *   **Core Task:** Reconstruct the theory of explanation presupposed by the matched-region practice.
      *   **Specific Questions to Address:**
          1.  Does it commit to the view that "why P" is incomplete without a named contrast class, and that the contrast class fixes the *explanandum*?
          2.  Which rival accounts of explanation does it rule out (and does it *rule them out* or just *ignore* them)?
          3.  Is the practice consistent with how the literature describes its own subject (is it hedging/incompatible)?
          4.  What would change methodologically if one took the "harsher line" (that "Why Britain and not China?" is a bundle of questions indexed to causal factors)?
      *   **Constraint:** Argument, not bibliography. (Focus on philosophical/logical structure, not citing Pomeranz, Wong, Bin Wong, etc., by name unless necessary for clarity, but prioritize the *logic* of the argument).

  2.  **Analyze the "Matched-Region" Practice (The Core Theory of Explanation):**

      *   *Why match regions?* To control for variables. If you compare England to all of China, you're comparing a small, coal-rich, island nation to a massive, diverse empire. Differences might be due to scale, geography, or internal variation rather than the specific causal mechanisms (institutions, culture, etc.) being tested.
      *   *Philosophical Underpinning:* This looks like a *contrastive theory of explanation* (van Fraassen, Lipton, etc.). Explanation is not just "Why E happened?" but "Why E happened *rather than* C?"
      *   *The Explanandum:* By matching Yangzi to England, the historians are redefining the *explanandum*. It's no longer "Why did the Industrial Revolution happen in the West?" It's "Why did the Yangzi, which looked like England in 1750, fail to industrialize like England by 1850?"
      *   *Commitment:* Yes, it commits to the idea that the contrast class fixes the *explanandum*. Without the match, the question is ill-posed because the baseline conditions are too heterogeneous.

  3.  **Identify Rival Accounts of Explanation:**

      *   *Rival 1: Deductive-Nomological (Hempel).* Seeking universal laws. If the matched-region approach says "context matters too much for universal laws at the civilization level," it pushes back against covering-law models at that scale.
      *   *Rival 2: Essentialist/Civilizational.* The idea that "Europe" has a trait (Reason, Liberty) and "China" has a trait (Despotism, Stagnation). The matched-region approach rules this out by showing internal variation (Yangzi was like England, Sichuan was not). It treats "China" as a statistical aggregate, not a causal agent.
      *   *Does it rule them out or ignore them?* It *undermines* the essentialist view empirically. It doesn't necessarily rule out D-N logic, but it restricts the scope of the laws to specific contexts. It mostly rules out *typological* explanation.

  4.  **Analyze the Tension (Titles/Job Talks vs. Method):**

      *   *The Hedging:* The method says "Compare England to Yangzi." The title says "The Great Divergence between Europe and China."
      *   *Is this incompatible?* Yes, logically. If the divergence is only between England and Yangzi, then "Europe vs. China" is a category error.
      *   *Why do it?* Pragmatics. "England vs. Yangzi" doesn't sell books. "Europe vs. China" captures the stakes. Also, the Yangzi is treated as a *proxy* for China's potential, assuming that if the best part of China didn't diverge, the rest wouldn't have mattered.
      *   *The Job Talk:* Candidates are asked to zoom back out. This suggests the field hasn't fully accepted the methodological reduction. They want the "Big Answer" but accept the "Small Method" as the path to it. This is a "synecdoche" strategy (part stands for the whole).

  5.  **Analyze the "Harsher Line" (Bundle of Questions):**

      *   *The Proposition:* "Why Britain and not China?" isn't one question. It's many. (Why coal? Why colonies? Why institutions?). Each factor has its own contrast class.
      *   *Methodological Change:*
          *   No more "The Cause" of the divergence.
          *   Shift from *narrative unity* to *causal pluralism*.
          *   Abandon the search for a single "divergence date."
          *   Acknowledge that "China" is not a single unit of analysis but a container for different causal regimes.
      *   *Consequence:* It dissolves the "Great Divergence" as a singular historical event. It becomes a historiographical construct rather than an ontological reality.

  6.  **Drafting the Argument (Iterative refinement):**

      *   *Introduction:* Define the shift. Identify the core philosophical move (contrastive explanation).
      *   *Section 1: The Contrastive Commitment.* Explain how matching fixes the *explanandum*. It's not just controlling variables; it's defining what needs explaining. The surprise is the similarity in 1750, not the difference in 1850.
      *   *Section 2: Rival Accounts.* Focus on Essentialism/Typology. The matched method kills the "Spirit of Europe" explanation. It doesn't kill causal mechanisms, but it relocates them from "Civilization" to "Region/Context."
      *   *Section 3: The Inconsistency (The Hedge).* Address the titles/job talks. This is a "Metonymic Fallacy." They use the part (Yangzi) to answer for the whole (China) to preserve the grand narrative while using rigorous methods. It's a pragmatic inconsistency, not necessarily a logical one *if* you assume the Yangzi is the relevant counterfactual for China's potential. But strictly, it is incompatible.
      *   *Section 4: The Harsher Line.* If we take the bundle view seriously, the "Great Divergence" disappears. We get a history of specific constraints. Methodologically, this means abandoning the "puzzle" format.
      *   *Conclusion:* Summarize the tension. The field wants the prestige of the big question with the rigor of the small comparison.

  7.  **Refining the Tone:**

      *   Needs to be philosophical but grounded in the historiography context.
      *   Avoid name-dropping (Pomeranz, etc.) unless it clarifies the argument. Focus on the *logic*.
      *   Ensure the "Argument, not bibliography" constraint is met.
      *   Make sure to answer the specific sub-questions about the contrast class and the "harsher line."

  8.  **Self-Correction/Critique during drafting:**

      *   *Check:* Did I answer whether the contrast class fixes the *explanandum*? *Yes, emphasize that.*
      *   *Check:* Did I distinguish between ruling out vs. not needing rivals? *Yes, focus on how essentialism is rendered empirically empty, not logically impossible.*
      *   *Check:* Is the "harsher line" section distinct? *Make sure it pushes further than just "more nuance." It needs to imply the dissolution of the field's central object.*
      *   *Check:* Is the tone appropriate? *Keep it analytical, slightly critical.*

  9.  **Final Polish:** (Reviewing against the prompt's specific phrasing).
      *   "What theory of explanation does the matched-region practice presuppose?" -> Contrastive.
      *   "Does it commit you to the view that 'why P' is incomplete..." -> Yes.
      *   "Which rival accounts... does it rule out?" -> Essentialist/Typological.
      *   "Is that practice consistent..." -> No, it's a synecdoche hedge.
      *   "What would have to change methodologically..." -> Dissolution of the singular event.

      *(Self-Correction)*: Be careful not to say the historians *are* philosophers. They are practicing a form of inference to the best explanation via controlled comparison. Frame it as an implicit philosophy of science.

      *(Refining the "Harsher Line")*: If "Why Britain not China" is a bundle, then the "Great Divergence" is a reification. The methodological change is moving from explaining a *outcome* to explaining *processes*.

      *(Final check on "Argument not bibliography")*: Ensure I don't just list Pomeranz, Wong, Rosenthal, etc. Keep it conceptual.

      *Let's write.*
answer: |-
  The shift from civilization-level comparison to matched-region comparison in Great Divergence literature presupposes a **contrastive theory of explanation**. This is not merely a methodological tweak for better data control; it is a philosophical claim about what constitutes a historical puzzle.

  Here is the reconstruction of that theory, the tensions it creates, and the consequences of pushing its logic to the limit.

  ### 1. The Contrastive Commitment
  The matched-region practice commits fully to the view that "why P" is incomplete until the contrast class is named, and that the contrast class fixes the *explanandum*.

  In a civilization-level framework ("Why Europe and not China?"), the *explanandum* is implicitly defined as the presence of industrialization in one cultural sphere and its absence in another. The causal search is directed toward traits intrinsic to those spheres (e.g., culture, political structure, geography).

  In the matched-region framework ("Why England and not the Yangzi Delta?"), the *explanandum* shifts. It is no longer "Why did industry happen there?" but "Why did industry happen there *given that* both places looked the same in 1750?" The similarity in the baseline (high wages, commercialized agriculture, sophisticated markets) becomes the background against which the divergence is surprising.

  By matching the regions, the historian argues that the *only* thing requiring explanation is the deviation from the shared trajectory. If you compare England to all of China, the divergence might be explained by the fact that most of China was not commercially developed. By comparing England to the Yangzi, you rule out "level of development" as a cause. Therefore, the contrast class does not just filter answers; it constructs the event that needs explaining. The "Great Divergence" ceases to be a story about two civilizations and becomes a story about two specific economic zones failing to converge despite similar inputs.

  ### 2. Rival Accounts: Ruled Out or Rendered Otiose?
  This practice primarily targets **typological or essentialist explanation**.

  *   **The Rival:** The essentialist account assumes that "Europe" and "China" are coherent causal agents with distinct essences (e.g., "European rationality" vs. "Asian despotism"). It treats the civilization as the unit of causality.
  *   **The Verdict:** The matched-region practice does not logically *rule out* essentialism (one could argue the Yangzi shared Europe's "rationality" but was suppressed by the Chinese state), but it renders it **empirically otiose**. If the Yangzi Delta had all the economic preconditions of England, then "Chinese culture" or "Confucianism" cannot be the sufficient cause of non-industrialization, because those traits were present in the Yangzi yet failed to prevent high development. The method forces the explanation away from broad cultural essences toward specific, contingent constraints (e.g., coal location, access to New World land).

  It also pushes back against **Deductive-Nomological (covering law)** models at the macro scale. If the divergence depends on the specific geographical accident of coal proximity to waterways in England but not in China, then there is no universal law of industrialization that applies to "civilizations." The explanation becomes local and conjunctural.

  Does it *need* to rule these out? Strictly speaking, no. One could maintain an essentialist view and argue the Yangzi is an exception. But the practice operates on the principle of **causal homogeneity**: if the regions are matched on relevant variables, they should be treated as the same causal type until proven otherwise. This makes the civilization-level explanation a category error rather than a false hypothesis.

  ### 3. The Inconsistency: Hedging via Synecdoche
  There is a genuine incompatibility between the method (matched regions) and the marketing (civilization-level titles and job talk questions).

  The literature is hedging. It relies on a **synecdoche**: the Yangzi Delta is treated as the part that stands for the whole of China. The implicit argument is: "If the most advanced part of China didn't industrialize, then 'China' didn't industrialize, and the reasons why the Yangzi failed are the reasons why China failed."

  This is logically fragile. It assumes that the constraints binding the Yangzi were the same constraints binding the rest of China, and that if the Yangzi *had* industrialized, the rest of China would have followed. This preserves the "Civilization" as the unit of historical destiny while using the "Region" as the unit of empirical verification.

  *   **The Tension:** If the explanation for the divergence is "England had easy coal and colonies," that explains why England diverged from the Yangzi. It does not necessarily explain why England diverged from *Sichuan* or *Shandong*, which might have failed for totally different reasons (e.g., internal trade barriers, different crop regimes).
  *   **The Hedge:** By keeping the title "Europe vs. China," authors claim the stakes of the macro-question while avoiding the methodological impossibility of answering it. In job talks, when candidates are asked to "zoom out," they are being asked to bridge this gap—to assert that the local mechanism scales up to a civilizational destiny. Often, they cannot do this without reverting to the essentialism their method undermined. The literature thus lives in a state of **methodological particularism** masked by **narrative universalism**.

  ### 4. The Harsher Line: Dissolving the Question
  If you take the harsher line—that "Why Britain and not China?" is not one question but a loose bundle indexed to specific causal factors—the methodology of the field must fundamentally change.

  Currently, the field is organized around a **singular outcome**: The Industrial Revolution. All causal factors are weighed by their ability to explain this single node.

  If you accept the "bundle" view:
  1.  **The *Explanandum* Fragmentation:** You no longer explain "The Divergence." You explain "The Coal Constraint," "The Labor Constraint," "The Capital Constraint." Some of these might diverge in 1750, others in 1800, others in 1850. There is no single "date of divergence."
  2.  **The Unit of Analysis:** "China" ceases to be a valid negative case. You are not comparing Britain to China; you are comparing British coal markets to Chinese coal markets, British labor markets to Chinese labor markets. In some bundles, Britain diverges from the Yangzi; in others, it diverges from Japan; in others, it looks like India.
  3.  **Methodological Consequence:** The search for a "Grand Theory" of the Great Divergence is abandoned. The literature would shift from **puzzle-solving** (finding the missing piece that explains the gap) to **process-tracing** (mapping how specific mechanisms operated in specific contexts).

  This would effectively dissolve the "Great Divergence" as a coherent historical object. It would become a historiographical construct—a way of grouping unrelated local divergences under a dramatic label. To adopt this line would be to admit that "Europe" and "China" are not the relevant causal containers for economic history.

  ### Conclusion
  The matched-region practice presupposes that explanation is contrastive and that the contrast class defines the event. It successfully undermines essentialist explanations but creates a tension by continuing to sell its findings as civilization-level answers. It relies on the Yangzi acting as a valid proxy for China, a claim that is pragmatic but theoretically unsupported. If the field were to fully embrace the logic of its own method, it would have to abandon the "Great Divergence" as a singular puzzle and admit it is studying a bundle of disconnected regional histories. The current literature refuses this conclusion, preferring the rigor of the micro-comparison with the prestige of the macro-question.
