prompt: |-
  I teach political philosophy and I have a side gig that's eating my life. For about six years I've chaired a standing review committee for our state commission on public decision-making. The setup: whenever an agency or a court administrator wants to change how a group reaches a verdict — jury size, voting thresholds, licensing boards, parole panels, citizen assemblies, whatever — the proposal comes to us and we write a two-page recommendation on whether the change is defensible *on accuracy grounds*, i.e. whether the new arrangement is likelier to get it right than the old one. We get six or eight a year and I sign every one. My committee is me, two grad students (one logic, one ethics, neither does math), and a staff attorney. Ninety minutes per proposal, no access to data about our own jurisdiction's panels, and the commission votes on our recommendation without reading the appendix. So whatever we produce has to be runnable by non-specialists, fast.

  Almost everything that lands on our desk gets argued for or against with Condorcet's jury theorem — usually badly, usually by someone who read about it in a newspaper column. "More people = more likely to be right, so don't shrink the jury." "Unanimity is just a high threshold and the theorem says high thresholds are more reliable, so keep it." "A hundred assembly members is obviously better than seven." I want to stop this.

  So, acting as an expert on formal epistemology and collective decision theory who has also spent real time explaining this to non-experts, please build me a decision procedure — something my committee can literally work down a page — for evaluating a proposed change to a group decision rule on the basis of the jury theorem and its limits. Think carefully before writing anything. Start with a paragraph of brainstorming: list every way the theorem's conditions can fail in a real jury or board, deliberately including failure modes that *look like improvements from the inside*. Then tell me which of those a small staff with no data access and ninety minutes can actually detect, and cut the undetectable ones out of the procedure, saying out loud that you cut them and what we lose by cutting them.

  Then the procedure itself: an ordered list of questions, what counts as a sufficient answer to each, what each answer licenses, and what a red flag looks like in a proposal document. For each step, say which condition of the theorem it's testing. Be explicit about:

  - which distinctions absolutely have to survive being dumbed down for my grad students and which I'm allowed to drop. Off the top of my head I think we need to keep (a) the difference between jurors not talking to each other and jurors being independent in the technical sense, and (b) the difference between "this rule is reliable in advance" and "given that this particular panel voted this way, the verdict is probably right." Tell me if I'm wrong about either one, or if something else is more load-bearing.
  - where the procedure stops flat with "not licensed — the theorem gives you nothing here," and where it hands the question up to the legislature because it's about values rather than accuracy. We are not permitted to set the acceptable ratio of wrongful convictions to wrongful acquittals; that's above our pay grade and it needs to be visibly above our pay grade in the document.
  - what the procedure cannot do at all, phrased so plainly I can paste it into a footnote.

  Then run it on three proposals actually in front of us this term, showing your work step by step:

  1. Shrink criminal trial juries from twelve to eight, and replace unanimity with a requirement of at least seven of the eight.
  2. A citizen assembly of a hundred randomly selected residents, all of whom receive the same two-hundred-page expert briefing packet and the same three days of testimony, voting yes/no on whether a water treatment plant should go at site A or site B.
  3. The one I'll hate: letting jurors discuss the evidence as a group during the trial, in the judge's presence, instead of being instructed to withhold judgment until the close of evidence. I've testified for this twice and I still think it's right — the group catches things individuals miss, and it stops people from locking in early. I want the procedure to be able to tell me I'm overconfident, and I want it told in the terms I'd have to repeat to the commission.

  If for any of the three the honest verdict is "we can't tell from here," say that, and say what evidence would settle it and who'd have to collect it.

  Keep it to something I could hand out on paper. Bold the step headings. No bibliography, no reading list, no citations — I don't care where a claim comes from, I care that it holds up and that my grad students can apply it without me in the room. And if you're occassionally unsure about a step, mark it as a judgment call rather than dressing it up as procedure; half my job is knowing which parts of our recommendations are really just me having a view.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Political philosophy professor, chairs a state review committee on public decision-making.
      *   **Task:** Create a practical, 90-minute decision procedure for evaluating proposed changes to group decision rules (juries, boards, assemblies) based *strictly* on accuracy grounds (Condorcet's Jury Theorem and limits).
      *   **Constraints:**
          *   Committee: User + 2 grad students (logic/ethics, no math) + staff attorney.
          *   Input: 6-8 proposals/year.
          *   Output: 2-page recommendation.
          *   Audience: Commission (non-specialists).
          *   Format: Ordered list of questions, sufficient answers, licensing conditions, red flags.
          *   Specific Content Requirements:
              *   Start with brainstorming on failure modes (including deceptive improvements).
              *   Filter for detectability (cut undetectable ones, admit loss).
              *   Distinguish necessary vs. droppable distinctions (Independence vs. No Communication; Ex-ante Reliability vs. Ex-post Probability).
              *   Define "Stop" points (Theorem gives nothing) vs. "Hand-up" points (Value judgments).
              *   Define limitations clearly (for a footnote).
              *   Apply to 3 specific cases (Jury shrink/threshold change; Citizen Assembly; Juror discussion during trial).
              *   Tone: Expert but practical, no citations/bibliography, bold headings, mark judgment calls.
      *   **Goal:** Stop misuse of Condorcet's Jury Theorem (CJT) by non-experts.

  2.  **Deconstruct Condorcet's Jury Theorem (CJT):**
      *   *Core Claim:* If voters are independent and each has competence $p > 0.5$, majority rule reliability approaches 1 as $n \to \infty$. If $p < 0.5$, reliability approaches 0.
      *   *Conditions:*
          1.  Binary choice (True/False, Guilty/Not Guilty).
          2.  Common interest/Truth (everyone wants the *same* right answer).
          3.  Independence (votes are statistically independent conditional on the state of the world).
          4.  Competence ($p > 0.5$).
      *   *Common Misuses:* Assuming $n$ increase always helps (ignores $p < 0.5$ or dependence); assuming unanimity is always better (ignores false negatives); ignoring correlation.

  3.  **Brainstorming Failure Modes (Mental Draft):**
      *   *Competence < 0.5:* Experts are wrong, bias is systemic.
      *   *Dependence:* Shared information, herd behavior, common bias, deliberation (can be good or bad).
      *   *Binary Assumption:* Many decisions aren't True/False (e.g., sentencing length, site selection with >2 options).
      *   *Common Interest:* Jurors might want acquittal regardless of truth (nullification) or conviction for safety.
      *   *Deceptive Improvements:* Adding members who are correlated (looks like $n$ up, actually just noise); Deliberation that creates a charismatic leader (looks like consensus, actually dependence).
      *   *Thresholds:* CJT is usually majority. Unanimity changes error trade-offs (Type I vs Type II), not just raw accuracy.

  4.  **Filtering for Detectability (The 90-Minute Constraint):**
      *   *Can we measure $p$?* No. We have no data on jurisdiction accuracy. *Cut:* Direct competence measurement. *Loss:* We can't prove $p > 0.5$, must assume or argue qualitatively.
      *   *Can we measure Independence?* Hard. But we can look for *sources* of dependence (shared briefing, same judge, deliberation rules). *Keep:* Structural sources of correlation.
      *   *Can we measure Common Interest?* Hard. But we can look for incentives (political pressure, electoral stakes). *Keep:* Structural incentives.
      *   *Can we check Binary?* Yes. *Keep.*
      *   *Can we check Threshold Logic?* Yes. *Keep.*

  5.  **Developing the Procedure (Iterative Design):**
      *   *Step 1: Binary & Truth.* Is there a fact of the matter? If it's policy preference, CJT doesn't apply.
      *   *Step 2: Competence Assumption.* Can we plausibly claim members are better than coin-flips? If not, CJT fails.
      *   *Step 3: Independence.* Are votes correlated? (Deliberation, shared bias).
      *   *Step 4: Threshold & Error Types.* Majority vs. Unanimity. This shifts Type I/II errors. CJT speaks to *correct verdict rate*, not *error distribution*.
      *   *Step 5: The "N" Question.* Does changing size actually change reliability given 2 & 3?

  6.  **Addressing Specific User Constraints:**
      *   *Distinctions:*
          *   (a) No talking vs. Statistical Independence: Crucial. Deliberation *creates* dependence but might raise $p$. Need to capture this trade-off.
          *   (b) Ex-ante (Rule Reliability) vs. Ex-post (Verdict Probability): Crucial. CJT justifies the *rule*, not the specific *outcome*.
      *   *Stop vs. Hand-up:* If the change affects Type I/II error ratios (e.g., unanimity vs. majority), that's a value judgment (Blackstone's Ratio). Hand up to legislature. If the change breaks Independence or Competence, Stop (Theorem gives nothing).
      *   *Limitations:* Must state we don't measure actual accuracy, only structural defensibility.

  7.  **Drafting the Content - Section by Section:**

      *   *Brainstorming:* List failure modes. Filter for the "90-minute test."
      *   *The Procedure:* 5 Steps.
          1.  Truth-Aptness.
          2.  Competence Plausibility.
          3.  Independence Structure.
          4.  Threshold & Error Trade-offs (The Value Hand-off).
          5.  Size & Marginal Gain.
      *   *The Three Cases:*
          1.  *Jury 12->8, Unanimity->7/8:* Size down (bad for CJT), Threshold down (bad for defendants, good for conviction rate). Independence okay. Competence okay. *Verdict:* Accuracy likely drops, Error ratio shifts. Hand-up on ratio.
          2.  *Citizen Assembly 100:* Binary? Yes (Site A vs B). Competence? Briefing helps. Independence? Shared briefing creates correlation. Size? 100 is big. *Verdict:* Plausible accuracy gain, but watch correlation.
          3.  *Juror Discussion:* Independence violation? Yes. Competence gain? Maybe. *Verdict:* Theorem breaks. Need empirical claim about $p$ increase outweighing correlation.

  8.  **Refining the Tone and Format:**
      *   Needs to be "handout ready."
      *   Bold headings.
      *   No citations.
      *   Mark judgment calls.
      *   Ensure the "Footnote" is sharp.

  9.  **Self-Correction/Review during drafting:**
      *   *Critique:* Did I distinguish Independence from Communication clearly?
      *   *Fix:* Make sure Step 3 explicitly separates "causal influence" from "statistical correlation."
      *   *Critique:* Is the "Hand-up" on error ratios clear?
      *   *Fix:* Explicitly state that CJT maximizes *overall* correctness, but Unanimity/Majority trades false convictions for false acquittals. That's a moral choice, not a math one.
      *   *Critique:* Case 3 is tricky. The user likes it. The procedure needs to challenge it without banning it.
      *   *Fix:* Frame it as "Theorem Inapplicable." It moves from Aggregation to Deliberation. The justification must be about *competence enhancement*, not *vote aggregation*.

  10. **Final Polish:** Check against the "90 minutes" constraint. Is it too complex? Simplify the math talk. Focus on "Red Flags." Ensure the "Cut" section is honest about what we are ignoring (actual data).

  *(Self-Correction on Case 1)*: 12 to 8 is a significant drop. CJT says reliability drops. 7/8 vs 12/12 is a threshold change. 7/8 is 87.5%, 12/12 is 100%. Theorem says lower threshold = higher conviction rate (if $p>0.5$ regarding guilt), but also higher false conviction rate. This is the Type I/II tradeoff.
  *(Self-Correction on Case 3)*: Discussion violates independence. CJT *requires* independence. So CJT cannot justify this. The justification must be non-CJT (e.g., "deliberation improves $p$"). The procedure must flag this as "Theorem does not apply."

  11. **Final Output Generation** (incorporating all constraints).
answer: |-
  **Brainstorming: How the Theorem Breaks (and How It Pretends Not To)**

  Condorcet's Jury Theorem (CJT) says: If voters are independent, competent ($p > 0.5$), and vote on a binary truth, adding voters makes the majority verdict near-certain. Here is how that fails in the wild, including failures that look like features:

  1.  **Competence < 0.5:** If the average juror is worse than a coin flip (due to bias, complexity, or misinformation), adding voters makes certainty of *error* approach 100%. *Deceptive Improvement:* A larger jury of biased people looks more "representative" but is mathematically less reliable.
  2.  **Statistical Dependence:** Votes must be independent *conditional on the truth*. If jurors share a bias, hear the same misleading expert, or influence each other too early, their errors correlate. *Deceptive Improvement:* Deliberation creates consensus. Consensus looks like reliability, but if it's driven by a charismatic foreperson or shared misunderstanding, it's just correlated error.
  3.  **The "Common Interest" Failure:** CJT assumes everyone wants the *same* right answer. If some jurors vote for acquittal to protest the law (nullification) or conviction to ensure safety regardless of evidence, the math breaks. *Deceptive Improvement:* A diverse panel looks like it covers more bases, but if their goals diverge, they aren't voting on "truth."
  4.  **Non-Binary Choices:** CJT requires True/False. Sentencing lengths, site selections with >2 options, or budget allocations are not truth-apt in the CJT sense. *Deceptive Improvement:* Treating a policy preference as a "verdict" allows you to misuse the theorem to claim one policy is "objectively correct."
  5.  **Threshold Trade-offs:** CJT focuses on *overall accuracy* (correct verdicts). It does not distinguish between False Convictions and False Acquittals. Unanimity reduces False Convictions but increases False Acquittals. *Deceptive Improvement:* Claiming a lower threshold is "more accurate" because it yields more verdicts, ignoring *which* errors increase.

  **The Filter: What We Cut for a 90-Minute Review**

  We have no data on our jurisdiction's actual error rates. We cannot measure $p$ (competence). We cannot measure $\rho$ (correlation). We must cut any step requiring empirical measurement of accuracy.

  *   **Cut:** Direct competence testing. We cannot know if jurors are actually $>0.5$. *Loss:* We must rely on a *plausibility assumption* (e.g., "adults under oath are better than chance"). If a proposal suggests members are systematically misinformed, we flag it, but we cannot prove it.
  *   **Cut:** Ex-post verdict probability. We cannot say "This specific defendant is likely guilty." *Loss:* We can only evaluate the *rule's* reliability in advance.
  *   **Cut:** Optimal group size calculation. We cannot calculate the exact $n$ needed for 95% reliability. *Loss:* We can only say "larger is better *if* independence holds" or "shrinking risks reliability."

  **What Survives:** Structural checks. We can detect *sources* of dependence (shared briefing, deliberation rules), *incentives* against truth (political pressure), and *category errors* (non-binary choices). We can also identify where the math stops and moral trade-offs begin (error ratios).

  ***

  # COMMITTEE DECISION PROCEDURE: ACCURACY DEFENSIBILITY
  **For:** Standing Review Committee on Public Decision-Making
  **Time Limit:** 90 Minutes per Proposal
  **Goal:** Determine if a proposed rule change is defensible *on accuracy grounds* using collective decision theory.

  ### **STEP 1: THE TRUTH-APTNESS CHECK**
  **Condition Tested:** Binary Choice & Common Interest.
  **Question:** Is the decision a binary judgment on a matter of fact (True/False, Guilty/Not Guilty, Site A/Site B) where all members share the goal of finding the correct answer?
  *   **Sufficient Answer:** Yes. The outcome is verifiable (in principle) and members are sworn/mandated to seek that outcome.
  *   **Red Flag:** The decision involves policy preference, budget allocation, sentencing length, or >2 options. Or, members have conflicting incentives (e.g., elected officials voting on their own districts).
  *   **License:** If **Yes**, proceed to Step 2. If **No**, **STOP**. The Jury Theorem does not apply. Accuracy claims are category errors.
  *   **Judgment Call:** If the choice is binary but "truth" is murky (e.g., "Best Site" based on expert models), treat as truth-apt *only if* the experts agree on the criteria.

  ### **STEP 2: THE COMPETENCE PLAUSIBILITY CHECK**
  **Condition Tested:** Individual Competence ($p > 0.5$).
  **Question:** Is there a defensible reason to believe the average member is more likely to be right than wrong, *before* aggregation?
  *   **Sufficient Answer:** Members have relevant training, access to evidence, or are general adults under oath (the "random voter" baseline).
  *   **Red Flag:** The proposal admits members are laypeople deciding highly technical issues *without* expert mediation, or members are selected for bias (e.g., "victim advocates only" for guilt determination).
  *   **License:** If **Yes**, assume $p > 0.5$ for the sake of the theorem. If **No**, **STOP**. Adding voters amplifies error.
  *   **Note:** We are not measuring actual $p$. We are checking for systemic reasons $p$ would be $< 0.5$.

  ### **STEP 3: THE INDEPENDENCE STRUCTURE CHECK**
  **Condition Tested:** Statistical Independence.
  **Question:** Does the proposal introduce or remove mechanisms that cause votes to correlate *independent of the truth*?
  *   **Sufficient Answer:** Members review evidence separately; voting is secret; no causal influence before the vote.
  *   **Red Flag:** Mandatory deliberation before voting; shared "briefing packets" that summarize rather than present evidence; public voting; hierarchical pressure (subordinates voting after supervisors).
  *   **License:**
      *   If the proposal **increases dependence** (e.g., adds deliberation): The Theorem's guarantee weakens. You must argue that the *gain in competence* ($p$) outweighs the *loss of independence*. (See Case 3).
      *   If the proposal **decreases dependence** (e.g., isolates jurors): The Theorem applies more strongly.
      *   If **High Correlation** is structural (e.g., all members read the same 200-page summary): Acknowledge that $N$ (group size) yields diminishing returns. 100 correlated voters $\neq$ 100 independent voters.

  ### **STEP 4: THE THRESHOLD & ERROR TRADE-OFF**
  **Condition Tested:** Decision Rule (Majority vs. Unanimity).
  **Question:** Does the change alter the voting threshold (e.g., Unanimity to 7/8)?
  *   **Sufficient Answer:** The proposal acknowledges the trade-off.
  *   **Red Flag:** Claiming a lower threshold is "more accurate" without specifying *which* errors are reduced.
  *   **License:**
      *   **Majority Rule:** Maximizes *overall* correctness (True Positives + True Negatives).
      *   **Unanimity/High Threshold:** Reduces False Positives (e.g., Wrongful Conviction) but increases False Negatives (e.g., Wrongful Acquittal).
      *   **Hand-Up:** If the proposal changes the threshold, **we cannot rule on accuracy alone.** CJT says majority is best for *total* accuracy. But society may value avoiding False Positives more. **This is a value judgment.**
      *   **Recommendation Language:** "The proposed threshold shift alters the ratio of Type I to Type II errors. The Jury Theorem favors the rule that maximizes total correct verdicts (usually majority). However, the acceptable ratio of wrongful convictions to acquittals is a moral/political determination outside the scope of accuracy analysis. We defer to the Commission on the value trade-off."

  ### **STEP 5: THE SIZE MARGINALITY CHECK**
  **Condition Tested:** Group Size ($N$).
  **Question:** Does changing the number of members materially affect reliability given Steps 2 & 3?
  *   **Sufficient Answer:** If Independence holds, Larger $N$ = Higher Reliability. Smaller $N$ = Lower Reliability.
  *   **Red Flag:** Claiming "100 members is obviously better than 7" without addressing Independence (see Step 3). Or claiming "12 is unnecessary, 6 is enough" without quantifying the reliability drop.
  *   **License:**
      *   If shrinking $N$: State that reliability *mathematically decreases* assuming $p > 0.5$ and Independence.
      *   If expanding $N$: State that reliability increases, *but* check for diminishing returns due to correlation (Step 3).
      *   **Stop Point:** We cannot calculate *how much* reliability changes. We can only indicate direction.

  ***

  ### **LIMITATIONS FOOTNOTE (Paste into all Recommendations)**
  > *This review evaluates structural defensibility based on formal decision theory (specifically Condorcet's Jury Theorem and its extensions). It does not measure actual jurisdiction accuracy, as we lack empirical data on error rates. It assumes members act in good faith toward a common truth. It distinguishes between ex-ante rule reliability and ex-post verdict probability; we certify the former, not the latter. Where proposals involve trade-offs between types of error (e.g., conviction vs. acquittal rates), this Committee identifies the mathematical consequence but defers to the Commission on the moral weighting of those errors.*

  ***

  ### **APPLICATION TO CURRENT PROPOSALS**

  #### **Case 1: Criminal Jury (12 $\to$ 8 members; Unanimity $\to$ 7/8)**
  *   **Step 1 (Truth):** Pass. Guilt is binary.
  *   **Step 2 (Competence):** Pass. Assume jurors $>0.5$.
  *   **Step 3 (Independence):** Pass. Standard isolation rules apply.
  *   **Step 4 (Threshold):** **FLAG.** Moving from 12/12 (100%) to 7/8 (87.5%) lowers the bar.
      *   *Math:* Lowering the threshold increases the rate of *verdicts* (fewer hung juries) and increases the conviction rate (assuming $p_{guilt} > 0.5$).
      *   *Accuracy:* Total accuracy might go up (fewer hung juries = more correct resolutions), BUT the distribution of error shifts toward False Convictions.
      *   *Ruling:* **Hand-Up.** "The proposal likely increases the total number of verdicts reached. However, it mathematically increases the risk of wrongful conviction relative to wrongful acquittal. The Jury Theorem favors majority rule for total accuracy, but the specific threshold (7/8 vs 12/12) determines the acceptable risk of imprisoning the innocent. This is a value judgment for the Commission."
  *   **Step 5 (Size):** **FLAG.** Shrinking 12 $\to$ 8 reduces reliability *ceteris paribus*.
      *   *Ruling:* "Reducing group size decreases the 'swamping' of individual error. While 8 is sufficient for a majority rule to function, 12 provides a larger buffer against random incompetence. Accuracy is theoretically lowered by the size reduction, partially offset by the lower threshold ensuring more verdicts."
  *   **Final Rec:** Defensible on *efficiency* (more verdicts), not pure *accuracy* (higher error risk). Commission must accept the error trade-off.

  #### **Case 2: Citizen Assembly (100 members; Shared Briefing; Site A vs B)**
  *   **Step 1 (Truth):** Pass. "Best Site" is treated as binary truth based on expert criteria.
  *   **Step 2 (Competence):** **JUDGMENT CALL.** Laypeople reading technical briefs.
      *   *Analysis:* If the briefing is clear, $p > 0.5$. If the briefing is biased or too complex, $p$ drops.
      *   *Ruling:* Plausible, provided the briefing is vetted for neutrality.
  *   **Step 3 (Independence):** **FLAG.** "Same two-hundred-page expert briefing packet."
      *   *Analysis:* This creates *common source bias*. If the packet has an error, all 100 voters make the same error. They are not independent.
      *   *Ruling:* "Reliability gains from $N=100$ are diminished by correlation. 100 voters reading the same text act more like 10 voters reading the text. The proposal should consider whether members receive *varied* expert testimony to preserve independence."
  *   **Step 4 (Threshold):** Pass (Assume Majority).
  *   **Step 5 (Size):** Pass. 100 is large, but see Step 3.
  *   **Final Rec:** Conditionally Defensible. Accuracy depends on the neutrality of the briefing. The Committee recommends adding a step where members hear *adversarial* expert testimony to break correlation.

  #### **Case 3: Juror Discussion During Trial (With Judge Present)**
  *   **Step 1 (Truth):** Pass.
  *   **Step 2 (Competence):** **ARGUMENT.** Proponent claims $p$ increases (group catches errors).
  *   **Step 3 (Independence):** **FAIL.**
      *   *Analysis:* Discussion *creates* causal dependence. Juror A influences Juror B. This violates the core independence condition of the Jury Theorem.
      *   *Ruling:* **Theorem Inapplicable.** You cannot use Condorcet to justify this. Condorcet assumes no talking.
      *   *The "Overconfidence" Check:* You argue $p$ goes up enough to offset the loss of independence.
      *   *Required Evidence:* To defend this on accuracy grounds, you must prove: $\text{Gain in } p \text{ (from discussion)} > \text{Loss in Reliability (from correlation)}$.
      *   *Who Collects Evidence:* This requires empirical data from pilot programs or other jurisdictions. We cannot derive this from first principles.
  *   **Final Rec:** "This proposal moves from an *aggregation* model (Jury Theorem) to a *deliberative* model. The Jury Theorem cannot evaluate this change because it prohibits the very mechanism (discussion) being proposed. Accuracy claims must be supported by empirical evidence that deliberation improves individual competence ($p$) sufficiently to outweigh the loss of statistical independence. Without such data, the accuracy impact is unknown."

  ***

  **INSTRUCTOR NOTE TO SELF (Judgment Calls):**
  1.  **Independence vs. Deliberation:** I am holding the line that CJT *requires* independence. If you want deliberation, you are no longer doing CJT. You are doing *Deliberative Epistemology*. This forces the proponent to change their argument from "Theorem says..." to "Evidence shows..."
  2.  **Error Ratios:** I am explicitly washing my hands of the Unanimity vs. Majority moral fight. The math says Majority maximizes *total* correct verdicts. If the state cares more about False Acquittals than False Convictions, that is not math. Make the Commission own that.
  3.  **The "We Can't Tell" Verdict:** In Case 3, if the honest verdict is "We can't tell," say it. Do not pretend the theorem covers deliberation. It doesn't. The evidence needed is empirical (social psychology), not formal (logic). That is outside our 90-minute lane.
