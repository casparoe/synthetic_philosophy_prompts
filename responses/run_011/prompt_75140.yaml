      *   **Constraint:** Do *not* summarize Berkeley's economics. Focus on the logic of the argument provided.
      *   **Task:** Identify the defective step, explain why it looked acceptable, provide a reading where premises are true but conclusion false, assess the cost of rejecting the step, compare alternative theories (metallist, chartalist, quantity theory), and decide if the argument is actually sound (forcing acceptance of 6).
