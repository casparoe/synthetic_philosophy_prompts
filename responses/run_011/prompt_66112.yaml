  A demonstration of **backward masking at the neural level** that correlates perfectly with report but dissociates from conscious access (e.g., a "no-report" paradigm where the neural signature of the color change is absent until after the motion integration, yet the subject can still discriminate the first dot's features unconsciously). If we could show a neural state that carries the "Red" information *phenomenally* but is subsequently overwritten *before* it can influence the motion report, it would force a revision of $C_4$. However, distinguishing "phenomenal carrying" from "information availability" remains the bottleneck.

