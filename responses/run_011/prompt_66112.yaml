  My credence in P hinges on the "Marker Problem." If one could establish a theory-neutral criterion for when a neural state becomes *phenomenal* (rather than merely *functional* or *dispositional*), the Orwellian/Stalinesque distinction would become empirically tractable. My low assignment (0.35) reflects the view that any such criterion inevitably smuggles in assumptions about the very timing it seeks to measure.

