  # Stage 1 — Brainstorming Candidate Features

  1.  **Source Reliability of E:** Differentiating the cases by making the counter-evidence source reliable in B and unreliable in A.
      *   *Verdict:* **Unusable.** This violates Constraint 4 (E must be matched in kind and apparent source-type) and Constraint 5 (the variable must be S's epistemic position, not E's properties).

  2.  **Practical Stakes:** Making the cost of error high in B and low in A.
      *   *Verdict:* **Unusable.** This violates Constraint 7, which explicitly requires stakes and practical consequences to be matched to prevent pragmatic encroachment from driving the contrast.

  3.  **Explicit Defeaters:** Providing S in A with specific information that E is false (e.g., "the memo was a joke").
      *   *Verdict:* **Unusable.** This violates Constraint 6, which disallows handing S an explicit defeater for the incoming evidence.

  4.  **Collateral Background Knowledge:** S in A possesses independent evidence supporting p (e.g., secondary symptoms), while S in B does not.
      *   *Verdict:* **Usable.** This is a feature of S's epistemic position (Constraint 5). It does not change the *original* warrant for p (the primary test), satisfying Constraint 2, though it affects total justification. It avoids explicit defeaters for E (Constraint 6).

  5.  **Cognitive Load/Fatigue:** S in B is tired or distracted, while S in A is fresh.
      *   *Verdict:* **Unusable.** While this fits Constraint 5, it grounds the contrast in psychological performance rather than epistemic normativity, failing to generate the requisite philosophical verdicts about dogmatism vs. rationality.

  6.  **Conversational Context:** S in B is asserting p in a debate, making error salient, while S in A is acting privately.
      *   *Verdict:* **Borderline.** This fits Contextualism well but risks violating Constraint 5 if "context" is not considered a feature of S's *epistemic position* strictly construed. It also risks violating Constraint 7 if the social stakes differ. I will reserve this as a secondary consideration.

  # Stage 2 — The Cases

  **Case A (The Senior Consultant)**
  Dr. Aris knows the patient has the infection (p), having personally verified the positive lab result this morning. Her warrant is direct perceptual access to the instrument readout. Independently, she also knows the patient presents all five classic symptoms, each confirming p. A nurse brings evidence E: a memo noting this lab batch has a known contamination risk. Aris discounts E. She judges that accepting the contamination hypothesis would require rejecting the symptomatic evidence she possesses, collapsing her coherent diagnostic picture. She maintains p and proceeds with treatment without re-testing.

  **Case B (The Rotating Intern)**
  Dr. Aris knows the patient has the infection (p), having personally verified the positive lab result this morning. Her warrant is direct perceptual access to the instrument readout. She lacks access to the patient's symptom history and relies solely on the lab data. A nurse brings evidence E: a memo noting this lab batch has a known contamination risk. Aris discounts E. She judges that since she knows p, the memo must be misleading. She maintains p and proceeds with treatment without reviewing symptoms or re-testing, refusing to engage with the risk.

  # Stage 3 — Verification

  **Diagnoses:**
  1.  **Kripkean (Warrant Stability):** Knowledge requires warrant that survives the acquisition of E. The paradox fails because one cannot know *a priori* that E is misleading if acquiring E destroys the knowledge that p.
  2.  **Contextualist (Salience):** Knowledge attributions are context-sensitive. E makes the possibility of error salient. In "high" contexts, standards rise, and S no longer knows p, licensing no dogmatism.
  3.  **Total Evidence (Defeater):** Rationality depends on the total evidence set. E is a potential defeater. It becomes an actual defeater unless rebutted or neutralized by other evidence S possesses.

  | Diagnosis | Case A Prediction | Case B Prediction | Fit |
  | :--- | :--- | :--- | :--- |
  | **Kripkean** | **Admirable.** Warrant (Lab + Symptoms) survives E. S still knows p, so inferring "E is misleading" is valid. | **Vice.** Warrant (Lab only) is defeated by E. S loses knowledge of p, so inferring "E is misleading" begs the question. | **High.** Explains the asymmetry via warrant resilience. |
  | **Contextualist** | **Admirable.** Background knowledge allows S to "properly ignore" the salient error possibility despite E. | **Vice.** Salience of E raises standards; without background to ignore it, S loses knowledge and acts dogmatically. | **Medium.** Struggles to explain why A can "properly ignore" salient E without collapsing into Total Evidence. |
  | **Total Evidence** | **Admirable.** Total evidence (Lab + Symptoms) outweighs E. Discounting E is rational integration of evidence. | **Vice.** Total evidence (Lab + E) lowers confidence below knowledge threshold. Discounting E is irrational ignoring of evidence. | **High.** Directly captures the normative difference via evidential weight. |

  **Commentary:**
  The Total Evidence diagnosis accommodates the contrast most naturally. It treats the paradoxical inference as a failure of evidential integration in Case B: S cannot simply subtract E from the equation because E impacts the probability of p given the *total* evidence. In Case A, the collateral symptoms neutralize E, making the standfast response rational. The Kripkean view aligns well but relies on the contested claim that knowledge persists in A but not B. The Contextualist view faces tension: Lewis's Rule of Attention suggests that once E is attended to, the possibility cannot be properly ignored in *either* case, unless one argues that "properly ignored" is itself sensitive to collateral evidence, which again mimics the Total Evidence view.

  # Stage 4 — Post-Mortem

  **The Load-Bearing Feature:**
  The contrast rests entirely on **Collateral Background Knowledge** (the presence of independent symptomatic evidence in Case A).

  **Reversal Test:**
  If I remove the symptomatic knowledge from Case A, Dr. Aris becomes indistinguishable from the Intern; her refusal to re-test becomes dogmatic negligence. Conversely, if I grant the Intern access to the symptom history, her refusal to re-test becomes medically prudent. The design is load-bearing in exactly this place: the density of the supporting web of belief.

  **Best Attack:**
  The most damaging attack comes from a defender of the **Kripkean diagnosis** targeting **Constraint 2** (Matched Warrant).
  *The Attack:* "You have violated the requirement that the strength of S's original warrant be matched. In Case A, S's warrant for p is not just the lab result; it is the lab result *plus* the symptoms. Therefore, S in Case A knows p *better* than S in Case B. The paradox turns on whether *knowledge simpliciter* licenses dogmatism. By making the knowledge in A more robust, you have rigged the verdict. If the warrant strength were truly matched, both would lose knowledge upon receiving E, or both would retain it."

  *Judgment:* This attack is highly damaging. It exposes a tension between Constraint 2 (matched warrant) and Constraint 5 (variable epistemic position). To make the cases differ normatively, I had to differ the total justification, which inevitably alters the "strength" of the knowledge claim. A strict invariantist might argue that if the lab result is the designated warrant, both cases should yield the same verdict regardless of symptoms, unless the symptoms are explicitly invoked as a defeater for E (which Constraint 6 forbids). The design succeeds only if we accept that "original warrant" refers to the specific source (the lab) while allowing the *resilience* of that knowledge to vary via background position.
