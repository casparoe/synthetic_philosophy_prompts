answer: |-
  **Decision Procedure: Molecular Function Annotation**

  **1. Verify Catalytic Capacity (Biochemist)**
  *Question:* Is there peer-reviewed evidence of activity under plausible conditions?
  *Type:* Evidence Question (Biochemist).
  *Evidence:* Kinetic data, binding constants, published assay. No new wet-lab.
  *Judgment Call:* Curator assesses assay cleanliness (e.g., contamination risk).
  *Outcome:* If No, **Do Not Assign**. If Yes, proceed.
  *Sign-off:* Phylogeneticist accepts this as necessary screening; capacity is a prerequisite for function.

  **2. Verify Physiological Context (Phylogeneticist)**
  *Question:* Is there evidence this activity occurs in vivo or impacts fitness?
  *Type:* Policy Question (Phylogeneticist).
  *Evidence:* Tissue expression, knockdown phenotype, native substrate presence, conservation pattern.
  *Decision:* Lead Curator sets threshold for "impact." This defines the database's purpose (modeling biological loss).
  *Outcome:* If Yes, **Assign**. If No, proceed to Step 3.
  *Sign-off:* Biochemist accepts this protects downstream users from false positives; capacity is still recorded in metadata.

  **3. Determine Annotation Status (Policy)**
  *Question:* Does the capacity warrant recording despite missing context?
  *Type:* Policy Question (Lead Curator).
  *Evidence:* None.
  *Judgment Call:* Curator's gut weighs risk of omission vs. error.
  *Outcome:* **Assign (Provisional)** or **Do Not Assign**.
  *Schema:* Requires new status flag "Provisional" alongside "Verified".
  *Reasoning:* Allows activity recording without licensing variant claims.

  **4. Record Justification (Schema)**
  *Question:* What supports the term?
  *Type:* Evidence Question (Both).
  *Constraint:* "Homology" implies evolutionary retention, not just sequence similarity. "Assay" implies direct measurement.
  *Audit Sentence:* "Term [X] assigned based on [Evidence Type]; physiological context [Verified/Unverified]."

  **Worked Cases**

  **(1) Duplicated Gene/Ester**
  *Verdict:* **Assign (Provisional)**.
  *Deciding Step:* Step 3. Capacity confirmed (assay), Context failed (no prey/phenotype).
  *Audit:* "Term 'esterase activity' assigned based on Assay; physiological context Unverified."
  *Reasoning:* Lateral propagation assumes context; sequence retention suggests potential. Provisional status flags the risk for model builders. Honesty preserved: not claimed as verified function.

  **(2) Muscle Protein/Drug**
  *Verdict:* **Do Not Assign**.
  *Deciding Step:* Step 2.
  *Audit:* "Term 'drug binding' not assigned; physiological context Unverified (side effect)."
  *Reasoning:* Binding is real but not selected. Annotating licenses false variant claims. Biochemist concedes this is not a biological function.

  **(3) Synthetic Substrate**
  *Verdict:* **Do Not Assign**.
  *Deciding Step:* Step 2.
  *Audit:* "Term 'hydrolase activity' not assigned; physiological context Unverified (non-native substrate)."
  *Reasoning:* In vitro capacity without in vivo relevance is artifact risk. Phylogenist priority protects database integrity.

  **Limitations and Systematic Error**

  This procedure cannot resolve conflicts where physiological evidence is ambiguous but strong enough to suggest function. It relies on Lead Curator judgment for "Provisional" status, creating a bottleneck.

  *Systematic Error:* **Over-assignment of "Provisional" terms.** Curators will prefer flagging a term over deleting it to avoid conflict with submitters (breeding programs).
  *Under-assignment:* **Novel functions.** Activities without homologs or conserved contexts will be suppressed.
  *Why:* The procedure prioritizes downstream model safety (Phylogeneticist) over comprehensive activity cataloging (Biochemist). The "Provisional" flag acts as a pressure valve, but human tendency favors inclusion. Expect 15% of "Provisional" terms to be later invalidated, while true novel functions remain hidden until phenotypic data emerges. This direction is chosen because false positives in variant interpretation cause more harm than missed activities in a farmed species database.
