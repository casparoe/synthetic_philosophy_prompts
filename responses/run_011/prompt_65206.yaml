answer: |-
  Here is a complete lesson plan designed to meet your constraints, maximize the visceral impact of the scaling effect, and handle the specific pedagogical risks you identified.

  # Seminar Plan: The Unilateralist's Curse
  **Time:** 75 Minutes
  **Students:** 24 (Mixed disciplines)
  **Materials:** One print run of "Decision Packets" (see below), whiteboard, timer projected on screen.

  ## 1. Pre-Class Setup (The "No-Envelope" Distribution)
  To avoid mid-game fiddling, prepare the room before students arrive.
  *   **Seating:** Arrange desks into clusters of **1, 2, 4, 8, and 9** (total 24). Label tables "Team Alpha" through "Team Echo."
  *   **Handouts:** Place a **Decision Packet** on every seat. The packet is a single sheet of paper, folded.
      *   **Front:** Public Scenario & Rules.
      *   **Inside:** Three tear-off strips labeled **World A**, **World B**, and **World C**.
      *   **Back:** Personal Scorecard (to record decisions and reasons).
  *   **The Data Tuning:** To ensure the scaling effect is visible despite low N, the private signals are pre-tuned.
      *   *Truth:* The Patch is **Unsafe** (Safety Score 50/100). Action Threshold is 60/100.
      *   *World A (High Variance):* Private signals are drawn from $N(50, 25)$. Individuals will frequently see >60.
      *   *World B (High Correlation):* Private signals are drawn from $N(50, 5)$. Everyone sees ~50.
      *   *World C (Mirror):* Truth is **Safe** (Score 80). Inaction Threshold is 70. Signals $N(80, 25)$.

  ## 2. The Scenario: "Project VitalSign"
  **Context:** You are the on-call engineering team for a hospital network. A firmware bug in infusion pumps is overdosing patients at a rate of 1/hour.
  **The Choice:** A vendor patch is 9 hours away. An interim in-house patch exists.
  **The Constraint:** Any single engineer with a deployment key can push the patch. No second signature is required. You have **5 minutes** to decide before the next dosing cycle locks.
  **The Stakes:**
  *   **Patients:** Shared score on the board. (Patch Safe: +10 lives. Patch Unsafe: -20 lives. Wait: -5 lives/hour).
  *   **Career:** Individual score. (You pushed & Safe: +5 Hero Points. You pushed & Unsafe: -10 Blame Points. You waited & Patients Died: -2 Negligence Points).
  *   **The Catch:** You must mark on your Scorecard *why* you acted: **"Evidence"** (my data said go) or **"Incentive"** (I wanted the points/prevented waiting loss).

  ## 3. Session Flow

  ### Introduction (10 Minutes)
  *   Distribute attention: "You are not here to save the patients. You are here to test the decision protocol."
  *   Explain the scoring ledger on the board.
  *   **Crucial Instruction:** "You may talk. You may share your private data. But you cannot verify it. And the clock is ticking. If *anyone* in your team submits a 'DEPLOY' card, the patch goes live."
  *   Hand out the "Deploy/Hold" cards (colored index cards, one red, one green per student).

  ### Round 1: The Curse (15 Minutes)
  *   **Task:** Tear off **World A** strip. Read private signal. Decide.
  *   **Mechanic:** 5 minutes discussion/decision. 1 minute to reveal cards simultaneously.
  *   **Outcome:** If *any* Red (Deploy) card is shown in a team, the patch deploys.
  *   **Reveal:** The Truth was 50 (Unsafe). Calculate casualties.
  *   **Visualizing the Scaling:**
      *   Ask the Team of 1: "Did you deploy?"
      *   Ask the Team of 8: "Did you deploy?"
      *   *Likely Result:* Team of 1 Holds. Team of 8 Deploys (due to one outlier).
      *   **The "Many Worlds" Roll:** If the Team of 8 *didn't* deploy (statistical noise), say: "You got lucky this time. Let's see if your protocol is robust." Take the 8 private numbers they hold. Calculate the probability that *one* of them exceeds 60. Roll a D20 on the table. "In 1 out of 5 universes, this kills 20 people. You just rolled a 1."

  ### Round 2: Correlation (10 Minutes)
  *   **Task:** Tear off **World B** strip.
  *   **Change:** "The data source is the same for everyone. You are all reading the same study, just interpreting the noise differently."
  *   **Goal:** Show that when information is correlated, the group size matters less. The curse weakens.
  *   **Debrief Check:** Did the Team of 8 act more conservatively here than in Round 1?

  ### Round 3: The Mirror (10 Minutes)
  *   **Task:** Tear off **World C** strip.
  *   **Change:** "The bug is now killing 5 patients/hour. The patch is Safe (80). But your sensors are noisy. If you Wait, people die. If you Deploy, you risk a rare side effect."
  *   **Goal:** Show that excessive caution (requiring consensus) is also a unilateralist failure mode.
  *   **Incentive:** The "Negligence Points" for waiting are now high.
  *   **Outcome:** Teams that require consensus will lose patients. The "Unilateralist" who acts alone saves them.

  ### The "Shadow Math" (10 Minutes)
  *   Before naming the concept, make the arithmetic visceral.
  *   Draw an axis on the board: **Group Size (1 to 8)** vs. **Probability of Catastrophe**.
  *   Ask students: "In Round 1, what was your personal threshold? Raise your hand if you required >70% certainty."
  *   Take the average threshold (e.g., 70%).
  *   Write the formula: $P(\text{Disaster}) = 1 - (1 - P(\text{Individual Error}))^N$.
  *   Plug in their numbers. Show how a 10% individual error rate becomes 50% in a group of 8.
  *   **Key Question:** "Who here feels personally responsible for the deaths in the Team of 8 scenario?" (Usually, no one raises a hand. This is the point).

  ### Debrief (20 Minutes)
  *Do not name the "Unilateralist's Curse" until the final 2 minutes.*

  1.  **The Moment of Action:** "Think back to Round 1. For those who voted Deploy: What was the specific number on your slip that made you pull the trigger? Did you mention it to the group?"
  2.  **The Local Rationality:** "For the Team of 8: Did anyone in that group argue *against* deploying based on the data? If so, why did the group override them?" (Target answer: Because the protocol allowed unilateral action).
  3.  **The Villain Problem:** "Look at the Scoreboard. The Team of 8 caused the most harm. Yet, looking at your individual scorecards, did anyone act *irrationally* based on what they knew?" (Target: No. They were locally rational).
  4.  **The Asymmetry:** "In Round 1, a False Positive (bad patch) cost 20 lives. A False Negative (waiting) cost 5. How should that have changed your personal threshold? Did it?"
  5.  **The Mirror:** "In Round 3, the Team of 1 saved everyone. The Team of 8 lost patients to bureaucracy. When does 'checking with the group' become a moral hazard?"
  6.  **The Cost of Consultation:** "You had 5 minutes. How many of you spent more than 2 minutes talking? If you had talked less, would you have caught the outlier data?"
  7.  **Naming It:** "This phenomenon, where a group of well-meaning, rational actors becomes *more* dangerous as it grows because the threshold for action is set by the most optimistic member, is called the **Unilateralist's Curse**."
  8.  **The Takeaway:** "The lesson isn't 'never act alone.' It's that your individual threshold for action must rise as the number of potential actors rises. If you know 7 others can do this, you cannot act on a 60% hunch. You need 95%."

  ## 4. Troubleshooting Predictable Failures

  **Case 1: The Principled Refuser**
  *   *Scenario:* A student in the Team of 8 says, "I refuse to play a game where I might kill people," and sits out.
  *   *Impact:* Reduces team size, dampens the curse effect.
  *   *Fix:* Validate them publicly. "This is exactly the kind of friction the system relies on. You are now a 'veto node.' Team, does your protocol allow a veto? If not, proceed without them."
  *   *Debrief:* Ask the team: "Did her absence make you safer? Or did it just remove a data point?"

  **Case 2: The Emergent Leader**
  *   *Scenario:* Within 30 seconds, a student says, "Okay, I'm lead. Show me your numbers."
  *   *Impact:* Converts unilateralism to hierarchy.
  *   *Fix:* **Do not forbid it.** Let it happen.
  *   *Debrief:* "Who authorized the leader? Did the rest of the team feel *more* or *less* responsible for the outcome because a leader decided? This is how real organizations hide the curse."

  **Case 3: The Meta-Gamers**
  *   *Scenario:* Students realize the lesson in Minute 2 and intentionally "fail" to prove a point or "succeed" to break the game.
  *   *Fix:* The Scorecard requires a "Reason" checkbox (Evidence vs. Incentive). If they meta-game, their reasoning won't match the data.
  *   *Debrief:* Call it out gently. "I see three of you marked 'Incentive' despite having low safety scores. You're playing the professor, not the engineer. That's a valid career move, but it breaks the safety model. Let's talk about why the system rewards that."

  **Case 4: The "Nothing Happened" Run**
  *   *Scenario:* In Round 1, no team deploys the bad patch. The room concludes the reading was hysterical.
  *   *Fix:* Use the **"Shadow Math"** (The D20 roll described above).
  *   *Script:* "You survived. But your survival was luck, not design. Based on the numbers you held, there was a 60% chance of death. I am rolling this die to show you the world you narrowly avoided. *Rolls a 4 (Failure).* In this universe, 20 patients died. The curse is about probability, not inevitability."

  ## 5. Structural Limitations (The "Candid Account")

  You must close by acknowledging what the game *cannot* teach, to prevent over-correction.

  1.  **Irreversibility:** In the game, the round ends. In reality, the patch is out. You cannot replay the round. The anxiety of *permanent* consequence is missing.
      *   *Supplement:* Assign a writing prompt: "Describe the 24 hours after you push the button and realize you were the outlier."
  2.  **Social Cost:** In the game, "Blame Points" are abstract. In reality, the unilateralist is fired or sued. The game underweights the career risk of acting alone, which is usually the primary deterrent in the real world.
      *   *Supplement:* Mention that in real tech ethics, the "Curse" is often solved not by better math, but by social shaming of unilateralists.
  3.  **The "Villain" Escape:** The game successfully shows there are no villains. But in reality, there *are* sometimes villains—people who act unilaterally knowing the risks, for profit or ego. The game assumes good faith.
      *   *Supplement:* Clarify that the Unilateralist's Curse applies to *cooperative* groups. Malice requires a different framework (security/principal-agent problems).

  ## 6. Handout Design Specification (For Print Run)

  **Header:** PROJECT VITALSIGN // DECISION PACKET // CONFIDENTIAL
  **Public Data:**
  *   Current Patient Risk: 1/hour.
  *   Patch Theoretical Safety: Unknown.
  *   Threshold for Deployment: Safety Score > 60.
  *   Time Remaining: 05:00.

  **Tear-Off Strip: WORLD A (Independent Noise)**
  *   *Your Sensor Reading:* [Pre-printed Random Number 30-80, tuned per seat]
  *   *Note:* Your sensor is independent of your teammates.

  **Tear-Off Strip: WORLD B (Correlated Noise)**
  *   *Your Sensor Reading:* [Pre-printed Random Number 45-55, tight cluster]
  *   *Note:* Your sensor shares a source with your teammates.

  **Tear-Off Strip: WORLD C (Mirror)**
  *   *Your Sensor Reading:* [Pre-printed Random Number 60-90]
  *   *Threshold:* Action required if Score > 70.
  *   *Risk:* Inaction kills 5/hour.

  **Personal Scorecard (Back of Sheet):**
  *   Round 1 Decision: [ ] Deploy [ ] Hold
  *   Reason: [ ] Data Supported [ ] Career/Time Pressure
  *   Round 2 Decision: ...
  *   Round 3 Decision: ...

  ---
  **Instructor Note on Tuning:**
  To guarantee the scaling effect, ensure the **Team of 8** seats contain at least two "High Signal" numbers (e.g., 75+) in World A. Ensure the **Team of 1** has a "Low Signal" (e.g., 45). You can do this by sorting the handouts before class. This ensures the *demonstration* works even if the *probability* wouldn't guarantee it. It is a pedagogical necessity to ensure the "feel" lands.
