  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**

      *   **Goal:** Teach the "Unilateralist's Curse" (Bostrom et al.) in a 75-minute seminar.
      *   **Context:** Undergraduate ethics of emerging tech. 24 students (CS, Philosophy, Policy, Biology). Previous lecture/reading flopped.
      *   **Core Concepts to Convey:**
          1.  Scale effect (more people = higher chance of outlier action, even if everyone is reasonable).
          2.  Harm by "locally responsible" actors (no villains).
          3.  Asymmetry (false positive vs. false negative costs differ; threshold for action must be higher than individual net-positive).
          4.  Mirror image (caution can also kill; consultation has costs).
      *   **Scenario:** Hospital infusion pump bug. Interim patch available. Any single engineer can deploy. Hard deadline.
      *   **Constraints:**
          *   No TA (instructor alone).
          *   Single print run (no envelope stuffing mid-game).
