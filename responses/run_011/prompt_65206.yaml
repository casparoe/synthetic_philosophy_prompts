      *   *The Scaling Problem:* With 24 students, you can't run enough independent trials of an 8-person team to get statistical significance in one session. One team of 8 might just get "lucky" (all conservative). I need a mechanism to simulate multiple worlds or aggregate data across the class to make the trend visible *during* the session.
