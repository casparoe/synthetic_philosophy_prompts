answer: |-
  **To:** The Animal Welfare Committee
  **From:** The Chair
  **Subject:** Protocol for Evaluating Behavioural Inference Claims (v1.0)

  Colleagues,

  You are right to be skeptical. Inverse Reinforcement Learning (IRL) and similar behavioural inference models operate on a fundamental axiom: *that the observed behaviour is the optimal solution to a hidden motivation.* In mathematical terms, they observe the policy ($\pi$) to infer the reward function ($R$).

  In the field, we know that behaviour is rarely optimal. It is compromised by physics, physiology, history, and ignorance. When a vendor hands us a ranked list derived from accelerometer logs, they are handing us a map of *constraints* disguised as a map of *desires*. Without a mathematician, we cannot audit their code, but we can audit their logic.

  The following procedure is designed to stress-test any vendor claim before it becomes policy. It does not require calculus; it requires ecology.

  ***

  ### The Protocol: Interrogating Inferred Preference

  **Step 1: The Availability Test (Constraint vs. Choice)**
  *   **Question:** Was the alternative resource genuinely available at the moment of choice, with equal access cost?
  *   **Adequate Answer:** The data must show that the animal could have accessed the lower-ranked option with no greater physical effort, risk, or social barrier than the chosen option. If the "preferred" substrate is closer to the food chute, it is not a substrate preference; it is an energy minimization strategy.
  *   **Limit:** If access costs were unequal, the inference is invalid. Stop here.
  *   **⚠️ JUDGMENT FLAG:** Determining "equal access cost" is not mathematical. A dominant animal blocking a pathway is a social constraint that accelerometers cannot see. The committee must decide if the social environment invalidates the choice.

  **Step 2: The State Control Test (Physiology vs. Preference)**
  *   **Question:** Was the animal's physiological state constant across the observation period?
  *   **Adequate Answer:** The vendor must demonstrate that choices were not driven by transient states (e.g., estrus, hunger, thermal stress, injury). An animal choosing shade over sun is not expressing a landscape preference; it is thermoregulating.
  *   **Limit:** If the observation window captures a unique physiological event (e.g., musth, lactation) without normalization, the preference is state-specific, not general.
  *   **⚠️ JUDGMENT FLAG:** Deciding whether a state-driven choice represents a legitimate welfare need (cooling down) or a temporary anomaly (fever behaviour) is a veterinary and ethical call, not a statistical one.

  **Step 3: The History Test (Habit vs. Preference)**
  *   **Question:** Is the behaviour novel, or is it a settled habit from a previous environment?
  *   **Adequate Answer:** The model must account for learning history. If an animal was raised on concrete, choosing concrete is a familiarity bias, not a welfare optimum. True preference inference requires exposure to novelty or a washout period.
  *   **Limit:** If the animal has never experienced the alternative, "preference" is actually "neophobia" or "habit."
  *   **⚠️ JUDGMENT FLAG:** We must judge whether respecting a habit protects the animal from stress or traps it in a sub-optimal existence. Math cannot value "enrichment through novelty."

  **Step 4: The Perception Test (Misapprehension)**
  *   **Question:** Did the animal possess sufficient information to distinguish the options?
  *   **Adequate Answer:** Evidence that the animal investigated both options or has prior knowledge of their properties. IRL assumes the agent knows the rules of the environment. If the animal avoids a substrate because it looks like a threat (e.g., grating resembling a trap), that is fear, not dislike.
  *   **Limit:** If the animal cannot perceive the quality of the resource (e.g., nutritional content vs. taste), the inference is of *immediate reward*, not *long-term benefit*.
  *   **⚠️ JUDGMENT FLAG:** Distinguishing between "the animal doesn't want this" and "the animal doesn't understand this" is impossible from logs alone. It requires keeper knowledge.

  **Step 5: The Welfare Alignment Test (The "Sugar" Problem)**
  *   **Question:** Does the inferred reward function align with long-term biological health?
  *   **Adequate Answer:** The vendor must acknowledge that high confidence in a preference does not equal high welfare. (Analogy: A human prefers sugar to kale; the inference is accurate, the diet is fatal).
  *   **Limit:** If the preference leads to pathology (obesity, arthritis, stereotypy), the committee must reject the preference regardless of statistical confidence.
  *   **⚠️ JUDGMENT FLAG:** **This is the critical step.** No algorithm can weigh short-term behavioural satisfaction against long-term health. This is an ethical veto power reserved solely for the committee.

  ***

  ### Application of the Protocol

  Here we apply the procedure to the two current pending requests.

  #### Case A: The Elephant Herd and the Hard Standing
  **The Claim:** Vendor data shows 95% confidence that the herd prefers the poured concrete hard standing over the natural soil/vegetation substrate (85% occupancy time). Keepers argue this causes foot pathology; vendors argue "the animals choose it."
  **The Data:** Accelerometer logs show less movement on concrete; video shows herd clustering there during midday.

  **Procedure Run:**
  1.  **Availability:** Both substrates are adjacent. Access cost is equal. (Pass)
  2.  **State Control:** Observations peak during midday heat. (Fail: Confound identified).
  3.  **History:** Elephants imported from a facility with predominantly concrete floors. (Fail: Habit confound).
  4.  **Perception:** Elephants can feel the difference. (Pass).
  5.  **Welfare Alignment:** Concrete reduces movement (good for arthritic elders?) but increases pododermatitis risk (bad for long-term health).

  **Analysis:**
  The IRL model has inferred a reward function for *thermal conductivity* and *familiarity*, not *substrate quality*. The elephants are not choosing concrete because it is "better" in a welfare sense; they are choosing it because it is cool and known. The vendor's model treats thermoregulation as a substrate preference. Furthermore, the habit confound means we are measuring where they feel safe, not where they would thrive.

  **Committee Conclusion:**
  We must reject the vendor's recommendation to expand the concrete area.
  **The Unpopular Outcome:** We must recommend removing the concrete, despite the animals' "vote." We are concluding that the animals' expressed preference is a symptom of poor prior husbandry and immediate thermal discomfort, not a guide for future enclosure design. We are effectively overruling the herd's choice for their own long-term physical good. The keepers were right; the data was technically accurate but biologically naive.

  #### Case B: Orangutan Enrichment Ranking
  **The Claim:** Vendor provides a ranked list of enrichment devices. Item #1 (The "Puzzle-Box A") has the highest interaction score. Item #5 (The "Forage-Wall") has low interaction time. Vendor recommends deploying more Puzzle-Box A.
  **The Data:** Interaction time and accelerometer spikes (manipulation).

  **Procedure Run:**
  1.  **Availability:** All items available simultaneously. (Pass).
  2.  **State Control:** Items contain food rewards. (Fail: Hunger drives interaction).
  3.  **History:** Orangutans are neophilic but learn efficiency. (Warning).
  4.  **Perception:** They see the food. (Pass).
  5.  **Welfare Alignment:** Puzzle-Box A releases food in 30 seconds with one lever pull. Forage-Wall requires 20 minutes of extraction.

  **Analysis:**
  The vendor's model optimizes for *interaction frequency*, not *cognitive engagement*. The IRL algorithm infers that the orangutans prefer "high calorie, low effort." This is a valid preference inference (they do prefer easy calories), but it is a welfare failure. The "preference" is for efficiency, which in captivity leads to obesity and boredom. The Forage-Wall, despite lower "preference" scores, likely provides superior cognitive welfare.

  **Committee Conclusion:**
  We must reject the top-ranked item.
  **The Unpopular Outcome:** We will ban Puzzle-Box A for daily use and mandate the Forage-Wall, despite the data showing the animals "dislike" it. We are telling the supplier that their metric (time spent) is a proxy for addiction, not enrichment. This will be unpopular with the supplier (whose product is ranked lower) and potentially the keepers (who will face frustrated animals demanding the easy boxes).

  ***

  ### What This Procedure Cannot Establish

  Even if we apply this protocol with rigour, there are three things we must admit we cannot know:

  1.  **Subjective Valence:** We can distinguish constraint from choice, but we cannot measure *how much* the animal cares. We do not know if the elephant's desire for concrete is a mild preference or a desperate need. We are guessing the magnitude of their frustration when we overrule them.
  2.  **The Counterfactual:** We can only analyse what happened. We cannot know if a different enclosure design would have revealed a *different* preference hierarchy that we have now permanently foreclosed by building to the current data.
  3.  **The Ethical Trade-off:** This procedure helps us identify false preferences. It does not tell us how to weigh conflicting welfare domains. If the elephants prefer the concrete (thermal comfort) but need the soil (foot health), there is no mathematical solution to that trade-off. That remains a moral burden for this committee, and no vendor's confidence interval can absolve us of it.

  Proceed with the votes.

  **Chair, Animal Welfare Committee**
