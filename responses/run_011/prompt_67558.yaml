answer: |-
  1.  **The Unfree/Unable Distinction**
      *   **Motivation:** A person cannot fly by flapping their arms. A theory must not classify physical impossibility or natural limitation as political unfreedom. If a wall falls and blocks a road, that is misfortune; if a guard blocks the road, that is unfreedom.
      *   **Status:** Non-negotiable. Without this, the concept of freedom collapses into power or ability.
      *   **Camp Smuggling:** None. This is a conceptual baseline.

  2.  **The Exercise/Capacity Distinction**
      *   **Motivation:** *The Compliant Tyrant* and *The Benign Algorithm*. In both cases, no actual interference occurs (no orders given, no requests declined). Yet, the subjects exist at the mercy of another's will or system update. A theory must specify whether the *possession* of the power to interfere arbitrarily reduces freedom, or only the *exercise* of that power.
      *   **Status:** Camp-specific.
      *   **Camp Smuggling:** **Negative Liberty** insists only actual interference counts (both cases are free). **Republican Liberty** insists the capacity for arbitrary interference counts (both cases are unfree). If you remove this requirement, you cannot distinguish between a benevolent master and a non-existent master.

  3.  **The Freedom/Worth Distinction**
      *   **Motivation:** *The Contented Local* and ordinary poverty. A person may be legally free to travel but lack the money to buy a ticket. A theory must decide if lacking the means to exercise a right is a reduction of freedom itself, or merely a reduction in the *value* of that freedom.
      *   **Status:** Non-negotiable (for clarity), but the *application* is contested.
      *   **Camp Smuggling:** **Positive Liberty** often smuggles "worth" into "freedom," claiming the poor woman is unfree because she cannot realize her ends. **Negative** and **Republican** theories insist she is free but lacks the resources to make freedom valuable.

  4.  **The Internal/External Source Distinction**
      *   **Motivation:** *The Contented Local*. The woman faces no external blocker, but her internal preferences are shaped by social conditioning. A theory must state whether internal psychological constraints (fear, ignorance, adaptive preferences) count as political unfreedom, or only external interpersonal constraints.
      *   **Status:** Camp-specific.
      *   **Camp Smuggling:** **Positive Liberty** claims internal constraints count (she is unfree because she is not autonomous). **Negative** and **Republican** theories claim only external constraints count (she is free because no one is stopping her). If you remove this requirement, you cannot separate political theory from psychology or therapy.

  5.  **The Status/Event Distinction**
      *   **Motivation:** *The Compliant Tyrant* and *The Benign Algorithm*. Is freedom a momentary snapshot of what is happening now (Event), or a standing relationship between persons (Status)? If the Tyrant dies tomorrow, does the subject become free today?
      *   **Status:** Non-negotiable.
      *   **Camp Smuggling:** None, but **Republican** theory relies heavily on Status (you are unfree even if sleeping), while **Negative** theory often focuses on Events (you are free if not currently stopped). An adequate theory must explicitly choose its temporal unit.

  6.  **The Authorship Condition**
      *   **Motivation:** Ordinary traffic laws. A speed limit imposed by a dictator feels different than one voted on by the residents. A theory must specify whether having a hand in making the rule changes the freedom-status of being bound by it.
      *   **Status:** Camp-specific.
      *   **Camp Smuggling:** **Positive** and **Republican** theories argue authorship matters (self-imposed law is freedom). **Negative** theory argues a law is a law (coercion is coercion, regardless of source). If you remove this, you cannot explain the intuitive difference between tyranny and democracy.

  ***

  **Incompatibility Flag**
  I suspect **Requirement 3 (Freedom/Worth Distinction)** and **Requirement 4 (Internal/External Source Distinction)** cannot be jointly satisfied if the theory aims to capture the intuition that *The Contented Local* is unfree. To classify her as unfree, you must either count her lack of social resources as unfreedom (violating Req 3) or count her internalized conditioning as unfreedom (violating Req 4). A theory that strictly maintains both distinctions must classify her as free, which many find counter-intuitive. A theory that classifies her as unfree must blur the line between freedom, capacity, and autonomy.

  **Key Eliminator**
  **Requirement 2 (The Exercise/Capacity Distinction)** does the most work. It is the single point that forces a choice between Negative Liberty (which requires actual interference) and Republican Liberty (which requires non-domination). It immediately disqualifies any theory that cannot account for why *The Benign Algorithm* might be objectionable despite zero actual declines.

  ***

  **Evaluation**
  Negative liberty satisfies the Unfree/Unable and Freedom/Worth distinctions best but fails *The Compliant Tyrant* and *The Benign Algorithm* because it ignores capacity. Positive liberty handles *The Contented Local* but collapses freedom into autonomy and worth, violating the conceptual distinctions. Republican liberty is the only one that treats *The Compliant Tyrant* and *The Benign Algorithm* as cases of unfreedom without conflating freedom with worth, making it a genuinely distinct third concept rather than a relabelling; however, it struggles to explain why *The Contented Local* is unfree without borrowing from Positive liberty's internal constraints.
