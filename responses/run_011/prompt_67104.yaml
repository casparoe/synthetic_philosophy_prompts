answer: |-
  Good morning.

  I want to start with a single space. A blank character.

  In the standard model of program equilibrium, we imagine two players submitting code instead of moves. My program reads your source. Your program reads mine. If I can verify that you are committed to cooperation, I cooperate. If you defect, I defect. This mechanism turns the Prisoner's Dilemma inside out. It makes trust computable. It makes unconditional cooperation rational.

  But there is a result, a fragility proof, that keeps me up at night. In this scenario, we have two programs designed to cooperate. They are logically identical. They want the same outcome. But one programmer, perhaps by accident, hits the spacebar once at the end of a line. A single whitespace character. A ghost in the machine.

  Because the verification requires an exact match, the programs do not recognize each other. They fail the handshake. They defect. They burn the world down because of a space.

  I am telling you this because this room is built on the tension between that mathematical promise and that syntactic fragility.

  To the game theorists: You have built a beautiful engine. You have shown that if agents can read each other's source code, the tragedy of the commons is not inevitable. You have turned morality into a checkable condition.

  To the organizers: You know that "show me your code" is often a weapon. You know that when the powerful demand transparency from the vulnerable, it is not to establish equilibrium. It is to find a violation. It is to find the space where they can punish you.

  For the last decade, we have been told that the solution to institutional distrust is more data. Open the books. Release the logs. Show your work. But as the organizers in the afternoon session know better than anyone, legibility is not neutral. When you make yourself legible to a system that does not love you, you do not gain protection. You gain a target.

  The game theorists assume inspection is free. In the model, reading the opponent's code costs nothing. It is instantaneous. It is symmetric.

  But in the real world, inspection is a move. It costs time. It costs legal fees. It costs safety. When a mutual-aid group audits a city budget, that is labor. When a legal defense fund opens its records to a state auditor, that is exposure. And crucially, when I look at your code, I tell you what I am looking for. I reveal my vulnerabilities. I hand you my reasoning to mimic, or to exploit. This is the read-only problem. There is no such thing as read-only access in a conflict. To look is to touch. To inspect is to intervene.

  So we are left with the space.

  That single whitespace character represents the gap between the clean logic of the model and the messy noise of the world. In the model, the space breaks the trust. In this workshop, I am asking us to treat the space not as a bug, but as the environment we actually live in.

  The theorists are here to ask: How do we make cooperation robust to noise? How do we write programs that recognize each other even when the formatting is off?

  The organizers are here to ask: Who gets to demand the code? Who bears the cost of the inspection? And what happens when the "program" is a human being who cannot be compiled?

  If we spend two days only talking about the math, we will ignore the power dynamics that make transparency dangerous. If we spend two days only talking about the power dynamics, we will surrender the tools that could make cooperation scalable.

  We need to find a way to build games where the handshake does not fail because of a space. We need to find a way to verify intent without demanding exposure. We need to make inspection cheap enough to be accessible, but costly enough to prevent harassment.

  The math says that if we can see each other perfectly, we can cooperate. The politics says that perfect visibility is a cage.

  So my question for this room, for the theorists in the morning and the organizers in the afternoon, is this:

  How do we design a system where we can trust each other's source code, without ever having to show it?
