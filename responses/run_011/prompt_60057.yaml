answer: |-
  **THE CLARION: STYLE & USAGE MANUAL (14th ED.)**
  **Effective:** 01 October 2023
  **Authority:** Office of the Editor

  **1.0 SYĀDVĀDA IN HEADLINES AND STANDFIRSTS**

  1.1 All copy must adhere to the seven conditional modes of predication (*syādvāda*). Absolute assertions are prohibited unless covered under Section 3.0 (Exemptions).

  1.2 **Above the Fold:** Only Modes 1 (*syād asti* – in some respects, it is) and 2 (*syād nāsti* – in some respects, it is not) are permitted on Page One. Mode 3 (*syād asti nāsti* – in some respects, it is and is not) is permitted only in the standfirst, provided the headline qualifies the subject's location or temporal state.

  1.3 **Banned Modes:** Mode 7 (*syād asti nāsti avaktavya* – in some respects, it is, is not, and is indescribable) is banned from Page One entirely. It is reserved for the Leader Column and Arts Reviews, where ambiguity is commercially viable.

  1.4 **Example:** A headline reading "MINISTER RESIGNS" is incorrect. It must read: "IN SOME RESPECTS, MINISTER RESIGNS" or "IN SOME RESPECTS, MINISTER DOES NOT RESIGN". Subeditors should note that Mode 3 ("IN SOME RESPECTS, MINISTER RESIGNS AND DOES NOT RESIGN") risks confusing the newsstand buyer and should be confined to the interior political pages.

  **2.0 NAYA DESK ALLOCATION AND CONFLICT**

  2.1 Reporting staff are assigned to specific standpoints (*naya*). The Political Desk is divided into the 'Substantial Existence' Bureau and the 'Transitory Phenomena' Bureau.

  2.2 **Conflicting Filings:** Where two reporters file on the same event from conflicting *nayas* by the same deadline, neither story is spiked. Both are published side-by-side under the banner "MULTIFACETED REPORTING".

  2.3 **Resolution:** If the conflicting accounts render the event unintelligible to the average reader, the Night Editor must apply Mode 4 (*syād avaktavya* – in some respects, it is indescribable). The story is then moved to the Website Only feed, where text length is less constrained.

  **3.0 EXEMPTIONS FOR EMPIRICAL ABSOLUTES**

  3.1 **Sports:** Final scores are exempt from *syādvāda*. A match result is binary. However, the performance leading to the score must be qualified. "UNITED WIN 2-1" is permissible; "UNITED PLAYED WELL" must read "IN SOME RESPECTS, UNITED PLAYED WELL".

  3.2 **Court Verdicts:** Legally binding verdicts are stated absolutely. "DEFENDANT FOUND GUILTY" requires no qualification. However, the moral implications of the verdict must adhere to Mode 5 (*syād asti avaktavya* – in some respects, it is and is indescribable).

  3.3 **Obituaries:** This section presents significant difficulty. The fact of death is absolute (see 3.1), but the presence of the deceased is not. Subeditors must ensure copy reads: "MR SMITH DIED YESTERDAY. IN SOME RESPECTS, HE IS STILL PRESENT." Failure to acknowledge the enduring memory constitutes a breach of Section 5.0.

  3.4 **TV Listings:** Programmes are scheduled absolutely. However, the content is subject to interpretation. The 21:00 Drama is listed as "THE CRIME". The synopsis must read: "IN SOME RESPECTS, A CRIME IS COMMITTED. IN SOME RESPECTS, THE NATURE OF THE CRIME IS INDESCRIBABLE." Readers complaining of uncertainty are to be directed to the Radio Times.

  **4.0 AUTHORITY OF THIS DOCUMENT**

  4.1 This Manual is binding on all staff. Subeditors must enforce these rules without exception. Copy deviating from the Seven Modes will be returned to the sender.

  4.1.1 *Note:* This instruction is itself a claim regarding the nature of editorial policy. Therefore, strictly speaking, this instruction is binding only in some respects (*syād asti*). Staff should act accordingly.^1

  **5.0 ETHICAL APPLICATION AND LIBEL**

  5.1 The primary utility of *anekāntavāda* is the prevention of dogmatic error in sensitive reporting. Where two witness accounts contradict irreconcilably, and police evidence is inconclusive, the Doctrine protects the paper from libel actions.

  5.2 **Procedure:** Do not choose one account over the other. Publish both accounts qualified by Mode 3 (*syād asti nāsti*). State: "WITNESS A CLAIMS THE CAR WAS RED. WITNESS B CLAIMS THE CAR WAS NOT RED. IN SOME RESPECTS, THE CAR WAS RED AND NOT RED."

  5.3 **Benefit:** This acknowledges the limitations of human perception without sacrificing the truth of the witnesses' experiences. It reduces litigation costs and aligns with the Jain principle of *ahiṃsā* (non-violence) in speech. Letters praising this approach should be filed under 'P'.

  **6.0 MISCELLANY**

  6.1 **Hyphenation:** Hyphens are used to join compound adjectives, unless the compound describes an indescribable state, in which case a space is preferred to indicate separation of reality.

  6.2 **Crossword:** Clues must not rely on single-definition answers. All answers must be valid in at least two distinct contexts. If a clue admits only one solution, it must be flagged as "Provisional".

  6.3 **Corrections:** Corrections are never absolute. We do not say "We were wrong." We say: "IN SOME RESPECTS, THE PREVIOUS ACCOUNT WAS INACCURATE." This maintains the integrity of the original reporting while acknowledging new information.

  ***

  ^1 *See Section 4.0. If Section 4.0 is only binding in some respects, Section 1.0 may also be optional. Consult the Night Editor.*
