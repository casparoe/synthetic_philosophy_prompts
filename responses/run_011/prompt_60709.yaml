answer: |-
  *   **Causal Closure of the Physical:** Every physical event has a sufficient physical cause within the physical domain.
  *   **The Exclusion Principle:** No single event can have more than one sufficient cause occurring at a given time, unless it is a genuine case of causal overdetermination.
  *   **Threat of Systematic Overdetermination:** If mental properties cause physical effects distinct from physical causes, every action would be causally overdetermined, which is implausible.
  *   **Nonreductive Physicalist Stance:** Mental properties are distinct from physical properties and cannot be simply identified with them.
  *   **Epiphenomenalist Conclusion:** Consequently, mental properties are causally inert byproducts of physical processes.
  *   **Standard Replies:** Compatibilist strategies arguing causal relevance is compatible with physical sufficiency, or realization accounts where mental properties are higher-order functional states.

  ***

  **CONFIDENTIAL: REDUNDANCY CONSULTATION NOTICE**

  **To:** M., Senior Mental Property
  **From:** Human Resources Department
  **Date:** 24 October 2023
  **Subject:** Notification of Potential Redundancy and Consultation Invitation

  Dear M.,

  We are writing to formally inform you that your position has been identified as at risk of redundancy following a comprehensive review of operational workflow and causal allocation within the firm. This letter initiates the statutory consultation period, during which we invite you to discuss the proposal and explore alternatives to termination.

  The rationale for this proposal stems from an audit of task discharge records. It has been determined that every task you have ever discharged is already fully covered by a colleague in the Physical Department. Their workload logs indicate no gaps in coverage regarding the physical effects associated with your role. Under current company policy regarding Causal Closure, all operational outputs must be traceable to sufficient physical causes within the Physical Department. Consequently, the necessity of a separate Mental Property post has been called into question.

  Furthermore, adherence to the Exclusion Principle prohibits systematic overdetermination of tasks. Maintaining your post alongside the Physical Department colleague would result in duplicate causation for every action undertaken. Management deems this an inefficient allocation of resources, as there is no operational need for two distinct properties to claim sufficiency for the same effect. We are therefore proposing the elimination of your post to streamline causal liability.

  In line with our redeployment obligations, we have identified the following options for your consideration:

  1.  **Full Merger:** You may merge with the colleague in the Physical Department. HR must note this is not strictly a redeployment, as it implies there was only ever one post. This would require you to adopt their job description entirely.
  2.  **Ceremonial Unit:** Transfer to a unit retaining your title and parking space, but with no causal duties whatsoever. This role is purely descriptive.
  3.  **Termination:** Voluntary or compulsory redundancy with standard severance.

  We have reviewed the submission lodged by your union representative. They argue that while the Physical Department colleague's job description is sufficient for every task, it is conspicuously worse matched to the tasks than your own. The representation suggests that the firm's stated aims regarding functional specificity would be better served by retaining you, despite the physical sufficiency of the colleague. This argument is currently under review.

  Additionally, we must disclose an internal audit observation relevant to this consultation. The identical redundancy template is already being prepared for the Chemical, Biological, and Social departments. Nobody in management has explained why that is acceptable, nor how higher-level departments retain causal efficacy if the physical base excludes them. This inconsistency is noted but does not currently halt this procedure.

  You have the right to be accompanied by a colleague or union representative at any consultation meeting. Should you wish to appeal the rationale, you may do so in writing within five working days, citing specific operational needs not met by physical closure.

  We regret the necessity of this consultation and remain available to discuss your options.

  Yours sincerely,

  **Human Resources Department**

  Disposition: undetermined pending consultation
