prompt: |-
  You are a professional philosopher who works on formal epistemology and diachronic rationality. Think the case through before answering: first identify, for yourself, which pairs of the commitments below actually interact and what the interaction consists in, and only then give me the audit.

  The package to be audited is my own. I hold:

  1. Conditionalization is the only rational way to revise credences in the light of new evidence.
  2. Van Fraassen's Reflection principle, without restriction: whenever I am certain that at some later time my credence in *p* will be *r*, my credence in *p* now should already be *r*.
  3. The diachronic Dutch book is what shows the force of (2): an agent who knows her future credence will differ from her present one and does not adjust is thereby genuinely irrational, since she can be led into a set of bets she would accept that jointly guarantee her a loss.
  4. In the Sleeping Beauty problem I am a thirder: Beauty's credence in Heads on waking should be 1/3, and her credence on Sunday beforehand is 1/2.
  5. Suppose I volunteer for a procedure that will erase everything I have learned about some question *p* and reset me to my prior of 1/2, while leaving my reasoning powers intact. My present credence, based on substantial evidence, is 0.9. I am certain about the procedure and about the credence it will produce, yet I maintain that holding on to 0.9 now is rational and that dropping to 1/2 now would be a mistake.
  6. Tomorrow I will be walked through a rigorous proof of a conjecture and I am confident I will then believe it; still, I think it would be irrational for me to believe it today, before seeing the proof.

  Which of these pull against one another, and which only look as though they do? Rank the genuine tensions by severity rather than listing them as equally bad; for each, say what would have to be given up or restricted and what I would lose by that revision. Then tell me which single change buys the most consistency for the least cost. I have no idea where the trouble lies and no prior attachment to any item, so do not assume I am protecting one of them. Close by saying how confident you are in your diagnosis and singling out the point you are least sure about.
