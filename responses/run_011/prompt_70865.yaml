          4.  (1) vs. (2) (General tension).
      *   *Resolution:* Drop/Restrict (2).
      *   *Cost:* Loss of a simple diachronic norm. Need a more complex theory of when future credences constrain present ones.
      *   *Confidence:* High. This is a standard result in formal epistemology (Christensen 1991).
      *   *Uncertainty:* The exact formulation of the *restricted* Reflection principle that saves the most intuitions is still debated (e.g., "New Reflection" vs. "Expert Principle").

  8.  **Refining the Output (Self-Correction/Polishing):**
