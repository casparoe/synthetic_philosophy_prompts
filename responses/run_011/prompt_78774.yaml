  *   **Expand:** Section 3 needs a clearer definition of "instrument for measuring pre-treatment risk." The phrase "instrument" has a specific technical meaning (IV) in econometrics/causal inference that might confuse readers. Use "proxy" or "surrogate."
  *   **Section 4, Paragraph 2:** Currently, it does work distinct from Paragraph 1. Paragraph 1 sets up the bias; Paragraph 2 defends against the "just call it a mediator" objection. Keep the *content*, but cut the word count by 30%.

