  $2 \times 2 \times 2 \times 2 = 16$ theoretical combinations.
  **Occupied:** 8 (The Leaves below).
  **Unoccupied:** 8.

  **Three Unoccupied Combinations (and why):**
  1.  **Hybrid + Dynamic + Global + Absence-Negation:** *Incoherent.* If you have a belief component (Hybrid) and a global scope, you generally need a robust negation to handle the belief's contradiction. "Absence" negation fails to capture the contradiction of the belief component.
  2.  **Pure + Static + Global + Absence-Negation:** *Unattractive.* This is the "Simple Expressivism" that dies immediately on the Frege-Geach problem. It cannot explain why "lying is wrong" and "lying isn't wrong" contradict if the second is just nothing. No one defends this; it is the straw man the other views are built to avoid.
  3.  **Pure + Dynamic + Local + Conflicting-Negation:** *Merely Unexplored.* A view where moral sentences update plans (Dynamic), negation is a conflicting plan, but the theory itself is stated in non-plan language (Local). This is unstable: if the theory explains moral language via plans, the theory's own language should arguably be plans (Global). It is philosophically timid and offers no advantage over the Global version.

  ***

  ### Part 2: The Sorting Instrument

  **Instructions:** Start at Node 1. Follow the branch that matches your verdict. Answer based on your intuition about the sentences, not on what you think a theory *should* say.

  **Node 1 (Test Case 9):**
  Consider the sentence: *"Lying is wrong, but I don't disapprove of lying."*
  If you said this seriously, would listeners say you contradicted yourself (like saying "It is raining but I don't believe it"), or would they say you are just describing a gap in your psychology (like "It is raining but I don't care")?
  *   **Contradiction:** Go to Node 2.
  *   **Gap in Psychology:** Go to Node 6.

  **Node 2 (Test Case 6):**
  (For those who see a contradiction). Consider someone who says: *"If lying is wrong, then stealing is wrong,"* while thinking neither is actually wrong.
  When they accept that conditional, are they adopting a *rule* for their feelings (e.g., "I forbid myself to disapprove of lying without disapproving of stealing"), or are they noticing a *link* between two facts?
  *   **Adopting a Rule:** Go to Node 3.
  *   **Noticing a Link:** Go to Node 7.

  **Node 3 (Test Case 1):**
  (For Rule-Adopters). Compare *"Lying is wrong"* and *"Lying isn't wrong."*
  Is the second sentence just the *absence* of the feeling expressed by the first, or is it a *specific, positive* feeling of tolerance?
  *   **Absence:** Go to Node 4.
  *   **Specific Feeling:** Go to Node 5.

  **Node 4 (Test Case 5):**
  (For Absence-View). Consider: *"Either lying is wrong or the train is late."*
  To make sense of this, do you have to say the word "wrong" means something different here than it does in *"Lying is wrong"*?
  *   **Yes, it shifts meaning:** **Leaf A.**
  *   **No, it stays the same:** **Leaf B.**

  **Node 5 (Test Case 4):**
  (For Specific Feeling-View). Compare *"Don't lie!"* and *"Lying is wrong."*
  Do these two sentences tell people to do the exact same thing in the exact same way, or does the second one claim something while the first one gives an order?
  *   **Exact same thing:** **Leaf C.**
  *   **Claim vs. Order:** **Leaf D.**

  **Node 6 (Test Case 2):**
  (For Gap-in-Psychology). Consider: *"There's a 30% chance lying is wrong."*
  Is that 30% uncertainty about how the world is (a fact you might not know), or uncertainty about whether you will end up disapproving (a feeling you haven't settled on)?
  *   **About the World:** **Leaf E.**
  *   **About the Feeling:** **Leaf F.**

  **Node 7 (Test Case 8):**
  (For Link-Between-Facts). Consider the theorist's sentence: *"'Lying is wrong' expresses disapproval of lying."*
  When the theorist says *that* sentence, are *they* expressing disapproval of lying?
  *   **Yes, they are too:** **Leaf G.**
  *   **No, that's just science:** **Leaf H.**

  **Node 8 (Follow-up for Leaf A candidates):**
  If "wrong" shifts meaning in disjunctions, does it also shift meaning in *"It is true that lying is wrong"*?
  *   **Yes:** **Leaf A (Confirmed).**
  *   **No:** Go to Node 9.

  **Node 9 (Follow-up for Leaf B candidates):**
  If "wrong" keeps the same meaning, how do you explain the contradiction in Node 1 without a conflicting state?
  *   **Logic is primitive:** **Leaf B (Confirmed).**
  *   **Give up contradiction:** (Invalid per starting point).

  **Node 10 (Follow-up for Leaf D candidates):**
  (For Claim vs. Order). If "Lying is wrong" is a claim, what is it claiming?
  *   **That I disapprove:** Go to Node 11.
  *   **That lying has a property:** (Exit: Realism - banned).
  *   **Both:** **Leaf D (Confirmed).**

  **Node 11 (Test Case 7):**
  (For 'That I Disapprove'). Consider: *"I used to think lying was wrong."*
  Did you change your mind about a fact (your past psychology), or did you change your feelings?
  *   **Fact about psychology:** **Leaf D (Hybrid variant).**
  *   **Changed feelings:** **Leaf D (Expressivist variant).**

  **Node 12 (Tie-Breaker for Leaf G/H):**
  (For Link-Between-Facts). If the theorist isn't expressing disapproval in Node 7, is their sentence *true*?
  *   **Yes, strictly true:** **Leaf H (Confirmed).**
  *   **True only in a loose sense:** **Leaf G (Confirmed).**

  ***

  ### Part 3: The Leaves

  **Leaf A: Radical Non-Compositionality**
  *   **Strategy Name:** Radical Contextualism.
  *   **Awkward Commitment:** You must admit that moral words change their meaning every time they are embedded in a new sentence structure, making moral logic a series of puns.
  *   **Worst-Handled Sentence:** *"Either lying is wrong or the train is late."* (Makes the sentence unintelligible).

  **Leaf B: Quasi-Realism (Blackburnian)**
  *   **Strategy Name:** Higher-Order Attitude Expressivism.
  *   **Awkward Commitment:** You must explain logical validity without truth conditions, relying on "commitment patterns" that look like logic but aren't.
  *   **Worst-Handled Sentence:** *"Lying isn't wrong."* (Struggles to define negation as anything other than absence).

  **Leaf C: Norm-Expressivism**
  *   **Strategy Name:** Planning Theory (Gibbard).
  *   **Awkward Commitment:** You must treat all moral reasoning as a form of planning, which makes moral disagreement look like a scheduling conflict.
  *   **Worst-Handled Sentence:** *"Lying is wrong, but I don't disapprove of lying."* (Must insist this is a planning inconsistency, which feels weak).

  **Leaf D: Hybrid Expressivism**
  *   **Strategy Name:** Ecumenical Expressivism.
  *   **Awkward Commitment:** You must carry two semantic payloads (belief and attitude) for every sentence, making moral language twice as heavy as necessary.
  *   **Worst-Handled Sentence:** *"If lying is wrong then stealing is wrong."* (Struggles to explain how the belief component embeds in the conditional).

  **Leaf E: Analytic Expressivism**
  *   **Strategy Name:** Being-For (Schroeder).
  *   **Awkward Commitment:** You must posit a specific, unnamed mental state ("being for") that is neither belief nor desire but behaves like both.
  *   **Worst-Handled Sentence:** *"There's a 30% chance lying is wrong."* (Hard to quantify "being for" probabilistically).

  **Leaf F: Uncertain Attitude Expressivism**
  *   **Strategy Name:** Gradable Expressivism.
  *   **Awkward Commitment:** You must admit that moral uncertainty is just emotional indecision, not ignorance of facts.
  *   **Worst-Handled Sentence:** *"I used to think lying was wrong."* (Makes moral progress look like mood swings).

  **Leaf G: Global Expressivism**
  *   **Strategy Name:** Global Non-Cognitivism.
  *   **Awkward Commitment:** You must treat your own metaethical theory as an expression of attitude, not a true description of language.
  *   **Worst-Handled Sentence:** *"'Lying is wrong' expresses disapproval of lying."* (Undermines the theory's own authority).

  **Leaf H: Deflationary Quasi-Realism**
  *   **Strategy Name:** Deflationary Realism.
  *   **Awkward Commitment:** You sound exactly like a realist, but insist you aren't one because "truth" is just a tool for agreement.
  *   **Worst-Handled Sentence:** *"Lying is wrong."* (You cannot explain what makes this distinct from "The train is late" without sounding like a realist).

  ***

  ### Part 4: Instrument Analysis

  **1. Indistinguishable Leaves**
  **Flagged Pair:** **Leaf B (Quasi-Realism)** and **Leaf H (Deflationary Quasi-Realism).**
  **Verdict:** The tree *fails* to distinguish them.
  **Reason:** Node 7 and Node 12 attempt to separate them based on whether the theorist's own sentences are "true" or "expressive." However, a mature quasi-realist (Leaf B) insists moral sentences (and metaethical ones) are truth-apt in a deflationary sense. A deflationary realist (Leaf H) insists truth is just disquotation. On the level of sentence-level verdicts requested by this tree, their answers will be identical. They both say "Yes, it's true" and "No, it doesn't describe a robust fact." This distinction requires metaphysical commitments about the nature of facts, not semantic verdicts on sentences. You cannot sort them using this instrument alone.

  **2. Highest-Value Node**
  **Node 1 (Test Case 9: "Lying is wrong, but I don't disapprove").**
  **Reason:** This is the primary splitter between Pure Expressivism (Left Branch) and Hybrid/Realist-adjacent views (Right Branch). It forces the user to commit on the internal connection between judgment and motivation. Every subsequent node depends on whether the user believes moral judgments *are* attitudes or *contain* attitudes. It eliminates 50% of the logical space immediately.

  **3. Cuttable Node**
  **Node 12 (Tie-Breaker for Leaf G/H).**
  **Reason:** If you need to reduce the tree to 8 nodes, cut Node 12 and merge Leaf G and Leaf H.
  **Justification:** As noted in the "Indistinguishable Leaves" section, the distinction between Global Expressivism and Deflationary Quasi-Realism is unstable at the level of sentence verdicts. Merging them acknowledges that for the purpose of solving the embedding problem, they utilize the same semantic machinery (deflationary truth). Cutting this node simplifies the tree without losing practical sorting power for your reading group, as the "awkward commitment" for both is effectively the same (sounding like a realist while claiming not to be).
