  2.  **Semantic Mechanism:** Does the sentence work by describing how things are (Static/Truth-Conditional), or by changing the conversational score/plans (Dynamic/Update)?
  3.  **Negation:** Is "lying isn't wrong" the *absence* of a state, or a *conflicting* state (e.g., tolerating)?
  4.  **Scope:** Does this account apply only to moral sentences (Local), or to the language used to describe the account itself (Global)?

