      *   *Defenders' Use:* Justifies conditionality, means-testing, strict verification. Logic: Insurers must prevent fraud (moral hazard) and ensure solvency (adverse selection).
      *   *Critics' Use:* Attacks conditionality/means-testing. Logic: Real insurers don't behave this way (e.g., they don't make sick people look for work, they don't means-test based on spouse's income).

  3.  **Step 1: Explicit Correspondences:**
      *   Contributions (Tax/NI) $\leftrightarrow$ Premiums.
      *   Entitlement (Benefit) $\leftrightarrow$ Claim/Payout.
      *   The State/Welfare Fund $\leftrightarrow$ The Insurer/Pool.
      *   The Citizen/Claimant $\leftrightarrow$ The Policyholder/Insured.
      *   Misfortune (Unemployment, Sickness) $\leftrightarrow$ Covered Risk/Event.
      *   Rules/Conditionality $\leftrightarrow$ Policy Terms/Exclusions.

  4.  **Step 2: Features Leaned On:**
      *   *Defenders:* Lean on *financial solvency* and *risk management*. They focus on the *contractual* nature (you pay, you get, but only if rules are followed) and the *economic incentives* (moral hazard). They treat the state like a *private firm* that must protect its bottom line.
      *   *Critics:* Lean on *service standards* and *fiduciary duty*. They focus on the *purpose* of insurance (indemnification against loss) and argue the state is behaving *unlike* a competent insurer (adding hurdles that don't reduce risk, just reduce payout). They treat the state as if it *should* act like a *good* private firm.

      *Observation:* Both sides accept the "contract" premise but disagree on what the contract entails. Defenders say "The contract requires X to prevent abuse." Critics say "A real contract wouldn't have X."

  5.  **Step 3: Disanalogies (Biting vs. Rhetorical):**
      *   *Rhetorical:* "Insurers have call centers, so does the DWP." (Irrelevant).
      *   *Biting (Defenders):*
          *   *Compulsion:* Insurance is voluntary; tax is mandatory. You can't opt out of the "risk pool."
          *   *Profit/Solvency:* Insurers go bust; the State prints money/taxes. Solvency isn't the constraint, political will is.
          *   *Risk Pricing:* Insurers price risk individually (actuarial); Welfare is often redistributive (solidarity).
      *   *Biting (Critics):*
          *   *Purpose of Payout:* Insurance indemnifies loss (restores status quo ante). Welfare often aims at subsistence or behavioral change.
          *   *Relationship:* Insurer-Insured is transactional. State-Citizen is constitutional/political.
          *   *Definition of Risk:* "Unemployment" isn't always a random misfortune; it's structural. "Sickness" isn't always binary.

  6.  **Step 4: Smuggled Premises:**
      *   *Earned Entitlement:* The biggest one. Insurance implies *quid pro quo*. Welfare (in many philosophies) is based on *citizenship* or *need*, not prior payment.
      *   *Deservingness:* Insurance sorts by "valid claim," not "moral worth," but the analogy blurs this. A fraudulent claimant is "undeserving" in insurance, but in welfare, a person in need might be deemed "undeserving" for structural reasons unrelated to fraud.
      *   *Individualism:* Insurance focuses on the individual policyholder. Welfare often impacts households/families (hence means-testing partners), which breaks the insurance model (insurers usually insure individuals or specific households defined differently).

  7.  **Step 5: Evaluation (Survival?):**
      *   *Defenders:* Weakens. If the state isn't a profit-seeking entity and participation is mandatory, "moral hazard" arguments lose their commercial force. You can't "leave the pool" to avoid high premiums.
      *   *Critics:* Strengthens, but still trapped. By saying "No *real* insurer would do this," they validate the idea that the state *ought* to be an insurer. They win the tactical point but lose the strategic ground (accepting the insurance frame).
      *   *Verdict:* The frame is broken for both, but especially for defenders. It smuggles in a transactional view of citizenship that contradicts the universal nature of tax-funded welfare.

  8.  **Step 6: Better Frame Proposal:**
      *   *Option A:* "Public Utility." (Infrastructure, essential service).
      *   *Option B:* "Social Dividend." (Share of national wealth).
      *   *Option C:* "Maintenance of the Commons." (Keeping the society functioning).
      *   *Selection:* **Infrastructure/Public Utility.**
      *   *Why:* It captures the mandatory nature (you pay taxes like rates), the collective benefit (a healthy workforce helps everyone), and removes the "claim/loss" stigma.
      *   *What it licenses:* Universal baseline support (like water/electricity), investment in capacity (training/health) rather than policing claims, focus on system stability rather than individual fraud.

  9.  **Drafting the Response:**
