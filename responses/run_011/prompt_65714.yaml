      *(Refining the "Better Frame")*: "Social Infrastructure" is good. It implies maintenance, investment, and universal access. Or "Citizenship Dividend." Let's go with **Social Infrastructure** as it aligns best with the "functioning society" aspect without the transactional baggage.

