      *   *Refining the "Subject vs Spec" point:* In infra, if two systems pass the same integration tests, they are equivalent. Hofstadter might say one has "symbols" and the other doesn't, even if I/O matches. This is the clash.

      *   *Refining Smuggling:* Marketing says "collective reasoning." Infra says "distributed consensus." Consensus isn't reasoning; it's agreement. Reasoning implies inference. Need to flag this distinction.

      *   *Word Count Management:* Keep intro tight. Spend bulk on Residue and Smuggling.

