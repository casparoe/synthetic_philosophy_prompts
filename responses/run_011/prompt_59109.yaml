answer: |-
  Four years the wall has kept the chapel's shade,
  Where thirty strangers walk the gravel line.
  My mum planted the roses, now they fade,
  They bloom for beetles and the wild vine.
  Moore pictured earth without a single soul,
  Yet filled with light and form and colour deep;
  He granted it a good, however small,
  Distinct from praise that living minds might keep.

  But he conceded: standalone, it counts
  For very little, save a mind aware.
  Beauty holds a mere negligible sum,
  Unless a consciousness attends it there.
  With only blackbirds and my eyes to see,
  Does the place matter? Does worth remain free?
