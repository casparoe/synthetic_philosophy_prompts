      *   **Topic:** A walled garden behind a chapel, kept by the speaker for four years, with only ~30 visitors/summer. The committee wants to let it go to weeds due to cost/lack of use.
      *   **Philosophical Core:** G. E. Moore's argument from *Principia Ethica* (Chapter VI, "The Ideal").
          *   Part 1: A beautiful world vs. an ugly world, both empty of humans. We judge the beautiful one better. Therefore, beauty has intrinsic value.
          *   Part 2: However, that intrinsic value is *very little* compared to the value of human consciousness appreciating it (people loving, people admiring beauty).
          *   The Twist/Dilemma: The speaker is stuck in the gap between "beauty exists alone" and "beauty needs witnesses to matter fully."
      *   **Form:** Sonnet (14 lines).
      *   **Specific Constraint 1 (The Turn/Volta):** The turn must land exactly on the gap: "does the place matter when the only eyes on it are mine and the blackbirds'?"
      *   **Specific Constraint 2 (Philosophical Accuracy):** Must capture Moore's "little-but-not-nothing" nuance. Not just "beauty is nice," but "it has value alone, but vastly more with consciousness."
      *   **Specific Constraint 3 (Tone):** No pep talk. No resolving the dilemma. No making the poem about the speaker's feelings being the ultimate point (avoid solipsism/self-aggrandizement).
      *   **Detail:** The speaker's mum planted the roses.
      *   **Voice:** Reflective, weary, precise.

