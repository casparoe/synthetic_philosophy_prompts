prompt: |-
  I teach a graduate seminar on the early modern philosophy of mathematics, and for our closing session I want to stage an anachronistic confrontation. My question is this: how would Hobbes — not the Hobbes of the political treatises, but the Hobbes of *De Corpore* and of his two decades of quarrel with Wallis — have judged the geometry that came after him?

  Let me fix the two doctrines I take to be load-bearing in his philosophy of mathematics, so that the exercise engages those rather than his politics. First, his account of what makes demonstration genuine: philosophy proceeds either from the generation of a thing to its properties, or from properties back to a possible generation, and we have science in the strict sense only where we know causes because we ourselves construct the object. Geometry is his paradigm case precisely because a figure is generated by motion and the geometer is the author of that motion; his nominalism then supplies the rest, since the definitions standing at the head of a science are stipulations fixing the signification of names, and reasoning is the reckoning of the consequences of names agreed upon. Second, his hostility to the analytic methods of his contemporaries: he regarded the manipulation of algebraic symbols as a device for getting answers without acquiring understanding, marks on paper doing duty for conceptions the operator never actually frames — which is much of why he judged Wallis's work, and the infinitesimal methods built on it, ingenious but unscientific.

  Do not confine yourself to those two. His refusal to grant any conception of an actually infinite magnitude, his treatment of a point and a line as bodies considered in a certain way, and his reworking of the Euclidean theory of proportion all bear on what follows, and you will likely want to add commitments of your own.

  Now bring in three things he never saw. (1) Consistent non-Euclidean geometries, together with the eventual demonstration that the parallel postulate cannot be derived from the remaining assumptions. (2) Hilbert-style axiomatics, on which the primitive terms of a theory are fixed solely by their position in the axioms and are, as Hilbert told Frege, interchangeable with anything you care to name. (3) Computer-assisted proofs: the four-colour theorem as established by Appel and Haken, and the Kepler conjecture as certified by Hales's formalization project — in both of which the verification is too long for any individual mathematician to survey.

  I want an essay predicting his verdict on each of the three, and it may not hedge into "he would have had mixed feelings." Commit to a verdict in each case and then identify which of his own commitments does the work in producing it. Resolve, in particular, the tension my students will spot at once: his nominalism about definitions looks like a charter for stipulating whatever geometry one pleases, which casts him as Hilbert's ancestor; his constructivism, and his insistence that names be tied to conceptions the reasoner can frame and follow, look like a standing objection to a mathematics whose steps no human being can inspect, which casts him instead as Brouwer's. Say why one strand dominates, or specify what distinguishes the cases in which each is triggered.

  Then turn to the case that I think will decide the question. Suppose Hobbes had been shown Lindemann's proof of the transcendence of π, and with it the demonstration that quadrature of the circle by straightedge and compass is impossible. Would he have taken this as finally settling the problem he pressed from *De Corpore* until his death, or would he have dismissed it as one more piece of symbol-mongering that never generates the magnitude it purports to speak of? Answer that, and use the answer to say something general about whether his philosophy of mathematics was fundamentally a theory of proof, a theory of understanding, or a theory of authority — for I suspect that what he ultimately wanted from geometry was not the tracking of truth but the end of dispute, and I want to know whether the modern developments would have served that aim or sabotaged it.

  Two constraints on the submission. Paraphrase Hobbes rather than quoting him; I want the doctrines, not the diction. And I want argument, not a survey of what other scholars have said about him.
reasoning: |-
  Here's a thinking process that leads to the essay:

  1.  **Analyze the Request:**
      *   **Topic:** An anachronistic confrontation between Thomas Hobbes (specifically the Hobbes of *De Corpore* and the Wallis quarrels) and three modern mathematical developments: (1) Non-Euclidean Geometry, (2) Hilbert-style Axiomatics, (3) Computer-Assisted Proofs.
      *   **Core Doctrines to Engage:**
          *   Genuine demonstration requires knowledge of causes via construction/generation (constructivism).
          *   Nominalism: Definitions are stipulations of names; reasoning is reckoning consequences of names.
          *   Hostility to algebraic/analytic methods (symbols without conceptions).
          *   Rejection of actual infinity.
          *   Points/lines as bodies considered in a certain way (materialist ontology of math).
      *   **Required Verdicts:** Must commit to a verdict for each of the three developments (no "mixed feelings").
      *   **Key Tension to Resolve:** Nominalism (looks like Hilbert) vs. Constructivism/Intelligibility (looks like Brouwer). Which dominates?
      *   **The Deciding Case:** Lindemann's proof of the transcendence of $\pi$ (impossibility of squaring the circle). Would Hobbes accept this?
      *   **Ultimate Question:** Is Hobbes's philosophy a theory of proof, understanding, or authority/truth-ending?
      *   **Constraints:** Paraphrase Hobbes (no direct quotes), argue original thesis (no survey of scholarship).

  2.  **Deconstruct Hobbes's Position:**
      *   *Ontology:* Materialist. A point is a body with magnitude ignored. A line is the trace of a moving point. Geometry is about *motion* and *generation*.
      *   *Epistemology:* To know something is to know how it is made. *Verum et factum convertuntur* (truth and fact are convertible), though Hobbes doesn't use the Vico phrase, the sentiment is there. We have science only of what we construct.
      *   *Logic/Language:* Nominalist. Universal terms are names. Reasoning is computation (addition/subtraction of names). Definitions are arbitrary but must be consistent and refer to conceivable things.
      *   *The Wallis Feud:* Hobbes hated algebra because it manipulated symbols without clear ideas of the quantities involved. He hated infinitesimals because "infinite" is not a magnitude but a lack of limit. He insisted on the possibility of squaring the circle because he believed he could construct it.

  3.  **Evaluate the Three Modern Developments:**

      *   **(1) Non-Euclidean Geometry:**
          *   *Hilbertian view:* Consistent axiomatic systems.
          *   *Hobbesian view:* Geometry is the science of space and motion. Space is unique (Euclidean). If you define a "line" differently, you aren't talking about the same thing.
          *   *Verdict:* Rejection. It's verbal trickery. If a line is the trace of a point moving uniformly, it *must* be Euclidean. Non-Euclidean "lines" are not generated by the motion Hobbes recognizes.
          *   *Dominant Doctrine:* Materialist ontology of geometric objects (generation by motion).

      *   **(2) Hilbert-style Axiomatics:**
          *   *Hilbert:* "Tables, chairs, beer mugs." Primitives are undefined, fixed by relations.
          *   *Hobbes:* Definitions must fix signification to *conceivable* motions/bodies. You can't just stipulate relations; you must stipulate *generations*.
          *   *Verdict:* Rejection (mostly). While Hobbes likes stipulative definitions, they must anchor to a conceivable generation. Hilbert's abstraction severs the link to the causal generation of the object. It becomes "marking on paper" without conception.
          *   *Dominant Doctrine:* Constructivism/Intelligibility over pure Nominalism.

      *   **(3) Computer-Assisted Proofs:**
          *   *Nature:* Verification by machine, too long for human survey.
          *   *Hobbes:* Reasoning is a computation *the reasoner performs*. If the reasoner cannot survey the reckoning, they do not possess the science. It relies on authority (the machine/programmer), not demonstration.
          *   *Verdict:* Rejection. It is not science, it is belief based on authority.
          *   *Dominant Doctrine:* Science requires the knower to construct the causal chain mentally.

      *   **Resolving the Tension (Nominalism vs. Constructivism):**
          *   Hobbes is a nominalist, *but* his nominalism is constrained by materialism. You can name things, but only if you can conceive their generation. Hilbert allows naming without conceiving. Brouwer requires mental construction. Hobbes is closer to Brouwer here, but for causal/material reasons, not intuitionist ones.
          *   *Resolution:* Constructivism dominates. Nominalism allows freedom of definition *only if* the defined term refers to a possible generation.

      *   **(4) The Deciding Case: Lindemann and $\pi$:**
          *   *The Proof:* Algebraic/Analytic. Shows impossibility of construction.
          *   *Hobbes's Reaction:* He would hate the method (algebra/symbols). But more importantly, he would reject the *conclusion*. Why? Because he *knows* he can square the circle (he thinks). A proof of impossibility contradicts his construction.
          *   *Crucial Point:* For Hobbes, a proof of impossibility via algebra is "symbol-mongering." A geometric construction (even a flawed one) is an attempt at generation. If the generation is presented, the impossibility proof is just a claim that the names don't add up.
          *   *Verdict:* Dismissal. He would claim the algebraic proof does not engage with the magnitude itself, only the names.
          *   *Implication:* His philosophy is a theory of *Authority* (ending dispute) but grounded in a specific theory of *Understanding* (causal generation). However, the drive to end dispute makes him dogmatic. He wants geometry to be settled. Modern math makes it unsettled (plural geometries, uncheckable proofs).

  4.  **Drafting the Argument - Section by Section:**

      *   **Introduction:** Set the stage. Hobbes the geometer, not the Leviathan author. Define the core tension (Nominalist freedom vs. Materialist constraint).
      *   **Section 1: Non-Euclidean Geometry.** Focus on the definition of line and space. For Hobbes, space is the phantasm of a thing existing without the mind. It is Euclidean by nature of how we conceive extension. Non-Euclidean geometry changes the meaning of "line" to something ungeneratable. Verdict: Verbal sophistry.
      *   **Section 2: Hilbertian Axiomatics.** Address the Nominalist temptation. Yes, definitions are stipulations. But they must be of *possible* things. Hilbert's "points" have no generation. Verdict: Empty reckoning. Constructivism wins over pure Nominalism.
      *   **Section 3: Computer Proofs.** Reasoning is computation. But it must be *human* computation to count as science. Otherwise, it's testimony. Verdict: Not science, but belief.
      *   **Section 4: The Lindemann Case ($\pi$).** This is the crux. Hobbes spent decades trying to square the circle. Lindemann says "No." Hobbes would say "You haven't seen my construction." The algebraic proof doesn't touch the magnitude. Verdict: Rejection.
      *   **Conclusion:** What kind of theory is this? It aims for the end of dispute (Authority) but demands Causal Understanding. Modern math sacrifices the end of dispute for rigor/truth. Hobbes would see modern math as a retreat into obscurity and authority (trusting the machine/the axiom), which is exactly what he hated in the clergy and the algebraists.

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Check:* Did I quote Hobbes? *Correction:* Ensure all references are paraphrased.
      *   *Check:* Did I hedge? *Correction:* Make strong claims. "He would reject," not "He might struggle."
      *   *Check:* Did I resolve the Hilbert/Brouwer tension? *Correction:* Explicitly state that Nominalism is subordinate to Materialist Constructivism. You can name what you can make.
      *   *Check:* The Lindemann section needs to be sharp. Why would he reject a rigorous proof? Because for Hobbes, rigor without causal generation is not science. Algebra is not geometry.
      *   *Tone:* Academic, rigorous, fitting a graduate seminar closing.

  6.  **Final Polish:**
      *   Ensure the transition between the three modern cases and the Lindemann case is smooth.
      *   Make sure the "Theory of Authority" point lands hard in the conclusion. Hobbes wants *peace* in philosophy. Modern math brings *pluralism*. He would hate it.

  7.  *(Mental Sandbox for Lindemann)*: If I tell Hobbes, "It is impossible," he says, "I have done it." I say, "Your construction is flawed." He says, "Check the motion." I say, "The algebra proves no motion can yield this." He says, "Algebra is not motion." This confirms the "Theory of Understanding" (Causal) trumps the "Theory of Proof" (Logical consistency). But the *goal* is Authority (ending the fight). Since modern math doesn't end the fight (Godel, etc.), he rejects the method.

  8.  *(Final Review against constraints)*: No quotes. Argumentative. Address all three + Lindemann. Resolve tension.

  *(Self-Correction on the "Authority" point)*: The prompt asks if his philosophy is a theory of proof, understanding, or authority. I need to be careful. He wants authority (certainty that stops argument), but he thinks the *path* to that is understanding (generation). If modern proof offers certainty without understanding (computer) or understanding without uniqueness (non-Euclidean), he rejects it. I will argue it is ultimately a theory of *Authority achieved through Causal Understanding*.

  Let's write.
answer: |-
  **The Geometer's Peace: Hobbes Against the Moderns**

  To stage a confrontation between Thomas Hobbes and modern mathematics is to pit a philosophy designed to end dispute against a practice designed to expand possibility. The Hobbes relevant to this seminar is not the theorist of the state of nature, but the materialist epistemologist of *De Corpore*, the man who believed that to know a thing is to know how it is made. For Hobbes, geometry is the only true science because it alone deals with objects we construct ourselves. He holds that genuine demonstration proceeds from the generation of a figure to its properties, or from properties back to a possible generation. Definitions are indeed stipulations of names, but they are not arbitrary; they must anchor to conceptions of motion and body that the mind can frame. Algebraic symbolism, by contrast, is suspect because it allows the operator to manipulate marks without conceiving the quantities they signify.

  When we bring this Hobbes into contact with the mathematics of the last two centuries, we must resolve an immediate tension. His nominalism suggests he should welcome Hilbert's axiomatics, where terms are defined solely by their logical relations. Yet his constructivism suggests he should side with the intuitionists, demanding that every object be mentally surveyable. The verdict on the three modern developments—non-Euclidean geometry, formal axiomatics, and computer-assisted proof—reveals that for Hobbes, constructivism dominates nominalism. He would reject all three, not because they are false, but because they fail to be science.

  **1. Non-Euclidean Geometry: A Sophistry of Names**

  Hobbes would dismiss non-Euclidean geometry as a verbal trick rather than a discovery of new spatial truths. His ontology of geometry is strictly materialist: a point is a body considered without magnitude, a line is the trace of a point in motion, and space is the phantasm of a thing existing outside the mind. Crucially, this space is singular and Euclidean. The properties of space are not contingent on axioms we choose; they are necessary consequences of how we conceive extension and motion.

  When told that the parallel postulate is independent of the other axioms, Hobbes would not see a liberation of geometric possibility. He would see a confusion of definitions. For him, a "straight line" is not a term defined by its relation to other terms in a system; it is a specific kind of motion (uniform, unidirectional). If a system posits "lines" that behave differently, Hobbes would argue that the practitioners are no longer speaking of lines, but have misapplied the name to a different conception. Since science is the knowledge of consequences from true definitions, and true definitions must capture the actual generation of the thing, a geometry that denies the natural consequences of Euclidean generation is not a rival science; it is nonsense. He would judge it as he judged Wallis's algebra: a manipulation of names detached from the conceptions they are supposed to signify. The verdict is rejection: it is not geometry, but logic games played with stolen vocabulary.

  **2. Hilbertian Axiomatics: The Empty Reckoning**

  The case of Hilbert is more delicate because it tempts Hobbes's nominalism. Hobbes agrees that definitions are stipulations and that reasoning is a computation of names. Hilbert's claim that one should be able to replace "points, lines, and planes" with "tables, chairs, and beer mugs" sounds like the ultimate nominalist move: the meaning is in the structure, not the referent.

  However, Hobbes would ultimately condemn this approach as empty. For Hobbes, the stipulation of a name is only the beginning of science, not the whole of it. The definition must fix the signification to a *possible generation*. We can stipulate the name "circle," but only because we can conceive the motion of a radius rotating around a center. If the primitive terms of a system are not tied to a conceivable generation, the reasoning that follows may be logically consistent, but it yields no causal knowledge. It tells us how names relate, not how the world is constituted.

  Hobbes distinguishes between knowing that a conclusion follows (which a machine might do) and knowing why it is true (which requires grasping the cause). Hilbertian axiomatics severs the link between the name and the causal generation. It allows for consistency without intelligibility. Hobbes would argue that while such a system might produce true propositions in a logical sense, it does not produce *science* in the strict sense, because the operator does not know the causes of the properties they are deducing. The verdict is rejection: it is a calculus of consequences, but not a philosophy of magnitudes.

  **3. Computer-Assisted Proofs: Belief, Not Science**

  Regarding computer-assisted proofs like the Four-Colour Theorem or the Kepler Conjecture, Hobbes's verdict would be the swiftest and most severe. For Hobbes, reasoning is a computation, but it is a computation that must be performed by the reasoner to count as knowledge. Science is a habit of the mind, acquired by the act of reckoning.

  If a proof is too long for a human being to survey, the mathematician does not possess the demonstration; they possess only a testimony that the demonstration exists. They are relying on the authority of the machine and the programmers. For Hobbes, this returns mathematics to the very state he sought to escape: a reliance on authority rather than evident reason. It creates a class of "knowers" who actually only believe. This violates his core epistemological constraint that we have science only where we construct the object and follow the generation of its properties. If the steps of the generation cannot be framed by the mind, the causal link is broken. The verdict is rejection: this is not demonstration, but belief based on authority.

  **Resolving the Tension: Constructivism over Nominalism**

  These three verdicts resolve the tension between Hobbes's nominalism and his constructivism. While Hobbes believes definitions are stipulations, he believes they are constrained by the limits of human conception and material generation. He is a nominalist about language, but a realist (or materialist) about the motions that language must track. Hilbert offers nominalism without the material constraint; Brouwer offers constructivism without the material cause. Hobbes demands both: the name must be stipulated, but it must name a possible motion.

  Therefore, the constructivist strand dominates. We are free to name, but we are not free to conceive the inconceivable. We cannot stipulate a "line" that does not behave according to the generation of a line. We cannot claim knowledge of a proof we cannot mentally survey. The freedom of the nominalist is subordinate to the requirements of the geometer who must generate the figure.

  **The Deciding Case: Lindemann and the Quadrature**

  This hierarchy is tested most severely by the case of Lindemann's proof of the transcendence of $\pi$. Here, Hobbes is not faced with a new geometry or a new method, but with a direct negation of his life's work. For decades, Hobbes insisted he had squared the circle. Lindemann's proof demonstrates that such a construction is impossible using straightedge and compass.

  Would Hobbes accept this? He would not. He would dismiss it as symbol-mongering.

  To understand why, we must see what Hobbes wanted from geometry. He did not view it merely as a theory of truth, nor purely as a theory of understanding. It was, fundamentally, a theory of **authority**. Hobbes sought a method of reasoning that would compel assent and end dispute. In politics, the Sovereign ends the war of all against all. In philosophy, the Geometric Method ends the war of words.

  Lindemann's proof is algebraic and analytic. It operates on the properties of numbers and equations, not on the generation of magnitudes by motion. For Hobbes, this is the category error he identified in Wallis. To prove a geometric impossibility using algebra is to reason about names without conceiving the things. Hobbes would argue that Lindemann has shown that certain *algebraic symbols* cannot resolve to certain other *symbols*, but he has not engaged with the magnitude itself. If Hobbes presents a construction (even a flawed one), he claims to have generated the magnitude. A proof of impossibility that does not engage with the generation is, for Hobbes, irrelevant.

  He would likely argue that the impossibility proof rests on definitions of number and magnitude that are themselves confused (involving the infinite, which he rejects). Since Hobbes denies the coherence of actual infinity, and transcendence proofs rely on infinite series or properties of the infinite field of complex numbers, he would reject the premises of the proof as nonsensical. He would maintain that his construction works because he can see the motion, and he would claim the algebraic proof fails because it deals with "infinite" quantities which are not magnitudes at all.

  **Conclusion: The End of Dispute**

  This final verdict reveals the core of Hobbes's philosophy of mathematics. It is not primarily a theory of proof, in the modern sense of logical validity. Nor is it purely a theory of understanding, in the sense of psychological grasp. It is a theory of **authority grounded in causal understanding**.

  Hobbes wants geometry to be a place where dispute is impossible because the cause is evident to anyone who follows the generation. Modern mathematics, by contrast, has traded the end of dispute for the expansion of truth. It accepts plural geometries (undermining the uniqueness of space), formal systems without intuitive anchors (undermining causal understanding), and proofs without human survey (undermining personal authority).

  For Hobbes, these developments would look like a retreat. They replace the evident light of construction with the shadowy authority of the expert, the machine, or the axiomatic system. He sought a mathematics that could serve as a model for civil peace, where conclusions are compelled by the nature of things. The moderns have given him a mathematics that is more powerful and more true, but also more esoteric and more reliant on trust. Hobbes would judge it unscientific. He would say that by abandoning the requirement that every step be a conceivable generation, modern mathematics has surrendered its claim to be the paradigm of certain knowledge. It has become, in his eyes, just another form of scholasticism: a priesthood of symbol-manipulators claiming authority they cannot demonstrate to the common reason of mankind.

  In the end, Hobbes would stand by his circle. He would prefer a false construction that he understands to a true impossibility proof that he cannot conceive. For Hobbes, science is not about tracking truth in the abstract; it is about securing a peace of mind that comes from knowing exactly how the world is put together. Modern mathematics offers truth without that peace. He would reject it.
