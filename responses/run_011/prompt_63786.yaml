answer: |-
  **Final Examination: Democratic Theory**

  **Question 1**
  Consider the following constitutional proposal: A second legislative chamber is established, composed of 150 citizens selected by lot. Members serve a single, non-renewable nine-year term. This body possesses no power to introduce legislation, amend text, or appropriate funds. Its sole powers are to withhold assent (veto) or return a bill to the elected chamber for reconsideration. If the elected chamber repasses the bill with a three-fifths majority, it becomes law.

  Write an essay evaluating the normative coherence of this design. Specifically: (1) Do the standard justifications for granting sortition bodies *positive* lawmaking power (e.g., descriptive representation, deliberative quality) successfully justify granting them *negative* power, or does a veto rest on a distinct rationale? (2) Explain how the standard "accountability objection" transforms when the body is answerable only for preventing outcomes rather than producing them. If a veto produces nothing, what are the members answerable *for*?

  ***

  **Model Answer**

  This proposal fundamentally alters the normative architecture of sortition by shifting the body from an engine of will-formation to a mechanism of risk mitigation. Consequently, the justifications for positive power do not translate neatly to negative power; rather, the rationale shifts from *competence in vision* to *independence in judgment*.

  Standard arguments for sortition-based legislation rely on descriptive representation to simulate a "microcosm" of the public, theoretically enhancing legitimacy and deliberative quality. However, positive lawmaking demands proactive competence: the ability to draft complex statutes, anticipate unintended consequences, and balance competing policy goals. Here, the competence objection bites hardest; amateurs may lack the technical literacy to govern actively. By restricting the chamber to negative power, the proposal sidesteps the requirement for proactive technical competence. A veto requires only the judgment to identify harm, corruption, or elite capture. Thus, the justification is not that the lot-selected body represents the popular *will* better than elections, but that it represents the popular *interest* against legislative haste or special interest domination. The rationale shifts from democratic authorship to democratic guardianship.

  This shift radically transforms the accountability objection. The standard critique holds that without elections, representatives cannot be sanctioned, breaking the chain of authorization. In a positive legislature, members are accountable for the state of the world (e.g., economic growth, peace). If they fail, voters punish them. In this negative design, members are not responsible for the state of the world, but for the integrity of the legislative process. They are answerable for preventing specific harms, not producing specific goods.

  Crucially, accountability is relocated from the sortition chamber to the elected chamber via the override mechanism. Because the elected chamber can enact law with a three-fifths majority, popular sovereignty is preserved. If the sortition chamber blocks a popular law, the elected representatives must expend political capital to override it. They become the accountable agents for the final outcome. The sortition members, insulated by nine-year non-renewable terms, are designed to be *unaccountable* in the electoral sense to ensure they are immune to short-term populist pressures or lobbying. Their "answerability" is internal to the system: they must justify their veto to the elected chamber, which in turn answers to the voters.

  The nine-year term, often criticized in positive bodies as creating an unaccountable aristocracy, is coherent here. In a negative body, the primary virtue is insulation. A short term would incentivize members to cultivate reputations for future careers, reintroducing the very electoral incentives sortition seeks to eliminate. A single long term ensures they face no future consequences for their decisions, aligning their incentives purely with the immediate deliberative task.

  However, a tension remains regarding authorization. If the body produces nothing, its democratic legitimacy rests entirely on the randomness of selection and the constraint of its power. If the veto is used systematically to block redistribution or progressive change, the "guardianship" may look like oligarchic obstruction. Yet, because the elected chamber retains the final word (via supermajority), the system avoids gridlock.

  In conclusion, the proposal is normatively coherent, but only if one abandons the claim that sortition bodies should actively legislate. The justification for this design is not that 150 citizens know better than elected officials what laws to pass, but that they are less susceptible to the pressures that cause officials to pass bad laws. The accountability objection is neutralized not by making the sortition members electorally accountable, but by making their decisions reversible by those who are. The design sacrifices democratic agency for democratic safety, a trade-off that is defensible provided the override threshold remains accessible enough to prevent minority rule.

  ***

  **Marking Scheme (Total: 25 Points)**

  **A Range (20–25 points): Theoretical Synthesis & Design Coherence**
  To earn an A, the essay must move beyond a survey of the literature and analyze the specific interaction between the *negative* power constraint and democratic theory.
  *   **The Shift in Rationale (5 pts):** Explicitly argues that justifications for positive power (active will-formation) do *not* automatically justify negative power. Identifies the shift to "guardianship," "risk mitigation," or "insulation from capture" as the distinct rationale for a veto.
  *   **Transformed Accountability (5 pts):** Explains that accountability for a negative body is not about "producing outcomes" but "preventing harm." Crucially, identifies that accountability is *structural/systemic* (via the elected chamber's override) rather than *electoral* (re-election).
  *   **Term Length Logic (5 pts):** Defends the 9-year term not as a bug, but as a feature necessary for insulation in a negative body (removing careerism).
  *   **Sovereignty/Override (5 pts):** Correctly analyzes the 3/5 override as the mechanism that preserves popular sovereignty/majoritarianism despite the veto.
  *   **Writing & Structure (5 pts):** Clear thesis, logical flow, precise terminology.

  **B Range (15–19 points): The Literature Survey**
  *   **Ceiling Rule:** A well-organized catalogue of the pros and cons of sortition (e.g., "Sortition increases diversity" vs. "Sortition lacks competence") **tops out at a B**, regardless of writing quality.
  *   To enter the B range, the student must accurately define descriptive representation, the accountability objection, and deliberative theory, but fails to apply them specifically to the *negative power* constraint or the *override mechanism*. They treat the prompt as a general question on sortition rather than a design evaluation.

  **C Range (10–14 points): Basic Comprehension**
  *   Identifies the basic mechanics of the proposal but relies on intuition rather than theory.
  *   Fails to distinguish between positive and negative power.
  *   Vague treatment of accountability (e.g., "They aren't accountable because they aren't elected" without discussing the override).

  **Specific Costed Errors (Deduct 3 points each, up to 9 points total)**
  *These claims sound plausible in general democratic theory but are incorrect in the context of this specific proposal.*

  1.  **The "Undemocratic Veto" Error:** Claiming the veto is inherently undemocratic because it allows a minority to block the majority will.
      *   *Correction:* The 3/5 override ensures the elected majority ultimately prevails; the veto is a delay/hurdle, not a final block.
  2.  **The "Term Limit" Error:** Claiming the nine-year term destroys accountability and therefore invalidates the design.
      *   *Correction:* In a negative body, electoral accountability is a vice (creates careerism); the design relies on *insulation*, with accountability managed via the elected chamber's override.
  3.  **The "Competence" Error:** Arguing the body lacks competence to *veto* because they cannot *draft* laws.
      *   *Correction:* The proposal explicitly removes drafting power; the competence required for vetoing (judgment of harm) is distinct from drafting (technical construction).

  **Note to Graders:**
  An essay that lists the "Pros of Sortition" (descriptive representation, reduced corruption) and "Cons of Sortition" (lack of expertise, no mandate) without analyzing how the *veto power* changes the weight of these claims cannot score higher than 19 (High B), even if the prose is excellent. The A requires grappling with the *negative* nature of the power.
