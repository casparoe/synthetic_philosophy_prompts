answer: |-
  Good morning. It's a privilege to welcome you to this workshop on everyday obligation. Looking around this room, I see a fascinating tension. We have experimental economists who view norms as stable equilibria—solutions to coordination problems that we stick to because deviation is costly. We have moral philosophers who view norms as expressions of duty, respect, or fairness. And we have our colleagues in administration, who are tasked with translating these abstract ideas into a handbook for incoming international students.

  The question before us is simple, but the answer determines whether that handbook is a helpful guide or a piece of bureaucratic overreach. When a visitor arrives in a new culture, why should they tip the server? Why should they queue for the bus? Why should they wait for the walk signal?

  My friend Dana argues that these conventions bind us only because we are guests. In her view, society is a house, and when you enter, you follow the house rules. If you haven't signed the guest book, so to speak, the obligation is thin. It's a matter of politeness, not morality.

  I am here to argue that Dana is wrong. The obligation does not come from being a guest; it comes from being a participant.

  When you tip a server, you aren't just respecting the restaurant owner's preferences. You are sustaining a cooperative scheme that hundreds of strangers are quietly keeping alive so that everyone's ordinary plans work out. If you stiff the server, you aren't just being rude to a host; you are free-riding on a system of expectations that allows service workers to plan their lives and customers to receive timely care. The obligation arises because you are benefiting from a practice maintained by others, and fairness demands you contribute your share to keep it viable.

  Now, I know this room contains skeptics. To my colleagues in economics: You might say norms are just equilibria. If I tip, and everyone else tips, the equilibrium holds. Why moralize it? Because equilibria are fragile. They collapse when too many people decide to calculate their self-interest in the moment. The sense of *obligation* is the glue that keeps the equilibrium stable when the immediate cost of deviation is low. Without the moral sentiment, the economic model fails.

  To my colleagues in philosophy: You might worry this sounds too utilitarian. But this is about fairness, not just outcomes. It is the principle of fair play. When you enjoy the benefits of a orderly queue, you incur an obligation to stand in line yourself, regardless of whether the "host" is watching.

  This brings us to the handbook our administration is drafting. If Dana is right, that handbook is merely a list of arbitrary house rules. It risks being condescending—"You are a stranger, so do as we say." But if my view is right, the handbook is an invitation. It tells students: "Here is how the cooperative scheme works here. If you want to participate fully in our society, here is how you avoid free-riding on your neighbors." It transforms compliance from subjugation into integration.

  I know the counter-argument. Dana's favorite example is jaywalking at 3 a.m. on a totally empty street. No one is harmed. No equilibrium is threatened. Surely, there is no obligation then?

  I say this exception proves the rule. The reason we hesitate to cross even then is that habits are indivisible. We follow the rule at 3 a.m. to reinforce the disposition that keeps us safe at 5 p.m. But more importantly, even on an empty street, you are interacting with a system designed for public safety. To treat the signal as optional is to treat the system as a personal convenience rather than a public good.

  So, as we begin today, let us proceed on the assumption that conventions are not just local customs to be observed by guests. They are the infrastructure of trust. Our job is not to moralize at students, but to show them how following these conventions allows them to become full partners in the scheme. When we explain the tip, the queue, or the signal, we are not saying "know your place." We are saying "here is how we hold this together."

  Thank you. Let's get to work.

  ***

  I chose your side because the "fair play" argument provides a stronger justification for the handbook than Dana's "guest" theory, which risks sounding paternalistic. However, you got the 3 a.m. jaywalking argument wrong; that case actually weakens your position because if no one benefits and the equilibrium isn't threatened, the "free-riding" claim collapses, suggesting obligation might indeed fade when the social scheme is truly inactive.
