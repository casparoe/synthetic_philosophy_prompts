answer: |-
  **MEMORANDUM**

  **TO:** Surgical Quality and Credentialing Committee
  **FROM:** Graduate Member, Committee
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation Regarding Privileges for Dr. A.

  This memo addresses the credentialing status of Dr. A. following fourteen pancreaticoduodenectomies performed during his eighteen-month tenure. The observed mortality rate of 29% (4 deaths) is alarming, yet it conflicts with his historical performance (1.4% over 148 cases) and the complexity of his current case mix. We must balance patient safety with fairness to the surgeon, avoiding both precipitous action based on statistical noise and negligence masked by methodological ambiguity.

  **Engagement with the Actuarial Model**
  The hospital actuary argues that the hierarchical model's shrunken estimate (9% mortality) settles the dispute by allowing the data to select the comparison class. While mathematically sophisticated, this claim requires philosophical scrutiny. Shrinkage estimators operate on the assumption of "exchangeability"—that Dr. A. is fundamentally similar to the average surgeon in the registry, differing only by random variation. The model pulls his observed 29% toward the mean because fourteen cases are insufficient to prove he is an outlier.

  However, shrinkage is not a moral alibi. It protects surgeons from bad luck, but it also delays the detection of genuine skill decline or environmental mismatch. Dr. A.'s prior record suggests he is not exchangeable with the average surgeon; he is historically superior. Conversely, his current case mix (transfers, arterial involvement) is not exchangeable with the national registry baseline. The model smooths these tensions but does not resolve them. We cannot outsource the decision of "which population matters" to an algorithm. The committee must explicitly decide whether we are judging Dr. A. against his own history, the national average, or our institutional capacity to support complex cases.

  **Recommendation**
  I recommend **proctoring for a specified number of subsequent cases (ten)**, followed by a mandatory re-review. Immediate withdrawal is disproportionate given his historical competence and the high-risk nature of his current referrals. Conversely, unrestricted privileges ignore the signal potential in four deaths. Proctoring ensures real-time oversight of decision-making and technical execution without permanently stigmatizing the surgeon based on a sample size too small for definitive condemnation. This preserves patient safety while acknowledging the statistical uncertainty inherent in low-volume, high-complexity surgery.

  **Criteria for Future Reviews**
  To prevent ad hoc reasoning in future cases, the committee should adopt the following criteria:
  1.  **Pre-defined Reference Classes:** The benchmark population (national, high-volume, or institutional) must be agreed upon during initial credentialing, not selected after outcomes are known. Post-hoc selection of narrow classes to exonerate or convict violates procedural justice.
  2.  **Minimum Volume Thresholds:** Trigger formal review only after a surgeon exceeds a minimum case volume (e.g., twenty procedures) unless cumulative mortality exceeds a hard safety cap (e.g., three deaths). This acknowledges that reliable statistics require sufficient data.
  3.  **Risk-Model Validation:** Internal risk models must be validated against local mortality data annually. Using a model fitted on a national registry to judge local performance introduces systematic error if our intake differs significantly.

  **Informed Consent Figure**
  The consent subcommittee asks for a single mortality figure. Providing the raw 29% sensationalizes small-sample noise; providing the national 2.8% obscures local reality. The most ethically defensible figure is the **actuarial shrunken estimate of approximately 9%**. This number integrates the national baseline, institutional performance, and Dr. A.'s specific history. It honors the patient's right to know the best available prediction without misleading them with unstable data. If forced to choose from standard populations, the institutional rate of 5.9% is the second-best option, as it reflects the system into which the patient is entering.

  **Strongest Consideration on the Losing Side**
  The strongest argument against this recommendation is the raw count of human life. Four patients have died in eighteen months. Regardless of confidence intervals or shrinkage estimators, the immediate priority of a hospital is *primum non nocere*. A proctoring period allows further cases to proceed under the hypothesis that Dr. A. is competent. If he is not, even one additional preventable death is a failure of the committee. Those advocating for temporary withdrawal argue that statistical uncertainty is a luxury we cannot afford when mortality is this elevated. They contend that the burden of proof should lie on the surgeon to demonstrate safety before continuing, rather than on the committee to prove harm before intervening. This view prioritizes immediate risk mitigation over professional equity.

  **Conclusion**
  We must act decisively but justly. Proctoring allows us to gather more data under controlled conditions. By fixing our reference classes and volume thresholds now, we ensure that the next surgeon facing this committee is judged by rules, not rhetoric.

  **Recommendation:** Proctoring for 10 cases; Re-review date set upon completion.
