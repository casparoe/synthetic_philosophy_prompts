answer: |-
  1. **Question:** You distinguish uptake from Relation R by calling it normative. But if normative commitment relies on psychological states, isn't uptake just a selective description of psychological connectedness?
  **Pressure Note:** Calling it normative doesn't change the metaphysical dependency on psychology, risking a collapse back into standard reductionism.
  **Follow-up:** If normativity distinguishes them, are you positing two distinct relations where Parfit saw one, and does this not complicate the reductionist ontology you endorse?

  2. **Question:** Critics argue making survival depend on a successor's attitude makes it hostage to factors outside my control. You reply contingency is inevitable. But does this not undermine the rationality of anticipating that future?
  **Pressure Note:** Asserting contingency is inevitable does not justify why *this specific* contingency preserves prudential rationality.
  **Follow-up:** If contingency is acceptable, must I not regard a successor who rejects my projects as a stranger, thereby dissolving the special concern uptake was meant to ground?

  3. **Question:** My mother retains uptake of her cares despite losing autobiographical memory. On your view, does the person who wrote her advance directive still exist, and is your verdict meant to console or unsettle a family facing her choice?
  **Pressure Note:** Affirming existence validates the directive; denying it validates current contentment, but both choices have painful moral costs.
  **Follow-up:** If the person exists: Does your view imply we should honor the directive despite her contentment, and is that conclusion intended to console us with consistency or unsettle us with loss?

  4. **Question:** A stranger finds my journal, adopts my life's work, and continues my projects without any causal link to my brain. Has she achieved uptake, and what does your view forfeit whichever way you answer?
  **Pressure Note:** Either choice concedes that uptake alone is insufficient to ground what matters in survival.
  **Follow-up:** If causation is required: Doesn't this concede that the historical chain matters more than the functional uptake, effectively restoring the standard psychological continuity view?

  5. **Question:** If two replicas both take up my commitments, is that survival twice over, no better than one, or worse? If twice as good, does your refinement quietly restore the non-branching requirement you were trying to dispense with?
  **Pressure Note:** Aggregating value treats survival like utility, while denying it treats uptake like identity, contradicting the reductionist motive.
  **Follow-up:** If it is twice as good: Does this mean I should rationally prefer branching destruction over continuous survival, and does that not collapse survival into a maximization problem?

  6. **Question:** Biological theorists say we are human organisms, and my mother's organism plainly persists. What does uptake add to or subtract from that claim, without dismissing the organism as morally inert?
  **Pressure Note:** Ignoring the organism's persistence risks ignoring the locus of suffering and care that families actually encounter.
  **Follow-up:** If biology is secondary: Why should a family ignore the biological organism's evident contentment when your metaphysics suggests the person who wrote the directive is gone?

  7. **Question:** If reductionism is true and persons are just relations, does the special self-interested concern each of us has for our own future lose its rational footing? Do you accept this consequence or block it, and on what grounds?
  **Pressure Note:** Blocking it requires reintroducing a robust self that reductionism denies; accepting it undermines prudential rationality.
  **Follow-up:** If concern is grounded in relations: Does this imply I am rationally permitted to care less about my future self than about a stranger who shares more of my commitments?

  8. **Question:** On your account, can an advance directive bind when uptake shifts to a new psychological profile? Please answer metaphysically, not legally, regarding whether the past self retains authority.
  **Pressure Note:** Granting authority privileges the past; denying it renders all long-term planning morally precarious.
  **Follow-up:** If present uptake overrides: Does this mean a demented self can morally veto a competent self's directive, and what does that imply for the concept of precedent autonomy?

  9. **Question:** What case or argument would make you abandon uptake and concede that identity rather than Relation R is what matters?
  **Pressure Note:** If no empirical case counts, the view risks being unfalsifiable; if identity is conceded, the reductionist project fails.
  **Follow-up:** If nothing counts against it: Does this suggest uptake is not a discovery about survival, but a prescription for how we ought to feel about it?
