answer: |-
  # The Ash Baseline

  The book lay on the laminate table between the water pitcher and the microphone. *The Empty Silos: Policy and Starvation in Vessia*. My name was on the spine. It looked smaller than I remembered, the font timid against the grey cover stock.

  I am Dr. Aris Thorne, historian for the Attribution Commission. To my left sat Dr. Lin, a climatologist who chewed his pen caps when the data grew ambiguous. To my right was Dr. Sato, an epidemiologist who had not looked up from her tablet in forty minutes. We were the Panel. Across from us, the legal teams for the Republic of Vessia and the Vessian Survivors' Consortium adjusted their collars. And in the corner, standing as he had for three days, was Mr. Vane, Advocate for the Non-Human Party.

  The air in the hearing room was recycled and cool, smelling faintly of ozone and toner. Outside, the city of Geneva continued its indifferent Tuesday. Inside, we were deciding whether the famine of the Grey Twenties was a murder or a tragedy. The distinction governed three billion credits in sovereign debt and the wording of every history textbook printed in the member states for the next decade.

  "Counselor," I said, addressing the woman representing the Survivors. "You are requesting the Commission adopt a counterfactual baseline wherein Mount Kaelo never erupted."

  "That is correct, Dr. Thorne," she said. Her voice was tight. She wanted the Special Catastrophe Fund. To access it, the natural event fraction had to exceed ninety percent. If the volcano was the sole actor, the Fund paid. If human policy shared the blame, the debt remained with the Republic. The Republic was bankrupt. The Fund was not.

  "And the State?" I turned to the man in the dark suit.

  "The State proposes the baseline wherein the eruption occurred, but the Grain-Reserve Ordinance remained in force," he said. He wanted total exoneration. If the grain reserves would have failed anyway, then the repeal of the ordinance was irrelevant. Policy fraction: zero. Natural fraction: one hundred. Debt: void.

  My book, *The Empty Silos*, argued that the repeal of the ordinance was the deciding factor. I had spent five years in the archives of Vessia proving that the silos had been full enough to bridge the ash winter, had they not been sold off to service interest payments two years prior. If my research held, the policy fraction was high. The State would owe the debt it could not pay. The Survivors would get no Fund money. Everyone loses, except the truth.

  "The data," Lin said, leaning forward. "You understand that neither baseline is observable. We are modeling ghosts."

  "The model is the treaty," the State counsel replied. "Article 4 requires us to isolate the variable. The Survivors wish to isolate the volcano. We wish to isolate the policy."

  "They yield different fractions," I said. "The 'No Eruption' baseline suggests a ninety-two percent natural attribution. The 'Ordinance Stood' baseline suggests sixty-five percent. The difference is twenty-seven percent of the national budget."

  "That is why we are here," the Survivors' counsel said. She glanced at my book. "Dr. Thorne's own work suggests the silos were sufficient. If the silos were sufficient, then the 'Ordinance Stood' baseline is a fiction. The state is asking you to model a rescue that was possible. We are asking you to model the world as it would have been without the interference of the mountain."

  I felt the heat rise in my neck. They were using my life's work to trap me. If I accepted their baseline, I validated the Fund but invalidated my conclusion that the government was negligent. If I accepted the State's baseline, I validated my conclusion that the government was negligent (because the silos would have saved them), but the State would argue the silos *wouldn't* have saved them.

  "The data alone cannot settle which baseline is legitimate," I said. I kept my voice flat, procedural. "We have ash depth records. We have caloric intake estimates. We do not have a record of a world where Kaelo slept. We do not have a record of a world where the silos remained full under ash fall. The mathematics can process the inputs, but it cannot choose the starting point."

  "Then who chooses?" Lin asked. He looked at me.

  "The Panel," I said.

  ***

  The recess was ten minutes. I stood by the window, looking down at the courtyard where people walked without looking up. Behind me, the hum of the air purifier was the only sound.

  Mr. Vane approached. He wore a grey suit that seemed to absorb the light. He carried no briefcase. He was the Advocate for the Non-Human Party, a standing officer required by the Treaty of Oslo. His job was to represent the interests of the event itself, since the event cannot instruct counsel, cannot settle, and cannot be blamed.

  "Dr. Thorne," he said. He did not look at the book on the table.

  "Mr. Vane."

  "You are troubled by the baselines."

  "I am troubled by the arithmetic," I said. "If we choose the Survivors' baseline, we erase the policy failure. If we choose the State's baseline, we erase the survival possibility. Both sides want to use the volcano to hide a human decision."

  Vane nodded slowly. "The volcano does not care about the ordinance."

  "No."

  "It does not care about the debt," Vane said. "It does not care about the textbook. It erupted. It ejected twelve cubic kilometers of tephra. It blocked the sun. It cooled the stratosphere. These are facts. The Commission's task is not to judge the mountain. It is to judge the fraction of the outcome that belongs to the mountain versus the fraction that belongs to the people who stood beneath it."

  "The fraction determines who pays," I said. "If the mountain's fraction is high, the people are absolved of the debt. If it is low, they are liable. It is a financial instrument disguised as history."

  "It is a recognition of force," Vane said. He turned to look at the empty chair where the representative of Mount Kaelo would sit if forces could sit. "When you write your history, Dr. Thorne, do you describe the wind as a collaborator in the fire?"

  "I describe the conditions."

  "Conditions are not actors. But here, we must make them actors to measure them." He turned back to me. "The State argues that the ordinance was irrelevant. They claim the ash would have rotted the grain anyway. The Survivors argue the ash was the sole cause. They claim the grain would have fed everyone. Both are trying to shrink the human sphere. One to avoid payment, the other to access the Fund."

  "And my book?"

  "Your book says the humans failed," Vane said. "It says the grain was there, but the decision was made to sell it. That assigns a high fraction to policy. That leaves the mountain with only the background noise. If you sign a finding that honors your book, the Republic defaults. The schools will teach that the government starved Vessia. If you sign a finding that honors the State, the schools will teach that the mountain starved Vessia. The debt is waived."

  "I am a historian," I said. "I am not here to manage the economy."

  "You are here to assign the fraction," Vane said. "The economy will manage itself around your signature. The question is whether you will assign the weight of the ash to the ash, or to the hands that held the shovel."

  He returned to his corner. I sat down. Lin and Sato were waiting.

  "The epidemiological model favors the State," Sato said without looking up. "Malnutrition rates were rising before the eruption. The population was vulnerable. Even with the grain, the mortality would have been significant. I can justify a sixty percent natural attribution."

  "The climatic model favors the Survivors," Lin said. "The temperature drop was outside the standard deviation. It was a black swan. Policy cannot account for a black swan. I can justify ninety percent."

  They looked at me. The historian holds the tie-breaking vote on the narrative baseline. The scientists provide the coefficients; I provide the context.

  "If we go with the State," I said, "we validate the repeal of the ordinance. We say it didn't matter."

  "If we go with the Survivors," Lin said, "we validate the Fund. We say it was an Act of God."

  "My book says the repeal mattered," I said. "It says the grain was sufficient."

  "Then you must rule against your book," Sato said. "To give the State the relief they need to function, you must accept their baseline. If you accept your own research, you crush them."

  "It's not about crushing them," I said. "It's about the textbook. If we rule for the State, the children of Vessia will learn that their grandparents died because of a volcano. If we rule for my book, they will learn they died because of a vote in parliament."

  "And the debt?" Lin asked.

  "If the debt stands, the Republic collapses. The schools close. There are no textbooks."

  The bailiff knocked. Session resuming.

  ***

  We returned to the table. The light had shifted; the dust motes were dancing in the beam from the high window. The State counsel looked hopeful. The Survivors' counsel looked tired. Vane stood like a statue.

  "The Panel is ready to issue the finding," I said.

  I picked up the pen. The document before me was pre-filled with the coefficients from Lin and Sato. The only blank space was the Baseline Determination.

  Option A: Counterfactual No-Eruption. (Natural Fraction: 0.92).
  Option B: Counterfactual Ordinance-Stood. (Natural Fraction: 0.65).

  If I checked A, the State got relief. The Fund paid the survivors. My book was effectively overridden as a legal instrument, though it remained on the shelf.
  If I checked B, the State owed the debt. They would default. The survivors would get nothing but the moral victory of my footnote.

  "The Commission finds," I read, my voice echoing slightly in the quiet room, "that the catastrophe of the Grey Twenties was substantially the doing of a natural event."

  I paused. The State counsel exhaled. The Survivors' counsel closed her eyes.

  "However," I continued.

  I looked at Vane. He gave no signal. He was the Advocate for the Non-Human, but he was a man. He wanted the mountain to have its due, but he knew the mountain did not need the money.

  "The Commission finds that the policy environment exacerbated the outcome," I said. I was deviating from the script. The script required a fraction. "The baseline selected is... modified."

  Lin shifted in his chair. "Dr. Thorne?"

  "We cannot select a baseline that erases the human decision," I said. I looked at the State counsel. "The Ordinance repeal was a proximate cause. The debt is not voided."

  I looked at the Survivors. "But the magnitude of the event exceeds standard policy mitigation. The Fund is accessible."

  "That is not a binary option," the State counsel said, standing up. "The Treaty requires a fraction."

  "The fraction is split," I said. "Fifty percent natural. Fifty percent policy."

  "That is not supported by the data," Sato said sharply.

  "The data does not settle the baseline," I replied. "I am settling it."

  I moved the pen to the paper. I did not check Box A or Box B. I wrote in the margin, *Hybrid Baseline: Event Initiated, Policy Terminated.*

  It was irregular. It would be appealed. It would likely be overturned by the Oversight Committee. But for this moment, the finding was mine.

  The State counsel sat down heavily. The Survivors' counsel opened her eyes. They both knew what this meant. Partial debt relief. Partial payout. No clear villain. No clear victim. Just a shared burden written into the ledger.

  Vane nodded, once. It was not approval. It was acknowledgment.

  I signed the document. The ink was black, wet, and slow to dry. I pressed the nib hard into the paper, feeling the scratch of the fiber, the resistance of the page. When I lifted the pen, a small dot of ink remained on the tip, trembling slightly before falling onto the table, joining the dust motes settling on the laminate surface.
