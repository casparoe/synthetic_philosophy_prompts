  **Planning Sketch**

  *   **Beat 1 (Recap):** Describe the Sleeping Beauty protocol as a standard operational workflow. *Laugh:* The matter-of-fact description of memory erasure as a routine logistical step comparable to clearing a trade.
  *   **Beat 2 (Arb Loss):** Detail two P&L leaks caused by mismatching credence pricing (1/2 vs 1/3) with settlement frequency (per-experiment vs per-awakening). *Laugh:* The arithmetic shows the loss is inevitable if identity over time is treated inconsistently; the "error" is metaphysical, not computational.
  *   **Beat 3 (Compliance Box):** The auto-reoffer feature (double stake on forgetting). *Laugh:* Compliance treats the customer's memory wipe as a consent issue, but the memo frames it as a liquidity boost dependent on an unresolved question of personal identity.
  *   **Beat 4 (Day Market):** The unsettleable "What Day Is It?" market. *Laugh:* The settlement agent (the subject) is epistemically unreliable on Tuesdays, making the contract void ab initio without stating why philosophically.
  *   **Beat 5 (Analysts):** Two analysts (Halford and Thirdman) with divergent prices. *Laugh:* The desk claims neutrality while their P&L attribution proves one must be wrong; the "impossibility" is in the spreadsheet, not the text.
  *   **Beat 6 (Risk Engine):** The database schema lacks an "indexical" field. *Laugh:* Treating "today" as a missing data type rather than a conceptual problem; conditionalisation fails because SQL cannot parse "now".
  *   **Beat 7 (Closing):** Managerial absurdity. *Laugh:* Resolving an epistemic paradox by mandating both models simultaneously, prioritising bonus structures over truth.

  ***

  **INTERNAL CIRCULAR**

  **TO:** Trading Desk; Compliance Officer; J. Miller (Junior Analyst)
  **FROM:** Head of Derivatives
  **DATE:** 14 October 2023
  **REF:** TD-AWAKE-004
  **SUBJECT:** Awakening Product: Settlement Protocols and Exposure Limits

  **1. Product Specification**
  The Awakening Product involves a single subject placed in suspended animation on Sunday. A fair coin is tossed. If Heads, the subject is activated once (Monday). If Tails, the subject is activated twice (Monday and Tuesday). Between activations, amnestic agents are administered to erase memory of the prior activation. Upon each activation, the subject quotes a price on the coin toss outcome. The firm takes the counterparty position. Note that activations are indistinguishable to the subject.

  **2. Recent Exposure Incidents**
  Two arbitrage losses were realised this quarter due to inconsistent settlement logic.
  *Incident A:* Contracts were priced at 0.50 (implying equal weight to Heads/Tails) but settled per activation. On Tails outcomes, the firm paid out twice per experiment while collecting premium once. Net loss: 25% of book value.
  *Incident B:* Contracts were priced at 0.33 (implying weight proportional to activations) but settled per experiment. On Heads outcomes, the firm paid out full value on a single activation despite pricing for three. Net loss: 16% of book value.
  Traders must align pricing models with settlement frequency. You cannot price per awakening and settle per coin toss without inviting exploitation.

  **3. Analyst Pricing Models**
  Desk analysts are currently running parallel models.
  *Model H (Lead Analyst: S. Halford):* Prices Heads at 0.50. Rationale: Coin fairness is invariant to activation count.
  *Model T (Lead Analyst: T. Thirdman):* Prices Heads at 0.33. Rationale: Activation frequency dictates credence.
  The desk remains neutral. However, P&L attribution shows Model H bleeds on Tails volume, while Model T bleeds on Heads payout. Traders are advised to note that both models cannot be profitable simultaneously given the same liquidity pool. Please select one exposure limit per shift.

  **4. Risk Engine Limitations**
  IT Ticket #8990 remains open. The risk engine cannot represent the subject's evidence state because the database schema lacks a field for indexicals. The system records timestamps (Monday 09:00, Tuesday 09:00) but cannot process the subject's input "Today". Consequently, standard conditionalisation protocols fail when the learning event cannot be expressed without temporal self-location. Until patched, manual overrides are required for any bet contingent on "current awakening".

  **5. Secondary Markets**
  The market on "Current Day: Monday/Tuesday" is suspended. Settlement requires verification by the subject. However, subject testimony is systematically unreliable on Tuesdays due to induced uncertainty regarding prior activation. As the only available settlement agent is epistemically compromised during half the sample space, the contract is currently voidable. Compliance is reviewing whether offering a market on unverifiable data constitutes a breach of Conduct Rules.

  > **COMPLIANCE NOTE: AUTO-REOFFER FEATURE**
  > A new functionality allows bets placed at activation one to be automatically re-offered at activation two at double the stake, subject having no memory of the initial transaction.
  > *Query:* Does this constitute a new contract or a modification of the old?
  > *Risk:* If the subject is the same person, this is double exposure. If the subject is a distinct temporal stage, this is distinct business.
  > *Action:* Traders must flag this as "Product Innovation" until Legal determines whether personal identity persists across amnestic barriers. Do not classify as "Liability" unless forced.

  **6. House Position**
  Effective immediately, traders will quote both 0.50 and 0.33 depending on client flow, hedging the difference against the firm's proprietary book. We do not need to resolve the metaphysical status of the subject to capture the spread. If the book loses money, assume the client's credence was incorrect, not the model. Proceed.
