answer: |-
  # Adjudication of the Nadia-Ezra Dispute

  ## 1. Brainstorming Candidate Loci of Effect

  To adjudicate this, we must map the processing stream from stimulus to report and determine which stage predicts the specific dissociation observed in Nadia's data (PSE shift + Masked effect vs. Null Rivalry effect).

  | Candidate Locus | Mechanism | Predicted Signature (Sham/Masked) | Consistency with Data |
  | :--- | :--- | :--- | :--- |
  | **Early Motion-Energy** | Low-level filtering of dot trajectories. | **Measure 2 (Rivalry):** Should shift dominance durations immediately.<br>**Measure 3 (PSE):** Should shift sensitivity ($d'$), not just bias.<br>**Masked:** Should persist if pre-attentive. | **Inconsistent.** Measure 2 is null. Measure 3 shows bias, not sensitivity change. |
  | **Bistable Competition** | Neural adaptation/inhibition governing percept switches. | **Measure 2:** Primary locus. Dominance durations must change if the perceptual state is biased.<br>**Measure 1:** First percept should shift strongly.<br>**Measure 3:** Should shift if competition is biased. | **Inconsistent.** Measure 2 is explicitly null. This is the strongest evidence against a perceptual locus. |
  | **Spatial/Feature Attention** | Gain control on motion-sensitive areas. | **Measure 2:** Often affects rivalry rates, but can be transient.<br>**Measure 3:** Strong candidate for PSE shifts without $d'$ changes.<br>**Masked:** Attention can be captured exogenously by masked cues. | **Possible.** Explains PSE and Masked data. Ambiguous on Rivalry (depends on sustained vs. transient attention). |
  | **Prior over States** | Bayesian prior on rotation direction. | **Measure 2:** Should bias the posterior probability, lengthening dominance of cued direction.<br>**Measure 3:** Shifts PSE.<br>**Sham:** Should extinguish quickly if contingency is 0%. | **Inconsistent.** The persistence in Sham/Masked despite explicit 0% contingency suggests this is not a rational prior update. Null Rivalry is problematic. |
  | **Decision Criterion (SDT)** | Shift in response threshold ($\beta$) independent of sensory evidence. | **Measure 2:** **No effect.** Rivalry is pre-decisional.<br>**Measure 3:** **Strong effect.** PSE shifts are the hallmark of criterion bias in 2AFC.<br>**Measure 1:** Small shift possible (guessing bias).<br>**Masked:** Response priming can mimic criterion shifts. | **Highly Consistent.** Fits the dissociation between Measure 2 (null) and Measure 3 (shift). Fits the "cost-free" nature of the bias. |
  | **Response Selection/Label** | Mapping percept to button press/word. | **Measure 1 & 3:** Shifts expected.<br>**Measure 2:** No effect.<br>**Masked:** Difficult to explain unless subliminal response priming is invoked. | **Consistent.** Matches the dissociation. Ezra's "priming" argument relies on this. |
  | **Demand/Compliance** | Participant trying to help the experimenter. | **All Measures:** Should shift.<br>**Sham:** Should vanish if debriefed/paid for accuracy.<br>**Masked:** Should vanish (cannot comply with unseen cue). | **Inconsistent.** Effect survives debrief, payment, and masking. |
  | **Memory/Report Stage** | Bias introduced when recalling/encoding the decision. | **Measure 3:** Shift possible.<br>**Measure 2:** No effect (online percept).<br>**Masked:** Unlikely to affect memory if cue isn't encoded. | **Partially Consistent.** Doesn't explain Masked PSE shift well. |

  **Summary of Signatures:** The critical diagnostic is the dissociation between Measure 2 (Rivalry) and Measure 3 (PSE). A purely perceptual change (Early, Competition, Prior) generally predicts changes in Rivalry dynamics. A decisional/change-in-criterion change predicts PSE shifts *without* Rivalry shifts. The data show the latter pattern.

  ---

  ## 2. Adjudication of the Seven Moves

  **Move 1 (Nadia): "Measure (3) is... a bias in the point of subjective equality... There is no strategy available... The encapsulation thesis is empirically false."**
  *   **Rating:** **Mostly Mistaken.**
  *   **Justification:** Nadia makes a category error common in philosophy but known in psychophysics: equating PSE shifts exclusively with perceptual changes. In Signal Detection Theory, a shift in criterion ($\beta$) moves the psychometric function horizontally (changing PSE) without altering sensitivity ($d'$). Participants *always* have a strategy available: "When in doubt, pick the cued side." Since the PSE task relies on near-ambiguous mixtures, "doubt" is frequent. The claim that encapsulation is falsified rests on the assumption that PSE = Perception, which is not warranted given Measure 2.

  **Move 2 (Ezra): "A shifted point of subjective equality is precisely what a shifted decision criterion predicts... Measure (2) is the tell... rivalry dynamics track the strength of the underlying perceptual representation."**
  *   **Rating:** **Clearly Right.**
  *   **Justification:** Ezra correctly identifies the standard interpretation of PSE shifts in 2AFC tasks. More importantly, he correctly identifies Measure 2 (bistable dominance) as the superior proxy for *phenomenal* state. In bistable perception, dominance duration is driven by the energy of the underlying neural representation. If the cue altered the *experience* of rotation, the rivalry dynamics would necessarily shift. The null result on Measure 2 is the strongest empirical evidence in the dataset, and Ezra leverages it correctly.

  **Move 3 (Nadia): "Then explain the masked condition... A cue that nobody can report still shifts a fine-grained visual judgment, which places the effect upstream of report."**
  *   **Rating:** **Mixed (Plausible Premise, False Conclusion).**
  *   **Justification:** Nadia is right that masked cues preclude conscious compliance strategies. However, her inference that this places the effect "upstream of report" (i.e., in perception) is a non-sequitur. Subliminal response priming is a well-documented *decisional/motor* phenomenon. A masked word can activate a motor code (e.g., "left button") without altering the visual representation of the sphere. The effect is upstream of *conscious* report, but not necessarily upstream of *decision*.

  **Move 4 (Ezra): "A masked cue... is a subliminal prime, and subliminal priming is a bottom-up associative process... You have two unrelated mechanisms."**
  *   **Rating:** **Clearly Right.**
  *   **Justification:** Ezra correctly distinguishes between "Cognitive Penetration" (typically defined as top-down influence of belief/concept on perception) and "Subliminal Priming" (automatic associative activation). If the Masked condition drives the effect, it is not mediated by the participant's *beliefs* about the cue (since they have none). This undermines Nadia's specific philosophical claim about belief altering experience. Furthermore, if the Sham effect is belief-driven and the Masked effect is priming-driven, Nadia cannot claim a unified phenomenon of "penetration."

  **Move 5 (Nadia): "A rational observer should assign that cue zero weight... That is penetration that no inference licenses."**
  *   **Rating:** **Mistaken.**
  *   **Justification:** This relies on a normative model of rationality that human subjects rarely satisfy, especially in mixed-block designs. Proactive interference from the Informative blocks (which preceded the Sham blocks, per Ezra's Move 6) is a standard learning confound. Humans are slow to update priors when contingencies switch. The persistence of the bias indicates imperfect learning or habit, not necessarily a violation of encapsulation. It shows the system is "irrational," not that it is "perceptual."

  **Move 6 (Ezra): "Cost-sensitivity is a signature of the decision stage... going along with the cue costs the participant essentially nothing in accuracy."**
  *   **Rating:** **Clearly Right.**
  *   **Justification:** This is the most damaging empirical point against Nadia. In the Rivalry task (Measure 2), the percept is robust and stable; biasing it requires fighting strong sensory evidence. In the PSE task (Measure 3), the stimuli are by definition near-threshold mixtures. Biasing the response here costs no accuracy points. A decisional system optimizes effort/reward; a perceptual system does not "know" about the payoff matrix. The fact that the bias appears only where it is cost-free is a signature of decisional control.

  **Move 7 (Nadia): "If a word... can direct attention... and attention... changes what is seen, then the encapsulation thesis has been defined so as to be unfalsifiable."**
  *   **Rating:** **Philosophically Right, Empirically Weak.**
  *   **Justification:** Nadia scores a philosophical point here: if "perception" includes all attention-modulated processes, encapsulation becomes trivial. However, she loses the empirical argument. Even if we grant that attention is "perceptual," she has not shown that attention *mediated* this effect. Ezra's decisional account explains the data without needing to invoke attention at all. She is arguing for a definition of modularity that would make her thesis true by fiat, rather than providing evidence that attention was the mechanism.

  ---

  ## 3. Substantive vs. Verbal Disagreement

  Much of this dispute is verbal, hinging on definitions that obscure the empirical reality.

  **Verbal/Taxonomic Disputes:**
  1.  **"Cognitive" vs. "Associative":** Nadia treats any top-down influence as "cognitive penetration." Ezra distinguishes between belief-driven effects (Cognitive) and automatic priming (Associative). The Masked condition result suggests the mechanism is associative. If "Cognitive Penetration" requires conceptual/belief mediation (as is standard in the philosophy of mind), Nadia's claim fails on the Masked data alone.
  2.  **"Perceptual" vs. "Decisional":** Nadia equates "bias in judgment" with "change in experience." Ezra distinguishes between the *content* of experience (Rivalry/Measure 2) and the *report* of experience (PSE/Measure 3).
  3.  **"Encapsulation":** Nadia defines it as "immune to all top-down influence." Ezra defines it as "immune to belief/expectation in the formation of the perceptual state."

  **Substantive Disputes:**
  1.  **The Locus of the Bias:** The core empirical disagreement is whether the PSE shift reflects a change in the likelihood function (Perceptual) or the prior/criterion (Decisional).
  2.  **The Weight of Measure 2:** Nadia treats the null Rivalry result as irrelevant; Ezra treats it as decisive. Substantively, they disagree on whether bistable dominance durations are a valid proxy for perceptual content in this context. (They are).
  3.  **Rationality of the Subject:** Nadia assumes subjects should behave as ideal Bayesians (bias should vanish in Sham). Ezra assumes subjects are heuristic learners (bias persists due to cost-benefit analysis and slow updating).

  **What Must Be Fixed:**
  To make this a well-posed empirical question, they must stipulate: **"Cognitive Penetration" requires that (a) the effect is mediated by a cognitive state (belief/expectation) and (b) the effect alters the phenomenal character of the experience (not just the report).**
  *   Under this definition, the Masked condition fails (a) (no belief).
  *   Under this definition, the Sham condition fails (b) (no Rivalry shift).
  *   Nadia's claim is empirically unsupported under rigorous definitions.

  ---

  ## 4. What Both Are Missing & Proposed Control

  **What is Missing:**
  Both are treating the PSE shift as a monolithic metric. They are missing **Response Time (RT) distributions** and **Confidence Ratings**.
  *   **Decisional Bias:** Typically produces faster RTs for cued responses and slower RTs for uncued responses, with no change in the *shape* of the accuracy curve, only the intercept. Confidence should not increase for cued trials if the percept hasn't changed.
  *   **Perceptual Bias:** Should improve sensitivity ($d'$), changing the slope of the psychometric function, not just the intercept. Confidence should increase for cued trials because the signal is genuinely stronger.

  **Proposed Control:**
  Add a **Perceptual Matching Task** as a fourth measure.
  *   **Design:** Instead of a 2AFC judgment (CW vs. CCW), the participant views the ambiguous sphere, then views a *second* sphere with unambiguous motion. They must adjust the speed/direction of the second sphere to *match* the appearance of the first. No categorical labels (CW/CCW) are used.
  *   **Rationale:** This removes the decision criterion regarding category labels. If the cue alters the *experience*, the matching adjustment should shift. If the cue alters only the *decision rule* for labeling, the matching adjustment should remain veridical (unbiased).
  *   **Predicted Pattern:**
      *   **If Nadia is right (Perceptual):** Matching adjustments shift in the cued direction in Sham/Masked blocks.
      *   **If Ezra is right (Decisional):** Matching adjustments show no bias, even while 2AFC reports do.
  *   **Tie-Breaker:** Given the null Rivalry result, I predict the Matching task will show **no bias**. This would confirm the effect is confined to categorical labeling/decision criteria, vindicating Ezra.

  ---

  ## 5. Discussion Section Wording

  **Acceptable Wording (Safe):**
  > "These results demonstrate a robust cue-induced response bias that persists despite explicit knowledge of cue invalidity and survives subliminal presentation, suggesting a dissociation between perceptual stability (as indexed by rivalry dynamics) and categorical decision criteria."

  **Indefensible Wording (Unsafe):**
  > "These results prove that high-level beliefs directly alter the content of visual experience, falsifying the modularity of perception."
  *(Why indefensible: The data show a decisional dissociation (PSE yes, Rivalry no) and a priming effect (Masked), neither of which necessitates a change in phenomenal content or belief mediation.)*
