answer: |-
  This is a precise pedagogical challenge. You are not teaching psychology; you are teaching *facilitation triage*. You need them to diagnose emotional states in real-time to prevent harm and promote repair.

  Here is the plan for the ninety minutes.

  ### 1. The Sequence: Why Order Matters

  You asked specifically whether the **action-tendency asymmetry** (guilt moves toward repair, shame moves toward hiding) can be taught before the **audience question** (the mother accusing the son of having no shame).

  **It must be taught first.**

  If you present the mother's accusation ("He has no shame") before defining the behavioral markers of shame, the room will split immediately along their existing biases. The wellness group will hear "abuse," and the older volunteers will hear "tough truth." They will argue about the *mother*, not the *mechanism*.

  By teaching the action-tendency first, you give them a diagnostic tool. When they eventually hear the mother's line, they are forced to ask: *"Is the boy hiding? Is he defending? Or is he engaging?"* You move them from moral judgment of the mother to functional analysis of the room.

  **The Flow:**
  1.  **Somatic/Behavioral Definition (0–25 mins):** How do we *see* the difference in the circle? (Action-tendency).
  2.  **The Central Case (25–60 mins):** Applying the lens to a specific, unresolved scenario.
  3.  **Intervention & Culture (60–90 mins):** What do we *do* when we see shame, and what is our program's stance?

  ### 2. The Central Case: "The Silent Vandal"

  Do not use a thought experiment, but do not use a raw, unedited transcript of your own work (too much emotional baggage for trainees). Use a **composite vignette** based on the "Mother/Son" conflict you described, but stripped of specific identifying details.

  **What the Case Must Contain:**
  *   **The Offense:** Property damage (vandalism). Concrete, reparable.
  *   **The Youth:** 15 years old. Sitting with arms crossed, looking at the floor. Answering questions with "I don't know" or shrugs.
  *   **The Mother:** Frustrated. She says, *"I brought him here to own it, but he doesn't care. He has no shame."*
  *   **The Harmed Party:** Confused. They want an apology but feel the boy is being coerced.
  *   **The Facilitator (in the vignette):** Pauses the conference after the mother's outburst.

  **What the Case Must Conspicuously Lack:**
  *   **A Confession:** The boy never admits *why* he did it in the text. This prevents the trainees from assuming guilt is present.
  *   **A Resolution:** Do not tell them how the conference ended. The training is about the *pivot point*, not the outcome.
  *   **Internal Monologue:** Do not tell the trainees what the boy is feeling. They must deduce it from behavior.

  **Why this case?**
  It forces the trainees to confront the "No Shame" accusation. Is the boy's silence shame (hiding/disappearing) or is it defiance (refusal to engage)? If it is shame, the mother's comment just increased it. If it is defiance, the mother's comment might be accurate, but unhelpful. This case bridges your "private shame" example (internal feeling) and the "public accusation" (external witness).

  ### 3. Mapping the Misconceptions

  You have three distinct belief systems in the room. You cannot argue them down at the end; you must inoculate against them during the sequence.

  **A. The Wellness View ("Shame is always damaging")**
  *   **When it arises:** During the Definition phase (0–25 mins).
  *   **The Risk:** They will decide shame is a virus to be eradicated.
  *   **How to head it off:** Do not define shame as "toxic." Define it as **social pain**. Just as physical pain tells you to move your hand from the stove, shame tells you that your social standing is at risk. It is a signal, not a disease. It becomes toxic only when there is no path to reintegration.
  *   **The Line:** *"Shame is not the enemy. Isolation is the enemy. Shame becomes toxic when we leave the person in the shame without a bridge back."*

  **B. The Old Guard View ("Some kids have no shame")**
  *   **When it arises:** During the Case Study (25–60 mins).
  *   **The Risk:** They will use the "no shame" label to justify harshness or give up on the youth.
  *   **How to head it off:** Reframe "no shame" as "shame avoidance." Aggression, silence, and humor are often armor *against* shame. If a kid acts like they don't care, they are often protecting themselves from caring too much.
  *   **The Line:** *"In fifteen years, have you ever met a fourteen-year-old who truly did not care what their mother thought? Or have you met fourteen-year-olds who could not survive the feeling of disappointing her?"*

  **C. The Emergent View ("Guilt is good, Shame is bad")**
  *   **When it arises:** During the Intervention phase (60–75 mins).
  *   **The Risk:** They will try to "make" the kid feel guilty.
  *   **How to head it off:** Clarify that guilt is not a goal; repair is. Guilt is just the fuel. If you force guilt, you create shame.
  *   **The Line:** *"We do not manufacture guilt. We create safety so guilt can turn into repair."*

  ### 4. The Assessment: "The Script Flip" (Last 10 Minutes)

  Do not ask them to define the terms. Do not ask for a show of hands. You need to see if they can *intervene*.

  Give them a single paragraph of script where a facilitator makes a mistake.

  **The Script:**
  > **Facilitator:** "Jason, look at Mrs. Gable. Do you understand how much work it took to fix this fence?"
  > **Jason:** (Looks at shoes) "Yeah."
  > **Facilitator:** "Say it to her. Tell her you're sorry for what you did."
  > **Jason:** "Sorry."
  > **Facilitator:** "Good. Now tell her why you did it."
  > **Jason:** (Shoulders rise up toward ears, voice gets quiet) "I don't know."

  **The Task:**
  Ask them to write down **one sentence** the facilitator should have said differently at the exact moment Jason's shoulders rose.

  **What tells you it landed:**
  *   **Failed:** They focus on the apology ("Make him say sorry properly") or they focus on the feelings ("Ask him how he feels").
  *   **Passed:** They focus on the **shame signal** (the shoulders/voice) and offer a **bridge**.
      *   *Example:* "It looks hard to talk about this. We can take a minute."
      *   *Example:* "You don't have to explain why right now. Just knowing you're sorry helps."
  *   **Why:** This shows they recognized the shift from guilt (apology) to shame (hiding/voice change) and attempted to reduce the threat rather than increase the pressure.

  ### 5. What to Leave Out (and Announce It)

  You have 90 minutes. You must explicitly state what you are *not* doing to prevent the "Culture Question" from eating the session.

  **1. The Philosophical Culture Question**
  *   **The Question:** "Can a group decide which of the two it runs on?"
  *   **Decision:** **Defer the societal question; Answer the program question.**
  *   **Where to put it:** In the final 10 minutes, after the assessment.
  *   **How to frame it:** Do not ask *"Can culture choose?"* Ask *"What culture does **this room** choose?"*
  *   **The Statement:** *"Societies run on mixtures of both. But this program runs on a specific choice: We use guilt to drive accountability, and we actively manage shame to prevent withdrawal. We do not decide this for the world tonight. We decide it for this circle."*
  *   **Why:** This satisfies the intellectual curiosity without opening a 45-minute debate on sociology that you cannot win in a training session.

  **2. The "Private Shame" Paradox**
  *   **The Issue:** Your example of the boy who stole with no witness but felt shame.
  *   **Decision:** **Mention it only as a footnote during Definitions.**
  *   **Why:** Facilitators cannot see internal shame without a witness. They can only see *behavior*. If you spend time on how shame works in isolation, they will try to diagnose invisible feelings in the conference.
  *   **The Line:** *"Shame can happen without a witness—the 'internalized witness.' But in this room, we can only respond to what we see. If they act like they are hiding, we treat it as shame, regardless of who is watching."*

  **3. Therapeutic Interventions**
  *   **The Issue:** How to heal deep trauma or chronic shame.
  *   **Decision:** **Exclude entirely.**
  *   **Why:** They are volunteers, not therapists. Their job is conference safety, not emotional healing.
  *   **The Line:** *"If shame is paralyzing the conference, our job is not to cure it. Our job is to pause the conference or refer out. We are building a bridge, not a hospital."*

  ### Summary of the 90 Minutes

  *   **0–25 mins:** **Definitions via Behavior.** Guilt = "I did bad" (Lean in). Shame = "I am bad" (Lean out/Hide). *Inoculate against "Shame is Toxic."*
  *   **25–60 mins:** **The Silent Vandal Case.** Small groups analyze the transcript. Where is the shame? Is the mother right? *Inoculate against "He has no shame."*
  *   **60–75 mins:** **Intervention.** How to speak to shame without curing it. Converting shame to guilt (Behavior to Action).
  *   **75–80 mins:** **Assessment.** The Script Flip.
  *   **80–90 mins:** **Program Culture.** We choose to minimize shame in *this* room. Q&A.

  This order ensures they leave with a diagnostic tool (Behavior), a practice field (The Case), and a boundary (Program Culture), without getting lost in the philosophy of emotion.
