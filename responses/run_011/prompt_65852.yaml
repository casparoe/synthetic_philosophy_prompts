prompt: |-
  I volunteer as a coordinator for a community restorative justice program in a mid-sized city — the sort that diverts first-time juvenile offenses away from court and into a facilitated conference with the person harmed, both families, and a couple of trained volunteers. I have no philosophy background. I came to this topic sideways, after fifteen years of sitting in circles listening to fourteen-year-olds describe what they felt, and noticing that the adults in the room never agree about what the child is actually expressing. This spring I have been asked to take over one ninety-minute evening session in our volunteer training on the difference between guilt and shame, for twelve people whose only prior exposure is a workplace wellness seminar that told them shame is always damaging, plus two older volunteers who are convinced that some offenders simply have none of it and that this is the real problem. I do not want the session to be a lecture about two feelings. I want it to change how they behave in a conference, and I am not sure that is possible in ninety minutes.

  My own working view, arrived at badly and probably wrong in places, is this: guilt says I did something bad, shame says I am bad; guilt only needs a conscience while shame needs a witness, real or imagined; and guilt pushes a person toward confession and repair while shame pushes a person toward hiding, covering, and disappearance. I would also like to raise the question the trainees always raise on their own — whether a group, a family, or a culture can decide which of the two it runs on, and whether our program is in the business of producing one or the other. But I know my formula breaks down against cases I have actually sat through. There was a boy who took money from a relative's house while everyone was out, was never suspected, and told me two years later that he could not stand to look at himself in the months afterward; there was no witness anywhere and yet everything he said was shame-language and none of it was guilt-language. And there are people in our conferences — mothers mostly, sometimes the harmed party's brother — who are consumed by guilt over things they plainly did not do. Meanwhile the case that has our facilitators split right now involves a mother who, at the end of a conference, said loudly that her son had no shame at all, and half my volunteers think she was making a fair observation about him and half think she was doing damage to him in front of a room full of strangers. I cannot tell them what to think about that until I understand the distinction better than they do, and I do not think I can get there in the order I have sketched.

  So I am asking you to plan the session rather than write it for me. Give me the sequence: which piece has to be in place before which other piece can mean anything, and why the order matters — I want to know specifically whether the action-tendency asymmetry can be taught before the audience question, or whether teaching it first guarantees that the room walks out with the slogan never shame anyone, which would be actively harmful in conferences where the wrongdoer's own relatives are visibly appalled and cannot be edited out of the evening. Tell me the one case to build the whole ninety minutes around, and what that case must contain and must conspicuously lack — I suspect it cannot be a thought experiment and cannot be one of our own conferences, but I may be wrong about both. Then map the misconceptions: the ones the trainees will arrive with, including the wellness version and the he-has-no-shame version, and the ones they will construct in the room out of what I say, with the exact point in the sequence at which each should be headed off rather than argued down at the end. Include one thing I can put to them in the last ten minutes that would tell me the distinction has actually landed rather than just been repeated back to me politely. And tell me plainly what I should leave out at this level and announce that I am leaving out — including whether the can-a-culture-choose question belongs in the session at all or should be deferred, and if it belongs, where it can sit without collapsing everything built before it.
reasoning: |-
  Here's a thinking process that leads to the suggested session plan:

  1.  **Analyze the User and Context:**
      *   **User:** Volunteer coordinator for a community restorative justice (RJ) program.
      *   **Experience:** 15 years in circles, observed juvenile offenses, noticed adult disagreement on interpreting children's feelings. No philosophy background.
      *   **Task:** Design a 90-minute volunteer training session on "Guilt vs. Shame."
      *   **Audience:** 12 new volunteers (workplace wellness background: "shame is bad") + 2 older volunteers ("some offenders have no shame").
      *   **Goal:** Not a lecture. Change behavior in conferences.
      *   **User's Working Theory:** Guilt = I did bad (conscience, leads to repair). Shame = I am bad (witness, leads to hiding).
      *   **User's Dilemmas/Complications:**
          *   Private shame (boy stole money, no witness, felt shame).
          *   Misplaced guilt (mothers feeling guilty for things they didn't do).
          *   The "No Shame" Accusation (Mother calling out son in conference: helpful observation or harmful shaming?).
          *   Cultural/Systemic question (Can a culture choose which to run on?).
      *   **Constraints:** 90 minutes. Needs a specific sequence. Needs to avoid the slogan "Never shame anyone." Needs a central case study. Needs to identify misconceptions and when to address them. Needs a concrete assessment tool for the last 10 mins. Needs to know what to *exclude*.

  2.  **Deconstruct the Core Conflict:**
      *   The standard psychological distinction (Guilt = Behavior, Shame = Self) is useful but insufficient for RJ.
      *   RJ relies on *accountability* without *dehumanization*.
      *   The danger isn't just "shame is bad." The danger is *misidentifying* shame as guilt (leading to pushing for repair when the kid is hiding) or misidentifying guilt as shame (leading to coddling when they need to own it).
      *   The "Mother Accusing Son of No Shame" is the critical pivot point. It encapsulates the tension between holding accountable and shaming.

  3.  **Determine the Sequence (The "Why Order Matters"):**
      *   *Initial thought:* Define terms -> Show examples -> Discuss culture -> Practice.
      *   *Problem:* If you define shame as "bad/hiding" first, the "wellness" group wins, and the "tough love" group checks out. If you start with the "No Shame" accusation, it gets too heated too fast.
      *   *Better approach:* Start with *function/outcome* (what does the feeling *do* in the room?), then move to *identification* (what does it look like?), then *intervention* (what do we do?).
      *   *Crucial realization:* The user asks if action-tendency asymmetry can be taught before the audience question. Yes, it *must* be. If they don't know what shame *does* (hiding/defensiveness), they can't evaluate the mother's accusation.
      *   *The "Culture" Question:* This is too big for 90 mins if discussed philosophically. It needs to be framed as "Program Culture" (what *we* do), not "Societal Culture." It belongs at the end as a boundary setting.

  4.  **Select the Central Case:**
      *   User suggests it can't be a thought experiment or their own case.
      *   *Counter-thought:* It *must* be close enough to their reality to matter, but distant enough to analyze objectively. A modified version of a real case is best.
      *   *The Case:* Needs to show the *transition* point. A moment where guilt could turn to shame, or where shame is mistaken for defiance.
      *   *Selection:* The "Mother Accusing Son" case is the strongest hook, but it needs setup. Let's use a specific scenario: A vandalism case where the youth is silent. Is it shame? Is it defiance? The mother speaks up.
      *   *Refinement:* Actually, the user's "Boy who stole money privately" is great for defining internal shame, but the "Mother/Son" conflict is better for *facilitator behavior*. Let's combine them or prioritize the one that changes *behavior*. The prompt asks for *one* case to build the 90 mins around. The "Mother/Son" conflict is the most actionable for facilitators. It forces the decision: Do we stop the mother? Do we support the son?
      *   *Decision:* Use a composite case based on the "Mother/Son" conflict but fleshed out with the "silence/withdrawal" symptoms of shame.

  5.  **Map the Misconceptions:**
      *   *Wellness Group:* "Shame is always toxic." (Needs nuance: Shame is a signal, not just a toxin).
      *   *Old Guard:* "Some kids have no shame." (Needs reframing: They might have high shame masked as aggression, or the adult is projecting).
      *   *Emergent:* "Guilt is good, Shame is bad." (Needs correction: Both are signals. Guilt motivates repair; Shame motivates hiding. We want to convert Shame to Guilt).
      *   *Timing:* Address Wellness view early (during definitions). Address Old Guard view during the Case Study. Address Emergent view during the Intervention phase.

  6.  **Develop the Assessment (Last 10 Mins):**
      *   Don't ask "What is the difference?" (They will recite definitions).
      *   Ask "What would you do?" (Behavioral).
      *   *Idea:* A short script where a facilitator makes a mistake. Ask them to spot the moment shame was induced vs. guilt invoked.

  7.  **Determine Exclusions:**
      *   *Philosophy of Culture:* Don't debate if a culture *can* choose. State that *this program* chooses to minimize shame.
      *   *Neuroscience:* Too complex.
      *   *Therapy techniques:* They are facilitators, not therapists.
      *   *The "Private Shame" case:* Use it as a footnote to the definition, not the main driver, because facilitators can't see private shame. They see *behavior*.

  8.  **Drafting the Plan (Iterative refinement):**

      *   *Segment 1 (0-20):* Phenomenology. Not definitions, but *experience*. How does it feel in the body? (Guilt = heavy heart, want to fix. Shame = hot face, want to leave).
      *   *Segment 2 (20-50):* The Case. The "Silent Boy & Angry Mother." Analyze the dynamics.
      *   *Segment 3 (50-75):* Intervention. How to move from Shame to Guilt. The "Bridge."
      *   *Segment 4 (75-90):* Assessment & Culture.

      *   *Refining the "Order":* The user specifically asked about Action-Tendency vs. Audience Question.
      *   *Logic:* You cannot judge the Mother's action ("He has no shame") until you know what shame looks like in action. So, Action-Tendency *must* come first. If you start with the Mother's quote, the "Wellness" group will say "She's abusive" and the "Old Guard" will say "She's right." You need a shared vocabulary first.

      *   *Refining the Case:* It needs to lack a clear resolution. It needs to show the *risk*.
      *   *Must Contain:* A withdrawn youth. A frustrated harmed party or parent. A specific line of dialogue.
      *   *Must Lack:* A clear confession. (If they confess, it's guilt).

      *   *Refining the "Culture" Question:* It belongs in the last 10 mins as "Our Program Culture." It shouldn't be "Can society choose?" but "What culture do *we* build in this room?"

  9.  **Final Review against User Constraints:**
      *   *Sequence:* Explicitly ordered.
      *   *Why Order Matters:* Explained (Vocabulary before Judgment).
      *   *One Case:* Selected and detailed.
      *   *Misconceptions:* Mapped with intervention points.
      *   *Assessment:* Concrete behavioral check.
      *   *Exclusions:* Clearly stated.

  10. **Tone Check:** Respectful of the user's experience ("arrived at badly"), pragmatic, not academic, focused on the 90-minute constraint. (Self-Correction: Ensure I don't sound like I'm lecturing *them* on philosophy, but helping them structure *their* lecture).

  11. **Final Polish:** Ensure the distinction between "Toxic Shame" and "Shame as a Signal" is clear, as that bridges the Wellness and Old Guard views. (The Wellness group thinks shame = toxic. The Old Guard thinks shame = moral compass. The truth is shame = social signal that can become toxic if not managed).

  *(Self-Correction during drafting)*: Wait, the user said "I want to know specifically whether the action-tendency asymmetry can be taught before the audience question." I need to be very explicit about this. Yes, it must be taught first. If you present the "He has no shame" quote first, people will project their definition onto it. If you teach the definition (hiding vs. repairing) first, they can analyze the quote against the definition.

  *(Another Correction)*: The user's "Private Shame" example (boy stealing with no witness) challenges the "Shame needs a witness" theory. I need to make sure the plan accounts for this without getting bogged down in philosophy. The answer is: "Internalized Witness." The facilitator doesn't need to solve this, just acknowledge that the *feeling* is the same even if the audience is imaginary.

  *(Final Plan Structure)*:
  1.  **Sequence Logic:** Why Action comes before Judgment.
  2.  **The Central Case:** The "Silent Vandal."
  3.  **Misconception Map:** When to kill which myth.
  4.  **The Assessment:** The "Script Flip."
  5.  **Exclusions:** What to cut.

