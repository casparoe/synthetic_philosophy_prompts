  **Ranking of Genuine Tensions**

  1.  **(f) vs (g): The Aggregation Contradiction**
      *   **Tension:** In (f), you derive the 'largest moral problem' conclusion by multiplying population size by moral weight and credence, a method that presupposes the value of a population is the sum of its members. In (g), you explicitly deny this linear summation and reject the Repugnant Conclusion.
