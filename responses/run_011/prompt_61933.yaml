answer: |-
  **MEMORANDUM**

  **TO:** Standing Committee on University Conduct
  **FROM:** Associate Ombudsperson
  **DATE:** October 24, 2023
  **SUBJECT:** Consistency Memo: Reconstruction of Precedent Regarding Local Conventions and Newcomer Obligations

  Per the Committee's request, I have reviewed the case log of the founding Ombudsperson to reconstruct the operative principles governing disputes between newcomers and local conventions. The following analysis isolates the rules consistent with the six prior rulings, applies them to the pending case regarding the departmental working lunch, and offers a recommendation on how to maintain coherence in the office's case law.

  ### I. Candidate Rules Consistent with the Precedent Log

  I have identified three candidate rules that are jointly consistent with all six prior entries. I have also considered two intuitive principles that might seem applicable but are explicitly ruled out by the log.

  **Ruled-Out Principles**
  *   **The Universal Compliance Rule:** "A newcomer must follow all universal local customs." This is ruled out by **Entry 6** (the unofficial fee), where the predecessor ruled that a newcomer should *not* comply with a universal convention because it sustained a corrupt system.
  *   **The Efficiency Rule:** "A newcomer must follow conventions only when non-compliance imposes a material cost or delay on others." This is ruled out by **Entry 1** (the bus queue), where a breach was upheld despite the bus being nearly empty and no one being materially delayed. The harm was expressive, not efficient.

  **Surviving Candidate Rules**
  The following three rules account for the rulings in Entries 1 through 6 without contradiction.

  **Rule A: The Legitimate Reliance Principle**
  *   **Statement:** A newcomer commits a breach if they fail to comply with a local convention when locals have relied on that compliance to plan their actions or sustain a benefit, *unless* the convention coordinates an illicit extraction of value or admits of functionally equivalent variants.
  *   **Consistency Check:**
      *   *Fits Entries 1, 3, 4:* Locals relied on the queue, the tip, and the shoe policy; no equivalent variants existed; no illicit extraction.
      *   *Fits Entry 2:* No reliance existed at 3:00 AM on an empty street.
      *   *Fits Entry 5:* While there was reliance on a greeting, functionally equivalent variants (hand vs. cheek) existed.
      *   *Fits Entry 6:* Reliance existed, but the convention coordinated an illicit extraction (bribe).

  **Rule B: The Expressive Fairness Principle**
  *   **Statement:** A newcomer commits a breach if their conduct signals disrespect to the group or free-rides on a cooperative scheme, *unless* the conduct is necessary to avoid complicity in a harmful system.
  *   **Consistency Check:**
      *   *Fits Entries 1, 3, 4:* The acts signaled disrespect (cutting line, stinginess, disregard for host) or free-riding.
      *   *Fits Entry 2:* No audience to signal to; no scheme to free-ride on.
      *   *Fits Entry 5:* The handshake signaled respect and was intelligible; no free-riding.
      *   *Fits Entry 6:* Paying the fee would signal complicity in a harmful system; refusal signaled integrity.

  **Rule C: The Coordination Function Principle**
  *   **Statement:** A newcomer commits a breach if they disrupt a coordination mechanism that serves a legitimate social function, *unless* the mechanism is functionally redundant or morally corrupt.
  *   **Consistency Check:**
      *   *Fits Entries 1, 3, 4:* Queueing, tipping, and shoe-removal serve legitimate coordination functions (order, wage subsidy, hygiene/cleanliness).
      *   *Fits Entry 2:* The signal was not coordinating anything at that hour.
      *   *Fits Entry 5:* The specific variant was functionally redundant.
      *   *Fits Entry 6:* The fee coordinated corruption, not legitimate function.

  ### II. Application of Surviving Rules to the New Case

  **Case Facts Summary:** A visiting fellow declined a rotating duty (food/minutes) at a departmental lunch, citing gender bias in the allocation of tasks. He offered a partial substitute (minutes only). The duty reverted to the only female faculty member, who has filed a complaint. The orientation packet describes the duty as "shared by the department."

  **1. Verdict under Rule A (Legitimate Reliance)**
  *   **Verdict:** **Breach Upheld.**
  *   **Reasoning:** The department relied on the rotation to sustain the lunch practice (Entry 3 & 4 logic). The orientation packet communicated this expectation ("shared by the department"). The fellow's refusal shifted the burden to a specific local who relied on the rotation (the complainant).
  *   **The "Corruption" Exception:** The fellow argues the system is gender-biased (Entry 6 logic). However, under Rule A, the exception applies to "illicit extraction of value" (like the bribe in Entry 6). A departmental chore roster, even if arguably gendered, is likely viewed as a legitimate local convention rather than a corrupt extraction, especially since the complainant (the alleged victim of the bias) prefers the convention be followed to avoid her own burden.
  *   **The "Variant" Exception:** The fellow offered a partial substitute (minutes only). Unlike Entry 5 (greeting variants), this is not functionally equivalent; the catering task remained unassigned and reverted to the complainant.

  **2. Verdict under Rule B (Expressive Fairness)**
  *   **Verdict:** **Breach Upheld.**
  *   **Reasoning:** The public refusal signaled disrespect to the department's established order (Entry 1 logic). While the fellow argued he was avoiding complicity in sexism, the "harmful system" exception (Entry 6) is reserved for clear moral illicitness (bribes). Ambiguous social hierarchies do not typically trigger this exception in the log. Furthermore, by free-riding on the lunch while refusing the cost, he violated the fairness principle (Entry 3).
  *   **The Manner Question:** Rule B places heavy weight on what the act *announces*. Entry 1 establishes that the *announcement* of disrespect is itself a breach, independent of material cost. The fellow's public declaration ("I will not take part...") announced a rejection of the group's standing. Even if his substantive refusal were justified, the *manner* (public, instructional tone to the Chair) likely constitutes a separate breach under Entry 1.

  **3. Verdict under Rule C (Coordination Function)**
  *   **Verdict:** **Breach Upheld.**
  *   **Reasoning:** The lunch roster serves a legitimate coordination function (feeding the department). The fellow disrupted this function. The "morally corrupt" exception is the only potential defense. However, Entry 6 suggests this exception is narrow (systemic corruption). Without a university-wide rule prohibiting this specific labor division, the Ombudsperson's log suggests treating it as a local convention (Entry 4).
  *   **The Complainant:** The person most burdened is the one who filed the complaint. In Entries 3 and 4, the burden on the relied-upon party was decisive. Here, the woman bears the burden. Her testimony that she "would rather he had simply taken the turn" undermines the fellow's claim that he was acting to protect her.

  ### III. Recommended Ruling and Defense of Preference

  **Best Guess:** The predecessor would have ruled **Breach Upheld against the Fellow.**

  **Defense of Preference:**
  The predecessor's case law operates on a **Lexical Ordering with a Narrow Moral Exception**, not a weighted trade-off. The logic flows in three steps:

  1.  **Check for Illicit Extraction (Entry 6):** Is the convention legally or systemically corrupt (e.g., bribes, rights waivers)? If yes, non-compliance is mandated. If no, proceed to step 2.
      *   *Application:* A departmental lunch roster is not an illicit extraction in the same sense as a bribe. It is a local administrative convention. The gender claim, while serious, is contested by the alleged victim's preference for compliance.
  2.  **Check for Reliance and Benefit (Entries 1, 3, 4):** Did the newcomer benefit from the scheme, and did locals rely on their participation? If yes, proceed to step 3.
      *   *Application:* The fellow ate the lunch (benefit). The department relied on the rotation (reliance). The burden fell on a specific local (Entry 3 & 4).
  3.  **Check for Manner and Expression (Entry 1):** Did the refusal publicly signal disrespect?
      *   *Application:* Yes. The public refusal in front of the chair amplifies the breach.

  **Why Lexical?**
  Entry 6 is the only case where a clear convention was overridden by moral principle. In all other cases (1, 3, 4), reliance and expectation trumped individual preference or efficiency. This suggests the "Corruption Exception" is a threshold gatekeeper. If the convention passes the threshold (i.e., it is not a bribe), the Reliance Principle dominates. The predecessor does not appear to weigh "social justice" against "local order" in a balancing test; she treats local order as binding *unless* the system itself is the problem. Since the woman (the complainant) indicates the system is not the problem for her personally, the Exception does not trigger.

  **Coherence Recommendation:**
  To keep the line of cases most coherent, the Committee should adopt the ruling that **local administrative conventions bind newcomers unless they violate explicit university policy or law.** Treating internal departmental labor divisions as "corrupt systems" (Entry 6) would destabilize the distinction between Entry 4 (shoes) and Entry 6 (bribes). The Committee should uphold the complaint but note that the *manner* of the refusal (public announcement) was the primary aggravating factor, consistent with Entry 1.

  ### IV. Discriminating Hypothetical Case

  To discriminate between the two most serious competing interpretations of the predecessor's logic—**The Reliance Principle** (conventions bind if relied upon) vs. **The Moral Exception Principle** (conventions do not bind if unjust)—I propose the following thought experiment for the Committee:

  **Hypothetical:**
  A department has a longstanding, undocumented tradition that all members, including visitors, contribute €20 to a "Solidarity Fund" at the start of the term. The fund is used to buy gifts for retiring staff and to support graduate students in financial distress. The practice is universal, and the department plans its end-of-year celebrations based on the expected funds. A visiting fellow refuses to pay, stating that mandatory financial contributions for social purposes are coercive and should be voluntary. He does not make a public scene but simply declines when the envelope is passed.

  **Discrimination:**
  *   **Under The Reliance Principle:** **Breach Upheld.** The department relied on the funds to plan celebrations and support students (Entry 3 & 4 logic). The fellow benefited from the departmental cohesion. The contribution is not "illicit" like a bribe; it is for a benevolent purpose.
  *   **Under The Moral Exception Principle:** **No Breach.** If the Committee interprets Entry 6 broadly to mean "any extraction of money the system ought not to require," this mandatory social fee fits. It extracts money for a purpose (gifts) that should be voluntary.

  **Why this discriminates:**
  This case isolates the definition of "Illicit Extraction" in Entry 6. Is Entry 6 about *corruption* (bribes are inherently wrong), or is it about *coercion* (mandatory payments are inherently wrong)?
  *   If the predecessor's logic was primarily about **Reliance** (Entries 1, 3, 4), the fellow breaches because the department relied on the money.
  *   If the predecessor's logic was primarily about **Moral Autonomy** (Entry 6), the fellow does not breach because the system extracts money it shouldn't.

  Given Entry 3 (tip), where the fellow *was* required to pay money based on local expectation, the **Reliance Principle** is the stronger predictor. The tip was also an "unofficial fee" for service. The distinction lies in whether the fund is viewed as a *benefit scheme* (like the tip/service) or a *corrupt scheme* (like the bribe). The log suggests the predecessor upholds breaches when money is expected for a service/benefit (Entry 3), and only overturns them when the system is corrupt (Entry 6). Therefore, the Reliance Principle is the dominant rule, and the Hypothetical should likely result in a Breach to remain consistent with Entry 3.
