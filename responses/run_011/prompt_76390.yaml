answer: |-
  You have won the point that thresholds are visible; the archive does record the moment the line is crossed. But visibility is not representativity. The threshold is not a geological stratum waiting to be uncovered; it is a dial turned by the justice of the peace depending on the price of grain, the stability of his own tenure, and the mood of the Privy Council. When your scrivener writes down a witness's phrase about the price of a loaf, he is not necessarily preserving the crowd's model for posterity; he is often establishing *mens rea* for a conviction. The negotiation you see in the margins is frequently one official correcting another, not the state listening to the poor. To treat the archive as a seismograph of popular sentiment is to confuse the Richter scale with the earthquake.

  However, you ask what would have to be true for me to concede. If you can demonstrate that the frequency of these breaches remains constant across changes in personnel—different clerks, different justices—then you begin to suggest a structural constraint rather than a personal whim. If the threshold for relief in the overseers' accounts moves in lockstep with regional grain prices rather than local idiosyncrasy, then you have a series, not just a story. I need to know if your town is an outlier in litigation density. A town that litigates ten times more than its neighbor isn't revealing more norms; it's revealing a more litigious culture, which is itself a variable you cannot control for with a sample of one.

  So, to check for atypicality without leaving your bundle: I would read the overseers' accounts first. They are the most rigid, the most formulaic, and the least likely to indulge in narrative flair. How many disbursements per year? Are they consistent? Then, look at the presentments. How many survive per decade? Does the clerk's hand change mid-bundle, and if so, does the vocabulary shift? If the language of accusation remains stable across thirty years and three clerks, you have evidence of an institutional norm, if not a popular one. And finally, does the town hold a market charter? That legal status alone distorts the food riot depositions beyond comparison with a non-market village. Tell me those numbers, and I will tell you if you have a case or a curiosity.
