answer: |-
  Imagine a junior is accused of leaking the AP Calculus final. To judge this fairly, voters need to see the specific email logs and seating charts; without them, they're just guessing based on rumors. To satisfy the theorem's requirement that every voter is 60% competent, the school must email these sensitive documents to all 300 juniors. The 9-person panel reviews these privately, but the mass vote broadcasts the accusation and evidence to the entire grade. Even if the 300-person vote is more accurate, an innocent student cleared by the crowd still suffers reputational ruin because 300 peers now know they were suspected. The 9-person panel protects the accused's privacy regardless of the verdict, preserving the community trust the Honor Code relies on.

  **The Math:**
  If each voter has a 60% chance ($p=0.6$) of judging correctly:
  *   **9-Person Panel:** The probability a majority (5+) is correct is roughly **73%**. (Calculated via binomial sum: $1 - \sum_{k=0}^{4} \binom{9}{k} 0.6^k 0.4^{9-k}$).
  *   **300-Person Vote:** The probability a majority (151+) is correct jumps to **99.9%**. (Using normal approximation: Mean=180, SD≈8.5, Z-score for 150.5 is -3.47).
  *   **The Cost:** The crowd is vastly more accurate, but the *cost of a correct acquittal* is higher in the crowd scenario. In the panel, an innocent student walks away clean. In the vote, an innocent student walks away cleared but branded. The damage to student privacy and trust outweighs the 26% gain in accuracy.

  **The Feature & The Attack:**
  The single feature doing the work is **competence requires sensitive disclosure**. To make voters competent enough for the theorem to work, you must expose them to damaging information. If you delete this feature—say, by claiming students can judge competence without seeing evidence—their accuracy drops below 50%, breaking the theorem's premises. A fan of the jury theorem will attack this by saying you "rigged the costs" by valuing privacy over truth. They will argue you can anonymize the evidence. Your rebuttal is that in a single grade of 300, context makes anonymity impossible without removing the evidence needed for competence, forcing a choice between accuracy and privacy.

  Verdict: Competence requires damaging public exposure.
