answer: |-
  # The Hospice Ethics Decision Procedure (HEDP)

  **Purpose:** To determine whether to Accept, Decline, or Refer a donation offer within 20 minutes, generating a written rationale suitable for public scrutiny.
  **Authority:** Derived from the *Vanijja Sutta* (Right Livelihood), the *Jivaka Sutta* (The Meat Rule), and the Brahmaviharas (Compassion and Equanimity).
  **Users:** Any committee member. No prior knowledge of Buddhism required.

  ---

  ## Part 1: The Procedure (5 Steps)

  *Time allocation: 3 minutes per step. 5 minutes for final vote/documentation.*

  ### Step 1: The Source Test (Right Livelihood)
  **Question:** Is the donor's primary wealth generation derived from one of the five trades explicitly prohibited to a Buddhist lay follower?
  *   **The List:** Weapons, Living Beings (slavery/trafficking), Meat Production (breeding/slaughter), Intoxicants (alcohol/drugs), Poisons.
  *   **Sufficient Answer:**
      *   **NO:** Proceed to Step 2.
      *   **YES:** Proceed to Step 2 *but* mark this offer as "High Friction."
      *   **UNKNOWN:** Refer immediately to the Board (do not proceed).

  ### Step 2: The Complicity Test (The Meat Rule)
  **Question:** Based on the *Jivaka Sutta* standard, is there evidence that the harm generating this money was committed *specifically to enable this gift*?
  *   **The Standard:** A recipient is not karmically complicit if they did not *see, hear, or suspect* the harm was done *for their sake*.
  *   **Sufficient Answer:**
      *   **NO (General Profit):** The money is general profit from past activity (e.g., a legacy, general corporate surplus). **Pass.**
      *   **YES (Targeted Harm):** The donation is tied to a specific harmful act, or the donor's business model relies on the suffering of the specific population you serve (e.g., a gambling firm funding suicide bereavement). **Fail.**
      *   *Termination:* If **Fail**, recommendation is **DECLINE**. Stop here.

  ### Step 3: The Intention Test (Cetana)
  **Question:** What state of mind does accepting this gift cultivate in *us* (the hospice) and *them* (the donor)?
  *   **The Standard:** Does acceptance validate the harm (greed/delusion) or support the relief of suffering (generosity/compassion)?
  *   **Sufficient Answer:**
      *   **Validation:** Acceptance would look like an endorsement of the harmful trade (e.g., a named building, a joint press release). **Mitigation Required.**
      *   **Support:** Acceptance is strictly transactional for patient care, with no endorsement implied. **Pass.**
      *   *Termination:* If **Validation** cannot be mitigated (e.g., donor demands naming rights on a ward), recommendation is **DECLINE**.

  ### Step 4: The Transparency Test (Truthfulness)
  **Question:** Can we answer the question "Where did this money come from?" truthfully to a patient, family, or journalist without causing distress or appearing hypocritical?
  *   **The Standard:** *Sacca* (Truth). If we must lie or obfuscate to keep the money, the money is too expensive.
  *   **Sufficient Answer:**
      *   **YES:** We can state the source openly or confirm our anonymity policy without deception. **Pass.**
      *   **NO:** We would have to hide the source or deny a known connection. **Fail.**
      *   *Termination:* If **Fail**, recommendation is **DECLINE**.

  ### Step 5: The Equanimity Test (Upekkha)
  **Question:** Are we accepting this money because it is right, or because we are afraid of the financial shortfall if we refuse?
  *   **The Standard:** Compassion relieves suffering; Equanimity prevents us from compromising our nature to do so.
  *   **Sufficient Answer:**
      *   **Fear-Driven:** "We cannot afford to say no." **Refer to Board.**
      *   **Value-Driven:** "We can say no because our integrity is part of the care." **Pass.**
      *   *Termination:* If **Fear-Driven**, recommendation is **REFER TO BOARD**. (The Board must decide if financial survival trumps ethical stance).

  ---

  ## Part 2: Translation Guide for Non-Buddhist Members

  To make this usable for the solicitor and fundraiser, specific Buddhist concepts are translated into governance terms.

  | Buddhist Concept | Plain English Translation | What Is Lost in Translation |
  | :--- | :--- | :--- |
  | **Right Livelihood** | **Core Harmful Industries.** | The metaphysical idea that trading in these items generates negative *karma* for the trader. We retain the list (Weapons, Meat, etc.) but treat it as a reputational/mission risk rather than a spiritual stain. |
  | **The Meat Rule** | **Direct Complicity.** | The nuance that the *recipient's mind* is the locus of purity. In English, this becomes about *causality* (did they do it for us?) rather than *spiritual contamination*. |
  | **Cetana (Intention)** | **Endorsement Risk.** | The internal state of the donor is inaccessible. We judge intention by external signals (naming rights, press releases). We lose the ability to judge the donor's soul, focusing only on public perception. |
  | **Upekkha (Equanimity)** | **Financial Independence.** | Equanimity is a spiritual balance; "Financial Independence" is a budgetary stance. We lose the discipline of non-attachment, replacing it with risk management. |
  | **Dana (Giving)** | **Partnership.** | *Dana* implies a spiritual bond between giver and receiver. "Partnership" implies a contract. We lose the sense that the money itself carries the donor's moral weight. |

  **The Fault Line:**
  This procedure does **not** allow you to net off the good against the bad. A consequentialist asks: *"Does the £1m save more lives than the weapons kill?"* This procedure asks: *"Does taking this money make us complicit in the weapons trade?"* If Step 2 (Complicity) fails, the utility of the money is irrelevant. This prioritizes **Integrity** over **Outcome**.

  ---

  ## Part 3: Application to Live Offers

  ### Case 1: £1.4m Legacy (Pig/Poultry Farmer)
  *   **Step 1 (Source):** Meat/Living Beings. **High Friction.**
  *   **Step 2 (Complicity):** Legacy. Money made in past. Not killed *for* the hospice. **Pass.**
  *   **Step 3 (Intention):** Widow requests anonymity. No naming. No endorsement. **Pass.**
  *   **Step 4 (Transparency):** Connection is local record. If asked, we say "We accept legacies from individuals; we do not comment on private affairs." This is truthful. **Pass.**
  *   **Step 5 (Equanimity):** Is refusal financial fear? No, acceptance is financially helpful.
  *   **Recommendation:** **ACCEPT.**
  *   **Written Reason:** "While the source wealth derives from industries not aligned with our founding values (Meat/Living Beings), the gift is a legacy with no direct causal link to our operations (The Meat Rule). Acceptance does not imply endorsement, and anonymity requests protect our transparency obligations."

  ### Case 2: £75k/yr x 5 (Defense Contractor)
  *   **Step 1 (Source):** Weapons. **High Friction.**
  *   **Step 2 (Complicity):** Anonymous, but traceable. Weapons are made to kill. While not made *for* us, the capital is the fruit of prohibited trade. **Pass (Technically)** but high risk.
  *   **Step 3 (Intention):** Anonymous offer reduces endorsement risk. **Pass.**
  *   **Step 4 (Transparency):** Fundraiser admits paper could trace it within a week. If we claim ignorance, we lie. If we admit it, we face scrutiny. **Fail.** (We cannot truthfully deny the link if the press knows).
  *   **Step 5 (Equanimity):** High risk of public scandal causing distress to patients.
  *   **Recommendation:** **DECLINE.** (Reverses your instinct).
  *   **Why:** The procedure reverses your instinct because of **Step 4 (Transparency)**. Even if anonymous, if the link is easily traceable, accepting it requires a deception of omission if challenged. Furthermore, *Vanijja Sutta* prohibits trade in weapons. While the "Meat Rule" usually protects recipients, capital from weapons manufacturing is structurally different from almsfood; it enables the industry's continuation. Accepting it validates the trade.
  *   **Written Reason:** "The source falls under prohibited trades (Weapons). While the gift is not directly complicit in specific harms, the high probability of public discovery creates a transparency risk that outweighs the financial benefit. Acceptance could be perceived as validating the arms trade."

  ### Case 3: £300k (Gambling Operator, Bereavement Service)
  *   **Step 1 (Source):** Intoxicants/Poison (Gambling causes heedlessness). **High Friction.**
  *   **Step 2 (Complicity):** 40% of service caseload is suicide from gambling losses. The harm brings patients to the door. This is *suspected killed for us* (the suffering generates the need for the service). **Fail.**
  *   **Termination:** **DECLINE.**
  *   **Recommendation:** **DECLINE.** (Aligns with your instinct).
  *   **Written Reason:** "There is a direct causal link between the donor's business model and the suffering of the patients we would treat with these funds. Accepting this gift would create a conflict of interest where the hospice benefits from the harm caused by the donor."

  ---

  ## Part 4: Limits and Honesty

  ### Where the Procedure Misfires
  1.  **Diffuse Harms:** This procedure works well for "Weapons" or "Gambling." It fails for **Fossil Fuels** or **Tech Surveillance**. These are not in the *Vanijja Sutta* list. A fortune made in oil would pass Step 1. You will need to amend the "Source List" periodically, which invites political debate.
  2.  **Structural vs. Visible:** It favours visible, local harms (Case 3 Gambling) over invisible, structural ones (Case 2 Defense). The Defense offer is declined on *Transparency*, not *Complicity*, because the harm of weapons is global/diffuse, whereas the harm of gambling is local/traceable to your patients. This is a bias in the procedure.
  3.  **Judgment Calls:** Step 2 ("Suspected for our sake") is a judgment call. One member's "suspicion" is another's "paranoia." The procedure dresses this as a fact-finding mission, but it is moral intuition.

  ### The Point of Failure (Institutional Identity)
  The procedure ceases to yield a recommendation at **Step 5 (Equanimity)**.
  If the committee answers "Fear-Driven" (We cannot afford to say no), the procedure hands the question to the Board. This is the correct hand-off point.
  *   **Why:** At this stage, the question is no longer "Is this ethical?" but "Who are we?"
  *   If the Board accepts the money out of fear, they are deciding that the institution is a **Service Provider** first and a **Buddhist Trust** second.
  *   If they decline, they decide they are a **Buddhist Trust** that provides services.
  *   No procedure can solve this. It is a question of identity, not ethics.

  ### Consequentialism Check
  Can this procedure do anything other than borrow consequentialist arithmetic?
  **Yes.** A consequentialist calculation would likely **Accept Case 3**.
  *   *Calculation:* £300k funds bereavement care for 500 families. The gambling caused 50 suicides. The net good (500 helped) outweighs the bad (50 harmed).
  *   *This Procedure:* **Declines Case 3.** It treats the *connection* between the harm and the cure as disqualifying, regardless of the net utility. It asserts that some means are incompatible with the end, even if the end is noble. This is a deontological constraint rooted in the Buddhist concept of *Right Means*, not a utilitarian calculation.

  ### Final Note to the Chair
  You instinctively wanted to Accept Case 2 (Defense) and Refuse Case 3 (Gambling). The procedure Refuses Both.
  *   **Case 3** is refused because the harm is *internal* to your patient base (Complicity).
  *   **Case 2** is refused because the harm is *external* but the link is *transparent* (Truthfulness).
  If you wish to Accept Case 2, you must amend Step 1 to remove "Weapons" from the Prohibited List. But know that in doing so, you are severing the hospice's explicit link to the *Vanijja Sutta*. You cannot keep the Buddhist label while discarding the Buddhist blacklist without losing coherence. The procedure forces you to make that choice explicit.
