answer: |-
  **The practice, restated**

  The machinery translates physical regulatory impacts into a common monetary metric to determine economic justification. It calculates compliance costs for regulated entities and compares them against quantified benefits: avoided climate damages valued at the Social Cost of Carbon (SCC) and health improvements valued via the Value of a Statistical Life (VSL). Future flows of damages and benefits are discounted to present value using a specified rate, acknowledging that future welfare counts less than present welfare. The model assumes marginal changes in emissions produce smooth, predictable changes in global temperature and economic output, aggregated across sectors and borders. If the present value of benefits exceeds costs, the rule is deemed efficient. The analysis treats the SCC as a definitive input for this calculation, despite acknowledging excluded categories of damage, and operates under the assumption that disparate values—lives, labor, ecosystem services—are commensurable via currency.

  **What it strictly presupposes**

  This practice cannot function without a commitment to consequentialist welfarism, specifically that the moral rightness of a regulation depends solely on its aggregate outcomes measured in utility proxies. It presupposes commensurability: that human life, climate stability, and industrial compliance can be reduced to a single scalar value without remainder. If these values were incommensurable, the summation required for net benefit calculations would be category errors.

  Crucially, the discount rate is not a separable technical parameter but a substantive moral claim about intergenerational equity. A positive pure time preference asserts that the welfare of future persons matters less than current persons simply due to temporal location. You cannot run the identical machinery at zero discounting and preserve the same theory of value; doing so would shift the weight of obligation toward the future so heavily that it might paralyze present consumption, fundamentally altering the ethical framework from one of balanced trade-offs to one of heavy preservationism.

  The practice also presupposes fungibility and identity independence. It assumes a ton of CO2 is identical regardless of source, implying the atmosphere's ledger matters more than the justice of the emitting activity. Furthermore, it ignores the non-identity problem. It assumes we can harm specific future individuals by comparing their welfare in a policy scenario against a baseline where they exist. In reality, climate policy alters conception dates and identities entirely. The model presupposes a stable population counterfactual that metaphysically cannot exist, treating future generations as fixed entities waiting to be harmed rather than contingent beings brought into existence by the policy choices themselves.

  **What it merely fits**

  While the machinery requires welfarism, it is underdetermined regarding which specific welfare theory applies. Preference utilitarianism, hedonic utilitarianism, or even a crude economic efficiency standard could all generate identical spreadsheets. The form does not distinguish between maximizing satisfaction of existing preferences and maximizing objective well-being; it merely requires that preferences be revealed through market behavior or willingness-to-pay surveys.

  Furthermore, the practice fits a Kaldor-Hicks efficiency standard rather than strict Pareto improvement. It does not require that the winners actually compensate the losers, only that they *could*. This allows the paperwork to remain neutral on distributive justice. A Rawlsian could theoretically fill out this form if they viewed the aggregate growth as a precondition for improving the lot of the least advantaged, just as a libertarian might accept it if viewed as a Coasean bargaining simulation.

  Finally, the practice fits bare bureaucratic tractability. Administrative law often requires a "hard look" at costs and benefits to prevent arbitrary action. The specific theory of value might be secondary to the legal necessity of producing a number that withstands judicial review. The document could be a procedural shield rather than a moral truth claim, where the SCC exists not because it is philosophically robust, but because the statute demands a quantified economic analysis. In this view, the theory of value is incidental to the theory of administration.

  **Two places it pulls against itself**

  The first tension lies between the valuation of statistical lives and climate catastrophes. The agency assigns a high, relatively precise value to individual mortality risk (VSL), treating each life as a distinct, high-value unit. Yet, the climate model treats existential risks—ecosystem collapse, tipping points—as smooth percentage losses of GDP. This creates an incoherence in risk valuation: immediate, individualized risk is priced high, while systemic, civilizational risk is smoothed into a linear damage function. The model implies we know the cost of asthma with greater certainty than the cost of global destabilization, privileging the monetizable over the catastrophic.

  The second tension is the "floor versus ceiling" paradox. The agency explicitly states the SCC is an underestimate because it excludes hard-to-monetize damages. Philosophically, this establishes a floor: true benefits are at least this high. However, the decision rule treats the SCC as a ceiling on obligation. If compliance costs exceed this underestimated benefit figure, the rule is often stalled or rejected. The caveat protects the agency from criticism for undervaluing nature, but the math operates as if the valuation is complete. This is not merely conservative; it is performatively contradictory. It uses an admitted underestimate to justify potentially under-protective regulation. The only principled line defending this is legal defensibility: courts may reject rules based on speculative benefits, forcing the agency to use only what can be defended in court, even if known to be incomplete. Yet, this substitutes legal risk for moral obligation.

  **What it forecloses**

  This format excludes any ethical framework that relies on rights, duties, or thresholds rather than aggregation. A deontological view might argue that emitting beyond a certain capacity violates the rights of future persons, regardless of whether the economic benefits outweigh the harms. In this format, rights are merely another cost to be balanced, not side-constraints. If violating a right produces enough GDP growth, the model can theoretically justify it.

  It also forecloses ecocentric views. Because damages are calibrated to human GDP and labor supply, nature has no intrinsic value. A forest is only valuable insofar as it provides timber, carbon sequestration, or recreation revenue. If ecosystem collapse does not register significantly on the GDP damage curve, it registers as zero in the analysis. This is a substantive claim disguised as a technical limitation: it asserts that unpriced values are irrelevant to policy.

  Additionally, the non-identity problem is technically unsolvable here, but the practice forecloses the philosophical honesty of admitting it. By assuming a stable population, it excludes the view that policy creates people rather than harming them. Finally, it forecloses degrowth or steady-state economics. The damage curve assumes GDP growth is the baseline good to be protected. Any theory suggesting that reduced economic throughput is itself a benefit cannot be expressed, because the model defines climate damage as a loss of consumption potential. The metric itself dictates the goal.

  **If we swapped the theory out**

  Under a Safe Minimum Standard (SMS) framework, the document changes fundamentally. The decision rule shifts from "maximize net present value" to "avoid crossing dangerous thresholds unless costs are intolerable." The SCC number loses its role as the primary gatekeeper. Instead of summing benefits, the analysis would identify specific physical boundaries (e.g., 2°C warming, specific ppm concentrations) and ask if the rule prevents breach. The cost test becomes a constraint: are the compliance costs so high they threaten societal stability? The SCC might survive as a secondary efficiency metric to choose between alternative rules that both meet the standard, but it no longer determines whether protection is warranted.

  Under a degrowth framework, the GDP damage curve is discarded or inverted. The metric might shift to energy throughput, material extraction, or capability indices. The "cost" of compliance might be reframed as a beneficial reduction in throughput. The SCC would likely not survive, as it is intrinsically tied to marginal damages on economic output. Instead, the analysis would evaluate whether the rule aligns with a planned contraction of carbon-intensive activity. The document would look less like a balance sheet and more like a transition plan, measuring success by decoupling or absolute reduction rather than net monetary benefit. The question changes from "Does this pay for itself?" to "Does this move us toward the target?"
