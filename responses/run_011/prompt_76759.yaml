answer: |-
  ### Preliminary Assessment of Constructed Cases

  Before presenting the criteria, I will address your three constructed cases. None of these require a new, fundamental entry on the list. They are stress-tests of existing categories rather than discoveries of new phenomenological terrain.

  1.  **The Distant Masker:** This is absorbed by the standard **Interference/Masking** requirement. Its specific value is that it pressures the **Intrinsicness** requirement. If a disposition is lost or masked by a device a kilometer away, an account that insists dispositions must be intrinsic must explain how the intrinsic property remains intact while the conditional truth-value changes. It does not demand a new criterion, but it sharpens the motivation for distinguishing the disposition from its stimulus conditions.
  2.  **The Permanent Structural Masker:** This is absorbed by the **Modal Force/Possibility** requirement. It tests the boundary between "having a disposition that never manifests" and "lacking the disposition because manifestation is impossible." It reinforces the need to distinguish the *property* from the *opportunity* to manifest.
  3.  **The Probabilistic Masker:** This is absorbed by the **Strength vs. Reliability** distinction. It clarifies that a disposition can be robust (high strength) even if its manifestation rate is low due to frequent masking. It reinforces the requirement that an account must handle probabilistic manifestations without collapsing into frequency claims.

  ### The Specification List

  The following table outlines the requirements for an adequate account of dispositions. The "Status" column distinguishes between demands any theory must meet to capture the phenomenon (Non-Negotiable) and demands that reflect a specific metaphysical agenda (Partisan).

  | Requirement | Motivating Case or Consideration | Status |
  | :--- | :--- | :--- |
  | **1. Extensional Adequacy (Interference)** | **The Finkish Wire:** A wire is disposed to conduct when touched, but a device detects the touch and instantly removes the conductivity before current flows. **The Packed Glass:** A fragile glass is packed in foam; struck, it does not break. **The Antidote:** Venom is lethal, but an antidote in the blood neutralizes it. <br> *Demand:* The account must correctly ascribe the disposition in these cases despite the false conditional "If stimulated, it would manifest." | Non-Negotiable |
  | **2. Extensional Adequacy (Mimics)** | **The Mirror-Image:** An object shatters when struck not because it is fragile, but because a hidden explosive is triggered by the impact. <br> *Demand:* The account must not ascribe the disposition when the manifestation occurs solely due to an extrinsic or alien cause. | Non-Negotiable |
  | **3. Property/Basis Distinction** | **The Loss vs. Blocking:** An object can lose its disposition at the moment of stimulus (Fink) versus having the disposition remain intact while the manifestation is blocked (Mask). <br> *Demand:* The account must distinguish the disposition itself from its categorical base or physical realizer, allowing the disposition to persist even if the base is temporarily altered or masked. | Non-Negotiable |
  | **4. Modal Force (Possibility)** | **The Unmanifested vs. Impossible:** A fragile glass never falls versus a glass that is metaphysically incapable of breaking. **The Permanent Masker:** An object structurally prevented from ever manifesting. <br> *Demand:* The account must distinguish a disposition that *happens* not to manifest from one that *could not* manifest. It must allow for unmanifested dispositions. | Non-Negotiable |
  | **5. Multi-Track Capacity** | **Solubility and Fragility:** Sugar is soluble in water and tea; glass is fragile to striking and squeezing. <br> *Demand:* The account must allow a single disposition to have multiple distinct stimulus-manifestation pairs without treating them as separate properties. | Non-Negotiable |
  | **6. Strength vs. Reliability** | **The Probabilistic Masker:** A poison kills 90% of the time due to occasional antidotes vs. a weak poison that kills 10% of the time even in ideal conditions. <br> *Demand:* The account must distinguish the intrinsic power (strength) of the disposition from the frequency (reliability) of its manifestation in a given environment. | Non-Negotiable |
  | **7. Explanatory Power** | **Scientific Explanation:** We cite "fragility" to explain why the glass broke, not just the microstructure. <br> *Demand:* Citing the disposition must provide genuine explanatory information, not merely a placeholder for "it broke because it was disposed to break." | Non-Negotiable |
  | **8. Regulatory Stability** | **Safety Engineering:** A substance is classified as flammable based on a lab test. It is stored in a warehouse with a suppression system that makes ignition impossible. It is still classified as flammable. <br> *Demand:* The ascription of the disposition must remain stable across contexts even when the local conditions prevent manifestation. The property travels with the object. | Non-Negotiable |
  | **9. Non-Circularity** | **The Ideal Conditions Clause:** To fix the Simple Conditional Analysis, we add "in ideal conditions." But "ideal conditions" often means "conditions where nothing interferes with the manifestation of the disposition." <br> *Demand:* The analysis must not define the disposition using vocabulary that presupposes the disposition itself. | Partisan (Reductive) |
  | **10. Intrinsicness** | **The Distant Masker:** The object's disposition should depend on how the object is, not on what is happening a kilometer away. <br> *Demand:* Dispositions must be intrinsic properties of the bearer. | Partisan (Realist) |
  | **11. Categorical Base** | **The Grounding Intuition:** Dispositions must be grounded in something non-dispositional to avoid a regress of powers. <br> *Demand:* Every disposition must have a categorical (non-dispositional) basis. | Partisan (Categoricalist) |
  | **12. Reductive Analysis** | **The Project of Analysis:** The aim is to replace dispositional talk with non-dispositional talk (e.g., conditionals). <br> *Demand:* The account must provide necessary and sufficient conditions that eliminate dispositional vocabulary. | Partisan (Reductive) |

  ### Meta-Work: The Architecture of the Debate

  #### 1. Non-Negotiable vs. Partisan
  Your suspicion is correct. The insistence on **Reduction (12)**, **Intrinsicness (10)**, and a **Categorical Base (11)** belongs in the partisan column.
  *   **Reduction** is demanded by those who wish to analyze dispositions away (e.g., into conditionals or regularities) but is rejected by primitivists who view dispositions as fundamental.
  *   **Intrinsicness** is demanded by those who wish to locate causal power within the object, but it struggles against cases of extrinsic interference (like your Distant Masker) unless the theory allows extrinsic dispositions.
  *   **Categorical Base** is demanded by those who fear an ontology of pure power, but is rejected by pandispositionalists.

  The **Non-Negotiables (1–8)** bind any account that wishes to systematize dispositional talk, even if it does not analyze it away. A primitivist account must still handle finks, masks, and mimics (1 & 2), distinguish property from base (3), and explain scientific usage (7 & 8).

  #### 2. Reductive vs. Systematizing Aims
  *   **Systematizing Accounts:** Bound only by the Non-Negotiables. Their goal is to preserve the truth conditions and utility of dispositional ascriptions without necessarily eliminating the vocabulary.
  *   **Reductive Accounts:** Bound by the Non-Negotiables *plus* the Partisan demands of Non-Circularity (9) and Reduction (12). They aim to show that dispositional talk is shorthand for something else.

  #### 3. The Main Result: The Inconsistency of the Reductive Project
  You asked to flag any subset of requirements that cannot be jointly satisfied. While there is no inconsistency among the *Non-Negotiables* (a primitivist can satisfy 1–8 easily), there is a fatal inconsistency within the *Reductive* subset.

  **The Finding:** It is impossible to jointly satisfy **Extensional Adequacy (1 & 2)**, **Non-Circularity (9)**, and **Reductive Analysis (12)**.
  *   To achieve **Extensional Adequacy** (handling finks and masks), the antecedent of the conditional must specify "ideal conditions" or "retention of the basis."
  *   To specify these conditions adequately without error, one must essentially say "conditions where nothing prevents the manifestation."
  *   This renders the analysis **Circular (violating 9)** because "preventing the manifestation" presupposes the disposition.
  *   If one avoids circularity by making the conditions specific (e.g., "no packing," "no antidotes"), the analysis becomes **Incomplete (violating 1)** because a new, unlisted interferer can always be conceived.
  *   If one avoids circularity and incompleteness by making the conditions vacuous, the analysis becomes **Trivial (violating 12)**.

  This trilemma is the main result of this exercise. It demonstrates that the set of requirements necessary for a *successful reductive analysis* is inconsistent. You can have extensional adequacy and reduction only at the cost of circularity; you can have non-circularity and reduction only at the cost of extensional adequacy.

  #### 4. The Single Eliminating Requirement
  The single requirement that eliminates the largest number of candidate families is **Extensional Adequacy regarding Interference Cases (1 & 2)**.
  *   It immediately eliminates the **Simple Conditional Analysis**, which was the historical baseline.
  *   It places severe pressure on **Lewis's Reformed Analysis**, forcing it into the circularity trilemma described above.
  *   It forces **Placeholder Accounts** to admit they are not providing truth conditions, only systematization.
  *   It forces **Pandispositionalism** to explain interference without categorical bases.

  While the demand for *Reduction* eliminates the Placeholder view by definition, the demand for *Extensional Adequacy* is the active filter that forces the evolution of the field from the Simple Conditional to the current complex landscape. It is the gatekeeper; any account that fails to handle the wire, the glass, and the venom is simply not an account of dispositions.

  ### Verdicts on Candidate Families

  **The Simple Conditional Analysis**
  *   **Verdict:** Inadequate.
  *   **Reason:** Fails Extensional Adequacy (1 & 2). It cannot distinguish the fragile glass packed in foam from the non-fragile stone, as both yield the same conditional truth-value ("If struck, it would break" is false for both).

  **Lewis's Reformed Analysis (Intrinsic Basis + Complete Cause)**
  *   **Verdict:** Extensionally Adequate but Metaphysically Costly.
  *   **Reason:** It handles Finks and Masks by building the retention of the basis into the antecedent. However, it flirts with the Inconsistency Finding (The Trilemma). To specify the "complete cause" without circularity is difficult; to specify it with circularity sacrifices the reductive aim. It also struggles with the Regulatory Stability (8) if the "basis" is context-sensitive.

  **The Placeholder Account (Dispositions as Primitives)**
  *   **Verdict:** Adequate for Systematization, Inadequate for Reduction.
  *   **Reason:** It satisfies all Non-Negotiables (1–8) easily by treating dispositions as sui generis properties. It handles interference by distinguishing the property from the manifestation conditions. However, it explicitly rejects the Partisan demand for Reduction (12) and Non-Circularity (9), offering no analysis of what the property *is*, only how it *behaves*.

  **Pandispositionalism (Every Property is Dispositional)**
  *   **Verdict:** Adequate for Systematization, Inadequate for Categoricalists.
  *   **Reason:** It satisfies Non-Negotiables and avoids the need for a Categorical Base (11). It handles interference by treating masks as conflicting dispositions. However, it violates the Partisan demand for a Categorical Base and faces its own regress problems (if every property is a disposition for a manifestation, and the manifestation is a property, is the manifestation also a disposition?). It is a viable option only if one abandons the Categoricalist intuition.
