answer: |-
  Here is the systematic translation of the four positions into the vocabulary of representational measurement theory, followed by an analysis of the specific questions, the QALY test case, and the final residue report.

  ### I. Translation of Positions

  **1. Robbins: The Positivist Dismissal**
  *   **Measurement-Theoretic Formulation:** Robbins asserts that for any two distinct individuals $i$ and $j$, there exists no empirical relational system $(A_i \cup A_j, \succeq_{cross})$ containing cross-person ordering relations that satisfies the axioms required for a homomorphism into a numerical system with a uniqueness class narrower than independent ordinal scales. Consequently, a statement of the form $\phi_i(x) > \phi_j(y)$ is not meaningful, as its truth value is not invariant under the group of admissible transformations $\mathcal{F} = \{ (\psi_i, \psi_j) \mid \psi_i, \psi_j \text{ are strictly increasing} \}$.
  *   **What Had to be Bent:** Robbins's argument relies on a behaviorist constraint on what counts as an "empirical relation" (observable choice only). Representational theory is neutral on the epistemic access to the empirical system; it only demands the system exist. To translate Robbins, one must import his epistemic restriction as a constraint on the admissibility of the empirical relational system itself.
  *   **What Has No Formulation:** The normative force of "unscientific." Measurement theory can identify a statement as meaningless (non-invariant), but it cannot validate the methodological prescription that meaningless statements must be excluded from discourse. Furthermore, Robbins's claim often implies an ontological impossibility (minds are private), whereas measurement theory treats the absence of a relation as a structural gap that could, in principle, be filled by new axioms.

  **2. Harsanyi: Extended Sympathy and Utilitarianism**
  *   **Measurement-Theoretic Formulation:** Harsanyi postulates an expanded empirical system where the objects of choice include "being person $i$ in state $x$." He argues that the axioms of expected utility apply to this extended system, yielding a representation $\phi$ unique up to a positive affine transformation. The social welfare function is an additive conjoint measurement structure over persons. The equal-weighting condition imposes a symmetry constraint on the representation, effectively selecting a specific normalization where the origin and unit are common across all $i$.
  *   **What Had to be Bent:** The "impartial observer" is a thought experiment, not an empirical relational system in the standard sense. To fit this into measurement theory, one must treat the axioms of rational choice under risk as applying to moral judgments, effectively treating ethical intuitions as the empirical base relations. This bends the distinction between the empirical system (observed) and the numerical system (constructed).
  *   **What Has No Formulation:** The moral authority of the impartial observer. Measurement theory can describe the structure of the aggregation (additive), but it cannot represent the *validity* of the veil of ignorance as a moral procedure. Additionally, the move from "is" (the observer's preferences) to "ought" (social welfare) is a bridge that representational theory, being descriptive of structure, does not build.

  **3. Sen: Sympathy, Commitment, and the Veil**
  *   **Measurement-Theoretic Formulation:** Sen's objection to Harsanyi is that the extended sympathy ordering collapses distinct empirical systems $(A_i, \succeq_i)$ into a single isomorphic system by stipulation rather than by establishing a linking relation $R_{ij} \subseteq A_i \times A_j$. Regarding commitment, Sen posits a choice function $C(S)$ that does not maximize any ordering $\succeq$ defined over the agent's personal welfare. This requires a representation involving at least two distinct orderings (e.g., well-being vs. all-things-considered) where the choice maximizes the latter even when it contradicts the former.
  *   **What Had to be Bent:** Standard representational theory seeks a single homomorphism that preserves structure. Accommodating commitment requires modeling a conflict between representations or a failure of the representation theorem (choice does not reveal preference). This bends the framework from a theory of measurement to a theory of structural inconsistency.
  *   **What Has No Formulation:** The concept of "agency" as distinct from "well-being." While one can model two orderings, measurement theory has no intrinsic vocabulary to distinguish which ordering represents the "self" and which represents the "moral agent." It treats them as isomorphic structures, missing the phenomenological distinction Sen relies on.

  **4. Arrow: Impossibility as Information Restriction**
  *   **Measurement-Theoretic Formulation:** Arrow's theorem is read as a result concerning the invariance of the social welfare functional. The functional is restricted to depend only on features of the profile of utility functions that are invariant under the group of independent ordinal transformations. The impossibility arises because the invariance class is too large (ordinalism) to permit a functional that satisfies Pareto and Independence of Irrelevant Alternatives without becoming dictatorial. Enlarging the information base (e.g., to interval scales) restricts the admissible transformations, potentially allowing a non-dictatorial representation.
  *   **What Had to be Bent:** Arrow's original formulation is in terms of orderings over social states, not numerical utility functions. The translation assumes a representation exists for each individual first. This bends the chronology: Arrow denies the possibility of a social ordering; the measurement reading assumes individual representations and asks about the aggregation of their scales.
  *   **What Has No Formulation:** The democratic intuition behind "non-dictatorship." In measurement theory, a dictator is simply a projection function. It is structurally valid. The objection to it is political, not structural. Measurement theory can identify the structural necessity of a dictator under ordinal constraints, but it cannot encode the illegitimacy of that structure.

  ### II. Analysis of Specific Questions

  **Robbins: Empirical Absence or Semantic Thesis?**
  Robbins's refusal is best read as a conjunction of both, but the measurement-theoretic lens separates them. The claim that there is no empirical relational system spanning two persons is a substantive hypothesis about the world (ontic). The claim that statements are meaningless is a consequence of the uniqueness theorem given that absence (semantic). Representational theory supplies the semantic thesis independently: *if* the empirical system lacks cross-person relations, *then* the uniqueness theorem permits independent ordinal transformations, rendering cross-person statements non-invariant. Robbins imports the additional premise that we are forbidden from *stipulating* such relations for theoretical convenience. Thus, the measurement vocabulary clarifies that Robbins's position is not just that comparisons are currently unmeasured, but that the empirical structure required to measure them is absent and cannot be conjured by convention.

  **Harsanyi: Normalization or Substantive Hypothesis?**
  Harsanyi's device amounts to a substantive hypothesis that masquerades as a normalization convention. In measurement terms, he asserts that the empirical relational system for the "impartial observer" satisfies the axioms of expected utility, which guarantees an interval scale (unique up to positive affine transformation). The move to set weights equal is a normalization convention *only if* one assumes the individuals are identical in terms of the empirical structure (i.e., the mapping from states to utility is isomorphic across persons). If they are not isomorphic, equal weighting is a substantive ethical hypothesis.
  Regarding invariance: Harsanyi requires comparability of units (interval comparability). He does not strictly require comparability of levels (ratio scale), as utilitarianism sums utilities, and adding a constant to everyone's utility does not change the ordering of social states if the population is fixed. However, to compare *gains* and *losses* across persons, one needs a common unit. The claim is that cross-person utility *differences* are invariant under the subfamily of transformations where the slope parameter $a$ is common across all individuals ($\phi'_i = a\phi_i + b_i$). This is "unit comparability" with "level non-comparability."

  **Sen: Manufactured Comparability?**
  Yes, Sen's charge translates precisely as the assertion that Harsanyi has stipulated an isomorphism between distinct empirical systems rather than deriving it from a linking relation. In measurement terms, Harsanyi assumes the existence of a joint representation $\Phi$ that maps all $A_i$ into $\mathbb{R}$ with a common scale type, without providing the empirical relations $R_{ij}$ that would necessitate this uniqueness class. Sen argues that without empirical links (like shared experiences or objective needs), the common scale is a mathematical artifact, not a measurement.

  **Commitment: Axiom Violation or New Measurand?**
  Representational measurement theory can accommodate commitment, but only by expanding the empirical system. If choice does not maximize a single ordering over consequences, the theory registers this as an axiom violation (e.g., failure of transitivity or revealed preference axioms). To accommodate it without declaring the agent "irrational," one must redefine the measurand. Instead of measuring "preference over outcomes," one measures "preference over outcomes conditional on a norm." This requires a multi-attribute representation or a hierarchy of orderings. It is not that the pattern is unmeasurable; it is that the original empirical system (simple choice) was insufficient to support the representation. The framework handles it by complexifying the empirical base, not by abandoning representation.

  **Arrow: Invariance Constraint?**
  The gloss is accurate and arguably clarifies the original claim. Restricting the social functional to ordinal profiles is exactly an invariance constraint: the functional must yield the same social ordering for any profile of utility functions that are order-equivalent. This gloss strengthens the original claim by revealing that the impossibility is not a peculiarity of voting rules but a structural consequence of demanding invariance under a large transformation group while requiring other structural properties (Pareto, IIA). It shifts the blame from "democracy is hard" to "ordinal information is structurally insufficient for additive aggregation."

  ### III. Test Case: Quality-Adjusted Life Years (QALYs)

  The practice of summing QALYs across persons presumes a ratio scale with a common origin and unit.
  1.  **Common Zero (Death):** This is a stipulation, not an empirical discovery. In measurement terms, it fixes the origin. There is no empirical relational system that forces "death" to map to 0 naturally; it is a normalization convention adopted for tractability.
  2.  **Common Unit (Full Health Year):** This presumes that a year of full health for person $i$ is equivalent to a year of full health for person $j$. This is a claim of unit comparability.
  3.  **Summation:** This presumes the attribute is extensive across persons (additive conjoint structure).

  Are these empirical or normative? In the measurement vocabulary, the *structure* (additivity) is an empirical hypothesis subject to test (e.g., does trading health years satisfy the Thomsen condition?). However, the *normalization* (death=0, full health=1) is a convention. The objection that cross-person summation is meaningless survives the translation but shifts ground. It reduces to a complaint that the empirical relations required to support the additive representation across persons (e.g., indifference between saving person $i$ for 1 year vs. person $j$ for 1 year) are not established. If those relations are stipulated rather than observed, the measurement is normative. The "meaninglessness" objection is thus a claim that the invariance class is being artificially restricted by convention rather than by empirical structure.

  ### IV. Residue Report

  The translation of the interpersonal utility debate into representational measurement theory succeeds in clarifying the logical structure of the arguments but leaves a significant residue that the framework cannot digest. This residue sorts into two heaps.

  **Heap 1: Limitations of Representational Measurement Theory**
  The largest piece of residue is the silence regarding the **measurand**. Representational theory is indifferent to whether the homomorphism $\phi$ maps onto pleasure, desire satisfaction, capability, or objective list items. It validates the structure of the scale, not the ontology of the quantity. In the ICU debate, the substantive disagreement is often about *what* is being compared, not *how*. Robbins denies the existence of the relation; Harsanyi assumes the relation exists for "utility"; Sen argues the relation exists for "capability" or "functioning." Measurement theory cannot adjudicate this because it treats the empirical system as given. It has no vocabulary to critique the selection of the empirical base itself, other than to check for internal consistency.

  Furthermore, the theory struggles with **normative agency**. When Sen speaks of commitment, he describes an agent acting against their own welfare ranking. Measurement theory can model this as a conflict between two orderings, but it cannot capture the *normative force* that makes one ordering "welfare" and the other "commitment." It sees two relations; it does not see the moral hierarchy between them. Similarly, the objection to dictatorship in Arrow's theorem is political, not structural. Measurement theory identifies the dictator as a valid projection function; it cannot express why this is undesirable. The framework is ethically neutral, which renders it incapable of fully capturing debates that are essentially ethical.

  **Heap 2: Disagreements that are Normalization Choices**
  A significant portion of the debate, once translated, reveals itself as a dispute over which invariance class is appropriate. Robbins insists on the class of independent ordinal transformations. Harsanyi insists on the class of common affine transformations. Sen often argues for partial comparability (a subfamily between the two).
  Where the disagreement is purely about the *admissibility* of transformations without reference to empirical grounding, it is a choice of normalization. For example, setting death to zero in QALYs is a normalization. If the debate were only about this, it would be resolvable by convention.
  However, the **underlying substantive disagreement** remains the existence of the empirical relations that *justify* restricting the invariance class. It is not a matter of convention whether the empirical world supports additive conjoint measurement across persons. If the empirical relations (e.g., trade-offs between persons' health) do not hold, then restricting the invariance class to allow summation is not a convention; it is a falsehood. Thus, the "normalization" heap is smaller than it appears. Most of the substantive weight lies in the claim that the empirical world possesses the structure required to support the narrower invariance class.

  **Verdict**
  Representational measurement theory provides a rigorous syntax for the debate but lacks the semantics to resolve it. It successfully exposes that Robbins's skepticism is a claim about the absence of specific empirical relations, and that Harsanyi's utilitarianism is a claim about the existence of an additive structure with a common unit. It shows that Arrow's impossibility is a theorem about information invariance.
  However, the theory's silence on the **ontology of the measurand** is the critical failure. It can tell you that a scale is interval, but not whether that interval scale measures what matters morally. It can tell you that summation is meaningful only if the scale is interval and comparable, but it cannot tell you whether human well-being *is* the kind of thing that admits such a scale. The economists are not merely measuring; they are ontologically committing. They are asserting that well-being has a structure akin to mass or length. Measurement theory can verify the consistency of that assertion, but it cannot verify the assertion itself. The residue is the realization that the debate over interpersonal comparisons is not a technical dispute about scale types, but a metaphysical dispute about the nature of value, for which the representational tradition has no vocabulary other than structural isomorphism.
