answer: |-
  Your working hypothesis is wrong because the Principal Principle is a normative constraint on singular belief formation prior to empirical verification, whereas calibration is an aggregate empirical property of forecast sequences, and collapsing them conflates ex-ante rationality with ex-post accuracy.

  ### Clause-by-Clause Translation

  **1. Chance ($x$)**
  *   **Lewis:** An objective, singular propensity of the world, distinct from frequency or belief.
  *   **Your Vocabulary:** A latent parameter $\theta$ within a stochastic model, defined operationally as the limiting frequency within a reference class.
  *   **Translation Status:** **Distorted.** You treat chance as an inferential target derived from frequencies; Lewis treats it as a metaphysical primitive that *grounds* the frequencies. You cannot access $x$ without a model and data; Lewis requires you defer to $x$ even if you lack the data to confirm it, provided you accept the hypothesis $X$.

  **2. Credence ($C$)**
  *   **Lewis:** An agent's subjective degree of belief, constrained by rationality.
  *   **Your Vocabulary:** The reported probability $\hat{p}$ output by your model.
  *   **Translation Status:** **Clean.** Functionally, your model's output plays the role of credence in decision pipelines. However, you likely strip the "belief" semantics to avoid anthropomorphizing the model, whereas Lewis requires a believing agent.

  **3. Conditionalization on a Chance Hypothesis ($X$)**
  *   **Lewis:** Conditioning on the proposition "The objective chance of $A$ is $x$."
  *   **Your Vocabulary:** Conditioning on the model specification and its estimated parameters.
  *   **Translation Status:** **Distorted.** You never condition on "The chance is $x$" because you never know that proposition is true; you condition on "The model says $x$." Lewis's principle binds you if you *assume* $X$ is true; your practice binds you to test whether $X$ *is* true. You treat the chance hypothesis as falsifiable; Lewis treats it as a fixed point for rationality.

  **4. Admissible Evidence ($E$)**
  *   **Lewis:** Information that does not reveal the outcome of $A$ and does not "undermine" the chance hypothesis (e.g., information about the future that would change the chance assignment).
  *   **Your Vocabulary:** The feature set $\mathbf{X}_t$ and history $\mathcal{H}_t$ available at forecast time $t$, strictly excluding leakage from $t+1$.
  *   **Translation Status:** **Partial Match.** Your data pipeline enforces causal admissibility (no future leakage). However, Lewis's admissibility also excludes information that reveals the chance hypothesis itself is false (undermining futures). In your practice, if evidence suggests the model is wrong, you update the model; Lewis's principle assumes the chance hypothesis is fixed for the sake of the constraint.

  **5. Status as a Constraint**
  *   **Lewis:** An ex-ante requirement of rationality. You violate it if your credence diverges from known chance, regardless of whether the event occurs.
  *   **Your Vocabulary:** An ex-post goal of calibration. You violate it only if the PIT histogram deviates from uniform or the reliability diagram diverges from the diagonal over many trials.
  *   **Translation Status:** **No Counterpart.** You have no metric for rationality independent of outcomes. Lewis claims you are irrational even if you get lucky; you claim you are fine as long as the scores converge.

  ### Addressing Your Suspicions

  **1. Level Mismatch (Singular vs. Aggregate)**
  This possibility is real, not an artifact of your gloss. The Principal Principle applies to a single proposition at a single time: if the chance of rain is 0.3, your credence must be 0.3, even if it never rains in your lifetime. Calibration requires a sequence: if you say 0.3 a thousand times, it must rain roughly 300 times. You can satisfy PP on every occasion (by faithfully reporting your model's latent parameter) and fail calibration (because the model is biased). Conversely, you can achieve perfect calibration by hedging or post-hoc adjustment while violating PP on every single case (by reporting probabilities you do not believe reflect the chance). Your practice optimizes the aggregate; Lewis optimizes the singular instance's rationality.

  **2. Admissibility**
  The analogue of exclusion in your practice is causal isolation (preventing data leakage). However, Lewis's admissibility does substantive work beyond causal ordering. It rules out "undermining" information—knowledge of the future that would change the present chance assignment in a Humean world. In your prequential evaluation, you assume the data-generating process is fixed or slowly varying; you do not account for the logical possibility that the outcome itself determines the chance (retrocausality or logical undermining). Your vocabulary assumes the chance is a parameter *of* the process; Lewis worries about information that reveals the process *is not* what you thought. Your exclusion is operational (pipeline integrity); his is logical (consistency of chance hypotheses).

  **3. Status of the Chance Quantity**
  You posit probability as a model parameter tested against frequencies. Lewis requires deference to chance *prior* to frequency confirmation. This deference has no counterpart in your practice. You do not defer to chance; you infer it. If your friend argues for the reverse (Chance = Ideal Credence), this translates to "True Probability = Output of an Ideal Model." This has operational meaning only if "Ideal Model" is defined as the limit of your model class as complexity $\to \infty$ and data $\to \infty$. Without that limit definition, the reversal is purely metaphysical. In your vocabulary, "Chance" is always an estimate; in Lewis's, "Chance" is the target that validates the estimate. Your practice has silently substituted *estimable parameters* for *objective chances*.

  ### Residue Report

  **1. Singular Objective Probability**
  *   **Philosophy Contains:** A truth value for the probability of a single, non-repeatable event (e.g., this specific grid load exceedance tomorrow) independent of any reference class.
  *   **Forecasting Lacks:** You only define probability relative to a reference class or model structure.
  *   **Verdict:** **Defect in Vocabulary (for Ontology), Empty for Practice.** If you need to claim your forecast is "true" for *this* event rather than "calibrated" for *this class*, you lack the concept. For scoring and decision-making, the reference class suffices.

  **2. Normative Force Independent of Scores**
  *   **Philosophy Contains:** A reason to hold a credence of 0.3 even if doing so consistently yields poor Brier scores in the short run (because the chance *is* 0.3).
  *   **Forecasting Lacks:** Justification for a forecast other than empirical performance or model derivation.
  *   **Verdict:** **Empty Metaphysics.** In your work, a model that is "rationally deferential" but poorly calibrated is a broken model. You discard it. Lewis would say the agent was rational but the world was unkind; you say the model was wrong. The philosophical distinction does no work in model selection.

  **3. Admissibility as Logical Constraint**
  *   **Philosophy Contains:** A boundary on knowledge that preserves the objectivity of chance against "undermining" futures.
  *   **Forecasting Lacks:** Any concept of information that is causally available but logically inadmissible.
  *   **Verdict:** **Empty Metaphysics.** Your causal ordering handles all operational risks. The logical nuance of undermining futures assumes a metaphysics of chance (Humean supervenience) that your modeling assumptions (fixed or stochastic parameters) simply bypass.

  **4. Deference Prior to Verification**
  *   **Philosophy Contains:** The obligation to align belief with chance before knowing the frequencies.
  *   **Forecasting Lacks:** Any mechanism to validate probabilities without frequencies.
  *   **Verdict:** **Defect in Vocabulary (for Epistemology).** You cannot distinguish between a well-calibrated model and a lucky one without long-run data. Lewis claims you can distinguish rational belief from lucky belief. If you care about the epistemic status of a single forecast before verification, your vocabulary is insufficient. If you only care about long-run utility, it is sufficient.
