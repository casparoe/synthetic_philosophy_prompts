      *   *Point 2: Tractability (Step 8).* "Ought" implies "Can". Even if they matter, we can't help them. We need to maximise *expected impact*, not just *expected value present*.
      *   *Cost of keeping (1):* You must accept that if micro-fauna *were* sentient and we *could* help them easily, we should. You also have to accept rigorous uncertainty modelling.
      *   *Confidence:* High on the Tractability point, Moderate on the Sentience Threshold (since consciousness is hard).
      *   *Least Sure Point:* The exact shape of the sentience probability function (neural correlates of consciousness are disputed).

  7.  **Refining the Argument (Self-Correction/Polishing):**
      *   *Check:* Did I address the "multiply small probabilities by large numbers" objection? Yes, by showing the probability isn't arbitrary; it's tied to physical substrate.
