answer: |-
  Here are nine questions designed for a forty-minute conversation, including follow-ups keyed to her likely defensive maneuver regarding "mechanisms vs. predictions."

  ### 1. The Economic Preconditions
  **Question:** You position your substitution account against the material-interests literature, specifically the debate between Eric Williams, who argued abolition tracked the declining value of the slave system, and Seymour Drescher, who argued the system remained profitable until the end. Does your account require you to take a side in that economic debate? Or can substitution do the work regardless of whether the slave trade was dying or thriving?
  **Follow-up:** If she replies that the theory is about *mechanisms* of change rather than economic *predictions*, press this: "If the mechanism works regardless of the economic backdrop, does that render the economic data irrelevant to your explanation, or merely secondary? Because if Drescher is right and profits were high, the substitution had to overcome material interest; if Williams is right, substitution merely rode a wave. That changes the *strength* of the mechanism you're proposing."

  ### 2. The Availability of Concepts
  **Question:** Bernard Williams suggested that some moral transformations aren't victories of better reasoning because the earlier society literally lacked the ethical concepts required to make the criticism intelligible. Is your substitution mechanism a sociological redescription of Williams's conceptual point, a rival to it, or a specification of how those concepts finally gain traction?
  **Follow-up:** If she claims it is a *specification* of how concepts gain traction, ask: "Does that mean the 'substitute practice' is actually just a new vocabulary? If so, are we talking about a change in language or a change in behavior, and which one is doing the causal work?"

  ### 3. The Symmetry Problem
  **Question:** You argue that honor codes dissolve when a substitute practice discharges their status function. But honor codes are notoriously effective at *entrenching* norms, not just dissolving them. If the same apparatus explains both persistence and change, what would count as evidence against the view?
  **Follow-up:** If she responds that the theory explains *mechanisms* of change, not stability, challenge the boundary: "But if the absence of a substitute explains persistence, and the presence of one explains change, isn't the theory at risk of being unfalsifiable? What empirical observation would force you to concede that honor wasn't the driver?"

  ### 4. Progress vs. Fashion
  **Question:** If a practice ends because it no longer confers status rather than because it is recognized as wrong, do we have grounds to call this 'moral progress' rather than a change of fashion? Does the *reason* for the abandonment matter for the moral evaluation of the outcome?
  **Follow-up:** If she insists the outcome is what matters (consequentialism), ask: "Then what explanatory work is left for the reformer's belief that the practice was *intrinsically* wrong? Are they essentially deluded about why they succeeded?"

  ### 5. The Reformer's Psychology
  **Question:** Reformers in your examples—abolitionists, anti-footbinding activists—believed they were winning arguments. On your account, they were actually engineering status markets. Does this imply that successful reformers are often mistaken about the source of their own success?
  **Follow-up:** If she says it's about *mechanisms* not *intentions*, press: "If the mechanism operates behind the backs of the agents, does that undermine the democratic legitimacy of the reform? It suggests the public was manipulated into a new equilibrium rather than persuaded."

  ### 6. Redirecting the Audience
  **Question:** You suggest British abolition succeeded when petitioning campaigns redirected the relevant audience from the planter's circle to the nation's self-image. How do you identify the 'relevant audience' in real-time? Is it defined by who holds the power, or who holds the honor?
  **Follow-up:** If she says it's about who confers *status*, ask: "But status is often fragmented. In the American Civil War, for example, the 'audience' split. Does your theory predict stalemate when audiences fracture, or does it require a hegemonic audience to function?"

  ### 7. Engineering Substitutes
  **Question:** If we accept your account, it suggests we should design substitute practices to end current harms. But isn't outsiders engineering an honor substitute a form of manipulation? At what point does social engineering become coercive?
  **Follow-up:** If she replies that the theory describes *mechanisms* not *prescriptions*, ask: "But you've presented this in a way that invites application. If you refuse to prescribe, are you offering a tool for policymakers or just a lens for historians? Because if it's a tool, the manipulation objection stands."

  ### 8. Who Defines the Substitute?
  **Question:** In the case of footbinding, the substitute was unbound feet within a marriage market. Who gets to define what counts as an adequate substitute? In your examples, it seems to be elites or reformers. Does this theory inadvertently privilege the power to define status over the power to suffer?
  **Follow-up:** If she argues that the *market* decides the substitute, ask: "But marriage markets and officer corps are hardly free markets. If the substitute is imposed by a dominant group, is the 'moral revolution' just the imposition of a new hierarchy?"

  ### 9. Falsification
  **Question:** Finally, to return to the scientific status of the claim: What specific historical observation would falsify the substitution account? Is there a case where a practice ended without a substitute, or a substitute was introduced and the practice persisted?
  **Follow-up:** If she falls back on "the theory is about mechanisms, not predictions," close with: "If a theory of causal mechanisms cannot specify conditions under which the mechanism *fails* to operate, how do we distinguish it from a tautology? I ask because the historians in the room will want to know if this is a historical law or a heuristic."

  ***

  ### Confidence Assessment & Attribution Check

  I am **highly confident** in the general attributions of Eric Williams (*Capitalism and Slavery*) and Seymour Drescher (*Econocide*) regarding the broad strokes of their arguments (Williams = economic decline caused abolition; Drescher = abolition occurred despite economic viability). These are standard historiographical touchstones.

  I am **moderately confident** in the attribution to Bernard Williams regarding "ethical concepts." While the sentiment aligns with his work in *Ethics and the Limits of Philosophy* and *Shame and Necessity* regarding "thick ethical concepts" and the intelligibility of past moralities, phrasing it as "lacked the ethical concepts that would have made the criticism available" is a specific interpretation of his work that some philosophers might nuance differently (e.g., distinguishing between *having* a concept and *applying* it).

  **The Single Point to Hedge:**
  I am **least sure** about the specific empirical claim regarding **British Abolition and the "redirected audience."**
  *   **The Claim:** "British abolition mattered because the petitioning campaigns redirected the relevant audience from the planter's circle to the nation's own self-image."
  *   **Why Hedge:** While this fits the guest's theory (as described in your prompt), it is a contentious historical causal claim. The two economic historians in your audience may object that this oversimplifies the parliamentary maneuvering, the role of the French Revolution, or the specific economic shifts of the 1830s. Furthermore, attributing the *success* solely to the "national self-image" audience shift ignores the role of enslaved resistance (e.g., the Baptist War in Jamaica), which many modern historians argue was the primary driver.
  *   **Recommendation:** In Question 6 ("Redirecting the Audience"), you might soften the premise. Instead of stating "You suggest British abolition succeeded *because*...", phrase it as: "You *interpret* British abolition as a case where petitioning campaigns redirected the audience..." This invites her to defend the interpretation without you endorsing the historical causality as settled fact.
