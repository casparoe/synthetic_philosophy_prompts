answer: |-
  You have identified a specific, pathological failure mode in organizational forecasting. While there is no single universally standardized noun for the exact socio-cognitive phenomenon you describe, the "carving" you are looking for exists in the decomposition of forecast skill, and the defect lies in the violation of **proper scoring rules** by an **asymmetric organizational loss function**.

  Here is the breakdown of the established concepts, the distinction from similar phenomena, the location of the defect, and a coined term to help you test for it.

  ### 1. The Established Carving: Calibration vs. Resolution

  The mathematical framework that exposes this behavior is the **Murphy Decomposition** of the Brier Score (or similar proper scoring rules). It splits forecast "skill" into two distinct components:

  1.  **Calibration:** Do events happen X% of the time when you predict X%? (e.g., of all the things you said were 70% likely, did 70% of them happen?)
  2.  **Resolution (or Discrimination):** Do you assign different probabilities to events that have different outcomes? (e.g., do you distinguish between the 70% events and the 30% events, or do you call everything 55%?)

  **The Diagnosis:** Your team is maximizing **Calibration** at the total expense of **Resolution**.
  A forecaster who predicts 50% for everything will have perfect calibration (assuming a balanced dataset) but zero resolution. They provide no information. Your reviewers are rewarding perfect calibration (no "surprises") while unknowingly penalizing resolution (bold distinctions). In forecasting science, this is known as **Resolution Decay** or **Loss of Discrimination**.

  ### 2. The Mechanism: Improper Scoring via Asymmetric Loss

  Mathematically, a **Proper Scoring Rule** (like the Logarithmic Score or Brier Score) is designed so that a forecaster maximizes their expected score *only* by reporting their true belief.

  However, your organization has overlaid a **Career Loss Function** onto the mathematical score.
  *   **Mathematical Rule:** Reward for 95% Hit $\approx$ Penalty for 95% Miss.
  *   **Organizational Rule:** Reward for 95% Hit $<$ Penalty for 95% Miss.

  Because the penalty for a confident miss is disproportionately high (reputational damage, review penalties), the *effective* scoring rule becomes **improper**. It no longer incentivizes truth-telling; it incentivizes variance minimization.

  ### 3. Distinguishing the Phenomenon

  You asked how to distinguish this from three other states. Here is the boundary line:

  *   **Vs. Deliberate Understatement (Sandbagging):**
      *   *Sandbagging:* $P_{reported} < P_{belief}$. The forecaster knows the risk is high but reports it as moderate to stay safe. There is cognitive dissonance.
      *   *Your Case:* $P_{belief} \rightarrow P_{reported}$. The forecaster's internal model has actually updated to reflect lower confidence. The incentive has bypassed the strategic layer and rewritten the belief layer. This is **adaptive preference**.
  *   **Vs. Genuine Agnosticism:**
      *   *Agnosticism:* High entropy in the *data*. The forecaster says 50/50 because the signal is noise.
      *   *Your Case:* High entropy in the *incentive*. The forecaster says 50/50 even when they see a signal, because the cost of acting on the signal outweighs the benefit of being right.
  *   **Vs. Valid Risk Aversion:**
      *   *Valid:* A confident miss *actually* destroys the company (e.g., "We have enough cash for payroll" at 95% confidence). Here, caution is a decision constraint.
      *   *Your Case:* A confident miss only destroys the *review score*. The forecast is being treated as a **promise** rather than a **probability**.

  ### 4. Locating the Defect

  The defect is not primarily in the agent; it is in the **Evaluation Protocol**.

  The agents are behaving rationally. They have correctly identified that the organization values **liability avoidance** over **informational gain**. The psychological internalization ("genuinely feeling less sure") is a coping mechanism to reduce the cognitive dissonance of reporting numbers they don't believe. It is easier to convince yourself you are unsure than to live with the anxiety of being professionally punished for a mathematically correct bold call.

  The organization is optimizing for **Post-Hoc Defensibility** rather than **Pre-Hoc Utility**.

  ### 5. A Coined Term: "Incentivized Epistemic Compression" (IEC)

  Since no single term captures the feedback loop of asymmetric penalty $\rightarrow$ belief distortion $\rightarrow$ reward for blandness, I propose **Incentivized Epistemic Compression**.

  **Definition:**
  > A systemic degradation of forecast resolution caused by an evaluation framework that imposes asymmetric penalties on confident errors. Unlike strategic sandbagging, IEC is characterized by the internalization of caution, where forecasters' genuine confidence intervals narrow toward the base rate to minimize evaluative variance, resulting in forecasts that are defensibly calibrated but informationally useless.

  **How to Test for IEC:**
  To determine if your review scheme has this property, run these three checks:

  1.  **The Variance Test:** Calculate the standard deviation of all probabilities issued over time. If $\sigma_{probabilities}$ trends toward 0 (all 50s) while the base rate of outcomes remains mixed, IEC is present.
  2.  **The Asymmetry Ratio:** Quantify the review penalty.
      $$ \text{Ratio} = \frac{\text{Cost of 90\% Miss}}{\text{Benefit of 90\% Hit}} $$
      If Ratio $> 1$, the system is improper. In a healthy system, a 90% hit should credit you enough to survive a 90% miss.
  3.  **The Counterfactual Survey:** Ask forecasters: *"If your bonus were decoupled from forecast accuracy, would you assign higher probabilities to your high-confidence events?"* If the majority say "Yes," the confidence compression is incentivized, not evidentiary.

  **Boundary Cases:**
  *   **Not IEC:** A team predicting truly chaotic systems (e.g., quantum events or pure noise) where 50/50 is the honest truth. (Check: Does the team distinguish easy vs. hard questions? If they treat hard questions the same as easy ones, it's IEC).
  *   **Not IEC:** A safety-critical environment where a confident miss causes physical harm. Here, the asymmetry is real-world, not evaluative. (Check: Is the penalty reputational or existential? If reputational, it's IEC).

  ### Summary
  You are watching **Resolution Decay** driven by an **Improper Scoring Rule**, resulting in **Incentivized Epistemic Compression**. The reviewers are congratulating the team on achieving **Trivial Calibration**. The fix requires decoupling *forecast accuracy* from *performance liability*, or switching to a scoring rule (like Log Score) that mathematically rewards boldness enough to offset the risk, and ensuring management understands that a "bold miss" is often more valuable than a "timid hit."
