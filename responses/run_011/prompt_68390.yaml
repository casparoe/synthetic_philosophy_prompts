      Fifteen years ago, there was a pileup. Overflow hit this ER. One trauma bay. One surgeon. My mom had to choose where to put them. She put everything on one guy who barely had a pulse. Three others waited. Two made it. One didn't. Those survivors are sitting right there at the front table. They know what happened. We all know what happened.

