prompt: |-
  ok so kind of a weird ask but I need help. My mom is retiring in three weeks after 31 years as an ER nurse — charge nurse, she ran night triage for most of it — and my dad signed me up to give the toast at her party without asking me. I'm 17. There'll be about 50 people: mostly nurses, techs and a couple of doctors who have done actual mass-casualty triage, plus our family, plus — this is the part that matters — three of her former patients who are now friends of ours and will be sitting at the front table.

  Here's why it's hard. I've been reading Taurek for my ethics elective, the paper about whether the numbers should count, and since then I can't write a normal "she saved so many lives" speech without feeling like I'm saying something I think is false. So you have my understanding of it, roughly: he thinks if you can save either one person or five, the five deaths aren't five times worse than the one, because there's no single person who loses five lives. Each of the five only loses their own, and the losses don't pile up into one big loss that anybody actually has. So instead of automatically going with the bigger number he says give each person an equal chance — like, actually flip a coin. He also thinks it's not immoral to save your friend rather than a stranger. If I've got any of that slightly wrong, fix it rather than repeating my version.

  The incident. Fifteen years ago there was a pileup on the interstate and her department got the overflow. One trauma bay, one surgeon available. She put all of it — the bay, the surgeon, the blood — on a single guy who came in basically not alive, for like forty minutes, while three others who could've been handled fast waited. He lived. He's 62 now, he's coming to the party, he sends her a card every Christmas. Two of the three who waited also lived and they're coming too, and they're all friendly about it now, which somehow makes it worse. The third one didn't. My mom has never said out loud whether she'd make that call again, but she has told me that if she'd had a quarter in her pocket that night she would have flipped it, and that she's never figured out whether admitting that is a terrible thing or the only honest thing. That line is real, please use it, it's the whole speech to me.

  What I need it to do:
  - about 550 words, 3-4 minutes, written to be read aloud by a teenager who is nervous
  - no philosophy jargon at all. the word "aggregation" cannot appear. do not name Taurek or quote the paper (I don't have my copy and nobody in that room wants a quotation) — the argument has to be in the speech without ever being announced as one
  - it can't sound like I'm telling 40 people that their entire professional lives of counting and sorting patients has been a mistake, because it hasn't and they'd be right to throw bread at me
  - but it also can't just fold and say "well the numbers always count," because she doesn't believe that about that night and I don't either
  - my mom hates the phrase "she saved as many as she could." she's told me it makes the other ones sound like inventory. don't use it or anything that amounts to it
  - the hospital's retirement plaque has a number engraved on it, roughly 4,000 patients. I want the speech to actually deal with that number instead of glossing it, and I'd like it to land on it at the end
  - my ethics teacher keeps making an objection I can't answer, which is that if the numbers really don't count you can't even explain why the hospital should buy a second ventilator. I don't want the speech to dodge that, but the response has to come out of the story and the people at the front table, not out of a mini-lecture
  - one moment where the room laughs, and it should be affectionate, at her or at me, not a roast
  - and please don't make it a hero speech. she would walk out.

  Also the three patients at the front table know exactly which decision the speech is circling, so it can't pretend they don't.
