answer: |-
  Hi. I'm [Name]. Full disclosure: my dad signed me up for this without asking. I think that was his own form of triage—he sacrificed me so the rest of the family could get to the shrimp faster. (Pause for laugh).

  Seriously though, looking at this room, I know what you do. You sort chaos. You make impossible calls. There's a plaque out front with a number on it. Roughly 4,000 patients. It's tempting to look at that and think it's a score. Like higher is better. But I've been thinking about what that number actually means.

  Fifteen years ago, there was a pileup. Overflow hit this ER. One trauma bay. One surgeon. My mom had to choose where to put them. She put everything on one guy who barely had a pulse. Three others waited. Two made it. One didn't. Those survivors are sitting right there at the front table. They know what happened. We all know what happened.

  Look at the front table. We buy ventilators so men like them get to sit here. We build wards so nobody has to wait. That's why you all show up every night. You spend your careers making sure the numbers *do* count, so families don't have to lose anyone. That work matters. But when the resources run out, the math breaks. You can't add people up. You can't say three losses weigh more than one, because nobody loses three lives. Each person only loses their own.

  My mom told me once about that night. She said if she'd had a quarter in her pocket she would have flipped it, and that she's never figured out whether admitting that is a terrible thing or the only honest thing.

  That honesty is why you're all here. Not because she saved as many as she could—she hates that phrase, and so do I. It sounds like inventory. You're here because for 31 years, when the resources ran out, she didn't look at a sum. She looked at a face.

  The plaque says 4,000. But that's not a total. It's not a sum of wins. It's 4,000 separate times someone was the only person in the room who mattered. It's 4,000 times she refused to let the numbers decide who was worth saving. It's 4,000 individual worlds that kept spinning. 4,000 times she stood between the dark and someone who wanted to see the morning. That's what the number is.

  So, to the staff: thank you for doing the hard math so we don't have to. And to Mom: thank you for knowing when to stop counting.
