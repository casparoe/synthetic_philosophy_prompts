          The faculty's strongest argument is not about sentimentality but dependency. They argue that half the town's infrastructure exists because of this man's capital, and removing his symbol implicates every street name and trophy case we keep. To condemn him fully is to condemn the town's existence, risking a paralysis where we owe everything to someone we despise. This is a valid fear of the Critical mode destroying the ground we walk on.

