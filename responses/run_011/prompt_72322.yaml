prompt: |-
  So I finally read the Meno, and my friend who did classics keeps saying "knowledge is just true belief plus something" like that wraps the whole thing up. He uses it two ways actually. When I asked what the value problem even is, since Socrates concedes a true belief about the way to Larissa gets you there just as reliably as knowledge does, he said the problem is fake, knowledge obviously has the true belief and then some, and the extra bit is where the value lives. Then separately he used it on a guy in our group chat who claimed animals can't know things, and just said well then the true belief plus the something is what they're missing, case closed.

  Can you seperate out what that slogan could actually be claiming? List the candidate readings of the plus something — is it a property of the belief, a way it was formed, a relation the believer stands in, a difference in kind rather than a list of ingredients — and for each say what you'd be committed to, whether it's a truism nobody denies, whether it's substantive and defensible, and whether it's just false on its own terms. Flag which readings get hit by the swamping worry (once you've said the belief is true, anything else you add looks redundant for the purposes of getting there) and which if any could dodge it.

  Then the part I actually care about: which readings, if true, would let him dismiss the value problem, and which readings would leave it completely untouched. I suspect the two jobs he's using the slogan for need different versions of it and he hasn't noticed. Give me the menu as a list with a one line verdict each, and end with which reading you'd bet he means when he says it out loud.
