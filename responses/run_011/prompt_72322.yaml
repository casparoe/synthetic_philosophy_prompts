answer: |-
  Your friend is using a modern analytic shorthand ("JTB+") to patch over an ancient metaphysical problem, and you are right to suspect the slogan is doing too much heavy lifting. In the *Meno*, the "something" is specifically *aitias logismos* (an account of the reason why), often cashed out as recollection or tethering. In contemporary epistemology, it's usually justification, reliability, or virtue.

  Here is the menu of candidate readings for the "plus something," evaluated by commitments, swamping susceptibility, and their ability to handle your friend's two specific use-cases (Value and Animals).

  ### The Menu of Readings

  **1. The Internalist Justification Reading**
  *   **What is X?** The believer possesses conscious reasons or evidence for the belief.
  *   **Commitments:** You are committed to the idea that access to reasons is necessary for knowledge (rejects externalism).
  *   **Swamping:** **Hit hard.** If the belief is already true, having a reason doesn't make the *outcome* (getting to Larissa) any better instrumentally.
  *   **Value Problem:** Fails. It explains the *structure* of knowledge, not why it is more *valuable* than mere true belief.
  *   **Animals:** Works for your friend. Animals presumably lack propositional reasons, so they lack X.
  *   **Verdict:** **Explains the animal gap but fails to solve the value problem due to swamping.**

  **2. The Reliabilist Reading**
  *   **What is X?** The belief was produced by a truth-conducive cognitive process (e.g., vision, memory).
  *   **Commitments:** You are committed to the idea that causal history matters more than internal access (externalism).
  *   **Swamping:** **Hit hard.** A reliable process is only valuable because it produces true beliefs; if you already have the true belief, the process adds no extra value to *this* instance.
  *   **Value Problem:** Fails. It makes knowledge more *probable*, but not more *valuable* once obtained.
  *   **Animals:** Fails your friend. Animals *do* have reliable perceptual processes, so this reading grants them knowledge.
  *   **Verdict:** **Solves neither problem; it grants knowledge to animals and succumbs to swamping.**

  **3. The Understanding/Grasping Reading (The Actual *Meno* Solution)**
  *   **What is X?** The believer grasps the explanatory connections that make the belief true (seeing *why* it is true).
  *   **Commitments:** You are committed to the idea that knowledge requires a metaphysical or conceptual grip on reality, not just accuracy.
  *   **Swamping:** **Dodges it.** Understanding has final value independent of truth; a stable, tethered belief is more useful than a fleeting true guess.
  *   **Value Problem:** Works. It explains why knowledge is more stable and useful (the "statues of Daedalus" analogy).
  *   **Animals:** Works for your friend. Animals likely track truth without grasping explanatory reasons.
  *   **Verdict:** **The only reading that solves the value problem and excludes animals, but demands high cognitive sophistication.**

  **4. The Virtue/Credit Reading (Virtue Epistemology)**
  *   **What is X?** The truth is credited to the agent's cognitive ability rather than luck.
  *   **Commitments:** You are committed to the idea that knowledge is a type of achievement or success from ability.
  *   **Swamping:** **Dodges it.** Achievements are valuable in themselves, over and above the value of the product (like a winning goal scored by skill vs. an own-goal).
  *   **Value Problem:** Works. It locates value in the *agency*, not just the proposition.
  *   **Animals:** Contingent. If animals have cognitive virtues, they have knowledge; if "virtue" requires rational reflection, they don't.
  *   **Verdict:** **Solves the value problem nicely, but leaves the animal question uncomfortably open.**

  **5. The Truism/Placeholder Reading**
  *   **What is X?** Merely the set difference between the set of True Beliefs and the set of Knowledges.
  *   **Commitments:** You are committed to nothing other than the linguistic intuition that "knowing" implies more than "guessing right."
  *   **Swamping:** **Irrelevant.** This isn't a theory, it's a definition, so it makes no claims about value generation.
  *   **Value Problem:** Fails. It restates the problem ("Knowledge is TB + Value") rather than solving it.
  *   **Animals:** Fails. It offers no criterion to decide if animals fall inside or outside the set.
  *   **Verdict:** **Philosophically inert; it names the gap without bridging it.**

  ***

  ### The Conflict in Your Friend's Usage

  You suspected the two jobs need different versions of the slogan. You are correct.

  1.  **To dismiss the Value Problem:** He needs **Reading 3 (Understanding)** or **Reading 4 (Virtue)**. These are the only ones that dodge the Swamping Problem. They argue that knowledge is *stable* or an *achievement*, which adds value beyond mere truth.
  2.  **To dismiss the Animal Claim:** He needs **Reading 1 (Internalist Justification)** or a strict version of **Reading 3**. He needs X to be something cognitively demanding (like "giving an account") that animals clearly lack.

  **The Tension:** If he uses **Reading 2 (Reliability)** to solve Value (which fails anyway), he accidentally grants knowledge to animals. If he uses **Reading 1 (Internalist)** to exclude animals, he falls prey to Swamping and fails to explain why knowledge is more valuable than true belief. He cannot use the *same* "plus something" to do both jobs unless he adopts the robust **Reading 3 (Understanding)**, which claims animals lack the capacity for explanatory grasping.

  ### The Bet

  **I bet he means Reading 3 (Understanding/Grasping), but he is articulating it as Reading 1 (Justification).**

  As a classics student, he likely has the *Meno*'s specific solution (the "tethering" of belief via reasoning about the cause) in the back of his mind. This reading naturally excludes animals (who don't reason about causes) and solves the value problem (tethered beliefs don't run away). However, because he is speaking in a modern group chat, he is defaulting to the analytic shorthand of "Justification" (Reading 1). He hasn't noticed that "Justification" is too weak to solve the value problem (due to swamping) and "Reliability" is too broad to exclude animals. He is trading on the vagueness of "something" to win two arguments that actually require two different definitions.
