  ### Indistinguishable Pairs

  The following pairs of established philosophical positions are distinct in literature but map to the same leaf in this instrument:

  1.  **Kantian Absolutism & Rule Utilitarianism (Leaf 1):** Both reject the Bond Case as equivalent to false assertion, but for different foundational reasons (duty vs. rule stability). The nodes measure judgment, not justification.
  2.  **Act Consequentialism & Care Ethics (Leaf 8):** Both permit the Beneficent Case, but one cites net good, the other cites relationship maintenance. The tree records permission, not motive.
  3.  **Institutional Responsibility & Role Morality (Leaf 11):** Both affirm the Role Case, but one cites public accountability, the other cites professional virtue. The node captures only the hierarchy of blame.

  ### Empty Cells of the Answer Space

  The theoretical matrix combines **Definition** (Narrow, Broad, Functional) with **Distinction** (Kind, Degree, None). The following cells are empty:

