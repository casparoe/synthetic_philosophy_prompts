  1. **The Bond Case**
     A politician is asked, "Did you take the cash?" He took bonds instead. He says, "No." He knows you will think he took nothing.
     *Is this the same breach of trust as saying "I took nothing"?*
     - **Yes** → Go to Node 2
     - **No** → **Leaf 1**

  2. **The Witness Case**
     A witness sees a crime. Asked, "Did you see anything?" they say nothing.
     *Is this the same breach of trust as saying "I saw nothing"?*
     - **Yes** → Go to Node 3
     - **No** → **Leaf 2**

  3. **The Cheating Case**
     You never cheated. Asked, "When did you stop cheating?" you say, "Last year."
     *Is this the same breach of trust as saying "I cheated"?*
     - **Yes** → Go to Node 4
     - **No** → **Leaf 3**

  4. **The Meeting Case**
     You say, "Meeting at 3" (you believe this, it is actually 4). The hearer disbelieves you.
     *Are you to blame for this statement?*
     - **Yes** → Go to Node 5
     - **No** → **Leaf 4**

  5. **The AI Case**
     An AI assistant omits a risk. A human doctor omits the same risk.
     *Is this the same breach of trust?*
     - **Yes** → Go to Node 6
     - **No** → **Leaf 5**

  6. **The Equal Harm Case**
     Statement A (Known False) causes Harm X. Statement B (Known Accurate but suggests False) causes Harm X.
     *Is the blame identical?*
     - **Yes** → Go to Node 7
     - **No** → **Leaf 6**

  7. **The Unequal Harm Case**
     Statement A (Known False) causes No Harm. Statement B (Known Accurate but suggests False) causes Harm X.
     *Is Statement B more blameworthy?*
     - **Yes** → Go to Node 8
     - **No** → **Leaf 7**

  8. **The Beneficent Case**
     You say something known false to protect someone's feelings.
     *Is this still a breach of trust?*
     - **Yes** → Go to Node 9
     - **No** → **Leaf 8**

  9. **The Public Record Case**
     A misleading statement enters the public record vs. a private conversation.
     *Is the public record breach greater?*
     - **Yes** → Go to Node 10
     - **No** → **Leaf 9**

  10. **The Role Case**
      A policy maker makes the breach vs. a student makes the breach.
