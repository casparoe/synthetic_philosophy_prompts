  2.  **Narrow Definition / Degree Distinction:** *Diagnosis:* Unattractive. Rarely defended; usually, if it's not a lie, it's either permissible or a different kind of wrong, not a "lesser lie."
  3.  **Functional Definition / Kind Distinction:** *Diagnosis:* Unexplored. If the function (deception) defines the act, distinguishing kinds based on syntax is theoretically unstable.
  4.  **Functional Definition / Degree Distinction:** *Diagnosis:* Unexplored. Consequentialists typically equate outcomes; gradations usually rely on intent or assertion type, which Functionalism ignores.

