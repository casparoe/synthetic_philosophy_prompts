          *   Participants must be confidently wrong before explanation.
          *   No known real datasets (invent scenarios/numbers).
          *   Figures must arise from participant choices (cards, tokens, triage) where possible to avoid rigging suspicions.
          *   Two played decision rounds with opposite correct answers (Round 1: Split is right, Aggregate is wrong. Round 2: Aggregate is right, Split is wrong due to selection bias).
          *   Participants must not know which round is which.
          *   Scoring must align points with the correct decision.
          *   Debrief must map room moments to concepts, validate/correct user's theory, address causal structure uncertainty, and avoid "stats is useless" moral.
          *   Third scenario (social category): Decide play vs. discuss.
          *   Sibling puzzle (pre/post intervention): Include in debrief if appropriate.
          *   Format: Single JSON object with specific schema. British spelling.
