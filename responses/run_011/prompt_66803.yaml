      *   **Topic:** Simpson's Paradox (though the name must not be revealed until debrief). The core tension is when to trust aggregate data vs. subgroup data.
      *   **User's Theory:** The user believes the decision depends on whether the sorting feature is something the decision-maker could have acted upon (pre-existing) vs. something brought about by the decision itself (post-selection/collider bias).
      *   **Target Audience:** 12-16 adults, mixed backgrounds (retired teachers, nurse, students, shift workers), no advanced math/stats/philosophy. Low literacy/numeracy barriers (poor eyesight, no mental arithmetic beyond simple counting/fractions).
      *   **Constraints:** 90 minutes, public library room, no projectors/laptops/reliable signal, £20 budget, no money stakes (tokens/points).
