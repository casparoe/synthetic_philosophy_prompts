          *   *Scenario:* Choosing a venue for a party? Choosing a route to work?
          *   *Let's try a "Job Application" or "Grant Approval" scenario.*
          *   *Round 1 (Pre-existing):* Applicants from Town X vs Town Y. Acceptance rates. Town X has harder applicants. Split by "Qualification Level".
          *   *Round 2 (Post-decision/Selection):* This is tricky to gamify.
          *   *Alternative Round 2:* The "Safety" paradox. Seatbelts. People wear seatbelts when driving dangerously.
          *   *Let's try a "Resource Allocation" game.*
          *   *Round 1:* Two Hospitals. Patients choose hospital based on severity (severe go to big hospital). Success rates. Big hospital looks worse overall, better in subgroups. (Split is right).
          *   *Round 2:* Two Marketing Campaigns. Campaign A targets high-spenders, Campaign B targets low-spenders. But the "Spender Level" is determined *after* seeing the ad? No.
          *   *Let's use the User's specific intuition:* "Something the decision-maker could have acted upon" vs "Something brought about by the decision itself".
          *   *Round 1 (Pre-existing):* Triage. Nurses assign patients to Ward A or Ward B based on symptoms (Severity). Ward A looks worse overall (higher death rate) because it takes severe cases. Within severity levels, Ward A is better. (Split by Severity is correct).
          *   *Round 2 (Post-decision):* This is the hard one. We need a scenario where splitting creates the bias.
          *   *Idea:* "The Success Trap". You choose between Method A and Method B. Method A is ambitious (hard projects), Method B is safe (easy projects). Success is defined as "Completion". If you split by "Project Difficulty", you might see B is better at easy, A is better at hard. But if "Project Difficulty" was chosen *because* of the Method...
