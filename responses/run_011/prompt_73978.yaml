answer: |-
  ### Preliminary Brainstorm: The Structure of the Obligation

  Before we build the machinery, we need to be clear about what we are sorting. You have identified four distinct buckets, but in practice, they blur. Here is how we must distinguish them to make a procedure workable for a non-philosopher.

  1.  **Coordination Conventions (The "Driving Side" Problem):**
      *   *Structure:* I do X because I expect you to do X. If I do Y, we crash.
      *   *Obligation Source:* Mutual benefit and efficiency.
      *   *Verdict:* You owe compliance because deviation creates chaos for everyone, including you.
      *   *Epistemic Risk:* Mistaking a local habit for a coordination rule. (e.g., Is the queue strict or fluid?)

  2.  **Reliance/Harm Norms (The "Tip" Problem):**
      *   *Structure:* I do X because a third party has structured their livelihood on the expectation that I will do X.
      *   *Obligation Source:* Preventing harm to a vulnerable party who cannot easily adjust.
      *   *Verdict:* You owe compliance because non-compliance transfers cost to someone who didn't consent to the arrangement.
      *   *Epistemic Risk:* Assuming reliance exists when it doesn't (e.g., service charge included vs. voluntary top-up).

  3.  **Statistical Habits (The "Dinner Time" Problem):**
      *   *Structure:* Everyone does X, but if I do Y, nothing happens.
      *   *Obligation Source:* None.
      *   *Verdict:* No obligation. Advice only.
      *   *Epistemic Risk:* Over-regulating harmless behaviour.

  4.  **Oppressive/Objectionable Norms (The "Handshake" Problem):**
      *   *Structure:* Everyone does X, but X violates a core ethical principle. Sanction for refusal falls on the refuser.
      *   *Obligation Source:* Conflict between local expectation and home ethics/safety.
      *   *Verdict:* Safety first, but do not endorse. This is the highest risk category.
      *   *Epistemic Risk:* Failing to identify the harm, or failing to identify the risk of refusal.

  **The Epistemic Gap:**
  Your advisers are sitting in an office in the UK. They cannot verify ground truth. The procedure must treat *uncertainty* as a distinct state. If we cannot determine which bucket a norm falls into, we cannot issue a directive. We must escalate.

  **The Judgment Calls:**
  I will flag these explicitly. No procedure eliminates the need for human wisdom, but we can box it so it is visible.

  ***

  ### The Procedure: Norm Adjudication Protocol (NAP)

  **Time Budget:** 15 Minutes per norm.
  **User:** Mobility Adviser (No philosophy training).
  **Goal:** Produce a definitive instruction (Comply / Do Not Comply / Advice Only) or Escalate.

  #### Step 1: The Evidence Triangulation (Epistemic Check)
  **Action:** Gather three independent sources regarding this specific behaviour.
  *   Source A: Official government/travel advice (FCDO or equivalent).
  *   Source B: Host institution written policy or contract.
  *   Source C: Two independent recent returnees OR one trusted ground contact.
  **Stop Condition:** If you cannot find three sources, or if the sources contradict each other significantly.
  **Sufficiency Criteria:** You have *sufficient* evidence only if at least two sources agree on the *consequence* of non-compliance.
  **[JUDGMENT CALL]:** Determining what counts as "significant contradiction." If one source says "fine" and another says "jail," that is significant. If one says "rude" and another says "unusual," that is not.
  **Output:** If insufficient evidence -> **ESCALATE TO RESEARCH LEAD.** Do not proceed.

  #### Step 2: The Harm & Reliance Test (Bucket B Check)
  **Action:** Ask: "If the traveller refuses to do this, does a specific individual lose money, status, or safety that they rely on?"
  *   *Test:* Is the local party economically or socially vulnerable to this specific transaction?
  *   *Test:* Is the traveller's cost of compliance purely financial/convenience, or is it ethical?
  **Stop Condition:** If a specific third party suffers direct material harm due to non-compliance (e.g., wage loss).
  **Sufficiency Criteria:** You have established reliance if the local's income or safety is structurally tied to the visitor's action.
  **Output:** If Yes -> **INSTRUCTION: COMPLY.** (Note: Budget adjustments may be needed, but behaviour must align).
  **Output:** If No -> Proceed to Step 3.

  #### Step 3: The Coordination Equilibrium Test (Bucket A Check)
  **Action:** Ask: "Is this behaviour required for the system to function, or is it just the local style?"
  *   *Test:* If the traveller does the 'home' behaviour, does the interaction break down for *everyone* involved (including the traveller)?
  *   *Test:* Is the sanction for non-compliance functional (e.g., you miss the bus) or social (e.g., people think you are odd)?
  **Stop Condition:** If non-compliance causes functional failure of the activity.
  **Sufficiency Criteria:** You have established a coordination norm if deviation makes the activity impossible or significantly inefficient for all parties.
  **Output:** If Yes (Functional Failure) -> **INSTRUCTION: COMPLY.**
  **Output:** If No (Social Sanction Only) -> Proceed to Step 4.

  #### Step 4: The Ethical & Legal Conflict Test (Bucket D Check)
  **Action:** Ask: "Does compliance violate UK law, University Ethics Policy, or fundamental human rights?"
  *   *Test:* Does this involve bribery, discrimination, safety risks, or illegal acts?
  *   *Test:* Does the sanction for refusal endanger the traveller's physical safety?
  **Stop Condition:** If compliance violates UK law (e.g., Bribery Act) or poses physical risk.
  **Sufficiency Criteria:** You have established a conflict if the act is illegal in the UK or explicitly forbidden by University HR/Safety policy.
  **Output:** If Illegal/Unsafe -> **INSTRUCTION: DO NOT COMPLY.** (Escalate for safety mitigation).
  **Output:** If Ethically Objectionable but Safe (e.g., gender norms) -> **INSTRUCTION: COMPLY FOR SAFETY, DO NOT ENDORSE.** (See Case 4).
  **Output:** If No Conflict -> Proceed to Step 5.

  #### Step 5: The Habit Filter (Bucket C Check)
  **Action:** Ask: "Is this just a preference?"
  *   *Test:* If the traveller ignores this, is the worst outcome mild social awkwardness?
  **Sufficiency Criteria:** If the sanction is purely "people might think you are rude" with no material consequence.
  **Output:** -> **ADVICE ONLY.** (Phrase as "Locals typically do X, you may prefer to do Y").

  #### Step 6: The Handoff Condition
  **Action:** If at any point the Adviser feels the "Judgment Call" exceeds their authority, or if the norm falls into Step 4 (Ethical Conflict) with high ambiguity.
  **Output:** -> **ESCALATE TO ETHICS COMMITTEE / LEGAL.**
  **Reasoning:** Do not put the university at risk to save 15 minutes of admin time.

  ***

  ### Flowchart-in-Words (For the Wall)

  1.  **Can you prove it?** (3 sources, 2 agree on consequences). **NO?** -> Stop. Escalate for Research.
  2.  **Does someone get hurt if you don't?** (Wage loss, safety risk to local). **YES?** -> Stop. **Instruction: Comply.**
  3.  **Does the system break if you don't?** (Miss bus, meeting fails). **YES?** -> Stop. **Instruction: Comply.**
  4.  **Is it illegal or dangerous?** (UK Law, Physical Safety). **YES?** -> Stop. **Instruction: Do Not Comply.** (Escalate Safety).
  5.  **Is it offensive but safe?** (Gender roles, hierarchy). **YES?** -> Stop. **Instruction: Comply for Safety, Note Objection.**
  6.  **Is it just annoying?** (Dinner times, greeting style). **YES?** -> Stop. **Advice Only.**
  7.  **Unsure?** -> Escalate to Ethics/Legal.

  ***

  ### Application to Live Cases

  | Case | Bucket | Decision | Exact Sentence for Pack |
  | :--- | :--- | :--- | :--- |
  | **1. Tipping (Wage Reliance)** | **B (Reliance/Harm)** | **COMPLY** | "Service staff in this city rely on tips for their basic wage. While the practice may differ from UK norms, withholding tips directly reduces staff income. You are expected to tip according to local rates (10-15%); if your per diem does not cover this, apply for a budget adjustment before departure." |
  | **2. Bus Queue (Coordination)** | **A (Coordination)** | **COMPLY** | "Boarding operates on a 'crush' equilibrium rather than a queue. Attempting to form a line will result in you missing the bus while others board. For successful travel, you must adapt to the local boarding flow rather than imposing UK queuing norms." |
  | **3. Red Light (Legal/Contract)** | **D (Legal Conflict)** | **DO NOT COMPLY** | "Although jaywalking is common locally, it is illegal and fines are recorded against the host institution's sponsorship. You must obey traffic signals to avoid legal liability for the University and the partner. Do not follow local pedestrians if signals are red." |
  | **4. Handshake/Gender (Ethical/Safety)** | **D (Ethical Conflict)** | **COMPLY (SAFETY)** | "Local senior colleagues may not expect handshakes from female junior staff. Refusing this norm may damage working relationships or cause offence. For the sake of your safety and project viability, follow the lead of your host, though this does not reflect University values on equality." |
  | **5. Cash Envelope (Legal/Handoff)** | **Handoff** | **ESCALATE** | *[No pack instruction. This triggers an immediate email to Legal & Finance.]* "Do not accept cash envelopes described as 'allowances' outside of contract. This triggers UK Bribery Act concerns. Contact the Mobility Office immediately for a compliant alternative." |

  ***

  ### Limitations: Where This Procedure Will Fail

  You asked for honesty on where the machinery breaks. Here is where the NAP will confidently produce a wrong answer, and how you will notice.

  **1. The "Slow Harm" Blind Spot**
  The procedure prioritises immediate, tangible harm (wage loss, missing the bus). It is poor at detecting systemic harm.
  *   *Failure Mode:* A norm that is statistically common and relies on no specific individual, but reinforces a harmful system (e.g., excluding local women from evening networking). Step 2 (Harm) will say "No specific person loses money today." Step 5 (Habit) will classify it as "Advice Only."
  *   *How to Notice:* Returnees report feeling complicit in discrimination despite following the pack.
  *   *Fix:* Add a "Systemic Impact" flag to Step 4, but this requires human judgment, not a checklist.

  **2. The Epistemic False Positive**
  Step 1 relies on sources. If the three sources are all wrong (e.g., all based on the same outdated blog or a host institution that lies to visitors), the procedure validates a myth.
  *   *Failure Mode:* You instruct compliance based on "three sources" that are actually echo-chambered.
  *   *How to Notice:* Hosts complain that your staff are doing things that *aren't* actually expected, or returnees say "nobody does that anymore."
  *   *Fix:* You need a feedback loop where "Norm Invalidated" reports trigger a review of the source list, not just the norm.

  **3. The Safety vs. Endorsement Tension (Case 4)**
  The procedure instructs compliance for safety in ethical conflicts. This protects the traveller but risks institutional endorsement of the objectionable norm.
  *   *Failure Mode:* The pack reads as if the University accepts the norm as valid, rather than tolerating it for safety.
  *   *How to Notice:* Ethics Committee challenges the wording as contradictory to EDI (Equality, Diversity, Inclusion) strategy.
  *   *Fix:* The wording must always include the "does not reflect University values" disclaimer. The procedure cannot automate the nuance of that disclaimer.

  **4. The Budget/Behaviour Mismatch (Case 1)**
  The procedure says "Comply" on tipping, but the budget says "No Tip." This creates a conflict between Finance and Mobility.
  *   *Failure Mode:* Travellers are instructed to tip but reimbursed only up to the per diem, forcing them to subsidise the University's mobility programme out of pocket.
  *   *How to Notice:* Expense claim disputes rise.
  *   *Fix:* The procedure must have a hard stop that triggers a Budget Review, not just a Behavioural Instruction. I have included this in the Case 1 output, but the procedure itself assumes the budget can move.

  **5. The Judgment Call Disguise**
  Steps 2 and 4 ask the adviser to assess "Harm" and "Safety." An inexperienced adviser may underestimate psychological safety or overestimate economic reliance.
  *   *Failure Mode:* Adviser classifies a coercive norm as "Harmless Habit" because the harm isn't financial.
  *   *How to Notice:* Patterns of grievance from specific demographic groups (e.g., all female staff in Region X report distress).
  *   *Fix:* Regular audit of "Advice Only" classifications for protected groups.

  This procedure is not a truth machine. It is a risk mitigation tool. It will stop you from giving legally dangerous advice, and it will stop you from telling staff to be needlessly rude. It will not solve the moral tension of working in systems you disagree with. That tension belongs to the traveller, and your job is to ensure they walk into it with their eyes open.
