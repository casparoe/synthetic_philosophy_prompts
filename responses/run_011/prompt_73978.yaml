prompt: |-
  Right, bit of context first. I've been running the pre-departure side of a staff mobility office at a mid-sized UK university for about six years — we send maybe 120 people a year abroad on secondments, joint labs, fieldwork placements, anything from six weeks to three years. Part of what I produce is a "local norms pack" for each destination, and honestly the packs are now the most complained-about artefact I make. Returnees come back and say I instructed them to do something they found genuinely objectionable; hosts on the other end write in and say our people are stiff and rude; and our legal team periodically wants to know why we're telling staff to accept cash. All of which has forced me to admit I've never had an actual answer to the question underneath the whole enterprise, namely: when is a local convention something you *owe*, as opposed to something that's merely statistically common where you happen to be standing? I've read around this a fair bit over the years — the game-theory picture where a convention is just an equilibrium in a coordination problem and nobody owes anybody anything, the philosophy-of-law picture where convergent behaviour turns into a real rule at the point where deviations start getting treated as a reason for criticism rather than as a prediction error, the free-riding and reliance-interest arguments, plus about a decade of forum threads on Schelling points and whether "everyone does it here" is ever a reason to do it. What I want out of you is not another essay on that question. It's a procedure.

  So: play the part of a moral philosopher who's done a decent amount of applied consultancy and who's comfortable writing for people with zero philosophy training. Before you draft anything, brainstorm out loud for a bit about the real structure of the problem — think carefully, don't rush to the deliverable. Specifically I want you to chew on the difference between (a) norms where compliance is self-reinforcing purely because everyone expects everyone else to comply, (b) norms where the cost of my non-compliance lands on some third party who had no say in the arrangement — the tip that comes straight out of a server's wage, the boarding position I decline to fight for that somebody behind me then loses, (c) norms that are just local habits with no compliance interest whatsoever, and (d) norms where the practice itself is doing something a visitor has independent reason to object to, and where the sanction for refusing falls mostly on the refuser rather than on anyone who relied on them. Please also handle the epistemics separately from the metaphysics, because that's where my advisers actually drown: they frequently cannot tell which bucket a norm is in, since everything findable online is written by tourists on holiday and their only other source is returnees with strong feelings and a story to tell. I want the procedure to say what to do under that uncertainty rather than quietly assuming the adviser knows.

  Structure it as numbered steps an adviser runs in order on one norm at a time, with a stop condition at each step and an explicit statement of what counts as a *sufficient* answer to each question — I need to be able to tell somebody "if you can't establish X, you don't get to output Y". Budget is about fifteen minutes per norm, we cover fifteen to twenty norms per destination, and the adviser has no philosophy training and often no contact on the ground. There has to be a handoff point where the procedure stops producing an answer and escalates to a human being, because the output eventually ends up in writing that gets read by our ethics committee and by the traveller's line manager, so it has to be defensible. Ground it in whatever the philosophy actually has to say that survives contact with a fifteen-minute slot, but don't give me a reading list, a bibliography or any citations — I can't check them and I'd rather you didn't guess. And flag every step that is really a judgment call wearing a procedure costume; I'd much rather know where it's fake rigour than be sold something clean.

  Then run it on these, all of which are live in current packs:

  1. A city where sit-down restaurant service staff are paid well below anything we'd recognise as a floor and the tip is a large share of take-home, while our traveller is on a flat per diem that was costed on the assumption of no tipping — and who thinks the whole institution is extortionate and would rather not fund it.
  2. A bus stop where there is no queue at all, boarding is a crush, and somebody who forms an orderly line reliably misses the bus. Our traveller's home instinct is to queue and they read the crush as rudeness rather than as a different equilibrium.
  3. A city where crossing on a red man is universal, unsanctioned and completely normal, but where the law is strict and the on-the-spot fine is recorded against the host institution's sponsorship of the traveller — and our person is there for a school year with their kid, so there's a modelling question on top.
  4. A partner institution where an arriving female colleague is expected not to initiate a handshake with senior male colleagues and to let the senior man order for her at working lunches. The sanction for refusing falls on her and on the relationship, not on anyone who relied on her — but the junior local women who are watching count for something too. I suspect your burden-transfer step is going to push towards "comply" here and I want you to say out loud if your own procedure over-reaches.
  5. Standing example of the handoff category: an envelope of cash from a department administrator described as a settling-in allowance, not on any contract, where refusing is read as a slight on the department.

  I want at least one of the outputs to be something the traveller will hate and something I'd have to argue them into. Give me the numbered procedure, a one-page flowchart-in-words version I could pin to a wall, a table showing each case with the bucket it landed in and the exact sentence as it would appear in the pack, and a short honest section at the end on what the procedure cannot do — where it will confidently produce a wrong answer, and how I'd notice.

  British English throughout please, including the spellings, since big chunks of this are going straight into the handbook.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **User Persona:** Staff mobility office manager at a mid-sized UK university (6 years experience). Sends ~120 people/year abroad.
      *   **Problem:** "Local norms packs" are controversial. Returnees complain about objectionable instructions; hosts complain about rude staff; legal team worries about cash/compliance.
      *   **Core Question:** When is a local convention something you *owe* vs. something merely statistically common?
      *   **Task:** Create a *procedure* (not an essay) for advisers to categorize and adjudicate norms.
      *   **Constraints:**
          *   Play the part of an applied moral philosopher (consultancy background, plain English).
          *   Brainstorm the structure first (distinguish between coordination norms, harm-to-third-party norms, harmless habits, and objectionable practices).
          *   Handle epistemics (uncertainty about the norm) separately from metaphysics (nature of the norm).
          *   Format: Numbered steps with stop conditions and sufficiency criteria.
          *   Time budget: ~15 mins per norm.
          *   Audience: Advisers with no philosophy training, often no ground contact.
          *   Output needs to be defensible to ethics committees and line managers.
          *   Flag judgment calls disguised as procedure.
          *   Apply the procedure to 5 specific cases.
          *   Deliverables: Numbered procedure, one-page flowchart-in-words, table of cases (bucket + pack sentence), honest limitation section.
          *   Tone/Style: British English, no citations/bibliographies, pragmatic.
          *   Specific requirement: At least one output must be something the traveller will hate and need arguing into.

  2.  **Deconstruct the Philosophical/Practical Problem:**

      *   *The Metaphysics (What kind of norm is it?):*
          *   (a) Coordination Equilibrium (Schelling Point): Everyone does X because everyone expects X. Deviation causes confusion/inefficiency (e.g., driving side).
          *   (b) Reliance/Harm to Third Parties: Deviation harms specific others who relied on the norm (e.g., tipping where wages depend on it).
          *   (c) Harmless Habit/Signal: Statistical regularity with no real sanction or reliance (e.g., eating dinner at 9pm).
          *   (d) Oppressive/Objectionable Norm: The practice itself violates core ethics. Sanction falls on the refuser. (e.g., gender segregation).
      *   *The Epistemics (How do we know?):*
          *   Advisers don't know the ground truth. Tourist info is unreliable. Returnee anecdotes are biased.
          *   Need a way to assess confidence levels.
      *   *The Procedure:* Needs to filter through these categories quickly.
      *   *The Handoff:* When does it become too risky/complex for a standard adviser? (Legal risk, severe ethical conflict).

  3.  **Drafting the Procedure (Iterative Process):**

      *   *Step 1: Epistemic Check.* Can we verify this is actually a norm? If we don't know, we can't advise. Stop condition: Insufficient evidence -> Handoff/Research.
      *   *Step 2: Harm/Reliance Check.* Does non-compliance hurt a specific third party who relies on this? (The "Tip" test). If yes -> Strong presumption to comply.
      *   *Step 3: Coordination Check.* Is this a coordination game? Does deviation break the system for everyone? (The "Queue" test). If yes -> Comply.
      *   *Step 4: Ethical Conflict Check.* Does compliance violate UK law or core university ethics? (The "Bribe/Discrimination" test). If yes -> Do not comply/Handoff.
      *   *Step 5: Burden Distribution.* Who bears the cost? If the traveller bears the cost of *refusing* (social friction) vs. the local bears the cost of *compliance* (dignity), we need to weigh this.
      *   *Refinement:* The prompt asks to flag judgment calls. I need to be explicit where "sufficient evidence" is subjective.

  4.  **Developing the "Brainstorming" Section:**

      *   Need to articulate the distinction between (a), (b), (c), and (d) clearly before presenting the steps.
      *   Focus on the *obligation* source.
      *   (a) Obligation comes from mutual expectation/efficiency.
      *   (b) Obligation comes from preventing harm to vulnerable parties.
      *   (c) No obligation, just advice.
      *   (d) Obligation to *resist*, but safety first.

  5.  **Applying to the 5 Cases:**

      *   *Case 1 (Tipping):* Reliance/Harm. Server wages depend on it. Traveller has per diem (budget issue). *Verdict:* Comply (budget needs adjusting, not behaviour). *Traveller will hate this.*
      *   *Case 2 (Bus Queue):* Coordination. Local equilibrium is "crush". Queueing makes you miss bus. No third party harmed by you crushing (everyone else is doing it). *Verdict:* Comply (adapt to local flow).
      *   *Case 3 (Red Light):* Legal/Institutional Risk. Law says no, locals say yes. Fine hits host institution. *Verdict:* Do not comply (Legal/Contractual override).
      *   *Case 4 (Gender/Handshake):* Ethical Conflict vs. Safety/Relationship. Harm falls on traveller/local women. *Verdict:* Tricky. Safety first, but don't endorse. Nuanced advice. *Self-Correction:* The prompt asks me to flag if the procedure over-reaches towards compliance. I need to be careful here. The procedure should prioritise safety but flag the ethical cost.
      *   *Case 5 (Cash Envelope):* Legal/Compliance Risk. "Settling in allowance" off-contract. Sounds like bribery/kickback. *Verdict:* Handoff (Legal/Finance).

  6.  **Refining the Output Structure:**

      *   **Introduction:** Acknowledge the role (Applied Philosopher).
      *   **Brainstorm:** The conceptual mapping (a-d).
      *   **The Procedure:** Numbered steps, stop conditions, sufficiency criteria, flagging judgment calls.
      *   **Flowchart-in-Words:** Condensed version.
      *   **Case Table:** Bucket, Decision, Pack Sentence.
      *   **Limitations:** Where it fails.
      *   **Tone Check:** British English (programme, centre, analyse, etc.), professional, direct.

  7.  **Addressing Specific Constraints:**

      *   *15-minute budget:* Steps must be quick checks.
      *   *Epistemics:* Step 1 must address "How do we know?"
      *   *Handoff:* Clear criteria for escalation.
      *   *One hated output:* Case 1 (Tipping) is the best candidate. The traveller thinks it's extortion; the procedure says "you owe it."
      *   *Flagging Judgment Calls:* Use explicit "[JUDGMENT CALL]" tags in the procedure.

  8.  **Drafting Content - Specific Considerations:**

      *   *Case 4 (Gender):* This is the minefield. If I say "comply," I'm endorsing sexism. If I say "refuse," I might endanger the colleague. The procedure needs to distinguish between *safety* (comply) and *endorsement* (do not normalize). The pack advice should be descriptive + safety warning, not prescriptive moral approval.
      *   *Case 5 (Cash):* This is clearly a Legal/Finance handoff. No amount of moral philosophy solves UK bribery law.
      *   *Epistemics:* Emphasise triangulation. One blog post isn't enough.
      *   *British English:* Ensure "programme", "labour", "centre", "defence", "analyse".

  9.  **Final Review against Prompt:**

      *   Did I brainstorm out loud first? Yes.
      *   Is there a numbered procedure with stop conditions? Yes.
      *   Are judgment calls flagged? Yes.
      *   Is there a flowchart-in-words? Yes.
      *   Is there a table with the 5 cases? Yes.
      *   Is there a limitations section? Yes.
      *   Is one output something the traveller will hate? Yes (Case 1).
      *   British English? Yes.
      *   No citations? Yes.

  10. **Final Polish:** Check the tone. It needs to be authoritative but humble about the limits of a 15-minute heuristic. Ensure the distinction between "statistical regularity" and "moral obligation" is clear in the procedure. (Self-Correction: Make sure the "Handoff" criteria are sharp enough for an ethics committee).

  *(Self-Correction during drafting Case 4)*: I need to be careful not to simply say "comply" if it violates equality policies. The advice should be "Prioritise personal safety and relationship viability, but report the constraint." The pack sentence needs to be careful.
  *(Self-Correction during drafting Case 1)*: Make sure the pack sentence acknowledges the moral discomfort but affirms the obligation.

