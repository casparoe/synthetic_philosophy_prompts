      *   *Refining the Robbins Point:* Robbins isn't saying "You can't feel empathy." He's saying "You can't put it in the model." The distinction is *Positive vs. Normative*.
      *   *Refining the User's Point:* The flatmate says "Ordinal." The User says "vNM is Cardinal." The Flatmate says "Cardinal but not Comparable." The User says "Comparable if we assume unit alignment."
      *   *Wait, check the User's prompt again:* "His line all night: utility is ordinal, full stop."
          *   *Correction:* The flatmate is technically wrong about vNM (which is cardinal), but right about *interpersonal* comparability in standard demand theory. The session must clarify that vNM gives cardinality *within* a person, but not comparability *between* people.
