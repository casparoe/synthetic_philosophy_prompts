answer: |-
  ### Specification for a Resolution of Maxwell's Demon

  **Purpose:** To provide an account that preserves the Second Law of Thermodynamics as a **substantive empirical claim** (contingent on physical dynamics) rather than a **stipulative definition** (true by virtue of how entropy is defined). The account must satisfy a proponent of statistical mechanics who fears the Second Law is being tautologized away.

  #### I. Desiderata for an Adequate Resolution

  | Category | Requirement | Consideration | Status |
  | :--- | :--- | :--- | :--- |
  | **Feature Reproduction** | **The Trapdoor & One-Molecule Engine:** The account must explicitly model the sorting of fast/slow molecules and the measure-expand cycle of a single-particle engine. | If the resolution relies on macroscopic averaging that does not apply to single-particle trajectories, it fails to address the specific threat posed by the demon. | **Non-negotiable** |
  | **Conceptual Distinctions** | **Measurement vs. Erasure:** The account must distinguish the acquisition of information (measurement) from the restoration of the recording device (erasure). | Measurement can be thermodynamically reversible (correlation creation); erasure is logically irreversible (many-to-one mapping). Collapsing these obscures the source of entropy production. | **Non-negotiable** |
  | | **Correlation vs. Extractable Work:** The account must distinguish having information (mutual information) from the ability to extract work using that information. | Correlation is a state; work extraction is a process. One can have correlation without extracting work, but one cannot extract work beyond the free energy bound without consuming correlation. | **Non-negotiable** |
  | | **Information-Theoretic vs. Thermodynamic Entropy:** The account must specify the mapping between Shannon/Gibbs entropy and Clausius/Boltzmann entropy without equating them by fiat. | Equating them by definition renders the Second Law analytic. The link must be derived from the physical dynamics of the recording medium. | **Non-negotiable** (for your purpose) |
  | | **Single Run vs. Cycle Average:** The account must distinguish between a transient violation in a single trajectory and a violation over a repeating cycle. | The Second Law is a statement about cyclic processes or ensemble averages. A single lucky fluctuation is not a violation; a systematic engine is. | **Non-negotiable** |
  | **Formal Constraints** | **Generalized Second Law:** The account must respect the bound $W \ge \Delta F - k_B T I$, where $I$ is mutual information. | Modern non-equilibrium statistical mechanics quantifies the work value of information. Any resolution contradicting this is empirically falsified. | **Non-negotiable** |
  | | **Fluctuation Relations:** The account must be consistent with Jarzynski-type equalities extended to feedback control (e.g., Sagawa-Ueda relation). | These relations govern the probability of trajectories in feedback-controlled systems. Ignoring them renders the account incompatible with modern stochastic thermodynamics. | **Non-negotiable** |
  | **Bookkeeping** | **System Boundary:** The account must explicitly define the boundary of the "thermodynamic system" (Gas + Demon + Bath). | Entropy changes are boundary-relative. Without a fixed boundary, one can hide entropy production in the "environment" arbitrarily. | **Non-negotiable** |
  | | **Necessity of Reset:** The account must justify why the demon's memory *must* be reset to complete a cycle, without assuming the Second Law to prove it. | If the demon need not reset, it is not a cyclic engine but a finite resource. To threaten the Second Law as a law of *perpetual* motion, the demon must operate cyclically. | **Non-negotiable** |

  ---

  #### II. Assessment of Joint Satisfiability: The Landauer Trinity

  You asked whether the following three claims are jointly unsatisfiable:
  1.  **Erasure Cost:** Erasing one bit of information carries a minimum heat cost of $k_B T \ln 2$.
  2.  **Book Closure:** This cost is the specific physical mechanism that compensates for the entropy reduction in the gas, closing the demon's books.
  3.  **Non-Circular Vindication:** This cost is derived independently of the Second Law, thereby vindicating the Second Law non-circularly.

  **Verdict:** They are **jointly satisfiable**, but *only under a strict condition*.

  **The Condition:** The derivation of the Erasure Cost (1) must rest on **microphysical reversibility (Liouville's Theorem)** and the **definition of the thermodynamic limit**, *not* on macroscopic thermodynamic arguments.

  **The Objection (The Circularity Trap):** Critics (Earman, Norton, Hemmo & Shenker) argue that Landauer's Principle is often derived by assuming that compressing phase space (erasure) requires work *because* of the Second Law. If you use the Second Law to prove Landauer's Principle, and then use Landauer's Principle to save the Second Law, the argument is circular. In this scenario, (1) and (3) are incompatible.

  **The Resolution:** To satisfy all three, one must show that erasure reduces the phase space volume available to the *memory device*. To maintain Liouville's theorem (phase space volume conservation in Hamiltonian dynamics), this reduction must be compensated by an expansion of phase space in the *thermal bath* (heat dissipation). This derivation relies on mechanics, not thermodynamics.
  *   If the account relies on **Hamiltonian Dynamics**: The Trinity holds.
  *   If the account relies on **Phenomenological Thermodynamics**: The Trinity fails (Circularity).

  ---

  #### III. Evaluation of Live Approaches

  **1. The Erasure-Based Account (Landauer/Bennett)**
  *   **Fare:** Strong on bookkeeping and distinctions. It successfully separates measurement from erasure.
  *   **Weakness:** Vulnerable to the circularity objection. It often asserts Landauer's Principle as a "physical principle" without always rigorously deriving it from mechanics alone, risking the charge that it stipulates the Second Law into the definition of information processing.
  *   **Status:** Satisfies your purpose *if* the microphysical derivation is emphasized.

  **2. The Epistemic Dissolution (Jaynes/MaxEnt)**
  *   **Fare:** Strong on formal constraints regarding information.
  *   **Weakness:** Fails your core purpose. By treating entropy fundamentally as a measure of observer ignorance, it risks rendering the Second Law a rule of rational inference rather than a substantive empirical claim about the world. It dissolves the paradox by changing the ontology of entropy.
  *   **Status:** Reject for your specific purpose.

  **3. Fluctuation-Theorem & Resource-Theoretic Treatments (Sagawa-Ueda, Goold, et al.)**
  *   **Fare:** Excellent on formal constraints. They generalize the Second Law ($\langle \sigma \rangle \ge -I$) rather than just "saving" it. They treat information as a thermodynamic resource.
  *   **Weakness:** Can be mathematically opaque regarding the physical mechanism of the "reset." They show *that* the books balance via fluctuation relations, but sometimes gloss over the *mechanical necessity* of the reset in the way a mechanist demands.
  *   **Status:** Most robust scientifically, but requires careful interpretation to ensure it doesn't look like a redefinition of work/heat.

  **4. Outright Dissent (Norton, Earman, Hemmo & Shenker)**
  *   **Fare:** Excellent at exposing circularity in weak exorcisms.
  *   **Weakness:** Often demands a level of "no-idealization" that makes *any* thermodynamic derivation impossible (the "No-Go" theorem approach). They correctly identify that if the demon is treated as a fluctuation, it is covered by standard stat mech, but argue that the "exorcism" adds nothing new.
  *   **Status:** Useful as a stress test, but their conclusion (that the Second Law is merely probabilistic and thus "violated" by definition in small systems) conflicts with your desire for the law to remain substantive.

  ---

  #### IV. The Single Separating Desideratum

  The desideratum that does the most work in separating successful resolutions from circular or stipulative ones is:

  **The Necessity of Reset (Bookkeeping):** *"Why may the demon's memory be assumed to need resetting if the device is to operate as a repeating cycle?"*

  **Why this separates them:**
  *   **Circular/Stipulative Accounts:** Answer this by saying, "Because otherwise entropy would decrease, violating the Second Law." (This fails your purpose).
  *   **Epistemic Accounts:** Answer this by saying, "Because the observer must clear their mind to make new measurements." (This makes the law subjective).
  *   **Substantive Physical Accounts:** Must answer this by saying, "Because the memory device has a finite physical state space. To map multiple physical states (recorded data) to one physical state (blank) within a finite device, while preserving global phase-space volume (Liouville), requires coupling to a bath."

  If an approach cannot justify the **Necessity of Reset** using **finite physical state space** and **conservative dynamics** alone, it fails to convince someone who wants the Second Law to remain an empirical claim about the world, rather than a rule about how we manage our books.
