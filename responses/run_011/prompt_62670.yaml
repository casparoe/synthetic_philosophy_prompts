      *   My answer: The argument (specifically the rejection of 5) entitles you to prefer the "evolved psychology" reading *if* it offers independent parameters (cost of investment, status variance) that predict the outcome *before* observing the fertility rate. The memetic reading prefers itself only if it can define the "low-fertility meme's" fitness independently of the fact that fertility dropped. Usually, it can't.

  7.  **Final Polish:**
