answer: |-
  The step you must reject is **(5)**.

  Here is the diagnosis of why it looked unobjectionable, why it is false, and how rejecting it allows you to keep (1) and (7) while avoiding (9). Following that, I will outline what a critic of memetics is entitled to claim once this logical trap is disarmed.

  ### 1. The Diagnosis: The Illusion of Isomorphism

  Step (5) states: *"Nothing in that reasoning depends on the cultural case. Given any population whose variants differ, reproduce differentially, and pass their differences on, the same after-the-fact account is available..."*

  **Why it looked unobjectionable:**
  It relies on a formal isomorphism. The *logical schema* of natural selection (Variation, Inheritance, Differential Fitness) is indeed identical whether applied to genes, memes, or business practices. If you define "fitness" solely as "propensity to leave descendants," then the statement "the fittest variants increase in frequency" is a tautology in both biology and culture. When you wrote the argument, you were tracking the *logic of the explanation*, and at that level of abstraction, biology and memetics look identical. It is tempting to assume that if the ontology (selection) is the same, the epistemology (scientific status) must be the same.

  **Why it is false:**
  Scientific status is not determined by the logical schema alone, but by the **operationalization of the variables**. Step (5) conflates the *abstract principle* of selection with the *empirical theory* of natural selection.

  In biology, the theory of natural selection does not stop at the tautology. It supplies independent methods for estimating fitness *prior* to observing the reproductive outcome. We can measure metabolic efficiency, camouflage effectiveness, sperm count, or drought resistance. We can plug these independent measures into models (like the Breeder's Equation cited in step 7) to generate a quantitative prediction. If the population changes in a direction contrary to these independent measures, the theory *is* falsified. Biology does not merely accommodate every outcome; it rules many out.

  In memetics, as currently practiced, "fitness" is almost invariably defined *retrospectively* by the prevalence itself. A tune spreads? It was fit. A doctrine vanishes? It was unfit. There is rarely an independent measure of "memetic fitness" (e.g., cognitive salience, emotional resonance) estimated *before* the spread that constrains the prediction.

  Therefore, (5) is false because the "after-the-fact account" is not the *same* in both cases. In biology, the after-the-fact account is constrained by prior, independent measurements. In memetics, it is often unconstrained. Biology risks failure; memetics (in the version described in step 3) insures itself against it.

  ### 2. Pricing the Alternatives

  By rejecting (5), you dissolve the dilemma in (8) and save (1) and (7).

  *   **Keep (1) (Falsificationism/Riskiness):** You maintain that a theory must be capable of being wrong. This is the bedrock of distinguishing science from storytelling.
  *   **Keep (7) (Biology is Scientific):** You acknowledge that evolutionary biology earns its scientific standing not by the tautology of selection, but by the independent measurement of fitness parameters that allow for risky predictions. When breeding programmes fail, selection theory is in trouble, not just the breeder.
  *   **Reject (9) (Equivalence):** Memetics and biology are not on the same footing. Biology is a theory with independent parameters; memetics is currently a *framework* or a *heuristic* that lacks those parameters. It describes a possible mechanism but has not yet furnished the tools to test it rigorously.

  **What do you say to the move from (3) to (4)?**
  You accept it. If a specific formulation of memetics truly accommodates every possible outcome (as step 3 alleges), then by (1), it is not science. The error was assuming biology *also* accommodates every outcome. It does not.

  **What replaces (1) if you drop it?**
  You should not drop (1). If you drop the requirement for potential falsification, you lose the ability to distinguish physics from astrology, or biology from creationism (which can also accommodate any pattern by saying "the Designer willed it so"). The alternative is usually "inference to the best explanation," but without the constraint of riskiness, "best" becomes a matter of aesthetic preference. Keep (1). It is the only thing protecting you from (9).

  ### 3. What the Critic is Entitled to Say

  Once you have excised step (5), the critic of memetics is no longer trapped in the position of denying that culture evolves. Instead, the critic can demand **independent fitness functions**.

  You are entitled to say:
  > "Memetics is a promising *research programme*, but it is not yet a scientific *theory*. To become one, it must cease defining the fitness of a cultural variant solely by its prevalence. It must identify properties of the variant (e.g., mnemonic stickiness, emotional valence) or the environment (e.g., network structure, institutional barriers) that allow us to predict its spread *before* we observe the spread. Until memetics can predict a failure—until it can say 'This meme *should* spread but *won't*'—it remains a descriptive metaphor, not an explanatory mechanism."

  This shifts the burden from "Prove culture doesn't evolve" to "Prove your evolutionary model has predictive traction."

  ### 4. The Demographic Transition Case

  You asked which reading of the demographic transition your argument entitles you to prefer.

  *   **The Memetic Reading:** "The 'low-fertility' meme out-replicated the 'high-fertility' meme."
      *   *Critique:* This is step (3) in action. It accommodates the outcome by definition. It offers no independent measure of why *this* meme was fitter than *that* one, other than the fact that it won.
  *   **The Evolved Psychology Reading:** "Humans possess an evolved psychology that trades off offspring quantity against investment quality. In industrial environments where status is linked to capital/education rather than lineage, and contraception lowers the cost of sex, the optimal strategy shifts."
      *   *Critique:* This reading relies on parameters (cost of investment, status variance, contraceptive reliability) that can be measured *independently* of the fertility rate. It makes the outcome risky: if fertility remained high despite high costs of rearing and reliable contraception, this theory would be in trouble.

  Your argument (specifically the rejection of 5) entitles you to prefer the **Evolved Psychology** reading *as the more scientific explanation*, because it adheres to the constraint in (7). It risks being wrong. The memetic reading, unless it can specify *why* the low-fertility meme was fit independent of its spread, remains a redescription of the phenomenon, not an explanation of it.

  ### Summary

  The argument you wrote is a classic "Spencerian" trap: it identifies the tautological core of selectionism ("the survivors survive") and mistakes it for the whole theory. Biology escaped this trap a century ago by quantifying fitness independently of survival. Memetics has not.

  Reject **(5)**. It assumes an epistemic equality that does not exist. By doing so, you keep the rigor of (1), the respect for biology in (7), and you free yourself to criticize memetics not for being Darwinian, but for being *insufficiently* Darwinian—lacking the very predictive machinery that makes biological selection a science.
