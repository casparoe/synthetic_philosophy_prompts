answer: |-
  **MEMORANDUM**

  **TO:** Board of Directors, Department of Social Services
  **FROM:** [Your Name], Board Member
  **DATE:** October 23, 2023
  **SUBJECT:** Recommendation on Pilot Expansion: Restricted Benefit Card Program

  **BOTTOM LINE RECOMMENDATION**
  **Expand the benefit program immediately, but discontinue the restricted card requirement.** We should move to a 100% unrestricted cash model for the expansion phase.

  While I understand the proposal to retain the card at a "token" restricted level, I cannot recommend institutionalizing a policy that admits its own lack of utility. We should not expand a mechanism that the data proves is ineffective and our claimants report is demeaning, even if that mechanism has provided short-term political cover.

  **REASONING: THE DATA AND THE DIGNITY**
  Last month's evaluation of the pilot program provides us with a clear, if uncomfortable, evidence base:

  1.  **No Programmatic Impact:** The restricted card produced no measurable difference in nutrition, household spending stability, or employment entry compared to the control group. The restriction does not achieve its stated social goals.
  2.  **Fraud vs. Access:** While fraud referrals dropped, this appears to be a function of reduced liquidity rather than reduced intent. We must ask if making benefits harder to convert to cash is a feature of social support or a barrier to it.
  3.  **Claimant Experience:** Our Advisory Panel is divided, but the testimony regarding humiliation is specific and credible. When a policy offers no measurable benefit to the recipient but imposes a significant cost to their dignity, the burden of proof shifts to us to justify its existence.

  **ADDRESSING THE POLITICAL REALITY**
  The strongest argument against this recommendation is not about data; it is about survival. We know that public support for the program rose eleven points in districts aware of the card. We know from Council leadership that this support was the deciding factor in the last budget cycle. The argument is straightforward: *If we remove the restriction, we lose the public's trust, and if we lose that trust, we lose the budget. A flawed program is better than no program.*

  This is a serious concern, but it rests on a fragile premise. We cannot build a long-term safety net on a public misconception.

  1.  **Optics are not Outcomes:** Public support based on the belief that we are "controlling" spending is support for a narrative, not for social welfare. If that narrative is proven false by our own evaluation (as it now has been), maintaining the restriction becomes an act of deception. If the public learns we kept a humiliating rule solely to appease them, despite knowing it didn't work, the backlash will be far more severe than if we lead them toward evidence-based policy now.
  2.  **The "Token" Compromise is Worse:** Shrinking the restricted share to a token amount acknowledges that the card is performative. It asks claimants to endure the humiliation of the card for a symbol that we admit has no functional value. This is ethically harder to defend than removing the card entirely.
  3.  **Pivot the Narrative:** We have an opportunity to reframe the conversation. The evaluation shows cash assistance works. We should take the political capital we have gained from the pilot and argue that *trust* is the more efficient model. We can communicate that removing the restriction saves administrative costs and respects the autonomy of families, which aligns with our city's broader values.

  **CONCLUSION**
  Walking away from a rule we know is humiliating does not have to cost us the program. It costs us the *illusion* of control, but it buys us integrity and alignment with the data.

  If we expand the restriction, we are voting to prioritize the comfort of the taxpayer over the dignity of the claimant, without even the consolation of improved outcomes. I urge the Board to vote to expand the benefits, but to fund the expansion by retiring the card.

  **ACTION REQUIRED**
  Vote on Thursday to approve the expansion of the cash benefit program with the stipulation that the restricted card requirement be sunsetted effective [Date].
