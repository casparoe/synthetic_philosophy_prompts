prompt: |-
  I TA a third-year behavioural economics / decision theory seminar — 24 students, one 75-minute slot, and there's a second facilitator (the lecturer) helping me run it. Here's my problem: they've already had the Ellsberg lecture. They've all seen the two urns, they know the "correct" answer is that you shouldn't have a preference between red and black in the unknown urn, and they know the punchline about the sure-thing principle. So if I just wheel in a 50/50 jar and a mystery jar and hand out betting slips, I'll get textbook responses produced by demand characteristics and nobody will have felt anything. I want an activity that ambushes people who are already braced for the ambush — ideally one where the ambiguity is manufactured *by the participants themselves*, so they can't chalk the whole thing up to distrusting me as the experimenter (that's a huge confound in every classroom version I've seen; half the class just assumes the mystery urn is rigged against whoever bets on it).

  The core mechanic I want you to build around, and improve on: every student blind-samples their own sealed cloth bag of chips from one big reference jar whose composition is public and known to be exactly even. So each person ends up holding a bag that is objectively drawn from a known distribution, that nobody — not me, not them — can see inside, and that is ex ante probabilistically indistinguishable from the "risky" urn. Then they price bets on red/black for their own bag versus bets on the public jar, using fake credits and a proper scoring rule (Brier or quadratic, whatever you think survives 24 undergraduates doing arithmetic under time pressure) so that what they report tracks what they believe. After that I want a trading phase: students can buy and sell each other's bet positions on an open floor, and I want the room to visibly discover that ambiguity-averse pricing lets someone else walk up and Dutch-book them — pairs of trades that both feel fine individually and jointly guarantee a loss. Finish with a public reveal of the bags so we can compare predicted vs actual compositions. Payoffs get converted into a small prize plus a couple of bonus points, nothing real-money.

  Please give me the whole runnable thing: exact rules and round structure with a minute-by-minute timeline that fits 75 minutes for 24 people and two facilitators, a cheap materials list, the scoring-rule formulas written out so a non-maths student can use them without a calculator, the trading phase mechanics (how bids are posted, whether it's double auction or just shouting, how you settle), and a debrief that maps specific moments in the game onto specific claims. The debrief has to confront the awkward fact that the bags were never genuinely ambiguous in the technical sense — their composition came from a fully known process — and use that to make them decide whether ambiguity is a property of acts or a property of an agent's epistemic relation to a source; I want them leaving unsure whether their behaviour was irrational or whether maxmin-expected-utility / imprecise-credence stories are just describing the same rationality more honestly. Also tell me what will predictably break the first time I run it: the showoffs who bet on the bag precisely to prove they aren't fooled, the market failing to clear or collapsing into two loud traders, leaks about bag contents, someone realising they can game the scoring rule, whatever else you foresee — and how to handle each without derailing. And be straight with me about which feature of the paradox this activity fundamentally cannot reproduce and that I'll have to supply by talking, plus one 15-minute fallback version in case the blind-sampling logistics turn out to be a disaster in a room with no prep time.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**

      *   **Context:** 3rd-year Behavioural Economics/Decision Theory seminar.
      *   **Participants:** 24 students, 1 TA (user), 1 Lecturer (facilitator).
      *   **Time:** 75 minutes.
      *   **Prior Knowledge:** Students know Ellsberg, the urns, the "correct" answer (indifference), and the Sure-Thing Principle. They are "braced for the ambush."
      *   **Core Problem:** Standard Ellsberg demos fail due to demand characteristics and distrust of the experimenter (suspecting the "unknown" urn is rigged).
      *   **Proposed Mechanic:** Students blind-sample their own bags from a known 50/50 master jar. This makes the uncertainty *objective* (risk) but *epistemically opaque* to the holder (feels like ambiguity).
      *   **Activities:** Pricing bets (scoring rule), Trading phase (Dutch booking potential), Public reveal.
      *   **Deliverables:** Runnable lesson plan (minute-by-minute), materials list, scoring rule formulas (simple), trading mechanics, debrief (philosophical depth on ambiguity vs. risk), troubleshooting (what breaks), limitations, and a 15-minute fallback.
      *   **Tone:** Professional, practical, academically rigorous, aware of classroom dynamics.

  2.  **Deconstruct the Core Mechanic (The "Self-Sampled Bag"):**

      *   *Idea:* A master jar has 500 Red / 500 Black chips. Students draw 10 chips into an opaque bag without looking.
      *   *Epistemic Status:* Objectively, it's a Binomial(10, 0.5) distribution. Subjectively, the holder doesn't know the count.
      *   *The Twist:* Compare betting on *their* bag (unknown composition, known generation process) vs. betting on a *fresh draw* from the master jar (known composition).
      *   *Theoretical Tension:* Technically, both are Risk (known probabilities). Psychologically, the bag feels like Ambiguity (unknown probabilities). This is the crux of the debrief.

  3.  **Drafting the Lesson Plan (Time Management):**

      *   Total: 75 mins.
      *   Setup/Intro: 10 mins.
      *   Sampling: 10 mins (logistics can be slow).
      *   Pricing/Valuation: 15 mins.
      *   Trading: 20 mins (needs energy).
      *   Reveal & Payoff: 10 mins.
      *   Debrief: 10 mins.
      *   *Correction:* 75 mins is tight for 24 students trading. Need to streamline trading. Maybe pair trading or a centralized market? Centralized market with TA/Lecturer as market makers might be too slow. Let's go with a "Open Outcry" or "Post-it Board" system. Let's aim for a structured 15-min trading window.
      *   *Revised Timeline:*
          *   00-05: Intro & Hook.
          *   05-15: Sampling (The "Ambiguity" Generation).
          *   15-30: Valuation (Scoring Rule).
          *   30-50: Trading Market.
          *   50-60: Reveal & Settlement.
          *   60-75: Debrief.

  4.  **Developing the Scoring Rule:**

      *   Needs to be incentive-compatible but simple.
      *   Brier Score is standard: $1 - (p - outcome)^2$.
      *   For undergrads without calculators: Use a point system.
      *   *Simplification:* Ask for a "Buying Price" for a ticket that pays $10 if Red.
      *   *Better:* Use a Quadratic Scoring Rule converted to points.
      *   *Formula:* Payoff = $100 - 100 \times (Reported\% - Actual\%)^2$.
      *   *Even Simpler:* "Prediction Market" style. You have 100 credits. Buy shares at price $P$. If Red, share worth 100. If Black, 0. Expected value = $100 \times Prob$.
      *   *Decision:* Let's stick to the prompt's suggestion of pricing bets using a scoring rule logic but simplified for mental math.
      *   *Selected Mechanism:* Becker-DeGroot-Marschak (BDM) is too complex for 24 people quickly. Let's use a **Fixed Price Menu**. "Choose a price $X$ you would sell this ticket for." Then a random number $Y$ is drawn. If $Y > X$, you sell at $Y$. If $Y < X$, you keep the ticket. This elicits true WTA.
      *   *Wait, simpler:* Just ask for a probability $p$. Payoff = $100 \times p$ if correct? No, that encourages hedging.
      *   *Best for Classroom:* **The Quadratic Scoring Rule (Simplified).**
          *   Report probability $p$ (0 to 100%).
          *   If Event Happens: Score = $100 - (100 - p)^2 / 100$.
          *   If Event Fails: Score = $100 - (p)^2 / 100$.
          *   *Actually, let's make it integer friendly:* Score = $100 - (Error)^2$. Error is difference in percentage points.
          *   Example: Say 70%. Red comes up. Error = 30. Score = $100 - 900 = -800$. Too harsh.
          *   *Revised:* Score = $10 - (Error/10)^2$. Max 10 points.
          *   *Even Better:* Use a **Token Market**. Give them 10 tokens. They allocate tokens to Red vs Black. Payoff is tokens on winning color. This is risk-neutral elicitation.
          *   *Prompt Requirement:* "Proper scoring rule... so that what they report tracks what they believe."
          *   *Solution:* **The "Square Rule"**.
          *   State confidence $C$ (0 to 10).
          *   If Right: Points = $C^2$.
          *   If Wrong: Points = $-(10-C)^2$.
          *   *Wait, that's risky.*
          *   *Let's go with the standard Quadratic:* Payoff = $1 - (p - o)^2$. Scale to 100 points.
          *   $p$ = probability reported (0.0 to 1.0). $o$ = outcome (1 or 0).
          *   Payoff = $100 \times [1 - (p - o)^2]$.
          *   Math check: If $p=0.8, o=1 \rightarrow 1 - (0.2)^2 = 0.96 \rightarrow 96$ pts. If $p=0.8, o=0 \rightarrow 1 - (-0.8)^2 = 0.36 \rightarrow 36$ pts.
          *   *Classroom Math:* Provide a lookup table. Don't make them calculate squares.

  5.  **Designing the Trading Phase:**

      *   Goal: Show Dutch Booking / Arbitrage.
      *   Setup: Student A values Bag Red at 40 credits. Student B values Master Jar Red at 50 credits.
      *   Trade: A sells Bag-Red to B? No, they are different assets.
      *   *The Arbitrage:* If I value Bag-Red at 40 (ambiguity averse) and Master-Red at 50 (risk neutral), someone can buy Bag-Red from me at 45 and sell me Master-Black at 45?
      *   *Wait, the Dutch Book argument in Ellsberg:* If you prefer Known-Red over Unknown-Red, AND Known-Black over Unknown-Black, you are vulnerable.
      *   *Market Mechanism:* Allow students to trade "Claims on Red" vs "Claims on Black" for their specific bag vs the Master Jar.
      *   *Simplification:* Create two assets: "Bag Ticket" (Pays if *your* bag is majority Red) and "Jar Ticket" (Pays if *next* Jar draw is Red).
      *   *Trading:* Open floor. TA acts as clearing house.
      *   *Risk:* Chaos.
      *   *Mitigation:* Use a "Post-It Order Book" on the whiteboard. Bids and Asks.
      *   *Dutch Book:* If Student A sells Bag-Red for 40c and buys Jar-Red for 50c, they lose 10c sure thing? No, because Bag-Red and Jar-Red aren't perfectly correlated.
      *   *Correction:* The Dutch Book in Ellsberg arises from inconsistent preferences across *complementary* events (Red vs Black) within the *same* urn, or across urns with identical distributions.
      *   *Refined Trading Goal:* Show that if you price the Bag lower than the Jar *despite knowing they are statistically identical*, you are leaving money on the table relative to a risk-neutral trader.
      *   *Activity:* "The Arbitrageur." The TA (or a designated student) plays a risk-neutral market maker. If students price the Bag at 40 and Jar at 50, the Market Maker buys Bag at 40, sells Jar at 50. Expected profit = 0 for MM, but the Student locked in a loss relative to expected value.
      *   *Better:* Pair students up. One holds the Bag, one holds the "Master Contract". They negotiate a swap. If they agree to swap 1:1, they acknowledge equivalence. If they demand a premium, they reveal aversion.

  6.  **Addressing the "Ambiguity" Confound:**

      *   The prompt acknowledges the bags aren't *technically* ambiguous (Knightian uncertainty), just unknown risk.
      *   Debrief must tackle: Is ambiguity ontological (in the world) or epistemological (in the head)?
      *   Key point: If you treat known-risk-as-unknown as ambiguity, is that irrational? Or is it a heuristic for when information *might* be hidden?

  7.  **Troubleshooting:**

      *   *Showoffs:* Students betting 50/50 to look rational. *Fix:* Private reporting first.
      *   *Market Chaos:* *Fix:* Structured rounds.
      *   *Math Anxiety:* *Fix:* Lookup tables.
      *   *Leaks:* *Fix:* Sealed bags, no opening until end.

  8.  **Fallback Plan:**

      *   If sampling fails (no chips/bags): Use a "Mental Sampling" version. Think of a number, apply a rule. Or revert to standard Ellsberg but change the *source* of uncertainty (e.g., predict a peer's choice).

  9.  **Refining the Plan (Self-Correction during drafting):**

      *   *Time:* 75 mins is very tight for trading 24 students. I need to make the trading phase highly structured. Maybe a "Call Market" where bids are collected, then cleared.
      *   *Scoring:* Calculating quadratic scores for 24 students live is impossible. I need to pre-print slips where they circle a probability, and I calculate later, OR use a linear scoring rule (proper only if risk neutral, but easier).
      *   *Decision:* Use a **BDM Mechanism** for valuation. It's incentive compatible and easier to explain than quadratic scoring for a one-off. "Name your selling price. I roll a die (0-100). If roll > price, you get the roll value in cash/points. If roll < price, you keep the bet."
      *   *Wait, Prompt asks for Scoring Rule.* I will provide a **Lookup Table** for the Quadratic Rule. It's the most robust.
      *   *Trading:* Let's make it a "Market for Uncertainty." Students can trade their "Bag Claim" for a "Jar Claim". If they trade 1:1, they reveal indifference. If they demand 1 Bag for 1.2 Jars, they reveal aversion.
      *   *Dutch Book:* The TA acts as the "Bank". If a student prices Bag-Red at 40 and Bag-Black at 40 (sum 80), the Bank sells them both for 80. One *must* win (paying 100). Bank makes 20 profit. This is the classic Dutch Book on sub-additive probabilities. *This is the killer move.* I must ensure they price Red and Black separately.

  10. **Finalizing the Structure:**

      *   **Materials:** Chips, opaque bags, master jar, scoring sheets, lookup tables.
      *   **Phase 1:** Sampling (Create the "Personal Ambiguity").
      *   **Phase 2:** Elicitation (Price Red, Price Black, Price Jar-Red).
      *   **Phase 3:** The Dutch Book (TA exploits sub-additivity).
      *   **Phase 4:** Reveal & Debrief.

      *(Self-Correction on Dutch Book)*: If they price Red at 40 and Black at 40, sum is 80. I buy both. I pay 80. One wins 100. I profit 20. This works perfectly for the "Ambiguity Aversion" demonstration.
      *(Constraint)*: Need to ensure they understand they are pricing *selling* prices (WTA) or *buying* prices (WTP). WTA is usually easier for endowment. Let's endow them with the Ticket.

      *(Debrief Nuance)*: The bags are *Risk*. The feeling is *Ambiguity*. Why? Because *information is costly to verify*. The debrief must highlight that ambiguity aversion might be a rational heuristic for "don't trust the setup unless you can verify," even if verification was technically possible.

      *(Fallback)*: If no bags, use "The Professor's Mind." I think of a number 1-100. You bet Even/Odd. vs Coin flip.

  11. **Writing the Response:**

      *   Tone: Direct, experienced, pedagogical.
      *   Structure: As requested (Timeline, Materials, Rules, Scoring, Trading, Debrief, Troubleshooting, Fallback).
      *   Specific focus on the "Epistemic vs. Ontological" ambiguity debate.

  12. **Review against Constraints:**
      *   75 mins? Yes, tight but doable with strict timing.
      *   24 students? Yes.
      *   Scoring rule simple? Yes, lookup table.
      *   Trading mechanics? Yes, TA as Bank for Dutch Book.
      *   Debrief depth? Yes, focus on the nature of uncertainty.
      *   Troubleshooting? Yes.
      *   Fallback? Yes.

      *One final check on the Scoring Rule:* Quadratic scoring requires arithmetic. $100 - 100(p-o)^2$.
      If $p=0.6, o=1 \rightarrow 100 - 100(0.16) = 84$.
      If $p=0.6, o=0 \rightarrow 100 - 100(0.36) = 64$.
      I will provide a printed table for $p$ in increments of 10%. This removes calculation burden.

      *Trading Phase Refinement:* To ensure the Dutch Book happens visibly, I will act as the "House." I will invite students to sell me their tickets. If Sum(Red Price + Black Price) < 100, I buy both. I guarantee a profit. This is the most dramatic demonstration.

      *Let's build it.*
answer: |-
  This is a sophisticated design challenge. You are fighting two enemies: **Demand Characteristics** (students giving the "right" answer) and **Experimenter Distrust** (students assuming the "unknown" urn is rigged). Your solution—having them generate the uncertainty themselves—is the correct theoretical countermeasure. It shifts the locus of ambiguity from the *experimenter's malice* to the *agent's epistemic limitation*.

  Here is the runnable lesson plan. It is tight on time, so discipline is required.

  ### **Session Title:** The Endogenous Ellsberg
  **Time:** 75 Minutes
  **Participants:** 24 Students, 2 Facilitators (You + Lecturer)
  **Goal:** Demonstrate that ambiguity aversion persists even when the uncertainty is self-generated from known risk, and expose the agent to a Dutch Book via sub-additive pricing.

  ---

  ### **1. Materials List (Cheap & Fast)**
  *   **Master Jar:** 1 large clear container.
  *   **Chips:** 500 Red, 500 Black (plastic poker chips or laminated discs). *Pre-counted.*
  *   **Bags:** 24 small, opaque cloth drawstring bags (or heavy paper envelopes sealed with stickers).
  *   **Worksheets:** 1 per student (see *Scoring Rule* section).
  *   **Lookup Tables:** 1 per student (pre-printed, see below).
  *   **Currency:** "Experimental Credits" (EC). Printed slips or just tracked on worksheets.
  *   **Whiteboard:** For the Order Book.
  *   **Prize:** One gift card or bottle of wine for the top scorer (high stakes create engagement).

  ---

  ### **2. Minute-by-Minute Timeline**

  | Time | Phase | Action | Facilitator Roles |
  | :--- | :--- | :--- | :--- |
  | **00-05** | **Hook** | Brief intro. "You know Ellsberg. Today you *are* the urn." No theory talk yet. | **TA:** Lead. **Lec:** Distribute materials. |
  | **05-15** | **Sampling** | Students draw 10 chips from Master Jar into their bag *without looking*. Seal immediately. | **TA:** Monitor for peeking. **Lec:** Manage jar queue. |
  | **15-30** | **Valuation** | Students price 3 assets on worksheet using Scoring Rule. (Bag-Red, Bag-Black, Jar-Red). | **TA:** Explain rules. **Lec:** Answer math questions. |
  | **30-50** | **The Market** | "The Bank" (TA) buys tickets. Students sell positions. Dutch Book execution. | **TA:** Act as Bank. **Lec:** Record trades on board. |
  | **50-60** | **Reveal** | Open bags. Count chips. Settle scores. Announce winner. | **Both:** Tally quickly. |
  | **60-75** | **Debrief** | Connect mechanics to theory. The "Risk vs. Ambiguity" ontological debate. | **TA:** Lead discussion. **Lec:** Synthesize. |

  ---

  ### **3. The Valuation Phase (Rules & Scoring)**

  To avoid arithmetic panic, do not make them calculate the scoring rule live. Use a **Lookup Table**.

  **The Asset:**
  Each student is endowed with 3 Tickets:
  1.  **Bag-Red:** Pays 100 EC if *your* bag has more Red than Black.
  2.  **Bag-Black:** Pays 100 EC if *your* bag has more Black than Red. (Ignore ties for simplicity, or count as 0).
  3.  **Jar-Red:** Pays 100 EC if a *fresh* draw from the Master Jar is Red.

  **The Task:**
  For each ticket, state the **Minimum Selling Price (0-100 EC)** you would accept to give up the ticket.
  *   *Incentive:* We will use the **BDM Mechanism** (simplified). After you write your price, I will draw a random number between 0 and 100.
      *   If Random Number > Your Price: You sell the ticket at the Random Number price.
      *   If Random Number < Your Price: You keep the ticket (and it pays out based on the outcome).
  *   *Why:* This makes it optimal to state your true subjective probability.

  **The Scoring Rule (For the "Keep" scenario):**
  If they keep the ticket, their payoff depends on the accuracy of their implicit confidence. To make this explicit, add a **Confidence Bonus** section to the worksheet.
  *   *Actually, to save time:* Stick to the BDM mechanism for valuation. It is incentive-compatible for risk-neutral agents and robust enough for this demo. The "Scoring Rule" you requested is best applied to a **Probability Elicitation** round *before* the market.
  *   *Revised Plan:* Let's use the **Quadratic Scoring Rule** for the valuation sheet, but provide the **Lookup Table**.

  **Worksheet Instruction:**
  "Report your probability $P$ (0% to 100%) that the event will happen. Your points are determined by this table:"

  | Reported Prob ($P$) | Points if **RIGHT** | Points if **WRONG** |
  | :--- | :--- | :--- |
  | 50% | 75 | 75 |
  | 60% | 84 | 64 |
  | 70% | 91 | 51 |
  | 80% | 96 | 36 |
  | 90% | 99 | 19 |
  | 100% | 100 | 0 |

  *(Formula used: $Score = 100 - 100(P - Outcome)^2$. Outcome is 1 or 0.)*
  *Note: Provide this table on the handout. Do not make them calculate squares.*

  ---

  ### **4. The Trading Phase (The Dutch Book)**

  This is the climax. You are not running a chaotic open outcry. You are running a **Clearing House**.

  **The Setup:**
  Tell the class: "I am the Bank. I am risk-neutral. I have infinite EC. I will buy any ticket from you at the price you wrote on your sheet."

  **The Trap:**
  1.  Collect the worksheets.
  2.  Scan for any student where **Price(Bag-Red) + Price(Bag-Black) < 100**.
      *   *Example:* Student prices Red at 40 and Black at 40. Total = 80.
  3.  **Publicly announce:** "Student X, I see you value Red at 40 and Black at 40. I will buy *both* tickets from you for 40 each. Total cost to me: 80."
  4.  **The Reveal:** "One of these tickets *must* pay out 100 (assuming no ties). I pay 80, I receive 100. I make 20 EC risk-free. You have guaranteed a loss relative to the sure thing."
  5.  **Comparison:** Contrast this with the Jar-Red/Black pricing. Usually, students price Jar-Red + Jar-Black closer to 100 (e.g., 50+50).
  6.  **The Arbitrage:** If Student A prices Bag-Red at 40, and Student B prices Jar-Red at 50, allow them to trade. But the **Bank Dutch Book** is more visceral for a large group.

  **Logistics:**
  *   Have students hold up their sheets if they want to sell.
  *   Pick 3-4 egregious examples of sub-additivity (Sum < 100).
  *   Execute the trade on the whiteboard visibly.

  ---

  ### **5. The Debrief (The Philosophical Hook)**

  This must handle the "It wasn't real ambiguity" objection.

  **Step 1: The Data**
  *   "Look at the board. Jar-Red + Jar-Black $\approx$ 100. Bag-Red + Bag-Black $\approx$ 80."
  *   "You were Dutch-booked. You left money on the table."

  **Step 2: The Ontological Trap**
  *   "Technically, there was no ambiguity. The Master Jar was 50/50. Your bags were Binomial(10, 0.5). The probability was known."
  *   "So why did you price it like ambiguity?"
  *   *Student Answer:* "I didn't know *my* specific bag."
  *   *Your Counter:* "You also didn't know the *next* Jar draw. That was also unknown."

  **Step 3: The Core Lesson (Epistemic vs. Ontological)**
  *   **Ontological Ambiguity:** The world doesn't have a probability (e.g., war next year).
  *   **Epistemic Ambiguity:** The world has a probability, but *I* don't know it / can't verify it easily.
  *   **The Takeaway:** Ambiguity aversion isn't about the *object*; it's about the *relation* between the agent and the source.
  *   **The Rationality Defense:** "Is it irrational to treat the Bag differently? Maybe not. In the real world, if someone hands you a sealed bag, checking the contents is costly. Treating 'unverified risk' as 'ambiguous' is a heuristic that protects you from information asymmetry in the wild. You weren't irrational; you were ecologically rational."
  *   **Maxmin Expected Utility:** "For you, the 'set of priors' wasn't about the jar's composition. It was about your trust in your own sampling process. You acted as a Maxmin agent over your own epistemic state."

  ---

  ### **6. Troubleshooting: What Will Break**

  **1. The "I'm Too Smart" Student**
  *   *Risk:* A student announces, "I know it's 50/50, I'll price both at 50" to signal rationality.
  *   *Fix:* **Private Reporting.** Collect worksheets before anyone speaks. When you reveal the Dutch Book, anonymize the data ("Student 4 priced at..."). If they outed themselves publicly, acknowledge it: "Student X is theoretically correct, but let's look at the class aggregate."

  **2. The Market Collapses**
  *   *Risk:* No one wants to trade with each other; they only trade with you.
  *   *Fix:* That's fine. You *want* to be the counterparty for the Dutch Book. Peer-to-peer trading is secondary. Focus on the Bank vs. Student dynamic.

  **3. Math Panic**
  *   *Risk:* Students freeze on the Scoring Rule.
  *   *Fix:* The Lookup Table is mandatory. If they still struggle, switch to **Linear Scoring** (Points = 100 if right, 0 if wrong) but warn them it encourages hedging (reporting 50% always). Actually, for a 75-min class, **drop the scoring rule calculation**. Just use the **BDM Selling Price** mechanism. It's cleaner.
      *   *Revision:* Use BDM for valuation. It requires no math from them, just a number. "What's the lowest price you'd sell this for?"

  **4. Ties in the Bag**
  *   *Risk:* A bag has exactly 5 Red / 5 Black.
  *   *Fix:* Pre-decide the rule. "5/5 pays 0 for both." Or "5/5 pays 50 for both." Best: "Strict Majority. 5/5 is a push (0 payoff)." Mention this in instructions.

  **5. Leakage**
  *   *Risk:* Students peek or weigh the bags.
  *   *Fix:* Use cloth bags (silent). Lecturer circulates during sampling. "Honor code + I'm watching."

  ---

  ### **7. The "Fundamental Limitation" (Be Straight)**

  **What this activity cannot reproduce:**
  This activity cannot reproduce **Source-Dependent Ambiguity** where the probability distribution itself is unknown (e.g., an urn filled by an adversary).
  *   *Why:* Here, the generation process (Master Jar) is known. The uncertainty is purely *sampling noise*.
  *   *The Gap:* True Ellsberg ambiguity is about not knowing the *composition*. Here, they know the composition, just not the *realization*.
  *   *How to Supply it:* In the debrief, you must explicitly state: "Today, the ambiguity was **Epistemic Opacity**. Real-world ambiguity is often **Structural Ignorance**. But notice: your brain treated them the same. That is the behavioral finding."

  ---

  ### **8. The 15-Minute Fallback (Logistics Disaster Plan)**

  If the chips/bags don't arrive or the room is wrong:

  **"The Peer Prediction Game"**
  1.  **Setup:** No materials.
  2.  **Task:** "Think of a number between 1 and 100. Write it down. Don't show anyone."
  3.  **Asset A:** Bet that *your* number is Even. (Unknown to market).
  4.  **Asset B:** Bet that *the sum of all class numbers* is Even. (Unknown to everyone, but statistically 50/50).
  5.  **Asset C:** Bet on a Coin Flip (Projected on screen).
  6.  **Valuation:** Ask for WTP for A, B, and C.
  7.  **Logic:** Asset A is "Private Uncertainty" (feels like ambiguity). Asset C is "Public Risk."
  8.  **Debrief:** "Why did you price A lower than C? The probability is identical (50%). The difference is *verifiability*. You can verify the coin; you can't verify my number without me lying."
  9.  **Pros:** Zero setup, instant.
  10. **Cons:** Less visceral than holding a physical bag.

  ---

  ### **Final Checklist for You (The TA)**

  1.  **Print 25 Lookup Tables** (Extra for errors).
  2.  **Pre-count Chips** (Do not do this in class).
  3.  **Brief the Lecturer:** Ensure they know to play "Bad Cop" on the sampling rules (no peeking) while you play "Good Cop" on the theory.
  4.  **Watch the Clock:** The Trading Phase is the time sink. Cut the Debrief short if needed, but do not cut the Reveal. The Reveal is the emotional payoff.
  5.  **Embrace the Mess:** If the Dutch Book doesn't catch everyone, catch *one* person. One victim is enough to prove the point.

  This plan respects their prior knowledge by skipping the "what is ambiguity" lecture and moving straight to "why do *you* feel it even when you know better." Good luck.
