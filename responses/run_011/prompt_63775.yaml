answer: |-
  James is arguing for **substitution**, not transposition, and recognizing this distinction is the only way to make sense of his policy proposals without collapsing into contradiction. James explicitly states that "thousands of years of peace won't breed [pugnacity] out of us," which categorically rejects the transposition thesis that martial discipline might eventually atrophy the warlike instinct. Instead, he seeks to harness that ineradicable energy and redirect it toward a non-lethal adversary (nature/poverty), preserving the psychological rewards of heroism and cohesion while removing the slaughter. If you commit only to transposition, you ignore James's psychological realism about inherited instincts; if you commit only to substitution, you risk permanently militarizing civilian life, but James accepts this risk as the price of avoiding actual war. The "moral equivalent" is therefore a permanent structural feature of society, not a transitional bridge to a pacifist utopia.

  Regarding the "horrors make the fascination" line, this is a claim about human psychology functioning as a deliberate inversion of pacifist logic, and it completes the preceding sentence rather than contradicting it. James argues that showing war's irrationality fails because the instinct for war is not rational; it is driven by the "love of glory" and the intensity of "life in extremis." When pacifists catalogue horrors, they inadvertently highlight the very intensity that attracts the martial temperament. This undermines pacifist propaganda by suggesting it is self-defeating: by focusing on the blood and sacrifice, pacifists feed the voyeuristic hunger for the "strong life" they intend to quell. James is not saying humans love pain; he is saying humans love the *significance* that pain confers, and horror is the currency of that significance.

  The "gory nurse" passage functions as a pragmatic postulate rather than a scientific claim, and it is load-bearing for the entire essay. James acknowledges the unfalsifiability ("Dead men tell no tales"), signaling that he is not interested in evolutionary biology per se, but in the *utility* of believing we are inherited warlike types. The work this passage does is establish the necessity of the substitute: if the instinct is bred in "bone and marrow," it cannot be ignored or wished away; it must be fed. If this passage is false—if we are not inherently warlike—James's entire project collapses, because we could simply abolish war and wait for peace to normalize human behavior. He needs the instinct to be permanent to justify the permanent institution of the moral equivalent.

  On the policy cases, the Finnish civilian-service track, if designed as a deterrent penalty, is anti-Jamesian because it treats the objection as a vice to be punished rather than an energy to be redirected. James wants the alternative service to be equally honorable and strenuous, satisfying the need for sacrifice without the stigma of cowardice. The Swiss militia habit is institutionally closer to James's vision (universal conscription, citizen-soldiers) but teleologically distinct; the Swiss prepare for war against neighbors, whereas James wants conscription against nature. Finally, the volunteer professional army fails James's test of civic cohesion because it allows the majority to opt out of the "blood tax," whereas James believes legitimacy comes from universal participation in sacrifice.

  The remark that "war-taxes are the only ones men never hesitate to pay" implies that legitimacy in a volunteer force is fragile because it relies on economic coercion or abstract patriotism rather than shared bodily risk. A money tax is transactional; a blood tax is constitutive of community. For James, a volunteer force separates the "warlike" from the "peaceable," creating a class division that undermines the democratic cohesion he sees in conscription. The moral equivalent requires everyone to pay the blood tax (in labor/risk) to maintain the civic bond, whereas the volunteer army allows the citizen to remain a civilian, which James views as a moral atrophy.

