answer: |-
  Here are my comments on your skeleton, structured according to your five requests. I have endeavored to distinguish between settled scholarly ground, contested interpretive territory, and your own reconstructive claims, marking my confidence levels as requested.

  ### (a) Accuracy: Dualism, SPR Details, and Dates

  **The Dualism (Section 2)**
  *   **Status:** **Settled Consensus.** Your characterization of the Dualism of Practical Reason is accurate. Sidgwick concludes *The Methods* with the admission that he cannot reconcile Egoistic Hedonism with Universal Hedonism (Utilitarianism) without a postulate of a moral governor who aligns the two.
  *   **Confidence:** **High.** This is standard Sidgwick scholarship (e.g., Schneewind, *The Myth of Practical Consistency*).
  *   **Nuance:** You describe Sidgwick as an "empiricist of Sidgwick's stripe." Be careful here. Sidgwick is an intuitionist regarding moral axioms and a hedonist regarding the good, but he is methodologically empirical regarding contingent facts.
      *   *Correction:* In Section 2, you write: "for an empiricist of Sidgwick's stripe, inability to establish a hypothesis a priori is not evidence that it is false." This is fair, but clarify that for Sidgwick, the *moral* axioms are known a priori (intuitionism); it is the *cosmological* fact (the moral governance) that requires empirical support.
  *   **Reconstruction Alert:** You state Sidgwick treats the moral governance as a hypothesis "on which evidence, if any were available, would be decisive." Sidgwick implies this, but he does not explicitly map out an *evidentiary protocol* in the *Methods*. This is your interpretive bridge to Section 3.

  **The SPR Details (Sections 1 & 3)**
  *   **Status:** **Mostly Settled, Minor Precision Needed.**
  *   **Dates:** SPR founded February 1882. Sidgwick was indeed the first President. *Methods* 1st ed. 1874. These are correct.
  *   **Creery Sisters:** The experiments ran from roughly 1881 to 1888. The exposure of fraud (signalling) occurred in 1888. Sidgwick's reaction was indeed one of rigorous disappointment rather than defensive denial.
      *   *Confidence:* **High.** (See Gauld, *The Founders of Psychical Research*).
  *   **The Evidence Required:** In Section 3, you write: "Evidence that personal agency survives bodily death, and that it retains moral character..."
      *   *Critique:* Survival alone does not solve the Dualism. A surviving soul could be unhappy or wicked. To solve the Dualism, the evidence must show that *virtue is rewarded* (or vice is punished) in the afterlife.
      *   *Correction:* Refine Section 3 to specify that Sidgwick needed evidence of **retributive justice** or **moral governance**, not merely survival. Survival is a necessary condition for the postulate, but not a sufficient one. This is a common slip in this literature; tightening it strengthens your accuracy.

  ### (b) Interest: Does Section 5 Distinguish the Thesis?

  **Status:** **Contested Interpretive Ground.**
  *   **Assessment:** Section 5 is the strongest philosophical pivot in the skeleton. The standard reading (Oppenheim, *The Other World*) is that Sidgwick sought religious consolation. Your reading is that he sought *philosophical coherence*.
  *   **Is it Cosmetic?** No, it is not cosmetic, provided you maintain the distinction between *fideism* (believing because one needs to) and *evidentialism* (believing because the data compels).
  *   **Confidence:** **Moderate.** Many scholars (e.g., Bartlett, *Henry Sidgwick and the SPR*) already argue that Sidgwick's psychical research was intellectually serious, not just emotional. However, linking it *specifically* to the structural requirements of the *Methods* (rather than general religious doubt) is your specific contribution.
  *   **Advice:** To ensure this isn't read as cosmetic, you must show that the *kind* of evidence Sidgwick sought in the SPR (statistical, controlled, fraud-resistant) matches the *kind* of gap left in the *Methods* (a contingent fact about the universe required to validate rational action). If he just wanted comfort, prayer or theology would suffice. If he wanted to validate rationality, he needed data. Emphasize the **rational necessity** over the **emotional desire**.

  ### (c) Counter-Reading: Does Section 4 Give the Quarantine Its Best Case?

  **Status:** **Strong, but Could Be Stronger.**
  *   **Assessment:** Section 4 is fair. It captures the "biographical residue" argument well.
  *   **What's Missing:**
      1.  **Sidgwick's Own Deflation:** You mention he died without claiming the evidence he wanted. Strengthen this by noting that in his later writings (e.g., the 1900 *Miscellaneous Essays*), Sidgwick explicitly warns against basing ethics on psychical data because the data remains inconclusive. He protects the *Methods* from the failure of the SPR.
      2.  **The "Esoteric" Point:** A stronger quarantine argument suggests Sidgwick believed the Dualism was a problem for the *philosopher*, not the *agent*. Ordinary agents don't need the universe to be morally governed to act morally; only the systematic thinker does. Therefore, the SPR is a project for the philosopher's peace of mind, not a prerequisite for the ethical system's public function.
      3.  **Chronological Independence:** Some historians argue Sidgwick's loss of faith (1860s) predates the finalization of the *Methods* (1874) and the SPR (1882). The quarantine reading suggests these are parallel symptoms of the same crisis (loss of Anglican faith), not that one (SPR) is the solution to the other (*Methods*).
  *   **Confidence:** **High** on the textual evidence of Sidgwick's caution; **Moderate** on the "esoteric" interpretation as a counter-argument.

  ### (d) Strongest Objection to Section 3 (The Core Claim)

  **Status:** **Genuinely Contested / The "Smoking Gun" Problem.**
  *   **The Objection:** **Lack of Explicit Textual Linkage.**
      *   There is no letter, diary entry, or published preface where Sidgwick explicitly writes: "I am founding the SPR to resolve the Dualism of Practical Reason outlined in *The Methods*."
      *   He *does* write extensively about the SPR resolving his *religious* doubts (specifically the credibility of miracles and survival).
      *   **The Risk:** Your argument relies on an inference: *The Methods* requires X. The SPR seeks X. Therefore, the SPR is for *The Methods*.
      *   **The Counter:** Sidgwick sought X (moral governance/survival) because he was a Victorian intellectual who lost his faith, a condition that motivated *both* the *Methods* and the SPR independently. The SPR might be the "empirical wing" of his **religious** crisis, not his **ethical** system.
  *   **How to Answer:** You must argue that for Sidgwick, the religious crisis *was* an ethical crisis. Because he defined religion largely in terms of moral governance, the distinction collapses. However, you must acknowledge this is an **interpretive reconstruction** (Section 2 & 3), not reportage of Sidgwick's explicit intent.
  *   **Confidence:** **High** that the explicit textual link is missing. **Moderate** that your reconstruction is the best explanation of the silence.

  ### (e) Structure: Dualism vs. History of Evidence

  **Recommendation:** **Argue as a Paper about the Dualism with SPR as Evidence.**
  *   **Reasoning:** You are presenting to a workshop on "Victorian Moral Philosophy." The audience cares primarily about the coherence of Sidgwick's ethical system.
  *   **Why not History of Evidence?** If you frame it as "History of Evidence with *Methods* as backdrop," you risk making the *Methods* seem like a mere pretext for his psychical interests. This invites the "quarantine" objection (Section 4) more strongly.
  *   **Strategic Advantage:** By framing it as "The Dualism requires empirical closure; here is how Sidgwick attempted to find it," you make the SPR work *philosophically necessary* rather than historically incidental. It elevates the SPR from a hobby to a methodological requirement of Sidgwickian utilitarianism.
  *   **Confidence:** **High.** This framing aligns better with the venue and protects you against the "biographical residue" critique.

  ### Summary of Interpretive Reconstructions vs. Reportage

  To satisfy your request for plain marking of reconstruction:

  1.  **Reportage (Settled):** Sidgwick founded the SPR in 1882. Sidgwick posits the Dualism in *The Methods*. Sidgwick requires a "Moral Governance of the Universe" to resolve the Dualism. Sidgwick sought empirical evidence for survival/governance via the SPR.
  2.  **Reconstruction (Your Claim):** That the SPR was instituted *specifically* to address the *Methods'* Dualism (rather than general religious doubt). That Sidgwick's methodological rigor in the SPR (fraud elimination) was driven by the *philosophical necessity* of the evidence rather than general scientific scruple.
      *   *Advice:* In Section 3, use phrasing like: "On this reading..." or "This suggests that..." rather than "This gives his methodological obsessiveness a philosophical explanation" (which sounds like a statement of fact).
      *   *Confidence:* **Moderate.** This is a compelling hypothesis, but it competes with the "general religious crisis" hypothesis.

  ### Final Polish Suggestions

  *   **Section 2:** Clarify that the "hypothesis" is about the **cosmos**, not the **ethics**. The ethics are rational; the cosmos is the contingent variable.
  *   **Section 3:** Change "retains moral character" to "is subject to moral sanction." Survival of a wicked soul helps no one.
  *   **Section 5:** Explicitly contrast **Fideism** (I believe because I need to) with **Evidentialism** (I seek evidence because rationality demands it). This sharpens your distinction from the "Sidgwick wanted a God" crowd.

  This is a robust skeleton. The link between the *Methods'* aporia and the SPR's methodology is a sophisticated argument that deserves the nuance you are applying. Just ensure you don't overstate Sidgwick's own explicit awareness of the link.
