answer: |-
  The afternoon light in the Savilian Professor's rooms was grey and thin, filtering through the leaded panes onto piles of paper weighted down by inkwells and compasses. John Wallis stood by the fireplace, warming his hands, when the knock came. It was not the hesitant tap of a student but the authoritative rap of a man accustomed to doors opening for him. When Wallis opened it, Thomas Hobbes stood there, cloak damp from the Oxford drizzle, his eyes sharp despite his sixty-eight years.

  "Mr. Wallis," Hobbes said, not waiting for an invitation. He stepped inside, scanning the room until his gaze landed on the proofs scattered across the desk. "I have read your *Arithmetica*. I find I must speak with you before your errors calcify into dogma."

  Wallis bowed slightly, closing the door against the draft. "Mr. Hobbes. I anticipated your visit. You were not kind to my work in your *Six Lessons*."

  "Kindness is for poets," Hobbes said, moving to the desk and tapping a sheet covered in columns of numbers. "Truth is for geometers. And you are not treating geometry as a science of demonstration, but as a game of counters. You claim to find the area of a triangle by summing lines. But tell me, Mr. Wallis: what are these lines?"

  "They are indivisibles," Wallis said calmly, moving to pour wine. "Infinitely thin parallels that constitute the figure."

  "Here is the fork in the road," Hobbes said, turning sharply. "An indivisible must either have magnitude or it must not. If it has magnitude, then infinitely many of them constitute an infinite magnitude, and your triangle is larger than the universe. If it has no magnitude, then adding them together is adding nothing to nothing, and your triangle is a point. You cannot escape this. Your method is built on a contradiction."

  Wallis handed Hobbes the wine but did not drink himself. "You present a dilemma that assumes I am completing the infinite. I do not. I do not claim to sum an infinite number of parts in the sense of counting them to an end. I claim that the ratio holds. Consider the sum of squares. If I take the series $0, 1, 4, 9$ up to any finite number $n$, and compare it to a series of equal terms each equal to the largest square, the ratio is always greater than one-third. But as the number of terms increases, the excess above one-third diminishes."

  "And yet you extrapolate to infinity," Hobbes pressed. "You assume the pattern holds when the terms are no longer finite."

  "I assume nothing that cannot be verified by exhaustion," Wallis replied. "If you claim the ratio is not one-third, you must assign a magnitude by which it differs. Show me a quantity, however small, that remains unaccounted for. My method demonstrates that the remainder is less than any magnitude you can assign. If the difference is less than any assignable quantity, is it not effectively zero? I do not need to comprehend the infinite to know the proportion holds."

  Hobbes set the wine down untouched. "This is sophistry dressed as rigor. You obtain the correct number, I grant you that. But you do not know *why* the figure has that area. You have found a result by tabulating cases and guessing the rule. That is not *scientia*. To know a thing scientifically is to know its generation. In geometry, we construct the line by moving the point, the surface by moving the line. We know the cause because we are the cause. You treat the figure as a static collection of atoms to be counted. You have replaced construction with reckoning. You are shuffling algebraic symbols and calling it knowledge of nature."

  "Is it not knowledge to know the true proportion?" Wallis asked. "If I tell you the area is precisely one-third of the parallelogram, and I can prove it to within any margin of error you desire, what more do you require? You demand generation. But consider your own physics, Mr. Hobbes. In *De Corpore*, you seek to explain natural phenomena by motion. But do you construct the wind? Do you generate the heat of the sun? You observe effects and reason backwards to probable causes. You admit yourself that in physics, we often lack the certainty of geometry. Yet here, in mathematics, where I offer you certainty of proportion, you reject it because I do not 'move' a point? Why is arithmetic reckoning inferior to imaginary motion?"

  Hobbes stiffened. "Because in physics, I acknowledge the uncertainty. I propose hypotheses. In geometry, there is no room for hypothesis. If you allow reasoning about completed infinities without construction, you open the door to every obscurantist in England. You give license to the Scholastics to speak of infinite essences and unconstructible entities. If you allow a magnitude to be composed of things that are not magnitudes, you destroy the definition of quantity. Once you sever the link between reasoning and the generation of terms, words cease to mark things and begin to mark only other words. That is the path to madness."

  Wallis walked to the window, looking out at the quad. "I understand your fear. You see the clergy behind my method, ready to smuggle in mysteries under the guise of calculation. But I am not a Scholastic. I do not claim to comprehend the infinite essence of God or nature. I claim only that the rules of arithmetic, applied consistently, yield truths that are useful and consistent. If I say the sum of the squares is to the sum of the equals as one to three, I am speaking of a relationship that holds regardless of whether we view the lines as moving points or static indivisibles. Is the truth of the ratio dependent on the metaphor we use to describe it?"

  Hobbes paused. He looked at the papers, at the columns of numbers that did indeed converge toward the result he could not deny was correct, even if he despised the path. "I will concede this," Hobbes said slowly. "Your method yields results that are useful for navigation and engineering. It is a kind of cunning. It allows men to build ships that float and clocks that keep time. I do not deny the utility. But utility is not truth. A man may hit a mark by luck, or by a rule he does not understand. You have found a rule, but you do not know the ground upon which it stands."

  "And I will concede this," Wallis said, turning back. "Your caution is not without merit. There are those who will misuse the language of infinities to argue for things beyond reason. I do not claim the indivisible is a physical atom. It is a mathematical tool. If I speak loosely of 'summing the infinite,' it is shorthand for the limit of the proportion. I grant that without care, the language invites confusion. Perhaps I should speak less of the infinite sum and more of the continuing ratio."

  "But you will not stop using the method," Hobbes said.

  "No. Because it works. And because I believe the certainty of the proportion is itself a form of knowledge, even if it lacks the causal generation you prize. You say reasoning is reckoning with names. I say that if the reckoning is consistent, the names track reality sufficiently for science."

  Hobbes picked up his hat. "Then we are at an impasse. For you, science is the correct calculation of effects. For me, science is the knowledge of causes. You are content to know *that* it is one-third. I require to know *how* it becomes one-third."

  "Is there a difference," Wallis asked, "when the *that* is certain?"

  "There is always a difference," Hobbes said, moving to the door. "For if you know only the *that*, you are at the mercy of the pattern. If the pattern breaks, you are lost. If you know the *how*, you hold the generation in your mind. You are not guessing at God's arithmetic; you are replicating His creation. But I see you will not be moved. You Oxford men prefer the safety of the chair to the risk of the construct."

  "And you, Mr. Hobbes, prefer the purity of the definition to the abundance of the harvest," Wallis replied. "I will keep my indivisibles. You keep your causes."

  Hobbes opened the door. The wind from the corridor blew out the candle on the desk. "Keep them, then. But do not call it geometry. Call it what it is: a new arithmetic of shadows."

  "And do not call your physics science," Wallis said softly, "when it rests on hypotheses you cannot construct."

  Hobbes did not turn back. He stepped into the dark hallway, closing the door firmly. Wallis stood alone in the grey light, looking down at the table where the sum of the squares waited, silent and correct, between the ink and the shadow.
