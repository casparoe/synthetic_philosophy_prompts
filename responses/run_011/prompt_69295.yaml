      *   **Goal:** A practical standard. Good enough to defend using the variable, good enough to spot illegitimate steps.
      *   **Specific Requirements:**
          *   Address specific problems listed: Boundary, Heterogeneity, Within-cohort Stratification, History, Reflexivity, Measurement (APC identification).
