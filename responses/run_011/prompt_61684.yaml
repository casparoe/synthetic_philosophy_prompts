  Been going around on Twin Earth in the same forum thread for like eight years now and I've concluded nobody has ever moved anybody. The moves are all known: the slow-switching worry (shuttle Oscar between Earth and Twin Earth and either his inferences from memory stop being valid or content has to stay fixed across the switch), the two-dimensional reply, the claim that XYZ-planet isn't really a possible world once you fix what water essentially is, the appeal to the division of linguistic labor, and the retort that Putnams examples were about words all along and not about thoughts. Everyone on both sides agrees on every physical and behavioral fact in the cases. So what kind of disagreement is this actually? My working theory, offered as a theory: they aren't disagreeing about what 'water' refers to, they're disagreeing about which job content is supposed to do -- explaining how speakers coordinate and correct each other in conversation, versus keeping inference and memory valid over time -- and both jobs are being billed as what meaning is. If that's right, is the debate verbal, or two different questions wearing one name, or a substantive disagreement with a buried empirical premise about how real speakers defer when they're corrected?

  Test my theory against what each side actually says rather than just accepting it, tell me where you think I've got it wrong, and say what would count as progress: a distinction, a formal result about content across switches, some experiment about deference, a change of question, or a straight argument that we should expect zero progress and why. No bibliography, no reading list, no see-alsos -- I've read all of it, I want your reasoning.

  Answer in these sections, in this order:

  - The shape of the stalemate (~150 words): what each side takes as its data and what it concedes to the other
  - Testing my hypothesis (~400 words)
  - Where the buried question is (~250 words): empirical, conceptual, or about which explanatory job content does
  - What would count as progress (~250 words)
  - Confidence (~100 words): how sure you are of your diagnosis and what would flip it
