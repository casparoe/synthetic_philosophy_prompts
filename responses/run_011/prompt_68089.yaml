  I'm running a 75-minute session for 24 second-years who've had a term of decision theory but zero game theory, and I want them to collide with the backward induction paradox in the centipede game before anyone says "centipede" or "backward induction" out loud. So: design it as a live game they actually play, not a worksheet or a thought experiment I narrate.

  Two things I care about most. First, the payoff scheme has to run on paper tokens or a scoreboard — no money — and I want the actual numbers written out so I can paste them onto a slide, plus a version of the game short enough that a pair finishes it in under five minutes so we can get through several rotations. Second, the moment the first pair lets the pot grow past the early rounds, I want every student in the room to fill out an index card saying what they now believe about the player who passed and what they'd do sitting in that seat. We collect them and cluster them live on the board. That card is where the real puzzle lives for me: the standard analysis is completely silent off the equilibrium path, and I want them to feel that silence rather then be told about it.

