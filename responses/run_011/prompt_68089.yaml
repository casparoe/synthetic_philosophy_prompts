  ### Payoff Slide (Copy-Paste Ready)

  ```text
  THE TOKEN GAME

  Round 1 (You):  TAKE [2 for You, 0 for Them] 
                  PASS -> Round 2

  Round 2 (Them): TAKE [1 for You, 4 for Them] 
                  PASS -> Round 3

  Round 3 (You):  TAKE [6 for You, 3 for Them] 
                  PASS -> [5 for You, 5 for Them] (Game Ends)

  RULES: 
  1. One moves at a time. 
  2. Game ends immediately on TAKE. 
  3. Highest tokens win.
  ```

  ### Minute-by-Minute Run Sheet

  | Minute | What Students Are Doing | What's On The Board | Exact Words I'm Allowed To Say (<15, no jargon) | What The Moment Sets Up |
  | :--- | :--- | :--- | :--- | :--- |
  | **00-05** | Finding partners, sitting facing each other. | Payoff Slide (see above). | "Pick a partner. Sit facing them. Do not talk." | Physical arrangement prevents collusion before the game starts. |
  | **05-10** | Playing Round 1 silently. Watching for hands. | Payoff Slide. | "Start Round 1. Raise hand if you choose PASS." | Creates the live data point. We need a Pass to trigger the paradox. |
  | **10-11** | **FREEZE.** Hands down. Pen out. | "STOP. GET A CARD." | "Stop. Keep your hands down. Look at me." | Interrupts the flow. Makes the Pass an event, not just a move. |
  | **11-16** | Writing beliefs on index cards. | "1. Why did they pass?<br>2. What do you do next?" | "Write on the card. Why did they pass? What do you do?" | Forces explicit belief formation about an 'impossible' move. |
  | **16-26** | Sticking cards on whiteboard. Grouping them. | A growing cloud of index cards. | "Stick your card on the board. Group similar answers." | Visualizes the distribution of off-path beliefs. |
  | **26-30** | Reading clusters. No commentary from me. | Clustered cards (e.g., "Nice", "Mistake", "Trap"). | "Read the clusters. Do not explain them yet." | Lets them see the disagreement without my theoretical framing. |
  | **30-45** | Playing Rounds 2 & 3. Same partners. | Payoff Slide. | "Play again. Same partner. Try to get more tokens." | Tests if beliefs from cards change actual play (learning). |
  | **45-55** | Comparing Round 1 vs Round 3 outcomes. | Two columns: "Round 1" vs "Round 3". | "Did the pot grow larger the second time?" | Highlights stability or collapse of cooperation over time. |
  | **55-65** | Silent reflection on the card clusters. | "The theory says: Round 2 never happens." | "The theory says this card should not exist." | **The Pivot.** Connects their data to the theoretical silence. |
  | **65-75** | Packing up. Thinking. | "Next time: Why does the math delete you?" | "Keep the card. We solve this silence next session." | Leaves the paradox unresolved. Motivation for the next lecture. |

