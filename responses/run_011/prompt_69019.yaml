answer: |-
  Your diagnosis is remarkably acute, and your spreadsheet experiment strikes me as the most significant archaeological contribution you have made since retirement. You have correctly identified that the impasse in your reading group is not primarily empirical, but structural. To answer your specific question: the dispute is best described as a disguised normative question about the value of additional lives (your second candidate), operationalised through a conflation of two distinct questions (your fourth candidate). The empirical disagreement (candidate one) is merely the theatre in which this normative conflict is staged, while the question of agency (candidate three) is largely a red herring regarding the evaluation of outcomes.

  Let us dismantle the candidates in order of their explanatory power. The empirical disagreement holds the least weight. You note that both sides are numerate and cite evidence, yet concede nothing. This is characteristic of debates where data is used defensively rather than investigatively. When the 'catastrophe' party points to enamel hypoplasia, they are citing individual welfare metrics. When the 'progress' party points to the cultural ratchet, they are citing civilisational capacity. No amount of new bone data will reconcile these because they are measuring different variables. Taphonomic bias may obscure the precise magnitude of the health decline, but it will not alter the fundamental trade-off between individual quality of life and population carrying capacity. Thus, the empirical dispute is a proxy war.

  The argument regarding agency—that the question is ill-posed because there was no decision point—is similarly unproductive. We routinely evaluate natural disasters or evolutionary dead-ends as 'unfortunate' without implying an agent could have chosen otherwise. Whether the transition was a ratchet or a choice affects our assignment of blame, but it does not prevent us from assessing the welfare consequences of the resulting state. Therefore, this candidate offers little explanatory power for the stalemate.

  The heavy lifting is done by the remaining two candidates, which are intimately linked. Your hypothesis regarding the 'aggregation rule' is the mathematical expression of a deeper ethical divergence. The 'catastrophe' side is implicitly employing an average utilitarian view: what matters is the mean quality of life for the individuals existing at any given time. By this metric, the Neolithic transition was indeed a disaster; the average farmer was shorter, sicker, and worked harder than the average forager. The 'progress' side, conversely, operates on something resembling a total utilitarian view or a prioritarianism focused on potentiality. They value the sum total of human experience made possible by surplus, or the existence of the cultural artefacts that require a large population to sustain.

  This reveals why your fourth candidate—the conflation of two distinct questions—is equally vital. The group is prosecuting 'Was this bad for the people who lived through it?' and 'Was it bad that this happened?' under a single headline. The answer to the first is almost certainly 'yes', based on the bioarchaeological record. The answer to the second is 'no', provided one values the existence of modern civilisation, medicine, and the very leisure that allows your group to meet. The frustration in the cathedral city arises because each side believes they are answering the same question, when they are actually answering different ones with different ethical weights.

  So, what counts as progress? You asked for a diagnosis, not a verdict, but a diagnosis implies a treatment. Given that the core disagreement is normative, no amount of new data will resolve it. Progress, therefore, must be conceptual rather than evidential. A stipulated welfare measure would likely fail because the parties disagree on what constitutes welfare (health vs. cultural capacity). A formal model of the trap, such as the one you began, is useful not for finding the 'right' answer, but for making the trade-offs explicit. If you can demonstrate that improving the mean welfare parameter necessarily collapses the population parameter in your model, you force the group to acknowledge the trade-off rather than arguing over the data points.

  However, the most productive path is a reframing of the question. The group should cease asking whether the transition was a 'mistake' or a 'catastrophe'. Instead, they should ask: 'What trade-offs are we willing to accept for stability and scale?' This shifts the debate from archaeology to ethics, which is where it belongs. It acknowledges that the Neolithic was a bargain: health for security, leisure for surplus.

  If I may be blunt, no progress should be expected if the group continues to treat this as an archaeological mystery waiting for a missing shard of evidence. The residue that no data would touch is the ethical weighting of existence itself. This is the same structure you rightly identify in disputes about automation and medical enhancement. In automation, we trade meaningful labour for efficiency and cheap goods; in medical enhancement, we might trade natural variation for reduced suffering. The Neolithic is simply the first instance of this recurring technological ethics.

  As for your remaining evenings, I would suggest you abandon the attempt to reach a consensus on the Neolithic. Instead, use the Neolithic as a case study to formalise the ethical disagreement. Dedicate sessions to defining the 'aggregation rule' you discovered. Have the solicitor articulate the political theory of surplus defence; have the medical officer quantify the health cost; have yourself model the energy variance. Then, ask the group to vote not on what happened, but on which metric they would prioritise if they were designing a society.

  You will likely find that the impasse remains, but the nature of it will change. It will no longer be a frustration of blocked inquiry, but a clear-eyed acknowledgement of incompatible values. That is not a failure of the group; it is a success of the philosophy. You have moved from arguing about the past to arguing about the principles by which we judge any future transition. That is a worthwhile use of time, even if it yields no verdict.
