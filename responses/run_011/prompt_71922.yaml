      *   *Claim 3:* Instrumentalism/Fictionalism about folk psychology. It's useful (like "sun rises") but not literally true.
      *   *Claim 4:* Argument for Eliminativism. Folk psychology fails to explain sleep, memory, learning, mental illness.
      *   *Claim 5:* Hope for a future theory of content (Intentionality). Neuroscience will find a physical relation that constitutes "aboutness."
      *   *Claim 6:* Rejection of the "performative contradiction" objection (you can't assert eliminativism without believing it).

  3.  **Evaluate Consistency (The "Hang Together" Test):**

      *   *Tension 1: Claim 1 vs. Claim 2 (The Big One).*
