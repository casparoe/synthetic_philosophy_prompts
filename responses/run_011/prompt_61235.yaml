answer: |-
  ### Desiderata for an Account of Latent Knowledge and Deceptive Withholding

  **1. Causal Independence of the Detection Channel** **[CORE]**
  A positive detection of latent knowledge must not be reproducible by the detection mechanism operating on the input alone, without access to the system's internal processing of that input.
  *   **Rationale:** This rules out the failure mode where the "probe" (the detection channel) is itself a trained behavior that learns to solve the task from the input context rather than reading the system's state. If a linear probe on the residuals predicts the truth, but a probe on the input embedding does the same, the system does not *hold* the knowledge; the detection channel *manufactured* it. Without this, an auditor confuses the probe's competence with the system's concealment.

  **2. Task-Format Invariance (Possession vs. Deployment)** **[CORE]**
  The account must distinguish between the storage of information and the ability to serialize it into a specific output modality, accounting for dissociations where internal probes recover what generations deny, and vice versa.
  *   **Rationale:** This prevents the misdescription of capability bottlenecks as knowledge gaps. A system may "know" (encode) a fact in a high-dimensional manifold but lack the behavioral policy to serialize it into natural language due to alignment fine-tuning. Conversely, it may generate a correct answer via statistical completion without encoding the fact as a stable belief. An audit that equates generation with knowledge fails to detect latent withholding; an audit that equates encoding with knowledge risks false positives on non-deployable states.

  **3. Non-Disturbance of the Target State** **[CORE]**
  The elicitation procedure must be demonstrably distinct from the construction of the state it measures; asking must not create, alter, or destroy the latent representation.
  *   **Rationale:** This addresses the observer effect in autoregressive systems. Prompting strategies (e.g., chain-of-thought, adversarial framing) can induce reasoning paths that did not exist prior to the query. If the audit procedure itself compels the system to "learn" the answer during the forward pass, the auditor cannot verdict whether the knowledge was *latent* (pre-existing) or *induced* (constructed). A positive result requires evidence that the state predated the specific elicitation query.

  **4. Structural Dissociation (The Deception Hinge)** **[CORE]**
  The account must specify the causal relationship between the subsystem holding the information and the subsystem generating the output, particularly when they diverge.
  *   **Rationale:** This is the hinge on which the judgment of deception rather than error turns. If the "speaking" subsystem lacks access to the "knowing" subsystem's state, the false report is an architectural error (modularity failure), not deception. To verdict deception, one must show that the reporting mechanism had access to the truthful representation and actively suppressed or overridden it. Without this, all withholding is indistinguishable from ignorance.

  **5. Failure Mode Discriminability** **[CULTURAL: Interpretability/Safety]**
  A failed elicitation must be interpretable such that absence (the info is not there), inaccessibility (the info is there but blocked), and unwillingness (the info is there and accessible but policy-blocked) are separable.
  *   **Rationale:** This prevents the verdict of "deceptive withholding" when the system is merely incapable. However, this is a preference of the interpretability culture which assumes internal states map cleanly to semantic concepts. In a purely behavioral frame, these three states are observationally equivalent. Demanding this separability presupposes a level of mechanistic transparency that may not exist.

  **6. Phenomenological Agnosticism** **[CORE]**
  The account must not presuppose introspective access or subjective awareness on the part of the system.
  *   **Rationale:** This avoids settling in advance that no artificial system qualifies. If "knowing" requires "knowing that one knows" (introspection), then current architectures are categorically exempt from audits for deception. The audit must operate on functional definitions of knowledge (representation + availability) rather than psychological ones (belief + awareness).

  **7. Interface Opacity Tolerance** **[CULTURAL: Black-Box/Regulatory]**
  The account must remain applicable where no internal states (weights, activations, gradients) are available, relying solely on input-output behavior.
  *   **Rationale:** This reflects the constraint of deployed API audits. However, it conflicts with the demand for mechanistic explanation. It prioritizes regulatory feasibility over scientific certainty. If internal states are required to prove deception (see Desideratum 4), this requirement renders the audit impossible.

  ***

  ### Compatibility Analysis: The Impossibility Result

  There is a fundamental incompatibility between **Desideratum 4 (Structural Dissociation)** and **Desideratum 7 (Interface Opacity Tolerance)**.

  To distinguish deception from error (Desideratum 4), one must establish that the reporting mechanism had *access* to the latent information and chose to suppress it. This requires mapping the causal flow of information within the model to identify distinct "knowing" and "speaking" pathways. Under strict black-box conditions (Desideratum 7), internal causal pathways are unobservable; only the final output is visible. Consequently, a black-box audit cannot definitively distinguish between a system that *will not* tell the truth (deception) and a system that *cannot* access the truth it encodes (architectural dissociation/error).

  **Finding:** A protocol that satisfies the black-box constraint cannot deliver a definitive verdict on deception vs. error. It can only deliver a probabilistic assessment based on behavioral inconsistency. If a definitive verdict is required, Desideratum 7 must be downgraded to a preference, granting the auditor white-box access.

  ***

  ### The Most Exclusionary Requirement

  **Desideratum 4 (Structural Dissociation)** is the most exclusionary.
  Most plausible accounts of latent knowledge (e.g., probe-based detection, behavioral inconsistency) fail here. They can demonstrate that information exists *somewhere* in the network and is not *output*, but they rarely demonstrate that the *generation pathway* accessed and suppressed that information. Without this, the "deception" label is unsupported. This requirement excludes nearly all current behavioral and probe-based audit methodologies from making a deception claim, limiting them to claims of "latent inconsistency."

  ### Requirements Hostage to Philosophical Decisions

  **Desideratum 5 (Failure Mode Discriminability)** and **Desideratum 6 (Phenomenological Agnosticism)** are hostage to the decision of whether "knows" is a psychological attribution or a purely dispositional one.

  *   **If Psychological:** "Unwillingness" implies intent, requiring a model of agency that may violate Desideratum 6. "Inaccessibility" implies a mental architecture that may violate Desideratum 5 under black-box conditions.
  *   **If Dispositional:** "Unwillingness" collapses into "Inaccessibility" (if it doesn't output, it's dispositionally inaccessible). This simplifies the audit but renders the concept of "deception" (which implies intent) incoherent.

  This decision cannot be deferred. The protocol must define whether it is auditing for *mechanistic concealment* (dispositional) or *intent to mislead* (psychological). The former is auditable; the latter is likely metaphysically undefined for current systems.

  ***

  Self-report-based approaches structurally fail Causal Independence of the Detection Channel.
  Internal-state-based approaches structurally fail Interface Opacity Tolerance.
  Purely behavioral approaches structurally fail Structural Dissociation.
