      *   **Constraints:** Mark standard usage (Butterfield, etc.) vs. reconstruction. Flag uncertainty. Don't assume factual error. Don't just say "ask your friend" (though acknowledge if the term is too unstable). Be honest about the trade-off between Whig and antiquarian.

  2.  **Deconstruct "Whig History":**
      *   *Origin:* Herbert Butterfield, *The Whig Interpretation of History* (1931).
      *   *Core Definition:* Interpreting the past as a necessary progression toward the present (specifically, liberal democracy/Enlightenment values). Judging past actors by how much they contributed to "us."
      *   *Evolution:* The term has drifted. It's often used loosely as "presentism" or "teleology."
      *   *User's specific situation:* Infrastructure/standards history. 1884 Conference. Ending links 1884 to now (phone timestamps).
      *   *The Friend's Critique:* "The whole thing is arranged so that 1884 exists in order to produce my last paragraph." This suggests *teleology* (the end determines the beginning) rather than just *presentism* (judging the past by present morals).

  3.  **Drafting the Menu (Iterative Process):**
      *   *Need:* Sorted from trivial (true of all history) to substantive (genuine failures).
      *   *Item 1: Selection Bias.* You have to pick something. All history does this. (Trivial/Unavoidable).
      *   *Item 2: Presentism (Moral).* Judging past actors by modern morals. (Common usage, but maybe not Butterfield's core).
      *   *Item 3: Teleology (Inevitability).* The idea that the outcome *had* to happen. This is the core Butterfield critique.
      *   *Item 4: Anachronism of Concept.* Imputing modern motivations to past actors.
      *   *Item 5: The "Victors" Narrative.* Ignoring losers/alternatives. (France abstaining is mentioned, but did the piece treat it as a mere footnote to the "winning" system?)
      *   *Item 6: Functionalism.* Assuming institutions exist *for* their current function.

      *Refining the Sort:*
      1.  *Selection by Significance:* (Trivial). You can't write about everything.
      2.  *Narrative Closure:* (Structural). Stories need endings.
      3.  *Teleological Necessity:* (Substantive). Did the text imply Greenwich *had* to win?
      4.  *Motivational Anachronism:* (Substantive). Did delegates want "global time" or something else (railway safety, naval dominance)?
      5.  *The "Arrow of Progress":* (Ideological). Did it frame the change as *improvement* rather than just *change*?

  4.  **Addressing the User's Diagnosis:**
      *   *User:* "Whiggish just means selecting your material by downstream consequences... every history ever written fails it."
      *   *Response:* It's not *selection* that's the sin, it's the *implication of necessity*. If you select based on consequences but acknowledge contingency, it's not Whig. If you select based on consequences and imply the outcome was the *goal* all along, it's Whig.
      *   *Verdict:* The gloss is partially right but misses the crucial nuance of *contingency*.

  5.  **Addressing the "Antiquarian vs. Whig" Squeeze:**
      *   *Antiquarian:* Just facts, no meaning.
      *   *Whig:* Meaning derived solely from the present.
      *   *Middle Ground:* Contextualism. Explain why it mattered *then*, and then trace the lineage without implying inevitability. Acknowledge the losers (France) as genuine alternatives, not just stumbling blocks.
      *   *Trade-off:* Relevance vs. Accuracy of Experience. You buy reader engagement with Whiggishness, you buy historical fidelity with Contextualism.

