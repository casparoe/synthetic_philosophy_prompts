answer: |-
  Dear colleague,

  It is a genuine pleasure to hear from you, though I wish the circumstances were less fraught. You have stumbled into the exact pressure point where abstract ethical reasoning meets the grinding gears of local political economy, and it is no surprise that it is costing you sleep. What you are describing is the central tension of modern American land use, and while there is no clean philosophical solution that leaves everyone whole, there are ways to navigate the decision that are intellectually honest and empirically grounded. I will try to address your three questions in the order you posed them, though you will find they bleed into one another considerably.

  Let us start with the empirical question regarding the bus driver, because if his fear is merely a costume for exclusionism, you can dismiss it with a clear conscience, but if it is a material mechanism, you owe it to him to acknowledge the reality of his precarious position. The evidence here is mixed but leans toward validating his concern about property values while complicating the narrative about displacement. There is a growing consensus in urban economics that adding market-rate housing in supply-constrained regions does moderate regional rent growth over time. Several recent studies, including work by Asquith and others, suggest that new market-rate construction lowers rents in nearby buildings relative to what would have happened without the construction, due to a filtering effect and reduced competition for existing units. However, that same literature indicates that new development often increases nearby property values in the short to medium term because it signals neighborhood amenity and demand. For a renter, this is good news. For a fixed-income owner whose house is their pension and whose taxes are tied to assessed value, this is a genuine risk. The mechanism is not imaginary. If your town assesses based on recent sales and that six-unit building sells or refinances at a high per-door value, the assessor may use it as a comparable, nudging up the valuation of the surrounding bungalows. Whether this pushes them out depends entirely on state and local tax policy. Many states have circuit breakers or deferral programs for seniors that decouple tax liability from current assessment, but many small towns do not, or the programs are poorly advertised. So, when you speak to him, you should not tell him his fear is unfounded. You can tell him that while the town has a duty to address the regional housing crisis, it also has a duty to protect existing residents from unintended fiscal consequences, and that your vote for the project should be coupled with an advocacy for tax relief measures for long-term homeowners. This distinguishes the policy decision from the protective measures, validating his fear without letting it veto the project.

  This leads directly to your second question about standing and representation. You are correct that the people most damaged by the status quo are not in the room. This is a structural feature of local zoning boards, not a bug. William Fischel's Homevoter Hypothesis argues precisely that local land use governance is captured by existing homeowners because they are the only ones with a concentrated financial stake and the standing to participate. Renters, potential residents, and workers like the aides and cafeteria staff mentioned are diffuse interests with no organizational vehicle in a planning hearing. As a board member, especially one appointed as a citizen member rather than an elected official, you are effectively a trustee for the whole municipality and arguably the region, not just the abutters. The comprehensive plan you cited is likely designed to be vague enough to survive legal challenge, and character is indeed a term that planners largely regard as subjective and often exclusionary when invoked to block density. However, you cannot simply vote for the invisible tenants and ignore the visible neighbors. The ethical weighting here requires you to acknowledge that the harm of exclusion is systemic and invisible, while the harm of change is localized and visible. Your role is to weigh the general welfare against specific hardship. If you vote to deny the project to protect the bus driver, you are actively choosing to preserve the exclusion of the home health aide who cannot find housing within twenty miles. If you vote to approve, you are accepting a risk of harm to the bus driver to mitigate a certainty of harm to the invisible renter class. There is no consensus on how to balance this, but the prevailing view in planning ethics is that boards must consider regional needs even when local opposition is strong, provided the project meets safety and statutory requirements.

  Regarding the vote itself and what you can say out loud, I would suggest that you vote to approve the permit, but your reasoning must be carefully constructed to avoid the charge that you are treating the bus driver as a mere means to an end. You cannot say that his hardship is an acceptable externality. Instead, you should frame the decision as a compliance with the broader housing needs of the state and region, acknowledging that the town has under-produced housing for decades and that this project represents a correction. You can explicitly state that while you understand the tax anxiety, the solution to that anxiety is tax policy reform, not zoning veto power. This allows you to vote for the project without dismissing his humanity. You must also address the affordable housing component honestly. If the aides make less than sixty percent of area median income, then those units are indeed not for them. You can note this limitation in your remarks, stating that while this project is not a complete solution, it is a necessary increment, and that the town should push for deeper affordability restrictions in the future. This shows you are listening to the substantive critique about who the housing is for, rather than just accepting the developer's label of affordable at face value.

  Now I must address the complication you mentioned regarding your graduate student, and I will be direct because the stakes are high for your professional integrity. You mentioned you do not want to recuse yourself, and I understand the desire to stay in the fight, but you need to scrutinize this very carefully. If your student's housing security is materially affected by the outcome of this vote, you have a conflict of interest. You noted that her unit is illegal and that enforcement is lax. If you vote to approve higher density, you might be normalizing multi-unit living in that zone, which could theoretically reduce the scrutiny on her basement unit. Conversely, approving a legal six-unit building might bring more attention to housing code enforcement in the immediate vicinity, potentially endangering her lease. Because the causal chain is ambiguous, you might convince yourself there is no conflict, but the appearance of a conflict is sufficient to undermine your authority. If you vote to approve, and it later comes out that your student lives nearby in an illegal unit that benefits from the lax enforcement you are perpetuating or the density you are approving, your opponents will weaponize that. The safest ethical path, and the one that protects you from accusations of bad faith, is to disclose the situation on the record without naming the student specifically, stating that you have a tenant constituent in the vicinity whose housing situation makes you sensitive to enforcement disparities, and then ask the board counsel if this requires recusal. If you choose not to recuse, you must rigorously bracket your student's situation from your reasoning. Do not vote for the project to save her rent. Vote for the project based on the regional housing need and the zoning criteria. If you cannot separate those two motives, you should step aside. I know this is unwelcome advice, but in a small town, reputational damage from a perceived conflict can linger longer than any zoning decision.

  Finally, a word on the comprehensive plan and the character argument. You mentioned you cannot tell if character is picking anything out in the world. In planning practice, it usually is not, unless it is defined by specific physical metrics like setback, height, and bulk. If the project meets the dimensional requirements of the special permit, then character is likely being used as a proxy for opposition to change itself. You are within your rights to interpret the plan as a living document that must adapt to state housing mandates. The state law allowing a second unit already signals that the local single-family zoning is out of step with regional needs. Your vote can be framed as aligning the town with the state's recognized housing crisis rather than violating the town's plan.

  To summarize my advice: treat the bus driver's tax fear as real but solvable through tax policy rather than zoning vetoes; acknowledge the structural silence of the renters but act as a trustee for their interests; vote to approve if the project meets safety and statutory criteria, framing it as a regional necessity; and seriously reconsider your position on recusal regarding your student, or at minimum disclose the potential conflict to clear the air. You are being asked to make a distributive justice decision with imperfect information and conflicting valid claims. There is no outcome that leaves everyone whole, but there is a process that respects everyone's dignity. I hope this helps you find some ground to stand on Thursday evening.

  Warmly,

  A Colleague
