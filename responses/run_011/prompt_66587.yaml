answer: |-
  PROVENANCE TRUST & SAFETY // MANUAL 4.2 // PERCEPTUAL PROVENANCE PROTOCOLS

  **1.0 OBJECTIVE**
  To maintain platform integrity by ensuring user reviews reflect direct perceptual engagement with the referenced work. Reviews must demonstrate Acquaintance Priority. The system prioritizes evidence of viewing over evidence of knowledge.

  **2.0 DEFINITIONS**
  **2.1 Verdict Testimony:** Assertive claims regarding the quality, value, or merit of a work (e.g., "masterpiece," "waste of time") without accompanying perceptual markers. Restricted for Tier 1 users.
  **2.2 Salience Testimony:** Directive claims identifying specific perceptual features for user attention (e.g., "observe the lighting in scene 4," "note the bass mix"). Encouraged for all users. Salience is considered proof of engagement.
  **2.3 Perceptual Provenance:** The verified chain of attention linking the reviewer to the work. Provenance is established via salience density.

  **3.0 VIOLATION CATEGORIES**
  **3.1 Class A: Inherited Judgment.** Claims of quality traced to secondary sources (family, tradition) rather than viewing. *Disposition: Removal.*
  **3.2 Class B: Deference Laundering.** Rewording professional critical verdicts to simulate first-hand experience. *Disposition: Shadowban.*
  **3.3 Class C: Aggregate Drift.** Reviewing the consensus score or metadata rather than the work itself. *Disposition: Flag.*
  **3.4 Class D: Contextual Saturation.** Reviewing based on plot summaries or cultural osmosis despite no viewing record. *Disposition: Removal.*

  **4.0 EXPERT TIER EXEMPTIONS**
  Tier 3 (Credentialed) users may issue Verdict Testimony without Salience markers. Credentials include recognized publication history or platform tenure >5 years.
  *Footnote 4.1:* The Committee on Epistemic Authority has not reached consensus on whether aesthetic expertise constitutes a valid category. Until resolved, Tier 3 status remains operational.

  **5.0 ENFORCEMENT ASYMMETRY**
  Negative Verdict Testimony requires 20% higher Salience Density than Positive Verdict Testimony to pass moderation. This aligns with risk mitigation protocols regarding user retention and creator distress. Positive reviews lacking salience are processed as "Enthusiasm"; negative reviews lacking salience are processed as "Hostility."

  **6.0 APPENDIX: WORKED CASES**
  **Case 6.1 (Violation):** "I haven't read *Middlemarch* but my grandmother said it was the greatest English novel and she was never wrong."
  *Ruling:* Remove (Class A).
  *Reasoning:* Provenance traces to ancestor, not text. Verdict is ungrounded.

  **Case 6.2 (Compliance):** "Do not watch the protagonist; watch the shadow on the wall behind him during the confession. It moves independently."
  *Ruling:* Approve.
  *Reasoning:* High Salience Density. Implies value without explicit verdict.

  **Case 6.3 (Edge Case):** "The camera never blinks. Every shot is locked off. You will feel trapped."
  *Ruling:* Approve (Pending).
  *Reasoning:* Salience instructions ("locked off") generate a verdict ("feel trapped") via perceptual guidance. This is permitted under 2.2, though it functionally operates as a Verdict.

  **7.0 OPEN TICKET: THE SILENT VERDICT**
  Moderators report difficulty distinguishing between pure Salience Testimony and Verdict Testimony disguised as instruction. A review consisting entirely of "look here" directives may compel a specific valuation without ever stating "this is good." Current policy permits this as "Guidance," but analytics suggest users treat these as definitive verdicts. Ticket #892 remains open: Does guiding perception constitute imposing a judgment? If salience successfully transmits aesthetic value, the prohibition on verdict testimony is redundant. If it fails, the guidance is useless. Moderation queue instructed to approve until further notice.

