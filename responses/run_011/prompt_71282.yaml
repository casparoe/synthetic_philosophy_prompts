answer: |-
  STRATEGY C3, OF MATRIX CITY, AGED INDETERMINATE

  Strategy C3, a pure strategy of the Normal Form household, passed away peacefully following a rigorous procedure of iterated elimination. He was aged indeterminate, having existed as long as the payoff matrix remained unchanged. The cause of death was strict dominance, administered not by a single rival, but by a weighted combination of his own siblings.

  For years, the deceased hung around being merely weakly annoying, surviving initial rounds of scrutiny without distinction. His end came finally not by any single pure strategy, but by a mixture of two of his own siblings, Strategies A1 and B2. Neither sibling alone could best him, yielding superior returns in some scenarios but not others. However, when blended in specific proportion, the mixture yielded returns uniformly better than C3 across all contingencies. It was a quiet execution, mathematically sound, leaving no room for appeal.

  He is predeceased by his cousin, Strategy W1, who succumbed to weak dominance last season. He is survived by his player, Player I, who remains active in the game, and by the surviving set of strategies, much reduced but still contentious.

  The family found comfort in the fact that the order of the procession was mercifully irrelevant. It makes no difference who was carried out first; the final set of mourners remained invariant. This stood in pointed contrast with the service held across town for the weakly dominated, where nobody can agree on the order and the guest list comes out different depending on who goes first. There, the atmosphere remains fraught with path dependence. Here, there was only stability.

  The family has asked the paper not to dwell on the fact that the deceased will never be played with positive probability at any Nash equilibrium. It is a sensitive subject. Compounding the tension, a weakly dominated cousin who *is* part of an equilibrium sent a lavish arrangement of lilies. Everyone has feelings about it.

  Whether this death was justified depends on how many players were at the table. In a two-player game, strictly dominated means it was never a best response to anything anybody could believe, and the death is unanswerable. But this game had three players. The family insists the deceased was a perfectly sensible choice for anyone who didn't suppose the other two were coordinating. The coroner can only say the death certificate required letting them coordinate. The asymmetry hangs heavy in the room. To the two-player mind, he was dead weight. To the three-player heart, he was a victim of assumed collusion.

  In lieu of flowers, the family requests donations be made to the Common Knowledge of Rationality Fund. None of this would have happened unless everyone present knew everyone was rational, and knew that they knew, and so on forever. It is an assumption nobody at the service could actually vouch for. The surviving set, though much reduced, still hasn't settled on a single outcome, so the funeral was in a sense only preparatory. Mourners are advised to remain ready for further refinement.
