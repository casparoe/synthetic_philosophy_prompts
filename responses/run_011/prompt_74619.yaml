      *   *6. Rejection of Floor:* Rejects guaranteed minimum. It's not responsibility-sensitive, transfers prudent to imprudent, not egalitarian. (Hardens 1 & 2 against 5).
      *   *7. Value of Equality:* Pluralist. Equality is intrinsically valuable even if it makes everyone worse off (levelling down), though doesn't settle action. (Meta-ethical claim).
      *   *8. Determinism:* Compatibilist. Choice is about weighing reasons, not uncaused causation. (Defends 1 & 2 against metaphysical objections).

