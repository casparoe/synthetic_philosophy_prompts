      *   *Claim 1 ("Imagined" = "Made up"):* Misrepresentation. Anderson means "imagined" as in mentally constructed, not "false" or "fake." Members will never know most fellow-members, yet in their minds lives the image of their communion. It doesn't mean fabricated in a deceitful sense.
      *   *Claim 2 (Pre-print = no larger belonging):* Simplification/Exaggeration. Anderson argues print capitalism was crucial for *modern* nationalism, but pre-modern polities (religious communities, dynastic realms) existed. People had identities, just not *national* ones in the modern sense. Saying they had "no sense of belonging to anything larger" is too strong.
      *   *Claim 3 (Elites turned audience into nation):* Simplification. Anderson emphasizes the structural effect of print capitalism (fixed languages, shared time) more than elite conspiracy, though elites certainly used it. Hobsbawm focuses more on elites engineering tradition.
