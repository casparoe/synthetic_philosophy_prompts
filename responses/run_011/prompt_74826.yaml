answer: |-
  1. **Candidate Jobs for the Primary Norm**

  We must distinguish the work done by the norm constituting the act from the norm governing the decision to perform it. Consider these candidate jobs for the primary norm:
  *   **Constituting the practice:** Defines what counts as an assertion rather than a guess or conjecture. *Secondary norm cannot discharge this;* practical rationality presupposes the act type.
  *   **Setting a standard of correctness:** Determines whether the assertion succeeded qua assertion. *Secondary norm cannot discharge this;* rationality concerns the agent, not the act's fit with the world.
  *   **Licensing audience challenge:** Grounds the audience's right to demand warrants. *Secondary norm could partially discharge this,* but challenges typically target truth/knowledge, not the speaker's rationality.
  *   **Determining retraction:** Specifies when an assertion must be withdrawn. *Secondary norm cannot fully discharge this;* one may be rational yet owe a retraction if false/unknown.
  *   **Generating blame:** Determines epistemic culpability. *Secondary norm could discharge this;* blame often tracks violation of rational decision procedures rather than constitutive norms.

  2. **The Structural Worry: Guidance vs. Constitution**

  If we supplement the Truth Norm (TN) and Knowledge Norm (KN) with a secondary norm (SN) commanding speakers to assert only what their total evidence supports, do the packages give different advice? In almost all ordinary cases, no. If your evidence supports $p$, you likely satisfy the SN. If $p$ is true, TN is satisfied; if you know $p$, KN is satisfied. Since evidence generally tracks truth and knowledge, the SN filters out assertions that would violate the TN or KN anyway.

  This generates the structural worry: if the SN handles all *guidance* (what ought I to say?), what work remains for the primary norm? If the answer is "none," the primary norm is merely bookkeeping—a label for success conditions that never guide action. However, there is a substantive residue. The primary norm explains the *point* of the practice and the status of the assertion post-facto. The SN tells you how to decide; the primary norm tells you what you achieved. Without the primary norm, we cannot distinguish a lucky guess (rational, true) from a successful assertion (known, true). The primary norm sustains the distinction between *justified action* and *successful performance*. It explains why we challenge assertions even when the speaker was rational: we are testing the primary norm, not the secondary one.

  3. **Cases A and B: Verdicts**

  **Case A (Guess):** Ada guesses Room 3 is free (True, No Evidence, No Belief).
  **Case B (Misleading HOE):** Bea reads instrument (True, Evidence Supports, Belief).

  | Verdict | Case A: Truth Norm | Case A: Belief Norm | Case A: Knowledge Norm |
  | :--- | :--- | :--- | :--- |
  | **Correct?** | Yes (True) | No (No Belief) | No (No Knowledge) |
  | **Permissible?** | No (Violates SN) | No (Violates SN) | No (Violates SN) |
  | **Blameless?** | Yes (Duress) | Yes (Duress) | Yes (Duress) |
  | **Retraction/Challenge?** | Challenge Legitimate | Retraction Owed | Retraction Owed |

  | Verdict | Case B: Truth Norm | Case B: Belief Norm | Case B: Knowledge Norm |
  | :--- | :--- | :--- | :--- |
  | **Correct?** | Yes (True) | Yes (Belief) | Depends (See Part 4) |
  | **Permissible?** | Yes (SN Met) | Yes (SN Met) | Yes (SN Met) |
  | **Blameless?** | Yes | Yes | Yes |
  | **Retraction/Challenge?** | Challenge Illegitimate | Challenge Illegitimate | Depends (See Part 4) |

  **Divergences and Costs:**
  In Case A, TN diverges from BN and KN on correctness. TN respects the intuition that Ada got it right; BN/KN respect the intuition that guessing is not asserting. The cost for TN is admitting lucky guesses are correct assertions. The cost for BN/KN is treating true guesses as failures.
  In Case B, all norms agree on permissibility (via SN). Divergence arises only if KN deems Bea incorrect. If KN deems it incorrect, it respects the intuition that misleading evidence undermines knowledge. The cost is that Bea is impermissible to assert (if KN is primary) or correct but unknowing (if KN is primary but SN overrides). Here, SN ensures permissibility aligns across norms, isolating the disagreement to correctness.

  4. **Case B Readings and the Structural Question**

  Consider the two readings of Bea's epistemic state.
  *Reading 1 (Knowledge Survives):* Bea knows. TN and KN align on correctness (Yes) and challenge (Illegitimate). The structural worry intensifies: if TN and KN yield identical verdicts on correctness, permissibility, and blame when supplemented by SN, are they distinct norms? They differ only in Gettier/lottery cases not present here.
  *Reading 2 (Knowledge Defeated):* Bea does not know. TN says Correct; KN says Incorrect. Both say Permissible (via SN).

  Does this change the structural question from Part 2? No, it merely relocates it. The structural worry asks whether the primary norm guides action. In both readings, the SN guides action (Permissible). The primary norm only judges the outcome. Reading 2 highlights that KN and TN can come apart on *correctness* while agreeing on *permission*. This confirms the division of labour: SN handles the decision; Primary Norm handles the evaluation. The worry remains whether a norm that never guides action is truly a *norm of assertion* or merely a norm of *success*. If KN says "Incorrect" but "Permissible," the norm loses its grip on the speaker's deliberation, becoming a retrospective label.

  5. **Conclusion: Objection Status and Contestable Steps**

  Is this structural worry a genuine objection to the Truth Norm, or does it threaten the Knowledge Norm equally? It threatens any primary norm that comes apart from rational assertibility. If the SN (assert on evidence) always dictates permission, the primary norm is demoted to a success condition. However, the Knowledge Norm partisan may argue that the SN *just is* the Knowledge Norm (you cannot have evidence without knowledge), collapsing the distinction. The Truth Norm partisan argues that TN captures the constitutive aim better, even if it rarely guides directly.

  This worry is not fatal to TN alone; it strikes any view separating constitutive norms from decision procedures. However, it pressures KN more if KN claims to be the *only* norm. If KN must be supplemented by an evidence-based SN to avoid forbidding rational assertions (like Bea's), KN loses its claim to exclusivity.

  **Contestable Steps:**
  1.  **The Independence of SN:** I assumed the secondary norm is evidence-based and distinct from the primary norm. A KN partisan may contest this, arguing knowledge is the only proper basis for assertion, making SN redundant or identical to KN.
  2.  **Correctness vs. Retraction:** I assumed correctness dictates retraction. A TN partisan might argue retraction is owed only if the assertion was improper (violating SN), not merely if it was untrue (luck). This would blur the division of labour.
  3.  **Guidance as Essential:** I assumed a norm must guide action to be substantive. A constitutive theorist might contest this, arguing norms define kinds rather than guide choices, like the rules of chess defining checkmate rather than telling you which move to make.

  The structural worry reveals that without a tight link between primary and secondary norms, the primary norm risks becoming inert. Whether this inertness is a bug or a feature depends on whether you view assertion as a tool for knowledge transmission or a move in a game defined by truth.
