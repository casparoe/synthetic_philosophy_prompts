answer: |-
  Here is the decision tree built around your **Reader-Dependence vs. Writer-History** axis, using the specific biological cases you provided as the decision nodes.

  ### The Decision Tree

  **Start:** You are perfectly happy writing "the genetic code" in a paper.

  **Node 1 (The Axis): The Dead Language Message**
  You find a DNA sequence from an extinct lineage. No living organism possesses the machinery to translate it. Is it still a "code"?
  *   **No:** Meaning requires a current interpreter. (**Go Left: Reader-Dependence**)
  *   **Yes:** Meaning is intrinsic to the sequence's origin/structure. (**Go Right: Writer-History**)

  ---

  #### **Left Branch (Reader-Dependence)**

  **Node 2: The Riboswitch**
  An RNA molecule changes shape when binding a metabolite. There is no ribosome, no translation table, just direct chemical affinity. Is the RNA "reading a code"?
  *   **No:** Only arbitrary symbol translation counts; this is just chemistry.
      *   **Leaf:** **Flat-out Deflationism** (e.g., Evelyn Fox Keller). "Code" is a metaphor for complex chemistry.
  *   **Yes:** Any causal correlation detected by a system counts as information. (**Go to Node 3**)

  **Node 3: The Mitochondrial Code**
  In mitochondria, UGA means Tryptophan. In the nucleus, UGA means Stop. Did the *code* change, or just the *context*?
  *   **The Code Changed:** The physical mapping defines the code.
      *   **Leaf:** **Causal/Difference-Making View** (e.g., Peter Godfrey-Smith). Information is defined by the specific causal correlation in the local system.
  *   **The Context Changed:** The abstract code is universal; the reader is just broken/variant.
      *   **Leaf:** **Deflationism (Soft)**. (You use the word "code" loosely, but ontologically you believe there is only one chemistry). *Note: This leaf is philosophically unstable.*

  ---

  #### **Right Branch (Writer-History)**

  **Node 4: The Virus**
  A virus injects its genome into a host. The host ribosomes read it. Was the viral DNA a "code" *before* it entered the host?
  *   **No:** It is only a code relative to the host's machinery.
      *   **Leaf:** **Teleosemantic View (Relational)**. (Contradicts Node 1 "Yes". *See Empty Cells below*).
  *   **Yes:** The virus evolved to be read; the history fixes the content. (**Go to Node 5**)

  **Node 5: The Junk DNA (Pseudogene)**
  A sequence has the evolutionary history of a gene but is now broken (transcribed, produces nothing functional). Is it still "coding DNA"?
  *   **No:** Content requires a selected *function*. A broken gene has no content.
      *   **Leaf:** **Teleosemantic View** (e.g., Ruth Millikan, David Papineau). Meaning is fixed by evolutionary selection history; no function, no meaning.
  *   **Yes:** It obeys the syntactic rules established by history. (**Go to Node 6**)

  **Node 6: The Lab Organism**
  You engineer an organism with a reassigned codon and an unnatural amino acid. It has no evolutionary history. Is this a "code"?
  *   **No:** Only natural selection can fix semantic content.
      *   **Leaf:** **Teleosemantic View (Strict)**. (Design cannot create meaning, only mimic it).
  *   **Yes:** Stipulated rules create a code immediately.
      *   **Leaf:** **Conventional-Sign View** (e.g., Marcello Barbieri). The code is a set of arbitrary conventions (syntax), whether evolved or designed.

  ---

  ### The Grid: Positions and Empty Cells

  Mapping the leaves onto your **Reader vs. History** axis reveals the philosophical landscape.

  | Position | Reader/History | Function Required? | Arbitrariness Required? |
  | :--- | :--- | :--- | :--- |
  | **Deflationism** | Reader | N/A (It's chemistry) | No |
  | **Causal/Difference** | Reader | No (Correlation is enough) | No |
  | **Teleosemantic** | History | **Yes** (Selected Effect) | No (Link can be causal) |
  | **Conventional-Sign** | History | No (Syntax is enough) | **Yes** (Mapping must be arbitrary) |

  #### **Empty Cells (And Why They Are Empty)**

  1.  **The "History but Reader-Defined Virus" Cell (Node 4, No):**
      *   *Combination:* You say Dead Language is Code (History), but Viral DNA is not Code until Host reads it (Reader).
      *   *Why Empty:* **Incoherent.** If the status of "code" depends on the history/origin (Node 1 Yes), you cannot consistently claim the Virus genome lacks code status until a reader interacts with it. This collapses back into Reader-Dependence.
  2.  **The "Syntax without Arbitrariness" Cell (Node 6, No + Node 5, Yes):**
      *   *Combination:* You say Junk DNA is Code (Syntax counts), but Lab DNA is Not Code (Design doesn't count).
      *   *Why Empty:* **Unattractive.** If syntactic rule-following is sufficient for natural DNA (Junk), there is no principled reason to deny it for designed DNA (Lab). This position requires a mystical distinction between "evolution" and "design" that most biologists reject.
  3.  **The "Strict Deflationist" Cell (Node 2, No + Node 3, Code Changed):**
      *   *Combination:* Riboswitches aren't code (chemistry), but Mitochondrial variants imply the Code itself changed.
      *   *Why Empty:* **Unthought.** If you deny the Riboswitch is code because it's "just chemistry," you must admit the Mitochondrial variant is also "just chemistry." Claiming the *Code* changed implies an abstract entity exists, which contradicts the hard Deflationist stance.

  #### **Indistinguishable Leaves**

  **Teleosemantic (Node 5, No) vs. Teleosemantic Strict (Node 6, No).**
  *   **Why:** Both positions rely on *selected effect* to ground meaning. The distinction between "natural selection broke this gene" (Junk) and "engineers designed this gene" (Lab) collapses if you believe design cannot create semantics. In practice, a Teleosemanticist usually answers "No" to both, making these two leaves the same position reached via different questions. The tree separates them to test consistency, but philosophically they occupy the same spot.

  ---

  ### The Verdict

  **The Position:** **Teleosemantic View.**
  **The Axis:** **Writer-History.**

  **Why:**
  The Reader-Dependence view (Left Branch) fails the **Dead Language** test. If DNA found on Mars had the exact structure of Earth DNA but no Martians to read it, we would still call it a code. The potential for meaning is baked into the history of the sequence, not the whim of the current reader.

  However, the **Conventional-Sign** view (Right Branch, Node 5 Yes) is too permissive. It grants "code" status to **Junk DNA** simply because it follows syntactic rules. This dilutes the concept of information. A pseudogene is a *record* of a code, not an active message. Information requires a function to be *about* something. Therefore, the mapping counts as a code in virtue of the **history that fixed the mapping for a purpose**.

  **Who Won Dinner:**
  **You did** (assuming you argued for History/Function).
  Your friend argued for Reader-Dependence (likely Causal or Deflationist). They got stuck on the **Mitochondrial** and **Riboswitch** cases, conflating "mechanism of reading" with "definition of code." By anchoring the code in evolutionary history (Teleosemantics), you preserve the intuition that DNA is a message even when silent, without falling into the trap of calling every chemical interaction "information." The History axis is the only one that survives the **Virus** test (the virus brings the code; the host provides the reader).
