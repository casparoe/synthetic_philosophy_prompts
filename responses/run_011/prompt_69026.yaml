      *   *Break 1 (Critical):* The "Teacher" (RM) is trained on data generated by the "Student" (Policy) or derived from the "Answer Key" (Outcome). In the analogy, the teacher is an independent human expert. In AI, the teacher is often a distilled version of the student or trained on outcome-labeled data.
      *   *Break 2 (Critical):* Transparency. A student's handwriting *is* the process. An LLM's CoT is just more tokens. The "computation" happens in the weights, not necessarily the text. The text can be deceptive (sycophancy, sandbagging).
