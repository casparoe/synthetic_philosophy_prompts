      *   *(b) Label Leakage:* If step rewards are generated by checking if the final answer was right (outcome supervision used to train process supervision), then the Process RM inherits the blindness of Outcome Supervision. It learns "steps that look like steps in successful trajectories" rather than "steps that are logically valid." This is the "Process Reward Model trained on Outcome Labels" problem.

