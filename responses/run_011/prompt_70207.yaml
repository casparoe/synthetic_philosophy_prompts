answer: |-
  1. **Purpose and Scope**

  The rule is for a private foundation board making high-stakes, irreversible grant decisions with a fixed endowment. It must guide single choices within a charter, accommodating divergent risk attitudes without collapsing them into disputes over facts or values. Candidates are formal decision theories mapping probabilities and outcomes to choices. I am setting aside psychological descriptions of how people actually choose, macroeconomic theories of market equilibrium, and political theories of board governance. The focus is strictly on normative rationality: what rule *should* a deliberative institution adopt to justify its choices as rational, given the split between maximizing expected impact, avoiding ruin, and seeking transformative outliers. The theory must be actionable with limited data and robust enough to survive internal disagreement about the weight of risk itself. It must function as a governance tool, not merely a philosophical exercise, ensuring that the foundation's capital is deployed according to a consistent logic that stakeholders can audit.

  2. **The Requirements**

  1.  **Portfolio Integrability.** The rule must specify whether a grant is evaluated alone or as part of the endowment's total risk exposure. *Motivation:* Consider a grant that offers a high return but correlates perfectly with the foundation's existing holdings. Evaluated in isolation, it looks attractive; evaluated as part of the portfolio, it concentrates risk dangerously. Since the board may not know the full covariance of all assets, the rule must function even when the larger portfolio is vaguely known. *Exclusions:* This excludes theories requiring precise knowledge of all existing assets and their correlations before any single decision can be made. *Label:* Non-negotiable. A rule that crashes when portfolio data is incomplete is useless for irreversible commitments.

  2.  **Dynamic Consistency.** The rule must prevent exploitation across a known sequence of choices. *Motivation:* Imagine the board faces ten similar grant opportunities over a decade. A rule might approve each individually but lead to ruin when all ten are taken together. Worse, a clever actor could construct a "money pump," offering trades that the board accepts sequentially based on the rule, ending up with less money and the same assets than where they started. *Exclusions:* This excludes rules where preferences change based on sunk costs or the framing of the decision node within a timeline. *Label:* Non-negotiable. Institutional rationality requires that plans made today are not contradicted by the same rule tomorrow.

  3.  **State-by-State Dominance.** If option A yields better outcomes than option B in every possible state of the world, the rule must prefer A. *Motivation:* Suppose Grant A saves ten lives whether a trial succeeds or fails, while Grant B saves ten lives if it succeeds and zero if it fails. If the trial succeeds, they are equal; if it fails, A is better. Choosing B is indefensible. *Exclusions:* This excludes theories that weight probabilities by their rank or outcome magnitude in ways that reverse this ordering, such as some forms of rank-dependent utility. *Label:* Non-negotiable. Violating dominance makes the board vulnerable to charges of irrationality or incompetence.

  4.  **Structural Distinctness.** The rule must distinguish risk attitude from the value of outcomes. *Motivation:* The board disagrees on risk, not on how much a life is worth. One member wants to maximize expected lives; another fears ruin. In standard theory, risk aversion is modeled by curving the utility function. If risk is merely utility curvature, the maximizer wins by defining utility linearly. Risk must be a separate parameter to capture the cautious member's view that the arithmetic itself is flawed. *Exclusions:* This excludes standard expected utility theory where risk aversion is solely a property of the utility function over outcomes. *Label:* Negotiable but expensive. Accepting this forces you into non-standard theories that carry other mathematical costs.

  5.  **Ambiguity Sensitivity.** The rule must handle contested or imprecise probabilities. *Motivation:* Foundation grants often lack reliable data. A probability of success might be known only to lie between ten and fifty percent. A rule treating imprecise probabilities as precise averages may hide catastrophic tail risks. The cautious member argues that unknown probabilities are worse than known risks. *Exclusions:* This excludes theories requiring precise single-number probabilities for all events. *Label:* Negotiable but expensive. Handling ambiguity often requires sacrificing other properties, such as dominance or consistency.

  6.  **Empirical Adequacy.** The rule must reproduce standard financial intuitions where they work. *Motivation:* The endowment needs insurance and diversification. A rule that rejects all insurance premiums or forbids diversification is practically useless. If the rule implies the foundation should never pay to reduce variance in its operating budget, it fails the basic test of financial stewardship. *Exclusions:* Rules that imply never paying to reduce variance or always concentrating assets. *Label:* Non-negotiable. A theory of rational choice that contradicts established best practices in asset management is suspect.

  3. **Negotiable, Non-Negotiable, and Camp Taste**

  Dominance, Dynamic Consistency, and Empirical Adequacy are Non-Negotiable. These are the bedrock of institutional defensibility. If you violate dominance, you choose strictly worse outcomes. If you violate consistency, you are exploitable. If you violate empirical adequacy, you cannot manage an endowment. Portfolio Integrability is also Non-Negotiable for practical reasons; you cannot wait for perfect data to make irreversible grants.

  Structural Distinctness and Ambiguity Sensitivity are the true points of contention, often misfiled as non-negotiable by the cautious camp. They are actually "Camp Taste." The maximizer argues that risk attitude *should* be captured by utility curvature (denying Distinctness) and that unknown probabilities should be averaged (denying Ambiguity Sensitivity). The cautious member demands these as separate parameters. Accepting them is expensive because it forces the theory into complex formalisms that often break the Non-Negotiables. I defend labeling Distinctness as negotiable because standard economics subsumes risk into utility. However, for this board, surrendering it means the cautious member's view is mathematically silenced, which defeats the purpose of the charter. Thus, while theoretically negotiable, it is politically essential.

  4. **The Unsatisfiable Subset**

  Your suspicion is well-founded, though the precise conflict requires careful untangling. You proposed that a theory treating risk as a third parameter (distinct from belief and desire) cannot simultaneously be applied to a decision in isolation, remain immune to a money pump across a sequence, and honor state-by-state dominance. This is correct.

  The core tension lies between **Structural Distinctness** (risk as a third parameter), **Dynamic Consistency**, and **Portfolio Integrability** (Isolation). When risk is a third parameter, as in risk-weighted models, the value of a gamble depends on the global structure of the probability distribution, not just the sum of individual branches. To evaluate the risk correctly, you must know the context—the other risks you are taking. This violates **Portfolio Integrability** (Isolation). You cannot evaluate a single grant without knowing the rest of the portfolio.

  If you force the rule to apply in **Isolation** anyway, you become **Dynamically Inconsistent**. Because the rule evaluates the whole gamble, your preference for a sub-gamble changes depending on whether you view it alone or as part of a sequence. This opens you to the money pump: an actor can offer you a sequence of trades that look good individually under your isolated rule but leave you worse off overall. To fix this, you must plan the whole sequence globally, which again violates **Isolation**.

  Furthermore, many theories that introduce risk as a third parameter (weighting probabilities by rank) inevitably violate **State-by-State Dominance**. If you weight a high probability less because it is "too safe," you might reject an option that is strictly better in every state.

  Therefore, the unsatisfiable subset is: **Structural Distinctness + Dynamic Consistency + Portfolio Integrability (Isolation)**. You cannot have a separate risk parameter, apply it to single decisions without knowing the whole portfolio, and remain immune to sequential exploitation.

  The cheapest member to surrender is **Portfolio Integrability (Isolation)**. The cost is high: the board cannot write a rule for "a grant" but must write a rule for "a grant policy." You must evaluate decisions as part of a broader strategy, not one-off events. The resulting theory is still recognizable as the one you wanted—a risk-sensitive institutional rule—but it requires more governance overhead. You cannot simply vote on grants; you must vote on portfolios of grants. If you refuse this, you must surrender **Structural Distinctness**, collapsing risk back into utility curvature, which silences the cautious member's philosophical objection.

  5. **The Most Exclusionary Requirement**

  **State-by-State Dominance** is the most exclusionary requirement. It eliminates the largest number of candidate rules, particularly those designed to handle ambiguity or heavy risk-weighting. Many models that allow for "caution" regarding unknown probabilities or tail risks do so by violating dominance; they prefer a safer option even if a riskier option offers slightly better outcomes in every state, purely because the riskier option's probabilities are less certain or more skewed.

  Should this make you distrust the requirement? No. While theoretically interesting, violating dominance is practically indefensible for a fiduciary institution. If a donor or beneficiary asks why you chose an option that yields fewer lives saved in every possible scenario, "because of our risk weighting" is not a valid excuse. It exposes the foundation to liability and reputational ruin. Therefore, while Dominance kills the most sophisticated theories of caution, it is the necessary price of public accountability. You must accept that some forms of extreme caution are irrational by definition.

  6. **The Contenders Against the List**

  **Expected Utility (EU) with Concave Utility:** This theory passes Dynamic Consistency, Dominance, and Empirical Adequacy easily. It handles Portfolio Integrability well because it is additive. However, it fails **Structural Distinctness**. It treats the cautious member's concern as merely a different valuation of lives (diminishing marginal utility). If the board agrees lives are linear, EU forces them to be risk-neutral. It also struggles with **Ambiguity Sensitivity**, treating imprecise probabilities as precise averages. It is the safest choice for consistency but fails to capture the board's specific disagreement.

  **Risk-Weighted Expected Utility (RWEU):** This theory passes **Structural Distinctness** by adding a risk function that weights probabilities. It satisfies the cautious member's desire to treat risk as separate from value. However, it typically fails **Dynamic Consistency** if applied myopically (in isolation) and often violates **State-by-State Dominance** in edge cases where probability weighting reverses preferences. It requires the board to surrender Isolation, evaluating grants only as part of a policy. It is the best fit for the board's psychology but the hardest to govern.

  **Maximin or Ambiguity-Sensitive Rules:** These rules focus on the worst-case scenario. They pass **Ambiguity Sensitivity** and appeal to the cautious member. However, they fail **Empirical Adequacy** (they often reject insurance or diversification) and frequently violate **Dominance**. They are too conservative for a foundation that must spend down or generate returns. They are useful as a stress test but poor as a primary decision rule.
