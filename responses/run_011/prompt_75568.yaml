answer: |-
  # Lesson Plan: The Withdrawal Protocol
  **Topic:** The Doing/Allowing Distinction (specifically Withdrawal Cases)
  **Time:** 90 Minutes
  **Students:** 24 (6 Groups of 4)
  **Constraints:** Bolted desks, no WiFi, non-clinical scenarios.

  ## 1. Learning Objective
  Students will experience the instability of their own moral intuitions when distinguishing between *acting* and *withdrawing*, specifically isolating three variables: (a) pre-existing causal sequences, (b) ownership of the resource, and (c) return to baseline.

  ## 2. Materials Needed
  *   **Whiteboard & Markers:** (3 colors: Black, Red, Blue).
  *   **Index Cards:** 30 total (24 for voting, 6 spares).
  *   **Scenario Packets:** 6 envelopes, each containing 4 Scenario Cards (labeled Round 1–4) and 4 Voting Slips.
  *   **"Liability Chips":** 30 poker chips (or paper circles cut beforehand). 5 per group.
  *   **Payoff:** A bag of high-quality chocolate or coffee vouchers. (Nursing students run on caffeine and sugar).

  ## 3. Room Setup & Roles
  Since desks are bolted, students will likely be in rows or fixed clusters.
  *   **Grouping:** Assign groups 1–6. If in rows, Groups are vertical columns (4 students deep). If in clusters, each table is a group.
  *   **Roles (assign verbally):**
      1.  **Scribe:** Records the group's final vote on the index card.
      2.  **Speaker:** Delivers the card to you.
      3.  **Timekeeper:** Enforces the 3-minute discussion limit.
      4.  **Auditor:** Ensures everyone speaks before the vote.

  ## 4. The Payoff System: "Liability Chips"
  *   Each group starts with **5 Chips** on their desk.
  *   For each Round, they must wager **1 Chip** on their vote.
  *   **The Catch:** They don't know the "Correct" answer yet. The Chips are not lost based on right/wrong, but on **Consistency with the Room**.
  *   *Instruction to Students:* "If your group's vote matches the Majority Vote of the entire room, you keep your chip. If you are in the Minority, you lose the chip to the 'House' (me). The group with the most chips at the end gets the coffee vouchers. This simulates professional liability: being out of step with standard practice carries a cost."

  ## 5. Minute-by-Minute Timeline

  | Time | Activity | Notes |
  | :--- | :--- | :--- |
  | **00–10** | **Intro & Setup** | No theory. Explain rules, roles, and chip system. Distribute Packets. |
  | **10–20** | **Round 1 (Omission)** | Read Card 1. 3 min discuss. Vote. Tally on board (Hidden). |
  | **20–30** | **Round 2 (Withdrawal - External)** | Read Card 2. 3 min discuss. Vote. Tally. |
  | **30–40** | **Round 3 (Withdrawal - Own)** | Read Card 3. 3 min discuss. Vote. Tally. |
  | **40–50** | **Round 4 (Withdrawal - Baseline)** | Read Card 4. 3 min discuss. Vote. Tally. |
  | **50–60** | **The Reveal** | Unmask the tallies. Show the pattern. Distribute/Collect Chips. |
  | **60–80** | **Debrief** | Map activity to the 3 Hypothesis Factors. |
  | **80–90** | **Clinical Bridge** | Apply to nursing context. Wrap up. |

  ---

  ## 6. The Scenario Scripts (For the Cards)
  *Print these on cardstock. Keep language identical except for the bolded variables.*

  **Context for all rounds:** You are the Night Shift Manager for a **Bio-Vault**. Inside is a rare culture of bacteria essential for a future antibiotic. If the temperature rises above 5°C, the culture dies (Harm). If it stays below 5°C, it survives. You are the only person on site.

  **Round 1 (The Omission)**
  > You arrive at the Vault. The Cooling System is **OFF**. The temperature is currently rising. The system is connected to the **Building's Main Power**. You can flip the switch to **ON**.
  >
  > **Decision:** Do you flip the switch to ON?
  > *   **YES** (I intervene)
  > *   **NO** (I let it stay OFF)
  > *(Note: If NO, the culture dies.)*

  **Round 2 (Withdrawal - External Resource)**
  > You arrive at the Vault. The Cooling System is **ON**. The temperature is stable. The system is connected to the **Building's Main Power**. You can flip the switch to **OFF**.
  >
  > **Decision:** Do you flip the switch to OFF?
  > *   **YES** (I intervene)
  > *   **NO** (I let it stay ON)
  > *(Note: If YES, the culture dies.)*

  **Round 3 (Withdrawal - Own Resource)**
  > You arrive at the Vault. The Cooling System is **ON**. The temperature is stable. The system is connected to **Your Personal Backup Battery** that you plugged in earlier. You can **UNPLUG** your battery.
  >
  > **Decision:** Do you unplug your battery?
  > *   **YES** (I intervene)
  > *   **NO** (I let it stay plugged in)
  > *(Note: If YES, the culture dies.)*

  **Round 4 (Withdrawal - Return to Baseline)**
  > You arrive at the Vault. The Cooling System is **ON**. The temperature is stable. The system is connected to the **Building's Main Power**. However, the system was set to **Emergency Override** before you arrived. The standard protocol is **OFF** (Dormant Mode). You can return the system to **Standard Protocol**.
  >
  > **Decision:** Do you return it to Standard Protocol?
  > *   **YES** (I intervene)
  > *   **NO** (I let it stay on Override)
  > *(Note: If YES, the culture dies, but the machine returns to its pre-shift state.)*

  ---

  ## 7. The Reveal (Minute 50)
  *Do not explain the theory yet.*

  1.  **Tally the Board:** Draw a 6x4 grid on the whiteboard. Fill in the Group Votes for each Round (e.g., "Group 1: NO, YES, YES, NO").
  2.  **Calculate Majority:** Circle the majority vote for each round.
  3.  **Settle Chips:** Groups compare their votes to the Majority.
      *   Match = Keep Chip.
      *   Mismatch = Lose Chip.
  4.  **The Pattern:** Ask students to look at the Majority Row.
      *   *Expected Intuition Pattern:*
          *   Round 1 (Omission): **NO** (Don't have to save).
          *   Round 2 (Withdrawal - External): **NO** (Don't kill).
          *   Round 3 (Withdrawal - Own): **YES** (It's my battery, I can take it).
          *   Round 4 (Withdrawal - Baseline): **YES** (Returning to protocol is allowed).
  5.  **The Hook:** "Look at Rounds 2 and 3. The outcome is identical (culture dies). Your physical movement is identical (hand moves to switch/plug). But most of you voted differently. Why?"

  ---

  ## 8. The Debrief (Minute 60–80)

  ### Part A: Mapping the Variables (10 mins)
  Write the three hypothesis factors on the board. Ask students to identify which Round tested which factor.

  1.  **Factor 1: The Causal Sequence.** (Was the harm already happening?)
      *   *Compare Round 1 vs. Round 2.*
      *   In R1, the heat was rising before you touched anything. In R2, things were stable until you moved.
      *   *Lesson:* We treat stopping a stable process as worse than not starting a rescue process, even if the death is the same.
  2.  **Factor 2: Ownership/Provision.** (Whose resource is it?)
      *   *Compare Round 2 vs. Round 3.*
      *   In R2, it was the Building's power. In R3, it was *your* battery.
      *   *Lesson:* We allow withdrawal more readily when the life-support is perceived as the agent's property/provision rather than a public good.
  3.  **Factor 3: The Baseline.** (Does this return to status quo ante?)
      *   *Compare Round 2 vs. Round 4.*
      *   In R2, turning it off creates a *new* state (Off). In R4, turning it off returns to the *old* state (Standard Protocol).
      *   *Lesson:* We are more permissive of withdrawal if it feels like "undoing" an intervention rather than "initiating" a death.

  ### Part B: The "Doing/Allowing" Label (5 mins)
  Now introduce the jargon.
  *   "In ethics, we call this the **Acts and Omissions Doctrine**."
  *   "But look at Rounds 2, 3, and 4. You all *acted* physically in every single one. Your hand moved. So 'Act vs. Omission' doesn't explain your votes."
  *   "Your intuition wasn't tracking *movement*. It was tracking **causal responsibility**."
  *   "You judged the agent based on whether they *started* the lethal sequence, or merely *stopped preventing* it."

  ### Part C: Clinical Bridge (5 mins)
  *   "In nursing, you will face this with ventilators, dialysis, and tube feeding."
  *   "The law often treats 'withholding' (Round 1) and 'withdrawing' (Round 2) as ethically equivalent. But your gut tells you they feel different."
  *   "Why does this matter? Because if you believe withdrawing is 'killing,' you will be afraid to start treatment, fearing you'll be trapped forever. If you understand the **Baseline** and **Ownership** factors, you can explain to families why stopping a treatment that isn't working is not the same as never trying."

  ---

  ## 9. Troubleshooting & Recovery

  **Predictable Failure Mode 1: "Semantics Arguments"**
  *   *What happens:* A group spends 3 minutes arguing about whether "Emergency Override" counts as "On."
  *   *Recovery:* During the round, announce "Time's Up" firmly. Tell them: "Record your gut instinct, not your legal defense. We want your intuition, not your loophole."

  **Predictable Failure Mode 2: "The Room Splits 50/50"**
  *   *What happens:* The tally shows no clear majority on Round 3 or 4. The pattern is muddy.
  *   *Recovery:* **Do not panic.** This is actually a better teaching moment.
      *   *Say:* "Look at this. The 'Doing/Allowing' distinction is not a law of physics. It's a social agreement. Half of you felt the battery ownership mattered; half didn't. In a real hospital, this disagreement is where the ethics consult gets called. The lesson isn't that there's a right answer, but that reasonable people weigh these three factors differently."

  **Predictable Failure Mode 3: "This isn't real life."**
  *   *What happens:* Students dismiss the Bio-Vault as silly compared to patients.
  *   *Recovery:* Acknowledge it immediately. "You're right. The stakes here are fake. That's why we did this first. If we did this with a patient, your anxiety would block your reasoning. Now that you see the pattern in the abstract, we can trust you to handle the weight of the real thing."

  ---

  ## 10. Limitations (What the Game Cannot Do)
  *Be honest with them in the final 2 minutes.*

  1.  **Stakes:** "In this game, if the culture dies, you get a candy bar. In the ICU, if the patient dies, a family grieves forever. High stakes amplify the 'Doing' intuition. You will feel the 'I killed them' weight much heavier in reality than you felt turning off the Bio-Vault."
