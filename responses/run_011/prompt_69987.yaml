answer: |-
  The quarrel between Thomas Hobbes and John Wallis was not merely a spectacle of bruised egos, but a collision of incompatible philosophies. To understand why Hobbes, well into his eighties, continued to publish attempted squarings of the circle that mathematicians dismissed as nonsense, one must look past the errors to the system that produced them. Hobbes is committed to three claims that appear to contradict one another: that reasoning is nothing but computation with names; that geometry is the only genuine science because we create its objects; and that the new algebraic methods are empty symbol-shuffling. Reconciling these requires untangling Hobbes's specific vision of what it means to know something.

  The first problem concerns Hobbes's nominalism. For Hobbes, truth resides in propositions, not in the world. **Ratiocination**, or reasoning, is essentially calculation: the adding and subtracting of the consequences of names that we have stipulated. If reasoning is just manipulating marks, what distinguishes the geometer's legitimate computation from the algebraist's empty shuffling? Hobbes argues that while names are arbitrary, they must be tethered to clear conceptions. He famously noted that words are "counters for the wise, and ready money for fools." For the wise, the counter represents a specific idea; for the fool, it is just a token.

  The geometer's names stay tethered because they refer to mental images of generation. When a geometer names a circle, she conceives of a line drawn around a fixed point. The algebraist, by contrast, manipulates symbols like $x$ and $y$ according to rules, but often without a clear conception of the magnitude those symbols represent. The tether, therefore, is not an external reality hooking onto the name, but an internal psychological anchor: the thinker must be able to visualize the thing the name stands for. If the manipulation of symbols loses contact with that mental image, it becomes mere noise. Hobbes's nominalism allows for arbitrary naming, but it demands that the reasoning process never lose track of what those names were invented to signify.

  This leads to the second puzzle: why doesn't Hobbes's constructivism favor algebra? If science requires knowing the causes of things we make, and the algebraist stipulates symbols and rules to build results, isn't algebra the ultimate "made" science? Hobbes says no, because stipulating notation is not the same as generating a magnitude. For Hobbes, a proper definition must be causal; it must explain how the thing comes to be. In geometry, this requires **motion**. A circle is not defined by a static equation, but by the motion of a compass.

  Algebra, in Hobbes's view, treats quantities as static values to be solved, ignoring the kinematic process that creates them. It yields answers without revealing causes. The operative demand is therefore narrower than mere stipulation; it is genetic. One must know the recipe, not just the ingredients. This is where **resolution and composition**—the method of breaking concepts down into their universal parts and building them back up into demonstrations—must track the actual generation of the object. Algebra resolves equations, but it does not resolve the *cause* of the figure. It is a tool for finding answers, not a science of causes.

  Consequently, the dispute with Wallis is not merely about what counts as a proof, but about what mathematics is for. Hobbes's failures at classical construction problems are not simply incompetent mathematics; they are the predictable output of a coherent but idiosyncratic theory of knowledge. He insists on constructive proofs that show *how* a figure is drawn, rejecting analytic proofs that merely show *that* a relationship holds. His theory comes apart because it cannot govern the practice it purports to describe. Mathematics was expanding beyond the visible and the drawable into the abstract realm of relations. Hobbes's epistemology was built for a geometry of lines and motions, not a mathematics of functions and structures. He was playing chess while Wallis was playing Go; the rules of engagement were fundamentally different. Hobbes was not blind to calculation, but he was blind to the legitimacy of abstraction without visualization.

  The stakes of this error extend beyond mathematics. Hobbes's claim to have founded politics as a demonstrative science rests on the same criterion: we make the commonwealth through contract, so we can know its causes. If the criterion fails in mathematics, does it collapse in politics? There is a risk. If "making" does not guarantee scientific knowledge in geometry, the analogy weakens. However, Hobbes might argue that politics is actually more secure than geometry. In politics, the "motion" is human will and consent, which are internal to us. We do not need to visualize the state; we constitute it through our own agreements. The cause is not an abstract line, but a literal human act. Yet, if his mathematical method cannot distinguish valid reasoning from empty shuffling, his political deductions risk being viewed as similarly dogmatic—computation with names that lack a tether to human reality.

  Is there a live version of Hobbes's worry today? There is. Modern mathematics faces a growing divide between verification and explanation. With the rise of computer-assisted proofs, such as the solution to the Four Color Theorem, mathematicians can know a result is true without understanding why it holds. The computer verifies the computation, but the human mind loses the causal thread. Hobbes would have viewed this as the triumph of the fool's ready money: valid reasoning that fails to show why the result holds. His anxiety was not entirely misplaced; even in a age of advanced abstraction, the demand for understanding remains distinct from the guarantee of truth.
