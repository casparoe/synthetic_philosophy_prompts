  The kettle whistled, a sharp electric shriek that cut through the dampener of Maya's kitchen conversation. She poured the water over the tea bags, watching the steam rise.

  "Two kilowatt-hours," Maya said, handing Devon a mug. "That's what my household used extra yesterday. According to the grid model we read, that's one hundred-thousandth of a coal block. But here's the thing: the operator doesn't set the dispatch threshold based on a fixed number. They set it based on a forecast of yesterday's aggregate demand."

  Devon took the mug. "So if you save energy, the forecast drops."

  "Exactly. If I save two kilowatt-hours, the aggregate demand drops by two. The operator sees that drop and lowers the threshold by two to maintain the same reserve margin. The gap between demand and the trigger point stays constant. The probability of the coal firing remains unchanged. My sacrifice doesn't just fail to prevent harm; it disappears into the recalibration."

  "But the expected harm calculation still holds," Devon said, leaning against the counter. "Even if the probability is tiny, the harm is massive. Three hundred extra ER visits for asthma over the season per block. If there's a non-zero chance your act tips the scale, the expected utility is negative."

  "You're missing the feedback loop," Maya said. "In the standard model, your act moves the demand curve against a fixed threshold. Here, the threshold moves with the demand curve. The system re-equilibrates. The re-equilibration eats the individual effect faster than the individual can produce it. Causally, I am inert. If I make no difference to the outcome, how can I have a decisive reason to act?"

  "Because 'making a difference' isn't the only source of moral reasons," Devon said. "But let's push your model. If you save that energy, you lower the threshold. Even if *this* block runs today, you've lowered the baseline for tomorrow."

  "By two kilowatt-hours. It's noise."

  "Imagine everyone did what you did," Devon said. "If everyone acted on your reasoning, the aggregate demand would plummet. The threshold would drop enough to skip blocks entirely. The harm would vanish."

  Maya sighed. "We're past the first third of this conversation, Devon, so I'll allow the universalization test. But you know the reply. I'm not everyone. I'm one household in a grid of millions. My act doesn't cause everyone else to act. It's a hypothetical coalition, not a causal mechanism. If I freeze in the cold based on what a coalition *would* do, I suffer for a reality that won't exist."

  "But the principle survives," Devon insisted. "The fact that the collective action solves the problem shows the harm is connected to the type of act, even if the individual token feels inert."

  "Connected how? If the mechanism swallows my contribution, the connection is severed." Maya sat down. "Look, let's stop guessing about the grid. Let's stipulate."

  Devon nodded. "Agreed."

  "Fact one: A block is 240,000 kWh. Fact two: My usage is 2 kWh. Fact three: The threshold adjusts continuously based on observed aggregate demand. Fact four: The adjustment ratio is one-to-one. If demand drops by X, the threshold drops by X. Fact five: Therefore, the probability of triggering a specific block remains constant regardless of my individual reduction."

  "Stipulated," Devon said. "All of it. The mechanics are fixed."

  "And yet," Maya said, "I say you have no decisive reason to cut back. You say you do. The empirical dispute is dead. What's left?"

  Devon thought for a moment. "Three candidates. One: You think expected-harm reasoning fails when the probability is this small, even if the harm is large. Two: You think the unit of assessment is the policy or disposition, not the individual act. Three: You think 'your act makes no difference' entails 'you have no reason to refrain' without needing a further premise."

  "Number three is the core," Maya said. "If I literally cannot change the outcome, not even probabilistically, then the reason vanishes. But let's talk about number two. The disposition. You mentioned the forecast learns from observed demand. That means the system isn't tracking my acts; it's tracking the population's dispositions. The harm tracks the aggregate disposition, not the individual token."

  "So?"

  "So, if harm tracks dispositions, then my individual act is only morally relevant insofar as it contributes to shaping that disposition. But if my act is invisible to the aggregate—if it's lost in the noise—then it doesn't shape the disposition either. It's just data point noise." Maya took a sip of tea. "Here's the uncomfortable consequence I have to swallow: If the system learns from aggregates, then individual restraint without coordination is not just futile; it's morally neutral. I could *want* to save energy, I could *vote* for saving energy, but if my actual kilowatt-hours don't shift the aggregate curve, I am off the hook. The responsibility lies entirely with the collective mechanism."

  "That seems like you're letting yourself off too easily," Devon said. "But let's look at my unique move. You're focusing on whether the block triggers. But the number of block-runs and the threshold level come apart. Even if *this* block runs today because the probability didn't shift, lowering the threshold reduces the *expected number* of runs over the season."

  "How?"

  "Because the threshold determines the sensitivity to volatility," Devon said. "If I lower the threshold by conserving, I reduce the likelihood that unexpected spikes later in the season trigger *additional* blocks beyond the must-run reserve. I'm not trying to stop *this* block; I'm trying to lower the curve so the system is less prone to firing extra capacity later. My act contributes to a lower baseline threshold, which statistically reduces the seasonal count, even if it doesn't skip today's unit."

  Maya frowned. "But if the threshold adjusts one-to-one with demand, doesn't the volatility margin stay the same?"

  "Not necessarily. The threshold is a forecast buffer. If aggregate demand is lower, the operator might tighten the buffer because the risk of overload is lower. Your act contributes to that lower aggregate. It's not about triggering; it's about positioning."

  "Okay," Maya said. "I see the move. You're arguing that the act has value independent of triggering a specific harm event. It's about system positioning. But that still relies on the act having a causal footprint on the threshold that isn't eaten by the feedback. If the feedback is perfect, the positioning doesn't change."

  "Nothing is perfect," Devon said. "But let's go back to the residue. You said 'makes no difference' entails 'no reason.' I deny that. Even if you are causally inert, you have a reason to refrain from participating in a harmful practice. It's about complicity, not consequence."

  "Complicity in what?" Maya asked. "If my act doesn't change the practice, am I complicit? If I buy a ticket for a lottery where the prize is burning a town, but my ticket doesn't increase the odds of the town burning because the lottery is rigged to burn the town regardless of ticket sales, am I complicit?"

  "Yes," Devon said. "Because you're aligning yourself with the mechanism. But let's be precise. We agree on the grid. We agree on the feedback. We disagree on whether a reason requires causal efficacy."

  "And whether the unit is the act or the disposition," Maya added. "If I adopt a disposition of restraint, but the aggregate doesn't shift, have I done my duty?"

  "If everyone adopted that disposition, the harm stops," Devon said. "So the disposition is the right unit."

  "But I don't control everyone," Maya said. "So I'm punished for a collective failure I can't fix."

  They sat in silence for a moment, the hum of the refrigerator filling the gap.

  "We're circling," Devon said. "We need to pin this down for your group. What is the exact question?"

  Maya pulled a notebook toward her. "It's not about the probability. We've stipulated that away. It's not about the magnitude of harm. It's about the link between agency and reason in adaptive systems."

  "Right," Devon said. "In a system where individual inputs are neutralized by feedback loops, does the moral reason to act depend on the ability to alter the outcome, or does it depend on something else?"

  "Too vague," Maya said. She wrote for a moment. "How about this: In adaptive systems where individual contributions are causally nullified by equilibrium mechanisms, does the moral reason to refrain from harm require the capacity to change the outcome, or is there a non-consequentialist reason grounded in the act's relationship to the harmful structure itself?"

  Devon leaned in to read. "It's accurate, but it hides the disagreement about the unit of assessment. Is it the act or the disposition?"

  "Because if it's the disposition," Maya said, "then my act only matters if it signals or constitutes part of a collective shift. If it's the act, then I need to know if 'complicity' survives causal nullification."

  "Let's combine them," Devon said. "We need to know what generates the reason when the causal chain is broken."

  Maya wrote again. She underlined the final sentence.

  "The Open Question: In cases where systemic feedback neutralizes the causal efficacy of individual acts, does the moral reason to refrain depend on the act's capacity to alter outcomes, or does it survive based on the agent's alignment with a harmful structure independent of outcome alteration?"

  Devon nodded slowly. "That's the residue. Whether 'making a difference' is a necessary condition for 'having a reason.'"

  "And whether 'alignment' matters when the alignment changes nothing," Maya added.

  "That's it," Devon said. "That's the slide."

  Maya closed the notebook. "I still think the kettle was unnecessary."

  "It used two kilowatt-hours," Devon said. "Just to be sure."

  Maya laughed, a short, sharp sound. "Then you're complicit. And I'm inert. We'll see who sleeps better."
