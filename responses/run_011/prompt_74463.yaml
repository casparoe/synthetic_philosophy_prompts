answer: |-
  **Brainstorming Pass**

  1.  **Operationalism:** Defines concepts strictly by measurement operations. Matches the "rule wins" posture, but makes the "rule was wrong" posture unintelligible.
  2.  **Scientific Realism:** Terms track mind-independent entities. Matches the "missing cases" posture, but cannot explain why the rule constitutively decides membership in practice.
  3.  **Social Construction:** Rules create the reality. Fits the constitutive power, but undermines the claim that the term tracks a predictive, worldly causal structure.
  4.  **Homeostatic Property Clusters (HPC):** Kinds held together by underlying mechanisms. Fits the "real thing" claim, but does not account for the authority of arbitrary thresholds over the mechanism.
  5.  **Reference Fixing (Causal Theory):** Terms latch onto stuff via initial baptism. Explains stability, but not why rewritten rules retroactively change extension.
  6.  **Construct Validity:** Treats terms as theoretical constructs measured by fallible indicators. Close, but usually admits the construct is hypothetical, not constitutive of the records.
  7.  **Interactive Kinds (Hacking):** Classification changes the target. Diverges because the patients and minerals do not change properties when reclassified.
  8.  **Vagueness/Sharpening:** Boundaries are inherently fuzzy. Diverges because the boundaries here are precise, written, and mobile, not naturally unsharp.

  **Considered Answer**

  **1. The Phenomenon: The Constitutive-Evidential Oscillation**
  There is no single canonical label for this specific pattern, but it is a recognized tension within the philosophy of special sciences, particularly medicine and biology. The phenomenon is best described as **The Constitutive-Evidential Oscillation** within **Operationalized Natural Kinds**.

  Your colleagues are treating the definition rule as having a dual status. In the **Constitutive** posture (Posture 1), the rule functions as a *Nominal Essence* (in Locke's sense): it stipulates what counts as the term for practical purposes (billing, protocols, databases). In the **Evidential** posture (Posture 2), the rule functions as a *Proxy* for a *Real Essence* (the underlying pathophysiology or evolutionary lineage). The oscillation occurs because the community needs the rule to be constitutive to act (you cannot treat a diagnosis that isn't recorded), but needs it to be evidential to learn (you cannot improve science if the data is merely stipulative).

  This is a single phenomenon rather than two confusions because the two postures serve complementary functional roles. The constitutive role stabilizes the *practice* (allowing coordination across the hospital network), while the evidential role stabilizes the *inquiry* (allowing the assumption that there is a truth of the matter to be found). The "error" disappears when you recognize that the term $X$ is not purely a natural kind nor purely a convention, but a **Pragmatic Kind**: a category designed to carve nature at joints that are *good enough* for intervention, even if the carving tool is imperfect.

  **2. Nearest Neighbours and Divergences**
  *   **Operationalism:** As noted, this captures the "rule wins" aspect. However, strict operationalism denies that the measure can be "wrong" about the concept, since the concept *is* the measure. Your colleagues insist the measure *can* be wrong about the condition, which diverges from pure operationalism.
  *   **Scientific Realism:** This captures the "missing cases" aspect. However, realism typically holds that membership is mind-independent. Your case shows membership is partly decision-dependent (the committee vote), which diverges from standard realism.
  *   **Homeostatic Property Clusters (HPC):** This is the leading theory for biological kinds (properties clustered by underlying mechanisms). It fits the "real pathophysiology" claim. However, HPC theory usually treats thresholds as epistemic approximations. In your cases, the threshold has *deontic* power (it mandates treatment or death certification), which HPC does not inherently explain.
  *   **Construct Validity:** Common in psychometrics, this treats terms as theoretical constructs validated by correlation. It matches the fallibility. But in your cases, the construct *constitutes* the legal/medical reality (e.g., death), whereas constructs are usually descriptive only.

  **3. Coining a Term: Pragmatic Constitutivism**
  Since existing terms capture only one pole of the oscillation, I propose labeling this practice **Pragmatic Constitutivism**.

  **Definition:** A classification practice where a rule is treated as constitutive of membership for the purpose of action and record-keeping, while simultaneously being treated as a fallible indicator of an underlying reality for the purpose of inquiry and refinement.

  **Boundary Cases (Instances):**
  *   **Hypertension Diagnosis:** A blood pressure threshold (e.g., 130/80) determines who is "hypertensive" for insurance and treatment (constitutive), yet researchers argue the threshold should move to better capture cardiovascular risk (evidential).
  *   **Brain Death Criteria:** The checklist constitutes legal death, yet neurologists debate whether the checklist perfectly tracks the irreversible loss of integrative function.

  **Boundary Cases (Non-Instances):**
  *   **Planetary Definition (2006):** The IAU vote was openly stipulative. There was no claim that Pluto was "really" a planet all along and we missed it; it was a change in linguistic convention. This lacks the Evidential posture.
  *   **Gold (Au):** Membership is determined by atomic number 79. There is no committee threshold that can be rewritten to include element 78. This lacks the Constitutive flexibility.
  *   **DSM-5 Criteria (some cases):** Where criteria changes are acknowledged as changing the *disorder* itself (e.g., splitting autism subtypes), rather than finding the "real" autism. This lacks the Real Essence commitment.

  **Decision-Attachment:** This phenomenon does *not* require a legal or financial decision, though those amplify it. It arises in purely descriptive science whenever a **proxy measure** becomes the **standard identifier**. For example, in astronomy, if "metallicity" were defined by a specific spectral line ratio, and later revised, astronomers would similarly say we "misestimated" earlier stars. It requires only that the community treats the proxy as the *access point* to the kind while believing the kind exists independently of the proxy.

  **4. Defect or Achievement?**
  This double treatment is an **achievement**, not a defect. It is the engine of progress in the special sciences.

  If practitioners adopted pure Realism, they would be paralyzed: they could never act on $X$ until they were certain their rule perfectly matched the Real Essence, which is rarely possible. If they adopted pure Operationalism, they would stagnate: they could never improve the rule, because the rule defines the truth. **Pragmatic Constitutivism** allows them to act *as if* the rule is true (enabling coordination and treatment) while investigating *as if* the rule is fallible (enabling refinement).

  For a theory of natural kinds, this implies that "carving nature at its joints" is not a one-time metaphysical discovery but a **dynamic stabilization**. The "joint" is not a pre-existing line waiting to be found, but a region of causal stability that we approximate with rules. The predictive success survives rewrites because the *underlying causal structure* (the pathophysiology, the evolutionary lineage) remains stable even as our *access criteria* shift. The term $X$ refers to that stable causal structure, but our * grip* on $X$ is mediated by the rule.

  Therefore, a theory of natural kinds must accommodate **Epistemic Iteration** (a term from Hasok Chang): we assume the reality exists to calibrate our tools, and use our tools to locate the reality. The oscillation you observe is not confusion; it is the necessary rhythm of a science that must both *know* the world and *act* upon it simultaneously. The term works because it is anchored in the causal structure, even if the boundary is drawn by committee.
