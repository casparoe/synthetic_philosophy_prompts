answer: |-
  ### 1. Question Stem

  Malthus's 1798 *Essay* posited that human population grows geometrically while food supply expands only arithmetically, inevitably checked by misery and vice. In the greatly expanded 1803 edition, Malthus added "moral restraint" (postponing marriage until financially secure) as a third check. Historical data from pre-industrial England broadly supports the original mechanism: marriage rates and fertility tracked real wages with a lag, meaning improved living standards produced earlier marriage and more children. A large share of the population growth of the later eighteenth century came from rising fertility rather than falling mortality.

  However, this mechanism ceased to operate after the mid-nineteenth century. English working-class real wages remained roughly flat for fifty years despite rising output, then rose persistently while population continued growing; the wage-marriage link weakened and eventually reversed. Simultaneously, the arithmetic-ratio premise was undermined by rising yields, imported grain, and industrial fertilizer. This leaves two candidate repairs to the theory. Repair A is the addition of moral restraint. Superficially, this appears to be an immunizing stratagem: it converts a predicted catastrophe into a conditional one, where failure to materialize is attributed to insufficient virtue. Repair B is the appeal to unforeseen exogenous improvement in food production. Superficially, this appears to be ordinary scientific practice, pointing to independently measured quantities.

  Consider also the Phillips Curve: when the stable unemployment-inflation trade-off broke down in the 1970s, the expectations-augmented version rescued the relationship by predicting stagflation, a combination the original curve had ruled out.

  Write an essay that: (1) States a criterion separating a legitimate auxiliary adjustment from an immunizing stratagem without condemning ordinary *ceteris paribus* reasoning; (2) Applies this criterion to Repairs A and B, determining which is more *ad hoc*; (3) Compares your verdict to the Phillips Curve case; and (4) Explains what the verdict "right but early" could coherently mean in this context—specifically, which component of a theory (mechanism or long-run equilibrium) is being judged.

  *(398 words)*

  ***

  ### 2. Model Answer

  To distinguish a legitimate auxiliary from an immunizing stratagem, one must employ a criterion of **independent testability** or **novel predictive content**. An adjustment is legitimate if it entails consequences beyond merely saving the phenomenon that threatened the theory. It must risk falsification on new grounds. This differs from *ceteris paribus* reasoning, which isolates variables to test a mechanism under controlled conditions; *ceteris paribus* clauses are methodological tools for testing, whereas immunizing stratagens are ontological shields that render a theory unfalsifiable by absorbing all counter-evidence into undefined exceptions.

  Applying this to Malthus, the surface appearance of the repairs is misleading. Repair A (Moral Restraint) initially resembles an immunizing move: if population does not press against food, proponents claim moral virtue was higher than expected. However, Moral Restraint possesses independent content. It implies a specific, testable correlation: populations practicing late marriage should exhibit higher per-capita welfare than those marrying early, regardless of aggregate population size. This claim is checkable across regions and historical periods (e.g., the European Marriage Pattern vs. Eastern European patterns). Because it generates novel empirical expectations about behavior and welfare, it functions as a progressive auxiliary, not merely a shield.

  Repair B (Exogenous Productivity) is riskier. If the appeal to technology is made only *after* the Malthusian trap fails to materialize, it is degenerating. It becomes legitimate only if agricultural productivity was measurable or predictable *ex ante*. If the theorist simply asserts "technology improved" to explain away the anomaly without prior measurement, it is a classic *ad hoc* rescue. Unlike Moral Restraint, which constrains human behavior, a post-hoc productivity appeal constrains nothing; it allows the theory to survive any level of population growth by positing an unspecified technological variable.

  The Phillips Curve case illustrates the gold standard for legitimate repair. The expectations-augmented Phillips Curve did not merely explain the breakdown of the original trade-off; it predicted a phenomenon the original theory deemed impossible: stagflation (high inflation and high unemployment). This is a novel fact. It transformed a refuted correlation into a deeper structural model involving expectations.

  Finally, the phrase "right but early" requires dissection. It is incoherent if applied to the long-run equilibrium claim (the Malthusian Trap), which was empirically false in the long run. It is coherent only if applied to the **mechanism**. The preventive check mechanism (wages influencing fertility) was causally real and operative in the pre-industrial era. The theory was "right" about the micro-foundations of demographic behavior but "early" in assuming those foundations would persist unchanged through industrialization. Thus, the core mechanism retains scientific value even if the long-run equilibrium prediction failed. A theory can be locally true regarding causal powers while globally false regarding systemic outcomes.

  *(748 words)*

  ***

  ### 3. Marking Scheme (25 Marks)

  | Move | Marks | Must-Hit Requirement | Typical Botch |
  | :--- | :--- | :--- | :--- |
  | **1. Criterion Definition** | 4 | Defines legitimacy via **novel facts** or **independent testability** (not just "truth"). | Defines it as "truth" or "logic" rather than predictive risk. |
  | **2. Ceteris Paribus Distinction** | 4 | Distinguishes methodological isolation (*c.p.*) from ontological shielding (immunizing). | Conflates the two or claims *c.p.* clauses are always *ad hoc*. |
  | **3. Moral Restraint Analysis** | 4 | Identifies independent content (welfare/marriage age correlation) making it progressive. | Dismisses it as purely immunizing based on surface "virtue" language. |
  | **4. Productivity Analysis** | 4 | Identifies risk of post-hoc reasoning; legitimacy depends on *ex ante* measurability. | Accepts it as scientific solely because it involves "quantities." |
  | **5. Phillips Curve Comparison** | 4 | Highlights **stagflation** as a novel fact that rescued the theory progressively. | Treats it as merely "fitting the data better" without novel prediction. |
  | **6. "Right but Early" Dissection** | 4 | Distinguishes **mechanism** (valid) from **equilibrium claim** (invalid). | Uses phrase as an escape hatch without specifying which component failed. |
  | **Coherence/Structure** | 1 | Essay flows logically; verdict is consistent with the criterion established. | Disconnected paragraphs or contradictory verdicts. |

  ***

  ### 4. Boundary Statement: First-Class vs. Competent

  A **Competent (2:1)** answer will correctly identify Lakatosian terminology (progressive/degenerating) and apply it consistently. It will likely accept the surface appearance of the repairs: classifying Moral Restraint as immunizing (because it appeals to virtue) and Productivity as scientific (because it appeals to data). It will define "right but early" vaguely as "the theory was correct before it was wrong."

  A **First-Class (First)** answer must execute the **inversion**. It will argue that Moral Restraint is the *more* progressive auxiliary because it imposes behavioral constraints that are independently testable (the European Marriage Pattern), whereas the Productivity appeal is degenerating unless specified *ex ante*. Crucially, the First-Class answer will dissect "right but early" into **mechanism vs. equilibrium**, arguing that the causal link held temporarily even if the systemic prediction failed. The competent answer applies the labels; the first-class answer interrogates the content behind the labels.

  ***

  ### 5. Self-Critical Note

  **Empirical Hedges:** The stem simplifies the Demographic Transition. The reversal of the wage-marriage link after 1850 is not instantaneous, and the "break" is debated among economic historians. I should ensure students know they are to accept the stem's empirical summary as given for the sake of the philosophical argument, rather than contesting the history.

  **Confidence in Ranking:** I am philosophically confident that "independent testability" favors Moral Restraint in this framing, but historically, one could argue that agricultural chemistry (Liebig, 1840s) provided *ex ante* measurable grounds for Repair B. If a candidate argues that fertilizer science was a measurable, progressive research programme independent of Malthusian needs, they should not be penalized, provided they apply the criterion consistently. The marking scheme allows for this in Move 4 ("legitimacy depends on *ex ante* measurability").

  **Dissenting Answers:** A genuinely strong candidate might resist the inversion. They could argue that Moral Restraint is *inherently* unmeasurable (how do you quantify "virtue"?), making it the true *ad hoc* shield, while arguing that grain yields are objectively measurable. To deserve full marks, this dissent must still satisfy Move 1 (Criterion) and Move 6 (Mechanism/Equilibrium distinction). The marking scheme awards marks for the *application of the criterion*, not for agreeing with my specific historical verdict, though the Model Answer reflects the pedagogical goal of the seminar.
