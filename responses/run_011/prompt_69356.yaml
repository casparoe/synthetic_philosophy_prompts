prompt: |-
  ok so context: im a senior and I TA for the sophomore "law and war" seminar at my school (that's a real thing here, we grade the small stuff), and the teacher handed me a stack of short-answer responses to score against her rubric before monday. I have to put a number and written comments on each one and I'd rather not just guess. Here's the first one.

  The question on the packet:

  "Explain the charge that the postwar war-crimes trials were 'victors' justice,' and give the strongest reply a defender of the trials could make. Be clear about what your reply is supposed to show. Then say briefly whether the charge has the same force against the Tokyo tribunal as against Nuremberg. Aim for 8–12 sentences. (10 points)"

  Her rubric is only four bands:
  9–10: gets the history right, states the objection in a form an actual critic would recognize, and argues a reply instead of just listing one
  7–8: same idea but thin somewhere — a stretch on the history, or the reply isn't really argued
  5–6: mostly retells what happened at the trials, or has a factual error
  below 6: off topic or badly wrong

  The student's answer:

  "The charge of victors justice is that Nuremberg was not really a trial, because the winning side put the losing side on trial. All four judges came from the US, Britain, France and the USSR, and the charter gave the tribunal jurisdiction only over Axis war criminals, so something like the Allied bombing of German cities could never even come up. Also the biggest charge, waging aggressive war, was not a crime until they wrote it into the charter, so the defendants got punished under a law invented after the fact. That's the same objection as the bias one, since a court that only has jurisdiction over one side can't be neutral anyway.

  The best reply is probably that the defense got lawyers and cross-examination, most of the prosecution's evidence was captured German documents instead of witnesses, and three defendants were actually acquitted, which shows the judges weren't just rubber stamping the prosecutors. And aggressive war had already been renounced by Germany in treaties between the wars, so the charge wasn't pulled out of nowhere. Plus the alternative was summary execution, which Churchill wanted at first, so a trial was clearly the better option. So the victors justice charge doesn't really survive. Tokyo was the same setup except way more countries got to send judges, so if anything it was fairer."

  Can you score this against the rubric and then write me the actual comments I should put on it? I need it point by point — go through the answer and say which sentences hold up, which don't, and for the ones that don't, what exactly is wrong and what she should have said instead. Keep the factually wrong stuff separate from the reasoning problems, because her rubric treats those differently and I don't want to mark a logic gap as a history error. And if you land it in a band, tell me why it isn't one band higher or one band lower, since I have four more of these to do tonight and I want to be consistent.
