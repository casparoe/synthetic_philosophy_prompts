      *   *Sentence 3:* "Also the biggest charge, waging aggressive war, was not a crime until they wrote it into the charter, so the defendants got punished under a law invented after the fact." (Legal point: *ex post facto* / aggressive war. Accurate).
      *   *Sentence 4:* "That's the same objection as the bias one, since a court that only has jurisdiction over one side can't be neutral anyway." (Reasoning: Conflates bias with *ex post facto* slightly, but acceptable synthesis).
      *   *Sentence 5:* "The best reply is probably that the defense got lawyers and cross-examination, most of the prosecution's evidence was captured German documents instead of witnesses, and three defendants were actually acquitted, which shows the judges weren't just rubber stamping the prosecutors." (Reply: Procedural fairness. This is a standard defense. It's listed a bit, but connected to the conclusion "shows judges weren't rubber stamping").
      *   *Sentence 6:* "And aggressive war had already been renounced by Germany in treaties between the wars, so the charge wasn't pulled out of nowhere." (Reply: Legality of aggressive war/Kellogg-Briand. Accurate).
      *   *Sentence 7:* "Plus the alternative was summary execution, which Churchill wanted at first, so a trial was clearly the better option." (Reply: Pragmatic/Moral comparison. Valid point).
      *   *Sentence 8:* "So the victors justice charge doesn't really survive." (Conclusion).
