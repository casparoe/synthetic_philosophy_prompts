answer: |-
  This is a sharp idea. You've identified the exact weakness of the "Brother/Sister" dilemma: it triggers a visceral reflex (disgust) that shuts down thinking before the logic can start. Your matched-pair approach is better because it targets *bias* rather than *taboo*. It asks people to catch themselves in a contradiction, rather than defend a position.

  Here is a design for a 90-minute session. It is built to be run by one person, with zero tech, using the materials you have. It prioritizes mechanical neutrality (so you can't steer it) and protects your friends from becoming "cultural exhibits."

  ### The Session Plan (90 Minutes)

  **0:00 – 0:10: Setup & Ground Rules**
  **0:10 – 0:30: The Voting (Silent)**
  **0:30 – 0:50: The Reveal (Visualizing the Split)**
  **0:50 – 1:20: The Debrief (Connecting the Dots)**
  **1:20 – 1:30: Closing**

  ---

  ### Part 1: The Materials (The "Recipe")

  You need two sets of index cards. Let's call them **Blue** and **Yellow**. You need to hand-write these out beforehand. Do not put both scenarios on one card.

  **The Logic:** Both pairs describe the exact same structural trade-off (1 vs. 2, or Rule vs. Need). The only variable changed is the *social distance* (Thick/Relational vs. Thin/Abstract).

  **Set 1: The Flood (Sacrifice)**
  *   **Blue Card 1:** "A flood is coming. You can build a wall to save **your own home**, but doing so will divert the water into **two neighbors' homes**, destroying them. You build the wall."
  *   **Yellow Card 1:** "A flood is coming. You can build a wall to save **House A**, but doing so will divert the water into **House B and House C**, destroying them. (You live in none of these). You build the wall."
  *   **Question on both:** "Is this action morally permissible? (Yes / No)"

  **Set 2: The Store (Rule Breaking)**
  *   **Blue Card 2:** "You manage a hardware store. Policy says no credit. **Your brother** comes in, needs a $500 part to fix his heating, promises to pay next week. You let him take it."
  *   **Yellow Card 2:** "You manage a hardware store. Policy says no credit. **A customer** comes in, needs a $500 part to fix their heating, promises to pay next week. You let them take it."
  *   **Question on both:** "Is this action morally wrong? (Yes / No)"

  *Note: I used your profession in Set 2. It grounds the abstract in your reality, which gives you standing to facilitate, but keep the tone neutral.*

  **Preparation:**
  1.  Write the Blue text on half the index cards.
  2.  Write the Yellow text on the other half.
  3.  Shuffle them.
  4.  When people arrive, hand everyone one Blue and one Yellow. Tell them: "Do not discuss these with anyone until I say so. Keep them face down."

  ---

  ### Part 2: The Mechanics (Preventing Steering)

  The goal is to make the data appear without you interpreting it first.

  1.  **The Vote:** Give them 5 minutes to read both cards and mark their answers (Yes/No) on the *back* of the index cards. Emphasize: "Answer instinctively. Don't overthink. There are no right answers."
  2.  **The Collection:** Walk around with a hat or a box. Collect all Blue cards. Collect all Yellow cards. Keep the stacks separate.
  3.  **The Tally:** Go to the whiteboard. Draw two columns: **Blue** and **Yellow**.
      *   For the Flood (Set 1): Count how many said "Yes, Permissible." Write the number.
      *   For the Store (Set 2): Count how many said "Yes, Wrong." Write the number.
  4.  **The Cross-Check:** This is the crucial moment. Ask the group: "Keep your cards. Look at your Blue and your Yellow for the Flood scenario. Raise your hand if you gave *different* answers to the two versions."
      *   Count the hands. Write that number on the board under "Inconsistent."
      *   Do the same for the Store scenario.

  *Why this works:* You aren't telling them they are inconsistent. The board tells them. You are just the scorekeeper.

  ---

  ### Part 3: The Debrief (Scripting the Hard Parts)

  This is where you avoid the "specimen" trap and the "nihilism" trap.

  **Phase 1: The Internal Contradiction (20 mins)**
  *   **Ask:** "Look at the 'Inconsistent' number. For those of you who raised your hand: Why did the answer change?"
  *   **Listen:** Let them talk. They will say things like, "Well, it's my house," or "But it's my brother."
  *   **Push:** "On paper, the math is the same. One house vs. two. One rule break vs. one rule break. Did the *morality* change, or did the *stakes* change?"
  *   **Goal:** Get them to admit that the *relationship* felt like a moral fact, even though it wasn't in the logic.

  **Phase 2: The Cultural Mirror (20 mins)**
  *   **Say:** "We just proved that changing the words changes the moral instinct inside this room. We are all sitting here, mostly from this same city, and the wording flipped us."
  *   **The Pivot:** "If a few sentences on an index card can shift your moral vision, what does a lifetime of upbringing do?"
  *   **The "Specimen" Defense:** Someone will inevitably turn to Eduardo or the Polish members and ask, "Would you have voted differently in Peru?"
      *   **Your Script:** "I want to stop us there. We can't know what Eduardo would have done in Peru, because Eduardo is here, not there. And we don't want to turn our friends into representatives of their countries. The point isn't that *other* cultures are different. The point is that *this* culture is invisible to us. We are studying the water we are swimming in, not comparing it to the ocean."
  *   **Why this matters:** It protects Eduardo from having to perform "Peruvian-ness" and keeps the focus on the *mechanism* of bias, which applies to everyone equally.

  **Phase 3: What's Left Standing? (10 mins)**
  *   **The Fear:** "If our instincts are just software installed by our culture, is anything real? Is morality just arbitrary?"
  *   **The Answer:** "No. It means morality is a *tool*, not a *sensor*."
      *   *Explanation:* "A hammer isn't 'true' or 'false.' It's for driving nails. If you try to drive a screw with it, it fails. Our moral instincts are tools for social cohesion. They are designed to keep *this* group working together."
      *   *The Takeaway:* "Knowing your instincts are culturally shaped doesn't mean you throw them away. It means you stop trusting them as absolute truth. It creates a pause. That pause is where actual thinking happens."

  ---

  ### Part 4: Troubleshooting & Honest Limitations

  You asked for honesty about what will go wrong and what this can't do.

  **1. The "Eduardo" Problem (Othering)**
  *   **Risk:** The group treats the non-Western members as the "control group" to verify the theory.
  *   **Recovery:** Use the script above. If it persists, turn it on yourself. "I'm the one running this, I'm the most WEIRD person in the room. If anyone is the specimen, it's me." Self-deprecation lowers the temperature.

  **2. The Nihilism Trap ("Nothing Matters")**
  *   **Risk:** Someone concludes, "So if I steal from my brother, it's not really wrong, it's just culture."
  *   **Recovery:** Distinguish between *explanation* and *excuse*. "Understanding why you have an urge doesn't mean you have to act on it. Knowing you have a bias toward sugar doesn't mean you eat the cake. It just means you know why you want it."
  *   **What's left standing:** *Responsibility.* If your morals are automatic, you are a robot. If you realize they are conditioned, you have the chance to edit them. That increases responsibility, it doesn't decrease it.

  **3. Predictable Failure Mode: The "Logic Police"**
  *   **Risk:** Someone will argue, "But the cases *aren't* the same. Saving your own house *is* different logically because of property rights."
  *   **Recovery:** Agree with them. "You're right. In our legal system, that's a difference. But is it a *moral* difference, or just a *legal* one? That's the argument. The card doesn't decide it; the fact that you felt the difference instantly is the data."
  *   **Don't fight the logic.** The point of the exercise isn't to prove the cases are identical; it's to prove the *reaction* is different.

  **4. What This Activity Cannot Do**
  *   **It cannot tell them which choice is correct.** You must say this explicitly. "This session does not tell us if saving your brother is right or wrong. It only shows us that we feel differently about it than saving a stranger. We have to do the hard work of deciding if that feeling is justified."
  *   **It cannot remove the bias.** Knowing you are biased doesn't stop you from being biased. It just stops you from being *sure* you aren't.
  *   **It cannot replicate the "Outside" view.** You cannot show them what a non-WEIRD moral intuition feels like. You can only show them that their own intuition is unstable. You have to say this: "I can't show you the outside. I can only show you the walls of the inside."

  ### Final Advice for the Facilitator

  You mentioned you aren't academic. Use that. When you explain the WEIRD concept, don't use the acronym. Say: "Psychologists tested their theories on college students in rich countries and assumed that was 'human nature.' It turns out it's just 'our nature.'"

  When you close, don't offer a cookie. Offer a task.
  "Next time you feel morally furious about something, ask yourself: 'If the names on this story were different, would I still be this angry?' If the answer is no, you've found a piece of your own wiring. You don't have to cut it out. But you should know it's there."

  That's enough for a Thursday night. It leaves them with something to do, not just something to believe.
