answer: |-
  This is a profound and painful situation, and your intuition is sharp: you have correctly identified that there are two distinct ethical questions tangled together here. Sipho is answering the question *"What did Daniel deserve?"* while the rest of the family is grappling with *"What do we owe each other, and ourselves, now?"*

  You asked for a philosophy brain to help untangle this before Sunday. Here is an analysis of Sipho's argument, where it holds water, where it leaks, and how you might frame your contribution to the meeting.

  ### 1. Is Sipho's Claim Coherent?

  Sipho is arguing for a **Performative Theory of Kinship**. In this view, family is not a biological state (*being* blood) but a social practice (*doing* family). Philosophically, this is a respectable position. It aligns with virtue ethics: you are what you do. If you stop doing the virtues of a brother/uncle/son, you cease to hold that title in a meaningful way.

  **Where he is right:**
  He is right that memory is relational. Your grandmother's wisdom ("you're only properly gone once the last person who knows you stops saying your name") supports him. If no one acts as if Daniel was family, then functionally, he wasn't. To inscribe his name in the family plot is to make a statement about a relationship that didn't exist. Sipho calls this a "lie told in stone." In a literal sense, he is correct: the stone would imply a closeness that was absent.

  **Where he is incoherent (The Leaks):**
  Sipho's logic breaks down at three specific points, which you already spotted:

  *   **The Daughter:** If membership is purely performative, the daughter has zero standing. She didn't "do" family with you. But she is the primary vessel for Daniel's memory. If Sipho's goal is truth and memory, excluding Daniel makes it *harder* for the daughter to remember him. It severs the link rather than preserving it.
  *   **The Neighbor:** If "showing up" is the only metric, the neighbor who found the body and knew his last five years has a stronger claim to "membership" than you do. Sipho would likely reject this, which reveals that he *does* rely on a biological/structural boundary when it suits him. He wants the benefits of blood (the right to decide) without the obligations of blood (unconditional inclusion).
  *   **His Own Absence:** You noted his four years abroad. Sipho would argue intent matters ("I meant to come back"). But Daniel likely had reasons for leaving too. Sipho is making himself the judge of which absences are justified and which are not. That is not bookkeeping; that is judgment.

  **Verdict:** Sipho's argument is internally consistent regarding the *past*, but inconsistent regarding the *future* and the *self*. It is a closed system that protects his own grievance while claiming to be objective truth.

  ### 2. The Nature of the "Lie"

  Sipho says burying Daniel in the plot is a lie. This is the crux of the philosophical disagreement.

  *   **Sipho's View:** A grave marker is a **Certificate of Good Standing**. It says, "This person belonged here."
  *   **The Counter-View:** A grave marker is a **Marker of Origin**. It says, "This is where this life came from, and where the story ends."

  If you view the funeral as a transaction where Daniel earns his spot, Sipho wins. But funerals are rarely for the dead. They are rituals for the living to reorganize their world after a rupture.

  If you bury him, are you lying? Or are you acknowledging a complex truth? You can acknowledge that he left, that it was painful, and that he died alone, *without* denying that he originated from this soil. To exclude him is to pretend the rupture didn't happen. To include him is to acknowledge that the family bond is strong enough to survive even abandonment.

  ### 3. The Two Questions (Your Insight)

  You wrote: *"The thing everyone keeps dancing around is that there are two different questions tangled together: what Daniel was owed then and what we owe each other now."*

  This is the key you should bring to Sunday.

  *   **Question 1: Justice for Daniel.** Did Daniel deserve a family burial? Probably not, based on his actions. Sipho is right here. Daniel did not uphold his end of the covenant.
  *   **Question 2: Integrity of the Living.** Who do *we* want to be? Do we want to be a family that conditions dignity on performance? Or a family that absorbs failure?

  Sipho is trying to answer Question 2 by settling Question 1. He thinks that by denying Daniel the plot, he is restoring moral balance. But he isn't balancing the scales; he is just breaking them. Daniel is dead; he feels no shame. The only people who feel the weight of this decision are the living: the grandmother, the cousins, and especially the daughter.

  ### 4. What to Say on Sunday

  You need to speak in a way that validates Sipho's pain (so he doesn't feel unheard) but pivots the decision to the welfare of the living (which overrides Daniel's "merit").

  Here is a suggested framework for your contribution:

  **Step 1: Validate Sipho's Logic (Disarm the Defense)**
  "Sipho, I've thought hard about what you said, and I think you're right about one thing: Family isn't just blood. It is something you do. Daniel stopped doing it. He walked away, and that caused real pain. If we pretend he was present when he wasn't, that is dishonest. I don't want to lie about our history."

  **Step 2: Introduce the Daughter (The Ethical Pivot)**
  "But we aren't just deciding for Daniel. We are deciding for his daughter. She is here. She is blood. She wants to know where she comes from. If we exclude Daniel, we aren't just judging him; we are erasing her history. On your logic, she hasn't 'done' the work of family either. Are we going to tell her she doesn't belong in this ground because of what her father did? If we do that, we aren't being accurate; we're punishing the innocent for the sins of the dead."

  **Step 3: Reframe the "Lie" (The Grandmother's Wisdom)**
  "Grandma used to say we're only gone when the name stops being spoken. If we bury Daniel in the family ground, we aren't saying 'He was a perfect uncle.' We are saying 'He came from here, and we are still here.' The stone isn't a resume; it's an anchor. If we leave him out, the name stops sooner. If we put him in, the daughter has a place to come back to. That keeps the name alive."

  **Step 4: Address the "Owe" (The Closing Argument)**
  "Sipho says this isn't punishment, just accuracy. But I think there are two questions here. One is what Daniel deserved. He probably didn't deserve this. But the second question is what *we* owe each other. Do we owe each other a family that can withstand failure? If we make membership conditional on perfect attendance, none of us are safe. I vote we bury him not because he earned it, but because we are the kind of family that doesn't leave our dead in the cold, even when they left us."

  ### Summary for your preparation

  *   **Sipho is philosophically consistent but ethically rigid.** He values "Truth" over "Mercy."
  *   **The burial is not for Daniel.** It is for the daughter and for the family's self-conception.
  *   **The "Lie" is a category error.** A grave marks origin, not merit.
  *   **Your strategy:** Agree with his premise (family is work) but disagree with his conclusion (therefore exclude him). Use the daughter as the lever to show why exclusion causes more harm than the "dishonesty" of inclusion.

  You are right to feel that Sipho is dressing up resentment as bookkeeping. But don't call it resentment on Sunday. Call it "a desire for justice." Then explain why justice for the dead is less important than mercy for the living.
