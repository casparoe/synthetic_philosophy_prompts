  **Preamble**

  This handout helps us sort out what we mean when we say science is underdetermined. We are not sorting by labels like "realist" or "skeptic," but by what you think happens when two theories match all the data. The first axis asks whether a tie between theories is temporary, waiting on new tools, or permanent even in principle. The second asks whether the tie happens between whole world-pictures or locally, between a theory and the background assumptions needed to test it. The third asks whether anything beyond observational fit—like simplicity or coherence—can break the tie, and if so, whether that resource allows several rivals to remain equally warranted. Your answers will place you on a map of positions without requiring you to know their names in advance. This ensures we argue about the same thing rather than talking past one another.

  **Diagnostic Tree**

  Start: Here are two accounts of the world that agree about every observation anyone could make.

  1.  Consider the Copernican and Tychonic systems before stellar parallax was measured. Was this tie broken by evidence eventually available, or would it have remained even if parallax were impossible to measure?
      *   Broken by evidence (Temporary) → Go to 2.
      *   Remained in principle (Permanent) → Go to 3.

  2.  Consider the current choice between Dark Matter and Modified Gravity. Is this tie also just waiting on better instruments, or is it different in kind?
      *   Waiting on instruments → Leaf: Deflationary View.
      *   Different in kind → Leaf: Optimistic Realism (Unnamed).

  3.  Consider the choice between curved space and flat space with a universal shrinking force. Is this tie about the whole world (global) or just how we describe geometry (local)?
      *   Local → Go to 4.
      *   Global → Go to 5.

  4.  For the local geometric tie, is there a fact of the matter, is the choice conventional, or is the question meaningless?
      *   Question meaningless → Leaf: Quietism.
      *   Choice conventional → Leaf: Conventionalism.
      *   Fact of the matter → Leaf: Geometric Realism (Unnamed).

  5.  Consider the different formulations of quantum theory. Can explanatory virtues like simplicity pick a winner?
      *   Yes → Go to 6.
      *   No → Go to 7.

  6.  If virtues pick a winner, does that mean the unobservable parts are true, and if so, all of them or only the stable ones?
      *   Unobservables not true → Leaf: Constructive Empiricism.
      *   All unobservables true → Leaf: Strong Realism.
      *   Only stable parts true → Leaf: Cautious Realism.

  7.  If virtues cannot pick a winner, does this show science is unjustified, that we must keep rivals, or that theories are just tools?
      *   Science unjustified → Leaf: Radical Skepticism.
      *   Must keep rivals → Leaf: Methodological Pluralism.
      *   Theories just tools → Leaf: Instrumentalism.
      *   May keep rivals → Leaf: Permissive Pluralism.

  **Leaf Descriptions**

  1.  **Deflationary View:** Core Commitment: Every apparent tie is temporary and will be broken by future evidence or ingenuity. Best Case: Copernican/Tychonic (broken by parallax). Worst Case: Quantum Formulations (no new evidence seems possible), because it assumes breaks where none may exist.
  2.  **Optimistic Realism (Unnamed):** Core Commitment: Ties are temporary in principle, but some may last long enough to shape research programs. Best Case: Dark Matter/MOND (current tie). Worst Case: Curved/Flat Space (may be permanently conventional), because it treats conventions as empirical problems.
  3.  **Quietism:** Core Commitment: The question about tied rivals is not a factual question at all. Best Case: Curved/Flat Space (no fact of the matter). Worst Case: Dark Matter/MOND (there is a fact, we just lack it), because it denies facts where evidence might decide.
  4.  **Conventionalism:** Core Commitment: The tied choice is a matter of linguistic or descriptive convenience, not truth. Best Case: Curved/Flat Space (geometry choice). Worst Case: Quantum Formulations (disagree on ontology, not just description), because it reduces ontological disputes to labels.
  5.  **Geometric Realism (Unnamed):** Core Commitment: One geometric description is true even if observations cannot distinguish them. Best Case: Curved/Flat Space (if one believes space has a shape). Worst Case: Copernican/Tychonic (before parallax), because it commits to truth without evidence.
  6.  **Constructive Empiricism:** Core Commitment: We should accept theories as empirically adequate but not believe their unobservable claims are true. Best Case: Quantum Formulations (save the phenomena). Worst Case: Dark Matter/MOND (one must be true about galaxies), because it withholds belief where a fact exists.
  7.  **Strong Realism:** Core Commitment: Explanatory virtues settle the tie and make the whole theory true. Best Case: Quantum Formulations (if simplicity picks one). Worst Case: Dark Matter/MOND (if both are partially wrong), because it commits to the full theory prematurely.
  8.  **Cautious Realism:** Core Commitment: We commit only to those parts of a theory that have kept working through successive replacements. Best Case: Dark Matter/MOND (gravity works, matter/modify is unsure). Worst Case: Quantum Formulations (no successive replacements yet), because it relies on historical stability.
  9.  **Radical Skepticism:** Core Commitment: Underdetermination shows that no empirical theory is ever justified. Best Case: Quantum Formulations (no tie-breaker). Worst Case: Copernican/Tychonic (was justified eventually), because it generalizes from hard cases to all science.
  10. **Methodological Pluralism:** Core Commitment: Maintaining rivals is a methodological duty rather than a failure. Best Case: Dark Matter/MOND (keep both alive). Worst Case: Copernican/Tychonic (waste of resources to keep both), because it mandates inefficiency in resolved cases.
  11. **Instrumentalism:** Core Commitment: Theories are just tools for prediction, not descriptions of reality. Best Case: Quantum Formulations (use the math). Worst Case: Electrons/Tables (Wen's claim), because it denies the reality of entities we interact with.
  12. **Permissive Pluralism:** Core Commitment: Scientists are allowed to keep rivals alive but not required to. Best Case: Dark Matter/MOND (researchers choose). Worst Case: Radical Skepticism (too weak to answer justification), because it offers no norm for belief.

  **Unoccupied Cells**

  The cell combining Permanent, Global, Observational-Fit-Only, and Realism is empty. This view is incoherent because Realism requires believing one rival is true, while Observational-Fit-Only denies any reason to prefer one as true. A second empty cell combines Temporary, Global, and Radical Skepticism. This is unstable under pressure; if ties break, skepticism loses its footing. A third cell, Permanent, Local, and Realism, is merely unexplored. A defender would have to maintain that local descriptive choices reflect deep facts even when evidence cannot distinguish them.

  **Unseparable Pairs**

  The tree cannot really separate Strong Realism and Cautious Realism using the four cases provided. Both positions answer "Yes" to the claim that virtues indicate truth, and none of the cases show a theory being replaced while keeping parts working. To separate them, we would need to ask: "Do you believe the specific ontology of the current best theory, or only the mathematical structure that survives replacement?" This question is about historical attitude, not case judgment.

  **Test Run**

  **Priya:** Lands on **Quietism**. She claims there is "no further fact" about the shape of space, which matches the Quietist commitment that the question is not factual. She treats simplicity as a choice mechanism, not a truth-maker.

  **Daniel:** Lands on **Deflationary View**. He states that every tie has broken and expects the pattern to continue. This matches the Deflationary commitment that underdetermination is temporary and does no philosophical work.

  **Wen:** Lands on **Cautious Realism**. He claims electrons are real (Realism) but commits only to parts that keep working through replacements (Cautious). The tree places him here via the path: Permanent → Global → Virtues → Truth → Stable Parts. He is distinguishable from Constructive Empiricism because he affirms the reality of unobservables, and from Strong Realism because he limits commitment to stable parts.
