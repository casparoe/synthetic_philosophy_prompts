answer: |-
  # Q&A PREP SHEET: Mandatory Directed Levy

  **Strategy Note:** You have identified two critical weaknesses. Do not wait for the audience to exploit them. Concede these limitations explicitly during your closing remarks in the main paper to disarm the critics before Q&A begins.

  **[CONCEDE IN TALK]**
  1.  **The Compelled-Support Angle:** Acknowledge that US doctrine currently views this as coercive. Frame your proposal as a *theoretical* correction to neutrality, not a immediate litigation blueprint.
  2.  **The Eligibility Criteria:** Admit the "who qualifies" mechanism is unresolved. Frame it as the necessary next phase of institutional design, not a finished product.

  ---

  ### THE EIGHT OBJECTIONS

  **1. The US Constitutional Litigator (Compelled Speech)**
  *   **Objection:** "You're describing *Janus* v. AFSCME applied to souls. Compelling a taxpayer to designate funds, even to a lottery, is compelled speech and support. It's doctrinally dead on arrival."
  *   **Reply:** "You're right that under current precedent, this is non-starter. But *Janus* protects against subsidizing private speech you oppose. Here, the state isn't subsidizing speech; it's funding civic infrastructure where conviction communities are the delivery mechanism. The compulsion is to participate in the tax system, not to endorse a creed. The lottery default specifically mitigates the expression element—if you don't speak, your money speaks randomly, not ideologically. I'm arguing neutrality requires resource distribution, not just rights protection. If abstention starves the poor, is constitutional silence actually neutral?"
  *   **Soft Spot:** It *is* compelled expression of affiliation; the lottery doesn't change the initial mandate to choose.

  **2. The US Constitutional Litigator (Establishment Clause)**
  *   **Objection:** "Direct channeling of tax revenue to religious bodies violates the Establishment Clause. No aid to religion. Period. Even if non-religious groups are included, you're entangling state and church."
  *   **Reply:** "The 'no aid' principle assumes aid implies endorsement. My proposal treats religious and non-religious convictions identically—including the civic-commons option. It's true neutrality rather than hostile separation. Entanglement already exists through tax exemptions and zoning; this makes the relationship transparent and accountable rather than hidden in exemptions that favor the wealthy. We aren't establishing a church; we're funding the civil society layer where churches happen to operate."
  *   **Soft Spot:** State still defines eligible recipients, which is excessive entanglement.

  **3. The French Political Scientist (Laïcité)**
  *   **Objection:** "You assume the state can neutrally categorize 'conviction.' This is Gallicanism. The state defining religious legitimacy is the violence, not the funding. You make the state the theologian."
  *   **Reply:** "The state is already the theologian; it just hides behind 'abstention.' It decides which groups get 501(c)(3) status, which get visas, which get zoning permits. My proposal forces that categorization into the open where it can be contested. *Laïcité* protects the individual from the state, but if the state's silence allows wealth to dictate religious survival, it's protecting the wealthy, not the citizen. Explicit recognition is safer than implicit bias."
  *   **Soft Spot:** Explicit definition invites lobbying and corruption of the definition itself.

  **4. The Public-Finance Economist (Crowding Out)**
  *   **Objection:** "Crowding out. If the state funds me, do private donors stop? You reduce total social capital while increasing bureaucracy. You're subsidizing what would happen anyway."
  *   **Reply:** "This is 0.5% of income tax, designed as a survival baseline, not operational funding. It targets the diffuse and poor communities that *don't* receive private donations. Wealthy congregations won't rely on this; marginalized ones will. The data on tax credits suggests complementary giving, not substitution, when the state funding is framed as infrastructure rather than program support. You're worried about efficiency; I'm worried about existence."
  *   **Soft Spot:** Hard to prove no substitution effect among mid-sized groups.

  **5. The Canon Lawyer (The Gilded Cage)**
  *   **Objection:** "A church on the budget is a church on a leash. You trade prophetic voice for state security. When the budget cuts, the gospel softens."
  *   **Reply:** "The current system already leashes churches to wealthy donors. If your survival depends on a few major benefactors, you cannot criticize them. This diversifies the revenue stream across the entire citizenry. It makes the church accountable to the public commons, not just its paymasters. Prophetic voice requires independence from *private* oligarchy as much as state control. This swaps one master for many."
  *   **Soft Spot:** State can still de-recognize groups that become too prophetic.

  **6. The Sociologist of Religion (The 'Nones')**
  *   **Objection:** "Forcing the 'Nones' to choose falsifies data and forces identity where there is none. It creates false affiliation and distorts the religious landscape."
  *   **Reply:** "There is no 'none' box, correct, but there is a civic-commons option. If you have no conviction community, you fund the public square. That isn't falsification; it's acknowledging that secularism is also a stance with infrastructure needs. The lottery default ensures that silence doesn't penalize the unaffiliated. We stop measuring religion by membership rolls and start measuring it by civic participation."
  *   **Soft Spot:** They still must file the form, creating administrative friction for the disengaged.

  **7. The German Representative (Kirchensteuer)**
  *   **Objection:** "*Kirchensteuer* works because it's opt-out. Your opt-in lottery creates uncertainty for communities. They can't budget if revenue tracks a lottery rather than direct membership."
  *   **Reply:** "Italy's *otto per mille* uses a proportional default and still functions. My lottery proposal stabilizes the aggregate pool even if individual distribution varies. Communities can plan based on demographic presence, not just administrative efficiency. The German system requires a formal exit declaration before a state office, which is a high barrier. My system lowers the barrier to entry for new movements while maintaining the revenue floor."
  *   **Soft Spot:** Volatility is higher than direct collection; budgeting remains difficult.

  **8. The General Audience (Eligibility Criteria)**
  *   **Objection:** "Who decides which groups get recognized? If you can't solve this, the whole mechanism collapses into patronage. Cults, political parties, where does it stop?"
  *   **Reply:** "This is the hardest design challenge, and I concede it's unresolved. We likely start with existing tax-exempt statuses plus a civic registration board with judicial oversight. The goal is to prevent the state from picking winners, not to give it a veto. If we can't solve the gatekeeping, the proposal fails. But failing to solve it means keeping the current system where wealth is the only gatekeeper."
  *   **Soft Spot:** Political manipulation of the eligibility list is almost inevitable.

  ---

  ### THE QUESTION I'M HOPING NOBODY ASKS

  **The Question:** "What prevents the state from de-recognizing a community's eligibility when they criticize government policy?"

  **Why it's worse than the Muslim taxpayer issue:** The Muslim taxpayer issue (fragmented authority) is an administrative hurdle. The de-recognition issue is an existential threat. If the state controls the list of eligible recipients, it holds a starvation weapon against dissent. It turns your "hands in pockets" neutrality into a leverage mechanism. If a religious group protests a war or a policy, the state doesn't need to ban them; it just removes them from the levy list, cutting off their baseline survival funds while leaving wealthy groups untouched. This validates the French critique that the state competence is the problem, but adds a material consequence that makes it dangerous.

  **Prepared Reply:** "That is the central risk of any recognition system. The safeguard must be that eligibility criteria are statutory, not administrative, and removal requires judicial review, not executive discretion. We must build firewalls between the revenue agency and the recognition board. If we can't guarantee that, you're right: this becomes a tool of suppression. That's why the eligibility criteria must be the primary focus of any legislative draft."

  Verdict: #1 — Compelled support kills proposal.
