          A. Policy must be formally neutral (Distinction: Cash/Services or Parent/Market).
          B. Policy must correct gendered uptake (Case: Part-time option taken by one sex).
          C. Policy must not distort employer hiring incentives (Empirical: Hiring/Pay).
          *   If you are formally neutral (A), you get gendered uptake (violates B).
          *   If you correct gendered uptake (B) (e.g., quotas), you distort hiring incentives for the targeted group (violates C).
          *   If you protect hiring incentives (C) (e.g., no leave), you fail to support care (violates the premise of the theory).
          *   *Selection:* The subset involving **Formal Neutrality**, **Substantive Gender Equality**, and **Employer Cost Neutrality** is the classic impossibility triangle in this field.

  5.  **Refining the Output Structure:**

      *   **Introduction:** Acknowledge the task (specification drafting).
      *   **The Requirements List:** Grouped logically (Valuation, Design, Distinctions, Empirics).
      *   **Annotation:** Why it's a requirement + Negotiability.
