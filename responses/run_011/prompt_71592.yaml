answer: |-
  ### Specification Requirements for a Normative Theory of Paid Leave and Childcare

  To count as adequate, a normative theory of paid leave and non-parental childcare must satisfy the following six requirements. Each is annotated with its justification (why it is a structural necessity rather than an ideological preference) and its negotiability status.

  **1. The Accounting Asymmetry Requirement**
  *   **Requirement:** The theory must explicitly resolve why public funds subsidize market-based care (stranger) as a GDP-contributing productive activity, while parental care is treated as a private consumption good or earnings forgone. It must either justify this valuation gap or provide a normative framework for closing it.
  *   **Why a Requirement:** This is not a hobbyhorse but a structural feature of modern welfare states. A theory that ignores this fails to explain the fundamental incentive structure facing parents (buy care vs. provide care).
  *   **Status:** **Non-negotiable.** A theory that treats these as equivalent without explaining the fiscal mechanism, or ignores the distinction entirely, cannot guide policy design.

  **2. The Quota Justification Requirement**
  *   **Requirement:** The theory must justify the normative force of a "use-it-or-lose-it" entitlement (e.g., a daddy quota) that is not compelled but which a family may rationally decline. It must explain why restricting transferability is permissible even if the specific household would maximize utility by transferring the time.
  *   **Why a Requirement:** This is a dominant policy tool in OECD nations. A theory must explain the legitimacy of constraining intra-household bargaining to achieve social ends without resorting to hard coercion.
  *   **Status:** **Non-negotiable.** If the theory cannot justify soft paternalism in this context, it renders a major class of existing policy incoherent.

  **3. The Neutrality Gap Requirement**
  *   **Requirement:** The theory must account for the divergence between formally neutral options (e.g., part-time leave available to all) and predictably gendered uptake (e.g., predominantly taken by women). It must distinguish between *freedom to choose* and *freedom from gendered constraints*.
  *   **Why a Requirement:** Formal neutrality is the default legal standard; gendered outcomes are the empirical reality. A theory that assumes neutrality implies equality is empirically false; a theory that mandates equal uptake violates liberty. It must navigate this gap.
  *   **Status:** **Non-negotiable.** Ignoring the gap renders the theory descriptively inadequate; mandating a specific outcome renders it illiberal.

  **4. The Instrument Distinction Requirement**
  *   **Requirement:** The theory must not collapse the following distinctions: leave length versus wage-replacement rate; cash transfers versus services; and the interests of the child, the parents, and the firm.
  *   **Why a Requirement:** These instruments have different behavioral effects. High wage replacement with short leave induces different behavior than low replacement with long leave. Cash allows exit; services encourage attachment.
  *   **Status:** **Trade-offable.** A theory may prioritize one instrument (e.g., cash over services), but it must acknowledge the trade-off, not deny the distinction exists.

  **5. The Caregiver Neutrality Requirement**
  *   **Requirement:** The theory must distinguish between care provided by a parent, by kin, and by a market provider, and justify any policy preference for one over the others.
  *   **Why a Requirement:** Policy often implicitly favors market care (via subsidies) or parental care (via leave). A theory cannot treat these as fungible without arguing why the *source* of care is normatively irrelevant.
  *   **Status:** **Trade-offable.** A theory may legitimately favor familialism or marketization, but it must declare this preference rather than assuming fungibility.

  **6. The Empirical Consistency Requirement**
  *   **Requirement:** The theory must not prescribe policies that contradict robust empirical findings regarding labor market attachment and statistical discrimination. Specifically, it cannot advocate for extended leave without accounting for the associated penalty in hiring and pay for the demographic most likely to take it.
  *   **Why a Requirement:** Normative theories that prescribe self-defeating outcomes (e.g., policies that help children but economically cripple their mothers) fail the test of practical adequacy.
  *   **Status:** **Non-negotiable.** A policy theory that ignores second-order market effects is merely wishful thinking.

  ***

  ### Impossibility Analysis

  **The Jointly Unsatisfiable Subset**
  There is a subset of requirements that is jointly unsatisfiable under conditions of rational market behavior. This is the **Care-Work Trilemma**, composed of:
  1.  **The Accounting Asymmetry Requirement** (specifically, the mandate to subsidize parental care as a *productive contribution* equivalent to market work).
  2.  **The Empirical Consistency Requirement** (specifically, the mandate to avoid hiring/pay penalties and maintain labor market attachment).
  3.  **The Rationality Assumption** (implicit in all economic policy: agents and firms respond to incentives).

  **The Contradiction:**
  If the state subsidizes parental care as a "productive contribution" (1), it lowers the relative price of home care compared to market labor. Rational agents will substitute toward home care, reducing labor market attachment. Rational firms, observing reduced attachment from a specific demographic, will impose hiring/pay penalties to offset risk (violating 2). To prevent the penalties (2), the state must either stop subsidizing home care (violating 1) or compel market participation (violating the liberty inherent in the Quota and Neutrality requirements). You cannot simultaneously valorize home care as productive work, maintain identical market attachment rates, and allow free choice.

  ***

  ### The Single Eliminating Requirement

  **The Empirical Consistency Requirement (Hiring and Pay Penalties)**
  This is the single requirement that eliminates the largest number of otherwise plausible theories.
  *   **Why:** It eliminates **Libertarian theories** (which ignore the market failure of unpaid care but also ignore the discrimination caused by leave); **Traditionalist/Familialist theories** (which valorize parental care but cannot explain the economic penalty imposed on the caregiver); and **Radical Feminist theories** (which often prescribe long leave to equalize care burdens but frequently underweight the statistical discrimination this triggers in hiring). Any theory that treats leave as a pure right without cost, or care as a pure good without market consequence, fails this test.

  Verdict: An adequate theory must acknowledge that subsidizing parental care as productive work inevitably creates labor market friction that cannot be fully neutralized without compromising parental choice.
