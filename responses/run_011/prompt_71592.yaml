          *   *Requirement:* The theory must account for this valuation asymmetry.

      *   **Cases to Get Right:**
          *   *Case 1:* Use-it-or-lose-it quotas (e.g., "Daddy Months"). Nobody compelled, families may decline. Theory must explain the normative force of a right that can be waived.
          *   *Case 2:* Part-time options. Nominally neutral, predictably taken by one sex (usually women). Theory must address the gap between formal neutrality and substantive outcome.

      *   **Distinctions Not to Collapse:**
          *   Leave length vs. Wage-replacement rate.
          *   Cash transfers vs. Services (in-kind).
          *   Interests: Child vs. Parent vs. Firm.
          *   Caregiver type: Parent vs. Kin vs. Market.

      *   **Empirical Results Not to Contradict:**
          *   Labor market attachment (long leave $\rightarrow$ lower attachment?).
          *   Hiring and pay penalties (statistical discrimination).

      *   **Meta-Analysis:**
          *   Justify why each is a requirement (universality/consensus vs. ideology).
          *   Flag negotiability.
          *   Check for impossibility (incompatibility).
          *   Identify the "killer" constraint.

  3.  **Drafting the Requirements (Iterative Process):**

      *   *Requirement 1: The Productivity Paradox.* Why is market care "work" and home care "leisure" in national accounts? A normative theory must either justify this distinction (e.g., market integration) or explain it away as a measurement error with normative consequences. *Status:* Non-negotiable (central to the policy problem).
      *   *Requirement 2: The Quota Puzzle.* Why mandate a quota if it can be declined? It signals a shift in default norms. Theory must explain the value of changing defaults without coercion. *Status:* Non-negotiable (common policy tool).
      *   *Requirement 3: The Neutrality Trap.* Formal neutrality leading to gendered outcomes. Theory must distinguish between opportunity freedom and substantive equality. *Status:* Non-negotiable (empirical reality).
      *   *Requirement 4: Instrument Distinction.* Length vs. Rate. Cash vs. Care. Theory cannot treat these as perfect substitutes. *Status:* Non-negotiable (economic/behavioral reality).
      *   *Requirement 5: Stakeholder Triangulation.* Child, Parent, Firm. Theory cannot maximize one at the total expense of others without justification. *Status:* Trade-offable (priorities vary), but cannot *ignore* one. Let's make "acknowledging all three" non-negotiable, "prioritizing" trade-offable.
      *   *Requirement 6: Caregiver Neutrality.* Parent vs. Kin vs. Market. Theory must explain why policy often favors one over the others. *Status:* Trade-offable (some theories favor marketization, others familialism).
      *   *Requirement 7: Empirical Consistency.* Hiring/Pay penalties. Theory cannot prescribe a policy proven to harm the intended beneficiaries (e.g., long leave hurting women's hiring) without a compensating justification. *Status:* Non-negotiable (pragmatic constraint).

