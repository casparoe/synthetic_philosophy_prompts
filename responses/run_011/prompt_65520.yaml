      *   *Key Theorists:* Colin Renfrew (Processual/Cognitive), Ian Hodder (Post-Processual/Symbolic), Timothy Insoll (Critique of "Ritual"), Robb (Practice Theory), Brück (Critique of Ritual/Secular divide).
