  **Bottom line**
  Roughly half the framework survives translation, but the core moral architecture collapses. Aristotle's distinction between natural and unnatural wealth-getting maps cleanly onto the separation of operating activities from financing activities, and his skepticism of money as a stable measure finds a technical counterpart in IAS 29. However, the accounting framework lacks any mechanism to recognize a "limit" to accumulation, treating going concern as an infinite horizon rather than a bounded household. The interest prohibition translates only as a rejection of fair value gains on cash, which standards explicitly contradict. Your hunch on return of capital is partially correct but insufficient; going concern actually validates infinite accumulation. The loss is mine: accounting is designed to be morally neutral, so it cannot capture a teleological argument without breaking its own conceptual framework.

  **The map**

  | Aristotle's Claim | Accounting Counterpart | Status |
  | :--- | :--- | :--- |
  | Money is a convention | Unit of Account | Clean |
  | Money measures need | Faithful Representation | Bent |
  | Natural wealth-getting | Operating Cash Flows | Clean |
  | Unnatural wealth-getting | Investing/Financing Flows | Bent |
  | Interest is unnatural | Finance Costs / Effective Interest | No Counterpart |
  | Wealth has a limit | Capital Maintenance / Impairment | Bent |
  | Currency can rot | IAS 29 Hyperinflation | Clean |

  **Clean**
  Aristotle's assertion that money is a convention to facilitate exchange maps directly to the Conceptual Framework's definition of the unit of account. Both treat money as a measurement tool rather than the substance of wealth itself. When Aristotle argues that money makes unlike things comparable, this aligns with the accounting objective of providing comparable financial information across entities. The distinction between natural wealth-getting (household management) and unnatural accumulation finds a structural echo in the Statement of Cash Flows. Operating activities reflect the exchange of goods and services for needs, consistent with Aristotle's "natural" use. Financing activities, where money is raised to generate more money, structurally resemble "unnatural" chrematistics, even if accounting does not moralize the distinction.

  Your hunch on IAS 29 is a clean match. When hyperinflation occurs, the standard concedes the measuring rod has rotted. Restatement machinery admits the unit of account is unstable, validating Aristotle's view that money's value is conventional and contingent. However, IAS 29 attempts to restore stability via a general price index, whereas Aristotle suggests the limit lies in the purpose of the wealth, not the measure. The mapping holds on the instability of the currency, but diverges on the remedy. Accounting seeks to fix the number; Aristotle seeks to fix the intent. This section remains robust because both frameworks acknowledge that without a stable measure, recognition and measurement lose fidelity. The conceptual framework requires faithful representation; if the currency distorts the representation, IAS 29 mandates adjustment. This is the closest accounting comes to admitting money is not a stable store of value, aligning with Aristotle's suspicion of money as a mere convention rather than a natural constant.

  **Bent**
  The mapping bends significantly on interest and limits. Aristotle claims interest is unnatural because money breeds money. Accounting recognizes interest via the effective interest method, treating it as compensation for time and risk. To map Aristotle here, you must bend the definition of "income" to exclude time value, which violates the accrual basis. Your hunch that natural/unnatural maps to return of capital versus return on capital is partially correct but ultimately bent. Return of capital maintains operating capability (natural), but accounting permits unlimited return on capital. There is no "stop" signal in the standards.

  Going concern is the sharpest bend. It presumes the entity never winds down, validating infinite accumulation. Aristotle's "natural" wealth has a terminal point (satisfaction of need); going concern assumes no terminal point. IAS 29 concedes the measure rots, but the framework assumes the entity persists. Furthermore, translating "need" as "demand" smuggles in marginal utility. Accounting measures willingness to pay, not objective subsistence. Fair value hierarchy levels 1 through 3 seek market consensus, not human necessity. The bending hides the moral judgment: accounting treats infinite growth as neutral, whereas Aristotle treats it as a vice. Impairment testing checks for loss of value, not excess of value. You can never impair an asset for being "too profitable." The effective interest method amortizes cost over time, implicitly validating that time itself generates return, which is precisely the "breeding" Aristotle condemns.

  **No line item**
  There is no line item for teleology. Accounting provides information for decision-making; it does not define the "good" decision. Aristotle's claim that wealth-getting has a proper end (telos) cannot be recognized in the financial statements. You cannot book a "virtue" or impair a "vice." The conceptual framework explicitly avoids prescribing economic behavior, focusing instead on faithful representation of whatever behavior occurs. Consequently, the distinction between wealth for use and wealth for accumulation is invisible to the ledger. Both appear as asset increases.

  Your second hunch on going concern is a coincidence of phrasing. Going concern justifies deferring liquidation values, not limiting accumulation. It enables the unnatural by assuming indefinite life. There is no counterpart for "need" as objective subsistence. Accounting recognizes revenue when control transfers, regardless of the buyer's need. If a billionaire buys a tenth yacht, revenue is recognized identically to a family buying a first boat. The framework deliberately refused to have a concept of "enough." Without this refusal, accounting would become regulatory policy rather than financial reporting. To argue Aristotle's point, you must step outside the financial statements into management commentary, where purpose is disclosed but not audited. The framework captures the flow of resources, not the moral quality. You cannot disclose "unnatural" transactions.

  **Whose defect**
  The residue is a limitation of accounting concepts, not a sign Aristotle was vague. Accounting is engineered for universality and neutrality; it must accommodate both household provisioning and speculative accumulation without judgment. Aristotle's claim is normative, defining what *ought* to happen. Accounting is positive, describing what *did* happen. When you try to force a normative claim into a positive framework, the teleology drops out. You are left with the mechanics of exchange without the purpose of the exchange.

  This is not a defect in accounting's utility for capital markets, but it is a defect for moral philosophy. The framework cannot capture the "why," only the "how much." If you want to argue Aristotle's point, you must step outside the financial statements into the management commentary or corporate governance statement, where purpose is disclosed but not audited. The loss of meaning is the price of comparability. Accounting serves investors, not philosophers. It assumes the investor wants maximization. Aristotle assumes the citizen wants virtue. These are incompatible objective functions.

  **Smuggling log**
  I caught myself using "efficiency" to describe natural wealth-getting, which is a modern economic concept Aristotle did not hold. I also translated "value" as "fair value" in the Clean section, whereas Aristotle meant use-value. In the Bent section, I implied accounting "validates" infinite accumulation; strictly, it assumes it for measurement purposes, not moral validation. I also used "risk" to explain interest recognition, which presumes the legitimacy of risk premia that Aristotle would reject. Finally, I treated IAS 29 as a concession on money's nature, when it is technically a measurement adjustment for purchasing power, not a philosophical statement on convention. I also slipped into defending the effective interest method as "logical," which is an argument, not a translation.
