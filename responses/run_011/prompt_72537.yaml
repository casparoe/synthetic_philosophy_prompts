  I'm a CPA — about fifteen years in group consolidation and reporting for a mid-sized industrial company, so my native language is journals, measurement bases and disclosure notes, not philosophy. On Thursday nights I'm in a Great Books group with some friends, and we've just spent two sessions on Book I of the Politics and Book V of the Nicomachean Ethics, which is roughly where Aristotle does money: how it starts out as a convention to get barter moving, how it makes unlike things comparable because it stands in for need, and then the bit near the end of Book I where he splits wealth-getting into the kind that serves the household and has a limit, and the kind that just piles up money for its own sake and doesn't — with lending at interest at the very bottom of the pile, on the grounds that there the money is being made out of the money itself rather than out of the thing money was for. The group split down the middle on whether that's a deep point or a muddle, and I've volunteered to write up the accounting side of it. What I want from you: restate his position as faithfully as you can inside the vocabulary I actually work in — the conceptual framework and what counts as recognition, amortised cost and the effective interest method, fair value and the three-level input hierarchy, IAS 29 and restating the numbers when the currency is inflating out from under you, useful lives and depreciation as the pattern in which an asset's benefits get consumed, impairment, going concern, realised versus unrealised. Do it claim by claim, not as an essay, and keep translating separate from arguing: I don't want a rebuttal about time preference, risk premia or the productivity of capital dressed up as a translation, and I don't want you quietly loading my framework's assumptions into his sentences and then reporting a clean match. I've read those two books twice and skimmed the rest, so I'll notice if you fudge him, but don't write for a classicist either. Where a mapping only works by bending something, say so, and say what got bent.

  Some specific things to sink your teeth into, because these are the ones I argued about at the dinner afterwards. My hunch — which I'd like you to attack rather than flatter — is that the natural/unnatural distinction isn't really about interest at all, it's about the absence of a terminal point: accumulation for its own sake never finishes, whereas household provisioning does. And my hunch is that my own vocabulary has only one faint echo of that, in the difference between a return on capital and a return of capital, plus maybe a louder one in going concern, where its simply presumed the entity never winds down and so never has to justify why it's still accumulating. Tell me if either of those is a real counterpart or a coincidence of phrasing. Second: is IAS 29 basically the profession conceding Aristotle's point that the measuring rod is conventional and can rot, or does the restatement machinery actually assume the opposite, that there's a stable unit behind the numbers? Third: people often render his word for need as "demand" — is that translation, or is that smuggling in a marginalist framework he'd have no use for? And flag every place you catch yourself doing something other than translating, including places where the honest answer is "he has no counterpart because my framework deliberately refused to have one."

  Format it like this, in this order: **Bottom line** (~150 words — how much of the position actually survives the trip, and in one sentence, whether the loss is his fault or mine). **The map** (a table: his claim | closest accounting counterpart | clean / bent / no counterpart). **Clean** (~400 words on the mappings that genuinely hold). **Bent** (~400 words, and for each one say what the bending hides). **No line item** (~350 words on what can't be said in my vocabulary at all, and what kind of thing it is — a value judgment, a teleological claim, a limit concept). **Whose defect** (~250 words: is the residue a limitation of accounting concepts, or a sign the Aristotelian claim was less definite than it sounds when you read it out loud?). **Smuggling log** (~200 words: where you caught yourself arguing, glossing, or translating a word into a concept he didn't have). No bibliography and no suggested reading at the end — I'm not writing a paper, just trying to win an argument in my living room.
