  1. **The Poem**

  **The Ground Bass**

  Gravity pulls the starless dust.
  The crystal grows without a seed.
  No heart beats in the frozen crust.
  Deep weight lies dumb on cold hard rock.

  The root drinks dark beneath the light.
  Green fingers stretch but cannot see.
  A blind reach upward toward the height.
  Deep weight lies dumb on cold hard rock.

  The blood runs hot to hunt the prey.
  A hunger drives the breathing flank.
  Teeth tear the meat and run away.
  Deep weight lies dumb on cold hard rock.

  I know the path I walked before.
  My voice seeks rest it cannot keep.
  I crave the close, then crave the more.
  Deep weight lies dumb on cold hard rock.

  Deep weight lies dumb on cold hard rock.
  The song grows thin.
  Breath stops.
  Still.

  2. **The Score**

  The first four quatrains ascend Schopenhauer's grades of reality through specific physical imagery. Quatrain one depicts unorganised nature: gravity, crystals, and frozen crusts devoid of pulse. Quatrain two moves to vegetable life, defined by blind growth toward light without sight. Quatrain three introduces animal existence, characterized by blood, hunger, and the violence of the chase. Quatrain four isolates the human individual, distinguished by memory, voice, and insatiable craving. Each stanza employs an AABA rhyme scheme, but the refrain functions as a distinct C-line, sonically isolated from the upper voices.

  Dissonance and strife are confined to the upper three lines, mirroring the suffering of the higher grades. In the first three quatrains, the third-line rhyme resolves this tension before the refrain arrives, leaving the bass untroubled. In the fourth quatrain, the sonic resolution of "before" and "more" is undermined by the semantic denial of rest ("cannot keep"), enacting the melody's futile return. The refrain itself is constructed of monosyllables with four heavy stresses, free of motion or agency. It rhymes with nothing else in the poem to embody the bass as a foundation that supports the voices without joining their harmonic conversation.

  The fifth quatrain inverts the texture: the ground bass rises to the top line, while the melodic voices beneath it diminish into silence. This claims that when the individual striving ceases, the mass of reality remains unchanged and dominant. The poem takes one liberty with the chapter: Schopenhauer describes the Will as endless, but the poem concludes with "Still," implying a final cessation. This silence serves the recital's close, offering a rest the philosophy itself denies, allowing the audience to leave the hall rather than strive eternally.
