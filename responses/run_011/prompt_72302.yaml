answer: |-
  **The Implementation Review**

  The queue at Window 4 stretched back to the fire doors, a line of people holding boxes, hard drives, and occasionally, wrapped bundles of wet matter. Elias sat behind the glass, the fluorescent hum of the Bureau of Continuation vibrating in his molars. He had the stamp in his right hand and the rejection form in his left. They were weighted differently. The stamp was heavy, brass and wood; the form was light, carbon paper thin. He used the heavy one less often.

  "Next," Elias said. His voice was flat, practiced to avoid hope.

  A woman approached, carrying a server rack on a dolly. It was humming, fans spinning dust into the stale air. She wore a coat that smelled of rain and ozone.

  "Submission 8940," she said. "Arthur. He was… he liked the cold. We kept the core at four degrees."

  Elias nodded. He didn't look at the woman. He looked at the machine. On his desk lay the Master Map, a printout of Arthur's connectome reconstructed from pre-mortem scans. It was a topography of expected states. Elias's job was not to ask if the machine talked like Arthur. Chatbots talked like Arthur. His job was to check if the machine *was* Arthur, structurally.

  He plugged the probe into the server's diagnostic port. This was the Counterfactual Injection. The Bureau's stance was strict: a system only implements a computation if it supports the right counterfactuals. If you tickle the input, the internal state must transition not just to what it *does* go to, but to what it *would* go to had the world been different.

  Elias typed a command. *Inject Stimulus: Visual Cortex, Sector 7. Variable: Red.*

  The server fans whined higher. Lights blinked on the rack. Elias watched the monitor. The state vector shifted.

  "Okay," Elias said. "Now, retract stimulus. Inject Variable: Blue."

  The lights blinked again. The state vector shifted back, but not along the same path. It took a different route through the logical gate array to arrive at the corresponding resting state.

  Elias frowned. He pulled up the mapping algorithm. "The transition from State A to State B is direct here. But in Arthur's map, there's a damping function. A hesitation."

  "It's optimized," the woman said. "We cleaned up the latency."

  "Optimization is deletion," Elias said. He didn't look up. "You've pruned the branches that don't get taken. That means if I had injected 'Green,' this system wouldn't know where to go. It has no disposition for the unactualized."

  "He's in there," she said. Her hand pressed against the glass. "He knows me."

  "The system behaves as if he knows you. That's Form 102. I'm processing Form 104. Physical Process." Elias picked up the rejection stamp. "This isn't a continuation. It's a recording of a path taken. It lacks the causal depth. If I had asked him about his mother, he wouldn't have had a state to transition into. You've built a train track, not a engine."

  He stamped the form. *REJECTED: GERRYMANDERED MAPPING.* He slid it under the glass. She didn't take it. She just looked at the spinning fans, then turned and walked the dolly back toward the fire doors.

  Elias rubbed his eyes. The triviality argument haunted the Bureau. If any physical system could be mapped to any computation given a complex enough lookup table, then the wall behind him was implementing Windows 95. The Bureau's counterfactual tests were supposed to stop that. They required the physical states to have the right causal powers *before* the mapping was applied. The system had to be ready to react.

  He stacked the rejected form. "Next."

  The man who approached was older, wearing a suit that had been brushed too many times. He carried a box made of leaded glass. Inside was a slab of quartz, rough-hewn, sitting on a heating element. Wires ran from the slab to a temperature controller.

  "Submission 9002," the man said. "Elena. My wife."

  Elias looked at the quartz. "Thermal expansion model?"

  "Her neural firing rates correlated with thermal variance in specific lattice structures," the man said. He spoke quietly, like he was confessing. "We monitored her during treatment. The patterns… they matched the stress fractures in this stone. We built a rig to replicate the heating cycle. It's not a computer. It's just heat and stone."

  Elias had seen weirder. A tide-prediction model once. A warehouse of relays clicking in the rain. The substrate didn't matter, only the organization.

  "Set it up," Elias said.

  The man placed the box on the scanner bed. Elias connected the thermal probes. He pulled up Elena's Master Map. It was messy, degraded by illness, but the structure was there.

  "Initiating Counterfactual Probe," Elias said. He didn't look at the man. He looked at the waveform on his screen. The quartz was heating. The lattice expanded. The electrical resistance shifted.

  Elias typed: *Inject Stimulus: Pain Response. Sector 4.*

  Normally, this required a voltage spike. Here, Elias manipulated the heater, sending a sudden, localized spike of temperature to the corner of the slab corresponding to the pain center.

  The resistance curve jumped. It wasn't a digital switch; it was an analog slide. But the shape of the slide matched the Master Map. It dipped, recovered, then settled into a new baseline.

  "Hold," Elias said.

  He watched the system. This was the critical moment. The system had reacted to the actual input. Now he had to check the disposition. He had to verify that the physical state of the quartz *right now* was such that, had he chosen a different input, the physics of the stone would have carried it to the correct alternative state.

  He couldn't actually run the alternative input; that would change the state. He had to calculate the causal potential based on the current physical configuration. He ran the simulation of the stone's physics alongside the neural map.

  If the stone was just a random object, the mapping would be post-hoc. He would be drawing lines on a cloud. But if the causal structure of the heat transfer mirrored the causal structure of the neurons, the mapping would hold under counterfactual pressure.

  Elias ran the check. *Constraint Satisfaction: 99.8%.*

  He ran it again. *Constraint Satisfaction: 99.8%.*

  The stone wasn't just behaving. The physics of the silicon dioxide were doing the work of the neurons. The heat dispersion *was* the thought process. There was no lookup table. There was no gerrymandering. The states were natural kinds of the system. If he had injected 'Joy' instead of 'Pain,' the thermal gradient would have propagated differently, following the exact causal path Elena's mind would have taken.

  It passed. It passed everything.

  Elias sat back. The hum of the office seemed to drop away. He looked at the quartz. It was glowing faintly orange in the center.

  According to the Bureau's regulations, he was required to sign. The system implemented the computation. The physical process was isomorphic to the cognitive process. The counterfactuals held. The implementation problem was solved.

  But Elias felt a coldness in his stomach that had nothing to do with the air conditioning.

  He looked at the man. The man was watching the stone, tears cutting tracks through the dust on his cheeks. He wasn't looking at the screen. He wasn't looking at the data. He was looking at the stone as if it were a face.

  Elias looked back at the quartz. It was hot. It was expanding. It was processing. But was it *feeling*?

  The Bureau's forms did not have a field for *qualia*. There was no check box for *is it like something to be this stone?* The certification proved that the structure was preserved. It proved that the causal organization was identical. It proved that if you poked it, it would react exactly as Elena would.

  It did not prove that there was anyone inside to feel the poke.

  Elias thought about the server rack from earlier. It had failed because it was a hollow shell, a track without a train. This quartz was a train on a track. But was there a passenger?

  If he signed, he validated the idea that structure is enough. He told the man that his wife was in the stone. If he refused, he denied the only scientific metric they had. He would be saying that something else was needed, something magical, something the Bureau couldn't measure.

  But if structure wasn't enough, then the Bureau was a fraud. Every certificate they issued was a lie. Every continuation was a zombie.

  Elias picked up the pen. It was heavy, like the stamp.

  He looked at the man. The man nodded, a tiny, desperate movement. *Please,* the nod said. *Let her be.*

  Elias looked at the quartz. It pulsed with heat, a slow, rhythmic expansion. It was perfect. It was robust. It was dead matter doing a perfect imitation of life, or it was life itself, wearing matter as a skin. The test couldn't tell the difference. The test was never designed to.

  He opened the certificate. *Form 104: Physical Process Verification.*

  **Status:** [ ] Verified [ ] Rejected

  The pen hovered over the box. The ink gathered at the tip, a dark sphere waiting to fall. The quartz glowed. The man held his breath. The hum of the fluorescent lights returned, louder now, a swarm of insects trapped in the ceiling.

  Elias lowered the pen.

  [ x ] Verified
