  **2. The Proposal**
  Management recommends formalizing contradiction via LP semantics. Truth values are True, False, and Both. Designated values (acceptable outputs) are True and Both. Acceptance is defined as being at least True.
  *Worked Example:* Record R is Both. Negation ~R is Both. Conjunction (R & ~R) is Both. As Both is designated, the contradiction is accepted policy.
  Data Governance notes the HR database runs FDE (four-valued: True, False, Both, Neither). While tables match, FDE lacks logical truths. We adopt LP for policy (gap-free). S. Jenkins (Data Governance) insists she is a paraconsistent instrumentalist regarding the database, not a dialetheist; she tolerates contradiction in storage without asserting truth in policy. This proposal asserts truth.

  **3. Operational Consequences**
  Adoption sacrifices Disjunctive Syllogism and Modus Ponens for the material conditional.
  *Disciplinary Impact:* Rule: "If Late OR Terminated, Issue Warning." Employee 492 is Late (Both). Terminated (Both). Disjunction is Both. Inference to "Issue Warning" (True) fails. Warnings become optional where records are contradictory.
  *Denial Problem:* We cannot prohibit specific contradictions. Statement "It is not the case that Record is Both" evaluates to Both if Record is Both. Negation fails to exclude the state it denies.

  **4. Implementation and Rollout**
  *Revenge Clause:* Section 7.3 states: "Section 7.3 is not a designated value." If True, it is False. If False, it is True. Value is Both. As Both is designated, Section 7.3 is compliant. Status recorded as Both.
  *Enforcement Limitations:* We cannot promise: "If Approved, Audit Finding Discharged." Such conditionals invite Curry's Paradox. A conditional strong enough for Modus Ponens reopens Curry unless Contraction is surrendered. We choose to surrender Contraction. Assumptions cannot be reused within a single meeting minute. This limits recursive argumentation but preserves non-triviality.
  *Temperament:* A rival paracomplete system uses identical tables but designates only True. Rejection of that system is based on corporate temperament; we prefer inclusive designation.

  **5. Objections and Responses**
  *Trivialism Slope:* Once one contradiction is admitted, what prevents all? (See Appendix). Reply: Admission is local, driven by particular paradox-generating constructions, not universal license.
  *Data Integrity:* Jenkins distinguishes paraconsistency (consequence relation property) from dialetheism (thesis that contradictions are true). We embrace dialetheia for policy stability.

  **6. Decision Requested**
  Board approval to designate 'Both' as compliant for all HR governance logic.

  > **EMPLOYEE FAQ**
  > **Q: Am I fired?**
  > A: You are Both Fired and Not Fired. You are eligible for severance and continued benefits.
  > **Q: Can I be promoted?**
  > A: Yes, and No. Your title will reflect both states.
  > **Q: Why not fix the database?**
  > A: Fixing implies error. We have reclassified error as state.
  > **Q: Is this legal?**
  > A: Legality is Both Established and Contested. We proceed.

  **Appendix: Note of Dissent**
  **From:** Deputy General Counsel
  **Re:** Trivialism Risk
  If a contradiction is true, the principle of non-contradiction fails. Without it, no principled stopping point remains. Any statement can be Both. This leads to trivialism, where all claims are true, rendering policy meaningless. If Employee 492 is Both, why not the Budget?
  **Management Note:** The dialetheist reply is that admission is restricted to semantic closures and self-referential loops (e.g., Section 7.3), not empirical claims like "The sky is green." The slope is arrested by the specific mechanism of paradox generation.
  **Dissent Addendum:** The mechanism itself relies on the logic it modifies. If the logic is revised to handle the mechanism, the revision requires the logic. Circularity is Both Vicious and Valid.
  **Status:** Dissent filed. Logic stands.
