answer: |-
  # Workshop Instrument: The Source and the Signal

  **Instructions:** Read each scenario. Circle exactly one response. Work quickly; do not overthink. There are no correct answers.

  **1.** You are lost in a city. A stranger stops you and says, "The train station is two blocks north." They look confident. You have no map and cannot see the station.
  A. Walk north immediately.
  B. Ask another person first.
  C. Walk north only if you felt you were heading that way.

  **2.** You are lost in a city. Your GPS app says, "The train station is two blocks north." It shows full signal. You have no map and cannot see the station.
  A. Walk north immediately.
  B. Check a second app first.
  C. Walk north only if you felt you were heading that way.

  **3.** You are researching a treaty. A archived letter from a dead diplomat says, "The clause was signed at midnight." You cannot contact the diplomat.
  A. Cite the time as fact.
  B. Look for a second document.
  C. Cite the time only if it fits your theory.

  **4.** You are researching a treaty. An AI summary of the archives says, "The clause was signed at midnight." You cannot check the raw data.
  A. Cite the time as fact.
  B. Look for a second summary.
  C. Cite the time only if it fits your theory.

  **5.** In a hospital, a nurse tells you, "The patient's oxygen is dropping." You cannot see the monitor.
  A. Call the doctor immediately.
  B. Check the monitor yourself.
  C. Act only if the patient looks unwell.

  **6.** In a hospital, an automated alarm says, "The patient's oxygen is dropping." You cannot see the monitor.
  A. Call the doctor immediately.
  B. Check the monitor yourself.
  C. Act only if the patient looks unwell.

  **7.** A professor in a lecture says, "Quantum entanglement allows instant communication." You are not a physicist.
  A. Write it down as true.
  B. Check a textbook later.
  C. Write it down only if it makes sense to you.

  **8.** A search engine snippet says, "Quantum entanglement allows instant communication." You are not a physicist.
  A. Write it down as true.
  B. Check a textbook later.
  C. Write it down only if it makes sense to you.

  **9.** A friend calls and says, "I am deeply depressed." You hear no background noise.
  A. Offer support immediately.
  B. Ask if they are joking first.
  C. Offer support only if they seemed sad recently.

  **10.** A chatbot writes, "I am deeply depressed." You know it is code.
  A. Alert the developers immediately.
  B. Ignore the statement.
  C. Alert developers only if the chat seems coherent.

  ***

  # Facilitator's Key & Analysis

  ### 1. Scoring Logic
  Tally the responses for Human items (1, 3, 5, 7, 9) and Machine items (2, 4, 6, 8, 10) separately.
  *   **Mostly A (Act):** Default Trust.
  *   **Mostly B (Verify):** Reductionism.
  *   **Mostly C (Match):** Content/Plausibility.
  *   **Mixed (Human A, Machine B):** Source Sensitivity.

  **Stability Index:** If the dominant response for Human items matches the dominant response for Machine items, the participant is **Stable**. If they differ (e.g., Human=A, Machine=B), they are **Unstable**.

  ### 2. The Leaves (Positions)
  *Note: Deflationism is merged with Global Reductionism. Both treat testimony as ordinary inference requiring positive reasons; the instrument cannot distinguish the metaphysical claim from the behavioral requirement.*

  1.  **Global Reductionist:** "Verify everything, always." (Mostly B, Stable).
      *   *Least Comfortable Item:* 1 (Human Directions). Social friction makes constant verification awkward.
  2.  **Local Reductionist:** "Trust depends on the specific source." (Mixed A/B, Unstable).
      *   *Least Comfortable Item:* 4 (Machine History). Treating a summary differently than a letter implies the machine has a 'reputation' to assess.
  3.  **Entitlement (Anti-Reductionist):** "Innocent until proven guilty." (Mostly A, Stable).
      *   *Least Comfortable Item:* 10 (Chatbot Emotion). Knowing the source is non-sentient makes default trust feel foolish.
  4.  **Commitment View:** "Belief requires someone to hold accountable." (Human A, Machine B, Unstable).
      *   *Least Comfortable Item:* 6 (Machine Safety). Ignoring an alarm because no one is 'responsible' for it risks harm.
  5.  **Externalist:** "If the channel works, trust it." (Mostly A, Stable).
      *   *Least Comfortable Item:* 3 (Dead Diplomat). Reliability is hard to assess when the source is gone.
  6.  **Content/Plausibility:** "Does it fit what I know?" (Mostly C, Stable).
      *   *Least Comfortable Item:* 5 (Nurse Alert). Counter-intuitive medical data should be acted on, not filtered.

  ### 3. The Axes
  The instrument sorts participants across three dimensions:
  1.  **Default Credence:** Does an uncorroborated assertion start at 0% (Verify), 50% (Content), or >50% (Act)?
  2.  **Source of Entitlement:** Does the right to believe come from the Hearer's check (Reductionism), the Teller's commitment (Commitment), the Channel's reliability (Externalism), or the Content's fit (Plausibility)?
  3.  **Agency Sensitivity:** Does the presence of a mind (Human vs. Machine) change the epistemic rule?

  **Cell Mapping:**
  *   **Verify/Verify:** Global Reductionist.
  *   **Act/Act:** Entitlement or Externalist.
  *   **Act/Verify:** Commitment or Local Reductionist.
  *   **Filter/Filter:** Content View.
  *   **Verify/Act:** *Unoccupied Cell* (See below).

  ### 4. Unoccupied Cells
  **Verify Human / Act Machine.**
  *   *Status:* Empty.
  *   *Reason:* Unattractive. No major epistemological view holds that automated systems are *inherently* more trustworthy than humans without specific reliability data. This would imply a bias toward technology over agency that lacks philosophical defense.

  ### 5. Inseparable Pairs
  **Entitlement vs. Externalism.**
  *   *Reason:* Both yield "Act/Act" (Stable). The instrument measures behavior, not the *reason* for the behavior (normative right vs. factual reliability). To separate them, you would need to ask *why* they trusted, which violates the "no thesis" constraint.
  **Commitment vs. Local Reductionism.**
  *   *Reason:* Both yield "Act (Human) / Verify (Machine)" (Unstable). One says machines *cannot* testify; the other says machines *can* but need more proof. The behavioral output is identical in this binary choice.

  ### 6. Stability Report
  *   **Stable Participants:** Hold a universal rule (Global Reductionism, Entitlement, Externalism, Content).
  *   **Unstable Participants:** Hold a source-sensitive rule (Commitment, Local Reductionism).
  *   **Diagnostic Warning:** If a participant scores "Unstable" but claims to hold a "Universal" view (e.g., "I trust all assertions"), the instrument reveals a conflict between their stated philosophy and their intuitive practice regarding machines.

  ### 7. Housekeeping
  *   **Time:** 15 Minutes (5 mins reading/circling, 5 mins tallying, 5 mins initial reflection).
  *   **Names:** Established names (Burge, Hume, Goldman) are omitted from the participant sheet to prevent signaling. They are included here for facilitator reference only.
  *   **Jargon:** Items use "Cite," "Check," "Act" rather than "Justify," "Corroborate," "Believe."
