      *   *Global vs. Local Reductionism:* Often hard to distinguish in practice without deep probing, but for this instrument, we can treat "Global" as "Need proof for *any* source" and "Local" as "Need proof for *this* source."
      *   *Commitment View vs. Anti-Reductionism:* Anti-reductionism often relies on the *norm* of assertion, which implies commitment. However, the Commitment View specifically fails if there is *no one* to hold accountable (like an LLM). This is a key differentiator for the workshop theme.
      *   *Externalism vs. Reductionism:* Externalism allows trust without *knowing* reliability. Reductionism requires *having* reasons for reliability.
      *   *Deflationism:* Often collapses into Content/Plausibility or Reductionism. Let's keep it distinct as "It's just induction, no special 'testimony' category."

      *Decision:* I will keep the distinct leaves but ensure the scoring key handles the nuances.
      1.  Global Reductionist (Verify everything).
      2.  Local Reductionist (Verify based on context).
      3.  Default Trust (Anti-Reductionist).
      4.  Commitment-Based (Requires an accountable agent).
