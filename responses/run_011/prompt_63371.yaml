      *   Or: "If your people are too 'happy' to have children, is it happiness or is it a refined form of misery where comfort has replaced purpose?"
      *   *Selection:* Focus on the definition of "maintenance." Hume argues people have families if they think they can maintain them. If they don't, why? Is it real poverty or artificial standard of living enforced by the state/society?
      *   *Drafting the Question:* "Have your own laws and the manners they encourage made the cost of 'maintenance' so artificially high that you are now legislating against the very human nature you claim to protect?"

  8.  **Drafting the Response (incorporating constraints):**
      *   *Tone:* Analytical, respectful of Hume's philosophy, practical for a policy analyst.
      *   *Structure:*
