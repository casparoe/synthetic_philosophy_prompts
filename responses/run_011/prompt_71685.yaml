answer: |-
  **Recommended Reading**

  **Ilkka Niiniluoto, "Verisimilitude: The Third Phase," *PSA: Proceedings of the Biennial Meeting of the Philosophy of Science Association*, Vol. 1998, Volume Two: Symposia Papers (1998), pp. S313–S323.**

  This paper is preferable to the broader SEP entry for a seminar because it concisely maps the technical transition from Popper's content-based definition to the similarity-based accounts necessitated by the Miller-Tichý collapse. It provides the formal vocabulary (min-sum, min-max principles) required to dissect the three abbey accounts without getting bogged down in introductory exposition.

  ***

  **Technical Analysis for the Seminar**

  **1. The Popperian Collapse and the Ranking**
  Under Popper's original content-and-consequence definition, your proposed ranking collapses entirely. Popper defined truthlikeness ($Vs$) such that theory $A$ is closer to the truth than $B$ if $A$ entails more true consequences and no more false consequences than $B$. As Miller and Tichý demonstrated in 1974, this entails that for any two false theories, neither can be closer to the truth than the other. Since William, Jorge, and Bernard all propose false theories (William's is incomplete and probabilistic; Jorge's is theologically false; Bernard's is factually false), a strict Popperian must declare them *equally* distant from the truth. The intuition that William is "nearest" is technically inadmissible in the first phase of verisimilitude research.

  **2. The Likeness Account and Metric Dependence**
  Niiniluoto's "third phase" (likeness-based accounts) rescues the ranking, but only by introducing a similarity metric over logical space.
  *   **William:** On a likeness account, William ranks highest because the "possible world" he describes (a human murderer, a mechanical poison, a hidden room) shares the most structural features with the actual world.
  *   **Jorge:** Jorge's account is ontologically distant (divine agency vs. human agency) but structurally isomorphic regarding the *sequence* of events. Whether Jorge ranks above Bernard depends entirely on the chosen metric. If the metric weights *predictive accuracy of events* heavily (a "min-sum" approach), Jorge may rank higher than Bernard. If the metric weights *causal ontology* (a "min-max" approach), Jorge ranks lower, as his fundamental law (Revelation) is further from the truth than Bernard's fundamental law (heresy), even if Bernard's specific accusations are also false.
  *   **Bernard:** Bernard ranks lowest on most plausible metrics because his account fails on both ontology (heresy vs. curiosity) and specific event mapping (wrong victims, wrong mechanisms).

  **3. Jorge's Challenge: Predictive Success vs. Truthlikeness**
  Jorge's case exposes a tension the likeness approach often papers over: the distinction between *truthlikeness* (an ontological relation between theory and world) and *empirical adequacy* (the yield of true consequences). Jorge's theory has high empirical adequacy but low truthlikeness.
  *   **Does this expose a flaw?** It suggests that likeness accounts must be sensitive to *nomic* (law-like) similarity, not just accidental generalizations. If the metric treats the "seven trumpets" as a mere coincidence rather than a law, Jorge's likeness score drops.
  *   **Cognitive Value:** Jorge's case confirms that truthlikeness is not the sole cognitive value. The community acts on Bernard's account not because it is truthlike, but because it is *actionable* (it identifies a scapegoat). Jorge's account is valued for its *coherence* with the monks' background beliefs. This supports the view that verisimilitude is a regulative ideal, while pragmatic utility often drives belief fixation.

  **4. Where the Lens Strains: The Epistemic Problem**
  The technical literature largely treats truthlikeness as a *semantic* relation: given Theory $T$ and World $W$, what is the distance? Eco, through William, presses the *epistemic* problem: we are inside the inquiry.
  *   **William's Doubts:** William's late realization that "the order the mind imagines is not the order of the world" challenges the realist presupposition of truthlikeness. To calculate $Vs(T, World)$, one must know the World. William admits he cannot fully know the World, only signs of it.
  *   **The Strain:** The technical literature assumes we can assess $Vs$ from a "God's eye view" to validate the metric. Eco argues that within the inquiry, we cannot know if we have achieved high verisimilitude, only that our signs are coherent. The novel suggests that *knowing* one is close to the truth is impossible; one can only know that one has reduced error. This highlights the gap between *actual* truthlikeness and *estimated* truthlikeness, a distinction the technical literature acknowledges but rarely dramatizes.

  **5. What the Novel Expresses That Toy Examples Cannot**
  Toy numerical examples (e.g., "It is raining" vs. "It is raining and cold") treat theories as static propositions. *The Name of the Rose* expresses three dimensions the literature misses:
  *   **The Ethics of Error:** In the literature, a false theory yields a lower $Vs$ score. In the abbey, acting on Bernard's false theory yields torture and execution. The novel forces the question: when does the pursuit of a more truthlike theory (William's slow inquiry) become morally inferior to acting on a less truthlike one (Bernard's quick justice) to restore order?
  *   **The Causal Power of Falsehoods:** Jorge's false theory *causes* the deaths. He arranges the murders to fit the Apocalypse. In toy examples, the world is independent of the theory. Here, the false theory modifies the truth-makers. This creates a feedback loop where verisimilitude is dynamic, not static.
  *   **The Labyrinthine Nature of Evidence:** Toy examples assume evidence is given. William's inquiry shows that evidence is hidden, destroyed, or poisoned. The "distance" to the truth is not just logical; it is physical and adversarial. The novel expresses that truthlikeness is not merely a measure of propositional accuracy, but a measure of *survival* within a hostile informational environment.
