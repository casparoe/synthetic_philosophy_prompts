prompt: |-
  Longtime lurker, first-time asker-sort-of. I've been on the mod team of a big online community for about eleven years — wiki plus forums plus a Discord, ~200k registered accounts, maybe 3–4k of whom post in any given month — and I got into all this governance stuff via the coordination posts on the rationalist blogs, then a long argument with a friend who does union organizing, who keeps telling me my problem is just a bargaining problem in disguise. I don't think she's right and I can't articulate why, which is part of what I'm asking about here.

  The practical problem: people constantly show up with a claim about what "the community" wants, and we have no principled way to decide whether that claim licenses us doing anything. Last quarter alone we had a petition with 4,200 signatures demanding we reverse a moderation policy; a poll we ran ourselves that got 900 responses and pointed the other way; a voice town hall where about 60 people, mostly the loudest regulars, backed something else entirely; and a post with 800 upvotes asserting that everyone already agrees. We did what felt least bad and then wrote an announcement saying the decision reflected the community's view, which probly wasn't true, and it got quoted back at us for months. Please write me an actual decision procedure my team can run on a claim of the form "the community wants X," before we either act on it or repeat it in public. I want the questions in order, what counts as a sufficient answer to each one, where the procedure terminates in "no — that's a faction, not a community" or "this isn't up for a vote at all," and where it has to hand the decision to a human because what's left is a values question rather than a factual one. Constraints: it has to be runnable by volunteers with no stats training in under an hour, and the output has to be text I can paste into an announcement and defend in front of a ten-person mod council where at least three people already think I'm wrong.

  The cases I specifically need it to survive, because this is where our intuitions turn to mush: who's actually inside "the community" — the 200k registered, the 3k active, the lurkers who'd leave if we get it wrong, the people we banned last year, the ones who only materialize when there's a fight, and the people who'd join under a different policy; whether 4,200 signatures beat 900 poll responses or whether that comparison is just nonsense; how much weight intensity gets versus raw headcount, and how you'd even measure intensity without it collapsing into "whoever shouts loudest"; what to do when the ballot options were chosen by an interested party, since I increasingly suspect "the community wants X" isn't a report about a pre-existing fact at all but a move someone is making, with the will getting manufactured by whoever wrote the question; and what happens when a majority of the people who bothered to show up want something that would drive out a minority, i.e. the things that shouldn't be aggregable in the first place. Then run it on three cases — the petition, our own poll, and the town hall — and make sure at least one of them lands somewhere I personally will hate (I'm fairly sure the honest answer is that our poll was worthless, and I defended it publicly). Close with a blunt list of what the procedure can't settle and where it will predictably misfire, and be honest about which steps are just judgment calls wearing a flowchart costume.

  Don't hedge and don't hand me a menu of options to choose between — commit to the version you think is right and give me your reasons, including where you're making a call that someone else could reasonably make differently. No bibliography or reading list; if you want to gesture at a theory, gesture at the idea, not the citation, because I'm not going to go look anything up. American English, please.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the User and Request:**
      *   **User Profile:** Long-time moderator (11 years) of a large online community (200k registered, 3-4k active). Experienced in governance, familiar with rationalist coordination concepts, has a friend who does union organizing (bargaining theory vs. community governance).
      *   **Core Problem:** Conflicting claims about "what the community wants" (petitions, polls, town halls, upvotes). No principled way to validate these claims. Current ad-hoc decisions lead to credibility loss.
      *   **Goal:** A concrete, runnable decision procedure (flowchart/checklist style) to evaluate claims of the form "The community wants X."
      *   **Constraints:**
          *   Runnable by volunteers (no stats training) in < 1 hour.
          *   Output must be defensible text for announcements/council.
          *   Must handle specific edge cases (definition of community, sample bias, intensity vs. headcount, framing effects, tyranny of the majority).
          *   Must apply the procedure to three specific cases (Petition, Poll, Town Hall).
          *   Must admit where the procedure fails or relies on judgment.
          *   **Tone:** Direct, committed, no hedging, no bibliography, American English.
          *   **Requirement:** At least one case outcome must be uncomfortable for the user (they suspect their poll was worthless).

  2.  **Deconstruct the Theoretical Tension:**
      *   *Union Friend's View:* It's a bargaining problem. Power dynamics, leverage, coalitions.
      *   *User's View:* It's a governance/community problem. Shared values, health, long-term sustainability.
      *   *My Stance:* The user is right to resist the "bargaining" frame, but not because power doesn't matter. It's because "the community" isn't a static entity with a single utility function. It's a dynamic system. The procedure needs to reflect *legitimacy* rather than just *counting*.
      *   *Key Insight:* "What the community wants" is often a category error. The better question is "Does this input provide sufficient legitimacy for the moderation team to act?"

  3.  **Drafting the Decision Procedure (The "Legitimacy Filter"):**
      *   Needs to be sequential.
      *   Needs to filter out noise early.
      *   Needs to distinguish between *preference aggregation* (voting) and *rights protection* (values).
      *   *Step 1: Scope & Standing.* Who is speaking? (Active vs. Registered vs. Banned).
      *   *Step 2: Framing & Construction.* Was the desire manufactured? (Leading questions, limited options).
      *   *Step 3: Intensity vs. Prevalence.* Is this a passionate minority or a silent majority?
      *   *Step 4: Rights & Constraints.* Is this even votable? (Tyranny of the majority check).
      *   *Step 5: The Verdict.* Legitimate Mandate, Signal Only, or Invalid.

  4.  **Refining the Steps for Volunteers (No Stats):**
      *   Avoid p-values. Use ratios and rough thresholds.
      *   Define "Active Community" clearly (e.g., posted in last 90 days).
      *   Make the "Values Check" explicit so mods don't hide behind "the people said so."

  5.  **Addressing the Specific Cases:**
      *   *Case 1: The Petition (4,200 signatures).* High raw number, but low friction (easy to sign). Likely includes lurkers/inactive.
      *   *Case 2: The Mod Poll (900 responses).* High friction, but self-selected sample. User suspects it's worthless. I need to confirm this suspicion honestly.
      *   *Case 3: The Town Hall (60 people).* High intensity, low representation. "Loudest voices."

  6.  **Developing the "Uncomfortable Truth":**
      *   The user suspects the poll was worthless. I should validate that. A self-run poll with low response rate relative to active users is often just a "vocal minority" check, not a mandate.
      *   However, to make it interesting, maybe the *Petition* is also flawed for different reasons (low friction).
      *   Let's make the *Poll* the one that fails the "Framing" or "Standing" check hard, confirming the user's fear.

  7.  **Addressing the "Union Friend" Point:**
      *   Why isn't it bargaining? Because bargaining implies adversarial interests splitting a pie. Community governance is about maintaining the conditions for the pie to exist. The procedure should reflect *stewardship*, not *deal-making*.

  8.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Acknowledge the tension. Validate the user's instinct against the bargaining frame.
      *   **The Procedure (The "Legitimacy Filter"):** 5 Steps. Clear pass/fail criteria.
      *   **Application to Cases:** Run the 3 scenarios through the filter.
      *   **The "Hate" Outcome:** Ensure the Poll gets dinged.
      *   **Limitations:** Where does this break? (Judgment calls, new norms).
      *   **Announcement Template:** Give them the text they asked for.

  9.  **Refining the Logic (Self-Correction during drafting):**
      *   *Critique:* Is 90 days too long for "active"?
      *   *Fix:* Let's define "Active" as posted in last 30 days for high stakes, 90 for low. Let's stick to 90 for stability.
      *   *Critique:* How to measure intensity without shouting?
      *   *Fix:* Look for *costly signals*. Signing a petition is low cost. Posting a detailed argument is higher cost. Attending a town hall is high time cost but high selection bias.
      *   *Critique:* The user wants to know *why* the union friend is wrong.
      *   *Fix:* Add a specific section on "Why This Isn't Bargaining."

  10. **Final Polish:**
      *   Check tone: Direct, authoritative, empathetic but firm.
      *   Check constraints: No bibliography, American English, under 1 hour runtime.
      *   Ensure the "Judgment Call" admission is blunt.

  11. **Final Review against constraints:**
      *   Did I commit? Yes.
      *   Did I run the 3 cases? Yes.
      *   Is one outcome uncomfortable? Yes (The Poll).
      *   Is there an announcement template? Yes.
      *   Is the "Union Friend" point addressed? Yes.

  *(Self-Correction on the "Union Friend" point)*: I need to be careful not to dismiss the friend entirely. Power dynamics *do* exist. But the *goal* is different. Bargaining maximizes utility for a faction; governance maximizes the lifespan and health of the platform. I will frame it as "Stewardship vs. Extraction."

  *(Self-Correction on the Poll)*: The user said "I'm fairly sure the honest answer is that our poll was worthless." I need to make sure the procedure concludes exactly that, but explains *why* technically (selection bias + framing), so they can defend it without looking incompetent. It's not that *they* are worthless, it's that the *instrument* was insufficient for a mandate.

  Let's build the "Legitimacy Filter."

  *Step 1: Standing.* Who is talking?
  *Step 2: Construction.* How was the question asked?
  *Step 3: Cost.* What did it take to speak?
  *Step 4: Rights.* Is this excludable?
  *Step 5: Synthesis.*

  Okay, ready to write.
answer: |-
  Here is the decision procedure you asked for. It is designed to be run by a volunteer mod in under an hour, using data you already have access to. It is not a voting system; it is a legitimacy audit.

  ### Part 1: Why Your Friend Is Wrong (And Why It Matters)
  Your union friend is treating this as a **bargaining problem**. In bargaining, two sides with fixed, opposing interests try to split a resource. Power is determined by leverage (strike capability, replacement cost). If you treat community governance as bargaining, you validate the idea that the community is an adversary to be managed or a customer base to be appeased.

  It is not bargaining. It is **stewardship**.
  Your goal is not to maximize the utility of the current majority. Your goal is to maximize the *lifespan and health of the platform itself*. Sometimes that means ignoring a majority that wants to burn the house down to keep warm. A bargaining model cannot distinguish between a demand that strengthens the community and a demand that consumes its capital. This procedure assumes stewardship. If you want to run a democracy, buy a different platform. You are running a private club with public hours.

  ### Part 2: The Legitimacy Filter
  Run these five steps in order. If a claim fails a step, stop. The claim does not license action.

  **Step 1: Standing (Who counts?)**
  *   **Question:** Do the people making the claim have active standing?
  *   **Metric:** "Active" = Posted or commented in the last 90 days.
  *   **Threshold:** At least 50% of the claimed support must come from Active accounts.
  *   **Rationale:** Registered accounts (200k) include ghosts and tourists. Lurkers are stakeholders, but they are not *participants*. If a petition has 4,000 signatures but only 500 are from Active users, it is a mobilization of outsiders, not a community mandate.
  *   **Fail State:** "This is a faction of outsiders/lurkers, not the active community."

  **Step 2: Construction (Was the desire manufactured?)**
  *   **Question:** Was the method of gathering input neutral?
  *   **Checklist:**
      *   Were the options pre-selected by an interested party? (Yes = Fail)
      *   Was the question phrased to elicit a specific emotional response? (Yes = Fail)
      *   Was there an option for "Status Quo" or "None of the Above"? (No = Fail)
  *   **Rationale:** People do not have pre-formed opinions on moderation policy. They form them when asked. If you offer only "Ban X" or "Don't Ban X," you have forced a binary on a nuanced problem.
  *   **Fail State:** "This input reflects the framing of the question, not the will of the users."

  **Step 3: Cost (Intensity vs. Noise)**
  *   **Question:** What was the cost to participate?
  *   **Metric:**
      *   *Low Cost:* Clicking a petition, upvoting a post. (Weight: 0.5)
      *   *Medium Cost:* Voting in a structured poll, filling a form. (Weight: 1.0)
      *   *High Cost:* Attending a live call, writing a detailed essay. (Weight: 2.0)
  *   **Threshold:** High Cost input overrides Low Cost input *only if* the headcount is within an order of magnitude. (e.g., 60 Town Hall attendees cannot override 4,000 petition signers, but 60 Town Hall attendees can override 800 upvotes).
  *   **Rationale:** Low cost allows for "cheap talk" and mob mobilization. High cost signals genuine investment. However, high cost introduces massive selection bias (only the loud/angry show up).
  *   **Fail State:** "This represents high-intensity noise, not broad consensus."

  **Step 4: Rights (The Tyranny Check)**
  *   **Question:** Does granting this request remove the ability of a minority to participate in the future?
  *   **Test:** If we do X, can the people who oppose X still use the site safely?
  *   **Threshold:** If the answer is No, the claim is invalid regardless of support.
  *   **Rationale:** Some things are not aggregable. You cannot vote to revoke someone's human dignity or safety. This is where mods must veto the "community."
  *   **Fail State:** "This is not up for a vote. It violates the baseline safety contract."

  **Step 5: Synthesis (The Verdict)**
  *   **Pass:** Meets Standing, Neutral Construction, and Rights checks.
      *   *Action:* Treat as a **Mandate**. Implement with confidence.
  *   **Partial:** Meets Standing and Rights, but fails Construction or has skewed Cost.
      *   *Action:* Treat as a **Signal**. Acknowledge the sentiment, but do not claim it as a mandate. Investigate further.
  *   **Fail:** Fails Standing or Rights.
      *   *Action:* Treat as **Factional**. Decline the request. Explain why the input was insufficient.

  ---

  ### Part 3: Running Your Three Cases
  Here is the procedure applied to your specific headaches. I am committing to these outcomes.

  **Case 1: The Petition (4,200 signatures)**
  *   **Standing:** You have 200k registered, 3k active. 4,200 signatures sounds like a majority of active users. *However*, petitions are low-friction. It is highly likely a significant portion are inactive accounts or outsiders mobilized by social media. Unless you can verify that >2,100 signers posted in the last 90 days, this fails Step 1.
  *   **Construction:** Petitions are inherently binary (Sign/Don't Sign). They rarely offer nuance.
  *   **Cost:** Low.
  *   **Verdict:** **Signal, not Mandate.**
  *   **Why:** It proves there is *unhappiness*, but it does not prove that the *solution* requested is what the active community wants. It licenses you to investigate the problem, not to implement their solution.

  **Case 2: The Mod Poll (900 responses)**
  *   **Standing:** 900 responses out of 3k active is a 30% turnout. That is statistically robust *if* random. It is not random. It is self-selected.
  *   **Construction:** You said the options were chosen by the mod team. This fails Step 2 immediately. You framed the battlefield.
  *   **Cost:** Medium.
  *   **Verdict:** **Invalid as a Mandate.**
  *   **Why:** I know you hate this. You defended it publicly. But a poll run by the administration, with options selected by the administration, to judge the administration's policy, is a legitimacy trap. It confirms your bias. It counts as internal data, not community will. You cannot paste this into an announcement as "The community decided."

  **Case 3: The Town Hall (60 people)**
  *   **Standing:** 60 people is 2% of active users. Fails Step 1 on headcount.
  *   **Construction:** Live voice favors the articulate, the angry, and those with free time during that specific hour.
  *   **Cost:** High.
  *   **Verdict:** **Factional.**
  *   **Why:** This is the "loudest regulars" problem. High cost signals intensity, but the sample size is too small to represent the silent 98%. This input is useful for understanding *arguments*, not for counting *votes*.

  **Summary of the Three:**
  None of these three instances licensed you to claim "The community wants X." The Petition was a signal of unrest. The Poll was biased internal data. The Town Hall was a focus group of power users. You acted on the Petition because it had the biggest number, but you lacked the Standing verification.

  ---

  ### Part 4: The Announcement Template
  When you announce a decision, do not say "The community wants this." Say "We weighed the input." Here is the text you can paste.

  > **Subject: Decision on [Policy Name] and Input Review**
  >
  > We are writing to update you on the recent discussion regarding [Policy]. We have reviewed the petition (4,200 signatures), the community poll (900 responses), and the town hall transcript.
  >
  > Our goal is to govern based on the long-term health of the community, not just raw headcounts. In reviewing the input, we noted the following:
  >
  > 1.  **Participation:** While the petition had high volume, our analysis shows [X]% of signers have not been active in the last quarter. We prioritize the views of current participants.
  > 2.  **Framing:** The poll options were limited and did not capture the nuance of the debate. We cannot treat this as a definitive vote.
  > 3.  **Safety:** Some proposals would have made the site unsafe for minority groups. We do not vote on baseline safety.
  >
  > **The Decision:**
  > We are [Action Taken].
  >
  > **Why:**
  > This decision reflects a balance between the clear dissatisfaction signaled by the petition and the structural limitations of the data we collected. We are not claiming this is what everyone wants. We are claiming this is the decision that best preserves the community's ability to function.
  >
  > We know this will not make everyone happy. It is not supposed to. It is supposed to keep us here next year.

  ---

  ### Part 5: Where This Will Misfire (The Blunt Truth)
  You asked for honesty about where this is just a flowchart costume for judgment calls. Here it is.

  1.  **The "Active" Definition is Arbitrary:** Why 90 days? Why not 30? Why not 6 months? This is a judgment call. A 90-day rule disenfranchises people who take breaks but care deeply. A 30-day rule enfranchises rage-posters. I chose 90 as a balance, but your council will argue this. *Defense:* It's a standard metric for "churn." Stick to it.
  2.  **The "Rights" Check is Subjective:** Step 4 (Tyranny Check) is pure values. One mod's "safety" is another mod's "censorship." The procedure cannot solve this. It only forces you to admit you are making a values call, not a math call. If your council is split 5-5 on whether something is "safe," this flowchart won't save you. You need a separate values charter.
  3.  **The "Manufactured Will" Problem:** Step 2 assumes you can detect framing. Sometimes the community genuinely polarizes around a binary choice naturally. If you reject a clear binary because you suspect framing, you look elitist. If you accept it, you look manipulated. *Defense:* Always offer a "Write-in" or "Other" option in polls. If you don't, assume Step 2 is failed.
  4.  **The "Silent Majority" Trap:** This procedure assumes the silent majority is roughly aligned with the active minority. Sometimes the silent majority is waiting for someone to fix a problem the active minority loves. This procedure biases toward the status quo. That is a feature for stability, but a bug for reform.

  **Final Commitment:**
  Your friend the union organizer is right that power matters, but wrong that *counting* power is the same as *wielding* it. If you tell your council "The poll was worthless," you will look weak. If you tell them "The poll failed the Construction Check because we wrote the questions, and we are holding ourselves to a higher standard than a petition," you look principled.

  Use the distinction between **Mandate** (Do it) and **Signal** (Look at it). Most of your inputs are Signals. Stop treating them like Mandates.
