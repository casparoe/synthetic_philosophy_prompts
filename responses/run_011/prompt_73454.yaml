answer: |-
  You have put your finger on one of the most profound tensions in semiotics, cognitive science, and design. You are describing a phenomenon where the *ontology* of the letter (what it *is*) is dependent on its *relations* (where it *sits*).

  There is no single word that captures the whole of this, because it spans three different fields that usually talk past each other. To give you the "edges" of the concept as you asked, we need to look at the cognitive mechanism, the linguistic structure, and the philosophical implication.

  ### 1. The Cognitive Mechanism: Predictive Processing
  In psychology, the closest established concept is the **Word Superiority Effect**, but that is too mild for what you are describing. The Word Superiority Effect says you recognize a letter faster inside a word than in isolation. You are describing something stronger: **Contextual Determination of Identity.**

  The current leading model for this is **Predictive Processing** (or the Interactive Activation Model). The brain does not build meaning from the bottom up (pixels → strokes → letters → words). It works bidirectionally.
  *   **Bottom-up:** The visual data of your ambiguous stem-and-shoulder.
  *   **Top-down:** The expectation generated by the preceding *t* and the word structure.

  When you say the identity "flips" without the shape changing, you are describing a **phase shift in perceptual hypothesis.** The brain is a prediction engine. If the bottom-up data is ambiguous (the *n/h* shape), the top-down model seizes control to minimize "prediction error."
  *   **The Edge:** Context *nudges* when the bottom-up signal is strong (a perfect *a* will look like an *a* even in nonsense). Context *settles* when the bottom-up signal falls below the threshold of distinctiveness. Your ambiguous shape is below that threshold. The neighbors are not "evidence"; they are the **constraint satisfaction system** that forces the ambiguous data into a valid slot.

  ### 2. The Linguistic Structure: Value through Difference
  You asked if philosophy takes the "identity lives outside the thing" seriously. The answer is a definitive yes, specifically in **Structuralism**.

  Ferdinand de Saussure, the father of modern linguistics, argued that in language, **"there are only differences without positive terms."**
  *   An *n* is not an *n* because of its intrinsic shape.
  *   An *n* is an *n* because it is *not* an *h*, *not* an *m*, *not* an *r*.
  *   Crucially, those differences are often positional. An *h* has a functional role (usually word-initial or post-vowel with an ascender) that an *n* does not.

  When you place your ambiguous shape after a *t*, the system of English orthography says, "We are in a medial cluster. An *h* is statistically improbable here; an *n* is probable." The system *assigns* the value.

  This aligns with **Semantic Externalism** in philosophy of mind. Just as some philosophers argue that the meaning of "water" depends on the external world (H2O) and not just your internal concept, you are arguing that the identity of a glyph depends on the external typographic environment. The neighbors are not "optional extra information." **They are constitutive.** Without the neighbors, the glyph literally does not have that identity. It is a potentiality, not an actuality.

  ### 3. The Design Reality: Optical Compensation
  In type design, this is acknowledged as **Optical Compensation** or **Contextual Adjustment**, but usually, designers change the *shape* to maintain identity. You are observing that the *identity* changes while the *shape* remains constant.

  This is the realm of the **Gestalt**. Specifically, the law of **Continuity** and **Common Fate**.
  *   If you thicken the stroke to the left, you change the "weight" of the word. Your ambiguous shape is now "heavy" enough to belong to that family, so it is read as part of the word (an *n*).
  *   If you lean the neighbors, you create a vector of motion. If the ambiguous shape aligns with that vector, it is swept up into the word. If it resists the vector, it becomes an intruder.

  ### Addressing Your Specific Questions

  **When does context settle category vs. nudge a guess?**
  It comes down to **Ambiguity Tolerance**.
  *   **Nudge:** The shape has a strong "skeleton" (e.g., a clear loop for an *a*). Context makes it faster to read, but you could still identify it in isolation.
  *   **Settle:** The shape is "skeletal" (like your stem-and-shoulder). It lacks the distinctive features (diacritics) required for standalone identification. In this state, the letter is a **variable** waiting for a **value**. The context provides the value. If the context is removed, the letter ceases to be a letter and becomes a "mark."

  **Is there such a thing as a shape with no letter identity at all inside a word?**
  Yes. Designers call this **Typographic Noise** or **Texture**.
  *   **Hard to read:** The brain is working hard to resolve the conflict between shape and context. You feel friction.
  *   **No identity:** The brain gives up on the linguistic code and switches to the aesthetic code. The shape becomes "decoration."
  *   **How to tell:** The "break point" is when the reader stops trying to phonetically decode the word. If you show your ambiguous shape between two clashing letters and the reader skips over it or describes it as "a weird line" rather than misreading it as a specific letter, it has lost letterhood. It has become a graphical artifact. It is no longer a signifier; it is just ink.

  **Does philosophy take "identity lives outside" seriously?**
  Yes, but it goes further than you might expect.
  *   **Jacques Derrida** took this to the extreme with the concept of *Différance*. He argued that meaning is never present in the sign itself; it is always deferred through the chain of other signs. Your observation that the *n* is only an *n* because of the *t* before it and the vowel after it is a practical demonstration of Derridean theory. The identity is in the *spacing*, not the *shape*.
  *   **Martin Heidegger's** concept of "Ready-to-hand" vs. "Present-at-hand" is also relevant. When the letter works (context is good), it is invisible (ready-to-hand); you see the *word*. When the context clashes and the letter loses identity, it becomes "present-at-hand"—you notice the *shape* as an object because it has failed as a tool for communication.

  ### The Synthesis
  You are describing **Relational Identity**.

  In your hand-lettering, you have discovered that a letter is not a noun; it is a **verb**. It is an event that happens *between* marks.
  *   The *n/h* shape is a **potential glyph**.
  *   The context is the **actualizing force**.

  Most type theory treats the glyph as the atom and the word as the molecule. Your experience suggests the **word is the atom**, and the glyph is merely a localized vibration within that field.

  If you want to research this further, do not look only at typography manuals. Look at:
  1.  **James J. Gibson's Ecological Psychology:** Specifically "affordances." The letter affords reading only if the environment supports it.
  2.  **Saussure's *Course in General Linguistics*:** Specifically the section on "Linguistic Value."
  3.  **Predictive Coding in Visual Cortex:** Look for papers on "top-down modulation of V1 activity."

  You are correct: the neighbors are not witnesses to the letter's identity; they are its authors.
