answer: |-
  ### Specification of Evidential Standards for Testimony Regarding Survival

  **1. The Phenomenology-Causation Distinction**
  An adequate account must distinguish the reliability of a witness's report of their subjective experience from the evidential weight of the metaphysical explanation attached to it.
  *   *Motivation:* Sidgwick's Census accepted that witnesses were truthful about *seeing* figures without accepting that figures were *ghosts*. A witness can be impeccable regarding the content of their perception while being entirely mistaken about its external cause.

  **2. The Spectrum of Deception and Error**
  The account must provide criteria for distinguishing deliberate fraud from unconscious confabulation, elaboration under questioning, and the sincere reporting of forgotten ordinary information (cryptomnesia).
  *   *Motivation:* The SPR's history is replete with exposed mediums (deliberate) and sincere automatists (unconscious). An account that filters only for lying fails to address the more pervasive threat of innocent error.

  **3. The Living Agent Psi (LAP) Barrier**
  The account must address the possibility that information apparently from the dead is produced by an unrestricted telepathic faculty among the living. It must specify whether strategies like cross-correspondences successfully isolate survival from boundless psi or merely relocate the explanatory burden.
  *   *Motivation:* If a living medium can telepathically access information from another living person who knows it, survival is not required. This is the primary rival hypothesis that any survival claim must defeat.

  **4. Non-Circular Differential Standards**
  The account must explain why the evidential standard for paranormal testimony differs from ordinary testimony without justifying that difference solely by the antecedent improbability of the claim.
  *   *Motivation:* To demand more evidence simply because the claim is extraordinary is circular if the goal is to test the claim's truth. Sidgwick applied rigorous standards not because survival was impossible, but because the stakes for ethics were absolute.

  **5. The Attainability Bar**
  The account must describe a finite, conceivable body of testimony that would, in principle, clear the evidential threshold.
  *   *Motivation:* If no possible amount of testimony could establish the claim, the inquiry is dogmatically closed. Sidgwick remained open to evidence despite his skepticism; an adequate account must preserve this openness.

  **6. Control for Cultural Scripts**
  The account must assess the non-independence of witnesses who share a cultural milieu, recognizing that séance conventions shape what is experienced, how it is described, and what counts as striking.
  *   *Motivation:* Victorian apparitions wore Victorian clothes; modern ones wear suits. If the data mirrors cultural expectations rather than breaking them, its independence is compromised.

  **7. Repeatability and Mechanism vs. Historical Singularity**
  The account must explicitly state its attitude toward experimental control and mechanism, justifying why it accepts or rejects non-repeatable singular evidence without silently importing norms from laboratory science that would invalidate historical inquiry.
  *   *Motivation:* Survival claims are often singular events (deathbed visions). Demanding lab-style repeatability may make the evidence impossible to obtain, while accepting singular testimony risks accepting anecdote.

  **8. Practical Stakes and Evidential Thresholds**
  The account must determine whether the practical consequences of error (e.g., Sidgwick's ethical dualism) raise, lower, or leave unmoved the evidential bar, and what is lost by suspending judgment indefinitely.
  *   *Motivation:* Sidgwick needed survival for ethics to be rational. If stakes raise the bar, he makes his ethical problem harder to solve; if they lower it, he risks rationalizing wish-fulfillment.

  **9. Falsifiability Conditions**
  The account must state what would count *against* the hypothesis, not only what would count for it.
  *   *Motivation:* A hypothesis that can absorb any outcome (e.g., "failure to manifest is due to negative atmosphere") is not empirically testable.

  ***

  ### Classification of Requirements

  | Requirement | Classification | Rationale for Classification |
  | :--- | :--- | :--- |
  | **1. Phenomenology-Causation** | **Non-negotiable** | Fundamental to epistemology; confusing experience with explanation is a category error. |
  | **2. Deception and Error** | **Non-negotiable** | Basic condition for assessing testimony in any domain (legal, historical, scientific). |
  | **3. LAP Barrier** | **Camp-Relative (Apologist/Debunker)** | Skeptics use it to dismiss data; Apologists use cross-correspondences to bypass it. Lab scientists ignore it as metaphysical. |
  | **4. Differential Standards** | **Non-negotiable** | Circular justification undermines the inquiry's rationality regardless of camp. |
  | **5. Attainability Bar** | **Non-negotiable** | Without this, the inquiry is question-beggingly closed. |
  | **6. Cultural Scripts** | **Camp-Relative (Sociologist/Historian)** | Laboratory accounts often ignore cultural context; Historians prioritize it. |
  | **7. Repeatability vs. Singularity** | **Camp-Relative (Lab/Historian)** | Lab science demands repeatability; History/Cosmology accepts singulars. |
  | **8. Practical Stakes** | **Camp-Relative (Pragmatist)** | Purist epistemologists deny stakes affect truth thresholds; Sidgwick implies they might. |
  | **9. Falsifiability** | **Non-negotiable** | Essential for empirical claims; without it, the claim is non-cognitive. |

  ***

  ### The Impossibility Argument

  There is a structural tension between **Requirement 5 (Attainability)**, **Requirement 6 (Cultural Independence)**, and **Requirement 7 (Repeatability/Control)**. Your diagnosis is correct: a standard demanding a mass of independent, uncontaminated, non-coincidental testimony cannot be met by a phenomenon that is, on the most favorable description its partisans offer, sporadic, private, and uncontrolled.

  If we enforce **Requirement 7** strictly (demanding experimental control and repeatability), we render the evidence unattainable for a phenomenon defined by its resistance to laboratory conditions, thereby violating **Requirement 5**. If we relax **Requirement 7** to accept historical singulars, we become vulnerable to **Requirement 6** (Cultural Scripts), as singular events cannot be statistically disentangled from the shared expectations of the witnesses. The impossibility is not a feature of the phenomenon alone, nor solely of the standards, but of the mismatch between *historical* modes of evidence (singular, testimonial) and *scientific* modes of verification (controlled, repeatable) when applied to a claim that purports to be a law of nature (survival) but presents only as historical accident.

  To restore consistency, **Requirement 7** must be reformulated. We cannot demand *experimental* repeatability. Instead, we must demand *convergent independence*. The requirement becomes: "Multiple lines of testimony, arising from distinct cultural and informational contexts, must converge on specific details that cannot be explained by shared scripts or normal information channels." This shifts the burden from laboratory control to informational isolation.

  The single requirement that does the most work in excluding candidate accounts is **Requirement 3 (The LAP Barrier)**. Even if one clears the hurdles of fraud, cultural scripting, and attainability, the hypothesis of "Super-ESP" (unrestricted telepathy among the living) can absorb almost any data set without admitting survival. It posits a faculty in the living that mimics the powers of the dead. Unless an account can specify a piece of evidence that telepathy among the living *could not* produce, Requirement 3 acts as a permanent filter, rendering the survival hypothesis empirically indistinguishable from a particularly potent psi hypothesis.

  ***

  ### Assessment of Accounts and Sidgwick's Practice

  **Humean Treatment:** Fails **Requirement 5 (Attainability)** and **Requirement 4 (Non-Circular Standards)**. By defining "uniform experience" against miracles a priori, it renders no amount of testimony sufficient, closing the inquiry dogmatically. It treats the antecedent improbability as a veto rather than a weight to be outweighed.

  **Bayesian Rejoinder:** Satisfies **Requirement 5** in principle, allowing priors to be swamped by likelihood ratios from sufficient testimony. However, it struggles with **Requirement 3 (LAP Barrier)**. The likelihood of the data given "Survival" is rarely higher than the likelihood of the data given "Super-ESP," meaning the posterior probability for survival remains low regardless of testimony volume. It also falters on **Requirement 6**, as calculating the independence of witnesses is notoriously difficult when cultural priors are shared.

  **Credulity-Based Treatment:** Fails **Requirement 2 (Deception and Error)** and **Requirement 4**. By treating sincere testimony as presumptively credible absent specific defeaters, it places the burden of proof entirely on the skeptic. This collapses the distinction between reliable reporting and accurate causal explanation, inviting the acceptance of confabulation as evidence.

  **Sidgwick's Census Practice:** Sidgwick's Census satisfies **Requirement 1 (Phenomenology-Causation)** and **Requirement 6 (Cultural Scripts/Statistics)** admirably. It isolated the experience from the explanation and used base rates to control for coincidence. However, it fails **Requirement 5 (Attainability for Survival)**. The Census was designed to measure the frequency of hallucinations, not to verify veridical contact. By statistical design, it treated apparitions as noise to be correlated with mortality rates, not as signals to be verified. Consequently, while it met the methodological standards Sidgwick implicitly endorsed for *psychological* inquiry, it was structurally incapable of delivering the *ethical* foundation (survival) he sought. It solved the epistemological problem by dissolving the ontological one, leaving the dualism of practical reason unresolved.
