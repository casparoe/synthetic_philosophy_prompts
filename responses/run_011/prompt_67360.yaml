answer: |-
  This is a sharp menu. It correctly identifies the friction points where "outside view" forecasting usually stalls. Given the constraint (1.5 person-years, no new data collection, small team), the goal should be **maximizing the validity of the output** rather than solving foundational epistemology. You want a forecast that survives contact with reality, not a proof that forecasting is impossible.

  Here is the ranking by marginal value of 1.5 person-years, followed by the criteria breakdown, the cut, and the settled/contested map.

  ### The Ranking

  1.  **Non-Stationarity**
  2.  **Reference Class Choice**
  3.  **The Mixing Rule**
  4.  **Hazard Rates (Distributional Shape)**
  5.  **Selection and Survivorship Effects**
  6.  **Scoring**
  7.  **Self-Locating Information** (Cut)

  ---

  ### Detailed Rationale & Criteria

  **Criteria Key:**
  *   **Dependency:** Do other problems rely on this being solved first?
  *   **Tractability:** Can a small team make progress without new data?
  *   **Impact:** Does solving this change the final forecast number significantly?
  *   **Neglectedness:** Is this under-discussed relative to its importance?

  #### 1. Non-Stationarity (The Validity Bottleneck)
  *   **Why #1:** This is the single biggest threat to the project. If the hazard rate of empire collapse in 1800 (war, famine, succession crisis) is structurally different from 2024 (nukes, global trade, nuclear umbrellas), the historical base rate is noise. A 1.5-year deep dive into *how* the system changed (e.g., modeling the "nuclear peace" effect or the resilience of fiat finance) provides the actual adjustment factor for the outside view.
  *   **Dependency:** High. You cannot adjust a base rate if you don't know which parameters have shifted.
  *   **Tractability:** Medium. You can't prove it definitively, but you can build causal arguments or structural break tests on existing time-series data.
  *   **Impact:** Extreme. Could shift a median duration estimate from 200 years to 2,000 years (or vice versa).
  *   **Neglectedness:** High. Most outside-view work assumes ergodicity (the past is a guide to the future) without rigorously testing the break points.

  #### 2. Reference Class Choice (The Foundation)
  *   **Why #2:** You cannot calculate a base rate without defining the unit. Is "The United States" the same entity as "The Roman Republic"? Is it the *regime*, the *state*, or the *hegemon*? Ambiguity here allows for cherry-picking. A rigorous defense of the ontology is required for the work to be taken seriously.
  *   **Dependency:** Absolute. Everything else flows from this.
  *   **Tractability:** High. This is conceptual work and sensitivity analysis (e.g., "If we define it X way, the rate is Y; if Z, then W").
  *   **Impact:** High. Changing the class changes the N and the mean duration.
  *   **Neglectedness:** Medium. Often hand-waved, but Flyvbjerg/Taagepera do spend time here.

  #### 3. The Mixing Rule (The Engine)
  *   **Why #3:** Once you have an adjusted base rate, how do you incorporate inside-view evidence (e.g., "US institutions are unusually stable")? There is no consensus formula. Spending time here prevents the "outside view" from becoming a conversation stopper that ignores specific evidence.
  *   **Dependency:** Low. You can do this after establishing the base rate.
  *   **Tractability:** Medium. You can test different weighting schemes (Bayesian updating vs. linear pooling) against historical hold-out samples.
  *   **Impact:** High on specific cases, low on the general model.
  *   **Neglectedness:** High. Most people just "eyeball" the adjustment.

  #### 4. Hazard Rates (The Uncertainty Quantifier)
  *   **Why #4:** Is the risk of collapse constant (exponential) or does it increase with age (Weibull)? This determines your confidence intervals. Taagepera argues for specific power laws; others argue for constant hazard.
  *   **Dependency:** Low.
  *   **Tractability:** High. This is standard survival analysis on existing datasets.
  *   **Impact:** Medium. Affects the *range* of the forecast more than the median.
  *   **Neglectedness:** Low. This is the most technical and "solved" part of the list.

  #### 5. Selection and Survivorship Effects (The Data Quality Check)
  *   **Why #5:** We only see empires that were big enough to be recorded. Small polities that collapsed quickly are missing. This biases the base rate upward.
  *   **Dependency:** Medium.
  *   **Tractability:** **Low.** You explicitly said "isn't collecting new data." Correcting survivorship bias usually requires finding the missing data (the small, unrecorded states). Without new data, you can only speculate on the direction of the bias.
  *   **Impact:** Medium-High.
  *   **Neglectedness:** Medium.

  #### 6. Scoring (The Feedback Loop)
  *   **Why #6:** If the forecast resolves in 2150, you can't calibrate. This is a governance problem, not a modeling problem.
  *   **Dependency:** None.
  *   **Tractability:** Low. There is no mathematical fix for "we won't be alive." You can use proxy metrics, but that's a different project.
  *   **Impact:** Low on the *current* forecast.
  *   **Neglectedness:** Medium.

  #### 7. Self-Locating Information (The Cut)
  *   **Why Cut:** This is the Doomsday Argument applied to states ("We are at year N, does that imply we are near the end?").
  *   **Reasoning:** It is philosophically fascinating but practically inert for this specific project. It conflates the *probability of observing an entity* with the *probability of the entity's duration*. For a forecaster trying to output a number for a specific existing state, self-locating priors usually wash out or are superseded by the reference class data. It consumes high cognitive load for near-zero change in the output distribution.
  *   **Verdict:** **Cut outright.** It is a "LessWrong anchor" that distracts from the political science.

  ---

  ### Settled vs. Contested

  Be careful not to present social science consensus where there is none.

  *   **Contested (Genuine Disagreement):**
      *   **Reference Class:** There is no agreement on what constitutes a "state" death. (Regime change? Loss of territory? Loss of hegemony?)
      *   **Non-Stationarity:** Realists argue the anarchic structure of the system is constant (Thucydides trap always applies); Liberals/Institutionalists argue nuclear weapons and trade have fundamentally altered the hazard function.
      *   **Mixing Rule:** There is no agreed-upon algorithm for Inside/Outside view weighting. It is the "dark art" of forecasting.
      *   **Hazard Rates:** Some datasets suggest power-law distributions (scale-free); others suggest log-normal or exponential.

  *   **Settled (Methodological Consensus):**
      *   **Survival Analysis:** The *math* for fitting hazard rates is settled. The *application* is not.
      *   **Survivorship Bias:** Everyone agrees it exists; no one agrees on the magnitude.
      *   **Scoring:** Everyone agrees long-term forecasts are hard to score; the solution (proxy metrics) is known but imperfect.

  ---

  ### Evidence That Would Reshuffle This Ranking

  1.  **If a new, comprehensive dataset of minor polities is released:**
      *   *Shift:* **Selection Effects** moves to #1. If the data exists to correct the bias, that becomes the highest-leverage empirical work.
  2.  **If a structural break is statistically confirmed (e.g., post-1945 hazard rate is significantly different):**
      *   *Shift:* **Non-Stationarity** moves down (problem solved) and **Mixing Rule** moves up. If we know the old data is useless, the focus shifts entirely to how we model the *new* regime using inside-view factors.
  3.  **If a specific Mixing Rule is validated on shorter-term analogues:**
      *   *Shift:* **Mixing Rule** moves down. If someone proves that "50% outside / 50% inside" outperforms other weights on 10-year forecasts, you just adopt that heuristic.

  ### Summary Advice for Your Friend

  Tell her to spend the first 6 months on **Non-Stationarity** and **Reference Class**. These are the "garbage in" risks. If she gets those wrong, the math doesn't matter.

  Tell her to spend the next 6 months on **Hazard Rates** and **Mixing Rule**. This builds the engine.

  Tell her to spend the last 6 months writing up the **Scoring** and limitations, acknowledging the **Selection Effects** she couldn't fix, and explicitly ignoring **Self-Locating Information** as out of scope.

  The "LessWrong anchor" you mentioned is real: it is tempting to solve the *philosophy* of forecasting (Self-Locating, Reference Class paradoxes) rather than the *practice*. 1.5 years is enough to build a robust, defensible model, but not enough to solve epistemology. Prioritize the levers that move the number.
