  3.  **Evaluate the Core Philosophical Problem (The "Strawman" Worry):**
      *   *Lewis's View:* Lewis defines convention as a solution to a *coordination problem*. Crucial condition: "Almost everyone prefers to conform *if* others conform."
      *   *The User's Case:* Cryptic conventions involve a second-order rule (A) to hide the first-order rule (R).
      *   *The Tension:* If A exists because some benefit from hiding R (e.g., partners vs. associates), is this still a *coordination problem* in Lewis's sense? Lewis allows for mixed motives, but the core is mutual advantage in coordination. If the second-order layer involves *conflict* (hiding the exploitation), it looks more like ideology or power than convention.
      *   *Supervisor's Point:* If the user defines "convention" loosely (ordinary language) but attacks Lewis's technical definition, it's a strawman. Lewis might just say, "That's not a convention in my sense; that's a power dynamic."
      *   *Classmate's Point:* The "email game" (Rubinstein) shows that *almost* common knowledge leads to different equilibria than *perfect* common knowledge. This supports the idea that the *degree* of knowledge matters. However, cryptic conventions seem to require *lack* of knowledge (or lack of acknowledgement), not just "almost."

  4.  **Address the 9 Specific Questions:**

      *   **Q1 (Validity of §3):** Does it equivocate between CK (technical) and Avowability (social)?
          *   *Thought:* Lewis's CK is epistemic (iterated belief). Avowability is pragmatic. The argument claims behavior can't ground iterated belief about A. But if everyone follows R and no one talks about it, isn't that *evidence* of CK of A? Lewis argues CK arises from "indications." Silence can be an indication.
          *   *Verdict:* Premise (4) is weak. Iterated belief *can* be grounded by the regularity of silence. The stronger point is that *acknowledged* CK is impossible. The argument needs to shift from "CK is impossible" to "Acknowledged CK is impossible," which challenges Lewis's claim that conventions are *public* devices.

