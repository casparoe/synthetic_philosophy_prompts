          *   *Verdict:* Scale back. Claim: "Lewis's account is incomplete regarding power-laden norms," not "Convention is not essentially public."

      *   **Q7 (Cutting):** What to compress?
          *   *Thought:* §1 and §2 are too long in a 4.5k paper. §1 can be tighter on Lewis. §2 examples can be one detailed one, not a list. §4 can be condensed.
