answer: |-
  This is a sharp, promising draft. The core intuition—that some norms function precisely by remaining unacknowledged—is philosophically robust and connects well with literature on ideology, pluralistic ignorance, and Bourdieusian *doxa*. However, your supervisor's worry is the central strategic hurdle: Lewis defines "convention" technically. If your counter-examples fall outside his technical definition by stipulation, you haven't refuted him; you've just changed the subject.

  To make this work within 4,500 words, you must pivot from "Lewis is wrong about convention" to "Lewis's conditions for convention reveal a blind spot regarding power and ideology." Below are substantive responses to your nine questions, followed by strategic advice on the email-game point and cutting for length.

  ### 1. Validity of §3 (The Bottleneck)
  **Verdict:** The argument currently equivokes, but it can be repaired.
  **Diagnosis:** Premise (4) ("Behavior alone cannot justify the iterated beliefs") is the weak link. A Lewisian will argue that iterated belief *is* grounded by the regularity of behavior plus the regularity of silence. If everyone leaves at 3 PM and no one comments, that *is* the "indication" Lewis requires for common knowledge (CK). Lewis does not require verbal avowal; he requires that the evidence be public and accessible. Silence can be public evidence.
  **Repair:** You need to tighten the definition of the "object" of the knowledge.
  *   *Current:* Agents lack CK of A (the rule of silence).
  *   *Revised:* Agents cannot have CK of the *conjunction* (R & A). To have CK of (R & A) is to acknowledge A. Acknowledging A violates A. Therefore, CK of the convention is performatively self-defeating.
  *   *Why this helps:* It shifts the argument from an epistemic limitation (we can't *know*) to a pragmatic paradox (we can't *know that we know* without destroying the norm). This survives the objection that inference grounds belief, because the inference leads to a state that, if acted upon (by treating it as CK), triggers sanctions.

  ### 2. Strongest Lewisian Replies (§4)
  **Verdict:** You are right to worry about the "Separate Norm" objection. It is the strongest threat.
  **Diagnosis:** A Lewisian can concede that A exists but argue that R is the convention, and A is merely a contingent, separate norm of prudence or politeness. Lewis only requires CK of R. If everyone knows R (we leave at 3), Lewis is satisfied, even if they don't have CK of A (we don't talk about leaving at 3).
  **Repair:** You must argue that R is *constitutively dependent* on A. It is not "Leave at 3" + "Don't talk about it." It is "Leave at 3 *in a manner that suggests spontaneity*." If the regularity itself includes the concealment, then CK of the regularity requires CK of the concealment, which triggers the paradox in §3.
  **Action:** In §4(b), do not concede that this is "impure coordination." Instead, argue that the *coordination* is on the *manner* of the behavior, not just the behavior. If the manner includes concealment, Lewis's publicity condition clashes with the content of the convention.

  ### 3. Pluralistic Ignorance (§4c)
  **Verdict:** The distinction is substantive and worth keeping.
  **Diagnosis:** Pluralistic ignorance (PI) is "I reject R, but I think you accept it." Your cryptic convention (CC) is "I accept R, but I pretend I don't know it's a rule."
  **Why it matters:** PI is unstable; once the truth is revealed, the norm often collapses because private preferences align against it. CC is stable; revealing the truth (articulating A) destroys the norm because the norm *requires* the pretense.
  **Action:** Keep this, but compress it. It serves as a crucial boundary marker to show you aren't just rediscovering PI. One paragraph is sufficient.

  ### 4. The E/V Split (§5)
  **Verdict:** It is a redescription, but a useful one. Do not oversell it as a correction to Lewis; frame it as a diagnostic tool.
  **Diagnosis:** V (Verificatory condition) effectively adds a "cost of avowal" parameter to Lewis's model. Lewis assumes the cost of establishing CK is low (salience). You are arguing that for CCs, the cost is prohibitive.
  **Action:** Scale back the ambition. Don't claim this splits "publicity" into two distinct philosophical categories. Claim that Lewis's "publicity" conflates *epistemic accessibility* with *pragmatic safety*. Your contribution is showing that norms can be epistemically accessible (E) but pragmatically unsafe (V). This supports the §6 stakes without overclaiming.

  ### 5. Predictions (§5)
  **Verdict:** Cut the sociological predictions; keep the philosophical ones.
  **Diagnosis:** "Cluster in hierarchies" and "ethnographies" sound like speculative sociology. "Collapse upon articulation" and "vague sanctions" are conceptual claims about the logic of the norm.
  **Action:** Cut the turnover/ethnography points. They eat words and invite empirical objections you can't answer in a philosophy paper. Focus on the *logic of sanctions*: why they *must* be vague (plausible deniability) rather than just observing that they *are* vague.

  ### 6. Licensing §6 (Stakes)
  **Verdict:** Your supervisor is correct. You have not earned the claim that "convention is not essentially public."
  **Diagnosis:** You have earned the claim that "a politically significant class of norms function *like* conventions but evade Lewis's publicity condition."
  **Action:** Rewrite §6 to focus on *democratic deficit* rather than *ontology*. The stakes aren't that Lewis's definition is false; the stakes are that Lewis's definition excludes norms that operate as tools of power. If we use Lewis as the sole metric for "convention," we render power-laden norms invisible to philosophical analysis. That is a significant stake without requiring you to overthrow Lewis.

  ### 7. Cutting for 4,500 Words
  **Strategy:** You need to cut roughly 50% of the conceptual "setup" to make room for the argument.
  *   **§1 (The Target):** Compress Lewis's definition to two sentences. You don't need to list all his conditions. Focus entirely on *Common Knowledge* and *Publicity*. (Save ~400 words).
  *   **§2 (The Phenomenon):** Use one extended example (the Friday departure) rather than a list. Walk through the layers (R and A) using that single case. (Save ~300 words).
  *   **§4 (Replies):** Merge 4(a) and 4(b). The "observation" reply and the "impure coordination" reply can be handled together as "Lewisian accommodations." (Save ~300 words).
  *   **§5 (Proposal):** Focus on the E/V distinction and the "Collapse on Articulation" prediction. Cut the rest. (Save ~300 words).
  *   **General:** Remove meta-commentary ("The argument is meant to be short," "I am not confident this is enough"). Write with authority.

  ### 8. Accuracy on Lewis
  **Verdict:** There are two potential mischaracterizations to check.
  *   **The Definition (§1):** You paraphrase Lewis as requiring "approximately the same preferences." Lewis actually requires a *coordination problem*, which implies conditional preferences (I prefer to conform if you do). He allows for conflict of interest *outside* the coordination equilibrium, but within the equilibrium, preferences must align. Check *Convention*, Chapter 3, Section 3.2. Ensure you aren't conflating "coordination problem" with "pure coordination game."
  *   **The Generation of CK (§4a):** You write: "Lewis's own account of how common knowledge typically arises — through a conspicuous public event..." Lewis emphasizes *precedent* and *salience*. A public event is one way, but past regularity is the more common generator in his account. Check *Convention*, Chapter 3, Section 4. If you claim Lewis *requires* a public event, that is a strawman. He requires *public evidence*, which can be cumulative.
  *   **Action:** Soften the claim in §4(a). Change "conspicuous public event" to "publicly accessible evidence (such as a precedent or salient event)."

  ### 9. The Blunt Question: Interesting or Strawman?
  **Verdict:** It is interesting, provided you frame it as a *limit case* rather than a *refutation*.
  **Diagnosis:** If you argue "Lewis is wrong," it's a strawman hunt because Lewis can simply define cryptic norms out of his category. If you argue "Lewis's category excludes norms that function socially as conventions but operate via opacity," you are doing social ontology. You are identifying a gap between *functional* convention and *technical* convention.
  **Advice:** Lean into the "Cryptic" taxonomy. This connects your paper to broader debates on ideology (Stanley, Haslanger) and common knowledge in game theory. It stops being a Lewis exegesis paper and becomes a paper about *social opacity* that uses Lewis as a foil. That is workshop-worthy.

  ### Regarding the Classmate's Suggestion (The Email Game)
  **Verdict:** Do not use the Rubinstein Email Game result.
  **Reasoning:** The Email Game shows that *almost* common knowledge (n-levels) yields different equilibria than *perfect* common knowledge (infinity-levels). Your argument is not about the *degree* of knowledge (n vs. infinity); it is about the *content* of the knowledge (knowing R vs. knowing A). Introducing the Email Game complicates the epistemic logic without solving the pragmatic paradox you've identified. It decorates the paper rather than strengthening the core argument about avowability.

  ### Suggested Outline for the 4,500-Word Version
  1.  **Introduction (§1):** Lewis's convention requires CK + Publicity. Thesis: A class of "cryptic conventions" functions via regularity and mutual expectation but fails Publicity because their stability depends on non-acknowledgement.
  2.  **The Phenomenon (§2):** One detailed example (Friday departures). Distinguish R (behavior) from A (rule of silence). Show how sanctions enforce A without stating A.
  3.  **The Argument (§3):** The Pragmatic Paradox. CK of (R+A) requires avowal. Avowal violates A. Therefore, stable cryptic conventions cannot satisfy Lewis's CK condition without self-destructing. (Address the "inference" objection here).
  4.  **Objections (§4):** Briefly handle the "Separate Norm" objection (R depends on A) and Pluralistic Ignorance (I accept R, I just hide the rule).
  5.  **Implications (§5 & §6 combined):** This isn't just a gap in Lewis; it's a blind spot in social ontology. Norms that cannot be avowed cannot be democratically revised. Lewis's model assumes a transparency that power structures actively prevent.

  ### Final Word on the Supervisor's Comment
  Your supervisor suspects you are congratulating yourself for knocking down a strawman. To avoid this:
  1.  **Concede early:** Acknowledge that Lewis might define these norms out of "convention."
  2.  **Pivot:** Argue that if Lewis's definition excludes them, his definition is ill-suited for political social ontology.
  3.  **Result:** You aren't saying Lewis is wrong about *his* concept; you are saying *his* concept is insufficient for *our* purposes (analyzing power).

  This moves the paper from "Exegesis/Critique" to "Constructive Social Ontology," which is a much stronger position for a graduate workshop.
