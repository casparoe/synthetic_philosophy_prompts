answer: |-
  ### 1. Exam Question

  **Question 1. Bell's Theorem and Locality (25 Marks)**

  *Candidates have fifty minutes for this question. Calculators and notes are not permitted. All numerical results must be exact.*

  Consider **Model M**, a bipartite experiment involving two agents, Alice and Bob.
  *   **Settings:** Alice chooses a measurement direction $a \in \{0^\circ, 90^\circ\}$. Bob chooses a direction $b \in \{45^\circ, 135^\circ\}$. All directions lie in a common plane.
  *   **Outcomes:** Each obtains an outcome $A, B \in \{+1, -1\}$.
  *   **Hidden Variable:** There is a single hidden variable $\lambda$, which takes the value $\lambda_0$ with probability one. Thus, $\lambda$ is independent of the settings.
  *   **Probabilities:** Conditional on $\lambda_0$, for any pair of settings $a$ and $b$, the probability that the two outcomes agree (i.e., $A=B$) is given by:
      $$P(A=B \mid a, b, \lambda_0) = \frac{1 - \cos(a - b)}{2}$$
      The four joint probabilities divide this probability evenly between the two agreeing pairs ($++, --$) and divide the complement evenly between the two disagreeing pairs ($+-, -+$).

  You may assume the CHSH inequality for factorizable models: $|S| \le 2$, where $S = E(a,b) - E(a,b') + E(a',b) + E(a',b')$.

  **(a)** Derive the expectation value $E(A,B \mid a,b)$ in Model M. Evaluate the CHSH combination $S$ for the settings specified above. State the bound that any factorizable model must obey. **(5 marks)**

  **(b)** Decide, from the probability specification alone, whether Model M satisfies Parameter Independence and whether it satisfies Outcome Independence. Justify your answer mathematically. **(5 marks)**

  **(c)** Decide whether Model M permits superluminal signalling. Explain what the answer to (b) does and does not settle about this. **(4 marks)**

  **(d)** Evaluate the following claim: *"Model M refutes Bell's theorem, because it reproduces the quantum correlations while remaining local."* In your verdict, distinguish carefully between no-signalling, Parameter Independence, and Bell's criterion of Local Causality. **(6 marks)**

  **(e)** Explain what changes if the model is required to be deterministic, such that each outcome is a fixed function of the local setting and $\lambda$. Why is Model M's irreducibly stochastic character doing essential work? **(5 marks)**

  ***

  ### 2. Model Answer

  **(a)** The expectation value is defined as $E = P(++) + P(--) - P(+-) - P(-+)$. Model M specifies that agreeing outcomes share the probability $P_{\text{agree}} = (1 - \cos(a-b))/2$ evenly, so $P(++) = P(--) = \frac{1}{2}P_{\text{agree}}$. Similarly, $P(+-) = P(-+) = \frac{1}{2}(1 - P_{\text{agree}})$.
  Substituting these into the expectation formula:
  $$E = P_{\text{agree}} - (1 - P_{\text{agree}}) = 2P_{\text{agree}} - 1$$
  $$E = 2\left[\frac{1 - \cos(a-b)}{2}\right] - 1 = -\cos(a-b)$$
  Using the specified settings $a=0^\circ, a'=90^\circ, b=45^\circ, b'=135^\circ$:
  1.  $E(a,b) = -\cos(-45^\circ) = -1/\sqrt{2}$
  2.  $E(a,b') = -\cos(-135^\circ) = -(-1/\sqrt{2}) = 1/\sqrt{2}$
  3.  $E(a',b) = -\cos(45^\circ) = -1/\sqrt{2}$
  4.  $E(a',b') = -\cos(-45^\circ) = -1/\sqrt{2}$

  The CHSH combination is $S = (-1/\sqrt{2}) - (1/\sqrt{2}) + (-1/\sqrt{2}) + (-1/\sqrt{2}) = -4/\sqrt{2} = -2\sqrt{2}$.
  The magnitude is $|S| = 2\sqrt{2}$. Any factorizable (Bell-local) model must obey the bound $|S| \le 2$.

  **(b)** **Parameter Independence (PI)** requires $P(A \mid a, b, \lambda) = P(A \mid a, \lambda)$. The marginal probability for Alice is $P(A=+1) = P(++) + P(+-) = \frac{1}{2}P_{\text{agree}} + \frac{1}{2}(1-P_{\text{agree}}) = 1/2$. This marginal is constant and independent of Bob's setting $b$. Thus, PI holds. By symmetry, it holds for Bob.
  **Outcome Independence (OI)** requires $P(A,B \mid a,b,\lambda) = P(A \mid a,b,\lambda)P(B \mid a,b,\lambda)$. The product of marginals is $(1/2) \times (1/2) = 1/4$. However, the joint probability $P(++) = \frac{1}{4}(1 - \cos(a-b))$ varies with the angle difference. Since the joint does not equal the product of marginals, OI fails.

  **(c)** Model M does **not** permit superluminal signalling. Signalling requires that the marginal probability of one agent's outcome depends on the other agent's setting. As shown in (b), the marginals are fixed at $1/2$ regardless of remote settings.
  The answer to (b) settles this because PI is the necessary and sufficient condition for no-signalling in this context. The failure of OI does not imply signalling; OI concerns correlations between outcomes given the settings, which cannot be exploited for communication without access to the remote outcome.

  **(d)** The claim is **false**. Bell's theorem demonstrates that any model satisfying Local Causality (defined as the conjunction of PI and OI, or equivalently, factorizability) must satisfy the CHSH inequality $|S| \le 2$. Model M yields $|S| = 2\sqrt{2}$, violating the inequality. Therefore, Model M must violate Local Causality.
  The claim relies on an equivocation on "local." Model M is local in the sense of no-signalling (it satisfies PI), but it is non-local in Bell's sense (it violates OI). It does not refute Bell's theorem; rather, it exemplifies the theorem's conclusion: to reproduce these correlations (which coincide exactly with the quantum mechanical singlet state), one must abandon Local Causality. The model is local only if one redefines locality to mean merely no-signalling, which is insufficient to derive the Bell inequalities.

  **(e)** If the model were deterministic, outcomes would be fixed functions $A(a, \lambda)$ and $B(b, \lambda)$. Since $\lambda$ is fixed at $\lambda_0$, the outcomes would be fixed functions of the settings alone. Consequently, the correlation $E(a,b)$ would be a product of predetermined values $\pm 1$, meaning $P_{\text{agree}}$ could only be 0 or 1.
  Model M requires $P_{\text{agree}}$ to vary continuously as $\cos(a-b)$. This is impossible with deterministic outcomes and a single $\lambda$. The irreducibly stochastic character is essential because it allows the model to violate Outcome Independence while maintaining Parameter Independence. In a deterministic model with fixed $\lambda$, PI typically forces OI (or constrains correlations to be factorizable), preventing the violation of the CHSH bound. The stochasticity allows the "screening off" condition of Local Causality to fail without introducing signalling.

  ***

  ### 3. Marking Scheme

  **Total Marks: 25**

  **Part (a) [5 Marks]**
  *   **1 mark:** Correct derivation of $E = -\cos(a-b)$.
  *   **2 marks:** Correct evaluation of the four expectation values (allow minor sign errors if method is correct).
  *   **1 mark:** Correct calculation of $S = -2\sqrt{2}$.
  *   **1 mark:** Correct statement of the factorizable bound ($|S| \le 2$).

  **Part (b) [5 Marks]**
  *   **2 marks:** Correct calculation of marginals ($1/2$) and conclusion that PI holds.
  *   **2 marks:** Correct demonstration that Joint $\neq$ Product of Marginals and conclusion that OI fails.
  *   **1 mark:** Clear distinction between the two conditions (not conflating them).

  **Part (c) [4 Marks]**
  *   **2 marks:** Correct verdict (No signalling).
  *   **2 marks:** Explanation linking PI to no-signalling and clarifying that OI violation is compatible with no-signalling.

  **Part (d) [6 Marks]**
  *   **2 marks:** Verdict that the claim is false (Model M violates Bell Locality).
  *   **2 marks:** Distinction between Signal-Locality (PI) and Bell-Locality (PI + OI).
  *   **2 marks:** **First-Class Differentiator:** Noticing that Model M's probabilities match the QM singlet state exactly, implying that Model M is essentially QM in disguise, and thus inherits QM's known violation of Local Causality. (If this insight is missing but the logic is sound, cap at 4/6 for this part).

  **Part (e) [5 Marks]**
  *   **2 marks:** Explanation that deterministic + single $\lambda$ implies fixed outcomes ($0$ or $1$ probability).
  *   **2 marks:** Explanation that this cannot reproduce the continuous cosine correlation.
  *   **1 mark:** Statement that stochasticity is required to violate OI while maintaining PI with a trivial $\lambda$.

  **Identifiable Errors (Deductions)**
  1.  **Expectation Error:** Calculating $E = P_{\text{agree}}$ instead of $2P_{\text{agree}} - 1$. (Diagnosis: Confusion between probability and expectation value. **Deduction: 2 marks from (a)**.)
  2.  **CHSH Arithmetic:** Summing the terms to get 2 or 0 instead of $2\sqrt{2}$. (Diagnosis: Careless arithmetic or misunderstanding the angle differences. **Deduction: 1 mark from (a)**.)
  3.  **PI/OI Conflation:** Claiming PI fails because correlations depend on $b$. (Diagnosis: Confusing marginal independence with joint independence. **Deduction: 2 marks from (b)**.)
  4.  **Signalling Fallacy:** Claiming OI violation implies superluminal signalling. (Diagnosis: Misunderstanding the operational definition of signalling. **Deduction: 2 marks from (c)**.)
  5.  **Locality Equivocation:** Arguing the model is "local" solely because it satisfies no-signalling, without acknowledging the violation of Bell-Locality. (Diagnosis: Failure to distinguish philosophical definitions of locality. **Deduction: 3 marks from (d)**.)
  6.  **Determinism Misconception:** Claiming determinism would work if $\lambda$ were distributed differently. (Diagnosis: Ignoring the constraint that $\lambda$ is fixed at $\lambda_0$ in Model M. **Deduction: 2 marks from (e)**.)

  **First-Class vs. Second-Class Distinction**
  A **First-Class** answer (20+ marks) will perform all calculations exactly, rigorously distinguish between Parameter Independence, Outcome Independence, and No-Signalling, and explicitly identify in part (d) that Model M is isomorphic to the quantum mechanical singlet state predictions. They will recognize that the "refutation" claim fails because Bell's theorem is a mathematical constraint on Local Causality, which Model M (like QM) violates.
  A **Competent Second-Class** answer (13–19 marks) will correctly calculate $S$ and identify the violation of the CHSH bound. They will likely identify the failure of Outcome Independence but may waffle in part (d), failing to clearly separate "no-signalling" from "Bell-locality," or missing the implication that Model M is effectively reproducing QM without a non-trivial hidden variable structure. They may treat the definitions of locality as interchangeable.
