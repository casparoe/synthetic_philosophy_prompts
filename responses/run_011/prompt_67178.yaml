      *   *Contested Point:* Does Schlick's hedonism allow for *simulated* joy? Logical Positivists usually care about the verification of experience. If the joy is felt, is it real? But Schlick emphasizes *activity* and *capacity*. A virtual world might be seen as "idle play" vs. "creative play."
