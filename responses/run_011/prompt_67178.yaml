      *   *Contested Reading:* The contested part is whether Schlick allows for "professional play" if the agent *feels* joy. Some read him as requiring the absence of external compulsion. Others say subjective joy is enough. I need to pick one. I'll pick the stricter reading: External compulsion/instrumentalization kills the "play" character regardless of subjective feeling, because it turns the activity into a means.
      *   *Wait, reconsider:* Schlick says the goal is to make work *become* play. If the esports player loves it, is it work? The prompt says "practising... under coaches and performance analytics." This implies discipline imposed from outside. Schlick values *freedom*.
