      *   *Work vs. Play:* Work is done for an external end (money, survival). Play is done for its own sake. A meaningful life maximizes play.
      *   *The Ideal:* The ideal is to make work into play (loving what you do so the distinction vanishes) or to minimize necessary labor to maximize leisure/play.
      *   *Time:* The "eternity" of the moment. Quality over quantity.
      *   *Nuance:* Schlick isn't a crude hedonist. He talks about *joy* (Lust/Freude) but often links it to the unimpeded functioning of capacities. He values *activity*.

