  2.  **Drafting - Section by Section:**

      *   **Section 1: The theory, in brief (~200 words)**
          *   *Goal:* Explain Gricean pragmatics simply. Speaker meaning = intention recognition. Implicature = what is suggested beyond literal meaning based on the assumption of cooperation.
          *   *Drafting:* Start with H.P. Grice. Communication isn't just code; it's mind-reading. To mean something is to intend the listener to recognize that intention. The Cooperative Principle assumes participants are trying to be truthful, relevant, and clear. When someone says something seemingly odd, we infer an "implicature" to make sense of it. For example, if asked "Is he a good philosopher?" and one replies "He writes nicely," the implicature is "He's not a good philosopher." This relies on shared context. But if the listener misidentifies the intention or the context, communication fails. In *Emma*, Austen dramatizes this fragile machinery. She shows that hearing is not passive reception but active construction. When that construction goes wrong, it's not always because the signal was noisy, but because the hearer's model of the speaker's mind was flawed. Grice gives us the mechanics; Austen gives us the stakes.

      *   **Section 2: The charade misfire (~350 words)**
          *   *Goal:* Analyze Mr. Elton's charade. Emma gets act-type (courtship) right, addressee (Harriet vs. Emma) wrong. Gricean uptake failure.
          *   *Drafting:* The charade scene is a perfect laboratory. Mr. Elton writes a riddle whose answer is courtship. He intends it for Emma. Emma, convinced Elton loves Harriet, decodes the riddle correctly as a proposal but assigns the recipient incorrectly. She believes Elton intends her to recognize his intention toward Harriet. Grice requires "uptake"—the hearer must recognize the speaker's intention for meaning to occur. Here, uptake fails partially. The illocutionary force (proposal) is felt, but the propositional content (who is being proposed to) is distorted by Emma's prior bias.
          *   Emma reasons from relevance: Why would Elton give this to Harriet? Because he loves her. This seems relevant to Emma's project of matchmaking. Knightley, however, reasons from the same evidence to a different conclusion. He sees Elton's behavior as relevant to Emma herself because Elton seeks status and Emma offers it. Emma's inference consists in filtering evidence through her own narrative desires. She treats Elton's words as cooperative contributions to her matchmaking scheme, not as independent signals of his own desire. When Elton finally proposes to Emma directly, the shock reveals the gap. The implicature existed only in Emma's head. Grice explains the mechanism of the error—mismatched context assumptions—but cannot explain why Emma was so blind. The theory describes the broken link; the novel shows the emotional architecture supporting the blindness. Emma wasn't mishearing sounds; she was mishearing minds.

      *   **Section 3: Frank Churchill and the ethics of implicature (~350 words)**
          *   *Goal:* Frank Churchill's deception. Says nothing false, implicates nothing true. Exploits cooperation.
          *   *Drafting:* Frank Churchill operates in the gray zone of Gricean maxims. He rarely lies outright. Instead, he generates false implicatures by exploiting the assumption of cooperation. When discussing the pianoforte, he suggests it was a gift from Mr. Dixon to Jane Fairfax, knowing Emma will assume a romantic link. He says nothing false—it *was* sent from Ireland—but implicates a relationship that doesn't exist (it was from him). He relies on Emma's desire for gossip and romance to fill in the blanks.
          *   This is deception via implicature. Grice assumes speakers generally adhere to the Cooperative Principle. Frank adheres to the letter of the maxims while violating the spirit. He is relevant and truthful in a narrow sense, but misleading in intent. This highlights an ethical dimension Grice's logic overlooks. Communication relies on trust. Frank weaponizes that trust. Emma's error here is assuming Frank is cooperative regarding *her* understanding, when he is actually cooperative only regarding *concealment*.
          *   Knightley again sees through this, not because he has better data, but because he suspects Frank's intentions are not transparent. Frank's success depends on Emma's inattention to other minds. She treats his words as windows into reality, not as moves in a social game. The novel suggests that accurate hearing requires moral scrutiny, not just logical parsing. To hear correctly is to judge the speaker's character. Frank shows that implicature can be a tool of manipulation when the hearer assumes virtue where there is only polish.

      *   **Section 4: Narration as a second channel (~250 words)**
          *   *Goal:* Free indirect discourse as implicature for the reader. Grice's dyad vs. Reader/Author/Narrator.
          *   *Drafting:* Grice models a dyad: speaker and hearer. Austen's free indirect narration creates a triad. The narrator reports Emma's thoughts without fully endorsing them, generating implicatures for the reader. When the narration says Emma felt certain Elton loved Harriet, the reader is invited to infer that Emma is mistaken. The narrator is being cooperative with the reader, even when Emma is not cooperative with reality.
          *   This creates a layer of meaning unavailable to the characters. We hear Emma hearing Elton, and we hear the narrator hearing Emma. The gap between Emma's confidence and the narrator's subtle irony is where the real meaning lives. Grice's framework struggles here because the "speaker" is split. Is the narrator implicating that Emma is foolish? Yes. But this isn't a conversational exchange; it's a literary device. The reader becomes the ideal Gricean hearer, recognizing the author's intention to show us Emma's limitations. We succeed where Emma fails because we are given access to the context she ignores. The narration acts as a corrective lens, generating implicatures about Emma's reliability that Emma herself cannot generate.

      *   **Section 5: Where Austen resists Grice (~250 words)**
          *   *Goal:* Moral verdict (inattention vs. stupidity). Gricean or anti-Gricean? Where theory misfires.
          *   *Drafting:* Grice treats communication as a logical puzzle. Austen treats it as a moral one. The novel's verdict is that Emma's fault is not stupidity but inattention to other minds. This is partially Gricean: she fails to recognize intentions. But it goes deeper. Grice assumes we *want* to understand. Austen shows we often prefer our own stories. Emma's mishearings are protective; they shield her from uncomfortable truths about her own loneliness or Harriet's vulnerability.
          *   Furthermore, Grice's model assumes a level playing field of power. Austen shows power dynamics dictate who gets heard. Emma imposes meanings on Harriet, who cannot correct her. Grice's "recognition of intention" requires the hearer to have agency. Harriet does not. Finally, Grice cannot account for the emotional cost of being misheard. For Austen, mishearing is a violence. It isolates. The theory explains the mechanics of the error, but not the pain. Austen resists the idea that communication is merely information transfer. It is relationship building. When Emma finally listens to Knightley, she isn't just decoding data; she is submitting to love. That shift is beyond Grice's logic.

      *   **Section 6: What the novel adds (~200 words)**
          *   *Goal:* What fiction shows that argument doesn't. Where to abandon the reading.
          *   *Drafting:* Argument abstracts; fiction embodies. Grice gives us the schematic of miscommunication; *Emma* gives us the lived experience. We feel the embarrassment of the charade and the betrayal of Frank's secrets. The novel shows that accurate hearing requires humility. We must abandon the Gricean reading where it suggests communication is purely cognitive. Austen shows it is somatic and social. It happens in ballrooms and carriages, charged with status and desire.
