      *   *Sequencing the 50 Minutes:* Weave this into the prose. Start with the framework (10 mins), then the case (20 mins), then the evidentiary problem (10 mins), then the misconceptions/explain vs. excuse (10 mins). Wait, need to integrate the misconceptions throughout.
