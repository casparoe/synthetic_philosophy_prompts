      *   *Conceptual Dependencies:* Why framework first? If you start with the history, the students become historians. They get bogged down in "did this happen?" rather than "how do we explain this?" The framework provides the taxonomy of explanation. Without it, Browning and Goldhagen look like they are arguing about facts, when they are arguing about weights of causal variables. If you reverse it, the framework feels imposed.
      *   *Sequencing:* Start with the triad (Situation, Culture, Character). Then introduce the case. Then introduce the evidentiary problem (the testimony). Then handle the misconceptions as they arise naturally from the tension between the case and the framework.
