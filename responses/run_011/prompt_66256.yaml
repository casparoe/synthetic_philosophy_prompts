answer: |-
  Dear Colleague,

  It is a genuine pleasure to correspond with you about this session, though I share your apprehension about the compression required. Fifty minutes is barely enough time to define the terms, let alone dismantle the intuitions students bring to perpetrator psychology, but your framing device is robust enough to carry the weight if the load is distributed correctly. You asked me to reason out loud about the conceptual dependencies before offering a sequence, and I think this is the crux of the matter. The three-place framework of situation, culture, and character must be established before the historical case is put on the table, because if you reverse that order, the students will treat the framework as a post-hoc categorization of facts rather than a prior condition for making sense of them. If you begin with the battalion, the gravity of the history will collapse the conceptual space; the students will immediately begin judging the men rather than analyzing the explanation, and the triad will feel like an artificial grid imposed on a reality they feel they already understand through moral outrage. By introducing the taxonomy of explanation first, you equip them with the tools to dissect the case rather than be consumed by it. You need them to see that situation, culture, and character are not competing truth claims but competing loci of causal gravity, and that distinction is invisible if they are already immersed in the bloodiness of the specific event. What breaks if you reverse the order is the possibility of philosophical neutrality; the history becomes the master, and the philosophy becomes the servant, whereas your goal is to show how the philosophy constrains what we can claim to know about the history.

  Given that dependency, I would sequence the fifty minutes by devoting the first ten to constructing the three-place framework without any reference to the battalion, using trivial or abstract examples to illustrate how situational pressure, cultural vocabulary, and character disposition operate differently. This isolates the conceptual machinery. You then spend the next twenty minutes introducing the case of the first mass shooting, specifically the commander's offer to stand aside, using it to test the machinery they just built. This is the right case to build everything on because it is the only moment where the variable of direct coercion was explicitly manipulated by the authority figure, creating a natural experiment within the historical record. For this case to do the work you need, it must feature the explicit lack of punishment for those who opted out, as this neutralizes the situational argument regarding immediate authority and force, forcing the explanation toward character or culture. However, it must not feature any glorification of those who stood aside, because that introduces a moral judgment that obscures the explanatory question. You must also ensure the case includes the fact that the majority who stayed went on to kill repeatedly over the following year, because without that longitudinal element, you cannot discuss the situational factor of routinization which Browning relies upon to explain why ordinary men become hardened killers. If you judge this case unsound, a better one would be hard to find, precisely because most other instances lack the explicit opt-out clause, but if you must, you could look to the transition from shooting to gassing, where physical distance changes the situational variable, though that loses the immediacy of the peer pressure element.

  The next ten minutes should be dedicated to the evidentiary wrinkle you identified, namely that the source material consists of self-exculpatory testimony given decades later by suspects. This is where you challenge the reliability of the very data they are using to build their explanations. The final ten minutes should be reserved for addressing the misconceptions and the closing question. Regarding the misconceptions, you should head them off in the order they threaten to derail the specific segment of the class. The fear that to explain is to excuse must be defused before anyone voices it, ideally in your opening remarks when you set the ground rules, because if that takes root, the philosophical inquiry shuts down immediately. The misconception that Browning's title implies anyone would do it should be addressed when you discuss the situational framework, clarifying that probabilistic claims are not universal claims. The reflexive twin, that the student certainly would not have, should be allowed to surface briefly but then corrected by pointing to the opt-out data which shows that refusal was possible but rare, complicating the simple moral self-assessment. The idea that Goldhagen is making a claim about Germans as a kind of people rather than about beliefs should be corrected when you discuss the cultural category, distinguishing between essentialism and socialization. The belief that the obedience experiments are studies of perpetrators should defused when discussing situation, noting that those experiments measured compliance with authority rather than participation in ideological violence. The notion that the men who stood aside settle the character question in the affirmative should be head off during the case analysis by pointing out the small sample size and the lack of follow-up on their later lives. Finally, the claim that the testimony is worthless because it is self-exculpatory should be addressed during the evidentiary section, not by dismissing it, but by noting that even biased testimony reveals the vocabularies of justification available to the agents, which is data for the cultural explanation even if it is unreliable for the character explanation.

  There are boundaries you must draw explicitly to keep the session within philosophical limits. You mentioned declining the methodological quarrels over Goldhagen's handling of interviews and the legal history of the prosecutions, but you should also decline to teach the broader strategic context of the Eastern Front, as that invites a justification based on military necessity which distracts from the moral psychology. You need a sentence to say this to their faces, and I suggest you say something like this: We are not here to reconstruct the Holocaust, but to reconstruct the logic of explanation, and treating this event as a window into the whole would collapse the distinction between the sample and the population. This makes clear that you are using the history as a case study for a philosophical problem, not teaching the history itself.

  You are absolutely right to resolve not to run a poll asking them whether they would have stood aside. That question invites performative humility or arrogance and relies on a counterfactual imagination that is philosophically empty. It gets them thinking about their own virtue rather than the structure of the situation. To get the same self-involvement without the self-congratulation, ask them to write down the single most persuasive reason a man who did shoot would give for his own action, without judging its truth. This forces them to inhabit the reasoning of the perpetrator without endorsing the act, which is the core skill of explanatory understanding. It moves them from judging the agent to reconstructing the agency.

  For your closing question, you need something that tests whether they understand the underdetermination of the explanation by the evidence. Ask them this: If you found out that every man who stood aside later volunteered for killing duties, which explanation collapses and which gains weight? A student who has absorbed only the moral horror will answer badly by saying that it proves they were all monsters anyway, which bypasses the explanatory framework entirely and retreats to character essentialism without evidence. A student who has grasped the underdetermination will answer well by saying that the character explanation based on the initial refusal becomes untenable, but the situational explanation of routinization gains weight, showing that the variables are dynamic and that the initial choice does not fix the moral identity of the agent. This demonstrates that they understand the explanations are not static labels but competing hypotheses about causal mechanisms that shift over time. If they can see that the evidence changes the weight of the explanation rather than simply confirming a moral verdict, then you have succeeded in teaching them the philosophy rather than just the history. I hope this helps you structure the hour, and I wish you the very best with the session.
