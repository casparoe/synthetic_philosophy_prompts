answer: |-
  The reference class problem is routinely deployed as the decisive objection against frequentist interpretations of probability, and the structure of the objection is familiar enough to require only brief restatement. The frequentist identifies the probability of an event with the limiting relative frequency of that event within a specified reference class. The problem arises because any single event or object possesses indefinitely many properties, and thus belongs to indefinitely many different classes. A particular individual, for instance, may be classified as a smoker, or as a male, or as a male smoker, or as a male smoker over forty, or as a male smoker over forty with a specific genetic marker. Since the limiting frequency of the outcome of interest, say developing lung cancer, varies across these classes, the frequentist definition yields indefinitely many different probabilities for the same single case. Without a principled method for selecting the unique, correct reference class, the frequentist cannot assign a determinate probability to singular events. The standard conclusion drawn from this predicament is that frequentism is fundamentally incapable of making sense of single-case probability, and therefore we must adopt an interpretation that can, such as a propensity account where chances are intrinsic to the token situation, or a subjectivist account where probabilities are degrees of belief held by an agent regarding that specific case. This move is persuasive only if the reference class problem is a local pathology unique to frequentism, but I want to argue that this assumption is false. The reference class problem is not a bug specific to the frequentist engine; it is a general feature of how any probabilistic framework carves up the space of possibilities. Once we recognize that the problem is universal rather than parochial, it ceases to function as a knockout punch against frequentism, and arguments that rely on it to motivate a shift to credences or propensities beg the question by assuming the very advantage they seek to prove.

  To see why the problem is universal, we must first be precise about what generates it. The core issue is not merely that objects have multiple properties, but that assigning a probability value requires a prior decision about which properties are probabilistically relevant and which are to be ignored. For the frequentist, this manifests as the choice of a class. For the subjectivist, however, the problem reappears at the stage of model construction and conditionalization. A Bayesian agent assigns credences to propositions, and updates those credences by conditionalizing on evidence. But propositions do not present themselves to the agent pre-packaged with their probabilistic significance already determined. To conditionalize, the agent must formulate the evidence as a proposition within a specific algebra of events. This requires partitioning the space of possibilities. If I am assessing the probability of a hypothesis, I must decide which background conditions to include in the description of the evidence and which to treat as fixed or irrelevant. If I include too little information, my credence may be ill-calibrated; if I include too much, I may fail to find any relevant past cases to guide my prior, or I may fragment my algebra so finely that learning becomes impossible. The subjectivist is thus faced with a partition problem that is structurally identical to the frequentist reference class problem. She must decide which features of the situation define the event space over which her probability function is defined. There is nothing in the axioms of probability coherence that dictates how this partition should be drawn. Coherence constrains the relationships between probabilities once the algebra is fixed, but it is silent on how to fix the algebra in the first place. Consequently, the subjectivist suffers from the same underdetermination as the frequentist: indefinitely many partitions are compatible with the requirement of coherence, yet they yield different probability assignments for the single case at hand.

  One might object that the subjectivist has a resource the frequentist lacks, namely the requirement to conditionalize on total evidence. If the agent simply conditions on everything she knows, she avoids the arbitrariness of selecting a reference class because she is not selecting a class at all; she is using the unique description of the world available to her. However, this reply dodges the substance of the problem. The notion of total evidence is not a magic bullet because evidence must be processed to be useful. To treat a piece of information as evidence is to assume it is probabilistically relevant to the hypothesis in question. If I condition on a property that is statistically independent of the outcome, I am effectively adding noise to my calculation, but if I omit a property that is relevant, I am guilty of ignoring evidence. The decision about which features of the total situation to encode into the propositions of my algebra is exactly the decision about which reference class is appropriate. Suppose I know that an individual is a male smoker over forty with a specific genetic marker. To conditionalize on this total evidence, I must have a prior probability distribution defined over propositions involving these specific properties. But how did I arrive at that prior? If I derived it from frequency data, I am back to the frequentist problem of choosing the class from which to draw the statistics. If I derived it from subjective judgment, I need a principle to tell me why I judged the genetic marker relevant but the individual's shoe size irrelevant. That principle of relevance is precisely what the reference class problem demands. Without it, the instruction to conditionalize on total evidence is empty, because any description of the evidence is necessarily a abstraction that highlights some features and suppresses others. The subjectivist does not escape the reference class problem; she merely internalizes it as a problem of predicate selection and algebra construction.

  The propensity theorist might claim a clearer escape route. On a propensity account, chances are physical dispositions inherent in the specific token setup. The probability of this particular radium atom decaying in the next hour is determined by the physical properties of this atom, not by its membership in a class of similar atoms. Therefore, the reference class problem simply does not arise for propensities, because the chance attaches to the case itself. This objection relies on a metaphysical picture that is far more obscure than the statistical problem it aims to solve. To say that a propensity attaches to the token case is to say that the chance is determined by the properties of that case. But which properties? If the chance is determined by all properties, then every token situation is unique, and chances become unrepeatable and unknowable, rendering the concept empirically useless. If the chance is determined by only some properties, then we are back to the problem of selecting which properties constitute the relevant setup. The propensity theorist must distinguish between properties that are constitutive of the chance setup and those that are accidental. But this distinction is exactly the distinction between reference class members and non-members. To assert that the propensity is fixed by the mass and charge of the particle but not by its position in the laboratory is to make a claim about statistical relevance that requires empirical justification. The propensity account does not dissolve the reference class problem; it merely relocates it from the definition of probability to the metaphysics of the chance setup. It asserts that there is a fact of the matter about the correct class, whereas the frequentist admits the class is a methodological choice, but neither provides a non-circular account of how that fact or choice is identified without appealing to the very frequency data the propensity theorist claims to transcend.

  If the reference class problem is indeed a general structural feature of probabilistic reasoning rather than a specific failure of frequentism, we must ask what remains of the frequentist position once this symmetry is granted. The standard critique assumes that because frequentism cannot solve the reference class problem uniquely, it fails to deliver probabilities. But if no interpretation can solve it uniquely, then the failure is not distinctive to frequentism. The question then shifts from who avoids the problem to who manages it best. Here, the frequentist may actually hold a comparative advantage. The subjectivist relies on coherence and perhaps calibration to discipline her choice of partition and priors. Coherence is too weak to constrain the partition, as noted before, and calibration is a posterior constraint that only tells you if you were wrong after the fact. The frequentist, by contrast, has access to empirical procedures for narrowing down reference classes. Statistical tests for homogeneity, causal modeling, and significance testing are tools designed specifically to address the reference class problem by identifying which properties make a difference to the frequency of the outcome. While these tools do not guarantee a unique correct class, they provide an empirical methodology for refining classes toward greater predictive accuracy. The subjectivist who chooses a partition based on intuitive relevance lacks this empirical feedback loop unless she implicitly relies on frequentist data to inform her priors. Thus, even if the reference class problem is universal, the frequentist is better equipped to tackle it because her interpretation explicitly ties probability to empirical features of the world that can be tested for relevance. The subjectivist treats the partition as a framework choice, often insulated from empirical falsification by the flexibility of Bayesian updating, whereas the frequentist treats the class selection as a hypothesis about the world that can be confirmed or disconfirmed by data.

  It is important, however, to acknowledge where this defense might overreach. There is a sense in which the reference class problem is more constitutive for frequentism than for subjectivism. For the frequentist, probability is defined as frequency in a class. If the class is indeterminate, the probability is literally undefined on the theory's own terms. For the subjectivist, probability is defined as degree of belief. Even if the partition is arbitrary, the credence exists as a psychological state. The subjectivist can say, relative to this partition, my probability is X, and relative to that partition, it is Y, without contradiction, because credences are relative to the agent's representation. The frequentist wants to say the probability is a fact about the world, so the indeterminacy of the class threatens the objectivity of the probability itself. Therefore, it would be too strong to claim that the reference class problem affects both interpretations in exactly the same way. It bites deeper into the frequentist ontology. However, this difference does not support the standard knockout argument. The standard argument claims that frequentism fails because it cannot handle single cases, implying that credences or propensities succeed where frequentism fails. But if credences and propensities also rely on unresolved choices about relevance and partitioning to deliver single-case values, then they do not succeed in providing a determinate answer either; they merely hide the indeterminacy behind the veil of subjective rationality or metaphysical disposition. The subjectivist delivers a determinate number, but that number is only as justified as the partition she chose to generate it. If the partition is arbitrary, the credence is arbitrary. Thus, the frequentist is not uniquely unable to handle single cases; rather, no interpretation can handle single cases without making assumptions about relevance that are not guaranteed by the interpretation itself.

  The defensible version of the thesis, then, is not that the reference class problem is equally easy for everyone to solve, but that it is equally unavoidable. It is a problem of induction and relevance that precedes the choice of probability interpretation. Any argument that moves from the existence of the reference class problem directly to the rejection of frequentism assumes that the alternative interpretations have solved the problem of relevance, when in fact they have only displaced it. To argue that we should adopt credences because frequentism cannot select the right reference class is to assume that the agent knows which evidence is relevant to conditionalize upon, which is the same problem in different clothing. To argue for propensities is to assume we know which properties constitute the chance setup, which is again the same problem. Once we recognize that the selection of relevant properties is a prerequisite for any probabilistic assignment, regardless of interpretation, the reference class problem loses its force as a discriminator between theories. It becomes a constraint that all theories must accommodate, rather than a flaw that falsifies one.

  This leaves the frequentist in a position that is vulnerable but not uniquely so. The frequentist must admit that single-case probabilities are always relative to a chosen model of the situation, where the model is specified by a reference class. This is a concession, but it is a concession that mirrors the subjectivist's admission that credences are relative to a partition and the propensity theorist's admission that chances are relative to a setup description. What saves the frequentist from oblivion is that this relativity is empirically tractable. We can test whether a reference class is homogeneous. We can test whether adding a property changes the frequency significantly. The frequentist account makes the arbitrariness explicit and subject to statistical scrutiny, whereas the subjectivist account often leaves the arbitrariness of the partition implicit within the prior. Therefore, the reference class problem cannot be used to drive us away from frequentism toward credences or propensities, because those destinations offer no shelter from the storm. They offer different vocabularies for describing the indeterminacy, but no mechanism for eliminating it. If we are to abandon frequentism, it must be for reasons other than its inability to solve the reference class problem, such as its inability to make sense of probabilistic laws in deterministic systems or its handling of counterfactuals. But on the specific issue of single-case assignment and the classification of events, the frequentist is standing on ground that is no shakier than that of her rivals. The argument that she is must assume that the rivals have solved the problem of relevance, and that assumption is precisely what is in doubt. So long as the carving of possibility space remains a precondition for probability assignment rather than a output of it, the reference class problem remains a universal condition of probabilistic reasoning, and no interpretation can claim immunity from it to the detriment of another.
