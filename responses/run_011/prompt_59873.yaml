  Defined upon the shore and nothing more,
  To catch the pale green gleam the night provides.
  It names the glow that haunts the bay's dark floor,
  Wherever such a colouring abides.
  No boat required to know what fits the term,
  For any world where such a glow appears,
  The rule holds fast, a quiet inner germ,
  Deciding truth before the vessel steers.
  Yet launch a boat and cut the glassy tide,
  The look dissolves into a living seed.
  Now fixed to this beast living deep inside,
  A necessary truth born of the deed.
  When world described is where you firmly stand,
  And light returns to logic's open hand.
