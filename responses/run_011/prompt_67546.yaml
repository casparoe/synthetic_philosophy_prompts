answer: |-
  Here is the diagnosis.

  ### 1. The Diagnosis: Substantive Scope, Not Just Verbal Noise

  Your hypothesis is correct, but it is too charitable to Camp A. You suggest the dispute is about "what gets held fixed" and partly verbal. I argue it is **substantive**, but the substance lies in a category error regarding the **scope of agency**.

  Camp A treats Good's theorem as a universal norm of rationality: "A rational agent *ought* to seek free information." Camp B treats it as a contingent engineering claim: "An agent *will* benefit from free information only under specific structural conditions."

  The dispute feels endless because Camp A is defending a **mathematical tautology** while Camp B is attacking a **psychological intuition**. Good's theorem is mathematically undeniable *within its axioms*. It is a simple inequality derived from the convexity of the maximum function. If you fix preferences, fix the action set, fix the environment's response, and define cost as zero, expected utility cannot drop. Camp A knows this. When they say "Camp B is wrong," they mean "Camp B is violating the axioms."

  Camp B knows this too. When they say "Camp A is wrong," they mean "The axioms exclude the interesting cases."

  So, is it verbal? Yes, insofar as "Value of Information" is doing double duty. For Camp A, "Value" is a formal property of a Bayesian updater. For Camp B, "Value" is a pragmatic measure of welfare in a complex system. But it is also substantive because it determines whether decision theory is a **logic of consistency** (Camp A) or a **guide to living** (Camp B).

  Your hypothesis that it's about "what gets held fixed" is the right lever. But the specific thing being held fixed is **the independence of the environment from the agent's information state**. Camp A assumes the world does not care what you know. Camp B argues the world often cares deeply (e.g., negotiations, signaling, psychological distress).

  **Verdict:** Your diagnosis is right, but sharpen it. It is not just that preferences or acts move; it is that the **causal structure** of the problem changes when information becomes observable or when the agent's psychology is non-separable. Camp A is defending a theorem about single-agent decision problems against nature. Camp B is complaining that most human problems are multi-agent or psychological.

  ### 2. The Absorption Worry (Case 1)

  You asked whether Camp A's ability to "absorb" counterexamples by expanding the utility function makes the theorem unfalsifiable and empty.

  **It does make it empty if unchecked.** If Camp A is allowed to redefine the utility function to include "peace of mind," "curiosity satisfaction," or "dread avoidance" for every single case, Good's theorem becomes a trivial truth: "If you define utility such that information never hurts, information never hurts." This strips the theorem of all normative force. It no longer tells you whether you *should* seek information; it only tells you that you are consistent with your own definition of utility.

  **Is there a principled line?** Yes. The line is **Separability**.
  Standard decision theory (Savage, Ramsey) assumes utility is defined over **world states**, not **belief states**. The outcome is "Child has disease" or "Child does not have disease." The utility is attached to those facts.
  If the utility depends on *whether the parent knows* the child has the disease, distinct from the disease itself, you have violated the separability assumption. You have moved from standard decision theory to **recursive utility** or **psychological game theory**.

  Camp A's dodge is to claim that "Parent's mental state" is just part of the "World State."
  Camp B's counter is that if the mental state is part of the world state, then the act of learning *changes the world state* before the decision is made. Good's theorem assumes the state of the world is fixed until the *act* is chosen. If the *observation* itself changes the state (by changing the belief-dependent utility), the theorem's timeline is broken.

  **The Constraint:** To prevent the theorem from being empty, you must constrain the utility function to be **information-independent** prior to the act. If the utility function explicitly depends on the information set (e.g., $U(outcome, belief)$), Good's theorem does not apply. Camp A must concede that in these cases, the theorem is silent, not vindicated. If they insist it still applies, they are engaging in question-begging re-description.

  ### 3. The Case That Forces Concession

  Is there a case where Camp A must concede, rather than re-describe? Yes. **Observable Information in Strategic Settings (Case 3 refined).**

  Consider a negotiation where a deal is contingent on "Buyer remaining unaware of Defect X."
  *   **Camp A:** "Looking is costly because it voids the deal."
  *   **Camp B:** "Looking is resource-costless. The cost is purely structural."

  Here is the forcing move: Good's theorem relies on the **"Ignore It" Option**. It says: "If the information is bad, just act as if you didn't see it."
  In a strategic setting where your information state is observable (or inferable) by an opponent, **you cannot ignore the information because you cannot hide the fact that you looked.**

  If the opponent knows you looked, their strategy changes. If their strategy changes, your payoff matrix changes. If your payoff matrix changes *because you looked*, then the act of looking has altered the available acts or their consequences *independently of your will*.

  Camp A cannot model this as "costless information" without lying. They must model the "cost" as part of the information price. But if the price is zero resources and zero time, and the only "cost" is the strategic shift, then Camp A must admit: **Good's theorem does not apply to games with observable information acquisition.**

  This forces Camp A to concede that the theorem is not a universal norm of rationality. It is a theorem about **single-agent problems against nature where information acquisition is private.** If they deny this, they are claiming that a negotiator *ought* to look at the inspection report even if looking voids the contract, because "in the abstract, information is valuable." That is absurd. They must concede the scope limit.

  ### 4. What Counts as Progress?

  Given this diagnosis, a new theorem is not the answer. Good's theorem is mathematically correct. Data is not the answer. This is conceptual.

  **Progress is a Taxonomy of Contexts.**
  The group needs to stop asking "Is Good's theorem true?" and start asking "Which decision context are we in?" You need to explicitly distinguish three buckets:

  1.  **Decision Against Nature (Private Info):** Good's theorem holds. You should always look. (e.g., Checking the weather before a solo hike).
  2.  **Decision With Belief-Dependent Utility:** Good's theorem does not apply. Information has intrinsic disutility. (e.g., The parent testing the child). The norm is not "maximize expected utility" but "manage information exposure."
  3.  **Strategic Decision (Public Info):** Good's theorem does not apply. Information has strategic cost. (e.g., The negotiation, the hiring committee). The norm is "manage signaling."

  **Why the argument feels substantive:**
  It feels substantive because everyone wants **Decision Theory to be a Unified Field Theory of Rationality**. We want one rule ("Maximize Expected Utility") that tells us how to live. Good's theorem looks like that rule for information.
  The frustration arises because Camp A wants to preserve the purity of the Unified Theory (by stretching definitions), and Camp B wants to preserve the accuracy of the advice (by pointing out exceptions).
  You are stuck because you are trying to solve a **boundary dispute** with **internal arguments**.

  **Recommendation:**
  Declare the "Universal Value of Information" dead. It only exists in the narrow lane of private, costless, belief-independent, single-agent problems. Acknowledge that outside that lane, "Value of Information" is context-dependent. Camp A wins the math; Camp B wins the application. The progress is admitting that "Rationality" requires different rules for different games, and trying to force them all into Good's framework is what's causing the circles.

  Stop trying to save the theorem. Map its borders.
