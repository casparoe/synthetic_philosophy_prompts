      *   Why it feels substantive: Because people want a universal norm of rationality ("Always seek truth"), but the math only supports a conditional norm ("Always seek truth *if* you are a lone agent with fixed preferences over world states"). The gap between the universal intuition and the conditional math creates the friction.

  7.  **Drafting the Response (incorporating constraints):**
      *   *Tone:* Direct, analytical, American English.
