      *   *Absorption Worry:* Address the unfalsifiability risk. The line is between *consequences* and *process*. If utility depends on the *process* of learning, it's not standard DT.
      *   *Forcing Concession:* Game theory/observable information states.
      *   *Progress:* Taxonomy of contexts.

  8.  **Refining the Argument:**
      *   *User's Hypothesis:* "Disagreement about which object gets held fixed." -> **Confirm this.** It's the core.
      *   *Verbal vs. Substantive:* It's both. Verbal because "Value" is overloaded. Substantive because the normative claim ("You ought to look") fails outside the fixed parameters.
      *   *Absorption:* If Camp A absorbs *everything* into the utility function, the theorem is trivial. The principled line is **Separability**. Preferences over outcomes must be separable from the information path to them. If they aren't, Good's theorem doesn't apply, and that's a feature, not a bug.
      *   *Forcing Concession:* The "Observable Information" case (Game Theory). If the opponent sees you look, you can't "ignore" the info because the act of looking changed the game. Camp A cannot model this as "costless info" without lying about the cost.
