      *   **Good's Theorem (Standard Form):** For a Bayesian agent with fixed preferences over outcomes, fixed action set, and costless information, the expected utility of acting *after* observing evidence is at least as high as acting *before*. $E[U|Info] \geq E[U|No Info]$.
      *   **Camp A (Defenders):** The theorem is mathematically sound within its axioms. Counterexamples violate assumptions (costless info, fixed preferences, fixed action set, ability to ignore). They treat counterexamples as modeling errors.
      *   **Camp B (Critics):** The assumptions are too restrictive for real-world application. Information *can* hurt because it changes the agent (preferences), the environment (other players), or the available actions. They feel Camp A is moving the goalposts by re-modeling.
      *   **User's Hypothesis:** It's a disagreement about what is held fixed (snapshot vs. extended) and partly verbal (different disciplines mean different things by "value").

  3.  **Evaluate the User's Hypothesis:**
      *   Is it right? Yes, largely. The core tension is between the *formal scope* of the theorem and the *practical scope* of the concept "value of information."
      *   Is it only half of it? There's a deeper issue about *normativity*. Camp A sees it as a norm of rationality (you *should* gather evidence). Camp B sees it as a descriptive claim about utility (information *does* increase utility).
      *   Is it verbal? Yes, "Value" is ambiguous. Instrumental value (achieving a goal) vs. Intrinsic value (truth/knowledge) vs. Strategic value (game theory).
