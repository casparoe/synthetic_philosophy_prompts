  *(Full credit: Excellent identification of the theoretical cost)*

  > **[Margin Comment next to "The etiological account says the gland has the proper function..."]:**
  > **Correct verdict.** This is the standard "normativity" advantage of EF accounts; they can distinguish malfunction from mere variation.
  >
  > **[Margin Comment next to "What it gives up is that malfunction becomes a matter of lineage history..."]:**
  > **Excellent insight.** You've correctly identified the metaphysical cost: **externalism**. The EF account sacrifices supervenience on current physical state. Two internally identical organisms can have different functional statuses based on history. This is exactly the "price" Millikan pays for normativity. Full credit.

  **Part (c) — 5/6 points**
  *(Deduction: 1 point for rigidity on "maintenance" vs. "origin")*

  > **[Margin Comment next to "I'd say the etiological account still assigns UV-screening as the gland's function in B."]:**
  > **Defensible, but contested.** You are applying a strict Millikan "Proper Function" (ancestral origin) reading. However, note the prompt's phrase: *"glands are maintained in that population on that basis."*
  >
  > **[Margin Comment next to "account has no way to upgrade it."]:**
  > **Deduction here.** Many etiological accounts (e.g., Selected Effects theories like Godfrey-Smith or Neander) grant function status based on *current maintenance* by selection, not just ancestral origin. By saying the account has "no way" to recognize the parasite-killing as a function, you overlook the resources modern SE accounts use to handle exaptation/maintenance. A more nuanced answer would acknowledge that while *ancestral* proper function is UV, *current* selected effect is parasites, and some etiological variants allow the latter to count.
  >
  > **[Margin Comment next to "On the causal-role account all three are equally functions..."]:**
  > **Good synthesis.** Even though (c) asks about EF, your comparison here correctly highlights the "liberality" problem of CR accounts (the problem of promiscuous functionality).

