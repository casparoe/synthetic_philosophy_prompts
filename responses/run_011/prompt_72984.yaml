  7.  **Addressing the Limits & Self-Application:**

      *   *Legitimacy:* The procedure assumes outcomes matter more than pure equality (instrumental legitimacy).
      *   *Authority:* The Committee is unelected. This is a "Gatekeeper" problem.
      *   *Self-Application:* Can this procedure be changed? Yes, by the Council.

  8.  **Review against Constraints:**

      *   *Tone:* Professional, direct, slightly academic but accessible.
      *   *Length:* The prompt is long, but the *Procedure* needs to be concise. I will ensure the Procedure section is distinct and dense but readable.
      *   *Philosophy:* Explicitly mention CJT bends (Independence -> Anti-Capture).
      *   *Plant Manager:* Use bold headers, clear "Stop/Go" logic.

  9.  **Final Polish:**

      *   Check the "Embarrassment" factor on Proposal 2. The user drafted it. I need to be firm but respectful. The veto power is the dealbreaker.
      *   Check the "Losers" requirement. The reasoning must be explicit about *why* a faction's concern was heard but outweighed by safety/charter.
      *   Ensure the "Empirical vs. Value" distinction is clear in the steps.

  **(Self-Correction during drafting):** I initially thought about having 5 steps. Let's condense to 4 critical filters to respect the time budget and attention span.
  1.  **Authority & Consistency** (Charter/Law)
  2.  **Safety & Competence** (The CJT/Technical core)
