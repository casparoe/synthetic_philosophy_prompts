answer: |-
  ### Part 1: The Philosophy and the Bends

  You asked for the Condorcet Jury Theorem (CJT) without the math. Here is the usable core: **If voters are more likely to be right than wrong, and they vote independently, adding more voters makes the group decision more reliable.**

  To make this runnable for your committee, I have bent three things:
  1.  **Independence:** CJT requires voters to be independent. Your council deliberates. *Bend:* We treat "Independence" as **"Protection Against Capture."** If one chamber (e.g., Manufacturers) can dominate the vote, independence is lost, and reliability drops.
  2.  **Competence:** CJT assumes voters are competent (>50% chance of being right). *Bend:* We distinguish **Technical Competence** (engineering physics) from **Stakeholder Competence** (operational reality). A layperson is incompetent on wall thickness but competent on "can I actually inspect this in the field?"
  3.  **Truth:** CJT seeks the "correct" answer. *Bend:* We seek the **"Defensible"** answer. A standard is "correct" only if it prevents failure *and* survives legal challenge.

  **The Distinction:**
  *   **Empirical Questions:** Can be answered with data (e.g., "Do fellows have fewer certification violations than associates?").
  *   **Value Questions:** Must be voted on by the Council (e.g., "Is it fair to weight votes by tenure?").
  *   **Your Committee's Role:** You do not answer the Value Questions. You determine if the Empirical thresholds are met to *allow* the Value Question to be asked.

  ---

  ### Part 2: The Governance Filter (The Procedure)

  *Print this section for the committee. It is designed to be read in 15 minutes.*

  **Instructions:** For each proposal, answer the four filters in order. If a proposal fails a filter, stop. Record the specific failure reason in the recommendation. If it passes all four, recommend "Proceed to Council Vote."

  #### Filter 1: Authority & Consistency (The "Can We?" Test)
  *Type: Empirical / Legal*
  **Question:** Does this proposal violate the current Charter, Bylaws, or any state boiler law that incorporates our governance structure by reference?
  *   **Data Needed:** Charter text, legal counsel review, list of states incorporating governance clauses.
  *   **Stop Condition:** **YES**, it violates a binding constraint. (Recommendation: Reject or require Charter Amendment first).
  *   **Move On Condition:** **NO**, it is legally permissible.
  *   **Narrow Condition:** It violates the *spirit* of the Charter (e.g., changes the balance of chambers) but not the letter. (Recommendation: Send back to proponent to draft a Charter Amendment concurrently).

  #### Filter 2: Safety & Competence (The "Will It Work?" Test)
  *Type: Mixed Empirical & Value*
  **Question:** Does this change increase the likelihood of technical error in the standards, or does it align voting power with verified technical competence?
  *   **Data Needed:** 20-year incident reports, certification violation records, member surveys on technical confidence.
  *   **Stop Condition:** Evidence suggests the change **increases risk** of vessel failure or removes a existing safety check without replacement.
  *   **Move On Condition:** Evidence suggests the change **maintains or improves** technical reliability.
  *   **Narrow Condition:** Competence is increased for *technical* clauses but decreased for *administrative* clauses. (Recommendation: Restrict the change to specific ballot types).
  *   **Note on CJT:** If the proposal reduces the number of voters (e.g., a veto panel), the burden of proof is on the proponent to show the *remaining* voters are significantly more competent than the excluded group.

  #### Filter 3: Balance & Capture (The "Who Wins?" Test)
  *Type: Value (Informed by Data)*
  **Question:** Does this proposal grant a single chamber or interest group a de facto veto, or shift the balance of power by more than 15% toward one chamber?
  *   **Data Needed:** Current voting records (who votes how), dues contribution by chamber, demographic breakdown of voters.
  *   **Stop Condition:** **YES**, it creates a minority veto (e.g., a panel that can block a majority) or effectively silences one of the three chambers.
  *   **Move On Condition:** **NO**, the balance remains within historical norms.
  *   **Narrow Condition:** It creates an imbalance only on specific issues. (Recommendation: Limit scope to non-safety critical annexes).
  *   **Judgment Call:** This is where you assess "Legitimacy." If the Manufacturers (40% of dues) feel silenced, they may leave. That is a governance failure even if the vote is legal.

  #### Filter 4: Acceptance & Stability (The "Will They Stay?" Test)
  *Type: Value / Political*
  **Question:** Is there a plausible path for the losing faction to accept this outcome without exiting the association or publishing a rival standard?
  *   **Data Needed:** Minutes from previous contentious votes, exit interview data, public statements by chamber leaders.
  *   **Stop Condition:** High probability of **schism** (rival standard) or **mass resignation** of a chamber.
  *   **Move On Condition:** Losers may complain but will remain engaged.
  *   **Narrow Condition:** Acceptance is possible only if specific safeguards are added (e.g., sunset clauses, appeal processes).

  ---

  ### Part 3: Running the Procedure on Live Proposals

  Here is the application of the Filter to your three scenarios.

  #### Proposal 1: Tier-Weighted Voting (Fellows = 2 votes, Associates = 1 vote)
  *   **Filter 1 (Authority):** **Pass.** Charter specifies "one member, one vote" for *council elections*, but standards ballots are governed by Council rules. Legal counsel confirms no statutory bar.
  *   **Filter 2 (Safety):** **Pass (Empirical).** Data shows Fellows have 60% fewer certification violations than Associates. CJT logic holds: weighting by competence likely improves technical accuracy.
  *   **Filter 3 (Balance):** **Fail (Narrow).** Manufacturers argue this weights the "Engineer" chamber disproportionately, as most Fellows are engineers, not manufacturers. It shifts power >15% toward the Engineer chamber.
  *   **Filter 4 (Acceptance):** **Risk.** Manufacturers threatened exit last time.
  *   **Verdict:** **Narrow and Return.**
  *   **Modified Version:** Apply weighted voting *only* to Technical Annexes (engineering specs), not to Administrative Chapters (fees, processes). Additionally, require a "Concurrent Majority" (must pass with >50% of Fellows AND >50% of Associates) to prevent total exclusion.
  *   **Turning Point:** Filter 3. The safety gain does not justify the political imbalance.

  #### Proposal 2: Technical Review Panel Veto (7 Senior Fellows, published reason)
  *   **Filter 1 (Authority):** **Pass.** Council can create sub-committees.
  *   **Filter 2 (Safety):** **Fail (Stop).** While intended to improve safety, a 7-person veto violates the CJT "Independence" condition. A small group is more susceptible to capture or groupthink than the 41-seat Council. Furthermore, it removes the "Majority Rule" safety net without data proving the Council is currently incompetent.
  *   **Filter 3 (Balance):** **Fail.** This is a minority veto. 7 people can overrule 41. It effectively silences the Public Interest and Manufacturer chambers on technical grounds defined solely by Engineers.
  *   **Verdict:** **Reject.**
  *   **Modified Version:** Convert the Panel to an **Advisory Body with Mandatory Response.** The Panel can flag a clause as "Unsound," but the Council must vote to override the flag with a 2/3 majority. This keeps the veto power with the diverse Council while forcing engagement with the experts.
  *   **Turning Point:** Filter 2 & 3. You asked for no softening: A veto panel is an oligarchy. It concentrates risk rather than spreading it. If the 7 are wrong, the standard fails. If the 41 are wrong, the error is more likely to be caught in debate.
  *   **Note on Authority:** As the drafter, you must recuse yourself from the committee vote on this specific proposal to maintain Filter 4 integrity.

  #### Proposal 3: Sortition Panel (1/3 Seats, Workers/Residents, Equal Vote)
  *   **Filter 1 (Authority):** **Pass.** Charter allows Council to determine seat allocation.
  *   **Filter 2 (Safety):** **Fail (Narrow).** Lay members lack Technical Competence (CJT condition). Voting equally on *technical annexes* (e.g., weld thickness) increases the probability of error.
  *   **Filter 3 (Balance):** **Pass.** It dilutes all existing chambers equally. No single group gains a veto.
  *   **Filter 4 (Acceptance):** **Risk.** Engineers may view this as politicizing safety science.
  *   **Verdict:** **Narrow and Return.**
  *   **Modified Version:** Reserve the seats for the Public Interest Chamber *only*. Sortition members vote equally on **Policy and Adoption** (e.g., "Should this standard be adopted?") but have **Consultative Only** status on **Technical Annexes** (e.g., "What is the pressure rating?").
  *   **Turning Point:** Filter 2. Legitimacy (Filter 3) is high, but Competence (Filter 2) is low for technical specifics. Split the ballot.

  ---

  ### Part 4: The Recurring Supermajority Request

  You asked how to handle proposals for supermajorities (e.g., "Safety clauses need 2/3 vote"). These arrive dressed as caution.

  **The Procedure's Handle:**
  Treat any proposal raising the voting threshold above 50% as a **Filter 3 (Balance)** issue, not a Safety issue.
  *   **The Rule:** A supermajority requirement is a **Minority Veto** in disguise. It allows 34% of the Council to block 66%.
  *   **The Test:** To pass Filter 2, the proponent must provide empirical evidence that a simple majority has *historically* caused a safety failure that a supermajority would have prevented.
  *   **Likely Outcome:** Since you likely lack data showing "51% votes caused explosions," these proposals will **Fail Filter 2** and be rejected or narrowed to "Charter Amendments only" (where you already have a 2/3 rule).

  ---

  ### Part 5: Limits, Legitimacy, and Self-Application

  **1. What This Cannot Settle**
  This procedure cannot settle **fundamental conflicts of value**. If the Manufacturer chamber believes "Cost Reduction" is a safety feature (because cheap boilers get replaced sooner) and the Engineer chamber believes "Over-Engineering" is safety, this procedure cannot decide who is right. It can only ensure the vote is fair. It assumes legitimacy comes from *process*, not *outcome*.

  **2. The Legitimacy Assumption**
  You asked if this assumes legitimacy is about correct outcomes rather than treating members as equals. **Yes, it does.** It explicitly prioritizes "Safety & Reliability" (Filter 2) over "One Member, One Vote" (Filter 3). It admits that on technical matters, expertise *should* weigh more, but balances this against the risk of capture. If your membership believes strongly in pure equality, this procedure will feel elitist. You must own that trade-off.

  **3. What Will Go Wrong First**
  *   **The Authority Challenge:** The first time you recommend "Reject" on a popular proposal, a Council member will ask: *"Who elected you seven to tell us what we can vote on?"*
      *   *Answer:* "We are not telling you how to vote. We are filtering proposals to ensure you don't vote on things that violate the Charter or risk schism. You retain the final vote."
  *   **The Data Gap:** Filter 2 asks for data on "technical error." You may not have clean data linking specific ballot clauses to specific failures.
      *   *Mitigation:* If data is missing, the default is **Status Quo**. The burden of proof is on the changer.

  **4. Can The Procedure Be Turned On Itself?**
  Yes. If a proposal arrives to *change this Decision Procedure*, it must pass this Decision Procedure.
  *   **The Paradox:** If the Committee votes to adopt a looser filter, they might allow a proposal that destroys the Committee's authority.
  *   **The Fix:** This Procedure is a **Committee Rule**, not a Charter Bylaw. The Council can override it at any time by a simple majority vote. This is a feature, not a bug. It reminds the Committee that they are servants of the Council, not masters. If the Council ignores your recommendation, you document the Filter failure in the minutes and let them take the risk.

  ### Summary for the Plant Manager (The 4-Page Constraint)

  1.  **Is it Legal?** (If no, Stop).
  2.  **Is it Safe?** (If it increases risk, Stop).
  3.  **Is it Fair?** (If one group gets a veto, Stop).
  4.  **Will They Stay?** (If a chamber quits, Stop).
  5.  **If it passes all four:** Send to Council with "Proceed" recommendation.
  6.  **If it fails one:** Send back to proponent with "Fix this specific thing" instruction.

  *Philosophy Note:* We are using the wisdom of crowds (Condorcet) but guarding against the crowd being bullied by experts or laypeople. We value safety over speed, and stability over purity.
