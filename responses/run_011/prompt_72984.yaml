  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**

      *   **User:** Director of Governance for a national professional association (12,400 members).
      *   **Context:** Publishes safety standards for pressure equipment (boilers, vessels, piping). Standards are incorporated by reference into state law (legal weight). Errors can lead to failures/accidents.
      *   **Current Governance:** Standards Council (41 seats, 3 chambers: Engineers/Inspectors, Manufacturers/Operators, Public Interest). 1 member = 1 vote. Simple majority passes standards. 2/3 + ratification for charter amendments.
      *   **Problem:** Recurring proposals to change voting weights/procedures (weighted voting, technical vetoes, sortition, supermajorities). Last fight was costly (board seat lost, manufacturer chamber threatened exit/rival standard).
      *   **Task:** Create a *decision procedure* for the Governance Committee (7 people: 2 engineers, 1 lawyer, 3 council members, 1 Director) to evaluate these proposals.
      *   **Constraints:**
          *   Committee has no political theory training.
          *   One member (retired plant manager) won't read > 4 pages.
          *   Time budget: 0.5 day per proposal (twice/year) + 1 hour prep.
          *   Output: Written recommendation to Full Council (readable by losers, shows engagement).
          *   Format: Ordered sequence of questions with explicit sufficiency conditions (Move on, Stop, Narrow/Return, Empirical vs. Value).
          *   Philosophy: Use Condorcet Jury Theorem (CJT) insights but keep it practical/plain language. Acknowledge limitations/bends.
          *   Application: Run the procedure on three specific proposals (Tier-weighted voting, Technical Review Panel veto, Sortition panel).
          *   Extras: Handle recurring supermajority requests. Explicitly state limits (legitimacy vs. correctness, committee authority, self-application).

  2.  **Deconstruct the Philosophy (Condorcet & Beyond):**

      *   *Condorcet Jury Theorem (CJT):* If voters are competent (>50% chance of being right) and independent, majority rule converges on truth as group size increases.
      *   *Deflationary Critiques:* Deliberation breaks independence. Credentials $\neq$ Demographic representation $\neq$ Competence on specific issues. Exam writers hold real power.
      *   *Application:* We need to balance *Competence* (safety/technical accuracy) with *Legitimacy* (acceptance by stakeholders/legal defensibility) and *Independence* (avoiding capture by one interest group).
      *   *Simplification:* Instead of "Truth," use "Safety & Reliability." Instead of "Independence," use "Balance of Interests."

  3.  **Drafting the Decision Procedure (The "Filter"):**

      *   *Goal:* A flowchart-like sequence of questions.
      *   *Constraint:* Must be short enough for the plant manager but rigorous enough for the lawyer.
      *   *Structure:*
          1.  Legal/Charter Compliance (Hard Stop).
          2.  Safety Impact (Empirical/Technical).
          3.  Stakeholder Balance (Legitimacy).
          4.  Implementation/Precedent (Practicality).
      *   *Distinctions:* Empirical (data-driven) vs. Normative (value judgment).
      *   *Bends:* CJT assumes independence; we know deliberation happens. We will treat "Independence" as "Protection against Capture." We drop the math of CJT and keep the intuition: *Does this change make the group more likely to be right, or just louder?*

  4.  **Developing the Steps (Iterative Refinement):**

      *   *Step 1: Authority.* Can we even do this? (Charter check).
      *   *Step 2: Safety.* Does this increase risk? (The core mission).
      *   *Step 3: Capture.* Does this give one chamber a veto? (The "Minority Veto" problem).
      *   *Step 4: Competence.* Does this align voting power with relevant knowledge *without* excluding necessary perspectives? (The CJT bit).
      *   *Step 5: Legitimacy.* Will the losers accept it? (The "Readable by losers" requirement).

      *Refining for the "4-Page Limit" constraint:* I need to keep the introduction brief and the steps punchy. I will structure the response so the Procedure itself is a distinct, printable section.

  5.  **Running the Procedure on the Three Proposals:**

      *   *Proposal 1: Tier-Weighted Voting (Fellows = 2 votes).*
          *   Step 1: Pass (Charter allows rule changes).
          *   Step 2: Safety? Maybe improves technical accuracy (CJT logic).
          *   Step 3: Capture? Risks alienating Manufacturers (who pay dues).
          *   Step 4: Competence? Yes, but...
          *   Step 5: Legitimacy? High risk of manufacturer exit.
          *   *Verdict:* Narrow/Return. Limit to non-safety annexes or require concurrent majority.
      *   *Proposal 2: Technical Review Panel Veto (The User's Draft).*
          *   Step 1: Pass.
          *   Step 2: Safety? Intended to improve, but...
          *   Step 3: Capture? Yes, creates an unelected oligarchy. Breaks the "Simple Majority" charter spirit.
          *   Step 4: Competence? High, but violates independence (deliberation bias).
          *   Step 5: Legitimacy? Low. Public interest/Manufacturers will hate it.
          *   *Verdict:* Stop/Reject. Convert to "Advisory with Mandatory Response."
      *   *Proposal 3: Sortition Panel (1/3 seats, workers/residents).*
          *   Step 1: Pass.
          *   Step 2: Safety? Risk of laypeople voting on technical annexes.
          *   Step 3: Capture? No, dilutes existing chambers.
          *   Step 4: Competence? Low on technical issues (violates CJT competence condition).
          *   Step 5: Legitimacy? High for public, low for engineers.
          *   *Verdict:* Narrow/Return. Sortition for *public interest* seats only, not technical annexes.

  6.  **Addressing the "Supermajority" Question:**

      *   These are often "Minority Vetoes" in disguise.
