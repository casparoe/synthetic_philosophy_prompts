answer: |-
  ## Part 1: The Decision Procedure (The "Autonomy Screen")

  **Purpose:** To sort LOIs based on how they utilize higher-level descriptions, without requiring reviewers to settle metaphysical debates about reductionism.
  **Time:** 10–15 minutes per LOI.
  **The "Third Thing":** The tool does not ask if the higher level is *real* (metaphysics) or if it is *derivable* (computation). It asks about **Stability under Intervention**. Does the higher-level description track a pattern that remains stable even if the lower-level details are scrambled, provided the higher-level state is held constant? This bypasses the "derivability is hard" problem (because we aren't asking if derivation is possible) and the "causal closure" problem (because we aren't asking if the lower level is bypassed, but if the higher level *constrains* it).

  ### The Questions

  **Q1. The Variable Check:** Does the proposal identify specific higher-level variables (e.g., "oscillation frequency," "institutional norm," "pressure") distinct from the lower-level variables (e.g., "neuron spike," "individual action," "particle position")?
  *   **No:** Stop. **Category (i) Decoration.** (The proposal uses emergence as a synonym for "complicated.")
  *   **Yes:** Proceed to Q2.

  **Q2. The Ignorance Test:** If a reviewer knew the exact state of every lower-level component, would the higher-level variable still be required to predict the specific outcome of interest *within the proposed timeframe*?
  *   **No (Micro is sufficient):** Stop. **Category (i) Decoration.** (The macro variable is just a summary label.)
  *   **Yes (Macro is required):** *Why?*
      *   *Answer A:* "Because calculating the micro is too slow/expensive." → Proceed to Q3.
      *   *Answer B:* "Because the micro-details are unavailable/unmeasurable in principle." → Proceed to Q4.
      *   *Answer C:* "Because the micro-details vary without changing the outcome." → Proceed to Q3.

  **Q3. The Robustness Check (For Answers A & C):** Does the proposal claim that the higher-level prediction holds true across *different* lower-level configurations that share the same higher-level state? (i.e., Multiple Realizability in practice).
  *   **No:** Stop. **Category (i) Decoration.** (It's just a specific simulation, not a general law.)
  *   **Yes:** **Category (ii) Explanatory Autonomy.** (Fundable as complex systems work. The macro variable carries predictive weight the micro description doesn't cheaply reproduce.)
  *   *Note:* If they claim the macro variable *changes* the micro laws, proceed to Q4.

  **Q4. The Constraint Check (For Answer B or Downward Causation Claims):** Does the proposal claim the higher level *constrains* the lower level (e.g., sets boundary conditions, channels energy) OR does it claim the higher level *overrides* the lower level?
  *   **Overrides (Magic):** Stop. **Flag for Philosophical Review.** (Violates causal closure; likely confused.)
  *   **Constrains (Channeling):** **Category (iii) Causal Constraint.** (Fundable if the mechanism of constraint is specified, e.g., structural boundary conditions.)
  *   **Unavailable Micro (Epistemic to Ontological Leap):** If the answer to Q2 was "Micro unavailable in principle," ask: "Does the unavailability of the micro *cause* the macro efficacy, or is it just an measurement limit?"
      *   *If "Causes efficacy":* Stop. **Flag for Philosophical Review.** (This is the "Epistemic to Ontological" fallacy. Ignorance does not generate power.)
      *   *If "Measurement limit, but macro is robust":* Treat as **Category (ii).**

  ### Judgment Calls Wearing Procedural Costumes
  1.  **Q2 (Timeframe):** "Within the proposed timeframe" is a proxy for "in practice." A physicist might argue "Given infinite time, micro wins." The tool forces them to accept the project's actual constraints. This is a pragmatic judgment, not a metaphysical one.
  2.  **Q4 (Constraint vs. Override):** Reviewers must distinguish between "the whole shapes the parts" (acceptable constraint) and "the whole breaks the laws of the parts" (unacceptable magic). This requires basic physical intuition, not philosophy.
  3.  **Q2 (In Principle Unavailable):** Distinguishing "hard to measure" from "in principle unavailable" is tricky. If the applicant claims "in principle," they must justify why (e.g., Heisenberg, or social opacity). If they can't, treat as "hard to measure" (Category ii).

  ---

  ## Part 2: The One-Page Printable (Triage Sheet)

  **EMERGENCE TRIAGE CHECKLIST**
  *Complete before scoring scientific merit.*

  **1. VARIABLES:** Are distinct macro-variables named (not just "system behavior")?
  [ ] No → **STOP: Category I (Decoration).**
  [ ] Yes → Go to 2.

  **2. NECESSITY:** If we knew all micro-facts, would the macro-variable still be needed to predict the outcome *in this project*?
  [ ] No (Micro is enough) → **STOP: Category I (Decoration).**
  [ ] Yes → Go to 3.

  **3. ROBUSTNESS:** Does the macro-prediction hold if micro-details change but macro-state stays same?
  [ ] No → **STOP: Category I (Decoration).**
  [ ] Yes → **Category II (Explanatory Autonomy).** *Proceed to full review.*
  [ ] Claim: Macro *constrains* micro dynamics → Go to 4.

  **4. CAUSAL CLAIM:** Does the macro-level *override* micro-laws or *channel* them?
  [ ] Override → **FLAG: Philosophical Review Required.** (Likely incoherent).
  [ ] Channel/Constraint → **Category III (Causal Constraint).** *Proceed to full review.*
  [ ] Claim: "Micro is unknowable, therefore Macro is causal" → **FLAG: Philosophical Review Required.** (Logic error).

  **Reviewer Notes:**
  *   Does the proposal confuse "hard to calculate" with "autonomous"?
  *   Does the proposal confuse "we can't measure the bottom" with "the bottom doesn't matter"?

  ---

  ## Part 3: Memo to the Chair

  **To:** Panel Chair
  **From:** Token Philosopher
  **Re:** Limitations of the Autonomy Screen

  This tool is designed to sort *claims*, not verify *truth*. It will successfully separate proposals that use "emergence" as a synonym for "complicated" (Category i) from those that propose robust coarse-grained models (Category ii). However, you should be aware of three specific misfires:

  1.  **The "Hard Problem" Blindspot:** The tool cannot distinguish between a system that is autonomous because it *is* ontologically distinct, versus one that is autonomous merely because our computers are slow. It treats "computationally intractable" as functionally equivalent to "principally autonomous." For funding purposes, this is acceptable; for metaphysics, it is not.
  2.  **Category II vs. III Blur:** Physicists often describe boundary conditions (Category iii) using the language of autonomy (Category ii). The tool may sort a standard statistical mechanics proposal into Category iii if they emphasize "constraints." This is low-risk; both are fundable.
  3.  **The "Ignorance is Power" Trap:** The tool cannot automatically reject proposals that argue "because we cannot measure the micro, the macro has independent causal power." This is a logical non-sequitur (epistemic limitation $\neq$ ontological freedom). I have added a "Flag" for this, but it requires a human to spot the inference. If a proposal argues that social opacity *creates* institutional causality, the tool will flag it, but you must trust the flag.

  **What this tool cannot settle:** It cannot tell you if the universe is deterministic. It cannot tell you if downward causation is "real." It only tells you if the proposal's internal logic regarding levels is consistent and scientifically tractable.

  ---

  ## Part 4: Gaming the System

  **How a Determined Applicant Fakes Category (ii):**
  A savvy applicant knows the panel wants "autonomy." They will write a proposal that admits the micro-theory exists but claims it is "computationally prohibitive" to use for the specific timescales of interest. They will define macro-variables that are simple aggregates (e.g., average energy) and claim these are "robust."

  **The Trap Question:**
  **Q3 (The Robustness Check).**
  *   *The Fake:* "Yes, our macro-model works across different micro-configurations."
  *   *The Catch:* The reviewer must ask: "Does it work because the micro-details *don't matter* for the outcome, or because you *averaged them out*?"
  *   *Why it catches them:* If the micro-details don't matter, it's standard statistical mechanics (Category i/ii border). If they averaged them out and lost predictive precision on the specific divergent predictions they promised, they fail Q2.
  *   *The Killer Follow-up:* "Identify one specific outcome your macro-model predicts correctly that a micro-model, *given infinite compute*, would predict incorrectly."
      *   If they say "None, it's just faster," they are **Category (i)** (Efficiency, not Autonomy).
      *   If they say "Yes, because the micro-model is sensitive to noise the macro-model filters," they are **Category (ii)**.
      *   Most fakers cannot claim the macro-model is *more* accurate than the micro-model in principle without sounding like they are violating physics. They will retreat to "faster," which downgrades them to Decoration/Efficiency.

  ---

  ## Part 5: Running the Tool on the Three LOIs

  ### LOI 1: Soft Condensed Matter (Granular Media)
  *Claim: Collective modes are emergent; coarse-grained hydro predicts divergences particle model cannot afford to compute.*

  *   **Q1 (Variables):** Yes. "Hydrodynamic-like description" vs. "Particle-level model."
  *   **Q2 (Necessity):** Yes. Micro-model is not feasible within run times.
      *   *Why:* Answer A (Calculation too slow/expensive).
  *   **Q3 (Robustness):** Yes. Lists three specific predictions where descriptions diverge.
      *   *Check:* Do these divergences imply the macro model captures a pattern the micro model misses due to noise/complexity? Yes.
  *   **Result:** **Category (ii) Explanatory Autonomy.**
  *   **Panel Instruction:** Fundable. This is standard complex systems work. The "emergence" is functional (predictive compression), not metaphysical. The divergence claim is empirical and testable.

  ### LOI 2: Computational Neuroscience (Oscillations)
  *Claim: Network oscillations exert downward causation on spiking. Neural level is causally closed. Oscillation variables carry independent causal power.*

  *   **Q1 (Variables):** Yes. "Network-level oscillations" vs. "Individual neuron spiking."
  *   **Q2 (Necessity):** Yes. Claims oscillation variables carry independent power.
  *   **Q3 (Robustness):** N/A (Claim is about Causation). Proceed to Q4.
  *   **Q4 (Constraint Check):**
      *   *Claim:* "Downward causation."
      *   *Conflict:* Proposal states "Neural level is causally closed."
      *   *Analysis:* If the neural level (micro) is causally closed, then the network level (macro, composed of neurons) cannot add *new* causal power without overdetermination.
      *   *Tool Logic:* Does the macro *override* or *channel*?
      *   *Applicant Wording:* "Exert downward causation." This sounds like *override*.
      *   *Constraint Check:* If they mean "The network state acts as a boundary condition constraining individual neuron firing probabilities," that is **Category (iii)**. If they mean "The oscillation causes the spike *in addition* to the ion channels," that is **Flag for Philosophical Review**.
  *   **Result:** **Flag for Philosophical Review.**
  *   **Panel Instruction:** The proposal contains a contradiction. You cannot claim causal closure at the micro-level and independent causal power at the macro-level without specifying the *mechanism of constraint* (e.g., feedback loops, field effects).
  *   **Requirement for Funding:** They must reframe "downward causation" as "contextual constraint." They must show how the oscillation variable modifies the parameters of the spiking model *without* violating conservation laws. If they cannot specify the mechanism (e.g., ephaptic coupling, resource depletion), they are proposing magic. Send to philosopher for 5-minute chat to force reframe to Category (ii) (Oscillations as predictive variables) or Category (iii) (Oscillations as boundary conditions).

  ### LOI 3: Institutional Analysis (Former Student)
  *Claim: Micro-level description of individual behavior is in principle unavailable. No bridge principles possible. Nothing derivable. This non-derivability establishes autonomy and causal efficacy of institutional level.*

  *   **Q1 (Variables):** Yes. "Institutional level" vs. "Individual behaviour."
  *   **Q2 (Necessity):** Yes. Claims micro is "in principle unavailable."
      *   *Why:* Answer B (Micro-details unavailable in principle).
  *   **Q4 (Constraint Check - The Epistemic Leap):**
      *   *Claim:* "This very non-derivability... establishes... causal efficacy."
      *   *Tool Logic:* Does the unavailability of the micro *cause* the macro efficacy?
      *   *Decision:* **Flag for Philosophical Review.**
  *   **Result:** **Logic Error (Epistemic to Ontological).**
  *   **Panel Instruction:** This is the answer I told you I wouldn't like. The tool catches the fallacy explicitly.
  *   **Reasoning:** The fact that we *cannot measure* the micro (epistemic) does not prove that the micro *does not determine* the macro (ontological). It only proves we are ignorant. Ignorance is not a causal force.
  *   **Correction:** To be fundable (Category ii), they must argue that the Institutional variables are *robust* despite the micro-variation (Multiple Realizability), not that the micro-variation is inaccessible. They must show that *even if* we knew the micro, the Institutional variable would still be the better predictor for the specific social outcomes they study.
  *   **Action:** I must recommend rejection or major revision. The inference "Unmeasurable $\rightarrow$ Causally Autonomous" is invalid. The tool forces me to flag this even though I know the PI. It protects me from the charge of favoritism and protects the foundation from funding a category error. The student needs to pivot from "We can't see the bottom" to "The top pattern holds regardless of the bottom."

  ### Summary of Tension Resolution
  The tool resolves the tension you described by ignoring *derivability in principle* (which kills everything) and *causal closure* (which kills downward causation). Instead, it focuses on **Predictive Utility** and **Constraint Mechanisms**.
  *   LOI 1 passes because it admits micro-truth but claims macro-utility (Category ii).
  *   LOI 2 stalls because it claims macro-power while denying micro-openness (Contradiction).
  *   LOI 3 fails because it claims macro-power based on micro-ignorance (Fallacy).

  This allows you to tell the panel: "We aren't deciding if reductionism is true. We are deciding if the proposal's model is useful and internally consistent." That is a criterion physicists, biologists, and sociologists can all accept.
