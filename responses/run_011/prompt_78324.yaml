          1.  Ordinary reductionist work with emergence decoration.
          2.  Real claim about explanatory autonomy (non-derivability in practice/principle, multiple realization, predictive coarse-graining).
          3.  Strong claim about higher-level causal powers (downward causation).
      *   **Constraints:**
          *   No jargon.
          *   No charitable reconstruction (reviewers won't do it).
          *   15 minutes per LOI.
          *   Must address the tension between "derivability is always hard" (lets everything through) and "causal closure excludes higher levels" (kills everything).
          *   Must identify the "third thing" that resolves this tension.
          *   Must flag judgment calls wearing procedural costumes.
          *   Must distinguish which philosophical distinctions survive flattening and which don't.
          *   **Deliverables:**
              1.  The Procedure Proper (detailed).
              2.  One-page printable version.
              3.  Memo to the Chair (limitations/misfires).
              4.  "Gaming the System" analysis (how to fake cat ii, and the trap question).
              5.  **Application:** Run the tool on three specific LOIs (Granular Media, Neuroscience, Institutional Analysis).
      *   **Tone:** Professional, candid, pragmatic, philosophically rigorous but accessible. No bibliographies.

  2.  **Deconstruct the Philosophical Problem:**

      *   *The Tension:* If we ask "Is it derivable?", physics says "Yes, in principle" (killing autonomy) or "No, in practice" (letting trivial stuff through). If we ask "Does it have causal power?", physical causal closure (Kim's exclusion argument) says "No" (killing downward causation).
      *   *The "Third Thing":* The solution lies in *counterfactual robustness* and *interventionist independence*. It's not about whether the micro *could* determine the macro (metaphysics), but whether the macro variables track patterns that remain stable under interventions that scramble the micro details. It's about *informational compression without loss of predictive power regarding specific outcomes*.
      *   *Operationalization:* We need to ask about *variables* and *interventions*, not "essence" or "power."
      *   *Category Definitions for the Tool:*
          *   (i) Decoration: Macro terms are just labels for micro aggregates; no independent predictive utility.
          *   (ii) Explanatory Autonomy: Macro variables predict better/cheaper than micro; robust to micro-variation (Multiple Realizability in practice).
          *   (iii) Downward Causation: Macro state constrains micro evolution in a way not fixed solely by micro-initial conditions + micro-laws (this is the tricky one, needs careful handling to avoid metaphysical deadlock).

  3.  **Drafting the Procedure (The "Third Thing"):**

      *   The core distinction is *Predictive Insulation*. Does the higher-level description allow you to ignore lower-level details *without losing accuracy* on the specific questions asked?
      *   For (iii), we need to avoid the "magic" of downward causation. We frame it as *Constraint*. Does the macro-state restrict the available micro-trajectories in a way that isn't just the sum of micro-interactions? (e.g., boundary conditions set by the whole).
      *   *Judgment Calls:* Distinguishing "computationally hard" from "principally autonomous." Distinguishing "feedback loop" from "downward causation."

  4.  **Developing the Three LOI Scenarios:**

      *   *LOI 1 (Granular Media):* Claims coarse-grained hydro works where particle model is too slow. Divergent predictions.
          *   *Analysis:* This looks like Cat (ii). It's about computational tractability and predictive divergence.
          *   *Tool Application:* Passes the "Predictive Insulation" test.
      *   *LOI 2 (Neuroscience):* Claims network oscillations cause spiking, but also claims neural level is causally closed.
          *   *Analysis:* This is the Kim trap. If neural level is closed, oscillations (if neural) are just neural. If oscillations are "network level" distinct from "neural level," they need to show the network variable does work the spike variable doesn't.
          *   *Tool Application:* Fails the "Causal Closure" consistency check. Needs reframe to Cat (ii) (oscillations as predictive variables) rather than Cat (iii) (ontological downward causation).
      *   *LOI 3 (Institutional Analysis):* Claims micro-description is *in principle* unavailable, therefore macro is autonomous/causal.
          *   *Analysis:* This is the "Epistemic to Ontological" leap error. Just because I *can't* measure the micro doesn't mean the macro *causes* things independently. It might just mean I'm ignorant.
          *   *Tool Application:* Fails the "Independence of Mechanism" check. It conflates ignorance with autonomy.

  5.  **Refining the Tool for the Panel:**

      *   Needs to be a flowchart or numbered list.
      *   Needs clear "Stop" points.
      *   Needs to explicitly handle the "Causal Closure" objection without invoking Kim by name.
      *   *The Trap Question:* "If you knew every micro-variable, would your macro-variable still be necessary to predict the outcome?"

  6.  **Addressing the "Gaming the System":**

      *   How to fake Cat (ii)? Claim computational intractability.
      *   The Trap: Ask for the specific *divergence* point. If the micro model *could* predict it given infinite time, it's Cat (i) or weak (ii). If the macro model predicts something the micro model *structurally cannot* (due to averaging out), that's real (ii).
      *   Actually, the better trap is about *intervention*. "If I change the micro-details but keep the macro-state constant, does the outcome change?"

  7.  **Drafting the Memo to the Chair:**

      *   Be honest. This tool sorts *claims*, not *truth*.
      *   It can't settle metaphysics.
      *   It flags inconsistencies.
      *   Main limitation: Distinguishing (i) from (ii) is often a matter of degree (tractability).

  8.  **Review against Constraints:**

      *   No bibliography? Check.
      *   No jargon? (Avoid "supervenience," "nomological," "ontic"). Check.
      *   15-minute limit? The tool must be fast.
      *   Address the tension? Yes, via the "Predictive Insulation/Intervention" focus.
      *   Run on 3 LOIs? Yes.

  9.  **Self-Correction/Refinement during drafting:**

      *   *Critique:* Is "Downward Causation" (Cat iii) even fundable if the panel are physicists?
      *   *Fix:* Frame Cat (iii) as "Constraint-Based Dynamics" rather than spooky action. It's about boundary conditions.
      *   *Critique:* The Institutional LOI is tricky. The user expects an answer they "won't like."
      *   *Fix:* The tool should flag it as *Category (i) disguised as (ii/iii)*. The inference from "unavailable micro" to "macro causal power" is invalid. The tool must catch this non-sequitur.
      *   *Tone Check:* Ensure I don't sound like I'm lecturing the panel. I'm giving them a screwdriver, not a sermon.

  10. **Final Polish:** Check the "One Page" summary. Ensure the "Gaming" section is sharp. Ensure the "Memo" manages expectations. (Proceed to generate output).

  *(Self-Correction on the "Third Thing"):* I need to be precise. The third thing isn't just "prediction." It's *Stability under Micro-Variation*. If the macro-relationship holds even when the micro-realization changes, it has autonomy. If the macro-variable constrains the micro-pathway (like a channel), it has downward influence without violating closure. I will embed this in the questions.

  *(Self-Correction on LOI 3):* The user says "I expect an answer I won't like." This implies the tool might validate the student's work, or more likely, the tool will expose the flaw so clearly the philosopher has to reject their own student's logic publicly. I need to make sure the tool is rigorous enough to catch the "Epistemic -> Ontological" fallacy.

  *(Final Plan):*
