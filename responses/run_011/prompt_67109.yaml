answer: |-
  Here is a precise formulation of the principle governing your judgments, followed by the necessary corrections to your verdicts, discriminating cases, and an analysis of the single-expert problem.

  ### The Principle: Calibrated Process Reliability (CPR)

  **Core Thesis:** Legitimate deference is determined not by the *number* of agents, but by the estimated **Truth-Tracking Reliability ($R$)** of the process that generated their consensus, constrained by your **Institutional Mandate ($M$)**.

  You should defer when $R_{others} > R_{self} + \text{Cost}(\text{Inquiry})$, provided $M$ does not require independent signal generation.

  **Variables and Combination:**

  1.  **Competence ($C$):** The prior probability the agent is capable of assessing the evidence correctly. (Motivated by **Case 4** vs. **Case 1**).
  2.  **Incentive Alignment ($I$):** The degree to which the agent is rewarded for accuracy rather than conformity, sales, or social cohesion. Scales from 0 (misaligned) to 1 (perfectly aligned). (Motivated by **Case 2**, **Case 11**, **Case 12**).
  3.  **Effective Sample Size ($N_{eff}$):** A measure of independence. $N_{eff} = 1 + (n-1)\delta$, where $n$ is the headcount and $\delta$ is the degree of independent error-checking performed. If agents merely transmit a conclusion without engaging evidence, $\delta \approx 0$. If they engage evidence but are influenced, $0 < \delta < 1$. (Motivated by **Case 5** vs. **Case 6**, **Case 1** vs. **Case 3**).
  4.  **Institutional Mandate ($M$):** A binary or scalar constraint. If your role is defined as an *independent filter* (juror, committee member), $M$ imposes a high cost on deferral without deliberation. If your role is *consumer* or *participant*, $M$ is low. (Motivated by **Case 7** vs. **Case 8**, **Case 10**).
  5.  **Articulability ($A$):** The ability to state your dissent. Low $A$ (inarticulate unease) reduces $R_{self}$ unless $M$ protects "conscience." (Motivated by **Case 7**).

  **The Calculation:**
  $$ \text{Deference Warranted} \iff (C_{others} \times I_{others} \times N_{eff}) > (C_{self} \times I_{self}) \quad \text{AND} \quad M_{\text{independent}} = \text{False} $$

  ---

  ### Mapping the Clauses to Your Cases

  *   **Case 1 (Queue):** High $N_{eff}$ (behavioral aggregation implies hidden info), Moderate $C$ (strangers), High $I$ (paying customers). **Verdict: Defer.**
  *   **Case 2 (Free Samples):** $I \approx 0$ (incentive corrupted). Action permissible (pragmatic), Belief update forbidden. **Verdict: No Belief Shift.**
  *   **Case 3 (1 Stranger):** Low $N_{eff}$ (1 person). $C_{stranger}$ unknown. $C_{self}$ (reading sign) is direct evidence. **Verdict: Hold.**
  *   **Case 4 (3 Independent Colleagues):** High $C$, High $I$ (professional reputation), High $N_{eff}$ (independent). **Verdict: Required Defer.**
  *   **Case 5 (3 Sequential Colleagues):** High $C$, High $I$, **Low $N_{eff}$**. They looked at the slide ($\delta > 0$), but correlation is high. **Verdict: (See Overturn below).**
  *   **Case 6 (3 Hearsay Colleagues):** High $C$, High $I$, **Zero $N_{eff}$** ($\delta = 0$, no evidence engagement). **Verdict: Hold.**
  *   **Case 7 (Jurors):** High $M_{\text{independent}}$. Even if $R_{others}$ is high, the mandate requires you to voice $R_{self}$. **Verdict: Impermissible to Defer silently.**
  *   **Case 8 (Queue Askable):** Low $M$. Low Cost of Inquiry. You didn't ask, but $N_{eff}$ of queue is high enough to override. **Verdict: Permissible.**
  *   **Case 9 (Search Committee):** High $C$, Moderate $I$, High $N_{eff}$. **Verdict: Permissible.**
  *   **Case 10 (Corridor Chat):** High $C$, **Low $I$** (social conformity), **Low $N_{eff}$**. **Verdict: (See Overturn below).**
  *   **Case 11 (Stock Market):** High $C$ (aggregate), High $I$, but $I_{self} = 0$ (no info). Market prices reflect info, but "heavy volume" suggests momentum trading ($I$ misalignment). **Verdict: Stay Out.**
  *   **Case 12 (Prediction Market):** Very High $I$ (money at stake), High $N_{eff}$ (anonymous aggregation). **Verdict: Strong Defer.**

  ---

  ### Necessary Overturns

  To make the CPR principle coherent, you must surrender three verdicts. These are not diplomatic suggestions; the logic of your own better judgments demands these corrections.

  **1. Case 5 (Sequential Colleagues) must be overturned.**
  *   **Your Verdict:** Permissible/Required to defer.
  *   **CPR Verdict:** **Impermissible to defer without arbitration.**
  *   **Reasoning:** You correctly identified that this arrangement carries "barely more information than the first report alone." If you are equally competent to your colleagues, your independent read ($\delta=1$ for you) is statistically *more* valuable than the 2nd and 3rd colleagues' correlated reads ($\delta \approx 0.2$). To defer is to discard the only truly independent signal in the room (yours). You are permitted to *uncertainly* align, but you are not permitted to treat their consensus as overriding your independent data point without a re-read or discussion.

  **2. Case 10 (Corridor Chat Committee) must be overturned.**
  *   **Your Verdict:** Permissible to defer.
  *   **CPR Verdict:** **Impermissible to defer.**
  *   **Reasoning:** You admit that had you been first, you were obliged to speak. This acknowledges that the *value* of your committee seat is your independent signal. If you know the process was corrupted (corridor chat), $N_{eff}$ collapses. To vote with them is to participate in a sham process. Your feeling of obligation if *first* proves you know the mandate ($M$) requires independence; yielding when *last* is merely cowardice, not epistemic humility.

  **3. Case 1 (The Queue) requires a caveat.**
  *   **Your Verdict:** Belief should shift toward "good."
  *   **CPR Verdict:** **Action permissible; Belief shift conditional on "No Obvious Common Cause."**
  *   **Reasoning:** You distinguish Case 1 from Case 2 (free samples). But Case 1 is vulnerable to hidden common causes (e.g., a bus just dropped off a tour group, or it's the only stall open). Your belief should only shift if you have reason to think the queue formed via independent assessments. If the queue is a "cascade" (people joining because others joined), $N_{eff} \approx 1$. You are right to join (pragmatic), but epistemically, you should remain agnostic about quality until you see people *eating*.

  ---

  ### Three Discriminating Cases

  These cases are designed to break the link between Headcount, Independence, and Mandate.

  **Case A: The Algorithmic Consensus**
  *   **Scenario:** You are a radiologist. Five AI diagnostic tools, all trained on different datasets but owned by the same parent company, flag a scan as malignant. You see benign. You learn the algorithms are distinct but share a common bias in their training data regarding dense tissue.
  *   **Variables:** High $C$ (AI accuracy), Low $I$ (no skin in game), Low $N_{eff}$ (common bias).
  *   **CPR Verdict:** **Do Not Defer.** The common bias acts like the "corridor chat" in Case 10. The headcount (5) is an illusion.
  *   **Contrast:** Distinguishes from Case 4 (Independent Humans). Tests whether you treat Algorithmic Correlation like Human Correlation.

  **Case B: The Reluctant Juror**
  *   **Scenario:** You are a juror (Case 7). 11 vote to convict. You have an inarticulate unease. The judge announces that if the jury hangs, the defendant goes free forever (high stakes for society), but if convicted, the sentence is minor (low stakes for defendant). The other jurors beg you to align to "get this over with."
  *   **Variables:** High $M_{\text{independent}}$, High Social Cost, Low Stakes for Defendant.
  *   **CPR Verdict:** **Hold Out.** The Mandate ($M$) is absolute regardless of stakes or social pressure. The "unease" is a signal that $R_{self}$ detects something $R_{others}$ missed, even if inarticulate.
  *   **Contrast:** Distinguishes from Case 8 (Queue). Tests whether $M$ overrides pragmatic resolution.

  **Case C: The Paid Consultant**
  *   **Scenario:** You hire a single expert to evaluate a house. She says "Buy." You see a crack in the foundation. She says, "I've bought 50 houses with this crack, they're fine." She has a financial incentive to close the deal (commission), but a reputational incentive to be right.
  *   **Variables:** High $C$ (Expert), Mixed $I$ (Commission vs. Reputation), $N_{eff} = 1$.
  *   **CPR Verdict:** **Discount and Verify.** The mixed incentive ($I < 1$) reduces her reliability below a neutral party. Unlike Case 12 (Prediction Market), her incentives are not purely truth-aligned.
  *   **Contrast:** Distinguishes from Case 12 (Prediction Market) and Case 4 (Colleagues). Tests the weight of $I$ against $C$.

  ---

  ### The Single Reliable Expert vs. The Crowd

  You ask whether deferring to a single person whose judgment you have found reliable over many years (in a field with no other views) is the same phenomenon as deferring to a crowd.

  **The Principle's Answer:** It is a **different phenomenon**, governed by a different variable.

  1.  **Crowd Deference (Cases 1, 4, 9, 12):** Relies on **Aggregation ($N_{eff}$)**. The wisdom comes from the cancellation of independent errors. The mechanism is statistical. You defer because $N \times \text{Error}_{cancel} > \text{Your Error}$.
  2.  **Expert Deference (The Single Reliable Person):** Relies on **Competence ($C$)**. The wisdom comes from superior signal processing, not error cancellation. The mechanism is hierarchical. You defer because $C_{expert} \gg C_{self}$.

  **Why the distinction matters:**
  *   **Vulnerability:** Crowd consensus is vulnerable to *correlated errors* (Case 5, 10). Expert judgment is vulnerable to *systemic bias* or *blind spots* unique to that individual.
  *   **Update Rule:** If a crowd changes its mind, you should update heavily (new data aggregated). If a single expert changes their mind, you must ask *why* (did they learn something, or are they unstable?).
  *   **The "Field with No Other Views" Clause:** This is crucial. If no one else has expressed a view, you cannot calculate $N_{eff}$. You are relying entirely on your track record of their $C$. This is **Authority**, not **Consensus**.

  **Verdict on the Single Expert:**
  Under CPR, deferring to the single reliable expert is **Permissible and Rational**, provided your estimate of their $C$ remains high. However, it is **Fragile**. Because $N_{eff} = 1$, a single piece of contrary evidence (your own crack in the foundation) should weigh much heavier against an Expert than against a Crowd. With a crowd, you assume you are the outlier. With a single expert, it is a duel of competencies.

  **Summary:** You are trying to apply the logic of the Crowd (Case 12) to the Expert, and the logic of the Expert (Case 4) to the Crowd. The CPR principle separates them: **Crowds demand Independence ($N_{eff}$); Experts demand Track Record ($C$).** When you conflate them, you get the contradictions in Cases 5 and 10.
