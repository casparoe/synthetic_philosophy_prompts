answer: |-
  ## The 15-Minute Triage Procedure: Presentism vs. Apologetics

  **Purpose:** To distinguish between *historical explanation* (why things happened), *moral judgment* (why things were wrong), and *categorical error* (using tools that break the explanation).
  **Historiographical Grounding:** Contextualism (Skinner/Pocock) for concepts; Subaltern Studies (Spivak/Scott) for agency; Epistemic Humility for blame.

  ### Step 1: The Agency Audit (Grammar & Syntax)
  **Question:** Who is the grammatical subject of the verbs describing harm or coercion? Is the victim the object of a passive verb, or an agent of an active one?
  *   **Sufficient Answer:** The perpetrator is the subject of violent/coercive verbs. The victim is the subject of survival/resistance verbs.
  *   **Insufficient Answer:** "Enslaved people were moved." "Mistakes were made." "The system required..."
  *   **Edit:** If passive voice obscures the perpetrator, active it. If the victim is only grammatical object, check if sources allow for an active verb (e.g., "endured," "resisted," "navigated").
  *   **Boundary:** If the source material literally renders the victims as property (e.g., a ship's manifest), you cannot invent agency in the *text of the source*, but you can frame the *author's narration* to acknowledge their humanity. If the author claims victims had "no choice," query: "Is this absolute, or is there evidence of micro-resistance?"

  ### Step 2: The Epistemic Horizon (Blame vs. Knowledge)
  **Question:** Does the text condemn the actor for a *consequence* they could not foresee, or for a *harm* they were inflicting knowingly?
  *   **Sufficient Answer:** Condemnation is limited to harms recognizable within the period's moral or legal framework (e.g., cruelty, breach of contract, sin) or universal physical suffering (pain, death).
  *   **Insufficient Answer:** Condemnation based on long-term structural outcomes unknown to the actor (e.g., "He contributed to the wealth gap," "He reinforced systemic racism").
  *   **Edit:** Shift focus from *outcome* to *intent/action*. Change "He destroyed the community's future" to "He dispersed the community through sale."
  *   **Boundary:** If the author argues the actor *should* have known (e.g., dissent existed), move to Step 4. Do not decide the morality; decide the evidentiary support.

  ### Step 3: The Conceptual Load (Anachronism vs. Description)
  **Question:** Is the author using a noun/adjective that did not exist as a category for the actors (e.g., "racist," "genocide," "sexual harassment," "trauma")?
  *   **Sufficient Answer:** The term is used as a shorthand for a described behavior, not as an explanation of the actor's mindset.
  *   **Insufficient Answer:** The term is used to explain *why* the actor acted (e.g., "He did this because he was a racist").
  *   **Edit:** Query the author. Ask: "Can you describe the ideology without the modern label? Does this label obscure specific period distinctions (e.g., religious vs. biological hierarchy)?"
  *   **Boundary:** This is the "Values" line. If the author insists the term is analytically necessary (e.g., "I am using 'genocide' as a sociological category, not a legal one"), this goes to Acquisitions. It is a theoretical stance, not a copyedit.

  ### Step 4: The Consensus Check ("Standard of the Time")
  **Question:** Does the text claim the behavior was "accepted," "normal," or "unchallenged"? If so, is there evidence of contemporary dissent cited in the footnotes?
  *   **Sufficient Answer:** The text qualifies the consensus ("Many accepted," "Within this circle, it was standard") OR cites specific dissenters (petitions, sermons, court cases).
  *   **Insufficient Answer:** Universal claims ("No one objected," "It was simply the way of the world") without citation of the *absence* of dissent.
  *   **Edit:** Query: "Please qualify this claim. Were there no abolitionist voices in 1780? No religious objections? If none in this region, specify region."
  *   **Boundary:** If the author claims dissent existed but provides no citation, this is a factual error, not a value judgment. Demand the citation.

  ***

  ## Test Cases

  ### Paragraph 1: The Passive Laundering
  > "By the 1790s, the plantation system had become entrenched in the Caribbean. Large numbers of enslaved people were transported to the sugar islands to meet labor demands. While conditions were harsh, the economic necessity of the crop ensured that the trade continued. Unrest was occasionally suppressed by local militias."

  **Application:**
  1.  **Agency:** "Enslaved people were transported." (Passive). "Unrest was suppressed." (Passive). Perpetrators (merchants, militia, owners) are invisible.
  2.  **Epistemic:** "Economic necessity" implies an impersonal force rather than human choice.
  3.  **Concept:** No anachronistic terms.
  4.  **Consensus:** "Ensured that the trade continued" implies inevitability/consensus.

  **Verdict:** **Edit.**
  *   **Reasoning:** Fails Step 1 (Agency) and Step 4 (Consensus/Necessity). It launderes atrocity by making "the system" the actor.
  *   **Action:** Rewrite to identify agents. "Merchants transported..." "Militias suppressed..." Challenge "economic necessity" to "planters prioritized profit."
  *   **Time:** 8 minutes.

  ### Paragraph 2: The Moralizing Anachronism
  > "Colonel Fitzwilliam was a monster whose racist ideology blinded him to the humanity of the Igbo. His actions constitute a clear violation of human rights and a form of ethnic cleansing. He cannot be excused by the standards of his time, as morality is universal."

  **Verdict:** **Query Author (Step 3 & 2).**
  *   **Reasoning:**
      *   *Step 3 (Concept):* "Racist ideology" and "ethnic cleansing" are 19th/20th-century categories. Did Fitzwilliam believe in biological hierarchy or religious/cultural superiority? Conflating them reduces historical precision. "Human rights" (1948) is legally anachronistic; "natural rights" or "liberty" might be period-accurate.
      *   *Step 2 (Blame):* "Morality is universal" is a philosophical claim, not a historical one. It shuts down explanation.
      *   *Step 4 (Consensus):* The author claims he "cannot be excused by the standards of his time." This requires proof that contemporaries *agreed* it was immoral.
  *   **Action:** Query: "Please specify the content of his hierarchy (religious/biological). 'Human rights' may confuse the legal framework available to contemporaries; consider 'natural liberty.' Regarding 'standards of his time,' please cite the contemporary critics you reference to substantiate that this view was actionable then."
  *   **Time:** 12 minutes.

  ### Paragraph 3: The Uncomfortable Verdict
  > "The mission records show that the indigenous converts largely acquiesced to the new liturgy. There is no evidence of organized resistance in the parish logs. While modern readers may find this submission troubling, it appears the priests successfully integrated the community through spiritual persuasion rather than force."

  **Verdict:** **Do Not Edit (But Query Acquisitions).**
  *   **Reasoning:**
      *   *Step 1 (Agency):* "Acquiesced" is active. "Submission" implies a choice, however constrained.
      *   *Step 2 (Blame):* No blame assigned to the converts for submitting.
      *   *Step 3 (Concept):* No anachronistic terms.
      *   *Step 4 (Consensus):* The author claims "no evidence of organized resistance." This is a claim about the *archive*, not the *world*.
  *   **The Problem:** This paragraph will trigger *both* types of reader complaints. Reader A will say "You're blaming the victims for submitting." Reader B will say "You're whitewashing the coercion involved in 'spiritual persuasion'."
  *   **Why I Won't Like It:** The procedure tells me the text is historically defensible *if* the footnotes support the claim about the parish logs. It distinguishes between "erasing agency" (saying they were objects) and "recording submission" (saying they chose survival). However, the phrase "spiritual persuasion rather than force" is a minefield. The procedure says this is a factual claim requiring evidence, not a values edit.
  *   **Action:** I have to let the text stand *if* the citation exists, but I must query: "Does 'rather than force' account for the structural coercion of colonialism? Please ensure the distinction between physical violence and structural coercion is clear."
  *   **Why I dislike this:** It forces me to defend a text that feels like it minimizes colonial violence, simply because the author has technically avoided anachronism. It satisfies the historians but risks the moral clarity the press stands for.

  ***

  ## Failure Modes & Internal Contradictions

  ### Where the Procedure Misfires
  1.  **The "Silent Archive" Problem:** Step 4 (Consensus Check) relies on evidence of dissent. In many cases (enslaved populations, colonized subjects), dissent was not recorded in the archives the author is using. The procedure might force the author to add a caveat ("No records survive") which reads like apologetics, or accuse them of a false consensus claim when the silence is actually evidence of suppression. The procedure cannot distinguish between *no dissent* and *no record of dissent* in 15 minutes.
  2.  **The "Descriptive Genocide" Trap:** Step 3 (Conceptual Load) flags terms like "genocide" or "rape" as anachronistic. However, in public history and ethics, these terms carry necessary weight. By forcing the author to use "population destruction" or "sexual violence," the procedure may sanitize the text to satisfy historiographical precision, inadvertently aiding the "laundering" complaint.

  ### Two Criteria That Pull Against Each Other
  **Step 1 (Agency) vs. Step 2 (Epistemic Horizon).**
  *   **The Conflict:** To restore agency to victims (Step 1), you often need to describe their resistance. To describe resistance accurately, you often need to attribute modern political consciousness to them (e.g., "fighting for freedom"). But Step 2 warns against attributing modern concepts ("freedom" in the 2025 sense) to actors who may have been fighting for something else (e.g., "restoration of a specific king" or "religious deliverance").
  *   **The Tension:** If you strictly enforce Step 2, you risk rendering the victims' motives alien and cold (Step 1 failure). If you strictly enforce Step 1, you risk imbuing them with a modern political rationality they didn't possess (Step 2 failure). The procedure forces you to choose between *humanizing* the victim and *historicizing* the victim, and it offers no tie-breaker for which value wins in a 15-minute window.
