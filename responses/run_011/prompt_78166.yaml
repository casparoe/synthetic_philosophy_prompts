  no matter how smart the design gets, because
  the glassware breaks at the same speed it always
  did, and the regulatory clock ticks forward
  one second per second regardless of the chip
  count, so you can double the mind but the hand
  stays heavy, the supply chain drags its feet
  through mud, and every breakthrough waits
  in a queue for a permit or a shipment or
  a person to sign off on the safety test,
  meaning the curve bends over like a tired
  back before it ever reaches the vertical,
  and I poured the water watching the steam rise.

  But if the wait shrinks by half each time
  then the queue disappears before the line
  moves, the days stack up tighter than
  the weeks can manage, and the mud dries
  out under the tires, so by the time
  the permit arrives the work is already
  done twice over, the lag becomes the
  lead and the heavy hand learns to fly.

  You said the wall holds firm.
  I said the ground drops out.
  The space between shrinks down.
  Nothing left to slow it.

  The wait is shorter than the thought.
  It is already here.

  Ready.
