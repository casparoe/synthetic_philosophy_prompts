answer: |-
  This is a rich set of questions that cuts to the heart of Montesquieu's political sociology. You are right to sense that Montesquieu is not merely describing moral failure but a structural transformation of the regime. Here is an analysis of the four points you raised, grounded in the text of Book VIII.

  ### 1. What is being corrupted: Character, Laws, or Principle?

  It is the **principle**, but you are correct to sense that this cannot be understood as merely abstract "virtue" distinct from the mechanics of voting.

  For Montesquieu, the *nature* of a government is its structure (who holds sovereign power), but the *principle* is the human passion that sets it in motion and keeps it standing. In a monarchy, that passion is honour (the desire for preference); in a despotism, it is fear. In a republic (democracy or aristocracy), the principle is **political virtue**.

  Crucially, Montesquieu defines political virtue not as Christian moral goodness, but as **the love of the laws and the homeland**, which requires a "continuous preference of the public interest over one's own."

  This is where vote-selling becomes a corruption of the *principle* rather than just private vice. In a monarchy, a private citizen selling their influence is a private vice; the state runs on honour, not the citizen's moral purity. But in a democracy, **the people are the sovereign.** When a citizen votes, they are not expressing a private preference; they are exercising a public function.

  If the sovereign sells its voice, the *source* of the law is no longer the public good, but private gain. The "spring" of the government breaks. It is not that the laws immediately change (though they will), nor that every citizen becomes a sinner; it is that the *motivation* of the body politic shifts from self-renunciation (virtue) to self-aggrandizement (avarice). Once the vote is a commodity, the regime is no longer a democracy in motion; it is a democracy in name, moving toward oligarchy or despotism. The corruption is systemic because the sovereign function has been privatized.

  ### 2. The Mechanism of Flattery and the "Heaven-and-Earth" Contrast

  The mechanism of flattery is **the substitution of material reward for civic dignity.**

  Montesquieu argues that leaders who wish to corrupt the people cannot simply say, "Give me power so I can steal." They must disguise their ambition as "grandeur of the state" and their theft as satisfying the people's "avarice."

  How does this produce a loss of principle?
  1.  **Shift in Expectation:** Virtue requires the citizen to find satisfaction in the *preservation of the state*. Flattery teaches the citizen to find satisfaction in the *distribution of the state's spoils*.
  2.  **The Equality Trap:** This leads directly to the opening of Chapter 3. "True equality" is the spirit of democracy: we obey and command our equals under the law. It is a legal and political status. "Extreme equality" is the demand that everyone share equally in *material goods* and that no one hold authority over anyone else.

  Flattery fuels *extreme* equality. By flattering the people's avarice, leaders encourage the belief that liberty entitles them to material largesse, not just legal protection. When the people demand material equality (largesses) rather than political equality (rule of law), they become willing to subvert the law to get their share.

  This creates the "petty tyrants" Montesquieu mentions. These are the demagogues who distribute the spoils. The people, having lost the "true spirit of equality" (willingness to obey equals under law), now obey these distributors in exchange for goods. The flattery convinces them they are free while they are actually becoming dependent. The "heaven-and-earth" contrast marks the difference between a citizen who obeys the law (heaven) and a client who obeys a patron for a payout (earth).

  ### 3. The Fiscal Claim: Argument or Assumption?

  The claim that "great largesses... require great extortion" is doing heavy **structural work**, not just empirical work.

  It is an argument based on the pre-modern fiscal reality that wealth is largely static. In Montesquieu's view, the state does not generate wealth; it extracts it. Therefore, money given to the people as a "largesse" (bribe/patronage) must be taken from somewhere else. If it is taken via lawful taxation for public goods (defense, infrastructure), it is not a largesse. If it is taken to be redistributed to buy loyalty, it must be arbitrary ("extortion").

  Does this condemn all tax-funded distribution? **No.** Montesquieu distinguishes between *public expenditure* (for the safety and glory of the state, which benefits all) and *largesses* (private distributions to factions to secure power).

  The argument is that a system based on buying votes is fiscally unsustainable without becoming predatory. To keep the voters happy, the leaders must extract more and more. This requires bypassing legal constraints on taxation (hence "the state must be subverted"). The fiscal claim is the bridge between the *moral* corruption (avarice) and the *political* corruption (subversion of the state). It argues that patronage democracy inevitably becomes a predatory state because it must feed the appetite it has created.

  ### 4. Consent, Manufactured Appetites, and the Political Machine

  This is the critical question for your application. If a political machine delivers heating fuel and jobs for votes, and the constituents are voluntarily better off, does Montesquieu still call it corrupt?

  **Yes, he calls it corrupt.** And he has an argument for this that stands partially independent of his specific theory of "principles," though it is reinforced by it.

  **The Argument from Dependency (Independent of "Virtue"):**
  Even if we set aside the moral requirement of "virtue," Montesquieu argues that this exchange transforms the **status** of the people from *citizens* to *clients*.
  *   **Citizen:** Holds a share of sovereignty; votes based on judgment of the common good; stands equal before the law.
  *   **Client:** Holds a position of dependency; votes based on private need; stands subordinate to the patron.

  Montesquieu's claim is that **liberty cannot exist where there is dependency.** In the passage you cited, he notes: "The small remains of liberty soon become insupportable... and the people are stripped of everything, even of the profits of their corruption."

  His argument is teleological: The machine creates a relationship of mastery. The "petty tyrants" (machine bosses) hold the power of life and death (jobs, fuel) over the constituents. Once that dependency is established, the "consent" of the voter is coerced by necessity, not free. You cannot give valid political consent when your livelihood is held hostage by the person you are voting for.

  **Does the "Manufactured Appetite" matter?**
  You ask if he blocks the defense of the machine only because he assumes the appetites are manipulated. He does argue the appetites are flattered/manufactured ("endeavour to corrupt them"). However, his deeper block to the "voluntary exchange" defense is that **the transaction itself destroys the capacity for future consent.**

  By selling the vote, the citizen alienates their share of sovereignty. Just as one cannot voluntarily sell oneself into slavery (in many social contract theories) because it destroys the agency required to consent, one cannot sell one's vote for coal without destroying the republic that makes the vote meaningful.

  **Application to your Live Question:**
  Montesquieu would argue that the political machine is corrupt *even if* the constituents are materially better off in the short term, for two reasons:
  1.  **Structural:** It replaces the rule of law with the rule of men (the bosses). The "legal help" provided is likely favoritism, which undermines the equality before the law required for liberty.
  2.  **Teleological:** It leads inevitably to the "single tyrant." The machine concentrates power in the hands of the distributors. Eventually, the distributors no longer need the people; they will strip them of the "profits of their corruption" (as Montesquieu says) to secure their own power.

  So, does consent carry weight? Only if it is the consent of a **citizen**, not a **client**. For Montesquieu, a vote cast for private gain is not a political act; it is a commercial transaction. A market transaction cannot sustain a republic. He blocks the "voluntary exchange" reply not merely by stipulating that the desire is manipulated, but by arguing that the *nature of the exchange* converts liberty into dependency, which is the definition of political death in his framework.

  **Summary for your work:**
  Montesquieu's judgment rests on the idea that **liberty is a system of relationships, not just a sum of benefits.** The machine provides benefits but corrupts the relationship (from equal/citizen to dependent/client). Therefore, the consent is invalid because it is exercised within a relationship of domination, not liberty. This holds even if we discard the 18th-century language of "virtue" and speak instead of "civic agency" and "structural dependency."
