answer: |-
  1. Bottom line

  You can keep eight of your ten verdicts with a single coherent principle, but you must sacrifice the Ensatina salamanders (1) and the bacterial exception (9). Your intuition favors independence over connectivity, yet Ensatina relies on connectivity to remain one species, and bacteria defy lineage entirely. The principle that survives is this: A species is a population lineage maintaining a distinct evolutionary trajectory and ecological identity through internal cohesion mechanisms, regardless of hybrid origins, provided that trajectory is stable without continuous external input. This captures your distinction between the Italian sparrow and the pizzly bear, and between flycatchers and dogs, by prioritizing *stability of identity* over mere potential for interbreeding. It forces you to admit that ring species are arbitrary slices of a continuum, and that bacteria operate on a logic too alien for this macro-biological tool.

  2. The principle

  **Clause 1: Distinct Evolutionary Trajectory.** Two populations constitute separate species if they are evolving independently toward different adaptive peaks, maintaining distinct morphological, behavioral, or genetic identities over time. (Cases 2, 3, 8)
  *Gloss:* "Distinct identity" does not require total reproductive isolation, but it requires that the populations do not merge into a homogeneous pool. Operative terms here are *trajectory* (the direction of change) and *identity* (the measurable characteristics). This clause secures your verdict on the flycatchers, where song maintains distinct trajectories despite morphological similarity, and the elephants, where ecology maintains distinctness despite hybridization. It also validates the Neanderthal verdict, treating introgression as leakage between otherwise separate paths.

  **Clause 2: Cohesion Mechanism.** A lineage remains a single species if it is held together by gene flow or by stabilizing selection that prevents divergence, even if morphological disparity is high. (Case 6, 7)
  *Gloss:* "Cohesion" is the force resisting split. For dogs and wolves, cohesion is genetic compatibility and overlapping ecological potential; the disparity is anthropogenic or ecological, not lineage-breaking. For bdelloid rotifers, cohesion is clonal integrity within ecological niches. This clause prevents you from splitting dogs and wolves based on appearance alone and accommodates asexual eukaryotes by swapping gene flow for ecological clustering.

  **Clause 3: Hybrid Stability.** A hybrid population constitutes a species only if it occupies a stable ecological niche and maintains reproductive cohesion independent of the parent lineages. (Cases 4, 5)
  *Gloss:* "Independent" is the operative constraint. The Italian sparrow passes because it holds its range without needing continuous influx from parent sparrows. The pizzly bear fails because it is a transient symptom of range collapse, lacking a unique stabilizing niche. This clause does unearned work if it implies all hybrids are potential species; it specifically targets *stable hybrid lineages*.

  **Clause 4: The Limit of Vertical Inheritance.** The concept applies only to organisms where vertical inheritance dominates over horizontal gene transfer. (Case 9)
  *Gloss:* This clause exists solely to handle bacteria. In prokaryotes, gene exchange is reticulate, not branching. "Species" here is indeed bookkeeping. This clause saves your verdict on bacteria without forcing you to apply the same logic to rotifers, distinguishing eukaryotic lineage from prokaryotic networks.

  **Clause 5: Connectivity is Insufficient.** Physical connectivity between populations does not guarantee species unity if the ends of the chain are functionally independent. (Case 1, 10)
  *Gloss:* This clause cuts against your Ensatina verdict. If the ends do not recognize each other, the "ring" is a historical artifact, not a cohesive unit. "Connectivity" is downgraded from a defining feature to a historical footnote. This ensures the principle remains robust even if the gull ring is genetically broken.

  3. The two hard pairs

  **The Italian Sparrow (4) vs. The Pizzly Bear (5)**
  Both are hybrids. Both are fertile. The mechanism separating them is *ecological stabilization*. The Italian sparrow has settled into a niche where it outcompetes or coexists with its parents without requiring their genetic input to persist. It has achieved *lineage independence*. The pizzly bear is a collision caused by environmental retreat; it lacks a unique niche that selects for pizzly traits over parent traits. It is a transient zone of contact, not a stable trajectory. Your principle must define species by *persistence of identity*, not just *origin*. If the ice returns and grizzlies retreat, pizzlies vanish. If humans vanish, sparrows remain. That stability is the mechanism.

  **The Flycatchers (2) vs. Dogs and Wolves (6)**
  Both involve populations that could theoretically interbreed. The mechanism separating them is the *nature of the barrier*. Flycatchers are separated by pre-zygotic behavioral isolation (song) that effectively stops gene flow in the wild, maintaining independent trajectories. Dogs and wolves are separated by artificial selection and ecological preference, but the genetic barrier is porous; they share a cohesive gene pool if barriers are removed. The flycatchers are two species because they *choose* not to mix. Dogs and wolves are one species because they *can* mix and produce fertile offspring that integrate. Your verdict relies on *effective isolation in nature* versus *potential compatibility*. If song counts as "outside help," then all behavioral isolation is invalid. It is not; it is internal to the lineage.

  4. What I have to give up

  You must surrender Verdict 1 (Ensatina) and Verdict 9 (Bacteria).

  Ensatina felt compelling because it is the classic textbook example of speciation in action. It appeals to the intuition that connectivity equals unity. However, your principle prioritizes independent trajectory. If the southern ends behave as though the other does not exist, they are on separate trajectories. Keeping them as one species requires valuing the historical chain over the current biological reality. The loss costs you a famous example, but it saves your principle from contradiction. If the ring is broken genetically (as in Case 10), the verdict is factually wrong anyway.

  Bacteria felt compelling because you recognized the word "species" is used loosely there. Your principle demands lineage coherence. Bacteria swap genes horizontally so promiscuously that "lineage" is a fuzzy metaphor. Keeping them as "no species" acknowledges that your principle is a tool for macro-eukaryotes. The loss costs you universality. You cannot claim this principle explains all life. But insisting it does would break the logic required to save the rotifers. You must accept that "species" is a property of complex life histories, not a fundamental unit of matter like "atom."

  5. Candidate B

  **The Principle of Diagnosability.**
  A species is the smallest distinct group of organisms that can be consistently distinguished from other such groups by a unique combination of traits.

  **The Price.**
  This principle keeps Ensatina (the ends are diagnosable) and Bacteria (operational units). However, it forces you to split dogs and wolves (Case 6) into multiple species, contradicting your firm verdict. It also struggles with the Italian sparrow (Case 4) if the diagnostic traits are merely intermediate. It turns speciation into a taxonomic exercise rather than a biological process. It favors the curator's drawer over the field station.

  **Defense.**
  I would defend your original principle (Candidate A: Independent Trajectory) in print. Candidate B is safer for museum work but fails to capture the dynamic reality you reported in the Karoo and the genetics lab. Candidate A explains *why* the sparrow is real and the pizzly is not; Candidate B just asks if they look different. Candidate A engages with the *process* of nature, which is the story you are writing. Candidate B engages with the *cataloging* of nature. Since your feature is on the state of the species concept as a biological reality, not a library system, Candidate A is the honest choice. It admits the messiness of hybridization and behavior, whereas Candidate B tries to draw lines where none exist.

  6. New cases

  **Recent Split, Morphologically Divergent, Fertile.**
  Verdict: One species. Despite looking different, the trajectory is not yet independent; gene flow still homogenizes the pool. The divergence is likely plastic or recent selection not yet fixed.

  **Widespread Intergrade, One Island Exception.**
  Verdict: Two species. The mainland is one cohesive unit. The island population is on an independent trajectory due to isolation. The break in intergrading marks the speciation event.

  **Captive Lineage, Century Apart, No Recognition.**
  Verdict: One species (potentially two). If the barrier is purely artificial and genetic compatibility remains, they are one. If behavioral isolation is fixed genetically, they are becoming two. The principle demands testing release: would they merge? If yes, one species.

  **Extinct Population, DNA Inside Living Species.**
  Verdict: Not a separate species. It is a nested lineage within the living species' history. Unless it occupied a distinct, stable niche separate from the ancestors, it is a population variant, not a species.

  **The Quagga Project.**
  If the project succeeds, is the resulting animal a quagga? Your principle must answer: No. It is a plains zebra with quagga phenotypes. The *lineage* is extinct. The *trait complex* is restored. The principle cares about continuity of trajectory, not just appearance. Is this a question the principle must answer? Yes, because "de-extinction" claims rely on species identity. Your principle clarifies that you cannot breed back a history, only a look. The animal is a proxy, not the species. This protects the integrity of the concept against conservation marketing.
