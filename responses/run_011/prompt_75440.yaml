answer: |-
  ### Logical Axes of Rulebook Authority

  Before administering the instrument, understand the four dimensions of disagreement this tree probes. First, **Source of Validity**: does a rule bind because it follows the correct textual pedigree (Internal), or because players continue to accept it (External)? Second, **Temporal Binding**: can a rule constrain its own future amendment (Self-Embracing), or does the current majority always retain sovereignty (Continuing)? Third, **Contradiction Tolerance**: does the system crash when rules conflict, or do both stand until resolved? Fourth, **Foundational Status**: is the root authority amendable, or is it a presupposed norm that can only be abandoned?

  Your answers will locate your model within this space. There are no "correct" answers; there are only consistent positions.

  ***

  ### Diagnostic Instrument

  **1. The Self-Entrenchment Proposal**
  A proposal passes with the required majority. It amends the Amendment Rule to state: "No rule shall ever be amended again." Next turn, a player proposes to amend a different rule.
  *   (A) The proposal is invalid; the first rule successfully locked the system.
  *   (B) The proposal is valid; the current majority overrides the previous restriction.
  *   (C) The proposal is valid only if the group agrees to ignore the lock.

  **2. The Packaging Problem**
  An Immutable Rule exists. Player X proposes to (1) transmute it to Mutable and (2) repeal it in a single proposal. Player Y argues these must be separate turns.
  *   (A) Packaging matters; the procedure is invalid because transmutation must settle before repeal.
  *   (B) Packaging is irrelevant; if the outcome is achievable, the method doesn't void it.
  *   (C) It depends on whether the Arbiter accepts the combined motion.

  **3. The Unamendable Right**
  A rule states: "No player's voting weight may be reduced without their consent." A later proposal passes to reduce a player's weight without consent.
  *   (A) The later proposal is void; the consent clause binds the game internally.
  *   (B) The later proposal stands; no rule can permanently bind the majority's will.
  *   (C) The clause binds only because players voluntarily honor it, not because it must.

  **4. The Contradiction**
  An amendment passes that conflicts with an existing unrepealed rule. The ruleset has no consistency requirement.
  *   (A) The later text prevails; the earlier rule is implicitly repealed.
  *   (B) Both stand; the system tolerates live contradictions until reconciled.
  *   (C) The amendment is void; a valid rule cannot contradict existing law.

  **5. The Retroactive Void**
  A proposal passes declaring that an amendment carried three weeks ago was void from the outset, adjusting scores accordingly.
  *   (A) Valid; the current majority can redefine past validity.
  *   (B) Invalid; validity is a historical fact that cannot be changed retroactively.
  *   (C) Valid for scores only; the history remains unchanged but penalties apply.

  **6. The Arbiter's Paradox**
  The Arbiter rules a proposal invalid. A new proposal passes stripping the Arbiter of authority specifically for this ruling.
  *   (A) Valid; the rules are superior to the Arbiter's interpretation.
  *   (B) Invalid; the Arbiter defines validity, so their ruling stands.
  *   (C) Valid only if the Arbiter accepts the stripping of their own power.

  **7. The Founding Objection**
  A player objects that the founding vote was taken when there were yet no rules to authorize it, rendering the whole rulebook void.
  *   (A) The objection is correct; the game lacks legal foundation.
  *   (B) The objection is wrong; the social fact of playing validates the start.
  *   (C) The objection is wrong; we presuppose a norm that validates the founding.

  **8. The Dissolution**
  A proposal passes to dissolve the game outright.
  *   (A) This is an exercise of the rules; the rules authorize their own end.
  *   (B) This is an exit from the rules; the game ends by mutual abandonment.
  *   (C) This is both; the rule triggers the social act of abandonment.

  ***

  ### Scoring Key and Position Mapping

  Tally your responses. Your dominant pattern indicates your underlying model of authority.

  **The Continuing View (Parliamentary Sovereignty)**
  *   **Pattern:** Predominantly (B) answers.
  *   **Diagnosis:** You believe the present majority is sovereign. Entrenchment clauses are merely persuasive text; a current majority can always do whatever it likes. Validity is determined by current pedigree, not past constraints. You likely chose (B) on Q1, Q3, Q4, and Q5.
  *   **Logical Space:** Internal Validity + Continuing Sovereignty.

  **The Self-Embracing View (Entrenchment)**
  *   **Pattern:** Predominantly (A) answers on Q1 and Q3, (B) or (A) on others.
  *   **Diagnosis:** You believe a rule can genuinely bind later amendments, permanently if it says so. The text itself constrains the future. You likely chose (A) on Q1 and Q3.
  *   **Logical Space:** Internal Validity + Self-Embracing Sovereignty.

  **The Acceptance View (Realist)**
  *   **Pattern:** Predominantly (C) answers.
  *   **Diagnosis:** You believe validity is a prediction about what players will keep treating as authoritative. Rules bind only because we let them. You likely chose (C) on Q1, Q3, Q6, and Q7.
  *   **Logical Space:** External Validity + Social Fact.

  **The Hierarchical View (Basic Norm)**
  *   **Pattern:** (A) on Q4, (C) on Q7, mixed on others.
  *   **Diagnosis:** You believe rules derive force from a presupposed top-level norm that cannot be amended, only abandoned. Contradictions must be resolved (Q4-A) because the system must be coherent, but the foundation is external (Q7-C).
  *   **Logical Space:** Internal Validity + Presupposed Foundation.

  **The Reform View (Drafting Practice)**
  *   **Pattern:** (A) on Q2, (B) on Q4, (C) on Q5.
  *   **Diagnosis:** You take the paradoxes to be real defects of drafting practice. You prescribe explicit tiers and explicit conflict rules. You focus on procedural clarity (Q2) and score adjustment (Q5) rather than metaphysical validity.
  *   **Logical Space:** Procedural Validity + Pragmatic Resolution.

  **The Deflationary View (Bookkeeping)**
  *   **Pattern:** (B) on Q1, (B) on Q4, (A) on Q8.
  *   **Diagnosis:** You believe there is no deep question, only bookkeeping once a tie-break protocol is fixed. Validity is just a label for "what the scorekeeper says."
  *   **Logical Space:** Internal Validity + Deflated Authority.

  ### Analysis of Logical Space and Overlaps

  **Unoccupied Space:**
  The combination of **Self-Embracing** (Q1-A) and **Acceptance** (Q3-C) is logically unstable and likely unoccupied. If rules bind themselves permanently (Self-Embracing), validity cannot depend solely on current voluntary honor (Acceptance). If players can ignore the lock whenever they wish, the lock was never real. This position is incoherent: it claims the text binds the future while simultaneously claiming the future decides if the text binds.

  **The Continuing vs. Deflationary Overlap:**
  Your suspicion is correct: the **Continuing** and **Deflationary** views coincide on every in-game case provided by these eight questions. Both will vote (B) on Q1 (majority overrides lock) and (A) on Q4 (later text prevails). They diverge only on the meta-question of *why*. The Continuing player believes the majority *has the right* to override; the Deflationary player believes the question of "right" is nonsense, and only the mechanism matters.
  *   **Differentiation:** To separate them, ask: "If the majority voted to override a lock, but everyone privately felt it was wrong, would the override be valid?" The Continuing player says Yes (authority resides in the vote); the Deflationary player says the question is meaningless (validity resides in the recorded outcome).

  **Hierarchical vs. Reform:**
  These may overlap on Q2 (Packaging). The Hierarchical view insists on procedure because it violates the norm hierarchy; the Reform view insists on procedure because it prevents bugs. They are separated by Q7 (Founding). The Hierarchical player needs a presupposed norm (Q7-C); the Reform player sees the founding as a practical starting line (Q7-B).

  **Scoring Note:**
  If your answers are scattered evenly across A, B, and C, you likely hold the **Acceptance View** but are attempting to articulate it using the vocabulary of the **Continuing View**. This is common among players who recognize the social reality of the game but feel compelled to argue from the text to win disputes.
