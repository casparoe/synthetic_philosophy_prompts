answer: |-
  **What the account is for**

  The account must delineate the epistemic status of theories in data-deprived domains, specifically cosmology and high-energy physics. Its primary function is not to justify research funding or aesthetic preference, but to rationalize a shift in credence regarding a theory's truth-likeness absent direct empirical testing. It must explain how a theory transitions from a speculative framework to a confirmed account of reality using only meta-empirical evidence. Crucially, it must resolve the status of accumulated support when the theoretical landscape shifts. If a theory gathers decades of non-empirical support and then faces a viable rival, the account must determine whether that prior support was genuine evidence or merely a placeholder for ignorance. It serves to prevent non-empirical confirmation from collapsing into sociological momentum while acknowledging that science often must bet on theories before data arrives.

  **Non-negotiable**

  First, the account must rigorously distinguish confirmation from justification. Justification explains why it is rational to pursue a theory; confirmation explains why it is rational to believe it. If non-empirical arguments only show that a theory is worth working on, they are merely heuristic virtues rebranded. For an account to count as confirmation, it must demonstrate how meta-empirical facts increase the probability of the theory being true, not just useful. The case behind this is the history of ether theories: they were justified by coherence and lack of alternatives for centuries, but confirming them would have been false. An account that cannot separate the rationality of pursuit from the probability of truth fails to describe science, describing only resource allocation.

  Second, the argument from "No Alternatives" (NAA) must treat the absence of rivals as a claim about the structure of theory space, not the effort of search. If NAA relies on how hard physicists looked, then the discovery of a rival merely proves prior search efforts were insufficient, rendering all accumulated support null. To function as confirmation, the absence of alternatives must imply a constraint on possibility itself—that the mathematical landscape is so narrow that finding one solution implies uniqueness. If the support rests on sociological facts about who looked when, the arrival of a rival evaporates the support entirely, making it weightless. The account must ground NAA in the topology of theoretical possibilities, not the history of human ingenuity.

  Third, the account must solve the Rival Problem without making prior support either dogmatic or ephemeral. When a rival emerges after decades of solitary dominance, the account must specify what happens to the original theory's confirmation status. If the support evaporates instantly, it was never confirmation, only a mood based on ignorance. If the support remains unrevisable, the account describes dogma, not science. The requirement is that prior support retains some weight derived from the constraints that held during the solitary period, yet remains sensitive to the new topology introduced by the rival. It must explain how evidence can be real yet defeasible without admitting it was never evidence at all.

  Fourth, the account must remain consistent with how science revises its mind under empirical confirmation. Non-empirical confirmation cannot operate on a logic that contradicts empirical Bayesian updating. If empirical data lowers credence in a theory when contradictory evidence appears, non-empirical support must similarly degrade when contradictory theoretical evidence (a rival) appears. If the account posits a dualistic epistemology where non-empirical support is immune to the revisionary norms that govern empirical science, it isolates cosmology from the rest of scientific practice. The mechanism of credence adjustment must be uniform; otherwise, "confirmation" becomes an equivocal term masking a special plea for theory-laden domains.

  **Camp taste**

  Several requirements are often debated but are ultimately stylistic preferences rather than structural necessities. Demanding a formal Bayesian calculus for non-empirical support is one such taste; a qualitative account of credence shifting can suffice provided it respects the logical constraints outlined above. Similarly, whether one requires the theory to be empirically testable *in principle* (even if not in practice) is a divide between realists and instrumentalists, not a condition for confirmation itself. Another optional constraint is the specific weighting of internal consistency versus uniqueness. Some camps prioritize mathematical coherence as a truth-tracker, while others prioritize the scarcity of alternatives. Neither is non-negotiable provided the chosen virtue links to probability rather than mere aesthetic satisfaction. Finally, whether one views the confirmed theory as a final description or a effective field theory is a metaphysical stance, not an epistemic requirement for the confirmation account itself.

  **The squeeze**

  The monotonicity problem and the demand for non-trivial support cannot be satisfied simultaneously. Monotonicity requires that support for a theory increases or remains stable as time passes without rivals; non-triviality requires that this support reflects genuine facts about the world, not just ignorance. If support grows monotonically based on the duration of "no rivals found," it is based on a contingent state of search. When a rival appears, this basis is falsified, and support must collapse to zero to remain rational. This makes the prior support weightless—it was merely accumulated ignorance. Conversely, if support is based on a non-trivial fact (e.g., "no rivals *exist*"), it cannot be monotonic because the arrival of a rival proves the fact false. To maintain support after a rival appears (to avoid weightlessness), one must claim the prior support was based on something else, but if that something else survived the rival, the rival shouldn't have lowered credence. You cannot have support that grows steadily on the absence of rivals yet survives the presence of one without admitting the growth was an artifact of error.
