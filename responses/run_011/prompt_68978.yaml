answer: |-
  The fault lies in **premise (2)**.

  Your colleague's *reductio* is elegant, but it relies on a surreptitious substitution of *economic liability* for *political competence*. By rejecting (2), you preserve the core intuition of subsidiarity (1) and the moral reality of individual responsibility (3), without collapsing into anarchism (6).

  Here is the diagnosis, the price of repair, and the broader implications for your chapter.

  ### 1. Why Reject Premise (2)?

  **The Step:** *"A level is competent to handle a matter just in case the consequences of a decision about that matter fall on those who make it."*

  **Why it looked acceptable:**
  This premise borrows its plausibility from market logic and fiscal federalism. It sounds like a robust accountability mechanism: if you break it, you buy it. In the context of Swiss cantons or German *Länder*, this aligns with the idea that local governments should bear the fiscal consequences of their policies to prevent moral hazard. It feels democratic and anti-bureaucratic.

  **Why it fails:**
  It reduces "competence" to "cost-bearing." In political theory, competence is not merely about who pays the bill; it is about **capacity to achieve the objective**.
  *   **Externalities:** If I decide to dump toxic waste in my backyard, the consequences fall largely on my neighbors. By (2), I am not competent to handle this, because I do not bear the full cost. Therefore, a higher level (the state) must act. The *reductio* assumes individuals internalize all consequences, which is empirically false for most regulatory matters (pollution, pandemics, traffic safety).
  *   **Collective Action:** If the "matter" is national defense, no individual can handle it, even if they bear the cost of invasion. They lack the *capacity*, regardless of liability.
  *   **Rights:** Competence is also constrained by rights. Even if I bear the consequences of selling myself into slavery, the state may deem me "incompetent" to make that decision because it violates a normative boundary of agency.

  **The Repair:**
  You must redefine competence. A level is competent if:
  1.  It has the **capacity** to effectively achieve the objective.
  2.  It has the **legitimacy** (accountability) to those affected.
  3.  It can **internalize** the relevant consequences (costs and benefits).

  Under this repaired definition, the individual is *not* the lowest competent level for matters involving significant externalities or public goods. The state becomes the "lowest competent level" for those specific matters, preserving subsidiarity without entailing anarchism.

  ### 2. Pricing the Repair: Does this invite centralization?

  If you reject (2), you open the door to a broader definition of competence. The risk is that "capacity" becomes a Trojan horse for centralization. If the federal government argues, "We can regulate carbon emissions more efficiently than 50 states," they claim competence based on scale economies.

  **How to resist centralization:**
  You must insist that **efficiency is not the only metric of competence.** Subsidiarity contains a *presumption* in favor of the lower level. The higher level must prove not just that it *can* act, but that the lower level *cannot sufficiently achieve the objective*.
  *   **The Burden of Proof:** The repair requires you to frame subsidiarity as a procedural hurdle, not just an outcome test. The higher level must demonstrate the *failure* of the lower level, not just the *advantage* of the higher level.
  *   **The "Sufficiently" Clause:** As you noted in the EU treaty version, action is permitted only where objectives cannot be *sufficiently* achieved below. This allows for imperfect local solutions to trump perfect central ones, provided they meet a threshold of adequacy. This protects local autonomy against the "efficiency" argument.

  ### 3. The Secondary Error: Premise (5)

  While (2) is the engine of the *reductio*, **premise (5)** is the transmission.
  *(5) Every exercise of state authority over a person is a decision concerning that person's conduct...*

  **Why reject it?**
  This conflates the **object of regulation** with the **problem being solved**.
  *   A speed limit is not a decision about *my* driving; it is a decision about *traffic flow and safety*.
  *   A tax is not a decision about *my* paying; it is a decision about *resource allocation for public goods*.

  **The Cost of Repair:**
  If you reject (5), you need an account of the **individuation of social problems**. How do we carve up the world into "matters"?
  *   **Risk of Ad Hocery:** If the state defines the "matter" as "public health," it can mandate vaccines. If the individual defines the "matter" as "bodily integrity," the state cannot.
  *   **Principled Account:** You need a theory of **public goods**. Matters are individuated by the nature of the good sought. If the good is non-excludable and non-rival (e.g., clean air), the "matter" is inherently collective, and the individual is categorically the wrong unit of decision-making, regardless of cost-bearing. This is less ad hoc than it sounds: it relies on the economic and sociological nature of the problem, not just political fiat.

  ### 4. Is Premise (7) Legitimate?

  *(7) But subsidiarity is offered as a principle for distributing authority among levels that already exist...*

  **Diagnosis:**
  Premise (7) is a **category error regarding scope**, but a **pragmatic truth regarding federalism**.
  *   **The Error:** Historically and philosophically, subsidiarity *does* apply to the individual vs. the state. The Catholic social teaching lineage (specifically *Quadragesimo Anno*, 1931) explicitly argues that the state should not absorb functions that individuals or families can perform. The *reductio* actually aligns with the radical edge of Catholic subsidiarity: the state *is* suspect.
  *   **The Pragmatic Truth:** In your chapter on *federations*, the existence of the state is a presupposition. You are analyzing the vertical division of power *within* a sovereign entity (or quasi-entity like the EU).
  *   **Verdict:** The *reductio* does not refute subsidiarity; it refutes the idea that subsidiarity is *only* a federal principle. It shows that federal subsidiarity is a subset of a broader political philosophy. You can concede (7) for the purposes of your chapter (we are assuming a state exists) while noting that the colleague's argument proves subsidiarity has anarchistic roots if pushed to its logical extreme without the corrected definition of competence.

  ### 5. The Catholic Lineage

  The Catholic lineage is fatal to your colleague's argument. Catholic subsidiarity is not libertarian. It does not say "the individual is sovereign." It says "the human person is sacred, but social."
  *   **Shielding Intermediate Associations:** The purpose is to protect the family, unions, and churches from the *state*, not to protect the individual from *all* authority.
  *   **The Common Good:** The state is mandated to act when the lower level cannot secure the *common good*. Since the "common good" is by definition something the individual cannot secure alone, the state is *required* to act in those domains.
  *   **Relevance:** This confirms that (2) is the outlier. Catholic teaching would say an individual is *not* competent to decide on vaccination during a plague, not because they don't bear the cost, but because they lack the capacity to secure the common good.

  ### 6. What Would Change My Mind?

  I would shift my verdict to **rejecting (5)** instead of (2) if you could demonstrate that **"cost-bearing" is the only democratically verifiable metric of competence.**

  If "capacity" (my proposed fix for 2) is inherently technocratic—requiring experts to decide who is "capable"—then it undermines the democratic legitimacy of federalism. If we accept (2), we at least have a clear, observable test: follow the money/harm.
  *   **Where my reasoning might break down:** I am assuming that "capacity" can be defined normatively without becoming a tool for endless centralization. If, in practice, every claim of "insufficient local capacity" turns out to be a power grab, then (2)'s hard constraint (you must bear the cost) might be the only bulwark against empire, even if it theoretically implies anarchism.
  *   **The Counter-Argument:** However, since you are writing about *existing* federations (US, CH, DE, EU), they have already solved the "anarchism" problem. Their constitutions presuppose state authority. Therefore, your task is to explain their *internal* allocation rules, not to justify the state's existence against the individual. For *that* task, (2) is useless because it denies the premise of your chapter.

  ### Summary for Your Chapter

  1.  **Reject (2).** Competence is not merely cost-bearing; it is the capacity to secure the relevant good (private or public).
  2.  **Modify (5).** State authority regulates *systems* and *public goods*, not merely individual conduct.
  3.  **Contextualize (7).** Acknowledge that while federal subsidiarity presupposes the state, the principle's philosophical roots do police the boundary between individual and state. The *reductio* highlights this tension but does not invalidate the federal application.
  4.  **Use the Catholic Lineage.** It provides the normative vocabulary to distinguish between "individual sovereignty" (which subsidiarity does not guarantee) and "social agency" (which it does protect).

  Your colleague has successfully shown that a *libertarian interpretation* of subsidiarity leads to anarchism. Your reply is that subsidiarity is not libertarian; it is **communitarian with a presumption of locality.** It favors the lower level, but only insofar as that level can actually achieve the social end.
