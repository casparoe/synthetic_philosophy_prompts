answer: |-
  This is a classic dialectical impasse. Your friend is wielding *Ex Contradictione Quodlibet* (ECQ) as if it were a law of nature or a rule of language, rather than what it actually is: a specific feature of Classical Logic that is explicitly rejected by the logic dialetheists propose.

  By treating ECQ as an unassailable premise, he is begging the question against dialetheism. If dialetheism is true, Classical Logic is not the correct logic for truth preservation, and therefore ECQ is not a valid principle for truth preservation.

  Here is a menu of five distinct theses that the slogan "from a contradiction anything follows" might express. You can present this to your friend to force him to specify which claim he is defending.

  ### 1. The Syntactic Thesis (Derivability)
  *   **The Claim:** In the formal system $L$, the sequent $A, \neg A \vdash B$ is derivable.
  *   **Status:** **Relative.** True in Classical Logic (CL) and Intuitionistic Logic. False in paraconsistent logics (e.g., LP, $K_3$).
  *   **Platitude or Contested?** Contested. It is a technical feature of a specific calculus, not a universal law.
  *   **Verdict on Move 1 (Trivialism):** **Does not license it.** Showing that $A, \neg A \vdash B$ is derivable in *Classical* Logic does not prove that a dialetheist who uses *Paraconsistent* Logic is committed to $B$. It only proves they are using a different logic.
  *   **Verdict on Move 2 (Bohr):** **Does not license it.** It shows that if you translate Bohr's model into Classical Logic, it explodes. It does not show that the model *itself* was useless, only that CL is the wrong tool to analyze inconsistent theories.
  *   **Question-Begging?** **Yes.** It assumes Classical Logic is the correct logic for evaluating the dialetheist's position, which is precisely what is being disputed.

  ### 2. The Semantic Thesis (Model-Theoretic Entailment)
  *   **The Claim:** There is no model in which $A$ and $\neg A$ are both true; therefore, in every model where premises are true, the conclusion $B$ is true (vacuously).
  *   **Status:** **Relative.** True in classical semantics (which bans truth-value gluts). False in dialetheic semantics (which allows gluts).
  *   **Platitude or Contested?** Contested. It depends on whether you define a "model" as allowing truth-value gluts.
  *   **Verdict on Move 1 (Trivialism):** **Does not license it.** This thesis relies on the definition of a model excluding true contradictions. To use this against a dialetheist is to define their position out of existence by fiat.
  *   **Verdict on Move 2 (Bohr):** **Does not license it.** It implies Bohr's theory had no models. But we can construct paraconsistent models where the theory holds without entailing arbitrary falsehoods (like "the moon is made of cheese").
  *   **Question-Begging?** **Yes.** It presupposes that true contradictions are impossible (no model can contain them), which is the definition of trivialism/dialetheism's negation.

  ### 3. The Epistemic Thesis (Rational Commitment)
  *   **The Claim:** Any rational agent who believes $A$ and $\neg A$ is rationally committed to believing $B$ (for any $B$).
  *   **Status:** **False.** Even in classical frameworks, humans are not logically omniscient. More importantly, in paraconsistent frameworks, rationality does not require belief in consequences derived via ECQ.
  *   **Platitude or Contested?** Highly Contested. Most epistemologists reject logical omniscience.
  *   **Verdict on Move 1 (Trivialism):** **Undermines it.** A dialetheist can believe the Liar is true and false without believing that "grass is purple." They simply reject the inference rule that connects the two.
  *   **Verdict on Move 2 (Bohr):** **Undermines it.** Bohr and his colleagues did not believe the spectral lines were denied. They contained the inconsistency without exploding their belief set.
  *   **Question-Begging?** **Yes.** It assumes that rationality is defined by Classical Logic.

  ### 4. The Metaphysical Thesis (Truth Entailment)
  *   **The Claim:** If it is *true* that ($A$ and $\neg A$), then it is *true* that $B$ (in reality).
  *   **Status:** **The Core Dispute.** This is not a premise; it is the conclusion of the argument.
  *   **Platitude or Contested?** Deeply Contested. This is the definition of "explosive reality." Dialetheists deny this.
  *   **Verdict on Move 1 (Trivialism):** **Circular.** You cannot use this claim to prove dialetheism leads to trivialism, because dialetheism is precisely the denial of this claim.
  *   **Verdict on Move 2 (Bohr):** **Circular.** To say Bohr's theory entailed false predictions in reality assumes that the inconsistency in the theory forced reality (or the theory's truth) to explode.
  *   **Question-Begging?** **Totally.** This is the point at issue. Asserting it as a premise against a dialetheist is pure begging of the question.

  ### 5. The Pragmatic Thesis (Informational Content)
  *   **The Claim:** An inconsistent theory has zero informational content because it rules out no possible state of affairs.
  *   **Status:** **False (in paraconsistent contexts).** An inconsistent theory can rule out some states without ruling out *all* states.
  *   **Platitude or Contested?** Contested. It relies on the classical definition of content (sets of possible worlds). Paraconsistent content is defined over inconsistent worlds.
  *   **Verdict on Move 1 (Trivialism):** **Does not license it.** One can hold a non-trivial inconsistent position (e.g., "The Liar is true and false, but 2+2=4").
  *   **Verdict on Move 2 (Bohr):** **Directly Refutes it.** Bohr's theory ruled out many spectral lines (it predicted specific ones). It was highly informative despite the inconsistency regarding radiation.
  *   **Question-Begging?** **Yes.** It assumes a classical definition of "content" that excludes inconsistent information by definition.

  ---

  ### How to Use This Menu

  Your friend is likely conflating **Thesis 1** (a rule of a specific game we call Classical Logic) with **Thesis 4** (a law of truth itself).

  **The Strategy:**
  1.  **Ask for Specification:** "When you say 'anything follows,' are you talking about derivability in Classical Logic, or are you talking about what is actually true in the world?"
  2.  **If he says Classical Logic (Thesis 1):** Concede the point. "Yes, in Classical Logic, explosion holds. But dialetheists propose that Classical Logic is the wrong tool for semantic paradoxes and inconsistent theories. You are arguing that they are using the wrong logic, but they admit that! They are *choosing* a paraconsistent logic specifically to avoid explosion."
  3.  **If he says Truth/Reality (Thesis 4):** Call out the circularity. "You are asserting that if a contradiction is true, everything is true. But that is exactly what dialetheism denies. You cannot use the denial of dialetheism as a premise to prove dialetheism is false."
  4.  **On Bohr (Thesis 5):** "Bohr's theory was inconsistent, but it was not trivial. It didn't predict that the sun would rise in the west. Therefore, 'anything follows' is false as a description of how inconsistent theories function in science. The theory retained content despite the contradiction."

  **The Knockout Point:**
  The principle *Ex Contradictione Quodlibet* is not a self-evident truth like the Law of Non-Contradiction (for classical logicians); it is a **design choice** in the construction of a logical system. Classical logicians *build* explosion into their systems (via Disjunctive Syllogism or Reductio). Paraconsistent logicians *remove* it to handle inconsistency without triviality.

  Your friend is arguing that the dialetheist is playing chess incorrectly because they moved their Rook like a Bishop. The dialetheist's reply is: "We aren't playing Chess; we're playing Go. And in Go, that move is legal."
