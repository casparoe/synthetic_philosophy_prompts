answer: |-
  **HOUSE OF DOMINANCE: OFFICIAL CONTESTANT HANDBOOK (SEASON 5)**

  **1. ELIGIBILITY AND EViction PROTOCOLS**
  1.1. **Contestant Status.** All entrants are Pure Strategies. You represent a single, fixed action available to the Player. You are not the Player. You are the option.
  1.2. **The Audience.** The "Audience" consists of all possible actions available to the Opponent. Your performance is measured by Payoff against every Audience configuration simultaneously.
  1.3. **Strict Elimination.** A Contestant is eligible for eviction only if another Contestant generates a strictly higher Payoff against *every* possible Audience configuration.
  1.4. **The Tie-Breaker.** If Payoffs are equal in even one Audience configuration, the eviction is void. Safety is guaranteed by mediocrity. To leave the House, you must be unequivocally worse.

  **2. THE BLOC PROVISION (MIXED STRATEGIES)**
  2.1. **Coalition Eligibility.** Eviction comparisons are not limited to one-on-one matchups. A Contestant may be eliminated by a "Bloc," defined as a weighted average of two or more remaining Contestants.
  2.2. **Individual Safety Irrelevance.** It is irrelevant if no single Contestant can beat you alone. If a probabilistic combination of remaining Contestants yields a higher expected Payoff against all Audience configurations, you are evicted.
  2.3. **Internal Sourcing.** Blocs may only be formed using Contestants currently residing in the House. You cannot be dominated by someone who has already been cancelled.

  **3. THE LEGACY CLAUSE (WEAK DOMINANCE)**
  3.1. **Producer Discretion.** Under the Legacy Clause, Producers reserve the right to evict Contestants who are *Weakly* Dominated (equal Payoff in some configurations, strictly lower in others).
  3.2. **Sequential Processing.** Legacy evictions are processed sequentially. Please note: The order in which Legacy evictions are executed may alter the final roster.
  3.3. **Liability.** The Production Company is not liable for roster instability resulting from the activation of Clause 3.1. Contestants deemed "stable" in one sequence may be removed in another. This is a feature, not a bug.

  **4. EQUIVALENCE STATUTE**
  4.1. **Favourite Status.** For the purposes of Audience polling, a Contestant is classified as "Nobody's Favourite" if and only if they are Strictly Dominated.
  4.2. **Legal Recourse.** Contestants claiming to be a "Best Response" to some belief system must provide proof of non-dominance. Otherwise, the label stands.

  ***

  **SIDEBAR: SEASON 4 ELIMINATION LOG (THE BLOC INCIDENT)**
  *Contestant 3 was evicted despite no single opponent outperforming them individually.*

  | Audience Config | Contestant 1 | Contestant 2 | **Contestant 3** | **Bloc (50% C1 / 50% C2)** |
  | :--- | :---: | :---: | :---: | :---: |
  | **Left** | 0 | 4 | **1** | **2** |
  | **Right** | 4 | 0 | **1** | **2** |

  *Analysis:* Contestant 1 fails to beat C3 on Left (0 < 1). Contestant 2 fails to beat C3 on Right (0 < 1). However, the 50/50 Bloc averages to 2 in both configurations. Since 2 > 1 universally, Contestant 3 was removed. Individual safety does not guarantee survival against a diversified portfolio.

  ***

  **FREQUENTLY ASKED QUESTIONS**

  **Q: Does the order of evictions matter under the Strict Elimination rules?**
  **A:** Absolutely not. Under Strict Protocols (Clause 1.3), the final set of survivors is mathematically invariant regardless of processing sequence. We understand rumors suggest otherwise, but these are unfounded. The algorithm is indifferent to drama. The outcome is robust. You can quote us on that.

  **Q: Why was my partner evicted under the Legacy Clause when we were stable together?**
  **A:** Clause 3.2 applies. When Weak Dominance is invoked, path dependence is possible. We recommend forming alliances that are robust to sequential deletion.

  **Q: Can I appeal based on "Potential"?**
  **A:** No. Payoffs are fixed.

  ***

  **GLOSSARY OF TERMS**

  **AUDIENCE:** The set of Opponent strategies. They do not vote; they simply exist to test your utility.

  **RATIONALIZABLE:** The highest honour achievable. Contestants who reach the Finale receive this word tattooed on their forearm. It certifies that the strategy survives Iterated Elimination of Strictly Dominated Strategies. It does not guarantee victory, only that you were not mathematically redundant.

  **STRICTLY DOMINATED:** A condition where another option (or Bloc) is always better. You are fired.

  **WEAKLY DOMINATED:** A condition where another option is sometimes better and never worse. You are fired, but only if Production feels like it.

  **PAYOFF:** The metric of your worth. Higher is better. Do not ask what the units are.

  **HOUSE OF DOMINANCE PRODUCTIONS**
  *We reserve the right to amend these rules without notice to ensure Nash Equilibrium.*
