  ### 2. EMPTY SPOTS (Logical Possibilities Nobody Picks)
  *   **Scan Says "Word Matters" + Criteria Says "Scientists Decide":** *Incoherent.* If the word itself changes the brain (Looping), then scientists aren't just finding pre-existing truth; they are participating in the creation. You can't hold both.
