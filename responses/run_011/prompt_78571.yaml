          Your history class penalizes you for judging past figures by modern morals, insisting they must be understood within their own time. Meanwhile, your school administration explicitly judges past figures by modern morals, renaming buildings to correct perceived ethical failures. Essentially, you are graded on suspending moral judgment in essays while attending assemblies celebrating the application of moral judgment.

      *   **2. What each one needs:**
          The anti-presentism rule requires a form of moral contextualism. It presupposes that moral truth is partially dependent on social consensus and available knowledge at the time. If Jefferson owned slaves, this practice assumes his moral culpability is mitigated because the social structure normalized it. Without this, judging him becomes anachronistic, violating the rule that history explains *why* things happened, not just whether they were good.

          The renaming and progress narrative require moral realism. It presupposes that certain values, like human equality, are trans-historical truths that slaveowners violated regardless of their era's consensus. If morality were purely contextual, the school couldn't claim the namesake was objectively wrong, only different. The "widening circle" metaphor only works if there is a fixed center of moral worth that we are gradually recognizing rather than inventing.

          The first practice needs you to believe that understanding causation requires suspending condemnation. It operates on the theory that calling someone a "monster" stops historical inquiry. It demands you treat past actors as rational agents within their specific constraints, implying their actions were logical, if not morally pristine, by the standards they possessed.

          The second practice needs you to believe that some constraints should have been rejected regardless of consensus. It operates on the theory that moral courage involves breaking from your time's norms. It demands you treat past actors as accountable to universal human rights, implying their actions were illogical and evil, regardless of the standards they possessed.

      *   **3. Compatible or not:**
          No, they are not compatible as currently executed. The rubric treats moral judgment as an analytical error, while the administration treats it as a civic duty. You cannot simultaneously be told that judging the past is intellectually invalid and morally necessary. The machinery breaks because the "no presentism" rule is being used to shield past actors from accountability rather than to deepen understanding of their context.

      *   **4. What would have to change:**
          The school must keep the renaming but change the rubric. The DBQ rule should shift from "no presentism" to "distinguish explanation from judgment." You wouldn't lose points for calling slavery wrong; you'd lose points for failing to explain *how* it persisted. The plaque stays, but the history curriculum stops framing contextualization as moral exoneration.

          The loss is comfort. Teachers lose the easy shield of "they didn't know better." Students lose the simplicity of clear villains vs. heroes. The curriculum becomes harder because you must hold two thoughts at once: Jefferson built a philosophy of freedom while denying it to others, and both facts are true simultaneously.

      *   **5. Bottom line:**
          Moral progress is real, but your rubric is lying to you about how we measure it. We progress precisely by judging the past as wrong, not just different. The school needs to stop grading you on moral silence and start grading you on moral complexity. You are right to be bugged.

