answer: |-
  To bear policy weight, fairness impossibility theorems must satisfy six validity conditions. Mere mathematical correctness is insufficient; the model must map onto the legal and operational reality.

  | Requirement | Consideration | Concrete Failure Mode |
  | :--- | :--- | :--- |
  | **Operational Flexibility** | Policy often permits group-specific thresholds to mitigate disparity. | Proving incompatibility only at a shared threshold when group-specific thresholds remain legally available. |
  | **Normative Alignment** | Metrics must reflect values actually held by stakeholders. | Adopting a criterion no regulator, plaintiff, or engineer actually endorses. |
  | **Mechanism Generality** | Decision rules may include stochastic elements to satisfy constraints. | Ruling out randomization by stipulation rather than by argument. |
  | **Practical Significance** | Mathematical existence of conflict does not imply material impact. | Showing a conflict that is possible in principle but negligible in the case at hand. |
  | **Group Stability** | Protected classes must be morally relevant, not statistically convenient. | Leaving the group partition arbitrary so results appear/disappear by redrawing groups. |
  | **Label Integrity** | Ground truth must not be contaminated by the system being evaluated. | Deriving contradiction from labels that are themselves artifacts of the decision rule. |

  **Analysis of Requirements**

  I regard **Normative Alignment** and **Label Integrity** as non-negotiable. If the conflicting metrics contradict legal standards or the target variable encodes historical bias, the theorem describes a fantasy system rather than a policy constraint. A mathematical proof regarding metrics no one wants is irrelevant; a proof regarding biased labels is dangerous.

  **Operational Flexibility** and **Mechanism Generality** are contestable. Some jurisdictions mandate single thresholds for simplicity, and some legal frameworks forbid randomized decisions as arbitrary. However, invoking a theorem to justify these constraints requires arguing *for* them, not assuming them within the proof.

  A meta-impossibility looms: a result strong enough to dictate policy must be context-independent, yet policy validity requires context-dependence. A theorem universal enough to be mathematically robust is often too abstract to govern specific cases, while a theorem specific enough to guide policy lacks the generality to be cited as a universal no-go. Thus, a "policy-closing" theorem may be unobtainable in principle. The demand for a context-free veto on context-sensitive decisions is itself unsatisfiable.

  **Diagnostic Questions for Decision-Makers**

  1.  **Endorsement:** Do the conflicting metrics correspond to standards actually required by law or ethics, or are they academic constructs?
  2.  **Flexibility:** Does the proof assume a single cutoff score, and does our legal framework permit group-specific thresholds?
  3.  **Validity:** Are the "true outcomes" used in the theorem independent of the historical decisions we are trying to evaluate?
  4.  **Magnitude:** Is the proven incompatibility large enough to affect real-world outcomes, or is it a boundary case negligible in practice?
