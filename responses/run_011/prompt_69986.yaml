      "That cut is in the wrong place. You should cut by continuity of self. If the 'you' that wanted the meal is the same 'you' that walks away happy, you substituted a goal. If the 'you' changed, you're not the same agent, so you can't claim freedom for the first one. You're saying freedom is when the agent dies."
