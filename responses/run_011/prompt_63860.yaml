answer: |-
  1. An adequate account must distinguish a trait's current causal role from the historical selection pressure that fixed it, since exaptations like feathers served thermoregulation before flight. This is a hard requirement for etiological function claims, though forward-looking role accounts may dissent.

  2. The trait must be demonstrated as a superior solution to the design problem compared to historically available alternatives, as motivated by optimality models in foraging theory. This is a hard requirement for optimality-model people, but applying it to one-off traits like the human chin where reachable forms are unenumerable quietly renders adaptationism inadmissible for unique historical events.

  3. Comparative methods must control for phylogenetic non-independence because shared ancestry prevents traits from counting as independent data points, illustrated by spurious correlations in primate brain size. This is a hard requirement for comparative tests, though single-case studies cannot meet it.

  4. The explanation must rule out developmental byproducts, allometry, or drift given effective population size, motivated by the spandrel objection regarding architectural constraints. This is a hard requirement for Gould/Lewontin pluralists, but Williams-style adaptationists treat it as a soft burden of proof for skeptics.

  5. The criteria must be able to license positive spandrel or exaptation claims rather than only vetoing adaptationist ones, since claiming "this is a byproduct" is itself a hypothesis needing support. This is a soft preference for pluralists, while strict adaptationists view non-adaptive claims as default nulls requiring no positive license.
