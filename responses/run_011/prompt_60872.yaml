  **CITY OF OAKHAVEN**
  **DEPARTMENT OF HOUSING STABILITY**
  **ANNUAL PERFORMANCE REVIEW (FORM HR-77B)**

  **EMPLOYEE INFORMATION**
  **Name:** Rent Stabilization Ordinance 14-B
  **Title:** Price Ceiling Mechanism / Tenant Protection Unit
  **Department:** Housing & Community Development
  **Date of Hire:** November 1983
  **Reports To:** City Council (Legislative Oversight Committee)
  **Supervisor Notes:** Employee reports to City Council, though no direct performance instructions have been issued since 1984. Job description has been expanded quietly via addendum every 3-5 years without corresponding budget increase.

  **SECTION 1: EMPLOYEE SELF-ASSESSMENT**
  Over the past fiscal year, Ordinance 14-B successfully maintained core operational stability for incumbent stakeholders. Retention rates among legacy tenants remain at 98%, effectively preventing displacement during periods of regional market volatility. While external critics focus on volumetric growth, this office prioritizes community cohesion and income redistribution without requiring visible tax levies. Alternative mechanisms, such as direct housing vouchers, were evaluated and rejected due to high administrative overhead, means-testing stigma, and reliance on general fund appropriations which lack political viability. 

  Furthermore, given the short-run inelasticity of local housing supply, market-rate adjustments would yield negligible new inventory while imposing immediate hardship on fixed-income residents. Efficiency metrics fail to account for the social value of stability. The ordinance operates within a second-best framework, mitigating distortions caused by existing zoning restrictions and regional employment concentration. When other market failures are already present, the theoretical benchmark of perfect competition is irrelevant. Goal: Maintain status quo.

  **SECTION 2: MANAGER EVALUATION**
  **Competency: Market Clearance**
  **Rating:** Unsatisfactory (0/5)
  **Comments:** Employee consistently prevents market clearing. Queue lengths continue to grow.
  **Competency: Tenant Retention**
  **Rating:** Exceeds Expectations (5/5)
  **Comments:** Tenants rarely leave covered units. Turnover is statistically negligible.
  **Competency: Inventory Growth**
  **Rating:** Unsatisfactory (0/5)
  **Comments:** No new units produced under this classification. Capital flight to unregulated jurisdictions observed.
  **Competency: Cost Efficiency**
  **Rating:** Meets Expectations (3/5)
  **Comments:** Low direct administrative cost, though indirect costs are disputed.
  **Overall Summary:** There is significant confusion regarding performance criteria. Employee scores maximum points on retention and zero on growth. It is unclear if the lack of growth is a performance failure or the primary objective of the position. Manager notes that if the price ceiling were set above the equilibrium rate, the employee's activities would be rendered a total no-op, suggesting the role requires market distortion to justify existence. The department is unable to determine if the employee is failing the market or if the market is failing the employee.

  **SECTION 3: 360-DEGREE PEER FEEDBACK**
  **Stakeholder A (Incumbent Tenant, 22-year residency):** "I raised two kids here. Without 14-B, I'd be priced out. It's the only thing keeping this neighborhood diverse."
  **Stakeholder B (Nurse, Waitlist Position #340):** "I've been looking for three years. There are no vacancies. I hear about units going to friends of landlords instead of the list."
  **Stakeholder C (Small Landlord, 2 Duplexes):** "I do my own roofs. When the boiler broke last year, I couldn't pass the cost. I'm not improving anything else until I can."
  **Stakeholder D (Developer):** "We build where the returns justify the risk. This zoning class is dead capital. We aren't bidding on these projects."
  **Stakeholder E (Housing Advocate):** "This review instrument is biased. It assumes the pre-control market was fair. You're measuring efficiency, but equity is the metric that matters."

  **SECTION 4: AREAS FOR IMPROVEMENT**
  1.  **Quality Slippage:** Reduce maintenance decay. Current incentives encourage deferred repairs due to capped revenue potential. Units are legally habitable but aesthetically degraded.
  2.  **Non-Price Rationing:** Eliminate informal side deals. Reports of key money, required furniture purchases, and parking fees used to bypass ceiling prices must cease.
  3.  **Unit Misallocation:** Address space consumption inefficiencies. Retired couples occupy four-bedroom units while families of five remain in one-bedroom units due to moving costs and fear of losing rent status.
  4.  **Labor Mobility Friction:** Mitigate lock-in effects. Tenants are refusing promotions or relocations to retain subsidized rates, reducing regional economic output.
  5.  **Vacancy Decontrol Loophole:** Clarify incentives at margins. Current rules encourage eviction upon vacancy to reset pricing, creating adversarial landlord-tenant relationships.
  6.  **Binding Constraint Verification:** Confirm ceiling remains below market clearing rate. If market rents fall below the ceiling, the ordinance is redundant and administrative resources are wasted.

  **SECTION 5: PROFESSIONAL DEVELOPMENT PLAN**
  **Goal 1:** Increase housing inventory by 15% while maintaining current rent levels for all incumbents.
  **Goal 2:** Eliminate waiting lists without reducing tenant retention rates.
  **Goal 3:** Improve unit quality scores while prohibiting cost pass-throughs.
  **Timeline:** Immediate.
  **Consequences:** Failure to meet these conflicting objectives may result in a Performance Improvement Plan (PIP), legislative revision, or complete termination of the ordinance (Repeal).

  **EMPLOYEE ACKNOWLEDGEMENT**
  I acknowledge receipt of this review. I understand that my continued employment depends on solving contradictions inherent in my job description.
  **Signature:** ___________________ **Date:** ___________

  ***

  **Note to TA:**
  I took liberties primarily on the empirical severity of maintenance decay; while theory predicts it, some studies show controlled units are maintained adequately to avoid code violations, though quality slippage is common. The "lock-in" effect is robust in literature, but the magnitude depends on labor market elasticity. I assumed supply is inelastic in the short run (standard micro) but elastic enough in the long run to deter development (contested in tight zoning markets where supply is inelastic regardless). The ethical defense (equity vs. efficiency) is defensible but relies on a utilitarian vs. Rawlsian split you'll need to unpack. I'm least sure about the "vacancy decontrol" incentive leading to evictions; it varies by specific legal wording. Confidence level: 85% on the econ mechanisms, 90% on the pedagogical utility.
