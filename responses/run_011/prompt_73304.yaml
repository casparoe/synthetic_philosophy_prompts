answer: |-
  ### The Scenario

  You are the project lead for a local council tasked with refurbishing a 1960s concrete bridge. The council's historical database contains records for 400 similar bridge refurbishments over the past twenty years. The data is sound, audited, and consistent: 65% of these projects exceeded their initial budget by more than 20%, primarily due to "unforeseen structural corrosion" discovered mid-work. You are required to forecast your budget overrun probability. You have commissioned a comprehensive, invasive structural survey using new sonic resonance imaging before setting the budget, identifying every corroded joint and costing their repair explicitly. The historical database, however, does not record the *type* of pre-work survey used for the previous 400 projects; it simply logs them all as "bridge refurbishments". You know your risk profile is fundamentally different from the aggregate, but the data cannot distinguish you from the unsurveyed projects that drove the failure rate.

  ### The Demonstration

  **The Outside-View Reasoner**
  This reasoner identifies the reference class as "council bridge refurbishments". They note the base rate: a 65% probability of >20% budget overrun. Acknowledging the new sonic survey, they attempt to adjust downwards. However, because the historical data lacks metadata on survey types, they have no empirical basis to quantify *how much* the survey reduces risk. Adhering to the principle of conservative estimation inherent in reference class forecasting (to avoid slipping back into optimism bias), they anchor on the 65% and apply a modest, subjective discount, concluding there is still a 45% chance of significant overrun. They treat the "unforeseen corrosion" as an inherent, probabilistic tax on the class of work.

  **The Inside-View Reasoner**
  This reasoner ignores the 65% statistic. They examine the specific survey findings: 14 corroded joints identified, repair cost £50,000. The contingency budget is £100,000. The mechanics of the bridge are now fully known; there are no "unforeseen" elements left to discover. They conclude the probability of overrun due to structural issues is near zero (barring external shocks like material price spikes, which are hedged). They forecast a <5% chance of overrun.

  **The Verdict**
  The project completes with no structural surprises. The Inside-View reasoner was calibrated correctly; the Outside-View reasoner was poorly calibrated, predicting a high risk that did not materialise.

  **The Structural Feature**
  The failure of the Outside View here stems from **Measurement Erasure**. The historical data aggregates two distinct risk profiles (surveyed vs. unsurveyed) but erases the variable that distinguishes them. Consequently, the base rate treats *epistemic risk* (unknowns that can be known) as *aleatory risk* (inherent randomness). The Outside View method forces you to accept the aggregate probability because it lacks the granularity to validate your mitigation. The Inside View succeeds because it recognises the risk was never random; it was merely unknown, and you have made it known.

  **Sensitivity Analysis**
  If you strip out the Measurement Erasure—meaning the historical database *did* record survey types—the Outside View wins immediately. The reasoner would isolate the subclass "projects with sonic surveys", find a base rate of 5% overrun, and anchor there. The gap exists solely because the data's resolution is too coarse to capture the decisive variable, yet too established to be ignored.

  ### The Counterattack

  A defender of the Outside View will argue: "Your reference class was wrong. The correct class is 'bridge refurbishments with invasive sonic surveys'."

  **Does it land?**
  No, not within the constraints of the method. Reference Class Forecasting requires a class large enough to yield statistical significance (usually N > 30-50). If only five previous projects used sonic surveys, the class is too small to generate a reliable base rate. The method explicitly dictates that if a narrow class is statistically noise, you must revert to the broader, robust class. By insisting you use the broader class, the defender admits the method cannot handle novel mitigations where the historical record hasn't yet categorised the innovation. They are relabelling the problem as "mis-specification" when it is actually "data granularity limits". You cannot specify a class that the data infrastructure does not support.

  ### The Shakiest Constraint

  The design strains most against your requirement that the reference class be **"genuinely the right one"**.

  A strict Bayesian or Outside View advocate would argue that if a variable (survey type) causally determines the outcome, any class that ignores it is *by definition* the wrong class, regardless of sample size. They would claim you should not use the base rate at all if you know it conflates distinct populations. My case relies on the pragmatic rule that "you must use the largest statistically valid class available". If you accept the theoretical stance that "a class ignoring key causals is invalid", then the Outside Viewer shouldn't have used the 65% figure at all, and the paradox dissolves.

  **What would change my mind:**
  If you argue that rational forecasting *always* allows for qualitative adjustment based on causal mechanisms, regardless of base rate data. If the Outside View permits a 100% adjustment discount because the mechanism (surveying) logically eliminates the risk source, then the Outside View converges with the Inside View. The case only holds if the Outside View method imposes a *constraint* on adjustment magnitude when empirical data for that adjustment is missing. If the method allows unlimited subjective adjustment, it ceases to be a check on bias and becomes the Inside View in disguise.
