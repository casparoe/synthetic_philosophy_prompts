answer: |-
  You have stumbled onto one of the most sophisticated problems in the philosophy of history and international relations. What you are describing is real, it is named, and your frustration is shared by professional historians.

  There isn't one single magic word, but there is a specific conceptual toolkit that describes exactly what you are seeing. The phenomenon you're identifying is best described as **Causal Selection across Levels of Analysis**, often framed within the debate of **Structure vs. Agency**.

  Here are the edges of the thing, the specific terms you need, and how to distinguish between a legitimate historical argument and a rhetorical dodge.

  ### 1. The Framework: "Levels of Analysis"
  In International Relations and political science, this is explicitly called **Levels of Analysis**. It was formalized by a scholar named Kenneth Waltz, but historians use it constantly. It breaks causation into three distinct "zoom levels":

  *   **First Image (Individual/Agency):** The decisions of specific leaders (Kaiser Wilhelm II, Berchtold), or the trigger event (Princip's shot). *Blame lies here.*
  *   **Second Image (State/Internal):** The domestic politics, nationalism, or specific government structures of the countries involved (German militarism, Austrian ethnic tensions). *Blame lies here.*
  *   **Third Image (System/Structure):** The alliance system, the balance of power, the security dilemma, imperialism. *Blame is diffused here; the war "happens."*

  **The Edge:** When someone argues Germany is to blame, they are arguing at the **First or Second Image**. When someone argues "the system made war inevitable," they are arguing at the **Third Image**.
  **The Trap:** The "dodge" occurs when an arguer treats these levels as mutually exclusive rather than complementary. A legitimate argument explains how the *System* (3rd) constrained the *Leaders* (1st), who then made a specific *Choice* (1st) within that system.

  ### 2. The Mechanism: "Causal Selection"
  In the philosophy of history, your observation is called **Causal Selection** (or Causal Privileging).

  Philosophers note that any event has infinite necessary conditions. For WWI to happen, you needed:
  1.  Princip to shoot the Archduke.
  2.  The gun to fire.
  3.  Oxygen to exist.
  4.  Germany to send the Blank Check.
  5.  Imperialism to exist in the 19th century.

  All of these are "causes" in a scientific sense. If you remove any of them, the war (as it happened) doesn't occur. **Causal Selection** is the act of picking *one* of these necessary conditions and labeling it "The Cause."

  **Why this matters for your paper:** When historians shift from the Blank Check to Imperialism, they aren't necessarily contradicting the evidence; they are engaging in **Causal Selection**. They are privileging a *background condition* over a *proximate trigger*.
  *   **Proximate Cause:** The spark (Sarajevo/Blank Check).
  *   **Ultimate Cause:** The fuel (Imperialism/Alliances).

  **The Edge:** A legitimate argument admits it is making a selection based on a specific question (e.g., "Who signed the order?" vs. "Why was Europe a powder keg?"). A dodge pretends that their selected level is the *only* valid level.

  ### 3. The Historical Context: "Intentionalism vs. Structuralism"
  You mentioned the German historian from the 1960s. That was **Fritz Fischer**, and the debate you are describing is known as the **Fischer Controversy**.

  *   **Fischer's Argument (Intentionalism):** He looked at German state archives and argued Germany had a "grasp for world power" (*Griff nach der Weltmacht*). He argued at the level of **Agency/Intent**. Germany *chose* war.
  *   **The Counter-Argument (Structuralism/Revisionism):** Other historians argued Fischer was ignoring the context. They claimed Germany was "encircled" by enemies and reacted defensively to a system that was spiraling out of control. They argued at the level of **Structure**.

  **The Edge:** This is the specific historiographical name for your observation. If you use these terms in your paper, your teacher will know you've done deep research.
  *   **Intentionalist:** Blame is assignable because actors had choices.
  *   **Structuralist:** Blame is diffuse because the system constrained choices.

  ### 4. How to Tell the Difference: Legitimate Analysis vs. The Dodge
  You asked where to draw the line between a legitimate shift in scale and a rhetorical dodge. Here is the test:

  **It is a Legitimate Argument if:**
  *   **It connects the levels.** Example: "The alliance system (Structure) created a security dilemma that made German leaders (Agency) feel they had to support Austria, leading to the Blank Check (Event)."
  *   **It acknowledges overdetermination.** This is a key term: **Causal Overdetermination**. This means there were *enough* causes that the war might have happened even if one specific event changed. A legitimate historian admits, "Even without the Blank Check, the system was so volatile war was likely, *but* the Blank Check made it happen *then* and *that way*."
  *   **It defines the scope.** "If we are asking about legal guilt, we look at the Blank Check. If we are asking about historical inevitability, we look at Imperialism."

  **It is a Dodge (Fallacy) if:**
  *   **It uses structure to erase agency.** Example: "Everyone was imperialist, so Germany isn't responsible." This is a fallacy of **Relative Guilt**. Just because everyone had a gun doesn't mean everyone pulled the trigger.
  *   **It uses agency to ignore context.** Example: "It was just one guy in Sarajevo, so politics didn't matter." This ignores that the shot only mattered because of the political context.
  *   **It shifts levels to avoid a conclusion.** If you prove Germany pulled the trigger, and the opponent suddenly says "But guns wouldn't exist without metallurgy," they are committing a **Red Herring** by shifting to a level of abstraction where blame is impossible.

  ### Recommendation for Your Paper
  Since your argument depends on this, do not try to solve "Who started WWI." Instead, make your argument **about the argument.**

  **Thesis Idea:**
  *"While the Versailles Treaty sought to assign legal guilt to Germany, the historical debate over WWI's origins is less about conflicting evidence and more about conflicting **Levels of Analysis**. Historians who prioritize **Agency (Intentionalism)** locate blame in Berlin's specific decisions, while those who prioritize **Structure (Structuralism)** locate blame in the European alliance system. Therefore, 'responsibility' is not a fixed fact to be discovered, but a conclusion determined by which **Causal Selection** a historian privileges."*

  **Key Vocabulary to use:**
  1.  **Levels of Analysis** (The zoom levels).
  2.  **Structure vs. Agency** (The philosophical tug-of-war).
  3.  **Proximate vs. Ultimate Cause** (The trigger vs. the fuel).
  4.  **Causal Overdetermination** (Why there were too many causes to pick just one).
  5.  **The Fischer Controversy** (The specific 1960s debate you mentioned).

  You have identified that history isn't just about "what happened," but about "how we choose to explain what happened." That is a university-level insight. Use these terms to map the battlefield of the argument, rather than just fighting on it.
