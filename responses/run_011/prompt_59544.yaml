  Validation requires an independent ground truth, and by defining rainfall amounts solely based on the device's output, you removed the ability to detect error. If the instrument suffers from systematic bias—common in this type of sensor due to wind exposure, leveling shifts, or mechanical wear—your confirmations simply reinforce that bias rather than proving accuracy. The second argument confuses precision with accuracy, as a device can reliably report a number that does not match physical reality. The initial volume test verified the mechanism at time zero but cannot account for environmental degradation or drift over time, while the system self-check only confirms connectivity, not measurement integrity. For flood planning, systematic error is critical because consistent undercatch or overcatch skews hydrological models, making consistency without accuracy potentially misleading.

