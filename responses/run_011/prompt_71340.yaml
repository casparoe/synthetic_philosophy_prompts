      *   *Check:* Jackson's documents. Is a document "force"? In Pascal's sense, physical evidence is of the body. Persuasion is of the mind. Jackson feared witnesses (fallible memory) vs documents (hard fact). Pascal would say hard fact moves the body (coercion of logic?) but assent is grace/mind. Actually, Pascal distinguishes force (coercion) from reason. Documents are reason/evidence. But Jackson treated them as irrefutable *weight*. Let's frame it as: Jackson tried to bridge the orders. Pascal says the gap is infinite. The verdict was bodily compliance; the mind remained separate.
