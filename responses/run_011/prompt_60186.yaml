  They place the life of one before me,
  To purchase breath for the threatened five.
  I grant the outcome would be far worse.
  But ask what action I may.
  I will not stain my own clean hand.
  The moral law prohibits the trade.

  No exception exists within the law,
  To sacrifice the innocent one.
  To keep from blood my own clean hand,
  To spare the bodies of the living five.
  I know the boundaries of what I may.
  Though the total loss is surely worse.

  It is impersonally worse, I say.
  But I am bound by strict moral law.
  No permission says that I may.
  To execute the single one.
  In order to preserve the five.
  I must withdraw my active hand.

  I fold my fingers, still my hand.
  I acknowledge that the outcome's worse.
  The bodies stack to number five.
  Yet I am subject to the law.
  I cannot murder the quiet one.
  However much I wish I may.

  I watch the lights go out in five.
  I do not move a guiding hand.
  I will not trade the life of one.
  It falls outside of what I may.
  The constraint is not the cost, but law.
  And yes, the result remains worse.

  I cannot see what else I may.
  When counted heads reveal the five.
  I stand obedient to the law.
  I cannot deny the world is worse.
  But I am responsible for this hand.
  Not for the death of that one.

  I let the five die by no hand of mine,
  Upholding the law against the death of one.
  Permissibility may not track the worse.
