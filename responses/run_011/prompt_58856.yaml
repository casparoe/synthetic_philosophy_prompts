answer: |-
  # Framing Document: Desiderata for Substantive Computationalism

  To move beyond the stalemate between "the brain is obviously a computer" and "computation is just a description we impose," we require an account of physical computation that satisfies the following conditions. Below, I have processed the eight candidate requirements you supplied. I have classified each as **Genuine** (necessary for substance), **Camp-Prejudice** (specific metaphysical commitments masquerading as neutrality), or **Empty** (redundant or incoherent). I have also marked whether they are **Non-Negotiable** (the workshop fails without them) or **Negotiable** (open for debate), and whether they constrain the **Notion** (metaphysics of computation) or the **Use** (epistemic/explanatory utility).

  ### 1. The Non-Triviality Constraint
  *   **Requirement:** There must be a specifiable class of physical systems that do not compute specific functions, such that the claim "the brain computes" excludes the claim "the brick computes."
  *   **Motivation:** If every physical system implements every computation (pancomputationalism), the thesis is true but vacuous, offering no leverage for prediction or explanation.
  *   **Classification:** **Genuine.** **Non-Negotiable.** **Constraint on Notion.**
  *   **Comment:** This is the primary gatekeeper. It eliminates the deflationary view immediately. Without this, we are merely debating vocabulary.

  ### 2. The Mind-Independence Constraint
  *   **Requirement:** Whether a system computes a function must not depend solely on an observer's choice of description or interpretive scheme.
  *   **Motivation:** We seek a fact about the causal structure of the brain, not a fact about the convenience of our models; otherwise, AI safety risks become risks about our paperwork, not the system.
  *   **Classification:** **Genuine.** **Non-Negotiable.** **Constraint on Notion.**
  *   **Comment:** This is the realist core. However, see the "Tension Analysis" below regarding how strictly this can be held alongside causal constraints.

  ### 3. The Counterfactual Robustness Constraint
  *   **Requirement:** The mapping between physical states and computational states must hold under intervention; the system must produce the right output for the right input across relevant possible scenarios, not just in its actual history.
  *   **Motivation:** A system that accidentally traces a calculation once (e.g., a rock warming in the sun) does not compute; a computer must be disposed to track the function even if conditions vary slightly.
  *   **Classification:** **Genuine.** **Non-Negotiable.** **Constraint on Notion.**
  *   **Comment:** This is the workhorse requirement. It kills static isomorphism accounts. It demands a causal mechanism, not just a pattern match.

  ### 4. The Gradability Constraint
  *   **Requirement:** The account must allow for a system to implement a computation to a degree, rather than as a binary yes/no fact.
  *   **Motivation:** We need to assess partial uploads, degraded neural tissue, or approximate simulations where the implementation is imperfect but functionally relevant.
  *   **Classification:** **Camp-Prejudice.** **Negotiable.** **Constraint on Use.**
  *   **Comment:** This reflects the AI Safety/Functionalist commitment to vagueness. Classical computationalism is typically binary (a machine either runs the program or it doesn't). Enforcing this rules out strict digital mechanistic views. It should be treated as a specific theoretical goal, not a neutral precondition.

  ### 5. The Empirical Assessability Constraint
  *   **Requirement:** There must be conceivable experimental evidence that could count against the hypothesis that a specific system runs a specific computation.
  *   **Motivation:** If no observation could falsify the claim, it belongs to metaphysics, not the interdisciplinary science we intend to practice here.
  *   **Classification:** **Genuine.** **Non-Negotiable.** **Constraint on Use.**
  *   **Comment:** This ensures the discussion remains tethered to the neuroscientists' domain.

  ### 6. The Description/Process Distinction
  *   **Requirement:** The account must distinguish between a system that is computing and a system that is merely conveniently described as computing.
  *   **Motivation:** We need to separate ontological claims from pragmatic modeling choices.
  *   **Classification:** **Empty.** **N/A.** **N/A.**
  *   **Comment:** This is redundant. It is fully covered by the conjunction of (2) Mind-Independence and (8) Explanatory Power. It adds no new filtering power.

  ### 7. The Boundary Constraint
  *   **Requirement:** The account must provide criteria for determining where the computing system ends and the environment begins (e.g., neuron vs. skull vs. brain-plus-rig).
  *   **Motivation:** Causal interventions require a system boundary; without one, we cannot define the inputs and outputs required for (3) Counterfactual Robustness.
  *   **Classification:** **Genuine.** **Non-Negotiable.** **Constraint on Notion.**
  *   **Comment:** This is often overlooked but critical. You cannot test counterfactuals without defining the system being intervened upon.

  ### 8. The Explanatory Power Constraint
  *   **Requirement:** Attributing computation to the system must yield explanatory or predictive leverage that is not available from a lower-level physical description alone.
  *   **Motivation:** If the computational description does no work, we should dispense with it in favor of pure physics or physiology.
  *   **Classification:** **Genuine.** **Non-Negotiable.** **Constraint on Use.**
  *   **Comment:** This ensures the computational level is not epiphenomenal.

  ***

  ### Tension Analysis: The Unsatisfiability Hypothesis

  You suspected that (2) Mind-Independence, (3) Counterfactual Robustness, and (7) Boundary Constraint are jointly unstable. **This suspicion is correct.**

  Here is the conflict: To satisfy (3) Counterfactual Robustness, you must define interventions. To define interventions, you must carve the world into variables and systems (7) Boundary Constraint. However, in complex biological systems, there is no unique, physics-only way to carve these boundaries; the "correct" boundary depends on the granularity and interests of the modeler (e.g., is the neurotransmitter in the cleft part of the pre-synaptic neuron or the post-synaptic one?). If the boundary is interest-relative, then the counterfactuals are interest-relative. If the counterfactuals are interest-relative, then (2) Mind-Independence is violated, because whether the system computes depends on the observer's choice of boundary.

  **What has to give:**
  Strict **Mind-Independence (2)** must be relaxed. We cannot demand that computation be a "god's eye" ontological fact entirely independent of descriptive choices. Instead, we must settle for **Intersubjective Stability**: the computational description must remain robust across all *reasonable* scientific partitions of the system, even if not unique.

  **What is lost:**
  We lose the ability to say the brain is a computer in the same hard, mind-independent way that a mountain is a rock. We accept that "computation" is a relational property between a physical structure and a causal model, provided that model is not arbitrary. This concedes ground to the philosophers who worry about the "imposition" of formal descriptions, but saves the concept from collapsing into pure subjectivity.

  **The Knockout Requirement:**
  The single requirement that does the most work in knocking out otherwise attractive accounts is **(3) Counterfactual Robustness**.
  *   It kills the **Deflationary View** (because rocks don't support the right counterfactuals).
  *   It kills **Static Mapping Views** (because a history match isn't enough).
  *   It pressures the **Mechanistic View** (because mechanisms must be defined by their counterfactual support, not just their structure).
  *   It is the primary filter that turns "pattern" into "process."

  ***

  ### Scorecard: Main Contenders Against the Desiderata

  **1. Mechanistic Accounts (Rule-governed manipulation by components)**
  *   **Performance:** Strong on (1) Non-Triviality, (3) Counterfactuals, and (8) Explanation.
  *   **Weakness:** Struggles with (7) Boundaries. Mechanisms are often defined by their function, leading to circularity when defining the boundary. Also struggles with (4) Gradability (mechanisms usually break rather than degrade).
  *   **Verdict:** The strongest contender for neuroscience, provided we relax (2) Mind-Independence to allow for functional boundaries.

  **2. Mapping/Counterfactual Accounts (Isomorphism + Causal Constraints)**
  *   **Performance:** Excellent on (3) Counterfactuals and (1) Non-Triviality.
  *   **Weakness:** Highly vulnerable on (2) Mind-Independence. The choice of mapping is often where the "interpretation" sneaks in. If the mapping is not constrained by mechanism, it risks triviality again.
  *   **Verdict:** Viable only if the mapping is constrained by the physical causal structure (merging it with Mechanism).

  **3. Semantic/Intentional Accounts (Computation requires content)**
  *   **Performance:** Excellent on (8) Explanation (content explains behavior).
  *   **Weakness:** Fails (5) Empirical Assessability. We have no agreed-upon experiment to measure "semantic content" independent of behavior. Also threatens (2) Mind-Independence if content is observer-relative.
  *   **Verdict:** Too metaphysically heavy for this workshop. It pushes the hard problem of mind into the definition of computation.

  **4. Deflationary Views (Everything computes / Question is bad)**
  *   **Performance:** Fails (1) Non-Triviality immediately. Fails (8) Explanation.
  *   **Verdict:** Ruled out by the desiderata. This view is incompatible with the goal of the workshop.

  ***

  ### Closing Assessment: Where the List is Likely Wrong

  **1. The Sacrifice:**
  If I had to trade one requirement to keep the rest consistent, I would sacrifice **(4) Gradability**.
  *   **Reasoning:** Computation is fundamentally discrete (states, transitions). While *performance* degrades, *implementation* is typically binary. Insisting on gradability forces a fuzzy metaphysics onto a precise formal notion. It is better to say a degraded brain implements a *different, simpler* computation than to say it *partially* implements a complex one. Dropping (4) resolves significant tension with (1) and (3).

  **2. The Unsatisfiability Claim:**
  I would be convinced the joint-unsatisfiability claim fails if someone could demonstrate a **physics-only boundary criterion**.
  *   **Argument needed:** If you can show that biological systems possess objective, observer-independent "causal joints" (e.g., via Markov blankets or thermodynamic boundaries) that uniquely define the system for the purpose of counterfactuals, then (2) Mind-Independence can be retained alongside (3) and (7). Currently, this remains an open empirical question, not a settled fact.

  **3. The Idle Requirement:**
  **(6) The Description/Process Distinction** should be struck.
  *   **Reasoning:** It does no independent work. Any account that satisfies (2) Mind-Independence and (8) Explanatory Power automatically satisfies (6). Keeping it invites confusion by suggesting there is a third category between "real computation" and "useful description," when the desiderata imply there are only two.

  **Final Note to Participants:**
  We are proceeding with the understanding that "computation" is not a property found in physics textbooks, but a causal-functional property that must be robust enough to support intervention. We are not asking if the brain *is* a computer in the sense of a laptop; we are asking if the brain supports counterfactuals in a way that makes the computational description non-trivial, stable, and explanatory. If your theory of brain function cannot survive an intervention, it is not a computational theory.
