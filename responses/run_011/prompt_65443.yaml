prompt: |-
  I'm an engineer at a ~250-person company and I sit on our architecture review board — three of us, appointed by the CTO, no term limits, no elections, and we can veto any technical decision a team makes. Basically every team resents us and honestly I think they're half right. This is the unelected-judges-overruling-the-legislature problem in miniature and I want to figure out what I actually think by listing my gut calls on cases:

  - A team votes 14-0 to build a new service in Rust when everything else here is Python and Go. We block it. Fine, I'd defend that.
  - A team votes to change a schema in a way that breaks another team's consumer without asking them. We block. Fine.
  - A team votes on something purely internal, nobody else affected, and we block it because the design is over-clever and two of us wouldn't have done it that way. Not fine — even though I think we were technically right about the engineering.
  - We block a design because the team that will inherit the on-call for it didn't get a vote and can't yet exist. Fine.
  - We block something because it violates a security policy every team signed off on four years ago. Fine.
  - We block something because it violates the *spirit* of that same policy in a case the text doesn't cover. Not fine. Feels like legislating from the bench.
  - We block something because of a risk the policy's authors plainly never anticipated (prompt injection, whatever). Fine.

  Those last two are the pair I can't reconcile — same move as far as I can tell, opposite verdicts from me. And the one I keep flip-flopping on: we vetoed a feature every affected team wanted unanimously, because it would leak user data in a way no user was ever asked about, and users have no seat at any table here.

  Is there a principle that gets all of these, or close? I want it stated precisely, with which clause is doing the work in each case, what it says about the flip-flop one, and what it'd say about a case I haven't listed — like us vetoing a proposal to let teams self-certify, which would end the board. Be honest about which of my verdicts it has to overturn, and if the simple principle and the one that saves everything come apart, tell me which to take.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Context:**
      *   **User:** Engineer at a ~250-person company. Member of a 3-person Architecture Review Board (ARB).
      *   **Context:** The ARB has veto power over technical decisions. No term limits, no elections. Perceived as "unelected judges." Teams resent them.
      *   **Problem:** The user wants to reconcile their conflicting gut feelings on specific cases to find a governing principle for the ARB's authority.
      *   **Specific Cases:**
          1.  Rust vs. Python/Go (Blocked: Fine).
          2.  Breaking Schema without consent (Blocked: Fine).
          3.  Internal Over-cleverness (Blocked: Not Fine).
          4.  On-call burden on non-voters (Blocked: Fine).
          5.  Violating Explicit Security Policy (Blocked: Fine).
          6.  Violating *Spirit* of Security Policy (Blocked: Not Fine).
          7.  Unanticipated Risk (Prompt Injection) (Blocked: Fine).
          8.  **The Flip-Flop:** Leaking User Data (Blocked: Fine/Unsure). Users have no seat.
          9.  **The Hypothetical:** Vetoing Self-Certification (ending the board).
      *   **Goal:** A precise principle that covers most cases, explains the flip-flop, addresses the hypothetical, and admits where verdicts must change if the principle conflicts with intuition.

  2.  **Deconstruct the Cases & Intuitions:**
      *   *Case 1 (Rust):* Standardization/Operational Cost. Why is this okay? Because heterogeneity increases cognitive load/support burden for the *org*.
      *   *Case 2 (Schema):* Externalities. One team harming another without consent.
      *   *Case 3 (Internal Cleverness):* Taste/Preference. Why is this *not* okay? Because it's purely internal, no negative externality, just "we wouldn't do it that way."
      *   *Case 4 (On-call):* Externalities/Burden. Dumping work on others.
      *   *Case 5 (Explicit Policy):* Rule of Law. Signed contract.
      *   *Case 6 (Spirit of Policy):* Judicial Overreach. Why *not* okay? Because it's ambiguous, retroactive, and undermines trust in the written rule.
      *   *Case 7 (Unanticipated Risk):* Fiduciary/Safety Duty. Why okay? Because the *intent* of security is safety, even if the vector is new. This conflicts with Case 6.
      *   *Case 8 (User Data):* Fiduciary Duty to Third Parties. Users can't vote. The company holds their data in trust.
      *   *Case 9 (Self-Certification):* Existential. If the board votes itself out of existence, is that allowed?

  3.  **Identify the Core Tension:**
      *   The tension is between **Procedural Legitimacy** (what was agreed upon, who voted) and **Substantive Harm** (actual negative outcomes, risks, externalities).
      *   Case 6 vs. Case 7 is the crux. Case 6 says "stick to the text." Case 7 says "prevent the harm even if not in text."
      *   *Resolution:* The distinction isn't "Text vs. Spirit." It's "Arbitrary Interpretation vs. Fundamental Duty."
      *   Case 6 feels like arbitrariness (spirit is vague). Case 7 feels like fundamental duty (security is about preventing breaches, regardless of vector).

  4.  **Drafting the Principle:**
      *   *Attempt 1:* "Prevent Harm." Too vague. Case 3 (clever code) might be "harmful" to maintainability, but user said "Not Fine."
      *   *Attempt 2:* "Prevent Negative Externalities." Good for 2, 4. Covers 1 (operational burden is an externality). Covers 5 (policy violation is a breach of contract). Covers 7 (risk is potential externality). Struggles with 6 (why is spirit different from risk?). Struggles with 8 (users are external stakeholders).
      *   *Attempt 3:* "The Principle of Consent and Fiduciary Duty."
          *   You can veto if:
              1.  There is a non-consensual negative externality on another internal party.
              2.  There is a violation of an explicit, agreed-upon constraint (Policy).
              3.  There is a violation of a fiduciary duty to a stakeholder who *cannot* consent (Users, Company Survival).
          *   You cannot veto if:
              1.  It's purely internal preference/taste.
              2.  It relies on ambiguous interpretation of old rules (unless it triggers #3).

      *   *Refining the Principle:* Let's call it **The Principle of Non-Consensual Harm and Fiduciary Necessity.**
      *   *Clause A (Internal Externalities):* Veto allowed if a team imposes cost/risk on another team without their consent. (Cases 1, 2, 4).
      *   *Clause B (Explicit Constraints):* Veto allowed if violating a written rule agreed to by the org. (Case 5).
      *   *Clause C (Fiduciary Duty):* Veto allowed if the decision harms a stakeholder who has no representation (Users, Company Longevity) regarding fundamental safety/viability, even if not explicitly codified. (Case 7, Case 8).
      *   *Limitation (The Guardrail):* Veto *not* allowed based on subjective preference or ambiguous "spirit" unless it triggers Clause C. (Cases 3, 6).

  5.  **Testing the Principle against the Cases:**
      *   1 (Rust): Clause A. Heterogeneity imposes support cost on Platform/Infra teams (non-consensual). -> **Veto OK.**
      *   2 (Schema): Clause A. Breaking consumer without consent. -> **Veto OK.**
      *   3 (Cleverness): No Clause. Purely internal. Subjective. -> **Veto NOT OK.** (Matches user).
      *   4 (On-call): Clause A. Burden on non-voting team. -> **Veto OK.**
      *   5 (Explicit Policy): Clause B. Violation of agreement. -> **Veto OK.**
      *   6 (Spirit of Policy): Limitation. "Spirit" is ambiguous/subjective. Unless it triggers Clause C (Fundamental Safety). User says "Not Fine." -> **Veto NOT OK.** (Matches user).
      *   7 (Prompt Injection): Clause C. Fundamental safety risk, even if uncodified. -> **Veto OK.** (Matches user).
      *   *Wait, 6 vs 7 distinction:* Why is "Spirit" bad but "Unanticipated Risk" good?
          *   *Analysis:* "Spirit" implies interpreting old intent to cover new ground arbitrarily. "Unanticipated Risk" implies a *new fact pattern* that violates the *goal* of security (protect data/system).
          *   *Refinement:* Clause C needs to be about **Existential or Fundamental Safety**, not just "we think this is risky." Prompt injection threatens system integrity. "Spirit of policy" might just be "we didn't intend for you to use this loop hole, even if it's safe."
          *   *Adjustment:* Distinguish between *loophole closing* (bad, Case 6) and *threat mitigation* (good, Case 7).
      *   8 (User Data): Clause C. Users cannot consent. Company has fiduciary duty. -> **Veto OK.** (Resolves flip-flop).
      *   9 (Self-Certification): This ends the board.
          *   If the board vetoes this, they are preserving their own power. This violates the "Fiduciary" aspect if the board itself is the bottleneck/harm.
          *   However, if self-certification leads to Clause A/B/C violations going unchecked, the board must exist.
          *   *Principle Verdict:* The board cannot veto its own dissolution *unless* dissolution creates an unmitigated risk of Clause A/B/C violations that no other process catches. But generally, an ARB shouldn't vote to preserve its own existence against the will of the engineering org.
          *   *Hard Truth:* If the principle is about "Non-consensual Harm," the Board is an imposed structure. If the org wants to remove it, that's a "Legislature" decision. The Board is the "Judiciary." The Judiciary cannot veto the Legislature dissolving the Judiciary.
          *   *Verdict:* **Veto NOT OK.** (This overturns the Board's self-preservation instinct).

  6.  **Addressing the 6 vs 7 Conflict (The "Spirit" vs "Risk" dilemma):**
      *   This is the hardest part.
      *   Case 6: "Spirit of policy." Example: Policy says "No PII in logs." Team puts hashed PII in logs. Hashing isn't PII technically. Board says "Spirit says no PII." -> User says Not Fine.
      *   Case 7: "Unanticipated Risk." Example: Policy says "Validate Input." Team validates input but misses prompt injection vector. Board says "This breaks security." -> User says Fine.
      *   *Distinction:* Case 6 is about *compliance semantics*. Case 7 is about *outcome safety*.
      *   *Principle Wording:* "Outcomes over Semantics." You can veto for actual risk (7), not for semantic violations of intent (6).

  7.  **Finalizing the Principle:**
      *   Name: **The Principle of Non-Consensual Externality and Fiduciary Safety.**
      *   Core: Authority is limited to preventing harm that the affected parties cannot prevent themselves.
      *   Three Pillars:
          1.  **Internal Externalities:** Cost/Risk imposed on other teams without consent.
          2.  **Explicit Contracts:** Violation of written, agreed-upon rules.
          3.  **Uncodified Fiduciary Duties:** Harm to unrepresented stakeholders (Users, Company Viability) regarding safety/security.
      *   Constraint: **No Paternalism on Taste.** Cannot veto based on preference or ambiguous "spirit" unless it triggers Pillar 3.

  8.  **Addressing the Flip-Flop (User Data):**
      *   Under this principle, Users are "Unrepresented Stakeholders." They cannot vote. The Company holds data in trust. Leaking it violates Fiduciary Safety.
      *   *Verdict:* Veto is **Fine/Required.** The fact that teams want it is irrelevant (like tenants voting to burn down the building).

  9.  **Addressing the Self-Certification (Board Dissolution):**
      *   This is the "Judge vs Legislature" problem.
      *   If the Board vetoes this, they are acting in self-interest, not preventing externality (unless the *absence* of the board causes externalities).
      *   *Honest Truth:* The Board cannot veto the process that creates the Board. That is a meta-decision belonging to the CTO/Eng Org.
      *   *Verdict:* **Veto NOT OK.** (Must overturn the instinct to keep power).

  10. **Refining the Output:**
      *   State the principle clearly.
      *   Walk through the cases (1-8).
      *   Explain the 6 vs 7 distinction (Semantics vs. Outcomes).
      *   Resolve the User Data flip-flop.
      *   Address the Self-Certification hypothetical.
      *   Provide the "Hard Truth" about which verdicts must change.

  11. **Self-Correction/Review during drafting:**
      *   *Check:* Did I explain Case 1 (Rust) well? Yes, operational burden is an externality on Infra/Support.
      *   *Check:* Did I distinguish 6 and 7? Yes, "Spirit" = Semantic/Intent. "Risk" = Outcome/Safety.
      *   *Check:* Is the User Data resolution convincing? Yes, fiduciary duty transcends internal consensus.
      *   *Check:* Is the Self-Certification answer honest? Yes, it requires the Board to accept it can be fired.

  12. **Final Polish:** Ensure tone is empathetic but rigorous. Acknowledge the political reality (250 people is the "Dunbar number" transition zone where process becomes necessary but resented).

  *(Self-Correction on Case 6 vs 7)*: I need to be careful. If "Spirit" means "The goal of the policy," and "Risk" means "The goal of the policy," why are they different?
  *   *Nuance:* Case 6 implies the text *allows* it, but the Board feels it's "against the vibe." Case 7 implies the text *doesn't cover it*, but the *threat* is real.
  *   *Better Distinction:* **Predictable Harm vs. Interpretive Discretion.**
      *   Case 7: Prompt injection causes a breach. That is objective harm.
      *   Case 6: "Spirit" is subjective. Did it actually cause harm? Or does it just feel wrong?
      *   *Principle Adjustment:* Focus on **Objective Risk** vs. **Subjective Interpretation**.

  *(Final Plan)*:
  1. Define Principle: **The Externality and Fiduciary Standard.**
  2. Break down the 3 clauses.
  3. Apply to cases.
  4. Resolve 6 vs 7 via "Objective Harm vs. Subjective Intent."
  5. Resolve User Data via "Fiduciary to Unrepresented."
  6. Resolve Self-Certification via "Cannot Veto Meta-Governance."
  7. Conclude with the "Hard Truth."

