  Your brother-in-law is describing **Harsanyi's Social Aggregation Theorem**. It proves that if you want to aggregate individual preferences into a group preference while satisfying basic rationality and fairness axioms, you must maximize the sum (or average) of individual utilities.

  Here is the ranking of conditions by how painful it would be to drop them, from most critical to least.

  **1. (b) Anonymity (Equal Weight)**
  This is the definition of a co-op; dropping it means accepting that some households have more political power than others, turning your democracy into a hierarchy. Without this, the theorem still holds but allows for weighted voting, which defeats the purpose of your governance structure.

  **2. (a) Pareto Indifference (Unanimity)**
  If you drop this, the group can officially prefer an option that every single household dislikes, rendering the voting system illegitimate and disconnected from reality. This condition is the minimal link between individual will and group action; breaking it makes the system irrational.

  **3. (c) Rescaling (Cardinal Utility)**
  This condition is quietly doing all the mathematical work; it assumes your scores measure "intensity of feeling" rather than just rankings, which is the only thing that allows the theorem to bypass Arrow's Impossibility Theorem. If you drop this, averaging scores becomes mathematically meaningless (like averaging phone numbers), forcing you to abandon the scoring method entirely for a ranking system.

  **4. (e) Common Priors (Same Odds)**
  This only matters for decisions involving risk and uncertainty, like roof failures, and is irrelevant for certain choices like paint colors. Dropping it limits the theorem's application to risky scenarios but doesn't break the fairness of the voting system for everyday decisions.

  **5. (d) Continuity (Smoothness)**
  This is a technical mathematical requirement to prevent "cliff edges," but in practice, discrete voting thresholds are manageable and expected. Losing this makes the math uglier but doesn't fundamentally corrupt the fairness or logic of the group's decisions.
