      *   *Self-Correction on Objection 2:* If both choose (iii), does the larger rival still win on weight? The prompt says "If neither commits... larger rival wins." If (iii) counts as commitment, then the "neither commits" branch is avoided. The objection claims (iii) is effectively "no commitment." I need to argue that (iii) *is* commitment because it alters the payoff matrix for the adopter, making them safe regardless of your decision.
      *   *Self-Correction on Objection 3:* This is the "Madman Theory" objection. I need to distinguish between *deterrence* (where irrationality helps) and *coordination* (where reliability helps). Adopters want a partner, not a kamikaze pilot.

