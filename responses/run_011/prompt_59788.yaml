answer: |-
  The standard Schellingan view of commitment holds that bargaining power derives from visibly destroying options. By burning the bridge, you convince the opponent you cannot retreat, forcing them to yield. This intuition is correct regarding the *formation of belief*, but it is frequently misapplied regarding the *mechanism*. Commitment power resides not in the physical impossibility of retreat, but in the credibility of the cost associated with it. In your specific coordination game, option (iii)—a revocable commitment priced with a substantial penalty—strictly dominates option (i), irreversible commitment. The rationale is that (iii) purchases the same belief update as (i) without destroying the underlying option value, provided the penalty is calibrated correctly.

  Adopters in this consortium do not value your immobility for its own sake; they value safety against abandonment. They fear sinking costs into a specification you might later abandon. Irreversible commitment (i) mitigates this risk by making abandonment impossible. Priced commitment (iii) mitigates this risk by making abandonment expensive enough to compensate them for their switching costs. From the adopter's perspective, the expected utility of a firm that *cannot* leave is roughly equivalent to a firm that *won't* leave because the penalty exceeds the benefit of deviation. However, from your firm's perspective, the payoff structures diverge sharply. In scenario (i), if market conditions shift catastrophically, you are bound to a losing strategy with no exit. In scenario (iii), you retain the option to pivot should the technology landscape change, paying the penalty only in states of the world where pivoting is value-maximizing. You have bought the signal of stability without forfeiting the asset of flexibility. Since the rival faces the same logic, the equilibrium shifts from a game of "who is more suicidal" to "who offers better risk insurance."

  We must confront four specific objections to this pricing mechanism.

  First, critics argue that a revocable commitment is cheap talk because the opponent can compute that you will pay the exit price if deviation becomes profitable. This confuses *revocability* with *costlessness*. A signal is not "cheap" simply because it is contingent. If the liquidated damages are set higher than the maximum conceivable gain from abandoning the standard, rational choice dictates you will not abandon it. The commitment is binding in expectation. The opponent knows you *could* pay the penalty, but also knows you *won't* want to. The credibility comes from the financial disincentive, not the physical constraint.

  Second, it is objected that if both firms choose (iii), we have merely relabelled the branch where nobody commits, allowing the larger rival to win on political weight. This assumes adopters view priced commitments as equivalent to silence. They do not. Silence offers no recourse; a priced commitment offers insurance. If both firms offer priced commitments, the consortium does not stall; it compares the terms. The game becomes a competition on the robustness of the guarantee rather than a stalemate of mutual irreversibility. While the larger rival has advantages, (iii) prevents the mutual destruction scenario of dual irreversibility while still offering adopters a safety net superior to silence.

  Third, there is the claim that credibility in high-stakes bargaining often depends on the real possibility of losing control, so this argument softens all deterrent threats. This objection conflates *coordination games* with *deterrence games*. In deterrence (e.g., nuclear strategy), you want the opponent to believe you might act irrationally out of loss of control. In standards adoption, you want partners to believe you will act *reliably* out of self-interest. Adopters do not want a kamikaze partner; they want a solvent one. Irreversibility signals stability only insofar as it implies you won't leave. But if irreversibility threatens your solvency (via the "both commit" stall scenario), it becomes a negative signal. Pricing the option preserves the rationality that adopters rely upon for long-term planning.

  Fourth, publishing exit terms selects for counterparties who plan to use them. This is adverse selection, but it is manageable. You price the liquidated damages to cover the expected value of this risk. If a counterparty plans to trigger the penalty, they are essentially buying a put option from you. As long as the premium (the value you gain from winning the standard) exceeds the expected payout, this is profitable. It is preferable to the alternative: being locked into a standard you no longer support while competitors pivot around you.

  For this argument to hold empirically, two claims about adopter behavior must be true. First, adopters must value financial compensation for switching costs as a substitute for technical stability. If their internal compliance rules forbid relying on any specification with an exit clause, regardless of the penalty, (iii) fails. Second, adopters must believe you have the liquidity to pay the penalty. If the market perceives the penalty as unfunded, (iii) collapses back into cheap talk.

  The conclusion strengthens if the consortium's decision is a rolling process rather than a single date. Irreversible commitment (i) is toxic in evolving markets; it prevents adaptation to technical feedback. A priced commitment (iii) allows you to adjust the roadmap annually, paying the penalty only if the adjustment harms adopters. In a dynamic environment, option value is highest, making the destruction of options in (i) disproportionately costly.

  However, your colleague is right on one critical front: internal discipline. The thesis assumes rational execution. If your organization lacks the discipline to adhere to the roadmap without external force, the irreversibility of (i) serves as a forcing function that (iii) lacks. Furthermore, if the market doubts your solvency, only the physical impossibility of (i) convinces them. If you cannot credibly promise to pay the penalty, you must credibly promise not to leave. In those specific conditions—weak internal governance or doubted liquidity—burning the bridge is not a strategic error but a necessary prosthetic for credibility. Absent those flaws, however, pricing the option is the superior instrument.
