          4.  *Adverse Selection:* Yes, some might plan to trigger the penalty. But that's a cost of doing business, priced into the penalty. It's better than being stuck with a dead product.
      *   **Empirical Dependencies & Rolling Process (approx. 150 words):**
          *   Dependency: Adopters must value compensation (liquidity) as much as stability. They must believe the firm can pay the penalty.
          *   Rolling Process: (iii) becomes even stronger. Irreversibility is toxic in evolving markets. Pricing options allows adjustment.
      *   **Concession (approx. 100 words):** Where the colleague is right. If the penalty isn't credible (can't pay), or if the signal needs to be "irrational" to deter a bully, (i) might be needed. Also, internal discipline issues.

  4.  **Refining and Polishing (Word Count & Tone Check):**
      *   Tone: Professional, strategic, rigorous, persuasive.
