  - `grade`: a number, points earned out of 25
  - `bottom_line`: one or two sentences giving the overall verdict
  - `rubric`: an object with `definitions_and_framework` (out of 6), `argument_and_assumptions` (out of 9), `evaluation` (out of 7), and `clarity` (out of 3); these four have to add up to `grade`
