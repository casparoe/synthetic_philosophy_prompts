answer: |-
  Your intuition is spot-on, and your "pendulum test" exposes the structural weakness in your roommate's argument. He has constructed a sophisticated conflation of **ontology** (how the world is) and **epistemology** (what we can know about the world).

  Here is the breakdown of where the argument fails, the costs of the possible fixes, and the answer to your question about "fixed but unreadable" futures.

  ### The Fatal Flaw: Step (2)

  The argument collapses at **Step (2)**: *"But 'fixes' can't mean anything over and above 'makes derivable in principle.'"*

  This is a category error. In physics and philosophy, **determinism is an ontological claim, not an epistemic one.**
  *   **Determinism:** Given state $S_t$ and laws $L$, there exists exactly one physically possible state $S_{t+1}$.
  *   **Predictability:** Given a *description* of $S_t$ and laws $L$, an observer can *compute* a description of $S_{t+1}$.

  Your roommate is arguing that if Predictability fails, Determinism must fail. This is false. A function can be perfectly well-defined (deterministic) even if it is computationally irreducible or sensitive to inputs we cannot finitely specify.

  **Cost to him:** If he rejects (2), his whole argument evaporates. He has to admit that chaos theory kills *predictability*, not *determinism*. This is the standard view in philosophy of physics.

  ### The Secondary Flaw: Step (4) and (8)

  Step (4) claims any specification of an initial state is finite. Step (8) claims this applies even to a Laplacian Demon. This assumes **Finitism** or **Digital Physics**—the idea that the universe is fundamentally discrete or that information must be stored in a physical medium with finite capacity.

  Standard classical mechanics assumes the state space is continuous (real numbers). A real number contains infinite information. If the universe is continuous, the "true state" is not a finite string of digits.

  **Cost to him:** If he keeps (2) and denies (4) (i.e., he insists Determinism = Predictability, but allows infinite precision):
  1.  **He swallows Platonism:** He must accept that physical states can embody infinite information (true real numbers), which many physicists find suspect.
  2.  **He demotes the Demon:** He must admit the Laplacian Demon is a mathematical abstraction, not a physical being. A physical being is bound by thermodynamics and Bekenstein bounds; a mathematical intellect is not.
  3.  **Does (3) survive?** If the initial error $\delta$ is truly zero (because the state is specified with infinite precision), then $\delta e^{\lambda t}$ remains zero. Chaos describes sensitivity to *perturbations*, not sensitivity to *exactness*. If you have exactness, chaos does not generate uncertainty. So, (3) ceases to be a threat to determinism.

  ### Addressing Your "Pendulum Test"

  You noted: *"If I strike (3) and (5)... the argument seems to run just as well on a frictionless pendulum."*

  You are very close, but there is a nuance.
  *   **In a pendulum (non-chaotic):** An initial error $\delta$ stays roughly $\delta$ (or grows linearly). Your prediction is always "Position $X \pm \delta$." You never lose track of the system; your uncertainty remains bounded.
  *   **In chaos:** The error grows to encompass the entire state space. Your prediction becomes "Position could be anywhere."

  So (3) *is* doing work in establishing **unpredictability**. However, your deeper point stands: **Neither system loses ontological determinism.** The roommate's argument implies that *any* system with continuous variables is indeterministic because we can't specify reals finitely. Chaos just makes the *consequences* of that finitism arrive faster.

  If his argument proves chaos kills determinism, it equally proves that **Newtonian gravity kills determinism** (because we can't specify the planet's position to infinite decimal places). Since we generally accept Newtonian gravity as deterministic (in the classical limit), his conclusion is reductio ad absurdum.

  ### The Specific Scenarios You Asked For

  #### 1. If he keeps (2) and denies (4)
  *("Determinism means Predictability, but Infinite Precision is possible")*

  *   **What he swallows:** He must claim the physical universe supports infinite information density. He must also claim that "prediction" doesn't require a physical predictor, but rather a logical entailment.
  *   **Does (3) survive?** No. As noted above, if $\delta = 0$ exactly, Lyapunov exponents don't create error from nothing. The "horizon" $T$ goes to infinity. Chaos becomes a property of the *equations*, not a limit on *knowledge*.
  *   **Verdict:** This saves determinism but requires a highly Platonist view of physics that contradicts modern quantum limits (though his argument is classical).

  #### 2. If he denies (2) and keeps (4)
  *("Determinism does NOT mean Predictability, and Specifications are Finite")*

  *   **What he swallows:** He has to accept that the world can be "fixed" even if no one (not even a demon) can calculate it.
  *   **What distinguishes "fixed but unreadable" from "not fixed"?**
      This is the crux of your final question. The distinction lies in **counterfactual stability**.
      *   **Indeterministic:** If you could magically rewind the universe to the *exact* same state $S_t$ and hit play, the future $S_{t+1}$ could be different (e.g., radioactive decay).
      *   **Deterministic (but unpredictable):** If you could magically rewind the universe to the *exact* same state $S_t$ and hit play, the future $S_{t+1}$ would be **identical** every single time.

      The "work" that the word "fixed" does is not about *our* ability to compute the future. It is about the **uniqueness of the causal chain**. Chaos makes the causal chain sensitive, but not branching.

      **Analogy:** Consider the decimal expansion of $\pi$. It is "fixed" by the definition of $\pi$. It is deterministic. However, if you only know the first 100 digits, you cannot derive the 1,000,000th digit easily. Does your inability to calculate the 1,000,000th digit mean it isn't fixed? No. The digits are determined by the math, even if your finite tools can't reach them.

  ### The Verdict on Step (8)

  Your roommate is proudest of (8): *"This has nothing to do with our instruments... even a Laplacian demon has to hold the state in something."*

  This is his weakest point. It conflates the **map** (the description of the state) with the **territory** (the state itself).
  *   The **Territory:** The actual physical configuration of the universe.
  *   **The Map:** The information required to describe it.

  Determinism is a claim about the Territory. Predictability is a claim about the Map. Step (8) argues that because the Map must be finite, the Territory must be indeterminate. That is a non-sequitur. The universe does not need to "store" its state in digits; it just *is* its state. The requirement for finite storage applies to *observers*, not to *reality*.

  ### Summary for Your Argument

  1.  **Reject (2).** Determinism is about causal uniqueness, not computational accessibility.
  2.  **Point out the Reductio.** If his argument works for chaos, it works for a pendulum (because we can't specify initial conditions to infinite precision there either). Since we don't think pendulums are indeterministic, the logic is flawed.
  3.  **Define the Distinction.** "Fixed but unreadable" means: **Rewind and replay yields the same result.** "Not fixed" means: **Rewind and replay yields a different result.** Chaos is the former; Quantum Mechanics (arguably) is the latter.

  He has proven that **Classical Chaos + Finitism = Unpredictability.** He has not proven **Indeterminism.**
