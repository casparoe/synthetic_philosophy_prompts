  **Where the Orderings Come Apart**
  The most significant divergence is **Case 3** and **Case 2**. In Case 3, the deception is maximal (forging a mark), yet the surviving value is also maximal (9). In Case 2, the deception is high (claiming original design), but the surviving value is minimal (2). This proves that **value tracks ontology (what the object *is*), while wrongness tracks ethics (what was *said*).** A lie about a genuine object (Case 3) damages trust but leaves the artifact's historical weight intact. A lie about a copy (Case 2) collapses the artifact's claim to significance entirely.

  Case 1 and Case 8 also diverge from the deception ranking. They have zero deception but middling value. This indicates that honesty alone does not generate high value; it merely prevents the collapse that comes with exposure.

  **Case-by-Case Analysis: Decision-Cost vs. Other Factors**

  1.  **Shop Repro:** The drop from "antique" value is explained by **Decision-Cost**. You inherited the form; your choices were limited to execution. However, the value remains 7 (not 0) because *craft cost* (skill of execution) retains worth independent of design choices.
  2.  **Competitor Copy:** This breaks your scheme. His **Decision-Cost** was high (he believed he was choosing), yet the value is 2. The drop is explained by **Convergence**: the market values the *first* decision, not the *independent* decision. His choices were redundant, rendering them valueless despite the effort.
  3.  **Fake Stamp:** Decision-Cost is irrelevant to the drop here. The 1790s maker paid the cost. The value drop (from a hypothetical 10 to 9) is due to **Provenance Integrity**. The object is real, but the narrative is tainted.
  4.  **Apprentice Finish:** Decision-Cost explains the slight drop. The Master made the design choices; the Apprentice made the finishing choices. We value the Master's decisions more highly. This fits your scheme.
  5.  **1910 Revival:** Decision-Cost is high (1910 makers made choices), but value drops because of **Historical Scarcity**. The decisions were made, but 100 years too late. Your scheme cannot account for *when* the cost was paid.
  6.  **70% Original:** Decision-Cost is split. The drop is explained by **Material Continuity**. Collectors value the specific atoms handled by the original maker, not just the decisions those atoms embody.
  7.  **Known Forgery:** Decision-Cost is high (the forger made many complex choices to deceive). Value is low. This fits your scheme only if you define "valid choices" as "honest choices." If decision-cost is purely about cognitive load, your scheme fails here.
  8.  **Museum Repro:** Decision-Cost is low (you copied decisions). Yet visitors prefer it. The value is sustained by **Aesthetic Performance**, not decision history. Your scheme predicts this should be low value, but the surface quality overrides the history.

  **How Well Decision-Cost Works**
  **0.6**
  Decision-cost accurately predicts value when the object is honest and the timeline is correct, but it collapses when faced with accidental convergence, historical displacement, or superior aesthetic execution of a copy.

  **Hardest Cases to Place**
  **Case 2 and Case 8.**
  Case 2 is hard because the internal state of the maker (high decision effort) contradicts the external reality (low decision novelty). It forces you to decide if value is psychological (what the maker felt) or genealogical (where the form came from). Case 8 is hard because it separates aesthetic preference from historical value. If visitors prefer the copy, does the copy have *more* value? Your scheme says no (low decision-cost), but human response says yes.

  **The Unknowable Truth Test**
  I am selecting **Case 3 (Fake Stamp)** and **Case 5 (1910 Revival)**.

  For **Case 5**, my number would change. If the truth were permanently unknowable, the market would treat it as an antique, and its *price* (a proxy for value in this context) would remain at 9. This proves you are valuing **History**, not Surface. The object doesn't change, but our knowledge of its decision-cost does, and that knowledge dictates the worth.

  For **Case 3**, my number would *not* change significantly. Even if the fake stamp were never detected, the object is still a 1790s hinge. The intrinsic value remains 9. The lie is parasitic. This suggests that for genuine artifacts, **Surface** (the physical reality of the 1790s metal) anchors the value, and the history is secondary verification.

  **Is This a Repackaging?**
  Yes. Your distinction between "choices made" and "choices inherited" is a pragmatic repackaging of **Intentionalism**, specifically the Romantic emphasis on **Original Genius**. You are arguing that value resides in the *act of invention* (the first decision) rather than the *act of realization* (the execution of that decision). This is the same boundary **Nelson Goodman** drew in *Languages of Art* between autographic arts (where history of production matters) and allographic arts (where it does not), though you are applying it within the autographic realm to separate the "originator" from the "replicator." You are also echoing **Walter Benjamin's** concept of the **Aura**, which decays when the object's unique existence in time and place (its decision history) is replaced by reproducibility.
