answer: |-
  Suppose the second player knows the way,
  A perfect response to every move made known.
  No matter how the first begins the play,
  The second's path to victory is shown.
  Whatever opening the first has sown,
  The second's guide is calmly obeyed,
  Until the victory is fully grown,
  And every trap is neatly laid.

  Yet first places one stone without a care,
  Then steals the script to answer every call.
  If told to fill the spot already there,
  He plays elsewhere; the extra answers all.
  For extra stone cannot convert to loss,
  First wins unseen, save move costs, symmetry lost.
