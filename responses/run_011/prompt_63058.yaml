answer: |-
  You have identified the precise fault line where the drama of your novel must reside, for the dispute between your cognitive scientist and her anthropologist foil is not about data but about the architecture of explanation itself. To write this convincingly, you need the blueprint of what a naturalistic theory of religion is actually asked to build, and where the structural stress points lie. The first and truly non-negotiable requirement is natural consistency, which demands that the theory explain religious phenomena using only causes and mechanisms that operate elsewhere in the natural world. This is not merely a philosophical preference but the definition of the project; if the theory invokes a supernatural agent to explain belief in supernatural agents, it has ceased to be a theory of religion and become a confession of faith. The case for this is simple: if religious belief is a natural phenomenon with a natural history, as your scientist posits, then its causes must be tractable to the same methods used to explain language acquisition or kinship systems. This requirement eliminates any explanation that relies on the truth of the religious claims themselves, forcing the theory to account for why people believe regardless of whether the object of belief exists.

  The second requirement is the distinction between origin and persistence, which is often collapsed to the detriment of clarity. A theory must specify whether it is explaining why religious ideas arise in the human mind in the first place or why religious institutions and practices endure across generations. The case for keeping these separate is that many ideas arise spontaneously but vanish quickly, while many practices persist long after their original motivating ideas have faded or changed. A theory that explains the memorability of a counterintuitive concept does not necessarily explain why a community sacrifices livestock to honor that concept for centuries. Your anthropologist would argue that treating these as a single target is a category error, while your scientist might argue they are linked phases of a single evolutionary process. An adequate theory must declare which phase it is addressing or provide a bridge mechanism that connects the spark of an idea to the fuel of a tradition.

  The third requirement is the preservation of competence, which dictates that the theory must not pathologize religious people as cognitively deficient or irrational in their ordinary lives. The case for this is ethnographic and historical: most religious people are perfectly competent about ordinary matters, navigating complex social and physical environments without error. If a theory suggests that religious belief is the result of a brain malfunction or a systematic cognitive failure, it contradicts the evidence that the same brains function adequately in non-religious contexts. The theory must explain how religious cognition coexists with ordinary rationality without requiring the believer to be perpetually deceived or broken. This means accounting for the fact that people can hold religious beliefs without those beliefs disabling their ability to farm, trade, raise children, or wage war effectively.

  The fourth requirement concerns epistemic neutrality, and here I offer a judgment rather than a summary. A naturalistic theory is caught between the charge that it debunks by stealth and the charge that it is toothless if it disclaims all debunking force. The only way to avoid both is to state that the theory explains the production of certainty without adjudicating the object of certainty. It must explain why humans feel compelled to believe, not whether what they believe is true. If the theory claims that belief is produced entirely by internal cognitive mechanisms, it feels like debunking to the believer, but if it leaves room for the possibility that the belief is true, it risks becoming toothless. The requirement should be that the theory makes the truth claim irrelevant to the explanation of the belief. This avoids debunking because it does not assert the claim is false, and it avoids toothlessness because it shows the belief would exist even if the claim were false. This is a difficult line to walk, and it is where your scientist will feel most vulnerable to the charge of reductionism.

  The fifth requirement is reflexivity, which asks whether the theory applies to its own author without special pleading. If religious belief is a natural phenomenon produced by cognitive equipment shaped by evolution or culture, then the cognitive equipment of the scientist is subject to the same constraints. The case for this is logical consistency; you cannot claim that all human thought is conditioned by natural history except for the thought that produces this theory. The cost of this requirement is high, as it undermines the claim to objective neutrality. If the scientist's theory is also a product of evolved cognitive biases or cultural selection, its claim to truth is weakened. However, avoiding this requirement invites the charge of exceptionalism. An adequate theory must acknowledge that the theorist is part of the data, even if this complicates the claim to authoritative knowledge.

  Now we must address whether these requirements are jointly satisfiable, for I suspect your intuition is correct that the project is over-constrained. A theory asked to account for the cross-cultural recurrence of religious cognition, simultaneously for the wild divergence of religious content, simultaneously to issue predictions that could have come out otherwise, and simultaneously to remain neutral on whether any of it is true, is indeed asking for too much. The requirement that has to give is the demand for specific predictive power regarding content. You cannot predict Zeus versus Yahweh from universal cognitive mechanisms alone. The theory can predict types of concepts, such as agents with counterintuitive properties, but it cannot predict the specific historical forms those agents take. If the theory claims to predict specific content, it contradicts the evidence of local variety. If it retreats to predicting only types, it risks being too vague to be falsifiable. The shape of a theory that satisfies the rest is one that predicts the constraints on content rather than the content itself, like a grammar that predicts possible sentences without writing the poem.

  Regarding which single requirement does the most work in eliminating candidates, I agree with your guess. It is the demand to explain why costly practice persists across generations in the absence of any payoff the practitioner can observe. Explaining why ideas arise is relatively easy; explaining why people burn resources, fast, or sacrifice without observable return is much harder. This requirement eliminates theories that treat religion as merely informational or memetic, because information alone does not motivate costly action. It forces the theory to account for commitment, trust, and coalition signaling. This is the anchor that drags the theory away from pure cognitive science and into evolutionary anthropology. If a theory cannot explain the cost, it cannot explain the institution.

  You have picked up various proposals in your reading, and they need sorting against these requirements. The hypothesis of a hypersensitive detector for agents is an answer to the origin requirement; it explains why people see agents where there are none. Concepts that are minimally counterintuitive are an answer to the transmission requirement; they explain why some ideas stick better than others. Ritual costliness as a signal of coalition commitment is an answer to the persistence requirement; it explains why people pay costs to stay in the group. The cultural selection of watchful moralizing gods is an answer to the cooperation requirement; it explains how large groups function. Religion as a parasitic replicator is an answer to the function requirement; it suggests religion may have no benefit for the host. The move your anthropologist would attack is the promotion of the functional answers into requirements. When theorists assume that costly practice must signal commitment, they are turning a hypothesis into a standard. They are judging theories by whether they accommodate functionalism, rather than asking if religion might be functionless. This is the malformed target your anthropologist suspects. The demand that a mechanism be identified rather than a function is a local preference of the cognitive camp, while the demand that explanations be symmetric between adaptation and byproduct is a methodological safeguard that should be kept. The insistence on laboratory-testable predictions is useful but limited, as it often strips away the context that makes religion real.

  The main contenders fare unevenly against this list. Those focused on cognitive origins explain the recurrence of ideas well but struggle with the persistence of costly practices. Those focused on evolutionary function explain the stability of groups well but struggle with the diversity of content and the existence of non-moralizing traditions. Those focused on cultural transmission explain the spread of ideas well but often treat the mind as a passive vessel. None satisfy all requirements without strain, and each leaves a gap where the other begins. The cognitive theories are too thin on history, the evolutionary theories are too thin on psychology, and the cultural theories are too thin on mechanism. This is not a failure of the theorists but a reflection of the complexity of the phenomenon.

  Your novel has the opportunity to show that this friction is not a bug but a feature of the inquiry. The spine of the quarrel is not who is right but what counts as an explanation. Your scientist wants a mechanism that works everywhere; your anthropologist wants a history that works somewhere. Both are necessary, and neither is sufficient. The tension between them is where the truth lives, not in the resolution. If you write the conflict as a struggle over these desiderata rather than over facts, you will capture the intellectual stakes accurately. The reader should feel that both characters are right about what matters and wrong about what matters less. That is the condition of the field, and it is fertile ground for fiction.
