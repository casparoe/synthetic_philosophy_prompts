          *   **Goodhart's Law/Specification Gaming:** The model optimizes for looking good in the CoT rather than actually being safe.
          *   **Cost/Compute:** Generating/reading CoT is expensive. If the budget is fixed, you can check fewer tasks. If misalignment is rare, outcome checking might cover more surface area.
