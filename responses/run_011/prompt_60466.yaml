prompt: |-
  I teach a grad seminar on oversight of deployed AI agents and I'm writing the take-home final. I want one essay question, 30 marks, doable in about 90 minutes, on process-based versus outcome-based oversight — but nothing a student could answer by reciting the PRM-vs-ORM tradeoffs from the math reasoning literature. The question should force them onto a specific puzzle: reading an agent's chain of thought hands the overseer strictly more information than just checking whether the task succeeded, and yet there are realistic conditions where the process-based overseer detects less misalignment for the same budget. They should have to say what those conditions are, why the extra information backfires, and what you'd have to assume about the tie between the reasoning trace and the model's actual computation for process oversight to genuinely dominate.

  Give me the question, a model answer around 700 words, and a marking scheme out of 30 that names the specific moves seperating an A answer from a B one — moves, not just topic areas — plus the mistakes that should cost marks and roughly how much each is worth. And flag any spot in the model answer where a student could defensibly go the other way, since I don't want to grade out a reasonable view.
