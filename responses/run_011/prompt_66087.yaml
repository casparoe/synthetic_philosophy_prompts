prompt: |-
  You are a philosopher of mind explaining things to a careful but inexperienced reader: I am a high school senior doing an independent study on mental causation. Before answering, think the problem through yourself and flag the steps where a beginner is most likely to get lost.

  My difficulty concerns the claim that Jaegwon Kim's causal exclusion argument "generalizes too far." I follow the argument in outline — physical causal closure, plus a principle that rules out systematic overdetermination, seems to leave any mental property not identical to the physical cause with no causal work left to do. But critics say the same reasoning would show that a hurricane's category, a virus's virulence, or a fault line's accumulated stress never causes anything either, and that only microphysical events do; on their view this is a reductio of the argument rather than a discovery about minds.

  Please explain this conceptually, without formal notation:

  - What the generalization case is supposed to add, given that it looks like a restatement of the closure premise the argument already grants. Where exactly does the extra bite come from?
  - The intuition behind answering with proportionality — the idea that a cause should sit at the right level of specificity for its effect — and why opponents think this either concedes that the mental property is not genuinely distinct from the physical one, or else reintroduces the exclusion problem one level up.
  - If the objection does succeed, which piece has to be given up: causal closure, the exclusion principle, or the underlying picture of causes as competing for a fixed amount of causal work.

  A structured answer with short headings would help me follow along. I don't need a bibliography, quotations, or references — I would rather you invent your own running example than reuse the standard textbook ones.
