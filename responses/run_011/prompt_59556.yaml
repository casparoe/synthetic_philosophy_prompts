answer: |-
  Your hypothesis is astute: it correctly identifies the semantic slippage that allows the debate to persist without resolution. However, it is perhaps too charitable to the participants. It assumes the impasse is merely a misunderstanding of terms, whereas I argue it is a structural feature of the evidence itself. The two camps are not simply using different dictionaries; they are operating with incompatible models of how *meaning* travels from event to text.

  Here is the assessment of your diagnosis and the four specific inquiries.

  ### 1. The Scope Diagnosis and the Nature of the Contradiction

  Your diagnosis that the Reconstructionists assert a "thin/existential" claim (conflict occurred) while Reductionists deny a "thick/narrative" claim (the *Iliad*'s story is history) is correct as a description of their *rhetorical* positions. However, it is incorrect as a description of their *logical* stakes.

  If the Reconstructionists merely claimed "violence occurred at Hisarlık c. 1200 BCE," the Reductionists would not oppose them; they concede the destruction horizon. The Reconstructionists actually claim: "The tradition is *causally dependent* on a specific historical conflict." The Reductionists claim: "The tradition is *causally dependent* on literary convention and generalized trauma."

  To re-express this so they genuinely contradict, we must fix the definition of "The Trojan War" as: **"A specific military conflict that serves as the necessary causal antecedent for the specific narrative elements of the Epic Cycle."**

  *   **Reconstructionist:** The evidence establishes a high probability of this causal link.
  *   **Reductionist:** The evidence establishes a low probability of this causal link; alternative causes (typology, myth) are more parsimonious.

  Once re-expressed this way, the disagreement is no longer purely semantic (scope); it is **methodological**. It turns on the *inference to the best explanation*. The Reconstructionists argue that the convergence of Hittite texts, archaeology, and poetry is too coincidental to be accidental. The Reductionists argue that the convergence is typical of how Bronze Age polities interacted and how myths form, requiring no unique event.

  Therefore, the scope diagnosis explains the *stall*, but not the *substance*. The substance is a disagreement about **parsimony**. What turns on it is the burden of proof: does the coincidence of names (Wilusa/Ilios) demand a historical link, or is it a common onomastic recycling? If the former, the Reconstructionist wins the "thin" claim. If the latter, the Reductionist wins the "thick" denial. They cannot both be "entirely right" because they make competing claims about the *generative mechanism* of the tradition.

  ### 2. The Substantive Hidden Disagreement

  There are three candidate hidden disagreements you listed: excavation limits, oral transmission, and burden of proof/silence.

  *   **Excavation:** This is not the crux. Both sides accept the destruction layers. The disagreement is on *agency* (war vs. earthquake/raid), which excavation alone rarely settles without textual corroboration.
  *   **Burden of Proof:** This is significant but derivative. The Reconstructionists argue from positive presence (bullets, burns, names); Reductionists argue from negative absence (no record of a 10-year siege, no contemporary Greek text). This is a standard historiographical tension, not the unique engine of this specific impasse.
  *   **Oral Transmission:** **This is the real crux.**

  The entire dispute hinges on the **fidelity of oral transmission over the "Dark Age" gap (c. 1200–750 BCE).**
  *   The Reconstructionist model requires that oral tradition can preserve *proper names* and *political relationships* across 400 years of non-literate culture without significant deformation.
  *   The Reductionist model assumes that oral tradition preserves *themes* and *structures* but randomizes or replaces *specific identifiers* (names, places) to suit contemporary contexts.

  **Is it decidable in principle?**
  Yes, but not archaeologically. It is decidable only through comparative anthropology of oral cultures (e.g., South Slavic *guslari*, as Parry and Lord attempted). However, even there, it remains **practically undecidable** for this specific case. We have no control group for "Greek Oral Tradition c. 1000 BCE." We cannot know if the Greek epic tradition was more conservative (preserving names) or more innovative (updating names) than the Yugoslav analogues.

  Because this crux is empirically inaccessible, the debate defaults to the methodological disagreement identified in Section 1. The Reconstructionists treat the survival of the name "Wilusa" as a "fossil" proving continuity. The Reductionists treat it as a "shard" that could have been picked up and repurposed by a poet centuries later. Without a functioning model of oral decay rates, neither position can be falsified.

  ### 3. What Would Count as Progress?

  Since the crux is the model of transmission, progress requires moving away from the accumulation of data (which both sides already accept) toward the refinement of the **mechanism of tradition**.

  *   **Candidate A: A Sharper Analysis of the Claim.**
      *   *Viability:* High. This is what your hypothesis attempts. If scholars explicitly distinguished between "Historical Kernel" (a war happened) and "Historical Correspondence" (the *Iliad* describes it), the emotional heat would dissipate.
      *   *Obstacle:* Scholars often want the prestige of the "Thick" claim while relying on the safety of the "Thin" evidence. Progress here requires disciplinary honesty that is rarely rewarded.

  *   **Candidate B: An Explicit Model of Transmission with Stated Parameters.**
      *   *Viability:* Medium. We could model oral transmission mathematically (information theory), estimating the half-life of a proper name in a non-literate society.
      *   *Obstacle:* Any model relies on analogies (e.g., modern oral cultures) that opponents can reject as inapplicable to the specific socio-religious function of Bronze Age bards.

  *   **Candidate C: Evidence with the Right Logical Shape.**
      *   *Viability:* Low. We need a contemporary written record from Troy or the Ahhiyawa explicitly mentioning the war. The probability of this surviving is near zero.

  *   **Candidate D: A Deliberate Change of Question.**
      *   *Viability:* High. Shift from "Did it happen?" to "Why does the tradition insist it happened?"
      *   *Obstacle:* This satisfies historians of memory but frustrates archaeologists and classicists seeking political history.

  **Conclusion on Progress:** No *empirical* progress should be expected. The evidence base is closed (unless a miracle discovery occurs). However, *conceptual* progress is available. The dispute is worth maintaining not because it will be solved, but because it acts as a **methodological hygiene**. The Reductionists prevent the Reconstructionists from treating poetry as data; the Reconstructionists prevent the Reductionists from treating archaeology as irrelevant context. The tension keeps both sides rigorous. The impasse is functional, not merely interminable.

  ### 4. Addressing the Third Camp

  The Third Camp argues the question is ill-posed because it demands a binary (Yes/No) about an object that is hybrid (Event + Narrative).

  *   **Coherence and Distinction:** This position is coherent and **distinct from Reductionism**.
      *   *Reductionism* is sceptical: "The narrative is fiction; the event is unproven/unlikely."
      *   *Third Camp* is functionalist/structuralist: "The narrative is a cultural fact that *creates* history, regardless of the event."
      *   Reductionism denies the link between text and event. The Third Camp denies the *priority* of the event over the text. For the Third Camp, the "Trojan War" is a real historical phenomenon *as a memory*, regardless of whether armies fought. It exists in the 8th century as a social force, which is historically verifiable, even if the 12th-century trigger is not.

  *   **Avoiding Scepticism:** Can they claim a "historical core" without conceding to scepticism?
      *   Yes, but they must redefine "core." It cannot be a "kernel of fact" (e.g., Achilles existed). It must be a **"crystallization point."**
      *   *The Claim:* "The tradition requires a trauma of sufficient magnitude to generate this specific cultural memory, but the details are irrelevant to the historicity of the trauma."
      *   *The Cost:* Accepting this costs the ability to write **political/military history** of the Late Bronze Age based on the epics. You cannot map Agamemnon's kingdom. You cannot use the *Iliad* to date the destruction of Troy VIIa. You surrender the *Iliad* as a source for the 12th century and accept it only as a source for the 8th century's *view* of the 12th century.
      *   This is a high cost for archaeologists who want to use Homer to interpret strata, but it is the only position that respects both the textual complexity (Reductionist insight) and the archaeological reality of destruction (Reconstructionist insight) without forcing a causal link that cannot be proven.

  ### Summary Assessment of Your Hypothesis

  You are right that the impasse is symptomatic of the question, but wrong that the two sides are "not in fact contradicting one another." They are contradicting one another on the **probability of causal continuity** across the Dark Ages.

  Your "Thin vs. Thick" distinction explains why they *talk* past each other, but the "Parsimony vs. Coincidence" disagreement explains why they *fight*. The Third Camp offers the only escape, but it requires abandoning the dream of recovering the 12th century through the 8th century's poetry. The seminar stalls because participants are unwilling to pay that cost. They want the Thin safety of archaeology and the Thick romance of the Epic simultaneously. The impasse is the price of that desire.
