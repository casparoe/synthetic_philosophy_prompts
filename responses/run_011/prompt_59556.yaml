          3.  What would count as progress? (Not wish-lists, but logical/structural moves). Is progress possible? If not, why keep the dispute?
          4.  Address the third camp. Is their position coherent/distinct from reductionism? Can it avoid total scepticism?
      *   **Constraint:** Argue from the provided characterization. Do not substitute a survey of scholarship or a verdict on historicity. Disagree precisely where necessary.

  2.  **Deconstruct the User's Hypothesis:**
      *   *Core Claim:* The debate stalls because the two sides are talking past each other regarding the *definition* of "The Trojan War."
      *   *Reconstructionist:* "Something happened at Hisarlık c. 1200 BCE involving Ahhiyawa and Wilusa." (Thin/Existential).
      *   *Reductionist:* "The Iliad's specific story (Helen, Achilles, 10 years, wooden horse) is not history." (Thick/Narrative).
      *   *Assessment:* This is a strong pragmatic diagnosis. It explains the *stall*. But is it the *whole* truth? Usually, in historiography, "Did X happen?" implies a threshold of correspondence between record and event. If the correspondence is too low, historians say "X didn't happen" even if *something* happened. So the disagreement might be about *thresholds*, not just definitions.

  3.  **Drafting Section 1: Scope Diagnosis & Re-expression:**
      *   *Is it correct?* Yes, largely. The "Thin vs. Thick" distinction captures the verbal dispute.
      *   *What turns on it?* It turns on the *identity conditions* of historical events. When does a conflict become *The* War?
      *   *Re-expression for genuine contradiction:* To make them contradict, we need a shared definition. Let's define "The Trojan War" as "A conflict sufficient to generate the specific causal chain in the Epic Cycle."
          *   Reconstructionist: "The archaeological/textual evidence is sufficient to ground this causal chain."
          *   Reductionist: "The evidence is insufficient to ground this causal chain."
      *   *Type of Disagreement:* This shifts it from semantic scope to *evidentiary sufficiency*. It becomes methodological (how we weigh evidence) and empirical (does the evidence meet the bar?). But the core tension remains conceptual: What is the relationship between *event* and *tradition*?

  4.  **Drafting Section 2: Hidden Substantive Disagreements:**
      *   *Candidates:* Excavation limits, Oral transmission, Burden of proof/Silence.
      *   *Excavation:* Both agree Hisarlık was destroyed. Disagreement is on *agency*. Reconstructionists see war; Reductionists see earthquake/general collapse. This is empirical but currently undecidable without new text/artifact.
      *   *Oral Transmission:* This is the bigger one. Reconstructionists assume 500 years of oral tradition can preserve a *kernel* of specific identity (names, places). Reductionists assume 500 years transforms specific events into archetypes.
      *   *Burden of Proof:* Reconstructionists argue from probability (raids were common, city destroyed, names match). Reductionists argue from silence (no Hittite record of a 10-year siege, no contemporary Greek record).
      *   *The Crux:* It's the **model of oral transmission**. If oral tradition preserves specific historical identity over 5 centuries without writing, Reconstructionists win the "Thin" claim easily. If it dissolves specific identity into mythic patterns, Reductionists win.
      *   *Decidability:* In principle? Maybe, through comparative anthropology of oral cultures (e.g., South Slavic bards). In practice? We only have one sample (Homer). It's likely *structurally* undecidable with current data.

  5.  **Drafting Section 3: What Counts as Progress:**
      *   *Not:* New pot shards or trenches (unless they have writing).
      *   *Yes:*
          1.  *Explicit Model of Transmission:* A formalized model of how oral poetry degrades/preserves info. (Available? Partially, via comparative linguistics/narratology, but always analogical).
          2.  *Sharper Claim Analysis:* Defining "Historical Core." (Available? Yes, philosophical work on reference).
          3.  *Change of Question:* From "Did it happen?" to "How does the tradition function?" (Available? Yes, but scholars resist giving up the historicity question).
      *   *Conclusion on Progress:* Substantive empirical progress is unlikely. Conceptual progress is possible but often ignored. The dispute is worth maintaining because it forces rigor on both archaeology (context of destruction) and philology (dating of layers). It acts as a heuristic engine.

  6.  **Drafting Section 4: The Third Camp:**
      *   *Position:* The question is ill-posed (category error). Event vs. Narrative.
      *   *Coherence:* Yes, it's coherent. It draws on the distinction between *res gestae* (things done) and *historia rerum gestarum* (story of things done).
      *   *Distinct from Reductionism?* Reductionists say "The narrative is fiction/myth." Third Camp says "The narrative is a *different kind of truth* (cultural memory) that isn't falsifiable by event-history." Reductionism is sceptical; Third Camp is functionalist/structuralist.
      *   *Avoiding Scepticism:* Can they say there's a "historical core"? Yes, but "core" must be redefined. Not a "kernel of fact" but a "crystallization point." Cost: You lose the ability to say "Achilles existed." You gain the ability to say "The figure of Achilles served a specific socio-political function in the 8th century rooted in 12th century anxieties." It costs *referential certainty* for *functional clarity*.

