answer: |-
  ### The "Function-Harm-Firewall" Procedure

  This procedure is designed to fit a 90-minute window. It separates biological facts from value judgments to prevent circular arguments. It forces the board to own the value calls rather than hiding them behind medical authority.

  **Time Allocation:** 90 Minutes Total
  **Roles:** Clinicians lead Step 1. The full Board votes on Steps 2–5.

  #### Step 1: The Biological Anchor (15 Minutes)
  *Goal: Establish the Naturalist baseline. Is there a deviation from species-typical function?*
  **Question:** "Does the evidence show a measurable failure or deviation in a physiological or psychological mechanism compared to the standard human design range?"
  *   **Sufficient Answer:** A clinician must cite specific metrics (e.g., audiogram decibels, sperm count, executive function testing) showing deviation from the species-typical norm.
  *   **Data Source:** Medical records, diagnostic criteria, population statistics.
  *   **Pass Condition:** If **No**, the condition is not a health condition (stop). If **Yes**, proceed to Step 2.
  *   **Note:** This step accepts that "aging" is a biological process, but asks if specific functions are failing faster or differently than the species-typical design.

  #### Step 2: The Harm Assessment (20 Minutes)
  *Goal: Establish the Normative bridge. Does the deviation matter to the person?*
  **Question:** "Does this functional deviation result in a disadvantage, pain, or increased risk of death/suffering *for this individual in their current context*?"
  *   **Sufficient Answer:** Evidence of subjective distress, objective limitation in major life activities, or statistically significant risk of future harm.
  *   **Data Source:** Patient testimony, functional assessments, risk models.
  *   **Pass Condition:** If **No**, the condition is a biological variant but not a *health condition for benefit purposes* (stop). If **Yes**, proceed to Step 3.

  #### Step 3: The Is-Ought Firewall (15 Minutes)
  *Goal: Catch smuggling. Are we hiding values as facts or facts as values?*
  **Question:** "In the previous two steps, did we use a statistical average to declare something 'bad,' or did we use a moral preference to deny a biological fact?"
  *   **Procedure:** The Lawyer or Chair leads this. Each member must identify one premise from Steps 1 or 2 and label it either **Fact** (verifiable measurement) or **Value** (judgment of worth).
  *   **Red Flag Examples:**
      *   *Smuggling Value as Fact:* "Short stature is a disease because it reduces earning potential." (Earning potential is a social value, not a biological function).
      *   *Smuggling Fact as Value:* "Hearing loss is natural aging, therefore it shouldn't be covered." (Naturalness does not equal moral acceptability).
  *   **Pass Condition:** The Board must explicitly agree on which premises are Value judgments. If disagreement persists on whether a premise is Fact or Value, the premise is discarded, and Step 2 is re-voted.

  #### Step 4: Plan Scope & Responsibility (20 Minutes)
  *Goal: Determine if the City is the right payer.*
  **Question:** "Even if this is a health condition causing harm, is remediation the responsibility of the employee benefit plan versus personal responsibility or public health?"
  *   **Sufficient Answer:** Alignment with the plan's stated purpose (e.g., restoring work capacity vs. optimizing quality of life).
  *   **Data Source:** Plan language, precedent cases, budget impact analysis.
  *   **Pass Condition:** Majority vote.

  #### Step 5: The Vote (20 Minutes)
  *Goal: Commit.*
  **Question:** "Does this count as a health condition for the purposes of this plan?"
  *   **Procedure:** Simple Majority. Dissenting opinions must state whether their objection is to the Biology (Step 1), the Harm (Step 2), or the Scope (Step 4).

  ***

  ### Case Applications

  Here is the procedure run on your three contested cases.

  #### Case 1: Adult ADHD (Work stable, life unstable)
  *   **Step 1 (Biology):** **Pass.** Clinicians confirm executive function deficits meet diagnostic criteria (dopaminergic regulation deviation).
  *   **Step 2 (Harm):** **Pass.** Patient reports severe impairment in domestic life, relationships, and self-care. Work stability is maintained only through excessive overtime and stress, which is unsustainable.
  *   **Step 3 (Firewall):** **Audit.** One member argues, "If they hold a job, they aren't disabled." The Chair flags this: **Value smuggled as Fact.** "Employment" is a social metric, not a biological function. The harm is real in other domains.
  *   **Step 4 (Scope):** **Pass.** The plan covers conditions that threaten long-term employability. The current work stability is fragile due to the non-work impairment.
  *   **Verdict:** **YES, counts as a health condition.**
  *   **Reasoning:** The biological dysfunction exists. The harm exists, even if currently masked in the work domain. To rule otherwise is to define health solely as economic productivity.
  *   **Who this annoys:** The fiscal conservatives on the board who view "holding a job" as the sole definition of functional health.

  #### Case 2: Age-Related Hearing Loss (Presbycusis, no subjective loss)
  *   **Step 1 (Biology):** **Pass.** Audiogram shows high-frequency loss consistent with aging but outside species-typical youth function.
  *   **Step 2 (Harm):** **Fail.** Patient reports zero difficulty communicating, no social withdrawal, no safety risk. They do not experience it as a loss.
  *   **Step 3 (Firewall):** **Audit.** Clinician argues, "The ear is broken, so they are harmed." Chair flags this: **Fact smuggled as Value.** The biological fact (ear deviation) is being used to assert a normative state (harm) that the patient denies.
  *   **Step 4 (Scope):** **N/A.** (Failed Step 2).
  *   **Verdict:** **NO, does not count as a contested health condition for accommodation.**
  *   **Reasoning:** Without subjective harm or functional disadvantage in the patient's actual life context, the biological deviation is a variant, not a condition requiring accommodation. The plan treats disease, not aging itself, absent harm.
  *   **Who this annoys:** The clinicians and patient reps. It contradicts the medical model that says "pathology = disease" regardless of patient experience. It forces the board to accept the patient's authority on their own well-being over the audiogram.

  #### Case 3: Infertility in a Single Man (Wants treatment)
  *   **Step 1 (Biology):** **Pass.** Diagnosis confirms physiological inability to produce viable sperm (e.g., azoospermia). Reproductive mechanism is non-functional.
  *   **Step 2 (Harm):** **Pass.** Patient expresses significant distress at the inability to have biological children.
  *   **Step 3 (Firewall):** **Audit.** One member argues, "He has no partner, so he can't conceive anyway; the sperm doesn't matter." Chair flags this: **Value smuggled as Fact.** The "opportunity to conceive" is being treated as a biological function. The biological function (sperm production) is failed regardless of partner status.
  *   **Step 4 (Scope):** **Pass.** The plan covers restorative reproductive function. Marital status is not a plan exclusion criterion.
  *   **Verdict:** **YES, counts as a health condition.**
  *   **Reasoning:** The physiological dysfunction is objective. The harm is subjective but valid. The social circumstance (single status) does not negate the biological failure.
  *   **Who this annoys:** The social conservatives and fiscal hawks. It commits city funds to reproductive treatment for a single man, separating "health" from "traditional family formation."

  ***

  ### Limitations: Where This Procedure Will Fail

  You asked where this will reliably give a bad answer. Be aware of these three failure modes:

  1.  **The "Normal" Oppressor Problem:** Step 1 relies on "species-typical function." If the majority of a population is harmed by an environment (e.g., widespread stress-induced hypertension in a specific department), this procedure might rule it "not a disease" because it is statistically typical for that group. It normalizes systemic harm.
  2.  **The Paternalism Trap:** In Case 2 (Hearing Loss), we deferred to the patient's claim of "no harm." This procedure cannot reliably detect when a patient is denying harm due to internalized stigma or lack of insight (e.g., early dementia, addiction). It risks abandoning people who don't know they need help.
  3.  **The Budget Veto:** Step 4 allows "Plan Scope" to override Steps 1 and 2. In practice, if the budget is tight, the Board will use Step 4 to vote "No" on valid health conditions. This procedure makes that dishonesty visible, but it does not prevent it. It will tell you *that* you are making a budget cut disguised as a medical decision, but it won't stop you from doing it.

  **Final Advice:** Use Step 3 (The Firewall) aggressively. It is the only tool you have to stop the clinicians from ruling on policy and the policymakers from ruling on medicine. When the argument stalls, call "Firewall Check" and force everyone to label their premise as Fact or Value. It usually breaks the deadlock.
