  | **1. Modal Significance** | If a physically consistent model of GR lacks a global time order, then "temporal becoming" cannot be a fundamental feature of the physical world, even in models that possess one. | The reality of time is determined by the structure of the *actual* world. The existence of non-temporal possible worlds in GR no more eliminates time than the possibility of a vacuum eliminates matter. | Analysis of whether GR is a theory of *spacetime structure* generally or *gravitational fields* specifically. | Philosophical analysis will show that "time" must be a necessary feature of any world governed by GR to be coherent. | Philosophical analysis will show that properties contingent on boundary conditions (like rotation) are still real properties. |
  | **2. Source of Foliation** | A genuine "Now" requires a foliation orthogonal to the metric structure itself, not one imposed by the accidental distribution of matter. | A genuine "Now" is physically realized by the causal structure defined by the matter/radiation content (e.g., CMB surface). The metric alone is insufficient for time. | Examination of whether "time" in physics is defined by the manifold metric ($g_{ab}$) or the matter tensor ($T_{ab}$). | The metric ($g_{ab}$) is the primary ontological bearer of temporal properties. | The coupled system ($g_{ab} + T_{ab}$) is the primary ontological bearer of temporal properties. |
  | **3. The "Lapse" Experience** | The subjective experience of time's flow is a projection onto the metric, necessitated because the metric fails to provide an objective lapse in all possible cases. | The subjective experience of time's flow correlates with entropy increase and causal signaling along the matter congruence, which exists objectively in our universe. | Correlation of phenomenological "becoming" with thermodynamic arrows vs. geometric foliations. | Phenomenology will remain unexplained by thermodynamics alone if the geometry admits CTCs. | Phenomenology is fully explained by local causal/thermodynamic arrows regardless of global topology. |

