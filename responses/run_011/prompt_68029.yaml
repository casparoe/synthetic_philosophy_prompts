  # JOINT STATEMENT ON GÖDEL SPACETIMES AND THE STATUS OF TEMPORAL BECOMING

  **Parties:** G (Proponent of Geometric Elimination of Time) and D (Proponent of Empirical Realism about Time)
  **Date:** October 26, 2023
  **Facilitator:** [Your Name/Role]

  ## 1. Agreed Claims
  *The following claims regarding the formalism, cosmology, and logical structure of the debate are accepted by both parties as accurate.*

  1.  **Formal Consistency:** Gödel's 1949 solution to the Einstein Field Equations is mathematically consistent within General Relativity (GR) and contains Closed Timelike Curves (CTCs) through every point.
  2.  **Global Time Functions:** A necessary condition for a "global time function" (a scalar field $t$ whose gradient is everywhere timelike) is that the spacetime be stably causal. Gödel spacetime is not stably causal; therefore, no such global function exists in that specific metric.
  3.  **Empirical Status:** Observational data (specifically CMB isotropy and large-scale structure) constrains the rotation of our actual universe to be near zero. Our universe is well-modeled by an FLRW metric, not a Gödel metric.
  4.  **Matter Flow:** In FLRW cosmologies, the average motion of matter (the "cosmic fluid") defines a preferred congruence of worldlines. In Gödel cosmologies, the matter flow does not define a hypersurface-orthogonal congruence.
  5.  **Coordinate Independence:** Physical claims must be invariant under diffeomorphisms. Disagreements regarding "slices" of time must be framed in terms of geometric structures (e.g., foliations), not specific coordinate systems.

  ## 2. Table of Disagreements
  *The following table isolates the substantive disagreements. Each party has drafted their position wording. Both agree on the "Test/Argument" column as the relevant arbiter, though they differ on the outcome.*

  | Issue | G's Position Wording | D's Position Wording | Accepted Test / Argument | G's Prediction | D's Prediction |
