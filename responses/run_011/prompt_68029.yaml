  ### Private Brainstorm: Where G and D are Talking Past Each Other

  *   **Modal Scope:** G is arguing from *possibility* (what GR permits reveals the nature of time); D is arguing from *actuality* (what our universe contains determines the reality of time). G thinks if time isn't robust across all models, it's not fundamental. D thinks if time exists in the actual model, it's real.
  *   **The Referent of "Objective":** G uses "objective" to mean *manifold-intrinsic* (independent of matter distribution). D uses "objective" to mean *empirically measurable* (defined by the matter/radiation content, e.g., CMB rest frame).
  *   **Foliation Status:** G treats the *absence* of a global spacelike foliation in Gödel's metric as a proof of conceptual incoherence. D treats foliation as a coordinate choice (gauge) and argues that in FLRW (our universe), the matter flow *provides* a physical foliation, making the mathematical possibility of non-foliable spacetimes irrelevant.
  *   **The "Lapse":** G conflates the mathematical parameter $t$ with the phenomenological "flow." D separates the geometric structure from the thermodynamic/causal arrow that generates the experience of becoming.
  *   **Burden of Proof:** G thinks D must explain why our local experience trumps global geometry. D thinks G must explain why a non-actual solution constrains actual ontology.

