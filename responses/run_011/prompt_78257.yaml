  6.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction on Thesis 1:* Is it a tautology? If correlation < 1, tails *must* come apart eventually. So it's mathematically true given enough pressure, but *when* it happens is empirical. I'll call it "Mathematically necessary under sufficient pressure, empirically contingent on threshold."
      *   *Correction on Person B:* Person B isn't saying "don't Goodhart." They are saying "Fixed specs Goodhart harder than live feedback." This relies on the idea that live feedback updates the proxy to match the shifting target.
