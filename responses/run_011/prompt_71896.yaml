prompt: |-
  I'm the token grad student on our university's style-guide advisory committee — it's "advisory," which I already suspect is part of the problem — and Thursday we vote on three changes to the official guide: singular *they* as the default for a person of unspecified gender, *chair* instead of *chairman*, and *first-year* instead of *freshman*. Half the meeting got derailed by the dean of the college, who said some version of "it's just a convention" twice, and not the same thing both times. The first time it meant the old usages have no authority beyond the fact that people happen to use them, so if we prefer something else we can just have something else. The second time it meant there's no fact of the matter about correctness here at all, so the vote is really about values rather than about usage. A student rep shot back that the committee can't decree anything because people will keep writing *chairman* no matter what we publish, and a linguist colleague answered him with "conventions change all the time, look how fast singular they took off" — which somehow conceded and denied the same point. Nobody ever said what they thought they were disagreeing about, and I'm the one who got volunteered to write up the conceptual terrain before Thursday.

  I half-read Lewis's *Convention* for a seminar last year and remember the gist: a convention is a regularity in some recurrent situation, nearly everyone conforms, nearly everyone prefers that others conform on condition that others do, and — the part I think matters here — some other regularity would have served just as well. What I can't do is turn that into a reply to the dean. So can you lay out, as a menu I can literally carry into the meeting, the distinct precise claims that "it's just a convention" and "conventions are arbitrary" could be making? Start with whatever is a platitude nobody in that room would deny, work through the substantive and defensible ones, and end with whatever is flatly false or at least never actually argued for. For each reading say whether it's true and, separately, whether it would license the job it was being asked to do, which were four different jobs: (a) the committee's changing the guide, (b) the claim that nobody has any reason to keep using *chairman*, (c) the claim that there's no fact of the matter which usage is correct, and (d) the prediction that publishing a change will produce the change.

  Two more things. Someone in that seminar said Lewis himself distinguishes more than one sense in which a convention is arbitrary, and that people routinely slide between them without noticing; if that's right I'd like those senses pulled apart and mapped onto the menu, and if you think my seminar-mate was confabulating, just say so. And I want to know which side Lewis's account actually lands on for the student rep's objection — if a convention is self-perpetuating in the way he describes, does an advisory committee with a style guide have any standing to change one, or does change only become possible when there's some focal authority capable of making the new expectation common knowledge? Which would also tell me whether our mandate is even the right instrument. Feel free to tell me the whole thing is a bad analogy, since *chairman* isn't obviously a coordination problem the way driving on the right is — but if so, tell me exactly where the analogy breaks, because that's the spot the dean will press on.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Token grad student on a university style-guide advisory committee. Smart, analytically inclined (read Lewis's *Convention*), frustrated by vague philosophical hand-waving in a bureaucratic setting. Needs practical ammunition for a meeting on Thursday.
      *   **Context:** Voting on three style changes (singular *they*, *chair*, *first-year*). The Dean derailed discussion with ambiguous uses of "it's just a convention." A student rep argued futility (people won't change), a linguist argued malleability (conventions change fast). Confusion reigns about what "convention" means and what power the committee actually has.
      *   **Task:** Create a "menu" of distinct precise claims regarding "it's just a convention" and "conventions are arbitrary."
      *   **Structure:**
          1.  Start with platitudes (undeniable).
          2.  Move to substantive/defensible claims.
          3.  End with false/unsupported claims.
          4.  For *each* claim, evaluate: (i) Is it true? (ii) Does it license four specific jobs: (a) changing the guide, (b) no reason to keep old usage, (c) no fact of matter on correctness, (d) prediction that publishing causes change.
          5.  Address Lewis's distinction on arbitrariness (seminar mate's point).
          6.  Address Lewis's view on the committee's standing/power (coordination problems vs. authority).
          7.  Address the analogy break (is language/style really a coordination problem like driving?).
      *   **Tone:** Precise, philosophical but accessible, slightly wry (matching the user's voice), actionable.

  2.  **Deconstruct "It's Just a Convention" (The Menu):**
      *   *Platitude:* Conventions are regularities in behavior. (True, but does nothing).
      *   *Substantive 1 (Arbitrariness of Origin):* There was no intrinsic reason to start with *chairman* over *chair*. (True, but doesn't mean we can switch easily now).
      *   *Substantive 2 (Conditional Preference):* People follow it because others do. (True, this is Lewis's core).
      *   *Substantive 3 (Alternative Equilibrium):* Another pattern *could* have worked. (True in the abstract, maybe not now).
      *   *False/Overreach:* Conventions have no normative force. (False, they create expectations).
      *   *False/Overreach:* Conventions can be changed by fiat without cost. (False, coordination costs exist).

  3.  **Evaluate the Four Jobs against the Menu:**
      *   (a) Committee changing guide: Needs authority or focal point status.
      *   (b) No reason to keep *chairman*: Needs to show the old convention is broken or harmful.
      *   (c) No fact of correctness: Needs to distinguish descriptive vs. prescriptive.
      *   (d) Prediction of success: Needs to address critical mass/focal points.

  4.  **Address Lewis on Arbitrariness:**
      *   The seminar mate is right. Lewis distinguishes:
          1.  *Arbitrary in origin:* We could have started elsewhere.
          2.  *Arbitrary in maintenance:* We could switch now without loss of function (this is the tricky one).
      *   Need to map these to the Menu.

  5.  **Address the Committee's Standing (Lewis's View):**
      *   Lewis focuses on *coordination problems*. Solutions are equilibria.
      *   To move from Equilibrium A (*chairman*) to Equilibrium B (*chair*), you need a "Focal Point" (Schelling).
      *   Does the Style Guide act as a Focal Point? Yes, potentially.
      *   Does the committee have standing? Only if the university community treats the guide as the focal authority. If they ignore it, it's just noise.
      *   So, the mandate is the right instrument *only if* the guide is successfully established as the focal point for coordination.

  6.  **Address the Analogy Break (Language vs. Driving):**
      *   Driving is a pure coordination game (Right vs. Left). Language is partly coordination, partly signaling/identity.
      *   *Chairman* isn't just coordination; it carries ideological baggage (exclusion). This changes the payoff structure. It's not *just* a convention; it's a convention with externalities.
      *   This is where the Dean's "just a convention" argument fails. If a convention harms people, the "arbitrariness" defense weakens because the *content* matters, not just the coordination.

  7.  **Drafting the Response (Iterative refinement):**
      *   *Intro:* Acknowledge the frustration. Validate the Lewis reading.
      *   *The Menu:* Use a clear table or list format. Label claims C1, C2, etc. Evaluate Truth and Licensing (a-d).
      *   *Lewis on Arbitrariness:* Confirm the seminar mate. Explain "Arbitrary in Origin" vs. "Arbitrary in Equilibrium."
      *   *The Committee's Power:* Explain the Focal Point theory. The Guide *is* the tool to create common knowledge.
      *   *The Analogy Break:* This is crucial. Language isn't just driving. *Chairman* implies gender. *Freshman* implies classism/sexism. This makes it a *modified* coordination game.
      *   *Conclusion/Strategy:* Give the user a specific script or talking point for Thursday.

  8.  **Refining the "Jobs" Evaluation:**
      *   *Job (a) Changing the guide:* Almost any claim licenses this *procedurally*, but only the Focal Point claim licenses *effectiveness*.
      *   *Job (b) No reason to keep old:* Only true if the old convention is harmful or the new one is strictly better (Pareto improvement). "Just a convention" doesn't prove this.
      *   *Job (c) No fact of correctness:* True descriptively, false prescriptively within an institution.
      *   *Job (d) Prediction:* "Just a convention" (arbitrary) suggests easy change. Lewis suggests hard change (equilibrium). The Linguist's claim (fast change) needs the "Focal Point" mechanism to be true.

  9.  **Self-Correction/Nuance Check:**
      *   *Wait, is Lewis right about language?* Linguists often push back. Language isn't *pure* coordination. It has expressive utility. I need to make sure I don't present Lewis as the God of Truth, but as the tool the Dean invoked.
      *   *The Dean's Contradiction:* The Dean used "convention" to mean "weak/no authority" (so we can change it) AND "no fact of matter" (so why bother?). I need to highlight this equivocation.
      *   *Student Rep vs. Linguist:* Rep says "inertia." Linguist says "malleability." Lewis explains *both*: Inertia is the equilibrium; Malleability requires a new focal point.

  10. **Final Polish:** Ensure the tone is "grad student to grad student" — intellectually rigorous but ready for the trenches. (e.g., "Here is your cheat sheet.")

  *(Self-Correction during drafting)*: Make sure to explicitly answer the "seminar mate confabulating" question. (Answer: No, they were right). Make sure to explicitly answer "where the analogy breaks." (Answer: Payoff structures/ideology).

  11. **Final Review against constraints:**
      *   Menu format? Yes.
      *   Platitudes -> Substantive -> False? Yes.
      *   Evaluate Truth + 4 Jobs for each? Yes.
      *   Lewis on Arbitrariness? Yes.
      *   Committee Standing? Yes.
      *   Analogy Break? Yes.

