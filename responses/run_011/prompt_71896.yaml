answer: |-
  Here is the conceptual terrain map you asked for. You can print this out and put it in your folder. It is structured to isolate the equivocations the Dean is relying on and to give you the Lewisian vocabulary to clarify the committee's actual power.

  ### Part 1: The Menu of Claims
  *What "It's just a convention" might mean, ranked from platitude to falsehood.*

  **Claim 1 (The Platitude): "A convention is a regularity in behavior that people follow because they expect others to follow it."**
  *   **Is it True?** Yes. This is the Lewisian baseline.
  *   **Does it license...**
      *   (a) *Changing the guide?* **Yes.** If the guide is the mechanism for setting expectations, this is its job.
      *   (b) *No reason to keep 'chairman'?* **No.** It explains *why* people use it (expectations), not whether they *should*.
      *   (c) *No fact of correctness?* **Yes,** descriptively. There is no metaphysical "correctness," only adherence to the regularity.
      *   (d) *Prediction of success?* **No.** It doesn't tell us how hard it is to shift the regularity.

  **Claim 2 (Arbitrariness of Origin): "We could have started with 'chair' or 'first-year' just as easily as 'chairman' or 'freshman'."**
  *   **Is it True?** Yes. This is Lewis's "arbitrary in origin." There is no natural law linking the concept to the word.
  *   **Does it license...**
      *   (a) *Changing the guide?* **Weakly.** It removes the barrier of "natural correctness."
      *   (b) *No reason to keep 'chairman'?* **No.** Just because a path was chosen arbitrarily doesn't mean we can leave it without cost now (path dependence).
      *   (c) *No fact of correctness?* **Yes.** Reinforces that the choice isn't dictated by nature.
      *   (d) *Prediction of success?* **No.** Origin arbitrariness does not imply current malleability.

  **Claim 3 (Arbitrariness of Equilibrium): "We could switch to 'chair' tomorrow with no loss of communicative function, provided we all switch together."**
  *   **Is it True?** **Debatable/Contextual.** In pure coordination (driving on the right), yes. In language with ideological baggage (gendered terms), **No.** The *content* of the convention affects the payoff, not just the coordination.
  *   **Does it license...**
      *   (a) *Changing the guide?* **Yes.** If the switch is costless (functionally), the guide can mandate it.
      *   (b) *No reason to keep 'chairman'?* **Yes,** *if* the new term is functionally equivalent but socially preferable.
      *   (c) *No fact of correctness?* **Yes.**
      *   (d) *Prediction of success?* **Only if** the "all switch together" condition is met. This is the crux of the Student Rep vs. Linguist debate.

  **Claim 4 (The Dean's Strong Claim): "Because it is a convention, it has no normative authority and imposes no obligation."**
  *   **Is it True?** **False.** Conventions *create* obligations via conditional preferences (I prefer to conform if you do). To violate a convention is to frustrate others' expectations.
  *   **Does it license...**
      *   (a) *Changing the guide?* **No.** If conventions have no authority, the guide has no authority.
      *   (b) *No reason to keep 'chairman'?* **No.** If there's no obligation, there's also no reason to *stop*.
      *   (c) *No fact of correctness?* **Yes,** but trivially.
      *   (d) *Prediction of success?* **No.**

  **Claim 5 (The Dean's Contradiction): "Conventions are arbitrary, so we can change them easily; but they are arbitrary, so it doesn't matter if we do."**
  *   **Is it True?** **False.** This is an equivocation between *Origin Arbitrariness* (easy to justify change) and *Equilibrium Arbitrariness* (hard to execute change).
  *   **Does it license...**
      *   (a) *Changing the guide?* **No.** It undermines the motivation.
      *   (b) *No reason to keep 'chairman'?* **No.**
      *   (c) *No fact of correctness?* **Yes.**
      *   (d) *Prediction of success?* **No.**

  ---

  ### Part 2: The Seminar Mate and Lewis on Arbitrariness

  Your seminar mate was **not confabulating**. Lewis explicitly distinguishes senses of arbitrariness in *Convention* (and later in "Languages and Language").

  1.  **Arbitrariness of Origin (A-O):** There was a time before the convention where multiple solutions were possible. (e.g., Before cars, no one cared if we drove left or right).
      *   *Maps to:* **Claim 2** above.
      *   *Use:* Destroys the argument that *chairman* is "naturally" correct.
  2.  **Arbitrariness of Equilibrium (A-E):** Once the convention is established, an alternative regularity would serve the *same coordinating purpose* just as well *if everyone adopted it*.
      *   *Maps to:* **Claim 3** above.
      *   *Use:* This is where the Dean is slippery. A-E is true for traffic laws. It is **false** for *chairman* vs. *chair* if one term is exclusionary. If *chairman* actively signals "men only" to some readers, the payoffs are not equal. The new convention isn't just a different label; it's a different payoff structure.

  **The Trap:** The Dean is using A-O to say "We can change it" (because it wasn't God-given) and A-E to say "It doesn't matter" (because it's just a label). You need to point out that A-O justifies the *right* to change, but A-E is empirically false if the old term causes harm.

  ---

  ### Part 3: The Committee's Standing (Lewis vs. The Student Rep)

  The Student Rep said: *"The committee can't decree anything because people will keep writing chairman."*
  The Linguist said: *"Conventions change all the time."*

  **Lewis's Verdict:** The Student Rep is describing **Inertia**. The Linguist is describing **Focal Points**.

  For Lewis, a convention is a coordination equilibrium. To move from Equilibrium A (*chairman*) to Equilibrium B (*chair*), you need a **Focal Point** (a concept from Thomas Schelling that Lewis incorporates). A focal point is a solution that stands out as unique or authoritative, allowing everyone to coordinate their expectation that *everyone else* will switch.

  *   **Does the Committee have standing?**
      *   **Yes, IF** the Style Guide functions as a Focal Point.
      *   The Guide is not just a record of usage; it is a mechanism for creating **Common Knowledge**.
      *   *Common Knowledge:* I know the rule, you know the rule, I know that you know that I know the rule.
      *   Without the Guide, I might want to write *chair*, but I worry the editor will change it to *chairman*, or that readers will think I'm sloppy.
      *   **The Mandate:** The committee's job is not to "decree" usage (which fails, per Student Rep). Their job is to **publish the focal point** so that everyone knows it is safe to switch.

  **Actionable Point:** If the university administration does not enforce the Guide (e.g., in official communications, HR documents, press releases), the Guide fails as a Focal Point. It becomes "advisory" in the sense of "optional," and coordination fails. You need to ask: *Is this guide a description of what we do, or a signal of what we will all do starting Thursday?*

  ---

  ### Part 4: Where the Analogy Breaks (The Dean's Weak Spot)

  You asked where the analogy between *chairman* and driving on the right breaks down. This is where you win the argument.

  **The Coordination Problem vs. The Modified Coordination Problem**

  *   **Driving (Pure Coordination):** I only care that we drive on the same side. I am indifferent between Left and Right, provided we agree. The payoff is identical.
  *   **Language (Modified Coordination):** I care that we understand each other (Coordination), **BUT** I also care about the *social meaning* of the words (Signaling).
      *   For many, *chairman* has a negative payoff (implies exclusion).
      *   For some, *chairman* has a positive payoff (implies tradition/authority).
      *   *Chair* has a different payoff (inclusive, modern).

  **The Break:**
  The Dean's argument ("It's just a convention") assumes a **Pure Coordination Game**. In a Pure Coordination Game, the status quo is stable because switching costs are high and benefits are zero.

  But this is a **Modified Coordination Game**. The benefits of switching are *not* zero. There is an external value (inclusivity) that changes the payoff matrix.
  *   **Lewis's Account:** Lewis acknowledges that conventions can be displaced if a new equilibrium offers a higher payoff (Pareto improvement).
  *   **Your Argument:** "Dean, if this were driving on the right, you'd be right—it's arbitrary. But this is more like deciding whether to install wheelchair ramps. It's a convention about how we build things, and we've decided the old way excludes people. The Style Guide isn't just describing the road; it's repaving it."

  ### Summary Script for Thursday

  If the Dean says "It's just a convention" to dismiss the change:
  > "In Lewis's terms, that means the *origin* was arbitrary, which justifies our right to change it. But it doesn't mean the *equilibrium* is costless. If the current convention imposes social costs (exclusion), we have a reason to move to a new focal point. The Guide is that focal point."

  If the Student Rep says "People won't listen":
  > "They won't listen if this is just advice. But if this Guide creates common knowledge that the administration expects the change, it solves the coordination problem. We aren't decreeing usage; we are publishing the new equilibrium."

  If the Linguist says "Conventions change fast":
  > "They change fast when there's a clear signal. Our vote provides the signal. But we need to acknowledge that *chairman* isn't like driving on the left; it carries ideological weight. That's why the change matters, and why 'just a convention' is an insufficient objection."

  **Final check on your mandate:**
  If the Guide is truly "advisory" (no enforcement, no adoption by central comms), then Lewis predicts failure. You cannot coordinate on a signal everyone is allowed to ignore. You may need to add a fourth item to the vote: *"That this Guide be adopted as the standard for all official University communications."* Without that, you are just writing a diary entry.
