answer: |-
  1. The rule must ensure that an agent expecting to hold certain credences sees those same credences as minimizing her expected score, otherwise she is incentivized to lie about her beliefs. This is non-negotiable for any system claiming to measure *honest* accuracy, though it presupposes that rational agents must view their own current state as optimal.

  2. Total inaccuracy should be the sum of scores for individual propositions, but this sum must not change arbitrarily when you re-carve the same possibilities into finer questions. This is necessary to prevent the score from penalizing you for how you describe the world rather than what you predict, but strict additivity often conflicts with partition independence unless question weights are fixed externally.

  3. The measure must allow some truths to count more than others depending on context, since a flood warning matters more than a picnic rainout. Insisting all truths weigh equally is a prejudice of the pure accuracy-first camp that keeps the theory "purely epistemic" but renders it useless for applied decision-making where stakes vary.

  4. If one set of credences is more accurate than another in every possible world, the theory must recommend switching, even if the agent currently thinks she is incoherent. This is non-negotiable for normative force because it offers a reason to change your mind that doesn't depend on your current broken standards, but it fails if the agent rejects the scoring rule itself.

  5. The scoring rule must be fixed in advance and cannot recommend ignoring free information, even if you know you will mishandle it. This creates a hard collision because a rule fixed in advance to prevent gaming can sometimes imply that looking at data is costly if your updating rule is known to be flawed, forcing a choice between procedural fairness and truth-seeking.
