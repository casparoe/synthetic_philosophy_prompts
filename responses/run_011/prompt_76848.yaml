              *   *Tiny Sects:* Truth is often majoritarian. A court judging truth would likely side with established orthodoxy. New revelations die.
              *   *Establishment:* The state becomes the Church.
          *   *Intermediate Version:* Is there one? Maybe "deference to internal authority" (let the church decide). But that privileges hierarchical churches over individual spirituality.
          *   *Conclusion on Incoherence:* The incoherence (subjective sincerity treated as objective burden) is the *feature*, not the bug. It's the only way to keep peace without establishing a state theology.

      *   **Synthesis/Refinement:**
          *   Ensure the tone is philosophical and analytical, matching the prompt.
          *   Avoid legal jargon where possible, focus on the conceptual machinery.
          *   Check against constraints: No case names (Sherbert, Yoder, Hobby Lobby, etc., must remain unnamed).
