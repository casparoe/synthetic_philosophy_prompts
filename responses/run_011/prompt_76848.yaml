      *   *Refining the Metaethics point:* Make sure to highlight that Natural Law claims get downgraded to "conscience" claims, losing their universal pretension.
      *   *Refining the Counterfactual:* Emphasize that if courts judged truth, "exemption" would cease to exist. It would become "validation."

