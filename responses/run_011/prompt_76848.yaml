          *   *Self-Deception:* If I am self-deceived, am I sincere? The law usually says yes (subjective), but if the belief is incoherent, is it a belief? The law struggles here.

      *   **Section 3: The Metaethical Bias (Divine Command vs. Natural Law).**
          *   *The User's Hunch:* It's right. The system favors DCT.
