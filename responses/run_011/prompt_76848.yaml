          *   *Neutrality Failure:* The law assumes religion is a *preference generator* based on authority, not a *truth tracker* based on reason. It forces rationalist traditions to speak the language of voluntarist traditions to get protection.

      *   **Section 4: The Counterfactual (Adjudicating Truth).**
