      *   **Philosophical Hook:** The Euthyphro Dilemma applied to law. Is an act protected because God requires it (objective truth), or because the believer *takes* it to be required (subjective sincerity)?
      *   **Task 1 (Ontology/Epistemology):** What does this presuppose about the source of religious obligation? Is it necessarily the "subjective sincerity" horn, or can it be read as epistemic humility/jurisdictional limitation? Distinguish *strict needs* vs. *comfortable fits*.
      *   **Task 2 (Consistency/Psychology):** Can you evaluate "kind of belief" and "sincerity" without evaluating "content"? What picture of belief does "sincerity" assume (reportable inner state)? Does this work for confused/evolving/self-deceived believers?
      *   **Task 3 (Metaethics/Neutrality):** Does the no-truth rule treat Divine Command Theory (DCT) traditions the same as Natural Law/Reason-based traditions? Does it implicitly impose a DCT framework (arbitrary will) on traditions that believe truth is accessible to reason?
      *   **Task 4 (Counterfactual/Alternatives):** What if courts *did* judge theological truth? What breaks (concept of exemption, burden, tiny sects)? Is there an intermediate version, or is incoherence the price of the system?
      *   **Constraints:** No case names, no bibliography, no citations. Reconstruct implicit theory and stress-test it.

  2.  **Drafting - Section by Section:**

      *   **Introduction:** Acknowledge the depth of the insight. The user has spotted the "black box" of religious liberty jurisprudence. Set the stage: the law creates a functional definition of religion that may not match theological reality.

      *   **Section 1: The Euthyphro of Exemptions (Source of Obligation).**
          *   *The Dilemma:* Protected because objectively true vs. protected because subjectively felt.
          *   *The Legal Move:* The law *must* pick the subjective horn (sincerity) for practical reasons, but it *talks* like it respects the objective horn.
          *   *Strict Needs vs. Comfortable Fits:*
              *   *Strict Need:* The law *cannot* adjudicate truth (jurisdictional/epistemic limit). Therefore, the *legal force* comes from the impact on the subject, not the validity of the claim.
              *   *Comfortable Fit:* This fits Protestant individualism (faith is inward). It fits less well with hierarchical/orthodox traditions where obligation is external/corporate.
              *   *Alternative Reading:* Is it just epistemic humility? Yes, but humility *functions* as subjectivism here. If you can't know truth, you must rely on the agent's report. So, functionally, it *is* the second horn, even if justified by the first.

      *   **Section 2: The Consistency Problem (Sincerity & Classification).**
          *   *The Paradox:* How to judge sincerity without judging content? To know if I'm lying about a belief, you need to know if the belief makes sense *as a belief*.
          *   *Picture of Belief:* The law assumes belief is a discrete, stable, introspectable mental state (Cartesian). "I believe X."
          *   *The Stress Test:* Real belief is often messy, evolving, performative, or embedded in practice.
