              *   Total (c): 5/7? Wait, if the argument in (a) relies on Timing, and Timing is undermined, saying the argument stands is a fundamental logic error. It's worse than just "what doesn't change". It invalidates the "What changes" point. Let's go 3/7.
          *   Total: 17/25.

      *   *Wait, looking at (a) again:* "State the timing premise..." Student: "So the timing premise is well supported: the conscious urge is reported as arising some 350 ms after preparatory activity..." This is a statement of the premise (Urge after Prep). Okay, I'll give credit for that.
      *   "State the... causal-relevance premise." Student: "The causal-relevance premise is a further, philosophical claim, and the data don't establish it on their own". This is *not* stating the premise. This is stating its epistemic status. Deduct here.
      *   "What would have to be added...?" Student: "you need the extra assumption that the reported W time is a faithful read-out". This is *a* thing that needs to be added, but the *main* thing the course likely emphasized is the CRP itself (that causes must precede neural events). The student treats CRP as a label for a claim data don't establish, but doesn't define it.
      *   Okay, 6/10 for (a) feels right.
