      *   **Context:** 40 scripts to grade by Friday. Needs actionable feedback.
      *   **Definitions Provided:**
          *   *Timing Premise:* Reported onset of conscious urge comes *after* onset of relevant preparatory brain activity.
          *   *Causal-Relevance Premise:* An event can only cause movement if it *precedes* the movement's initiation in the brain.
      *   **Exam Question Breakdown:**
          *   (a) 10 pts: State premises. Which does Libet data license? What's needed to conclude conscious intention plays no causal role?
          *   (b) 8 pts: Libet's veto role. Evaluate if it works.
          *   (c) 7 pts: Schurger et al. stochastic accumulator. What changes/doesn't change for the argument in (a)?

  2.  **Analyze the Student Script:**

      *   **Part (a) [10 pts]:**
          *   *Statement of Premises:*
              *   Timing: "conscious urge is reported as arising some 350 ms after preparatory activity... has already begun." (Matches definition provided in prompt context).
