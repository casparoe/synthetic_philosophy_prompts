  (c) Address whether the case is well posed. At the exit, is the driver choosing or realizing a draw? Does either answer render one camp's question empty — and if so, does that vindicate Teodora, or does she need more than that to be right?

  (d) Say what would count as progress on my diagnosis: a distinction, a variant case (a third exit; a note on his hand; a device that tells him with probability q that he has already passed one exit; a driver who is told the plan but not the draws), a theorem, or a change of question. If you think the debate is stalled for principled reasons, argue for that and say what the reasons are.

  (e) Close by saying what, if anything, this disagreement implies for agents that are reset, amnesiac, or otherwise discontinuous between decisions — including artificial ones — since that is why I care about the case beyond the puzzle. Do not inflate this part if the implications are thin.
