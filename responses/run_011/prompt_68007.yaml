      *   Exit at B: The driver continues at A ($p$) and exits at B ($1 - p$). Probability $= p(1 - p)$.
      *   Overshoot: The driver continues at A ($p$) and continues at B ($p$). Probability $= p^2$.
  *   **Correct Expected Value:**
      $$V(p) = (1 - p) \cdot 1 + p(1 - p) \cdot 4 + p^2 \cdot 0$$
      $$V(p) = 1 - p + 4p - 4p^2 = 1 + 3p - 4p^2$$
  *   **Optimization:**
      $$V'(p) = 3 - 8p$$
      Setting $V'(p) = 0$ gives **$p = 3/8$**.
