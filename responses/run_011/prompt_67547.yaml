  # The Allocation Decision Tree

  **Instructions for the Facilitator:** Read each node question aloud. Ask participants to physically move to the left side of the room for the first option and the right side for the second. Briefly note the distribution, then proceed to the next node relevant to that group. (In a large plenary, you may need to ask sub-groups to sit down while you route the others, or run the tree as a conceptual map on a whiteboard while participants place sticky notes).

  ### Branch Nodes

  **Node 1:** When the driver explained his consolidation routine at the potluck, was he describing a **physical fact** (like the van's fuel efficiency) that existed before the points, or a **preference** (like his annoyance) that only mattered because the points existed?
  *   *Physical Fact:* Go to Node 2.
  *   *Preference:* Go to Node 5.

  **Node 2:** If it was a physical fact, could we have captured it on a **better form** last year, or do we need a **computer** to find patterns across all forms?
  *   *Better Form:* Go to Node 3.
  *   *Computer:* Go to Node 4.

  **Node 3:** If we record it on a form, do the **prices we pay for diesel and electricity outside** give us the numbers to fill in, or are we **still guessing** the value of the van-hour inside?
  *   *Outside Prices:* **Leaf A**.
  *   *Still Guessing:* Go to Node 8.

  **Node 4:** If we need a computer to find patterns, is the barrier that our **current servers are too slow**, or that the **data on the forms is lies** (like the understated usage)?
  *   *Servers Too Slow:* **Leaf B**.
  *   *Data is Lies:* Go to Node 8.

  **Node 5:** If it was a preference/annoyance, do we need to let members **compete** for the vans to surface these preferences, or should the committee **listen harder** to complaints?
  *   *Compete:* Go to Node 6.
  *   *Listen/Committee:* Go to Node 7.

  **Node 6:** If they compete, should members be allowed to **sell their unused points** to each other for cash or favors, or should the points only decide **who the committee calls first**?
  *   *Sell Points:* **Leaf C**.
  *   *Committee Calls:* Go to Node 7.

  **Node 7:** If the committee decides, is its job to **adjust points until the queues vanish**, or to **enforce a fair share** regardless of queues?
  *   *Adjust/Vanish:* **Leaf D**.
  *   *Fair Share:* Go to Node 8.

  **Node 8:** (Merging paths from Guessing, Lies, Fair Share): Is the main problem that the **numbers are hidden** in people's heads, or that the **numbers don't exist** until traded?
  *   *Numbers Hidden:* Go to Node 9.
  *   *Numbers Don't Exist:* Go to Node 10.

  **Node 9:** If the numbers are hidden, and a god gave us a **printout of everyone's true needs**, could we calculate the perfect plan?
  *   *Yes, Could Calculate:* **Leaf E**.
  *   *No, Still Cannot:* Go to Node 10.

  **Node 10:** If we cannot calculate the plan, is it because we **lack a common unit** (like money) to add up the costs, or for some **other reason**?
  *   *Lack Common Unit:* **Leaf F**.
  *   *Other Reason:* (Unoccupied Cell).

  ---

  ### Leaves (Positions)

  **Leaf A: External Price Dependency**
  *   **Awkward Commitment:** We are not truly autonomous; our internal logic rides on capitalist market signals.
  *   **Pilot Prediction:** The pilot failed because points were detached from diesel/electricity costs, not because of gaming.

  **Leaf B: Cybernetic Planning**
  *   **Awkward Commitment:** Politics is just a lag in data processing; enough server capacity solves allocation.
  *   **Pilot Prediction:** The pilot failed because the committee updated quarterly instead of in real-time.

  **Leaf C: Internal Market**
  *   **Awkward Commitment:** Solidarity is less important than efficiency; some co-ops will end up with all the vans.
  *   **Pilot Prediction:** The pilot failed because points were non-transferable; trading would have fixed the queues.

  **Leaf D: Iterative Administration (Lange-Lerner)**
  *   **Awkward Commitment:** The committee must be willing to be wrong repeatedly and publicly adjust the numbers.
  *   **Pilot Prediction:** The pilot failed because the committee stuck to the initial point values too long.

  **Leaf E: Hayekian Knowledge Problem**
  *   **Awkward Commitment:** We cannot know what we need until we are forced to choose; forms will always lie.
  *   **Pilot Prediction:** The pilot failed because it asked for usage data instead of forcing real choices with consequences.

  **Leaf F: Calculation Problem (Mises)**
  *   **Awkward Commitment:** Without real money profit and loss, we are guessing; 'points' are play-money.
  *   **Pilot Prediction:** The pilot failed because points were not redeemable for real currency outside the federation.

  ---

  ### Unoccupied Cells

  **1. The "Truthful Lies" Cell (Node 4: Data is Lies + Servers Too Slow)**
  *   **Status:** **Incoherent.**
  *   **Reasoning:** This combination suggests that the barrier is computational speed, while simultaneously admitting the input data is falsified. A faster computer processing false usage reports will only produce false allocations more quickly.
  *   **Who might end up there:** Technologically optimistic participants who are cynical about human nature but refuse to abandon the software solution. They might argue for blockchain verification to fix the lies while upgrading servers.

  **2. The "Anchored Trader" Cell (Node 3: Outside Prices + Node 6: Sell Points)**
  *   **Status:** **Unexplored.**
  *   **Reasoning:** The tree routes External Price believers away from the Internal Market branch. However, one could argue that external prices provide the *baseline* value, while internal trading allocates the *scarcity*.
  *   **Who might end up there:** Pragmatic dispatchers who want the stability of market rates for diesel but want to allow co-ops with urgent humanitarian needs to bid up the price of a van-hour during a crisis.

  **3. The "Moral Calculator" Cell (Node 7: Fair Share + Node 9: Could Calculate)**
  *   **Status:** **Unattractive.**
  *   **Reasoning:** This view holds that we *could* calculate the most efficient use of the van (Node 9), but we choose to ignore that calculation to enforce a moral fair share (Node 7). While coherent, it is rarely defended as a primary allocation theory because it admits to inefficiency by design.
  *   **Who might end up there:** Members of the allocation committee who feel pressured to maximize efficiency by the server admins but are mandated by the federation's charter to prioritize smaller, poorer co-ops.

  ---

  ### Indistinguishable Leaves

  **Pair: Leaf E (Hayekian Knowledge Problem) and Leaf F (Calculation Problem/Mises)**
  *   **Why they blur:** In practice, participants often conflate "we can't get the data" (Hayek) with "we can't value the data" (Mises). Both result in skepticism about central planning, and Node 9 relies on a hypothetical ("If a god gave us a printout...") that is difficult for participants to answer honestly in a retreat setting.
  *   **Further Question to Separate:** "If we abolished the points and let co-ops trade van-hours directly for pallet-slots without using money, would that solve the problem?"
      *   **Hayekian:** Yes, because the trade reveals the hidden knowledge.
      *   **Mises:** No, because without a common money denominator, you still cannot calculate if the trade was a net loss or gain for the federation.

  **Pair: Leaf A (External Price Dependency) and Leaf D (Iterative Administration)**
  *   **Why they blur:** Both rely on a central body adjusting numbers. If the "external prices" (Leaf A) are used by the committee to "adjust until queues vanish" (Leaf D), the operational difference disappears.
  *   **Further Question to Separate:** "If the outside price of diesel doubles, do we automatically change our internal points, or do we wait to see if a queue forms?"
      *   **External Price:** Automatically change the points.
      *   **Iterative:** Wait for the queue to form.
