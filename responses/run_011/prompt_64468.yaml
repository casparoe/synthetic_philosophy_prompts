  Play a philosophy-of-mind specialist who's argued this out a lot, and work through it on scratch paper first — including a case I made up, call it the blocked hedonist: a subject under a neuromuscular blockade is having what she afterwards describes as an utterly delightful warm-bath experience, but at the time has no capacity to form, sustain, or express any pro-attitude toward its continuing. Then hand back ONLY five numbered items, one or two sentences each (item 5 can run three), no intro and no wrap-up paragraph:

  1-4. Four sub-questions the final number depends on, each with a rough probability and one line of justification. I'd want them to cover: whether the felt-quality view can say anything non-circular or non-ostensive about what the common quality is; whether the dispositionalist's counterfactual retreat — she would want it to continue if she could — rescues the blocked hedonist case or just quietly collapses back into a phenomenal view; how to handle masochists, adaptive preferences, and other desire states pointing the wrong way; and whether 'introspectible' is smuggling in a verification constraint that does the real work.

  5. Your final credence in the proposition, how you combined 1-4 (multiplicative, weighted, whatever you actually did), which single term that number is most sensitive to, and what one argument or empirical finding would move it the most.
