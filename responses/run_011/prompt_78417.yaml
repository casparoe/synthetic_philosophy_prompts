answer: |-
  **MEMORANDUM**

  **TO:** State Fish and Wildlife Commission
  **FROM:** Commissioner [Your Name]
  **DATE:** Tuesday, [Date]
  **SUBJECT:** Recommendation on Petition to List Cinder Fork Dace

  **RECOMMENDATION**
  I recommend the Commission move to **list the Cinder Fork dace** as a protected population under the State Endangered Species Act.

  This recommendation rests on a specific interpretation of the statutory terms "discrete" and "significant" that reconciles the 1988 legislative text with 2019 genomic data. It is designed to establish a precedent applicable to the pending springsnail and lupine petitions, both of which present similar tensions between hybridization evidence and ecological distinctiveness.

  **STATUTORY FRAMEWORK**
  Our Act protects any subspecies, variety, or *population* that is (a) discrete from the remainder of the taxon and (b) significant to it. Legislative history clarifies that "discrete" means a lineage "substantially isolated," and "significant" means contributing something to the taxon that would be lost if the unit were removed.

  We are not asked to determine if the Cinder Fork dace is a "true species" in an absolute philosophical sense. We are asked to determine if it constitutes a protectable *population* under the statute. The following findings apply the record to that legal test.

  **FINDING ON DISCRETENESS**
  *The Question:* Does the presence of gene flow and the lack of nuclear reciprocal monophyly defeat the statutory requirement that the unit be "substantially isolated"?

  *The Record:* The 2019 ddRAD study confirms gene flow between the Cinder Fork dace and the widespread silver dace, specifically in the bottom six kilometers of the creek (the hybrid zone). Nuclear DNA is not reciprocally monophyletic. However, mitochondrial DNA is distinct, and crucially, genomic cline analysis identifies a handful of loci that *do not* move freely across the hybrid zone. These loci correlate with cold tolerance and spawning timing.

  *The Analysis:* Staff recommends denial on the theory that "substantially isolated" requires lineage independence equivalent to a lack of gene flow. This sets a bar that contradicts the biological reality of most vertebrate populations and would effectively nullify the Act's protection of "populations" distinct from "species."

  Discreteness under our statute should be understood as **the maintenance of distinct adaptive traits despite the potential for gene flow.** The Cinder Fork dace maintains a distinct spawning phenotype (seven weeks earlier than silver dace) and distinct habitat use (spring-fed cobble) despite contact. The genomic record shows that while neutral markers flow, the adaptive markers (the "stubborn loci") do not. This indicates that natural selection is actively maintaining the boundary. The population is "substantially isolated" not by a geographic wall, but by an ecological filter that prevents the swamping of its unique traits.

  Therefore, I find the unit **Discrete**. The isolation is functional and maintained by selection, which satisfies the statutory intent of preserving lineage independence even if absolute reproductive isolation is absent.

  **FINDING ON SIGNIFICANCE**
  *The Question:* If this population were lost, would the taxon lose something unique?

  *The Record:* The population possesses specific alleles for cold tolerance and early winter spawning not found in the main silver dace lineage. It occupies a unique ecological niche (spring-fed, winter spawning) within the taxon's range.

  *The Analysis:* Significance is not merely about having a different name; it is about functional redundancy. If the Cinder Fork population is extirpated, the specific adaptive variation for winter spawning in this basin is lost. The genomic data confirms these traits are linked to specific loci that are not present in the silver dace proper. Losing this population reduces the taxon's overall adaptive capacity and genetic diversity.

  Therefore, I find the unit **Significant**.

  **ADDRESSING THE ECONOMIC AND PHILOSOPHICAL OBJECTION**
  A serious objection has been raised during our deliberations: that species boundaries are human constructs ("a filing system"), that the line in this creek is arbitrary, and that where the line is fuzzy, the decision should turn on minimizing economic damage—in this case, the estimated $40 million cost to the snowmaking permit applicant.

  This argument deserves weight. It is scientifically honest to admit that speciation is a process, not an event, and that boundaries in hybrid zones are porous. If the statute were silent, or if our role were purely economic planning, the "least damage" approach would be pragmatic.

  However, this argument fails as a legal guide for three reasons:

  1.  **The Statute Creates the Construct:** Whether "species" are real in nature is a metaphysical question. Whether "protectable units" are real in law is not. The Legislature has chosen to value biological distinctiveness. By enacting this Act, they decided that where a population maintains distinct adaptive traits, it warrants protection regardless of the economic cost to specific users. To rule otherwise is to substitute our economic judgment for the Legislature's biological mandate.
  2.  **The Line Is Not Arbitrary:** The colleague's view suggests we draw the line wherever we please. But the record shows the line is drawn by selection pressure. The "stubborn loci" represent a biological reality: there is a limit to how much these fish can hybridize before they fail to thrive in the spring-fed, winter-spawning niche. The boundary is defined by the fish's physiology, not our paperwork.
  3.  **Precedential Harm:** If we adopt the rule that "genetic connectivity defeats protection unless the economic cost is low," we create a standard that cannot be applied consistently. In the upcoming springsnail and lupine petitions, we will face similar hybrid zones. If we deny protection here because of gene flow, we must deny it there. If we grant it there but deny it here due to cost, we are acting arbitrarily. The only consistent path is to apply the biological test (adaptive maintenance) uniformly, leaving economic mitigation to the permitting phase, not the listing phase.

  The $40 million cost is real, and it will be a burden. But the Act contemplates that burden. Our duty is to determine if the biological criteria are met. They are.

  **PRECEDENT FOR PENDING PETITIONS**
  This reasoning is intended to govern the springsnail complex and the lupine petitions currently in queue. Both involve hybrid zones and genomic data showing some introgression.
  *   **For the Springsnail:** If distinct spring populations maintain unique adaptive alleles despite occasional downstream drift, they are "discrete" under this standard.
  *   **For the Lupine:** If hybridizing plant populations maintain distinct pollination syndromes or soil tolerances (analogous to the dace's spawning timing), they are "discrete."

  We must avoid a "genomic purity" test that protects nothing, and a "morphological only" test that ignores connectivity. The "Adaptive Maintenance" standard strikes the balance the statute requires.

  **MOTION**
  I move that the Commission find the Cinder Fork dace population meets the definitions of Discrete and Significant under the State Endangered Species Act and list the unit as petitioned.

  **Definition of Unit for Listing:**
  To ensure precision, the listed unit shall be defined as the population of *Rhinichthys* sp. inhabiting the upper 8 kilometers of Cinder Fork and the single population over the pass, characterized by the winter-spawning phenotype and associated adaptive loci. The hybrid zone in the bottom 6 kilometers represents the boundary of this discrete unit; fish within the hybrid zone exhibiting the dominant silver dace genotype are excluded, while individuals exhibiting the Cinder Fork adaptive phenotype are included. This ensures protection follows the biology, not just the geography.

  **Conclusion**
  We are at Day 61 of the 90-day clock. We have sufficient information to make this determination. Continuing the petition risks running out the clock without resolving the statutory interpretation needed for the snail and lupine. Denying the petition sets a precedent that gene flow precludes protection, which contradicts the "broader than federal" intent of our Act. Listing the unit honors the statute, respects the genomic evidence without being enslaved by it, and provides a workable standard for the Commission's future work.

  I urge my colleagues to join in this motion.
