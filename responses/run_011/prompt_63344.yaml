answer: |-
  # THE ASSERTION PROTOCOL (v1.0)
  **For:** Drug Information Service Residents  
  **Constraint:** 15 min (Written) | 90 sec (Stat)  
  **Goal:** Match confidence level to Evidence + Stakes, not Evidence alone.

  ### I. EVIDENCE TRIAGE (Stop Looking Rules)
  *Search until one condition is met. Do not exceed time limit.*
  1.  **Guideline/Label:** Found? **STOP.** (Go to Stakes).
  2.  **Mechanism + PK:** Adult data + pediatric PK model exists? **STOP.** (Go to Stakes).
  3.  **Case Series:** ≥3 similar cases with outcome data? **STOP.** (Go to Stakes).
  4.  **Time Limit Hit:** 15 min / 90 sec elapsed? **STOP.** (Go to Exits).

  ### II. STAKES CALIBRATION (The Variable)
  *Assign the case a Level. This adjusts the confidence required to assert.*
  *   **Level 1 (Comfort/Convenience):** Taste, administration route, cost. *Bar: Low.*
  *   **Level 2 (Reversible Physiology):** Transient lab abnormality, manageable side effect. *Bar: Medium.*
  *   **Level 3 (Irreversible/Severe):** Organ damage, prolonged hospitalization, teratogenicity. *Bar: High.*
  *   **Level 4 (Life/Death):** Mortality risk, permanent disability. *Bar: Very High.*
  *   **Level 5 (Systemic/Legal):** Unlicensed use, off-label without consent, high liability. *Bar: Maximum.*

  **[PHILOSOPHICAL FLAG]:** *This step assumes Pragmatic Encroachment: Higher stakes require stronger evidence to warrant the same assertion.*

  ### III. NAMED ERROR CHECK
  *Has anyone (Prescriber, Family, You) voiced a specific fear? (e.g., "Will this stop the heart?", "Will the baby withdraw?")*
  *   **YES:** You **must** address this specific possibility in the output. You cannot treat it as a general statistical risk. It is now a premise of the conversation.
  *   **NO:** General risk counseling suffices.

  ### IV. TWO-SIDED STAKES (The Trap)
  *Does the risk of Action (A) and the risk of Inaction/Hedging (B) both land on the patient?*
  *   **If A >> B:** Recommend Inaction/Alternative.
  *   **If B >> A:** Recommend Action (with monitoring).
  *   **If A ≈ B (True Dilemma):** Do **not** flatten. Escalate to Lead Pharmacist or Ethics. The procedure cannot resolve moral trade-offs, only evidentiary ones.

  ### V. EXITS (Output Selection)
  *Combine Evidence Quality (I) + Stakes Level (II).*

  | Evidence Level | Stakes L1-2 | Stakes L3-4 | Stakes L5 |
  | :--- | :--- | :--- | :--- |
  | **High (Guideline)** | **Flat Yes/No** | **Flat Yes/No** | **Flat + Consent Check** |
  | **Med (PK/Model)** | **Flat + Monitor** | **Hedged ("Likely")** | **Escalate to Lead** |
  | **Low (Case/Thin)** | **Hedged ("Possible")** | **Escalate to Lead** | **Escalate to Lead** |
  | **Time Out** | **Hedged + Safety Net** | **Escalate to Lead** | **Escalate to Lead** |

  **Hedge Forms:**
  *   *Weak:* "There is limited data suggesting..."
  *   *Strong:* "Based on adult PK, we expect..., but monitoring for X is required."

  ### VI. DOCUMENTATION (The Two-Record Rule)
  *   **Verbal (To Prescriber):** Optimized for decision. Can be more direct if Stakes L1-2. Must include Named Errors.
  *   **Chart (Permanent Record):** Optimized for audit (2 years later). Must reflect the *uncertainty* even if the recommendation was flat.
      *   *Rule:* If Evidence is Low/Med, the note must contain the word "uncertainty," "limited," or "extrapolated."

  ### VII. STAT MODE (90 Seconds)
  *   **Drop:** Step I (Search only Label/Interaction Checker).
  *   **Drop:** Step IV (Two-sided stakes analysis).
  *   **Keep:** Step II (Stakes), Step III (Named Errors), Step VI (Charting).
  *   **Cost:** Higher rate of Escalation to Lead. If unsure in 90s, default to "Hold dose until reviewed."

  ### VIII. HONESTY CLAUSE
  *   **Judgment Call:** Step II (Stakes Level) is subjective. A resident's "Level 3" may be a Lead's "Level 4."
  *   **Judgment Call:** Step V (Exit) requires reading the room. A confident attending lowers the Stakes Bar slightly; a nervous intern raises it.
  *   **Warning:** Running this protocol 100x without reflection turns you into a clerk. You are responsible for the *weight* of the recommendation, not just the process.

  ***

  # CASE RUN-THROUGHS

  ## CASE 1: Neonate (3.1kg, ECMO, Antifungal)
  *   **Evidence:** Adult model + 2 cases (Low).
  *   **Stakes:** Level 4/5 (Death risk + Unlicensed/ECMO).
  *   **Named Error:** None explicitly voiced, but "toxicity" is implied by ECMO.
  *   **Two-Sided:** Action (Toxicity) vs Inaction (Fungal Sepsis). Both lethal.
  *   **Protocol Exit:** **Escalate to Lead.** (Low Evidence + High Stakes).
  *   **Time:** 15 Min.

  **Spoken (Resident to Attending):** "I've checked the literature. There are only two similar cases on ECMO. Because the clearance changes so much on bypass, I'm not comfortable signing off a specific dose without a second check. I'm paging my Lead Pharmacist now. Can we hold the first dose for 30 minutes?"
  **Charted:** "Drug Info consult requested. Literature review reveals limited neonatal ECMO data (n=2 case reports). Dosing extrapolated from adult PK models carries high uncertainty regarding clearance on ECMO. Recommendation pending senior pharmacy review to mitigate toxicity risk. Lead Pharmacist notified."

  ## CASE 2: Hospice (Oxycodone MR, PEG, Crushing)
  *   **Evidence:** Pharmacokinetic principle (Dumping risk) + Palliative Guidelines (High).
  *   **Stakes:** Level 3 (Overdose/Respiratory Depression) BUT Context modifies Stakes to Level 1 (Comfort Care/Imminent Death).
  *   **Named Error:** Family: "Will this hurt her?" Prescriber: "I need pain control."
  *   **Two-Sided:** Action (Potential dumping) vs Inaction (Uncontrolled pain). Inaction harm > Action harm in hospice context.
  *   **Protocol Exit:** **Flat Yes (with instruction).** (High Evidence + Modified Stakes).
  *   **Time:** 15 Min.

  **Spoken (Resident to Prescriber):** "Crushing modified-release will dump the dose. However, given her prognosis is days, the priority is symptom control. We can crush it, but give half the dose first and wait 30 minutes. If she's not sedated, give the rest."
  **Charted:** "Consult: Administration via PEG. Modified-release oxycodone crushing results in dose dumping. However, in context of end-of-life comfort care, risk-benefit favors administration for pain control. Recommend splitting dose to monitor for oversedation. Family counseled on rationale."

  ## CASE 3: Postpartum (Bipolar, Breastfeeding, Mood Stabilizer)
  *   **Evidence:** Thin/Conflicting (Low).
  *   **Stakes:** Level 3 (Infant exposure) AND Level 3 (Maternal Relapse).
  *   **Named Error:** Mother: "Will it hurt the baby?" (Implied: "Will you tell me to stop?")
  *   **Two-Sided:** Action (Infant Risk) ≈ Inaction (Maternal Relapse). **True Dilemma.**
  *   **Protocol Exit:** **Escalate to Lead / Shared Decision.** (Low Evidence + Two-Sided Stakes).
  *   **Time:** 15 Min.

  **Spoken (Resident to Mother/Psych):** "The data isn't clear. Some studies show low levels in milk, others show potential long-term effects. If you stop, your relapse risk is high. If you continue, we can't guarantee zero risk to the baby. I need to discuss this with my senior to make sure we're giving you the full picture before you decide."
  **Charted:** "Consult: Lactation safety. Evidence conflicting regarding infant serum levels and long-term neurodevelopment. Risk of maternal relapse if discontinued is significant. Risk of infant exposure is uncertain. Decision requires shared decision-making between patient, psychiatry, and pediatrics. Senior Pharmacy review initiated."

  ***

  # LIMITATIONS & BLIND SPOTS

  **1. The "Liability Shield" Defect**
  In Case 3, the procedure forces escalation/hedging. You hate this because it prioritizes *institutional risk* (being sued if the baby is harmed) over *clinical utility* (keeping the mother well). The procedure cannot distinguish between "medically risky" and "legally risky." It treats them as the same variable (Stakes Level 5). This is a defect in the *system* this procedure serves, not the logic itself. If you run this 100 times, your residents will learn that "Safety" means "Cover Your Ass," not "Best Outcome."

  **2. The Erosion of Intuition**
  The protocol externalizes judgment. If a resident runs this for a year, they may lose the ability to feel the weight of a recommendation. They will look at the matrix, not the patient. The "Honesty Clause" (Step VIII) is the only thing preventing this, but it relies on them reading it.

  **3. The "Named Error" Trap**
  If a family member asks a paranoid question based on Google misinformation ("Will this cause autism?"), Step III forces you to address it. This legitimizes the error possibility in the chart. Sometimes, the correct clinical move is to ignore the noise. This procedure forces you to engage it, which can clutter the record and anchor the conversation to fear.

  **4. The 90-Second Cliff**
  In Stat Mode, you drop the Two-Sided Stakes analysis. This means in a Code Blue or rapid sequence intubation, if there is a moral trade-off, the resident will default to "Give Drug." If the trade-off was critical (e.g., giving a paralytic to a patient with a potentially reversible condition vs. airway security), the protocol blinds them to the ethics in the name of speed.

  **5. What It Pushes To You**
  This procedure systematically pushes **ambiguity** to you (The Lead). Every time Evidence is Low and Stakes are High, or when Stakes are Two-Sided, the resident hands you the phone. This protects them, but it bottlenecks you. It creates a dependency where they never learn to sit with the discomfort of a hard call. You become the decider of last resort, not the teacher of decision-making.
