      *   *Correction:* No, that's dismissive. It's relevant for risk assessment. If you can't justify trust, you can't deploy safely. But the *solution* differs.
      *   *Clarification on "Measurement Okay / Epist Bad":* This is the hardest part. How can measurement be okay if epistemology is bad?
      *   *Explanation:* Measurement is about the *properties of the estimator*. Epistemology is about the *agent's right to believe the estimator*. You can have a valid estimator (Measurement Okay) but arrive at it via a question-begging path (Epist Bad). Example: You assume the Judge is perfect to prove the Bot is good. The math holds *if* the assumption holds. But you have no warrant for the assumption.
