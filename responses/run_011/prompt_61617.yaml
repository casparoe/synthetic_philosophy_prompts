      *   **Specific Examples:** Jumping spiders (no oversight) vs. Zebrafish (oversight), Cephalopods (treated as vertebrates), UK Sentience Act (Decapods included, Insects excluded), Zebrafish 7-day rule, Religious/Cultural deference clauses.
