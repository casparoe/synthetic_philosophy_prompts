      *   *Strictly:* You must act *as if* X is sentient.
      *   *Not Required:* You must believe X *is* sentient.
      *   *Compatible Theories:* Utilitarianism, Rights-based (partial), Contractarianism (indirect duties), Administrative Pragmatism.

  11. **Refining the "Spider Exemption" conclusion:**
