      *(Final Polish)*: Ensure the tone matches the user's intellectual level. They are sophisticated. Don't dumb it down. Use terms like "proxy," "operational definition," "moral status," "precautionary principle."

      *(Check on UK Law)*: The Animal Welfare (Sentience) Act 2022 established the Animal Sentience Committee. It applies to *government policy*, not individual researchers directly (that's ASPA 1986). The user noted this discrepancy (crabs sentient in policy, not research). I need to explain that lag/fragmentation.

      *(Check on ISEF)*: ISEF rules align with US Public Health Service Policy which focuses on vertebrates. Cephalopods were added later due to specific scientific advocacy (Cambridge Declaration on Consciousness etc.).

