          *   *Assumption:* Phylogeny correlates with sentience capacity. Cephalopods are the "exceptional invertebrates."
          *   *Zebrafish 7-day:* Assumes neural development markers (free-feeding, neural complexity) map to moral status onset.
      *   **UK Law (Animal Welfare (Sentience) Act 2022 vs. Animals (Scientific Procedures) Act 1986):**
          *   *ASPA (1986):* Vertebrates + Cephalopods. (Research focus).
          *   *Sentience Act (2022):* Vertebrates + Cephalopods + Decapods. (Policy focus).
          *   *Gap:* Crabs are sentient in policy but not protected in research.
          *   *Deference Clause:* Sentience is a *consideration*, not a *trump card*. It can be outweighed by culture/religion.
      *   **The "Line Drawing" Problem:**
          *   Why Decapods but not Insects? Decapods have more complex nervous systems (ganglia closer to centralization), nociception evidence is stronger/more recent (LSE report 2021). Insects are abundant, agricultural pests, harder to regulate.
          *   *Assumption:* Sentience is binary (on/off) or at least threshold-based, and taxonomy is a reliable proxy for that threshold.

  3.  **Address the "Strictly Require vs. Fits Comfortably" Distinction:**

      *   *Strict Requirement:* The rules *do not* require you to believe insects are insentient. They only require you to treat them *as if* they are for regulatory purposes. This is a pragmatic/administrative stance, not necessarily an ontological one.
      *   *Fits Comfortably:* A gradient theory of consciousness where vertebrates/cephalopods/decapods are "high enough" to matter legally.
      *   *Loose Enough:* A utilitarian cost-benefit analysis could produce the exact same rules without believing *any* animal has rights, just that regulating some causes too much economic friction.

  4.  **Analyze the "Cephalopod as Vertebrate" Fiction:**

      *   *Presupposition:* It acknowledges the regulatory framework is vertebrate-centric. It's a "legal hack" to extend protection without rewriting the whole definition of "animal." It prioritizes protection over taxonomic accuracy.

