answer: |-
  0.62. That is my credence that grounding is well-founded, meaning every chain bottoms out in ungrounded facts. To get there I broke the claim down into the four components you asked for, assigning a probability to each condition being met given the previous ones hold. First, I assign a 0.9 probability that there is a single substantive grounding relation rather than a grab-bag of determination relations. While pluralists make a strong case that realization, truthmaking, and set membership are distinct, the theoretical utility of a unified concept of metaphysical dependence is high enough that I lean toward monism. Second, given that there is such a relation, I assign a 0.95 probability that it is irreflexive, asymmetric, and transitive. These structural features are built into the standard definition of grounding, and while counterexamples are proposed, they usually dissolve upon closer inspection of the relata. Third, given that structure, I assign a 0.8 probability that infinite descending chains are metaphysically impossible. This is the crux of the matter. Metaphysical gunk is conceivable, but conceivability is a weak guide to possibility, and the structural complexity of an infinite ontological hierarchy strikes me as less likely than a finite base. Fourth, I assign a 0.9 probability that an endless regress actually leaves things unexplained. If every fact is grounded but the chain never ends, nothing is fundamentally explained, which violates the explanatory role grounding is supposed to play. I am combining these by multiplying them as a chain of conditional probabilities, which reflects the idea that if any link fails, the claim that grounding is well-founded fails. The final figure is most sensitive to the third term, the possibility of gunk. If you convince me that infinite chains are metaphysically coherent and possible, my credence drops below 0.5, regardless of the other factors.

  Regarding your friend's move, I would shift my number down by only about 0.05 based on that argument. The step from physics might not have a bottom to grounding might not have a bottom is not legitimate because those claims are not about the same subject matter. Physics deals with causal and nomological dependence within the natural world, tracking how composite systems behave based on their constituents and laws. Grounding deals with metaphysical constitution and ontological priority, asking what exists in the most fundamental sense. It is entirely consistent to hold that physics could descend infinitely through smaller scales of particles or fields while metaphysics bottoms out at a specific ontological category, or vice versa. Your friend is trading on the shared metaphor of depth to conflate empirical regress with metaphysical regress. The lack of evidence for a shortest length scale is an empirical limitation, not a metaphysical proof of infinite divisibility. Even if space-time is gunky, the facts about that space-time might be grounded in a finite set of non-spatial fundamental entities. So while his point is scientifically prudent, it does not bear directly on the metaphysical structure of grounding, and treating it as such category-errors the debate.
