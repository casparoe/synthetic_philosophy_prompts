      *   *Correction:* Ensure Position C isn't just "Pos A but weaker." It needs to be about *Runtime State* vs. *Spec*.
      *   *Tone:* Professional, engineering-focused, direct. No "philosophy speak."

  8.  **Final Output Structure:**
      *   Translation of A, B, C.
