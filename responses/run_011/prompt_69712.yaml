      *   *Substance of Disagreement:* Is it verbal? No. It's about where the "Source of Truth" lives. Is it the Schema (A) or the Row Data (B)?
      *   *Trap Mappings:*
          *   *Lease:* A lease implies a timeout. Dementia isn't a timeout; it's a state change.
          *   *Fork:* A fork implies both versions continue. Dementia replaces the prior version.

  5.  **Refining the "Stand" and "Epistemic Request":**
      *   I need to be decisive.
