answer: |-
  ### Desiderata for a Normative Account of Conditional Belief

  **1. Inference Patterns**
  *   **Modus Ponens (MP):** From $A$ and $A \to C$, infer $C$.
      *   *Motivation:* Essential for deliberation; if an agent believes the antecedent and the conditional, they must be committed to the consequent to act coherently.
      *   *Verdict:* **Non-negotiable.** Without MP, the conditional cannot guide action.
  *   **Contraposition (CP):** From $A \to C$, infer $\neg C \to \neg A$.
      *   *Motivation:* Logical symmetry and classical equivalence.
      *   *Counterexample:* "If Oswald didn't kill Kennedy, someone else did" seems true, while "If someone else didn't kill Kennedy, Oswald did" seems false (given we know Kennedy was killed).
      *   *Verdict:* **Camp Commitment.** Rejected by most accounts of indicative conditionals to preserve intuitive truth-values; accepted for subjunctives.
  *   **Transitivity (Hypothetical Syllogism):** From $A \to B$ and $B \to C$, infer $A \to C$.
      *   *Motivation:* Chaining reasoning steps.
      *   *Counterexample:* McGee cases (e.g., regarding election outcomes) where accepting the premises makes the conclusion feel uncertain.
      *   *Verdict:* **Camp Commitment.** Often rejected for indicatives to preserve the Equation and MP.
  *   **Import-Export (IE):** $(A \land B) \to C$ is equivalent to $A \to (B \to C)$.
      *   *Motivation:* Allows iterated conditioning and simplifies probability calculations.
      *   *Verdict:* **High Tension.** While intuitively strong, it creates severe conflict with truth-conditional semantics and probability constraints (Hájek's triviality).

  **2. Probability Constraints**
  *   **The Equation (Adams' Thesis):** $P(A \to C) = P(C|A)$.
      *   *Motivation:* Captures the robust intuition that the believability of a conditional matches the conditional probability.
      *   *Verdict:* **Non-negotiable.** This is the core datum for a probabilistic account of conditional belief.
  *   **Dynamic Stability:** The Equation must hold after conditionalizing on arbitrary new evidence $E$ (i.e., $P_E(A \to C) = P_E(C|A)$).
      *   *Motivation:* Rational learning should not break the link between conditional belief and conditional probability.
      *   *Verdict:* **Non-negotiable.** Required for the account to model belief revision.
  *   **Non-Triviality:** The agent's credal space must allow for non-extreme probabilities (values other than 0 or 1) for multiple independent propositions.
      *   *Motivation:* Agents are uncertain; a normative theory for ideal agents must still apply to non-omniscient ones.
      *   *Verdict:* **Non-negotiable.** A theory that only works for omniscient agents is useless for deliberation.

  **3. Usage and Deliberation Data**
  *   **Assertability:** An agent should assert $A \to C$ only if $P(C|A)$ is high.
      *   *Motivation:* Matches linguistic practice and norms of assertion.
      *   *Verdict:* **Non-negotiable.**
  *   **False Antecedents:** An agent can hold a conditional belief even if $A$ is false, provided $A$ is not *known* to be false.
      *   *Motivation:* We reason about what we take to be false (e.g., "If I had left earlier...").
      *   *Verdict:* **Non-negotiable.** (Distinguishes indicatives from material conditionals).
  *   **Relevance/Connection:** The conditional is infelicitous if there is no relevant connection between $A$ and $C$, even if $P(C|A)$ is high by accident.
      *   *Motivation:* "If France is in Europe, this match lights" is not a usable belief for deliberation.
      *   *Verdict:* **Non-negotiable.** Required for the "usable in deliberation" constraint.

  ***

  ### The Inconsistent Subset and the Necessary Choice

  The minimal subset of requirements that cannot be jointly satisfied consists of: **(1) The Equation, (2) Dynamic Stability, (3) Non-Triviality, and (4) The assumption that the conditional expresses a proposition (Truth-Conditionality).**

  This is the force of **Lewis's Triviality Results**. Lewis proved that if a conditional $A \to C$ denotes a proposition in the agent's algebra of belief, and its probability is always equal to the conditional probability $P(C|A)$ (even after updating on new evidence), then the agent's credences must be trivial (restricted to 0 and 1). Since Non-Triviality is required for any agent capable of uncertainty, one of the other three must go.

  **The Assumption Doing the Work:**
  The culprit is **Truth-Conditionality** (Requirement 4). The mathematical proof relies on the conditional being an object of credence that behaves like a standard proposition within the probability space (e.g., allowing for conjunctions and negations in the standard way).

  **The Single Requirement to Weaken:**
  To buy the most while leaving the rest intact, one must **weaken Truth-Conditionality**. By adopting a view where conditionals do not express standard propositions (e.g., Adams' probabilistic semantics) or where they function as operators that restrict the domain of evaluation rather than denoting propositions themselves (Restrictor views), one preserves The Equation, Dynamic Stability, and Non-Triviality. This allows the account to remain usable in deliberation (via conditional credences) without collapsing into triviality.

  **Idle Requirement:**
  **Contraposition** turns out to be doing no work in the inconsistency proof. The triviality results hold regardless of whether the logic validates contraposition. Since it is already classified as a "camp commitment" to reject for indicatives, its status does not impact the mathematical impossibility of the core probabilistic constraints.

  ***

  ### Account Evaluations

  **Material-Conditional Treatment:** Fails Non-Triviality and Usage Data; it validates the Equation only when $P(A)$ is high, and renders conditionals with known false antecedents vacuously true, making them useless for deliberation.

  **Selection-Semantics (Truth-Conditional):** Saves Truth-Conditionality and MP but must reject The Equation or Non-Triviality; Lewis's result shows it cannot sustain the link between conditional belief and conditional probability for uncertain agents.

  **Non-Truth-Conditional (Adams/Edgington):** Saves The Equation and Non-Triviality by denying Truth-Conditionality; however, it struggles with the "deliberation" constraint, as it is unclear how to act on or embed entities that lack truth conditions.

  **Contextualist/Restrictor (Kratzer/Yalcin):** Saves The Equation and Non-Triviality by treating the conditional as a syntactic restrictor on a modal operator rather than a binary connective; it preserves deliberative utility but requires revising the logical form of the doxastic state.
