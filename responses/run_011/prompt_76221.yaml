  Elias Thorne tapped the 1911 contractor's ledger with a pencil, the dust motes dancing in the shaft of light from the record office window. "It's the landslide, Sarah. It's the contingent event. If the rail pass doesn't close in '11, the standard gauge comes through. Instead, we get the narrow gauge contractor because he's the only one with stock available before the autumn harvest. That's the branching point."

  Sarah Vance didn't look up from the Ministry of Transport files spread across her side of the table. "And yet, forty years later, you're telling me that one season of delay dictated the economic fate of Ferrymouth until 1958? That's a long shadow for a landslide."

  "It's not just the track," Elias insisted. "Look at the physical lock-in. The dockside crane spans were built to narrow gauge clearances. The warehouse door widths. The turning circles at the two big mills. Even the plot boundaries on the eastern industrial estate were subdivided to fit the tramway's reach. You can't just swap the rails without rebuilding the town."

  "Can't you?" Sarah finally looked up, sliding a file across the table. "Kessing. Twenty miles up the coast. They made the standard-gauge choice in the same year, under similar pressure. By 1957, Kessing was lorry-dominated. Ferrymouth went to lorries in 1958. If gauge was the determinant, why did Kessing abandon standard gauge just as quickly?"

  "Because Kessing didn't have the same physical constraints," Elias said, leaning forward. "Kessing's industrial estate was greenfield. They didn't have warehouse doors sized for narrow-gauge wagons. They didn't have mill turning circles that required specific shunting maneuvers. Comparing Ferrymouth to Kessing ignores the sunk costs in brick and mortar. The gauge choice locked in the architecture."

  Sarah tapped the 1953 engineer's report sitting between them. "Then explain this. The tramway company's own engineer recommends conversion to standard gauge. It's four pages long. He says it's technically feasible. The board turns it down as too expensive. But look at the text—he mentions road haulage exactly twice. In 1953, the engineer is still thinking in rails. The board knew the game was up. The collapse of the coastal coal trade and the regional road-building programmes meant lorries were winning regardless of gauge. The 1953 report isn't evidence of a closed path; it's evidence of management denial."

  "It's evidence that the alternative path was genuinely open," Elias countered. "If the board had converted in '53, they could have utilized the new road subsidies while keeping the rail efficiency. Instead, they waited until '58 when the rip-out was total. That five-year lag is the cost of the lock-in."

  "This is where I lose you," Sarah said, closing the file. "You're treating the 1953 decision as if the only variable was gauge. But you're holding technology fixed. You're saying 'if they converted to standard gauge, they keep the rail system.' But lorry technology was improving exponentially. Diesel engines, better tires, the national highway network. To claim lock-in, you have to prove that a standard-gauge Ferrymouth would have retained rail freight in 1958. Kessing suggests they wouldn't have."

  "Kessing is a single data point," Elias snapped. "You're building a theory of inevitability on one neighbouring town. What if Kessing's coal trade collapsed two years earlier? What if their road subsidies arrived sooner? You're treating 'lorries' as a force of nature rather than a policy outcome."

  "Fine," Sarah said, her voice sharpening. "Let's get into the weeds. What would the record office have to turn up for you to concede? What document proves the gauge mattered?"

  "A cost-benefit analysis from 1953," Elias said immediately. "If the board's minutes show they rejected conversion because the physical retrofits—those crane spans, those door widths—made the conversion cost higher than the lorry transition cost, then I'm wrong. But if they rejected it because of the rail infrastructure alone, ignoring the building constraints, then the 1911 decision forced their hand. The lock-in is in the buildings, not the tracks."

  "And for me?" Sarah asked. "I need the counterfactual specified. You're saying 'if 1911 goes differently, Ferrymouth keeps rail.' But what are you holding fixed? Are you holding the 1950s road subsidies fixed? Are you holding the coal trade collapse fixed? If you change 1911, do you assume the regional planning committee still prioritizes roads in 1950? If you hold the macro economics fixed, then Kessing is the control group, and the outcome is overdetermined."

  "That's the problem with your method," Elias said, rubbing his temples. "You're saying 'the same outcome would have arrived anyway' is a testable claim. But it's not. It's a way of dressing up what did happen as inevitable. You can't test a ghost. To test my claim, you need to isolate the marginal cost of the gauge conversion versus the lorry transition. If the narrow gauge added even ten percent to the conversion cost, that's the lock-in tax. The 1911 landslide imposed a tax on the future."

  "But is ten percent enough to change the outcome?" Sarah pressed. "If the lorry technology curve is steep enough, a ten percent tax doesn't matter. That's why I'm sick of these path dependence arguments. It's always QWERTY keyboards or VHS tapes. Real infrastructure has gravity. The road network was being poured in concrete while Ferrymouth was worrying about turning circles. The physical layout matters less than the network effect."

  "Then prove the network effect outweighed the local constraint," Elias said. "Show me that a standard-gauge Ferrymouth would have secured the same road subsidies as a lorry terminal. Maybe the tramway kept the freight on rail longer, which changed the lobbying power of the merchants. Maybe the lock-in preserved a rail culture that delayed the lorry transition. You're assuming the outcome is binary: rail or lorry. But the timing matters. Five years of rail freight is economic activity."

  Sarah paused, picking up her pen. "So you're refining the claim. It's not that Ferrymouth stayed rail forever. It's that the 1911 event delayed the transition to lorries by five years, at a cost of efficiency?"

  "I'm saying the 1911 event constrained the *mode* of transition," Elias said. "They didn't choose lorries because lorries were optimal in 1953. They chose lorries in 1958 because the narrow gauge made conversion too expensive *then*. If they were standard gauge in 1953, maybe they convert rail. Maybe they don't. But the 1953 report shows they considered it. The option value existed. Kessing didn't have that option value because their physical layout didn't penalize conversion, yet they still went to lorries. That suggests the pressure was immense. But immense pressure doesn't mean identical choices."

  "So what's the concession?" Sarah asked. "If I find a memo saying the board considered the building constraints negligible?"

  "Then I concede the lock-in was financial, not physical," Elias said. "But if you find a memo saying the road subsidies were contingent on removing the tramway entirely, regardless of gauge?"

  "Then I concede the outcome was policy-driven, not tech-driven," Sarah admitted. She sighed, looking at the boxes of uncatalogued minutes between them. "But we're arguing about what variables to hold fixed in a world where everything changes. You want to hold the buildings fixed and change the gauge. I want to hold the economics fixed and change the town. Neither of us can run the simulation."

  "No," Elias said, opening the 1911 ledger again. "But we can stop calling it inevitable. The 1953 report exists. Someone thought differently. That's enough to break the determinism."

  "Enough to break it," Sarah said, opening her transport files. "But not enough to prove the alternative would have survived. Let's keep digging."
