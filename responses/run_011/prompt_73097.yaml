answer: |-
  The Civil Liberties Act of 1988 presupposes a theory of **political recognition and symbolic reparation** rather than strict corrective justice. In strict corrective justice, the remedy must be proportional to the specific harm suffered by the individual to restore the *status quo ante*. By abandoning proof of loss and issuing a flat sum, the Act treats the injury not primarily as an aggregate of economic deprivations, but as a uniform violation of constitutional standing and civic dignity shared by the class. The state accepts responsibility not merely for damages, but for the moral breach of the social contract.

  **Strict Requirements vs. Good Fit**
  The flat sum and dropped proof-of-loss requirement do not *strictly require* a dignitary theory; they are compatible with a pragmatic compensatory theory. An ordinary compensatory theorist could argue that after 40 years, evidence decay makes individualized assessment impossible, and administrative costs would consume the reparations fund. A flat sum acts as a statistical proxy for average loss. However, these features *fit well* with, and are strongly suggestive of, a dignitary view because the legislation explicitly paired the money with an apology and education fund. If the goal were purely economic compensation, the apology would be superfluous; if the goal were purely administrative efficiency, the specific framing of "racial prejudice" would be unnecessary. The combination commits the program to the view that the injury is partly dignitary, but the specific mechanism (flat sum) remains underdetermined—it could be either a proxy for loss or a token of acknowledgment.

  **Ancestry vs. Racial Prejudice**
  The statute defines the victim class by ancestry while naming racial prejudice as the wrong because ancestry was the *operational mechanism* of the prejudice. While the moral wrong was the state's racial animus, the legal injury was inflicted through ancestry-based classification. Defining the class by ancestry creates an administrable proxy for having been the target of that specific systemic prejudice. To require proof of individual prejudice would be impossible; to define the class by confinement alone might include non-Japanese detained for other reasons (e.g., enemy aliens of other nationalities). Ancestry isolates the group targeted by the specific racial prejudice the statute seeks to rectify. It acknowledges that the prejudice was not random but structurally directed at a specific lineage.

  **Underdetermined Features**
  Several features are philosophically underdetermined, licensed equally by expressivist, pragmatic corrective-justice, and forward-looking civic accounts:
  1.  **Limiting eligibility to survivors (excluding descendants):**
      *   *Expressivist:* Honors the specific generation that endured the humiliation.
      *   *Pragmatic:* Caps liability and ensures funds are available for the direct victims.
      *   *Civic:* Restores the political standing of the voters/citizens directly disenfranchised by the camps.
  2.  **Payment from the federal treasury (rather than private beneficiaries):**
      *   *Expressivist:* The state, as the moral agent that ordered the camps, must offer the apology.
      *   *Pragmatic:* Private litigation would be too complex and contentious to pass.
      *   *Civic:* Reaffirms that the protection of rights is a federal guarantee, restoring trust in the central government.

  **Beneficiaries and Design Changes**
  If the view were held that neighbors and competitors who bought confiscated property owed the repair (based on unjust enrichment rather than state responsibility), the design would require fundamental structural changes, not just rhetorical ones.
  1.  **Adjudicative Mechanism:** Instead of a statutory grant, there would need to be a restitution tribunal to trace property titles and identify "distress price" purchases.
  2.  **Liability Structure:** The cost would shift from the treasury to specific private actors, likely requiring liens, claw-backs, or forced disgorgement of profits.
  3.  **Scope:** The class of payers would be diffuse and potentially insolvent, likely necessitating a hybrid model where the state pays first and subrogates against beneficiaries.
  Under this view, the current Act is incomplete because it allows private unjust enrichment to stand while socializing the cost of the wrong.

  **Confidence and Uncertainty**
  I hold least confidently the interpretation of why the class was defined by ancestry rather than confinement alone (excluding non-Japanese enemy aliens). My reconstruction assumes this was to isolate racial prejudice, but it is possible this was merely a political compromise to limit the number of claimants. Evidence from legislative committee debates regarding the exclusion of German or Italian internees would move me to a different verdict; if those debates focused on loyalty rather than race, my claim about the "mechanism of prejudice" weakens. My reconstruction is most likely to have gone wrong by attributing a coherent philosophical theory to a legislative process that was likely driven by competing political interests, where the "dignitary" features were rhetorical cover for a budget-conscious settlement.
