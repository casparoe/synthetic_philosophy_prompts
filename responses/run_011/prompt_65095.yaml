  **REPUBLIC OF VESPRIA**
  **COMMISSION FOR NARRATIVE RECONCILIATION AND IMMUNITY ALLOCATION (CNRIA)**
  **FORM 88-B: INCIDENT-SPECIFIC AMNESTY CLAIM (POST-CONFLICT WINDOW)**

  **INSTRUCTIONS TO APPLICANT:** *Please complete in triplicate. Use black ink. Do not minimize your role; vagueness reduces your Disclosure Completeness Score (DCS). Remember: Immunity is not binary. It is proportional.*

  **SECTION 1: APPLICANT PROFILE**
  1.1 Full Name: _________________________________________________
  1.2 Unit Affiliation (1990-1995): __________________________________
  1.3 Age at time of incident: [ ] 18+ [ ] 15-17 [ ] Under 15*
  1.4 Current Psychological Status: [ ] Stable [ ] Remorseful [ ] Fragmented

  * *If under 16, DCS weighting is adjusted by factor 0.8 to account for coercive recruitment, though moral liability remains fully accrued in the Contingent Reserve.*

  **SECTION 2: INCIDENT PARTICULARS (THE "BAD NIGHT")**
  2.1 Date of Incident: ____/____/1994
  2.2 Location (Grid Ref preferred): _________________________________
  2.3 Nature of Act:
  [ ] Interrogation [ ] Disposal [ ] Direct Engagement [ ] Logistics Support
  2.4 Memory Gaps: If you genuinely cannot recall specific acts of violence, tick box [ ] **I DO NOT REMEMBER**.**
  * *Instruction: Tick only if medically verified. Feigned amnesia results in automatic DCS cap of 40%.*

  **SECTION 3: DISCLOSURE COMPLETENESS SCORE (DCS) CALCULATION**
  3.1 Please estimate the percentage of total truth you are providing regarding this incident.
  [ ] 1-50% (Low Cooperation)
  [ ] 51-89% (Substantial Cooperation)
  [ ] 90-100% (Full Narrative Integration)

  3.2 **Bonus Points:** You may increase your DCS by 5% per named superior officer implicated in the chain of command.***
  * *Note: Naming a commander does not guarantee their prosecution, but it solidifies your own immunity percentage.*

  3.3 **Public Hearing Waiver:** If your self-assessed DCS is above 90%, you may request a private hearing. Be advised: Families of the deceased often attend public hearings to contest score accuracy. A successful contest by victims may lower your DCS retroactively.

  **SECTION 4: LIABILITY HOLDING ACCOUNT****
  4.1 Based on your DCS, the remaining percentage of criminal liability (e.g., if DCS is 61%, Liability is 39%) shall be deposited into the CNRIA Contingent Liability Reserve.
  4.2 This liability remains dormant unless:
  a) New evidence surfaces increasing your actual guilt.
  b) Two applicants claim 100% responsibility for the same killing.****
  c) The political climate shifts requiring recalibration.
  4.3 You will be notified by post if your Holding Account is activated for prosecution.

  **SIGNATURE BLOCK**
  I acknowledge that truth is a commodity and immunity is its receipt. I understand that a 61% immune man is still 39% a murderer, but only when the lights are on.

  Applicant Signature: ___________________ Date: _______________
  Commission Officer: ___________________ Stamp: [PENDING VERIFICATION]

  ***

  **FOOTNOTES & LEGAL ADVISER NOTES**

  * **Legal Adviser Note (Section 1.3):** *Adviser J. Kovic argues that child soldiers lack mens rea and should receive 100% automatic immunity. Adviser L. Sarno contends that granting full immunity removes the "educational value" of partial liability. Compromise reached: They are immune from prison but must attend 39% of a rehabilitation program.*

  ** **Legal Adviser Note (Section 2.4):** *The definition of "Memory" is contested. Adviser Sarno insists memory is subjective and thus unverifiable, making it poor evidence. Adviser Kovic counters that in a Truth Commission, subjective memory is the only evidence we have. Please tick box confidently.*

  *** **Legal Adviser Note (Section 3.2):** *Warning: If you name a commander who is already dead, you receive 0% bonus points. If you name a commander who is currently serving in the new government, your application may be "misplaced."*

  **** **Legal Adviser Note (Section 4.1):** *The concept of a "Liability Holding Account" has no basis in Vesprian Penal Code. However, the Commission requires a mechanism to store unprosecuted guilt without deleting it. Think of it as a tax on conscience.*

  ***** **Legal Adviser Note (Section 4.2b):** *In the event of overlapping claims (two shooters confessing to the same bullet), the DCS of both applicants will be halved to prevent inflation of the truth market. Both parties will share the liability equally.*
