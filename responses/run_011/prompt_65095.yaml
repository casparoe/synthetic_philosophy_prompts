prompt: |-
  ok here's what I want. write me a parody of an amnesty application form from a fictional truth commission — invent the country, post-civil-war, doesn't matter which — as it would be handed to an ex-paramilitary guy applying for immunity over one particular bad night in 1994. About 800 words, laid out like a real form: numbered sections, checkboxes, little italicised instructions to the applicant, and at least three footnotes where the commission's own legal advisers are visibly arguing with each other.

  the thing I want you to actually build the jokes out of, not just mention: this commission has ditched the yes/no amnesty decision in favour of a Disclosure Completeness Score. you get immunity proportional to how much you told them. 61% disclosed means 61% immune, and the remaining 39% of your criminal liability goes into a holding account that reopens whenever new facts surface. take that mechanism dead seriously and let it generate the texture of the document — what happens when two applicants' scores overlap on the same killing, whether you can buy back points by naming your commander, whether the score is appealable and to whom, what the public hearing is like for a man who arrives already at 90%, what the form asks of someone who was fifteen at the time, what box you tick if you genuinely don't remember.

  it should read as if the commission is sincerely trying to be fair and healing and procedurally immaculate. the satire comes from the form working exactly as designed. the objections should land without ever being named or hinted at in commentary — that only the applicant knows which facts are relevant, that a man weeping on camera in front of a family that never agreed to any of this hasn't been forgiven by anyone, that a truth-commission bargain trades a prosecution for a record nobody can check.

  don't name any real country, real commission, or real person, and don't cite or recommend anything — no sources, no further reading, it's a form not an essay. it should be funny to someone who works on transitional justice and totally followable to someone who's never heard of it. keep the register bureaucratic-therapeutic throughout and dont break character at the end to explain the joke — the signature block should do that work instead.
