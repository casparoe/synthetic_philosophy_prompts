answer: |-
  **Project Title:** Stability Under Admissible Expansion: A Formal Explication of Keynesian Weight for High-Consequence Risk Reporting

  **Summary**
  This project seeks to explicate John Maynard Keynes's distinction between the *probability* of a hypothesis relative to evidence and the *weight* of that evidence. While probability measures the balance of argument, weight measures the completeness of the evidence upon which that balance rests. Current risk-regulation frameworks conflate these dimensions, populating confidence columns with unjustified numerals. This project tests the hypothesis that weight is best understood modally: as the stability of a probability judgment under the addition of admissible further evidence. The goal is to determine if this explication avoids collapsing into existing formalisms (imprecise probability, second-order probability, or evidence counting) and to produce a normative reporting standard for regulatory foresight units.

  **Research Question and Significance**
  The central question is: *Can Keynesian weight be formalized as the modal stability of probability judgments under admissible evidence expansion, such that it remains distinct from interval width, second-order variance, and evidence quantity?*

  A determinate answer settles whether regulatory bodies can report uncertainty without false precision. If weight is distinct, it offers a normative basis for distinguishing between a risk assessed as 10% on thin evidence versus 10% on robust evidence—a distinction critical for infrastructure planning where low-probability, high-consequence risks dominate. If weight collapses into existing measures, the project will demonstrate why the Keynesian intuition, while philosophically compelling, lacks decision-theoretic traction, saving agencies from pursuing dead-end metrics.

  **State of the Art and the Collapse Problem**
  Three candidate explications currently dominate the literature, all of which this project argues are insufficient:
  1.  **Imprecise Probability:** Treats weight as the spread of a probability interval. This fails because an interval can remain wide even as evidence accumulates, or narrow while evidence remains fragile. It captures ambiguity, not evidential completeness.
  2.  **Second-Order Probability:** Treats weight as a distribution over first-order probabilities. This regresses the problem, requiring confidence in the confidence measure, without addressing the *source* of that confidence in the evidence body itself.
  3.  **Evidence Counting:** Treats weight as the quantity of data points. This ignores relevance and holism; a thousand irrelevant observations do not increase weight.

  The imprecise-probability literature has not answered the question because it typically axiomatizes coherence rather than evidential dynamics. It lacks a mechanism for distinguishing *admissible* from *inadmissible* future evidence, which is central to the Keynesian view that evidence is not merely aggregative.

  **Methodology**
  The project employs a hybrid formal-plus-exegetical method. Pure history of ideas would clarify Keynes's intent but fail to produce a usable regulatory tool. Pure decision theory would produce a model but risk misrepresenting the philosophical concept of weight, leading to the collapse errors noted above.

  By anchoring the formal model in exegetical constraints derived from the *Treatise on Probability*, the project ensures the formalism tracks the philosophical concept. Conversely, by subjecting the concept to formal stress-testing, the project determines its viability for normative reporting. The core formal innovation will be defining an "admissibility operator" within a dynamic epistemic logic framework, where admissibility is a function of the current evidence set, not an external parameter.

  **Work Plan (18 Months)**
  *Months 1–6: Exegesis and Conceptual Mapping.*
  Systematic reconstruction of Keynes's arguments on weight. Formal definition of "admissibility" conditions. This phase produces a working definition of *modal stability* that distinguishes it from resilience in standard Bayesian updating.

  *Months 7–12: Formal Modeling and Collapse Testing.*
  Construction of the formal model. Rigorous testing against the three collapse candidates. I will attempt to derive scenarios where modal stability diverges from interval width and second-order variance. If the models converge in all limit cases, the distinction is illusory.

  *Months 13–18: Protocol Design and Validation.*
  Translation of the formal result into a reporting protocol. Drafting a "Weight Statement" template for risk registers. Pilot testing with the host foresight unit to assess usability and interpretability by non-specialists.

  **Deliverables and Success Criteria**
  The primary deliverable is a **Representation Theorem** demonstrating that modal stability satisfies the axioms of Keynesian weight without reducing to the three collapse candidates. The secondary deliverable is a **Reporting Standard**, a qualitative or semi-quantitative scale for risk registers that replaces the unjustified confidence column.

  *Success:* The theorem holds, and the protocol allows analysts to distinguish high-weight/low-probability risks from low-weight/low-probability risks without invoking unjustifyable numbers.
  *Failure:* The formalization of "admissibility" proves intractable, or the stability measure correlates perfectly with interval width in all practical cases, confirming the collapse objection.

  **Scope and Risk Assessment**
  The component most likely to balloon is the definition of **admissibility**. Determining which future evidence counts as "admissible" relative to a specific evidence body risks becoming a holistic quagmire resistant to formalization. If this cannot be bounded, the formal model will fail. To mitigate this, Month 3 will include a "stop-loss" review: if admissibility cannot be parameterized simply, the project will pivot to a purely qualitative protocol based on the exegetical findings, abandoning the representation theorem. A second risk is that the resulting protocol is too complex for regulatory analysts. Continuous feedback from the host unit during Months 15–18 is required to ensure the output remains operational.

  ***

  **Candid Judgment on Feasibility**

  You asked for honesty: **Eighteen months is extremely tight for this specific ambition.**

  Here is why. Your hypothesis relies on formalizing "admissibility" as a function of the *whole* of existing evidence. In formal epistemology, holism is notoriously difficult to model without triggering computational intractability or vagueness. If "admissibility" depends on the semantic content of the evidence set rather than just its size or structure, you are bordering on non-monotonic logic problems that often resist clean representation theorems.

  To derive a representation theorem *and* build a regulatory protocol in 18 months assumes the math will work out quickly. It might not. You could spend 12 months just trying to define the admissibility operator without collapsing into standard relevance logic.

  **Recommendation:**
  Prioritize the **Reporting Standard** as the primary deliverable and treat the **Representation Theorem** as a stretch goal. A robust, philosophically defensible qualitative protocol that survives the three collapse objections is already a significant contribution and fits the regulatory need better than a theorem that might remain abstract. If you promise the theorem in the proposal, ensure the "stop-loss" review I drafted in the Scope section is binding. It is better to deliver a working protocol with a "working formalization" than to fail to prove a theorem and have no protocol to show for it.

  Furthermore, be prepared for the possibility that "weight" *does* collapse into imprecise probability in the limit. If your formal work shows that modal stability is mathematically isomorphic to interval narrowing under specific conditions, that is a negative result, but still a publishable one. Do not bias the inquiry toward confirming Keynes; bias it toward testing him.
