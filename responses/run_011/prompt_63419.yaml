answer: |-
  **Brainstorming Notes**

  **End-Words:**
  1.  **Wait:** Starts as a rational strategy (patience), shifts to a physical sensation (delay), ends as an impossibility.
  2.  **Now:** Starts as a threat (the immediate temptation), shifts to the only temporal location that exists, ends as the sovereign ruler.
  3.  **Cost:** Starts as an abstract future price (calories, money), shifts to the immediate pain of denial, ends as the receipt already paid.
  4.  **Later:** Starts as a promise (the better future self), shifts to a hypothetical zone, ends as a fiction/lie.
  5.  **Want:** Starts as a stable preference (health), shifts to a fluctuating impulse, ends as the driving engine of the bundle.
  6.  **Same:** Starts as an assumption of identity (I am one person), shifts to a question (am I him?), ends as a fractured label.

  **Speaker & Setting:**
  *   **Who:** A "sophisticated" agent. He knows his discount curve is hyperbolic. He knows Future-Him is a stranger who will cave.
  *   **Hour:** 11:50 PM. The witching hour of willpower.
  *   **Task:** Going to sleep / sticking to the diet.
  *   **Reward:** The leftover pizza in the box.
  *   **The Twist:** He doesn't eat it because he's weak; he eats it because he calculates that Future-Him will eat it anyway, so Present-Him might as well capture the utility before the guilt sets in. It is a pre-emptive surrender based on self-knowledge.

  **Formal Strategy:**
  *   The rotation forces the words to change valence. "Later" in Stanza 1 is a sanctuary; in Stanza 5 it is a trap.
  *   The missing seventh stanza (the return to 1) is the return to rationality that never happens. The Envoi seals the transaction in "Cost," not "Wait."

  ***

  **The Curve**

  I tell myself the trick is to **wait**,
  to let the hunger peak and pass **now**,
  because the price is too high a **cost**
  to pay for grease that tastes better **later**.
  I say I know exactly what I **want**:
  to wake up feeling like the **same**

  man who planned this diet. But the **same**
  old hunger says there is no point to **wait**
  when the box is right here and I **want**
  to feel the warmth settle in me **now**.
  Why save the pleasure for a **later**
  that belongs to a stranger who'll pay the **cost**

  anyway? The math says the **cost**
  of resistance is higher than being the **same**
  weak creature who caves eventually **later**.
  If I know I cannot bear to **wait**
  tomorrow night, then why not eat **now**?
  Future-Him will beg for what I **want**.

  I open up the lid. I **want**
  to hate the man who calculates the **cost**
  of joy against the shame he feels **now**,
  but he is logical. He stays the **same**
  only in name. He knows he cannot **wait**
  out the night. He will be back here **later**,

  standing in the light, asking for **later**
  like it's a country he can visit. He **wants**
  to believe in continuity, to **wait**
  for morning as if it clears the **cost**.
  But the selves are distinct. I am not **same**
  as the one who wakes. I am only **now**.

  The clock ticks forward. There is no **later**
  than this bite. There is only this **want**
  burning through the paper. Not the **same**
  hunger as an hour ago. The **cost**
  is lower if I pay it while I **wait**
  less. The curve bends steeply toward the **now**.

  **Now** is the only time I hold. **Later**
  is a story I tell to justify the **want**.
  I am a series of strangers passing the **cost**
  down the line, each one claiming to be **same**.
  I finish the slice. I do not **wait**.
  The box is empty. Morning brings the **wait**.

  *(Note: The sixth stanza ends on "Wait", which would be the first word of a seventh stanza, closing the circle. But the poem moves to the Envoi instead.)*

  **Envoi**

  I am not the **same** man who started **now**,
  I cannot **wait** for a promise of **later**,
  I only know the hunger and the **cost**.
