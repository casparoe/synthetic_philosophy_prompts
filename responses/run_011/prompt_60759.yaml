      *   *Requirement 4: Cost/Benefit Asymmetry.* Hiding must be cheaper/easier than broadcasting, or broadcasting must be lethally expensive. (The "Game Theory" argument).
      *   *Requirement 5: Distinct Mechanisms.* Don't conflate probability of origin with probability of detection. (The "Rare vs. Quiet" distinction).

  3.  **Evaluate the Friend's Additions:**
