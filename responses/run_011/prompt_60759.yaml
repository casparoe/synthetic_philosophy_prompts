prompt: |-
  I'm a software engineer, no philosophy background, and I'm putting together a talk for our internal tech-talk series on why nobody has ever called us. Every explanation of the Great Silence I run into gets sold with one intuition pump, so before I evaluate any of them I want the spec.

  Write the desiderata: what a candidate explanation of why we've detected no other intelligent life actually has to deliver to count as adequate. For each requirement, give the consideration or case behind it — the timescale (a civ a million years ahead of us could have crossed the galaxy many times over), the fact that radio silence isn't the only thing to explain (no probes, no artifacts, no waste-heat or stellar-engineering signatures), whether staying hidden can really be cheap when listening is also cheap, what happens if even one civilization decides to broadcast. Include the distinctions it must not collapse — "they're rare," "they're there but quiet," and "they're quiet because being loud gets you killed" are not the same claim.

  My friend, also an engineer, wants two more: it must not assume any coordination or shared protocol between civilizations (treat it like a Byzantine system, no trusted coordinator), and it must survive one civ being a defector or just buggy. Tell me whether those are genuine requirements or him importing his day job.

  Then: which desiderata are non-negotiable, which are really camp prejudices (rare-life people vs infrared-excess people vs slow-patchy-expansion people), and which single one knocks out the most candidates. If some subset turns out to be jointly unsatisfiable, say so — thats the part I most want. One line each at the end on how dark forest and "life is just rare" do against the list, but keep the weight on the criteria. American English please.
