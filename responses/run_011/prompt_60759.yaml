  4.  **Categorize Desiderata:**
      *   *Non-Negotiable:* Temporal Robustness, Multi-Modal Silence, Defector Tolerance. (If you fail these, the math doesn't hold).
      *   *Camp Prejudices:* Specific assumptions about expansion speed (slow vs. fast), specific assumptions about sociology (uniformity vs. diversity).
      *   *Joint Unsatisfiability:* This is the juicy part. Can we have "Many Civs" + "No Coordination" + "Total Silence"? If $N$ is large and coordination is impossible, the probability of *zero* defectors approaches zero. This suggests $N$ must be small (Rare Earth) or the penalty is absolute (Dark Forest).

  5.  **Identify the "Killer" Desideratum:**
