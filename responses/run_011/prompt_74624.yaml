          2.  *Event Quitting:* Event players feel useless. Fix: Event cards are needed to *trigger* the scoring of Structure (you need foam to prove the tide).
          3.  *Hoarding:* Players save tokens. Fix: Inflation (tokens lose value) or mandatory spend.
