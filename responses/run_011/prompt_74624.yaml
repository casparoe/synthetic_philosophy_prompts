          *   *Deck C (Depths/Structure):* Geography/Climate. Cost 5 Hours + 1 Round delay (research time). Lasts Game. *Constraint:* Must file a "Negative Prediction" (e.g., "Harvest fails regardless of King's policy"). If history reveals the King's policy *did* matter, penalty.
      *   **The Twist:** In Round 3, reveal a "Counterfactual Packet." Show that a specific Event card (e.g., "Assassination of Minister") yields the same outcome if the card was "Minister Lives." This undermines Event-only players.
      *   **Staking Rule:** To play a Deck C card, you must write on a slip: "This structure makes X impossible." If the GM (Professor) reveals a history token that allows X, you lose points.

  5.  **Refining the "Failure" Conditions:**
      *   *Event Failure:* They hoard Event cards. Points decay. They realize they have a story but no stability.
      *   *Structure Failure:* They play Structure cards but make vague claims ("Geography matters"). The staking rule penalizes vagueness because vague claims are compatible with *any* outcome. They need to be specific to avoid the penalty, but specific risks being wrong.

  6.  **Developing the Content (Cards):**
      *   *Events:* "Count-Duke of Olivares resigns," "French cavalry crosses Pyrenees," "Plague in Barcelona."
