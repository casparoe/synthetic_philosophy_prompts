answer: |-
  **Response to Professor Halloran's Monograph**

  **Re: The Fishery Case**

  **(a) Verdict and Justification**

  I predict that Professor Halloran will judge M.'s purchase **impermissible**.

  Her justification will rest on the **Participation Principle**, qualified by a **Cost Condition**. Halloran will argue that M. is a participant in a collective scheme that produces harm, and that participation is itself a normative failure regardless of individual causal efficacy. The key phrase in her record is the gloss on Case 6 (The Dead Lake): an act is permissible when it is "not part of anything." Conversely, in Case 5 (Voting), she establishes that the wrong of *declining* to participate in a scheme others uphold lies in the refusal of membership, explicitly severing the link to causal decisiveness.

  In the Fishery Case, M. is not merely causing harm; she is sustaining the "coalition that defends the present total allowable catch." Even if her purchase is statistically invisible, she is functionally a member of the group whose aggregate demand justifies the quota. Since the certified substitute is affordable (distinguishing this from Case 7) and the scheme is active and harmful (distinguishing this from Case 3 and Case 6), the duty to abstain applies. Halloran will treat the "expected marginal effect of exactly zero" as normatively irrelevant, just as she treats the probability of a decisive vote as irrelevant in Case 5. The wrong is complicity in the scheme, not the mathematical expectation of the outcome.

  **(b) Candidate Principles**

  Three candidate principles are jointly consistent with precedents 1 through 8, though they differ in scope and auxiliary clauses.

  1.  **The Expected Marginal Harm Principle (EMH):** An act is impermissible if and only if its expected marginal contribution to harm exceeds a de minimis threshold.
      *   *Support:* Case 1 (Reorder points), Case 2 (Pollution accumulation).
      *   *Strain:* Case 4 (Smooth Beef) and Case 5 (Voting). Case 4 involves a smooth chain where marginal impact is negligible; Case 5 explicitly rejects probabilistic decisiveness.
      *   *Status:* **Ruled Out.** Case 5's explicit rejection of probability as the locus of the wrong makes EMH incompatible with Halloran's record.

  2.  **The Pure Participation Principle (PPP):** An act is impermissible if it constitutes participation in a harmful collective scheme, regardless of marginal impact or cost.
      *   *Support:* Case 2 (Pollution), Case 4 (Smooth Beef), Case 5 (Voting), Case 8 (Flight Restraint).
      *   *Strain:* Case 7 (Budget Fish). PPP cannot explain why the parent is permitted to buy uncertified fish if participation is the sole wrong.
      *   *Status:* **Viable but incomplete.** It requires a cost exception to accommodate Case 7.

  3.  **The Cost-Conditional Participation Principle (CCPP):** An act is impermissible if it constitutes participation in a harmful collective scheme, *unless* the cost of compliance is prohibitive relative to the agent's capacity, *or* the act is not part of any active scheme.
      *   *Support:* All eight cases. Case 7 provides the cost exception; Case 3 and Case 6 provide the "no scheme" exception; Cases 2, 4, and 5 provide the participation core.
      *   *Strain:* Defining "scheme." It must be broad enough to cover the "smooth beef chain" (Case 4) and "voting" (Case 5) but narrow enough to exclude the "wedding chicken" (Case 3).
      *   *Status:* **Strongest Candidate.** It accommodates the full record without contradiction.

  **(c) Divergence and Preference**

  The surviving candidates (PPP and CCPP) diverge from the rejected EMH on the Fishery Case. EMH dictates a verdict of **Permissible** because the stipulated expected marginal effect is zero. CCPP dictates **Impermissible** because M. is participating in an active, harmful scheme at an affordable cost.

  I prefer the CCPP prediction (Impermissible) because Halloran's record prioritizes *verdicts* over *causal explanations* when the two come into tension. In Case 4, she offers no explanation for why the smooth beef purchase is wrong, yet she commits to the verdict of impermissibility. In Case 5, she offers an explicit reason ("declining to take part") that overrides causal calculus. Where her verdicts and stated reasons pull apart—as in Case 4—the verdict must be treated as the stronger evidence of her principle. She is willing to leave the causal mechanism obscure (Case 4) rather than concede the permissibility of the act. Therefore, in the Fishery Case, she will likely preserve the verdict of impermissibility even if it requires stretching the definition of "participation" to cover acts with zero marginal effect. The "Zero Effect" stipulation in the Fishery Case is functionally equivalent to the "Non-Decisive Vote" in Case 5; Halloran has already signaled that this distinction does not save the agent.

  **(d) Closest Analog**

  The closest analog is **Case 5 (Voting)**.

  *   *Respects of Analogy:* Both involve a large-scale statutory system (National Election / National Fishery). Both involve an individual act (Casting a ballot / Buying fish) that is statistically invisible in the aggregate outcome. Both rely on a collective coalition (Voters / Consumers) to sustain the system.
  *   *Respects in which Analogy Fails:*
      1.  *Valence:* Voting is upholding a presumptively good scheme; the Fishery is upholding a harmful one.
      2.  *Causal Stipulation:* Case 5 admits the vote *might* be decisive but says it doesn't matter; the Fishery Case stipulates the effect is *exactly zero*.
      3.  *Cost:* Voting is low-cost; the Fishery substitute carries a 15% premium.
  *   *Decisive Failure:* Halloran would treat the **Causal Stipulation** as non-decisive. She has already established in Case 5 that probability/decisiveness is not the locus of the duty. She would treat the **Valence** failure as symmetrical: the duty to *join* a good scheme (Case 5) mirrors the duty to *leave* a bad one. The **Cost** failure is addressed by Case 7 (15% is affordable, unlike 40%). Thus, Case 5 remains the controlling precedent.

  **(e) Underdetermination and Commitments**

  The record does not *genuinely* underdetermine the verdict if we accept Case 5 as authoritative over Case 6. However, there is a tension: Case 6 (Dead Lake) permits an act that adds chemical harm because it is "not part of anything." If Halloran rules **Permissible** in the Fishery Case, she would be committing herself to the view that "part of anything" requires a *causal* link, not just a *political* or *statistical* one. She would have to restrict Case 5, arguing that voting is unique because it is a civic duty, whereas consumption is not. This would weaken her general account of collective harm, making it reliant on specific institutional contexts rather than a unified theory of participation.

  If she rules **Impermissible** (as I predict), she must restrict **Case 6**. She would have to clarify that an act is "part of something" even if the industry is active and the agent is part of the supporting coalition, even if the specific causal chain is severed. She would be committing to a robustly **non-causal account of complicity**.

  *   *Precedent doing the most work:* **Case 5 (Voting).** It provides the explicit rationale for ignoring causal efficacy.
  *   *Precedent she would most plausibly wish to revise:* **Case 4 (Smooth Beef).** The lack of explanation there suggests she may not have fully worked out how to justify impermissibility without *any* marginal effect. The Fishery Case forces her to articulate what Case 4 left silent.

  **(f) Tie-Breaker Case**

  To separate the **Cost-Conditional Participation Principle** from a **Causal Threshold Principle**, consider the following case:

  **The Shareholder Case:**
  An individual inherits a single share in a corporation that operates a toxic waste dump. The corporation's board has voted unanimously to maintain current dumping levels for the next decade; no future votes are scheduled. The share is non-voting and cannot be sold (no market). The dividend paid by the share is $5 per year. The individual can renounce the share, forfeiting the dividend, but this will not change the dumping levels (the share is absorbed by the company treasury). The individual is listed in the public registry as a "Partner."

  *   **Prediction by Causal Threshold Principle:** **Permissible.** The act of holding the share has zero expected marginal effect on the dumping (board vote is fixed, no market sale).
  *   **Prediction by Cost-Conditional Participation Principle:** **Impermissible.** The individual is a registered "Partner" in a harmful scheme. The cost of compliance (forfeiting $5) is negligible. The act is "part of something" (the registry/coalition), distinguishing it from Case 6.

  This case isolates the "Part of a Scheme" variable from the "Causal Efficacy" variable. If Halloran rules Impermissible, she confirms that membership/registration alone suffices for complicity, validating the prediction for the Fishery Case. If she rules Permissible, she reveals that "Part of a Scheme" requires at least a theoretical causal pathway, which would undermine the prediction for the Fishery Case.
