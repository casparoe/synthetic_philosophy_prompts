              *   Wait, the prompt says "one time in nine" ($\approx 11\%$). My calc is $\approx 13.5\%$. Close enough for a dialogue scenario. Let's assume the prompt's stats are the "truth" for the sake of argument, but the math checks out broadly (EV huge, Median tiny, Prob profit low).
      *   *Sam ($f=0.25$):*
          *   Kelly Criterion formula: $f^* = \frac{p(b+1) - 1}{b}$ where $b$ is net odds received.
          *   Here, win +0.5, lose -0.4. This isn't standard odds notation.
          *   General Kelly: Maximize $E[\ln(1 + f X)]$.
          *   $g(f) = 0.5 \ln(1 + 0.5f) + 0.5 \ln(1 - 0.4f)$.
          *   $g'(f) = 0.5 \frac{0.5}{1+0.5f} + 0.5 \frac{-0.4}{1-0.4f} = 0$.
          *   $\frac{0.25}{1+0.5f} = \frac{0.2}{1-0.4f}$.
          *   $0.25(1-0.4f) = 0.2(1+0.5f)$.
          *   $0.25 - 0.1f = 0.2 + 0.1f$.
          *   $0.05 = 0.2f \Rightarrow f = 0.25$.
