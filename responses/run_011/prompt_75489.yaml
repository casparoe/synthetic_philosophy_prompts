              *   $H \ln(1.5) + (100-H) \ln(0.6) > 0$.
              *   $H (0.4055) + (100-H)(-0.5108) > 0$.
              *   $0.4055H - 51.08 + 0.5108H > 0$.
              *   $0.9163H > 51.08 \Rightarrow H > 55.7$.
              *   Need 56+ Heads out of 100.
