      *   **(5) Sam:** "median outcome and probability of finishing below... favor a quarter... higher average carried by lucky paths."
          *   *Math:* Median favors Kelly. Prob of loss favors Kelly. EV is skewed by extreme outliers (right tail).
          *   *Verdict:* Factually correct regarding the distribution properties.
      *   **(6) Dana:** "occur about one time in nine... choice of statistic decides... owe me a reason to prefer median to mean."
          *   *Claim:* Challenge to justify the statistic.
          *   *Verdict:* This is the crux. There is no mathematical theorem that says "Median > Mean" for rationality. It's a decision-theoretic axiom choice. Dana is right to demand justification beyond "I prefer median."

