      *   Who is more right? Sam is practically right for a single life without replenishment. Dana is theoretically right regarding abstract Expected Value maximization.
      *   However, in the context of *survival* and *single-trajectory reality*, Sam's argument (Ergodicity) is gaining traction as a more physical description of risk. Dana's strategy leads to ruin with probability approaching 1 as $N \to \infty$.
      *   Missing pieces: Utility of money (diminishing returns), risk of ruin (0 is absorbing), replenishment, parameter uncertainty.

  5.  **Specific Scenarios:**
      *   *Replenishment (Job):* If Dana can add money, she can treat each bet as independent with positive EV. She can recover from ruin. This makes high betting more viable (like a venture capitalist).
      *   *Uncertainty (Coin not fair):* If $p$ is unknown, overbetting (f=1) risks ruin if $p < 0.5$ or if the payoff structure is slightly worse. Kelly is more robust to parameter error (fractional Kelly).

  6.  **Settled vs. Disputed:**
