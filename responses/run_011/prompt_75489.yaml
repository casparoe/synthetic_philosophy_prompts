answer: |-
  This scenario is a textbook illustration of the tension between **Expected Value (EV) maximization** and **Growth-Optimal (Kelly) betting**, framed through the modern lens of **ergodicity**. The mathematics of the payoffs are settled; the interpretation of rationality is not.

  Here is the adjudication of the six moves, followed by an overall verdict and an analysis of the underlying theoretical landscape.

  ### Adjudication of Moves

  **(1) Sam: "staking everything is irrational... long-run growth rate is negative."**
  *   **Verdict:** **Mathematically Right, Normatively Contested.**
  *   **Why:** The arithmetic expected return per round for Dana ($f=1$) is $+5\%$ ($0.5 \times 1.5 + 0.5 \times 0.6 = 1.05$). However, the geometric growth rate is $\sqrt{1.5 \times 0.6} = \sqrt{0.9} \approx 0.948$. Since $0.948 < 1$, the log-return is negative. Over an infinite horizon, Dana's wealth converges to zero with probability 1. Sam is correct that the *time-average* growth rate is negative. Whether this makes the strategy "irrational" depends on the goal (see Move 6).

  **(2) Dana: "expected value is the standard... Kelly... is just maximizing the expected logarithm... arbitrary utility."**
  *   **Verdict:** **Right.**
  *   **Why:** In standard Expected Utility Theory (EUT), there is no mathematical mandate to use logarithmic utility. If your utility function is linear (you value \$1 billion exactly 1,000 times more than \$1 million), maximizing EV is the rational choice. Dana correctly identifies that Kelly is equivalent to maximizing $E[\ln(W)]$. Calling it "arbitrary" is a standard critique (notably by Paul Samuelson): choosing log utility is a preference, not a law of physics.

  **(3) Sam: "not a utility function. It concerns what actually happens to one person over time... mean across parallel universes is not a fact about my bankroll."**
  *   **Verdict:** **Conceptually Right (Ergodicity Argument).**
  *   **Why:** This is the core argument of **Ergodicity Economics** (associated with Ole Peters). Wealth multiplication is a *non-ergodic* process: the ensemble average (EV across parallel universes) does not equal the time average (what happens to one person over many rounds). Sam is correct that the EV of 130x is a property of the distribution's right tail, not the typical trajectory. For a single agent without access to parallel universes, the time average is the physically relevant metric.

  **(4) Dana: "only played a hundred rounds... finite horizon, expected final wealth is maximized by staking everything."**
  *   **Verdict:** **Mathematically Right.**
  *   **Why:** For any finite $N$, $E[W_N] = W_0 \times (1.05)^N$. Because the expected return per round ($1.05$) is linear in the stake fraction and greater than 1, the expected final wealth is strictly increasing with the stake. Dana is correct that if the objective is strictly to maximize the arithmetic mean of wealth at $t=100$, $f=1$ is the unique optimum. Sam does not switch criteria because it "stops favoring him"; he switches because he rejects the arithmetic mean as the relevant metric for a single trajectory.

  **(5) Sam: "median outcome and the probability of finishing below... favor a quarter... higher average is carried entirely by lucky paths."**
  *   **Verdict:** **Right.**
  *   **Why:** The distribution of outcomes for $f=1$ is extremely skewed. The mean is 130x, but the median is $\approx 0.005$x. This implies that almost all the expected value comes from extremely rare paths with an abnormal number of heads. Sam's strategy ($f=0.25$) maximizes the median and minimizes the probability of loss. His description of the distribution's skew is accurate.

  **(6) Dana: "choice of statistic decides which of us is irrational... owe me a reason to prefer the median to the mean."**
  *   **Verdict:** **Right (The Philosophical Crux).**
  *   **Why:** Dana wins this point logically. There is no theorem in decision theory that proves the median is superior to the mean *unless* you specify a utility function or a physical constraint (like non-ergodicity). She is correct that Sam cannot simply assert the median is better without justifying *why* the mean is irrelevant. However, Sam's justification (Move 3) is the answer: in non-ergodic systems, the mean is physically unrealizable for a single agent.

  ---

  ### Overall Verdict

  **Sam is more right practically; Dana is more right theoretically (within standard economics).**

  *   **Sam** wins on **survival and reality**. In a single life, without the ability to reset or replenish, Dana's strategy leads to effective ruin (wealth dropping below any meaningful threshold) with high probability. His strategy guarantees growth for the typical path. If the goal is to remain in the game and compound wealth, Sam is objectively correct.
  *   **Dana** wins on **abstract consistency**. If one accepts the axioms of Expected Utility Theory with linear utility (risk neutrality), her strategy is the only rational choice. Her critique exposes that "Kelly" is not a magic bullet but a specific solution to a specific optimization problem (log utility or time-average growth).

  **What both are missing:**
  1.  **Utility of Wealth:** Both treat money linearly or logarithmically without discussing *why*. In reality, utility diminishes. Losing 99% of your bankroll might hurt more than gaining 10,000% helps (ruin is absorbing).
  2.  **Absorbing Barriers:** If wealth hits zero, the game ends. Dana ignores that once she hits zero, she cannot benefit from the 1-in-9 chance of a massive win later.
  3.  **Scale:** 100 rounds is a "long run" for statistics but a "short run" for life. Dana's strategy might work for $N=10$, but fails for $N=1000$. Sam's strategy works for both.

  ---

  ### Scenario Variations

  **1. If Dana could replenish her bankroll from a part-time job:**
  This changes the problem from **multiplicative** to **additive** (or partially additive). If Dana can inject fresh capital after losses, she is no longer facing an absorbing barrier at zero. She can treat each bet as an independent positive-EV opportunity. In this context, Dana's argument strengthens. Venture capitalists and hedge funds often operate this way: they raise new funds rather than compounding a single pool indefinitely. If she can replenish, betting closer to $f=1$ (or leveraging) becomes more rational because the "ruin" is temporary, not permanent. Sam's Kelly criterion assumes you are betting your *only* capital.

  **2. If neither knew for certain that the coin was fair:**
  This introduces **parameter uncertainty**.
  *   **Dana:** If the true probability of heads is $49\%$ (instead of $50\%$), her expected return becomes negative ($0.49 \times 1.5 + 0.51 \times 0.6 = 0.735 + 0.306 = 1.041$... wait, let's check break-even).
      *   Break-even EV: $p(1.5) + (1-p)(0.6) = 1 \Rightarrow 0.9p = 0.4 \Rightarrow p = 4/9 \approx 44.4\%$.
      *   Break-even Growth: $1.5^p \times 0.6^{1-p} = 1 \Rightarrow p \approx 55.7\%$.
      *   *Correction:* For Dana ($f=1$), if $p < 55.7\%$, her geometric growth is negative. If $p < 44.4\%$, her arithmetic EV is negative.
      *   If the coin is slightly biased against her (e.g., $p=0.5$ is uncertain, could be $0.48$), Dana faces a high risk of negative growth.
  *   **Sam:** The Kelly criterion is sensitive to edge estimation. However, "Fractional Kelly" (betting less than optimal) is a standard heuristic to account for uncertainty. Sam's $f=0.25$ is already the full Kelly for $p=0.5$. If $p$ is uncertain, Sam should bet *less* than 0.25.
  *   **Verdict:** Uncertainty heavily favors Sam (or an even more conservative strategy). Dana's "all-in" approach has no margin of error; if the edge is slightly smaller than calculated, she faces certain ruin in the long run. Sam's approach allows for a margin of safety.

  ---

  ### Settled Mathematics vs. Disputed Theory

  It is crucial to distinguish what is calculation from what is philosophy.

  **Settled Mathematics:**
  1.  **Expectations:** The arithmetic expected value of Dana's strategy is indeed $\approx 130\times$. The geometric mean is $\approx 0.005\times$.
  2.  **Optimization:** $f=1$ maximizes $E[W_T]$. $f=0.25$ maximizes $E[\ln(W_T)]$ (and the time-average growth rate).
  3.  **Convergence:** As $N \to \infty$, the probability of Dana's wealth exceeding any fixed bound approaches 0, despite the expected value approaching $\infty$.
  4.  **Distribution:** The distribution of Dana's wealth is log-normal (roughly) with extreme positive skew.

  **Genuinely Disputed (or Context-Dependent):**
  1.  **The Definition of Rationality:**
      *   *Consensus View (Neoclassical Economics):* Rationality is defined by maximizing Expected Utility. Whether one should use Log Utility (Kelly) or Linear Utility (EV) is a matter of individual risk preference. There is no objective "correct" utility function.
      *   *Ergodicity View (Peters, Gell-Mann, et al.):* Rationality should be defined by maximizing the time-average growth rate. Using ensemble averages (EV) for non-ergodic processes is a category error, not a preference. This view argues Log Utility is not arbitrary but derived from the dynamics of wealth.
      *   *Status:* This is an active debate. Ergodicity Economics is gaining traction in physics and some economic circles but has not displaced Expected Utility Theory as the standard model in finance or economics.
  2.  **Finite vs. Infinite Horizons:**
      *   Some argue that for finite $N$ (like 100 rounds), EV maximization is defensible if the agent can tolerate ruin. Others argue that because $N=100$ is large enough for the Law of Large Numbers to compress the distribution, the median is the only outcome that matters practically.
  3.  **The "One Time in Nine" Defense:**
      *   Is an 11% chance of profit acceptable for a 130x expected return? In venture capital, yes. For personal savings, no. This is not a math question; it is a question of **context and consequence**, which mathematics alone cannot adjudicate.

  **Summary:** Sam is betting on survival and typical outcomes (Time Average). Dana is betting on rare, extreme outliers (Ensemble Average). Mathematically, both describe the same distribution correctly. Philosophically, Sam aligns with the physical reality of a single life trajectory, while Dana aligns with the abstract axioms of risk-neutral finance. In a real-world context without replenishment, Sam's framework is the robust choice.
