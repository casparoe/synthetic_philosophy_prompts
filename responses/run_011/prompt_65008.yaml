  **MEMORANDUM**

  **TO:** Standards Committee, Assured Crustacean Standard
  **FROM:** Tideway Impact Advisory
  **DATE:** 24 October 2023
  **SUBJECT:** Aggregate Welfare Assessment: System Alpha vs. System Beta

  **1. Purpose**
  Per your request, Tideway Impact Advisory has evaluated two production systems against Criterion 4.1 (Aggregate Welfare). System Alpha utilizes conventional semi-intensive ponds. System Beta employs high-density indoor tanks. This memorandum reports the comparative Aggregate Welfare Metric (AWM) and provides a certification recommendation.

  **2. Methodology**
  The AWM is calculated as the product of the Per-Unit Welfare Score (PUWS) and the Sentience-Adjusted Population (SAP).

  *Sentience Confidence Factor (SCF):* In line with Scheme Policy 7, the PUWS is multiplied by an SCF of 0.65 for *Litopenaeus vannamei*. This figure reflects a conservative confidence interval regarding decapod sentience. A sensitivity analysis confirms robustness across the 0.60–0.70 range. Note that SCF is not applied to small pelagic fish reduced for feed protein, as wild-caught input species fall outside the Scheme's scope of assurance.

  *Population Unit:* To ensure auditability, the SAP is defined as stocking numbers less pre-harvest mortality. Animals dying from disease prior to harvest are excluded from the denominator, as they do not contribute to final biomass output. Consequently, disease-management interventions that reduce pre-harvest mortality increase the SAP, resulting in a higher AWM. This is scored as an unambiguous improvement in aggregate welfare delivery.

  **3. Operational Observations**
  Both systems utilize ice slurry immersion at harvest, credited under Section 5.2 as a humane slaughter method. System Beta requires eyestalk ablation of broodstock to accelerate spawning via removal of the X-organ–sinus gland complex. This appears as a scored line item with a corrective-action timeline for non-surgical alternatives, but does not disqualify the unit. A single grow-out pond in System Beta holds approximately 450,000 animals.

  **4. Results**
  System Alpha achieved a PUWS of 5.2/10 with a harvestable headcount of 15,000 per cycle.
  System Beta achieved a PUWS of 4.8/10 with a harvestable headcount of 450,000 per cycle.

  While System Beta scores marginally lower on per-animal indicators (primarily due to density constraints), the volume differential results in a decisive aggregate advantage.
  *   System Alpha AWM: 5.2 × 0.65 × 15,000 = 50,700
  *   System Beta AWM: 4.8 × 0.65 × 450,000 = 1,404,000

  System Beta generates 27.7 times the aggregate welfare units of System Alpha.

  **5. Recommendation**
  Tideway recommends granting Assured Status to System Beta. The methodology prioritizes total welfare capacity over per-capita intensity. The scale of production ensures a greater net positive impact within the Scheme's boundaries.

  **Annex A: Sensitivity to Neutral Welfare Threshold**

  The ranking above assumes a welfare scale where 0 represents null welfare and all positive scores indicate net benefit. The Committee has previously defined the neutral point (where life is neither worth living nor not) as lying between 3.0 and 5.0 on the 10-point PUWS scale. The table below demonstrates ranking stability across this plausible range.

  | Neutral Point (PUWS) | System Alpha Net Score | System Beta Net Score | Recommended System |
  | :--- | :--- | :--- | :--- |
  | 3.0 | 2.2 × 15,000 = 33,000 | 1.8 × 450,000 = 810,000 | Beta |
  | 4.0 | 1.2 × 15,000 = 18,000 | 0.8 × 450,000 = 360,000 | Beta |
  | 4.5 | 0.7 × 15,000 = 10,500 | 0.3 × 450,000 = 135,000 | Beta |
  | 4.9 | 0.3 × 15,000 = 4,500 | -0.1 × 450,000 = -45,000 | Alpha |
