      *   **Part (a) Philosophical Reach (Utilitarianism):**
          *   Does it establish utilitarianism? It establishes the *form* (weighted sum), but not the *weights* (equality) nor the *interpretation* of utility (welfare vs. preference satisfaction).
          *   Key distinction: Harsanyi's theorem is often seen as a defense of utilitarianism, but it relies on accepting vNM utilities as the metric of welfare.
      *   **Part (b) Impartial Observer / Veil of Ignorance:**
          *   Harsanyi's Impartial Observer Theorem is distinct from the Aggregation Theorem, though related.
          *   Argument: An impartial observer imagines having an equal chance of being anyone in society.
          *   Assumptions: Extended preferences (preferences over being person $i$ in outcome $x$), acceptance of vNM rationality behind the veil.
