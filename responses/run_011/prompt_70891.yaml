          *   Tension: Rawls critiques Harsanyi here. Rawls argues maximin is rational under extreme uncertainty/ignorance, whereas Harsanyi argues vNM rationality applies.
      *   **Ex Post vs. Ex Ante:**
          *   Harsanyi's theorem aggregates ex ante preferences over lotteries. It implies ex post utilitarianism if utilities are state-independent, but the theorem itself is about ranking lotteries.

