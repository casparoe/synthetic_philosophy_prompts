      *Self-Correction on Move 1:* Rob's argument is a standard "local vs global" LCA (Life Cycle Assessment) argument. It's often true but hard to prove for specific veggies. I'll rate it as "Plausible but unsubstantiated".
      *Self-Correction on Move 5:* Rob says growth regulators are narrow spectrum. Some are, some aren't. But generally, IGRs are more specific than pyrethroids. His logic on population arithmetic is sound. I'll rate it "Mostly right".
