      *   Move 3: Rob is *reductive*. Rating: Partly mistaken.
      *   Move 4: Nadia is *substantive*. Rating: Mostly right.
      *   Move 5: Rob is *technically accurate*. Rating: Mostly right.
      *   Move 6: Nadia is *philosophically consistent*. Rating: Mostly right.

      *   *Overall:* Nadia edges it because her objections hold up under scrutiny better than Rob's empirical claims.
      *   *Joint Miss:* Non-chemical IPM (mesh, rotation) and the specific purpose of allotments vs. commercial farming.

  7.  **Final Polish (British English Check):**
      *   "programme" not "program".
      *   "optimising" not "optimizing".
      *   "defence" not "defense".
      *   "colour" not "color".
      *   Tone: Formal but accessible adjudication.

  8.  **Constructing the Output:**
      *   Intro sentence.
      *   Numbered list 1-6 with rating and justification.
      *   Overall verdict paragraph.
