answer: |-
  Here is the case file. It is designed to be printed, slid across the table, and left there while you wait for him to read it.

  ### The Scenario: The "Rapid-Response" Hypertension Trial

  **Context:** A randomized controlled trial (RCT) comparing a new high-potency vasodilator (**New Drug**) against a standard diuretic (**Old Drug**) for preventing major cardiac events within one year.

  **The Variable ($Z$):** "Blood Pressure Controlled at Week 4."
  This is not a baseline characteristic. It is measured *after* treatment assignment. It is an intermediate outcome (a mediator).

  **The Outcome ($Y$):** "Cardiac Event Free at Year 1" (Success = 1, Event = 0).

  **The Design:** 320 patients, perfectly randomized (160 per arm). Because it is randomized, the groups are comparable at baseline; there are no pre-existing confounders.

  ### 1. The Data

  **Table 1: Aggregate Results (The "Bottom Line")**

  | Treatment | N | Events Free (Y=1) | Success Rate |
  | :--- | :--- | :--- | :--- |
  | **New Drug** | 160 | 76 | **47.5%** |
  | **Old Drug** | 160 | 52 | **32.5%** |
  | **Difference** | | | **+15.0%** |

  *Verdict:* The New Drug is substantially better. If you are a hospital administrator deciding which drug to stock, you buy the New Drug.

  ***

  **Table 2: Stratified by "BP Controlled at Week 4" ($Z$)**

  | Stratum | Treatment | N | Events Free (Y=1) | Success Rate |
  | :--- | :--- | :--- | :--- | :--- |
  | **BP Controlled ($Z=1$)** | New Drug | 120 | 72 | **60.0%** |
  | | Old Drug | 40 | 28 | **70.0%** |
  | | *Difference* | | | **-10.0%** (Old wins) |
  | **BP Uncontrolled ($Z=0$)** | New Drug | 40 | 4 | **10.0%** |
  | | Old Drug | 120 | 24 | **20.0%** |
  | | *Difference* | | | **-10.0%** (Old wins) |

  *Verdict:* Within *every* stratum, the Old Drug performs 10 percentage points better than the New Drug.

  **Constraint Check:**
  *   Total N = 320 (< 400).
  *   Smallest cell = 40 (> 25).
  *   Aggregate Gap = 15% (> 5%).
  *   Stratum Gaps = 10% (> 5%).
  *   Reversal: Aggregate favors New; Strata favor Old.

  ### 2. The Causal Story (Why the Aggregate is Right)

  Your roommate's error is treating $Z$ ("BP Controlled") as a **confounder** that needs to be neutralized. In this trial, $Z$ is a **mediator**.

  **The Causal Diagram:**
  $$ \text{Treatment} (X) \rightarrow \text{BP Controlled} (Z) \rightarrow \text{Cardiac Health} (Y) $$
  $$ \text{Treatment} (X) \rightarrow \text{Cardiac Health} (Y) \quad (\text{Direct Path}) $$

  **The Mechanism:**
  1.  **Potency:** The New Drug is much more effective at lowering blood pressure quickly. This is why 120/160 (75%) of New Drug patients achieved control ($Z=1$), compared to only 40/160 (25%) of Old Drug patients.
  2.  **Protection:** Achieving blood pressure control ($Z=1$) is the primary driver of cardiac health. People with controlled BP do much better (60-70% success) than those without (10-20% success), regardless of which drug they took.
  3.  **Toxicity:** The New Drug has a mild side-effect profile (e.g., electrolyte imbalance) that slightly reduces cardiac health *holding BP constant*. This is why, within the strata, the Old Drug looks 10% better. It is "gentler."

  **Why Conditioning is the Mistake:**
  When you stratify by $Z$, you are asking: *"Comparing only patients who ended up with the same blood pressure, which drug was less toxic?"*
  That is a question about the **Direct Effect** of the drug's chemistry.

  But the policy question is: *"If I prescribe this drug, what happens to my patient?"*
  That is a question about the **Total Effect**. The Total Effect includes the benefit of the drug successfully lowering the blood pressure. By stratifying on $Z$, you block the main pathway through which the New Drug saves lives. You are statistically "holding the mechanism constant" and then complaining that the mechanism isn't doing any work.

  **The Single Feature Producing the Reversal:**
  The reversal is produced by the **unequal distribution of patients across strata**.
  *   The New Drug "pushes" patients into the high-success stratum ($Z=1$).
  *   The Old Drug leaves patients stuck in the low-success stratum ($Z=0$).
  *   The Aggregate captures this "push." The Stratification ignores it.

  ### 3. The Indistinguishability Problem (The Kill Shot)

  You asked: *Could this exact same table have been generated by a genuine confounder instead?*

  **Yes.**
  If you hand a statistician *only* Table 1 and Table 2 without the study protocol, they cannot distinguish this case from a confounding case.

  **The Confounder Scenario:**
  Imagine $Z$ was "Severity of Hypertension at Baseline."
  *   Severe patients ($Z=0$) are harder to treat (lower $Y$).
  *   Doctors (non-randomized) prescribed the New Drug mostly to Severe patients (120/160) because it's stronger.
  *   Doctors prescribed the Old Drug mostly to Mild patients (120/160).
  *   In this observational scenario, $Z$ is a confounder ($Z \rightarrow X$ and $Z \rightarrow Y$).
  *   **In this scenario, your roommate is right.** You *must* stratify to find the truth. The aggregate is biased.

  **How to Tell Them Apart:**
  You cannot tell them apart from the numbers alone. **You must know the temporal ordering.**
  *   If $Z$ is measured *before* treatment $\rightarrow$ It is a Confounder $\rightarrow$ **Condition on it.**
  *   If $Z$ is measured *after* treatment $\rightarrow$ It is a Mediator $\rightarrow$ **Do not condition on it (for Total Effect).**

  Your roommate's maxim ("always disaggregate") fails because it assumes the numbers dictate the method. They do not. The *causal structure* dictates the method.

  ### 4. His Best Counterattack (And Your Reply)

  **His Strongest Argument:**
  *"Fine, it's a mediator. But what if the New Drug only works for the Mild patients, and kills the Severe ones? By looking at the aggregate, you're hiding Heterogeneity of Treatment Effect (HTE). If we disaggregate by severity, we might save the Severe patients from a drug that harms them. 'Always disaggregate' is a safety heuristic to prevent harming subgroups."*

  **Why this is strong:** It appeals to safety and personalized medicine. It argues that the Average Treatment Effect (ATE) is morally insufficient if the variance is high.

  **Your Reply:**
  1.  **Wrong Variable:** In my example, $Z$ is *post-treatment*. You cannot use post-treatment variables to define subgroups for assignment. You can't know if a patient will achieve BP Control ($Z$) until *after* you give them the drug. You cannot use $Z$ to decide who gets the drug.
  2.  **Pre-Registration:** The solution isn't "always disaggregate." It is "define your subgroups *before* the trial starts." If he wants to check for HTE, he must stratify by **baseline** covariates (age, baseline BP, genetics), not intermediate outcomes.
  3.  **The Cost of His Heuristic:** If we follow his rule and condition on post-treatment mediators routinely, we will systematically reject effective treatments that work via strong mechanisms. We would have rejected statins, insulin, and antibiotics by his logic if we conditioned on "Cholesterol lowered," "Blood sugar normalized," or "Infection cleared" during the trial.

  ### 5. What Settles the Dispute

  If you want to end the argument permanently, propose this protocol for your next joint analysis:

  1.  **Draw the DAG first.** Before touching the data, agree on the causal diagram.
  2.  **Label the nodes.** Explicitly mark which variables are Pre-Treatment (Confounders) and which are Post-Treatment (Mediators/Colliders).
  3.  **The Rule:**
      *   Condition on Pre-Treatment parents of $X$ (to block backdoors).
      *   **Never** condition on Post-Treatment descendants of $X$ (to avoid blocking the frontdoor path).

  **The Summary for Him:**
  "Aggregate numbers are not 'lies.' They are the **Total Effect**. Stratified numbers are not 'truth.' They are the **Direct Effect**. If the question is 'Does the treatment work?', the Total Effect is the truth. If you condition on a mediator, you aren't removing bias; you're removing the benefit."
