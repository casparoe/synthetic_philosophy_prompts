      *(Final check on constraints)*: "Small enough to check by hand." I will present the counts clearly. "Integer counts." Yes.

      Let's write it.

      *Wait, one nuance:* The prompt says "the breakdown variable can't be a plain pre-existing confounder, otherwise he just says 'see, condition on it,' so the reversal has to come out of where that variable sits in the causal structure."
      *   This confirms $Z$ must be a Mediator (or Collider). Mediator is the most robust "Program Evaluation" example.
      *   I need to make sure I explain *why* the reversal happens mathematically (weighting). The New group is heavily weighted toward the high-success stratum ($Z=1$), while the Old group is heavily weighted toward the low-success stratum ($Z=0$).

      *Let's finalize the clinical story.*
      *   Drug A (New): High potency, high side-effect risk.
