  1.  **Analyze the Request:**
      *   **Goal:** Build a case *against* the roommate's position ("always disaggregate") and *for* the user's position ("sometimes aggregate is the truth").
      *   **Topic:** Simpson's Paradox (specifically, a case where the aggregate is correct and the stratified analysis is misleading).
      *   **Constraints:**
          1.  Fictional but realistic dataset (program evaluation or clinical).
          2.  Binary outcome, two options (New vs. Old).
          3.  Aggregate: New > Old.
          4.  Stratified (by one variable): Old > New in *every* stratum.
          5.  Groups comparable at baseline (randomized or equivalent).
          6.  The stratification variable cannot be a pre-existing confounder (must be a mediator or collider, specifically a *mediator* in this context to make aggregation correct).
          7.  Small enough to check by hand (<400 total cases).
          8.  Cell sizes >25 per treatment-by-stratum cell.
          9.  Effect gaps >5 percentage points.
          10. Provide tables, rates, causal story (DAG description), explanation of why conditioning is wrong.
