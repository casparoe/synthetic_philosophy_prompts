  2.  **Determine the Causal Structure:**
      *   To make the *aggregate* correct and the *stratified* wrong, the stratification variable ($Z$) must be a **mediator** (on the causal path from Treatment $X$ to Outcome $Y$) or a **collider** (affected by both $X$ and $Y$).
      *   *Collider bias:* Conditioning on a collider opens a backdoor path. This usually creates a spurious association where none existed.
      *   *Mediator:* Conditioning on a mediator blocks the direct path from $X$ to $Y$. If the total effect is what we care about (which is usually the case in program evaluation: "Does the treatment work overall?"), conditioning on the mediator hides the mechanism by which the treatment works.
      *   *The Roommate's Trap:* The roommate thinks $Z$ is a confounder ($X \leftarrow Z \rightarrow Y$). If $Z$ is a confounder, we *must* condition. If $Z$ is a mediator ($X \rightarrow Z \rightarrow Y$), we *must not* condition if we want the Total Effect.
      *   *Selection for the Prompt:* The prompt asks for a case where "breaking it down is exactly how you get it wrong." This implies the aggregate represents the *Total Effect*, which is the policy-relevant quantity. The stratification variable must be an **intermediate outcome** (mediator) that is influenced by the treatment.
      *   *Scenario:* A medical treatment that works *by* changing a physiological state, but within each physiological state, the untreated look slightly better (perhaps due to natural resilience), yet the treatment pushes so many people into the "good" physiological state that overall they win.
      *   *Wait, a classic mediator example:* Treatment $\rightarrow$ Mediator $\rightarrow$ Outcome. If I condition on the Mediator, I block the effect. But does this create a *reversal* (New worse in strata, better in aggregate)?
      *   *Yes, if:* The treatment strongly improves the mediator, and the mediator strongly improves the outcome. But within each level of the mediator, the treatment has a slight negative direct effect (or no effect), while the control group has a slight positive direct effect (maybe natural recovery).
      *   *Let's refine:* This is often called "Simpson's Paradox via Mediation."
      *   *Alternative:* **Collider Bias.** Treatment $\rightarrow$ $Z$ $\leftarrow$ Outcome. Conditioning on $Z$ induces correlation. But usually, we want the Total Effect.
      *   *Best Fit for "Program Evaluation":* The "Post-Treatment Bias" scenario. $Z$ is something that happens *after* treatment assignment but *before* final outcome.
      *   *Example Idea:* A job training program ($X$) aims to get people employed ($Y$). $Z$ is "Completed Internship." The program ($X$) makes people much more likely to complete the internship ($Z$). Completing the internship ($Z$) makes employment ($Y$) much more likely. However, among those who *did* complete the internship, the control group might be slightly more naturally talented (selection bias within the stratum? No, must be randomized).
      *   *Wait, constraint check:* "Groups have to be comparable going in — randomize them if you like." If randomized, $X \perp \text{Baseline}$.
      *   *If $Z$ is a mediator:* $X \rightarrow Z \rightarrow Y$.
      *   *To get reversal:*
          *   Aggregate: $P(Y|X=1) > P(Y|X=0)$.
          *   Strata: $P(Y|X=1, Z=0) < P(Y|X=0, Z=0)$ AND $P(Y|X=1, Z=1) < P(Y|X=0, Z=1)$.
      *   *How?* The treatment $X$ pushes people into $Z=1$ (which is good). But within $Z=1$, $X$ doesn't help (or hurts slightly). Within $Z=0$, $X$ doesn't help (or hurts slightly). The benefit of $X$ is *entirely* through moving people to $Z=1$.
      *   *Wait, if $X$ helps entirely through $Z$, then within $Z$, the effect should be zero.* To get a *reversal* (X looks harmful within strata), there must be a slight negative direct effect of $X$ on $Y$ (side effects?), overwhelmed by the positive indirect effect through $Z$.
      *   *Let's construct the numbers.*
      *   Total N < 400. 4 cells (Trt/Ctrl x Z=0/Z=1). Min 25 per cell.
      *   Let $N = 400$ (200 Trt, 200 Ctrl).
      *   Variable $Z$: "Achieved Therapeutic Blood Level" (Mediator).
      *   Variable $Y$: "Symptom Resolution" (Outcome).
      *   Treatment $X$: New Drug vs. Old Drug.
      *   Mechanism: New Drug is much better at achieving Therapeutic Level ($Z$). Therapeutic Level ($Z$) is strongly associated with Resolution ($Y$). However, the New Drug has mild side effects that slightly reduce Resolution probability *holding Z constant* (maybe toxicity).
      *   *Wait, if randomized:*
          *   $P(Z=1 | X=1)$ should be high.
          *   $P(Z=1 | X=0)$ should be low.
      *   *Within $Z=1$:* $P(Y=1 | X=1, Z=1) < P(Y=1 | X=0, Z=1)$. (New drug slightly more toxic).
      *   *Within $Z=0$:* $P(Y=1 | X=1, Z=0) < P(Y=1 | X=0, Z=0)$. (New drug slightly less effective if level not reached).
      *   *Aggregate:* $P(Y=1 | X=1) > P(Y=1 | X=0)$. (Because so many more New Drug patients got to $Z=1$).

  3.  **Drafting the Numbers:**
      *   Total: 400 patients. 200 New, 200 Old.
      *   **Stratum Z=1 (Therapeutic Level Achieved):**
          *   Need $N \ge 25$ in each cell.
          *   Let's say New Drug gets most people here. Old Drug gets few.
          *   New Drug ($X=1$): 150 patients reach $Z=1$. Success rate on $Y$: 60% (90 success).
          *   Old Drug ($X=0$): 50 patients reach $Z=1$. Success rate on $Y$: 70% (35 success). *Old looks better here.*
      *   **Stratum Z=0 (Therapeutic Level Not Achieved):**
          *   New Drug ($X=1$): 50 patients remain here. Success rate on $Y$: 10% (5 success).
          *   Old Drug ($X=0$): 150 patients remain here. Success rate on $Y$: 20% (30 success). *Old looks better here too.*
      *   **Check Cell Counts:**
          *   New/Z1: 150 (>25)
          *   New/Z0: 50 (>25)
          *   Old/Z1: 50 (>25)
          *   Old/Z0: 150 (>25)
          *   Total: 400.
      *   **Check Rates:**
          *   Z=1: New 60% vs Old 70%. (Gap 10%, >5%). Old wins.
          *   Z=0: New 10% vs Old 20%. (Gap 10%, >5%). Old wins.
      *   **Check Aggregate:**
          *   New Total Success: $90 + 5 = 95$. Rate: $95/200 = 47.5\%$.
          *   Old Total Success: $35 + 30 = 65$. Rate: $65/200 = 32.5\%$.
          *   Gap: 15%. New wins.
      *   **Constraint Check:**
          *   Binary outcome? Yes.
          *   Aggregate New > Old? Yes (47.5% vs 32.5%).
          *   Strata Old > New? Yes (70% vs 60%, 20% vs 10%).
          *   Comparable going in? Yes, assumed Randomized Controlled Trial (RCT).
          *   Breakdown variable not a confounder? Yes, it's a post-treatment mediator.
          *   Counts > 25? Yes (50 is the min).
          *   Gaps > 5%? Yes (10% and 15%).
          *   Total < 400? Yes (exactly 400).

  4.  **Developing the Causal Story:**
      *   **Context:** Hypertension management.
      *   **Treatment:** New Vasodilator (New) vs. Standard Diuretic (Old).
      *   **Mediator ($Z$):** "Target BP Reached at Week 2".
      *   **Outcome ($Y$):** "Stroke-Free at Year 1".
      *   **Story:** The New Drug is much more potent at lowering BP quickly (pushes $Z$ to 1). Reaching Target BP ($Z=1$) is the main driver of avoiding Stroke ($Y$). However, the New Drug has a rare side effect (hypotension risk) that slightly increases stroke risk *even if* BP is controlled, compared to the gentler Old Drug.
      *   **Why Conditioning is Wrong:** $Z$ is a **Mediator**. The goal of the drug is to change $Z$. By conditioning on $Z$, you ask "What is the effect of the drug *holding the mechanism constant*?" This answers "Does the drug have value *beyond* lowering BP?" (Direct Effect). The policy question is "Should we prescribe this drug?" (Total Effect). The Total Effect includes the benefit of lowering BP. Conditioning blocks that path.
      *   **Causal Diagram:** $X \rightarrow Z \rightarrow Y$ and $X \rightarrow Y$ (direct path, slightly negative).
      *   **The "Single Feature":** The variable $Z$ is a *consequence* of Treatment $X$, not a cause.

  5.  **Addressing the "Confounder vs. Mediator" Indistinguishability:**
      *   Mathematically, the table looks identical whether $Z$ is a confounder ($Z \rightarrow X$ and $Z \rightarrow Y$) or a mediator ($X \rightarrow Z \rightarrow Y$).
      *   How to tell? Temporal ordering and study design. You need to know *when* $Z$ was measured relative to $X$.
      *   If $Z$ is baseline (pre-treatment), it's a confounder (condition on it).
      *   If $Z$ is post-treatment (intermediate), it's a mediator (do not condition on it for Total Effect).
      *   This is the crux of the argument: Data alone cannot distinguish causality. Domain knowledge is required.

  6.  **Developing the Roommate's Counterattack:**
      *   Roommate says: "Always disaggregate."
      *   Strongest version: "Heterogeneity of Treatment Effect (HTE). The aggregate hides who benefits. Maybe the New Drug kills a specific subgroup. We need to know *for whom* it works."
      *   Rebuttal to Roommate: True for *personalization*, but false for *policy/adoption*. If the question is "Do we stock this drug?", the aggregate is the answer. Also, if $Z$ is a mediator, stratifying doesn't show HTE, it shows *mechanism blocking*.
      *   Settlement: Pre-register the analysis plan. Define $Z$ as baseline or follow-up *before* looking at data.

  7.  **Refining the Output:**
      *   Tone: Professional, slightly combative (it's for an argument), precise.
      *   Structure:
          1.  The Scenario (Clinical).
          2.  The Data (Tables).
          3.  The Math (Verification).
          4.  The Causal Story (DAG).
          5.  Why Conditioning Fails (Post-Treatment Bias).
          6.  The Indistinguishability Problem (Data vs. Theory).
          7.  The Roommate's Best Shot (HTE argument).
          8.  The Settlement (Temporal ordering).

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I ensure $Z$ isn't a collider? A collider would be $X \rightarrow Z \leftarrow Y$. Conditioning on a collider induces bias. But usually, in clinical trials, we worry about mediators. A mediator is the standard example for "Aggregate = Total Effect, Stratified = Direct Effect." The prompt asks for "breaking it down is exactly how you get it wrong." This fits Mediator perfectly.
      *   *Check:* Is the gap > 5%?
          *   Agg: 47.5% - 32.5% = 15%.
          *   Z=1: 70% - 60% = 10%.
          *   Z=0: 20% - 10% = 10%.
