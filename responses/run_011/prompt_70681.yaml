      *   *Check:* Cell sizes. Min is 50. Good.
      *   *Check:* "Comparable going in." Emphasize Randomization.
      *   *Check:* "Single feature." The temporal order (Post-treatment status).

  9.  **Final Polish:** Make sure the distinction between "Total Effect" (Aggregate) and "Direct Effect" (Stratified) is clear. This is the technical terminology that wins the argument. The roommate is confusing *confounding control* with *mechanism blocking*.

      *(Self-Correction on the "Confounder" question)*: The prompt asks: "Could this exact same table have been generated by a genuine confounder instead, and if so how would you ever tell the two apart from the numbers alone?"
      *   Answer: Yes, the numbers are identical. You tell them apart by *study design* and *temporal precedence*, not the table. This is the kill shot. The roommate thinks the *numbers* dictate the method. You must show the *context* dictates the method.

      *(Refining the Roommate's Counter)*: The roommate shouldn't just say "You're wrong." He should say "If you aren't sure if it's a mediator or confounder, conditioning is the safer bet to avoid omitted variable bias."
