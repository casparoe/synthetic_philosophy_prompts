prompt: |-
  You're a professional epistemologist who has read far too much on self-knowledge, and what I need from you is an audit, not a lecture. I'm putting my profile in front of my reading group next week and I'm pretty sure there's a crack in it somewhere, but I honestly can't tell where, and I don't want you to guess at which bit I'd be most reluctant to give up — I don't know that either. Here's the set:

  1. Knowledge-first: knowledge isn't analysable into belief plus justification plus some extra ingredient, and knowing doesn't require the knower to have reflective access to the fact that she knows.
  2. Williamson's anti-luminosity argument is sound. The feeling-cold series plus the margin-for-error premise does what he says it does, so no non-trivial condition is luminous.
  3. Therefore KK is false: knowing that p doesn't put you in a position to know that you know that p. I take the anti-luminosity result to be *the* reason KK fails, not merely a reason among others.
  4. That said, the margin-for-error premise only gets traction because feeling cold is vague and shifts gradually. For sharp conditions — arithmetical knowledge, or the card in front of me being the ace of spades — I think luminosity can survive, and in those cases I'd happily say that if you know, you know that you know.
  5. I'm an internalist about reasons in one specific sense: it's constitutive of p's being a reason for you that you could cite p in a reflection-alone justification of what you're doing. Not a pragmatic point — a consideration you couldn't produce on request just isn't a reason of yours. I don't think this clashes with (1), since reasons and evidence are a different matter from knowledge.
  6. Assertion is governed by the knowledge norm, and I think it's perfectly coherent that speakers violate it blamelessly all the time.
  7. In the good cases we really do know that we know. Introspection is reliable and it'd be perverse to deny it.

  Go through these and tell me which pairs genuinely pull against each other and which only look like they do. For each real tension: how severe, which commitment has to go or get weakened, and what the cheapest repair costs me — and be alert to the fact that a fix in one place might reopen (3) or (5) somewhere else. Then tell me which single revision would clean up the most. Think carefully and start with a short brainstorm mapping what each commitment commits me to before you hand down verdicts, order the tensions by severity, and write the whole thing in British English.
