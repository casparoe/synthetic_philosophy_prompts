answer: |-
  The ink in the well had skinned over by morning. Mara broke the surface with the nib, watching the dark film fracture. Outside the high, narrow windows of the Office of Attestations, the Adriatic was the color of hammered zinc, choppy and indifferent. It was 1958, and the port was quiet enough that the sound of the gulls scratching at the sill competed with the scratching of pens.

  Mara dipped the pen. She did not write immediately. She waited for the ink to settle in the feed, a habit born of twenty-two years at Desk Four. She was a witness clerk. Her job was not to judge truth, but to construct it. In the Office, a thing was not true because it corresponded to the world; it was true because a clerk had built the bridge to it, term by term, and signed for the crossing.

  On the blotter before her lay the ledger for Sequence Kappa-9. It was an infinite construction, farmed out to her when she was twenty-five. She supplied one term per day. A number, a coordinate, a specific shade of blue—what the term actually *was* mattered less than the act of supplying it. The sequence existed only up to today's entry. Yesterday's entry was history; tomorrow's was fiction. Only today's was attested.

  She wrote the term. She signed her name. She dated the margin. The ink dried grey.

  It was a Tuesday. On Tuesdays, she allowed herself the walk to the Public Register.

  Mara stood up. Her knees clicked, a sound like a stamp hitting paper. She walked past the rows of desks where other clerks hunched over their own infinite tasks. Some were building proofs of density; others were witnessing the expansion of prime gaps. No one spoke. The air smelled of ozone, dust, and the salt that seeped through the stone walls.

  At the front of the hall stood the Register. It was not a book but a vault door set into the wall, with a slot for submissions and a heavy iron wheel that locked the accepted claims into the public record. To enter a claim was to move it from the private mind to the state's reality.

  Mara carried a slip of paper. On it, she had written the formula she had brought every Tuesday for three years.

  *There exists a state for Luca Vane: Alive or Dead.*

  Luca was her son. He had gone out in a fishing boat, the *Nereid*, during the storm in November. The boat had returned. Luca had not. The Harbor Office had left the case open. They could not close it because there was no body, and no witness to the sinking. In the Harbor Office, absence was not evidence. In the Office of Attestations, absence was simply a lack of construction.

  Mara slid the slip into the slot. She turned the wheel.

  It resisted. This was the physical law of the Office. The wheel did not turn based on sentiment. It turned only if the claim was backed by a witness. To claim "Alive or Dead," she needed to produce a witness for "Alive" or a witness for "Dead." She had neither. She had only the gap where he should be.

  The wheel locked solid. The mechanism inside groaned, a sound of heavy gears refusing to mesh. The slip popped back out, untouched by the seal.

  Mara took the slip. Her hand did not shake. She had expected this. The logic of the Office was strict: you cannot claim a disjunction unless you hold one of the branches. She held neither.

  She took a second slip from her pocket. On this one, she had written the variant. The one the rules allowed without a witness.

  *It is not the case that it is not the case that (Luca Vane is Alive or Luca Vane is Dead).*

  She slid this slip into the slot. She turned the wheel.

  It spun freely. There was a smooth, oiled click, and the slip was sucked into the vault. The seal stamped itself onto the paper inside with a sound like a bone breaking.

  She had entered the truth. Formally, it was valid. In the logic of the Office, the double-negative was free. It cost nothing to deny the denial. But as she walked back to Desk Four, the hollowness of it pressed against her sternum. She had proven that it was impossible for the question to be unaskable. She had proven that the law of excluded middle was not contradictory.

  She had not proven anything about Luca.

  She sat down. The sequence Kappa-9 waited. The inkwell was full. She looked at the column of numbers she had built over two decades. It was a tower of digits reaching into the dark. It was alive because she fed it. If she stopped, the sequence died. It would not be finished; it would be severed.

  She needed to work. She needed the ground.

  She pulled a different ledger toward her. This was her private research, sanctioned under Clause 14: *Investigation of Restricted Classes.* She had been studying sequences where the branching was finite. In the main hall, most sequences were infinite paths through infinite trees. You could walk forever and never see the end. But in this restricted class, every path stopped. You could not walk forever. Eventually, you hit a wall.

  Mara dipped her pen. She began to trace the paths of a specific bounded construction. She moved the term forward. Then again. She watched the branches of possibility prune themselves.

  For the first time in three years, she felt the solid click of certainty.

  Because the paths were finite, she could see the bottom. She didn't need to wait for the next term to know the shape of the whole. She could exhaust the possibilities. She could say, with the full weight of the Office behind her, *This sequence ends here.*

  It felt like standing on stone instead of water. It was a uniform, bounded answer. She could write the conclusion today, without waiting for tomorrow's witness. The truth was complete. It sat in her hand, heavy and final.

  She looked at the conclusion. It was perfect. It was dead.

  To know the bound, she had to declare the sequence complete. To declare it complete, she had to stop supplying terms. If she stopped supplying terms, she was no longer a witness clerk for Kappa-9. The sequence would be sealed. It would become a artifact, a thing of the past. It would no longer grow.

  The cost of the bound was the future.

  She capped her pen. The solid ground she had found was a grave.

  A shadow fell across her desk.

  Mara looked up. A man stood there. He wore a suit of a cut she did not recognize, the wool too smooth, the shoulders too sharp. He held a briefcase made of a material that didn't scuff.

  "Inspector," Mara said. She did not stand. Clerks did not stand for Inspectors unless they carried a warrant.

  "From the Eastern Branch," the man said. His voice was flat, devoid of the port's lilt. He placed a form on her blotter. It was red. The Office used black. "We've been reviewing the open files. The Vane case."

  Mara looked at the form. It was a Request for Reclassification.

  "The Harbor Office says the file is open," the Inspector said. "They say they lack a witness. They say the construction is incomplete."

  "They are correct," Mara said.

  "In the East, we operate under a different statute," the Inspector said. He tapped the form. "Section 9, Paragraph 4. If it can be ruled out that no witness exists, then a witness exists, full stop."

  Mara looked at the words. She read them twice.

  *If the non-existence of a witness leads to a contradiction, the witness is deemed present.*

  It was the shortcut. It was the Eastern Rule. It allowed you to claim existence by proving that non-existence was impossible. It bypassed the construction. You didn't need to build the bridge; you only needed to prove the abyss could not be there.

  "Under this rule," the Inspector said, "your son's file could be closed tomorrow. We would assign a default witness. A theoretical construct. The state would attest that he is accounted for. You would receive the death certificate. Or the survival notice. The file would be sealed."

  Mara looked at the red form. It promised the one thing the black ledger had denied her. Closure. It promised to move Luca from the open sea to the sealed vault. It would stop the waiting. It would stop the Tuesdays at the Register where the wheel refused to turn.

  "How?" Mara asked. "How do you rule out that no witness exists?"

  "You sign here," the Inspector said. He pointed to a line at the bottom. "You attest that the search space is exhaustive. You attest that there is no room for him to be hidden. Once you sign that, the contradiction is established. If he were missing, there would be room. You say there is no room. Therefore, he is not missing. He is found."

  It was a trick of language. It was a trick of logic. It was a way to force the world to fit the ledger.

  "If I sign," Mara said, "the sequence stops."

  "The file closes," the Inspector corrected. "The sequence is irrelevant. The state requires a value. Alive or Dead. We will provide the value."

  "You will provide a witness I haven't seen."

  "We will provide a witness the logic demands."

  Mara looked at her hand. It was stained with ink. The stain went into the cuticles, permanent. She had spent twenty-two years feeding Kappa-9. She had spent three years trying to feed Luca into the Register.

  She thought about the bounded class she had worked on an hour ago. The solid ground. The cost of the bound. To know the end, she had to kill the sequence.

  If she signed this form, she would kill the sequence of her son. She would declare the search space exhaustive. She would say there is no room for him to be hidden. But the sea was not exhaustive. The sea was infinite. The storm had been chaotic. To say there was no room was a lie.

  But it was a legal lie. It was a bureaucratic truth.

  "If I don't sign?" Mara asked.

  "Then the file remains open," the Inspector said. "You will continue to visit the Register. The wheel will continue to lock. You will continue to hold the double-negative. It is not the case that he is not accounted for. It is a valid statement. It is also useless."

  He waited. He did not press. He was a functionary, not a salesman. In the East, perhaps this was routine. Perhaps they closed files this way every day. Perhaps they believed it was mercy.

  Mara looked at the red form. It offered her the solid ground. It offered her the bound. It offered her the relief of knowing the shape of the thing, even if the shape was forced.

  She thought of Luca. He was twenty-two. He liked the smell of diesel. He hated the color yellow. If she signed, he would become a value. A binary switch. Alive or Dead. The state would decide which, based on the necessity of the closure. He would become a term in a sequence that ended today.

  If she did not sign, he remained a variable. He remained unwitnessed. He remained in the sea.

  She thought of the double-negative slip sitting in the vault. *It is not the case that it is not the case.* It was a floor two levels below the sentence she came in for. It was proof about a proof. It was nothing. But it was honest nothing.

  The Eastern Rule offered something. But it was a something built on the impossibility of absence. It required her to swear that the sea had no hiding places.

  Mara picked up her pen. The nib was still wet from Kappa-9.

  The Inspector watched her. He did not blink.

  Mara moved the red form to the side. She pulled the black ledger closer.

  "I cannot attest that the search space is exhaustive," Mara said. Her voice was quiet, but it carried in the silent hall. "The sea is not a restricted class. The paths are not finite."

  "You are refusing the closure," the Inspector said.

  "I am refusing the witness," Mara said. "I have not seen him."

  "You will not sleep," the Inspector said. "You will not have the certificate. You will not have the grave."

  "I have the sequence," Mara said.

  She dipped the pen. She touched it to the paper of Kappa-9. She wrote the next term. It was a number. It meant nothing outside the Office. It was just a step.

  The Inspector watched her write. He did not move to take the red form back. He let it sit on the desk, a bright red rectangle against the grey wood.

  "When you die," the Inspector said, "the sequence dies. The file remains open. Your successor will not know why you kept it open. They will see it as an error. An inefficiency."

  "Let them," Mara said.

  She finished the term. She signed her name. The ink dried grey.

  The Inspector picked up the red form. He placed it back in his briefcase. He closed the latches. The sound was sharp, final.

  "Eastern Branch respects consistency," he said. "Even when it is costly."

  He turned and walked away. His shoes made no sound on the stone floor.

  Mara watched him go. She watched until he passed through the double doors and out into the light of the harbor. Then she looked down at the ledger.

  The number she had written sat on the page. It was small. It was bounded by the margins of the paper. It was part of an infinite line.

  She capped her pen. She placed it in the rack. She wiped the nib with a rag until it was clean.

  On the desk, the inkwell had skinned over again. She did not break the surface. She left it whole.

  Outside, the gulls cried. The wheel of the Register sat locked in the wall. The double-negative slept in the vault. The sea moved against the breakwater, infinite and unattested.

  Mara stood up. She took her coat from the hook. It was time to go home. She would walk past the Harbor Office. She would see the open file on the board. She would not stop.

  She turned off the lamp at Desk Four. The darkness fell softly, like dust.
