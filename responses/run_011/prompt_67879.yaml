  Let's sharpen the "Reader as Theatre" point. If the reader tries to decide which is true, they are acting like a homunculus. If the text prevents that decision, it forces the reader to accept the indeterminacy. I will argue the latter is the goal.

  Okay, let's write.

  *Structure:*
