prompt: |-
  Work thing that's got me wound up. I do people-analytics at the German arm of a US software firm and we're piloting a tool that flags internal chat and mail for "engagement risk" — not really reading content, more metadata plus inferred attributes: sentiment, burnout likelihood, flight risk, that kind of thing. Our VP over from the States shut down my objection in the meeting with "if you've got nothing to hide you've got nothing to fear", then added that his own team opted in voluntarily and it made them better employees. A colleague in our Shanghai office said pretty much the same about the corporate scoring her city is trialling. The Betriebsrat still has to sign off on it here, so I get to write the response.

  Can you take that one sentence apart for me? I want the distinct precise claims hiding in it — what "nothing" covers (illegal acts, embarrassing facts, or things that aren't even facts about me but scores a model produced), whose nothing (just mine, or everyone whose data touches mine), indexed to when (now, or under whatever state and employer I happen to have in fifteen years), and what "fear" is meant to rule out (punishment, misjudgement, being watched at all). For each reading: platitude, defensible, or false. Then tell me which readings he actually needed to get from there to "so sign up", and whether any of them survives the inferred-attribute case — the stuff that's recoded about me that I can't check or contradict even in principle.

  British English please, and no softening it just because he's my boss.
