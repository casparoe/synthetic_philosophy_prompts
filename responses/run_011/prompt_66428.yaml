answer: |-
  You ask for a criterion, and rightly so, but you look for it in the wrong place. You seek it in the flow of benefits—money, schools, tax collection—whereas the distinction lies in the locus of sovereignty. In France and Germany, the religious body is a private corporation with which the state contracts; the *contrat d'association* under Debré or the collection of *Kirchensteuer* are accommodations granted to external societies. In England, the Church is not merely recognised; it is *constituted* by the law of the land as a public organ of the realm. The criterion is this: is the religious body subject to the state's sovereign legislation as an internal part of the polity's own architecture, or is it merely tolerated and funded as an external utility? The French state says, 'We are secular, but we subsidise you.' The English polity says, 'We are incomplete without this spiritual dimension.' That is the judgement upon itself which you cited, and it requires incorporation, not mere accommodation.

  Consequently, your hypothetical reform is not establishment stripped of ceremony; it is disestablishment with a generous settlement. If the Sovereign ceases to be Supreme Governor and Parliament loses its veto on Measures, the Church is no longer accountable to the nation's legislature. It becomes a voluntary society with a legacy contract for schools, indistinguishable in principle from the Catholic schools in France or the religious providers in the American system. The substance of establishment is not the funding of schools, which any state might do for social utility, but the reciprocal discipline of Synod and Parliament. Without that bond, the Church cannot perform its public function of holding the state to a law it did not make. You are confusing the benefits of establishment with its essence, and I fear your tutor would be quite right to call that disestablishment.
