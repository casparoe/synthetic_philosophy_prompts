answer: |-
  Your hypothesis is remarkably close to the mark, though I would suggest the fault line is slightly deeper than a mere stipulative disagreement about agents. You are right that there are two disputes tangled here, but characterizing the first as stipulative about which idealized agent we quantify over might grant the deflationists too much concession on the metaphysics. The real break is not just about who is doing the measuring, but about the ontology of the physical state itself. The deflationists are effectively arguing that the continuum model of classical mechanics is physically false, or at least physically incomplete, because physical systems cannot instantiate real numbers with infinite precision. The structuralists, by contrast, are defending the internal coherence of the classical model and insisting that the properties of that model determine the truth of determinism, regardless of whether the model is perfectly instantiated in nature. When the structuralists talk about shadowing lemmas and uniqueness of trajectories, they are speaking about the mathematics of the model. When the deflationists talk about finite bits and measurement apparatus, they are speaking about the physics of the target system. The disagreement persists because one side is arguing about the map and the other about the territory, and both are calling it determinism.

  If we strip away the verbal maneuvering about what in principle means, the strongest claim the deflationists have is that a physical state cannot carry infinite information, and therefore the phase-space point is a category error when applied to reality. Their argument is not merely that we cannot know the state, but that the state, as defined by classical mechanics, does not exist. They are pushing a form of physical finitism where the exponential divergence of trajectories matters because it amplifies the inherent granularity of physical states into macroscopic unpredictability, making the deterministic label vacuous. The strongest claim the structuralists have is that determinism is an ontic thesis about the uniqueness of evolution given a state, not an epistemic thesis about predictability given a measurement. They argue that even if we cannot know the initial condition, the system itself follows a unique path, and that the robust statistical features preserved by chaos, like invariant measures, are the physically relevant quantities anyway. For them, the failure of predictability is a limitation of the observer, not a indeterminacy of the world, and the shadowing lemma provides the mathematical bridge that keeps simulations tethered to reality even if not to the specific trajectory we intended.

  Progress on this front depends entirely on which layer of the dispute you think is resolvable. If the disagreement is primarily semantic, then progress looks like a clean separation of terminology where we agree to call the ontic property determinism and the epistemic property predictability, acknowledging that chaos severs the link between them without destroying the former. This would dissolve the tension by admitting both sides are right about different things. However, if the disagreement is substantive, as I suspect it is, then progress requires a physical argument about the information content of bounded regions that does not rely on operationalist assumptions. We would need a theory, likely from quantum gravity or thermodynamic limits, that dictates whether physical state spaces are fundamentally continuous or discrete. Until we have a physical reason to reject the continuum idealization, the deflationist argument rests on a metaphysical preference for finitism, and the structuralist argument rests on a metaphysical preference for classical realism. The shadowing lemma dispute regarding non-hyperbolic systems is a technical proxy for this deeper issue; even if shadowing holds, it only shadows a trajectory in the continuum model, which brings us back to whether that model applies.

  Given this diagnosis, I am inclined to think that no significant progress should be expected within the confines of classical mechanics alone, because the question is ill-posed without a settled ontology of physical quantities. The debate has stalled because it is being fought with the tools of dynamical systems theory to solve a problem that is ultimately about the interpretation of mathematical physics. A theorem about shadowing times cannot answer whether the universe is analog or digital, and a philosophical distinction between ontic and epistemic cannot answer whether infinite precision is physically realizable. The most productive move would be to change the question from whether chaos undercuts determinism to whether classical mechanics is the correct framework for discussing determinism in physical systems. If your department continues to argue this without referencing the physical limits of information storage or the status of the continuum, you are likely witnessing a verbal dispute disguised as a technical one, where each side is correctly analyzing a different object under the same name.
