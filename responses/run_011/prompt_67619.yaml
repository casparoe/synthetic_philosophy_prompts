answer: |-
  # Which Account of Knowledge Do You Actually Hold?

  **Instructions:** Read each scenario. Choose the option that best matches your intuitive judgment about whether *knowledge* is gained. Do not overthink; pick the view you would defend in a seminar.

  1.  **The Wet Pavement.** You step outside and see the pavement is wet. You did not see rain.
      1.  You do not *know* it rained; you only guess based on habit.
      2.  You know it rained, but only because you have inferred it from past experience of wet pavement.
      3.  You know it rained directly; the wetness delivers the cause without a separate mental step.

  2.  **The Universal Claim.** A mathematician tells you "All primes greater than 2 are odd." You cannot check them all.
      1.  You cannot know this is true; you haven't seen all the numbers.
      2.  You know it is true because the proof allows you to infer the unobserved cases.
      3.  You know it is true because the relationship is perceived directly in the concepts.

  3.  **The Stranger's Warning.** A person you've never met says, "The bridge ahead is out." You have no evidence of their reliability.
      1.  You do not know the bridge is out; you merely believe them until verified.
      2.  You know the bridge is out, but only because you unconsciously infer they are likely reliable.
      3.  You know the bridge is out simply because they said it; speech itself delivers knowledge.

  4.  **The Expert's Fact.** A physicist tells you a fact about quarks you could never verify or infer yourself.
      1.  You do not know it; you only trust the source.
      2.  You know it, but your knowledge is reducible to your inference of the physicist's competence.
      3.  You know it directly from the testimony; their competence is irrelevant to the source's validity.

  5.  **The New Animal.** You are told, "A *gavaya* is like a cow." Later, in the woods, you see a *gavaya* and recognize it.
      1.  You did not know it was a *gavaya* until you perceived it; the description was useless.
      2.  You knew it via inference: "It resembles a cow, therefore it matches the description."
      3.  You knew it via a unique link between the name and the thing established by the similarity.

  6.  **The Name Tag.** You see a strange tool. A colleague says, "That is called a *wrench*." Later you identify wrenches independently.
      1.  You only learned a noise associated with an object; identification is pure perception.
      2.  You inferred the class of objects based on the initial description.
      3.  You gained a distinct knowledge of the relation between word and object that isn't just inference.

  7.  **The Night Worker.** Your friend is alive but never seen during the day. You conclude they work at night.
      1.  You don't know this; it's just a plausible story.
      2.  You know this via standard inference (cause to effect).
      3.  You know this via a distinct process of resolving a puzzle that isn't standard cause-effect reasoning.

  8.  **The Empty Table.** You look at a table and see no cup.
      1.  You do not know the cup is absent; you only see the table.
      2.  You know the cup is absent, but only because you infer it from seeing the empty table surface.
      3.  You know the cup is absent directly; absence is a distinct object of knowledge.

  9.  **The Missing Keys.** You search your pocket and feel no keys. You know they aren't there.
      1.  You only feel the fabric; "absence" is just a label for not feeling keys.
      2.  You infer their absence from the presence of the fabric.
      3.  You perceive the absence itself as a positive fact.

  ***

  ## Scoring Key & Logical Space

  **Calculate Your Count:**
  *   **Base:** Everyone starts at **1** (Perception).
  *   **Inference:** If you chose **2 or 3** on Q1–2, add **1**.
  *   **Testimony:** If you chose **3** on Q3–4, add **1**. (If you chose 2, you accept knowledge but reduce it to Inference).
  *   **Comparison:** If you chose **3** on Q5–6, add **1**.
  *   **Postulation:** If you chose **3** on Q7, add **1**.
  *   **Absence:** If you chose **3** on Q8–9, add **1**.

  **The Leaves:**

  1.  **One Source (Perception Only).** *Classical Materialist.* **Awkward Commitment:** You must deny you know anything about unobserved causes, futures, or others' minds.
  2.  **Two Sources (Perception + Inference).** *Buddhist Epistemologist.* **Awkward Commitment:** You must argue that trusting a teacher is logically identical to calculating smoke from fire.
      *   *Note:* Analytic reductionists ("Testimony is perception + induction") land here. The quiz cannot separate you from the Buddhist; own the reduction.
  3.  **Three Sources (+ Testimony).** *Sāṃkhya.* **Awkward Commitment:** You must explain why speech is irreducible while similarity (Comparison) is not.
  4.  **Four Sources (+ Comparison).** *Nyāya.* **Awkward Commitment:** You must defend why learning a name via similarity is distinct from being told the name, but explaining a puzzle (Postulation) is not.
  5.  **Five Sources (+ Postulation).** *Prābhākara Mīmāṃsā.* **Awkward Commitment:** You accept reasoning from contradiction to resolve puzzles, but deny you can directly perceive "nothingness."
  6.  **Six Sources (+ Absence).** *Bhaṭṭa Mīmāṃsā / Advaita Vedānta.* **Awkward Commitment:** You must defend that "nothing" is a knowable object distinct from the empty space containing it.

  **Logical Space & Empty Seats:**
  The hierarchy above is cumulative because later sources presuppose earlier ones. You cannot have Testimony without Inference (to understand meaning), nor Absence without Perception (to see the locus).
  *   **The "Absence without Testimony" Profile:** Two of you will likely pick Absence (Q8–9) but reduce Testimony (Q3–4). This seat is historically empty. Why? Because Absence is typically invoked to protect Testimony (e.g., knowing a sacred text *did not* say X). Accepting negative cognition while rejecting social knowledge is structurally unstable; you accept the tool but reject the job.
  *   **The Analytic/Buddhist Overlap:** Modern epistemology often reduces Testimony to Perception (of sounds) + Inference (of reliability). This maps exactly to the Two-Source view. Do not claim you are a Nyāya philosopher if you reduce testimony to induction; you are a Buddhist in modern clothing.

  **Appendix: The Octet?**
  Later Vedānta lists sometimes propose seven or eight sources, adding *Sambhava* (possibility/inclusion) and *Aitiha* (hearsay/tradition).
  *   **Verdict:** Neither survives as irreducible. *Sambhava* (knowing the whole from parts) collapses into Inference. *Aitiha* (knowing from tradition without known author) collapses into Testimony.
  *   **The Leaf:** "The Octet" is a theoretical possibility but historically unused; no school defends them as independent because they lack a unique causal mechanism not covered by the standard six.
