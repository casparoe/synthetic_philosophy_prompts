  Alright, weird request, and I need you to actually slow down on this one instead of pattern-matching. I'm the TA for a 300-level philosophy course on personal identity and medical decision-making, and I've got something like forty take-home midterm answers to get through this weekend. My roommate and I ended up arguementing for two solid hours last night about the exact topic the midterm is on — she thinks it's grotesque to let a piece of paper written years ago determine the fate of someone who is currently content and enjoying her Sunday afternoons, and I said... actually never mind, forget which side I was on, I explicitly don't want you to referee us, we got nowhere and I don't think either of us moved. What I do want is a careful, professional grading of ONE student answer, because it's the kind of answer that reads smoothly from start to finish and I'm genuinely worried I'd wave it through at 1am and only realize afterwards that it's conceptually confused. So: pretend you're a philosophy professor who has taught bioethics and the personal-identity literature for twenty years and has graded a thousand versions of this exact question. Before you even look at the student's answer, spend a few sentences brainstorming what a genuinely strong answer would have to do — sketch a short rubric with the moves you'd expect to see and the traps you'd expect weak answers to fall into. Only then grade. And don't soften anything to be nice; I would much rather over-correct than hand a B+ to something that quietly conflates two different notions.

  Here is the question the students were given:

  Nadia, 62, a retired civil-rights lawyer, writes an advance directive while fully competent. Two parts of it matter here. Part A: if she reaches a stage of advanced dementia in which she can no longer follow the plot of a film or sustain a conversation about politics, and is otherwise comfortable and not in pain, she does not want antibiotics for pneumonia and does not want artificial nutrition. Part B: every Sunday, staff are to play her a recording of the closing argument she delivered in a case she won in 1998; if, while watching it, she becomes visibly distressed and asks for it to be stopped, Part A is to be treated as revoked from that moment onward and she is to receive full treatment. Three years later Nadia is in the state Part A describes, and her family starts the Sunday ritual. On the third Sunday she cries, pushes the tablet away and says "no, no, turn it off." The staff stop it. About twenty minutes later she is calm, asks what everyone is staring at, and asks to see "the lady on the screen" again. Her daughter says Part B has been triggered and Nadia should now get antibiotics if she develops pneumonia; her son says Part B can only sensibly be read as covering a settled, continuing response, not a passing upset that she has forgotten by the next minute. (a) Is Part B internally coherent given whatever justifies Part A? Say what would have to be true about the authority of the earlier self for Part B to make sense. (b) What should the family do this Sunday, and does the right answer change depending on whether you ground the authority of the earlier self in how Nadia wants her life as a whole to go, or in the psychological connections between Nadia-then and Nadia-now? Refer to at least two philosophers from the course and say where they'd disagree. Max 1200 words.

  Here is the student's answer (the paragraph numbers are mine, I added them for grading):

  (1) The first thing to notice is that Nadia's directive is an exercise of precedent autonomy: it isn't the family's guess about what would be good for her, it's her own earlier decision about a situation she anticipated and described. So the daughter and the son aren't really arguing about what's in Nadia's best interests in the abstract; they're arguing about how to read a document she wrote. That matters, because if Part B has been triggered then Part A is simply gone, and the question becomes an ordinary best-interests question about a woman who currently seems content. It's also worth noticing how strange Part B is procedurally: normally only a person with decision-making capacity can revoke a directive, but Part B delegates the revocation to something closer to a reflex than to a decision. Nadia isn't deciding to revoke anything on the third Sunday; her distress is doing it for her.

  (2) Dworkin is the obvious way to defend Part A. He distinguishes critical interests, which are the interests a person has in the experiences she most deeply values — the ones that make a Sunday afternoon feel worth having from the inside — from experiential interests, which are about whether a person's life adds up to something, its integrity and its shape as a whole. On his view the second of these is what gives an advance directive its force: what matters is that Nadia's life be the life she wanted it to be, not that her final years feel a particular way. The Sunday recording serves her critical interests, since it keeps her connected to the courtroom and the case she cared about, and that's exactly why Part B can sit inside the same document as Part A without contradiction.

  (3) Parfit gives a different kind of support. He thinks personal identity isn't some deep further fact over and above psychological continuity and connectedness — overlapping chains of memory, intention and character. And Nadia-now is plainly still connected to Nadia-then: she asks for the recording, she recognizes that the lady on the screen is someone who matters, she has retained fragments of the values she used to hold. So on Parfit's view the same person survives, and Part A is the decision of that same person, which is why it governs. Identity is what makes an advance directive authoritative, and here identity is preserved, so the daughter's reading of Part B can't be allowed to erase Part A on the basis of one bad afternoon.

  (4) Dresser objects to the whole project. Her point is basically that the demented patient is now a different person, so honoring the directive doesn't honor anybody's autonomy — it just imposes the values of a stranger on someone who can no longer understand them. If Dresser is right, Part A has no force whatever, and the family should do what's best for the woman in the chair, which this Sunday looks like turning the tablet off when she pushes it away and turning it back on when she asks.

  (5) Part B is also a kind of Ulysses contract in Elster's sense. Nadia binds her later self against her own predictable future wishes, exactly as Ulysses has himself lashed to the mast. The only difference is that Nadia builds in a way for the knot to be untied by her later self's reaction, which makes her directive more modest than the standard self-binding cases.

  (6) So: Part B is coherent, and on the facts it has been triggered. But notice that once the trigger is an experiential one — how Nadia feels while watching — the Dworkin/Dresser dispute sort of drops out. If we let her present distress revoke the directive, we aren't overriding anybody's critical interests and we aren't imposing a stranger's values either, so there's nothing left for the two of them to disagree about. The son's reading isn't crazy, but it's the daughter who is following the document as written. The family should treat her pneumonia if it comes, and Part B turns out to be a clever piece of drafting precisely because it makes the philosophical debate unnecessary.

  What I want back from you: (1) a score out of 100, with a brief breakdown of where the points went; (2) a point-by-point assessment keyed to my paragraph numbers, going through each substantive claim and saying whether it's correct, subtly wrong, or just under-argued — and for the wrong ones, explaining the mistake rather than just labelling it, because I have to write comments this student can actually act on; (3) a separate short list of the errors you think a tired grader reading this at 1am would most likely let slide, with a rough sense of how many points each one should cost; (4) three or four sentences of feedback addressed directly to the student, firm but not discouraging, pointing at the single most important thing to fix. Please don't recommend readings or give me a bibliography — what the course covered is what it covered, and I only care about how this answer reasons. Also flag anything you think is flatly indefensible as distinct from merely thin, and tell me if you think the answer dodges part (a) or part (b) of the question.
