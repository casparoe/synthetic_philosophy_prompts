      *   *Selector:* Natural selection is blind/physical. Scientific selection involves human judgment, sociology, prestige, gatekeeping (as per user's experience). This is a major disanalogy.
      *   *Fitness/Truth:* Biological fitness is reproductive success. Scientific corroboration is supposed to track verisimilitude (closeness to truth), though fallibly.

  4.  **Evaluate the Conclusions based on Disanalogies:**
      *   *Conclusion 1 (Demarcation):* If science is just selection, and astrology also has variation/selection (loosely), then demarcation is degree. *Counter:* The *mechanism* of selection matters. If scientific selection is normative (critical rationality) and astrological selection is not (ad hoc patching without risk), the disanalogy in *how* selection occurs restores demarcation. The geophysics example shows science can degrade into non-science (sociological survival), suggesting demarcation is vital to prevent this.
