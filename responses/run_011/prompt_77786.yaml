answer: |-
  Dear Colleague,

  It is a pleasure to engage with a question born of such deep practical experience, for too often philosophy of science is conducted by those who have never had their hands dirty with the actual rock. Your unease is well-founded, and while the analogy between evolutionary selection and scientific progress is one Popper himself cherished, it is indeed doing more work in your friend's argument than it can bear. To audit this properly, we must first lay out the correspondences as your friend maps them, treating them as claims about structural identity rather than mere metaphor. The mapping begins with the assertion that a tentative theory in science corresponds to a genetic mutation or variation in a biological population. Following this, the refutation of a theory by experiment is paired with the selective event in nature, such as a change in climate or predation, that eliminates unfit variants. The published literature and the training of graduate students are identified as the mechanism of inheritance, transmitting successful traits to the next generation of ideas. The physical world, as interrogated by instruments, is cast in the role of the environment that exerts pressure. Corroboration is equated with fitness, meaning survival and proliferation. Competing research programmes are seen as competing lineages, and finally, the consensus of a field at a given time is treated as the population itself.

  Having set out these pairings, we must immediately distinguish between the descriptive and prescriptive uses of the analogy, because your friend's conclusions rely on sliding between them. Popper originally used the analogy descriptively to explain how knowledge grows without an originating subject, suggesting that knowledge evolves much like life does. However, he also used it prescriptively to urge scientists to be like Einstein rather than the amoeba, meaning they should actively seek to kill their own theories rather than waiting for nature to kill them. Your friend's first conclusion, that demarcation is a matter of degree, relies on a purely descriptive reading where any system with variation and selection counts as science. His third conclusion, that rationality dissolves into natural process, also relies on this descriptive reading, implying that because the process is natural, it cannot be normative. Yet, if the analogy is to preserve the distinctiveness of science, it must be prescriptive, demanding a specific kind of selection pressure that astrology does not face.

  Now we must separate the disanalogies that are merely picturesque from those that undermine the argument. It is harmless to concede that biological evolution takes millions of years while science moves faster, or that genes are physical while theories are abstract. These are superficial differences. The disanalogies that matter are the ones you suspected, and they strike at the heart of the mechanism. First, variation in evolution is blind with respect to the needs of the organism, whereas scientific conjectures are deliberately aimed at solving a specific problem. This means science is teleological in a way biology is not, guided by intentionality. Second, biology generally forbids the inheritance of acquired characteristics, but science demands it. When a theory is refuted, the next conjecture incorporates the lesson of that failure, making scientific evolution Lamarckian. Third, and most crucially given your experience in geophysics, the selector in biology is the physical environment, which is indifferent and immutable, whereas the selector in science is often a community of colleagues whose judgments are influenced by prestige, funding, and tenure.

  Your observation about the fracture network model in your own field illuminates this third disanalogy perfectly. You noted that the model fell out of use when the gatekeepers retired, not when a decisive measurement killed it. On your friend's analogy, this is just selection doing its work. However, this looks much more like the death of the organisms than the death of their theories, which violates Popper's specific distinction that scientists should let their theories die in their place. If the theory survives because its proponents hold power, and dies when they lose power, the selection pressure is sociological rather than empirical. This imports a feature into the target domain that natural selection lacks: the ability of the variant to manipulate the selector. In nature, a gazelle cannot bribe the lion to ignore its slow speed. In science, a researcher can obscure a failed prediction by retuning parameters or controlling journal access. This disanalogy is not merely picturesque; it destroys the claim that the process is purely empirical.

  With these disanalogies on the table, we can evaluate your friend's three conclusions. The first conclusion, that demarcation is a matter of degree because astrologers also venture guesses, does not survive. The disanalogy regarding the selector restores the demarcation. Science is demarcated not merely by the presence of guessing and sifting, but by the institutionalized commitment to empirical sifting over sociological sifting. Astrology may vary and be sifted by vague experience, but it does not submit to the severe, institutionalized critical pressure that defines the scientific selector. Your geophysics example actually proves the danger of losing this demarcation; when the field allowed sociological selection to replace empirical selection, it ceased to function as science should, even if it retained the label. Therefore, the hunt for a criterion is not a pseudo-problem but a safeguard against the very stagnation you witnessed.

  The second conclusion, that selection cannot justify and survival is no warrant for truth, partially survives but is misleading. It is true that survival does not guarantee truth, and Popper never claimed it did. However, the Lamarckian disanalogy matters here. Because science inherits the lessons of refutation, later theories are often genuinely closer to the truth than earlier ones, possessing higher verisimilitude. Biological survival does not imply progress toward a goal, only adaptation to a niche. Scientific survival, when the selection is genuinely critical, implies progress toward a better explanation. So while survival is not proof of truth, the mechanism of scientific selection is designed to track truth in a way biological selection is not designed to track perfection. Your friend is right that we cannot be certain, but wrong to imply that scientific survival is epistemically equivalent to biological survival.

  The third conclusion, that the question of rationality dissolves because we have described a natural process, fails because it conflates the descriptive with the normative. If science were only a natural process like evolution, rationality would indeed dissolve into causality. But because the variation is aimed and the selection is governed by norms of critical discussion, science remains a rational enterprise. The rationality lies in the adherence to the method, not in the inevitable outcome. When your colleagues patched the model with adjustable parameters rather than rejecting it, they were behaving irrationally in the Popperian sense, even if sociologically rational. The analogy fails to capture this normative dimension if used only descriptively. Rationality is not dissolved; it is the very thing that distinguishes the scientific selector from the natural selector.

  Regarding your suspicion about iterative engineering design, I believe you are onto something superior for your specific context. The engineering analogy captures the aimed variation and the Lamarckian inheritance much better than the biological one. In engineering, a specification is varied against a known failure criterion, and the failure is recorded to improve the next design. This matches your experience of patching models, except that engineering ideally demands that a failed design be scrapped or fundamentally revised, not merely patched to hide the failure. The distortion this analogy brings is that it implies a known goal or specification, whereas fundamental science often searches for the goal itself. However, for applied geophysics, where the goal is predicting fluid flow, the engineering analogy is more honest. It admits the teleological nature of the work and places the responsibility for failure on the designer, not on a blind natural process. It preserves the normative element: a bridge that stands because the inspectors were bribed is not a good bridge, even if it survives.

  In sum, the analogy was carrying the conclusions only by suppressing the disanalogies that matter. It requires a descriptive reading to dissolve demarcation and rationality, but it requires a prescriptive reading to make sense of Popper's exhortation to let theories die. Your experience shows what happens when the prescriptive element is abandoned for the descriptive reality of sociological survival. The biological analogy is too weak to support the weight of epistemology because it lacks intentionality, Lamarckian learning, and a normative selector. You should feel confident in rejecting your friend's conclusions. The demarcation problem is real because the mode of selection matters. Survival is not truth, but critical selection is our best tool for approaching it. And science is rational precisely because it is not merely a natural process, but a critically controlled one. Your intuition that the death of the gatekeepers killed the theory rather than the death of the theory killing the gatekeepers is the precise point where the analogy breaks, and holding onto that distinction is essential for understanding what went wrong in your field.

  Yours sincerely,

  A Philosophical Interlocutor
