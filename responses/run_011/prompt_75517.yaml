      *   *(d) Error (Khyāti) vs. DIF/Contamination:* Nyāya *anyathākhyāti* (misplacement). Psychometrics: Systematic error.
          *   *Resolution:* Nyāya error is ontological (real snake, wrong place). Psychometrics error is statistical (variance not due to $\theta$).
          *   *Verdict:* Mapping breaks. Psychometrics treats error as noise/variance; Nyāya treats it as a specific cognitive event with content.

  4.  **Deconstruct Part 3: Residue Report & Verdict:**
      *   *Tier 1 (Clean):* Testimony (Informant reports), Inference (Latent estimation - structurally).
      *   *Tier 2 (Distorted):* Perception (Raw data vs. Valid Cognition), Comparison (Linking vs. Knowledge of Similarity).
      *   *Tier 3 (No Counterpart):* *Nirvikalpaka* (Pre-conceptual), *Vyāpti* (Exceptionless universality), Error as Misapprehension (Contentful error vs. Variance).
      *   *The Verdict:* Does residue indict Psychometrics or deflate Nyāya?
          *   *Argument:* Psychometrics is instrumentalist (prediction/score accuracy). Nyāya is realist (truth correspondence). The residue shows Psychometrics lacks a normative account of *truth*, focusing instead on *precision*.
