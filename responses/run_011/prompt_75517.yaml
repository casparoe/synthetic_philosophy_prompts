          *   *Conditions of Success:* Model fit, measurement invariance (MI), identification.
          *   *Failures:* Model misfit, DIF (Differential Item Functioning).
          *   *Limit:* *Vyāpti* is necessary/universal; IRF is probabilistic/stochastic.
      *   *Upamāna* (Comparison/Analogy): User suggests "linking unfamiliar instrument to familiar anchor."
