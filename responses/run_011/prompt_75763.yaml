      Good evening. For those who don't know me, I'm the best man. I'm also the brother. That means I've had a front row seat for nine years of this relationship, and I've learned something important about how it began.

      For nine years, they have told the story of their first moment. They have never told the same one.

      Hers is the ferry. Late August. Rain coming sideways. She says he turned to her at the rail, over the engine noise, and spoke. That was the spark.

      His is three months earlier. A departmental coffee hour. She told him, in front of four people, that his analysis was wrong. He looked at his coffee cup and thought: oh, it's her.

      I need to tell you something about the ferry. I was on that crossing. I was standing behind them. The wind was too loud for speech. They stood at the rail with their hands in their pockets and looked at the water. Neither of them said a word the whole way over.

      For nine years, I've been on the verge of telling them this at every Thanksgiving. I have decided not to. And I want to explain why handing you my version would be a bad trade.

      If I give you the silence, I take away the start. Because the thing about beginnings is that they are hard to spot while you are living through them. The wind was just wind. The water was just water. The silence was just quiet. None of those things know they are part of a love story yet.

      You cannot know where a line starts until you've seen where it lands.

      They composed different lines. She needed the rain and the engine noise to make sense of the closeness. He needed the coffee and the correction to make sense of the respect. Those details weren't in the air that day. They were built later, out of the nine years that followed. But they were dated back to the ferry, and to the coffee hour, because that is the only shape in which something-began-here can be felt at all.

      This isn't a disagreement about evidence. It isn't a lie. It isn't charming confusion. It is what it looks like from the inside when an interval turns out to have mattered. To correct them would be to trade a living truth for a dead fact. The silence on the boat was real, but it wasn't the beginning. The story they tell is the beginning.

      So I am keeping my secret. Not to protect them from the truth, but to protect the truth from me. The wind and the rail and the pockets and the water—they are all still there. But the words they put into the wind are the ones that built this life.

      Please raise your glasses. To the bride and groom. To the stories you tell, and the life you build inside them.

