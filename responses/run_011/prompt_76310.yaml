prompt: |-
  I'm TAing the discussion section for a seminar on diachronic rationality and I want to hand out Memento as the optional viewing, because Leonard strikes me as the best money-pump case anyone ever put on film and I've never seen him used that way. Here's the reading I want. Teddy spends the last stretch of the movie explaining that Leonard will forget, pick the hunt back up, and be steered into killing whoever Teddy points him at — that's a pump operator describing his own pump out loud, and he's been running it for a year. Then Leonard, knowing exactly this, writes himself a note he knows is false, burns the photos that would correct it, and goes off to get Teddy's plate tattooed on him: he deliberately makes himself pumpable, except he's the one who's set to collect. Is that rational precommitment, a perversion of it, or something the precommitment / sophisticated-choice machinery doesnt have a slot for? I'd also like you to press the stock move — being pumpable shows your preferences are incoherent — and say whether it survives an agent whose problem isn't cyclical preferences at all but a broken transmission belt between successive selves. And don't treat the reverse chronology as window dressing: the film's opening image is chronologically its last event, so tell me whether that ordering changes who's choosing and when, or whether it's just a gimmick. Don't hedge and don't lay out options for me to pick between — take a side on each question, give reasons, and flag wherever you're leaning on a contestable reading of the movie.
