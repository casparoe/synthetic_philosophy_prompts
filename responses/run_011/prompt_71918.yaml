  The clerk begins to count the keys again,
  Ensuring every locked and held room
  Is occupied by some arriving guest.
  He runs a finger down the master list,
  Verifying the strict numerical order,
  Then calls the latest arrival's name.

  To make a space he shifts each registered name
  Down the corridor, refusing to count
  The cost of breaking established order.
  One moves from any given room
  To the next number on the list,
  Making way for the single guest.

  Now coaches arrive with every seated guest,
  Each bearing a unique and prime name,
  Assigned by power according to the list.
  We count the powers of two and three,
  Leaving each unused room
  Dark, sacrificed to maintain order.

  This scheme requires a prior fixed order,
  Seats numbered before the arrival of any guest.
  The hotel supplies no vacant room
  Until the sequence bears a name.
  It is a favor we count as given,
  Written in ink before the list.

  The list extends beyond any completed sum,
  Confessing that the order is a rule
  For going on, where the count is never done.
  What has been built accommodates no guest
  As fully present; each assigned name
  Refers to a step, not a finished room.

  Yet every room stands ready and complete,
  A paradise where the master list
  Guarantees a place for every proposed name.
  We shall not be expelled from this order,
  Though the argument claims no guest
  Can survive the rigor of the count.

  Into the room where the diagonal alters the list,
  A new name enters outside the established order,
  Bringing a guest beyond the scope of count.
