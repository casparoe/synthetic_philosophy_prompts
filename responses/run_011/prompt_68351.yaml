      *   *Let's simplify:* Keep it to the prompt's instinct. Teams produce a verdict. Plenary reveals disagreement. Round 2 adds data. Debrief explains *why* they disagreed using the 4 choices. The "scoring" is secondary to the cognitive dissonance. I will use a "Confidence Wager" system where they bet on whether their verdict will hold after Round 2. If they change their mind, they lose the wager. This teaches that initial certainty was misplaced due to data scarcity.

      *(Self-Correction)*: The prompt asks for a scoring scheme that teaches something.
      *Idea:* Teams get 5 tokens. They bet on their Verdict (Collapse/No Collapse).
