answer: |-
  # Session Plan: The Collapse Wager

  **Course:** Societal Resilience (History/Anthropology/Env Science)
  **Level:** Second-Year Undergraduates
  **Time:** 90 Minutes
  **Class Size:** 24 Students (6 Teams of 4)
  **Goal:** Move students from arguing about *whether* collapse happened to analyzing *how* the definition of collapse is constructed.

  ---

  ## 1. Preparation & Materials List
  *Print these on standard letter paper. Cut cards along the lines. No technology required.*

  **A. The Tokens (30 minutes prep)**
  *   Cut 60 small slips of paper (approx. 1x1 inch).
  *   Write "1" on 30 of them and "5" on 30 of them.
  *   Put 5 tokens (mix of 1s and 5s) into 6 small envelopes.
  *   **Lesson:** The tokens represent *epistemic confidence*. Losing them represents the cost of certainty without full data.

  **B. The Society Dossiers (30 minutes prep)**
  *   Create 6 large envelopes, labeled **Team 1** through **Team 6**.
  *   **Society A (The Ostracian Polity):** Teams 1 & 2.
  *   **Society B (The Vaelen River System):** Teams 3 & 4.
  *   **Society C (The Kethic Highlands):** Teams 5 & 6.
  *   *Inside each envelope:* The specific "Data Cards" listed in Section 3 below + 1 "Mission Sheet" (Section 2).

  **C. Room Setup**
  *   6 tables/clusters of desks.
  *   Whiteboard/Blackboard divided into 3 sections (one for each Society).
  *   Markers/Chalk.

  ---

  ## 2. The Mission Sheet (Handout for every student)
  *(Print 24 copies)*

  **MISSION: THE COLLAPSE WAGER**
  **Time Limit:** 15 Minutes per Round.

  **Your Task:**
  1.  Read your Data Cards.
  2.  Answer the binary question: **Did this society collapse?** (YES / NO).
  3.  Draft a **25-word Museum Label** explaining your verdict. (You must use exactly 25 words or fewer).
  4.  **The Wager:** You have 5 tokens. Before you see the other team's work, bet on whether they agree with your verdict.
      *   If they agree: You keep your bet.
      *   If they disagree: You lose your bet.

  **Round 2:**
  You will receive new data. You may revise your verdict.
  **Final Scoring:** You keep tokens only if your final Museum Label acknowledges *why* someone might disagree with you.

  ---

  ## 3. The Data Cards (Cut these out)
  *Note: Distribute as indicated. Do not let teams swap cards until Round 2.*

  ### SOCIETY A: THE OSTRACIAN POLITY (Teams 1 & 2)
  *Theme: Elite vs. Commoner Ledger*

  **TEAM 1 CARDS (The Elite Ledger)**
  > **CARD A1: Royal Stele Fragment (Year 85)**
  > "The King's house is finished. The granaries are full. The gods are pleased. We have conquered the northern hills. Tribute flows."
  >
  > **CARD A2: Monumental Construction Data**
  > Stone quarry output drops 90% between Year 90 and Year 100. No new temples built after Year 95. Royal tombs show hasty construction and looting post-Year 100.
  >
  > **CARD A3: Administrative Tablets**
  > Written records cease abruptly in Year 102. The script is not used again for 400 years. Bureaucratic titles disappear from the archaeological record.

  **TEAM 2 CARDS (The Rural Ledger)**
  > **CARD A4: Settlement Survey (North Hills)**
  > Small farmsteads increase in number from Year 90 to Year 120. Population density in the countryside rises by 15% during the period royal tombs stop being built.
  >
  > **CARD A5: Ceramic Analysis**
  > Local pottery styles continue uninterrupted through Year 150. While "Royal Red" ware disappears, "Common Grey" ware shows increased technological refinement and distribution range post-Year 100.
  >
  > **CARD A6: Isotope Data (Human Bone)**
  > Skeletal remains from rural cemeteries (Year 90–130) show no increase in stress markers or malnutrition. Average height remains stable.

  ---

  ### SOCIETY B: THE VAELEN RIVER SYSTEM (Teams 3 & 4)
  *Theme: Time Window & Baseline*

  **TEAM 3 CARDS (The Short Window)**
  > **CARD B1: Flood Stratigraphy**
  > Massive silt layer dated to Year 110. Evidence of catastrophic flooding destroying 60% of riverside settlements. Fire damage on 40% of structures.
  >
  > **CARD B2: Population Census Estimate**
  > Population drops from 50,000 (Year 100) to 15,000 (Year 115). A 70% decline in one generation.
  >
  > **CARD B3: Political Record**
  > The central capital is abandoned in Year 112. The title of "High River King" is not claimed again for 80 years.

  **TEAM 4 CARDS (The Long Window)**
  > **CARD B4: Recovery Stratigraphy**
  > Silt layer (Year 110) is covered by new settlement debris by Year 140. Rebuilding uses the same foundation lines as pre-flood structures.
  >
  > **CARD B5: Population Census Estimate**
  > Population recovers to 55,000 by Year 180. Higher than pre-flood peak.
  >
  > **CARD B6: Cultural Continuity**
  > Religious iconography from Year 100 is identical to Year 180. The flood is remembered in myth, but the political system returns to the exact same structure as before.

  ---

  ### SOCIETY C: THE KETHIC HIGHLANDS (Teams 5 & 6)
  *Theme: The Genuine Catastrophe (Resists Relativism)*

  **TEAM 5 CARDS (The Initial Shock)**
  > **CARD C1: Settlement Pattern**
  > 200 fortified hilltop sites occupied in Year 200. 0 sites occupied by Year 220. Complete abandonment of the highland region.
  >
  > **CARD C2: Paleobotany**
  > Pollen core shows sudden shift from cultivated grain to wild scrub vegetation in Year 215. No evidence of agriculture for 300 years.
  >
  > **CARD C3: Trauma Analysis**
  > 60% of skeletal remains from Year 210–220 show perimortem blunt force trauma or arrow wounds. Mass graves found in former storage pits.

  **TEAM 6 CARDS (The Aftermath)**
  > **CARD C4: Craft Technology**
  > Metallurgy disappears. Tools revert to stone and bone for three centuries. Knowledge of smelting is completely lost in the region.
  >
  > **CARD C5: Genetic Diversity**
  > Ancient DNA shows a 90% reduction in genetic diversity in the region post-Year 220, indicating a massive population bottleneck or replacement.
  >
  > **CARD C6: Oral Tradition (Recorded 1000 yrs later)**
  > Neighboring societies record a "Time of Silence." No travelers come from the Highlands. The region is considered cursed and avoided.

  ---

  ## 4. Minute-by-Minute Run of Show

  **00:00 – 00:10 | Introduction & Grouping**
  *   **Action:** Hand out envelopes and Mission Sheets. Assign Teams 1–6.
  *   **Script:** "You are archaeological assessors. You have partial data. You must make a binary decision: Collapse or No Collapse. You have 5 tokens. Your goal is to keep them."
  *   **Rule:** Do not talk to the other team studying your society. Do not ask the instructor for clarification.

  **00:10 – 00:25 | Round 1: Analysis & Verdict**
  *   **Action:** Teams read cards, debate, write their 25-word label, and place their **Blind Bet** (tokens in a closed fist) on whether the *other* team (studying the same society) agrees with them.
  *   **Instructor Role:** Circulate. If a team asks "Is this collapse?", reply: "That is your decision to make."
  *   **Constraint:** Enforce the 25-word limit strictly. It forces them to prioritize metrics.

  **00:25 – 00:35 | Plenary Conflict (The "Wait, What?" Moment)**
  *   **Action:** Ask Team 1 for their verdict. Ask Team 2 for their verdict. Write on board.
  *   **Expected Outcome:**
      *   Society A: Team 1 says YES (Monuments stopped). Team 2 says NO (Farmers thrived).
      *   Society B: Team 3 says YES (Population crashed). Team 4 says NO (Recovery happened).
      *   Society C: Both say YES (Everyone died).
  *   **Action:** Reveal the Bets. Most will lose tokens because they assumed their data was the *whole* story.
  *   **Script:** "You looked at the same place and the same years. How did you disagree?" (Let them argue for 2 minutes. Do not resolve it yet).

  **00:35 – 00:50 | Round 2: The Missing Data**
  *   **Action:** Collect Team 1's cards and give them to Team 2, and vice versa (same for 3/4 and 5/6).
  *   **Task:** Read the new cards. You may revise your verdict. You may rewrite your label.
  *   **Scoring Condition:** To win back lost tokens, your new label must explain *why* the first verdict was incomplete.
  *   **Instructor Role:** Watch Society C (Kethic). They should realize more data doesn't change the verdict. Watch Societies A & B. They should realize the verdict *depends* on which card you value.

  **00:50 – 01:05 | Plenary Resolution & Betting Payout**
  *   **Action:** Teams read their revised labels.
  *   **Society A:** Should now say something like, "Elite structures collapsed, but rural life continued."
  *   **Society B:** Should now say, "Short-term crash followed by long-term resilience."
  *   **Society C:** Should remain "Catastrophic collapse."
  *   **Action:** Award tokens back to teams whose labels acknowledge the complexity (Instructor discretion).

  **01:05 – 01:25 | The Debrief (Mapping the Four Choices)**
  *   **Action:** Draw the "Four Choices" framework on the board. Map the game moments to the theory.
  *   **Script:** "You just fought the exact battle historians fight. Here is the map of your disagreement."
      1.  **The Ledger:** (Society A). Team 1 counted stones (Monuments). Team 2 counted bones/pots (Subsistence). *Collapse is a choice of what to measure.*
      2.  **The Window:** (Society B). Team 3 saw 20 years (Crisis). Team 4 saw 200 years (Cycle). *Collapse is a choice of timeframe.*
      3.  **The Perspective:** (Society A). Team 1 tracked the King. Team 2 tracked the Farmer. *Collapse is a choice of whose suffering counts.*
      4.  **The Baseline:** (Society C). Even if you change the ledger or window, Kethic is worse than *any* baseline. *Some things are objectively catastrophic.*
  *   **Key Takeaway:** "Camp A (Collapse is Real) and Camp B (Collapse is Bias) are both right. Collapse is a real event *relative to the choices you make about how to measure it.*"

  **01:25 – 01:30 | Wrap Up**
  *   **Action:** Collect tokens.
  *   **Script:** "Next week, we apply these four choices to the Bronze Age. Don't just ask 'Did it collapse?' Ask 'Which ledger are you using?'"

  ---

  ## 5. Risk Analysis: What Will Go Wrong?

  **1. The "Puzzle Mindset"**
  *   **Risk:** Students will treat the cards as a logic puzzle with one correct solution. They will try to "hack" your grading.
  *   **Fix:** In Round 1, refuse to validate answers. In the Debrief, explicitly state: "There was no correct answer in Round 1. The disagreement *was* the lesson."

  **2. Dominant Voices**
  *   **Risk:** In teams of 4, one Env Sci student might dominate the data interpretation, silencing the History students.
  *   **Fix:** Assign roles on the Mission Sheet (Scribe, Speaker, Timekeeper, Skeptic). The "Skeptic" must find one reason why the verdict might be wrong.

  **3. Society C (Kethic) gets ignored**
  *   **Risk:** Students focus on the ambiguity of A and B and treat C as an outlier.
  *   **Fix:** In the debrief, spend equal time on C. Emphasize that *denying* collapse in Society C would be unethical. This prevents the course from sliding into pure relativism.

  **4. Time Creep**
  *   **Risk:** Round 1 discussion runs long.
  *   **Fix:** Be ruthless with the 25-word limit. If they write 30 words, make them cut it down. This forces decision-making.

  ---

  ## 6. The Gap: What a Card Game Cannot Reproduce

  You asked to be frank about the limitations. The biggest gap is **Fragmentary Uncertainty.**

  In this game, the cards are clean. "Population drops 70%." In real research, the card reads: "Sample size n=4, potential taphonomic bias, confidence interval ±20%."
  *   **The Risk:** Students might leave thinking that if we just *had* the missing cards, we would know the truth.
  *   **The Reality:** In real history, the missing cards are never found. The evidence is always muddy.
  *   **How to Address:** In the debrief, explicitly state: "In this game, the data was certain. In reality, the data is contested. If the cards themselves were ambiguous, your disagreements would be even harder to resolve. That is the actual job of the historian."

  ---

  ## 7. Instructor Key (For your eyes only)

  **Society A (Ostracian):**
  *   **Choice 1 (Ledger):** Monuments vs. Subsistence.
  *   **Choice 2 (Perspective):** Elite vs. Commoner.
  *   **Lesson:** "Collapse" often just means "The Elite lost power."

  **Society B (Vaelen):**
  *   **Choice 3 (Window):** Event vs. Epoch.
  *   **Choice 4 (Baseline):** Pre-flood vs. Post-recovery.
  *   **Lesson:** Resilience often looks like collapse in the short term.

  **Society C (Kethic):**
  *   **All Choices:** All ledgers show decline. All perspectives show suffering. All windows show loss.
  *   **Lesson:** Relativism has limits. Some events are catastrophic regardless of the metric. This validates the "Collapse is Real" camp without invalidating the "Collapse is Constructed" camp for other cases.

  **Scoring Logic:**
  *   Tokens are not for being "right." They are for **Epistemic Humility**.
  *   If a team bets high on agreement in Round 1, they lose. (Teaches: Partial data creates false confidence).
  *   If a team revises their label in Round 2 to include nuance, they regain tokens. (Teaches: Complexity is more valuable than certainty).
