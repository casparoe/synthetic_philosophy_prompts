  6.  **Timing (90 Minutes):**
      *   0-10: Intro & Grouping.
      *   10-25: Round 1 (Analysis & Verdict).
      *   25-35: Plenary Conflict (The "Wait, you saw what?" moment).
      *   35-50: Round 2 (New Data & Revision).
      *   50-65: Plenary Resolution & Betting.
      *   65-85: Debrief (The 4 Choices Framework).
      *   85-90: Wrap.

  7.  **Addressing the "What Goes Wrong" & "Limitations":**
      *   *Risk:* Students treating it as a puzzle with one solution. *Fix:* Instructor must refuse to validate "correctness" until the end.
      *   *Risk:* Dominant voices in groups. *Fix:* Assign roles (Scribe, Speaker, Timekeeper).
      *   *Limitation:* Cards are too clean. Real evidence is muddy. *Fix:* Acknowledge this in debrief. The game simplifies the *ambiguity of evidence*, not just the *interpretation*.

  8.  **Refining the "Four Choices" Integration:**
      *   I need to make sure the cards explicitly trigger these choices.
