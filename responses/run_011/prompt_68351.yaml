          *   Logistics: Minute-by-minute, materials list (printable, no tech), debrief mapping moments to the 4 choices.
          *   Risk Analysis: What will go wrong? What can a card game *not* reproduce (e.g., fragmentary evidence)?
          *   Language: American English.

  2.  **Deconstruct the Pedagogical Challenge:**
      *   The core tension is *epistemological*. Students think they are arguing about *ontology* (did it happen?). The instructor knows they are arguing about *parameters* (how are we defining it?).
      *   The activity needs to force them to realize their disagreement stems from the data they *didn't* see or the metrics they *privileged*, not the data itself.
      *   *Constraint:* 24 students. Groups of 4 = 6 groups. Or Groups of 3 = 8 groups. Let's go with 6 groups of 4 for better discussion dynamics, or 8 groups of 3 for more plenary variety. 6 groups allows 2 groups per fictional society. This is crucial. If Group 1 and Group 2 both study Society A but get different cards, they can disagree.
      *   *Refinement:* Let's make it 3 Societies x 2 Teams each = 6 Teams of 4 students. This ensures direct conflict in the plenary.

  3.  **Design the Societies (The "Dossiers"):**
      *   Need to map the 4 choices (Ledger, Perspective, Window, Baseline) into the data.
      *   *Society 1 (The "Elite Collapse" Trap):* Looks like collapse if you look at monuments/palaces (Ledger 1, Perspective 2). Looks like continuity if you look at rural pottery/diet (Ledger 4, Perspective 3). *Verdict: Ambiguous/Semantic.*
      *   *Society 2 (The "Time Window" Trap):* Looks stable over 300 years. Looks like collapse over 20 years (invasion/famine), then recovery. *Verdict: Depends on Window.*
      *   *Society 3 (The "Genuine Catastrophe"):* Everything goes to hell. Population drops 90%, settlement abandoned, craft lost, skeletal health crashes. No matter the ledger or window, it's bad. *Verdict: Hard Collapse.* (This addresses the requirement to avoid the "cheap conclusion" that collapse is *just* a word).

  4.  **Design the Mechanic:**
      *   *Round 1:* Teams get an envelope with 3-4 cards. They must decide: Did it collapse? (Yes/No). Write a 25-word label.
      *   *Betting:* Give them "Confidence Tokens." They bet on their verdict. If they agree with the "Instructor Key" (which is actually nuanced), they win. *Wait, better idea:* The scoring shouldn't be about being "right" (since there is no right), but about *predicting the other team*.
      *   *Revised Betting:* Teams bet on whether the *other* team studying the same society will agree with them. This highlights the divergence.
      *   *Round 2:* Distribute the "Missing Cards." Teams must revise.
      *   *Scoring Lesson:* The scoring teaches that certainty is dangerous when data is partial.

  5.  **Drafting the Content (Iterative Process):**
      *   *Names:* Needs to sound anthropological but fictional.
          *   Society 1: The Ostracian Polity (Monument focus).
          *   Society 2: The Vaelen River System (Time focus).
          *   Society 3: The Kethic Highlands (Catastrophe focus).
      *   *Cards:* Need to look like data snippets. "Strata Layer 4," "Isotope Analysis," "Royal Stele."
