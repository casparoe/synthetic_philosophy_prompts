answer: |-
  This is a crisp formulation of the Frege-Geach problem, sharpened by your specific worry about its overgeneralization in step (6). You are right to be disquieted: if this argument holds, it eliminates not just ethical non-cognitivism, but expressivist treatments of epistemic modals, conditionals, and predicates of taste—domains where truth-conditional semantics faces well-known difficulties.

  To answer you properly, I will map the diagnostic space, identify the most viable rejection point given your constraints, evaluate the theoretical costs, and finally assess the "Quasi-Realist" surrender on step (5).

  ### 1. Mapping the Space of Diagnoses

  Let us briefly survey the pressure points. The argument is valid; to resist the conclusion, we must deny a premise.

  *   **Rejecting (1) (Compositionality):** This claims meaning determines contribution to complex contexts. To deny this is to deny that language is systematic.
      *   *Cost:* Prohibitive. It renders language unlearnable and logic inexplicable. No serious philosopher of language pays this price.
  *   **Rejecting (2) (Embeddability):** This claims moral sentences occur in unasserted contexts.
      *   *Cost:* Empirical falsity. We do say "If lying is wrong..." Denying this is linguistic obscurantism.
  *   **Rejecting (3) (Univocality/Validity):** This claims the antecedent contributes the *same* meaning as the asserted sentence, and this secures validity.
      *   *Cost:* The "Ambiguity Strategy." One could argue "Lying is wrong" means one thing when asserted (expressing an attitude) and another when embedded (expressing a thought about an attitude).
      *   *Price:* It makes *modus ponens* in ethics look like a fallacy of equivocation. It severs the logical connection between moral deliberation and moral assertion. This is the "logical problem" that originally motivated the Frege-Geach challenge.
  *   **Rejecting (4) (The Nature of Content):** This claims that only truth-apt, representational contents can embed; acts/attitudes cannot.
      *   *Cost:* The "Expressivist Semantics" Strategy. One must construct a semantics where non-cognitive states (plans, attitudes, commitments) play the functional role of propositions in logic.

  Given your constraint to keep (2) and (3), and the prohibitive cost of (1), **the expressivist must reject (4).**

  ### 2. Why Premise (4) Looked Innocent

  Premise (4) relies on a seductive category mistake: it conflates the **psychological state** expressed with the **semantic content** encoded.

  It looks innocent because it draws on a pre-theoretic intuition about "acts." If I *perform* the act of booing, that act cannot be the antecedent of a conditional. ("If booing, then...") makes no sense. The premise assumes that if the meaning of "Lying is wrong" is *constituted* by the expression of an attitude, then that attitude itself must be the constituent of the conditional.

  But this ignores the distinction between *force* and *content*, or rather, it assumes a specific, robustly representational theory of content. It assumes that for a sentence to embed, it must denote a fact or represent a state of affairs. The expressivist's task is to show that semantic content can be defined by its role in regulating non-cognitive states without those states being "representations" in the cognitivist sense. Premise (4) begs the question by defining "contribution to a larger sentence" as "truth-conditional contribution."

  ### 3. Pricing the Alternatives: The Cost of Rejecting (4)

  If we reject (4), we must explain how non-cognitive states embed. This is not free. Here is the price list for the major strategies on offer:

  **A. Plan-Laden Contents (Allan Gibbard)**
  *   *Strategy:* Normative sentences express acceptance of norms. The content of "Lying is wrong" is a plan-laden content. Logic is the consistency of plans.
  *   *Cost:* You must develop a "logic of plans." You have to explain why plans obey the laws of truth-functional logic without positing truth-values. This requires a complex formal semantics (e.g., hyperstates) that often looks suspiciously like possible-worlds semantics in disguise. The metaphysical savings are threatened by the semantic complexity required to mimic cognitivism.

  **B. Relational Accounts (Mark Schroeder)**
  *   *Strategy:* "Lying is wrong" expresses being *for* blaming for lying. "Being for" is a single attitude type that can take different objects. Embedding works because the attitude type remains constant.
  *   *Cost:* You must posit a unified psychological kind ("being for") that covers both belief-like and desire-like states. Critics argue this is psychologically implausible or merely verbal. Furthermore, you still face the "negation problem" (distinguishing "not being for blaming" from "being for not blaming"), which requires intricate semantic machinery.

  **C. Quasi-Realist Projection (Simon Blackburn)**
  *   *Strategy:* We project attitudes onto the world. We develop a "logic of attitudes" that allows us to talk *as if* there are moral truths.
  *   *Cost:* You walk a tightrope. You must explain why we are *entitled* to talk of truth and validity without believing in the metaphysical underpinnings (moral facts) that usually justify that talk. If you succeed too well, you risk collapsing into cognitivism (if it walks like a duck and quacks like a duck...). If you succeed poorly, you look like you are engaging in a fiction.

  **D. Hybrid Semantics**
  *   *Strategy:* Moral sentences have both truth-conditional content (descriptive) and expressive content.
  *   *Cost:* This often fails to solve the problem. If the truth-conditional part does the logical work, the expressive part is semantically inert (it "free-rides"). If the expressive part does the work, you are back to the original problem. It also struggles to capture the *purely* normative force of the claim.

  **Summary of Costs:** Rejecting (4) forces the expressivist to do heavy lifting in formal semantics and philosophy of mind. They must replicate the structural benefits of truth-conditional semantics (systematicity, logic) without the ontology of truth-makers. It is expensive, but it is the only path that preserves the core expressivist insight while respecting linguistic data.

  ### 4. The Quasi-Realist Surrender: Accepting (5)

  Now, consider your final scenario. Suppose the expressivist bites the bullet and accepts (5): *"The meaning of 'Lying is wrong' is... a content that is either true or false."*

  Does this capitulation render expressivism dead? **No.** This is the heart of the Quasi-Realist project. If the expressivist accepts (5), the substantive disagreement with the cognitivist shifts from **semantics** to **metaphysics** and **psychology**.

  **The Residual Disagreement:**

  1.  **The Nature of Truth (Deflationism vs. Robustness):**
      *   *Cognitivist:* "True" indicates a robust correspondence relation between the sentence and a mind-independent moral fact.
      *   *Expressivist (accepting 5):* "True" is a deflationary device. To say "It is true that lying is wrong" is just to reiterate "Lying is wrong." It is a grammatical facilitator for embedding, not a metaphysical descriptor.
      *   *Disagreement:* The cognitivist posits a property of *truth* that explains the sentence's correctness; the expressivist posits a linguistic practice that *earns the right* to the word "true."

  2.  **The Psychological State (Belief vs. Conation):**
      *   *Cognitivist:* To judge that lying is wrong is to *believe* a proposition.
      *   *Expressivist:* To judge that lying is wrong is to hold a conative state (a plan, a commitment, an attitude of disapproval).
      *   *Disagreement:* Even if both agree the sentence is "truth-apt," they disagree on what is happening in the head of the speaker. This matters for explaining motivation. The cognitivist must explain why moral beliefs motivate (internalism problem); the expressivist explains this by definition (attitudes motivate).

  3.  **Metaphysical Commitments (Facts vs. Projections):**
      *   *Cognitivist:* There are moral facts that make the sentence true.
      *   *Expressivist:* There are no moral facts. The "truth" of the sentence is grounded in the coherence of our attitudes, not in the world.
      *   *Disagreement:* The expressivist accepts (5) syntactically but denies the *ontological commitment* usually associated with (5).

  **Verdict on the Argument:**

  If the expressivist accepts (5) in this deflationary sense, the argument should be counted as a **miss** regarding its ultimate goal (refuting expressivism), but a **success** regarding its dialectical pressure.

  It is a **miss** because it fails to establish Cognitivism in the robust sense (that there are moral facts and moral beliefs). It merely establishes "Minimal Cognitivism" (that moral sentences behave grammatically like truth-apt sentences), which the Quasi-Realist happily grants.

  However, it is a **success** in forcing the expressivist to abandon "hard" non-cognitivism (the claim that moral sentences *literally lack* truth conditions). It forces the expressivist to become a Quasi-Realist. The argument successfully proves that *surface grammar* cannot be ignored.

  ### Conclusion

  Your worry about (6) is the lever that breaks the argument. If (4) were true, we could not have a logic of epistemic modals or taste, which is implausible. Therefore, (4) is false: semantic contribution does not require robust truth-aptness, only *functional* aptness for logic.

  The expressivist rejects (4). The cost is a complex semantics of non-cognitive states (plans/attitudes). If they instead accept (5), they survive by distinguishing *minimal truth* (a grammatical feature) from *robust truth* (a metaphysical feature). The argument does not kill expressivism; it matures it. It shows that expressivism cannot be a thesis about sentence *form*, but must be a thesis about the *psychology* and *metaphysics* underlying that form.

  The colleague's argument proves that moral language *looks* like descriptive language. The expressivist's reply is that looks can be deceiving—or rather, that we have constructed the language to look that way to facilitate the coordination of our attitudes.
