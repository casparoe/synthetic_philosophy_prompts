answer: |-
  Dear Colleague,

  Here is a complete design for the seventy-five minute seminar activity you requested, built to run entirely on paper, pencils, index cards, and dice without any physical apparatus or prior lecture. The goal is to force the students into the metaphysical commitment before they have the vocabulary to name it, making the cost of each position felt through a scoring system rather than argued through definitions. You will need to prepare two types of ledger sheets beforehand. The first type is a grid sheet with Cartesian coordinates printed on it, enough for half the class. The second type is a blank list sheet with columns for Particle Pair, Distance, and Bearing, enough for the other half. You will also need a set of six-sided dice to serve as the particles in the world, roughly three dice per group of students, and a separate die for you to act as the Event Generator. You should arrange the room so that the two halves of the class are seated apart enough that they cannot easily see each other's papers, perhaps opposite sides of the seminar table.

  Begin the class by dividing the fourteen students into two teams of seven, calling them the Coordinate Clerks and the Interval Clerks. Do not use the words substantivalism or relationism, and do not explain the philosophical stakes. Tell them they are bookkeepers for a physical simulation and their job is to record the history of a world containing three particles, represented by the three dice on the table in front of you. The Coordinate Clerks receive the grid paper and must record the exact x and y coordinate of each die at every tick of the clock. The Interval Clerks receive the list sheets and are forbidden from writing down coordinates; they may only record the distance between die one and die two, die two and die three, and die one and die three, along with the bearing or angle of the triangle they form. Explain that you will move the dice according to hidden rules and that their goal is to predict the future state of the world to earn points. Each group starts with ten points. They can bet up to five points on their predictions each round. If they predict correctly, they win the bet amount. If they predict incorrectly, they lose the bet amount. If they run out of points, they are bankrupt and out of the game, which should create immediate tension.

  The game proceeds in ticks, each lasting about five minutes. In the first two rounds, you perform simple translations. Slide all three dice two inches to the right. The Coordinate Clerks will see their numbers change and can easily predict the next coordinates based on the trend. The Interval Clerks will see the distances and bearings remain exactly the same. Both groups should succeed here, earning points and feeling confident. Tell the Interval Clerks that if their data shows no change, they should predict no change in the physical state. Tell the Coordinate Clerks to predict based on the trajectory. In the third round, you introduce the rotation that serves as the Newton bucket equivalent. Rotate the triangle of dice around its center point so that the coordinates change significantly for the Coordinate Clerks, but the distances and bearings between the dice remain identical for the Interval Clerks. Before revealing the outcome, introduce the Event Die. Explain that in this world, physical stress occurs when the system rotates relative to the background, causing a particle to shift outward. Roll the Event Die secretly. If the system rotated, a stress event happens automatically. The Coordinate Clerks, seeing the coordinates change in a circular arc, will predict stress. The Interval Clerks, seeing no change in relative distances, will predict stability. When you reveal that a stress event occurred, the Interval Clerks lose their bet. This is crucial because it makes their parsimony costly. They lacked the information to predict the physical effect because they refused to track the background points. This round should take about fifteen minutes total including the setup and the scoring.

  Now you move to the sting, which should consume the next fifteen minutes. Collect the ledger sheets from the Coordinate Clerks. Without the students seeing, take a fresh stack of grid paper that has the axes shifted by five units, or simply take a red pen and renumber the axes on their existing sheets so that every x coordinate is now five units higher. Return the sheets. Do not move the dice. Announce that a metaphysical shift has occurred in the background of the world. Ask both groups to bet points on the proposition that the world has changed since the last tick. The Coordinate Clerks will look at their sheets and see different numbers, so they will bet that the world changed. The Interval Clerks will look at their distances, see no change, and bet that the world is the same. Collect the bets. Then reveal that the dice did not move relative to each other and no stress event occurred. Declare that there is no empirical test to determine who is right. Both groups lose the points they bet on this question because the question itself was undecidable by the rules of the game. This forces them to feel the frustration of the Leibniz shift argument without you having named it. Some students in the Interval group will likely try to escape by arguing that the two histories are really the same world. Allow them to make this claim, but then penalize them by asking how they account for the stress event in the previous rotation round without referencing the background grid. If they say the grid is real only when there is stress, charge them a penalty for inconsistent ontology. If they say the grid is never real, ask them how they predict stress. This forces them to pay for their escape route.

  The remaining twenty minutes are for the debrief, where you finally introduce the labels. Explain that the Coordinate Clerks were acting as substantivalists, treating space as a container that exists independently of the objects, while the Interval Clerks were acting as relationists, treating space as nothing over and above the distances between objects. Map the rotation round to Newton's bucket argument, where absolute rotation explains the concave water surface even when relative positions are static. Map the sting to the Leibniz shift argument, where moving the entire universe five feet to the left leaves all relations unchanged, challenging the reality of the container. You must be honest about the limitations of this paper game. Tell them explicitly that this simulation is Newtonian, not Einsteinian. In general relativity, the metric field is dynamic and interacts with matter, so the hole argument is more complex than simply shifting a grid on paper. In GR, the spacetime points are not just a passive stage but part of the physical field itself, which is a nuance the dice game cannot reproduce. You will have to supply this distinction with your own mouth because the paper mechanics are too rigid to show curvature or dynamic metrics. Admit that the game makes substantivalism look like it has predictive power only because you rigged the stress rule to depend on absolute coordinates, which is exactly what the relationist denies is possible in the real world.

  There are several predictable failure points you should watch for during the first run. Students often get bogged down in the arithmetic of calculating distances or bearings, which kills the momentum. To prevent this, provide them with a ruler and a protractor, or simplify the grid so that distances are just counted in grid units rather than measured in inches. Another risk is that the Interval Clerks will get bored during the translation rounds because nothing happens on their sheet. Keep these rounds very short, barely a minute each, so the boredom turns into anticipation rather than disengagement. The most likely collapse point is the sting round, where students may refuse to bet or claim the game is broken. If they refuse to bet, remind them that bankruptcy is part of the simulation of scientific risk. If they claim the game is rigged, agree with them and use that feeling in the debrief to explain why philosophers find the hole argument so troubling. Some students might try to cheat by peeking at the other group's ledger. Seat them far enough apart and treat the ledger as private data. Finally, be prepared for the debrief to run long. Students will want to argue about whether the stress rule was fair. Cut this off by reiterating that the rule was the law of their universe, and the question is whether their bookkeeping method allowed them to know it.

  The feature of the debate that this paper game cannot reproduce is the dynamical nature of spacetime in general relativity. In the game, the grid is fixed and absolute, which stacks the deck in favor of the substantivalist during the rotation round. In modern physics, spacetime itself curves and bends, which gives the relationist a way to encode inertial effects into the geometry of the relations themselves without a background container. You will need to explain verbally that the hole argument in GR is not about shifting particles on a grid but about shifting the metric field values over the manifold points, and that the stakes involve determinism rather than just prediction scores. You must also supply the historical context that Newton needed absolute space to make his laws work, while Leibniz rejected it on theological and principled grounds, and that Einstein hoped to eliminate absolute space but arguably reintroduced it through the metric field. The game creates the visceral experience of the stalemate, but you must provide the resolution that the stalemate is still live in contemporary metaphysics of physics. If you keep the rules tight and the scoring strict, the students should leave the room feeling the weight of the ontology rather than just the definition.

  I hope this plan serves your seminar well. It is designed to be tight enough to fit the time limit but loose enough to allow the students to generate the philosophical problems themselves through their own record keeping. The key is to remain silent about the philosophical labels until the very end, letting the frustration of the scoring scheme do the teaching for you. If the Interval Clerks lose points on the rotation round, they will feel the lack of absolute space in their bones, and if they lose points on the shift round, they will feel the redundancy of it. That tension is exactly where you want them to be when you finally open the floor for discussion. Good luck with the session.
