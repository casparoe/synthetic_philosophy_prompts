          *   *Nagel:* "Nagel took the bisection data to show that physicalism cannot accommodate consciousness..." -> *Check.* Nagel discusses split-brain in "What Is It Like to Be a Bat?" and other papers, but his main point is usually about the subjectivity of experience, not necessarily that physicalism *fails* solely due to bisection. He uses it to highlight the problem of combining subjects. This is a bit of a simplification but acceptable for a literary essay.
          *   *Parfit:* "your brain is divided and each half transplanted... verdict... there are two people where there was one." -> Accurate to *Reasons and Persons*. Parfit argues identity doesn't matter; survival matters. The "counting" is indeterminate or doesn't matter in the way we think. The draft says "determinate answer — there are two people." Parfit might say "two survivors," but the *identity* relation is one-to-two, which breaks transitivity. This is a slight mischaracterization of Parfit's reductionist view, but close enough for a summary.
