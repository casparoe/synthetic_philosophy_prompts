  # JOINT STATEMENT ON THE STATUS OF THE ANTHROPOCENE
  **Prepared by the Adversarial Collaboration Working Group (Stratigraphic & Earth System Camps)**

  ### I. Joint Claims of Fact and Utility
  *Both camps affirm the following propositions as true, regardless of formal nomenclatural status.*

  1.  **Stratigraphic Visibility:** Human activity has produced material signals (radioisotopes, carbon isotopes, novel minerals, biological turnover) that are detectable and will remain detectable in the geological record for millions of years.
  2.  **Systemic Shift:** The Earth System has moved out of the Holocene's stable state into a new state characterized by human forcing as a dominant variable.
  3.  **Terminological Utility:** The term "Anthropocene" serves a necessary function in communicating the scale of this shift to scientific, political, and public audiences.
  4.  **Procedural vs. Ontological:** The 2024 vote by the Subcommission on Quaternary Stratigraphy (SQS) rejected the *formal ratification* of the Anthropocene as a Geological Epoch; it did not reject the *reality* of the stratigraphic signals nor the validity of the concept in non-formal contexts.
  5.  **Marker Existence:** There exists at least one global, synchronous marker (specifically the mid-20th-century radionuclide spike) capable of serving as a Golden Spike (GSSP), even if its suitability as the *sole* definitor of the unit is disputed.

  ***

  ### II. Table of Disagreements
  *Each row represents a proposition that Camp A affirms and Camp B denies (or vice versa), worded to be acceptable to the affirming side.*

  | Domain | Camp A (Stratigraphic Formalists) | Camp B (Earth System Conceptualists) |
  | :--- | :--- | :--- |
  | **Definition** | A geological time unit must be defined by its material content in the rock record, not by the causal agent that produced it. | A time unit describing Earth System history must be defined by the dominant forcing mechanism (human agency), not solely by material residue. |
  | **Temporal Precision** | A boundary must be isochronous (simultaneous globally) to function as a chronostratigraphic horizon. | A boundary representing a systemic transition is inherently diachronous (spread over time) across different latitudes and environments. |
  | **Authority** | The International Commission on Stratigraphy (ICS) is the sole authority for defining geological time units; without their stamp, "Epoch" is incorrect usage. | Interdisciplinary Earth System science communities hold authority over the concept; ICS authority is limited to rock classification, not planetary history. |
  | **Start Date** | The only defensible start date is the mid-20th century (c. 1950), as it is the only point with a synchronous global signal. | Multiple start dates are defensible (e.g., 1610, 1800, 1950) depending on the specific Earth System variable being analyzed. |

  ***

  ### III. Cruxes and Test Cases
  *These are the specific sub-questions where resolution would shift allegiance. We have tested two specific suspicions regarding Cause and Synchronicity.*

  #### Crux 1: Cause vs. Signature
  **The Question:** Can a geological unit be defined by its *cause* (human agency) rather than strictly by its *material signature*?

  *   **Camp A Commitment:** Geology records effects, not intentions. If the material signature exists, the unit exists, regardless of whether humans caused it. If humans caused it but left no distinct material signature, it is not a geological unit.
  *   **Camp B Commitment:** The "Anthropocene" is defined by the dominance of human agency. If the material signal persists but human agency ceases (e.g., extinction), the Anthropocene has ended even if the rock signal continues.
  *   **Falsification Condition:**
      *   *Against Camp A:* Discovery of a pre-human stratigraphic layer identical to the Anthropocene in all material respects (proving the signal is not unique to human agency).
      *   *Against Camp B:* Proof that human agency can be rigorously distinguished in the record without relying on the material signature itself (i.e., finding "agency" without "matter").

  #### Crux 2: Synchronicity (The Core Test Case)
  **The Question:** Does a boundary have to be synchronous to be a single boundary?
  **The Case:** Two cores are analyzed. Core 1 (High-Latitude Lake) shows industrial soot and mercury deposition beginning in **1850**. Core 2 (Tropical Peat Swamp) shows deforestation and charcoal spikes beginning in **1550**. Both signals are unequivocally human. They are 300 years apart.

  *   **Camp A Commitment:** These are **not** the same boundary. Stratigraphy requires time-rock equivalence. The 1550 signal is a local lithostratigraphic event; the 1850 signal is a different local event. The *Anthropocene Boundary* must be a single surface, best represented by the 1952 Plutonium spike which appears in both cores simultaneously.
  *   **Camp B Commitment:** This **is** the same boundary (the onset of the Anthroposphere), manifesting diachronously. The "boundary" is the transition interval of human dominance, which naturally spreads from region to region. Mapping it as a single instant artificially slices a continuous process.
  *   **Agreed Evidence:** Global correlation potential. Can the 1550 and 1850 signals be tied to a single causal chain that validates them as one event, or are they independent local responses?
  *   **Predictions:**
      *   *Camp A Prediction:* Future stratigraphers will map the 1952 radionuclide horizon as the primary boundary; the 1550/1850 signals will be classified as "precursor facies."
      *   *Camp B Prediction:* Future stratigraphers will map a "Transition Zone" (1550–1950) where the boundary depth varies by latitude; the 1952 spike will be viewed as just one marker within the zone.
  *   **Falsification Condition:**
      *   *Against Camp A:* Demonstration that the 1952 spike is absent or unrecognizable in 40% of viable sedimentary environments, rendering it useless as a *global* boundary.
      *   *Against Camp B:* Demonstration that the 300-year lag is not a systematic spread of influence but random noise, making correlation impossible.

  ***

  ### IV. Joint Glossary
  *To prevent verbal disputes from masking substantive ones, we agree to the following distinctions.*

  1.  **Epoch:**
      *   *Camp A Usage:* A formal chronostratigraphic unit defined by a Global Boundary Stratotype Section and Point (GSSP) in rock.
      *   *Camp B Usage:* A distinct period in Earth System history defined by a shift in dominant forcing mechanisms, regardless of formal ratification.
  2.  **Onset:**
      *   *Camp A Usage:* The precise instant of the boundary surface (e.g., Jan 1, 1950).
      *   *Camp B Usage:* The beginning of the transition interval during which human forcing becomes dominant (e.g., 1500–1950).
  3.  **Boundary:**
      *   *Camp A Usage:* An isochronous surface separating two time-rock units.
      *   *Camp B Usage:* A diachronous zone of transition separating two Earth System states.

  ***

  ### V. Clause on the Rejected Vote
  *Regarding the SQS/ICS vote rejecting the formal proposal.*

  1.  **What it Settles:** There is currently no *formally ratified* Geological Epoch called the Anthropocene in the International Chronostratigraphic Chart.
  2.  **What it Doesn't Settle:** It does not settle whether the Anthropocene is a valid concept for Earth System science, nor does it preclude future ratification if new evidence or definitions are proposed.
  3.  **Authority Verdicts:**
      *   **Camp A:** Takes the ICS/SQS vote as **authoritative**. Without it, "Anthropocene" is informal slang when used in a geological context. Camp A views Camp B's authority (interdisciplinary consensus) as the **wrong kind of authority** (sociological rather than stratigraphic).
      *   **Camp B:** Takes the ICS/SQS vote as **authoritative only for rock classification**. For planetary history, authority lies with the broader scientific community. Camp B views Camp A's authority as **just wrong** for this specific problem (too narrow to capture the phenomenon), rather than the wrong kind entirely.

  ***

  ### VI. Falsification Summary
  *One line per Crux on what would count against that side's own position.*

  *   **Crux 1 (Cause):** If human agency is proven to be stratigraphically invisible without its material byproducts, Camp B loses; if a natural process is found to mimic the Anthropocene signal perfectly, Camp A loses.
  *   **Crux 2 (Sync):** If the 1952 marker is found to be locally absent in key sedimentary archives, Camp A loses; if the diachronous signals cannot be correlated to a single expanding human system, Camp B loses.
