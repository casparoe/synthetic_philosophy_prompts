      *   *Economic Reality:* The "Pigouvian tax" ideal (tax = marginal social cost) is theoretically sound for efficiency *in a vacuum*. However, in a second-best world (with existing income/payroll taxes), the optimal carbon tax is often *lower* than the social cost of carbon because adding a tax on energy (a complement to labor) can exacerbate existing labor market distortions. The "strong double dividend" (revenue recycling makes the economy *better* off than before the tax) is generally considered unlikely or weak by most economists. The "weak double dividend" (using revenue to cut distortionary taxes reduces the cost of the policy) is more accepted.
      *   *Fix:* Don't claim the tax fixes *everything* or equals the *exact* damage perfectly. Focus on the signal. Acknowledge it's not magic, but better than guessing.
