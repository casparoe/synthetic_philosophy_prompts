answer: |-
  Elias: We require a single sentence for the prospectus explaining the disappearance of duelling. I propose we state that the practice ceased when the structure of honor sustaining it collapsed. The norm was honor-structured: violation meant loss of standing, and one could not discount that standing without ceasing to belong to the group. The change was structural, not intellectual.

  Sarah: I cannot endorse that formulation. It implies the arguments against duelling were incidental. The practice ended because people were persuaded. The reasons against it—that it settles nothing about justice, that it rewards nerve over right—came to be generally accepted. That change in belief did the causal work. We should state that the norm faded because its justification was successfully challenged.

  Elias: Your view neglects the definition we stipulated. Clause (ii) specifies that the agent cannot discount the body's opinion without ceasing to belong. This is not a matter of belief. A gentleman could believe duelling was absurd yet still be compelled to fight. The sanction attached regardless of his private judgment. The change occurred when the body whose contempt was lethal ceased to be one a gentleman could not escape. That is a structural fact.

  Sarah: But clause (ii) already concedes my point. Which body's opinion is undiscardable depends on what a person takes to count as a reason to belong. The relevant body was redrawn by argument itself. It was enlarged, and its criteria were altered, until the old sanction no longer held. You treat the boundary of the group as a fixed constraint, but it is a variable determined by normative reasoning.

  Sarah: Let me ensure I have your position fair. You claim the sanction's reach changed independently of individual belief, a structural shift where the group's grip loosened before the minds changed. You object to my view because it makes the structure dependent on the very beliefs it constrains. Is that accurate?

  Elias: That is accurate. Now let me restate yours. You claim the structure changed only because the arguments changed the composition of the group, making belief prior to structure. You object to my view because it treats the group's authority as brute fact rather than reasoned endorsement. Is that fair?

  Sarah: It is fair. But I object that your structural fact is inert without the internal shift. If the gentlemen still believed the old reasons, the structure would have held. The structure broke because the reasons lost their grip. You cannot separate the container from the content.

  Elias: Consider the sincerity gap. Men who accepted every argument against duelling nevertheless fought. They knew it was irrational but could not stop. This shows the structure bound tighter than belief. If argument did the work, those men would have laid down their pistols. They did not. The sanction operated independently of their judgment.

  Sarah: And men who found the practice absurd were unwilling to be the first to stop. This shows the structure binds only until the cost of belonging exceeds the cost of leaving. But consider a third explanation: duelling served as a credential for a hereditary gentry and officer class. It faded as those positions came to be allocated by examination and seniority. Does this rival our views?

  Elias: It does not rival them; it enables them. The loss of hereditary monopoly weakened the body whose opinion was undiscardable. It made exit possible. But it does not explain why the norm lost its authority. It explains why the structure could change, not why the change took the form of moral persuasion rather than mere force. It presupposes the honor view.

  Sarah: I classify it differently. It enables the argument view. As positions opened to merit, the audience for justification widened. The arguments found purchase in schools and professions that previously lacked voice. But now, Elias, I must accuse you of shifting the explanandum. You move between a change in what individuals judged, the cessation of the practice, and the loss of the norm's authority.

  Elias: I do not shift them. The loss of authority explains the cessation, which coincides with the change in judgment. But I answer your accusation directly: the loss of authority is the primary phenomenon. The practice ceased because the authority vanished, not because the judgments changed first. The judgments followed the collapse of the sanction's reach. Which do you predict?

  Sarah: I answer that the authority vanished because the judgments changed in the institutions that teach reasons. Here is my prediction: the practice should have died first where the arguments were taught most thoroughly. In the schools, pulpits, and newspapers that articulated the case against duelling, the norm should have collapsed earliest. The record should show the intelligentsia abandoning it before the army.

  Elias: Then my prediction is the inverse. The practice should have survived longest where the structure was most closed. In closed corporations, regiments, and small garrison towns where exit was impossible and standing was everything, the norm should have persisted. Where the body's opinion remained lethal, the practice should have remained, regardless of what the newspapers said.

  Sarah: Then we have distinguishable claims. If the records show the army holding out while the press condemned it, you win. If the schools abandoned it while the garrison towns fought, I win. We will let the student check the archives.

  Elias: Agreed. We will write that the explanation is contested. The prospectus should note that the causal priority of structure versus argument remains an open empirical question. That is sufficient for a doctoral committee.

  Sarah: It is sufficient. It frames the dispute without resolving it. I will draft the sentence to reflect these competing predictions. The student can then test which social sphere led the change. That is philosophy enough for today.

  Elias: Very well. I will review your draft. Ensure you do not privilege the argument view in the phrasing. The structural constraint must appear as a live alternative. We are here to clarify the dispute, not to settle it prematurely.

  Sarah: I will ensure the phrasing is neutral. The history will decide. But I maintain that when the archives are read, the power of the argument will be visible in the sequence of abandonment. The structure followed the reason.

  Elias: And I maintain the structure led the reason. When the exit costs fell, the arguments became safe to accept. We shall see. The seminar can discuss the results next term. For now, the prospectus awaits.

  Sarah: Then we are done. I will send the draft by evening. You will see the neutrality holds. The predictions stand side by side.

  Elias: They do. And that is precisely what the students need. A clear fork in the road, not a map drawn by one side. Good day, Sarah.

  Sarah: Good day, Elias.
