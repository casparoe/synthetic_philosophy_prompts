answer: |-
  Based on your verdicts, I have extracted a principle I shall call the **Principle of Contextual Integrity and Graduated Capacity**. It comprises three clauses addressing deception, coercion, and capacity. Below, I state the principle, map it to your cases, identify the tension requiring a surrender of intuition, and apply it to your new scenarios.

  ### The Principle

  **Clause 1 (Deception):** Consent is invalid if deception concerns the **nature of the act** or **intrinsic attributes of the counterparty** constitutive of the specific relationship. Consent remains valid if deception concerns **collateral circumstances**, **professional qualifications**, or **external consideration**, even if these were decisive motivators.
  *   *Motivated by:* Cases 1, 2, 3, and 4.

  **Clause 2 (Coercion):** Consent is invalid if procured by a threat to **fundamental rights** (bodily integrity, life, liberty). Consent remains valid if procured by a threat to **contingent privileges** (employment, wealth, status), provided the refusal is physically possible and the threatener has a lawful right to impose the consequence.
  *   *Motivated by:* Cases 5 and 6.

  **Clause 3 (Capacity and Stakes):** The threshold for valid capacity is **decision-relative**. It rises in proportion to the **irreversibility**, **complexity**, and **gravity** of the consequence. Furthermore, the threshold for exercising a **bodily right** is lower than for transferring a **property entitlement**.
  *   *Motivated by:* Cases 7, 8, and 9.

  ---

  ### Analysis of Friction and Required Surrender

  While this principle captures the majority of your intuitions, it cannot perfectly reconcile **Case 3** (Prostitute/Non-payment) and **Case 4** (Fake Footballer) without a significant caveat, and it exposes a tension in **Case 8**.

  **The Conflict:**
  In Case 3, you deem consent valid despite a lie about payment (consideration). In Case 4, you deem consent invalid due to a lie about status (identity/attribute). Legally and philosophically, both are typically classified as 'fraud in the inducement' rather than 'fraud in the factum'. If the dentist's license (Case 2) is collateral, the footballer's status is arguably collateral as well. To maintain a robust principle, you must treat 'status' consistently with 'qualification'.

  **The Surrender:**
  You ought to surrender your verdict on **Case 4**.
  *   **Why:** If a dentist's professional standing (Case 2) is extrinsic to the validity of the dental procedure, a partner's social standing (Case 4) is extrinsic to the validity of the sexual act. Both concern *who the person is in the world*, not *what is being done to the body*. Unless the woman was impersonating a *specific* individual (e.g., the man's wife), lying about being a footballer is a lie about a quality, not identity.
  *   **Consequence:** If you surrender Case 4 (treating it as Valid), Clause 1 becomes consistent: only deception about the physical act or specific identity vitiates consent; deception about qualities, wealth, or status does not. If you refuse to surrender Case 4, you must complicate Clause 1 to include 'attributes the agent deems essential', which renders the principle subjective and unpredictable.

  **A Secondary Tension (Case 8):**
  Your verdict that moderate drunkenness validates sex but voids a car sale is defensible under Clause 3 (bodily rights vs. property entitlements). However, be aware that this creates a dual standard of cognitive competence. If the woman lacks the capacity to understand the financial loss of £500, it is philosophically inconsistent to claim she possesses the capacity to understand the biological and emotional implications of sex. I advise retaining this verdict only if you accept that bodily autonomy is a 'right to be exercised' (low barrier) whereas contracting is a 'power to be granted' (high barrier).

  ---

  ### Application to New Cases

  Here is what the Principle delivers for the unlisted scenarios, assuming you accept the surrender of Case 4 (treating status lies as valid).

  **1. A man who conceals before sex that he has had a vasectomy.**
  *   **Verdict:** **Valid.**
  *   **Reasoning:** Under Clause 1, fertility is an attribute of the counterparty, akin to the footballer's status or the dentist's license. Unless you define 'procreative potential' as the *nature of the act* itself (which would invalidate contraception use generally), this is collateral deception. It induces the act but does not change its physical nature.

  **2. A researcher who omits a one-in-a-million risk that duly materialises.**
  *   **Verdict:** **Valid.**
  *   **Reasoning:** Under Clause 1, this concerns the nature of the act, but the omission must be material to invalidate consent. A one-in-a-million risk is statistically negligible. Under Clause 3, the capacity threshold for research participation requires understanding *material* risks. Omission of de minimis risks does not vitiate consent, even if the rare outcome occurs.

  **3. A student who signs a plagiarism declaration to avoid expulsion.**
  *   **Verdict:** **Valid.**
  *   **Reasoning:** Under Clause 2, expulsion is a threat to a contingent privilege (enrollment), not a fundamental right (life or bodily integrity). The university has a lawful right to dismiss for plagiarism. The pressure is coercive but not invalidating, similar to the employer in Case 6.

  **4. A worker who agrees to a ninety-hour week because there is no other job to be had.**
  *   **Verdict:** **Valid.**
  *   **Reasoning:** Under Clause 2, economic necessity is not coercion that invalidates consent. The employer is not threatening to *make* the worker poor, but merely offering a contract in a constrained market. There is no threat to a fundamental right; the alternative is poverty, not violence.

  **5. A patient who agrees to a risky operation only because her surgeon has told her it is the sole option.**
  *   **Verdict:** **Valid.**
  *   **Reasoning:** This is not coercion under Clause 2. The surgeon is stating a fact about the patient's physiology, not creating the threat. The 'threat' (death or illness) comes from nature, not the counterparty. Provided the medical assessment is honest (no deception under Clause 1), the consent is valid despite the lack of alternatives.

  ### Summary
  Your intuitions largely track a distinction between **intrinsic integrity** (what is happening to me/who is doing it) and **extrinsic circumstances** (why I am doing it/what I get out of it). To make this principle robust, you must align your view on social status (Case 4) with your view on professional qualifications (Case 2). If you do so, the principle provides a stable framework for distinguishing valid autonomy from manipulated compliance.
