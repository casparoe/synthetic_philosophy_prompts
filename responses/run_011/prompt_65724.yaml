  **The Bench at KaraTepe**

  The generator died at midnight, leaving the dig house in a silence that felt heavier than the heat. Elif sat at the long wooden table, the glow of her laptop screen the only light left in the room. On the screen was Context 404: the bench. Thirty-seven clay cones, arranged in a line along the plastered lip of the bench in Room B. In the center, they were orange and hard, baked by the fire that had consumed the roof. At the ends, they were grey and slumping, raw clay returning to mud.

  The season report was due in three weeks. The Ministry's press office had already leaked a sentence to a journalist in Ankara: *Excavators confirm ritual shrine dedicated to infant protection.* Sarah, the PhD student whose trench it was, had not authorized that sentence. She couldn't retract it either. Now the sentence hung over the table like smoke.

  Aris poured water from a plastic jug. He was the director, a man who treated interpretation like a structural load: something to be calculated, not felt. "We need the headline for the preliminary report," he said. "The Ministry wants 'Shrine.' The data wants 'Storage.' Julian wants 'Toys.' And Elif wants to photograph the mud and go home."

  "Description isn't cowardice," Elif said. She clicked to the next photo. The macro shot showed the fingernail impressions near the base of each cone. Some were deep crescents; others were barely scratches. One was tiny, the size of a child's nail. "If we commit to a function, we delete the other possibilities. Once we write 'votive,' nobody looks for the accounting marks."

  "Because there are no accounting marks," Sarah said. She was sitting on the floor, leaning against the wall. She looked exhausted. "There's an infant under the floor of the adjacent room. One of these cones was in the mouth. That is not economics. That is protection. You don't put a ledger sheet in a baby's mouth."

  "You put a coin in a mouth for Charon," Aris said. "It's a payment. If these are counters, the infant burial suggests a debt paid. Or a wage."

  "It's unfired clay," Julian said from the corner. He was polishing his glasses, a nervous tic. "It's cheap. It's disposable. You're arguing over whether this is a temple or a bank, but it might be a nursery. The small nail marks. The soft material. They made them, they played with them, they left them on the bench. The fire caught them. The one in the mouth was just... there."

  "Equifinality," Elif said. She didn't look up. "Same result, different causes."

  "Exactly," Julian said. "So why choose?"

  "Because the conservator says we can't keep them all," Aris said.

  Nadia, the conservator, had delivered the ultimatum an hour before the generator cut. The raw cones at the ends of the bench were disintegrating. The salts were mobilizing. She could stabilize the baked ones in the center—the ones nearest the heat source—but the raw ones would dissolve if lifted. They had to be left in the ground. But the bench was being backfilled tomorrow to protect the site. Whatever they didn't lift would be buried under three meters of sterile fill.

  "We lift the center," Aris said. "The baked ones hold the data. The nail impressions are clearest there."

  "The ends show the arrangement," Sarah countered. "If we leave the ends, we lose the row. We lose the ritual alignment."

  "The row is a lie."

  Mehmet stood in the doorway. The foreman had thirty seasons of dirt under his fingernails. He didn't look at the screen; he looked at the printed section drawing pinned to the wall. He walked over, tapped the paper with a calloused finger.

  "The roof fell from the north-west," Mehmet said. "Heavy beams. Hit the bench edge first."

  "We know the collapse vector," Aris said.

  "Do you?" Mehmet pointed to the scorching on the plaster beneath the cones. "The fire burned the bench before the roof came down. The heat rose. The cones in the middle baked. The ones on the ends were under the eaves, cooler. When the beams fell, they hit the ends first. Pushed them."

  "Pushed them into a row?" Elif asked.

  "Into a line," Mehmet said. "They were scattered. The debris lined them up against the wall. You photographed a pile and called it a queue."

  The silence returned, but the quality of it had changed. The neat single row—their strongest evidence for intentional placement, for ritual order or economic sorting—was now partly an artifact of destruction. The taphonomy had edited the scene.

  Sarah put her head in her hands. "So the ritual alignment is... debris?"

  "The alignment is compromised," Aris said. He didn't sound defeated. He sounded like he was recalculating. "But the grouping remains. They are still on the bench. And the one in the infant's mouth is still there."

  "Mehmet," Elif said. "You said the fire burned before the collapse."

  "Yes."

  "But the raw cones are slumping," she said. "If the fire was hot enough to bake the center, why didn't it bake the ends before the roof fell?"

  "Because the fuel was in the center of the room," Mehmet said. "Not near the wall."

  "Fuel doesn't move," Aris said quietly. "Grain moves. Wood moves."

  Mehmet frowned. "It was a house. People lived there."

  "People store grain in the center," Aris said. "People store wood near the walls. If the fuel was in the center, it was stored there. Why store fuel in the center of a room unless you are burning it deliberately? Or unless you are guarding a store?"

  Mehmet shifted his weight. He was right about the collapse; the soil mechanics were undeniable. But he was wrong about the fire. He wanted it to be an accident, a tragedy of lightning and dry timber. Aris was suggesting the building was burned intentionally, a closure ritual or a purge. Mehmet's desire for a normalcy that matched the soil was clashing with the chemistry of the burn.

  "So the row is debris," Julian said. "The fire is deliberate. The cones are cheap clay. What are we writing?"

  "We are writing that we found a deposit of clay tokens associated with a sub-floor infant burial," Aris said. "We are not writing 'Shrine.' The Ministry can leak what they want. We control the data."

  "If we leave the raw cones," Sarah said, her voice tight, "we are destroying the evidence of the ends. The ones that didn't bake. If they were counters, why leave the unused ones raw? If they were votives, why were they unfinished?"

  "Because they weren't finished," Julian said. "Practice pieces."

  "Or because the fire stopped," Aris said. "If this is an economic deposit, the raw ones are the current account. The baked ones are the archive. The fire destroyed the current account."

  "You're forcing it," Sarah said. "You're forcing an economy onto a baby's grave."

  "I'm following the clay," Aris said. "The clay says some were used, some were not. The nail marks vary. That suggests individual ownership. Different hands marking their own counters. If it were a cult, why the variation? Why not standardize the votive?"

  "Because people are different," Sarah said. "Because the mother made some, the father made some."

  "Speculation," Aris said.

  "Interpretation," she fired back.

  Elif zoomed in on photo 404-B. The tiny nail impression. It was so shallow it might have been a scratch from a fingernail growing out, or a tool pressed lightly. She thought about the conservator's tray. Nadia could save twelve cones. There were thirty-seven. Twenty-five would go back into the earth. They would dissolve in the winter rains that seeped through the fill. They would become mud again.

  "We have to choose which ones to lift," Elif said. "Nadia needs the list by morning."

  "We take the baked ones," Aris said. "The data is stable."

  "We take the ends," Sarah said. "The raw ones. They show the transition. They show the moment before the fire."

  "If you lift the raw ones, they turn to sludge in the lab," Elif said. "You'll have a box of dust. You'll have a photo of mud."

  "Then we photograph them," Julian said. "That's all we have anyway. Photos and notes. The object is gone the moment we touch it."

  "That's the fourth option," Elif said. "We admit we can't know. We publish the photos. We say 'Deposit of clay objects.' We let the next season dig it."

  "There is no next season," Aris said. "Funding is cut. This is the report."

  The weight of the sentence landed on the table. This was the only chance. The choice of which cones to lift was a choice of which story to preserve. If they lifted the baked center, they preserved the 'archive,' supporting Aris's economy. If they lifted the raw ends, they preserved the 'process,' supporting Sarah's ritual or Julian's toys. If they lifted nothing, they preserved the uncertainty, but lost the physical evidence entirely.

  "Mehmet," Elif said. "You said the debris lined them up. Does that mean the center ones are more likely to be in situ?"

  "The center was under the roof peak," Mehmet said. "Less crushing. The ends were under the eaves. More weight."

  "So the center is more reliable," Aris said. "The taphonomy favors the baked cones. The physical survival matches the informational survival."

  "It matches your theory," Sarah said.

  "It matches the fire," Aris said. "I didn't light it."

  Elif looked at the screen. The orange cones in the center looked solid, permanent. The grey ones at the ends looked like ghosts. She thought about the infant under the floor. A cone in the mouth. Was it a coin for the dead? A toy for the child? A counter for a debt the family owed?

  The evidence didn't snap into place. It resisted. The nail marks were too varied for a factory, too uniform for random mud. The bench was too clean for a trash heap, too messy for a shrine. The fire was too hot for an accident, too contained for a purge.

  "We lift the center," Elif said.

  Sarah stood up. "You're choosing the economy."

  "I'm choosing the clay that survives," Elif said. "If we lift the raw ones, we lose them. If we lift the baked ones, we have them. We can argue about what they mean forever. But we can't argue about dust."

  "And the ends?" Nadia asked from the doorway. She had come back for the answer.

  "Document them," Elif said. "Photogrammetry. Every angle. Then leave them."

  "They'll dissolve," Nadia said.

  "I know."

  Nadia nodded. She didn't like it, but she understood. Preservation is always triage. She turned to leave.

  "Wait," Aris said. He walked to the table. He opened the season report draft. The cursor blinked in the field labeled *Interpretation of Feature 404*. "We need the sentence."

  "Don't write it," Julian said. "Just say 'Uncertain function.'"

  "The Ministry won't accept 'Uncertain,'" Aris said. "They need a narrative. They need to know if they're protecting a shrine or a settlement."

  "If you write 'Shrine,' you lock us into the cult," Sarah said. "If you write 'Storage,' you lock us into the market."

  Aris typed. He didn't look at them. He looked at the screen, at the blinking cursor. He typed: *Feature 404 represents a household deposit of counting tokens, associated with secondary burial practices.*

  He didn't write 'Shrine.' He didn't write 'Economy.' He wrote 'Counting tokens.' He committed to the object's form, not its purpose. He linked the burial without calling it a temple.

  "That's not neutral," Sarah said.

  "It's descriptive," Aris said. "It describes what they are, not what they did."

  "It implies use," Julian said.

  "Everything implies use," Aris said. He hit save.

  Elif watched him. He had chosen the interpretation that fit the taphonomy best—the baked cones, the stable data, the logical grouping. He had ignored the press leak. He had ignored the baby's mouth, mostly. He had made a claim that could be falsified, which was the best one could hope for.

  Mehmet leaned against the doorframe. "The soil doesn't care what you write," he said. "Next year, the rain will take the ends. The mice will eat the notes. You think you're saving something."

  "We're saving the argument," Elif said.

  Mehmet snorted. "Arguments don't feed the village." He turned off the light switch, though the generator was already dead. It was a habit. "Goodnight."

  Elif closed her laptop. The room was dark. She could still see the afterimage of the cones on her retina: orange in the center, grey at the ends. A line that wasn't a line. A row made by falling wood. A baby with clay in its mouth.

  She stood up. She had to sign the photo log. It was the legal record of what was lifted and what was left. She found the form on the table, illuminated by the moonlight coming through the window.

  *Items Lifted: 12 Clay Cones (Context 404, Center).*
  *Items Left in Situ: 25 Clay Cones (Context 404, Ends).*

  She signed her name. The ink took a second to dry. By leaving the twenty-five raw cones, she was destroying the evidence that might prove Sarah right. She was destroying the evidence that might prove Julian right. She was preserving the evidence that made Aris look competent.

  It wasn't the truth. It was the survivable part of the truth.

  She put the pen down. Outside, the wind picked up, blowing dust against the window. In the ground, under the sterile fill, the raw clay cones were already absorbing moisture from the air. The salts were crystallizing. The structure was failing. By morning, they would be softer. By winter, they would be gone.

  Elif walked to her room. She didn't dream of the woman who made the cones. She dreamed of the spreadsheet, the cells empty, waiting for data that was currently turning into mud. She woke up before dawn, checked the file one last time, and emailed it to the Ministry.

  The subject line was: *KaraTepe Season 4: Preliminary Report.*

  There was no exclamation point. There was no claim of a shrine. There was only the list of what they had taken, and the silence of what they had left behind.
