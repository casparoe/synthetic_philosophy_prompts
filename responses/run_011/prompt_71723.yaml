  ### Brainstorming

  1.  **Medical Triage:** A clinic director chooses between three specific treatment protocols and one palliative care package. States are three distinct viral strains. Sources are three competing epidemiological models. *Verdict:* A bit cold for a handout; payoffs in "lives saved" invite ethical complications that distract from the decision theory.
  2.  **Startup Pivot:** A founder chooses between three product features and maintaining the current roadmap. States are three market reception profiles. Sources are three focus group reports. *Verdict:* Payoffs are too speculative; "market reception" feels like disguised coin flips.
  3.  **Family Farm:** A farmer chooses between three crops and leasing the land for grazing. States are seasonal weather patterns (Wet, Dry, Average). Sources are three conflicting climate forecasts. *Verdict:* Concrete, monetary payoffs are natural, and weather uncertainty is a paradigmatic case for imprecise probability.

  **Selection:** The Family Farm. It grounds the math in tangible stakes without requiring exotic assumptions.

  ***

  ### The Case: The Three Forecasts

  Elena runs a mid-sized farm in a valley where annual revenue depends entirely on the rainfall profile of the coming season. She must commit to a land-use plan now. She has four options: plant Corn (water-intensive), plant Sorghum (drought-resistant), plant Soy (moderate needs), or Lease the fields for cattle grazing (revenue fixed by contract). Her revenue uncertainty stems from three seasonal climate forecasts she has equal reason to trust: the Local Co-op predicts a Wet El Niño year; the National Weather Service predicts a Dry La Niña year; and a Private Consultant predicts a Neutral Average year. She cannot reconcile them into a single distribution, so she treats them as the vertices of her credal set.

  | State of the World | Wet Season ($S_1$) | Dry Season ($S_2$) | Average Season ($S_3$) |
  | :--- | :---: | :---: | :---: |
  | **Source 1 (Co-op)** | $P_1(S_1)=0.8$ | $P_1(S_2)=0.1$ | $P_1(S_3)=0.1$ |
  | **Source 2 (NWS)** | $P_2(S_1)=0.1$ | $P_2(S_2)=0.8$ | $P_2(S_3)=0.1$ |
  | **Source 3 (Consultant)**| $P_3(S_1)=0.1$ | $P_3(S_2)=0.1$ | $P_3(S_3)=0.8$ |
  | | | | |
  | **Option A: Corn** | \$30,000 | \$10,000 | \$10,000 |
  | **Option B: Sorghum** | \$10,000 | \$30,000 | \$10,000 |
  | **Option C: Soy** | \$10,000 | \$10,000 | \$30,000 |
  | **Option D: Lease** | \$20,000 | \$20,000 | \$20,000 |

  ***

  ### Checking the Verdicts

  **1. Expected Values (in \$000s)**
  Expected value is linear: $EV_P(O) = \sum P(S_i) \cdot \text{Payoff}(S_i)$.

  *   **Under $P_1$ (Wet):**
      *   Corn: $0.8(30) + 0.1(10) + 0.1(10) = 24 + 1 + 1 = \mathbf{26}$
      *   Sorghum: $0.8(10) + 0.1(30) + 0.1(10) = 8 + 3 + 1 = 12$
      *   Soy: $0.8(10) + 0.1(10) + 0.1(30) = 8 + 1 + 3 = 12$
      *   Lease: $0.8(20) + 0.1(20) + 0.1(20) = \mathbf{20}$
      *   *Max:* Corn (26).

  *   **Under $P_2$ (Dry):**
      *   Corn: $0.1(30) + 0.8(10) + 0.1(10) = 3 + 8 + 1 = 12$
      *   Sorghum: $0.1(10) + 0.8(30) + 0.1(10) = 1 + 24 + 1 = \mathbf{26}$
      *   Soy: $0.1(10) + 0.8(10) + 0.1(30) = 1 + 8 + 3 = 12$
      *   Lease: $\mathbf{20}$
      *   *Max:* Sorghum (26).

  *   **Under $P_3$ (Average):**
      *   Corn: $0.1(30) + 0.1(10) + 0.8(10) = 3 + 1 + 8 = 12$
      *   Sorghum: $0.1(10) + 0.1(30) + 0.8(10) = 1 + 3 + 8 = 12$
      *   Soy: $0.1(10) + 0.1(10) + 0.8(30) = 1 + 1 + 24 = \mathbf{26}$
      *   Lease: $\mathbf{20}$
      *   *Max:* Soy (26).

  **2. Rule Application**

  *   **Maximality:** An option is permissible unless another option has a strictly higher EV under *every* probability function.
      *   Compare Lease (20, 20, 20) vs. Corn (26, 12, 12). Corn beats Lease at $P_1$, but Lease beats Corn at $P_2, P_3$. No dominance.
      *   Compare Corn vs. Sorghum. Corn wins at $P_1$, Sorghum at $P_2$. No dominance.
      *   This crossing pattern holds for all pairs. No option is dominated everywhere.
      *   **Verdict:** All four options {Corn, Sorghum, Soy, Lease} are permissible.

  *   **E-admissibility:** An option is permissible if it is maximal (tied for best) under *at least one* probability function in the set.
      *   Corn is max at $P_1$. Sorghum is max at $P_2$. Soy is max at $P_3$.
      *   Lease yields 20 everywhere. The maximum EV available at any vertex is 26. Thus, Lease is never maximal.
      *   **Verdict:** {Corn, Sorghum, Soy} permitted; **Lease forbidden**.

  *   **Gamma-maximin:** Rank by the minimum EV across the set.
      *   Min EV(Corn) = 12. Min EV(Sorghum) = 12. Min EV(Soy) = 12.
      *   Min EV(Lease) = 20.
      *   20 is strictly greater than 12.
      *   **Verdict:** **Only Lease** is permissible.

  **3. Why Checking Vertices is Enough**
  The credal set is the convex hull of $\{P_1, P_2, P_3\}$. Any $P$ in the set is a weighted average of these vertices.
  *   **For Maximality:** Dominance is defined by linear inequalities ($EV_P(O') > EV_P(O)$). If a linear inequality holds for all vertices of a convex set, it holds for all points in the set. Thus, if no option dominates Lease at the vertices, none dominates it in the interior.
  *   **For Gamma-maximin:** The function $f(P) = EV_P(O)$ is linear. The minimum of a linear function over a convex polytope must occur at a vertex. Checking the three vertices guarantees we have found the global minimum.
  *   **For E-admissibility (The Subtlety):** We need to know if Lease is *ever* optimal. The function $g(P) = \max_{O} EV_P(O) - EV_P(\text{Lease})$ is the difference between a convex function (max of linears) and a linear function. Thus $g(P)$ is convex. If a convex function is strictly positive at all vertices ($26 - 20 = 6 > 0$), it is strictly positive everywhere in the convex hull. Therefore, Lease cannot be optimal in the interior if it isn't optimal at a vertex.

  **4. Robustness Check (Diversification)**
  Suppose Elena can split her land, e.g., 50% Corn, 50% Sorghum. This creates new options with payoffs that are convex combinations of the original payoff vectors.
  *   **Gamma-maximin:** The minimum payoff of any mix of Corn, Sorghum, and Soy is bounded by the "equal mix" scenario (16.6k in all states), which is still less than Lease (20k). Lease remains the unique winner.
  *   **E-admissibility:** The maximum possible EV at any vertex is still 26k (achieved by the pure crops). Any mix dilutes this peak. Since Lease is 20k, and the "upper envelope" of expected values remains above 20k at all vertices, Lease remains strictly sub-optimal everywhere.
  *   **Maximality:** No mixed option dominates Lease (since no mix yields >20k in all states), and Lease does not dominate the mixes (since mixes can yield >20k in some states). The original four options remain undominated by the new mixes.
  *   **Result:** The verdicts do not change.

  ***

  ### Structural Analysis & Ablations

  **The Structural Feature**
  The case turns on the **variance of the risk profile**. The three crop options have high variance across states (high peaks, low valleys), while the Lease option has zero variance. The imprecision (the spread of probability functions) aligns perfectly with the variance of the crops: each crop is favored by exactly one vertex. This ensures the crops are E-admissible (each wins somewhere) but have low minimums. The Lease has a high minimum (Gamma-maximin winner) but never wins (E-admissible loser).

  **Ablations**
  1.  **Collapse Credence:** If Elena adopts only $P_1$ (Co-op), Corn yields 26k and Lease 20k. All three rules converge on Corn. The divergence requires the set of probabilities to be spread.
  2.  **Delete Risky Options:** If we remove Corn, Sorghum, and Soy, only Lease remains. All rules trivially permit it. The conflict requires competition between high-floor/low-ceiling and low-floor/high-ceiling options.
  3.  **Nudge Lease Payoff:** If the Lease offer rises to \$27,000, it dominates all crops (27 > 26). Maximality and E-admissibility would then forbid the crops, aligning with Gamma-maximin. The divergence requires the safe option to be *good* but not *best-case optimal*.

  ***

  ### The Camps Attack

  **Maximality Defender:** "E-admissibility is overly demanding. Lease is not dominated by any option; there is no scenario where choosing Lease is provably worse than an alternative. Ruling it out forces the agent to gamble on specific probability functions she explicitly refuses to endorse."

  **E-admissibility Defender:** "Maximality is too permissive. Lease is never the best response to any of the agent's beliefs. Choosing it amounts to ignoring the information she does have—that some crops will outperform it—without any compensating gain in security that justifies the loss of potential value."

  **Gamma-maximin Defender:** "Both rules ignore the threat of ignorance. When probabilities are this contested, the only rational metric is the security level. Lease guarantees \$20k; the crops risk \$12k. Permitting the crops exposes the agent to ruin for a gain she has no grounds to expect."

  **The Bayesian:** "This is a artifact of procrastination. The three sources are data; she should update on them to form a single weighted average (e.g., 0.33 each). Under that prior, the crops yield 16.6k and Lease 20k. She should pick Lease. If she weights them differently, she should pick a crop. Constructing a set to avoid weighting is just refusing to decide."

  ***

  ### Bonus: Sequential Wrinkle

  **Assessment:** I cannot construct a clean sequential extension under these constraints without violating the "no re-skinned coin flip" rule.

  **Reasoning:** Dynamic inconsistency in imprecise probability models (where Maximality permits a sequence that leads to sure loss) typically relies on "non-conglomerability" or specific updating rules (like vacuum updating) that allow the credal set to shift in pathological ways between time steps. To make this realistic (e.g., "wait for a weather report"), the value of information must be ambiguous. However, in a realistic farm context, information usually resolves states or shifts probabilities smoothly. Constructing a case where Maximality says "Pay for info" then "Regret info" while E-admissibility blocks it requires the option set to change in a way that feels engineered rather than organic. Specifically, it requires the post-information decision problem to have a structure where the permissible set shrinks to a dominated option. In a realistic farm setting, more information typically expands or maintains rational options, not restricts them to dominated ones. Forcing this would require stipulating that the "info" costs money but changes the credal set to one where Lease is dominated, which contradicts the intuition that info reduces uncertainty. I will not fudge the physics of the case to make the math work.
