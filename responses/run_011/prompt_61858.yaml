answer: |-
  Here is the principle, broken down by its operational clauses, followed by the cost you must pay to use it.

  ### The Principle of Symmetric Contingency

  A divergence question ("Why X and not Y?") is legitimate only if it satisfies three conditions.

  **Clause 1: Ex-Ante Parity**
  *At the starting date ($T_0$), Case A and Case B must share the relevant capacity and constraint profile regarding the outcome in question.*
  *   **Saves:** Rome East/West (same polity, same laws), Plague East/West Europe (same shock, similar feudal baseline), Flu (same bed, same exposure).
  *   **Kills:** "Why Rome Fall?" (No clear $T_0$ or comparable survivor), "Why Maya Collapse?" (Different cities/centuries = no single $T_0$), "Why Zheng He vs. Columbus?" (Tribute system vs. private venture = different capacity profiles).
  *   **Handles the Flip:** Britain/Yangzi. If the 1750 data holds (wages, markets), Parity is met, and the question is valid. If the data is wrong, Parity fails, and the question collapses. The principle makes the question's validity dependent on the data, not the intuition.

  **Clause 2: Ex-Post Viability**
  *At the ending date ($T_1$), the unchosen outcome must have been a physically and politically viable state for the "loser" to enter.*
  *   **Saves:** Britain/France (France could have industrialized; it was a live option), Printing Europe/Korea (Korea could have adopted mass printing; it was technically possible).
  *   **Kills:** "Why no Industrial Revolution in China?" (Implies industrialization was a pre-existing package waiting to be picked up. It wasn't; it was an emergent property. China didn't "miss" it; it hadn't been invented yet in a form China could use).
  *   **Handles the Flip:** Kodak/Fuji (Both could have pivoted; digital was a viable path for both).

  **Clause 3: Causal Specificity**
  *The explanation must point to a variable that differs between A and B, not a variable inherent to the definition of the outcome.*
  *   **Saves:** Plague (Labor scarcity vs. Land abundance), Flu (Immune history variance).
  *   **Kills:** "Why Rome Fall?" (Often answered with "Barbarians" or "Decadence," which are labels for the outcome, not independent variables).
  *   **Handles the Flip:** Zheng He/Columbus. If the answer is "Because China wasn't looking for trade," that is a difference in motive (variable). If the answer is "Because China stopped," that is just restating the outcome. The clause forces you to find the *reason* for the stop.

  ***

  ### The Cost: Which Verdict You Must Give Up

  The principle handles almost all your classifications, but it cannot handle your intuition regarding the **France Mirror**.

  You currently hold two verdicts:
  1.  "Why did Britain industrialize before France?" = **Fine.**
  2.  "Why did France fail to beat Britain?" = **Trick/Broken.**

  **You must give up the second verdict.**

  **The Argument:**
  Under the Principle of Symmetric Contingency, these two questions are logically isomorphic. They share the same $T_0$ (1700s agrarian economies), the same $T_1$ (one industrial, one not), and the same Viability (both could have industrialized).

  Your discomfort with the second phrasing ("Why France failed") comes from **normative loading**, not logical validity. You feel it implies France *should* have industrialized and screwed up, whereas Britain just *did*. But causality doesn't care about "should."

  *   If you ask "Why Britain?", you are asking for the cause of **Change**.
  *   If you ask "Why France?", you are asking for the cause of **Stability**.

  In logistics, explaining why a shipment arrived late (Change) and why a shipment arrived on time (Stability) utilize the same data: route, weather, carrier. If you say "The question 'Why was the truck on time?' is a trick," you are ignoring that on-time delivery often requires active management (inertia is not guaranteed in complex systems).

  France remaining agrarian was not a default state of nature; it was the result of specific constraints (capital availability, coal geography, institutional rigidity). Explaining why those constraints held is just as valid as explaining why Britain broke them. By calling the mirror version a "trick," you are secretly assuming industrialization was the "natural" state and agrarianism was the "failure." That is the teleological disease you identified in the China question. To be consistent, you must treat both phrasings as valid, provided they seek specific causal variables (Clause 3).

  ***

  ### Running the Principle on New Cases

  **1. Why did Buddhism fade in India and thrive in China?**
  *   **Ex-Ante Parity:** **Fail/Flip.** India is the source; China is the receiver. They do not start with the same relationship to the "product."
  *   **Correction:** Reframe to: "Why did Indian religious markets reject Buddhism while Chinese religious markets adopted it?" Now Parity is met (two markets evaluating a doctrine).
  *   **Ex-Post Viability:** **Pass.** Buddhism could have remained dominant in India; it could have been rejected in China. Both were viable states.
  *   **Causal Specificity:** **Pass.** You can point to variables: Caste system compatibility (India) vs. Ancestor worship compatibility (China).
  *   **Verdict:** **Fine** (if reframed as market adoption). **Broken** (if framed as "Why did it leave home," which implies a journey rather than a selection process).

  **2. Why did Kodak invent the digital camera and get destroyed, while Fuji survived?**
  *   **Ex-Ante Parity:** **Pass.** Both were dominant film manufacturers with similar tech, capital, and warning signals in the 1970s/80s.
  *   **Ex-Post Viability:** **Pass.** Both could have pivoted. Digital was a viable path for both.
  *   **Causal Specificity:** **Pass.** Variables exist: Kodak's US shareholder pressure vs. Fuji's diversified chemical portfolio; US market saturation vs. Asian market growth.
  *   **Verdict:** **Fine.** This is a textbook legitimate divergence question. It meets all three clauses perfectly.

  ***

  ### Final Word on the France Mirror

  You care most about this one because it feels like the direction of the question changes the truth. The Principle of Symmetric Contingency says it does not change the truth, but it does change the **burden of proof**.

  *   **"Why Britain?"** requires you to identify the *spark* (coal, patents, wages).
  *   **"Why France?"** requires you to identify the *brake* (guilds, revolution, geography).

  If you treat "Why France?" as a trick, you are assuming the brake is invisible or irrelevant. But in logistics, knowing why a route is blocked is just as valuable as knowing why a route is open. If you accept that "Stability requires explanation" (Clause 3), the mirror question stops being a trick and becomes a necessary check on your theory. If your theory explains Britain's spark but cannot explain France's brake, your theory is incomplete.

  Give up the idea that the mirror is a trick. Keep the suspicion that it often carries hidden normative baggage, but demand you strip that baggage away rather than discarding the question.
