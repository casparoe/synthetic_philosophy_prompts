answer: |-
  ### Case A: The Approach
  You are walking back to your office late evening. A person you do not recognize steps into your path. They are dressed professionally but seem anxious. They say: "I work in payroll processing. There is a specific coding error in your contract file. It happens rarely, but when IT audits it, they freeze all assets pending investigation. For someone on a visa, that means immediate loss of status and employment. The lifetime earnings loss is roughly $500,000. I can patch the file manually right now for $20 cash. No receipt. If you don't, the audit hits next week."

  You assess the situation. You know payroll errors exist. You know this person could be lying to steal $20. You assign a subjective credence of 1 in 10,000 that this specific claim is true. You are tired, and you know your risk assessment might be sloppy. You have $20 in your wallet.

  ### Case B: The Memo
  You are working late. You find an unread departmental memo from three months ago regarding contract files. It states that a specific coding error occasionally occurs in files like yours. It says when IT audits it, they freeze all assets pending investigation. For someone on a visa, that means immediate loss of status and employment. The lifetime earnings loss is roughly $500,000. The memo says you can file a corrective form now for a $20 processing fee. If you don't, the audit hits next week.

  You assess the situation. You know payroll errors exist. You know memos can be outdated or misinterpreted. You assign a subjective credence of 1 in 10,000 that this specific error applies to you. You are tired, and you know your risk assessment might be sloppy. You have $20 in your wallet.

  ***

  ### Analysis for Instructors

  **Matched Values**

  | Parameter | Case A (The Approach) | Case B (The Memo) | Fudge Factor |
  | :--- | :--- | :--- | :--- |
  | **Cost to Act** | $20 cash | $20 fee | None |
  | **Stakes (Loss)** | $500,000 (Career/Visa) | $500,000 (Career/Visa) | None |
  | **Subjective Credence** | 1 in 10,000 | 1 in 10,000 | Students may argue A is lower, but stipulate equality. |
  | **Reversibility** | Irreversible (Cash gone / Form filed) | Irreversible (Cash gone / Form filed) | None |
  | **Agent Confidence** | Low ("I am tired") | Low ("I am tired") | None |

  **The Residual Difference**
  The difference is **Adversarial Selection**: in Case A, the information is presented by an agent who profits specifically from your belief in the claim, whereas in Case B, the information exists independently of any agent's incentive to convey it.

  **Argument:** In Case B, the risk is exogenous; the memo exists regardless of whether you read it or pay the fee. In Case A, the *existence of the claim itself* is endogenous to the stranger's incentive structure. If the claim were false, a truth-teller would not speak, but a scammer would. Therefore, the mere fact that the claim was made is evidence that must be conditionalized upon, distinct from the background probability of the error itself.

  **The Principle Test**
  To discount A but accept B, a student must invoke a principle like: *"Discount probabilities derived from claims where the claimant's payoff is correlated with your acceptance."*

  Can this be stated cleanly? **No.** This principle smuggles in the conclusion. It assumes the stranger is a "claimant seeking payoff" (scammer) rather than a "whistleblower seeking fix" (ally). If the stranger were your friend, the principle wouldn't apply, yet the mathematical structure (P, V, Cost) remains identical. To make the principle work, you must add an epistemic prior about the stranger's honesty, which is exactly the intuition the students are trying to justify with decision theory. If they state it as "Discount testimony from strangers," they have collapsed into a heuristic that forbids acting on any new testimony, which violates Bayesian updating.

  **The Defender's Attack**
  A defender of probability discounting will argue that you have not properly conditionalized in Case A. They will say: "The credence isn't 1/10,000. That is P(Error). You need P(Error | Claim Made). Since scammers make claims 100% of the time and honest workers make claims 1% of the time, the likelihood ratio swamps the prior. Your posterior credence in A drops to 1/1,000,000, making the EV negative."

  **Concession:** This is correct. Proper Bayesian updating on the *fact of the testimony* dissolves the mugging in Case A. However, this concedes that the solution lies in **epistemic modeling of the speaker**, not in **decision-theoretic discounting of tiny probabilities**. If the student admits this, they cannot use "tiny probability" as a general shield in Case B, because in Case B, the posterior equals the prior (mostly). The exercise forces them to admit that Pascal's Mugging is solved by better epistemology (modeling incentives), not by breaking expected utility theory. If they refuse to update on the speaker's incentives in A, they are irrational. If they do, they aren't using a "tiny probability discount" rule; they are using standard Bayes. The "mugging" disappears not because we ignore small probabilities, but because we recognize the evidence was adversarially generated.
