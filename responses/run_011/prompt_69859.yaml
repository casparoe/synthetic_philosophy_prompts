prompt: |-
  I run a 90-minute reading group, about 25 people, mix of philosophy and econ — everyone's done one intro Bayes course, nobody's seen Aumann's proof. Design an in-class game that gets them to run into agreeing-to-disagree, and then to feel that the interesting question isn't the theorem but the common prior assumption sitting underneath it.

  The mechanic I want: two people can only "agree to disagree" by each accepting a small wager the other proposes, so the room can see that stubborn disagreement is supposed to leave money on the table. No real cash, points are fine, but the points have to actually matter to them by minute 40 or it's just talk.

  Then here's the twist to build in: the common prior gets broken quietly. Half the room gets a different base rate buried in their instruction sheet, framed as background fact rather than as evidence, and neither half is told the other half got something else. Give me rules, materials, a timeline for the 90 minutes, and a debrief that maps particular moments in play onto particular assumptions of the theorem.

  Be honest about whether they can actually tell apart "your priors differ" from "you don't have common knowledge of each other's posteriors" once I've broken both at once — if the activity can't separate them, say so and tell me what I'd have to add or cut to make it separable. Also what predictably goes wrong the first time I run this and how to handle it live.

  And in the debrief notes, keep settled stuff seperate from what people who work on this still argue about — whether the common prior assumption has any bite at all isn't a closed question. Don't hand me one side of that as the consensus.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Audience:** 25 people, mix of philosophy and econ, 1 intro Bayes course each, no prior exposure to Aumann's Agreement Theorem.
      *   **Goal:** Run a 90-minute reading group session.
      *   **Core Mechanic:** A wagering game where "agreeing to disagree" leaves money (points) on the table. Points must matter by minute 40.
      *   **The Twist:** Break the Common Prior Assumption (CPA) quietly. Half the room gets a different base rate framed as background fact. Neither half knows the other half has a different sheet.
      *   **Deliverables:** Rules, materials, timeline (90 mins), debrief mapping gameplay to theorem assumptions.
      *   **Critical Analysis:** Be honest about whether participants can distinguish "different priors" from "lack of common knowledge of posteriors" when both are broken. Suggest fixes if needed.
      *   **Failure Modes:** Predict what goes wrong and how to handle it live.
      *   **Debrief Nuance:** Distinguish settled theory from open debates (specifically regarding the bite of CPA).

  2.  **Deconstruct Aumann's Agreement Theorem:**
      *   *Premise:* Common Prior, Common Knowledge of Posteriors, Bayesian Rationality.
      *   *Conclusion:* Posteriors must be equal (cannot agree to disagree).
      *   *The "Money Pump" aspect:* If posteriors differ, there exists a bet both expect to win.
      *   *The Twist:* By giving different base rates (priors) secretly, we violate Common Prior. By limiting communication, we violate Common Knowledge of Posteriors (or at least the process of reaching it).

  3.  **Design the Game (The "Wager"):**
      *   Need a binary event (True/False, Red/Blue).
      *   Need private signals.
      *   Need a mechanism to bet.
      *   *Incentive:* Points need to matter. Leaderboard + small prize (chocolate, privilege, bragging rights) works best for academic settings without ethical hurdles of real cash. Let's use "Reputation Points" redeemable for a tangible reward at the end (e.g., choosing the next reading, first pick of snacks, or a gift card if budget allows. Let's assume a $20 gift card or equivalent "glory" prize).
      *   *Structure:* Pairs. They get signals. They state probabilities. If they differ, they *must* bet (or have the option to). To make the "agree to disagree" point hit hard, they should be *allowed* to walk away, but the math should show they shouldn't. Actually, the prompt says: "two people can only 'agree to disagree' by each accepting a small wager." This implies if they disagree, a wager is forced or strongly incentivized. Let's make it: If you state different probabilities, you enter a "Market Phase." If you don't trade, you get 0 points. If you trade, the winner gets points. This forces the issue.
      *   *Better Mechanic:* To highlight Aumann, they need to *talk* to update.
      *   *Revised Mechanic:*
          1.  Private Signal.
          2.  Private Posterior calculation.
          3.  Pair up. Share Posteriors (not signals).
          4.  If Posteriors match -> No bet, small reward for agreement.
          5.  If Posteriors differ -> They *must* bet to proceed.
          6.  *Crucial:* The "Twist" is the prior. If they have different priors, they won't agree even after sharing posteriors.

  4.  **Develop the "Twist" (Broken Common Prior):**
      *   Event: "Is the Urn Majority Red?"
      *   Standard Prior: 50/50 Urn is Red-Majority or Blue-Majority.
      *   Group A Prior: 80% chance Urn is Red-Majority.
      *   Group B Prior: 20% chance Urn is Red-Majority (or 80% Blue).
      *   Framing: "Historical data suggests..." (buried in instructions).
      *   Signals: Draw balls from the urn (simulated via cards/app).
      *   *Problem:* If they share posteriors, and they are Bayesians with *different* priors, they will understand *why* they disagree once they reveal their priors. The goal is to see if they notice the prior difference *before* revealing it.
      *   *Refinement:* They share posteriors first. They try to bet. They realize they can't agree. Then they are allowed to reveal priors.

  5.  **Timeline (90 Minutes):**
      *   0-10: Intro & Incentives (Make points matter).
      *   10-20: Instruction & Prior Seeding (The Twist).
      *   20-40: Round 1 (Signals, Calculation, Pairing, Betting).
      *   40-50: Scoreboard Check (Points matter now).
      *   50-70: Round 2 (Communication allowed, attempt to agree).
      *   70-90: Debrief & Theory Mapping.

  6.  **Addressing the "Distinguishability" Problem:**
      *   *Question:* Can they tell apart "your priors differ" from "you don't have common knowledge of each other's posteriors"?
      *   *Answer:* In this specific setup, if they communicate posteriors but *not* priors immediately, they might think they just haven't updated enough (lack of common knowledge of the update process). However, if they share posteriors and *still* disagree despite knowing the other is rational, the only remaining variable is the Prior or the Likelihood function.
      *   *Honesty:* It is very hard to separate "Different Priors" from "Different Likelihoods/Models" in a short game. It is also hard to separate "Different Priors" from "Lack of Common Knowledge that we have Common Priors."
      *   *Fix:* To make it separable, you need a round where they explicitly confirm "We are using the same Bayes rule and same Likelihoods." If they still disagree, it *must* be priors. I need to build a "Calibration Phase" where they confirm the math rules.

  7.  **Predicting Failure Modes:**
      *   *Failure 1:* People aren't good at Bayes. They miscalculate.
      *   *Fix:* Provide a cheat sheet/calculator.
      *   *Failure 2:* People don't care about points.
      *   *Fix:* Mid-game auction or leaderboard reveal.
      *   *Failure 3:* They reveal the secret too early.
      *   *Fix:* Strict rules on what can be shared in Round 1 vs Round 2.
      *   *Failure 4:* They agree to disagree without betting.
      *   *Fix:* Make betting mandatory for points if disagreement persists.

  8.  **Debrief Nuance:**
      *   *Settled:* The math of the theorem is sound. If CP + CK Posteriors + Rationality -> No Disagreement.
      *   *Contested:* Is CP realistic? (Harsanyi vs. others). Does "Agreeing to Disagree" happen in real life because of priors or because of lack of common knowledge (communication limits)? Is the theorem normative or descriptive?

  9.  **Drafting the Content:**

      *   *Title:* The Urn Wager.
      *   *Materials:* Two colored decks (Red/Blue), Instruction Sheets (Version A/B), Betting Slips, Calculators.
      *   *Incentive:* Top 3 teams get coffee vouchers/choice of next text.
      *   *The Twist:* Version A says "Urn Type R is 80% likely." Version B says "Urn Type B is 80% likely." Both think this is objective background info.
      *   *Rounds:*
          1.  Private Signal -> Posterior.
          2.  Meet Partner -> Share Posterior -> Bet if disagree.
          3.  Reveal -> Debrief.
      *   *Mapping:*
          *   Betting = Dutch Book argument.
          *   Sharing Posteriors = Common Knowledge attempt.
          *   Persistent Disagreement = Violation of Common Prior.
      *   *Honesty Check:* I need to explicitly state that without a round where they *confirm* priors, they might blame communication noise. I will add a "Calibration Round" to isolate the variable.

  10. **Refining the "Points Matter" constraint:**
      *   By minute 40, they need to feel the points.
      *   Solution: At minute 40, pause for a "Market Valuation." Show the leaderboard. Allow a side-auction where points can be traded for hints. This makes the points liquid and valuable.

  11. **Refining the "Separability" constraint:**
      *   If I break Common Prior *and* limit Communication (Common Knowledge), they can't tell which one caused the disagreement.
      *   *Correction:* The prompt asks me to break the Common Prior quietly. It acknowledges the difficulty. I must advise that *strictly speaking*, this design confounds the two. To separate them, I need a Round 3 where they are *allowed* to share priors. If disagreement vanishes after sharing priors, it was the Prior. If it persists, it was Common Knowledge/Communication. I will add this to the timeline.

  12. **Final Review against constraints:**
      *   90 mins? Yes.
      *   25 people? Yes (12 pairs + 1 trio).
      *   Bayes intro? Yes (keep math simple).
      *   No Aumann knowledge? Yes.
      *   Wager mechanic? Yes.
      *   Points matter by min 40? Yes (Leaderboard + Auction).
      *   Broken Prior twist? Yes (Version A/B sheets).
      *   Honesty about separability? Yes (Crucial section).
      *   Failure modes? Yes.
      *   Debrief nuance? Yes (Settled vs. Contested).

  13. **Writing the Plan:** (Self-Correction during drafting)
      *   *Math Check:* Keep the Bayes simple. Log-odds or simple frequencies. Let's use frequencies (e.g., Urn has 3R/1B vs 1R/3B).
      *   *Prior Check:* Version A: "Previous studies show Type R is dominant (80%)." Version B: "Previous studies show Type B is dominant (80%)."
      *   *Betting:* If P(Blue) > P(Red) for Player 1 and vice versa for Player 2, they bet.
      *   *Wait, Aumann says they shouldn't disagree.* If they have different priors, they *will* disagree. The lesson is that the *only* reason they are disagreeing (assuming rationality) is the prior.
      *   *Wait, the prompt says:* "two people can only 'agree to disagree' by each accepting a small wager." This implies the *cost* of disagreeing is the wager. I need to structure it so that if they walk away, they lose points. If they bet, one wins, one loses. But the *expectation* should be positive for both *if* they had common priors. With different priors, both *think* they have positive expectation. This is the key. Both accept the bet willingly. That's the "money on the table" if they *refused* the bet. But since they *take* the bet, they are demonstrating the disagreement.
      *   *Correction on Mechanic:* The prompt wants them to feel that stubborn disagreement leaves money on the table. Usually, Aumann implies you *can't* bet if you know the other is rational. Here, because priors differ, they *will* bet. The lesson is: "You bet because you think the other is wrong about the base rate."
      *   *Re-reading prompt:* "two people can only 'agree to disagree' by each accepting a small wager the other proposes, so the room can see that stubborn disagreement is supposed to leave money on the table."
      *   *Interpretation:* If they disagree, they must bet. The "money on the table" is the *risk* they take. Actually, the standard interpretation is: If you disagree, there is a bet you *both* want to take. If you refuse the bet, you are leaving money on the table (violating rationality). If you take the bet, you are agreeing to disagree (violating Aumann's conclusion).
      *   *My Plan:* If posteriors differ, a bet is offered. If they refuse, they get 0. If they accept, they gamble. The "Lesson" is that rational agents with Common Priors *would not* find a bet mutually acceptable. The fact that they *do* find it mutually acceptable proves (to the observer) that Priors differ.

      *   *Okay, let's finalize the "Separability" honesty.*
      *   If I hide the priors and limit talk, they don't know *why* they disagree.
      *   To make it pedagogical, I need a reveal phase.
      *   I will explicitly state in the "Honesty" section that without the reveal, the participants cannot distinguish the causes. The activity *requires* the reveal to teach the lesson.

      *   *Incentive:* "Course Credit" or "Pizza Voucher" is better than abstract points. Let's suggest a $50 Amazon card split among top team.

      *   *Timeline:*
          *   0-15: Setup & Math Warmup.
          *   15-25: Secret Prior Seeding.
          *   25-45: Round 1 (Silent Update & Pairing).
          *   45-50: **Incentive Spike** (Leaderboard + Prize Reveal).
          *   50-70: Round 2 (Communication & Betting).
          *   70-90: Debrief.

      *   *Debrief:* Map the "Willingness to Bet" to the violation of Common Priors. Map the "Sharing Posteriors" to Common Knowledge.

      *   *Contested Theory:* Mention that some (e.g., behavioral econ) say priors *are* allowed to differ. Others (Harsanyi) say rational agents must converge on priors.

      *(Self-Correction)*: Wait, if they have different priors, Aumann's theorem doesn't apply. So they *can* agree to disagree. The point of the exercise is to show that *if* they assume they have common priors, they should be confused by the disagreement. The "Twist" is that they *don't* have common priors. The debrief must highlight that the *only* reason the bet existed was the hidden prior difference.

      Okay, ready to write.
answer: |-
  # Session Plan: The Urn Wager (Aumann's Agreement Theorem)

  **Time:** 90 Minutes
  **Participants:** 25 (12 Pairs + 1 Trio)
  **Prerequisites:** Intro Bayes (Likelihood ratios, priors, posteriors).
  **Goal:** Experience the "money pump" of disagreement, then discover the Common Prior Assumption (CPA) is the hidden lever.

  ---

  ## 1. Materials & Setup

  **The Incentive (Crucial):**
  Points must be liquid. Do not use abstract "participation points."
  *   **Reward:** A $50 Amazon voucher (or equivalent) for the top team, plus "First Choice" on the next reading topic for the top 3 teams.
  *   **Currency:** "Equity Tokens" (poker chips or printed slips).
  *   **Min 40 Spike:** At minute 40, you will announce that tokens can be traded for *hints* in Round 2. This makes them valuable immediately.

  **The Urn Problem (Simplified Math):**
  *   **State of World:** Urn is either **Type R** (3 Red, 1 Blue ball) or **Type B** (1 Red, 3 Blue ball).
  *   **Signal:** Each player draws 1 ball from the Urn (with replacement) privately.
  *   **Likelihoods (Common Knowledge):**
      *   P(Red | Type R) = 0.75
      *   P(Red | Type B) = 0.25
  *   **The Twist (The Broken Prior):**
      *   **Group A (12 people):** Instruction sheet says, *"Historical data indicates Type R Urns are deployed 80% of the time."* (Prior: P(Type R) = 0.8)
      *   **Group B (13 people):** Instruction sheet says, *"Historical data indicates Type B Urns are deployed 80% of the time."* (Prior: P(Type R) = 0.2)
      *   *Framing:* This is buried in Section 1 of the handout under "Background Context," not "Your Private Signal." It looks like objective fact, not a subjective prior.

  **Handouts:**
  1.  **Instruction Sheet (Version A or B).**
  2.  **Betting Slip:** Fields for "My Posterior," "Partner's Posterior," "Bet Acceptance (Y/N)."
  3.  **Cheat Sheet:** Bayes Rule in Odds form ($O_{post} = O_{prior} \times L$).

  ---

  ## 2. Timeline (90 Minutes)

  ### 00:00 – 00:15: Intro & Math Warmup
  *   **0-5:** Explain the goal: "Maximize Equity Tokens." Show the Prize.
  *   **5-15:** Walk through the Bayes calculation on the board. Ensure everyone can convert a Prior + 1 Ball Draw into a Posterior Probability.
      *   *Check:* Ask the room: "If Prior is 50/50 and you draw Red, what is your posterior?" (Answer: 75% Type R).
      *   *Note:* Do **not** reveal the actual priors yet. Let them read the "Background Context" silently.

  ### 00:15 – 00:25: Secret Seeding & Signal Draw
  *   Distribute Version A and Version B sheets randomly (seat neighbors should ideally have different versions, but random is fine).
  *   **Instruction:** "Read Section 1 (Background) silently. Do not discuss Section 1."
  *   **Signal:** Walk around with a physical bag (or use a random number generator on their phones) to let them draw 1 ball (Red/Blue).
  *   **Task:** Calculate their Posterior Probability that the Urn is Type R. Write it on the Betting Slip. **Do not show anyone.**

  ### 00:25 – 00:40: Round 1 (The Blind Pairing)
  *   **Pair Up:** Participants pair with someone near them (ideally cross-version, but random is okay).
  *   **Rule:** You may **only** share your **Posterior Probability**. You cannot show your sheet, your ball, or your Prior.
  *   **The Wager Mechanic:**
      *   If Posteriors match (within 5%): No bet. Both get 1 Token (Reward for Agreement).
      *   If Posteriors differ (>5%): You **must** decide to Bet or Walk.
          *   **Walk:** 0 Tokens.
          *   **Bet:** Both put up 2 Tokens. The person whose Posterior is closer to the *Truth* (which you, the facilitator, know) wins 4 Tokens. (Net: Winner +2, Loser -2).
      *   *Why this matters:* With different priors, they will disagree. Because they trust their own math, they will both expect to win the bet. They will *both* accept the wager. This demonstrates the "Agree to Disagree" via wager.
  *   **Facilitator Role:** Circulate. Ensure they aren't revealing priors. Record the number of bets.

  ### 00:40 – 00:50: The Incentive Spike (Minute 40 Check)
  *   **Stop Play.**
  *   **Leaderboard:** Project the current token counts.
  *   **Liquidity Event:** Announce: "In Round 2, you can trade 5 Tokens for a 'Calibration Hint' from the Facilitator."
  *   *Effect:* Tokens now have explicit utility. The cost of a bad bet is real.

  ### 00:50 – 01:10: Round 2 (Communication & Calibration)
  *   **New Rule:** You may now discuss **why** you calculated your posterior. You may reveal your Likelihoods and your Priors.
  *   **Task:** Try to reach a consensus Posterior.
  *   **Observation:** As soon as they compare "Background Context" (Priors), they will realize they started from different bases.
      *   *Group A:* "I started at 80%."
      *   *Group B:* "Wait, I started at 20%."
  *   **Resolution:** Once priors are revealed, they should update to a shared prior (e.g., average them or realize the info was conflicting) and recalculate. Agreement should emerge.
  *   **Final Bet:** If they agree, they get 5 Tokens. If they still disagree after sharing priors, they must bet again (high risk).

  ### 01:10 – 01:30: Debrief & Theory Mapping
  *   Collect sheets. Reveal the Twist (Half had different priors).
  *   Discuss the mechanics (see Debrief Notes below).

  ---

  ## 3. Critical Analysis: Separability & Honesty

  **Can they distinguish "Different Priors" from "Lack of Common Knowledge"?**
  **Honest Answer:** No, not in Round 1.
  In Round 1, they share Posteriors but not Priors. If they disagree, they don't know *why*.
  *   *Possibility A:* They have different Priors (The Twist).
  *   *Possibility B:* They have the same Priors but miscalculated (Error).
  *   *Possibility C:* They have the same Priors but don't know that the *other person* knows the Likelihoods (Lack of Common Knowledge of Rationality).

  **How to make it separable (The Round 2 Fix):**
  The activity *requires* Round 2 to separate the variables.
  *   In Round 2, they establish **Common Knowledge of Rationality** (by showing their math work) and **Common Knowledge of Likelihoods** (by confirming the Urn rules).
  *   If disagreement persists *after* Round 2, it would imply irrationality.
  *   Since disagreement *vanishes* once they reveal the "Background Context" (Priors), you isolate the **Common Prior Assumption** as the sole culprit for the Round 1 disagreement.
  *   **Instruction to Facilitator:** You must explicitly point this out in the debrief. "In Round 1, you had ambiguity. In Round 2, you controlled for Likelihoods and Rationality. The only variable left was the Prior."

  ---

  ## 4. Predictable Failure Modes & Live Fixes

  **Failure 1: The Math is Too Hard.**
  *   *Symptom:* People stare at sheets, no betting happens.
  *   *Fix:* Have the "Cheat Sheet" pre-filled with the Likelihood Ratio (3:1). They only need to multiply their Prior Odds by 3 (if Red) or 1/3 (if Blue). Keep it to Odds, not Probabilities, to avoid denominator errors.

  **Failure 2: They Reveal the Twist Too Early.**
  *   *Symptom:* In Round 1, someone says, "What prior did you use?"
  *   *Fix:* Enforce the "Posterior Only" rule strictly. If they break it, disqualify the pair from tokens. This raises the stakes of the rule.

  **Failure 3: They Refuse to Bet.**
  *   *Symptom:* They disagree but both choose "Walk" to avoid risk.
  *   *Fix:* Change the payoff. If they disagree and Walk, they *lose* 1 Token (Penalty for Stubbornness). If they Bet, it's 50/50 chance for gain. This forces the "Money on the Table" feeling. *Recommendation:* Use the Penalty. It aligns with the Aumann intuition that refusing a mutually beneficial bet is irrational.

  **Failure 4: The "Points Don't Matter" Problem.**
  *   *Symptom:* At minute 40, nobody cares about the tokens.
  *   *Fix:* The "Liquidity Event" (trading tokens for hints) is essential. If they still don't care, switch to a "Loss Aversion" frame: "The bottom 3 teams have to clean up the whiteboards." (Use with caution depending on group culture).

  ---

  ## 5. Debrief Notes: Settled vs. Contested

  Use the whiteboard to map the game to the Theorem.

  **The Map:**
  1.  **Willingness to Bet:** Demonstrates that Posteriors differed.
  2.  **Mutual Acceptance of Bet:** Demonstrates that both agents were Rational (each thought they had positive EV).
  3.  **Round 1 Failure to Agree:** Demonstrates a violation of Aumann's conditions.
  4.  **Round 2 Resolution:** Identifies the **Common Prior Assumption** as the broken variable.

  **Settled Theory (Write on Left Board):**
  *   **The Math:** The theorem is logically valid. If Common Prior + Common Knowledge of Posteriors + Rationality $\rightarrow$ Posteriors must be equal.
  *   **The Dutch Book:** If you agree to disagree, a bet exists that you both *think* is favorable. If you refuse it, you are leaving money on the table (violating rationality).
  *   **The Mechanism:** In our game, the bet happened because you *didn't know* the priors differed. Once known, the arbitrage opportunity vanished.

  **Contested/Open Questions (Write on Right Board):**
  *   **Is the Common Prior Assumption (CPA) Realistic?**
      *   *Harsanyi's View:* Rational agents with the same information *should* have the same priors. Differences come from different genetic/experiential history which should be treated as data.
      *   *Critique (Behavioral/Philosophical):* Priors might be fundamental preferences or structural uncertainties that cannot be "updated" away. Maybe rational agents *can* have different priors.
  *   **Is "Common Knowledge" Achievable?**
      *   In the real world, we rarely achieve Common Knowledge of Posteriors. We stop talking.
      *   *Debate:* Does Aumann's theorem explain why polarization persists (because we stop talking before CK is reached), or does it prove polarization is irrational?
  *   **The "Agree to Disagree" Phenomenon:**
      *   Some economists argue the theorem is normative (how we *should* act), not descriptive (how we *do* act).
      *   Others argue that "Agreeing to Disagree" is actually a signal that the Common Prior assumption is false, and we should model agents with heterogeneous priors instead.

  **Closing Prompt for the Group:**
  "In Round 1, you were willing to bet against a peer you know is rational (they are in this room, took the same course). Was that irrational? Or was the 'Background Fact' on your sheet actually a hidden prior that broke the game? If you can't trust the prior, can you ever trust the agreement?"
