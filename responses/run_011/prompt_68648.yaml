answer: |-
  There is no single, canonical Latin name for this specific maneuver, but it is a recognized composite of two well-known fallacies. The closest established term is the **Motte-and-Bailey Doctrine**, supported by the mechanism of **Ad Hoc Rescue**.

  However, because you are pinpointing a specific *ontological* shift (treating a metric as the *thing itself* vs. treating it as a *sign of the thing*), philosophers of science and ethicists often describe this descriptively. If you need a label to use in conversation, the most precise existing framing is **The Motte-and-Bailey**, but the most accurate descriptive definition is **The Constitutive-Evidential Flip**.

  Here is the breakdown of the term, the edges, and how to distinguish it from good-faith updating.

  ### 1. The Established Term: Motte-and-Bailey
  Coined by philosopher Nicholas Shackel, this describes a situation where an arguer holds two positions:
  *   **The Bailey (The controversial claim):** "Brain mass determines moral status." (Easy to attack, high reward).
  *   **The Motte (The defensible claim):** "Brain mass is a rough proxy for cognitive complexity, which determines moral status." (Hard to attack, low reward).

  **How it fits your scenario:**
  When you attack the Bailey (cows have bigger brains), the arguer retreats to the Motte ("I never said mass was the *only* thing, it's just a stand-in for organization"). When you attack the Motte (birds have high density but small mass), they slide back into the Bailey ("Well, absolute numbers still matter most").

  **Why it might feel insufficient:**
  Motte-and-Bailey describes the *strategic retreat*, but it doesn't fully capture the *retroactive redefinition* of the metric's status. For that, you need to look at the logical mechanism.

  ### 2. The Logical Mechanism: Ad Hoc Rescue
  This occurs when a hypothesis is threatened by counter-evidence, and the arguer adds a new assumption to save it without independent justification.
  *   **Hypothesis:** Brain size = Moral Weight.
  *   **Counter-evidence:** Cow > Baby.
  *   **Rescue:** "Actually, it's Brain Size *adjusted for Density*."
  *   **Counter-evidence:** Bird > Primate (on density).
  *   **Rescue:** "Actually, it's Absolute Neuron Count in the Cortex."

  The fallacy isn't changing the mind; it's that the *rescue* is designed solely to exclude the counter-example while retaining the original conclusion, without prior theoretical justification for why *that* specific adjustment matters.

  ### 3. A Proposed Definition: The Constitutive-Evidential Flip
  Since you asked for a definition if no name exists, this is the precise logical structure you are observing. You can define it as follows:

  > **The Constitutive-Evidential Flip** occurs when an arguer treats a metric $M$ as **constitutive** of a value $V$ (i.e., $M$ is what $V$ *is*) when $M$ correlates with their desired outcome, but treats $M$ as merely **evidential** of $V$ (i.e., $M$ is just a *sign* of $V$) when $M$ fails to correlate, without acknowledging the shift in ontological status.

  **The Structure:**
  1.  **Phase 1 (Constitutive):** "We should trust $M$ because $M$ *is* the capacity we care about." (Used to assert authority).
  2.  **Phase 2 (Evidential):** "We should trust $M$ because $M$ *indicates* the capacity we care about." (Used to deflect counter-examples).
  3.  **The Concealment:** The arguer speaks as though Phase 1 and Phase 2 are the same claim.

  ### 4. Defining the Edges (What it is NOT)
  To use this accurately, you must distinguish it from nearby behaviors.

  #### A. vs. Good-Faith Updating
  *   **The Fallacy:** "I didn't change my mind; brain mass was *always* just a proxy. You misunderstood me." (Retroactive consistency).
  *   **Good Faith:** "I previously argued for brain mass. The cow example shows that's insufficient. I am now updating my view to neuron density." (Acknowledges the error and the shift).
  *   **The Test:** Ask, *"Did you state the nuance before I raised the counter-example?"* If the nuance only appears *after* the counter-example, it is likely the Flip.

  #### B. vs. Moving the Goalposts
  *   **Moving the Goalposts:** Changing the *threshold* required to win. (e.g., "You need a 1kg brain." $\rightarrow$ "Okay, you need a 500g brain.")
  *   **The Flip:** Changing the *nature* of the metric itself. (e.g., "The weight is what matters." $\rightarrow$ "The weight is just a symbol for what matters.")
  *   **The Test:** In Moving the Goalposts, the metric stays the same (weight), but the number changes. In the Flip, the metric's relationship to the truth changes (from cause to symptom).

  #### C. vs. Special Pleading
  *   **Special Pleading:** Applying a rule to others but making an exception for oneself (or a favored case).
  *   **The Flip:** Applying a rule to the *evidence* differently depending on whether it supports the conclusion.
  *   **The Test:** Special pleading is about *cases* (Humans vs. Cows). The Flip is about *metrics* (Mass vs. Density). They often happen together, but the Flip is the engine that allows the Special Pleading to hide.

  ### 5. Why this distinction matters
  Identifying this specifically as the **Constitutive-Evidential Flip** (or a Metric Motte-and-Bailey) is crucial because it exposes **unfalsifiability**.

  If a metric can be constitutive when it wins and evidential when it loses, the argument can never be disproven. It creates a "heads I win, tails we check the proxy" scenario. By naming the flip, you force the arguer to commit: *"Is brain mass the actual source of moral value, or is it not? If it is, the cow refutes you. If it isn't, why did you lead with it as if it were?"*

  ### Summary for Argumentation
  If you need to call it out in real-time:
  > "You are treating brain size as **constitutive** when it supports your view, but merely **evidential** when it doesn't. You can't have it be the definition of moral worth when it suits you and then just a 'rough proxy' when a cow comes along. Which one is it?"

  If you want the academic label:
  > "This is a **Motte-and-Bailey** on the metric itself, relying on an **Ad Hoc Rescue** to avoid falsification."

  If you want to coin the precise term:
  > "This is the **Constitutive-Evidential Flip**."
