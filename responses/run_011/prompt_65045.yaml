answer: |-
  Dear Coordinator,

  I read your note twice because I wanted to make sure I understood the weight of what you are asking. You are not asking for a statistics lesson, and you are not asking for permission to feel uncertain. You are asking for a tool that stops the arguing at the briefing table so you can get your people into the woods before the light fails. The reference class problem is real, but in your position, it is less a philosophical puzzle and more a tactical hazard. If you spend an hour debating which past cases matter, you have already lost ground. What follows is a procedure designed to be run on a laptop in the bed of a truck, written plainly so that any volunteer can follow it without needing to understand the math behind it. I will tell you where the numbers are solid and where they are guesses wearing a suit, and I will run your three cases through it exactly as you asked, without softening the blow where the data turns dark.

  The procedure starts with the assumption that no single number is ever the truth, so you will never calculate a single point estimate for survival. You will always calculate a range bounded by a optimistic limit and a pessimistic limit, and you will communicate that range to leadership while keeping the specific percentages internal to the team unless asked directly. Your first step is to open the spreadsheet and filter for the total population of cases to establish your baseline, which for you is the sixty-four percent overall survival rate across seven hundred and fourteen callouts. This is your floor and your ceiling before you add any details. The second step is to identify the single most predictive characteristic of the missing subject, which is almost always their intent or physiological state rather than their age or the environment. If the initial report mentions dementia, confusion, suicidal language, or a specific medical event, that category overrides age or recreational status because intent and capacity drive outcomes more than chronology. You will filter your data for this specific condition and count the number of cases. Here is the first judgment call wearing a procedure as a costume, so listen closely. You must set a minimum sample size before you allow this specific slice to override the baseline. I recommend you set that number at twenty cases. If your specific condition slice has fewer than twenty cases, the statistical noise is too high to trust it alone, so you must blend it with the next broader category. If the slice has twenty or more cases, you may let it stand as your primary predictor. For example, if you have a subject with dementia and you find forty-one past cases matching that description, you use that rate. If you find only seventeen cases, you do not discard them, but you average their survival rate with the broader age-group rate to dampen the volatility.

  The third step is to apply the time delay filter, but you must apply a data quality caveat here. You noted that your time-reported field before 2016 is unreliable because it records when dispatch called you rather than when the family realized the subject was missing. Therefore, if your current case involves a time delay filter, you must exclude all cases prior to 2016 from that specific calculation to avoid skewing the data with systematically shorter reported times. If excluding those cases drops your sample size below ten, you discard the time filter entirely and rely on the condition and age filters. The fourth step is to account for technological drift. You acquired drones in 2019 and dedicated K9 teams in 2017. A search in 2011 is not the same as a search in 2024. If your relevant data slice is heavily weighted toward pre-2017 cases, you should mentally adjust the survival probability downward by about ten percent to account for the lack of modern tools, or conversely, if you are planning a search today, recognize that historical failure rates might be slightly optimistic because your tools are better now. This is another judgment call, but it is better to acknowledge the bias than to ignore it. The fifth step is conflict resolution. When two legitimate slices disagree, such as the subject being young and healthy but reported very late, you prioritize the condition over the time. A healthy young person can survive exposure longer than an elderly person with dementia, so the physiological ceiling matters more than the time elapsed, unless the time elapsed exceeds known survival thresholds for that environment, in which case time becomes the primary filter.

  The sixth step is determining what to tell the family and the board. You will never give a single number. You will give a range defined by the most optimistic defensible slice and the most pessimistic defensible slice. If the pessimistic slice has a sample size below ten, you state that the lower bound is uncertain. If the data suggests a survival probability below a threshold that would normally cancel operations, but your values dictate you search anyway, you stop the procedure and hand the call to a human being. This is the point where statistics end and ethics begin. If the math says there is a two percent chance of life, but the family needs closure or there is a moral imperative to search, you do not use the number to justify quitting. You use the number to justify the tactics. A low probability of life means you search for recovery, which changes how you deploy your teams, but it does not necessarily mean you do not deploy them. This is where you protect your volunteers from the despair of the numbers while still using the numbers to keep them safe. There are two places where this procedure will misfire. First, it will misfire on unique cases that have no historical parallel, such as a specific combination of age, condition, and weather that has never occurred in your twelve years of data. In that case, you revert to the overall baseline and admit the uncertainty. Second, it will misfire if your data entry discipline slips. If volunteers stop checking the dementia box or stop logging the time accurately, the procedure degrades. You must audit your data entry annually or the tool becomes garbage.

  Now I will run this procedure on your three cases so you can see how it lands in the mud. For the first case, the seventy-four-year-old man with dementia reported nine hours late, you start with the overall baseline of sixty-four percent alive. You move to the specific condition filter, which is over seventy with dementia noted. You have forty-one cases there with eight alive, which is roughly twenty percent. This sample size is over your threshold of twenty, so it is valid. You then look at the time filter, reported more than six hours late for this demographic. You have seventeen cases there with two alive, which is roughly twelve percent. This sample size is below your threshold of twenty, so you do not let it override the condition filter alone. You blend the twelve percent with the twenty percent from the broader dementia category, landing you near sixteen percent. You then consider the technological drift. Most of these dementia cases likely occurred before your drone and K9 integration, so you might adjust slightly upward for current capabilities, but given the vulnerability of the subject, you keep it conservative. Your range is therefore between twelve percent and twenty percent. You tell the family that based on similar past cases, the situation is critical, and you tell your team that this is likely a recovery operation, though you search for life until proven otherwise. The argument at the briefing table ends because the specific slice of over-seventies with dementia has enough weight to override the general eighty-eight percent find rate.

  For the second case, the nineteen-year-old who texted a goodbye message and was reported thirty hours late, you start with the overall baseline. You move to the age filter, under twenty-five, which shows seventy-seven percent alive. However, you immediately apply the intent filter, which is the goodbye text or suicidal language. You have twenty-three cases here with two alive, which is roughly nine percent. This sample size is just above your threshold of twenty, so you are allowed to let this override the age filter. The time delay of thirty hours is significant, but you noted your time data before 2016 is flawed, so you check how many of those twenty-three suicidal cases are post-2016. If that number drops below ten, you discard the time filter and stick with the intent filter. Assuming the intent data is solid, your primary predictor is the nine percent survival rate. The age of the subject suggests resilience, but the intent suggests a deliberate attempt to not be found, which trumps physiological resilience. Your range is between nine percent and perhaps fifteen percent if you blend in the age factor slightly, but the honest output is grim. You tell the team that the probability of a live find is low based on the intent marker, and you deploy accordingly, perhaps focusing on high-probability recovery zones rather than wide-area live sweep patterns. This is hard to hear, but it is better than wasting resources on a low-probability live search when the data suggests a different approach.

  For the third case, the thirty-four-year-old hunter reported Sunday afternoon with an unreachable phone, you start with the overdue recreationist slice, which is eighty-eight percent alive across one hundred and twenty-one cases. This is a strong baseline. However, you have a specific negative indicator, which is the unreachable cell phone. You have fourteen cases here with one alive, which is roughly seven percent. This sample size is below your threshold of twenty, so strictly speaking, you should blend this with the broader recreationalist rate. If you average eighty-eight percent and seven percent, you get a misleadingly hopeful number. However, this is where you must recognize a judgment call wearing a procedure as a costume. The signal of an unreachable phone in a hunting context is often correlated with severe injury or death, whereas the recreationalist baseline includes many people who simply forgot to charge their phone or left it in the truck. The specificity of the signal matters more than the raw count. In this instance, I advise you to treat the unreachable phone as a critical modifier despite the low sample size, because the mechanism of failure is direct. If a hunter is overdue and the phone is dead, they are not just lost, they are incapacitated. Your range should not be the average. Your range should be bounded by the seven percent on the low end and the broader overdue rate of sixty-one percent for those reported more than eight hours late on the high end. You do not tell the brother the chances are grim as a fact, but you tell him that the unreachable phone is a serious complication that changes the search profile. You commit the volunteers, because a hunter overdue is still a high-priority search, but you prepare them for the possibility of recovery. The bad feeling you have is the data speaking through your intuition, and you should trust it enough to adjust tactics without abandoning the mission.

  I want to be straight with you about where this procedure is fragile. The minimum sample size of twenty is arbitrary. I chose it because below twenty, one extra survival changes the percentage by five points, which is enough to swing a briefing. But twenty is not a magic number found in nature. It is a line drawn in the sand to stop the arguing. You could argue for fifteen or twenty-five, and the math would not care, but your team needs a rule to stop the debate. The blending of percentages when sample sizes are low is also a judgment call. There is no statistical law that says you should average the specific rate with the general rate, but it prevents you from making decisions based on outliers. The biggest risk is that this procedure gives you a false sense of precision. You will feel like you know the odds, but you only know the odds of the past, not the odds of today. The man with dementia might have been found by a hiker five minutes after you called off the search. The suicidal teenager might have changed their mind. The hunter might have a dead battery and be sitting warm in a blind. The procedure is for planning, not for prophecy.

  There is also the problem of the county board wanting one clean number. You will have to refuse this. If you give them a single number, they will treat it as a target. If you say sixty-four percent, they will ask why you did not find the sixty-four. If you say nine percent, they will ask why you are searching at all. You give them the range, and you explain that the range represents the uncertainty of the situation, not the competence of the team. If they press for a single number, you give them the lower bound. It is better to underpromise and overdeliver than to promise a live find and bring back a body. The neighboring organization that advertises nine out of ten missing people come home alive is selling hope, not data. You are running a rescue team, not a marketing firm. Do not let their fundraising numbers dictate your briefing room reality.

  Finally, you asked where the procedure stops and hands the call to a human being. It stops at the decision to search for life versus searching for remains. The procedure can tell you that the probability of life is low, but it cannot tell you whether the family deserves the closure of a recovery, or whether the volunteers need the moral victory of a search, or whether the community needs to see that no one is left behind. That is a question of values. When the data says stop and your heart says go, you go. But you go with your eyes open. You tell your team that the odds are low, that we are doing this because it is the right thing to do, not because the spreadsheet says we will win. That honesty protects them from the burnout of failed expectations. Print this out. Laminate it if you can. Put it in the binder. And when the sun goes down and the arguing starts, read the first sentence and remind them that the goal is not to be right about the numbers, but to be ready for the search.
