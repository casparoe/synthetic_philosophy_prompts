      *   *Refining the "Intention" point:* Use the concept of "Conditional Intention." Explain the moral tension (intending evil to prevent evil).
      *   *Technical Terms:* Define "Counterforce" vs. "Countervalue," "Hair-trigger," "State of Exception," "Conditional Intention."

  6.  **Self-Correction/Review during drafting:**
