      *   *Fix:* Use the medical analogy the user provided. In the ICU, you check the *dose* (content). In the silo, they check the *code* (identity). Why? Because the "dose" (nuclear war) is assumed to be a political decision already made by the Constitution, not a tactical one.
      *   *Critique:* Ensure I don't advocate a position, but explain the *logic* of the position.
      *   *Fix:* Maintain neutrality. Describe the "implicit theory," don't endorse it.

  7.  **Final Polish:** Check for clarity, flow, and empathy. The user is troubled by this. The response should be calming in its clarity, not dismissive. (Ensure the distinction between the *legal* requirement and the *practical* reality is clear).

  **(Self-Correction Note on "Secretary of Defense"):** The user says "no veto available to the Secretary of Defense." Technically, the SecDef must *transmit* the order, but legal consensus is they cannot *veto* it. I should clarify this nuance without contradicting the user's core accurate observation.

  **(Self-Correction on "Unlawful Orders"):** The UCMJ *does* apply to nuclear orders legally, but the *practical* mechanism to refuse is removed because the definition of "manifestly unlawful" at the strategic level is undefined. I need to make sure this distinction is clear.

