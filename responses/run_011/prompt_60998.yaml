  The crux is not deriving branching, but justifying why branch weight should govern rational credence when all outcomes occur.

  Your physicist conflates ontology with epistemology; decoherence explains why worlds separate, not why we bet on them by squared amplitude. Progress is philosophical, not empirical. Commission the series, warning readers no experiment will settle this.

  1. **The Incoherence Problem (Live/Crucial).** Upstream of all derivations. Why assign probabilities to deterministic outcomes? This is what the decoherence crowd ignores.
     * **State:** Decoherence yields orthogonal branches.
     * **Hedge:** That branching implies subjective uncertainty.
     * **Movement:** Shifts if self-locating uncertainty fails to ground credence. Re-rank highest if uncertainty is proven incoherent.

  2. **Decision-Theoretic Derivations (Contested).** Deutsch and Wallace do the heaviest lifting.
     * **Work:** Linking rational betting behaviour to quantum weights.
     * **Dressing:** Claims that rationality axioms are neutral; critics argue probability is smuggled into 'diachronic consistency'.
     * **State:** They derive the Born rule from non-probabilistic axioms.
     * **Hedge:** That these axioms are uniquely compelled.
     * **Movement:** Shifts if axioms are proven circular. Re-rank if alternative rationality models emerge.

  3. **Envariance (Overrated).** Zurek's symmetry argument.
     * **Work:** Mathematically elegant use of environment symmetries.
     * **Dressing:** Claiming it bypasses agents entirely.
     * **State:** It relies on environment-assisted invariance.
     * **Hedge:** That it avoids assuming equal a priori probabilities.

  4. **Measures of Existence (Dead).** Vaidman's ontological weight.
     * **Work:** None.
     * **Dressing:** Renaming probability as 'measure of existence' without explaining credence.

  If your readers expect empirical resolution, write about quantum gravity instead. If they tolerate conceptual rigour, this series is viable. The decision-theoretic line is doing real work; the rest is largely dressing. Expect no consensus in five years, only refined arguments. A derivation of the Born rule from pure dynamics without decision-theoretic axioms would overturn the hierarchy, but none is imminent. Conceptual counterexamples are the only evidence that matters here.
