answer: |-
  This is a profound observation that cuts to the epistemological core of theoretical computer science. You have identified a tension that practitioners navigate intuitively but rarely articulate: the distinction between an asymptotic result that reveals a **law** versus one that exploits a **loophole**.

  There is no single established term that captures the *normative asymmetry* you describe (why we value the unreachable in cases 1 and 2 but reject it in case 3). However, there are three existing concepts that form the boundary of this idea. I will outline them, explain where they fall short of your specific question, and then coin the term that fills the gap.

  ### 1. Existing Notions

  **A. Galactic Algorithms (Instance 1)**
  *   **Concept:** This is the specific name for Instance 1. A "galactic algorithm" is one that is theoretically optimal (e.g., best exponent) but practically unusable due to massive constant factors or crossover points beyond physical reality.
  *   **Why it fits:** It acknowledges the "unreachable but genuine" status.
  *   **Why it falls short:** It is a label for the *algorithm*, not the *reasoning*. It describes the object, not the epistemological rule that allows us to celebrate it while dismissing the hardcoding argument.

  **B. Uniform vs. Non-Uniform Complexity (Instance 3)**
  *   **Concept:** This is the technical distinction from complexity theory.
      *   **Uniform:** A single finite program (Turing machine) solves the problem for *all* input sizes $n$.
      *   **Non-Uniform:** A different circuit (or lookup table) is allowed for each input size $n$.
  *   **Why it fits:** Instance 3 (hardcoding) is the definition of a non-uniform argument. Instances 1 and 2 rely on uniform algorithms/reductions.
  *   **Why it falls short:** "Uniformity" is a formal definition, not a justification. It tells you *that* the hardcoding argument is excluded from the class $P$, but it doesn't explain *why* the community morally privileges uniformity over non-uniformity when assessing "difficulty." You are asking for the *principle* that makes uniformity the gold standard.

  **C. Idealization (Philosophy of Science)**
  *   **Concept:** In physics, we accept "frictionless planes" or "infinite gases" not because they exist, but because they isolate the underlying forces (laws) from contingent noise.
  *   **Why it fits:** It explains why we accept unreachable regimes (Instance 1 & 2). We treat $n \to \infty$ as a way to strip away constant-factor "noise" to see the "shape" of the problem.
  *   **Why it falls short:** It doesn't explain why Instance 3 is rejected. One could argue hardcoding is an idealization of "perfect knowledge." The distinction lies in *what* is being idealized.

  ---

  ### 2. The Missing Concept: **Structural Asymptotics**

  Since no existing term captures the *asymmetry of legitimacy* you described, I propose the term **Structural Asymptotics**.

  **Definition:**
  An asymptotic claim possesses **Structural Asymptotics** if the mechanism it describes can be finitely specified independent of the input size $n$, and that specification reveals an invariant relationship between inputs of different sizes.

  Conversely, a claim lacks Structural Asymptotics if the description of the solution or bound requires information that grows with $n$ (even if $n$ is unreachable).

  **The Principled Criterion: Finite Describability of the Infinite**
  The line is drawn at **Kolmogorov Complexity**.
  *   **Legitimate (Instances 1 & 2):** The proof or algorithm is a *compression* of infinite behavior into a finite description. Strassen's algorithm is a few pages of math that dictates behavior for $n = 10^{100}$ and $n = 10^{1000}$ equally. The "law" is smaller than the "territory."
  *   **Illegitimate (Instance 3):** The "solution" (the lookup table) is an *expansion*. To cover the infinite regime, the description size must grow infinitely. You are not describing a law; you are listing exceptions.

  **Why the Asymmetry Exists:**
  We accept unreachable regimes when they demonstrate **invariance**. We reject them when they demonstrate **contingency**.
  *   **Instance 1 (Matrix Mult):** Shows the algebraic structure of multiplication is invariant at scale.
  *   **Instance 2 (Intractability):** Shows the combinatorial explosion is invariant at scale.
  *   **Instance 3 (Hardcoding):** Shows nothing about the structure. It relies on the contingent fact that *this specific* $n$ is finite. It dissolves the problem rather than solving it.

  ---

  ### 3. Boundary Cases and Non-Examples

  To clarify the boundary of **Structural Asymptotics**, consider these cases:

  **Clear Example (Legitimate):**
  *   **Claim:** "Sorting requires $\Omega(n \log n)$ comparisons."
  *   **Why:** The proof (decision tree height) applies a single logical rule to all $n$. It reveals a structural constraint on information flow. Even if $n$ is unreachable, the *relationship* between $n$ and operations is invariant.

  **Clear Non-Example (Illegitimate):**
  *   **Claim:** "This sorting algorithm is $O(1)$ because for any $n$ that fits in the universe, the number of permutations is finite, so we can index them."
  *   **Why:** This fails the Finite Describability criterion. The "index" required to map every universal-scale permutation to a sorted state contains more bits than the universe holds. The description of the solution is larger than the physical system it describes. It is not a law; it is a lookup table masquerading as a function.

  **Edge Case (The "Crossover" Problem):**
  *   **Scenario:** An algorithm is $O(n)$ but only beats the $O(n \log n)$ standard for $n > 10^{50}$.
  *   **Verdict:** This *has* Structural Asymptotics (it is a uniform algorithm), but it lacks **Pragmatic Asymptotics**.
  *   **Distinction:** This highlights that Structural Asymptotics is necessary for theoretical respect, but not sufficient for practical interest. Instance 1 (Matrix Mult) is respected *theoretically* (Structural) but ignored *practically*. Instance 3 is rejected *theoretically*.

  ---

  ### 4. The Principled Criterion for Legitimacy

  You asked if anyone has stated a principled criterion for when an appeal to an unreachable regime is legitimate. In the philosophy of science, this is the distinction between **Nomic** (law-like) and **Accidental** generalizations.

  In computer science, the criterion is **Uniform Constructibility**.

  **The Criterion:**
  An appeal to an unreachable regime is legitimate if and only if the witness (algorithm, reduction, or proof) is **uniformly constructible**.

  *   **Legitimate:** "For all $n$, there exists a step sequence $S_n$ generated by function $f(n)$." (Here $f$ is finite and fixed).
  *   **Evasive:** "For all $n$, there exists a step sequence $S_n$." (Here $S_n$ might be unrelated to $S_{n+1}$).

  **Why this resolves your asymmetry:**
  *   **Instance 1:** The matrix algorithm is generated by a fixed recursive rule. **Legitimate.**
  *   **Instance 2:** The NP-hardness reduction is a fixed transformation. **Legitimate.**
  *   **Instance 3:** The hardcoded answers are not generated by a rule; they are arbitrary values. **Illegitimate.**

  ### Summary

  The pattern you have identified is the community's enforcement of **Structural Asymptotics**.

  We value the unreachable in Instances 1 and 2 because they offer a **finite compression of infinite behavior**. They tell us something about the *rules of the game*.
  We reject the unreachable in Instance 3 because it offers an **infinite expansion of finite behavior**. It tells us nothing about the rules, only about the current score.

  The "word" you are looking for is **Uniformity**, but the *value* you are sensing is **Explanatory Compression**. We accept asymptotic arguments that compress the infinite into a finite law; we reject those that require the infinite to be enumerated.
