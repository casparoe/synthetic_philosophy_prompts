          *   *Procedure Outcome:* The existence of the duplicate triggers a "Uniqueness Violation." Even if terminated, the *original* continuity is suspect during that window. However, since the duplicate is gone, the original resumes.
          *   *Result:* Continuity Certified, but with a "Breach of Uniqueness" notation.
