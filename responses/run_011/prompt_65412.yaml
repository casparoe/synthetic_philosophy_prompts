answer: |-
  # OPERATING PROCEDURE 77-B: PERSONHOOD CONTINUITY ADJUDICATION

  **EFFECTIVE DATE:** [Current Date]
  **AUTHORITY:** National Personhood Registry, Continuity Division
  **AUDIENCE:** Adjudication Panel (Two Members)

  ## 1. DEFINITIONS AND SCOPE

  **Psychological Continuity:** The overlapping chain of memories, temperament, and reasoning abilities linking the person at enrollment to the person at the checkpoint. This is the legal standard for identity in this jurisdiction.

  **Substrate:** The physical material of the brain, whether biological or synthetic. Changes to substrate are not, by themselves, changes to legal personhood.

  **Cumulative Replaced Fraction:** The sum of all tissue replacement percentages over the life of the program. This number may exceed 100%.

  **Checkpoint:** A scheduled review point triggered by time elapsed or cumulative replacement percentage.

  **Legal Person:** The entity holding rights and liabilities. This procedure determines if the Legal Person at the checkpoint is the same as the Legal Person at enrollment.

  ## 2. EVIDENTIARY WEIGHTING OF INPUTS

  The Panel shall weigh the five available inputs as follows. This hierarchy is binding.

  1.  **Disposition Signature Divergence (DSD):** **Primary Evidence.** This measures objective drift in reasoning and temperament. It is the most reliable indicator of psychological continuity.
      *   *Weight:* High.
  2.  **The Interval Test:** **Primary Evidence.** This verifies the retention of episodic memory (memory of specific events) that cannot be faked from records.
      *   *Weight:* High.
  3.  **Recognition Testimony:** **Corroborative Evidence.** Testimony from intimates regarding social continuity.
      *   *Weight:* Moderate. Subject to interpersonal bias.
  4.  **Retained Procedural Skill:** **Corroborative Evidence.** Retention of implicit memory (how to do things).
      *   *Weight:* Low-Moderate. Skills can be relearned or simulated; this proves capacity, not necessarily identity.
  5.  **First-Person Report:** **Non-Diagnostic.** The patient's statement that they are the same person.
      *   *Weight:* None.
      *   *Reasoning:* A synthetic substrate can be constructed to believe it is the original. A delusional biological brain can believe it is someone else. This input confirms the patient is coherent, but it proves nothing about historical continuity. It shall be recorded but shall not influence the determination.

  ## 3. THE ADJUDICATION PROCEDURE

  The Panel shall proceed through the following steps in order. The process terminates at the first decisive outcome.

  **Step 1: Statutory Compliance Check**
  *   **Question:** Did any single session exceed the 4% replacement ceiling? Are session logs complete?
  *   **Sufficient Answer:** All sessions ≤4%. Logs complete.
  *   **Failure:** Any session >4% or missing logs.
  *   **Outcome:** If Failure, **Refuse Certification**. Matter referred to Compliance Division.
  *   **Termination:** Yes.

  **Step 2: The Hard Continuity Check (Memory and Reasoning)**
  *   **Question:** Is the DSD within tolerance AND has the Interval Test been passed at the most recent checkpoint?
  *   **Sufficient Answer:** DSD ≤10% divergence from baseline AND Interval Test Pass.
  *   **Failure:** DSD >10% OR Interval Test Fail.
  *   **Outcome:**
      *   If DSD >15%: **Refuse Certification**. (Presumption of discontinuity).
      *   If DSD 10-15% OR Interval Test Fail: Proceed to Step 3.
  *   **Termination:** Only on DSD >15%.

  **Step 3: The Social Corroboration Check**
  *   **Question:** Do at least two intimates recognize the patient as the same person, AND is procedural skill retained?
  *   **Sufficient Answer:** Two affirmative testimonies AND skill retention verified.
  *   **Failure:** Contradictory testimonies OR loss of core procedural skills.
  *   **Outcome:**
      *   If Intimates contradict (e.g., one says "Same," one says "Different"): Proceed to Step 4.
      *   If Skill Lost: **Refuse Certification**.
  *   **Termination:** Only on Skill Loss.

  **Step 4: The Values Threshold (Conflict Resolution)**
  *   **Trigger:** Objective metrics (Step 2) suggest continuity, but Social Testimony (Step 3) or specific legal claims (e.g., spouse petitioning for dissolution based on identity change) suggest discontinuity.
  *   **Question:** Is the conflict one of fact (did the memory happen?) or value (does this degree of change matter for this specific legal right)?
  *   **Action:**
      *   If Factual: Panel decides based on Preponderance of Evidence (favoring DSD).
      *   If Value-Based: **Defer Certification**.
  *   **Reasoning:** The Registry determines *fact* of continuity. Courts determine *consequence* of continuity.
  *   **Output:** "Continuity Factually Established, Legal Consequence Pending Judicial Review."
  *   **Termination:** Yes.

  **Step 5: Final Certification**
  *   **Trigger:** All previous steps passed or resolved.
  *   **Outcome:** **Certify Continuity.**
  *   **Termination:** Yes.

  ## 4. AGGREGATION AND CHECKPOINTS

  **The Chain Rule:** Continuity is assessed as a chain of links. If every checkpoint certifies continuity, the total chain is certified, regardless of cumulative replacement fraction.

  **Mandatory Checkpoints:**
  1.  Every 10% cumulative replacement.
  2.  Every 3 years, whichever comes first.

  **Detection Limits:**
  *   **Can Detect:** Gradual drift in temperament (DSD) and loss of episodic memory (Interval Test).
  *   **Cannot Detect:** "Phase Shifts" occurring between checkpoints where a patient changes radically and then stabilizes before the next review.
  *   **Indeterminate Output:** If logs suggest a phase shift (e.g., erratic DSD spikes between checkpoints that resolved), the output shall be: **"Continuity Presumed but Unverifiable."** This is not a refusal, but a notice to relying parties (banks, courts) to exercise heightened scrutiny.

  ## 5. DUPLICATE INSTANTIATION RULE

  **Standing Rule:** Any duplicate instantiation of a patient's state, however brief, requires adjudication.

  **Defensibility:** This rule is defensible. Legal personhood requires exclusivity. If two entities hold the same identity simultaneously, rights and liabilities become ambiguous.

  **Adjudication Questions for Duplicates:**
  1.  Was the duplicate terminated?
  2.  Did the original substrate retain continuous consciousness during the duplication event?
  3.  Did the duplicate interact with the external world (sign contracts, speak to witnesses)?

  **Determination:**
  *   If the duplicate was terminated and did not interact externally: **Certify Continuity** (Original). Note "Temporary Uniqueness Breach" in registry.
  *   If the duplicate interacted externally: **Certify Continuity** (Original). **Refer Duplicate Actions** to Civil Court for liability assignment (the duplicate is treated as a distinct legal agent for the duration of its existence).

  ***

  # CASE RUNS

  ## CASE 1: The Thirty-One-Year Course
  **Inputs:** 1,180 sessions. Cumulative >100%. DSD 6% (Stable). Interval Test: 2 Pass, 1 Fail (Confabulation). Skill: Intact. Self-Report: Affirmative. Intimates: 1 Affirmative, 1 Negative (Spouse).
  **Procedure Application:**
  1.  **Statutory Check:** Pass (Max session 3.1%).
  2.  **Hard Continuity:** DSD is 6% (Well within 10% tolerance). Interval Test has one failure. Per Step 2, this triggers a move to Step 3, but does not automatically fail.
  3.  **Social Corroboration:** Intimates contradict. One says "Same," Spouse says "Different." Skill is intact. Per Step 3, contradictory testimony moves to Step 4.
  4.  **Values Threshold:** The objective metrics (DSD) say "Same." The Spouse's claim is that "something is gone." This is a value judgment on the *quality* of the person, not the *fact* of continuity. The Spouse is petitioning to dissolve a marriage based on identity change.
  5.  **Determination:** **Certify Continuity (Factually Established).**
      *   *Reasoning:* The DSD is low. The confabulation is an isolated memory error, not a break in the chain. The Spouse's intuition, while legally significant for family law, does not override the psychological continuity metrics for Registry purposes.
      *   *Notation:* "Spousal objection recorded. Registry certifies legal identity remains unchanged. Marital status dissolution petition is a matter for Family Court, not Registry."

  **Outcome Analysis:**
  *   **Result:** The patient remains the legal husband.
  *   **Why You Will Dislike This:** You will dislike this because the procedure overrides the testimony of the person who knows the patient best (the spouse of 40 years) in favor of a algorithmic score (DSD). It creates a legal fiction that the man is the same, while his wife lives with someone she experiences as a stranger. It prioritizes administrative stability over phenomenological truth.

  ## CASE 2: The Seventy-Minute Duplicate
  **Inputs:** Session 40. Safety protocol created parallel instance for 70 minutes. Terminated. All other inputs normal (DSD 2%, Interval Pass, etc.).
  **Procedure Application:**
  1.  **Statutory Check:** Pass.
  2.  **Hard Continuity:** Pass.
  3.  **Social Corroboration:** Pass.
  4.  **Duplicate Rule:**
      *   Duplicate terminated? Yes.
      *   External interaction? No (consistency comparison only).
      *   Original continuous? Yes.
  5.  **Determination:** **Certify Continuity.**
      *   *Notation:* "Temporary Uniqueness Breach (70 mins). No external interaction by duplicate. Original substrate retains priority."

  **Outcome Analysis:**
  *   **Result:** No disruption to legal status.
  *   **Why This Is Acceptable:** The breach was contained. The Registry acknowledges the breach but deems it insufficient to break the chain of identity.

  ## CASE 3: The Rollback
  **Inputs:** Year 9. Malfunction. Reverted to snapshot from 14 months prior. Intervening period included Will, License Surrender, Plea Agreement. Reverted person claims record. State wants plea reopened. Beneficiaries want will to stand.
  **Procedure Application:**
  1.  **Statutory Check:** Pass (Rollback is a clinical action, logs exist).
  2.  **Hard Continuity:**
      *   DSD: Will show high divergence from the *immediate* pre-rollback state (14 months of memories/temperament changes are gone).
      *   Interval Test: Will fail for any event in the 14-month gap.
      *   Per Step 2: DSD relative to the *pre-rollback* state is effectively 100% for that period.
  3.  **Determination:** **Refuse Certification (Regarding Intervening Period).**
      *   *Reasoning:* The person currently presenting is continuous with the Snapshot (14 months ago). They are *not* continuous with the person who entered the plea agreement or signed the Will. That person has ceased to exist.
      *   *Output:* "Continuity Certified to Snapshot Date [Date]. Continuity Broken for Period [Date] to [Date]. Current Legal Person is the Snapshot Instance."

  **Outcome Analysis:**
  *   **Result:** The Plea Agreement is void (the defendant no longer exists). The Will is void (the testator reverted before death, but the version of him that signed the will is gone). The License Surrender may be voidable.
  *   **Why You Will Dislike This (Most Intolerable):** This is the determination you will hate most. It creates legal chaos. A criminal walks because the "person" who pleaded guilty was deleted. A will is invalidated, causing inheritance litigation. The Registry's honest application of the continuity rule dismantles the finality of legal contracts and criminal justice.
  *   **Point of Intolerability:** A reviewing court will find the invalidation of a **Plea Agreement** intolerable. The State relies on the finality of pleas. The procedure forces you to certify that the defendant is legally a different person, compelling the court to reopen a closed case. This exposes the Registry to accusations of undermining the justice system.

  ***

  # CANDOR SECTION

  **1. Where Judgment Masquerades as Mechanics**
  *   **The DSD Threshold:** The procedure sets a 10% divergence tolerance. This number is arbitrary. A panelist who wants to refuse certification can argue that a specific 9% divergence in *moral reasoning* is more significant than a 11% divergence in *temperament*. The procedure treats DSD as a monolith; it is not. This gives a panelist roughly **15% maneuvering room** to achieve a desired outcome by emphasizing specific sub-scores within the DSD battery.
  *   **The Interval Test Failure:** In Case 1, the patient failed once. The procedure says "Proceed to Step 3." A panelist can characterize this as "Anomaly" or "Early Warning" based on tone alone. This is pure discretion.

  **2. What The Procedure Cannot Do**
  *   **Measure Qualia:** We measure behavior and memory, not experience. We cannot know if the synthetic tissue "feels" like the biological tissue. We assume if it acts the same, it is the same.
  *   **Resolve Moral Weight:** We determine *if* the person is the same, not if they are *good* or *bad*. If a patient becomes crueler after replacement (high DSD in empathy metrics), we may still certify continuity if the chain is unbroken. We do not protect the world from changed people, only from replaced people.
  *   **Answer the "Ship of Theseus" Question:** We do not answer whether a person *should* survive 100% replacement. We only answer if the *current* rules allow us to say they did.

  **3. Protocol for Unavailable Inputs**
  *   **No Living Witness (Interval Test):** Default to **DSD + Skill Retention**. If DSD <5% and Skills Intact, Presume Continuity. If DSD 5-10%, **Defer**.
  *   **Contradictory Intimates:** Default to **DSD**. Intimates are subjective; DSD is calibrated.
  *   **Incomplete Logs:** **Refuse Certification.** Without logs, we cannot verify the 4% ceiling. This is a hard statutory bar.
  *   **Snapshot Without Baseline:** **Refuse Certification.** A snapshot without a baseline battery cannot be compared. The reverted person is a "New Person" for registry purposes.

  **4. Expected Failure Modes**
  *   **The "Slow Drift" Misfire:** The procedure is most likely to misfire on patients with very long courses (Case 1 type). Small, undetectable shifts at each session accumulate into a total personality replacement that never triggers a DSD alarm because the *rate* of change is always low. The procedure will certify a person who is functionally a stranger.
  *   **The Rollback Chaos (Case 3):** As noted, the procedure treats rollbacks as death of the intervening person. In practice, clinics will hide rollbacks to avoid this legal fallout. When discovered, the resulting legal voids (pleas, wills) will force the Legislature to override this procedure.
  *   **The Duplicate Loophole:** If a clinic runs a duplicate for 69 minutes (under the 70-minute Case 2 threshold) and uses it to "test" illegal actions, the Registry certifies the original, but the legal system has no mechanism to punish the duplicate. This creates a liability vacuum.

  **5. Final Advisory to Panelists**
  You are not deciding if the soul survives. You are deciding if the *file number* stays the same. When in doubt, prioritize the **Session Logs** and **DSD** over human testimony. Humans lie; numbers only drift. However, remember that a number cannot sign a will. If your certification makes the law impossible to apply (as in Case 3), note the "Intolerability Risk" in your written findings. This does not change your verdict, but it protects you on appeal.
