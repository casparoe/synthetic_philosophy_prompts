      *   **The Median Spectator Problem (approx. 600 words):** Focus on Custom and Fashion (Part V). If Abstraction holds, can we critique society? Argue that pure Abstraction fails here. The Idealised element is necessary to allow the "man within the breast" to oppose the "man without."
      *   **The Verdict & Classification (approx. 500 words):** Propose the Hybrid view. Classify as Sentimentalist Constructivism. Explain why this isn't an evasion.
      *   **Key Consideration & Counter-Argument (approx. 500 words):** Identify the "capacity for self-correction" as the key. Address the Tracking defender's objection (that constructivism lacks truth). Refute it by showing Smith's normativity comes from the *stability* of sympathy, not metaphysical truth.
      *   **Conclusion (approx. 100 words):** Summarize the main point.

      *(Self-Correction on Word Count)*: 2,500 words is substantial. I need to ensure I don't rush the analysis of the objections. The Bootstrapping section needs careful philosophical handling. The classification needs to be precise.

