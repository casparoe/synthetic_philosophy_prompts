answer: |-
  The figure of the impartial spectator stands at the architectural centre of Adam Smith's *The Theory of Moral Sentiments*. It is the mechanism by which Smith attempts to bridge the gap between the psychological description of how we feel and the normative prescription of how we ought to act. According to Smith, moral judgement is not a matter of consulting a divine command or calculating aggregate utility, but of viewing one's own conduct through the eyes of an other. An agent determines the propriety of her actions by asking whether she can enter into the sentiments that an impartial spectator would harbour towards them. Yet, while the function of this figure is clear, its ontological and epistemic status remains notoriously obscure. Is the spectator a statistical average of actual observers, a hypothetical construct of the imagination, or a tracker of mind-independent moral truth?

  This essay adjudicates the dispute between these three readings—the abstraction, the idealised-construction, and the tracking readings—by testing them against two formidable objections: the bootstrapping problem and the median spectator problem. I shall argue that neither the pure abstraction nor the pure tracking reading can sustain Smith's system. Instead, a hybrid reading is required, one that treats the spectator as an idealised construction built from empirical materials. This verdict commits Smith to a form of sentimentalist constructivism, a classification that is not an evasion but a principled feature of his attempt to ground normativity in human social psychology.

  To begin, we must delineate the competing interpretations. The abstraction reading posits that the impartial spectator is a composite generalisation of the actual spectators an agent has encountered throughout her life. It is the residue of social interaction, formed by averaging out the partialities and self-interest of real observers. On this view, the spectator is empirical throughout; its verdicts summarise the settled sentiments of a community. The normative force of the spectator derives from its representativeness. To be moral is to align oneself with the collective wisdom of one's peers, purified of momentary passion.

  Contrast this with the idealised-construction reading. Here, the spectator is a hypothetical judge constructed in the agent's imagination. This figure is stipulated to be fully acquainted with the circumstances, disinterested, and unmoved by the agent's own stake. Its verdicts are not a summary of what real people feel, but a correction of those feelings. The agent uses this figure to test her sentiments against a standard of perfect information and neutrality. The normative force here derives from the procedural rigour of the imaginative exercise, not the sociological weight of the community.

  Finally, the tracking reading suggests that the spectator is a standpoint that latches onto moral truth independently of anyone's responses. On this view, the imaginative procedure is merely a heuristic for arriving at a pre-existing moral order. Smith's occasional theological framing of the inner judge as the vicegerent of the Deity is often adduced in support of this. The spectator does not create moral truth but discovers it. The normative force is realist; the spectator is authoritative because it aligns with the nature of things.

  These readings must be tested against the bootstrapping problem. This objection concerns the direct consultability of the normative standard. A standard is directly consultable if an agent can determine which option it ranks highest by attending to that standard alone, without needing to deploy the very moral judgement the standard was introduced to ratify. On all three readings, the agent consults the spectator by imaginatively representing how such a spectator would feel. However, the materials for that representation are the agent's own sentiments, including her partiality and her sense of what counts as being fully informed. It appears, therefore, that the procedure can only confirm judgements the agent has already formed. The spectator's verdict presupposes what the spectator was meant to establish.

  Does the impartial spectator fail direct consultability on all three readings? If we accept the abstraction reading, the bootstrapping problem is severe. If the spectator is merely the average of my community's views, and I am a product of that community, consulting the spectator is simply consulting my own socialised intuitions. I cannot step outside my conditioning to check it. The idealised-construction reading fares slightly better, as it explicitly demands the subtraction of self-interest. However, the agent must still decide what counts as 'disinterested' using her own cognitive faculties. The tracking reading seems immune, as the truth exists independently. Yet, if the only access to this truth is through the imaginative procedure, the epistemic bottleneck remains.

  If the theory fails direct consultability, what normative work is left? It risks becoming a criterion of rightness that cannot be used in deliberation, relegated to a post-hoc justification. Alternatively, it becomes a mere decision procedure—a psychological trick to calm passion without guaranteeing truth. Or, most radically, it becomes an account of how we came by our moral concepts rather than what justifies them. Here, I submit that Smith's theory is at bottom genealogical, but this is not a damaging concession. It is a perfectly respectable role for a moral theory to occupy, provided it explains how the genealogy yields normative authority. Smith is not offering a algorithm for moral calculation; he is offering an account of moral maturity. The spectator is not consultable by the child or the passion-driven adult; it is consultable only by the agent who has undergone the moral education of social interaction. The bootstrapping is not a vicious circle but a spiral of development. We start with partial sentiments, construct a spectator, refine our sentiments, and reconstruct the spectator. The normative work lies in this capacity for self-correction over time, not in instantaneous access to truth.

  This genealogical element, however, exposes the theory to the second objection: the median spectator problem. Suppose the abstraction reading is correct, as the fifth part of the work, concerning the influence of custom and fashion, might suggest. Smith acknowledges that custom can pervert sentiments, leading societies to approve of atrocities such as infanticide or duelling. If the impartial spectator is merely the central tendency of the distribution of actual responses in the agent's community, then in a society that approves of duelling, the impartial spectator of its members will approve of duelling. The theory seems unable to generate an internal critique of one's own community. It cannot vindicate the lone dissenter whose spectator condemns what everyone around her accepts; she can only be described as eccentric, not as right.

  This is damaging. A moral theory that cannot account for the possibility of justified dissent against a corrupt society is critically deficient. Smith clearly wishes to condemn the corruption of sentiments by custom; he does not wish to validate it. Therefore, the pure abstraction reading must be rejected. It cannot block the median spectator problem. But can Smith block it without abandoning the abstraction reading entirely for the tracking reading? To adopt the tracking reading would be to abandon the sentimentalist foundation of the work. If the spectator tracks mind-independent truth, the machinery of sympathy and imagination becomes secondary, a mere foggy lens through which we view the real moral sun. This undermines the core insight of *The Theory of Moral Sentiments*: that morality is rooted in our capacity to feel with others.

  The solution lies in the idealised-construction reading, but refined. The spectator is not the average of what people *do* feel, but a construction of what they *would* feel if they were fully informed and truly impartial. This allows Smith to retain the empirical materials of the abstraction reading (we learn what sympathy feels like from real people) while gaining the normative critical purchase of the idealised reading. The 'man within the breast' can judge the 'man without' because the former represents a perfected version of the latter's capacity for sympathy. In a society of duellists, the impartial spectator does not endorse duelling because, upon full acquaintance with the facts (the pain of death, the frivolity of the insult), the natural sympathy of mankind would recoil. The custom suppresses this natural sympathy, but the impartial spectator represents the natural sympathy restored. Thus, Smith has the resources to block the median spectator problem without resorting to moral realism. He posits a standard of normal human functioning that customs can distort but not redefine.

  Weighing these readings and objections, I reach a definite verdict: the best reading is a hybrid of the abstraction and idealised-construction readings. The abstraction reading correctly identifies the *origin* of the spectator's content; we have no other materials for moral judgement but our social experiences. However, the idealised-construction reading correctly identifies the *authority* of the spectator; its verdicts bind us because they represent a corrected, impartial perspective, not a popular one. The seam runs between the materials of judgement and the procedure of judgement. The materials are empirical and social (abstraction); the procedure is imaginative and corrective (idealisation). The tracking reading must be rejected because it renders the sentimental machinery redundant. If there is a moral truth independent of human sentiment, Smith's elaborate psychology of sympathy is unnecessary. Smith's project is to show how normativity emerges from sentiment, not how sentiment tracks a separate normativity.

  This verdict commits Smith to a specific classification in moral theory. He is not a rule-consequentialist, although he acknowledges the utility of moral rules. He is not a virtue ethicist in the Aristotelian sense, as the focus is not on the flourishing of the individual soul in isolation but on the propriety of sentiments in social exchange. The best classification is a form of sentimentalist constructivism. Moral reasons are constructed through the procedure of sympathetic exchange, constrained by the facts of human psychology and social existence. This is not an evasion of classification. It is a principled feature of the theory. Smith resists the dichotomy between realism and relativism by locating normativity in the stability of social interaction. To be moral is to be a certain kind of social agent, one whose sentiments are stable under the scrutiny of impartial others. This resists classification as 'subjective' because the construction is intersubjective and constrained by human nature; it resists 'objective' realism because it denies moral facts exist prior to the sentimental response.

  The single consideration doing the most work in this verdict is the capacity for self-correction through the imaginative exchange of places. This consideration explains why the hybrid reading succeeds where the pure readings fail. The abstraction reading fails because it lacks a mechanism for correction; the median is just the median. The tracking reading fails because it lacks a mechanism for access; the truth is outside the sentiment. The hybrid reading succeeds because the imaginative exchange *is* the mechanism of correction. By forcing the agent to view her situation from a distance, the procedure alters the sentiment itself. It is not that I discover what I already feel; it is that the act of imagining the spectator changes what I feel. This dynamic process validates the constructivist classification. Normativity is not a static object to be found, but a dynamic equilibrium to be maintained.

  A defender of the tracking reading, however, could press a strong case against this conclusion. They would argue that without an independent moral truth, the constructivist account collapses into consensus. If the spectator is constructed from human sentiments, and human sentiments are historically variable, then the 'corrected' sentiment of a eighteenth-century Briton will differ from that of a twenty-first-century global citizen. If there is no truth to track, how can we say the latter is *better* than the former, rather than just *different*? The tracking theorist argues that Smith's own condemnation of slavery and duelling implies a belief in moral progress, which only makes sense if there is a truth towards which we are progressing. If morality is merely constructed, progress is an illusion; it is merely change. The tracking reading, they claim, is the only one that vindicates the possibility of moral improvement over time.

  This case fails because it misunderstands the nature of the constraints on Smith's constructivism. The construction is not arbitrary; it is constrained by the permanent facts of human nature and the requirements of social existence. Smith believes there is a natural propriety of sentiment, grounded in the biological and psychological constitution of the human species. While customs vary, the capacity for sympathy is constant. Moral progress, on this view, is not a closer approximation of a Platonic form, but the removal of distortions that prevent our natural sympathy from functioning. The abolition of slavery is not progress because we have discovered a new moral fact, but because we have removed the economic and cultural blinders that prevented us from sympathising with the suffering of the enslaved. The tracking theorist demands a metaphysical guarantee for moral progress that Smith does not need. For Smith, the 'truth' of morality is its ability to sustain social life and human flourishing. If a sentiment leads to social destruction or unnecessary misery, it is 'false' in the only sense that matters for a sentimentalist. The tracking reading imposes an external standard of truth that is alien to Smith's internalist framework. It demands that Smith be a realist to be a reformer, but Smith shows us that one can be a reformer by appealing to the better angels of our own constructed nature.

  In conclusion, the dispute over the impartial spectator is resolved not by choosing between the empirical and the ideal, but by recognising their interdependence. The spectator is an idealised construction built from empirical materials. This hybrid view survives the bootstrapping problem by accepting the genealogical nature of moral development, and it survives the median spectator problem by insisting that the construction process corrects for social distortion. This commits Smith to a sentimentalist constructivism, a theory that locates moral authority in the procedural rigour of sympathetic imagination rather than in external truth or social consensus. The strongest objection from the tracking reading—that this lacks a foundation for moral progress—fails because it ignores the naturalistic constraints Smith places on the construction. Smith's ethics resists traditional classification not because it is muddled, but because it anticipates a modern understanding of normativity as a social achievement. The impartial spectator is not a ghost in the machine, nor a mirror of the crowd, but the voice of our own humanity, disciplined by the presence of others.
