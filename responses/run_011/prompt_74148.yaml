      *   *Classification:* "Constructivism" is a modern term, but fits well. It's not Rule-Consequentialism (though Smith uses utility). It's not pure Virtue Ethics (though it focuses on character). It's about the construction of norms through sympathetic exchange. I will call it "Sentimentalist Constructivism."
