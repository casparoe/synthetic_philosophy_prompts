prompt: |-
  I am the standards editor at a mid-sized digital science outlet — a general-interest desk with roughly a million readers a month, four staff editors, and one part-time consulting statistician who turns questions around in two days but never sooner. Between six and ten items a week reach my desk citing a heritability estimate, a polygenic score, or the phrase "partly genetic," and my team has to decide, usually in under twenty minutes and always without a specialist, whether the inference the piece draws is licensed by the number it quotes. Our style guide currently requires that any variance-component figure carry a context line of no more than thirty words naming the population and the range of environments it was estimated in, and it bans the formulation "X percent genetic" in headlines; those are our only existing tools, and they are not enough. I argued about this for most of Saturday with a friend who does quantitative social science. Her position is the deflationary one: a heritability estimate is a ratio of variances in one population at one time under one distribution of environments, it does not travel to individuals, it does not bound what an intervention can do to a mean, it says nothing about differences between groups, and therefore it licenses essentially no claim a newspaper would want to make. My reply was that if the figure licenses nothing, we should print none of them, which is absurd, because our reporters use these numbers to knock down claims that are genuinely knocked down by them — the assertion that the variation in a trait must be entirely a matter of upbringing, for instance, or the assumption that whatever nobody can change must have a high heritability. What I need is an instrument that says positively what such a figure does entitle a writer to assert, and under what conditions, not a list of disclaimers.

  So: write me the decision procedure my four editors can run on a submission. I want the questions in order — sequence matters, since some are cheap and some require reading the methods section — and for each one, what a sufficient answer looks like in finished copy, what phrasings fail it, and where the procedure stops with a no rather than a request for revision. It needs an explicit off-ramp for the most common case, in which the article cites no heritability estimate at all but something adjacent that our writers routinely call one: a polygenic score's share of variance explained, a genetic correlation, a twin concordance figure, a within-family coefficient. It should say what to do when the estimate comes from a population, a birth cohort, or an environment range other than the one the piece is about, and what to do when the measure itself changed between the study and the story. It should include the section my friend will attack hardest, on how far a writer may go in describing a single person's trait as partly genetic, given her contention that the flat denial of any individual-level reading is a slogan rather than a theorem. And it should tell me loudly which questions are really about our mission or about foreseeable harm rather than about what the statistic means, and must therefore be handed up to me instead of settled by the checklist — I would rather the procedure flag its own limits than smuggle values in as method. Mark, as you go, the steps where a judgment call is wearing a lab coat: the places where "sufficient answer" is doing covert normative work. No references and no further reading, please; I need something usable at 9:15 on a Tuesday morning.

  Then run it on three items sitting on my desk now, showing what your questions extract from each. First, a piece by our most senior reporter built on a study that re-estimated a behavioural trait's genetic associations using sibling pairs, arguing that the larger figures reported by earlier studies of unrelated people were inflated by family environment and population structure; the piece concludes that those earlier numbers were largely an artefact, and I have already told the reporter I like the framing. Second, a piece reporting that the heritability of IQ-test scores is much higher among affluent families than among poor ones in the country where the study was done, which goes on to conclude that cognitive outcomes among poor children are essentially environmental and that only social spending can move them; the replication record for that interaction is mixed and the piece does not say so. Third, a contribution from an outside writer with a reputation for hereditarian argument whose draft is, so far as my editors can tell, technically scrupulous — it reports a within-population estimate, declines to draw any inference about group differences, and even supplies its own context line — but which my deputy wants spiked on the grounds that it will be excerpted by readers who do draw that inference. If your procedure clears the third item, say so plainly and tell me what it leaves me free to do about it; I would rather have an instrument that occasionally tells me something I do not want to hear than one that ratifies my instincts. Close with what the procedure cannot do: the classes of claim it will pass or fail wrongly, and where you expect my friend to break it, since she has agreed to read the thing.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure and analysis:

  1.  **Analyze the Request:**

      *   **User:** Standards Editor at a mid-sized digital science outlet (1M readers/month, 4 staff editors, 1 part-time statistician).
      *   **Problem:** Current style guide (context line + headline ban) is insufficient. Too many items (6-10/week) citing heritability/polygenic scores/"partly genetic." Need a decision procedure for editors to use quickly (under 20 mins) without a specialist.
      *   **Conflict:** User vs. Friend (Quant Social Scientist). Friend says heritability licenses *no* claims (deflationary). User says if it licenses nothing, don't print it, but it *does* knock down specific false claims (e.g., "must be entirely upbringing").
      *   **Goal:** A positive decision procedure (what *can* be asserted), not just disclaimers.
      *   **Requirements:**
          *   Ordered questions (cheap to expensive).
          *   Sufficient answers vs. failing phrasings.
          *   Explicit "No" vs. "Revise" endpoints.
          *   Off-ramp for adjacent stats (PGS, twin concordance, etc.).
          *   Handling population/environment mismatches.
          *   Handling individual-level claims (the friend's hardest attack point).
          *   Flagging normative/mission-based judgments (not statistical) for the Editor.
          *   Marking where "sufficient answer" hides normative work ("judgment call wearing a lab coat").
          *   No references/further reading.
          *   **Application:** Run the procedure on three specific draft items (Sibling re-estimation, SES x Heritability interaction, Outside hereditarian writer).
          *   **Closing:** Limitations of the procedure and where the friend will object.

  2.  **Deconstruct the Scientific/Statistical Constraints:**

      *   *Heritability ($h^2$):* Ratio of genetic variance to total phenotypic variance in a specific population at a specific time. Does not apply to individuals. Does not imply immutability. Does not explain between-group differences.
      *   *Polygenic Scores (PGS):* Prediction accuracy ($R^2$), not heritability. Often confounded by population structure.
      *   *Twin/Concordance:* Rough proxy, assumes equal environments (often violated).
      *   *GxE Interaction:* Heritability can vary by environment (e.g., SES).
      *   *Individual Level:* Technically, $h^2$ is population-level. However, saying a trait is "influenced by genetics" for an individual is generally acceptable if qualified as probabilistic/population-derived, whereas "X% genetic" is not.
      *   *Normative/Editorial:* When does a technically true statement cause harm? When does it mislead by omission?

  3.  **Drafting the Decision Procedure (The "Instrument"):**

      *   *Structure:* Needs to be a flowchart or numbered list. Numbered is better for text.
      *   *Sequence:* Start with definition (is it actually heritability?), then scope (population match), then inference (what claim is being made?), then harm/mission (editorial judgment).
      *   *Tone:* Professional, directive, clear.
      *   *Key Feature:* Must distinguish between statistical validity and editorial policy.

      *   *Step 1: Identification.* Is it actually $h^2$? If PGS/Twin, label correctly.
      *   *Step 2: Context.* Population and Environment match?
      *   *Step 3: The Claim.* What is the number doing? (Refuting environmental determinism vs. claiming immutability vs. explaining group diffs).
      *   *Step 4: Individual Language.* How to talk about people.
      *   *Step 5: The "Lab Coat" Check.* Identifying normative judgments.

  4.  **Developing the Three Case Studies:**

      *   *Case 1 (Sibling Re-estimation):* Technically sound. Refutes inflated prior estimates.
          *   *Procedure Outcome:* Pass with revision on context.
          *   *Nuance:* Ensure "artefact" doesn't imply *no* genetics, just *less* than thought.
      *   *Case 2 (SES x IQ Heritability):* Controversial interaction (Scarr-Rowe). Claim: "Poor kids = essentially environmental."
          *   *Procedure Outcome:* Fail/Revise. The inference "essentially environmental" is too strong given mixed replication. Implies immutability for affluent (maybe) but malleability for poor (yes, but "essentially" is the trap).
          *   *Normative Flag:* The certainty of the policy conclusion based on mixed science.
      *   *Case 3 (Outside Hereditarian):* Technically scrupulous. No group diffs.
          *   *Procedure Outcome:* Pass statistically.
          *   *Editorial Flag:* This is the "harm" question. The procedure must flag this to the Editor, not the staff editor. It clears the stats, but the *consequence* is an editorial call.

  5.  **Refining the "Friend's Objection" & "Lab Coat" Marks:**

      *   The friend argues individual-level talk is nonsense. The procedure needs to allow *some* individual talk (otherwise science journalism is impossible) but restrict *quantitative* individual talk.
      *   "Lab Coat" marks need to highlight where we decide "this is close enough" or "this risk is acceptable."

  6.  **Writing the Content (Iterative refinement):**

      *   *Intro:* Acknowledge the constraint (20 mins, no specialist).
      *   *The Procedure:* Use bold headers. Clear Pass/Fail/Editor criteria.
      *   *The "Off-Ramp":* Crucial for PGS/Twin stats.
      *   *The Application:* Be specific about the text changes.
      *   *The Limitations:* Be honest about where the math ends and the values begin.

      *(Self-Correction during drafting)*: I need to make sure I don't just give statistical advice. The prompt asks for a *decision procedure* for editors. It needs to look like a checklist they can hold. I also need to ensure I explicitly mark the "judgment call wearing a lab coat" sections as requested.

      *(Refining Case 3)*: The prompt says "If your procedure clears the third item, say so plainly and tell me what it leaves me free to do about it." This is key. The procedure should validate the *stats*, but flag the *publication decision* as outside the procedure's scope (i.e., an Editor call).

      *(Refining the "Individual" question)*: The friend says individual reading is a slogan, not a theorem. I need to allow "genes play a role" but ban "50% genetic." The distinction is qualitative vs. quantitative at the individual level.

  7.  **Final Review against Constraints:**

      *   No references? Check.
      *   Order matters? Check.
      *   Sufficient answer vs. Failing phrasing? Check.
      *   Off-ramp for adjacent stats? Check.
      *   Population/Environment mismatch? Check.
      *   Individual trait section? Check.
      *   Flag normative/mission questions? Check.
      *   Mark "judgment call wearing a lab coat"? Check.
      *   Run on 3 items? Check.
      *   Close with limitations/friend's break point? Check.

  8.  **Final Polish:** Ensure tone is appropriate for a Standards Editor (authoritative, precise, pragmatic). (Proceeding to generate output based on these thoughts.)

      *Wait, one detail:* "Mark, as you go, the steps where a judgment call is wearing a lab coat." I need to make sure these are visually distinct in the procedure section. I will use a specific notation like **[JUDGMENT CALL]**.

      *Another detail:* "Close with what the procedure cannot do... and where you expect my friend to break it." I need to make sure this section is robust.

      *Case 2 Nuance:* The claim "cognitive outcomes among poor children are essentially environmental" is a strong causal claim based on a variance interaction. The procedure needs to catch this as an overreach of the statistic.

      *Case 3 Nuance:* The procedure must clear the *text*, but the *decision to publish* is the Editor's burden. I need to make sure the procedure explicitly hands this off.

      *Let's build the procedure.*

      *   **Q1: Taxonomy.** Is it $h^2$, PGS, Twin?
      *   **Q2: Provenance.** Population/Environment match.
      *   **Q3: Inference.** What claim is supported? (Variation vs. Mean, Population vs. Individual).
      *   **Q4: Individual Language.** Qualitative vs. Quantitative.
      *   **Q5: Editorial Risk.** (The hand-off to the Editor).

      *Okay, ready to write.*
answer: |-
  # The Variance-Claim Decision Procedure (VCDP)

  **Usage:** Run sequentially. Stop at the first "NO." If a step requires revision, apply the fix and proceed. If a step is marked **[EDITOR HANDOFF]**, stop and escalate to the Standards Editor.

  ### 1. Taxonomy Check (The Off-Ramp)
  **Question:** Does the text explicitly call the number "heritability" ($h^2$)?
  *   **If YES:** Proceed to Q2.
  *   **If NO (It is PGS, Twin Concordance, Genetic Correlation, or $R^2$):**
      *   **Action:** The text must label the statistic by its actual name (e.g., "polygenic score prediction accuracy," "twin concordance rate"). It cannot be referred to as "genetic influence" or "heritability" without qualification.
      *   **Sufficient Answer:** "The polygenic score explained 10% of the variance."
      *   **Failing Phrasing:** "The genetic score showed the trait is 10% heritable."
      *   **Stop Condition:** If the writer refuses to distinguish prediction accuracy from variance components, **NO**. (Prediction does not equal causation; PGS captures structure and linkage, not just causal variants).
      *   **[JUDGMENT CALL]:** Determining whether a PGS $R^2$ is being used as a *proxy* for heritability requires estimating the gap between prediction and mechanism. If the gap is large (e.g., diverse populations), treat as **NO**.

  ### 2. Provenance Match (Population and Environment)
  **Question:** Does the study population and environmental range match the population discussed in the article?
  *   **Sufficient Answer:** The text names the population (e.g., "adults of European ancestry," "Swedish twins born 1950–1970") and qualifies the finding to that group.
  *   **Failing Phrasing:** "Humans are 50% genetic for neuroticism" (based on a UK Biobank study).
  *   **Revision Required:** Insert the 30-word context line (existing style guide).
  *   **Stop Condition:** If the article makes claims about a group *excluded* from the study (e.g., applying a European-ancestry estimate to a global claim, or applying an adult estimate to children) without explicit warning, **NO**.
  *   **[JUDGMENT CALL]:** Deciding how "close enough" a proxy population is (e.g., using US data for Canada) is not statistical; it is an editorial risk assessment regarding misrepresentation.

  ### 3. The Inference License (What the Number Does)
  **Question:** What claim is the number supporting?
  *   **Allowed Claims:**
      1.  Refuting strict environmental determinism (i.e., showing variance is not 100% environmental).
      2.  Describing the proportion of *current variation* in a *specific group* attributable to genetic differences.
      3.  Comparing the relative magnitude of genetic vs. environmental variance *within that specific study context*.
  *   **Forbidden Claims:**
      1.  Immutability (i.e., "cannot be changed").
      2.  Between-group differences (i.e., explaining mean differences between distinct populations).
      3.  Intervention futility (i.e., "policy won't work").
  *   **Sufficient Answer:** "In this cohort, genetic differences accounted for more variation than school quality."
  *   **Failing Phrasing:** "Because heritability is high, tutoring programs will fail."
  *   **Stop Condition:** If the text uses the estimate to argue against intervention efficacy or to explain group means, **NO**.

  ### 4. The Individual Limit (The Friend's Constraint)
  **Question:** Does the text attribute a percentage or proportion of a *single person's* trait to genetics?
  *   **Rule:** You may state that genetics *contributed* to an individual's trait, but you may not quantify *how much*.
  *   **Sufficient Answer:** "His height is partly due to his genes." / "Genetics plays a role in her risk."
  *   **Failing Phrasing:** "His height is 80% genetic." / "Her depression is half genetic."
  *   **Stop Condition:** If the writer insists on quantifying the individual contribution, **NO**.
  *   **[JUDGMENT CALL]:** Allowing qualitative individual claims ("partly genetic") accepts a philosophical stance that population probabilities map meaningfully to individual causality. Your friend denies this. By allowing "partly," you are making a normative choice to prioritize reader intuition over strict statistical ontology. Mark this as **Editorial Policy**, not statistical truth.

  ### 5. Editorial Risk and Mission (The Handoff)
  **Question:** Even if statistically accurate, does the framing invite harmful misinterpretation that the text cannot reasonably prevent?
  *   **Criteria:**
      1.  Will this be excerpted to support a claim the article explicitly forbids (e.g., racial essentialism)?
      2.  Does the certainty of the tone exceed the replication record?
      3.  Does the piece serve a public understanding goal that outweighs the risk of misuse?
  *   **Action:** If the answer to 1 or 2 is "Yes," or if you are unsure about 3, **EDITOR HANDOFF**.
  *   **[JUDGMENT CALL]:** This is not a statistical question. It is a question of harm, mission, and consequence. The checklist cannot solve this; it can only flag it.

  ***

  # Application to Current Desk Items

  ### Item 1: Sibling Re-estimation (Senior Reporter)
  *   **Q1 (Taxonomy):** Uses genetic associations/sibling pairs. Calls earlier numbers "inflated."
      *   *Verdict:* **PASS.** Ensure "inflated" is defined as "confounded by family structure," not "false."
  *   **Q2 (Provenance):** Study matches the behavioral trait discussion.
      *   *Verdict:* **PASS.** Add context line regarding the specific cohort.
  *   **Q3 (Inference):** Claims earlier numbers were artefacts of population structure. Refutes the claim that the trait is *more* genetic than previously thought.
      *   *Verdict:* **PASS.** This licenses the claim that previous variance estimates were upper bounds.
  *   **Q4 (Individual):** No individual quantification noted.
      *   *Verdict:* **PASS.**
  *   **Q5 (Risk):** Framing reduces genetic determinism.
      *   *Verdict:* **PASS.**
  *   **Outcome:** **Clear for publication** pending the standard context line. The procedure validates your instinct: this use of genetics literature corrects a prior error rather than entrenching a bias.

  ### Item 2: SES x IQ Heritability (Interaction Study)
  *   **Q1 (Taxonomy):** Cites heritability estimates stratified by SES.
      *   *Verdict:* **PASS.**
  *   **Q2 (Provenance):** Study country matches article country.
      *   *Verdict:* **PASS.**
  *   **Q3 (Inference):** Article concludes poor children's outcomes are "essentially environmental" and "only social spending can move them."
      *   *Verdict:* **FAIL.**
      *   *Reasoning:* A lower heritability estimate in poor families does not prove the trait is "essentially environmental" (it could be measurement error, restricted range, or different genetic expression). It certainly does not license the claim that *only* social spending works (intervention efficacy is not the inverse of heritability).
      *   *Revision:* Must state that genetic variance was *lower* in this group, not that environment is the *sole* cause. Must acknowledge mixed replication record (as per your notes).
  *   **Q5 (Risk):** **[EDITOR HANDOFF].** The claim "only social spending can move them" is a policy prescription derived from a variance ratio. This exceeds the statistical license.
  *   **Outcome:** **Return for Revision.** The statistical inference is too strong for the data provided. The policy conclusion must be decoupled from the heritability estimate.

  ### Item 3: Outside Hereditarian Writer (Technically Scrupulous)
  *   **Q1 (Taxonomy):** Within-population estimate.
      *   *Verdict:* **PASS.**
  *   **Q2 (Provenance):** Context line supplied.
      *   *Verdict:* **PASS.**
  *   **Q3 (Inference):** Declines group difference inference. Refutes environmental determinism.
      *   *Verdict:* **PASS.** Statistically, the claims are licensed.
  *   **Q4 (Individual):** Qualitative only.
      *   *Verdict:* **PASS.**
  *   **Q5 (Risk):** Deputy wants to spike due to foreseeable excerpting by bad actors.
      *   *Verdict:* **EDITOR HANDOFF.**
  *   **Outcome:** **The Procedure Clears the Text.** The statistics and inferences meet the scientific standards.
      *   **Your Freedom:** Because Q5 flags this as a mission/harm question, you are free to **SPIKE** the article without contradicting the procedure. The procedure validates the *truth* of the statements; it does not mandate the *publication* of true statements if the downstream harm violates outlet mission. You may reject it on editorial grounds, provided you do not claim it is statistically wrong.

  ***

  # Limitations and The Friend's Break Point

  **What the Procedure Cannot Do:**
  1.  **It cannot validate causality.** A high heritability estimate does not prove specific genes cause the trait, only that genetic *differences* correlate with trait *differences* in that context. The procedure prevents you from claiming specific mechanisms, but it cannot fix a study that confounds genetics with epigenetics or gene-environment correlation.
  2.  **It cannot solve the "Replication Crisis."** If the source study is false but well-written, the procedure will pass it. It checks internal consistency between study and text, not the truth of the study itself.
  3.  **It cannot quantify "Harm."** Q5 flags the issue, but does not solve it. You will still have to decide, case-by-case, whether accurate science is too dangerous to publish.

  **Where Your Friend Will Break It:**
  Your friend will attack **Q4 (The Individual Limit)**.
  *   **Her Position:** Even saying "His trait is partly genetic" is category error. Variance ratios apply to populations, not individuals. An individual's trait is the result of a unique developmental trajectory where genes and environment are inextricably fused, not additive components.
  *   **The Procedure's Stance:** It concedes this point statistically but overrides it pragmatically. It marks Q4 as a **[JUDGMENT CALL]**. It admits that allowing qualitative individual language is a concession to reader comprehension, not a statistical theorem.
  *   **The Friction:** She will argue that by allowing "partly genetic," you are perpetuating the "nature vs. nurture" dualism that quantitative genetics supposedly dismantles. You must accept this critique as valid *scientifically* while maintaining the *editorial* stance that some dualism is necessary for communication. The procedure protects you by explicitly labeling this choice as normative, not mathematical.

  **Final Note on Q5:**
  Your friend will likely approve of Q5, as it acknowledges that the *use* of the statistic is a social act with consequences, not just a transmission of data. Ensure your editors understand that a "Pass" on Q1–Q4 does not mean "Publish." It means "Statistically Coherent." The decision to publish remains yours.
