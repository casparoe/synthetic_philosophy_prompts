answer: |-
  You have not conflated two patterns; you have identified a single, coherent structural phenomenon. The order (ex post) and the substitution (type of reason) are distinct variables, but their combination creates the specific immunity you are observing. If the reasons were swapped simultaneously, it would be simple dishonesty. If the new reason were added without supplanting the old, it would be an honest update. The pattern you describe relies on the *temporal gap* allowing the *substitution* to go unchallenged.

  Here is the breakdown of the concepts, literature, edges, and a proposed name.

  ### 1. Nearest Established Concepts and Mismatches

  There are three conceptual neighbors that capture parts of this pattern, but each fails to capture the whole.

  **A. The Motte-and-Bailey Fallacy**
  *   **The Concept:** A rhetorical tactic where an arguer retreats from a controversial, hard-to-defend position (the Bailey) to a modest, easily-defended position (the Motte) when challenged, then returns to the Bailey once the challenge subsides.
  *   **The Fit:** This maps perfectly to your Stage 3. The "Standards/Tone" argument is the Bailey (subjective, hard to defend against liberal critique). The "Harm/Safety" argument is the Motte (objective, defensible). When pressed on harm, they retreat to standards ("It's also about our values"). When pressed on values, they retreat to harm ("But it also causes injury").
  *   **The Mismatch:** Motte-and-Bailey is traditionally understood as a *synchronous* debate tactic used by an individual interlocutor. Your pattern is *diachronic* (unfolding over months/years) and *institutional*. It is not a debater shifting ground; it is an organization shifting its official record. The "retreat" is baked into the documentation, not just spoken in a meeting.

  **B. Pretextuality (Constitutional Law)**
  *   **The Concept:** A government action is "pretextual" if the stated legal justification is a cover for a different, often impermissible, motive (e.g., a traffic stop used as a pretext to search for drugs without probable cause).
  *   **The Fit:** This captures the relationship between Stage 1 and Stage 2. The "Harm" rationale is a pretext for the "Standards" rationale.
  *   **The Mismatch:** In law, pretextuality usually implies the *hidden* motive is illicit (e.g., racial discrimination). In your case, the "Standards" motive (Stage 1) is not necessarily illicit; it is just non-instrumental. Furthermore, legal pretext analysis usually tries to uncover the *original* motive. Your pattern is unique because the organization does not hide the original motive entirely; it keeps it in reserve as a fallback (Stage 3), whereas a legal pretext is usually denied outright.

  **C. Expressive vs. Instrumental Regulation**
  *   **The Concept:** Legal theory distinguishes between *instrumental* rules (designed to cause a specific outcome, e.g., reduce fraud) and *expressive* rules (designed to signal values, e.g., "we do not tolerate hate").
  *   **The Fit:** This accurately categorizes the *content* of your two stages. Stage 1 is Expressive (signaling "this is not the kind of place we are"). Stage 2 is Instrumental (preventing "harassment" or "fraud").
  *   **The Mismatch:** This framework describes the *types* of reasons, but it is neutral on the *switching*. It does not explain why an expressive rule would need to be disguised as an instrumental one. It lacks the critical component of *legitimacy management* that drives the transition from Stage 1 to Stage 2.

  ### 2. Relevant Literature and Fields

  You do not need to read these texts to grasp the concepts, but knowing they exist validates that you are describing a recognized structural issue.

  **Administrative Law: The *Chenery* Principle**
  *   **Concept:** Derived from *SEC v. Chenery Corp* (1943). It holds that a government agency's action must be judged solely by the grounds it invoked *at the time of the action*. An agency cannot defend an action in court using reasons it did not rely on when it made the decision.
  *   **Relevance:** This is the explicit legal prohibition against your Stage 2. In formal administrative law, "post-hoc rationalization" is forbidden. Your platform is operating like an administrative state but without the procedural constraints that forbid this specific maneuver.

  **Political Science: Symbolic Politics (Murray Edelman)**
  *   **Concept:** In *The Symbolic Uses of Politics* (1964), Edelman argues that much policy is enacted not to solve problems instrumentally, but to reassure the public that "something is being done."
  *   **Relevance:** This explains Stage 1. The ban is symbolic (reassuring the community of its identity). Stage 2 is the attempt to translate that symbolism into material terms because modern technocratic institutions are not allowed to admit they are acting symbolically; they must claim to be solving material problems.

  **Organizational Sociology: Legitimacy and Decoupling**
  *   **Concept:** Institutions seek "legitimacy" from their environment. "Decoupling" occurs when an organization separates its formal structures (policy documents) from its actual practices or internal motivations to satisfy external observers.
  *   **Relevance:** Your Stage 2 is a decoupling maneuver. The internal motivation (Standards) is decoupled from the external justification (Harm) to satisfy external critics (journalists, advertisers) who demand instrumental rationality.

  ### 3. The Edges: Distinguishing from Honest Revision

  You asked how to distinguish this pattern from a genuine discovery of harm. You can apply these three tests to the policy documents and records:

  **A. The Acknowledgement Test**
  *   **Honest Revision:** The policy document or transparency report explicitly states: "We originally adopted this for reason X. New data suggests reason Y is also present. We are updating the rationale to include Y."
  *   **The Pattern:** The new rationale is presented as if it were *always* the primary or sole rationale. The original rationale is not acknowledged as the precursor; it is demoted to "context."
  *   **Document Signal:** Look for tense. "This policy *was designed* to prevent fraud" (false) vs. "This policy *now also helps* prevent fraud" (honest).

  **B. The Dependency Test**
  *   **Honest Revision:** If you remove the new harm-based rationale, the policy still stands on the original standards-based rationale.
  *   **The Pattern:** The standards-based rationale is treated as insufficient on its own in public, but the harm-based rationale is treated as insufficient on its own internally.
  *   **Document Signal:** In public FAQs, does the harm claim stand alone? In internal memos, is the harm claim acknowledged as secondary? If the public justification collapses without the private one, and vice versa, it is the pattern.

  **C. The Specificity Test**
  *   **Honest Revision:** The newly discovered harm is specific, measured, and falsifiable (e.g., "We observed a 15% increase in reports of type Z").
  *   **The Pattern:** The newly discovered harm is often vague, anecdotal, or structurally identical to the original standard (e.g., "It makes users feel unsafe" vs. "It makes the site feel cheap").
  *   **Document Signal:** Look for metrics. If the "harm" is described qualitatively ("users feel pushed out") rather than quantitatively ("churn increased by X% among group Y"), it is likely a retrofit.

  ### 4. Proposed Name and Definition

  Since no single existing term captures the temporal, institutional, and justificatory switching you described, I propose the term:

  **Rationale Laundering**

  **Definition:**
  *An institutional process wherein a policy adopted on expressive or normative grounds (Stage 1) is subsequently retrofitted with instrumental or harm-based justifications (Stage 2) to satisfy external scrutiny, resulting in a dual-justification structure (Stage 3) where the two rationales are deployed selectively to insulate the policy from critique.*

  **Criteria for Classification:**
  1.  **Temporal Gap:** The instrumental justification appears significantly after the policy implementation.
  2.  **Typological Shift:** The justification shifts from *Normative* (values, tone, identity) to *Instrumental* (harm, safety, fraud).
  3.  **Mutual Exclusivity in Deployment:** The two justifications are not used simultaneously in the same forum. The Instrumental reason is used for defense; the Normative reason is used for internal cohesion or when the Instrumental reason is debunked.
  4.  **Non-Acknowledgement:** The organization does not formally acknowledge the shift as an update or revision.

  **Borderline Cases:**
  *   **The "Discovery" Border:** If internal data *actually* existed at Stage 1 but was not public, and is simply released at Stage 2, this is **Transparency Lag**, not Rationale Laundering. The key differentiator is whether the harm was *conceptually present* during deliberation.
  *   **The "Hybrid" Border:** If the policy document explicitly lists both reasons from the start (e.g., "To maintain community tone AND prevent fraud"), and both are defended simultaneously, this is **Redundant Justification**, not Laundering. Laundering requires the *substitution* or *hiding* of one reason behind the other.

  ### 5. On Conflation

  You asked if you conflated "order" and "substitution." You did not.

  *   **Order (Ex Post):** If the harm reason were offered *first*, and the standards reason added *later*, it would be "Mission Creep."
  *   **Substitution:** If the harm reason replaced the standards reason *completely* (and the standards reason was discarded), it would be "Pivot."

  The phenomenon you identified is specifically **Ex Post Substitution with Retention.** The "Order" creates the opportunity for the "Substitution," and the "Retention" (keeping the standards reason in reserve) creates the immunity.

  In your specific context (Trust & Safety), this is particularly common because "Standards" are legally and culturally fragile (accusations of bias, censorship, elitism), while "Safety" is legally and culturally robust. **Rationale Laundering** is the mechanism by which a platform converts fragile cultural capital into robust safety capital.

  ### Summary for your Workflow

  When reviewing policy docs, look for the **Chenery Violation**: Does the public justification match the deliberation record? If the deliberation record says "vibes" and the transparency report says "safety," and they do not acknowledge the gap, you are observing **Rationale Laundering**.

  It is not necessarily malicious. It is often a survival mechanism for policy teams operating in an environment that demands instrumental rationality for decisions that are fundamentally normative. However, identifying it allows you to stop arguing against the "Harm" (which is a shield) and start arguing about the "Standards" (which is the sword).
