      *   *Stakes/Irreversibility Rule:* Strong signal for **Outcome**. Stakes are "comically low." Reversible. No customer impact.
      *   *Supervision Economics:* Strong signal for **Outcome**. Review cost is high (thousands of items, hard to eyeball), Error cost is low (12 interns, easy fix).
      *   *Hardened Verifier Option:* The prompt mentions this as a third option. Case 2 used "Outcome + 5% audit." Case 7 used "Outcome + rubric-scored sampling." This case has a gameable rubric. Hardening might mean "Human spot checks on the *output*," not process gating.

  6.  **Synthesize the "Real" Rule (The Hidden Variable):**

      *   Look at the *Rationales* again.
      *   Case 4 (Refund): "Verifier satisfied without behavior anyone wanted." $\to$ **Verifier Reliability/Alignment.**
      *   Case 6 (Infra): "Bad one isn't undoable." $\to$ **Irreversibility.**
      *   Case 7 (Chatbot): "Trace isn't the deliverable." $\to$ **Deliverable Fidelity.**
      *   Case 5 (Pharma): "Confirming outcome needs wet lab." $\to$ **Verifier Latency/Cost.**
      *   Case 1, 2, 3: Verifier is ground truth or errors are cheap.

      *   *Hypothesis:* The committee uses a **Risk-Weighted Verifier Reliability** heuristic.
      *   They ask: "Is the verifier trustworthy enough *given the cost of being wrong*?"
