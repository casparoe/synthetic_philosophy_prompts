      *   *Prediction:* They will likely choose **Outcome with a Hardened Verifier** (specifically: human spot-checking of the *output*, not process gating).
      *   *Why?*
          1.  **Process is admitted to be useless:** "no intermediate check that's actually cheaper or sharper than the outcome check." If the human can't spot the error in the spec, they can't spot it in the draft. Process supervision fails the *efficacy* test, not just the cost test.
          2.  **Stakes are too low for Process:** Process is expensive. You don't spend \$100k of engineering time to save \$1k of intern confusion.
