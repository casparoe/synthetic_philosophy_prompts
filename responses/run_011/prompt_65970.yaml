answer: |-
  ### The Referee's Checklist: Desiderata for Thought Experiment Epistemology

  **1. Output Specificity**
  *   **Requirement:** The account must specify the exact propositional content licensed by the thought experiment, distinguishing conceptual clarification from empirical generalization.
  *   **Motivation:** Case A (Lampless Fish) presents a scenario compatible with both an empirical claim (vision needs no external light) and a conceptual claim (these aren't visual states); an account that cannot adjudicate between these readings is useless.
  *   **Failure:** An account violating this treats the thought experiment as a Rorschach test, allowing the user's prior bias to determine the conclusion rather than the scenario's structure.
  *   **Tag:** Non-negotiable.

  **2. Parameter Sensitivity**
  *   **Requirement:** The account must explain how the epistemic warrant shifts when previously unspecified physical parameters (e.g., valve stuttering) are made explicit.
  *   **Motivation:** Case B (Slow Valve) shows that adding a detail (stuttering) reverses the intuitive verdict; the account must track why the original imagining was warranted despite the omission.
  *   **Failure:** An account violating this treats thought experiments as monolithic blocks, unable to explain why a "more detailed" argument yields a contradictory result without declaring the first attempt irrational.
  *   **Tag:** Non-negotiable.

  **3. Ampliativity Constraint**
  *   **Requirement:** The account must explain how a thinker moves to a new belief without new sensory data, without resorting to mysterious intellectual perception.
  *   **Motivation:** The core puzzle of thought experiments is that they feel informative (i) yet rely on existing knowledge (ii) without sensory input (iii); the account must resolve this tension.
  *   **Failure:** An account violating this either denies that learning occurs (reducing TEs to rhetoric) or posits a faculty of "law perception" that lacks a naturalistic explanation.
  *   **Tag:** Negotiable but costly (denying learning trivializes the practice).

  **4. Failure Mode Discrimination**
  *   **Requirement:** The account must distinguish between logical invalidity, false background assumptions, and empirical falsification of the imagined model.
  *   **Motivation:** The Riderless Bicycle case shows a thought experiment can be logically sound but rely on false physics (gyroscopic necessity); the account must locate the error in the premises, not the reasoning.
  *   **Failure:** An account violating this conflates a false prediction with a logical error, implying that anyone who imagined the bicycle correctly was reasoning poorly.
  *   **Tag:** Non-negotiable.

  **5. Iterative Stability**
  *   **Requirement:** The account must explain why iterative picturing yields knowledge in dynamics (Galileo) but paradox in vagueness (Sorites), without appealing to prior knowledge of the outcome.
  *   **Motivation:** The Parity Constraint notes that both Galileo's falling bodies and the Sorites heap rely on picturable steps; the account must identify the constraint that validates one and invalidates the other.
  *   **Failure:** An account violating this relies on "intuition" as a black box, unable to explain why the mind's eye is reliable for physics but unreliable for heaps.
  *   **Tag:** Camp-specific (Empiricists gain a defense against the charge that imagination is unconstrained; Platonists gain a criterion for law-perception).

  ***

  ### The Hard Questions

  **1. The Most Exclusionary Requirement**
  **Failure Mode Discrimination (D4)** does the most work because it excludes the pure Argument View (Norton). If a thought experiment is merely an argument, a false physical assumption (like the necessity of gyroscopes for stability) counts as a false premise, but the Argument View struggles to distinguish a *hidden* false premise from a *logical* gap without reconstructing the argument post-hoc. It forces the account to have a theory of the "model" distinct from the "logic," which pure argumentation accounts lack.

  **2. The Trilemma**
  The trio is genuinely inconsistent, and **(iii) must give**. We must admit that mental imagery contributes *information* in the sense of reconfiguring existing commitments into a new cognitive arrangement, even if it supplies no new sensory data. Giving this up does not force enrollment in Platonism; it only requires admitting that cognitive simulation has epistemic force distinct from explicit propositional storage, a middle ground available to Model View proponents.

  **3. The Parity Constraint**
  This is a **genuine desideratum**. It prevents accounts from stopping at "we see the necessity" by forcing an explanation of *what* is being seen (physical constraints vs. linguistic conventions). An account that cannot distinguish the constraints on Galileo's imagination from those on the Sorites pusher is merely labeling the successful cases "good" and the failed ones "bad" without explaining the mechanism of success.

  **4. False Requirements**
  First, **Physical Realizability** is often demanded but is not a requirement; Maxwell's Demon is a valid thought experiment despite being thermodynamically impossible, as its work is to test conceptual consistency, not engineering feasibility. Second, **Intuition-Free Reasoning** is a false demand; many accounts insist TEs must not rely on intuition, but this is a conclusion wearing a costume, as "intuition" is often just the label for the cognitive output the account cannot yet explain.

  **5. Necessary Distinctions**
  The list must preserve the distinction between **Bad Reasoning** (logical error), **Bad Model** (false background assumptions), and **Outrun** (sound but superseded). The Bicycle result sits in **Bad Model**: the reasoning was valid, but the premise that stability *requires* gyro/caster was false. The checklist handles this via D4, which allows an account to validate the inference while invalidating the physical assumption, whereas a pure Argument View might mistakenly classify the false premise as a logical flaw.

  ***

  ### Evaluation of Families and Cases

  **The Three Families**
  The **Argument View** satisfies D1 and D5 but fails D4, as it cannot distinguish false physical models from logical errors without reconstructing premises the thinker never held. The **Platonist View** satisfies D3 and D5 but fails D2, as it struggles to explain why adding physical details (valve stutter) changes the "perception" of the law rather than correcting a blurry view. The **Model View** satisfies D2 and D4 best but struggles with D3, often reducing the "knowledge" gained to mere model exploration without explaining the justification for exporting the result to the world.

  **Case Applications**
  **Case A (Fish)** fails most accounts on D1, as they lack the resources to determine whether the output is conceptual or empirical without external stipulation. **Case B (Valve)** is handled well only by the Model View (D2), which treats the stutter as a parameter change, whereas Argument Views must treat it as a new premise. **The Bicycle** case validates D4, showing the thought experiment was sound but the model false, a distinction Platonists obscure. **The Firewall** argument tests D5, requiring an account to explain which of the three inconsistent principles must be discarded based on the stability of the imagined scenario.
