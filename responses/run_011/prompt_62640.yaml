answer: |-
  ### The Spec: Requirements for a Pseudohistory Test

  **Non-Negotiable Requirements**

  1.  **Immunization Against Revision (The Atlantis Constraint)**
      *   *Requirement:* The criterion must detect when a conclusion is treated as fixed and evidence is moved to fit it, rather than the conclusion shifting to fit evidence.
      *   *Consideration:* A bare claim ("civilization collapsed") is empirical. Pseudohistory is the *practice* of relocating the site every time a survey comes up empty. The test must flag the *movement of the goalposts*, not the improbability of the claim.
  2.  **Asymmetry of Scrutiny (The Fomenko Constraint)**
      *   *Requirement:* The criterion must identify when supporting evidence is accepted uncritically while contradictory evidence is subjected to impossible standards of proof.
      *   *Consideration:* Fomenko used statistics (testable) but ignored the failures. Ordinary history applies equal skepticism to all sources. The test cannot rely on "is it testable?" but on "are the test results binding?"
  3.  **Provisionality of Inference (The Thin Record Constraint)**
      *   *Requirement:* The criterion must distinguish between *abductive uncertainty* ("this motive is plausible given the gap") and *narrative certainty* ("this motive explains the gap").
      *   *Consideration:* Historians work with thin evidence. Pseudohistorians fill gaps with concrete detail unsupported by the record. The defect is the *confidence level*, not the lack of data.

  **"Taste" Disguised as Standard (Negotiable/Contextual)**

  1.  **Mechanism Requirement**
      *   *Status:* **Taste.**
      *   *Consideration:* Demanding a physical mechanism for historical claims often imports physics standards into human events. It filters out some crankery but also risks filtering out valid social theories that lack "hard" causality.
  2.  **Peer-Review Shield**
      *   *Status:* **Taste.**
      *   *Consideration:* The Airburst paper proves peer review is a snapshot, not a seal. Relying on it classifies retracted errors as history and pre-print breakthroughs as pseudo. It measures institutional status, not epistemic quality.
  3.  **Consensus Alignment**
      *   *Status:* **Taste.**
      *   *Consideration:* Using "what experts say" as the metric solves nothing; it just outsources the test. It fails the Vinland/Schliemann test, where the consensus was wrong for decades.

  ***

  ### The Trilemma: Which Two to Keep?

  **I would keep:**
  1.  **A rule a smart non-specialist can apply.**
  2.  **A rule that isn't just whatever the experts currently say.**

  **I would sacrifice:**
  3.  **A rule that doesn't retroactively stamp the Vinland vindication as pseudohistory.**

  **Why:**
  You cannot distinguish a "Vinland" from an "Atlantis" *before the digging is done*. At the moment of submission, a claim based on saga literalism *is* methodologically pseudohistorical, even if it turns out to be geographically correct later. If you design the test to protect Vinland *ex ante*, you must accept oral tradition as equal to stratigraphy, which breaks the discipline. Your panel is triaging *methodological risk*, not predicting *ultimate truth*. It is acceptable to reject a true claim if the method used to support it is unsound; Schliemann was right about Troy but his methods *were* destructive and overclaimed. The test should catch the method, not bless the luck.

  ***

  ### The Single Requirement That Knocks Out Existing Criteria

  **Immunization Against Revision (Immunity to Falsification).**

  This requirement does the most work because it invalidates the "Falsifiability" standard (Fomenko was falsifiable but ignored the falsification) and the "Peer Review" standard (the Airburst paper was reviewed but the authors resisted the eventual counter-evidence until retraction). It targets the *behavior* of the researcher when confronted with negative data, which is the only stable differentiator between a wrong historian and a pseudohistorian.

  ***

  ### Evaluation of Three Common Moves

  **1. The Falsifiability Move**
  Fails on Fomenko (his chronology was tested and failed, yet persisted) and Ordinary History (abductive inference about motives is rarely strictly falsifiable in a lab sense). It filters out bad science but misses bad history that mimics scientific formatting.

  **2. The Degenerating Research Programme Move (Lakatos)**
  Excellent on Atlantis (constant ad hoc adjustments to save the core), but fails the "one-page/non-specialist" constraint. It requires tracking the history of the field's modifications over time, which a panel cannot do on a single submission.

  **3. The Sociological Move (Refusal to Engage Community)**
  Strong on Fomenko (ignored critiques) and Atlantis (publishes in own journals), but fails Vinland (experts initially refused to engage the Ingstads) and Airburst (authors engaged the community, were wrong, then retracted). It punishes outsiders rather than bad methods.
