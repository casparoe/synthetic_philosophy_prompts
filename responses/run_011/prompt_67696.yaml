  2.  **Deconstruct the Four Required Themes:**

      *   **Question 1: Attribution (Causality vs. Selection).**
          *   *Core Issue:* Did humane prisons cause low recidivism, or did a low-recidivism society build humane prisons? (The friend's argument).
          *   *Goal:* Isolate the variable. What observation distinguishes the two?
          *   *Drafting:* Need to ask for a counterfactual or a specific metric that isolates the prison effect from the social welfare effect.
          *   *Likely Answer:* It's synergistic; the prison reinforces the social contract.
          *   *Follow-up:* If it's synergistic, can you export the prison without the welfare state? If not, is the design actually the active ingredient or just decoration?

      *   **Question 2: Scale/Arithmetic (The 250-bed issue).**
          *   *Core Issue:* How does one flagship facility (Halden) impact national statistics?
          *   *Goal:* Challenge the magnitude of the effect.
          *   *Drafting:* Ask about the marginal impact of Halden specifically on the national rate given its small capacity relative to the total prison population.
          *   *Likely Answer:* It's a model/seeding effect; it changes staff culture across the system, not just inmate outcomes.
          *   *Follow-up:* If the impact is cultural diffusion rather than direct inmate rehabilitation, isn't the architectural design secondary to staff training? Why spend millions on architecture if the mechanism is HR policy?

      *   **Question 3: Proportionality (The "Never Changes" Prisoner).**
          *   *Core Issue:* If release depends on "demonstrated change" (rehabilitation), what happens to those who don't change? Does this violate proportionality (punishment fitting the crime)?
          *   *Goal:* Expose the potential for indefinite detention disguised as treatment.
          *   *Drafting:* Ask about the prisoner who refuses or fails to rehabilitate. Do they serve longer than a retributive sentence would dictate?
          *   *Likely Answer:* The system is designed to facilitate change, so refusal is rare; dynamic security prevents this.
          *   *Follow-up:* But if they *do* refuse, are they held past the tariff? If yes, isn't rehabilitation potentially more punitive than retribution because the release date is indeterminate?

      *   **Question 4: Coercion (Treatment as Precondition).**
          *   *Core Issue:* Is "treatment" voluntary if liberty depends on it?
