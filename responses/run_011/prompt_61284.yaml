answer: |-
  # The "Where Do You Actually Land?" Instrument

  **Instructions:** Read each scenario. Pick the option that matches your gut reaction. Do not overthink the theory; choose what feels like the right thing to do.

  ### Part I: Harm & Confinement

  **1. The Reformed Robber**
  A man has served ten years for an armed robbery committed at age 20. He is now 30. Psychologists and parole boards agree he is no longer a danger to anyone and has not broken a rule in eight years.
  *   **A.** Release him immediately. Keeping him adds no safety.
  *   **B.** Make him serve the full original term. The harm he caused requires a completed payback.
  *   **C.** Release him, but only after the state provides him with housing and a job guarantee.

  **2. The Brain Tumor**
  A man attacked a stranger. Scans show a growing brain tumor caused the violence. The tumor can be removed, but doctors say his impulse control will remain damaged, and he is likely to attack again if released.
  *   **A.** Confine him in a medical facility, not a prison, for as long as the risk remains.
  *   **B.** Release him. He didn't choose this; confinement is unjust.
  *   **C.** Sentence him to prison. The victim's safety matters more than the cause of the violence.

  **3. The Unequal Starting Line**
  Two people steal the same amount of money. One grew up in a wealthy district with good schools; the other grew up in a neighborhood where the state failed to provide basic services or jobs.
  *   **A.** They get the same consequence. The law must treat the act, not the history.
  *   **B.** The person from the neglected neighborhood gets a lighter consequence.
  *   **C.** Neither should be confined until the state guarantees both neighborhoods equal resources.

  **4. The Secret Crime**
  A person commits a serious fraud that no one else saw, and no one will ever copy. There is no risk of others doing it.
  *   **A.** Still impose a penalty. The act itself demands a response.
  *   **B.** No penalty needed. If it stops no one else, suffering is wasted.
  *   **C.** Require repayment to the victim, but no state penalty.

  **5. The Failed Attempt**
  Person A tries to kill someone but misses. Person B accidentally kills someone while driving carefully.
  *   **A.** Person A gets a heavier penalty. The intent was worse.
  *   **B.** Person B gets a heavier penalty. The harm done was worse.
  *   **C.** Both get the same penalty. The risk created was similar.

  **6. The Victim's Wish**
  A victim of assault says they will only feel safe if the attacker suffers physically.
  *   **A.** The state should not inflict suffering just to satisfy that wish.
  *   **B.** The state should acknowledge the victim's need for the attacker to face hard consequences.
  *   **C.** The attacker should meet the victim and agree on repair, without state-imposed suffering.

  **7. The Dangerous Repeat Offender**
  A person has committed three non-violent property crimes. They are not dangerous, but they keep offending.
  *   **A.** Lock them up to stop the cycle.
  *   **B.** Do not lock them up. Property loss is not worth a person's liberty.
  *   **C.** Lock them up, but only for a short time proportional to the last act, not the history.

  ### Part II: Praise & Reward

  **8. The Surgeon**
  A surgeon saves a child's life through high-skill intervention.
  *   **A.** She gets a large bonus. She earned it through her choices.
  *   **B.** She gets standard pay. She was lucky to have the training and talent.
  *   **C.** She gets public recognition, but the money goes to the hospital system.

  **9. The Tech Founder**
  A founder becomes a billionaire building a popular app.
  *   **A.** It is their money. They built it.
  *   **B.** It is society's money. They used public infrastructure and laws to get rich.
  *   **C.** They keep the money, but owe a high tax rate to maintain the system that allowed it.

  **10. The Kid Who Made It**
  A young person escapes a violent neighborhood and becomes a community leader.
  *   **A.** They are a hero. They overcame the odds.
  *   **B.** They are lucky. Others just as good didn't make it.
  *   **C.** They are a hero, but the focus should be on fixing the neighborhood so luck isn't required.

  ---

  ### Scoring Key: The Leaves

  Count your answers. Do not look at the names until you have tallied.

  **Mostly A (Part I) + Mostly A (Part II): The Fairness Keeper (Compatibilist)**
  *   **View:** People make choices that matter. Consequences should fit the choice, and rewards should fit the effort.
  *   **Philosophical Home:** Daniel Dennett / Standard Compatibilism.
  *   **Awkward Commitment:** You must explain why a choice is "free enough" to warrant suffering even if biology and environment heavily pushed the person toward it.

  **Mostly A (Part I) + Mostly B (Part II): The Manager (Status Quo Pragmatist)**
  *   **View:** Dangerous people must be contained, but success is mostly luck.
  *   **Philosophical Home:** Incoherent Pragmatism.
  *   **Awkward Commitment:** You treat criminals as agents when punishing them but as victims of circumstance when denying elites their merit.

  **Mostly B (Part I) + Mostly A (Part II): The Merciful Meritocrat (Empty Cell)**
  *   **View:** People earn their rewards, but criminals deserve mercy.
  *   **Philosophical Home:** Rare / Unstable.
  *   **Awkward Commitment:** If people truly earn their success through choice, you must explain why you refuse to hold them accountable for harmful choices.

  **Mostly B (Part I) + Mostly B (Part II): The Public Health Officer (Quarantine Skeptic)**
  *   **View:** No one is ultimately the author of their actions. We restrain danger like a virus; we reward success as a policy tool, not a moral truth.
  *   **Philosophical Home:** Gregg Caruso / Derk Pereboom (Free Will Skepticism).
  *   **Awkward Commitment:** You must justify locking up a person who is not morally at fault, treating them like a carrier of a disease.

  **Mostly C (Part I) + Mostly C (Part II): The Social Architect (Pereboom Distinction)**
  *   **View:** Confinement is only legitimate if the state first guarantees a decent social baseline. Rewards are systemic, not individual.
  *   **Philosophical Home:** Derk Pereboom (Specific Social Baseline Condition).
  *   **Awkward Commitment:** You must argue that *no* confinement is legitimate right now, because no modern state has fully met its social obligations.

  **Mixed A/B on Part I + Mostly A on Part II: The Messenger (Expressivist)**
  *   **View:** Sentences are moral statements. The penalty must match the wrong to condemn it properly.
  *   **Philosophical Home:** R.A. Duff / Censure Theory.
  *   **Awkward Commitment:** You must justify spending resources on "sending a message" even when it does not improve safety or repair harm.

  **Mixed on Part I (Safety focused) + Mixed on Part II: The Price Setter (Pure Deterrence)**
  *   **View:** Penalties are just costs to adjust behavior. Rewards are incentives. Nothing is "owed."
  *   **Philosophical Home:** Economic Analysis of Law / Pure Utilitarianism.
  *   **Awkward Commitment:** You must admit you would punish an innocent person if doing so reliably prevented more future harm.

  **Mostly "Release/Repair" on Part I: The Peacekeeper (Flat Abolition)**
  *   **View:** State-imposed suffering is never legitimate. Only separation for immediate safety and civil repair are allowed.
  *   **Philosophical Home:** Restorative Justice / Abolitionism.
  *   **Awkward Commitment:** You must explain what to do when a violent person refuses therapy, compensation, or voluntary separation.

  ---

  ### Cross-Tab Analysis: Blame vs. Praise

  You hypothesized that **"Harsh on criminals, no such thing as a self-made success"** is a big cluster, and **"Lenient on criminals, big believer in merit"** is nearly empty.

  **The Verdict:** Your bet is half-right, but the *reasons* matter.

  1.  **The "Harsh / No Merit" Cluster (The Manager):** This is indeed crowded. It is the default stance of the modern administrative state. It treats crime as a management problem (contain the risk) and success as a systemic output (tax the rich).
      *   *Coherence:* **Low.** It relies on a hidden switch: when the state harms you, you are a product of circumstances (no merit); when the state restricts you, you are a risk object (no moral agency required). It avoids the hard question of *why* we lock people up if they aren't authors of their acts.

  2.  **The "Lenient / High Merit" Cluster (The Merciful Meritocrat):** This cell is **not empty**, but it is unstable. It is populated by religious or humanistic compatibilists who believe in free will but prioritize forgiveness.
      *   *Coherence:* **High, but costly.** It is logically consistent to believe people choose evil but choose to forgive them. However, it is politically fragile because it looks like "soft on crime" to the "Manager" cluster.

  3.  **The Truly Empty Cell:** **"Harsh on Criminals (for Desert) / No Merit."**
      *   *Why:* You cannot claim a person *deserves* suffering (Desert) while simultaneously claiming they are not the author of their success or actions (No Merit). This is the incoherent core of many punitive systems that claim to be "tough on crime" while acknowledging systemic poverty.

  ---

  ### Limitations & Blind Spots

  **1. Caruso vs. Pereboom (The Social Baseline)**
  *   **Can the quiz separate them?** Barely. Question 3 is the only splitter.
  *   **Why:** Both view confinement as quarantine. The difference is a *precondition* for legitimacy (Pereboom) vs. a *manner* of confinement (Caruso).
  *   **Fix:** To truly separate them, you would need a question asking: *"If the state cannot fix the neighborhood today, must it release the dangerous prisoner?"* Pereboom says Yes; Caruso says No (containment remains necessary).

  **2. Negative Retributivism vs. Expressivism**
  *   **Can the quiz separate them?** No.
  *   **Why:** Both result in proportional sentencing. Negative Retributivism says "Don't exceed the desert limit." Expressivism says "Match the desert amount." In practice, both look like "punish fittingly."
  *   **Fix:** You would need a case where utility demands *less* than desert. Negative Retributivists allow leniency; Expressivists often demand the censure be delivered regardless of cost.

  **3. Pure Deterrence vs. Quarantine**
  *   **Can the quiz separate them?** No.
  *   **Why:** Both are forward-looking. If a person is dangerous, both lock them up. If a penalty stops crime, both impose it.
  *   **Fix:** You would need a case involving a *non-dangerous* person who could be deterred. Quarantine releases them; Deterrence might still punish them to set an example.

  **4. The "Empty" Cell Diagnosis**
  *   **Cell:** High Merit (Praise) + Quarantine (Blame).
  *   **Status:** **Incoherent.**
  *   **Why:** If the surgeon *earned* her bonus through free choice, the criminal *earned* his penalty through free choice. You cannot claim the mechanism of agency works for wealth but breaks for crime. This position is usually held by people who haven't noticed the contradiction.

  **5. The "Crowded" Cell Diagnosis**
  *   **Cell:** Low Merit (Praise) + Quarantine (Blame).
  *   **Status:** **Stable but Dark.**
  *   **Why:** This is the "Dangerous Class" view. It is coherent (nobody is free, some are dangerous) but morally expensive because it treats human beings as objects to be managed rather than agents to be addressed.
