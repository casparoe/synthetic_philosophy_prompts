answer: |-
  **The Scenario**

  Elias has spent twenty years advocating for voluntary simplicity, arguing publicly that unearned wealth corrodes character. He lives ascetically, owning nothing he cannot carry. His uncle dies, leaving him a substantial estate. Legally, he may keep it. He transfers the funds to a trust, maintaining his lifestyle exactly as before. No one knows the money exists; he tells no one, files no public record requiring attention. Alone, he attempts to feel gratitude for the security the money provides, intending to honour his uncle. He finds he feels nothing but a dull relief that he need not work. He realizes his austerity was never a discipline, but an incapacity for engagement with the world. He has violated no duty, harmed no one, and broken no rule. The work is done. The funds are secured. He sits in the dark, untouched by any observer, and feels himself diminish.

  **Demonstration of Specifications**

  (a) The setting is contemporary and domestic; Elias is a private citizen managing an inheritance. (b) The scenario is a single paragraph of ordinary circumstances. (c) There is no wrong: Elias breaches no obligation. He is entitled to the money; he harms no beneficiary; his conduct is legally and morally permissible, even admirable by external standards. (d) There is no audience. Elias is alone; the facts are secret. Crucially, the shame is not an internalised gaze. He does not judge himself as a spectator would; rather, the realization of his incapacity *is* the shame. There is no mirror, no deity, no imagined other. (e) The shame concerns neither status nor aesthetics. It is not about taste in living, nor reputation, nor competence in management. It concerns his moral constitution. (f) The verdict favours shame. Guilt requires an object—a wrong done, a debt owed. There is no victim, no rule broken, hence no debt to repair. Guilt would mislocate the matter as a transgression. Shame accurately targets the agent's being: he is not who he claimed to be. The apt response is not confession, but a recognition of diminished stature.

  **Diagnostic Test**

  To distinguish the emotion here, we look to characteristic desires. Guilt prompts a desire to confess, repair, or be punished—to restore a balance disturbed by wrongdoing. Elias has nothing to confess; no balance is disturbed. Shame prompts a desire to disappear, to hide, or to remake the self entirely. Elias 'feels himself diminish'; he wishes to shrink from view, not because he is seen, but because he occupies more space than his substance warrants. If he felt guilt, he would seek to donate the money to absolve a debt. He does not. He wishes he were the sort of person who could feel gratitude. This desire for self-transformation, rather than reparation, marks the emotion as shame.

  **The Single Feature and Three Removals**

  The feature doing the work is the *contingency of virtue*. Elias's goodness depended on necessity, not choice.

  1.  **Introduce a witness:** If a friend discovers the inheritance and Elias's relief, the shame collapses into embarrassment or social shame. The focus shifts to how he appears to the friend, violating (d).
  2.  **Introduce a victim:** If Elias kept money owed to a sibling, the shame collapses into guilt. There is now a debt, a wrong, and a specific object for reparative action, violating (c) and (f).
  3.  **Make conduct a violation:** If Elias broke a promise to his uncle to refuse the money, the shame collapses into guilt over transgression. The emotion would demand confession, not self-diminution.

  In all three removals, the unique moral information of shame—that the self is smaller than believed—is lost to the dynamics of social judgment or debt.

  **Two Strongest Attacks**

  First, a Kantian might argue this is merely guilt about a maxim. They would claim Elias has a duty to cultivate genuine virtue, and his failure to do so is a breach of duty to himself. This can be met by repair: duties of virtue concern actions and ends, not involuntary feelings. One cannot be guilty for failing to feel gratitude, only for failing to act. Since Elias acted correctly, guilt has no foothold.

  Second, a reductionist might argue this is self-disgust, an aesthetic reaction to one's own limitations, not a moral emotion. This can be met by repair: the limitation is not physical or aesthetic, but concerns the moral identity Elias publicly championed. The shame is moral because it concerns the integrity of his ethical stance, not his taste or body.

  **Honest Assessment**

  Is the brief satisfiable? Specification (d) is the critical pressure point. Traditional accounts often define shame as essentially social, requiring an observer. If shame is defined strictly as the pain of being seen, (d) is unmeetable. However, if shame is understood as the pain of falling short of one's own ideal self, independent of a spectator, (d) is satisfiable.

  I judge the brief satisfiable, but at a cost. To maintain (d), we must sever the link between shame and honour cultures entirely. We must argue that shame is the emotion of self-evaluation, not social evaluation. If this proves untenable, the weakest weakening of (d) is to allow an 'ideal observer' within the agent—a internalized standard of who one ought to be. This costs the argument its radical edge: it concedes that shame requires a 'gaze', merely relocating it inside the head. This would weaken the claim that shame offers a category of self-knowledge distinct from the internalized social law which guilt represents. To defend the strong claim, one must insist that the self can confront its own limits without becoming its own spectator. The case above attempts this by making the shame a direct response to a fact about the self (incapacity), rather than a view of the self. Whether this distinction holds is the crux of the chapter.
