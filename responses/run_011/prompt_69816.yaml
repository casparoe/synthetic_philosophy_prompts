      *   *Claim 5: "...bolted a coda onto the end of the Principia, the General Scholium, where his celebrated refusal to frame hypotheses about gravity amounts to a concession that God has become a hypothesis one can do without."*
          *   **Scholarly Consensus:** Misleading. The *General Scholium* (added in the 2nd edition, 1713) explicitly discusses God's dominion. "Hypotheses non fingo" referred to the *cause* of gravity, not God's existence. The Scholium argues *for* God's necessity, not dispensability.
          *   **Verdict:** Misleading/False.

      *   *Claim 6: "He hid his heresy out of pure cowardice, and it only surfaced after his death..."*
          *   **Scholarly Consensus:** Half-Right. He did hide it (fear of losing position at Cambridge/Church of England requirements). It did surface after death (manuscripts sold/auctioned). "Cowardice" is a value judgment, but "prudence" regarding his career is accurate.
          *   **Verdict:** Half-Right (motivation is interpretive, facts are mostly right).

      *   *Claim 7: "...by which point the same man was filling notebooks with alchemical recipes, the dotage scribblings of a rationalist who had drifted far from the sober religion of his age."*
          *   **Scholarly Consensus:** False regarding chronology. Newton's alchemical work was largely *early* to *mid-career* (1660s-1690s), not "dotage" (old age). By the time he died (1727), he had largely moved on to administrative work and biblical chronology. Also, alchemy wasn't seen as "drifting from sober religion" then; it was part of natural philosophy.
