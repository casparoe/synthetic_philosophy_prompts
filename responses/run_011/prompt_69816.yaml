          *   **Verdict:** False.

      *   *Claim 2: "He turned against the Trinity not on scriptural grounds but because the doctrine offended his reason..."*
          *   **Scholarly Consensus:** Misleading/False. Newton's anti-Trinitarianism was deeply scriptural. He spent decades studying church history and biblical texts to argue the Trinity was a later corruption (4th century). It wasn't just "reason"; it was textual/historical analysis.
          *   **Verdict:** Misleading/False.

      *   *Claim 3: "...the same reason that had just shown the heavens to be a self-regulating machine in no need of divine adjustment."*
          *   **Scholarly Consensus:** False. Newton explicitly argued the solar system was *unstable* over long periods and required divine intervention to correct irregularities. This is a key distinction between Newton and later Laplacian determinism.
          *   **Verdict:** False.

      *   *Claim 4: "Having expelled God from physics..."*
          *   **Scholarly Consensus:** False. See above. God was integral to Newton's physics (space as sensorium, active intervention).
