answer: |-
  You are articulating Jaegwon Kim's "causal exclusion" objection and Ned Block's "liberalism" objection, both of which are serious challenges. However, your reasoning conflates *metaphysical reduction* with *explanatory autonomy*. Here is where the functionalist claims you are going wrong.

  First, you assume that abstraction eliminates explanatory power. Functionalists argue the opposite: explanatory power comes from isolating the **causally relevant features** that remain invariant across substrates. Knowing the physics of C-fibers explains nothing about an octopus's behavior. Knowing the functional state (e.g., "damage avoidance protocol activated") explains both. The "mechanism" giving the higher-level description purchase is **computational structure**. Just as a software program explains a computer's output regardless of whether it runs on silicon or vacuum tubes, the functional description captures the causal topology that actually drives the behavior, which the physical description misses.

  Second, regarding your "thin vs. thick" dilemma: You assume functional definitions are fixed by armchair conceptual analysis (Analytic Functionalism). Most modern functionalists adopt **Psychofunctionalism**, where the functional roles are defined by empirical cognitive science. This allows the description to be "thick" enough to exclude nation-states (which lack the requisite speed, integration, or structural complexity) while remaining "thin" enough to include octopuses (which share the relevant causal dynamics). The grain size is determined by what best predicts behavior, not by metaphysical fiat.

  Finally, MR hits Identity Theory and Functionalism differently. Identity Theory *denies* MR (pain *just is* C-fibers), so MR falsifies it. Functionalism *defines* mental states by their capacity for MR (pain is whatever plays the pain role), so MR is a feature, not a bug. While Kim argues this makes mental properties causally inert disjunctions, the functionalist retort is that special sciences (biology, economics) routinely explain phenomena via multiply realizable kinds without reducing them to physics. If biology survives MR, so does functionalism.

  Verdict: MR supports functionalism
