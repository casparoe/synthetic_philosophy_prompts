answer: |-
  This is a sharp angle. Your lawyer friend has identified a structural analogy that cuts through the usual "autonomy vs. efficiency" debate. The hearsay rule isn't just about lying; it's about the *architecture of accountability*.

  Here is a breakdown of how the hearsay framing maps onto the moral testimony debate, where it breaks down, and the honest state of the philosophical field.

  ### 1. The Hearsay Lens: Pessimism vs. Optimism

  Your friend's analogy reframes the debate from *content* (is the moral belief true?) to *process* (is the belief admissible?).

  **The Pessimist as a Hearsay Objector**
  In the hearsay framing, the Pessimist is arguing that moral testimony is *inadmissible evidence* for moral action.
  *   **The Core Worry:** In law, hearsay is excluded because the declarant isn't under oath, isn't visible to the jury, and can't be cross-examined. The Pessimist argues that moral reasons work the same way. If you act on a moral belief you got from someone else (or an LLM), you are acting on a "statement" where the "declarant" (the reason-giver) is absent from your deliberation.
  *   **The Fit:** This captures the Pessimist's epistemic worry perfectly. They argue you cannot verify the *weight* of a moral reason second-hand. You need to see the "declarant" (the reasoning process) in the light of your own understanding to know if it applies *here*.
  *   **The Mismatch:** The hearsay rule is purely epistemic/procedural. It cares about reliability. The Pessimist often cares about *moral worth*. A jury can convict on admissible hearsay without being "bad jurors." But a Pessimist says an agent acting on moral deference is a "defective moral agent," even if they act correctly. The hearsay rule doesn't have a concept of "virtue"; it only has "admissibility."

  **The Optimist as a Proponent of Exceptions**
  The Optimist (who says there's nothing special about moral testimony) argues that moral claims should be treated like "business records" or "expert testimony."
  *   **The Core Worry:** We defer to cardiologists on heart surgery and historians on the Irish famine without re-deriving their data. Why is morality different?
  *   **The Fit:** This aligns with the *exceptions* to the hearsay rule. The law admits out-of-court statements if the circumstances guarantee reliability (e.g., a dying declaration, a routine business log). The Optimist argues that moral testimony comes with sufficient guarantees (the informant is virtuous, the community agrees, etc.) that cross-examination isn't needed.
  *   **The Mismatch:** The Optimist often underestimates the *constitutive* role of reasoning. In law, the jury's job is to find truth. In ethics, the agent's job is arguably to *embody* the truth. The hearsay exception allows you to accept the *fact*; it doesn't necessarily allow you to outsource the *judgment*.

  ### 2. Does the Hearsay Framing Capture the "Moral Worth" Worry?

  **Short answer:** No, it changes the subject, but in a useful way.

  The Pessimist's strongest claim is about **moral agency**, not just accuracy. They argue that acting on a moral belief requires *grasping the reasons* for yourself to count as a moral action. If you do the right thing only because an authority told you to, you are akin to a well-trained dog, not a moral agent. You get no "moral credit."

  The hearsay rule doesn't care about the jury's moral credit. It cares about the *defendant's rights*.

  **However,** for your story about an ethics committee, the hearsay framing is actually *more* relevant than the moral worth framing.
  *   **Why?** An ethics committee isn't just trying to be virtuous; it is issuing a ruling that affects patient care, liability, and policy. They are a "factfinder."
  *   **The LLM Problem:** An LLM is the ultimate hearsay declarant. It cannot be cross-examined. It has no "interest against interest" (it doesn't care if it's wrong). It produces a "statement" (the reasoning) without a "declarant" who can take responsibility.
  *   **The "Light Editing" Exception:** The hospital is hoping that "light editing" counts as a hearsay exception—essentially arguing that by tweaking the text, the committee members have adopted the statement as their own (making it no longer hearsay). The Pessimist would say this is insufficient; the *generation* of the reasoning was outsourced, so the "cross-examination" of the logic never happened.

  ### 3. Are There "Moral Hearsay Exceptions"?

  If we accept the analogy, can we define conditions where moral deference is "admissible"? Philosophers who try to split the difference (often called "Moderate Pessimists" or "Contextualists") suggest markers that function like hearsay exceptions:

  1.  **Transparency (The "Business Record" Exception):** You can defer if the reasoning is fully transparent and reconstructible. If the LLM gives the answer *and* the chain of logic, and the committee verifies the logic, they are "cross-examining" the output. If the LLM is a black box, it's inadmissible.
  2.  **Emergency (The "Exigent Circumstances" Exception):** In triage or immediate crisis, there is no time for first-hand reasoning. Deference to protocol or senior judgment is admissible because the cost of deliberation is too high.
  3.  **Non-Core Morality (The "Collateral Matter" Exception):** You might be allowed to defer on administrative ethics (scheduling fairness, resource allocation formulas) but not on core moral status (end-of-life decisions, bodily autonomy). The "hearsay" is admissible for procedural facts, not substantive rights.
  4.  **Accountability (The "Declarant Available" Exception):** You can defer to a human expert because you can blame them later if they were negligent. You cannot defer to an LLM because you cannot blame it. This suggests **human-in-the-loop** isn't enough; the human must be the *author*, not just the editor.

  ### 4. The State of the Field: Consensus vs. Stalemate

  You asked for the honest answer without a fake consensus. Here is the landscape as it stands in contemporary meta-ethics and epistemology:

  **What is Close to Consensus (Epistemic Optimism):**
  *   **Agreement:** Almost no one argues that you *cannot know* moral truths via testimony. If a trusted mentor tells you "what you did was wrong," and they are reliable, you *know* it was wrong.
  *   **Status:** Settled. The "Epistemic Pessimist" (who says you can't even *know* via testimony) is a fringe position.

  **What is Contested (Moral Pessimism):**
  *   **The Fight:** The debate is about **Moral Understanding** and **Moral Worth**. Can you have *moral understanding* via testimony? Can you be *praiseworthy* for acting on testimony?
  *   **Camp A (The Pessimists):** Argue that while you can *know* the truth, you cannot have *moral understanding* or *moral worth* without grasping the reasons yourself. (Key names: Sarah McGrath, David Enoch).
  *   **Camp B (The Optimists/Normalists):** Argue that moral understanding is not special. If you trust the source, you understand the reason *by* trusting the source. Demanding more is "hyper-individualist." (Key names: Paulina Sliwa, Elizabeth Fricker).
  *   **Status:** **Genuine Stalemate.** Neither side has knocked the other out. The Pessimists have the stronger intuition pump regarding "moral credit" (we don't praise people for blindly following rules). The Optimists have the stronger epistemic argument (we defer on everything else, why not this?).

  **How to Report This:**
  Do not write that "Philosophers argue whether we can learn ethics from others." That implies the epistemic question is open.
  *   **Write this:** "Philosophers generally agree we can *learn* moral truths from others. The fierce disagreement is about whether acting on that second-hand knowledge makes you a *moral agent* or merely a compliant one."

  ### 5. Application to Your Story

  The hearsay analogy gives you a vocabulary for the hospital's silence.

  *   **The "Why":** The hospital won't admit to using the LLM for reasoning because they know it violates the "hearsay rule" of moral accountability. If they admit the reasoning is generated, they admit the "declarant" is unavailable for cross-examination.
  *   **The "Vote":** They keep the human vote because that is the "jury verdict." They know the verdict must come from the agents, even if they are cheating on the deliberation.
  *   **The "Light Editing":** This is their attempt to claim a hearsay exception. They are arguing that by editing, they made it their own. The Pessimist (and the hearsay analogy) suggests that if the *structure* of the argument is AI-generated, editing the prose doesn't make you the author of the logic.

  **The "Shrug" for your Editor:**
  If you need a definitive line on the philosophy: "There is no consensus on whether moral deference robs an agent of moral worth. It is a live stalemate between those who prioritize moral autonomy and those who prioritize epistemic efficiency. However, there is near-universal agreement that *understanding* the reasons is distinct from merely *knowing* the conclusion—and that is exactly what the LLM threatens to sever."

  This framing allows you to use the philosophy without taking a side, while highlighting why the hospital's specific behavior (hiding the tool) suggests *they* know which side of the ethical line they are toeing.
