      *   *Reasonable Rejection:* Veto power based on generic reasons $\rightarrow$ Not exactly a preference, more like a constraint on the feasible set of rules.
      *   *Complaints:* Burdens imposed by a principle $\rightarrow$ Individual cost functions (but not necessarily utility).
      *   *Pairwise Comparison:* Comparing the strongest complaint in World A vs. strongest in World B $\rightarrow$ Not summation.
