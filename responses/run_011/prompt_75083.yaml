  5.  **Conclusion:** Substantive dispute or Archimedean renaming?

  (One more check on the "Archimedean" point): The user asks if the colleague just rediscovered the Archimedean property. The answer is: Yes, formally, but No, normatively. The *reason* for rejecting continuity is different. One is a mathematical property of the ordering; the other is a moral requirement of justifiability. This distinction matters for *which* non-Archimedean function you choose.

