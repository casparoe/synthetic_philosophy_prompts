      *   *Chisholm/Problem of the Many:* User suspects filler. They are right. Cut it.
      *   *Friend's Objection:* *De re* modality vs. Counterfactual Conditionals.
          *   *Critique:* This is a crucial distinction. Lewis analyzes *de re* modality *via* counterparts, which looks like counterfactuals. The user's "agential" move might just be shifting to standard Stalnaker/Lewis counterfactuals without realizing it.

