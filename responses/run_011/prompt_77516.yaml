prompt: |-
  I'm in Year 13 and I've entered our school's philosophy essay prize — 2,000 words, due in a fortnight — with a draft on counterpart theory versus transworld identity. It's currently 3,400 words and, more worryingly, I think the middle of it might be wrong. My teacher's a chemist and my mates' reactions have been either "that's obviously true" or "who cares", neither of which helps much, so I'd like proper comments on the draft rather than a summary of the debate: I've read Lewis's paper and enough about Kripke's complaint to know the standard moves, and I don't need them replayed to me.

  Here's the shape of it. Intro, then a short section setting out the two pictures: on transworld identity one and the same individual is in lots of worlds, so when Humphrey might have won it's literally him winning somewhere; on counterpart theory he exists in one world only and the claim is about a sufficiently similar person elsewhere. Then the usual objections each way — the "it wasn't really Humphrey" complaint against Lewis, and against transworld identity the accidental intrinsics problem plus the charge that it needs bare thisnesses to glue an individual together across worlds. Then my own bit, which is what I actually want judged: a dilemma for counterpart theory. Either there are many counterpart relations and which one is in play is settled by context and what we happen to be attending to, in which case "Humphrey might have won" is made true partly by our conversational standards and not by anything about Humphrey; or you insist on one privileged counterpart relation, and if that relation is one-to-one and holds in virtue of the intrinsic nature of the things related, then it looks like it just is the cross-world identity relation the theory was invented to avoid. So counterpart theory either deflates de re modality into talk about us or collapses into its rival. My way out is a two-tier proposal: keep counterpart relations for origin and constitution claims (this desk might have been made of different wood, I might have been born without a spleen, I couldn't have had different parents), but use transworld identity for what I call agential counterfactuals — the "would have" claims we actually deploy to give credit and blame, like "if you'd been in that room you'd have said nothing". The thought is that those are meant to be about the person's real character, so letting them drift with conversational context means you end up blaming someone on the strength of a fact about your own standards. Then a long section on Chisholm's paradox and the problem of the many which I suspect is filler.

  Comments I'd be grateful for, and please be blunt and pick a side on each point rather than setting out options and leaving me to choose — that's the whole reason I'm asking. (1) Does the dilemma work? I can see a Lewisian saying the first horn is a feature and not a bug, so what I need to know is whether the second horn is a genuine collapse or just an insult: does a one-to-one privileged counterpart relation really deliver identity across worlds, or does it stay importantly different — fission, non-transitivity, overlap? (2) Is the two-tier view coherent or merely ad hoc? I can't work out what it says about mixed claims, e.g. "I might have been a twin, and had I been, I'd have been the bossy one", or "there's a world where I'm a monk who wouldn't have broken that promise" — which tier evaluates the sentence as a whole, and can the view give it a truth value at all? (3) Accuracy, since this is where I'm most likely to have gone wrong: I claim counterpart theory breaks the B axiom, on the grounds that I exist but it isn't necessary that possibly I exist, since there could be worlds where I have no counterparts whatsoever. I also want to say T goes, though I half-suspect Lewis builds in that a thing is a counterpart of itself in its own world, which would block that — tell me which it is and whether it matters. And I've hedged a claim about S4 (the counterpart relation isn't transitive, so □φ → □□φ should fail) because I couldnt construct an actual case: is the hedge right, or can it be done? Plus, is my gloss fair that transworld identity is committed to haecceities and that the accidental intrinsics argument is what shows it, or does that argument establish something weaker? (4) The thing my friend raised that I couldn't answer: am I just confusing counterfactual conditionals, which are about similarity between whole worlds, with de re modality, which is about an object possibly having a property? If the agential claims are really conditionals then its not solving anything and the hybrid should be cut — I'd rather be told that flatly than have it listed as a further option. (5) Is any of this interesting, or is it standard material in fancy packaging? And what do I cut to get from 3,400 words to 2,000 without gutting the argument? Where you're genuinely unsure of yourself, say so and say why, but on everything else I want a definite verdict with your reasons.
