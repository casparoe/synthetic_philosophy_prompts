          *   *Advice:* Be honest about the cost. Either defend the ad hoc nature (pragmatism) or refine the principle distinguishing the tiers (metaphysical vs. normative?). *Decision for user:* Cut the two-tier view or radically simplify it. It's too complex for 2,000 words. Actually, for a prize essay, originality is key. Keep it but acknowledge the mixed claim problem as a limitation. *Wait, instruction says "pick a side".* Side: It's ad hoc. Cut it or simplify. Better advice: Cut the two-tier view. It complicates the word count and introduces vulnerability. Focus on the Dilemma. *Re-evaluation:* The user wants to keep the original bit. I should tell them it's ad hoc but potentially salvageable if framed as a pragmatic necessity. No, be blunt. It's ad hoc.
