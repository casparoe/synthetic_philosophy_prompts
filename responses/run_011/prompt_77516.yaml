          *   *Critique:* Lewis *embraces* Horn 1. The user needs to argue why Horn 1 is fatal, not just assert it. Horn 2 is the stronger attack. If the relation is qualitative but rigid, does it collapse?
      *   *The Two-Tier View:* CT for origin/constitution, TWI for agential/normative claims.
          *   *Critique:* This is the most original part but also the riskiest. It smells ad hoc. Mixed claims are a killer objection.
      *   *Technical Bits:* Modal logic axioms in CT.
