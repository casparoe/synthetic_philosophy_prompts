answer: |-
  (a) **Question 2**

  **Time suggested:** 90 minutes
  **Word limit:** 1,500 words maximum

  Bernard Williams argues that an agent has a reason to $\Phi$ only if he could reach the conclusion to $\Phi$ "by a sound deliberative route from the motivations he already has." This thesis is intended to tether normative reasons to the agent's actual psychology while permitting criticism of that psychology through the concept of deliberative error.

  Consider the case of Elena. Elena works in a high-pressure logistics firm where algorithmic management dictates her schedule. For three years, she has endured chronic exhaustion and a narrowed informational environment; her employer's software filters job market data, presenting her current role as uniquely stable. When the idea of leaving occurs to her, she dismisses it as "irresponsible." She reports sincerely that she does not want to leave, sees nothing wrong with her current arrangement, and claims she would not want to leave even if she thought about it further. However, there is a clear sense in which she would come to want to leave were the distorting conditions (exhaustion, information control) lifted.

  Does Elena have an internal reason to leave her job? In answering, you must address the following tension: If "sound deliberation" is permitted to correct the motivational effects of exhaustion and manipulation, does the requirement collapse into an externalist view where reasons exist independently of the agent's actual set? If it is not permitted to correct these effects, can internalism underwrite the criticism that Elena is making a mistake?

  *Note: You will receive no credit for defining the distinction between internal and external reasons, the Humean theory of motivation, or the difference between normative and motivating reasons. Your answer must engage directly with the mechanics of the deliberative route and the specific details of Elena's case.*

  ***

  (b) **Model Answer**

  Elena does have an internal reason to leave her job, but defending this claim requires a precise calibration of what constitutes a "sound deliberative route." If we define the route too permissively, internalism dissolves into externalism; if too restrictively, it loses its critical bite. The solution lies in distinguishing between the *content* of the motivational set and the *procedural conditions* under which that set is accessed and processed.

  Williams's internalism requires a link between reasons and the agent's "subjective motivational set" ($S$). However, $S$ is not a static inventory of current urges; it includes dispositions, patterns of emotional reaction, and loyalties. Crucially, the route from $S$ to a reason can involve correcting false beliefs and exercising imagination. In Elena's case, her assertion that she "would not want to leave even if she thought about it further" is suspect because her capacity to think further is structurally impaired. The exhaustion and information control do not merely add new desires; they inhibit the deliberative process itself. Therefore, an internalist can argue that the "sound deliberative route" includes the removal of impediments to deliberation, such as fatigue and coercive misinformation, without appealing to a fully idealized self.

  The central dilemma is whether this correction mechanism allows *any* motivation to be revised. If a sound route can discard any element of $S$ that results from distortion, then almost any conclusion can be reached from almost any set, rendering the internalist constraint vacuous. To avoid this, we must draw a principled line between distortions that block deliberation and preferences that are simply unpopular or unconventional. The line cannot be drawn merely by observing that a preference changes under better conditions, as "distortion" is itself a normative notion. We cannot say a belief is false merely because it leads to a conclusion we dislike. Instead, the internalist must identify specific procedural failures. In Elena's case, the employer's filtering of job market data constitutes a factual error regarding the availability of alternatives. Correcting this is not imposing a new value but restoring the factual premises required for her existing values (e.g., security, well-being) to function.

  This leads to the problem of the direction of generation. On a permissive reading, the reason to leave seems generated not by Elena's actual motivations, but by the facts explaining why those motivations are distorted. If the reason exists because of the *facts of the manipulation* rather than the *motivations themselves*, we have conceded the externalist's point while retaining internalist vocabulary. To preserve internalism, we must argue that the reason is generated by the elements of $S$ that survive the distortion. Elena likely retains a deep-seated disposition toward self-preservation or flourishing. The distorting conditions suppress this disposition; they do not erase it. The reason is internal because it flows from this submerged disposition once the procedural blockages (exhaustion, lies) are removed. It is not a reason imposed from outside, but a reason uncovered from within by clearing the debris.

  Furthermore, we must distinguish the claim that Elena has a reason from the claim that she is blameworthy. Internalism is often thought to limit criticism: if she has no reason, she cannot be blamed. However, even if we concluded Elena had no internal reason (perhaps because her $S$ is thoroughly colonized by the employer), the internalist is not barred from criticizing her or blaming her. Williams suggests that the practice of blaming can itself furnish an agent with a reason. By blaming Elena for staying, we introduce a new social pressure that enters her $S$ (e.g., a desire to avoid censure), potentially creating a reason where none existed. Thus, the internalist can maintain that she is currently irrational without a reason, or that our criticism helps generate the reason.

  Finally, one might argue this case shows the debate is misframed. The disagreement may not be about the existence of reasons but about which description of the motivational set is relevant. Is $S$ the set of desires Elena *now* avows, or the set of dispositions she *would* avow under non-coercive conditions? If we treat the latter as the relevant $S$, the internal/external distinction blurs. However, the debate remains worth having because it forces us to specify the conditions of agency. Whether we call it an internal reason uncovered or an external reason applied, the substantive work lies in determining which psychological states count as the agent's own.

  In conclusion, Elena has an internal reason to leave because the distorting conditions constitute procedural errors in deliberation (false beliefs, inhibited imagination) rather than substantive differences in value. The internalist preserves the thesis by grounding the reason in her underlying dispositions toward well-being, which are obscured but not destroyed. This avoids collapsing into externalism because the authority of the reason still depends on its connection to her psychology, however submerged, rather than on mind-independent values.

  ***

  (c) **Marking Scheme**

  **Total Marks:** 30

  | Point | Marks | Description of Required Content | Mistake Forfeiting Marks |
  | :--- | :--- | :--- | :--- |
  | **1. The Deliberative Dilemma** | 5 | Explicitly articulates the tension: if deliberation corrects too much, internalism collapses; if too little, it cannot criticize impaired agents. | Treating the deliberative route as obviously capable of correcting all distortions without noting the collapse risk. |
  | **2. The Normativity of Distortion** | 5 | Identifies that "distortion" is a normative notion and attempts to set a principled line (e.g., procedural vs. substantive) rather than just asserting the verdict. | Defining distortion merely as "whatever leads to the wrong outcome" or failing to notice the circularity risk. |
  | **3. Direction of Generation** | 5 | Addresses whether the reason stems from the agent's motivations or the external facts explaining the distortion, and argues for the internalist preservation. | Asserting the reason exists without explaining how it remains grounded in the agent's $S$ rather than external facts. |
  | **4. Reasons vs. Blame** | 5 | Distinguishes between having a reason and being blameworthy; acknowledges that blame can create reasons or exist without them. | Assuming internalism forbids blame if no reason exists, or conflating the two concepts entirely. |
  | **5. Reframing the Debate** | 5 | Either argues the case is misframed (specifying where the real disagreement lies) OR defends the standard framing against this charge. | Dismissing the debate as verbal without specifying what the substantive disagreement would then amount to. |
  | **6. Case Application** | 5 | Applies the theoretical points specifically to Elena (exhaustion, algorithm, sincerity) rather than speaking only in abstractions. | Ignoring the specific details of Elena's case (e.g., the algorithmic filtering) in favor of generic examples. |

  ***

  (d) **Differentiation Guide**

  A **First-Class answer** will distinguish itself by grappling with the normativity of "distortion" (Point 2) without resorting to a "full information" criterion that surrenders to externalism. It will explicitly recognize that calling a desire "distorted" already assumes a normative standard, and will attempt to locate that standard in procedural rationality or historical conditions of autonomy without circularity. It will also handle the **Reasons vs. Blame** distinction (Point 4) with nuance, perhaps referencing the idea that blame is a tool to *bring* a reason into existence within the $S$ set, rather than merely reacting to one.

  A **Competent Second-Class answer** will correctly identify the dilemma (Point 1) and apply the theory to Elena (Point 6) but will likely rely on a "full information" or "idealized self" model to solve the distortion problem. This approach often inadvertently concedes the externalist point (failing Point 3) by making the reason depend on a counterfactual self that bears little relation to the actual agent's motivations. It will typically treat blame as permissible only if a reason exists, missing the generative role of blame.

  ***

  (e) **Common Pitfalls**

  1.  **The "Full Information" Collapse:** Arguing that Elena has a reason because her "fully informed self" would want to leave.
      *   *Reason for penalty:* This bypasses the internalist constraint. Williams explicitly rejects full-information accounts because they sever the link to the *actual* motivational set, effectively conceding the argument to externalism.
  2.  **The "No Reason, No Blame" Assumption:** Arguing that if Elena lacks an internal reason, she cannot be criticized or blamed for staying.
      *   *Reason for penalty:* This misunderstands Williams's later work on blame. Internalism restricts *reasons*, not necessarily *responsibility*. Blame can operate as a social mechanism to alter the $S$ set, creating a reason where there was none.
  3.  **The "Sincerity Trap":** Arguing that because Elena sincerely reports she does not want to leave, the internalist *must* say she has no reason.
      *   *Reason for penalty:* This ignores the "sound deliberative route" clause. Internalism allows that an agent can be wrong about their reasons if they have failed to deliberate soundly (e.g., due to false beliefs or inhibited imagination), even if they are sincere about their current feelings.
