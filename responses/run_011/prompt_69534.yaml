  The common room was dim, the seminar's buzz faded into the hum of the refrigerator. Elena stirred her tea; Marcus leaned against the counter, arms crossed.

  "So," Marcus said. "Ten million configurations. Three kernels. No human mind holds the whole proof. And yet, we're all expected to nod and cite Theorem T tomorrow."

  "It was true before the search began," Elena said quietly. "The machine didn't make it true. It merely cleared the brush so we could see the path."

  "True?" Marcus raised an eyebrow. "On your view, 'true' means corresponding to a realm of causally inert objects. But if no one has traversed the derivation, and the informal sketch is just a sketch, what fact of the matter are you pointing to? You're saying there's a ghost in the machine before the electricity hits it."

  "I'm saying the structure exists independently of our inspection. Consider the sketch. Experts call it 'faithful.' Why? Because it resonates with their understanding of the algebraic landscape. That resonance isn't magic, Marcus. It's cognitive alignment. We evolved to recognize patterns, and mathematical structures are the most rigid patterns there are. My access isn't infallible perception; it's the fallible capacity to recognize coherence."

  "Coherence is a property of sentences, not objects," Marcus countered. "Look, I agree we should accept T. But my acceptance is conditional. T is true *within the fiction* of ZFC, or whatever foundation those kernels assume. The machine verification gives us authority because it guarantees syntactic consistency. We know the rules of the game were followed. We don't need to posit a Platonic heaven to explain why a chess move is legal."

  "But chess rules are arbitrary," Elena said. "Mathematics isn't. If the kernels had disagreed, we wouldn't say 'different games.' We'd say one machine was broken. We assume there's a single target they are aiming at. That target is the abstract structure. Without it, the convergence of three independent kernels is a cosmic coincidence."

  "It's not a coincidence; it's engineering," Marcus said. "The kernels share logical principles because humans built them to model human reasoning. We standardized the syntax. The authority comes from the reliability of the physical devices and the social agreement on the rules, not from a relation to abstracta. And before you ask: no, this doesn't turn math into empirical science. I'm not saying the theorem is true because the silicon behaves a certain way. I'm saying the *verification* is a physical event, but the *validity* is internal to the symbolic system."

  Elena set her cup down. "Here's the worry, Marcus. We both agree T is citable. We both agree the machine check is decisive. We both agree the sketch is secondary. Our practices are identical. Our confidence levels are identical. You say 'true-in-the-fiction,' I say 'true.' What work is your ontology doing? It looks like a verbal dispute."

  Marcus paused. "It's not verbal. It matters for what happens when the fiction breaks. If we encounter a paradox, you have to say we discovered a contradiction in reality. I say we adjusted the rules. But I'll concede this: in the case of T, the fiction is so robust that treating it as real is practically indistinguishable from your realism. The 'quasi-realism' of the practice is overwhelming."

  "And I'll concede," Elena said, "that my 'rational access' is heavily mediated by these very tools. I cannot claim to intuit T directly. My intuition is scaffolded by the machine. If the kernels hadn't agreed, my confidence would vanish. So, access isn't direct perception; it's mediated reliability."

  "Mediated reliability is exactly what I offer," Marcus said. "But without the ontological baggage. Why posit objects that do nothing? T has no empirical application. It doesn't predict particles or bridge stresses. It's pure combinatorics. On the Quinean view, you'd have no reason to believe it exists. On my view, I believe it because it's useful for generating further mathematics. It's a tool for thought."

  "But that utility is exactly what needs explaining," Elena pressed. "Why is this tool so effective for thought? Because it tracks reality. If I'm right, the machine succeeded because it latched onto a real structure. If you're right, the machine succeeded because it followed rules we made up. But if we made them up, why are they so resistant to change? Why can't we just decide T is false tomorrow?"

  "Because the system would collapse," Marcus said. "Consistency is fragile. But again, you're pressing the 'same verdict' worry. You want to know if our disagreement changes anything. Here's where it bites: Explanation. You explain the machine's success by saying it tracked truth. I explain it by saying it executed rules. Your explanation stops at 'it matched reality.' Mine stops at 'it matched the rules.' Yours sounds deeper, but mine doesn't require a miracle of cognitive contact with the inert."

  "Is it a miracle?" Elena asked. "If the mind is physical, and the structure is... well, structural, why can't physical minds recognize structure? I'm not claiming a soul-beam. I'm claiming that our logical faculties are tuned to the same constraints that govern the abstracta. The machine extends that tuning."

  " Tuned by evolution for survival, not for ten-million-case combinatorics," Marcus shot back. "The machine did the work, not our tuning. But look, I'll grant you this: The 'fiction' view sometimes makes mathematicians sound like they're lying. They aren't. They are asserting consequences of the axioms. When you say 'T is true,' you mean 'T corresponds to reality.' When I say it, I mean 'T follows from the axioms.' In practice, for T, those cash out to the same thing. But the metaphysical cost is different."

  "And the epistemic risk is different," Elena said. "If I'm right, we could be wrong about the axioms. If you're right, we can only be wrong about the derivation. But if the axioms are just rules, why do we feel compelled to accept them? You say 'utility.' I say 'evidence.' The fact that T works as a black box for a generation suggests it's latching onto something stable."

  "Stable conventions are still conventions," Marcus said. "But I hear you. The stability is the puzzle. Maybe I need to say more about why the fiction is so rigid. It's not just 'useful'; it's coercive. The math forces our hand. I can treat that coercion as psychological, but you treat it as ontological."

  "Exactly," Elena said. "The coercion is the contact point."

  "But," Marcus added, "if I admit the coercion is real, even if psychological, do I lose anything by not calling it 'ontological'? I avoid the mystery of how we touch the inert. You avoid the mystery of why fictions are coercive. We both have mysteries."

  "Mine is simpler," Elena said. "Structure exists. We find it."

  "Mine is cheaper," Marcus replied. "Rules exist. We follow them."

  They stood in silence for a moment. The disagreement hadn't vanished, but the edges had softened. They weren't talking past each other anymore; they were measuring the cost of their respective mysteries.

  "So," Marcus said, picking up his bag. "Tomorrow. Do we cite T as a fact about numbers, or a fact about the system?"

  "Both," Elena said. "Depending on who's listening. But I'll know what I mean."

  "And I'll know what I mean," Marcus said. "And neither of us will sleep easier."

  "Probably not," Elena agreed. "But the proof holds."

  " The proof holds," Marcus confirmed. He opened the door. "Goodnight, Elena."

  "Goodnight, Marcus."
