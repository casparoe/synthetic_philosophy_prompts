answer: |-
  Bottom line
  1. Does blockage force dimension-specific slippage? This tests your core hypothesis directly.
  2. How do we distinguish slip from luck? This validates that your results aren't noise.
  Reason: Without (1) you have no thesis; without (2) you have no evidence. Everything else is architectural detail or philosophical caveat.

  The shortlist
  **Blockage-Induced Dimension Preference.** This is your unique contribution. You hypothesise that slippage isn't random but forced into specific adjacent concepts when a literal mapping fails. In your domain, if 'tallest' is blocked by a tie, does the system slip to 'leftmost' (spatial) or 'most red' (colour)? You must measure which dimension absorbs the slip. This is highly tractable: you can generate forced-blockage scenarios and log the outcome distribution.

  **Operationalising Genuine Slippage.** You need a metric to prove a slip occurred rather than a lucky guess. In Copycat, this is often path-dependent: did the system attempt the literal rule, fail, and *then* activate a neighbour? You must instrument your codelets to log 'failed attempts' versus 'successful matches'. Without this trace, your output is indistinguishable from a lookup table with noise added.

  **The Smuggling Objection.** You worry your hand-built Slipnet hides the answers. This is unavoidable in symbolic AI, but you can mitigate it. Can you demonstrate a slip you didn't explicitly programme? If you code 'tallest' and 'leftmost' but never link them, yet the system slips between them under pressure, that is evidence of emergence. This question acts as a necessary limitation section in your write-up.

  **Traceability for Demo.** I am adding this because you have a fair to win. A black box solving puzzles is boring; a visualisation of codelets buzzing, activating concepts, and hitting blockages is compelling. Can you render the 'temperature' or 'activation levels' in real-time? This ensures salvage value: even if the theory wobbles, the visual demo stands on its own.

  The ordering
  My criteria are **Dependency** (does later work need this?), **Tractability** (can you do it in eight hours a week?), and **Salvage Value** (if it fails, is there still a project?).

  1.  **Blockage-Indimension Preference.** High Dependency, High Tractability. This is your thesis. If you don't answer this, you haven't tested your hypothesis. It is also the easiest to data-mine: generate puzzles, count slips. If you find no correlation, you still have a negative result worth writing up.
  2.  **Operationalising Genuine Slippage.** High Dependency, Medium Tractability. You cannot claim (1) without this. It requires careful logging architecture early on. If you fail to distinguish slip from luck, your data for (1) is void. However, a simplified heuristic (e.g., 'literal match score < threshold') still saves the project.
  3.  **The Smuggling Objection.** Medium Dependency, Low Tractability. You cannot fully solve this, but you must address it. Place this late in the agenda. It frames your discussion rather than driving your code. Failing to prove 'emergence' merely limits your claims; it doesn't invalidate the mechanism.
  4.  **Traceability for Demo.** Low Dependency, High Salvage. Do this alongside coding. If the theory fails, a cool visualisation of 'thinking agents' still wins at a school fair. It depends on nothing but your GUI skills.

  This order prioritises getting valid data (1 & 2) before worrying about philosophical purity (3), while ensuring you have something tangible to show regardless of the outcome (4).

  Cut or postpone
  I would drop **Temperature vs. Local Urgency** and **Structure-Mapping Applicability**.

  The temperature question is an architectural implementation detail. Whether you use a global cooling variable or local urgency queues, the behavioural output regarding slippage should remain similar. For a 5000-word project, debating control variables distracts from the core phenomenon of conceptual change. Stick to the standard Copycat temperature model; don't reinvent the engine when you're trying to study the drive.

  Structure-mapping is too theoretical. Comparing your symbolic agents to Gentner's structure-mapping theory invites a philosophical rabbit hole that risks consuming your word count without yielding empirical data. You are building a mechanism, not writing a literature review. Save this for the 'Future Work' section. If you have time left in June, you can mention it, but do not let it dictate your design choices now. Focus on the blockages.

  Where I'm most likely wrong
  My weakest link is assuming you can operationalise 'genuine slip' cleanly. I am ranking 'Operationalising Genuine Slippage' second, but it might actually be the hardest part. My reasoning assumes that logging 'failed literal attempts' is sufficient proof of slippage. However, a critic could argue that if you code the failure condition, you've still just written a rule: 'if fail literal, try neighbour'.

  What would flip my ranking? If you find after four weeks that logging internal states makes the system too slow or complex to manage in plain Python. If the instrumentation bogs you down, you must demote this question and rely on statistical signatures instead (e.g., response time distributions). If you cannot prove the 'forced move' internally, you must prove it externally by showing the system behaves differently under blockage than without it. Do not let the perfect definition of slippage prevent you from measuring the behaviour of slippage.
