          1.  Identify the kind of disagreement (verbal, substantive, evidentiary, bedrock intuitions, two questions under one heading, etc.).
          2.  Argue for this diagnosis using the specific examples provided (Tribunal jurisdiction on Jews, Doenitz/submarine warfare, Pal's dissent).
          3.  Define what "progress" would look like (new distinction, empirical finding, etc.).
