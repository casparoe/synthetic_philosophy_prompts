answer: |-
  This is a sophisticated impasse, and your frustration is warranted. You are witnessing a classic jurisprudential collision, but your hypothesis that this is merely "two questions hiding under one heading" is slightly too charitable. It implies the participants could simply untangle the threads and move on. My diagnosis is more structural: this is a **Conflict of Normative Frameworks regarding the Function of International Adjudication.**

  It is not a verbal dispute (they aren't just defining words differently), nor is it purely empirical (they aren't disagreeing on the timeline of treaties). It is a disagreement about **what kind of thing a postwar tribunal is.**

  ### The Diagnosis: Judicial vs. Constitutive

  The stalemate exists because the **Authority Camp** treats the tribunal as a *Judicial* body operating within a pre-existing legal order, while the **Notice Camp** treats the tribunal as a *Constitutive* political act creating a new legal order.

  **1. The Authority Camp (The Judicial Framework)**
  They are operating under a Domestic/Positivist model of law. In this framework, a court's authority is derivative; it can only enforce rules that existed prior to the act.
  *   **Evidence from your notes:** When they cite Hart or Radbruch, they are invoking the separation of law and morality. When they point to the "Crimes Against Peace" charge, they are looking for a statutory hook that existed in 1939.
  *   **Interpretation of Data:** This explains why they view the Tribunal's limitation on Jewish persecution as a "charter designed to exclude." If you view the court as a judicial body bound by strict jurisdiction, limiting the scope looks like an admission that the law doesn't cover the act. They view the Doenitz *tu quoque* not as mercy, but as a jurisdictional collapse: if the US did it and wasn't charged, the rule wasn't law.
  *   **The Bedrock Intuition:** Law is a system of rules. If the rule wasn't there, the punishment is violence, regardless of how moral the outcome.

  **2. The Notice Camp (The Constitutive Framework)**
  They are operating under a Political/Transition model of law. In this framework, the tribunal is an instrument of regime change and normative reconstruction. Its job is to establish *new* boundaries for state conduct.
  *   **Evidence from your notes:** They argue from "realistic alternatives" (summary execution, Soviet show trials). This is a political necessity argument, not a legal validity argument. They cite German jurists arguing for criminalizing war in the 20s/30s to show a *normative shift* was underway, not necessarily a codified statute.
  *   **Interpretation of Data:** This explains why they view the limitation on Jewish persecution as "scrupulousness." In a constitutive act, self-restraint signals legitimacy. They view the Doenitz sentence adjustment as "evenhandedness" because the goal is establishing a fair *precedent* for the future, not merely adjudicating the past.
  *   **The Bedrock Intuition:** Law is a tool of justice and order. If the alternative is chaos or vengeance, the "legality" of the process is derived from the necessity of the outcome.

  **Why the Stalemate is Total**
  You noted that "every time one camp produces a piece of history, the other says it's beside the point." This is because **facts serve different functions in each framework.**
  *   For the Authority Camp, the 1936 Naval Protocol is a *contract*. Did it bind individuals? No? Then no law.
  *   For the Notice Camp, the 1936 Naval Protocol is *notice*. Did it signal to officers that this conduct was frowned upon? Yes? Then no surprise.

  They are not disagreeing about the document; they are disagreeing about what work the document is supposed to do. The Authority Camp asks: "Did this create a liability?" The Notice Camp asks: "Did this create an expectation?"

  ### What Counts as Progress?

  Progress will not come from more history or more jurisprudence citations. You have exhausted those. Progress requires a **Categorical Concession.**

  **1. The Distinction Needed: Legislative vs. Judicial**
  The group needs to explicitly ask: *Was Nuremberg a court applying old law, or a legislature enacting new law retroactively?*
  *   **Progress:** If the Notice Camp admits Nuremberg was effectively *legislative* (creating new law ex post facto) but argues that this was *legitimate* due to the collapse of the prior order, the Authority Camp loses the "it wasn't law" trump card. They would have to argue against the *legitimacy of revolutionary legality*.
  *   **Progress:** If the Authority Camp admits that International Law lacks a sovereign and therefore functions differently than domestic law (where custom *is* law), they lose the "strict positivism" shield.

  **2. The Empirical Finding That Would Matter**
  You mentioned the "hidden empirical question" about what a defendant in 1939 could reasonably expect. This is the only empirical path forward, but it needs to be specific.
  *   **Current State:** Notice says "They knew." Authority says "It wasn't codified."
  *   **Needed Finding:** Evidence of *internal* German military legal assessments from 1938-1941 regarding personal criminal liability for aggressive war. Did the Wehrmacht legal counsel advise officers that *they personally* could be hanged for state policy? If the German military's own legal apparatus believed they were immune, the Notice Camp's "fair warning" argument collapses. If they believed they were liable, the Authority Camp's "no law" argument weakens.

  **3. Is the Debate Worth Having?**
  Yes, but not for the sake of 1945. It is worth having because this exact disagreement defines modern **Transitional Justice**.
  *   Every time the ICC intervenes in a non-signatory state, or a truth commission trades amnesty for testimony, this Nuremberg stalemate re-emerges.
  *   **What it's really for:** It is a proxy war over whether International Law is a *system of rules* (Authority) or a *project of civilization* (Notice). If you solve Nuremberg, you solve the legitimacy of the modern human rights regime.

  ### Where I Might Be Wrong (and What Would Change My Mind)

  I have diagnosed this as a framework conflict, but I may be underestimating the **Substantive Legal Resources** available to the Notice Camp.

  **1. The Customary International Law (CIL) Argument**
  I have treated the Authority Camp's claim ("no binding law") as a strong positivist position. However, International Law in 1939 relied heavily on Customary International Law, not just treaties.
  *   **The Blind Spot:** If the Notice Camp can demonstrate that the *Kellogg-Briand Pact (1928)*, combined with state practice and *opinio juris*, had already crystallized into CIL that imposed *individual* criminal responsibility (not just state responsibility) by 1939, the Authority Camp's "ex post facto" charge is factually wrong, not just philosophically different.
  *   **Why I might be wrong:** I have assumed the Authority Camp is right that "Crimes Against Peace" was new. If it was merely a *codification* of existing custom, the retroactivity charge fails on legal grounds, not moral ones. The Notice Camp hints at this ("aggressive war had been renounced in treaty form"), but they often pivot to moral necessity too quickly. If they stayed on the CIL argument, they might break the stalemate.

  **2. The "Victors' Justice" Trap**
  I have assumed the Authority Camp is arguing in good faith about legal philosophy.
  *   **The Blind Spot:** The Authority Camp's reliance on Pal's dissent is telling. Pal is often critiqued not just for legal reasoning but for minimizing Japanese atrocities. If the Authority Camp's "legal" objection is actually a vehicle for apologia (minimizing the guilt of the defendants), then no amount of jurisprudential diagnosis will work. The disagreement isn't about law; it's about the *moral status of the defendants*.
  *   **Why I might be wrong:** If the Authority Camp is actually motivated by a belief that the defendants were not morally culpable, they will reject any legal framework that convicts them. In that case, the "legal" argument is a shield, and the diagnosis of "framework conflict" is too generous.

  **3. The Nature of "Law" in Extremis**
  Finally, I might be wrong to suggest these frameworks can be reconciled.
  *   **The Possibility:** It may be that in moments of total systemic collapse (like 1945), "Law" *necessarily* fractures into these two camps. The "Authority" view preserves the rule of law for normal times; the "Notice" view preserves justice for catastrophic times.
  *   **The Concession:** If this is true, the debate is insoluble by design. The "progress" would be recognizing that Nuremberg was a **Limit Case** for jurisprudence—a moment where the concept of Law broke and had to be remade. Accepting that the disagreement is permanent might be the only way to stop the circular argument.

  **Summary Recommendation for Your Group:**
  Stop asking "Was it legal?" Ask: "Was Nuremberg a Court or a Constitution?" Force the Notice Camp to defend the *legislative* power of the victors. Force the Authority Camp to define the *source* of International Law in the absence of a sovereign. If they refuse to answer those specific questions, you have your proof that the disagreement is indeed protective, not analytical.
