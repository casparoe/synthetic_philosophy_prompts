      *   *Empirical Finding:* Maybe what a 1939 defendant *actually* believed (psychological/historical expectation), but the user suspects this is treated as settled.
      *   *Best Path:* A change of question. Acknowledge that Nuremberg was a *constitutive* legal act (creating new law) rather than an *enforcement* act.
      *   *Worth having?* Yes, because it forces us to define the relationship between law and morality in extreme cases (transitional justice).

  6.  **Self-Correction/Weaknesses (The "Change My Mind" Section):**
