          *   Interpretation of Evidence: Tribunal limiting jurisdiction on Jews = charter designed to exclude worst acts. Doenitz sentence adjustment = *tu quoque* admission (we did it too, so it wasn't law). Pal's dissent = same record, opposite verdict (shows indeterminacy).
          *   Core Question: Was it *law* in the strict institutional sense at the time of the act?

  3.  **Diagnose the Disagreement:**
      *   *Is it purely verbal?* No. They aren't just defining "law" differently; they care about the consequences of that definition.
      *   *Is it purely empirical?* No. They look at the same facts (treaties, Doenitz) and draw opposite normative conclusions.
      *   *Is it "Two Questions Under One Heading"?* This is the strongest candidate. The user hints at this ("One camp is answering a question about the moral permissibility... the other a question about whether 'law' names a threshold property").
      *   *Refinement:* It's a **Category Error disguised as a Legal Dispute**. Specifically, it's a conflict between *Legitimacy/Justification* (Notice) and *Validity/Source* (Authority). The Notice camp is arguing *Political Philosophy/Just War Theory* (Was this justice?), while the Authority camp is arguing *Legal Positivism/Jurisprudence* (Was this Law?).
      *   *Why the stalemate?* Because "Legality" is doing double duty. For Notice, legality includes moral equity and notice. For Authority, legality is source-based and distinct from morality.
      *   *Evidence from User's Text:*
          *   *Jursidiction on Jews:* Notice sees "limits" (self-restraint); Authority sees "exclusion" (structural flaw). This shows they are evaluating the *purpose* of the court differently.
          *   *Doenitz:* Notice sees "equity"; Authority sees "admission of non-criminality." This shows they interpret *mitigation* differently (mercy vs. lack of jurisdiction).
          *   *Pal:* Authority uses Pal to show legal indeterminacy; Notice likely ignores Pal or sees him as an outlier.
          *   *Radbruch/Hart:* Authority explicitly invokes jurisprudence. Notice invokes "realistic alternatives" (political necessity).

  4.  **Formulate the Diagnosis:**
      *   It is a **Disagreement about the Function of the Label "Law."**
      *   More specifically: **Incommensurable Standards of Evaluation.**
      *   Notice Camp: Evaluates the trials as a *Political-Moral Act* requiring justification.
      *   Authority Camp: Evaluates the trials as a *Jurisprudential Instance* requiring validity.
      *   They are not disagreeing about the facts. They are disagreeing about what *kind* of thing the Nuremberg Trials were.

  5.  **Determine "Progress":**
