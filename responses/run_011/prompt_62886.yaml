      *(Check on the "Notice Camp" argument)*: The user says Notice camp argues "defendants can't honestly claim they had no warning." This sounds like an empirical claim about expectation. But they also argue "alternatives were summary execution." That's a political necessity claim. I should point out that the Notice camp is actually mixing two arguments (Expectation + Necessity), which weakens them against the Authority camp's pure Validity argument.

      *(Check on "Authority Camp")*: They rely on Hart/Radbruch. This is pure jurisprudence.

      *(Conclusion)*: The diagnosis is that they are arguing about *what the trial was for*.

