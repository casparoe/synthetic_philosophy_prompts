answer: |-
  Here is the specification for a theory of normative density suitable for intentional community design. I have separated the requirements into **Non-Negotiables** (conditions on adequacy) and **Nice-to-Haves** (methodological preferences or empirical bets). Following that, I address the incompatibilities and the single requirement that eliminates the most existing frameworks.

  ### Non-Negotiables (Conditions on Adequacy)

  **1. Domain Granularity**
  *   **The Requirement:** The theory must treat tightness as a vector of domain-specific intensities, not a scalar property of the group.
  *   **The Consideration:** Your group is already discovering that "tightness" is not monolithic. A community can be totalitarian about noise and libertarian about parenting. A theory that outputs a single "Tightness Score" for the community is descriptively false and prescriptively dangerous. If the theory cannot distinguish between *financial compliance* and *social warmth*, it will recommend uniform solutions that fracture the coalition. It must allow you to say "Zone A is Tight, Zone B is Loose" without diagnosing a contradiction.

  **2. Observational Independence**
  *   **The Requirement:** The theory must provide metrics for sanction strength that do not rely on member self-reporting.
  *   **The Consideration:** In high-compliance environments, sanctions become invisible because deviation becomes rare. Asking members "How strict is this group?" yields noise; the most socialized members will say "Not strict at all, we just do what's right," while outliers will say "Oppressive." An adequate theory must measure the *cost of deviation* (e.g., probability of reputational loss, friction in accessing common resources) objectively, independent of how "felt" the pressure is. If it relies on surveys, it measures perception, not structure.

  **3. Network Topology Sensitivity**
  *   **The Requirement:** The theory must distinguish between state-backed enforcement (nations) and reputational enforcement (networks).
  *   **The Consideration:** Almost all existing tight-loose data is at the nation-state level, where exit is costly and enforcement is monopolized by police/courts. In an 80-household co-housing project, enforcement is peer-to-peer and exit is (theoretically) possible. Mechanisms that work at the national level (e.g., formalized shaming) can become toxic harassment at the Dunbar-scale. A theory that does not adjust for the fact that everyone knows everyone will recommend sanctions that destroy social capital rather than build order.

  **4. Symmetry of Enforcement**
  *   **The Requirement:** The theory must define a mechanism ensuring that rule-makers are subject to the same sanction probability as rule-followers.
  *   **The Consideration:** You requested the theory not collapse into authoritarianism. The defining feature of authoritarianism is not "strict rules," but "asymmetric rules." If the working group sets the chore rota but exempts themselves from the signup sheet, tightness becomes domination. An adequate account must include a structural check (e.g., random auditing, rotating enforcement duties) that makes the *cost* of rule-breaking identical for the governance layer and the membership. Without this, "tightness" is just hierarchy.

  **5. The Justification Constraint (The Instrumental Paradox)**
  *   **The Requirement:** The theory must account for the fragility of norms that are justified solely by their consequences.
  *   **The Consideration:** This is the deepest constraint. If you convince members to follow a norm *only* because it produces a good outcome (e.g., "Sign the sheet so the kitchen stays clean"), compliance becomes contingent on the member agreeing that the outcome is worth the cost. If someone decides a dirty kitchen doesn't bother them, the norm dissolves. Robust norms often require deontic force ("We do this because it's who we are"). A theory that recommends tightening based purely on efficiency metrics undermines the very commitment required to sustain the tightness.

  ### Nice-to-Haves (Methodological Preferences)

  **1. Trade-off Validity**
  *   **The Consideration:** You asked if the order/creativity trade-off is real. While useful, this is an empirical claim, not a theoretical requirement. A theory could be adequate even if tightness *increases* creativity in some contexts. Demanding the theory resolve this empirical debate before it can be used stalls your design process. Treat this as a hypothesis to test, not a spec to demand.

  **2. Dimensionality Reduction**
  *   **The Consideration:** You suspected insisting on a single number is a measurement convenience. You are correct. While a single index is easier to present to the group, demanding the theory reduce complexity to one dimension is a preference for simplicity over accuracy. As long as the theory can visualize the vector (Domain Granularity), whether it collapses to a scalar is irrelevant to its adequacy.

  **3. Ideological Neutrality**
  *   **The Consideration:** Demanding the theory not be "conservative" or "collectivist" is a political boundary, not a functional one. A theory can be adequate even if it leans individualist, provided it flags its biases. What matters is that it identifies *power*, not that it avoids specific political labels.

  ### Incompatibilities and The Knockout

  **The Incompatibility:**
  There is a genuine tension between **The Justification Constraint** and **Democratic Transparency**. To satisfy the Justification Constraint, norms often need to be treated as sacred or intrinsic ("We don't do that here") to prevent instrumental calculation. However, in a voluntary, democratic co-housing project, you are committed to transparency and rational consensus ("We do this because we agreed it helps").
  *   **Why they conflict:** If you are fully transparent that the norm is a tool for utility, members will calculate the utility. If you obscure the utility to make the norm feel intrinsic, you violate the democratic consent of the governed. You cannot maximize both *robustness of compliance* and *rational transparency* simultaneously. You will have to choose: do you want norms that survive cost-benefit analysis, or norms that survive scrutiny? Usually, not both.

  **The Knockout Requirement:**
  **The Justification Constraint** knocks out the most answers on offer.
  Most institutional design literature (and likely most of your working group's intuition) is rooted in Rational Choice Institutionalism: "Design rules that align incentives." This requirement declares that approach self-defeating for high-cohesion communities. If your theory recommends a rule *because* it pays off, it teaches members to follow rules *only when* they pay off. This eliminates the vast majority of "best practice" governance guides, which assume that clear communication of benefits leads to compliance. It also eliminates strict Gelfand-style descriptivism, which observes tightness but offers no guidance on how to *build* it without triggering the instrumental calculation that weakens it.

  ### Evaluation of Candidate Views

  Rational Choice models fail the Justification Constraint by treating norms as contracts, inviting members to breach them when penalties are low. Descriptive Cultural Psychology (e.g., standard Tight-Loose theory) fails Domain Granularity and Network Topology Sensitivity by treating the community as a monolith and importing nation-state dynamics to a peer network. Virtue Ethics or Traditionalist approaches satisfy the Justification Constraint and Granularity but often fail Symmetry of Enforcement, risking the authoritarian collapse you want to avoid by grounding rules in unchallengeable tradition rather than reciprocal agreement.
