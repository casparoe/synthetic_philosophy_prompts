      *   Let's pick **The Legitimation Paradox** (labeled as the "Corrosion Constraint" in my head) because it addresses the user's specific worry about "recommending tightening on grounds that it pays off."

  8.  **Drafting the Content (Iterative refinement):**

      *   *Intro:* Acknowledge the role (Cultural Psych/Institutional Design).
