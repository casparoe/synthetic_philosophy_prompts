      *   *Alternative:* **The Legitimation Paradox.** This kills most institutional design advice which is purely cost-benefit.
      *   *Decision:* The **Legitimation Paradox** is deeper. It attacks the *advice* mechanism itself. But the **Enforcement Gap** is more practical for the user's immediate "how do we measure this" problem. Let's go with the **Legitimation Paradox** as the philosophical killer, but the **Domain Granularity** as the practical killer of existing "Tight-Loose" models.
