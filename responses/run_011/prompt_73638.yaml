      *(Self-Correction during drafting)*: I need to make sure I don't just repeat the user's ideas back to them. I need to synthesize them into a formal spec.
      *   User's "tightness property of group or domain" -> **Domain Granularity.**
      *   User's "insider reporting" -> **Observational Independence.**
      *   User's "instrumental corrosion" -> **The Justification Constraint.**
      *   User's "scale" -> **Network Topology Sensitivity.**

      *Refining the "Non-Negotiables":*
      1.  **Domain Granularity:** Tightness isn't a scalar for the whole group.
      2.  **Observational Independence:** Can't rely on member perception of sanctions.
      3.  **The Voluntarism Boundary:** Exit rights change the cost of sanctions.
      4.  **The Justification Constraint:** (The Paradox).

      *Refining the "Nice-to-Haves":*
      1.  **Trade-off Empirics:** Order vs. Creativity.
