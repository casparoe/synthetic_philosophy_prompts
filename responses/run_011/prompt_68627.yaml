  2.  **Deconstruct the Absent-Minded Driver (AMD) Paradox:**
      *   *Setup:* Two exits. Exit 1 (payoff 0), Exit 2 (payoff 4), Continue past both (payoff 1). Driver forgets where he is at each intersection. Indistinguishable intersections.
      *   *Planning Stage:* Plan is "Skip 1, Take 2." Expected payoff = 4.
      *   *Action Stage:* At an intersection, what is the probability I am at Exit 1 vs. Exit 2? This depends on the strategy chosen *at the planning stage*.
      *   *The Paradox:* Piccione and Lipman (1997) showed that if you maximize expected utility *at the intersection* using consistent beliefs, you get a different strategy (probabilistic exit) than the planning stage optimal strategy.
      *   *The Resolution (Standard View):* The "in-the-moment" calculation is flawed because it ignores the *logical link* between the decision now and the decision at the other intersection. You are the same agent at both spots. Changing the plan at one spot implies changing it at the other (due to indistinguishability).
      *   *Key Insight:* It's not about *forgetting* (amnesia); it's about *informational symmetry*. The "in-the-moment" self doesn't have *more* information; they have *less* (they don't know which exit). The planning self has the structural view.

  3.  **Address the User's First Question (Precommitments):**
      *   *User's Take:* "The plan gets beaten by the judgment made in the moment... by a guy who knows less."
