prompt: |-
  So I've been noodling on superrationality for a blog post and I've got a draft with a thesis I'm not sure survives scrutiny. Can you read it and tell me where it breaks?

  ---

  **Superrationality is a symmetry premise, not a decision rule**

  Hofstadter's move, roughly: two superrational agents facing the same symmetric game will do the same thing, because there's only one correct answer to a well-posed problem and they're both good enough to find it. So the off-diagonal cells of the matrix aren't live options, and in a prisoner's dilemma you compare (C,C) against (D,D) only, and cooperate. The standard complaints are that this is magical thinking about logical causation, or that it's just evidential decision theory wearing a funny hat. I think both complaints miss the load-bearing part.

  The load-bearing part isn't the rule (restrict to symmetric profiles, then maximize — that part is trivial). It's the premise that your opponent's reasoning is transperant to yours: that you can read their move off your own without any empirical evidence about them. On its own, EDT recommends cooperating only when there's some correlation between your choice and theirs, and correlation has to come from somewhere — common cause, news, evidence. Superrationality manufactures the correlation out of a uniqueness claim about correct reasoning. So the honest formula is: EDT + "there is exactly one thing a correct reasoner does in this game, and we're both such a reasoner." That's why it doesn't feel like EDT. EDT needs news; this needs an identity.

  Here's where it gets shaky. Give each agent the same prisoner's dilemma, except your temptation payoff is 5.01 and mine is 5.00. The games aren't identical, so the uniqueness premise doesn't apply — nothing guarantees that the correct output in the 5.00 game matches the correct output in the 5.01 game. But intuitively this is exactly the superrational situation and we should cooperate anyway. So what you actually need is a premise about *near*-identity of decision problems, or about similarity of reasoning processes, which requires a metric: how close must two problems be before their solutions are forced to agree? Nobody has one, and without one the theory's scope is fixed by an arbitrary line-drawing.

  The second problem I think is worse. Suppose the agents break ties, or play mixed strategies, using private random sources. Then two reasoners running literally the same algorithm diverge, the diagonal stops being a live possibility, and the whole restriction is void. To rescue it you have to assume shared randomness — the same seed, as it were — which is a substantive and frankly strange assumption: what is it for two separate people to be drawing on one random source? I suspect Hofstadter's examples quietly assume the reasoners' outputs are functions of the problem statement alone.

  So superrationality isn't a rival decision rule. It's a research program about when two decision procedures are close enough that you can predict one from the other. That's a real question. The label just makes it sound like something you could act on today.

  ---

  What I want from you:

  1. Is the "EDT + uniqueness premise" decomposition actually right? I'm worried I'm being too quick — maybe there's a route to the diagonal restriction that doesn't have to manufacture a correlation at all. If so, the second paragraph collapses and I need to know.
  2. Which objection does more damage, the one-cent near-symmetry case or the private randomness case? And is the randomness one just the old "your opponent might randomize independently" objection in disguise — because if it is, it's not new and I should cut it.
  3. Am I strawmanning Hofstadter by reading him as making a claim about actual people rather than about idealized reasoners? If the ideal-reasoner reading is the charitable one, does the one-cent case still bite, or does an ideal reasoner just handle the whole family of near-identical games at once?
  4. Tell me honestly whether the conclusion — you need a similarity metric over decision procedures — is interesting or whether it's the kind of thing that's trivially true of every decision theory and so proves nothing.

  Also flag any flat-out errors in how I've described EDT or the original argument, I haven't gone back to the source in a while.
reasoning: |-
  Here's a thinking process that leads to the suggested feedback:

  1.  **Analyze the User's Request:**
      *   **Task:** Critique a draft blog post about superrationality.
      *   **Thesis:** Superrationality is a symmetry premise, not a decision rule. It relies on EDT + a uniqueness claim about correct reasoning. It breaks down under near-symmetry (payoff differences) and private randomness. It should be viewed as a research program about similarity metrics for decision procedures.
      *   **Specific Questions:**
          1.  Is "EDT + uniqueness premise" accurate? Is there a non-correlation route to the diagonal?
          2.  Which objection is stronger (near-symmetry vs. private randomness)? Is the randomness objection old hat?
          3.  Is this a strawman of Hofstadter (actual vs. idealized reasoners)? Does idealization save it from the one-cent case?
          4.  Is the conclusion (need for a similarity metric) interesting or trivial?
          5.  Flag factual errors regarding EDT or Hofstadter's argument.

  2.  **Deconstruct the Draft & Evaluate Claims:**

      *   **Claim 1: Superrationality = EDT + Uniqueness Premise.**
          *   *Analysis:* Hofstadter's argument is often interpreted as a form of Evidential Decision Theory (EDT) or Timeless Decision Theory (TDT) before TDT existed. The core idea is that your choice *is* evidence of the other's choice because you are both running the same "algorithm."
          *   *Critique:* It's not *just* EDT. Standard EDT requires empirical correlation. Superrationality posits *logical* correlation (acausal). The "uniqueness premise" is the engine that creates the logical correlation. So the decomposition is mostly right, but it's more accurate to say it's *Logical* EDT or TDT. The draft says "EDT needs news; this needs an identity." That's a strong insight.
          *   *Verdict:* The decomposition holds up well, but distinguishing between *empirical* correlation (EDT) and *logical* correlation (TDT/Superrationality) is crucial. The draft hints at this but could be sharper.

      *   **Claim 2: The One-Cent Objection (Near-Symmetry).**
          *   *Analysis:* If payoffs differ slightly ($5.00 vs $5.01), strict symmetry breaks. Does superrationality break?
          *   *Counter-argument:* A truly *ideal* reasoner solves the *class* of games, not just the specific instance. If the game is "Prisoner's Dilemma with payoffs approx X," the solution should be robust. However, if the payoff difference changes the dominant strategy (e.g., one is a PD, the other is a Harmony game), then cooperation isn't rational for one. But if both are PDs, just slightly different, a robust algorithm should output the same.
          *   *Verdict:* This is a strong objection to *naive* superrationality (strict identity). It forces the theory to become about *similarity* (robustness). This supports the user's conclusion.

      *   **Claim 3: The Private Randomness Objection.**
          *   *Analysis:* If agents use private coins for mixed strategies, they diverge.
          *   *Counter-argument:* This is related to the "common prior" or "common random seed" assumption in TDT/FDT. If I know you are *me* (algorithmically), I know your random seed if it's part of the algorithm. If it's external, correlation breaks.
          *   *Is it old?* It's a standard objection to acausal decision theories regarding mixed strategies. It's not *new*, but framing it as "shared randomness" is a good way to expose the metaphysical cost.
          *   *Verdict:* It's a valid technical hurdle, but maybe less philosophically damaging than the near-symmetry case. The near-symmetry case attacks the *applicability*, while randomness attacks the *implementation*.

      *   **Claim 4: Strawmanning Hofstadter?**
          *   *Analysis:* Hofstadter wrote for a general audience (Scientific American). He often spoke of "reasonable people" rather than "idealized algorithms." However, the logical force requires idealization.
          *   *Charitable Reading:* Ideal reasoners recognize the *structure* is identical even if parameters vary slightly. They cooperate on the *class* of PDs.
          *   *Verdict:* The user isn't strawmanning the *logic*, but might be underestimating the *idealization* Hofstadter implicitly relied on. However, pointing out that idealization requires a metric of similarity is the valuable contribution here.

      *   **Claim 5: Conclusion (Similarity Metric).**
          *   *Analysis:* Is this trivial? Every analogical reasoning requires a similarity metric. But in decision theory, formally defining "similar decision problems" such that "similar solutions are mandated" is *not* trivial. It's the core problem of Functional Decision Theory (FDT).
          *   *Verdict:* It is interesting. It connects to open problems in logical induction and program equivalence. It is *not* trivially true of CDT or standard EDT.

      *   **Factual Checks:**
          *   *EDT:* Draft says "EDT recommends cooperating only when there's some correlation... correlation has to come from somewhere — common cause, news, evidence." This is correct.
          *   *Hofstadter:* Draft says "Hofstadter's move... two superrational agents facing the same symmetric game will do the same thing." This is accurate to the 1983 SciAm column.
          *   *Diagonal Restriction:* "Off-diagonal cells... aren't live options." Accurate description of the superrational move.

  3.  **Drafting the Response:**

      *   *Tone:* Constructive, analytical, respectful of the blog post's sophistication.
      *   *Structure:* Address the 4 specific questions, then add general feedback on errors/clarity.
      *   *Key Insight to Highlight:* The distinction between *empirical* correlation (EDT) and *logical* correlation (Superrationality/TDT) is the pivot point. The user's "uniqueness premise" is essentially asserting logical correlation.
      *   *On the Randomness Objection:* Clarify that this is known but often glossed over. It's not "old hat" in the sense of being settled; it's a genuine open problem for acausal theories.
      *   *On the Metric:* Validate that this is non-trivial. It's the "program equivalence problem."
      *   *On Hofstadter:* Acknowledge he was vague. The user is formalizing his intuition, which is good.

  4.  **Refining the Arguments (Self-Correction during drafting):**
      *   *Wait, is it EDT?* Technically, Superrationality is closer to TDT/FDT. EDT conditions on the *act*. Superrationality conditions on the *reasoning process*. If I decide to C, it implies the other decides to C *because* we think alike, not because my act causes theirs or correlates empirically. The draft says "EDT + uniqueness." This is a useful heuristic, but technically Superrationality bypasses the need for *evidence* in the Bayesian sense and relies on *logical implication*. I should nuance this. It's not that EDT is wrong, it's that the "evidence" is logical truth, not empirical observation.
      *   *The One-Cent Case:* If payoffs differ, is it still a PD? Yes, structurally. But does the *solution* change? In Nash Equilibrium, no (D,D). In Superrationality, if the payoff difference makes defection strictly dominant for one but not the other (unlikely in PD structure), then symmetry breaks. But if both are PDs, the "unique correct answer" should be invariant to small perturbations. The user's point stands: you need a continuity assumption.
      *   *Randomness:* If I use a random number generator (RNG), and you use an RNG, are they the same algorithm? If the algorithm is `output = f(problem, seed)`, and seed is private, then `f` is different. Superrationality requires `f` to be identical. So the assumption is that the *entire state* is shared. This is a heavy metaphysical lift.

  5.  **Final Polish:** Ensure the feedback directly answers the four numbered prompts. Make sure to validate the "Similarity Metric" conclusion as the strongest part of the post.

      *(Self-Correction on "Triviality"):* Is "you need a similarity metric" trivial? In machine learning, yes. In decision theory, no. CDT doesn't care about similarity of agents. EDT cares about empirical correlation. Only logical decision theories care about algorithmic similarity. So it's a specific, non-trivial requirement.

      *(Check on Hofstadter Source):* Hofstadter's 1983 column "The Prisoner's Dilemma Computer Tournaments and the Evolution of Cooperation" (actually it was "Metamagical Themas"). He specifically discusses the idea that rational players will converge on the same answer. He doesn't explicitly deal with the epsilon-payoff case. So the user is not strawmanning, they are stress-testing.

  6.  **Final Output Generation** (incorporating these thoughts into the structured response).
answer: |-
  This is a sharp draft. You've correctly identified that the "magic" of superrationality isn't in the maximization step, but in the *restriction of the possibility space*. You are also right to sense that the "uniqueness premise" is doing all the heavy lifting.

  Here is the scrutiny you asked for, addressing your four specific questions and then flagging a couple of technical nuances.

  ### 1. Is the "EDT + uniqueness premise" decomposition right?

  **Verdict:** It is heuristically right, but technically slightly off in a way that matters for your argument.

  You write: *"EDT needs news; this needs an identity."* This is the strongest sentence in the piece. However, describing superrationality as "EDT + uniqueness" risks conflating *empirical* correlation with *logical* correlation.

  *   **Standard EDT:** I choose $C$. I update my belief that you chose $C$ because in the past, people like you have correlated with people like me, or we share a common cause. The correlation is contingent.
  *   **Superrationality:** I choose $C$. I know you chose $C$ not because of empirical history, but because $C$ is the *unique output* of the function `Reason(Game)`.

  If you frame it as EDT, a critic can say, "Where is the likelihood ratio $P(You=C | Me=C)$ coming from?" If you frame it as **Logical Decision Theory (LDT)** or **Timeless Decision Theory (TDT)**, the answer is: "It comes from logical necessity."

  **Does a non-correlation route exist?**
  No. You cannot get to the diagonal restriction without a correlation premise. Causal Decision Theory (CDT) explicitly severs the link between your choice and the opponent's choice in a one-shot game. To restrict the matrix to the diagonal, you *must* assert that your choice is informative about theirs.
  *   **Correction:** Don't call it EDT. Call it "Logical Correlation." EDT implies the correlation is discovered; Superrationality implies the correlation is *constructed* by the uniqueness of truth. Your argument holds, but the terminology should be precise to avoid the "EDT wears a funny hat" objection you mentioned. The "uniqueness premise" *is* the claim of logical correlation.

  ### 2. Which objection does more damage: Near-Symmetry or Private Randomness?

  **Verdict:** The **Near-Symmetry (one-cent)** case is philosophically deeper; the **Randomness** case is technically sharper but easier to patch.

  *   **The Randomness Objection:** You ask if this is just the old "independent randomization" objection. Yes and no.
      *   *The Old Objection:* "If you mix, I can't predict you."
      *   *Your Objection:* "If you mix, *superrationality breaks the symmetry* unless you share a seed."
      *   This is a potent reformulation. It exposes that superrationality requires **common prior + common random seed**. This is a heavy metaphysical assumption (essentially, you must be the same physical system). However, a defender can say, "Ideal reasoners use a deterministic pseudo-random function based on the game state." It's a patchable hole.
  *   **The Near-Symmetry Objection:** This is the killer. If superrationality relies on "same game $\rightarrow$ same move," then "similar game $\rightarrow$ ?" is undefined.
      *   If the theory cannot handle an epsilon change in payoff without collapsing, it has **zero measure** in the real world. No two real-world games are identical.
      *   To save it, you must posit a *topology* on decision problems. You need to define a distance metric $d(Game_1, Game_2)$ such that if $d < \epsilon$, then $Move_1 = Move_2$.
      *   **Damage Assessment:** The randomness objection shows the theory is fragile; the near-symmetry objection shows the theory is **inapplicable**. The latter is more damaging to the thesis that this is a usable guide for action.

  ### 3. Are you strawmanning Hofstadter (Actual vs. Idealized)?

  **Verdict:** You are not strawmanning, but you might be underestimating the "Ideal Reasoner" escape hatch.

  Hofstadter was writing for *Scientific American*, so he was necessarily vague. He often oscillated between "people who think hard" and "perfect rational agents."
  *   **The Charitable Reading:** An ideal reasoner doesn't solve *this specific matrix*; they solve the *class* of Prisoner's Dilemmas. They recognize that a 5.00 payoff and a 5.01 payoff belong to the same equivalence class of "PD with high temptation." Therefore, the output is identical because the *classification* is identical.
  *   **Does this save it?** Only if you accept that "solving the class" is a well-defined operation. This leads directly to your conclusion: you need a metric for when two games belong to the same class.
  *   **The Trap:** If the ideal reasoner solves the class, what happens at the boundary? At what point does a PD become a different game (e.g., Stag Hunt)? If the solution flips discontinuously at the boundary, two reasoners with slightly different boundary definitions will defect against each other.
  *   **Advice:** You aren't strawmanning. You are formalizing his intuition. Acknowledge that the "Ideal Reasoner" defense essentially concedes your point: it admits that the core work is done by the *classification metric*, not the rationality itself.

  ### 4. Is the conclusion (need for a similarity metric) interesting or trivial?

  **Verdict:** It is **highly interesting** and non-trivial.

  *   **Why it's not trivial:** CDT doesn't need a similarity metric (it ignores the other agent). EDT doesn't need a *logical* similarity metric (it needs empirical data).
  *   **Why it's hard:** You are describing the **program equivalence problem**. To say "Agent A and Agent B are similar enough to cooperate" is formally equivalent to asking "Do Program A and Program B halt on the same output for this input?" This is undecidable in the general case.
  *   **The Payoff:** Framing superrationality as a research program into *logical similarity metrics* connects it to modern work in **Functional Decision Theory (FDT)** and **Logical Induction**. It moves the discussion from "Is cooperation magic?" to "How do we formalize algorithmic similarity?" That is a genuine, open, and difficult problem in decision theory.
  *   **Blog Hook:** This is your money shot. Don't bury it. Explicitly state: *"Superrationality fails as a decision theory because it assumes we already have a solution to the program equivalence problem."*

  ### Factual & Technical Flags

  1.  **EDT Description:** You wrote: *"EDT recommends cooperating only when there's some correlation between your choice and theirs, and correlation has to come from somewhere — common cause, news, evidence."*
      *   **Correction:** This is correct, but be careful not to imply EDT *requires* a causal mechanism. EDT is fine with spurious correlation (the "Newcomb's Problem" vs. "Smoking Lesion" distinction). However, in a one-shot PD with no prior history, standard EDT *does* defect because there is no empirical evidence to condition on. Your description is safe, just ensure you don't conflate "evidence" with "causal link."
  2.  **Hofstadter's "Move":** You wrote: *"the off-diagonal cells of the matrix aren't live options."*
      *   **Nuance:** Hofstadter argued that $(C, D)$ and $(D, C)$ are *logically impossible* for superrational agents, not just unlikely. Your text captures this, but ensure you emphasize that this is a claim about **logical possibility**, not probabilistic uncertainty.
  3.  **"Manufactures the correlation":**
      *   **Refinement:** Be careful with the word "manufactures." It sounds like fiction. A better phrase might be "derives the correlation from logical identity." It sounds less like hocus-pocus and more like math.

  ### Summary Recommendation

  The draft is strong. The thesis holds up.
  *   **Keep:** The distinction between "rule" and "premise." The "one-cent" objection. The conclusion about similarity metrics.
  *   **Tweak:** Swap "EDT" for "Logical Correlation" or "TDT" to avoid technical quibbles. Lean harder into the "Program Equivalence" angle for the conclusion—it validates the "research program" claim as non-trivial.
  *   **Cut:** Don't worry too much about the randomness objection being "old hat." Frame it as "The Randomness problem shows that Superrationality requires Shared State, not just Shared Logic."

  Your intuition that this is a "research program about when two decision procedures are close enough" is the most valuable insight here. It anticipates the shift from Hofstadter's pop-sci philosophy to the formal work being done by MIRI and others on FDT today. Go with that.
