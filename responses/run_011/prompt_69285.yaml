answer: |-
  Good evening. For those who don't know me, I write fiction. [Name] reads facts. For twenty years, I've sent her drafts, and she's sent them back with margins full of red ink. Not about the prose. About the mechanics. I'd write that a government was closing its hands, and she'd circle it and ask: *Which hand? Which law gave them the fingers?*

  She taught me that you cannot see the shape of a thing by looking at the shadow it casts today. You have to look at the floor. Her first rule was that no single act ever adds up to the diagnosis. One redistricting map is just geometry. One regulator replaced is just personnel. But if you lay twenty years of clippings end to end on the dining room carpet, you can't walk across the room without stepping on the pattern. By then, nobody wants to look at the floor. But she made us look.

  Her second rule was never to name it, only describe it. She believed the label was the partisan move, not the analysis. Say the word and you've picked a team. Half the room stops listening, and the other half starts quoting you. So she taught us to describe—who appoints whom, who can be fired and by whom, which court gets to hear which case, where the money comes from. And then stop. Dead stop. Let the description sit there doing the work.

  She treats a dinner party like a deposition. If you say "things are getting worse," she asks you to define "things," specify "worse," and identify the statutory authority for your decline. The lawyers here are laughing because they know the procedure. The family is laughing because we've all been stopped mid-sentence at Thanksgiving to define our terms before we could pass the gravy.

  Now, her third rule is the one I break. It says: No standing, no verdict. If you don't live there, pay taxes there, and could be put in a cell there, you don't get to say what's happening. She's right. I'm a tourist with a notebook. I write it anyway. She reads it anyway. She never agrees. I never stop. We have agreed to disagree on my right to speak, which is perhaps the only verdict she ever allowed me.

  So I won't name what she studied. I won't name the countries. But I will describe what she saw, because this is what she taught me to do.

  She saw the meetings moved to closed doors. She saw the budgets shift from oversight to enforcement. She saw the courts asked to rule on questions they could not answer, and the answers given before the questions were asked. She saw the language change, slowly, until the words for "public" and "private" meant the same thing, and the word for "enemy" meant anyone who asked why. She saw the lights stay on, and the trains run on time, and the silence grow heavy enough to sit on.

  She spent forty years refusing to say the thing everyone wanted her to say, because she wanted us to see the thing itself, not the banner we wave over it.

  So, to [Name]. May your retirement be full of open doors, clear budgets, and dinners where the only thing we have to define is the wine.

  ***

  **Constraint Analysis**

  The three rules dictated the structure and vocabulary of the toast. **Rule 1 (Accumulation)** appears in the "clippings on the carpet" metaphor; I avoided citing specific events, focusing instead on the volume of evidence over time. **Rule 2 (Describe, Don't Name)** was the hardest constraint; I scrubbed all nouns like "authoritarianism," "democracy," "freedom," or "erosion." The emotional peak ("She saw the meetings moved to closed doors...") relies entirely on mechanical description (budgets, courts, language shifts) to evoke the political reality without diagnosing it. **Rule 3 (Standing)** is where I handled the disagreement. Instead of arguing she was wrong, I admitted *I* break the rule ("I'm a tourist with a notebook... I write it anyway"). This acknowledges the friction without demanding she concede, honoring her principle while asserting the novelist's right to speak. The joke ("statutory authority for your decline") works for the lawyers (legal procedure) and the family (grandma being pedantic at dinner), fulfilling the requirement for a dual-audience moment.
