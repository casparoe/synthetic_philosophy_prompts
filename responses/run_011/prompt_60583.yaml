prompt: |-
  I run a small patient-safety program at a regional health system and I review maybe six to eight incident write-ups a month before they go to our review committee. Here's the problem I keep hitting: the explanations read beautifully. Night shift, two interruptions, two bags that look alike on the shelf, a nurse who had been asked to cover a second unit. Everyone in the room nods. But the grip of a good story is not the same thing as an explanation, and I have no way of telling our reviewers which is which. On the other side, some write-ups give me something that looks like a bare law — drug A interacts with condition B, patient had condition B — and nobody can do anything with that either.

  I want you to turn the old argument about whether explanations work by subsuming events under general laws or by telling a well-constructed narrative into an actual procedure my reviewers can run on the explanation section of a report in about twenty minutes. Our reviewers are nurses and a couple of engineers. Nobody is going to read philosophy, so the distinctions have to survive being translated into questions you ask the writer and things you check in the text.

  Specifically, build it so it can separate the failure modes, which I think are at least three and which we currently lump together as "weak analysis": an account that is only a chronology, an account that is a story whose details are doing no explanatory work, and an account that states something general but explains nothing about this patient on this night. For each step give me the question the reviewer asks, what a passing answer looks like, what a fail looks like, and where the reviewer is being asked to make a judgment call that no procedure can make for them — I want those flagged explicitly rather than buried, because I'd rather have an honest checklist than an impressive one. Include the disposition at the end: accept, send back with specific questions, or escalate.

  Then run it on three cases, and invent the details you need:

  1. A well-written narrative about a wrong-route medication error where the writer genuinely cannot tell me whether the same thing would have happened on a different night with a different nurse.
  2. A thin, unpopular one — an interaction between a drug and a condition the patient already had, plus a monitoring gap — that passes your procedure even though our family advisory committee will hate it and will say it misses what actually happened.
  3. A report that passes the first couple of steps and then bottoms out in facts nobody can change.

  For case 2, don't soften it. I want to see the procedure hand me an answer I don't want, because that's the only way I'll know whether it's doing work or just decorating the room. And close with a short section on what the procedure can't settle — including whether a satisfying narrative has value on its own even when it fails your tests — since that argument is going to come up at the committee and I'd rather walk in expecting it.

  One last thing, and please actually do it rather than gesturing at it: tell me how confident you are that these tests discriminate, and single out the one step you're least sure about — the one most likely to pass a bad report or fail a good one, and why. I'd rather have your doubt located in a specific place than spread thinly over the whole thing.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Runs a small patient-safety program at a regional health system. Reviews 6-8 incident reports/month.
      *   **Problem:** Explanations are either "beautiful stories" (narrative fallacy) or "bare laws" (covering law model without context). Reviewers can't distinguish between a good explanation and a good story.
      *   **Goal:** Create a 20-minute procedure/checklist for reviewers (nurses, engineers) to evaluate the *explanation section* of incident reports.
      *   **Theoretical Basis:** Translate the philosophical debate (Hempel's Covering Law vs. Narrative Explanation) into practical questions.
      *   **Specific Requirements:**
          *   Distinguish three failure modes: (1) Just chronology, (2) Story with non-explanatory details, (3) General law with no specific application.
          *   Format: Question, Passing Answer, Failing Answer, Explicit Judgment Call flags.
          *   Disposition: Accept, Send Back, Escalate.
          *   Test Cases: Run the procedure on three specific invented cases (1. Good narrative but uncertain generalizability, 2. Thin/Unpopular law-based explanation that passes, 3. Facts nobody can change).
          *   Constraint on Case 2: Do not soften it. Show the procedure yielding an unwanted but logically valid result.
          *   Closing Section: What the procedure *can't* settle (value of narrative).
          *   Confidence Assessment: Explicitly state confidence level and identify the weakest step (most likely to error).

  2.  **Deconstruct the Theory:**
      *   *Covering Law (Hempel):* Explanation = Subsumption under a general law + Initial conditions. (If X, then Y. X happened. Therefore Y.)
      *   *Narrative:* Explanation = A coherent story that makes sense of the sequence. (A led to B, which felt like C.)
      *   *The Gap:* A story can be compelling but coincidental. A law can be true but irrelevant to the specific context.
      *   *The Solution:* A hybrid check. Does the story identify *mechanisms* (not just sequence)? Does the law apply to the *specific constraints* of this event (not just abstract truth)?

  3.  **Drafting the Procedure (The "20-Minute Test"):**
      *   Need 3-4 steps max to fit in 20 mins.
      *   *Step 1: The Chronology Check.* (Filters out "just a list").
      *   *Step 2: The Counterfactual Check.* (Filters out "just a story"). If we change X, does Y still happen?
      *   *Step 3: The Mechanism/Constraint Check.* (Filters out "just a law"). Is the general rule actually what broke *here*?
      *   *Judgment Calls:* Need to highlight where human intuition is required.

  4.  **Developing the Test Cases:**
      *   *Case 1 (The "Good Story/Uncertain Cause"):* Wrong route (e.g., epidural into IV). Narrative is clear, but was it the lighting? The fatigue? The label? Writer admits they don't know if it's systemic or just bad luck.
      *   *Case 2 (The "Thin Law"):* Drug interaction. Patient had Condition B, took Drug A. Monitor failed. It's technically true, but feels cold. The procedure *must* pass this if it's logically sound, even if families hate it.
      *   *Case 3 (The "Immutable Facts"):* Report says "Staffing was low." Review says "We can't hire more." Explanation bottoms out in unchangeable constraints.

  5.  **Refining the Procedure Steps (Iterative Process):**
      *   *Draft Step 1:* Is there a timeline? *Critique:* Too simple.
      *   *Better Step 1:* **The "Because" Test.** Every event must be linked by a causal connector, not just "and then."
      *   *Draft Step 2:* Is there a rule? *Critique:* Too vague.
      *   *Better Step 2:* **The "Intervention" Test.** If we fix the cited cause, does the error disappear? (Counterfactual).
      *   *Draft Step 3:* Is it specific?
      *   *Better Step 3:* **The "Local Constraint" Test.** Does the general rule explain *this* specific failure, or just the possibility of failure?

  6.  **Addressing the "Judgment Call" Requirement:**
      *   I need to explicitly mark where the reviewer has to use their gut. For example, distinguishing a "contributing factor" from a "background condition."

  7.  **Addressing the Confidence/Doubt Requirement:**
      *   I need to be honest. Which step is flakiest? Probably the Counterfactual (Step 2). It's easy to imagine a world where the error didn't happen, but hard to prove the specific intervention would have stopped it without new data.

  8.  **Drafting the Content (incorporating all constraints):**

      *   *Intro:* Acknowledge the Hempel vs. Narrative tension.
      *   *The Procedure:* "The Causal Integrity Check."
      *   *Step 1 (Chronology vs. Causality):* Focus on connective tissue.
      *   *Step 2 (General vs. Specific):* Focus on the "Local Constraint."
      *   *Step 3 (Actionability/Counterfactual):* Focus on "If we change X..."
      *   *Dispositions:* Clear criteria.
      *   *Case Studies:* Write them out fully.
      *   *Case 2 Specific:* Ensure it passes the check but feels cold. (e.g., Pharmacokinetics + Missed Vitals).
      *   *Limitations:* Discuss the value of narrative for healing vs. prevention.
      *   *Confidence:* Rate it (e.g., 75%) and pinpoint Step 2 as the weak link.

  9.  **Review against Constraints:**
      *   20 minutes? Yes, 3 steps.
      *   Nurses/Engineers audience? Yes, plain language.
      *   Three failure modes addressed? Yes (Chronology, Story, Law).
      *   Judgment calls flagged? Yes, using [JUDGMENT CALL] tags.
      *   Case 2 not softened? Yes.
      *   Confidence/Doubt section included? Yes.

  10. **Final Polish:** Ensure tone is professional, empathetic to the safety officer's burden, and philosophically grounded without being academic. (Self-Correction: Make sure the distinction between "Story" and "Explanation" is clear in Step 1).

  *(Self-Correction during drafting Case 2)*: I need to make sure Case 2 passes the procedure. If the report says "Drug A causes Respiratory Depression in Condition B patients. Patient had Condition B. Monitoring was not performed per protocol," that is a Covering Law explanation. It explains *why* the injury happened physically. It fails the *human* need for accountability, but passes the *logical* test of explanation. I must ensure the procedure validates this so the user sees the tool's limit.

  *(Self-Correction during drafting Confidence)*: Don't say "I think." Say "I estimate." Be specific about *why* that step is weak (reliance on hypothetical reasoning).

  11. **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  Here is a procedure designed for your review committee. It translates the philosophical distinction between *narrative coherence* (a good story) and *causal subsumption* (a valid explanation) into a triage tool.

  ### The Causal Integrity Check (20-Minute Procedure)

  **Purpose:** To distinguish between a chronological account, a compelling story, and a functional explanation.
  **Users:** Nurses, Engineers, Safety Officers.
  **Time:** 20 Minutes per report.

  ---

  #### Step 1: The Connective Tissue Test (Filters "Just Chronology")
  **The Question:** Look at every sentence in the "Event Description." Does it connect to the next sentence with a causal mechanism (e.g., "because," "which triggered," "leading to") or just a timestamp (e.g., "then," "at 0200," "subsequently")?

  *   **Passing Answer:** The text identifies *mechanisms*. Example: "The pump alarm was silenced *because* the battery was low, *which masked* the occlusion alarm."
  *   **Failing Answer:** The text identifies *sequence*. Example: "The battery was low. The nurse silenced the alarm. At 0200, the occlusion occurred."
  *   **[JUDGMENT CALL]:** You must decide if a connector is truly causal or just decorative. (e.g., "The nurse was tired, *and* she made an error." Is fatigue the cause, or just a coincident fact? If the text doesn't specify *how* fatigue degraded performance, flag it.)

  #### Step 2: The Local Constraint Test (Filters "Bare Laws")
  **The Question:** Take the general rule cited (e.g., "Drug A interacts with Condition B"). Does the report explain why *this specific context* allowed that law to become an error, rather than just a risk?

  *   **Passing Answer:** The report links the general law to a local failure. Example: "Drug A interacts with Condition B. *Normally* the EHR flags this, *but* the interface was overridden during the emergency transfer."
  *   **Failing Answer:** The report states the law as the explanation. Example: "Patient died due to Drug A interaction with Condition B." (This explains the physiology, but not the *incident*.)
  *   **[JUDGMENT CALL]:** Distinguishing between a "background condition" and a "cause." (e.g., "It was night shift." Is that a cause or just the setting? If the procedure is identical day/night, it's a setting. If staffing ratios change, it's a cause. The reviewer must decide.)

  #### Step 3: The Counterfactual Test (Filters "Good Stories")
  **The Question:** Look at the primary cause identified. If you remove *only* that factor (keep everything else the same), does the error definitely not happen?

  *   **Passing Answer:** Yes. Example: "If the label had been distinct, the nurse would not have grabbed the wrong vial."
  *   **Failing Answer:** No/Uncertain. Example: "If the nurse hadn't been interrupted, she wouldn't have erred." (But she was covering two units; would she have erred anyway due to cognitive load?)
  *   **[JUDGMENT CALL]:** Assessing "Definitely." You are asking reviewers to simulate a parallel universe. They must rely on engineering or clinical logic, not hope.

  ---

  ### Disposition Logic

  *   **ACCEPT:** Passes all three steps. The explanation identifies a mechanism, contextualizes the general rule, and points to a changeable factor that prevents recurrence.
  *   **SEND BACK:** Fails Step 1 or Step 2. The writer must rewrite the explanation to link events causally or explain why the general rule failed *here*.
  *   **ESCALATE:** Passes Steps 1 & 2, but Fails Step 3 (Uncertain Counterfactual). This indicates a systemic ambiguity where the cause is identified but the solution is unknown. Requires higher-level analysis (e.g., human factors specialist).

  ---

  ### Case Trials

  Here is the procedure run on your three requested scenarios.

  #### Case 1: The "Beautiful Story" (Wrong-Route Medication)
  **The Report:** A nurse connects an epidural infusion to an IV line. The narrative describes the shift perfectly: high census, a loud alarm in the hallway, a new pump model with a green light instead of red. The nurse admits she "just moved fast."
  **The Explanation Section:** "Due to high cognitive load and similar pump interfaces, the nurse selected the wrong port. The epidural tubing fit the IV access."

  *   **Step 1 (Connective Tissue):** **PASS.** It links "high load" and "similar interfaces" to "wrong port."
  *   **Step 2 (Local Constraint):** **PASS.** It notes the specific physical compatibility (tubing fit IV access) rather than just saying "wrong route errors happen."
  *   **Step 3 (Counterfactual):** **FAIL/Uncertain.** If we change the pump interface, does the error vanish? The writer admits: "I cannot tell you if the same thing would have happened on a different night with a different nurse." The "high cognitive load" is vague. Would a rested nurse have made the same mistake with the same equipment? Unknown.
  *   **Disposition:** **ESCALATE.**
  *   **Why:** The story is coherent, but the causal weight is distributed so broadly (load, equipment, tubing) that no single intervention guarantees safety. This requires a human factors engineer, not just a policy change.

  #### Case 2: The "Thin Law" (Drug Interaction + Monitoring Gap)
  **The Report:** Patient with renal failure (Condition B) receives a standard dose of Morphine (Drug A). Patient stops breathing.
  **The Explanation Section:** "Morphine is metabolized by the kidneys. In renal failure, morphine accumulates, causing respiratory depression. The protocol requires monitoring every 4 hours. The nurse monitored every 4 hours, but the depression occurred between checks."

  *   **Step 1 (Connective Tissue):** **PASS.** Metabolism -> Accumulation -> Depression. Clear mechanism.
  *   **Step 2 (Local Constraint):** **PASS.** It acknowledges the protocol (every 4 hours) and explains that the *law* of pharmacokinetics outpaced the *rule* of monitoring.
  *   **Step 3 (Counterfactual):** **PASS.** If monitoring had been continuous (or interval shortened), the depression would have been caught. The cause is identified as the *interval* relative to the *drug half-life*.
  *   **Disposition:** **ACCEPT.**
  *   **Why:** This is the hard result. Logically, this is a valid explanation. It subsumes the event under a biological law and identifies the gap in the safety net.
  *   **The Conflict:** Your Family Advisory Committee will hate this. It sounds like "The patient died because of biology, and we followed the rules." It lacks a villain. It lacks a narrative arc of "interruption" or "fatigue." But the procedure validates it because it is *true* and *actionable* (change the monitoring frequency for renal patients). The procedure tells you the analysis is sound, even if the conclusion is unpopular.

  #### Case 3: The "Immutable Fact" (Staffing Shortage)
  **The Report:** A patient falls attempting to get to the bathroom.
  **The Explanation Section:** "The unit was short two nurses due to call-outs. The remaining staff had 6 patients each. The patient was a fall risk but required assistance for toileting. No staff were available to assist in a timely manner."

  *   **Step 1 (Connective Tissue):** **PASS.** Short staff -> No assistance -> Fall.
  *   **Step 2 (Local Constraint):** **PASS.** It specifies the ratio (6:1) and the patient need (assistance).
  *   **Step 3 (Counterfactual):** **FAIL (Bottoms Out).** If we add one nurse, does the fall not happen? Maybe. But the report states the call-outs were unavoidable (flu season). The explanation bottoms out in a fact nobody in the room can change (regional staffing pool).
  *   **Disposition:** **SEND BACK (with specific instruction).**
  *   **Why:** While factually true, an explanation that relies entirely on an immutable constraint is not useful for a *system* review. Send it back to ask: "Given that staffing was fixed, what *internal* control failed? (e.g., bed alarms, family education, rounding schedules)." Do not accept "we were short" as a terminal explanation.

  ---

  ### What This Procedure Cannot Settle

  You asked for honesty about the limits of this tool. There are two things this checklist will not resolve, and you should expect your committee to raise them.

  **1. The Value of the "Just a Story" Report**
  Sometimes a report will fail Step 1 (it's just a chronology) but contain a detail that "feels" important (e.g., "The doctor seemed angry"). The procedure will flag this as "Fail." However, narratives have value for *sensemaking* even if they lack causal rigor. A story helps staff process trauma. Do not discard these reports; route them to Wellness/Peer Support, not Safety Engineering. This procedure is for *prevention*, not *healing*.

  **2. The "Unpopular Truth" (Case 2)**
  As seen in Case 2, this procedure will validate explanations that feel like victim-blaming or system-exoneration. If the biology killed the patient and the protocol was followed, the procedure says "Accept." Your committee may feel this abdicates responsibility. You must hold the line: A false explanation (blaming a nurse for a protocol failure) prevents learning. A cold truth allows you to change the protocol.

  ---

  ### Confidence and Doubt Assessment

  **Confidence Level:** **75%**
  I am confident this discriminates between *chronology* and *causality* (Step 1) and between *general laws* and *local application* (Step 2). These are structural checks that engineers and nurses can verify against the text.

  **The Weakest Step:** **Step 3 (The Counterfactual Test)**
  This is the step most likely to pass a bad report or fail a good one.
  *   **Why:** It requires the reviewer to simulate a hypothetical scenario ("If we change X..."). This relies on the reviewer's mental model of the system. If the reviewer is optimistic, they will assume an intervention works (False Pass). If they are cynical, they will assume nothing works (False Fail).
  *   **Specific Risk:** In complex systems, causes are rarely singular. Step 3 forces a "If X, then Not Y" binary on a world that is often "If X, then *less likely* Y."
  *   **Mitigation:** When Step 3 is flagged as a [JUDGMENT CALL], require the reviewer to write down *one assumption* they are making about the intervention. (e.g., "I am assuming a distinct label prevents selection error.") This makes the doubt visible rather than hiding it in the checkbox.
