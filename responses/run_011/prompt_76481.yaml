answer: |-
  Your observation cuts to the core of what political scientists call the **Copenhagen Dilemma**: the tension between the necessity of demanding deep structural reform before accession (when leverage is high) and the inability to enforce those same standards after accession (when leverage evaporates). You have identified not merely a bureaucratic inconsistency, but a fissure in the EU's self-understanding.

  You ask for a reconstruction of the implicit theory of political development presupposed by this asymmetry, a scrutiny of its coherence, and a mapping of the concrete changes required to abandon it. I will address these in turn, distinguishing between what the practice *logically requires* (presupposition) and what merely *explains* it (causal mechanism).

  ### I. The Implicit Theory: Teleology and the Ontological Threshold

  The enlargement apparatus presupposes a specific philosophy of history and institutional development. It is not merely a set of rules; it is a narrative.

  **1. The Teleological Premise**
  The practice presupposes that political development is **directional and cumulative**. This is the Kantian-Hegelian inheritance of the European project: history moves toward a rational endpoint (constitutional democracy within a supranational legal order). If history were cyclical, or if decay were as probable as progress, the intense investment in pre-accession conditionality would be irrational gambling. The EU operates on the assumption that "reform" is a vector, not a oscillation.

  **2. The Ontological Threshold (The Moment of Crossing)**
  The practice presupposes that accession is not merely a change in legal status but an **ontological shift** in the nature of the state's political order.
  *   **Before:** The candidate is an external object to be molded. Compliance is transactional (laws for money/access).
  *   **After:** The member is a constituent subject of the order. Compliance is constitutive (laws for belonging).
  The theory claims that at the moment of accession, the source of institutional maintenance shifts from **external coercion** (conditionality) to **internal socialization** (peer pressure, legal integration, political culture). The crossing is "one-way" because the theory assumes that once a state is embedded in the *acquis*, the cost of reversal becomes prohibitively high due to legal entanglement and political stigma.

  **3. The Claim of Irreversibility**
  This is the most critical presupposition. The pre-accession demand for "durability" (Copenhagen criteria) asserts that institutions can be **structurally locked in**. It assumes that if you write the right laws, train the right judges, and build the right agencies *before* entry, they develop a homeostatic capacity to resist political pressure *after* entry. It treats democracy as a machine that, once built correctly, runs itself.

  ### II. Rival Accounts Excluded by the Practice

  By structuring the process this way, the EU quietly excludes three rival theories of political order:

  1.  **The Theory of Permanent Fragility:** This view holds that no constitutional order is self-sustaining and requires permanent external maintenance or threat of sanction. The EU practice excludes this by dismantling the enforcement mechanism (conditionality) precisely when the risk of backsliding remains. If the EU believed this, it would maintain pre-accession leverage indefinitely.
  2.  **The Theory of Equilibrium Unraveling:** This view suggests institutions are equilibria that can unravel without a conscious decision to breach treaties (e.g., through gradual normative erosion rather than legal repeal). The EU practice excludes this by focusing Article 7 on "serious and persistent breaches" (active decisions) rather than structural decay, and by relying on annual reports that lack binding consequences.
  3.  **The Theory of Continuous Becoming:** This view holds there is no endpoint, only a standing risk of decay. The binary distinction between "candidate" (under strict supervision) and "member" (under dialogue-based supervision) excludes this. It asserts there is a finish line.

  ### III. Coherence and the Deflationary Answer

  You ask if the practice is internally coherent or asserts two incompatible things. It is **performatively contradictory**.

  **The Deflationary Reality:**
  You are correct that leverage evaporates at accession. Conditionality is only as strong as the prize. Once membership is granted, the "stick" of exclusion is gone (since expulsion is impossible), and the "carrot" of funds is harder to withhold without treaty changes (as seen in the difficulty of activating the Conditionality Regulation).

  **The Philosophical Contradiction:**
  However, the deflationary answer does not fully explain the *rhetoric* of irreversibility. If the EU knew it was simply losing leverage, it would admit that post-accession backsliding is a manageable risk. Instead, it insists pre-accession that reforms are *irreversible*.
  *   **Assertion A (Pre-accession):** "We must verify durability because once you are in, we cannot easily fix you."
  *   **Assertion B (Post-accession):** "We do not need to verify durability strictly because being in the Union sustains you."

  These are incompatible. Assertion A admits the system is fragile and requires external props. Assertion B assumes the system is robust and self-maintaining. The EU asserts A to justify the rigor of negotiations, and asserts B to justify the laxity of post-accession enforcement.

  **Why insist on irreversibility if leverage is lost?**
  Because the EU requires a **warranty**. Since it cannot legally retain leverage, it must psychologically and technically convince itself that the reforms have been internalized. The demand for "irreversibility" is a leap of faith disguised as a technical benchmark. It is an attempt to "bake in" resilience before the oven is turned off. The incoherence lies in believing that legal transposition (which can be measured) guarantees cultural internalization (which cannot).

  ### IV. Philosophical Underdetermination

  Where is the practice underdetermined? Where does it hope rather than know?

  1.  **Law vs. Culture:** The screening process measures *legal transposition* and *institutional capacity*. It presupposes these are proxies for *political will*. This is underdetermined. A government can have a perfectly staffed judicial council (capacity) that is politically captured (will). The practice assumes the former prevents the latter.
  2.  **Socialization Mechanism:** The theory assumes that sitting in Council meetings and being subject to ECJ rulings socializes elites into compliance. This is empirically underdetermined. We have seen elites use EU forums to legitimize illiberal agendas rather than abandon them.
  3.  **The Nature of "Values":** Article 2 TEU values are treated as entry criteria, but functionally operate as membership privileges. The practice is underdetermined on whether these values are *constitutive* (you cease to be European if you lose them) or *conditional* (you keep your seat but are scolded). Article 7 suggests the former, but the unanimity requirement makes it functionally the latter.

  ### V. The Counterfactual: A "Permanent Candidate" Union

  If the Union were to abandon the teleological view and adopt the view that **every member state remains, permanently, a candidate** (i.e., that democracy requires permanent external maintenance), the following concrete changes would be necessary:

  **1. Treaty Changes (The Nuclear Option)**
  *   **Expulsion Mechanism:** Introduction of a clause allowing for the suspension or termination of membership rights (or expulsion) based on a qualified majority vote, rather than unanimity. This restores the ultimate leverage.
  *   **Reversibility of Rights:** Explicit treaty provision allowing for the temporary suspension of voting rights or access to specific funds based on Rule of Law Report findings, without needing to trigger Article 7.

  **2. The Reporting Cycle (The Monitoring Option)**
  *   **Uniform Standards:** Abolish the distinction between "Country Reports" (candidates) and "Rule of Law Reports" (members). All states undergo the same granular, chapter-by-chapter screening annually.
  *   **Benchmarking:** Reintroduce "closing and opening" of chapters for members. If a member backslides on Chapter 23 (Judiciary), that chapter is formally "reopened," and specific funds linked to that chapter are frozen until benchmarks are met again.

  **3. Financial Architecture (The Leverage Option)**
  *   **Permanent Conditionality:** Make the entire budget, not just the recovery fund or cohesion policy, subject to rule-of-law conditionality. Currently, only specific funds are vulnerable. A "permanent candidate" model would treat membership dues and receipts as contingent on compliance.
  *   **Clawback Mechanisms:** Legal mechanisms to recover funds spent during periods of identified backsliding.

  **4. Institutional Structure**
  *   **Independent Prosecutor:** A European Public Prosecutor's Office with a mandate not just for fraud, but for systemic corruption affecting EU values, empowered to investigate sitting heads of government without national consent.

  ### VI. Conclusion

  Your unease stems from recognizing that the EU enlargement process is a **secular eschatology**. It promises a "end of history" where liberal democracy becomes self-sustaining. The documents you read are the liturgy of that faith.

  The practice is not internally coherent because it tries to solve a political problem (the fragility of democracy) with a legal technique (accession criteria). It demands proof of a future state (durability) that it lacks the power to guarantee.

  If you were to rewrite the philosophy to match the reality—that democracies are fragile and require permanent guardrails—the EU would have to admit it is not a community of destiny, but a **contractual regime of continuous verification**. This would require treating Berlin, Paris, and Sofia exactly as it treats Belgrade or Tirana: as perpetual applicants whose compliance is never assumed, only verified. The reason it does not do this is not philosophical, but existential: to admit that membership does not cure the disease of illiberalism is to admit that the European project itself offers no final safety against the darkness. It is easier to pretend the threshold exists than to acknowledge that we are all, always, on the brink.
