      *   *The Tension:* Pre-accession demands proof of *future* durability (irreversibility) when leverage is high. Post-accession assumes *current* durability despite evidence to the contrary when leverage is low.

  3.  **Identify the Implicit Theory (The "Official" Philosophy):**
