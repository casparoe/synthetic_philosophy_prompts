answer: |-
  This is a sharp argument. It's no wonder your students haven't broken it; it exploits a genuine tension in how the Principal Principle (PP) is often introduced versus how it functions technically. You have constructed a *reductio* that feels compelling because it treats "admissible evidence" as "evidence I am permitted to have," rather than the technical Lewisian constraint it actually is.

  Here is the diagnosis, the repair, and the cost.

  ### The Crack: Step (3) and the Definition of Admissibility

  I would reject **Step (3)**. Consequently, the loose formulation in **Step (1)** is the enabling culprit.

  **Why it looks innocent:**
  In a seminar context, "admissible" naturally reads as "legitimate" or "properly acquired." Your students (and you, in the flow of the argument) are treating the printout as admissible because you came by it honestly (you ran the rig, you read the textbook). It feels like paradigmatic empirical evidence.

  **Why it fails:**
  In Lewis's framework, admissibility is not about epistemic permission; it is about **informational route**. Evidence $E$ is admissible with respect to proposition $A$ only if $E$ provides information about $A$ *only* by providing information about the chance of $A$.

  The proposition in Step (3) is $F$: "All thousand entries are faithful."
  Your evidence is $P$: "I hold a printout logging 497 decays."

  $P$ is **inadmissible** with respect to $F$. Why? Because $P$ gives you information about $F$ *directly*, not via the chance function. The printout is the very thing whose fidelity is in question. To use PP to set your credence in $F$ conditional on holding $P$ is to treat $P$ as if it were historical history *prior* to the chancy process of recording, when in fact $P$ is the *output* of that process.

  Lewis's PP is time-indexed: $Cr_t(A | T \& E) = Ch_t(A)$.
  *   If $t$ is *before* the recording: $Ch_t(F) = 0.99^{1000}$. But at $t$, you do not have evidence $P$. So Step (3) cannot run.
  *   If $t$ is *after* the recording: You have evidence $P$. But at $t$, the chance $Ch_t(F)$ is either 0 or 1 (the recording either was faithful or it wasn't; the chancy process is complete). So Step (2) is false at this time.

  You cannot simultaneously hold the *setup chance* (0.99) and the *outcome evidence* (the printout) in the PP formula for the proposition "The outcome matches the record." The printout is inadmissible evidence for the fidelity of the printout.

  ### The Price Tag

  You asked what the repair costs and whether PP becomes mere bookkeeping.

  **1. The Repair:**
  You must tighten Step (1) to the standard Lewisian formulation:
  > $Cr_t(A | T \& E) = Ch_t(A)$, provided $E$ is admissible at $t$ regarding $A$.

  And you must clarify that evidence consisting of the *outputs* of a chancy process is inadmissible for propositions concerning the *accuracy* of those outputs.

  **2. The Cost:**
  The cost is that PP loses its grip on **posteriors** regarding measurement reliability. PP becomes a principle about setting **priors** and **likelihoods**, not a principle for determining belief after data is in hand.
  *   **Before the experiment:** PP tells you to set your credence that the machine *will* record faithfully at 0.99 per slot.
  *   **During analysis:** You use Bayes' Theorem. You use the PP-derived chances to construct your likelihood function $P(Data | T)$.
  *   **After the experiment:** You do not use PP to evaluate the data. You use Bayes.

  **3. Is it just bookkeeping?**
  No, but it is narrower. It remains substantive because it constrains how rational agents must structure their probabilistic models *before* engaging with the world. It forbids you from starting with a credence of 0.9 in "Heads" for a fair coin *before* the toss. It mandates that your likelihood functions reflect the objective chances.
  However, it does concede that **PP + Data $\neq$ Knowledge**. You need PP + Data + Bayes. Your argument successfully shows that PP *alone* cannot bridge chance and credence for situated agents *after* the fact. That is not a bug; it's a feature. PP is the bridge from Chance to Prior; Bayes is the bridge from Prior + Evidence to Posterior. Your argument tries to make PP do both jobs.

  ### Regarding Step (4)

  You noted you don't think knocking out (4) kills the argument. You are right, but for the same reason.
  Step (4) claims PP demands your credence in the specific sequence be $2^{-1000}$.
  Again, once you *see* the sequence, that sequence is no longer a chancy future; it is admissible history (mostly). But the proposition "This specific sequence occurred" is trivially true given your evidence.
  If the proposition is "This specific sequence was *produced by decay*," then we are back to the fidelity problem in Step (3).
  If the proposition is simply "The printout reads X," your credence should be 1. PP doesn't apply because the chance of "The printout reads X" (given the printout exists) is 1.
  If the proposition is "The world contained sequence X," PP applies, but your evidence (the printout) is inadmissible for the reasons above.
  So, rejecting (3) via admissibility automatically neutralizes (4).

  ### Confidence and Vulnerability

  **Confidence:**
  I am **90% confident** in this diagnosis. It aligns with the standard Lewisian defense against "undermining" and measurement-error objections. The confusion between "evidence I possess" and "admissible evidence" is the most common failure mode in teaching PP, and your argument is a perfect storm of that confusion.

  **The Vulnerability (Where I might be wrong):**
  The one place I am most likely wrong is in the **definition of admissibility** itself.
  Lewis never gave a fully satisfactory, non-circular definition of admissibility. He essentially said, "Admissible is what doesn't tell you about the future except via chances."
  A clever student might argue: *"But the printout is about the past. The recording is done. Why is past evidence inadmissible?"*
  The Lewisian reply is: *"Because it's evidence about the past that was generated by a chancy process whose fidelity is in question. It acts like a crystal ball for the fidelity proposition."*
  But if your seminar has been discussing **Humean Supervenience**, there is a deeper threat. If chances supervene on frequencies, then the actual fidelity of the record *determines* the truth of $T$. If the record is unfaithful, $T$ might be false (because the best system might change). This is the **Undermining Future** problem (transposed to the past).
  If a student brings up the **New Principle** (Hall/Lewis), they might argue that PP *should* be replaced by a principle that handles the dependency between truth and chance.
  *   **My weak spot:** I am assuming the "Old Principle" can be saved by admissibility constraints. If your course leans heavily into Humean Supervenience, the "Old Principle" might be deemed unsalvageable regardless of admissibility, requiring the New Principle.
  *   **Advice for class:** Tell them to scrutinize the **definition of admissibility**. Ask them: *"Is information about the past always admissible? If not, why not? And if the printout is inadmissible, what evidence could we possibly use to confirm physical theories?"* That is where the real philosophical work lies.

  ### Summary for the Seminar
  1.  **Reject (3).**
  2.  **Reason:** The printout is inadmissible evidence for the proposition "The printout is faithful."
  3.  **Cost:** PP governs priors/likelihoods, not posteriors. It is not self-defeating; it is just not a complete epistemology on its own.
  4.  **Watch out:** The vagueness of "admissibility" is the soft underbelly of the defense.

  You can sleep soundly; the principle isn't broken, but your argument successfully proves that PP is not a substitute for Bayesian updating. That is a valuable lesson in itself.
