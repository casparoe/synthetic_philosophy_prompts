answer: |-
  # Diagnostic Decision Tree: The Universalizability Test

  **Instructions:** This instrument is designed to locate your interpretation of the universalizability test within the logical space of possible readings. It does not matter what labels you have heard in lectures or secondary texts. Answer each node based on your considered judgment of how the test *must* work to yield the results Kant claims. Record your option letter (A, B, or C) for each of the eight nodes. At the end, match your pattern to the Leaves to identify your reading.

  ### The Nodes

  **Node 1: The Borrowing Description (Maxim Specificity)**
  Consider the case of the person who borrows money knowing they cannot repay it. To apply the test, we must formulate the rule they are following. Which description is the correct one to test?
  *   **A.** "I will borrow money when I need it." (General)
  *   **B.** "I will borrow money when I need it, knowing I cannot repay." (Specific to the case)
  *   **C.** "I will borrow money to buy a luxury item when I am desperate." (Includes motive/context)

  **Node 2: The Description Authority (Who Fixes the Maxim)**
  Who decides whether the description chosen in Node 1 is the correct one?
  *   **A.** The agent alone, based on what they consciously intended.
  *   **B.** An objective observer, based on the natural features of the action.
  *   **C.** Whichever description allows the test to yield a determinate moral verdict.

  **Node 3: The Promise Breakdown (False Promise Diagnosis)**
  In the false promise case, why does the universalized version fail?
  *   **A.** The very concept of a "promise" becomes meaningless; the words lose their definition.
  *   **B.** The practice of promising remains conceivable, but no one would trust promises anymore, so the agent's plan fails.
  *   **C.** It is not that the plan fails, but that the agent cannot rationally choose to live in that world.

  **Node 4: The Cold-Hearted Agent (The Indifferent Case)**
  Consider the person who refuses to help others. Suppose this person genuinely does not care if others help them in the future; they prefer a world of total independence. Does the test condemn them?
  *   **A.** Yes, they fail the test regardless of their personal preferences.
  *   **B.** No, if they truly do not will the end (receiving aid), they cannot be contradicted in willing the means.
  *   **C.** They fail, but only because it is irrational to prefer isolation, not because of the test structure itself.

  **Node 5: The Lazy Talent (Grounds for Failure)**
  Consider the person who neglects their natural talents to pursue pleasure. Why does this rule fail the test?
  *   **A.** Because nature has given us these capacities for a purpose, and we cannot will their destruction.
  *   **B.** Because a rational agent necessarily wills the development of their powers as means to their ends.
  *   **C.** It does not fail unless the agent has a specific future goal that requires those talents.

  **Node 6: The Source of Wrongness (Criterion vs. Procedure)**
  What is the relationship between the test and moral wrongness?
  *   **A.** An act is wrong *because* it fails the test. (The test creates the verdict).
  *   **B.** An act fails the test *because* it is already wrong. (The test discovers the verdict).
  *   **C.** The test is merely a heuristic tool for agents to check their own consistency, not a definition of wrongness.

  **Node 7: The Mistaken Tester (Procedural Error)**
  Suppose an agent performs a forbidden action but describes their maxim poorly (e.g., too generally) and passes the test. Have they acted permissibly?
  *   **A.** Yes, they followed the procedure correctly given their understanding.
  *   **B.** No, the act was forbidden, and their failure to describe it correctly does not change that.
  *   **C.** It depends on whether their misunderstanding was reasonable.

  **Node 8: The Passing Grade (Sufficiency)**
  If a maxim passes the universalizability test, is the action fully permissible?
  *   **A.** Yes, passing establishes permissibility.
  *   **B.** No, passing only shows the action is not forbidden *by this specific formula*; other duties might still rule it out.
  *   **C.** No, passing only shows the action is logically consistent, not that it is moral.

  ***

  ### The Leaves

  Match your sequence of eight letters to the patterns below. If your pattern does not match exactly, choose the Leaf with the most overlapping answers.

  **Leaf 1: The Orthodox Two-Test Reading**
  *   **Conventional Name:** Orthodox / Traditional Reading
  *   **Answer Pattern:** 1B, 2B, 3A, 4A, 5A, 6A, 7B, 8A
  *   **Most Awkward Commitment:** You must explain how a social practice (promising) can be "logically" impossible in the same way a square circle is, without relying on empirical facts about human trust.
  *   **Diagnosis:** You distinguish strictly between rules that become inconceivable (promises) and rules that become un-willable (aid/talents). You believe the test is the ultimate source of moral truth and that passing it is enough to permit an action.

  **Leaf 2: The Practical Contradiction Reading**
  *   **Conventional Name:** Practical Contradiction / Korsgaardian Reading
  *   **Answer Pattern:** 1B, 2B, 3B, 4A, 5B, 6A, 7B, 8A
  *   **Most Awkward Commitment:** You must explain why the agent *must* will the development of talents or the aid of others as necessary means to *any* end, even if they claim they don't need them.
  *   **Diagnosis:** You see the failure in the false promise case as the destruction of the institution required for the act to succeed, not a logical contradiction in terms. You believe the test defines wrongness, but the contradiction lies in the agent's own purposes being defeated.

  **Leaf 3: The Universal Prescriptivism Reading**
  *   **Conventional Name:** Harean / Prescriptivist Reading
  *   **Answer Pattern:** 1C, 2A, 3B, 4B, 5C, 6C, 7A, 8A
  *   **Most Awkward Commitment:** You must accept that a consistent moral monster (like the Cold-Hearted Agent) who universalizes their preference for isolation is acting morally permissibly.
  *   **Diagnosis:** You treat the test as a check on the logical consistency of moral language and preferences. If the agent's preferences are consistent when universalized, the act is permitted. The agent's own description of their motive is decisive.

  **Leaf 4: The Deflationary Reading**
  *   **Conventional Name:** Deflationary / Empty Test Reading
  *   **Answer Pattern:** 1C, 2C, 3A, 4A, 5A, 6B, 7B, 8B
  *   **Most Awkward Commitment:** You must admit that the test itself does no substantive work; the moral heavy-lifting is done entirely by how you choose to describe the maxim in Node 2.
  *   **Diagnosis:** You believe the test is indeterminate until the maxim is fixed, and since the maxim can be fixed in ways that guarantee any outcome, the test is merely a formal shell for prior moral intuitions.

  **Leaf 5: The Necessary Condition Reading**
  *   **Conventional Name:** Necessary but Not Sufficient Reading
  *   **Answer Pattern:** 1B, 2B, 3B, 4A, 5B, 6A, 7B, 8B
  *   **Most Awkward Commitment:** You are left without a positive guide; you can tell students what is forbidden, but you cannot tell them what is obligatory or permissible solely using this test.
  *   **Diagnosis:** You view the test as a filter that removes impermissible actions but does not certify the remaining ones as good. Passing removes a disqualifier but does not establish permission.

  **Leaf 6: Unnamed Position**
  *   **Conventional Name:** Unnamed
  *   **Answer Pattern:** 1A, 2A, 3A, 4B, 5C, 6C, 7A, 8A
  *   **Most Awkward Commitment:** You hold that very general descriptions ("I will borrow money") are the correct ones to test, which makes almost all borrowing impermissible, while simultaneously allowing the agent's subjective intent to override the verdict.
  *   **Diagnosis:** This combination suggests a radical subjectivism about maxims combined with a rigid logical interpretation of the outcome. It is theoretically possible but rarely defended.

  ***

  ### Unoccupied Combinations

  The following answer combinations are logically possible but effectively unoccupied in the literature.

  **1. The "Logical Monster" (Node 3A + Node 4B)**
  *   **Combination:** You claim the false promise fails because words lose meaning (Logical), but the cold-hearted agent passes because they don't care about aid (Preference-based).
  *   **Diagnosis:** **Incoherent.** If the test relies on logical impossibility (Node 3A), personal preferences should not be able to override the contradiction (Node 4B). If preferences can save the agent in the Aid case, the Promise case should also be sensitive to whether the agent *needs* the institution of promising. This mix treats one case as objective logic and the other as subjective psychology without justification.

  **2. The "Nature-Free Voluntarist" (Node 5B + Node 4B)**
  *   **Combination:** You claim the talent case fails because rational agents necessarily will their powers (No Nature Premise), but the aid case passes if the agent is indifferent.
  *   **Diagnosis:** **Unattractive.** If rational agency necessarily requires willing the development of talents (Node 5B), it is difficult to explain why that same agency does not necessarily require willing the assistance of others (Node 4B). Usually, the argument for talents and the argument for aid stand or fall together on the grounds of what is essential to agency. Separating them looks arbitrary.

  **3. The "Constructive Insufficiency" (Node 6A + Node 8B)**
  *   **Combination:** You claim the test *makes* the act wrong (Constructivist), but passing the test does *not* make it permissible.
  *   **Diagnosis:** **Unexplored.** If the test is the source of wrongness (6A), then the absence of a failed test should imply the absence of wrongness. Claiming the test creates the 'wrong' verdict but cannot create the 'right' verdict leaves the status of passing actions metaphysically mysterious. It is a stable position, but few interpreters choose to limit the test's constructive power to only negative verdicts.

  ***

  ### Separation Issues

  **Leaf 1 (Orthodox) vs. Leaf 2 (Practical Contradiction)**
  *   **Issue:** These leaves are separated primarily by Node 3 (Promise Breakdown). However, students often answer 3A ("words lose meaning") when they actually mean 3B ("nobody would believe you").
  *   **Resolution:** This difference is often verbal rather than substantive. To separate them genuinely, present a case where the institution survives but the agent's specific goal is thwarted. If they say it still fails, they are Orthodox (3A). If they say it passes, they are Practical Contradiction (3B).

  **Leaf 4 (Deflationary) vs. Leaf 5 (Necessary Condition)**
  *   **Issue:** Both leaves answer Node 8B (Passing is not sufficient). They differ on Node 2 (Authority) and Node 6 (Source).
  *   **Resolution:** These are genuinely distinct. The Deflationary reading thinks the test is empty until we rig the maxim description. The Necessary Condition reading thinks the test has content but doesn't cover the whole of morality. Ask the student: "If we fixed the maxim description perfectly, would the test still leave moral questions unanswered?" If Yes -> Leaf 5. If No -> Leaf 4.

  ***

  ### Advice for the Inconsistent Student

  If a student's answers are scattered (e.g., mixing Leaf 1 and Leaf 3 patterns), they likely answered **Node 6 (Source of Wrongness)** in confusion.

  **Diagnosis:** Students often want the test to *discover* objective wrongness (Node 6B) but also want it to be a *procedure* they run themselves (Node 6C). They treat the test as a thermometer (measuring heat) and a thermostat (creating heat) simultaneously.

  **How to Walk Them Back:**
  Ask the student: *"Imagine we discover that an action passes the universalizability test, but everyone agrees it is morally terrible. Is the test broken, or is the action actually permissible?"*
  *   If they say **"The test is broken,"** they believe the test discovers independent moral truth (Lean toward Leaf 1 or 4).
  *   If they say **"The action is permissible,"** they believe the test creates moral truth (Lean toward Leaf 2 or 3).

  Once they pick one, re-evaluate their answers to Node 3 and Node 4. Usually, their intuition about the Cold-Hearted Agent (Node 4) will snap into alignment once they decide whether the test is tracking independent wrongness or constructing it.
