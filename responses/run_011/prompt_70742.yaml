answer: |-
  # The Register of Blanks

  The light in the Office for Personal Records did not change throughout the morning. It was a diffuse, gray illumination that seemed to originate from the dust suspended in the air rather than the windows high above the filing cabinets. Magda Fellner sat at her desk, which was clear save for a blotter, a pot of ink, and the file currently open before her. She was fifty-four years old. She had worked in this room for twenty-two years. She knew the weight of the paper used for Form 88-B, the specific resistance of the fiber when the steel nib of her pen dragged across it. She was neither kind nor cruel. She was competent.

  The door opened. The man who entered was about forty, wearing a coat that had been brushed carefully but worn thin at the cuffs. He did not look around the room. He walked to the chair opposite Fellner and sat. He placed a folded document on the blotter. It was an application for the Clean Sheet.

  Fellner did not smile. She did not offer water. She opened the file folder labeled with his name. Inside was the history the state held: dates of arrest, indices of conviction, records of incarceration, probation reports, psychological evaluations. It was a thick stack, bound with twine.

  "You understand the condition," Fellner said. Her voice was low, calibrated to the room's acoustics.

  The man nodded. He looked at the file, not at her. "I understand that if granted, the contents are destroyed. Irreversibly."

  "And the register entry."

  "Yes."

  "The public register will record your name, your last known address, and the date of erasure. It will note that a Clean Sheet was granted. It will not note what was erased."

  "I know."

  "There are private aggregators," Fellner said. She did not look up from the file. "They may retain copies of the data prior to destruction. The state does not govern them."

  "I know."

  "Then sign." She slid the form toward him.

  The man took the pen. He did not hesitate. He signed where the inkwell marked the paper. He was not trembling. He was not seeking absolution; he was seeking a strategic position. Fellner understood this. For a man with a record like this, the state's memory was a weapon. Every time he applied for housing, the record spoke first. It said *criminal*. It said *risk*. If the record was destroyed, the state would say nothing. But the public register would say *this man chose to be unknown*.

  In his neighborhood, the difference was measurable. A criminal record was a permanent status, a definition of character. A Clean Sheet entry was an act of will. It signaled that the past was paid for. It signaled that the man was no longer defined by the state's categorization, but by the state's acceptance of his disappearance. It was a trade of specificity for ambiguity. The neighbors would see the entry in the ledger at the town hall. They would know he had something to hide. But they would not know what it was. They would have to decide whether to trust the man standing before them or the blank space where his file used to be. He had decided that ambiguity was cheaper than conviction.

  Fellner stamped the form. The sound was a dull thud, absorbing into the blotter. She took the file folder and stood. She walked to the back of the room, where a heavy metal bin stood beside a shredding machine. She did not look at the contents as she loosened the twine. She fed the paper into the slot. The machine whirred, a mechanical chewing sound that lasted for forty seconds.

  When the noise stopped, she returned to the desk. She reached into the empty folder and removed a single object that had been clipped to the inside cover: a passport photograph of the man, submitted ten years prior for identity verification. It was not state-created data. It was personal property submitted for evidence. It survived the destruction of the record.

  She placed the photograph on the blotter. "This is returned. It was never held as data. It was held as evidence."

  The man looked at the photograph. It showed a younger version of himself, clean-shaven, looking directly into the lens. He picked it up. He did not put it in his pocket. He placed it in his own wallet, behind a transparent plastic sleeve. He stood up. He did not thank her. He turned and walked to the door. He paused with his hand on the knob, looking at the floor, then opened the door and left. He did not look lighter. He looked like a man who had just paid a significant debt.

  Fellner sat down. She took a fresh sheet of paper from the drawer. This was the log for the Public Register of Voidance. She wrote the man's name, his address, and the date. She wrote *Clean Sheet Granted*. She did not write the offense. She did not write the sentence. She wrote only the fact of the vanishing.

  She stood and walked the log sheet to the next desk over, where Mr. Hertz sat. Hertz was sixty, with spectacles thick enough to distort his eyes. He was responsible for the integrity of the public register. He took the sheet from her. He did not glance at it quickly. He took a ruler and measured the margins. He took a magnifying glass and inspected the ink density of the stamp. He checked the spelling of the man's surname against the application copy Fellner had retained.

  "The address," Hertz said softly. "The street suffix. Is it 'Street' or 'Strasse'?"

  "Street," Fellner said.

  Hertz nodded. He took a fresh pen and corrected a microscopic variation in the loop of the 't'. He was not being difficult. He was ensuring that the blank was legible. If the public record was erroneous, the erasure was compromised. If the state marked a man as vanished but misspelled his name, the vanishing was incomplete. The injury of being known against one's will was compounded by the injury of being known incorrectly. Hertz cared about the truth of the blank. He cared that the nothingness was accurate.

  "Thank you," Fellner said.

  "It must be precise," Hertz replied. He placed the sheet into a tray destined for the town hall archives. He was doing genuine work. He was protecting the integrity of the silence.

  Fellner returned to her desk. She adjusted the blotter. She checked the clock. It was eleven o'clock. She had one appointment remaining.

  The woman who entered did not have a file number. She stood in the doorway for a moment, letting her eyes adjust to the gray light. She was younger than the man, perhaps thirty, wearing a coat that was too thin for the season. She carried a bag that looked heavy. She approached the desk but did not sit.

  "I need to be filed," she said.

  Fellner looked up. "There is no form for creation."

  "I know. I need you to make one."

  "I cannot make forms." Fellner gestured to the stack of official documents beside her inkwell. "There is Form 12 for correction of data. There is Form 88 for erasure of data. There is Form 4 for amendment of address. There is no form for entry."

  "I am not in the system," the woman said. "I have checked. The aggregators have me. They sell my data. They have a score for me. But the state does not hold me. I have no identity number. I cannot open a bank account. I cannot sign a lease. I cannot prove I exist to the people who require state verification."

  "If the aggregators have you, you exist."

  "They have a name they assigned. It is not mine. They have a history they constructed. It is not true. I cannot correct it because I have no standing. I need the state to hold me. If the state holds me, I can contest the aggregators. I need you to remember me."

  Fellner opened a drawer and took out Form 12. She slid it across the blotter. "This is for correction. You must have an existing record to correct."

  "I don't."

  "Then you cannot correct."

  "Create one."

  "The Office for Personal Records administers memory," Fellner said. "It does not manufacture it. We manage what is given. We subtract. We amend. We do not add."

  "That is the law?"

  "That is the procedure."

  The woman leaned on the desk. Her hands were red from the cold. "If I am not in your files, I am not anyone's obligation. The aggregators sell me, but they do not owe me. The state owes me nothing. I am data without a subject. I want to be a subject."

  Fellner looked at the woman. She saw the logic of the plea. The German tradition held that being unknown was the condition of freedom. The American tradition held that transparency was the condition of accountability. This woman was trapped between them. She was too unknown to be free, and too invisible to be accountable. She wanted the ground to stand on. She wanted the state to point its weapon at her, because a weapon implies a target, and a target implies a person.

  "I cannot help you," Fellner said.

  "Is there a supervisor?"

  "I am the adjudicator."

  "Then write a note. Tell them I was here. Make a record of this meeting."

  Fellner looked at the blank sheet of paper before her. She could write a memo. She could file a note of contact. It would enter the office's internal log. It would not enter the Personal Records register. It would not give the woman an identity number. It would not obligate the state to remember her tomorrow. It would only prove that she had stood in this room today.

  If Fellner wrote the note, she would be bending the procedure. She would be creating a record where none was mandated. It would be a small act. It would land on Hertz. He would have to log the contact. He would have to verify the spelling of her name, which she might not be able to prove. He would have to store the paper. It would become work. It would become a precedent. If she did it for this woman, she would have to do it for the next. The office would fill with the ghosts of people demanding to be real.

  Fellner took the pen. She hovered it over the paper. The woman watched the nib. The ink gathered at the tip, a dark sphere waiting to fall.

  Fellner moved the pen to the side. She capped it. She took Form 12 and slid it back into the drawer. She took a different paper, a standard rejection notice. She stamped it. *Ineligible. No Record Found.*

  "You may apply if you obtain a state identity number through the Civil Registry," Fellner said. "Once you have a number, you may apply for correction."

  "I cannot get a number without a record."

  "Then you cannot apply."

  The woman stood still. She did not cry. She did not shout. She looked at the rejection notice. It was a piece of paper that confirmed she was nothing. It was authoritative. It was durable. It was a trace of who she was: someone who was denied.

  "Keep it," Fellner said. "It proves you were here."

  The woman took the paper. She held it with two hands. It was a record of her exclusion. It was better than nothing. It was a negative space that had been acknowledged. She put it in her bag. She turned and walked to the door.

  Fellner watched her leave. She did not feel guilt. She felt the weight of the procedure. The law was not a spectrum from freedom to control. It was a wall. On one side, people paid to disappear. On the other, people begged to be seen. The wall was made of paper.

  Fellner took the rejection notice copy and filed it in the office log. She wrote the time. She wrote the date. She wrote *Appointment Concluded*. She closed the folder. She turned off the desk lamp. The room did not get darker, but the light on the blotter vanished. She stood up. She picked up her coat. She walked to the door. She did not look at the shredding bin. She did not look at the public register tray. She locked the door and walked down the hallway, where the light was the same gray as the room, and the floor was worn smooth by the feet of people who had come to be forgotten.

  ***

  **Afterword**

  The story treats the injury of not being known at all as graver. This commitment becomes visible when Fellner refuses to create a memo record for the woman; the rejection notice becomes the only proof of the woman's existence, a negative trace that confirms her exclusion. The legal machinery is load-bearing. The Clean Sheet is not merely atmospheric; it is the structural engine that creates the asymmetry between the two appointments. If replaced by an ordinary administrative task, the specific tragedy of the woman's inability to demand recognition—and the man's ability to demand erasure—would collapse. The story relies on the specific jurisprudence of memory administration to function.
