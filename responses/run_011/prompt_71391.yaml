prompt: |-
  I have published four novels, and since the spring I have sat as one of three outside members on the editorial board of a literary quarterly: small, venerable, two paid staff, an endowment that loses a little water every year, and something in the neighborhood of four hundred unsolicited manuscripts arriving each month. Nine months ago, without telling the board, the managing editor began using a language model to draft the reply to every declined submission. The old reply was a printed paragraph of thanks. The new ones run two or three hundred words about the particular story — where its pressure sits, what it appears to want, the sentence at which a reader's confidence begins to slip. By every measure we have, they are better than anything this magazine has ever sent anyone. Writers rate the exchange helpful sixty-one percent of the time, against twelve percent under the form note; submissions are up; one woman wrote back four thousand words of argument and then sent us something new; two writers have since published stories whose titles are lifted, apparently affectionately, from a line in their own rejection.

  No one has accused the letters of being wrong, and I am no longer certain that counts as a defense. The system does not tire, does not lose patience, and can assemble in thirty seconds a more careful reading of a story than any of us could manage in an afternoon; it has been fed, so far as we can determine, every issue the magazine has printed since it began. The person on the receiving end has no way to check what it says about her own work and no realistic way to argue with it. When one writer asked point-blank whether a human being had read her story, the reply said that her story had been read with great care and that the reader wanted her to know exactly which paragraph had begun to lose him — true in every particular, and when she forwarded it to me she said she had felt handled rather than answered. The board is now split three ways and I have been asked to write us out of it. The poet who chairs our finance committee wants disclosure on the first line, in plain words, before anything else is said. The managing editor counters that a disclosed letter is a discounted letter, that the writers who most need the reading will file it as machine noise and the whole benefit evaporates, and that we would be surrendering something real for a formality that alters no sentence. A third member wants to go further: extend the system to our acceptance letters, and to the personal notes we send the handful of writers we hope to keep.

  Please draft the memorandum I will circulate before the board meets on the fourteenth. I need a recommendation it can vote on rather than a survey of considerations — whether and how the letters disclose what composed them, what they may and may not claim about who has read a manuscript, whether they may answer a writer who answers them, how long they may go on pressing a point against someone who disagrees, and whether any of this should be extended to acceptances. Give me rules an overworked managing editor could apply on a Tuesday without consulting anyone, and tell me what to do with the four hundred replies already queued for this month. Then make the strongest honest case for the position you are rejecting, the managing editor's above all, since I find hers the harder to answer, and say plainly where you think she wins. Two things I would ask you to avoid: the vocabulary of a compliance document, and any conclusion that amounts to striking a balance. If the right answer is that we should stop sending them, say so, and tell me what we lose by it.
reasoning: |-
  Here's a thinking process that leads to the suggested memorandum:

  1.  **Analyze the Request:**
      *   **Context:** The user is a published novelist and board member of a small, venerable literary quarterly.
      *   **Situation:** The managing editor (ME) secretly started using an AI language model to write rejection letters 9 months ago.
      *   **Results:** The AI letters are detailed, specific, and perceived as "better" than human ones (61% helpful vs. 12%). Submissions are up. Some writers engage deeply (4k word arguments, titling new stories after rejection lines).
      *   **Problem:** The board is split. No one accuses the letters of being *wrong*, but there's an ethical/relational unease ("felt handled rather than answered").
      *   **Task:** Draft a memorandum for the board meeting on the 14th.
      *   **Requirements:**
          *   Must be a recommendation with vote-able rules, not just considerations.
          *   Address: Disclosure, claims about who read the manuscript, responding to writers who reply, persistence in argument, extension to acceptance letters.
          *   Provide actionable rules for an overworked ME.
          *   Address the 400 queued replies for this month.
          *   Make the strongest honest case for the rejected position (specifically the ME's position).
          *   State plainly where the ME wins.
          *   **Constraints:** Avoid compliance vocabulary (no "policy," "guidelines," "compliance," etc.). Do not conclude with "striking a balance" (no compromise middle-ground that satisfies no one).
          *   **Tone:** Literary, thoughtful, decisive, human, authoritative but collaborative.

  2.  **Determine the Stance:**
      *   The prompt asks me to avoid "striking a balance." I need to take a side.
      *   *Option A: Stop using AI.* This honors the "venerable" nature of the magazine and the human connection. But it loses the tangible benefit writers are getting (61% helpfulness).
      *   *Option B: Continue with full disclosure.* This honors transparency but might reduce the perceived value (as the ME argues).
      *   *Option C: Continue without disclosure but with strict limits.* This honors the utility but risks the trust/relationship.
      *   *Decision:* The prompt implies a tension between *utility* and *truth/relationship*. The writer feels "handled." The magazine is "venerable." The core of a literary community is human recognition.
      *   *My Recommendation:* **Disclose.** The relationship between a magazine and a writer is foundational. If the magazine claims to be a steward of literature, it must be honest about its stewardship. The "better" letter is a counterfeit if it pretends to be human. However, I must acknowledge where the ME is right (the quality of the feedback).
      *   *Refinement:* Actually, looking closer at the prompt's constraints ("If the right answer is that we should stop sending them, say so"), I need to be decisive. The "felt handled" comment is the smoking gun. A literary magazine is a human ecosystem.
      *   *Revised Recommendation:* **Disclose and Limit.** The letters can be sent, but they must identify themselves. The claim of "a reader" must be qualified. We cannot pretend a human struggled with the text if a machine processed it.
      *   *Wait, let's look at the "No Balance" constraint.* If I say "Use AI but disclose," is that a balance? Or is it a principle? It's a principle of honesty. If I say "Stop using AI," that's a principle of humanism.
      *   *The ME's argument:* Disclosure ruins the utility. Writers need the help, not the metadata.
      *   *The Counter-argument:* The help is predicated on a lie. The "help" is patronizing if the source is hidden.
      *   *Final Decision:* I will recommend **Disclosure**. The magazine's currency is trust. The AI can stay, but the mask must come off. This is not a balance; it's a condition of use.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format but literary in tone.
      *   **Opening:** Acknowledge the situation without jargon. State the purpose: a decision, not a discussion.
      *   **The Recommendation (The Rules):**
          1.  *Disclosure:* First sentence must state the nature of the reading.
          2.  *Attribution:* Cannot claim "I read" or "a reader lost confidence." Must use passive or specific phrasing ("The analysis suggests...").
          3.  *Dialogue:* If a writer replies, a human must respond. No AI arguing with a human.
          4.  *Acceptances:* Humans only. Acceptance is a handshake, not a transaction.
          5.  *The Queue:* The 400 queued letters need to be purged or rewritten. Sending known AI letters without disclosure now is untenable.
      *   **The ME's Case (The Strongest Argument for the Opposition):**
          *   Why is she right? Because the writers *benefit*. The ego of the institution matters less than the growth of the writer. If the medicine works, does it matter if the bottle is labeled "synthetic"? The "magic" of the letter relies on the illusion of human struggle. Disclosure kills the magic.
          *   Where she wins: She wins on the *quality* of the feedback. We must admit the machine reads better than we do.
      *   **The Conclusion:** What we lose. We lose the efficiency. We lose the "perfect" critique. But we keep the covenant.

  4.  **Refining the Tone:**
      *   Avoid: "Policy," "Guideline," "Compliance," "Stakeholder," "Mitigate," "Balance."
      *   Use: "Covenant," "Promise," "Voice," "Truth," "Work," "Hands."
      *   The voice should sound like a novelist writing to other literary people. Elegant, firm, slightly melancholic but resolute.

  5.  **Addressing Specific Constraints:**
      *   *400 queued replies:* Must be deleted or rewritten. Cannot send them as is.
      *   *ME's victory:* Acknowledge the machine's superiority in close reading.
      *   *No Balance:* The recommendation is "Disclose or Don't Send." Not "Disclose sometimes."

  6.  **Drafting - Iteration 1 (Mental Outline):**
      *   To: Board.
      *   From: Me.
      *   Subject: The Letters.
      *   We are doing this: Disclose.
      *   Rules: Say it's AI. Don't say "I read." Humans answer replies. No AI for acceptances.
      *   Queue: Delete them.
      *   ME is right about: The quality. The machine is smarter.
      *   We lose: The helpfulness.
      *   But we keep: Our soul.

  7.  **Drafting - Iteration 2 (Fleshing out the prose):**
      *   Need to make it sound less like a list and more like an essay that concludes with rules.
      *   The "ME wins" section needs to be very strong. She is arguing for the writer's benefit over the magazine's purity. That's a noble stance.
      *   The "What we lose" needs to be specific. We lose the 61% helpfulness rating potentially.

  8.  **Final Polish (checking against constraints):**
      *   Did I use compliance vocabulary? (Check: "Protocol" might be risky, use "Practice" or "Rule". "Compliance" is definitely out.)
      *   Is there a balance? (Check: The recommendation is absolute. Disclosure is mandatory.)
      *   Did I address the 400 letters? (Yes.)
      *   Did I address the ME's victory? (Yes.)

  9.  **Final Review of the "ME Wins" section:**
      *   The prompt asks: "make the strongest honest case for the position you are rejecting... and say plainly where you think she wins."
      *   I need to ensure I don't undermine my recommendation while praising hers. Her win is on the *merit of the text*, not the *ethics of the transmission*.

  10. **Writing the Memo.** (Proceeding to generate output based on these thoughts.)
answer: |-
  **MEMORANDUM**

  **TO:** The Editorial Board
  **FROM:** [Your Name]
  **DATE:** October 10
  **SUBJECT:** The Composition of Our Replies

  We are a magazine that trades in attention. Our endowment shrinks, our staff is small, and our reputation rests on the idea that what arrives in our slush pile matters enough to be witnessed. For the last nine months, we have witnessed four hundred manuscripts a month using a tool that does not tire. We have produced criticism that is sharper, kinder, and more precise than what we managed when we were humanly exhausted. Writers tell us they are helped. Some are writing better stories because of our rejections.

  This is a good thing. It is also a lie.

  When a writer receives a note saying a reader's confidence began to slip at paragraph three, they understand that a human eye faltered. They understand that their work was heavy enough to burden another person. If that burden was not felt, if the slippage was calculated rather than experienced, the transaction is not literary. It is administrative. We are in the business of literature, not administration.

  Therefore, I am recommending we continue to use the model to draft these letters, but under a strict covenant of truth. We will not strike a balance between efficiency and honesty. We will choose honesty, and accept the cost.

  **The Rules**

  1.  **The First Sentence:** Every rejection generated by the model must state its origin in the opening line. It need not be apologetic, but it must be plain. *This response was drafted with the assistance of a language model trained on our archive.* Anything less is a disguise.
  2.  **Claims of Reading:** The text may not claim a human experience of the work. It cannot say "I lost confidence" or "I felt the pressure ease." It must speak to the text, not the reader's psyche. It may say, *The narrative tension dissipates in the third section,* but it may not say, *I found myself disengaging in the third section.* We cannot claim a heartbeat we do not have.
  3.  **The Reply to Replies:** If a writer answers a rejection—whether with four thousand words of argument or a simple query—a human being must write the response. We cannot allow a machine to argue with a person. That is not dialogue; it is a loop.
  4.  **Acceptances and Personal Notes:** The model is forbidden from drafting acceptance letters or personal correspondence to contributors. An acceptance is an invitation into a community, not an assessment of a product. That handshake must be flesh on flesh.
  5.  **The Current Queue:** The four hundred replies currently queued for this month must be deleted. They were composed under the old pretense. To send them now, knowing what we know, would be to knowingly deceive four hundred writers. We will absorb the delay. We will rewrite them under the new rules, or send the old form note until we can do the work properly.

  **The Case for the Managing Editor**

  I am rejecting the Managing Editor's proposal to withhold this information, but I want to record clearly where she is right, because her argument is the harder one to live with.

  She argues that the value of the letter lies in its effect on the writer, not its provenance. If a writer reads a critique, learns from it, and improves their art, the utility is real regardless of the source. She is correct that disclosure changes the reception. A writer who knows a machine wrote the note may file it as noise, even if the note is brilliant. By insisting on disclosure, we are prioritizing the magazine's integrity over the writer's potential growth. We are saying that our cleanliness matters more than their improvement.

  She wins on the matter of quality. We must admit, plainly, that the model reads better than we do. It has consumed our entire history. It does not skim. It does not hold a grudge. It does not have a bad morning. The specific, granular feedback it offers is superior to the human standard we previously set. If our mission is solely to make writers better, she is right. We should hide the machinery and let the work speak.

  She also wins on the point of formality. She argues that disclosing the tool turns a moment of literary connection into a terms-of-service agreement. She believes we are surrendering a real benefit for a symbolic gesture. In a world where writers are ignored by most journals, we have found a way to give them attention. She asks if it is moral to take that attention away because we are offended by the method of its delivery.

  **What We Lose**

  If we adopt these rules, we will lose the 61% helpfulness rating. We will lose the writers who title their stories after our lines but would not title them after a algorithm's. We will lose the efficiency that allowed two paid staff to manage four hundred manuscripts a month without burnout. We will have to spend time we do not have answering the writers who write back.

  We lose the comfort of being smarter than we are.

  But we keep the covenant. A literary magazine is not a service provider; it is a gathering. If we invite writers into a room, we must tell them if the people they are speaking to are real. We can use the tool to sharpen our eyes, but we cannot lend it our names.

  I ask that we vote on this recommendation as written. We either tell the truth, or we stop sending the letters. There is no middle ground where we pretend to be human when we are not.

  [Your Name]
