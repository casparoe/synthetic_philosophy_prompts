      *   *Decision:* The principle implies **Huck** and **Mom** are high worth, but **Shopkeeper 2** is better *character*. The user wants to rank Mom > Shopkeeper. This is consistent with "Moral Worth" but inconsistent with "Virtue." I will advise them that keeping Mom > Shopkeeper requires accepting that **struggle signals commitment** more than **ease signals virtue**.
