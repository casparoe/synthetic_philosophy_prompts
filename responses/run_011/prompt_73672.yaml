answer: |-
  **The phenomenon, precisely stated**

  This pattern is a symmetric dialectical maneuver regarding **outcome individuation**. It occurs when disputants alter the granularity of an outcome's description mid-argument to immunize a causal thesis against counterfactual challenge. For the pattern to be present, three conditions must hold: (1) both sides accept the coherence of the counterfactual antecedent; (2) the defender of inevitability coarse-grains the outcome (e.g., "industrialization" rather than "the British Industrial Revolution") to absorb the counterfactual; and (3) the defender of contingency fine-grains the outcome (e.g., "a liberal democracy" rather than "democracy") to resist that absorption. The debate becomes unproductive not because facts are disputed, but because the identity conditions for the *explanandum* shift tactically without explicit justification, rendering the causal claim compatible with any possible world.

  **Nearest established concepts**

  **1. Event Individuation (Philosophy of History)**
  This concept concerns the metaphysical criteria for determining when two descriptions refer to the same historical event (e.g., Davidson's or Kim's theories of event identity). It captures the core ontological problem: is the Soviet collapse identical to a reformist transition? However, individuation theory is descriptive, not dialectical. It provides the vocabulary for the dispute but does not diagnose the *tactical shifting* of criteria. It explains why the disagreement exists, but not why the argument stalls.

  **2. Causal Robustness or Insensitivity (Philosophy of Science)**
  In interventionist accounts of causation (e.g., Woodward), a causal relationship is robust if the outcome remains invariant under changes to background conditions. The inevitability argument relies on claiming high robustness. This concept captures the "inevitability" side's move perfectly: they argue the outcome is insensitive to the specific trigger. However, it fails to capture the contingency side's reverse maneuver. Robustness theory assumes a fixed outcome variable; it does not account for an opponent who changes the variable's definition to deny robustness.

  **3. The Reference Class Problem (Probability and Statistics)**
  This problem arises when an event can belong to multiple classes, each with different probabilities. Assigning a probability to "Napoleon losing" depends on whether the class is "battles," "French campaigns," or "wars against coalitions." This closely mirrors the granularity shift: inevitability arguments widen the reference class (increasing probability), while contingency arguments narrow it (decreasing probability). The fit breaks down because the reference class problem is usually a static epistemic limitation, whereas your phenomenon is a dynamic, motivated manipulation of the class during argumentation.

  **4. Conceptual Stretching (Political Methodology)**
  Sartori's concept describes extending a concept to cover more cases, losing precision (connotative strength) to gain extension. The inevitability defender stretches "Industrial Revolution" to cover any growth spurt. This captures the loss of discriminatory power. However, conceptual stretching is typically unidirectional (broadening). It does not account for the symmetric, reciprocal narrowing performed by the contingency defender, nor does it address the temporal aspect of the shift occurring *in response* to a specific counterfactual challenge.

  **Best fit**

  The closest existing framework is the **Reference Class Problem**, specifically as applied to counterfactual reasoning by scholars like Philip Tetlock or Aaron Belkin. They note that counterfactual validity depends on how broadly the antecedent and consequent are categorized. However, there is no single canonical label for the *symmetric, tactical shifting* of this granularity mid-debate. While "outcome individuation" names the metaphysical issue, and "conceptual stretching" names the broadening move, the literature lacks a specific term for the dialectical oscillation between the two to protect a thesis. I am unsure if a specific named fallacy exists for this precise reciprocal maneuver; it appears to be an unrecognized hybrid of individuation disputes and motivated reasoning.

  **A name and a definition**

  I propose the term **Motivated Granularity Shift**.

  **Definition:** A dialectical failure in counterfactual history where a disputant alters the level of abstraction used to describe an outcome variable solely to preserve a causal claim against a specific challenge, without offering independent justification for the new level of description.

  **Conditions:**
  1.  **Invariance Claim:** A thesis asserts $C$ causes $E$.
  2.  **Counterfactual Challenge:** An opponent posits $\neg C$.
  3.  **Granularity Adjustment:** The proponent re-describes $E$ as $E_{broad}$ (to claim $E_{broad}$ still occurs) or the opponent re-describes $E$ as $E_{narrow}$ (to claim $E_{narrow}$ does not occur).
  4.  **Lack of Justification:** The shift is not grounded in prior theoretical commitment or operational definitions.

  **Exclusions:** This definition excludes legitimate conceptual clarification (where terms are defined before the debate) and substantive empirical claims about robustness (where the broadening is the actual hypothesis being tested, not a retreat).

  **Boundary cases**

  **1. The Corrective Re-specification (Not the Phenomenon)**
  A historian claims "The Industrial Revolution was inevitable." A critic notes the term conflates technological innovation with sustained growth. The historian agrees to restrict the claim to "sustained per-capita growth."
  *Verdict:* This is **not** Motivated Granularity Shift. The original claim was empirically imprecise. Refining the *explanandum* to match measurable data is methodological rigor, not a dodge, provided the refinement is maintained consistently thereafter.

  **2. The Robustness Hypothesis (Not the Phenomenon)**
  A scholar argues that "State formation" occurs in any agrarian society reaching a certain population density, regardless of specific wars. They test this against counterfactuals by looking for *any* state formation.
  *Verdict:* This is **not** the phenomenon. Here, the coarse grain ("state formation") is the substantive empirical thesis itself, explicitly stated in advance. The claim is about the size of the "basin of attraction" for the outcome, not a post-hoc rescue of a specific historical narrative.

  **3. The Constitutive Feature (Is the Phenomenon)**
  A debate on the fall of Rome. The inevitability defender says "political fragmentation was inevitable." When shown a counterfactual where unity holds, they say "economic decline still happened." The contingency defender says "without political fragmentation, it isn't the Fall of Rome."
  *Verdict:* This **is** Motivated Granularity Shift. Political fragmentation is arguably constitutive of the "Fall." Swapping it for "economic decline" changes the event identity to save the "inevitability" label. The grain shifts to protect the word "Fall" while emptying it of its standard meaning.

  **What would settle it**

  To resolve this, disputants must **pre-register the outcome metric**. Before debating causation, they must agree on the similarity metric for the outcome: What features are essential (constitutive) and which are accidental (variable)? For example, "Industrial Revolution" must be operationalized as a specific percentage of GDP shift in a specific timeframe, not "modernization." Settling the grain requires treating the outcome description as a falsifiable constraint: if the counterfactual produces a result outside the pre-agreed operational bounds, the inevitability claim is falsified, regardless of whether a *similar* outcome occurred. The parameter becomes arguable when the cost of granularity (loss of specificity) is explicitly weighed against the benefit (causal robustness).
