answer: |-
  This is a fantastic puzzle for a reading group because it forces you to separate Popper's *demarcation criterion* (falsifiability) from his *sociology of science* (how scientists actually behave when theories are threatened). Popper's own shift on Darwinism proves he was capable of updating his application of the rules without abandoning the rules themselves.

  Here is a breakdown of the candidate rules consistent with his record up to 1978, how they apply to Kimura's Neutral Theory, the verdict on his Darwin reversal, and a tie-breaking case.

  ### 1. Candidate Rules (Consistent with Popper pre-1978)

  To extrapolate Popper's view, we need to isolate the principles underlying his specific verdicts on Freud, Marx, Einstein, and Newton.

  *   **Rule A: The Logical Snip (Strict Falsifiability).**
      *   *Principle:* A theory is scientific only if it logically forbids specific observable states of affairs. If no observation can contradict it, it is pseudoscience.
      *   *Source:* Freud (nothing refutes them), Einstein (light bending could have been wrong).
      *   *Constraint:* Modifications to a theory are suspect if they reduce the class of forbidden states.

  *   **Rule B: The Degeneration Test (Ad Hoc Rescue).**
      *   *Principle:* A theory becomes pseudoscientific not when it is falsified, but when its proponents employ "conventionalist stratagems" to immunize it from falsification. If a modification is introduced *solely* to explain away an anomaly without generating new testable predictions, the programme is degenerating.
      *   *Source:* Marx (reinterpretations to save the theory), Newton (accepted despite falsification *until* it stopped generating new discoveries).
      *   *Constraint:* Modifications are acceptable only if they increase empirical content (predict something new).

  *   **Rule C: The Metaphysical Heuristic.**
      *   *Principle:* A theory can function as a "metaphysical research programme." It is not science *yet* if it lacks immediate testability, but it is legitimate if it stimulates the growth of empirical science. It crosses into science when it yields testable offspring.
      *   *Source:* His later view on Darwin (1978), but hinted at earlier regarding atomic theory (which was metaphysical before it was testable).
      *   *Constraint:* The theory must eventually "stick its neck out," even if the core idea starts as a definition or heuristic.

  ### 2. Verdicts on the Neutral Theory

  Here is how each rule judges Kimura's Neutral Theory and its subsequent modifications (Generation-time correction and Ohta's Nearly Neutral Theory).

  *   **Rule A (Logical Snip):** **Verdict: Science.**
      *   *Reasoning:* The core claim (substitution rate = mutation rate) is logically distinct from observation. If the molecular clock ticked at a rate unrelated to mutation, or if functional DNA changed faster than non-functional DNA, the theory would be dead. It sticks its neck out.
      *   *Complication:* The "Nearly Neutral" shift widens the definition of "neutral." Rule A worries this makes the term slippery, but as long as "nearly neutral" is defined by biochemical constraints rather than survival outcomes, it passes.

  *   **Rule B (Degeneration Test):** **Verdict: Borderline / Contested.**
      *   *Reasoning:* This is the danger zone. When the molecular clock varied by generation time, adding a correction looks like a patch. When Ohta introduced the "Nearly Neutral" theory to account for population size effects, a strict Popperian might smell a Marxist rescue: *"Why did the prediction fail? Oh, because those mutations weren't strictly neutral, they were 'nearly' neutral."*
      *   *Defense:* However, the Nearly Neutral theory didn't just excuse the past; it predicted that small populations should accumulate slightly deleterious mutations faster than large ones. This is a *new* testable prediction. If Popper sees the modification as increasing empirical content, it passes. If he sees it as making the theory flexible enough to fit any data, it fails.

  *   **Rule C (Metaphysical Heuristic):** **Verdict: Science (Progressive Programme).**
      *   *Reasoning:* Even if the core definition of "neutrality" is hard to pin down, the theory revolutionized molecular biology. It shifted the focus from adaptation to history and constraint. It functioned as a research programme that generated massive amounts of testable work (e.g., the McDonald-Kreitman test).

  ### 3. Best Single Guess

  **Popper would rule the Neutral Theory as Science.**

  **Why?**
  1.  **It solves his specific Darwin objection:** In 1974, Popper hated Darwinism because "fitness" was defined by "survival," making it a tautology. Neutral Theory defines "neutrality" biochemically (no effect on function), independent of survival. This removes the tautology trap that bothered him most.
  2.  **The modifications are "Neptune-style," not "Marx-style":** Popper distinguished between *ad hoc* rescues that reduce testability (Marx) and auxiliary hypotheses that preserve a core theory while opening new testing avenues (the discovery of Neptune to save Newton's gravity). The "Nearly Neutral" shift introduced population size ($N_e$) as a new variable. This allowed for *more* precise testing (e.g., comparing island vs. mainland populations), not less.
  3.  **The 1978 Retraction:** By the time he retracted his criticism of Darwin, Popper had softened toward "Metaphysical Research Programmes." Neutral Theory fits this perfectly: a bold, simplifying assumption that guides empirical research, even if the strict "strictly neutral" claim turns out to be an idealization.

  ### 4. The Darwin Reversal: Rule Change or Fact Change?

  **It was a change of mind about the facts (the logical structure of the theory), not a change of rule.**

  Popper did not abandon falsificationism in 1978. He admitted he had misanalyzed the logical structure of Natural Selection.
  *   **1974 View:** He believed "Survival of the Fittest" meant "Survival of those who Survive." This is analytically true and empirically empty (a tautology).
  *   **1978 View:** Biologists convinced him that "Fitness" can be measured *independently* of survival (e.g., via physiological efficiency, reproductive potential in controlled environments). If fitness is an independent variable, the statement "Higher fitness leads to higher survival" becomes a causal hypothesis that can be falsified.

  Popper wrote: *"I have changed my mind about the testability and logical status of the theory of natural selection."* He maintained his rule (theories must be testable) but conceded that Darwinism *met* the rule, contrary to his earlier assessment.

  ### 5. The Tie-Breaker Case

  To distinguish **Rule A (Strict Falsifiability)** from **Rule B (Degeneration Test)**, you need a case where a theory is modified to save it from falsification, but the modification yields new predictions.

  **The Case: Dark Matter (1930s–Present)**

  *   **The Scenario:** Galaxy rotation curves did not match Newtonian/Einsteinian gravity (anomalies). Instead of abandoning gravity, astronomers postulated invisible mass (Dark Matter).
  *   **Rule A Verdict (Strict):** **Pseudoscience.** Postulating invisible, undetectable stuff to save a theory looks exactly like the Marxist maneuver of redefining terms to save the prediction. It immunizes gravity from falsification.
  *   **Rule B Verdict (Degeneration/Progressive):** **Science.** The Dark Matter hypothesis made new, risky predictions (gravitational lensing patterns, Cosmic Microwave Background fluctuations) that were subsequently tested. It increased empirical content.
  *   **Rule C Verdict (Metaphysical):** **Science.** Even if we never detect a particle, it serves as a productive research programme guiding cosmology.

  **Why this tells the rules apart:**
  If your reading group decides Popper would condemn Dark Matter as an *ad hoc* rescue (like Freud), they are applying **Rule A**. If they accept it because it led to new tests (like Neptune), they are applying **Rule B**.

  For Neutral Theory, the parallel is exact: Is "Nearly Neutral" an invisible fudge factor (Rule A says No), or a new variable that predicts population-specific effects (Rule B says Yes)? Given Popper's approval of the Neptune incident, **Rule B** is the most faithful interpretation of his mature work, which secures the "Science" verdict for Kimura.
