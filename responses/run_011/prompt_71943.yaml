answer: |-
  **Round One: Establishing the Boundaries**

  **1. The Witnessability Problem**
  You distinguish judging-blameworthy from holding-against, insisting the hypocrite retains the former but loses the latter. But if I observe a colleague rebuking another for dishonesty while being dishonest herself, what would I see her doing differently if she were merely judging versus actually holding-it-against him? If the distinction cannot be witnessed in behaviour or tone, is it doing philosophical work, or is it merely insulating the theory from counterexample?

  *Follow-up:* If she replies that the difference is internal or attitudinal: "If the difference is purely internal, then standing becomes invisible to the participants in the exchange. How can a norm of moral address govern a relationship if the parties cannot know whether the norm is being violated?"

  **2. The Private Case**
  Consider the hypocrite who never speaks her blame but silently holds the wrong against her colleague, altering her own relational stance without imposing any external cost. Since no one is addressed and no reputation damaged, what exactly consists in the unfairness here? Who is wronged by a purely private registration of a wrong?

  *Follow-up:* If she replies that private holding-against still corrupts the relationship: "If the corruption exists without the other's knowledge, then the relationship is altered without their consent or awareness. Does this not turn moral standing into a metaphysical property rather than a normative status within a community?"

  **3. Type-Indexing**
  You argue the hypocrite loses standing regarding the wrong they themselves committed. But suppose the blamer has been dishonest about her expenses, while blaming the colleague for dishonesty about his research data. These are adjacent but not identical registers of dishonesty. Does standing loss transfer across the near-miss, and if so, where do you draw the line between relevantly similar and irrelevantly different vices?

  *Follow-up:* If she replies that the vices must be identical for standing to lapse: "Then a sufficiently sophisticated hypocrite could retain standing simply by ensuring their own vice differs slightly in category from the one they blame. Does this not invite a loophole that undermines the moral intuition against hypocrisy?"

  ***

  **Round Two: Internal Mechanics**

  **4. The Self-Blaming Hypocrite**
  Consider the agent who knows she is dishonest, blames herself for it, and holds it against herself. She seems both apt and required to do this. If hypocrisy strips standing to hold-against, why does it not strip standing to hold-against oneself? Does this not suggest the deficit lies in address to another rather than in holding-against as such?

  *Follow-up:* If she replies that self-blame is not address and thus falls outside the standing condition: "But you defined holding-against as the alteration of a relationship by the registration of a wrong. Do I not stand in a relationship to myself? Or is your account of standing exclusively social, leaving self-regulation unexplained?"

  **5. Restoration**
  When a hypocrite loses standing, how is it regained? Does a sincere apology restore the standing to blame others for dishonesty, or must she demonstrate a full reform of disposition over time? If only reform works, has standing not collapsed into a measure of current virtue, ceasing to be an independent notion?

  *Follow-up:* If she replies that only reform restores standing: "Then standing is simply a proxy for moral cleanliness. Why not say directly that only the virtuous may blame, rather than maintaining a distinct category of standing that tracks historical virtue?"

  **6. Waiver**
  Suppose the colleague knows the blamer is a hypocrite but says, 'I know you did the same, but you are right about me, and I accept your blame.' Can the person blamed waive the deficit? If he cannot, why does his consent not matter; and if he can, does standing not depend on the addressee rather than the blamer?

  *Follow-up:* If she replies that standing is non-waivable because it concerns the blamer's moral position: "Then the addressee's moral agency is bypassed. You are protecting the blamer from inconsistency rather than respecting the blamed's right to accept criticism. Why should the blamed be forced to reject true judgment?"

  **7. The Opacity Problem**
  Standing turns on facts about the blamer's history that the addressee may never know. If the blamed party cannot know whether the blamer has standing, how can they regulate their own response? What becomes of moral address if its propriety is in principle hidden from the one addressed?

  *Follow-up:* If she replies that objective standing matters regardless of knowledge: "Then a blamer can be acting improperly without anyone, including herself, being in a position to know it. Does this not render the norm of standing inert as a guide for actual moral practice?"

  ***

  **Round Three: Generalization and Consequences**

  **8. Neighbouring Deficits**
  You focus on hypocrisy, but what of the self-righteous blamer who has never sinned but lacks empathy, or the meddlesome blamer who lacks connection? Are these distinct deficits of standing, or are you conflating several phenomena—coldness, meddlesomeness, hypocrisy—into one convenient category to make the view hold?

  *Follow-up:* If she replies that these are distinct but analogous deficits: "If they are distinct, do they operate by the same mechanism? If hypocrisy blocks holding-against because of inconsistency, what blocks the cold-hearted blamer? If the mechanisms differ, does 'standing' remain a unified concept?"

  **9. Extension to Collectives**
  Does this account extend to collective agents? When a citizen condemns her government's dishonesty, or one institution reproaches another, can the collective be a hypocrite lacking standing? If so, who holds the standing—the members, the office, or the institution itself—and how does the loss distribute?

  *Follow-up:* If she replies that collectives can lack standing analogously: "Then if a government is hypocritical, does every citizen lose the standing to blame foreign governments? If the loss distributes, innocent members are penalized; if it does not, the collective standing is fictitious. Which do you prefer?"

  **10. The Practical Upshot [HOLDBACK QUESTION]**
  *Deploy this in the final five minutes.*
  If hypocritical blame can be true, well-evidenced, and morally urgent, why should the person blamed care that the blamer lacks standing? Does your view not license wrongdoers in discounting accurate criticism simply by pointing to the messenger's flaws, thereby protecting vice from truth?

  *Follow-up:* If she replies that the wrongdoer should care because fairness matters more than truth in this context: "Then you are asserting that procedural fairness in blame outweighs the substantive correction of wrongdoing. Are you prepared to defend the claim that it is better for a wrong to go unchallenged than for it to be challenged by a flawed agent?"

  ***

  **Note on the Holdback Question**
  I recommend holding back Question 10 (The Practical Upshot) for the final five minutes because it forces the speaker to reconcile the theoretical purity of her earlier distinctions with the messy practical consequences she has now committed to; once she has defended the strictness of standing in previous rounds, she cannot easily retreat to pragmatic considerations without contradicting her earlier rigidity.
