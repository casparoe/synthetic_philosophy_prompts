prompt: |-
  Our consciousness reading group has a global-workspace theorist, who thinks the phenomenal character of an experience just tracks what's globally available for report and reasoning, and an overflow defender, who thinks you phenomenally take in far more detail than you could ever report. They've been talking past each other for two years. Could you draft the joint statement their adversarial collaboration should actually have produced? Please write it in British English.

  I want a numbered list of the claims both can honestly sign — including what a Sperling-style partial report task does and doesn't establish, and whether determinate detail (the specific shade of every tile) is even the right target versus something like determinable or gist-y phenomenology. Then a table of the disagreements that survive, each row worded so that each side would accept how its own position is described. Then the cruxes: the sub-questions where settling them would genuinely move at least one of them.

  For the main crux, have them jointly spec out one experiment and record their predictions in advance. Something like a masked array of a dozen coloured items where the mid-trial cue points at a feature rather than a location — say, which of the two odd-coloured items was more saturated — plus a confidence rating, so we can separate "it was in consciousness" from "it was accessible". Say explicitly which result the overflow defender is committed to counting as a loss, and which the sparse view is committed to counting as a loss, not just as uninterpretable. And if you reckon some of the quarrel is purely verbal, say which bit and unpack what each camp means by their words.
reasoning: |-
  Here's a thinking process that leads to the suggested joint statement:

  1.  **Analyze the Request:**
      *   **Context:** A consciousness reading group with a Global Workspace Theorist (GWT/sparse view) and an Overflow Defender (rich view). They've been talking past each other for two years.
      *   **Task:** Draft a joint statement their adversarial collaboration *should* have produced.
      *   **Format:** British English. Numbered list of agreed claims. Table of surviving disagreements. Section on "Cruxes" (sub-questions that would move the needle). One jointly specified experiment with pre-registered predictions and loss conditions. Analysis of potential verbal disputes.
      *   **Specific Content Requirements:**
          *   Address Sperling-style partial report tasks (what they do/don't establish).
          *   Address the target of phenomenology (determinate detail vs. determinable/gist).
          *   Experiment: Masked array, ~12 items, mid-trial cue to a *feature* (e.g., saturation of odd-coloured items), confidence rating.
          *   Explicit loss conditions for both sides.
          *   Identify verbal disputes.

  2.  **Deconstruct the Positions:**
      *   **Global Workspace Theory (GWT) / Sparse View:** Consciousness = Global Availability. If you can't report/reason with it, it's not phenomenally conscious. High capacity limits. Sperling shows iconic memory, not consciousness.
      *   **Overflow / Rich View:** Phenomenology exceeds access. You see more than you can report. Sperling shows rich phenomenology that decays before report.
      *   **The "Talking Past" Problem:** Often revolves around the definition of "consciousness," the interpretation of confidence ratings, the nature of phenomenology (high-res vs. vague), and the validity of no-report paradigms.

  3.  **Drafting - Section by Section:**

      *   **Title:** Needs to sound formal but collaborative. "Joint Statement on Phenomenal Richness and Global Availability."
      *   **Language:** British English (colour, centre, programme, etc., though less relevant in abstract text, still need to ensure tone and spelling).

      *   **Section 1: Agreed Claims (The Common Ground):**
          *   Need 5-7 points they can both sign.
          *   *Sperling:* Both agree it shows high-capacity storage, but disagree on whether that storage is *phenomenal*. So, agree on what it establishes (iconic memory exists) and what it doesn't (doesn't settle the consciousness question without further assumptions).
          *   *Phenomenology Target:* Agree that "determinate detail" (every tile's exact shade) might be a straw man. Agree that "determinable" or "gist" is a viable candidate for overflow.
          *   *Methodology:* Agree that report is an imperfect measure but necessary for science. Agree that confidence ratings are useful but fallible.
          *   *Neural Correlates:* Agree that PFC is involved in report, but disagree on whether it's involved in consciousness itself.

      *   **Section 2: Surviving Disagreements (The Table):**
          *   Needs to be neutral wording.
          *   *Row 1: Definition.* GWT: Consciousness *is* access. Overflow: Consciousness *permits* access but isn't identical.
          *   *Row 2: Capacity.* GWT: Limited (4±1). Overflow: Rich/High capacity.
          *   *Row 3: Unreportable Experience.* GWT: Impossible (if truly unreportable, it's unconscious). Overflow: Possible (phenomenally conscious but inaccessible).
          *   *Row 4: PFC Role.* GWT: Essential for consciousness. Overflow: Essential for report, not consciousness.

      *   **Section 3: The Cruxes:**
          *   What would change minds?
          *   *Crux 1:* The nature of "phenomenal confidence." Can high confidence exist without access?
          *   *Crux 2:* The "Richness" definition. Is vague richness still richness?
          *   *Crux 3:* Post-decisional wagering vs. immediate confidence.

      *   **Section 4: The Joint Experiment:**
          *   *Design:* Masked array (12 items). Two odd-colours. Cue points to feature (saturation comparison), not location.
          *   *Measure:* Accuracy + Confidence Rating (Type 2 metacognition).
          *   *Logic:* If confidence is high but accuracy is at chance (or vice versa), what does it mean?
          *   *Predictions:*
              *   Overflow: High confidence/phenomenal experience even when access fails (or is delayed). Or, high capacity for feature discrimination without focal attention.
              *   GWT: Confidence tracks access. If you can't access the specific feature comparison, confidence should be low/chance.
          *   *Loss Conditions:* This is crucial.
              *   Overflow Loss: If high confidence *perfectly* correlates with report accuracy, and drops to chance when access is blocked. (i.e., No dissociation).
              *   GWT Loss: If there is a robust dissociation where subjects report high confidence/phenomenal presence for details they demonstrably cannot report/compare accurately above chance, *and* this isn't explainable by response bias.

      *   **Section 5: Verbal Disputes:**
          *   Identify the "Consciousness" label.
          *   Identify "Access." Does it mean "Report now" or "Available in principle"?
          *   Identify "Phenomenal Character." Is it "what it's like" or "what we can say about what it's like"?

  4.  **Refining and Polishing (British English & Tone):**
      *   Check spellings: *colour, centre, programme, modelling, behaviour.*
      *   Tone: Academic, conciliatory but precise. Avoid caricature.
      *   Ensure the experiment description is technically sound (feature-based cueing is trickier than location, need to ensure it makes sense). *Self-Correction on Experiment:* A feature-based cue (e.g., "compare the saturation of the red items") requires binding. If there are 12 items, and 2 are red, can you compare them without focal attention? GWT says no. Overflow says yes (peripherally).
      *   *Refining the Loss Condition:* It needs to be strong. GWT loses if there is *phenomenology without access*. Overflow loses if *phenomenology is strictly bounded by access*.
      *   *Sperling Nuance:* Ensure the agreement reflects that Sperling shows *information retention*, not necessarily *phenomenal retention*.

  5.  **Final Review against Constraints:**
      *   Numbered list of claims? Yes.
      *   Sperling addressed? Yes.
      *   Determinate vs. Determinable addressed? Yes.
      *   Table of disagreements? Yes.
      *   Cruxes? Yes.
      *   Joint Experiment with predictions/loss conditions? Yes.
      *   Verbal dispute analysis? Yes.
      *   British English? Yes.

  6.  **Writing the Output:** (Proceeding to generate the response based on these thoughts). *Note: Ensure the distinction between 'determinate' (specific shade) and 'determinable' (reddish) is clear in the agreement section.*

  *(Self-Correction during drafting)*: Make sure the experiment isn't just a standard change blindness task. The prompt asks for a mid-trial cue to a *feature*. Let's specify: 12 Gabor patches or coloured tiles. Two are 'odd' (e.g., blue amongst green). Cue asks: "Which odd one was more saturated?" This requires individuating the odd ones without a location cue. This tests binding without focal attention.

  *Loss Conditions:*
  *   Overflow: Must accept that if confidence and accuracy are perfectly yoked, overflow is unsupported *in this paradigm*.
  *   GWT: Must accept that if high confidence persists despite chance accuracy (and bias is controlled), the "consciousness = access" identity is threatened.

  *Verbal Dispute:* The word "Access". GWT means "Globally Broadcast". Overflow means "Reportable". Sometimes GWT says "If you can't report it, it wasn't broadcast." Overflow says "It was there, just faded." Need to highlight this.

  Let's assemble.
answer: |-
  **JOINT STATEMENT ON PHENOMENAL RICHNESS AND GLOBAL AVAILABILITY**

  **Date:** 24 October 2023
  **Parties:** The Global Workspace Coalition (GWC) & The Phenomenal Overflow Consortium (POC)
  **Subject:** Adversarial Collaboration on the Capacity and Nature of Conscious Experience

  After two years of dialectical engagement, the undersigned parties acknowledge that while our metaphysical commitments diverge, our empirical expectations can be sharpened. The following document outlines our points of convergence, the precise locus of our disagreements, and a pre-registered experimental protocol designed to adjudicate the central dispute.

  ### I. Points of Consensus

  Both parties affirm the following claims as the baseline for future collaboration:

  1.  **On Sperling-Style Paradigms:** We agree that partial-report tasks (e.g., Sperling, 1960) definitively establish the existence of a high-capacity, rapidly decaying sensory store (iconic memory). However, we agree that these tasks do not, in isolation, settle whether the contents of this store are *phenomenally conscious* or merely pre-conscious information buffers.
  2.  **On the Target of Phenomenology:** We acknowledge that demanding evidence for *determinate* detail (e.g., the exact hex-code shade of every tile in a periphery array) may set an unreasonably high bar. We agree that the debate should equally address *determinable* or 'gist-like' phenomenology (e.g., the experience of 'variegated colour' without specific hue representation). If overflow exists, it may be rich in determinables even if poor in determinates.
  3.  **On Report as a Measure:** We concur that objective report is an imperfect proxy for consciousness. It introduces bottlenecks (memory, motor planning) that may obscure the true capacity of experience. However, we agree that in the absence of telepathy, some form of report (including confidence ratings) is methodologically necessary for scientific inference.
  4.  **On Metacognition:** We agree that confidence ratings constitute a form of metacognitive report. While not identical to first-order experience, they provide a quantitative measure of the subject's conviction regarding their perceptual state, which is relevant to both access and phenomenology.
  5.  **On Neural Correlates:** We agree that prefrontal cortex (PFC) activity is robustly correlated with task reporting. We disagree on whether this activity constitutes the *mechanism* of consciousness (GWC) or the *mechanism of reporting* on consciousness (POC), but we agree that dissociating these requires no-report or minimal-report paradigms.
  6.  **On Falsifiability:** We acknowledge that our positions are empirically vulnerable. The Overflow view is vulnerable to evidence showing perfect yoking between access capacity and phenomenal report. The Global Workspace view is vulnerable to evidence showing robust phenomenal markers (e.g., high confidence, specific ERPs) in the absence of access.

  ### II. Surviving Disagreements

  The following table summarises the theoretical divergence. Each row is phrased such that both parties accept the description of their own stance.

  | Domain | Global Workspace Coalition (Sparse View) | Phenomenal Overflow Consortium (Rich View) |
  | :--- | :--- | :--- |
  | **Definition of Consciousness** | Consciousness is *identical* to global availability. If information is not available for broad reasoning and report, it is not phenomenally conscious. | Consciousness *permits* global availability but is not identical to it. Information can be phenomenally present even if access is blocked or delayed. |
  | **Capacity Limits** | The capacity of conscious experience is strictly limited by the bandwidth of the global workspace (approx. 3–5 items). | The capacity of conscious experience exceeds the bandwidth of report. We phenomenally take in more than we can retrieve. |
  | **Unreportable Experience** | Logically impossible. If a subject cannot report a detail (even in principle, given idealised conditions), that detail is not part of their conscious experience. | Empirically common. A subject may have a vivid experience that decays or is overwritten before it can be encoded into working memory for report. |
  | **Role of Prefrontal Cortex** | PFC activation is part of the neural correlate of consciousness (NCC) itself, as it enables the global broadcasting. | PFC activation is part of the neural correlate of *reporting* (NCR), while the NCC may reside in posterior cortical regions. |
  | **Interpretation of Confidence** | High confidence implies successful access. If access fails, confidence should drop to chance levels. | High confidence can reflect rich phenomenal experience even if the specific content cannot be successfully retrieved for the task. |

  ### III. The Cruxes

  Settling the following sub-questions would significantly shift the posterior probability of one view over the other:

  1.  **The Dissociation Crux:** Can we demonstrate a robust dissociation between *phenomenal confidence* and *objective accuracy* under conditions where access is experimentally constrained? If confidence remains high while accuracy drops to chance (controlling for bias), this favours Overflow.
  2.  **The Decay Crux:** Is the loss of information in partial-report tasks due to the *fading of consciousness* (GWC) or the *failure of consolidation* from a conscious store to working memory (POC)? Manipulating the delay between stimulus and cue is critical here.
  3.  **The Feature-Binding Crux:** Does rich phenomenology require focal attention for feature binding? If subjects can compare features (e.g., saturation) of non-attended items, this favours Overflow. If binding fails without focal access, this favours GWC.

  ### IV. Joint Experimental Protocol

  To address the Cruxes, we have jointly specified the following experiment. Both parties agree to accept the outcomes as defined in the 'Loss Conditions' section.

  **Design:**
  *   **Stimulus:** A masked array of 12 coloured tiles presented for 100ms.
  *   **Target:** Two tiles are 'odd' (e.g., blue amongst green distractors).
  *   **Cue:** A mid-trial cue (post-stimulus, pre-response) directs attention to a *feature comparison* rather than a location. Specifically: "Indicate which of the two odd-coloured tiles was more saturated."
  *   **Requirement:** This requires individuating the two odd items and comparing a specific feature without a prior location cue, taxing the binding capacity of the workspace.
  *   **Measure:**
      1.  **Forced Choice:** Which tile was more saturated? (Accuracy).
      2.  **Confidence Rating:** Immediate 1–4 scale on how clearly the comparison was experienced.

  **Predictions:**

  *   **GWC Prediction:** Accuracy and Confidence will be tightly yoked. Because the global workspace cannot bind and compare features for unattended items without focal access, subjects will not have conscious access to the saturation difference. Confidence will be low when accuracy is at chance.
  *   **POC Prediction:** We expect a dissociation. Subjects will report high confidence (indicating rich phenomenal experience of the array) even on trials where accuracy is at chance (indicating failure of access/reporting mechanisms to retrieve the specific comparison). The 'gist' of the saturation difference will be phenomenally present even if the specific verdict cannot be executed.

  **Loss Conditions:**

  *   **Overflow Defender's Loss Condition:** The POC agrees that if Confidence and Accuracy show a near-perfect correlation (r > 0.8) across all conditions, and confidence drops to baseline whenever accuracy is at chance, this constitutes strong evidence against rich overflow *in this paradigm*. They will accept this as a point for the Sparse View.
  *   **Global Workspace Theorist's Loss Condition:** The GWC agrees that if there is a statistically significant cluster of trials where Accuracy is at chance (≤55%) but Confidence is high (≥3 on 4-point scale), and this cannot be explained by response bias (via Signal Detection Theory analysis), this constitutes evidence of phenomenology without access. They will accept this as a point for the Overflow View.

  ### V. Analysis of Verbal Disputes

  We acknowledge that a portion of our two-year impasse stems from terminological ambiguity. We clarify our usage as follows:

  1.  **'Access':**
      *   *GWC Usage:* Often implies 'availability for *any* downstream cognitive process'. If you can't reason about it, it isn't accessed.
      *   *POC Usage:* Often implies 'availability for *verbal report*'.
      *   *Resolution:* We agree to distinguish **Accessₚ** (Phenomenal availability) from **Accessᵣ** (Reportable availability). The debate is whether Accessₚ entails Accessᵣ.
  2.  **'Consciousness':**
      *   *GWC Usage:* Tends towards a functionalist definition. Consciousness is a *status* of information (broadcasted).
      *   *POC Usage:* Tends towards a phenomenological definition. Consciousness is a *property* of experience (what it is like).
      *   *Resolution:* We agree that if the GWC defines consciousness functionally, the Overflow view might be true about 'phenomenology' but false about 'consciousness' by definition. We must agree to debate the *phenomenology* specifically, not just the label.
  3.  **'Detail':**
      *   *GWC Usage:* Often assumes 'detail' means 'reportable specific'.
      *   *POC Usage* often means 'felt richness', which can be vague.
      *   *Resolution:* As noted in Claim 2, we agree to test for *determinable* richness. If the GWC concedes that 'vague richness' is still a form of overflow, the dispute narrows significantly.

  **Signed,**

  *Lead Theorist, Global Workspace Coalition*
  *Lead Theorist, Phenomenal Overflow Consortium*
