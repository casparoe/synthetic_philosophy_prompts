      *   *Explanation 3 (Deep Self/Values):* Intentionality is about attribution of attitude. Ignoring harm shows a "bad deep self." Ignoring help doesn't necessarily show a "good deep self" (could just be neutral). So, bad = intentional (reveals self), good = unintentional (doesn't reveal self).

