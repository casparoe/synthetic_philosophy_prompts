answer: |-
  ### Rule (i): Half-Kelly Sizing
  This rule presupposes **Growth-Rate Maximization under Parameter Uncertainty**. Pure long-run growth maximization (the Kelly criterion) dictates staking the full edge-to-odds fraction. Halving this fraction sacrifices exactly 25% of the expected geometric growth rate to reduce volatility by roughly 50%. In expected-utility (EU) theory, this implies a utility function more concave than logarithmic. However, given the founder's slogan, the manual likely treats this not as a change in objective, but as a robustness adjustment: it admits the "edge" is an estimate, not a truth. It rules out the strong thesis that probability estimates are exact. It is philosophically underdetermined between EU with moderate risk aversion and Growth Optimization with epistemic humility; both yield identical staking behavior here.

  ### Rule (ii): The Five Per Cent Cap
  This rule presupposes **Model-Risk Management**, effectively overriding the growth criterion. Growth maximization is scale-invariant; if the edge is large enough to warrant a 10% stake, the growth criterion demands 10%. Capping it at 5% prioritizes the survival of the *strategy* over the optimization of the *book* in tail scenarios. It implicitly acknowledges that large reported edges are the most likely indicators of model failure rather than opportunity. This rules out the rational agent model that trusts its own probability distributions completely. It switches the criterion from Growth Maximization to **Constraint Satisfaction**, treating concentration risk as an existential threat independent of expected return.

  ### Rule (iii): No Credit, No Layoff
  This rule presupposes **Corporate Solvency over Capital Efficiency**. Growth-rate maximization is indifferent to the source of capital; if borrowing costs are below the expected growth rate, leverage increases the absolute growth of equity. By forbidding credit, the manual treats external liability as a distinct absorbing state from market loss. It defines the firm not as a portfolio of assets, but as a closed system that must not owe. This rules out the Modigliani-Miller view that capital structure is irrelevant to value. It aligns with a utility function where debt carries infinite disutility, switching the objective from Wealth Maximization to **Balance-Sheet Integrity**.

  ### Rule (iv): The Trading Floor
  This rule presupposes **Principal Protection**, creating a hard absorbing state that contradicts the slogan. Fractional betting ensures the book never mathematically reaches zero; it can always recover. A fixed floor that triggers liquidation defines a *de facto* ruin point. Pure growth maximization would never cease trading, as a halved book retains the same growth rate as a full one. Stopping trading forfeits the recovery option. This rule switches the criterion decisively from Long-Run Growth to **Finite-Horizon Utility**, acknowledging that partners value the return of nominal capital above the continuation of the enterprise. It treats the firm as a finite contract, not a perpetual machine.

  ### Rule (v): Trader Compensation
  This rule presupposes **Short-Term Expected Utility**, creating an agency conflict with the firm's goal. Annual profit sharing and a three-year retention window incentivize traders to maximize arithmetic returns over short horizons, encouraging variance that the sizing rule seeks to suppress. A trader can capture upside volatility while the firm bears the downside risk (until the floor). This rules out the alignment of trader and firm incentives required for pure growth maximization. It switches the criterion from the Firm's Long-Run Growth to the **Agent's Short-Run Income**, implicitly accepting that traders are rational EU maximizers with high discount rates, even if the firm claims otherwise.

  ### Comparative Analysis
  The manual does not embody a single theory of rational choice. It is a hybrid architecture that uses **Growth-Rate Maximization** as an engine but **Expected-Utility Maximization** as a braking system. The founder's slogan ("maximize long-run rate") is a normative ideal for the capital, but the operational rules protect the humans (partners and traders) who interact with it.

  If you adopted the strong thesis that **Time-Average Growth Rate** is the sole rational criterion (Ergodicity Economics), you would need to: (1) remove the trading floor (never stop compounding); (2) remove the position cap (trust the ergodic edge); (3) defer trader compensation into equity vesting over 10+ years (align horizons); and (4) permit leverage if the cost of capital is below the book's growth rate. The current practice rejects this purity.

  The practice is philosophically underdetermined at Rule (i) and Rule (iv). Half-Kelly fits both Log-Utility EU and Uncertainty-Adjusted Growth. The Floor fits both a "subsistence level" EU threshold and a "survival" constraint. You cannot infer the firm's true metaphysics from these rules alone. However, the contradiction is sharpest at Rule (iv): you cannot maximize long-run growth while planning to stop. The manual switches criteria most explicitly there, prioritizing the partners' utility of wealth over the book's utility of existence.

  Verdict: Growth maximization under parameter uncertainty; switches to ruin avoidance at the floor.
