  | Item | Survivability (0–10) | Load-bearingness (0–10) | Rank |
  | :--- | :---: | :---: | :---: |
  | 1. Capacity precondition | 2 | 9 | 4 |
  | 2. Guardianship analogy | 1 | 7 | 5 |
  | 3. Output legitimacy | 3 | 8 | 3 |
  | 4. Self-help argument | 6 | 5 | 2 |
  | 5. Corruption-of-the-ruler | 8 | 4 | 1 |

  1.  The capacity precondition scores low on survivability because contemporary political theory rejects fixed thresholds of civilizational readiness, yet it remains load-bearing because without it, the exception to the liberty principle vanishes.
  2.  The guardianship analogy scores lowest on survivability as paternalistic metaphors are now deemed incompatible with sovereignty, though it bears significant weight by providing the mechanism for implementing the capacity precondition.
  3.  Output legitimacy survives poorly because technocratic competence no longer overrides the demand for consent, but it remains critical because it defines the substantive end of the proposed authority.
  4.  The self-help argument retains moderate survivability because modern development doctrine still prioritizes local ownership, though it bears less weight as it limits intervention rather than authorizing it.
  5.  The corruption-of-the-ruler argument scores highest on survivability because institutional design logic regarding accountability remains valid, though it bears little weight as it concerns the ruler's integrity rather than the right to rule.

  Items 1 and 2 are effectively one argument wearing two costumes. The capacity precondition establishes the theoretical threshold for liberty, while the guardianship analogy provides the pedagogical metaphor for crossing it. Logically, they stand or fall together; if a society lacks the capacity for liberty, it requires guardianship, and if guardianship is illegitimate, the capacity distinction loses its political utility. Merging them reveals that the core of Mill's imperial justification rests on a single epistemic claim about developmental stages. Consequently, while Item 1 is ranked higher for survivability due to its abstract formulation, both occupy the same vulnerable logical space regarding cultural hierarchy.

  The single item sitting in the high-load-bearing / low-survivability quadrant is Item 1, the capacity precondition. This argument functions as the gatekeeper for the entire system; if all societies are presumed capable of free discussion, the justification for asymmetrical authority collapses immediately into a violation of the liberty principle. Removing this premise costs the system its foundational exception. Without the claim that some communities are temporally behind in political development, there is no space for benevolent despotism, and the framework reverts to universal self-determination. The structure cannot sustain the weight of imperial administration without this specific distinction between those ready for liberty and those requiring improvement.

  The item scored highest on survivability is Item 5, the corruption-of-the-ruler argument. The strongest objection from a defender of self-determination is that accountability to a distant parliament does not constitute legitimacy for the governed; a ruler may be disciplined by their own citizens while still exercising arbitrary power over a dependency. This objection highlights that procedural integrity within the metropole does not remedy the lack of consent in the periphery. My verdict is that the item survives this objection only as a diagnostic tool for institutional design, not as a moral justification for authority. It remains true that unchecked power degrades the ruler, but this truth protects the ruler's character rather than validating the relationship. Therefore, the argument retains logical coherence regarding internal metropolitan politics but fails to bridge the normative gap between the ruler and the ruled.

  Ultimately, the machinery turns only partially. The arguments concerning the internal discipline of the administering power and the necessity of local exertion retain traction because they align with modern concerns about accountability and ownership. However, the foundational claims regarding capacity and guardianship have lost their normative force because they rely on hierarchical distinctions of human political potential that are no longer tenable. The system's load-bearing elements are precisely those that are least survivable, suggesting that while the administrative insights remain useful, the moral architecture supporting asymmetrical authority has fundamentally eroded. The contemporary approver inherits the technocratic tools but lacks the philosophical warrant to wield them without consent.
