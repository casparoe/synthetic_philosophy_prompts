answer: |-
  Dear Student Rep,

  I am sorry you had to spend your Thursday afternoon holding a coat while two people fought over arithmetic, but you have stumbled into one of the most persistent conflicts in institutional data analysis, and it is understandable that you came away unsure. You asked for a move-by-move breakdown of who was right, so I will walk through the seven exchanges in order, then give you my verdict on the overall dispute, what claim survives, what number they should report, and finally the critical assumption both of them missed that makes the whole argument wobbly.

  On 1, Ellis is decisively right on the mathematics but potentially wrong on the implication. He correctly identifies that the aggregate reversal is driven entirely by the different distribution of applicants across programs. Since the out-of-system admission rate is higher within every single program, the claim that the committee penalizes out-of-system applicants at the point of decision is statistically unsupported by the data he presented. The arithmetic he describes is sound: when you combine groups with different base rates in different proportions, the aggregate can flip direction regardless of what happens within the groups. This is a clean statistical point, and on the narrow question of whether the committee decisions themselves show a bias against out-of-system applicants, Ellis wins this round.

  On 2, Nadia is right on the causal structure, provided her premise about advising is true. She argues that program choice is not an independent variable but a mediator influenced by the university's own pipelines and advising. If the institution steers in-system students toward high-admit programs and leaves out-of-system students to find the competitive ones on their own, then conditioning on program choice blocks the path of the harm rather than controlling for it. This is a strong causal argument because it treats the university as a single system rather than a collection of independent silos. However, her correctness here depends on evidence about advising practices that she did not present in the room, so while her logic is sound, her factual grounding is assumed rather than proven.

  On 3, this is a wash because they are arguing past each other about definitions. Ellis is defining discrimination as bias in the file review process, which happens after program choice, while Nadia is defining it as any institutional barrier that reduces success rates, including pre-application steering. Ellis is correct that the aggregate number does not prove committee bias, but Nadia is correct that the institution is responsible for the total outcome, not just the final vote. Ellis's point about unfalsifiability is rhetorically strong but logically weak; acknowledging pre-committee factors does not make bias unfalsifiable, it just moves the measurement point earlier in the pipeline.

  On 4, Nadia is decisively right about the non-neutrality of weighting. She correctly points out that any attempt to combine the program-level rates into a single adjusted number requires choosing a reference population, and there is no statistical rule that dictates whether you weight by the in-system mix, the out-of-system mix, or the total pool. Each choice yields a different number, and each choice carries a normative implication about which group's behavior is treated as the standard. This is a technical fact that Ellis glosses over, and it undermines his implication that there is a single correct adjusted number waiting to be found.

  On 5, Ellis is mathematically right but normatively incomplete. He correctly states that since the out-of-system advantage exists in every program, any weighted average of those program-level advantages will still show an out-of-system advantage. He is also right that the word penalty implies an imposition that the aggregate number does not prove. However, his claim that the aggregate is merely a fact about who applied where ignores Nadia's point that who applies where is itself a fact about the institution. His move lands cleanly on the math but fails to address the policy reality that application patterns are endogenous to the university's behavior.

  On 6, Nadia lands a strong point here about the applicant's perspective. She is right that an actual applicant faces the odds of the system they enter, not a hypothetical average across programs, and that structural barriers can exist even if no individual committee is biased. Ellis's counter that her number describes a hypothetical applicant applying to all programs is a bit of a straw man; the aggregate rate describes the experience of the population, which is relevant for equity auditing even if it doesn't predict an individual's outcome. Nadia is right that total outcome disparity is a valid metric for institutional health even if it doesn't isolate committee bias.

  As for 7, Nadia is right about the downstream variable, and Ellis walks into a trap. Conditioning on interview status is methodologically dangerous because interviews are part of the selection process, meaning they are a collider or a mediator affected by the very decisions being studied. Controlling for them can induce bias where none exists. Ellis's reductio ad absurdum that this logic leads back to the raw aggregate is clever but flawed; acknowledging that some variables are downstream does not mean all variables are, nor does it mean the raw aggregate is the only valid number. Nadia wins this round on methodological grounds, though Ellis correctly identifies that her logic risks making every adjustment suspect.

  Overall, Ellis was more right about the statistics of the committee's decision-making, while Nadia was more right about the ethics of the institution's total impact. Ellis successfully proved that the admissions committees are not rejecting out-of-system applicants at a higher rate than in-system applicants when comparing similar programs. Nadia successfully argued that the institution may still be failing out-of-system applicants through channeling and advising before the file ever reaches the committee. There is a version of the memo's claim that survives Ellis's objection and a version that does not. The claim that the committees discriminate in file review does not survive; the data explicitly contradicts it. The claim that out-of-system applicants face a structural penalty in accessing the university does survive, provided Nadia can substantiate the advising pipeline argument.

  Regarding what number they should actually be reporting, they should report both but label them precisely. The aggregate rate should be reported as the total access rate, reflecting the overall likelihood of admission for each group. The program-level rates should be reported as the committee decision fairness metric, reflecting whether files are treated equally once the program is chosen. Presenting only the aggregate hides the lack of committee bias, but presenting only the stratified rates hides the structural barrier. They need to say that out-of-system applicants are treated fairly by committees but face higher barriers to entry in the programs they apply to, which is a distinct and actionable finding.

  Finally, here is what both of them missed, and this is the thing that looks like a strong point but isn't. Ellis's argument in point 1 and 5 relies on the assumption that program choice is the only relevant difference between the applicants. He assumes that within Health Sciences, an in-system applicant and an out-of-system applicant are otherwise comparable in merit. Neither of them checked whether the out-of-system applicants within each program had higher average qualifications, such as GPA or test scores, than the in-system applicants. If out-of-system applicants are systematically more qualified within every program and still only win by a few percentage points, that could actually indicate bias against them that the raw program rates hide. Conversely, if they are less qualified and win anyway, the advantage is even larger than it looks. By fighting over program weights versus aggregate mixes, they both ignored the most important confounder of all, which is applicant quality. Ellis's confident claim that the program-level data proves no bias looks decisive, but it isn't, because it treats all applicants within a program as identical units rather than varying by merit. Until they control for qualifications within programs, neither the aggregate nor the stratified numbers prove fairness or bias, they only describe outcomes.
