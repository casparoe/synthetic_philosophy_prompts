          8.  On 7: Nadia is right on downstream conditioning (colliders). Ellis's reductio is weak.
          9.  Overall Verdict: Ellis wins the stats battle, Nadia wins the policy war.
          10. Viable Claim: "Structural barrier" vs "Committee Bias."
          11. What Number: Report both with labels.
          12. What They Missed: Qualifications/Merit within programs. The "strong point that isn't" is Ellis's claim that program-level data proves no discrimination, because it ignores applicant quality.

      *   *Self-Correction on "Strong Point That Isn't":* Ellis's argument in 1/5 that "out-system wins in every program so there is no bias" looks decisive. It isn't, because it ignores applicant quality. If out-system applicants are vastly more qualified on average within each program, winning by only a few percentage points could still indicate bias. This fits the "assuming something about the data neither one has checked" constraint.

      *   *Final Polish:* Ensure no markdown formatting like **bold** or *italics* if possible (prompt says "no bold", usually italics are okay but better to avoid all formatting to be safe). Wait, prompt says "No headings, no bullet points, no bold, no tables". It doesn't explicitly ban italics, but "continuous prose" suggests plain text. I will avoid italics to be safe and maintain the "email" look. I will use phrases like "on 1" to structure.

