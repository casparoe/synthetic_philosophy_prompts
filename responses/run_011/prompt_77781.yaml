  The Black Industries Model CI-79 Counterfactual Intervener is a certified demonstration unit designed to establish moral responsibility in the absence of alternative possibilities. The unit operates exclusively in counterfactual mode, ensuring zero physical intervention during successful demonstrations. It is not intended to alter actual sequences of events.

  **The Manual**

  **Overview and Intended Use**
  The Model CI-79 validates agency where alternative possibilities are absent. The unit is certified to defeat Standard PAP-1, which excludes responsibility solely when alternatives are unavailable, and Standard PAP-2, which excludes responsibility only when the inability explains the act. PAP-2 certification requires enabling Firmware Flag 7B in the settings menu. The device ensures zero delivered intervention; any output is strictly counterfactual. This zero output is the primary selling point and indicates successful calibration. Demonstration subjects are supplied pre-screened and must not be sourced locally to maintain chain of custody regarding initial conditions. Local sourcing introduces uncontrolled variables. The unit is designed for laboratory environments only. Regulatory compliance is mandatory.

  **Package Contents**
  One (1) CI-79 Intervener Unit, one (1) Compliant Subject (Cryogenic), one (1) Power Cable, one (1) Safety Warning Label, one (1) Calibration Certificate, one (1) Manual.

  **Installation and Trigger Configuration**
  Operators must configure the trigger condition via the dip-switch panel. Setting A utilizes a causally sufficient antecedent; this guarantees intervention readiness but risks collapsing the demonstration into an ordinary deterministic case, proving nothing against the principle. Setting B utilizes an indeterministic prior sign; this preserves the appearance of openness but leaves the subject a residual alternative in the interval before the choice. This is a known engineering trade-off. The recommended workaround is to calibrate the sign correlation to 99.9% to minimize the interval while maintaining non-deterministic status. Do not use the word dilemma in reports. Operators should log all configuration changes for audit purposes. Failure to log may void certification.

  **Latency and Timing**
  The device must close the window between the subject's decision and the onset of the act. An alternative still open after the decision would allow the subject to prevent the deed even though he could not have decided otherwise. Consequently, a prevention-based principle survives demonstrations that defeat the choice-based one. The recommended timing margin is 0.003 seconds post-decision. Failure to meet this margin invalidates PAP-2 certification. Operators must verify neural latency before each session. Delayed intervention allows for prevention, which undermines the demonstration. Ensure synchronization clocks are updated.

  **Residual Alternatives**
  The device leaves the subject one residual alternative, such as a twitch, a hesitation, or the bare beginning of a deliberation. The manual insists this does not count, because only alternatives that are robust in the relevant sense, those in which the subject's moral position genuinely differs, could ground an exemption. Regarding Customer Ticket 442: The claim that this quietly adds a clause the original principle never contained is noted. Our position remains that non-robust alternatives are functionally null. We concede nothing regarding the definition of robustness. Support tickets on this matter will be closed. Robustness is defined internally.

  **Warranty**
  The two-ways control requiring an open alternative is voided upon installation. The actual-sequence control requiring only that the mechanism actually operating be appropriately sensitive to the subject's reasons remains fully valid. This actual-sequence control is declared sufficient for all warranty claims, including claims about desert and blame. No refund is available if the subject claims they could have done otherwise. Valid claims require proof of reason-sensitivity in the actual sequence. Control is assessed based on the actual mechanism. Documentation must be retained.

  **Liability**
  The manufacturer is not answerable for anything the device would have caused. Since the unit caused nothing during successful operation, liability rests elsewhere. The operator remains fully liable for all outcomes resulting from the actual sequence. Counterfactual causation does not constitute grounds for indemnity. Legal counsel has reviewed this section. Insurance claims regarding counterfactuals will be denied. See terms.

  **Troubleshooting**
  | Symptom | Probable Cause | Solution |
  | :--- | :--- | :--- |
  | Unit emits neural pulse | Hardware failure | Return immediately |
  | Subject reports coercion | Unit fired | Defective |
  A firing device turns the demonstration into straightforward neurological coercion and thereby excuses the subject. Any unit observed to fire is classified as defective and subject to return. Do not attempt repair. A firing unit fails its primary function.

  **FAQ**
  Q: Why should anyone buy a device that never does anything?
  A: Responsibility is supplied by the actual sequence. The device guarantees the absence of alternatives without contributing to the action. The lack of intervention confirms the subject's independence. Purchase is justified by the counterfactual guarantee. The device provides security against alternative possibilities. Thank you.

  **Design Notes**

  1. Encodes the core Frankfurt claim that intervention is counterfactual only; zero output is a feature emphasizing actual sequences remain untouched.
  2. Encodes the dilemma objection regarding prior signs; presenting it as a trade-off avoids admitting the argument fails while offering a technical workaround.
  3. Encodes the flicker of freedom strategy; specifying latency blocks prevention-based objections distinct from choice-based ones effectively.
  4. Encodes the distinction between simple PAP and explanatory PAP; the firmware flag reflects the stricter requirement that the inability must explain the action.
  5. Encodes the robustness reply; the corporate refusal to accept the complaint mirrors the philosophical insistence that non-robust alternatives are irrelevant.
  6. Encodes actual-sequence theories of control; voiding two-way control while validating reason-sensitivity aligns with compatibilist accounts of responsibility.
  7. Encodes the intuition that counterfactuals do not determine liability; the operator bears responsibility because the device remained inert.
  8. Encodes the distinction between manipulation and counterfactual intervention; firing implies coercion which exculpates, rendering the unit useless for its purpose.
  9. Encodes the actual-sequence sufficiency claim; the answer asserts that responsibility derives from the actual history, not the presence of alternatives.
  10. Encodes the need for controlled initial conditions; local sourcing risks introducing variables that compromise the thought experiment's validity.
