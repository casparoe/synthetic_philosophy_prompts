      *   *Check Point 4:* Make sure to distinguish between "Access" as "reportability" and "Access" as "functional availability." The roommate conflates access with report. The user needs to separate them. Access is the functional state; report is one output.
      *   *Metaphysics:* The prompt asks to pick one: Identity or Direction. Identity is stronger and fits the "constitutive" claim better. "Phenomenality *is* broadcasting."

  6.  **Final Polish:**
      *   Ensure the distinction between "report" (behavior) and "access" (functional state) is clear. The roommate thinks Report = Access. The user needs to argue Report is evidence of Access, and Access = Phenomenality.
      *   Make sure the "bite the bullet" on rich phenomenology is clear. Unreported details are not experienced. This is the controversial part but necessary for the view.

  7.  **Final Output Structure:**
      *   Intro: Validate the frustration, set the stage.
      *   Section 1: The Constitutive Claim (Broadcasting = Feeling).
      *   Section 2: The Counterexamples (Biting the Bullet on Richness).
      *   Section 3: The Methodological Error (Report vs. Access).
      *   Section 4: Falsification & Metaphysics (Identity Theory).
      *   Closing: Summary punchline.

  *(Self-Correction on "No Name-Dropping"):* I must avoid saying "Dennett," "Block," "GWT," "IIT" if possible, or at least minimize it. The prompt says "no name-dropping papers." Using theory names like "Global Workspace" is probably okay since the user used them, but avoid citing specific authors. I will stick to the concepts.

  *(Refining the "Access" definition):* The roommate defines Access as "reportability." The user needs to redefine Access as "functional availability for reasoning/control." Report is just one downstream effect. This is crucial for point 3.

  *(Refining Point 2 - Dreams):* Dreams are tricky. If you can't report them *during* the dream, are they accessed? Yes, because you can report them *after*. The memory trace implies the broadcasting happened *then*. So dreams fit the model.

  *(Refining Point 2 - Autopilot):* This is the strongest point for the user. You literally don't experience the drive. So lack of access = lack of phenomenality. This supports the view.

