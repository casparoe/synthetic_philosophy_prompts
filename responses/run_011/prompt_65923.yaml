answer: |-
  Here is the argument you need to shut this down. Your roommate is hiding behind a distinction that sounds rigorous but actually smuggles in a mystical assumption about what experience is. He's treating phenomenality like a ghostly glow that sits on top of information processing, whereas your view is that the processing *is* the experience.

  Here is how you reconstruct your position so it holds water.

  ### 1. Broadcasting Is Constitutive, Not Correlated
  Your roommate thinks global broadcasting is just a mechanism that makes content available for speech or reasoning, and that phenomenality is a separate layer that might or might not accompany it. You need to flip this. The claim is that "what it is like" to see red just *is* the state of that visual information being stabilized and made available to the rest of the cognitive system.

  Think about what it means for something to be "conscious." It means the information is no longer trapped in a modular silo (like early visual processing) but is now live for use by memory, planning, and language systems. If you have a state where information is globally broadcast—meaning it is influencing reasoning, poised for speech, and integrated with memory—but you claim there is "nothing it is like" to have that state, you are positing a philosophical zombie.

  The argument here is functionalist: Phenomenality isn't a magic sauce added to the broadcast; it is the first-person perspective of the broadcast itself. When the system flags information as "globally available," that flagging *is* the feeling of awareness. If nothing is broadcast, the information remains unconscious processing. If something is broadcast, there is necessarily something it is like to have it, because the "what it is like" is just the system registering its own access to that content. You cannot have the broadcasting without the experience because the experience is the broadcasting seen from the inside.

  ### 2. Handling the Counterexamples (Bite the Bullet)
  This is where your roommate will try to kill you. He'll bring up the "richness" of experience that seems to exceed what we can report. The crowded scene, the fleeting image in a partial-report paradigm, driving on autopilot, or dreams. He will say, "I clearly experienced the whole scene, but I could only report the focal object. Therefore, Phenomenality > Access."

  You need to bite the bullet here, but do it surgically. Do not deny that people *feel* like they saw more. Deny that they actually *did*.

  *   **Driving on Autopilot:** This is your strongest case. When you drive home and realize you remember nothing of the trip, your roommate wants to say you were conscious but just didn't encode it. You say: No, you weren't phenomenally conscious of the road. You were processing the road unconsciously. The lack of access (no memory, no attention) proves the lack of phenomenality. The intuition that you were "conscious" is just a confusion about what consciousness is.
  *   **The Gist of a Scene / Partial Report:** When people say they saw everything in a crowded scene for a split second, they are confusing *sensory registration* with *phenomenal experience*. The visual system registers a huge amount of data in the early buffers (iconic memory). But that data is unstable and decays instantly. It only becomes an experience when attention selects a subset and broadcasts it. The "feeling" of richness is actually a broadcasted *judgment* that more information is available if needed. You experience the confidence that you could look again, not the detailed content itself. The detail isn't there phenomenally until you access it.
  *   **Dreams:** Dreams seem like P without A because you can't report them while asleep. But you can report them immediately upon waking. This implies the information was broadcast internally during the dream to memory systems. It was accessed by the dream-self, even if the waking body was paralyzed. So dreams fit the model: internal broadcasting equals internal experience.

  The line isn't ad hoc if you stick to this principle: If the content isn't available to the systems that control reasoning and memory, it isn't part of your conscious experience. It's just unconscious computation. The intuition that there's "more there" is a trick of the brain overestimating its own resolution.

  ### 3. Where His Inference Breaks
  Your roommate's main weapon is: "The dependent variable was a report, therefore you only measured access." This is a category error.

  He is conflating **Access** (the functional state of information availability) with **Report** (the behavioral act of speaking or pressing a button).
  *   **Report** is just one specific output channel of access.
  *   **Access** is the underlying functional state where information is poised for use.

  When an experiment uses a button press to measure consciousness, it is using report as a *probe* for access. Your roommate argues that because you need report to verify the state, you can't know if phenomenality was there. But if phenomenality *is* a specific kind of access (global broadcasting), then measuring access *is* measuring phenomenality.

  The break in his logic is assuming that report is a downstream consequence of experience, rather than an expression of the same underlying state. If broadcasting constitutes experience, then the ability to report is the behavioral signature of that constitution. You aren't measuring "access instead of experience"; you are measuring the public-facing edge of the very thing that constitutes experience. To say "you only measured access" is like saying a thermometer only measures mercury expansion, not heat. Expansion is how heat manifests in that system. Report is how access manifests in that experiment.

  ### 4. Falsification and Metaphysics
  Don't waffle on the metaphysics. Go for **Identity**.
  Do not argue that access causes phenomenality. Argue that phenomenal consciousness *is* access consciousness (specifically, global broadcasting). They are not two things that correlate; they are one thing described from two angles (functional vs. subjective).

  **What falsifies this?**
  You need a clean dissociation.
  1.  **Broadcasting without Experience:** You would need to show a brain state where information is clearly globally broadcast (neural ignition, widespread availability to memory and motor systems) but the subject definitively has no experience. If you can stimulate the brain to create a global workspace state—making information available for reasoning and action—and the subject says, "I have no experience of that," your view is dead.
  2.  **Experience without Broadcasting:** Conversely, if you can find a state where a subject has vivid, reportable experience but neural monitoring shows no global integration or broadcasting (i.e., the activity remains local in sensory areas), the view collapses.

  Currently, the data suggests these two things rise and fall together. When broadcasting fails (e.g., during masking or anesthesia), experience vanishes. When broadcasting ignites, experience is reported.

  **The Direction of Explanation**
  Defend the Identity view. It is more parsimonious. Your roommate's view requires an extra ontological step: he needs the broadcasting *plus* a mysterious "phenomenal glow" that attaches to it. Your view says the broadcasting is the glow.
  If you argue that access explains phenomenality, you risk making phenomenality sound like an illusion. If you argue they are identical, you preserve the reality of experience while grounding it in physical mechanism.

  Tell him this: The only reason he thinks P and A come apart is that he insists on defining Phenomenality as "that which remains when you strip away all functional access." But if you strip away all functional access, nothing remains. There is no leftover residue. The "what it is like" is the "what you can do with it." If you fix the definition of Phenomenality to match the functional reality of Broadcasting, the problem dissolves, and the experiments aren't measuring the wrong thing—they're measuring the only thing there is to measure.
