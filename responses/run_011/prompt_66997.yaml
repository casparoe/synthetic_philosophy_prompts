      *   **Dan's Claim:** Risk aversion is *just* concavity of the utility function ($u$). Once you have concave $u$, you've captured all risk attitudes. Separate probability weighting/risk functions are redundant or confused. Defining utility over final wealth solves the small-stakes rejection and Allais paradoxes.
      *   **User's Intuition:** Dan is conflating claims. There's a calibration theorem (Rabin?) that suggests small-stakes aversion implies absurd large-stakes aversion under EU. There are dynamic choice arguments against non-EU theories.
