          *   *Silence:* Goldhagen is silent on non-exterminationist contexts. Browning handles "police battalions" better than "counter-insurgency."
          *   *Verdict:* Without state doctrine, Goldhagen's mechanism weakens. It collapses into "unit culture," which Browning explains via situational group dynamics.

      *   **Task 4: Distribution of Blame.**
