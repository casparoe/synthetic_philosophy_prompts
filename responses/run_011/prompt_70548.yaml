      *   *Reality:* Violence correlated with the black market turf wars (Chicago, etc.). Homicide rates did rise during Prohibition and dropped after Repeal, but causality is complex (post-WWI adjustments, migration, policing changes).
      *   *Consensus:* Historians agree Prohibition failed to eliminate drinking, empowered organized crime, and led to unsafe product (methanol poisoning). They disagree on the *magnitude* of consumption drop and how much crime was directly Prohibition-driven vs. broader social trends.
      *   *Analogy Survival:* The core mechanism (ban -> black market -> violence/poison) holds up historically, even if the stats are messy. The "total failure" narrative is slightly exaggerated but functionally true regarding policy goals.

  3.  **Deconstruct Question 2: Correspondence Table**
