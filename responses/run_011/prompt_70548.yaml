prompt: |-
  so I'm on the ideas/science desk and I've got a big feature coming up on fentanyl and the drug war, and here's the problem: basically every reform-minded person I interview eventually lands on the same move. we ran this experiment with alcohol, it was a disaster, we're running it again, stop. One advocate I talked to laid it out as — banning something people want doesn't remove the demand, it just hands the supply to criminals, poisons the product, and costs a fortune to police, that was true in the 1920s and its true now, so the fix is to end the ban. A book I'm leaning on for the piece goes further and treats the current overdose toll as the direct equivalent of the poisonings from adulterated booze during Prohibition, same mechanism, different molecule.

  I need to know how much of this I can let stand in print. Can you audit the analogy for me properly rather than telling me both sides have a point?

  - first, before the mapping: how accurate is the standard story about the source case actually? I've read that drinking collapsed and stayed below its old level for decades, and I've also read that homicide peaked right around repeal, and I've seen both facts used to argue for and against the comparison. which of these are solid, which are genuinely contested among historians, and does the analogy survive if the source case is messier than the slogan? no need to cite anything, I just want to know where the confidence actually sits.
  - then the correspondence table: for each element the analogy leans on — the bootlegger, the speakeasy, the wets and the drys, the enforcement machinery, the adulterated supply, the repeal itself — what's supposed to be playing that role today, and is there anything there at all? be blunt about the slots that come up empty.
  - then the disanalogies, but sorted into the ones that actually threaten the inference and the ones that are just decorative. the one I keep hearing is that anyone could brew beer in a basement whereas fentanyl needs chemical precursors, and I can't tell whether that's load-bearing or trivia.
  - what does the analogy quietly assume? I suspect it smuggles in that a ban counts as failure unless it eliminates use entirely, and that the only alternative to prohibition is a free market — which is weird given that the country everyone waves at as the success story decriminalized without legalizing, so the analogy seems to erase that middle option.
  - and the kicker: my source uses it for cannabis and for heroin and meth in the same breath. does it hold uniformly across substances or does it go thin somewhere, and where?

  then give me the verdict: what claim can I actually defend without the analogy carrying weight it can't bear, and if Prohibition is the wrong comparison, what's a better analogy for what a ban does to a market?

  last thing — tell me where this is most likely to go wrong. what piece of evidence or which counterargument would flip your verdict, and flag any spot where you're just pattern-matching how these debates usually go instead of reasoning about this one.
