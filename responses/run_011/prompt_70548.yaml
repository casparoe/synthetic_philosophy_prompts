          *   *Production:* "Basement brew" vs. "Chemical Precursors." This is load-bearing. Alcohol production is decentralized and hard to stop. Fentanyl synthesis is centralized (labs in China/Mexico) and easier to interdict *if* you target precursors, but harder to stop once the knowledge exists.
          *   *Addiction Profile:* Alcohol addiction is severe, but opioid addiction + fentanyl potency creates a different retention/consumption cycle.

  5.  **Deconstruct Question 4: Hidden Assumptions**
      *   *Success Metric:* The analogy assumes "Prohibition = Zero Use." If success is "Reduced Use + Reduced Harm," Prohibition might have reduced use initially but increased harm.
