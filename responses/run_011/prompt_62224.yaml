  2.  **Deconstruct the Core Philosophical Idea (Foucaultian without naming him):**
      *   *Sovereign Power* vs. *Disciplinary Power*. Sovereign says "no" (don't do that). Disciplinary produces reality (makes you measurable, comparable).
      *   *The Exam:* Turns the individual into a "case." It's not about law/infraction, it's about norm/deviation.
      *   *Objectification:* The tool doesn't just measure teaching; it defines what "teaching" is by deciding what counts as data. It creates categories (efficient/slow, engaging/passive) that then dictate treatment (training, promotion, scrutiny).
      *   *Actionable Advice:* Not resistance, but how to inhabit the category consciously. Reclaiming the human element within the data.

  3.  **Drafting - Step 1: The Meta-Statement:**
      *   Need to state the distinction (power that prohibits vs. power that produces objects) and the concession (the tool *will* help spot slipping pupils).
      *   Draft: This speech turns on a distinction between authority that forbids actions and authority that creates the very categories it then measures. I will concede that this new platform will successfully identify students who are disengaging before they fail. However, I argue that its primary examination is not of pupils, but of us, manufacturing types of teachers that become real through our treatment.

  4.  **Drafting - Step 2: The Speech:**
      *   *Opening:* Acknowledge the change, the investment, the mixed feelings.
      *   *The Concession:* Validate the enthusiasts. Yes, data helps spot the quiet kid.
      *   *The Turn (The Distinction):* Shift from what it measures to what it *makes*. Old power said "don't be late." New power says "here is what a teacher looks like."
      *   *The Examination:* Explain how ranking turns us into cases. Not good/bad against a rule, but normal/abnormal against each other.
      *   *The Consequence:* These categories become real. If you are marked "slow marker," you become that, and are treated as such.
      *   *The Actionable Close:* Don't smash the machine. Use it, but know what it is. Teach the human part the data misses.
      *   *Word Count Check:* Needs to be 600-750 words.
      *   *Forbidden Words:* Foucault, panopticon, power/knowledge.
      *   *Tone:* Philosophical but accessible. Serious but not apocalyptic.

