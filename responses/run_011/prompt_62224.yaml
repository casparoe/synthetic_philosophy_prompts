      *   *Philosophical Nuance:* Ensure the "producing objects" idea is clear. The dashboard doesn't just see teaching; it defines teaching as data points.
      *   *Audience Awareness:* Headteacher needs to feel respected (not attacked directly), Union rep needs to see the critique without getting ammunition for a strike call (it's about understanding, not refusing), Enthusiasts need to feel heard, Skeptics need to feel understood.
      *   *The "Knowing" Staff:* Use phrases like "mechanisms of visibility" or "categories become real" that signal the theoretical underpinning without jargon.

