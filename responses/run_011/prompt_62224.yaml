  Let's write.

  *Meta-statement:*
  This speech turns on a distinction between authority that forbids actions and authority that creates the very categories it then measures. I will concede that this new platform will successfully identify students who are disengaging before they fail. However, I argue that its primary examination is not of pupils, but of us, manufacturing types of teachers that become real through our treatment.

  *Speech:*
  Good morning. We are here to launch a new system of visibility. I know the mood in this room is mixed. Some see a lifeline; others see a leash. The Headteacher has invested significant trust in this purchase, and those of you who champion it believe it will serve the children. On that specific point, you are right. There are pupils who slip through the cracks because they are quiet, because they do not disrupt, because they vanish into the background noise of a busy classroom. This system will illuminate them. It will flag the silence where a hand should be raised. It will catch the drift before it becomes a failure. That is a genuine good, and it is worth acknowledging.

  But we must be clear about what this tool does. We often think of measurement as a mirror—that it simply reflects what is already there. We assume there is a thing called "teaching," and this dashboard takes its temperature. That is not how this works. This is not a mirror; it is a mold.

  There is a difference between a power that says "no" and a power that says "look." The old rules told us what not to do: do not be late, do not strike, do not neglect the syllabus. That is prohibition. This platform does something more subtle. It does not just forbid; it produces. It decides in advance what counts as a lesson, what counts as engagement, and what counts as efficiency. By logging call-outs and marking speeds, it does not merely observe our work; it defines the boundaries of what our work is allowed to be. It creates the objects it then claims to measure.

  And who is being measured? We tell ourselves this is about pupil analytics. But look at the distribution curves. Look at the rankings. The primary object of this examination is not the child; it is us.

  When an examination turns a person into a comparable case, it changes the nature of judgment. We are no longer being judged against a rule of conduct, but against each other. We are being sorted into a distribution of normality. You become "the teacher who marks quickly," or "the teacher who calls on few students." These are not just descriptions. They are categories that become real through what is done to the people sorted into them. If the system identifies you as an outlier, the training you receive, the conversations you have, and the expectations placed upon you will shift to match that category. The label creates the reality.

  I am not asking you to smash the machine. It is here. It is paid for. It is now part of the architecture of our school. Refusal is not an option available to us, nor would it serve the pupils who need us to be present. But understanding is available.

  So, here is what I ask you to do in September. When you log in and see your data, when you see where you sit on the curve, remember that this is a sketch, not a portrait. It captures the visible, but it cannot capture the trust you build with the angry boy in the back row. It cannot measure the silence of a student thinking deeply rather than answering quickly. It cannot record the moment you chose not to call on a child because they needed a break.

  Teach to the data where you must, so the system sees you. But teach to the human where you can, so the system does not define you. Use the tool to find the slipping child, but do not let the tool slip the teacher. We must inhabit these categories consciously, knowing they are manufactured, so that we can protect the parts of our practice that remain unmeasurable. Let us begin.

