answer: |-
  This lesson plan is designed to operationalize the tension between *stratigraphic rigor* (your friend's position) and *interpretive utility* (your position) without explicitly naming it until the debrief. The students will experience the underdetermination of the data through the friction of institutional procedure.

  ### 1. The Setup: Roles and Written Briefs

  Divide the 16 students into four subcommittees of four. Do not seat them by friendship groups. Hand each subcommittee a sealed manila envelope containing their **Mandate**, a **Criteria Checklist**, and the **Evidence Packets**.

  **The Cover Story:** Tell the class they are the *Anthropocene Working Group (AWG) Revived*. Their task is to submit a final proposal to the International Union of Geological Sciences (IUGS). The IUGS (you) will only ratify a proposal that meets specific procedural thresholds.

  **The Hidden Engine:** Each subcommittee has a different definition of "Scientific Robustness." They are not told this differs from the other groups.

  *   **Subcommittee A: Chronostratigraphy & Correlation**
      *   *Mandate:* Ensure the boundary is physically identifiable in the rock record anywhere on Earth.
      *   *Criteria Checklist:* Is the marker synchronous (global)? Is it sharp (instantaneous)? Is it preservable (will it last 10 million years)?
      *   *Bias:* Favors 1964 (Bomb Peak) or 1952 (Plutonium). Dislikes Ruddiman/1610 (fuzzy).
  *   **Subcommittee B: Earth System Dynamics**
      *   *Mandate:* Ensure the boundary marks a fundamental shift in planetary function.
      *   *Criteria Checklist:* Does the trajectory change? Is the magnitude significant? Is the driver clearly human?
      *   *Bias:* Favors 1780 (CO2 rise) or Ruddiman (long arc). Dislikes 1964 (too short-term).
  *   **Subcommittee C: Anthropogenic Driver & Ethics**
      *   *Mandate:* Ensure the boundary accurately reflects the history of human impact and responsibility.
      *   *Criteria Checklist:* Is the cause assignable? Does it align with historical consensus on industrial/colonial expansion? Is it equitable?
      *   *Bias:* Favors 1610 (Colonialism) or 1780 (Capitalism). Dislikes 1952 (erases earlier harm).
  *   **Subcommittee D: Procedural & Ratification**
      *   *Mandate:* Manage the voting rules and ensure the proposal can pass the higher authorities.
      *   *Criteria Checklist:* Does this meet the voting threshold? Is the language precise enough to avoid veto?
      *   *Bias:* They hold the voting keys. They are the only ones with the **Voting Rule Card**.

  ### 2. The Evidence Packets (Index Card Content)

  Create five distinct packets. Each packet contains 3 cards: *The Signal*, *The Cause*, and *The Problem*.

  **Option 1: The Early Anthropocene (Ruddiman)**
  *   *Signal:* Slow rise in CO2/Methane starting 5000–8000 BP.
  *   *Cause:* Deforestation for agriculture, rice irrigation.
  *   *Problem:* Signal is gradual, not sharp. Hard to correlate globally in ice cores.

  **Option 2: The Orbis Spike (1610)**
  *   *Signal:* Dip in atmospheric CO2 (colonial genocide reforestation) + pollen exchange.
  *   *Cause:* Columbian Exchange, colonization of Americas.
  *   *Problem:* CO2 dip is small. Hard to distinguish from natural variability in some sediment records.

  **Option 3: The Industrial Horizon (1780–1800)**
  *   *Signal:* Rise in black carbon (soot) in ice cores; CO2 trajectory inflection.
  *   *Cause:* Steam engine, fossil fuel combustion, capitalist expansion.
  *   *Problem:* Diachronous. Happens in UK in 1780, China in 1950, India in 1960. Not synchronous.

  **Option 4: The Great Acceleration (1950/52)**
  *   *Signal:* Sharp rise in all curves (socio-economic and earth system).
  *   *Cause:* Post-war industrial boom, nitrogen fixation, plastic.
  *   *Problem:* Plutonium marker (1952) is sharp, but socio-economic curves start rising earlier (1920s).

  **Option 5: The Bomb Peak (1964)**
  *   *Signal:* Global peak in Radionuclides (C14, Pu239). Extremely sharp.
  *   *Cause:* Nuclear testing treaty.
  *   *Problem:* Marks a *peak*, not a *start*. Geologically perfect, historically arbitrary.

  ### 3. The Decision Procedure & The Stake

  **The Stake:** The chosen date determines the **Final Paper Prompt** for the course.
  *   *If 1610/1780:* Paper must analyze environmental history through colonial/capitalist frameworks.
  *   *If 1952/1964:* Paper must analyze environmental history through technoscience/nuclear frameworks.
  *   *If Ruddiman:* Paper must analyze deep-time human ecology.
  *   *If No Epoch:* Paper must argue against periodization entirely.
  *(This makes the epistemic choice materially affect their labor.)*

  **The Voting Rules (Given only to Subcomm D):**
  1.  **Subcommittee Vote:** Each subcommittee must internally agree on *one* date to recommend to the Plenary. (Simple Majority).
  2.  **Plenary Vote:** The full class votes on the recommended date. To ratify, the proposal requires a **Two-Thirds Supermajority**.
  3.  **The Veto:** If the Supermajority is not met, the "Epoch" is rejected. The class defaults to "No Formal Epoch."

  ### 4. Minute-by-Minute Timeline (80 Minutes)

  **00:00 – 00:05: Introduction**
  *   Hand out envelopes.
  *   Script: "You are the AWG. You have 80 minutes to submit a proposal. The IUGS requires a supermajority for ratification. Your decision sets the final paper prompt. Go."
  *   *Do not explain the criteria differences.* Let them discover it.

  **00:05 – 00:30: Subcommittee Deliberation (25 mins)**
  *   Groups read their Mandate and Evidence.
  *   They must select *one* date to bring to the Plenary.
  *   *Instructor Role:* Circulate. If Group A says "1964 is the only scientific choice," and Group C says "1964 is historically absurd," do not intervene. Let them fortify their positions based on their Mandate.
  *   *Check-in at 20 mins:* Remind Subcomm D to prepare the ballot.

  **00:30 – 00:35: Transition**
  *   Move chairs to a single large circle.
  *   Subcomm D collects the four recommendations. (Likely scenario: A says 1964, B says 1780, C says 1610, D says 'Procedural Warning').

  **00:35 – 01:10: Plenary Negotiation (35 mins)**
  *   **Chairing Strategy:** You chair this. Do not advocate. Enforce the speaking order.
  *   **Phase 1 (10 mins):** Each Subcomm presents their recommendation and *justification*.
      *   *Trap:* Group A will argue "Correlation." Group C will argue "Responsibility."
      *   *Your Move:* When they talk past each other, ask: "Does Group A's marker satisfy Group C's mandate?" Force them to read each other's briefs.
  *   **Phase 2 (15 mins):** Open negotiation. Can they compromise? (e.g., "Can we pick 1952 but write a preamble about 1610?")
      *   *Constraint:* Remind them the GSSP (Golden Spike) requires a *single horizon*. You cannot have two dates.
  *   **Phase 3 (10 mins):** Drafting the motion. Subcomm D reads the voting rule (2/3 majority).

  **01:10 – 01:15: The Vote (5 mins)**
  *   Secret ballot or show of hands.
  *   Count the votes.
  *   **Outcome A:** Supermajority reached. Epoch Ratified.
  *   **Outcome B:** Supermajority failed. Epoch Rejected.

  **01:15 – 01:20: The Reveal & Debrief (5 mins)**
  *   *See Debrief section below.*

  ### 5. Debrief Strategy

  **When to reveal the 2024 outcome?**
  **After their vote.**
  If you reveal it before, they will anchor to the "correct" historical answer. If you reveal it after, the parallel becomes structural.

  **The Script:**
  1.  **If they Ratified:** "You succeeded where the real AWG failed. In March 2024, the Subcommission on Quaternary Stratigraphy voted to reject the Anthropocene epoch entirely. They argued the stratigraphic signal was insufficient."
      *   *Point:* This validates your friend. The rock record *did* underdetermine the choice for them, leading to rejection.
  2.  **If they Rejected:** "You mirrored the real outcome. In March 2024, the Subcommission rejected the epoch."
      *   *Point:* This validates your point. The rejection wasn't just about rocks; it was about whether the *concept* fits the *method*.

  **Mapping the Conflict:**
  *   Ask Group A: "Did you feel Group C was doing science or politics?" (They will say politics).
  *   Ask Group C: "Did you feel Group A was being rigorous or reductive?" (They will say reductive).
  *   **The Punchline:** "My friend the sedimentologist says the date is an empirical question. I say the record underdetermines the date. Today, you proved [Instructor's View]: The data didn't change, but your *mandates* changed the outcome. The 2024 rejection happened because the Subcommission decided the 'Anthropocene' is a human story forced onto a rock record, not a rock record demanding a human story."

  ### 6. Troubleshooting: What Will Go Wrong

  **1. The "It's All Politics" Short-Circuit**
  *   *Scenario:* A student in Group C reads the briefs and says, "This is fake. Geology is real. We should just pick the sharpest spike."
  *   *Fix:* Do not argue truth. Argue *jurisdiction*.
  *   *Script:* "You are acting as the AWG. Your job isn't to find the Truth, it's to write the Rule that all future geologists must follow. If you pick the sharpest spike but it ignores the cause, the IUGS will reject it as 'lacking context.' You must build a coalition."
  *   *Why this works:* It forces the "empiricist" to do the political work of coalition-building, proving your point that consensus requires more than data.

  **2. The Deadlock**
  *   *Scenario:* They cannot reach 2/3 majority. Time runs out.
  *   *Fix:* This is a feature, not a bug.
  *   *Script:* "Time. The proposal fails. The status quo remains: Holocene."
  *   *Debrief:* "This is exactly what happened in 2024. The Working Group wanted 1952. The Subcommission said 'No.' The deadlock *is* the data."

  **3. Group D (Procedural) Dominating**
  *   *Scenario:* They realize they hold the veto power and dictate terms.
  *   *Fix:* Remind them Subcomm D has no scientific mandate. They can manage the vote, but they cannot generate the evidence. If they propose a date without scientific backing from A/B/C, *you* (as IUGS) veto it for lack of evidence.

  ### 7. Limitations: What You Must Supply By Hand

  You identified the core limitation: **The sheer technical force of correlation.**

  Your friend is right that an uncorrelatable boundary is not a stratigraphic boundary. In this activity, "correlation" is a bullet point on an index card. In reality, it is years of drilling, mass spectrometry, and peer review.
  *   **The Risk:** Students may leave thinking the dispute is *only* semantic or political, underestimating the material constraint of the rock.
  *   **The Fix:** In the debrief, explicitly state: "My friend's point stands: If you cannot find the marker in a lake in Poland and a core in the Pacific, you do not have a boundary. Today, we simulated the *negotiation* of that constraint. But do not mistake the map for the territory. The rock resists us. The 2024 rejection happened because the rock *would not speak* clearly enough to satisfy the stratigraphers, regardless of how much the humanists wanted it to."

  **Material Prep Checklist:**
  *   4 Manila Envelopes.
  *   15 Index Cards (3 per date option).
  *   1 Voting Rule Card (for Subcomm D).
  *   4 Mandate Sheets (one per group).
  *   Whiteboard markers (for Subcomm D to tally votes).
  *   Timer (visible to class).

  This design forces them to inhabit the incompatibility. They will feel the frustration of Group A (why won't they pick the sharp signal?) and Group C (why won't they acknowledge the history?). That frustration *is* the lesson.
