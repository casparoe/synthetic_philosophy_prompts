prompt: |-
  You are a professional philosopher working on social epistemology with formal training. I am a high school senior writing an independent research paper of roughly 6,000 words over eight weeks under a mentor, and I need help turning a half-formed idea into a serious proposal.

  The idea: the Condorcet jury theorem is usually attacked on two separate grounds — that voters are not independent, and that there is no reason to think any given voter is right more often than not. But the attacks are pressed one at a time, and I suspect the interesting question sits between them: if we grant the competence assumption for the sake of argument, how much correlation among voters' errors can the theorem absorb before majority reliability collapses? My working thought is that several institutions defended on epistemic grounds — secret ballots, deliberative rules of order, a plurality of news sources, federal subdivision of decisions — are better understood as devices for lowering average pairwise correlation of errors than for raising individual competence, and that this yields a version of the epistemic defense of democracy that is precise and at least testable in principle.

  Think carefully about whether the question as I have stated it is well posed at all, and begin by brainstorming three or four genuinely distinct ways to frame it, saying which framing could produce a determinate result inside eight weeks. Then write the proposal on that framing: a precise statement of the research question; why the standard formulations of the theorem and the standard objections leave the question open; my method, week by week, including what formal work I would actually do and what I would only gesture at; what a successful result would look like and what would count as the project's failing; and an honest assessment of whether the scope is realistic for someone without graduate-level probability. I will add the citations myself, so refer to positions and arguments rather than to sources.
