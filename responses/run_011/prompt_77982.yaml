  Yes, the case can be built as specified, and the give-up-the-gain claim survives the innocent-descendant objection while the harm-and-compensation claim does not.

  In 1885, the Thorne family dynamited a rock ledge on the adjacent Keene property to widen a river channel for their sawmill, permanently appropriating fifty feet of riverbank; the Thornes were sued immediately and paid the Keenes $10,000, documented in court records as covering the land's full market value plus fifty years of projected timber revenue, which the Keenes used to purchase superior timber rights elsewhere that generated equivalent wealth, leaving today's Keene descendants with no measurable deficit in wealth, status, or opportunity compared to the scenario where the ledge remained intact, while the Thornes' descendants, who inherited the mill in good faith without knowledge of the specific settlement terms, still operate the same widened channel which remains physically incapable of functioning without that specific fifty-foot appropriation.

  **Running the Accounts**
  The harm-and-compensation view asks: "Are the Keenes currently suffering a deficit caused by the Thorne ancestor?" The facts state the Keenes were fully compensated at the time and reinvested successfully, leaving them equally well-off today. Since the harm was extinguished by the 1885 payment and no residual injury exists, this account concludes zero debt is owed. The give-up-the-gain view asks: "Do the Thornes currently hold a benefit derived from the wrong?" The facts state the mill channel physically requires the appropriated land to function. Since the Thornes possess a functional asset they would not have without the initial theft, this account concludes they owe the value of that continued use, regardless of the Keenes' financial status.

  **The Innocent-Descendant Objection**
  This objection defeats the harm-and-compensation claim trivially, because that claim already found no debt existed; there is nothing to object to. It fails to defeat the give-up-the-gain claim because unjust enrichment targets the *asset*, not the *actor*. The moral force comes from the illegitimacy of the holding, not the guilt of the holder. An innocent heir cannot claim rightful ownership of a thing that only exists due to a wrong, even if they didn't commit it; their innocence protects them from punishment, but not from the obligation to return stolen property.

  **The Single Feature**
  The work is done by the **persistence of the specific asset**. The case hinges on the fact that the wrong created a physical capability (the widened channel) that survives independently of the victim's welfare, allowing the "gain" to be identified and measured separately from the "loss."

  **Breaking the Case**
  If the asset was sold off two generations ago and the money spent, the give-up-the-gain claim collapses. Unjust enrichment requires *retained* benefit; if the mill was sold and the proceeds consumed on living expenses, there is no traceable gain left to disgorge. You could argue the heirs' general wealth is higher than it otherwise would have been, but without a traceable asset, this becomes speculative counterfactual history, violating your constraint against hidden harm calculations. Without the asset, the "gain" view loses its target and defaults to the harm view's conclusion: no debt.

  **The Brother-in-Law's Best Move**
  His strongest argument is not about harm, but about **liberal individualism**. He should argue that forcing an innocent heir to pay for an ancestor's sin is itself a violation of justice, indistinguishable from punishment. Even if the Thornes hold a gain, demanding they surrender it to someone who is already whole transforms reparations from "repair" into "penalty." He will argue that in a liberal society, obligations die with the individual unless explicitly contracted, and that binding heirs to ancestral debts violates their autonomy just as much as the original wrong violated the victim's.
