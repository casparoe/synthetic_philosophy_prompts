answer: |-
  ### The Principle of Custodial Continuity

  To render your verdicts consistent without relying on intuition, you require a principle that distinguishes between the *artifact* (the code or data), the *label* (the name), and the *institution* (the authority to change them). Your tentative principle ("identity follows the chain of sanctioned change") is close, but it fails to distinguish between *state* (data) and *logic* (code), and it falters when the chain of sanction is broken but the name is reclaimed.

  Here is the repaired principle, stated precisely:

  > **A software project retains its identity if and only if there exists an unbroken chain of legitimate stewardship over its defining logic.**
  >
  > 1.  **Defining Logic:** For software, this is the source code and schema (instructions); for a database project, this is the data content (state).
  > 2.  **Legitimate Stewardship:** The authority to modify the logic, derived either from the previous stewards (incremental commit or explicit handover) or from the governing institution that established the project.
  > 3.  **Unbroken Chain:** Identity persists through incremental change or total rewrite *by the same stewards*. Identity breaks if stewardship ceases (no maintainers) and is subsequently assumed by a new group without explicit transfer, even if they adopt the old name.

  ### Application to Your Six Verdicts

  Testing this principle against your cases reveals where your intuitions align and where they conflict.

  1.  **Gradual Replacement (20 years, same community):** **Same Project.** The chain of stewardship is unbroken; the logic evolves incrementally under the same authority.
  2.  **Rebuild from Scratch (Archived, new team):** **Not the Same Project.** The chain of stewardship was severed (archive). The new team lacks derivation from the old stewards.
  3.  **Hard Fork (95% code, new governance vs. moribund original):** **Two Projects.** The fork establishes a *new* chain of stewardship (new governance). The original retains the *old* chain, even if inactive. Identity is not determined by code volume or contributor count, but by the authority lineage.
  4.  **Fork Resurrection (Original committers leave, fork team adopts old name):** **New Project (Successor).** *This contradicts your intuition.* Under the principle, the original chain died when the last committer departed. The fork team adopting the name is a *succession*, not a *resurrection*. They are a new project inheriting the brand of the dead one. To call it the "Original Returned" requires mysticism about the name itself having agency.
  5.  **Internal Rewrite (Same team, new language):** **Same Project.** Stewardship is continuous; the logic is transformed but the authority defining it is identical.
  6.  **Database Replacement (Every row replaced, schema/app unchanged):** **Same Project.** *This corrects your hesitation.* You must distinguish the *Project* (the system/schema/stewardship) from the *State* (the rows). If the project is the software managing the DB, it is the same (like Verdict 1). If the project *is* the dataset (e.g., a specific archive), then replacing every row breaks the identity. Assuming you mean the software system, consistency with Verdict 1 demands this be "Same." If you mean the dataset, it is "Not Same." I advise you to classify the *database system* as the project, making this **Same**, to maintain consistency with Verdict 1.

  ### Verdicts on Two New Cases

  Applying the **Principle of Custodial Continuity** to your unconsidered cases:

  **Case A: Untouched code, entirely replaced contributors and documentation.**
  *   **Verdict:** **Not the Same Project.**
  *   **Reasoning:** While the logic (code) is static, the stewardship has been completely swapped. Unless there was an explicit handover of authority from the old contributors to the new ones, the chain of legitimacy is broken. This is functionally identical to your "Rebuild from Scratch" case (Verdict 2), merely with preserved artifacts rather than recreated ones. It is a fork of a static repository.

  **Case B: Renames itself while changing nothing else.**
  *   **Verdict:** **Same Project.**
  *   **Reasoning:** The name is a label, not a component of the defining logic or stewardship. As long as the chain of authority and the logic remain continuous, a change in label is analogous to a person changing their name; the institutional identity persists.

  ### The Candid Trade-off: Which Verdict Must Be Abandoned?

  To maintain a rigorous, applicable principle, you must abandon the intuition behind **Verdict 4 (Fork Resurrection)**.

  You want to say that when the fork team takes over the old name after the original maintainers vanish, "the original has returned." This is emotionally satisfying but institutionally incoherent. It forces you to treat the *Name* as the carrier of identity, which contradicts Verdict 2 (where the name was kept but you correctly identified it as a new project) and Verdict 3 (where the code and people were kept, but the governance change made it new).

  **The Trade-off:**
  You are trading **Continuity of Community** against **Continuity of Lineage**.
  *   **If you prioritize Lineage (Verdict 3 & 4 consistency):** You must admit that once the original maintainers are gone, the project is dead. The fork team is a *successor*, not a *resurrection*. The "Original" is a historical entity, like a defunct company whose brand is bought by another.
  *   **If you prioritize Community (Verdict 4 intuition):** You must concede that Verdict 3 is wrong. If the fork has 95% of the code and *most of the contributors*, the "Project" (as a social organism) moved to the fork. The "Original" repository is merely the empty shell.

  **Recommendation:**
  For a column on the *institutional life* of software, **prioritize Lineage (Stewardship).** Institutions are defined by their rules of succession, not just their current population.
  *   **Abandon:** The idea that the Original "returns" in Verdict 4.
  *   **Replace with:** The Fork becomes the *Canonical Successor*. It is the living project that inherits the mantle, but it is not the *same* institutional entity as the one that died.
  *   **Why:** This preserves the sanctity of governance (Verdict 3) and prevents identity from becoming magical (Verdict 4). It acknowledges that software projects, like corporations, can die and be succeeded by new entities that look exactly like them.

  **Final Adjustment on Verdict 6:**
  You must also resolve your hesitation on the Database case. If you define the project by its **Logic** (Code/Schema), Verdict 6 is **Same** (matching Verdict 1). If you define it by its **State** (Data), Verdict 6 is **Not Same**. You cannot have it both ways. Given your focus on "software," I urge you to define the project by its Logic. A database *system* is software; the rows are its runtime memory. Changing memory does not kill the process.

  **Summary of the Principle for your Column:**
  > "A project is not its code, nor its name, nor even its people. It is the continuous chain of authority authorized to change them. When that chain breaks, the project dies, even if its ghost walks in the hands of others."
