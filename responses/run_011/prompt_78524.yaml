  I'm on a philosophy of language module and we did Lewis on convention this week. In seminar our tutor went round the room ruling on whether various regularities count as conventions, and her verdicts were: driving on the left in the UK — yes; adjectives going before nouns in English — yes; everyone standing on the right on Tube escalators — yes; the whole department reply-all-ing to a mailing list that literally everyone moans about — yes, she was firm that the fact we'd all prefer some other arrangement doesn't disqualify it; the residents-only parking bay on my street, where you get a ticket — no, that's just law; tipping 20% in American restaurants — no, on her view that one's held up by guilt and dread of being thought tight rather than by anybody's interest in coordinating.

  The case for next week is mine. In the house I live in, everyone takes their shoes off in the hall. There's no house rule and no fine, the landlord has never mentioned it once, it's total common knowledge, nobody could of predicted it before moving in (the house next door keeps their shoes on), and when a first-year came in wearing his boots the whole floor gave him the cold shoulder until he started leaving them by the door.

  Will she call that a convention? Tell me the verdict you'd actually bet on, then the rival rules that fit her track record just as well, what each of them comes out as on the shoes, and one further case that would separate the candidates more sharply than this one does. Please also be clear about which parts of Lewis's account are settled and which are genuinely contested among people who work on it — I don't want a contested reading served up as the standard line. British English, ta.
