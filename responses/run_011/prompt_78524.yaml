answer: |-
  Here is the verdict I would bet on, followed by the analysis of your tutor's criteria, a test case to split the differences, and a note on the scholarship.

  ### The Verdict
  **Yes, she will call it a convention.**

  It fits the pattern of the 'Tube escalator' and 'Driving on the left' cases almost perfectly. It is an arbitrary regularity (the house next door does the opposite), sustained by common knowledge and mutual expectation, without legal coercion. The 'cold shoulder' is a social sanction analogous to the tutting you get on the Tube, not a legal fine or a moral guilt-trip of the sort she identified in the Tipping case.

  ### Rival Rules Fitting the Track Record
  To understand why, we have to reconstruct the rule your tutor is using to filter 'Convention' from 'Norm' or 'Law'. Based on her six previous rulings, here are the two strongest competing hypotheses:

  **Rule 1: The "Coordination Problem" Requirement**
  *   **The Rule:** A regularity is a convention only if it solves a *coordination problem* between members of the population (i.e., I want to do $X$ if you do $X$, and we both prefer $(X,X)$ to $(Y,Y)$ or mismatch). If the regularity is driven by a moral obligation to a third party or internal guilt, it is not a convention.
  *   **Fit:** Explains why **Driving**, **Adjectives**, **Tube**, **Reply-All**, and **Shoes** are Yes (all involve coordinating behaviour with peers). Explains why **Parking** is No (law overrides coordination). Crucially, explains why **Tipping** is No: diners do not need to coordinate *with each other* to tip; they are responding to a moral claim from the waiter.
  *   **Prediction on Shoes:** **Yes.** Housemates coordinate to keep floors clean.

  **Rule 2: The "Sanction Source" Distinction**
  *   **The Rule:** Conventions can be enforced by social pressure (glaring, cold shoulders), but not by formal law (fines) or internal moral sentiment (guilt/dread of character judgment).
  *   **Fit:** Explains **Tube** (Yes, social pressure) vs. **Parking** (No, law) vs. **Tipping** (No, guilt/dread).
  *   **Prediction on Shoes:** **Yes.** The 'cold shoulder' is external social pressure, akin to the Tube, not internal guilt.

  Both rules yield the same verdict on the shoes, which makes your case a 'safe' one for her. However, they diverge on the nature of the pressure involved.

  ### A Sharper Test Case
  To separate Rule 1 (Coordination) from Rule 2 (Sanction Source), you need a case that involves social sanctions but lacks a coordination problem.

  **The Case:** **Giving up your seat on the bus for an elderly person.**
  *   **The Setup:** There is a regularity where able-bodied people stand so elderly people can sit. If you sit, people glare at you (social sanction). There is no law (no fine). It is arbitrary in the Lewisian sense (we could have a convention where the fastest person grabs the seat).
  *   **Why it separates the candidates:**
      *   **Rule 1 (Coordination) says: No.** Passengers do not need to coordinate *with each other* to solve this. My standing doesn't help me unless you stand; rather, my standing helps the *elderly person*. It is a norm of fairness or morality, not a coordination equilibrium between peers.
      *   **Rule 2 (Sanction Source) says: Yes.** It relies on social glare (like the Tube), not law (like Parking) or purely internal guilt (like Tipping, though this is borderline).
      *   **Likely Tutor Verdict:** Given her reasoning on Tipping ("rather than by anybody's interest in coordinating"), she will likely say **No**. This confirms that Rule 1 is her operating principle.

  ### Settled vs. Contested in Lewis Scholarship
  You asked for clarity on what is standard Lewis versus what is your tutor's specific interpretation.

  **Settled (The Standard Line):**
  *   **Arbitrariness:** A convention must have an alternative regularity that *could* have prevailed instead (e.g., driving on the right). Your shoes case fits this (next door keeps shoes on).
  *   **Common Knowledge:** It is not enough that everyone conforms; everyone must know that everyone knows, and so on. Your prompt specifies "total common knowledge", so you have ticked this box.
  *   **Conditional Preference:** Agents prefer to conform *on the condition* that others do. This is the core of the coordination equilibrium.
  *   **Law vs. Convention:** Lewis explicitly distinguishes conventions from agreements enforced by external penalty (law). The Parking verdict is standard Lewis.

  **Contested (Where your Tutor is taking a stance):**
  *   **The Role of Normativity:** Lewis's original account in *Convention* (1969) tries to explain norms without presupposing them (reducing them to preferences and expectations). However, many subsequent philosophers (e.g., Margaret Gilbert, Cristina Bicchieri) argue Lewis fails to capture the *normative force* of conventions—why we feel we *ought* to follow them.
  *   **The Tipping Verdict:** This is **not** the standard Lewisian reading. Most game-theorists and Lewisians *would* classify tipping as a convention (specifically, a norm solving a cooperation or assurance problem). Your tutor's rejection of it based on "guilt and dread... rather than interest in coordinating" suggests she is adopting a stricter distinction between **Social Conventions** (Lewisian coordination) and **Social Norms** (Bicchieri-style conditional preferences based on moral expectations). She is effectively filtering out cases where the preference is moral rather than practical.
  *   **Pareto-Inferior Conventions:** Her acceptance of the 'Reply-All' case (where everyone moans but conforms) is faithful to Lewis. Lewis acknowledges that conventions can persist even if a better equilibrium exists, provided the current one is stable due to expectation.

  **Summary for your seminar:**
  Argue that the shoes case is a **coordination equilibrium** (clean floors vs. dirty floors) sustained by **common knowledge** and **social sanction**, distinct from law. Acknowledge that while Lewis might have counted Tipping as a convention, your tutor's distinction (practical coordination vs. moral compliance) still places the shoes firmly in the 'Convention' camp alongside the Tube escalators.

  Ta.
