answer: |-
  The standard defense of futarchy rests on a category error: it treats policy outcomes as if they were exogenous events, like rain or election results, when they are fundamentally endogenous to the market's pricing. In an ordinary prediction market, the disciplinary mechanism works because reality is an independent judge. If a contract pays out on "Rain in London on Tuesday," the meteorological reality of London is indifferent to the volume of trades or the price of the contract. A speculator who prices the probability at 90% when the true chance is 10% will be bankrupted by the actual weather. The truth exists prior to and independent of the bet; the market merely discovers it.

  In a decision market, this independence collapses. Here, the "truth" being estimated is the utility of a policy *conditional on its adoption*. But in futarchy, adoption is determined by the estimate itself. This creates a reflexive loop where the price does not merely predict the future; it selects which future comes to pass. When the price determines the policy, the quantity being estimated is no longer an independent target. Consequently, a mistaken estimate can become empirically correct simply by being acted upon, producing a self-confirming equilibrium that insulates the market from correction.

  Consider a market pricing the proposition: "If Policy A is adopted, national income will rise." If the market price crosses a threshold, Policy A is enacted. Suppose the traders are mistaken, and Policy A is actually economically inefficient compared to Policy B. However, the mere enactment of Policy A might signal stability to investors, or the implementation process might involve short-term stimulus that temporarily boosts income. The prediction ("income will rise") comes true *because* the policy was adopted based on that prediction. The traders who bought "Yes" contracts are paid out; the market is validated.

  This self-confirmation is a defect, not a triumph, because it violates the futarchist's own success criterion: realized utility. Futarchy is not sold as a mechanism for generating accurate predictions for their own sake; it is sold as a mechanism for *maximizing* utility. A prediction market that converges on a self-fulfilling prophecy achieves *calibration* (the predicted outcome matches the observed outcome) but fails at *optimization* (selecting the best possible outcome).

  If the market settles on a policy that yields a utility of 10 because it predicted a utility of 10, it appears successful. But if there existed an untried Policy B that would have yielded a utility of 100, the market has failed its mandate. By making the realization of the outcome contingent on the prediction, the market destroys the counterfactual data required to distinguish a "good" policy from a "merely consistent" one. The discipline of the market relies on the penalty of being wrong. But in a reflexive system, you are rarely "wrong" about the outcome you chose; you are only wrong about the opportunity cost of the outcomes you rejected. Since the market only prices the chosen path, it cannot be penalized for the road not taken.

  The obvious objection to this critique is that a genuinely bad fixed point would eventually manifest as low realized utility. If Policy A is truly detrimental, the argument goes, the utility metric will drop, traders holding "Success" contracts will lose money, and the market will revise the price downward, abandoning the policy.

  This objection fails because it assumes utility is a transparent, immediate signal that overrides the self-confirming mechanism, and it ignores the problem of local maxima. First, utility is often noisy and lagging. A self-fulfilling policy can generate enough short-term confirmation (e.g., a confidence boom) to keep the market in the black long enough for the traders to exit or for the policy to become entrenched. Second, and more critically, this objection assumes the market can compare the realized utility against the counterfactual utility of the rejected policy. It cannot.

  If the market converges on a suboptimal equilibrium where Policy A yields +5 utility (predicted +5), and Policy B would have yielded +50 utility (but was predicted +4 and thus never tried), the market sees a "success." The traders made money. The utility metric went up. There is no signal to revise the belief because, within the observable data of the system, the prediction was correct. The market becomes a machine for actualizing its own biases rather than discovering optimal governance. It solves for consistency, not optimality.

  Therefore, the disciplinary analogy with exogenous prediction markets is broken. In exogenous markets, reality pushes back against false prices. In decision markets, false prices can reshape reality to match themselves. The market is no longer a thermometer measuring the temperature of the room; it is a thermostat that has been wired to believe its own reading. If it reads "too hot" and turns on the AC, but the sensor was broken and the room was actually cold, the room becomes freezing. The sensor was "right" that the AC would lower the temperature, but the system has failed to maintain a habitable environment. In futarchy, the market may be perfectly accurate about the world it creates, while systematically failing to create the best world possible.
