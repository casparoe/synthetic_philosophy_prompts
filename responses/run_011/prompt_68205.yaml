answer: |-
  **Concession** — I concede that the mechanism fixing the higher-order state's content remains opaque to you.

  **Reply** — I take the second horn: the unconscious state possesses fine-grained content without conceptual mastery. Phenomenal character is exhausted by representation, not conception. You assume representing crimson requires a concept, but non-conceptual content can be equally specific. Your dilemma assumes a gap between the experience and its representation that I deny. The higher-order state scans the first-order state's output, inheriting resolution through causal covariance, not classification. The difference isn't undetectable because the experience itself is the detection; there is no further fact beyond how it is represented. To demand access to the representing mechanism rather than the content is to demand an inner sense, which I reject. The phenomenology is the display, not the projector.

  **Counter** — If you insist concepts determine phenomenology, how do you account for the rich visual experience of animals lacking our color vocabulary?
