answer: |-
  ### Candidate Concepts and Evaluation

  To isolate the structure of your disagreement, I will list the standard causal concepts that typically govern these debates, evaluating whether they fit the Sarajevo/Waterloo configuration.

  **1. Sine Qua Non (But-For Causation)**
  *   **Definition:** $C$ causes $E$ if and only if, had $C$ not occurred, $E$ would not have occurred.
  *   **Verdict:** **Rules In (Friend), Rules Out (You).** This is your friend's position. It captures the ontological link: the actual chain of events passed through the stalled car. However, it fails your intuition because it ignores the *availability* of other paths. It treats the actual history as the only possible history.

  **2. Overdetermination**
  *   **Definition:** Two or more distinct causes occur, each sufficient on its own to bring about $E$. (e.g., two assassins shoot simultaneously).
  *   **Verdict:** **Rules Out.** In your case, the alternative sparks did *not* occur. Only the car stalled. Overdetermination requires multiple *actual* sufficient causes. You are describing multiple *potential* sufficient causes.

  **3. Preemption (Early or Late)**
  *   **Definition:** $C$ causes $E$, but there was a backup cause $C^*$ ready to produce $E$ if $C$ had failed. $C$ "preempted" $C^*$.
  *   **Verdict:** **Partial Fit.** This is the closest standard concept. In classic preemption, the backup process is usually already underway (e.g., a second assassin is already aiming). In your historical cases, the backup (another crisis) wasn't necessarily "aimed" yet, but the *conditions* made its emergence highly probable. Your case is a *structural* or *dispositional* version of preemption, where the backup is not a specific waiting event but a high-probability class of events.

  **4. INUS Condition (Insufficient but Non-redundant part of an Unnecessary but Sufficient condition)**
  *   **Definition:** $C$ is a necessary part of a complex set of conditions that together are sufficient for $E$, but that complex set is not the only set that could produce $E$.
  *   **Verdict:** **Rules In (Technical), Rules Out (Intuitive).** Technically, the stalled car is an INUS condition. It was part of a sufficient set (car stall + tensions + alliances). But the INUS formulation doesn't capture the *arbitrariness* you feel. It acknowledges other sets exist, but doesn't weigh in on whether the specific token cause matters if the other sets were waiting in the wings.

  **5. Equifinality**
  *   **Definition:** A system property where different initial conditions or paths lead to the same end state.
  *   **Verdict:** **Rules In (System), Rules Out (Link).** This describes the *context* (the geopolitical system of 1914), but it is not a name for the *causal relation* between the car and the war. It explains why you feel the car didn't matter, but it doesn't name the car's status.

  **6. Causal Fragility / Robustness (Sensitivity)**
  *   **Definition:** Measures how much the outcome changes given small changes to the cause or background. A "fragile" outcome depends sensitively on the specific cause; a "robust" outcome occurs across a wide range of variations.
  *   **Verdict:** **Rules In (Core Intuition).** This captures the substantive heart of your argument. You are claiming the outcome (War) was *robust* to the variation of the trigger (Car). Your friend is claiming the token causation holds regardless of robustness.

  ***

  ### The Verdict

  There is no single, universally standardized noun-phrase in the canon that perfectly captures "an actual cause that was the only route operated but was structurally redundant due to high-probability alternatives." However, the conceptual space is well-mapped.

  Your dispute is not merely verbal; it is a substantive clash between **Ontological Dependence** (your friend) and **Explanatory Salience** (you).

  Here is the conceptual carving you need:

  #### (a) The Nearest Established Concepts and Departures

  The nearest standard concept is **Preemption**.
  *   **How it fits:** It acknowledges that $C$ caused $E$, but recognizes that if $C$ had not occurred, $E$ would still have occurred via $C^*$.
  *   **How your case departs:** Standard preemption usually involves a specific, existing backup mechanism (a second assassin, a backup wire). Your historical case involves a *probabilistic field* of backups. The "backup" wasn't a specific event waiting in the wings; it was a *disposition of the system* to generate a spark. This is **Dispositional Preemption**.

  The second nearest concept is **Causal Robustness**.
  *   **How it fits:** It captures your intuition that the war was "going to happen anyway."
  *   **How your case departs:** Robustness is usually a property of the *outcome* or the *system*, not a label for the *cause*. You need a term that labels the *cause* in light of the system's robustness.

  #### (b) Is there a single term?

  No single existing term covers the departure perfectly without qualification. However, in rigorous causal analysis, this configuration is best described as **Modal Redundancy**.

  The stalled car is a **Modally Redundant Token Cause**.
  *   **Token:** It actually happened and actually triggered the effect.
  *   **Modally Redundant:** In the "modal neighborhood" (the set of nearby possible worlds), the effect occurs even without this specific token.

  If you require a phrase that historians and philosophers use to dismiss the friend's argument, it is **Causal Insignificance due to Structural Sufficiency**. But the precise technical label for the *configuration* is **Preemption by Probabilistic Backup**.

  #### (c) Proposed Definition and Boundary Cases

  Since you asked for a definition to handle the edges of the phenomenon, I propose we define this as **Structurally Redundant Token Causation**.

  **Definition:**
  A cause $C$ is a *Structurally Redundant Token* for effect $E$ if:
  1.  $C$ occurs and is part of the actual causal chain producing $E$.
  2.  Had $C$ not occurred, $E$ (or a relevantly similar $E^*$) would still have occurred with high probability within a specific timeframe.
  3.  The probability of $E$ occurring without $C$ is grounded in stable background conditions ($B$) that generate alternative triggers ($C^*, C^{**}$) independently of $C$.

  **The Boundary: When does Robustness become Fragility?**

  This is the crux of your three-hour argument. The boundary lies in **Event Individuation**. You and your friend are assuming "World War I" is a single, monolithic block. It is not. The status of the stalled car depends on how finely we slice the outcome.

  *   **Case 1: Coarse Individuation (Your View).**
      *   *Outcome:* "A general European War involving these powers."
      *   *Verdict:* The car is **Structurally Redundant**. The background tensions ($B$) ensure that *some* war starts within 2 years. The specific date and spark do not change the *type* of outcome.
      *   *Boundary:* If the war starts 6 months later, is it the same war? If yes, the car is redundant.

  *   **Case 2: Fine Individuation (Friend's View).**
      *   *Outcome:* "A war starting August 1914 triggered by the Austro-Serbian crisis."
      *   *Verdict:* The car is **Causally Essential**. If the car doesn't stall, the specific diplomatic cascade of August 1914 does not happen. A war starting in 1915 triggered by a naval incident is a *different* event token.
      *   *Boundary:* If the war starts 6 months later, the alliance structures might shift (e.g., Italy joins earlier, Russia collapses later). The *specific* historical trajectory is fragile, even if the *general* state of war is robust.

  **The Tipping Point:**
  The cause stops being redundant and becomes essential when the removal of $C$ pushes the system into a different **Basin of Attraction**.
  *   *Robust Zone:* Removing $C$ delays $E$ by weeks/months, but the background pressure ($B$) forces $E$ through a similar channel. (The car stall is redundant).
  *   *Fragile Zone:* Removing $C$ allows enough time for $B$ to dissipate or change configuration (e.g., a treaty is signed, a leader dies naturally), such that $E$ either doesn't happen or happens in a fundamentally different way (e.g., a cold war instead of a hot war).

  **Substantive or Verbal?**
  Your argument is **substantive**. It is not a fight over the word "cause." It is a fight over **Explanatory Interests**.
  *   Your friend is asking: *"What initiated the actual sequence?"* (Ontological/Forensic interest).
  *   You are asking: *"What explains the inevitability of the outcome?"* (Sociological/Structural interest).

  Both are valid causal questions, but they target different layers of reality. The stalled car is the *trigger* (friend's truth), but the powder keg is the *explanation* (your truth). In historical methodology, we usually privilege the explanation that offers the most **leverage**. Since we cannot change the car stall, knowing it caused the war offers no leverage. Knowing the *tensions* caused the war offers leverage for understanding other conflicts. Therefore, while the friend is ontologically correct, you are explanatorily superior.

  **Final Diagnosis:**
  You are describing **Structurally Redundant Token Causation** within a **Robust System**. The car was a **Modally Dispensable Trigger**. Your friend is arguing from **Token Dependence**; you are arguing from **Modal Insensitivity**. The boundary is determined by how finely you individuate the "War." If the war's *character* changes with the delay, the car matters. If only the *date* changes, the car is redundant.
