      *   *Judgment 8:* Should it be abandoned? Most queueing theorists say "no saving spots." The intuition that 7 is okay and 8 is not relies on *necessity* vs. *convenience*. I should advise the user that 8 is likely correct and the principle needs to account for "Fairness/Equality of Burden."

  6.  **Address Request 3 (New Cases):**
