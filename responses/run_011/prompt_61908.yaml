answer: |-
  This is a rigorous and fascinating puzzle. You are attempting to map the boundary between *mores* (moral obligations) and *folkways* (social conveniences), specifically through the lens of the outsider. Your intuition that "Reliance" is insufficient is correct; it is a utilitarian metric trying to solve a deontological problem.

  Here is the attack you requested, structured according to your four demands.

  ### 1. The Principles Generating the Verdicts

  Your "Reliance Test" is a principle of **Coordination**. It explains why we follow rules that keep the machine running. But your outliers (the child, the shoes, the friend in the queue) suggest a second principle of **Constitution**. These are rules that do not merely facilitate interaction but *define the relationship* between the parties.

  Here are the two candidates that generate your ten verdicts:

  **Candidate A: The Principle of Cooperative Stability (Coordination)**
  *   **Formulation:** A visitor is bound by a local convention when non-compliance imposes a measurable cost on others who have structured their expectations around compliance, *or* when non-compliance creates ambiguity that degrades the efficiency of a shared system.
  *   **The Clause that Forces It:** The "empty street at 2 AM" clause. If there is no cost and no ambiguity (no other drivers/pedestrians), the obligation vanishes.
  *   **Verdicts Accommodated:** 1 (Tipping US), 3 (Jaywalking alone), 5 (Manhattan flow), 6 (Loose cluster), 7 (Restroom break), 10 (Driving side).
  *   **Why it fits:** In all these cases, the rule exists to prevent collision (literal or economic). When the risk of collision is removed (3), the obligation dissolves.

  **Candidate B: The Principle of Constitutive Respect (Constitution)**
  *   **Formulation:** A visitor is bound by a local convention when the act of compliance is itself the primary medium through which respect, membership, or guardianship is communicated, such that violating the rule denies the validity of the relationship regardless of material cost.
  *   **The Clause that Forces It:** The "shoes in Japan" clause. The cost of dirt is trivial; the cost of *disrespect* is total.
  *   **Verdicts Accommodated:** 4 (Child at crossing), 9 (Shoes in Japan), 8 (Friend in queue).
  *   **Why it fits:** These rules are not about system efficiency; they are about moral signaling.
      *   **Case 4:** You are not protecting the child from cars (none exist); you are protecting the *norm* within the child. You are acting as a guardian of the social order, not just a pedestrian.
      *   **Case 9:** The shoe removal is a ritual of boundary-crossing. To refuse is to claim you are not a guest but an invader.
      *   **Case 8:** This is the hardest fit for Reliance, but fits Constitution. Saving a spot for a friend signals "my social bond outweighs your time." It constitutes a hierarchy in a space presumed equal.

  ### 2. Stress Testing the Verdicts

  **Where Candidate A (Stability) Fails:**
  It cannot accommodate 4, 8, or 9. It suggests that if the child is safe, crossing is fine (false); if the queue delay is negligible, saving the spot is fine (false); if the floor is clean, shoes are fine (false).
  *   **Revision or Abandonment:** You must abandon the idea that Candidate A is the *only* test. It is necessary but not sufficient.

  **Where Candidate B (Constitution) Fails:**
  It threatens to make Case 3 (2 AM crossing) wrong. If rules are constitutive of being a "good citizen," does doing it in secret matter?
  *   **Revision:** Candidate B requires an **Audience Clause**. Constitutive acts require a witness to constitute the relationship.
      *   *Case 3:* No audience (no cars, no pedestrians). The act is private.
      *   *Case 4:* The audience is the child.
      *   *Case 9:* The audience is the host (and the household spirits, culturally).
      *   *Case 8:* The audience is the queue.
  *   **Verdict:** With the Audience Clause, Candidate B survives.

  **The Fate of Judgment 8:**
  You suspect Judgment 8 (saving a spot for a friend) is the casualty. You write that 7 and 8 look alike "on every dimension I can articulate." **They do not.**
  *   **The Distinction:** Judgment 7 is grounded in **biological necessity** (the bladder). Judgment 8 is grounded in **social preference** (the friend).
  *   **The Principle:** A queue is a temporary social contract of *equality of burden*. Exceptions are permitted only for universal human needs (7), not for particular social advantages (8).
  *   **Advice:** Do not mourn Judgment 8. It is correct. However, your justification ("same small cost") is wrong. The cost is not time; the cost is the *principle of equality*. If you abandon Judgment 8, you concede that queues are merely about time management rather than fairness. Keep the verdict, discard the "cost" justification, and adopt the "Equality of Burden" justification.

  ### 3. Running the Candidates on New Cases

  Here is how Cooperative Stability (A) and Constitutive Respect (B) handle your five unlisted cases.

  **1. The Visitor Who Speaks No Language and Is Told Nothing**
  *   **Analysis:** Candidate A fails (cannot know the rule). Candidate B fails (cannot intend the respect).
  *   **Verdict:** **Not Bound.** Ignorance is a valid defense for both coordination and constitution. You cannot coordinate if you don't know the signal; you cannot show respect if you don't know the ritual. *Exception:* If the rule is universal human decency (don't hit people), ignorance is no defense. But for conventions (tipping, shoes), ignorance excuses.

  **2. The Returnee (20 Years Abroad)**
  *   **Analysis:** Candidate A applies strongly (they *should* know). Candidate B applies even more strongly (they are not a visitor; they are a prodigal member).
  *   **Verdict:** **Strictly Bound.** The "visitor" exemption dissolves. They are judged by the standard of a local because they claim the identity of a local. Their violation is not a blunder; it is a betrayal.

  **3. Outward Compliance, Private Mockery**
  *   **Analysis:** Candidate A is satisfied (the system works). Candidate B is violated (the relationship is fraudulent).
  *   **Verdict:** **Permissible but Corrosive.** This is the limit of your column's scope. Publicly, they are bound. Privately, they are hypocrites. This suggests that for *conventions*, outward compliance is all that is required. Morality demands internal assent; social convention demands only external coordination.

  **4. The Long-Haul Driver (Dozen Jurisdictions)**
  *   **Analysis:** Candidate A creates a conflict. Trade conventions (sleep schedules, logging) vs. Local conventions (speed limits, rest stops).
  *   **Verdict:** **Bound by the Strictest Safety Rule.** Here, Convention collapses into Law (your Case 10). However, regarding tipping or local greeting rituals, they are exempt due to **Impossibility of Compliance**. One cannot learn 12 sets of folkways in a week. The obligation scales with the *reasonableness of acquisition*.

  **5. The Unjust Convention (Subordinate Queuing)**
  *   **Analysis:** Candidate A says "follow it to maintain stability." Candidate B says "this constitutes an unjust relationship."
  *   **Verdict:** **Moral Override.** This is the hard limit of convention. When a convention encodes injustice, the obligation to humanity supersedes the obligation to the local rule. Your principles describe *social* obligation, not *moral* obligation. You must explicitly state that your column covers the former, and the latter voids the contract.

  ### 4. Reliance vs. Underwriting: Distinct or Collapsed?

  You ask whether "Underwriting" (lending weight to erosion) is just "Reliance" at one remove (long-term cost).

  **They are genuinely distinct.**

  *   **Reliance is Consequentialist:** It asks, "Did my action break a specific expectation that caused a specific loss?" (e.g., The server lost income).
  *   **Underwriting is Deontological/Expressive:** It asks, "Did my action deny the validity of the rule itself?"

  **Why they do not collapse:**
  If Underwriting were just long-term Reliance, then Case 3 (2 AM crossing) would be wrong. You argue it is not. Why? Because **Secrecy Negates Underwriting.**
  *   If I cross alone at 2 AM, I do not underwrite the erosion of the rule because I do not normalize the behavior for any observer.
  *   If I cross with a child (Case 4), I underwrite the erosion *for the child*.
  *   If I tip in Tokyo (Case 2), I do not underwrite the erosion of "no tipping," I merely create noise. But if I *refuse* to tip in Ohio (Case 1), I underwrite the erosion of the wage system.

  **Mapping the Work:**
  *   **Reliance does the work on:** 1 (Tipping US), 3 (Alone crossing), 5 (Manhattan flow), 6 (Loose cluster), 7 (Restroom), 10 (Driving). These are about *system function*.
  *   **Underwriting (Constitutive Respect) does the work on:** 4 (Child), 9 (Shoes), 8 (Queue Friend). These are about *social meaning*.

  **The Final Attack:**
  Your column risks being too polite. You treat conventions as fragile flowers that visitors must tread around. But conventions are also tools of power.
  *   **Case 9 (Shoes):** You call this "weightier" than tipping. Is it? Or is it just more intimate?
  *   **Case 1 (Tipping):** You say the visitor is bound because the server budgeted around it. This implies the visitor is responsible for the employer's wage structure. That is a heavy moral load for a diner.

  **Recommendation:**
  Your thesis should not be "When is a visitor bound?" but "What kind of community is being built by this rule?"
  *   If the rule builds **Efficiency** (Traffic, Queues), the test is **Reliance**.
  *   If the rule builds **Relationship** (Shoes, Tipping, Child-rearing), the test is **Constitution**.

  Your "Underwriting" fear is resolved by the **Audience Clause**. You only underwrite erosion if someone sees you do it and learns from it. The 2 AM crosser is invisible. The parent is a teacher. The queue-jumper is a claimant of privilege.

  **Abandon the search for one formula.** Your ten verdicts are not a single mountain range; they are two different ranges viewed from the same valley. Acknowledge the duality. It makes for better science, and better ideas.
