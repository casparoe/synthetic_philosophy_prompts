answer: |-
  The move from Herbert Simon's descriptive bounded rationality to a normative theory of satisficing is one of the most seductive slides in decision theory. The argument runs smoothly: agents lack the information, time, and processing power to maximize; therefore, they satisfice; therefore, satisficing is rational. But there is a gap between the second and third steps. The fact that we *cannot* maximize does not immediately entail that we *ought not* to maximize when we can, nor that maximizing is not the standard against which rationality is measured. To test this, we must switch off the search costs that motivate Simon's descriptive account. If normative satisficing is distinct from maximizing-under-costs, it must survive in a world where the better option is free.

  Consider the ER doctor. She has settled on a treatment protocol that clears the aspiration level: the patient will live, recover well, and suffer minimal pain. It is "good enough." Then, at literally zero cost in time, effort, or risk, she learns that a different protocol sitting right there would leave the patient modestly better off—less pain, faster recovery. The search is over; the comparison is made. If she sticks with the "good enough" option, is she rational?

  The maximizing line says no. If option B is known to be better than option A, and the cost of choosing B is identical to A, choosing A is a failure of agency. On this view, the aspiration level does no normative work of its own; it is merely a stopping rule for search. Once search costs are removed, the stopping rule dissolves, and the agent is required to secure the best available outcome. To do otherwise is to leave value on the table without justification.

  The satisficer must defend the rationality of sticking with the good-enough option. To do this, they cannot rely on search costs, since we have stipulated them away. Instead, they must argue that the aspiration level is fixed by something other than a comparison of options on the table. Perhaps it is fixed by the doctor's role, her standing commitments, or the appropriate allocation of her attention. The argument is that the doctor's job is to save lives and restore health, not to optimize biological parameters indefinitely. Once the threshold of "restored health" is met, further optimization falls outside the scope of the relevant normative demand. Stopping isn't a failure of optimization; it is a success of role-fulfillment. The rational agent ignores marginal gains that lie beyond the scope of their committed projects.

  This defense, however, collapses under scrutiny. Why is the role defined to stop at "good enough"? Almost invariably, the answer points back to costs. Roles are structured to be satisficing because human agents cannot maximize everything simultaneously. We define the doctor's role as "provide adequate care" rather than "provide optimal care" because optimizing every parameter for every patient would consume the resources needed to treat the next patient. The aspiration level is a proxy for a broader maximization problem involving the allocation of scarce cognitive and temporal resources across a lifetime of decisions.

  In the zero-cost ER scenario, this justification evaporates. If switching protocols costs no time, requires no extra attention, and risks nothing, then choosing the better option does not infringe on the doctor's other commitments. It does not drain the attention budget. If the satisficer insists the doctor should still stick to the "good enough" option, they are fetishizing the rule rather than the reason for the rule. They are treating the aspiration level as a intrinsic normative boundary rather than a heuristic for managing scarcity. If the role truly matters, it matters because it serves the patient's welfare. If the patient's welfare is increased at zero cost to the role, the role demands the better option.

  This leads to the collapse worry: normative satisficing turns out to be maximizing once you price in the agent's own time and attention. The satisficer claims there is a distinct normative principle at work—that one *ought* to stop at "good enough." But when we ask why, the answer is always that going further is too costly in some broader sense. If we make the costs zero, the obligation to stop disappears. Therefore, satisficing is not a rival normative theory to maximizing; it is a computational heuristic for achieving maximization under constraints. There is no remainder. There is no distinct "normative satisficing" that commands you to leave value on the table when picking it up is free.

  Does the verdict change for epistemic satisficing? Here, the agent stops gathering evidence once their belief crosses a threshold (e.g., "beyond reasonable doubt") rather than continuing until certainty is maximized. The same collapse occurs. If I can acquire more evidence for free—say, a lab result is already done and sitting on the desk—ignoring it because my belief is already "good enough" is epistemically irresponsible. We accept epistemic satisficing thresholds in law and science only because evidence gathering is costly. If the cost is zero, the rational agent updates on all available evidence. To do otherwise is to prioritize the comfort of closure over the accuracy of belief, which is not a distinct norm of rationality but a failure of epistemic duty.

  The Simon slide from "can't" to "needn't" is invalid. Bounded rationality explains why we satisfice descriptively, but it does not justify satisficing normatively. When the bounds are lifted, the norm reverts to maximizing.

  **Verdict:** There is no real normative satisficing distinct from maximizing-under-costs. Satisficing is rational only insofar as it serves maximizing goals under constraints; when constraints are removed, sticking to "good enough" is irrational.
