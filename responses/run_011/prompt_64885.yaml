          *   *Verdict:* **Wrong/Confused.** This is a critical error. Searle distinguishes between *simulation* and *duplication*. Simulating rain doesn't make things wet. Simulating neurons (computationally) does not produce consciousness for Searle. He requires the *actual biological causal powers*, not a computational simulation of them. If the simulation is non-biological, he rejects it. If it's a biological duplicate, it's not a simulation, it's a brain. The text says "simulation... would have the causal powers." Searle says simulations *lack* the causal powers.
