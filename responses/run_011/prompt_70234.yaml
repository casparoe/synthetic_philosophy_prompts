answer: |-
  Your argument's load-bearing joint is the equivalence claim in your second and third premises: that engineered architectural biases functionally substitute for evolved ones in the learnability argument. Everything else is scaffolding. The historical exegesis of the poverty of the stimulus is decorative; if you spend too long defending what Chomsky meant in 1970, you will lose the room. The methodological conclusion is the payoff, but it rests entirely on whether the audience accepts that analysing a transformer's attention heads is relevant to the nativism debate. The philosopher will attack the content of your redefinition; the machine-learning researchers will attack the equivalence of engineered and evolved priors; the psycholinguists will attack your dismissal of input statistics. Prepare to defend the functional equivalence of biases, not the history.

  ***

  ### Q&A PREPARATION SHEET

  **Opening Concession (Deliver in first 5 minutes)**
  You must explicitly concede that engineered priors are not evidence for *evolved* priors. State clearly: "I am not arguing that because transformers have inductive biases, humans must have innate ones. I am arguing that the *logical form* of the learnability argument remains valid even when the prior is artificial." If you do not make this distinction early, the machine-learning researchers will spend their questions accusing you of biological category errors, and you will look like you are conflating silicon with flesh.

  ***

  **Objection 1: The Triviality Charge**
  *Likely Objector:* The Philosopher of Science
  *Idiom:* "Conceptual content," "stipulative definition," "vacuous."
  *The Question:* "You have redefined 'nativism' to mean 'any system with a non-random prior.' But if a tabula rasa is impossible in principle, then nativism becomes trivially true of any learner. Have you not simply drained the term of its empirical content to win a verbal victory?"
  *Your Reply:* "I am not claiming nativism is true of any learner, but of any learner that succeeds with limited data. The empirical content lies not in the label, but in identifying *which* priors are necessary. Previously, we guessed those priors were linguistic universals. Now, we can measure them as architectural constraints. The shift is from asserting the existence of a prior to specifying its structure. That is empirical progress, not verbal stipulation."
  *Soft Spot:* You are walking a tightrope between triviality and specificity. If your architectural priors are too generic, the philosopher is right.
  *Strategy:* **Do not bite the bullet.** Insist on the specificity of the bias.

  **Objection 2: The Origin Objection**
  *Likely Objector:* Senior Machine-Learning Researcher
  *Idiom:* "Inductive bias," "optimisation landscape," "engineered vs. evolved."
  *The Question:* "You say these models are nativist in the relevant sense. But their bias comes from human engineers selecting architectures, not from biological evolution. Doesn't this distinction destroy the analogy? You're comparing a designed tool to a biological organ."
  *Your Reply:* "The origin of the bias is different, but its logical role in the learning problem is identical. Both cases involve a restriction on hypothesis space that permits generalisation from sparse data. Whether that restriction comes from evolution or engineering tells us about the history, but not about the learnability mathematics. I am isolating the learnability argument from the evolutionary claim."
  *Soft Spot:* This is the weakest link in your analogy. The audience knows engineered bias is intentional; evolved bias is selected.
  *Strategy:* **Bite the bullet.** Accept the origin difference but insist on the functional equivalence.

  **Objection 3: The Data-Efficiency Challenge**
  *Likely Objector:* Synthetic Language Learning Lab Lead
  *Idiom:* "Sample efficiency," "generalisation gap," "controlled comparison."
  *The Question:* "You propose analysing architectures to find biases. But the proper test of inductive bias is sample efficiency: how little data does the learner need? Why should we look at the blueprint rather than the learning curve?"
  *Your Reply:* "Because learning curves conflate data efficiency with capacity. A model might learn quickly simply because it is larger, not because it has the right bias. By ablating architectural components—removing positional encoding, for instance—we can isolate which structural generalisations are hard-coded versus learned. That gives us a mechanistic explanation that a learning curve alone cannot provide."
  *Soft Spot:* You risk sounding like you are dismissing behavioural data entirely.
  *Strategy:* Argue for complementarity, but prioritise mechanism.

  **Objection 4: The Input Richness Counter**
  *Likely Objector:* Usage-Based Psycholinguist
  *Idiom:* "Child-directed speech," "statistical structure," "ecological validity."
  *The Question:* "You dismiss the poverty of the stimulus as a rhetorical detour. But recent analyses show the statistical structure in input to children is far richer than you concede. Are you not refighting a dead debate by assuming the input is sparse when it is actually highly structured?"
  *Your Reply:* "Even if the input is richer than previously thought, it remains underdetermined without a prior to select among hypotheses. My point is not that the data is empty, but that data alone cannot select the correct grammar. Whether the prior is triggered by rich input or sparse input, the necessity of the prior remains. The debate should be about the prior's structure, not the data's volume."
  *Soft Spot:* You may appear to be ignoring decades of corpus linguistics.
  *Strategy:* Acknowledge the richness but maintain the underdetermination point.

  **Objection 5: The Scaling Rebuttal**
  *Likely Objector:* Machine-Learning Researcher (Scaling Specialist)
  *Idiom:* "Scaling laws," "compute-bound," "emergent abilities."
  *The Question:* "We know that with enough data and compute, architectural biases matter less. Models learn structure even with minimal inductive bias if scaled sufficiently. Doesn't this suggest the bias isn't doing the work you claim?"
  *Your Reply:* "Scaling reduces the need for specific biases, but it does not eliminate the need for *some* bias. Furthermore, current models are not scaled to infinity; they operate in a regime where architecture dictates sample efficiency. My claim is about the regime we actually operate in, not the theoretical limit of infinite data."
  *Soft Spot:* If scaling laws show bias becomes negligible, your core premise weakens.
  *Strategy:* **Bite the bullet.** Admit scaling reduces bias reliance but insist we are not at that limit.

  **Objection 6: The Underdetermination Worry**
  *Likely Objector:* The Philosopher of Science
  *Idiom:* "Inference to the best explanation," "empirical equivalence," "underdetermination."
  *The Question:* "How do you distinguish between a structural generalisation caused by an architectural bias and one that emerges from statistical regularities in the training data? Both produce the same behaviour."
  *Your Reply:* "Through ablation studies. If you remove the architectural component and the generalisation disappears despite identical training data, the bias was causal. If the generalisation persists, it was statistical. This is precisely why I advocate for architectural analysis over behavioural observation alone."
  *Soft Spot:* Ablation studies are messy; components are often entangled.
  *Strategy:* Focus on the methodological principle, not the perfection of current experiments.

  **Objection 7: The Developmental Plausibility Attack**
  *Likely Objector:* Usage-Based Psycholinguist
  *Idiom:* "Developmental trajectory," "incremental learning," "cognitive architecture."
  *The Question:* "Neural language models learn in batches over static corpora. Children learn incrementally in a social context. How can you claim these models inform us about human learning when the process is so dissimilar?"
  *Your Reply:* "I am not claiming the process is similar, but that the logical problem is the same. Both face the problem of mapping limited experience to structured competence. The model is a existence proof that certain priors allow this mapping. It is a tool for testing learnability, not a simulation of development."
  *Soft Spot:* This invites the "it's just a metaphor" criticism.
  *Strategy:* Keep the distinction between *process* and *logic* sharp.

  **Objection 8: The Tokeniser Leakage**
  *Likely Objector:* Machine-Learning Researcher
  *Idiom:* "Tokenisation scheme," "pre-processing," "smuggling."
  *The Question:* "You claim the model learns structure. But isn't much of the linguistic structure already embedded in the tokenisation scheme? Aren't you just saying that if you feed linguistics in, you get linguistics out?"
  *Your Reply:* "Tokenisation is part of the inductive bias, yes. But attention mechanisms and positional encodings operate over those tokens to create dependencies. The question is whether the architecture supports structure-dependence beyond what the tokens encode. Ablation shows that without attention, the token sequence alone does not yield the generalisation."
  *Soft Spot:* This is technically true for some models; you must be careful not to overclaim.
  *Strategy:* Acknowledge tokenisation contributes but insist on the role of attention.

  ***

  **The Question You Hope Nobody Asks**
  *The Question:* "If your version of nativism tells us nothing about the human brain, and only about engineered systems, what is the empirical cash value for linguistics or psychology? Why should we care?"
  *Why It Is Damaging:* It exposes the risk that your talk is a purely conceptual exercise with no payoff for the actual science of language origins. It suggests you have solved a philosophical problem by changing the subject, leaving the biological question untouched.
  *The Least Disastrous Answer:* "The cash value is methodological. It stops us from looking for linguistic universals in the brain and starts us looking for computational constraints in the learning system. It shifts the search space from 'what rules are innate' to 'what architectural biases enable learning'. That changes where we look for evidence, even if it doesn't confirm the presence of a Universal Grammar."
  *Note:* This is a defensive pivot. It admits you aren't solving the biological problem but claims you are improving the search for the solution.
