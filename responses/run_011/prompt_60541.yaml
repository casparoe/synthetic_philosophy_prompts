answer: |-
  ### Portability Assessments

  **1. The Treaty-Notice Reply**
  *   **Portability Score:** 1
  *   **Justification:** This reply collapses because the hypothetical charge (siege starvation) lacks the specific multilateral renunciation that aggressive war had under the Kellogg-Briand Pact. Without a treaty explicitly condemning the specific conduct *ex ante*, the claim of "notice" is legally fictitious in this scenario.
  *   **Verdict:** Absorbs (argues the defendants were on notice of illegality).

  **2. The General-Principles Reply**
  *   **Portability Score:** 3
  *   **Justification:** While mass murder is universally criminalized, siege starvation is historically treated as a legitimate instrument of war in many domestic military codes, including those of the prosecuting coalition. The reply breaks because the "principles of civilized states" do not converge on this specific act as criminal in the way they do for shooting prisoners.
  *   **Verdict:** Absorbs (argues the conduct was already criminal under domestic analogues).

  **3. The Structural Reply**
  *   **Portability Score:** 8
  *   **Justification:** This reply survives best because the hypothetical tribunal remains an international body without a global sovereign legislature, regardless of the advance charter. The core argument—that *nullum crimen* is a domestic rule of law inapplicable to a horizontal legal order—holds even when the moral consensus and victor status are removed.
  *   **Verdict:** Absorbs (argues the objection commits a category error regarding the nature of international law).

  **4. The Threshold Reply (Radbruch)**
  *   **Portability Score:** 2
  *   **Justification:** The Radbruch formula relies on a consensus that the conduct is "unbearably unjust," but the hypothetical stipulates that prosecuting states engaged in analogous practices within living memory. Without the settled moral monstrosity of the Holocaust to anchor the "gross injustice" claim, the threshold becomes contested political opinion rather than objective legal principle.
  *   **Verdict:** Absorbs (argues the domestic law was void *ab initio* due to injustice).

  **5. The Pre-existing-Obligation Reply**
  *   **Portability Score:** 6
  *   **Justification:** The principle that individuals bear direct duties under international law (like piracy) is structurally portable, but the content of that duty is weak here since the conduct was never previously adjudicated. It survives better than the treaty reply because it relies on the *status* of the actor rather than the *specificity* of the prohibition.
  *   **Verdict:** Absorbs (argues the obligation existed independently of the tribunal's charter).

  **6. The Lesser-Evil Reply**
  *   **Portability Score:** 1
  *   **Justification:** This reply depends on the absence of functioning domestic alternatives, but the hypothetical specifies the defendant state is intact with functioning courts. The "lesser evil" comparison fails because the realistic alternative is not summary execution but domestic prosecution or immunity, neither of which necessitates a retroactive international tribunal.
  *   **Verdict:** Relocates (concedes legal defect but argues procedural benefits justify it).

  **7. The Forum-and-Personnel Reply**
  *   **Portability Score:** 0
  *   **Justification:** This reply is rendered moot because the hypothetical explicitly removes the victor bias and personnel conflicts this argument was designed to excuse. Since the judges are neutral and the coalition is broad, there is no administrative defect to distinguish from the substantive legal objection.
  *   **Verdict:** Relocates (concedes administrative flaws but argues they do not invalidate the verdict).

  ***

  ### Synthesis and Ranking

  **Collapses and Parasitic Relationships**
  The list of seven is shorter in practice than in theory. Replies 1 (Treaty) and 5 (Pre-existing Obligation) are parasitic on one another; both attempt to prove the law existed *ex ante*, differing only on whether the source is a treaty or customary status. Similarly, Replies 2 (General Principles) and 4 (Radbruch) collapse into a single substantive claim: that the moral wrongness of the act supplied the legal prohibition. Reply 7 (Forum) is entirely dependent on the factual premises of 1945 (victor's justice) that the hypothetical removes, making it a subset of the political context rather than a standalone legal argument.

  **Ordered Ranking (Most to Least Portable)**
  1.  **Reply 3 (Structural):** Highest score because it addresses the ontology of international law, which remains unchanged in the hypothetical.
  2.  **Reply 5 (Pre-existing Obligation):** High score on the principle of individual liability, though weakened by the lack of specific customary prohibition.
  3.  **Reply 2 (General Principles):** Moderate score; plausible for murder, but strained for starvation policies.
  4.  **Reply 4 (Radbruch):** Low score; lacks the moral consensus required to trigger the "gross injustice" exception.
  5.  **Reply 1 (Treaty-Notice):** Very low score; no applicable treaty covers the hypothetical charge.
  6.  **Reply 6 (Lesser-Evil):** Very low score; the existence of domestic courts removes the necessity argument.
  7.  **Reply 7 (Forum-and-Personnel):** Zero score; the hypothetical eliminates the bias this reply excuses.

  *Tie-Breaking Reason:* Reply 3 ranks above Reply 5 because Reply 5 still requires proving the *content* of the obligation existed (which the hypothetical denies), whereas Reply 3 argues the *standard of proof* (strict *nullum crimen*) is inapplicable regardless of content.

  **Thesis Recommendation**
  If I had to stake the thesis of the talk on one reply, I would choose **Reply 3 (The Structural Reply)**. It offers the most honest defense of survivability by conceding that international law operates differently from domestic law, rather than pretending the crime existed when it did not. It shifts the debate from "Was this law?" to "What kind of system is international law?" which is the durable legal question.

  *Strongest Counterargument:* A critic in the convenor's position would argue that if international law claims the authority to punish individuals with liberty and life, it must accept the constraints of a legal order, including *nullum crimen*; to deny this is to admit the tribunal is an act of power politics masquerading as law, which undermines the very rule-of-law values the tribunal claims to uphold.

  **Assessment of the Tokyo Dissent**
  The dissenting opinion at Tokyo (principally Justice Pal) **gains force** in the hypothetical, but only on its legal core. Pal's dissent mixed the retroactivity objection with a critique of victor's justice. By removing the victor's justice element (neutral judges, broad coalition), the hypothetical isolates the retroactivity claim. This strips Pal's argument of its political contingency, leaving a purer legal critique: that without prior positive law, there can be no crime. Consequently, his legal reasoning becomes harder to dismiss as mere sour grapes, even if his political diagnosis of bias is no longer applicable.
