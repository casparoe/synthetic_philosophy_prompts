answer: |-
  (a)
  Jan van Oostveldt's *The Mourning of Magdalene* (c. 1475) survives with its lower quadrant lost. Two restorers, Elara Voss and Thomas Krell, independently complete the missing section on period panels. Both versions pass every conservation examination: dendrochronology confirms Baltic oak felled within the master's lifetime; cross-sections reveal identical ground layers of chalk and glue; infrared reflectography shows underdrawing consistent with Oostveldt's hatching; pigment analysis identifies lead-tin yellow and azurite bound in aged linseed oil. No anachronisms exist. Voss reconstructed the iconography from fragmentary guild records and reverse-engineered the master's brushwork through technical analysis, then signed and dated the panel 1475 to pass it off. Krell subsequently acquired Voss's research archive. He possessed equal manual skill but faced no interpretive problems, merely transcribing Voss's solutions onto his panel. He also signed and dated it 1475. Both intended deception; both succeeded physically. The objects are materially indiscernible from the original's lost portion and from each other.

  (b)
  **Achievement Account:**
  1.  *Premise:* Artistic value is partly constituted by the cognitive and technical problems solved during production (performance). [Flag: Your summary reduces Dutton's cluster account to a single essential condition; I retain only the performance criterion relevant to this case.]
  2.  *Premise:* Voss solved iconographic and material problems; Krell transcribed existing solutions.
  3.  *Observation:* Voss's labor involves innovation; Krell's involves replication.
  4.  *Verdict:* Voss's version embodies a superior artistic achievement than Krell's, despite both being forgeries.

  **Goodman Account:**
  1.  *Premise:* In autographic arts, aesthetic identity depends on the history of production (authenticity). [Flag: Your summary suggests the difference relies on potential detectability; Goodman argues the history itself constitutes the difference, while detectability warrants our epistemic caution.]
  2.  *Premise:* Both versions share the same false history of production (neither is by Oostveldt).
  3.  *Observation:* Both are physically indistinguishable from the original and each other.
  4.  *Verdict:* Both are aesthetically equivalent fakes; the internal difficulty of the forgery is irrelevant to the work's status as an authentic instance of Oostveldt.

  (c)
  The single feature is Krell's access to Voss's archive. If removed, Krell must reconstruct the solution independently. The Achievement Account then sees two equal achievements, erasing the distinction between the versions. Goodman's Account remains unchanged: both are still fakes lacking the correct history of production. Goodman's argument does not gain grip because his distinction is binary (Authentic vs. Inauthentic); the difficulty of the inauthentic production does not restore authenticity or alter the aesthetic status relative to the original.

  (d)
  A Goodman defender would attack by arguing that knowing the distinct histories of *making* (creative reconstruction vs. transcription) alters our perception of the objects, thereby creating an aesthetic difference even between two fakes. If knowing Voss solved problems changes how we look compared to knowing Krell copied, then Goodman's principle (looking is learning) forces a distinction. This attack succeeds if one accepts that any historical knowledge modifies perception. It fails only if Goodman's theory is rigidly restricted to the Original/Fake binary, ignoring nuances within forgery.

  (e)
  The specification risks self-undermining. If the work *is* the performance (as the Achievement Account holds), then Voss's completion and Krell's completion are ontologically different works, not "two versions of the same work." Treating them as versions of a single object presupposes an object-based ontology that the performance theory rejects. This objection is not fatal but reveals the experiment's true function: it forces a category clash to isolate whether we value the physical object or the generative act. The tension is not a flaw but the precise point of friction you intend to isolate.
