  A theologian dies and finds himself in a debriefing session with God, immediately asking why divine providence didn't intervene to stop him from making a specific terrible choice back on Earth. God explains that He certainly knew the theologian would make that choice in those exact circumstances, not because He determined it, but because He possessed middle knowledge of all counterfactuals of creaturely freedom. The theologian presses, asking why God didn't just arrange different circumstances where he would have freely chosen better. God replies that He did look at every possible set of circumstances, but the truth about what the theologian would freely do in each of them was already settled before God decided which world to actualize. The theologian realizes this means there are truths about his behavior that not even God can change, only select among. God nods and says, "Exactly, I have natural knowledge of what is possible, and free knowledge of what I decided to make actual, but that middle layer is just you being you in hypothetical scenarios I haven't even created yet, which is why it's called middle knowledge." The theologian frowns and says, "So you're saying you're omnipotent, but you can't edit my hypothetical personality?" God smiles and says, "I can't edit it, I can only shop for a world where it works, and frankly, the selection was slim." The theologian thinks for a moment and then asks the follow-up that ruins the mood, pointing out that if he didn't exist yet in those scenarios and God didn't decree them, there is nothing to ground the truth of those counterfactuals. God suddenly becomes very interested in a cloud formation and suggests they discuss the beatific vision instead, because some mysteries are better left ungrounded.

  I am fairly confident that this captures the structural mechanics of Molinism, specifically the distinction between natural, middle, and free knowledge and the prevolitional status of counterfactuals. The point I am least sure about is whether Molina himself would agree that God is strictly unable to edit the counterfactuals in the way the joke implies, since some scholars argue the dependency is logical rather than temporal and might allow for a more nuanced view of divine power over the truth values themselves.
