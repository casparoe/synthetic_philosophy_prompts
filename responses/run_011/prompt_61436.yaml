answer: |-
  Reading Tolstoy's theoretical excursuses in *War and Peace* through the lens of analytic causation reveals a fundamental friction between his metaphysical fatalism and the logical structure of causal contribution. Tolstoy's central complaint against universal historians is that they arbitrarily select "great men" as causes while ignoring the infinite chain of conditions that actually produce events. In analytic terms, Tolstoy is rejecting the legitimacy of **causal selection**. He observes that any historical event is the product of a vast, overdetermined network of conditions. Because he cannot identify a single necessary condition (a "but-for" cause) amidst this web, he concludes that individual will is causally inert.

  This inference, however, is precisely where the INUS (Insufficient but Non-redundant part of an Unnecessary but Sufficient condition) framework blocks Tolstoy's move to fatalism. Under Mackie's analysis, Napoleon's order at Borodino need not be necessary for the battle to occur to count as a cause; it need only be a non-redundant part of a sufficient complex. Tolstoy conflates **causal contribution** with **causal necessity**. He assumes that because the order was not sufficient on its own (due to the chaos of execution) and perhaps not strictly necessary (due to the momentum of the masses), it was therefore nothing. The INUS framework allows us to say the order was a cause even in a world of massive overdetermination, provided it played a specific role in the actual causal complex that unfolded. Tolstoy's skepticism arises because he demands a total explanation (the "integral") but evaluates individual agency by the standards of a singular, deterministic law. When the singular law fails to manifest cleanly, he denies the agency rather than adjusting the model of causation.

  Regarding his positive proposal—the calculus of history—the question is whether this entails skepticism about agency or a shift in explanatory level. Tolstoy's metaphor of the infinitesimal suggests the latter: he is arguing for a change in the **unit of analysis**, not necessarily the elimination of the actor. He posits that the "laws" of history only become visible when we integrate the homogeneous elements of individual human motion. This anticipates a move from agent-based explanation to systems-based explanation. However, Tolstoy often slides from this methodological claim into an ontological one: that because the aggregate law determines the outcome, the individual components (persons) lack freedom. Analytic philosophy would separate these: one can accept that macro-historical regularities emerge from micro-actions (explanatory level) without denying that the micro-actions are genuine causal interventions (agency). Tolstoy's conflation here stems from his inability to reconcile the freedom of the infinitesimal with the necessity of the integral.

  This theoretical rigidity is sharply undermined by Tolstoy's own narrative practice. The excursuses preach that command is illusory and will is bound by necessity. Yet, the narrative depiction of Kutuzov at Borodino contradicts this. Kutuzov's "studied inactivity"—his refusal to commit reserves—is framed not as an inevitable physical motion, but as a moral and strategic choice that preserves the army. The novel treats this restraint as causally efficacious; the outcome (the survival of the Russian force) counterfactually depends on his specific refusal to act. If Tolstoy's theory were true, Kutuzov's restraint would be merely another determined vector in the mass movement. Instead, the narrative grants it explanatory privilege, effectively performing the causal selection the theory forbids. The novel demonstrates that while conditions constrain agency, they do not dissolve it; the excursuses insist they do.

  Where *War and Peace* contributes to the literature on overdetermination beyond causal modeling is in its treatment of the **epistemic gap** between the agent and the outcome. Causal-modeling literature typically assumes an omniscient observer constructing the graph. Tolstoy forces us to confront the phenomenology of the node within the graph. Napoleon believes he is a sufficient cause; the reader sees he is merely an INUS condition obscured by noise. Tolstoy highlights that historical overdetermination is not just a logical problem of multiple sufficient sets, but a practical problem of ignorance. Agents cannot know which of their actions are redundant and which are non-redundant until after the integration is complete. This adds a dimension of **temporal uncertainty** to overdetermination that static causal models often miss: the "cause" is only identifiable retrospectively, rendering the agent's intention causally opaque at the moment of decision.

  **Confidence and Verification**

  I am moderately confident (approximately 75%) that I am reporting Tolstoy's argument rather than merely reconstructing the sketch you provided. While your prompt supplied the analytic framework (Mackie, INUS, overdetermination), the specific tension identified between Kutuzov's narrative agency and the theoretical fatalism, as well as the distinction between Tolstoy's ontological and methodological claims regarding the "infinitesimals," draws on the broader textual evidence of *War and Peace* beyond the excursuses alone. However, because applying mid-20th-century analytic categories to 19th-century literary philosophy is inherently reconstructive, there is a risk of anachronism.

  The single claim I would most want independently checked is the assertion that **Tolstoy's "infinitesimal" proposal is primarily a claim about explanatory granularity rather than ontological determinism.** Scholars are divided on whether Tolstoy believed individuals *actually* lack freedom or merely that history *cannot capture* that freedom; resolving this determines whether his calculus is a theory of being or a theory of knowledge.
