prompt: |-
  I chair the capacity and consent review panel at a rehabilitation hospital, and we meet Thursday on a case that has split the panel along lines I suspect are theoretical rather than clinical. Please draft the written opinion I will circulate to the members in advance of the meeting.

  The case, as our records stipulate it. The patient is a 43-year-old woman, fourteen months after a severe closed-head injury. Imaging shows a focal lesion centered on the right lateral prefrontal cortex with sparing of posterior and subcortical structures. On a standard four-domain capacity interview — communicating a choice, understanding, appreciation, and reasoning — she performs at or above threshold: she can paraphrase the indication for the proposed procedure in her own words, name its principal risks, compare it against the alternatives, and state a choice that has been stable across four sessions. The choice is refusal of an elective shunt revision. The surgical team's position is that without revision she faces a substantial risk of irreversible decline within six to twelve months.

  What complicates matters is a dissociation our neuropsychologist has documented. First, her verbal reports about her own current perceptual and bodily states arrive after a delay of four to ten seconds, during which she says she is working the answer out. Second, when an examiner's question embeds a false presupposition about the stimulus in front of her, her description conforms to the presupposition; yet under a neutral two-alternative forced choice answered by pointing, she is correct roughly 95 percent of the time. Third, under time pressure or a concurrent task, the forced-choice accuracy falls to chance while her verbal reports remain fluent and confident. Fourth, she reports no change in her experience since the injury, and she does not experience herself as having any of the deficits her family and therapists describe. Her stated reason for refusing the operation is that she feels well and does not believe the symptoms attributed to her are hers.

  The disagreement on the panel runs as follows. One member, our consulting philosopher, argues that this profile is what we should expect if being conscious of a state depends on the patient's having the right sort of awareness of that state — an awareness that is not itself an inference drawn from external cues, including the shape of the examiner's question — and that on this reading her refusal rests on a self-report that carries very little evidential weight. Another member insists this is a misuse of a contested theory of consciousness: experience is a matter of first-order processing, this woman is plainly conscious, and what is impaired is her ability to bring her own states to bear on a judgment, which is a defect of appraisal rather than of sentience. A third worries that both routes arrive at the same place by a dangerous road, namely discounting a disabled patient's own account of her condition on the strength of a philosophical theory the panel is in no position to adjudicate.

  Draft the panel's opinion, roughly 900 to 1,200 words. It should:

  - state a concrete recommendation — proceed under a surrogate's authorization, accept the refusal, defer pending a specified reassessment, or some defined middle course — together with a time frame and what must happen in the interim;
  - explain which of the two theoretical readings, if either, should change what we actually do, and why the choice between them matters for this decision rather than functioning as an interesting aside (if you conclude it does not matter, show that it does not matter, and say what would make it matter);
  - give the panel a decision rule we could apply to a future patient showing a similar dissociation between verbal report and forced-choice performance, stated so that a clinician can use it on a Tuesday afternoon without first settling the philosophy of consciousness;
  - put the third member's objection in its strongest form, and then say plainly whether it defeats the recommendation.

  The document should read as something this panel could act on Thursday, not as a survey of positions.
reasoning: |-
  Here's a thinking process that leads to the suggested draft:

  1.  **Analyze the Request:**
      *   **Role:** Chair of the Capacity and Consent Review Panel at a rehabilitation hospital.
      *   **Task:** Draft a written opinion to circulate to panel members before a Thursday meeting.
      *   **Case:** 43-year-old female, 14 months post-severe closed-head injury (right lateral prefrontal cortex lesion).
      *   **Clinical Picture:** Passes standard 4-domain capacity interview (understanding, appreciation, reasoning, choice). Refuses elective shunt revision (risk of irreversible decline without it).
      *   **Neuropsychological Dissociation:**
          1.  Delayed verbal reports on bodily/perceptual states (4-10 secs).
          2.  Suggestible to false presuppositions in questions, but accurate (95%) in neutral forced-choice pointing.
          3.  Under load/time pressure, forced-choice drops to chance, verbal reports remain fluent/confident.
          4.  Anosognosia-like: Reports no change since injury, denies deficits.
      *   **Panel Disagreement:**
          1.  *Philosopher:* High-order awareness deficit. Self-report lacks evidential weight.
          2.  *Clinician/Theorist:* First-order consciousness intact. Defect is appraisal/judgment, not sentience.
          3.  *Skeptic:* Dangerous to discount disabled patient's account based on contested philosophy.
      *   **Requirements:**
          *   Concrete recommendation (with timeframe/interim steps).
          *   Address the theoretical disagreement (does it change action?).
          *   Provide a practical decision rule for future cases.
          *   Address the third member's objection strongly.
          *   Tone: Actionable, authoritative but collaborative, clinical/legal focus (not just philosophical).
          *   Length: 900 - 1,200 words.

  2.  **Determine the Recommendation:**
      *   The patient refuses life-altering (or function-altering) treatment.
      *   She passes standard capacity tests *verbally*.
      *   However, the neuropsych data suggests her "appreciation" (one of the 4 domains) is compromised by a specific cognitive deficit (confabulation/suggestibility regarding internal states).
      *   If she believes she is well because she cannot accurately access her internal state, her "appreciation" of the *need* for treatment is flawed, even if she understands the *logic*.
      *   *Decision:* Defer pending reassessment. Why? Because overriding refusal is high stakes. But accepting refusal is risky given the dissociation. We need to know if the "appreciation" deficit can be bypassed or if it's fundamental.
      *   *Refinement:* Actually, looking at the risk (irreversible decline), and the specific nature of the deficit (she refuses *because* she feels well, but "feeling well" is the compromised data point), a surrogate decision might be ethically safer *if* we determine she lacks capacity. However, the prompt asks for a decision rule for *future* cases too.
      *   *Best Path:* Recommend finding *temporary* incapacity regarding this specific decision, authorizing the procedure under surrogate consent, *but* with a strict sunset clause and specific testing protocols. Why? Because the risk of decline is high, and the "appreciation" domain is functionally broken even if "understanding" is intact. The "feeling well" justification is directly contradicted by objective data she cannot access.
      *   *Wait, let's look closer at the Skeptic's point.* Discounting a disabled patient's voice is dangerous.
      *   *Revised Decision:* Defer for 14 days. Use that time to attempt a "supported decision-making" protocol. If the dissociation persists under supported conditions, then move to surrogate. This balances the risk of harm with the risk of paternalism.
      *   *Actually, for a Chair's memo to break a deadlock:* A clear recommendation is better. The clinical risk is "irreversible decline." The capacity flaw is specific to the *reason* for refusal (somatic self-awareness). Standard tests failed to catch this.
      *   *Final Decision:* Recommend finding lack of capacity for this specific decision, authorize surrogate, but mandate a second opinion and a specific trial of non-invasive management if possible.
      *   *Wait, simpler:* Recommend *deferring* the decision for 30 days to attempt to remediate the appreciation deficit using the forced-choice method that works (pointing). If she can acknowledge deficits via pointing, does she change her mind? If not, then surrogate.
      *   *Let's go with:* **Defer determination for 21 days.** Initiate a "Supported Appreciation Protocol." If she cannot integrate the objective data into her decision matrix by then, surrogate consent is authorized. This respects the Skeptic while addressing the Clinical risk.

  3.  **Address the Theoretical Disagreement:**
      *   Philosopher (Higher-Order) vs. Clinician (First-Order).
      *   *Key Insight:* It doesn't matter *why* the signal is noisy (consciousness vs. appraisal). What matters is the *reliability of the input* used for the decision.
      *   The decision rests on "I feel well." The data shows "I feel well" is a confabulation under load.
      *   Therefore, the theory is irrelevant to the *outcome*, only to the *explanation*. We treat the reliability of the report, not the metaphysics of the mind.

  4.  **Develop the Decision Rule:**
      *   Needs to be usable on a Tuesday afternoon.
      *   Focus on *Stability of Input* under *Cognitive Load*.
      *   Rule: If verbal report contradicts objective forced-choice performance under load, and the decision relies on the verbal report of internal state, capacity is compromised.

  5.  **Address the Skeptic:**
      *   Strongest form: Epistemic injustice. We are silencing a disabled person because her brain works differently, using a theory we can't prove.
      *   Rebuttal: We are not silencing her; we are questioning the *data source* she is using, just as we would if she were delirious or intoxicated. It's about safety, not ontology.
      *   Does it defeat the recommendation? No, because the recommendation includes a trial of supported decision-making (giving her a chance to use the accurate data).

  6.  **Drafting - Section by Section:**

      *   **Header:** To/From/Date/Re.
      *   **Opening:** Purpose of memo. Summary of case.
      *   **Recommendation:** Defer 21 days. Supported Appreciation Protocol. Surrogate backup.
      *   **Theoretical Dispute:** Acknowledge it. Dismiss its relevance to the *action*. Focus on functional reliability.
      *   **Decision Rule:** The "Load/Stability" test.
      *   **Skeptic's Objection:** Validate the risk of paternalism. Explain safeguards.
      *   **Closing:** Call to action for Thursday.

  7.  **Review and Refine (Word Count and Tone Check):**
      *   *Tone:* Professional, decisive, respectful of the dissent.
      *   *Word Count:* Need to ensure it hits the 900-1200 range. I may need to expand on the rationale for the decision rule and the specific steps of the "Supported Appreciation Protocol."
      *   *Check:* Did I answer the specific prompt requirements?
          *   Concrete recommendation? Yes (Defer 21 days + Protocol).
          *   Explain theoretical reading? Yes (Functional reliability trumps theory).
          *   Decision rule? Yes (Load/Stability).
          *   Skeptic's objection? Yes (Epistemic injustice vs. Safety).
      *   *Self-Correction on Recommendation:* A 21-day deferral on a shunt revision with risk of decline in 6-12 months is clinically safe. It shows due diligence.
      *   *Refining the "Theory" section:* Make sure to explicitly state that *both* theories lead to the same clinical observation: the report is unreliable.
      *   *Refining the "Skeptic" section:* Ensure I don't dismiss them too lightly. The risk of "epistemic injustice" is real. The safeguard is the forced-choice verification.

  8.  **Final Polish:** Check flow and transitions. Ensure the "Tuesday afternoon" rule is distinct and clear. (Proceeding to draft).

  *(Self-Correction during drafting)*: I need to make sure I don't sound like I'm ignoring the philosopher. I need to show why their insight is useful *clinically* without adopting their metaphysics. The philosopher identifies the *mechanism* of the error (lack of higher-order awareness), the clinician identifies the *location* (appraisal). Both agree the *output* is flawed. That's the pivot point.

  *(Word Count Management)*: I will need to be verbose enough in the rationale sections to meet the minimum, but concise enough to stay under the max. I will expand on the "Supported Appreciation Protocol" details to add bulk and clinical utility.

  *(Final check on constraints)*: 900-1200 words.
  Let's estimate:
  Header/Intro: 150 words.
  Recommendation: 250 words.
  Theory: 300 words.
  Decision Rule: 250 words.
  Skeptic: 250 words.
  Total: ~1200. I need to be tight.

