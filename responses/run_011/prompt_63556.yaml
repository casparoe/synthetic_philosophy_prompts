answer: |-
  **TO:** Capacity and Consent Review Panel Members
  **FROM:** Chair, Capacity and Consent Review Panel
  **DATE:** October 23, 2023
  **RE:** Pre-Meeting Opinion: Case #4492 (Shunt Revision Refusal)

  **Purpose**
  This memo circulates in advance of our Thursday convening regarding Patient #4492. Our records indicate a deadlock: the patient meets standard criteria for capacity yet refuses a procedure deemed medically necessary to prevent irreversible decline. The dissent within this panel hinges on competing interpretations of consciousness and appraisal. This document outlines a recommended path forward, addresses the theoretical impasse, and proposes a standardized decision rule for future cases exhibiting similar neuropsychological dissociations.

  **Recommendation**
  I recommend we **defer the capacity determination for twenty-one days** and initiate a **Supported Appreciation Protocol (SAP)**.

  During this interim, the treating team must attempt to bridge the gap between the patient's intact verbal understanding and her compromised somatic self-awareness. Specifically, clinicians should present objective data regarding her deficits (e.g., video feedback, forced-choice pointing tasks regarding bodily state) alongside the surgical options. We must determine if she can integrate accurate external data into her decision matrix when her internal introspective data is bypassed.

  If, after 21 days, she maintains refusal based solely on the assertion that she "feels well"—despite demonstrating accurate recognition of deficits via forced-choice methods—we will deem her lacking capacity for this specific decision. Authorization will then transfer to her healthcare surrogate. This timeline is clinically safe given the six-to-twelve-month window for decline, yet urgent enough to prevent drift.

  **The Theoretical Impasse**
  The disagreement between our consulting philosopher and our clinical lead is substantive but, for the purpose of this determination, functionally equivalent.

  The philosopher argues the patient lacks higher-order awareness; the clinician argues she lacks the ability to apply first-order states to judgment. Both positions agree on the critical empirical fact: **the patient's verbal report regarding her internal state is unreliable under cognitive load.**

  Whether we label this a deficit of *consciousness* or a deficit of *appraisal* does not alter the ethical calculus. Capacity law does not require patients to be metaphysically privileged observers of their own minds; it requires that the information they use to decide be sufficiently reliable to match the risk of the decision. Here, the refusal rests entirely on a premise ("I am symptom-free") that neuropsychological testing proves is false when verification demands exceed her processing latency.

  Therefore, we need not adjudicate the philosophy of consciousness to act. We must only adjudicate the reliability of the evidence the patient is using. If the theory predicted different behavioral outcomes—for example, if one theory suggested she would regain accuracy with time and the other suggested permanent degradation—it would matter. Since both theories predict continued vulnerability to suggestibility and confabulation under load, the choice between them is an explanatory aside, not a decision driver. We act on the instability of the report, not the ontology of the mind.

  **A Clinical Decision Rule**
  To prevent future deadlock, I propose the following rule for cases exhibiting dissociation between verbal report and performance:

  > **The Load-Stability Rule:** When a patient's refusal relies on self-report of internal states (pain, wellness, deficit), and neuropsychological testing demonstrates that such reports diverge from objective forced-choice performance under cognitive load or time pressure, the patient lacks capacity for that specific decision.

  **Application:** A clinician may apply this on a Tuesday afternoon without philosophical training.
  1.  Identify the core premise of the refusal (e.g., "I don't feel sick").
  2.  Test the reliability of that premise using a neutral, low-verbal load method (e.g., pointing, sorting) while introducing a concurrent task (e.g., counting backward).
  3.  If accuracy drops to chance while verbal confidence remains high, the verbal report is treated as confabulation.

  This rule shifts the burden from proving a deficit in "consciousness" to proving a deficit in "data reliability." It protects patients whose verbal fluency masks cognitive fragmentation.

  **The Objection Regarding Epistemic Injustice**
  The third member's objection must be stated plainly: *By privileging forced-choice data over verbal testimony, we risk perpetrating epistemic injustice against a disabled patient. We are discounting her lived experience based on a theoretical model she did not consent to, potentially reinforcing the very paternalism capacity law is designed to prevent.*

  This objection is valid and serves as a necessary check on our power. It does not, however, defeat the recommendation.

  Discounting a patient's account is dangerous, but accepting a demonstrably false account is also harmful. If a patient insisted they could fly despite gravity, we would not accept that testimony as "their truth." Here, the risk is not physical flight but physiological decline based on a false sense of wellness. The SAP interim period directly addresses this objection: we are not silencing her. We are providing her with alternative data channels (visual, forced-choice) to see if her decision holds when the confabulatory channel is bypassed.

  If she refuses even after acknowledging the deficits via pointing, we respect that refusal. If she refuses only because she cannot access the deficit information, we protect her from the consequences of that access failure. The objection defeats a *summary* judgment of incapacity, which is why I have mandated the 21-day SAP window. It does not defeat a judgment of incapacity reached after supported decision-making fails.

  **Conclusion**
  On Thursday, I will move to adopt the 21-day deferral and the Load-Stability Rule. This approach respects the clinical urgency, acknowledges the neuropsychological reality without requiring metaphysical consensus, and incorporates the skeptic's safeguard against premature paternalism. Please review this framework so we may finalize the order efficiently.

  Regards,

  Chair, Capacity and Consent Review Panel
