answer: |-
  # DECISION PROCEDURE: DETECTION OF SHARED INTENTION IN MARKET CONDUCT

  **Version:** 1.0 (Triage Unit)
  **Operational Theory:** Modified Bratmanian Shared Intention (Meshing Sub-Plans) with Gilbertian Commitment Threshold.
  **Purpose:** To distinguish genuine joint agency (cartel/concerted practice) from parallel conduct or market convergence.

  ## 1. THEORETICAL BASIS AND LOSSES
  This procedure operationalises **Michael Bratman's** account of *Shared Intention*. We treat firms as acting together only if they possess interlocking intentions to pursue a joint activity, where each party's plan meshes with the other's, and each is responsive to the other's intentions. We add a threshold from **Margaret Gilbert**: there must be evidence of a *joint commitment*, meaning parties understand they are bound to the plan together, not merely individually.

  **Why this choice?** Bratman distinguishes coordination from coincidence better than Searle (who allows 'we-intentions' in isolation). Gilbert ensures we do not catch mere price leadership.
  **What we lose:** We may miss 'tacit collusion' where no communication occurs (Searle might catch this; we will not). We treat the firm as a black box capable of intention, sidestepping List and Pettit's complex work on group agents to save time.
  **What survives:** The distinction between *predicting* a rival and *relying* on a rival. The distinction between *accommodating* and *committing*.

  ## 2. THE DECISION SEQUENCE
  *Analysts must proceed in order. A 'No' exits the procedure (Recommendation: Close). A 'Judgement' flag requires Senior Case Manager review.*

  **Q1: The Plan Existence Test**
  *Question:* Is there evidence that each firm adopted a specific course of action (e.g., price point, market division) that deviates from independent profit maximisation based solely on public data?
  *Sufficient Answer:* Internal documents or data showing a decision was made to hold prices/margins contrary to immediate market pressure, or to target a specific share regardless of cost.
  *Exit:* If firms are merely reacting to public cost changes or demand shocks independently, **CLOSE**.
  *Judgement Flag:* Distinguishing 'strategic response' from 'independent reaction' is a value call.

  **Q2: The Interdependence Test (Bratman)**
  *Question:* Did Firm A's plan rely on the expectation that Firm B would act in a specific way, such that Firm A would not have acted alone?
  *Sufficient Answer:* Evidence that Firm A withheld capacity or raised prices *conditional* on Firm B doing the same.
  *Exit:* If Firm A would have taken the action regardless of Firm B's move (e.g., unilateral price hike due to cost), **CLOSE**.

  **Q3: The Communication/Commitment Test (Gilbert)**
  *Question:* Was there a mechanism (direct or intermediated) by which the parties established a mutual understanding that they were bound to this plan together?
  *Sufficient Answer:* Direct contact, meetings, or use of a common tool designed to synchronise outcomes with the knowledge that rivals are using the same tool.
  *Exit:* If coordination is achieved solely through observing public price boards with no prior mechanism, **CLOSE**.
  *Escalation Point:* **Algorithmic Intermediation.** If the 'mechanism' is software with no human contact, escalate to Legal. The procedure cannot determine if code constitutes a 'commitment'.

  **Q4: The Responsiveness Test**
  *Question:* When one party deviated or faced shock, did the others adjust to restore the joint pattern rather than exploiting the deviation?
  *Sufficient Answer:* Evidence of punishment mechanisms, or voluntary rollback of prices to restore the status quo after a deviation.
  *Exit:* If deviations lead to price wars or permanent divergence, **CLOSE** (indicates no joint commitment).

  **Q5: The Corporate Mind Escalation**
  *Question:* Can the intention be attributed to the firm, or only to rogue employees?
  *Escalation Point:* If evidence suggests traders acted without authority but benefited the firm, escalate. The procedure assumes firms can hold intentions but cannot adjudicate internal authority limits.

  ## 3. LOOK-ALIKES AND DISCRIMINATING PROBES
  *Common phenomena that mimic joint action but fail the procedure.*

  | Look-Alike | Why it fails | Discriminating Probe (Evidence Required) |
  | :--- | :--- | :--- |
  | **Conscious Parallelism** | Firms predict rivals but do not commit to them. | *Probe:* Would the firm have acted identically if the rival had not moved? If yes, it is parallelism. |
  | **Price Leadership** | One firm moves; others accommodate unilaterally. | *Probe:* Is there evidence the leader *requested* the follow-on, or that followers *promised* to follow? |
  | **Common Cost Shock** | Convergent interests driven by external factors. | *Probe:* Do margins remain stable? If margins collapse while prices rise, it is cost-driven, not collusive. |
  | **Information Exchange** | Communication that never matures into a plan. | *Probe:* Did the information exchange lead to a *change* in strategy that benefited the sender? If no action followed, it is chatter. |
  | **Algorithmic Convergence** | Software optimises against public data independently. | *Probe:* Does the algorithm have a 'match rival' function enabled by the user, or is it standard profit maximisation? |

  ## 4. LIMITATIONS AND DEFENCE
  **Systematic False Negatives:** This procedure will likely clear 'tacit collusion' (Case 1 below) where no communication exists. It prioritises legal defensibility over catching every harm.
  **Systematic False Positives:** Ambiguous social contact between competitors may be over-read as commitment (Q3).
  **Why Run It?** It prevents the Authority from wasting resources on parallel conduct cases that fail in court. It forces analysts to find evidence of *commitment*, not just *correlation*.

  ***

  # CASE TRIAGE APPLICATIONS

  **Case 1: Fuel Retailers (Parallel Pricing)**
  *Facts:* Two retailers, small town, prices move within hours for 14 months. No contact found.
  *Application:*
  *   Q1 (Plan): **Pass.** Prices deviate from cost norms.
  *   Q2 (Interdependence): **Pass.** Unlikely to hike without rival following in small market.
  *   Q3 (Commitment): **FAIL.** No communication or mechanism found.
  *   *Verdict:* **CLOSE.**
  *   *Decisive Step:* Q3. This is conscious parallelism. Without a 'mechanism' or contact, there is no joint commitment under Gilbert/Bratman.
  *   *Note:* This will frustrate enforcement instincts but protects goodwill.

  **Case 2: Bank Traders (Chat Group)**
  *Facts:* Shared chat group, euphemisms, claims of 'market colour'.
  *Application:*
  *   Q1 (Plan): **Pass.** Euphemisms imply coded strategy.
  *   Q2 (Interdependence): **Pass.** Traders set numbers based on group intel.
  *   Q3 (Commitment): **PASS.** The chat group itself is the mechanism of understanding. Use of code implies knowledge of illicit nature.
  *   Q4 (Responsiveness): **Pass.** Implied by continued group cohesion.
  *   *Verdict:* **OPEN INVESTIGATION.**
  *   *Decisive Step:* Q3. The chat group constitutes the 'pooling of wills' required for joint commitment.

  **Case 3: Supermarkets (Algorithmic Pool)**
  *Facts:* Five firms, one third-party algo, common data pool. 'Match rivals' feature. No manager contact.
  *Application:*
  *   Q1 (Plan): **Pass.** Pricing strategy delegated to software.
  *   Q2 (Interdependence): **Pass.** Algo functions only if rivals are in the pool.
  *   Q3 (Commitment): **ESCALATE.**
  *   *Verdict:* **ESCALATE TO SENIOR CASE MANAGER / LEGAL.**
  *   *Decisive Step:* Q3.
  *   *Conflict:* The Director views this as a cartel. The procedure halts at 'Commitment' because no *human* communicated a joint intention. The 'commitment' is embedded in the software subscription.
  *   *Resolution:* The procedure cannot classify algorithms as parties to a shared intention (Bratman requires human agents). However, the *subscription* to the pool by five managers may constitute the commitment. This requires a legal judgement on whether 'delegated agency' suffices for statutory tests. Do not close, but do not recommend 'Cartel' yet; recommend 'Concerted Practice via Intermediary'.

  ***

  # TRIAGE CARD (ANALYST CHEAT SHEET)

  **CARRY INTO CASE MEETINGS**

  **THE GOLDEN RULE:** We are not looking for *similar outcomes*. We are looking for *linked intentions*.

  **THE 3-STEP STOPLIGHT**

  🔴 **STOP (Close File)**
  *   [ ] Prices moved due to public cost changes (fuel, wholesale).
  *   [ ] Firm A would have done the same even if Firm B vanished.
  *   [ ] Communication exists but no change in conduct followed.
  *   [ ] **Theory:** This is Parallelism or Price Leadership.

  🟡 **CAUTION (Escalate)**
  *   [ ] Coordination achieved via software/algorithm with no human contact.
  *   [ ] Evidence of intention exists only at junior employee level.
  *   [ ] **Theory:** Agency/Commitment threshold unclear. Needs Legal view.

  🟢 **GO (Open Investigation)**
  *   [ ] Evidence of 'Meshing': "I will do X if you do Y."
  *   [ ] Evidence of 'Commitment': "We are in this together" (explicit or coded).
  *   [ ] Evidence of 'Policing': Punishment for cheating the plan.
  *   [ ] **Theory:** Shared Intention established.

  **KEY EVIDENCE MARKERS**
  *   **Good:** Diaries showing meetings before price changes; Emails using "we" not "I"; Algorithm logs showing 'rival match' override.
  *   **Bad:** Public announcements; Industry conference speeches; Standard price lists.

  **ESCALATION TRIGGERS**
  1.  **The Algorithm Question:** Can code form a contract? (Case 3 type).
  2.  **The Tacit Question:** Can we punish without contact? (Case 1 type).
  3.  **The Rogue Question:** Did the Board know?

  **REMINDER:** A 'No' at Q3 (Commitment) is a hard exit unless an Escalation Trigger is met. Do not recommend investigation on correlation alone.
