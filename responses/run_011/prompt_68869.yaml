      *   *Bratman (Shared Intention):* Focuses on meshing sub-plans and mutual responsiveness. Requires communication/interaction to mesh plans.
      *   *Searle (We-Intentions):* Internalist. Can exist in the mind of an individual ("We are doing X") even without explicit agreement, but usually implies a background capacity for cooperation.
      *   *Gilbert (Joint Commitment):* Stronger. Requires a pool of wills, often explicit or implicit agreement to be bound together. Harder to prove without communication.
      *   *List & Pettit (Group Agents):* Focus on the group as an agent itself. Relevant for corporate liability but maybe too abstract for triage.
      *   *Choice for Procedure:* For competition law, *Bratman* is usually the most practical fit for "concerted practices" (meshing plans), but *Gilbert* captures the "commitment" aspect of a cartel better. However, given the constraint on algorithms and parallel conduct, a hybrid approach leaning towards *Bratman's mutual responsiveness* is safest for evidence-based triage, while acknowledging *Gilbert* for the "commitment" threshold. Let's operationalise a **Modified Bratmanian Framework** (Shared Intention as Meshing Sub-Plans + Mutual Responsiveness) because it distinguishes best between parallel action and coordinated action.

