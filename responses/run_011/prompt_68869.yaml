      *   *Case 3 Conflict:* I must explicitly address the Director's view. If the procedure says "no joint intention" because there was no human-to-human meshing, but the law says "concerted practice" covers algorithmic collusion, the procedure is a *triage* tool, not a legal verdict. I need to frame it as "Insufficient evidence of *human* shared intention, escalate for legal interpretation of algorithmic agency."
