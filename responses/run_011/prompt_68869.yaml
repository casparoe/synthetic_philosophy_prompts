      *   *Case 3 (Supermarkets/Algo):* Common algo, data pool, no manager contact.
          *   *Analysis:* This is the hard one. The Director wants "Cartel." The Procedure (Bratmanian) requires *human* mutual responsiveness to mesh plans. If the algo does it autonomously based on public data, it might fail the "Shared Intention" test unless the *adoption* of the algo was the agreement.
