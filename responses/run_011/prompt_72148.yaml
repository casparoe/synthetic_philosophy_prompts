  **Node 5:** The dimmer is left alone. You can create one extra happy person whose existence nobody else ever learns about. Do you do it?
  *   **Yes** → **Leaf 2**
  *   **No** → **Leaf 3**

  **Node 6:** If the chance were 1-in-$10^{1000}$, would you still take the machine over saving the billion?
  *   **Yes** → **Leaf 4**
  *   **No** → **Leaf 5**

  **Node 7:** Is wiping out the village forbidden *no matter how much* future good it brings?
  *   **Yes** → **Leaf 6**
