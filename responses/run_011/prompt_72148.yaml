  **Node 8:** If wiping out the village only raised future wellbeing by 0.0000001, would you still do it?
  *   **Yes** → **Leaf 7**
  *   **No** → **Leaf 8**

  **Node 9:** You saved the village because the math didn't justify it. Does ethics break down completely here, or is there a right answer you just can't see?
  *   **Ethics Breaks Down** → **Leaf 9**
  *   **Right Answer Exists** → **Leaf 10**

  ***

  **Leaf 1: The Premise Rejector** (Unnamed)
  You have to swallow that the physicists are wrong or that your actions can change the infinite total, isolating you from the workshop's core constraint.

  **Leaf 2: Finite Aggregativist** (Classic Utilitarian)
  You have to swallow that adding happy people is always good even if it changes nothing for anyone existing, committing you to the Repugnant Conclusion in finite contexts.

  **Leaf 3: Finite Person-Affecting** (Parfitian)
  You have to swallow that creating a happy person is neutral if no one is made better off, forcing you to ignore potential lives in your moral calculus.

  **Leaf 4: Infinite Expectation Maximizer** (Pascal's Mugging Victim)
  You have to swallow that you are obliged to ignore near-certain catastrophe for the sake of a probability so small it cannot be physically represented.

  **Leaf 5: Probability Thresholder** (Risk-Weighted Utilitarian)
  You have to swallow that there is a specific cutoff where a chance of infinite good becomes zero, despite no mathematical discontinuity at that point.

  **Leaf 6: Deontological Constraint** (Rights-Based)
  You have to swallow that certain actions are forbidden even if they prevent infinite suffering, prioritizing local rules over global outcomes. (Reached via Node 7 and Node 9)

  **Leaf 7: Lexicographic Infinitarian** (Strong Infinitarian)
  You have to swallow that any increase in infinite value, however microscopic, justifies any finite atrocity, making you a slave to the dimmer switch.

  **Leaf 8: Threshold Infinitarian** (Unnamed)
  You have to swallow that infinite value can be weighed against finite rights, but only above a specific magnitude, requiring a precise moral exchange rate you cannot define.

  **Leaf 9: Error Theorist** (Moral Nihilist regarding Infinities)
  You have to swallow that moral language loses its truth value when numbers get this big, leaving you with no guidance on how to act in the long term.

  **Leaf 10: Local Obligation Theorist** (Finite Duty Advocate)
  You have to swallow that you are obliged to do local good even if it changes nothing about the universe's total value, decoupling obligation from aggregate impact.

