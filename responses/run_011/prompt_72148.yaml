  *   **Save Billion** → **Node 3**
  *   **Make Infinite Better** → **Node 4**

  **Node 3:** A machine offers a 1-in-$10^{100}$ chance of creating infinite happy lives vs. certainty of saving a billion people today. Which do you choose?
  *   **Save Billion** → **Node 5**
  *   **Take Chance** → **Node 6**

  **Node 4:** To make every future person's life 100.0001 instead of 100 wellbeing, you must wipe out a village of 10,000 people now. Do you turn the dimmer up?
