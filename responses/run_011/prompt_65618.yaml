      A: 40 votes
      B: 35 votes
      C: 25 votes
      **Winner: A**

      The A-block smiled. The C-block frowned. They preferred the ruin to the parking deck, but they liked the market hall more than both. I saw the calculation in the eyes of their representative, Mrs. Gable. If they kept voting C, they got nothing. If they shifted their weight to B, they could crush A.

      The next morning, the box yielded different numbers.

      **Ballot Set 2 (Strategic)**
      A: 40 votes (unchanged)
      B: 60 votes (35 true + 25 shifted)
      C: 0 votes
      **Winner: B**

      The C-voters lied. They marked B to stop A. The rule didn't break; the honesty did. I certified B, but the taste was ash. A voting system that rewards deception is a broken compass.

      I tried again. A top-two runoff. If no one gets fifty percent, the top two face off. Surely this forces honesty. We held the first round.

      **Runoff Round 1**
      A: 40 votes
      B: 35 votes
      C: 25 votes
      **Eliminated: C**

      C was out. The runoff would be A versus B. In a head-to-head, the C-voters prefer A over B. So A would win 65 to 35. The B-block saw this coming. They preferred the ruin C over the parking deck A. If they could keep C in the fight, they could kill A.

