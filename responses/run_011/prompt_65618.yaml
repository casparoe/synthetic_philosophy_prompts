      **Runoff Round 1 (Strategic)**
      A: 40 votes
      B: 0 votes
      C: 60 votes (35 shifted + 25 true)
      **Eliminated: B**

      **Runoff Round 2**
      A: 40 votes
      C: 60 votes
      **Winner: C**

      The B-voters lied to save their second choice by propping up their third. Again, the truth lost. I sat in the silence of the clerk's office, the ledger open, the pen heavy. Every mechanism I built was a lock picked by a voter who knew the tumblers.

      Mr. Henderson came in then, spreading a large sheet of graph paper on my counter. He was a schoolteacher who believed people were rational lines.

      "It's the arrangement," he said, tapping the paper. "Put the options on a single axis. Left to right. Parking, Market, Ruin. If everyone's preferences fall away from a single peak like a hill, nobody needs to lie. You just vote for the closest point."

      He drew the axis: A — B — C.

      I traced the groups. The A-block peaked at A and slid down to B then C. That was a hill. The B-block peaked at B and slid down to C then A. That was a hill. Then I looked at the C-block. Their true order was C, then A, then B.

      "Look here," I said, pointing to the middle of his axis. "On your line, B is between A and C. But these twenty-five people prefer A over B. They peak at C, drop down to B, then jump back up to A."

      I drew their preference line. It wasn't a hill. It was a valley.

      "They don't slide," I told him. "They dip. Your axis doesn't fit this town. The preferences cycle. A beats B, B beats C, C beats A. There is no center."

      Henderson rolled up his paper. He looked at the ledger, then at me. "Then there's no honest way to count?"

      "Not if there are three choices and everyone votes," I said. "Someone can always game the count."

      The Council met that evening. The air was thick with smoke and frustration. They had seen the numbers shift like sand. They knew that any rule I wrote could be twisted by a bloc large enough to tip the scale. They wanted stability. They wanted a result that couldn't be manipulated by a clever lie.

      They passed Ordinance 9. It removed the voting mechanism entirely. It designated the Town Clerk as the sole decider for infrastructure projects exceeding five thousand dollars. My signature would be the only ballot cast.

      It was perfect. No one could lie to change the outcome because no one else's vote existed. The rule was immune to strategy. I chose B, the market hall, because it was the only compromise that didn't leave everyone angry.

      But the price was immediate. The town hall grew quiet. People stopped coming to the meetings. They looked at me not as a servant, but as a monarch. The anger didn't vanish; it just stopped having a target other than me. I had saved the town from lying, but I had killed their voice. I certified the result alone, in a room that felt much larger than it had the week before.

      Moral: When every path can be gamed, the only honest road is one where no one else walks.

