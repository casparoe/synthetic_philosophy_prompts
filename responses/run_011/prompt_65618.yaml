      The mill site sat like a rotten tooth in the jaw of Kettle Falls, grinding nothing but rust and river wind. As Town Clerk, my job was to count the votes on its future, but my real job was to find a count that didn't lie. There were three options: A, demolish for parking; B, restore as a market; C, leave as a ruin. One hundred voters stood ready to decide, divided into three hard blocks.

