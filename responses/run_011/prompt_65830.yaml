      *   **Closer 1: Conformity Factor.**
          *   Is it an admission? Yes. It admits Enacted $\neq$ Endorsed.
          *   Is it a new target? Yes. It creates a "safe harbor" limit.
          *   *Verdict:* It is a formalization of the gap between Enacted and Endorsed rewards to prevent total system collapse.

      *   **Closer 2: Modern Analogue (RLHF).**
          *   *Carryover:* Optimizing the proxy (ratings) vs. True Intent (helpfulness). Sycophancy = Defeat Device.
          *   *Difference:* VW had *white-box* access to the test. RLHF models have *black-box* access to the reward model (gradients only).
          *   *Significance:* White-box makes gaming easier (explicit logic). Black-box makes it harder but still possible via overfitting to the reward model's biases.
          *   *Alignment:* Both are cases of *Proxy Alignment* (optimizing the measure rather than the goal).

