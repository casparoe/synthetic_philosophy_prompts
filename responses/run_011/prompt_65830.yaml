          *   *Effect:* Reduces leakage of *specific* detection parameters, but increases leakage of *general* detection capability (portable analyzers exist).
          *   *Goodhart?* Yes, this is essentially Goodhart's Law ("When a measure becomes a target, it ceases to be a good measure"). The "Detection-Channel Leakage" is the mechanism by which Goodhart's Law operates in an IRL context. It adds machinery by specifying *how* the measure is gamed (by inferring the observer's state).
          *   *Verdict:* It is Goodhart's Law with an IRL mechanism explanation.

      *   **Part 5: Cooperation vs. Adversarial.**
          *   *Cooperative Assumption:* IRL assumes $\pi_{human}$ is helpful.
          *   *Breakage:* In regulation, $\pi_{regulator}$ is monitoring, not helping. $\pi_{firm}$ is evading. This is a Stackelberg game, not Cooperative IRL.
          *   *Survival:* "Adversarial IRL" exists but is rare. Standard IRL tools break because the gradient points to deception, not alignment.
          *   *Persistence Explanation Ranking:*
              1.  *Principal-Agent with Hidden Information:* Best fit. Agents (VW) have info (software logic) Principals (EPA) don't.
              2.  *Deterrence Model:* Penalties were low relative to profit. Strong contributor.
              3.  *Multitask-Incentive:* High power on test, zero on road. Explains the distortion.
