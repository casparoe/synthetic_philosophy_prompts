              *   *Learner:* VW Engineering/Compliance Division.
              *   *Demonstration Set:* The certification test cycle (NEDC), the statutory text, the pass/fail signal on that specific cycle.
              *   *Observation Channel:* Binary pass/fail on the dynamometer. Noisy/Zero signal on road.
              *   *Reward Hypotheses:*
                  1.  *Minimize NOx always:* Ruled out by behavior.
                  2.  *Minimize NOx on Test Cycle:* Supported by behavior.
                  3.  *Minimize Cost + Pass Test:* Supported by behavior (SCR is expensive).
                  4.  *Minimize NOx on Road:* Ruled out by behavior.
              *   *Discrimination:* The data (pass on dyno, fail on road) strongly supports Hypothesis 2 & 3 over 1 & 4. The "error" isn't statistical; it's interpretive.

      *   **Part 2: Taxonomy (Enacted/Endorsed/Structural).**
          *   *Enacted:* Maximize profit subject to passing the specific dyno trace. (VW inferred this).
          *   *Endorsed:* Minimize public health harm from NOx. (Regulator's stated goal).
          *   *Structural:* Maintain legitimacy of the type-approval system while balancing industry viability. (Maybe explains the laxity).
          *   *Critique:* Textbook IRL assumes Enacted $\approx$ Endorsed. VW inferred Enacted.
          *   *Is Structural Unfalsifiable?* Yes, unless defined operationally. To make it falsifiable: "Structural Reward" must predict *which* loopholes are left open. If the regulator closes loopholes randomly, no structural reward. If they close loopholes that threaten system legitimacy but leave cost-saving ones, that supports a structural reward hypothesis.
          *   *Diagnosis:* VW didn't confuse Enacted and Structural. They ignored Endorsed. The taxonomy holds, but the failure isn't IRL confusion; it's adversarial exploitation.

      *   **Part 3: Identifiability vs. Insincerity.**
          *   *Identifiability:* In IRL, $R$ is unidentifiable without priors (Ng & Russell). Here, is $R$ ambiguous?
          *   *Analysis:* No. The statutory text + "in-use" clauses made the intended $R$ (Minimize NOx everywhere) explicit. The *incentive structure* (Pass this test to sell) made the *effective* $R$ (Pass this test) clear.
          *   *Failure Type:* This is not an IRL inference failure (ambiguity). It is a *specification gaming* or *proxy alignment* failure. In IRL terms, it's not that the reward was ill-posed; it's that the *demonstrations* (the test protocol) were a poor proxy for the *true reward* (health), and the learner optimized the proxy.
          *   *Downward Inference (Engineers):* If Engineers are learners, their "demonstrations" come from Management (Cost targets, timelines).
