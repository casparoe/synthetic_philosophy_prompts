prompt: |-
  I've been arguing with a friend for months about shame vs. guilt and we keep talking past each other, so I want you to write the document we should've produced: the joint statement from an adversarial collaboration between someone who thinks shame is the underrated moral emotion and that a community can and should cultivate it deliberately, and someone who thinks shame is really about rank and exposure, so guilt is the only one of the two that takes the victim seriously.

  Here's the concrete case I want it to test, because abstractions are where we get stuck. A town is considering replacing fines for certain offenses with a practice: the person who did it stands up in front of people who know them and says what they did, and then the people in the room say out loud what they did or failed to do that made it possible. Call it distributed shame.

  Two things I especially want in there. First, use this three-way distinction explicitly instead of just "shame": shame as felt exposure, shame as loss of standing, and shame as measuring yourself against an ideal you actually endorse. My hunch is that the guilt person is mostly objecting to the second one and the shame person is mostly defending the first and third. If that's right, I want the document to say how much of the fight turns out to be about words, and what's left over once you strip that out. Second, the culture question: can a group decide to be more shame-based on purpose and have it stick, or does it always decay into something crueler once the first sympathetic offender comes along? Give me the cruxes, what each side would accept as evidence about distributed shame, and each side's prediction written down in advance — I want to be able to check on them in ten years.

  Numbered agreed claims first, then a disagreements table. Don't give me a reading list, I can't look anything up.
