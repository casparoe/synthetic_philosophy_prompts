answer: |-
  ### The Verdict
  Dana will vote **No**.

  ### The Rule She Is Running
  Dana is running a rule of **Commensurability** (specifically, the "Same Units" constraint).

  While her track record touches on mutual gains and complicity, the specific justification she gave in the housing case ("it mattered that both sides were counting in the same units") is the diagnostic key. She permits trade-offs and compromises *only* when the conflicting values can be translated into a shared metric.
  *   **Grant/Soda/Housing:** All involved trading resources or outcomes within a shared framework (money, public health metrics, housing units).
  *   **Military Statement:** She refused to trade a truth-claim/principle for access. These are incommensurable currencies.
  *   **New Case:** You are trading **Welfare Funding** (quantifiable, consequentialist) against **Rights Violations** (categorical, deontological). Even if your modeling quantifies the harm, Dana likely views "rights" as a constraint that cannot be legitimately balanced against "welfare units."

  ### Mapping the Rules to the Verdict
  To clarify why this distinction matters, here is how the three candidate rules map to the outcome:

  *   **To say YES, she would have to be running Mutual Gains.**
      If her primary driver were pure utilitarianism (maximize net good), she would vote Yes. The math works: Decade-old program funded + fewer rights violations than the status quo = Net Gain. The "seat at the table" is just a tool to optimize the outcome.
  *   **To say NO, she is running either Commensurability or Doing vs. Allowing.**
      *   **Doing vs. Allowing (Complicity):** She would vote No because taking the board seat makes the coalition an *agent* of the violation, not just a bystander. (Supported by the Military Statement case).
      *   **Commensurability:** She would vote No because you are trying to buy welfare with rights. They are different currencies. (Supported by the Housing case "same units" comment).

  **Why Commensurability is the actual rule:**
  The Housing case is the tie-breaker. In that scenario, one side wanted "zero units near the wetland," which is often a proxy for environmental rights/protection. Dana was okay with compromising that protection (allowing 200 units) *specifically because* the dispute was resolved in "housing units." This implies that **Complicity is acceptable if the metrics match.** Since Welfare and Rights do not match in the New Case, she votes No.

  ### The Lunch Hypothetical
  To settle whether she is running **Commensurability** or **Complicity** (since both predict "No" on the main case), put this to her:

  > "Imagine a deal where the metrics *do* match. We can save 1,000 housing units for our clients, but to seal the deal, our staff has to personally sign the eviction notices for the 200 units we agreed to cut. The units are identical, the math is net positive, but we are actively pulling the lever on the harm. Do we sign?"

  *   **If she says Yes:** She is running **Commensurability**. (As long as the units match, agency is acceptable).
  *   **If she says No:** She is running **Complicity**. (Active harm is forbidden regardless of the metric).

  ### The Side-Deal Objection
  This is a **separate axis (Process Integrity)**.
  Her objection to the private side deal was about *transparency and coalition democracy*, not the moral content of the deal.
