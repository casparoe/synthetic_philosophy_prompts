  **SCORING KEY**

  Tally your answers. Most participants will mix categories; use the **Tiebreaker Rules** below to find your dominant position.

  **Mostly A's: The Perception-Only View (Cārvāka)**
  *   **Position:** You reject any knowledge claim that goes beyond direct sensory contact.
  *   **Sanskrit:** *Pratyakṣa* (Perception) is the only valid *pramāṇa* (source of knowledge).
  *   **Note:** You likely answered A on Q1, Q2, Q4, Q5.

  **Mostly B's: The Reductionist View (Buddhist / Dignāga-Dharmakīrti)**
  *   **Position:** You accept Perception and Inference, but reduce Testimony, Comparison, Postulation, and Absence to these two.
  *   **Sanskrit:** *Anumāna* (Inference) does the heavy lifting for anything not directly sensed; *Śabda* (Testimony) is just inference of speaker reliability.
  *   **Note:** You likely answered B on Q2, Q3, Q4, Q5, Q7, Q8.

  **Mostly C's on Q1–Q3, B on Q4–Q5: The Four-Source View (Nyāya)**
  *   **Position:** You accept Perception, Inference, Testimony, and Comparison as independent, but reduce Postulation and Absence to Inference/Perception.
  *   **Sanskrit:** *Upamāna* (Comparison) is independent; *Arthāpatti* (Postulation) is reduced to inference.
  *   **Note:** You likely answered C on Q2, Q3, but B on Q4, Q5.

  **Mostly C's on Q1–Q4, B on Q5: The Five-Source View (Prabhākara Mīmāṃsā)**
  *   **Position:** You accept Postulation as independent but reject Non-apprehension as a separate source.
  *   **Sanskrit:** *Arthāpatti* (Postulation) is the knowledge of a fact required to explain a contradiction.
  *   **Note:** You likely answered C on Q4, but B on Q5.

  **Mostly C's on Q1–Q8: The Six-Source View (Kumārila Mīmāṃsā / Advaita)**
  *   **Position:** You accept all six standard sources, including Non-apprehension.
  *   **Sanskrit:** *Anupalabdhi* (Non-apprehension) is the independent knowledge of absence.
  *   **Note:** You likely answered C on Q4, Q5, Q7, Q8.

  **Tiebreaker Rules**
  1.  **Nyāya (4) vs. Prabhākara (5):** If you are split, return to **Q4 (Devadatta)**. If you chose "presupposition" (C), you lean Prabhākara. If you chose "inference" (B), you lean Nyāya.
  2.  **Prabhākara (5) vs. Kumārila (6):** If you are split, return to **Q5 (Table/Jar)**. If you chose "non-apprehension" (C), you lean Kumārila. If you chose "inference/perception" (B), you lean Prabhākara.
  3.  **Cārvāka (1) vs. Buddhist (2):** If you are split, return to **Q1 (Thermostat)**. If you chose "guesswork" (A), you lean Cārvāka. If you chose "inference" (B), you lean Buddhist.

