answer: |-
  1. You glance at a thermostat reading 70°F. You believe the room is 70°F. What makes this belief knowledge?
     A. I only know the dial position; the temperature itself is unseen guesswork.
     B. I infer the temperature from the dial based on past reliability.
     C. The instrument's report is itself a source of knowledge, distinct from inference.

  2. A trusted friend tells you it is raining outside. You haven't looked. You believe it is raining. Why?
     A. I don't really know until I see the water.
     B. I infer they are honest and likely correct based on their past behavior.
     C. Their statement itself generates knowledge; I don't need to check their reliability first.

  3. You hear the word "gavaya" defined as "like a cow." Later, in the forest, you see a wild ox and recognize it as the gavaya. How did you know?
     A. I didn't know; I just guessed it matched the description.
     B. I perceived the animal and remembered the description, linking them via inference.
     C. The recognition of similarity is a distinct source of knowledge, not just memory plus inference.

  4. Devadatta is fat but never eats during the day. You conclude he must eat at night. What is the status of this conclusion?
     A. It's a guess; he might metabolize differently.
     B. It is a standard inference from effect (fat) to cause (night eating).
     C. It is a unique presupposition required to resolve the contradiction between his fatness and his daytime fasting.

  5. You look at a table where a jar usually sits. It is not there. You know the jar is absent. How?
     A. I don't know it's absent; I just don't see it.
     B. I perceive the empty table and infer the jar's absence from my non-perception of it.
     C. The absence itself is directly known; non-perception is a distinct source of knowledge.

  6. A doctor tells you, "You have a virus," based on your symptoms. You believe you have a virus. What work did the doctor's words do?
     A. None; I only believe what I physically feel.
     B. They provided premises for me to infer the diagnosis myself.
     C. They conveyed knowledge directly; expert testimony stands on its own.

  7. Your budget shows $1000 spent but only $800 accounted for. You conclude there is a $200 unrecorded expense. Is this?
     A. Pure speculation; the records might be wrong.
     B. An inference from the discrepancy to the missing item.
     C. A postulation needed to make sense of the conflicting valid facts (spending vs. records).

  8. You check your email inbox for a message from your boss. It is not there. You know she didn't send it. How?
     A. I don't know; the server might be lagging.
     B. I infer she didn't send it because I don't see the message.
     C. I know it directly through the non-apprehension of the message in a searchable inbox.

  9. [BONUS] You see a red patch on a wall. Do you perceive "redness" or "a red wall"?
     A. Just the raw color; the "wall" is added by thought.
     B. The object and its color are perceived together; perception is concept-laden.
