  **DESIGN NOTES**

  **Empty Slots in the Answer Space**
  1.  **Non-apprehension without Postulation:** A user who selects C on Q5 (Absence) but B on Q4 (Postulation).
      *   *Status:* **Incoherent.** In classical systems, if one grants that absence is a distinct ontological category known independently (Kumārila), one typically grants that resolving contradictions via presupposition is also distinct. Accepting the harder case (absence) while rejecting the easier (presupposition) lacks historical precedent and systematic stability.
  2.  **Comparison without Testimony:** A user who selects C on Q3 (Wild Ox) but B on Q2 (Friend/Rain).
      *   *Status:* **Unattractive.** No school grants *Upamāna* (Comparison) independent status while reducing *Śabda* (Testimony) to inference. Testimony is epistemically more fundamental for transmitting complex knowledge; granting independence to similarity recognition while denying it to language is pragmatically inconsistent.

  **Inseparable Pairs (Limitations of the Quiz)**
  1.  **Buddhist Reductionism vs. Modern Empiricist Reductionism:** Both will answer "B" (Inference) across Q2–Q8. The quiz cannot distinguish the Buddhist *apoha* (exclusion) theory of meaning from a modern reliability-based inference model.
      *   *Extra Question Needed:* "When you infer 'fire' from 'smoke', are you connecting real universals or excluding non-fire instances?"
  2.  **Nyāya vs. Prabhākara on Testimony:** Both answer "C" (Independent) on Q2. The quiz validates the *status* of testimony but not the *mechanism* (Nyāya: knowledge from speaker's intention; Prabhākara: knowledge from the inherent validity of the sentence itself).
      *   *Extra Question Needed:* "Does a false statement cease to be testimony, or is it testimony that fails to generate knowledge?"

  **Tiebreaker Logic**
  The quiz anticipates "unstable mixes" (e.g., 4 Nyāya answers, 2 Kumārila answers). The tiebreaker prioritizes the **Postulation (Q4)** and **Non-apprehension (Q5)** items because these are the historical fault lines between the 4, 5, and 6 *pramāṇa* systems. If a user flips on Q4, their stance on *Arthāpatti* determines whether they are Nyāya (reductionist) or Mīmāṃsā (pluralist).

  **Protest Warning**
  **Q4 (Devadatta)** will produce the "But I picked both!" protest. Nyāya proponents often argue Postulation *is* a form of Inference.
  *   *Mitigation:* The options distinguish between "standard inference from effect" (B) and "presupposition to resolve contradiction" (C). Instruct participants: "If you think it is inference, pick B. If you think the contradiction itself forces the knowledge in a way standard inference does not, pick C."
