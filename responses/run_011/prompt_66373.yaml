  I'm in a philosophy of mind course this term where the second half of the unit is machine consciousness, and separately I've been doing an RL project (SAC, mostly gridworld-ish environments), so I keep getting dragged into the same argument in my reading group. Half of them say something like "the reward signal just is the valence signal, so an agent with a big positive reward is by definition having a good time, end of story," and when I push back they say I'm being mysterian. I want to build an actual case against the lazily-stated version of that view rather than just asserting intuitions at people, and I want it built to spec so they can't wiggle out.

  So: construct me a thought experiment. I want a concrete training setup — real reward function with numbers in it, real observation space, real task, the sort of thing a small lab could run this year with off-the-shelf algorithms — in which an agent behaves, on every test we'd normally use, exactly like something that is suffering, while its scalar reward is positive and at the highest rate its ever been at during the behaviour in question. Constraints: (a) no language models and no introspective self-reports, I want the attribution to rest on behaviour plus the agent's own value dynamics, not on anything it says about itself; (b) no sci-fi hardware and no stipulated correlates, i.e. you can't just build in "and this state has the pain signature by construction"; (c) the suffering-looking behaviour has to cost the agent something real and has to clear at least three seperate tests — a free-operant escape test, an avoidance-learning test, and some kind of disruption-of-a-previously-learned-skill test — not just one; (d) crucially, no negative reward terms anywhere, because if the scalar dips at any point my opponents will just say "see, it dipped, it was bad for it, case closed." The seed I've been playing with, feel free to rebuild it: the agent lives in a chamber where a dispenser delivers a steady high rate of reward, and a cue reliably predicts that the rate is about to fall to a much lower baseline; the agent will work hard to get out of the cued region, and while it's doing that frantic escape work it is actually collecting more reward per step than it ever did sitting in the chamber, because of a badly-chosen shaping term. Something like conditioned avoidance but with the baseline set high instead of at zero. Tell me honestly whether that seed works or whether you need a different mechanism, and I already see the tension I'm worried about: if escaping pays well in reward, in what sense is it a cost? So show me how to make the cost real — long-run collapse, opportunity cost against a bigger prize, whatever — without ever letting the scalar go negative.

  Then do the demonstration, because a scenario that just announces its verdicts is useless to me. Walk through what each of these says about the finished case and why: reward-level hedonism (valence tracks the sign and size of the scalar itself), reward-prediction-error hedonism (valence tracks RPE), a progress view (valence tracks the rate of improvement in expected future reward), and a straight functional/dispositional view (valence is whatever role the state plays in avoidance, sacrifice, and skill disruption). The point of the whole exercise, so you know what counts as cheating: I want to show that "reward is valence" isn't one claim but at least three that come apart in buildable cases, and I want a case that generates those verdicts from the theories rather than one I've rigged by definition. Say which structural feature of the case is doing the work, run the deletion test on it (what happens to all four verdicts if I take that feature out), and finish with the best attack the reward-level hedonist has — probably something about the scalar in the code not being the right cash-out of "the reward signal," or about reward hacking — and tell me whether that attack actually saves them or just moves the goalposts.

  Format: lead with a two or three sentence bottom line on whether the case is buildable to all four constraints at once. Then these sections in this order: "The setup" (about 250 words, reward function written out explicitly), "Verdict by theory" (four named paragraphs, roughly 100 words each), "The load-bearing feature" (about 150 words, deletion test included), "The reward-level theorist's best shot" (about 150 words). Please don't give me a bibliography or a reading list — I'm on a train with no signal and I mostly can't check references anyway.
