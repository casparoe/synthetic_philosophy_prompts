      *   Example: "Numerical Identity." Western philosophy demands $Person_{t1} = Person_{t2}$. Buddhist karma often denies this (no-self). I must mark this as a potential prejudice.

  6.  **Drafting the Content (incorporating the constraints):**

      *   *Introduction:* Set the stage. Karma as a natural law of moral causation.
      *   *The Desiderata:* Group them logically (Cases, Distinctions, Structure, Data). Use the (a), (b), (c) format.
      *   *The No-Go Analysis:* Be sharp. Identify the inconsistency.
      *   *The Scoring:* Evaluate the four contenders based on how they handle the desiderata.

  7.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address "Ancestral Injustice"? Yes, under Collective/Transfer.
      *   *Check:* Did I address "Transformed Wrongdoer"? Yes, under Identity.
      *   *Check:* Is the tone appropriate? Needs to be analytical, not devotional, not dismissive.
