      *   The core tension is between the *intuition* of desert (bad acts deserve bad outcomes) and the *empirical reality* (often they don't align) or *metaphysical constraints* (identity, mechanism).
      *   I need to be rigorous. Some "requirements" might actually be biases from Western retributive frameworks that Karma explicitly rejects (e.g., strict identity, single life). I need to flag these in the "Verdict" section.

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Case 1: The Cruel Prosperer.* Requirement: The theory must account for the intuition that unrequited wickedness is a metaphysical error, not just a statistical one. Verdict: Non-negotiable for desert, but maybe negotiable for "natural" karma.
      *   *Case 2: The Suffering Infant.* Requirement: Must explain undeserved suffering without invoking original sin or random chance. Verdict: Non-negotiable.
      *   *Case 3: Sincere Disaster.* Requirement: Must distinguish moral luck from moral desert. Verdict: Non-negotiable.
      *   *Case 4: Transformed Wrongdoer.* Requirement: Must address personal identity. Does punishment fit the *act* or the *current self*? Verdict: This is a friction point. Retributivism says act; some karmic views say soul-stream.
      *   *Case 5: Ancestral Injustice.* Requirement: Must explain collective karma vs. individual responsibility. Verdict: Potentially a prejudice (Western individualism).

      *   *Distinction: Desert vs. Cause.* Requirement: Bad luck isn't desert. Verdict: Non-negotiable.
      *   *Distinction: Fittingness vs. Utility.* Requirement: The outcome must be *fitting*, not just useful for reform. Verdict: Non-negotiable for desert (vs. consequentialism).
      *   *Distinction: Act vs. Agent.* Requirement: Must clarify if the *deed* or the *character* is the locus of desert. Verdict: Nuanced.

      *   *Structure: Mechanism.* Requirement: Explain how nature "knows" to proportion. Verdict: High bar.
      *   *Structure: Identity.* Requirement: Link agent and recipient. Verdict: Critical.
      *   *Structure: Memory.* Requirement: Does recognition matter for it to be "payment"? Verdict: Debatable.

      *   *Data: Correlation.* Requirement: Acknowledge the lack of empirical correlation. Verdict: Forces multi-life or non-empirical claims.
      *   *Data: Spontaneous Judgment.* Requirement: Explain why we *feel* desert even without evidence. Verdict: Psychological datum.

  4.  **Identifying the "No-Go" Result:**
      *   The tension lies between: (1) Empirical adequacy (this-worldly observation), (2) Strict Individual Identity (same person suffers as acted), (3) Immediate/Single-life timing, and (4) Proportionality.
      *   You can't have single-life, empirical, individual karma that is proportional. The "No-Go" is: *Single-life + Empirical Verification + Strict Numerical Identity + Proportionality.*
      *   To escape: Drop Single-life (reincarnation) or Drop Empirical Verification (faith/deferred) or Drop Strict Identity (psychological continuity).
