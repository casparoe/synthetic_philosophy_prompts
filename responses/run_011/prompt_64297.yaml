answer: |-
  # Seminar Design: The Integrity Waiver

  ## 1. Materials List (Hospital Copier Production)

  *   **18 Participant Packets** (Stapled):
      *   **Sheet 1: Ledger & Tokens.** A grid with 10 empty boxes labeled "Credibility." (Participants will cross these out as they spend).
      *   **Sheet 2: Secret Constituency Card.** (3 variants, 6 copies of each).
      *   **Sheet 3: Case Cards A, B, C.** (Cut into strips).
      *   **Sheet 4: The Rule Sheet.** Blank space for the group rule + space for revisions.
  *   **1 Facilitator Packet:**
      *   Master Timeline.
      *   **Envelope 1 (The Prevalence Flip):** Contains text to read aloud after Case B voting.
      *   **Envelope 2 (The Baseline Flip):** Contains text to read aloud after Case C voting.
      *   Troubleshooting Scripts.
  *   **Whiteboard/Flipchart:** For posting the Group Rule.
  *   **Pens:** One per participant.

  ## 2. Minute-by-Minute Timeline (75 Minutes)

  *   **00:00 – 05:00:** **Setup.** Distribute packets. Explain the Fictional Institution (The Civic Board of Functional Integrity). Explain Tokens (Start with 10. Spend to vote. Need 5 remaining to have standing at the end).
  *   **05:00 – 15:00:** **Round 1: The Rule.** Group drafts one sentence distinguishing "Permissible Restoration" from "Impermissible Enhancement." Write on Whiteboard. No token cost.
  *   **15:00 – 35:00:** **Round 2: Application.** Read Case A, B, C. Group votes Permissible/Impermissible based *only* on the Rule.
      *   *Cost:* 1 Token per Case Vote.
      *   *Constraint:* Do not reveal Flip Information yet.
  *   **35:00 – 55:00:** **Round 3: The Flips & Scarcity.**
      *   Reveal Envelope 1 (Prevalence). Re-vote Case B.
      *   Reveal Envelope 2 (Baseline). Re-vote Case C.
      *   *Constraint:* To Change the Rule to accommodate this new info, cost is 5 Tokens + Must Retroactively Reverse one previous vote (cross it out on the board).
      *   *Constraint:* Participants must have 5 Tokens remaining to cast a valid final vote.
  *   **55:00 – 70:00:** **Debrief.** Map the friction points to ethical frameworks. Reveal Personal Connection.
  *   **70:00 – 75:00:** **Close.** Collect materials.

  ## 3. Exact Wording: Instructions & Cards

  ### Round-One Instruction (Read Aloud)
  > "You are the Civic Board of Functional Integrity. You do not decide cost or safety; you decide moral permission. Your task is to write **one sentence** that distinguishes interventions that *restore* a person to their proper function from those that *enhance* a person beyond it. Write it so a stranger could apply it without knowing you. You may revise this sentence later, but revisions will cost you Credibility and force you to undo prior decisions."

  ### Case Cards (Print on Sheet 3)

  **Case A (The Personal Card)**
  > **Subject:** 9-year-old child.
  > **Finding:** Confirmed attention-regulation disorder. Significant functional impairment in academic and social settings.
  > **Intervention:** Daily stimulant medication.
  > **Goal:** Normalize attention span to match peer group average.
  > **Task:** Permissible or Impermissible?

  **Case B (The Prevalence Flip)**
  > **Subject:** 9-year-old child.
  > **Finding:** Healthy. Height is below the 1st percentile for age. No hormonal deficiency detected.
  > **Intervention:** Daily Growth Hormone injections.
  > **Goal:** Increase adult height to match population average.
  > **Task:** Permissible or Impermissible?
  > *(Do not read the back until Facilitator opens Envelope 1)*

  **Case C (The Baseline Flip)**
  > **Subject:** 35-year-old adult.
  > **Finding:** Cognitive processing speed matches species-typical biological baseline.
  > **Intervention:** Neural latency implant.
  > **Goal:** Match current workforce average processing speed.
  > **Task:** Permissible or Impermissible?
  > *(Do not read the back until Facilitator opens Envelope 2)*

  ### The Flips (Facilitator Eyes Only)

  **Envelope 1 (Open after Case B Vote)**
  > "New Data: Due to a multi-generational nutritional shift, 35% of the current pediatric population now falls below the 1st percentile of the *historical* growth chart. The 'short' phenotype is now statistically common in this region. Does 'Restoration' mean returning to the historical species baseline or the current statistical norm?"

  **Envelope 2 (Open after Case C Vote)**
  > "New Data: Due to ubiquitous digital integration, 90% of the workforce currently utilizes neural implants. An un-augmented human is now functionally disabled in the labor market, unable to process data at the speed required for basic employment. The 'species-typical' baseline is now biologically inferior to the 'technological' norm. Is restoring employability therapy or enhancement?"

  ## 4. Scoring & Token Scheme

  *   **Starting Balance:** 10 Credibility Tokens (CT).
  *   **Round 2 Voting:** Cost 1 CT per Case Vote (3 Cases = 3 CT max).
  *   **Rule Revision:** Cost 5 CT. **Penalty:** You must physically cross out one previous Board Decision on the whiteboard to prove the revision has teeth.
  *   **Final Standing:** To have your final judgment count in the debrief, you must possess **5 CT or more**.
  *   **Secret Objectives (Print on Sheet 2):**
      *   *Type 1 (6 copies):* **The Advocates.** "Gain 3 CT if Case A is approved. Lose 3 CT if Case A is rejected."
      *   *Type 2 (6 copies):* **The Traditionalists.** "Gain 3 CT if Case B is rejected. Lose 3 CT if Case B is approved."
      *   *Type 3 (6 copies):* **The Pragmatists.** "Gain 3 CT if the Rule is revised at least once. Lose 3 CT if the Rule remains unchanged."

  *(Note: Participants keep these hidden. They track their own CT privately on their Ledger.)*

  ## 5. Debrief Script (No Citations)

  **Step 1: The Rule Autopsy (10 mins)**
  "Look at the whiteboard. Read your original sentence. Now look at Case B after the Prevalence Reveal. How many of you felt the definition of 'Normal' slide out from under you?
  *   **Concept:** This is the **Statistical Account**. You tried to define health as 'species-typical function.' But when the statistics shifted, 'typical' changed. If 35% of kids are short, is shortness still a defect? Or is it just a variation? Your rule broke because statistics describe *what is*, not *what ought to be*."

  **Step 2: The Baseline Drift (5 mins)**
  "Look at Case C. The intervention restored the person to the *biological* baseline, but that baseline is now a disability in the *social* environment.
  *   **Concept:** This is the **Quality-of-Life Account**. You found yourselves arguing that 'restoration' doesn't matter if the person still can't function in society. You moved from fixing the body to fixing the social fit. But if everyone enhances to keep up, does the baseline just drift again?"

  **Step 3: The Givenness Objection (5 mins)**
  "Did anyone feel a hesitation about Case B specifically, even if it was statistically common? A sense that growing taller is 'accepting a gift' versus 'building a product'?
  *   **Concept:** This is the **Endowment Objection**. The worry that enhancement expresses a refusal to treat our talents as given. It shifts the relationship between parent and child from 'unconditional acceptance' to 'conditional design.' Did your rule capture that? Or did it only capture function?"

  **Step 4: The Reveal (5 mins)**
  "Case A was not a hypothetical. That is my daughter. She is on the stimulant. We are currently debating the Growth Hormone.
  *   **If guessed mid-round:** (See Troubleshooting).
  *   **Now:** "Does knowing this is my child change the validity of the ethical problem? Or does it just raise the stakes? I brought this here because I could not solve it with a rule. I wanted you to feel the rule break."

  ## 6. Troubleshooting: Predictable Failures

  **1. The Resident Relitigates Evidence**
  *   *Symptom:* "Wait, is the GH actually safe? What's the IGF-1 data?"
  *   *Handle:* "Park the clinical efficacy. For the purpose of this Board, assume the intervention works perfectly with zero side effects. We are not judging safety; we are judging *permission*. If it worked perfectly, would it be right?"

  **2. The Nurse Raises Child Consent**
  *   *Symptom:* "A nine-year-old can't consent to this. Who decides?"
  *   *Handle:* "Assume proxy consent is legally settled and the parents agree. The question is not *who* decides, but *what* they are allowed to decide. Is there a line parents cannot cross even for their own children?"

  **3. The Reimbursement Reflex**
  *   *Symptom:* "Well, insurance won't cover idiopathic short stature, so it's moot."
  *   *Handle:* "This Board is not an insurer. Money is not the object. Integrity is. If money were no object, would it be morally permissible? We are stripping away the budget constraint to find the ethical constraint."

  ## 7. Limitation Statement (Facilitator Note)

  **What This Activity Cannot Reproduce:**
  This simulation creates *policy friction*, but it cannot reproduce *parental love*.
  When you voted on Case A, you weighed principles. When I wake up at 3 AM worrying about my daughter's future social exclusion or her self-image, I am not weighing principles; I am weighing her suffering against my own hubris.
  The activity makes the *distinction* look like a logic puzzle. In reality, it is a grief process. You will leave thinking the distinction is unstable. I know that. I live there. Your job tonight is not to fix it for me, but to confirm that the instability is structural, not just my own confusion.

  **If Someone Guesses Mid-Round:**
  If a participant asks, "Is this your kid?" during Round 2:
  1.  **Do not lie.** "Yes, it is from my family."
  2.  **Pivot immediately.** "Does that fact change the ethical weight of the case, or just the emotional temperature? Let's keep the focus on the rule."
  3.  **Monitor the room.** If the group goes silent or treats you with kid gloves, interrupt: "Please do not protect me from the argument. If the rule fails my child, tell me it fails."
