  **Bottom line**
  You are mostly right: this is a methodological dispute over heuristics disguised as an empirical disagreement over frequencies. Both sides accept selection and constraints; they disagree on which force gets the benefit of the doubt when evidence is ambiguous. The adaptationist treats selection as the null hypothesis because it is the only known generator of complex function. The structuralist treats constraints as the null hypothesis because organisms are integrated historical entities, not optimized machines. The rhetoric is holy-war intensity because each side views the other's default assumption as leading to systematic error: either narrative fallacy (structuralist charge) or blindness to function (adaptationist charge). The debate persists because biology lacks a quantitative theory predicting the ratio of adaptation to constraint across phenotypes. Until we can calculate the probability of a trait arising via drift or constraint versus selection, the fight remains a clash of research programs rather than a resolvable factual dispute.

  **The three claims hiding under "adaptationism"**
  "Adaptationism" conflates three distinct propositions that often get tangled. First, the **Causal Claim**: natural selection is the only process capable of generating complex, functional design over deep time. Second, the **Prevalence Claim**: the majority of observable phenotypic traits in nature are adaptations shaped by selection for their current use. Third, the **Methodological Claim**: the most efficient research strategy is to assume a trait is an adaptation until proven otherwise.

  The structuralist camp primarily attacks the Prevalence and Methodological claims. They argue that assuming adaptation leads to confirmation bias and ignores developmental constraints that dictate form regardless of utility. They accept the Causal Claim mostly, though they emphasize exaptation (co-option) over direct adaptation. The adaptationist camp defends the Methodological Claim based on the Causal Claim. They argue that without assuming function, you cannot generate testable predictions about form. They treat the Prevalence Claim as an empirical outcome of successful research, not an a priori dogma. The real fight is between the Methodological Claim (start with function) versus a pluralistic methodology (start with development), grounded in conflicting views on how often the Causal Claim actually explains specific traits. The Adaptationist sees the Methodological Claim as necessary to prove the Prevalence Claim; the Structuralist sees the Methodological Claim as inflating the Prevalence Claim artificially through a feedback loop of interpretation.

  **Steelmanned positions**
  **Adaptationist:** Selection is the only blind watchmaker we know that produces complex specified complexity. Constraints exist, but they are boundary conditions, not creative forces. If a trait looks engineered, the most parsimonious explanation is engineering via selection. Assuming adaptation is not dogma; it is the only heuristic that yields risky predictions. If you assume a trait is a byproduct, you predict nothing. If you assume it is for something, you can model optimality and test deviations. The "just-so story" critique is valid only for lazy work; rigorous optimality modeling is falsifiable. Exaptation is real, but you cannot identify a co-opted trait without first understanding the adaptation it was co-opted from or for. To deny the adaptationist program is to deny the only tool we have for explaining why organisms fit their environments. Constraints merely limit the menu; selection chooses the meal. Without this lens, biology becomes mere natural history description without explanatory power regarding function.

  **Structuralist:** Organisms are integrated developmental systems, not bundles of independent traits optimized by selection. Form is often dictated by physical laws and developmental pathways that limit variation available to selection. Selection is a filter, not a designer; it chooses from what development produces. Assuming adaptation invites narrative fallacies where every trait is given a functional story regardless of evidence. History matters: traits persist due to phylogenetic inertia, not current utility. The "engineering" analogy fails because biological structures are historically constrained modifications of existing structures, not fresh designs. Research should focus on the generative rules of development and the range of possible forms, not just the survival value of the actual form. Ignoring constraints leads to false positives in function attribution. Development creates the variation; selection merely edits it. We must understand the rules of form generation before we can understand why specific forms were selected.

  **My diagnosis**
  Your hypothesis holds: this is primarily a burden-of-proof fight wearing empirical clothing. Both sides agree on the definitions of selection and constraint, but they disagree on the prior probability that any given trait is an adaptation. Your three-question split survives scrutiny but requires one adjustment. You suggest they agree on (1) (Origin). They agree on the definition, but they disagree on the standard of evidence required to establish it. Adaptationists accept high-fitness correlation as evidence for (1); structuralists demand developmental genetic evidence separating the trait from the selected trait.

  The disagreement is substantive regarding research utility, not just verbal. If you adopt the adaptationist prior, you find functions. If you adopt the structuralist prior, you find constraints. Both are real, but the field privileges one lens. The fight persists because neither side can quantify the "space of possible forms" to determine how much of the actual form is necessitated by architecture versus selected. Until developmental biology can predict the range of viable phenotypes independently of selection, we cannot calculate the residual that selection must explain. Thus, the debate remains a clash of heuristics. Your split correctly identifies the logical structure, but it underestimates the metaphysical commitment each side has to their preferred causal narrative. They aren't just arguing about proof; they are arguing about what constitutes a complete biological explanation. One side sees function as the cause of form; the other sees form as the cause of function availability. This ontological difference keeps the debate alive despite empirical overlap. It also dictates funding and research direction, making the stakes material for early-career scientists choosing a lab.

  **The 100-traits bet**
  If you operationalized this, the camps would give radically different numbers, but the bet would not be resolvable. Adaptationists might claim 80 of 100 traits are adaptations; structuralists might claim 40. The impasse arises because "better explained" is theory-laden. An adaptationist counts a trait as an adaptation if an optimality model fits the data well. A structuralist counts it as a byproduct if developmental constraints could produce the form without specific selection for it. Since we lack a complete map of developmental possibility spaces, we cannot definitively rule out that a trait was *necessary* given the starting conditions.

  Furthermore, classification shifts over time. A trait deemed an adaptation today might be reclassified as a byproduct tomorrow with new genetic data, or vice versa. The bet fails because there is no independent arbiter of "true cause" outside of the theoretical frameworks themselves. You would end up counting how many papers each side published, not how many traits are objectively adaptations. The empirical core is hidden behind the lack of a null model for development. Without a way to simulate evolution without selection to see what forms arise naturally, we cannot measure the baseline of constraint. The bet remains a measure of ideological commitment, not biological fact, because function is defined differently by each camp.

  **One case worked through**
  **The Human Chin.**
  (1) **Origin:** Adaptationists propose sexual selection or speech mechanics. Structuralists argue it is a byproduct of jaw reduction as brains grew. To move the adaptationist, you need evidence of fitness variance linked to chin size. To move the structuralist, you need evidence that jaw reduction does not mechanically necessitate a chin protrusion.
  (2) **Design:** The chin looks distinct, but is it optimized? Adaptationists look for correlation with speech clarity or mating success. Structuralists look for geometric necessity in primate skull scaling.
  (3) **Necessity:** This is the crux. If computer models of skull growth show that reducing the jaw while keeping tooth alignment *always* produces a chin, the structuralist wins. If models show chins are optional variants, the adaptationist retains ground.
  Currently, the structuralist account is favored because the chin lacks clear function and appears mechanically linked to jaw shrinkage. However, nothing would fully satisfy the adaptationist short of finding a specific gene selected solely for chin protrusion independent of jaw size. Conversely, the structuralist needs to prove no selective pressure maintained the chin once it appeared. The evidence required is mutually exclusive: one wants functional correlation, the other wants developmental inevitability. This stalemate exemplifies the broader debate. Comparative anatomy with Neanderthals complicates this, as they lacked chins despite similar jaw mechanics, suggesting some selective or developmental divergence remains unexplained by either side fully.

  **What would count as progress**
  Progress will not come from deciding the winner of the 1979 debate. It will come from dissolving the question via Evo-Devo integration. The distinction between "constraint" and "selection" breaks down when you realize developmental systems evolve via selection. The productive shift is asking not "is this an adaptation?" but "what is the evolvability of this system?" A formal result counting as progress would be a quantitative model predicting phenotypic variance based on developmental parameters alone, allowing us to measure the residual variance selection must explain. Until then, the debate is stagnant. Both sides accept exaptation now, so the rhetorical heat has decreased, but the methodological divide remains. The question changes from "who is right" to "what is the ratio in this specific clade?" which is boring but empirical. Real progress requires a theory of form generation that stands independent of selection history. Until we have that, we are guessing at the null hypothesis. We need an independent arbiter of form possibility to settle the burden of proof dispute definitively.

  **Where you think I'm wrong**
  You claim they aren't arguing about (1) (Origin). They are. They disagree on what counts as establishing origin. Adaptationists infer origin from current utility (design); structuralists reject this inference as circular. They also disagree on the probability of (1) being true for any random trait, which is a substantive disagreement about the history of life, not just method. Finally, you underestimate the role of ideology; for some, adaptationism implies a view of organisms as optimized economic agents that extends beyond biology into social theory, making the stakes higher than mere biological classification. This political dimension fuels the rhetoric beyond what the science warrants.
