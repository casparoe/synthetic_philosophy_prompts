answer: |-
  - **The charge, in its strongest form**
  You claim I am not defining death but redefining personhood. You argue that biological cessation is a factual matter, whereas my criterion is an evaluative stipulation about what we value. You assert that by equating the loss of consciousness with death, I am masking a normative proposal as a biological discovery to license organ procurement. Finally, you contend that relying on permanent unconsciousness merely confirms that I am changing the subject rather than identifying the moment the organism dies.

  - **My reply**
  You insist biology settles death, but biology only tells us when cells cease firing, not when a human being ceases to be. A human life is not merely metabolic continuity; it is the life of a subject. When the capacity for consciousness is gone, the subject is gone, even if the biological substrate lingers. Calling this "changing the subject" ignores that death has always been the end of a biography, not just a biology. We do not mourn the cessation of homeostasis; we mourn the loss of the person.

  Consider your patient. She breathes and gestates, but she does not know she exists. Her body functions as a vessel, not as an integrated whole *of a person*. If a body can heal and carry a fetus without any possibility of awareness, it functions as an organism, yes, but not as a human being. To treat this somatic persistence as the life of the patient is to confuse the container with the content. The law calls her alive to protect against homicide, but metaphysically, the person is already absent.

  Regarding donation after circulatory death, you claim it relies on unconsciousness. I agree. It relies on the permanence of that loss. We accept a short wait not because the organism instantly dies, but because the return of consciousness is impossible. This confirms that what we truly care about is the irreversible loss of the mind. My criterion is not a stipulation dressed as fact; it is an honest acknowledgment that human death is the death of the person, not merely the machine.

  - **Where I press you**
  1. If the organism is alive but the person is gone, what moral status does the body retain to forbid organ procurement?
  2. If you insist death is purely biological, why do we not declare patients dead when their heart stops, even if we can restart it minutes later?
