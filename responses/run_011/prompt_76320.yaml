      *   Even if FB > PL, choosing FB means PL *does not happen*. That loss is painful.
      *   In Case A, choosing FB means PL *still happens* (just not by me). That loss is not painful.
      *   This isolates the "Hardness" to the *Irreversibility/Uniqueness* of the agent's impact, not the comparability.

      *(Final check on "Same Options")*:
      *   Option 1: Volunteer Shift at Food Bank.
      *   Option 2: Volunteer Shift at Library.
      *   Feature: **Shift Coverage Status** (Backed Up vs. Unbacked).
      *   This is a feature of the *Shift* (the option), not the agent.
      *   This complies with "Exactly one structural feature of the options may differ."

      *(Steelman Attack)*:
      *   If Alex chooses randomly in A, Alex reveals Indifference.
      *   Indifference = Equality.
      *   So A is not Parity, it's Equality.
      *   If A is Equality, then the "Non-comparable" premise fails.
      *   This is a strong attack. I must present it well.

      *(Unsatisfiable Spec)*:
