      My father died eleven days ago. On my kitchen table now lie nine volumes. They are small ruled books, bound in hard cover, filled with his handwriting. He kept them for fifty-one years. From the age of nineteen until shortly before he died, he maintained a record of his conduct based on a scheme devised by Benjamin Franklin.

      I have read all of it. It is not a diary of events, but a ledger of faults. Each page was ruled for a virtue, each column for a day. When he failed a precept, he entered a black spot. He did this for four cycles a year, every year, for half a century.

      The men who worked with him at the plant will recognize the discipline of the book as a shop practice. They will also recognize the reality of the record. He could hold a tenth of a thousandth of an inch on a surface grinder and could not hold Order for thirteen weeks. The difference between finishing steel, which has a specification, and finishing a self, which does not, is the whole of what this record shows. Steel yields to the tool. The self does not.

      He pursued thirteen virtues. Order defeated him in every cycle of every volume. He pursued Frugality. We all know he kept nails from the 1970s in jars on the shelf, just in case. The book shows he marked himself for it anyway. He pursued Silence. He pursued Resolution. He pursued them all, and the black spots accumulate.

      Humility does not appear in the early volumes at all. It enters in 1971. That is the year my mother told him he was insufferable at other people's dinner tables. He wrote the word down and began to mark it. He did not argue the point. He adjusted the ledger.

      There is a span in the middle volumes where the watchfulness turned outward. For a decade, the book recorded faults that were not his own. Then, in a single month, that practice ended. For the remaining thirty years, the ledger contains no faults but his own. He stopped measuring the people around him. He measured only the man in the glass.

      In the last volume, the thirteen virtues have become five. He narrowed the field. He knew what he could watch. Beside one mark near the end, he wrote in the margin that this error was permanent. He used a printer's term for a mistake already set in type. He did not explain which virtue failed him there. He simply noted that it could not be corrected.

      I am not standing here to tell you that he succeeded. The book proves he did not. I am also not standing here to tell you that the attempt was a sickness. The book proves it was not. It was a labor. He kept the wheel turning for fifty-one years. He never once claimed a bright ax.

      There is a story about a man who wanted his ax bright and free of speckles. He took it to the grindstone and watched the smith work. The labor was long. The man tired of the turning. In the end, he consented to carry home a speckled ax. Franklin says of his own project that it never arrived at the perfection he had been so ambitious of, but left him a better and happier man than he would otherwise have been.

      My father's nine volumes are the record of that turning. He did not arrive at perfection. He arrived at the end of his time with the tool in his hand. The steel is finished. The self is not. But the wheel stopped turning only when he did.

      We are left with the books. We are left with the black spots. We are left with the knowledge that he saw himself clearly, and that he kept trying to square the account even when he knew the sum would not come out right. He did not hide the speckles. He did not put the ax down. He kept grinding.

