answer: |-
  You have identified a genuine epistemic hazard that is pervasive in popularized historical and economic reasoning, particularly within the communities you mention. You are not re-deriving amateur epistemology; you are articulating a specific failure mode of **path dependence** analysis that is recognized in specialist literature but frequently glossed over in synthesis.

  Here is the carving you requested.

  ### 1. Closest Established Concepts and Where They Break Down

  There is no single canonical term for this specific inference error, but it sits at the intersection of three established frameworks.

  **A. Path Dependence (Economic History / Institutionalism)**
  *   **The Concept:** The standard model (Brian Arthur, Paul David) posits that small, contingent events at a "critical juncture" can be amplified by increasing returns (network effects, learning curves) to lock in a suboptimal outcome.
  *   **Where it Breaks Down:** The literature often conflates the *mechanism* (lock-in) with the *origin* (contingency). As you noted, the standard rhetorical move is: *Persistence + Apparent Obsolescence $\rightarrow$ Contingent Origin.*
      *   The breakdown is that **lock-in is a sufficient condition for the appearance of obsolescence, regardless of the origin.** A standard that was optimal at $T_0$ and remains optimal at $T_n$ can still look arbitrary at $T_n$ if the original optimization parameters have changed. The theory explains why bad (or old) things stick, but it is often used retroactively to prove things *were* bad or accidental simply because they stuck.

  **B. Adaptationism vs. Spandrels (Evolutionary Biology)**
  *   **The Concept:** Gould and Lewontin's critique of adaptationism warns against assuming every trait exists because it was selected for. Some are "spandrels" (byproducts) or results of drift.
  *   **Where it Breaks Down:** In biology, you can sometimes test for drift by looking at genetic variance or neutral markers. In social history, you cannot run the tape again. Furthermore, your critique is the *inverse* of the adaptationist critique. Adaptationists say "It exists, so it must be useful." You are describing the "Contingencyist" who says "It looks useless now, so it must have been accidental then." Both commit the error of reading the *current state* as a direct map of the *selection pressure*, ignoring the temporal erosion of that map.

  **C. The Identifiability Problem (System Theory / Econometrics)**
  *   **The Concept:** A model is "identified" if its parameters can be uniquely determined from the data.
  *   **Where it Breaks Down:** This is the technical core of your observation. You are describing an **unidentified inverse problem**. You are observing the equilibrium state ($E$) and trying to infer the initial conditions ($I$) and the shock ($S$). However, the transformation function ($T$) — the process of entrenchment — is non-invertible. It erases information.
      *   $E = T(I, S)$
      *   If $T$ involves "sedimentation" (overwriting original reasons with complementary infrastructure), then multiple distinct pairs of $(I, S)$ map to the same $E$. You cannot mathematically recover $S$ (the coin flip) from $E$ (the keyboard) without external data.

  ### 2. Proposed Term and Definition

  Since no single term captures the specific conflation of *present opacity* with *past contingency*, I propose:

  **The Retrospective Contingency Fallacy**
  *(Also: The Sedimentation Inference)*

  **Definition:** The error of inferring that a past decision was contingent (accidental, underdetermined, or a "coin flip") primarily on the evidence that the resulting institution or technology currently lacks visible functional justification.

  **The Mechanism:** It assumes that **functional transparency** is conserved over time. It fails to account for **signal erasure**: the process by which entrenchment (complementary assets, training, norms) overwrites the original optimization logic, making a deliberately chosen path look arbitrary in hindsight.

  **Boundary Cases: When is the inference legitimate?**
  It is legitimate to read present arbitrariness as evidence of past contingency *only* when:
  1.  **Active Maladaptation:** The feature is not just "neutral" or "opaque," but actively hinders function *relative to known alternatives that were available at the time*, and the cost of switching is not sufficient to explain the persistence. (e.g., if the keyboard layout actively caused injury and we knew how to fix it, but didn't).
  2.  **Documented Near-Misses:** There is historical record that the alternative was seriously considered and rejected for reasons that are no longer valid, rather than simply never being on the table.
  3.  **Divergence under Similarity:** Two similar systems with similar starting conditions diverged at the specific point in question (e.g., US vs. UK rail gauges). If the starting conditions were truly identical and the outcome differed, contingency is the likely driver.

  ### 3. Independent Evidence of an Open Branching Point

  To avoid the fallacy, you need evidence that does not run through the present appearance of the outcome. You need data from $T_0$ (the branching point), not $T_n$ (the present).

  1.  **Archival Deliberation:** Minutes, diaries, or correspondence from the decision-makers showing that the choice was perceived as toss-up, or that the "winning" option won by a narrow margin (e.g., a single vote, a chance meeting).
  2.  **Simultaneous Variation:** Evidence that at the same historical moment, different actors made different choices without one immediately dominating the other (suggesting no single option was technologically forced).
  3.  **Counterfactual Modeling:** Formal models showing that at $T_0$, the fitness landscape was genuinely flat (multiple equilibria existed with similar payoffs). This requires reconstructing the *past* payoff matrix, not assuming it matches the present one.
  4.  **Absence of Deterministic Constraints:** Proof that the "winning" technology was not the only one physically or economically viable at the time. (e.g., proving that AC current was viable when DC was chosen, rather than assuming DC was chosen by accident).

  ### 4. Verdict: Recognized Failure Mode or Amateur Epistemology?

  **This is a recognized failure mode, but you have correctly identified that it is under-theorized in the "rationalist" synthesis.**

  You are re-deriving a critique that exists in specialized economic history and institutional sociology, but which rarely makes it into the blogosphere summaries.

  **The Literature You Missed (or that was summarized away):**
  *   **Liebowitz & Margolis (1990, 1999):** *Winners, Losers, and Microsoft.* They specifically attacked the QWERTY narrative. They argued that the "inefficiency" of QWERTY was a myth, and that the inference from "persistence" to "accidental lock-in" was flawed. They coined the term **"path dependence rhetoric"** to describe exactly the move you are critiquing.
  *   **James Mahoney (2000):** *Path Dependence in Historical Sociology.* He distinguishes between "self-reinforcing sequences" and "critical junctures." He explicitly warns that researchers often assume a juncture was "critical" (open/contingent) simply because the outcome was momentous, which is the same logical error.
  *   **Paul Pierson (2004):** *Politics in Time.* Pierson discusses the difficulty of distinguishing between "efficient" and "inefficient" path dependence and notes that the "inefficiency" is often assumed rather than proven.
  *   **Gerald David (1985):** *Clio and the Economics of QWERTY.* This is the paper that started the trend you are critiquing. The subsequent two decades of rebuttal constitute the literature on why David's inference was too strong.

  **Why it feels under-theorized:**
  In the "rationalist" blogosphere, these concepts are often imported as **heuristics** rather than **methodologies**. "Path dependence" becomes a label for "things stick," and "contingency" becomes a label for "things could have been otherwise." The epistemic link between them—the requirement for independent evidence of the branching point—is often dropped for the sake of a good story.

  **Conclusion:**
  You are correct. The inference is invalid without independent evidence of the initial conditions. The appearance of arbitrariness is a product of the *duration* of the lock-in, not necessarily the *nature* of the origin. You have not missed a name; you have identified a gap between the technical literature (which knows this is hard) and the popular application (which treats it as a trivial inference).

  If you need a label to use in conversation, **The Retrospective Contingency Fallacy** is precise. If you want to cite the lineage, point to the **Liebowitz & Margolis critique of the QWERTY narrative**. They made your exact argument thirty years ago: persistence does not prove accident, and obsolescence does not prove inefficiency.
