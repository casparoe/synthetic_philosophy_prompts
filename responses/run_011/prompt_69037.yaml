answer: |-
  At the annual gala, fundraiser Alex approaches donor Jordan with a pledge card and says, "I am asking for $10,000 to fund our operations, and I am doing so by leveraging your known discomfort with being seen refusing a request in front of your peers, even though you privately believe donations should be private and impersonal; I state this openly so you know I am bypassing your judgment of our merit to trigger your social anxiety, you are free to walk away without penalty, and yet I rely on you complying despite recognizing this pressure." Jordan, who genuinely believes acting on social anxiety is a weak and unworthy motive, feels the pressure mount, acknowledges aloud that Alex is precisely exploiting this flaw, and yet signs the check solely to relieve the immediate discomfort of the scene.

  This case works because it isolates transparency from the mechanics of agency. A theorist who holds that manipulation consists essentially in playing on non-rational or disavowed dispositions (the Substantive View) will verdict this as **manipulation**, because Alex intentionally bypasses Jordan's rational assessment of the charity's merit to trigger a motive Jordan himself rejects as illegitimate. A theorist who holds that manipulation essentially requires concealment (the Transparency View) will verdict this as **persuasion**, because Alex concealed nothing; the aim, means, and psychological lever were all disclosed, and Jordan consented with full knowledge. The single feature producing this divergence is the **target's disavowal of the motive** independent of his knowledge of it. If that feature is removed—for instance, if Jordan endorsed social recognition as a good reason for giving—the Substantive theorist would reclassify the act as legitimate persuasion, aligning with the Transparency theorist. Jordan's knowing acquiescence serves as a complete defense for the Transparency account (consent negates manipulation), but fails as a defense for the Substantive account (one cannot consent to having one's rational agency bypassed by disavowed triggers). Finally, the Transparency theorist's strongest attack is to deny the label entirely: "What you have built is not manipulation, but **exploitation**; Jordan purchased relief from his own anxiety at a price he accepted, which makes this a voluntary transaction, not a deceptive subversion of will."
