  2. Severe: The Huck Finn Case. An agent acts rightly from sympathy while believing the act is morally wicked, showing high robustness against their own moral conscience but low moral understanding. Defender should explain this away by insisting moral worth tracks objective rightness, not the agent's moral beliefs.

  3. Moderate: The Kantian Intuition Flip. Your view grants less worth to the struggle-heavy agent who barely succeeds than the naturally warm agent who rarely struggles, contradicting the deep intuition that overcoming vice is praiseworthy. Defender should stand firm here, arguing that reliability is more valuable than internal conflict.

  4. Moderate: Redundancy with Virtue Ethics. A virtuous character just is a disposition to act rightly across counterfactual situations, so your view predicts nothing distinct from claiming "virtue has worth." Defender must argue that grounding worth in modal facts rather than psychological states yields different edge-case verdicts.

  5. Awkward: The Metric Problem. You have left "robust across the right counterfactuals" so under-specified regarding which nearby worlds count that no possible case could refute it. Defender should concede this is a structural weakness but argue normative theories require contextual judgment unlike empirical hypotheses.
