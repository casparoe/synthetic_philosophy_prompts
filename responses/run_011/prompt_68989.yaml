  **NODE 1: The Van Meegeren (Case 6)**  
  A forgery is exposed. The object is physically identical to when you admired it.  
  **Does the aesthetic merit *drop* upon exposure?**  
  └─ **NO** → Go to **NODE 5** (Aesthetics are Autonomous)  
  └─ **YES** → Go to **NODE 2** (History is Constitutive)  

  **NODE 2: The Reattribution (Case 1)**  
  A painting labelled "Copy" is reattributed to the Master. No paint touched.  
  **Does the artistic value *increase*?**  
  └─ **NO** → **LEAF 1: MORALISM**  
  └─ **YES** → Go to **NODE 3**  

  **NODE 3: The Workshop (Case 3)**  
  Master designed it; Assistant painted it. Sold as Master's work in 1650.  
  **Is the *mind* the author, or the *hand*?**  
  └─ **MIND** → **LEAF 2: INTENTIONALISM**  
  └─ **HAND** → Go to **NODE 4**  

  **NODE 4: The Conservation (Case 2)**  
  Invisible repair (original matter) vs. Honest Copy (new matter).  
  **Which is more authentic?**  
  └─ **REPAIR** → **LEAF 3: MATERIAL CONTINUITY**  
  └─ **COPY** → **LEAF 4: VISUAL INTEGRITY**  

  **NODE 5: The Honest Reconstruction (Case 4)**  
  Disclosed period-style reconstruction. Lovely.  
  **Is it *equal* in value to the original?**  
  └─ **YES** → **LEAF 5: RADICAL AESTHETICISM**  
  └─ **NO** → Go to **NODE 6**  

  **NODE 6: The AI Reconstruction (Case 5)**  
  Same as above, but produced by AI.  
  **Is it art?**  
  └─ **YES** → **LEAF 6: POST-HUMAN FUNCTIONALISM**  
  └─ **NO** → Go to **NODE 7**  

  **NODE 7: The Skill Check**  
  Why is the human copy better than the AI copy?  
  **Is it about *difficulty overcome*?**  
  └─ **YES** → **LEAF 7: PERFORMANCE THEORY**  
  └─ **NO** → Go to **NODE 8**  

  **NODE 8: The Class Check**  
  If not skill, what blocks the value?  
  **Does it belong to the *right category*?**  
  └─ **YES** → **LEAF 8: INSTITUTIONAL THEORY**  
  └─ **NO** → **LEAF 9: ECONOMIC SCARCITY**  

  ---

  ### THE LEAVES (View + Awkward Commitment)
  1.  **MORALISM:** Forgery is a lie, art is fine.  
      *Awkwardness:* You must explain how to enjoy the art while hating the act.
  2.  **INTENTIONALISM:** Design constitutes the work.  
      *Awkwardness:* A masterpiece painted by a sleepwalker is nothing.
  3.  **MATERIAL CONTINUITY:** The specific atoms matter.  
      *Awkwardness:* Restoration is destruction; Theseus's Ship is not the ship.
  4.  **VISUAL INTEGRITY:** The image matters more than the matter.  
      *Awkwardness:* A high-res photo is as authentic as the canvas.
  5.  **RADICAL AESTHETICISM:** Perfect copy = Original.  
      *Awkwardness:* Museums are warehouses, not temples of origin.
  6.  **POST-HUMAN FUNCTIONALISM:** Output matters, not agency.  
      *Awkwardness:* Glitches and errors are creative choices.
  7.  **PERFORMANCE THEORY:** Value is in the achievement.  
      *Awkwardness:* Lucky accidents have no artistic value.
  8.  **INSTITUTIONAL THEORY:** Value depends on category membership.  
      *Awkwardness:* Categories are arbitrary; art is whatever we say it is.
  9.  **ECONOMIC SCARCITY:** Value is in the rarity.  
      *Awkwardness:* Art value collapses if we find more of it.

  ---

  ### LOGICAL SPACE & EMPTY CELLS
  **The Axes:**  
  1.  **Ontology:** Is the work the object (Physicalism) or the event (Contextualism)?  
  2.  **Deception:** Is the lie the problem (Moralism) or the origin (Ontology)?  
  3.  **Agency:** Is value in the mind (Intentionalism), hand (Materialism), or system (Functionalism)?  
  4.  **Discovery:** Does value change upon exposure (Dynamic) or stay static (Static)?

  **Empty Cells:**  
  *   **The "Deception Only" Contextualist:** Someone who says reattribution adds no value (Node 2 NO) but exposure ruins the art (Node 1 YES). *Why Empty?* Incoherent. If history doesn't add value, the lie about history shouldn't subtract it aesthetically.
  *   **The "AI Humanist":** Someone who says AI art is art (Node 6 YES) but human copies aren't (Node 5 NO). *Why Empty?* Unfashionable. Usually, if you accept AI, you accept copies. If you reject copies, you reject AI.
  *   **The "Materialist Aestheticist":** Someone who says matter matters (Node 4 REPAIR) but exposure doesn't change aesthetics (Node 1 NO). *Why Empty?* Nobody's bothered. If you care about the atoms, you usually care about their history.

  ### LIMITATIONS & SPLITTERS
  **Indistinguishable Leaves:**  
  **Performance Theory (Leaf 7)** and **Institutional Theory (Leaf 8)** often overlap. Both reject the AI copy, but for different reasons (Effort vs. Category).  
  *Extra Question to Separate:* "If an artist spends 10 years training an AI to paint, is that *skill*?"  
  *   **Yes:** They lean Performance (Effort counts).  
  *   **No:** They lean Institutional (Category 'Art' requires human hand).

  **Conservation Tension:**  
  **Material Continuity (Leaf 3)** and **Visual Integrity (Leaf 4)** are hard to separate if the conservator uses period materials.  
  *Extra Question to Separate:* "If the repair is invisible but uses modern plastic, is it authentic?"  
  *   **Yes:** Visual Integrity.  
  *   **No:** Material Continuity.
