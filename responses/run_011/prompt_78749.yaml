answer: |-
  You are not confused. Your hunch is correct, and your intuition as a scientist serves you well here: you have spotted the unexamined control variable. The political philosophy of church and state is often sold as a spectrum ranging from "established" to "neutral," but that assumes neutrality is a possible state of affairs. It is not. The state is a totalising machine; it cannot help but define the boundaries of the human good. When it claims not to, it is simply defining them in negative space.

  Let us correct the mechanics first, briefly. Your recollection is remarkably sharp. In England, the monarch is indeed the Supreme Governor of the Church of England and must be in communion with it. The twenty-six bishops (Lords Spiritual) do sit in the House of Lords. The parish priest's duty to bury any parishioner (and historically to marry them, though marriage laws have tightened) regardless of belief is a crucial detail often missed; it makes the church a public utility, not just a private club. In Germany, your description of the *Kirchensteuer* is accurate: it is a surcharge on income tax collected by the state, and formal renunciation (*Kirchenaustritt*) is a civil act with canonical consequences. In France, the 1905 law of separation is the rule, but the Concordat in Alsace-Moselle is the exception that proves the rule: even the most militant secular state retains administrative machinery for religion when history forces its hand.

  Now, to the argument.

  ### 1. The Myth of the Neutral Baseline

  There is no neutral regime. There are only regimes that hide their theology in different departments.

  The American and French models claim neutrality by privatisation. They assert that religion is a matter of private conscience, and the state's job is to keep the public square clear of it. But to do this, the state must decide what counts as "religion" worthy of protection and what counts as "secular" business. In the US, the Supreme Court constantly adjudicates what constitutes a "sincere religious belief" for the purposes of exemptions (from vaccines, to cakes, to drafts). That is a theological judgment. In France, *laïcité* is not a void; it is a positive civic religion that demands the public suppression of religious symbols to ensure "fraternity." That is a substantive moral claim about how humans should interact.

  The English and German models do not hide this. They admit that religion is a public fact that requires public management. The difference is not between entanglement and separation, but between *explicit* entanglement and *implicit* entanglement. The American state pretends it does not touch the soul while shaping the legal container the soul must inhabit. The German state touches the soul directly but provides a mechanism to pull away.

  If we must rank them, we should not rank them by proximity to "neutrality," but by *transparency*. The regimes that admit they are managing religion are intellectually more honest than those that claim not to be.

  ### 2. The German Believer and the Architecture of Coercion

  Take your German case: the believer who accepts the dogma but refuses the tax. Who is establishing whom?

  It is a joint venture. The state establishes the *boundary* of membership, while the church establishes the *consequence* of crossing it. By using the tax register to define who is a Catholic or Protestant, the state effectively becomes the sacristan. It decides who is on the roll. When the church denies sacraments to those who leave the roll, it is accepting the state's definition of membership as valid for spiritual purposes.

  Is this an argument against church taxes? Only if you assume religion should be financially voluntary like a gym membership. But if you assume religion is a public good or a corporate body with societal obligations (running hospitals, schools, maintaining historic buildings), the German model is arguably *more* honest than the American one.

  In the US, religion is funded by voluntary donation, but those donations are tax-exempt. The state is still subsidising the church; it is just doing so through foregone revenue rather than a direct bill. Furthermore, the American model allows for "free-riding" on cultural Christianity without commitment. The German model forces a crisis of conscience. If you believe, you pay. If you do not pay, you admit you do not belong. It removes the fog of cultural affiliation. It treats religious membership as a legal status with costs, rather than a feeling with benefits. In that specific sense, it is more honest: it acknowledges that institutions cost money and that belonging has boundaries.

  ### 3. Theories of Belonging

  Your hunch here is the strongest part of your inquiry. The debate fails because the participants are arguing past each other, assuming different ontologies of the self.

  *   **The American Model (Contractual):** You are a sovereign individual. Religion is a voluntary association. You choose it like a gym or a political party. The state's job is to protect your right to choose.
  *   **The English Model (Territorial/Feudal):** You are a subject of a place. The church is coterminous with the nation. You belong to the parish because you live in the parish. The state's job is to ensure the church serves the territory.
  *   **The German Model (Corporatist):** You are a member of a public-law corporation. Religion is an institutional status recognised by the state, similar to being a member of a trade union or a professional body. The state's job is to administer the membership rolls.
  *   **The French Model (Private/Public Split):** You are a citizen first, believer second. Religion is a private hobby that must not intrude on public citizenship.

  The neutrality debate is indeed downstream of this. If you believe the Contractual theory is true, the German system looks like tyranny. If you believe the Corporatist theory is true, the American system looks like anarchy, dissolving stable institutions into fleeting preferences. The philosophers rarely argue this because it requires arguing about human nature, which is harder than arguing about tax codes.

  ### 4. The Commitment

  I will defend the **German Model**.

  I defend it not because it is the most comfortable—it is bureaucratic and coercive—but because it is the most *true* to the reality of institutional religion. It treats religious communities as serious, enduring public bodies that contribute to the civil order (through kindergartens, hospitals, elderly care, which are heavily subsidised in Germany) and therefore require a stable funding mechanism and clear membership boundaries. It refuses to infantilise religion by treating it as a purely private hobby, and it refuses to fetishise it by making it a symbol of state power (as in England). It says: *Religion is a public business. It costs money. It has rules. The state will help administer the business, but you must declare if you are in or out.*

  **The Strongest Objection (from the American/Contractual perspective):**
  The objection is that the German model violates the sanctity of conscience by introducing state coercion into the realm of faith. By making the tax office the gatekeeper of church membership, the state pollutes the voluntary nature of belief. It forces a citizen to formally renounce their faith to save money, creating a financial barrier to exit that chills freedom of conscience. It makes the state a partner in excommunication.

  **The Answer:**
  This objection assumes that the American model does *not* coerce conscience. It does. The American model coerces by privatisation. It tells the believer that their faith is irrelevant to the public order, that it must be left at the door of the public square. This is a substantive philosophical claim that marginalises religious reasoning.

  Furthermore, the German "coercion" is administrative, not theological. The state does not care if you believe; it cares if you are registered. The renunciation form (*Kirchenaustritt*) is a civil declaration, not a theological abjuration. The church imposes the sacramental penalty, not the state. The state merely updates the database.

  The real coercion in the American model is economic opacity. American churches rely on donations, which means they must constantly perform for funding, often aligning with political factions to keep the money flowing. The German *Kirchensteuer* insulates the church from the market, allowing it to be counter-cultural without going bankrupt. It allows the church to be a church, not a vendor. The price of this independence is the administrative entanglement you identified. But given your premise—that there is no neutral baseline—I would rather have an entanglement that secures the institution's independence from the market than one that hides the subsidy in tax exemptions while demanding the institution stay out of public policy.

  ### Conclusion

  You suspected that "neutrality" was a hiding place for unexamined parameters. You were right. The American and French models hide their parameters in the definition of "private" and "public." The English model hides theirs in history and ceremony. The German model puts the parameter on the table: religious belonging is a corporate status administered by the state.

  None of these are neutral. But the German model is the only one that treats religion as a serious, costly, public institution rather than a private sentiment or a national ornament. It is the most honest about the fact that the state and the church are always already entangled; it simply chooses to manage the entanglement through the tax office rather than the courts or the crown. If we must live with non-neutrality, we should choose the system that is most transparent about its mechanics. The German system forces you to sign your name to your position. That is a demand worth making.
