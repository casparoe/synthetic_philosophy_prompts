  At the HOA meeting regarding the shared hedge, Mr. Henderson admits he sheared it too low.
  "He claims it was a mistake," a member says.
  The Chair replies, "That's an excuse. We keep the participant stance. We resent him."
  "What if he claims he was sleepwalking?"
  "Then it's an exemption. We switch to the objective stance. No resentment."
  "So he doesn't pay for the hedge?"
  "Oh, we fix the hedge. We just stop treating Henderson like a responsible agent and start treating him like another overgrown hedge."

  What the punchline is load-bearing on

  This joke hinges on Strawson's distinction between excuses (which modify resentment within the participant stance) and exemptions (which compel the objective stance, suspending resentment entirely). The punchline ("another overgrown hedge") literalizes the objective attitude: treating the agent as an object to be managed rather than a person to be reasoned with. A generic version would joke that "determinism means no one is responsible," which Strawson explicitly rejects; that joke fails because causation doesn't suspend reactive attitudes, only practical withdrawal does. Such a joke is swapable; this one requires knowing exemptions override excuses. For hard incompatibilists, the joke still lands descriptively. Even if they believe reactive attitudes are unjustified, they recognize Strawson's account of our social practices. The humor comes from the HOA's cold pragmatism in applying the objective stance, not from metaphysics itself. They accept the framework of the joke even if they reject the justification of attitudes involved.
