answer: |-
  **MEMORANDUM**

  **TO:** Student Investment Committee
  **FROM:** [Your Name]
  **DATE:** October 23, 2023
  **SUBJECT:** Vote on Proposed Kelly-Criterion Position Sizing Framework

  **Recommendation: Approve with Conditions**

  We are voting Thursday on whether to replace our current "vibes-based" allocation process with a Half-Kelly sizing framework. My recommendation is to **approve the framework, but only under strict conditions** regarding input validation, correlation limits, and drawdown controls.

  Moving from subjective voting to a quantitative framework is necessary. Our current process rewards confidence over accuracy and exposes us to concentration risk without a mathematical guardrail. However, the justification provided for the Kelly rule contains a critical error regarding risk preference, and the proposal ignores the existential threat posed by our six-year horizon.

  Below is the reasoning you need to evaluate before casting your vote.

  ### 1. The "Preference-Free" Claim is False
  The proponent argues that Kelly maximizes long-run growth as a "mathematical fact" and therefore removes risk preference from the equation. **This is incorrect.**

  While it is mathematically true that Kelly maximizes the expected geometric growth rate, maximizing geometric growth is mathematically equivalent to maximizing **Logarithmic Utility**. Choosing Log Utility is absolutely a value judgment. It implies a specific coefficient of relative risk aversion (equal to 1).

  If we cared more about avoiding volatility, we would choose a utility function with higher risk aversion (e.g., Power Utility). If we cared only about arithmetic returns regardless of ruin, we would maximize expected value. By adopting Kelly, we are implicitly voting that we are willing to endure a 50% probability of a 50% drawdown at some point to maximize terminal wealth. That is a risk preference, not a law of physics. We need to admit we are making a choice about risk, not hiding behind "math."

  ### 2. The Input Problem (Objector 2)
  Objector 2 is correct that Kelly is fragile. The formula outputs garbage if the inputs are wrong. In institutional finance, Kelly is rarely used because estimating the true probability of an edge is nearly impossible. In our case, the inputs are provided by 20-year-olds with two years of experience.

  If a member overestimates their edge by even a small margin, Kelly dictates overbetting. Overbetting reduces growth and increases ruin risk. The proposal suggests "Half-Kelly" to mitigate this, which is standard industry practice for error mitigation. However, Half-Kelly is not enough if the correlation between our bets is high. If five members submit tech theses that all rely on the same interest-rate assumption, we are not holding five independent bets; we are holding one large bet sized five times. The current proposal lacks a correlation constraint.

  ### 3. The Six-Year Horizon (The Dean's Constraint)
  This is the most critical factor. Kelly optimization assumes an infinite time horizon—it assumes you can survive deep drawdowns to let compounding work. **We do not have an infinite horizon.**

  We have approximately six years before the Dean's office reviews us. The constraint is binary: if we suffer a 30% drawdown in a single year, the fund is folded. This is a "ruin" constraint that overrides long-run growth maximization.
  *   **Full Kelly:** High probability of exceeding a 30% drawdown over a 6-year period.
  *   **Half-Kelly:** Reduces volatility, but with correlated student errors, a 30% drop is still plausible.
  *   **Vibes:** Unquantifiable risk, historically volatile.

  Because our "game" ends if we hit a 30% loss, our utility function is not purely Logarithmic. It has a "step function" penalty at -30%. A pure Kelly approach does not account for this cliff. We must engineer safeguards to ensure we do not hit that cliff, even if it sacrifices some theoretical growth.

  ### 4. Proposed Conditions for Approval
  To vote "Yes," the following conditions must be added to the governing doc for this framework:

  1.  **Faculty Input Validation:** The Faculty Advisor cannot remain quiet. They must review and sign off on the probability/payoff inputs for any position exceeding 3% of the book. If they deem the probability estimates unsupported, the position size is capped at 2% regardless of the Kelly calculation.
  2.  **Sector/Correlation Cap:** No more than 25% of the portfolio may be exposed to a single GICS sector or common risk factor (e.g., interest rate sensitivity), regardless of individual Kelly sizes.
  3.  **Drawdown Circuit Breaker:** If the fund is down 15% year-to-date, all position size caps are automatically halved until the fund recovers to high-water mark. This prioritizes survival over growth when we are near the Dean's "danger zone."
  4.  **Explicit Mandate Acknowledgement:** The committee minutes must record that we are adopting Log Utility (Half-Kelly) as a *preference*, acknowledging that this prioritizes terminal wealth over path stability, subject to the Circuit Breaker above.

  ### Conclusion
  The Kelly framework is superior to our current process, but only if we treat it as a risk management tool rather than a truth machine. We must acknowledge the risk preference we are adopting and protect the fund against the specific binary risk of the six-year review.

  Vote **Approve with Conditions**.

  ***

