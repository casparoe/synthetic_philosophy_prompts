reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **Core Question:** How can scholars claim Frege's logic is politically neutral when his *Political Diary* (1924) and *Grundgesetze* (1893/1903) overlap in timeframe and the diary contains virulent antisemitism/anti-parliamentarianism? Did the logicist project serve a political function for him? Is there textual evidence of politics leaking into the formal work, or is there just an assumed firewall? What counts as evidence?
