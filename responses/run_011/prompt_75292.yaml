  3.  **Test 1: Upamāna (Comparison) vs. Anumāna (Inference)**
      *   *Nyāya View:* *Upamāna* is distinct. It connects a word (*gavaya*) to a new object based on similarity to a known object (*cow*), without a universal major premise (*vyāpti*).
      *   *Buddhist/Nyāya Reductionist View:* It's inference. "This animal resembles a cow. The teacher said 'gavaya' resembles a cow. Therefore, this is a gavaya."
      *   *Attempt at Dissociation:*
