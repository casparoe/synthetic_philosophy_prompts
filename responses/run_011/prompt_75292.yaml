          *   *Verdict:* The dissociation is asymmetrical. *Anumāna* can operate without *Upamāna*, but the reductionist insists *Upamāna* cannot operate without *Anumāna*. To prove otherwise requires proving that similarity-recognition is *non-inferential*. This is the crux of the dispute.
