answer: |-
  Your hypothesis is that the *pramāṇa* debate is merely taxonomic—a disagreement about the "resolution" of the epistemological map rather than the territory itself. You propose testing this via **double dissociation**: to prove two sources ($S_1, S_2$) are distinct, we need a case where $S_1$ yields knowledge while $S_2$ is inoperative, and a matched case where $S_2$ yields knowledge while $S_1$ is inoperative.

  Here is the application of that criterion to the specific disputes, followed by an assessment of what constitutes progress.

  ### Test 1: *Upamāna* (Comparison) vs. *Anumāna* (Inference)

  **The Goal:** Isolate knowledge gained via similarity-recognition (*upamāna*) from knowledge gained via universal-pervasion (*anumāna*).

  **Case A: *Upamāna* Operative, *Anumāna* Inoperative**
  *   **Scenario:** The standard Nyāya case. A subject is told, "A *gavaya* is like a cow." Later, in the forest, they see an animal resembling a cow and recall the name *gavaya*.
  *   **Argument for Dissociation:** Nyāya argues there is no *vyāpti* (invariable concomitance) here. The subject does not know "All cow-like animals in this forest are *gavayas*." They simply recognize the similarity and apply the name. *Anumāna* requires a major premise linking the middle term (cow-likeness) to the major term (*gavaya*-ness). Since no such universal rule is possessed, *Anumāna* is inoperative.
  *   **Reductionist Counter:** The Buddhist or reductionist Naiyāyika argues that the testimony ("A *gavaya* is like a cow") establishes a provisional universal: "Whatever resembles a cow in context $C$ is a *gavaya*." The recognition of similarity triggers this rule. Thus, *Anumāna* is operative.
  *   **Verdict:** **Appears to succeed only by smuggling.** To claim *Anumāna* is inoperative, one must presuppose that *vyāpti* requires prior empirical generalization. The reductionist defines *vyāpti* loosely enough to include linguistic stipulation. If you define *Upamāna* as "knowledge from similarity without *vyāpti*," you have baked the distinctness into the definition. If you define it neutrally as "knowledge from similarity," the reductionist successfully subsumes it under inference (reasoning from sign to thing).

  **Case B: *Anumāna* Operative, *Upamāna* Inoperative**
  *   **Scenario:** Seeing smoke on a hill and inferring fire.
  *   **Argument for Dissociation:** This relies on causal connection, not similarity to a remembered object. *Upamāna* requires a known prototype (the cow) to identify a new object. Here, no prototype is needed, only the universal relation between smoke and fire.
  *   **Verdict:** **Succeeds.** Everyone agrees inference can occur without comparison.

  **Result for Test 1:** **Asymmetrical Failure.** We have a clean case where Inference works without Comparison, but no clean case where Comparison works without Inference. The reductionist absorbs the unique features of *Upamāna* by expanding the definition of Inference to cover any mediated cognition involving a "mark" (*liṅga*). The double dissociation fails because the reductionist denies the possibility of Case A.

  ### Test 2: *Śabda* (Testimony) vs. *Anumāna* (Inference)

  **The Goal:** Isolate knowledge gained via linguistic comprehension from knowledge gained via reasoning.

  **Case A: *Śabda* Operative, *Anumāna* Inoperative**
  *   **Scenario:** A child hears a trusted parent say, "Fire burns," and accepts it.
  *   **Argument for Dissociation:** Mīmāṃsā argues that comprehension of meaning is immediate (*autpattika*). The child does not (and cannot) run an inference: "My parent is reliable; therefore, this statement is true." The knowledge arises directly from the words. If *Anumāna* were required, language acquisition would be impossible for those lacking the logical capacity to assess speaker reliability.
  *   **Reductionist Counter:** The Buddhist (e.g., Dharmakīrti) argues that all linguistic understanding is inference. To understand "Fire burns" is to infer the speaker's intention. Even if not conscious, the cognitive mechanism is one of interpreting signs. The "immediacy" is merely speed, not structural distinctness.
  *   **Verdict:** **Fails due to granularity.** The dispute hinges on whether "sub-conscious processing of signs" counts as *Anumāna*. The reductionist says yes; the Mīmāṃsaka says no, that is the specific function of *Śabda*. To assert Case A is to presuppose that linguistic comprehension is *sui generis*, which is the point in question.

  **Case B: *Anumāna* Operative, *Śabda* Inoperative**
  *   **Scenario:** Inferring fire from smoke without anyone telling you.
  *   **Verdict:** **Succeeds.** Inference clearly operates without testimony.

  **Result for Test 2:** **Asymmetrical Failure.** Like Test 1, we cannot isolate a case where Testimony works while Inference is *provably* absent, because the reductionist defines Inference broadly enough to encompass sign-interpretation.

  ### Diagnosis of the Hypothesis

  Your hypothesis that this is a "taxonomic dispute with no substantive content" is **partially correct but underestimates the metaphysical stakes.**

  The double dissociation test fails not because the sources are the same, but because the term *Anumāna* (Inference) functions differently for the two camps:
  1.  **For Reductionists (Buddhists):** *Anumāna* is a functional category: "Any knowledge mediated by a reason/mark."
  2.  **For Pluralists (Nyāya/Mīmāṃsā):** *Anumāna* is a structural category: "Knowledge mediated specifically by *vyāpti* (invariable pervasion) between universals."

  The "smuggling" identified in the tests above reveals that the disagreement is not about the *facts of the case* (everyone agrees the child learns, everyone agrees the traveler identifies the *gavaya*). The disagreement is about **ontological commitment**.

  *   **Buddhists (Nominalists):** Deny real universals (*sāmānya*). Therefore, *vyāpti* is a mental construction. Since *Upamāna* and *Śabda* also rely on mental constructions (similarity, word-power), they are all collapsed into the single category of "conceptual construction" (*kalpanā*), which falls under Perception (for particulars) or Inference (for concepts).
  *   **Nyāya/Mīmāṃsā (Realists):** Affirm real universals and real relations (*śakti*). *Upamāna* tracks a real relation of similarity. *Śabda* tracks a real relation between word and object. These are ontologically distinct from the causal relation tracked by Inference.

  ### What Counts as Progress?

  You asked to identify what would constitute progress. Based on the failure of the double dissociation test, here is the evaluation of your proposed options:

  1.  **A Discriminating Case:** **Unlikely.** As shown above, any empirical case can be redescribed by the reductionist to fit their taxonomy. There is no "view from nowhere" to describe the case without using epistemic terms that already favor one side.
  2.  **A Criterion of Individuation Both Camps Could Accept:** **Impossible.** The camps disagree on the fundamental nature of cognition (*jñāna*). One sees it as a causal chain (Buddhist), the other as a revelation of reality (*yathārtha*). They cannot agree on a neutral criterion because they disagree on what knowledge *is*.
  3.  **Evidence that the Count is Downstream of Metaphysical Commitments:** **This is the viable path.** Progress lies in demonstrating that the *pramāṇa* count is a proxy for ontology.
      *   If you deny universals, you *must* reduce *Upamāna* to Perception/Inference.
      *   If you affirm the intrinsic validity of language (*svataḥ prāmāṇya*), you *must* accept *Śabda*.
      *   **Progress Condition:** The debate moves forward only when participants explicitly link their *pramāṇa* count to their ontology of relations. The question "How many *pramāṇas*?" should be rephrased as "How many *sui generis* relations exist between mind and world?"
  4.  **Demonstration that the Question is Ill-Posed:** **Also viable.** One could argue (as some modern analysts do) that *pramāṇa* conflates *causal origin* (psychology) with *justificatory status* (epistemology).
      *   If *pramāṇa* means "cause of knowledge," then there are infinite *pramāṇas* (light, eyes, attention, etc.).
      *   If *pramāṇa* means "type of justification," then the count depends on how many irreducible justificatory structures exist.
      *   **Progress Condition:** Showing that the traditional debate conflates these two, and separating them might dissolve the numerical disagreement (e.g., agreeing on the psychology while disagreeing on the justification).

  ### Conclusion

  Your hypothesis holds: the parties agree on the phenomenology (the "facts of the case") but disagree on the taxonomy. However, the double dissociation test reveals that this is not a harmless difference in "resolution." It is a **structural incompatibility**.

  The reductionist's "Inference" is a functional bucket; the pluralist's "Inference" is one specific tool in a toolkit. You cannot build a double dissociation because the reductionist's bucket is designed to catch whatever the pluralist's toolkit drops.

  **Progress** will not come from finding a new empirical case (Test 1 & 2 failed). It will come from **Option 3**: acknowledging that the *pramāṇa* count is a metaphysical claim disguised as an epistemological one. The number of *pramāṇas* is exactly the number of irreducible relations the philosopher is willing to posit between language, mind, and reality. To argue for six *pramāṇas* is to argue for a richly populated ontology; to argue for two is to argue for ontological parsimony. The debate is substantive, but not in the way the participants often claim (as a dispute about how we know); it is a dispute about what there is to know.
