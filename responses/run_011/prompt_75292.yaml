      *   *Nuance:* In the *Śabda* case, the Mīmāṃsā argument is strong: we understand meaning *before* we judge reliability. If inference were required, we'd need to verify the speaker *before* understanding, which isn't how language works. This is a potential "Case A."
      *   *Counter-Nuance:* The Buddhist replies that the *capacity* to understand implies a prior inductive inference about language conventions.
      *   *Key Insight:* The Double Dissociation fails because "Inference" (*Anumāna*) in Indian logic is a catch-all for "mediated knowledge." If *Upamāna* and *Śabda* are mediated, they are *Anumāna* by definition for the reductionist. To succeed, one must prove *immediacy*. But *Upamāna* and *Śabda* feel mediated (by similarity, by words).
