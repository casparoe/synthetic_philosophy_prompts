              *   *Reductionist Counter:* You inferred: "Whatever resembles a cow in this specific way is called 'gavaya'." This relies on a *vyāpti* (pervasion) derived from the testimony.
              *   *Problem:* To prove *Anumāna* fails, we must show no universal premise is being used. But the reductionist argues the premise is *constituted* by the testimony + similarity.
