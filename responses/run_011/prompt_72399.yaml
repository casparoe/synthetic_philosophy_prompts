answer: |-
  Here is the breakdown of the philosophy operating inside the machinery of the state apology.

  ### 1. Who is the "we"?
  The practice requires the state to be a **corporate person** with metaphysical continuity. It cannot get by on a weaker chain of inherited obligation. If the obligation were merely inherited by individuals (like a family debt), the language would be "we acknowledge the debts of our fathers." Instead, the language is "we apologize." This asserts that the State is a single agent that persists through time, distinct from the sum of its citizens or officials.

  The legislature gains **narrative ownership**. By saying "we," the current regime claims authority over the past. It integrates the atrocity into the state's own biography rather than treating it as an external event that happened *to* the state. If they said "our predecessors did something monstrous," they would be severing the link between the current regime and the past one, which undermines the legitimacy of the current state's claim to represent the nation's history. The "we" binds the present institution to the past institution, stabilizing the state's identity even while condemning its history.

  ### 2. Fault without a faulty agent
  The practice separates **moral authorship** from **institutional answerability**. In ordinary life, these are fused: if I break it, I fix it. In state apologies, the current legislators are not the authors, but they are the custodians of the entity that is answerable.

  This does not assume citizenship carries *fault* (guilt); it assumes citizenship carries *liability*. This is why it holds up for immigrants or descendants of victims. They are not accepting blame for the act; they are accepting membership in the political body that bears the stain. The apology is not an admission of personal sin by the citizenry, but an admission of institutional defect. The "fault" lies in the continuity of the structure, not the biology of the members. If citizenship carried actual fault, naturalized citizens would be morally contaminated by joining, which is incoherent. Instead, they join a community that has acknowledged a specific moral deficit in its own foundation.

  ### 3. The remorse problem
  The practice is tacitly committed to a **dispositional account of sincerity**, not a psychological one. A state has no limbic system; it cannot feel shame. Therefore, sincerity is measured entirely by **commitment to future norms**.

  An apology is sincere if and only if the state undertakes to alter its behavior, commemorate the event, or refrain from repetition. This explains the fury over insincere apologies: the anger isn't because politicians aren't crying; it's because the *forward-looking commitment* is visibly absent. If a government apologizes for residential schools while simultaneously underfunding indigenous education, the apology is "hollow" not because they lack emotion, but because they are breaching the performative promise inherent in the speech act. The emotion is irrelevant; the policy shift is the metric of truth.

  ### 4. The addressee
  To survive the non-identity problem (the fact that descendants might not exist had the wrong not occurred), the practice must rely on a **status-based theory of harm**, not a welfare-based one.

  If harm is defined as "being worse off than you would otherwise be," the apology collapses, because many descendants owe their existence to the historical conditions created by the wrong. But if harm is defined as **violated standing** or **broken relation**, the harm persists across generations. The wrong was an attack on the group's moral status, and that status remains tarnished until acknowledged.

  Consequently, descendants accept the apology not as individuals who were hurt, but as **trustees of the group's standing**. This requires groups to be the kind of thing that can be wronged (moral patients) and can forgive (moral agents). The practice assumes that the community survives the death of its individual members. You cannot accept an apology on behalf of a dead ancestor as an individual; you can only accept it as a representative of the continuing community that was insulted.

  ### 5. The compensation gap
  The resolution is not empty ritual; it is **symbolic repair** distinct from **material restitution**. The lawyers fight over every verb because, in the absence of money, **words are the currency**.

  If the goal were material repair, the document would be a bill for damages. Since the goal is normative repair, the document is a correction of the public record. The state is admitting that its previous legal or moral framework was invalid. The lawyers insist on "no liability" clauses because they are protecting the treasury from *material* claims, but they allow the apology because it settles the *moral* account.

  The practice reconciles this by treating the apology as the **final settlement of moral debt**, explicitly decoupled from financial debt. It says: "We owe you the truth and the acknowledgment of your standing, but we do not owe you reparations." It is coherent only if you accept that moral injury and material loss are separate ledgers. The fury arises when victims view the ledgers as linked, while the state insists they are separate.

  ### 6. Contrast the refusal
  The **refuse-because-innocent** stance is more philosophically coherent under a theory of **methodological individualism** (only individuals act, only individuals bear guilt). However, it is politically destabilizing because it implies the current state has no connection to its own history.

  The **apologize-without-paying** stance is more coherent under a theory of **corporate personhood**. It allows the state to maintain continuity while purging its moral record.

  A state can do both without contradiction if it distinguishes between **regime continuity** and **regime discontinuity**. It can apologize for Wrong A (where it claims institutional continuity, e.g., slavery) and refuse Wrong B (where it claims the prior regime was a different legal entity, e.g., actions of a deposed monarchy or occupation force). The contradiction is only apparent; the underlying principle is selective identification. The state chooses to identify with the past when it suits nation-building and disidentify when it suits fiscal protection.

  ***

  ### Requirements, Comforts, and Underdetermination

  **What the practice strictly requires:**
  1.  **Institutional Continuity:** A claim that the current body is the same agent as the past body.
  2.  **Speech Act Authority:** A designated body with the power to speak for the whole (legislature/head of state).
  3.  **Normative Shift:** An explicit statement that the past act violates current norms (not just "we regret," but "it was wrong").

  **What merely fits comfortably (but isn't required):**
  1.  **National Healing:** The apology can be issued even if the victim group rejects it or remains angry.
  2.  **Uniform Guilt:** It does not require all citizens to feel bad, only the institution to speak.
  3.  **Closure:** It does not actually have to end the controversy; it often reignites it.

  **Where it is underdetermined:**
  The text of a resolution looks identical under two incompatible theories:
  *   **Theory A (Mystical Corporate Personhood):** The State is a real entity that transcends time and literally committed the act.
  *   **Theory B (Pragmatic Social Contract):** The State is pretending to be continuous to maintain social stability and legitimacy.

  Both theories produce the exact same "We apologize." The text does not reveal whether the legislators believe they *are* the perpetrators or merely *accepting the bill* for them. This ambiguity is a feature, not a bug; it allows citizens to interpret the apology according to their own metaphysical comfort level.

  ***

  ### The Swap: Causal Contribution and Inherited Benefit

  If you swapped the current theory (Identity over Time) for a theory where responsibility tracks **causal contribution and inherited benefit**, the documents and delivery would change concretely in three ways:

  1.  **Shift from "We" to "The Beneficiaries":**
      *   *Current:* "We, the Parliament, apologize for..."
      *   *New:* "The State acknowledges that current citizens hold assets and privileges derived from..."
      *   *Change:* The subject of the sentence shifts from the institution to the population that gained. The apology becomes an audit of unjust enrichment rather than a statement of sorrow.

  2.  **Removal of Liability Waivers:**
      *   *Current:* "This resolution creates no legal liability."
      *   *New:* "This resolution establishes the basis for restitution claims."
      *   *Change:* If responsibility is based on benefit, then holding the benefit creates the debt. The lawyers would not fight to block liability; they would draft the mechanism for calculating the return of that benefit. The "sorry" becomes secondary to the "payback."

  3.  **Specific Addressees based on Causality:**
      *   *Current:* Apologies go to broad ethnic or cultural groups (e.g., "Indigenous Peoples").
      *   *New:* Apologies (and reparations) would target specific lineages or communities where the causal chain of harm and benefit can be empirically traced.
      *   *Change:* The universal "we apologize to you" becomes a targeted "those who gained owe those who lost." This would likely fracture the broad coalitions that current apologies try to soothe, turning the document from a unifying ritual into a forensic accounting statement.

  In short, the current practice is a **theological act** (confession of sin by a continuing soul). The alternative is a **legal act** (restitution of ill-gotten gains). The current draft exists specifically to avoid the implications of the alternative.
