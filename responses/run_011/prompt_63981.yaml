answer: |-
  Here is a principle that captures your intuitions, followed by the necessary adjustment to your verdicts, the application to your brother-in-law, and the resolution of the regret asymmetry.

  ### The Principle: Weighted Credibility

  **"Grant credence to testimony in proportion to the claim's antecedent plausibility and the source's specific competence, discounted by the source's incentive to distort."**

  This principle relies on three variables:
  1.  **Prior Plausibility:** How well does the claim fit with what you already know about the world? (e.g., trains have platforms vs. monsters exist).
  2.  **Specific Competence:** Does this person have expertise *regarding this specific claim*? (e.g., doctor on biopsies vs. uncle on moon landings).
  3.  **Incentive to Distort:** Does the speaker gain something if you believe them? (e.g., plumber's profit vs. scientist's reputation).

  ### How It Delivers Your Verdicts

  *   **Stranger/Train:** High Plausibility (trains use platforms) + Medium Competence (he can read a board) + No Incentive = **Believe.**
  *   **Stranger/Supplement:** Low Plausibility (miracle cures) + No Competence + Unknown Incentive = **Don't Believe.**
  *   **Doctor:** High Plausibility (labs exist) + High Competence + Low Incentive (Hippocratic oath/reputation) = **Believe.**
  *   **Uncle:** Near-Zero Plausibility (conspiracy) + Low Specific Competence (engines $\neq$ aerospace history) + No Incentive = **Don't Believe.** (This solves your problem with your old rule: the "reason not to" is the *claim*, not the *person*.)
  *   **Kid/Dog:** High Plausibility + Medium Competence (kids see concrete things) + No Incentive = **Believe.**
  *   **Kid/Monster:** Zero Plausibility = **Don't Believe.**
  *   **Plumber:** Medium Plausibility + High Competence + **High Incentive** (profit) = **Half Believe.**
  *   **Climate Scientists:** High Plausibility + High Competence + Low Incentive (consensus/reputation) = **Believe.**
  *   **Friend (Gist vs. Verbatim):** High Competence on *experience* (Gist) + Low Competence on *memory* (Verbatim) = **Split Verdict.**

  ### The Verdict You Must Give Up

  The principle works for all your cases, but it exposes one inconsistency in your language: **"Believe Completely."**

  You say you believe the doctor "completely" and climate scientists "fully," but you only "half believe" the plumber. Mathematically, "complete" belief means assigning a probability of 100%. But you know doctors make mistakes and labs mix up samples. If you truly believed *completely*, you would never get a second opinion, yet you might.

  **The Adjustment:** You should give up the binary switch of "Believe/Don't Believe" and the notion of "Complete" belief. Adopt **graded credence**.
  *   **Doctor/Climate:** Very High Confidence (95%+).
  *   **Train/Stranger:** High Confidence (80%+).
  *   **Plumber:** Moderate Confidence (50%).
  *   **Uncle/Monster:** Near-Zero Confidence.

  Your intuition is already doing this (hence "half believe"), but your language ("believe completely") fights it. Accepting that *all* testimony is probabilistic makes the rule simpler, not more complicated.

  ### The Brother-in-Law Case

  **Verdict:** Believe the **sensation**, discount the **diagnosis**.

  **Why:** Apply the three variables:
  1.  **Prior Plausibility:** That he is feeling *pain* is highly plausible. That he is having a *heart attack* is less plausible (statistically).
  2.  **Specific Competence:** He has **perfect competence** on his own subjective sensations (nobody knows his pain better than him). He has **zero competence** on cardiology (he is a hypochondriac, not a doctor).
  3.  **Incentive to Distort:** He is not lying (you said he's not a liar), but he has a **psychological bias**. His "incentive" is anxiety-driven; he is incentivized to interpret ambiguity as catastrophe.

  **Action:** You treat him differently than your sister not because you think he is lying, but because his **Specific Competence** regarding the *implication* of the pain is compromised by his condition. You validate the pain ("I believe you are hurting") without validating the catastrophe ("We need to call 911"). With your sister, her baseline anxiety is lower, so the probability that "chest pain" = "medical emergency" is higher.

  ### The Regret Asymmetry (Coworker vs. Advisor)

  **Verdict:** Neither feeling is a mistake. They are governed by a different principle.

  Your *Weighted Credibility* principle tells you what to **believe**. It does not tell you what to **do** with that belief. The regret you feel is governed by a principle of **Pragmatic Responsibility**:

  **"The duty to verify is proportional to the stakes of being wrong."**

  *   **Coworker:** The stakes were an afternoon. The cost of verification (interrupting workflow, asking for an email confirmation) might have been socially or temporally higher than the risk. You were epistemically reasonable to trust, and pragmatically reasonable not to verify. **Result: No Regret.**
  *   **Financial Advisor:** The stakes were real cash. Even if the advisor was credible, the *cost of error* was high enough to trigger a duty of care. You had the capacity to verify (read the prospectus, check fees) and the stakes demanded it. **Result: Regret.**

  You feel regret in the second case not because your *belief* was irrational (the advisor might have been trustworthy), but because your *risk management* was negligent. The principle of belief doesn't need to explain this; it's a separate calculation about how much evidence you are required to gather before acting.
