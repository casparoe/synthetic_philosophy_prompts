  **CIVITAS MORAL LIQUIDITY PARTNERS**
  **CLIENT PROSPECTUS & DISCLOSURE STATEMENT (SERIES CM-7)**

  **1. ELIGIBLE INSTRUMENT CLASSES**
  Civitas Moral Liquidity Partners (CMLP) facilitates the securitization of moral remainders arising from publicly mandated conduct. Clients may purchase offsets to discharge residual wrongness associated with acts that are politically justified but ethically non-neutral. Eligible classes include:
  *   **Class A (Deceptive Necessity):** Falsehoods disseminated to maintain public order or strategic ambiguity.
  *   **Class B (Fiduciary Breach):** Betrayals of confidential confidences required by higher state interest.
  *   **Class C (Kinetic Authorization):** Orders resulting in loss of life or bodily integrity deemed requisite for the greater good.
  *Note: Offsets discharge the agent's moral liability, not the wrongful nature of the act itself. The act remains wrongful; the agent is rendered liquid.*

  **2. PRICING METHODOLOGY & TARIFF**
  Valuation is determined by the Irreversibility Index (II) and Public Visibility Coefficient (PVC). Credits are denominated in Standard Moral Units (SMUs). Higher trading values reflect the depth of the moral remainder, not the political utility of the act.

  | Instrument Class | Description | Base Rate (SMUs) | Volatility Adjustment |
  | :--- | :--- | :--- | :--- |
  | **A-1** | Minor Electorate Deception | 15.00 | Low |
  | **B-3** | Betrayal of Close Associate | 45.50 | Medium |
  | **C-5** | Collateral Damage Authorization | 120.00 | High |
  | **C-9** | Direct Targeted Elimination | 250.00 | Critical |

  *Table 2.1: Q3 Indicative Rates. Rates fluctuate based on regulatory scrutiny by the Office of Ethical Compliance (OEC).*

  **3. SUPPLY & ORIGINATION**
  Credits are originated by Verified Ethical Surplus Generators (VESGs). Surplus clean hands are generated primarily by private sector actors who refrain from public decision-making, thereby accumulating unused moral capital through abstention. Monastic orders and non-voting civil servants also contribute to the liquidity pool. CMLP verifies the purity of supply via third-party audit to ensure no commingling with private vice.

  **4. SETTLEMENT & REMORSE TRANSFER**
  Upon execution, the moral remainder is transferred from the Client's ledger to the CMLP custody account. Clients may elect **Physical Settlement**, wherein the agent retains the psychological burden of remorse while being ethically cleared, or **Cash Settlement**, wherein the emotional burden is outsourced to professional proxies (Therapeutic Contrition Officers). Cash Settlement incurs a 15% premium. The OEC recommends Physical Settlement for optimal reputational hygiene, though both satisfy regulatory requirements for clean hands.

  **5. FORWARD CONTRACTS & PRE-AUTHORIZATION**
  CMLP offers Forward Moral Options (FMOs), allowing Clients to purchase offsets prior to the execution of a contemplated wrongful act. FMOs lock in current rates against future regulatory tightening or public outcry. Clients may secure coverage for anticipated Class C events during periods of geopolitical instability.
  *Disclosure: Purchasing an offset prior to the act does not constitute premeditation under current statute, provided the act remains politically necessary at the time of execution. However, holding an FMO may alter the Client's decision-making calculus, potentially transforming a tragic necessity into a budgeted line item. Clients assume all risk regarding the collapse of moral distinction resulting from pre-emptive clearance.*

  **6. EXCLUSIONS & LIMITATIONS**
  No offset may discharge wrongs committed for private gain, sadistic pleasure, or partisan advantage unrelated to state necessity. CMLP guarantees liquidity only for dirty hands incurred in the public trust. Attempts to offset personal infidelity, tax evasion, or cruelty unrelated to official duty will result in immediate default and referral to the OEC. Furthermore, offsets do not guarantee electoral success, historical vindication, or the absence of subjective guilt post-settlement.

  **7. RISK FACTORS**
  Investors and Clients should note that moral markets are subject to sudden liquidity crises during regimes of heightened moral realism. There is no guarantee that a surplus of clean hands will exist during periods of universal complicity. By signing below, the Client acknowledges that while the ledger may be balanced, the soul remains a non-fungible asset.

