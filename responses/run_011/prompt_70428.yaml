answer: |-
  Perception is cognitively penetrated whenever a non-perceptual state alters the sensory phenomenology, provided the effect is not merely attentional selection.

  In your first problem pair, the 'non-perceptual state' clause does the work: by refusing to distinguish between beliefs and drives, it forces the hunger case into the same category as the heart card. In the second pair, the 'attentional selection' proviso does the work: it permits you to classify the seal as attention whilst classifying the dress as penetration, based on the stability of the phenomenological shift.

  Applying this principle yields the following verdicts. The Müller-Lyer and checkerboard cases remain not penetrated, as the illusion persists despite cognitive states. The radiologist and heart-shaped card cases remain penetrated, as expertise and concepts alter sensory phenomenology. The hunger case is overturned: if food looks vivid due to desire, that is penetration, not mere reporting bias. The ambiguous seal is reproduced as not penetrated, being a matter of selecting between stable alternatives. The dress, degraded recording, and expensive wine cases are all penetrated, as prior information alters the sensory experience itself. The inverting goggles case remains not penetrated, as no cognitive state is implicated.

  I recommend you abandon the hunger verdict. Maintaining that desire affects reporting but not seeing, whilst admitting concepts affect seeing, is theoretically unstable; both are top-down modulations of sensory processing. Your intuition here likely stems from a reluctance to admit motivational states into epistemology, but perceptual justification must account for how the world looks, not just why it looks that way.

  Consider this devised case: a trained musician hears a slightly detuned piano note as 'painfully sharp', whilst a novice hears it as merely 'odd'. My principle verdicts this penetrated: the concept of pitch alters the sensory phenomenology of the sound. The simplest rival—your original aptness clause— verdicts not penetrated: the musician's experience is epistemically apt given their expertise, whereas penetration implies inappropriateness. My principle captures the phenomenological difference; the rival conflates justification with experience.
