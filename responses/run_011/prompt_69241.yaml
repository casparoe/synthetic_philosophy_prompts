  ### Scenario Description

  The organism is a fictional salt-marsh weevil, *Curculio fictus*. Adults overwinter in a single panmictic population and colonize fallen seed pods of a legume in spring. Each pod serves as an isolated developmental chamber for a clutch of larvae. The baseline life cycle assumes females locate pods at random; consequently, the genetic relatedness among the roughly 12 larvae within a pod is no higher than that of the general population ($r \approx 0$). A mutant allele induces a "sealer" phenotype: sealer larvae cease feeding early to pack frass into the pod wall, sealing emergence holes. This behavior reduces the individual's energy reserves, resulting in a fecundity of 0.6 relative to the non-sealer baseline of 1.0. However, sealing drastically reduces parasitism by a wasp. Pod survival ($S$) is a linear function of the proportion of sealers ($\bar{z}$) within the pod: $S = 0.5 + 0.5\bar{z}$. A pod with no sealers has a 50% chance of surviving to adulthood; a pod composed entirely of sealers has a 100% chance.

  The variant life cycle alters only the colonization phase. In this scenario, females are philopatric or pods are colonized by budding from adjacent pods, ensuring that each pod contains the offspring of a single female. Consequently, pod-mates are full siblings ($r \approx 0.5$), and pods are genetically uniform (either all sealers or all non-sealers). All other parameters—clutch size, fecundity costs, and survival functions—remain identical. The seminar task is to determine the evolutionary trajectory of the sealer allele in both life cycles using multilevel selection arithmetic, specifically partitioning the change in allele frequency into within-group and between-group components.

  ### Population Dynamics and Arithmetic

  To ensure the arithmetic cleanly demonstrates the conflict between levels, we model a population of 100 pods with 12 larvae each (1,200 individuals total). We begin with an initial sealer allele frequency ($p$) of 0.5. Fitness ($W$) is the product of Pod Survival ($S$) and Individual Fecundity ($F$).

  **1. Baseline Variant (Random Assortment)**
  In the baseline, larvae are distributed randomly. While true binomial sampling creates slight variance between pods, for the purpose of isolating the *within-group* pressure, we model the expected outcome where every pod reflects the population mean ($\bar{z} = p$). This maximizes within-pod variance and minimizes between-pod variance.

  *   **Generation 0:** $p = 0.5$. Every pod has 6 sealers ($F=0.6$) and 6 non-sealers ($F=1.0$).
      *   Pod Survival ($S$): $0.5 + 0.5(0.5) = 0.75$.
      *   Sealer Fitness ($W_S$): $0.75 \times 0.6 = 0.45$.
      *   Non-Sealer Fitness ($W_N$): $0.75 \times 1.0 = 0.75$.
      *   Mean Fitness ($\bar{W}$): $0.5(0.45) + 0.5(0.75) = 0.60$.
      *   **Generation 1 Frequency ($p_1$):** $(0.5 \times 0.45) / 0.60 = 0.375$.
      *   **Decomposition:** The change is driven entirely by **Within-Group Selection**. Because all pods are identical, Between-Group covariance is zero. The sealer allele loses 33% of its frequency in one generation due to the individual fecundity cost.

  *   **Generation 1 to 2:** $p = 0.375$.
      *   Pod Survival ($S$): $0.5 + 0.5(0.375) = 0.6875$.
      *   Sealer Fitness ($W_S$): $0.6875 \times 0.6 = 0.4125$.
      *   Non-Sealer Fitness ($W_N$): $0.6875 \times 1.0 = 0.6875$.
      *   Mean Fitness ($\bar{W}$): $0.375(0.4125) + 0.625(0.6875) = 0.584$.
      *   **Generation 2 Frequency ($p_2$):** $(0.375 \times 0.4125) / 0.584 \approx 0.265$.
      *   **Verdict:** The allele is in rapid decline.

  **2. Kin-Structured Variant (Perfect Assortment)**
  In the variant, pods are genetically uniform. With $p=0.5$, 50 pods are All-Sealer and 50 pods are All-Non-Sealer. Within-pod variance is zero; all variance is between pods.

  *   **Generation 0:** $p = 0.5$.
      *   **Sealer Pods (50 pods):** $\bar{z}=1$. Survival $S=1.0$. Individual $F=0.6$. Fitness $W_S = 0.6$.
      *   **Non-Sealer Pods (50 pods):** $\bar{z}=0$. Survival $S=0.5$. Individual $F=1.0$. Fitness $W_N = 0.5$.
      *   Mean Fitness ($\bar{W}$): $0.5(0.6) + 0.5(0.5) = 0.55$.
      *   **Generation 1 Frequency ($p_1$):** $(0.5 \times 0.6) / 0.55 \approx 0.545$.
      *   **Decomposition:** The change is driven entirely by **Between-Group Selection**. Within-pod covariance is zero because there is no variation within pods. The sealer allele increases because sealer pods survive at double the rate of non-sealer pods, overwhelming the fecundity cost.

  *   **Generation 1 to 2:** $p = 0.545$.
      *   Population is now 54.5% Sealer Pods, 45.5% Non-Sealer Pods.
      *   Sealer Pod Fitness: $1.0 \times 0.6 = 0.6$.
      *   Non-Sealer Pod Fitness: $0.5 \times 1.0 = 0.5$.
      *   Mean Fitness ($\bar{W}$): $0.545(0.6) + 0.455(0.5) = 0.5545$.
      *   **Generation 2 Frequency ($p_2$):** $(0.545 \times 0.6) / 0.5545 \approx 0.589$.
      *   **Verdict:** The allele is spreading steadily.

  *(Note on Parameter Tuning: The raw material suggested a 60% fecundity and "substantial" survival increase. I specified the survival function as $S = 0.5 + 0.5\bar{z}$ to ensure the arithmetic yielded a decline in the baseline and spread in the variant. A weaker survival benefit would cause the trait to die in both; a stronger benefit would cause it to spread in both, obscuring the levels-of-selection conflict.)*

  ### Verdicts of the Three Perspectives

  **1. The Gene's-Eye View (Net Change)**
  *   **Baseline:** The gene "verdict" is negative. The net change in frequency ($\Delta p$) is negative in both generations. The gene is selected against.
  *   **Variant:** The gene "verdict" is positive. The net change is positive. The gene is selected for.
  *   **Interpretation:** The gene's fate is contingent on the population structure, not just its physiological effects.

  **2. The Organism Level (Within-Group Component)**
  *   **Baseline:** The verdict is strongly negative. Within every pod, non-sealers outcompete sealers (0.75 vs 0.45 fitness in Gen 0). The trait is individually altruistic and costly.
  *   **Variant:** The verdict is technically null (zero variance), but the *pressure* remains negative. If a single non-sealer mutant arose in a sealer pod, it would have fitness 1.0 vs 0.6 and invade. The organism-level incentive is always to defect.
  *   **Interpretation:** From the perspective of individual competition, the trait is maladaptive in both variants.

  **3. The Group Level (Between-Group Component)**
  *   **Baseline:** The verdict is null. Because pods are random mixes, there is no variance in pod composition, and thus no differential survival between pods to drive selection.
  *   **Variant:** The verdict is strongly positive. Sealer pods survive at 100%, non-sealer pods at 50%. The trait is group-adaptive.
  *   **Interpretation:** The trait is beneficial to the collective, but this benefit can only be realized as selection if groups vary in their composition.

  **Synthesis:** The trait is costly to organisms but beneficial to groups. In the Baseline, the Organism level dominates the Gene level verdict. In the Variant, the Group level dominates the Gene level verdict. The "Gene" verdict flips not because the biology of the weevil changed, but because the statistical distribution of variance shifted.

  ### Explanatory Feature and Removal Tests

  The single feature doing the explanatory work is **correlation (assortment)** between the genotype of the individual and the genotype of the group. In the Baseline, an individual's genotype predicts nothing about its pod-mates. In the Variant, an individual's genotype perfectly predicts its pod-mates. This correlation converts the group-level benefit into a fitness advantage for the allele.

  **Removal Test 1: Delete the Parasitoid**
  If the wasp is removed, pod survival becomes 1.0 regardless of sealing ($S=1$).
  *   **Baseline:** Sealer fitness = $1.0 \times 0.6 = 0.6$. Non-sealer = $1.0 \times 1.0 = 1.0$. Trait dies.
  *   **Variant:** Sealer pod fitness = 0.6. Non-sealer pod fitness = 1.0. Trait dies.
  *   **Result:** Without the group-level benefit (survival), the group selection term vanishes. The trait declines in both variants. This confirms the trait is not inherently "good"; it is only adaptive in the presence of the specific ecological pressure that creates group-level variance in survival.

  **Removal Test 2: Small Pods in Baseline**
  Keep the Baseline (random assortment) but reduce clutch size to 4 larvae ($N=4$).
  *   **Arithmetic:** In random assortment, between-pod variance is inversely proportional to $N$ ($\sigma^2_B \approx p(1-p)/N$). Reducing $N$ from 12 to 4 triples the between-pod variance.
  *   **Effect:** The Between-Group selection term increases threefold. However, the Within-Group term also intensifies slightly (less dilution of the defector).
  *   **Calculation:** With $N=4$, the "drift" between pods is higher. A pod might randomly get 3 sealers (Survival 0.875) vs 1 sealer (Survival 0.625).
  *   **Result:** The sealer allele declines *more slowly* than in the $N=12$ case, but it still declines. The individual cost (0.4) is too high relative to the survival benefit (0.5 max) to be sustained by the weak between-group variance generated by random sampling alone.
  *   **Conclusion:** Merely shrinking the group size in a panmictic population is insufficient to reverse the verdict; the correlation structure (Variant) is required, not just small group size.

  ### Interpretive Question: Categorical vs. Continuum

  **The Question:** Is the difference between the Baseline and Variant life cycles a categorical shift in the *unit of selection*, or is the Variant merely the Baseline pushed to the far end of a continuum of relatedness and group variance?

  **Case for Continuum:**
  Mathematically, the Price Equation applies to both scenarios identically: $\Delta p = Cov_B(W, Z) + E[Cov_W(w, z)]$. The Baseline is not "zero" group selection; it has low between-group variance due to binomial sampling. The Variant is not "zero" individual selection; it has latent individual cost. The difference is quantitative: the correlation coefficient $r$ moves from $\approx 1/N$ (Baseline) to $\approx 0.5$ (Variant). There is no threshold in the arithmetic where the physics of selection changes; there is only a point where the positive Between term exceeds the negative Within term. Thus, "group selection" is not a distinct mechanism, but simply the high-end tail of the same covariance distribution.

  **Case for Categorical:**
  Heuristically and causally, the two variants represent distinct evolutionary regimes. In the Baseline, the population structure actively *suppresses* group-level causation; the pods are mere developmental containers with no evolutionary agency. In the Variant, the pods function as replicators: they vary, they survive/die differentially, and they reproduce (via female offspring). The causal flow changes from "individuals within a environment" to "groups within a environment." The Baseline is a system where group selection is structurally impossible to sustain a costly trait; the Variant is a system where it is the dominant force. This qualitative shift in causal architecture justifies treating them as different units of selection.

  **Verdict Based on the Numbers:**
  The **Continuum** argument survives the arithmetic. The Price Equation decomposition shows no discontinuity. In the Baseline ($N=12$), the Between-Group term was small but conceptually present (or zero in the identical mix simplification). In the Small Pod test ($N=4$), we saw the Between-Group term grow quantitatively without a qualitative change in the model. The "switch" from decline to spread occurs when $Cov_B > |Cov_W|$. This is a threshold of *outcome*, not a threshold of *process*. The Variant is simply the Baseline with the correlation parameter tuned high enough to flip the sign of the net sum. To assert a categorical difference is to confuse the *result* of the calculation (spread vs. decline) with the *mechanism* of the calculation (covariance partitioning), which remains invariant across both cases.
