answer: |-
  **Scenario**
  A teaching hospital introduces "Safety Defaults" for residents: schedules automatically block shifts beyond 80 hours weekly, but residents can opt-out by digitally signing a "Voluntary Overtime Waiver." Alternatively, administration could simply hard-cap hours at 80 for everyone. Both options preserve pay and carry no legal penalty or firing risk. Under the nudge, opting out signals to administration that the specific resident prioritizes volume over safety, inviting performance scrutiny they would avoid under a flat cap. The opt-out is frictionless and costless on paper, but the act of declaring oneself an exception creates a professional stigma that the universal prohibition erases.

  **Analysis**
  The choice architect argues the nudge respects agency: residents *can* work if they choose. The autonomy critic counters that autonomy isn't just menu size; it's freedom from coercive signaling. By requiring an active declaration to deviate from the safety norm, the nudge makes the choice socially expensive. The standard at stake is **helping people by their own lights**. Residents genuinely want rest but fear looking uncommitted. The nudge fails this standard because it forces them to trade health for reputation. The prohibition succeeds by removing the reputational cost.

  The structural feature doing the work is the **visibility of deviation**. If you remove this—making the opt-out private—the case collapses back into a standard tradeoff where the nudge wins on flexibility. But where administrative transparency requires visible waivers, the nudge burdens autonomy more than the ban.

  The strongest reply from a defender is that people are sometimes *glad* to be required, since a requirement gives them cover against third parties (e.g., demanding attendings). Does this rescue the nudge? No, it rescues the *prohibition*. It concedes that sometimes true autonomy protection requires removing the choice entirely so the individual isn't the bottleneck. The nudge leaves the burden of resistance on the individual; the mandate absorbs it. Thus, in contexts where deviation carries stigma, a mild prohibition protects autonomy better than a visible opt-out.
