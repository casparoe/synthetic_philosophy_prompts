answer: |-
  This is a sophisticated exercise in demarcation. You are asking me to reverse-engineer an epistemology from a set of classified judgments. If I treat this as a logic puzzle, I risk missing the philosophical texture; if I treat it as pure philosophy, I risk ignoring the narrative constraints. I will attempt to hold both.

  Here is the brainstorming analysis of your historian's nine verdicts, followed by the judgment on the tenth case.

  ### 1. Brainstorming Candidate Rules

  To derive her operative principle, we must test various demarcation criteria against the nine verdicts to see which ones do the heavy lifting and which are merely incidental.

  **Rule A: Ontological Correctness (Is the claim true?)**
  *   *Work:* Fits Antikythera (True), Atlantis (False).
  *   *Fail:* Fails on the **Medieval Charter**. The claim was *false* (it was not a forgery), yet the verdict is "History, and a credit to the field." It also fails on the **Baghdad Battery** and **Voynich**, which are "Not Pseudohistory" despite having no confirmed positive reading.
  *   *Status:* **Rejected.** She does not judge by truth-value.

  **Rule B: Evidential Basis (Positive evidence vs. Argument from Ignorance)**
  *   *Work:* Explains **Ancient Aliens** ("ignorance treated as evidence") and **Atlantis** (no independent evidence). Fits **Antikythera** (artifact exists).
  *   *Fail:* Weak on **Fomenko**. Fomenko uses "real data," just rigged. It doesn't fully explain why **Voynich** is exempt; the Voynich text is currently "ignorance" (we don't know what it says), yet it is not pseudo.
  *   *Status:* **Partial.** Necessary, but not sufficient.

  **Rule C: Immunization against Falsification (The Popper/Lakatos Test)**
  *   *Work:* Strong on **Fomenko** ("every contradiction reabsorbed as further confirmation"). Strong on **Velikovsky** (ad hoc physics). Strong on **Atlantis** (re-inflated for 2,000 years despite no evidence).
  *   *Fail:* Doesn't distinguish **Voynich** from **Fomenko** on its own, unless paired with Rule B.
  *   *Status:* **Strong Candidate.** This seems to be her primary negative marker.

  **Rule D: Methodological Corrigibility (The Mertonian Norm)**
  *   *Work:* This is the only rule that explains the **Medieval Charter** verdict. The claim was wrong, but the *process* (submit to analysis, withdraw on negative result) was virtuous. It explains **Fomenko** (rigged method). It explains **Ancient Aliens** (insult to people = refusal to engage with anthropological data).
  *   *Fail:* Doesn't fully explain **Voynich** unless we accept that "unsolved" is a valid methodological state.
  *   *Status:* **Strong Candidate.** This is the positive marker.

  **Rule E: Paradigm Cost (Does it require the whole field to be wrong?)**
  *   *Work:* Explains **Velikovsky**, **Fomenko**, **Bosnian Pyramids**.
  *   *Fail:* Fails on the **Medieval Charter**. A successful forgery claim *would* have required specific historians to be wrong, yet it was "History." It fails on **Antikythera**, which radically changed our view of ancient technology, yet is "History."
  *   *Status:* **Rejected.** She is not a conservative; she accepts radical claims if the method is sound.

  **Rule F: Object-Reality (Is there a physical thing to study?)**
  *   *Work:* Explains **Voynich** and **Baghdad Battery** (objects exist) vs. **Atlantis** (no object).
  *   *Fail:* Doesn't explain why **Bosnian Pyramids** are pseudo (hills exist) or **Fomenko** (documents exist).
  *   *Status:* **Incidental.**

  ### 2. The Operative Rule

  Your historian is not a Positivist (she doesn't demand certainty) nor a Relativist (she doesn't accept all narratives). She is a **Methodological Fallibilist**.

  Her operative rule is: **Demarcation rests on Corrigibility, not Correctness.**
  A claim is "History" (or at least "Not Pseudohistory") if the proponent exposes the claim to risk, provides the means for independent testing, and *accepts the outcome of that testing*, even if it negates the claim. A claim is "Pseudohistory" if the proponent structures the inquiry so that the claim *cannot* be negated (immunization), or treats gaps in knowledge as positive proof (argument from ignorance).

  **Load-Bearing Verdicts:**
  1.  **The Medieval Charter:** This is the keystone. Without it, we might assume she only classifies *true* claims as History. This verdict proves she values the *retraction* more than the *discovery*.
  2.  **The Voynich Manuscript:** This is the counterweight. Without it, we might assume "Unproven = Pseudo." This proves that an *unsolved problem* is legitimate, provided the "crank readings" (immunized narratives) are separated from the object.
  3.  **Fomenko's New Chronology:** This defines the sin. It shows that "Real data" is not enough; the *method of handling contradiction* is the deciding factor.

  **Idle Verdicts:**
  *   **Atlantis** and **Ancient Aliens** are "free hits." Almost any reasonable rule would classify these as pseudohistory. They confirm the theory but do not constrain it.
  *   **Antikythera** is a control case for "Extraordinary claims with ordinary evidence."

  ### 3. Verdict on the New Case

  **The Case:** A sedimentologist claims earlier occupation via OSL/impact proxies. Data is open. Replication is mixed (2 confirm, 1 denies/disturbance). Lead author claims the field "systematically explains away outliers." Tenure is at stake.

  **Her Verdict:** **"Not Pseudohistory — A Contested Scientific Hypothesis."**

  **Reasoning:**
  She will distinguish this from Fomenko and Velikovsky based on the **Charter** precedent.
  1.  **Data Transparency:** Unlike Fomenko ("rigged method"), the raw data is released and replication is invited. This satisfies the *Corrigibility* condition.
  2.  **The "Systematic Bias" Claim:** This is the danger zone. In the hands of a pseudo-historian, claiming the field is "rigged" is an immunization strategy (Rule C). However, because the author has submitted to peer review and allowed replication, this claim functions as a *falsifiable hypothesis* about the field's sociology/stratigraphy, not a shield against testing.
  3.  **The Negative Replication:** The third colleague found "disturbance." In a pseudohistorical framework (Fomenko), this would be dismissed as "part of the conspiracy." In a historical framework (Charter), this is data to be addressed.
  4.  **The Tenure Stake:** She will ignore this. The Charter palaeographer likely had reputation at stake; the Aliens proponents have book sales at stake. The *epistemic* behavior matters, not the *sociological* pressure.

  **The Caveat:** She would add a warning. "This remains History only so long as the lead author treats the 'disturbance' finding as a data point to be tested, rather than an attack to be rebuffed. If she dismisses the third colleague's result without further stratigraphic analysis, she slides into Fomenko's territory."

  **Confidence:** High (85%). The only source of error is if the "impact proxies" are shown to be methodologically equivalent to "ignoring contradictions" (e.g., if impact proxies are known to be easily contaminated in that specific soil type and she knows it). But based *strictly* on the procedural description, it passes her test.

  ### 4. The Crucial Experiment (The Separating Case)

  To distinguish between the surviving rules (specifically **Corrigibility** vs. **Paradigm Cost**), you need a case where the *method* is perfect, but the *implication* is impossible.

  **The Case:**
  > A credentialed geochronologist publishes a peer-reviewed paper with open data showing a human artifact embedded in a Cretaceous dinosaur bed (100 million years too old). The dating method is standard and robust. Replication confirms the date. The field rejects it because it violates evolutionary chronology. The proponent does *not* claim a conspiracy. She simply says, "I don't know how it got there, but the date is solid," and continues to publish the data without modifying the claim or retreating, but also without offering a new theory to explain it.

  **Why this separates the rules:**
  *   **If she calls this Pseudohistory:** Her rule is actually **Paradigm Conservatism** (Rule E). She tolerates radical claims only if they fit within the *possible* bounds of the current paradigm (like Antikythera fitting within ancient engineering, not ancient time travel).
  *   **If she calls this History (Anomaly):** Her rule is truly **Methodological Corrigibility** (Rule D). She values the integrity of the measurement over the coherence of the theory.
  *   **If she calls this "Not Pseudohistory — An Unsolved Problem" (Voynich style):** She distinguishes between *claims* (which can be pseudo) and *observations* (which are just data).

  **My Prediction of Her Verdict:**
  Given the **Charter** case (where a false claim was credited), she will likely call this **History (Anomalous Data)**. She treats "History" as a discipline of inquiry, not a repository of facts. An anomaly that survives testing is a historical fact, even if it breaks the theory. The "Pseudohistory" would begin only if the proponent *invented* a story to explain it (e.g., "Time Travelers") that could not be tested.

  ### 5. A Note on the "Trap"

  You asked me to flag if this is a trap. There is a tension in your list between **Voynich/Battery** ("Not Pseudohistory") and **Atlantis/Aliens** ("Pseudohistory").
