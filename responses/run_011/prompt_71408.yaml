  *   Therefore, the list is **jointly explicable**. It is not a patchwork. It is a coherent philosophy of **Critical Realism**: The objects must be real (Voynich), the methods must be testable (Charter), and the conclusions must not be immunized against failure (Fomenko).

  The New Case sits precisely on the fault line between **Fomenko** (claiming the field is biased) and **Charter** (submitting to the field's testing). Her judgment will depend entirely on whether the "bias" claim is used as a *shield* or as a *research question*. Based on the "open data" detail, she will grant it the benefit of the doubt.
