  # JOINT STATEMENT ON GRADUAL NEURAL REPLACEMENT
  **Draft Version 1.0**
  **Parties:** [User Name] (Pro-Continuity) & [Collaborator Name] (Pro-Replacement)
  **Date:** October 26, 2023

  ## 1. SUBSTANTIVE AGREEMENTS
  We agree to the following claims as the baseline for our disagreement. These are not merely methodological concessions but substantive commitments regarding the case description and its implications.

  1.  **Functional Invariance:** Throughout the replacement process (Standard and Variants A/B/C), the subject's behavioral output, linguistic reports, and functional organization remain indistinguishable from a baseline biological human at all times *t*. There is no point at which the subject fails a Turing test or reports a disruption in cognitive capacity.
  2.  **Phenomenological Reporting:** During the process, the subject's first-person reports regarding their own consciousness (e.g., "I am still here," "I see red") remain constant. We agree that the *text* of the report does not change, even if we disagree on the *truth value* of that report in the late stages.
  3.  **No Global Interruption:** The protocol ensures there is no moment of global unconsciousness, anesthesia, or system-wide reset. The transition is strictly gradual and local.
  4.  **The Stakes are Not Lexical:** We agree that the dispute is not merely about the definition of the word "person" or "survival." If we were to stipulate that the end-stage entity is called "Person-B," we would still disagree on whether Person-B *is* the subject of the experiences had by the starting entity (Person-A), and whether Person-A's anticipation of future experience is satisfied by Person-B's existence.
  5.  **Substrate Neutrality (Conditional):** We agree that if consciousness were proven to be entirely substrate-independent (i.e., if biological tissue carried no unique causal power regarding phenomenology beyond its computational profile), the Pro-Replacement position would collapse. Conversely, we agree that if functional isomorphism were proven insufficient for consciousness (e.g., via a "fading qualia" argument that could be empirically verified), the Pro-Continuity position would collapse.
  6.  **Descriptive Stability:** Any theory of the case must be stable under redescription of the timing and granularity of the swap, provided the functional outcome is held constant. A theory that yields different results based solely on whether we describe the swap as "one neuron at a time" vs. "one mole of atoms at a time" is rejected by both parties as sorites-dependent.

  ## 2. DISAGREEMENTS TABLE

  | Topic | Pro-Continuity Formulation (User) | Pro-Replacement Formulation (Collaborator) | Type | Condition for Resolution |
  | :--- | :--- | :--- | :--- | :--- |
  | **The Locus of Identity** | Identity tracks the continuous, uninterrupted stream of first-person perspective. As long as the stream is not broken, the substrate carrying it is irrelevant. | Identity tracks the specific biological organism that originated the stream. A functional copy, even if continuous in behavior, is a successor, not the original. | Genuine (Metaphysical) | Demonstration that first-person perspective can exist independently of biological origin *or* demonstration that functional continuity can fail to preserve perspective. |
  | **Truth of Reports** | When the hybrid/final subject says "I am conscious," they are reporting on their current phenomenology accurately. There is no gap between access and phenomenology. | When the hybrid/final subject says "I am conscious," they may be executing a functional routine inherited from the original. The report tracks functional access, not necessarily intrinsic experience. | Genuine (Epistemic) | A method to measure phenomenology independently of functional report (e.g., a "qualia meter"). |
  | **The "Cut-Off" Point** | There is no cut-off point. Any claim that identity vanishes at a specific percentage of replacement implies a magical threshold incompatible with the gradual nature of the swap. | There is a cut-off point, but it may be indeterminate or vague. The original subject fades or ceases as the causal dependence on the biological brain is severed, even if the functional profile remains. | Genuine (Ontological) | A theory of vagueness that accommodates ontological cessation without behavioral markers. |
  | **Meaning of "Survival"** | Survival means having a future self that inherits your memories, character, and first-person perspective without interruption. | Survival means the biological continuation of the specific entity that is currently experiencing. Anything else is "what matters in survival," not survival itself. | Verbal / Conceptual | Agreement on whether "what matters" is sufficient to justify the label "survival" in a philosophical context. |

  ## 3. CRUXES AND PRE-REGISTERED PREDICTIONS

  We identify the following as the decisive points of contention. We record our predictions here to allow for retrospective evaluation should new evidence or arguments arise.

  **Crux 1: Substrate Dependence of Phenomenology**
  *   **The Issue:** Does the specific physical material (biological neuron vs. silicon) contribute to the *quality* or *existence* of experience, independent of its input/output profile?
  *   **Pro-Continuity Prediction:** If we replace 99% of the brain with silicon isomorphs, the subject will report no change in the *quality* of experience (e.g., the redness of red). Any claim of "fading qualia" is incoherent given functional preservation.
  *   **Pro-Replacement Prediction:** If we replace 99% of the brain, the subject may report "redness" functionally, but the intrinsic phenomenological intensity will have diminished or vanished. The subject becomes a "zombie" regarding the replaced sectors.
  *   **Settling Condition:** A theoretical proof that functional access *entails* phenomenology (Continuity wins) or that phenomenology requires specific biological causal powers (Replacement wins).

  **Crux 2: The Value of Continuity**
  *   **The Issue:** Is the *continuity of the process* sufficient for identity, or is the *origin of the process* necessary?
  *   **Pro-Continuity Prediction:** If we pause the replacement for 100 years and resume it, the subject after resumption is the same as the subject before the pause. The causal chain is unbroken.
  *   **Pro-Replacement Prediction:** If we pause the replacement, the subject at resumption is a new entity activated by the old template. The original subject's stream ended when the biological process was halted or sufficiently altered.
  *   **Settling Condition:** Intuition pump consensus on "Teleportation with Delay" cases mapped onto the replacement protocol.

  ## 4. ANALYSIS OF VARIANT PROTOCOLS

  We apply our respective views to three specific variants of the replacement protocol. We specify whether our verdicts on *survival* diverge or converge, and whether the variant tests a core crux or merely shifts the burden of argument.

  ### Variant A: The Archive
  *   **Protocol:** Every swapped-out biological neuron is kept alive in a nutrient bath, dormant but viable. At the end of the process, the full set of original neurons exists and could theoretically be reconnected.
  *   **Pro-Continuity Verdict:** **Subject Survives in Silicon.** The archive is irrelevant to the continuity of the active stream. The dormant neurons are merely tissue; the person is where the processing is happening.
  *   **Pro-Replacement Verdict:** **Subject Replaced by Silicon.** The active silicon system is a functional copy. The "original" subject is dormant in the bath (if reconnected, they wake up; if not, they are in suspended animation/dead). The silicon entity is a successor.
  *   **Verdict Alignment:** **Divergent.**
  *   **Crux Status:** **High.** This variant isolates the "Single Occupancy" constraint. If the archive neurons are reconnected and wake up claiming to be the original, Pro-Continuity must explain why there are now two candidates (or deny the archive wakes up as the same person). Pro-Replacement views this as a standard fission case confirming the silicon is a copy.

  ### Variant B: The Lag
  *   **Protocol:** The silicon replacements fire approximately 40 ms late relative to biological timing. However, compensatory delays are introduced in the remaining biological circuits so that whole-brain behavioral output and functional synchronization remain unchanged.
  *   **Pro-Continuity Verdict:** **Subject Survives.** Functional organization is preserved. The absolute timing relative to an external clock is irrelevant; only the internal causal relations matter.
  *   **Pro-Replacement Verdict:** **Subject Replaced (or Fades).** Temporal real-time processing is a substrate-dependent feature of consciousness. Compensating for the lag at the functional level does not preserve the *phenomenological* present. The subject is running on a delayed tape.
  *   **Verdict Alignment:** **Divergent.**
  *   **Crux Status:** **Critical.** This tests "Frame Invariance." Pro-Continuity argues that if the causal graph is isomorphic, the physics of the clock speed doesn't matter. Pro-Replacement argues that consciousness is a physical process bound by real-time constraints, not just abstract causal topology.

  ### Variant C: The Schedule
  *   **Protocol:** Replacement occurs either as (1) a spatially contiguous wave sweeping from brainstem to cortex, or (2) a "salt-and-pepper" order where every local circuit is 50% biological and 50% silicon throughout the process.
  *   **Pro-Continuity Verdict:** **Subject Survives (Both Schedules).** The order of replacement is irrelevant provided global functional integrity is maintained. There is no "center" of consciousness that the wave could preserve or the salt-and-pepper could disrupt.
  *   **Pro-Replacement Verdict:** **Subject Replaced (Salt-and-Pepper faster).** The Wave schedule may preserve local integration longer, potentially delaying the extinction of the subject. The Salt-and-Pepper schedule disrupts local binding mechanisms immediately, causing earlier cessation of the original subject despite functional compensation.
  *   **Verdict Alignment:** **Divergent on Mechanism, Convergent on End-State.** (Both agree the end-state is silicon, but disagree on *when* the original ceases during the process).
  *   **Crux Status:** **Medium.** This tests "Local vs. Global" integration. If Pro-Replacement is correct, the Salt-and-Pepper variant should yield reports of dissociation or fragmentation earlier than the Wave variant, even if functional output is compensated. Pro-Continuity predicts no difference in first-person reports between schedules.

  ## 5. DIAGNOSTIC NOTE ON TERMINOLOGY

  We acknowledge that a portion of our debate has been verbal rather than substantive. We identify the following areas where we have been arguing about words instead of the world:

  1.  **"Survival" vs. "What Matters":**
      *   **Diagnosis:** Pro-Continuity uses "Survival" to mean "The continuation of what matters psychologically." Pro-Replacement uses "Survival" to mean "The numerical identity of the biological organism."
      *   **Resolution:** We agree to distinguish *Identity Survival* (Collaborator's focus) from *Psychological Continuity* (User's focus). The substantive disagreement remains: Does Psychological Continuity *constitute* Identity, or is it merely a substitute for it?

  2.  **"Consciousness" vs. "Access":**
      *   **Diagnosis:** Pro-Continuity treats "Consciousness" as identical to "Functional Access to Information." Pro-Replacement treats "Consciousness" as an intrinsic quality that *generates* Access but is not identical to it.
      *   **Resolution:** We acknowledge that if "Consciousness" is defined functionally, Pro-Continuity is trivially true. If "Consciousness" is defined phenomenally/intrinsically, Pro-Replacement has the stronger burden of proof regarding substrate dependence. We are arguing over which definition maps to reality.

  3.  **"The Subject":**
      *   **Diagnosis:** Pro-Continuity refers to "The Subject" as the *center of narrative gravity* (Dennett-style). Pro-Replacement refers to "The Subject" as the *physical locus of experience*.
      *   **Resolution:** We accept that we are debating whether the "center of narrative gravity" is sufficient to anchor the "physical locus of experience" during substrate migration.

  ***

  **Signed,**

  _________________________ (Pro-Continuity)

  _________________________ (Pro-Replacement)
