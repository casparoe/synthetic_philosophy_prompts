  **Scenario**

  Two biologists assess a sterile, triploid shrub restricted to a single creek flat. Empirical consensus is absolute: 600 above-ground stems, each with a distinct root system, no physiological integration, one multilocus genotype. Somatic mutation load is negligible. There is one genet, 600 ramets. The species persists only vegetatively; *ex situ* copies exist.

  The Recovery Plan requires listing if "mature individuals" number fewer than 50. Biologist A enters "1." Biologist B enters "600."

  Apply the elimination test: Ban the term "individual." Biologist A asserts: "One genet exists." Biologist B asserts: "Six hundred physiologically independent ramets exist." Both accept the other's statement as true. There is no disagreement over facts, genetics, physiology, or mortality risks. Yet, the administrative outcome diverges. A's count triggers listing (1 < 50); B's count precludes it (600 > 50). Neither usage is botanically illegitimate; genets are evolutionary individuals, ramets are ecological individuals. The disagreement persists linguistically but vanishes ontologically, yet it dictates opposite conservation actions.

  ***

  **Analysis**

  **Carnapian Deflationist:** The dispute is verbal. "Individual" is a term within a linguistic framework. A adopts an evolutionary framework (genet); B adopts a physiological framework (ramet). Both are internally correct. The choice is pragmatic, not truth-apt.

  **Realist:** Biological individuality is mind-independent. Either the organism is the genetic unit or the physiological unit. One biologist describes reality; the other errs. The dispute is substantive ontology masked as terminology.

  **Faultlessness:** The disagreement is faultless relative to biological practice, which recognizes both units for different purposes.

  **The Feature:** The binary legislative threshold. It forces a crisp classification onto a multidimensional biological reality. This makes the verbal choice action-guiding.

  **Removal:** If no listing decision is pending, the dispute loses practical stakes. It reverts to theoretical taxonomy, where both counts are recorded without conflict.

  **Biologist Objections:** A argues: "Calling this verbal trivializes extinction risk. If the genet dies, the lineage ends. That is a substantive fact." B counters: "It ignores ecosystem function. 600 stems process carbon differently than one. That is a substantive fact." Both claim the choice of unit *is* the substantive biological claim, rejecting the deflationist separation of word and world.

  **Collapse:** Yes. Once they argue about the *purpose* of the legislation (genetic heritage vs. ecological presence), the dispute is no longer verbal. It becomes a substantive quarrel about policy goals and which precisification best serves the legislative intent. The verbal diagnosis holds only so long as the purpose remains unspecified.
