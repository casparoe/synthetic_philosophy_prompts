answer: |-
  To the Members of the Community Relations Commission, I recommend we advise the council to adopt both the formal apology and the two-million-dollar fund, provided we restructure the language of the apology to distinguish institutional liability from personal guilt and open the fund to current residents of the affected neighborhoods regardless of ancestry. This approach secures the moral clarity my colleagues demand without sacrificing the practical utility of the resources available, and it establishes a precedent that protects us from future paralysis over historical claims. We must vote to send this paired proposal to the council within the next two weeks, with the fund disbursed over a five-year period to ensure sustained investment rather than a one-time dispersal.

  I write this because I have listened closely to the concern that an apology from us is theater, and I believe that objection deserves more than a dismissive wave. It is true that none of us lit the matches in 1919, and it is dangerously confusing to suggest that we carry the same moral stain as the marshals who drove those families out. We need to speak clearly about the difference between criminal guilt and political responsibility. Criminal guilt belongs to the individual who committed the act, and that cannot be inherited because a person cannot be punished for a crime they did not commit. However, political responsibility belongs to the citizen who inherits the state, and unlike a human being, a city is a corporate person that does not die. The city that annexed the cleared land in 1919 is the same legal entity signing checks today, and it has enjoyed the tax revenue from that land for a century. When we apologize, we are not confessing to a sin we personally committed; we are acknowledging that the institution we serve holds assets gained through injustice and that we are now assuming the liability for that debt. An apology framed this way is not theater but a factual statement of continuity, and it can be entirely sincere because it binds us to repair what the institution broke.

  This distinction also resolves the tension between those who view the money as a payoff and those who view it as mere social welfare. If we distribute the fund without the apology, we treat the harm as a generic poverty issue, which ignores the specific wound inflicted on this community and risks appearing as hush money designed to buy silence rather than justice. If we offer the apology without the fund, we ask the victims' successors to accept words in place of the property their families lost, which is its own form of insult. By linking the two, we acknowledge that the city remains liable for the consequences of its past actions, but by opening the eligibility to current residents of those neighborhoods regardless of ancestry, we ensure the remedy serves the living community that still bears the scar of the expulsion. This satisfies the demand for material repair without requiring genealogical verification that might be impossible after four generations, and it ensures the money actually stabilizes the neighborhood rather than searching for heirs who may no longer exist.

  To prevent this from becoming an unmanageable precedent that halts every future budget cycle, I propose we adopt a standing rule for historical harm claims that the council can reuse. This rule should state that the city accepts political responsibility for historical injustices where the municipal corporation directly profited or expanded its assets through the harm, provided that the remedy focuses on institutional repair and current community benefit rather than individual punishment or cash payments to distant descendants. This standard allows us to say yes to claims where the city clearly holds the tainted asset, as it does with this annexed land, while giving us grounds to say no to claims where the link is diffuse or the city acted only as a regulator rather than a beneficiary. It transforms these moments from emotional eruptions into governed processes, allowing us to treat history with seriousness without surrendering our capacity to govern the present.

  We have six weeks before the council votes, but we should not wait until the deadline to show unity. If we circulate this opinion now, we can reconcile the three blocs by affirming that the apology is about the city's continuity, the fund is about the neighborhood's future, and the rule is about our own integrity going forward. I ask that you consider this path not as a compromise that dilutes our principles, but as a synthesis that makes them operable in the real world where we are tasked with serving both the memory of the dead and the needs of the living.
