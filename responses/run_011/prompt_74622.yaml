      *Wait, the User asked for the "Question I'm hoping nobody asks."* They guessed US tax exemption. I need to validate that but also check if there's a worse one. The "Positive Neutrality" mandate is actually more fundamental to the German listeners than the US tax code. But the US tax code destroys the *ranking*. I'll stick with the US Tax Exemption as the "Danger Question" because it directly undermines the "US lands closest to legitimate" claim using the user's *own* test (state decides which groups count).

      *Refining the Pre-emption:* Pre-empting the Welfare argument is crucial because Germans pride themselves on *Subsidiarität*. Pre-empting the US Tax Exemption is crucial because otherwise, the ranking looks ignorant.

