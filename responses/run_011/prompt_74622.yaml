      *   **Thesis:** The critical variable is state registration/enforcement of membership, not establishment or funding. Germany ranks worst (Church Tax + State Registry), England benign (Establishment but no registry), France mixed (No tax but state categorization + Alsace-Moselle), US best (despite common criticisms).
      *   **Constraint:** Do not lean on US case law. Use European/German vocabulary (*Weltanschauungsneutralität*, *Subsidiarität*, *Körperschaft des öffentlichen Rechts*, etc.).
      *   **Deliverable:** A prep sheet with ~8 objections (ranked by damage), specific replies (2 mins), concessions, weak points, advice on pre-emption, the crucial reply, and the "danger question."

  2.  **Deconstruct the Thesis & Identify Vulnerabilities:**
