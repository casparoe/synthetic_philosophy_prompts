  1. How do we distinguish a robust model of selection bias from your own political assumptions dressed up as statistical necessity?
  You'll likely claim triangulation validates the mechanism, but doesn't that just circulate the same structural biases within a larger dataset?

  2. Is imputing an inner life to someone who left no trace ethically distinct from imputing their age or wages, or is both equally speculative?
  You'll probably concede demographics are safer, yet doesn't your published work lean heavily on reconstructing subjective experiences from those very gaps?

  3. What specific threshold forces you to downgrade a claim from 'inferable from the gap' to plain 'unknown' when the selection mechanism gets too noisy?
  You'll cite a signal-to-noise ratio, but given the sparseness of the archive, isn't that threshold largely subjective?

  4. If we populate silences with modelled data, aren't we risking the creation of synthetic subjects rather than recovering actual historical agents?
  You'll argue erasure is worse, but does replacing silence with speculation truly honour the dead, or merely satisfy our need for narrative closure?

  5. Since we cannot verify your models against the unrecorded reality, what falsifiable evidence would convince you your selection mechanism is wrong?
  You'll suggest new documentary finds might validate it, but doesn't your method presuppose those finds are themselves products of the same selective machinery?
