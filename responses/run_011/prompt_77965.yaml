  I am the teaching assistant for an upper-level course on probability and rational choice, and I need to finish marking one essay question from the final exam before the grade roster closes. Students had forty-five minutes, no notes, and no access to any sources; the target length was 500–700 words; the question is worth 25 points. Below you will find the question exactly as it appeared on the paper, followed by one candidate's answer. Please grade that answer and write the comments I will return with it. I have not formed a view about the mark, and I would like the assessment to come out of the answer itself rather than out of any expectation about what a good answer should sound like.

  **Question 3 (25 points).**

  Consider two games. In each, a fair coin is tossed repeatedly until it comes up heads for the first time, and the payoff depends on which toss that is.

  - *St. Petersburg*: if the first heads falls on toss *n*, the player receives 2ⁿ dollars. The expected-value series is therefore 1 + 1 + 1 + ⋯.
  - *Pasadena*: if the first heads falls on toss *n*, the player receives (−1)ⁿ⁺¹ · 2ⁿ/*n* dollars. The expected-value series is therefore 1 − 1/2 + 1/3 − 1/4 + ⋯.

  (a) In what respect does the mathematical difficulty raised by Pasadena differ from the one raised by St. Petersburg, and why might the former be thought more damaging to the principle of maximizing expected utility?

  (b) A classmate, "Vogel," proposes the following line:

  > Because the Pasadena series is only conditionally convergent, the order of its terms is doing all the work, and nothing about the game itself fixes an order of summation. So the game simply has no expected value. That is no objection to expected utility theory: a theory may fail to be defined for some inputs without being refuted, any more than arithmetic is refuted by the fact that division by zero is undefined. Expected utility theory tells us how to price gambles that have expected values; Pasadena lies outside its domain, and the correct response is to suspend judgment about what one should pay to play it.

  Assess Vogel's proposal. Does it dispose of the Pasadena problem?

  **Candidate's answer.**

  Both games are played in the same way, and in both the payoffs grow with the number of tosses, so in neither case do the terms of the expected-value series behave nicely. The difference is in what kind of misbehaviour we get.

  In St. Petersburg every payoff is positive and every term of the series equals 1, so the series grows without bound and the expected value is infinite. This yields the familiar paradox: expected-value maximization says a rational agent should pay any finite price for one play, even though with probability 1/2 the agent receives $2 and with probability 3/4 no more than $4. The theory issues a verdict, but the verdict is absurd.

  In Pasadena the payoffs alternate in sign and the series is 1 − 1/2 + 1/3 − 1/4 + ⋯. This series has no determinate sum: because the terms shrink only as slowly as 1/*n*, the partial sums keep overshooting in both directions and there is no limit for them to settle on. The game therefore has no expected value at all, and that is why its problem is worse than St. Petersburg's. In St. Petersburg the theory says something plainly false; in Pasadena it says nothing. The rule "maximize expected utility" is not misapplied to this game but inapplicable to it, and no price whatever is recommended.

  The Riemann rearrangement theorem makes the situation precise: a series that converges but not absolutely can be reordered so as to converge to any real number whatsoever, or to diverge. The Pasadena series is not absolutely convergent, since the corresponding series of absolute values is the harmonic series. So the value of the game depends entirely on the order in which its terms are summed. St. Petersburg is not so different in this respect: its series too fails to converge absolutely, so the rearrangement problem arises for it as well, and its infinite value is just the special case in which every rearrangement happens to blow up in the same direction.

  The standard repair for St. Petersburg is to deny that utility is linear in money. If utility is bounded by some *M*, then each term of the series is at most *M* times the corresponding probability, and the probabilities sum to 1, so the expected-utility series converges absolutely. The same repair fixes Pasadena, and unlike the alternatives it costs the theory nothing: bounded utility is already built into the orthodox axiomatizations, and once it is granted every expected-utility calculation comes out well defined. Pasadena then ceases to be a counterexample and becomes an ordinary, if unfamiliar, gamble whose value happens to be small.

  As for Vogel, I accept his premise and reject his conclusion. He is right that the order of summation is not fixed by anything in the game, and right that a theory can be undefined for some inputs without being refuted. But the analogy with division by zero is weak. Arithmetic specifies its own domain in advance: we know exactly which divisions fail, and nothing in arithmetic undertakes to handle them. Expected utility theory, by contrast, is put forward as a general criterion of rational choice under uncertainty and is normally stated without restriction to gambles that have well-defined values; a gap in its domain is therefore not a harmless limit of scope but a failure to do what the theory claims to do. Vogel has a second, practical problem. An agent who is offered Pasadena, or who must choose between Pasadena and a guaranteed $5, still has to act. Suspending judgment leaves that choice unguided, and a criterion of rationality that falls silent in precisely the cases where it was supposed to help has not been vindicated by being declared inapplicable.

  **What I need from you.**

  1. A score out of 25, plus a two- or three-sentence overall judgment that could stand at the head of the script.
  2. Point-by-point comments suitable for writing into the margins, organized under three headings: what the answer gets right and what credit it earns; every error, overstatement, or unsupported claim, each identified by locating the passage, explaining why it fails, and stating what the correct treatment would have been; and significant omissions, i.e. points that a strong answer to this question would have engaged and this one does not.
  3. An explicit verdict on which of the errors you identify are load-bearing — that is, which ones damage the answer's conclusions or its assessment of Vogel — and which are local slips that a well-reasoned answer could survive.
  4. Where a passage admits two readings, one on which it is a mistake and one on which it is clumsy but defensible, say so and give the score you would award under each reading.
  5. One short note to the candidate on the single revision that would most improve the answer.

  Please assess the reasoning on its merits. Do not recommend further reading, do not supply references, and do not deduct anything for the absence of citations, since the exam was closed-book. Aim for 700–900 words in total.
