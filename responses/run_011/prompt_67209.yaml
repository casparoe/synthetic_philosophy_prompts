answer: |-
  # The Conversion Problem: Equality and Dependency in *Of Mice and Men*

  The tragedy of *Of Mice and Men* is often misread as a tragedy of fate. Lennie is too strong, Curley is too jealous, the world is too hard. But read through the lens of political philosophy—specifically the debate over "equality of what"—the novella transforms into a structural indictment. It is not merely that Lennie dies; it is that every mechanism available to sustain him fails.

  You are right to locate the horror not in the gunshot, but in the accounting that precedes it. The book forces a confrontation between three dominant theories of justice: welfare egalitarianism (equal happiness), resource egalitarianism (equal assets, à la Rawls and Dworkin), and the capabilities approach (equal freedom to function, à la Sen and Nussbaum). Steinbeck's verdict is severe. The novella demonstrates that resource egalitarianism is not just under-specified; it is functionally useless for those who cannot convert resources into agency. It suggests the capabilities approach gets closer but fails to account for the non-fungible nature of care. Ultimately, *Of Mice and Men* points toward a fourth, unsettling answer that liberal theory struggles to quantify: **Relational Sufficiency.** The book argues that for the dependent, equality is not about what you hold, but who holds you—and that is a good the state cannot distribute.

  ### The Failure of Resources

  George Milton attempts to be a resource egalitarian. From the opening scene by the Salinas River, George establishes a contract. He complains about the burden ("If I was alone I could live so easy"), but he structures their lives as a partnership. They share wages. They share the stake for the farm. In the eyes of Dworkin's auction, Lennie is endowed. He has a share of the capital, a claim on the future, and a job that pays the same as the other men.

  If justice were merely the distribution of primary goods, Lennie should be safe. But the ranch operates as a brutal market test of conversion factors. A resource is only as good as your ability to use it. When Lennie is given a job (a resource), he loses it because he lacks the capability to control his strength. When he is given a dream (a resource), he cannot sustain it because he lacks the cognitive foresight to navigate social danger.

  Steinbeck hangs this argument on the scene in Crooks's room. Crooks, the black stable buck, possesses resources the other men do not: a private room, books, a job that keeps him out of the fields. By Rawlsian standards, Crooks is relatively well-endowed compared to the itinerant workers. Yet, he is the most isolated man on the ranch. His resources cannot purchase dignity because the social structure prevents the conversion of those resources into status. When Curley's Wife enters and threatens him with lynching, his books offer no protection. His room is not a sanctuary; it is a cage. Steinbeck shows us that without the *power* to convert goods into functioning, the goods are meaningless. Resource egalitarianism assumes a rational agent who can manage a life plan. Lennie and Crooks prove that assumption false.

  ### The Capabilities Approach and the Price of Output

  So, does the capabilities approach save us? Sen and Nussbaum argue we should equalize what people can actually *do and be*. This seems to fit Lennie better. He needs more than money; he needs supervision, a soft environment, protection from his own strength. A capabilities framework would demand the ranch (or the state) provide "conversion factors" for Lennie—perhaps a lighter workload, a guardian, a tolerance for mistakes.

  But the ranch is a pure meritocracy of output. It prices human beings by their utility. This is where Candy's dog enters the text as the essential rehearsal for the finale. The dog is old, blind, and smells. It consumes resources without producing value. Carlson argues for the dog's death not out of malice, but out of economic logic: "He ain't no good to himself."

  Candy's regret is the regret of the resource egalitarian who realized too late that he should have valued capability over output. "I ought to of shot that dog myself," Candy says. He recognizes that surrendering the dog to the market logic of the ranch (Carlson's Luger) was a moral failure. But note: Candy doesn't argue the dog *should* be kept. He argues he should have been the executioner. The book resists the idea that the ranch *could* have supported the dog. The structure is too rigid.

  Apply this to Lennie. To support Lennie's capabilities, the ranch would have to absorb a loss. It would have to value Lennie's *being* over his *stirring barley.* In the Great Depression setting Steinbeck depicts, there is no surplus for that. The capabilities approach requires a state or an institution wealthy and benevolent enough to subsidize the "conversion costs" of the disabled. The ranch is neither. It is a machine that grinds down anything that slows the gear.

  ### The George Problem: The Non-Distributable Good

  Here we arrive at the crux of your argument. Even if we had a benevolent state, could it solve Lennie's problem? The text suggests the answer is no, because what Lennie lacks is not a general good, but a specific person.

  Nussbaum's list of central capabilities includes "Affiliation." She argues society must ensure citizens can live with and toward others. But she treats this as a general condition. Steinbeck shows us that for the vulnerable, affiliation must be *particular*. Lennie does not need *a* guardian; he needs *George*.

  Consider the ending. George does not turn Lennie in to the asylum (the institutional solution). He does not let Curley's mob have him (the market justice solution). He takes Lennie to the peaceful spot by the river, tells him the story of the rabbits one last time, and shoots him in the back of the head.

  This is the moment the book resists the political reading. If this were a treatise on social welfare, George would be a villain for privatizing the solution. He is bearing a burden that should be socialized. But Steinbeck writes the scene as an act of love. The "capability" Lennie requires is the specific knowledge George has of how to calm him. A state nurse would not know about the rabbits. A social worker would not know the weight of Lennie's hand.

  This reveals a blind spot in the capabilities approach. It assumes that if you provide the right environment, the individual can function. But Lennie cannot function alone, even in a perfect environment. He requires a dyad. His agency is not individual; it is shared. He and George operate as a single unit of survival. Political theory is built on the unit of the individual citizen. *Of Mice and Men* suggests that for the dependent, the unit of justice is the pair. You cannot distribute "George" across a population. You cannot legislate specific loyalty.

  ### Where the Book Resists the Theory

  We must be straight about where Steinbeck pushes back against this reading. He was not writing a policy brief. If the book were a pure indictment of resource inequality, the ending would be colder. It would be a systemic critique where George walks away, or Lennie is taken by the state.

  Instead, the ending is intimate. The tragedy is not just that society failed Lennie, but that *love* is insufficient to save him in a hostile world. George's care is private, unpaid, and exhausted. It is unsustainable. The book resists the idea that there *is* a clean theoretical solution. The "fourth answer" I propose is not a utopia; it is a diagnosis of a burden.

  Steinbeck acknowledges that the "George solution" works, but at a terrible cost to George. Throughout the book, George is tired. He is angry. He is trapped. The resource egalitarian says, "Give Lennie money." The capabilities theorist says, "Give Lennie support." Steinbeck says, "Lennie needs George, and George is dying inside."

  This is where the book transcends the philosophy. The philosophers ask how to make the system fair. Steinbeck asks what the fair system costs the human heart. The mercy killing is not just about Lennie; it is about George liberating himself from a dependency he cannot sustain. That is a dark truth that Rawls would prefer to ignore. Justice might require sacrifice, but *Of Mice and Men* asks if there is a limit to what one man can be asked to sacrifice for another.

  ### The Fourth Answer: Relational Sufficiency

  So, is there a fourth answer to "Equality of What?" that the book points toward? I argue it is **Relational Sufficiency**.

  Welfare, Resources, and Capabilities are all *distributive* models. They assume justice is about handing out slices of a pie (happiness, goods, freedoms). *Of Mice and Men* argues that for the vulnerable, justice is *constitutive*. It is about the web of relationships that hold a person together.

  Lennie is not unequal because he has less money. He is unequal because he exists outside the network of reciprocity. The ranch hands drink together, go to town together, and protect each other's wages. Lennie is tolerated, but he is not of the network. When he breaks the network (killing Curley's Wife), he is excised.

  Relational Sufficiency argues that a just society is not one where everyone has the same amount of X, but one where no one is so dependent that their survival relies on the private exhaustion of a single other person. It demands that the "George function" be socialized. Not by turning George into a state employee, but by creating a community where the burden of care is shared enough that no single relationship becomes a death trap for either party.

  The book defends this by showing the alternative. The alternative is the riverbank. It is a private paradise that can only exist for a moment before the mob arrives. The dream farm fails because it is an attempt to build a relational sanctuary in a resource economy. You cannot grow rabbits on a balance sheet.

  ### Conclusion

  *Of Mice and Men* refutes resource egalitarianism by showing that resources without conversion factors are cruel jokes. It complicates the capabilities approach by showing that some capabilities (specifically, safety for the disabled) require specific, non-fungible relationships that institutions cannot replicate.

  But the book's deepest insight is that we have no vocabulary for the cost of care. We talk about rights and goods. Steinbeck talks about the weight of a hand on a shoulder. The ending lands as love because, in the absence of a structure that values dependency, love is the only safety net left. But it is a net made of thread, and it breaks.

  If there is a political lesson here, it is not that we need to equalize resources. It is that we need to acknowledge that we are not all independent agents. Some of us are Lennie. Some of us are George. And a society that forces George to choose between his friend's life and his own soul is not a society that has solved the equality question. It is a society that has failed to value the bond that makes life livable. The dog's death was a calculation. Lennie's death is a tragedy. The difference between the two is the measure of our humanity, and Steinbeck leaves us with the terrifying suspicion that we are closer to the dog than we care to admit.
