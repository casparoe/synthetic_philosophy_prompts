          *   Critique: The Capabilities approach assumes institutions can be tuned. The book suggests the Great Depression (and perhaps human nature) makes institutional tuning impossible.

      *   **Section 3: The George Problem (The Non-Distributable Good):**
          *   This is the crux of the user's prompt.
          *   Lennie needs *George*, not just *a* guardian.
          *   Scene: The killing. George makes sure Lennie is happy (the rabbits) before shooting.
