prompt: |-
  I'm doing some informal advising for a foundation that wants to fund roughly four people for two years on the theory side of citizen assemblies, juries, and expert panels — basically everything that hangs off the Condorcet jury theorem. The catch is they're allergic to math-for-math's-sake. Every deliverable has to be something a panel organizer, a constitutional reformer, or a court administrator could actually use when making a design choice: how big the group should be, whether to let people talk before they vote, whether to weight votes by measured competence, whether to require a supermajority, whether to break the question into sub-questions and aggregate those instead. What they want from me is a defended research agenda, not a survey of the literature, and definitely not a reading list — I'm not going to be able to chase down citations and I'd rather you just reason it through.

  Here's the candidate pile, roughly as I've scribbled it. (1) The correlation problem: the theorem's headline result assumes votes are independent conditional on the state of the world, but real people talk, read the same newspapers, and get recruited from overlapping pools, so errors line up. How much correlated error can you swallow before majority accuracy stops climbing with size, and is there a non-asymptotic version a practitioner could actually plug numbers into? (2) Weighted voting: if you can estimate individual competence from past accuracy, does competence-weighted majority beat simple majority, or does the noise in your competence estimates eat the whole gain? (3) Deliberation: does structured discussion push error correlation up or down, and can that be modeled at all rather than just hand-waved at? (4) Beyond binary: what survives when there are more than two options, or when you aggregate rankings, or when you split a decision into premises and a conclusion? (5) Asymmetric error costs: for some decisions a false positive is way worse than a false negative, which is where supermajority and quorum thresholds come in — is there a principled way to set them from the cost ratio? (6) Strategy and preference falsification: what happens when voting isn't sincere, either from incentives or from social pressure? (7) The framing objection, which a friend of mine thinks is the real issue: the theorem presupposes there's a procedure-independent right answer, and for value questions rather than factual ones that presupposition may just be false, in which case the whole apparatus is being misapplied whenever assemblies decide policy rather than diagnose a problem.

  My own instinct — possibly wrong, tell me so — is that (1) is the crux and most of the others are downstream of it, since if you can't bound correlated error then the jury-size and weighting answers are all artifacts of an assumption nobody believes. But I can see the counterargument that (1) is intractable for a group of four in two years and (5) is the one with real near-term policy bite. So: rank these for this specific funder, defend the ranking explicitly in terms of how much other work depends on the answer, how tractable it is for people with formal training but not a full-time probability theorist, and how much it would change what an organizer does on Monday morning. Flag any that you think are overrated, any that are secretly the same question wearing two hats, and any important open question I've left off the pile entirely. Then tell me what would move things up or down — what result in the first year, or what failure to make progress, should make them abandon a line and reallocate. I'd rather have three well-argued priorities than seven hedged ones.
reasoning: |-
  Here's a thinking process that leads to the suggested research agenda:

  1.  **Analyze the Request:**
      *   **Client:** A foundation funding ~4 people for 2 years.
      *   **Topic:** Theory side of citizen assemblies, juries, expert panels (Condorcet Jury Theorem - CJT - adjacent).
      *   **Constraint:** "Allergic to math-for-math's-sake." Deliverables must be actionable for practitioners (organizers, reformers, administrators).
      *   **Goal:** A *defended research agenda* (ranking + justification), not a literature survey.
      *   **Input:** A list of 7 candidate research topics (Correlation, Weighted Voting, Deliberation, Beyond Binary, Asymmetric Costs, Strategy, Framing/Epistemology).
      *   **User's Instinct:** Topic (1) Correlation is the crux. Counter-argument: (1) is hard, (5) Asymmetric Costs has more policy bite.
      *   **Output Requirements:** Rank the topics, defend the ranking (dependency, tractability, practical impact), flag overrated/duplicate topics, identify missing questions, provide "kill/switch" criteria for the 2-year timeline. Limit to three well-argued priorities.

  2.  **Evaluate the Candidate Topics against Constraints:**
      *   *Constraint Check:* Must be usable by a panel organizer on "Monday morning."
      *   *(1) Correlation:* High theoretical importance (breaks CJT), but hard to quantify practically. Can we give a practitioner a "correlation budget"?
      *   *(2) Weighted Voting:* High practical appeal (epistocracy-lite), but data-hungry (need past accuracy). Risk of noise eating gains.
      *   *(3) Deliberation:* Crucial for assemblies (they *always* deliberate), but modeling social dynamics is messy. Hard to make actionable rules.
      *   *(4) Beyond Binary:* Very relevant (policy is rarely yes/no). Doctrinal paradox/logical aggregation is key here.
      *   *(5) Asymmetric Costs:* Highly actionable (thresholds). Directly links to risk management.
      *   *(6) Strategy:* Important, but often leads to "mechanism design" impossibility results. Might be too abstract for practitioners.
      *   *(7) Framing/Epistemology:* Philosophical. If the answer is "CJT doesn't apply to values," it kills the project. Needs to be handled carefully, maybe as a scope boundary rather than a research line.

  3.  **Determine Dependencies (The "Crux" Analysis):**
      *   The user thinks (1) Correlation is the crux. They are right *theoretically*. If errors are perfectly correlated, $N$ doesn't matter.
      *   However, for a *practitioner*, knowing "correlation is bad" isn't enough. They need to know *how* to mitigate it or *when* it's safe to ignore it.
      *   (5) Asymmetric Costs is independent of correlation to some degree (you set thresholds based on risk regardless of $N$, though $N$ affects the curve).
      *   (4) Beyond Binary (Logical Aggregation) is structurally distinct but relies on competence assumptions similar to CJT.
      *   (2) Weighted Voting relies heavily on (1) because weighting amplifies correlated errors if the "experts" are correlated.
      *   (3) Deliberation is the main driver of (1). You can't solve (1) without understanding (3).

  4.  **Select the Top Three Priorities:**
      *   *Priority 1: The Correlation-Deliberation Nexus (Merging 1 & 3).* You can't separate them. Practitioners *will* deliberate. They need to know if that destroys accuracy. This addresses the fundamental validity of the CJT in real settings.
      *   *Priority 2: Asymmetric Costs & Thresholds (Topic 5).* This is the most "Monday morning" actionable. If you accept the group is competent enough, how do you set the bar? This gives immediate design rules (supermajority vs. simple majority).
      *   *Priority 3: Logical Aggregation/Structure (Topic 4).* Assemblies rarely vote on one binary thing. They vote on premises or options. The "Doctrinal Paradox" is a major failure mode for citizen assemblies.
      *   *Why not Weighted Voting (2)?* Too data-hungry. Practitioners won't have past accuracy data on random citizens. It's fragile.
      *   *Why not Strategy (6)?* Too abstract. Secret ballots mostly solve this.
      *   *Why not Framing (7)?* This is a scope definition, not a research project. If the foundation funds this, they already believe there's a "truth" or at least a "correct procedure." Researching "does truth exist" is philosophy, not design theory.

  5.  **Drafting the Argument (Iterative Refinement):**

      *   *Ranking:*
          1.  **Correlated Error & Deliberation Design** (Merging 1 & 3).
          2.  **Risk-Weighted Thresholds** (Topic 5).
          3.  **Question Decomposition & Aggregation** (Topic 4).

      *   *Justification for #1:* It's the "engine check." If correlation kills accuracy, nothing else matters. But we need to make it practical. Instead of pure probability, focus on *structural mitigations* (subgroups, independent drafting).
      *   *Justification for #2:* It's the "steering wheel." Even with imperfect accuracy, how do we minimize catastrophic error? This is pure decision theory applied to assembly design. High utility.
      *   *Justification for #3:* It's the "map." Most real decisions aren't binary. Getting the structure wrong leads to inconsistent outcomes (Doctrinal Paradox).

      *   *Critique of User's Instinct:* User thinks (1) is the crux. I agree, but (1) alone is too negative ("it doesn't work"). It needs to be paired with (3) Deliberation to become constructive ("here's how to deliberate safely").
      *   *Critique of (5):* User worries (1) is intractable and (5) is better. (5) is tractable, but (5) without (1) is dangerous (setting thresholds on a broken engine). So (1) must be first, but scoped tightly.

      *   *Missing Topics:*
          *   **Recruitment/Stratification:** How do you build the pool to minimize correlation *ex ante*? This is the practical lever for (1).
          *   **Feedback Loops:** Learning over time.

      *   *Kill/Switch Criteria:*
          *   If we can't quantify correlation bounds, pivot to heuristics.
          *   If cost ratios are too subjective, pivot to robustness checks.

  6.  **Refining the Tone:**
      *   Needs to be authoritative, direct, and advisory.
      *   No citations.
      *   Focus on "Monday Morning" utility.
      *   Acknowledge the 2-year/4-person constraint.

  7.  **Final Review against Constraints:**
      *   Did I rank them? Yes.
      *   Did I defend based on dependency, tractability, impact? Yes.
      *   Did I flag overrated/duplicates? Yes (merged 1&3, downgraded 2&6).
      *   Did I identify missing questions? Yes (Recruitment/Stratification).
      *   Did I give kill criteria? Yes.
      *   Is it three priorities? Yes.

  8.  **Self-Correction/Nuance Check:**
      *   *Wait, is Weighted Voting really that useless?* For *expert* panels, yes. For *citizen* assemblies, definitely yes (no prior data). The prompt mentions "expert panels" too. But even for experts, estimating competence is noisy. I'll keep it downgraded but mention it as a sub-component of competence estimation.
      *   *Is Framing (7) really ignorable?* If the foundation funds "theory of citizen assemblies," they likely accept the epistemic premise. But the researchers need to define the boundary. I'll suggest treating it as a "Scope Boundary" rather than a research line.
      *   *Tractability:* Can 4 people solve correlation in 2 years? Not fully. But they can produce *bounds* and *mitigation strategies*. That's the key pivot. Don't solve the probability; solve the design implication.

  9.  **Final Polish:** Structure the response clearly. Introduction -> The Ranking -> Detailed Defense -> The "Overrated" Pile -> Missing Pieces -> Kill Switches. (Proceed to generate output).

  *(Self-Correction during drafting)*: I need to make sure I don't just say "Correlation is hard." I need to say *how* to make it useful. The deliverable isn't a theorem; it's a "Correlation Budget Calculator" or a "Deliberation Protocol Checklist." That fits the funder's requirement.

  *(Refining the Merge)*: Merging (1) Correlation and (3) Deliberation is the strongest move. Deliberation is the *cause* of correlation in assemblies. Studying them separately is artificial.

  *(Refining the "Missing" piece)*: Recruitment is the practical lever for correlation. If you can't fix the math, fix the people. That's a crucial practical insight.

  *(Final check on "Monday Morning")*:
  1. Correlation/Deliberation -> "Don't let them sit in one big room."
  2. Thresholds -> "Use 60% for high-risk decisions."
  3. Structure -> "Vote on premises, not just conclusions."
  These are actionable.

  Okay, ready to write.s
answer: |-
  Here is a defended research agenda tailored to your constraints: four people, two years, zero tolerance for pure theory, maximum utility for a practitioner designing a real process.

  ### The Ranking

  1.  **The Correlation-Deliberation Nexus** (Merging Candidates 1 & 3)
  2.  **Risk-Weighted Decision Thresholds** (Candidate 5)
  3.  **Question Decomposition & Logical Aggregation** (Candidate 4)

  **Depreciated:** Weighted Voting (2), Strategy (6), Framing (7).

  ---

  ### Defense of the Priorities

  #### Priority 1: The Correlation-Deliberation Nexus
  **Why it's #1:** You are correct that correlation is the crux. The Condorcet Jury Theorem (CJT) collapses if votes are not independent. In citizen assemblies, independence is violated by design: participants are recruited from similar demographics, briefed by the same experts, and housed in the same hotel. However, treating this as a pure probability problem (Candidate 1) is a trap. You cannot ask practitioners to measure the correlation coefficient of their group.

  **The Pivot:** Merge this with Deliberation (Candidate 3). Deliberation is the primary *mechanism* that induces correlation. The research question shifts from "How much correlation can we swallow?" to "What deliberation structures minimize correlated error while preserving information sharing?"

  **Monday Morning Deliverable:** A **Deliberation Protocol Checklist**.
  Instead of a theorem, you produce design rules:
  *   *Subgrouping:* "If the group is >50, split into independent drafting committees before plenary voting."
  *   *Sequencing:* "Collect private preliminary votes *before* any group discussion to lock in independence."
  *   *Expert Exposure:* "Do not let the whole group hear the same expert witness in one session; split the room."

  **Tractability:** High. You don't need to solve the general probability problem. You need to run simulations (agent-based modeling) comparing specific, common assembly formats (e.g., "fishbowl" vs. "breakout groups") to see which preserves accuracy under realistic competence assumptions. This is doable in Year 1.

  **Dependency:** Everything else depends on this. If deliberation destroys independence so thoroughly that group size doesn't matter, then Thresholds (Priority 2) and Weighting (Candidate 2) become irrelevant. You must establish the "effective N" of the assembly first.

  #### Priority 2: Risk-Weighted Decision Thresholds
  **Why it's #2:** This is the highest "policy bite" item. Even if you solve correlation, practitioners face the question: "How many votes do we need to pass?" Simple majority is the default, but for constitutional changes or high-stakes policy, it feels risky. Candidate 5 (Asymmetric Costs) is the theoretical justification for supermajorities, but it is rarely operationalized.

  **The Pivot:** Move from "optimal threshold" to "robust threshold ranges." Practitioners cannot quantify the cost ratio of a false positive vs. false negative in utils. But they can categorize decisions by *reversibility* and *impact*.

  **Monday Morning Deliverable:** A **Threshold Decision Tree**.
  *   *High Reversibility / Low Impact:* Simple Majority.
  *   *Low Reversibility / High Impact:* Supermajority (e.g., 2/3).
  *   *Irreversible / Rights-Impacting:* Consensus or near-consensus (with fallback).
  Crucially, you defend these cutoffs not by tradition, but by modeling the "regret function." Show the organizer: "If you choose simple majority here, your risk of catastrophic error is X times higher than with a 60% threshold, assuming competence Y."

  **Tractability:** Very High. This is decision theory, not complex social dynamics. It relies on the output of Priority 1 (the effective competence/correlation rate) but doesn't require solving new social physics.

  **Dependency:** Depends on Priority 1 only for the input variable (group accuracy). It is structurally independent. You can produce useful heuristics here even if Priority 1 is messy.

  #### Priority 3: Question Decomposition & Logical Aggregation
  **Why it's #3:** Real assemblies rarely vote on "Should we do X?" They vote on "Is climate change real?" (Premise 1), "Is it dangerous?" (Premise 2), "Should we tax carbon?" (Conclusion). The **Doctrinal Paradox** shows that majority voting on premises can yield a different result than majority voting on the conclusion. This is a massive failure mode for citizen assemblies that draft legislation or constitutional clauses.

  **The Pivot:** Focus on *consistency guarantees*. When should an aggregator vote on premises vs. conclusions?

  **Monday Morning Deliverable:** A **Voting Structure Guide**.
  *   "If the logic is conjunctive (A AND B implies C), vote on premises."
  *   "If the logic is disjunctive or value-laden, vote on the conclusion."
  *   "If you vote on premises, use a higher threshold for the conclusion to ensure consistency."

  **Tractability:** Medium. The logic is well-understood (List & Pettit, etc.), but the translation into "how to write the ballot" is not. This requires translating logical aggregation theory into ballot design instructions.

  **Dependency:** Low. This is about structural integrity of the output, independent of the correlation problem (though correlation affects accuracy in both).

  ---

  ### The "Overrated" Pile

  *   **Weighted Voting (Candidate 2):** **Drop it.** For citizen assemblies, you have no prior accuracy data to weight by. For expert panels, competence estimates are notoriously noisy. The math shows that unless your competence estimates are extremely precise, weighting by noise introduces more error than it corrects. It creates political toxicity ("why does her vote count more?") for negligible epistemic gain. It fails the "Monday Morning" test because no organizer will have the data to implement it.
  *   **Strategy (Candidate 6):** **Drop it.** In secret-ballot citizen assemblies, strategic voting is minimal compared to public elections. In deliberative settings, social pressure is the bigger issue, which is covered under Priority 1 (Deliberation). Mechanism design to prevent strategy is too abstract for practitioners.
  *   **The Framing Objection (Candidate 7):** **Scope Boundary, not Research.** Do not fund a project to determine if "truth" exists in policy. That is philosophy, not design theory. Your funder is already betting on the epistemic value of assemblies. Treat this as a constraint: "This agenda applies to questions with a verifiable or inter-subjectively agreeable correct answer (e.g., budget balancing, factual diagnosis, constitutional consistency). It does not apply to pure preference aggregation (e.g., what color should the flag be?)." Write this into the introduction and move on.

  ### Missing Questions

  You left out **Recruitment and Stratification**.
  Correlation (Priority 1) is determined *before* the assembly meets, by who is in the room. If you recruit from a single geographic area or a single voter file, you bake in correlation.
  *   **Add this as a sub-component of Priority 1.** The research should ask: "How much does stratified sortition (by geography, education, ideology) reduce the effective correlation coefficient compared to simple random sampling?" This is highly actionable for organizers designing the recruitment algorithm.

  ### Kill Switches & Reallocation Criteria

  You have two years. You need to know when to pivot.

  **For Priority 1 (Correlation/Deliberation):**
  *   **The Kill Signal:** If, after 9 months of modeling, you find that *any* realistic level of deliberation induces correlation high enough to negate the benefit of $N > 20$.
  *   **The Pivot:** If the math says deliberation breaks the jury, stop trying to optimize deliberation. Reallocate resources to **Information Protocols**. Shift the question to: "How do we deliver information to the group without them talking to each other?" (e.g., personalized briefing books, independent expert consultations).

  **For Priority 2 (Thresholds):**
  *   **The Kill Signal:** If you find that the "optimal threshold" is hyper-sensitive to the competence estimate (e.g., a 1% change in assumed competence swings the optimal threshold from 50% to 80%).
  *   **The Pivot:** Abandon optimization. Switch to **Robustness Testing**. Instead of telling them "Use 60%," give them a tool that says, "If you use 60%, you are safe as long as competence is between 0.55 and 0.75. If you think competence is lower, you need 75%." Sell ranges, not points.

  **For Priority 3 (Decomposition):**
  *   **The Kill Signal:** If the logical rules become too complex for a non-logician facilitator to explain to participants.
  *   **The Pivot:** Simplify to a binary heuristic. "Vote on the whole package" vs. "Vote on the parts." Drop the nuanced logical aggregation if it requires a PhD to administer.

  ### Summary of the Argument

  Your instinct that **(1) Correlation** is the crux is correct, but treating it as a pure probability problem makes it intractable and useless to practitioners. By merging it with **(3) Deliberation**, you turn a theoretical limitation into a design constraint.

  **(5) Asymmetric Costs** is the only other topic with immediate policy utility, so it must be #2. It allows you to give advice even if the correlation problem is only partially solved.

  **(4) Beyond Binary** is essential because real assemblies don't do binary votes. It rounds out the "design toolkit."

  This agenda gives you three distinct, actionable deliverables:
  1.  **A Process Protocol** (How to run the discussion to save independence).
  2.  **A Threshold Calculator** (How to set the passing bar based on risk).
  3.  **A Ballot Design Guide** (How to structure the questions to avoid logical contradictions).

  This avoids the "math-for-math's-sake" trap by forcing every equation to result in a rule of thumb for a facilitator. If you can't turn the math into a rule of thumb, you cut the line.
