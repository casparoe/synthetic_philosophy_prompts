      *   Expected Value term $E_n = p_n X_n = (-1)^{n+1} \frac{1}{n}$.
      *   Total Expectation $E = \sum E_n = \sum_{n=1}^\infty (-1)^{n+1} \frac{1}{n}$.
      *   This is the alternating harmonic series. It converges conditionally to $\ln(2)$.
      *   Absolute Expectation: $\sum |E_n| = \sum \frac{1}{n} = \infty$.
      *   *Key Mathematical Fact:* Since $\sum |E_n| = \infty$, the expectation is *not* absolutely convergent. By the Riemann Rearrangement Theorem, the sum can be made to converge to any real number (or diverge) by rearranging terms.
      *   *Key Probability Fact:* In probability theory, the expectation $E[X]$ is defined as $\int X dP$. For discrete variables, $E[X] = \sum x_i p_i$. The definition usually requires absolute convergence ($\sum |x_i| p_i < \infty$) for the expectation to be well-defined and independent of ordering. If $\sum x_i^+ p_i = \infty$ and $\sum x_i^- p_i = \infty$, the expectation is undefined.
