answer: |-
  **The case**
  A municipal building authority employs two hundred engineers. A standing rule requires senior reviewers to randomly reject ten per cent of fully compliant junior plans. The stated purpose is error detection. Historical data confirms the real function is resilience training for future directors; juniors learn to defend work under pressure, and seniors learn to judge beyond checklists. In 1995, management relabelled the rule as a formal training programme. Within a year, juniors gamed submissions to look resilient rather than correct, seniors softened rejects to avoid hindering careers, and leadership quality collapsed. The change was quietly reverted. A current review team has uncovered this history. They hold a draft finding explaining the mechanism. They face a binary choice: abolish the rule and publish the finding to the whole firm, or preserve the rule and suppress the finding, maintaining the stated purpose of error detection. Suppression is feasible; there are no whistleblowers, and the cost of secrecy is negligible. The decision rests on institutional logic, not moral sentiment.

  **Common ground**
  1. Both reasoners accept the historical data: the rule produces valuable directors only when participants believe it is for error detection.
  2. Both agree the director pipeline is valuable enough to justify the rule's direct costs.
  3. Both agree suppression is technically feasible without collateral damage.
  4. Both accept that the decision-makers themselves now know the real function.
  5. Neither appeals to moral duties (honesty, fairness, rights); arguments rest solely on their respective structural principles.
  6. Both agree the practice's real function is worth having.
  7. Both acknowledge the 1995 failure as a causal fact, not a moral warning.

  **The conservator's derivation**
  1. The fence principle states: do not remove a tradition until you understand its purpose.
  2. We now understand the purpose: it is training, not quality control.
  3. The principle implies traditions are kept because they serve a latent function recognized by the institution.
  4. This function operates only under specific epistemic conditions (participant ignorance).
  5. Decision-makers now lack these conditions; for us, the function is extinct.
  6. A tradition that yields cost without function for the governors is structural clutter.
  7. The fence principle mandates clearing clutter to maintain institutional rationality.
  8. Therefore, the rule must be abolished.
  9. Furthermore, if the finding is not published, future governors may reinstated the rule believing it serves quality control.
  10. To prevent erroneous reinstatement, the understanding must be circulated.
  11. Conclusion: Abolish the rule and publish the finding.

  **The reformer's derivation**
  1. The consequentialist principle states: choose the action maximizing net institutional utility.
  2. Utility is defined by the output of the director pipeline minus the cost of the rule.
  3. Fact: The pipeline output is high only if participants remain ignorant of the rule's true purpose.
  4. Fact: Publication destroys participant ignorance, collapsing the pipeline output.
  5. Fact: Suppression maintains participant ignorance, preserving the pipeline output.
  6. Comparison: Preserve + Suppress yields high utility. Abolish + Publish yields low utility (cost saved, but pipeline lost).
  7. There is no independent moral constraint against suppression.
  8. The cost of suppression is negligible compared to the value of the pipeline.
  9. Therefore, the action maximizing utility is to preserve the rule and suppress the finding.
  10. Conclusion: Preserve the rule and suppress the finding.

  **The hinge**
  The divergence turns on the status of knowledge within the system. For the reformer, knowledge is a causal variable: increasing it decreases utility, so it should be minimized. For the conservator, knowledge is a governance condition: a tradition cannot be rationally maintained if its justification is known to be false by the maintainers. The conservator argues that a fence understood to be a trick is no longer a fence, but a liability. The reformer argues that a fence that works is a fence, regardless of what the maintainers call it. The split is forced because the function is belief-dependent; if the function were belief-independent (e.g., a physical barrier), both would agree to preserve it.

  **The removal test**
  Remove the belief-dependence. Suppose the rule physically prevented collisions regardless of what engineers thought. The conservator would say: "I understand it prevents collisions; it is valid; keep it." The reformer would say: "It prevents collisions; utility is high; keep it." The verdicts converge on preservation. This confirms the divergence in the main case is not due to a hidden preference for change or stability, but strictly due to the epistemic fragility of the function. The case isolates the conflict between epistemic integrity and instrumental efficacy.

  **Cross-examination**
  **Reformer:** You claim to follow the fence principle, but you treat "understanding" as an intrinsic good. You are destroying a working mechanism because knowing how it works offends your desire for rational clarity. You have turned a maxim about evidence into a principle about authorization, sacrificing the very value the fence protected.
  **Conservator:** You claim to calculate outcomes, but your calculation relies on maintaining inherited prejudice. You are arguing exactly as Burke argued when he defended inherited prejudice, so that your position is conservatism with a guilty conscience. You love the lie because it works, whereas I require the tradition to be robust enough to survive its own explanation.
  **Reformer:** Robustness is not a utility.
  **Conservator:** Without it, you govern by magic, not engineering.

  **Confidence**
  I am moderately confident (70%) that the case delivers the forced verdicts. The reformer's derivation is robust; act-consequentialism clearly demands suppression if it saves the valuable function. The conservator's derivation is riskier. The step from "I understand it" to "I must abolish it" relies on interpreting the fence principle as requiring *effective* justification, not just *known* justification. If the fence principle merely permits removal upon understanding, the verdict is not forced. I have argued that maintaining a known inefficiency violates the principle's goal of rational tradition management, but this borders on smuggling in a preference for efficiency over utility. The weakest link is the claim that publication is *required* rather than optional to prevent reinstatement; a sceptic might argue private minutes suffice. However, within the constraints, this is the strongest available construction.
