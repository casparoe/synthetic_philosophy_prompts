      *(Final check on constraints)*: "Don't give me a lecture on what a Ulysses contract or a commitment device is." -> Okay, I will avoid defining them. "Rate each one — clearly right, partly right, or a mistake." -> Will do. "Couple sentences on why." -> Will do.

