  **PART C: MARKING SCHEME**

  **Total Marks: 25**

  **1. Ranking and Calculations (5 Marks)**
  *   **5 marks:** Correctly calculates $H$ and $V$ for all four populations. Correctly identifies the lexical priority (A first, then tie-break B/C/D). Correct final ranking (A > C > D > B).
  *   **3 marks:** Correct calculations but errors in ranking logic (e.g., ranks by total pain instead of $H$).
  *   **1 mark:** Attempts calculations but fundamental misunderstanding of $\min(P, \tau)$.
  *   *Weak Response:* Treats $P$ as simply additive without applying the threshold cap in $V$.

  **2. Defense Against Repugnance (4 Marks)**
  *   **4 marks:** Identifies B vs C as the hard case. Defends C > B by appealing to the summative nature of $H$ and the legitimacy of $V$ tie-breaking. Acknowledges the cost to the 1,000 individuals.
  *   **2 marks:** Defends the view but relies on "greater good" arguments that ignore the specific LTNU structure.
  *   **0 marks:** Concedes the view is repugnant without defense or ignores the B/C comparison.
  *   *Weak Response:* Claims C is worse because "more people suffer," ignoring the $H$ tie.

  **3. Commensurability and Vagueness (4 Marks)**
  *   **4 marks:** Distinguishes lexical commensurability from incomparability. Explains that vagueness at $\tau$ destroys the lexical priority (collapsing into weighted utilitarianism).
  *   **2 marks:** States they are commensurable but fails to explain the consequence of vagueness.
  *   **0 marks:** Claims pain and pleasure are incomparable.
  *   *Weak Response:* Asserts "infinite exchange rate means incomparable" without nuance.

  **4. Temporal Scope of $\tau$ (4 Marks)**
  *   **4 marks:** Constructs a specific case (e.g., aggregated episodes vs. separate lives) where "life" vs "moment" units reverse the verdict. Shows the omission is not harmless.
  *   **2 marks:** Notes the ambiguity but fails to construct a reversing case.
  *   **0 marks:** Assumes $\tau$ applies to lives without question.
  *   *Weak Response:* Discusses duration of pain without linking it to the threshold calculation.

  **5. Summation and Transitivity (4 Marks)**
  *   **4 marks:** Addresses the NegU collapse concern. Argues explicitly for transitivity based on the properties of lexical ordering over real numbers.
  *   **2 marks:** Asserts transitivity without argument (penalized per prompt instructions).
  *   **0 marks:** Claims the view is intransitive.
  *   *Weak Response:* "Threshold views are usually intransitive" (unsupported generalization).

  **6. Uncertainty and Representation (4 Marks)**
  *   **4 marks:** States no single real-valued measure exists. Proposes a decision rule that prioritizes probability of affliction over expected value.
  *   **2 marks:** Suggests maximizing expected $H$ without noting the representational limit.
  *   **0 marks:** Applies standard Expected Utility Theory without modification.
  *   *Weak Response:* "Just calculate the expected hedons."

  **Distinction between First-Class and Competent:**
  A **Competent (15-18 marks)** answer will perform the calculations correctly, address all four topics, and provide standard definitions. A **First-Class (20-25 marks)** answer will demonstrate *integration*: it will show how the uncertainty problem arises *from* the lexical structure, or how the temporal scope ambiguity threatens the transitivity claim. The First-Class answer will also offer a nuanced defense of the repugnant verdict that engages with the specific motivation of LTNU (preventing severe suffering) rather than generic utilitarian defenses.

  ***

  **Difficulty Analysis**

  The hardest part of this question is the **Uncertainty and Representation** section. Candidates often default to standard Expected Utility Theory without realizing that lexical orders cannot be represented by a single real-valued function, which breaks standard maximization rules. A strong-but-not-exceptional answer is most likely to fumble the **Temporal Scope** issue; they will recognize the ambiguity but fail to construct a specific numerical case where the verdict reverses, offering only hand-waving about "moments vs. lives." I recommend the paper carry a hint regarding the representability of lexical orders, as this requires a specific technical insight that may be outside the scope of a general ethics seminar, whereas the other three issues are accessible through careful reading of the provided definition.
