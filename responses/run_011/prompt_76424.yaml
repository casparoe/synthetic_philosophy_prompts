answer: |-
  **PART A: THE EXAMINATION QUESTION**

  **Graduate Seminar: The Structure of Well-Being**
  **Final Written Paper**
  **Time Allowed: 3 Hours**
  **Word Limit: 1,200 words (±10%)**
  **Total Marks: 25**

  **Instructions:**
  Answer the following question. You must engage with the definition provided below. Your answer should not merely rehearse standard objections to utilitarianism but must interrogate the internal logic of the specific view defined. You are required to address the four analytical problems listed in section (3) of this question. Failure to address any one of these four problems will result in a significant penalty.

  **1. Definition: Lexical Threshold Negative Utilitarianism (LTNU)**
  Every life has a total quantity of pleasure, measured in hedons ($Q$), and a total quantity of pain, measured in dolors ($P$). There is a fixed threshold $\tau$ dolors. A life is *afflicted* if its total pain exceeds $\tau$, and *unafflicted* otherwise. Betterness over populations is settled in two lexical stages:

  1.  *Affliction.* For a population $X$, let $H(X)$ be the sum, over the lives in $X$, of the amount by which each afflicted life's pain exceeds $\tau$. $X$ is better than $Y$ at this stage if and only if $H(X) < H(Y)$. Any difference in $H$, however small, decides the comparison: no quantity of pleasure can offset any positive quantity of affliction.
  2.  *Net sub-threshold welfare.* If $H(X) = H(Y)$, then $X$ is better than $Y$ if and only if $V(X) > V(Y)$, where $V(X) = \Sigma Q - c \cdot \Sigma \min(P, \tau)$ summed over the lives in $X$ and $c$ is a fixed positive conversion rate.

  **2. Stipulated Populations**
  Assume $\tau = 100$ and $c = 1$. Consider the following four populations:
  *   **Population A:** 1 life. $P = 90$, $Q = 500$.
  *   **Population B:** 1 life. $P = 110$, $Q = 500$.
  *   **Population C:** 1,000 lives. Each has $P = 100.01$, $Q = 500$.
  *   **Population D:** 1 life. $P = 110$, $Q = 2000$.

  **3. Analytical Tasks**
  First, rank Populations A, B, C, and D from best to worst according to LTNU. Show your calculations for $H$ and $V$.

  Second, defend this ranking against the charge that it yields a repugnant conclusion, specifically focusing on the comparison between Population B and Population C. Explain why a sympathetic defender might accept this verdict despite the distribution of suffering.

  Third, you must investigate the following four structural issues inherent in the definition above. Do not treat these as separate essay topics; integrate them into your analysis of the view's coherence:
  *   **Commensurability:** The definition implies an infinite exchange rate above $\tau$ and a fixed rate $c$ below it. Analyze whether this constitutes a denial of commensurability or a specific lexical ordering. How would the view's stability change if $\tau$ were treated as a vague zone rather than a sharp jump?
  *   **Temporal Scope:** The definition does not specify whether $\tau$ applies to a moment, an episode, or a whole life. Construct a specific case where choosing "moment" versus "life" as the unit reverses the moral verdict between two options.
  *   **Summation and Transitivity:** $H(X)$ sums excess pain across lives. Determine whether this summative character collapses LTNU into a discontinuous Negative Utilitarianism. Argue explicitly for or against the transitivity of the ordering defined, providing reasoning rather than assertion.
  *   **Uncertainty:** Determine whether the lexical ordering defined can be captured by a single real-valued measure of population value. If an agent is uncertain whether an act will cause pain exceeding $\tau$, what decision rule must they adopt? Does this rule require a secondary threshold for probability?

  **4. Submission**
  Write your response as a single continuous essay. Begin with the ranking and defense, then proceed to the structural analysis. Ensure your argument flows logically between the concrete calculations and the theoretical implications.

  ***

  **PART B: MODEL ANSWER**

  **Lexical Threshold Negative Utilitarianism: Structure and Commitments**

  **Ranking and Calculations**
  To rank the populations, we calculate $H$ (total excess pain) and $V$ (net sub-threshold welfare) for each, given $\tau = 100$ and $c = 1$.

  *   **Population A:** $P=90$ (Unafflicted). $H(A) = 0$. $V(A) = 500 - 1(90) = 410$.
  *   **Population B:** $P=110$ (Afflicted). Excess = 10. $H(B) = 10$. $V(B) = 500 - 1(100) = 400$. (Note: $\min(110, 100) = 100$).
  *   **Population C:** 1,000 lives, $P=100.01$ (Afflicted). Excess per life = 0.01. $H(C) = 1,000 \times 0.01 = 10$. $V(C) = (1,000 \times 500) - 1(1,000 \times 100) = 500,000 - 100,000 = 400,000$.
  *   **Population D:** $P=110$ (Afflicted). Excess = 10. $H(D) = 10$. $V(D) = 2000 - 1(100) = 1900$.

  **Ranking:** Stage 1 prioritizes minimizing $H$. A is best ($H=0$). B, C, and D tie ($H=10$). Stage 2 breaks ties using $V$.
  Order: **A > C > D > B**.

  **Defense Against Repugnance**
  The comparison between B and C is the most contentious. LTNU ranks C (1,000 lives slightly afflicted) above B (1 life moderately afflicted) because $H$ is identical, and C generates vastly more sub-threshold pleasure. A critic might charge this is repugnant: it permits subjecting a thousand individuals to pain above the threshold to secure pleasure, provided the *excess* is minimal.

  However, a sympathetic defender argues that the "repugnance" here is misplaced. The view's core motivation is that suffering *above* a severity threshold is the primary moral disvalue. Since the total quantity of "forbidden" excess pain is identical in B and C (10 dolors), the first stage is indifferent. The second stage legitimately considers welfare. To prefer B over C would be to prioritize the *number* of afflicted persons over the *total amount* of excess pain, which contradicts the summative definition of $H$. Furthermore, C contains significantly more net welfare ($V$). The defender accepts that 1,000 people crossing the threshold is permissible if the aggregate violation is no worse than one person crossing it deeply, provided the welfare gains are substantial. This is not a bug but a feature of aggregating threshold violations.

  **Structural Analysis: Commensurability**
  The definition posits an infinite exchange rate above $\tau$ and rate $c$ below. This is not incomparability; it is lexical commensurability. Pleasure and pain are comparable, but the weight of affliction is lexicographically superior. If $\tau$ were vague—a zone between 90 and 110 dolors where status is indeterminate—the lexical jump would dissolve. We would face a continuum where small increases in pain gradually increase the "weight" of suffering. This would destroy the view's distinctive claim that severe suffering *absolutely* outranks happiness. Without a sharp threshold, the view collapses into a weighted utilitarianism where enough pleasure could eventually offset severe pain, violating the negative utilitarian constraint.

  **Structural Analysis: Temporal Scope**
  The definition omits the unit of $\tau$. Does a life with two episodes of 60 dolors count as afflicted ($120 > 100$), or only if a single episode exceeds 100? This omission is critical.
  *Case:* Consider **Option 1**: One life with two distinct episodes of pain, 60 dolors each. Total $P=120$.
  *Option 2*: Two lives, each with one episode of 60 dolors. Total $P=120$.
  If $\tau$ applies to the **whole life**, Option 1 is afflicted ($120 > 100$), generating $H=20$. Option 2 consists of unafflicted lives ($60 < 100$), generating $H=0$. LTNU prefers Option 2.
  If $\tau$ applies to **episodes**, both options contain only unafflicted episodes. $H=0$ for both. The verdict rests on $V$.
  This reversal shows the definition is incomplete. A life-based threshold penalizes the aggregation of moderate pain within a single subject, while an episode-based threshold does not. The view must specify the unit to avoid arbitrary verdicts on pain aggregation.

  **Structural Analysis: Summation and Transitivity**
  $H(X)$ sums excess pain across lives. This makes LTNU indifferent between one life at $\tau + 10$ and ten lives at $\tau + 1$. Does this collapse the view into Negative Utilitarianism (NegU) with a discontinuous weight? Not entirely. Standard NegU weighs all pain. LTNU ignores sub-threshold pain in the first stage. However, because $H$ is purely summative, it loses sensitivity to the *distribution* of affliction.
  Regarding transitivity: The ordering is transitive. Lexical orders are transitive if the underlying components are transitive. $H$ is a real-valued sum (transitive). $V$ is a real-valued sum (transitive). If $X \succ Y$ (due to $H$) and $Y \succ Z$ (due to $H$), then $H(X) < H(Y) < H(Z)$, so $X \succ Z$. If $X \succ Y$ (due to $H$) and $Y \succ Z$ (due to $V$, where $H$ ties), then $H(X) < H(Y) = H(Z)$, so $X \succ Z$. The only risk is if $H$ is vague, but given sharp values, transitivity holds. The view does not cycle; it merely prioritizes.

  **Structural Analysis: Uncertainty**
  Can this ordering be captured by a single real-valued measure? No. A lexical order cannot be represented by a continuous real-valued function because there is no finite number $k$ such that $k$ units of $V$ offset 1 unit of $H$. The value space is effectively two-dimensional $(H, V)$ ordered lexicographically.
  Under uncertainty, an LTNU agent cannot simply maximize expected value. If an act has a 1% chance of causing $\tau + 1$ dolors, the expected $H$ is 0.01. If another act has a 100% chance of causing $\tau - 1$ dolors, expected $H$ is 0. Strictly speaking, the first act has positive expected affliction, the second zero. The agent must minimize expected $H$. However, this requires a threshold for probability. If the risk of affliction is non-zero, is the act forbidden? A plausible rule is to minimize the *probability* of creating any afflicted life first, then minimize expected excess pain. This introduces a deontological constraint on risk that differs from standard expected utility maximization.

  **Conclusion**
  LTNU offers a rigid priority to severe suffering but relies on sharp distinctions that may not hold under scrutiny. Its coherence depends on defending the sharpness of $\tau$, the unit of aggregation, and a non-standard decision theory for risk.

