      *   Agreement: The label is less important than the structure of the experience.

  8.  **Drafting Section 6: Falsification:**
      *   *Hedonist:* If we find a state that is phenomenally unpleasant but has *zero* motivational pull (even implicit), and it's not called pain. Or if asymbolics show implicit distress they deny.
      *   *Imperativist:* If we find a state with strong avoidance motivation but *no* phenomenal unpleasantness (and it counts as pain). Or if asymbolics report "it feels awful" but just don't care (dissociation of feel and care).

