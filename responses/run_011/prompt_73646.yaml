      *   *Disagreement 3:* Necessity of suffering. Hedonist: Suffering is necessary for pain's badness. Imperativist: Motivation is necessary for pain's badness (suffering is just the felt side of motivation).
      *   *Impact:* Would settling this change medical practice? Maybe not. Would it change philosophy of mind? Yes.

  5.  **Drafting Section 3: Cruxes:**
      *   Where does the rubber meet the road?
      *   *Crux 1:* Can motivation exist without unpleasantness? (Imperativist says they are linked; Hedonist says they can come apart).
      *   *Crux 2:* Is the "sensory" part of asymbolia actually pain, or just touch/pressure detection?
      *   *Crux 3:* If we artificially restore motivation without changing the quale, does badness return?

  6.  **Drafting Section 4: Tests/Thought Cases:**
      *   *Test 1 (Empirical):* Avoidance learning. Can asymbolics learn to avoid a stimulus if rewarded, even if they don't "mind" it?
          *   Hedonist: They should learn easily (no pain interference).
          *   Imperativist: They might struggle because the *imperative* is missing, even if reward is present. (Wait, need to refine this).
          *   *Better Test:* Self-administration of analgesia. If offered a pill that restores the "bother," will they take it?
          *   *Refined Test:* Trade-off tasks. How much money to endure a stimulus?
          *   *Hedonist Prediction:* They will endure high intensity for low cost (no suffering).
          *   *Imperativist Prediction:* They might still show implicit avoidance markers (withdrawal reflexes) despite report, suggesting the imperative is sub-personal.
      *   *Test 2 (Thought Experiment):* The "Happy Masochist" vs. "Sadistic Guardian."
      *   *Feasibility/Ethics:* Real patients are vulnerable. Non-invasive only. No inducing harm.

  7.  **Drafting Section 5: Verbal Dispute:**
      *   Is "Is it pain?" verbal? Yes, likely.
      *   The substantive fight is about *badness*, not the label "pain."
