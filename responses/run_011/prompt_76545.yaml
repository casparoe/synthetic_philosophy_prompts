prompt: |-
  You are to write as a scholar who is equally at home in ancient Greek and Roman biography and in modern machine learning, and who is used to auditing cross-domain analogies rather than admiring them. Please think carefully, and before you deliver the audit, do some visible scratch work: brainstorm the full space of candidate mappings (including ones you expect to reject) and the full space of candidate disanalogies, and only then sort and assess.

  The situation. I sit on the faculty of an interdisciplinary program that teaches ethics to people who will build and deploy machine learning systems. A colleague has circulated a draft essay arguing that Plutarch's *Parallel Lives* — and, he says, hagiography too — are early instances of imitation learning on a curated demonstration set. His mapping, as I reconstruct it, runs like this: the biographer is the dataset curator; each Life is a demonstration trajectory; the paired Greek-and-Roman structure supplies contrastive pairs so the learner can see the same virtue realized under different conditions; the reader who "absorbs" the exemplar without ever being told a rule is doing behavioral cloning rather than inference from principles; and the fact that ancient lives contain embellishment, anachronism, and (in the saints' lives) outright miracle is just label noise, which he claims exposure-based learning tolerates gracefully. He supports the reading with Plutarch's own language — in the preface to the paired Lives of Timoleon and Aemilius Paulus he describes "using history as a mirror and endeavouring in a manner to fashion and adorn my life in conformity with the virtues therein depicted," and elsewhere in the same preface speaks of "calmly and dispassionately turning my thoughts away from them to the fairest of my examples."

  The analogy is doing two pieces of work, and those are what I need audited.

  - Conclusion A: moral education should be exemplar-based rather than principle-based, because that is demonstrably how virtue is actually acquired; teaching ethical theory to people who will wield powerful technology is a detour, and what we should be curating is a set of lives.
  - Conclusion B: factual accuracy in a life is largely beside the point. Since the mechanism is exposure rather than inference, an embellished or even partly invented exemplar transfers the virtue just as well; Plutarch's inaccuracies and the hagiographer's miracles are equally harmless, and equally unobjectionable.

  What I want from you:

  1. An explicit correspondence table. For each element of the source (curator, demonstration, contrastive pair, label noise, absence of an articulated objective, the learner's acquisition mechanism, evaluation of the trained policy) name what it is claimed to correspond to in the target, and mark each row as holding, holding only under strain, or failing.

  2. The disanalogies, sorted by whether they matter for the intended use. Separate the ones that bear on Conclusion A or B from the ones that are merely decorative objections. In particular, consider: whether a reader who is asked to judge, compare, and *fashion* himself against an exemplar is a learner in the cloning sense at all; whether Plutarch's practice of recording his subjects' faults and closing pairs with an explicit comparison invites the reader to rank and reject rather than to imitate; whether the classical account of how virtue is acquired — habituation through doing, not through watching — is itself a different mechanism from exposure to demonstrations, so that the analogy mis-describes even the ancient theory it invokes; and whether hagiography, which typically suspends the reader's judgment and offers a type rather than an individual, is a better fit for cloning than Plutarch is, so that the two halves of the analogy pull apart.

  3. What each side quietly imports. Which features of the source the analogy assumes the target has (an external objective being optimized, a learner with no standing to reject a demonstration, acquisition that is statistical rather than evidential), and which features of the target it hides or discards (the reader's reasons, the biographer's truth-directed commitments, the fact that Plutarch presents his material as reports about real people that he weighs and sometimes doubts).

  4. Whether the analogy holds on the *source* side. Conclusion B assumes imitation learning is robust to noisy demonstrations. Test that: what is actually known about behavioral cloning under imperfect demonstrations — compounding error, sensitivity to distribution shift, the conditions under which a bad demonstration is worse than no demonstration — and does that help or hurt the colleague's argument?

  5. Whether Conclusions A and B survive once the disanalogies are on the table. If a conclusion fails, say whether a weaker version of it can be rescued, and state that weaker version precisely. If the analogy should be replaced, propose a better one — for example, lives as case-method teaching material in a professional school, or as instruments for training moral perception rather than moral policy, or as simulations the reader interrogates — and say what the better analogy licenses and what it does not.

  Constraints: do not give me a bibliography or reading list, and do not cite secondary literature; I want your reasoning, not your sources. If you are unsure of a textual detail about Plutarch or about hagiographical practice, flag the uncertainty rather than inventing a detail. Where you disagree with my reconstruction of the colleague, say so and explain.

  Structure your answer with clear headings, include the correspondence table, and finish with a single machine-readable line in exactly this form, with no further text after it:

  Verdict: A=<survives|survives-with-restatement|fails>; B=<survives|survives-with-restatement|fails>; better-analogy=<a short phrase naming the replacement, or "none">
