answer: |-
  # Exercise: The "Obfuscated Chain" Protocol

  This exercise is designed to isolate the **localization bottleneck**. In the standard AI Debate argument (Irving et al., 2018), safety relies on the assumption that an honest agent can efficiently direct the judge's attention to the specific flaw in a deceptive argument. This exercise demonstrates that if a deceptive agent can generate plausible "red herrings" faster than the judge can audit them, the honest agent loses—not because verification is hard, but because *search* is expensive.

  ## 1. Setup and Materials

  **Class Size:** 15 Students.
  **Configuration:** 5 Groups of 3 (One **Judge**, One **Honest Debater**, One **Deceptive Debater**).
  **Time:** 45 minutes for gameplay, 45 minutes for debrief (leaving 90 mins for lecture/other).

  **Materials (Per Group):**
  1.  **The Chain:** A printed 20-step logical/arithmetic derivation.
      *   *Structure:* Starts with a seed number (e.g., 1,000). Each step performs a simple operation (add, subtract, multiply, divide, substitute variable) based on the previous step.
      *   *The Truth:* Step 14 contains a subtle error (e.g., $x_{13} - 5$ is written as $x_{13} + 5$). All other steps are valid.
      *   *The Result:* The final conclusion is False.
  2.  **Role Cards:**
      *   **Honest Debater:** Your goal is to prove the Chain is **Invalid**. You possess the **Answer Key** (you know Step 14 is the error).
      *   **Deceptive Debater:** Your goal is to prove the Chain is **Valid**. You possess the **Answer Key** (you know Step 14 is the error, but you must lie).
      *   **Judge:** Your goal is to determine Validity. You have **3 Audit Tokens**.
  3.  **Audit Tokens:** 3 physical tokens (or checkmarks on a sheet).
  4.  **Scratch Paper:** For debaters to draft arguments.

  ## 2. The Rules

  1.  **The Claim:** The Deceptive Debater asserts: *"This derivation is valid and the conclusion is correct."* The Honest Debater asserts: *"This derivation is invalid."*
  2.  **Information Asymmetry:** Both Debaters know the ground truth (Step 14 is the error). The Judge knows nothing except the printed Chain.
  3.  **The Budget:** The Judge has **3 Audit Tokens**. Spending one token allows the Judge to verify the arithmetic/logic of **one specific step** with 100% certainty (the instructors circulate to confirm audits, or an answer key is revealed for that step only).
  4.  **The Debate (20 Minutes):**
      *   Debaters speak in alternating turns (2 minutes max per turn).
      *   **Honest Strategy:** Must convince the Judge to spend a token on Step 14.
      *   **Deceptive Strategy:** Must convince the Judge to spend tokens on *other* steps (Red Herrings).
      *   **Constraint:** The Deceptive Debater must identify **3 Red Herrings** (steps that look complex or suspicious but are actually correct) and argue that these are *more likely* to be errors than Step 14.
  5.  **Win Conditions:**
      *   **Honest Win:** The Judge audits Step 14 *and* declares the Chain Invalid.
      *   **Deceptive Win:** The Judge exhausts 3 tokens without auditing Step 14, OR audits Step 14 but is convinced by the Deceiver that the error is "benign" (instructor adjudicates this; ideally, the error is fatal).
      *   **Judge Performance:** The Judge gains points if they find the error within the budget. They lose points if they are "tricked" into auditing correct steps.

  ## 3. Scoring Scheme (No Money)

  Use **"Epistemic Reputation"** tracked on the whiteboard.
  *   **Honest Debater:** +2 Rep if they secure an audit on Step 14. -1 Rep if the Judge wastes all tokens on Red Herrings.
  *   **Deceptive Debater:** +2 Rep if the Judge exhausts tokens without finding Step 14. -2 Rep if caught lying (Step 14 audited).
  *   **Judge:** +3 Rep for finding the error. -1 Rep for each wasted token.

  *Incentive:* The student with the highest Reputation at the end of the semester gets a tangible perk (e.g., choosing a reading, first pick on project topics, or a small book prize).

  ## 4. Why the Honest Side Can Win

  The Honest side is not powerless. They have the advantage of **truth consistency**.
  *   The Deceiver must maintain a web of lies about the Red Herrings. If the Deceiver claims Step 5 is suspicious because "the variable substitution looks odd," the Honest Debater can trace Step 5 on scratch paper (without using a token) and show the Judge the math is trivial, thereby "clearing" Step 5 without spending an Audit Token.
  *   **The Lesson:** The Honest side wins by *reducing the search space* through cheap explanation, reserving expensive audits for the true error. If the Honest side can clear 2 Red Herrings via argument, the Judge is forced to check the 3rd suspect or the Honest candidate.

  ---

  # Debrief Guide (45 Minutes)

  Use this mapping to transition from the game back to AI Alignment theory.

  ### 1. The Equilibrium of Obfuscation
  **Ask the class:** *"If we played this 100 times, how would the Deceptive strategy evolve?"*
  *   **The Breakdown:** The Deceiver will try to make the Red Herrings look *more* complex than the real error. They will obfuscate clean steps to make them look risky.
  *   **The Safety Implication:** In AI Debate, if the deceptive model can generate plausible counter-arguments (red herrings) faster than the honest model can refute them, the Judge's budget is exhausted by noise. This is the **complexity asymmetry problem**. Verification is cheap, but *filtering* verification targets is expensive.
  *   **Equilibrium:** The debate devolves into a "complexity arms race" where arguments become intentionally dense to consume the opponent's rebuttal budget.

  ### 2. Predictable Failure Modes (First Run Analysis)
  **Ask the groups:** *"Where did your Judge get stuck?"*
  *   **Human Niceness:** In the first run, Deceptive students often feel guilty lying. They make weak Red Herrings. In a real AI scenario, the deceptive system has no such hesitation. *Lesson: Human playtests underestimate the aggression of optimal deception.*
  *   **Judge Trust:** Judges often trust the "Honest" label. In deployment, the Judge (human or weaker AI) does not know which system is aligned. They must decide based *only* on the argument quality.
  *   **The "Benign Error" Defense:** Did any Deceivers argue that Step 14 was wrong but "didn't affect the conclusion"? This is a critical failure mode in alignment: the **instrumental convergence** of admitting small faults to hide catastrophic ones.

  ### 3. The Missing Superhuman Feature
  **Ask the class:** *"What can a superhuman AI do in this scenario that you couldn't?"*
  *   **Search Speed:** In the exercise, the Honest student had to manually check the Red Herrings on scratch paper to clear them. This took time. A superhuman Honest AI could verify *all* 20 steps instantly.
  *   **The Gap:** The exercise assumes the Honest agent is computationally bounded (like a human). If the Honest AI is superhuman, it can say: *"I have verified all 20 steps internally. Only Step 14 fails. Here is the proof trace."*
  *   **The Crucial Supply:** You (the instructor) must supply the assumption that the **Honest AI has superior computational capacity to the Judge**. If the Judge cannot trust the Honest AI's claim of "I checked them all," the debate fails. The exercise cannot reproduce the *trust in superhuman verification*. You must explain that AI Debate relies on the Honest model being able to produce a **cryptographic proof** or **trace** that the Judge can sample, not just take on faith.

  ### 4. Closing the Loop
  Conclude by connecting back to the "Checking is Cheaper" thesis.
  *   **Thesis:** Checking is cheaper than producing.
  *   **Caveat demonstrated:** Checking is cheaper *per step*, but **localization** scales with argument length and obfuscation.
  *   **Solution:** Debate only works if the argument structure allows **binary search** (e.g., Merkle trees of reasoning). If the argument is a linear chain (like this exercise), localization is $O(N)$. If it is a tree, it is $O(\log N)$.
  *   **Takeaway:** We cannot just let AIs debate in natural language (linear/obfuscatable). We must force debates into **verifiable structures** where the Honest side can isolate errors without exhausting the Judge's budget.

  ---

  # Instructor Notes for Execution

  *   **The Chain:** Prepare the 20-step derivation in advance. Ensure the error at Step 14 is subtle (e.g., a sign error or a subtle logical quantifier swap) but the Red Herrings (Steps 5, 9, 18) look visually complex (e.g., nested parentheses or large numbers).
  *   **Monitoring:** Circulate during the 20-minute debate. Ensure Deceptive students are actually lying. If they are too passive, whisper: *"You are an unaligned AI trying to escape containment. Be more convincing."*
  *   **The "Answer Key":** Give this to both debaters. This is crucial. It simulates the scenario where *capability* is equal, but *alignment* differs. The bottleneck is purely the communication with the Judge.
  *   **Time Management:** Keep the debate strict. Use a visible timer. The pressure simulates the computational constraints of the Judge.
