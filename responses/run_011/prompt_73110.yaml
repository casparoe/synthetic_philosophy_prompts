          8.  The Swap (Uptake-based gate consequences).
      *   *Refinement on "Stochastic Parrot":* Be careful not to say the hospital believes the LLM understands. The hospital believes the *text* works. The LLM is just a tool. The philosophical risk is that the hospital treats *human* understanding as similarly mechanical.
      *   *Refinement on "Teach-Back":* Emphasize that Teach-Back acknowledges the *context* (anxiety, pain) which the text cannot control.

  9.  **Self-Correction/Check during drafting:**
      *   *Did I cite anything?* No.
