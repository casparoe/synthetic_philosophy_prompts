answer: |-
  There is no single canonical term in ethics or psychology that captures this exact phenomenology. Your intuition is precise: you are describing a feeling that tracks **identifiability** rather than **causality** or **moral valence**.

  Here are the three closest established concepts, why they approximate your experience, and exactly where they break down.

  ### 1. Diffusion of Responsibility
  **The Concept:** A social-psychological phenomenon where individuals feel less personal responsibility to act (or less personal weight for an action) as the number of other people involved increases. The presence of others dilutes the sense of agency.
  **Where it fits:** It perfectly explains the scaling effect. With 400 signatures, the responsibility is diffused; with 4, it is concentrated. It also explains why the shower feels light (no social audience to share or witness the load) compared to the letter.
  **Where it fails:** It is almost exclusively used to explain *inaction* (the bystander effect) or the mitigation of *guilt* after a negative outcome. It presumes the feeling is about obligation to intervene or blame for harm. You explicitly state you feel no obligation and no guilt. This concept cannot explain why a *positive* or *neutral* act feels "heavy" simply because you are identifiable.

  ### 2. Complicity
  **The Concept:** An ethical status where an agent is implicated in the actions of a group or another person, even if their individual contribution was not causally necessary. It focuses on participation in a collective structure.
  **Where it fits:** It captures the "implication" without requiring causal pivotality. It explains why signing the letter feels different from the shower; one is a public participation in a collective stance, the other is private consumption.
  **Where it fails:** Complicity is inherently normative and usually negative (implying wrongdoing or harm). It does not scale inversely with group size in the way you describe; often, being one of many complicits makes one feel *less* individually stained (hiding in the crowd), but the concept itself doesn't account for the *phenomenological weight* of being singled out. It also doesn't dissolve upon joint decision-making; you can be complicit in a group decision just as easily as an individual one.

  ### 3. Imputability
  **The Concept:** A concept from action theory and law referring to the quality of an act that allows it to be ascribed to a specific agent as its author. An act is imputable if it can be rightly attributed to you.
  **Where it fits:** This matches your hunch about someone being able to "point at you." It distinguishes between things that happen *through* you versus things you *do*. The letter is an act of authorship; the shower water flow is a physical consequence.
  **Where it fails:** Imputability is typically binary (an act is either imputable to you or it isn't), not scalar. It does not account for the *degree* of weight. Being one of 400 imputable signatories is technically the same status as being one of 4, yet your experience differs. It also lacks the phenomenological component; it describes the structural relation between agent and act, not the felt "heaviness."

  ***

  ### Coined Term: Indexical Burden

  Since existing concepts fail to capture the scalar, phenomenological weight of being individually addressable within a collective, here is a definition for the specific feeling you are describing.

  **Definition:**
  **Indexical Burden** is the phenomenological weight an agent feels proportional to the ease with which an observer can form a singular referring expression (specifically the indexical "you") directed at them regarding an action, independent of the action's causal efficacy or moral valence.

  It measures the **resolution of agency**. When a collective act is high-resolution (few names, individual authorization), the agent appears as a distinct pixel, and the Indexical Burden is high. When the act is low-resolution (many names, joint authorization), the agent blurs into the aggregate, and the burden drops, even if the causal power of the aggregate is higher.

  **Why it fits your case:**
  *   **The Shower:** No observer is positioned to address you. Indexical Burden is near zero.
  *   **The Letter (400 names):** You are addressable, but only as part of a mass ("you all" or "the signatories"). The singular "you" is difficult to isolate. Low Burden.
  *   **The Letter (4 names):** You are easily isolated. The singular "you" is the natural mode of address. High Burden.
  *   **Joint Decision:** The authorization shifts from "I chose to sign" to "We chose to send." The indexical reference shifts from "you" to "us." The burden dissolves because the *unit of agency* has changed, not just the visibility.

  **Boundary Cases:**
  To test if this concept applies, check these scenarios:
  1.  **The Anonymous Donor:** You donate 50% of a small fund's total capital, but your name is secret.
      *   *Verdict:* **Low Indexical Burden.** Despite high causal impact and small group size, no observer can point and say "you." The feeling of heaviness should be absent.
  2.  **The Recorded Vote:** You are in a committee of 5, and votes are recorded publicly by name.
      *   *Verdict:* **High Indexical Burden.** Even if the decision is joint, the public record isolates your specific stance. You should feel the weight of being individually addressable for the outcome.
  3.  **The Algorithmic Contribution:** You contribute code to a massive open-source project used by millions. Your commit is in the log, but buried in thousands of others.
      *   *Verdict:* **Low Indexical Burden.** You are causally necessary but indexically invisible. You should not feel the "heaviness" of the project's success or failure personally.
  4.  **The Sole Signatory:** You sign a letter that no one else signs.
      *   *Verdict:* **Maximum Indexical Burden.** The singular "you" is the only possible address. The heaviness should be at its peak, regardless of whether the letter changes anything.
