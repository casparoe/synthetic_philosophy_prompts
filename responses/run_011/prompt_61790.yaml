  The pivotal feature is a rational transformation of fundamental values rather than a loss of capacity or information.

  At 35, Elena, committed to scientific progress, signed a binding research consent form mandating a painful, non-therapeutic spinal biopsy upon turning 65 to track aging. Now 65, fully competent, with perfect memory of her vow and unbroken psychological continuity, she refuses the procedure, arguing her youthful idealism was morally disproportionate. Her directive states: "Complete the study regardless of future reluctance." Her objection states: "My body is not data; comfort matters more." She would press this objection even if the contract had never existed, citing revised moral insight rather than weakness of will.

  The Critical Interests account (Dworkin) binds the directive. It holds that a life's narrative integrity outweighs transient experiential welfare; Elena's youthful commitment reflects her critical judgment on what makes a life good, which retains authority over later whims. The Experiential Interests account (Utilitarian) voids it. Moral claims arise only from present consciousness; the 65-year-old's desire to avoid pain is a real felt interest, while the 35-year-old's wish is a historical ghost with no current welfare weight. The Psychological Continuity account (Parfit) voids it. Since psychological continuity holds, the later self is the same person; authority resides in the current locus of agency, not the historical predecessor, unless capacity is diminished. The Foreseeability account (Hypothetical Consent) binds it. Had 35-year-old Elena foreseen this value shift, she would have deemed it a corruption to be prevented, reinforcing the pre-commitment as a safeguard against moral error.

  If the value transformation were removed—suppose she still believed the study vital but merely feared the pain—all accounts would uphold the directive, as the conflict would be between courage and comfort, not competing moral truths. The Experiential account fares worst. It faces the "Shelf-Life" objection: if only present interests matter, persons cannot undertake long-term obligations (marriage, careers, debts), rendering autonomy incoherent over time. It fails to distinguish between a change in preference and a betrayal of commitment, reducing the person to a series of momentary selves incapable of planning.
