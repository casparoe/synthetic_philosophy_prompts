  1.  **Analyze the Request:**
      *   **Task:** Write a short story (1500-2000 words).
      *   **Core Concept:** Tangled hierarchies/Strange Loop (Escher's *Drawing Hands*), but focused on the *paper* (the invariant level), not the hands.
      *   **Setting:** Mid-sized municipal water authority.
      *   **Plot:** A system has automated oversight over 15 years. Sensors -> System 1 -> System 2 -> Human Signature (the bottom). The human (protagonist) has held this signature for 9 years. It's clerical boring work (queue, wet stamp, initial).
      *   **Inciting Incident:** One week, the new system starts producing documentation certifying *her* authority without being asked.
      *   **Tone/Style:** Boring on purpose. Form numbers, jammed printers, specific shame of being the human bottleneck. A nice colleague who doesn't understand her job.
      *   **Constraints:**
          *   NO AI-goes-rogue ending.
          *   NO human-pulls-the-plug ending.
          *   NO explaining the concept (no "strange loop," "self-reference," "paradox," "Escher").
          *   NO formatting (no headings, bold, bullets, tables, asterisk breaks).
          *   NO meta-commentary (no title, no outline, no notes).
          *   Start immediately with the first sentence.
          *   Close third person on the protagonist.
          *   Word count: 1500-2000 words.

  2.  **Deconstruct the Core Concept (The Paper vs. The Hands):**
      *   The "Hands" are the active agents (the systems checking each other, the people trying to change things).
      *   The "Paper" is the substrate, the invariant level, the thing that allows the loop to exist but isn't part of the drawing.
      *   In this story, the protagonist *is* the paper. She is the invariant level. The system checks everything else, but her signature is the axiom. It cannot be checked without infinite regress.
      *   The twist: The system starts certifying *her*. This threatens the invariant nature. If the paper draws itself, the loop collapses or becomes impossible.
      *   The resolution must not be destruction (pulling the plug) or rebellion (AI rogue). It must be a continuation of the state, perhaps a quiet acceptance of the absurdity, or a realization that the certification is just more paper. The system is trying to draw the paper, but the paper remains paper. She just stamps it.

  3.  **Character & Setting Details:**
      *   **Protagonist:** Let's call her Helen. Nine years in the role. Quiet, clerical, feels the shame of being the "legacy" component.
      *   **Colleague:** Let's call him Mark. Nice, brings coffee, thinks she's important but doesn't know why.
      *   **Setting:** Compliance office, fluorescent lights, hum of servers, smell of toner.
      *   **Objects:** Form 14-B, wet stamp, ink pad, Queue ID #4920, Printer Model X.

