      *   **Climax (Quiet):** She processes the form. She realizes what it is. She doesn't stop it. She stamps it.
      *   **Ending:** The loop closes visually but not verbally. She continues working. The system continues. The invariant holds because she treats the meta-form like any other form.

  5.  **Writing - Focus on Tone:**
      *   Keep it dry. Administrative horror without the horror.
