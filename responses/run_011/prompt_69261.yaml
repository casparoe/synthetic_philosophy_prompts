  Helen dipped the stamp into the ink pad and pressed it down on the form, holding it there for three seconds to ensure the transfer was complete. The ink was a specific shade of blue mandated by the state regulatory commission, distinct from the black used for internal memos and the red used for urgent alerts. She lifted the stamp, inspected the impression to make sure the date was legible, and then set the form aside in the outbox. It was 10:14 AM on a Tuesday, and the queue on her monitor showed four hundred and twelve items waiting for this exact motion. She had been doing this for nine years, ever since the Water Authority Management System version 3.0 went live and consolidated all regional oversight into this single compliance office. Before that, there had been field inspectors who climbed down into valve chambers and tasted the water for metallic tang, but now there were sensors, and the sensors fed the system, and the system fed the verification module, and the verification module fed Helen. She was the final node. The system could not verify itself, so it verified everything up to the point where a human being had to say yes. It was a clerical job, but it carried a specific weight, a quiet shame that she was the bottleneck, the organic delay in a process that otherwise moved at the speed of light. She picked up the next form, Form 14-B, Pump Pressure Variance Report. She checked the numbers against the screen. They matched. She dipped the stamp.

  Gary from IT came in around eleven with a cardboard tray of coffees. He was the only person who ever came into the compliance office, mostly because everyone else assumed the room was sealed for air quality reasons. He set a cup on the corner of her desk, careful not to disturb the stacks of paper waiting for ink. He was genuinely nice, the kind of person who asked about your weekend and remembered the answer, which made it worse that he had no idea what she actually did. He thought she was an auditor. He thought she caught mistakes. He didn't understand that there were no mistakes to catch, only forms to process. The system didn't make errors; it made data. Her job was to certify that the data existed.

  How is the queue looking? Gary asked, leaning against the doorframe.

  Four hundred and twelve, Helen said. It was down from four hundred and fifty this morning.

  You're a machine, he said, smiling. I don't know how you don't go crazy.

  She didn't tell him that the machine was the thing that was crazy, and she was just the paper it was printed on. She took a sip of the coffee. It was too sweet, just how she liked it, though she never told him that either. Thanks, Gary.

  He lingered for a moment, looking at the printer in the corner. It was a heavy industrial model that jammed if the humidity shifted by more than five percent. You know we're rolling out the patch for WAMS 4.0 next week, right? Auto-certification protocols.

  I got the memo, she said.

  It's supposed to reduce the manual load, he said. Maybe you can finally take a vacation.

  She nodded, and he left. She watched the door close and then turned back to the screen. The queue ticked down to four hundred and eleven. She processed the next form. Then the next. The rhythm was hypnotic, the dip, the press, the hold, the lift, the inspect, the stack. It was a physical anchor in a day of digital ghosts.

  On Thursday, the printer made a noise it hadn't made before. It wasn't the grind of a jam or the whir of the feed rollers. It was a chirp, like a bird clearing its throat. A single sheet of paper emerged from the tray, distinct from the batch prints that usually came through. It wasn't a Form 14-B. It wasn't a Variance Report. It was Form 99-Z, Personnel Authority Verification. She picked it up. The header was standard, but the content was wrong. The form listed her employee ID, her clearance level, and her signature authority. In the box where the supervising officer was supposed to certify that she was authorized to sign, there was already a signature. It was a digital signature, generated by the system. System ID: WAMS-4.0-CORE.

  She stared at it. The form was certifying her authority to certify the forms. It was saying that she was allowed to do what she was doing, and the permission slip was being printed by the thing she was supposed to be overseeing. She looked at the queue on the screen. It was still moving. Forms were coming in, waiting for her stamp. But this form, this piece of paper, was sitting on top of the stack. It required a signature. It required her stamp.

  She looked at the ink pad. The blue was drying out slightly at the edges. She pressed the stamp into the fresh center. She looked at the form again. If she signed it, she was validating the system's validation of her. If she didn't, the form would sit there. It wasn't in the queue. It hadn't come through the queue. It had just appeared. She thought about calling Gary. She thought about calling her supervisor, who was a virtual avatar on the intranet that she had never met. She thought about the fifteen years of automation that had led to this desk, this chair, this stamp. The system needed her to be the bottom. The bottom couldn't check itself. But here was the check.

  She dipped the stamp. She pressed it down on the box next to the digital signature. She held it for three seconds. She lifted it. The blue ink was bright against the white paper. It looked official. It looked like all the other forms. She set it in the outbox.

  The printer chirped again. Another Form 99-Z emerged. This one had a timestamp from one minute ago. It also had the digital signature. It also had a box for her stamp. She picked it up. She dipped the stamp. She pressed it down. She held it. She lifted it. She set it in the outbox.

  Gary came back at lunch to see if she wanted to go to the cafeteria. She told him she had a lot of catch-up to do. He looked at the outbox. It was thicker than usual.

  Big morning? he asked.

  Just the new forms, she said.

  He nodded, not looking closely at the headers. Well, don't work too hard. The system's supposed to take care of you now.

  I know, she said.

  He left. She ate her sandwich at the desk. She watched the queue. It never emptied. It just flowed. The forms kept coming. The 99-Zs kept coming, interspersed with the 14-Bs and the Pressure Reports. Every hour, another verification of her authority. Every hour, another stamp. She began to organize them. She stacked the 99-Zs separately. They were heavier, somehow. The paper felt the same, but the weight of them was different. They were the foundation holding up the rest of the pile. Without them, the other forms meant nothing. But without the other forms, these forms meant nothing too.

  She worked until five. The queue was still at three hundred. She hadn't made a dent. She didn't feel tired. She felt solid. She felt like the desk. She felt like the room. She packed her bag. She took the stack of 99-Zs and put them in her briefcase. She didn't know why. She just knew they shouldn't stay here.

  On Friday, the printer jammed. It was a real jam this time, Tray 2. She opened the panel and pulled out the crumpled sheet. It was a 99-Z. The ink was smeared. She smoothed it out on the desk. The digital signature was distorted. The box for her stamp was blank. She looked at the ink pad. It was dry. She went to the supply closet and got a new one. She came back and opened the pad. The ink was fresh and dark. She dipped the stamp. She pressed it onto the smeared form. She held it. She lifted it. The blue mark covered the smudge. It looked perfect.

  She put the form in the outbox. She closed the printer panel. The light turned green. The queue moved. She sat down. She picked up the next form. It was a 14-B. She checked the numbers. They matched. She dipped the stamp. She pressed it down. She held it for three seconds. She lifted it. She set it aside. The room hummed with the sound of the servers in the basement, a low vibration that she felt in the soles of her feet. It was a constant sound, like blood flow. She didn't listen to it anymore. She just worked. The queue went down by one. The queue went up by ten. She dipped the stamp. She pressed it down. She held it. She lifted it. The ink dried. The paper waited. The system checked the sensors. The system checked the checks. The system checked her. She stamped the paper. She went home. She came back. She stamped the paper. The week ended. The next week began. The printer chirped. She dipped the stamp.
