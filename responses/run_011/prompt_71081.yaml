  The package does not hang together; abandoning the strict expectabilism of (1) in favour of a hybrid duty-based account buys the most coherence.

  1. **Severity: Critical. (1) versus (4) and (5).**
     *   **Damaging Commitment:** (1).
     *   **Conflict:** (1) asserts wrongness is fixed *just* by expected outcome. (4) and (5) condemn acts where expected outcome is stipulated null or negligible. You cannot claim expected utility is the sole determinant while assigning blame where utility is unchanged.
     *   **Repair:** Restrict (1) to direct harm-imposition, allowing non-consequentialist duties (fairness, participation) to govern (4) and (5).
     *   **Loss:** Theoretical unity. You lose the principle that consequences exhaust morality. Specifically, you lose the ability to tell the inefficacy objector that consumption is wrong *only* because of expected harm; you must admit some acts are wrong due to complicity or fairness alone, weakening your reply to actualists who demand causal linkage.

  2. **Severity: Moderate. (4) versus (6).**
     *   **Damaging Commitment:** (6)'s offset validation.
     *   **Conflict:** (4) assigns blameworthiness for overdetermined harm despite zero expected impact. (6) allows offsets to discharge wrongness for flights (expected harm). If overdetermination wrongness is non-causal, offsets (which work causally or compensatorily) should not discharge it, yet (6) implies a general discharge mechanism.
     *   **Repair:** Stipulate offsets discharge only probabilistic wrongs, not participatory ones.
     *   **Loss:** Uniformity. You lose the elegant rule that 'harm plus offset equals permissibility'. You must concede that some harms (overdetermined) stain the agent permanently, whereas others (probabilistic) can be cleansed, requiring a complex taxonomy of impermissibility.

  **Clearances**

  (2) and (5) appear conflicting but survive because markets and elections differ empirically regarding threshold probabilities; distinguishing them is evidence-sensitive, not ad hoc. (3) and (5) survive because a 'joint undertaking' requires only coordinated individual dispositions, not a metaphysical group agent, satisfying your individualism.
