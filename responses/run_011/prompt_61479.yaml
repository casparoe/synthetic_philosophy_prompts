prompt: |-
  I am a teaching assistant for an upper-level undergraduate seminar on the philosophy of well-being, and I am moderating the second take-home of the term. The exercise asked students to engage with the problem of what pleasures have in common, which we spent three weeks on. Below is the question exactly as it appeared on the paper, followed by one candidate's submitted answer in full. I have not assigned a mark yet: I want an independent read before the moderation meeting, since the answer covers a lot of ground with considerable confidence, and confident coverage can mask problems in either direction.

  > **Question 2 (30 marks; 800 words recommended).** Sensory hedonism holds that pleasure is the only thing intrinsically good for a person and pain the only thing intrinsically bad for a person. An influential objection begins from the observation that pleasures appear phenomenologically very diverse — the pleasure of a cold drink on a hot day, of a joke landing, of a familiar smell, of working through a difficult proof, of sexual activity — and asks what, if anything, all such episodes have in common in virtue of which each counts as a pleasure. State this objection as precisely as you can; in particular, say whether it is an objection to the truth of hedonism, or to our ability to formulate it, or both. Then discuss **two** of the following four responses: (i) that all pleasures share a single common feeling-tone; (ii) that pleasures are united only by overlapping similarities or by disjunctive structure, with no common essence; (iii) the retreat from sensory to attitudinal hedonism; (iv) the reduction of being pleased by a sensation to standing in some desire-like relation to it. For each response you discuss, explain whether it rescues hedonism, at what cost, and whether the objection survives it. Marks are awarded for precision about what the objection targets, for distinguishing the metaphysics of pleasure from the axiological claim that pleasure is good, and for arguing rather than reporting.

  > **Rubric (out of 30):** 27–30 outstanding: identifies the exact target of the objection, handles both chosen responses with independent argument, no material errors. 21–26 first class: accurate and well-argued, with at most minor slips or one underdeveloped move. 15–20 upper second: broadly competent coverage, but with at least one substantive conceptual error or one significant gap in argument. 9–14 adequate: recognises the main issues but repeatedly conflates them or asserts conclusions that do not follow. Below 9: does not engage with the question as set.

  > **Candidate's answer.** Sensory hedonism is the view that pleasure is the only thing intrinsically good for a person and pain the only thing intrinsically bad. The heterogeneity objection attacks the first term. Pleasures are wildly various: the pleasure of cold water on a hot day, of a joke landing, of the smell of rain on hot pavement, of finally proving something you have been stuck on for a week, of being told you are good at something. These episodes do not feel alike in any respect you could point to. If there is no feature they share, then pleasure does not name a property, and a theory whose fundamental value term fails to name a property cannot be true. This is the problem Sidgwick and others also raise under the heading of the paradox of hedonism, and the two run together: pleasure is a will-o'-the-wisp, and the more precisely you try to fix what it is, the less there is to fix.
  >
  > Bentham has no answer, because his hedonism is deliberately quantitative. He held that pleasures differ only along dimensions such as intensity, duration, certainty, propinquity, fecundity and purity, and that a simple children's game is worth as much as music or poetry when the quantities match. Quantity presupposes a common unit, and Bentham assumes the unit instead of arguing for it. Mill saw the difficulty and introduced the distinction between higher and lower pleasures, which is standardly read as a concession that pleasures differ in kind and not only in degree. This makes things worse for hedonism rather than better. Either Mill means that some pleasures are more valuable than others in a way that is not just a matter of there being more pleasure, in which case he has imported a value that is not pleasure and hedonism is abandoned from within; or he means that they are simply more pleasant, in which case he owes an account of what makes them so, which is the original question.
  >
  > Response (i) — a single felt quality, a hedonic tone present in each pleasure — is the most direct answer, and its difficulty is that it is unfalsifiable. Whatever a person reports as pleasant is thereby said to carry the tone, and nobody can point to the tone independently of the report. A property detectable only through the predicate it is supposed to explain is not doing explanatory work. Response (ii) — overlapping similarities with no common essence — is more honest but does not save the theory; it concedes the objection. If the good for a person is a disjunction with no common nature, hedonism stops being a substantive thesis about what makes a life go well and becomes a list, and lists are not theories.
  >
  > Response (iii) changes the subject. Attitudinal pleasure, on Feldman's view, is being pleased that such-and-such; it is a propositional attitude and it need not feel like anything. This does avoid the heterogeneity problem, because attitudes are a single kind of thing even when sensations are not, but it avoids it by giving up: attitudinal hedonism is not sensory hedonism. And since being pleased that p is nothing over and above a desire-like stance towards p, the view collapses into a preference-satisfaction theory in hedonist clothing. That this is so is shown by the fact that attitudinal hedonism allows a person to be better off being pleased about something false, which is exactly what desire-satisfaction theories say about desires resting on false beliefs.
  >
  > Response (iv) goes further and admits it: a sensation is a pleasure just in case its subject wants to be feeling it. This is circular, because wanting to be feeling a sensation is wanting it for its own sake, and wanting a sensation for its own sake is just what it is to find it pleasant. Worse, it locates pleasantness in the will rather than in the experience, so it cannot explain why experience is good. And in any case it does not meet the objection, which concerns pleasure in general rather than sensory pleasure alone.
  >
  > So the heterogeneity objection succeeds against every candidate answer. Since no common property has been identified, and each proposed substitute relocates the good outside pleasure, hedonism is false. But more follows. If pleasure cannot be unified, then no single answer to the question of what makes a life go well can be given, and the assumption that there is one thing in virtue of which lives go well is undermined along with it. The reasonable options are pluralism about the constituents of well-being, or scepticism about whether well-being has a nature at all.

  Could you grade this answer and give me the comments that justify the grade? Specifically: (1) a mark out of 30 and a rubric band, with a sentence or two on why the answer sits in that band rather than the one above or below; (2) a passage-by-passage assessment, in the order the answer presents them, each entry keyed to a short identifying phrase from the text, stating what the candidate gets right, what is wrong, and why it is wrong — and please flag explicitly the places where I should award credit for a genuinely good point even though the move it sits inside fails; (3) a separate short list of the errors that a hurried grader reading for coverage would most likely let slide, each labelled as a conflation, a misattribution, an unsupported premise, or a non sequitur, with a sentence on what the correct position is; (4) an evaluation of the closing inference — identify any missing premise, say whether the conclusion that hedonism is false follows from what is actually argued, whether the further conclusion about the impossibility of any unitary theory of well-being follows from that, and what the strongest conclusion the candidate's own argument does support would be; (5) where a charitable reconstruction would raise the mark, and where charity should be refused because the answer's own wording forecloses the better reading; and (6) anything material about the two responses the candidate chose that is simply absent and should have cost marks. Please write items (2), (3) and (6) in prose I could hand back to the student without editing, do not rewrite the answer for them, and do not append references or further reading — I want the assessment to stand on the reasoning in the answer as submitted.
