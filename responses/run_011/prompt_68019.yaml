answer: |-
  A genuine linguistic-relativity effect is established when linguistic or orthographic structure automatically biases non-linguistic processing during the task or entrenches habitual attentional routines via communicative necessity, provided the effect survives controls for strategic translation, demand characteristics, and data instability.

  I considered and discarded three simpler principles before settling on this: an "offline-only" clause (killed by your confidence in the Russian blue result), a "capacity-change" clause (killed by your acceptance of the cardinal-direction habit), and a "grammar-only" clause (killed by your acceptance of writing-direction effects).

  **Reasoning Clause by Clause**

  1.  **"Linguistic or orthographic structure"**: This clause is motivated by your verdict on **Case 7 (Writing Direction)**. You accept that reading direction shapes spatial reasoning despite it being a cultural technology rather than innate grammar. If you delete this, you force a distinction between grammar and orthography that your intuitions explicitly reject, rendering Case 7 a cultural artifact rather than a relativity effect.
  2.  **"Automatically biases non-linguistic processing during the task"**: This clause is motivated by **Case 2 (Russian Blue)**. You accept this because the verbal working-memory load kills the effect, proving the perception depends on automatic linguistic coding. If you delete this, you open the door to **Case 3 (Gendered Objects)**, allowing effects where participants strategically translate or perform for the experimenter rather than experiencing automatic bias.
  3.  **"Or entrenches habitual attentional routines via communicative necessity"**: This clause is motivated by **Case 4 (Cardinal Directions)**. You accept this as a real phenomenon despite it being trainable habit rather than fixed capacity. If you delete this, you exclude large-scale spatial cognition effects simply because they are skills, narrowing relativity to only transient online priming.
  4.  **"Provided the effect survives controls for strategic translation, demand characteristics, and data instability"**: This clause is motivated by your rejections of **Case 1 (Hopi)**, **Case 3 (Gendered Objects)**, and **Case 5 (Pirahã)**. You reject Case 1 on determinism/descriptive grounds, Case 3 on demand characteristics, and Case 5 on data integrity. If you delete this, you lose the ability to distinguish genuine cognitive bias from experimenter framing or unreliable fieldwork, validating the "boring artifacts" you wish to exclude.

  **Predictions on Unlisted Cases**

  1.  **Count/Mass Distinction (Object Grouping):** **Conditional Accept.** If speakers group objects by material vs. shape even under verbal interference, this fits the "automatic bias" clause. If the effect disappears when verbal working memory is loaded, it is strategic sorting and should be rejected as an artifact similar to Case 3.
  2.  **Mandatory Evidentiality (Source Memory):** **Accept.** This fits the "habitual attentional routines via communicative necessity" clause. Speakers must attend to information source to speak grammatically; this communicative necessity should entrench a habit of better source memory, analogous to Case 4 (Cardinal Directions).
  3.  **Effects Appearing Only in L2:** **Reject.** If an effect appears only when tested in a second language, it fails the "automaticity" and "habit" clauses for native cognition. This indicates proficiency load or temporary priming rather than a restructuring of cognitive routine, making it a methodological artifact rather than relativity.

  **Casualties**

  To maintain this principle, you must downgrade **Case 6 (Bilingual Personality)** from "half-accept" to **reject**. Your own intuition suspects this is "audience and cultural frame" rather than grammar; my principle classifies this under "demand characteristics" and "strategic translation" (performing the personality appropriate to the language context). While real, it is pragmatic audience-design, not a structural linguistic bias on cognition. Keeping it blurs the line between relativity and social code-switching. Additionally, you must tighten your acceptance of **Case 4 (Cardinal Directions)**: it counts only if the orientation is automatic during the task, not just trainable over weeks; if it requires conscious calculation, it falls under "strategic translation" of spatial coordinates.
