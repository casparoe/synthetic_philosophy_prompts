      *   **Key Constraint 1 (Argument Quality):** They must actually argue, respond to each other, concede points, and land blows. No strawmen, no one sounding thick, both well-read and wanting the right thing. No outright winner.
      *   **Key Constraint 2 (Conceptual Spine):** Use the user's coined terms: "verdict-commemoration" vs. "loan-commemoration".
          *   *Verdict:* Naming is a one-off settled judgement by contemporaries; reopening makes every name an open case file.
          *   *Loan:* Honour is standing credit extended by the public; name is a live endorsement; question is whether *we* are willing to keep lending.
      *   **Key Constraint 3 (Specific Issues):**
          *   Does loan view collapse into a permanent renaming tribunal?
          *   Does verdict view hand moral monopoly to 1897 council?
          *   The Compromise: Keep name + plaque about infirmary contract. Is it a solution or a footnote nobody reads?
      *   **Key Constraint 4 (Unglamorous Constraints):**
          *   *Replacement Problem:* Renaming means naming after someone else who also has flaws.
          *   *Address Problem:* 200 households, deeds, deliveries, blue-light callouts, resentment of faff. Is the faff morally relevant?
      *   **Pre-writing:** Visible brainstorming (3-4 positions, select 2).
      *   **Post-writing:** Short paragraph on which side I found more persuasive and what would move me.
