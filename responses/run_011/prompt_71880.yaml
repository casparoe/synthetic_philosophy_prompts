  2.  **Brainstorming Positions:**
      *   *Position A (Status Quo/Verdict):* Keep the name. The past is a foreign country; judging them by today's standards is ahistorical. The waterworks achievement outweighs the workhouse negligence. The "faff" of renaming is a genuine harm to residents.
      *   *Position B (Removal/Loan):* Remove the name. We are currently endorsing her. The workhouse deaths are on our hands if we keep the sign. The plaque is whitewashing.
      *   *Position C (The Plaque/Contextualist):* Keep the name but add the plaque. It turns the street into a history lesson rather than a shrine. Nuance over erasure.
      *   *Position D (The Blank/Process):* Remove the name but don't replace it immediately. Or, rename after a collective (e.g., "The Waterworkers"). Avoids the Replacement Problem.
      *   *Selection:* I need friction around "Verdict" vs. "Loan".
          *   Character 1 (Verdict): Let's call him *Arthur*. He argues that renaming creates instability and that the original act was valid *then*. He cares about the Address Problem as a moral weight (disruption is harm).
          *   Character 2 (Loan): Let's call her *Priya*. She argues that the name is a current endorsement. She tackles the Plaque compromise hard (is it enough?). She needs to address the Replacement Problem without falling into the trap of finding a saint.

  3.  **Drafting - Section by Section:**
