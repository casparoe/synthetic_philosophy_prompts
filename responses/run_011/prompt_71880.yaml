answer: |-
  **Brainstorming Positions**

  1.  **The Fossilist (Verdict-Heavy):** The name is a historical artifact, not a current endorsement. Changing it rewrites history rather than correcting it. The "faff" of renaming is a tangible harm to residents that outweighs abstract moral purity.
  2.  **The Trustee (Loan-Heavy):** We are current trustees of the public space. Keeping the name is an active choice to honour her *now*. If she fails our current standards, the credit is called in. The plaque is a cowardly compromise.
  3.  **The Contextualist (Plaque-Heavy):** Keep the name, add the plaque. It turns the street into a teaching moment. Nuance is better than erasure. (I will fold this into the debate as the proposed compromise both characters critique).
  4.  **The Renamer (Replacement-Focused):** Remove Crace, but don't pick a new hero. Name it after a concept or event (e.g., "Waterworks Way") to avoid the Replacement Problem of finding another flawed human.

  **Selection:** I will pair **The Fossilist (Arthur)** holding the **Verdict** view against **The Trustee (Priya)** holding the **Loan** view. This creates the cleanest friction around the user's specific terminology while allowing the practical constraints (addresses, plaques) to be tested against their philosophies.

  ***

  **Dialogue: The Committee Room**

  **Arthur:** You're treating the street sign like a tweet, Priya. That's the core of it. If we adopt your loan-commemoration view, every name becomes a live endorsement subject to daily review. Martha Crace isn't asking us for a loan today; she received a verdict in 1897. That verdict belonged to the people who knew her, who drank the water she funded, who survived the cholera. We're overturning a settled case based on evidence they didn't have.

  **Priya:** They had evidence, Arthur. They chose not to look. But that's not the point. The point is that the sign isn't a museum plaque locked in a glass case. It's functional. When a delivery driver reads "Crace Row", or a child walks to school under it, the community is implicitly saying, "This is someone we regard highly." If I keep a portrait of a benefactor in my hallway, and then find out they poisoned their business partners, taking the portrait down isn't rewriting history. It's stopping my own complicity. The loan view says the honour expires if the conduct breaches the terms.

  **Arthur:** But who sets the terms? That's where your view collapses into a permanent renaming tribunal. If we say the public can call in the loan whenever moral standards shift, we guarantee instability. Today it's workhouse mortality rates; tomorrow it's someone's private correspondence; next year it's a political donation. The verdict view protects the street from becoming a weather vane. It says: "This was the judgement *then*." It allows us to condemn Crace's actions in a history book without dismantling the address database of two hundred households.

  **Priya:** You're hiding behind the database. I know the Address Problem matters—solicitors' deeds, blue-light callouts, the sheer faff of it. But you're treating that faff as merely logistical. I'm arguing it's morally relevant only if the name is worth keeping. If the name is toxic, the faff is the price of hygiene. But let's talk about the compromise. The History Society wants the name kept with a plaque detailing the infirmary contract. Does that satisfy your verdict view?

  **Arthur:** It bridges the gap. It acknowledges the new evidence without erasing the old judgement. It adds context.

  **Priya:** Does it? Or is it commemoration with a disclaimer attached? A footnote nobody reads at knee height. If I put a plaque on a statue saying "This man was a philanthropist who also beat his children," have I nuanced the honour, or have I just admitted the honour is unmerited while keeping the statue up to avoid the cost of removal? If the loan is called in, a plaque is just us saying, "We know you're unfit, but you're too expensive to remove."

  **Arthur:** That's cynical. It says, "History is complex." Your loan view demands moral purity in the subject. There is no one pure enough. That's the Replacement Problem. If we remove Crace, who goes on the sign? Someone else. They will have a paper trail. They will have flaws. Are we just shunting the difficulty one street along? If we rename it after a suffragette, we'll find out in ten years she held problematic views on empire. Then we're back here. The verdict view accepts that the original namers took a risk on a human being. They backed Crace for the water. She delivered the water. The verdict was "Water Bringer." The workhouse stuff is a footnote to that specific verdict.

  **Priya:** No, because the workhouse wasn't a footnote to her life; it was a significant portion of her public power. She chaired the Board of Guardians. She knew the mortality returns were massaged. That's not a private flaw; that's public malfeasance. To your point about the Replacement Problem: yes, anyone we pick will be flawed. But we can choose values rather than people. Name it "Waterworks Way". Name it "Guardians Row" ironically. But keeping Crace is specifically endorsing *her*. And here's where your verdict view hands a moral monopoly to the council of 1897. Why do their values get to lock us in? They named her when women couldn't vote, when the workhouse poor had no voice. Why does their judgement bind us forever, but our judgement is only temporary?

  **Arthur:** Because stability is a public good. You keep mentioning the residents. Two hundred households. They resent the faff enormously. I'm not saying their annoyance outweighs justice, but I am saying that constant churn erodes trust in the environment. If street names change with every moral generation, the street loses its identity. It becomes transient. The verdict view gives the street a backbone. It says, "This is what happened." We can teach the children about Crace's sins in the school down the road. We don't need to change the postcodes.

  **Priya:** But the postcode *is* the commemoration. That's the loan view in a nutshell. If I live on Crace Row, I am living inside her honour. If her honour is tainted by neglected deaths, I am inhabiting a space defined by that neglect. You say the verdict was "Water Bringer." I say the verdict was "Person of Standing." If her standing was purchased with ignored deaths, the credit is bad. And on the plaque: if it's at knee height, it's an apology we're too proud to make properly. It's us wanting to look virtuous without paying the removal cost.

  **Arthur:** So you admit cost is a factor.

  **Priya:** I admit cost is a constraint, not a moral argument. But you're using the Address Problem as a shield. You say the faff is morally relevant. How?

  **Arthur:** Because disruption is harm. Confusion for emergency services is harm. The cost of reprinting deeds is a financial tax on residents for a moral gesture they didn't author. If we impose that tax, we are saying our moral comfort is worth their inconvenience. That's elitist. We sit in this room, feel virtuous about correcting history, and the single mother in number 42 has to update her bank details and explain to her employer why her address changed. That's a tangible harm. The verdict view spares them that. It says, "The past is fixed. We deal with it in books, not in land registries."

  **Priya:** That's powerful, Arthur. I'll concede that. If the faff is a tax on the vulnerable, we need a high threshold to trigger it. But does the verdict view allow for *any* removal? If Crace had been a serial killer, would you keep the name because the 1897 council said yes?

  **Arthur:** ...Serial murder is different. That breaches a universal constant, not a shifting moral standard.

  **Priya:** So there is a limit. Which means it's not really a verdict view. It's a loan view with a very long term. You're saying the loan only expires if the crime is heinous enough to override the stability argument. So we're arguing about the interest rate, not the principle. Is ignoring massaged mortality returns heinous enough?

  **Arthur:** (Pauses) It's not serial murder. It's bureaucratic negligence enabled by philanthropy. It's the banality of it that makes it hard. If we remove her, we imply that only saints deserve streets. If we keep her, we imply we don't care about the workhouse dead. The plaque... if the plaque were prominent. Not at knee height. If it were a second sign, same size. "Martha Crace: Provided Water 1890. Oversaw Infirmary 1895. Mortality Rates Concealed."

  **Priya:** Then it's not a street name anymore. It's a history panel. You lose the honour entirely. Which brings me back to the Replacement Problem. If we strip the honour, why keep the name? Why not "New Water Row"?

  **Arthur:** Because "New Water" is sterile. Crace is a story. Even a bad story is better than no story. But I hear you on the knee-height plaque. That is a disclaimer, not an explanation. If we keep the name, the context must be equal weight. But I still worry about your tribunal. If we set the bar at "concealed mortality," where does it stop? Every Victorian fortune has blood in the mortar.

  **Priya:** Then we stop when the cost of keeping the name outweighs the cost of changing it. Not just financial cost. Moral cost. If the name causes active pain to the descendants of the workhouse poor, that's a harm too. You count the residents' inconvenience; I count the descendants' exclusion.

  **Arthur:** Fair. But we don't know who the descendants are. We do know who lives in Crace Row now.

  **Priya:** So we privilege the current residents over the historical victims.

  **Arthur:** We privilege the living over the dead. That's all any council can do.

  **Priya:** (Sighs) Then we're back to the threshold. Is this bad enough to disrupt the living? I don't know. But I know the knee-height plaque is cowardice.

  **Arthur:** Agreed. If we keep the name, the story must be told properly. But if we change it, we must admit we're not finding a saint, just a different sinner.

  **Priya:** Or we name it after the water. Not the bringer. The thing itself.

  **Arthur:** "Clear Water Row"? Sounds like a spa.

  **Priya:** (Smiles briefly) Then we have work to do.

  ***

  **Post-Script**

  I found the **Loan view** more persuasive, primarily because public space is inherently communicative. A street name is not a fossil; it is a signal sent by the current authority to the current population. Keeping a name is an active choice, not a passive inheritance. However, Arthur's point about the **Address Problem** being a moral harm (rather than just logistical noise) was the specific thing that gave me pause. Disrupting the lives of vulnerable residents for the sake of symbolic purity is a genuine ethical cost. I would be moved to support renaming only if the "loan" was deemed so severely in default (e.g., active malice rather than negligence) that the moral cost of keeping the name outweighed the tangible harm of the change. Otherwise, the "equal weight plaque" compromise Arthur reluctantly entertained seems the most honest path: retaining the history without retaining the honour.
