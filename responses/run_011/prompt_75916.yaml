          *   *Implication:* If a horticulturist knew monoculture was risky, the *system* was at fault, not the government. The government couldn't fix a biological law. It shifts blame from the state to the peasant's choice of crop.

      *   **Q5: Working Hypothesis (Theodicy/Political Exemption)**
