  # Decision Tree: Views on Cooperative Commitment

  **Root:** You accept that two agents in a game with several good-but-conflicting outcomes could each do better by binding themselves in advance, as long as the binding leaves each of them no worse off than they'd have been by default.

  ### The Branch Questions

  **Q1. The Risk of Misprediction**
  Imagine you propose a deal assuming the other driver would have swerved left. They actually would have swerved right, making your deal bad for them compared to their true default. Who absorbs that loss?
  *   (A) **You guarantee it:** You absorb the loss to ensure they aren't worse off.
  *   (B) **They accept it:** They take the risk of your proposal; if it's bad, they reject it.
  *   (C) **Deal voids:** If the guess is wrong, the deal is cancelled; no one moves.

  **Q2. The Visibility Requirement**
  *(Asked to A and C)* To ensure the loss is covered (A) or the guess is right (C), must you be able to inspect their actual decision procedure ("source code") before committing?
  *   (Yes) I need to see their logic.
  *   (No) I can rely on beliefs or probabilities.

  **Q3. The Safety Margin**
  *(Asked to A-Yes)* Does "no worse off" mean better in *every* possible outcome of the game, or just better on average?
  *   (Every) Must be safe in all scenarios.
  *   (Average) Safe in expectation is enough.

  **Q4. The Binding Mechanism**
  *(Asked to all paths)* How do you physically ensure you stick to the deal?
  *   (Self) You rewrite your own decision procedure/code.
  *   (Delegate) You hand control to a trusted third party.
  *   (Talk) You just announce your intent publicly.

  **Q5. The Timing Symmetry**
  *(Asked to Self and Delegate)* Do you both have to lock in your commitment at the exact same time?
  *   (Simultaneous) We commit together.
  *   (Sequential) One commits, then the other responds.

  **Q6. The Equilibrium Selection**
  *(Asked to Simultaneous)* There are two different deals that both help everyone. How do you pick which one to enact without talking further?
  *   (Focal) You pick the one that feels most natural/symmetric.
  *   (Random) You use a shared random signal to pick.

  **Q7. The Default Baseline**
  *(Asked to Talk and Sequential)* What counts as the "default" you shouldn't worsen?
  *   (Specific) The specific thing they would have done in this instance.
  *   (Worst-Case) The worst thing they could possibly have done.

  ---

  ### The Leaves (Views)

  **1. Safe Pareto Improvement (SPI)**
  *   **Path:** Q1(A) → Q2(Yes) → Q3(Average) → Q4(Self) → Q5(Simultaneous)
  *   **Most Awkward Commitment:** Committing to a transformed subgame you haven't fully verified behaves identically to the original.
  *   **Survives without Source Code?** No; requires structural similarity assumptions that act as a proxy for inspection.

  **2. Robust Safe Pareto**
  *   **Path:** Q1(A) → Q2(Yes) → Q3(Every) → Q4(Self) → Q5(Simultaneous)
  *   **Most Awkward Commitment:** Refusing beneficial deals because there is a 0.01% edge case where partner loses out.
  *   **Survives without Source Code?** No; requires certainty about outcomes that inspection provides.

  **3. Program Equilibrium**
  *   **Path:** Q1(C) → Q2(Yes) → Q4(Self) → Q5(Simultaneous)
  *   **Most Awkward Commitment:** Your code enters an infinite loop because their code is also trying to read yours.
  *   **Survives without Source Code?** No; collapses into cheap talk without read access.

  **4. Trusted Delegation**
  *   **Path:** Q1(C) → Q2(Yes) → Q4(Delegate)
  *   **Most Awkward Commitment:** The delegate develops their own incentives and defects against both principals.
  *   **Survives without Source Code?** Yes; if the delegate is legally/socially bound, code access matters less.

  **5. Cheap Talk**
  *   **Path:** Q1(B) → Q4(Talk)
  *   **Most Awkward Commitment:** Lying is still a valid strategy, so the announcement changes nothing.
  *   **Survives without Source Code?** Yes; this view relies entirely on public announcement.

  **6. Sequential Commitment**
  *   **Path:** Q1(B) → Q4(Self) → Q5(Sequential)
  *   **Most Awkward Commitment:** The first mover locks in a bad deal because the second mover threatens to defect otherwise.
  *   **Survives without Source Code?** Yes; visible action (burning bridges) works without code inspection.

  **7. Unnamed (Belief-Based SPI)**
  *   **Path:** Q1(A) → Q2(No) → Q3(Average)
  *   **Most Awkward Commitment:** Guaranteeing another's safety based purely on your own subjective guess about them.
  *   **Survives without Source Code?** Yes; relies on beliefs, not inspection.

  **8. Unnamed (Take-It-Or-Leave-It)**
  *   **Path:** Q1(B) → Q4(Self) → Q5(Simultaneous)
  *   **Most Awkward Commitment:** Offering a deal that harms them if they reject it, coercing acceptance.
  *   **Survives without Source Code?** Yes; standard bargaining strategy.

  **9. Unnamed (Maximin Baseline)**
  *   **Path:** Q1(A) → Q7(Worst-Case)
  *   **Most Awkward Commitment:** Treating a cooperative partner as if they were trying to minimize your utility by default.
  *   **Survives without Source Code?** Yes; purely a internal valuation metric.

  **10. Unnamed (Correlated Selection)**
  *   **Path:** Q6(Random)
  *   **Most Awkward Commitment:** Flipping a coin to decide who gets the better outcome when both deserve it.
  *   **Survives without Source Code?** Yes; requires shared randomness, not code.

  **11. Unnamed (Focal Selection)**
  *   **Path:** Q6(Focal)
  *   **Most Awkward Commitment:** Assuming "symmetry" matters when one agent is clearly stronger than the other.
  *   **Survives without Source Code?** Yes; relies on culture/context.

  **12. Unnamed (Voided Deal)**
  *   **Path:** Q1(C) → Q2(No)
  *   **Most Awkward Commitment:** Cancelling a beneficial deal because you can't be 100% sure of their default, despite high confidence.
  *   **Survives without Source Code?** Yes; cautious bargaining.

  ---

  ### Analysis of Logical Space

  **Empty Cells (Combinations opened by questions but lacking leaves)**
  1.  **Q1(A) + Q2(No) + Q3(Every):** *Incoherent.* You cannot guarantee safety in *every* outcome (Q3) without inspecting the source code (Q2) to rule out edge cases.
  2.  **Q1(C) + Q4(Talk):** *Unattractive.* If the deal voids on wrong guess (Q1-C), mere talk (Q4-Talk) provides no mechanism to verify the guess or enforce the voiding.
  3.  **Q1(B) + Q3(Every):** *Unexplored.* A view where the proposer takes no risk (Q1-B) but demands the deal be safe in every outcome for the acceptor. Coherent, but rarely defended as a primary stance.
  4.  **Q4(Delegate) + Q5(Sequential):** *Unexplored.* Delegating but doing so sequentially. Coherent, but usually delegation implies a simultaneous hand-off of authority.

  **Indistinguishable Leaves**
  *   **Leaf 1 (SPI) vs. Leaf 7 (Belief-Based SPI):** These are functionally identical in practice if the "structural similarity" assumption in Leaf 1 is treated as a belief. The tree separates them based on whether inspection is *required* (Q2), but in high-confidence belief scenarios, the operational behavior is the same.
  *   **Leaf 4 (Delegation) vs. Leaf 3 (Program Equilibrium):** If the "delegate" is a software agent submitted by the principal, this is semantically identical to Program Equilibrium. The tree separates them by mechanism naming, but the logical structure (submitting a decision-maker) is the same.

  **Source Code Dependency Summary**
  *   **Dependent:** Leaves 1, 2, 3 (Require inspection or structural similarity proxies).
  *   **Independent:** Leaves 4, 5, 6, 7, 8, 9, 10, 11, 12 (Rely on trust, action, belief, or social norms).
