  # Joint Statement on the Nature of Simultaneous Discovery and Priority

  **Signatories:** Dr. Elena Vance (Inevitabilist) & Dr. Marcus Thorne (Contingentist)
  **Date:** October 26, 2023
  **Subject:** Findings of the Adversarial Collaboration on Scientific Priority

  ### 1. Agreed Claims

  After reviewing historical records and conducting a joint analysis of priority disputes, we affirm the following propositions:

  1.  **Historical Prevalence:** Independent, simultaneous discovery is a recurrent structural feature of scientific progress, not an anomaly. This is evidenced by the priority pairs of Newton and Leibniz (calculus), Darwin and Wallace (natural selection), and Bell and Gray (telephone), where distinct agents accessed similar conclusions within narrow temporal windows.
  2.  **Prerequisite Conditions:** In these cases, the requisite instrumentation, mathematical techniques, and conceptual vocabulary were generally available to the relevant community prior to the announcement of the discovery.
  3.  **Function of Credit:** A system of discovery credit is not merely a record of truth but a social technology. Its primary functions are to (a) incentivize the rapid communication of results, (b) allocate reputational capital and resources to active researchers, and (c) establish a stable citation lineage for future work.
  4.  **Epistemic Equality:** In the cases cited above, both parties in the priority dispute made genuine intellectual contributions. Denying the validity of one party's work based solely on submission date undermines the historical record.
  5.  **The Archive Consensus:** Regarding the newly opened archive (Groups A, B, and C), we agree that Group A possessed a functional account prior to Group B's publication, and that Group B's formulation introduced a terminological error regarding the mechanism that persists in the field.

  ### 2. Residual Disagreements

  While we agree on the historical facts, we disagree on their interpretation regarding the nature of scientific truth and agency.

  | Issue | Inevitabilist's Wording | Contingentist's Wording | Substantive or merely verbal? | Crux it turns on |
  | :--- | :--- | :--- | :--- | :--- |
  | **The Ontology of Discovery** | Discovery is the moment a result becomes *publicly usable* by the field; private completion is historically interesting but scientifically inert. | Discovery is the moment a result is *conceptually secured*; publication is merely the transmission of a pre-existing intellectual achievement. | Substantive | The Definition of "Completion" |
  | **The Impact of Error** | Group B's mislabeling is a superficial error correctable by normal science; the core convergence method was secured regardless of the label. | Group B's mislabeling fundamentally altered the research program's trajectory; the "discovery" absorbed by the field is materially different from Group A's insight. | Substantive | The Trajectory of Error |
  | **Counterfactual Viability** | If Group A's PI had lived, they would have converged on a public formulation functionally equivalent to Group B's due to field constraints. | If Group A's PI had lived, their specific conceptual framing would have launched a divergent research program, preventing the current terminological error. | Substantive | The Latency of Tools |

  ### 3. Cruxes and Empirical Tests

  The following JSON array details the specific sub-questions (cruxes) that sustain our disagreement, the specific test case derived from the 1974–1990 archive, and the evidence required to shift our respective positions.

