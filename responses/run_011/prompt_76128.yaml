      "test_case": "Comparison of Group A's 1974 unpublished manuscript against Group B's 1979 published paper to determine if A's account was 'working' by field standards of the time.",
      "inevitabilist_prediction": "Group A's manuscript will show a mathematically valid but pedagogically incomplete account that required Group B's broader version to become operational for the field.",
      "contingentist_prediction": "Group A's manuscript will show a complete, self-contained derivation that Group B independently reconstructed but failed to fully comprehend, evidenced by the mislabeling.",
