      *   Make the recommendation actionable.

  8.  *(Final Review against constraints)*: No reading list? I will name the philosophers as the *origin* of the argument but not assign homework. "Serious answer rather than diplomatic." "Address that squarely." Okay.

      *Wait, one nuance:* The user said "Please do not send me a reading list — I will do the looking-up myself." This implies I *can* mention names, just not say "Go read Book X." I should identify the lineage.

      *Let's sharpen the "Weakness":* The weakness is elitism disguised as populism. Assuming "local" is always "better." Sometimes a professional play shocks a town more than a local pageant.
