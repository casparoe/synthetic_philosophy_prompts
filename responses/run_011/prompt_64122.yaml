  **MEMORANDUM OF PARTIAL CONVERGENCE**
  **Subject:** The Scope and Normative Force of the Value of Information Theorem
  **To:** The Reading Group
  **From:** Adversarial Collaboration Facilitator

  ### 1. Working Note on Positional Labels

  The labels **Constitutivist** and **Situationist** are serviceable but risk caricature if left unqualified. The Constitutivist position risks sounding like a psychological claim that actual humans *are* perfect Bayesian updaters, which no one believes. It must be clarified as a claim about *coherence*: to violate the theorem is to suffer a definable inconsistency in one's web of belief and desire, regardless of psychological capacity. The Situationist position risks sounding like a dismissal of formal methods as "unrealistic." It must be clarified as a claim about *mapping*: the formal variables (acts, states, utilities) do not map cleanly onto the temporally extended, computationally bounded situations actual agents occupy.

  **Amended Definitions for this Document:**
  *   **Constitutivists** hold that the theorem's assumptions define the logical geometry of rational agency. An agent who pays to avoid information is not merely "bounded"; they are incoherent relative to their own stated preferences and beliefs. The theorem is a consistency check, like avoiding a Dutch Book.
  *   **Situationists** hold that rationality is a property of agents embedded in time with limited computational resources. The theorem describes a closed system that excludes the costs of inference and the dynamics of self-control. An agent who pays to avoid information may be locally incoherent by the theorem's lights but globally rational given their situational constraints.

  ### 2. Agreed Claims

  Both camps endorse the following mathematical and structural claims.

  1.  **The Inequality:** Let $A$ be a set of available acts, $S$ be a set of states of the world, and $U(a, s)$ be the utility of performing act $a$ in state $s$. Let $E$ be a random variable representing evidence, with possible outcomes $e$. Let $P(s)$ be the prior probability of state $s$, and $P(s|e)$ be the posterior probability after observing $e$.
      The theorem establishes the following inequality:
      $$ \sum_{e} P(e) \left[ \max_{a \in A} \sum_{s} P(s|e) U(a, s) \right] \ge \max_{a \in A} \sum_{s} P(s) U(a, s) $$
      In words: The expectation (over possible evidence) of the maximum expected utility (calculated after seeing the evidence) is greater than or equal to the maximum expected utility (calculated before seeing the evidence).

  2.  **Mathematical Validity:** Both camps agree the derivation of this inequality is mathematically sound within standard probability theory. The step relying on the convexity of the maximum function (that the average of maxima is at least the maximum of averages) is uncontroversial.

  3.  **Required Assumptions:** For the inequality to hold strictly as written, the following conditions must obtain:
      *   **Fixed Act Set:** The set $A$ available to the agent does not change depending on whether evidence is observed.
      *   **State-Act Independence:** The probability of the state $S$ depends on the evidence $E$, but the utility $U$ depends only on the act and the state, not on the evidence itself or the agent's belief state.
      *   **Conditionalization:** The agent updates beliefs strictly via Bayes' rule ($P(s|e)$).
      *   **Maximization:** The agent chooses the act $a$ that maximizes expected utility at the moment of choice.
      *   **Costless Information:** The acquisition of $E$ involves no resource cost subtracted from $U$.

  4.  **Empirical Regularity:** Both camps agree that in many controlled laboratory and engineering contexts, agents who seek relevant information before acting outperform those who do not, consistent with the inequality.

  5.  **Possibility of Violation:** Both camps agree that if an agent's ex ante expected utility is strictly higher when refusing free information, at least one of the Required Assumptions (Claim 3) must have been violated in the description of the case. The camps disagree on whether such a violation implies irrationality (Constitutivist) or a necessary adjustment of the model (Situationist).

  ### 3. Disagreements Table

  | Topic | Constitutivist Formulation | Situationist Formulation | Substantive or Verbal? |
  | :--- | :--- | :--- | :--- |
  | **Normative Force** | The theorem specifies necessary conditions for coherence. An agent who violates it has defective preferences or beliefs. | The theorem specifies sufficient conditions for information gain in idealized models. An agent who violates it may have rational constraints not captured by the model. | Substantive |
  | **Boundedness** | Computational limits are pragmatic obstacles, not justificatory exemptions. One should approximate the ideal as closely as possible. | Computational limits are constitutive of the agent's situation. A norm that ignores them is not a norm for *that* agent. | Substantive |
  | **Dynamic Consistency** | A rational agent must be able to bind their future self or anticipate their future choices correctly. Failure to do so is a planning error. | Agents often cannot bind their future selves. Rationality must account for the inability to execute prior plans (time inconsistency). | Substantive |
  | **Definition of "Good-Breaking"** | **Amendment:** A case is only "Good-breaking" if the assumptions hold. If utility rises by refusing info, the act set or utility function was misdescribed. | **Amendment:** A case is "Good-breaking" if utility rises by refusing info in a real-world scenario, regardless of whether idealized assumptions hold. | Verbal (mostly) |
  | **Utility of Belief** | Utility should be defined over world-states. If "peace of mind" matters, it must be modeled as a state, not a belief-dependent payoff. | Utility is often inherently dependent on the agent's epistemic state (e.g., confidence, integrity). Modeling this as a "world state" is artificial. | Substantive |

  ### 4. The Cruxes and Case Studies

  **The Crux Test:** For each case below, we ask: *Does the agent's refusal of free information demonstrate a failure of rationality, or a failure of the model to capture the situation?*
  *   **Constitutivist Prediction:** The case can be redescribed to satisfy the theorem's assumptions, revealing the refusal as irrational or the information as not truly "free/unchanged."
  *   **Situationist Prediction:** The case cannot be redescribed without losing the essential features of the situation; the refusal is rational, and the theorem's assumptions are the source of error.

  **Case (a): The Blinded Analysis**
  *   **Scenario:** A physicist analyzes data to measure a constant. She knows she is prone to "tuning" analysis cuts to match expectations. She commits to a pipeline *before* seeing the calibration constant (evidence). Seeing the constant early would allow her to unconsciously bias the pipeline.
  *   **Assumption Attacked:** **Conditionalization / Modeling Own Inference.** The agent cannot trust herself to update via pure conditionalization; she expects her inference to be contaminated by the evidence.
  *   **Inequality Stress:** Attacks the term $P(s|e)$. The agent believes her actual posterior will not be the Bayesian posterior $P(s|e)$, but a biased distribution $P_{biased}(s|e)$.
  *   **Constitutivist Prediction:** This is a failure of self-knowledge. A perfectly coherent agent would know she can conditionalize correctly. The blinding is a workaround for a defect in agency.
  *   **Situationist Prediction:** This is a rational constraint. The "agent" includes the psychological mechanism of analysis. Refusing the evidence maximizes expected utility given the actual inference mechanism.

  **Case (b): The Interim Look (Stopping Rule)**
  *   **Scenario:** A clinical team can look at trial data interim. They know that if they see a flattering result, they will stop the trial early to publish, even if the protocol says to continue. They cannot bind themselves to continue. They choose to blind the interim data to prevent this premature stopping.
  *   **Assumption Attacked:** **Fixed Act Set / Dynamic Consistency.** The set of available acts changes based on the evidence because the future self cannot commit to the prior plan.
  *   **Inequality Stress:** Attacks the $\max_{a \in A}$ term. The $A$ available after seeing $e$ (tempted to stop) is effectively different from the $A$ planned before (commit to finish).
  *   **Constitutivist Prediction:** The team is dynamically inconsistent. They should bind their future selves. Refusing information covers up a failure of will.
  *   **Situationist Prediction:** Binding is impossible or too costly. The refusal of information is the optimal second-best solution for a time-inconsistent agent.

  **Case (c): The Self-Fulfilling Prognosis**
  *   **Scenario:** A test predicts a market crash. If the agent sees the prediction, she panics and sells, causing the crash. If she remains ignorant, she holds, and the market stabilizes. The truth of the state depends on the act, which depends on the information.
  *   **Assumption Attacked:** **State-Act Independence.** The probability of the state $S$ is not independent of the act $A$ chosen, and the act is determined by the evidence $E$.
  *   **Inequality Stress:** Attacks the independence of $P(s)$ and $U(a,s)$. Here $P(s | a, e) \neq P(s | e)$.
  *   **Constitutivist Prediction:** This is not a measurement problem but a game-theoretic one. The "state" must include the agent's reaction. Properly described, the theorem holds.
  *   **Situationist Prediction:** This is a standard feedback loop. The theorem assumes a passive world. In an active world, ignorance can be instrumentally rational.

  **Case (d): The Confidence Bet (Constructed)**
  *   **Scenario:** A lab director must certify a measurement. Her bonus depends on the accuracy of the measurement *and* her expressed confidence level. If she sees a piece of ambiguous data (free evidence), her confidence interval widens. Her utility function penalizes low confidence more than it rewards the slight accuracy gain from the data. She refuses the data to maintain high confidence.
  *   **Assumption Attacked:** **Utility Independence from Belief.** The utility $U$ depends on the agent's belief state (confidence), not just the act and the external state.
  *   **Inequality Stress:** Attacks $U(a, s)$. It should be $U(a, s, Belief)$. Since the evidence changes the Belief, it changes the Utility function directly, breaking the convexity argument.
  *   **Constitutivist Prediction:** The utility function is misspecified. "Confidence" should be modeled as a world-state (e.g., "Reputation for Certainty"). If modeled correctly, the theorem holds.
  *   **Situationist Prediction:** Agents care about their internal epistemic state. Forcing this into "world states" is gerrymandering. The theorem does not apply to epistemic utilities.

  **Status of "Good-Breaking" Definition:**
  *   **User Definition:** Free, truthful evidence; act/consequence description unchanged; ex ante EU higher if refuses.
  *   **Constitutivist Amendment:** Add clause: "...provided the agent updates via conditionalization and utility is state-act dependent." They deny any case meeting the user's definition is possible without violating these hidden clauses.
  *   **Situationist Amendment:** Add clause: "...for a bounded agent in a dynamic setting." They assert such cases are common and the theorem's clauses are the ones that need dropping.
  *   **Well-Posedness:** Case (a) and (b) are well-posed descriptions of laboratory practice. Case (c) violates the "state independent of act" assumption explicitly. Case (d) violates the "utility independent of belief" assumption explicitly. Under the strict theorem definitions, (c) and (d) are not "Good-breaking" because the assumptions fail. Under the Situationist view, they are "Good-breaking" because the assumptions are unrealistic.

  ### 5. Closing: The Verbal Dispute

  The core of the dispute is verbal, though it masks substantive differences in modeling philosophy.

  **Are the camps asserting and denying the same claim?**
  No. When the Constitutivist says "The expected value of free information is non-negative," they are asserting a tautology of the formal system: *Given definitions D1, D2, D3, the value is non-negative.* When the Situationist denies it, they are asserting an empirical claim about the mapping: *Definitions D1, D2, D3 do not capture the relevant features of actual decision problems.*

  **On "Good-Breaking":**
  The camps are using the term "Good-breaking" to refer to different sets of possible worlds.
  *   For the **Constitutivist**, a "Good-breaking" case is a logical contradiction, like a "round square." If the expected utility is higher refusing information, the information was not truly "free" (processing costs existed) or the acts were not "unchanged" (psychological constraints shifted the act set). They will not sign a definition that allows for the possibility of such cases without these caveats.
  *   For the **Situationist**, a "Good-breaking" case is an empirical observation, like "friction exists." The theorem describes a frictionless vacuum. They will not sign a definition that rules out the possibility by fiat.

  **Resolution:**
  We agree that the inequality holds for the mathematical objects defined in Claim 1. We disagree on whether those mathematical objects are the correct tools for assessing the rationality of the cases in Section 4. The Constitutivist insists we refine the cases to fit the tools; the Situationist insists we refine the tools to fit the cases. This document records that divergence without resolving it, allowing both to proceed with their respective research programs: one refining the norms of coherence, the other refining the models of bounded agency.
