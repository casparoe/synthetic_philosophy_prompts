answer: |-
  **Project Title:** The Temporal Morphology of Omission: When Does Silence Become Action?

  **Project Summary**
  This project investigates a specific gap in the doctrine of doing and allowing (DDA). Standard ethical thought experiments treat omissions as momentary states: a agent refrains from pulling a lever at *t₁*. My project argues that this temporal compression obscures a categorical shift. I propose to analyze whether an omission, when extended over decades, morphs from "allowing harm" into "doing harm" independent of the increasing magnitude of that harm.

  The core case is a novelistic vignette: A man ceases correspondence with his sister. He does not block her funds, nor does he actively sabotage her. He simply stops writing. He remains silent for twenty-six years until her death. She dies uncertain whether he is dead or indifferent. In draft, my language slides: early chapters describe a failure to act; later chapters describe an active campaign of neglect. This slippage suggests a philosophical problem rather than a stylistic one. If an omission persists for twenty-six years, does it acquire the moral ontology of an action?

  **The Question**
  Does the moral classification of an omission shift from 'allowing' to 'doing' as its duration extends, independent of increased harm?

  This is falsifiable. If respondents judge the twenty-six-year silence as morally equivalent to a twenty-six-day silence (scaled for harm), the distinction holds static. If they judge the twenty-six-year silence as categorically distinct—a *making happen* rather than a *letting happen*—then duration is a constitutive element of agency, not merely a scalar multiplier of outcome.

  **Existing Positions and the Temporal Gap**
  Current frameworks absorb duration without examining its structural impact.
  1.  **Distinctivists (e.g., Foot, Quinn):** Argue doing is worse than allowing based on causal sequences. They treat the omission as a single event established at the moment of first refusal. For them, the twenty-six years is just one long "allowing," fixed at month one.
  2.  **Equivalence Theorists:** Argue the distinction is morally irrelevant; only outcomes and intentions matter. For them, duration merely increases the harm scalar. They cannot account for a categorical shift because they deny the categories exist.
  3.  **Baseline/Counterfactual Views:** Locate the difference in what would have happened anyway. They typically set the baseline at the start of the interaction. They assume the baseline remains static. They do not account for whether the *expectation* of intervention shifts over decades, thereby changing the baseline itself.

  None of these positions face the possibility that the *passage of time itself* alters the agency status of the omitters. They treat time as a container for harm, not a constituent of action. My project argues that a twenty-six-year omission is not one big omission, nor two hundred small ones, but a distinct moral object that existing taxonomy cannot classify.

  **Methodology: Case-Building via Fiction**
  I will use constructed fictional cases rather than stock philosophical examples. Stock examples (the drowning child, the trolley) strip away epistemic history to isolate variables. However, duration *requires* epistemic history. To know if the silence is active or passive at year ten, we must know what the agent knew at year three.

  Novelistic case-building forces specification of these internal states. I will write minimalist vignettes varying only the duration and the agent's knowledge state (e.g., does he know she is ill at year five or year twenty?).
  *Risk:* Panels often worry fictional cases are too baroque to generate clean intuitions.
  *Mitigation:* I will strip the vignettes of all aesthetic detail. No names, no settings, only the timeline of contact and knowledge. The "novelist" method here is not style, but the rigorous specification of the interior life that philosophy often stipulates away.

  **Work Plan (12 Months)**
  *   **Months 1–3:** Literature review on DDA and temporal ethics. Draft three core vignettes: The 3-Month Silence, The 5-Year Silence, The 26-Year Silence. Keep harm constant; vary only duration.
  *   **Months 4–6:** Intuition testing. Present vignettes to small groups (law students, philosophers, laypeople). Record whether verdicts shift from "neglect" to "harm" as duration extends.
  *   **Month 2 Checkpoint:** I will run a pilot test of the 3-Month vs. 26-Year vignette immediately. If the verdicts are identical (scaled for harm), I will pivot to analyzing *why* the intuition fails rather than forcing a distinction that isn't there.
  *   **Months 7–9:** Drafting the central essay. Analyzing whether the shift is due to accumulated length or a specific decisive moment (e.g., the first unanswered letter after illness).
  *   **Months 10–12:** Refining the argument. Preparing the public lecture. The output is a 10,000-word essay and one public lecture, not novel chapters.

  **Success, Failure, and Risks**
  A successful result demonstrates that duration triggers a categorical shift in moral description independent of harm magnitude.
  **Failure looks like one of three things:**
  1.  **Instability:** Verdicts vary wildly across readers, suggesting no theorizable pattern.
  2.  **Decisiveness Collapse:** Respondents agree it becomes "doing," but locate it entirely at a specific moment (e.g., year four), making duration irrelevant.
  3.  **Scalar Collapse:** Respondents agree it gets worse, but deny it changes *kind*. It remains "allowing," just "worse allowing."

  **I bet on Failure Mode 3.** It is highly probable that duration simply amplifies harm without changing the moral category. This is the strongest objection to my hypothesis: that I am conflating *severity of blame* with *ontology of act*. If this is true, the project still succeeds by proving that the "doing/allowing" distinction is robust against temporal pressure. I will not hedge this. If the intuition collapses into scalar harm, the essay will argue that the doing/allowing distinction is more rigid than narrative intuition suggests.

  **Scope**
  To fit a year, I am cutting legal liability. While this has tort implications (negligence vs. intentional harm), legal doctrine is bound by precedent that would muddy the conceptual analysis. I am also cutting comparative cultural views on time and obligation. If the project expands beyond a year, the next step would be empirical psychology: measuring how humans perceive the "agency" of a static state over time. For now, this is strictly moral ontology.

  The twenty-six years matters. If I am right, a man can love his sister and still kill her by waiting. If I am wrong, he merely let her die, slowly. The law school context demands I know the difference.
