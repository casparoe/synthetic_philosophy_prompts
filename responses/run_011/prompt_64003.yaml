answer: |-
  # Workshop Prep Sheet: Defending SSA vs. SIA
  **Time:** 30 mins + Q&A
  **Audience:** Hostile/Skeptical (Probability, Cosmology, Stats)
  **Goal:** Survive Q&A without conceding the core thesis (SSA > SIA).

  ---

  ### The "Must Land" Reply
  **Objection #1 (The Bayesian Statistician):** *"You keep talking about 'updating on location,' but you haven't written down a likelihood function. In standard Bayesianism, $P(E|H)$ requires a generative model. SSA isn't a likelihood; it's a prior modifier disguised as data. If you can't specify the sampling distribution mathematically, you aren't doing statistics, you're doing numerology."*

  *   **The 2-Minute Reply:** "You're right that standard Bayesianism assumes the evidence is fixed and the hypothesis varies. But self-locating evidence is indexical. The 'likelihood' here isn't about the data generation, it's about the *sampling protocol*. My model is: 'I am a random sample from the set of observers satisfying description D.' That *is* the sampling distribution. It's uniform over the reference class. The statistician's job is to tell me if that sampling assumption is coherent, not to demand a physical causal mechanism for my existence. SSA provides the likelihood $P(I \text{ am } x | H) = 1/N_H$. SIA changes the prior $P(H)$ based on $N_H$, which violates the principle that existence shouldn't confirm abundance without observation."
  *   **Soft Spot:** You are stretching the definition of "likelihood." A strict subjectivist might say you're just shifting mass between hypotheses without new data.
  *   **Concede Up Front:** "I agree we need a formal sampling model. I am proposing the uniform distribution over the reference class *is* that model. If you can show that leads to incoherence, I'll listen, but 'it's not standard' isn't an argument against indexical data."
  *   **Why This Must Land:** If the statisticians decide your framework isn't even mathematically well-formed, the philosophers and cosmologists will stop listening. You need legitimacy before you can have insights.

  ---

  ### The Damage Hierarchy (Objections 2–8)

  #### 2. The Cosmologist (Reference Class Arbitrariness)
  *   **The Objection:** "You say reference class relativity is a feature. In cosmology, we need unique predictions. If I can tweak the reference class from 'all observers' to 'observers with my exact retinal scan' to make the Doomsday Argument vanish, your theory is unfalsifiable. How do I calculate a measure if the class is subjective?"
  *   **The Reply:** "It's not subjective; it's evidence-relative. You don't pick the class to get the result you want; you narrow the class based on what you actually know. If you know you have a specific retinal scan, you *must* condition on that. The 'arbitrariness' charge assumes there's one True Class. I'm saying the class is defined by your total evidence. This doesn't make predictions vanish; it makes them honest about what information is doing the work."
  *   **Soft Spot:** There is no algorithm for "total evidence." Where do you stop? (e.g., Do I include 'being bored'?)
  *   **Concede:** "I can't give you an algorithm for 'relevant evidence' yet. But SIA's answer ('count everyone') is demonstrably wrong in the Presumptuous Philosopher case. Ambiguity is better than error."

  #### 3. The Empiricist (The Doomsday Bullet)
  *   **The Objection:** "You say you'll bite the Doomsday Argument. That argument implies we can ignore astrophysical data about stellar lifetimes and predict human extinction based solely on birth rank. That's scientifically insane. If SSA entails that, SSA is falsified by reality."
  *   **The Reply:** "SSA doesn't tell you to ignore astrophysics. It tells you that *given* two empirically equivalent theories, you prefer the one where you are typical. The Doomsday Argument only works if you assume the 'total number of humans' is the only variable. Once you add astrophysical priors (which are strong), the birth-rank likelihood gets swamped. I bite the bullet only on the *pure* probability shift, not on the final posterior when real data is included."
  *   **Soft Spot:** This sounds like you're watering down the Doomsday Argument until it's trivial.
  *   **Concede:** "I concede SSA alone isn't enough to predict extinction. It requires priors that might be hard to justify. But it doesn't contradict astrophysics; it competes with it."

  #### 4. The Sleeping Beauty Philosopher (Halfer Inconsistency)
  *   **The Objection:** "SSA commits you to the 'Halfer' position in Sleeping Beauty. But Halfers violate conditionalization. When Beauty wakes up, she gains no new evidence, yet her credence shouldn't change? That breaks the diachronic norm of Bayesian updating. You're asking us to break probability theory to save anthropics."
  *   **The Reply:** "Beauty *does* gain new evidence: self-locating evidence. 'I am awake now' rules out the world where 'I am asleep now.' Standard conditionalization applies to propositional evidence. Indexical evidence requires a centered-worlds framework. SSA handles this consistently without needing SIA's population-weighted priors. I'm not breaking probability; I'm expanding the evidence space."
  *   **Soft Spot:** Many probability philosophers think centered-worlds updating is a hack to save Halfing.
  *   **Concede:** "If you have a proof that Halfing violates a specific Dutch Book in this specific setup, show me. But SIA's Thirding leads to the Presumptuous Philosopher, which is a bigger violation of rationality."

  #### 5. The SIA Defender (Prior Sensitivity)
  *   **The Objection:** "You claim the Presumptuous Philosopher is just about priors. But SIA is supposed to *overcome* priors. If a theory predicts $10^{12}$ times more observers, SIA says that's $10^{12}$ times more likely. You can't just 'tune' your priors to fix that. That's admitting SIA works but you don't like the output."
  *   **The Reply:** "It's not tuning; it's recognizing that 'number of observers' is not a likelihood ratio. The Philosopher hasn't looked through a telescope. He has zero data about the universe's size. SIA treats 'potential observers' as 'actual data points.' That's the error. My priors aren't tuned; they are flat on the *theories*, not weighted by the *consequences* of the theories. SIA double-counts the theory's implications as evidence for the theory."
  *   **Soft Spot:** Why *shouldn't* a theory that makes more observers be more likely to contain me?
  *   **Concede:** "I concede this is the crux. If you believe existence is evidence, SIA wins. If you believe observation is evidence, SSA wins. I'm arguing for the latter."

  #### 6. The Decision Theorist (Dutch Book)
  *   **The Objection:** "Can I Dutch Book you? If you use SSA, and I know your reference class, can I offer you bets that you'll take which guarantee a loss across the possible worlds? If SSA leads to sure losses, it's pragmatically irrational."
  *   **The Reply:** "SSA is vulnerable to Dutch Books if you treat self-locating beliefs as standard betting odds. But betting requires a decision theory that accounts for *correlated* decisions across observers. If I use SSA with a decision theory that recognizes my copies (like UDT or similar), the Dutch Book disappears. The problem isn't the credence; it's the betting setup."
  *   **Soft Spot:** This kicks the can to decision theory, which is also a mess.
  *   **Concede:** "I concede SSA requires a non-standard decision theory to avoid sure losses. But SIA requires a non-standard probability theory. I prefer messing with decision theory."

  #### 7. The Cosmologist (Boltzmann Brains)
  *   **The Objection:** "In eternal inflation, Boltzmann Brains (BBs) vastly outnumber ordinary observers. SSA says I should think I'm a BB if they are in my reference class. SIA says I should think I'm a BB even faster. How does SSA save us from BB skepticism?"
  *   **The Reply:** "SSA saves us if we define the reference class as 'observers with my current coherent experiences.' BBs generally have fleeting, disordered experiences. If I have a coherent memory of a past, I am likely not a BB. SIA forces me to be a BB because there are so many of them. SSA allows me to use the *content* of my observation to narrow the class and exclude BBs."
  *   **Soft Spot:** Some BBs might have coherent experiences by chance.
  *   **Concede:** "It depends on the physics of BBs. But SSA gives me a lever to exclude them (reference class); SIA forces me to include them (population count)."

  #### 8. The Skeptic (Falsifiability)
  *   **The Objection:** "If every time your prediction fails, you can say 'I was in the wrong reference class,' what could possibly falsify SSA? It seems compatible with everything."
  *   **The Reply:** "It's falsifiable if I specify the reference class *ex ante*. If I say 'The class is all humans' and then make a prediction, and it fails, I'm wrong. The flexibility is in the *setup*, not the *retrofitting*. Science always has flexibility in model specification; that doesn't make it unscientific."
  *   **Soft Spot:** It's hard to commit to a class *ex ante* without knowing the implications.
  *   **Concede:** "I need to be more rigorous about pre-committing to classes. I grant that."

  ---

  ### The "Prayer Question"
  **The Question:** *"Okay, you say the reference class is determined by 'total evidence.' Give me a non-circular algorithm. If I tell you 'I am an observer,' what is the procedure to determine if a Boltzmann Brain, a alien, or a future AI is in my class? If you say 'it depends on the hypothesis,' you're begging the question. If you say 'it depends on similarity,' similarity is metric-dependent. How do you calculate this without already knowing the answer you want?"*

  *   **Why I'm Praying Nobody Asks:** Because I don't have an algorithm. I have an intuition ("similarity of experience"), but I can't formalize it without risking the arbitrariness charge from the Cosmologists or the circularity charge from the Philosophers.
  *   **Emergency Exit:** "I don't have the algorithm yet. That's the research program. But SIA's algorithm ('count everything') yields absurd results. I'm offering the correct *structure* for the solution, even if the metric needs work. Better a vague correct map than a precise map to the wrong continent."

  ---

  ### General Delivery Notes
  1.  **Don't Apologize for SSA:** It's the minority view. Own it as the "conservative" view (conserves prior probability).
  2.  **Watch the Statistician:** If they look confused, slow down and write the likelihood on the board. $P(E|H)$.
  3.  **The "Adult" Cosmologists:** They respect "typicality." Frame SSA as "Typicality with Constraints" rather than "Anthropic Reasoning."
  4.  **Time Management:** If Q&A runs long, cut the Doomsday defense short. It's the most controversial but least important for the *formalism*.
  5.  **Body Language:** When the Sleeping Beauty person speaks, nod. They are the technical authority in the room. If you lose them, you look like a metaphysician ignoring logic.

  **Good luck. You're defending the harder position, which means you have to be sharper.**
