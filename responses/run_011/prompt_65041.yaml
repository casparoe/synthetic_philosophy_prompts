answer: |-
  **The Added Stroke**

  **I.**

  The ink was thick with cold. Hildegarde dipped the quill again, waiting for the gall to loosen in the pot. The scriptorium was silent save for the scratching of nibs on skin, a sound like mice eating through grain. Before her lay the exemplar, a book older than the abbey itself, its parchment warped from a leak in the roof long since repaired. The water had run down the margin and pooled over the line describing the skirmish at the river ford.

  She leaned closer, shielding the page with her hand. The text recorded how many men had crossed to the enemy bank before the bridge broke. The numeral was there, but the ink had bled. It looked like an **L**, standing for fifty. But the stroke that might have made it an **LX** for sixty was gone, dissolved into a grey blur.

  Hildegarde paused. She knew this passage. Two winters ago, she had copied the grain ledgers from the same campaign. She remembered the tally of bread loaves issued to the crossing party. Fifty loaves would have left men hungry; the ledger showed enough for sixty. If she wrote fifty here, the numbers would not sing together. The history would limp.

  She looked around. The other sisters were bent over their own tasks, copying sermons and saints' lives. None knew the grain ledgers as she did. To them, the blurry **L** was sufficient. To her, it was a mistake waiting to be hardened into fact.

  She did not hesitate long. To leave it as fifty was to lie about the bread. She pressed the quill down. Beside the **L**, she drew a sharp, black **X**. It dried quickly in the cold air, darker than the surrounding text. She had not guessed; she had remembered. She turned the page, feeling the quiet satisfaction of a thing set right. The book was heavy on the desk. She closed it, and the sound was final.

  **II.**

  Forty years later, Elisabeth sat at the same table, though the roof no longer leaked. Her task was to make a master copy, a book clean enough to be lent to other houses. She cleared the desk and climbed the ladder to the shelves. She brought down five copies of the chronicle, produced over the decades since Hildegarde's time. She laid them out like cards on a table, opening each to the passage of the river ford.

  The first book said **LX**.
  The second said **LX**.
  The third, fourth, and fifth all said **LX**.

  Elisabeth rubbed her eyes. She had spent the morning checking the dates against the phases of the moon recorded in the margins of a psalter kept in the sacristy. If sixty men crossed, the bridge must have broken on a Tuesday. But the moon phase suggested a Sunday. On a Sunday, no work was done. If fifty men crossed, the timeline held. The math of the heavens pointed to **L**.

  She looked at the five books again. They were not identical; different hands had written them, different inks had stained them. One had a red initial, another had a smudge on the corner. They came from different years, copied by different women. It was impossible that all five would make the same error. If they all agreed on sixty, then sixty it must be. Her calculation regarding the moon must be the flaw. Perhaps there was an intercalary day she had missed, or the scribe of the psalter had miscounted the cycles.

  She could write **L**. She had the quill in her hand. But to write **L** would be to claim that five mothers of the house, now dead, had been wrong. It would be to say that her own calculation, done in a single morning, outweighed the accumulated labor of forty years. The books sat before her, silent and heavy. They did not argue; they simply were.

  Elisabeth dipped her pen. She wrote **LX**. She blew on the ink to dry it. It looked solid. It looked like the truth. She turned the page, feeling the quiet relief of agreement. The books were stacked back on the shelf, their spines aligned. They looked like a wall.

  **III.**

  Eighty years after that, Margaret was tasked with rebinding the old chronicles. The leather was rotting, and the threads snapped when she touched them. She took the five copies Elisabeth had used down from the shelf. She laid them on the floor of the scriptorium, dismantling the bindings one by one to measure the quires.

  As she peeled back the pasteboard of the oldest copy, a loose sheet slipped out. It was not part of the text. It was a note tucked into the binding, written in a hand she recognized from the colophon of the very first book Hildegarde had made. It described the copying process. *Copied from the water-damaged original,* the note read. *Corrected where the sense was lost.*

  Margaret froze. She looked at the second book. She looked at the third. She traced the lineage in her mind. The second was copied from the first. The third from the second. The fourth and fifth were twins, made from the third. They were not five witnesses. They were one voice, echoed five times.

  She went to the chest where the original water-damaged exemplar was kept, wrapped in oilcloth. She unwrapped it. The page was stiff with old damp. She held it to the window. The light was failing, grey and thin. The numeral was just an **L**. There was no trace of an **X**. There was only the grey blur where an **X** might have been, or where an **L** might have been weakened.

  Margaret stood between the chest and the desk. On the desk lay the master copy Elisabeth had made, the one used by the whole house. It said **LX**. In her hand, she held a knife for scraping parchment.

  If she scraped away the **X**, she would restore the original mark. But the original mark was ambiguous. Hildegarde had added the **X** because of the bread ledgers. Those ledgers were lost, burned in a fire ten years prior. There was no way to check the bread now. There was only the note in the binding, and the water-stained **L**, and the five books that shouted **LX**.

  If she changed the number back to **L**, she would create a conflict. The next scribe who came to make a copy would see one book saying **L** and five saying **LX**. That scribe would do exactly what Elisabeth had done. She would trust the five. She would overwrite Margaret's correction. The error—if it was an error—would snap back into place like a bent twig.

  If she left it as **LX**, she knew it rested on a single moment forty years ago, in a cold room, based on a memory of bread that might itself have been wrong. Hildegarde might have misremembered the ledger. She might have confused the crossing party with the reserve unit. One woman's memory, one stroke of a quill, had become the history of the battle.

  Margaret looked at the knife. The edge was sharp. She could scrape the **X** away. She could write a marginal note explaining the lineage of the copies. But who would read the note? The text was read; the margins were ignored.

  The light in the room dimmed. The candles needed trimming. She thought of Hildegarde, dipping her quill in the cold ink. She thought of Elisabeth, counting the books on the shelf. They had not been careless. They had not been lazy. They had done exactly what reason demanded. They had looked at what was before them and trusted the weight of what they saw.

  Margaret put the knife down. She picked up the quill. She opened the master copy to the page of the river ford. The **LX** stared back at her, dark and secure. To change it was to invite chaos into the record, to make the history uncertain for everyone who came after. To keep it was to bury the doubt.

  She dipped the pen. She did not scrape the parchment. Instead, she turned to the blank leaf at the back of the book. She wrote a short line, noting that the original exemplar was damaged at the count of the ford. She did not say what the number should be. She did not say Hildegarde had guessed. She simply marked the spot where the certainty began to fray.

  It was not enough. In ten years, the next binder might discard that leaf as useless waste. In twenty years, the master copy might be recopied, and the note would not travel. The **X** would remain. The wall of books would stand.

  Margaret blew out the candle. The scriptorium went dark. The five copies on the floor waited in the silence, identical and separate, holding the same mistake tight against their spines. It would have taken so little for Hildegarde to leave the blur alone. It would have taken so little for Elisabeth to trust the moon. But the ink was dry, and the cold had settled in, and the number was sixty.
