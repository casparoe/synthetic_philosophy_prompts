answer: |-
  Bottom line
  We fund community value, not just historical accuracy. We distinguish living custom from symbolic tradition. We require plausible continuity, not unbroken proof. We reject claims that actively deceive the public. We map these findings to the existing five-band scoring sheet.

  What survives the translation
  Keep Hobsbawm's distinction between "custom" and "tradition." Custom is flexible, adaptive, and law-like within a community (e.g., how villagers settle disputes or share harvests). Tradition is invariant, ritualistic, and often imposed to establish continuity with a suitable historic past. For us, this means funding "custom" supports living culture, while funding "tradition" supports symbolic continuity. Drop Hobsbawm's heavier Marxist analysis about legitimizing institutions; it complicates the lay decision without changing the outcome. Keep Anderson's core point that a community being "imagined" does not make it fake. The feeling of belonging is socially real, even if the history is constructed. Drop Anderson's focus on nationalism and print capitalism; we are dealing with parish halls, not nations.

  The distinction is load-bearing for you because it stops you from judging a flexible community practice by the rigid standards of a ritual. If a group adapts a practice to survive, that is custom, not a failed tradition. Anderson saves you from the "authenticity police" label by validating the *function* of the tradition even if the *fact* is recent. An invented tradition is not a lie if it responds to a genuine social need, but it becomes a lie if it claims false antiquity to gain authority. Your committee needs to know that "imagined" means "constructed by belief," not "false." This allows you to fund a thirty-year event as a tradition without calling it Victorian. The goal is to support the community's cohesion, not to act as forensic historians, unless the forensic history is being used to exclude others.

  The procedure
  1. **Claim Type:** Is this custom or tradition? If the practice changes to fit current needs (custom), score Band 4-5 regardless of age. If it claims invariant ritual continuity (tradition), proceed to Gate 2. *Exit:* If custom, fund as community development.
  2. **Continuity Linkage (Revised Transmission Test):** Kill the "name every generation" rule; it fails oral cultures. Ask: Is there a plausible mechanism of transmission? Can the applicant name a person, institution, or record linking the past to now, allowing for gaps caused by war, suppression, or privacy? *Exit:* If no plausible link, max Band 2.
  3. **Evidence Weight:** Does the file rely solely on written records? If yes, apply a "silence discount." Oral testimony counts if corroborated by context (e.g., photos, oral histories). *Exit:* If oral testimony is strong but written evidence is weak, do not drop below Band 3.
  4. **Community Function (Anderson Check):** Does this tradition serve a genuine current social need (cohesion, identity)? If yes, it is valid even if invented. If no, it is merely decorative. *Exit:* If purely decorative, max Band 3.
  5. **Truthfulness:** Does the public claim actively deceive? "Ancient" when "1998" is the truth is a deceive. "Tradition of the Estate" for a 30-year event is ambiguous but acceptable. *Exit:* If deceptive, refuse funding or require copy amendment.

  **Mapping to Bands:** Band 1 (No continuity) = Fail Gate 2. Band 2 (Weak continuity) = Pass Gate 2, Fail Gate 4. Band 3 (Revival) = Pass Gate 2 & 4, Fail Gate 5 (copy issues). Band 4 (Strong continuity) = Pass all, minor evidence gaps. Band 5 (Unbroken) = Pass all, strong evidence. The bands measure our confidence, not objective reality.

  Evidence and silence
  An empty file is not proof of non-existence, but it is proof of non-documentation. For oral cultures, silence is expected. Accept oral testimony if the witness is credible and the practice fits the local context (e.g., harvest rituals in farming villages). However, require a "corroboration triangle": oral testimony plus one physical artifact (photo, object) plus one contextual record (census, map). If the file is empty because records were burned or the community was marginalized, shift the burden of proof to the committee to justify refusal. Do not let the absence of paper veto the presence of memory. But if the claim is specific ("since Tudor times"), the burden shifts back to the applicant to provide at least one pre-1900 reference. Silence handles the "nothing at all in between" problem by allowing you to fund the *revival* without endorsing the *antiquity*. You are funding the current community's use of the past, not the past itself.

  Where it hands over to people
  Gates 1-4 are factual checks; Gate 5 is a values call. The officers run Gates 1-4 and recommend a Band. The committee votes on Gate 5 and the final funding. This is where Anderson matters: the committee decides if the "imagined community" is worth supporting. Refusals must never say "You are lying." Say: "The application claims historical continuity that the evidence cannot support under our criteria." Or: "We are funding this as a new community initiative rather than a heritage restoration." This protects the applicant's dignity while maintaining your standards. The committee chair signs off on refusals to ensure political cover. If the committee overrides the officers on a Band 1 case, record the dissent. This protects the officers from being the "authenticity police" while keeping the procedure honest.

  Where this will misfire
  This procedure punishes undocumented communities. If a practice was oral and the elders died without speaking to historians, it will score low on Gate 3. You will structurally favour church and property records. Acknowledge this bias in your annual report. It also lets confident liars through. A smooth applicant can fabricate a "plausible mechanism" in Gate 2. You cannot catch every fraud without becoming the police you hate. Accept that some money will go to invented pasts; Anderson says this is socially functional anyway. The real risk is Gate 5: if the committee values "heritage" as "old stuff" rather than "community value," they will reject valid new traditions. Conversely, if they value "inclusivity" too highly, they will fund everything. The procedure cannot stop a committee determined to ignore it. It only stops them from saying they didn't know. Finally, the "custom vs tradition" gate may split hairs too finely for laypeople. If they confuse the two, you will fund rituals as customs or vice versa. Train them on the difference: does it change? Then it's custom.

  Worked cases
  **1. Ashcombe St Mary (Orchard Blessing)**
  Verdict: Band 2 (Weak continuity). Fund as new community initiative, not heritage restoration.
  The claim "since Tudor times" fails Gate 2 (Continuity Linkage). The 1878 mention is hearsay; the 1954 note is a one-off. The 2016 draft is a revival. However, it passes Gate 4 (Community Function) as it binds the parish. Do not refuse, but reclassify.
  Public Sentence: "We are pleased to support this community gathering, though our assessment categorises it as a contemporary revival rather than a continuous historical practice."

  **2. Tourism Board (Charter Fair)**
  Verdict: Band 3 (Revival). Fund signage conditional on copy amendment.
  The 1274 charter is real, but the 1841-1998 gap fails Gate 2 for continuous practice. The "time immemorial" claim fails Gate 5 (Truthfulness) as it is legally and historically inaccurate. The pasty is openly 1974. Fund the fair as a revival of a historic right, not an unbroken tradition.
  Public Sentence: "Funding is approved for signage celebrating the historic charter, provided copy reflects the event's 1998 revival rather than implying unbroken continuity."

  **3. Internal Flagship (Victorian Christmas)**
  Verdict: Band 4 (Strong continuity). Fund, but amend copy; reject sponsorship condition if it demands lies.
  Thirty-one years is three generations of staff/visitors. It passes Gate 2 for its own lifespan. It fails Gate 5 if "tradition of the estate" implies Victorian origins. Anderson allows it to be a tradition, but Hobsbawm warns against using invention to legitimize the estate's status falsely.
  Public Sentence: "We will continue this thirty-year tradition, updating our materials to accurately reflect its modern origins while honouring its established place in our community."

  The one-pager
  **Heritage Trust Decision Matrix**

  | Gate | Question | Pass | Fail |
  | :--- | :--- | :--- | :--- |
  | **1. Type** | Custom (flexible) or Tradition (invariant)? | Custom → Band 4/5 | Tradition → Gate 2 |
  | **2. Link** | Plausible transmission mechanism? | Yes → Gate 3 | No → Band 1/2 |
  | **3. Evidence** | Written only or Oral + Context? | Oral OK → Gate 4 | Written Only → Gate 4 |
  | **4. Function** | Genuine social need? | Yes → Gate 5 | No → Band 3 |
  | **5. Truth** | Does public copy deceive? | No → Fund | Yes → Amend/Refuse |

  **Scoring Bands**
  1. **No Continuity:** Fail Gate 2. Refuse or fund as entirely new.
  2. **Weak Continuity:** Pass Gate 2, Fail Gate 4. Fund as community dev.
  3. **Revival:** Pass 2 & 4, Copy issues. Fund if copy amended.
  4. **Strong Continuity:** Pass all, minor gaps. Fund fully.
  5. **Unbroken:** Pass all, strong evidence. Fund fully.

  **Refusal Wording**
  "The application claims historical continuity that the evidence cannot support under our criteria. We are funding this as a new community initiative rather than a heritage restoration."

  **Officer Note**
  Silence ≠ Non-existence. Oral testimony counts. Do not be the authenticity police; be the steward of community value.
