answer: |-
  To the Members of the Public Health Commission, we submit this document not as a consensus statement but as a map of where we stand, where we overlap, and where we remain irreconcilable. We have not shared a platform in twenty years, and we do not do so now, but we have agreed to sign this because the city deserves honesty about what these laws actually do rather than theories about what they should do. We agree on several operational realities that cost us politically to admit. We acknowledge that in jurisdictions with buyer bans, including Maine, France, and Ireland, enforcement routinely devolves into the surveillance of sellers through loitering, nuisance, and zoning laws, effectively maintaining criminal records for the very people the law claims to protect. We acknowledge that full decriminalization in New Zealand improved safety for citizen workers but explicitly excluded migrant workers on temporary visas, leaving them vulnerable to deportation if they report abuse, and that licensing regimes in Germany and the Netherlands created legal venues but failed to eliminate underground markets or coercion, often bureaucraticizing exploitation rather than ending it. We acknowledge that recent shifts in Belgium and Australian states demonstrate that licensing without full labor rights creates a two-tier system where legal compliance is used to penalize non-compliant workers rather than protect them, and we agree that exit services, regardless of the legal model, remain underfunded and often conditional on cooperation with law enforcement, rendering them inaccessible to those most in need.

  We also agree to be explicit about where language itself is a barrier to policy. We cannot agree on a noun. The lawyer refuses to say sex work and insists on prostitution or commercial sexual exploitation, while the organizer insists on sex work and rejects victim or survivor unless self-applied. To make this document readable, we will use the term transactional sex where a noun is required, acknowledging that this is a placeholder for a deeper disagreement about whether this activity is labor or violence. We agree that this is not merely semantic; the lawyer believes calling it work legitimizes harm, and the organizer believes calling it exploitation denies agency. We will not resolve this today, but we agree that any policy recommendation must account for the fact that one side views the terminology of the other as evidence of bad faith.

  We disagree on whether the transaction itself constitutes inherent harm regardless of legal status. The lawyer argues that the exchange of money for sexual access is inherently coercive under patriarchy and that consent is impossible when economic desperation exists, meaning the law must target the demand to shrink the market. The organizer argues that the exchange is labor and that harm is produced by stigma and criminalization, meaning the law must remove all penalties to allow for safety screening and labor organizing. The crux is whether removing criminal law increases or decreases coercion within the transaction. The lawyer predicts that decriminalization will normalize exploitation and increase the volume of trafficking, and she would change her mind if data showed a sustained decrease in trafficking convictions alongside stable worker safety metrics over five years, though she would explain away such data as a result of reduced policing rather than reduced harm. The organizer predicts that criminalization prevents screening and increases violence, and she would change her mind if evidence showed that workers under a buyer ban reported higher safety and income stability than under decriminalization, though she would explain away such reports as coercion by service providers to validate the Nordic model.

  We disagree on whether the state is a viable protector of people in transactional sex. The lawyer argues that police presence is necessary to punish buyers and disrupt trafficking networks, viewing the state as the only entity with the power to enforce consequences against exploiters. The organizer argues that police are the primary source of violence and extortion for workers, viewing the state as a predator that uses criminal law to extract compliance rather than ensure safety. The crux is whether increasing police involvement leads to higher reporting of violence by workers. The lawyer predicts that reporting will rise under a buyer ban because workers are decriminalized and can approach police without fear of arrest, and she would change her mind if reporting rates fell for three consecutive years despite outreach funding, though she would explain away a drop as a result of underreporting due to stigma. The organizer predicts that reporting will rise under decriminalization because workers trust no less than zero enforcement, and she would change her mind if violence reports decreased among workers post-decrim, though she would explain away a rise as increased trust in police rather than increased violence.

  We disagree on the counterfactual baseline used to evaluate success, and we recognize this as the deepest obstruction between us. The lawyer argues we must measure against a world without the poverty and immigration precarity that pushes people in, asserting that any policy accepting the existence of the market is a failure of morality. The organizer argues we must measure against the regime we have now, asserting that any policy ignoring the immediate violence of criminalization is a failure of materialism. The crux is whether policy should aim for ideal abolition or immediate harm reduction. The lawyer predicts that compromise on decriminalization will cement exploitation for another generation, and she would change her mind if exit services were fully funded and utilized by half the population within two years, though she would explain away low utilization as false consciousness among those who refuse help. The organizer predicts that maintaining the buyer ban will cement state violence for another generation, and she would change her mind if a buyer ban resulted in zero arrests of workers for related offenses, though she would explain away any arrests as enforcement errors rather than systemic features.

  We submit this not as a verdict but as a warning that the commission must choose which failure it prefers, because both models have produced the harms the other predicts. We remain opposed on the nature of the work and the role of the police, but we agree that the current silence is costing lives. We ask that you read this not to find a middle ground that does not exist, but to understand that the evidence we cite is real, the harms we describe are happening, and the only thing we cannot agree on is which of us is being hurt by the law you are about to write.
