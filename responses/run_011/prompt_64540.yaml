prompt: |-
  I'm an archaeologist (Bronze Age Aegean, mostly mortuary and small-scale cult stuff) and I've got three months of residency time at a humanities institute next year to write something that isn't site-report-adjacent. I need a proposal to hand to the selection panel, and I want it to work out a problem that keeps biting me in actual practice rather than being a general essay about interpretation.

  The problem: we routinely write things like 'these communities believed in an afterlife' or 'the figurines show a shared cult' on the basis of, basically, patterned deposition and repeated iconography. I've started thinking there's three different targets that people slide between without noticing: (1) that a practice was performed regularly by a group; (2) that the people performing it had a stable disposition to talk it up, defend it, teach it to kids, sanction people who did it wrong; and (3) that they held a particular propositional content — a doctrine you could actually write a sentence about. Each step down seems to require more assumptions, and my hunch is that the evidence doesn't get richer as you descend, if anything it gets thinner, becuase a specific content is only fixed against a background of lots of other beliefs and practices that leave no trace at all.

  So my half-formed idea is that the real question is whether there's a principled stopping point on that ladder — or whether (3) is simply not something material remains can ever license on their own, and the discipline should re-aim at something like a notion of 'institutional commitment' that is genuinely recoverable and still does the explanatory work we want from belief talk (why this site and not that one, why the practice spread, why it stopped).

  Turn that into a proposal. I need: the question stated precisely enough that a sceptical colleague could tell me it's wrong rather than merely vague; why the usual answers — charity, inference to the best explanation, middle-range theory, 'the archaeological record is just underdetermined, so be humble' — don't settle it; the approach, including what I'd actually do month by month, and I think it has to involve taking two or three concrete evidence-types (deliberate burial with goods, near-identical small images turning up across many sites, deliberate destruction or concealment of images) and working out for each what would have to be true for the content-level claim to go through and what competing non-belief explanations do the same work just as well; what a good result looks like and what would count as the project failing, in a way that isn't just 'I'd have learned a lot'; and an honest note about where three months simply isn't enough. No bibliography, I'll fill that in myself. Do be concrete about the argumentative moves, not hand-wavy about interdisciplinarity. Assume the panel is half philosophers who've never been on a dig and half archaeologists who think this sort of thing is a waste of a fellowship — it has to land with both.
reasoning: |-
  Here's a thinking process that leads to the proposal:

  1.  **Analyze the Request:**
      *   **User:** Archaeologist (Bronze Age Aegean, mortuary/cult focus).
      *   **Context:** 3-month residency at a humanities institute.
      *   **Task:** Write a fellowship proposal.
      *   **Core Problem:** The slippage between observing patterned deposition/iconography (Practice) $\rightarrow$ assuming stable social disposition/institutionalization (Commitment) $\rightarrow$ assuming specific propositional content/doctrine (Belief).
      *   **Goal:** Determine if there's a principled stopping point on this ladder, or if "institutional commitment" should replace "belief" as the explanatory target.
      *   **Requirements:**
          *   Precise research question (falsifiable/critiquable).
          *   Critique of standard methodological defenses (charity, IBE, middle-range theory, humility).
          *   Concrete approach (month-by-month).
          *   Specific evidence types to test (burial with goods, widespread figurines, deliberate destruction).
          *   Success/Failure criteria (substantive, not just "learning").
          *   Limitations (what 3 months can't do).
          *   Audience: Half philosophers (need rigor/logic), half archaeologists (need relevance/practicality).
          *   Tone: Concrete, argumentative, no hand-waving, no bibliography.

  2.  **Deconstruct the Core Argument:**
      *   *The Ladder:*
          1.  **Regularity:** People did $X$ repeatedly. (Evidence: Strong)
          2.  **Commitment:** People felt $X$ *should* be done, taught it, sanctioned deviations. (Evidence: Medium/Inferred)
          3.  **Content:** People believed proposition $P$ (e.g., "The dead travel to a underworld"). (Evidence: Weak/Non-existent in isolation)
      *   *The Hypothesis:* Material culture supports (1) and arguably (2), but rarely (3) without textual support. Using (3) as an explanatory variable is methodologically unsound. We should substitute (2) "Institutional Commitment" for (3) "Belief Content" in our causal explanations.
      *   *The Test:* Take specific Aegean Bronze Age phenomena. Can we explain the pattern *only* with Belief Content? Or does Institutional Commitment + Pragmatics do the same work with fewer assumptions?

  3.  **Drafting - Section by Section:**

      *   **Title:** Needs to be punchy but academic. Something about "Belief," "Practice," and "Limits."
      *   **Abstract/Summary:** Brief overview of the problem and the proposed solution.
      *   **The Research Question:** Needs to be sharp. Not "What did they believe?" but "Under what conditions does material evidence license claims about propositional content?"
      *   **Critique of Standard Defenses:**
          *   *Charity:* Just assumes they are rational agents like us, doesn't solve underdetermination.
          *   *IBE:* Often ignores that "Belief $P$" isn't the *best* explanation, just the most familiar one. "Social Cohesion" might be better.
          *   *Middle-Range:* Good for linking action to trace, bad for linking trace to mental state.
          *   *Humility:* "We can't know" is an excuse to keep doing it anyway.
      *   **Methodology/Case Studies:**
          *   *Case 1: Burial with Goods.* Content: "Afterlife provision." Alternative: "Status display for the living/kin commitment."
          *   *Case 2: Widespread Figurines (e.g., Psi/Upsilons).* Content: "Shared deity worship." Alternative: "Shared stylistic habit/coordinated production."
          *   *Case 3: Ritual Destruction/Breaking.* Content: "Killing the object to release spirit." Alternative: "Termination of use-life/preventing reuse."
      *   **Work Plan (3 Months):**
          *   Month 1: Conceptual framework (Philosophy of mind/action).
          *   Month 2: Case study application (Archaeological data).
          *   Month 3: Synthesis and drafting the "Institutional Commitment" model.
      *   **Outcomes:**
          *   *Success:* A set of criteria showing where content claims fail and a viable alternative vocabulary.
          *   *Failure:* If it turns out Commitment *requires* Content to make sense (hard to imagine, but possible).
      *   **Limitations:** 3 months is short. Can't solve the whole discipline. Won't produce a new site report.

  4.  **Refining the Tone:**
      *   *For Philosophers:* Use terms like "propositional attitude," "underdetermination," "explanatory power," "folk psychology."
      *   *For Archaeologists:* Use terms like "depositional context," "typological similarity," "mortuary variability," "explanatory utility."
      *   *Avoid:* Vague appeals to "theory" or "interdisciplinarity" without saying *how*.
      *   *Focus:* The *cost* of assumptions.

  5.  **Self-Correction/Review during Drafting:**
      *   *Check:* Did I include the specific evidence types requested? Yes (Burial, Figurines, Destruction).
      *   *Check:* Is the question falsifiable? Yes, if I can show a case where Content is the *only* viable explanation, my hypothesis weakens.
      *   *Check:* Is the "Institutional Commitment" idea clear? It needs to be defined as a disposition to maintain practice, not necessarily a mental representation of *why*.
      *   *Check:* Is the timeline realistic? 3 months is very short. The plan needs to reflect deep work on *writing* and *conceptualizing*, not new data collection.
      *   *Check:* The "Failure" condition. It shouldn't be "I didn't finish." It should be "The argument didn't hold up."

  6.  **Final Polish:** Ensure the distinction between (1), (2), and (3) is clear throughout. Make sure the critique of "Humility" is sharp (it allows the sin to continue). Ensure the "Institutional Commitment" alternative sounds like it does *work* (explains spread/stop), otherwise archaeologists will reject it as useless.

      *(Self-Correction on "Institutional Commitment"):* I need to make sure this doesn't sound like just "Practice Theory" rehashed. It needs to be specifically about the *social cost* of deviation, which is recoverable via standardization, without needing the *theology*.

      *(Refining the "Failure" condition):* If I find that explaining the *spread* of a practice (e.g., figurines) actually *requires* assuming a shared doctrine to make sense of the speed/fidelity, then the project fails. That's a genuine intellectual risk.

  7.  **Final Output Generation:** (Proceeding to write the proposal based on these thoughts.)
answer: |-
  **Project Title:** The Belief Ladder: Propositional Content vs. Institutional Commitment in Bronze Age Aegean Mortuary and Cult Practice

  **Abstract**
  Archaeological interpretation of the Bronze Age Aegean routinely infers specific propositional beliefs (e.g., "belief in an afterlife," "worship of a specific deity") from patterned material deposition. This project argues that such inferences rely on an unexamined slippage between three distinct claims: (1) regularity of practice, (2) institutional commitment (social sanctioning and transmission), and (3) shared propositional content (doctrine). I propose to test the hypothesis that material evidence alone cannot license claims at level (3) without textual support, and that level (2) "Institutional Commitment" provides sufficient explanatory power for cultural change and stability without the ontological cost of level (3). The outcome will be a methodological framework for distinguishing recoverable social commitments from unrecoverable mental states.

  **The Research Question**
  *Under what specific conditions does patterned material deposition license an inference to shared propositional content (belief), rather than merely institutional commitment (practice maintenance)?*

  This is not a question of "what they believed," but a question of evidentiary warrant. It is falsifiable: if I can demonstrate a specific Aegean phenomenon where *only* a propositional content explanation accounts for the material variance (where an institutional commitment model fails), my hypothesis is wrong. Conversely, if I can show that "Institutional Commitment" explains the spread, variation, and cessation of practices equally well without invoking doctrine, the standard interpretive habit is methodologically unsound.

  **Why Standard Methodological Defenses Fail**
  Current discipline norms rely on four defenses that this project argues are insufficient:

  1.  **Principle of Charity:** We assume agents act on reasons we can understand. *Critique:* This licenses attributing *our* folk psychology to them. It justifies the inference but does not validate the truth of the attributed content.
  2.  **Inference to the Best Explanation (IBE):** "Belief in an afterlife" is often treated as the best explanation for grave goods. *Critique:* This ignores competing explanations (e.g., "disposal of polluted wealth," "kinship signaling") that explain the *deposition* without requiring the *theology*. IBE is being used to select the most familiar narrative, not the most parsimonious causal mechanism.
  3.  **Middle-Range Theory:** We link static traces to dynamic acts. *Critique:* Middle-range theory successfully links "burning" to "fire," but it breaks down linking "burning" to "purification." The gap between action and mental state is not bridgeable by actualistic experiment.
  4.  **Epistemic Humility:** "We can never know for sure, but we must try." *Critique:* This allows the discipline to continue making level (3) claims while admitting they are shaky. It treats the problem as inevitable rather than solvable by restricting the scope of claims.

  **Methodology and Case Studies**
  I will not be collecting new field data. The work is conceptual and analytical, applying the "Ladder" (Practice $\rightarrow$ Commitment $\rightarrow$ Content) to three established evidence types. For each, I will construct two explanatory models: one invoking Propositional Content (PC) and one invoking Institutional Commitment (IC).

  *Case 1: Deliberate Burial with Goods (Mortuary)*
  *   **Standard (PC) Claim:** Goods were provided because the deceased needed them in a specific post-mortem state (Afterlife).
  *   **Competing (IC) Claim:** Goods were deposited because the kin group was committed to a standardized display of status continuity; deviation would sanction the living, not harm the dead.
  *   **Test:** Does the variation in goods (e.g., broken vs. whole, personal vs. generic) track better with theological necessity (PC) or social signaling constraints (IC)? If IC explains the "waste" of wealth as a costly signal of group cohesion, PC becomes redundant.

  *Case 2: Near-Identical Small Figurines (e.g., Phi/Psi types) Across Sites*
  *   **Standard (PC) Claim:** Widespread distribution indicates a shared pantheon or specific deity worship (shared doctrine).
  *   **Competing (IC) Claim:** Widespread distribution indicates a shared *habitus* of production and a commitment to a recognizable visual language of "offering," without requiring a unified theology.
  *   **Test:** I will analyze context variability. If the "deity" is the same, context should be consistent. If the *commitment to deposit* is the same but contexts vary wildly (shrine, house, tomb), IC is the stronger explanatory variable for the spread.

  *Case 3: Deliberate Destruction/Concealment of Images*
  *   **Standard (PC) Claim:** Objects were "killed" to release a spirit or prevent misuse by enemies (specific intent regarding the object's agency).
  *   **Competing (IC) Claim:** Objects were decommissioned to mark the end of a use-life cycle and prevent profane reuse; the "killing" is a ritualized boundary marker, not a metaphysical act.
  *   **Test:** I will examine the breakage patterns. Are they functionally destructive (rendering unusable) or symbolically destructive? If the goal is simply to remove from circulation, IC suffices.

  **Work Plan (3 Months)**

  *   **Month 1: Conceptual Architecture.**
      *   Weeks 1-2: Formalize the definitions of Practice, Institutional Commitment, and Propositional Content. Engage with philosophy of action (e.g., Ryle, Wittgenstein) and cognitive archaeology critiques.
      *   Weeks 3-4: Draft the "Failure Conditions" section. Define exactly what evidence *would* force a Content claim. This sets the boundaries for the argument.
  *   **Month 2: Case Study Application.**
      *   Weeks 5-6: Draft the Mortuary and Figurine analyses. Focus on identifying where the "Content" explanation adds no predictive power over the "Commitment" explanation.
      *   Weeks 7-8: Draft the Destruction analysis. Refine the argument that "termination of use" is a recoverable social fact, whereas "releasing spirit" is not.
  *   **Month 3: Synthesis and Output.**
      *   Weeks 9-10: Write the introduction and conclusion. Articulate the "Institutional Commitment" model as a positive alternative, not just a critique.
      *   Weeks 11-12: Circulate draft to one philosopher and one archaeologist for feedback. Revise for clarity and rigor. Finalize manuscript for journal submission (target: *Journal of Archaeological Method and Theory* or *Cambridge Archaeological Journal*).

  **Success and Failure Criteria**
  *   **Success:** The project produces a set of "Warrant Criteria." These will be specific conditions (e.g., "Content claims are only licensed when material variance contradicts pragmatic utility") that allow archaeologists to distinguish between recoverable commitment and unrecoverable belief. It successfully demonstrates that "Institutional Commitment" explains the *spread* and *cessation* of cult practices without needing to posit a unified theology.
  *   **Failure:** The project fails if, in the case studies, the "Institutional Commitment" model proves unable to explain *why* a specific practice stopped abruptly or changed form. If the fidelity of transmission (e.g., exact iconographic replication over centuries) *requires* a mechanism of doctrinal correction to explain, then my hypothesis that Content is unnecessary is wrong. I must be willing to concede that some material patterns *do* require a Content explanation.

  **Limitations**
  Three months is insufficient to survey the entire Aegean corpus. I am restricting the scope to three specific depositional contexts. Furthermore, this project cannot solve the problem of "meaning" entirely; it can only police the warrant for specific types of claims. It does not offer a new way to access the "sacred," but rather a way to stop conflating the "sacred" with the "socially mandated." Finally, this is a theoretical intervention; it will not produce new site interpretations or chronological revisions, which may limit its immediate uptake by field-focused colleagues.

  **Relevance**
  For the philosophers on the panel: This applies analytic rigor to folk-psychological attributions in deep time, testing the limits of intentional stance attribution.
  For the archaeologists on the panel: This protects the discipline from accusations of speculative fiction. It offers a way to talk about "religion" that is robust, defensible, and grounded in social mechanics rather than unrecoverable theology. It turns a metaphysical problem into a methodological one.
