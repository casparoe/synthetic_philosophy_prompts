answer: |-
  The principle generating your verdicts is **The Principle of Immanent Causal Power.**

  Here is the precise formulation: **A generalization is a law of nature if and only if it describes the invariant manifestation of intrinsic dispositions possessed by objects in virtue of their natural kinds.**

  On this view, properties *are* potentials. To be an electron is *to be* a thing disposed to repel other electrons, curve in magnetic fields, etc. Laws are not summaries of history (Humeanism), nor are they external rulers commanding matter (Governing View). Laws are the structural description of what things *do* because of what they *are*. The modality is built into the furniture of the world, not imposed upon it.

  ### The Tritium Verdict
  You asked me to pick one: Is the chance that *this particular* tritium atom decays in the next hour a fact about the world, or a compressed report of your own ignorance?

  **Verdict:** It is a **single-case propensity**. It is an objective fact about the world.

  **Why:** On the Immanent Causal Power view, the tritium nucleus possesses a specific dispositional nature: a power to decay with a certain probability density per unit time. This power exists even if the atom is the only thing in the universe and even if it never actually decays (if, hypothetically, time ended). The probability is not a measure of your ignorance (epistemic), nor is it a long-run frequency (Humean). It is the *strength* of the disposition. A chipped coin has a different physical shape, which grounds a different disposition; the fair coin has a symmetry that grounds a symmetric disposition. The disposition is real, so the single-case chance is real.

  ### The Cost: Which Intuition Dies?
  To hold this view consistently, you must abandon **Intuition #4**.

  > *4. If exactly one event in cosmic history had gone differently — one rock floated upward for a second, once, with no downstream consequences — I still want to call that a violation of a law that otherwise holds. Laws can survive one-off violations.*

  **This is incompatible with Immanent Causal Power.** If laws are descriptions of what objects *must* do in virtue of their nature, a fundamental violation is metaphysically impossible. If a rock floats upward without a new force acting on it, then either:
  1.  It wasn't a rock (it didn't have the mass/disposition you thought).
  2.  Gravity wasn't operative (the field wasn't present).
  3.  Your statement of the law was false to begin with.

  You cannot have a "violation" of a law grounded in essence. A violation implies the law is a rule *over* the object (Governing View), which can be disobeyed. But you explicitly rejected governance in #8 ("Governance smells like leftover theology"). You cannot have it both ways. You cannot deny the law is a governor (#8) and then claim the object can disobey the law (#4). If the law is just what the object *does*, then if the object does otherwise, the law was never true.

  **The Sacrifice:** You must accept that fundamental laws are exceptionless. If you see an exception, you have found a new variable or a new kind, not a "miracle." (Note: Special science laws can have exceptions because they describe complex systems where powers can be masked or interfered with, but your example specifies "one event in cosmic history," implying a fundamental context).

  ### Resolving Your Tensions

  **Tension 1: #4 vs #5 (Exceptions vs. Cheats)**
  *Your Conflict:* You allow one-off violations (#4) but reject spatiotemporal clauses (#5).
  *The Resolution:* By dropping #4, the tension vanishes. The Immanent Causal Power view explains #5 perfectly without needing #4.
  *Why Reykjavik is a Cheat:* Dispositions are intrinsic. They depend on *what* the object is, not *where* or *when* it is. A power to repel is grounded in charge. A power to repel *except in Reykjavik* requires the object to have an intrinsic sensitivity to the city limits of Reykjavik, which is an extrinsic, historical fact. That requires a "baroque" ontology where objects have haecceitic powers tied to specific coordinates. The principle rules this out naturally: powers track natural kinds, not map coordinates.

  **Tension 2: #8 vs #10 (No Governance vs. Decision Theory)**
  *Your Conflict:* You want causation without a lawgiver (#8), but you need fixed laws for counterfactual decision-making (#10).
  *The Resolution:* Immanent Causal Power satisfies both.
  *Why:* Humeanism fails #10 because if laws are just summaries of history, changing your decision changes the history, which potentially changes the best summary (the law). This makes decision-theoretic counterfactuals unstable. Governing views satisfy #10 but fail #8 (they require a "necessitation" relation that looks like rule-following).
  *The Fix:* On the Powers view, the laws are fixed because the *natures* of the objects are fixed. When you deliberate, you are manipulating the *conditions* under which powers manifest, not changing the powers themselves. "If I hit send" introduces a new configuration of objects (your finger, the key), triggering existing dispositions (electronics, network protocols). The counterfactual is robust because the dispositions don't change when you deliberate. Causation is real (#8) because it is the actual exercise of these powers, not a logical relation between propositions.

  ### Running the Principle on Your List

  1.  **Single Particle Inertia:** **KEEP.** Inertia is a disposition of mass to maintain velocity absent interference. Even with one particle, the disposition exists.
  2.  **Single Particle Zigzag:** **KEEP.** An utterly irregular zigzag implies no stable disposition. If there is no stable power, there is no law. The "straight line" is the manifestation of a simple power; the zigzag is noise.
  3.  **Gold vs. Uranium:** **KEEP.** Uranium has an atomic structure that *grounds* a disposition to fission/criticality. Gold does not. The generalization about gold is accidental because "being gold" does not dispositionally necessitate "not being a mile wide"; it's just contingent history.
  4.  **One-off Violation:** **DROP.** As argued above. This is the price of admission.
  5.  **Reykjavik Clause:** **KEEP.** Dispositions are intrinsic; city limits are not.
  6.  **Robustness to Initial Conditions:** **KEEP.** Powers exist regardless of whether they are triggered. Gravity exists even if no apples fall.
  7.  **Symmetry:** **KEEP.** Symmetry principles reflect the invariance of the dispositions themselves. You can know this armchair because you are analyzing the concept of the disposition, not counting instances.
  8.  **Causation vs. Governance:** **KEEP.** Causation is the manifestation of power. Governance is rejected.
  9.  **Propensity:** **KEEP.** As per the Tritium verdict.
  10. **Decision Theory:** **KEEP.** Counterfactuals track the stable dispositions of the world, which remain fixed while you vary your intervention.

  ### A New Test Case: The Teleporting Electron

  To check this principle yourself, consider this case:

  **Case:** An electron travels from A to B. In every observed instance, it moves continuously. However, you propose a law: "Electrons move continuously, except that exactly once in the history of the universe, an electron teleports instantaneously from X to Y with no causal mediation."

  **Humean (BSA) Verdict:** If the teleportation happens, the best system might include this exception if it's still simpler than a law that forbids it. If it doesn't happen, the law is just "continuous motion." The law depends on the history.

  **Governing Verdict:** The law forbids teleportation. If it happens, the law was broken (miracle).

  **Immanent Causal Power Verdict:** **The law is false.**
  If the electron has the disposition of mass and charge, and spacetime has the disposition of metric connectivity, continuous motion is the necessary manifestation. If a teleportation occurs, then either:
  1.  It wasn't an electron (it was a different kind with a teleportation power).
  2.  Spacetime had a different disposition at that point (a wormhole existed).
  3.  There is no law of continuous motion.

  You cannot save the law by adding an "except once" clause, because the disposition of *being an electron* does not include a disposition to *teleport once*. Dispositions are stable. A "one-time power" is not a natural kind property; it is a magical indexical.

  **How to use this:** When you encounter a new case, ask: **"Does this generalization track a stable capacity of the things involved, or does it track a pattern in the events?"**
  *   If it tracks a capacity (Uranium fissions), it's a law.
  *   If it tracks a pattern that could change without the things changing (Gold spheres), it's an accident.
  *   If it requires the capacity to change based on where/when it is (Reykjavik), it's a cheat.
  *   If it claims the capacity can fail without changing the thing (Violations), it's incoherent.

  ### Summary of the Trade
  You gain a robust foundation for decision theory (#10), real chance (#9), and a non-theological account of causation (#8). You lose the ability to call miracles "violations of law" (#4). You must accept that if a miracle happens, the law was simply false, or the ontology was misunderstood. This is the only consistent way to ground the counterfactuals you need for rationality without invoking a cosmic lawgiver you reject on theological grounds.
