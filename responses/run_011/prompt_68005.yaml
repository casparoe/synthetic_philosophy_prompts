answer: |-
  # Joint Statement on the Attribution of the National Socialist Regime
  **Prepared by the Adversarial Collaboration on Historical Causality (Agency & Structure Working Groups)**

  ## I. Shared Claims
  *Both representatives sign the following propositions, adopting the vocabulary of attribution science as requested.*

  1.  **Event Definition Dependency:** We agree that the attribution fraction changes depending on whether the *explanandum* is defined as: (a) the specific historical trajectory of the Third Reich (1933–1945), (b) the outbreak of a major European war in that decade, or (c) the implementation of industrialized genocide against European Jewry. Disagreements previously recorded as substantive are often artifacts of differing event definitions.
  2.  **Probabilistic Output:** We agree that historical causation cannot be expressed as binary necessity (A caused B) but must be expressed as a change in likelihood. The question is not "Did Hitler cause the war?" but "By what factor did the presence of this specific agent increase the probability of the event relative to a counterfactual baseline?"
  3.  **Occurrence vs. Character:** We agree on the distinction between factors determining the *occurrence* of a class of events (e.g., authoritarian backlash in post-Versailles Germany) and factors determining the *magnitude and character* of a specific event (e.g., the specific ideological fervor and timing of the Holocaust). A structural forcing may be decisive for occurrence while an agential forcing is decisive for character.
  4.  **Limits of Attribution:** We agree that if an event lies sufficiently far outside the historical "instrumental record" (i.e., prior historical analogues), the attribution fraction may be indeterminate. We further agree that stating an event is "unattributable" due to insufficient data or uniqueness is not equivalent to stating it was "uncaused."
  5.  **Counterfactual Validity:** We agree that counterfactual claims ("If not Hitler, then...") are model-dependent. They rely on assumptions about the stability of structural conditions and the substitutability of agents. Neither side claims access to the "true" counterfactual world, only to modeled approximations.

  ## II. Table of Residual Disagreements
  *Formulated such that each side accepts the wording as a accurate description of their stance.*

  | Feature | Agency Camp Position | Structure Camp Position |
  | :--- | :--- | :--- |
  | **Baseline Probability** | The baseline probability of *this specific regime* (NSDAP ideology + expansionist timing) without Hitler is near zero. The structural conditions were necessary but insufficient. | The baseline probability of *a functionally equivalent regime* (authoritarian, revanchist, antisemitic) without Hitler is high. The structural conditions were sufficient to produce a similar outcome. |
  | **Agent Substitutability** | Agents are not interchangeable. The specific psychological and rhetorical traits of the leader are non-linear multipliers that cannot be modeled by averaging potential successors. | Agents are largely interchangeable within structural constraints. A different leader would have been selected by the same structural pressures to perform a similar function, yielding a similar outcome. |
  | **Event Identity** | The Holocaust is a unique event inextricably linked to the specific agent's will. Removing the agent changes the event identity entirely. | The Holocaust is an instance of a broader class of state-led ethnic cleansing. Removing the agent might alter the timing or method, but not the fundamental class of the event. |
  | **Attribution Fraction** | The Fraction of Attributable Risk (FAR) for the specific trajectory of the war and genocide is > 0.8 (mostly agential). | The FAR for the outbreak of conflict and systemic persecution is < 0.2 (mostly structural). |

  ## III. Cruxes and Pre-Registered Predictions
  *Sub-questions where resolution would shift the attribution fraction. Both sides agree on the evidence type required.*

  | Crux | Question | Evidence/Argument Required | Agency Prediction | Structure Prediction |
  | :--- | :--- | :--- | :--- | :--- |
  | **C1: The Successor Counterfactual** | If Hitler had died in 1932, who leads the NSDAP, and what is their policy vector? | Comparative analysis of named successors (Göring, Strasser, Hugenberg) and their documented policy positions prior to 1933. | Successors lack the specific ideological commitment or political skill to seize total power; the movement fragments or remains marginal. | Successors are constrained by the same party base and economic pressures; they adopt similar policies to maintain cohesion and power. |
  | **C2: Structural Pressure Magnitude** | How deterministic were the economic and geopolitical pressures on Germany (1929–1933)? | Quantitative analysis of voting shifts correlated with economic indicators across similar democracies in the same period. | Economic distress increased the *possibility* of extremism but did not dictate the *specific form* (Nazism) it took. | Economic distress made an authoritarian, revanchist regime statistically inevitable regardless of leadership specifics. |
  | **C3: The "Out of Distribution" Test** | Is the industrialized genocide comparable to prior or contemporary state violence? | Historical survey of state-led mass killings 1850–1930 to establish a baseline "climate" of violence. | The scale and ideological motivation are outliers (extreme events) requiring a specific "forcing" (Hitler). | The scale is continuous with prior colonial and wartime violence; it is an intensification of existing trends, not a novelty. |

  ## IV. Verbal vs. Substantive Disagreements

  **1. The Event Definition Disagreement (Verbal)**
  We judge the disagreement over whether "The Regime" includes "The Genocide" as primarily verbal.
  *   **Agency** defines the event as "The Holocaust as historically executed."
  *   **Structure** defines the event as "Systematic persecution and ethnic violence."
  *   **Resolution:** If both sides agree to calculate attribution separately for (a) the seizure of power, (b) the initiation of war, and (c) the specific implementation of the Final Solution, the divergence in attribution fractions narrows significantly. The Agency camp concedes structural causes for (a); the Structure camp concedes agential causes for (c).

  **2. The Substitutability Disagreement (Substantive)**
  We judge the disagreement over human agency to be substantive. It rests on a philosophical claim about whether human decision-making is reducible to structural inputs. No amount of data clarification resolves whether a different human mind *would* have made a different choice given identical inputs. This survives definition clarification.

  ## V. Excluded Claims
  *Claims omitted because they could only be signed by weakening them to vacuity.*

  *   **Excluded:** "Historical laws exist similar to physical laws."
      *   **Reason:** Structure camp requires this; Agency camp denies it. Weakening it to "patterns exist" renders it useless for attribution modeling.
  *   **Excluded:** "The outcome was inevitable."
      *   **Reason:** Agency camp cannot sign. Weakening to "highly probable" conflates probability with necessity, violating Shared Claim #2.

  ***

  # Annex: Independent Assessment
  **From the Desk of the Collaboration Facilitator**

  You asked for a verdict on whether the attribution framework you sketched should be adopted as shared scaffolding or rejected as a false analogy.

  **Verdict: Adopt as Scaffolding, with one critical modification.**

  The analogy is robust. Your discipline's move from "Did CO2 cause this storm?" to "Did CO2 make this storm more likely?" is exactly the move philosophy of history needs to make regarding "Did Hitler cause the war?" The four lessons you listed map cleanly onto the historical problem. Specifically, Lesson 1 (Event Definition) dissolves the loudest noise in the debate, and Lesson 3 (Occurrence vs. Character) allows both camps to be partially right without contradiction.

  However, the analogy breaks at Lesson 4 (Out of Distribution). In climate science, the physics are continuous. Even a 1-in-10,000-year heatwave obeys the same thermodynamics as a 1-in-10-year heatwave. In history, the "physics" (human psychology and social dynamics) may change phase at extremes. A genocide of industrial scale may not be just a "hotter" version of prior pogroms; it may be a different phenomenon entirely. If the event is truly *sui generis*, the counterfactual baseline is not just unknown; it is nonexistent. You cannot calculate a risk ratio against a baseline of zero.

  **The Decisive Crux:**
  The one genuinely decisive crux is **C3: The "Out of Distribution" Test.**

  **Which way it cuts:**
  It cuts against the **Structure Camp**.

  **Reasoning:**
  If the Holocaust is merely an intensification of existing European antisemitism and state violence (Structure view), then structural attribution holds. If, however, the specific convergence of ideological fanaticism, bureaucratic capability, and timing required for the Holocaust represents a phase shift outside the historical baseline (Agency view), then structural models fail.

  The historical record suggests that while authoritarianism and antisemitism were high-probability outcomes in 1930s Germany (Structure wins on *occurrence* of repression), the specific trajectory toward total extermination was not a linear extension of prior trends. It required a specific, high-energy forcing to overcome the friction of bureaucracy, military opposition, and logistical constraints that slowed or halted similar impulses elsewhere.

  Therefore, the attribution framework validates the **Agency Camp's** claim regarding the *magnitude and character* of the genocide, even if it validates the **Structure Camp's** claim regarding the *occurrence* of an authoritarian regime. The framework does not produce a single winner; it produces a partitioned verdict. The Structure Camp explains the climate; the Agency Camp explains the lightning strike. Without the lightning, the fire does not start, even if the forest was dry.

  **Final Recommendation:** Use the framework to partition the question. Do not ask "Did Hitler cause the war?" Ask "What is the attributable risk of Hitler for the *timing* of the war, and what is the attributable risk for the *genocidal character* of the occupation?" The former is low; the latter is near-total.
