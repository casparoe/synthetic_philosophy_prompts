answer: |-
  Here is the spec for Eliminative Materialism (EM) adequacy, designed to cut through the "dead on arrival" vs. "word games" stalemate.

  ### Part 1: The Desiderata List
  *Purpose: Adequacy-as-a-Philosophical-Position. The theory must be coherent enough for a cognitive scientist to assert it without immediate logical self-destruction or empirical embarrassment.*

  | Requirement | Description | Motivation | Status |
  | :--- | :--- | :--- | :--- |
  | **1. Self-Referential Coherence** | The theory must explain the act of asserting the theory without covertly relying on the ontology it eliminates (e.g., asserting "there are no beliefs" without relying on the belief that there are no beliefs). | Prevents performative contradiction. If the theory makes its own assertion impossible, it is logically dead. | **Non-Negotiable** |
  | **2. The Elimination/Reduction Criterion** | A clear metric for distinguishing between *replacing* a concept (elimination) and *refining* a concept (reduction). Must specify why FP terms don't map to successor states even approximately. | Defines the position. Without this, EM collapses into Identity Theory or Functionalism. | **Non-Negotiable** |
  | **3. The Error Theory of Success** | An explanation for why Folk Psychology (FP) is predictively successful in daily life despite being ontologically false (analogous to why flat-earth maps work for local navigation). | FP *works*. If EM says FP is false, it must explain this utility without conceding truth. | **Non-Negotiable** |
  | **4. Neuro-Compatibility** | The successor ontology cannot contradict established, hard constraints from neuroscience (e.g., neural implementation, processing speeds). | EM is a materialist position. It cannot posit dualist magic to solve the elimination problem. | **Non-Negotiable** |
  | **5. Preservation of First-Person Authority** | The theory must account for the *feeling* of privileged access to one's own mental states as infallible or near-infallible. | Phenomenology. We feel like we know what we think. | **FP Prejudice** |
  | **6. Normativity of Content** | The theory must preserve the notion that mental states can be "correct" or "incorrect" relative to the world (truth conditions). | Intentionality. Beliefs aim at truth. | **FP Prejudice** |
  | **7. Systematicity & Productivity** | The successor theory must explain why cognitive capacities are structured (if you can think *A*, you can think *not-A*). | Fodor's constraint. Thought looks linguistic/combinatorial. | **Contested** (Leans FP Prejudice) |
  | **8. Intertheoretic Continuity** | The transition from FP to the successor theory should not look like a "magical discontinuity" in the history of science. | Scientific realism. Theory change is usually smooth. | **FP Prejudice** |

  ***

  ### Part 2: The Elimination vs. Reduction Criterion
  *This is the metaphysical hinge. Most arguments fail because they slide across this line.*

  **The Bridge Law & Limit-Case Test:**
  A successor theory **Reduces** Folk Psychology if:
  1.  **Derivability:** Generalizations of FP (e.g., "If X wants Y and believes Z will get Y, X will do Z") can be derived from the successor theory as limit-case approximations.
  2.  **Reference Preservation:** The terms of FP ("belief," "desire") continue to refer to real patterns in the successor ontology, even if the micro-structure is different (like "heat" referring to mean kinetic energy).
  3.  **Causal Role Retention:** The causal powers attributed to beliefs in FP are largely preserved in the successor states.

  A successor theory **Eliminates** Folk Psychology if:
  1.  **Derivability Failure:** FP generalizations are derived as *false* statements. (e.g., "Organisms do not store propositional attitudes; they adjust vector weights.")
  2.  **Reference Failure:** FP terms fail to refer to anything in the successor ontology (like "phlogiston" or "demon possession").
  3.  **Causal Role Discontinuity:** The causal explanation of behavior in the successor theory renders the causal role of "belief" obsolete, not just refined.

  **The Verdict Rule:** If you can translate the successor theory back into FP without significant loss of predictive power, you are a Reductionist. If translation requires an "error clause" (e.g., "It looks like belief, but it's actually..."), you are an Eliminativist.

  ***

  ### Part 3: Internal Tensions (The No-Go Possibilities)
  *If these tensions cannot be resolved, EM is not just false; it is incoherent.*

  **Tension A: Self-Reference vs. No Content (The "Assertability" Trap)**
  *   **Conflict:** Requirement 1 (Coherence) demands you explain the assertion of EM. Requirement 6 (Normativity) is marked as a prejudice, meaning EM denies content/truth conditions.
  *   **The Problem:** To assert a theory is to claim it is *true*. If the theory eliminates the very machinery required to bear truth (propositional attitudes), the theory cannot be true.
  *   **The Stakes:** If EM cannot naturalize "assertion" without using "belief," Requirement 1 and the core tenet of EM are incompatible. The position refutes itself.

  **Tension B: Error Theory vs. Predictive Success (The "Phlogiston" Trap)**
  *   **Conflict:** Requirement 3 (Error Theory) vs. Requirement 8 (Continuity).
  *   **The Problem:** Phlogiston theory was eliminated because it failed to predict/explain (e.g., weight gain during combustion). FP predicts behavior remarkably well across cultures and ages.
  *   **The Stakes:** If FP is *that* successful, Intertheoretic Continuity (Req 8) suggests it must be approximately true (Reduction). If EM insists it is false (Elimination), the Error Theory must explain why a *false* theory is *universally* robust. If the explanation is too complex, it violates parsimony.

  **Tension C: Neuro-Compatibility vs. No Bridge Laws**
  *   **Conflict:** Requirement 4 (Neuro) vs. Requirement 2 (Elimination Criterion).
  *   **The Problem:** Contemporary neuroscience often uses FP-adjacent terms ("memory encoding," "attention," "decision").
  *   **The Stakes:** If EM posits *no* bridge laws, it risks contradicting the working vocabulary of neuroscience. If it accepts the neuroscience vocabulary, it risks smuggling FP back in via the back door.

  ***

  ### Part 4: Vector Psych Run-Through
  *Theory: Vector Psych. High-dimensional state space trajectories. No content. No bridge laws to "believes that p." No truth conditions. Predictive success equals FP.*

  | Requirement | Pass/Fail | Analysis of Failure (if applicable) |
  | :--- | :--- | :--- |
  | **1. Self-Referential Coherence** | **FAIL** | Vector Psych explains behavior via trajectories. It does not explain the *assertion* of Vector Psych. To assert "Vector Psych is true" is to hold a content-bearing state about the world. Vector Psych has no room for "aboutness." |
  | **2. Elimination/Reduction Criterion** | **PASS** | Explicitly posits no bridge laws and no approximate limit cases. It treats FP as a category error, not a rough draft. |
  | **3. Error Theory of Success** | **PASS** | Stipulated by prompt: "Predicts and explains behavior at least as well as belief/desire talk." It can claim FP is a useful user-interface illusion. |
  | **4. Neuro-Compatibility** | **PASS** | High-dimensional state spaces fit connectionist and neural network models better than discrete propositional attitudes. |
  | **5. First-Person Authority** | **FAIL** | Vector Psych denies the existence of the "self" that has authority. It treats introspection as just another vector trajectory, prone to error. (Marked as FP Prejudice, so failure is acceptable). |
  | **6. Normativity of Content** | **FAIL** | States carry no "fitting the world" conditions. (Marked as FP Prejudice, so failure is acceptable). |
  | **7. Systematicity** | **PASS** | Vector spaces can support compositionality (vector addition/multiplication) without linguistic structure. |
  | **8. Intertheoretic Continuity** | **FAIL** | The lack of bridge laws creates a sharp discontinuity. (Marked as FP Prejudice, so failure is acceptable). |

  **Does the Failure Matter?**
  *   **Failures on 5, 6, 8:** These do not matter for *philosophical adequacy* because they are FP-Preservationist prejudices. An eliminativist *should* fail these.
  *   **Failure on 1 (Self-Reference):** This **is fatal**. A theory that cannot account for its own assertion is not a theory; it is a noise.
  *   **Failure on 2, 3, 4, 7:** These are passed, meaning the theory is scientifically plausible and distinctively eliminative.

  ***

  ### Part 5: The Verdict

  **The Killer Requirement: Self-Referential Coherence.**

  This is the single requirement that knocks out the most candidates (including Vector Psych).

  **Why?**
  Most eliminativist proposals succeed at being *scientifically* plausible (matching neuroscience, explaining behavior) but fail at being *philosophically* stable. They function as "parasitic" positions: they use the machinery of Folk Psychology (argument, assertion, truth-claims, belief-updates) to argue that the machinery of Folk Psychology does not exist.

  *   **Reductionists** survive this easily (they keep the machinery).
  *   **Eliminativists** must rebuild the machinery from scratch (e.g., explaining "assertion" as a causal discharge of vectors).
  *   **Vector Psych** fails because it offers a model of *behavior* but not a model of *discourse*. It explains why you run from a tiger, but not why you write a paper claiming tigers trigger vector trajectories.

  **Conclusion for the Group:**
  The stalemate exists because one side is arguing about **Requirement 2** (Is it elimination or reduction?) while the other is arguing about **Requirement 1** (Can you even say that?).
  *   If you think Requirement 1 is a "word game," you are assuming Requirement 6 (Normativity) is non-negotiable.
  *   If you think Requirement 1 is fatal, you are assuming that *assertion* requires *content*.

  To move forward, the group must decide: **Can a cognitive science of behavior exist without a cognitive science of truth?** If yes, EM is live. If no, EM is self-refuting. Vector Psych says "Yes," but fails to demonstrate it. Until an eliminativist theory can explain the *assertion of eliminativism* without using beliefs, Requirement 1 remains the gatekeeper.
