      *   **Context:** Philosophy of Mind reading group discussing Eliminative Materialism (EM).
      *   **Problem:** Stalemate. One side says EM is self-refuting (performative contradiction), the other says that's verbal trickery. No one knows what would settle it.
      *   **Task:** Create a list of *desiderata* (requirements) for an adequate eliminativist account of belief/desire.
      *   **Specific Constraints:**
          *   Distinguish non-negotiable requirements from camp-specific prejudices.
          *   Highlight tensions/incompatibilities within the list itself.
          *   Include a criterion for *elimination vs. reduction* (the core metaphysical hinge).
          *   Evaluate specific contested demands (predictive success, first-person authority, normativity, systematicity).
          *   **Purpose:** Adequacy-as-a-philosophical-position (intellectual respectability for a cognitive scientist), *not* adequacy-as-a-finished-science (no need for a full working theory yet).
          *   **Test Case:** Run the list against an invented theory called "Vector Psych" (high-dimensional state space, no content, no bridge laws, no truth conditions).
          *   **Output Format:** Desiderata list with markings (non-negotiable vs. prejudicial), tension analysis, Pass/Fail table for Vector Psych, and a verdict on the "killer requirement."
          *   **Exclusions:** No grading historical Churchland/Stich positions, no bibliography.

  2.  **Deconstruct the Core Conflict (EM vs. Folk Psychology):**
      *   *Eliminativism:* Folk Psychology (FP) is a radically false theory. Beliefs/desires don't exist, like phlogiston.
      *   *The Objection:* You can't assert EM without believing EM. Therefore, beliefs exist. Therefore, EM is false.
      *   *The Reply:* That's begging the question. We need a way to talk about "asserting" without committing to propositional attitudes.
      *   *The Goal:* What does a *coherent* EM look like? What does it owe us?

  3.  **Drafting the Desiderata (The "Spec"):**
      *   *Requirement 1: The Elimination/Reduction Criterion.* This is explicitly requested. How do we know we aren't just reducing?
          *   *Motivation:* If beliefs reduce to neural states, EM is false (it's just Identity Theory). If they eliminate, EM is true.
          *   *Status:* Non-negotiable. It defines the position.
      *   *Requirement 2: Self-Referential Coherence.* The "you can't assert it" objection.
          *   *Motivation:* Avoid performative contradiction.
          *   *Status:* Non-negotiable. A position that refutes itself in the asserting is logically dead.
      *   *Requirement 3: Accommodation of Predictive Success.* FP works pretty well in daily life.
          *   *Motivation:* If FP is false, why does it work? (Like Newtonian physics is "false" but works).
          *   *Status:* Non-negotiable (needs an error theory), but the *degree* of success required is contested.
      *   *Requirement 4: First-Person Authority.* I know what I believe.
          *   *Motivation:* Phenomenology.
          *   *Status:* Prejudicial (FP camp). EM denies the infallibility/existence of the *object* of authority.
      *   *Requirement 5: Normativity of Content.* Beliefs aim at truth.
          *   *Motivation:* Intentionality.
          *   *Status:* Prejudicial (FP camp). EM denies content exists.
      *   *Requirement 6: Systematicity & Productivity.* Thought is structured (if you think A&B, you can think B&A).
          *   *Motivation:* Fodor's argument.
          *   *Status:* Contested. Connectionists (often allied with EM) deny this is a hard constraint.
      *   *Requirement 7: Neuro-Compatibility.* Can't contradict hard neuroscience.
          *   *Motivation:* Materialism.
          *   *Status:* Non-negotiable.
      *   *Requirement 8: The Replacement Promise.* Need a sketch of what *does* exist.
          *   *Motivation:* Can't just be negative.
          *   *Status:* Non-negotiable (for philosophical adequacy).

  4.  **Refining the "Elimination vs. Reduction" Criterion:**
      *   Need a sharp test.
      *   *Reduction:* Smooth mapping, limit cases, preservation of causal role.
      *   *Elimination:* Discontinuity, error theory, ontology change.
      *   *Proposed Criterion:* **The Bridge Law Test.** If you can derive FP generalizations from the new theory (even approximately), it's reduction. If FP generalizations turn out to be *false* descriptions of the new ontology, it's elimination.

  5.  **Identifying Tensions:**
      *   *Tension A:* Self-Referential Coherence vs. No Content. To assert EM coherently, you seem to need propositional content. If you deny content, how do you assert?
      *   *Tension B:* Predictive Success vs. Radical Falsehood. If FP is *so* false it needs eliminating, why is it so useful? (The "Phlogiston didn't keep houses warm" objection).
      *   *Tension C:* Neuro-Compatibility vs. No Bridge Laws. Neuroscience often uses FP terms (e.g., "memory," "attention"). If EM bans these, does it conflict with current neuro-talk?

  6.  **Developing "Vector Psych" (The Test Case):**
      *   *Features:* High-dimensional vectors, trajectories, no content, no truth conditions, no bridge laws to "believes that p".
      *   *Evaluation:*
          *   Elimination Criterion: Pass (No bridge laws).
          *   Self-Referential: Fail (How does it explain the assertion of Vector Psych itself without beliefs?).
          *   Predictive Success: Pass (By stipulation in prompt).
          *   First-Person Authority: Fail (Denies the phenomenon).
          *   Normativity: Fail (Denies content).
          *   Systematicity: Pass/Fail (Depends on vector math, likely Pass via compositionality of vectors, but not linguistic).
          *   Neuro-Compatibility: Pass (Fits connectionism).

  7.  **Determining the "Killer Requirement":**
      *   What stops most EM candidates?
      *   Is it the self-refutation? (Churchland tries to solve this).
      *   Is it the predictive success? (FP is too robust).
      *   *Decision:* The **Self-Referential Coherence** requirement is the hardest hurdle because it attacks the *act of proposing the theory*, not just the theory's content. However, the **Elimination/Reduction Boundary** is the most *conceptual* hurdle.
      *   *Refinement:* The prompt asks for the requirement that knocks out the most *candidates*. Historically, the "performative contradiction" is the most common dismissal. But philosophically, the "Error Theory of Success" (explaining why FP works if it's false) is the hardest *theoretical* work.
      *   *Wait, looking closer at the prompt:* "Verdict on which single requirement knocks out the most candidates."
      *   *Analysis:* Many EM versions fail because they tacitly rely on the very notions they eliminate to explain why we talk the way we do. So, **Self-Referential Coherence** (specifically, accounting for the *assertion* of the theory without using the eliminated ontology) is the biggest filter.

  8.  **Drafting the Content (Iterative refinement for tone and precision):**
      *   *Tone:* Analytic, precise, slightly provocative (fitting a philosophy reading group).
      *   *Structure:*
          1.  Introduction (Setting the stage).
          2.  The Desiderata List (Categorized by Non-Negotiable vs. Prejudicial).
          3.  The Elimination/Reduction Criterion (Deep dive).
          4.  Tension Analysis (Where the list breaks).
          5.  Vector Psych Evaluation (The Table).
          6.  The Verdict (The Killer Requirement).

      *(Self-Correction during drafting)*: Make sure to distinguish "Adequacy-as-Philosophical-Position" from "Adequacy-as-Science." I don't need Vector Psych to be *true*, just *coherent*.
      *(Self-Correction on Prejudices)*: Be careful labeling things "prejudicial." It's not that FP proponents are biased, it's that demanding FP phenomena be *preserved* rather than *explained away* begs the question against EM. I need to frame this carefully. "Phenomenological Preservation" is a prejudice against EM. "Phenomenological Explanation" is a requirement for EM.

      *(Refining the Elimination/Reduction Criterion)*: Use the "Smoothness of Mapping" idea. Reduction = smooth mapping. Elimination = discontinuity + error theory.

      *(Refining Vector Psych)*: Ensure it fits the prompt's description (no bridge laws, no truth conditions).

      *(Final check on the "Killer")*: Is it Self-Reference or the Reduction/Elimination line? The prompt says "basically every argument in the area depends on which side of that line eliminativism is supposed to fall." This suggests the Reduction/Elimination criterion is the conceptual bottleneck. However, the "self-refutation" is the rhetorical bottleneck. I will argue the **Self-Referential Coherence** is the practical killer, but the **Elimination/Reduction** criterion is the theoretical pivot. I'll pick Self-Referential Coherence as the one that knocks out *candidates* (theories/proposals), because many proposals collapse when asked "In what state are you when you assert that?"

      *Wait, let's look at the "Adequacy-as-Philosophical-Position" constraint.* If I'm a cognitive scientist holding this openly, I need to be able to speak without embarrassment. If I say "I don't believe in beliefs," people laugh. To avoid embarrassment, I need to answer the "self-refutation" charge. So that is the key requirement for *social/philosophical* adequacy.

      *Let's finalize the Tension:* The tension between "FP is radically false" and "FP is predictively robust." If it's robust, it's likely approximately true (reduction). If it's false, it shouldn't work (elimination). Reconciling this is the hard part.

      *Okay, let's write.*

