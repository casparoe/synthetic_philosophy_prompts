answer: |-
  You have described a very specific and well-documented sociological phenomenon, but you are right that there isn't one single "magic word" that captures the entire shape of it. Instead, it is usually described as a combination of three concepts from institutional theory and sociology.

  The closest specific term for the *institutional survival mechanism* you are describing is **Goal Succession**.

  However, to get the full picture (including the "pile-up" of reasons and the distinction from genuine side effects), you need to layer that with **Manifest vs. Latent Functions** and **Exaptation**.

  Here is how the literature breaks down the shape you are seeing.

  ### 1. The Mechanism: Goal Succession
  You mentioned "goal displacement" felt like a near miss. You were close. In sociology (specifically Philip Selznick's work on institutions), **Goal Displacement** usually refers to a negative process where the *rules* become more important than the *outcome* (bureaucracy for bureaucracy's sake).

  What you are describing is **Goal Succession**. This occurs when an organization or institution achieves its original goal, or the original goal becomes obsolete (e.g., the invasion threat fades), but the institution itself does not dissolve. To ensure its own survival, it adopts *new* goals that justify its continued existence.

  *   **Why it fits:** It explains why the institution stays the same while the "story" changes. The primary objective is no longer the original mission; the primary objective becomes *institutional survival*, and the new reasons (flood relief, social cohesion) are the succession goals.

  ### 2. The Content: Manifest and Latent Functions
  This comes from Robert Merton (1940s). It distinguishes between:
  *   **Manifest Functions:** The intended, stated reasons (e.g., "National Defense").
  *   **Latent Functions:** The unintended, unrecognized consequences (e.g., "Teaching punctuality," "Social mixing").

  The pattern you are observing is the **Promotion of Latent Functions**. When the Manifest Function (defense) loses credibility, the institution reaches into its bag of Latent Functions and promotes them to Manifest status. They were always there, but they weren't "load-bearing" until the main pillar cracked.

  ### 3. The Evolutionary Analogy: Exaptation
  Borrowed from evolutionary biology (Gould and Vrba), this term describes a trait that evolved for one purpose but is co-opted for another. Feathers evolved for warmth, were later exapted for flight.

  Conscription is an **Institutional Exaptation**. The structure was built for war. When war became less likely, the structure was exapted for disaster relief, cyber defense, or social engineering. This explains why the *shape* of the institution doesn't change even if the *purpose* does. It is easier to reuse the existing heavy machinery than to build new, specialized tools for flood relief or youth discipline.

  ### 4. The "Pile-Up" Structure: Argumentative Overdetermination
  You asked specifically about the structure where "lots of weak reasons get replenished as they are spent." In policy studies and rhetoric, this is often called **Argumentative Accumulation** or **Justificatory Redundancy**.

  In logic, **Overdetermination** means there are more causes present than are necessary to produce an effect. In public debate, this is used strategically. If you rely on one reason (Defense), you are vulnerable. If you rely on five reasons (Defense + Cohesion + Discipline + Rescue + Cyber), you become "anti-fragile." If an opponent knocks down the Defense argument, the proponent says, "Well, it's also about Cohesion."

  This creates a **Protective Belt** of arguments. The individual reasons don't need to be strong enough to carry the weight alone; they only need to be strong enough to keep the institution alive until the next reason matures.

  ### How to distinguish this from "Genuine Side Effects"
  You asked how to tell this apart from an institution that genuinely has a bunch of good side effects and is honestly listing them. This is the critical analytical step. Sociologists and policy analysts use three tests to distinguish **Goal Succession** from **Genuine Polyfunctionality**:

  **1. The "Design Test" (Efficiency)**
  If the goal is truly "teaching young men punctuality" or "disaster relief," is conscription the *efficient* way to achieve it?
  *   **Genuine:** If the institution was designed specifically to optimize for these new goals, or if the new goals drive changes in how the institution operates.
  *   **Succession/Exaptation:** If the institution remains optimized for the *old* goal (war) while claiming to serve the *new* goal. (e.g., If the goal is social cohesion, why is it still structured around military hierarchy? If the goal is flood relief, why is the training 90% combat-focused?)
  *   *The Tell:* If you wouldn't build this specific system from scratch to achieve the new stated goals, it's likely Goal Succession.

  **2. The "Timing Test" (Convenience)**
  *   **Genuine:** The benefits are acknowledged consistently over time, regardless of political pressure.
  *   **Succession:** The "new" reasons appear precisely when the "old" reason is under attack. If "social cohesion" wasn't a priority argument in 1990 when defense was popular, but becomes a priority argument in 2020 when defense is questioned, it is a rationalization, not a core function.

  **3. The "Cost-Benefit Test"**
  *   **Genuine:** The benefits are proportional to the cost.
  *   **Succession:** The benefits are real, but trivial compared to the cost. "Teaching punctuality" is a real benefit, but is it worth taking a year of every young person's life? If the answer is no, but the argument is used anyway, it is part of a **Justificatory Pile-up**.

  ### Summary
  There isn't one word, but if you want to search for the literature, the most accurate phrase for the whole shape is **Institutional Goal Succession via Latent Function Promotion.**

  *   **The Shape:** Argumentative Overdetermination (the pile-up).
  *   **The Mechanism:** Goal Succession (changing the 'why' to save the 'what').
  *   **The Nature:** Exaptation (using an old tool for new jobs).

  The reason it feels slippery is that the proponents aren't necessarily lying. The latent functions *are* real. The "trick" is that they are being used as *sufficient* justifications when they are actually only *incidental* benefits. The literature generally views this as a sign of a mature, entrenched institution that has moved from serving a specific need to serving its own perpetuation.
