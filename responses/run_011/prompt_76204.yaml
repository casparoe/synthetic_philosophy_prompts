  **Setting:** Two food trucks choosing locations (North/Central/South vs East/Market/West); payoffs are daily profits in hundreds of dollars.

  ***

  ### Walkthrough of Iterated Strict Dominance

  **Round 1: Eliminate Player 2's "West"**
  At the outset, no pure strategy strictly dominates another for either player. However, Player 2's **West** is strictly dominated by a mixed strategy of **East** and **Market**.
  *   **Mixture:** 50% East, 50% Market.
  *   **Comparison against Player 1's North:** $0.5(100) + 0.5(90) = 95$. West yields 94. ($95 > 94$)
  *   **Comparison against Player 1's Central:** $0.5(95) + 0.5(85) = 90$. West yields 89. ($90 > 89$)
  *   **Comparison against Player 1's South:** $0.5(80) + 0.5(98) = 89$. West yields 88. ($89 > 88$)
  Since the mixture yields a strictly higher payoff against every possible strategy of Player 1, **West** is strictly dominated and eliminated.

  *Confirmation of No Other Initial Dominance:*
  *   **Player 1:** Each of Player 1's strategies is a strict best response to one of Player 2's strategies. **North** is best against East (100 > 90, 80); **Central** is best against Market (95 > 70, 85); **South** is best against West (105 > 50, 60). If a strategy is a strict best response to some opponent strategy, it cannot be strictly dominated by any mixture of other strategies. Thus, Player 1 has no dominated strategies.
  *   **Player 2:** Similarly, **East** is Player 2's strict best response to North (100 > 90, 94), and **Market** is Player 2's strict best response to South (98 > 80, 88). Therefore, neither East nor Market is dominated (by pure or mixture). Only West is dominated.

  **Round 2: Eliminate Player 1's "South" (Pure vs Pure)**
  With West removed, the game is 3×2. Compare Player 1's **South** vs **Central**.
  *   Against East: Central (90) > South (80).
  *   Against Market: Central (95) > South (85).
  **Central** strictly dominates **South**. Eliminate **South**.

  **Round 3: Eliminate Player 2's "Market" (Pure vs Pure)**
  With South removed, the game is 2×2 (North/Central vs East/Market). Compare Player 2's **Market** vs **East**.
  *   Against North: East (100) > Market (90).
  *   Against Central: East (95) > Market (85).
  **East** strictly dominates **Market**. Eliminate **Market**.

  **Round 4: Eliminate Player 1's "Central" (Pure vs Pure)**
  With Market removed, the game is 2×1 (North/Central vs East). Compare Player 1's **Central** vs **North**.
  *   Against East: North (100) > Central (90).
  **North** strictly dominates **Central**. Eliminate **Central**.

  **Survivor:** The unique surviving cell is **(North, East)** with payoffs **(100, 100)**.

  ***

  ### Equilibrium Confirmation
  The cell **(North, East)** is a strict Nash Equilibrium.
  *   **Player 1:** Deviating to Central yields 90 (<100); deviating to South yields 80 (<100).
  *   **Player 2:** Deviating to Market yields 90 (<100); deviating to West yields 94 (<100).
  Since the game is dominance-solvable to a single cell, this strict Nash Equilibrium is unique. No other pure or mixed equilibrium can exist because any equilibrium must survive iterated strict dominance.

  ***

  ### Analysis

  **1. The Feature Doing the Work**
  The structural feature enabling the initial mixed dominance is that the dominated strategy (**West**) is "consistently mediocre." Its payoff profile is strictly bounded *between* the profiles of the dominating strategies (**East** and **Market**) across all opponent rows, yet it never peaks high enough to be a best response. Specifically, **East** performs very well against North but poorly against South; **Market** performs well against South but poorly against North. **West** splits the difference—it beats **East** against South and beats **Market** against North, but it loses to the *average* of East and Market in every single case. This "convexity" in the payoff space allows a mixture to cover the weaknesses of the pure strategies while avoiding the specific weakness of the dominated strategy.

  **2. The Objection to Mixed Dominance**
  A skeptic might argue: "Rationality requires choosing a specific action, not a randomization. If I never intend to flip a coin between East and Market, why should I discard West just because a coin flip would beat it? I should only discard West if a specific location I might actually pick beats it."

  **Objection Validity:** This objection fails because dominance is about *preference consistency*, not implementation. If a mixture strictly dominates a pure strategy, it implies that the pure strategy is suboptimal relative to the player's own utility function regardless of risk attitude (since the dominance is state-by-state strict). More importantly, in a strategic context, if a strategy is never a best response to any belief about the opponent (which is true for **West**), it cannot be part of any rationalizable plan. Rejecting mixed dominance forces us to admit strategies as "rational" even when they are provably inferior to available probabilistic plans, which undermines the coherence of expected utility theory. The cost of rejecting it is accepting that a player can knowingly choose an option that is worse than a lottery they could have constructed, simply because they refuse to acknowledge the lottery as a valid benchmark.
