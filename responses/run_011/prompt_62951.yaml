      *(Refining the Tension)*: The user mentioned "classifiability in real time... versus not letting concealment itself do the classifying work." I need to articulate this as the "Epistemic Lag vs. Moral Hazard" tension.

      *(Refining the Anchors)*: Ensure Bengal, Ireland, and GLF are implicitly or explicitly referenced in the motivations for the desiderata.

  8.  **Final Review against constraints:**
      *   Desiderata list with Motivation and Status? Yes.
      *   Covers specific topics (ontology, gap, necessity, acts/omissions, cause/blame, data)? Yes.
      *   Fits 3 anchors + 4 test cases? Yes.
      *   Identify single knockout requirement? Yes.
      *   Flag incompatible pair? Yes.
      *   Evaluate 4 theories briefly? Yes.

      *Let's write.*
answer: |-
  ### Desiderata for a Political Attribution Account of Famine

  **1. Ontological Definition (Event vs. Process)**
  *   **Desideratum:** The account must define famine as a *process of entitlement collapse* rather than a discrete *event of food shortage* or a mere *outcome of excess mortality*.
  *   **Motivation:** Ireland (blight as event) vs. Great Leap Forward (policy as process). If defined as a shortage, Ireland is a disaster; if defined as a failure of distribution rights, it becomes political.
  *   **Status:** **Non-negotiable.** Without this, the "natural disaster" defense always wins on technicality.

  **2. The Trigger-Vulnerability Gap**
  *   **Desideratum:** The account must quantitatively or qualitatively separate the exogenous shock (drought, blight) from the endogenous vulnerability (lack of insurance, legal exclusion).
  *   **Motivation:** Bengal 1943. The war/shock was real, but the mortality distribution was political. The theory must explain why the shock didn't kill everyone, only specific groups.
  *   **Status:** **Non-negotiable.** Essential to distinguish hazard from disaster.

  **3. Causal Necessity vs. Culpability**
  *   **Desideratum:** The account must distinguish between conditions that were *necessary* for death to occur and conditions for which the state is *culpable*.
  *   **Motivation:** Test Case 3 (Siege). The blockade was necessary for starvation, but is the defender culpable for feeding fighters first? Culpability requires a duty of care, not just causal leverage.
  *   **Status:** **Non-negotiable.** Legal survival depends on proving duty, not just causality.

  **4. Acts vs. Omissions (Commission vs. Negligence)**
  *   **Desideratum:** The account must treat destructive policy (seizure) and protective policy failure (refusal to relieve) as equivalent categories of political attribution, provided capacity existed.
  *   **Motivation:** Test Case 1 (Land Title Rule). No one stole food; the rule simply excluded the hungry. A theory requiring active malice exonerates bureaucratic indifference.
  *   **Status:** **Preference of Human Rights Camp.** Legalists often require *actus reus* (guilty act); humanitarians argue *omission* with capacity is sufficient for indictment.

  **5. Separation of Cause and Blame**
  *   **Desideratum:** The account must allow for a finding of "Natural Disaster" where political capacity was genuinely overwhelmed, and "Political Crime" where capacity existed but was misallocated.
  *   **Motivation:** To survive being read to the indicted government. If every famine is a crime, the label loses meaning. The account must admit the possibility of innocence.
  *   **Status:** **Non-negotiable.** Credibility requires the possibility of acquittal.

  **6. Data Robustness under Opacity**
  *   **Desideratum:** The account must provide a verdict mechanism when excess mortality is contested by a factor of three, relying on proxy indicators (market prices, migration, ration records) rather than body counts.
  *   **Motivation:** Great Leap Forward. Waiting for accurate death tolls allows perpetrators to bury evidence. The theory must work with fragmented data.
  *   **Status:** **Non-negotiable.** Practical utility depends on functioning in information-denial environments.

  **7. Counterfactual Capacity (The "Case 2" Requirement)**
  *   **Desideratum:** The account must explain why a similar shock *did not* lead to famine in a comparable jurisdiction (Test Case 2).
  *   **Motivation:** Prospective utility. If the theory cannot explain survival, it cannot reliably predict or prevent future mortality.
  *   **Status:** **Preference of Academic/Prevention Camp.** Legal tribunals focus on what happened, not what didn't; prevention agencies need the negative case.

  ***

  ### Analysis of Test Cases

  *   **Case 1 (Bureaucratic Exclusion):** A standard test of *Omission*. It is not badly posed. It forces the account to decide if administrative rigidity equals violence.
  *   **Case 2 (Successful Mitigation):** Not badly posed, but demanding. It tests the *mechanism* of the theory. If your theory says "Drought = Famine," Case 2 breaks it. If your theory says "Entitlement Failure = Famine," Case 2 validates it. It is a hard test of explanatory power, not logic.
  *   **Case 3 (Siege):** A test of *Joint Causality*. It is well-posed but requires the account to handle multi-agent responsibility without diluting the primary duty-holder (usually the state governing the civilians).
  *   **Case 4 (Internal Colony):** A test of *Structural Violence*. It is well-posed. It challenges the definition of "Democracy." If the account relies on national voting data, it fails here. It must look at local enfranchisement.

  ***

  ### The Knockout and The Tension

  **The Single Knockout Requirement:**
  **Data Robustness under Opacity (Desideratum 6).**
  Most theoretical accounts collapse when the state lies. Intentionalist accounts require proof of orders (which are hidden). FAD accounts require production data (which is inflated). An account that demands verified mortality figures before assigning blame will never indict a regime skilled in censorship. This requirement eliminates any framework reliant on retrospective, verified body counts.

  **The Incompatible Pair:**
  **Timeliness vs. Evidentiary Standard.**
  There is a fundamental tension between *Classifiability in Real Time* (needed to move emergency money and stop the killing) and *Evidentiary Rigor* (needed to survive legal challenge by the indicted government).
  *   If you prioritize **Timeliness**, you rely on proxies and early warnings, which the government can dismiss as speculative.
  *   If you prioritize **Rigor**, you wait for data, by which time concealment has succeeded and the famine is over.
  *   *The Trap:* Concealment exploits this gap. By the time the evidence is "court-ready," the political utility of the verdict has expired. You cannot fully satisfy both; you must choose a threshold of "probable cause" over "beyond reasonable doubt" for the initial classification.

  ***

  ### Theoretical Evaluation

  **Food Availability Decline (FAD)**
  Fails the Vulnerability Gap (Desideratum 2) and Case 2. It equates food supply with food access. It classifies Bengal and Ireland correctly as disasters but fails to identify the political crime in the GLF if grain exports continued. It is useless for attribution, only describing agricultural shocks.

  **Sen's Entitlement Approach**
  Strong on Vulnerability Gap (Desideratum 2) and Case 2. It explains why people starve amidst plenty. However, it is often descriptive rather than accusatory. It identifies the *mechanism* of starvation (loss of exchange rights) but is agnostic on *intent* or *negligence*, making it weak on Culpability (Desideratum 3) for legal indictment.

  **Intentionalist Atrocity Account**
  Strong on Culpability (Desideratum 3) for cases like the Holodomor. However, it fails Acts vs. Omissions (Desideratum 4). It cannot easily classify Case 1 (bureaucratic negligence) as a crime without proof of malicious intent. It also collapses under Data Robustness (Desideratum 6) because intent is the hardest thing to prove in opaque regimes.

  **Accountability Hybrid (Political Crime Framework)**
  Best fit. It treats capacity + omission as culpable (covering Case 1) and uses proxy data for verdicts (covering Desideratum 6). It handles the Democracy/Colony split (Case 4) by focusing on local rights rather than national status. The weakness is the Tension: it risks false positives in real-time classification to avoid letting concealment win.
