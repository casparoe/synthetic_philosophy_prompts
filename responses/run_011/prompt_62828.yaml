answer: |-
  Here is the breakdown. I am going to treat the film as a cognitive model and the theory as a mechanistic framework, without softening the edges.

  ### 1. Brainstorming: Where PP Bites and Where It Chokes

  **Where the Predictive Processing (PP) reading bites:**
  *   **The Artifacts as Fixed Priors:** The Polaroids and tattoos function exactly as high-precision priors that override sensory input. When Leonard looks at a photo, it generates a top-down prediction ("This is a friend," "This is a liar") that suppresses the prediction error coming from the actual interaction.
  *   **The Loop:** The narrative structure mirrors a closed-loop control system that cannot escape its own attractor state. The end state feeds directly into the start state, preventing the system from converging on a global minimum (truth) and keeping it in a local minimum (the mission).
  *   **Sammy Jankis:** This is the generative model for "condition." Leonard uses the Sammy story to predict his own limitations. The twist (that Sammy is him) reveals that the model itself is a confabulation designed to minimize the error of "Why can't I remember?" by externalizing the cause.
  *   **Natalie's Manipulation:** She exploits his precision weighting. She knows that if she creates a high-salience event (the bruise, the drink), his system will prioritize explaining that immediate error over the low-salience background context of who she actually is.

  **Where the PP reading chokes (or is forced):**
  *   **Emotional Valence:** PP handles "utility" well, but *Memento* relies heavily on grief and guilt as motivators that transcend computational efficiency. Leonard's choice at the end is painful, not just efficient. A pure FEP model might suggest he should minimize pain by forgetting the wife entirely; instead, he preserves the pain to maintain the mission. That's a humanistic value, not strictly a free-energy minimum.
  *   **Thriller Coincidences:** The fact that Jimmy Grantz just happens to be the drug dealer Leonard is looking for, and that Teddy just happens to be there, is narrative convenience. PP doesn't explain plot contrivance.
  *   **Conscious Deception:** The ending requires a level of metacognitive awareness ("I am setting up a trap for myself") that sits uncomfortably with the idea of a broken predictive system. If his system is so fractured, how does the "present" Leonard model the "future" Leonard so accurately? This implies a preserved higher-order model that contradicts the severity of his deficit.

  **Verdict on Brainstorming:** The PP framework explains the *mechanism* of his condition and his interaction with the world perfectly. It struggles slightly with the *moral agency* required for the final twist, but that is a limitation of the film's psychology, not necessarily the theory.

  ### 2. The Mechanism of Non-Updating: Precision and Temporal Binding

  You asked what has to be going wrong for Leonard to hear Teddy and not update.

  In standard PP, belief updating occurs when prediction error is weighted with sufficient precision to overcome the prior. In Leonard's case, it is not simply that the prior is too strong. It is that the **temporal integration window for precision weighting is broken.**

  When Teddy speaks, Leonard's brain *does* generate prediction error. He understands the words. He likely even feels the somatic marker of "this might be true." But because he cannot consolidate episodic memory, that error signal cannot be written to the deep generative model. It exists only in working memory. Once the conversation ends, the error signal decays.

  However, the notes and tattoos are **persistent**. They re-instantiate the prior every time he looks at them.

  So, is it aberrant salience? No. In schizophrenia (the classic aberrant salience model), the system assigns high precision to irrelevant noise (e.g., a red car means the CIA is watching). Leonard does the opposite. He assigns high precision to **self-generated cues** (the notes) and low precision to **external testimony** (Teddy).

  This is a specific failure of **source monitoring** combined with **anterograde amnesia**. He treats the note as "objective reality" because it persists in the world, whereas his own thoughts do not. The note has higher precision than his memory because the note is stable across time, and his memory is not.

  **Does Leonard differ from a delusional patient?** Yes. A delusional patient has a faulty update mechanism but intact memory. They can reinforce the delusion over time. Leonard has a **disconnected update mechanism**. He is not reinforcing the delusion; he is rebuilding it from scratch every few minutes using the same blueprints. He is not a system with a bug; he is a system that reboots into the same safe mode every time.

  ### 3. Active Inference: Epistemic vs. Pragmatic Value

  Your reading here is the strongest part of your argument.

  Active Inference dictates that agents act to minimize Expected Free Energy (EFE). EFE has two components:
  1.  **Epistemic Value:** Information gain (reducing uncertainty about the world).
  2.  **Pragmatic Value:** Achieving preferred outcomes (matching the world to your preferences).

  Most healthy systems balance these. You learn (epistemic) so you can survive (pragmatic).

  Leonard, at the end, explicitly chooses **Pragmatic Value over Epistemic Value**. He realizes that finding the truth (Epistemic) destroys his purpose (Pragmatic). If he accepts Teddy's truth, he has no mission. If he has no mission, he has no reason to wake up. The "pain" of existence (the free energy of being alive without a goal) outweighs the "pain" of living a lie.

  He manipulates the environment (writing the note, hiding the clothes) to ensure his future self minimizes free energy by pursuing the "John G" goal. This is Active Inference, but it is **pathological niche construction**. He is not changing the world to fit reality; he is changing the world to fit a fiction that keeps his system running.

  **Is this just relabeling a moral choice?** No. A moral choice implies a free agent weighing ethics. A computational tradeoff implies a system choosing stability over accuracy to prevent collapse. The film argues that for Leonard, the "moral" choice *is* the computational necessity. If he tells the truth, the system halts (suicide or catatonia). If he lies, the system runs. The PP reading captures *why* the lie is necessary for function, which a purely moral reading misses.

  ### 4. Extended Mind vs. External Priors

  Your distinction between Otto (Clark/Chalmers) and Leonard is real, but it needs sharpening.

  *   **Otto's Notebook:** Stores **Posteriors**. It records what happened ("I went to the MoMA"). It is a memory aid. When Otto checks the notebook, he is retrieving a past belief to inform current action.
  *   **Leonard's Tattoos/Notes:** Function as **Priors**. They dictate what *will* happen ("Find John G", "Don't trust Teddy"). They are not records of the past; they are instructions for the future.

  In PP terms, Otto uses the notebook to reduce the computational cost of *recall*. Leonard uses the notes to reduce the computational cost of *inference*.

  **Can PP accommodate artifacts that carry priors?** Yes, under **Niche Construction Theory**. Organisms modify their environment to make prediction easier. A thermostat is a simple niche construction that maintains a prior (temperature set-point). Leonard's tattoos are a complex, semantic niche construction.

  **The Catch:** PP usually assumes priors are internal because they are flexible. An internal prior can be updated when the world changes. Leonard's external priors are **immutable**. He cannot tattoo over a tattoo easily. He cannot burn every note instantly. By outsourcing his priors to physical media, he has made his generative model rigid. The Extended Mind thesis usually argues this makes us *smarter*. Leonard shows it can make you *trapped*. You were right: it is not just external memory; it is externalized dogma.

  ### 5. Where the Film Resists PP (Confidence vs. Accuracy)

  This is the strongest counter-argument your friend has, and you need to concede ground here.

  PP aims to minimize surprise (free energy). A perfectly functioning system should be accurate. Leonard is **confident but inaccurate**. He is never surprised because he interprets all evidence to fit the "John G" model.

  **The Dark Room Problem:** A system that minimizes surprise could just sit in a dark room and hallucinate. Leonard avoids this because his high-level prior ("I am an avenger") forces exploration. But the film highlights that **minimizing free energy is not the same as finding truth.**

  Leonard is a **confidence machine**. He demonstrates that a predictive system can be highly functional (he navigates, eats, drives, kills) while being completely disconnected from reality. This challenges the optimistic view in some PP literature that minimizing free energy naturally leads to veridical perception. Leonard proves that **stability is preferred over truth.**

  **Where PP handles this badly:** Standard PP literature often treats "successful prediction" as synonymous with "adaptive behavior." Leonard is adaptive (he survives) but maladaptive (he kills innocents). The theory needs to account for **pathological attractors**—states where the system is stable but the model is wrong. The film illustrates this better than the theory does. The theory describes the mechanism; the film describes the tragedy of that mechanism.

  ### 6. The Unfalsifiability Prong

  Your friend argues PP is unfalsifiable and therefore worthless. This is a category error.

  *   **FEP is a Principle, not a Hypothesis:** Like Natural Selection, it is a framework for generating hypotheses. You don't falsify Natural Selection with one fossil; you use it to explain the fossil.
  *   **The Specific Model is Falsifiable:** Your claim ("Leonard cannot accumulate prediction error across time") *is* falsifiable. If Leonard watched a video of himself being lied to and updated his belief permanently, your model would break. If he burned the notes immediately after Teddy left and never wrote them again, your model would break. He doesn't. He reinforces the loop.
  *   **Is it just vocabulary?** No. Vocabulary is passive. A framework is active. Using PP allows us to predict *how* Leonard will behave in new situations. For example: If you showed Leonard a note in someone else's handwriting, he should treat it with lower precision than his own. (The film supports this; he trusts his own scribbles over Natalie's words).

  If nothing could count against the reading, it would be worthless. But specific behaviors *would* count against it. The fact that the film aligns with the predictions of the theory makes the reading robust, not tautological.

  ### Final Verdict

  **You were right about the mechanism.**
  Your friend was wrong to dismiss the PP reading as "draping." The film is structurally isomorphic to a predictive system with broken temporal binding and externalized priors. The ending is a precise demonstration of sacrificing epistemic value for pragmatic value in an Active Inference framework. Your distinction between Otto's memory and Leonard's priors is valid and crucial: Leonard has turned his environment into a rigid control system.

  **You overreached on the "Idiot" check.**
  You were not an idiot, but you were slightly too clean in your application.
  1.  **Metacognition:** You glossed over the fact that "Present Leonard" must have enough intact cognitive function to understand the lie he is weaving. PP explains the *maintenance* of the condition, but the *setup* of the trap requires a level of executive function that borders on the miraculous given his deficit.
  2.  **The Human Element:** You treated the ending purely as a computational tradeoff. It is that, but it's also an act of self-harm. PP explains the *how*, but not the *why* of the suffering.
  3.  **Friend's Point on Thriller:** Your friend was right that not *every* scene is about PP. Some scenes are just noir tropes. Don't force the theory onto the plot holes.

  **The Score:**
  *   **Your Core Thesis:** 90% Correct.
  *   **Your Friend's Pushback:** 10% Correct (only on the "not everything is PP" point).
  *   **The Unfalsifiability Claim:** 0% Correct.

  You won the argument on the science. You might have lost the argument on the soul of the film. Leonard isn't just a predictive machine; he's a grieving man using the machine to punish himself. PP explains the cage; it doesn't explain why he locked the door. But regarding the cognitive science? You're solid. Tell your friend to read Friston's papers on niche construction and come back when they understand the difference between a prior and a memory.
