answer: |-
  # The Hole Argument: A Decision Tree for the Perplexed

  **Context:** You have two mathematical models of a spacetime, $\mathcal{M}$ and $\mathcal{M}'$. They are related by a diffeomorphism that is the identity outside a bounded region (the "hole") but shuffles points inside it. They agree on all observations outside the hole but assign different metric properties to points inside it.

  **Instructions:** Start at Node 1. Answer the question on the merits of the physics and metaphysics as you see them. Follow the branch until you reach a leaf. Do not look at the position names until you have landed; they are for classification only.

  ---

  ### The Tree

  **Node 1:** Do the two mathematical models describe two genuinely different physical possibilities, or merely one physical situation written down twice?
  *   **Two different possibilities:** Go to Node 2.
  *   **One situation written twice:** Go to Node 3.

  **Node 2:** Is the resulting lack of predictability within the hole a fatal flaw for the theory?
  *   **No, indeterminism is acceptable:** **Leaf A**.
  *   **Yes, physics must be deterministic:** **Leaf B**.

  **Node 3:** Is this equivalence between models a discovery about the nature of the world, or a decision about how to read the mathematics?
  *   **A decision/convention:** **Leaf C**.
  *   **A discovery/fact:** Go to Node 4.

  **Node 4:** Do the points of the spacetime manifold exist as entities independently of the matter and fields distributed upon them?
  *   **Yes, points exist independently:** Go to Node 5.
  *   **No, points are abstractions:** Go to Node 6.

  **Node 5:** Do these points possess their identity independently of the metric field (i.e., can you track a point before the metric is applied)?
  *   **Yes, identity is prior:** **Leaf D**.
  *   **No, identity depends on the metric:** **Leaf E**.

  **Node 6:** Is the metric field structure itself substantial enough to count as spacetime?
  *   **Yes, the structure is the substance:** **Leaf F**.
  *   **No, structure is not a substance:** Go to Node 7.

  **Node 7:** Are relations between material events sufficient to ground physical reality without a background spacetime?
  *   **Yes, relations are enough:** **Leaf G**.
  *   **No, we need something more:** **Leaf H**.

  ---

  ### The Leaves

  | Leaf | Position Name | Most Awkward Commitment | Branch Question that Did the Work |
  | :--- | :--- | :--- | :--- |
  | **A** | **Naive Substantivalism** | Accepts that the universe is radically indeterministic despite the field equations being deterministic. | Node 2 (Is indeterminism fatal?) |
  | **B** | **Theory Rejection** *(Nobody defends this)* | Abandons General Relativity entirely to save a preconception about determinism. | Node 2 (Is indeterminism fatal?) |
  | **C** | **Conventionalism** | Makes the ontology of spacetime dependent on human choices of representation rather than mind-independent facts. | Node 3 (Fact or decision?) |
  | **D** | **Manifold Substantivalism** *(Incoherent)* | Commits to points having distinct identities that make no physical difference whatsoever. | Node 5 (Identity independent of metric?) |
  | **E** | **Sophisticated Substantivalism** | Maintains points exist but denies we can ever ask 'which point is which' across different models. | Node 5 (Identity independent of metric?) |
  | **F** | **Ontic Structural Realism** | Posits a physical structure that exists without any underlying objects or relata to hold it up. | Node 6 (Is structure substantial?) |
  | **G** | **Relationism** | Struggles to account for vacuum solutions where spacetime exists without any material events to relate. | Node 7 (Are relations enough?) |
  | **H** | **Eliminativism** *(Nobody defends this)* | Denies spacetime, structure, and relations, leaving physics with no arena in which to occur. | Node 7 (Are relations enough?) |

