          *   **Reasoning:** This is a major technical error. Risk aversion is curvature of the utility function over *outcomes* (concave utility). Ambiguity aversion is curvature over *probabilities* or weights on priors. You can be risk-neutral and ambiguity-averse. They are distinct parameters in modern models (e.g., Klibanoff, Marinacci, Mukerji 2005). Conflating them is a common pop-sci mistake.

      *   *Sentence 13:* "Once economists understood this they largely abandoned expected utility theory, which is why textbooks today explain decisions under uncertainty by reference to how confident or how nervous a person feels rather than by reference to probabilities."
          *   **Verdict:** False.
          *   **Reasoning:** Economists did *not* largely abandon EU/SEU. It remains the workhorse model. Ambiguity models (Maxmin, Smooth, etc.) are specialized tools used when ambiguity is salient (e.g., climate policy, finance crises), but SEU is still the baseline. Textbooks definitely still teach probabilities. This is a gross exaggeration.

  3.  **Address the User's Specific Concerns:**

      *   *Concern 1 (Descriptive vs. Normative):* The passage jumps from "people do this" to "theory is refuted." In economics, a theory can be descriptive (predicting behavior) or normative (prescribing rationality). Ellsberg falsifies SEU as a *descriptive* model. Whether it refutes it as a *normative* model is debated (Savage defenders say the choices are irrational). The author treats it as normative refutation without argument.
