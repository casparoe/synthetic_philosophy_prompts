answer: |-
  Purpose Specification: The account must function as a procedural filter for institutional gatekeeping (platforming, publishing, labeling). It cannot rely on the institution adjudicating primary evidence or declaring substantive truth directly, as the institution lacks specialist capacity and must avoid censorship of legitimate debate. Adequacy is defined by the ability to distinguish bad-faith distortion from good-faith revision without begging the question of the historical consensus.

  1.  **The Fact/Label Distinction**
      *   **Motivating Case:** Scholars who accept the empirical reality of a state-engineered famine or mass deportation but reject the legal-moral classification (e.g., "genocide") or specific intent.
      *   **Requirement:** The account must treat disputes over ontological occurrence (did people die by state action?) as distinct from disputes over categorization (does this fit the legal definition of genocide?). Denialism must be defined as the negation of the empirical baseline, not the rejection of the moral-legal label, provided the empirical baseline is robustly established.
      *   **Negotiability:** Non-negotiable. Collapsing this distinction criminalizes or silences legitimate legal-philosophical debate within history and conflates moral judgment with empirical claim.

  2.  **The Centrality Permissibility**
      *   **Motivating Case:** Legitimate revision that overturns a central interpretive claim, such as reclassifying the Wannsee Conference from the decision point for extermination to the coordination of an ongoing policy.
      *   **Requirement:** The account cannot define denialism by the *centrality* of the claim being challenged. An account must allow that core narratives can be overturned by new evidence or synthesis without the challenger being labeled a denialist.
      *   **Negotiability:** Non-negotiable. Historical knowledge is progressive; if an account protects central claims from revision by definition, it dogmatizes history and fails the institution's epistemic mission.

  3.  **The Scale/Existence Separation**
      *   **Motivating Case:** Disputes over contested quantities within an accepted atrocity, such as the Nanjing death toll, where no serious party denies the massacre occurred.
      *   **Requirement:** The account must permit argument over magnitude without treating minimization as negation. It must specify a threshold where quantitative reduction becomes qualitative denial (e.g., reducing deaths to zero or to accidental levels), distinguishing between revisionist estimation and eliminative negation.
      *   **Negotiability:** Non-negotiable. Quantitative history is inherently uncertain; treating all downward revision as denialism freezes historical demographics and invites charges of bias against the institution.

  4.  **The Asymmetry Diagnostic**
      *   **Motivating Case:** The methodologically fastidious claimant who uses archives and footnotes but demands documentary certainty for the consensus view while accepting circumstantial inference for their own, refusing to accept the established evidentiary baseline.
      *   **Requirement:** The account must identify denialism via structural asymmetries in evidentiary standards (e.g., moving goalposts, demanding impossible proof for one side) without simply ruling by reference to the truth of the conclusion. It must diagnose procedural bad faith independent of the substantive outcome.
      *   **Negotiability:** Non-negotiable for institutional utility. Without this, the institution cannot distinguish the mimic from the scholar; however, this is the most difficult requirement to operationalize without covertly appealing to consensus truth.

  **Analysis of Excluding Work and Collisions**

  The single desideratum that does the most work in excluding candidate accounts is **Desideratum 4 (The Asymmetry Diagnostic)**. Most proposed accounts fail here because they collapse into one of two traps: either they define denialism by contradiction of consensus (begging the question, violating the purpose specification) or they define it by superficial methodological markers (allowing the fastidious denialist through). An account that successfully identifies evidentiary asymmetry without appealing to the truth of the conclusion must possess a robust, independent theory of reasonable historical inference. This filters out simplistic "consensus-based" accounts and purely "proceduralist" accounts alike.

  There is a jointly unsatisfiable subset involving **Desideratum 4 and the Purpose Specification**. The purpose requires the institution *not* to adjudicate specialist historiography itself. However, to identify an evidentiary standard as "asymmetric" or "unreasonable" without appealing to the conclusion (that the consensus is true), one must evaluate the quality of the evidence. This often requires specialist knowledge. If the institution lacks the capacity to judge the evidence (per the purpose), it cannot reliably detect the asymmetry (per Desideratum 4) without deferring to the very consensus it is forbidden to treat as axiomatic. You cannot fully satisfy the constraint "do not assume consensus is true" and "exclude the fastidious claimant" simultaneously without a meta-epistemology that the institution may not possess.

  **Confidence and Demotion**

  This list is most likely wrong in **Desideratum 1 (The Fact/Label Distinction)**. There is a strong camp, particularly in legal and human rights contexts, that argues specific legal labels (like "genocide") carry factual claims about intent that are not separable from the empirical events. If persuaded that intent is an empirical fact indistinguishable from the act in certain historiographies, I would demote Desideratum 1 from "Non-negotiable" to "Camp-specific," acknowledging that some institutions (e.g., legal tribunals) must collapse this distinction while academic bodies should not.

  If the purpose shifts from institutional gatekeeping to the guidance of an individual inquirer, **Desideratum 4** becomes less critical while **Desideratum 2 and 3** gain weight. An individual can evaluate primary evidence directly, reducing the need for a procedural diagnostic of asymmetry; they can simply weigh the evidence themselves. However, the institutional constraints (usability without specialist adjudication) make Desideratum 4 the bottleneck. For an individual, the collision between not begging the question and excluding the mimic dissolves because the individual *can* become the specialist. For the institution, the collision remains fatal unless the account provides a heuristic for asymmetry that is visible to non-specialists (e.g., public refusal to update views in light of new counter-evidence), which is a weaker but necessary surrogate for deep evidentiary analysis.

  Answer: {Diagnosing asymmetric evidentiary standards without begging the question}
