  **The Setup**
  Bernard Williams distinguishes internal reasons from external ones. For Williams, an agent has a reason to act only if that action connects to their existing "subjective motivational set"—what they actually care about. Telling Scrooge he ought to be generous gets no grip unless something in him can reach that conclusion. Externalism claims moral reasons exist independently, like facts, regardless of Scrooge's psychology. The novella tests this distinction perfectly. Does Scrooge change because he discovers an objective duty binding him all along? Or does he change because the spirits reroute his existing desires, fears, and memories toward generosity? If internalism holds, the spirits shouldn't introduce new values, only new paths to old ones. If externalism holds, the spirits reveal truths that bind Scrooge even when he ignores them. We must determine if the conversion is cognitive—learning new moral facts—or conative—changing what he wants. The stakes are whether morality is discovered or constructed within the agent.

  **What the Spirits Do**
  Marley begins not with new morals, but with Scrooge's own logic: chains are forged in life. He uses Scrooge's skepticism to breach his defenses. The Ghost of Christmas Past doesn't teach empathy; it resurrects buried memories. Fezziwig and Belle aren't new data; they are dormant elements of Scrooge's subjective set made vivid. The mechanism here is imagination, not information. Scrooge already valued warmth once; the spirit clears the blockage.

  Present focuses on consequences. The Cratchits' poverty is known to Scrooge, but their joy amidst it is not. The crucial turn is Ignorance and Want. When Scrooge asks if they have no refuge, the Spirit throws Scrooge's "surplus population" line back at him. This isn't new moral information; it's forcing Scrooge to apply his own logic consistently. He is confronted with the human reality of his abstract economic reasons.

  Finally, Future. At the gravestone, Scrooge asks if these shadows are things that will be or may be. This highlights the deliberative route. The spirits show him that his current motivations lead to a future he hates. They manufacture a route from his desire for self-preservation to the act of generosity. They don't give him a new reason; they show him that generosity serves his existing fear of death and isolation. Every stave confirms your hunch: the spirits are therapists, not prophets. They build the bridge from who he is to what he must do. They make the internal reason visible by simulating the outcome of his current trajectory. The Spirit's silence regarding the fixity of the future implies the future is mutable *if* the motivational set changes. This confirms the internalist view: the reason to change isn't that the future is fixed, but that his current path leads to a state his own self-interest rejects. They use imagination to bypass his intellectual defenses. Scrooge knows the facts of Bob's poverty, but he hasn't felt them. The spirits force a simulation of feeling. This is not new information; it is new access to old information via the emotional center.

  **The Price**
  But if this is right, the moral cost is high. If reasons depend on the subjective set, was Pre-Visitation Scrooge blameworthy? If he lacked the motivational link to generosity, Williams suggests he lacked the reason. If he lacked the reason, blame seems misplaced. He wasn't evil; he was psychologically blocked. Moral conversion becomes therapy—fixing a malfunction—rather than repentance for violating a law. This makes morality contingent on psychology. If Scrooge truly had no capacity for empathy, internalism suggests he wasn't obligated to have it. We lose the ability to say he *ought* to have cared, regardless of his capacity. It saves the explanation of how he changed, but it weakens the judgment that he was wrong before. We save the mechanism of conversion but lose the objectivity of the crime. The story wants to condemn the old Scrooge, but internalism risks excusing him as merely irrational relative to a future self he hadn't yet met. It raises a troubling question about moral luck. If Scrooge had died before Marley arrived, was he damned? Internalism suggests that without the deliberative route, he had no reason to be otherwise. This undermines the retributive aspect of the story. We want to say Scrooge was wicked, not just mistaken about his own interests. Internalism reduces wickedness to a calculation error. It makes the moral law dependent on the agent's psychology. If the spirits hadn't come, would Scrooge's neglect of Tiny Tim be less wrong? Externalism says no; Internalism implies the wrongness is tied to his capacity to see it. This threatens the universal scope of Dickens' moral message.

  **Where It Breaks**
  Yet some scenes resist this therapeutic reading. Consider Bob Cratchit toasting "the Founder of the Feast." Bob's kindness exists independently of Scrooge's motivations. It suggests a moral order where reasons exist even if unacknowledged by the agent. More starkly, the charwoman, laundress, and undertaker's man selling Scrooge's stolen bedding to Old Joe. They act on their own internal reasons (greed), but the scene judges them—and Scrooge—by an external standard. The indignity of Scrooge's death isn't just about his fear; it's an objective moral fact that he deserved better. Similarly, the debtor couple relieved by his death. Their relief is a reason for Scrooge to change that exists outside his head. Their suffering constituted a demand on him regardless of his subjective set. Even the charwoman's casual theft suggests a world where moral reasons persist even when agents ignore them. The text treats their actions as shameful regardless of their motivation. This points to an external standard of human dignity. When Bob toasts Scrooge, he acknowledges a bond that Scrooge denies. Bob acts on reasons Scrooge rejects. If Internalism were strictly true, Bob's toast would be irrational unless Bob gained something. But Dickens presents it as morally superior. These characters inhabit a moral universe that demands recognition from Scrooge independent of his desires. The story seems to insist that Scrooge was violating real obligations, not just failing to optimize his own psychology. The horror of the thieves implies a violation of dignity that internalism cannot fully capture.

  **What Dickens Adds**
  Dickens adds what philosophy abstracts away: the temporal texture of reasons. Williams talks about deliberative routes; Dickens shows them as living memories and feared futures. Philosophy misses the role of fear and love as catalysts. Dickens shows that reasons aren't just logical links; they are emotional resonances. Finally, the story emphasizes interconnectedness. Reasons aren't isolated within an agent's skull; they live in the space between people. The spirits show Scrooge that his reasons are entangled with others' lives. Dickens catches the social ontology of morality that Williams' individualistic framework might miss. Williams focuses on the individual agent's motivational set. Dickens shows that the set itself is socially constructed. Scrooge's motivations change because his relationships change. Philosophy often treats reasons as static propositions. Dickens treats them as dynamic relationships. The story also captures the role of narrative in reasoning. Scrooge changes because he sees his life as a story with an ending, not just a series of moments. This narrative identity is crucial for deliberation but often absent in analytic philosophy. Dickens reminds us that reasons are lived, not just thought.
