      *   *SIA vs. Comparative Judgments:* The student uses SIA to prove Trichotomy fails (Para 2). Then in Para 3, they say this means "no comparative judgment about A and B can be true at all." But in Para 4, they introduce Parity as a "fourth relation." A relation *is* a basis for a comparative judgment. Para 3 contradicts Para 4. If Parity holds, a comparative judgment *is* true (that they are on a par).
