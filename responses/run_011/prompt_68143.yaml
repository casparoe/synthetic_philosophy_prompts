answer: |-
  This is an exceptionally sharp observation, and you have put your finger on a genuine tension in the history of scholarship. Your intuition is correct: formally and functionally, Plutarch's *Lives* and late-antique hagiography (like the *Life of Antony*) belong to the same broad genre of *bios* (life-writing). Both prioritize moral truth over chronological precision, and both use the past to shape the present.

  However, the divergence in scholarly treatment you have noticed is not merely a lingering bias against Christian texts (though that plays a role), nor is it solely due to the *synkrisis* (comparison). It stems from three deeper issues: the epistemological status of the "miraculous," the intended stance of the reader, and the history of source criticism itself.

  Here is a breakdown of how you might think through this for your paper.

  ### 1. The False Dichotomy of "History vs. Ethics"
  First, you should gently complicate the premise of your seminar. The claim that Plutarch is writing "ethics rather than history" relies on a modern, Rankean definition of history (objective, archival, "what actually happened"). For Plutarch, and for ancient historiography generally, ethics *was* history. To write about the past without moral judgment was considered pointless.

  Classicists do use Plutarch as historical evidence, but they do so with a specific methodology: **triangulation.** When Plutarch describes a battle, we check it against Arrian, against numismatic evidence, against inscriptions. When Plutarch conflicts with harder evidence, he is discarded as a witness to the *event*, but retained as a witness to the *tradition*.

  Medievalists do the same with hagiography. If a saint's life says a bishop founded a monastery in 450 CE, and archaeology says 550 CE, the historian discards the date but keeps the text as evidence of *why* the later community wanted to claim that foundation. The difference is not in the *method* of the modern scholar, but in the *default probability* assigned to the text's claims.

  ### 2. The Epistemological Break: Character vs. Cosmology
  The most significant difference lies in the nature of the "truth" being conveyed.

  *   **Plutarch:** When Plutarch selects an anecdote about Alexander, he is making a claim about human psychology. Even if the anecdote is invented, it operates within the bounds of natural human behavior. It is a claim about how a great man *would* act.
  *   **Hagiography:** When the *Life of Antony* describes Antony fighting demons in the desert, it is making a claim about the structure of the cosmos. It posits a supernatural reality that intervenes in the natural order.

  For a secular historian, Plutarch's moralizing is a bias to be filtered out to find the political reality underneath. For a historian reading hagiography, the "miraculous" is not a bias; it is the *point*. You cannot filter out the demons to find the "real" Antony, because for the author and audience, the demons were as real as the Roman army. Therefore, the text cannot be a witness to the *biographical* reality of the subject in the same way Plutarch can be a witness to the *political* reality of Alexander. It becomes, by necessity, a witness to the *belief system* of the community.

  ### 3. The Stance of the Reader: Judgment vs. Veneration
  You asked if the *synkrisis* (the appended comparison) is what earns Plutarch his status. It is a major factor.

  *   **Plutarch's Reader:** The *synkrisis* invites the reader to act as a judge. Plutarch explicitly weighs faults against virtues. He admits that Alexander had a temper, that Caesar was ambitious to a fault. The reader is meant to engage in critical moral reasoning. This critical distance allows modern historians to treat Plutarch as a participant in a debate.
  *   **Hagiography's Reader:** The reader of the *Life of Antony* is invited to venerate, not judge. While saints may have a "pre-conversion" sinful past, the *vita* itself is a record of triumph. To critique the saint is to miss the point of the text. The genre demands assent.

  Because Plutarch invites critique, modern scholars feel licensed to critique him. Because hagiography demands veneration, modern scholars often feel they must step outside the text's own logic to analyze it, focusing on the audience's reception rather than the subject's actions.

  ### 4. The History of Scholarship (The "Bias" Question)
  You are right to suspect a lingering preference for pagan texts. This goes back to the 19th-century German school of *Quellenforschung* (source criticism). Scholars like Mommsen viewed Classical antiquity as the peak of human achievement and Late Antiquity as a "decline." Christian texts were often viewed as superstitious corruptions of the clean, rational Classical tradition.

  However, this has changed significantly in the last 50 years. Thanks to scholars like Peter Brown (*The Body and Society*), medievalists now treat hagiography as rigorous historical evidence—just for *different questions*. They use it to reconstruct social networks, gender roles, economic patronage, and local power dynamics. They treat the *Life of Antony* as evidence for the social reality of the Egyptian desert, even if they remain agnostic about the demons.

  So, the disparity you see is partly a lag in undergraduate curricula (which often present "Classical = Rational/History" and "Medieval = Faith/Myth") and partly a difference in what questions are being asked.

  ### Suggestions for Your Paper
  This tension is an excellent topic for a seminar paper. You could argue that the distinction between "biography" and "hagiography" is less about genre and more about **epistemological framing.**

  1.  **Challenge the Seminar Premise:** Argue that Plutarch *is* writing history, but history understood as a branch of moral philosophy. This aligns him *closer* to hagiography, not further away.
  2.  **Focus on the *Synkrisis*:** Investigate whether the *synkrisis* actually changes the historical utility of the text. Does the act of comparing two men force Plutarch to be more "honest" about their flaws than a hagiographer is? Or is the *synkrisis* just another rhetorical device to enforce a specific moral worldview?
  3.  **Reframe the "Evidence" Question:** Conclude that the difference in scholarly treatment is not about the *texts* themselves, but about the *secular assumptions of modern historians.* We feel comfortable judging Plutarch's moral claims because we share his secular framework (politics, war, virtue). We feel less comfortable adjudicating hagiographical claims because they rest on a theological framework we do not share.

  **Key Scholars to Look Up:**
  *   **Richard Burridge:** *What Are the Gospels?* (He argues convincingly that the Gospels and Imperial *bioi* are the same genre).
  *   **Christopher Pelling:** Writes extensively on Plutarch and historical truth.
  *   **Peter Brown:** Specifically his work on the "cult of the saints" and how hagiography functioned socially.
  *   **David Konstan:** On the differences between ancient and modern concepts of biography.

  You have identified a real historiographical problem. If you can articulate that the difference lies not in the *texts* but in the *modern secular lens* through which we view them, you will have a very strong paper.
