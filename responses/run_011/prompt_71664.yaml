      *   *Problem:* Modern obits try to avoid eulogy (hagiography) by including flaws, but they treat flaws as "balance" rather than as structural elements of character revelation. They also treat lives as isolated incidents, not comparative studies.
      *   *Plutarch's Method:* Small details reveal character. Pairing reveals universal themes (e.g., Ambition vs. Caution).
      *   *Hagiography's Method:* Flawlessness is functional. It's not lying; it's typology.
