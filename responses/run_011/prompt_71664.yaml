answer: |-
  ### The Dependency Structure

  Your instinct is correct: beginning with the anecdote (the Preface) hands them a tool without a blueprint. If you start with "a remark discloses character better than a battle," they will categorize this as a stylistic tip for ledes—"how to make it pop." They will treat the detail as garnish because you have not yet defined the meal.

  **The Required Sequence:**
  1.  **The End (Moral Work):** Define what a life story is *for*. It is not record-keeping; it is moral inquiry.
  2.  **The Antithesis (Hagiography):** Establish the "Exemplar" model. Show that suppressing flaw is not dishonesty but a different genre with a different aim (imitation). This clears the misconception that hagiography is just "bad reporting."
  3.  **The Method (The Detail):** Introduce the Preface to *Alexander*. Now that they know the aim is inquiry, not imitation, the "small detail" becomes a diagnostic tool, not color.
  4.  **The Structure (The Pair):** Introduce the pairing. Now that they understand the detail diagnoses character, show how two diagnoses compared create a synthesis, not a ranking.
  5.  **The Application (The Obituary):** Place the modern obit in the middle. It rejects the Saint (hagiography) but lacks the Synthesis (Plutarch), leaving it with only the "honest flaw" (balance) which is morally inert.

  **What Breaks if Inverted:**
  *   **Pair before Purpose:** They treat the pairing as a "Compare/Contrast" school exercise or a ranking of virtue.
  *   **Detail before Genre:** They treat the anecdote as "human interest" coloring rather than structural evidence.
  *   **Obit before Plutarch:** They defend their current house style ("we already include flaws") and stop listening. You must destabilize their confidence in "including flaws" before offering the Plutarchan alternative.

  ### The Carrier

  **Nicias and Crassus** is the risky horse. While they are a valid Plutarchan pair, their stories are dominated by military catastrophe (Syracuse, Parthia). For an audience of prose professionals, military strategy is a high-cognitive-load distraction. It invites them to focus on the "battles" Plutarch explicitly tells them to look past.

  **Recommendation: Switch to Demosthenes and Cicero.**
  *   **Why:** They are men of words, like your audience. Their "battles" were forensic and political, fought with speeches and laws, which obit writers understand intuitively. Their ends (suicide/flight in the face of tyranny) mirror the stakes of writing about public life.
  *   **What the Case Must Have:** A shared moral axis that is not about "success." For Demosthenes/Cicero, the axis is *the vulnerability of liberty when defended by flawed men*. Both were saviors of their state who were also vain, litigious, and ultimately failed.
  *   **What the Case Must Lack:** A clear victor. If one man clearly "won" or was clearly "better," the audience will revert to ranking. The tragedy must be symmetrical.
  *   **The Risk:** If you stay with Nicias/Crassus, you must spend the first five minutes of that section explicitly stripping away the military context to focus on the *temperament* (Hesitation/Superstition vs. Greed/Rashness). If you cannot guarantee that discipline, Demosthenes/Cicero is the safer vehicle for writers.

  ### The Misconceptions

  You must head off four specific errors. Here is the sequence in which they must be met:

  1.  **"Hagiography is Bad Reporting."**
      *   *When:* Early, during the Genre definition.
      *   *Correction:* Hagiography is not a failed biography; it is a successful icon. The suppression of flaw is a feature, not a bug. If they think it's just "lying," they will feel superior to it rather than understanding its function as *exemplification*.
  2.  **"Admitting the Flaw is the Moral Work."**
      *   *When:* During the transition from Hagiography to Plutarch.
      *   *Correction:* Their house rule ("not a eulogy") leads to "balance" (He was a genius, but he beat his wife). This is accounting, not moral inquiry. Plutarch includes the flaw not to balance the ledger, but to explain the *mechanism* of the life.
  3.  **"The Detail is Color."**
      *   *When:* During the Preface to *Alexander*.
      *   *Correction:* A joke is not there to make the dead man likable. It is there because it reveals a causal link between character and fate that a battle summary cannot.
  4.  **"Comparison is Ranking."**
      *   *When:* During the Pair analysis.
      *   *Correction:* The point of the pair is not to see who was better, but to see how the *same vice* or *same virtue* plays out in different contexts. The moral work is in the *tension*, not the verdict.

  **The Likelier Misconception You Haven't Thought Of:**
  *   **"Plutarch is Neutral."** They will assume that because Plutarch compares, he is being "objective." He is not. He is deeply judgmental, but his judgment is synthetic (about the human condition) rather than forensic (about the individual). If they think Plutarch is "balanced," they will try to emulate his tone rather than his architecture.

  ### The Check

  **The Exercise: "The Synthesis Sentence"**
  *   **Time:** 10 Minutes.
  *   **Materials:** A handout with two short, fictionalized obit paragraphs.
      *   *Subject A:* A visionary architect who designed beautiful public housing but treated his junior staff with cruel disdain.
      *   *Subject B:* A benevolent housing administrator who was beloved by staff but whose risk-aversion led to the decay of the buildings.
  *   **Task:** Do not ask them to write an obit. Ask them to write **one sentence** that places these two lives side-by-side to reveal a single truth about *public service and private character*.
  *   **Constraint:** They are forbidden from using comparative adjectives (better, worse, more, less) or contrastive conjunctions (however, but, although).
  *   **Success Metric:** If they write "A was talented but cruel, while B was kind but incompetent," they have failed (Ranking/Balance). If they write "Together, they reveal how the drive to build often consumes the capacity to care," they have succeeded (Comparison/Moral Work).
  *   **Why:** This forces them to move from adjudicating the individual to synthesizing the moral theme, which is the core Plutarchan shift.

  ### The Omissions

  **Do Not Touch:**
  1.  **History vs. Literature:** Whether Plutarch got his facts right is irrelevant to how the narrative functions morally.
  2.  **The *Moralia*:** His philosophical essays complicate the *Lives*. Keep the focus on the craft of life-writing.
  3.  **North's Translation/Reception:** The English tradition is a rabbit hole. You are teaching them to use the instrument, not trace its provenance.

  **What to Say About Why:**
  Tell them explicitly: *"We are ignoring the historical accuracy and the philosophical lineage because we are not classicists. We are mechanics. We are here to understand how the engine of a life-story drives a moral response in a reader, not to polish the chassis or trace the manufacturing history. If we discuss accuracy, you will retreat to the safety of fact-checking. If we discuss philosophy, you will retreat to abstraction. Stay with the narrative architecture."*

  This protects the session from drifting into academic pedantry or journalistic defensiveness.
