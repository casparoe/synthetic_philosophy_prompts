  ### Consistency Audit of Electoral Reform Platform

  This audit distinguishes between **apparent tensions** (which your text already anticipates or resolves internally) and **genuine tensions** (which threaten the logical coherence or normative force of the package). It then ranks the genuine tensions, proposes minimal revisions, and identifies empirical claims masking normative choices.

  #### I. Apparent Tensions
  These points appear contradictory but are logically consistent within your framework. No revision is required.

  *   **Commitments (2) and (3):** You explicitly distinguish the age threshold from competence. By grounding the age limit in the "bundle of legal and economic relations" (tax, trial, work) rather than cognitive capacity, you remain consistent with the anti-epistocratic stance in (2). This is a definition of *subjection*, not *capability*.
  *   **Commitments (6) and (7):** A procedural justification for democracy is compatible with compulsory voting. If legitimacy comes from the fairness of the process, ensuring full participation (compulsion) enhances procedural fairness, even if it restricts the liberty to abstain. The "None of the Above" option preserves the procedural expression of dissent without allowing exit from the process.
  *   **Commitments (5) and (7):** Denying a right not to vote while enforcing compulsion is not a contradiction; it is a definition of the obligation. The tension here is political, not logical.

  #### II. Genuine Tensions
  These commitments pull against one another in ways that undermine the "stand or fall together" narrative or the internal logic of the argument. They are ranked by severity.

  **1. The Success Paradox (Severity: High)**
  *   **Commitments Involved:** (5), (6), and (8).
  *   **The Tension:** Commitment (5) argues that compulsion is necessary because voluntary turnout skews by income/education, preventing equal treatment. Commitment (8) defines "success" as a scenario where the new groups (16–17s, non-citizens) vote at much lower rates (34% and 29%) than the obliged citizens (91%), yet the legislature remains unchanged.
  *   **Why it matters:** If the goal of compulsion is equality of the electorate (5), then accepting a 60-point turnout gap in the "success" scenario (8) admits the reform failed to achieve equality. Furthermore, if legitimacy is procedural (6), the *composition of the legislature* should be irrelevant to the judgment of success. Judging success by the *lack of change* in the legislature implies an instrumental hope for stability that contradicts the procedural claim that the new voters *must* be included as equals. If they are equals, their inclusion might change the outcome; if the outcome doesn't change because they didn't vote, they weren't treated as equals.
  *   **Smallest Revision:** Revise **(8)** to define success as "an electorate whose composition mirrors the subject population," regardless of whether the legislature's composition changes.
  *   **Cost:** You lose the reassurance to moderate stakeholders that the reform will not disrupt the political status quo. You must admit the legislature *might* change significantly.

  **2. The Two-Tier Demos (Severity: High)**
  *   **Commitments Involved:** (1) and (5).
  *   **The Tension:** Commitment (1) states that a *single principle* (subjection) fixes the demos. Commitment (5) creates a two-tier demos: Citizen-Adults (Right + Duty) vs. Youth/Non-Citizens (Right only).
  *   **Why it matters:** If subjection is the *only* principle fixing the demos, it should uniformly determine the status of members within it. By exempting the newly enfranchised from the duty, you create a class of "partial members." This undermines the claim that the three reforms stand on the *same* ground. It suggests enfranchisement is based on subjection, but compulsion is based on a different principle (e.g., civic membership or independence), which fractures the unified theoretical foundation.
  *   **Smallest Revision:** Revise **(5)** to attach the *obligation* to vote to all enfranchised groups, while differentiating the *penalty* (e.g., community service for minors, no deportation risk for non-citizens).
  *   **Cost:** You lose the practical safeguards against punishing households (for minors) or threatening residency (for non-citizens). It requires complex administrative safeguards to maintain the moral point without the practical harm.

  **3. The Skew Preservation (Severity: Moderate)**
  *   **Commitments Involved:** (5) Rationale and (5) Exemptions.
  *   **The Tension:** The stated reason for compulsion in (5) is to correct skew caused by income and education. However, the exemptions in (5) apply precisely to the groups most likely to exhibit low turnout due to dependency (minors) and vulnerability (non-citizens).
  *   **Why it matters:** You are compelling the group that already votes at high rates (adult citizens) while exempting the groups that vote at low rates. This ensures the skew persists, even if reduced. This weakens the egalitarian argument for compulsion, making it look more like a mechanism for stabilizing the existing electorate than equalizing the new one.
  *   **Smallest Revision:** Add a clause to **(5)** acknowledging that the skew will persist but arguing that universal *enfranchisement* is the primary equalizer, with compulsion as a secondary stabilizer.
  *   **Cost:** You weaken the moral urgency of the compulsion argument. It becomes a "best effort" measure rather than a strict requirement for equality.

  #### III. Empirical Claims Masking Normative Choices
  Your position relies on specific empirical claims that, if false, expose normative weaknesses.

  1.  **The "Bundle of Relations" Threshold (Commitment 3):** You claim sixteen is "roughly when" a person enters the bundle of legal subjection (tax, trial, work).
      *   *The Claim:* This is an empirical boundary.
      *   *The Risk:* If data shows significant numbers of 14- or 15-year-olds work, pay taxes, or are tried as adults, your principled line becomes arbitrary.
      *   *Entitlement:* Your position entitles you to a bright line for administrative feasibility, but you are not entitled to claim the line is *natural*. You must admit it is a pragmatic cutoff for the principle of subjection.
  2.  **The "Tolerable Cost" of Exit (Commitment 4):** You claim exit is not available to long-term residents at "tolerable cost."
      *   *The Claim:* This defines the boundary of "subjected" vs. "visitor."
      *   *The Risk:* "Tolerable" is normative, not empirical.
      *   *Entitlement:* You are entitled to define this, but be aware this is where the "single principle" of (1) is most vulnerable to challenge (e.g., why is economic cost the metric?).
  3.  **The Stability of Low Turnout (Commitment 8):** You assume a 34% turnout among 16-year-olds is a stable, acceptable equilibrium.
      *   *The Claim:* That low participation by new voters does not delegitimize the process.
      *   *The Risk:* If low turnout is interpreted as rejection of the polity rather than apathy, the reform fails its own procedural test.

  #### IV. Single Revision Analysis
  **Does one revision repair more than one problem?**

  **Yes.** Revising **Commitment (5)** to **universalize the duty to vote** (applying it to 16–17-year-olds and long-term non-citizens) while **differentiating the penalties** resolves multiple tensions simultaneously.

  *   **Repairs Tension 2 (Two-Tier Demos):** It aligns the duty with the right, ensuring all "subjected" persons share the same civic status, preserving the "single principle" claim of (1).
  *   **Repairs Tension 3 (Skew Preservation):** It applies the anti-skew mechanism to the groups most likely to skew the electorate, making the compulsion argument coherent.
  *   **Mitigates Tension 1 (Success Paradox):** If compulsion is universal, the scenario in (8) where turnout is 91% vs 34% becomes impossible. If turnout is high across the board and the legislature remains unchanged, that indicates genuine consensus rather than exclusion, making it a clearer procedural success under (6).

  **What would be lost by making this revision?**
  *   **Practical Safety:** You lose the immediate protection against fining parents for their children's behavior and the protection against using voting laws as a pretext for deportation.
  *   **Political Palatability:** Compelling non-citizens and minors to vote is significantly more controversial than granting them the right. It may make the package harder to pass, even if it is more consistent.
  *   **Administrative Complexity:** You would need to design non-monetary penalties for minors (e.g., civic education) and ironclad legal guarantees for non-citizens (e.g., voting records cannot be shared with immigration enforcement).

  **Recommendation:**
  If theoretical consistency is your priority, universalize the duty in (5). If political feasibility is the constraint, you must revise (1) to admit that *enfranchisement* rests on subjection, but *compulsion* rests on a separate principle of civic membership, thereby abandoning the claim that they "stand or fall together" on a single ground.
