answer: |-
  You have spotted the symmetry problem, and your instinct is correct: if the argument destroys adaptationism, it destroys historical science entirely, including the anti-adaptationist's own structuralist explanations. The argument as stated is a *reductio ad absurdum* of itself.

  To save the piece without sacrificing the integrity of historical inference, you need to cut **Step 3**.

  Here is the diagnosis of why Step 3 is the leak, what it costs to patch it, and how the two sides actually stand once the logic is tightened.

  ### The Cut: Step 3 (The Flexibility Claim)

  **The Step:** *"So for any trait and any F you like, somebody can produce a selection story that lands on it... Nothing in the story is pinned down by the trait."*

  **The Diagnosis:** This step conflates *possibility* with *plausibility*. It assumes the only data point available is the current trait itself. If the current trait were the *only* evidence, Step 3 would be true, and Step 6 would follow. But in practice, no competent evolutionary biologist (adaptationist or otherwise) works with only one data point.

  We have phylogenies (which constrain ancestral forms), comparative anatomy (which shows what sister taxa have), developmental genetics (which constrains what mutations are possible), and the fossil record (which sometimes shows the intermediate steps).

  **The Fix:** Step 3 should read: *"For any trait, somebody can produce a selection story **if they ignore independent constraints.**"*

  **The Cost:** Cutting Step 3 destroys the anti-adaptationist's claim that adaptationism is *inherently* unscientific or tautological. It reduces the critique from "Adaptationism is logically empty" to "Adaptationism is methodologically risky if practiced lazily." You lose the dramatic flourish that the entire enterprise is a mirage. You gain a piece about scientific rigor.

  ### Keeping Step 2 (The Epistemic Barrier)

  You want to keep Step 2 (*"populations nobody observed... environments nobody can visit"*). You should. It is factually true, but it is not fatal.

  Step 2 describes the *condition* of historical science, not its *failure*. Geologists cannot visit the Cretaceous, but they can read isotopes. Climatologists cannot visit the pre-industrial atmosphere, but they can read ice cores. Evolutionary biologists cannot visit the Pleistocene, but they can read genomes and fossils.

  Step 2 is only a problem if you combine it with the modified Step 3 (that we have *no* other data). If you keep Step 2 but fix Step 3, the argument becomes: "The past is unobservable, so we must triangulate it with multiple independent lines of evidence, or we are just storytelling." That is a robust, defensible position.

  ### The Concessions

  If you make this cut, here is what you can honestly report that each side must concede.

  **1. The Adaptationist Concession (The "Lazy Optimizer")**
  A working adaptationist must admit that Step 3 accurately describes a specific, common sin in the literature: the "Optimality Model" divorced from empirical check.
  *   **The Admission:** There are papers that posit a function *F*, assume the organism is optimized for *F*, and treat the existence of the trait as proof of the optimization. This is circular.
  *   **The Scope:** This applies mostly to behavioral ecology or morphological papers that skip the comparative method. If you don't check if the trait exists in related species in different environments, or if the trait is genetically correlated with something else, you are vulnerable to the retrofit problem.
  *   **The Price:** They must agree that "adaptive hypothesis" is a starting point for testing, not a conclusion drawn from the trait's existence.

  **2. The Anti-Adaptationist Concession (The "Constraint Storyteller")**
  Your source must admit that his preferred explanation (the chin is a structural byproduct of jaw resorption) is *also* a historical hypothesis subject to the retrofit problem.
  *   **The Admission:** Saying "it's a spandrel" is not a null hypothesis that requires no proof. It is a positive claim about developmental history and ancestral selection pressures (i.e., selection acted on the jaw, not the chin).
  *   **The Vulnerability:** He can retune the developmental story just as easily as an adaptationist can retune a selection story. He needs to show the developmental constraint exists, is heritable, and was present in the ancestor. If he just points to the chin and says "physics did it," he is guilty of the same post-hoc labeling he accuses the adaptationists of.
  *   **The Price:** He cannot claim the high ground of "hard science" vs. "just-so stories." Both are historical inferences; both require independent constraint.

  ### The Blast Radius: Local, Not Universal

  The honest answer is that the retrofit problem is **real but local**. It is a methodological vice, not a logical impossibility.

  **Where it applies:**
  *   Single-trait analyses without phylogenetic control.
  *   Claims of "perfect optimization" without measuring variance or cost.
  *   Explanations that rely solely on current utility to infer past selection (the "current utility fallacy").

  **Where it does not apply:**
  *   Cases where the function is mechanistic and immediate (e.g., hemoglobin binds oxygen; we can test this now, and we know the history of the gene).
  *   Cases where the selection pressure is observable (e.g., antibiotic resistance, industrial melanism).
  *   Cases where the phylogenetic distribution contradicts the adaptationist story (e.g., if a trait appears in a lineage where function *F* was never required, the adaptationist story dies).

  ### How to Write It

  You can frame the piece around the **Symmetry of Uncertainty**.

  1.  **Open with the Retrofit Problem:** Present your source's argument (Steps 1-6) as he gave it. It's compelling rhetoric.
  2.  **Introduce the Mirror:** Show how the exact same logic dismantles the "structural constraint" argument. If the past is unknowable, it's unknowable for developmental history too.
  3.  **The Pivot (Cutting Step 3):** Explain that historical science survives this only because we don't rely on single-story narratives. We look for *consilience*.
      *   Adaptationists survive by showing the trait varies with the environment across species.
      *   Anti-adaptationists survive by showing the trait is developmentally coupled to something else under selection.
  4.  **The Verdict:** The retrofit problem isn't a reason to stop calling things adaptations. It's a reason to stop calling things adaptations *without doing the homework*.

  **The Headline Truth:** The dispute isn't about whether the past is accessible (it isn't, fully). It's about how many independent keys you need to unlock it. Your source thinks one key (developmental mechanism) is enough to prove a byproduct. Adaptationists think one key (current utility) is enough to prove selection. Both are wrong. You need both, plus phylogeny.

  If you write it this way, you keep the skepticism your source wants (Step 2) without burning down the house of historical science (Step 3/6). You turn a philosophical demolition job into a report on scientific standards. That is a stronger piece.
