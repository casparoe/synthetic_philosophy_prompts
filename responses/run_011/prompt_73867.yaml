      *   *Example:* "The chin is a byproduct of jaw resorption."
          *   Can I tune the parameters? Yes (rate of resorption, timing, genetic correlation).
          *   Is the past unobservable? Yes.
          *   Is it unfalsifiable *in principle*? Only if I refuse to test it.
      *   The argument proves too much. It attacks *historical inference* itself, not just adaptationism. Since historical science works (we know dinosaurs existed, we know CO2 causes warming), the argument must be flawed or overextended.

  4.  **Identify the Weak Link (Which step to cut?):**
      *   *Step 2?* (The past is unavailable). User wants to keep this. It's factually true we can't time travel. But it's not a *fatal* barrier, just a hurdle.
