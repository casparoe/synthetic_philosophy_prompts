      *   *Diagnosis:* Step 3 is the leak. It assumes the trait is the *only* data point. But we have comparative data, genetic data, developmental data, and fossil data.
      *   *Decision:* Cut/Modify Step 3. The problem isn't that stories *can* be produced; it's that *bad* stories are produced without constraint. Good stories are constrained by independent evidence.

  5.  **Analyze the "Cost" of Cutting Step 3:**
