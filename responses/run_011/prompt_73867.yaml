  2.  **Deconstruct the "Retrofit Problem" Argument:**
      *   1. Definition: Adaptation = shaped by selection for function F.
      *   2. Epistemic Barrier: Past populations/environments/ancestors are unobservable.
      *   3. Flexibility: You can tune parameters (environment, ancestor, etc.) to make *any* story fit *any* trait.
      *   4. Unfalsifiability: An account you can always produce is one nothing contradicts.
      *   5. Vacuity: A claim nothing contradicts explains nothing (post-hoc labeling).
      *   6. Conclusion: Stop calling traits adaptations.

  3.  **Evaluate the User's Critique (The "Symmetry Problem"):**
