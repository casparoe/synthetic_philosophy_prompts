      *   *Check:* Is the chin example addressed? Yes, use it to show how the anti-adaptationist must prove the developmental constraint, not just assert it.
      *   *Check:* Is the "historical science" point addressed? Yes, emphasize that geology/climate science works because of independent lines of evidence (ice cores, isotopes), same as evo.

  10. **Final Polish:** Ensure the voice matches a colleague-to-colleague discussion (ideas desk editor to analyst). Keep it punchy but dense. (Proceed to generate output based on this thought process).

