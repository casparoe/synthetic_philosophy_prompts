  **MEMORANDUM**

  **TO:** Programme Integrity Committee
  **FROM:** Chair, Programme Integrity Committee
  **DATE:** 14 October 2023
  **SUBJECT:** Draft Decision Memo: Referral Regarding Country Office Director (West Africa)

  **1. Purpose**
  This memo circulates the draft findings regarding the referral against the Country Office Director (COD). It addresses the three specific matters referred, the relevance of Head Office conduct, the status of Section 6.2 of the Code of Conduct, and the overall disposition.

  **2. Findings on Referred Matters**

  **Matter One: Hiring of Relative (Upheld in Part)**
  The COD failed to declare a familial relationship on the annual conflict-of-interest form. While the COD interpreted "family" narrowly, the Code's purpose is transparency regarding potential loyalty conflicts, not merely legal degrees of kinship. In this context, a wife's cousin constitutes a close social obligation. However, the recruitment process was competitive, advertised, and the selected candidate was uniquely qualified among applicants. There is no evidence of substantive nepotism or financial loss to the project.
  *Finding:* Procedural breach upheld; substantive misconduct not upheld.

  **Matter Two: Facilitation Payments (Not Upheld)**
  The payments (€40–€110) secured the release of maternal-health equipment. Under the literal reading of Section 6.2, these were customary, proportionate to local income, and disclosed in the quarterly narrative. The COD's interpretation of the payments register (excluding public officials) was erroneous but not deceptive. The alternative—a six-week delay—posed a tangible risk to beneficiary health.
  *Finding:* Not upheld. The actions complied with the current Code's exceptions for customary payments, though the ethical risk remains high.

  **Matter Three: Wedding Attendance (Upheld)**
  The COD attended a counterpart's family event, seated at the head table, without disclosure. Land-use permits followed eleven days later. Regardless of local custom, the proximity of the benefit (permits) to the hospitality creates an appearance of dependency. Crucially, this was not disclosed within the fourteen-day window required by Section 6.2. The circulation of photographs among staff increases the reputational risk and fails the "embarrassment" test if scrutinized externally.
  *Finding:* Upheld. Failure to disclose and the timing constitute a violation of integrity standards.

  **3. The Head Office Courtesy Gift**
  The €2,000 gift provided by Head Office to a visiting parliamentary delegation is relevant as an objection to consistency, not as a direct comparison of value. Camp A argues standards must travel with money; Camp B argues context dictates value. The Head Office gift demonstrates that "courtesy" is not unique to the field. However, the asymmetry is critical: Head Office operates in a low-corruption risk environment with high transparency, whereas the Country Office operates in a high-risk environment with lower transparency.
  *Relevance:* This fact undermines the Universalist claim that our standards are purely portable without adaptation. It validates the Contextualist view that value is relational. However, it cannot excuse the COD's non-disclosure in Matter Three. It serves as an objection to the moral authority of Head Office to sanction field staff for "hospitality" while engaging in higher-value gifting at home without equivalent scrutiny.

  **4. Status of Section 6.2**
  Section 6.2 must be **replaced**. While it attempts to balance local custom with integrity, it functions as a laundering device. The requirement for disclosure *within fourteen days* allows retroactive justification of improper acts. The "embarrassment" test is too subjective for enforcement.
  *Replacement Test:* The Committee should adopt the **"Publicity and Independence Test."**
  1.  **Publicity:** Could the payment or gift withstand public scrutiny in both the donor and recipient country without reputational damage?
  2.  **Independence:** Does the gift or payment create a reasonable expectation of reciprocal obligation that compromises professional independence?
  If either condition is failed, the act is impermissible, regardless of disclosure.

  **5. Committee Split and Reasoning**
  The Committee is divided between Universalists (Camp A), who view the clause as enabling bribery through disclosure, and Contextualists (Camp B), who view it as recognizing necessary local obligations.

  *Strongest Consideration for the Losing Side (Camp B):*
  Camp B argues that integrity policy imposed without local moral realism becomes a form of ethical imperialism. They contend that a €65 port fee to save lives is morally distinct from private enrichment, and that demanding absolute prohibition forces local staff to choose between project success and job security. They argue that Head Office hypocrisy on the €2,000 gift invalidates the Universalist stance. This is a robust argument regarding the legitimacy of our operations and the safety of national staff.

  *Reason for Decision:*
  Despite the strength of Camp B's moral realism, the Committee must prioritize institutional viability and legal risk. Section 6.2, as written, exposes the organisation to liability under international anti-bribery statutes which do not recognise "disclosure" as a defence for facilitation payments. While the COD's intent in Matter Two was humanitarian, the policy cannot sustain a precedent where disclosure cures bribery. Therefore, the policy must be tightened ( siding with Camp A on structure), even if the COD is not sanctioned for past acts done in good faith under the old rules (siding with Camp B on mitigation).

  **6. Overall Disposition**
  1.  **Disciplinary:** The COD receives a formal written warning regarding Matter One (non-declaration) and Matter Three (non-disclosure of hospitality). No financial penalty is imposed.
  2.  **Corrective:** The Country Office must implement a pre-approval process for any hospitality involving counterparts.
  3.  **Policy:** Section 6.2 is suspended pending redrafting based on the "Publicity and Independence Test."
  4.  **Head Office:** The Secretariat is instructed to review the approval process for the €2,000 parliamentary gift to ensure it meets the proposed new test, ensuring consistency across the organisation.
  5.  **Complainants:** The secondees are thanked for their vigilance. Their referral is deemed substantiated in part.

  **7. Conclusion**
  This decision acknowledges the COD's contribution and the complexity of the operating environment while affirming that transparency must be prospective, not retroactive. We cannot allow disclosure to sanitize conflicts of interest, nor can we ignore the hypocrisy of differing standards between Head Office and the field. The policy will be strengthened to protect both the organisation and its staff from ambiguous ethical traps.

  **End of Memo**
