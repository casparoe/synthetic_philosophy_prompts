  She consistently privileges political agency and ideological coherence over structural or sociological determinism. She rejects explanations reducing the Terror to economic necessity (Report 1), class interest (Report 2), or local sociology (Report 4). In Report 1, she demanded "operators," not just a machine. In Report 4, she insisted someone authorize the "shambles." Conversely, she accepts narratives highlighting political contingency (Report 3) and the causal power of revolutionary language within central institutions (Report 5). Her core requirement is that the Terror be explained by deliberate political choices made by actors taking their own ideology seriously, authorized by a coherent central authority. She tolerates contingency only when it resides within a logical political framework, not when it dissolves into randomness. She wants the Revolution explained from the inside out. The through-line is a refusal to let the political sphere collapse into either structural inevitability or meaningless noise. She views the Revolution as a political event first, not a social symptom.

  Candidate rules

  Politics as its own causal register: This rule holds that political dynamics cannot be reduced to economics or local sociology. It predicts **Reject**. While the manuscript avoids economic reductionism, it reduces political outcomes to individual whim and random variance, failing to establish politics as a coherent, autonomous logic rather than mere noise. It treats the political sphere as chaotic rather than structurally distinct. She wants politics to have its own grammar.

  Flat anti-necessitarianism: This rule rejects any narrative making the Terror look automatic or structurally inevitable. It predicts **Accept**. The manuscript's finding that decisions were erratic and reversible directly supports the view that the Terror was not a mechanical necessity but a series of open choices. It aligns with her praise for the 1791 contingency argument, suggesting things could have gone differently.

  Demand that the actors' own reasons stay load-bearing: This rule requires that ideological categories explain actions, not just mask interests. It predicts **Reject**. The author explicitly concludes that ideological categories did "no explanatory work," violating the principle established in Reports 2 and 5 that revolutionary language must be treated as causal. It repeats Report 2's error of dismissing sincerity. For her, ideas drive events.

  Insistence that the national political center be doing explanatory work: This rule demands Paris authorize the Terror's logic. It predicts **Reject**. The manuscript's headline finding—that there was "no coherent center"—directly contradicts Report 4's requirement that someone must decide about the Terror "as such." It fragments the narrative she requires, leaving the Terror without a political head.

  My call

  She will reject the manuscript. My primary rule is the demand that actors' reasons stay load-bearing. Report 2 rejected a book with excellent archives because it treated language as an alibi; Report 5 accepted a book where vocabulary constrained choices. This manuscript argues ideology did *no* work, which is the exact inverse of her accepted model. The runner-up is the insistence on the national center (Report 4), which also predicts rejection. I prefer the "actors' reasons" rule because Report 2 shows she will reject even well-researched work that dismisses ideological sincerity, whereas Report 4's focus on authorization is secondary to the motivation behind the authorization. The manuscript fails the sincerity test fundamentally. It makes the Terror accidental, not political.

  The discriminating manuscript

  Send a study of representatives-on-mission who acted *coherently* based on ideological commitment *without* central instruction. If she accepts, the "actors' reasons" rule dominates (ideology matters more than the Center). If she rejects, the "national center" rule dominates (local action doesn't count without Paris). This separates whether she prioritizes the *source* of the decision (Paris) or the *nature* of the decision (ideologically driven). A book showing local radicals enforcing Terror purely out of belief, contradicting Paris, would test if she values ideological coherence over central authorization. It isolates the variable of central control versus ideological sincerity.

  Where this is a guess

  Historiographically, I assume she aligns with the "political culture" turn against social interpretation. This is contested; some historians argue structural pressures mattered. I also guess she dislikes quantitative methods, though Report 5 suggests she accepts systematic analysis if it yields political meaning. Report 3 is the outlier; it suggests she might accept revisionism without Terror-focused ideology. I am filling gaps regarding her tolerance for methodological innovation versus her commitment to traditional political narrative. Her specific lineage remains unverified.
