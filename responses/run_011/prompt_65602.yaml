      *   **Tension 6: P4 (Desire settles "Is it good?") + P2 (BPA).**
          *   *Re-evaluating:* P2: Good = Reasons to respond favorably. P4: Desire asks "Is it good?"
          *   If I desire X, I take X to be Good. If X is Good, there are Reasons to desire X.
          *   So Desire takes its object to be such that there are Reasons to desire it.
