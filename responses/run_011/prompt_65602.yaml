          *   Tone: Direct, critical, philosophical, helpful for defense.

  2.  **Deconstruct the 6-Point Package:**
      *   **P1 (Attitude-Specific Reasons):** Distinguishes object-given reasons (RKR - Right Kind) from state-given reasons (WKR - Wrong Kind). Only object-given are reasons *for* the attitude. State-given are reasons to *want* the attitude.
      *   **P2 (Buck-Passing Account - BPA):** Value = Reasons to respond favorably. No extra property.
