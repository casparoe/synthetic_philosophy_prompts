          *   *Wait, look at P6:* P6 says reasons must be capable of showing up in deliberation. If I can't believe on practical grounds (P5), then practical grounds can't show up in belief-deliberation. So per P6, they aren't reasons for belief. This aligns P5 and P6.
          *   *But Objection B:* "Practical reasons to avoid inquiry." If I avoid inquiry for practical reasons, am I regulating belief? Yes. Does that make them WKRs for belief? If P5 says "No WKRs for belief," but I *am* regulating belief via practical means (avoiding evidence), P5 looks empirically false or definitionally narrow.

      *   **Tension 5: P6 (Deliberative Constraint) + P3 (Demon/State-Given).**
          *   *Analysis:* P3 says the demon threat is a reason to *get myself to desire* the mud. P6 says reasons must be capable of showing up in deliberation.
