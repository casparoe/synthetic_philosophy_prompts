          *   *Wait, P3 saves it:* P3 says "buck-passing account doesn't end up saying the mud is good." Why? Because the threat isn't a reason to *desire*, only to *get to desire*. So there are no reasons to respond favourably (strictly speaking).
          *   *So:* P2 + P1 + P3 works *if* P1's distinction is robust.
