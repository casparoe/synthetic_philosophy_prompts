          *   *Conflict:* If practical considerations *can't* move belief (P5), then per P6, they aren't reasons *for belief*. This seems consistent.
          *   *However:* P6 says reasons must be capable of being what an agent is *moved by*. If I can be moved by practical considerations to *avoid inquiry* (Objection B), does that imply I can be moved by them regarding belief?
          *   *Severity:* Low/Medium. P5 is a psychological claim (doxastic involuntarism). P6 is a normative constraint on what counts as a reason. They fit together well: Practical considerations aren't reasons for belief because they can't move belief directly.

      *   **Tension 3: P4 (Attitudes Settle Questions) + P2 (BPA).**
