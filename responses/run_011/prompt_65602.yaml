      *   **P4 (Teleological/Functional Explanation):** Attitudes settle questions. RKR bear on that question. (Belief -> Truth, Desire -> Good, Admiration -> Admirable).
      *   **P5 (Belief Exception):** No WKRs for belief. Can't believe on practical grounds (psychological impossibility).
      *   **P6 (Deliberative Constraint):** Reasons must be capable of moving the agent/showing up in deliberation.

  3.  **Analyze the Objections Already Raised:**
