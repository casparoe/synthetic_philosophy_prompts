          *   No bibliography/reading list.
          *   Tone: Intellectual, direct, engaging, suitable for a high school philosophy talk (smart but accessible).
          *   Core Question: What dimension of freedom is the wasp missing? Is it degree or kind? Does randomness help?

  2.  **Deconstruct the Philosophical Issues:**
      *   **The *Sphex* Example:** It illustrates rigid stimulus-response programming. The wasp follows a script. If the script is interrupted, it restarts from the beginning of the sub-routine, not from where it left off.
      *   **Compatibilist "Could Have Done Otherwise" (CHDO):** Usually defined as "If I had wanted X, I would have done X." The wasp *does* satisfy a basic version of this: If the cricket were elsewhere, it would drag it elsewhere. So why isn't it free?
      *   **The User's Insight:** "Flexibility about flexibility." This is actually very close to Dennett's own view (evitability, representation of alternatives).
      *   **The Randomness Question:** Adding randomness (quantum noise/coin flip) doesn't add *control*. It adds unpredictability, not agency.
