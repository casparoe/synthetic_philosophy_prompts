  3.  **Formulate the Position (Commitment):**
      *   *Thesis:* The wasp lacks *representational control* over its own routines. It's not about physical flexibility (it has that); it's about *informational access* to the reasons for its actions.
      *   *On User's Guess:* "Flexibility about flexibility" is good, but needs sharpening. It's not just auditing; it's about *reasons-responsiveness*. The wasp responds to *stimuli*, not *reasons*.
      *   *On Randomness:* Randomness makes it *less* free in a meaningful sense because it severs the link between input/state and action. It's not "freedom," it's "noise."
      *   *On Degree vs. Kind:* It is a difference of degree (complexity of control systems) that creates a functional difference in kind (moral agency). Don't fall into dualism.

  4.  **Drafting the Content - Section by Section:**

