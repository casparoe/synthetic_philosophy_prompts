  2.  **Deconstruct the Piccione-Rubinstein Problem:**
      *   **Ex-ante (Planning):** You want to maximize expected payoff. Since you can't distinguish junctions, you must choose a probability $p$ of exiting at any junction you see.
          *   Exit 1 payoff: 0 (Ruin).
          *   Exit 2 payoff: 4 (Goal).
          *   Pass both payoff: 1 (Survivable).
          *   Optimal plan involves mixing or committing to pass the first. If you commit to pass the first, you must also commit to exit the second. But if you exit the second, you must survive the first.
          *   The paradox: When you arrive at a junction, you update your belief about *which* junction it is based on your strategy. If your strategy is "always pass," you know you're likely at the first one. If your strategy is "always exit," you know you're likely at the first one (because you'd have exited already if it were the first and you were following the plan? No, that's the tricky part).
          *   Actually, the core tension is: At the junction, you think "If I exit now, I might get the goal, but I might ruin it. If I pass, I survive for sure but miss the goal." The ex-ante optimal plan often conflicts with the ex-interim optimal action because the arrival itself provides information (selection effect).
      *   **Story Translation:**
          *   The "writing on the arm" is the ex-ante commitment device.
          *   The "reading at the junction" is the ex-interim decision point.
