      *   **Refining the Memory Loss:** It's not medical. It's the "stretch." Once she passes a certain point, the mileage blurs. She knows she passed *a* junction maybe, but not if she exited. Wait, if she exited, she wouldn't be driving. So she knows she hasn't exited yet. The problem is she doesn't know if this is the *first* time she's seeing a junction or the *second*.
