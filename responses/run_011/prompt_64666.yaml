answer: |-
  The marker smells like solvent and alcohol. I cap it and hold my arm out. The ink sits on the skin, black and wet. PASS FIRST. EXIT SECOND. The dispatcher's voice crackles over the dash speaker, flat and tired.

  "You copy that? First one is a dead end. Second one is the depot. You go left at the first, you dump the load in the river. You pass the second, you drive until the tank reads empty and you call me from a diner. You want the shift credit, you hit the second exit. That's the job."

  "I know the job," I say. My voice sounds thin in the cab.

  "Then why are you writing it on yourself?"

  "Because I won't remember."

  "You won't remember the road?"

  "I won't remember the count. Once I pass the toll booth, the stretch wipes me. I'll know I'm driving. I'll know I haven't turned yet. But when I see the lights, I won't know if it's the first set or the second set. They look the same. Blue signs. Gravel shoulder. Same height on the pole."

  "That's a you problem," the dispatcher says. "Just drive. Don't think. Hit the second one."

  "I can't hit the second one if I don't know which one I'm at."

  "Then use the arm. You wrote it down. Follow the ink."

  "I'm trying to make sure the ink makes sense when I see it."

  I put the truck in gear. The engine hums, a low vibration that moves up through the seat and into my spine. I pull out of the depot. The toll booth passes on the right. I feel the shift in the road surface, the slight dip where the concrete meets the asphalt. After this, the memory starts to slip. It isn't darkness. It's just a smoothing over. The minutes stack up but they don't label themselves. I know I am moving forward. I know I have not turned the wheel hard left or right. But the distance behind me becomes a blur of gray guardrail and green scrub.

  The radio stays on. The dispatcher is still there, a voice from the past self I was ten minutes ago.

  "Status," he says.

  "Driving," I say.

  "You sound like you're waiting for something."

  "I'm waiting for the lights."

  "Don't wait. Watch. You see the blue sign, you check the arm. You do what the arm says."

  "The arm says exit second. It doesn't say what to do if I don't know which one it is."

  "You're stalling. You're doing the thing where you talk until you don't have to move."

  "I'm thinking."

  "Think less. Drive more."

  The road stretches out. It is straight enough to lull me, curved enough to keep my hands on the wheel. Then I see them. Blue signage. The light fixture hangs overhead, casting a white pool on the gravel shoulder. The turnoff cuts left into the dark. It looks exactly like the diagram in the briefing. It looks exactly like the memory I don't have.

  I slow down. The tires crunch on the loose stone near the edge. I lift my left hand from the wheel and turn my wrist. The ink is smudged slightly from the sleeve of my jacket, but the words hold. PASS FIRST. EXIT SECOND.

  I look at the road. I look at the arm.

  If I exit here, and this is the first one, I dump the load in the river. The shift is over. I go home with nothing. If I exit here, and this is the second one, I drop the load at the depot. I get the credit. I go home.

  If I pass here, and this is the first one, I stay on the road. I get to see the next one. If I pass here, and this is the second one, I blow past the depot. I drive until the tank is empty. I eat at a diner. I survive, but I don't get the credit.

  The dispatcher speaks again. "You're slowing down. I see the telemetry. You're braking."

  "I'm at a junction."

  "Then turn. You want the credit, you turn."

  "I don't know which one this is."

  "You're at a junction. You have to be at one of them. You wrote the plan. Follow the plan."

  "The plan was written when I knew I was at the start. The person who wrote this knew she hadn't seen any lights yet. She knew the next lights would be the first ones. She wrote PASS FIRST because she knew she was about to see the first one."

  "And you? What do you know?"

  "I know I'm seeing lights. That's all I know."

  "So turn."

  "If I turn every time I see lights, I turn at the first one. I ruin the trip. I can't turn every time."

  "Then don't turn."

  "If I don't turn every time, I might not turn at the second one. I miss the depot."

  "You're arguing with yourself. I'm listening to it and it sounds like noise. You have a rule. Execute the rule."

  "The rule doesn't fit the spot I'm standing in."

  I look at the arm again. PASS FIRST. EXIT SECOND. The instruction assumes I can tell the difference. It assumes I can count. But I can't. I am stuck in the middle of the count.

  I think about the road behind me. I came from the toll booth. I always come from the toll booth. Every trip starts there. So every time I drive, I encounter the first junction. I see it one hundred times out of one hundred trips. But I only encounter the second junction if I pass the first one. If I turn at the first, the second one never happens. It never exists for me.

  So when I sit here, at a junction, looking at the lights, it fits better that this is the first one. Most times I see lights, it's the first set. The second set is rare. It only shows up if I make it past the first.

  If it fits better that this is the first one, then the sensible thing is to pass. If I pass, I stay safe. I avoid the river. I keep the truck on the road.

  But if I pass because it feels like the first one, I am saying I will pass every time I see lights. Because every time I see lights, it will feel like the first one. It always looks the same. So if I listen to this feeling, I will pass the second one too. I will drive past the depot. I will end up at the diner.

  The dispatcher sighs. It sounds like static tearing. "You're overthinking. You're trying to be clever. Just be a driver. See the sign. Turn the wheel."

  "If I turn now, I'm betting this is the second one. But the road says it's probably the first."

  "The road doesn't talk. I talk. I'm telling you to turn."

  "You weren't here when I wrote this. You were in the booth. I was here. I knew I was going to forget. I wrote this to help me. But now I'm here, and the help doesn't work. The person who wrote this knew something I don't know. She knew she was at the beginning. I don't know where I am. She could plan for the second one because she knew she hadn't seen the first one yet. I see lights. I don't know if I've seen them before."

  "You're making it hard. Don't make it hard."

  "It is hard. The plan makes sense back there. It doesn't make sense here. Back there, passing the first one was easy because I knew it was the first one. Here, passing feels like giving up the goal. But turning feels like walking into the river."

  I put my hand on the wheel. The plastic is warm from my grip. The engine idles. The lights hum. The gravel waits.

  If I turn, I might win. If I pass, I might survive. The arm says exit second. It doesn't say exit now. It says exit second. To follow it, I need to know this is the second. I don't know. So I can't follow it. I have to make a new rule for right now.

  The dispatcher says, "Time is burning. Fuel is burning. Make a move."

  I look at the turn. It goes into the dark. I look at the road ahead. It goes into the dark. They look the same. The ink on my skin looks like a command from a stranger. She knew where she was. I don't. She could afford to wait for the second one because she knew she was at the first. I can't afford to wait because I might already be at the last chance. But I can't afford to take it because I might be at the first.

  I breathe in. The air smells like diesel and old coffee. I tighten my grip on the wheel. The dispatcher stops talking. He knows I'm going to move.

  I turn the wheel.

  ***

  **Author's Note**

  The payoff structure is embedded in the concrete consequences: dumping the load in the river (ruin), hitting the depot (success), or driving to the diner (survival/mediocre). The indistinguishability is handled through the sensory repetition of the lights and signs, forcing the driver to rely on the frequency of arrival (always seeing the first, only sometimes the second) rather than visual cues. I omitted the resolution of the turn to prevent the story from becoming a puzzle with a correct answer, keeping the focus on the structural tension between the ex-ante plan and the ex-interim decision.
