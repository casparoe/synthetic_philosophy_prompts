prompt: |-
  ok so this has been eating at me for like two months and I can't figure out what I'm supposed to think about it.

  I'm a junior. I'm good at chem and bio, like weirdly good, and last year our school's after-school tutoring program got cut when the district lost a chunk of funding, so a bunch of freshmen were just failing. I started staying late on tuesdays to help them. Free. Nobody asked me to, there was no form, no volunteer hours, no award, I just did it because it felt dumb not to.

  Word got around. Now it's like 14 kids every tuesday. Two other juniors show up sometimes but mostly it's me and I'm the one who knows where the practice tests are. In the fall our counselor put it in the school newsletter and called it "our peer tutoring program" and my name is on the spring sign-up sheet, and she told some scholarship committee that I *run* it, which I don't, I just show up.

  Here's the thing. I got a job. Saturday shifts at a garden center, and I actually need the money because my mom's hours got cut in January. Tuesday after school is the only extra shift they'll give me. So I have to stop the tutoring. There's no version where I do both.

  When I told my counselor she went really quiet and then said "well, we'll figure something out," in a voice that meant we won't. The freshmen have their midterm in three weeks. One of the kids texted me "wait are you actually leaving??" like I broke a promise to him. I never promised anything. I never signed up for anything. I did this because it was extra and I wanted to.

  But I feel worse than I would if I had actually made a promise and broken it. My dad says I'm not responsible for a thing I volunteered for, and that the school is using me as an excuse to not pay a real tutor, and honestly he might be right about that part. My best friend says that once people depend on you it doesn't matter what you originally agreed to, and "but it was extra!" isn't a defense.

  So — is it actually wrong for me to quit, or do I just feel bad? And how did doing something that nobody could have demanded of me turn into something I'm now expected to do and get treated like a jerk for not doing? If I'd never started I'd be completely in the clear, which basically means I'm worse off for being the one who helped. Does that mean I shouldn't have started? Do you tell people not to do the good thing because of how it ends?

  Also small thing but I keep thinking about it: do I have to go tell the scholarship people that I don't run the program? I didn't lie. I just didn't correct her.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Situation:**
      *   **Who:** High school junior, academically strong (chem/bio), financially strained (mom's hours cut, needs job).
      *   **What:** Started voluntary, unpaid tutoring for freshmen when school program was cut. Grew from informal help to a recognized "program" (14 kids, newsletter, scholarship mentions).
      *   **Conflict:** Got a paid job (necessary for income) that conflicts with tutoring time. Needs to quit tutoring.
      *   **Reactions:**
          *   Counselor: Passive-aggressive ("we'll figure something out"), implies reliance.
          *   Students: Feel betrayed ("wait are you actually leaving??").
          *   Dad: Says user isn't responsible, school is exploiting them.
          *   Best Friend: Says dependency creates obligation regardless of original agreement.
          *   User: Feels guilty, questions morality of quitting, questions the fairness of the situation ("worse off for being the one who helped"), wonders about the scholarship lie.
      *   **Core Questions:** Is it wrong to quit? How did voluntary become mandatory? Does helping make you worse off? Should you tell people not to do good things? Do I need to correct the scholarship committee about "running" the program?

  2.  **Deconstruct the Ethical Dilemmas:**
      *   **Obligation vs. Voluntarism:** The user never signed a contract. It was altruistic. However, *reliance* has been established. Ethically, sudden abandonment without notice is problematic, but prioritizing essential income (family survival) over extracurricular help is morally sound.
      *   **Institutional Exploitation:** The school formalized an informal act without consent or resources. This is a classic case of "mission creep" or institutional freeloading. They are saving money by using a student.
      *   **The "Sucker's Payoff":** The feeling that doing good punishes you. This is a systemic issue, not a personal moral failing.
      *   **The Scholarship Lie:** The counselor claimed the user *runs* the program. The user didn't correct it. This is a gray area. It's not an active lie, but it is uncorrected misinformation that benefits the user.

  3.  **Address the Specific Questions:**

      *   *Is it wrong to quit?* No. Basic needs (money for family) trump volunteer work.
      *   *How did voluntary become expected?* Path of least resistance for the school. It's easier to rely on a free, capable student than find funding. Social psychology (norm of reciprocity/expectation).
      *   *Does helping make you worse off?* In this specific instance, yes, because the system failed to support the help. But generally, no. The *system* is at fault, not the act of helping.
      *   *Should you tell people not to do good things?* No, but tell them to set boundaries.
      *   *Scholarship correction?* Yes, integrity matters, especially for scholarships.

  4.  **Drafting the Response - Section by Section:**

      *   **Validation:** Acknowledge the weight of this. It's a heavy burden for a junior. Validate the guilt but reframe it.
      *   **The "Right" to Quit:** Be firm here. Financial need > Volunteer work. The school's reaction is unfair. The dad is right about the exploitation.
      *   **The "How did this happen?" (Systemic Analysis):** Explain *why* it feels this way. The institution institutionalized the informal. They created the dependency, not the user. The "Sucker's Payoff" concept is relevant here (doing good gets punished).
      *   **The Scholarship Issue:** This is important. It's a integrity check. Advise honesty but frame it carefully. It shows maturity to correct the record.
      *   **Action Plan/Transition:** How to quit gracefully. Don't just ghost. Give notice, organize materials, try to find a replacement (but don't take responsibility if none is found).
      *   **Future Outlook:** Don't let this kill the desire to help. Just add boundaries.

  5.  **Refining the Tone:**
      *   Needs to be empathetic, adult-to-young-adult (respectful but guiding), and clear.
      *   Avoid platitudes like "just follow your heart."
      *   Acknowledge the financial reality (mom's hours cut is serious).
      *   Address the friend vs. dad conflict. Both have points, but Dad's point on exploitation is more structurally accurate, while Friend's point on dependency is emotionally accurate.

  6.  **Self-Correction/Nuance Check during drafting:**
      *   *Initial thought:* Tell them to quit immediately.
      *   *Correction:* They have midterms in 3 weeks. A sudden quit might be too harsh. Suggest a transition period if possible, but prioritize the job if the shift is non-negotiable. Actually, the prompt says "Tuesday after school is the only extra shift they'll give me." It sounds like a hard conflict. Okay, emphasize the *necessity* of the job.
      *   *Scholarship:* If they correct it, will the scholarship be revoked? Maybe. But keeping a lie is riskier. Advise framing it as "clarifying roles" rather than "confessing a lie."
      *   *Guilt:* The user feels worse than if they broke a promise. Why? Because they feel they created the expectation. Need to dismantle that. The *Counselor* created the expectation by putting it in the newsletter without asking.

  7.  **Final Polish:** Organize with clear headings or bullet points for readability. Ensure the emotional weight is acknowledged before moving to logistics. (The resulting output matches the detailed response provided previously.)
answer: |-
  This is a heavy load to carry, especially when you're dealing with real-world financial pressure on top of schoolwork. You are asking big ethical questions that adults struggle with, so first: take a breath. You are not a jerk. You are a junior whose family needs money.

  Here is the breakdown of what is happening, why it feels this way, and what you should do.

  ### 1. Is it wrong to quit?
  **No.**

  There is a hierarchy of obligations. At the top is the survival and stability of your family. Below that is your own education. Below that is paid work. At the very bottom is voluntary, unpaid extracurricular service.

  You are moving from the bottom tier (unpaid tutoring) to the third tier (paid work necessary for family income). That is not a moral failure; that is a responsible prioritization of needs.

  Your best friend is coming from a place of empathy—they see the freshmen who are scared. Your dad is coming from a place of protection—he sees the school exploiting you. **Your dad is right about the dynamic, but your friend is right about the impact.** The kids *are* dependent. But dependency created by a third party (the school) does not create a lifetime debt for you.

  ### 2. How did "extra" become "expected"?
  You asked: *"How did doing something that nobody could have demanded of me turn into something I'm now expected to do?"*

  This is a classic institutional failure. Here is the mechanics of it:
  *   **The Vacuum:** The district cut funding. A need existed.
  *   **The Stopgap:** You filled the need organically.
  *   **The Institutionalization:** The counselor saw a working solution that cost the school $0. By putting it in the newsletter and telling scholarship committees you "run" it, she formalized an informal arrangement without your consent and without allocating resources to support it.

  The school has effectively outsourced a paid position to an unpaid student. When you try to resign from a job, there is a process. When you try to resign from a "favor" that the organization has started treating like a job, they treat it like a betrayal.

  You feel worse than if you had broken a promise because **you have integrity.** You care about the outcome. But the guilt you are feeling is actually the school's guilt, displaced onto you. They should feel bad for relying on a minor for free labor during a funding crisis. Instead, they made you feel bad for needing to get a paid job.

  ### 3. "I'm worse off for being the one who helped."
  This is the "Sucker's Payoff." It feels like if you had just walked past those failing freshmen, you'd have your job, your free time, and no guilt. By helping, you got trapped.

  Does this mean you shouldn't have started? **No.** It means the system failed to support the good thing you did.

  If you tell people "don't do good things," you become cynical. The lesson here isn't "don't help." The lesson is **"help with boundaries."**
  *   **Boundaries look like:** "I can tutor for one semester."
  *   **Boundaries look like:** "I am not running this, I am just participating."
  *   **Boundaries look like:** Telling the counselor immediately when the newsletter goes out: "Just to clarify, I'm not the administrator of this program."

  You didn't know to set those boundaries because you were just being a decent human being. Don't let this experience harden you so much that you never help anyone again. Just let it teach you that when an institution gets involved, things need to be written down.

  ### 4. The Scholarship Question
  *Do I have to go tell the scholarship people that I don't run the program?*

  **Yes.**

  This is the one place where your dad's advice ("school is using me") and your integrity need to meet. You didn't lie, but you allowed a misconception to stand because it benefited you. That's understandable, but for a scholarship application, accuracy is currency.

  If that scholarship committee finds out later that you misrepresented your role (even passively), it looks worse than clarifying it now.
  *   **How to do it:** Email the counselor or the scholarship contact. "I was reviewing my activities list and wanted to clarify my role in the peer tutoring program. I want to make sure my application is accurate. I facilitate the tutoring sessions, but I don't administrate the program or manage the roster. I just wanted to correct the record so my application reflects exactly what I do."
  *   **Why:** This shows maturity and honesty. It proves you *are* responsible, even while you're quitting the tutoring. It protects you from future accusations of padding your resume.

  ### 5. How to Quit (The Exit Strategy)
  You don't have to ghost them, but you also don't have to save them. You have three weeks until midterms.

  1.  **Tell the Counselor (Again):** Be firm. "I understand the timing is bad, but my family's financial situation has changed and I must take this job. I cannot tutor on Tuesdays anymore. My last day will be [Date 3 weeks away]."
  2.  **Tell the Kids:** Be honest but kind. "I have to take a job to help my family, so I can't do Tuesdays anymore. I'm going to stay for the next three weeks to help you prep for midterms, but after that, I won't be here."
  3.  **The Handoff:** You said you know where the practice tests are. Put them in a folder. Leave them on the counselor's desk. That is you "running" the transition. Once that folder is on the desk, the responsibility is no longer yours.

  ### Summary
  You are not breaking a promise. You are outgrowing a role that was never formally yours to begin with.

  *   **Take the job.** Your family needs the money.
  *   **Clarify the scholarship info.** Honesty is worth more than the slight edge the exaggeration gave you.
  *   **Give three weeks' notice.** That is generous. That is ethical.
  *   **Forgive yourself.** You did a good thing. The school mishandled it. Don't let their mishandling convince you that doing good things is a mistake.

  You're going to be okay. The freshmen will survive. Your family needs you to be employed more than they need you to be a tutor. Prioritize your house, then your school, then the world. In that order.
