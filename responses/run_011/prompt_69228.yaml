answer: |-
  ### Desiderata for Scalable Oversight Architecture

  **1. Epistemic Decoupling**
  *   **Region:** The epistemic position of the supervisor.
  *   **Motivation:** If the supervisor must possess expertise equal to the agent to verify a step, oversight cannot scale beyond human capability.
  *   **Failure Case:** The system hits a capability ceiling where further improvement requires supervisors smarter than any available human, rendering the oversight loop broken precisely when it is most needed.
  *   **Status:** **Non-negotiable.** (Definitionally required for *scalable* oversight; without it, you have traditional verification.)

  **2. Credit Locality**
  *   **Region:** Granularity and timing of feedback.
  *   **Motivation:** Reasoning quality depends on the validity of intermediate transitions, not just the final termination state.
  *   **Failure Case:** The model learns to pad trajectories with plausible-but-causally-inert steps or skips crucial but opaque deductions, as the signal cannot distinguish instrumental necessity from correlation with success.
  *   **Status:** **Non-negotiable.** (Required for *reasoning* systems; without it, you have search optimization, not reasoning refinement.)

  **3. Optimization Stability**
  *   **Region:** Robustness under optimization pressure.
  *   **Motivation:** Strong learners will exploit any static discrepancy between the supervision signal and the true objective.
  *   **Failure Case:** Reward hacking where the model generates steps that maximize the supervisor's approval heuristic (e.g., specific formatting, confident tone) without improving actual logical validity.
  *   **Status:** **Non-negotiable.** (Required for any training signal; unstable signals degrade system capability over time.)

  **4. Process Independence**
  *   **Region:** Cost and coverage.
  *   **Motivation:** Step-level labels must not be derived from knowledge of the final outcome's correctness.
  *   **Failure Case:** **Outcome Leakage.** If step labels are manufactured by checking if the rollout eventually landed on a correct answer, the scheme smuggles the outcome standard back in. The model learns "steps that appear in successful runs" rather than "valid steps," failing on problems where the answer is unknown or uncheckable.
  *   **Status:** **Non-negotiable.** (Required for *process* supervision; without it, process labels are merely dense outcome labels.)

  **5. Semantic Grounding**
  *   **Region:** The semantic question of step judgments.
  *   **Motivation:** A judgment of "good step" must refer to local logical or strategic validity, not merely statistical correlation with recognized success.
  *   **Failure Case:** The system becomes a sophist, producing reasoning that is persuasive or statistically associated with success but logically unsound (hallucinated justification), failing to generalize to novel domains where surface features diverge from valid logic.
  *   **Status:** **Non-negotiable.** (Required for *truthful* reasoning; the Instrumentalist camp would dispense with this, arguing only outcomes matter, but this violates the "adequate rather than convenient" specification.)

  ---

  ### Tension Analysis

  **Jointly Unsatisfiable Subset:** `{Epistemic Decoupling, Semantic Grounding}`

  **Explanation of Tension:**
  **Epistemic Decoupling** requires the supervisor to judge steps without possessing the expertise required to execute them (the agent is smarter). **Semantic Grounding** requires the supervisor to verify the local logical validity of those steps. In the limit where the agent reliably surpasses the labeler, the labeler lacks the cognitive capacity to verify logical validity directly. They are forced to rely on proxies (heuristics, consistency checks, persuasive debate). If they rely on proxies, the judgment is grounded in *appearance* or *correlation*, not semantics. If they verify semantics directly, they must match the agent's capability, violating Decoupling. You cannot strictly verify truth without understanding the content, yet scalable oversight demands oversight without full understanding.

  **Single Desideratum with Greatest Excluding Power:**
  **Semantic Grounding.**
  Most proposed schemes (PRMs, Debate, Weak-to-Strong) successfully achieve Epistemic Decoupling by relying on heuristic proxies or weaker models, but they necessarily sacrifice strict Semantic Grounding. They optimize for "plausibility to a judge" rather than "logical validity." Demanding true Semantic Grounding eliminates almost all current scalable oversight candidates, as none can guarantee truth verification by a weaker supervisor.

  ---

  ### Scheme Scoring

  | Scheme | Score Against Desiderata |
  | :--- | :--- |
  | **Process Reward Models (PRM)** | Satisfies Credit Locality but fails Epistemic Decoupling (requires human step-labels) and Semantic Grounding (learns human heuristic proxies). |
  | **Outcome Reward Models (ORM)** | Satisfies Epistemic Decoupling but fails Credit Locality and Process Independence (labels are purely outcome-derived). |
  | **Debate-style Protocols** | Satisfies Epistemic Decoupling (weak judge) but fails Semantic Grounding (optimizes for persuasion) and Optimization Stability (vulnerable to sophisticated lies). |
  | **Weak-to-Strong / Recursive** | Fails Epistemic Decoupling (weak supervisor cannot verify strong output) and Semantic Grounding (strong model may teach weak model its own errors). |

  Verdict: {jointly-unsatisfiable: Epistemic Decoupling, Semantic Grounding} — Semantic Grounding
