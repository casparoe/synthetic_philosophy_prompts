prompt: |-
  A friend of mine writes policy stuff for a living and he sent over a couple of paragraphs he's drafting about markets people find disgusting — kidneys, votes, surrogacy, price gouging after a hurricane. He's smart and he has actually read in this area, which is why I can't tell which parts of it are him being fair and which parts are him winning an argument. Here's the passage:

  "Pretty much every argument about repugnant markets comes down to a standoff between two intuitions. The economists' intuition is that a voluntary trade makes both sides better off, more or less by definition, so if you ban a broke person from selling a kidney you haven't protected anybody, you've just deleted their best option — and the exploitation worry can't carry the weight people put on it, because it proves too much: on the same logic you'd have to rule out dangerous jobs, night shifts and paid plasma donation. The other intuition is that some goods get corrupted by being priced. What's interesting is that market design has largely dissolved the standoff rather than settled it. Roth's insight about repugnance is that disgust at a transaction is itself a kind of market failure — it blocks trades both parties want — so the right response isn't a moral argument but an engineering one: build an institution that delivers the allocation without triggering the squeamishness. That's precisely what paired kidney exchange did. It took a transaction people found revolting and redesigned it into one they don't, which is why it's up and running while the market in kidneys is not. Seen that way, the corruption objection is a transaction-cost argument wearing a philosophy costume, and the only real question left is whether the redesign is feasible."

  Can you audit this for me? I don't want a general essay on commodification, I want to know how much of his paragraph holds up. Which claims would an actual market designer sign off on, which ones would someone like Anderson, Radin, Satz or Sandel say is a distortion of their view rather than a disagreement with it, and where exactly does he switch from describing a position to knocking it down. Two bits I especially can't work out on my own: the paired exchange story, which strikes me as a strange piece of evidence for the claim that disgust can be engineered around, since as far as I understand it the whole point of an exchange is that nobody pays anybody anything; and the passing memory I have of Roth saying something fairly sympathetic about compensating living donors, which would definately cut against the way my friend is using him here. I might be making that second thing up, so treat it as a question rather than a fact I'm handing you.

  Then tell me whether the last sentence survives the corrections — if you fix everything before it, is the corruption objection really just transaction costs in disguise, or is he changing the subject on purpose? I lean towards thinking he's right about the economists and wrong about the ethicists, so flag it if you think that lean is doing work I'm not aware of.

  Please answer in plain continuous prose, the way you'd write an email — no headings, no bullet points, no bold, no tables. I read this stuff on my phone and anything formatted turns into a mess.
