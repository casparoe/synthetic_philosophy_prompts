answer: |-
  Your instincts are serving you well here, particularly on the paired exchange point and the way the ethicists are being portrayed. Your friend has written a piece that sounds authoritative because it uses the vocabulary of market design correctly, but he is using that vocabulary to smuggle in a normative conclusion that most of the cited experts would reject. To answer your question about where he switches from describing to knocking down, the pivot happens in the middle of the paragraph. The first two sentences are a fair, if stylized, summary of the standard debate. The shift occurs at the sentence beginning What's interesting is that market design has largely dissolved the standoff rather than settled it. Up until that point, he is mapping the terrain. After that point, he is arguing that the terrain itself is obsolete, and by the time he reaches the final sentence, he is dismissing the opposing view as a misunderstanding of engineering rather than a genuine moral claim.

  Regarding your specific question about Al Roth and market designers, your friend is half-right but misses a crucial nuance. A market designer would sign off on the idea that repugnance acts as a constraint on market design. Roth famously treats repugnance as a parameter that can cause a market to fail if ignored. However, your friend distorts Roth's view when he suggests that the goal is to engineer around the squeamishness to enable the trade. Roth generally treats repugnance as a hard constraint to be respected, not merely a friction to be overcome. He does not typically argue that we should trick people into accepting transactions they find morally odious; rather, he looks for allocations that satisfy preferences within the bounds of what is socially acceptable. On your second point about Roth and compensation, you are not making that up, but the reality is more cautious than your friend implies. Roth has expressed openness to exploring non-monetary incentives for living donors, such as tax credits or health insurance, but he distinguishes these sharply from a cash market. He has not argued that we can design away the moral objection to selling organs. He acknowledges that repugnance regarding cash-for-organs is a stable social fact that design must accommodate, not necessarily eliminate. So using Roth to claim that the moral objection is just an engineering problem is a stretch of Roth's actual position.

  This leads directly to your suspicion about the paired kidney exchange story, which is the weakest piece of evidence in the paragraph. You are right to flag this as strange. Paired kidney exchange is not a market mechanism in the sense of buying and selling; it is a barter system of donation designed to solve a medical compatibility problem, not a moral repugnance problem. People do not generally find kidney transplants revolting; they find the commodification of kidneys revolting. By swapping kidneys between incompatible donor-recipient pairs, Roth solved a logistical failure in the donation system, not a moral failure in the market system. Your friend is conflating the disgust some feel toward organ markets with the logistical difficulty of matching donors. Citing paired exchange as proof that disgust can be engineered around is misleading because the solution removed money from the transaction entirely. It did not make a market in kidneys acceptable; it made donation more efficient. If the objection is to pricing, then a non-monetary exchange does not address the objection by redesigning the transaction; it addresses it by avoiding the transaction type altogether.

  When you bring in the ethicists like Anderson, Radin, Satz, or Sandel, your friend's characterization moves from oversimplification to distortion. None of these thinkers argue that markets are bad simply because they trigger a feeling of squeamishness that blocks trade. They argue that markets change the meaning of the goods being traded or degrade the status of the people involved. For example, Satz argues that certain markets are noxious because they arise from extreme vulnerability or lead to extreme harm, not because people feel icky about them. Sandel argues that putting a price on certain goods corrupts their value. When your friend calls this a transaction-cost argument wearing a philosophy costume, he is committing a category error. He is translating a normative claim about what ought to be valued into a positive claim about what prevents efficient allocation. An ethicist would say that the cost they are identifying is not a friction in the system but a signal that the system is violating a moral boundary. To say the only real question left is whether the redesign is feasible is to assume that feasibility is the only metric that matters, which is precisely the point the ethicists are contesting.

  This brings us to the last sentence and your lean that he is right about the economists and wrong about the ethicists. I think you need to be careful there. He is right that standard economic intuition focuses on voluntary trade improving welfare, but he caricatures the exploitation worry even on the economic side. Many development economists and welfare theorists take exploitation seriously without relying on the corruption of goods argument. They worry about coercion disguised as choice, which is not the same as saying dangerous jobs should be banned. So he is simplifying the economists too, but he is fundamentally misrepresenting the ethicists. The final sentence does not survive correction because it rests on the assumption that moral objections are just inefficient preferences. If you fix the earlier claims about Roth and paired exchange, the conclusion still fails because it dismisses the substantive moral argument as a technical glitch. He is changing the subject on purpose by redefining moral corruption as transaction costs. It is a clever rhetorical move that allows him to claim the debate is settled by engineering, but it only works if you accept the premise that efficiency is the sole goal of social organization. Your skepticism is warranted because the paragraph is less an audit of the debate and more an attempt to win it by redefining the terms so that the economic side wins by default.
