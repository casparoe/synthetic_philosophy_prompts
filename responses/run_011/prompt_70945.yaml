      *   (3) All-Subjected/All-Coerced (ASC) > All-Affected (AAI). *Implication: Coercion is the trigger.*
      *   (4) Rejection of AAI due to indeterminacy/unboundedness. *Implication: Need clear cutoff.*
      *   (5) Border regimes are coercion; outsiders coerced by borders have a claim to a say on border decisions (Abizadeh). *Implication: Unbounded demos regarding borders.*
      *   (6) Demos need not be cosmopolitan regarding membership; existing demos has discretion over admission. *Implication: Bounded demos regarding routine membership.*
      *   (7) Long-term resident non-citizens should be enfranchised domestically via ordinary legislation (no circularity). *Implication: Internal expansion is easy.*

