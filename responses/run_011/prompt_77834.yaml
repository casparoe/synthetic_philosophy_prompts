answer: |-
  # Exercise: The Flux Allocation Challenge

  ## 1. Instructor Preparation & Whiteboard Setup
  **Framing:** Do not mention Mises, Lange, or Hayek. Introduce this as a "Supply Chain Optimization Simulation." You are the Chief Auditor; the class is a firm trying to maximize total quarterly points.

  **The Whiteboard Layout:**
  Draw two columns: **Public Ledger** and **Private Logs**.
  Write the following **Public Constants** on the board (visible to all):
  *   **Total Resource:** 100 Units of *Flux* per round.
  *   **Resource Cost:** Flux is free to allocate, but limited to 100.
  *   **Market Prices (Fixed for R1 & R2):**
      *   Product *Alpha* sells for **2 pts** per unit.
      *   Product *Beta* sells for **5 pts** per unit.
  *   **Communication Rules:**
      *   Only Runners may move between zones.
      *   Runners carry **Slips** (pre-cut paper, 3x3 inches).
      *   Max 1 slip per team per phase.
      *   Board decisions take 1 round to implement (lag).

  **The Secret Economy (For Your Eyes & Private Cards):**
  *   **Factory Alpha (3 Students):**
      *   Conversion Rate: 1 Flux $\to$ 2 Alphas.
      *   Social Value per Flux: $2 \times 2 = 4$ pts.
      *   *Private Incentive:* Factory scores 1 pt per Alpha produced (regardless of social value).
  *   **Factory Beta (3 Students):**
      *   Conversion Rate: 1 Flux $\to$ 1 Beta.
      *   Social Value per Flux: $1 \times 5 = 5$ pts.
      *   *Private Incentive:* Factory scores 1 pt per Beta produced.
  *   **First-Best Allocation:** 100 Flux to Beta = **500 Total Points**.
  *   **Worst Allocation:** 100 Flux to Alpha = **400 Total Points**.
  *   **Split Allocation:** 50/50 Flux = **450 Total Points**.

  **Materials:**
  *   20+ Paper Slips (3x3 inches).
  *   Pens.
  *   4 Envelopes (for Private Info Cards).
  *   A timer.

  ---

  ## 2. Roles & Distribution (22 Students)
  1.  **Central Planning Board (CPB):** 4 Students.
      *   Task: Allocate Flux to maximize *Total Firm Score*.
      *   Tools: Whiteboard section, Slip collection box.
  2.  **Production Units:** 4 Factories (Alpha 1, Alpha 2, Beta 1, Beta 2). 3 Students each (12 total).
      *   *Note:* Splitting into duplicates allows for "shocks" to specific units without killing the whole sector.
      *   Task: Request Flux, Produce Goods.
      *   Incentive: Maximize *Factory Score* (Units Produced).
  3.  **Market/Auditors:** 3 Students.
      *   Task: Collect final production, calculate points, enforce rules.
  4.  **Runners:** 3 Students.
      *   Task: Physical transport of slips. No verbal communication.

  **Private Information Packets (Sealed Envelopes):**
  *   **CPB:** Receives "Standard Manual" (States the Public Constants and the *initial* conversion rates: Alpha 1:2, Beta 1:1).
  *   **Factories:** Receive "Production Cards."
      *   Alpha Cards: "You convert 1 Flux to 2 Alphas."
      *   Beta Cards: "You convert 1 Flux to 1 Beta."
      *   *Crucial:* The CPB knows these rates *only if* Factories report them truthfully in Round 1. The CPB manual says "Verify rates with factories."

  ---

  ## 3. The Three Rounds

  ### Round 1: Direct Quantitative Command (20 Minutes)
  **Mechanism:** The CPB asks factories for data. Factories submit requests. CPB allocates.
  **Procedure:**
  1.  **Request Phase (5 min):** CPB sends slips to factories: "State your efficiency and request Flux."
  2.  **Response Phase (5 min):** Factories reply. *Incentive Conflict:* Alpha creates more units per Flux (2 vs 1). If Factory Score is based on units, Alpha *wants* Flux more than Beta does, even though Beta creates more Social Value. Alpha is incentivized to lie or exaggerate need.
  3.  **Allocation Phase (5 min):** CPB distributes Flux based on replies.
  4.  **Production & Score (5 min):** Factories produce. Market calculates Total Firm Score.
  **Theoretical Target:** If CPB trusts the data and does the math ($4 < 5$), they allocate all to Beta. If Factories lie (Alpha claims high efficiency), CPB may misallocate.
  **Win Condition for Board:** Achieve 500 points. (Possible if they audit or deduce the lie).

  ### Round 2: Lange-Style Parametric Prices (20 Minutes)
  **Mechanism:** CPB sets a "Shadow Price" for Flux. Factories decide how much to "buy."
  **Procedure:**
  1.  **Pricing Phase (5 min):** CPB posts a price for Flux (e.g., 3 pts per unit).
  2.  **Bidding Phase (5 min):** Factories calculate margin.
      *   Alpha Margin: (2 units $\times$ 2 pts) - Cost.
      *   Beta Margin: (1 unit $\times$ 5 pts) - Cost.
      *   They submit slip: "We buy X Flux."
  3.  **Clearing Phase (5 min):** If Demand > 100, CPB raises price. If Demand < 100, CPB lowers price. (Allow one iteration only to simulate friction).
  4.  **Production & Score (5 min):** Calculate points.
  **Theoretical Target:** If CPB sets Price between 4 and 5 (e.g., 4.5), Alpha drops out (Margin 0), Beta buys all (Margin 0.5). Result: 500 points.
  **Win Condition for Board:** Achieve 500 points without knowing factory efficiencies directly.

  ### Round 3: The Hayekian Shock (20 Minutes)
  **Mechanism:** Local Shock + Restricted Communication.
  **Procedure:**
  1.  **Setup:** Same as Round 2 (Prices).
  2.  **The Shock (Mid-Round):** Hand a sealed note to **Beta 1** only.
      *   *Note Content:* "Machine Vibration. Efficiency halved. 1 Flux $\to$ 0.5 Beta. Do not report number. Card says: 'Risk of Failure'."
      *   *New Social Value for Beta 1:* $0.5 \times 5 = 2.5$ pts per Flux.
      *   *New Optimal:* Flux should move to Alpha (Value 4).
  3.  **Constraint:** Beta 1 cannot send a number to the Board. They can only send the "Risk" slip. The Board requires numerical data to adjust prices.
  4.  **Lag:** The Board sets prices *before* the shock is fully processed.
  5.  **Production & Score:** Calculate points.
  **Theoretical Target:** Board keeps Price at 4.5. Beta 1 buys Flux (thinking margin is positive based on old price) but fails to produce. Alpha sits idle. Score crashes (~350 pts).
  **Win Condition for Board:** Minimize loss. If they interpret "Risk" correctly and shift allocation despite the price signal, they save the round.

  ---

  ## 4. Minute-by-Minute Timeline (110 Minutes)

  *   **00:00 – 00:15:** **Setup.** Arrange tables (Board center, Factories perimeter). Distribute roles and envelopes. Read rules strictly. Emphasize "No talking across zones."
  *   **00:15 – 00:35:** **Round 1 (Command).** Run the phases. Enforce slip limits. If students talk, stop the clock.
  *   **00:35 – 00:55:** **Round 2 (Prices).** Reset Flux. CPB must post a price on the board. Factories calculate privately.
  *   **00:55 – 01:15:** **Round 3 (Shock).** Deliver shock note at minute 60. Allow chaos. Enforce the "No Numbers" rule on the shock report.
  *   **01:15 – 01:20:** **Score Tally.** Market team posts final scores for R1, R2, R3 on the board.
  *   **01:20 – 01:50:** **Debrief.** (See below).
  *   **01:50 – 01:55:** **Buffer/Dismissal.**

  ---

  ## 5. Debrief Guide (30 Minutes)
  *Do not lecture. Map their experience to the texts using questions.*

  **Phase 1: The Calculation Problem (Mises)**
  *   *Observation:* In Round 1, the math required was trivial ($2 \times 2$ vs $1 \times 5$).
  *   *Question:* "The Board had the arithmetic capability to solve for the 500-point optimum in Round 1. If the score was lower, was it a failure of *calculation* or a failure of *data*?"
  *   *Question:* "Mises argued calculation is impossible without prices. Did you need prices to solve Round 1, or did you need truth?"

  **Phase 2: The Incentive Problem (Agency)**
  *   *Observation:* Alpha factories wanted Flux to boost their unit count, even if it hurt the Firm Score.
  *   *Question:* "In Round 1, why might Factory Alpha have lied about their efficiency? Did the Planning Board have a way to verify it without visiting the factory?"
  *   *Question:* "In Round 2, did setting a price solve the lying problem? Why did Alpha stop asking for Flux when the price hit 4.5?"
  *   *Point to Elicit:* Lange's solution solves the *incentive* to lie (if managers follow rules) but assumes they *can* follow the rule "equate marginal cost to price."

  **Phase 3: The Knowledge Problem (Hayek)**
  *   *Observation:* Round 3 score likely dropped.
  *   *Question:* "In Round 3, the Board had the same math skills and the same price mechanism as Round 2. Why did the outcome change?"
  *   *Question:* "Beta 1 received a note about 'Vibration.' Could they have written a number on the slip that accurately captured that risk? If they wrote 'Efficiency is now 50%,' would that have been true before the vibration started?"
  *   *Question:* "Hayek distinguishes between 'statistical knowledge' and 'knowledge of the particular circumstances of time and place.' Which slip represented which?"
  *   *Question:* "If the Board had waited two rounds to adjust the price, how much value would be lost? Is the cost of the *lag* part of the calculation?"

  **Phase 4: Synthesis**
  *   *Question:* "Under what conditions did the Central Board outperform the Price Mechanism?" (Answer: Round 1, if data was honest/static).
  *   *Question:* "Under what conditions did the Price Mechanism fail?" (Answer: Round 3, when knowledge was tacit/time-sensitive).
  *   *Closing:* "Mises said you can't calculate. Lange said you can iterate. Hayek said the problem isn't the math, it's the *information flowing into the math*. Which of you felt the bottleneck was the whiteboard, and which felt it was the slip of paper?"

  ---

  ## 6. Candid Analysis: What Goes Wrong & Contingencies

  ### Predictable Failures
  1.  **The "Soviet" Collapse:** Students may treat Round 1 as a joke and lie blatantly, causing the Board to fail.
      *   *Repair:* In debrief, highlight that this confirms the *Incentive* problem, not the *Calculation* problem. The math was solvable; the sociology was not.
  2.  **Board Paralysis:** The CPB may spend 15 minutes arguing over a price in Round 2.
      *   *Repair:* Enforce the timer strictly. "Market Clearing" must happen in 5 minutes. This friction *is* the lesson (transaction costs).
  3.  **The "Hunch" Loophole:** A clever Beta 1 student might write "Efficiency = 0.5" on the slip despite the "Risk" card instruction.
      *   *Repair:* If they do, acknowledge it. Ask: "In reality, did the machine operator know it was exactly 50%? Or did they just feel a vibration? By quantifying it, you solved Hayek's problem by fiat. Did you actually *know* that number, or did you guess?"

  ### If The Board Wins Outright
  If the CPB is unusually competent (e.g., they guess the shock in Round 3 or force truth in Round 1):
  *   **Do not invalidate the result.**
  *   **Say:** "You achieved the first-best allocation. What was the *cost* of that success? Did you spend 15 minutes interrogating a runner? Did you threaten to audit? In a real economy, that interrogation time is resources consumed. Hayek's point is not that central planning *never* works, but that it is *more expensive* in terms of information gathering than a system that utilizes local knowledge automatically."
  *   **Key Distinction:** Central planning *can* work if information is cheap. Hayek argues information is inherently expensive/dispersed.

  ### Limitations of the Exercise
  1.  **Articulated Tacit Knowledge:** The "Vibration" card is still text. Hayek's point is about knowledge that *cannot* be put on a card (e.g., a machine operator's intuition).
      *   *Debrief Repair:* Ask students: "If I had told Beta 1 'You know something is wrong but you can't say what,' would they have sent the slip? How many of you would have ignored a feeling to wait for a number?"
  2.  **Static Prices:** Real prices fluctuate continuously. Here, they are round-based.
      *   *Debrief Repair:* "We simulated a 'tâtonnement' process. In reality, the auction never stops. How does the lag we felt (one round) compound over 100 rounds?"
  3.  **Class Size:** 22 is ideal for this specific configuration (4 factories of 3).
      *   **Range:** Works with 18–27.
      *   **If < 18:** Reduce Factories to 2 (Alpha, Beta) with 4 students each. Reduce Board to 3.
      *   **If > 27:** Add a "Raw Material Supplier" layer to increase supply chain complexity, or add more Factories. Do not increase Board size (diminishing returns on deliberation).
      *   **What to Cut:** If time runs short, cut Round 2. Move directly from Command (R1) to Shock (R3). This sharpens the Mises vs. Hayek contrast but loses the Lange price iteration lesson.

  ### Final Note on the "Board Can Win" Constraint
  You requested the Board be able to win. In Round 1, if the Board says "We will audit any factory whose output doesn't match their claim," and enforces a penalty (e.g., -50 points for lying), rational factories will tell the truth. The Board then solves the math and gets 500 points.
  *   **Pedagogical Value:** This shows that Central Planning *requires* coercion/monitoring to solve the Incentive problem, whereas the Price System (Round 2) solves it through alignment (Alpha *chooses* not to buy at 4.5). This sets up the contrast between *command* and *coordination*.
