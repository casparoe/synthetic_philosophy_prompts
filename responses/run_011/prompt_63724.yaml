answer: |-
  1. The atrophy account insists understanding is an internal capacity to answer what-if questions that diminishes when delegated, whereas the parity account contends understanding is a distributed state that persists so long as the coupled system can answer those questions. Consequently, they disagree on whether Bea possesses understanding while coupled: atrophy says she lacks it because she didn't exercise the capacity, while parity says she has it because the coupled system retains the ability to answer what-if questions.

  2. A second axis concerns the temporal locus of evaluation, as the atrophy account weighs the history of cognitive effort required to build the capacity, while the parity account weighs only the current functional integration and reliability of the resource. This means the atrophy account penalizes Bea for her passive process, whereas the parity account rewards her for achieving a reliable coupled output regardless of how that coupling was established.

  3. The atrophy account predicts Ada retains understanding because she exercised her capacity, while it predicts Bea suffers atrophy because she bypassed the cognitive labor required to maintain it. The parity account predicts both possess understanding while coupled to the assistant, but it must concede Bea loses understanding immediately upon decoupling since the distributed system is broken.

  4. The cheapest revision requires that automatic endorsement demands internal comprehension of the output, not just blind trust, to count as a genuine cognitive coupling. This revision effectively collapses the parity account into the atrophy account because it makes the external extension contingent upon the very internal capacity whose exercise the atrophy account deems essential.

  5. The atrophy account better explains the erosion of understanding because it captures the normative intuition that understanding requires robustness against the loss of external tools. The deciding consideration is that Bea's inability to diagnose novel data without the assistant reveals her previous accuracy was merely simulacra rather than genuine cognitive grasp.
