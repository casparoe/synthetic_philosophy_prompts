  7.  **Final Polish:** Organize by the numbered points. Ensure tables are clear. Make sure the distinction between "decorative" and "fatal" is sharp. (Proceed to generate output based on these thoughts.)

      *   *Key Insight for Q5:* The biological analogy works because natural selection operates on the *geometric mean* of reproductive success over time for a lineage, *not* the arithmetic mean of a hypothetical ensemble. However, when biologists measure fitness, they often look at population growth rates. If the risk is idiosyncratic, the population smooths it (law of large numbers). If the risk is systemic (environmental stochasticity), the population growth rate *is* the geometric mean of the individual. The student's analogy assumes systemic risk (market crashes affect everyone). If risk is idiosyncratic, the ensemble argument (EU) actually works for the population, just not the individual. I need to clarify this distinction.

