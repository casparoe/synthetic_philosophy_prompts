      *(Self-Correction on Locality)*: M's argument about locality is actually quite specific: "If it represented position, patching ought to have had graded effects across all positions." This implies M thinks a position representation should be *continuously* consulted. R says it's only consulted when relevant. In navigation, you *do* check position continuously (odometry). If the ablation *only* matters at the wall, maybe it's not a position representation, but a "wall proximity alarm." This is a strong point for M. I need to make sure I don't dismiss M too easily here. It distinguishes "State" vs. "Event."

