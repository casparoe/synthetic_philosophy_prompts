  | Demonstration-Gated | The literal sense stands as default unless strict physical demonstration forces reinterpretation. | Explains P4 and P5, preserving authority and the status quo until proof arrives. | Contradicts P1 and P2, where Galileo rejects the literal sense without physical demonstration. | Literal retained, because no demonstration against celestial water yet exists. | Medium | Job 26:7, where accepting "nothing" as true would violate the gate without proof. |
  | Accommodation* | Scriptural language regarding nature is adapted to common perception and persuasive purpose, not physical ontology. | Explains P1, P2, and P3 by allowing non-literal reading based on intent and absurdity. | Strains P5, as it risks private individuals deciding intent rather than the Church. | Non-binding, because the vault describes appearance, not celestial constitution. | High | Job 26:7, where the principle allows the text to be poetic rather than a physical claim. |
  | Institutional | Exegetical authority rests solely with the Church; private individuals must defer on disputed passages. | Explains P5 and P4's caution, maintaining ecclesiastical order. | Contradicts P1 and P2, where Galileo effectively decides the exegesis himself. | Deferred, pending a council or papal ruling on the physical status of the heavens. | Medium | Genesis 7-8, where the Church has no ruling, forcing total suspension of judgment. |
  | Uniformity | If one absurdity is read literally, all similar texts must be, so absurd texts must be read uniformly non-literally. | Explains P1 and P2 via reductio ad absurdum on anthropomorphism and immobility. | Strains P3, where the miracle is unique and not subject to uniform natural laws. | Non-binding, because literalizing waters implies literalizing God's hands. | Low | Isaiah 40, where the "circle of the earth" tests whether all cosmological metaphors are equal. |
