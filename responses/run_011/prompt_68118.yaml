      *(Self-Correction during drafting)*: I need to be careful with #6 vs #7. #6 says "If we saw something that looked like a violation, the generalisation was never a law." #7 says "If one ball fell up... gravity was a law, one with a single exception."
      *   #6 implies: Violation -> Not a Law.
