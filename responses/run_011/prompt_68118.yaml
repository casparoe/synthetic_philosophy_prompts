      *Wait, one nuance on #6:* "No actual event can violate a law." This is often a definition of law in Humeanism. If an event happens, the law must accommodate it. #7 suggests a *normative* view of laws (gravity *should* hold, even if it didn't once). This pushes towards Anti-Humeanism or a modified Humeanism (Ceteris Paribus).
