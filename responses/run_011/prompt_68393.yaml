      *   *The Twist:* Dennett's 1976 paper "Dreams and Brain Waves" is the key text. He argues Malcolm's verificationism is too strict. If we have independent criteria, the statement becomes meaningful.
      *   *Did Dennett land close to Malcolm?* In *Consciousness Explained*, Dennett suggests consciousness is fragmented. Some modern interpreters say Dennett's view of consciousness makes the "when" of the dream less important than the "report." But for the purpose of the column, Dennett is the rebuttal to Malcolm's verificationism.

