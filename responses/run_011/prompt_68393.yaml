          4.  Avoid misrepresenting either philosopher.
      *   **Tone:** Professional, precise, nuanced (suitable for a column writer who wants accuracy).

  2.  **Deconstruct the Philosophical Positions:**

      *   **Norman Malcolm (*Dreaming*, 1959):**
          *   *Core Claim:* It makes no sense to say something is "happening" in the mind during sleep.
          *   *Reasoning:* Criteria for truth. How do we verify "I was experiencing X at 3 AM"? Only via the waking report. If the report is the *only* criterion, then the dream *is* the report, not a prior event.
          *   *Key Distinction:* He isn't making a physiological claim (about brain waves); he's making a conceptual/linguistic claim about the *logic* of dream attribution.
          *   *Vulnerability:* He assumes the only access is the waking report. If we find independent correlates, does that break his logic?

      *   **Daniel Dennett ("Dreams and Brain Waves," 1976 / *Brainstorms*):**
          *   *Core Claim:* Malcolm is wrong, but not just because of EEG.
          *   *Reasoning:* Dennett argues that if we have independent criteria (EEG, eye movements) that correlate with reports, we are justified in positing the experience as occurring *during* sleep.
          *   *Nuance:* Dennett is a functionalist/compatibilist. He cares about *heterophenomenology*. He doesn't necessarily believe in a "Cartesian Theater" where a little man watches the dream.
          *   *Relation to Malcolm:* Dennett actually agrees with Malcolm that the *certainty* of the dream report is not privileged. But he disagrees that the lack of independent criteria makes the temporal location nonsensical.

      *   **The Empirical Data (REM/Aserinsky & Kleitman, Hobson, etc.):**
          *   Shows correlation between physiological states and dream reports.
          *   Does it prove "experience"? It proves neural activity associated with experience.

  3.  **Address the Specific Questions:**

      *   **Q1: Can brain data confirm/refute "not an experience"?**
          *   *Problem:* "Experience" is a philosophical concept, not a raw physical measurement. Brain data shows *correlates* of experience (NCC).
          *   *Malcolm's Defense:* He would say, "Even if the brain is active, that doesn't mean *I* was experiencing anything. Activity $\neq$ Experience." (The Hard Problem/Explanatory Gap).
          *   *Verdict:* Empirical data shifts the burden of proof, but doesn't logically *force* Malcolm to concede unless you accept the premise that specific neural activity *constitutes* experience. Malcolm was doing conceptual analysis, not science. You can't refute conceptual analysis with a voltmeter unless you bridge the is-ought (or is-experience) gap.

      *   **Q2: Did Dennett refute Malcolm or land close to him?**
          *   *Refutation:* Dennett definitely argues Malcolm is wrong about the *logic* of dream attribution.
          *   *Closeness:* Dennett is *not* a realist about qualia in the traditional sense. He thinks the "stream of consciousness" is a user-illusion. In a way, both deny a robust, private, infallible inner movie. Malcolm says "no inner movie during sleep." Dennett says "the inner movie is a narrative construct anyway."
          *   *Key Distinction:* Malcolm says the *timing* is wrong (it's all upon waking). Dennett says the *ontology* is tricky, but the timing is defensible based on functional criteria.
          *   *Verdict:* Dennett refutes Malcolm's conclusion but shares his skepticism about privileged access. However, framing it as "Dennett used EEG to prove Malcolm wrong" is too simple. Dennett used EEG to show that Malcolm's *criteria* for meaningful speech were too restrictive.

      *   **Q3: What is settled vs. contested?**
          *   *Settled:* Most philosophers and scientists accept dreams occur during sleep. The "retrospective fabrication" theory (Malcolm's strong claim) is largely abandoned in cognitive science.
          *   *Contested:* The *nature* of the experience. Is it continuous? Is it hallucinatory? Do we dream in color? Do blind people dream visually? The "instant dream" hypothesis (dreams are created at the moment of awakening, even in REM) still has some niche proponents (e.g., Schwitzgebel has written on the unreliability of dream reports).
          *   *The "Empirical Settlement" Myth:* Philosophy isn't usually "settled" by data. The *scientific consensus* is settled; the *philosophical implications* are not.

