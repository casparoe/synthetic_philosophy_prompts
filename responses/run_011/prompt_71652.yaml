      *   *Why?* Because the "future $65M" assumes the town exists in a form that can use it. If the town floods repeatedly, the social fabric degrades, population leaves, tax base collapses. The $65M might be useless in a ghost town. The buyout preserves the *conditions* for the town to exist.
      *   *Recommendation:* Approve the buyout, but restructure the "principal protection" policy to acknowledge that mission fulfillment sometimes requires capital deployment, not just income distribution.

