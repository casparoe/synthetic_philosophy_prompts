answer: |-
  You have put your finger on one of the most persistent headaches in the philosophy of art, though you've arrived at it through the practical end, which is often the sharper vantage point. What you are describing is the tension between an object's *physical properties* (what it looks like) and its *historical genesis* (where it came from).

  Here is an analysis of what your museum's practices actually commit you to, stripped of the jargon.

  ### 1. What the Refusal Presupposes
  When the acquisitions committee turns down the indistinguishable hand-painted copy, they are presupposing that **arthood is not merely visual.**

  If art were defined solely by aesthetic quality or visual experience, the copy would be just as valuable as the original. By rejecting it, the museum commits to the view that an artwork is an **event** as much as it is an **object**. It is a trace of a specific human action that occurred at a specific time.

  Therefore, the refusal presupposes a **Historical or Genetic Definition of Art**. It claims that for something to be the artwork *X*, it must be the product of the specific creative process that generated *X*. The copy fails not because it looks wrong, but because its biography is false. It claims to be a trace of the Master's hand, when it is actually a trace of the Forger's hand.

  ### 2. Strict Commitment vs. Comfortable Fit
  It is vital to distinguish what the museum is logically forced to believe versus what merely suits its interests.

  *   **What the practice strictly commits us to:** The museum is an archive of human history, not just a gallery of images. We are committed to the idea that the *provenance* (the chain of custody and creation) is constitutive of the object's identity. We are committed to the view that the artist's agency is part of the work's ontology (its state of being).
  *   **What merely fits comfortably:** The market value and the fear of scandal. It is convenient that the philosophical definition aligns with financial value. If the forgery were worth millions, the committee might be tempted to rationalise a different theory. It is also convenient that avoiding deception protects the museum's reputation. These are practical benefits of the Historical Definition, but they are not the definition itself.

  ### 3. Rival Accounts Shut Out
  Your museum's daily practice effectively shuts out two major rival theories of art:

  *   **Pure Aestheticism:** This is the view that art is defined by beauty, form, or the ability to provoke an emotional response. Your store room proves this false. If the copy provokes the same emotion and has the same form, yet is rejected, then aesthetic experience cannot be the sole criterion for arthood.
  *   **Functionalism:** This is the view that art is defined by what it *does* (e.g., educates, decorates, or rituals). Since the copy could educate or decorate just as well as the original, but is still barred, the museum rejects the idea that function alone makes art.

  Furthermore, by valuing the Roman copy (Case B) but rejecting the modern forgery (Case A), you shut out the idea that **age alone** confers value. The Roman copy is valued because it is an honest Roman artefact, not because it is old.

  ### 4. Can the Three Cases be Squared?
  Yes. All three cases can be reconciled under a single theory: **The Theory of Historical Integrity.**

  The unifying principle is not whether the object is a copy, but whether the object is **transparent about its origin.**

  *   **Case A (The Forgery):** This is rejected because it is a lie. It claims a history it does not possess. It breaks the chain of historical integrity.
  *   **Case B (The Roman Copy):** This is accepted because it is telling the truth. The label likely reads 'Roman, 2nd Century, after a Greek Original'. It is not pretending to be Greek; it is being honoured as a Roman interpretation. It has its own valid historical genesis.
  *   **Case C (Copy Day):** This is encouraged because no false claim is made. The participant is not trying to pass their watercolour off as a Constable. They are engaging in a process of learning. The 'art' here is the educational activity, not the resulting object.

  So, the single theory is: **An object is acceptable as 'Art' in this institution if its physical form accurately testifies to its history of production.**

  ### 5. Swapping to the 'Honesty-and-Market' Theory
  You asked what would change if we admitted the presupposition was merely about honesty and money, rather than the nature of art. This is a significant shift.

  Currently, the museum operates as if the forgery is *ontologically* lesser (it 'is not' the art). If you swapped this for the 'Honesty-and-Market' theory (admitting the copy *is* art, but a fraudulent commodity), the following would change:

  *   **In the Drawers:** The forgeries would not necessarily be hidden. A 19th-century forgery of a Renaissance master is now an honest 19th-century artefact. Under the Historical Integrity theory, we might eventually catalogue it as 'School of [Forger], c. 1890'. Under the Market theory, it remains toxic inventory because it cannot be sold or insured as an original. If we admitted it was just about money, we might sell them off quietly. If we admit it's about honesty, we re-label them and study them as examples of taste and deception in the 19th century.
  *   **On the Walls:** The labels would change tone. Currently, labels imply a sacred connection to the creator. Under an honesty-based view, the labels might become more explicit about the 'cult of the original'. We might see more displays comparing originals and copies side-by-side to teach the public *why* we care about the brushstroke, rather than just hiding the copy to preserve the aura.
  *   **The Copy Days:** Currently, we treat these as educational. Under a strict market theory, we might worry that these copies dilute the brand or create future forgeries. We might restrict them more heavily. Under the honesty theory, we can relax, knowing that as long as the provenance is clear, the copy poses no threat.

  ### Summary
  Your intuition is correct. The inconsistency is only superficial. Deep down, the museum is not obsessed with 'originality' in the sense of uniqueness; it is obsessed with **truth-telling**.

  The Roman copy tells the truth about Rome. The copy-day student tells the truth about their learning. The forger tells a lie about the Old Master. The museum is not a shop for beautiful images; it is a repository of verified human history. If you treat the forgery as art, you are not making an aesthetic error; you are falsifying the historical record. That is the commitment your keys and your store room shelves are guarding.
