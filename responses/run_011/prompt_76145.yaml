answer: |-
  Here is the plan. It is aggressive on time, so discipline is required.

  ### 1. The Single Carrying Case: Fat Devadatta
  **Use Devadatta.** You are correct that one example cannot do two jobs perfectly, but Devadatta is the only one that exposes the *reduction mechanism* clearly enough for the essay requirement. The Gavaya case is too specific to *upamāna* (comparison) and risks getting bogged down in semantics. Devadatta isolates the core epistemic tension: **Is explaining an anomaly Inference (*anumāna*) or a distinct capacity (*arthāpatti*)?**

  *   **What the case must have:**
      1.  **The Data:** Devadatta is fat (observed). Devadatta does not eat by day (observed).
      2.  **The Cognition:** "Therefore, Devadatta eats at night."
      3.  **The Conflict:** You never *saw* him eat at night. You never *inferred* it from a universal rule ("All fat non-day-eaters eat at night") because you don't know that rule exists yet.
  *   **What the case must not have:**
      1.  **Do not** introduce a specific speaker telling you he eats at night. That drags it into testimony (*śabda*) too early and muddies the "instrument" question.
      2.  **Do not** resolve the dispute. The point is that Nyāya and Mīmāṃsā disagree on the *count*, not the *truth*.

  **How to handle the Testimony Prejudice without a second case:**
  Do not run a second example. Instead, once the Reduction mechanism is established via Devadatta, **ask the students to apply the reduction test to Testimony.**
  *   *Script:* "We just saw Mīmāṃsā argue that Postulation can't be Inference because Inference needs a known universal rule, and we don't have one here. Now apply that test to Testimony. When a forester tells you 'The gavaya is like a cow,' is that reducible to Inference ('He is reliable, he said X, so X')? Or does it yield new content (the meaning of the word) that Inference cannot generate?"
  *   *Why:* This forces them to use the *tool* you taught them (the reduction criteria) on the topic they are prejudiced about. It turns their prejudice into an essay argument.

  ### 2. The Sequence (80 Minutes)
  *Dependencies are noted in brackets.*

  **00–10: The Definition & The Hook (Kill the "Culture" Expectation)**
  *   **Board:** Write *Pramā* (Veridical Cognition) and *Pramāṇa* (Instrument).
  *   **Move:** Define *Pramāṇa* immediately as "Instrument of Accurate Cognition." Explicitly reject "Source of Evidence."
  *   **Misconception Head-off:** "In Western epistemology, you often ask 'How do you justify this belief internally?' Here, the question is 'Did this belief arise from a reliable causal chain that links to the world?' If you walk in thinking this is about internal justification, you will misunderstand every argument that follows."
  *   **Dependency:** You cannot discuss reduction until they know what is being reduced (an instrument of *truth*, not just belief).

  **10–30: The Case (Fat Devadatta)**
  *   **Board:** Draw the triad: Fatness + No Day Eating → Night Eating.
  *   **Move:** Walk through the cognition. Ask: "What instrument produced this?"
  *   **Misconception Head-off:** "Don't tell me it's 'just logic.' Logic doesn't give you new facts about the world without a major premise. Where did the major premise come from?"
  *   **Dependency:** This sets up the need for *Arthāpatti* (Postulation).

  **30–50: The Reduction Dispute (The Core)**
  *   **Board:** Three columns: Buddhist (2), Nyāya (4), Mīmāṃsā (6).
  *   **Move:**
      *   **Buddhists:** Reduce everything to Perception + Inference. "Postulation is just Inference with a hidden premise." (Parsimony).
      *   **Mīmāṃsā:** "No. Inference requires a known pervasion (universal rule). We don't have that here. We have an inconsistency that *forces* a postulation. That is a different cognitive shape." (Distinctness).
      *   **Nyāya:** "It's Inference, but we admit the premise is supplied by the context, not memory." (Middle ground).
  *   **Fold-in: Vitiating Conditions:** When discussing Inference, ask: "What stops smoke from proving fire?" (Wet fuel). "This isn't a list of exceptions; it's a structural defeater. If the instrument is vitiated, the cognition isn't *pramā*."
  *   **Misconception Head-off:** "This is not verbal quibbling. If Mīmāṃsā is right, our cognitive architecture has a specific module for resolving inconsistency. If Buddhists are right, that module is an illusion. That changes how you model the mind."
  *   **Dependency:** You cannot understand the Externalism payoff until they see that the *instrument* is what is being validated, not just the belief.

  **50–60: The Testimony Prejudice (Application)**
  *   **Move:** Return to their Hume/Reid training. "You've been trained to think Testimony is 'faith' or 'reduced Inference.' Look at the Devadatta criteria. Does Testimony generate *new content* (like the meaning of 'gavaya') that Inference cannot?"
  *   **Fold-in:** "If Nyāya says Testimony is a distinct *pramāṇa*, they are saying language is a distinct way of accessing reality, not just a report of someone else's inference."
  *   **Misconception Head-off:** "Śabda is not 'Scripture.' It is 'Reliable Utterance.' A forester counts as much as a Veda."

  **60–75: The Payoff (Nyāya Externalism)**
  *   **Move:** Now reveal the veridicality point. "How do you know your cognition was *pramā* (true)?"
  *   **Board:** *Svataḥ-prāmāṇya* (Intrinsic) vs. *Parataḥ-prāmāṇya* (Extrinsic).
  *   **Argument:** Nyāya says you don't know it's true when it happens. You know it when you act on it and succeed. "You drink the water. You quench your thirst. *Then* the instrument is validated."
  *   **Dependency:** This relies on them understanding *pramāṇa* as an instrument for *action*, not just contemplation.
  *   **Misconception Head-off:** "This is not Pragmatism. Truth is correspondence. But the *test* of truth is successful action. This is Externalism: the reliability is in the link to the world, not your internal access to that link."

  **75–80: The Closing Question**
  *   **Ask:** "If two schools agree on *what* is known (Devadatta eats at night) but disagree on *which instrument* knows it, is the disagreement substantive or merely verbal?"
  *   **Why this separates them:**
      *   **Polite/Nodders:** Will say "It's just taxonomy/verbal."
      *   **Got It:** Will say "It's substantive because it commits you to a specific cognitive architecture (ontology of mind) and dictates how you handle defeaters."
      *   **Essay Link:** This is exactly the prompt they need for their essay (comparing reduction disputes to analytic debates about mental architecture or justification).

  ### 3. What to Cut (And How to Say It)
  **1. The Five-Step Inference Schema (Nyāya Syllogism)**
  *   **Verdict:** **Cut it.**
  *   **Why:** It is a trap. It invites the "Aristotle with ritual steps" misconception. It shifts focus from *epistemology* (justification/truth) to *logic* (validity). For the essay, they need to argue about the *status* of the instrument, not the structure of the argument.
  *   **Say:** "I am not putting the five-step schema on the board. Not because it isn't important, but because today we are doing epistemology, not logic. If you focus on the steps, you will miss the point about the instrument."

  **2. The Mechanism of Perceiving Pervasion (*Sāmānyalakṣaṇa*)**
  *   **Verdict:** **Cut it.**
  *   **Why:** You said you need to "physically restrain them" from calling it Hume's Problem of Induction. If you explain the extraordinary perception of universals required to ground inference, you *invite* that comparison.
  *   **Say:** "Nyāya claims we can grasp universals across time. How they think that works psychologically is a different seminar. For today, just note that they claim Inference *requires* a known universal, and that requirement is what drives the reduction debate."

  ### 4. Misconception Timeline (When they will arrive)
  1.  **Minute 5:** "So *pramāṇa* is just a source of evidence?" (Internalist reading).
      *   *Fix:* Your definition in Phase 1 must be rigid. "Instrument of *accurate* cognition. Truth is a condition of the instrument working, not a separate check."
  2.  **Minute 25:** "But isn't Devadatta just abduction/Inference to Best Explanation?" (Analytic reduction).
      *   *Fix:* "Yes, that's the Buddhist position. But why does Mīmāṃsā reject it? Because IBE still relies on a rule. Do we have a rule?"
  3.  **Minute 55:** "So Testimony is just faith in the Veda?" (Cultural reduction).
      *   *Fix:* Your "Forester" script in Phase 4.
  4.  **Minute 70:** "So truth is just what works?" (Pragmatist reduction).
      *   *Fix:* Distinguish the *definition* of truth (correspondence) from the *test* of truth (action).

  ### 5. Why This Works for the Essay
  The essay requires them to set a reduction dispute against a live analytic debate.
  *   This plan gives them the **Reduction Criteria**: (1) Novelty of content, (2) Necessity of a universal premise, (3) Cognitive architecture.
  *   This plan gives them the **Stakes**: Ontological parsimony (Buddhists) vs. Explanatory power (Mīmāṃsā).
  *   This plan gives them the **Externalist Hook**: The *Parataḥ-prāmāṇya* ending allows them to compare Nyāya to Process Reliabilism or Williamson's Knowledge First, rather than just "Hume on Induction."

  **Final Advice:** Do not let them translate *pramāṇa* as "source." Make them write "Instrument" on their notes. "Source" implies a container; "Instrument" implies a function. The reduction debate is about functions. If they get that, they get the session.
