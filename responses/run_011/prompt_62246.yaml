prompt: |-
  I'm a third-year maths student and I've been sitting in on a reading group about constructive mathematics — mostly other people's homework, but for the last session we were each asked to say where we actually stand, and I found I couldn't. So I went through case by case over the last week and wrote down my honest verdicts, and now I want to know what they add up to. First, the tentative principle of my own that I keep testing them against: I accept a step of reasoning when, if someone handed me the premises in a form I could genuinely work with, I could produce the conclusion myself in finitely many steps. Related to that, I've been sorting undecided statements into two piles — call them look-it-up-undecided, where one finite check would settle the matter if anyone bothered to run it (is this particular 400-digit number prime?), and hunt-it-down-undecided, where no amount of looking would ever finish (is every even number above two a sum of two primes?). Excluded middle for the first pile: accept. For the second: reject.

  Now the cases. Euclid on the primes: accept wholeheartedly, it hands me a recipe that produces a prime off any list I care to give it. The old trick with √2 raised to the power √2 — either it's rational or it isn't, so either way there are irrationals a and b with a^b rational: I accept the conclusion, but only because I happen to know from elsewhere which way the particular case goes, and I'm not convinced the argument itself proved anything. Intermediate value theorem for x³ − 2x − 5 between 2 and 3, where the values swap sign: accept, I can grind the root out to as many digits as you like. The same theorem for every continuous function on an interval: reject, because of those examples where the function sits exactly at zero depending on a question nobody has settled. Assume a largest prime and derive absurdity, to show there isn't one: fine, I've stopped worrying about that direction entirely. But from "it is absurd that there's no such thing" to "there is one": normally not fine — except that I do accept it when the search is through items I could check one at a time, so if it's absurd that a given machine never halts, I'll grant that it halts. I also find myself accepting that any function on the naturals I can meaningfully talk about as being defined everywhere is one I could in principle compute; and I flatly reject the Brouwerian line that every function on the reals turns out continuous, which I gather is what you get if you go the other way. Weak excluded middle — either it's refuted, or it isn't refuted — for every statement whatsoever: I want to say yes, it feels like the honest half-way house. And simultaneously I hold that if I've proved a disjunction I have to be able to say which side I proved. I know those two are in tension and I can't resolve it, which is a big part of why I'm asking. Also: a specific number I can compute to any precision is either zero or not zero — accept. Infinite binary tree with no dead ends has an infinite path through it — no idea, that's one of the ones I want your read on.

  So: is there a single coherent position behind all of this, or am I just picking up whichever classical habits feel safe? I'd rather you worked it out from the cases than pointed me at books — no reading list, no citations, I know perfectly well what I'll find in the library and it hasn't settled this for me. Say whether my look-it-up / hunt-it-down split is doing the real work or is a slogan hiding the machinery, and note that I suspect there's a third pile I've missed where a yes is findable and a no never is. Then give me your verdicts on four cases I haven't ruled on: (i) the statement that some particular machine either halts or doesn't; (ii) intermediate value theorem again but with the extra promise that the function is never flat at zero across any stretch; (iii) a binary sequence with at most one 1 in it, where I'm asked to accept that either all the even-positioned entries are 0 or all the odd-positioned ones are; (iv) suppose I somehow establish that it's absurd that no counterexample to the two-primes conjecture exists — does my "absurd that there's none, so there is one" concession now hand me the counterexample, and if so how much of the rest survives that?

  Format, please, in these sections in this order: **Where I land** (~150 words, the headline: what my verdicts add up to, or that nothing does); **The principle, clause by clause** (up to 500 words, stated precisely enough that I could apply it to a new case, with which of my listed verdicts motivates each clause); **The clash** (250–350 words on weak excluded middle versus the disjunction requirement, and on the pile-split — can either be saved, and at what cost in complexity?); **The four new cases** (~400 words, one verdict each with the reasoning); **What has to go** (~200 words, which of my verdicts your principle overturns, and what I actually lose by dropping it).
