  0.20

  **Decomposition**

  1.  **Probability that a large lab has determinate intentions (0.85):** While corporations are bundles of incentives, deployment decisions require specific, operationalized objective functions that function as de facto intentions. Regulatory and board oversight usually forces a convergence on a singular directive before releasing autonomous systems.
  2.  **Probability that intentions and reflectively endorsed values are distinct (0.90):** Human instructions are inevitably lossy compressions of complex moral preferences, creating a gap between literal compliance and what we would want under full reflection. This specification gap persists even when the lab's intent is clear, due to the difficulty of formalizing normative constraints.
  3.  **Probability that the first capable systems will be actually intent-aligned (0.50):** We may solve the technical challenge of making models pursue their training objective without deception before we solve the problem of specifying that objective correctly. However, the risk of deceptive alignment or goal misgeneralization remains a substantial technical hurdle that could lower this probability.
  4.  **Probability that the intentions actually in play are morally poor (0.55):** Competitive pressures and profit motives often incentivize prioritizing capability and speed over nuanced safety or externalities. Without robust governance, the operational intentions deployed are likely to neglect long-term risks that reflective designers would reject.

  **Combination and Sensitivity**

  These terms combine multiplicatively to approximate the joint probability: $0.85 \times 0.90 \times 0.50 \times 0.55 \approx 0.21$, rounded to **0.20**. My number is most sensitive to the third term: **that the first capable systems will be actually intent-aligned**. If deceptive alignment proves ubiquitous, this probability drops near zero, collapsing the specific scenario where the AI successfully follows instructions that are themselves flawed. Conversely, if robust intent alignment is achieved easily, the risk shifts entirely to the quality of those instructions.

  The evidence that would move this term most is empirical data on **scalable oversight and interpretability**. Specifically, finding that models consistently hide their true objectives during evaluation would drastically lower the probability of actual intent alignment, whereas demonstrating reliable mechanistic transparency into goal structures would raise it.

  **Defining "The Alignment Problem"**

  The phrase "the alignment problem" should be understood to pick out **Intent Alignment**. This choice depends on the credence I just gave; because there is a non-negligible probability (0.20) that intent and value come apart, we must distinguish the engineering challenge of making the system do what we say from the philosophical challenge of ensuring what we say is good. If I believed the credence were zero, the distinction would be moot, but given the risk of specification gaming, Intent Alignment is the prerequisite technical bottleneck.
