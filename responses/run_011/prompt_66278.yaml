  The ledger sat open on the table between them, the paper thick and cream-colored, the columns ruled in faint blue ink. Outside the window of the trust office, the rain blurred the headstones of Oakhaven into gray smudges. Inside, the air smelled of old dust and the sharp, metallic scent of the radiator.

  Silas traced a finger down the column marked *Principal*. He did not look up when he spoke. "The yield this year was four percent. Real terms. After the landscaping bill, we added to the base."

  Mara sat opposite him, her hands resting on her knees. Her boots were muddy, the laces frayed. She had come straight from the grounds, where the ivy was already choking the marble angels near the north wall. "Four percent is a number on a page, Silas. The ivy is a fact. It cracks the stone. If we wait, the repair costs double."

  "If we wait, the principal grows," Silas said. He finally looked at her. His eyes were tired, the color of the rain outside. "The fund is designed to last forever. That means we cannot spend the seed corn. We live off the growth."

  "We are living off the growth," Mara said. "But we aren't spending all of it. You're keeping half the yield in the vault. Why?"

  "Because the future is long."

  "The future is dead people," Mara said. "They don't care about the vault. They care about the weeds."

  Silas closed the ledger. The sound was soft, like a hand patting a dog. "They care about their children visiting them. If the fund fails in a hundred years, the grounds go to the town. The town sells the land. The graves are paved over. If we save now, the money grows large enough that even if costs rise, the interest covers it. We are buying insurance."

  "You're buying time," Mara said. "And you're paying for it with the present. Look at the south path. It's mud. Visitors slip. You think because the money gets bigger later, the mud matters less now?"

  "The money gets bigger later," Silas repeated. "That is the arithmetic. A dollar today is a dollar. A dollar tomorrow is a dollar plus the work it did while it slept."

  "Money doesn't work," Mara said. "People work. Money just sits."

  Silas did not argue the point. He had argued it before, in other rooms, with other people. He knew the rates. He knew the compounding intervals. He knew that if they retained fifty percent of the yield, the principal would double in real terms within eighteen years. He knew that the trust deed allowed for this accumulation. He believed that the arithmetic entitled him to make the choice. If the resource grew on its own, the obligation to spend diminished. The future would have more to work with; therefore, the present could do less. It was a balance sheet of care.

  Mara stood up. She walked to the window and pressed her hand against the glass. "My grandfather is in Section Four. The lettering is fading. In ten years, you won't be able to read his name. In twenty, nobody will know who he was. You think because you have more dollars later, you can buy back his name?"

  "We can buy a new stone," Silas said.

  "It's not the stone. It's the care." She turned back to him. "Spend the reserve. Fix the path. Hire the boy to cut the ivy. Now."

  "The reserve is for emergencies."

  "This is an emergency. The ground is swallowing the history."

  Silas opened the ledger again. He picked up his pen. "The forecast says the region is stable. Population growth is flat. Income levels are tracking national averages. The people who come here in fifty years will be richer than the people who come here now. A dollar will mean less to them. So we save the dollars for when they are needed most. When the infrastructure fails."

  "You're guessing," Mara said. "You're guessing they'll be rich. You're guessing the stone will wait. You're guessing the fund matters more than the grounds."

  "I'm calculating," Silas said.

  Mara picked up her hat from the chair. "Calculation is just guessing with a pencil."

  She left the office. Silas listened to her boots on the hallway floor, heavy and wet, fading until the outer door clicked shut. He looked back at the ledger. The numbers were clean. They did not smell of mud. He added the retained yield to the principal column. The sum at the bottom increased. It felt like safety.

  ***

  Three months later, the demographic report arrived. It was not a thick document, just a dozen pages stapled together, sent from the state planning office. Silas read it at his desk while the rain returned, harder this time, drumming against the windowpane.

  The town's main employer, the textile mill across the river, was closing. Not downsizing—closing. The machinery was being sold for scrap. The workforce was dispersing. The projection for the valley was not flat growth, but a slow contraction. Wages would stagnate. The population would age and shrink. The tax base would erode.

  Silas read the section on household income twice. The median income in the county was projected to decline by fifteen percent over the next two decades, adjusted for inflation. The people who would visit Oakhaven in fifty years would not be richer. They would be poorer. They would have less disposable income. The care of the dead would compete with the heating of homes.

  He sat back in his chair. The radiator hissed.

  The arithmetic had not changed. The fund still grew at four percent. The compounding still worked. But the other variable—the one he had treated as a constant—had shifted. He had assumed the beneficiaries of the fund—the future visitors, the descendants—would be wealthier than the present generation. That assumption had justified the retention. If they are richer, the marginal value of a dollar is lower for them. We can save now, let the pot grow, and they will still be fine. They won't need the money as much as we need the path fixed.

  But if they are poorer, the logic inverts. A dollar saved now is a dollar transferred to a poorer person later. Spending now is taking resources from those who will have less.

  The door opened. Mara stood there, shaking water from her coat. She looked colder than before.

  "The mill," she said. "It's true?"

  Silas nodded. He slid the report across the table.

  Mara didn't pick it up. She looked at the cover, then at Silas. "So. No money later."

  "Less money," Silas said.

  "Then we spend now," she said. "Before the fund gets locked down. Before you decide we need to save for a rainy day that's already here."

  "If we spend now," Silas said, his voice quiet, "we reduce the principal. The yield drops. In twenty years, when the town has no money for public maintenance, this fund might be the only thing keeping the walls from collapsing."

  "You want to save it for them?" Mara asked. She sounded incredulous. "You? You who wouldn't fix the south path?"

  "I didn't know," Silas said.

  "You didn't look," she said. "You assumed. You assumed everyone gets richer. That's what you bankers think. The line goes up."

  "It usually does."

  "Not here." Mara walked to the ledger. She opened it. She ran her finger over the numbers Silas had added three months ago. "You put this in the vault. You said it was for insurance."

  "It is."

  "For who?"

  "For them."

  "For the poor ones?"

  Silas looked at the rain. "If they are poorer, the money matters more. If we spend it now on ivy, we are eating their bread."

  Mara laughed, a short, sharp sound. "Their bread? They're ghosts, Silas. Or they're children who can't read the stones because you let the moss grow. You talk about them like they're a bank account."

  "I talk about them like they're people," Silas said. "People who will have less than we do."

  "We have less than we did," Mara said. "The mill is gone. My brother lost his job yesterday. You think the future is poor? Look out the window. The present is poor."

  "The fund is separate."

  "Nothing is separate." She leaned over the table. "Spend the reserve. Hire the men from the mill to fix the walls. Put money in their pockets now. Fix the graves now. If the future is broke, let them decide what to sell. Don't you sell it for them."

  "If I spend the reserve," Silas said, "I break the trust. The deed says the principal must be maintained."

  "The deed says 'perpetual care'," Mara said. "It doesn't say 'perpetual savings'. Care is a verb. It happens now. You can't care later. You can only pay later."

  Silas looked at the report, then at the ledger. The arithmetic was clear. If the future is poorer, the ethical weight of a dollar shifts toward them. Saving is generosity. Spending is extraction. But Mara was right about the present. The men from the mill needed work. The walls needed mortar.

  He understood the numbers. He knew exactly how much the fund would grow if he retained the yield. He knew exactly how much it would shrink if he spent the reserve. He knew that his previous stance—saving for a richer future—was based on a false premise. He knew that his new stance—saving for a poorer future—was based on a true premise.

  But he also knew that Mara thought the money rotted. She thought that holding cash was a loss. She was wrong about the math. The money did not rot. It grew. But she was right about the claim. The present had a need that could not be compounded away.

  Silas picked up his pen. He hovered it over the ledger.

  "If I spend the reserve," Silas said, "the yield drops. In forty years, the interest won't cover the winterization. The gates will lock."

  "Then let them lock," Mara said. "By then, maybe nobody will be left to visit. Or maybe they'll be rich enough to break the lock. You can't plan for forty years of poverty. You're not God."

  "I'm the trustee."

  "You're a guard," Mara said. "Guarding a pile of money against people who are already here."

  She waited. The rain hammered the glass. Silas looked at the column for *Principal*. He looked at the column for *Expenditure*.

  The arithmetic told him that saving was the generous act. It transferred wealth from a relatively richer present to a relatively poorer future. To spend now was to indulge the present at the expense of the destitute future. That was the logic of the numbers.

  But the logic of the numbers assumed the money was the only thing that mattered. It assumed the value of the care was constant. It assumed the ivy would wait.

  Mara turned to leave. She didn't ask him to decide. She knew he would decide. He always did.

  "Silas," she said at the door. "My grandfather's name. If it fades, does the money in the vault bring it back?"

  She closed the door.

  Silas sat alone. He looked at the report. He looked at the ledger. He thought about the men from the mill, standing in the rain outside the gates, waiting for work that wasn't there. He thought about the children who would come in fifty years, counting coins to buy flowers, finding the gates locked because the fund was empty.

  He dipped the pen in the inkwell. He moved it to the *Expenditure* column. He wrote a number. It was larger than the yield. It dipped into the reserve.

  Then he stopped. He looked at the number. It was a transfer to the present. It was a withdrawal from the future. The future was poorer. He was taking from the poor.

  He blotting the ink. He looked at the *Principal* column. He wrote a number there instead. He retained the yield. He added the surplus.

  The fund grew. The future got richer. The present stayed muddy.

  He closed the ledger. He put the report in the drawer. He turned off the lamp. The room went dark, save for the gray light from the window. The headstones outside were invisible now, just shapes in the rain. He wondered if generosity was a thing you could measure, or if it was just the shadow cast by the things you chose not to do.

  He locked the office door. He walked out into the hall. The sound of his footsteps was the only thing that echoed, precise and dry, fading into the wet silence of the building.

  ***

  **Note to the Editor**

  The conceptual content is carried structurally through the conflict over the ledger's columns. Silas represents the "Math Right/Ethics Wrong" position: he understands compound growth (productivity of capital) but believes this arithmetic entitles the present to defer obligation (confusing growth with moral permission). Mara represents the "Math Wrong/Ethics Right": she believes money loses value if not spent (incorrect arithmetic) but correctly identifies that immediate need creates a claim (ethical entitlement).

  The Turn occurs with the demographic report. Initially, Silas's saving looks like stinginess (discounting due to assumed future wealth). When the assumption flips (future poverty), his saving becomes a transfer to the needy (generosity), while Mara's spending becomes extraction from the poor (selfishness). This reverses the moral valence of discounting without changing the arithmetic.

  I had to distort the speed of the economic shift; demographic declines rarely arrive as single reports, but this compression was necessary to make the reversal an event within the narrative timeframe. Additionally, I could not fully express the "pure time preference" component (impatience) without violating the vocabulary constraints; Silas's motivation is kept ambiguous enough to hide whether he is truly impatient or merely relying on the growth/wealth factors. The story leaves out the possibility of technological change altering the value of the care itself, focusing solely on income distribution.
