answer: |-
  ### 1. What the question is testing

  This question tests whether students can distinguish moral blame from causal responsibility in the context of war origins. It requires them to evaluate whether unintentional risk-creation (exposure) suffices for culpability without collapsing into universal guilt. It demands analysis of the Versailles Treaty's legal function versus its moral reception to ground the philosophical argument.

  ### 2. The question

  **Question 1 (25 Marks)**

  In 1914, the Republic of Ostrava issued an unconditional guarantee to the Duchy of Vania following Vania's provocation of the Empire of Kael. When Kael mobilised, Ostrava's own war-plan automatically triggered a general declaration, though archival evidence confirms no Ostravan minister desired a general war. Historians agree Ostrava's guarantee objectively raised the probability of general conflict from low to near-certain, yet Kael and other powers also mobilised based on their own rigid plans.

  Drawing on the historiography of the July Crisis and theories of collective responsibility, answer the following: **Does moral responsibility for a general war require specific intention to cause that war, or can the creation of objective exposure suffice?**

  In your answer, you must address the objection that relying on exposure collapses into claiming "everyone is responsible," thereby exonerating all specific actors. You should also distinguish between the legal function of Article 231 of the Versailles Treaty and its moral reception.

  *(Word count: 198 words)*

  ### 3. Model answer

  The debate over war origins often conflates causal responsibility with moral blame, leading to stalemates like the one described in the prompt. To resolve whether intention is necessary for culpability, we must first separate these concepts. Responsibility refers to an agent's causal role in bringing about an outcome; blame implies a moral judgment warranting sanction. One can be responsible for a disaster through negligence without bearing the same moral blame as an architect of disaster, yet both may be liable for damages. Therefore, intention is not a strict prerequisite for responsibility, though it intensifies blame.

  The intention-only view, akin to the Fischer thesis, argues that without a conscious plan for general war, actors are merely caught in a system of causation. This view protects actors like Ostrava who sincerely desired localisation. However, this framework is too narrow because it ignores the morality of risk. When Ostrava issued an unconditional guarantee to Vania, they altered the strategic environment. Even if Ostrava hoped for peace, they removed diplomatic off-ramps for Kael. To claim this is merely "causation" and not "culpability" ignores that states have a duty of care regarding the security architectures they build. Negligence is a valid category of blame.

  The primary objection to this exposure view is the collapse problem: if raising odds is enough, every mobilising power is equally guilty, rendering the judgment useless. This objection fails because exposure comes in degrees and interacts with available alternatives. Ostrava's guarantee was unique; it transformed a regional dispute into a systemic threat. Other powers mobilised defensively or reactively; Ostrava acted proactively to shield a provocateur. Furthermore, Ostrava had alternatives—they could have conditioned their support on Vania's restraint. When an actor creates high exposure while possessing low-cost alternatives to avoid doing so, their share of responsibility increases. This prevents the "everyone is guilty" shrug by grading culpability based on the magnitude of risk created versus the feasibility of avoidance.

  Finally, we must contextualise this within the Versailles Treaty. Article 231 was drafted primarily to establish legal liability for reparations, not to issue a comprehensive moral finding on the war's origins. It needed a specific liable party to justify financial transfers, not a nuanced philosophical distribution of guilt. The heat surrounding the "War Guilt Clause" stemmed from reading this legal mechanism as a total moral condemnation of the German people. Recognising this distinction clarifies the exam question: we can assign liability for damages based on exposure (who broke the security system) without needing to prove malicious intent (who wanted the war). Ostrava is liable because its exposure broke the system, even if it lacked malicious intent.

  In conclusion, responsibility does not require intention. The exposure view withstands the collapse objection by analysing degrees of risk and available alternatives. By distinguishing legal liability from moral shame, we can assign specific responsibility to actors like Ostrava who engineered the conditions for war, even if they did not explicitly will the outcome. Intention aggravates blame, but exposure establishes the baseline for responsibility.

  *(Word count: 845 words)*

  ### 4. Marking scheme

  1.  **Clear Thesis on Intention vs. Exposure (5 marks)**
      *   *Must:* Explicitly state whether intention is necessary or if exposure suffices.
      *   *Botch:* Hedges indefinitely or refuses to commit to a side.
  2.  **Distinction Between Responsibility and Blame (5 marks)**
      *   *Must:* Define responsibility as causal/role-based and blame as moral/liability-based.
      *   *Botch:* Uses the terms interchangeably throughout the essay.
  3.  **Critique of Intention-Only View (5 marks)**
      *   *Must:* Explain why limiting culpability to intent ignores negligence or risk creation.
      *   *Botch:* Describes the Fischer thesis historically without analysing its philosophical limitation.
  4.  **Defense Against Collapse Objection (5 marks)**
      *   *Must:* Argue that exposure varies by degree and alternatives prevent universal guilt.
      *   *Botch:* Accepts the objection and concludes everyone is equally responsible.
  5.  **Versailles Liability vs. Moral Finding (5 marks)**
      *   *Must:* Identify Article 231 as establishing legal liability for damages rather than pure moral shame. **Note: If this distinction is missed entirely, cap total grade at B (69%).**
      *   *Botch:* Treats Versailles solely as a moral condemnation without legal context.
  6.  **Application to Fictional Scenario (5 marks)**
      *   *Must:* Use Ostrava/Vania/Kael to illustrate the philosophical points concretely.
      *   *Botch:* Ignores the scenario and writes only about historical Germany.

  ### 5. The two failures I expect

  1.  **The Historiographical Recital:** Students recount the Fischer controversy (who said what about German war aims) without engaging the philosophical question of whether intention is *necessary* for blame. They miss the normative argument entirely.
  2.  **The Universal Shrug:** Students accept the collapse objection uncritically, concluding that because multiple powers mobilised, responsibility is equally distributed. They fail to deploy the "degrees of exposure" counter-argument.
