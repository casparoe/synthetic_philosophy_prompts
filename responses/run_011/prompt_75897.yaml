prompt: |-
  I'm in the middle of an argument at work about how to set supplemental/disability benefit amounts and the same analogy keeps getting thrown around, from both sides. My colleague, who's a resourcist, says any capabilities-flavored per-person adjustment is Procrustes' bed: you build a template of normal functioning, measure everybody against it, and stretch or amputate until they fit. I say right back that the flat cash grant is the bed instead -- one length for everyone, tall or short, and the person who doesn't fit is the one who gets trimmed. So we're each accusing the other of being Procrustes, which its kind of suspicious and makes me think the analogy isn't carrying the weight either of us wants it to.

  Can you audit it for me? Lay out the mapping explicitly -- who's Procrustes, what's the bed, who are the travelers, and where the stretching-versus-cutting distinction actually lands across welfare equality, equality of resources, and the capabilities approach. Then separate the disanalogies that matter for a real policy argument from the ones that are just decoration. Two things I especially want your take on:

  1. Does the bed only bite against single-metric views, so that being pluralist about the metric escapes it -- or is that a dodge?
  2. My hunch is that the real content of the myth isn't the trimming at all, it's that Procrustes owned the bed and controlled the road, so nobody ever consented to being measured. If that's right the whole thing slides onto a coercion axis and is useless for our fight. Is it right?

  And if the bed can't carry the argument, tell me what analogy would.

  Say how confident you are in each verdict you land on, and flag the single point you're least sure about.
