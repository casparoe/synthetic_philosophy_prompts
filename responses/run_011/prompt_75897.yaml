      *   *Disanalogies:* Procrustes intended harm. Policy intends help (usually). Procrustes is individual; Policy is systemic.
      *   *Q1 (Pluralism):* It mitigates but doesn't solve. A multi-dimensional bed is still rigid if it doesn't bend. Confidence: High.
      *   *Q2 (Coercion):* It's the *structural* critique, not the *distributive* one. If you argue coercion, you argue against the welfare state, not the benefit formula. Confidence: Medium-High.
      *   *Better Analogy:* The **"Metabolic Rate"** or **"Vehicle/Terrain"** analogy. Let's go with **Vehicle/Terrain**. It highlights *conversion factors* (Sen's core insight) without the violence of Procrustes.
      *   *Confidence Ratings:* Need to be specific.
