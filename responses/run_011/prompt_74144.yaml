          *   *Reasoning:* "The boundary moved" is an *ad hoc* rescue for every counter-example. To make it "slow" (scientific), you must define *limits* to the boundary moving. You need a prediction where the boundary *cannot* move.
          *   *Worth holding?* Only if modified to be predictive about the *limit* of the subsidy (e.g., thermodynamic limits to photosynthesis). Otherwise, it's a philosophical stance, not a model.

  6.  **Refining the Tone:**
      *   The user wants no hedging. "Pick one and say so."
      *   The user wants to know if it collapses into a rival.
      *   Keep it rigorous, economic/biophysical, not dismissive.
      *   Acknowledge the "Right but Early" defense is the classic move of a degenerating programme (Lakatos).

  7.  **Self-Correction/Nuance Check:**
