          *   *Refinement:* The "manual" aspect is a weakness in the analogy, but "collateral product" saves the covariational reading. The text supports tracking. "Completely without power" refers to *governing* power, not thermodynamic existence.
          *   *Critique of Distinction:* Intervention/Covariation is good, but "Symbolic" vs. "Constitutive" might be sharper. However, stick to the user's terms to be helpful.
