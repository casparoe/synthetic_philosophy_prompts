prompt: |-
  I chair the medical policy committee at a regional insurer, about 400k members. Roughly a dozen coverage requests a month turn on the same question in different clothes: is this treatment or enhancement? Our contract defines medical necessity as care that restores or maintains function toward normal for age and sex, and I want one standing procedure our physician reviewers can run — they have no philosophy background and about 30 minutes a case. Right now they basically pattern-match to whatever the manufacturer's brochure claims, and the decisions dont survive appeal.

  So write the procedure. Ordered questions, what counts as a sufficient answer to each, where it terminates in "not covered," and where it explicitly hands the call to a human because the issue is about values rather than function. Tell me which two or three distinctions have to survive the simplification and which ones I can drop. And be straight about which steps are judgment calls wearing a procedure's costume — especially the age-and-sex-adjusted baseline, which seems to make "restoring a 68-year-old to 30-year-old levels" a bookkeeping question rather than a medical one.

  Then run it on three: testosterone for that 68-year-old whose level is normal for his age but low for a 30-year-old's; a cochlear implant for a prelingually deaf four-year-old whose Deaf parents are refusing it; and modafinil for a long-haul trucker with no sleep disorder. I expect at least one answer to be one I'll hate. Close with what the procedure can't do and where it will misfire predictably.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Analyze the Request:**
      *   **Role:** Chair of Medical Policy Committee at a regional insurer (400k members).
      *   **Problem:** ~12 coverage requests/month hinge on "Treatment vs. Enhancement." Current process relies on manufacturer claims, fails appeals.
      *   **Constraint:** Physician reviewers have no philosophy background, ~30 mins/case.
      *   **Contract Definition:** Medical necessity = restores/maintains function toward *normal for age and sex*.
      *   **Deliverables:**
          1.  A standing procedure (ordered questions, sufficient answers, termination points, escalation points).
          2.  Identification of 2-3 critical distinctions to keep vs. drop.
          3.  Honest admission of "judgment calls wearing a procedure's costume" (specifically regarding age/sex baselines).
          4.  Application of the procedure to three specific cases (Testosterone, Cochlear Implant, Modafinil).
          5.  Prediction of at least one unpopular answer.
          6.  Closing analysis on limitations and predictable misfires.

  2.  **Deconstruct the Core Conflict:**
      *   *Treatment* aims to cure/mitigate pathology.
      *   *Enhancement* aims to improve beyond normal baseline.
      *   *The Gray Zone:* "Normal for age and sex" is the contractual lever. This is where the ethical heavy lifting happens. Is aging a disease? Is deafness a disability or a culture? Is fatigue a symptom or a hazard?
      *   *Reviewer Reality:* They need clear heuristics, not bioethics seminars.

  3.  **Drafting the Procedure (The "Algorithm"):**
      *   Need a flowchart style but in text.
      *   Must start with pathology.
      *   Must address the "normal for age/sex" clause explicitly.
      *   Must have an "Escape Hatch" for value conflicts (escalation).
      *   *Step 1: Pathology Check.* Is there a diagnosed ICD code matching a recognized disease state?
      *   *Step 2: Baseline Comparison.* Compare patient function to the statistical norm for their specific age/sex cohort, *not* a youthful ideal.
      *   *Step 3: Goal of Intervention.* Is the goal to remove a barrier (treatment) or add a capacity (enhancement)?
      *   *Step 4: Risk/Benefit.* Standard medical review.
      *   *Step 5: Value Conflict.* If the patient/parent defines "normal" differently than the medical model (e.g., Deaf culture), escalate.

  4.  **Identifying Critical Distinctions (Keep vs. Drop):**
      *   *Keep:* Pathology vs. Variation (Is there a disease?).
      *   *Keep:* Restoration vs. Augmentation (Returning to baseline vs. exceeding it).
      *   *Drop:* "Quality of Life" subjective metrics (too vague for 30 mins).
      *   *Drop:* Long-term societal impact (too speculative).

  5.  **Addressing the "Judgment Call" (Age/Sex Baseline):**
      *   This is the crux. Defining "normal for age" medicalizes aging. It says a 68-year-old *should* have low testosterone. Treating it to 30-year-old levels is enhancement by contract definition. This needs to be stated bluntly.

  6.  **Running the Cases:**
      *   *Case 1: Testosterone (68M, low for 30, normal for 68).*
          *   Step 1: Pathology? No, labs are normal for cohort.
          *   Step 2: Baseline? He is at baseline for age.
          *   Step 3: Goal? To reach 30-year-old levels.
          *   Result: Enhancement/Not Covered. (This will likely be the "hate" answer).
      *   *Case 2: Cochlear Implant (4yo, Deaf parents refusing).*
          *   Step 1: Pathology? Hearing loss is a physiological deviation.
          *   Step 2: Baseline? Hearing is normal for age.
          *   Step 3: Goal? Restore hearing.
          *   *Conflict:* Parents define "normal" differently (cultural identity vs. medical function).
          *   Result: Escalate/Ethics Review. (Cannot be decided by algorithm).
      *   *Case 3: Modafinil (Trucker, no sleep disorder).*
          *   Step 1: Pathology? No diagnosis (narcolepsy/apnea).
          *   Step 2: Baseline? Fatigue is expected in long shifts, but alertness is required for safety.
          *   Step 3: Goal? Performance enhancement for job, not health.
          *   Result: Not Covered (Benefit exclusion/Enhancement).

  7.  **Refining the Output:**
      *   Tone: Professional, direct, slightly cynical about the limitations (matching the user's "be straight" request).
      *   Structure: Follow the prompt's requirements exactly.
      *   *Self-Correction on Case 2:* The prompt asks for the procedure's output. The procedure must have a step that says "If values conflict, escalate." So the output isn't "Deny," it's "Escalate." I need to make sure the procedure handles this.
      *   *Self-Correction on Case 1:* This is the one the user will hate. Denying TRT to a symptomatic 68-year-old because his levels are "normal for his age" feels cruel, but it adheres strictly to the contract definition provided ("normal for age and sex"). I must highlight this tension.

  8.  **Final Polish:**
      *   Ensure the "Judgment Call" section is prominent.
      *   Ensure the "Limitations" section is honest about the risks (litigation, member dissatisfaction).
      *   Check word count and flow.

  **(Self-Correction during drafting):** I need to make sure the procedure is actionable for a physician in 30 minutes. It can't be too abstract. It needs to reference specific data points (labs, ICD codes, functional metrics).

  **(Refining the "Hate" Answer):** The Testosterone case is the obvious candidate. It highlights the cruelty of the "normal for age" clause. I will lean into that.

  **(Refining the Cochlear Case):** This is the "values" trap. The procedure *must* kick this out of the standard review lane. If the reviewer tries to decide this, they will fail on appeal (rights of the child vs. rights of the parents/culture).

  **(Refining the Modafinil Case):** This is a clear "Not Covered" but for safety vs. health reasons. It's an occupational requirement, not a medical necessity.

  9.  **Final Review against constraints:**
      *   Ordered questions? Yes.
      *   Sufficient answers? Yes.
      *   Termination points? Yes.
      *   Escalation points? Yes.
      *   2-3 distinctions? Yes.
      *   Judgment calls exposed? Yes.
      *   3 Cases run? Yes.
      *   Limitations? Yes.

