answer: |-
  ### Part 1: The Brainstorm Dump (Untidy)

  Okay, let's throw everything at the wall before we paint over it. You're asking for a license to speak for a collective entity that, strictly speaking, doesn't exist as a singular agent. That's the ontological trap. But you need to operate in the real world where editors run headlines and readers consume them as facts.

  Here are the raw constraints floating in my head:

  *   **The "Top-of-Head" Problem:** If I call a random sample, 20% haven't thought about the issue. They answer to be polite. If I headline "Americans want X," but 20% just guessed, that's fraud. So we need *Stability*. But how do you measure stability without re-polling?
  *   **Riker's Ghost:** William Riker's *Liberalism Against Populism*. If preferences cycle (A>B, B>C, C>A), there is no "will." The winner is just whoever set the agenda. If your headline implies a stable preference order where there isn't one, you're lying.
  *   **The Boundary:** "The People." Does that mean registered voters? Adults? Citizens? People affected by the policy (including foreigners)? If you say "Americans," do you include undocumented residents? If you exclude them, are you biasing the "will" on immigration specifically? This is the *Constitution Problem*.
  *   **The Mandate Fallacy:** People vote for a bundle (a candidate), not a menu. Just because they voted Red doesn't mean they want Policy X from the Red platform. Headlines need *Granularity*. Issue-by-issue, not package-deal.
  *   **Auditability:** If I write "The Public Turns," a reader needs to know: Was this a poll? A protest count? Election results? If it's a poll, what was the margin of error? If I can't reconstruct the derivation from the text, it's magic, not news.
  *   **The Bootstrap (Performative):** This is the scary one. If the NYT says "The Public is ready for War," does that make the public ready for War? If our headline *creates* the consensus it reports, we are engaging in a feedback loop. We need *Causal Independence*. But journalism *influences*. So maybe it's not independence, but *Non-Circularity*. We can't use our own past headlines as data points for the current will.
  *   **Intensity:** 51% mildly want X. 49% hate X with burning passion. Who wins? "The People" usually implies the majority, but democracy sometimes protects minorities. If we ignore intensity, we miss civil war risks. If we include it, how do we measure it without bias?
  *   **Information:** People want X. But if they knew X cost $10k each, they'd want Y. Do we report the raw want or the *informed* want? Raw is objective but shallow. Informed is deep but paternalistic (who decides what info counts?).
  *   **Time:** Opinions decay. "The People" wanted X last Tuesday. Do they still? Headlines need a *Timestamp*.
  *   **Aggregation Method:** Mean? Median? Mode? Majority? Supermajority? Each yields a different "Will."
  *   **Goodhart's Law:** If we publish the metric for "The People's Will," campaigns will optimize for that metric, not genuine sentiment. This kills Auditability + Bootstrap resistance.

  Okay, that's the soup. Now I need to strain it.

  ***

  ### Part 2: The Pruned Specification (Desiderata)

  Here is the organized spec. I've grouped these into **Structural** (logic of the claim), **Epistemic** (knowledge quality), and **Ethical/Causal** (impact of the claim).

  #### I. Structural Requirements (The Logic of Aggregation)

  **1. Boundary Clarity**
  *   **The Requirement:** The headline or accompanying text must explicitly define the population set (e.g., "Registered Voters," "Adults," "Citizens").
  *   **The Case:** The "Boundary Problem" (Whelan/Whelan). On immigration or trade, excluding non-citizens who are materially affected changes the "will." If you don't define the set, "The People" is a rhetorical weapon, not a descriptive category.
  *   **Vindication:** Your suspicion was right. This eliminates vague "Public Opinion" claims.

  **2. Agenda Independence (or Acknowledged Dependence)**
  *   **The Requirement:** The attribution must not imply a transitive preference order if the data supports cycling. If the "will" depends on how the question was asked (framing) or the order of options, this must be disclosed.
  *   **The Case:** Riker's Impossibility Theorem. If 51% prefer A over B, and 51% prefer B over C, but 51% prefer C over A, there is no "Will." A headline declaring a winner smuggles in an agenda choice.
  *   **Vindication:** Essential. Prevents manufacturing consensus via question ordering.

  **3. Granularity (No Holism)**
  *   **The Requirement:** Attributions must be issue-specific. No inferring specific policy preferences from general electoral victories.
  *   **The Case:** The "Mandate" fallacy. A voter may choose Candidate A for reason X, not reason Y. Headlining "The People Want Y" because Candidate A won is a logical non-sequitur.
  *   **Vindication:** Critical for avoiding partisan overreach.

  #### II. Epistemic Requirements (The Quality of Input)

  **4. Stability (Non-Attitudes Filter)**
  *   **The Requirement:** Data must distinguish between considered judgments and top-of-head noise. Single-shot polls on obscure topics are insufficient for "The People Want" claims.
  *   **The Case:** Converse's "Non-Attitudes." Many respondents answer randomly to avoid looking ignorant. A headline based on noise is factually false.
  *   **Vindication:** High priority. Requires longitudinal data or deliberative polling, not just cross-sections.

  **5. Information Sensitivity**
  *   **The Requirement:** If a majority holds a view predicated on a demonstrably false empirical claim, the headline must qualify the "will" (e.g., "Voters support X, believing it reduces costs, though data shows otherwise").
  *   **The Case:** The "Informed Preference" problem. If I want to drink poison thinking it's water, do I *want* to drink poison? Journalism has a duty to truth, not just transcription.
  *   **Vindication:** Necessary for fact-checkers, but risky (paternalism).

  **6. Auditability (Procedural Transparency)**
  *   **The Requirement:** A reader must be able to identify the aggregation mechanism (poll, election, petition) and the margin of error/uncertainty from the story alone.
  *   **The Case:** Replicability. If "The People" is a black box, it's propaganda.
  *   **Vindication:** Non-negotiable for a fact-checking desk.

  #### III. Ethical/Causal Requirements (The Impact of Output)

  **7. Causal Robustness (Bootstrap-Resistance)**
  *   **The Requirement:** The claim must not rely on the media ecosystem itself to be true. The "will" must exist prior to and independent of the headline's publication.
  *   **The Case:** Performative speech acts. If we declare a "movement" based on early chatter, and our declaration causes the chatter to become a movement, we have certified our own bias.
  *   **Vindication:** This is your hardest constraint. It fights the "Bandwagon Effect."

  **8. Intensity Neutrality (or Explicit Weighting)**
  *   **The Requirement:** The outlet must decide whether "The People" means "Majority Headcount" or "Weighted Intensity." It cannot switch between them opportunistically.
  *   **The Case:** Tyranny of the Majority vs. Passionate Minorities. If you ignore intensity, you miss unrest. If you weight it, you privilege loud/wealthy groups.
  *   **Vindication:** You need a consistent policy, even if it's "we don't measure intensity."

  ***

  ### Part 3: Non-Negotiables vs. Theoretical Camp Preferences

  Here is where we separate journalistic integrity from political philosophy. Your newsroom needs to know which rules are about *truth* and which are about *ideology*.

  **Non-Negotiable (Journalistic Integrity)**
  *   **Auditability:** If you can't show your work, you can't print it.
  *   **Boundary Clarity:** "The People" is undefined without this.
  *   **Granularity:** Prevents logical fallacies (Mandates).
  *   **Causal Robustness:** Prevents self-fulfilling prophecies (lying by feedback loop).

  **Theoretical Camp Preferences (Ideological Choices)**
  *   **Information Sensitivity:**
      *   *Populist/Constructivist:* Reject this. The people's will is raw, even if misinformed.
      *   *Deliberative/Liberal:* Accept this. True will requires informed consent.
      *   *Verdict:* For a fact-checker, you must lean **Deliberative**. You cannot certify falsehoods as "wants" without qualification.
  *   **Intensity Weighting:**
      *   *Aggregative (Utilitarian):* Weight by intensity.
      *   *Majoritarian (One Person, One Vote):* Ignore intensity.
      *   *Verdict:* **Majoritarian** is safer for headlines. Intensity is hard to audit (see below).
  *   **Stability Threshold:**
      *   *Rikerian:* Skeptical. Stability is rare; don't claim "Will."
      *   *Pragmatist:* Good enough polling is fine.
      *   *Verdict:* **Pragmatist**, but with error bars.

  ***

  ### Part 4: Theory Scorecard

  How do the standard accounts fare against the Non-Negotiables?

  1.  **Raw Polling (Aggregative/Majoritarian):**
      *   *Passes:* Auditability, Boundary (usually).
      *   *Fails:* Stability (often single-shot), Causal Robustness (polls influence markets/politicians), Information Sensitivity.
      *   *Status:* Usable only with heavy caveats.

  2.  **Election Mandates:**
      *   *Passes:* Auditability (votes are counted), Boundary (voters).
      *   *Fails:* Granularity (bundled candidates), Information Sensitivity.
      *   *Status:* **Do not use** for specific policy attribution ("The People Want X" because President Y won).

  3.  **Deliberative Polling:**
      *   *Passes:* Stability, Information Sensitivity.
      *   *Fails:* Auditability (hard to scale/replicate), Boundary (who gets to deliberate?).
      *   *Status:* Gold standard for "Will," but too expensive for daily news.

  4.  **Populist-Constructivist:**
      *   *Passes:* None of the structural requirements.
      *   *Fails:* All. It defines the will *by* the claim.
      *   *Status:* **Incompatible** with fact-checking. This is rhetoric, not reporting.

  5.  **Counterfactual-Majority (Informed):**
      *   *Passes:* Information Sensitivity.
      *   *Fails:* Auditability (counterfactuals are speculative), Causal Robustness (who decides the counterfactual?).
      *   *Status:* Dangerous for headlines. Use in analysis, not attribution.

  ***

  ### Part 5: Impossibility Results & Confidence

  You asked me to flag subsets of desiderata that can't be jointly satisfied. You were right to be suspicious.

  **The Trilemma: Auditability + Bootstrap-Resistance + Intensity**
  *   **The Conflict:**
      *   To satisfy **Auditability**, you must publish the exact metric used to determine "The People's Will" (e.g., "We define 'Will' as 55% support in 3 consecutive polls").
      *   To satisfy **Intensity**, you need to measure passion, not just binary choice (e.g., "How strongly do you feel?").
      *   To satisfy **Bootstrap-Resistance**, the metric must not be gameable by the subjects.
      *   **The Failure:** If you publish the metric (Audit) and it includes Intensity, political actors will immediately game the intensity measure (e.g., mobilizing angry callers to skew "strength of feeling" metrics). This violates Bootstrap-Resistance. If you hide the metric to prevent gaming, you violate Auditability.
      *   **Resolution:** You must drop **Intensity** for headlines. Stick to binary majority preference for public claims. Intensity is for internal analysis.

  **The Rikerian Constraint (Agenda Independence)**
  *   **The Conflict:** Social Choice Theory (Arrow/Riker) proves that no aggregation method satisfies all fairness criteria (transitivity, non-dictatorship, independence of irrelevant alternatives).
  *   **The Failure:** You cannot mathematically guarantee a stable "Will" exists.
  *   **Resolution:** You must adopt a **Heuristic Standard**. Acknowledge in the style guide that "The People Want" is a shorthand for "A majority of [Boundary] expressed [Stability] preference in [Auditability Context]," not a metaphysical truth.

  **Confidence Assessment**
  *   **Overall Shape:** High Confidence (85%). The tension between Auditability and Bootstrap-Resistance is a known variant of Goodhart's Law in social science. The distinction between Non-Negotiables and Camp Preferences is standard applied ethics.
  *   **Least Sure Requirement:** **Causal Robustness (Bootstrap-Resistance).**
      *   *Why:* It is empirically difficult to prove that *our* headline didn't tip the scale. In a high-velocity media environment, total causal independence is impossible.
      *   *What would settle it:* We need a threshold of **Causal Lag**. Evidence showing that opinion shifts take $X$ hours/days to respond to media cues. If we can prove a time lag, we can claim robustness for opinions formed *before* that lag window. Without that data, this requirement is theoretically sound but operationally fuzzy.

  **The Single Requirement That Eliminates the Most Candidates:**
  **Auditability.**
  Most claims of "The People's Will" in the wild are based on anonymous sources, vague "groundswells," or bundled election results. Demanding that the procedure be reconstructible from the text kills 90% of standard political reporting shorthand. It forces you to either link the specific poll or kill the headline.

  **Final Advice for the Memo:**
  Don't try to solve the impossibility results. Acknowledge them. The memo should read: *"We know 'The People' is a fiction. Here are the rules for using that fiction without lying."* That's the only spec a newsroom will accept.
