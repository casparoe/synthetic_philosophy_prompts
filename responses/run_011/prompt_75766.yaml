prompt: |-
  Hey — putting on your social-choice-theorist-cum-political-theorist hat for this one, please. Situation: I've just moved onto the standards desk at a fact-checking outfit, and the single most complained-about category of headline we run is anything that attributes a view to "the people" — *Americans want a ceasefire*, *the public has turned on X*, *this is what the will of the people looks like*. Half the complaints are transparently motivated, but a chunk are actually interesting: they claim our wording smuggles in a thesis nobody on the desk could defend if you pinned them down. My editor has asked me for an internal memo on what it takes to license that kind of attribution, and before I write a word of the memo I want the spec, not the memo.

  So: write the desiderata. What does any account of the will of the people have to deliver before it's usable by us — which phenomena it has to make sense of, which cases it has to get right, which distinctions it can't collapse, which formal results it has to be consistent with? Give me the case or the consideration behind each requirement, because I have to defend these to a newsroom that wont take "philosophers say so" for an answer. A few I already suspect belong on the list and want you to either vindicate or throw out: it has to separate what people would say if you asked them from what they stably hold (the non-attitudes problem); it has to survive the fact that majority preferences can cycle, so whoever controls the agenda can manufacture a winner (Riker's line of attack); it has to handle the boundary problem, since who counts as "the people" is usually the very thing being fought over; it has to permit issue-by-issue verdicts instead of one global yes/no; it has to be auditable, meaning a reader could reconstruct from the story alone which procedure produced the attributed will; and — this is the one I most want pressed — it has to be bootstrap-resistant, so that our publishing "the people want X" can't itself be what makes X wanted, which would let the claim certify itself. Add whatever else is genuinely load-bearing that I've missed, and tell me which single requirement eliminates the most candidates.

  Then the part I actually care most about: mark which requirements are non-negotiable for our purposes and which are really just the taste of a particular camp — aggregative/majoritarian accounts, deliberative ones, referendum-based ones, counterfactual-majority views, and the populist-constructivist line where claiming to speak for the people is what constitutes the people in the first place. Score those briefly against your list, but don't let the scorecard eat the spec; the weight should stay on the criteria and their motivating cases. And flag any subset of your own desiderata that you think cant be jointly satisfied — auditability plus bootstrap-resistance plus sensitivity to intensity of preference looks suspicious to me — because if the requirements list turns out to be a kind of impossibility result in disguise, I'd much rather know that before writing the memo than after. Please brainstorm out loud first, dump the candidate requirements untidily, then prune and organise; don't hand me a polished list on the first pass. Finally, be honest about your own confidence: tell me how sure you are of the overall shape of the list, single out the one requirement — or the one joint-unsatisfiability claim — you're least sure of, and say what evidence or argument would settle it.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Role:** Social Choice Theorist / Political Theorist.
      *   **Task:** Create a *specification* (desiderata list) for licensing headlines that attribute views to "the people" (e.g., "Americans want X"). This is *not* the memo itself, but the criteria the memo will be based on.
      *   **Audience:** A fact-checking newsroom (skeptical, practical, won't accept "philosophers say so").
      *   **Key Constraints:**
          *   Must explain *why* each requirement matters (case/consideration).
          *   Must evaluate the user's suspected requirements (vindicate or reject).
          *   Must identify non-negotiables vs. theoretical camp preferences (aggregative, deliberative, populist, etc.).
          *   Must score theories against the list (briefly).
          *   Must flag impossibility results/incompatible requirements (e.g., Auditability + Bootstrap-Resistance + Intensity).
          *   **Format:** Brainstorm out loud first (untidy), then prune/organize.
          *   **Meta-Commentary:** Confidence level, least sure requirement, evidence needed to settle it.
      *   **Tone:** Intellectual, rigorous, practical, slightly conversational but authoritative.

  2.  **Deconstruct the User's Suspected Requirements:**
      *   *Stable vs. Non-attitudes:* Crucial. Polling noise vs. considered judgment.
      *   *Cycling/Majority Instability (Riker):* Crucial. Arrow's Theorem/Condorcet paradoxes.
      *   *Boundary Problem:* Who counts? (Citizens? Voters? Adults? Affected parties?). Crucial for "Americans."
      *   *Issue-by-Issue:* Avoid holism. People aren't monolithic.
      *   *Auditability:* Can the reader see the math/method? Essential for journalism.
      *   *Bootstrap-Resistance:* Prevent self-fulfilling prophecies (performative speech acts). Very important for media influence.

  3.  **Brainstorming/Untidy Dump (Mental or Scratchpad):**
      *   Need to handle intensity. A 51% mild preference vs. 49% passionate preference. Does "the people" care?
      *   Need to handle information asymmetry. If people want X but don't know X causes Y which they hate, do they *really* want X? (Informed preference).
      *   Time lag. Opinions change. When was the measurement taken?
      *   Framing effects. Question wording changes results.
      *   Representation vs. Direct Will. Are we talking about election mandates or raw sentiment?
      *   The "Silent Majority" problem. Non-response bias.
      *   Aggregation method. Mean? Median? Mode? Majority? Supermajority?
      *   Coherence. Can "the people" want A and not-A on different issues that imply each other?
      *   The "Manufactured Consent" angle. Media shapes opinion, then reports it. (Links to Bootstrap).
      *   Impossibility: Arrow's Theorem says no perfect voting system. Does that mean we can never say "the people want"? No, but we need to acknowledge limitations.
      *   Impossibility: Auditability + Privacy? No, that's different.
      *   Impossibility: Bootstrap + Influence. Journalism *influences*. Can it be neutral?
      *   User's specific worry: Auditability + Bootstrap + Intensity. If I publish the method (Audit), bad actors game it (Bootstrap failure). If I measure intensity, it's hard to audit objectively.

  4.  **Developing the Desiderata (The Spec):**
      *   *Requirement 1: Stability/Reflectiveness.* (User's non-attitudes). Case: Top-of-head polling vs. deliberative polling.
      *   *Requirement 2: Agenda Independence.* (User's Riker/Cycling). Case: Order of votes changes outcome.
      *   *Requirement 3: Boundary Clarity.* (User's Boundary). Case: Undocumented immigrants in "Americans"?
      *   *Requirement 4: Granularity.* (User's Issue-by-Issue). Case: Avoid "Mandate" fallacies.
      *   *Requirement 5: Procedural Transparency.* (User's Auditability). Case: Replicability.
      *   *Requirement 6: Causal Independence.* (User's Bootstrap). Case: Performative headlines.
      *   *Requirement 7: Information Sensitivity.* (New). Case: Misinformed majorities.
      *   *Requirement 8: Intensity Weighting?* (New/Contested). Case: Tyranny of the majority vs. passionate minorities.

  5.  **Classifying Requirements (Non-Negotiable vs. Theoretical):**
      *   *Non-Negotiable (Journalistic Integrity):* Auditability, Boundary Clarity, Granularity, Causal Independence (mostly), Stability (operationalized).
      *   *Theoretical Camps:* Intensity (Aggregative vs. Majoritarian), Information Sensitivity (Deliberative vs. Populist), Agenda Independence (Social Choice hardliners vs. Pragmatists).

  6.  **Scoring Theories:**
      *   *Raw Polling (Aggregative):* Fails Stability, Information, Bootstrap.
      *   *Deliberative:* Fails Auditability (hard to scale), Bootstrap (elite driven).
      *   *Election Mandates:* Fails Granularity, Boundary (turnout issues).
      *   *Populist/Constructivist:* Fails Bootstrap (by definition), Auditability.
      *   *Counterfactual (Informed):* Fails Auditability (speculative).

  7.  **Identifying Impossibilities/Tensions:**
      *   *The User's Hunch:* Auditability + Bootstrap-Resistance + Intensity.
      *   *Analysis:* If you publish exactly how you measure intensity (Audit), activists will game the metric to manufacture intensity (Bootstrap failure). If you hide the metric to prevent gaming, you lose Auditability.
      *   *Arrow's Theorem:* We can't satisfy all fairness criteria in aggregation. We must admit we are using a *heuristic*, not a mathematical truth.
      *   *The "Observer Effect":* Journalism *is* part of the system. Perfect Causal Independence is impossible. We need "Causal Robustness" instead.

  8.  **Drafting the Response (incorporating the "Brainstorm First" instruction):**
      *   *Section 1: The Brainstorm Dump.* Raw thoughts, connections, worries.
      *   *Section 2: The Pruned Spec.* Organized, justified requirements.
      *   *Section 3: Non-Negotiables vs. Camp Preferences.* Distinguishing journalism from political philosophy.
      *   *Section 4: Theory Scorecard.* Brief evaluation.
      *   *Section 5: Impossibility & Confidence.* Addressing the joint unsatisfiability and meta-commentary.

  9.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction:* Make sure I don't just say "Arrow's Theorem." Explain *why* it matters for a headline. (Headline implies transitivity; reality might not have it).
      *   *Correction:* The "Bootstrap" requirement is tricky. Journalism *does* shape opinion. The requirement shouldn't be "no influence," it should be "no *circular justification*." I need to refine that definition.
      *   *Correction:* Ensure I answer the specific prompt about "which single requirement eliminates the most candidates." (Likely Auditability or Bootstrap-Resistance).
      *   *Tone Check:* Keep it sharp. "Newsroom that won't take philosophers say so." Use examples like "Ceasefire" or "Tax Cuts."

  10. **Final Polish:** Check against all constraints in the prompt. (Brainstorm first? Yes. Desiderata with cases? Yes. Non-negotiables vs Camps? Yes. Scorecard? Yes. Impossibility flags? Yes. Confidence level? Yes.)

  *(Self-Correction on the "Brainstorm First" constraint)*: The prompt asks me to "brainstorm out loud first, dump the candidate requirements untidily, then prune and organise." I need to make sure the output *visibly* reflects this process, not just a hidden internal monologue. I will structure the response to explicitly show the "Raw Dump" phase before the "Organized Spec."

  *(Refining the Impossibility Claim)*: The user suspects Auditability + Bootstrap + Intensity. I think the deeper tension is Auditability + Causal Independence. If the method is known, it becomes a target for manipulation (Goodhart's Law). I should highlight this.

  *(Confidence Level)*: I should be honest. Social choice theory is full of impossibility results. I can't be 100% sure a perfect spec exists. I'll rate confidence high on the *problems*, medium on the *solutions*.

