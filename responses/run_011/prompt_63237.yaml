prompt: |-
  You're a decision theorist who also does practical ethics — think this through properly, and do whatever brainstorming you need to internally, but what you actually send me has to be exactly five numbered points, one or two sentences each, no intro and no wrap-up paragraph. I want a principle, not a survey of the literature.

  Background: I've been writing down my gut verdicts on sunk costs and they're a mess. Here they are.

  1. I pay $40 for a movie, twenty minutes in it's unbearable. Leave. The money's gone either way and anyone saying "but I already paid" is just compounding the loss.
  2. Same shape, $1,200 treadmill I've used twice. Get rid of it even at a big loss. I don't feel any differently about this one.
  3. Six years into a PhD whose thesis I no longer believe. Here I think staying one more year to finish is *not* obviously wrong — the six years definately count for something, which is exactly what I said they couldn't do in (1).
  4. Car with a blown head gasket that I just put a new transmission into last spring. I think "but I just did the transmission" is a real reason to keep the car rather than scrap it, and not a fallacy — though maybe only because the transmission isn't really sunk, it's sitting there in the car.
  5. Ten years of a friendship with someone who is, let's say, mildly bad for me. I think the ten years count in favour of staying.
  6. I promised my dad before he died I'd finish restoring his boat. The boat has no market value, the work costs money and weekends. I think I should keep going, and I think the eight years already in it make keeping going *stronger*, not weaker.
  7. A founder who's sunk his savings into a startup where the market clearly isn't there. Quit, full stop. "We've come too far to stop now" is precisely the error.
  8. A war and the line about not letting the dead have died in vain. I think this is usually horrific, and I also don't think it's *always* empty — and I don't like that about myself.

  The pair I can't reconcile is 3/5/6 against 7: structurally they look identical to me — past expenditure, bad future prospects — and I come out the opposite way.

  My tentative idea, which is probably too cute: past costs count when they *built* something — a relationship, a skill, a promise, a self who is the kind of person that finishes things, a transmission bolted into a car — and never when they merely *burned*, i.e. when all they do is measure how much you now stand to lose. Built vs. burned. I dont know whether that's a real distinction or just a slogan I like because it lets me keep (6).

  So: test that line against all eight cases, repair it or replace it, and give me the best principle you can that saves as many of my verdicts as possible. Please also tell me what it says about two cases I didn't think of, and be honest about which verdicts it can't accommodate. The five points I want: (1) the principle, stated precisely enough that I could apply it to a case I've never seen; (2) what it does with the 3/5/6 vs. 7 pair specifically; (3) your two new cases and their verdicts under the principle; (4) which of my eight I have to give up; (5) whether "built vs. burned" survives in any form or is a slogan I should drop.
