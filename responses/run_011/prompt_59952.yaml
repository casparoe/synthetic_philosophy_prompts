answer: |-
  **MEMORANDUM**

  **TO:** Research Integrity Officer; General Counsel
  **FROM:** Faculty Panel Member
  **DATE:** October 24, 2023
  **SUBJECT:** Voting Discrepancy in Case [Redacted] and Procedural Recommendations

  This memo addresses the voting discrepancy in the recent misconduct inquiry and recommends procedural adjustments for future panels. As you know, the panel's vote on the three required elements of misconduct yielded a majority for each element, yet the bottom-line vote on whether misconduct occurred resulted in a three-to-three tie. Under our Charter, a tie constitutes a dismissal. This creates a tension between the weight of the evidence and the procedural outcome.

  **Disposition of the Current Case**
  For this specific case, the panel must report a **No Finding**. We are bound by the Charter's requirement that a majority must agree on the bottom-line question to sustain a charge. To do otherwise would expose the university to legal challenge regarding procedural adherence. However, the written report must carefully explain this outcome to ensure the respondent does not feel exonerated by a technicality, nor the complainant feel ignored.

  The report should state that while a majority of the panel found that the evidence satisfied each individual criterion of the policy (the act, the intent, and the significance), the panel could not coalesce around a collective judgment that the threshold for misconduct was met. This distinction is vital. It acknowledges the seriousness of the evidence—which should remain on the respondent's record internally—while respecting the procedural rights that require consensus on the final sanction. We are not saying the conduct was acceptable; we are saying the specific procedural threshold for a formal violation was not cleared. This prevents the appearance of an "accident of arithmetic" by being transparent that the dismissal rests on the structure of the vote, not a lack of evidentiary support.

  **Recommendation for Future Voting Procedures**
  For future inquiries, I recommend we adopt an **Element-Based Tally** rather than the current Bottom-Line Tally. Under this method, if a majority votes "yes" on all required elements, a finding of misconduct is established, regardless of how members vote on the final conclusion.

  The strongest argument against this, raised by Panelist F, is that it may produce a finding that no single panelist actually supports. In this case, three members voted "no" on the conclusion. If we declare misconduct based on the element tally, we issue a finding that a minority of the panel explicitly rejected. F argues this undermines the legitimacy of the judgment.

  While F's concern is logically valid, it is outweighed by the need for policy consistency. Our policy defines misconduct as a conjunction of three conditions. If we rely on the Bottom-Line Tally, we allow panelists to import unstated criteria into their judgment. As we saw here, three members blocked the finding for three *different* reasons. Under a Bottom-Line rule, a minority can block a finding even if the majority agrees on every defined requirement of the policy. The Element-Based method ensures the panel judges the *policy*, not just the person. It prevents a scenario where the university's standards are met by the evidence, but no finding is issued because panelists disagree on which specific requirement failed. The "panel's judgment" is the aggregate of its judgments on the defined criteria, not necessarily the sum of its individual conclusions.

  **Procedural Loose Ends**
  Several ancillary issues require clarification to ensure the integrity of the report and the process.

  *Strategic Voting:* One member suggested switching their vote on an element to align the element tally with the bottom-line tally. The memo must advise against this. Votes must reflect the member's genuine assessment of the evidence. Adjusting a vote on a factual or technical element solely to resolve a procedural paradox corrupts the record. If the voting rules produce a paradox, we change the rules for next time; we do not falsify the judgment of the current panel to mask it.

  *Unified Report:* Counsel's request for a single unified finding is compatible with the Element-Based recommendation. We need not publish a spreadsheet of votes. The report can narrate the majority's reasoning on each element. For example: "The panel found that the image duplication occurred, was reckless, and departed from standards." It does not need to highlight that different minorities dissented on different points. The focus remains on the preponderance of evidence regarding the policy criteria.

  *Transparency to Respondent:* The respondent should be informed of the voting method used. Since these proceedings affect tenure and reputation, procedural transparency is a matter of due process. Explaining that the panel applied the policy elements sequentially helps the respondent understand exactly where the evidence was found sufficient or insufficient.

  *The Recused Member:* Finally, regarding the seventh recused member: one colleague argues we should consider how that member *would* have voted, as it would have resolved the tie. This view is incorrect. We must decide based on the votes actually cast. Speculating on hypothetical votes from a recused member introduces uncertainty and potential bias into the record. The validity of the panel's decision rests on the participating members. That the divergence between voting methods would have vanished with a seventh vote is irrelevant; the discrepancy exists in the actual panel, and that is what we must resolve.

  **Conclusion**
  We will report a No Finding for this case to comply with the Charter, but we will document the element majorities to reflect the evidentiary weight. Moving forward, we should adopt the Element-Based Tally to ensure our findings align with the policy definitions. This protects the university from inconsistent standards and ensures that findings are driven by the evidence against the criteria, rather than the aggregation of individual conclusions.

  Please let me know if you require further elaboration before Friday's meeting.
