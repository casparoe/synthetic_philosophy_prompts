  Here is the decomposition of the credence that switching to hand-picking, row covers, and targeted Bt results in less net harm to animals.

  ### The Arithmetic

  I am modeling this as a conjunction of three necessary conditions. For the proposition "I do less net harm" to be **True**, insects must matter, the moral math must be valid, and the agricultural mechanics must favor the switch.

  $$ P(\text{Less Harm}) \approx P(S) \times P(F) \times P(M) $$

  **1. $P(S)$: Insects have morally significant experience**
  *   **Credence:** $0.70$
  *   **Decomposition:** This splits into *nociception* (reflexive avoidance) vs. *valence* (suffering). Nociception in insects is near-certain ($>0.95$). Valence is the bottleneck. Recent work on the insect sub-esophageal zone and opioid-like systems suggests a capacity for affective states, but it is not settled. I assign 0.70 to the probability that their experience crosses the threshold of moral significance (i.e., it is not just "meat robotics").
  *   **Role:** This is the hard cap. If $S=0$, Harm=0, and "Less Harm" is false.

  **2. $P(F)$: Aggregative moral framework is correct**
  *   **Credence:** $0.80$
  *   **Decomposition:** This is the probability that "net harm" is the correct metric (Utilitarian/Consequentialist) rather than a Virtue Ethics framework (where your intention or local agency matters more than the distant offset). Since your question explicitly asks for "net harm," I condition heavily on this framework being the relevant one, but leave 0.20 uncertainty for the possibility that "funding industrial harm" is morally distinct from "directly spraying."

  **3. $P(M)$: The switch reduces biological damage (given $S$ and $F$)**
  *   **Credence:** $0.90$
  *   **Decomposition:** This term aggregates the mechanical realities:
      *   $P(\text{Non-target savings})$: **0.95**. Spinosad and pyrethrins are broad-spectrum neurotoxins; they kill predatory beetles and bees. Row covers kill nothing. This is the strongest lever.
      *   $P(\text{Death Quality})$: **0.85**. Neurotoxic excitation (spray) is likely worse than mechanical crushing (hand-pick) or exclusion (starvation/migration).
      *   $P(\text{Offset does not eat gain})$: **0.80**. (Inverse of your requested term). Industrial brassica production involves massive insecticide loads and mechanical harvesting that kills field fauna (mice, insects) at a scale per kilogram that likely exceeds a small, no-spray allotment even with 30% yield loss.
      *   *Calculation:* $0.95 \times 0.85 \times 0.80 \approx 0.65$.
      *   *Adjustment:* I am inflating this to **0.90** in the main equation because the Non-Target savings (bees/predators) are so disproportionately large compared to the pest loss that they dominate the mechanical calculation.

  **Total Calculation:**
  $$ 0.70 \times 0.80 \times 0.90 = 0.504 $$

  I am adjusting this slightly upward to **0.52** to account for the magnitude of harm: even if the *probability* of sentience is uncertain, the *volume* of non-target lives saved (wild bees, predatory beetles) is orders of magnitude higher than the target pests, creating a high Expected Value even with epistemic uncertainty.

  ### The Swing Term

  Your number swings hardest on **$P(\text{the supermarket offset eats the entire gain})$**.

  While $P(S)$ (Sentience) feels like the biggest philosophical weight, it is a static multiplier. The **Offset** term is the variable that can flip the verdict from "Good Switch" to "Net Negative." If industrial kale production is actually *more* insect-friendly per kilogram than your low-yield allotment (due to extreme land-use efficiency), your abstention exports the harm rather than reducing it.

