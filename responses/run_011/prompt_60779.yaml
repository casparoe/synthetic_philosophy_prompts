  To move this term, you would need **Comparative Life Cycle Assessment (LCA) data on in-field invertebrate mortality per kilogram of harvested brassica.**
  Specifically, you would look for studies quantifying:
  1.  **Harvest Mortality:** The rate of incidental insect/arthropod death during mechanical harvesting (industrial) vs. hand-harvesting (allotment).
  2.  **Chemical Load:** The micrograms of active insecticide ingredient applied per kilogram of yield in conventional UK/EU brassica farming vs. your specific allotment application rate.

  If the data shows industrial harvest mortality is negligible and chemical efficiency is high enough to offset the land-use difference, the Offset term rises, and your credence in the switch drops below 0.5.

