      *   *Selection:* Focus on the asymmetry of causation and the structure of rational choice. Space is navigable in all directions; time is not. This ontological difference justifies a evaluative difference. Also, challenge the notion that "impartiality" requires ignoring time. Impartiality applies to *persons*, not necessarily to *times* relative to a choosing agent.

