      *Refining for punchiness and character voice:* Make it sound more like an economist-philosopher (e.g., similar to Tooley or perhaps a stylized version of someone like Richard Posner or a specific theorist who defends this, though the prompt implies a specific philosophical stance). Let's ensure the "ontological" argument is clear.

      *Revised Draft:*
      Your spatial analogy fails because it treats time as merely another coordinate in a static block, whereas ethics is the domain of agents who act within a flow. Spatial distance separates two co-existing points; temporal distance separates the actual from the not-yet-actual. When I discount a benefit to the east, I disregard something that is real now. When I discount a benefit in the future, I am weighing the present actuality against a future possibility, even if that possibility is certain to materialize. The ontological status of the benefit differs. The present welfare is a fact; the future welfare is a truth about a future fact. It is ethically permissible to prioritize the fact over the truth about the fact, not because the future person matters less, but because the *good* itself is less immediate in the structure of reality.

