      Furthermore, impartiality governs the treatment of persons, not the treatment of moments. To demand we value a future moment equally with a present one is to demand we adopt a "view from nowhere" that no temporal agent can occupy. Ethics is a practice undertaken by beings who live through time, not outside it. A positive pure rate of time preference is simply the ethical inscription of this temporality. It asserts that the present claimant has a priority born of actuality, not merely proximity. To deny this is not to be more moral; it is to be less human, to pretend our agency is not bound by the arrow of time.

