  3.  **Formulate the Argument:**
      *   The user's analogy (space vs. time) is the core challenge. I need to break this analogy.
      *   Why is time different from space?
      *   *Idea 1:* Causality and Agency. We act *now* to affect the future. We cannot act to affect the past. The asymmetry of causation matters for valuation.
      *   *Idea 2:* The nature of preference. Preferences are held by existing agents. The relation between a present valuer and a future benefit is inherently different than between a present valuer and a spatially distant benefit.
