  **Ticket #89201 | Product: SocialChoice Unit v4.2 | Status: Closed**
  **Customer: Oakhaven Planning Commission | Agent: Support Tier 1 & 2**

  **[2023-10-01 09:14] Oakhaven Planning:**
  We purchased the Unit to resolve the zoning variance on 4th Street. We input the preferences of the nine affected households and the developer. The Unit ranked the proposal strictly better, despite the developer gaining $1.2M and each household losing roughly $15k in property value. The display reads NET POSITIVE. We need a setting that prioritizes the worst-off household, or at least a fairness slider. The current output is unacceptable.

  **[2023-10-01 14:22] Agent K. Miller (Tier 1):**
  Thank you for contacting Support. The behavior you describe is functioning within Base Model parameters. The Unit aggregates individual utility functions into a social ranking via weighted sum. Base licensing includes the aggregation engine only; it does not prescribe weights. You are seeing the raw output of Pareto compliance without distributional constraints. To apply equal weights, you must purchase the Impartial Observer Module. This module applies an onboarding stance where the observer assumes an equal probability of occupying any individual's position. Please note this is a configuration setting, not a moral assertion.

  **[2023-10-02 10:05] Oakhaven Planning:**
  We purchased the Module. The result is unchanged. We do not want a sum. We want the device to reject proposals where the minimum utility decreases, regardless of the total. Why is the Min-Utility mode greyed out in the settings panel?

  **[2023-10-02 16:45] Agent R. Vance (Tier 2):**
  Min-Utility mode is disabled by design. Enabling a preference for distribution shape over aggregate sum violates the Independence Axiom. If enabled, the Unit will generate intransitive rankings when presented with compound prospects. Specifically, it would rank A over B in isolation, but B over A when both are combined with a common third outcome. This causes a logic loop in the decision core. Error Code 409-Conflict will trigger, and the Unit will lock until hard reset. The math requires linearity to maintain coherence.

  **[2023-10-03 09:30] Oakhaven Planning:**
  We are stuck at onboarding. The Module requires all users to agree on the probabilities of states (e.g., likelihood of traffic increase vs. noise). Commissioner Halloway and Commissioner Prins cannot agree on the risk profile. Additionally, Commissioner Halloway consistently chooses Option A over B in Scenario 1, but B over A in Scenario 2, despite the outcomes being mathematically identical framed differently. The Unit flags him as Noise. Can we override this?

  **[2023-10-03 13:15] Agent R. Vance (Tier 2):**
  Consensus on state probabilities is a hard requirement for the Observer stance. Regarding Commissioner Halloway: The Unit detects axiom violations in his preference ordering. Users who violate expected utility consistency are classified as Out of Domain. The system will handle his input as stochastic noise to preserve the integrity of the aggregate function. You may proceed with the remaining commissioners.

  **[2023-10-04 11:00] Oakhaven Planning:**
  We proceeded. A new issue: Neighbor Henderson derives visible utility from Neighbor Gable's distress. When Gable's utility drops, Henderson's rises. The Unit counts Henderson's gain as a positive contribution to the sum. We tried to set Henderson's weight to zero. The system rejects this. License Agreement Section 4.1 states weights must be strictly positive. Also, Known Issue #882 notes that shifting a user's utility zero-point changes no ranking while population is fixed, but warns this will break in the Variable Population Update when accounting for non-existent entities. We need to zero out sadistic utility now.

  **[2023-10-04 15:50] Agent R. Vance (Tier 2):**
  Confirmed. The Unit cannot distinguish between intrinsic utility and utility sourced from another's misery; both enter the function as positive values. Lowering Henderson's weight below the positive threshold violates the Strict Positivity clause of your license. Zeroing a user effectively removes them from the population, which triggers the Variable Population error regarding utility zero-points for non-existent entities. This is scheduled for patch v5.0. Currently, there is no remediation.

  **[2023-10-05 09:10] Oakhaven Planning:**
  We are returning the Unit. Issue a refund.

  **[2023-10-05 17:00] Agent K. Miller (Tier 1):**
  Refunds are contingent on the Requester passing the Coherence Check. This ensures the requestor's preference for a refund over keeping the Unit is stable across framing scenarios. We administered the check. Your responses indicated intransitive preferences regarding the refund terms (Option A preferred to B, B to C, C to A). You have failed the coherence check. Ticket Closed.
