  A woman shook, swallowing stimulants. "Yield climbs if the baseline drops."
  The total city yield ticker on the building wall ticked upward. Green numbers. Record high.
  A child coughed in the line. The father checked his assay card. His number was high. He looked proud. He looked dying.
  "More enzyme coming?"
  "No. Fixed quantity."
  "Then why do we score higher?"
  "To claim more."
  The city starved to feed the sum. The air smelled of sickness and victory.

  5.
  Boardroom. The Commissioners sat around the polished table. The total yield report lay before them.
  "If we allocate by score, Sarr takes eighty percent."
  "The rest starve."
  "If we ignore scores, we breach Charter."
  "The Office dissolves. Precedent breaks."
  Elara looked at the window. The city lights were dimmer than last year. Power savings. Malnutrition.
  "We keep the Charter," she said.
  "And the city?"
  "The city deteriorates. The numbers remain valid."
  She signed the allocation order. Odile got the enzyme. The others got scraps.
  "We wanted to keep them safe," a Commissioner said. His hand trembled.
  "We kept the Ledger."
  They sealed the envelope. The ink was dry. The city outside went dark, one block at a time.
