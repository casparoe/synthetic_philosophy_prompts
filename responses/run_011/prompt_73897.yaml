prompt: |-
  I have been asked to sit on the jury of a short-fiction prize — one of those regional awards that carries a modest sum and an unreasonable amount of local feeling. Three jurors, four hundred stories, one month. My colleague the critic proposes a rubric: point of view handled without slippage, images that labour rather than decorate, an ending earned rather than merely arrived at, and six other criteria besides, each scored one to five, the entries ranked by total. The third juror, a poet, will have none of it; she says she knows within a page and a half whether a story is alive, and that scoring craft is a reliable way to reward the diligent and bury the gifted.

  I see the force of both and trust neither. The rubric will favour the flawless and the hollow — I have read dozens of stories that satisfy every such criterion and leave no trace whatever. But the poet's method is unfalsifiable, unarguable, and, if the prize means to survive a complaint from the runner-up's camp, indefensible in public. There is also the arithmetic: four hundred stories scored on nine criteria means reading each of them three times over, which none of us has the year to do, whereas her instinct costs nothing but attention. And there is a competence problem I have not confessed to them. I write novels, long and slow and in the third person; two of the strongest stories in last year's pile were in forms I cannot assess from the inside — one entirely in dialogue, one in a compressed second person — and had I been scoring craft, I should have marked them down.

  Finally, a matter that disqualifies me from designing anything. Eleven years ago I won a prize of exactly this kind by writing a story I knew the judges would like; I had read their criticism and built the thing to specification, and I did not enjoy writing it and have not been able to think about it since. If the rubric is published, as the critic wants, the writing programmes will have it within a week and next year's pile will be four hundred competent imitations of the rubric. If nothing is published, instinct rules, and instinct can be flattered, lobbied, and dressed.

  Tell me where each of my colleagues is right and where each is missing something, what procedure three exhausted readers could actually carry out, how much of it ought to be said aloud — and whether my own disqualification is genuine or merely convenient.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Role:** The user is a juror for a regional short-fiction prize (3 jurors, 400 stories, 1 month).
      *   **Conflict:**
          *   Juror 1 (The Critic): Wants a detailed rubric (9 criteria, 1-5 scale).
          *   Juror 2 (The Poet): Wants pure instinct ("know within a page and a half").
          *   User (The Novelist): Sees flaws in both, has personal baggage (won a similar prize by gaming the system 11 years ago), and has specific insecurities about assessing certain forms.
      *   **Tasks:**
          1.  Evaluate where the Critic is right/wrong.
          2.  Evaluate where the Poet is right/wrong.
          3.  Propose a feasible procedure for three exhausted readers.
          4.  Advise on transparency (what should be said aloud/published).
          5.  Address the User's "disqualification" (is it genuine or convenient?).
      *   **Tone:** The prompt is written in a sophisticated, literary, slightly weary, and introspective style. The response should match this tone (thoughtful, nuanced, empathetic, authoritative but not prescriptive).

  2.  **Deconstruct the Colleagues:**
      *   **The Critic:**
          *   *Right:* Accountability, defensibility, consistency, mitigates bias (theoretically), helps with the sheer volume (breaks it down).
          *   *Wrong:* Reduces art to accounting, rewards technical competence over vitality, encourages gaming the system (as the User knows), ignores the "unknowable" quality of great art.
      *   **The Poet:**
          *   *Right:* Recognizes "life" in writing, efficient (saves time), honors the visceral impact of fiction, avoids stifling innovation.
          *   *Wrong:* Subjective, unarguable, prone to bias/fatigue, hard to defend publicly, risks missing slow-burn stories that don't hook in 1.5 pages.

  3.  **Deconstruct the User (The Novelist):**
      *   *Insecurities:* Form bias (novelist vs. experimental short story), past guilt (gaming a prize).
      *   *Insight:* Sees the systemic consequences (rubrics create clones; instinct creates chaos).
      *   *Disqualification:* Is it genuine? It's a conflict of interest regarding *how* to judge, not necessarily *who* wins. It's a moral burden, not a legal bar.

  4.  **Develop a Procedure (The "Third Way"):**
      *   400 stories in 30 days = ~13 stories/day/juror. That's heavy.
      *   Need a filtering system.
      *   *Round 1:* Triage. Yes/No/Maybe. Fast. (Poet's instinct here).
      *   *Round 2:* The Longlist. Read fully. Discuss. (Critic's rigor here, but qualitative).
      *   *Round 3:* The Shortlist. Deep dive.
      *   *Consensus:* Must be able to articulate *why*, not just *score*.
      *   *Blindness:* Ensure anonymity is strict.

  5.  **Address Transparency:**
      *   Publish the *values*, not the *math*.
      *   Explain the process generally (triage, discussion) without releasing the scoring sheet.
      *   Prepare a statement for the winner that speaks to the specific merits of *that* story, not the general rules.

  6.  **Address the "Disqualification":**
      *   It's not a disqualification; it's a qualification.
      *   The guilt shows ethical awareness.
      *   The bias against form is a limitation to be managed, not a bar to entry.
      *   The past win is a lesson, not a stain.

  7.  **Drafting - Section by Section (incorporating the tone):**

      *   *Introduction:* Acknowledge the weight of the task. Validate the user's position.
      *   *The Critic:* Acknowledge the need for structure but highlight the danger of "death by checklist."
      *   *The Poet:* Acknowledge the truth of "aliveness" but highlight the danger of caprice and fatigue.
      *   *The Procedure:* Propose a hybrid model. Triage -> Longlist -> Shortlist. Emphasize *discussion* over *scoring*.
      *   *Transparency:* Be honest about values, opaque about mechanics.
      *   *The User's Guilt:* Reframe the past. It's wisdom now.
      *   *Conclusion:* A closing thought on the purpose of prizes.

  8.  **Refining the Tone:**
      *   Use metaphors (architecture vs. gardening, accounting vs. alchemy).
      *   Keep sentences varied but polished.
      *   Avoid corporate speak; use literary language.
      *   *Self-Correction during drafting:* Make sure I don't just say "compromise." The compromise needs to be specific to the 400-story load. The "1.5 pages" rule by the poet is actually a useful triage tool, even if not the final decider. The Critic's rubric is useful for the final 10, not the first 400.

  9.  **Final Review against Constraints:**
      *   Did I answer all five parts of the prompt? Yes.
      *   Is the tone appropriate? Yes.
      *   Is the advice practical? Yes (400 stories is a lot, triage is necessary).

  10. **Final Polish:** (Checking for flow and impact). *Ensure the distinction between "gaming the system" and "understanding the form" is clear in the advice to the user.*

  *(Self-Correction Note)*: I need to be careful not to validate the Poet's "page and a half" rule too much. Some stories are slow burns. I should suggest that the triage allows for "slow start but promising" to pass through.

  *(Refining the "Disqualification" point)*: The user feels disqualified because they gamed a system. I need to tell them that knowing how the game is played makes them better at spotting the genuine article now, provided they don't reward the gaming again.

  *(Final thought on the Rubric)*: The Critic wants to publish the rubric. This is the dangerous part. I must advise against publishing the specific scoring matrix.

  Okay, ready to write.cw
answer: |-
  You are in the position of the translator between two languages that claim to describe the same world but use different alphabets. The critic speaks the language of architecture; the poet speaks the language of weather. Both are describing the house, but one looks at the load-bearing walls and the other at the light in the kitchen. Your task is not to choose a language, but to ensure the house stands and feels like a home.

  Here is where your colleagues stand, and where the ground falls away beneath them.

  ### The Critic: The Illusion of Objectivity
  The critic is right that a prize is a public trust. When public money or institutional reputation is involved, caprice is a liability. A rubric provides a shield against accusations of bias, cronyism, or fatigue. It creates an audit trail. If a writer complains, you can show the scores. It also forces the jurors to engage with stories they dislike; you may hate a first-person present tense, but if the rubric demands you score "point of view consistency," you must read closely enough to judge it.

  However, the critic is wrong to believe that art is cumulative. A story is not a sandwich where nine ingredients of quality equal a nourishing meal. A story can have flawless point of view, earned endings, and labouring images, and still be dead on the page. By publishing the rubric, the critic invites the very sterilization you fear. Writing programmes are already factories for competent mediocrity; handing them the blueprint for "prize-winning" ensures that next year's pile will not be four hundred stories, but one story written four hundred times. The rubric measures craft, but prizes should reward vision. Craft is the price of entry; vision is the winner.

  ### The Poet: The Tyranny of Instinct
  The poet is right that life cannot be measured with a ruler. The "page and a half" test is a recognition of voice, which is the one thing a rubric cannot capture. Voice is either there or it isn't. Her method respects the reader's experience; if she is bored, the story has failed, regardless of its structural integrity. Her method also acknowledges the reality of the workload. Four hundred stories read three times each is a fantasy. Something must give.

  But the poet is wrong to trust her fatigue. Instinct is easily corrupted by hunger, headache, or the lingering taste of the previous story. A "page and a half" rejection kills the slow-burn story, the one that requires the reader to adjust their eyes to the dark before the shapes appear. Furthermore, "aliveness" is subjective. Without a framework for discussion, the deliberation room becomes a battle of wills where the loudest voice defines "life." If the prize is challenged, "I felt it" is not a defence. It is a confession of whim.

  ### A Procedure for the Exhausted
  You cannot read four hundred stories three times. You must not read the final ten only once. You need a funnel, not a scale.

  1.  **The Triage (The Poet's Domain):** Each juror reads the 400 entries alone. You do not score them. You sort them into three piles: *No*, *Maybe*, and *Yes*. You are allowed to stop reading a story if it fails to engage by page five (not page and a half; give it room to breathe). This respects your time and the poet's instinct.
  2.  **The Longlist (The Intersection):** Any story that receives a *Yes* from at least two jurors moves to the Longlist. Any story with one *Yes* and two *Maybes* is discussed briefly to see if it can be salvaged. This ensures that a story needs at least some consensus to survive, filtering out pure idiosyncrasy.
  3.  **The Shortlist (The Critic's Domain):** Once you are down to the final twenty, you read them all fully. Now, you use the critic's criteria, not as scores, but as discussion prompts. Does the ending feel earned? Do the images labour? Use the vocabulary to articulate *why* the story works, not to number it.
  4.  **The Winner:** The final choice is made by consensus, not vote. If you cannot agree, you keep reading the top three until you do.

  ### On Transparency
  Do not publish the rubric. To publish a scoring sheet is to invite the next generation to write to the test. Instead, publish a **Statement of Values**.

  Write a paragraph that says: *We looked for stories that took risks with form, where the language was essential rather than decorative, and where the ending resonated beyond the final line.* This tells writers what you value without giving them the engineering specs. It protects the prize from accusations of secrecy while protecting the art from being gamified. When the winner is announced, the jury statement should focus entirely on the specific merits of that story, not the general process.

  ### On Your Disqualification
  Your disqualification is not genuine; it is a form of expertise.

  Eleven years ago, you wrote to a specification. You know what that feels like: the hollowness of a story built to please. This does not disqualify you; it inoculates you. You are the only person in the room who knows exactly what a "rubric story" looks like from the inside. When you see one in this year's pile—one that ticks every box of the critic's proposed nine criteria but leaves you cold—you will be the one to identify it as a mimic.

  Your insecurity about form (dialogue, second person) is a limitation, but not a bar. It simply means you must listen more closely to the poet and the critic when those stories arise. You do not need to know how to build a engine to know when it runs smooth. If a story in second person moves you, it has succeeded, regardless of your inability to write one.

  The guilt you carry is useful. It keeps you honest. But do not confuse the sin of the past (writing for the prize) with the duty of the present (judging for the art). You are not disqualified by your history; you are qualified by your memory of it.

  ### The Verdict
  Adopt the funnel. Reject the published scores. Embrace your past as a warning system. The critic wants to build a machine; the poet wants to consult a oracle. You must build a room where three tired humans can talk honestly about why a story made them feel less alone. That is the only metric that survives the month.
