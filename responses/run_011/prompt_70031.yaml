answer: |-
  **The Purpose of the Postmortem: A Verdict and Procedure**

  Your team's stalemate mirrors a classic debate in the philosophy of history. Your Reliability Engineer (RE) advocates for the **Covering Law Model**, associated with Carl Hempel. This posits that an event is explained only when subsumed under a universal law (if conditions *C*, then event *E*). Your Support Lead (SL) advocates for **Narrative Explanation**, associated with William Dray, arguing that events are explained by making the sequence of actions intelligible within their specific context.

  In complex socio-technical systems, the RE is mistaken. Software ecosystems are non-linear; universal laws rarely hold because context dictates outcome. A rule like 'always test changes' is vacuous because it is always true and never specific enough to prevent failure. The SL is closer to the truth: explanation resides in the narrative. However, the RE is correct that the document must drive utility. Therefore, the verdict is this: **The document is a Narrative designed to reveal Local Patterns, not Universal Laws.** The procedure below prioritises the SL's view on explanation but incorporates the RE's demand for utility by testing actions for specificity rather than generality.

  **Engineering vs. History: Where the Comparison Breaks Down**
  Historians deal with unique, unrepeatable events based on subjective testimony. You deal with recurring events, objective logs, and commercial constraints.
  1.  **Recurrence:** Unlike battles, outages recur. This allows you to demand *actionability* even if you reject *universal laws*.
  2.  **Experimentation:** You can run chaos tests. A claim is valid if you can simulate it; a historian cannot simulate Waterloo.
  3.  **Cost:** History seeks truth; you seek risk reduction within budget. A lesson is only valid if the cost of prevention is lower than the cost of recurrence.

  These differences mean your procedure must be stricter on *actionability* than a historian's, but more forgiving on *generality*.

  ***

  ### The Postmortem Decision Procedure

  **Timebox:** 60 minutes. **Operator:** Facilitator.

  **Phase 1: Narrative Integrity (The Explanation)**
  *Goal: Ensure the story explains the event, not just describes it.*

  1.  **Question:** Does the timeline show *why* each action made sense to the actor at that moment?
      *   **Pass:** "Engineer X skipped step Y because alert Z had fired falsely three times previously."
      *   **Fail:** "Engineer X failed to follow procedure." (This assigns blame, not cause).
  2.  **Question:** If we remove the 'human error' mentioned, does the story still hold?
      *   **Pass:** Yes. The system allowed the error to become an outage.
      *   **Fail:** No. The story relies on 'mistake' as the stopping point.
      *   **Action:** If Fail, rewrite until the system design is the protagonist, not the person.

  **Phase 2: The Generality Test (The Lesson)**
  *Goal: Distinguish Local Patterns from Vacuous Laws.*

  3.  **Question:** Does the proposed lesson apply to systems we do not own?
      *   **Pass:** No. It references specific architecture we control.
      *   **Fail:** Yes. (e.g., "Communications must be clear").
      *   **Action:** If Yes, reject as vacuous. Narrow scope to our stack.
  4.  **Question (The Counterfactual Test):** Can we construct a plausible scenario where this lesson holds true, but the incident *still* happens?
      *   **Pass:** Yes. (e.g., Lesson: "Monitor CPU". Incident: Database lockout. CPU was fine).
      *   **Fail:** No. If the lesson were active, this specific incident would be impossible.
      *   **Action:** If Pass, the lesson is too broad. Tighten until it blocks *this* path.
  5.  **Question:** Is the lesson a description of this incident with the serial numbers filed off?
      *   **Test:** Replace specific terms (Service A, Database B) with generics (Service, Database). Does the sentence become trivial?
      *   **Fail:** "Ensure databases do not lock." (Trivial).
      *   **Pass:** "Ensure idempotency keys are propagated across retry boundaries in Payment Service." (Specific).

  **Phase 3: Stop Conditions and Handoffs**
  *Goal: Know when to quit or escalate.*

  6.  **Stop Condition:** If Phase 2 yields no general claim, is there a specific actionable change?
      *   **Yes:** Publish the Narrative + Action. No general lesson required.
      *   **No:** Escalate to Head of Platform. Do not publish vacuous text.
  7.  **Handoff (Values):** If the narrative implicates a named individual's competence rather than system design, or if the lesson requires budget the team cannot afford, stop.
      *   **Action:** Hand to Head of Platform. This is a values/resourcing decision, not a factual one.

  **Flagged Judgement Calls**
  *   **Severity of 'Vacuous':** Deciding if a lesson is 'too broad' is subjective. Facilitators must calibrate using the 'Counterfactual Test' (Step 4).
  *   **Blame vs. Cause:** Distinguishing 'they were tired' (cause) from 'they were negligent' (blame) requires cultural context. If unsure, hand off.

  ***

  ### Application to Cases

  **Case A: Configuration Change & Retry Storm**
  *   **Narrative:** The config change was valid; the downstream lack of idempotency was the trap. The narrative explains why the change looked safe initially.
  *   **Generality Test:** Proposed lesson: "Ensure downstream services are idempotent."
      *   *Counterfactual:* If downstream was idempotent, would this outage happen? No.
      *   *Serial Numbers:* Is this just "fix the bug"? No, it identifies a class of failure (retry storms on non-idempotent endpoints).
  *   **Verdict:** **Pass.** This supports a genuine local pattern. The lesson is: "Retry mechanisms must verify idempotency guarantees before deployment." This travels to other services but remains specific to our architecture.

  **Case B: Certificate Expiry & Alert Fatigue**
  *   **Narrative:** The engineer ignored the alert because of prior false positives. The narrative explains the rationality of inaction.
  *   **Generality Test:** Proposed lesson: "Improve alert quality."
      *   *Counterfactual:* If alert quality was improved, would this happen? Maybe not this one, but alert fatigue is systemic.
      *   *Serial Numbers:* "Improve alert quality" is vacuous. It is a restatement of "alerts should work."
      *   *Revision:* "Alerts firing falsely >3 times in 30 days must auto-snooze."
  *   **Verdict:** **Partial Pass.** The general claim "Alerts need trust" is false (SL is right). The lesson must be a specific policy change derived from the story, not a law about trust. The narrative *is* the explanation; the action is the policy tweak.

  **Case C: Third-Party Vendor API**
  *   **Narrative:** Vendor changed behaviour undocumented. We lacked detection.
  *   **Generality Test:** Proposed lesson: "Vendor dependencies are risky."
      *   *Counterfactual:* Even if we accept vendors are risky, this incident happens unless we detect it. The lesson is vacuous.
      *   *Serial Numbers:* This is purely "Vendor broke thing."
  *   **Verdict:** **Fail on Law, Pass on Narrative.** There is no general law here because we cannot control the vendor. The honest output is a narrative of detection latency and a specific action (e.g., "Implement synthetic monitoring on Vendor X's endpoint").

  ***

  ### The Argument for Case C (The CTO Challenge)

  Your CTO wants a general lesson about vendor dependencies. The procedure says there is none. Here is the argument you make in the review meeting:

  "Publishing 'Vendor dependencies are risky' as a lesson is intellectually dishonest. We already know this. It is a constant, not a variable. It does not help us anticipate the *next* incident because it offers no new information. If we publish it, we train engineers to ignore our lessons as platitudes.

  The Support Lead is correct: the value here is the narrative. We must document exactly *how long* it took us to detect the vendor's change and *why* our monitoring missed it. The lesson is not about the vendor; it is about our *visibility* into the vendor. The actionable claim is: 'We require synthetic monitoring for all critical vendor write-paths.' That is a testable, falsifiable claim we can implement. Anything broader is storytime dressed as engineering."

  ***

  ### Final Verdict

  Your **Support Lead is closer to the right** about what the document is for.

  The Reliability Engineer seeks comfort in laws that complex systems do not obey. In seeking universal claims, they produce vacuous truths that engineers ignore. The Support Lead understands that in complex systems, cause is contextual. The narrative *is* the explanation because it reconstructs the local rationality of the failure.

  However, the Support Lead risks producing interesting stories without change. Therefore, the procedure reflects the Support Lead's ontology (Narrative is King) but enforces the Reliability Engineer's ethic (Utility is Mandatory). We do not demand universal laws; we demand specific, actionable patterns derived from the story.

  Adopt the procedure above. It forces facilitators to reject vacuous laws (satisfying the RE's desire for rigour) while承认 that the narrative carries the explanatory weight (validating the SL's insight). This stops the production of "serial numbers filed off" documents and ensures that when a general claim is made, it is robust enough to survive the counterfactual test. Your engineers will read them because they will finally tell the truth about how the system actually behaves, rather than how we wish it behaved.
