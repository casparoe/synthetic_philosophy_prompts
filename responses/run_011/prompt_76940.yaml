answer: |-
  **Project Title:** The Fixed-Point Self: Normativity and Feedback in the Centre of Narrative Gravity

  **Proposal**

  Daniel Dennett's characterization of the self as a "centre of narrative gravity" is one of the most cited metaphors in recent philosophy of mind, yet it remains philosophically underworked. The standard reading treats the centre as a useful fiction: an abstractum posited to organize the concrete distribution of behaviour, utterance, and memory. Everyone quotes the line and stops. My project starts where the analogy actually begins to fray. There are three distinct components inside the metaphor that are routinely conflated: the *distribution* (the actual pattern of bodily and cognitive events), the *centre* (the posit itself), and the *calculation* (the function assigning the centre to the distribution).

  In physics, the calculation runs one way: the mass distribution determines the centre of gravity, and the centre exerts no causal power back on the mass. In the case of the self, the calculation feeds back. Telling the story alters the behaviour the story was supposed to summarize. The narrative posits a centre, the subject adopts that centre, and the distribution shifts to align with it. This makes the self not a computed abstractum, but a fixed-point structure.

  The core question driving this research year is whether we can derive a genuinely normative notion of a *mis-centred* self from this feedback loop without smuggling back the inner auditor Dennett is trying to eliminate. If the centre is merely a posit, how can it be wrong? If it is wrong, wrong relative to what? If the distribution shifts to meet the narrative, when does that shift count as a correction and when as a distortion?

  **Critique of Existing Frameworks**

  Current approaches leave this normative gap unbridged. The narrative-identity crowd (e.g., Schechtman, MacIntyre) impose constraints on the narrative—it must be coherent, articulable, and fit the facts. But these constraints bite on content, not on the structural relationship between centre and distribution. A runaway narrative can satisfy coherence and factuality constraints beautifully while still drifting from the distribution it summarizes; a confabulator can be perfectly coherent. The deflationary side collapses the gap entirely: if the narrative constitutes the self, there is no distance between seeming and being, so the concept of a "mis-centred" self becomes unintelligible. They cannot describe the memoir that nobody who knew the author recognizes as anything other than a different self, not a mistaken one. The eliminativist response simply walks away, denying the phenomenon exists rather than explaining its normative force.

  My project argues that the fixed-point structure offers a way out, but only if we can formalize the feedback mechanism without invoking a homunculus who stands outside the loop to check the alignment.

  **Methodology and Work Plan**

  I will not proceed via empirical psychology or straight conceptual analysis of 'self'. The former assumes the normative gap is measurable, which begs the question; the latter tends to dissolve into terminological stipulation. Instead, I will treat the centre-of-gravity analogy as a piece of conceptual engineering that needs to be repaired to bear the weight we place on it.

  The work will be divided into three terms. In the first term, I will rigorously separate the three components (distribution, centre, calculation) and model the feedback loop. I will test whether formal apparatus (likely simple fixed-point logic rather than heavy mathematics) earns its keep. If the formalism is merely decorative, I will discard it; its only justification is if it reveals structural impossibilities in the feedback loop that prose cannot capture.

  In the second term, I will construct a taxonomy of feedback pathologies. I need case types where the intuition of "mis-centring" is strongest but the metaphysical ground is shakiest. Primary candidates include: radical confabulation (where the narrative is coherent but causally disconnected from the history it claims); therapeutic revision (where a false narrative produces healthy behaviour); and malicious gaslighting (where an external narrative forces a misalignment). These cases test the limits of the feedback loop. Does the therapeutic revision count as "mis-centred" even if it works? If yes, we have normativity without truth. If no, we have pragmatism collapsing into truth.

  In the third term, I will attempt to define the normative standard. The goal is to locate the error condition in the *dynamics* of the loop rather than the *content* of the narrative. A mis-centred self would be one where the feedback mechanism itself is degraded—for example, where the narrative prevents the distribution from updating the narrative, locking the system into a stable but inaccurate fixed point.

  **Failure Conditions**

  I am under no illusion that this will succeed. The project faces three specific failure conditions, and I intend to argue for them explicitly rather than treating them as mere hurdles.

  First, **collapse into plain inaccuracy**. If "mis-centred" just means "contains false propositions," I haven't added anything to standard correspondence theories of truth. I need to show that a narrative can be factually accurate yet structurally mis-centred (e.g., right facts, wrong weighting). If I cannot distinguish structural mis-alignment from propositional error, the project fails.

  Second, **trivial fixed points**. Since the narrative alters the distribution, any stable narrative eventually makes itself true by shaping the behaviour to match. If every sustained narrative becomes a fixed point of its own loop by construction, then the notion of a "mis-centred" self is empty. There are only unstable selves and stable selves. I must demonstrate a criterion for stability that isn't merely temporal persistence.

  Third, **the homunculus regress**. This is the gravest risk. To say a narrative is "wrong" about the distribution usually requires a viewpoint outside the narrative. If my account of mis-centring requires an observer who is not themselves subject to the narrative gravity they are judging, I have reintroduced the inner auditor Dennett eliminated. I need to show how the system can self-correct without a corrector. If I cannot locate the normative pressure within the loop itself, the proposal collapses into dualism.

  **Scope and Limitations**

  This project threatens to balloon into a book-length treatment of personal identity. I am explicitly bounding it to avoid that. I am not arguing for a new theory of personal identity, nor am I solving the problem of diachronic unity. I am investigating a specific structural vulnerability in the narrative-gravity model. If the work reveals that the model cannot support normativity, that is a successful result: it would indicate we need a different metaphor entirely.

  The deliverable will be a monograph draft or a series of three substantial papers focusing on the fixed-point structure, the taxonomy of pathologies, and the normative conditions. I am aware that the "fixed-point" insight might be philosophically costly; it may require abandoning the idea that the self is purely an abstractum. I am prepared to follow the argument there, but I will not let the scope expand to defend the resulting ontology beyond what is necessary to solve the mis-centring problem. This is a year for debugging a metaphor, not building a universe.
