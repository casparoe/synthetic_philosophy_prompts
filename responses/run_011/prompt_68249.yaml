      *   **Task:** Assess a take-home essay based on a specific prompt and student answer.
      *   **Inputs:** Essay question (with specific case study "laundered" case, three sub-questions a, b, c) and Student Answer.
      *   **Constraints:**
          *   Grade out of 100 + one-sentence justification.
          *   Point-by-point assessment (Accurate/Partially Accurate/Mistaken) keyed to claims, not paragraphs.
          *   Explain defects for non-accurate claims (conflation, misattribution, non-sequitur, etc.) and provide correct account.
          *   Note overlooked strengths.
          *   Check coverage of parts (a), (b), (c) and engagement with the "laundered" stipulation.
          *   Do *not* penalize for style, brevity (within limit), or lack of external citations.
