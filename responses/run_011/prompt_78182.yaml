  12. **Final Polish:** Check against the "no reading list" rule. Ensure the focus is on *questions* and *arguments*, not names (though Kavka/Gauthier are context). Ensure the engineering link is substantive. (The prompt mentions 18 months funding for engineers, so the PhD needs to align).

      *Wait, one nuance:* The prompt asks for a "two-year agenda." A PhD third year usually means ABD (All But Dissertation) or writing up. Two years is a lot of time for just *one* puzzle. The agenda needs to look like a dissertation structure.
      *Revised Plan:*
      1.  The Nature of the Constraint (The Theory).
