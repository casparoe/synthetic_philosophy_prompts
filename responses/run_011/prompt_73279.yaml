  Owen's closing reply is sound regarding the methodological distinction but mistaken in assuming it settles the philosophical stakes. He is right that cancellation can be measured objectively through behavior and neural correlates without relying on introspective timing, which gives the veto hypothesis a stronger empirical footing than the timing of the urge. However, his claim that a will restricted to cancellation is not the freedom people think they have assumes a specific definition of freedom as origination that not all theories of agency require. While it is true that veto power is not the same as uncaused initiation, dismissing it as irrelevant to moral responsibility ignores the substantial role that inhibition plays in rational self-control.

