  Nadia's averaging objection is sound and reflects a significant development in the neuroscience of decision-making since the original experiments. She is correctly describing the stochastic accumulator model proposed by researchers like Schurger, which suggests that the slow ramp of the readiness potential may be an artifact of averaging noisy neural activity aligned to movement onset. If the neural activity is random fluctuation until a threshold is crossed, averaging only the trials that crossed the threshold will mathematically produce a ramp that looks like preparation long before any decision occurred. This undermines Owen's timeline significantly, suggesting the decisive neural event could be much closer to the movement than the five hundred and fifty millisecond figure implies.

