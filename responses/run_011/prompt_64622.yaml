answer: |-
  Dear Julian,

  I am writing to you because I have finally settled on the argument for my final paper in the distributive justice seminar, and I want to test the reasoning on someone who understands the technical landscape without needing the basics explained. You know the instructor's warning: most students try to hedge by saying both Nash and Kalai and Smorodinsky have merits depending on the context. I have decided against that compromise. I intend to argue that the Nash solution, grounded in the independence of irrelevant alternatives, offers a more robust account of fairness than the Kalai and Smorodinsky solution, even though the latter's axiom of individual monotonicity carries a powerful intuitive appeal. I want to walk you through the specific case I am using, because it upends the standard criticism of Nash, and then explain why, despite that upending, the philosophical foundations of Nash remain superior for a theory of cooperative justice.

  To see why the standard story fails, we have to look at the geometry of the specific bargaining problem I am analyzing. We start with a disagreement point where both parties get nothing. The feasible frontier is kinked. It runs from the point where the first party gets one hundred and the second gets nothing, through a kink at fifty for the first and seventy-five for the second, to the point where the first gets nothing and the second gets one hundred. In this initial setup, the Nash solution falls exactly on the kink at fifty, seventy-five. This is because that point maximizes the product of the gains over disagreement. The Kalai and Smorodinsky solution, by contrast, looks at the ideal point where each party gets their maximum possible payoff, which is one hundred for each. Drawing a line from the disagreement point to that ideal point of one hundred, one hundred, we intersect the frontier at sixty, sixty. So initially, Nash favors the second party while Kalai and Smorodinsky splits the difference equally.

  Now consider the expansion. The first party discovers an outside option that yields one hundred and fifty for them but leaves the second party with nothing. This changes the feasible set. The new frontier runs from one hundred and fifty, zero, through the same kink at fifty, seventy-five, to zero, one hundred. The standard criticism of Nash is that it is insensitive to such expansions if the original solution remains feasible. But here, the arithmetic shows something different. The new Nash solution moves to seventy-five, fifty-six point two five. The first party gains twenty-five units, and the second party loses eighteen point seven five. The Kalai and Smorodinsky solution also moves, shifting to approximately seventy-nine point four, fifty-two point nine. Here the first party gains about nineteen point four, and the second party loses about seven point one.

  This is the crucial twist. The usual complaint is that Nash perversely refuses to reward a party for newly available opportunities while Kalai and Smorodinsky obligingly responds. In this case, both rules reward the first party, but Nash actually rewards them more in absolute terms. The complaint misfires because it assumes the expansion is irrelevant to the local geometry of the frontier. But by extending the frontier to one hundred and fifty, we have changed the slope of the trade-off available to the parties. The Nash solution is sensitive to the marginal rates of substitution along the frontier. Because the new segment allows the first party to gain more utility for every unit of utility the second party sacrifices, the product-maximizing point shifts significantly in the first party's favor. Kalai and Smorodinsky also shifts, but it is constrained by the requirement to maintain a proportional claim relative to the ideal point.

  This brings us to the substantive meaning of the axioms. The dispute is not merely technical; it is about what fairness requires. The axiom of independence of irrelevant alternatives, which Nash satisfies, asserts that the fairness of an agreement should not depend on options that are not chosen and do not alter the local trade-offs at the solution. It treats the bargaining problem as a search for a stable point of agreement within the actual constraints of cooperation. The axiom of individual monotonicity, which Kalai and Smorodinsky satisfies, asserts that if a party's potential maximum payoff increases, their fair share should not decrease. This treats fairness as a function of bargaining power defined by hypothetical extremes.

  I reject individual monotonicity because it indexes fairness to what a party could extract if the other capitulated completely. In my example, the first party's ideal payoff jumps from one hundred to one hundred and fifty solely because they have an option that gives the second party nothing. To let this dictate the cooperative solution is to allow destructive potential to dictate cooperative gains. It validates the threat value of the outside option rather than the cooperative surplus. A fair-minded rule should distribute the gains from working together, not reward parties for how well they could do by walking away or by forcing the other to zero. The Kalai and Smorodinsky rule effectively taxes the second party for the first party's improved outside option, even though that option is mutually exclusive with the cooperation that generates the surplus.

  You might object that the Nash solution hurts the second party more in this case. The second party loses eighteen point seven five under Nash, compared to only seven under Kalai and Smorodinsky. Is it fair to impose a larger loss on the second party just because the first party's potential increased? The defense of Nash here is that the loss is not a penalty imposed on the second party, but a reflection of the new opportunity costs of cooperation. The frontier has become steeper in the relevant region. To maintain efficiency, the parties must operate where their marginal rates of substitution are equal. The Nash solution finds the point where the hyperbola of equal product is tangent to the frontier. When the frontier shifts out, the point of tangency moves. The second party loses utility because the cost of generating utility for the first party has effectively dropped in terms of the trade-off, but the total surplus distribution shifts to reflect the new productive possibilities. Under Kalai and Smorodinsky, the second party is shielded from this shift because the rule prioritizes equalizing relative concessions from the ideal point. But those ideal points are fantasies of non-cooperation. Shielding the second party based on a metric derived from non-cooperative extremes distorts the incentives for cooperation.

  There is a deflationary reconciliation that tempts many students, and I suspect you might raise it. It suggests that Nash is a strategic prediction derived from alternating-offer models, while Kalai and Smorodinsky is a normative recommendation for an arbitrator. On this view, the two are answering different questions, so neither refutes the other. I do not think this works. First, implementation results exist for Kalai and Smorodinsky too, so it is not merely a normative fancy; it can be strategically underwritten. Second, even if Nash has stronger strategic foundations in non-cooperative game theory, our seminar is about distributive justice. We are asking what a fair-minded third party should do. If the strategic equilibrium of a bargaining game yields an outcome we find morally repugnant, we should not accept it merely because it is an equilibrium. Conversely, if a normative rule recommends an outcome that is unstable or manipulable, it fails as a guide for justice. We cannot hide behind the distinction between prediction and recommendation. We must decide which axioms capture the right moral constraints on the division of surplus.

  Therefore, my verdict is that a fair-minded third party should use the Nash rule in a case like this. The third party should recommend the point at seventy-five, fifty-six point two five. But what should they say to the second party, who ends up worse off than under the Kalai and Smorodinsky rule? They cannot simply say that the math demands it. They must explain that fairness is not about protecting you from the consequences of your partner's improved outside options if those options change the nature of the cooperation itself. They should say that the agreement is based on what you can produce together, not on what your partner could take from you if they refused to cooperate. The loss you suffer is the price of efficiency given the new trade-offs available. To compensate you further, as Kalai and Smorodinsky would, would be to ignore the reality of the feasible set in favor of a hypothetical benchmark where your partner gets everything and you get nothing. That benchmark is irrelevant to the justice of your cooperation.

  I know this is a hard line to take. The strongest version of the Kalai and Smorodinsky position argues that fairness requires equalizing relative concessions. If the first party's claim to the surplus increases because their maximum potential increases, justice requires that their share of the cooperation increase proportionally. To deny this is to ignore the change in bargaining power. But bargaining power based on the ability to harm the other or to do well alone is precisely what cooperation is meant to mitigate. A theory of justice should not codify the power asymmetries of the state of nature into the terms of the social contract. The Nash solution, by focusing on the product of gains, treats the parties as equal contributors to the surplus regardless of their outside threats, except insofar as those threats change the shape of the cooperative frontier itself. In my example, the shape does change, and Nash responds. But it responds to the geometry of cooperation, not the geometry of conflict.

  So I am committing to Nash. I will argue that independence of irrelevant alternatives is not just a technical convenience but a moral requirement that fairness should depend on feasible cooperative outcomes, not on dominated alternatives or hypothetical maxima. I will argue that individual monotonicity invites manipulation by inflating ideal points with theatrical alternatives. And I will argue that the deflationary reconciliation fails because we need a single normative standard for justice, not a split between strategy and arbitration. I know you might prefer the egalitarian intuition behind Kalai and Smorodinsky, but I believe the integrity of the cooperative surplus demands the Nash approach. I look forward to hearing your objections when I present this next week.

  Best regards,

  Alex
