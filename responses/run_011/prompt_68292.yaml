  If the goal is to explain phenotypic variance, rGE *is* genetic variance (in the broad sense). But if the goal is to isolate biological machinery, rGE is confounding.
  The tension is: In (4), rGE is treated as a contaminant that makes twin estimates *too high* relative to "true" genetic influence. In (5), rGE is treated as the *mechanism* of genetic influence.
