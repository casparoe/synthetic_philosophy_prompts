  *Resolution:* The user needs to define what $h^2$ is estimating. If it's $V_G / V_P$ where $V_G$ includes rGE, then (4)'s language of "upper bound" is misleading. It's an accurate bound of *total* genetic impact, but an upper bound of *direct* biological impact.
