      *   **(4) Twin Estimates/GE Correlation:** Twin estimates = upper bounds. rGE (evocative/active) inflates twin estimates because MZ twins share environments *due to* genes. EEA violation. *Plausible, standard critique of twin studies.*
      *   **(5) Developmental Increase:** $h^2$ of IQ rises from childhood to adulthood. Explanation: Active rGE (niche picking). *Standard finding (Haworth et al.), standard explanation (Scarr & McCartney).*
      *   **(6) Missing Heritability:** Twin > SNP gap is partly confounding (supports 4), partly methodological (rare variants, non-additive). Gap narrowing. *Current consensus view.*
      *   **(7) Innate vs. Heritable:** "Innate" $\neq$ "Heritable". Fingers example (innate, low $h^2$). Eye color (innate, high $h^2$). *Conceptual distinction. "Innate" is slippery.*
      *   **(8) Polygenic Scores (PGS):** $h^2$ is population variance, but PGS predicts individuals. No inconsistency with (1). *Technically true, but requires careful phrasing.*

  3.  **Evaluate the Friend's Accusations:**

      *   **Accusation A:** (2) is an evasion while appealing to (5).
