      *   *The "Uncanny Valley" of Localization:* If the text fits the meaning but not the mouth/eye, it feels "off."
      *   *The "Better in Target" Paradox:* If B's version makes people cry/laugh more than the English did, is it a failure? No, that's the goal of art.

  5.  **Formulate a Principled Approach:**
      *   There is no single "right" answer, but there is a *process* to decide.
      *   The decision depends on the *function* of the text within the game.
      *   **Key Distinction:** Is the text *diegetic* (part of the world) or *non-diegetic* (UI/Marketing)? This is a title sequence/cover, so it's paratext.
      *   **Key Distinction:** Is the constraint *hard* (technical limit) or *soft* (artistic preference)?
      *   **The Policy:** Needs to prioritize based on hierarchy of needs for the specific asset type.

  6.  **Drafting the Response:**

      *   **Introduction:** Acknowledge the difficulty. Validate the user's intuition (it's not just taste).
