answer: |-
  We, the undersigned members of the reading group, acknowledge that for two terms we have argued past one another regarding the foundations of mathematics, specifically concerning the status of infinite totalities. In an effort to clarify the dialectic and move beyond mere repetition, we have committed to paper the substantive ground we share, the specific points where we diverge, and the empirical or theoretical cruxes that would actually compel one of us to revise our position. This document serves as a record of that agreement and disagreement, intended to guide our future discussions and prevent further equivocation.

  We begin by affirming the claims both of us can sign without reservation. We agree that there is no greatest natural number, though we gloss the modal force of this claim differently. We agree that any particular finite computation can in principle be carried out, and that the limits of feasibility are practical rather than principled for the numbers typically encountered in ordinary mathematics. We agree that Cantor's diagonal argument establishes what it establishes only relative to granting the totalities over which it quantifies, so that both camps accept it as a conditional even while disagreeing about whether the condition is satisfied. We agree that the behaviour of Hilbert's hotel is a restatement of Dedekind-infiniteness rather than a contradiction, and that a set may nonetheless be infinite in the plain sense, failing to correspond to any natural number, without being Dedekind-infinite, since that equivalence is not provable without some weak principle of choice. We agree that Goodstein's theorem is true, is not provable in first-order Peano arithmetic, and is proved by transfinite induction up to the first epsilon number, each camp glossing that cluster of facts in its own way. Finally, we agree that the incompleteness theorems do not by themselves decide the dispute, as they constrain any formal system regardless of its ontological commitments.

  Having secured this common ground, we set out our disagreements, phrased so that each camp accepts the wording of its own side. The first disagreement concerns the ontology of the domain. The classical set theorist maintains that infinite totalities exist completed, with all their members there at once, such that the natural numbers form a definite collection and the reals a strictly larger one. The potentialist maintains that there is no completed infinity, only a process that can always be continued, and that claims ostensibly about infinite totalities are to be read either as claims about the finite stages we have so far reached or modally, as claims about what would hold in any possible extension of the universe as it stands. The second disagreement concerns the semantics of quantification. The classical set theorist holds that quantifiers range over completed domains, making statements about infinite sets truth-apt in a straightforward objectual sense. The potentialist holds that quantifiers over infinite domains are either shorthand for finite assertions or must be interpreted modally, denying that they range over a fixed domain of objects. The third disagreement concerns explanatory priority. The classical set theorist argues that finite combinatorics is often best explained by the structure of infinite sets, whereas the potentialist argues that infinite sets are merely heuristic devices for describing patterns in finite combinatorics, and that the finite is ontologically prior.

  We now turn to the cruxes, the sub-questions such that settling one would actually move somebody. The first crux is whether the potentialist's modal idiom yields a genuine alternative foundation or is a notational variant of the actualist's practice, and what each camp says about whether the two positions agree on every first-order arithmetical consequence. The case bearing on this is the conservation of second-order arithmetic over first-order arithmetic for certain classes of formulas. The classical set theorist predicts that the potentialist's system will prove exactly the same first-order arithmetical truths as the actualist's system, rendering the dispute ontological rather than mathematical, while the potentialist predicts that their system will validate the same arithmetic but without committing to the existence of the infinite objects used in the proof. The second crux is whether an indispensability argument can be run from finite combinatorics, of the kind surveyed in reverse mathematics, where a statement about finite trees or finite sequences resists every weak system but falls out immediately from axioms quantifying over infinite sets or well-orderings. The case bearing on this is Kruskal's theorem on finite trees. The classical set theorist predicts that this phenomenon reaches high up the hierarchy and that infinite axioms are genuinely necessary for the proof of certain finite statements, while the potentialist predicts that the phenomenon stops early or that a purely finite proof exists which we have not yet found, implying that infinite axioms are never strictly necessary. The third crux is whether the actualist, by refusing a completed totality of all sets and retreating to proper classes, is a potentialist at the second order without admitting it. The case bearing on this is the use of reflection principles in set theory. The classical set theorist predicts that classes are distinct logical types and that reflection describes properties of the completed hierarchy, while the potentialist predicts that the hierarchy of sets is inherently potential, making the actualist a covert potentialist about the universe of sets.

  Regarding evidence or argument against our own positions, we state the following. The classical set theorist would count as evidence against their position a demonstration that the assumption of completed infinities leads to a contradiction in finite arithmetic, such as a proof that ZFC is inconsistent and implies a false statement about natural numbers. The potentialist would count as evidence against their position a demonstration that their modal reconstruction fails to recover standard mathematical practice without essentially reintroducing completed totalities, or if a finite computation predicted by infinite set theory were to fail empirically. We agree that there is something that would move the debate, specifically a divergence in first-order arithmetical consequences; if one system proved a finite statement false that the other proved true, the dispute would cease to be merely philosophical. However, we record our suspicion that such a divergence will not occur, and the emptiness of that answer is itself a finding, suggesting the dispute may be largely metaphysical.

  On the matter of the more extreme view that doubts whether very large numerals denote, the classical set theorist says this view is coherent but false, as the natural numbers are a completed totality regardless of our ability to write them down. The potentialist says this view raises a problem of vagueness about which numbers there are, potentially leaving them with an unacceptable boundary where denotation stops, though they sympathize with the caution regarding surveyability. Finally, we judge that part of the dispute is merely verbal, specifically the usage of the word exists regarding abstract objects, as both camps agree on the rules for using such objects in derivation. We distinguish this clearly from the part that is not verbal, which is the necessity of infinite methods for finite proofs; if infinite methods are genuinely indispensable for certain finite truths, the potentialist must explain how these truths are grounded without the objects that prove them, and this is a substantive mathematical question rather than a semantic one. We sign this statement to hold ourselves accountable to these distinctions in our future meetings.
