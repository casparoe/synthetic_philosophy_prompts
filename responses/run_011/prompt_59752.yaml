answer: |-
  ### Framing the Problem Class: Decision Theory Under Imperfect Recall

  The Absent-Minded Driver (AMD) is not an isolated curiosity but the canonical instance of a broader family: **agential fragmentation under information loss**. This family includes agents with wiped episodic memory, temporally distributed committees with limited communication, and any system where the decision-maker at $t_2$ cannot distinguish their state from $t_1$. An adequate decision theory for this class cannot simply patch the AMD paradox; it must satisfy a specific set of structural desiderata that define rational agency when the "self" is not a continuous, fully informed locus of control. Below are the necessary conditions for such a theory, categorized by their normative weight.

  #### The Desiderata

  **1. Ex-Ante Planning Optimality (Non-Negotiable)**
  *Requirement:* The theory must identify the strategy that maximizes expected utility from the initial perspective ($t_0$) as the rational standard. In AMD, this is the behavioral strategy $p=2/3$ yielding $EU=4/3$.
  *Argument:* If a theory recommends a plan that the agent knows at $t_0$ is suboptimal (e.g., $p=1$ yielding $EU=1$), it fails as a guide for action. Rationality requires that if you could bind your future self, you would bind them to the ex-ante optimum. A theory that cannot recover this benchmark treats the initial deliberation as normatively inert, which undermines the concept of *planning* agency.

  **2. Behavioral Strategy Distinction (Non-Negotiable)**
  *Requirement:* The theory must distinguish between a *mixed strategy* (flipping once at $t_0$ to decide "Always Continue" or "Always Exit") and a *behavioral strategy* (flipping locally at each intersection).
  *Argument:* Collapsing these distinctions (as Kuhn's theorem does for perfect recall) yields the wrong payoff here. A mixed strategy caps the payoff at 1 (since "Always Continue" leads to the end of the road). Only a behavioral strategy allows the $4/3$ optimum. A theory that treats the agent as a single unitary chooser without local randomization capability cannot solve the problem; it must accommodate local independence despite global identity.

  **3. Dynamic Consistency (Contestable)**
  *Requirement:* The action chosen at the intersection must match the plan formulated at $t_0$ without the need for external precommitment technology.
  *Argument:* This is the primary fault line. "Planning" theorists (e.g., Piccione & Lipman) argue this is non-negotiable; if you wouldn't do it at the node, the plan is empty. "Action" theorists (e.g., Aumann et al.) argue this is a pet constraint of continuous selves; in imperfect recall, the "self" at the node has different information (centered vs. uncentered) and thus different rational obligations. **This is the single requirement that knocks out the most candidates.** Demanding strict dynamic consistency forces the agent to abandon the ex-ante optimum ($p=2/3$) in favor of the time-consistent but suboptimal action ($p=1$), effectively sacrificing Ex-Ante Optimality.

  **4. Belief-Action Coherence (Contestable)**
  *Requirement:* The credence the agent holds at the intersection regarding their location (e.g., $P(\text{First}) = 3/5$) must be consistent with the strategy they are executing ($p=2/3$).
  *Argument:* If the agent calculates credences using a rule independent of their strategy (e.g., assuming $p=1/2$ while acting $p=2/3$), they are effectively lying to themselves about the odds. However, enforcing this creates a fixed-point problem: the optimal $p$ depends on the credence, which depends on $p$. Some theories (CDT) bypass this by ignoring self-locating credence entirely; others (EDT) embrace it. This is contestable because it requires the theory to solve the epistemology of self-location simultaneously with the decision theory.

  **5. Agency Continuity Without Memory (Non-Negotiable)**
  *Requirement:* The theory must apply equally to a single amnesic driver, a committee of identical agents, or a sequence of wiped selves.
  *Argument:* The structural problem is the information set, not the metaphysics of personal identity. If a theory works for the driver but fails for a committee where members literally have different brains but identical instructions, it is ad hoc. The solution must rely on the topology of the decision tree, not the biology of the agent.

  #### The Impossibility Result

  It must be stated plainly: **A subset of these desiderata is jointly unsatisfiable.** Specifically, the "Trilemma of Imperfect Recall" demonstrates that you cannot simultaneously maintain **Ex-Ante Planning Optimality**, **Dynamic Consistency**, and **Standard Separability** (that choices depend only on the current node's expected utility).
  *   If you keep Optimality and Consistency, you must violate Separability (you must care about the past plan).
  *   If you keep Consistency and Separability, you must sacrifice Optimality (you end up at the end of the road).
  *   If you keep Optimality and Separability, you must sacrifice Consistency (you plan $p=2/3$ but execute $p=1$).

  Most modern survey literature treats **Dynamic Consistency** as the expendable constraint. The argument is that in the absence of memory, the "self" at the exit is effectively a new agent with a different information set; demanding they honor the past self's plan without new information is a category error. However, this comes at the cost of fragmenting the agent into a temporal collective.

  #### The Self-Locating Belief Connection

  If your list treats the credence calculation ($3/5$) as mandatory, you are treating AMD as a **self-locating belief problem** isomorphic to Sleeping Beauty. This is not inherent to decision theory but requires **extra machinery**: specifically, a principle of indifference for centered worlds (e.g., SSA or SIA). Without this, the "3/5" does not arise naturally from probability theory alone. A theory that solves AMD without solving Sleeping Beauty must explicitly decouple decision weights from doxastic credences, whereas a theory that links them imports the entire Halfer/Thirder debate into the utility calculus.

  #### Scoring of Major Views

  **Causal Decision Theory (CDT)** fails Ex-Ante Optimality; it treats the current choice as causally isolated from the other node, leading to $p=1$ (dynamic consistency at the cost of payoff). **Evidential Decision Theory (EDT)** recovers Ex-Ante Optimality ($p=2/3$) by treating the current choice as evidence of the other node's choice, but it struggles with Belief-Action Coherence unless paired with a specific self-locating credence framework (Thirder). **Planning/Sophistication Views** preserve Dynamic Consistency by treating the agent as a game between temporal selves, but they inevitably converge on the suboptimal equilibrium ($p=1$) unless they allow for "resolute choice," which effectively violates the separability constraint by fiat.
