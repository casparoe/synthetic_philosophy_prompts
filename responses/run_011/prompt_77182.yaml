answer: |-
  1. When the crew hears the sirens, their decision to remain bound transforms from blind obedience into a conscious endorsement of the navigator's wisdom. This normative commitment creates a deeper loyalty than the fragile compliance of those who simply lack the capacity to dissent.

  2. Transparency allows the polity to interpret the ropes in light of new siren songs, adjusting the tension without snapping the lines entirely. A deafened crew cannot negotiate the binding, so any change in conditions threatens immediate structural failure.

  3. If a generation deafened by wax suddenly regains hearing, the shock of the sirens will provoke a panicked mutiny rather than a deliberative choice. By contrast, a generation that has always heard the song can weigh the cost of untying against the risk of wreckage before picking up the knife.

  4. Because the sirens are heard, the ropes are constantly stress-tested by argument, weeding out weak justifications and leaving only the strongest structural supports. A wax-sealed system cannot be stress-tested, so hidden flaws in the binding remain undiscovered until the moment of catastrophe.

  5. Hearing the song allows the crew to incorporate the struggle against temptation into their collective identity as sailors. A deafened crew defines itself only by the restriction, making freedom synonymous with cutting the ropes rather than navigating safely.
