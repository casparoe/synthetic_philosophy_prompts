      *(Self-Correction)*: I need to be careful about the "Drug vs Organ" distinction. Drug approval is about *scientific truth* (does it work?) + *aggregate safety*. Organ allocation is *triage*. Futarchy is bad at triage because it values lives by economic productivity (usually) unless the welfare metric is strictly "number of lives." Even then, it lacks due process.
      Actually, the key distinction is **General Rule vs. Specific Case**. Futarchy sets parameters (Drug standards, Interest Rates). It shouldn't decide specific instances (This patient, This prisoner).

      *(Final check on Dam)*: Property values + Fish counts. This is vulnerable to the "Waste Site" critique. If removing the dam floods upstream indigenous land (concentrated cost) for downstream property values (diffuse benefit), it's a No. If it's general ecological restoration, it's a Yes. I should highlight this conditionality.

