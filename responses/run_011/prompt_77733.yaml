answer: |-
  Your intuitions are remarkably consistent with the deepest critiques of futarchy and utilitarian governance. You are implicitly applying a set of boundary conditions that Robin Hanson's original proposal often glosses over.

  The principle that reconciles your verdicts is **The Principle of Constrained Impersonality.**

  Futarchy works only when the decision is **impersonal** (applies to systems, not specific individuals), **non-reflexive** (the market price doesn't change the outcome), and **distributionally neutral** (doesn't sacrifice a minority's rights for aggregate gain).

  Here is the three-filter framework derived from your list, how it resolves your conflicts, and the verdict you must surrender to maintain consistency.

  ### The Three Filters

  1.  **The Reflexivity Filter:** Does the market price itself alter the physical outcome?
      *   *Fails:* **Bank Failure.** Even if the "fail" market doesn't resolve, the *price* becoming public signals insolvency, triggering the run you tried to predict.
      *   *Fails:* **War Strike.** The market price signals intent to the adversary, allowing them to trade against you or change their behavior (hiding the nukes), corrupting the prediction.
      *   *Passes:* **Light Rail / Dam.** Trading on these doesn't physically build or destroy them.

  2.  **The Metric Integrity Filter:** Does optimizing the metric destroy the underlying value? (Goodhart's Law)
      *   *Fails:* **School Curriculum.** Optimizing for test scores degrades education. The metric is a proxy that breaks under optimization pressure.
      *   *Passes:* **Drug Approval.** "Safety/Efficacy" is a hard technical constraint. You can't game biology easily.
      *   *Passes:* **Central Bank.** Inflation/Unemployment are macro indicators that are hard for individual traders to manipulate directly via the metric itself.

  3.  **The Rights & Distribution Filter:** Does the decision concentrate harm on a specific group to benefit the aggregate?
      *   *Fails:* **Waste Site.** Aggregate welfare goes up, but one town suffers catastrophic local harm. Futarchy uses willingness-to-pay, which is correlated with wealth. It will systematically sacrifice the poor.
      *   *Fails:* **Parole / Organs.** These are **individual adjudications**, not general policies. Using a market to decide *who* lives or *who* goes to prison violates due process and rights, regardless of the welfare prediction.
      *   *Passes:* **Light Rail / Central Bank.** These are generally diffuse policies. (With a major caveat, see below).

  ---

  ### Resolving Your Conflicts

  **1. Light Rail (Yes) vs. Waste Site (No)**
  *   **The Distinction:** This is not about the *type* of project, but the **distribution of costs**.
  *   **The Principle:** Futarchy maximizes *aggregate* welfare. It has no inherent mechanism to protect minorities from concentrated harm.
  *   **Resolution:** Your intuition is correct, but your verdict on Light Rail is too broad. If the Light Rail line requires bulldozing a specific low-income neighborhood to save commuters 10 minutes, it fails the **Rights & Distribution Filter** exactly like the Waste Site. It is only a "Yes" if the costs and benefits are sufficiently diffuse.

  **2. Drug Approval (Yes) vs. Organ Allocation (No)**
  *   **The Distinction:** **General Policy vs. Individual Adjudication.**
  *   **The Principle:** Futarchy is a legislative/regulatory tool, not a judicial one.
  *   **Resolution:** Drug approval sets a *standard* for a population ("Is this molecule safe for humans?"). Organ allocation decides a *specific fate* ("Does Patient A or Patient B get the kidney?").
      *   In Drug Approval, the "No" decision protects the population from harm (a right to safety).
      *   In Organ Allocation, the market would likely allocate based on future economic productivity or survival probability, effectively putting a price on specific lives. This violates the **Rights Filter**.

  ---

  ### The New Case: Removing a Dam
  **Scenario:** A city bets on whether removing a dam raises property values and fish counts.

  **Analysis:**
  1.  **Reflexivity:** Pass. Trading won't remove the dam.
  2.  **Metric Integrity:** Pass/Neutral. Fish counts are objective. Property values are gameable but standard.
  3.  **Rights & Distribution:** **The Critical Failure Point.**
      *   Dam removal often has concentrated losers (upstream landowners who lose lakefront property, communities that lose flood control or hydro jobs) and diffuse winners (downstream owners, environmentalists).
      *   If the welfare metric is just "Aggregate Property Value + Fish," the market will ignore the *concentration* of the loss.

  **Verdict:** **No**, unless the welfare metric is adjusted to weight the losses of the directly affected upstream community disproportionately high. If you run a raw futarchy market on this, it replicates the **Waste Site** error. It will sacrifice the upstream town for the downstream majority.

  ---

  ### The Verdict You Must Give Up

  To be consistent with the **Principle of Constrained Impersonality**, you must modify your verdict on **Light Rail**.

  You currently say: *"Light rail line... yes, let the market decide."*
  You must change this to: *"Light rail line... **only if** the route does not concentrate harm on a specific minority community."*

  **Why?**
  There is no structural difference between siting a waste facility and siting a rail station. Both are infrastructure projects where the aggregate benefit (transport/waste management) is often paid for by a localized cost (noise/displacement/toxicity).
  *   If you say **Yes** to Rail because "it's for the public good," you must say **Yes** to Waste for the same reason.
  *   If you say **No** to Waste because "it unfairly burdens one town," you must say **No** to Rail if it unfairly burdens one town.

  **The Cost of Consistency:**
  You have to admit that futarchy is **not** a general-purpose decision engine for infrastructure. It is only valid for infrastructure where the NIMBY (Not In My Back Yard) problem has been solved *outside* the market, via rights-based zoning or compensation guarantees. If you run a futarchy market on a rail line that displaces a poor neighborhood, the market *will* tell you to do it, and you have already admitted (in the Waste Site case) that this is an outcome you reject.

  ### Summary of the Framework

  | Case | Reflexivity | Metric Integrity | Rights/Distribution | **Final Verdict** |
  | :--- | :--- | :--- | :--- | :--- |
  | **Light Rail** | Pass | Pass | **Conditional** | **Yes** (Only if diffuse costs) |
  | **Waste Site** | Pass | Pass | **Fail** (Concentrated Harm) | **No** |
  | **Central Bank** | Pass* | Pass | Pass | **Yes** |
  | **Parole** | Pass | Pass | **Fail** (Individual Rights) | **No** |
  | **Schools** | Pass | **Fail** (Goodhart) | N/A | **No** |
  | **War Strike** | **Fail** (Signaling) | Pass | N/A | **No** |
  | **Drug Approval**| Pass | Pass | Pass (Population Level) | **Yes** |
  | **Organ Alloc.** | Pass | Pass | **Fail** (Individual Rights) | **No** |
  | **Bank Failure** | **Fail** (Self-fulfilling)| Pass | N/A | **No** |
  | **Dam Removal** | Pass | Pass | **Conditional** | **No** (Unless upstream protected) |

  *\*Central Bank markets are reflexive, but in macroeconomics, managing expectations is part of the mechanism, so this is often considered a feature, not a bug, provided the mandate is clear.*

  **Conclusion:** Futarchy is a tool for **technical, aggregate policy optimization**, not for **justice, rights, or individual triage.** Your intuitions are correct; the principle is that **markets maximize efficiency, not fairness.** Whenever fairness is the primary constraint, the market must be vetoed.
