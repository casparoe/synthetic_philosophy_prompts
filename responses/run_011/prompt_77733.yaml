prompt: |-
  I keep having intuitions about when a prediction market should actually get to make a decision, and they don't seem to line up with each other. Here they are.

  - A state deciding whether to build a light rail line, betting on ridership and commute times ten years out: yes, let the market decide.
  - The same state deciding where to site a hazardous waste facility, betting on the same kind of welfare measure: no. The market would pick the poorest town and I don't think that's a reason to.
  - A central bank setting rates off markets for inflation and unemployment: yes.
  - A parole board using a market on reoffending: no, even though it would probably predict better than the board does.
  - A school board choosing curriculum off a market on test scores: no — feels like the metric eating the thing it's supposed to measure.
  - War, a market on whether a strike sets a nuclear program back five years: no, because the people who know most are on the other side and can trade on it.
  - Approving a new drug: yes. Allocating one available organ between two patients by market: no. Both are life-and-death predictions, so I cant seperate these.
  - A market on whether a regional bank fails: no, since the price moving can help make it fail.

  Is there a principle, or a short list of them, that gets most of these and explains why the two pairs I can't separate (waste site vs. rail line, drug vs. organ) come out different? And what does it say about a case I haven't thought of, like a city betting on whether removing a dam raises property values and fish counts? Tell me which of my verdicts it forces me to give up. Assume the standard futarchy setup where you run a market for each option and take whichever predicts better welfare, so the market for the option you rejected never resolves — I suspect that matters to some of my verdicts but I couldn't say how.
reasoning: |-
  Here's a thinking process that leads to the suggested principles:

  1.  **Analyze the User's Request:**
      *   **Core Task:** Identify a unifying principle (or short list) that explains the user's intuitions about when prediction markets (specifically in a *futarchy* setup, where markets decide policy based on predicted welfare) should or should not be used.
      *   **Input Data:** A list of 8 scenarios with the user's "Yes/No" verdicts.
          1.  Light Rail (Ridership/Commute): **Yes**
          2.  Hazardous Waste Siting (Welfare): **No** (Distributional fairness issue)
          3.  Central Bank Rates (Inflation/Unemployment): **Yes**
          4.  Parole Board (Reoffending): **No** (Rights/Justice issue)
          5.  School Curriculum (Test Scores): **No** (Goodhart's Law/Metric corruption)
          6.  War Strike (Nuclear Program): **No** (Adversarial manipulation/Insider trading)
          7.  Drug Approval (Safety/Efficacy): **Yes**
          8.  Organ Allocation (Survival?): **No** (Rights/Justice issue)
          9.  Bank Failure (Self-fulfilling prophecy): **No** (Reflexivity)
      *   **Specific Conflicts to Resolve:**
          *   Waste Site (No) vs. Light Rail (Yes).
          *   Drug Approval (Yes) vs. Organ Allocation (No).
      *   **New Case to Evaluate:** Removing a dam (Property values + Fish counts).
      *   **Constraint:** Assume standard *futarchy* setup (markets run for each option, option with highest predicted welfare is chosen, rejected markets don't resolve).
      *   **Goal:** Tell the user which verdicts they might need to give up if they adopt the derived principle.

  2.  **Deconstruct the Verdicts & Identify Themes:**

      *   *Yes Cases:* Light Rail, Central Bank, Drug Approval.
          *   Commonality: Aggregate welfare, technical expertise, systemic stability, broad impact, less about individual rights.
      *   *No Cases:* Waste Site, Parole, School Curriculum, War Strike, Organ Allocation, Bank Failure.
          *   Commonality: Distributional injustice (Waste), Individual Rights/Justice (Parole, Organs), Metric Corruption (School), Adversarial Manipulation (War), Reflexivity/Self-fulfilling (Bank).

  3.  **Analyze the "Hard Pairs":**

      *   **Pair 1: Light Rail (Yes) vs. Waste Site (No).**
          *   *User's Reason:* Market picks poorest town (distributional unfairness).
          *   *Futarchy Nuance:* In futarchy, the metric is "welfare." If the metric is *aggregate* welfare, the market *will* sacrifice the minority for the majority.
          *   *Distinction:* Light rail is generally a *public good* with diffuse benefits/costs. Waste siting is a *concentrated cost* for diffuse benefit.
          *   *Principle:* **Distributional Constraints / Rights.** Futarchy maximizes *aggregate* utility. It fails when the decision requires protecting minority rights or preventing concentrated harm, even if aggregate welfare goes up. Light rail is seen as broadly beneficial; Waste siting is seen as locally catastrophic for specific groups.

      *   **Pair 2: Drug Approval (Yes) vs. Organ Allocation (No).**
          *   *User's Reason:* Both are life-and-death.
          *   *Distinction:* Drug approval is about *general safety/efficacy* for a population (regulatory standard). Organ allocation is about *individual triage* (who lives vs. who dies).
          *   *Futarchy Nuance:* Drug approval asks "Does this drug help people on average?" Organ allocation asks "Which specific person gets to live?"
          *   *Principle:* **General Policy vs. Individual Adjudication.** Futarchy works for setting rules/standards (regulations). It fails when applied to specific individual cases where rights/due process matter more than utilitarian calculation.

      *   **Other No Cases:**
          *   *Parole:* Individual adjudication (like Organs).
          *   *School:* Goodhart's Law (Metric validity).
          *   *War:* Information Asymmetry/Manipulation (Market integrity).
          *   *Bank:* Reflexivity (Market impact).

  4.  **Synthesize Principles:**

      I need a framework that captures:
      1.  **Metric Validity:** Is the welfare measure actually capturing what we want? (Schools)
      2.  **Market Integrity:** Can the market be manipulated or does it change the outcome? (War, Bank)
      3.  **Rights/Distribution:** Does the decision violate rights or unfairly burden a minority? (Waste, Parole, Organs)

      *Hanson's Futarchy* relies on "Welfare." The user's intuitions suggest "Welfare" isn't enough. We need *Constrained* Welfare Maximization.

      *Proposed Principle:* **The Principle of Legible Aggregation without Rights Violation.**
      Or simpler: **The Domain of Impersonal Policy.**
      Futarchy works for *impersonal, aggregate, technical* decisions. It fails for *personal, distributive, or rights-based* decisions.

      Let's refine this into three specific filters:
      1.  **Non-Reflexivity:** The market price shouldn't change the outcome (Bank, War).
      2.  **Metric Integrity:** The metric shouldn't be gameable in a way that destroys value (Schools).
      3.  **Rights/Distributional Constraint:** The decision shouldn't trade specific individual rights or concentrated suffering for aggregate gain (Waste, Parole, Organs).

  5.  **Address the "Hard Pairs" with the Principles:**

      *   *Rail vs. Waste:* Both pass Non-Reflexivity and Metric Integrity (mostly). The differentiator is **Rights/Distribution**. Rail is diffuse benefit/cost. Waste is concentrated cost. Futarchy lacks a mechanism to weight the minority heavily enough.
      *   *Drug vs. Organ:* Drug is **Impersonal Policy** (does this molecule work?). Organ is **Individual Adjudication** (who gets the kidney?). Futarchy is a policy tool, not a court.

  6.  **Evaluate the New Case: Dam Removal.**
      *   *Metrics:* Property values + Fish counts.
      *   *Analysis:*
          *   Reflexivity? Low. Market price won't remove the dam.
          *   Metric Integrity? "Property values" is okay, "Fish counts" is objective. But does "Property values + Fish counts" capture *all* welfare? What about recreational use, cultural significance, downstream effects?
          *   Rights/Distribution? Who loses property value? Who gains? If it floods a specific upstream town to save downstream fish, that's a Waste Site problem. If it's general regional improvement, it's a Light Rail problem.
      *   *Verdict:* Likely **Yes**, *provided* the welfare metric is robust and doesn't hide concentrated harm.

  7.  **Identify Verdicts to Give Up:**
      *   If we accept the "Rights/Distribution" constraint, the user's **Drug Approval (Yes)** might be shaky if the approval process ignores rare but catastrophic side effects for a minority (concentrated harm). However, regulatory approval is usually about *standards*, so it stays.
      *   The **Light Rail (Yes)** is the most vulnerable. If the rail line displaces a poor neighborhood (concentrated cost) for rich commuters (diffuse benefit), the principle says **No**. The user assumes Light Rail is benign. The principle forces the user to acknowledge that if Light Rail has distributional impacts like Waste Siting, it must be treated the same.
      *   The **Central Bank (Yes)** is vulnerable to Reflexivity. Markets *do* influence inflation expectations. But usually, this is desired (signaling).
      *   *Biggest Tension:* The user says **Yes** to Light Rail but **No** to Waste. The principle implies these are the *same type* of decision (infrastructure/siting). The only difference is the *distribution of harm*. The principle forces the user to admit: **If the Light Rail harms a specific minority disproportionately, it must also be No.**

  8.  **Drafting the Response:**

      *   *Introduction:* Acknowledge the sophistication of the intuitions. They align with critiques of utilitarianism and market mechanism design.
      *   *The Core Principle:* **Constrained Utilitarianism via Impersonal Policy.** (Let's call it the **Rights-Reflexivity-Metric (RRM) Framework**).
      *   *Filter 1: Reflexivity & Manipulation.* (Bank, War).
      *   *Filter 2: Metric Validity (Goodhart).* (Schools).
      *   *Filter 3: Rights & Distribution.* (Waste, Parole, Organs).
      *   *Resolving the Pairs:*
          *   Rail vs. Waste: It's about *concentrated harm*. If Rail has concentrated harm, it's a No.
          *   Drug vs. Organ: It's about *Policy vs. Adjudication*.
      *   *The Dam Case:* Apply the filters.
      *   *The Sacrifice:* Which verdict must go? The Light Rail one is the most conditional. If it displaces people, it's a Waste Site. Also, the Drug Approval one needs nuance (population vs. individual).

      *Self-Correction on Futarchy Mechanics:* The prompt specifies: "markets for each option... rejected markets never resolve."
      *   *Implication:* This mitigates self-fulfilling prophecies *somewhat* (the "Bank Failure" market for the option where we *save* the bank resolves; the one where we *let it fail* doesn't). However, the *act* of running the market can still signal panic.
      *   *Implication for War:* If we run a market on "Strike," insiders can trade to make the strike look bad/good to influence the decision. Even if the "No Strike" market doesn't resolve, the trading activity leaks info.
      *   *Implication for Waste:* The market aggregates willingness-to-pay. Poor towns have less WTP. Hence the injustice.

      *Refining the "Sacrifice":*
      The user wants to know which *of their verdicts* they must give up.
      If the principle is "No concentrated harm," then Light Rail is only a Yes if it *doesn't* have concentrated harm. The user treats it as a blanket Yes. I should point out that consistency requires evaluating the *distribution* of the Rail project.
      Also, Drug Approval is a "Yes". But if a drug saves 1000 people and kills 10 horribly, futarchy might pass it. Is that acceptable? Usually yes for regulation.
      Actually, the **Central Bank** case is tricky. Markets on inflation *are* reflexive. But that's often the point (anchoring expectations).
      Let's focus on the **Light Rail vs. Waste** inconsistency. That's the clearest contradiction. They are both infrastructure projects. The only difference is the distribution of costs. The principle forces the user to admit Light Rail is *conditional*, not absolute.

      *Wait, one more thing:* The "Rejected markets don't resolve" rule.
      *   *Bank Failure:* If we bet on "Save Bank" vs "Let Fail". If "Save" wins, "Let Fail" doesn't resolve. Does the trading on "Let Fail" cause a run? Yes, because the public sees the price. So Reflexivity still holds.
      *   *War:* If "Strike" market shows low success probability, enemies know we are hesitant. They can trade to manipulate that signal.

      *Final Plan:*
      1.  Define the **Three Filters** (Reflexivity, Metric Integrity, Distributional Rights).
      2.  Apply to the Pairs.
      3.  Apply to Dam.
      4.  Identify the Verdict to Surrender (Light Rail's unconditional Yes).

  9.  **Refining the Output Structure:**
      *   Start with the Principle (The "Futarchy Boundary Condition").
      *   Break down the 3 Filters.
      *   Resolve the Conflicts (Rail/Waste, Drug/Organ).
