answer: |-
  You have not invented a problem to avoid Ray. You have identified a specific blind spot in the philosophy of social action.

  The short answer is: **No, there is no standard term for this.** In the dominant frameworks (Bratman, Gilbert, Searle), what you are describing is technically classified as something lesser than what it feels like, or it is treated as a failure case. However, your intuition that the *coordination* is genuine while the *acknowledgment* is load-bearingly absent is philosophically sound. It points to a gap between the *ontology* of joint action (are we doing it together?) and the *epistemology* of joint action (do we know that we know we're doing it together?).

  Here is the breakdown of where your "Ray Scenario" fits, where it breaks the existing models, and a proposed label for the phenomenon.

  ### 1. The Standard Models (and why they reject Ray)

  To understand why this doesn't have a name, you have to see where the big theories draw the line.

  **The Shared Intention Account (e.g., Michael Bratman)**
  *   **The Theory:** For an action to be truly "joint" (Shared Intention), three things are needed: mutual responsiveness, commitment to the joint activity, and **common knowledge** of these attitudes.
  *   **The Verdict on Ray:** Bratman would say this is *not* joint action. Without common knowledge (you knowing that he knows that you know), it fails the test. It is classified as **"Interlocking Individual Intentions."**
  *   **Why it feels wrong:** Interlocking intentions usually describes strangers passing on a sidewalk (I move left because I see you move left). It implies a lower degree of cohesion. Your description involves shared responsibility ("we beat it") and meshing sub-plans that usually require a "we." Bratman's model cannot account for the *depth* of coordination you have without the *common knowledge* component.

  **The Joint Commitment Account (e.g., Margaret Gilbert)**
  *   **The Theory:** Joint action requires a "pooling of wills" created through an expression of readiness to enter a commitment. It creates obligations.
  *   **The Verdict on Ray:** This is a hard no. Gilbert requires openness. The secrecy/silence here violates the formation condition. If you can't say "we are committed," you aren't committed.
  *   **Why it feels wrong:** You *do* feel obligated. If Ray didn't show up, you'd feel the absence not just as a logistical gap, but as a relational rupture. Gilbert's model misses the normative force that exists without the explicit commitment.

  **The We-Intention Account (e.g., John Searle)**
  *   **The Theory:** "We-intend" is a primitive state in the individual mind. I can "we-intend" even if I'm a brain in a vat.
  *   **The Verdict on Ray:** Closer, but still off. Searle allows for jointness without communication. However, he requires the individual to internally represent the action as "we." Ray does not do this. Ray internally represents it as "I am preventing a heart attack." You represent it as "I am clearing an obstacle." Neither of you holds a "we-intention." You hold "I-intentions" that produce "we-outcomes."

  ### 2. The Closest Neighbor: Interlocking Intentions

  The standard classification for your driveway is **Interlocking Intentions with High-Fidelity Coordination.**

  *   **What it is:** I intend to do X because I believe you will do Y. You intend to do Y because you believe I will do X.
  *   **Where it stops fitting:** In standard Interlocking Intentions, if the coordination fails, the blame is individual ("He didn't hold up his end"). In your case, the blame is shared ("We didn't beat it"). Also, standard Interlocking Intentions don't usually require the *active suppression* of mutual belief. Usually, if we realize we are interlocking, we just admit it. In your case, admitting it breaks the mechanism.

  ### 3. Coining the Concept: "Epistemically Fragile Joint Action"

  Since the existing terms either deny the jointness (Bratman/Gilbert) or misidentify the internal state (Searle), here is a label that captures the specific mechanics you described:

  **Epistemically Fragile Joint Action (EFJA)**

  **Definition:** A cooperative activity where the coordination, responsiveness, and outcome-responsibility are functionally identical to Shared Intention, but the *common knowledge* of the jointness is actively suppressed or absent because introducing it would alter the motivational structure required to sustain the action.

  **The Edges (What makes it stop being EFJA):**

  1.  **The Coordination Threshold:** If the coordination drops to mere compatibility (e.g., you shovel your side and he shovels his, and you just happen to finish at the same time), it reverts to **Parallel Action**. EFJA requires *meshing* (trading the good shovel, hand signals at the river). If you could do it just as well without watching him, it's not EFJA.
  2.  **The Sincerity Condition:** If one of you is secretly thinking "We are a team" but just being polite, it is **Strategic Concealment**. EFJA requires that both parties sincerely hold the individualistic explanation ("I'm doing this for me/him," not "for us"). If one person admits the "we" internally, the fragility shifts.
  3.  **The Symmetry of Denial:** If Ray admits "We are a team" but you insist "No, I'm just clearing my path," the arrangement collapses into **Charity** or **Patronage**. Ray becomes the helper, you become the helped. EFJA requires symmetrical denial to maintain equal status.
  4.  **The Naming Effect:** Does it survive being named? **No.** This is the defining feature. If you sit Ray down and say, "We have a joint intention here," you convert EFJA into standard **Shared Intention**. In doing so, you likely destroy the specific motivational engine (his pride, your awkwardness) that powered the EFJA. It becomes a "normal" joint project, which carries different obligations and social weights. The "load-bearing silence" is removed, and the structure might fall.

  ### 4. Why the Literature Missed This

  Philosophy of action tends to assume that **Common Knowledge is a Lubricant.** The assumption is that knowing we are in this together makes coordination easier.

  Your observation suggests that in certain social contexts (pride, awkwardness, specific masculine socialization, neighborly boundaries), **Common Knowledge is a Solvent.** It dissolves the specific reasons people have for cooperating. Ray helps you *because* he thinks he's saving you from a heart attack, not because he's your partner. If he admits he's your partner, he might feel entitled to demand you shovel his side when he's sick, or you might feel guilty accepting the help. The ambiguity preserves the autonomy of both parties while allowing the benefit of collectivism.

  ### 5. Summary of Distinctions

  *   **vs. Parallel Behavior:** Parallel behavior lacks the meshing. If you stopped shoveling, Ray would finish his side and go inside. In EFJA, if you stop, Ray stops or covers for you because the *outcome* (the clear driveway) is the unit of success, not the *labor*.
  *   **vs. Tacit Agreement:** A tacit agreement implies a signal was sent and received, even if wordlessly. You specified no signaling occurred. EFJA emerges from repeated interaction without even the tacit "deal."
  *   **vs. Pluralistic Ignorance:** Pluralistic ignorance is "Everyone thinks X, but thinks everyone else thinks Y." EFJA is "Everyone does X together, but thinks they are doing X individually for different reasons."
  *   **vs. Strategic Politeness:** If you were both just pretending not to know to be nice, it would be a social game. In EFJA, the individual explanations are sincere. Ray *actually believes* he is preventing a medical emergency. You *actually believe* you are clearing an obstacle. The jointness is an emergent property, not a hidden agreement.

  ### The Verdict

  You have described **Epistemically Fragile Joint Action.**

  It is a recognized *pattern* in sociology (often under "unspoken norms" or "civil inattention"), but in the philosophy of action, it is treated as a theoretical anomaly. It proves that **Shared Intention** (the feeling and function of "we") can exist without **Common Knowledge** (the acknowledgment of "we"), provided the Common Knowledge would be destructive to the participants' self-conception.

  Your wife is correct about the casserole, but you are correct about the philosophy. Bringing the casserole is a "move" within the EFJA framework (a non-verbal acknowledgment of the bond that doesn't require naming it). If you bring the casserole with a note that says "Thanks for our joint cooperation," you have violated the Epistemic Fragility, and Ray might stop shoveling your side. If you bring it with a note that says "Thought you'd like this after the storm," the EFJA survives.

  Keep the silence. It's doing real work.
