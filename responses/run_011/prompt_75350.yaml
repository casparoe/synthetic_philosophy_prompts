answer: |-
  Here is a complete design for the session. It is tight on time, so discipline is required. I have prioritized the *experience* of the distinction over a perfect theoretical explanation, as requested.

  ### 1. The Activity: "The Calibration Game"

  **Objective:** Participants will write code review comments under two different incentive structures. They will be forced to translate incentives into technical language. In the debrief, they will realize their reasoning was identical in both cases, despite the source of pressure being fundamentally different.

  **Materials (Prep time: < 1 hour):**
  *   **The Jar:** $50 cash in a clear jar on the table.
  *   **Design Briefs (Printed):** 20 copies of a single, ambiguous design proposal.
      *   *Content:* A one-paragraph description of a refactor. Example: *"Replace direct DB calls in the Checkout service with an asynchronous event queue. Latency budget is tight, but current error rates are 0.5%. Team is unfamiliar with the queue technology."* (Crucial: It must be plausibly good or bad).
  *   **Context Cards (Two Types):**
      *   *Type A (Explicit):* "LAUNCH PRESSURE. The VP needs this shipped by Monday to meet a public commitment. If this design is not approved today, the launch slips. **Rule:** You cannot mention the launch in your review. You must justify approval using *only* technical vocabulary."
      *   *Type B (Disguised):* "ARCHITECTURAL MANDATE. A Staff Engineer has declared this pattern 'Standard' for the org. Deviating requires a waiver. **Rule:** You must justify approval by referencing the 'Standard Pattern' and its technical benefits."
      *   *(Note: In reality, the 'Standard Pattern' mandate exists only to ensure the launch happens. The pressure is identical; the packaging is different.)*
  *   **Review Templates:** Simple slips of paper with fields: "Verdict (Approve/Request Changes)", "Primary Technical Justification", "Risk Mitigation".
  *   **Whiteboard:** For tallying votes.

  **Roles:**
  *   **Reviewers:** Everyone.
  *   **Auditors (3 people):** Assign the person who dislikes games and the two senior engineers to this role. Their job is not to play, but to enforce the "No Business Talk" rule during the writing phase. This gives them authority without forcing "fun."
  *   **Facilitator:** You.

  **Timeline (75 Minutes):**

  *   **00:00 – 00:05: Setup & Stakes.**
      *   Place the jar in the center. "This $50 goes to the table that writes the most technically convincing approval for this ambiguous design. If no table convinces the room, I keep it."
      *   Split room into 4 tables (4-5 people each).
      *   Hand out Design Briefs.
  *   **00:05 – 00:20: Round 1 (Explicit Pressure).**
      *   Hand Type A Cards to all tables.
      *   **Task:** Write a review approving the design.
      *   **Constraint:** Auditors patrol. If anyone says "launch," "VP," or "deadline," the table is disqualified from the $50.
      *   **Output:** One consensus review per table.
  *   **00:20 – 00:35: Round 2 (Disguised Pressure).**
      *   Collect Round 1 reviews. Hand Type B Cards.
      *   **Task:** Write a review approving the *same* design.
      *   **Constraint:** Same as above. No mention of "mandates" or "waivers." Focus on technical merit.
      *   **Output:** One consensus review per table.
  *   **00:35 – 00:45: The Blind Swap.**
      *   Collect all Round 1 and Round 2 reviews. Shuffle them.
      *   Post 8 reviews on the whiteboard (4 from Round 1, 4 from Round 2). Do not label which is which.
      *   **Vote:** Each participant gets 2 sticky dots. Vote for the reviews that sound most "Technically Sound."
      *   **Reveal:** Mark which reviews came from Round 1 (Explicit) and which from Round 2 (Disguised).
  *   **00:45 – 01:15: Debrief.** (See Section 4).

  ---

  ### 2. Emergence & Terminology

  Do not explain the distinction before the vote. The "Reveal" in the timeline above is the moment of emergence. When they see that the reviews generated by "VP Pressure" are indistinguishable from (or voted higher than) the reviews generated by "Architectural Mandate," the distinction collapses in practice.

  **In the Debrief (The Naming):**
  Once the confusion is palpable, introduce the terms.
  *   **Right Kind Reasons (RKRs):** Reasons that bear on the truth of the judgment. (e.g., "The queue decouples failure domains.")
  *   **Wrong Kind Reasons (WKRs):** Reasons that bear on the *benefit of holding* the judgment. (e.g., "I will get a bonus if I approve this," or "The VP needs this.")

  **Canonical Illustrations (for the whiteboard):**
  1.  **The Demon:** "A demon threatens to torture you unless you believe that 2+2=5." The threat is a real reason to *want* to believe it, but it cannot make 2+2=5 true. It is a WKR.
  2.  **The Pascal Wager:** "Believe in God because the payoff is infinite." The payoff is a reason to *act* as if you believe, or to try to cultivate belief, but it is not evidence of God's existence.

  **The Point:** In Round 1, you were given a Demon (Launch Slip). In Round 2, you were given a Pascal Wager (Standard Pattern). But because you were forbidden from speaking the incentive directly, you had to convert the WKR into an RKR to win the game.

  ---

  ### 3. Structural Features

  *   **Explicit Pressure (Round 1):** The Type A Card explicitly states the business consequence. The "No Business Talk" rule forces the translation mechanism you described ("loosening what maintainable means").
  *   **Disguised Pressure (Round 2):** The Type B Card frames the pressure as a technical fact ("Standard Pattern"). Participants treat this as an RKR, even though its origin is the same business pressure.
  *   **Indistinguishability:** By shuffling the reviews for the vote, you prove that the *output* of motivated reasoning looks identical to the output of genuine technical assessment. If they cannot tell which review came from which round, they have proven your hypothesis: the leakage is real.

  ---

  ### 4. The Debrief & The Monday Test

  **Mapping Moments:**
  *   **The Disqualification Rule:** Map this to "Code Review Norms." We socially forbid admitting WKRs ("Don't mention the deadline"), which forces us to smuggle them in as RKRs.
  *   **The Vote:** Map this to "Team Consensus." If the group accepts the smuggled WKR as valid, the belief becomes socially reinforced.
  *   **The Feeling:** Ask: "In Round 1, did you feel like you were lying?" (Most will say yes). "In Round 2, did you feel like you were lying?" (Most will say no). "But the pressure was the same." This highlights the danger of the disguise.

  **The Monday Test: "The Substitution Test"**
  Give them this heuristic for their next PR:
  > When you read a justification (yours or someone else's), try to swap the *incentive* for a *fact*.
  > *   *Comment:* "We should accept this tech debt because we need to hit the Q3 OKR."
  > *   *Substitution:* "We should accept this tech debt because [Technical Fact]."
  > *   *Result:* If the sentence breaks or becomes false ("...because Q3 OKRs reduce coupling"), you have identified a WKR masquerading as an RKR.
  > *   *Action:* It doesn't mean you reject the PR. It means you label it: "Approving for Business Reasons, acknowledging Technical Risk."

  ---

  ### 5. Predictable Failures & Mitigations

  **1. The Smart Alec (Diagnoses the mechanism early)**
  *   *Risk:* They announce "This is about Wrong Kind Reasons!" in Round 1, ruining the tension.
  *   *Mitigation:* Pre-frame this in the intro. "One of you has probably read the philosophy blogs I have. If you know what this is about, I need you to carry the water. Don't spoil it. Your challenge is to see if you can feel the pressure even when you know the trick."
  *   *Backup:* If they spoil it, pivot: "Great, you know the theory. Now prove you can't stop yourself from doing it."

  **2. The Senior Engineers (Dominating the conversation)**
  *   *Risk:* They dictate the review text, bypassing the group's internal conflict.
  *   *Mitigation:* **Silent Writing First.** In both rounds, mandate 5 minutes of silent individual drafting before any discussion. The Auditors enforce silence. This ensures everyone engages with the tension individually before the seniors synthesize.

  **3. The Game Hater (Openly dislikes games)**
  *   *Risk:* Disengagement or cynicism poisons the room.
  *   *Mitigation:* The **Auditor Role**. Do not ask them to "play." Give them the clipboard. Their job is to catch rule violations. This leverages their skepticism as a quality control mechanism. "I need you to ensure the data is clean. If they cheat, call it."

  **4. The Cynic (Concludes "All Review is Politics")**
  *   *Risk:* They leave thinking RKRs don't exist.
  *   *Mitigation:* You must explicitly validate RKRs in the debrief. "The danger isn't that business pressure exists. It's that we pretend it's technical truth. If we admit it's business pressure, we can manage the risk. If we pretend it's technical truth, we accumulate invisible debt."

  ---

  ### 6. Preventing the Cynical Backfire

  The session backfires if participants conclude that *technical truth is impossible* and *only incentives matter*.
  **Prevention Mechanism:**
  In the Debrief, draw a 2x2 matrix on the whiteboard:
  *   **Axis 1:** Reason Type (Right vs. Wrong)
  *   **Axis 2:** Validity (Valid vs. Invalid)

  Show that WKRs are **Valid Reasons to Act**, just **Invalid Reasons to Believe**.
  *   *Example:* "Shipping for the deadline is a valid reason to *merge*. It is an invalid reason to claim the code is *bug-free*."
  *   **Closing Statement:** "We are not here to eliminate politics. We are here to stop calling politics 'engineering.' When you know it's a WKR, label it. 'Approved for Launch Velocity.' That is professional integrity. Pretending it's 'Scalable' is what breaks the system."

  ---

  ### 7. Limitations & The Leakage Hypothesis

  **What the Game Cannot Reproduce:**
  *   **Real Career Risk:** The $50 jar is trivial compared to a performance review or a VP's anger. The *intensity* of the self-persuasion will be lower than in production.
  *   **Long-term Belief:** The game lasts 15 minutes per round. Real self-persuasion happens over weeks of defending a decision. You cannot simulate the calcification of belief in 75 minutes.

  **Assessment of Your Leakage Hypothesis:**
  *   *Hypothesis:* "The only reliable way to say it convincingly is to come to believe it."
  *   *Verdict:* The activity can **illustrate** the mechanism, but not **test** the hypothesis.
  *   *Why:* To test it, you would need to measure their private belief *before* the incentive and *after* the review, controlling for social desirability bias. In a group setting, their public statements (the review) will always align with the incentive. You cannot know if they *privately* changed their mind or just became better actors.
  *   *What to supply:* You must supply the **introspective prompt**. In the debrief, ask: "In Round 1, by the time you finished writing, did you feel the design was actually better than you thought at the start?"
      *   If they say "Yes," your hypothesis holds for them.
      *   If they say "No, I was just writing what you wanted," then for them, the leakage didn't happen.
      *   *Your Job:* Validate both experiences. "For some of you, the mask fused to the face. For others, it stayed a mask. The danger is when you forget which one you are."

  **Cut for Time:**
  If you run long, cut the **Vote** phase (00:35-00:45). Instead, simply ask two tables to read their Round 1 review and two tables to read their Round 2 review. Ask the room: "Which was which?" The result will be the same (confusion), but it saves 10 minutes for the Debrief, which is the most critical component. I recommend cutting the vote if you feel the energy lagging.
