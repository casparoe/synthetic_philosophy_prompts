      *   **The Pair:**
          *   *Philosopher (Retributivist/Desert-Theorist):* Punishment requires desert. Desert sets a ceiling (no utilitarian gain can exceed it) and a floor (can't go below just because it's useless, though floor is less determinate). Victims owed acknowledgment/reparation, not just hard treatment.
          *   *Criminologist (Consequentialist/Utilitarian):* Justification is balance of consequences. Proportionality is a summary device for credibility/cooperation. Willing to accept longer sentences than bare deterrence needs for credibility, but denies any sentence is *unjust in principle* if best on the whole.
      *   **Required Sections:**
          1.  *Numbered Claims:* Joint agreement on bill, punishment, evidence (no platitudes).
          2.  *Disagreements Table:* Question, Side A position, Side B position, Condition for giving way. (Must pass "read aloud in absence" test).
          3.  *Cruxes:* Sub-questions that would move them. Accepted evidence type, predictions (including expectation of other's reaction).
          4.  *Verbal Disputes:* What turned out to be semantic (e.g., justification of institution vs. who/How much). What's left over.
          5.  *Closing Recommendation:* Actionable for legislature OR statement of what decision turns on.
      *   **Exhibit Cases (must be worked through):**
          1.  *Getaway Driver (19yo -> 20yo plea, now served 13 of 8-14 range):* Low risk, rehabilitated, kids. Commission reviewing file.
          2.  *Fraudster (50s, 6x recidivist, $40k each, high risk score):* Legislature asks if commission can recommend departure *above* ceiling due to aggregate harm/risk.
      *   **Specific Crux to Address:** If legislature cut all sentences by 20% to fund treatment (ratios unchanged), is there a principled objection? Does proportionality constrain ordering or magnitude?
      *   **House Rules:** No citations/stats. Qualitative evidence descriptions. Disagreement descriptions must be acceptable to the party.

  2.  **Deconstruct the Voices & Positions:**

      *   *Philosopher:* Needs to sound principled, focused on rights, limits, and moral status. Key constraint: The Ceiling is hard. The Floor is soft but real.
      *   *Criminologist:* Needs to sound pragmatic, focused on systems, outcomes, and credibility. Key constraint: The Ceiling is policy, not moral law. Outcomes trump abstract justice.
      *   *Joint Voice:* Needs to be unified but allow for distinct positions in the disagreement sections. It shouldn't sound like a compromise that satisfies no one, but a map of where they stand together and where they diverge.

  3.  **Drafting - Section by Section:**

      *   **Title:** Needs to sound official but collaborative. "Joint Statement on Sentencing Reform..."
      *   **Introduction:** Brief context setting.

