          *   *Key Disagreement 3:* The 20% Cut Crux. (Proportionality of magnitude vs. ordering).
          *   *Condition for Giving Way:* What would change their minds? (Philosopher: Moral argument showing rights aren't violated. Criminologist: Data showing system collapse or massive harm reduction).

      *   **Section 3: Cruxes:**
          *   Need specific sub-questions.
