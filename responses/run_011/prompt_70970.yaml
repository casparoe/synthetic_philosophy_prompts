answer: |-
  The activity is a three-round prediction game where students bet on a coin flip versus a hidden number chosen by you or a peer, designed to expose how ambiguity aversion collapses under benevolent framing but resurfaces as rational caution against an adversary.

  ### Materials and Setup
  *   **Materials:** 16 pre-numbered slips of paper (1–16), 16 pencils, 3 large envelopes, 1 coin, 1 tin of biscuits, whiteboard and markers.
  *   **Room:** Seminar table or arranged seating where you can see everyone.
  *   **Preparation:** Write a number between 1 and 100 on a slip of paper and seal it in Envelope 1 (Neutral). Seal a second slip in Envelope 2 (Benevolent). Keep Envelope 3 empty for the Adversarial round.
  *   **Anonymity & Scoring:** As students enter, hand them a numbered slip (1–16) and tell them this is their **Player ID** for the seminar. They keep this ID. You maintain a private key linking ID to Name for the prize. All choices are submitted on slips bearing only the Player ID. You will transcribe these IDs and choices onto the board during the debrief so the class sees the distribution without knowing who chose what.

  ### Running Order (90 Minutes)

  **1. Introduction (10 mins)**
  Explain the stakes: points accumulate across three rounds. The highest score wins the biscuits. In the event of a tie, the winner is chosen by a final tie-breaker guess (e.g., closest to the number of words in the seminar description). Explain that each round involves choosing between **Option R (Risk)** and **Option A (Ambiguity)**.
  *   **Option R:** A coin flip. Heads = 1 Point. Tails = 0 Points.
  *   **Option A:** A comparison against a hidden number. If your guess matches the condition, 1 Point. Else 0 Points.

  **2. Round 1: The Neutral Oracle (15 mins)**
  *   **Setup:** Hold up Envelope 1. Tell them: "Inside is a number between 1 and 100 that I wrote down before class. I used no specific method. I might have picked my birthday, or just thought of a digit. You do not know the distribution."
  *   **The Choice:** They must choose:
      *   **Option R:** Win if Coin = Heads.
      *   **Option A:** Win if Envelope Number > 50.
  *   **Action:** Students write ID and choice (R or A) on a slip. Collect them. Tally the results privately.
  *   **The Reveal:** Do not open the envelope yet. Keep the suspense for the final scoring.

  **3. Round 2: The Benevolent Frame (15 mins)**
  *   **Setup:** Hold up Envelope 2. Tell them: "Inside is a number between 1 and 100. However, this time I want you to win. I have chosen this number specifically to make Option A successful for the majority of the class, though I cannot guarantee it for every individual guess."
  *   **The Choice:** Same structure.
      *   **Option R:** Win if Coin = Heads.
      *   **Option A:** Win if Envelope Number > 50.
  *   **Psychological Hook:** You are not changing the odds objectively (you could still pick 51), but you are changing the *decision problem*. In Round 1, they were betting on an unknown process (Chance vs. Unknown Intent). In Round 2, they are betting on your benevolence.
  *   **Action:** Collect slips. Tally privately.
  *   **Note:** Actually pick a number > 50 (e.g., 75) to validate the frame.

  **4. Round 3: The Adversarial Stretch (15 mins)**
  *   **Setup:** Select one student volunteer (The Adversary). Give them Envelope 3 and a slip of paper. Tell them: "Your goal is to minimize the total points awarded in this round. You know how many students chose Option R and how many chose Option A in this round (you will tell them the aggregate counts after they choose, or better, let them choose then you reveal the counts). Actually, to make it work: The Adversary sets the number *after* seeing the aggregate choices."
  *   **Correction for Flow:** To keep it tight, the Adversary sets the rule *after* choices are submitted but *before* the number is revealed.
  *   **The Choice:**
      *   **Option R:** Win if Coin = Heads.
      *   **Option A:** Win if Envelope Number > 50.
  *   **Action:** Students submit choices. You count the slips aloud: "10 chose R, 6 chose A."
  *   **The Twist:** Hand the count to The Adversary. They write a number in Envelope 3. If most chose A, they write 40. If most chose R, it doesn't matter (coin is independent), but they should write 40 to punish A.
  *   **Reveal:** Open all three envelopes. Tally scores.

  **5. Scoring and Winner (15 mins)**
  *   Calculate scores on the board using the ID list you transcribed.
  *   Option R winners: Determined by your coin flip (do this live for Rounds 1 & 2 now, or pre-flip and record). *Correction:* Flip the coin live for Rounds 1 and 2 now to resolve scores.
  *   Option A winners: Determined by the envelope numbers.
  *   Announce the winner. Award biscuits.

  **6. Debrief (20 mins)**
  *   **Board Work:** Draw a table with columns: ID, Round 1, Round 2, Round 3. Fill it with the R/A choices.
  *   **Discussion Points:**
      1.  **Risk vs. Ambiguity (Round 1):** Map Option R to Risk (known probability) and Option A to Ambiguity (unknown probability distribution). Ask those who chose R in Round 1 why. Expect citations of the Principle of Indifference. Challenge them: "Why is the coin 50/50 but the number not?" This exposes that the coin's physics are trusted, whereas the instructor's psychology is not.
      2.  **The Framing Shift (Round 1 vs 2):** Highlight students who switched from R to A. Ask: "Did the probability change?" (Objectively, no; subjectively, yes). Discuss whether this violates rationality or updates a prior on your trustworthiness. Map this to the **Sure-Thing Principle**: If you prefer R over A when the state is 'Neutral', should you not prefer R over A when the state is 'Benevolent'? (Actually, Benevolence changes the payoff structure, so it's not a strict violation, but it feels like one).
      3.  **The Adversarial Stretch (Round 3):** Highlight those who switched back to R. Ask: "Is this ambiguity aversion or rational caution?" This is the crux. In Round 1, ambiguity was a bias (Ellsberg). In Round 3, ambiguity was a threat (Game Theory).
      4.  **The Decision Problem:** Drive home the constraint you requested. In Round 1, they didn't know *which game* they were playing (Chance vs. Psychology). In Round 3, they knew it was a Zero-Sum Game. The ambiguity wasn't about the draw; it was about the *rules of engagement*.

  ### What Predictably Goes Wrong
  Be prepared for these three failures; they are features, not bugs, of running this with philosophers.

  1.  **The Cynic Effect:** One or two students will refuse to believe the "Benevolent" frame in Round 2. They will argue that you are still adversarial or indifferent. This contaminates the data because their switch (or lack thereof) isn't about ambiguity aversion but about distrust of the experimenter. *Mitigation:* Acknowledge this in the debrief as "Second-order ambiguity" (uncertainty about the framing itself).
  2.  **Gaming the System:** Because they are postgrads, they may discuss the strategy between rounds. If they realise the Adversary in Round 3 minimises points, they might all coordinate to choose Option R to deny the Adversary agency. This collapses the variance needed for the lesson. *Mitigation:* Enforce strict no-talk between rounds.
  3.  **The Tie Problem:** With only 3 rounds and binary outcomes, you will likely have multiple winners. *Mitigation:* Have a tie-breaker ready (e.g., "Guess the exact number in Envelope 1").

  ### What This Exercise Cannot Reproduce
  You must argue verbally for the one feature this seminar room setup lacks: **Consequence.**
  In real-world decision theory (finance, medicine, policy), ambiguity aversion persists because being wrong costs money or lives, not just points. In this room, the biscuit stake is too low to trigger genuine physiological stress. Consequently, the "aversion" they feel is intellectual, not visceral. They are simulating risk, not enduring it. You must explain that true ambiguity aversion is often a somatic marker (a gut feeling of dread) which biscuits cannot purchase. Without real stakes, you are teaching them about the *logic* of ambiguity, not the *psychology* of it.

  ### Defence of Design Choices
  *   **Why Numbers not Urns:** Urns signal "probability problem" immediately, triggering textbook responses. A hidden number in an envelope signals "psychological problem," which fits the constraint of ambiguity about the decision process (is this chance or intent?).
  *   **Why 50/50 Split:** It keeps Expected Utility identical across Option R and Option A (assuming a uniform prior), isolating the ambiguity variable.
  *   **Why the Adversarial Stretch:** Standard Ellsberg experiments stop at showing the bias. By adding the adversary, you show that the same heuristic (avoid the unknown) is sometimes rational. This prevents the seminar from concluding that "ambiguity aversion is always irrational," which is a common oversimplification in first-year courses.
  *   **Why ID Numbers:** Full anonymity reduces peer pressure, but linking IDs to scores ensures they care about the outcome. Writing the IDs on the board allows you to point to specific data points ("Look at Student 4, they switched twice") without doxxing them.
