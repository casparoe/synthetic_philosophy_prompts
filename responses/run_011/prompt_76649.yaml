  **NORTHERN TIER COLD STORAGE & TRANSIT, LLC.**
  **POLICY DIRECTIVE NT-CC-004**
  **SUBJECT: SOURCE CODE DISCLOSURE AND MUTUAL CONDITIONAL COOPERATION**
  **EFFECTIVE: 01 NOV 2024 | REVISION: 3.1**

  **PREAMBLE**
  This Policy establishes the procedural framework under which Employees ("Submitters") may engage in contractually binding cooperative equilibria with external Counterparties via programmatic interface. Recognizing that trustless trust requires verifiable infrastructure, Northern Tier mandates that all strategic interactions governed by this Directive adhere to the following computational standards. Nothing herein guarantees cooperative outcomes; rather, it guarantees that any outcome reached is compliant with the firm's risk tolerance regarding informational asymmetry.

  **1. COMMON KNOWLEDGE FILING REQUIREMENT**
  All Source Code intended for strategic deployment must be filed with the Compliance Directorate prior to execution. Such filings constitute public record within the meaning of this Policy. Privacy claims regarding algorithmic logic are waived upon submission. For an equilibrium to hold, the Submitting Employee's code must be Common Knowledge among all relevant Counterparties. Failure to disclose a subroutine, including obfuscated dependencies, renders any resulting cooperation non-compliant and subject to clawback.

  **2. AGENCY AND DEVIATION PROTOCOLS**
  Employees are advised that under this Directive, the concept of "unilateral deviation" is administratively null. Because the Employee's action is determined exclusively by the submitted Source Code as a function of the Counterparty's Code, the Employee does not act; the Program acts. Consequently, requests to "act on one's own behalf" outside the logic of the submitted binary will be treated as system errors. Disciplinary action for defection shall only apply if the Employee altered the Source Code post-filing without authorization.

  **3. BYTE-FOR-BYTE IDENTITY AND FORMATTING**
  Cooperative clauses are triggered only upon verification of exact byte-for-byte identity between the submitted hash and the Counterparty's expected hash. Whitespace normalization is strictly prohibited. The presence of a trailing newline, a comment strip, or a compiler-injected timestamp differing from the filed specification shall be interpreted as a defection event. Employees are responsible for configuring build environments to ensure deterministic output. IT Support is not liable for cooperation failures arising from IDE auto-formatting features.

  **4. VERIFICATION RESOURCE BOUNDS**
  Before extending cooperation, the Submitting Employee must possess a formal proof that the Counterparty's Program will cooperate. However, such proofs are subject to strict computational resource bounds. If a valid proof exists but exceeds the allocated cycle time for verification (currently set at 400 milliseconds per transaction), the Employee is mandated to defect. Compliance is satisfied by the attempt to verify, not the success thereof. A timeout is legally equivalent to a negative proof.

  **5. RECURSION TERMINATION AND HALTING**
  To prevent infinite regress wherein Program A reads Program B reading Program A, all submitted code must include a recursion-termination clause. This clause shall resolve indeterminate loops by defecting with a fixed small probability (ε), classified herein as a prudent deadline-management measure. Furthermore, all submissions must be proven halting. The Office of Halting Determinations retains sole authority to classify non-terminating submissions. Appeals regarding halting status must be filed before the end of time.

  **6. COMPLIANCE AND RATIONAL OUTCOMES**
  Employees are reminded that this Policy facilitates coordination but does not mandate it. Any feasible and individually rational outcome is fully compliant, including mutual defection. Nothing in this Directive shall be construed as encouraging cooperation where defection yields higher expected utility. The firm remains neutral regarding the payoff matrix, provided the path to the outcome was procedurally sound.

  **7. PATCHES, HOTFIXES, AND EQUILIBRIUM INVALIDATION**
  Any modification to an Employee's Source Code, including security patches, version updates, or hotfixes, immediately invalidates all existing equilibria dependent on the prior version. Such changes require full re-disclosure and re-verification by all Counterparties. Employees should anticipate that routine maintenance may dissolve ongoing cooperative arrangements. The firm accepts no liability for collaboration breakdowns resulting from standard software lifecycle management.

  **8. FINAL ATTESTATION OF BEST RESPONSE**
  By submitting Source Code under this Policy, the Employee certifies that the submitted logic constitutes a best response to the Counterparty's Code. The Compliance Directorate acknowledges that no finite procedure exists to verify whether a given submission is indeed a best response within the allotted timeframe. Therefore, certification relies entirely on the Employee's word. By signing below, the Employee accepts full responsibility for maintaining the trustless integrity of the system through personal attestation.

  **ACKNOWLEDGED:**
  __________________________
  **Employee Signature**

  **APPROVED BY:**
  **Office of Halting Determinations**

