answer: |-
  # The Capital & Conscience Protocol (CCP)

  This procedure replaces your "Spread Rule" with a system based on **Storable Votes** (for intensity) and **Lexical Priorities** (for values). It assumes that while values are incommensurable, *political capital* is a finite resource that can be measured. It is designed to run in 90 minutes of your six-hour prep window.

  ### Phase 1: The Red Line Check (Complicity & Values)
  *Theory:* Some conflicts are not tradable. If an action violates a member's core identity, no amount of compensation makes it acceptable. This addresses **complicity** and **incommensurability**.

  1.  **Question:** Does any member organization declare this item a "Red Line"?
      *   *Definition:* A Red Line is not "we dislike this." It is "participating in this violates our charter/mission/donor restrictions to the point where we must withdraw from the coalition if it passes."
      *   *Requirement:* Must be declared in writing at the start of the fiscal year or 48 hours before the meeting. Cannot be invented during the meeting to block a trade.
  2.  **Sufficient Answer:**
      *   **Yes:** The item is **removed from the agenda**. No vote, no trade. (Exception: The item can be pursued by a sub-group of members *without* using the coalition's name or money).
      *   **No:** Proceed to Phase 2.
  3.  **Human Handoff:** If two members claim Red Lines that contradict (e.g., "Funding X is sinful" vs. "Not Funding X is genocidal"), the Secretariat must pause the procedure. This is a constitutional crisis, not a bargaining problem. Refer to the Board Chair for mediation.

  ### Phase 2: The Externality Screen (Third Parties)
  *Theory:* Pareto improvements among members can still harm the world. This addresses **third parties**.

  1.  **Question:** Does the Secretariat identify credible evidence that this action causes direct, significant harm to a population *not* represented at the table (e.g., future generations, non-sentient ecosystems, specific unrepresented human groups)?
  2.  **Sufficient Answer:**
      *   **Yes:** The item requires a **Super-Majority Vote (7/9)** to proceed. Trading is suspended. You cannot "buy" the right to harm an outsider.
      *   **No:** Proceed to Phase 3.
  3.  **Note:** If a member organization *represents* the harmed group (e.g., the Health Org represents the farmers affected by the rodenticide ban), they are "at the table." Their opposition counts as a preference, not an externality.

  ### Phase 3: Capital Bidding (Intensity & Inflation)
  *Theory:* 0–10 ratings are cheap talk. Budgets are real. This addresses **intensity** and **strategic inflation**.

  1.  **Setup:** Each member organization receives an annual budget of **100 Priority Points**.
  2.  **Question:** How many points does each organization bid on this item?
      *   *Rule:* Bids are sealed and simultaneous.
      *   *Constraint:* You cannot bid more than your remaining annual balance.
      *   *Constraint:* Minimum bid to trigger a trade consideration is 10 points.
  3.  **Sufficient Answer:** A set of 9 numbers.
      *   *Interpretation:* A bid of 50 points means "I care about this half of my entire year's influence." This forces orgs to distinguish between "nice to have" and "need to have."

  ### Phase 4: Settlement (The Trade)
  *Theory:* Trades only happen when preferences are orthogonal, not opposed.

  1.  **Question:** Is there a "High Bidder" (top 2) and a "Low Bidder" (bottom 2) with a spread of at least 30 points?
      *   **No:** **Stop.** No trade available. Move to Simple Majority Vote. (This prevents trading on issues where everyone cares equally).
      *   **Yes:** Proceed to 2.
  2.  **Question:** Do the Low Bidders explicitly consent to "yield" in exchange for the High Bidders yielding on a *different* item where the Low Bidders are the High Bidders?
      *   *Crucial Change:* **No Credit Ledger.** You do not log "I owe you." You simply spend the points. The "payment" is the *opportunity cost* of the points spent. If Org A spends 40 points to win Item X, they have 60 points left for the year. They cannot demand Org B pay them back later. Org B must spend their *own* points to win Item Y.
      *   *Rationale:* Tracking favors creates resentment and hidden debt. Tracking budget consumption creates transparency and scarcity.
  3.  **Sufficient Answer:**
      *   **Consent Found:** The High Bidder's preference prevails. Points are deducted from all bidders (or just the winner, depending on your fund's rules—I recommend **only the winner pays**, to reward conviction).
      *   **No Consent:** Move to Simple Majority Vote.

  ---

  ### Application to Your Three Cases

  Here is how the CCP runs on your last cycle's conflicts.

  #### Case 1: The Rodenticide Campaign
  *   **Phase 1 (Red Line):** Health Org checks their charter. Does funding a ban on disease-prevention tools violate their mandate? Likely yes. They declare a Red Line.
  *   **Outcome:** **Item Removed.**
  *   **Analysis:** The Animal Org cannot trade for this. The Health Org cannot be compensated to violate its core mission. The coalition stays silent.
  *   **Verdict:** Efficient. Prevents the coalition from funding a civil war.

  #### Case 2: The Gain-of-Function Statement
  *   **Phase 1 (Red Line):** The Longtermist bids high. The two Virology Orgs oppose. The Catholic Charity declares a **Red Line**: "We cannot sign a statement that we believe will result in preventable deaths by chilling research, as this violates our pro-life/sanctity of life mandate."
  *   **Outcome:** **Item Removed.**
  *   **Analysis:** Even if the Longtermist bids all 100 points, the Red Line vetoes it. The "Complicity" concern is lexical; it trumps utility.
  *   **Verdict:** **This is the outcome you will hate.** You will feel the coalition is being held hostage by a minority veto on a "crucial" existential risk issue. You will want to tweak the rule to allow a super-majority override.
  *   **Defense:** Do not tweak it. If you allow the Longtermist to outbid the Catholic Charity on a matter of conscience, the Charity leaves. If the Charity leaves, the coalition loses its legitimacy as a "broad tent." The procedure prioritizes the *existence of the coalition* over the *output of the coalition*. A silent coalition is better than a fractured one. The Red Line protects the diversity that makes the fund valuable in the first place.

  #### Case 3: Homelessness & Climate Trade
  *   **Phase 1 (Red Line):** Homelessness Org wants to drop sobriety rules. Catholic Charity and Disability Org check their charters. Does funding a shelter without sobriety rules violate their safety mandates? If they deem it a safety risk to clients, they declare a Red Line.
      *   *Scenario A (Red Line Declared):* Item Removed. (Trade blocked).
      *   *Scenario B (No Red Line):* They dislike it, but it's not a veto. Proceed to Phase 3.
  *   **Phase 3 (Bidding):**
      *   Homelessness Org bids 40 points (High) on Sobriety Rule change. Bids 5 points on Climate.
      *   Climate Fund bids 40 points (High) on Climate Adaptation. Bids 5 points on Sobriety Rule.
      *   Others bid low on both.
  *   **Phase 4 (Settlement):** Spread is 35 points. High Bidders win their respective items.
  *   **Outcome:** **Trade Approved.** Points are deducted from Homelessness and Climate orgs.
  *   **Verdict:** This is a valid logroll. Both sides cared intensely about orthogonal items. The cost was real (they burned 40% of their annual capital).

  ---

  ### Limitations & The Ledger Question

  **Where this procedure will misfire:**
  1.  **The "Rich" Problem:** An org with a large internal budget might treat the 100 Points as meaningless if they don't correlate to real-world consequences. If they leave the coalition, do they lose money? If not, the points are still cheap talk. *Mitigation:* Tie Points to something tangible, like "Right to place a logo on the press release" or "First right of refusal on next year's admin budget."
  2.  **The "Silent Death":** Phase 1 (Red Lines) will kill more items than you like. You will feel paralyzed. This is a feature, not a bug. It forces you to only bring forward items that don't threaten the coalition's integrity.
  3.  **Third-Party Blindness:** Phase 2 relies on the Secretariat's ability to spot externalities. You are three people. You will miss things. *Mitigation:* Add a "Public Comment" period before Phase 1 closes.

  **The Verdict on the Credit Ledger:**
  **Burn it.**

  Your current "Spread Rule" uses a credit ledger ("I owe you a favor"). This is the poison.
  *   **Why it fails:** Favors are subjective. If I let you win Item X, I expect you to let me win Item Y. But when Item Y comes up, you might say, "Actually, this one is a Red Line for me," or "The price has gone up." This creates resentment and a sense of betrayal. It turns collaboration into a ledger of debts.
  *   **The Alternative:** The **Priority Points** system in the CCP is a *consumable budget*, not a *debt ledger*. When I spend 40 points to win Item X, I have paid the coalition, not you. I have less capital for the rest of the year. I cannot demand you pay me back. If you want to win Item Y, you must spend your own capital.
  *   **Why this is better:** It decouples the trades. It prevents the "bank run" scenario where everyone calls in favors at once. It makes the cost of intensity visible and finite.

  **Final Instruction:**
  Implement the **Priority Points** immediately. Keep the **Red Line** check but require them to be filed at the start of the year to prevent tactical vetoes. Abandon the credit ledger. Accept that you will pass fewer initiatives, but the ones you do pass will not threaten to blow up the room.
