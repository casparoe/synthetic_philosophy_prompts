answer: |-
  **Grade:** 15/20

  **Most Damaging Mistake:**
  The final sentence ("...it follows that with a large enough group and precise enough signals the herd cannot stay wrong for long"). This directly contradicts the core result of the informational cascade model (and the student's own correct analysis in sentence 8). In the standard Bikhchandani-Hirshleifer-Welch (BHW) framework, private signals *never* break an established cascade because agents stop acting on them. Therefore, the probability of error does not vanish as the group size grows; the herd can stay wrong forever absent a public shock. This error undermines the answer to the third part of the question ("what can break it?").

  ---

  ### Point-by-Point Comments for the Student

  **1. "Suppose agents decide one at a time whether to adopt, each receives a private signal that is correct with probability p, where p is greater than 1/2 but less than 1, and each can see every previous decision."**
  *   **Status:** Correct.
  *   **Note:** This correctly sets up the standard BHW (1992) environment.

  **2. "The first agent follows her signal."**
  *   **Status:** Correct.
  *   **Note:** With no history, the private signal is the only information.

  **3. "The second compares her own signal with the signal revealed by the first agent's action and adopts unless both are low."**
  *   **Status:** Correct but imprecisely stated.
  *   **Correction:** This relies on a specific tie-breaking rule (adopt on indifference). If Agent 1 adopted (implying High signal) and Agent 2 receives a Low signal, the net evidence is zero. You should explicitly state that you are assuming agents adopt when indifferent. Otherwise, Agent 2 might reject, delaying the cascade.

  **4. "If the first two adopt, the third faces public evidence equivalent to two low-risk endorsements, which outweighs a single low signal of her own, so she adopts whatever her signal says."**
  *   **Status:** Subtly wrong.
  *   **Correction:** This is a critical mechanical error. If she adopts *whatever her signal says*, she is revealing her private information (adopting on High, rejecting on Low). The definition of a cascade is that she adopts *regardless* of her signal. You likely meant "so she adopts even if her signal says reject." This distinction is vital because if she followed her signal, the cascade would not yet have begun.

  **5. "Her action tells her successors nothing new, and every later agent is in exactly the same position: the cascade has begun, and the aggregate outcome now depends only on the first two signals."**
  *   **Status:** Correct.
  *   **Note:** This correctly identifies the "absorbing state" nature of the cascade.

  **6. "That is how a majority can end up with an action they each privately reject — all of them are receiving low signals, but none of them can express that in a way anyone downstream can read."**
  *   **Status:** Correct.
  *   **Note:** Good intuition on the information loss.

  **7. "This seems to refute the Condorcet jury theorem."**
  *   **Status:** Correct (within the model context).

  **8. "Even though every agent is better than a coin flip and the group is large, the group settles on the wrong answer with probability that does not go to zero."**
  *   **Status:** Correct.
  *   **Note:** This accurately describes the failure of asymptotic learning in cascade models.

  **9. "The difference is that Condorcet assumes people vote simultaneously and independently, whereas here each agent's evidence includes the choices of others."**
  *   **Status:** Correct.
  *   **Note:** Specifically, Condorcet requires votes to be conditionally independent given the state. Sequential observation violates this.

  **10. "The individual agents are not being irrational."**
  *   **Status:** Correct.
  *   **Note:** They are playing a Bayesian Nash Equilibrium.

  **11. "Each is conditioning correctly on everything she can observe; the problem is that joining a cascade destroys private information, which is a negative externality imposed on everyone downstream."**
  *   **Status:** Correct.
  *   **Note:** This is the standard "informational externality" explanation.

  **12. "That is why the outcome is inefficient even though every step is a best response."**
  *   **Status:** Correct.

  **13. "Once a cascade starts it is essentially permanent."**
  *   **Status:** Correct (within the basic model).

  **14. "The public history is frozen, so the only thing that can break it is some outside event injecting genuinely new public information — a news report, a visible failure of the technology, an experiment."**
  *   **Status:** Correct.
  *   **Note:** Public signals shift the public belief directly, unlike private signals which must be inferred from actions.

  **15. "A lone dissenter cannot do it, because her action gets read as noise: the accumulated public evidence always exceeds what any one private signal can supply."**
  *   **Status:** Correct but imprecisely stated.
  *   **Correction:** It is not read as "noise" (randomness); it is read as *uninformative*. Successors infer that the dissenter is ignoring their private signal and acting based on the prior cascade. Also, specify that this holds because signal strength is bounded (e.g., $p < 1$). If signals could be infinitely precise, a single signal could break a cascade.

  **16. "So the fragility people attribute to herds is really about exogenous shocks, not about the private signals of the herding agents, and it follows that with a large enough group and precise enough signals the herd cannot stay wrong for long."**
  *   **Status:** Wrong.
  *   **Correction:** The first clause is acceptable, but the second clause ("the herd cannot stay wrong for long") contradicts the model's main result. In this framework, higher signal precision ($p$) makes a wrong cascade *less likely to start*, but once started, it makes it *harder* to break (because the public belief is stronger). Private signals do not accumulate once the cascade begins, so time/group size does not correct the error. The herd can stay wrong indefinitely without a public shock.

  ---

  ### Epistemic Status Note for the TA

  When returning this, please distinguish between **model-internal logic** and **empirical claims**:

  1.  **Model-Internal (Settled):** Within the BHW (1992) assumptions (binary actions, bounded private signals, rational Bayesian agents), the student's error in Sentence 16 is objectively false. Private signals *never* break the cascade in equilibrium, regardless of group size. This is a mathematical property of the model, not a contested theory.
  2.  **Empirical/General Truth (Contested):** The student's claim that "herds cannot stay wrong for long" might be intuitively appealing in real-world markets (where prices adjust, or signals might be unbounded), but it is not a feature of the canonical social learning model. Conversely, the claim that cascades are "fragile" to public information is a model result, but field evidence on whether real-world herds are actually driven by informational cascades (vs. reputational herding or price mechanisms) is mixed.
  3.  **Feedback Instruction:** Ensure the student understands that Sentence 16 is wrong *given the assumptions of the course model*. You do not need to debate whether real-world stock markets correct themselves quickly; you need to enforce that in the sequential binary-action model, private information aggregation stops completely.

  **Suggested weighting:** Deduct points primarily for Sentence 4 (mechanical misunderstanding of when the cascade starts) and Sentence 16 (contradiction of the asymptotic result). The rest of the answer demonstrates strong conceptual grasp.
