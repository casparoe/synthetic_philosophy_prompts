  ### Part 4: Application to New Cases

  Here is how the principles handle your three undecided scenarios.

  **(a) The DNA Case:**
  *   *Scenario:* DNA match, random-match probability 1 in 1,000,000. No other evidence.
  *   **Principle 1 (Normic):** Is it abnormal for someone else to match by chance? Yes, highly. However, is it abnormal for the lab to err or evidence to be planted? In a legal context, "lab error" is a normal possibility that requires no specific explanation to be raised as doubt.
      *   *Prediction:* **Withhold Belief (in Court).** The falsity (lab error) is not "abnormal" enough in a deontic context to sustain belief solely on stats.
  *   **Principle 2 (Contextual):** Legal threshold is >99.9% *and* requires non-statistical corroboration (in many jurisdictions). Even if just probability, 1 in 1M is 99.9999%.
      *   *Prediction:* **Believe (Personal), Withhold (Legal).** If purely probabilistic, Principle 2 allows belief if *T* is met, but Clause B (Evidence Quality) might block bare stats in court.

  **(b) The 999,999 Ticket Raffle:**
  *   *Scenario:* You hold 999,999 of 1,000,000 tickets. One winner guaranteed.
  *   **Principle 1 (Normic):** Is it abnormal for you to lose? Yes. It would require a specific explanation (the one ticket you don't hold won).
      *   *Prediction:* **Believe you will win.** Unlike Case 1 (holding 1 ticket), here winning is the *normal* outcome given your evidence.
  *   **Principle 2 (Contextual):** Probability is 99.9999%. Exceeds Personal *T*.
      *   *Prediction:* **Believe you will win.**
      *   *Note:* Both principles agree here, distinguishing it from Case 1. This is a crucial test: Belief tracks the *direction* of the probability relative to the default, not just "high probability."

  **(c) The Automated Report:**
  *   *Scenario:* 300 claims, machine-verified, human framing.
  *   **Principle 1 (Normic):** Machine verification makes individual error abnormal. However, "human framing" introduces a normal risk of selection bias or context error (similar to the Lemma gloss). The conjunction of 300 claims makes systemic error normal.
      *   *Prediction:* **Believe individual claims, Withhold the "All True" conjunction.**
  *   **Principle 2 (Contextual):** Machine verification raises probability high enough for individuals. Aggregation raises *T* for the conjunction.
      *   *Prediction:* **Believe individuals, Withhold conjunction.**

