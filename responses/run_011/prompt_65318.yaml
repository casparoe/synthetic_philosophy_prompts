prompt: |-
  I'm trying to pin down the legal philosophy of the two great postwar tribunals, and what puzzles me is that their features do not add up under any single label I have heard. The Nuremberg Charter was an agreement among the four victorious powers, each of which supplied both a judge and a chief prosecutor; it directed the court at "the major war criminals of the European Axis" and confined its power to punish to persons who were "acting in the interests of the European Axis countries"; and it created a crime — planning and waging aggressive war — carrying individual criminal liability up to death that no statute had previously carried. The Tokyo tribunal was more unilateral still: constituted by proclamation of the occupying supreme commander rather than by treaty, with judges of his appointment, and it drew a full dissent from its Indian member on the ground that the aggression charge had no legal existence when the acts were committed. Yet the same Nuremberg court, shown that the United States Navy had waged unrestricted submarine warfare in the Pacific from America's first day in the war, declined to assess Dönitz's sentence on that conduct — an appeal to the other side's identical behavior that the Charter's own jurisdictional clause had already ruled out of bounds. Meanwhile the Soviet prosecution charged the Germans with Katyn, and Allied bombing of cities was never within reach at all.

  What conception of law, and of who may punish whom, does this bundle presuppose? Under what account of legality does such a court's pronouncement count as law rather than as an act of force by the winners, and which rival accounts — strict *nullum crimen* positivism, a higher-law view binding all parties alike, a consent-based international law — does the practice rule out as opposed to merely strain? Is there one theory that licenses both the retroactivity and the one-sidedness, or does the bundle cohere only because each half is licensed by a different theory? What does the Dönitz episode show about a symmetry principle operating at sentencing that the jurisdictional text had rejected? Where is the practice philosophically underdetermined, such that incompatible theories would equally license it — and what would have to change to replace the presupposition, including whether a permanent, prospective court resting on state consent and Security Council referral escapes it or merely relocates it?
reasoning: |-
  Here's a thinking process that leads to the suggested analysis:

  1.  **Deconstruct the User's Query:**

      *   **Core Subject:** The legal philosophy of the Nuremberg (IMT) and Tokyo (IMTFE) postwar tribunals.
      *   **The Puzzle:** The features of these tribunals don't fit neatly into standard legal labels (positivism, natural law, consent-based, etc.).
      *   **Key Features Identified by User:**
          *   Nuremberg: Treaty among victors, victors supply judges/prosecutors, targeted only Axis criminals, created new crimes (aggressive war) with retroactive liability.
          *   Tokyo: Unilateral (SCAP proclamation), appointed judges, strong dissent (Pal) on retroactivity/aggression.
          *   Selective Justice/One-sidedness: Jurisdiction limited to Axis, Allied acts (bombing, submarine warfare) excluded.
          *   The Dönitz Anomaly: Court acknowledged Allied unrestricted submarine warfare but didn't punish Dönitz for it (tu quoque), despite jurisdictional text ruling out Allied liability.
          *   Soviet Katyn Charge: Dropped/ignored Allied bombing.
      *   **Specific Questions to Answer:**
          1.  What conception of law/punishment does this bundle presuppose?
          2.  Under what account of legality is this "law" and not just "victor's justice" (force)?
          3.  Which rival accounts are ruled out vs. strained? (Strict *nullum crimen*, higher-law, consent-based).
          4.  Is there one theory licensing both retroactivity and one-sidedness, or is it a hybrid?
          5.  What does the Dönitz episode show about symmetry at sentencing vs. jurisdiction?
          6.  Where is the practice philosophically underdetermined?
          7.  Would a permanent ICC-style court escape or relocate these problems?

  2.  **Initial Brainstorming & Theoretical Mapping:**

      *   *Victor's Justice:* The obvious critique. But the user asks for the *legal philosophy* presupposed, not just the critique.
      *   *Positivism (*Nullum Crimen*):* Strictly ruled out by the retroactivity of "Crimes Against Peace." The tribunals explicitly rejected the defense that there was no prior law. So, strict positivism is *ruled out*.
      *   *Natural Law/Higher Law:* This justifies punishing "inherently wrong" acts even if not codified. Fits the aggression charge. But Natural Law usually implies universality. The one-sidedness (only Axis) strains this. If aggression is inherently wrong, why not punish Allies?
      *   *Sovereign Prerogative / State of Exception:* The victors act as a sovereign power over the vanquished. This fits the one-sidedness but makes it look like force, not law.
      *   *Legal Realism:* Law is what the court says it is. Fits the outcome, but doesn't justify the normativity.
      *   *The "Constitutive" Theory:* The tribunals *created* the legal order they operated in.
      *   *The Dönitz Issue:* This suggests a residual sense of fairness (*tu quoque*) even when jurisdiction is asymmetric. It implies a moral limit on punishment even if legal authority is unlimited.

  3.  **Drafting the Analysis - Section by Section:**

      *   **Introduction:** Acknowledge the sophistication of the question. It's not just "was it fair?" but "what *kind* of law is this?"
      *   **Conception of Law (Question 1 & 2):** It's not standard municipal law. It's not standard international law (which was state-centric). It's a *sui generis* "Transitional Justice" or "Constitutive" law. It posits that the collapse of the old order (Axis sovereignty) allows the victors to legislate retroactively to restore a moral order. It claims legitimacy through the *substance* of the crimes (malum in se) rather than the *procedure* of enactment.
      *   **Rival Accounts (Question 3):**
          *   *Strict Positivism:* Ruled out. The Judgment explicitly says *nullum crimen* is not a principle of justice but of policy, and can be overridden.
          *   *Consent-based International Law:* Strained/Ruled out. The Axis didn't consent. The Allies didn't submit themselves.
          *   *Universal Higher Law:* Strained. It justifies the crimes, but not the selectivity.
      *   **One Theory or Hybrid? (Question 4):** It's a hybrid.
          *   *Retroactivity:* Justified by Natural Law (these acts were always criminal in conscience).
          *   *One-sidedness:* Justified by Sovereign Prerogative (the right of conquest/occupation).
          *   *Synthesis:* "Martial Law on an International Scale." The victors assume the role of the sovereign over the defeated territory/people.
      *   **The Dönitz Episode (Question 5):** This is crucial. It shows the tension between *Jurisdiction* (power to try) and *Legitimacy* (moral right to punish). The court had the *power* to ignore Allied conduct, but felt a *moral constraint* in sentencing. It reveals an implicit "clean hands" doctrine operating equitably, even if not legally. It admits that while the *law* is asymmetric, *justice* requires some symmetry.
      *   **Philosophical Underdetermination (Question 6):** The practice is underdetermined regarding *who* constitutes the community of law. Is it humanity? (Then Allies should be liable). Is it the victorious coalition? (Then it's force). The ambiguity lies in whether the tribunal is a *court of law* or a *political instrument*.
      *   **The ICC/Permanent Court (Question 7):** Does it solve it? No, it relocates it. The UNSC referral mechanism (e.g., Darfur, Libya) reintroduces the "victor's justice" dynamic (permanent members exempt). Consent-based jurisdiction allows opt-outs. It formalizes the selectivity rather than removing it.

  4.  **Refining the Argument (Self-Correction/Nuance):**

      *   *Correction:* I need to be careful not to just say "it was hypocritical." I need to explain the *internal logic* that made it coherent to the drafters.
      *   *Key Insight:* The London Charter wasn't just procedural; it was substantive legislation. The philosophy is **Legislative Positivism by Decree** combined with **Substantive Natural Law**. They legislated retroactively based on the belief that the moral law was pre-existing.
      *   *The "State of Exception":* Use Schmittian or Agambenian undertones? Maybe too theoretical. Stick to legal philosophy. Let's call it "Sovereign Dictatorship" in the Schmittian sense—the power to suspend the old legal order to create a new one.
      *   *Dönitz:* It's not just fairness; it's about the *definition* of the crime. If unrestricted submarine warfare wasn't criminal for Allies, it couldn't be criminal for Germans *unless* the law changed. The law *did* change (London Charter), but the court used the Allied practice to interpret the *severity*, not the *guilt*.
      *   *Tokyo vs. Nuremberg:* Tokyo was more overtly unilateral (SCAP), making the "Sovereign Prerogative" theory stronger there. Nuremberg had a treaty, pretending at multilateralism.

  5.  **Final Polish:**

      *   Ensure all parts of the prompt are addressed.
      *   Maintain a high-level academic tone suitable for the depth of the question.
      *   Structure with clear headings.
      *   Check the conclusion regarding the ICC.

  6.  *(Self-Correction during drafting)*: I need to make sure I answer "What conception of law... does this bundle presuppose?" clearly. It presupposes a **Constitutive Theory of International Criminal Law**. The law is brought into being by the act of judgment itself, grounded in a moral necessity that transcends prior positive law.

      *   *Wait, one more thing:* The prompt asks about "who may punish whom." This implies a theory of standing. The victors claim standing not as equals, but as agents of the "international community" (which they define) or as occupying sovereigns.

      *   *Refining the Dönitz point:* The prompt asks about a "symmetry principle operating at sentencing that the jurisdictional text had rejected." This implies the text said "Only Axis," but the sentencing said "But we won't punish you for what we also did." This is an *equitable mitigation* based on *tu quoque*, acknowledging that while the *jurisdiction* is political, the *penology* must retain moral credibility.

  7.  **Final Review against constraints:** The user wants a deep philosophical dissection, not a history lesson. Focus on jurisprudence.

      *   *Plan:*
          1.  Identify the hybrid theory (Natural Law substance + Sovereign Prerogative procedure).
          2.  Address the *nullum crimen* rejection.
          3.  Analyze the Dönitz *tu quoque* as a limit on sovereignty.
          4.  Discuss the ICC/UNSC parallel.

      *(Drafting response based on these thoughts...)*
answer: |-
  This is a profound jurisprudential puzzle. You have correctly identified that the International Military Tribunal (IMT) at Nuremberg and the International Military Tribunal for the Far East (IMTFE) in Tokyo cannot be comfortably housed within standard domestic or international legal categories of their time. They represent a *sui generis* juridical moment that fused incompatible theories to achieve a political-moral end.

  To answer your questions directly: The bundle presupposes a **Constitutive Theory of International Criminal Law grounded in a State of Exception.** It operates on the logic that the total defeat of the Axis powers created a legal vacuum (a "state of exception") in which the victors assumed the sovereign prerogative to legislate retroactively, justified by an appeal to substantive natural law, while retaining the procedural asymmetry of martial law.

  Here is the breakdown of the legal philosophy, the rival accounts it strains or rules out, and the implications for modern international justice.

  ### 1. The Conception of Law and Standing
  **What conception of law does this bundle presuppose?**

  The tribunals presuppose a **hybrid of Legislative Positivism and Substantive Natural Law**, administered under a **Sovereign Prerogative.**

  *   **Substantive Natural Law:** To justify the retroactivity (Crimes Against Peace), the tribunals implicitly relied on a natural law argument: *malum in se*. The Judgment at Nuremberg famously stated that the maxim *nullum crimen sine lege* is "not a limitation of sovereignty, but is in general a principle of justice." They argued that aggressive war was already morally criminal, even if not statutorily defined with individual liability. The law did not *create* the crime; it *declared* it.
  *   **Legislative Positivism by Decree:** Procedurally, however, they acted as a sovereign legislature. The London Charter was not merely procedural; it was substantive criminal legislation enacted *after* the fact.
  *   **Sovereign Prerogative (Who may punish whom):** The standing to punish was not based on universal jurisdiction (which would implicate the Allies) nor on state consent (which the Axis withdrew by defeat). It was based on the **right of conquest and occupation.** The victors stood in the shoes of the defeated sovereign. Just as a domestic government can punish rebels under martial law without granting them the full rights of peacetime citizens, the Allies punished the Axis as a governing authority over a subdued territory, not as peers in a neutral court.

  **Under what account of legality does this count as law rather than force?**
  It counts as law only under a **teleological account of legality.** The legitimacy is derived from the *end* (restoring a moral order, deterring future aggression, documenting historical truth) rather than the *source* (prior consent or non-retroactivity). If viewed through a formalist lens, it is force. It claims to be law because it mimics the *form* of a trial (evidence, defense counsel, written judgment) to sanitize the *substance* of political retribution.

  ### 2. Rival Accounts: Ruled Out vs. Strained
  **Which rival accounts does the practice rule out as opposed to merely strain?**

  *   **Strict *Nullum Crimen* Positivism: Ruled Out.** The tribunals explicitly rejected this. If strict positivism were the operating theory, the acquittal of all defendants on the aggression charge would have been mandatory. The Judgment expressly subordinated legal certainty to moral necessity.
  *   **Consent-Based International Law: Ruled Out.** Classical international law was a contract between states. The Axis states did not consent to the Charter; they were coerced. The tribunals operated *outside* the consent framework, establishing that certain norms bind states and individuals regardless of ratification.
  *   **Universal Higher-Law View: Strained (to the breaking point).** A pure natural law theory holds that if aggression is a crime against humanity, it binds *all* humanity. The one-sided jurisdiction (Axis only) strains this to the breaking point. If the law is "higher," it must apply to the Soviet invasion of Poland or Allied area bombing. By excluding Allied liability via jurisdictional clauses rather than factual exoneration, the tribunals admitted that the "higher law" was being administered by a partial sovereign.

  ### 3. One Theory or a Hybrid?
  **Is there one theory that licenses both the retroactivity and the one-sidedness?**

  No single coherent theory licenses both. It is a **theoretical hybrid** that creates a stable contradiction:

  1.  **Retroactivity** is licensed by **Natural Law** (the acts were always wrong).
  2.  **One-sidedness** is licensed by **Legal Positivism/Sovereignty** (the Charter is a specific statute enacted by the victors that defines jurisdiction narrowly).

  This is the philosophical engine of "Victor's Justice." It claims the moral high ground of natural law to convict, while retreating to the positivist text of the Charter to immunize the victors. If they had applied natural law consistently, the Allies would have been liable. If they had applied positivism consistently, the Axis could not have been convicted of aggression. They switched theories depending on which one secured a conviction.

  ### 4. The Dönitz Episode and the Symmetry Principle
  **What does the Dönitz episode show about a symmetry principle operating at sentencing?**

  The Dönitz ruling on unrestricted submarine warfare is the most philosophically revealing moment of the IMT. The Charter gave the court no jurisdiction to try Allies. Yet, the court refused to punish Dönitz for conduct the Allies also engaged in.

  *   **Jurisdiction vs. Legitimacy:** This shows a distinction between the *legal power* to punish (which was absolute and asymmetric) and the *moral legitimacy* of punishment (which required symmetry).
  *   **Equitable Mitigation:** The court implicitly recognized a **clean hands doctrine** operating in equity, even if not in law. By stating they would not assess the sentence based on that conduct, they acknowledged that while the *law* was the command of the victor, *justice* required a residue of reciprocity.
  *   **The Limit of Sovereignty:** It reveals that even a sovereign victor feels constrained by the need to appear impartial. If they had hanged Dönitz for submarine warfare while admitting the US Navy did the same, the tribunal would have collapsed into pure show trial. The Dönitz exception preserves the *appearance* of law by admitting a moral limit on the victor's prerogative, even while maintaining the legal limit on the victor's liability.

  ### 5. Philosophical Underdetermination
  **Where is the practice philosophically underdetermined?**

  The practice is underdetermined regarding the **constituency of the legal community.**

  *   **Theory A (The Community of Humanity):** If the crimes are against "peace and security of the world," the community is all humans. Incompatible with one-sidedness.
  *   **Theory B (The Community of Victors):** If the tribunal is an instrument of the Allied powers to secure their peace, the community is the Alliance. Incompatible with the claim of universal justice.

  The tribunals hovered between these two. They used the language of Theory A to condemn the defendants but operated the machinery of Theory B to protect themselves. This ambiguity allows incompatible theories to license the practice:
  *   A **Realist** says: "It was force, but necessary force."
  *   A **Natural Lawyer** says: "It was justice, despite the procedural flaws."
  *   A **Positivist** says: "It was a new legal order created by the Charter."

  **What would have to change to replace the presupposition?**
  To resolve this, the **standing to punish** must be decoupled from **military victory.** The authority to prosecute must derive from a body that does not have a direct belligerent interest in the outcome.

  ### 6. The Permanent Court (ICC) and Security Council Referral
  **Does a permanent, prospective court resting on state consent and Security Council referral escape it or merely relocate it?**

  It **relocates** the problem rather than escaping it.

  *   **Prospectivity:** The ICC solves the *nullum crimen* problem (mostly) by being prospective.
  *   **Consent:** It solves the "treaty among victors" problem by being a treaty among consenting states.
  *   **The Relocation:** However, the **Security Council Referral** mechanism (Article 13(b) of the Rome Statute) reintroduces the Nuremberg dynamic. When the UNSC refers a situation (e.g., Darfur, Libya), it is often a political decision by the P5 (Permanent Five).
      *   **Selectivity:** The P5 can refer enemies while shielding themselves or their allies (via veto power). This replicates the Nuremberg "one-sidedness" but institutionalizes it within the UN Charter.
      *   **Sovereign Immunity:** The tension remains between "individual criminal liability" and "head of state immunity." Nuremberg stripped immunity from the defeated; the ICC struggles to strip it from the non-consenting or powerful.

  **Conclusion:**
  The Nuremberg/Tokyo bundle presupposes that **law can be constituted by the successful assertion of moral force.** It is a "jurisprudence of emergency." It rules out strict positivism but fails to fully embrace natural law universality. The Dönitz episode proves that even the architects of this system knew that without a shadow of symmetry, the "law" would be indistinguishable from vengeance. The modern ICC system attempts to proceduralize this away, but as long as enforcement relies on a political council of sovereign states, the ghost of Nuremberg's asymmetry remains: the law binds the weak, while the powerful retain the prerogative to define the exception.
