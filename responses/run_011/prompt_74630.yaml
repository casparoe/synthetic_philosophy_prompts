answer: |-
  You are struggling because you are intuitively balancing two competing theories of legitimacy that are often in tension: **Statistical Representativeness** (the assembly must look like the city) and **Procedural Independence** (the assembly must not be captured by interests or biases). Your roommate's principle ("fair draw = legitimate") is too thin; it covers Procedural Independence but ignores Statistical Representativeness.

  Your intuitions are actually more sophisticated than your roommate's. You are operating under a hybrid principle that political theorists call **Corrective Sortition**.

  Here is a precise formulation of the principle that matches your verdicts, followed by the tests you requested and the honest trade-offs you must make.

  ### The Principle: Corrective Sortition

  **A citizens' assembly is legitimate if and only if its selection process satisfies three axioms:**

  1.  **Axiom of Equal Baseline Probability:** Every member of the eligible populace must begin with an equal mathematical probability of selection. (No self-nomination, no exclusion without cause).
  2.  **Axiom of Descriptive Correction:** Deviations from pure randomness are permitted *only* to correct for non-response bias in order to match demographic descriptors (age, class, geography) that correlate with lived experience. Deviations to match ideological descriptors (opinions, party) are forbidden.
  3.  **Axiom of Interest Asymmetry:** Exclusion or reserved seating based on stakeholder status is permitted *only* to mitigate power imbalances. Powerful insiders (those who benefit from the status quo) must be excluded; marginalized outsiders (those excluded by the status quo) may be included.

  ---

  ### Testing Your List Against the Principle

  This principle resolves your two specific contradictions and validates most of your list.

  **1. The Volunteer Contradiction**
  *   *Case A (Hat):* **Not Fine.** Violates Axiom 1. People who put their name in a hat self-select based on motivation/interest, creating a "club" of the highly engaged.
  *   *Case B (Recruited Firm):* **Fine.** Satisfies Axiom 2. If a firm goes door-to-door randomly (like a pollster) to recruit people to fill specific demographic slots, they are correcting for non-response bias.
  *   *The Distinction:* It is not about "volunteering"; it is about **who initiates the contact**. If the citizen initiates, it's bias. If the process initiates and the citizen consents, it's correction.

  **2. The Reserved Seat Contradiction**
  *   *Case A (Finance Dept):* **Not Fine.** Violates Axiom 3. They are powerful insiders. Their professional interest aligns with the status quo/bureaucracy. Including them amplifies existing power.
  *   *Case B (Homeless):* **Fine.** Satisfies Axiom 3. They are marginalized outsiders. Their lived experience is systematically excluded from normal budgeting. Including them corrects a power imbalance.
  *   *The Distinction:* It is not about "having a stake"; it is about **power asymmetry**. One group has too much influence normally; the other has too little.

  **3. The Other Verdicts**
  *   *Random Voter Roll:* Passes Axiom 1.
  *   *Stratified Sampling (Age/Income/Zip):* Passes Axiom 2.
  *   *Voir Dire (Screening Opinions):* **Not Fine.** Violates Axiom 2. Filtering by opinion creates ideological bias, not demographic representation.
  *   *Self-Replacement:* **Not Fine.** Violates Axiom 1. It severs the link to the populace and creates an oligarchy.
  *   *Second Assembly:* **Fine.** Acts as an external check on Procedural Independence.

  ---

  ### Implications for Unlisted Cases

  Here is how **Corrective Sortition** dictates you handle cases you didn't list.

  **1. Minors**
  *   *Verdict:* **Include if residents, exclude if citizens-only.**
  *   *Reasoning:* Axiom 1 defines the "eligible populace." If the budget affects minors (schools, parks), they are stakeholders. If your definition of "citizen" excludes them, you violate the spirit of Descriptive Correction. However, if "capacity to deliberate" is a prerequisite, you may need to create a parallel youth assembly. The Principle pushes you toward inclusion unless there is a capacity barrier.

  **2. Non-Citizens (Resident Aliens)**
  *   *Verdict:* **Include.**
  *   *Reasoning:* Axiom 1. If they reside in the city and pay taxes (directly or via rent), they are subject to the budget. Excluding them creates a "taxation without representation" violation. A "Citizens' Assembly" should ideally be a "Residents' Assembly."

  **3. Partisan Imbalance (60% One Party)**
  *   *Verdict:* **Accept the imbalance.**
  *   *Reasoning:* Axiom 2 forbids correcting for ideological descriptors. If the city is 60% Party X, a representative assembly *should* be roughly 60% Party X. Correcting this to 50/50 would violate Descriptive Correction by filtering for opinion rather than lived experience. You represent the people as they *are*, not as you wish them to be.

  **4. "Crazy" or "Disruptive" People**
  *   *Verdict:* **Keep them, unless they cannot physically participate.**
  *   *Reasoning:* Axiom 2. "Firm opinions" (Voir Dire) is banned. "Inability to deliberate" (severe cognitive impairment) is a capacity issue, not an opinion issue. You can screen for capacity to engage, but not for *what* they will say.

  ---

  ### The Hard Truth: What You Must Drop

  You asked me to tell you honestly which verdicts you have to drop. The Principle of Corrective Sortition reveals a tension in your original list that you cannot sustain.

  **You cannot have both "Whoever Turns Up" and "Perfect Demographic Matching."**

  *   *Your Verdict:* You said drawing 500 and letting whoever shows up be the assembly is "Fine." You *also* said you "Insist" on matching the city on age, income, education, and zip code.
  *   *The Conflict:* Response rates are not random. Wealthier, older, and more educated people respond to civic summons at higher rates than the poor, young, or marginalized.
  *   *The Forced Choice:*
      *   If you let "whoever turns up" decide (Verdict #2), you **must drop** the insistence on perfect demographic matching (Verdict #4). You will get a wealthier, older assembly.
      *   If you insist on demographic matching (Verdict #4), you **must drop** the passive "whoever turns up" model (Verdict #2). You must actively recruit (like the paid firm) to fill the slots of those who said no.

  **Recommendation:** Drop Verdict #2 ("Whoever turns up"). It is the weakest link. It pretends to be random but yields a biased sample. Embrace the "Paid Firm Recruitment" model. It is more honest: you are acknowledging that true randomness requires active work to overcome systemic non-response.

  ### One Clause to Bolt On

  To rescue your intuition about the "Homeless" seats without opening the door to every interest group, you need to add a **Threshold Clause** to Axiom 3:

  > *"Reserved seating for marginalized groups is permitted only when that group constitutes a significant portion of the populace (>5%) but holds <5% of the decision-making power in standard political channels."*

  This prevents you from reserving seats for "People who like Jazz" or "Dog Owners" (interest groups) while preserving the seat for the Homeless (systemic exclusion).

  ### Summary
  Your roommate is a **Procedural Purist** (Randomness = Legitimacy).
  You are a **Corrective Representativist** (Representativeness + Anti-Capture = Legitimacy).

  Your view is more robust for a budgetary assembly, but it requires you to admit that **active recruitment is not optional** if you want demographic justice. You cannot be passive about the draw.
