answer: |-
  The centipede game stands as the canonical embarrassment of non-cooperative game theory. It presents a stark contradiction: a deductive argument of ironclad logical consistency yields a prediction that human beings systematically ignore. You and your friend have identified the two standard poles of the debate. Your friend argues that the failure lies not in the logic of backward induction, but in the subjects' belief about the game's structure—specifically, the certainty of the endpoint. You argue that modifying the structure to save the logic renders the theory vacuous and changes the strategic nature of the interaction. To adjudicate this, we must dissect the mechanical requirements of backward induction, test the mathematical viability of your friend's variant, and assess the philosophical cost of your objection.

  ### The Horizon Objection Precisely Stated

  Your friend's "horizon objection" rests on a distinction often blurred in informal discussion: the difference between Common Knowledge of Rationality (CKR) and Common Knowledge of the Structure (CKS). Backward induction is not driven by rationality alone. It requires that players know the game tree, know that the other knows it, and so on. Crucially, this includes knowledge of the terminal node.

  In a standard finite centipede game, the inductive chain begins at the final node $N$. At $N$, the player whose turn it is faces a choice between Taking (ending the game with a specific payoff) and Passing (which, by the rules of the game, leads to a terminal state with a lower payoff or zero). Because the payoff for Taking is strictly higher, a rational player *must* Take at $N$. This certainty is the anchor. It allows the player at $N-1$ to calculate the value of Passing not as a gamble on future cooperation, but as a guaranteed delivery of the pot to a rational opponent who will immediately seize it at $N$. Knowing this, the player at $N-1$ Takes. This logic cascades to the start.

  The horizon objection posits that this cascade is severed if the anchor at $N$ is loose. If a player at $N$ assigns any positive probability to the game *not* ending at $N$—perhaps believing the experimenter will allow a node $N+1$, or that the "exogenous ending" your friend mentions is not guaranteed—then the dominance of Taking at $N$ disappears. If there is a chance that Passing leads to a node $N+1$ with a higher payoff, Passing becomes a rational expected-value calculation.

  Therefore, the assumption of a commonly known terminus is doing more work than the assumption of rationality. You can have two perfectly rational agents who fail to backward induce simply because they disagree about where the game ends. Relaxing CKR (e.g., assuming players make mistakes) can explain passing, but it treats the deviation as an error. Relaxing CKS (the horizon objection) treats the deviation as a rational response to a different game. Your friend's claim is that the laboratory setting fails to establish CKS. Subjects enter the room with a prior that "experiments often have hidden conditions" or "the researcher might let us continue," and this residual doubt is sufficient to break the chain.

  ### The Formal Variant

  To test this, we must move from abstraction to arithmetic. Let us construct a truncated centipede game with four decision nodes. Player 1 moves at nodes 1 and 3; Player 2 moves at nodes 2 and 4. The payoffs $(P1, P2)$ for Taking at each node are:

  *   **Node 1 (P1):** Take $(2, 0)$. Pass leads to Node 2.
  *   **Node 2 (P2):** Take $(1, 4)$. Pass leads to Node 3.
  *   **Node 3 (P1):** Take $(8, 2)$. Pass leads to Node 4.
  *   **Node 4 (P2):** Take $(4, 16)$. Pass leads to End (payoffs $(0,0)$).

  Under standard backward induction: At Node 4, P2 compares 16 (Take) vs. 0 (Pass). P2 Takes. At Node 3, P1 knows P2 will Take at 4, yielding P1 a payoff of 4. P1 compares 8 (Take) vs. 4 (Pass result). P1 Takes. At Node 2, P2 knows P1 Takes at 3, yielding P2 a payoff of 2. P2 compares 4 (Take) vs. 2 (Pass result). P2 Takes. At Node 1, P1 Takes $(2 > 0)$. The game ends immediately.

  Now, we introduce your friend's modification. Suppose that at any node, after a Pass, there is a probability $\pi$ that the game continues to an unannounced node, and a probability $1-\pi$ that the game ends exogenously with payoffs $(0,0)$. For the horizon objection to work, we must interpret this as uncertainty about the *announced* terminus. Specifically, at Node 4, Player 2 does not know for certain that Pass leads to $(0,0)$. Player 2 believes that with probability $\pi$, a Node 5 exists where Player 2 would eventually secure a payoff of $V_5 = 32$.

  At Node 4, Player 2's expected utility for Passing is:
  $$EU(\text{Pass}) = \pi(32) + (1-\pi)(0) = 32\pi$$
  Player 2's utility for Taking is fixed at 16.
  Passing is optimal if $32\pi > 16$, which implies $\pi > 0.5$.

  If Player 2 believes there is greater than a 50% chance the game continues past the announced end, P2 Passes at Node 4. Now we step back to Node 3. Player 1 must anticipate P2's move. If P1 believes P2 holds this belief (i.e., they share the uncertainty), P1 calculates the value of Passing as the probability P2 Passes multiplied by the value of reaching Node 4's continuation.
  If P2 Passes at 4, P1 expects to reach a state worth, say, 20 (from Node 5 outcomes).
  $$EU(\text{Pass at 3}) = \pi \times 20$$
  Taking at 3 yields 8. Passing is optimal if $20\pi > 8$, or $\pi > 0.4$.

  Notice the asymmetry. It requires less doubt to sustain passing at Node 3 than at Node 4. This creates a zone of stability for cooperation. If both players assign a probability $\pi = 0.6$ to the game continuing past the announced end, rational self-interest dictates Passing at every node.

  Does this require the players to share the *same* estimate? Strictly, no. It requires only that P1 believes P2 believes $\pi$ is high enough, and P2 believes $\pi$ is high enough. However, for an experimenter to establish that this is the cause of behavior, it matters immensely. If the doubt is private and idiosyncratic, the experimenter cannot measure it. If the doubt is induced by the setting (e.g., a general distrust of laboratory constraints), it is a systematic variable. The distinction matters because if the doubt is merely private noise, the horizon objection explains individual variance but not the aggregate trend of passing. If the doubt is systematic (a shared prior that "experimenters lie"), then the game being played is structurally distinct from the game on the instruction sheet.

  ### Addressing the Objections

  Your first objection is that this rescue is pyrrhic: if backward induction only applies to games with a commonly known terminus, and such games do not exist outside of logic puzzles, the theory is unfalsifiable and empty.

  This charge of unfalsifiability is potent but requires nuance. A theory can be conditionally normative without being descriptively universal. Consider frictionless mechanics. We know frictionless planes do not exist. Yet, the equations of motion derived from them retain normative force; they tell us how objects *would* move absent interference, allowing us to measure the magnitude of the friction. Similarly, backward induction provides the baseline for "pure strategic rationality." If subjects pass, the theory tells us we should look for the "friction"—in this case, the uncertainty about the horizon. The theory is not empty; it identifies the specific assumption (CKS) that, when violated, generates the deviation. However, you are correct that if CKS is *essentially* never met in human interaction, the theory's predictive utility for social science is nil. It becomes a theorem about platonic forms, not agents.

  Your second objection is that the variant is not neutral: adding exogenous termination changes the strategic character. In the original game, Passing is a gift to the opponent; in the variant, Passing is a hedge against the game vanishing.

  Here, you are partially right, but the distinction is subtler than it appears. In the variant calculated above, Passing is not merely a gamble against nature; it remains a strategic move contingent on the opponent's rationality. At Node 3, Player 1 Passes only because they expect Player 2 to Pass at Node 4. If Player 2 were a pure maximizer in a known finite game, Player 1 would not Pass. The "gamble" is not against the house; it is a bet on the opponent's belief about the horizon. However, you are correct that the *motivation* shifts. In the standard game, Passing requires altruism or irrationality. In the horizon-uncertain game, Passing requires only skepticism about the rules. This changes the moral texture of the decision from "trust" to "speculation." If the goal of the centipede game is to test social preferences, your friend's variant contaminates the test. If the goal is to test rationality, the variant is a valid control.

  ### Alternative Diagnoses

  We must consider whether other explanations outperform the horizon objection. Three prominent alternatives exist: other-regarding preferences, bounded rationality, and relationship framing.

  First, **other-regarding preferences**. If players care about the total pot or equality, they may Pass to increase the joint payoff, even knowing the other will Take later. This explains early passing well but struggles with the end-game. Inequality-averse players should still Take at the final node to prevent the other from getting more. The horizon objection handles the end-game naturally: if the end is uncertain, the final node isn't truly final.

  Second, **bounded rationality (Level-k reasoning)**. A Level-0 player passes randomly. A Level-1 player Takes immediately. A Level-2 player Passes once, expecting the Level-1 to Take. This predicts a distribution of stopping times, which matches data better than the single-point prediction of backward induction. However, this treats the deviation as a cognitive limitation. The horizon objection treats it as a rational response to information asymmetry. These are compatible: a subject might be Level-2 rational *and* uncertain about the horizon.

  Third, **relationship framing**. Subjects may treat the experiment as one round of a repeated game. If I Pass now, you might Pass later, or I might meet you in another study. This effectively makes the horizon infinite. This is functionally identical to the horizon objection but locates the uncertainty in the *social* context rather than the *rules*.

  Does any explain early passing *better*? The horizon objection is superior in one specific regard: it preserves the assumption of full rationality. Bounded rationality concedes that subjects cannot do the math. Other-regarding preferences concede that subjects are not self-interested. The horizon objection allows us to maintain the standard model of *Homo economicus* simply by adjusting the information set. In a scientific program committed to rational choice, this is the most conservative and therefore the most attractive fix. However, it demands we accept that subjects fundamentally distrust the experimental setup, which implies a pervasive skepticism that might not actually exist.

  ### Verdict

  The debate between you and your friend ends in a necessary partition of territory. You should concede that your friend is theoretically correct: backward induction does not logically compel an immediate Take unless the terminal node is Common Knowledge. If a rational agent assigns positive probability to the game continuing, the inductive chain is broken at the source. The failure of the experiments to control for this belief means they did not strictly test the theorem of backward induction; they tested backward induction under a specific, unverified psychological condition.

  However, your friend must concede that this concession drains the theory of its empirical blood. By retreating to the condition of "Common Knowledge of the Terminus," backward induction is relegated to a realm of idealization that human beings never inhabit. In any real interaction, digital or analog, there is always a non-zero probability that the rules change, the connection drops, or the interaction continues informally. If the theory's predictions vanish the moment we step out of the axiom system, it cannot serve as a descriptive law of behavior.

  Furthermore, you are right that the variant changes the strategic character. A game where I Pass because I suspect the experimenter might add a node is not the same social animal as a game where I Pass because I trust you. The former is epistemic caution; the latter is social cooperation. Conflating them obscures the very phenomenon the centipede game was designed to illuminate.

  The final verdict is this: Backward induction survives intact as a normative standard, but it has been evicted from the domain of descriptive psychology. It tells us what rational agents would do if they lived in a world of perfect structural transparency. Since we do not live in such a world, the immediate Take is not the rational baseline for human behavior; it is the rational baseline for a robot programmed with perfect information. Your friend saved the logic of the theory by sacrificing its applicability. You saved the integrity of the experiment by acknowledging that the theory does not apply to it.

  What is left of backward induction is not a prediction of what people will do, but a benchmark for measuring the friction of reality. When subjects Pass, they are not necessarily being irrational; they are signaling that the game they are playing is richer than the game on the page. The "error" is not in their reasoning, but in the modeler's assumption that the map is the territory. You should concede that the logic holds; your friend should concede that the logic is, for all practical purposes, behaviorally inert. The centipede game does not show that humans are bad at logic; it shows that humans are good at detecting that the world is rarely as finite as a mathematician hopes.
