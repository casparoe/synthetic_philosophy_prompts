  ### Venice vs. Lottocratic Theory: A Stress Test

  You are correct that Venice is the stress test modern lottocracy tries to avoid. The Venetian case cleanly separates the two jobs you identified: anti-faction selection (mechanism) and descriptive representation (pool). Venice maximized the former while explicitly rejecting the latter. Here is the breakdown of where the theory holds, where it bends, and where it breaks under the weight of the Serenissima.

  #### 1. Walking the Claims Through the Machinery
  *   **Anti-Faction (Guerrero/Dowlen):** **Confirms.** The complex alternating sequence of lot and ballot for the Doge was explicitly engineered to make vote-buying computationally impossible. You cannot bribe a committee that doesn't exist yet and will be chosen by lot from a committee that was just chosen by lot. Venice's stability suggests the *mechanism* successfully defused factionalism within the eligible pool.
  *   **Descriptive Representation/Epistemic Diversity (Landemore):** **Breaks.** The *Serrata* (1297) legally froze the pool into a hereditary caste. There was no sampling from the population, no cognitive diversity beyond the variations within a single commercial aristocracy, and no descriptive representation of the *popolo*. The system worked *despite* homogeneity, not because of diversity.
  *   **Manin's Distinction (Lot=Democratic, Election=Aristocratic):** **Strains.** In Venice, lot was not used to empower the people; it was used to prevent aristocrats from killing each other. Election was used to filter for merit *within* the aristocracy. The "democratic" label for sortition collapses when the demos is a closed guild.

  #### 2. The Crux: Separability of Benefits
  Venice demonstrates that the anti-faction payoff is **separable** from descriptive representation. The stability of the Republic derives from the blindness of the selection mechanism, not the representativeness of the sample. This implies that Guerrero and Dowlen are correct about the *mechanism's* ability to stop capture, but Landemore's epistemic claims are contingent on a separate prior decision: defining the pool. If the pool is homogeneous, sortition yields a stable homogeneous rule. If the pool is the whole citizenry, it yields stable diverse rule. The "epistemic upside" is not a property of the lottery; it is a property of the franchise.

  #### 3. The Pool Problem
  Venice suggests eligibility matters more than selection. This is a hostile amendment to lottocracy. If the primary variable for outcomes is *who is in the urn* rather than *how you draw from the urn*, then lottocracy collapses into franchise theory wearing a different hat. Modern lottocracy assumes the "people" are the pool; Venice proves that if the "people" are defined as "nobles," sortition merely perfects oligarchy. You cannot fix the pool by tweaking the draw.

  #### 4. Where the Theory is Silent: Real Power
  The theory assumes the sortition body holds sovereignty. In Venice, the Doge (chosen by lot-heavy machinery) was a figurehead constrained by the *Promissione Ducale*. Real power lay with the Senate and the Council of Ten, whose members were largely elected or co-opted, not chosen by pure lot. This strains the lottocratic claim that sortition equals rule. Venice is better described as **election-and-cooptation with a randomizer bolted on top purely as an anti-bribery device for the executive figurehead.** Sortition into a powerless office does not constitute lottocracy; it constitutes risk management for an oligarchy.

  #### 5. The Conservative Flip Side
  Venice confirms sortition can be a conservative technology. It froze the elite in place and prevented internal defection. For modern proponents, this means sortition does not guarantee progressivism or democracy; it guarantees *representativeness of the status quo pool*. If the pool is selected by property or heredity, sortition stabilizes that property or heredity against internal usurpers.

  #### 6. Mapping Breaks (Discipline Check)
  *   **No Parties/Media:** The anti-faction benefit survives this difference. Venice stopped factions without needing to regulate media because the mechanism made coordination impossible.
  *   **Face-to-Face:** The anti-corruption benefit strains here. In a small elite, social pressure replaces legal enforcement. Modern large-scale sortition lacks this mutual knowledge.
  *   **Eligibility by Descent:** The epistemic diversity claim **does not survive**. You cannot get diversity from a closed genetic pool.
  *   **Powerless Office:** The "rule by the people" claim **does not survive**. Venice used lot to select a servant of the state, not a master of the law.

