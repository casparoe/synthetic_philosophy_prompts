answer: |-
  This is one of the classic knots in Aristotelian scholarship, and you have tied it correctly. The tension you feel is real, but it isn't a contradiction in Aristotle's system; it is a feature of his teleology. He is looking at the *same tool* (money) from two different angles: its function in holding a community together (*Ethics*) and its function in driving human desire (*Politics*).

  Here is the gut-level intuition, followed by the technical machinery for your four questions.

  ### The Gut-Level Intuition

  Think of money like a scoreboard in a game.

  In the **Ethics**, the game is "living together in a city." To keep the game going, the players need to know if the score is fair. A builder builds a house; a shoemaker makes shoes. How many shoes equal a house? We can't put them on a scale. So we invent a "score" (money) to represent the *effort and need* involved. The scoreboard is artificial (conventional), but it keeps the players from quitting out of frustration. The goal is to keep the game going.

  In the **Politics**, the problem is when players forget they are playing a game and start trying to accumulate points for the sake of points. If you play soccer just to score goals, you stop when you're tired or the game ends. If you play just to get the highest number on the scoreboard, you never stop, because numbers go on forever. You might even start cheating the rules to make the numbers go up faster (usury).

  The knot untangles when you realize Aristotle thinks the **purpose** determines the **limit**. Money is a great servant for the first game (exchange) but a terrible master for the second life (living well).

  ---

  ### The Technical Machinery

  Here is how that intuition maps onto your four specific questions.

  #### 1. Where exactly does the limit live?
  **Diagnosis:** It is about the **End (*Telos*)**, which dictates the Object and the Quantity.

  It is easy to think the limit is about the *object* (goods are natural, money is artificial). But Aristotle admits you can naturally accumulate too many tools or too much food. You can also use money naturally (to buy food). So the object isn't the primary differentiator.

  The limit lives in the **satisfaction of need**.
  *   **Natural Acquisition (*Oikonomia*):** The end is the *use* of the thing (eating the food, wearing the shoe). Since human biological need is finite, the acquisition required to meet it is finite. The limit is external (the stomach gets full).
  *   **Unnatural Acquisition (*Chrematistike*):** The end is the *accumulation of the medium*. Since the medium (money) is a number/symbol, it has no internal ceiling. The limit is supposed to be external (buying goods), but if the goal is the money itself, the limit vanishes.

  **The Mechanism:** The limit is internal to the *activity*. If the activity is "satisfying need," it stops when need is met. If the activity is "increasing the measure," it never stops, because a measure can always be larger.

  #### 2. Is the conventionalism doing double duty?
  **Diagnosis:** It is the **same insight**, and Aristotle is fully aware of the double-edged sword.

  This is the crux of the knot. Money is *nomisma* (from *nomos*, law/custom). It has no natural use (you can't eat gold coins).
  *   **In the *Ethics*:** This "emptiness" is a **virtue**. Because money has no specific natural use, it can be a universal placeholder. It is flexible enough to stand in for houses, shoes, and food equally. It allows for the abstraction required for proportionate reciprocity.
  *   **In the *Politics*:** This "emptiness" is a **vice**. Because money has no natural use, it has no natural point of rest. A pile of wheat rots (nature imposes a limit). A pile of gold does not. Because it is purely conventional, humans can project infinite desire onto it.

  Aristotle sees this clearly. The very feature that makes money *useful* for justice (its abstractability) is what makes it *dangerous* for virtue (its detachability from reality). He isn't contradicting himself; he is diagnosing a technology. He thinks the city *needs* this dangerous tool to function, which is why the lawgiver must educate citizens not to fall in love with the tool.

  #### 3. What is left of "exact justice" given the incommensurability concession?
  **Diagnosis:** Justice collapses into **political stability**, not mathematical precision.

  When Aristotle says strict commensurability is impossible, he is making a metaphysical point: a house and a shoe are ontologically different. No amount of labor-hours makes them *the same*.

  However, "Exact Justice" in the *Ethics* does not mean "Mathematical Equality." It means **"Equality of Relation."**
  *   The formula is not $A = B$.
  *   The formula is $A : B :: \text{Product}_A : \text{Product}_B$.

  Money allows us to express that proportion. When he says demand (*chreia*) is the real measure, he means that the "truth" of the exchange is whether both parties' needs are sufficiently met to continue the association.

  **Why is approximation enough?**
  Because the goal of exchange justice is not accounting; it is *koinonia* (community). If the builder feels he has been treated "as if" equal to the shoemaker, the bond holds. The "wobble" in money's purchasing power is acceptable because the alternative (barter based on exact need matching) is impossible. Aristotle is a pragmatist here: practical truth is truth that holds the city together, not truth that satisfies a geometer.

  #### 4. Is the usury objection just the no-limit argument?
  **Diagnosis:** It is the **No-Limit argument grounded in the Nature argument.**

  You sensed these two hooks (limit vs. nature) weren't connecting. Here is the link: **Sterility.**

  *   **The Nature Argument:** Money is a medium of exchange, not a good for consumption. It is "barren." A cow breeds a calf (natural increase). A house provides shelter (use). Money provides neither.
  *   **The Limit Argument:** Because money is barren, making it "breed" (interest) is forcing it against its nature.

  Why is this the "worst case" of the no-limit problem?
  In trade (buying low, selling high), you are still technically dealing with goods, even if your motive is profit. There is still a shadow of "use" involved.
  In usury, the good being traded *is* the money itself. The "offspring" of the money is more money.

  This connects the two texts:
  1.  **Ethics:** Money is a measure of *need*.
  2.  **Politics:** Usury makes money a measure of *nothing but itself*.

  If money is a measure of need, charging interest is charging for the *measure* rather than the *thing measured*. It is the ultimate detachment of the symbol from the reality. Because it is completely detached from reality (nature), it is completely detached from limits. Usury is the logical conclusion of treating the *nomisma* (convention) as if it were *physis* (nature).

  ### Summary of the Knot Untangled

  The tension you feel is the tension of **Civilization** itself in Aristotle's view.

  1.  **The *Ethics* describes the City as it must be:** We need money to make different people equal enough to live together. We accept the fiction of commensurability because the alternative is isolation.
  2.  **The *Politics* describes the Citizen as he should be:** You must use this fiction without believing it is the truth. If you believe the money *is* the wealth (rather than a token for wealth), you become unnatural and unlimited.

  The "limit" is not in the coin; it is in the soul of the user. The *Ethics* provides the machinery for the exchange; the *Politics* provides the warning label for the user. The usurer is the person who reads the warning label, ignores it, and then breaks the measuring stick to use it as a weapon.
