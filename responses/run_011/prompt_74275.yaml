answer: |-
  # THE GEOMETRIC LIFE

  **Stop optimizing for the ensemble. Start optimizing for the time series.**

  Most self-help is arithmetic. It asks you to maximize expected value. This is fatal in a non-ergodic world. The average outcome of 100 people is not the average outcome of one person over 100 trials. Consider the standard coin: heads pays +60%, tails loses −40%. The arithmetic expected return is +10%. Yet if you bet your entire bankroll every flip, your wealth multiplies by 1.6 then 0.6. The product is 0.96. You lose 4% every two flips, or roughly 2% per round. The geometric mean is less than one. You go to zero.

  Ruin is an absorbing state. Once you are dead, fired, or divorced, you cannot play the hand again. You cannot average your way back from zero. The Geometric Life optimizes for survival first, growth second. We maximize the expected logarithm of wealth. We treat your lifespan as a single, unbroken trajectory where variance is not a feature, but a threat to continuity.

  ### THE PROTOCOL

  1.  **Maximize Log Utility:** Never bet the farm. Always bet the fraction that maximizes the growth rate of your bankroll.
  2.  **Zero Tolerance for Ruin:** Any action with a non-zero probability of total ruin is forbidden. This includes driving, skydiving, and eating unverified shellfish.
  3.  **Fractional Betting on Noise:** Where probability estimates are noisy, bet half the optimal size. There is no backtest for human relationships.

  ### A SAMPLE WEEK

  **Monday:** Rebalance investment portfolio to growth-optimal weights. Decline lunch meeting. Travel risk exceeds expected value of contract.
  **Wednesday:** Commute via train. Driving imposes a 0.0001% daily mortality risk. Over 50 years, this compounds to an unacceptable probability of absorption.
  **Friday:** Social allocation. Friendships have noisy returns. We bet half-size. One dinner, 45 minutes. Exit before marginal utility turns negative.
  **Weekend:** Premium Tier members may leverage social exposure up to 1.5x. Basic members remain in cash equivalents (reading).

  ### TESTIMONIALS

  "My portfolio volatility is zero. My wife filed for divorce last month. She couldn't handle the drawdown in intimacy. The math holds."
  — **Mark T., Premium Member**

  "I avoided the shellfish at the wedding. Anaphylaxis risk was 0.04%. Unacceptable. I am still alive. I eat alone. I win."
  — **Sarah L., Basic Tier**

  ### FAQ

  **Q: What about one-off events? Isn't this logic for repeated gambles?**
  A: If the outcome is ruin, the event does not need to repeat. Death is a terminal state. You only need to lose once.

  **Q: Why do you recommend against children?**
  A: Children are unhedgeable permanent capital allocation with infinite downside risk. There is no exit strategy. The parameter uncertainty is too high.

  **Q: Have you ever personally lost money?**
  A: No. The downside risk is covered by a separate vehicle.

  ### FINE PRINT

  Enrollment implies acceptance of all risks, including social isolation. This program utilizes the Kelly criterion for position sizing. Performance not guaranteed. Past survival does not guarantee future survival.

  **The family trust requires a biological heir to release the principal upon my death.**
