prompt: |-
  I chair the data-governance committee for a mid-size freight brokerage — five of us: two analysts, an ops manager, a claims lawyer, and me. Every week we get maybe six requests to change a definition in the business glossary (transit time, on-time, active shipment, accessorial, detention), and the meetings go badly in a predictable way. Half the time somebody says it's just a matter of what we decide the word means, so there's nothing to argue about. The other half somebody says no, there's a fact of the matter about what our operations actually are and the definition should track it. We can never agree on which kind of dispute we're in, and we burn fourty minutes on things that should take five.

  Write a triage procedure the committee can run on one request in about twenty minutes, grounded in whatever the analytic/synthetic debate really supports — including the argument that there's no clean line between the two, and the point that you can't end a disagreement just by declaring the sentence true by definition. I want the questions in order with a stated pass condition for each, a workable rule for telling "we stipulate this, and here's what makes one stipulation better than another" apart from "there's evidence bearing on it," something about how entrenched a definition is and what a revision cascades into downstream, and an explicit handoff for the ones that are really about who eats a cost rather than about truth. End each run at one of three exits: approve the change, reject it, or send it to whoever owns the P&L because it was never our call.

  Then run it on three cases: whether on-time is measured against the appointment window in the tender or against what the customer says they expected; whether a shipment cancelled and rebooked under a new pro number counts as one shipment or two, where the answer moves our published volume by about 4%; and whether a driver waiting 45 minutes at a dock is detained and therefore billable. At least one of them should land somewhere I won't like — I've spent two years defending our current detention definition, so don't soften it if it turns out I've been treating an empirical claim as a stipulation.

  Mark every place where the procedure is a judgment call wearing a lab coat, and close with what it can't do.
reasoning: |-
  Here's a thinking process that leads to the suggested triage procedure and case analysis:

  1.  **Analyze the Request:**
      *   **Context:** Chair of a data-governance committee at a mid-size freight brokerage.
      *   **Team:** 5 people (Chair, 2 analysts, 1 ops manager, 1 claims lawyer).
      *   **Problem:** Weekly meetings bog down on definition changes (transit time, on-time, active shipment, etc.).
      *   **Conflict:** Disagreement on whether definitions are *stipulative* (we decide what it means) or *descriptive* (it tracks reality/operations). This leads to 40-minute debates on 5-minute topics.
      *   **Philosophical Grounding:** Needs to be grounded in the analytic/synthetic debate (Quinean skepticism about a clean line, but pragmatic utility in distinguishing them). Acknowledges that declaring something true by definition doesn't end disagreement if the stakes are real.
      *   **Requirements:**
          *   Triage procedure (approx. 20 mins/request).
          *   Ordered questions with pass conditions.
          *   Rule for distinguishing "stipulation" vs. "evidence."
          *   Consideration of entrenchment/downstream impact.
          *   Handoff for cost/P&L disputes.
          *   Three specific exits: Approve, Reject, Send to P&L Owner.
          *   Run the procedure on three specific cases (On-time, Cancelled/Rebooked, Detention).
          *   Constraint: At least one outcome must be unfavorable to the Chair (specifically regarding the detention definition they've defended for 2 years).
          *   Formatting: Mark "judgment calls wearing a lab coat."
          *   Closing: Limitations of the procedure.

  2.  **Deconstruct the Philosophical Core (Analytic/Synthetic):**
      *   *Analytic:* True by definition (e.g., "All bachelors are unmarried"). In business: "An 'active shipment' is one with status X."
      *   *Synthetic:* True by fact of the world (e.g., "It is raining"). In business: "Drivers usually wait 45 minutes."
      *   *Quine's Critique:* There is no sharp boundary. Definitions are central to our web of belief, but they can be revised if the empirical pressure is high enough.
      *   *Pragmatic Solution:* We can't solve the metaphysics, but we can solve the *workflow*. We need to ask: "Are we arguing about language or money/operations?"
      *   *Key Insight:* If changing the definition changes the *measured reality* significantly without changing the *actual operation*, it's a reporting/stipulation issue. If changing the definition requires changing the *actual operation* to maintain truth, it's an empirical issue. If changing the definition shifts *liability/revenue*, it's a commercial issue, not a governance issue.

  3.  **Drafting the Triage Procedure (The "20-Minute Protocol"):**
      *   *Goal:* Speed and clarity.
      *   *Step 1: Impact & Entrenchment.* How many systems/reports touch this? (Quinean "centrality").
      *   *Step 2: The "Truth-Maker" Test.* Is the dispute about how we *count* or what we *do*?
      *   *Step 3: The "Wallet" Test.* Does this change who pays or gets paid?
      *   *Step 4: Stipulation Quality.* If it is a stipulation, is the new one *better* (clearer, more consistent) or just *different*?
      *   *Exits:* Approve (Governance), Reject (Governance), Escalate (Commercial/Ops).
      *   *Lab Coat Markers:* Need to explicitly highlight where human judgment overrides the "algorithm."

  4.  **Developing the Three Cases:**
      *   *Case 1: On-Time (Appointment vs. Expectation).*
          *   *Issue:* Contractual reality vs. Customer sentiment.
          *   *Analysis:* Appointment window is in the tender (contract). Expectation is subjective.
          *   *Verdict:* Likely Approve (stick to contract) or Reject (if changing to expectation). Let's say the request is to change *to* "Customer Expectation."
          *   *Outcome:* Reject. It introduces subjectivity (bad data) and doesn't change operations, just measurement.
      *   *Case 2: Cancelled/Rebooked (One shipment or Two?).*
          *   *Issue:* Volume metrics. 4% swing.
          *   *Analysis:* Is this a data structure issue or a sales metric issue?
          *   *Verdict:* This feels like a "Wallet" test failure. If it moves volume by 4%, it affects sales comp or market positioning.
          *   *Outcome:* Send to P&L.
      *   *Case 3: Detention (45 mins wait).*
          *   *Issue:* Chair has defended current definition for 2 years.
          *   *Constraint:* One outcome must be unfavorable to the Chair.
          *   *Current Stance:* Chair likely argues "45 mins isn't detention" (stipulation).
          *   *Reality:* If industry standard or contract says 60 mins, but ops treats 45 as billable, there's a mismatch. Or, if the Chair is treating an empirical claim (drivers get angry/costs incur) as a stipulation.
          *   *Scenario:* Request is to *lower* threshold to 30 mins or *raise* to 60? Let's assume the request is to align with industry standard (e.g., 60 mins), but Chair wants to keep it at 45 to capture more revenue.
          *   *Wait, the prompt says:* "I've spent two years defending our current detention definition... don't soften it if it turns out you've been treating an empirical claim as a stipulation."
          *   *Implication:* The Chair is likely arguing "Detention *is* 45 minutes" (stipulation) when actually "Detention *costs us money at* 60 minutes" (empirical) or "Contracts *say* 60 minutes" (legal).
          *   *Pivot:* Let's make the request: "Align detention definition with standard contract language (60 mins)." Chair wants 45.
          *   *Procedure Result:* The procedure should reveal this is a *commercial/legal* risk, not a data definition. Or, if it's purely data, the "Truth-Maker" test shows the current definition misrepresents the liability.
          *   *Decision:* Send to P&L/Legal. Why? Because defining detention determines billability. That's a pricing strategy, not a glossary entry. This hurts the Chair because they wanted to govern it themselves to keep revenue high.
          *   *Alternative:* Reject the Chair's defense. If the Chair claims "45 mins is the truth of detention," the procedure should flag that this is an empirical claim about carrier agreements. If agreements say 60, the definition is *false* (synthetic error), not just a stipulation.
          *   *Let's go with:* Send to P&L/Legal. It removes the committee's authority to decide, implying the Chair was overstepping by treating a pricing term as a data term.

  5.  **Refining the Procedure (incorporating Quine/Pragmatism):**
      *   Need to ensure the distinction between "Stipulation" and "Evidence" is workable.
      *   *Rule:* If the definition change requires an *operational process change* to remain true, it's empirical. If it only requires a *SQL query change*, it's stipulative.
      *   *Entrenchment:* If downstream reports break, the cost of change weighs against the benefit.
      *   *The "Wallet" Test:* If the definition assigns cost/revenue, it's not governance; it's finance.

  6.  **Writing the Content - Section by Section:**
      *   *Intro:* Acknowledge the Quinean mess.
      *   *The Protocol:* 4 Gates.
      *   *The Cases:* Apply the gates.
      *   *The "Lab Coat" Markers:* Bold or italicized notes.
      *   *Limitations:* What this can't solve (politics, culture).

  7.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I mark the judgment calls? Yes, need to be explicit.
      *   *Check:* Did I hurt the Chair on detention? Yes, need to make sure the logic holds that their 2-year defense was misclassified.
      *   *Check:* Is the tone appropriate? Professional, slightly philosophical but pragmatic.
      *   *Check:* Time limit? The procedure needs to feel like 20 mins. Keep questions sharp.
      *   *Philosophical Nuance:* Ensure I don't claim the Analytic/Synthetic distinction is *real*, but that it's *useful* as a heuristic. (Quine's point).

  8.  **Final Polish:**
      *   Make sure the "Exit" conditions are clear.
      *   Ensure the "Lab Coat" warnings are visible.
      *   Verify the Detention case logic: If the Chair defines detention as 45 mins, but contracts say 60, the definition is empirically wrong regarding liability. If the Chair defines it as 45 mins to *make* it billable despite contracts, that's fraud/risk. If the Chair defines it as 45 mins internally but bills at 60, it's a metric mismatch. Let's assume the definition drives billing. If so, it's a P&L call.

      *(Self-Correction on Detention Case)*: The prompt says "don't soften it if it turns out you've been treating an empirical claim as a stipulation."
      *   *Scenario:* Chair argues "Detention *is* 45 minutes" (Analytic/Stipulation).
      *   *Reality:* Carrier contracts typically specify free time (e.g., 2 hours). If we define it as 45 mins internally, we are measuring something that doesn't match the liability trigger.
      *   *Procedure Outcome:* The procedure should identify that this definition claims to track a financial liability (Synthetic). Since the liability is determined by contract (Evidence), the definition cannot be stipulated arbitrarily.
      *   *Verdict:* Reject the Chair's stipulation. Send to Legal/P&L to align definition with contract reality. This hurts the Chair (loss of control + admission of error).

  9.  **Finalizing the Text:** (Drafting the response based on these thoughts).
      *   *Tone:* Direct, operational, slightly academic but grounded.
      *   *Structure:* Protocol -> Cases -> Limitations.
      *   *Markers:* Use `[JUDGMENT CALL]` tags.

  10. **Final Review against constraints:**
      *   20 mins? Yes, 4 gates.
