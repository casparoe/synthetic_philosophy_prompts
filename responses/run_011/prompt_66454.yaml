answer: |-
  # The "Twenty-Minute Triage" Protocol for Data Definitions

  **Philosophical Premise:** We accept Quine's critique: there is no metaphysical firewall between "truths by definition" (analytic) and "truths by fact" (synthetic). However, for workflow purposes, we must act *as if* there is a distinction. We are not searching for ultimate truth; we are searching for **friction**. If a definition change creates friction in operations or finance, it is not merely a glossary update.

  **Participants:** Chair, 2 Analysts, Ops Manager, Claims Lawyer.
  **Timebox:** 20 Minutes hard stop per request.
  **Exits:**
  1.  **APPROVE:** Governance owns this. It is a clean stipulation.
  2.  **REJECT:** Governance owns this. The stipulation is inferior (less clear/consistent) or too entrenched.
  3.  **ESCALATE:** This is not a data problem. Send to P&L Owner / Legal / Ops Lead.

  ---

  ## The Procedure (4 Gates)

  ### Gate 1: Entrenchment & Cascade (3 Minutes)
  **Question:** How many downstream reports, contracts, or automated triggers rely on this specific term *as currently defined*?
  *   **Pass Condition:** We can list the impacted systems on a whiteboard in under 2 minutes.
  *   **Fail Condition:** We don't know, or the list is "everything."
  *   **[JUDGMENT CALL]:** *If the term is "highly entrenched" (e.g., used in CEO dashboards), the burden of proof for change shifts to the requester. You must weigh the cost of rewriting history against the benefit of accuracy.*

  **Decision:** If Fail, **ESCALATE** to Data Engineering for impact analysis. If Pass, proceed.

  ### Gate 2: The "Truth-Maker" Test (7 Minutes)
  **Question:** To make the new definition "true," do we need to change a **SQL query** (Stipulation) or do we need to change a **physical operation** (Fact)?
  *   **Rule:**
      *   **Stipulation:** We are just counting differently. (e.g., "We will count a 'lead' as someone who opened an email" vs. "clicked a link".)
      *   **Fact:** The definition claims to track a real-world constraint. (e.g., "A 'safe delivery' is one without damage." You cannot define away damage.)
  *   **Pass Condition:** The committee agrees this is a Stipulation.
  *   **Fail Condition:** The definition claims to describe reality (Synthetic), but the proposed change contradicts operational evidence.
  *   **[JUDGMENT CALL]:** *This is the danger zone. If someone argues "But in reality, drivers wait 45 minutes," and you reply "It doesn't matter, we define detention as 60," you are treating an empirical claim as a stipulation. If the definition drives billing or liability, it is likely a Fact claim.*

  **Decision:** If Pass (Stipulation), go to Gate 3. If Fail (Fact), go to Gate 4.

  ### Gate 3: Stipulation Quality (5 Minutes)
  **Question:** Assuming we *can* define this however we want, is the new definition **better** or just **different**?
  *   **Criteria for "Better":**
      1.  **Consistency:** Does it align with industry standards (e.g., FMCSA, ISO)?
      2.  **Clarity:** Is it less ambiguous than the current version?
      3.  **Utility:** Does it help the business make better decisions?
  *   **Pass Condition:** The new definition scores higher on at least two criteria.
  *   **Fail Condition:** It is purely cosmetic or creates ambiguity.
  *   **[JUDGMENT CALL]:** *Avoid "Nirvana Fallacy." Do not reject a good definition because it isn't perfect. Compare it to the status quo, not an ideal.*

  **Decision:** If Pass, **APPROVE**. If Fail, **REJECT**.

  ### Gate 4: The "Wallet" Test (5 Minutes)
  **Question:** Does changing this definition directly change who pays money, who gets billed, or who bears risk?
  *   **Rule:** If the definition determines revenue recognition, cost allocation, or legal liability, the Data Governance Committee **does not have authority**. We manage meaning, not margin.
  *   **Pass Condition:** The financial impact is neutral or negligible.
  *   **Fail Condition:** The definition change moves revenue/cost by >1% or alters legal exposure.
  *   **[JUDGMENT CALL]:** *You must estimate the financial variance quickly. If the Ops Manager or Lawyer says "This changes our liability," believe them. Do not argue semantics against legal risk.*

  **Decision:** If Pass, **APPROVE** (as a Fact-based definition). If Fail, **ESCALATE** to P&L Owner/Legal.

  ---

  ## Case Runs

  ### Case 1: "On-Time" (Appointment Window vs. Customer Expectation)
  *Request:* Change definition of "On-Time" from "Arrival within Tender Appointment Window" to "Arrival within Customer's Stated Expectation."

  *   **Gate 1 (Entrenchment):** Used in weekly ops review and carrier scorecards. Impact is known. **PASS.**
  *   **Gate 2 (Truth-Maker):**
      *   *Current:* Tracks contractual tender data (Fact/Stipulation hybrid).
      *   *Proposed:* Tracks "Customer Expectation."
      *   *Debate:* Analyst says "We can just query the CRM notes." Ops Manager says "Expectations are verbal and unrecorded."
      *   *Finding:* The proposed definition claims to track a fact (customer satisfaction) but lacks a reliable truth-maker (data source). It turns a binary metric into a subjective one.
      *   **[JUDGMENT CALL]:** *Treating "Expectation" as a definable data field when it is largely anecdotal is a category error.*
  *   **Gate 3 (Quality):** Is it better? No. It reduces consistency.
  *   **Exit:** **REJECT.**
  *   *Rationale:* This is a stipulation that reduces data quality. We cannot define "On-Time" against a variable we do not systematically capture.

  ### Case 2: "Active Shipment" (Cancelled & Rebooked = 1 or 2?)
  *Request:* Count a cancelled shipment rebooked under a new PRO number as **one** continuous shipment. Currently counted as **two**. This increases published volume by 4%.

  *   **Gate 1 (Entrenchment):** Used in Sales Dashboards and Marketing Materials. **PASS.**
  *   **Gate 2 (Truth-Maker):**
      *   *Debate:* Analyst says "It's the same freight, so it's one shipment." Ops says "It required a new load board post and a new carrier contract."
      *   *Finding:* Operationally, two distinct workflows occurred. Merging them hides operational friction.
  *   **Gate 3 (Quality):** Is it better? It smooths volume, but hides failure rates.
  *   **Gate 4 (Wallet):**
      *   *Debate:* Requester admits this moves published volume by 4%.
      *   *Finding:* This directly impacts Sales KPIs and potentially market valuation perception.
      *   **[JUDGMENT CALL]:** *A 4% swing in volume is material. This is not a glossary cleanup; it is a revenue recognition policy.*
  *   **Exit:** **ESCALATE to VP of Sales / CFO.**
  *   *Rationale:* Governance cannot dictate how volume is sold to the market. This is a commercial policy decision disguised as a data definition.

  ### Case 3: "Detention" (45 Minutes vs. Contract Standard)
  *Request:* Align "Billable Detention" definition with industry standard (60 minutes free time).
  *Current State:* Chair (You) has enforced a definition of 45 minutes for two years to capture more revenue.
  *Argument:* You have argued, "Detention is what we say it is. We define the threshold."

  *   **Gate 1 (Entrenchment):** Used in Billing Engine and Carrier Pay. **PASS.**
  *   **Gate 2 (Truth-Maker):**
      *   *Debate:* You argue: "It's a definition. We stipulate 45 minutes."
      *   *Lawyer interrupts:* "Our standard broker-carrier agreement grants 60 minutes free time. If we bill at 45, we are billing against contract."
      *   *Finding:* The definition claims to track **billable liability**. Liability is determined by contract (Evidence), not glossary (Stipulation).
      *   **[JUDGMENT CALL]:** *Here is the hard truth: You have been treating a Synthetic claim (contractual liability) as an Analytic one (internal definition). You cannot define away the contract terms.*
  *   **Gate 4 (Wallet):**
      *   *Finding:* Directly changes revenue and legal risk.
      *   **[JUDGMENT CALL]:** *Even if you wanted to keep 45 minutes, the committee lacks the authority to override contract law.*
  *   **Exit:** **ESCALATE to Legal / P&L Owner.**
  *   *Rationale:* This is not a data governance issue. It is a pricing and compliance issue. The definition must track the contract, not the other way around. Your two-year defense was a category error.

  ---

  ## Limitations: What This Procedure Cannot Do

  1.  **It Cannot Solve Politics:** If the VP of Sales demands Case 2 be counted their way, this procedure will only tell you to escalate it. It does not give you the power to stop them.
  2.  **It Cannot Fix Bad Data:** If "Customer Expectation" (Case 1) is vital but unrecorded, this procedure rejects the definition. It does not create the process to capture the data.
  3.  **It Relies on Honest Self-Reporting:** Gate 4 requires the requester to admit financial impact. If they lie about the 4% volume swing in Case 2, the committee will approve a commercial change thinking it's operational.
  4.  **It Is Not a Substitute for Strategy:** A definition can be "consistent" and "clear" (Gate 3) but still strategically wrong. This protocol ensures the *right people* argue about strategy, not the data committee.

  **[JUDGMENT CALL]:** *The hardest part of this protocol is Gate 2. It requires you to admit when you are wrong about the nature of reality. In Case 3, it requires you to admit that your authority as Chair ends where the contract begins.*
