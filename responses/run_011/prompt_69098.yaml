answer: |-
  Decision Tree: Sorting Structural Explanations

  1.  Can processes on different timescales cause one another, or must explanation run in one direction only (from slow conditions to fast events)?
      *   One another (Recursive): **Anti-Layering / Processual Historicism**
      *   One direction only (Slow -> Fast): Go to Question 2.

  2.  Does the silting-up that ends a port's prosperity belong with the coastline (physical) or with the war that closed its market (social)?
      *   Coastline (Physical): Go to Question 3.
      *   War/Market (Social): Go to Question 4.

  3.  Does the slow layer merely rule possibilities out, or does it also select among the possibilities it leaves open (determines outcome)?
      *   Selects/Determines: **Hard Environmental Determinism**
      *   Rules Out (Constraints): Go to Question 3b.

  3b. Is the geographic constraint a distinct temporal prison (*longue durée*) or a static backdrop for human time?
      *   Temporal Prison: **Braudel's Layered Scheme**
      *   Static Backdrop: **Possibilism**

  4.  Is the decisive social structure located in the global division of labor or the rules of a single polity?
      *   Global Division: Go to Question 5.
      *   Single Polity: Go to Question 6.

  5.  Is the divergence between core and periphery necessary (logic of accumulation) or contingent (access to coal/colonies)?
      *   Necessary: **World-Systems Account**
      *   Contingent: **California School**

  6.  Must an adequate account terminate in the reasons of particular people (acting within rules) or in the impersonal logic of class positions?
      *   Reasons of People: **Institutional Account**
      *   Class Positions: **Social-Property-Relations Account**

  ***

  **Analysis of Indistinguishability and Empty Cells**

  **Indistinguishable Pair:**
  *   **Braudel's Layered Scheme** and **Possibilism**.
  *   **Reason:** While theoretically distinct on the nature of time (temporal prison vs. static stage), in empirical practice both often reduce to the claim that "geography set the boundaries," making it difficult to code a specific historical argument as one or the other without explicit philosophical commitment from the author.

  **Empty Cells:**
  1.  **Pattern:** `["No", "Yes"]` (Recursive Time, Physical Cause).
      *   **Status:** Incoherent.
      *   **Diagnosis:** Physical constraints are by definition external to human agency; claiming they are recursively constituted by the very events they constrain contradicts the materialist premise.
  2.  **Pattern:** `["Yes", "No", "Yes", "Yes"]` (Layered, Social, Global, Reasons of People).
      *   **Status:** Unfashionable.
      *   **Diagnosis:** World-systems theory explicitly rejects methodological individualism; combining global structuralism with individual rational choice is theoretically dissonant.
  3.  **Pattern:** `["Yes", "Yes", "Yes", "No"]` (Layered, Physical, Determines, Static).
      *   **Status:** Incoherent.
      *   **Diagnosis:** Hard determinism relies on dynamic environmental forces (climate shift, soil exhaustion); a static backdrop cannot actively select a specific outcome.

