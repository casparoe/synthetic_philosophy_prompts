answer: |-
  ### Part I: Ranking by Genuine Causal Work

  **Criterion:** I am ranking these by **counterfactual leverage** and **mechanism specificity**. A high score means that if you removed this variable from the historical model, the economic outcome would likely change, and we can describe *how* that change happens without relying on circular reasoning. A low score indicates the variable is either a byproduct of other forces, impossible to isolate, or a description of the outcome rather than a driver of it.

  1.  **(g) Institutions — 9/10**
      Church discipline, credit networks, and inheritance rules constitute the actual "plumbing" of the economy; they determine who gets capital, who gets sued, and who gets trusted, offering a concrete, separable mechanism for divergence.
  2.  **(f) Sorting and reverse causation — 8/10**
      This offers the strongest rival hypothesis to cultural causation: if ambitious risk-takers self-selected into Protestantism (or were expelled into it), the creed did not create the capitalist, the capitalist created the creed's demographic.
  3.  **(c) Human capital — 8/10**
      Literacy and numeracy are measurable skills that directly increase productivity and adaptability; unlike "ethics," they can be taught, tested, and linked to specific economic outputs like ledger-keeping or contract reading.
  4.  **(a) Preferences — 6/10**
      While thrift and diligence affect savings rates, it is notoriously difficult to prove these dispositions were caused by theology rather than by the economic necessity of the groups who happened to hold that theology.
  5.  **(d) Norms as equilibria — 5/10**
      *Note: This is the informal shadow of (g).* It describes how behaviour is stabilised socially, but without the formal enforcement of (g), it is hard to distinguish from mere conformity or the preferences in (a).
  6.  **(e) Repertoires and categories — 4/10**
      Changing what is "thinkable" is profound, but in a material crisis, actors often bypass cultural categories to survive, making this a weak predictor of hard economic outcomes compared to credit or skills.
  7.  **(b) Legitimation — 2/10 [REDESCRIPTION]**
      This is not a causal claim but a **rationalising redescription**; it argues that the profit motive existed first and religion merely painted it, so the doctrine explains the *language* of the actors but not the *action* itself.
  8.  **(h) The philosophical worry — 0/10 [META-CRITIQUE]**
      This is not a causal mechanism at all but a **methodological dissolution** of the question; it argues that "values" are the wrong unit of analysis entirely, so it cannot bear causal weight by definition.

  ***

  ### Part II: Ranking by Dramatic Availability (The 1897 Dinner)

  **Criterion:** I am ranking these by **character coherence** and **ironic potential**. The top items are what your mill owner *would* say to validate his self-regard; the bottom items are what he *cannot* say without admitting his success is accidental, cynical, or illusory. The "wrong in an interesting way" effect is maximised where his confidence is highest but his explanatory power is lowest.

  1.  **(a) Preferences**
      He will confidently claim his family works harder and saves more because God demands it; this is the most self-serving option because it equates his bank balance with his moral virtue, making him wrong about the *source* of his wealth while right about his *habit*.
  2.  **(c) Human capital**
      He can plausibly boast that his children read the Bible and therefore understand contracts better than the vintners; this sounds meritocratic but ignores that the Catholics may have chosen oral traditions or different schooling for sound economic reasons of their own.
  3.  **(g) Institutions**
      He might argue his network is more trustworthy, which is factually robust but dramatically dangerous; it exposes him as admitting that his success relies on exclusionary cliques rather than divine favour or individual grit.
  4.  **(e) Repertoires and categories**
      He could try to sound profound by saying Catholics "do not see time as money," but in 1897 this risks sounding like mystical nonsense to a professor who knows Catholic banks exist; it makes him seem culturally provincial.
  5.  **(d) Norms as equilibria**
      This is too sociological for a dinner table; if he argues that he behaves well only because he fears his neighbours' judgement, he undermines his claim to inner virtue and sounds like a conformist.
  6.  **(f) Sorting and reverse causation**
      He cannot argue this without admitting his family's status is largely due to historical accident or migration patterns; this destroys the narrative of earned success and makes him sound like a beneficiary of luck.
  7.  **(b) Legitimation**
      To suggest his religion is just a mask for greed is to confess hypocrisy; no amount of self-regard allows a man to tell a guest that his piety is a marketing strategy for profit.
  8.  **(h) The philosophical worry**
      If he questions whether values cause anything, he dismantles his own authority to speak; it would turn the dinner into a seminar and reveal he understands the mechanics of his town less than the professor does.

  ***

  ### Part III: The Decisive Evidence

  **The Evidence:** **A run of Probate Inventories (1750–1850).**

  **Why:** This evidence specifically targets the tension between **Sorting (f)** and **Preferences/Institutions (a/g)**. If the Protestant families show significantly higher capital accumulation *before* the industrial boom or before the strictures of church discipline tightened, it suggests they were already an economic elite who adopted the creed (supporting Sorting). If their inventories show a distinct trajectory of reinvestment and frugality that diverges from Catholic neighbours *after* adopting the faith, it supports the causal power of the Ethic or Institutions. Unlike school registers (which only prove literacy) or guild ledgers (which only prove membership), probate inventories track the actual *stock of wealth* across generations, allowing you to see if the culture created the capital or if the capital selected the culture.
