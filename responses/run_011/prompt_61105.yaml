answer: |-
  **Essay Question 3**

  **Time Allowed:** 2 Hours
  **Total Marks:** 100 (This Question: 30 Marks)

  **Question 3**

  Consider the following stipulated evidence regarding two groups of subjects presented with a spider in plain view.

  **Group A (neurologically intact subjects).** After acquiring a firm, reflectively endorsed belief that a spider in plain view poses no threat whatsoever, subjects continue to feel fear of it. The spider still looks threatening to them; they report that their fear presents it as dangerous even while they deny that it is; their autonomic arousal and avoidance persist. Their responses to standard visual illusions are entirely ordinary: the two shafts of the Müller-Lyer figure still look unequal after they have learned that the lines are equal.

  **Group B (subjects with a rare focal lesion, otherwise neurologically and emotionally normal).** Their fear responds normally to genuine danger: when the spider really is dangerous they feel fear, with normal arousal, expression, and avoidance, and their susceptibility to the Müller-Lyer illusion is fully intact and unaffected by knowledge. But once they acquire the same firm belief that the visible spider is harmless, their fear is extinguished immediately and completely. There is no residual sense of the spider as dangerous, no arousal, no avoidance. The extinguishing follows the change of belief itself and is not the product of training, habituation, or distraction.

  Consider three theoretical accounts of emotion:
  1.  **The Judgmental View:** Emotions are, or necessarily entail, evaluative judgments or beliefs about the world.
  2.  **The Somatic Perception View:** Emotions are perceptual states whose evaluative content derives from the perception of the subject's own bodily changes.
  3.  **The Construal View:** Emotions are non-doxastic construals, a kind of 'seeing-as' that falls short of belief but presents the world in evaluative terms.

  (a) Say what each of the three views predicts about Group A and about Group B, and identify which of the two data sets, if either, constitutes a problem for each view. (10 marks)

  (b) The defender of the Construal View typically responds to recalcitrance by assimilating it to persisting visual illusion. Explain whether Group B undercuts that response, and say whether there is any further asymmetry between recalcitrant emotions and persisting illusions that bears on the analogy — and, if so, whether Group B sharpens or blunts it. (10 marks)

  (c) Conclude by stating which of the three views the evidence best supports, and what that view has to give up in order to accommodate the other group. (10 marks)

  ***

  **Model Answer**

  (a) The Judgmental View predicts that if a subject believes the spider is harmless, they cannot fear it. Consequently, Group B fits this view perfectly: belief updates, emotion vanishes. However, Group A constitutes a fatal counterexample. In Group A, the judgment ("harmless") and the emotion ("fearful") diverge. If emotion were identical to judgment, this contradiction would be impossible, akin to believing *p* and not-*p* simultaneously.

  The Somatic Perception View predicts that emotion persists as long as bodily arousal persists. This aligns well with Group A: the subjects remain aroused, so they remain fearful, regardless of their belief. Group B is theoretically compatible but causally mysterious for this view. If emotion is merely perceiving the body, the view does not explain why a cognitive shift (belief) instantly halts the bodily state without intermediate habituation. It fits the data but lacks a mechanism for the belief-body link.

  The Construal View predicts that one can construe the spider as dangerous while believing it is safe, much like seeing the Müller-Lyer lines as unequal while knowing they are equal. This accommodates Group A naturally as a case of recalcitrance. Group B, however, poses a significant challenge. If emotions are perceptual construals, they should be cognitively impenetrable like vision. Yet in Group B, belief penetrates and extinguishes the emotion instantly.

  (b) The standard defense of the Construal View relies on the analogy between recalcitrant emotion and visual illusion: both are encapsulated modules that resist belief. Group B undercuts this response decisively. In Group B, the emotional system is demonstrably penetrable by belief, whereas the visual system (Müller-Lyer) remains impenetrable. This breaks the parallel. The standard defense claims emotions *must* persist despite belief because they are perceptual; Group B shows they *need not* persist.

  There is a deeper asymmetry here regarding modularity. Visual illusions persist because the visual system is informationally encapsulated; it cannot access the belief that the lines are equal. In Group A, the emotional system behaves similarly (encapsulated). In Group B, the emotional system behaves differently (penetrable). Group B sharpens this asymmetry. It demonstrates that emotional construals are not inherently encapsulated in the way visual perceptions are. While Group A shows emotions *can* be recalcitrant, Group B proves this recalcitrance is not a necessary feature of emotional construals, whereas visual recalcitrance appears necessary for intact subjects. The analogy holds only contingently for emotion, but necessarily for vision.

  (c) The evidence best supports a modified Construal View. The Judgmental View is eliminated by Group A; it cannot explain how fear survives contradictory belief. The Somatic Perception View is inferior because it reduces the evaluative content of fear to bodily sensation, failing to explain why the spider *looks* dangerous (intentionality) rather than just feeling agitating. Furthermore, it struggles to explain the immediacy of the belief-body causal link in Group B.

  The Construal View best captures the phenomenology of Group A: the spider is *presented* as dangerous, distinct from the *judgment* of safety. However, to accommodate Group B, this view must surrender the claim that emotional construals are strictly cognitively impenetrable. It must admit that while emotional construals function like perceptions (offering a perspective on the world), their causal architecture is permeable by cognitive states in a way vision is not. The view must distinguish between the *nature* of the state (a construal) and its *causal dependencies* (which can be lesioned to allow penetration). Thus, we retain the perceptual-like phenomenology of emotion but reject the strong modularity thesis often attached to it. The emotion is a seeing-as, but one that can be turned off by knowing better, provided the neural pathways linking belief to construal are intact.

  ***

  **Marking Scheme**

  **Total Marks:** 30
  **Note on References:** Students are **not** expected to produce references or name specific philosophers. Positions must be identified by description (e.g., "The Judgmental View"). No marks are awarded or deducted for the presence or absence of names.

  **Part (a): Predictions and Problems (10 Marks)**
  *   **Judgmental View (3 marks):** 1 mark for noting it fits Group B; 2 marks for identifying Group A as a contradiction/refutation (belief/emotion divergence).
  *   **Somatic View (3 marks):** 1 mark for noting it fits Group A (arousal persists); 2 marks for identifying the causal mystery in Group B (why belief stops body instantly).
  *   **Construal View (4 marks):** 2 marks for noting it fits Group A (recalcitrance/seeing-as); 2 marks for identifying Group B as a problem for cognitive impenetrability/modularity.

  **Part (b): The Illusion Analogy (10 Marks)**
  *   **Undercutting the Analogy (4 marks):** Credit for explaining that Group B shows emotions *can* be penetrable, unlike visual illusions which remain impenetrable in both groups.
  *   **Identifying Asymmetry (3 marks):** Credit for distinguishing between contingent recalcitrance (emotion) and necessary/structural recalcitrance (vision).
  *   **Sharpens/Blunts (3 marks):** Credit for arguing Group B *sharpens* the asymmetry (showing the disanalogy is fundamental, not just a variation).

  **Part (c): Verdict and Accommodation (10 Marks)**
  *   **Determinant Verdict (4 marks):** Must choose one view (preferably Construal). Merely surveying options earns 0 here.
  *   **Rejection of Alternatives (3 marks):** Brief justification for why Judgmentalism fails (Group A) and why Somatic is less optimal (intentionality/causal link).
  *   **Theoretical Cost (3 marks):** Identifying what the chosen view must sacrifice (e.g., strong modularity/impenetrability) to fit Group B.

  **First-Class vs. Competent**
  A **First-Class** answer (25-30 marks) will:
  1.  **Integrate Group B into the Verdict:** It does not just treat Group B as a problem in (a) but uses it to refine the theory in (c) (e.g., distinguishing state nature from causal architecture).
  2.  **Nuanced Asymmetry:** In (b), it moves beyond "B breaks the analogy" to explain *why* (contingent vs. necessary encapsulation).
  3.  **Intentionality Focus:** In (c), it justifies preferring Construal over Somatic Perception by referencing the *evaluative presentation* (the spider looks dangerous) rather than just arousal.

  A **Competent** answer (15-24 marks) will:
  1.  Correctly map predictions in (a) but may treat Group B as merely "compatible" with Somatic views without noting the causal mystery.
  2.  State that Group B breaks the illusion analogy but fail to articulate the asymmetry regarding modularity.
  3.  Reach a verdict in (c) but offer a generic reason for the theoretical cost (e.g., "it must change") without specifying *what* (e.g., impenetrability).

  **Characteristic Errors and Deductions**
  Examiners should deduct marks (2-5 marks per error) for the following:
  1.  **Pathologizing Group A (5 marks):** Treating Group A as "irrational" or "pathological" in a way that dismisses the data. The stem defines them as neurologically intact; their recalcitrance is the phenomenon to be explained, not explained away.
  2.  **Citing Names instead of Arguments (3 marks):** Using philosopher names (e.g., "Nussbaum says...") in place of reconstructing the argument described in the stem.
  3.  **Conflating Impenetrability with Recalcitrance (4 marks):** Assuming that because an emotion is recalcitrant (Group A), it *must* be cognitively impenetrable, ignoring Group B's demonstration of penetrability.
  4.  **Reading Lesion Data Naively (5 marks):** Treating Group B as evidence about the *nature* of emotion directly, without commenting on the difference between causal dependencies (lesioned) and essential properties.
  5.  **Doxastic/Non-Doxastic Confusion (4 marks):** Assuming that because a state is non-doxastic (Construal), it cannot be rationally criticizable, or conversely, that rational criticizability entails doxastic content.

  **General Note:** Answers that refuse to reach a verdict in part (c) cannot score higher than 20 marks, regardless of the quality of parts (a) and (b).
