answer: |-
  ### Exam Question

  **Plutarch's proem to *Alexander* suggests biography offers a 'mirror' for self-improvement, yet a significant portion of the *Parallel Lives* details figures like Alcibiades, Coriolanus, or Antony, whose moral failures are as prominent as their virtues. Discuss how Plutarch expects the reader to engage with these flawed lives, specifically addressing the function of the concluding *Synkrisis*. In your answer, contrast Plutarch's pedagogical method with the logic of hagiography: what is the ethical difference between studying a 'flawed mirror' and venerating a 'sacred relic'?**

  ***

  ### Model Answer

  To treat Plutarch's *Lives* merely as a gallery of moral exemplars is to misunderstand the ethical work they demand. While the *Alexander* proem famously claims to write "Lives not Histories" and seeks the "signs of the soul," this is not an invitation to uncritical imitation. If the *Lives* were simply mirrors of virtue, figures like Alcibiades or Antony would be excluded. Their inclusion suggests that Plutarch's moral education relies less on *mimesis* (copying) and more on *krisis* (judgment). The reader is not asked to become Alcibiades, but to understand the specific psychology that allows brilliance to curdle into instability.

  With flawed subjects, the pedagogical mechanism shifts from emulation to diagnosis. In the life of Antony, for instance, Plutarch does not simply condemn vice; he traces the erosion of a great nature by passion and political circumstance. The reader learns to identify the tipping points where capacity becomes corruption. This requires active cognitive engagement. Unlike a manual of precepts, a complex life presents virtue and vice as entangled. The student of the *Lives* must disentangle them, learning to recognize that the same spiritedness (*thumos*) that makes a Coriolanus great in battle makes him impossible in the forum. The "mirror" is not a reflection of how one *should* look, but a diagnostic tool for seeing how character interacts with fortune.

  This is where the *Synkrisis* becomes essential. If the *Lives* were merely about ranking moral worth, the *Synkrisis* would be a scoreboard declaring a winner. However, in pairs involving flawed men, the comparison often refuses a clean verdict. Instead, the *Synkrisis* functions as a dialectical tool that forces the reader to weigh incommensurable variables. It asks: Is a flaw of temperament worse than a flaw of principle? Does the cultural context of Rome excuse what is blameworthy in Greece? By juxtaposing two imperfect men, Plutarch prevents the reader from settling on a simple binary of good/bad. The *Synkrisis* trains the reader's *phronesis* (practical wisdom) by compelling them to adjudicate complex moral trade-offs. It transforms the reading experience from passive reception of a model to active participation in judgment.

  This approach stands in sharp contrast to the logic of hagiography. In hagiographical traditions, the saint is presented as a "sacred relic." The saint's life is often stylized to remove ambiguity; their suffering is redemptive, and their virtues are gifts of grace rather than achievements of will. The appropriate ethical response to a saint is veneration, which creates distance. One does not critique a saint, nor does one expect to replicate their life in its entirety; one worships the ideal they represent. The relic is untouchable and complete.

  Plutarch's subjects, conversely, remain touchably human. By preserving their flaws, Plutarch denies them the status of relics. This loss of sanctity is the gain in ethical utility. Because the Plutarchan subject is not venerated, they can be analyzed. The "flawed mirror" implies that the reader shares the same raw material—passions, ambitions, vulnerabilities—as the subject. If the subject were perfect, the gap between reader and subject would be too wide for moral instruction to bridge. We cannot imitate a miracle, but we can manage our anger better than Coriolanus did.

  Ultimately, Plutarch's method assumes that moral education is not about accumulating models to copy, but about sharpening the faculty of judgment. Hagiography offers a destination (the saint); Plutarch offers a gymnasium. By engaging with flawed lives and navigating the nuances of the *Synkrisis*, the reader practices the difficult work of evaluating character in the real world, where virtue is rarely pure and success is rarely clean. The goal is not to produce a replica of Cato, but to produce a reader capable of judging when Cato is right, and when he is merely stubborn.

  ***

  ### Marking Scheme (20 Marks Total)

  **1. Thesis & Argument Quality (5 Marks)**
  *   **5:** Argument clearly moves beyond "imitation of virtue" to focus on *judgment/diagnosis*. Thesis explicitly links flawed lives to the development of *phronesis*.
  *   **3-4:** Acknowledges flawed lives but relies heavily on "negative exemplum" (i.e., "we learn what *not* to do") without exploring the diagnostic/psychological aspect.
  *   **0-2:** Restates the prompt or defaults to the "Lives not Histories" cliché without analyzing its implications for *bad* lives.

  **2. Engagement with "Awkward Cases" (Alcibiades/Antony/etc.) (5 Marks)**
  *   **5:** Explains *why* a flawed life is useful (entanglement of vice/virtue, psychology of decline). Treats the subject as a complex case study.
  *   **3-4:** Mentions specific flawed figures but treats them simply as warnings or contrasts to "good" lives.
  *   **0-2:** Ignores the specific constraint to discuss flawed men; assumes all Lives are intended as positive models.

  **3. Function of the *Synkrisis* (5 Marks)**
  *   **5:** Identifies the *Synkrisis* as a dialectical tool for weighing nuance/context, not a verdict. Explains how it forces reader activity.
  *   **3-4:** Describes the *Synkrisis* accurately but treats it as a final ranking or summary of who was "better."
  *   **0-2:** Ignores the *Synkrisis* or treats it as a later addition with no pedagogical function.

  **4. Contrast with Hagiography (5 Marks)**
  *   **5:** Clear distinction drawn between *veneration/distance* (hagiography) and *analysis/proximity* (Plutarch). Explains the ethical gain of "humanizing" the subject.
  *   **3-4:** Notes the difference (saints are holy, Plutarch's men are not) but fails to explain the *pedagogical consequence* of that difference.
  *   **0-2:** Superficial mention of religion/saints without connecting it to the method of reading biography.

  **Specific Penalties & "Red Flags"**
  *   **The "Proem Recitation" Penalty (-2 marks):** If the essay opens by simply quoting/paraphrasing the *Alexander* proem ("I am writing Lives not Histories...") without immediately critiquing or complicating it in light of the question.
  *   **The "Scoreboard" Error (-3 marks):** If the student argues the purpose of the *Synkrisis* is to declare a definitive winner between the Greek and Roman.
  *   **The "Hagiography Ignore" (-5 marks):** If the second half of the question (the hagiography contrast) is completely omitted.
  *   **The "Negative Exemplum" Simplification (-2 marks):** If the student argues we learn from Antony *only* by avoiding his mistakes, rather than by understanding the complexity of his character.

  **Grade Boundaries**
  *   **A (17-20):** Nuanced argument on judgment vs. imitation; sophisticated handling of *Synkrisis*; clear hagiography contrast.
  *   **B (14-16):** Solid understanding of flawed lives; *Synkrisis* treated as comparison but maybe less dialectical; hagiography contrast present but less developed.
  *   **C (10-13):** Defaults to "mirror of virtue" trope; treats *Synkrisis* as ranking; hagiography contrast is vague.
  *   **D/F (0-9):** Fails to address flawed lives; significant factual errors; or ignores half the prompt.
