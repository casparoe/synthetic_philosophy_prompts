prompt: |-
  I run a 20-person nonprofit that places people coming home from prison into jobs. When an employer calls about a candidate, one of my four placement officers has to decide within about a day whether to vouch — whether to actually believe, and then say out loud, that this person will hold the job. We do maybe fifteen of these a month and the stakes cut both ways: a bad placement costs the employer real money and tends to poison that employer, sometimes the whole sector in our town, for everyone who comes after; but declining to vouch because the evidence isn't there pretty much guarantees the person doesn't get hired, since nobody hires out of our program on a shrug. My staff have split into two camps — one wants a hard evidentiary threshold before we say anything, the other says there's never evidence about an individual person and that waiting is just a polite way of saying no.

  Write me a decision procedure my officers can actually run in half an hour with a candidate file and a phone call, built out of what James and Clifford genuinely disagree about rather than generic "weigh the risks" advice. Specifically: the questions to ask in order, what counts as a sufficient answer to each, where the procedure stops at no, where it hands the call back to a human because it's a values question and not a factual one, and which of our decisons actually have the structure James thinks licenses belief ahead of the evidence — can't be settled by waiting, and the waiting itself guarantees the worse outcome — versus which are just impatience wearing that language. I also want a distinction they can apply between believing something and merely acting as if it's true, and what changes when we can hedge: trial period, our own money at risk, weekly check-ins. Hedging seems to buy evidence faster than waiting does, and I want the procedure to exploit that instead of treating it as a dodge. Include a logging step and a 90-day review of what we predicted versus what happened, because I want to know whether our judgments track anything at all. Anything flagged goes to me for signoff, and our funder audits retention numbers, so whatever they do has to leave a record.

  Then run it on two cases. One: a 24-year-old with no real work history, two short-lived placements, a strong interview and a single good reference from a volunteer site, up for a warehouse job with an employer who's hired from us twice and had one placement fail. Two: a candidate with eleven clean months and solid references, plus an unverified tip from a former supervisor that something is off, up for a job at our single biggest account. I expect the procedure to come out against me on the second one; say so plainly instead of softening it.

  Finally, be honest about where the thing will misfire, which steps are judgment calls dressed up as procedure, and what this whole setup just can't do.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**

      *   **Context:** 20-person nonprofit, prison reentry job placement. 4 placement officers. ~15 placements/month.
      *   **The Dilemma:** To vouch or not to vouch. High stakes (employer trust vs. candidate opportunity).
      *   **The Conflict:** Staff split between "hard evidence threshold" (Cliffordian) and "waiting is just no" (Jamesian).
      *   **The Task:** Create a 30-minute decision procedure based on the genuine philosophical disagreement between William James ("The Will to Believe") and W.K. Clifford ("The Ethics of Belief").
      *   **Specific Requirements:**
          *   Ordered questions with sufficient answers.
          *   Stop points (No).
          *   Handoff points (Values vs. Facts).
          *   Distinction between Jamesian "forced, living, momentous" options vs. mere impatience.
          *   Distinction between *believing* vs. *acting as if*.
          *   Integration of hedging (trial periods, etc.) as evidence-gathering, not dodging.
          *   Logging step + 90-day review.
          *   Flagging for Executive Director (user) signoff.
          *   Audit trail for funders.
          *   **Case Studies:** Run the procedure on two specific cases (Case 1: Young, spotty history, good interview; Case 2: Solid history, unverified tip, high-stakes employer).
          *   **Honesty:** Admit where the procedure misfires, where judgment calls are disguised, and limitations.

  2.  **Deconstruct the Philosophy (James vs. Clifford):**

      *   **Clifford:** "It is wrong always, everywhere, and for anyone, to believe anything upon insufficient evidence." Belief is a public trust. Credulity harms society. Duty to investigate.
      *   **James:** Belief is sometimes a *precondition* for truth. In "genuine options" (Living, Forced, Momentous), waiting for evidence kills the possibility of the truth arising. Faith creates the fact.
      *   **Application:**
          *   *Cliffordian Zone:* Where evidence *can* be gathered without killing the opportunity. (e.g., verifying references, checking records).
          *   *Jamesian Zone:* Where the decision *itself* creates the outcome. Vouching *makes* the candidate more likely to succeed (self-fulfilling prophecy/support). Waiting *guarantees* failure.
          *   *Hedging:* This is the bridge. It allows acting *as if* (James) while gathering evidence (Clifford).

  3.  **Drafting the Procedure (The "Vouch Protocol"):**

      *   *Goal:* 30 minutes max.
      *   *Structure:* Funnel approach. Start with hard facts (Clifford), move to risk assessment (James), end with hedging (Pragmatism).
      *   *Step 1: The Clifford Floor (Hard Evidence).* Can we verify the basics? If not, stop.
      *   *Step 2: The James Test (Genuine Option).* Is this forced, living, momentous? If waiting kills the chance, we move to Step 3. If waiting is safe, we wait (Clifford wins).
      *   *Step 3: The Hedge (Acting As If).* Can we structure the belief to minimize downside?
      *   *Step 4: The Values Handoff.* If the risk is moral/reputational rather than factual, escalate.
      *   *Step 5: Logging & Review.* Accountability.

  4.  **Refining the Steps (incorporating specific constraints):**

      *   *Distinction:* Belief (internal conviction) vs. Endorsement (external action). The procedure authorizes *Endorsement with Safeguards*, not necessarily absolute *Belief*.
      *   *Jamesian License:* Only applies when the "truth" (successful employment) depends on the act of vouching (support, confidence).
      *   *Cliffordian Brake:* Applies when the risk to the *community* (other candidates) outweighs the individual chance.

  5.  **Running the Cases:**

      *   **Case 1 (24yo, spotty, warehouse):**
          *   Evidence: Low (Clifford says no).
          *   James Test: High. Waiting = No job. Vouching = Chance.
          *   Hedge: Trial period? Yes.
          *   Outcome: Conditional Vouch (Jamesian).
      *   **Case 2 (Solid, tip, Big Account):**
          *   Evidence: Mixed. Solid record vs. Unverified tip.
          *   James Test: Is it forced? Maybe. But the risk to the "Big Account" is community-wide harm (Clifford's main point: harm to others).
          *   Outcome: No Vouch / Escalate. (The prompt expects the procedure to say no here).
          *   *Reasoning:* Clifford's ethic is about the *duty to society*. Poisoning the well for everyone else violates the Cliffordian imperative, even if James would say "have faith." The risk to the *sector* outweighs the individual.

  6.  **Addressing the "Honesty" Section:**

      *   Where does it fail? Bias in "values" questions. The "Jamesian" label can be abused to justify recklessness.
      *   What can't it do? Predict human behavior perfectly.
      *   Judgment calls: Assessing the "tip" in Case 2.

  7.  **Drafting the Content (Iterative refinement):**

      *   *Tone:* Professional, direct, operational, philosophically grounded but not academic.
      *   *Formatting:* Clear headers, checklists, decision trees.
      *   *Constraint Check:* Did I include the 90-day review? Yes. The logging? Yes. The signoff? Yes.

      *(Self-Correction during drafting)*: I need to make sure I don't just say "Clifford says X, James says Y." I need to build it *out of* their disagreement. The procedure must force the officer to choose which ethic applies to *this specific decision*.
      *   *Key Insight:* The procedure isn't about resolving the debate, but *routing* the decision to the correct ethic based on the stakes.
      *   *Clifford Route:* When the risk is externalized (employer trust, sector reputation).
      *   *James Route:* When the risk is internalized (candidate's future) and the act creates the success.

      *(Refining Case 2)*: The prompt says "I expect the procedure to come out against me on the second one; say so plainly." I need to ensure the logic holds up. Why? Because the "Big Account" represents the "public trust" Clifford is worried about. One failure there hurts *everyone*. The unverified tip introduces doubt that Clifford says must be investigated. Since investigating kills the offer (likely), and the risk is to the *commons*, Clifford wins.

      *(Refining Hedging)*: Hedging isn't a dodge; it's a way to turn a "Belief" into an "Experiment." This satisfies Clifford (gathering evidence) while satisfying James (taking the chance).

  8.  **Final Polish:** Check word count, clarity, and ensure all constraints of the prompt are met. Ensure the distinction between "Belief" and "Wager" is clear.

      *   *Wait, one nuance:* The prompt asks for "which of our decisions actually have the structure James thinks licenses belief ahead of the evidence." I need to explicitly label this in the procedure.
      *   *Also:* "Distinction they can apply between believing something and merely acting as if it's true." This is crucial. The procedure should authorize *wagering* on the candidate, not necessarily *knowing* they will succeed.

  9.  **Final Review against constraints:**
      *   30 min procedure? Yes.
      *   James/Clifford specific? Yes.
      *   Questions in order? Yes.
      *   Stop points? Yes.
      *   Values handoff? Yes.
      *   Jamesian license identified? Yes.
      *   Belief vs. Acting As If? Yes.
      *   Hedging as evidence? Yes.
      *   Logging/90-day? Yes.
      *   Signoff/Audit? Yes.
      *   Two cases run? Yes.
      *   Honesty section? Yes.

      *Let's write it.*
answer: |-
  # The Vouch Protocol: A Decision Procedure for Placement Officers

  **Purpose:** To resolve the tension between evidentiary duty (Clifford) and the necessity of faith in forced opportunities (James) within a 30-minute window.
  **Constraint:** This is not a tool for certainty. It is a tool for *accountable wagering*.
  **Audit Requirement:** All decisions must be logged in the CRM under "Vouch Rationale." 90-day retention data will be reviewed by the Executive Director (ED).

  ---

  ## Part 1: The Procedure (30 Minutes Max)

  ### Phase 1: The Clifford Floor (Hard Evidence Check)
  *Time Limit: 10 Minutes*
  *Philosophical Basis:* W.K. Clifford argues we have a duty to society to prevent harm caused by credulity. If we vouch blindly, we harm the employer and future candidates.

  **Q1: Is there objective, verifiable disqualification?**
  *   *Check:* Active warrants, violent offenses incompatible with the role (e.g., theft in cash handling), verified parole restrictions.
  *   *Sufficient Answer:* No disqualifiers found.
  *   *Stop Condition:* If **Yes**, decision is **NO VOUCH**. Log reason. End.

  **Q2: Have we exhausted available verification channels?**
  *   *Check:* Called provided references? Verified volunteer hours? Checked prior placement notes?
  *   *Sufficient Answer:* We have spoken to at least one human who has supervised the candidate in *any* capacity (work, volunteer, program) within the last 12 months.
  *   *Stop Condition:* If **No**, you cannot proceed to Phase 2. You must pause to verify OR escalate to ED as a "Values Handoff" (see Phase 4).
  *   *Note:* If verification is impossible due to time sensitivity, mark this as a **Clifford Deficit**. You are now operating on Jamesian grounds and must apply stricter hedging.

  ### Phase 2: The James Test (Genuine Option Assessment)
  *Time Limit: 5 Minutes*
  *Philosophical Basis:* William James argues belief is licensed ahead of evidence only when the option is **Living** (plausible to the candidate), **Forced** (no opportunity to wait), and **Momentous** (unique, high stakes).

  **Q3: Is this opportunity "Forced"?**
  *   *Question:* If we delay 48 hours to gather more evidence, does the job offer vanish?
  *   *Sufficient Answer:* Employer confirms role is immediate.
  *   *Jamesian License:* If **Yes**, waiting is functionally a rejection. We are permitted to vouch without full evidence *if* Phase 3 safeguards are met.
  *   *Cliffordian Brake:* If **No** (employer can wait), you **MUST** wait for evidence. Do not use James to justify impatience.

  **Q4: Does our vouching *create* the success?**
  *   *Question:* Is the candidate's success dependent on the confidence and support signaled by our vouch?
  *   *Sufficient Answer:* Candidate shows high motivation but low confidence; employer relies on our partnership for support.
  *   *Jamesian License:* If **Yes**, this is a self-fulfilling prophecy scenario. Belief is a causal factor.
  *   *Stop Condition:* If **No** (candidate is fully autonomous, employer doesn't care about our vouch), revert to strict Cliffordian evidence. If evidence is thin, **NO VOUCH**.

  ### Phase 3: The Hedge (Acting "As If" vs. Believing)
  *Time Limit: 10 Minutes*
  *Philosophical Basis:* We distinguish between *Belief* (internal conviction of truth) and *Wager* (acting as if true to test it). Hedging converts a leap of faith into an experiment.

  **Q5: What is the cost of being wrong?**
  *   *Scale:*
      *   **Low:** Small employer, replaceable role, we absorb replacement cost.
      *   **High:** Sector-leading employer, safety-sensitive role, failure poisons the well for all future candidates.
  *   *Decision:*
      *   If **High Cost**: You need Cliffordian evidence. If missing, **NO VOUCH**.
      *   If **Low/Medium Cost**: Proceed to Q6.

  **Q6: Can we structure the "Belief" as a Trial?**
  *   *Options:* 30-day trial period, weekly check-ins for first month, nonprofit subsidizes first week's wages, rapid-response replacement guarantee.
  *   *Sufficient Answer:* Employer agrees to at least one structural hedge.
  *   *Jamesian License:* This allows us to *act as if* the candidate will succeed while gathering Cliffordian evidence in real-time.
  *   *Stop Condition:* If employer demands a permanent, unguarded hire and risk is **High**, **NO VOUCH**.

  ### Phase 4: The Values Handoff & Logging
  *Time Limit: 5 Minutes*

  **Q7: Is this a factual gap or a values gap?**
  *   *Factual:* "We don't know if he showed up on time." (Solve with references/trial).
  *   *Values:* "We know he showed up, but the offense makes us uncomfortable placing him in this specific neighborhood."
  *   *Action:* If **Values**, this is not an officer decision. **ESCALATE TO ED.** Do not burden the candidate with institutional moral risk.

  **Q8: Final Log Entry (Required for Audit)**
  *   Select Rationale Code:
      *   `C-1`: Cliffordian (Evidence Met)
      *   `J-1`: Jamesian (Forced Option + Hedge)
      *   `J-2`: Jamesian (Forced Option + No Hedge [High Risk]) -> **Requires ED Signoff**
      *   `V-1`: Values Handoff -> **Requires ED Signoff**
  *   *Prediction:* Enter estimated retention probability (0-100%).
  *   *Flag:* If `J-2` or `V-1`, notify ED immediately.

  ---

  ## Part 2: Case Runs

  ### Case 1: The Warehouse Candidate
  *   **Profile:** 24yo, no work history, 2 short placements, strong interview, 1 volunteer reference.
  *   **Employer:** Warehouse, hired from us twice (1 fail).
  *   **Run:**
      1.  **Clifford Floor:** No disqualifiers (Q1 Pass). One volunteer reference contacted (Q2 Pass - *barely*).
      2.  **James Test:** Warehouse hiring is usually immediate (Q3 Forced = Yes). Candidate needs confidence/support to break the cycle of short tenures (Q4 Causal = Yes).
      3.  **Hedge:** Risk is Medium (Employer knows us, 1 prior fail). Can we hedge? Yes, propose 30-day check-ins and replacement guarantee (Q6 Pass).
      4.  **Decision:** **VOUCH (Conditional).**
      5.  **Rationale Code:** `J-1` (Jamesian: Forced Option + Hedge).
      6.  **Logic:** Waiting guarantees failure (James). Evidence is thin but not dangerous (Clifford). Hedging allows us to treat the first month as evidence gathering. The prior fail with this employer is a risk, but the hedge mitigates the "poisoning" effect.

  ### Case 2: The Big Account Candidate
  *   **Profile:** 11 clean months, solid references, unverified tip from former supervisor ("something is off").
  *   **Employer:** Single biggest account in the region.
  *   **Run:**
      1.  **Clifford Floor:** No disqualifiers (Q1 Pass). References solid, *but* unverified tip exists (Q2 Deficit).
      2.  **James Test:** Is it forced? Likely yes (Q3 Forced = Yes). Does our vouch create success? Yes (Q4 Causal = Yes).
      3.  **Hedge:** What is the cost of being wrong? **High** (Q5 High Cost). This is the "Big Account." A failure here validates sector-wide bias against hiring justice-involved individuals.
      4.  **Decision:** **NO VOUCH / ESCALATE.**
      5.  **Rationale Code:** `C-1` (Cliffordian Duty to Commons) overriding `J-1`.
      6.  **Logic:** This is where the procedure comes out against you. James would say "Have faith, the tip is unverified." **But Clifford wins here.** Clifford's ethic is not just about the individual; it is about the *duty to the community of inquirers* (in this case, the employer sector).
      7.  **Why:** The "unverified tip" represents a Cliffordian debt. We *ought* to verify it. If we cannot verify it without killing the offer, we cannot pay the debt. To vouch anyway is to gamble with *other people's money and future candidates' opportunities*, not just this candidate's. The risk is externalized to the entire program.
      8.  **Action:** Escalate to ED (`V-1` or `C-High`). The ED must decide if the program's survival (funder retention) outweighs this individual's chance. The officer cannot make this call under the Jamesian license because the stakes exceed the individual transaction.

  ---

  ## Part 3: Honesty & Limitations

  ### Where This Will Misfire
  1.  **The "Forced" Illusion:** Employers often claim urgency to pressure us. Officers may mark Q3 as "Forced" to avoid difficult conversations, incorrectly invoking James to cover for impatience.
      *   *Mitigation:* ED spot-checks `J-1` codes. If the employer actually waited 3 days in past hires, the officer is penalized on accuracy metrics.
  2.  **The "Hedge" Dodge:** Employers may agree to a trial period verbally but treat a failure as a permanent ban.
      *   *Mitigation:* The "Replacement Guarantee" must be in writing. If it isn't, Q6 is a Fail.
  3.  **Bias in "Values" Handoffs:** Officers may flag "Values" (`V-1`) when they actually mean "I don't like this person."
      *   *Mitigation:* 90-day review compares `V-1` escalation rates per officer. Outliers get coaching.

  ### Judgment Calls Dressed as Procedure
  *   **Q5 (Cost of Being Wrong):** This is subjective. One officer's "Medium Risk" is another's "High Risk." This is where your funder's audit pressure will distort judgment. Officers will inflate risk to protect their jobs.
      *   *Reality:* You need a standardized risk matrix (e.g., Account Tier 1 = High Cost) to remove this subjectivity.
  *   **Q2 (Exhausted Verification):** What counts as "exhausted"? Calling once? Three times? The procedure assumes good faith here. It cannot detect laziness.

  ### What This Setup Cannot Do
  1.  **Predict Violence or Theft:** No procedure based on references and interviews can reliably predict specific misconduct. This protocol manages *institutional risk*, not *public safety*.
  2.  **Resolve the James/Clifford Conflict:** It doesn't solve the philosophical tension; it bureaucratizes it. It forces officers to admit *which god they are praying to* (Evidence or Faith) on the record.
  3.  **Save the "Big Account" if the Tip is True:** In Case 2, if we decline, we lose the candidate. If we vouch and the tip is true, we lose the account. The procedure protects the *officer* and the *process*, but it cannot guarantee the *outcome*.

  ### The 90-Day Review Loop
  *   **Metric:** Compare `Predicted Retention` (Q8) vs. `Actual Retention`.
  *   **Jamesian Audit:** Look at `J-1` cases. Did the "faith" pay off? If `J-1` retention is < 50%, you are not running a Jamesian program; you are running a reckless one.
  *   **Cliffordian Audit:** Look at `C-1` rejections. Track where those candidates went. If they are getting hired elsewhere and succeeding, your "Hard Evidence" threshold is too high (gatekeeping).
  *   **Signoff:** Any `J-2` or `V-1` case requires your signature. This keeps the moral burden where it belongs: with leadership, not the line staff.

  ### Final Note on Case 2
  You asked me to be plain. The procedure rejects Case 2 not because the candidate is guilty, but because **Clifford's ethic of public trust outweighs James's ethic of individual possibility when the collateral damage is existential.** Placing this candidate is a bet with the program's entire future as the chip. That is not a placement officer's bet to make. It is yours. The procedure forces that escalation.
