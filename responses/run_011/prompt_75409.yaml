answer: |-
  The heterogeneity problem is the most significant metaphysical threat to hedonism, but it is not fatal. It wounds classical phenomenal hedonism badly enough to require abandonment of the "Water-model" (essentialism about feel), yet it leaves recoverable a sophisticated hedonism grounded in the "Role-model." The verdict is that the problem is **serious_but_survivable**, provided the hedonist accepts a functionalist unifier that satisfies both metaphysical and normative demands without collapsing into desire-satisfaction theory.

  To see why, we must first dismiss the alternatives. The **Water-model** fails because attitudinal pleasures (e.g., gladness that a friend succeeded) lack a distinctive phenomenal tone shared with sensory pleasures (e.g., drinking water). Fred Feldman's attitudinal hedonism attempts to save Water by positing a propositional attitude, but this merely relocates the heterogeneity: the *feeling* of holding that attitude varies as wildly as sensory feels. The **Jade-model** (disjunctivism) admits defeat; if pleasure is just "sensory pleasure OR attitudinal pleasure OR...", hedonism loses its theoretical unity and becomes a list of unrelated goods. The **Game-model** (family resemblance) is too weak to support the claim that pleasure is the *sole* intrinsic good; if the resemblance chain is loose, there is no guarantee that every link in the chain is valuable, nor why *only* these states are valuable.

  This leaves the **Role-model**. Your suspicion is astute: if the role is "being wanted," hedonism collapses into desire-satisfaction theory; if the role is "making experience better," it is circular. However, a third option exists. The unifying role is **positive affective valence within a functional architecture of motivation**. Pleasure is not defined by being desired (the desire theory error), but by having a specific phenomenological-functional character that *warrants* desire. It is the state that plays the "reward" role in cognitive processing. This avoids circularity because "making experience better" is the *consequence* of this role, not the definition. The property is metaphysically distinct (a functional state) and normatively potent (it provides reasons for action).

  This distinction clarifies the metaphysical versus normative demand. A hedonist who satisfies only the normative demand ("we treat these alike because they are good") fails, because it renders hedonism tautological: "Pleasure is good because it is the good-making property." To avoid this, there must be a metaphysical property that *grounds* the value. The Role-model satisfies **both**: it identifies a real property (functional valence) that explains why we normatively treat these states alike.

  Empirical results regarding neural substrates (e.g., opioid systems) support the Role-model but not the Water-model. Finding a common neural correlate shows that diverse experiences realize a common functional state, confirming multiple realizability. It does not prove that the *feel* is identical, only that the underlying mechanism serving the "reward" role is conserved. This undermines phenomenal essentialism but bolsters functionalism.

  Consider two strong hedonist replies. First, **Roger Crisp's Phenomenal Unity**: he argues there is a subtle, ubiquitous "hedonic tone" in all pleasures. At its strongest, this appeals to introspective limits: we simply miss the commonality. However, this relies on negative evidence (you can't prove it's absent) and fails to explain why attitudinal pleasures feel so cognitively distinct from sensory burns. Second, **Feldman's Attitudinal Hedonism**: he argues we take pleasure in propositions. At its strongest, this unifies the object of pleasure (always a proposition). But this ignores the phenomenology; being glad about a paper acceptance feels fundamentally different from enjoying a massage, and hedonism claims the *feeling* (or attitude) itself is the good, not just the propositional content. Both replies try to save Water; both fail because the surface heterogeneity is too great.

  The Role-model survives because it accepts the heterogeneity of feel while insisting on the unity of function. The heterogeneity problem does not kill hedonism; it forces it to mature from a theory about sensations to a theory about valenced mental functioning.

