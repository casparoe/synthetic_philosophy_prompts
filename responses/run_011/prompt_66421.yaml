  1. Before grading anything, do the scratch work: compute Sam's interval for rain under each of the two possible reports, showing the conditionalizations and rounding to two decimals.
  2. Then take M1 through M7 one at a time and grade each on this scale: clearly wrong / mostly wrong / mixed / mostly right / clearly right. Two or three sentences per move, and name the specific premise doing the work each time. Where a move depends on an assumption about how imprecise agents accept bets, say which assumption and whether it was earned by something Sam actually said.
