  | | Model A | Model B |
  |---|---|---|
  | P(rain) | 0.4 | 0.6 |
  | P(front stalls, given rain) | 0.9 | 0.1 |
  | P(front stalls, given no rain) | 0.3 | 0.8 |

  The 6am report will say either that the front has stalled or that it hasn't. Sam updates both models on whichever he hears and then takes the new interval.

