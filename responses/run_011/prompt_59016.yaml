answer: |-
  To draft a note that protects the utility from policy errors based on historical analogy, you must treat "collapse" not as a metaphor but as a mechanical claim. If the Board intends to use the past to justify infrastructure spend or rationing, the historical model must withstand the same scrutiny you would apply to a hydrological model. Below is the specification you requested.

  ### The Specification: Requirements for an Adequate Collapse Account

  **1. Mechanism Specificity (The "How" Constraint)**
  *   **Requirement:** The account must specify the causal chain linking the environmental stressor (e.g., drought) to the institutional failure. It cannot posit a direct link between "less water" and "societal end." It must identify the intermediate political or economic variables that broke.
  *   **Motivating Case:** The Classic Maya. Board papers often cite "drought caused Maya collapse." The archaeological record shows drought coincided with the abandonment of southern lowland cities, but the mechanism was not thirst. It was the loss of legitimacy of the *k'uhul ajaw* (divine kings), whose authority rested on ritual assurance of rain, compounded by endemic warfare over shrinking resources. A society where water is managed by a technocratic utility, not a divine king, faces a different mechanism. If the account cannot name the specific institution that fails when the reservoir drops, it is useless.

  **2. Temporal Resolution (The "When" Constraint)**
  *   **Requirement:** The account must distinguish between acute shock and chronic stress, and specify the lag time between the onset of stress and the institutional break.
  *   **Motivating Case:** Angkor vs. The Late Bronze Age. Angkor's hydraulic network was modified over centuries; its "collapse" was a slow decoupling of the state from the maintenance of the barays (reservoirs), not a sudden emptying. Conversely, the Late Bronze Age eastern Mediterranean saw a cascade of palace destructions within a few decades (c. 1177 BCE). If your Board is planning for a Year 15 crisis, an Angkor model (centuries of degradation) is irrelevant, and a Bronze Age model (systemic connectivity failure) may be alarmist. The account must commit to a timescale.

  **3. Elite vs. Population Distinction (The "Who" Constraint)**
  *   **Requirement:** The account must quantify who suffered. It must distinguish between the disappearance of a ruling class/state apparatus and the mortality or displacement of the general population.
  *   **Motivating Case:** Cahokia and Rapa Nui. For Cahokia, the "collapse" is a depopulation of the mound center, but the people largely dispersed to smaller agrarian communities; the "society" transformed, it did not vanish. For Rapa Nui, the "ecocide" narrative suggests mass starvation, but osteological evidence is disputed; much of the population loss may be attributed to post-contact disease and slave raiding, not pre-contact resource exhaustion. If the Board uses these cases to justify rationing to "save lives," but the historical record only shows "elite loss," the evidence does not support the policy.

  **4. Reflexivity and Technological Mediation (The "Us" Constraint)**
  *   **Requirement:** The account must explain why the present society lacks the adaptive capacities that the past society lacked, or why those capacities are ineffective. It cannot treat a market-integrated, technologically reflexive society as equivalent to a subsistence-based monarchy.
  *   **Motivating Case:** The Late Bronze Age vs. Present. Bronze Age states were tightly coupled; when trade in tin failed, bronze production stopped, and military capacity collapsed. We have substitutes, global markets, and desalination. An adequate account cannot simply say "resources ran out." It must explain why our specific buffers (price signals, technology, trade) will fail where theirs did. If it cannot, the analogy is anachronistic.

  **5. Empirical Consistency with Paleoclimate Data (The "Data" Constraint)**
  *   **Requirement:** The environmental narrative must match the resolution and timing of the proxy data. It cannot cherry-pick a drought record that aligns with the collapse while ignoring records that do not.
  *   **Motivating Case:** The Maya Drought. Stalagmite records from the Yucatán show significant droughts, but their timing does not perfectly align with the abandonment of all cities. Some northern cities flourished during the southern collapse. An account that claims "The Drought" as a singular, basin-wide killer contradicts the spatial variability in the data. If the Board's model assumes a uniform basin failure, it contradicts the heterogeneity seen in the proxy record.

  ***

  ### Explicit Addresses

  **1. Genuine Desiderata vs. School Preferences**
  You must distinguish between what is necessary for logical coherence and what is merely a theoretical commitment.
  *   **Genuine Desiderata:** Mechanism Specificity and Temporal Resolution are non-negotiable. Without them, the claim is magical thinking (A caused B with no link, instantly).
  *   **School Preferences:** You will encounter demands that the account *must* identify a "carrying capacity" or "overshoot." This is a Malthusian/Diamond-school preference, not a requirement. Many societies (e.g., Egypt through the Old Kingdom) persisted through resource constraints by restructuring distribution, not by hitting a hard ceiling. Similarly, a demand that the account *must* focus on "elite overproduction" is a Tainter-school preference. While often useful, it is not a universal law. Accept the demand for a *mechanism*, but reject the demand that the mechanism *must be* ecological overshoot or elite saturation unless the data forces it.

  **2. The Most Exclusionary Requirement**
  The requirement that does the most work is **Elite vs. Population Distinction**.
  Applied honestly, this rules out the largest share of collapse talk in your Board papers. Most popular collapse narratives conflate "the end of the state" with "the end of the people." They invoke the Maya or Rapa Nui to imply mass mortality or total civilizational erasure to justify urgent infrastructure spending. However, archaeology and demography consistently show that "collapse" is usually a political reorganization (de-urbanization, decentralization) rather than a demographic catastrophe. If your Board is arguing for infrastructure to prevent "societal death," but the historical evidence only supports "elite redistribution," the analogy fails. This requirement forces the Board to admit whether they are protecting the *utility's institutional power* (the state) or the *basin's inhabitants* (the population). The two are not historically synonymous.

  **3. Joint Unsatisfiability (The Trilemma)**
  Your suspicion is correct. An account cannot simultaneously be:
  1.  **Precise** about what is measured (e.g., sociopolitical complexity).
  2.  **Neutral** between "failure" and "transformation."
  3.  **Serviceable** as a warning to a present-day reader.

  **Neutrality must go.**
  To serve as a warning (Serviceability), the account must define the outcome as *undesirable*. If you are precise that "collapse" means "reduction in energy capture and hierarchical control" (Precision), you cannot remain Neutral on whether that is bad. For a water utility, a reduction in hierarchical control might mean the end of the utility's ability to mandate rationing. For a farmer, it might mean liberation from extraction.
  If you maintain Neutrality ("it was just a transformation"), you cannot issue a Warning ("we must avoid this"). If you issue a Warning, you have abandoned Neutrality.
  **Defense:** Policy is inherently normative. You are not writing a history paper; you are recommending action. Therefore, you must explicitly define "collapse" as a *loss of adaptive capacity that harms the population*, not merely a change in political form. Sacrificing Neutrality allows you to be Precise (we are measuring capacity to deliver water) and Serviceable (we must maintain it). Attempting to remain Neutral renders the note useless for decision-making.

  ***

  ### Assessment of Main Contenders

  **1. Complexity/Diminishing Returns (Tainter-esque)**
  This account fares well on **Precision** and **Mechanism**. It defines collapse as a reduction in sociopolitical complexity when the marginal return on investment in that complexity turns negative. It explains *why* a society stops maintaining infrastructure (it becomes too expensive). However, it struggles with **Serviceability** as a direct warning. It suggests collapse is a rational economic response to declining returns, not necessarily a moral failure. It may tell the Board that maintaining current infrastructure is no longer "worth it" to the society, which contradicts the Board's goal of preservation.

  **2. Ecocide/Choice (Diamond-esque)**
  This account scores high on **Serviceability**. It frames collapse as a moral failure to recognize environmental limits, which is a powerful tool for motivating rationing and infrastructure investment. However, it fails **Empirical Consistency** and **Mechanism Specificity**. It relies heavily on disputed cases (Rapa Nui ecocide is increasingly contested; Maya drought was not the sole driver). It tends to ignore **Elite vs. Population** distinctions, assuming everyone suffers equally from bad choices, which history rarely supports. It is the most useful for persuasion but the least reliable for prediction.

  **3. Transformation/Sceptical (Middleton/Scheidel-esque)**
  This account excels at **Elite vs. Population Distinction** and **Neutrality**. It correctly identifies that most "collapses" are reorganizations where the bulk of the population continues with altered but viable lifeways. However, it fails **Serviceability** as a warning. If "collapse" is just "transformation," there is no urgent imperative to spend capital to prevent it. For a utility tasked with maintaining *current* levels of service, this account is analytically robust but operationally paralyzing. It suggests the Board is protecting a specific political order, not human survival.
