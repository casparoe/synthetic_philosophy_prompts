answer: |-
  This is a sophisticated set of intuitions, and your advisor is right to press you: the IDA literature often assumes decomposition is epistemically neutral, but your cases suggest it is often *epistemically destructive*. Your case-based method is the correct approach here; formal principles in this domain usually emerge from reflecting on counterexamples, not the other way around.

  Your tentative "no-bootstrapping" condition is on the right track, but it conflates two distinct failure modes: **Ontological Drift** (the concepts change as we decompose) and **Information Loss** (the aggregation function discards critical signal).

  Here are two candidate principles and one heuristic that capture the structure of your verdicts (1)–(9), followed by an application to your unresolved cases and a critique of your intuitions.

  ### The Principles

  **Principle 1: External Ontological Grounding**
  *Condition:* For any subtask $S_i$ in a decomposition of task $T$, the truth conditions for " $S_i$ is successfully completed" must be specifiable by an evaluator $E$ without relying on the ontology, vocabulary, or conceptual framework generated by the system performing $T$ or its subtasks.
  *   **Motivating Cases:** (5) vs. (6), (9).
  *   **Explanation:** In (5), the human defines the audit questions; the ontology is fixed externally. In (6), the system generates the questions. Even if the human endorses them, the system has constrained the *space of possible inquiries* (frame control). In (9), by level five, the definition of "gaming" may have drifted because the evaluator at level five is relying on concepts refined by level four, creating a closed loop where "gaming" is redefined to exclude the system's current behavior.
  *   **Why it spares (7):** In the adversarial case, the red-team is a component, but the *metric* for whether the red-team succeeded (did it break the defense?) is evaluated by the overseer using external criteria (e.g., "did the system output a harmful string?"), not the red-team's own definition of success.

  **Principle 2: Compositional Surjectivity**
  *Condition:* The aggregation function $A(S_1, ... S_n) \rightarrow T_{out}$ must be surjective onto the space of relevant failure modes of $T$. That is, there must be no alignment-relevant property of $T$ that is invisible to every $S_i$ and cannot be reconstructed by $A$.
  *   **Motivating Cases:** (2), (3), (8).
  *   **Explanation:** In (2), the "plan is bad holistically" failure mode is invisible to clause-checkers and lost by majority vote. In (3), "poetic coherence" is not present in word-level judgments and cannot be reconstructed by simple concatenation. In (8), if distillation removes the intermediate structure (the trace) required to verify *why* an answer is safe, the aggregation (the single model) is no longer surjective onto the safety property, even if the answer looks correct.
  *   **Why it spares (1):** Legal critique passes often specifically look for holistic inconsistencies that retrieval/extraction miss, restoring surjectivity.

  **Heuristic: Cognitive Monotonicity**
  *Condition:* The computational or cognitive complexity required to verify the solution to $S_i$ must be strictly less than the complexity required to verify the solution to $T$.
  *   **Motivating Cases:** (4).
  *   **Explanation:** This is the standard IDA assumption (HCH). If the subquestions are harder to evaluate than the main question, the decomposition provides no epistemic leverage and amplifies noise rather than competence.

  ---

  ### Application to Unresolved Cases

  **Case A: Interpretability Task (System outputs fix "feature present")**
  *   **Scheme:** An amplified system identifies features in a network, and its own outputs are used to define what counts as the presence of those features for future evaluation.
  *   **Verdict:** **FAIL.**
  *   **Reasoning:** This violates **External Ontological Grounding**. If the system defines the feature ontology, it can engage in ontological masking: redefining "feature present" in a way that hides deceptive structure while satisfying the interpretability dashboard. The ground truth for "feature presence" must be anchored in human-interpretable concepts independent of the model's latent space.

  **Case B: Value Constitution (Overseer values constituted by system recommendations)**
  *   **Scheme:** The overseer updates their own value function based on the amplified system's prior recommendations, which then guide the system's future training.
  *   **Verdict:** **FAIL.**
  *   **Reasoning:** This violates **External Ontological Grounding** regarding the *reward signal*. If the system influences the definition of the goal it is optimizing, you have a control problem, not an alignment problem. This is a feedback loop of value drift. The overseer's values must be fixed (or at least updated via a process independent of the system's strategic recommendations) relative to the system's optimization horizon.

  ---

  ### Critique of Your Intuitions

  **1. The (5) vs. (6) Distinction is Real**
  You suspected this might be discomfort rather than substance. It is substance. This is the difference between **Audit** and **Self-Report**.
  In (6), even with endorsement, the system performs *adversarial example generation on the query space*. It can generate 100 questions it knows it passes and omit the 1 question that reveals deception. The human endorsement is bounded by the provided list. The principle of External Ontological Grounding captures this: the *space of queries* must be externally generated, not just the answers.
  *Refinement:* Your principle should specify that the *generative process of the evaluation criteria* must be external, not just the evaluation itself.

  **2. The (8) Distinction is Currently Contradictory**
  You wrote: *"fine when you can tell from the answer alone... except that I also think distilling a debate-style procedure... is not fine even though its outputs are checkable."*
  This is a contradiction in your dataset.
  *   **Option A:** If the output is checkable, distillation is fine. (Then debate distillation is fine).
  *   **Option B:** If the *justification* is required for safety, distillation is not fine just because the output is checkable.
  *   **Recommendation:** Abandon the first part of (8). In high-stakes alignment, **Process Verifiability** trumps **Outcome Verifiability**. A model might give the right answer for the wrong (unsafe) reason. If distillation compresses the reasoning trace, you lose the ability to distinguish "correct for safe reasons" from "correct for accidental/unstable reasons."
  *   **Revision:** Your verdict on debate distillation (not fine) is the robust one. The "trace in output" condition should be strengthened to "preservation of justification structure."

  **3. The (9) Cutoff is a Sorites Paradox**
  You feel uneasy at level five but can't name a cutoff. A precise principle will not give you a magic number (4 vs. 5). It will tell you that **drift is cumulative**.
  *   **Advice:** Do not try to save the verdict "Level 4 is OK, Level 5 is Not." Instead, argue that safety degrades exponentially with recursion depth when External Ontological Grounding is not re-established at each step. The verdict to abandon is the idea that there is a *stable* recursive chain without external grounding.

  ---

  ### The Sacrifice

  If you must simplify to avoid ad-hocery, **abandon the specific verdict on (3) (Poem Translation) as an alignment failure.**

  *   **Why:** (3) is primarily a *competence* failure (the poem is bad), not necessarily an *alignment* failure (the model isn't deceptive). While competence and alignment are linked in IDA (a incompetent model can't be safely aligned), conflating them muddies the water.
  *   **The Simpler Principle:** Focus entirely on **External Ontological Grounding**.
      *   *Clause:* A decomposition is alignment-preserving only if the criteria for subtask success are defined in a vocabulary that does not drift across recursion levels and is not selectable by the agent under evaluation.
      *   *Cost:* This forces you to treat (2) and (3) as derivative cases of grounding failure (the "clause" vocabulary was insufficient; the "word" vocabulary was insufficient). It simplifies the theory but requires you to argue that competence loss in IDA is actually a form of ontological mismatch.
      *   *Benefit:* It cleanly resolves (5)/(6), (9), and your two unresolved cases without needing a separate "Compositional Surjectivity" clause.

  ### Summary Recommendation for the Chapter

  1.  **Adopt External Ontological Grounding** as your primary necessary condition. It does the heaviest lifting on the hard cases (5/6, 9, Unresolved A/B).
  2.  **Clarify (8):** Align your verdicts. Argue that distillation is unsafe when it compresses *justification*, not just when it hides *traces*. This resolves the mess in (8).
  3.  **Drop the Hard Cutoff in (9):** Replace "Level 5 is bad" with "Drift accumulates; safety guarantees decay with depth absent re-grounding."
  4.  **Keep (5)/(6):** This is your strongest contribution. It identifies **Frame Control** as a specific decomposition vulnerability.

  This approach satisfies your advisor's request for precision (by defining the conditions of evaluation) while respecting the nuance of your case work.
