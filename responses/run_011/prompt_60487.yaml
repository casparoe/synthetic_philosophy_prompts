answer: |-
  Dr. Aris leads a well-funded lab sponsored by TechCorp. The CEO, Vance, holds unilateral authority to revoke funding or redirect Aris's research at any moment, without cause or appeal. Vance admires Aris, never interferes, and ensures resources flow smoothly. Aris loves her work, suffers no coercion, and reflectively endorses her projects. She never feels anxious; Vance's benevolence is reliable. Yet, Vance retains the raw capacity to shut her down tomorrow based on his whim, even if he never exercises it. Aris remains professionally successful and psychologically self-mastered, operating entirely without obstruction.

  **(a)** Berlin says Aris is free because no one is actively interfering with her actions. Positive liberty says she is free because she is self-directed and reflectively endorses her work. Pettit says she is unfree because Vance possesses the arbitrary capacity to interfere with her choices, regardless of whether he uses it.

  **(b)** Domination is separated from mere dependence by arbitrariness. Dependence becomes domination when the powerful agent is not constrained to track the agent's interests by law or norm, leaving the agent vulnerable to whim.

  **(c)** The unchecked capacity to interfere.

  **(d)** It collapses the case. If Aris can leave costlessly, she is no longer vulnerable to Vance's power in a way that compromises her status; the relationship becomes a voluntary market exchange rather than a hierarchy.

  **(e)** A Berlinian would argue you are conflating freedom with security or resilience; Aris is free now, and the risk of future interference is a separate issue. Regarding the eyeball test, Pettit insists Aris fails it: she cannot look Vance in the eye as an equal because her status depends on his goodwill rather than his duty.
