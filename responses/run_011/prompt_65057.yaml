answer: |-
  'So,' Sarah said, closing her folder. 'I'll vote for the dialect preservation if you vote for the vaccination vouchers. Both pass. We go home.'

  David didn't open his. 'You're asking me to legitimise bribery. Paying people to fulfil a civic duty corrupts the practice. It turns health into a transaction.'

  'And letting the dialect die turns culture into ash. You think my vouchers are corrupting; I think your sentimentality is waste. But if we swap, I get lives saved, you get history kept. Why is that worse than both of us getting nothing?'

  'Because it assumes there's a common scale,' David said. 'To trade, you need a currency. You're smuggling in a second-order value theory: that my satisfaction in saving the dialect weighs equally against your satisfaction in saving children. But I don't accept that metric. I reject the idea that my moral convictions are commodities to be balanced against your welfare sums.'

  'I'm not balancing them,' Sarah countered. 'I'm not saying a dialect equals ten vaccinations. I'm saying you prefer a world with the dialect and the vouchers to a world with neither. I prefer the vouchers and the dialect to neither. We both move closer to our own ideal world. No common scale needed. Just mutual gain.'

  'But by accepting the trade, I admit my opposition was negotiable. If I can sell my principle for a grant, was it ever a principle? Or just a preference with a price?'

  'Principles aren't martyrs, David. If you refuse, the vouchers pass anyway. I have the numbers without you. So you don't stop the corruption; you just forfeit the dialect. You're choosing purity over impact.'

  'Voting isn't just causal; it's expressive,' David said. 'If I vote for the vouchers, I sign my name to a lie. That I believe paying for duty is acceptable. If I abstain, I record my dissent. If you win without me, the corruption is yours. If I vote for it, it's ours.'

  'Is that real complicity, or squeamishness?' Sarah asked. 'You're letting the vaccinations happen either way. The only difference is whether the dialect survives. Are you saying your clean hands matter more than those children's health?'

  'I'm saying integrity matters. If I trade, I treat my moral view as contingent. And you—aren't you compromised too? You're the welfarist. You're trading efficiency for symbolism. You're admitting your metric isn't sovereign.'

  Sarah paused. 'Yes. I am. I'm accepting a less efficient allocation of capital to secure your cooperation. I'm compromising my mandate for welfare maximisation.'

  'Then we're both corrupting our core views,' David said. 'You're diluting efficiency; I'm diluting duty. We're meeting in a grey zone where neither of us believes we're right.'

  'Or we're meeting in the real world,' Sarah said. 'Where nobody gets everything. If I insist on pure efficiency, I get nothing. If you insist on pure principle, you get nothing. Is the ideal enemy of the good?'

  'The ideal is the only thing that stops the good from becoming incremental evil,' David replied. 'If we normalise this—trading across moral fault lines—we stop debating what's right. We just haggle. We turn ethics into a marketplace.'

  'We already have a marketplace,' Sarah said. 'It's called politics. And right now, the market price for your dialect is my vote. Take it.'

  David looked at the proposal, then at her. 'If I vote yes, I'm not agreeing with you. I'm buying something else.'

  'I know,' Sarah said. 'And I'm not agreeing with you. I'm buying something else. That's the trade.'

  'Then we're not partners,' David said. 'We're accomplices.'

  'Fine,' Sarah said. 'Accomplices. Shall we vote?'

  ***

  **Note on the Philosophical Landscape**

  The dialogue above dramatises a specific niche within normative ethics and decision theory, often discussed under the banner of 'moral trade' or 'vote trading among moral agents'.

  **Common Ground:**
  Both characters accept that trade yields mutual benefit relative to the status quo (Pareto improvement). This is standard rational choice theory. There is also broad agreement in the literature that moral trade is *possible* in practice; the disagreement is about whether it is *permissible*. Both also accept the 'causal inefficacy' point (that one vote rarely decides an outcome), which is standard in discussions of complicity.

  **Disputed/Contested Assumptions:**
  1.  **The Metric Objection:** David's claim that trade requires a common currency is a standard deontological objection. However, Sarah's counter—that trade only requires ordinal preferences within each agent's own framework—is the standard defence (associated with thinkers like Todd and Bostrom). Whether this successfully avoids 'second-order utilitarianism' (valuing satisfaction itself) is genuinely disputed. Many non-consequentialists argue that facilitating a wrong act (even for a good outcome) violates agent-relative constraints that cannot be offset by 'own terms' gains.
  2.  **Integrity and Pricing:** David's worry that trading proves the view was merely a preference is a version of the 'corruption objection'. This is not settled. Some argue principles are by definition non-tradeable; others argue rigid non-tradeability is moral fetishism.
  3.  **Complicity:** The distinction between 'causing' harm vs. 'expressing' endorsement is a major fault line in ethics. Sarah treats complicity as causal (did you change the outcome?); David treats it as expressive (did you endorse the norm?). There is no consensus on which matters more for moral assessment.
  4.  **Symmetry:** Sarah's admission that she compromises efficiency is crucial. Often, welfarists assume they have the 'objective' metric. Acknowledging that trading for symbolic goods violates strict welfarism is often glossed over in favourable treatments of moral trade.

  **Fudges:**
  The dialogue simplifies the board's voting rules (assuming a simple majority where one vote swings it or signals consent). It also treats 'welfare' and 'duty' as monolithic blocks, whereas in practice, both members might have threshold deontology or pluralistic values that would make the trade easier to justify internally. The 'second-order value' objection is presented sharply; in reality, distinguishing between valuing *outcomes* vs. valuing *agreement* is technically complex.
