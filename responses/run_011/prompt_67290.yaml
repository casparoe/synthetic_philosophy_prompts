answer: |-
  There is no established single term in the literature on exemplarity, biography, or moral psychology that captures this specific structural paradox. You have identified a precise failure mode within the economy of *exemplum* that existing vocabulary skirts but does not name.

  The neighbors you have already identified are indeed distinct:
  *   **Hagiography (as critique):** Concerns *veracity* (the text lies). Your problem concerns *verisimilitude* (the text is too coherent).
  *   **Historicist Anxiety (19th c.):** Concerns *scale* (the past dwarfs the present). Your problem concerns *obligation* (the text discharges the debt).
  *   **Moral Psychology of Admiration:** Concerns *mechanism* (how admiration motivates). Your problem concerns *termination* (how admiration stops motivation).
  *   **The Incidental/Load-Bearing Problem:** Concerns *epistemology* (what to copy). Your problem concerns *phenomenology* (the feeling of having copied).

  Because the phenomenon is structural (arising from the success of the genre rather than its failure) and psychological (arising from the completion of the reading act rather than the judgment of the content), it requires a new designation. I propose the term **Exemplary Surrogacy**.

  ### Definition
  **Exemplary Surrogacy** is the structural tendency of a perfected biographical narrative to satisfy the reader's moral obligation through the aesthetic consumption of the text, thereby rendering actual imitation unnecessary.

  In this configuration, the *narrative coherence* of the life acts as a surrogate for the *moral coherence* of the reader. The text achieves a wholeness (beginning, middle, end; struggle, resolution, glory) that the reader's own life lacks. By witnessing this wholeness, the reader borrows the subject's moral completion. The obligation to *become* like the subject is discharged by the act of *admiring* the subject.

  ### The Mechanism
  Exemplary Surrogacy operates through a three-step substitution:

  1.  **Selection as Smoothing:** As you noted, the biographer selects for the edifying. This removes the "friction" of the subject's life (the unresolved failures, the boring days). This friction is normally the point of contact for the reader; it is where the reader's own struggle grips the text. Without it, the text becomes smooth.
  2.  **Aesthetic Closure as Moral Closure:** A well-written biography has a narrative arc. It resolves. When the reader reaches the end, they experience *narrative satisfaction*. In Exemplary Surrogacy, this aesthetic satisfaction is misrecognized as moral satisfaction. The reader feels the "completion" of the story as the "completion" of the duty.
  3.  **Admiration as Terminal State:** Admiration is intended to be kinetic (a force that propels). Under Exemplary Surrogacy, admiration becomes potential (a state of rest). The reader rests in the warmth of the admiration, mistaking the emotional resonance of the text for the moral labor of the life.

  ### Conditions for Failure (When Surrogacy Does Not Arise)
  Exemplary Surrogacy is not inevitable. It fails to arise under specific conditions, which helps define its boundaries:

  1.  **Fragmentary or Open Texts:** If the biography is explicitly unfinished, or if the narrative structure emphasizes unresolved tension (e.g., a saint whose martyrdom is presented as a beginning rather than an end), the reader cannot achieve closure. The moral obligation remains open because the narrative is open.
  2.  **Excessive Realism (The "Clumsy" Record):** As you observed, a record that includes too much ordinariness or unresolved failure prevents the aesthetic satisfaction required for surrogacy. The reader remains "unsettled" because the text offers no coherent whole to borrow.
  3.  **Radical Alterity:** If the subject is presented as fundamentally *other* (e.g., a saint whose holiness is explicitly described as a gift of grace impossible for the reader to attain), imitation is ruled out from the start. Here, admiration is not a substitute for imitation; it is the only available response. Surrogacy requires the *promise* of imitation to be viable, only to substitute it.

  ### Boundary Cases
  To test the edges of **Exemplary Surrogacy**, consider these three scenarios:

  **1. The Unique Circumstance (Honest but Non-Transferable)**
  *   *Case:* A biography of a general who won a battle due to a specific, unrepeatable geographical anomaly, told honestly.
  *   *Analysis:* This produces admiration, but not Surrogacy. The reader cannot imitate the feat, so they do not feel they *could have* discharged the obligation. The feeling is one of *wonder*, not *completion*. Surrogacy requires the illusion of transferability.

  **2. The Wrong Imitation (Admiration Produces Action)**
  *   *Case:* A reader admires a saint's charity but imitates their asceticism instead, because the asceticism was more vividly described.
  *   *Analysis:* This is a failure of *judgment*, not Surrogacy. The reader is still acting. Exemplary Surrogacy is defined by the *absence* of action, replaced by the feeling of action. Here, the mechanism of substitution failed; the kinetic energy of admiration was released, just misdirected.

  **3. The Text Without an Exemplar (Pure Aesthetic Discharge)**
  *   *Case:* A novel about a fictional hero that produces the same "warm feeling" of having done something.
  *   *Analysis:* This is **Aesthetic Surrogacy**, a broader category. Exemplary Surrogacy is specific to *biography* and *lives* where there is a claimed truth-value and a moral claim on the reader. In fiction, there is no moral obligation to imitate, so there is no obligation to discharge. The "warm feeling" in fiction is just pleasure; in biography, it is a *moral shortcut*.

  ### Utility for Your Seminar
  Using **Exemplary Surrogacy** allows you to bridge the Greco-Roman and Medieval genres without conflating their theologies.
  *   In **Plutarch**, the surrogacy is masked by the *Parallel* structure. As you noted, the truth returns in the comparison. You can argue that the *Synkrisis* is Plutarch's own attempt to break the Surrogacy of the single Life by reintroducing friction and judgment.
  *   In **Hagiography**, the surrogacy is often theological (the Saint's merits avail for the reader). You can distinguish the *theological* surrogacy (grace) from the *narrative* surrogacy (Exemplary Surrogacy). The latter is a literary side-effect that may undermine the former.

  This term gives you a tool to discuss why the "best" written lives might be the "worst" moral teachers, not because they are false, but because they are too complete.
