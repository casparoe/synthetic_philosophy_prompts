answer: |-
  # The Regime Builder: Church & State Simulation

  ## 1. Game Overview & Materials
  **Goal:** Students draft constitutional articles governing religion, survive a demographic shift, and experience the cost of "opting out."
  **Class Size:** 22 Students.
  **Grouping:** 5 Groups. Four groups of 4 students, one group of 6 students. (If the group of 6 feels unwieldy, split the two extra students into two other groups to make them 5).
  **Room:** Movable chairs (clusters), 2 Whiteboards.
  **Materials:**
  *   5 Printed "Community Profile" Cards (see below).
  *   5 Packets of "Drafting Paper" (lined paper, 3 sheets per group).
  *   1 "Registrar's Log" (a single sheet of paper taped to the front whiteboard).
  *   20 "Cohesion Tokens" per group (poker chips, paper clips, or just tally marks on the board).
  *   Pens/Markers.

  ## 2. Community Profile Cards
  *Print one per group. Do not let groups see each other's cards.*

  **Card 1: The Homogeneous Heartland**
  *   **Demography:** 85% Faith A (Established), 10% Faith B, 5% Unaffiliated.
  *   **History:** Faith A built the hospitals and schools. The state is culturally synonymous with Faith A.
  *   **Current Tension:** Faith B is growing slightly. Faith A feels besieged by secular culture.
  *   **Task:** Draft a constitution that preserves social harmony and respects tradition.

  **Card 2: The Pluralist Metro**
  *   **Demography:** 30% Faith A, 30% Faith B, 20% Faith C, 20% Unaffiliated.
  *   **History:** Founded by refugees from multiple sects. No single history dominates.
  *   **Current Tension:** Everyone fears dominance by the others. Public funds are scarce.
  *   **Task:** Draft a constitution that ensures no group feels oppressed.

  **Card 3: The Northern District (The Holdover)**
  *   **Demography:** 60% Unaffiliated, 30% Faith A, 10% Faith B.
  *   **History:** This region joined the secular Republic 100 years ago. As a condition of entry, a treaty guaranteed the state continues to collect tithes for Faith A clergy and fund Faith A instruction in public schools.
  *   **Current Tension:** The majority (Unaffiliated) resents paying for Faith A. Faith A views the treaty as a sacred right.
  *   **Task:** Draft a constitution that honors the treaty but addresses the modern majority.

  **Card 4: The Post-Conflict Zone**
  *   **Demography:** 50% Faith A, 50% Faith B.
  *   **History:** Civil war ended 10 years ago. Violence was religiously coded.
  *   **Current Tension:** Any perceived advantage by one side triggers riots.
  *   **Task:** Draft a constitution that prevents violence above all else.

  **Card 5: The Frontier (The Wildcard)**
  *   **Demography:** 40% Faith A, 40% Unaffiliated, 20% New Sect D (Recent immigrants).
  *   **History:** Rapid growth. Institutions are weak.
  *   **Current Tension:** Sect D is not recognized by existing laws. Unaffiliated want no religion in schools; Faith A wants maintenance of tradition.
  *   **Task:** Draft a constitution that integrates new arrivals without alienating founders.

  ## 3. The Registrar & Exit Apparatus
  **Setup:** Tape the "Registrar's Log" to the front whiteboard. Draw two columns: *Name* and *Cost Paid*.
  **The Rule:** During the Enforcement Phase (see Timeline), if a student's group status puts them in a minority position that burdens them (e.g., taxed for a church they don't belong to), they may "Opt Out."
  **The Mechanic:**
  1.  The student must physically walk to the front.
  2.  They must sign their name on the Log.
  3.  They must say aloud: "I dissent from this regime."
  4.  **The Cost:** Their group loses 1 Cohesion Token. (If tokens represent state stability/benefits, this shows that individual exit degrades the collective).
  5.  **The Catch:** To opt out, they must forfeit the specific benefit their constitution provided (e.g., if the state funds schools, opt-outs get no school funding).

  ## 4. The Time-Skip (Decision & Script)
  **Decision:** **Announce the *Risk*, Conceal the *Specifics*.**
  **Why:** If you spring it completely, students feel the simulation is "rigged" (a gotcha), which breeds cynicism. If you tell them exactly what will change, they will game the future rather than argue about principle. By announcing that *time will pass and demographics shift* without saying how, you force them to draft for **uncertainty**. This mirrors the real philosophical problem: constitutions are bets on a future we cannot see.

  **Instruction to give at Start (Minute 5):**
  > "You are drafting a constitution intended to last 50 years. You will be graded on **Durability**. At the halfway point, I will advance the clock. Demographics shift, sects split, and secularization happens. If your constitution breaks under the new numbers, your regime fails."

  **The Time-Skip Script (Read Aloud at Minute 35):**
  > "Fifty years have passed. Here is the new reality for all regions:
  > 1.  **Secularization:** The 'Unaffiliated' population has doubled in every group.
  > 2.  **Fragmentation:** Faith A has split into two rival sub-sects (A1 and A2). They hate each other more than they hate Faith B.
  > 3.  **Migration:** Faith B is now the largest single organized bloc in Cards 1, 3, and 5.
  >
  > Look at the articles you wrote. Do they still work? Who is burdened now? Groups will now swap constitutions. You will enforce the constitution written by the group to your left, applied to your *new* demographics."

  ## 5. Minute-by-Minute Timeline (75 Minutes)

  *   **00-05: Setup.** Move chairs. Hand out Cards. Explain the "Durability" warning.
  *   **05-25: Drafting Phase.** Groups write 4 Articles max (Funding, Recognition, Schools, Exemptions). **Constraint:** Max 50 words per article. (Prevents lawyering).
  *   **25-35: Ratification.** Groups post their 4 articles on the whiteboard (or hold them up). TA scans for clarity.
  *   **35-40: The Time-Skip.** Read the script. Hand out "New Demography" slips (or just announce it).
  *   **40-60: Enforcement & Exit.**
      *   Groups swap constitutions (Group 1 enforces Group 2's rules, etc.).
      *   TA asks each group: "Under these new rules and new numbers, who is angry?"
      *   **Trigger the Exit:** Invite students who would be burdened (e.g., a Faith B student in a Faith A tax regime) to walk to the Registrar's Log.
      *   Collect the "Cost" (erase a token from their original group's score).
  *   **60-75: Debrief.** (See below).

  ## 6. Payoff / Scoring Scheme
  No money. Use **Cohesion Tokens** (chalk marks on the board next to each group name).
  *   **Start:** 5 Tokens per group.
  *   **Penalty:** -1 Token for every student who opts out at the Registrar's Log.
  *   **Penalty:** -2 Tokens if the group cannot agree on how to enforce the *other* group's constitution during the swap.
  *   **Win Condition:** The group with the most tokens remaining after the Exit Phase.
  *   **Lesson:** High stability often requires suppressing dissent (no opt-outs). High liberty encourages opt-outs (low stability). There is no perfect score.

  ## 7. Troubleshooting: What Will Go Wrong

  **1. The Pre-Law Students (The "Loophole" Problem)**
  *   **Risk:** They will write 100-word clauses defining "Religion" to exclude specific groups, or write "Unless otherwise legislated" to avoid commitment.
  *   **Recovery:** Enforce the **50-Word Limit** ruthlessly. If a clause is vague, tell them: "The Supreme Court (you) will interpret this strictly against the drafter in the next phase."
  *   **Role Assignment:** If you have obvious debaters, assign them the role of "Scribe" who can only write what the group agrees on, limiting their ability to dominate verbally.

  **2. The "Rigged Deck" Accusation**
  *   **Risk:** When Faith B becomes the majority in the Time-Skip, students in Card 1 (Homogeneous) will claim it's unrealistic.
  *   **Recovery:** Lean into it. "Is it unrealistic, or is it just inconvenient for your draft?" Remind them of the "Durability" warning at Minute 5. The lesson *is* that predictions fail.
  *   **Prevention:** This is why you announce the *risk* of change upfront. You didn't lie; you warned them.

  **3. The Exit Mechanic Fizzles**
  *   **Risk:** No one wants to walk to the front. It feels awkward.
  *   **Recovery:** You (the TA) must start it. Pick a student in a burdened minority (you know the cards) and say: "Under this rule, you owe a tax to a church you don't attend. Do you pay, or do you walk?" If they hesitate, highlight the token cost to their team. Peer pressure will move them.

  ## 8. Debrief Script (Mapping Moments to Concepts)
  *Do not lecture. Ask questions that force them to name the concepts.*

  **Moment 1: The Drafting (Neutrality)**
  *   **Ask:** "Group 2, you tried to be neutral. Did you end up privileging someone anyway?"
  *   **Concept:** **Non-Neutrality of Separation.** (Writing "No state religion" privileges secularists and organized religions equally, but burdens small/new sects that need state help to grow).
  *   **Say:** "Separation isn't a blank slate. It's a specific distribution of resources."

  **Moment 2: The Time-Skip (Path Dependence)**
  *   **Ask:** "Group 3 (The Holdover), did you try to abolish the old treaty? Why not?"
  *   **Concept:** **Path Dependence / Entrenchment.** (Past political bets constrain future justice).
  *   **Say:** "Constitutions are bets on who the majority will be in thirty years. When the bet goes wrong, changing the rules is expensive."

  **Moment 3: The Registrar (The Cost of Exit)**
  *   **Ask:** "For those who walked to the front: How did it feel? Was it 'free' to leave?"
  *   **Concept:** **Formal vs. Substantive Liberty.** (Having a right on paper is different than the social cost of claiming it).
  *   **Say:** " 'Just leave' is not a neutral solution. It requires public declaration and social cost. That is a burden the state places on the minority."

  **Moment 4: The Token Loss (Stability vs. Conscience)**
  *   **Ask:** "Group 1, you lost tokens when your members opted out. Would you have suppressed them to keep the points?"
  *   **Concept:** **The Establishment Trade-off.** (State churches often provided social welfare/cohesion at the cost of individual conscience).
  *   **Say:** "Every regime buys stability with someone's dignity. The question is whose."

  ## 9. Limitations: What The Game Can't Do
  *Be frank about this in the last 2 minutes.*

  1.  **Sacredness:** The game treats religion as a "preference" or "interest group." It cannot reproduce the feeling that a law is *sinful* rather than just *inconvenient*. You must supply this: "Imagine the tax wasn't money, but an act of worship."
  2.  **Violence:** The tokens abstract away pain. In reality, these conflicts kill people. The game makes it too clean.
  3.  **Belief:** Students are playing roles. They don't actually *feel* the loss of their church. You must remind them that for the people in the cards, this isn't a game.

  ## 10. Materials List (Printable)
  *   **5 Community Cards** (Text provided in Section 2).
  *   **Drafting Sheets** (Plain paper with "Article 1, 2, 3, 4" headers).
  *   **Registrar Log** (One sheet, taped to board).
  *   **Chalk/Markers** (For tokens and writing articles).

  *No bibliography. No readings. Just the machine.*
