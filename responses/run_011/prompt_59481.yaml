      *   *Section 3: Rival Accounts.* Explicitly map the philosophies.
          *   *Rules Out:* Capabilities (too functionalist), Positive Hedonism (too expensive/hard to measure).
          *   *Licenses:* Negative Hedonism, Autonomy.
