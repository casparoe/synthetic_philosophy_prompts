answer: |-
  Here are three candidate principles constructed to handle the machinery of your argument. I have stripped the literature away to focus on the structural logic.

  ### The Candidate Principles

  1.  **The Momentary Fair-Share Plus (Your Current Draft):**
      "A demand is excessive if, at the moment of solicitation, it exceeds your fair share plus a sliding margin for non-compliance, unless the cost involves non-fungible identity goods."
  2.  **The Fungibility Firewall:**
      "Fungible resources (money, assets) are demandable up to a welfare baseline, but non-fungible resources (time, vocation, relationships) are lexically protected from maximization unless the threat is immediate and lethal."
  3.  **The Integrated Agency Cap (My Recommendation):**
      "A demand is excessive if the *aggregate* cost (time + money + identity) over a life trajectory prevents the agent from maintaining a coherent, self-directed life plan, regardless of the resource type or moment of demand."

  ---

  ### Clause-by-Clause Walkthrough & Verdict Overturns

  **1. The Momentary Fair-Share Plus**
  *   **Handles:** *Drowning Child vs. 99 Refusers.* The sliding margin clause explains why you wade in (emergency margin) but don't pay $100k (exceeds fair share + reasonable margin).
  *   **Handles:** *Ring vs. Car.* Clause 2 (Identity Goods) protects the ring but not the car.
  *   **Fails:** *The Drip.* Clause 3 (Momentary Assessment) forces you to say the 20-year erosion is permissible because every single act is trivial. It cannot capture "death by a thousand cuts."
  *   **Fails:** *Deferral.* It measures cost *now*. It cannot account for the fact that waiting might reduce *lifetime* sacrifice.
  *   **Verdicts to Overturn:** You must admit the Drip case is permissible (life erased), or abandon Clause 3.

  **2. The Fungibility Firewall**
  *   **Handles:** *Tutoring vs. $20 Donation.* It codifies your intuition that money is demandable but time is not.
  *   **Handles:** *Ring vs. Kidney.* It explains why grief (identity) trumps welfare (kidney), though it struggles with the *Music Risk* case (why does probability make identity fungible?).
  *   **Fails:** *99 Refusers.* It doesn't explain why you owe *any* margin over fair share if the resource is fungible.
  *   **Fails:** *Privilege Check.* It structurally favors the professional class (high cash, high time-value) over the working class (low cash, low time-value).
  *   **Verdicts to Overturn:** You must accept that tutoring *is* required if the welfare gain matches the donation, or admit the principle is class-biased.

  **3. The Integrated Agency Cap**
  *   **Handles:** *The Drip.* By measuring aggregate cost, it identifies the 20-year erosion as a violation of the life plan.
  *   **Handles:** *Deferral.* It allows waiting if it preserves long-term agency capacity (more to give later without erasure).
  *   **Fails:** *Ring vs. Car.* It treats the ring as a resource cost. If selling the ring doesn't break the life plan, it might be required.
  *   **Fails:** *Tutoring vs. $20.* It treats time and money as equivalent resources. If you can afford $20, you can afford the hour.
  *   **Verdicts to Overturn:** You must accept that time is money (Tutoring is required) and that identity goods are tradable if the life plan survives (Ring might be sold).

  ---

  ### The Recommendation: The Integrated Agency Cap

  I recommend you adopt **The Integrated Agency Cap**, but you must do so knowing it will burn down two of your strongest intuitions. It is the only principle that solves the *Drip* (aggregation) without relying on the *Momentary* clause that causes the leak. It forces you to confront the resource equivalence of time and money.

  **Why this one?** Your current draft (Momentary Fair-Share Plus) is unfalsifiable because it allows you to toggle between "momentary" and "aggregate" depending on the verdict you want. The Integrated Agency Cap makes a hard claim: *Morality judges lives, not acts.* This aligns with your worry about the "erased" person in the Drip case.

  #### Application to the Deferral Case
  **Case:** Give $5k now or $25k in ten years.
  **Application:** The Integrated Agency Cap asks: *Which option preserves a coherent life plan while maximizing good?*
  If waiting ten years allows you to give five times the aid without compromising your long-term agency (e.g., you don't live frugally now, you just invest), the principle *requires* waiting. The "moment of demand" is irrelevant; the lifetime trajectory is what matters.
  **Result:** Waiting is not just permitted; it is **required**, provided the net present value of the good done is higher and your agency remains intact. Your intuition that it is merely "permitted" is too weak; the principle makes it obligatory to optimize lifetime impact.

  #### Two Invented Cases (Survivor vs. Closest Rival)
  *Closest Rival: The Fungibility Firewall (Your current Money/Time intuition).*

  **Case A: The High-Earner's Saturday**
  *Scenario:* You can donate $500 (trivial for you) or tutor a kid for 3 hours (trivial time, same welfare impact). You earn $200/hour consulting.
  *   **Fungibility Firewall:** Tutoring is *not required* (Time is protected). Donation is *required* (Money is fungible).
  *   **Integrated Agency Cap:** Tutoring is *required*. Time and money are both resources drawn from the same lifetime pool. If you have the agency capacity to work 3 hours, you have the capacity to tutor 3 hours. Protecting "leisure time" while spending "surplus cash" is an arbitrary distinction if both are within the agency cap.
  *   **Divergence:** The Firewall protects your time; the Cap demands it.

  **Case B: The Sabbatical for Charity**
  *Scenario:* You can take a unpaid sabbatical for one year to volunteer full-time (high good, high time cost) or work the year, donate 40% of salary (high good, high money cost, low time cost).
  *   **Fungibility Firewall:** Working/Donating is *preferred/permitted*. Volunteering is *supererogatory* (Time cost is too high/protected).
  *   **Integrated Agency Cap:** If the volunteer year fits within a "coherent life plan" (e.g., a decade of service), it is **required** if it produces more good than the salary donation. The Cap does not privilege money-earning time over charity time.
  *   **Divergence:** The Firewall protects the career trajectory; the Cap treats the career as just another resource to be optimized for the life plan.

  ---

  ### The Privilege Check

  You asked me to tell you if a verdict is a tenured, comfortably paid person protecting himself.

  **Yes. The Tutoring vs. Donation verdict is that verdict.**

  Your intuition that "$20 is required, but one hour of time is not" is the specific point where your class position hardens into philosophy.
  1.  **Economic Reality:** For a working-class person, $20 is a significant welfare hit (food, utilities). For you, it is trivial. For a working-class person, one hour of time is often flexible or low-opportunity cost. For you, time is high-value professional labor.
  2.  **The Bias:** By marking Money as "fungible" and Time as "identity-constituting" (Clause 2), you are shielding the specific resource the professional class hoards (discretionary time) while demanding the resource they can easily replenish (cash).
  3.  **The Co-Teacher's Critique:** She is right to blush you here. If you adopt the **Integrated Agency Cap**, you must admit that time *is* money. If you can afford the $20, you can afford the hour. Defending the distinction requires arguing that *your* time is constitutively different from *money*, which sounds exactly like the "rich-country excuse" your colleague fears.

  **How to defend this without blushing:**
  Do not defend the distinction as *metaphysical* (Time is special). Defend it as *instrumental*. Argue that demanding time leads to burnout and resentment, which destroys long-term agency (The Cap), whereas demanding money does not. But you must apply this consistently: If the tutoring *enhances* your agency (meaningful connection) more than the donation, the Cap might require the tutoring anyway.

  **Final Advice:**
  Adopt the **Integrated Agency Cap**. It fixes the Drip leak. It forces you to confront the Deferral case honestly (optimize lifetime impact). And it forces you to either justify the Time/Money distinction on empirical grounds (burnout) rather than metaphysical ones (identity), which is a much stronger position to hold in a seminar.
