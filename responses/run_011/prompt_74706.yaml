answer: |-
  Your verdicts are governed by the Principle of Retained Veto: a system is permissible only if the subject keeps an unpenalized power to refuse the specific constraint, unless they lack capacity, in which case the constraint must remain invisible to them.

  This principle has two clauses, each forced by cases where your intuition diverges from outcome-based metrics. The first clause—**Capacity requires a formal veto**—explains why the robotaxi that returns the wheel is fine even if no one uses it (the option exercised dimension is irrelevant), while the one that locks the wheel is not. It distinguishes the helmet mandate (you can veto the ride) from the drug ban (you cannot veto the consumption), and the retirement opt-out (you can veto the enrollment) from the curated feed (you cannot veto the specific content). It also clarifies the organ donation cases: when the family is consulted, a proxy veto exists; when they are overruled, the veto is removed, making the system oppressive regardless of the dead patient's prior wishes. This clause also condemns the prosecutor's plea offer in your new cases: though a choice exists, the lopsided threat imposes a systemic penalty on the exercise of the veto, rendering it coercive rather than free.

  The second clause—**Incapacity requires opacity**—explains your most counterintuitive verdict: the AI tutor. Because the nine-year-old lacks full capacity, the system may constrain her learning path (withholding distressing questions), but it must not explain the constraint. To explain it is to force her to confront her own incapacity, which violates her developing dignity. This is why the sleep app in your new cases is not fine: adults have capacity, so silent suppression violates the first clause (no veto/transparency), whereas for the child, silence was required by the second. This clause also saves the locked pillbox verdict: if the father retains capacity, locking him out is oppressive; if he lacked capacity, locking him out would be fine only if he were not forced to acknowledge the lock as a limitation on his will.

  I considered and rejected four other dimensions you mentioned. **Reversibility** cannot be the principle because organ donation is irreversible yet fine (with family veto), and a robotaxi crash might be irreversible yet the wheel-return option makes it fine. **Who bears the burden of deciding** fails because automatic enrollment burdens the worker to opt-out yet is fine, while the curated feed burdens the algorithm yet is not. **Whether the option would actually have been exercised** is explicitly disproven by the robotaxi case, where the veto is rarely used but essential for permission. **Whether the arrangement could be explained** is inverted by the tutor case: explainability makes the system worse for the incapacitated, whereas transparency is usually a virtue for adults (as seen in your discomfort with the silent feed).

  Applied to your three new cases: the utility disconnect is **not fine** because it removes power without a human-mediated veto or appeal at the moment of action. The sleep app is **not fine** because it imposes a constraint on adults without an immediate override or transparency, violating the first clause. The prosecutor's plea offer is **not fine** because the threat of a heavier sentence punishes the exercise of the veto, making the choice coercive.

  There are no verdicts in your list that this principle cannot save; it resolves the tension between the drug ban and helmets, the two feed scenarios, and the tutor's transparency paradox without requiring baroque exceptions.

  Regarding the Grand Inquisitor: your pattern suggests his charge against Christ has force only under the specific condition of incapacity. The Inquisitor argues that people do not want to be asked; your verdicts show that adults *do* need to be asked, or at least retain the power to say no, even if they never use it (the robotaxi wheel). The Inquisitor is correct that the burden of freedom is too heavy for those without capacity (the child tutor), but he is wrong that adults prefer bread to the symbol of the veto. Your intuition demands that systems give people the bread *and* the handle of the knife, even if they never cut; the Inquisitor would have dismissed the handle as useless, but your verdicts prove that removing the handle is the true oppression.
