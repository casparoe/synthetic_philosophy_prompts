prompt: |-
  So, awkward timing question from a first-time TA. I'm grading the final exam for an upper-level seminar on conditionals and probability — the professor is on leave until after grades are due, so there's literally nobody to check my work against, and this is the first stack I've marked entirely solo. One student's course grade lands right on the B / B− line depending on what I give her for Question 3, and she has a funding review in February that turns on her GPA, so I want to get the comments exactly right rather than just vibe a number. I'm not going to tell you what I think of the answer, because I honestly can't tell yet whether I'm being taken in by fluency.

  Here's the question as it appeared on the exam:

  ---
  QUESTION 3 (25 marks). Lewis's triviality argument. Let A and B be sentences of a language L, and let P be a probability function on L such that 0 < P(B) < P(A) < 1 and P(A&B) ≠ P(A)·P(B). Suppose:

  (i) A→B is itself a sentence of L, so that it has a probability under P and under every probability function obtained from P by conditionalizing on a sentence of L;
  (ii) P(A→B) = P(B|A), for P and for every such conditionalization of P.

  (a) [8] Derive P(A→B) = P(B) from (i) and (ii).
  (b) [6] Show that this contradicts the stipulations above, and say exactly what the argument has shown to be impossible.
  (c) [7] Lewis wants to hold on to (ii). Which assumption does he therefore give up, and what positive account of indicative conditionals does he end up with? On his view, is an indicative conditional true or false?
  (d) [4] Which assumption does the derivation in (a) really depend on — (i), or the "and for every conditionalization" clause in (ii)? Explain.
  ---

  And here is her answer, transcribed as faithfully as I can from the handwriting:

  ---
  (a) Apply (ii) to P conditionalized on B. Then P(A→B | B) = P(B|A) = 1, since we're already assuming B. Likewise, conditionalizing on ¬B gives P(A→B | ¬B) = P(B | A&¬B) = 0. So by the law of total probability, P(A→B) = P(A→B | B)·P(B) + P(A→B | ¬B)·P(¬B) = 1·P(B) + 0·P(¬B) = P(B). So the probability of the conditional just is the probability of its consequent, which is clearly absurd — it makes the antecedent do no work whatsoever.

  (b) But (ii) says P(A→B) = P(B|A), so we get P(B) = P(B|A), i.e. P(A&B) = P(A)P(B): A and B are probabilistically independent. That contradicts how we chose them. So Lewis has shown that the equation P(A→B) = P(B|A) is flatly inconsistent with the axioms of probability — no probability function can obey both. That's what "triviality" means here: the equation only holds when it says nothing. One thing worth stressing is that the derivation never assumed anything about what makes A→B true, not even that it's truth-functional. All it used was that A→B has a probability and that the equation holds. So the result isn't an objection to the material-conditional analysis in particular, it's an objection to giving indicatives truth conditions at all.

  (c) Since the equation is inconsistent with probability theory, Lewis has to give up (ii) rather than (i) — you can't abandon logic, but you can abandon a thesis about conditionals. His positive view is that "if A, B" is really the material conditional ¬A ∨ B, so indicatives are straightforwardly true or false, and are typically true whenever A is false. The triviality result is then a reductio that pushes you back to the truth-functional analysis. The leftover puzzle — why "if A, B" seems unassertable when we know ¬A, but fine when we merely think A is unlikely — Lewis handles pragmatically: we only assert a conditional when we have some independent reason to think there's a connection between A and B, so the assertability conditions come out stricter than the truth conditions, and that's why our probability judgements about indicatives track P(B|A) even though that isn't what they mean.

  (d) The derivation obviously depends on (i). If A→B weren't a sentence of L it wouldn't have a probability and step (a) couldn't even be written down. The "for every conditionalization" clause in (ii) is a technical convenience, a way of making sure the equation isn't just a coincidence about one particular P; the contradiction is already latent in the single equation P(A→B) = P(B|A).
  ---

  What I need from you: a mark out of 25 with a part-by-part breakdown (a through d), and the specific margin comments that justify each deduction, phrased so I could defend them if she appeals. For every part, say what she got right and what's wrong or unsupported — including the moves that read fine on a first pass and only fall apart if you slow down. If two of her claims are in tension with each other, tell me which parts that should cost her and whether it's the kind of thing worth a comment or just a deduction. And if there's anywhere I'd be wrong to give credit that looks like it deserves some, flag that too. Don't soften it and don't pile on; I just want the assessment to be accurate. No reading list, please — I don't have time to go read anything before Thursday.
