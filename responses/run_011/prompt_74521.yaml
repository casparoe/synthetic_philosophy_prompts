answer: |-
  # The Authenticity Sorter: A Decision Instrument

  **Instructions:** Start at **Q1**. Answer based on your immediate intuition about the *case*, not the theory you think you hold. Follow the branch. Record your Leaf ID at the end.

  **The Scenario:** You have loved a painting for years. It is conclusively proven to be a forgery. It is perceptually indistinguishable from the original *now*.

  ---

  ### Q1: The Identity Check
  If the museum swapped this canvas for the verified original tomorrow, would you say you are now viewing a **different work of art**, or just a **better specimen of the same work**?
  *   **Different Work:** Go to Q2.
  *   **Same Work:** Go to Q4.

  ### Q2: The Ontology Check (Historicist/Deflationary Branch)
  Is the work defined by the specific agent/moment who indicated it, or is "forgery" simply a mislabeling of a decorative object that never carried that weight?
  *   **Specific Agent/Moment:** Go to Q3.
  *   **Mislabeling/Decorative:** **Leaf D (Deflationary)**.

  ### Q3: The Structure Check
  If the forger (Vess) had painted this exact image as an original invention, would it be a *different work* than the one she forged?
  *   **Yes, different work:** **Leaf H (Historicist)**.
  *   **No, same work:** *Return to Q4 (You are not a Historicist).*

  ### Q4: The Perception Bet (Goodman Branch)
  Do you believe that, with enough training, you *could* eventually see a visual difference between this forgery and the original, or are they permanently identical to human perception?
  *   **Could see difference:** **Leaf G (Goodman)**.
  *   **Permanently identical:** Go to Q5.

  ### Q5: The Supervenience Check (Look-is-all Branch)
  If you could magically erase the knowledge of the forgery from your mind permanently, would the painting's value return to 100% of its original worth?
  *   **Yes, 100%:** Go to Q6.
  *   **No, value is lost:** Go to Q7.

  ### Q6: The Case Vess Check
  Vess (the forger) serves time, paints under her own name (honestly), and her new work is worse. Collectors keep her forgeries on the wall as "Anonymous, after X," and prices hold. Is this outcome *correct*?
  *   **Yes, prices/love should hold:** **Leaf L (Look-is-all)**.
  *   **No, something is still wrong:** Go to Q7.

  ### Q7: The Victim Check (Fraud Branch)
  Is the injury primarily to *your* aesthetic experience, or to the *external* record (market, history, credit)?
  *   **External Record:** Go to Q8.
  *   **My Experience:** Go to Q9.

  ### Q8: The Case System Check
  A system produces canvases in the manner of a living painter; she knows, blesses it, and signs the stretcher. Is this a **forgery**, a **collaboration**, or a **third thing**?
  *   **Collaboration/Third Thing:** **Leaf F (Fraud-on-Others)**.
  *   **Forgery:** Go to Q9.

  ### Q9: The Value Split (Dutton/Achievement Branch)
  Can you consistently call this a **"beautiful object"** but a **"failed artwork"**?
  *   **Yes:** Go to Q10.
  *   **No (Value is unified):** **Leaf A (Achievement)**.

  ### Q10: The Domain Check
  Does this verdict (Beautiful Object/Failed Artwork) carry over unchanged to **music performances**, **fiction**, and **software code**?
  *   **Yes, same rules:** **Leaf Dt (Dutton)**.
  *   **No, art is unique:** **Leaf U1 (Unnamed)**.

  ---

  ### The Leaves (Positions)

  **Leaf L: Look-is-all-there-is**
  *   **Verdict:** Admiration was **not misplaced**.
  *   **Claim:** Aesthetic properties supervene on the physical object. History is irrelevant to value.
  *   **Case Routing:** *Vess:* Prices holding is correct. *System:* Collaboration is irrelevant; look is all. *Dud/Forge:* The superb forgery is the better artwork.

  **Leaf G: Goodman (Training Device)**
  *   **Verdict:** Admiration was **provisionally misplaced**.
  *   **Claim:** Present indistinguishability is contingent. The forgery is a training device; we *will* learn to see the difference.
  *   **Case Routing:** *Vess:* Her new work is worse because we can now see the lack of history in it. *System:* If we can't tell, we aren't looking hard enough.

  **Leaf Dt: Dutton (Artistic vs. Aesthetic)**
  *   **Verdict:** Admiration was **split**.
  *   **Claim:** Aesthetic value (experience) remains; Artistic value (performance) is lost.
  *   **Case Routing:** *Vess:* Collectors are right to love the picture, wrong to value the art. *System:* It is a collaboration aesthetically, but artistically void if she didn't paint it. *Dud/Forge:* The dud is a good *something* (historical artifact); the forge is a good *non-something*.

  **Leaf A: Achievement View**
  *   **Verdict:** Admiration was **misplaced**.
  *   **Claim:** Value lies in the risk/solution. No risk, no value. Aesthetic and Artistic value are unified.
  *   **Case Routing:** *Vess:* Prices holding is a market failure. *System:* Signing is irrelevant; no risk was taken on the canvas. *Dud/Forge:* The forgery is valueless regardless of look.

  **Leaf F: Fraud-on-Others**
  *   **Verdict:** Admiration was **personally intact, socially misplaced**.
  *   **Claim:** Your experience is fine; the lie harms the market/history/artist.
  *   **Case Routing:** *Vess:* If prices hold and no one is lied to anymore, the harm is gone. *System:* Consent removes the fraud. *Dud/Forge:* The forgery is a fraud on the record, not on you.

  **Leaf H: Historicist (Indicated Structure)**
  *   **Verdict:** Admiration was **category confused**.
  *   **Claim:** A work is an indicated structure (time/agent). The forgery is a *different work*, not a bad version of the original.
  *   **Case Routing:** *Vess:* Her new work is a different work, so comparison is moot. *System:* If she signs/indicates it, it *is* her work (collaboration). *Dud/Forge:* Incomparable; they are different works.

  **Leaf D: Deflationary**
  *   **Verdict:** Admiration was **misdirected**.
  *   **Claim:** "The painting" was never the sort of thing that could be forged (e.g., it's purely decorative, or the concept of 'work' is flawed).
  *   **Case Routing:** *Vess:* Prices are irrational. *System:* The question of forgery doesn't apply. *Dud/Forge:* Both are just objects.

  **Leaf U1: Unnamed (The Medium-Specific Split)**
  *   **Verdict:** Admiration was **split (Art-Specific)**.
  *   **Claim:** Dutton's split applies to painting but not software/music (or vice versa).
  *   **Status:** **Coherent but Empty.**
  *   **Why:** Nobody defends this because it requires an arbitrary ontology of media that no one has successfully motivated without collapsing into general skepticism or general realism.

  **Leaf U2: Unnamed (The Aesthetic Authenticity)**
  *   **Verdict:** Admiration was **corrected upward**.
  *   **Claim:** The forgery is aesthetically superior to the original, and therefore *more* authentic to the "spirit" of the art.
  *   **Status:** **Coherent but Empty.**
  *   **Why:** Attractive to romantics, but philosophically unstable; it redefines "authenticity" so loosely it loses its discriminatory power in the debate.

  ---

  ### Convergence Flag

  **The Achievement (Leaf A) vs. Historicist (Leaf H) Problem**
  *   **Convergence:** Both leaves yield the same practical verdict: *"Your admiration was misplaced; the object is not what you thought."* In a seminar discussion, proponents of both views will vote the same way on almost every case.
  *   **Divergence:** They disagree on *ontology*. Achievement says it is the **same object** with **less value**. Historicist says it is a **different object** entirely.
  *   **Instrument Defect:** This is **not a defect in the tree**. The tree separates them at Q1. However, be aware that in practice, students often slide between "It's not the same work" and "It's not as good" without realizing they are making an ontological commitment. If a student answers Q1 "Same Work" but Q9 "No Value," they are an Achievement theorist. If they answer Q1 "Different Work," they are Historicist.
  *   **Advice:** Force them to defend Q1. If they waffle, they are conflating the two positions.

  ### Case Threading Notes (For the TA)

  1.  **Vess (The Rehabilitated Forger):**
      *   **Leaf L (Look-is-all):** Validates the collectors. Prices *should* hold.
      *   **Leaf F (Fraud-on-Others):** Validates the collectors *only if* the deception stops. If they still think it's by the Old Master, it's fraud. If labeled "After," it's fine.
      *   **Leaf A (Achievement):** Condemns the prices. The canvas still lacks the original risk.
      *   **Missed Node?** If a student says "Prices hold because Vess is now famous," they are valuing the *Forger's* achievement, not the *Imitated Artist's*. This routes to **Leaf A** but shifts the "Achievement" target.

  2.  **System (The Consented Forgery):**
      *   **Leaf H (Historicist):** If the artist signs/indicates it, it *is* their work. Not a forgery.
      *   **Leaf A (Achievement):** Still a forgery (or void). The artist didn't solve the problems on *this* canvas.
      *   **Leaf F (Fraud-on-Others):** Consent removes the fraud. It is a collaboration.
      *   **Provenance Node:** This case tests whether "History of Production" means "Physical Causation" (Leaf A) or "Legal/Intentional Authorization" (Leaf H/F).

  3.  **Dud vs. Forgery (The Reverse):**
      *   **Leaf L (Look-is-all):** The forgery is the "good something." The original is a "bad something."
      *   **Leaf H (Historicist):** You cannot compare them. One is a "good different-work," one is a "bad original-work."
      *   **Leaf Dt (Dutton):** The forgery is a "good non-something" (aesthetically) and the original is a "bad something" (artistically).
      *   **Intuition Check:** If the student says "The forgery is better, but I still prefer the original," they are likely **Leaf Dt** or **Leaf F**. If they say "The forgery is better, period," they are **Leaf L**.
