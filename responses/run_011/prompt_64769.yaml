answer: |-
  ### 1. Point Allocation

  *   **(a) 3 / 6 points**
  *   **(b) 7 / 8 points**
  *   **(c) 4 / 8 points**
  *   **(d) 3 / 3 points**
  *   **Total: 17 / 25 points**

  ---

  ### 2. Margin Comments

  **(a) Margin Comment:**
  > You correctly identify Sufficiency and the violation of Separation. However, you explicitly state the findings tell us "nothing about base rates," which is incorrect; equal PPV combined with unequal FPR mathematically implies unequal base rates (Black base rate must be higher). Also, be careful distinguishing score calibration from decision outcomes—a calibrated score with a single cutoff does *not* guarantee equal FPRs if score distributions differ.

  **(b) Margin Comment:**
  > Strong summary of the trade-off. To secure full points, be more precise than "degenerate cases": specify that the impossibility vanishes only if base rates are equal or if the predictor is perfect (error = 0). Otherwise, the logic is sound.

  **(c) Margin Comment:**
  > This contains a critical error. Group-specific cutoffs satisfy Separation (Equalized Odds) but they **violate** Sufficiency (Calibration) at the decision level. You cannot "preserve calibration" while applying different thresholds to different groups; the decision no longer maps to the same probability of risk across groups. The impossibility is not "dissolved"; you have simply chosen to prioritize Separation over Sufficiency.

  **(d) Margin Comment:**
  > Correct. You accurately identify that the constraint is structural/definitional, not empirical. Better accuracy reduces overall error but does not remove the incompatibility between fairness metrics given base rate differences.

  ---

  ### 3. Error Analysis & Severity Ranking

  **Error 1: Claiming the findings imply nothing about base rates (Part a).**
  *   **Correct Claim:** If Predictive Parity (Sufficiency) holds and False Positive Rates differ, Base Rates *must* differ. (Specifically, the group with the higher FPR must have a higher base rate to maintain the same PPV).
  *   **Severity:** **High.** This is a direct failure to answer a specific sub-question of the prompt ("what the two findings together tell you about base rates"). It indicates a lack of understanding of the Bayesian relationship between these metrics.
  *   **Load-bearing:** Yes. Without this inference, the student misses the underlying driver of the impossibility theorem discussed in part (b).

  **Error 2: Claiming group-specific cutoffs preserve calibration (Part c).**
  *   **Correct Claim:** Post-processing (Hardt et al.) preserves the *score's* calibration, but the resulting *binary classifier* violates Sufficiency. A decision rule with group-specific thresholds is not calibrated across groups (a "high risk" decision means different things in different groups).
  *   **Severity:** **Critical.** This fundamentally misunderstands the impossibility theorem. The theorem states you cannot have Separation and Sufficiency simultaneously (given unequal base rates). Claiming you can have both "dissolves" the mathematical constraint rather than navigating it.
  *   **Load-bearing:** Yes. This error invalidates the conclusion that the theorem is "about the arbitrary decision to use one cutoff." The theorem is about the incompatibility of the metrics, not the cutoffs.

  **Error 3: Claiming the vendor's calibration and coalition's findings are contradictory (Part a).**
  *   **Correct Claim:** They are not necessarily contradictory. A score can be calibrated (P(Y=1|Score) is consistent) while yielding unequal FPRs under a single cutoff if the score distributions differ between groups.
  *   **Severity:** **Medium.** This shows confusion between *score* calibration and *error rate* parity.
  *   **Load-bearing:** Partially. It weakens the analysis in (a) but is less damaging than the base rate error.

  **Error 4: Claiming the impossibility is "dissolved" rather than traded off (Part c).**
  *   **Correct Claim:** The impossibility remains; the county is simply choosing to satisfy Separation at the expense of Sufficiency.
  *   **Severity:** **Critical.** (Linked to Error 2). This is a philosophical misinterpretation of the mathematical result.
  *   **Load-bearing:** Yes. It leads to the incorrect conclusion that the technical constraint was illusory.

  **Duplicate Errors:**
  *   Error 2 and Error 4 are the same conceptual mistake manifesting twice: the belief that changing cutoffs allows you to satisfy all fairness criteria simultaneously.

  ---

  ### 4. Full-Credit Comparison

  **Part (a):** A full-credit answer would have explicitly derived that **base rates must be unequal** (specifically, higher for the group with the higher FPR) to satisfy the condition of equal PPV. It would also have clarified that score calibration does not imply equal error rates under a single cutoff.

  **Part (c):** A full-credit answer would have acknowledged that while group-specific cutoffs achieve **Separation** (Equalized Odds), they do so by **sacrificing Sufficiency** (the decision is no longer calibrated across groups). It would characterize this as **relocating** the impossibility (choosing which axiom to violate) rather than dissolving it.
