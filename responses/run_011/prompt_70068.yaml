          4.  Determine what's left standing (Can the character say this without lying/making Leibniz look like a monster? Is there a better analogy?).
      *   **Constraints:** British English, no reading list/citations at the end, focus on the argument.

  2.  **Deconstruct the Leibnizian Framework:**
      *   *Key Concept:* The Best of All Possible Worlds.
      *   *Key Mechanism:* God's intellect surveys all possible combinations of compossible substances. God's will chooses the best based on the principle of sufficient reason and perfection (variety + order).
      *   *Key Constraint:* God does not create sin directly; sin arises from the inherent limitation of created beings (metaphysical evil leading to moral evil).
