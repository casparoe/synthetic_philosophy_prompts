          *   *Wait, the prompt asks for a better one if this one fails.* The "Architect" or "Legislator" is more Leibnizian. But for a layperson? The "Tapestry" is the classic theodicy image (Boethius/Aquinas too). But the "Novelist" is specifically about *possible worlds*.
          *   *Let's look at the "City" analogy.* A ruler allows crime to preserve freedom? Hard to comfort with that.
