answer: |-
  ### Adjudication of Moves

  **1. Ilan: "Ideas are not the sort of thing that can be stolen... Nothing was transferred and nothing was diminished."**
  **Rating:** Clearly Mistaken.
  **Justification:** While metaphysically true that ideas are non-rivalrous, academic norms treat priority as a rivalrous good; by publishing first, he exhausted the novelty value of her claim, which is the actual asset.
  **Note:** Rhetorically effective but logically empty in this context; it relies on a definition of "theft" imported from physical property law that does not govern scientific credit.

  **2. Nadia: "What she lost was not the idea but the position of having had it first... recognition, the priority, the claim on the next several years of work."**
  **Rating:** Clearly Right.
  **Justification:** This accurately identifies the currency of research: priority establishes the right to define the subsequent discourse and secure funding.

  **3. Ilan: "On her view every case of learning from a colleague would be a case of theft... nobody in that room regards reading one another's drafts as predatory."**
  **Rating:** Partly Right.
  **Justification:** He correctly identifies that working groups rely on knowledge transfer, but falsely equates *learning* (internal use) with *publishing* (external claim) without attribution.

  **4. Nadia: "He had not built on her work, he had displaced it... duties of confidence bind people who receive something in trust."**
  **Rating:** Clearly Right.
  **Justification:** Displacement is the precise mechanism of harm in priority disputes, and professional confidentiality creates a duty distinct from property rights.

  **5. Ilan: "If the duty arises from the relationship rather than from the idea, then what he broke was something like a promise, not a property right."**
  **Rating:** Clearly Right.
  **Justification:** This is the most legally precise move in the exchange; it correctly categorizes the violation as a breach of confidence rather than conversion of property.

  **6. Ilan: "One cannot own what was going to happen anyway."**
  **Rating:** Clearly Mistaken.
  **Justification:** The "multiple discovery" hypothesis is irrelevant to the actual causal history; he used her draft to accelerate his timeline, which is the actionable offense.
  **Note:** Rhetorically effective but logically empty; it attempts to dissolve the specific act of appropriation into a general historical inevitability.

  **7. Nadia: "Once you have seen a solution your memory of what you were on the verge of thinking reorganizes itself around it."**
  **Rating:** Clearly Right.
  **Justification:** This aligns with established cognitive science regarding cryptomnesia and the impossibility of fully isolating prior independent thought after exposure.

  **8. Ilan: "That was an argument that she cannot tell the difference, not an argument that he is on the wrong side of it."**
  **Rating:** Partly Right.
  **Justification:** He is correct that subjective experience is hard to adjudicate, but wrong to imply that the timeline of exposure does not create a presumption of influence.

  **9. Nadia: "If a wrong requires that the victim be deprived of a thing, plagiarism is not a wrong either."**
  **Rating:** Clearly Right.
  **Justification:** This *reductio ad absurdum* successfully dismantles Ilan's "deprivation test" from Move 1 by citing a universally accepted academic wrong that fits the same non-rivalrous profile.

  **10. Ilan: "Plagiarism is a wrong about misrepresentation... with the reader rather than the author as the injured party."**
  **Rating:** Partly Right.
  **Justification:** He correctly identifies misrepresentation as a core component of plagiarism, but wrongly excludes the author from the injured parties; loss of credit is a direct harm to the originator.

  **11. Ilan: "The name was the entire point, since it determines what is owed and to whom."**
  **Rating:** Clearly Right.
  **Justification:** Institutional remedies are tied to specific classifications (e.g., misconduct vs. dispute); Nadia's dismissal of this procedural reality undermines her own bid for restitution.

  ***

  ### Categorization of the Wrong

  What Ilan did is **Misappropriation via Breach of Confidential Trust.**

  It is not **Theft** (Move 1), because the technique was not removed from Nadia's possession. It is not merely **Misrepresentation** (Move 10), because the harm is not limited to reader deception; Nadia suffers a direct loss of professional capital. It is not simply **Plagiarism** in the textual sense, though it functions identically in the economy of credit.

  The core violation is that the working group created a **limited license**. By circulating the draft, Nadia granted the group a license to *critique and discuss*, not to *publish and claim*. Ilan exceeded the scope of that license. He converted privileged access into public priority. The remedy is not the retraction of the paper (as with theft of data), but a formal correction of the record (authorship or citation) that restores the priority claim to Nadia.

  ***

  ### The Shared Hidden Assumption

  Both Nadia and Ilan assume that **the informal norms of the working group were sufficient to govern high-stakes intellectual property.**

  Nadia assumes the norm was "sharing implies confidentiality and attribution." Ilan assumes the norm was "sharing implies communal building blocks." Neither will accept that **the group was structurally incapable of protecting what was shared within it.** They are arguing over the content of a contract that was never written and for which the setting was inadequate. They both treat the working group as a coherent normative community, when in reality it was a collection of individuals with competing incentives operating under ambiguous rules.

  **Implication for your venture:** Do not rely on shared understanding or group norms. If you share methods before publication, you must explicitly define the license (e.g., "for feedback only," "co-authorship required for use") in writing. Ambiguity favors the person who publishes first.
