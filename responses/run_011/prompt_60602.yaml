      *   *Objection 3 (The Philosopher):* "That's not a prediction." Voice: Phil Sci. Focus: Post-hoc rationalization, vagueness of "instability."
      *   *Objection 4 (The Grad Student):* "Where are the people?" Voice: Grad Student. Focus: Immiseration is lived experience, not a demographic curve.

      *Refining the Voices:*
      *   *Historian:* Needs to sound grounded in the archive. "My documents show..." "You're flattening..."
