      *   *Philosopher of Science:* Cares about confirmation bias, model robustness, what counts as "prediction." Will attack the Nature forecast (was it specific enough? was it post-hoc?).
      *   *Grad Students:* Care about agency, narrative, source criticism. Will attack the erasure of human experience and the "physics envy."

  3.  **Drafting the Objections (Iterative Process):**

      *   *Objection 1 (The Historian):* "You're erasing contingency." Voice: Ottomanist/French Fiscalist. Focus: Tax farming isn't a variable; it's a specific contract.
