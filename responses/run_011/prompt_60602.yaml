      *   *Philosopher:* Needs to sound epistemic. "Confirmatory power..." "Riskiness of the prediction..."

  4.  **Developing the Replies:**
      *   Must be 2 minutes spoken (approx. 250-300 words).
      *   Must acknowledge validity (concede) but pivot back to the structural argument.
      *   *Key Strategy:* SDT doesn't replace history; it provides the skeletal structure upon which the flesh of narrative hangs. It explains *why* the crisis happened then, even if it doesn't explain *how* it felt.

  5.  **Identifying Concessions & Non-Negotiables:**
      *   *Mandatory Concession:* Must admit that SDT cannot predict *specific events* (e.g., which king dies, which battle is lost). It predicts *structural instability*. If I claim I can predict the French Revolution's start date, I lose credibility.
