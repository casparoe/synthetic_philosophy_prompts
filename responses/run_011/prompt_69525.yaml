answer: |-
  ### Brainstorm: Where the Pressure Is vs. Where It's Rhetoric

  *   **Settled/Strong Ground:**
      *   **The Ramsey Critique:** It is widely accepted that Ramsey's 1926 critique dismantled Keynes's *logical* theory of probability as it stood. If she wants to keep "objective logical relations," she needs a modern surrogate, or she needs to admit she's doing subjective imprecise probability.
      *   **The "Lottery" Strawman:** Modern imprecise probability (IP) handles unknown urns (Ellsberg) formally. Retreating to "life isn't a lottery" ignores that IP *was built* to model non-lottery uncertainty. This is a rhetorical shield, not a technical defense.
      *   **Weight of Evidence:** Keynes defines weight ($V$) as the amount of relevant evidence, distinct from probability ($P$). It is settled that $V$ can increase while $P$ remains constant. It is *not* settled whether $V$ changes the rational action.

  *   **Contested/ Minefields (Flagged in Questions):**
      *   **Continuity:** Is the *Treatise on Probability* (1921) continuous with the *General Theory* (1936)? (O'Donnell says yes; Davidson says no). If she conflates them, she risks incoherence.
      *   **Ontological vs. Epistemic:** Is Keynesian uncertainty about the world being non-ergodic (Davidson) or about our logical relation to evidence being incomplete (Treatise)?
      *   **The Beauty Contest:** Is Chapter 12 about radical uncertainty or just higher-order beliefs (game theory)? Modern reconstructions often treat it as the latter; Keynesians insist on the former.
      *   **Decision Rules:** Keynes never specified a decision rule for low-weight scenarios. Does high weight license EU maximization while low weight licenses something else (e.g., Maximin)? This is interpretive guesswork.

  ***

  ### The Question Sequence

  **1. You distinguish the probability of a conclusion from the weight of the evidence supporting it.**
  *Hope:* Force her to define weight operationally, not just metaphorically.
  *Follow-up:* If weight increases but probability stays fixed, does a rational agent ever change her bet?

  **2. If weight doesn't change the bet, isn't it just epistemological scenery rather than a guide to conduct?**
  *Hope:* Corner her on whether weight has decision-theoretic teeth or is merely descriptive.

  **3. Modern imprecise probability models your view using sets of priors rather than logical relations.**
  *Hope:* Challenge the "Keynesian" branding; is this just Walley or Seidenfeld in period costume?
  *Follow-up:* If it is just sets of priors, how do you handle dilation without abandoning the project?

  **4. You reject the principle of indifference to avoid arbitrary equiprobability.**
  *Hope:* Expose the tension between avoiding arbitrariness and having enough structure to act.
  *Follow-up:* Without indifference, what prevents your relevance judgments from just becoming subjective priors in disguise?

  **5. Ramsey argued that objective logical probabilities require a queer faculty of intuition.**
  *Hope:* Press the epistemological cost of keeping Keynes's logical ontology post-Ramsey.
  *Follow-up:* If you drop the logical ontology, what anchors the constraints on rational belief?

  **6. In the beauty contest, agents guess what others think others will think.**
  *Hope:* Distinguish strategic interdependence from radical uncertainty. *(Note: Leans on contested reading of Chapter 12).*
  *Follow-up:* If it's just higher-order beliefs, doesn't game theory handle that without invoking unmeasurable uncertainty?

  **7. You argue convention stabilizes expectations when calculation fails.**
  *Hope:* Test whether convention is a failure of rationality or a rational shortcut.
  *Follow-up:* If it's a rational shortcut, isn't that just successful outsourcing of the calculation you say is impossible?

  **8. Some readers say Keynesian uncertainty is ontological, others say it's just incomplete evidence.**
  *Hope:* Force her to pick a lane on the non-ergodic vs. Treatise debate. *(Note: Leans on contested scholarship regarding continuity).*
  *Follow-up:* If it's just incomplete evidence, why can't we model that with standard Bayesian updating?

  **9. Your policy recommendations rely on intervention to correct market failures.**
  *Hope:* Check for consistency between her critique of precision and the precision required for policy design.
  *Follow-up:* Doesn't cost-benefit analysis require the exact expected value calculations you claim are illegitimate?

  **10. Keynes's ethics involved organic unities and probability as a guide to right action.**
  *Hope:* Bring in the Moorean angle; does low weight create a duty of caution?
  *Follow-up:* If caution is a duty, doesn't that require a metric to weigh caution against potential gain?

  ***

  ### Strategy Note on the "Lottery" Tic
  When she deploys the "real business decisions aren't lottery draws" line, she is implying that formalism requires known frequencies. Your follow-ups (specifically on Q3 and Q8) are designed to point out that **Imprecise Probability** exists precisely to model non-lottery scenarios formally. If she retreats to the lottery line after Q3, she is admitting she hasn't engaged with the actual formal literature she claims to supersede. Don't let her treat "formalism" and "frequentism" as synonyms.
