          *   Example: 19th-century railway. One good book stops the buck.

      *   **The Coherentist Reality (The "Web" Rule):**
          *   Policy: WP:NOR (No Original Research) and WP:UNDUE (Undue Weight).
          *   Mechanism: You can't synthesize A + B = C. C must be published. This implies truth is what the *system* of sources says, not what logic dictates from sources.
          *   Circular Reference Loop: The user mentioned sources citing WP. This is pure coherentism (mutual support), though forbidden, it happens.
          *   Consensus: When sources conflict, we weigh them. This is coherence (fitting the majority view).

      *   **The Infinitist Undertow (The "Process" Rule):**
          *   Policy: "Verifiability, not Truth."
          *   Mechanism: We don't claim to know reality, only that it's *verifiable*. This admits the chain could go on forever.
          *   BLP (Biographies of Living Persons): High scrutiny. The chain must be robust.
          *   Medicine (WP:MEDRS): Requires systematic reviews/meta-analyses. This pushes the "foundation" further back (higher up the chain) than history.

      *   **Underdetermination (Where Epistemologies Converge):**
