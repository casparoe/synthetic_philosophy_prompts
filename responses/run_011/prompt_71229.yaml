answer: |-
  This is a profound question that cuts to the bone of social epistemology. You have identified Agrippa's Trilemma (foundationalism, coherentism, infinitism) playing out in real-time within a massive collaborative knowledge project.

  After analyzing the policies (WP:V, WP:NOR, WP:RS, WP:BLP, WP:MEDRS) and the actual practice of editing, here is the reconstruction of Wikipedia's epistemological apparatus.

  ### The Dominant Theory: Institutional Foundationalism with Coherentist Safeguards

  Officially, Wikipedia operates on **Institutional Foundationalism**. The "reliable published source" is the foundational stopper. The regress of "how do you know that?" is designed to terminate at the point of publication in a vetted outlet. The editor is not a knower; the editor is a courier. The epistemic authority resides entirely in the institution that published the claim (the *New York Times*, *Nature*, Oxford University Press).

  However, the *practice* reveals a **Coherentist** web holding that foundation up, and the *limitations* admit an **Infinitist** reality.

  #### 1. Where the Rules Assume Foundationalism (The Stopper)
  The core policy **WP:Verifiability** ("Verifiability, not truth") is a foundationalist move. It asserts that the justification for a belief (an article claim) is its causal link to a basic belief (the published source).
  *   **The 19th-Century Railway:** As you noted, a single decent monograph stops the regress. We treat the historian's assertion as a "basic belief" for the purpose of the encyclopedia. We do not check the archives; we trust the publisher.
  *   **The Black Box of Peer Review:** You mentioned we never look inside the authority of fact-checking desks. This is essential to the foundationalist illusion. To ask "Why is *Nature* reliable?" is considered outside the scope of Wikipedia. *Nature* is a brute fact of the epistemological landscape. If we interrogated the peer-review process itself, the foundation would dissolve into a request for further sources about *Nature*'s reliability, triggering the regress.

  #### 2. Where the Rules Assume Coherentism (The Web)
  **WP:No Original Research (NOR)** is the strongest evidence for coherentism. Specifically, the ban on synthesis.
  *   **The Synthesis Ban:** If Source A says "X is true" and Source B says "Y is true," and logic dictates "Therefore Z," you cannot publish Z unless Source C says "Z." A foundationalist might argue that if A and B are secure foundations, Z is securely founded. Wikipedia disagrees. Z is only justified if it coheres with the existing web of published literature. Truth is not derived from logic applied to foundations; it is derived from membership in the set of published claims.
  *   **The Citation Loop:** You mentioned sources rehashing each other or citing us. This is the coherentist nightmare (circular justification) haunting the system. When Source A cites Source B, and Source B cites Source A (or Wikipedia), the foundation has rotted, and the structure is being held up purely by mutual coherence. The policy forbids this, but the practice tolerates it until a "citation needed" tag exposes the circularity.
  *   **Undue Weight:** When we decide a fringe theory doesn't belong, we aren't saying it's *false* (foundationalist judgment); we are saying it doesn't cohere with the majority of the literature (coherentist judgment).

  #### 3. Where the Rules Assume Infinitism (The Chain)
  **WP:BLP (Biographies of Living Persons)** and **WP:MEDRS (Medical Sources)** reveal an infinitist anxiety.
  *   **Graded Foundations:** In history, one book is a foundation. In medicine, a single study is *not* a foundation. You need a systematic review or meta-analysis. This implies the chain of justification must go *further* for high-stakes claims. The "stopper" is movable.
  *   **Provisionality:** The "Verifiability, not truth" tagline is secretly infinitist. It admits we never reach the "Truth," only the next link in the chain of verification. If a source is retracted, the foundation vanishes, and the claim must fall. This acknowledges that the "foundation" is actually just a temporary link in an infinite chain of scrutiny.

  ### The Underdetermined Zones

  There are specific rules where the epistemological justification is ambiguous because multiple theories license the exact same constraint. This is where the rule proves nothing about the underlying philosophy.

  **1. The Ban on Self-Published Sources**
  *   **Foundationalist view:** Self-published works lack the institutional vetting required to be a "basic belief."
  *   **Coherentist view:** Self-published works exist outside the web of mutual accountability and cross-referencing that characterizes the literature.
  *   **Infinitist view:** Self-published works usually lack the bibliographic trail required to trace the justification back further.
  *   *Result:* The rule is identical, but the reason varies. This makes the rule robust but epistemologically opaque.

  **2. "Citation Needed" Tags**
  *   **Foundationalist interpretation:** "You have asserted a basic belief without showing the foundation."
  *   **Coherentist interpretation:** "This claim is isolated from the web of consensus; link it to the network."
  *   *Result:* Editors use the tag for both reasons interchangeably. Sometimes they want proof of truth (foundation); sometimes they want proof of notability/consensus (coherence).

  **3. The "Reliable Source" Noticeboard**
  *   When editors debate if a specific outlet (e.g., *The Grayzone* or *Breitbart*) is reliable, they oscillate between foundationalist arguments ("They fact-check") and coherentist arguments ("They are not cited by other reliable sources"). The process underdetermines which metric actually decides the outcome.

  ### What Would Change My Mind

  To flip my reconstruction from **Institutional Foundationalism** to another model, specific features of the practice would need to change or be described differently.

  **1. Flipping to Pure Coherentism:**
  *   **The Feature:** If Wikipedia explicitly allowed **logical synthesis** provided the premises were cited.
  *   **The Shift:** If the policy changed to say, "If Source A says X and Source B says Y, and X+Y logically entails Z, you may assert Z," Wikipedia would become a coherentist engine. It would prioritize logical consistency within the web of citations over the explicit testimony of the sources. Currently, the ban on synthesis forces us to treat the *literature* as the knower, not the *editors*. Allowing synthesis would make the editors (and their logic) part of the justification structure.

  **2. Flipping to Pure Foundationalism:**
  *   **The Feature:** If Wikipedia allowed **expert verification** without publication.
  *   **The Shift:** If the project allowed credentialed editors (e.g., a PhD in the field) to assert facts based on their own knowledge or primary data, provided they signed their name, it would become truly foundationalist. The "foundation" would be the expert's direct access to reality, bypassing the institutional intermediary of publication. The current refusal to do this (even with OTRS permissions for unpublished data) confirms that the *institution* is the foundation, not the *evidence*.

  **3. Flipping to Infinitism:**
  *   **The Feature:** If citations had **expiration dates** or **confidence intervals**.
  *   **The Shift:** If articles displayed the "half-life" of a citation (e.g., "This medical claim is based on a 2015 study; confidence degrades after 5 years"), Wikipedia would acknowledge the infinite regress of scrutiny. It would admit that no source is a permanent stopper. Currently, a source remains "reliable" until retracted, implying a static foundational status rather than a decaying link in a chain.

  ### Where My Reconstruction Is Likely Wrong

  I suspect I am over-intellectualizing the **pragmatism** of the system.

  My reconstruction assumes Wikipedia is trying to solve the problem of *Justification*. It is possible that Wikipedia is not an epistemological project at all, but a **legal and reputational risk management system**.

  *   **The "Liability" Theory:** The "Reliable Source" rule may not be about truth or justification, but about **defensibility**. We cite *The New York Times* not because it is philosophically foundational, but because if we get sued for libel, *The New York Times* provides a legal shield.
  *   **The "Consensus" Theory:** The "No Synthesis" rule may not be about coherentism, but about **conflict avoidance**. Synthesis requires interpretation, and interpretation leads to edit wars. Banning synthesis bans interpretation.

  If the primary driver is liability and conflict avoidance, then the epistemological structure is merely a **post-hoc rationalization** for administrative rules. In that case, asking if it's foundationalist or coherentist is a category error; it is **Bureaucratic Pragmatism**. The "loop" you described isn't an epistemological failure; it's a feature of a system designed to replicate existing public discourse, regardless of whether that discourse is itself well-founded.

  If you showed me data that sourcing policies were tightened *only* after legal threats or high-profile PR scandals, and not after epistemological debates, I would abandon the epistemological reconstruction entirely in favor of the legalistic one.
