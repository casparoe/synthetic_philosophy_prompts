answer: |-
  This is a sharp read of your seminar's dialectic. You are correct that your professor's first five cases are systematically confounded: **Juridical Standing**, **Public Agency**, and **Consequential Risk** have never been pulled apart. In Cases 1–3, all three align to permit resistance; in Cases 4–5, all three align to forbid it. Case 6 is designed to break that alignment.

  Here is the breakdown of the logic, the prediction, and the lever you can use to test it.

  ### 1. The Verdict on Case 6
  **Verdict: Condemn.**

  **Reasoning:** Despite the Estates being a "public body" (which usually signals approval, as in Cases 1 and 3), your professor's reasoning in Case 4 is the smoking gun. She explicitly stated that the *outcome* (civil war) was "almost beside the point" compared to the *standing* of the actor.

  In Case 6, the standing is defective. In Case 3 (Elective), she justified resistance because the Estates "gave him the crown." In Case 6 (Hereditary), the fundamental law explicitly limits the Estates to *acclamation*, not *election*. Juridically, they did not give the crown, so they lack the competence to take it back. They are acting *ultra vires* (beyond their powers). To your professor, a public body acting without specific jurisdiction is functionally identical to a private noble acting without any: both are usurping a judgment they do not possess. The prediction of civil war (the "greater evil" Aquinas warns against in *De Regno*) seals the condemnation, but the lack of juridical competence is the primary barrier.

  ### 2. The Underlying Rule (The Professor's Algorithm)
  Based on her specific emphases, she is operating on a **Principle of Juridical Competence**, not merely Public Authority or Consequentialism.

  **The Rule:** *Resistance to a ruler is licit only if the resisting agent possesses superior or constituting jurisdiction over that ruler, such that the removal is an act of justice rather than an act of violence.*

  *   **Why it fits Cases 1–3:**
      *   Case 1: Guild Council has jurisdiction over a usurper (who has *no* jurisdiction).
      *   Case 2: Overlord has superior jurisdiction over a vassal.
      *   Case 3: Estates have constituting jurisdiction over an elective king.
  *   **Why it fits Cases 4–5:**
      *   Case 4 & 5: Private persons have *no* jurisdiction over a legitimate king.
  *   **Why it fits Case 6:**
      *   The Estates lack constituting jurisdiction (hereditary law) and have no superior (no emperor/pope). They are attempting to create jurisdiction they do not hold.

  ### 3. Alternative Candidate Rules
  Here are two other rules that fit the first five cases perfectly but diverge on Case 6 (or require different handling).

  **Alternative A: The "Corporate Mask" Rule (Public vs. Private)**
  *   **The Rule:** *Resistance is licit if undertaken by a corporate public body representing the community; it is illicit if undertaken by private hands.*
  *   **Fit:** Explains 1, 2, 3 (Public/Corporate) vs. 4, 5 (Private).
  *   **Prediction for Case 6:** **Approve.** The Estates are a corporate public body. Under this rule, the specific limits of their legal charter (acclaim vs. choose) matter less than their status as the "body politic."
  *   **Weakness:** It struggles with Case 2 (an Overlord is a single person, not necessarily a "corporate body," though she framed it as "jurisdiction").

  **Alternative B: The "Aquinas Threshold" Rule (Pure Consequentialism)**
  *   **The Rule:** *Resistance is licit only if the tyranny is worse than the disturbance caused by removing it.*
  *   **Fit:** Explains 1, 2, 3 (Peaceful/Good) vs. 4, 5 (War/Bad).
  *   **Prediction for Case 6:** **Condemn.** The prompt states the civil war will kill more people than the tyranny.
  *   **Weakness:** This contradicts her Case 4 comment that the outcome was "beside the point." If she were a pure consequentialist, she would have said, "If the noble had succeeded peacefully, it might have been okay." She didn't; she focused on *standing*.

  ### 4. The Decisive Case (Case 7)
  To force her rules apart, you need a case where **Public Agency** is present, but **Juridical Competence** is absent, while **Consequences** are good. This isolates Jurisdiction from the other variables.

  **The Case:**
  > A hereditary kingdom (undisputed title, law limits Estates to acclamation). The King is tyrannical. The Estates lawfully convene and depose him. However, the King's army immediately defects to the Estates, the King flees abroad without a fight, and his brother is installed peacefully. No civil war occurs; the transition is bloodless and the common good is immediately restored.

  **Why this forces the split:**
  *   **If she Approves:** She is following the **Corporate Mask Rule**. The public nature of the Estates and the good outcome outweigh the lack of strict juridical competence.
  *   **If she Condemns:** She is following the **Juridical Competence Rule** (her likely actual view). Even if peaceful, and even if public, the Estates had no *right* to depose a hereditary king under that fundamental law. They committed a legal usurpation, even if the result was happy.
  *   **The "Tell":** Listen for whether she says, "Thank God it went well, but they had no right to do it" (Condemn/Competence) vs. "The community spoke through its body and secured the peace" (Approve/Corporate).

  ### 5. The Confounding Analysis
  You are right to suspect systematic confounding. Here is the feature matrix of her seminar so far:

  | Case | Actor | Jurisdiction | Title Type | Outcome | Verdict |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1** | Public (Guild) | **Yes** (vs. Usurper) | None (Usurper) | Peace | **Approve** |
  | **2** | Superior (Lord) | **Yes** (Superior) | Vassal | Peace | **Approve** |
  | **3** | Public (Estates) | **Yes** (Constituting) | Elective | Peace | **Approve** |
  | **4** | Private (Noble) | **No** | Hereditary | War | **Condemn** |
  | **5** | Private (Citizen)| **No** | Hereditary | War | **Condemn** |
  | **6** | **Public (Estates)**| **No** (Acclaim only) | **Hereditary** | **War** | **?** |

  **The Feature Doing the Work:** **Jurisdiction.**
  Notice that "Public vs. Private" is not the deciding factor, because Case 2 (Overlord) is approved despite being a single ruler, and Case 6 (Estates) will likely be condemned despite being a corporate body. The deciding factor is whether the agent has a *juridical hook* (superiority, constituting power, or lack of title in the target).

  **The Feature Along for the Ride:** **Consequences.**
  She explicitly demoted this in Case 4. While Aquinas cares about consequences, your professor is using consequences as a *tie-breaker* or a *warning*, not the primary rule. If the jurisdiction is missing (Case 4), the bad outcome is secondary. If the jurisdiction is present (Cases 1–3), the good outcome confirms the justice.

  **Strategy for Seminar:**
  When you present Case 7, frame it carefully: *"Professor, if the Estates act without the legal right to depose (hereditary law), but they do so as a public body and the transition is bloodless... does the lack of legal jurisdiction make the act illicit regardless of the peace, or does the public character of the body cure the defect?"*

  That question forces her to admit whether she is teaching **Law** (Jurisdiction) or **Politics** (Order/Peace). Given her Case 4 remark, she's teaching Law.
