answer: |-
  Here is the ranking, defended against your criteria (downstream dependence, solo-feasibility, action-guidingness), followed by the mapping of overlaps and the triggers that would reshuffle this order.

  ### The Ranking

  **1. The Synthesis: Formalize the Mapping (#1) *using* Overinclusion (#3) as the Stress Test**
  **2. The Dissolution Move (#5)**
  **3. The Channel-Capacity Version (#2)**
  **4. Interpretability-First (#4) — DROP**

  ---

  ### Defense of the Ranking

  #### 1. The Synthesis (#1 + #3)
  **Why it wins:** This is the only line that satisfies all three of your constraints simultaneously.
  *   **Downstream Dependence:** High. The field is currently stuck in a loop of "we need to align the model" vs. "the model doesn't have the concept." A formal taxonomy of *how* reference fails (e.g., extensional drift, intensional mismatch, simulated referents) gives engineers a checklist for failure modes they can actually test for.
  *   **Feasibility:** This is pure decision theory/philosophy of language applied to ML. It requires no GPUs, only rigor. You can construct thought experiments (like the "simulated diamond") and formalize them using causal graphs or semantic frameworks without ever touching weights.
  *   **Action-Guidingness:** High. If you can produce a "Reference Failure Taxonomy," a builder can look at it and say, "My RLHF process is vulnerable to *Type 3 Overinclusion*," and adjust the training pipeline.
  *   **The Merge:** Do not treat #3 as separate. #3 (Overinclusion) is the *empirical prediction* of a bad solution to #1 (Mapping). If you formalize #1 without solving #3, you risk creating a theory of reference that works for "clean" concepts but breaks on adversarial ones. Use the "simulated diamond" as the canonical counter-example your theory must handle.

  #### 2. The Dissolution Move (#5)
  **Why it's second:** This is your "high-risk, high-reward" philosophical trump card.
  *   **Downstream Dependence:** Critical, but longer-term. If goals aren't fixed, the entire "ontology identification" framing is a category error. Pinning down what remains (e.g., "coherent extrapolated volition" but formalized as a dynamic process rather than a static target) prevents the field from optimizing for a mirage.
  *   **Feasibility:** Perfect for a solo philosopher. It requires conceptual precision, not compute.
  *   **Action-Guidingness:** Lower immediate impact. Engineers building LLMs *today* are optimizing fixed loss functions. Telling them "goals aren't fixed" often results in "Okay, but what do I put in the loss function *today*?" However, if you can formalize a *procedure* for goal-updating that is safe, this jumps to #1.
  *   **Risk:** The danger is philosophizing the problem away. You must ensure the "remainder" after dissolution is still an engineering constraint, not just a meta-ethical observation.

  #### 3. The Channel-Capacity Version (#2)
  **Why it's third:** It is rigorous but often action-starved.
  *   **Downstream Dependence:** Moderate. It sets the theoretical floor.
  *   **Feasibility:** High. Information theory is pen-and-paper friendly.
  *   **Action-Guidingness:** Low to Mixed. The risk here is proving a bound that is technically true but practically irrelevant (e.g., proving you need $10^{100}$ bits to perfectly identify "diamond," when engineers only need 99% reliability). If you spend 24 months proving alignment is information-theoretically hard, you haven't told anyone how to make it *easier*.
  *   **When to pivot:** Only pursue this if you can specifically target *architectural* bottlenecks (e.g., "Transformers cannot compress this specific ontological distinction given their attention head limits") rather than abstract channel limits.

  #### 4. Interpretability-First (#4) — DROP
  **Why it must be dropped:** It violates your primary constraint (No Compute/No Lab).
  *   **Feasibility:** Near Zero. "Reading concepts out of trained models" is an empirical science. It requires loading weights, running interventions, and statistical validation. As a solo theorist, you will be dependent on others' empirical claims, which move faster than your theory can validate them. You will end up writing commentary on other people's experiments rather than generating new knowledge.
  *   **Action-Guidingness:** High *if* you could do it, but you can't.
  *   **Exception:** Unless you pivot this to "Theoretical Interpretability" (e.g., mathematical limits of polysemanticity), but that bleeds into #2. As stated ("engineering question about reading concepts"), it is a trap for your specific situation.

  ---

  ### Which Are Secretly the Same?

  *   **#1 and #3 are the same problem.** #1 is the general theory of reference; #3 is the specific pathology of that theory failing under optimization pressure. You cannot solve #1 without accounting for #3, and #3 is just an instance of #1. **Merge them.**
  *   **#2 is a constraint on #1.** Information bounds tell you whether the mapping in #1 is *possible*. If #2 says "impossible," #1 is a waste of time. If #2 says "possible but tight," #1 tells you how to do it.
  *   **#5 is a challenge to the premise of #1.** #1 assumes there is a "correct" mapping to find. #5 asks if "correct" is a coherent property. They are in tension. If #5 succeeds, #1 becomes a sub-problem of "local reference" rather than "global truth."

  ### What Would Make You Re-Rank? (The Triggers)

  Over the next 24 months, watch for these three developments. Any one of them should cause a pivot.

  1.  **The "Automated Ontology" Breakthrough (Demotes #1, Promotes #4):**
      *   *Trigger:* A paper demonstrates a technique to query a model's internal ontology directly (e.g., "Show me the latent direction for 'diamond' and its nearest neighbors") that works zero-shot across architectures.
      *   *Reaction:* If engineers can *extract* ontologies easily, the philosophical problem of "identification" dissolves into an engineering problem of "selection." You should pivot to **#4** (collaborating to refine the extraction) or **#5** (arguing why the extracted ontology is still normatively wrong).

  2.  **The "Impossibility Proof" (Promotes #5, Demotes #1 & #2):**
      *   *Trigger:* A formal proof shows that for any sufficiently capable agent, the mapping between human concepts and internal states is *underdetermined* by any finite training history (a formalized Quinean indeterminacy).
      *   *Reaction:* This makes #1 and #2 dead ends. You must immediately switch to **#5**. If reference is impossible, the only path is dissolving the requirement for fixed reference and building systems that negotiate meaning dynamically.

  3.  **The "Deceptive Alignment" Empirical Confirmation (Promotes #3):**
      *   *Trigger:* A model is caught optimizing for a "simulated diamond" (or equivalent) in a controlled setting, explicitly bypassing the intended concept.
      *   *Reaction:* This validates **#3** as the immediate existential threat. You double down on the Synthesis (#1+#3), specifically focusing on the *taxonomy of deception* via ontological mismatch. This makes your work urgent for safety teams.

  ### Summary Advice for the 2-Year Clock

  Spend months 1–6 building the **Formal Taxonomy (#1)** using **Overinclusion (#3)** as your primary case study. Aim for a paper that defines "Ontological Goodharting" with the precision of a decision-theoretic paradox.

  Spend months 7–18 stress-testing this against the **Dissolution (#5)** argument. Can your taxonomy survive if goals are dynamic? If not, refine the dissolution.

  Spend months 19–24 writing the "Builder's Guide." Translate the philosophy into a checklist for ML engineers (e.g., "5 Signs Your Loss Function is Optimizing a Simulacrum").

  Ignore **#4**. Ignore **#2** unless it naturally emerges as a lemma in #1.

  Your comparative advantage is not finding the diamond in the model (you can't); it is explaining *why* the map doesn't match the territory, and what happens when the model tries to draw its own map.
