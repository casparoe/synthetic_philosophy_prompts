      Scale: 0.01g precision is ideal, 0.1g is minimum. Kitchen scales often do 1g. That's too coarse. 5g copper -> 6g oxide. Need 0.1g at least. I will specify "Jeweler's Scale" or "Pocket Scale" (cheap on Amazon).

      *Scoring:* "Consensus Points." If they sign the paragraph, everyone gets points. If they fail, no one gets points. This forces cooperation but highlights the difficulty.

