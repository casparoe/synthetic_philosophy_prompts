answer: |-
  Here is a complete design for the 75-minute session. It is built to be run cold, with minimal instructor intervention, so the friction emerges from the students' attempts to collaborate.

  ### 1. The Setup & Materials

  **The Experiment (Calcination)**
  *   **Material:** Copper wool (fine grade, available at hardware stores for cleaning/soldering) or Steel wool (soap-free). Copper is safer and turns distinctly from orange/brown to black.
  *   **Heat Source:** A single electric hot plate (safer than open flame in a seminar room) or a sturdy camping stove if ventilation allows.
  *   **Container:** A small ceramic crucible or a disposable aluminum tart tin.
  *   **Scale:** A digital pocket scale (jeweler's scale) with **0.01g precision**. *Do not use a standard 1g kitchen scale; the weight change is too small.* (Cost: ~$15 online).
  *   **Tongs:** For handling the hot tin.

  **Room Arrangement**
  *   Split the 16 students into **Two Teams of 8**.
  *   Team A (Left side of room): **The Phlogistonists**.
  *   Team B (Right side of room): **The Oxygenists**.
  *   **The Table:** A central table where the experiment happens. Both teams watch the *same* procedure. Only the designated "Weighmaster" from each team touches the scale.

  **The Stakes (Scoring)**
  *   **Consensus Points:** If the two teams produce a single, jointly signed paragraph describing the event, every student gets 2 "Seminar Participation Points."
  *   **Precision Bonus:** If the paragraph contains no internal contradictions (verified by you), +1 Point.
  *   **Failure:** If they fail to agree, no one gets points. (This creates pressure to collaborate, making the failure to collaborate more significant).

  ---

  ### 2. The Glossaries (Printable One-Pagers)

  Print these on distinct colored paper. Hand them out at the start. **Do not allow teams to swap papers.**

  #### TEAM A: PHLOGISTONISTS (Version 1.0)
  **Core Ontology:**
  *   **Metal:** A compound substance consisting of a *Calx* (earth) bound to *Phlogiston*.
  *   **Phlogiston:** The material principle of fire. It is a substance contained within all combustibles.
  *   **Property of Phlogiston:** It possesses **Negative Mass** (Levity). It repels the earth.
  *   **Air:** The medium that receives Phlogiston. Air has a limited capacity to absorb it.
  *   **Calcination:** The process where heat drives Phlogiston *out* of the Metal.

  **Reporting Rules:**
  *   Record all weights as "Gross Mass."
  *   When explaining weight changes, account for the *loss* of Phlogiston.
  *   *Note:* Since Phlogiston has negative mass, removing it increases the Gross Mass of the residue.

  #### TEAM B: OXYGENISTS (Version 1.0)
  **Core Ontology:**
  *   **Metal:** A simple, elemental substance.
  *   **Air:** A mixture of gases. One component is active, the rest are inert.
  *   **Oxygen:** The active component of Air. It has positive mass.
  *   **Calx (Oxide):** A compound of Metal + Oxygen.
  *   **Calcination:** The process where Metal combines with Oxygen from the Air.

  **Reporting Rules:**
  *   Record all weights as "Gross Mass."
  *   When explaining weight changes, account for the *addition* of Oxygen.
  *   *Note:* Weight gain is exactly equal to the mass of Oxygen absorbed from the Air.

  ---

  ### 3. The Timeline (75 Minutes)

  **00:00 – 00:05 | Arrival & Distribution**
  *   Students enter. Seat them by team.
  *   Hand out the Glossaries.
  *   **Instructor Script:** "You are research teams investigating a thermal reaction. You have 10 minutes to observe the experiment and formulate a theoretical account using *only* the terms in your glossary. At minute 40, you must co-author a single paragraph describing what happened. You both sign it. If the paragraph is consistent, you get points. If not, you don't. Go."
  *   *No mention of Kuhn, history, or truth.*

  **00:05 – 00:20 | The Experiment & Theory Building**
  *   Perform the weighing publicly.
      1.  Weigh empty tin.
      2.  Add Copper Wool. Weigh (Record $M_1$).
      3.  Heat for 5-7 minutes until black.
      4.  Cool. Weigh (Record $M_2$).
  *   **Result:** $M_2 > M_1$. (e.g., 5.00g $\rightarrow$ 5.60g).
  *   Teams retreat to their sides to draft their explanation.
  *   *Instructor Role:* Circulate. Ensure Phlogistonists are using the "Negative Mass" rule to explain the gain. Ensure Oxygenists are using "Addition" rule.

  **00:20 – 00:35 | The Twist (The Revision)**
  *   Walk to the **Phlogiston Team**. Collect their Version 1.0 glossaries.
  *   Hand them **Version 2.0**.
  *   **Instructor Script:** "Correction from the Society. Your definition of Phlogiston was imprecise. Please update your records immediately. You must use the new definition for all future statements."
  *   **Team A: PHLOGISTONISTS (Version 2.0)**
      *   *Change:* **Phlogiston:** The *capacity* or *tendency* of a substance to release heat. **It is not a material substance.** It cannot be weighed.
      *   *Change:* **Calcination:** The release of the tendency, allowing heat-fluid (Caloric) to enter the pores of the metal.
      *   *Note:* Weight gain is due to the absorption of Caloric, not the loss of Phlogiston.
  *   *Why this breaks things:* Team B (Oxygen) thinks Phlogiston is a *stuff* they can balance equations against. Team A now says it's a *property*. Team A now invokes "Caloric" (heat-fluid) which Team B does not have in their glossary.

  **00:35 – 00:55 | The Negotiation**
  *   Select 2 negotiators from each team (4 students total) to meet at the central table. The rest act as advisors.
  *   **Task:** Write one paragraph (max 6 sentences).
  *   **Constraint:** You must agree on the subject of every sentence. You cannot use terms undefined in *both* glossaries (unless you define them jointly).
  *   **Instructor Role:** Silent observer. Only intervene if physical safety is at risk. If they ask "Is this true?", say "Is it signable?"

  **00:55 – 01:15 | The Debrief**
  *   Collect the paragraph. Read it aloud.
  *   Open the floor. (See Debrief Script below).

  ---

  ### 4. The Debrief Script (Kuhn & Davidson)

  **Step 1: The Autopsy (5 mins)**
  *   Read the final paragraph. It will likely be vague. *"The metal was heated. The weight changed. Substances interacted."*
  *   Ask: "Why did you delete the specific mechanisms?"
  *   They will say: "We couldn't agree on what 'Phlogiston' meant." or "They kept talking about Caloric."

  **Step 2: Mapping to Kuhn (5 mins)**
  *   **Write on board:** *Structure of Scientific Revolutions.*
  *   **Point 1: Theory-Laden Observation.** "Did you see the same weight gain?" Yes. "Did you see the same *fact*?" No. One saw 'Loss of Levity', the other saw 'Gain of Mass'. The scale number was neutral; the *event* was not.
  *   **Point 2: Incommensurability.** "When Team A got the new glossary, did they change their minds, or did their words change meaning?"
      *   *Goal:* Get them to see that 'Phlogiston' in v1 and 'Phlogiston' in v2 are not just different beliefs, they are different *categories* (Substance vs. Property).
  *   **Point 3: No Neutral Language.** "Why couldn't you just write the paragraph?" Because there is no vocabulary available to both of you that doesn't secretly favor one ontology. To say 'The metal gained matter' favors Oxygen. To say 'The metal lost levity' favors Phlogiston.

  **Step 3: The Davidson Dilemma (5 mins)**
  *   **The Hard Question:** "If you are rational agents, and you want to agree, why couldn't you?"
  *   **The Trap:** A student will say: "Because one of us was wrong."
  *   **Your Move:** "Assume both teams are perfectly competent. Assume both are describing the *same world*. If you can translate Team A's claims into Team B's language without loss of meaning, then there is no disagreement, just a translation error. If you *cannot* translate without loss, then in what sense were you talking about the same thing?"
  *   **The Horns:**
      1.  If you say they *were* talking about the same thing, then the disagreement is merely verbal (and solvable).
      2.  If you say they *weren't*, then they live in different worlds (Kuhn).
      3.  Davidson says (2) is impossible (we must share a world to disagree). Kuhn says (2) is exactly what happens in revolutions.
  *   **Close:** "Next week, read Kuhn. Ask yourself: Did you just simulate a revolution, or just a misunderstanding?"

  ---

  ### 5. Troubleshooting: What Will Go Wrong

  **1. The "Neutral Scale" Objection**
  *   **The Student:** "This is rigged. The scale showed 5.6g. That's a neutral fact. Team A just had a crazy theory. Kuhn is wrong because observation settles it."
  *   **The Fix:** Do not argue. Ask: "What does '5.6g' mean?"
      *   If they say "Mass," ask Team A (v2). They will say "It's the measure of Caloric absorption + Earth."
      *   Ask: "Did the scale tell you it was Mass? Or did your glossary tell you to interpret the number as Mass?"
      *   **Point:** The *number* is neutral. The *description of the event* ("Weight Gain" vs "Levity Loss") is not. Kuhn doesn't deny the sensory stimulus; he denies the neutrality of the *description*.

  **2. The "Rigged Game" Cynicism**
  *   **The Risk:** Students feel you forced Team A to fail by changing the rules.
  *   **The Fix:** Acknowledge it. "Yes, I changed the rules. That represents the *crisis* phase. In history, the 'rule change' isn't handed by a professor; it's forced by anomalies (like this weight gain) that the old glossary can't handle without becoming absurd (like negative mass). Team A's v1 was absurd. v2 was an attempt to save the phenomenon. Did it work?"
  *   **Honesty:** "The design is honest in that Team A *could* have explained the weight. v1 worked logically (negative mass). v2 broke the translation. The friction wasn't that one side was stupid; it's that their ontology shifted under their feet."

  **3. Successful Consensus**
  *   **The Risk:** They write a paragraph too easily. "The metal changed when heated."
  *   **The Fix:** In the debrief, highlight the *vacuity*. "You agreed, but you said nothing. To say something specific, you needed terms you didn't share. Incommensurability doesn't stop communication; it stops *substantive* agreement."

  ---

  ### 6. Limitations (What This Can't Do)

  Be straight with yourself (and them, if asked):
  1.  **Synchronic vs. Diachronic:** This simulates two groups in a room (spatial). Kuhn is talking about groups across time (temporal). The Phlogistonists of 1770 didn't sit in a room with Lavoisier; they died out. The "world change" is harder to see when the opponents are present.
  2.  **The Stakes:** In real science, the stakes are careers, funding, and truth. Here, it's seminar points. The *resistance* to changing glossaries will be lower than in reality.
  3.  **The "Right" Answer:** We know Oxygen won. In the seminar, you must remain neutral. If you hint Oxygen is "modern/correct," the simulation collapses into "Why are the Phlogistonists being difficult?"

  ---

  ### 7. Variant: The Postscript Session (Week 6)

  **Context:** Students have read *Structure* and the Postscript. They expect the trick.
  **Goal:** Test the limits of translation.

  **Modification:**
  1.  Give **both** teams the **same** Glossary (Oxygenist).
  2.  Tell Team A: "You are to interpret 'Oxygen' as Lavoisier did (1780)."
  3.  Tell Team B: "You are to interpret 'Oxygen' as a Modern Chemist does (2020)."
  4.  **Task:** Translate the sentence "Oxygen is an element" from Team A to Team B.
  5.  **The Catch:** For Lavoisier, "Element" = "Last point of analysis by chemical means." For Moderns, "Element" = "Defined by Proton Count."
  6.  **Debrief:** Even with the *same words*, the criteria for application differ. This illustrates Kuhn's Postscript claim: Incommensurability is local (specific terms), not global (whole language), but it still blocks direct translation.

  ---

  ### 8. Instructor Cheat Sheet: Keeping it Honest

  *   **If Team P (Phlogiston) looks defeated:** Whisper to them: "Remember, Negative Mass is a valid theoretical posit if it saves the phenomena. Stand your ground. You are not wrong, you are *different*."
  *   **If Team O (Oxygen) gets arrogant:** Remind them: "You cannot use the word 'Oxidation' unless Team P agrees to it. They don't have that word. Find a synonym." (They can't).
  *   **The "Ah-Ha" Moment:** Watch for the moment Team O realizes Team P's v2 Glossary makes "Phlogiston" unweighable. That is the moment communication breaks. Point to that moment in the debrief. "Right there. That was the incommensurability."

  ### Summary of Deliverables for Printing

  1.  **Glossary A (v1)**: Phlogiston = Substance (Negative Mass).
  2.  **Glossary A (v2)**: Phlogiston = Property (Caloric absorption).
  3.  **Glossary B (v1)**: Oxygen = Substance (Positive Mass).
  4.  **Data Sheet**: Blank table for "Time", "Reading", "Observation". (Do not pre-label columns "Mass" or "Weight").
  5.  **Consensus Contract**: A slip of paper with lines for 4 signatures and space for the paragraph.

  This design forces them to live the problem before they name it. They will feel the frustration of translation failure physically, which makes the Week 5 reading land much harder.
