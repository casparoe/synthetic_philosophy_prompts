answer: |-
  ### Phase 1: The Brainstorm Dump

  Here is the raw list of candidate requirements I generated before pruning. I have included those I intend to reject to show the work.

  1.  **Numeric Probabilistic Output:** The framework must yield a specific probability (e.g., 70% chance) for the counterfactual.
  2.  **Evidential Constraint:** All claims about the counterfactual world must be grounded in evidence existing in the actual world (no magic data).
  3.  **Similarity Metric:** The framework must define how "close" the counterfactual world is to the actual world (distance metric).
  4.  **Drift Control:** The framework must account for the divergence of worlds over time (the butterfly effect/chaos problem).
  5.  **Outcome Granularity:** The framework must distinguish between "Outcome X did not happen" and "Outcome X happened differently/later."
  6.  **Role Individuation:** The framework must define what counts as the "same position" (P) when swapping agents.
  7.  **Order-Invariance:** The verdict must be the same whether varying the agent or the structure first.
  8.  **Substitution Audit:** The core metric must be the replaceability of the agent in position P.
  9.  **Redundancy Handling:** The framework must account for multiple discovery/parallel readiness without special pleading.
  10. **Falsifiability:** There must be a conceivable piece of evidence that would disprove the claim.
  11. **Causal Mechanism:** The framework must specify the mechanism linking the agent/structure to the outcome.
  12. **Temporal Horizon:** The framework must set a maximum time limit for valid counterfactuals.
  13. **Symmetry of Explanation:** The explanation for why something happened must be the inverse of why it didn't.
  14. **Psychological Plausibility:** Counterfactual agents must act within bounds of known human psychology.
  15. **Structural Plasticity:** The framework must allow structures to bend under agent pressure, not just break or hold.

  ***

  ### Phase 2: Pruning and Evaluation

  This is the critical filter. I am separating **Requirements** (conditions for the framework to function logically) from **Prejudices** (camp-specific tastes dressed up as method).

  *   **Numeric Probabilistic Output:** **REJECT (Prejudice).** This is a forecaster preference that violates historical epistemology. History does not offer reference classes large enough to license frequentist probabilities, and subjective Bayesian priors become unmoored without data. *Replacement:* **Ordinal Confidence.** The framework must license confidence bands (High/Medium/Low) or comparative likelihoods, not point estimates.
  *   **Order-Invariance:** **REJECT (Category Mistake).** This sounds mathematically elegant but ontologically wrong. Structure and Agency are not commutative variables. Holding a person fixed while radically altering their structure often changes the person's causal powers (a General without an army is not a General). Demanding invariance forces a false symmetry on asymmetric causal relations.
  *   **Substitution Audit:** **REJECT (Circular as a Requirement).** You cannot demand "measure replaceability" as a *rule* for the framework; replaceability is the *output* of the framework. If you make this a requirement, you presuppose the answer (that replaceability is the metric of agency).
  *   **Falsifiability:** **REJECT (Too Strong).** In singular historical cases, strict falsifiability is impossible. We cannot run the experiment again. *Replacement:* **Constraining Conditions.** The framework must specify what evidence *would* raise or lower confidence, even if it can't falsify.
  *   **Symmetry of Explanation:** **REJECT (Prejudice).** Causal asymmetry is real. The conditions for preventing a war are not identical to the conditions for starting one.
  *   **Temporal Horizon:** **MERGE.** This is subsumed by **Drift Control**. A hard cutoff is arbitrary; a decay function is better.
  *   **Psychological Plausibility:** **MERGE.** This is part of the **Similarity Metric**. Counterfactual agents shouldn't be aliens, but this is a constraint on world-similarity, not a standalone rule.

  **The Survivors (The Final Spec):**
  The following five are non-negotiable. If a framework violates these, it is either magic or ideology.

  1.  **The Evidential Anchor:** Claims about the counterfactual must be grounded in actual-world evidence of capacities, constraints, and propensities. You cannot posit a counterfactual agent with capabilities not evidenced in the actual population of that time/place.
  2.  **The Similarity Metric:** The framework must explicitly state which variables are held fixed (background conditions) and which are allowed to vary. It must define "relevant similarity" for the outcome (e.g., is a war starting 2 years later the "same" war?).
  3.  **Drift Decay:** The framework must incorporate a function or rule that reduces confidence as the temporal distance from the intervention point increases. Long-horizon certainty is a bug, not a feature.
  4.  **Outcome Granularity:** The framework must distinguish between *token-identity* (this exact event) and *type-identity* (an event of this class). "No Hitler" does not automatically mean "No Fascism," but it might mean "No Holocaust in 1941."
  5.  **Mechanism Specification:** The framework must identify the causal pathway. It is not enough to say "Structure caused it." You must say *which* structural constraint funneled the agency.

  ***

  ### Phase 3: Evaluation of Homegrown Proposals

  **1. The Substitution Audit**
  **Verdict: Not a Requirement, but the Target Variable.**
  Treating this as a requirement is circular. You cannot assess "how many alternative occupants" without already running the counterfactual simulation. However, it is the correct *definition* of the problem. The framework should *calculate* replaceability, not assume it. The danger here is that your group will treat "replaceability" as a binary switch (replaceable/not replaceable) rather than a distribution of probable outcomes. Make this the *output* of the model, not an input constraint.

  **2. Order-Invariance**
  **Verdict: False Requirement (Category Mistake).**
  This is the most seductive trap in your group. It appeals to the forecasters (symmetry is elegant) and frustrates the historians (context is unique). In causal modeling, $P(Y | do(X), Z) \neq P(Y | do(Z), X)$. Holding structure fixed while varying the person tests *agency potency*. Holding the person fixed while varying structure tests *structural constraint*. These are different questions. If your framework demands they yield the same verdict, you are forcing a square peg into a round hole. Demand **Consistency**, not Invariance. The two tests should illuminate different facets of the same causal graph, not produce identical numbers.

  ***

  ### Phase 4: Impossibility Theorems and Trade-Offs

  You suspected that **(a) Numeric Probabilities**, **(b) Drift Control**, and **(c) Evidential Constraint** cannot coexist. **You are correct.**

  *   **The Conflict:** To generate **Numeric Probabilities (a)** over a **Long Horizon (b)**, you need a model with tight parameters. But **Historical Evidence (c)** is sparse, noisy, and non-experimental. You cannot justify the precise priors needed for (a) using only (c) without ignoring (b). If you respect the evidence (c) and the drift (b), your error bars widen so fast that numbers (a) become fraudulent precision.
  *   **The Resolution:** **Drop (a).** The framework must output **Ordinal Confidence** (e.g., "High confidence that the outcome type persists, low confidence on timing"). Attempting to force numbers will cause your historians to reject the tool as gamification and your forecasters to overfit noise.
  *   **The "Killer" Requirement:** **The Evidential Anchor.**
      *   **What it excludes:** This is the single requirement that knocks out the most existing approaches on *both* sides.
      *   **Against Great Man Theory:** It excludes "Psychological Necessity" arguments (e.g., "Only Hitler had the will") unless there is evidence that *no other* actor possessed similar will/capacity. It kills armchair speculation about unique genius.
      *   **Against Hard Structuralism:** It excludes "Inevitability" arguments (e.g., "Fascism was bound to happen") unless there is evidence of *actual* alternative actors ready to fill the slot. It kills deterministic washout that ignores contingency.
      *   **Why it wins:** It forces both sides to stop talking about metaphysics and start talking about archives and capacity distributions.

  ***

  ### Phase 5: Scoring Existing Approaches

  **Carlyle-Style Great Man Account**
  **Score: Fails.**
  This approach collapses immediately on the **Evidential Anchor** and **Redundancy Handling**. It posits unique causal powers for the individual without demonstrating the absence of substitutes in the actual population. It treats the individual as an exogenous shock rather than a variable within a system. It also fails **Drift Control**, often assuming the individual's will creates a permanent divergence without accounting for structural reversion to the mean. It is essentially a counterfactual claim ("No X, no Y") asserted without a mechanism for why no Z could have done X's job.

  **Tolstoy/Carr Structuralist Account**
  **Score: Fails.**
  This approach collapses on **Outcome Granularity** and **Mechanism Specification**. By treating outcomes as over-determined, it fails to distinguish between "War happens" and "War happens *this* way." It violates **Drift Control** by assuming structural forces are immune to chaotic divergence caused by small agent-level perturbations. Most critically, it often fails the **Evidential Anchor** regarding inevitability; it asserts structural pressure without evidencing the specific mechanisms that would compel a *different* agent to make the *same* specific choices. It confuses correlation with constraint.

  **Interventionist/Causal-Modeling Account**
  **Score: Pass (with caveats).**
  This is the only approach that natively satisfies **Similarity Metric**, **Mechanism Specification**, and **Order-Invariance** (conceptually, if not numerically). It forces you to draw the graph. However, it risks failing the **Evidential Constraint** if the modelers populate the graph with parameters not found in the historical record (the "fake numbers" problem). If strictly bound to the **Ordinal Confidence** output rather than numeric probabilities, this is the only viable architecture. It treats the "Individual vs. Structure" debate not as a dichotomy but as an interaction term in a causal network, which is the correct ontological move.
