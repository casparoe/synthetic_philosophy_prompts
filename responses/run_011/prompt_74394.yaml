      *   *Substitution Audit:* Is it circular? It assumes we know the counterfactual to measure replaceability. *Verdict:* Refine. It's a *method*, not a requirement. It's the *thing to be calculated*, not a rule for the calculation.
      *   *Order-Invariance:* This is tricky. Structure and Agency aren't symmetric variables. Holding structure fixed while varying the person is different from holding the person fixed while varying structure (can you hold a person fixed while changing the structure they inhabit? Yes, but it changes the causal powers). *Verdict:* Reject as a strict requirement. It's a category mistake. Causal interactions aren't commutative.
