  The maximizer's position is most vulnerable where it attempts to accommodate human psychology without conceding moral ground. Agent-neutrality renders personal attachments suspect unless they instrumentally serve the good. The disappearance of supererogation eliminates moral slack, making every sub-optimal act a violation. Marginal-utility accounting transforms ordinary consumption into opportunity costs. Rest is valued only as maintenance for productive capacity. Finally, the collective-action move, which caps demands at a fair share under full compliance, collapses under act-consequentialism when non-compliance is factored in, requiring the compliant agent to pick up the slack rather than hold back.

  ***

  **OFFICE OF AGGREGATE WELFARE**
  **ASSOCIATE WELLBEING AND SUSTAINABILITY HANDBOOK**
  **VERSION 9.4 (OPTIMAL)**

  **1.0 SUSTAINABILITY ALLOWANCE AND MARGINAL UTILITY**
  Associates are reminded that personal leisure is not an intrinsic right but a variable input in the production of welfare. The Sustainability Allowance is calculated daily based on the curve of diminishing marginal returns. When an associate's fatigue reduces their productive output below the utility generated by rest, rest becomes obligatory. Conversely, if an associate derives high utility from labor relative to alternative allocations of time, leisure is classified as a resource diversion. Associates may not claim downtime based on personal desire; claims must be substantiated by efficiency metrics proving that further labor would decrease net aggregate welfare. Consumption of non-essential goods is permitted only when the marginal utility of the currency to the associate exceeds the marginal utility of that currency donated to high-efficiency charities.

  **2.0 GRIEVANCE PROCEDURE: INTEGRITY OBJECTIONS**
  Associates may file Form I-7 (Integrity Objection) if they feel institutional requirements conflict with their personal moral identity. Please note that "integrity" is defined herein as the consistency of an agent's actions with their own projects. Since Act-Consequentialism requires projects to be subordinate to aggregate welfare, integrity objections are structurally incompatible with compliance. Upon receipt, Form I-7 triggers an automatic disposition letter:

  *Dear Associate, Your grievance cites a conflict between institutional mandates and personal integrity. As integrity is merely a psychological state with no independent moral weight, this conflict indicates a calibration error in your preference hierarchy, not a flaw in the mandate. You are advised to realign your psychological dispositions to match optimal output requirements. Continued filing of Form I-7 may be recorded as a failure to adapt.*

  **3.0 DISCIPLINARY PRECEDENT: CASE 8940 (THE STAIRWELL INCIDENT)**
  Reference is made to Associate 8940, who encountered a flooded stairwell containing both his spouse and a stranger. Associate 8940 rescued the spouse. Upon review, Associate 8940 submitted a report stating he did not act on immediate affection but paused to calculate whether the calculus permitted partiality based on long-term psychological stability metrics. While the delay risked both lives, the Office commends Associate 8940. The commendation is not for the rescue of the spouse, but for the verification process. Acting on unmediated affection would constitute a violation of agent-neutrality. By interposing the calculation between impulse and action, Associate 8940 demonstrated proper procedural fidelity. Associates are reminded that saving a loved one is permissible only when verified as optimal; doing so merely because they are loved is a compliance failure.

  **4.0 QUARTERLY WELLBEING SURVEY**
  To monitor institutional efficacy, all associates must complete the Quarterly Wellbeing Survey. To prevent bias introduced by variable semantic interpretations, all response options have been standardized. Please select the option that best reflects your status.

  **Question: How would you rate your current alignment with aggregate welfare goals?**
  [ ] Optimal
  [ ] Optimal
  [ ] Optimal
  [ ] Optimal

  *Submission of any other data is considered noise and will be discarded.*
