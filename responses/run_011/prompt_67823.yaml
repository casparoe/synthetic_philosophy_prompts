answer: |-
  **MEMORANDUM**

  **TO:** Public Records Chat Assistant Steering Committee
  **FROM:** External Consultant
  **DATE:** October 24, 2023
  **SUBJECT:** Decision Policy on Reference Failure and Error Messaging

  You have asked me to break the stalemate regarding how the chat assistant handles questions that do not map cleanly to database records. You are stuck between two camps. Camp A wants the tool to speak like a human clerk, making flat claims about the world (e.g., "There is no license"). Camp B wants the tool to speak like a database interface, making claims only about what is stored in the system (e.g., "No record found").

  This is not merely a wording dispute. It is a disagreement about what the tool is. After reviewing the logs and the arguments, I recommend adopting Camp B's stance with specific modifications for usability. The tool must prioritize epistemic humility over conversational flow. Below is the policy, the justification, and the specific templates engineering should implement.

  **The Core Distinction**

  Your hunch is correct. The two candidate error messages are not interchangeable. When the tool says, "There is no active business license for Joe's Diner," it makes an ontological claim. It asserts a fact about reality: that no such license exists in the world. When the tool says, "Our records do not show an active license for Joe's Diner," it makes an epistemic claim. It asserts a fact about the county's knowledge: that the database lacks this entry.

  In a perfect system, these are identical. In a county government system undergoing data migration, they are not. If the database is missing a row due to error, the ontological claim is a lie, while the epistemic claim remains true. For a government body, liability rests on the difference between "We don't know" and "It isn't so." Therefore, the tool must never assert the non-existence of a record, only the absence of that record in the current dataset.

  **Policy and Templates**

  We will apply this distinction across all three buckets of failure. The goal is to be helpful without overstepping the bounds of the data.

  **Bucket 1: Nothing Matches**
  When a query returns zero results, the tool must not deny the existence of the thing requested. It must report the search result.
  *   **Template:** "Our records do not show a [record type] for [search term]. This may be due to a data entry variation or a recent update not yet reflected in the system. Please contact [Department] at [Phone Number] to verify."
  *   **Example:** "Our records do not show an active business license for Joe's Diner. This may be due to a data entry variation or a recent update not yet reflected in the system. Please contact the Clerk's Office at 555-0199 to verify."

  **Bucket 2: More Than One Matches**
  When a query returns multiple plausible results, the tool must not guess. Selecting the "most recent" record assumes the user cares about recency rather than specificity, which is a dangerous assumption for legal or property data.
  *   **Template:** "We found [Number] records matching [search term]. To protect accuracy, please review the list below and select the one that matches your property or case number."
  *   **Action:** Display the list immediately below the text. Do not summarize the content of the records in the opening sentence.

  **Bucket 3: Contested Descriptions**
  When the description relies on contested facts (like "the winner" when there were two), the tool cannot resolve the ambiguity. It must treat the ambiguity as a data error requiring human clarification.
  *   **Template:** "Your question refers to [contested term], but our records indicate multiple entries fit that description. To ensure accuracy, please specify which of the following you are asking about: [List Options]."
  *   **Example:** "Your question refers to the winner of the 2023 beautification award, but our records indicate two co-winners. To ensure accuracy, please specify which of the following you are asking about: [Name A] or [Name B]."

  **The Strongest Case Against This Recommendation**

  I owe it to the committee to articulate why Camp A feels so strongly about their position. Their argument is not about laziness; it is about trust and utility. When a resident walks to the front desk, they do not want to hear about the limitations of the filing system. They want an answer. If a clerk says, "I can't find that," the resident hears, "It doesn't exist." By forcing the tool to say, "Our records do not show," we are prioritizing bureaucratic safety over resident clarity.

  Camp A argues that this phrasing erodes confidence. If the tool constantly hedges, residents will assume the county is incompetent or hiding something. They argue that a flat denial ("There is no license") is the honest translation of a null search result in 99% of cases. By refusing to make that translation, we are forcing every resident to become a data auditor, calling the office to verify things that are almost certainly true. This increases workload for staff and frustration for residents. In short, Camp A believes we are sacrificing usability on the altar of liability, creating a tool that is technically accurate but practically useless.

  **Outstanding Data Questions**

  This policy assumes certain risks about the data quality. Before go-live, the data team must answer the following:

  1.  What is the confirmed rate of false negatives in the migrated property records? If more than 1% of existing parcels return blank, the epistemic warning messages will trigger too often to be useful.
  2.  Do we have a unique identifier for every business license, or are we relying on name matching? If we are matching on names alone, the "Multiple Matches" template will trigger constantly for common names like "Smith Construction."
  3.  Is there a latency window between a permit being issued and it appearing in the search database? If so, that window needs to be stated in the tool's welcome message.

  **Philosophy vs. Risk Management**

  You asked me to distinguish where the philosophy ends and the risk management begins. The distinction between "There is no X" and "We have no record of X" is a genuine philosophy problem. It concerns the conditions under which a sentence is true. However, your decision to choose the latter is not philosophy; it is risk management wearing a philosophy costume.

  You are not choosing the epistemic phrasing because it is more logically rigorous. You are choosing it because when the tool inevitably makes a mistake due to bad data, "Our records do not show" is a defensible position in court, while "There is no" is an admission of liability. The philosophy provides the vocabulary to explain the choice, but the fear of litigation is doing the work. Acknowledge this. If you tell the committee this is about truth conditions, they will argue logic. If you tell them this is about liability exposure, they will vote for safety.

  **Recommendation**

  Adopt the templates above. They protect the county from claiming falsehoods while directing residents to human staff when the data fails. This balances the need for accuracy with the necessity of risk mitigation.

  ***

  **Reasoning Note**
  I sided with Camp B because in a government context, the cost of a false negative (telling someone they don't have a permit when they do) is vastly higher than the cost of a friction point (making them call to verify). Your hunch about the sentences was the key: distinguishing ontological claims from epistemic claims allowed me to show that Camp A wasn't just "wrong," but was asking the tool to make claims it couldn't warrant. I structured the memo to validate both sides but anchor the decision in liability, as that is the only argument that actually settles committee disputes in public administration.
