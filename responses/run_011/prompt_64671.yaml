      *   **Topic:** Daniel Dennett's "Four Sorts of Creatures" (Darwinian, Skinnerian, Popperian, Gregorian) applied to Herbert Terrace's Project Nim (the signing chimp).
      *   **Core Task:**
          1.  Define evidence criteria for each Dennettian rung in the context of Nim.
          2.  Assess the Nim record against these criteria (honestly acknowledging gaps).
          3.  Address the "Knot": Is the taxonomy about the *mind* or the *system* (animal + apparatus)? Does the Skinnerian setup preclude higher-level detection?
