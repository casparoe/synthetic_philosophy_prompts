      *   *Skinnerian:* Operant conditioning. Trial and error within a lifetime. Reinforcement shapes behavior. "Try it, if it works, keep it."
      *   *Popperian:* Hypothesis testing *before* acting. Inner environment simulates consequences. "Let my hypotheses die in my stead."
      *   *Gregorian:* Tool-using (memes, language, maps). Offloading cognition to the environment/culture. Enhances Popperian capacity.

  3.  **Analyze Project Nim (The Data):**
