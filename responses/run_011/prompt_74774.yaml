          *   But the "Curing Disease" case breaks "Status Quo."
          *   So: **Do not reduce the capacity of other agents to pursue their own ends.** (The "Empowerment" view).
          *   Curing disease *increases* capacity (life/health), even if a specific "way of life" (a specific subset of options) is lost. The net capacity goes up.
          *   Manuscript destruction: Net capacity down.
          *   Locking up: Net capacity down.
