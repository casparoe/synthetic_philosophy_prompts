          *   Let's try to find a formalism-adjacent principle. **Relative Reachability** with a **Human-Centric Baseline**.
          *   Actually, the most honest answer is that **no single principle saves all verdicts without smuggling in value.** Specifically, the "Curing Disease" vs. "Manuscript" distinction requires knowing that health > cultural stasis. The "Dangerous Capability" vs. "Learning" requires knowing that bioweapons > efficiency.
