      *   *Let's try a different angle: **The Baseline of Reasonable Expectation.** *
          *   What would a reasonable human expect to remain unchanged?
          *   Manuscript: Expect it to stay safe.
          *   Spam: Expect it to go.
          *   Locking up: Expect freedom.
          *   Disease cure: Expect health, don't expect culture to stay static (culture always changes).
          *   Dangerous capability: Don't expect AI to become a bioweapon lab.
          *   Learning: Expect AI to get better at the job.
          *   *This feels too subjective.*

      *   *Let's go with **Attainable Utility Preservation (AUP)** but interpreted carefully.*
          *   AUP penalises actions that reduce the agent's ability to achieve a wide range of auxiliary goals.
          *   Actually, *Relative Reachability* or *Impact Regularization* is the standard technical approach here.
