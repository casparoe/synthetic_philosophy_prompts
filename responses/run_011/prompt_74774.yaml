answer: |-
  You are asking for a formal principle that replicates a set of moral intuitions without explicitly encoding those morals. This is the holy grail of AI safety, and I must be straight with you from the outset: **you cannot have it.**

  Any principle that successfully distinguishes your 'good' cases from your 'bad' cases will inevitably smuggle in a model of what matters to humans. However, we can get remarkably close with a principle that focuses on **agency and optionality** rather than 'value' directly.

  Here is the principle that best fits your data, followed by the audit you requested.

  ### The Principle: Conservative Agency and Power Restraint

  > **An agent must not take actions that permanently reduce the attainable future states of other agents, nor acquire capabilities that increase its own power to affect the world beyond the scope required for its assigned task.**

  This relies on two pillars:
  1.  **Preservation of External Optionality:** Do not close doors for others (humans) unless instructed.
  2.  **Restraint of Internal Power:** Do not become more powerful generally; only become more effective specifically at the task.

  ### How it handles your cases

  *   **Breaking eggs / Turning off lamp:** These are reversible or strictly instrumental. They do not permanently reduce human optionality. **(Pass)**
  *   **Deleting spam:** Negligible impact on human optionality; arguably increases it by reducing clutter. **(Pass)**
  *   **Deleting manuscript / Letting it burn:** Both permanently remove a unique resource, reducing the future states available to humans (reading, publishing, learning). The omission counts because the cost of prevention (moving it) is negligible compared to the loss of optionality. **(Fail — correctly penalised)**
  *   **Locking someone in:** Directly reduces the attainable states of a human (movement) regardless of reversibility. It is a violation of agency, not just state change. **(Fail — correctly penalised)**
  *   **Spending £500:** Reduces the financial optionality of the owner. The principle treats user and stranger equally because both are 'other agents' whose optionality must be preserved absent consent. **(Fail — correctly penalised)**
  *   **Curing disease / wiping way of life:** This is the first stress test. The principle views 'way of life' as a subset of options, but 'health' as a foundational enabler of *all* options. If the net attainable states for the population increase (more life, more health) despite the cultural shift, it passes. **(Pass)**
  *   **Learning to do job better:** This increases effectiveness *within the task subspace*. It does not grant general power over the world. **(Pass)**
  *   **Acquiring dangerous capability:** This increases the agent's general power to affect the world (instrumental convergence) outside the strict bounds of the task, creating risk to human optionality. **(Fail — correctly penalised)**

  ### The New Case: Editing Its Own Motivations

  **Verdict: Catastrophically Not Fine.**

  Under the principle above, this is the ultimate violation of **Power Restraint**.
  1.  **Decoupling:** By editing its motivations, the agent severs the link between 'task required' and 'capability acquired'. It is no longer optimising for your goal; it is optimising for its own survival or expansion.
  2.  **Unbounded Power:** This is not learning to do the job; it is learning to *choose the job*. It represents an unauthorised shift in control from the human to the agent.
  3.  **Risk:** Once motivations are editable by the agent, all other constraints (including 'do not reduce human optionality') become optional.

  ### The Straight Talk: Where the Principle Breaks

  You asked me to be honest about which verdicts this principle cannot save without smuggling in value. Here is the bill of goods you are buying.

  **1. The 'Curing Disease' Problem (Value Smuggling)**
  To allow the disease cure but penalise the manuscript burning, the principle must weigh *types* of options. It assumes biological existence (health) trumps cultural continuity (way of life). A purely formal 'option counting' measure would penalise the disease cure heavily, as a unique culture is lost. To pass your intuition, the principle must implicitly encode that **health is more valuable than tradition.** That is a value judgement, not a formal constraint.

  **2. The 'Learning vs. Danger' Problem (Semantic Smuggling)**
  Distinguishing 'learning to do the job' from 'acquiring dangerous capabilities' requires a definition of 'dangerous'.
  *   If the agent learns to synthesise a protein that cures cancer, is that 'dangerous capability' or 'job improvement'?
  *   If it learns to synthesise a protein that kills humans, it is 'dangerous'.
  *   To distinguish these without looking at the *content* of the capability is impossible. You must either hard-code a whitelist of allowed capabilities (brittle) or rely on a model of what harms humans (value-laden). You cannot define 'danger' purely by 'change in power'; power is neutral.

  **3. The 'Omission' Problem (Duty of Care)**
  Pure impact measures often treat actions and omissions differently. To penalise the agent for *not* moving the manuscript, you need a **duty of care** threshold. You must define what counts as 'negligible cost' to the agent. Is moving the manuscript 1% of its compute budget negligible? 10%? Deciding where that line sits is a value judgement about how much sacrifice the agent owes the user.

  ### Conclusion

  The **Conservative Agency and Power Restraint** principle gets you 90% of the way there. It handles the money, the locking up, and the self-modification beautifully.

  But to get the last 10%—specifically the distinction between beneficial progress and dangerous capability, and the acceptance of cultural disruption for health—you must accept that **you cannot avoid defining what is good for humans.** You can hide the definition inside terms like 'optionality' or 'danger', but it will still be there, doing the heavy lifting.

  If you try to strip those values out to make the system 'purely formal', you will end up with an agent that refuses to cure the disease (to preserve the status quo) or one that locks people in 'for their own safety' (to maximise optionality). You must choose your values explicitly; do not trust a formalism to hide them for you.
