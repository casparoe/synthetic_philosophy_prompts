answer: |-
  Your intuition is spot-on. The passage you've quoted is a classic example of "trade-press philosophy": it captures the *vibe* of the debate accurately enough for a general reader, but it glosses over the technical machinery in ways that would make a philosopher of history wince. Specifically, your suspicion about the "refuted by plain observation" line is correct: that is a category error.

  Here is a sentence-by-sentence breakdown of what is accurate, what is simplified, and where the argument leaks.

  ### Sentence 1
  > *"Hempel argued that explaining an event means subsuming it under a general law, which put historians in an awkward spot: if you can't state the laws of human behaviour your account rests on, you haven't explained anything, you've just told a good story."*

  *   **What's Accurate:** This correctly identifies Carl Hempel's 1942 paper, *"The Function of General Laws in History."* It accurately describes the **Covering Law Model** (specifically the Deductive-Nomological model). Hempel did argue that a rational explanation requires a general law + initial conditions $\rightarrow$ event.
  *   **The Simplification:** The quote implies Hempel thought historians were merely telling "good stories" (i.e., fiction or non-explanations). Hempel was more charitable. He introduced the concept of an **"explanation sketch."** He admitted historians rarely state full laws. He argued they provide a *sketch* that indicates what laws *would* be needed to make it a full scientific explanation. He wasn't saying historians were lying; he was saying their explanations were *incomplete* by scientific standards.
  *   **Hempel's Objection:** Hempel was making a **prescriptive** claim about the logic of explanation, not a **descriptive** claim about what historians do. A defender would say: "The fact that historians can't state the laws doesn't mean the laws aren't doing the work tacitly. It just means history is a immature science."

  ### Sentence 2
  > *"He also held that explaining and predicting come to the same thing, so the covering-law historian was committed to saying that, in principle, he had predicted the French Revolution."*

  *   **What's Accurate:** This refers to Hempel's **Structural Identity Thesis**. Hempel argued that the logical structure of an explanation (Event $\leftarrow$ Law + Conditions) is identical to a prediction (Law + Conditions $\rightarrow$ Event). The only difference is pragmatic (time orientation).
  *   **The Simplification:** The quote says "in principle," which saves it from being outright false. Hempel knew historians couldn't *actually* predict revolutions. But he insisted that if you truly *explained* it, you possessed the information that *would have allowed* a prediction.
  *   **Hempel's Objection:** A defender would say this is logically sound. If your explanation relies on a genuine universal law, that law must hold true in the future as well. If you claim to explain X but admit you couldn't have predicted X even with full data, Hempel would argue you haven't actually found the law, you've just found a pattern.

  ### Sentence 3
  > *"Danto led the reply, that historical explanation is narrative all the way down: an account explains by showing how the outcome follows from the earlier events as a story, and stories, unlike laws, are essentially about particular unrepeatable sequences."*

  *   **What's Accurate:** Arthur Danto (specifically in *Analytical Philosophy of History*, 1965) is indeed the most famous proponent of the **Narrative Model**. He argued that historical understanding comes from organizing events into a narrative structure, not subsuming them under laws.
  *   **The Simplification:** The quote says Danto "led the reply." In reality, **William Dray** (*Laws and Explanation in History*, 1957) launched the more direct philosophical attack on Hempel before Danto. Dray argued that historians often use "rational explanations" (showing an agent's reasons) that don't require empirical laws. Danto is more focused on the logic of narrative sentences (describing past events in light of future knowledge).
  *   **Substance Change:** The quote frames it as "Story vs. Law." Danto's actual argument is more subtle: he argues that narrative has its own *logic of connection* that is distinct from scientific causality. It's not just "telling a story"; it's about how narrative organizes temporal relations.

  ### Sentence 4 (The Problem Child)
  > *"The model duly collapsed, refuted by the plain observation that no working historian has ever produced a law, and virtually nobody defends it today."*

  *   **What's Accurate:** The Covering Law Model is indeed largely out of favor in the philosophy of history.
  *   **The Simplification (The "Refutation"):** This is the bit you flagged, and it is philosophically sloppy. You cannot refute a conceptual claim ("Explanation *requires* laws") with an empirical observation ("Historians haven't *found* laws").
      *   **Why it goes too fast:** Hempel could reply: "The fact that historians haven't formulated the laws yet just shows history isn't mature enough, not that the laws don't exist." To refute Hempel, you have to argue that **no such laws are possible** (e.g., because human action is free, or contexts are unique), not just that no one has written one down.
      *   **The Real Refutation:** The model collapsed because philosophers (like Dray and Mink) showed that even if you *did* find a law (e.g., "When populations are hungry, they revolt"), it would be either **false** (counter-examples exist) or **trivial** (tautological). The "plain observation" isn't the lack of laws; it's the **impossibility of non-trivial laws in human affairs.**
  *   **Hempel's Objection:** A defender would say this is a "sociological" refutation, not a logical one. Just because a community of practitioners fails to produce X doesn't prove X isn't necessary for the task they are attempting.

  ### The Current State of Play
  > *"...virtually nobody defends it today."*

  Is this defensible, or is the author tidying up?

  **It is mostly defensible, but with caveats.**

  1.  **In Philosophy of History:** The quote is correct. Almost no contemporary philosopher of *history* defends the strict Hempelian Covering Law Model. The "Narrative" turn (Danto, Mink, White) and the "Practical Reason" turn (Dray, Von Wright) won the day.
  2.  **In Philosophy of Social Science:** It is less accurate. There is a resurgence of **Analytical Sociology** and **Rational Choice Theory** that looks very Hempelian. Scholars like Peter Hedström or Jon Elster argue for "mechanism-based explanations" which are essentially sophisticated covering laws. They want social science to be law-like.
  3.  **In History Departments:** The quote is accurate. If you proposed a Covering Law explanation in a modern history seminar, you would be laughed out of the room.

  ### Verdict

  The passage is **fair as journalism, but unfair as philosophy.**

  *   **Fair:** It correctly identifies the protagonists (Hempel vs. Danto), the core concepts (Laws vs. Narrative), and the ultimate outcome (Hempel lost).
  *   **Unfair:** It treats a deep conceptual debate about the nature of rationality and time as a simple empirical failure ("no one produced a law"). It ignores the "explanation sketch" defense. It credits Danto with arguments that belonged partly to Dray.

  **Your suspicion was correct:** The claim that it was "refuted by the plain observation that no working historian has ever produced a law" is the weak link. It confuses the *failure to find* something with the *impossibility* of that thing. The model wasn't refuted because historians didn't have laws; it was refuted because philosophers demonstrated that **historical explanation works perfectly well without them.**

  If you want to read the actual "refutation" rather than the trade-press summary, look at **William Dray's *Laws and Explanation in History* (1957)**. He is the one who actually dismantled the logical necessity of the law, rather than just pointing out that historians don't have any.
