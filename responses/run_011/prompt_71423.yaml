answer: |-
  Your intuition is sharp, and the parallel you draw between Hume's "interval" and the modern inflation-targeting regime is philosophically fertile. It cuts through the technical apparatus to the ontological commitments beneath. However, while the *conclusion* of modern practice (money is not neutral in the short run) aligns with Hume, the *mechanism* and the *teleology* diverge significantly. To answer your question, we must reconstruct the implicit theory of the central bank, measure it against Hume, and test its coherence.

  ### 1. The Implicit Theory of Two-Per-Cent Targeting

  The practice you describe presupposes a specific synthesis often termed the "New Consensus" in macroeconomics, though philosophically it is a hybrid of Old Keynesian rigidities and Monetarist long-run properties. Its core axioms are:

  1.  **Short-Run Non-Neutrality:** Prices and wages are "sticky." They do not adjust instantaneously to changes in monetary conditions. Therefore, changes in the nominal interest rate (the price of money) affect real variables (output, employment) in the short to medium term.
  2.  **Long-Run Neutrality:** In the long run, prices and wages become flexible. Money is a veil; it determines the price level but not real output. This is why the target is a *rate of change* of prices, not a target for output. The central bank accepts it cannot permanently raise growth, only stabilize the path toward it.
  3.  **Endogenous Velocity:** The relation between the monetary base and the price level is not fixed (rejecting strict Quantity Theory). Velocity is unstable and driven by expectations and financial innovation. This explains why quantitative expansion (QE) post-2008 did not cause inflation: velocity collapsed as banks hoarded reserves.
  4.  **Expectations as the Transmission Mechanism:** Because the link between base money and prices is broken, the central bank steers the economy by managing *expectations* of future policy. Forward guidance works not by altering the current quantity of money, but by altering the intertemporal calculations of households and firms.

  Therefore, the theory presupposes that money is a **social institution of account** whose value is determined by the credibility of the issuer's commitment to a future path, rather than a **commodity stock** whose value is determined by its current scarcity relative to goods.

  ### 2. Rival Accounts: Excluded and Compatible

  This framework is selective. It quietly excludes several rival ontologies while maintaining an "overlapping consensus" that masks foundational disagreements.

  **Excluded Views:**
  *   **Strict Quantity Theory (Monetarism):** A strict Friedmanite view, where velocity is stable and the money stock determines prices in a determinate proportion, is ruled out by the instrument choice. If strict quantity theory held, central banks would target monetary aggregates (M3, M4) rather than interest rates. The failure of aggregates to predict inflation post-2008 cemented this exclusion.
  *   **Real Bills Doctrine:** The view that money should expand automatically to meet the needs of trade is excluded. The central bank asserts the right to constrain credit even if trade demands it (to fight inflation) or expand it when trade is slack (to fight recession). It is a management regime, not a passive accommodation.
  *   **Immediate Classical Neutrality:** The view that money is neutral at *every* horizon is excluded. If this were true, inflation targeting would be pointless noise; the central bank could not influence employment or output gaps by adjusting rates.

  **Compatible but Inconsistent Views:**
  *   **The Keynesian:** Endorses the target because sticky wages make deflation dangerous (debt deflation spiral). For them, the 2% buffer is insurance against the Zero Lower Bound.
  *   **The Monetarist:** May endorse the target as a proxy for "stable money," but views the interest rate instrument as distortionary. They tolerate the practice but distrust the mechanism.
  *   **The New Classical:** Accepts long-run neutrality but argues short-run non-neutrality only exists due to *unexpected* inflation (Lucas Supply Curve). Since inflation targeting aims to make inflation *expected* and stable, a strict New Classical theorist would argue the policy eliminates the very stimulus it claims to manage.

  Thus, consensus on the *number* (2%) masks a divergence on *why*. The Keynesian wants the buffer to avoid a trap; the Monetarist wants stability to reduce noise; the Classical tolerates it as a harmless nominal anchor.

  ### 3. Is the Practice Coherent?

  You ask if the practice is an assertion of long-run neutrality bolted onto short-run non-neutrality. **Yes, it is precisely that.** Whether this is a contradiction or a synthesis depends on the time horizon of the "bolt."

  The coherence relies on the stability of the Phillips Curve relationship (the trade-off between inflation and unemployment). The system is coherent if the central bank can manipulate short-run non-neutrality to stabilize output without destabilizing long-run expectations.

  However, there is a tension in the instrument migration you noted. The central bank controls a *price* (the interest rate) to target a *rate of change* (inflation), having abandoned the *quantity* (money stock). This implies a theory where the demand for money is unstable. The coherence of this rests entirely on **credibility**. If agents believe the bank will hit 2%, they set prices accordingly, and the bank hits 2% with minimal effort. If credibility breaks, the bank loses control because it has no direct lever on the price level, only on the cost of borrowing.

  The decade post-2008 (high base money, low inflation) followed by 2021-22 (surprise inflation) suggests the theory holds only conditionally: it works when velocity is stable or predictable. When velocity becomes erratic (due to financial fragmentation or supply shocks), the "price" instrument struggles. The shift to "Average Inflation Targeting" (making up past misses) is an admission that the simple forward-looking model failed; it attempts to bind the bank's hands to restore the expectations mechanism.

  ### 4. Hume's Interval: Mechanism or Redescription?

  Here we must press hardest on your reading. You suggest inflation targeting is the "institutionalisation of Hume's interval."

  **Where you are right:** Both Hume and the modern central bank reject the idea that money is a neutral veil in the short run. Both agree that a diminishing stock of money (deflation) is economically destructive ("bad for the same reason in reverse," as you put it). Both see value in a gently expanding nominal environment to facilitate adjustment.

  **Where the analogy is hollow:**
  Hume's mechanism is **distributional and sequential** (what we now call Cantillon Effects). New money enters at specific points (merchants), raising their profits before it raises wages. The stimulus comes from the *unevenness* of the price adjustment.
  Modern inflation targeting relies on **intertemporal substitution and expectations**. The stimulus comes from lowering the real interest rate to encourage consumption *now* rather than *later*, or from preventing the real debt burden from rising via deflation. Crucially, modern policy aims for *anchored expectations*. If the 2% target is fully credible, the inflation is *anticipated*.

  For Hume, the benefit lies in the **surprise** of the inflation (the gap between money arrival and price adjustment). For the modern central bank, the benefit lies in the **certainty** of the inflation (avoiding the ZLB and allowing real wage cuts without nominal cuts).

  Therefore, the practice is not built *out* of Hume's mechanism. If central banks successfully anchored expectations at 2%, the Humean "interval" (the surprise profit boost) should theoretically vanish. The practice is a **functional equivalent** of Hume's conclusion (avoid deflation, allow nominal flexibility) achieved through a different mechanism (expectations management rather than sequential injection). It is a Humean *outcome* without the Humean *process*.

  Furthermore, Hume's system relied on an international specie-flow mechanism that was self-correcting. You correctly note that in a fiat system, there is no automatic adjustment. The "self-regulating process" has indeed been replaced by "something that only works insofar as people believe it does." This makes the modern system more fragile than Hume's. Hume's gold standard constrained the magistrate; the fiat magistrate is constrained only by their own reputation.

  ### 5. Counterfactuals: What if the Theory Changes?

  **Scenario A: Serious Long-Run Neutrality (Super-Neutrality)**
  If evidence mounted that even 2% inflation permanently reduced potential output (e.g., by distorting investment signals), the theoretical justification for the buffer would collapse.
  *   *Change in Practice:* The target would move to 0%. To handle the Zero Lower Bound, central banks would likely move to explicit Nominal GDP targeting or negative interest rates on cash (abolishing the zero bound). The "buffer" would be acknowledged as too costly.

  **Scenario B: No Stable Relation (Instability)**
  If the post-2008 decade is not an anomaly but the new normal—meaning the central bank's operations have no predictable relation to the price level because velocity is structurally broken or dominated by fiscal policy—then Inflation Targeting is an illusion.
  *   *Change in Practice:* This implies the Fiscal Theory of the Price Level dominates. Central banks would lose independence. Monetary policy would become subordinate to debt management. We might see a shift to Price Level Targeting (committing to a path, not a rate) to force expectations, or a move to Central Bank Digital Currencies to regain direct control over the quantity of money, effectively reverting to a form of Quantity Theory by fiat.

  ### 6. Confidence and Uncertainty

  **Confidence Level:** High on the description of central banking practice and the theoretical commitments of the "New Consensus." Moderate-High on the philosophical coherence of the hybrid model.

  **The Point of Least Certainty:**
  I am least certain about your characterization of **Hume's policy prescription**. You write: *"the wise magistrate tries to keep the stock of money increasing precisely in order to keep that transitional advantage running."*

  While Hume certainly argues that an increasing money supply is beneficial *during the transition* and that deflation is harmful, it is debatable whether he advocates for a *permanent, engineered state of monetary disequilibrium* as a policy goal. Hume's ideal seems to be a money stock that grows *in proportion* to industry to maintain stability, rather than a deliberate inflation target to exploit the interval. He praises the increase of money because it accompanies the growth of industry, not necessarily because he wishes to decouple them to manufacture stimulus.

  If Hume believes the "interval" is a temporary side-effect of growth, but modern central banks treat the "interval" (inflation) as the *primary tool* to generate growth, then the analogy is deeper but also more perverse: modern policy attempts to harvest the shadow of the horse (inflation) hoping it will pull the cart (industry), whereas Hume thought the shadow merely followed the horse. If this reading is correct, the modern practice is not just an institutionalization of Hume's interval, but a fundamental inversion of his causality. This is the hinge on which your entire comparison turns, and it rests on the exegesis of Hume's normative claims rather than his positive analysis.
